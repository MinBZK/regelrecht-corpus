        artikel: '14'
  - number: '2'
    text: |-
      1 Waar iemand woont, wordt naar de feitelijke omstandigheden beoordeeld, voor zover in de volgende leden niet
      anders is bepaald.

      2 Degenen, die de openbare lichamen Bonaire, Sint Eustatius of Saba als woonplaats verlaten, maar binnen een
      jaar zich daar opnieuw vestigen, worden geacht ook tijdens hun afwezigheid in de openbare lichamen Bonaire,
      Sint Eustatius of Saba te hebben gewoond, tenzij blijkt, dat zij tijdens hun afwezigheid op het grondgebied van
      Nederland, Aruba, Curaçao, Sint Maarten of van een andere Mogendheid hebben gewoond.

      3 Degenen, die tijdelijk binnen de openbare lichamen Bonaire, Sint Eustatius of Saba verblijven, maar hetzij
      Nederland, Aruba Curaçao of Sint Maarten als woonplaats hebben, hetzij geacht worden daar te wonen op grond van
      de daar geldende wetgeving inzake de inkomstenbelasting, worden als niet binnen de openbare lichamen Bonaire, Sint
      Eustatius of Saba wonend beschouwd, indien hun verblijf minder dan een jaar duurt.

      4 Onze Minister kan bepalen dat schepen en luchtvaartuigen, die binnen de openbare lichamen Bonaire, Sint Eustatius
      of Saba hun thuishaven hebben, voor zover het de woonplaats van de bemanning betreft, als deel van de openbare
      lichamen Bonaire, Sint Eustatius of Saba worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel2
  - number: '3'
    text: Voor de toepassing van deze wet wordt met overlijden gelijk gesteld vermoedelijk overlijden.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel3
  - number: 3a
    text: De bepalingen van deze wet voor weduwen zijn van overeenkomstige toepassing op weduwnaars.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel3a
  - number: '4'
    text: |-
      1 Onze Minister is belast met de uitvoering van deze wet, met dien verstande, dat de heffing van de premie
      geschiedt door de inspecteur en de invordering daarvan door de ontvanger.

      2 Voor zover de uitvoering van de in deze wet geregelde verzekering geschiedt door Onze Minister, kunnen bij
      algemene maatregel van bestuur nadere regels worden gesteld voor de te voeren administratie en de registratie van
      de verzekerden.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel4
  - number: '6'
    text: |-
      1 Verzekerd op grond van de bepalingen van deze wet is degene, die de leeftijd van 15 jaar heeft bereikt, indien
      hij:

      a. ingezetene is;

      b. geen ingezetene is, doch wiens zuiver inkomen geheel of nagenoeg geheel binnen de openbare lichamen Bonaire,
      Sint Eustatius of Saba aan de heffing van inkomstenbelasting of loonbelasting is onderworpen;

      c. geen ingezetene is en evenmin geacht kan worden blijvend buiten de openbare lichamen Bonaire, Sint Eustatius of
      Saba te wonen, maar voor buiten de openbare lichamen Bonaire, Sint Eustatius of Saba verrichte arbeid wedde of loon
      geniet ten laste van de openbare lichamen Bonaire, Sint Eustatius of Saba of Curaçao, Aruba of Sint Maarten, mits
      hij Nederlander is.

      2 Niet verzekerd is degene, die niet geacht kan worden blijvend binnen de openbare lichamen Bonaire, Sint Eustatius
      en Saba te wonen en die terzake van binnen de openbare lichamen Bonaire, Sint Eustatius en Saba verrichte arbeid
      wedde of loon geniet ten laste van Nederland, Aruba, Curaçao, Sint Maarten of van een andere Mogendheid.

      3 Bij algemene maatregel van bestuur kunnen personen die niet op grond van het eerste lid zijn verzekerd als
      verzekerden op grond van deze wet worden aangemerkt.

      4 Bij algemene maatregel van bestuur kan van het eerste lid worden afgeweken:

      a. ten aanzien van vreemdelingen;

      b. ten aanzien van personen, op wie een overeenkomstige regeling buiten de de openbare lichamen Bonaire, Sint
      Eustatius of Saba van toepassing is;

      c. ten aanzien van personen die tijdelijk op Bonaire, Sint Eustatius of Saba verblijven of tijdelijke werkzaamheden
      op Bonaire, Sint Eustatius of Saba verrichten;

      d. ten aanzien van echtgenoten en overige gezinsleden van de in het tweede lid en in de onderdelen a, b en c
      bedoelde personen.

      5 Indien een verzekerde ophoudt verzekerde te zijn, eindigt zijn verzekering voor wat de aanspraken op weduwen-
      en wezenpensioen betreft, voor zover niet reeds een overeenkomstige regeling buiten de openbare lichamen Bonaire,
      Sint Eustatius of Saba op hem van toepassing is, niet eerder dan zes weken na de dag met ingang van welke hij heeft
      opgehouden verzekerde te zijn.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel6
  - number: '7'
    text: |-
      De weduwe van een verzekerde heeft, zolang zij de leeftijd waarop recht op ouderdomspensioen ontstaat op grond
      van de [Wet algemene ouderdomsverzekering BES][ref1] niet bereikt heeft, recht op een weduwenpensioen op grond van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028459
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028459
  - number: '8'
    text: |-
      1 Geen recht op weduwenpensioen heeft de weduwe:

      a. wier echtgenoot vóór het bereiken van de leeftijd waarop recht op ouderdomspensioen ontstaat op grond van de
      [Wet algemene ouderdomsverzekering BES][ref1] nimmer verzekerd is geweest;

      b. wier echtgenoot op de dag van de huwelijkssluiting de leeftijd waarop recht op ouderdomspensioen ontstaat
      op grond van de [Wet algemene ouderdomsverzekering BES][ref2] had bereikt of overschreden, tenzij de weduwe met
      deze echtgenoot, vóórdat hij de leeftijd waarop recht op ouderdomspensioen ontstaat op grond van de Wet algemene
      ouderdomsverzekering BES had bereikt, reeds eerder gehuwd is geweest;

      c. die veroordeeld is terzake van het ombrengen van haar echtgenoot;

      d. die een uitreiziger is.

      2 Het bepaalde in het voorgaande lid onder a en b blijft buiten toepassing, indien de weduwe, indien zij niet was
      hertrouwd, recht op weduwenpensioen zou hebben.

      3 Voor de weduwe, bedoeld in het eerste lid, onderdeel d, herleeft, onverminderd de bepalingen van deze wet, het
      recht op weduwenpensioen op de dag dat niet langer het gegronde vermoeden bestaat dat zij zich buiten de openbare
      lichamen Bonaire, Sint Eustatius en Saba bevindt met het doel zich aan te sluiten bij een organisatie als bedoeld
      in [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028459
      [ref2]: https://wetten.overheid.nl/BWBR0028459
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel14
