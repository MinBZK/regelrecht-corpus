  - number: '35'
    text: |-
      1 De gepensioneerde en zijn wettelijke vertegenwoordiger of het orgaan waaraan op grond van [artikel 17][ref1]
      pensioen wordt uitbetaald, zijn verplicht aan Onze Minister op zijn verzoek of onverwijld uit eigen beweging alle
      feiten en omstandigheden mee te delen, waarvan hun redelijkerwijs duidelijk moet zijn dat die van invloed kunnen
      zijn op het recht op pensioen, de hoogte van het pensioen of op het bedrag van het pensioen dat wordt betaald.

      2 De verplichting, bedoeld in het eerste lid, geldt niet indien feiten en omstandigheden door Onze Minister
      kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens of kan worden
      verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële regeling kan worden bepaald
      voor welke gegevens de vorige zin van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel17
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel35
    references:
