  - number: '10'
    text: |-
      Geen recht op wezenpensioen bestaat indien de verzekerde aan wiens overlijden het recht daarop zou worden
      ontleend vóór het bereiken van de leeftijd waarop recht op ouderdomspensioen ontstaat op grond van de
      [Wet algemene ouderdomsverzekering BES][ref1] nimmer verzekerd is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0028459
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028459
  - number: 10a
    text: |-
      1 Geen recht op een wezenuitkering heeft degene die een uitreiziger is.

      2 Voor de persoon, bedoeld in het eerste lid, herleeft, onverminderd de bepalingen van deze wet, het recht op een
      wezenuitkering op de dag dat niet langer het gegronde vermoeden bestaat dat hij zich buiten de openbare lichamen
      Bonaire, Sint Eustatius en Saba bevindt met het doel zich aan te sluiten bij een organisatie als bedoeld in
      [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel10a
