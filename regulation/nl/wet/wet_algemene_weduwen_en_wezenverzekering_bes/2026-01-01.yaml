  - number: '9'
    text: |-
      1 Op grond van deze wet hebben, zolang zij de leeftijd van 15 jaar niet hebben bereikt, recht op wezenpensioen:

      a. na het overlijden van een verzekerde man: de kinderen tot wie hij in familierechtelijke betrekking stond alsmede
      de door hem verwekte kinderen tot wie hij niet in familierechtelijke betrekking stond die als gevolg van zijn
      overlijden vaderloos zijn geworden;

      b. na het overlijden van een verzekerde vrouw: haar eigen kinderen, die als gevolg van haar overlijden moederloos
      zijn geworden;

      c. na het overlijden van een verzekerde man: de kinderen tot wie hij in familierechtelijke betrekking stond alsmede
      de door hem verwekte kinderen tot wie hij niet in familierechtelijke betrekking stond die als gevolg van zijn
      overlijden ouderloos zijn geworden;

      d. na het overlijden van een verzekerde vrouw: haar eigen kinderen, die als gevolg van haar overlijden ouderloos
      zijn geworden.

      2 Ingeval van kinderen tot wie de verzekerde vader niet in familierechtelijke betrekking stond is het eerste lid,
      onderdelen a en c, van toepassing indien:

      a. de verzekerde vader ten tijde van zijn overlijden onderhoudsplicht op grond van
      [artikel 394 van Boek 1 van het Burgerlijk Wetboek BES][ref1] is opgelegd, dan wel door hem bij authentieke akte
      onderhoudsplicht is erkend; of

      b. zij in een gezinsverband met de overleden verzekerde man samen leefden.

      3 Kinderen zonder familierechtelijke betrekkingen met een vader die niet aangemerkt kunnen worden als kinderen
      als bedoeld in het tweede lid worden gelijkgesteld met kinderen die als gevolg van het overlijden van de moeder
      ouderloos zijn geworden, voor zolang geen wijziging van omstandigheden heeft plaatsgevonden.

      4 Onze Minister kan bepalen dat met kinderen als bedoeld in het eerste lid worden gelijkgesteld kinderen, die
      nog geen 15 jaar oud zijn, die ouderloos zijn of wier ouders onbekend zijn of in geval het kinderen zonder
      familierechtelijke betrekkingen met een vader betreft, wier moeder is overleden en over wie de overleden verzekerde
      de pleegouderlijke zorg uitoefende.

      5 Op grond van deze wet hebben, zolang zij de leeftijd van 25 jaar niet hebben bereikt, recht op wezenpensioen zij
      die de leeftijd van 15 jaar reeds hebben bereikt, doch overigens voldoen aan het eerste lid, indien:

      a. hun tijd behoudens in geval van ziekte of vakantie geheel of grotendeels in beslag wordt genomen door of in
      verband met het volgen van onderwijs of van een beroepsopleiding;

      b. zij ten gevolge van ziekte of gebreken blijvend buiten staat zijn om met arbeid, die voor hun krachten is
      berekend één derde te verdienen van hetgeen lichamelijk en geestelijk gezonde kinderen van gelijke leeftijd en van
      soortgelijke bekwaamheid in staat zijn met arbeid te verdienen.

      6 De kinderen tot wie de verzekerde man niet in familierechtelijke betrekking stond, bedoeld in het tweede lid,
      onderdeel b, hebben recht op wezenpensioen indien de wettelijke vertegenwoordiger van voornoemde kinderen ten
      genoegen van Onze Minister schriftelijk heeft aangetoond dat deze kinderen in een gezinsverband met de overleden
      verzekerde man samen leefden.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel394
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel9
