  - number: '18'
    text: |-
      De termijnen van het pensioen, welke niet zijn ingevorderd binnen twee jaar na de eerste dag waarop zij konden
      worden ingevorderd worden niet uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel18
  - number: '19'
    text: |-
      1 Onverminderd het elders in deze wet bepaalde eindigt het recht op pensioen:

      a. door overlijden;

      b. voor wat de weduwe betreft tevens door hertrouwen.

      2 De uitbetaling van het pensioen eindigt met ingang van de maand volgende op de maand, waarin het feit heeft
      plaatsgevonden of de omstandigheid is ontstaan, waardoor het recht op pensioen is geëindigd.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel19
  - number: '20'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel20
  - number: '21'
    text: |-
      1 Na het overlijden van degene, aan wie een pensioen is toegekend, wordt het pensioen tot en met de laatste dag van
      de maand waarin het overlijden heeft plaatsgevonden, uitbetaald aan de persoon of personen, die daarvoor naar het
      oordeel van Onze Minister op billijkheidsoverwegingen in aanmerking komt, dan wel komen, mits deze daartoe binnen
      zes maanden na het overlijden een verzoek bij Onze Minister heeft, dan wel hebben ingediend.

      2 Na het overlijden van degene, aan wie een pensioen is toegekend, wordt een bedrag ineens, gelijk aan driemaal
      het aan de overledene toegekende pensioen, uitbetaald aan de persoon of personen, die daarvoor naar het oordeel van
      Onze Minister op billijkheidsoverwegingen in aanmerking komt, dan wel komen, mits deze daartoe binnen zes maanden
      na het overlijden een verzoek bij Onze Minister heeft, dan wel hebben ingediend. Onze Minister is bevoegd de
      uitkering op een lager bedrag vast te stellen.

      3 De uitkering wordt betaalbaar gesteld in de maand volgende op die, waarin waarin een verzoek daartoe is
      ingediend.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel21
  - number: '22'
    text: |-
      Aan de weduwe, bedoeld in [artikel 19, eerste lid, onderdeel b][ref1], wordt een uitkering ineens verleend ter
      grootte van het bedrag, dat haar aan weduwenpensioen zou toekomen, indien zij niet was hertrouwd, doch ten hoogste
      ter grootte van het jaarbedrag van het weduwenpensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel19
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel22
