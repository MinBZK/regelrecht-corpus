  - number: '37'
    text: |-
      1 Publiekrechtelijke lichamen zijn verplicht kosteloos hun medewerking te verlenen tot het verkrijgen van de
      inlichtingen, benodigd voor de uitvoering van deze wet.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel37
  - number: 37a
    text: |-
      1 Bij ministeriële regeling kunnen controlevoorschriften worden vastgesteld. Deze voorschriften gaan niet verder
      dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.

      2 De gepensioneerde, zijn wettelijke vertegenwoordiger of het orgaan waaraan op grond van [artikel 17][ref1]
      pensioen wordt uitbetaald, zijn verplicht de voorschriften op te volgen en anderszins aan Onze Minister desgevraagd
      de medewerking te verlenen die redelijkerwijs nodig is voor de uitvoering van deze wet. Gelijke verplichting geldt
      voor de wettelijke vertegenwoordiger van het kind dat recht heeft op wezenpensioen en de persoon, aan wie op grond
      van [artikel 16][ref2], tweede lid, het wezenpensioen betaalbaar wordt gesteld.

      3 De gepensioneerde, zijn wettelijke vertegenwoordiger, de wettelijke vertegenwoordiger van het kind dat recht
      heeft op wezenpensioen en de persoon, bedoeld in [artikel 16, tweede lid][ref3] onthouden zich van zeer ernstige
      misdragingen jegens de met de uitvoering van deze wet belaste personen en instanties tijdens het verrichten van
      hun werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0028387#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0028387#Artikel16
