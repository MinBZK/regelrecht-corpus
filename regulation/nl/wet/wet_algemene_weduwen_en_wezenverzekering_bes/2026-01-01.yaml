  - number: '24'
    text: |-
      1 Behoudens het bepaalde in het volgende lid zijn de eenmaal uitbetaalde termijnen van het pensioen niet vatbaar
      voor terugvordering.

      2 Hetgeen ten onrechte aan pensioen is uitbetaald kan worden teruggevorderd dan wel op latere pensioenbetalingen
      in mindering worden gebracht, wanneer het ten onrechte uitbetalen het gevolg is van het niet verstrekken van
      inlichtingen of het verstrekken van onjuiste inlichtingen door degene aan wie het pensioen is toegekend, door diens
      wettelijke vertegenwoordiger of door degene aan wie het pensioen is uitbetaald.

      3 Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven ter uitvoering van dit artikel;
      daarbij kunnen tevens regels worden gesteld met betrekking tot schorsing en opschorting van de uitbetaling van
      het pensioen.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel24
  - number: 24a
    text: |-
      1 Onze Minister is bevoegd om op grond van verdragen, convenanten en andersoortige overeenkomsten met uitvoerders
      van instellingen van sociale voorzieningen, het pensioen van een gerechtigde te verminderen ter ontneming van een
      ten onrechte verkregen voordeel van de gerechtigde op het gebied van sociale voorzieningen.

      2 Onze Minister is eveneens bevoegd om het pensioen van een gerechtigde te verminderen ter ontneming van een
      ten onrechte verkregen voordeel van de gerechtigde op het gebied van de door Onze Minister uitgevoerde sociale
      verzekeringswetten.

      3 De in het eerste en tweede lid bedoelde vermindering kan ineens geschieden indien het ten onrechte genoten
      voordeel niet groter is dan een derde deel van het door Onze Minister verstrekte weduwen- en wezenpensioen. In alle
      andere gevallen kan de vermindering niet meer bedragen dan een derde deel van het weduwen- of wezenpensioen.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel24a
  - number: '26'
    text: |-
      1 Ter zake van de kosten verbonden aan deze wet is door de verzekerden een premie verschuldigd.

      2 Aan de heffing van premie is niet onderworpen:

      a. de verzekerde, die de leeftijd waarop recht op ouderdomspensioen ontstaat op grond van de
      [Wet algemene ouderdomsverzekering BES][ref1] heeft bereikt;

      b. de gehuwde man wiens echtgenote in verband met het bepaalde in
      [artikel 41, tweede lid, onderdeel c, van de Wet algemene ouderdomsverzekering BES][ref2] recht op ouderdompensioen
      heeft.

      3 De premie komt ten gunste van het Rijk.

      4 De op grond van deze wet uit te keren pensioenen en de aan de uitvoering van deze wet verbonden kosten komen ten
      laste van het Rijk


