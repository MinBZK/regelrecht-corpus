---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_algemene_weduwen_en_wezenverzekering_bes
regulatory_layer: WET
publication_date: '2025-02-19'
valid_from: '2017-01-01'
bwb_id: BWBR0028387
url: https://wetten.overheid.nl/BWBR0028387/2017-01-01
articles:
  - number: '1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel1
  - number: 1.a
    text: '*Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel1
  - number: 1.b
    text: '*ingezetene:* degene die in de openbare lichamen Bonaire, Sint Eustatius of Saba woont;'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel1
  - number: 1.c
    text: '*inspecteur:* de bij regeling van Onze Minister van Financiën als zodanig aangewezen functionaris;'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel1
  - number: 1.d
    text: '*ontvanger:* de bij regeling van Onze Minister van Financiën als zodanig aangewezen functionaris.'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel1
  - number: '2.1'
    text: |-
      Waar iemand woont, wordt naar de feitelijke omstandigheden beoordeeld, voor zover in de volgende leden niet anders
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel2
  - number: '2.2'
    text: |-
      Degenen, die de openbare lichamen Bonaire, Sint Eustatius of Saba als woonplaats verlaten, maar binnen een
      jaar zich daar opnieuw vestigen, worden geacht ook tijdens hun afwezigheid in de openbare lichamen Bonaire,
      Sint Eustatius of Saba te hebben gewoond, tenzij blijkt, dat zij tijdens hun afwezigheid op het grondgebied van
      Nederland, Aruba, Curaçao, Sint Maarten of van een andere Mogendheid hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel2
  - number: '2.3'
    text: |-
      Degenen, die tijdelijk binnen de openbare lichamen Bonaire, Sint Eustatius of Saba verblijven, maar hetzij
      Nederland, Aruba Curaçao of Sint Maarten als woonplaats hebben, hetzij geacht worden daar te wonen op grond van
      de daar geldende wetgeving inzake de inkomstenbelasting, worden als niet binnen de openbare lichamen Bonaire, Sint
      Eustatius of Saba wonend beschouwd, indien hun verblijf minder dan een jaar duurt.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel2
  - number: '2.4'
    text: |-
      Onze Minister kan bepalen dat schepen en luchtvaartuigen, die binnen de openbare lichamen Bonaire, Sint Eustatius
      of Saba hun thuishaven hebben, voor zover het de woonplaats van de bemanning betreft, als deel van de openbare
      lichamen Bonaire, Sint Eustatius of Saba worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel2
  - number: '3'
    text: Voor de toepassing van deze wet wordt met overlijden gelijk gesteld vermoedelijk overlijden.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel3
  - number: 3a
    text: De bepalingen van deze wet voor weduwen zijn van overeenkomstige toepassing op weduwnaars.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel3a
  - number: '4.1'
    text: |-
      Onze Minister is belast met de uitvoering van deze wet, met dien verstande, dat de heffing van de premie geschiedt
      door de inspecteur en de invordering daarvan door de ontvanger.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel4
  - number: '4.2'
    text: |-
      Voor zover de uitvoering van de in deze wet geregelde verzekering geschiedt door Onze Minister, kunnen bij
      algemene maatregel van bestuur nadere regels worden gesteld voor de te voeren administratie en de registratie van
      de verzekerden.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel4
  - number: '6.1'
    text: 'Verzekerd op grond van de bepalingen van deze wet is degene, die de leeftijd van 15 jaar heeft bereikt, indien hij:'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel6
  - number: 6.1.a
    text: ingezetene is;
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel6
  - number: 6.1.b
    text: |-
      geen ingezetene is, doch wiens zuiver inkomen geheel of nagenoeg geheel binnen de openbare lichamen Bonaire, Sint
      Eustatius of Saba aan de heffing van inkomstenbelasting of loonbelasting is onderworpen;
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel6
  - number: 6.1.c
    text: |-
      geen ingezetene is en evenmin geacht kan worden blijvend buiten de openbare lichamen Bonaire, Sint Eustatius of
      Saba te wonen, maar voor buiten de openbare lichamen Bonaire, Sint Eustatius of Saba verrichte arbeid wedde of loon
      geniet ten laste van de openbare lichamen Bonaire, Sint Eustatius of Saba of Curaçao, Aruba of Sint Maarten, mits
      hij Nederlander is.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel6
  - number: '6.2'
    text: |-
      Niet verzekerd is degene, die niet geacht kan worden blijvend binnen de openbare lichamen Bonaire, Sint Eustatius
      en Saba te wonen en die terzake van binnen de openbare lichamen Bonaire, Sint Eustatius en Saba verrichte arbeid
      wedde of loon geniet ten laste van Nederland, Aruba, Curaçao, Sint Maarten of van een andere Mogendheid.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel6
  - number: '6.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen personen die niet op grond van het eerste lid zijn verzekerd als
      verzekerden op grond van deze wet worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel6
  - number: '6.4'
    text: 'Bij algemene maatregel van bestuur kan van het eerste lid worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel6
  - number: 6.4.a
    text: ten aanzien van vreemdelingen;
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel6
  - number: 6.4.b
    text: |-
      ten aanzien van personen, op wie een overeenkomstige regeling buiten de de openbare lichamen Bonaire, Sint
      Eustatius of Saba van toepassing is;
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel6
  - number: 6.4.c
    text: |-
      ten aanzien van personen die tijdelijk op Bonaire, Sint Eustatius of Saba verblijven of tijdelijke werkzaamheden op
      Bonaire, Sint Eustatius of Saba verrichten;
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel6
  - number: 6.4.d
    text: |-
      ten aanzien van echtgenoten en overige gezinsleden van de in het tweede lid en in de onderdelen a, b en c bedoelde
      personen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel6
  - number: '6.5'
    text: |-
      Indien een verzekerde ophoudt verzekerde te zijn, eindigt zijn verzekering voor wat de aanspraken op weduwen- en
      wezenpensioen betreft, voor zover niet reeds een overeenkomstige regeling buiten de openbare lichamen Bonaire,
      Sint Eustatius of Saba op hem van toepassing is, niet eerder dan zes weken na de dag met ingang van welke hij heeft
      opgehouden verzekerde te zijn.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel6
  - number: '7'
    text: |-
      De weduwe van een verzekerde heeft, zolang zij de leeftijd waarop recht op ouderdomspensioen ontstaat op grond
      van de [Wet algemene ouderdomsverzekering BES][ref1] niet bereikt heeft, recht op een weduwenpensioen op grond van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028459
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028459
  - number: '8.1'
    text: 'Geen recht op weduwenpensioen heeft de weduwe:'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel8
  - number: 8.1.a
    text: |-
      wier echtgenoot vóór het bereiken van de leeftijd waarop recht op ouderdomspensioen ontstaat op grond van de
      [Wet algemene ouderdomsverzekering BES][ref1] nimmer verzekerd is geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0028459
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028459
  - number: 8.1.b
    text: |-
      wier echtgenoot op de dag van de huwelijkssluiting de leeftijd waarop recht op ouderdomspensioen ontstaat op
      grond van de [Wet algemene ouderdomsverzekering BES][ref1] had bereikt of overschreden, tenzij de weduwe met
      deze echtgenoot, vóórdat hij de leeftijd waarop recht op ouderdomspensioen ontstaat op grond van de Wet algemene
      ouderdomsverzekering BES had bereikt, reeds eerder gehuwd is geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0028459
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028459
  - number: 8.1.c
    text: die veroordeeld is terzake van het ombrengen van haar echtgenoot.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel8
  - number: '8.2'
    text: |-
      Het bepaalde in het voorgaande lid onder a en b blijft buiten toepassing, indien de weduwe, indien zij niet was
      hertrouwd, recht op weduwenpensioen zou hebben.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel8
  - number: '9.1'
    text: 'Op grond van deze wet hebben, zolang zij de leeftijd van 15 jaar niet hebben bereikt, recht op wezenpensioen:'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel9
  - number: 9.1.a
    text: |-
      na het overlijden van een verzekerde man: de kinderen tot wie hij in familierechtelijke betrekking stond alsmede
      de door hem verwekte kinderen tot wie hij niet in familierechtelijke betrekking stond die als gevolg van zijn
      overlijden vaderloos zijn geworden;
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel9
  - number: 9.1.b
    text: |-
      na het overlijden van een verzekerde vrouw: haar eigen kinderen, die als gevolg van haar overlijden moederloos
      zijn geworden;
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel9
  - number: 9.1.c
    text: |-
      na het overlijden van een verzekerde man: de kinderen tot wie hij in familierechtelijke betrekking stond alsmede
      de door hem verwekte kinderen tot wie hij niet in familierechtelijke betrekking stond die als gevolg van zijn
      overlijden ouderloos zijn geworden;
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel9
  - number: 9.1.d
    text: |-
      na het overlijden van een verzekerde vrouw: haar eigen kinderen, die als gevolg van haar overlijden ouderloos zijn
      geworden.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel9
  - number: '9.2'
    text: |-
      Ingeval van kinderen tot wie de verzekerde vader niet in familierechtelijke betrekking stond is het eerste lid,
      onderdelen a en c, van toepassing indien:
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel9
  - number: 9.2.a
    text: |-
      de verzekerde vader ten tijde van zijn overlijden onderhoudsplicht op grond van
      [artikel 394 van Boek 1 van het Burgerlijk Wetboek BES][ref1] is opgelegd, dan wel door hem bij authentieke akte
      onderhoudsplicht is erkend; of


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel394
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028743
        artikel: '394'
  - number: 9.2.b
    text: zij in een gezinsverband met de overleden verzekerde man samen leefden.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel9
  - number: '9.3'
    text: |-
      Kinderen zonder familierechtelijke betrekkingen met een vader die niet aangemerkt kunnen worden als kinderen
      als bedoeld in het tweede lid worden gelijkgesteld met kinderen die als gevolg van het overlijden van de moeder
      ouderloos zijn geworden, voor zolang geen wijziging van omstandigheden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel9
  - number: '9.4'
    text: |-
      Onze Minister kan bepalen dat met kinderen als bedoeld in het eerste lid worden gelijkgesteld kinderen, die
      nog geen 15 jaar oud zijn, die ouderloos zijn of wier ouders onbekend zijn of in geval het kinderen zonder
      familierechtelijke betrekkingen met een vader betreft, wier moeder is overleden en over wie de overleden verzekerde
      de pleegouderlijke zorg uitoefende.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel9
  - number: '9.5'
    text: |-
      Op grond van deze wet hebben, zolang zij de leeftijd van 25 jaar niet hebben bereikt, recht op wezenpensioen zij
      die de leeftijd van 15 jaar reeds hebben bereikt, doch overigens voldoen aan het eerste lid, indien:
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel9
  - number: 9.5.a
    text: |-
      hun tijd behoudens in geval van ziekte of vakantie geheel of grotendeels in beslag wordt genomen door of in verband
      met het volgen van onderwijs of van een beroepsopleiding;
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel9
  - number: 9.5.b
    text: |-
      zij ten gevolge van ziekte of gebreken blijvend buiten staat zijn om met arbeid, die voor hun krachten is
      berekend één derde te verdienen van hetgeen lichamelijk en geestelijk gezonde kinderen van gelijke leeftijd en van
      soortgelijke bekwaamheid in staat zijn met arbeid te verdienen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel9
  - number: '9.6'
    text: |-
      De kinderen tot wie de verzekerde man niet in familierechtelijke betrekking stond, bedoeld in het tweede lid,
      onderdeel b, hebben recht op wezenpensioen indien de wettelijke vertegenwoordiger van voornoemde kinderen ten
      genoegen van Onze Minister schriftelijk heeft aangetoond dat deze kinderen in een gezinsverband met de overleden
      verzekerde man samen leefden.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel9
  - number: '10'
    text: |-
      Geen recht op wezenpensioen bestaat indien de verzekerde aan wiens overlijden het recht daarop zou worden
      ontleend vóór het bereiken van de leeftijd waarop recht op ouderdomspensioen ontstaat op grond van de
      [Wet algemene ouderdomsverzekering BES][ref1] nimmer verzekerd is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0028459
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028459
  - number: '11.1'
    text: 'Het weduwenpensioen per maand bedraagt voor de weduwe:'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel11
  - number: 11.1.a
    text: 'jonger dan 40 jaar: USD 163'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel11
  - number: 11.1.b
    text: 'van 40 tot en met 48 jaar: USD 222'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel11
  - number: 11.1.c
    text: 'van 49 tot en met 57 jaar: USD 278'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel11
  - number: 11.1.d
    text: |-
      van 58 tot de leeftijd waarop recht op ouderdomspensioen ontstaat op grond van de
      [Wet algemene ouderdomsverzekering BES][ref1]: USD 365


      [ref1]: https://wetten.overheid.nl/BWBR0028459
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028459
  - number: '11.2'
    text: |-
      Verhoging van het pensioenbedrag gaat in op de eerste dag van de maand volgende op die, waarin het recht op
      verhoging is ontstaan.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel11
  - number: '11.3'
    text: |-
      In afwijking van het bepaalde in het eerste lid bedraagt het weduwenpensioen voor een weduwe die invalide is of die
      een of meer kinderen heeft die geheel te harer laste komen en recht hebben op wezenpensioen, USD 365 per maand.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel11
  - number: '11.4'
    text: |-
      Een weduwe is invalide, indien zij door een ziekte of gebrek blijvend buiten staat geacht moet worden om met
      arbeid, die voor haar krachten en bekwaamheid is berekend de helft te verdienen van hetgeen lichamelijk en
      geestelijk gezonde vrouwen van soortgelijke bekwaamheid met arbeid gewoonlijk verdienen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel11
  - number: '11.5'
    text: |-
      Onze Minister trekt een weduwenpensioen, toegekend terzake van invaliditeit in met ingang van de eerste dag van de
      maand volgend op de maand, waarin de weduwe geacht wordt niet langer invalide te zijn.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel11
  - number: '11.6'
    text: |-
      Onze Minister is bevoegd uitkering van weduwenpensioen voor invaliditeit te weigeren, indien de weduwe, die een
      dergelijk pensioen geniet, zonder deugdelijke grond weigert zich aan een door Onze Minister gewenst geneeskundig
      onderzoek te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel11
  - number: '12.1'
    text: |-
      Het wezenpensioen bedraagt voor een kind, dat door het overlijden van de verzekerde ouderloos is geworden, USD 134
      per maand, indien het jonger is dan tien jaar en USD 146 per maand indien het tien jaar of ouder, doch nog geen 15
      jaar is.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel12
  - number: '12.2'
    text: |-
      Het wezenpensioen bedraagt voor een kind, dat door het overlijden van de verzekerde vaderloos onderscheidenlijk
      moederloos is geworden, USD 132 per maand, indien het jonger is dan tien jaar en USD 134 per maand indien het tien
      jaar of ouder, doch nog geen 15 jaar is.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel12
  - number: '12.3'
    text: |-
      Het wezenpensioen bedraagt voor een kind, bedoeld in [artikel 9, vijfde lid][ref1], USD 146 per maand, voor zover
      het voldoet aan artikel 9, eerste lid, onderdelen a of b, en USD 169 per maand, voor zover het voldoet aan artikel
      9, eerste lid, onderdelen c of d. [Artikel 11, vijfde en zesde lid][ref2], is van overeenkomstige toepassing op een
      wezenpensioen terzake van invaliditeit.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028387#Artikel11
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028387
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
  - number: '12.4'
    text: |-
      Indien op grond van meer dan één overlijden aanspraak op wezenpensioen kan worden gemaakt, wordt het hoogste
      wezenpensioen toegekend.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel12
  - number: 12a.1
    text: |-
      Indien uit de door het Centraal Bureau voor de Statistiek vastgestelde consumentenprijsindexcijfers voor de
      openbare lichamen Bonaire, Sint Eustatius en Saba blijkt, dat het prijsindexcijfer voor het derde kwartaal van het
      lopende jaar, vergeleken met het prijsindexcijfer voor het derde kwartaal van het voorafgaande jaar is gestegen
      of gedaald, stelt Onze Minister bedragen vast, die met ingang van 1 januari van het komende jaar in de plaats
      treden van de in de [artikelen 11, eerste en derde lid][ref1], en [12, eerste, tweede en derde lid][ref2], genoemde
      bedragen. Onze Minister bepaalt welke consumentenprijsindexcijfers voor de toepassing van de eerste zin worden
      gebruikt. De consumentenprijsindexcijfers kunnen voor de onderscheiden openbare lichamen en voor belanghebbenden
      die woonachtig zijn buiten de openbare lichamen, verschillend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028387#Artikel12
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028387
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: 12a.2
    text: |-
      Indien er naar het oordeel van Onze Minister bijzondere omstandigheden zijn, kunnen de bedragen, bedoeld in het
      eerste lid, bij ministeriële regeling met ingang van een bij die regeling aan te geven datum worden gewijzigd. Onze
      Minister kan het bestuurscollege van het betrokken openbaar lichaam in dat verband om advies vragen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel12a
  - number: 12a.3
    text: |-
      De overeenkomstig het eerste lid herziene dan wel overeenkomstig het tweede lid gewijzigde bedragen
      treden in de plaats van de bedragen, genoemd in de [artikelen 11, eerste en derde lid][ref1], en
      [12, eerste, tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028387#Artikel12
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028387
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: 12a.4
    text: |-
      Indien een wijziging als bedoeld in het tweede lid samenvalt met een herziening als bedoeld in het eerste lid,
      wordt het bedrag voorafgaande aan de wijziging herzien en geschiedt de herziening bij de in het tweede lid bedoelde
      ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel12a
  - number: '13'
    text: |-
      Waar in deze paragraaf wordt gesproken van pensioen wordt daaronder verstaan het weduwenpensioen en het
      wezenpensioen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel13
  - number: '14.1'
    text: Het pensioen wordt op aanvraag toegekend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel14
  - number: '14.2'
    text: In afwijking van het bepaalde in het voorgaande lid is Onze Minister bevoegd het pensioen ambtshalve toe te kennen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel14
  - number: '14.3'
    text: De aanvraag om pensioen wordt ingediend op de wijze die daarvoor door regeling van Onze Minister wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel14
  - number: '15'
    text: |-
      Het pensioen gaat in op de eerste dag van de maand volgende op de maand, waarin het recht op pensioen is ontstaan,
      met dien verstande, dat het pensioen niet vroeger kan ingaan dan 12 maanden vóór de eerste dag van de maand
      volgende op de maand, waarin de aanvraag is ingediend of waarin ambtshalve toekenning heeft plaatsgevonden. Onze
      Minister kan voor bijzondere gevallen van het bepaalde in de vorige zin afwijken.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel15
  - number: '16.1'
    text: Het pensioen wordt door Onze Minister betaalbaar gesteld. De betaling geschiedt maandelijks.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel16
  - number: '16.2'
    text: |-
      Onze Minister kan het aan een kind toegekende wezenpensioen betaalbaar stellen aan een ander dan degene, die het
      kind wettelijk vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel16
  - number: '16.3'
    text: |-
      In geval het pensioen in het buitenland wordt uitbetaald worden de daaraan verbonden kosten van overmaking op het
      pensioen in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel16
  - number: '16.4'
    text: |-
      Wanneer een weduwe een ander machtigt om het pensioen in ontvangst te nemen, dan wel een verleende machtiging
      intrekt, wordt daaraan gevolg gegeven met ingang van een betalingstermijn, aanvangend na de dag, waarop de
      machtiging wordt ingediend, dan wel waarop van haar intrekking mededeling wordt gedaan, doch niet later dan de
      eerste dag van de tweede maand na de dag van indiening, dan wel intrekking van de machtiging.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel16
  - number: '16.5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de betaalbaarstelling van het
      pensioen door organen, die belast zijn met de uitbetaling van pensioen uit andere hoofde dan op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel16
  - number: '17.1'
    text: |-
      Indien een op grond van deze wet gepensioneerde in een inrichting voor verpleging van geesteszieken en zwakzinnigen
      of door een instelling van weldadigheid, die door het openbare lichaam Bonaire, Sint Eustatius of Saba is erkend
      wordt verzorgd of verpleegd en de kosten van verzorging of verpleging geheel of gedeeltelijk ten laste komen van
      dat openbare lichaam of erkende instelling van weldadigheid, kan op verzoek van het desbetreffende orgaan het
      pensioen over volle kalendermaanden, gelegen binnen de duur van de verzorging of verpleging, voorzover het over
      die maanden nog niet is uitbetaald, aan het desbetreffende orgaan worden uitbetaald, met dien verstande dat aan
      dat orgaan niet meer wordt uitbetaald dan de te zijnen laste komende kosten van verzorging of verpleging bedragen
      en dat een bij ministeriële regeling in overeenstemming met de Minister van Volksgezondheid, Welzijn en Sport te
      bepalen bedrag bij de betaling aan dat orgaan buiten beschouwing wordt gelaten ter voorziening in de voor rekening
      van de gepensioneerde blijvende kosten van bestaan.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel17
  - number: '17.2'
    text: |-
      Voorzover in verband met het bepaalde in het voorgaande lid het pensioen niet werd uitbetaald aan de gepensioneerde
      of diens wettelijke vertegenwoordiger, wordt het na het overlijden van de gepensioneerde voorzover nodig in
      afwijking van het in [artikel 21][ref1] bepaalde, tot en met de laatste dag van de maand, waarin het overlijden
      heeft plaats gehad, uitbetaald aan het in het voorgaande lid bedoelde orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel21
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '18'
    text: |-
      De termijnen van het pensioen, welke niet zijn ingevorderd binnen twee jaar na de eerste dag waarop zij konden
      worden ingevorderd worden niet uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel18
  - number: '19.1'
    text: 'Onverminderd het elders in deze wet bepaalde eindigt het recht op pensioen:'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel19
  - number: 19.1.a
    text: door overlijden;
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel19
  - number: 19.1.b
    text: voor wat de weduwe betreft tevens door hertrouwen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel19
  - number: '19.2'
    text: |-
      De uitbetaling van het pensioen eindigt met ingang van de maand volgende op de maand, waarin het feit heeft
      plaatsgevonden of de omstandigheid is ontstaan, waardoor het recht op pensioen is geëindigd.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel19
  - number: '20'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel20
  - number: '21.1'
    text: |-
      Na het overlijden van degene, aan wie een pensioen is toegekend, wordt het pensioen tot en met de laatste dag van
      de maand waarin het overlijden heeft plaatsgevonden, uitbetaald aan de persoon of personen, die daarvoor naar het
      oordeel van Onze Minister op billijkheidsoverwegingen in aanmerking komt, dan wel komen, mits deze daartoe binnen
      zes maanden na het overlijden een verzoek bij Onze Minister heeft, dan wel hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel21
  - number: '21.2'
    text: |-
      Na het overlijden van degene, aan wie een pensioen is toegekend, wordt een bedrag ineens, gelijk aan driemaal het
      aan de overledene toegekende pensioen, uitbetaald aan de persoon of personen, die daarvoor naar het oordeel van
      Onze Minister op billijkheidsoverwegingen in aanmerking komt, dan wel komen, mits deze daartoe binnen zes maanden
      na het overlijden een verzoek bij Onze Minister heeft, dan wel hebben ingediend. Onze Minister is bevoegd de
      uitkering op een lager bedrag vast te stellen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel21
  - number: '21.3'
    text: De uitkering wordt betaalbaar gesteld in de maand volgende op die, waarin waarin een verzoek daartoe is ingediend.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel21
  - number: '22'
    text: |-
      Aan de weduwe, bedoeld in [artikel 19, eerste lid, onderdeel b][ref1], wordt een uitkering ineens verleend ter
      grootte van het bedrag, dat haar aan weduwenpensioen zou toekomen, indien zij niet was hertrouwd, doch ten hoogste
      ter grootte van het jaarbedrag van het weduwenpensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel19
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '19'
        hoofdstuk: III
        paragraaf: '3'
  - number: '23.1'
    text: 'Het pensioen is:'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel23
  - number: 23.1.a
    text: onvervreemdbaar;
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel23
  - number: 23.1.b
    text: niet vatbaar voor verpanding of belening;
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel23
  - number: 23.1.c
    text: |-
      behoudens voor zover dit dient tot verhaal van onderhoud, waartoe de gerechtigde op grond van enige wettelijke
      bepaling is gehouden, niet vatbaar voor executoriaal of conservatoir beslag, noch voor faillissementsbeslag.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel23
  - number: '23.2'
    text: |-
      Voor zover op grond van het eerste lid, onderdeel c, beslag wordt gelegd, mag dit niet meer bedragen dan een derde
      gedeelte van het bedrag van het pensioen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel23
  - number: '23.3'
    text: |-
      Volmacht tot ontvangst van het pensioen onder welke vorm of benaming ook, door de gerechtigde verleend is steeds
      herroepelijk.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel23
  - number: '23.4'
    text: Elk beding strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel23
  - number: 23a
    text: |-
      Degene die gehouden is tot vergoeding van de schade door de weduwe, weduwnaar of wezen geleden als gevolg van het
      overlijden van de verzekerde man of vrouw, is voor het pensioen van de weduwe, weduwnaar of wezen toegekend op
      grond van deze wet aansprakelijk jegens Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel23a
  - number: '24.1'
    text: |-
      Behoudens het bepaalde in het volgende lid zijn de eenmaal uitbetaalde termijnen van het pensioen niet vatbaar
      voor terugvordering.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel24
  - number: '24.2'
    text: |-
      Hetgeen ten onrechte aan pensioen is uitbetaald kan worden teruggevorderd dan wel op latere pensioenbetalingen
      in mindering worden gebracht, wanneer het ten onrechte uitbetalen het gevolg is van het niet verstrekken van
      inlichtingen of het verstrekken van onjuiste inlichtingen door degene aan wie het pensioen is toegekend, door diens
      wettelijke vertegenwoordiger of door degene aan wie het pensioen is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel24
  - number: '24.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven ter uitvoering van dit artikel;
      daarbij kunnen tevens regels worden gesteld met betrekking tot schorsing en opschorting van de uitbetaling van
      het pensioen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel24
  - number: 24a.1
    text: |-
      Onze Minister is bevoegd om op grond van verdragen, convenanten en andersoortige overeenkomsten met uitvoerders van
      instellingen van sociale voorzieningen, het pensioen van een gerechtigde te verminderen ter ontneming van een ten
      onrechte verkregen voordeel van de gerechtigde op het gebied van sociale voorzieningen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel24a
  - number: 24a.2
    text: |-
      Onze Minister is eveneens bevoegd om het pensioen van een gerechtigde te verminderen ter ontneming van een
      ten onrechte verkregen voordeel van de gerechtigde op het gebied van de door Onze Minister uitgevoerde sociale
      verzekeringswetten.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel24a
  - number: 24a.3
    text: |-
      De in het eerste en tweede lid bedoelde vermindering kan ineens geschieden indien het ten onrechte genoten voordeel
      niet groter is dan een derde deel van het door Onze Minister verstrekte weduwen- en wezenpensioen. In alle andere
      gevallen kan de vermindering niet meer bedragen dan een derde deel van het weduwen- of wezenpensioen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel24a
  - number: '26.1'
    text: Ter zake van de kosten verbonden aan deze wet is door de verzekerden een premie verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel26
  - number: '26.2'
    text: 'Aan de heffing van premie is niet onderworpen:'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel26
  - number: 26.2.a
    text: |-
      de verzekerde, die de leeftijd waarop recht op ouderdomspensioen ontstaat op grond van de
      [Wet algemene ouderdomsverzekering BES][ref1] heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0028459
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028459
  - number: 26.2.b
    text: |-
      de gehuwde man wiens echtgenote in verband met het bepaalde in
      [artikel 41, tweede lid, onderdeel c, van de Wet algemene ouderdomsverzekering BES][ref1] recht op ouderdompensioen
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel41
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '41'
  - number: '26.3'
    text: De premie komt ten gunste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel26
  - number: '26.4'
    text: |-
      De op grond van deze wet uit te keren pensioenen en de aan de uitvoering van deze wet verbonden kosten komen ten
      laste van het Rijk
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel26
  - number: '29.1'
    text: |-
      De premie ten behoeve van deze wet wordt geheven over het inkomen, met overeenkomstige toepassing van
      de [hoofdstukken V][ref1], [VI][ref2], [VII][ref3] en [IX van de Wet inkomstenbelasting BES][ref4], de
      [hoofdstukken III][ref5] en [VI van de Wet loonbelasting BES][ref6] en de [hoofdstukken I][ref7], [VII][ref8] en
      [VIII van de Belastingwet BES][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0029281#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0029281#HoofdstukVI
      [ref3]: https://wetten.overheid.nl/BWBR0029281#HoofdstukVII
      [ref4]: https://wetten.overheid.nl/BWBR0029281#HoofdstukIX
      [ref5]: https://wetten.overheid.nl/BWBR0029283#HoofdstukIII
      [ref6]: https://wetten.overheid.nl/BWBR0029283#HoofdstukVI
      [ref7]: https://wetten.overheid.nl/BWBR0029244#HoofdstukI
      [ref8]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVII
      [ref9]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029281
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0029281
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0029281
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0029281
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0029283
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0029283
        hoofdstuk: VI
      - id: ref7
        bwb_id: BWBR0029244
        hoofdstuk: I
      - id: ref8
        bwb_id: BWBR0029244
        hoofdstuk: VII
      - id: ref9
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '29.2'
    text: |-
      Onder inkomen wordt verstaan: de belastbare som, bedoeld in
      [artikel 24, eerste lid, van de Wet inkomstenbelasting BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '24'
  - number: '29.3'
    text: |-
      Indien het inkomen meer bedraagt dan het in [artikel 24A, zevende lid, van de Wet inkomstenbelasting BES][ref1]
      genoemde bedrag, wordt over dat meerdere geen premie geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24a
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: 24a
  - number: '30'
    text: |-
      Het percentage van de premie, bedoeld in [artikel 29, eerste lid][ref1], wordt door Onze Minister met ingang van
      elk kalenderjaar voor de periode van één jaar bij ministeriële regeling vastgesteld in overeenstemming met Onze
      Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel29
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '29'
        hoofdstuk: IV
  - number: '31'
    text: |-
      Voor zover in deze wet niet anders is bepaald is ten aanzien van de premieheffing op grond van [artikel 29][ref1]
      en de invordering daarvan [hoofdstuk VIII van de Belastingwet BES][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '29'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '35.1'
    text: |-
      De gepensioneerde en zijn wettelijke vertegenwoordiger of het orgaan waaraan op grond van [artikel 17][ref1]
      pensioen wordt uitbetaald, zijn verplicht aan Onze Minister op zijn verzoek of onverwijld uit eigen beweging alle
      feiten en omstandigheden mee te delen, waarvan hun redelijkerwijs duidelijk moet zijn dat die van invloed kunnen
      zijn op het recht op pensioen, de hoogte van het pensioen of op het bedrag van het pensioen dat wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel17
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '17'
        hoofdstuk: III
        paragraaf: '3'
  - number: '35.2'
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt niet indien feiten en omstandigheden door Onze Minister kunnen
      worden vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens of kan worden
      verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële regeling kan worden bepaald
      voor welke gegevens de vorige zin van toepassing is.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel35
  - number: '36.1'
    text: |-
      Een ieder is verplicht aan Onze Minister of aan enige vanwege Onze Minister aangewezen persoon de voor de
      uitvoering van deze wet van hem gevraagde inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel36
  - number: '36.2'
    text: De inlichtingen moeten desgevraagd schriftelijk worden verstrekt binnen een schriftelijk te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel36
  - number: '36.3'
    text: |-
      Een ieder is verplicht aan Onze Minister of aan enig door of vanwege Onze Minister aangewezen persoon desgevraagd
      inzage te verlenen van boeken, bescheiden, andere stukken en informatiedragers, voor zover dat nodig is ten behoeve
      van de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel36
  - number: '37.1'
    text: |-
      Publiekrechtelijke lichamen zijn verplicht kosteloos hun medewerking te verlenen tot het verkrijgen van de
      inlichtingen, benodigd voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel37
  - number: '37.2'
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel37
  - number: '38.1'
    text: |-
      Aan de belanghebbende wordt schriftelijk kennis gegeven van een beslissing op grond van deze wet, die verband houdt
      met het recht op en de uitbetaling van pensioen of uitkering.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel38
  - number: '38.2'
    text: |-
      Een kennisgeving, bedoeld in het eerste lid, vermeldt de dagtekening van de beslissing, de gronden waarop deze
      berust, en, behalve in het geval van een beslissing op grond van [artikel 21][ref1], waar beroep kan worden
      ingesteld en de termijn voor het instellen van beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel21
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '40.1'
    text: |-
      Voor zover bij of op grond van deze wet niet anders is bepaald zijn de voor heffing van de inkomstenbelasting
      geldende bepalingen inzake de rechtsmiddelen van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel40
  - number: '40.2'
    text: |-
      De inspecteur beslist pas op een bezwaarschrift nadat is komen vast te staan dat geen feiten en omstandigheden
      aanwezig zijn, die tevens van belang zijn voor de heffing van inkomstenbelasting, dan wel voor zover dat wel het
      geval is, de beslissing over de heffing van de inkomstenbelasting onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel40
  - number: '40.3'
    text: |-
      Met betrekking tot een naheffingsaanslag, die geheel of gedeeltelijk berust op feiten, die mede tot het opleggen
      van een naheffingsaanslag in de inkomstenbelasting ten laste van belanghebbende aanleiding hebben gegeven, neemt
      de termijn voor het instellen van beroep eerst een aanvang op de datum, waarop laatstbedoelde naheffingsaanslag
      onherroepelijk is komen vast te staan.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel40
  - number: '40.4'
    text: |-
      Tegen hetgeen omtrent de toepassing van [artikel 2][ref1] dezer wet, alsmede omtrent het zuiver inkomen in de zin
      van de [Wet op de inkomstenbelasting BES][ref2] voor de heffing van die belasting onherroepelijk is komen vast te
      staan, is beroep niet toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029281
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0029281
  - number: '41.1'
    text: |-
      De weduwe, wier echtgenoot is overleden vóór 1 januari 1966 en die op die dag nog geen 65 jaar oud is, heeft van
      die dag af recht op weduwenpensioen naar de bepalingen van deze wet, indien zij dat recht zou hebben gehad wanneer
      deze wet op het tijdstip van overlijden van haar echtgenoot reeds van kracht zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel41
  - number: '41.2'
    text: |-
      De wettige, gewettigde en door de vader erkende natuurlijke kinderen, wier vader is overleden vóór 1 januari
      1966 en die op die dag nog geen 15 jaar oud zijn, hebben van die dag af naar de bepalingen van deze wet recht op
      wezenpensioen, indien zij dat recht zouden hebben gehad wanneer deze wet op het tijdstip van overlijden reeds van
      kracht geweest zou zijn.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel41
  - number: '41.3'
    text: |-
      De kinderen, wier moeder is overleden vóór 1 januari 1966 en die als gevolg daarvan ouderloos zijn geworden en
      die op 1 januari 1966 nog geen 15 jaar oud zijn, hebben van die dag af naar de bepalingen van deze wet recht op
      wezenpensioen, indien zij dat recht zouden hebben gehad wanneer deze wet op het tijdstip van overlijden reeds van
      kracht zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel41
  - number: '41.4'
    text: |-
      Het bepaalde in de voorgaande leden is slechts van toepassing op Nederlanders, die in Aruba, Curaçao, Sint Maarten,
      de openbare lichamen Bonaire, Sint Eustatius of Saba wonen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel41
  - number: '41.5'
    text: Een kind kan tegelijkertijd slechts op grond van één overlijden wezenpensioen genieten.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel41
  - number: '42'
    text: 'Bij algemene maatregel van bestuur kan onder nader daarbij te stellen voorwaarden worden bepaald, dat:'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel42
  - number: 42.a
    text: |-
      voor de toepassing van [artikel 41][ref1] niet-Nederlanders met Nederlanders worden gelijkgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel41
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '41'
        hoofdstuk: VII
  - number: 42.b
    text: |-
      het wonen buiten Aruba, Curaçao, Sint Maarten, de openbare lichamen Bonaire, Sint Eustatius of Saba met het wonen
      in Aruba, Curaçao, Sint Maarten, de openbare lichamen Bonaire, Sint Eustatius of Saba wordt gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel42
  - number: 42a.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn de daartoe bij ministeriële
      regeling aangewezen functionarissen belast.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel42a
  - number: 42a.2
    text: |-
      De op grond van het eerste lid aangewezen functionarissen zijn, uitsluitend voor zover dat voor de vervulling van
      hun taak redelijkerwijs noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel42a
  - number: 42a.2.a
    text: 'alle inlichtingen te vragen:'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel42a
  - number: 42a.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel42a
  - number: 42a.2.c
    text: |-
      alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen functionarissen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel42a
  - number: 42a.3
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel c, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel42a
  - number: 42a.4
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de wijze van
      taakuitoefening van de op grond van het eerste lid aangewezen functionarissen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel42a
  - number: 42a.5
    text: |-
      Een ieder is verplicht aan de op grond van het eerste lid aangewezen functionarissen alle medewerking te verlenen
      die in het kader van de toezicht uitoefening op grond van het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel42a
  - number: '43'
    text: |-
      Hij, die niet voldoet aan een van de verplichtingen opgelegd in de [artikelen 35][ref1] en [36][ref2] wordt
      gestraft met hechtenis van ten hoogste zes maanden of geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0028387#Artikel36
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '35'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0028387
        artikel: '36'
        hoofdstuk: V
  - number: '44'
    text: |-
      Hij, die op grond van bij of krachtens deze wet vastgestelde bepalingen gehouden is inlichtingen of gegevens
      te verstrekken, een aangifte of mededeling te doen of een verklaring af te leggen en daarbij opzettelijk een
      valse opgave doet dan wel opzettelijk in strijd met bedoelde gehoudenheid iets verzwijgt, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel44
  - number: '45'
    text: |-
      Hij, die op andere wijze dan door het valselijk opmaken of vervalsen van een geschrift, dat bestemd is tot bewijs
      van enig feit te dienen opzettelijk een opgave doet in strijd met de waarheid, zulks met het oogmerk om aldus een
      uitkering of een hogere uitkering op grond van deze wet te verkrijgen, wordt gestraft met gevangenisstraf van ten
      hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel45
  - number: '46'
    text: |-
      Overtredingen van bepalingen van een op grond van deze wet vastgestelde algemene maatregel van bestuur voor zover
      uitdrukkelijk als strafbaar feit aangeduid, wordt gestraft met hechtenis van ten hoogste een maand of geldboete van
      de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel46
  - number: '47'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel47
  - number: '48.1'
    text: |-
      Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde functionarissen, belast de door Onze Minister
      van Justitie, in overeenstemming met Onze Minister, aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '48.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de vereisten waaraan de
      op grond van het eerste lid aangewezen functionarissen dienen te voldoen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel48
  - number: '49'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel49
  - number: '50.1'
    text: |-
      De in [artikel 48][ref1] bedoelde personen zijn verplicht tot geheimhouding van hetgeen hun bij het toezicht
      op de naleving van de bij of op grond van deze wet vastgestelde bepalingen is bekend geworden, voor zover die
      geheimhouding niet in strijd is met enige wettelijk voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel48
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '48'
        hoofdstuk: VIII
  - number: '50.2'
    text: |-
      Hij, die de bij het vorige lid opgelegde geheimhouding opzettelijk schendt, wordt gestraft met gevangenisstraf van
      ten hoogste zes maanden of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel50
  - number: '50.3'
    text: |-
      Hij, aan wiens schuld schending van die geheimhouding te wijten is, wordt gestraft met hechtenis van ten hoogste
      drie maanden of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel50
  - number: '50.4'
    text: Geen vervolging heeft plaats dan op aangifte van degene, ten aanzien van wie de geheimhouding is geschonden.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel50
  - number: '51'
    text: |-
      De in de [artikelen 44][ref1], [45][ref2] en [50][ref3] bedoelde strafbare feiten worden als misdrijven, de in de
      [artikelen 43, eerste en tweede lid][ref4], en [46][ref5] bedoelde strafbare feiten als overtredingen beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0028387#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0028387#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0028387#Artikel43
      [ref5]: https://wetten.overheid.nl/BWBR0028387#Artikel46
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '44'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0028387
        artikel: '45'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0028387
        artikel: '50'
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0028387
        artikel: '43'
        hoofdstuk: VIII
      - id: ref5
        bwb_id: BWBR0028387
        artikel: '46'
        hoofdstuk: VIII
  - number: '53.1'
    text: |-
      Op de weduwen- en wezenpensioenen of uitkeringen waarop op grond van een pensioenregeling van een pensioenfonds of
      van een werkgever aanspraak bestaat, mogen de pensioenen, waarop op grond van deze wet aanspraak bestaat, niet in
      mindering worden gebracht.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel53
  - number: '53.2'
    text: |-
      Onze Minister kan ontheffing verlenen van het in het voorgaande lid bepaalde met dien verstande, dat geen hoger
      percentage van de op grond van deze wet toegekende pensioenen in mindering mag worden gebracht dan de helft van het
      percentage, dat de bijdrage of premie van de werkgever uitmaakt van de totale premie of bijdrage voor de op grond
      van de in het eerste lid bedoelde pensioenregeling te genieten weduwen- en wezenpensioen.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel53
  - number: '55'
    text: Hetgeen overigens ter uitvoering van deze wet nodig is, wordt bij algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel55
  - number: '57'
    text: |-
      Alle op grond van deze wet opgemaakte of overgelegde stukken, verzoekschriften en beschikkingen zijn vrij van het
      recht van zegel en van de formaliteit van registratie.
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel57
  - number: '58'
    text: 'Deze wet wordt aangehaald als: Wet algemene weduwen- en wezenverzekering BES.'
    url: https://wetten.overheid.nl/BWBR0028387/2017-01-01#Artikel58
