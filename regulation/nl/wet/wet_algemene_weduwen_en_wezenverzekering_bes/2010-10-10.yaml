$id: wet_algemene_weduwen_en_wezenverzekering_bes
regulatory_layer: WET
publication_date: '2025-02-19'
valid_from: '2010-10-10'
bwb_id: BWBR0028387
url: https://wetten.overheid.nl/BWBR0028387/2010-10-10
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze landsverordening bepaalde wordt verstaan onder: - *de Minister:*
      de Minister van Arbeid en Sociale Zaken;
        - *de bank:* de Sociale Verzekeringsbank;
        - *ingezetene:* degene die in de Nederlandse Antillen woont;
        - *de Inspecteur:* a. ten aanzien van de werkgever, die hetzij zijn woonplaats hetzij zijn vestigingsplaats
      of, bij gebreke daarvan voor de winstbelasting, zijn vaste inrichting of vaste vertegenwoordiger heeft: in het
      eilandgebied Bonaire: de Inspecteur der Belastingen op Bonaire; in het eilandgebied Curaçao: de Inspecteur der
      Belastingen op Curaçao; in één van de overige eilandgebieden: de Inspecteur der Belastingen op Sint Maarten; ten
      aanzien van de overige werkgevers: de Inspecteur der Belastingen op Curaçao; b. ten aanzien van de verzekerde,
      die bij het begin van het desbetreffende jaar zijn woonplaats heeft: in het eilandgebied Bonaire: de Inspecteur
      der Belastingen op Bonaire; in het eilandgebied Curaçao: de Inspecteur der Belastingen op Curaçao; in één van de
      overige eilandgebieden: de Inspecteur der Belastingen op Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel1
  - number: '2.1'
    text: Waar iemand woont wordt naar de omstandigheden beoordeeld voor zover in de volgende leden niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      Degenen, die de Nederlandse Antillen metterwoon verlaten, maar binnen een jaar zich aldaar weder metterwoon
      vestigen, worden geacht ook tijdens hun afwezigheid in de Nederlandse Antillen te hebben gewoond, tenzij blijkt,
      dat zij tijdens hun afwezigheid op het grondgebied van Nederland of van een vreemde staat hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel2
  - number: '2.3'
    text: |-
      Degenen, die tijdelijk binnen de Nederlandse Antillen verblijven en hetzij in Nederland wonen, hetzij aldaar geacht
      worden te wonen volgens de daar geldende wetgeving inzake de belasting naar het inkomen worden als niet binnen de
      Nederlandse Antillen wonend beschouwd, indien hun verblijf niet langer dan een jaar duurt.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel2
  - number: '2.4'
    text: |-
      De Minister kan, de bank gehoord, bepalen, dat schepen en luchtvaartuigen, die binnen de Nederlandse Antillen hun
      thuishaven hebben, ten opzichte van de bemanning als deel van de Nederlandse Antillen worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel2
  - number: '3'
    text: Voor de toepassing van deze landsverordening wordt met overlijden gelijk gesteld vermoedelijk overlijden.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel3
  - number: 3a
    text: De bepalingen van deze landsverordening voor weduwen zijn van overeenkomstige toepassing op weduwnaars.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel3a
  - number: '4.1'
    text: |-
      In de uitvoering van de in deze landsverordening geregelde verzekering wordt voorzien door de bank met dien
      verstande, dat de heffing geschiedt door de Inspecteur .
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel4
  - number: '4.2'
    text: |-
      Voor zover de uitvoering van de in deze landsverordening geregelde verzekering geschiedt door de bank, kan de
      Minister nadere regelen stellen met betrekking tot de te voeren administratie en de registratie van de verzekerden.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel4
  - number: '5.1'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen kunnen bevoegdheden met betrekking tot de uitvoering van deze
      landsverordening worden toegekend aan instanties van het Land of van de eilandgebieden en kunnen aan die instanties
      aanwijzingen en voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel5
  - number: '5.2'
    text: |-
      In de gevallen, waarin ingevolge het bepaalde in het voorgaande lid aan instanties van het Land of van de
      eilandgebieden bevoegdheden zijn toegekend, zijn de bepalingen van deze landsverordening en van de tot haar
      uitvoering genomen besluiten van toepassing met inachtneming van de wijzigingen, welke de aard van het onderwerp
      vordert.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel5
  - number: '6.1'
    text: |-
      Verzekerd overeenkomstig de bepalingen van deze landsverordening is degene, die de leeftijd van 15 jaar heeft
      bereikt, indien hij:
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel6
  - number: 6.1.a
    text: ingezetene is;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel6
  - number: 6.1.b
    text: |-
      geen ingezetene is, doch in de inkomstenbelasting wordt aangeslagen als binnen de Nederlandse Antillen wonende
      belastingplichtige;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel6
  - number: 6.1.c
    text: |-
      geen ingezetene is en evenmin geacht kan worden blijvend buiten de Nederlandse Antillen te wonen, doch terzake van
      buiten de Nederlandse Antillen verrichte arbeid wedde of loon geniet ten laste van de Nederlandse Antillen of van
      een van de eilandgebieden, mits hij Nederlander is.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel6
  - number: '6.2'
    text: |-
      Niet verzekerd is degene, die niet geacht kan worden blijvend binnen de Nederlandse Antillen te wonen en die
      terzake van binnen de Nederlandse Antillen verrichte arbeid wedde of loon geniet ten laste van Nederland of een
      vreemde mogendheid.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel6
  - number: '6.3'
    text: |-
      Bij landsbesluit houdende algemene maatregelen kunnen personen, die niet ingevolge lid 1 verzekerd zijn als
      verzekerden in de zin van deze landsverordening worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel6
  - number: '6.4'
    text: 'Bij landsbesluit houdende algemene maatregelen kan van het bepaalde in lid 1 worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel6
  - number: 6.4.a
    text: ten aanzien van vreemdelingen;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel6
  - number: 6.4.b
    text: ten aanzien van personen, op wie een overeenkomstige regeling buiten de Nederlandse Antillen van toepassing is;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel6
  - number: 6.4.c
    text: |-
      ten aanzien van personen die tijdelijk hier te lande verblijven of tijdelijke werkzaamheden hier te lande
      verrichten;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel6
  - number: 6.4.d
    text: |-
      ten aanzien van echtgenoten en overige gezinsleden van de in lid 2 en van de in dit lid onder a, b en c bedoelde
      personen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel6
  - number: '6.5'
    text: |-
      Indien een verzekerde ophoudt verzekerde te zijn, eindigt zijn verzekering voor wat de aanspraken op weduwen- en
      wezenpensioen betreft, voor zover niet reeds een overeenkomstige regeling buiten de Nederlandse Antillen op hem van
      toepassing is, niet eerder dan zes weken na de dag met ingang van welke hij heeft opgehouden verzekerde te zijn.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel6
  - number: '7'
    text: |-
      De weduwe van een verzekerde heeft, zolang zij nog geen 60 jaar oud is, recht op een weduwenpensioen overeenkomstig
      de bepalingen van deze landsverordening.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel7
  - number: '8.1'
    text: 'Geen recht op weduwenpensioen heeft de weduwe:'
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel8
  - number: 8.1.a
    text: wier echtgenoot vóór het bereiken van de 60-jarige leeftijd nimmer verzekerd is geweest;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel8
  - number: 8.1.b
    text: |-
      wier echtgenoot op de dag van de huwelijkssluiting de leeftijd van 60 jaar had bereikt of overschreden, tenzij de
      weduwe met deze echtgenoot, vóórdat hij de leeftijd van 60 jaar had bereikt, reeds eerder gehuwd is geweest;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel8
  - number: 8.1.c
    text: die veroordeeld is terzake van het ombrengen van haar echtgenoot.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      Het bepaalde in het voorgaande lid onder a en b blijft buiten toepassing, indien de weduwe, indien zij niet was
      hertrouwd, recht op weduwenpensioen zou hebben.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel8
  - number: '9.1'
    text: |-
      Overeenkomstig de bepalingen van deze landsverordening hebben, zolang zij de leeftijd van 15 jaar niet hebben
      bereikt, recht op wezenpensioen:
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel9
  - number: 9.1.a
    text: |-
      na het overlijden van een verzekerde man: de kinderen tot wie hij in familierechtelijke betrekking stond alsmede
      de door hem verwekte kinderen tot wie hij niet in familierechtelijke betrekking stond die als gevolg van zijn
      overlijden vaderloos zijn geworden;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel9
  - number: 9.1.b
    text: |-
      na het overlijden van een verzekerde vrouw: haar eigen kinderen, die als gevolg van haar overlijden moederloos
      zijn geworden;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel9
  - number: 9.1.c
    text: |-
      na het overlijden van een verzekerde man: de kinderen tot wie hij in familierechtelijke betrekking stond alsmede
      de door hem verwekte kinderen tot wie hij niet in familierechtelijke betrekking stond die als gevolg van zijn
      overlijden ouderloos zijn geworden;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel9
  - number: 9.1.d
    text: |-
      na het overlijden van een verzekerde vrouw: haar eigen kinderen, die als gevolg van haar overlijden ouderloos zijn
      geworden.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel9
  - number: '9.2'
    text: |-
      Ingeval van kinderen tot wie de verzekerde vader niet in familierechtelijke betrekking stond is het eerste lid,
      onderdelen a en c, van toepassing indien:
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel9
  - number: 9.2.a
    text: |-
      de verzekerde vader ten tijde van zijn overlijden onderhoudsplicht krachtens
      [artikel 349 van Boek 1 van het Burgerlijk Wetboek][ref1] is opgelegd, dan wel door hem bij authentieke akte
      onderhoudsplicht is erkend; of


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel349
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '349'
  - number: 9.2.b
    text: zij in een gezinsverband met de overleden verzekerde man samen leefden.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel9
  - number: '9.3'
    text: |-
      Kinderen zonder familierechtelijke betrekkingen met een vader die niet aangemerkt kunnen worden als kinderen
      als bedoeld in het tweede lid worden gelijkgesteld met kinderen die als gevolg van het overlijden van de moeder
      ouderloos zijn geworden, voor zolang geen wijziging van omstandigheden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel9
  - number: '9.4'
    text: |-
      De Minister kan, de bank gehoord, bepalen dat met kinderen als bedoeld in het eerste lid worden gelijkgesteld
      kinderen, die nog geen 15 jaar oud zijn, die ouderloos zijn of wier ouders onbekend zijn of in geval het kinderen
      zonder familierechtelijke betrekkingen met een vader betreft, wier moeder is overleden en over wie de overleden
      verzekerde de pleegouderlijke zorg uitoefende.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel9
  - number: '9.5'
    text: |-
      Overeenkomstig de bepalingen van deze landsverordening hebben, zolang zij de leeftijd van 25 jaar niet hebben
      bereikt, recht op wezenpensioen zij die de leeftijd van 15 jaar reeds hebben bereikt, doch overigens voldoen aan
      het eerste lid, indien:
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel9
  - number: 9.5.a
    text: |-
      hun tijd behoudens in geval van ziekte of vacantie geheel of grotendeels in beslag wordt genomen door of in verband
      met het volgen van onderwijs of van een beroepsopleiding;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel9
  - number: 9.5.b
    text: |-
      zij ten gevolge van ziekte of gebreken blijvend buiten staat zijn om met arbeid, die voor hun krachten is
      berekend één derde te verdienen van hetgeen lichamelijk en geestelijk gezonde kinderen van gelijke leeftijd en van
      soortgelijke bekwaamheid in staat zijn met arbeid te verdienen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel9
  - number: '9.6'
    text: |-
      De kinderen tot wie de verzekerde man niet in familierechtelijke betrekking stond, bedoeld in het tweede lid,
      onderdeel b, hebben recht op wezenpensioen indien de wettelijke vertegenwoordiger van voornoemde kinderen ten
      genoegen van de bank schriftelijk heeft aangetoond dat deze kinderen in een gezinsverband met de overleden
      verzekerde man samen leefden.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel9
  - number: '10'
    text: |-
      Geen recht op wezenpensioen bestaat indien de verzekerde aan wiens overlijden het recht zou worden ontleend vóór
      het bereiken van de 60-jarige leeftijd nimmer verzekerd is geweest.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      Het weduwenpensioen bedraagt voor een weduwe jonger dan 40 jaar NAF. 312,– per maand van 40 t/m 48 jaar NAF. 409,–
      per maand van 49 t/m 57 jaar NAF. 512,– per maand van 58 en 59 jaar NAF. 674,– per maand
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel11
  - number: '11.2'
    text: |-
      Verhoging van het pensioenbedrag gaat in op de eerste dag van de maand volgende op die, waarin het recht op
      verhoging is ontstaan.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel11
  - number: '11.3'
    text: |-
      In afwijking van het bepaalde in het derde [bedoeld zal zijn: eerste] lid bedraagt het weduwenpensioen voor
      een weduwe die invalide is of die een of meer kinderen heeft die geheel te harer laste komen en recht hebben op
      wezenpensioen, NAF 674,– per maand.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel11
  - number: '11.4'
    text: |-
      Een weduwe is invalide, indien zij tengevolge van een ziekte of gebrek blijvend buiten staat geacht moet worden
      om met arbeid, die voor haar krachten en bekwaamheid is berekend de helft te verdienen van hetgeen lichamelijk en
      geestelijk gezonde vrouwen van soortgelijke bekwaamheid met arbeid gewoonlijk verdienen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel11
  - number: '11.5'
    text: |-
      De bank verklaart een weduwenpensioen, toegekend terzake van invaliditeit vervallen met ingang van de eerste dag
      van de maand volgende op die, waarin de weduwe geacht wordt niet langer invalide te zijn.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel11
  - number: '11.6'
    text: |-
      De bank is bevoegd uitkering van weduwenpensioen terzake van invaliditeit te weigeren, indien de weduwe, die
      een dergelijk pensioen geniet, zonder deugdelijke grond weigert zich aan een door de bank gewenst geneeskundig
      onderzoek te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel11
  - number: '11.7'
    text: |-
      De pensioenbedragen worden bij landsbesluit houdende algemene maatregelen, met inachtneming van het bepaalde in het
      volgende lid, aangepast aan de ontwikkeling van de prijsindexcijfers van de gezinsconsumptie.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel11
  - number: '11.8'
    text: |-
      Aanpassing van de pensioenbedragen heeft plaats met ingang van de eerste dag van enig kalenderjaar op basis van de
      stijging welke het prijsindexcijfer van de gezinsconsumptie voor de maand augustus daaraan voorafgaande aangeeft
      ten opzichte van het prijsindexcijfer voor de maand augustus van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel11
  - number: '12.1'
    text: |-
      Het wezenpensioen bedraagt voor een kind, dat door het overlijden van de verzekerde ouderloos is geworden,
      NAF. 246,– per maand, indien het jonger is dan 10 jaar en NAF. 270,– per maand indien het 10 jaar of ouder, doch
      nog geen 15 jaar is.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      Het wezenpensioen bedraagt voor een kind, dat door het overlijden van de verzekerde vaderloos onderscheidenlijk
      moederloos is geworden, NAF. 226,– per maand, indien het jonger is dan 10 jaar en NAF. 246,– per maand indien het
      10 jaar of ouder, doch nog geen 15 jaar is.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel12
  - number: '12.3'
    text: |-
      Het wezenpensioen bedraagt voor een kind, bedoeld in [artikel 9, vijfde lid][ref1], NAF. 270,– per maand, voor
      zover het voldoet aan artikel 9, eerste lid, onderdelen a of b, en NAF. 311,– per maand, voor zover het voldoet
      aan artikel 9, eerste lid, onderdelen c of d. [Artikel 11, vijfde en zesde lid][ref2], is van overeenkomstige
      toepassing op een wezenpensioen terzake van invaliditeit.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028387#Artikel11
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '9'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028387
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
  - number: '12.4'
    text: |-
      Indien op grond van meer dan één overlijden aanspraak op wezenpensioen kan worden gemaakt, wordt het hoogste
      wezenpensioen toegekend.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel12
  - number: '13'
    text: |-
      Waar in deze paragraaf wordt gesproken van pensioen wordt daaronder verstaan het weduwenpensioen en het
      wezenpensioen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel13
  - number: '14.1'
    text: Het pensioen wordt op aanvraag toegekend door de bank.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel14
  - number: '14.2'
    text: In afwijking van het bepaalde in het voorgaande lid is de bank bevoegd het pensioen ambtshalve toe te kennen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel14
  - number: '14.3'
    text: De aanvraag om pensioen wordt ingediend ter plaatse door de Minister aangewezen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel14
  - number: '15'
    text: |-
      Het pensioen gaat in op de eerste dag van de maand volgende op die, waarin het recht op pensioen is ontstaan, met
      dien verstande, dat het pensioen niet vroeger kan ingaan dan 12 maanden vóór de eerste dag van de maand volgende
      op die, waarin de aanvraag is ingediend of waarin ambtshalve toekenning heeft plaats gehad. De bank kan voor
      bijzondere gevallen van het bepaalde in de vorige volzin afwijken.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel15
  - number: '16.1'
    text: Het pensioen wordt door de bank betaalbaar gesteld. De betaling geschiedt als regel maandelijks.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel16
  - number: '16.2'
    text: |-
      De bank kan het aan een kind toegekende wezenpensioen betaalbaar stellen aan een ander dan degene, die het kind
      wettelijk vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel16
  - number: '16.3'
    text: |-
      In geval het pensioen in het buitenland wordt uitbetaald worden de daaraan verbonden kosten van overmaking op het
      pensioen in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel16
  - number: '16.4'
    text: |-
      Wanneer een weduwe een ander machtigt om het pensioen in ontvangst te nemen onderscheidenlijk een verleende
      machtiging intrekt, wordt daaraan gevolg gegeven met ingang van een betalingstermijn, aanvangend na de dag, waarop
      de machtiging wordt ingediend onderscheidenlijk waarop van haar intrekking mededeling wordt gedaan, doch niet later
      dan de eerste dag van de tweede maand na de dag van indiening onderscheidenlijk intrekking van de machtiging.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel16
  - number: '16.5'
    text: |-
      Bij landsbesluit houdende algemene maatregelen kunnen regelen worden gesteld inzake de betaalbaarstelling van
      het pensioen door organen, welke belast zijn met de uitbetaling van pensioen uit andere hoofde dan ingevolge deze
      landsverordening.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel16
  - number: '17.1'
    text: |-
      Indien een krachtens deze landsverordening gepensioneerde in een gesticht of door of vanwege een instelling
      van weldadigheid, door het openbaar gezag erkend wordt verzorgd of verpleegd en de kosten van verzorging of
      verpleging geheel of gedeeltelijk ten laste komen van een openbaar lichaam of een instelling van weldadigheid
      als vorenbedoeld, kan op verzoek van het desbetreffende orgaan het pensioen over volle kalendermaanden, gelegen
      binnen de duur van de verzorging of verpleging, voorzover het over die maanden nog niet is uitbetaald, aan het
      desbetreffende orgaan worden uitbetaald, met dien verstande dat aan dat orgaan niet meer wordt uitbetaald dan de te
      zijnen laste komende kosten van verzorging of verpleging bedragen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel17
  - number: '17.2'
    text: |-
      Voorzover in verband met het bepaalde in het voorgaande lid het pensioen niet werd uitbetaald aan de gepensioneerde
      of diens wettelijke vertegenwoordiger, wordt het na het overlijden van de gepensioneerde voorzover nodig in
      afwijking van het in [artikel 21][ref1] bepaalde, tot en met de laatste dag van de maand, waarin het overlijden
      heeft plaats gehad, uitbetaald aan het in het voorgaande lid bedoelde orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel21
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '18'
    text: |-
      De termijnen van het pensioen, welke niet zijn ingevorderd binnen twee jaar na de eerste dag waarop zij konden
      worden ingevorderd worden niet uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel18
  - number: '19.1'
    text: 'Onverminderd het elders in deze landsverordening bepaalde eindigt het recht op pensioen:'
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel19
  - number: 19.1.a
    text: door overlijden;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel19
  - number: 19.1.b
    text: voor wat de weduwe betreft tevens door hertrouwen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel19
  - number: '19.2'
    text: |-
      De uitbetaling van het pensioen eindigt met ingang van de maand volgende op die, waarin het feit heeft plaats gehad
      of de omstandigheid is ontstaan, als gevolg waarvan het recht op pensioen is geëindigd.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel19
  - number: '20'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel20
  - number: '21.1'
    text: |-
      Na het overlijden van degene, aan wie een pensioen is toegekend, wordt het pensioen tot en met de laatste dag
      van de maand waarin het overlijden heeft plaats gehad, uitbetaald aan de persoon of personen, die daarvoor naar
      het oordeel van de bank op billijkheidsoverwegingen in aanmerking komt onderscheidenlijk komen, mits deze daartoe
      binnen zes maanden na het overlijden een verzoek bij de bank heeft onderscheidenlijk hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel21
  - number: '21.2'
    text: |-
      Na het overlijden van degene, aan wie een pensioen is toegekend, wordt een bedrag ineens, gelijk aan driemaal
      het aan de overledene toegekende pensioen, uitbetaald aan de persoon of personen, die daarvoor naar het oordeel
      van de Bank op billijkheidsoverwegingen in aanmerking komt, onderscheidenlijk komen, mits deze daartoe binnen zes
      maanden na het overlijden een verzoek bij de Bank heeft, onderscheidenlijk hebben ingediend. De Bank is bevoegd de
      uitkering op een lager bedrag vast te stellen. De uitkering wordt betaalbaar gesteld in de maand volgende op die,
      waarin waarin een verzoek daartoe is ingediend.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel21
  - number: '22'
    text: |-
      Aan de weduwe, bedoeld in [artikel 19, eerste lid, onderdeel b][ref1], wordt een uitkering ineens verleend ter
      grootte van het bedrag, dat haar aan weduwenpensioen zou toekomen, indien zij niet was hertrouwd, doch ten hoogste
      ter grootte van het jaarbedrag van het weduwenpensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel19
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '19'
        hoofdstuk: III
        paragraaf: '3'
  - number: '23.1'
    text: 'Het pensioen is:'
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel23
  - number: 23.1.a
    text: onvervreemdbaar;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel23
  - number: 23.1.b
    text: niet vatbaar voor verpanding of belening;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel23
  - number: 23.1.c
    text: |-
      behoudens voor zover dit dient tot verhaal van onderhoud, waartoe de gerechtigde volgens wettelijke regeling is
      gehouden, niet vatbaar voor executoriaal of conservatoir beslag, noch voor faillissementsbeslag.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel23
  - number: '23.2'
    text: |-
      Voor zover op grond van lid 1 onder c beslag wordt gelegd, mag dit niet meer bedragen dan een derde gedeelte van
      het bedrag van het pensioen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel23
  - number: '23.3'
    text: |-
      Volmacht tot ontvangst van het pensioen onder welke vorm of benaming ook, door de gerechtigde verleend is steeds
      herroepelijk.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel23
  - number: '23.4'
    text: Elk beding, strijdig met enige bepaling van dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel23
  - number: 23a
    text: |-
      Degene die gehouden is tot vergoeding van de schade door de weduwe, weduwnaar of wezen geleden als gevolg van
      het overlijden van de verzekerde man of vrouw, is voor het pensioen van de weduwe weduwnaar of wezen toegekend
      krachtens deze landsverordening aansprakelijk jegens de bank.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel23a
  - number: '24.1'
    text: |-
      Behoudens het bepaalde in het volgende lid zijn de eenmaal uitbetaalde termijnen van het pensioen niet vatbaar
      voor terugvordering.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel24
  - number: '24.2'
    text: |-
      Hetgeen ten onrechte aan pensioen is uitbetaald kan worden teruggevorderd dan wel op latere pensioenbetalingen
      in mindering worden gebracht, wanneer het ten onrechte uitbetalen het gevolg is van het niet verstrekken van
      inlichtingen of het verstrekken van onjuiste inlichtingen door degene aan wie het pensioen is toegekend, door diens
      wettelijke vertegenwoordiger of door degene aan wie het pensioen is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel24
  - number: '24.3'
    text: |-
      Bij landsbesluit houdende algemene maatregelen kunnen nadere voorschriften worden gegeven ter uitvoering van dit
      artikel; daarbij kunnen tevens regels worden gesteld met betrekking tot schorsing en opschorting van de uitbetaling
      van het pensioen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel24
  - number: 24a.1
    text: |-
      De Bank is bevoegd om op grond van verdragen, convenanten andersoortige overeenkomsten met uitvoerders van
      instellingen van sociale voorzieningen, het pensioen van een gerechtigde te verminderen ter ontneming van een ten
      onrechte verkregen voordeel van de gerechtigde op het gebied van sociale voorzieningen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel24a
  - number: 24a.2
    text: |-
      De Bank is eveneens bevoegd om het pensioen van een gerechtigde te verminderen ter ontneming van een ten onrechte
      verkregen voordeel van de gerechtigde op het gebied van de door de Bank uitgevoerde sociale verzekeringswetten.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel24a
  - number: 24a.3
    text: |-
      De in het eerste en tweede lid bedoelde vermindering kan ineens geschieden indien het ten onrechte genoten voordeel
      niet groter is dan een derde deel van het door de Bank verstrekte weduwen- en wezenpensioen. In alle andere
      gevallen kan de vermindering niet meer bedragen dan een derde deel van het weduwen- of wezenpensioen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel24a
  - number: '25'
    text: |-
      Het land waarborgt zonder enig voorbehoud de betaling door de bank van het pensioen, waarop krachtens deze
      landsverordening aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel25
  - number: '26.1'
    text: |-
      De middelen tot dekking van de ingevolge deze landsverordening uit te keren pensioenen en van de aan de uitvoering
      van deze landsverordening verbonden kosten alsmede de middelen nodig voor het vormen en in stand houden van de bij
      landsbesluit houdende algemene maatregelen te bepalen reserve, worden gevonden door het heffen van premies van de
      verzekerden en uit overige inkomsten.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel26
  - number: '26.2'
    text: 'Aan de heffing van premie is niet onderworpen:'
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel26
  - number: 26.2.a
    text: de verzekerde, die de leeftijd van 60 jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel26
  - number: 26.2.b
    text: |-
      de gehuwde man wiens echtgenote in verband met het bepaalde in artikel 41 lid 2 sub c van de Landsverordening
      Algemene Ouderdomsverzekering (P.B. 1960, no. 83) recht op ouderdomspensioen heeft.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel26
  - number: '27.1'
    text: De premies worden gestort in een door de bank te beheren Weduwen- en wezenfonds.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel27
  - number: '27.2'
    text: |-
      De ingevolge deze landsverordening uit te keren pensioenen alsmede de aan de uitvoering van deze landsverordening
      verbonden kosten komen ten laste van het Weduwen- en wezenfonds.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel27
  - number: '28'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen worden voorschriften vastgesteld met betrekking tot de belegging
      van de gelden van het Weduwen- en wezenfonds.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel28
  - number: '29.1'
    text: |-
      De premie wordt met inachtneming van het bepaalde in de volgende leden geheven naar de maatstaf van het door
      de verzekerde in een kalenderjaar genoten inkomen en vastgesteld in een percentage van dat inkomen. Ten aanzien
      van degene, die slechts een gedeelte van een kalenderjaar verzekerd is geweest, treedt dit gedeelte voor het
      kalenderjaar in de plaats.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel29
  - number: '29.2'
    text: |-
      Onder inkomen wordt verstaan het zuiver inkomen in de zin van de Landsverordening op de inkomstenbelasting
      1943 (P.B. 1956, no. 9), vermeerderd met de krachtens laatstgenoemde landsverordening als persoonlijke last in
      aftrek toegelaten premies algemene ouderdomsverzekering en algemene weduwen en wezenverzekering en verminderd
      met de ingevolge deze landsverordening en de Landsverordening Algemene Ouderdomsverzekering (P.B. 1960, no. 83)
      uitgekeerde pensioenen en gedane uitkeringen
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel29
  - number: '29.3'
    text: |-
      Indien het inkomen meer bedraagt dan f 49.745,83 per jaar, wordt over dat meerdere geen premie geheven. Het
      bedrag van f 49.745,83 wordt naar tijdsruimte evenredig verlaagd ten aanzien van degene, die niet het gehele jaar
      verzekerd is geweest.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel29
  - number: '29.4'
    text: |-
      Van verzekerden, die niet of niet het gehele kalenderjaar in dienstbetrekking werkzaam zijn en wier inkomen minder
      dan NAF. 5.923,74 per jaar bedraagt, wordt de premie, voor zover deze niet bij wijze van inhouding is geheven,
      niet geheven.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel29
  - number: '29.5'
    text: |-
      Van verzekerden, die niet in dienstbetrekking werkzaam zijn en wier inkomen niet minder dan NAF. 5.923,74 doch
      wel minder dan NAF. 48.086,11 per jaar bedraagt, wordt de premie, bedoeld in het eerste lid, overeenkomstig bij
      landsbesluit, houdende algemene maatregelen, te stellen regels slechts voor een deel geheven.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel29
  - number: '29.6'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen met betrekking tot het eerste tot en met het vierde lid
      nadere regelen worden gesteld en kunnen de bedragen, genoemd in het derde tot en met het vijfde lid, ingeval van
      aanpassing van het pensioenbedrag als bedoeld in [artikel 7, tweede lid][ref1], op overeenkomstige wijze worden
      aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel7
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '30.1'
    text: |-
      Het in [lid 1 van het voorgaande artikel][ref1] bedoelde premiepercentage wordt vastgesteld bij landsbesluit,
      houdende algemene maatregelen, gehoord de bank.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel29
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '29'
        hoofdstuk: IV
  - number: '30.2'
    text: |-
      Als regel wordt het premiepercentage telkens voor een periode van vijf jaren vastgesteld en wel zodanig dat het
      totaal van de over de eerstvolgende periode te ontvangen premies voldoende zal zijn om daaruit de uitgaven van het
      Weduwen- en wezenfonds over dat tijdvak te voldoen alsmede om de in [artikel 25][ref1] bedoelde reserve te vormen
      en in stand te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel25
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '25'
        hoofdstuk: III
        paragraaf: '4'
  - number: '31'
    text: |-
      De Minister van Financiën is bevoegd, met inachtneming van het vastgestelde premiepercentage, de ingevolge deze
      landsverordening verschuldigde premies te doen berekenen volgens tabellen. Bij het opstellen van deze tabellen en
      voor de toepassing daarvan bepaalt de Minister van Financiën de door hem nodig geachte afrondingen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel31
  - number: '32.1'
    text: |-
      Tenzij bij of krachtens deze landsverordening anders is bepaald, geschiedt de heffing van de ingevolge deze
      landsverordening verschuldigde premies, onder verrekening van eventueel krachtens het tweede lid geheven premies,
      bij wege van aanslag en met overeenkomstige toepassing van de voor de heffing van de inkomstenbelasting geldende
      regelen met dien verstande, dat aan de verzekerde, die niet wordt aangeslagen in de inkomstenbelasting, niettemin
      een aanslag wordt opgelegd voor de door hem verschuldigde premies.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32
  - number: '32.2'
    text: |-
      De premie van verzekerden, die in dienstbetrekking werkzaam zijn, wordt geheven bij wege van inhouding door de
      werkgever. Indien de ingevolge [artikel 29 lid 1][ref1] in totaal over een kalenderjaar verschuldigde premie door
      inhouding is geheven, blijft het bepaalde in het voorgaande lid buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel29
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '29'
        hoofdstuk: IV
  - number: '32.3'
    text: |-
      Het bepaalde in de artikelen 3, leden 2, 3, 4, en 5, 4, leden 2 en 4, 21, lid 1, 21a, 21b, 21c en 21d van
      de Landsverordening op de Loonbelasting 1976 (P.B. 1975, no. 254) is van overeenkomstige toepassing ten
      aanzien van de ingevolge deze landsverordening verschuldigde premies, met dien verstande dat in de plaats van
      «inhoudingsplichtige(n)» telkens gelezen wordt «werkgever(s)».
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32
  - number: '32.4'
    text: |-
      Invordering van de premie, de administratieve boete en al hetgeen de Bank verder uit hoofde van deze
      landsverordening te vorderen heeft, heeft plaats volgens de regels, welke van toepassing zijn op de invordering van
      de directe belastingen, met dien verstande dat de Bank in plaats van de Ontvanger met de invordering is belast.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32
  - number: '32.5'
    text: |-
      De Minister en de Minister van Financiën geven voorschriften inzake hetgeen nader geregeld moet worden met
      betrekking tot de heffing, de invordering en de afdracht van de premie ingevolge deze landsverordening.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32
  - number: '32.6'
    text: |-
      Met betrekking tot het in dit artikel bepaalde, kunnen bij landsbesluit, houdende algemene maatregelen nadere
      regelen worden vastgesteld voor bepaalde personen of groepen van personen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32
  - number: 32a.1
    text: |-
      De werkgever is verplicht de premie, die hij over een tijdvak van een maand of korter heeft ingehouden of had
      moeten inhouden binnen vijftien dagen na het einde van die maand, op aangifte af te dragen. Indien de inhouding
      over een tijdvak van langer dan een maand geschiedt, is de werkgever verplicht de premie binnen vijftien dagen na
      het einde van dat tijdvak, op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32a
  - number: 32a.2
    text: |-
      De aangifte wordt gelijktijdig met de afdracht gedaan bij de Bank. Indien evenwel krachtens [artikel 5][ref1] een
      instantie is aangewezen, geschiedt de aangifte bij die instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel5
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '5'
        hoofdstuk: I
  - number: 32a.3
    text: De Inspecteur kan onder door hem te stellen voorwaarden uitstel van het indienen van aangifte verlenen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32a
  - number: 32a.4
    text: |-
      De Inspecteur kan van de werkgever die de premie over een tijdvak van langer dan een maand moet afdragen, vorderen
      dat hij binnen vijftien dagen na het einde van elke maand een gedeelte van de in te houden premie bij wijze van
      voorlopige betaling afdraagt.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32a
  - number: 32a.5
    text: |-
      Ook in de gevallen, dat geen premie behoeft te worden ingehouden, moet de aangifte op de in de vorige leden
      aangegeven tijden ingediend worden. Personen, die stellen geen werkgevers te zijn, moeten niettemin de hen
      verstrekte aangifteformulieren binnen vijftien dagen na het einde van de maand, waarin de aangifteformulieren hen
      zijn verstrekt, indienen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32a
  - number: 32a.6
    text: |-
      De Inspecteur verstrekt de inhoudingsplichtige het benodigde aantal aangifteformulieren. Hetzij op diens verzoek,
      hetzij ambtshalve.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32a
  - number: 32b.1
    text: |-
      Indien de premie geheel of gedeeltelijk niet binnen de voorgeschreven tijd is afgedragen kan de te weinig
      afgedragen premie door middel van een aanslag, op te leggen ten name van de werkgever, worden ingevorderd. De
      werkgever is gerechtigd het nageheven bedrag te verhalen op zijn werknemer voor zover het betrekking heeft op van
      de werknemer ten onrechte niet ingehouden premie.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32b
  - number: 32b.2
    text: |-
      De in deze aanslag te begrijpen premie kan bij wijze van boete verhoogd worden met ten hoogste honderd procent doch
      met tenminste vijftien gulden. De werkgever is niet gerechtigd deze boete op zijn werknemers te verhalen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32b
  - number: 32b.3
    text: |-
      Indien aan de verplichting opgelegd in het [vijfde lid van het vorige artikel][ref1] niet wordt voldaan en ten
      gevolge daarvan de aanslag in zijn geheel moet worden verminderd, bedraagt de boete vijftien gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel32a
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: 32a
        hoofdstuk: IV
  - number: '33.1'
    text: |-
      Indien bij het vaststellen van de premie-aanslag of bij controle van de door de werkgevers ingehouden premie blijkt
      dat te veel of te weinig is ingehouden dan wel teveel of te weinig is betaald op een voorlopige premie-aanslag,
      wordt het meerdere gerestitueerd en het mindere alsnog ingevorderd.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel33
  - number: '33.2'
    text: |-
      Geen restitutie of invordering als bedoeld in het vorige lid heeft plaats, indien het te restitueren of alsnog in
      te vorderen bedrag lager is dan f 5,–.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel33
  - number: '33.3'
    text: In het geval als bedoeld in het tweede lid blijft het opleggen van de definitieve premie-aanslag achterwege.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel33
  - number: '34'
    text: |-
      Degene, op wie volgens de bepalingen van deze landsverordening de plicht rust premie te betalen, is verplicht
      aangifte te doen van zijn inkomen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel34
  - number: '35'
    text: |-
      De gepensioneerde alsmede degene aan wie of het openbaar lichaam of de instelling van weldadigheid aan hetwelk het
      pensioen ingevolge [artikel 17][ref1] geheel of gedeeltelijk wordt uitbetaald is verplicht van elke verandering van
      feiten en omstandigheden, welke op het recht op pensioen van invloed is, onverwijld schriftelijk mededeling te doen
      aan de bank.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel17
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '17'
        hoofdstuk: III
        paragraaf: '3'
  - number: '36.1'
    text: |-
      Een ieder is verplicht aan de bank, aan een orgaan, belast met de uitvoering van enig deel van deze
      landsverordening of aan enig door of vanwege een dezer instanties aangewezen persoon de ten behoeve van de
      uitvoering der landsverordening van hem gevraagde inlichtingen te geven.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel36
  - number: '36.2'
    text: |-
      De inlichtingen moeten, indien dit wordt verzocht, schriftelijk worden verstrekt binnen een door een in het eerste
      lid bedoelde instantie of persoon schriftelijk te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel36
  - number: '36.3'
    text: |-
      Een ieder is verplicht aan een in het vorige lid bedoelde instantie of aan een door of vanwege deze daartoe
      aangewezen persoon desgevraagd inzage te verlenen van boeken, bescheiden en andere stukken, voor zover dat nodig is
      ten behoeve van de uitvoering van deze landsverordening.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel36
  - number: '37.1'
    text: |-
      Publiekrechtelijke lichamen zijn verplicht op de door de Minister van Algemene Zaken aan te geven wijze
      kosteloos hun medewerking te verlenen tot het verkrijgen van de inlichtingen, benodigd voor de uitvoering dezer
      landsverordening.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel37
  - number: '37.2'
    text: |-
      De bestuurscolleges der onderscheidene eilandgebieden zijn verplicht er zorg voor te dragen dat aan een der in het
      [eerste lid van artikel 36][ref1] bedoelde instanties de door deze gevraagde gegevens kosteloos worden toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel36
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '36'
        hoofdstuk: V
  - number: '38.1'
    text: |-
      Aan de belanghebbende wordt schriftelijk kennis gegeven van een beslissing ingevolge deze landsverordening, welke
      verband houdt met het recht op en de uitbetaling van pensioen of uitkering.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel38
  - number: '38.2'
    text: |-
      Een kennisgeving, als in het voorgaande lid bedoeld, vermeldt de dagtekening van de beslissing, de gronden waarop
      deze berust, alsmede behoudens indien het betreft een beslissing ingevolge [artikel 21][ref1] bij wie beroep kan
      worden ingesteld en de termijn van beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel21
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '39'
    text: |-
      Tegen een beslissing waarvan ingevolge [artikel 38][ref1] schriftelijk kennis is gegeven staat, behoudens indien
      het betreft een beslissing ingevolge [artikel 21][ref2], voor belanghebbende binnen zes weken na de dag waarop deze
      is gegeven, beroep open bij het Gerecht in eerste aanleg van de Nederlandse Antillen.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0028387#Artikel21
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '38'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0028387
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '40.1'
    text: |-
      Voor zover bij of krachtens deze landsverordening niet anders is bepaald zijn, naar gelang de ingevolge deze
      landsverordening verschuldigde premies en boeten bij wege van aanslag, dan wet bij wijze van inhouding worden
      geheven, de voor heffing van de inkomstenbelasting geldende regelen inzake de rechtsmiddelen van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel40
  - number: '40.2'
    text: |-
      De Inspecteur doet op een bezwaarschrift eerst uitspraak nadat is komen vast te staan, dat geen feiten en
      omstandigheden in geding zijn, welke tevens van belang zijn voor de heffing van inkomstenbelasting, dan wel
      voor zover zulk wel het gevat is, de beslissing daaromtrent voor de heffing van die belasting onherroepelijk is
      geworden.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel40
  - number: '40.3'
    text: |-
      Met betrekking tot een navorderingsaanslag, welke geheel of gedeeltelijk berust op feiten, welke mede tot het
      opleggen van een navorderingsaanslag in de inkomstenbelasting ten laste van belanghebbende aanleiding hebben
      gegeven, neemt de termijn voor het instellen van beroep eerst een aanvang op de datum, waarop laatstbedoelde
      navorderingsaanslag onherroepelijk is komen vast te staan.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel40
  - number: '40.4'
    text: |-
      Tegen hetgeen omtrent de toepassing van [artikel 2][ref1] dezer landsverordening, alsmede omtrent het zuiver
      inkomen in de zin van de Landsverordening op de inkomstenbelasting 1943 (P.B. 1956, no. 9) voor de heffing van die
      belasting onherroepelijk is komen vast te staan, is beroep niet toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel2
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '2'
        hoofdstuk: I
  - number: '41.1'
    text: |-
      De weduwe, wier echtgenoot is overleden vóór de dag van inwerkingtreding van deze landsverordening en die op
      die dag nog geen 65 jaar oud is, heeft van die dag af recht op weduwenpensioen naar de bepalingen van deze
      landsverordening, indien zij dat recht zou hebben gehad wanneer deze landsverordening op het tijdstip van
      overlijden van haar echtgenoot reeds van kracht zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel41
  - number: '41.2'
    text: |-
      De wettige, gewettigde en door de vader erkende natuurlijke kinderen, wier vader is overleden vóór de dag van
      inwerkingtreding van deze landsverordening en die op die dag nog geen 15 jaar oud zijn, hebben van die dag af naar
      de bepalingen van deze landsverordening recht op wezenpensioen, indien zij dat recht zouden hebben gehad wanneer
      deze landsverordening op het tijdstip van overlijden reeds van kracht geweest zou zijn.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel41
  - number: '41.3'
    text: |-
      De kinderen, wier moeder is overleden vóór de dag van inwerkingtreding van deze landsverordening en die als gevolg
      daarvan ouderloos zijn geworden en die op de dag van inwerkingtreding van deze landsverordening nog geen 15 jaar
      oud zijn, hebben van die dag af naar de bepalingen van deze landsverordening recht op wezenpensioen, indien zij
      dat recht zouden hebben gehad wanneer deze landsverordening op het tijdstip van overlijden reeds van kracht zou
      zijn geweest.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel41
  - number: '41.4'
    text: |-
      Het bepaalde in de voorgaande leden is slechts van toepassing op Nederlanders, die in de Nederlandse Antillen
      wonen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel41
  - number: '41.5'
    text: Een kind kan tegelijkertijd slechts op grond van één overlijden wezenpensioen genieten.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel41
  - number: '42'
    text: 'Bij landsbesluit, houdende algemene maatregelen kan onder nader daarbij te stellen voorwaarden worden bepaald, dat:'
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel42
  - number: 42.a
    text: |-
      voor de toepassing van [artikel 41][ref1] niet-Nederlanders met Nederlanders worden gelijkgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel41
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '41'
        hoofdstuk: VII
  - number: 42.b
    text: het wonen buiten de Nederlandse Antillen met het wonen in de Nederlandse Antillen wordt gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel42
  - number: 42a.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze landsverordening bepaalde zijn belast de daartoe bij
      landsbesluit aangewezen personen Een zodanige aanwijzing wordt bekendgemaakt in De Curaçaosche Courant.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel42a
  - number: 42a.2
    text: |-
      De krachtens het eerste lid aangewezen personen zijn, uitsluitend voorzover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel42a
  - number: 42a.2.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel42a
  - number: 42a.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel42a
  - number: 42a.2.c
    text: |-
      alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel42a
  - number: 42a.3
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld m het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel42a
  - number: 42a.4
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen regels worden gesteld met betrekking tot de wijze van
      taakuitoefening van de krachtens het eerste lid aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel42a
  - number: 42a.5
    text: |-
      Een ieder is verplicht aan de krachtens het eerste lid aangewezen personen alle medewerking te verlenen die in het
      kader van de toezichtsuitoefening op grond van het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel42a
  - number: '43.1'
    text: |-
      Hij, die niet voldoet aan een der verplichtingen opgelegd in de [artikelen 35][ref1] en [36][ref2] wordt gestraft
      met hechtenis van ten hoogste zes maanden of geldboete van ten hoogste zes honderd gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0028387#Artikel36
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '35'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0028387
        artikel: '36'
        hoofdstuk: V
  - number: '43.2'
    text: |-
      De werkgever, die niet voldoet aan de verplichting, opgelegd in [artikel 52][ref1], wordt gestraft met hechtenis
      van ten hoogste zes maanden of geldboete van ten hoogste éénduizend gulden. Deze straf kan worden opgelegd voor elk
      geval waarin een werkgever voor een zijner werknemers de in dit lid bedoelde verplichting niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel52
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '52'
        hoofdstuk: IX
  - number: '43.3'
    text: |-
      Hij, die niet of niet volledig voldoet aan de verplichting, hem opgelegd in [artikel 32A][ref1], wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van ten hoogste tienduizend gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel32a
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: 32a
        hoofdstuk: IV
  - number: '44'
    text: |-
      Hij, die op grond van bij of krachtens deze landsverordening vastgestelde bepalingen gehouden is inlichtingen of
      gegevens te verstrekken, een aangifte of mededeling te doen of een verklaring af te leggen en daarbij opzettelijk
      een valse opgave doet dan wel opzettelijk in strijd met bedoelde gehoudenheid iets verzwijgt, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel44
  - number: '45'
    text: |-
      Hij, die op andere wijze dan door het valselijk opmaken of vervalsen van een geschrift, dat bestemd is tot bewijs
      van enig feit te dienen opzettelijk een opgave doet in strijd met de waarheid, zulks met het oogmerk om aldus een
      uitkering of een hogere uitkering involge deze landsverordening te verkrijgen, wordt gestraft met gevangenisstraf
      van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel45
  - number: '46'
    text: |-
      Overtredingen van bepalingen van een krachtens deze landsverordening vastgesteld landsbesluit, houdende algemene
      maatregelen, voor zover uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met
      hechtenis van ten hoogste een maand of geldboete van ten hoogste honderd gulden.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel46
  - number: '47'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel47
  - number: '48.1'
    text: |-
      Met de opsporing van de bij deze landsverordening strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering][ref1] bedoelde personen, belast de daartoe bij landsbesluit
      aangewezen ambtenaren. Een zodanige aanwijzing wordt bekendgemaakt in De Curaçaosche Courant.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel184
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '184'
  - number: '48.2'
    text: |-
      Bij landsbesluit, houdende algemene maatregelen, kunnen regels worden gesteld met betrekking tot de: vereisten
      waaraan de krachtens het eerste lid aangewezen ambtenaren dienen te voldoen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel48
  - number: '49'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel49
  - number: '50.1'
    text: |-
      De in [artikel 48][ref1] bedoelde personen zijn verplicht tot geheimhouding van hetgeen hun bij het toezicht op
      de naleving der bij of krachtens deze landsverordening vastgestelde bepalingen is bekend geworden, voor zover die
      geheimhouding niet in strijd is met deze of een andere algemene verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel48
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '48'
        hoofdstuk: VIII
  - number: '50.2'
    text: |-
      Hij, die de bij het vorige lid opgelegde geheimhouding opzettelijk schendt, wordt gestraft met gevangenisstraf van
      ten hoogste zes maanden of geldboete van ten hoogste zes honderd gulden.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel50
  - number: '50.3'
    text: |-
      Hij, aan wiens schuld schending van die geheimhouding te wijten is, wordt gestraft met hechtenis van ten hoogste
      drie maanden of geldboete van ten hoogste driehonderd gulden.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel50
  - number: '50.4'
    text: Geen vervolging heeft plaats dan op klachte van hem, te wiens aanzien de geheimhouding is geschonden.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel50
  - number: '51'
    text: |-
      De in de [artikelen 43, derde lid][ref1], [44][ref2], [45][ref3] en [50][ref4] bedoelde strafbare feiten worden als
      misdrijven, de in de artikelen 43, eerste en tweede lid, en [46][ref5] bedoelde strafbare feiten als overtredingen
      beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0028387#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0028387#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0028387#Artikel50
      [ref5]: https://wetten.overheid.nl/BWBR0028387#Artikel46
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '43'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0028387
        artikel: '44'
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0028387
        artikel: '45'
        hoofdstuk: VIII
      - id: ref4
        bwb_id: BWBR0028387
        artikel: '50'
        hoofdstuk: VIII
      - id: ref5
        bwb_id: BWBR0028387
        artikel: '46'
        hoofdstuk: VIII
  - number: '52'
    text: |-
      Werkgevers, die personen in dienst hebben, die krachtens deze landsverordening verzekerd zijn, betalen aan hen ter
      compensering van de door hen te betalen premie een toeslag op het loon, welke tenminste gelijk is aan de helft van
      de premie.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel52
  - number: '53.1'
    text: |-
      Op de weduwen- en wezenpensioenen of uitkeringen waarop krachtens een pensioenregeling van een pensioenfonds of
      van een werkgever aanspraak bestaat, mogen de pensioenen, waarop krachtens deze landsverordening aanspraak bestaat,
      niet in mindering worden gebracht.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel53
  - number: '53.2'
    text: |-
      De Minister kan, gehoord de bank, ontheffing verlenen van het in het voorgaande lid bepaalde met dien verstande,
      dat geen hoger percentage van de krachtens deze landsverordening toegekende pensioenen in mindering mag worden
      gebracht dan de helft van het percentage, dat de bijdrage of premie van de werkgever uitmaakt van de totale premie
      of bijdrage voor de krachtens de in het eerste lid bedoelde pensioenregeling te genieten weduwen- en wezenpensioen.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel53
  - number: '54'
    text: |-
      Wanneer het Weduwen- en wezenfonds tijdelijk niet voldoende middelen heeft tot dekking van de uitkeringen en
      kosten, welke op grond van [artikel 26 lid 2][ref1] ten laste van dit fonds komen, verstrekt het Land renteloze
      voorschotten aan het fonds onder door de Minister en de Minister van Financiën te stellen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel26
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0028387
        artikel: '26'
        hoofdstuk: IV
  - number: '55'
    text: |-
      Hetgeen overigens nog ter uitvoering van deze landsverordening nodig is, wordt bij landsbesluit, houdende algemene
      maatregelen geregeld.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel55
  - number: '56'
    text: '[wijzigt de Landsverordening Ouderdomsvoorziening]'
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel56
  - number: '57'
    text: |-
      Alle ingevolge deze landsverordening opgemaakte of overgelegde stukken, verzoekschriften en beschikkingen zijn vrij
      van het recht van zegel en van de formaliteit van registratie.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel57
  - number: '58.1'
    text: Deze landsverordening kan worden aangehaald als Landsverordening Algemene Weduwen- en wezenverzekering.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel58
  - number: '58.2'
    text: |-
      Zij treedt in werking op een nader bij landsbesluit te bepalen datum, welke voor de onderscheidene artikelen
      verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0028387/2010-10-10#Artikel58
