  - number: 2.4.6
    text: |-
      Indien de beheerder van het gesloten distributiesysteem geen gebruik maakt van suballocatie, of van de in de
      [Allocatiecode gas][ref1] genoemde berichten geeft hij de regionale netbeheerder in de desbetreffende regio de
      mogelijkheid om de in [2.4.4][ref2] bedoelde verbruiker of invoeder te voorzien van een aansluiting op het net van
      die regionale netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037931
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Artikel2.4.4
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.4.6
    references:
      - id: ref1
        bwb_id: BWBR0037931
      - id: ref2
        bwb_id: BWBR0037926
        artikel: 2.4.4
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.7
    text: |-
      Op een recreatienet is [2.4.4 tot en met 2.4.6][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.4.4
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.4.7
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.4.4
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.5.1.1
    text: |-
      Bij opstelling van verscheidene invoedingsinstallaties op één locatie gelden de in deze paragraaf genoemde
      voorwaarden voor elke invoedingsinstallatie afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1.1
  - number: 2.5.1.2
    text: |-
      De voorwaarden gelden voor het technisch ontwerp en het gedrag tijdens bedrijf van de invoedingsinstallatie in
      zijn totaliteit.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1.2
  - number: 2.5.1.3
    text: |-
      De voorwaarden in de [paragrafen 2.5][ref1] en [3.4][ref2] zijn van toepassing op de invoeding van gas zoals
      bedoeld in [artikel 1, eerste lid, onderdeel b, van de Gaswet][ref3] en dat voldoet aan de kwaliteitsspecificaties
      zoals bedoeld in [artikel 2, tweede lid, van de Regeling gaskwaliteit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0035367#Artikel2
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037926
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037926
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0035367
        artikel: '2'
  - number: 2.5.1.4
    text: |-
      In geval van invoeding van andere gassen dan bedoeld in [2.5.1.3][ref1], kan de netbeheerder in overleg met
      de invoeder voor onderdelen van [paragrafen 2.5][ref2] en [3.4][ref3] aanvullende of afwijkende voorwaarden
      overeenkomen op basis van maatwerk, voor die gevallen waarin de in genoemde paragrafen opgenomen voorwaarden niet
      voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0037926#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.1.3
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037926
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref3
        bwb_id: BWBR0037926
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 2.5.1.5
    text: De regionale netbeheerder bepaalt de druk waarbij en de plaats in het net waarop het gas wordt ingevoed.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1.5
  - number: 2.5.1.6
    text: |-
      De regionale netbeheerder maakt op verzoek van de invoeder binnen een maand een verkenning naar
      invoedingsmogelijkheden op basis waarvan de invoeder kan beslissen om over te gaan tot een offerteverzoek aan de
      netbeheerder voor een aansluiting van een invoedingsinstallatie. De invoeder doet bij dit verzoek een opgave van
      de beoogde invoedingslocatie en de gewenste invoedingscapaciteit. Aan de uitkomsten van deze verkenning kunnen geen
      rechten worden ontleend.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1.6
  - number: 2.5.1.7
    text: |-
      De regionale netbeheerder brengt binnen twee maanden na een schriftelijk verzoek daartoe een offerte uit voor de
      aansluiting van een invoedingsinstallatie, waarbij de maximaal geoffreerde capaciteit is gebaseerd op de op grond
      van [2.5.1.6][ref1] uitgevoerde verkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1.6
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.1.6
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.1.8
    text: |-
      De regionale netbeheerder handelt offerteaanvragen, zoals bedoeld in [2.5.1.7][ref1], af in volgorde van
      binnenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1.7
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1.8
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.1.7
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.1.9
    text: |-
      De in [2.5.1.7][ref1] bedoelde offerte heeft een geldigheidstermijn van drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1.7
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1.9
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.1.7
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.1.10
    text: |-
      Gedurende de periode vanaf het schriftelijk verzoek, zoals bedoeld in [2.5.1.7][ref1], tot het aflopen van de
      geldigheidstermijn van de offerte, zoals bedoeld in [2.5.1.9][ref2], reserveert de regionale netbeheerder een
      hoeveelheid transportcapaciteit conform de offerteaanvraag van de invoeder, zoals bedoeld in 2.5.1.7, tot maximaal
      de hoeveelheid zoals vastgesteld in de verkenning op grond van [2.5.1.6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1.7
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1.9
      [ref3]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1.6
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1.10
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.1.7
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037926
        artikel: 2.5.1.9
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref3
        bwb_id: BWBR0037926
        artikel: 2.5.1.6
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.1.11
    text: |-
      Indien geen verkenning, zoals bedoeld in [2.5.1.6][ref1], is uitgevoerd voorafgaand aan de offerteaanvraag,
      zoals bedoeld in [2.5.1.7][ref2], bepaalt de netbeheerder de hoeveelheid transportcapaciteit die ten behoeve
      van deze offerteaanvraag gereserveerd wordt, tot een maximum van de transportcapaciteit zoals verzocht in de
      offerteaanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1.6
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1.7
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1.11
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.1.6
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037926
        artikel: 2.5.1.7
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.1.12
    text: |-
      Indien een invoeder niet binnen de in [2.5.1.9][ref1] bedoelde geldigheidstermijn van de offerte overgaat
      tot opdrachtverstrekking voor aansluiting van de invoedingsinstallatie, vervalt de in [2.5.1.10][ref2] en
      [2.5.1.11][ref3] bedoelde reservering van transportcapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1.9
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1.10
      [ref3]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1.11
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1.12
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.1.9
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037926
        artikel: 2.5.1.10
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref3
        bwb_id: BWBR0037926
        artikel: 2.5.1.11
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.1.13
    text: |-
      Indien op grond van [2.5.1.12][ref1] een reservering van transportcapaciteit vervalt, beoordeelt de netbeheerder
      de consequenties hiervan voor andere lopende offerteaanvragen voor aansluiting van een invoedingsinstallatie en
      informeert de aanvragers hierover. Bij de herverdeling van beschikbare transportcapaciteit handelt de netbeheerder
      in volgorde van aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1.12
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1.13
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.1.12
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.1a.1
    text: |-
      De aansluiting van de invoedingsinstallatie is voorzien van een monsterafnamepunt. Indien tussen de regionale
      netbeheerder en de invoeder op grond van [2.5.2.5a][ref1] wordt overeengekomen dat door de netbeheerder niet op
      afstand kan worden ingegrepen via de voorziening voor automatische afschakeling in de invoedingsinstallatie, zoals
      bedoeld in [2.5.2.5][ref2], is de aansluiting tevens voorzien van een door de regionale netbeheerder te bedienen
      afsluitklep, om de invoeding op afstand te kunnen afschakelen.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.2.5a
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.2.5
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1a.1
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.2.5a
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037926
        artikel: 2.5.2.5
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.1a.2
    text: |-
      De leidinglengte tussen het monsterafnamepunt en de plaats waar op grond van [2.5.2.4a][ref1] injectie van odorant
      plaats vindt, bedraagt tenminste 100 maal de leidingdiameter.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.2.4a
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1a.2
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.2.4a
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.1a.3
    text: |-
      Indien de injectie van het odorant, zoals bedoeld in [2.5.2.4a][ref1], plaats vindt aan de netzijde van de
      meetinrichting, bevindt het overdrachtspunt van de aansluiting zich, in afwijking van [2.1.1.4][ref2] jo.
      [2.1.2.3][ref3], op de eerste koppeling van de inlaatafsluiter van de aansluiting van de invoedingsinstallatie,
      zoals bedoeld in [2.5.1a.1][ref4], gezien vanuit de invoedingsinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.2.4a
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Artikel2.1.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0037926#Artikel2.1.2.3
      [ref4]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1a.1
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.1a.3
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.2.4a
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0037926
        artikel: 2.1.1.4
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0037926
        artikel: 2.1.2.3
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0037926
        artikel: 2.5.1a.1
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.2.1
    text: |-
      De invoedingsinstallatie is voorzien van een drukregeling en drukbeveiliging conform NEN 1059:2010 “Nederlandse
      editie op basis van NEN-EN 12186 en NEN-EN 12279 – Gasvoorzieningssystemen – Gasdrukregelstations voor transport
      en distributie” indien de werkdruk ten hoogste 0,5 bar is en conform NEN-EN 15001-1 “Gasinfrastructuur –
      Gasinstallatieleidingen” indien de werkdruk hoger is dan 0,5 bar en ten hoogste 40 bar. De instelling van deze
      drukregeling geschiedt in overleg tussen de invoeder en de regionale netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.2.1
  - number: 2.5.2.2
    text: |-
      De beveiligingen van de invoedingsinstallatie zijn selectief ten opzichte van de beveiligingen in het regionale
      gastransportnet. De invoeder draagt zorg voor en is verantwoordelijk voor adequate beveiligingen van de
      invoedingsinstallatie tegen zowel storingen die ontstaan in het regionale gastransportnet als extreme afwijkingen
      van de druk in het regionale gastransportnet.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.2.2
  - number: 2.5.2.3
    text: |-
      De invoedingsinstallatie is voorzien van twee in serie geschakelde gasgestuurde drukbeveiligingen, ten behoeve van
      de automatische afschakeling van de invoedingsinstallatie ingeval de invoedingsdruk boven een in overleg tussen
      regionale netbeheerder en invoeder vast te stellen waarde komt. Beide drukbeveiligingen werken bij voorkeur volgens
      een onderling verschillend principe.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.2.3
  - number: 2.5.2.4
    text: |-
      De invoedingsinstallatie is voorzien van een voorziening voor de meting van de temperatuur van het in te voeden
      gas.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.2.4
  - number: 2.5.2.4a
    text: |-
      De invoedingsinstallatie is voorzien van een voorziening voor injectie van odorant zoals bedoeld in
      [bijlage 2 van de Regeling gaskwaliteit][ref1]. Deze voorziening bevat een bewaking van de volumevoorraad odorant
      en een controlemogelijkheid voor de odorisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0035367
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.2.4a
    references:
      - id: ref1
        bwb_id: BWBR0035367
  - number: 2.5.2.4b
    text: |-
      De invoedingsinstallatie is voorzien van een voorziening om partikels met een diameter groter dan 0,3 micrometer te
      weerhouden met een doeltreffendheid van minimaal 99,95%. Van deze voorwaarde wordt afgezien wanneer:

      i) de invoeder een rapport overlegt aan de netbeheerder waaruit blijk dat er geen schadelijke organismen kunnen
      voorkomen of zich kunnen vormen in het in te voeden gas;

      ii) de netbeheerder de inhoud van het rapport heeft geverifieerd, en de juistheid daarvan heeft kunnen vaststellen;

      De netbeheerder informeert de invoeder over zijn bevindingen ten aanzien van de juistheid van het overlegde rapport
      uiterlijk 4 weken na overleggen van dit rapport.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.2.4b
  - number: 2.5.2.4c
    text: |-
      De invoedingsinstallatie is voorzien van een gaskwaliteitsmeetinrichting, die voldoet aan de
      voorwaarden in [hoofdstuk 5a van de Meetcode gas RNB](onbekend), ten behoeve van registratie en
      vaststelling van de fysische eigenschappen en hoedanigheden van het in te voeden gas, zoals bedoeld in
      [artikel 2, tweede lid, van de Regeling gaskwaliteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035367#Artikel2
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.2.4c
    references:
      - id: ref1
        bwb_id: BWBR0035367
        artikel: '2'
  - number: 2.5.2.5
    text: |-
      De invoedingsinstallatie is voorzien van een voorziening ten behoeve van automatische afschakeling waarmee
      de invoedingsinstallatie wordt afgeschakeld, indien de kwaliteit van het in te voeden gas buiten de in
      [artikel 2, tweede lid, van de Regeling gaskwaliteit][ref1] bedoelde grenzen voor de gaskwaliteit komt, blijkend
      uit het signaal van één of meer van de in [2.5.2.4][ref2] en [2.5.2.4a][ref3] bedoelde bewakingsvoorzieningen of
      uit de doorlopende kwaliteitsbewaking, zoals bedoeld in [5a.2.5 van de Meetcode gas RNB](onbekend). De afschakeling
      duurt zo lang de gaskwaliteit zich buiten de in artikel 2, tweede lid, van de Regeling gaskwaliteit bedoelde
      grenzen bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0035367#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.2.4
      [ref3]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.2.4a
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.2.5
    references:
      - id: ref1
        bwb_id: BWBR0035367
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037926
        artikel: 2.5.2.4
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref3
        bwb_id: BWBR0037926
        artikel: 2.5.2.4a
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.2.5a
    text: |-
      Door de netbeheerder kan op afstand worden ingegrepen via de voorziening voor automatische afschakeling, zoals
      bedoeld in [2.5.2.5][ref1], om de invoeding te kunnen onderbreken, tenzij de netbeheerder en de invoeder zijn
      overeengekomen dat de aansluiting van de invoedingsinstallatie is voorzien van een door de regionale netbeheerder
      te bedienen afsluitklep. Deze automatische afstandschakeling vindt plaats conform het Modbus/IEC 60870-5 protocol.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.2.5
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.2.5a
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.2.5
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5.2.6
    text: De invoedingsinstallatie is voorzien van een voorziening voor monsterafname.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.2.6
  - number: 2.5.2.9
    text: |-
      Indien niet aan de voorwaarden voor invoeders wordt voldaan zodat de gaskwaliteit, de systeemintegriteit van het
      gasdistributienet of de veiligheid in het geding zijn, heeft de regionale netbeheerder uit voorzorg het recht
      op het onmiddellijk afsluiten van de invoedingsinstallatie. De regionale netbeheerder stelt de invoeder daarvan
      onmiddellijk op de hoogte. Indien anderszins niet aan de voorwaarden voor invoeders wordt voldaan, stelt de
      regionale netbeheerder de invoeder een redelijke termijn om de invoedingsinstallatie aan de vereiste voorwaarden
      aan te passen.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.2.9
  - number: 2.5.2.10
    text: |-
      De voorwaarden zoals genoemd in [2.5.2.1 tot en met 2.5.2.3][ref1] zijn niet van toepassing indien tussen de
      netbeheerder en de invoeder wordt overeengekomen dat de in deze artikelen genoemde voorzieningen worden opgenomen
      in de aansluiting van de invoedingsinstallatie en worden beheerd door de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.2.1
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.5.2.10
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.2.1
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.6.1.1
    text: |-
      In geval regionale gastransportnetten onderling gekoppeld (kunnen) worden, maken de regionale netbeheerders
      onderling afspraken over het waarborgen van het samenhangend functioneren van de regionale gastransportnetten en de
      uitvoering van de allocatie.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.6.1.1
  - number: 2.6.1.2
    text: |-
      De regionale netbeheerders bepalen in onderling overleg op welke wijze toegang tot elkaars terrein of installatie
      geregeld wordt.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.6.1.2
  - number: 2.6.2.1
    text: |-
      De netkoppeling van twee regionale gastransportnetten van verschillende regionale netbeheerders is
      op het overdrachtspunt voorzien van een comptabele meetinrichting die voldoet aan het gestelde in de
      [hoofdstuk 2 van de “Meetcode gas RNB”][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037925
        hoofdstuk: '2'
  - number: 2.6.3.1
    text: |-
      Bij onderlinge koppeling van regionale gastransportnetten stellen de regionale netbeheerders na onderling overleg
      de toe te passen beveiligingsconcepten vast.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.6.3.1
  - number: 2.6.3.2
    text: |-
      De onderlinge koppeling van regionale gastransportnetten is in ieder geval voorzien van een beveiliging waarmee
      de toevoer van het ene regionale gastransportnet naar het andere vice versa in geval van calamiteiten kan worden
      afgesloten.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.6.3.2
  - number: 2.6.3.3
    text: |-
      De eventuele kathodische beschermingen van onderling gekoppelde regionale gastransportnetten dienen onderling
      elektrisch geïsoleerd te kunnen worden.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.6.3.3
  - number: 2.6.3.4
    text: |-
      Instellingen van de beveiligingen, het type beveiliging en de inschakelvoorwaarden worden in de
      netkoppelingsovereenkomst vastgelegd.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.6.3.4
  - number: 2.6.4.1
    text: |-
      De bepalingen [2.1.1.9][ref1] met uitzondering van de bij onderdeel d genoemde norm NEN 7244-6:2005
      “Gasvoorzieningsystemen – Leidingen voor maximale druk tot en met 16 bar – Deel 6: Specifieke functionele eisen
      voor aansluitleidingen” en [2.1.1.10][ref2] zijn van overeenkomstige toepassing op netkoppelingen tussen twee
      regionale gastransportnetten met dien verstande dat in 2.1.1.9 dan in plaats van “aansluitleiding” dient te worden
      gelezen “netkoppeling tussen twee regionale gastransportnetten”.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.1.1.9
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Artikel2.1.1.10
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.1.1.9
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037926
        artikel: 2.1.1.10
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3.1.1
    text: |-
      Transport vindt plaats op grond van een tussen de regionale netbeheerder en de aangeslotene te sluiten
      transportovereenkomst en zal voorts alleen plaatsvinden indien de aangeslotene tevens op grond van een
      geldige aansluitovereenkomst recht heeft op aansluiting en indien bij de netbeheerder bekend is welke
      partijen ten behoeve van de desbetreffende aansluiting optreden als leverancier, programmaverantwoordelijke en
      meetverantwoordelijke. De respectievelijke identificaties van genoemde partijen legt de netbeheerder op grond van
      [2.1.3 tot en met 2.1.5 van de Informatiecode elektriciteit en gas][ref1] vast in zijn aansluitingenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037934
        artikel: 2.1.3
  - number: 3.1.2
    text: |-
      Indien de aangeslotene voldoet aan het bepaalde in [3.1.1][ref1] heeft de aangeslotene recht op transport van
      gas binnen het regionale gastransportnet waarop hij is aangesloten tot een hoeveelheid ter grootte van de op
      de aansluiting gecontracteerde transportcapaciteit dan wel, indien het de aansluiting van een profielafnemer
      betreft, een met de G-waarde van de meetinrichting bij de aansluiting overeenkomende capaciteit, zoals op grond van
      [2.1.3, onderdeel o, van de Informatiecode elektriciteit en gas][ref2] is vastgelegd in het aansluitingenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 3.1.1
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037934
        artikel: 2.1.3
  - number: 3.1a.1
    text: |-
      In afwijking van[ 3.1.2][ref1] heeft de invoeder recht op transport van het in te voeden gas binnen het netgebied
      tot een hoeveelheid ter grootte van de momentane gasafname in dit netgebied mits de bedrijfszekerheid in het
      netgebied, in de zin van het drukbeheer in het netgebied, niet in gevaar komt.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel3.1.2
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.1a.1
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 3.1.2
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1a.2
    text: |-
      Indien op grond van [3.1a.1][ref1] transportcapaciteit aan een invoeder is toegekend en de invoeder maakt hiervan
      na toekenning geen (volledig) gebruik, heeft de netbeheerder de mogelijkheid om in overleg met en na instemming van
      de invoeder de transportcapaciteit in te trekken. Zo nodig stelt de netbeheerder de invoeder een redelijke termijn
      van tenminste een half jaar, indien de invoeder bij voortduring geen (volledig) gebruik maakt van de toegekende
      transportcapaciteit, alvorens deze toekenning voor het niet gebruikte deel wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel3.1a.1
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.1a.2
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 3.1a.1
        hoofdstuk: '3'
        paragraaf: 3.1a
  - number: 3.1a.3
    text: |-
      Indien binnen een netgebied, waarop reeds één of meer invoedingsinstallaties zijn aangesloten en invoeden, een
      nieuwe invoedingsinstallatie wordt aangesloten en wil invoeden, en deze nieuwe invoedingsinstallatie de aan de
      bestaande invoeder(s) beschikbaar gestelde transportcapaciteit nadelig kan beïnvloeden door de instellingen van de
      drukregeling, treft de netbeheerder zo mogelijk maatregelen in het net om deze nadelige invloed op te heffen.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.1a.3
  - number: 3.1a.4
    text: |-
      Indien de in [3.1a.3][ref1] genoemde maatregelen ontoereikend zijn, worden maatregelen getroffen in
      de aansluitingen van zowel de bestaande als de nieuwe invoedingsinstallaties, zodat de overeengekomen
      transportcapaciteiten met de bestaande invoeders blijven gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel3.1a.3
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.1a.4
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 3.1a.3
        hoofdstuk: '3'
        paragraaf: 3.1a
  - number: 3.1a.5
    text: |-
      De invoeders zullen bij de toepassing van [3.1a.4][ref1] de netbeheerder toestaan om maatregelen te (laten) treffen
      die nodig zijn om dit door middel van volume- en drukregeling te kunnen regisseren.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel3.1a.4
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.1a.5
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 3.1a.4
        hoofdstuk: '3'
        paragraaf: 3.1a
  - number: 3.1a.6
    text: |-
      De in [3.1a.3][ref1] bedoelde nieuwe invoedingsinstallatie mag invoeden voor zover het momentane invoedvolume niet
      groter is dan het verschil tussen de momentane afname in het netgebied en het momentane invoedvolume van de reeds
      eerder aangesloten invoedingsinstallaties.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel3.1a.3
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.1a.6
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 3.1a.3
        hoofdstuk: '3'
        paragraaf: 3.1a
  - number: 3.1a.7
    text: |-
      Om de uitvoering van [3.1a.6][ref1] mogelijk te maken, staat de invoeder toe dat de netbeheerder, van de
      individuele invoeders in een netgebied, continu volumegegevens van de invoeding ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel3.1a.6
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.1a.7
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 3.1a.6
        hoofdstuk: '3'
        paragraaf: 3.1a
  - number: 3.1a.8
    text: |-
      Indien de aansluiting niet is of wordt voorzien van een gaskwaliteitsmeting conform
      [5a.6 van de Meetcode gas RNB][ref1], dient de calorische waarde van het in te voeden gas groter of gelijk te
      zijn aan het gemiddelde van de maandwaarden van de calorische waarde van het gas dat gedurende de afgelopen twaalf
      maanden vanuit het landelijk gastransportnet in het desbetreffende netgebied is ingevoed.


      [ref1]: https://wetten.overheid.nl/BWBR0037925#Paragraaf5a.6
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.1a.8
    references:
      - id: ref1
        bwb_id: BWBR0037925
        paragraaf: 5a.6
  - number: 3.4.1
    text: |-
      Een regionale netbeheerder past een uniforme, door de gezamenlijke netbeheerders
      overeengekomen werkwijze toe voor de registratie van de onderwerpen, genoemd in
      [artikel 4.1, eerste lid, van het Besluit investeringsplan en kwaliteit elektriciteit en gas][ref1].
      Deze werkwijze omvat tevens de wijze waarop een netbeheerder de prestatie-indicatoren, bedoeld in
      __REF001___________________________________________________________________________________________________________
      __________________, vaststelt. De gezamenlijke netbeheerders maken de werkwijze openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0041487#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0041543#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0041487
        artikel: '4.1'
      - id: ref2
        bwb_id: BWBR0041543
        artikel: '3.1'
  - number: 3.4.2
    text: |-
      De regionale netbeheerder bewaakt of controle van de ruikbaarheid van het gas overeenkomstig hetgeen daaromtrent is
      bepaald in de [Meetcode gas LNB][ref1] wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037935
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037935
  - number: 3.4.3
    text: |-
      De regionale netbeheerder bewaakt of controle van de gaskwaliteit, tot uitdrukking komend in de calorische
      waarde, de Wobbe-index en de chemische samenstelling, overeenkomstig hetgeen daaromtrent is bepaald in de
      [Meetcode gas LNB][ref1] wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037935
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037935
  - number: 3.4.4
    text: |-
      Bij de eerste ingebruikname van een invoedingsinstallatie wordt de invoeding niet eerder gestart dan nadat de
      invoeder aantoont dat de invoedingsinstallatie voldoet aan [2.5.2][ref1] en dat de kwaliteit van het in te voeden
      gas stabiel binnen de in [artikel 2, tweede lid, van de Regeling gaskwaliteit][ref2] bedoelde grenzen voor de
      gaskwaliteit is en blijft, blijkend uit de kwaliteitsbewaking, zoals bedoeld in [5a.2.2](onbekend) en [5a.2.3 van
      de Meetcode gas RNB](onbekend) en de rapportage bedoeld in [5a.4.1.3 van de Meetcode gas RNB](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0035367#Artikel2
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.4.4
    references:
      - id: ref1
        bwb_id: BWBR0037926
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0035367
        artikel: '2'
  - number: 3.4.5
    text: |-
      De invoeding wordt door middel van automatische afschakeling direct onderbroken indien de kwaliteit van het in
      te voeden gas buiten de in [artikel 2, tweede lid, van de Regeling gaskwaliteit][ref1] bedoelde grenzen voor de
      gaskwaliteit komt, blijkend uit het signaal van één of meer van de in [2.5.2.4 tot en met 2.5.2.4c][ref2] bedoelde
      bewakingsvoorzieningen. De invoeding wordt niet eerder herstart dan nadat uit het signaal van één of meer van de in
      2.5.2.4 tot en met 2.5.2.4c bedoelde bewakingsvoorzieningen is gebleken dat de kwaliteit van het in te voeden gas
      binnen de in artikel 2, tweede lid, van de Regeling gaskwaliteit genoemde grenzen voor de gaskwaliteit is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0035367#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.2.4
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.4.5
    references:
      - id: ref1
        bwb_id: BWBR0035367
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037926
        artikel: 2.5.2.4
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 3.4.6
    text: |-
      De invoeding wordt direct onderbroken indien de kwaliteit van het in te voeden gas buiten de in
      [artikel 2, tweede lid, van de Regeling gaskwaliteit][ref1] bedoelde grenzen voor de gaskwaliteit komt, blijkend
      uit de periodieke kwaliteitsbewaking, zoals bedoeld in [5a.2.5 van de Meetcode gas RNB](onbekend), indien sprake is
      van een nog steeds voortdurende overschrijding van de genoemde grenzen. Bij overige gesignaleerde overschrijdingen
      geeft de invoeder aan dat de oorzaak van de opgetreden overschrijding inmiddels is weggenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0035367#Artikel2
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.4.6
    references:
      - id: ref1
        bwb_id: BWBR0035367
        artikel: '2'
  - number: 3.4.7
    text: |-
      Indien de invoeding op grond van [3.4.6][ref1] is onderbroken vanwege een overschrijding, anders dan van de
      grenswaarden voor de Wobbe-index en/of de componenten die de Wobbe-index bepalen, dient de invoeder te onderzoeken
      wat de oorzaak is van het niet voldoen aan de gaskwaliteit en over welke periode van invoeding niet aan de gestelde
      eisen is voldaan. De invoeding wordt niet hervat dan nadat de invoeder heeft aangegeven welke maatregelen hij
      treft om herhaling er van te voorkomen en hij over deze maatregelen overeenstemming heeft bereikt met de regionale
      netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel3.4.6
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.4.7
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 3.4.6
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.4.8
    text: |-
      De invoeder maakt tenminste vijf werkdagen van te voren bekend wanneer hij voornemens is een invoedingsinstallatie
      in onderhoud te nemen, dan wel deze om andere redenen buiten bedrijf te stellen, dan wel wanneer de invoeding van
      gas om andere redenen gepland zal worden onderbroken.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.4.8
  - number: 3.4.9
    text: |-
      De invoeding wordt direct onderbroken indien één of meer van de in [2.5.2.1 tot en met 2.5.2.6][ref1] genoemde
      voorzieningen niet goed functioneert.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.2.1
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.4.9
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.2.1
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 3.4.10
    text: |-
      De regionale netbeheerder kan, in gevallen zoals bedoeld in [2.5.1.4][ref1], nadere eisen stellen aan de invoeder
      van gas over het controleren van het in te voeden gas. De invoeder van gas legt de regionale netbeheerder een
      procedure voor waarin is aangegeven hoe de invoeder de controle zal uitvoeren. Na goedkeuring van deze procedure
      van de netbeheerder kan invoeding plaats vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.5.1.4
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.4.10
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.5.1.4
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 3.4.11
    text: |-
      De regionale netbeheerder kan op grond van zijn verantwoordelijkheid voor de kwaliteit van het bij aangeslotenen af
      te leveren gas zelf controlemetingen (laten) uitvoeren op de aansluiting waar gas wordt ingevoed.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel3.4.11
  - number: 4.1.1
    text: |-
      De regionale netbeheerder stelt al hetgeen redelijkerwijs binnen zijn vermogen ligt in het werk om onderbreking van
      de transportdienst te voorkomen, of indien een onderbreking van de transportdienst optreedt, deze zo snel mogelijk
      te verhelpen.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.1.1
  - number: 4.1.2.1
    text: |-
      De regionale netbeheerder is binnen twee uur na melding door de aangeslotene ter plaatse indien een storing aan de
      aansluiting van een aangeslotene is opgetreden.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.1.2.1
  - number: 4.1.2.2
    text: |-
      De regionale netbeheerder handelt correspondentie van een aangeslotene binnen 10 werkdagen af. Indien een oplossing
      in deze periode niet mogelijk is, ontvangt de aangeslotene binnen 5 werkdagen bericht binnen welke termijn een
      adequate reactie kan worden verwacht.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.1.2.2
  - number: 4.1.2.3
    text: De regionale netbeheerder hanteert bij het maken van afspraken met een aangeslotene tijdsblokken van twee uur.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.1.2.3
  - number: 4.1.2.4
    text: |-
      De regionale netbeheerder voert met de aangeslotene overeengekomen werkzaamheden waarmee volgens de planning minder
      dan 4 mensuren zijn gemoeid, binnen drie dagen uit indien daarvoor de transportdienst aan andere aangeslotenen
      niet hoeft te worden onderbroken. Indien de transportdienst aan andere aangeslotenen wel moet worden onderbroken,
      bedraagt deze termijn maximaal 10 werkdagen. Voor werkzaamheden waarmee volgens de planning meer dan 4 mensuren
      zijn gemoeid, bedraagt de termijn waarop de werkzaamheden aanvangen maximaal 10 werkdagen.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.1.2.4
  - number: 4.1.2.5
    text: |-
      Voor het uitvoeren van inpandige werkzaamheden op verzoek van de regionale netbeheerder, maakt de regionale
      netbeheerder tenminste vijf werkdagen van tevoren schriftelijk of telefonisch een afspraak met de aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.1.2.5
  - number: 4.1.2.6
    text: |-
      De regionale netbeheerder stelt de aangeslotene tenminste drie werkdagen van tevoren op de hoogte van door hem
      geplande werkzaamheden waarbij de transportdienst bij de aangeslotene moet worden onderbroken.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.1.2.6
  - number: 4.1.3.1
    text: |-
      Indien de transportdienst aan een aangeslotene moet worden onderbroken, stelt de regionale netbeheerder de
      aangeslotene tenminste tien werkdagen van te voren op de hoogte van de door hem geplande werkzaamheden. De
      regionale netbeheerder stelt de datum van de genoemde werkzaamheden pas vast na overleg met de daardoor getroffen
      aangeslotenen, waarbij hij in redelijkheid de belangen van de aangeslotenen weegt.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.1.3.1
  - number: 4.1.3.2
    text: |-
      De regionale netbeheerder handelt correspondentie van een aangeslotene binnen tien werkdagen af. Indien een
      oplossing in deze periode niet mogelijk is, ontvangt de aangeslotene binnen vijf werkdagen bericht binnen welke
      termijn een adequate reactie kan worden verwacht.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.1.3.2
  - number: 4.1.3.3
    text: |-
      De regionale netbeheerder voegt aan de offertes indicatieve nettekeningen toe waaruit de plaats in het net blijkt
      waarop het aansluittarief is gebaseerd en waaruit de plaats in het net blijkt waar de aangeslotene waarschijnlijk
      zal worden aangesloten.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.1.3.3
  - number: 4.1.3.4
    text: |-
      De regionale netbeheerder maakt uiterlijk twee uur nadat een onderbreking van de transportdienst aan hem is gemeld,
      een begin met de werkzaamheden die moeten leiden tot de opheffing van de onderbreking. De regionale netbeheerder
      informeert aangeslotenen desgevraagd over de omvang van de onderbreking, de te verwachten duur en de door de
      regionale netbeheerder te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.1.3.4
  - number: 4.1.3.5
    text: |-
      De regionale netbeheerder geeft aan door een onderbreking van de transportdienst getroffen aangeslotenen op hun
      verzoek binnen 10 werkdagen een verklaring voor het ontstaan van de onderbreking. Indien dit binnen deze termijn
      niet mogelijk is, geeft de regionale netbeheerder binnen genoemde termijn aan wanneer de aangeslotene de verklaring
      van de regionale netbeheerder mag verwachten.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.1.3.5
  - number: 4.1.4
    text: |-
      Indien en voor zover door de regionale netbeheerder in overleg met de aangeslotene voor één of meer van de in
      [4.1.2][ref1] of [4.1.3][ref2] genoemde kwaliteitscriteria afwijkende afspraken zijn gemaakt, zijn deze afspraken
      van toepassing in plaats van de desbetreffende in 4.1.2 of 4.1.3 genoemde kwaliteitscriteria.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037926
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037926
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.2.0
    text: |-
      De aangeslotene heeft recht op een financiële compensatie bij storingen die voor een periode langer dan 4 uren tot
      een onderbreking van het transport van gas leiden, met uitzondering van voorziene onderbrekingen.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.2.0
  - number: 4.2.1
    text: |-
      De regionale netbeheerder betaalt, onverminderd het bepaalde in [4.2.2][ref1], aangeslotenen op zijn net bij wie
      het transport van gas ten gevolge van een storing is onderbroken, per onderbreking een compensatievergoeding ter
      hoogte van het hieronder genoemde bedrag:

      a. per aansluiting van een kleinverbruiker bedraagt de compensatievergoeding EUR 35,– bij een onderbreking van 4
      tot 8 uur, vermeerderd met EUR 20,– voor elke volgende aaneengesloten periode van 4 uur, uit te betalen binnen zes
      maanden na het herstel van de onderbreking;

      b. per aansluiting van een profielgrootverbruiker bedraagt de compensatievergoeding EUR 195,– bij een onderbreking
      van 4 tot 8 uur, vermeerderd met EUR 100,– voor elke volgende aaneengesloten periode van 4 uur, uit te betalen
      binnen zes maanden na het herstel van de onderbreking;

      c. per aansluiting van een telemetriegrootverbruiker bedraagt de compensatievergoeding € 910,– bij een onderbreking
      van 4 tot 8 uur, vermeerderd met EUR 500,– voor elke volgende aaneengesloten periode van 4 uur, uit te betalen bij
      de eerstvolgende jaar- respectievelijk maandafrekening.

      De duur van de onderbreking wordt bepaald op grond van [4.2.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel4.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Artikel4.2.5
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 4.2.2
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0037926
        artikel: 4.2.5
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.2
    text: |-
      De in [4.2.1][ref1] genoemde verplichting geldt niet voor de regionale netbeheerders, wanneer een onderbreking
      van de transportdienst het gevolg is van een afschakeling van belasting op verzoek van de netbeheerder van het
      landelijk gastransportnet.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel4.2.1
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 4.2.1
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.3
    text: |-
      De in [4.2.1][ref1] genoemde verplichting geldt eveneens voor een netbeheerder ten aanzien van een aangeslotene
      op een net van een andere netbeheerder indien de onderbreking van de transportdienst bij de desbetreffende
      aangeslotene zijn oorsprong vindt in het gastransportnet van de eerstbedoelde netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel4.2.1
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 4.2.1
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.4
    text: |-
      De in [4.2.0][ref1] genoemde termijn van 4 uur vangt voor alle door de onderbreking van de transportdienst
      getroffen aangeslotenen aan op het moment dat de regionale netbeheerder de eerste melding van een onderbreking
      ontvangt of, indien dat eerder is, het moment van vaststelling van de onderbreking door de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel4.2.0
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 4.2.0
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.5
    text: |-
      De duur van de onderbreking wordt voor alle door de onderbreking van het transport van gas getroffen aangeslotenen
      bepaald als de tijdsduur tussen de in [4.2.4][ref1] gedefinieerde aanvang van de onderbreking en het moment
      dat het transport voor alle door de onderbreking van de transportdienst getroffen aangeslotenen is hersteld en
      voor de eerste keer is gecontroleerd of de betroffen aangeslotenen veilig gas kan worden geleverd. De regionale
      netbeheerder dient te registreren op welk moment deze controle heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel4.2.4
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel4.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 4.2.4
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 5.1.1
    text: |-
      Indien er zich situaties voordoen die niet zijn voorzien in deze code, bepaalt de regionale netbeheerder (in
      geval van een netkoppeling de regionale netbeheerders onderling) welke maatregelen nodig zijn, rekening houdend
      met de technische hoedanigheden van de gasinstallatie van de desbetreffende aangeslotene en de belangen van alle
      aangeslotenen.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel5.1.1
  - number: 5.2.1
    text: |-
      In gevallen waarin aan een of meer bepalingen van deze code op het tijdstip van inwerkingtreding ervan niet wordt
      voldaan, en de regionale netbeheerder daardoor zijn wettelijke taken niet kan uitvoeren, treedt de regionale
      netbeheerder met de betrokkene, of treden de gezamenlijke netbeheerders onderling, in overleg teneinde vast te
      stellen welke aanpassingen noodzakelijk zijn en binnen welke termijn deze dienen te zijn doorgevoerd.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel5.2.1
  - number: 5.2.2
    text: |-
      In deze regeling wordt onder gesloten distributiesysteem mede verstaan een
      net waarvoor een vrijstelling of ontheffing is verleend zoals bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______________________________________________________________________________________________, tot op het tijdstip
      waarop deze van rechtswege komt te vervallen ingevolge het vierde, vijfde of zesde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0031815#ArtikelVI
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel5.2.2
    references:
      - id: ref1
        bwb_id: BWBR0031815
        artikel: VI
  - number: 5.2.3
    text: |-
      In deze regeling wordt onder gesloten distributiesysteem mede
      verstaan een net waarvoor een ontheffing is verleend zoals bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________________________________________________________________________________, tot op het in het
      genoemde artikellid bedoelde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0031815#ArtikelVI
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel5.2.3
    references:
      - id: ref1
        bwb_id: BWBR0031815
        artikel: VI
  - number: 5.2.4
    text: 'Deze code wordt aangehaald als: “Aansluit- en transportcode gas RNB”.'
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel5.2.4
  - number: '6.1'
    text: |-
      De Aansluit- en transportvoorwaarden Gas – RNB, zoals vastgesteld bij besluit van 21 november 2006 en nadien
      diverse malen gewijzigd, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel6.1
  - number: '6.2'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel6.2
  - number: '6.3'
    text: 'Dit besluit wordt aangehaald als: Aansluit- en transportcode gas RNB.'
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel6.3
