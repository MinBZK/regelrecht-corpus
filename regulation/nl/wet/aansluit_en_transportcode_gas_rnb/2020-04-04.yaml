$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: aansluit_en_transportcode_gas_rnb
regulatory_layer: WET
publication_date: '2026-02-20'
valid_from: '2020-04-04'
bwb_id: BWBR0037926
url: https://wetten.overheid.nl/BWBR0037926/2020-04-04
preamble:
  text: |-
    Gelet op artikel 12f, eerste lid van de Gaswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      Deze code bevat de voorwaarden voor de wijze waarop regionale netbeheerders en aangeslotenen alsmede regionale
      netbeheerders zich jegens elkaar gedragen over het in werking hebben van de gastransportnetten, het voorzien
      van een aansluiting op het regionale gastransportnet en het uitvoeren van transport van gas over het regionale
      gastransportnet alsmede de kwaliteitscriteria waaraan regionale netbeheerders moeten voldoen voor hun
      dienstverlening.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel1.1.1
  - number: 1.1.2
    text: |-
      De in deze code gebruikte begrippen die ook in de [Gaswet][ref1] worden gebruikt, hebben de betekenis die daaraan
      in de Gaswet is toegekend. Van de overige in deze code gebruikte begrippen is de betekenis vastgelegd in de
      [Begrippencode gas][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440
      [ref2]: https://wetten.overheid.nl/BWBR0037923
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0011440
      - id: ref2
        bwb_id: BWBR0037923
  - number: 2.1.1.1
    text: |-
      Het aanleggen van een aansluiting vindt plaats op grond van een tussen de regionale netbeheerder en de aangeslotene
      af te sluiten aansluit- en transportovereenkomst. De regionale netbeheerder kan het aangaan of het wijzigen van een
      overeenkomst alleen schriftelijk en gemotiveerd weigeren op de gronden genoemd in [artikel 15 van de Gaswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel15
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '15'
  - number: 2.1.1.2
    text: |-
      De regionale netbeheerder bepaalt, rekening houdend met de aard, de omvang en de locatie van de gasinstallatie,
      en zo nodig na overleg met de aangeslotene, op welke wijze (bijv. druktrap, één of meer verbindingen) de gevraagde
      aansluitcapaciteit ter beschikking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.1.2
  - number: 2.1.1.2a
    text: |-
      De regionale netbeheerder mag de aansluiting, na voorafgaand overleg met de aangeslotene, realiseren op een
      ander punt in het net dan het dichtstbijzijnde punt in het net met een voor die aansluiting geschikte druk en
      voldoende capaciteit. Overeenkomstig [artikel 2.1.1.1][ref1] worden afspraken daartoe vastgelegd in de aansluit-
      en transportovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.1.1.1
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.1.2a
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.1.1.1
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.1.3
    text: |-
      De regionale netbeheerder realiseert de aansluiting binnen 18 weken na ontvangst van een aanvraag daartoe. Als dit
      binnen deze termijn niet mogelijk is dan informeert de regionale netbeheerder binnen een week na constatering van
      deze onmogelijkheid de aangeslotene daaromtrent schriftelijk onder opgaaf van redenen en bepaalt hij in overleg met
      de aangeslotene de termijn waarop de aansluiting wel gerealiseerd wordt.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.1.3
  - number: 2.1.1.4
    text: |-
      Het overdrachtspunt van de aansluiting bevindt zich, bezien vanuit het net, direct na de aansluitleiding. De
      aangeslotene bepaalt na overleg met de netbeheerder de locatie waar de aansluitleiding wordt aangesloten op de
      gasinstallatie.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.1.4
  - number: 2.1.1.5
    text: |-
      De regionale netbeheerder verbindt de aansluiting met de gasmeetinrichting. De aangeslotene maakt het mogelijk dat
      de regionale netbeheerder alle handelingen kan verrichten die ter zake noodzakelijk worden geacht.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.1.5
  - number: 2.1.1.6
    text: |-
      De regionale netbeheerder brengt de noodzakelijke hulpmiddelen of appendages aan voor het realiseren van de
      aansluiting zoals bedoeld in [2.1.1.5][ref1]. De regionale netbeheerder houdt de aansluiting in stand en is
      verantwoordelijk voor het onderhoud en de controle ervan. De regionale netbeheerder kan op verzoek van de
      aangeslotene de aansluiting uitbreiden, wijzigen, vervangen, verplaatsen en weggenemen. De aangeslotene maakt het
      mogelijk dat alle handelingen kunnen worden verricht die hiervoor noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.1.1.5
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.1.1.5
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.1.9
    text: |-
      Leidingen en appendages ten behoeve van de aansluiting, en de aansluitleiding voldoen aan de volgende technische
      normen:

      a. NEN 1059:2010 “Nederlandse editie op basis van NEN-EN 12186 en NEN-EN 12279 – Gasvoorzieningssystemen –
      Gasdrukregelstations voor transport en distributie”;

      b. NEN-EN 1594:2009 “Gasvoorziening – Leidingsystemen voor maximale bedrijfsdruk groter dan 16 bar – Functionele
      eisen”;

      c. NEN 3650-1:2012 “Eisen voor buisleidingsystemen – Deel 1: Algemeen”;

      NEN 3650-2:2012 “Eisen voor buisleidingsystemen – Deel 2: Staal”;

      NEN 3650-3:2012 “Eisen voor buisleidingsystemen – Deel 3: Kunststoffen”;

      NEN 3650-4:2012 “Eisen voor buisleidingsystemen – Deel 4: Beton”;

      NEN 3650-5:2012 “Eisen voor buisleidingsystemen – Deel 5: Gietijzer”;

      d. NEN 7244-1:2003 “Nederlandse editie op basis van NEN-EN 12007-1 – Gasvoorzieningsystemen – Leidingen voor
      maximale druk tot en met 16 bar – Deel 1: Algemene functionele aanbevelingen”;

      NEN 7244-2:2004 “Nederlandse editie op basis van NEN-EN 12007-2 – Gasvoorzieningsystemen – Leidingen voor maximale
      druk tot en met 16 bar – Deel 2: Specifieke functionele aanbevelingen voor polyethyleen (MOP tot en met 10 bar)”;

      NEN 7244-3:2004 “Nederlandse editie op basis van NEN-EN 12007-3 – Gasvoorzieningsystemen – Leidingen voor maximale
      druk tot en met 16 bar – Deel 3: Specifieke functionele aanbevelingen voor staal”;

      NEN 7244-4:2004 “Gasvoorzieningsystemen – Leidingen voor maximale druk tot en met 16 bar – Deel 4: Specifieke
      functionele eisen voor nodulair gietijzeren leidingen met een maximale bedrijfsdruk van 8 bar”;

      NEN 7244-5:2004 “Gasvoorzieningsystemen – Leidingen voor maximale druk tot en met 16 bar – Deel 5: Specifieke
      functionele eisen voor slagvaste PVC- leidingen met een maximale bedrijfsdruk van 200 mbar”;

      NEN 7244-6:2005 “Gasvoorzieningsystemen – Leidingen voor maximale druk tot en met 16 bar – Deel 6: Specifieke
      functionele eisen voor aansluitleidingen”;

      NEN 7244-7:2005 en NEN 7244-7/A1:2009 “Gasvoorzieningsystemen – Leidingen voor maximale druk tot en met 16 bar –
      Deel 7: Specifieke functionele eisen voor sterkte- en dichtheidsbeproeving en voor het in bedrijf en buiten bedrijf
      stellen van gasdistributieleidingen”.

      NEN 7244-9:2008 “Gasvoorzieningsystemen – Leidingen voor maximale druk tot en met 16 bar – Deel 9: Specifieke
      functionele eisen voor de afhandeling van gasmeldingen en periodiek gaslek zoeken”.

      NEN 7244-10:2010 “Gasvoorzieningsystemen – Leidingen voor maximale druk tot en met 16 bar – Deel 10: Specifieke
      functionele eisen voor opstellingsruimten en meteropstellingen met een maximale inlaatdruk van 100 mbar en een
      maximale ontwerpcapaciteit van 650mn3/h”.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.1.9
  - number: 2.1.1.10
    text: |-
      Met de in [2.1.1.9][ref1] bedoelde leidingen worden gelijkgesteld leidingen en installaties die aantoonbaar aan
      tenminste gelijkwaardige technische eisen voldoen. Met de in 2.1.1.9 bedoelde leidingen wordt gelijkgesteld een
      leiding die rechtmatig is vervaardigd of in de handel is gebracht in een andere lidstaat van de Europese Unie dan
      wel rechtmatig is vervaardigd of in de handel is gebracht in een staat, niet zijnde een lidstaat van de Europese
      Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en die voldoet
      aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de eisen genoemd
      in 2.1.1.9 wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.1.1.9
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.1.10
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.1.1.9
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.2.1
    text: |-
      De aansluiting is voorzien van een meetinrichting die voldoet aan de wettelijke voorschriften en aan de eisen van
      de “[Meetcode gas RNB][ref1]”.


      [ref1]: https://wetten.overheid.nl/BWBR0037925
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037925
  - number: 2.1.2.2
    text: |-
      De comptabel te meten grootheden worden vastgelegd in de transportovereenkomst van de regionale netbeheerder met
      de aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.2.2
  - number: 2.1.2.3
    text: |-
      De comptabele meting vindt plaats op of bij het overdrachtspunt. Calorische correcties en/of eventuele andere
      bewerkingen van de gegevens die noodzakelijk zijn om de meetgegevens tot comptabele meetgegevens te maken, hoeven
      niet op de aansluiting zelf te worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.2.3
  - number: 2.1.2.3b
    text: |-
      De netbeheerder is bevoegd de meetinrichting te onderzoeken om te beoordelen of de meetinrichting aan de Meetcode
      gas RNB voldoet. Indien blijkt dat de meetinrichting niet voldoet aan de Meetcode gas RNB, is de aangeslotene
      verplicht de gebreken voor zijn rekening te herstellen binnen een door de netbeheerder opgegeven termijn en conform
      de eisen zoals vastgelegd in deze Aansluit- en transportcode gas RNB.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.2.3b
  - number: 2.1.2.3c
    text: |-
      Voor de periode waarvan vaststaat dat de meetinrichting niet voldoet aan de Meetcode gas RNB, mag de netbeheerder
      meetwaarden vaststellen. De hoogte van de vast te stellen meetwaarden moet redelijk zijn en de netbeheerder dient
      te onderbouwen hoe hij de hoogte van de meetwaarden heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.2.3c
  - number: 2.1.2.4
    text: |-
      In afwijking van het bepaalde in [2.1.2.1][ref1], hoeft een kleinverbruiker niet te zorgen voor een comptabele
      meting indien:

      a. het een aansluiting betreft die op het moment van inwerkingtreding van deze bepaling reeds onbemeten was, èn

      b. er voor deze aansluiting een zogeheten gasabonnement met de leverancier is afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.1.2.1
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.1.2.1
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.3.1
    text: |-
      De aangeslotene heeft de plicht er voor te zorgen dat de hulpmiddelen en appendages van de regionale netbeheerder,
      het overdrachtspunt en de meetinrichting goed toegankelijk blijven en dat ter zake alle redelijkerwijs
      noodzakelijke handelingen kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.3.1
  - number: 2.1.3.2
    text: |-
      De aangeslotene zorgt ervoor dat de toegang tot de ruimte, waarin zich de hulpmiddelen en appendages van de
      regionale netbeheerder, het overdrachtspunt en de meetinrichting en de tot de aansluiting behorende apparatuur
      bevinden, niet wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.3.2
  - number: 2.1.3.3
    text: |-
      Verzegelingen die door of vanwege de regionale netbeheerder en/of de meetverantwoordelijke zijn aangebracht op
      de meetinrichting of op delen van de hulpmiddelen en appendages van de regionale netbeheerder mogen niet worden
      geschonden of verbroken tenzij de regionale netbeheerder en/of de meetverantwoordelijke (waar het door hem
      aangebrachte verzegelingen betreft) uitdrukkelijk toestemming geeft tot het verbreken van de verzegeling.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.3.3
  - number: 2.1.3.4
    text: |-
      De aangeslotene is gehouden alle maatregelen te nemen die redelijkerwijs van hem verwacht kunnen worden om schade
      aan de hulpmiddelen en appendages van de regionale netbeheerder, het overdrachtspunt en de meetinrichting te
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.3.4
  - number: 2.1.3.5
    text: |-
      De aangeslotene zorgt ervoor dat hulpmiddelen en appendages van de regionale netbeheerder, het overdrachtspunt en
      de meetinrichting en de overige tot de aansluiting behorende apparatuur niet opgesteld worden in vochtige ruimten,
      ruimten met bijtende gassen, dampen of stoffen, ruimten met ontploffingsgevaar en ruimten met brandgevaar.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.3.5
  - number: 2.1.3.6
    text: |-
      De regionale netbeheerder bepaalt na overleg met de aangeslotene op welke wijze de toegang tot het terrein of de
      installatie van de aangeslotene plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.3.6
  - number: 2.1.3.7
    text: |-
      In woonhuizen met individuele meting wordt voor het onderbrengen van alle tot de aansluiting en meetinrichting
      behorende apparatuur een kast ter beschikking gesteld, die voldoet aan de eisen, gesteld in NEN 2768:2005
      “Meterruimten en bijbehorende voorzieningen in een woonfunctie”. In geval de meteropname van buitenaf kan
      geschieden of het overdrachtspunt van buitenaf bereikbaar is, kan de netbeheerder ten aanzien van deze kast nadere
      eisen stellen.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.3.7
  - number: 2.1.3a.1
    text: |-
      De beveiliging van de aansluiting voldoet aan:

      a. Paragraaf 4.7 van NEN 7244-6:2005 “Gasvoorzieningsystemen – Leidingen voor maximale druk tot en met 16
      bar – Deel 6: Specifieke functionele eisen voor aansluitleidingen” voor wat betreft de afsluitbaarheid van de
      aansluiting,

      b. Paragraaf 8.3 van NEN 1059:2010 “Nederlandse editie op basis van NEN-EN 12186 en NEN-EN 12279 –
      Gasvoorzieningssystemen – Gasdrukregelstations voor transport en distributie” voor zover van toepassing voor wat
      betreft de toepassing van een drukbeveiligingssysteem op de aansluiting.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.3a.1
  - number: 2.1.3a.2
    text: |-
      Met de in [2.1.3a.1][ref1] bedoelde producten ten behoeve van de beveiliging van gasaansluitingen worden
      gelijkgesteld producten die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat
      van de Europese Unie dan wel rechtmatig zijn vervaardigd of in de handel zijn gebracht in een staat, niet zijnde
      een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat
      Nederland bindt, en die voldoen aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het
      niveau dat met de eisen, genoemd in 2.1.3a.1 wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.1.3a.1
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.3a.2
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.1.3a.1
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.4.1
    text: |-
      Gasinstallaties bevatten geen onderdelen die tot invoeding in het regionale gastransportnet kunnen leiden,
      tenzij daartoe vooraf door de regionale netbeheerder schriftelijk toestemming is verleend en aan de aanvullende
      voorwaarden voor invoedingsinstallaties zoals opgenomen in [2.5][ref1] wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037926
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.1.4.2
    text: |-
      Gasinstallaties veroorzaken via het regionale gastransportnet geen ontoelaatbare hinder (zoals bijvoorbeeld
      drukschommelingen), een en ander ter beoordeling van de regionale netbeheerder. De regionale netbeheerder kan
      de aangeslotene in geval van ontoelaatbare hinder aanschrijven, om zodanige voorzieningen te treffen dat de
      ontoelaatbare hinder ophoudt.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.4.2
  - number: 2.1.4.3
    text: |-
      De regionale netbeheerder heeft geen verplichting om na te gaan of een gasinstallatie voldoet aan de van toepassing
      zijnde bepalingen uit [hoofdstuk 2][ref1] van deze code. Indien niet aan de voorwaarden voor gasinstallaties
      wordt voldaan zodat de systeemintegriteit van het gasdistributienet of de veiligheid in het geding zijn, heeft
      de regionale netbeheerder uit voorzorg het recht op het onmiddellijk afsluiten van de aansluiting. De regionale
      netbeheerder stelt de afnemer daarvan onmiddellijk op de hoogte. Indien anderszins niet aan de voorwaarden
      voor gasinstallaties wordt voldaan, stelt de regionale gasnetbeheerder de afnemer een redelijke termijn om de
      gasinstallatie aan de vereiste voorwaarden aan te passen.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.1.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037926
        hoofdstuk: '2'
  - number: 2.2.1
    text: |-
      In gevallen waarin daaromtrent in het Bouwbesluit en daarop gebaseerde normen niets is voorgeschreven, worden in
      gebouwen waar de gasinstallatie door middel van een in de grond gelegde leiding wordt aangesloten voorzieningen
      getroffen voor het gemakkelijk binnenleiden van deze leiding, waaronder in ieder geval een beschermbuis waarvan
      het materiaal en de afmetingen bepaald worden door het materiaal en diameter van de leiding, tenzij de regionale
      netbeheerder uitdrukkelijk te kennen heeft gegeven zulks niet noodzakelijk te achten. De leidingdoorvoer dient
      gasbelemmerend te zijn. In het geval een leidinginvoerput wordt aangebracht, voldoet deze aan de daarvoor
      vastgestelde of vast te stellen wettelijke voorschriften en normen.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.2.1
  - number: 2.2.2
    text: |-
      In gevallen waarin daaromtrent in het Bouwbesluit en daarop gebaseerde normen niets is voorgeschreven, wordt in
      woningen en andere gebouwen met individuele meting voor het onderbrengen van alle hulpmiddelen en appendages van
      de regionale netbeheerder, het overdrachtspunt en de meetinrichting een kast ter beschikking gesteld, die voldoet
      aan de daarvoor vastgestelde of vast te stellen wettelijke voorschriften en normen. In geval de meteropname van
      buitenaf kan geschieden of het overdrachtspunt van buitenaf bereikbaar is, kunnen aan deze kast nadere eisen worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.2.2
  - number: 2.2.3
    text: |-
      Bij tijdelijke- en andere aansluitingen dan bedoeld in [2.2.2][ref1], voor zover daarvoor geen vigerende normen
      gelden, stelt de regionale netbeheerder de eisen vast waaraan de ruimten voor het onderbrengen van de tot de
      aansluiting behorende apparatuur moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.2.2
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.2.2
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.4
    text: |-
      De aangeslotene stelt voor het onderbrengen van alle hulpmiddelen en appendages van de regionale netbeheerder, het
      overdrachtspunt en de meetinrichting ten behoeve van een tijdelijke gasaansluiting een stevige, deugdelijke kast
      of ruimte ter beschikking aan de regionale netbeheerder, waarvan de regionale netbeheerder en de aangeslotene in
      onderling overleg de afmetingen en constructie bepalen.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.2.4
  - number: 2.2.5
    text: |-
      De ruimte, waarin een meetinrichting met een ontwerpcapaciteit groter dan 40 m3(n)/uur is opgesteld, mag niet voor
      andere doeleinden worden gebruikt. Indien deze ruimte een onderdeel is van een gebouw, mag deze ruimte niet vanuit
      dat gebouw toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.2.5
  - number: 2.3.1
    text: |-
      Indien een gasinstallatie door middel van één of meer door de regionale netbeheerder te plaatsen drukregelaars op
      een regionaal gastransportnet met een druk van meer dan 200 mbar wordt aangesloten, is de aangeslotene verplicht
      één of meer ruimten ter beschikking te stellen aan de regionale netbeheerder. De plaats van de ruimte wordt na
      overleg met de aangeslotene door de regionale netbeheerder vastgesteld. De afmetingen, constructie en inrichting
      van de ruimte worden in onderling overleg tussen netbeheerder en aangeslotene bepaald. De ruimte moet vanaf de
      openbare weg, al dan niet via een aparte ingang, blijvend toegankelijk zijn, zodat alle benodigde werkzaamheden
      te allen tijde kunnen worden verricht en moet zijn afgesloten door een deur of deuren, voorzien van een door de
      regionale netbeheerder ter beschikking te stellen slot. De ruimte mag niet vanuit het gebouw toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.3.1
  - number: 2.4.1
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.4.1
  - number: 2.4.2
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.4.2
  - number: 2.4.3
    text: |-
      Gesloten distributiesystemen, aangesloten op regionale gastransportnetten met een druk van meer dan 200
      mbar voldoen ten minste aan de voorwaarden in [2.6][ref1], met uitzondering van [2.6.1.1][ref2], voor zover
      van toepassing op het drukniveau waarop het gesloten distributiesysteem aangesloten is op het regionale
      gastransportnet. In deze artikelen dient dan in plaats van “de regionale netbeheerders” gelezen te worden
      “beheerder van het gesloten distributiesysteem en de regionale netbeheerder”.


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Artikel2.6.1.1
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037926
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0037926
        artikel: 2.6.1.1
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 2.4.4
    text: |-
      Indien op een gesloten distributiesysteem één of meer verbruikers of invoeders zijn aangesloten die een ander
      leveringscontract wensen, heeft de beheerder van het desbetreffende gesloten distributiesysteem de verplichting
      leverancierskeuze te faciliteren.
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.4.4
  - number: 2.4.5
    text: |-
      Indien de beheerder van het gesloten distributiesysteem kiest voor het faciliteren van leverancierskeuze door
      middel van suballocatie, heeft hij de verplichting zijn leverancier en programmaverantwoordelijke opdracht te
      geven samen te werken met de leverancier(s) en programmaverantwoordelijke(n) van de in [2.4.4][ref1] bedoelde
      verbruiker(s) of invoeder(s) ten einde de allocatie van gerealiseerde energiestromen op de aansluiting van het
      gesloten distributiesysteem op het regionale gastransportnet toe te delen aan de aansluiting(en) van de in 2.4.4
      bedoelde verbruiker(s) of invoeder(s).


      [ref1]: https://wetten.overheid.nl/BWBR0037926#Artikel2.4.4
    url: https://wetten.overheid.nl/BWBR0037926/2020-04-04#Artikel2.4.5
    references:
      - id: ref1
        bwb_id: BWBR0037926
        artikel: 2.4.4
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.5a
    text: |-
      Indien de beheerder van het gesloten distributiesysteem gebruik wenst te maken van de in de
      [Allocatiecode gas][ref1] genoemde berichten zijn de volgende bepalingen van overeenkomstige toepassing op de
      beheerder van het gesloten distributiesysteem:

      a. [paragraaf 2.1.2][ref2] en [paragraaf 3.1][ref3],

      b. van de [Allocatiecode gas][ref4] de [artikelen 2.0.7a][ref5], [2.2.1][ref6], [2.2.2][ref7], [2.4.1][ref8],
      [2.4.3][ref9], de [paragrafen 2.5][ref10], [2.6][ref11] en [2.7][ref12], de [artikelen 4.3.1.13][ref13],
      [4.1a][ref14], [bijlage B1a](onbekend), [bijlage B2b](onbekend) en [bijlage B5.6](onbekend),

      c. de [Informatiecode elektriciteit en gas][ref15], met uitzondering van de [hoofdstukken 3][ref16], [5][ref17] en
      [8][ref18] alsmede van [9.1.1][ref19] en [9.1.3][ref20].


      [ref1]: https://wetten.overheid.nl/BWBR0037931
      [ref2]: https://wetten.overheid.nl/BWBR0037926#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0037926#Hoofdstuk3
