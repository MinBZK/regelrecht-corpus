preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat van de zijde van de Algemene Rekenkamer bezwaren zijn geuit tegen het
    verlenen van voorschotten op de rijksbijdragen aan de Algemene Kas, bedoeld in artikel 71 van de Ziekenfondswet,
    en het Algemeen Fonds Bijzondere Ziektekosten, voordat de hoogte daarvan overeenkomstig de wettelijke regels is
    vastgesteld;

    dat de hoogte van de rijksbijdragen evenwel in belangrijke mate afhankelijk is van beslissingen gedurende het
    begrotingsjaar ten aanzien van de allocatie van begrotings- en premiemiddelen en dat derhalve op grond van de thans
    geldende voorschriften tijdige bevoorschotting niet kan plaatsvinden;

    dat het in verband daarmee wenselijk is de wettelijke procedures inzake het verlenen van rijksbijdragen te
    wijzigen;

    dat het voorts wenselijk is een wettelijke basis te scheppen voor het verlenen van rijksbijdragen aan de
    instellingen die een publiekrechtelijke ziektekostenvoorziening uitvoeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009273/1998-01-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      Voor de toepassing van [artikel 39, zevende lid, van de Wet financiering volksverzekeringen][ref1] worden
      uitgaven en ontvangsten met betrekking tot het Besluit Ziekenfondsraad Abortusklinieken, welke na het tijdstip van
      inwerkingtreding van deze wet hebben plaatsgevonden, gelijkgesteld met uitgaven en ontvangsten met betrekking tot
      de in dat artikellid bedoelde regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel39
    url: https://wetten.overheid.nl/BWBR0009273/1998-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '39'
  - number: IV
    text: |-
      Deze wet treedt in werking met ingang van 1 januari van het jaar volgende op het jaar waarin zij
      in het Staatsblad wordt geplaatst. De [artikelen 14a van de Ziekenfondswet][ref1] en 39 van de
      [Wet financiering volksverzekeringen][ref2], zoals die luidden onmiddellijk voor de inwerkingtreding
      van deze wet, blijven van toepassing op de rijksbijdragen aan de Algemene Kas, bedoeld in
      [artikel 71 van de Ziekenfondswet][ref3], en aan het Algemeen Fonds Bijzondere Ziektekosten voor de jaren voor het
      jaar waarin deze wet in werking treedt. [Artikel 17a van de Ziekenfondswet][ref4] werkt terug tot en met 1 januari
      1989 en vervalt met ingang van 1 januari 1998.


