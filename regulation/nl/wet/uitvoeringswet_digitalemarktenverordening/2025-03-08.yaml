preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om regels te stellen ter uitvoering van verordening
    (EU) 2022/1925 van het Europees Parlement en de Raad van 14 september 2022 over betwistbare en eerlijke markten in
    de digitale sector, en tot wijziging van Richtlijnen (EU) 2019/1937 en (EU) 2020/1828 (digitalemarktenverordening)
    (PbEU 2022, L 265);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050710/2025-03-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

        - *Autoriteit Consument en Markt:* Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *digitalemarktenverordening:* [verordening (EU) 2022/1925](32022R1925) van het Europees Parlement en de Raad van
      14 september 2022 over betwistbare en eerlijke markten in de digitale sector, en tot wijziging van [Richtlijnen
      (EU) 2019/1937](32019L1937) en [(EU) 2020/1828](32020L1828) (digitalemarktenverordeningdigitalemarktenverordening)
      (PbEU 2022, L 265).


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0050710/2025-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
  - number: '2'
    text: |-
      1 De Autoriteit Consument en Markt is de bevoegde autoriteit, bedoeld in artikel 38, zevende lid, van de
      digitalemarktenverordening en belast met het toezicht op de naleving van de artikelen 5, 6 en 7 van de
      digitalemarktenverordening in Nederland.

      2 De [artikelen 12h][ref1], [12j][ref2] en
      [12m, eerste lid, aanhef en onderdeel b, en tweede lid, van de Instellingswet Autoriteit Consument en Markt][ref3]
      zijn niet van toepassing op de uitvoering van het eerste lid.

      3 De Autoriteit Consument en Markt is bevoegd om de taken uit te voeren en de bevoegdheden uit te oefenen die bij
      of krachtens de digitalemarktenverordening zijn toegekend aan de nationale bevoegde autoriteit van de lidstaat die
      de regels, bedoeld in artikel 1, zesde lid, van de digitalemarktenverordening handhaaft.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12h
      [ref2]: https://wetten.overheid.nl/BWBR0033043#Artikel12j
      [ref3]: https://wetten.overheid.nl/BWBR0033043#Artikel12m
    url: https://wetten.overheid.nl/BWBR0050710/2025-03-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: 12h
      - id: ref2
        bwb_id: BWBR0033043
        artikel: 12j
      - id: ref3
        bwb_id: BWBR0033043
        artikel: 12m
  - number: '3'
    text: |-
      1 Met het verlenen van bijstand bij een inspectie op grond van de digitalemarktenverordening
      door de Europese Commissie zijn belast de ambtenaren, aangewezen krachtens
      [artikel 12a, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1].

      2 [Artikel 5:12 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.

      3 Bij verzet tegen een inspectie op grond van de digitalemarktenverordening door de Europese Commissie, verlenen de
      ambtenaren, bedoeld in het eerste lid, de nodige bijstand om de Europese Commissie in staat te stellen de inspectie
      te verrichten, zo nodig met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel512
    url: https://wetten.overheid.nl/BWBR0050710/2025-03-08#Artikel3
