  - number: 3a
    text: |-
      De Autoriteit Consument en Markt maakt jaarlijks een overzicht openbaar van het aantal meldingen van niet-naleving
      van onderscheidenlijk artikel 5, 6 en 7 van de digitalemarktenverordening dat zij heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0050710/2025-03-08#Artikel3a
  - number: '6'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0050710/2025-03-08#Artikel6
  - number: '7'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet digitalemarktenverordening.'
    url: https://wetten.overheid.nl/BWBR0050710/2025-03-08#Artikel7
