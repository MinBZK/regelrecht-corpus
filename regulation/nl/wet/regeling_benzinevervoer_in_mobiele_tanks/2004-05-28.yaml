preamble:
  text: |-
    Gelet op de artikelen 2, derde lid, en 15 van het Reglement Gevaarlijke Stoffen en op artikel 10 juncto 5 van de
    Richtlijn (EG) 94/63;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007744/2004-05-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            Minister:

              Minister van Verkeer en Waterstaat;



            b
            richtlijn:

              [Richtlijn 94/63/EG](31994L0063) van het Europees Parlement en de Raad van 20 december 1994 betreffende
      de beheersing van de uitstoot van vluchtige organische stoffen (VOS) als gevolg van de opslag van benzine en de
      distributie van benzine vanaf terminals naar benzinestations;



            c
            benzine:

              aardoliederivaat, met of zonder additieven, met een volgens de Reidmethode bepaalde dampdruk van 27,6
      kilopascal of meer, dat voor gebruik als brandstof voor motorvoertuigen is bestemd, met uitzondering van vloeibaar
      petroleumgas (LPG);



            d
             benzinestation:

              wat daaronder verstaan wordt in de [Regeling op-, overslag en distributie benzine milieubeheer][ref1];



            e
            terminal:

              wat daaronder verstaan wordt in de [Regeling op-, overslag en distributie benzine milieubeheer][ref2];



            f
             damp:

              gasvormige, uit benzine vervluchtigende verbinding;



            g
            mobiele tank:

              over de weg, per spoor of over het water vervoerde tank die wordt gebruikt voor de overbrenging van benzine
      van een terminal naar een andere terminal of naar een benzinestation;



            h
            opslaginstallatie:

              een vaste tank die op een terminal voor de opslag van benzine wordt gebruikt;



            i
            voorlopige dampopslag:

              voorlopige dampopslag in een tank met vast dak op een terminal voor latere overbrenging naar
      en terugwinning op een andere terminal, uitgezonderd de overbrenging van damp van de ene naar de andere
      opslaginstallatie op een terminal.


      [ref1]: https://wetten.overheid.nl/BWBR0007806
      [ref2]: https://wetten.overheid.nl/BWBR0007806
    url: https://wetten.overheid.nl/BWBR0007744/2004-05-28#Artikel1
