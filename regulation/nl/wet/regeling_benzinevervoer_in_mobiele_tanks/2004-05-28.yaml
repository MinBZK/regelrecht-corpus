  - number: '2'
    text: |-
      1 Mobiele tanks worden zodanig ontworpen en geëxploiteerd, dat de restdampen na het lossen van de benzine in de
      tank blijven.

      2 Mobiele tanks die benzine aan benzinestations of aan terminals leveren, worden zodanig ontworpen en
      geëxploiteerd, dat zij retourdampen uit de opslaginstallaties van de benzinestations of de terminals opvangen en
      opslaan. Voor tankwagons is dit alleen vereist wanneer zij benzine leveren aan benzinestations of aan terminals met
      voorlopige dampopslag.

      3 De in het eerste en tweede lid bedoelde dampen blijven in de mobiele tank opgeslagen totdat in een terminal wordt
      herladen, uitgezonderd voor de afvoer via de veiligheidsoverdrukkleppen.

      4 Wanneer de schipper aannemelijk kan maken dat de mobiele tank na het lossen van de benzine
      zal worden beladen met een ander product dan benzine en wanneer op de plaats van het lossen
      van de benzine en het laden van het andere product geen voorzieningen voor dampterugwinning of
      voorlopige dampopslag aanwezig zijn, is ontgassing toegestaan, onverminderd randnummer 7.2.3.7 van
      [bijlage 1 van de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref1].

      5 Een aangewezen instantie als bedoeld in
      [bijlage 4 van de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref2], voorzover betreffende
      randnummer 7.2.3.7, kan de ontgassing, bedoeld in het vierde lid, voor de binnenvaart verbieden voor een bepaalde
      periode, indien dit verbod strekt ter uitvoering van een door de Minister aangewezen geoperationaliseerd regionaal
      of lokaal programma ter bestrijding van milieuverontreiniging. Een zodanig programma is in ieder geval het
      waarschuwingssysteem verhoogde luchtverontreiniging DCMR van de DCMR Milieudienst Rijnmond.


      [ref1]: https://wetten.overheid.nl/BWBR0010115
      [ref2]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0007744/2004-05-28#Artikel2
