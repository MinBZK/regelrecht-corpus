preamble:
  text: |-
    Gelet op de artikelen 2, derde lid, en 15 van het Reglement Gevaarlijke Stoffen en op artikel 10 juncto 5 van de
    Richtlijn (EG) 94/63;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007744/2004-05-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            Minister:

              Minister van Verkeer en Waterstaat;



            b
            richtlijn:

              [Richtlijn 94/63/EG](31994L0063) van het Europees Parlement en de Raad van 20 december 1994 betreffende
      de beheersing van de uitstoot van vluchtige organische stoffen (VOS) als gevolg van de opslag van benzine en de
      distributie van benzine vanaf terminals naar benzinestations;



            c
            benzine:

              aardoliederivaat, met of zonder additieven, met een volgens de Reidmethode bepaalde dampdruk van 27,6
      kilopascal of meer, dat voor gebruik als brandstof voor motorvoertuigen is bestemd, met uitzondering van vloeibaar
      petroleumgas (LPG);



            d
             benzinestation:

              wat daaronder verstaan wordt in de [Regeling op-, overslag en distributie benzine milieubeheer][ref1];



            e
            terminal:

              wat daaronder verstaan wordt in de [Regeling op-, overslag en distributie benzine milieubeheer][ref2];



            f
             damp:

              gasvormige, uit benzine vervluchtigende verbinding;



            g
            mobiele tank:

              over de weg, per spoor of over het water vervoerde tank die wordt gebruikt voor de overbrenging van benzine
      van een terminal naar een andere terminal of naar een benzinestation;



            h
            opslaginstallatie:

              een vaste tank die op een terminal voor de opslag van benzine wordt gebruikt;



            i
            voorlopige dampopslag:

              voorlopige dampopslag in een tank met vast dak op een terminal voor latere overbrenging naar
      en terugwinning op een andere terminal, uitgezonderd de overbrenging van damp van de ene naar de andere
      opslaginstallatie op een terminal.

      [ref1]: https://wetten.overheid.nl/BWBR0007806
      [ref2]: https://wetten.overheid.nl/BWBR0007806
    url: https://wetten.overheid.nl/BWBR0007744/2004-05-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007806
      - id: ref2
        bwb_id: BWBR0007806
  - number: '2.1'
    text: |-
      Mobiele tanks worden zodanig ontworpen en geëxploiteerd, dat de restdampen na het lossen van de benzine in de tank
      blijven.
    url: https://wetten.overheid.nl/BWBR0007744/2004-05-28#Artikel2
    machine_readable:
      logical_structure:
        - condition: "mobiele tank wordt gebruikt voor vervoer van benzine"
          action: "restdampen moeten na lossen in de tank blijven"
      executable: true
  - number: '2.2'
    text: |-
      Mobiele tanks die benzine aan benzinestations of aan terminals leveren, worden zodanig ontworpen en geëxploiteerd,
      dat zij retourdampen uit de opslaginstallaties van de benzinestations of de terminals opvangen en opslaan. Voor
      tankwagons is dit alleen vereist wanneer Zij benzine leveren aan benzinestations of aan terminals met voorlopige
      dampopslag.
    url: https://wetten.overheid.nl/BWBR0007744/2004-05-28#Artikel2
    machine_readable:
      logical_structure:
        - condition: "mobiele tank levert benzine aan benzinestation OF terminal"
          action: "retourdampen moeten worden opgevangen en opgeslagen"
        - condition: "tankwagon levert benzine"
          subcondition: "benzinestation OF terminal heeft voorlopige dampopslag"
          action: "retourdampen moeten worden opgevangen en opgeslagen"
      executable: true
  - number: '2.3'
    text: |-
      De in het eerste en tweede lid bedoelde dampen blijven in de mobiele tank opgeslagen totdat in een terminal wordt
      herladen, uitgezonderd voor de afvoer via de veiligheidsoverdrukkleppen.
    url: https://wetten.overheid.nl/BWBR0007744/2004-05-28#Artikel2
    machine_readable:
      logical_structure:
        - condition: "dampen bedoeld in 2.1 OF 2.2"
          action: "dampen moeten in mobiele tank blijven tot herladen in terminal"
          exception: "afvoer via veiligheidsoverdrukkleppen"
      executable: true
  - number: '2.4'
    text: |-
      Wanneer de schipper aannemelijk kan maken dat de mobiele tank na het lossen van de benzine
      zal worden beladen met een ander product dan benzine en wanneer op de plaats van het lossen
      van de benzine en het laden van het andere product geen voorzieningen voor dampterugwinning of
      voorlopige dampopslag aanwezig zijn, is ontgassing toegestaan, onverminderd randnummer 7.2.3.7 van
      [bijlage 1 van de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0007744/2004-05-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010115
    machine_readable:
      logical_structure:
        - condition: "schipper kan aannemelijk maken dat mobiele tank na lossen benzine wordt beladen met ander product"
          subcondition: "geen voorzieningen voor dampterugwinning OF voorlopige dampopslag op plaats van lossen en laden"
          action: "ontgassing is toegestaan"
          reference: "randnummer 7.2.3.7 van bijlage 1 van Regeling vervoer over de binnenwateren van gevaarlijke stoffen"
      executable: true
  - number: '2.5'
    text: |-
      Een aangewezen instantie als bedoeld in
      [bijlage 4 van de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref1], voorzover betreffende
      randnummer 7.2.3.7, kan de ontgassing, bedoeld in het vierde lid, voor de binnenvaart verbieden voor een bepaalde
      periode, indien dit verbod strekt ter uitvoering van een door de Minister aangewezen geoperationaliseerd regionaal
      of lokaal programma ter bestrijding van milieuverontreiniging. Een zodanig programma is in ieder geval het
      waarschuwingssysteem verhoogde luchtverontreiniging DCMR van de DCMR Milieudienst Rijnmond.


      [ref1]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0007744/2004-05-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010115
    machine_readable:
      logical_structure:
        - condition: "aangewezen instantie (bijlage 4 Regeling vervoer binnenwateren gevaarlijke stoffen) betreffende randnummer 7.2.3.7"
          action: "kan ontgassing voor binnenvaart verbieden voor bepaalde periode"
          subcondition: "verbod strekt ter uitvoering van geoperationaliseerd regionaal OF lokaal programma ter bestrijding van milieuverontreiniging"
          example: "waarschuwingssysteem verhoogde luchtverontreiniging DCMR"
      executable: true
  - number: '3.1'
    text: |-
      Op het testen van de dampdichtheid van mobiele tanks die over de weg worden vervoerd is randnummer 6.8.2.4.3 van
      [bijlage 1 bij de Regeling vervoer over land van gevaarlijke stoffen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010054
    url: https://wetten.overheid.nl/BWBR0007744/2004-05-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010054
    machine_readable:
      logical_structure:
        - condition: "mobiele tank wordt over de weg vervoerd"
          action: "toepassen randnummer 6.8.2.4.3 van bijlage 1 Regeling vervoer over land van gevaarlijke stoffen"
          reference: "BWBR0010054 randnummer 6.8.2.4.3"
      executable: true
  - number: '3.2'
    text: |-
      De juiste werking van de vacuümdrukkleppen van de mobiele tanks wordt
      gecontroleerd met inachtneming van de randnummers 6.8.2.4.2 en 6.8.2.4.3 van
      [bijlage 1 bij de Regeling vervoer over land van gevaarlijke stoffen][ref1], de randnummers 6.8.2.4.2
      en 6.8.2.4.3 van [bijlage 1 bij de Regeling vervoer over de spoorweg van gevaarlijke stoffen][ref2]
      onderscheidenlijk de randnummers 8.1.8 en 9.3.2.22.4 van
      [bijlage 1 bij de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010054
      [ref2]: https://wetten.overheid.nl/BWBR0010053
      [ref3]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0007744/2004-05-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010054
      - id: ref2
        bwb_id: BWBR0010053
      - id: ref3
        bwb_id: BWBR0010115
    machine_readable:
      logical_structure:
        - condition: "mobiele tank wordt over de weg vervoerd"
          action: "controle juiste werking vacuümdrukkleppen volgens randnummers 6.8.2.4.2 en 6.8.2.4.3 van bijlage 1 Regeling vervoer over land van gevaarlijke stoffen"
          reference: "BWBR0010054 randnummers 6.8.2.4.2 en 6.8.2.4.3"
        - condition: "mobiele tank wordt per spoor vervoerd"
          action: "controle juiste werking vacuümdrukkleppen volgens randnummers 6.8.2.4.2 en 6.8.2.4.3 van bijlage 1 Regeling vervoer over spoorweg van gevaarlijke stoffen"
          reference: "BWBR0010053 randnummers 6.8.2.4.2 en 6.8.2.4.3"
