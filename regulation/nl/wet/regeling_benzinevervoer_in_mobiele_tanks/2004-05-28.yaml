  - number: '3'
    text: |-
      1 Op het testen van de dampdichtheid van mobiele tanks die over de weg worden vervoerd is randnummer 6.8.2.4.3 van
      [bijlage 1 bij de Regeling vervoer over land van gevaarlijke stoffen][ref1] van toepassing.

      2 De juiste werking van de vacuümdrukkleppen van de mobiele tanks wordt
      gecontroleerd met inachtneming van de randnummers 6.8.2.4.2 en 6.8.2.4.3 van
      [bijlage 1 bij de Regeling vervoer over land van gevaarlijke stoffen][ref2], de randnummers 6.8.2.4.2
      en 6.8.2.4.3 van [bijlage 1 bij de Regeling vervoer over de spoorweg van gevaarlijke stoffen][ref3]
      onderscheidenlijk de randnummers 8.1.8 en 9.3.2.22.4 van
      [bijlage 1 bij de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0010054
      [ref2]: https://wetten.overheid.nl/BWBR0010054
