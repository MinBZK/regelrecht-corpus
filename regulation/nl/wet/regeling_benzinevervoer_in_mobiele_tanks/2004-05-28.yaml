          action: "controle juiste werking vacuümdrukkleppen volgens randnummers 8.1.8 en 9.3.2.22.4 van bijlage 1 Regeling vervoer over binnenwateren van gevaarlijke stoffen"
          reference: "BWBR0010115 randnummers 8.1.8 en 9.3.2.22.4"
      executable: true
