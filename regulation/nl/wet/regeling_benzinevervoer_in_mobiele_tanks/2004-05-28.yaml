  - number: '4'
    text: |-
      1 [Artikel 2][ref1] is van toepassing:

      a) met ingang van 31 december 1995 ten aanzien van nieuwe tankwagens, tankwagons en schepen;

      b) met ingang van 31 december 1998 ten aanzien van voor 31 december 1995 in gebruik zijnde tankwagons en schepen,
      indien zij worden gevuld in of op een terminal waarop artikel 4, eerste lid, van de richtlijn van toepassing is;

      c) ten aanzien van voor 31 december 1995 in gebruik zijnde tankwagens, wanneer zij worden omgebouwd voor vulling
      langs de onderzijde overeenkomstig de specificaties 1.1, 1.2, 2.3, 3.1, 3.2, 3.4, 3.5, 4.1.1 tot en met 4.1.4, en
      5.2 van bijlage IV van de richtlijn.

      2 [Artikel 2][ref2] is niet van toepassing op dampverliezen ten gevolge van metingen met peilstokken bij mobiele
      tanks die voor 1 januari 2000 in gebruik zijn genomen.


