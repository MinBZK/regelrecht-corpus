---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: algemene_wet_inkomensafhankelijke_regelingen
regulatory_layer: WET
publication_date: '2022-12-27'
valid_from: '2007-01-01'
bwb_id: BWBR0018472
url: https://wetten.overheid.nl/BWBR0018472/2007-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is inkomensafhankelijke regelingen, zoals die op het punt
    van wonen, kinderen en zorg, zoveel mogelijk te harmoniseren door een aantal algemene begrippen in die regelingen
    onder te brengen in één nieuwe wet, en de uitvoering van deze regelingen te stroomlijnen door deze waar mogelijk te
    laten plaatsvinden door de Belastingdienst/Toeslagen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: Deze wet geldt voor inkomensafhankelijke regelingen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel1
  - number: '1.2'
    text: |-
      In afwijking van het eerste lid is deze wet op inkomensafhankelijke regelingen die vóór 1 januari 2006 van kracht
      zijn, slechts van toepassing voor zover dit in de desbetreffende inkomensafhankelijke regeling is bepaald.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel1
  - number: '1.3'
    text: |-
      Onder inkomensafhankelijke regelingen worden verstaan bij of krachtens wet vastgestelde regelingen die natuurlijke
      personen aanspraak geven op een financiële bijdrage van het Rijk in kosten of bijdrageverplichtingen, waarbij de
      hoogte van de bijdrage in die regelingen afhankelijk is gesteld van draagkracht.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel1
  - number: '2.1'
    text: 'In deze wet en de daarop berustende bepalingen, alsmede in inkomensafhankelijke regelingen, wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
  - number: 2.1.a
    text: |-
      belastbaar loon: het belastbare loon bedoeld in [artikel 9 van de Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '9'
  - number: 2.1.b
    text: 'berekeningsjaar: het kalenderjaar waarop de tegemoetkoming betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
  - number: 2.1.c
    text: |-
      bestuurlijke boete: de bestuurlijke sanctie, inhoudende een onvoorwaardelijke verplichting tot betaling van een
      geldsom, die is gericht op bestraffing van de overtreder;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
  - number: 2.1.d
    text: |-
      jaaropgaaf: de opgaaf bedoeld in [artikel 28, onderdeel d, van de Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
  - number: 2.1.e
    text: |-
      kind: de persoon bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel4
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 2.1.f
    text: |-
      lidstaat: een Staat die lid is van de Europese Unie of een andere Staat, niet zijnde een lidstaat van de Europese
      Unie, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
  - number: 2.1.g
    text: |-
      medebewoner: de persoon die op hetzelfde woonadres als de belanghebbende staat ingeschreven in de gemeentelijke
      basisadministratie persoonsgegevens, met dien verstande dat als medebewoner niet wordt aangemerkt:
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
  - number: 2.1.g.1°
    text: de partner van de belanghebbende,
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
  - number: 2.1.g.2°
    text: |-
      de persoon die op basis van een schriftelijke overeenkomst met de belanghebbende een deel van de woning huurt,
      tenzij deze een bloed- of aanverwant in de eerste graad is van de belanghebbende of van diens partner,
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
  - number: 2.1.g.3°
    text: degene die tot het huishouden van de onder 2° bedoelde persoon behoort;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
  - number: 2.1.h
    text: |-
      partner: de persoon bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel3
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 2.1.i
    text: |-
      sociaal-fiscaalnummer: het nummer bedoeld in
      [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: 2.1.j
    text: 'tegemoetkoming: een financiële bijdrage van het Rijk op grond van een inkomensafhankelijke regeling;'
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
  - number: 2.1.k
    text: |-
      toetsingsinkomen: het inkomen bedoeld in [artikel 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel8
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 2.1.l
    text: |-
      verzamelinkomen: het verzamelinkomen bedoeld in [artikel 2.18 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 2.1.m
    text: |-
      vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 2.1.n
    text: |-
      inspecteur: de inspecteur, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: 2.1.o
    text: |-
      niet in Nederland belastbaar inkomen: inkomen dat niet in het verzamelinkomen of het
      belastbare loon is begrepen omdat het niet behoort tot het Nederlandse inkomen, bedoeld in
      [artikel 7.1 van de Wet inkomstenbelasting 2001][ref1], of omdat het is vrijgesteld op grond van bepalingen van
      interregionaal of internationaal recht;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel7
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '7'
  - number: 2.1.p
    text: |-
      ontvanger: de ontvanger, bedoeld in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
  - number: 2.1.q
    text: |-
      beschikking verzamelinkomen: de beschikking bedoeld in
      [artikel 9.4, vijfde lid, van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
  - number: '2.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder Onze Minister: Onze Minister van Financiën.'
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel2
  - number: '3.1'
    text: 'De partner van de belanghebbende is degene die hierna als eerste wordt genoemd:'
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
  - number: 3.1.a
    text: de niet duurzaam gescheiden levende echtgenoot of geregistreerde partner;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
  - number: 3.1.b
    text: |-
      degene die op hetzelfde woonadres als de belanghebbende staat ingeschreven in de gemeentelijke basisadministratie
      persoonsgegevens en:
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
  - number: 3.1.b.1°
    text: |-
      voor de toepassing van de [Wet inkomstenbelasting 2001][ref1] voor het berekeningsjaar kiest voor kwalificatie als
      partner van de belanghebbende;


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 3.1.b.2°
    text: ten overstaan van een notaris een samenlevingscontract heeft gesloten met de belanghebbende;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
  - number: 3.1.b.3°
    text: uit wiens relatie met de belanghebbende een kind is geboren;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
  - number: 3.1.b.4°
    text: een kind van de belanghebbende heeft erkend dan wel van wie een kind door de belanghebbende is erkend;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
  - number: 3.1.b.5°
    text: in een aan het berekeningsjaar voorafgaand kalenderjaar partner van de belanghebbende was;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
  - number: 3.1.b.6°
    text: voor de toepassing van een pensioenregeling als partner van de belanghebbende is aangemeld, of
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
  - number: 3.1.b.7°
    text: |-
      samen met de belanghebbende een woning bewoont die voor hen een eigen woning is in de zin van
      [artikel 3.111 van de Wet inkomstenbelasting 2001][ref1], en aansprakelijk is of mede aansprakelijk is voor een
      schuld waarbij die woning als onderpand dient;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 3.1.c
    text: |-
      de meerderjarige die in het berekeningsjaar gedurende meer dan zes maanden onafgebroken een gezamenlijke
      huishouding voert met de meerderjarige belanghebbende en gedurende die tijd op hetzelfde woonadres als de
      belanghebbende staat ingeschreven in de gemeentelijke basisadministratie persoonsgegevens, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
  - number: 3.1.c.1°
    text: de bloed- of aanverwant in de rechte lijn van de belanghebbende;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
  - number: 3.1.c.2°
    text: |-
      de bloed- of aanverwant in de tweede graad van de zijlijn van de belanghebbende gedurende de periode dat de
      belanghebbende op hetzelfde woonadres als zijn ouder staat ingeschreven in de gemeentelijke basisadministratie
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
  - number: '3.2'
    text: |-
      Degene die ingevolge het eerste lid voor een deel van het berekeningsjaar als partner wordt aangemerkt, wordt ook
      als partner aangemerkt in de andere perioden van het berekeningsjaar, voor zover hij in die perioden op het zelfde
      woonadres als de belanghebbende staat ingeschreven in de gemeentelijke basisadministratie persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
  - number: '3.3'
    text: |-
      Indien ingevolge het eerste lid, onderdeel c, tegelijkertijd meer dan één persoon als partner wordt aangemerkt,
      wijst de belanghebbende bij de aanvraag van de tegemoetkoming een van deze personen aan als partner.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel3
  - number: '4.1'
    text: |-
      Kind is de bloedverwant of aanverwant in de neergaande lijn van de belanghebbende of zijn partner, die in
      belangrijke mate wordt onderhouden door de belanghebbende of zijn partner en op hetzelfde woonadres als de
      belanghebbende staat ingeschreven in de gemeentelijke basisadministratie persoonsgegevens. Met een bloedverwant of
      aanverwant in de neergaande lijn wordt gelijkgesteld een pleegkind.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel4
  - number: '4.2'
    text: |-
      De in het eerste lid opgenomen voorwaarde van inschrijving in de gemeentelijke basisadministratie persoonsgegevens
      geldt niet gedurende de periode waarin de aldaar bedoelde persoon tegelijkertijd tot de huishoudens van zijn
      beide ouders behoort en hij op hetzelfde woonadres als een van die ouders staat ingeschreven in de gemeentelijke
      basisadministratie persoonsgegevens. Voor de toepassing van de eerste volzin behoort iemand tegelijkertijd tot het
      huishouden van beide ouders indien hij doorgaans ten minste drie gehele dagen per week in elk van beide huishoudens
      verblijft.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel4
  - number: '4.3'
    text: |-
      Een kind wordt in belangrijke mate onderhouden als bedoeld in het eerste lid indien is voldaan aan de regels
      gesteld krachtens [artikel 1.5 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: '5'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen, alsmede voor de toepassing van
      inkomensafhankelijke regelingen, wordt met de aanwezigheid van een partner of medebewoner geen rekening gehouden in
      de kalendermaand waarin het partnerschap of medebewonerschap aanvangt of eindigt.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel5
  - number: '6.1'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt met de gemeentelijke basisadministratie
      persoonsgegevens gelijkgesteld een daarmee naar aard en strekking overeenkomende administratie buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel6
  - number: '6.2'
    text: |-
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid kunnen
      regels worden gesteld op basis waarvan iemand die niet in Nederland woont, geacht wordt op zijn woonadres te zijn
      ingeschreven in een naar aard en strekking met de gemeentelijke basisadministratie persoonsgegevens overeenkomende
      administratie buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel6
  - number: '6.3'
    text: |-
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid kunnen
      regels worden gesteld op basis waarvan iemand die in de gemeentelijke basisadministratie persoonsgegevens niet op
      zijn woonadres is ingeschreven, geacht wordt daarin wel op dat adres te zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel6
  - number: '6.4'
    text: Voor de toepassing van het tweede en derde lid wordt naar de omstandigheden beoordeeld waar iemand woont.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel6
  - number: '7.1'
    text: |-
      Ter bepaling van de draagkracht voor de toepassing van een inkomensafhankelijke regeling wordt het
      toetsingsinkomen, bedoeld in [artikel 8][ref1], van de belanghebbende en dat van zijn partner in aanmerking
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel8
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '7.2'
    text: |-
      Indien in een inkomensafhankelijke regeling is bepaald dat naast de draagkracht van de belanghebbende en diens
      partner ook de draagkracht van medebewoners van belang is voor de beoordeling van de aanspraak op of de bepaling
      van de hoogte van een tegemoetkoming, wordt mede het toetsingsinkomen van de medebewoners in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien in een inkomensafhankelijke regeling de aanspraak op een tegemoetkoming mede afhankelijk is gesteld van het
      vermogen, bestaat geen aanspraak op een tegemoetkoming, indien bij de belanghebbende of, indien de belanghebbende
      het gehele berekeningsjaar dezelfde partner heeft, zijn partner over het berekeningsjaar voordeel uit sparen
      en beleggen als bedoeld in [artikel 5.2 van de Wet inkomstenbelasting 2001][ref1] in aanmerking wordt genomen,
      dan wel in aanmerking zou worden genomen indien geen rekening wordt gehouden met de vrijstellingen bedoeld in
      [afdeling 5.3][ref2] en [5.3A van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Afdeling5.3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Afdeling5.3A
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011353
        afdeling: '5.3'
      - id: ref3
        bwb_id: BWBR0011353
        afdeling: 5.3A
  - number: '7.4'
    text: |-
      Indien in een inkomensafhankelijke regeling de aanspraak op een tegemoetkoming mede afhankelijk
      is gesteld van het vermogen van medebewoners, bestaat tevens geen aanspraak op een tegemoetkoming
      indien bij een medebewoner over het berekeningsjaar voordeel uit sparen en beleggen als bedoeld in
      [artikel 5.2 van de Wet inkomstenbelasting 2001][ref1] in aanmerking wordt genomen, dan wel in aanmerking zou
      worden genomen indien geen rekening wordt gehouden met de vrijstellingen bedoeld in [afdeling 5.3][ref2] en
      [5.3A van die wet][ref3]. Het bepaalde in de eerste volzin geldt alleen ten aanzien van degenen van wie het
      medebewonerschap het gehele berekeningsjaar heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Afdeling5.3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Afdeling5.3A
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011353
        afdeling: '5.3'
      - id: ref3
        bwb_id: BWBR0011353
        afdeling: 5.3A
  - number: '7.5'
    text: |-
      Het toetsingsinkomen van een medebewoner die een eerstegraads bloed- of aanverwant in de neergaande lijn of
      een pleegkind is van de belanghebbende, van zijn partner, of van een medebewoner, en die bij de aanvang van het
      berekeningsjaar de leeftijd van 23 jaar niet heeft bereikt, wordt voor de toepassing van het tweede lid slechts in
      aanmerking genomen voor zover het meer bedraagt dan € 4204.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel7
  - number: '7.6'
    text: |-
      Met betrekking tot het bedrag vermeld in het vijfde lid zijn de [artikelen 10.1][ref1] en
      [10.2 van de Wet inkomstenbelasting 2001][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '8.1'
    text: 'Toetsingsinkomen is:'
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8
  - number: 8.1.a
    text: |-
      indien over het berekeningsjaar een aanslag inkomstenbelasting is of wordt vastgesteld: het verzamelinkomen, zoals
      dat in die aanslag is of wordt opgenomen of zoals dat bij beschikking is of wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8
  - number: 8.1.b
    text: |-
      indien over het berekeningsjaar geen aanslag inkomstenbelasting is of wordt vastgesteld: het belastbare loon, zoals
      dat blijkt uit de op het berekeningsjaar betrekking hebbende jaaropgaven, vermeerderd met het belastbare loon van
      het berekeningsjaar waarover loonbelasting is nageheven van de werknemer.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien over het berekeningsjaar een navorderingsaanslag inkomstenbelasting is vastgesteld is, in afwijking van het
      eerste lid, het in die navorderingsaanslag opgenomen verzamelinkomen het toetsingsinkomen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8
  - number: '8.3'
    text: |-
      Niet in Nederland belastbaar inkomen, zoals dat bij beschikking is vastgesteld, wordt in aanvulling op het eerste
      en tweede lid mede als toetsingsinkomen in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8
  - number: '8.4'
    text: |-
      Indien zulks leidt tot een ten minste 10 percent lager toetsingsinkomen, wordt bij beëindiging van het partnerschap
      in het berekeningsjaar, in afwijking in zoverre van het eerste tot en met het derde lid, op verzoek van de
      belanghebbende bij de berekening van het toetsingsinkomen van de partner:
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8
  - number: 8.4.a
    text: 'geen rekening gehouden met:'
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8
  - number: 8.4.a.1°
    text: belastbaar loon dat is genoten na de beëindiging van het partnerschap;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8
  - number: 8.4.a.2°
    text: winst uit een onderneming die na de beëindiging van het partnerschap is gestart; en
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8
  - number: 8.4.a.3°
    text: |-
      belastbaar resultaat uit overige werkzaamheden indien de werkzaamheden na beëindiging van het partnerschap zijn
      gestart;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8
  - number: 8.4.b
    text: het belastbare loon dat in de periode van partnerschap is genoten tijdsevenredig herleid naar een jaarloon.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8
  - number: '8.5'
    text: |-
      Bij beëindiging van het medebewonerschap in het berekeningsjaar is het vierde lid van overeenkomstige toepassing
      met betrekking tot het toetsingsinkomen van de medebewoner.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8
  - number: '8.6'
    text: |-
      Bij overlijden van de belanghebbende, zijn partner, of een medebewoner wordt, in afwijking in zoverre van het
      eerste tot en met het derde lid het toetsingsinkomen van de overledene berekend door het op grond van die leden
      bepaalde toetsingsinkomen tijdsevenredig te herleiden naar een jaarinkomen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8
  - number: '8.7'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van het vierde tot en met het
      zesde lid.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8
  - number: 8a.1
    text: Het niet in Nederland belastbaar inkomen wordt vastgesteld door de inspecteur.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8a
  - number: 8a.2
    text: 'Het niet in Nederland belastbaar inkomen is:'
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8a
  - number: 8a.2.a
    text: |-
      ten aanzien van degene die binnenlandse belastingplichtige is voor de inkomstenbelasting: het verschil tussen het
      verzamelinkomen dat hij zou hebben genoten ingeval er geen vrijstelling van interregionaal of internationaal recht
      van toepassing zou zijn en het verzamelinkomen dat hij met toepassing van de vrijstelling geniet;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8a
  - number: 8a.2.b
    text: |-
      ten aanzien van degene die buitenlandse belastingplichtige is voor de inkomstenbelasting: het
      verschil tussen enerzijds het verzamelinkomen dat hij zou hebben genoten ingeval hij op de voet van
      [artikel 2.5 van de Wet inkomstenbelasting 2001][ref1] zou hebben gekozen voor toepassing van de regels voor
      binnenlandse belastingplichtigen en, in geval van vrijstelling op grond van bepalingen van interregionaal of
      internationaal recht, zonder die vrijstelling, en anderzijds het verzamelinkomen dat hij heeft genoten als
      buitenlandse belastingplichtige;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 8a.2.c
    text: |-
      ten aanzien degene die geen belastingplichtige is voor de inkomstenbelasting: het verzamelinkomen dat hij
      zou hebben genoten ingeval hij binnenlandse belastingplichtige zou zijn voor die belasting en, in geval van
      vrijstelling op grond van bepalingen van interregionaal of internationaal recht, zonder die vrijstelling.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8a
  - number: 8a.3
    text: |-
      Indien er grond is voor het vermoeden dat vaststelling van het niet in Nederland belastbaar inkomen ten onrechte
      achterwege is gelaten of dat dit inkomen tot een te laag bedrag is vastgesteld, kan de inspecteur alsnog het niet
      in Nederland belastbaar inkomen vaststellen dan wel het vastgestelde niet in Nederland belastbaar inkomen herzien.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8a
  - number: 8a.4
    text: |-
      Bij de in het eerste lid bedoelde vaststelling van het niet in Nederland belastbaar inkomen
      zijn, in afwijking in zoverre van de [Algemene wet bestuursrecht][ref1], de bepalingen van de
      [Algemene wet inzake rijksbelastingen][ref2], met uitzondering van de [hoofdstukken VA][ref3] en [VIIIA][ref4], van
      toepassing als betrof het de vaststelling van een aanslag inkomstenbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0002320
      [ref3]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVA
      [ref4]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVIIIA
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0002320
      - id: ref3
        bwb_id: BWBR0002320
        hoofdstuk: VA
      - id: ref4
        bwb_id: BWBR0002320
        hoofdstuk: VIIIA
  - number: 8a.5
    text: |-
      Bij de in het derde lid bedoelde vaststelling dan wel herziening van het niet in Nederland belastbaar
      inkomen zijn, in afwijking in zoverre van de [Algemene wet bestuursrecht][ref1], de bepalingen van de
      [Algemene wet inzake rijksbelastingen][ref2], met uitzondering van de [hoofdstukken VA][ref3] en [VIIIA][ref4], van
      toepassing als betrof het de vaststelling van een navorderingsaanslag inkomstenbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0002320
      [ref3]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVA
      [ref4]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVIIIA
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0002320
      - id: ref3
        bwb_id: BWBR0002320
        hoofdstuk: VA
      - id: ref4
        bwb_id: BWBR0002320
        hoofdstuk: VIIIA
  - number: 8a.6
    text: |-
      Een beschikking op grond van dit artikel wordt aangemerkt als een voor bezwaar vatbare beschikking als bedoeld in
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: '9.1'
    text: |-
      Indien aan een vreemdeling tijdens een rechtmatig verblijf als bedoeld in
      [artikel 8, onderdelen a tot en met e, en l, van de Vreemdelingenwet 2000][ref1] een tegemoetkoming is
      toegekend, heeft de omstandigheid dat hij aansluitend aan dit verblijf rechtmatig verblijf houdt in de zin van
      [artikel 8, onderdeel g of h, van die wet][ref2] niet tot gevolg dat hij daardoor zijn aanspraak verliest op
      eenzelfde tegemoetkoming gedurende de periode van laatstgenoemd verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '9.2'
    text: |-
      Ingeval de partner van de belanghebbende een vreemdeling is die niet rechtmatig verblijf houdt in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref1], heeft de belanghebbende geen aanspraak op een tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '9.3'
    text: |-
      Indien in een inkomensafhankelijke regeling is bepaald dat naast de draagkracht van de belanghebbende
      en diens partner ook de draagkracht van medebewoners van belang is voor de beoordeling van de aanspraak
      op of de bepaling van de hoogte van een tegemoetkoming, heeft de belanghebbende geen aanspraak op een
      tegemoetkoming ingeval een medebewoner een vreemdeling is die niet rechtmatig verblijf houdt in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '10.1'
    text: |-
      Een minderjarige is bekwaam de rechtshandelingen te verrichten die noodzakelijk zijn om een tegemoetkoming te
      verkrijgen. Hij is voorts bekwaam de rechtshandelingen te verrichten die noodzakelijk zijn met betrekking tot de
      uitoefening, onderscheidenlijk de nakoming van de voor hem uit de toekenning van tegemoetkomingen voortvloeiende
      rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel10
  - number: '10.2'
    text: |-
      Indien op grond van een inkomensafhankelijke regeling alleen meerderjarigen aanspraak op een tegemoetkoming hebben,
      wordt voor die regeling mede als meerderjarige aangemerkt de minderjarige met een kind of de minderjarige van wie
      beide ouders zijn overleden.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel10
  - number: '11.1'
    text: |-
      De bepalingen van dit hoofdstuk gelden voor de inkomensafhankelijke regelingen waarvan de uitvoering bij die
      regeling is opgedragen aan de Belastingdienst/Toeslagen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel11
  - number: '11.2'
    text: |-
      Onder Belastingdienst/Toeslagen wordt verstaan: het organisatieonderdeel van de rijksbelastingdienst dat is belast
      met het toekennen, uitbetalen en terugvorderen van tegemoetkomingen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel11
  - number: '12'
    text: |-
      Voor de toepassing van dit hoofdstuk blijft [titel 4.2 van de Algemene wet bestuursrecht][ref1] buiten toepassing
      en zijn [artikel 3:40][ref2] en de [hoofdstukken 4][ref3], [6][ref4] en [7 van die wet][ref5] niet van toepassing
      op de verrekeningsbeschikking als bedoeld in [artikel 30][ref6], en de aanmaning en het dwangbevel als bedoeld
      in [artikel 32][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
      [ref6]: https://wetten.overheid.nl/BWBR0018472#Artikel30
      [ref7]: https://wetten.overheid.nl/BWBR0018472#Artikel32
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005537
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0005537
        hoofdstuk: '7'
      - id: ref6
        bwb_id: BWBR0018472
        artikel: '30'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0018472
        artikel: '32'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '13'
    text: De Belastingdienst/Toeslagen maakt voor de uitvoering van deze wet gebruik van het sociaal-fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel13
  - number: '14.1'
    text: Een tegemoetkoming wordt op aanvraag toegekend door de Belastingdienst/Toeslagen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel14
  - number: '14.2'
    text: |-
      Indien partners een gezamenlijke aanspraak op een tegemoetkoming hebben, wordt de tegemoetkoming uitsluitend
      toegekend aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel14
  - number: '14.3'
    text: Het bedrag van de tegemoetkoming wordt rekenkundig afgerond op hele euro’s.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel14
  - number: '14.4'
    text: Een tegemoetkoming wordt niet toegekend indien deze minder dan € 24 zou bedragen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel14
  - number: '15.1'
    text: |-
      Een aanvraag om een tegemoetkoming met betrekking tot een berekeningsjaar kan tot 1 april van het jaar volgend
      op het berekeningsjaar worden ingediend bij de Belastingdienst/Toeslagen. Indien de belanghebbende, diens partner
      of een medebewoner voor de in de eerste volzin genoemde datum is uitgenodigd om over het berekeningsjaar aangifte
      inkomstenbelasting te doen binnen een termijn die na die datum verloopt, wordt de in die volzin bedoelde termijn
      verlengd tot de laatste dag van de door de inspecteur voor het indienen van die aangifte gestelde termijn. Indien
      meer dan een van de personen, bedoeld in de tweede volzin, is uitgenodigd om aangifte inkomstenbelasting te doen,
      wordt voor de toepassing van die volzin uitgegaan van de aangifte waarvan de indieningstermijn het laatst verloopt.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel15
  - number: '15.2'
    text: Indien de belanghebbende een partner heeft, wordt de aanvraag mede ondertekend door de partner.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel15
  - number: '15.3'
    text: |-
      Indien in een inkomensafhankelijke regeling is bepaald dat naast de draagkracht van belanghebbende en diens partner
      ook de draagkracht van medebewoners van belang is voor de beoordeling van de aanspraak op of de bepaling van de
      hoogte van een tegemoetkoming, wordt de aanvraag mede ondertekend door de medebewoners.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel15
  - number: '15.4'
    text: Een aanvraag wordt geacht mede te zijn gedaan voor op het berekeningsjaar volgende berekeningsjaren.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel15
  - number: '15.5'
    text: |-
      Indien de Belastingdienst/Toeslagen van oordeel is dat toepassing van het vierde lid kan worden beëindigd, deelt
      hij dit de belanghebbende schriftelijk mee.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel15
  - number: '15.6'
    text: |-
      De Belastingdienst/Toeslagen kan op eigen initiatief een aanvraagformulier toezenden aan degene die vermoedelijk
      voor een tegemoetkoming in aanmerking komt. Op dat formulier kunnen voor de belanghebbende en zijn niet duurzaam
      gescheiden levende echtgenoot of geregistreerde partner de gegevens worden vermeld die van belang kunnen zijn voor
      de beoordeling van de aanspraak of de bepaling van de hoogte van de tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel15
  - number: '15.7'
    text: |-
      In bij algemene maatregel van bestuur te bepalen gevallen kan de in het zesde lid bedoelde vermelding van gegevens
      ook plaatsvinden voor de partner die niet is de in dat lid bedoelde partner. De voordracht voor een krachtens de
      eerste volzin vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het
      ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel15
  - number: '15.8'
    text: |-
      De belanghebbende of de partner die niet in Nederland belastbaar inkomen geniet, is gehouden aan de inspecteur een
      opgaaf te verstrekken van dat inkomen. Ter zake van die opgaaf is de [Algemene wet inzake rijksbelastingen][ref1],
      met uitzondering van [Hoofdstuk VIIIA][ref2], van toepassing, als ware het een aangifte inkomstenbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVIIIA
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: VIIIA
  - number: '15.9'
    text: |-
      Indien in een inkomensafhankelijke regeling is bepaald dat naast de draagkracht van de belanghebbende en diens
      partner ook de draagkracht van medebewoners van belang is voor de beoordeling van de aanspraak op of voor de
      bepaling van de hoogte van een tegemoetkoming, is het achtste lid van overeenkomstige toepassing ten aanzien van de
      medebewoner die niet in Nederland belastbaar inkomen geniet.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel15
  - number: '15.10'
    text: |-
      Indien de belanghebbende, zijn partner of een medebewoner in het berekeningsjaar als binnenlands
      belastingplichtige voor de inkomstenbelasting inkomen geniet ter zake waarvan recht bestaat op een
      vermindering van de verschuldigde inkomstenbelasting op grond van regelingen ter voorkoming van dubbele
      belasting, wordt ten aanzien van degene die dat inkomen geniet de aanvraag voor zoveel nodig tevens aangemerkt
      als een verzoek om te worden uitgenodigd tot het doen van aangifte inkomstenbelasting als bedoeld in
      [artikel 6, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel6
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '6'
  - number: '16.1'
    text: |-
      Indien de tegemoetkoming naar verwachting niet binnen acht weken na ontvangst van de aanvraag zal worden toegekend,
      verleent de Belastingdienst/Toeslagen de belanghebbende een voorschot tot het bedrag waarop de tegemoetkoming
      vermoedelijk zal worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel16
  - number: '16.2'
    text: |-
      Ingeval de belanghebbende voor het gehele berekeningsjaar aanspraak heeft op een tegemoetkoming wordt het voorschot
      verleend:
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel16
  - number: 16.2.a
    text: |-
      indien de aanvraag ten minste acht weken vóór het berekeningsjaar is ingediend of indien de tegemoetkoming wordt
      toegekend met toepassing van [artikel 15, vierde lid][ref1]: vóór de aanvang van het berekeningsjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel15
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 16.2.b
    text: 'in andere gevallen: binnen acht weken na de ontvangst van de aanvraag.'
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel16
  - number: '16.3'
    text: |-
      Indien de Belastingdienst/Toeslagen voor de beoordeling van de aanspraak op of de bepaling van de hoogte van de
      tegemoetkoming informatie nodig heeft van buiten Nederland kunnen de in het tweede lid genoemde termijnen worden
      verlengd met ten hoogste zes maanden. De Belastingdienst/Toeslagen stelt de belanghebbende schriftelijk van deze
      verlenging in kennis.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel16
  - number: '16.4'
    text: De Belastingdienst/Toeslagen kan het voorschot herzien.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel16
  - number: '16.5'
    text: Een herziening van het voorschot kan leiden tot een terug te vorderen bedrag.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel16
  - number: '17.1'
    text: |-
      Indien een voorschot op de tegemoetkoming is verleend en er een relevante wijziging optreedt in de omstandigheden
      die van belang zijn voor de beoordeling van de aanspraak op of de bepaling van de hoogte van de tegemoetkoming, is
      de belanghebbende gehouden die wijziging te melden aan de Belastingdienst/Toeslagen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel17
  - number: '17.2'
    text: |-
      Bij regeling van Onze Minister wordt bepaald welke wijzigingen in omstandigheden aanleiding geven voor een melding
      en op welke wijze en binnen welke termijn de melding wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel17
  - number: '17.3'
    text: Indien de belanghebbende een partner heeft wordt de melding mede ondertekend door de partner.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel17
  - number: '17.4'
    text: Indien de melding betrekking heeft op een medebewoner, wordt de melding mede ondertekend door die medebewoner.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel17
  - number: '18.1'
    text: |-
      Een belanghebbende, een partner en een medebewoner verstrekken de Belastingdienst/Toeslagen desgevraagd alle
      gegevens en inlichtingen die voor de beoordeling van de aanspraak op of de bepaling van de hoogte van de
      tegemoetkoming van belang kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel18
  - number: '18.2'
    text: De gegevens en inlichtingen worden verstrekt binnen een door de Belastingdienst/Toeslagen te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel18
  - number: '18.3'
    text: |-
      Indien de gegevens of inlichtingen niet op tijd zijn verstrekt door de persoon aan wie dit is gevraagd, maant
      de Belastingdienst/Toeslagen hem aan onder het stellen van een nadere termijn om alsnog de gevraagde gegevens en
      inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel18
  - number: '18.4'
    text: |-
      Indien niet aan de in de vorige leden genoemde verplichtingen is voldaan, bepaalt de Belastingdienst/Toeslagen
      ambtshalve de hoogte van de tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel18
  - number: '19.1'
    text: |-
      Indien ten name van de belanghebbende, zijn partner of een medebewoner over het berekeningsjaar een aanslag
      inkomstenbelasting wordt vastgesteld, kent de Belastingdienst/Toeslagen de tegemoetkoming met betrekking tot dat
      berekeningsjaar toe binnen 13 weken nadat de laatste in dit kader van belang zijnde aangifte inkomstenbelasting is
      ingediend, of, indien dat eerder is, binnen acht weken na de vaststelling van de laatste in dit kader van belang
      zijnde aanslag. Voor de toepassing van de eerste volzin wordt een aangifte inkomstenbelasting die is ingediend vóór
      1 april van het jaar volgend op het berekeningsjaar geacht te zijn ingediend op 1 april van het jaar volgend op het
      berekeningsjaar. Indien ten name van de belanghebbende, zijn partner of een medebewoner over het berekeningsjaar
      een beschikking ter zake van niet in Nederland belastbaar inkomen wordt vastgesteld, kent de Belastingdienst/
      Toeslagen de tegemoetkoming met betrekking tot dat berekeningsjaar toe binnen acht weken na de vaststelling van de
      laatste in dit kader van belang zijnde beschikking. De derde volzin is uitsluitend van toepassing indien de in die
      volzin genoemde termijn verloopt op een datum die gelegen is na afloop van de in de eerste volzin bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel19
  - number: '19.2'
    text: |-
      Indien voor geen van de in het eerste lid bedoelde personen over het berekeningsjaar een aanslag inkomstenbelasting
      of een beschikking ter zake van niet in Nederland belastbaar inkomen wordt vastgesteld, kent de Belastingdienst/
      Toeslagen de tegemoetkoming met betrekking tot dat berekeningsjaar toe vóór 1 december van het jaar volgend op
      het berekeningsjaar.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel19
  - number: '19.3'
    text: |-
      Indien de tegemoetkoming niet binnen de in de vorige leden genoemde termijn kan worden toegekend, stelt de
      Belastingdienst/Toeslagen de belanghebbende hiervan schriftelijk in kennis onder het noemen van een redelijke
      termijn waarbinnen toekenning zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel19
  - number: '20.1'
    text: |-
      Indien na de toekenning van de tegemoetkoming uit een wijziging van een verzamelinkomen, belastbaar loon of niet in
      Nederland belastbaar inkomen blijkt dat de tegemoetkoming tot een te hoog of te laag bedrag is toegekend, herziet
      de Belastingdienst/Toeslagen de tegemoetkoming met inachtneming van die wijziging of vaststelling.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel20
  - number: '20.2'
    text: |-
      De herziening geschiedt binnen acht weken na het tijdstip waarop de beschikking of uitspraak strekkende tot de
      in het eerste lid bedoelde wijziging onherroepelijk is geworden, of, zolang geen aanslag inkomstenbelasting of
      beschikking verzamelinkomen is vastgesteld, de wijziging aan de Belastingdienst/Toeslagen bekend is geworden dan
      wel de herziene jaaropgaaf terzake van het belastbare loon bij de Belastingdienst/Toeslagen bekend is geworden.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel20
  - number: '20.3'
    text: |-
      Een herziening op grond van dit artikel kan leiden tot een uit te betalen bedrag doch ook tot een terug te vorderen
      bedrag.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel20
  - number: '21.1'
    text: 'De Belastingdienst/Toeslagen kan een toegekende tegemoetkoming herzien:'
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel21
  - number: 21.1.a
    text: |-
      op grond van feiten of omstandigheden waarvan de Belastingdienst/Toeslagen bij de toekenning redelijkerwijs niet op
      de hoogte kon zijn en op grond waarvan de tegemoetkoming vermoedelijk tot een te hoog bedrag is toegekend, of
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel21
  - number: 21.1.b
    text: |-
      indien de tegemoetkoming tot een te hoog bedrag is toegekend en de belanghebbende of zijn partner dit wist of
      behoorde te weten.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel21
  - number: '21.2'
    text: |-
      Een tegemoetkoming kan met toepassing van dit artikel niet meer worden herzien indien vijf jaren zijn verstreken na
      de laatste dag van het berekeningsjaar waarop de tegemoetkoming betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel21
  - number: '21.3'
    text: Een herziening op grond van dit artikel kan leiden tot een terug te vorderen bedrag.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel21
  - number: '22.1'
    text: |-
      Een voorschot dat wordt verleend vóór de aanvang van het berekeningsjaar waarop het voorschot betrekking
      heeft, wordt uitbetaald in 12 termijnen. De uitbetaling van de eerste termijn vindt plaats in de maand december
      voorafgaand aan het berekeningsjaar en elke volgende termijn telkens een maand later.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel22
  - number: '22.2'
    text: |-
      Een voorschot dat wordt verleend in de loop van het berekeningsjaar waarop het voorschot betrekking heeft, en
      waarvan de beschikking een dagtekening heeft die ligt vóór 1 november van dat jaar, wordt uitbetaald in zoveel
      termijnen als er na de maand van dagtekening nog kalendermaanden van dat jaar overblijven. De uitbetaling van de
      eerste termijn vindt plaats in de maand van dagtekening en elke volgende termijn telkens een maand later.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel22
  - number: '22.3'
    text: |-
      Indien de belanghebbende voor een deel van het berekeningsjaar aanspraak heeft op een tegemoetkoming wordt,
      in zoverre in afwijking van de voorgaande leden, het voorschot in zoveel termijnen uitbetaald als het aantal
      kalendermaanden waarin de aanspraak bestaat. De uitbetaling van de eerste termijn vindt niet eerder plaats dan in
      de maand voorafgaand aan de maand waarin de aanspraak ontstaat.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel22
  - number: '22.4'
    text: |-
      Indien een beschikking waarbij over het berekeningsjaar voor het eerst een voorschot wordt verleend een dagtekening
      heeft die ligt na de maand waarin de aanspraak is ontstaan, wordt het voorschot voorzover dat betrekking heeft op
      de in het berekeningsjaar reeds verstreken kalendermaanden waarin de aanspraak bestond met inbegrip van de maand
      van dagtekening van de beschikking, in één bedrag uitbetaald in de maand van dagtekening en wordt het daarna nog
      resterende deel van het voorschot uitbetaald overeenkomstig het tweede lid.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel22
  - number: '22.5'
    text: |-
      Een voorschot dat wordt verleend in de loop van of na afloop van het berekeningsjaar waarop het voorschot
      betrekking heeft en waarvan de beschikking een dagtekening heeft die ligt na 31 oktober van dat jaar, wordt in één
      bedrag uitbetaald in de maand van dagtekening.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel22
  - number: '23'
    text: |-
      De Belastingdienst/Toeslagen kan de uitbetaling van een voorschot geheel of gedeeltelijk opschorten indien
      redelijkerwijs kan worden vermoed dat het voorschot ten onrechte of tot een te hoog bedrag is verleend. De
      belanghebbende wordt van de opschorting schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel23
  - number: '24.1'
    text: Een tegemoetkoming wordt uitbetaald binnen vier weken na dagtekening van de beschikking.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel24
  - number: '24.2'
    text: Indien voorschotten zijn verleend, worden deze verrekend met de tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel24
  - number: '24.3'
    text: De in het tweede lid bedoelde verrekening kan leiden tot een terug te vorderen bedrag.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel24
  - number: '25.1'
    text: |-
      Uitbetaling van een voorschot of een tegemoetkoming geschiedt door de Belastingdienst/Toeslagen door middel van een
      bijschrijving op een ten name van de belanghebbende of diens partner bestaande bankrekening, bestemd voor girale
      betaling, tenzij daartoe door de belanghebbende een andere rekening is aangewezen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel25
  - number: '25.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de aanwijzing van een andere rekening als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel25
  - number: '26'
    text: |-
      Indien een herziening van een tegemoetkoming of een herziening van een voorschot leidt tot een terug te vorderen
      bedrag dan wel een verrekening van een voorschot met een tegemoetkoming daartoe leidt, is de belanghebbende het
      bedrag van de terugvordering in zijn geheel verschuldigd.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel26
  - number: '27.1'
    text: |-
      Over uit te betalen bedragen wordt rente vergoed en over terug te vorderen bedragen wordt rente in rekening
      gebracht.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel27
  - number: '27.2'
    text: |-
      De rente wordt enkelvoudig berekend over het tijdvak dat aanvangt op 1 juli van het jaar volgend op het
      berekeningsjaar en eindigt op de dag van de dagtekening van de beschikking tot toekenning onderscheidenlijk de
      beschikking tot herziening van de tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel27
  - number: '27.3'
    text: |-
      Het percentage van de rente is gelijk aan het percentage, bedoeld in
      [artikel 30f, zesde lid, van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30f
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 30f
  - number: '28.1'
    text: |-
      De belanghebbende heeft de verplichting om het bedrag van een terugvordering alsmede de op de voet van
      [artikel 27][ref1] verschuldigde rente binnen twee maanden na de dagtekening van de beschikking tot terugvordering
      te betalen aan de Belastingdienst/Toeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel27
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '28.2'
    text: |-
      Het bedrag van een bestuurlijke boete moet worden betaald binnen twee maanden na de dagtekening van de
      boetebeschikking.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel28
  - number: '28.3'
    text: De Algemene termijnenwet is niet van toepassing op de in dit artikel gestelde termijnen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel28
  - number: '29'
    text: |-
      Bij overschrijding van de in [artikel 28][ref1] bedoelde betalingstermijn is rente verschuldigd met overeenkomstige
      toepassing van de [artikelen 28][ref2] en [29 van de Invorderingswet 1990][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel29
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '29'
  - number: '30.1'
    text: |-
      De Belastingdienst/Toeslagen kan een door de belanghebbende verschuldigd bedrag aan terugvordering verrekenen
      met een aan hem uit te betalen tegemoetkoming of voorschot daarop, een en ander ongeacht de inkomensafhankelijke
      regeling die het betreft en ongeacht het berekeningsjaar.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel30
  - number: '30.2'
    text: |-
      De Belastingdienst/Toeslagen is tevens bevoegd, in afwijking van [artikel 3 van de Invorderingswet 1990][ref1],
      een door de belanghebbende verschuldigd bedrag aan terugvordering te verrekenen met aan hem uit te betalen bedragen
      inkomstenbelasting, premie volksverzekeringen, en heffingsrente begrepen in een aanslag of voorlopige aanslag
      inkomstenbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel3
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '3'
  - number: '30.3'
    text: |-
      Een verrekening vindt niet eerder plaats dan nadat de termijn bedoeld in [artikel 28][ref1] is verstreken. De in
      de [artikelen 27][ref2] en [29][ref3] bedoelde rente alsmede bestuurlijke boeten kunnen in de verrekening worden
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel29
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0018472
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '31.1'
    text: |-
      De Belastingdienst/Toeslagen kan onder voorwaarden aan de belanghebbende voor een bepaalde tijd bij beschikking
      uitstel van betaling verlenen. Gedurende het uitstel vangt de in [artikel 32][ref1] bedoelde dwanginvordering niet
      aan, of wordt deze geschorst. Het uitstel kan tussentijds bij beschikking worden beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel32
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '32'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '31.2'
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot het verlenen van uitstel van betaling.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel31
  - number: '32.1'
    text: |-
      Indien de belanghebbende het bedrag van de terugvordering, daaronder begrepen de in [artikel 27][ref1] bedoelde
      rente alsmede bestuurlijke boeten, niet binnen de gestelde termijn betaalt, maant de Belastingdienst/Toeslagen hem
      schriftelijk aan om alsnog binnen tien dagen na de dagtekening van de aanmaning te betalen, onder kennisgeving dat
      hij anders door middelen bij de wet bepaald tot betaling zal worden gedwongen. De aanmaning kan betrekking hebben
      op meerdere terugvorderingsbeschikkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel27
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '32.2'
    text: |-
      Indien de belanghebbende na de aanmaning in gebreke blijft, kan de invordering van het verschuldigde bedrag
      geschieden bij een door de Belastingdienst/Toeslagen uit te vaardigen dwangbevel. Bij het dwangbevel kunnen tevens
      de kosten van de aanmaning, de kosten van het dwangbevel en de verschuldigde renten of boete worden ingevorderd.
      Het dwangbevel kan betrekking hebben op meer terugvorderingsbeschikkingen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel32
  - number: '32.3'
    text: |-
      De betekening van het dwangbevel geschiedt met overeenkomstige toepassing van
      [artikel 13 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel13
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '13'
  - number: '32.4'
    text: |-
      Het dwangbevel levert een executoriale titel op, die met overeenkomstige toepassing van
      [artikel 14 van de Invorderingswet 1990][ref1] kan worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel14
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '14'
  - number: '32.5'
    text: |-
      De belanghebbende kan met overeenkomstige toepassing van [artikel 17 van de Invorderingswet 1990][ref1], tegen de
      tenuitvoerlegging van het dwangbevel in verzet komen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel17
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '17'
  - number: '32.6'
    text: |-
      Een derde die aan de belanghebbende loon, pensioen, lijfrente of uitkeringen, een en ander als bedoeld in
      [artikel 19 van de Invorderingswet 1990][ref1], verschuldigd is, kan met overeenkomstige toepassing van dat artikel
      op vordering van de Belastingdienst/Toeslagen worden verplicht het door de belanghebbende verschuldigde bedrag aan
      terugvordering te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
  - number: '32.7'
    text: |-
      Het recht tot dwanginvordering alsmede het recht tot verrekening verjaren met overeenkomstige toepassing van
      [artikel 27 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel27
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '27'
  - number: '33.1'
    text: |-
      De partner van de belanghebbende is hoofdelijk aansprakelijk voor een door de belanghebbende verschuldigd bedrag
      aan terugvordering, daaronder begrepen de in de [artikelen 27][ref1] en [29][ref2] bedoelde rente alsmede de kosten
      van dwanginvordering. De partner is niet aansprakelijk voor een aan de belanghebbende opgelegde boete, tenzij het
      belopen daarvan mede aan hem is te wijten.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel29
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '33.2'
    text: |-
      Aansprakelijkstelling geschiedt bij beschikking van de Belastingdienst/Toeslagen. Het bedrag waarvoor
      de aansprakelijkheid bestaat, is invorderbaar twee maanden na de dagtekening van de beschikking. De
      [artikelen 28, derde lid][ref1], [30][ref2], [31][ref3] en [32][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0018472#Artikel32
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '30'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0018472
        artikel: '31'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0018472
        artikel: '32'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '34.1'
    text: |-
      De Belastingdienst/Toeslagen beschikt ten behoeve van de invordering naast de bevoegdheden ingevolge deze wet, ook
      over de bevoegdheden die een schuldeiser heeft op grond van enige andere wettelijke bepaling.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel34
  - number: '34.2'
    text: |-
      Tot het verrichten van de bij of krachtens een wet aan een deurwaarder opgedragen werkzaamheden is,
      voor zover die werkzaamheden geschieden in opdracht van de Belastingdienst/Toeslagen en betrekking
      hebben op een terugvordering ingevolge deze wet, uitsluitend een belastingdeurwaarder als bedoeld in
      [artikel 2, eerste lid, onderdeel j, van de Invorderingswet 1990][ref1], bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
  - number: '34.3'
    text: De Kostenwet invordering rijksbelastingen is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel34
  - number: '34.4'
    text: 'De toerekening van de betalingen geschiedt achtereenvolgens aan:'
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel34
  - number: 34.4.a
    text: de kosten van invordering;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel34
  - number: 34.4.b
    text: de rente bij te late betaling;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel34
  - number: 34.4.c
    text: |-
      de terugvordering, de in rekening gebrachte rente bedoeld in [artikel 27][ref1] en de bestuurlijke boete, naar
      evenredigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel27
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '35'
    text: |-
      In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref1] vangt de termijn voor het instellen van
      bezwaar aan op de dag na die van dagtekening van de beschikking, tenzij de dag van dagtekening gelegen is vóór de
      dag van de bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '36'
    text: |-
      In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref1] vangt de termijn voor het instellen van
      beroep tegen een uitspraak op bezwaar aan op de dag na die van dagtekening van de uitspraak, tenzij de dag van
      dagtekening is gelegen vóór de dag van de bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '37.1'
    text: |-
      Een bezwaar tegen de toekenning of herziening van een tegemoetkoming wordt, tenzij uit het bezwaarschrift het
      tegendeel blijkt, geacht mede te zijn gericht tegen de toekenning of herziening van andere tegemoetkomingen over
      hetzelfde berekeningsjaar die bij hetzelfde geschrift zijn toegekend of herzien, alsmede tegen de in verband
      daarmee berekende rente.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel37
  - number: '37.2'
    text: |-
      Indien een tegemoetkoming is herzien en naar aanleiding daarvan een bestuurlijke boete is opgelegd die is vervat
      in hetzelfde geschrift als de herziening, wordt een bezwaarschrift tegen de herziening geacht mede te zijn gericht
      tegen de boete.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel37
  - number: '37.3'
    text: |-
      De Belastingdienst/Toeslagen kan uitspraken op bezwaar in de in het eerste en tweede lid bedoelde gevallen
      vervatten in één geschrift.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel37
  - number: '38.1'
    text: |-
      Openbare lichamen en rechtspersonen die bij of krachtens een bijzondere wet rechtspersoonlijkheid hebben verkregen,
      de onder hen ressorterende instellingen en diensten, alsmede lichamen die hoofdzakelijk uitvoering geven aan
      het beleid van het Rijk, en ieder ander die bij algemene maatregel van bestuur is aangewezen verstrekken op
      bij algemene maatregel van bestuur te bepalen wijze aan de Belastingdienst/Toeslagen kosteloos de gegevens en
      inlichtingen waarvan de kennisneming van belang kan zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel38
  - number: '38.2'
    text: De gegevens en inlichtingen worden verstrekt binnen een door de Belastingdienst/Toeslagen te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel38
  - number: '38.3'
    text: |-
      Indien de gevraagde gegevens of inlichtingen niet op tijd zijn verstrekt, maant de Belastingdienst/Toeslagen aan
      onder het stellen van een nadere termijn om alsnog de gevraagde gegevens en inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel38
  - number: '38.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de vermelding van het sociaal-
      fiscaalnummer van degene op wie de gegevens en inlichtingen betrekking hebben bij het verstrekken van de gegevens
      en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel38
  - number: '38.5'
    text: |-
      In de gevallen waarin het sociaal-fiscaalnummer dient te worden vermeld, is degene op wie de in het eerste lid
      bedoelde gegevens en inlichtingen betrekking hebben gehouden zijn sociaal-fiscaalnummer te verstrekken aan de
      in het eerste lid bedoelde openbare lichamen en rechtspersonen alsmede degenen die ingevolge het eerste lid bij
      algemene maatregel van bestuur zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel38
  - number: 38a
    text: |-
      De Belastingdienst/Toeslagen kan onder bij of krachtens algemene maatregel van bestuur te bepalen voorwaarden ten
      behoeve van bij algemene maatregel van bestuur aan te wijzen voorzieningen die de dienstverlening voortvloeiende
      uit de uitvoering van deze wet verbeteren, gegevens verstrekken die voor deze dienstverlening nodig zijn.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel38a
  - number: '39.1'
    text: |-
      De Belastingdienst/Toeslagen en de inspecteur en de ontvanger wisselen de gegevens en inlichtingen uit die nodig
      zijn voor de uitvoering van deze wet en voor de heffing en invordering van rijksbelastingen, onder vermelding van
      het sociaal-fiscaalnummer van degene op wie de gegevens of inlichtingen betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel39
  - number: '39.2'
    text: |-
      Onze Minister verstrekt aan Onze Ministers wie het aangaat de inlichtingen die zij nodig hebben voor de
      beleidsvorming en beleidsevaluatie alsmede voor het volgen van de ontwikkeling van de uitgaven, met betrekking tot
      inkomensafhankelijke regelingen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel39
  - number: '39.3'
    text: |-
      Onze Ministers wie het aangaat verstrekken aan Onze Minister de inlichtingen die hij nodig heeft voor de uitvoering
      van inkomensafhankelijke regelingen door de Belastingdienst/Toeslagen.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel39
  - number: '40.1'
    text: |-
      Indien de belanghebbende, zijn partner of een medebewoner gehouden is tot het verstrekken van gegevens of
      inlichtingen, waaronder begrepen de in [artikel 15, achtste en negende lid][ref1], bedoelde opgaaf van het niet in
      Nederland belastbaar inkomen, en deze persoon daaraan niet, dan wel niet binnen de daartoe gestelde termijn heeft
      voldaan, kan de Belastingdienst/Toeslagen hem een bestuurlijke boete van ten hoogste € 1500 opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel15
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '40.2'
    text: |-
      Indien het aan opzet of grove schuld van de belanghebbende, zijn partner of een medebewoner is te wijten dat
      geen, dan wel onjuiste of onvolledige gegevens of inlichtingen zijn verstrekt tengevolge waarvan een of meer
      tegemoetkomingen tot een te hoog bedrag is of zijn toegekend, kan de Belastingdienst/Toeslagen de belanghebbende,
      zijn partner of de medebewoner een bestuurlijke boete opleggen van 25 procent van het bedrag dat van de
      belanghebbende in verband daarmee wordt teruggevorderd bij een herziening. De boete bedraagt niet meer dan € 5000.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel40
  - number: '40.3'
    text: |-
      Bij het opleggen van een bestuurlijke boete zijn de artikelen [67g][ref1], [67i][ref2], [67j][ref3], [67l][ref4],
      [67m][ref5] en [67o van de Algemene wet inzake rijksbelastingen][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67g
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67i
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67j
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67l
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel67m
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel67o
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67g
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67i
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67j
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 67l
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 67m
      - id: ref6
        bwb_id: BWBR0002320
        artikel: 67o
  - number: '40.4'
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete als bedoeld in het eerst lid vervalt vijf jaren na de
      dag waarop de in [artikel 18, derde lid][ref1], gestelde termijn is verstreken. De bevoegdheid tot het opleggen van
      een bestuurlijke boete als bedoeld in het tweede lid vervalt vijf jaren na het einde van het berekeningsjaar waarop
      de te hoog toegekende tegemoetkoming betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel18
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '40.5'
    text: |-
      Indien de tegemoetkoming wordt herzien als gevolg van een herziening van de beschikking verzamelinkomen als
      bedoeld in [artikel 9.5 van de Wet inkomstenbelasting 2001][ref1] of van een herziening van een beschikking niet
      in Nederland belastbaar inkomen, worden onder de in het tweede lid bedoelde gegevens of inlichtingen mede verstaan
      de gegevens of inlichtingen die ten behoeve van deze beschikking aan de inspecteur zijn verstrekt dan wel hadden
      moeten worden verstrekt. [Artikel 67d van de Algemene wet inzake rijksbelastingen][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67d
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67d
  - number: '41.1'
    text: |-
      Indien degene die op grond van [artikel 38, eerste lid][ref1], bij algemene maatregel van bestuur is aangewezen, op
      grond van [artikel 38][ref2] gehouden is tot het verstrekken van gegevens en inlichtingen, en hij of zij deze niet
      dan wel niet binnen de ingevolge [artikel 38, derde lid][ref3], gestelde termijn verstrekt, kan de Belastingdienst/
      Toeslagen hem of haar een bestuurlijke boete van ten hoogste € 1500 opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel38
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '38'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '38'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0018472
        artikel: '38'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '41.2'
    text: |-
      Indien het aan opzet of grove schuld van degene die op grond van [artikel 38, eerste lid][ref1], bij algemene
      maatregel van bestuur is aangewezen en op grond van [artikel 38][ref2] gehouden is tot het verstrekken van gegevens
      en inlichtingen, is te wijten dat geen, dan wel onjuiste of onvolledige gegevens of inlichtingen zijn verstrekt kan
      de Belastingdienst/Toeslagen hem of haar een bestuurlijke boete opleggen van ten hoogste € 5000.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel38
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '38'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '38'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '41.3'
    text: |-
      Bij het opleggen van een bestuurlijke boete zijn de [artikelen 67g, eerste tot en met derde lid][ref1], [67i][ref2],
      [67j][ref3], [67l][ref4], [67m][ref5], [67o][ref6] en [67p van de Algemene wet inzake rijksbelastinge][ref7]n van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67g
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67i
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67j
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67l
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel67m
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel67o
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel67p
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67g
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67i
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67j
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 67l
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 67m
      - id: ref6
        bwb_id: BWBR0002320
        artikel: 67o
      - id: ref7
        bwb_id: BWBR0002320
        artikel: 67p
  - number: '41.4'
    text: |-
      De bevoegdheid tot het opleggen van een bestuurlijke boete vervalt vijf jaren na de dag waarop de in
      [artikel 38, derde lid][ref1], gestelde termijn is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel38
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '38'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '42'
    text: |-
      Indien de belanghebbende, zijn partner of een medebewoner de Belastingdienst/Toeslagen alsnog de juiste
      en volledige gegevens en inlichtingen verstrekt voordat hij weet of redelijkerwijs moet vermoeden dat de
      Belastingdienst/Toeslagen met de onjuistheid of onvolledigheid bekend is of bekend zal worden, wordt aan hem niet
      de boete, bedoeld in [artikel 40][ref1], opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel40
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '40'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '43.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Ministers wie het aangaat, aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel43
  - number: '43.2'
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:15][ref1], [5:18][ref2] en
      [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '43.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel43
  - number: '44.1'
    text: |-
      Met de opsporing van de feiten omschreven in de [artikelen 225 tot en met 227b][ref1], [447c][ref2] en
      [447d van het Wetboek van Strafrecht][ref3], voor zover het feit voor de toepassing van deze wet van belang
      is, zijn, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref4], belast de ambtenaren, aangewezen
      bij besluit van Onze Ministers wie het aangaat. Deze ambtenaren zijn tevens belast met de opsporing van feiten,
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref5], en [184 van het Wetboek van Strafrecht][ref6], voor
      zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel447c
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel447d
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel141
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel184
