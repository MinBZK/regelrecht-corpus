  - number: '44.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel44
  - number: '45.1'
    text: |-
      Een tegemoetkoming is niet vatbaar voor vervreemding, verpanding, belening of beslag, waaronder begrepen beslag
      ingevolge faillissement of toepassing van de schuldsaneringsregeling natuurlijke personen, tenzij het betreft
      beslag wegens:
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel45
  - number: 45.1.a
    text: |-
      een vordering tot nakoming van een betalingsverplichting wegens een geleverde prestatie waarbij de
      betalingsverplichting ter zake van die prestatie oorzaak is voor de tegemoetkoming;
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel45
  - number: 45.1.b
    text: |-
      een door de belanghebbende verschuldigd bedrag aan terugvordering dat betrekking heeft op dezelfde
      inkomensafhankelijke regeling.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel45
  - number: '45.2'
    text: Elk beding dat strijdt met het eerste lid is nietig.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel45
  - number: '46'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van samenloop van
      tegemoetkomingen met naar aard en strekking daarmee overeenkomende tegemoetkomingen op grond van wetgeving van een
      andere mogendheid.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel46
  - number: '47'
    text: |-
      Bij regeling van Onze Minister in overeenstemming met Onze Ministers wie het aangaat kan een van
      deze wet afwijkende maatregel worden getroffen voor groepen van gevallen waarin toepassing van
      [artikel 7, derde of vierde lid][ref1], leidt tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel7
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '48'
    text: |-
      Onze Minister zendt, in overeenstemming met Onze Ministers wie het mede aangaat, binnen drie jaar na de
      inwerkingtreding van deze wet, en vervolgens vijfjaarlijks, aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel48
  - number: '49'
    text: |-
      Voor de berekeningsjaren 2006, 2007 en 2008 wordt voor de beoordeling van de aanspraak op of de bepaling
      van de hoogte van een tegemoetkoming op grond van een inkomensafhankelijke regeling als bedoeld in
      [artikel 11, eerste lid][ref1], een wijziging in de omstandigheden en van de leeftijd van de belanghebbende, de
      partner of een medebewoner die zich voordoet na de eerste dag van de maand, in aanmerking genomen vanaf de eerste
      dag van de daaropvolgende maand, en blijft [artikel 5][ref2] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel5
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '50'
    text: |-
      Deze wet treedt in werking op 1 september 2005 en geldt voor berekeningsjaren die aanvangen op of na 1 januari
      2006.
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel50
  - number: '51'
    text: 'Deze wet wordt aangehaald als: Algemene wet inkomensafhankelijke regelingen.'
    url: https://wetten.overheid.nl/BWBR0018472/2007-01-01#Artikel51
