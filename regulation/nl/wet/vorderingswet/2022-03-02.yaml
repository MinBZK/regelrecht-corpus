$id: vorderingswet
regulatory_layer: WET
publication_date: '2016-07-21'
valid_from: '2022-03-02'
bwb_id: BWBR0002393
url: https://wetten.overheid.nl/BWBR0002393/2022-03-02
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een nieuwe regeling vast te stellen betreffende het
    vorderen van zaken door de landsoverheid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij en krachtens deze wet bepaalde worden onder zaken verstaan de voor menselijke
      beheersing vatbare stoffelijke objecten.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel1
  - number: '1.2'
    text: |-
      Met betrekking tot vermogensrechten kan in dezelfde gevallen een vordering plaats vinden als met betrekking tot
      zaken. Voor zover geen andere regels zijn gegeven, is het bij en krachtens deze wet met betrekking tot zaken
      bepaalde van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel1
  - number: '1.3'
    text: |-
      Op grond van het bij en krachtens deze wet bepaalde is geen vordering toegelaten van enig recht dat betrekking
      heeft op
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel1
  - number: 1.3.a
    text: |-
      alle vaartuigen, hoe ook genaamd en van welke aard ook, welke geheel of in hoofdzaak tot de vaart ter zee zijn
      bestemd;
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel1
  - number: 1.3.b
    text: |-
      effecten, betaalmiddelen, geldswaardige papieren, goud, vorderingen en documenten waarin
      zodanige vorderingen zijn belichaamd, ten aanzien waarvan het bepaalde bij of krachtens de
      [Wet financiële betrekkingen buitenland 1994][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006547
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006547
  - number: '2'
    text: De toepasselijkheid van deze wet wordt beperkt door de in het volkenrecht erkende uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel2
  - number: '3.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1]
      kan, ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze
      Minister-President, [artikel 3 ][ref2] in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002393#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002393
        artikel: 3a
  - number: '3.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel3
  - number: '3.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel3
  - number: '3.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel3
  - number: '3.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel3
  - number: '3.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel3
  - number: 3a
    text: |-
      Al Onze Ministers zijn bevoegd, indien dit noodzakelijk is met het oog op de behartiging van belangen van tot hun
      zorg behorende aangelegenheden, ten behoeve van de Staat, andere lichamen of personen het eigendomsrecht op of een
      recht tot gebruik van zaken te vorderen.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel3a
  - number: '4'
    text: |-
      De bekendmaking van een beschikking waarbij een Onzer Ministers machtiging verleent namens hem
      vorderingsbeschikkingen te ondertekenen, geschiedt door toezending of uitreiking aan de gemachtigde dan wel door
      plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel4
  - number: '5.1'
    text: |-
      Onze Ministers gaan niet tot vordering over dan in overeenstemming met Onze Minister van Economische Zaken en
      Klimaat.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel5
  - number: '5.2'
    text: |-
      Alvorens een beslissing omtrent vorderingen te nemen pleegt Onze Minister van Economische Zaken en Klimaat overleg
      met Onze Ministers, tot wier zorg belangen, die door de vorderingen kunnen worden geraakt, behoren, tenzij de
      vereiste spoed dit niet toelaat.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel5
  - number: '6'
    text: |-
      In vorderingsbeschikkingen kan aan daarbij aangewezen personen de verplichting worden opgelegd, om, voor zover
      hun dat feitelijk en rechtens mogelijk is, op de daarbij aangegeven plaats en tijd aan degene, te wiens behoeve de
      vordering geschiedt, de feitelijke mogelijkheid tot uitoefening van het gevorderde recht te verschaffen.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel6
  - number: '7'
    text: In beschikkingen tot vordering van een recht tot gebruik van een zaak wordt de inhoud van dat recht omschreven.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel7
  - number: '8.1'
    text: |-
      Ingeval de vorderingsbeschikking door een gemachtigde is ondertekend, vermeldt zij de naam en de functie van de
      ondertekenaar alsmede de beschikking, waarbij de machtiging is verleend.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel8
  - number: '8.2'
    text: |-
      Het niet inachtnemen van het eerste lid brengt nietigheid van de beschikking mede indien op deze nietigheid binnen
      één maand nadat de vordering is gedaan, een beroep wordt gedaan. Zodanig beroep kan niet worden gedaan door de
      Staat, noch door degene, te wiens behoeve de vordering is geschied.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel8
  - number: '9.1'
    text: 'De bekendmaking van een vorderingsbeschikking geschiedt door toezending of uitreiking:'
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel9
  - number: 9.1.a
    text: |-
      aan de eigenaar, de beperkt gerechtigde, de pachter, de huurder, de huurkoper en degene die beslag heeft gelegd,
      voor zover zij bekend zijn;
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel9
  - number: 9.1.b
    text: |-
      bij toepassing van [artikel 6][ref1] aan ieder der krachtens dat artikel aangewezen personen;


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel6
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '6'
  - number: 9.1.c
    text: aan degene, in wiens feitelijke macht de zaak wordt aangetroffen.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel9
  - number: '9.2'
    text: |-
      Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking wordt van de vorderingsbeschikking door middel van
      toezending of uitreiking van een exemplaar daarvan mededeling gedaan:
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel9
  - number: 9.2.a
    text: indien de vordering ten behoeve van een ander dan de Staat geschiedt, aan deze ander;
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel9
  - number: 9.2.b
    text: aan de burgemeester der gemeente, waar de zaak wordt aangetroffen.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel9
  - number: '9.3'
    text: |-
      Ingeval van vordering van het eigendomsrecht op of een recht tot gebruik van tot een zelfde groep behorende zaken,
      die bij verscheidene personen aanwezig zijn, kunnen de bekendmaking en de mededeling overeenkomstig het eerste
      en tweede lid worden vervangen door een algemene bekendmaking de beschikking. De beschikking wordt dan tevens zo
      spoedig mogelijk in de *Staatscourant* geplaatst.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel9
  - number: '9.4'
    text: |-
      Van vorderingsbeschikkingen, die niet door Onze Minister van Economische Zaken en Klimaat zijn vastgesteld, wordt
      aan deze afschrift gezonden.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister die een vordering heeft gedaan, is bevoegd tot oplegging van een last onder bestuursdwang ter
      handhaving van de vordering.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel10
  - number: '10.2'
    text: |-
      Een machtiging als bedoeld in [artikel 2 van de Algemene wet op het binnentreden][ref1] kan worden gegeven door
      Onze Minister die de vordering heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
  - number: '11.1'
    text: |-
      Ingeval het eigendomsrecht op een zaak is gevorderd, gaat dit op degene, te wiens behoeve de vordering is geschied,
      over op het tijdstip, waarop hij de feitelijke mogelijkheid tot uitoefening van dat recht verkrijgt, of, zo hij
      deze reeds heeft, op het voor dat geval in de vorderingsbeschikking te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel11
  - number: '11.2'
    text: |-
      De in [artikel 60 der Onteigeningswet][ref1] (*Stb.* 1851, 125) bedoelde lasten en belastingen, waarmede de zaak
      is bezwaard, gaan bij de eigendomsovergang over op degene, te wiens behoeve de vordering is geschied. Overigens
      gaat de eigendom over, vrij van alle met betrekking tot de zaak bestaande lasten en rechten, tenzij in de
      vorderingsbeschikking anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel60
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '60'
  - number: '12'
    text: |-
      Ingeval een recht tot gebruik van een zaak is gevorderd, ontstaat dit recht voor degene, te wiens behoeve de
      vordering is geschied, op het tijdstip, waarop hij de feitelijke mogelijkheid tot uitoefening van dat recht
      verkrijgt, of, zo hij deze reeds heeft, op het voor dat geval in de vorderingsbeschikking te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel12
  - number: '13.1'
    text: |-
      Zodra als gevolg van een vordering het eigendomsrecht is overgegaan of een recht tot gebruik is ontstaan, wordt
      daarvan door Onze Minister, die de vordering heeft gedaan, zo spoedig mogelijk een bewijsstuk opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel13
  - number: '13.2'
    text: |-
      Het bewijsstuk verwijst naar de vorderingsbeschikking en bevat zo nodig de gegevens vereist met betrekking tot
      de inschrijving van stukken in de betrokken openbare registers, voor zover deze niet in de beschikking staan.
      Indien de feitelijke mogelijkheid tot uitoefening van het gevorderde recht is verschaft met toepassing van
      [artikel 10][ref1], wordt hiervan in het bewijsstuk melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel10
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '10'
  - number: '13.3'
    text: |-
      Een exemplaar van het bewijsstuk, mede ondertekend door degene, te wiens behoeve de vordering is geschied, wordt,
      zo mogelijk, verstrekt aan ieder dergenen, aan wie een exemplaar van de vorderingsbeschikking is verstrekt.
      Van bewijsstukken, die niet door Onze Minister van Economische Zaken en Klimaat zijn opgemaakt, wordt aan deze
      afschrift gezonden.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel13
  - number: '14.1'
    text: |-
      Ingeval een registergoed of een recht waarvan de overdracht slechts na inschrijving in openbare registers tegen
      derden werkt, is gevorderd, doet Onze Minister, die de vordering heeft gedaan, de vorderingsbeschikking en
      het krachtens [artikel 13][ref1] opgemaakte bewijsstuk zo spoedig mogelijk in de betrokken openbare registers
      inschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel13
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '13'
  - number: '14.2'
    text: Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel14
  - number: '15.1'
    text: |-
      Degene te wiens behoeve de vordering is geschied, is gehouden de eigenaar, de beperkt gerechtigde, de pachter,
      de huurder, de huurkoper en de beslaglegger voor zover zij schade lijden, schadeloos te stellen. Het recht op
      schadeloosstelling van de pand- of hypotheekhouder en van de beslaglegger wordt echter uitgeoefend overeenkomstig
      de hun in artikel 229 van Boek 3 van het Burgerlijk Wetboek en de [artikelen 455][ref1] en [507][ref2] toegekende
      rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel455a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel507a
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 455a
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 507a
  - number: '15.2'
    text: |-
      De schadeloosstelling wordt, ingeval het eigendomsrecht op een zaak is gevorderd, vastgesteld met overeenkomstige
      toepassing, voor zover uit deze wet niet anders voortvloeit, van de artikelen 40-45 van de [Onteigeningswet][ref1]
      en, ingeval het een roerende zaak betreft, tevens overeenkomstig bij algemene maatregel van bestuur daaromtrent
      te stellen aanvullende regelen. Zij wordt, ingeval een recht tot gebruik van een zaak is gevorderd, vastgesteld
      overeenkomstig bij zodanige maatregel daaromtrent te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001842
  - number: '15.3'
    text: De Staat is voor de betaling van de schadeloosstelling mede aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel15
  - number: '16.1'
    text: |-
      Het bedrag van de aan iedere rechthebbende te betalen schadeloosstelling wordt, zo mogelijk, door Onze Minister,
      die de vordering heeft gedaan, degene, te wiens behoeve de vordering is geschied, en de rechthebbende in onderling
      overleg vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel16
  - number: '16.2'
    text: |-
      Nadat overeenstemming is bereikt, wordt een bewijsstuk, waarin het overeengekomene wordt vastgelegd, opgemaakt en
      door degenen, die aan het overleg hebben deelgenomen, ondertekend. Van dit bewijsstuk ontvangt elk een exemplaar.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel16
  - number: '17.1'
    text: |-
      De vaststelling van het bedrag van de schadeloosstelling, te betalen aan rechthebbenden met wie daarover geen
      overeenstemming is bereikt of die niet aan het overleg hebben deelgenomen, geschiedt:
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel17
  - number: 17.1.a
    text: |-
      zo het betreft vordering van het eigendomsrecht op een onroerende zaak, of van een beperkt recht waaraan een
      zodanige zaak is onderworpen, telkens ongeacht of zij zijn gevorderd tezamen met andere zich daarop bevindende of
      daarbij behorende zaken, door de rechtbank, binnen wier rechtsgebied de betrokken onroerende zaak is gelegen;
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel17
  - number: 17.1.b
    text: |-
      in andere gevallen door de kantonrechter, binnen wiens rechtsgebied de betrokken onroerende zaak is gelegen, dan
      wel de betrokken roerende zaak is aangetroffen of, zo de vordering niet op enige zaak betrekking heeft, door de
      kantonrechter van de woonplaats van degene te wiens behoeve de vordering is geschied.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel17
  - number: '17.2'
    text: |-
      Indien de betrokken onroerende zaak in het rechtsgebied van meer dan één rechtbank of kantonrechter is gelegen,
      geschiedt de vaststelling van het bedrag van de schadeloosstelling door een dier rechtbanken of kantonrechters, ter
      keuze van de meest gerede partij.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel17
  - number: '18.1'
    text: |-
      Het bedrag van de in [artikel 17][ref1] bedoelde schadeloosstelling wordt door de rechter vastgesteld op verzoek
      van de rechthebbende, van degene, te wiens behoeve de vordering is geschied of van Onze Minister, die de vordering
      heeft gedaan. Het geding wordt door de verzoeker aanhangig gemaakt bij een in drievoud ingediend verzoekschrift,
      waarin de namen en adressen van de overige in dit lid bedoelde partijen zijn vermeld, alsmede het bedrag van de
      schadeloosstelling, waarvan vaststelling wordt verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel17
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '17'
  - number: '18.2'
    text: |-
      Indien het verzoekschrift aan de kantonrechter is gericht, bepaalt deze de dag en het uur waarop de zaak ter
      terechtzitting zal dienen; indien het aan de rechtbank is gericht, bepaalt de rechtbank de dag waarop de zaak ter
      rolle zal worden uitgeroepen. Bedoelde dag zal niet later mogen worden gesteld dan drie weken na die, waarop het
      verzoekschrift ter griffie is ontvangen.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel18
  - number: '18.3'
    text: |-
      De griffier geeft bij aangetekende brief van deze dagbepaling kennis aan de verzoeker en aan de overige partijen.
      Tussen de dag, waarop deze kennisgeving is verzonden en de in het tweede lid bedoelde dag moeten tenminste veertien
      dagen verlopen. Bij de kennisgeving aan de overige partijen wordt een afschrift van het verzoekschrift gevoegd.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel18
  - number: '18.4'
    text: De in het derde lid bedoelde kennisgeving heeft ten opzichte van partijen de kracht van een dagvaarding.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel18
  - number: '18.5'
    text: Tegen het vonnis is uitsluitend beroep in cassatie toegelaten.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel18
  - number: '18.6'
    text: |-
      De bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] zijn op het geding van toepassing voor zover
      daarvan bij deze wet niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '19.1'
    text: |-
      Degene, die als gevolg van een vordering het eigendomsrecht op een zaak of een beperkt recht, waaraan een zaak is
      onderworpen, heeft verkregen, mag die zaak of dat recht, zo de betrokken zaak onroerend is, binnen tien en anders
      binnen drie jaren daarna niet vervreemden alvorens die zaak of dat recht aan degene, die deze zaak of dat recht
      door de vordering heeft verloren, te koop te hebben aangeboden tegen een prijs, te bepalen in onderling overleg,
      dan wel bij gebreke van overeenstemming door de in [artikel 17][ref1] bedoelde rechter.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel17
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '17'
  - number: '19.2'
    text: Niet inachtneming van het eerste lid tast de geldigheid van de vervreemding niet aan.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel19
  - number: '19.3'
    text: |-
      Indien bij een vorderingsbeschikking is vermeld, dat de vordering mede beoogt degene, te wiens behoeve gevorderd
      wordt, in de gelegenheid te stellen de zaak of het recht te vervreemden, is het eerste lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel19
  - number: '20.1'
    text: |-
      Onze Minister, wie het rechtstreeks aangaat, kan een als gevolg van een vordering ontstaan recht tot gebruik van
      een zaak, waarvan de duur in de vorderingsbeschikking niet aan een termijn is gebonden, met een termijn van zes
      maanden beëindigen.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel20
  - number: '20.2'
    text: |-
      Hij kan een als gevolg van een vordering ontstaan recht tot gebruik van een zaak zonder inachtneming van enige
      termijn beëindigen, indien gebleken is, dat degene, voor wie het recht is ontstaan, en de eigenaar van de zaak
      daartegen geen bedenkingen hebben.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel20
  - number: '20.3'
    text: |-
      De [artikelen 4][ref1] en [8][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002393#Artikel8
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002393
        artikel: '8'
  - number: '20.4'
    text: |-
      De bekendmaking van de beschikking geschiedt door toezending of uitreiking aan degene wiens recht wordt beëindigd;
      tegelijkertijd of zo spoedig mogelijk daarna wordt van de beschikking door middel van toezending of uitreiking
      mededeling gedaan aan de eigenaar van de zaak.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel20
  - number: '21'
    text: |-
      Een als gevolg van een vordering ontstaan recht tot gebruik van een zaak, dat nog bestaat bij het vervallen
      van de bevoegdheid, krachtens welke die vordering is gedaan, blijft bestaan tot zes maanden nadat vorenbedoelde
      bevoegdheid is vervallen, tenzij het eerder een einde neemt door het verstrijken van de termijn, waaraan zijn duur
      in de vorderingsbeschikking was gebonden of als gevolg van toepassing van [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel20
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '20'
  - number: '22.1'
    text: |-
      In alle gevallen, waarin een recht tot gebruik van een zaak is geëindigd, is degene, voor wie dat recht als gevolg
      van de vordering was ontstaan, verplicht aan de eigenaar van de zaak onverwijld de feitelijke mogelijkheid tot
      uitoefening van het recht te verschaffen.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel22
  - number: '22.2'
    text: |-
      Onze Minister die het rechtstreeks aangaat is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving
      van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel22
  - number: '23.1'
    text: |-
      Zolang niet een krachtens [artikel 3, eerste lid][ref1], vastgesteld besluit in werking is, kan bij koninklijk
      besluit aan Onze Minister van Defensie de bevoegdheid worden verleend in het belang van de uitvoering van de
      militaire taak, ten behoeve van de Staat of van andere met de behartiging van openbare belangen belaste lichamen
      het eigendomsrecht op of een recht tot gebruik van een of meer bij Ons besluit aangewezen onroerende zaken te
      vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel3
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '3'
  - number: '23.2'
    text: |-
      Zolang niet een krachtens [artikel 3, eerste lid][ref1], vastgesteld besluit in werking is, kan bij
      koninklijk besluit aan Onze Minister van Binnenlandse Zaken de bevoegdheid worden verleend in het
      belang van de bestrijding van rampen en zware ongevallen in buitengewone omstandigheden als bedoeld in
      [paragraaf 12 van de Wet veiligheidsregio’s][ref2], van de beperking van de onmiddellijke gevolgen daarvan, ten
      behoeve van de Staat of van andere met de behartiging van openbare belangen belaste lichamen het eigendomsrecht op
      of een recht tot gebruik van een of meer bij Ons besluit aangewezen onroerende zaken te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Paragraaf12
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0027466
        paragraaf: '12'
  - number: '23.3'
    text: Wij nemen Ons besluit als bedoeld in het eerste of tweede lid, de Raad van State gehoord.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel23
  - number: '23.4'
    text: |-
      De voordracht tot vaststelling van een besluit krachtens het eerste lid wordt Ons gedaan door Onze Minister van
      Defensie, tezamen met Onze Minister van Economische Zaken en Klimaat, en de voordracht tot vaststelling van een
      besluit krachtens het tweede lid wordt Ons gedaan door Onze Minister van Binnenlandse Zaken, tezamen met Onze
      Minister van Economische Zaken en Klimaat. Onze Minister van Economische Zaken en Klimaat pleegt, alvorens de
      voordracht mede te ondertekenen, overleg met Onze Ministers, tot wier zorg belangen, die door de vordering kunnen
      worden geraakt, behoren.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel23
  - number: '23.5'
    text: |-
      De voordracht wordt niet gedaan dan nadat gebleken is, dat de nodige beschikking over de onroerende zaak niet of
      niet tijdig bij minnelijke overeenkomst verkregen kan worden.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel23
  - number: '23.6'
    text: |-
      Een krachtens het eerste of tweede lid verleende bevoegdheid vervalt een maand na het in werking treden van Ons
      besluit, waarbij zij is verleend.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel23
  - number: '23.7'
    text: |-
      De vorderingsbeschikking vermeldt het koninklijk besluit, waarbij de bevoegdheid tot het doen der vordering is
      verleend.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel23
  - number: '23.8'
    text: |-
      De [artikelen 4][ref1], [7][ref2], [8][ref3], [9, eerste en derde lid][ref4], [15-20][ref5] en [22][ref6] zijn
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002393#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002393#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002393#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0002393#Artikel20
      [ref6]: https://wetten.overheid.nl/BWBR0002393#Artikel22
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002393
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002393
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002393
        artikel: '9'
      - id: ref5
        bwb_id: BWBR0002393
        artikel: '20'
      - id: ref6
        bwb_id: BWBR0002393
        artikel: '22'
  - number: '23.9'
    text: |-
      Met betrekking tot het bepaalde in de [artikelen 23-27][ref1] blijft [artikel 1, tweede lid][ref2], buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002393#Artikel1
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0002393
        artikel: '1'
  - number: '24'
    text: |-
      In krachtens [artikel 23][ref1] vastgestelde vorderingsbeschikkingen kan aan daarbij aangewezen personen de
      verplichting worden opgelegd, om, voor zover hun dat feitelijk en rechtens mogelijk is, op het tijdstip, waarop
      het gevorderde recht op de zaak zal overgaan of ontstaan, aan degene, te wiens behoeve de vordering geschiedt, de
      feitelijke mogelijkheid tot uitoefening van dat recht te verschaffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel23
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '23'
  - number: '25.1'
    text: |-
      In geval krachtens [artikel 23][ref1] het eigendomsrecht op een onroerende zaak is gevorderd, doet Onze Minister,
      die de vordering heeft gedaan, de beschikking zo spoedig mogelijk inschrijven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '25.2'
    text: |-
      Door de inschrijving van de beschikking gaat het eigendomsrecht op de zaak over op degene, te wiens behoeve de
      vordering is geschied. [Artikel 11, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel11
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '11'
  - number: '26'
    text: |-
      Ingeval krachtens [artikel 23][ref1] een recht tot gebruik van een onroerende zaak is gevorderd, ontstaat dit recht
      voor degene, te wiens behoeve de vordering is geschied, op het daarvoor in de vorderingsbeschikking te bepalen
      tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel23
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '23'
  - number: '27.1'
    text: |-
      Onze Minister die krachtens [artikel 23][ref1] een vordering heeft gedaan, is bevoegd tot oplegging van een last
      onder bestuursdwang ter handhaving van de vordering.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel23
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '23'
  - number: '27.2'
    text: |-
      Een machtiging als bedoeld in [artikel 2 van de Algemene wet op het binnentreden][ref1] kan worden gegeven door
      Onze Minister die de vordering krachtens [artikel 23][ref2] heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002393#Artikel23
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002393
        artikel: '23'
  - number: '29.1'
    text: |-
      Onze Ministers, aan wie krachtens [artikel 3][ref1] of [23][ref2] vorderingsbevoegdheid is verleend, kunnen van
      een ieder inlichtingen en inzage van zakelijke gegevens en bescheiden vorderen, voor zover zij die voor een goede
      uitvoering van deze wet nodig achten.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002393#Artikel23
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002393
        artikel: '23'
  - number: '29.2'
    text: |-
      Zij kunnen de uitoefening van de in het eerste lid bedoelde bevoegdheden, opdragen aan daartoe schriftelijk door
      hen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel29
  - number: '29.3'
    text: |-
      De [artikelen 5:12.][ref1], [5:13][ref2], [5:15][ref3] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing ten
      aanzien van de in het tweede lid bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '29.4'
    text: Zo nodig oefenen die personen de in het eerste lid genoemde bevoegdheid uit met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel29
  - number: '29.5'
    text: |-
      Onze Ministers zijn bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten aanzien van de in het tweede lid bedoelde
      personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '31.1'
    text: |-
      Een bij of krachtens deze wet opgelegde verplichting vervalt van rechtswege voorzover het voldoen hieraan zou
      meebrengen dat niet kan worden voldaan aan een verplichting die voortvloeit uit de uitoefening van buitengewone
      bevoegdheden ten behoeve van de uitvoering van de militaire taak.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel31
  - number: '31.2'
    text: |-
      Een bij of krachtens deze wet opgelegde verplichting die niet voortvloeit uit de uitoefening van buitengewone
      bevoegdheden ten behoeve van de uitvoering van de militaire taak, vervalt eveneens van rechtswege voorzover het
      voldoen hieraan zou meebrengen dat niet kan worden voldaan aan een verplichting die bij of krachtens deze of een
      andere wet is opgelegd in het belang van de bestrijding van een ramp, een zwaar ongeval of van een verstoring van
      de openbare orde of van ernstige vrees voor het ontstaan daarvan.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel31
  - number: '32.1'
    text: |-
      Hij die opzettelijk niet voldoet aan een hem bij of krachtens [artikel 6][ref1], [22][ref2] of [24][ref3] opgelegde
      verplichting, dan wel opzettelijk bewerkt, dat aan zodanige, een ander opgelegde verplichting niet wordt voldaan,
      wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002393#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002393#Artikel24
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002393
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0002393
        artikel: '24'
  - number: '32.2'
    text: |-
      Hij aan wiens schuld te wijten is, dat aan een verplichting als in het vorige lid bedoeld niet wordt voldaan, wordt
      gestraft met hechtenis van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel32
  - number: '32.3'
    text: |-
      Hij die de krachtens [artikel 29][ref1] van hem verlangde inlichtingen niet, niet volledig of niet naar waarheid
      verstrekt of niet inzage verleent van de zakelijke gegevens en bescheiden, waarvan krachtens dat artikel inzage is
      gevorderd, wordt gestraft met hechtenis van ten hoogste een jaar of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel29
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '29'
  - number: '32.4'
    text: |-
      De in het eerste lid strafbaar gestelde feiten zijn misdrijven, de in het tweede en derde lid strafbaar gestelde
      feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel32
  - number: '33.1'
    text: |-
      Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de door Onze Minister van Veiligheid en Justitie
      in overeenstemming met Onze andere Ministers, wie het aangaat, daartoe aangewezen ambtenaren. Deze ambtenaren zijn
      tevens belast met de opsporing van feiten, strafbaar gesteld in de [artikelen 179][ref2] tot en met [182][ref3]
      en [184 van het Wetboek van Strafrecht][ref4], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel182
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '182'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '33.2'
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2] en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref3]
      zijn van overeenkomstige toepassing ten aanzien van de in het eerste lid bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '33.3'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd bij het opsporen van de bij deze wet strafbaar gestelde
      feiten, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel33
  - number: '33.4'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel33
  - number: '35.1'
    text: |-
      De Algemene Vorderingswet 1939 (*Stb.* 631) en de Algemene Vorderingsregeling 1944 (*Stb.* E 140) worden
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel35
  - number: '35.3'
    text: Het Algemeen Vorderingsbesluit 1940 (*Verordeningenblad* 110) vervalt.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel35
  - number: '36'
    text: |-
      Ten aanzien van op grond van de Algemene Vorderingswet 1939 en het Algemeen Vorderingsbesluit 1940 gedane
      vorderingen blijft het bij en krachtens de artikelen 10 en 11 van die wet onderscheidenlijk de artikelen
      9, 10 en 11 van dat besluit bepaalde van toepassing, behoudens dat met overeenkomstige toepassing van
      [artikel 17 van deze wet][ref1] de rechter in de plaats treedt van de krachtens die regelingen ingestelde
      commissies.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel17
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '17'
  - number: '37.1'
    text: |-
      Een recht tot gebruik van een zaak of vermogensrecht, ontstaan als gevolg van een op grond van de Algemene
      Vorderingswet 1939 of het Algemeen Vorderingsbesluit 1940 gedane vordering en nog bestaande bij het in werking
      treden van deze wet, blijft bestaan tot het tijdstip, waarop het krachtens de wettelijke regeling, op grond waarvan
      de vordering is gedaan, een einde zou hebben genomen, of, indien geen zodanig tijdstip is bepaald, tot zes maanden
      na het in werking treden van deze wet. Onze Minister, wie het rechtstreeks aangaat, kan laatstbedoelde termijn
      eenmaal met ten hoogste zes maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel37
  - number: '37.2'
    text: |-
      [Artikel 22][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002393#Artikel22
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002393
        artikel: '22'
  - number: '38'
    text: 'Deze wet wordt aangehaald als: Vorderingswet.'
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel38
  - number: '39'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip. Lasten en bevelen, dat deze in het *Staatsblad* zal
      worden geplaatst, en dat alle Ministeriële Departementen, Autoriteiten, Colleges en Ambtenaren, wie zulks aangaat,
      aan de nauwkeurige uitvoering de hand zullen houden.
    url: https://wetten.overheid.nl/BWBR0002393/2022-03-02#Artikel39
