preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Economische Zaken;

    Gelet op de artikelen 15b en 15f van de Waterleidingwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012425/2003-08-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als ambtenaren ten aanzien van wie, in geval van levering van leidingwater door een collectieve watervoorziening
      of een collectief leidingnet, het ten aanzien van de inspecteur in de [artikelen 5, eerste en tweede lid][ref1],
      [6][ref2], [7][ref3], [8][ref4] en [14 van de Waterleidingwet][ref5] bepaalde van toepassing is, worden
      aangewezen:

      1. de toezichthoudende ambtenaren van het Staatstoezicht op de Mijnen, voor collectieve watervoorzieningen die
      aanwezig zijn op een mijnbouwinstallatie, aangewezen krachtens de [Mijnbouwwet][ref6];

      2. de Hoofdinspecteur en regionale inspecteurs van de Volksgezondheid, belast met het toezicht op de hygiëne
      van het milieu, en de onder hun bevelen werkzame ambtenaren, met uitzondering van hen die meer in het bijzonder
      administratieve werkzaamheden uitoefenen, voor alle overige collectieve watervoorzieningen en collectieve
      leidingnetten.


