$id: regeling_aanwijzing_nationaal_park_schiermonnikoog
regulatory_layer: WET
publication_date: '2007-08-15'
valid_from: '1996-01-24'
bwb_id: BWBR0004588
url: https://wetten.overheid.nl/BWBR0004588/1996-01-24
preamble:
  text: |-
    Overwegende dat het beleid van de regering is gericht op het tot stand brengen van een stelsel van nationale
    parken;

    dat er een goedgekeurd Beheers- en Inrichtingsplan Nationaal Park Schiermonnikoog is, op basis waarvan aan het
    nationaal park in oprichting Schiermonnikoog de definitieve status van nationaal park verleend kan worden;

    Gezien de adviezen van de Voorlopige Commissie Nationale Parken van 1 juni 1983 en 21 december 1988;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004588/1996-01-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze regeling verstaat onder:




              *minister:*


              minister van Landbouw en Visserij;




              *overlegorgaan:*


              overlegorgaan als bedoeld in [artikel 4][ref1];




              *nationaal park:*


              gebied zoals omschreven in het Structuurschema Natuur- en Landschapsbehoud (Tweede Kamer, zitting 1980–
      1981, nrs. 1–2).


      [ref1]: https://wetten.overheid.nl/BWBR0004588#Artikel4
    url: https://wetten.overheid.nl/BWBR0004588/1996-01-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004588
        artikel: '4'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het deel van Schiermonnikoog dat is aangegeven op de kaart die als bijlage
      behoort bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0004588/1996-01-24#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park Schiermonnikoog.
    url: https://wetten.overheid.nl/BWBR0004588/1996-01-24#Artikel3
  - number: '4'
    text: |-
      Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting en het beheer van het nationaal park
      Schiermonnikoog.
    url: https://wetten.overheid.nl/BWBR0004588/1996-01-24#Artikel4
  - number: '5'
    text: |-
      Tot de taak van het overlegorgaan behoort onder meer:

        - het streven naar onderlinge afstemming van alle voor de inrichting en het beheer van belang zijnde activiteiten;
        - het doen van voorstellen aan de minister voor de besteding van de voor het nationaal park Schiermonnikoog
      beschikbare middelen in het kader van een jaarlijks voor te stellen activiteitenprogramma met bijbehorende
      begroting;
        - het opstellen van een meerjarenprogramma voorlichting en educatie, ter bevordering en coördinatie van
      voorlichting en educatie met betrekking tot het nationaal park Schiermonnikoog.
    url: https://wetten.overheid.nl/BWBR0004588/1996-01-24#Artikel5
  - number: '6'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het Beheers- en Inrichtingsplan Nationaal Park Schiermonnikoog
      van 17 juni 1988, zoals dit door de minister op 13 maart 1989 is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0004588/1996-01-24#Artikel6
  - number: '7'
    text: |-
      In het overlegorgaan hebben zitting:

      a. één door de minister te benoemen lid, tevens voorzitter;

      b. vier leden door de minister te benoemen, als vertegenwoordiger van onderscheidenlijk:

        - de gemeente Schiermonnikoog;
        - de provincie Friesland;
        - de Vereniging tot Behoud van Natuurmonumenten in Nederland;
        - de minister van Verkeer en Waterstaat;

      c. drie leden uit de bevolking van Schiermonnikoog, door de minister te benoemen op voordracht van het
      gemeentebestuur;

      d. de Directeur van de Directie Noord van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0004588/1996-01-24#Artikel7
  - number: '8'
    text: |-
      1 Het secretariaat van het overlegorgaan berust bij een door de provincie Friesland te benoemen ambtenaar van die
      provincie en de gemeente Schiermonnikoog tezamen.

      2 Het overlegorgaan stelt regelen op met betrekking tot de openbaarheid en de plaats van zijn vergaderingen alsmede
      met betrekking tot de overige aspecten van zijn inrichting en werkwijze.

      3 Het overlegorgaan brengt jaarlijks van zijn werkzaamheden verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0004588/1996-01-24#Artikel8
  - number: '9'
    text: |-
      Indien in het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter daarvan
      mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0004588/1996-01-24#Artikel9
  - number: '10'
    text: |-
      De voorzitter en de drie leden uit de bevolking van Schiermonnikoog genieten voor het bijwonen van vergaderingen
      en overige bijeenkomsten een vacatiegeld op grond van het [Vacatiegeldenbesluit 1988][ref1]. Voorts ontvangen zij
      vergoeding voor reis- en verblijfkosten overeenkomstig het voor ambtenaren geldende Reisbesluit 1971.


      [ref1]: https://wetten.overheid.nl/BWBR0004317
    url: https://wetten.overheid.nl/BWBR0004588/1996-01-24#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004317
  - number: '11'
    text: De Beschikking aanwijzing nationaal park in oprichting Schiermonnikoog (Stcrt. 1984, 94) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004588/1996-01-24#Artikel11
  - number: '12'
    text: |-
      1 Deze regeling kan worden aangehaald als: Regeling aanwijzing nationaal park Schiermonnikoog.

      2 Zij treedt in werking met ingang van 19 juli 1989 en zal worden bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004588/1996-01-24#Artikel12
