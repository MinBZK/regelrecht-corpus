regulatory_layer: WET
publication_date: '2004-12-24'
valid_from: '2004-07-01'
bwb_id: BWBR0015113
url: https://wetten.overheid.nl/BWBR0015113/2004-07-01
preamble:
  text: |-
    Gelet op artikel 6a, tweede lid, onder e, van het Organisatie-, mandaat- en volmachtbesluit SZW 2002;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015113/2004-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            de projectorganisatie:

              de projectorganisatie Secretaressen bij het Rijk;



            b
            de projectleider:

              degene die is belast met de leiding van de projectorganisatie.
    url: https://wetten.overheid.nl/BWBR0015113/2004-07-01#Artikel1
  - number: '2'
    text: Er is een projectorganisatie Secretaressen bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0015113/2004-07-01#Artikel2
  - number: '3'
    text: |-
      1 De projectorganisatie ressorteert rechtstreeks onder de plaatsvervangend secretaris-generaal.

      2 Aan het hoofd van de projectorganisatie staat een projectleider.
    url: https://wetten.overheid.nl/BWBR0015113/2004-07-01#Artikel3
  - number: '4'
    text: |-
      De projectorganisatie heeft de volgende taken:

      a. het uitvoeren van het project ‘Professionalisering van de secretaressefunctie bij SZW’, dat zich, in het
      verlengde van de implementatie van competentieprofielen, richt op het aanbieden van een talentanalyse aan
      secretaressen op grond waarvan zij aansluitend een door de projectorganisatie te ontwikkelen leertraject kunnen
      volgen;

      b. het uitvoeren van het interdepartementale project ‘Vernieuwing van de secretaressefunctie bij het Rijk’,
      dat is opgezet om de inhoud en het aanzien van de secretaressefunctie te vernieuwen om voor de secretaresse een
      doelmatiger taakverdeling te bereiken en de functie van secretaresse afwisselender en aantrekkelijker te maken.
    url: https://wetten.overheid.nl/BWBR0015113/2004-07-01#Artikel4
  - number: '5'
    text: |-
      1 De artikelen 3 en 11 van het Organisatie-, mandaat- en volmachtbesluit plaatsvervangend secretaris-generaal SZW
      2003 zijn van overeenkomstige toepassing op de projectleider.

      2 De plaatsvervangend secretaris-generaal stelt de jaarplannen vast van de projectorganisatie. Gegeven
      het budget dat door de secretaris-generaal aan de plaatsvervangend secretaris-generaal ter beschikking is
      gesteld, kent de plaatsvervangend secretaris-generaal aan de projectleider de budgetten toe waarover deze mag
      beschikken. De plaatsvervangend secretaris-generaal bewaakt de voortgang van de uitvoering van jaarplannen van
      de projectorganisatie.
    url: https://wetten.overheid.nl/BWBR0015113/2004-07-01#Artikel5
  - number: '6'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 maart 2003.

      2 Deze regeling wordt aangehaald als: Instellingsbesluit projectorganisatie Secretaressen bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0015113/2004-07-01#Artikel6
