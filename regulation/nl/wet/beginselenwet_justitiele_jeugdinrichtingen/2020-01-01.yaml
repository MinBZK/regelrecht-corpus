  - number: '4.5'
    text: |-
      In afwijking van het bepaalde in het tweede en vierde lid, kan de directeur een afdelingshoofd machtigen tot het
      nemen van de volgende beslissingen:
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
  - number: 4.5.a
    text: |-
      de uitsluiting van verblijf in de groep of van deelname aan activiteiten, bedoeld in de
      [artikelen 23, derde lid][ref1], en [24, eerste lid][ref2], de verlenging van de uitsluiting van verblijf in de
      groep of van deelname aan activiteiten, bedoeld in artikel 23, tweede lid en vierde lid, en artikel 24, tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel24
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '23'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '24'
        hoofdstuk: VI
        paragraaf: '2'
  - number: 4.5.b
    text: |-
      de plaatsing in afzondering, bedoeld in [artikel 25, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel25
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '25'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '4.6'
    text: |-
      Indien de onder het vijfde lid genomen beslissingen worden genomen door een afdelingshoofd dan wordt de directeur
      daarvan zo spoedig mogelijk, doch uiterlijk binnen vijftien uren na het nemen van die beslissing, op de hoogte
      gesteld.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
  - number: '5.1'
    text: De directeur meldt ongeoorloofde afwezigheid en andere bijzondere voorvallen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel5
  - number: '5.2'
    text: |-
      De directeur verstrekt Onze Minister te allen tijde alle verlangde inlichtingen. Onze Minister kan nadere regels
      stellen omtrent de inhoud en de wijze van melding.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel5
  - number: 5a.1
    text: |-
      De directeur stelt voor zijn personeelsleden en medewerkers een meldcode vast waarin stapsgewijs wordt aangegeven
      hoe met signalen van huiselijk geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan bijdraagt
      dat zo snel en adequaat mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel5a
  - number: 5a.2
    text: |-
      Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
  - number: 5a.3
    text: |-
      Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 5a.4
    text: De directeur bevordert de kennis en het gebruik van de meldcode.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel5a
  - number: 5a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel5a
  - number: '6'
    text: |-
      De Raad behandelt beroepschriften ingevolge de [hoofdstukken XIV][ref1] en [XV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXIV
      [ref2]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011756
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0011756
        hoofdstuk: XV
  - number: '7.1'
    text: Bij elke inrichting dan wel afdeling wordt door Onze Minister een commissie van toezicht ingesteld.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel7
  - number: '7.2'
    text: 'De commissie van toezicht heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel7
  - number: 7.2.a
    text: toezicht te houden op de wijze van tenuitvoerlegging van de vrijheidsbeneming in de inrichting of afdeling;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel7
  - number: 7.2.b
    text: |-
      kennis te nemen van door de jeugdigen, ouders of voogd, stiefouder of pleegouders, naar voren gebrachte grieven en
      ter zake te bemiddelen;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel7
  - number: 7.2.c
    text: |-
      zorg te dragen voor de behandeling van klaagschriften ingevolge [hoofdstuk XIII][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXIII
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011756
        hoofdstuk: XIII
  - number: 7.2.d
    text: aan Onze Minister, de Raad en de directeur advies en inlichtingen te geven omtrent het onder a gestelde.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien het advies of de inlichtingen een particuliere inrichting betreffen en zijn bestemd voor Onze Minister of de
      Raad, voegt de commissie de desbetreffende opmerkingen van het betrokken bestuur daarbij, tenzij naar het oordeel
      van Onze Minister, de Raad of de commissie bijzondere spoed geboden is dan wel het bestuur zijn opmerkingen naar
      het oordeel van de commissie niet binnen een redelijke termijn op schrift heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel7
  - number: '7.4'
    text: |-
      De commissie van toezicht stelt zich door persoonlijk contact met de jeugdigen regelmatig op de hoogte van onder
      hen levende wensen en gevoelens. Bij toerbeurt treedt één van haar leden hiertoe op als maandcommissaris. De
      maandcommissaris vervult tevens de taken van de vertrouwenspersoon, bedoeld in [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '7.5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de bevoegdheden, de samenstelling en de werkwijze van
      de commissie, de benoeming en het ontslag van haar leden alsmede over de werkzaamheden van de maandcommissaris.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel7
  - number: 7a.1
    text: |-
      Onze Minister houdt toezicht op het verblijf van personen ten aanzien van wie de tenuitvoerlegging van een
      vrijheidsbenemende straf of maatregel in een inrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel7a
  - number: 7a.2
    text: |-
      De door Onze Minister aangewezen ambtenaren worden daartoe alle ter zake dienende inlichtingen verstrekt en zij
      hebben te allen tijde toegang tot een zodanige inrichting. Zij zijn, onder verplichting van geheimhouding tegenover
      derden en voor zover dit voor de uitoefening van hun taak redelijkerwijs nodig is, bevoegd de op personen als
      bedoeld in het eerste lid betrekking hebbende stukken in te zien.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel7a
  - number: 7a.3
    text: |-
      Onze Minister stelt regels omtrent het houden van aantekeningen als bedoeld in
      [artikel 6:6:31, vijfde lid, van het Wetboek van Strafvordering][ref1] en omtrent het houden van aantekeningen
      van andere belangrijke voorvallen ten tijde van het verblijf in de inrichting. Onze Minister kan daartoe een model
      vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '8.1'
    text: 'Inrichtingen zijn bestemd voor:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
  - number: 8.1.a
    text: |-
      personen ten aanzien van wie een bevel tot voorlopige hechtenis is gegeven, voor zover zij ten tijde van het
      begaan van het strafbaar feit waarvan zij worden verdacht, de leeftijd van achttien jaar nog niet hebben bereikt
      en personen ten aanzien van wie een bevel tot voorlopige hechtenis is gegeven, voor zover zij ten tijde van
      het begaan van het strafbaar feit waarvan zij worden verdacht, de leeftijd van drieëntwintig jaar nog niet
      hebben bereikt en de officier van justitie voornemens is te vorderen dat recht zal worden gedaan overeenkomstig
      [artikel 77c van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77c
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77c
  - number: 8.1.b
    text: |-
      personen aan wie de straf van jeugddetentie, daaronder begrepen vervangende jeugddetentie, alsmede personen aan
      wie vervangende hechtenis is opgelegd en die uit hoofde van een andere vrijheidsstraf straf of maatregel al in de
      inrichting verblijven;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
  - number: 8.1.c
    text: |-
      personen in vreemdelingenbewaring, voor zover zij de leeftijd van twaalf jaar wel maar die van achttien jaar nog
      niet hebben bereikt;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
  - number: 8.1.d
    text: |-
      personen ten aanzien van wie een bevel tot gijzeling is gegeven, voor zover zij de leeftijd van achttien jaar nog
      niet hebben bereikt;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
  - number: 8.1.e
    text: personen aan wie de maatregel van plaatsing in een inrichting voor jeugdigen is opgelegd;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
  - number: 8.1.f
    text: |-
      personen ten aanzien van wie een machtiging als bedoeld in [artikel 6.2.2, tweede lid, van de Jeugdwet][ref1] is
      gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
  - number: 8.1.g
    text: |-
      personen die in een inrichting verblijven en ten aanzien van wie een rechterlijke machtiging op
      grond van de [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref1]
      of een zorgmachtiging op grond van de [Wet verplichte geestelijke gezondheidszorg][ref2]
      is gegeven, in afwachting van plaatsing in een accommodatie als bedoeld in
      [artikel 1:1, eerste lid, onderdeel b, van de Wet verplichte geestelijke gezondheidszorg][ref3] of
      __REF003___________________________________________________________________________________________________________
      ____________;


      [ref1]: https://wetten.overheid.nl/BWBR0040632
      [ref2]: https://wetten.overheid.nl/BWBR0040635
      [ref3]: https://wetten.overheid.nl/BWBR0040635#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0040632#Artikel1
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0040632
      - id: ref2
        bwb_id: BWBR0040635
      - id: ref3
        bwb_id: BWBR0040635
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0040632
        artikel: '1'
  - number: 8.1.h
    text: |-
      personen aan wie met toepassing van [artikel 77b van het Wetboek van Strafrecht][ref1] de maatregel van
      terbeschikkingstelling als bedoeld in de [artikel 37a][ref2] en [37b van het Wetboek van Strafrecht][ref3] werd
      opgelegd, voorzover de jeugdige ten tijde van de tenuitvoerlegging de leeftijd van 21 jaar nog niet heeft bereikt,
      en ten aanzien van wie Onze Minister, of de rechter blijkens het vonnis of arrest waarbij de maatregel werd
      opgelegd, heeft bepaald dat de plaatsing van de jeugdige in een inrichting gelet op diens ontwikkeling aangewezen
      is;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 37a
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 37b
  - number: 8.1.i
    text: |-
      jeugdigen of jongvolwassenen aan wie de maatregel betreffende het gedrag is opgelegd en ten aanzien van wie een
      bevel nachtdetentie is gegeven of ten aanzien van wie de tijdelijke opneming in een inrichting is bevolen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister bepaalt de bestemming van elke inrichting of afdeling. Onze Minister kan delen van een inrichting als
      afdeling met een aparte bestemming aanwijzen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
  - number: '8.3'
    text: |-
      Inrichtingen of afdelingen daarvan kunnen door Onze Minister worden aangewezen voor de onderbrenging van jeugdigen
      die een bijzondere opvang of behandeling behoeven. Deze bijzondere opvang of behandeling kan verband houden met
      de leeftijd, de geestelijke of lichamelijke ontwikkeling van de jeugdige of de uitvoering van het perspectiefplan
      dan wel de verrichting van geneeskundige behandeling als bedoeld in [artikel 51d, onder a][ref1], alsmede met het
      delict waarvoor of de titel waarop de jeugdige in een inrichting verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51d
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51d
        hoofdstuk: IX
        paragraaf: 1a
  - number: '8.4'
    text: |-
      Onze Minister wijst inrichtingen, afdelingen of plaatsen aan, waarin kinderen van de jeugdige tot een in de
      aanwijzing aangegeven leeftijd met de jeugdige kunnen worden ondergebracht.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
  - number: '8.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze waarop het onderbrengen van
      jeugdigen in inrichtingen plaats heeft dan wel omtrent de wijze waarop de bijzondere bestemming invulling krijgt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
  - number: '8.6'
    text: |-
      Onze Minister kan ten aanzien van de in het eerste lid onder h. aangeduide personen bepalen dat de
      tenuitvoerlegging van de maatregel van terbeschikkingstelling kan voortduren ook nadat de leeftijd van
      21 jaar is bereikt, maar de behandeling zich tegen onmiddellijke overplaatsing verzet. In deze gevallen
      wordt de jeugdige zo snel als de behandeling dit toelaat, overgeplaatst naar een inrichting als bedoeld in
      [artikel 1, onderdeel b. van de Beginselenwet verpleging ter beschikking gestelden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008765#Artikel1
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008765
        artikel: '1'
  - number: '8.7'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de aanwezigheid van de benodigde
      voorzieningen in een inrichting of afdeling voor de verrichting van geneeskundige behandeling als bedoeld in
      [artikel 51d, onder a][ref1]. In elk geval worden nadere regels gesteld omtrent de beschikbaarheid van een
      psychiater en een verpleegkundige ten dienste van deze inrichting of afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51d
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51d
        hoofdstuk: IX
        paragraaf: 1a
  - number: '9.1'
    text: In de inrichting worden mannelijke en vrouwelijke jeugdigen gescheiden ondergebracht.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel9
  - number: '9.2'
    text: |-
      De directeur kan jeugdigen van verschillend geslacht die in dezelfde inrichting verblijven in de gelegenheid
      stellen gezamenlijk aan activiteiten deel te nemen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel9
  - number: '9.3'
    text: |-
      Onze Minister kan inrichtingen of afdelingen aanwijzen, waarin van het eerste lid wordt afgeweken vanwege de
      bijzondere bestemming van de inrichting of de afdeling.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel9
  - number: '10.1'
    text: 'Inrichtingen of afdelingen daarvan zijn naar de mate van beveiliging als volgt te onderscheiden en aan te duiden:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel10
  - number: 10.1.a
    text: 'beperkt beveiligd: een open inrichting of afdeling;'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel10
  - number: 10.1.b
    text: 'normaal beveiligd: een gesloten inrichting of afdeling.'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel10
  - number: '10.2'
    text: |-
      Onze Minister bepaalt ten aanzien van elke inrichting of afdeling daarvan de mate van beveiliging, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel10
  - number: '11'
    text: 'Onze Minister kan nadere regels stellen over:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel11
  - number: 11.a
    text: de plaatsing, overplaatsing en overbrenging van jeugdigen;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel11
  - number: 11.b
    text: de procedure van plaatsing, overplaatsing en overbrenging;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel11
  - number: 11.c
    text: |-
      de criteria waaraan jeugdigen moeten voldoen voor plaatsing in een inrichting of afdeling met een bijzondere
      bestemming, als bedoeld in [artikel 8, tweede en derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel8
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '8'
        hoofdstuk: III
  - number: 11.d
    text: de onderbrenging van kinderen van jeugdigen in de inrichting, afdeling of plaats waar de jeugdige verblijft.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel11
  - number: '12.1'
    text: |-
      Personen ten aanzien van wie de tenuitvoerlegging van vrijheidsstraffen of vrijheidsbenemende maatregelen
      is gelast, worden, voor zover de tenuitvoerlegging in een inrichting plaatsvindt, geplaatst in een
      inrichting of afdeling dan wel overgeplaatst naar een inrichting of afdeling overeenkomstig het bepaalde in
      [artikel 2, tweede tot en met vierde lid][ref1]. De plaatsing geschiedt met inachtneming van de titel van de
      vrijheidsbeneming, de persoon van de jeugdige of de benodigde mate van beveiliging.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel2
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '12.2'
    text: |-
      Personen als bedoeld in [artikel 8, eerste lid, onderdelen e en h][ref1], worden in elk geval geplaatst in een
      inrichting of op een afdeling waar behandeling plaats kan vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel8
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '8'
        hoofdstuk: III
  - number: '12.3'
    text: |-
      Met de plaatsing en overplaatsing zijn door Onze Minister aangewezen selectiefunctionarissen belast. Deze zijn
      bevoegd daartoe de overbrenging van personen te bevelen. Zij kunnen de overbrenging doen geschieden door daartoe
      door hen aangewezen personeelsleden of medewerkers.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel12
  - number: '12.4'
    text: De inrichting is verplicht de jeugdige op te nemen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel12
  - number: '12.5'
    text: |-
      De selectiefunctionaris neemt bij de beslissing tot plaatsing, overplaatsing of overbrenging de aanwijzingen
      van het openbaar ministerie en van de autoriteiten die de straf of maatregel hebben opgelegd, in aanmerking. De
      selectiefunctionaris neemt bij de beslissing, bedoeld in het eerste lid, de aanwijzingen van de gecertificeerde
      instelling voor zover mogelijk in acht.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel12
  - number: '12.6'
    text: |-
      De selectiefunctionaris neemt de beslissing om een jeugdige te plaatsen op een afdeling voor intensieve zorg of
      voor intensieve behandeling als bedoeld in [artikel 22a][ref1], onderscheidenlijk [artikel 22b][ref2], na advies
      van een psychiater, die voor zover mogelijk overleg heeft gevoerd met de behandelend gedragsdeskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel22b
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 22a
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: 22b
        hoofdstuk: VI
        paragraaf: '1'
  - number: '12.7'
    text: |-
      De selectiefunctionaris neemt de beslissing om een jeugdige te plaatsen op een individuele trajectafdeling als
      bedoeld in [artikel 22c][ref1], na daarover advies te hebben ingewonnen van de adviescommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel22c
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 22c
        hoofdstuk: VI
        paragraaf: '1'
  - number: '12.8'
    text: |-
      In geval van een psychische stoornis, psychogeriatrische aandoening of verstandelijke handicap van een jeugdige
      kan de selectiefunctionaris, met inachtneming van de [Wet verplichte geestelijke gezondheidszorg][ref1]
      of de [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref2],
      bepalen dat de jeugdige naar een accommodatie als bedoeld in
      [artikel 1:1, eerste lid, onderdeel b, van de Wet verplichte geestelijke gezondheidszorg][ref3] of
      __REF003___________________________________________________________________________________________________________
      ____________ zal worden overgebracht om daar zolang als dat noodzakelijk is te worden verpleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0040635
      [ref2]: https://wetten.overheid.nl/BWBR0040632
      [ref3]: https://wetten.overheid.nl/BWBR0040635#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0040632#Artikel1
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0040635
      - id: ref2
        bwb_id: BWBR0040632
      - id: ref3
        bwb_id: BWBR0040635
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0040632
        artikel: '1'
  - number: '12.9'
    text: |-
      De selectiefunctionaris kan, op verzoek van de directeur, beslissen dat de vrijheidsbenemende straf tijdelijk
      buiten de inrichting op een plaats als bedoeld in [artikel 8, vierde lid][ref1], ten uitvoer wordt gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel8
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '8'
        hoofdstuk: III
  - number: '13.1'
    text: |-
      Een plaatsing als bedoeld in [artikel 12, tweede lid][ref1], geschiedt voordat de termijn van de maatregel drie
      maanden is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel12
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '13.2'
    text: |-
      Indien de plaatsing niet binnen de in het eerste lid gestelde termijn mogelijk is, kan de selectiefunctionaris deze
      termijn telkens met drie maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel13
  - number: '13.3'
    text: |-
      Met een beslissing tot verlenging als bedoeld in het tweede lid wordt gelijk gesteld de weigering om binnen de in
      het eerste lid genoemde termijn te beslissen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel13
  - number: '14.1'
    text: |-
      De jeugdige ten aanzien van wie met toepassing van [artikel 6.2.2, tweede lid, van de Jeugdwet][ref1] is bepaald
      dat hij in een inrichting wordt geplaatst, heeft aanspraak op die plaatsing. Een jeugdige heeft slechts aanspraak
      op deze plaatsing als de betrokken gecertificeerde instelling een besluit heeft genomen waaruit blijkt dat hij
      op die plaatsing is aangewezen. Bij algemene maatregel van bestuur worden regels gesteld voor gevallen waarin het
      besluit bedoeld in de tweede volzin niet afgewacht kan worden. Daarbij kan worden afgeweken van de tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
  - number: '14.2'
    text: |-
      De jeugdige, bedoeld in het eerste lid, kan worden overgeplaatst naar een beperkt beveiligde inrichting als bedoeld
      in [artikel 10, eerste lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel10
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '10'
        hoofdstuk: III
  - number: '15.1'
    text: |-
      In afwijking van [artikel 12, eerste lid, eerste volzin][ref1], kan de selectiefunctionaris bepalen dat een persoon
      ten aanzien van wie de tenuitvoerlegging van een vrijheidsstraf of een vrijheidsbenemende maatregel is gelast en
      die in een politiecel verblijft, daar voor een periode van maximaal tien dagen zal verblijven, nadat hij heeft
      vastgesteld dat er voor deze persoon geen plaats is in een inrichting. De politiecel voldoet aan de regels die voor
      politiecellencomplexen zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel12
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '15.2'
    text: |-
      Het eerste lid kan voor een jeugdige in de leeftijd van twaalf tot zestien jaar worden toegepast, met dien
      verstande dat de maximale termijn voor verblijf in een politiecel dan drie dagen bedraagt en het verblijf alleen
      mag worden toegepast in afwachting van het regelen van vervoer naar de plaats in een inrichting.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel15
  - number: '16.1'
    text: |-
      Indien een jeugdige een kind in de inrichting of afdeling als bedoeld in [artikel 8, vierde lid][ref1], wil
      onderbrengen ten einde het aldaar te verzorgen en op te voeden, behoeft hij de toestemming van de directeur. De
      directeur geeft deze toestemming, voor zover dit verblijf zich verdraagt met de volgende belangen:


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel8
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '8'
        hoofdstuk: III
  - number: 16.1.a
    text: de bescherming van de persoonlijke veiligheid of de geestelijke of lichamelijke ontwikkeling van het kind;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel16
  - number: 16.1.b
    text: de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel16
  - number: 16.1.c
    text: de uitvoering van het perspectiefplan;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel16
  - number: 16.1.d
    text: de geestelijke of lichamelijke ontwikkeling van de jeugdige;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel16
  - number: 16.1.e
    text: het over het kind gestelde gezag.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel16
  - number: '16.2'
    text: De directeur kan aan de toestemming voorwaarden verbinden met het oog op een belang als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel16
  - number: '16.3'
    text: |-
      De directeur kan over een door hem voorgenomen onderbrenging van een kind in de inrichting of afdeling het advies
      inwinnen van de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel16
  - number: '16.4'
    text: |-
      De directeur kan de toestemming intrekken, indien dit noodzakelijk is met het oog op een belang als bedoeld in
      het eerste lid, of indien de jeugdige een bepaalde voorwaarde niet nakomt. Indien de directeur een nader onderzoek
      nodig oordeelt, kan hij de medewerking van de raad voor de kinderbescherming inroepen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel16
  - number: '16.5'
    text: |-
      De directeur is verplicht de toestemming in te trekken, indien de onderbrenging van het kind in de inrichting in
      strijd komt met enige op het gezag over het kind betrekking hebbende beslissing.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel16
  - number: '16.6'
    text: In de huisregels worden nadere regels gesteld omtrent het verblijf van kinderen in de inrichting.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel16
  - number: '16.7'
    text: |-
      De kosten van de verzorging van het kind komen voor rekening van het Rijk, voor zover de jeugdige dan wel degene
      die belast is met het gezag over het kind, niet zelf in die kosten kan voorzien.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel16
  - number: '16.8'
    text: |-
      Onverminderd het bepaalde in het eerste tot en met het zevende lid kan de directeur de selectiefunctionaris
      verzoeken de jeugdige en het kind elders te plaatsen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel16
  - number: '17.1'
    text: |-
      De directeur bepaalt de wijze van onderbrenging van de jeugdigen die overeenkomstig [artikel 12][ref1] zijn
      geplaatst in de inrichting of afdeling met het beheer waarvan hij is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel12
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '17.2'
    text: De directeur wijst iedere jeugdige een kamer toe.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel17
  - number: '17.3'
    text: |-
      De directeur kan onderdelen van de inrichting of de afdeling aanwijzen voor de onderbrenging van jeugdigen die een
      bijzondere opvang of behandeling in de zin van [artikel 8, derde lid][ref1], behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel8
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '8'
        hoofdstuk: III
  - number: '17.4'
    text: |-
      De directeur bepaalt de criteria waaraan de jeugdige moet voldoen om voor onderbrenging als bedoeld in het derde
      lid in aanmerking te komen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel17
  - number: '17.5'
    text: Onze Minister stelt regels omtrent de eisen waaraan een kamer als bedoeld in het tweede lid moet voldoen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel17
  - number: 17a.1
    text: |-
      De directeur kan de tenuitvoerlegging van een machtiging als bedoeld in [artikel 6.1.2 van de Jeugdwet][ref1]
      schorsen, als de tenuitvoerlegging niet langer nodig is om te voorkomen dat de jeugdige zich aan de zorg die hij
      nodig heeft onttrekt of daaraan door anderen wordt onttrokken. De schorsing kan worden ingetrokken indien blijkt
      dat de tenuitvoerlegging nodig is om te voorkomen dat de jeugdige zich aan de zorg die hij nodig heeft onttrekt of
      daaraan door anderen wordt onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
  - number: 17a.2
    text: |-
      Een besluit tot schorsing of intrekking wordt niet genomen dan nadat de directeur daaromtrent overleg heeft
      gepleegd met de betrokken gecertificeerde instelling en de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel17a
  - number: 17a.3
    text: |-
      De directeur doet van een besluit tot schorsing of intrekking mededeling aan de gecertificeerde instelling en de
      raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel17a
  - number: '18.1'
    text: 'De betrokkene heeft het recht een met redenen omkleed bezwaarschrift in te dienen tegen de beslissing:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel18
  - number: 18.1.a
    text: |-
      tot verlenging van de termijn, bedoeld in [artikel 13, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel13
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '13'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 18.1.b
    text: |-
      tot plaatsing of overplaatsing of overbrenging als bedoeld in
      [artikel 12, eerste onderscheidenlijk achtste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel12
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 18.1.c
    text: |-
      tot plaatsing of overplaatsing op een afdeling als bedoeld in de [artikelen 22a][ref1], [22b][ref2], [22c][ref3]
      en [22d][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel22b
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel22c
      [ref4]: https://wetten.overheid.nl/BWBR0011756#Artikel22d
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 22a
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: 22b
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011756
        artikel: 22c
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0011756
        artikel: 22d
        hoofdstuk: VI
        paragraaf: '1'
  - number: 18.1.d
    text: |-
      tot het gebruiken van geweld of aanwenden van vrijheidsbeperkende middelen, bedoeld in
      [artikel 40, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel40
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '40'
        hoofdstuk: VII
  - number: '18.2'
    text: |-
      Op de wijze van indiening is [artikel 66, tweede, zesde en zevende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel66
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '66'
        hoofdstuk: XIII
  - number: '18.3'
    text: |-
      De selectiefunctionaris stelt de betrokkene in de gelegenheid schriftelijk of mondeling diens bezwaarschrift toe te
      lichten, tenzij hij het aanstonds kennelijk niet-ontvankelijk, kennelijk ongegrond of kennelijk gegrond acht.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel18
  - number: '18.4'
    text: |-
      De selectiefunctionaris stelt de indiener van het bezwaarschrift binnen zes weken van zijn met redenen omklede
      beslissing schriftelijk en zoveel mogelijk in een voor deze begrijpelijke taal op de hoogte. Hierbij wijst hij hem
      op de mogelijkheid van het instellen van beroep, bedoeld in [hoofdstuk XV][ref1], alsmede de termijnen waarbinnen
      en de wijze waarop dit gedaan moet worden.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011756
        hoofdstuk: XV
  - number: '18.5'
    text: |-
      Het indienen van een bezwaarschrift blijft achterwege, indien de betrokkene in de gelegenheid is gesteld zijn
      bezwaren tegen een door de selectiefunctionaris voorgenomen en hem betreffende beslissing als bedoeld in het eerste
      lid kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel18
  - number: '19.1'
    text: |-
      De betrokkene heeft het recht bij de selectiefunctionaris een met redenen omkleed verzoekschrift in te dienen
      strekkende tot plaatsing in dan wel overplaatsing naar een bepaalde inrichting of afdeling.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel19
  - number: '19.2'
    text: |-
      Met een verzoekschrift wordt gelijkgesteld een akkoordverklaring van de jeugdige met het selectieadvies van de
      directeur van de inrichting.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel19
  - number: '19.3'
    text: |-
      De [artikel 66, tweede en zesde lid][ref1], en [18, derde en vierde lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel18
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '66'
        hoofdstuk: XIII
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '19.4'
    text: |-
      Indien het verzoekschrift, bedoeld in het eerste lid, is afgewezen, kan twee maanden na de ontvangst van deze
      afwijzing opnieuw een verzoekschrift worden ingediend.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel19
  - number: '20.1'
    text: |-
      De directeur van een inrichting stelt uiterlijk binnen drie weken na de binnenkomst van de jeugdige een
      perspectiefplan voor hem vast. Alvorens het plan vast te stellen, overlegt hij met de jeugdige. De eerste volzin is
      niet van toepassing op jeugdigen die in de inrichting een vervangende jeugddetentie ondergaan van een kortere duur
      dan drie weken.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel20
  - number: '20.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de eisen waaraan een perspectiefplan ten minste
      moet voldoen, de voorschriften die bij wijziging daarvan in acht genomen moeten worden en de periodieke evaluatie
      van het perspectiefplan.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel20
  - number: '22'
    text: |-
      In inrichtingen verblijven jeugdigen in groepen en nemen deel aan gemeenschappelijke activiteiten gedurende ten
      minste 77 uren per week waarvan ten minste acht en een half uren per dag. De jeugdigen houden zich gedurende
      de voor de nachtrust bestemde uren in hun kamer op, tenzij zij als onderdeel van het regime van de inrichting
      deelnemen aan meerdaagse activiteiten buiten de inrichting.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22
  - number: 22a.1
    text: |-
      Op een door Onze Minister als zodanig aangewezen afdeling voor intensieve zorg nemen jeugdigen deel aan
      gemeenschappelijke activiteiten gedurende ten minste zes uren per dag door de week en gedurende ten minste vier
      uren per dag in het weekeinde.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22a
  - number: 22a.2
    text: 'Een jeugdige kan op een afdeling voor intensieve zorg worden geplaatst indien:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22a
  - number: 22a.2.a
    text: de jeugdige in een crisissituatie verkeert,
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22a
  - number: 22a.2.b
    text: de crisissituatie vermoedelijk gevolg is van een psychiatrische stoornis of een persoonlijkheidsstoornis, en
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22a
  - number: 22a.2.c
    text: |-
      de jeugdige ten gevolge van het gestelde onder a en b tijdelijk niet in een inrichting kan verblijven met een
      regime als bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel22
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '22'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 22a.3
    text: |-
      De directeur bepaalt telkens binnen ten hoogste zes weken en na advies van een psychiater of de noodzaak tot
      voortzetting van het verblijf op de afdeling voor intensieve zorg nog bestaat.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22a
  - number: 22a.4
    text: |-
      Een jeugdige die op een afdeling voor intensieve zorg is geplaatst, verblijft, in afwijking van
      [artikel 1, onder v][ref1], in een groep van ten minste twee personen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
        hoofdstuk: I
  - number: 22b.1
    text: |-
      Op een door Onze Minister als zodanig aangewezen afdeling voor intensieve behandeling nemen jeugdigen deel aan
      gemeenschappelijke activiteiten gedurende ten minste zes uren per dag door de week en gedurende ten minste vier
      uren per dag in het weekeinde.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22b
  - number: 22b.2
    text: 'Een jeugdige kan op een afdeling voor intensieve behandeling worden geplaatst indien:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22b
  - number: 22b.2.a
    text: de jeugdige extra begeleiding behoeft,
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22b
  - number: 22b.2.b
    text: de behoefte aan extra begeleiding het gevolg is van een psychiatrische stoornis of een persoonlijkheidsstoornis, en
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22b
  - number: 22b.2.c
    text: |-
      de jeugdige ten gevolge van het gestelde onder a en b tijdelijk niet in een inrichting kan verblijven met een
      regime als bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel22
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '22'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 22b.3
    text: |-
      De directeur bepaalt telkens binnen ten hoogste drie maanden en na advies van een psychiater of de noodzaak tot
      voortzetting van het verblijf op de afdeling voor intensieve behandeling nog bestaat.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22b
  - number: 22b.4
    text: |-
      Een jeugdige die op een afdeling voor intensieve behandeling is geplaatst, verblijft, in afwijking van
      [artikel 1, onder v][ref1], in een groep van ten minste twee personen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
        hoofdstuk: I
  - number: 22c.1
    text: |-
      Op een door Onze Minister als zodanig aangewezen individuele trajectafdeling nemen jeugdigen deel aan
      gemeenschappelijke activiteiten gedurende ten minste zes uren per dag door de week en ten minste vier uren in het
      weekeinde.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22c
  - number: 22c.2
    text: 'Een jeugdige kan op een individuele trajectafdeling worden geplaatst indien:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22c
  - number: 22c.2.a
    text: de jeugdige extra individuele begeleiding behoeft,
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22c
  - number: 22c.2.b
    text: de behoefte aan extra individuele begeleiding het gevolg is van een persoonlijkheidsstoornis en
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22c
  - number: 22c.2.c
    text: |-
      de jeugdige ten gevolge van het gestelde onder a en b niet in een inrichting kan verblijven met een regime als
      bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel22
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '22'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 22c.3
    text: |-
      Het verblijf van de jeugdige is gericht op de bevordering van de terugkeer in een regime als bedoeld in
      [artikel 22][ref1] of de terugkeer van de jeugdige in de samenleving.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel22
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '22'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 22c.4
    text: |-
      Een jeugdige die op een individuele trajectafdeling is geplaatst, verblijft, in afwijking van artikel 1, onder v,
      in een groep van tenminste twee personen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22c
  - number: 22c.5
    text: |-
      De directeur van de inrichting waar de jeugdige op de individuele trajectafdeling is geplaatst, bepaalt telkens
      binnen ten hoogste zes maanden en na het advies te hebben ingewonnen van de adviescommissie of de noodzaak tot
      voortzetting van het verblijf op de afdeling voor individuele trajectafdeling nog bestaat.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22c
  - number: 22c.6
    text: |-
      Onze Minister stelt nadere regels omtrent de taak, samenstelling en werkwijze van de adviescommissie, bedoeld in
      het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22c
  - number: 22d.1
    text: |-
      Onze Minister kan bepalen dat een jeugdige aan wie de maatregel van plaatsing in een inrichting voor jeugdigen is
      opgelegd, voor een periode van ten hoogste zeven weken ter observatie wordt geplaatst in een daartoe aangewezen
      inrichting.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22d
  - number: 22d.2
    text: |-
      Onze Minister kan, indien dit noodzakelijk is, de termijn genoemd in het eerste lid met ten hoogste vier weken
      verlengen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22d
  - number: 22d.3
    text: |-
      De jeugdige keert na het verstrijken van de observatietermijn terug naar de inrichting waar hij voorheen was
      geplaatst, tenzij uit de observatierapportage blijkt dat overplaatsing naar een andere inrichting aangewezen is.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22d
  - number: 22d.4
    text: |-
      De plaatsing ter observatie kan op verzoek van de directeur van de inrichting waar de jeugdige verblijft
      plaatsvinden in de volgende gevallen:
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22d
  - number: 22d.4.a
    text: indien daartoe uit het oogpunt van de behandeling van de jeugdige aanleiding bestaat;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22d
  - number: 22d.4.b
    text: |-
      indien deze noodzakelijk wordt geacht met het oog op de opstelling van een advies ten behoeve van verlenging van
      de maatregel.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel22d
  - number: '23.1'
    text: |-
      De directeur kan een jeugdige gedurende ten hoogste een week na zijn binnenkomst in de inrichting uitsluiten van
      het verblijf in een groep en zijn deelname aan gemeenschappelijke activiteiten beperken tot ten minste zes uren per
      dag, indien dit noodzakelijk is:
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel23
  - number: 23.1.a
    text: ter voorbereiding van de beslissing omtrent onderbrenging van de jeugdige in de groep;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel23
  - number: 23.1.b
    text: ten behoeve van de vaststelling van een perspectiefplan.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel23
  - number: '23.2'
    text: |-
      De directeur kan de periode, bedoeld in het eerste lid, tweemaal met ten hoogste een week verlengen, indien hij na
      overleg met een gedragsdeskundige tot het oordeel is gekomen dat de noodzaak hiertoe nog bestaat.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel23
  - number: '23.3'
    text: |-
      De directeur kan de jeugdige gedurende ten hoogste een week uitsluiten van verblijf in de groep of beperken in de
      deelname aan gemeenschappelijke activiteiten, indien dit noodzakelijk is in het belang van:
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel23
  - number: 23.3.a
    text: zijn geestelijke of lichamelijke ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel23
  - number: 23.3.b
    text: de uitvoering van het hem betreffende perspectiefplan.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel23
  - number: '23.4'
    text: |-
      De directeur kan de uitsluiting of beperking, bedoeld in het derde lid, telkens met ten hoogste een week verlengen,
      indien hij na overleg met een gedragsdeskundige tot het oordeel is gekomen dat de noodzaak hiertoe nog bestaat.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel23
  - number: '23.5'
    text: |-
      De directeur houdt van de oplegging van de maatregel van uitsluiting, bedoeld in het eerste en derde lid, en de
      verlenging, bedoeld in het tweede en vierde lid, aantekening in een register.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel23
  - number: 23a.1
    text: |-
      Een personeelslid of medewerker kan de jeugdige voor een maximale aaneengesloten duur van een uur uitsluiten van
      het verblijf in de groep of van gemeenschappelijke activiteiten indien het gedrag van de jeugdige verstorend is
      voor de rust in de groep, en in verband daarmee de kortdurende uitsluiting ertoe bijdraagt dat het gedrag van de
      jeugdige gunstig wordt beïnvloed.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel23a
  - number: 23a.2
    text: |-
      Een uitsluiting als bedoeld in het eerste lid kan op een dag herhaaldelijk worden toegepast, met dien verstande dat
      de totale duur van de uitsluitingen de twee uren per etmaal niet overstijgt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel23a
  - number: 23a.3
    text: |-
      De directeur houdt van de oplegging van de maatregel van uitsluiting, bedoeld in het eerste lid, en de herhaalde
      toepassing, bedoeld in het tweede lid, aantekening in een register. De directeur stelt aan de hand van dit register
      elke drie maanden de commissie van toezicht van de toepassing van de maatregel op de hoogte en treedt daarover met
      de commissie in overleg.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel23a
  - number: '24.1'
    text: |-
      De directeur kan de jeugdige uitsluiten van het verblijf in de groep of de deelname aan een of meer activiteiten
      behoudens het dagelijks verblijf in de buitenlucht, bedoeld in [artikel 53, vijfde lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel53
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '53'
        hoofdstuk: IX
        paragraaf: '2'
  - number: 24.1.a
    text: |-
      indien dit in het belang van de orde of de veiligheid van de inrichting dan wel van een ongestoorde
      tenuitvoerlegging van de vrijheidsbeneming noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel24
  - number: 24.1.b
    text: indien dit ter bescherming van de betrokken jeugdige noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel24
  - number: 24.1.c
    text: in geval van ziekmelding of ziekte van de betrokken jeugdige;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel24
  - number: 24.1.d
    text: indien de jeugdige hierom verzoekt en de directeur dit verzoek redelijk en uitvoerbaar oordeelt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel24
  - number: '24.2'
    text: |-
      De uitsluiting ingevolge het eerste lid, onder a of b, duurt ten hoogste twee dagen. De directeur kan deze
      uitsluiting telkens voor ten hoogste twee dagen verlengen, indien hij tot het oordeel is gekomen dat de noodzaak
      tot uitsluiting nog bestaat.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel24
  - number: '24.3'
    text: |-
      Indien onverwijlde tenuitvoerlegging van de uitsluiting, bedoeld in het eerste lid, onder a of b, geboden is, kan
      een personeelslid of medewerker de maatregel, bedoeld in het eerste lid, voor een periode van ten hoogste vijftien
      uren treffen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel24
  - number: '24.4'
    text: |-
      De maatregel van uitsluiting van het verblijf in de groep of van de deelname aan een of meer activiteiten wordt ten
      uitvoer gelegd op de kamer van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel24
  - number: '24.5'
    text: |-
      De directeur houdt van de oplegging van de maatregel van uitsluiting, bedoeld in het eerste en tweede lid, en
      de verlenging, bedoeld in het tweede lid, aantekening in een register. Bij toepassing van het derde lid wordt de
      aantekening door het betrokken personeelslid of medewerker gemaakt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel24
  - number: '25.1'
    text: |-
      De directeur is bevoegd een jeugdige in afzondering te plaatsen op de gronden, genoemd in
      [artikel 24, eerste lid][ref1]. De afzondering op de gronden van [artikel 24, eerste lid, onder a of b][ref2],
      duurt ten hoogste één dag voor jeugdigen tot zestien jaar en ten hoogste twee dagen voor jeugdigen van zestien jaar
      en ouder.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel24
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '24'
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '24'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '25.2'
    text: |-
      De afzondering wordt ten uitvoer gelegd in een afzonderingscel of in een andere verblijfsruimte. Gedurende het
      verblijf in afzondering neemt de jeugdige niet deel aan activiteiten, voor zover de directeur niet anders bepaalt
      en behoudens het dagelijks verblijf in de buitenlucht, bedoeld in [artikel 53, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel53
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '53'
        hoofdstuk: IX
        paragraaf: '2'
  - number: '25.3'
    text: |-
      De directeur kan de afzondering, bedoeld in het eerste lid, op de grond van
      [artikel 24, eerste lid, onder a of b][ref1], eenmaal voor ten hoogste één dag voor jeugdigen tot zestien jaar en
      ten hoogste twee dagen voor jeugdigen van zestien jaar en ouder verlengen, indien hij tot het oordeel is gekomen
      dat de noodzaak tot afzondering nog bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel24
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '24'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '25.4'
    text: |-
      Indien onverwijlde tenuitvoerlegging van de afzondering op de grond van
      [artikel 24, eerste lid, onder a of b][ref1], geboden is, kan een personeelslid of medewerker een jeugdige voor een
      periode van ten hoogste vijftien uren in afzondering plaatsen. De directeur wordt van deze plaatsing onverwijld op
      de hoogte gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel24
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '24'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '25.5'
    text: |-
      De directeur draagt zorg dat tijdens de afzondering het nodige contact tussen personeelsleden en medewerkers van
      de inrichting en de jeugdige wordt gewaarborgd en naar aard en frequentie op de situatie van de jeugdige wordt
      afgestemd.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel25
  - number: '25.6'
    text: |-
      De directeur draagt zorg dat ingeval de afzondering in een afzonderingscel langer dan vierentwintig uren duurt,
      de commissie van toezicht en de aan de inrichting verbonden arts of diens vervanger alsmede de ouders of voogd,
      stiefouder of pleegouders dan wel de gecertificeerde instelling terstond hiervan in kennis worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel25
  - number: '25.7'
    text: |-
      Onze Minister stelt nadere regels omtrent het verblijf in en de inrichting van de afzonderingscel. Deze betreffen
      in elk geval de rechten die tijdens het verblijf in de afzonderingscel aan de jeugdige toekomen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel25
  - number: '25.8'
    text: |-
      De directeur houdt van de oplegging van de maatregel van afzondering, bedoeld in het eerste lid, en de verlenging
      daarvan, bedoeld in het derde lid, aantekening in een register. Bij toepassing van het vierde lid wordt de
      aantekening door het betrokken personeelslid of medewerker gemaakt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel25
  - number: 25a.1
    text: |-
      De directeur kan, indien dit ter bescherming van de geestelijke of lichamelijke toestand van de jeugdige
      noodzakelijk is, bepalen dat de jeugdige die in een afzonderingscel verblijft, dag en nacht door middel van een
      camera wordt geobserveerd.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel25a
  - number: 25a.2
    text: |-
      Alvorens hij hiertoe beslist, wint hij het advies in van een gedragsdeskundige onderscheidenlijk de
      inrichtingsarts, tenzij dit advies niet kan worden afgewacht. In dat geval wint de directeur het advies zo spoedig
      mogelijk na zijn beslissing in.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel25a
  - number: '26.1'
    text: |-
      Indien de tenuitvoerlegging van de afzondering in de inrichting of afdeling waar zij is opgelegd op ernstige
      bezwaren stuit, kan zij in een andere inrichting of afdeling worden ondergaan.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel26
  - number: '26.2'
    text: |-
      Indien de directeur van oordeel is dat van de in het eerste lid bedoelde omstandigheid sprake is, plaatst hij in
      overeenstemming met de selectiefunctionaris de jeugdige over.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel26
  - number: '26.3'
    text: |-
      Over de verlenging van de afzondering waarvan de tenuitvoerlegging plaatsvindt in een andere inrichting
      of afdeling, beslist de directeur van de inrichting of de afdeling waarin de afzondering was opgelegd in
      overeenstemming met de selectiefunctionaris en gehoord de directeur van de inrichting of afdeling waar de
      tenuitvoerlegging van de afzondering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel26
  - number: '26.4'
    text: |-
      Onze Minister stelt nadere regels omtrent de procedure van plaatsing, overplaatsing en verlenging van de
      afzondering ingevolge het tweede onderscheidenlijk het derde lid.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel26
  - number: '26.5'
    text: |-
      De ouders of voogd, stiefouder of pleegouders dan wel de gecertificeerde instelling worden van de beslissing,
      bedoeld in het eerste lid, onverwijld op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel26
  - number: '26.6'
    text: |-
      De directeur houdt van de tenuitvoerlegging van de maatregel van afzondering in een andere inrichting, bedoeld in
      het eerste lid en de verlenging daarvan, bedoeld in het derde lid, aantekening in een register.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel26
  - number: '27.1'
    text: |-
      De directeur is bevoegd een jeugdige, na overleg met een gedragsdeskundige en de selectiefunctionaris, tijdelijk
      over te plaatsen op de gronden, genoemd in [artikel 24, eerste lid, onder a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel24
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '24'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '27.2'
    text: |-
      De directeur neemt de beslissing tot tijdelijke plaatsing van de jeugdige die met een machtiging als bedoeld in
      [artikel 6.2.2, tweede lid, van de Jeugdwet][ref1] in een inrichting is geplaatst niet dan nadat hij daarvoor
      toestemming van de gecertificeerde instelling heeft verkregen. Deze toestemming wordt niet gegeven zonder
      machtiging van de kinderrechter in de daartoe aangewezen gevallen. Voor de jeugdige aan wie de maatregel van
      plaatsing in een inrichting voor jeugdigen is opgelegd is de toestemming van Onze Minister noodzakelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
  - number: '27.3'
    text: |-
      De tijdelijke plaatsing duurt ten hoogste veertien dagen. De directeur kan deze tijdelijke plaatsing eenmaal
      voor ten hoogste veertien dagen verlengen, indien hij na overleg met een gedragsdeskundige, de directeur van de
      inrichting waar de tijdelijke plaatsing ten uitvoer wordt gelegd en de selectiefunctionaris tot het oordeel is
      gekomen dat de noodzaak en de mogelijkheden hiertoe nog bestaan.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel27
  - number: '27.4'
    text: |-
      Na de tenuitvoerlegging van de tijdelijke plaatsing dan wel de verlenging hiervan wordt de jeugdige teruggeplaatst
      in de inrichting waarin de maatregel werd opgelegd.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel27
  - number: '27.5'
    text: |-
      De ouders of voogd, stiefouder of pleegouders dan wel de gecertificeerde instelling worden van een beslissing als
      bedoeld in het eerste en derde lid, onverwijld op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel27
  - number: '28.1'
    text: |-
      De directeur stelt een jeugdige in de gelegenheid onder door hem te stellen voorwaarden de inrichting te verlaten
      teneinde een gerechtelijke procedure bij te wonen:
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel28
  - number: 28.1.a
    text: indien de jeugdige krachtens wettelijk voorschrift verplicht is voor een rechter of bestuursorgaan te verschijnen;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel28
  - number: 28.1.b
    text: ter voldoening aan een oproep van de rechter.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel28
  - number: '28.2'
    text: |-
      Met het oog op het verlaten van de inrichting, bedoeld in het eerste lid, kan de directeur aan daartoe door hem
      aangewezen personeelsleden of medewerkers bevelen dat de betrokken persoon naar de daartoe bestemde plaats wordt
      overgebracht.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel28
  - number: '28.3'
    text: |-
      Onze Minister kan nadere regels stellen omtrent de wijze waarop het vervoer van de jeugdige ten behoeve van het
      bijwonen van een gerechtelijke procedure, bedoeld in het eerste lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel28
  - number: '29.1'
    text: |-
      De directeur stelt een jeugdige die in een inrichting verblijft op grond van de tenuitvoerlegging van een
      machtiging in een geval als bedoeld in [artikel 6.2.2, tweede lid, van de Jeugdwet][ref1] in de gelegenheid de
      inrichting ten minste eenmaal per zes weken voor een periode van ten minste twaalf uren te verlaten bij wijze van
      verlof. [Artikel 30, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel30
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '30'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '29.2'
    text: 'De directeur kan van het in het eerste lid bepaalde afwijken, indien naar zijn redelijk oordeel:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel29
  - number: 29.2.a
    text: de mogelijkheid voor de jeugdige ontbreekt om het verlof op verantwoorde wijze door te brengen;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel29
  - number: 29.2.b
    text: de jeugdige een gevaar voor zichzelf of de omgeving oplevert.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel29
  - number: '29.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het verlaten van de
      inrichting bij wijze van verlof. Deze betreffen in elk geval de criteria waaraan een jeugdige moet voldoen om voor
      het verlof in aanmerking te komen, de bevoegdheid tot en de wijze van verlening, weigering, beperking en intrekking
      alsmede de duur en frequentie van het verlof en de voorwaarden die aan het verlof kunnen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel29
  - number: '30.1'
    text: |-
      De directeur kan met machtiging van Onze Minister een jeugdige die in een inrichting verblijft op grond
      van de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel, anders dan bedoeld in
      [artikel 29, eerste lid][ref1], in de gelegenheid stellen de inrichting te verlaten bij wijze van verlof.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel29
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '29'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '30.2'
    text: |-
      Het verlaten van de inrichting, bedoeld in het eerste lid, schort de tenuitvoerlegging van de vrijheidsstraf of
      vrijheidsbenemende maatregel niet op.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel30
  - number: '30.3'
    text: |-
      Als algemene voorwaarde geldt dat de jeugdige zich tijdens het verlof niet aan enig misdrijf zal schuldig maken. De
      directeur kan aan het verlof bijzondere voorwaarden, het gedrag van de jeugdige betreffende, verbinden.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel30
  - number: '30.4'
    text: |-
      De directeur kan het verlof intrekken, indien dit noodzakelijk is met het oog op de bescherming van de maatschappij
      tegen de gevaarlijkheid van de jeugdige voor de veiligheid van anderen dan de jeugdige of de algemene veiligheid
      van personen of goederen of indien de jeugdige een bepaalde voorwaarde niet nakomt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel30
  - number: '30.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het verlaten van
      de inrichting bij wijze van verlof. Deze betreffen in elk geval de criteria waaraan een jeugdige moet voldoen
      om voor het verlof in aanmerking te komen, de bevoegdheid tot en de wijze van verlening, weigering, beperking
      en intrekking alsmede de duur, frequentie en het doel van het verlof en de voorwaarden die aan het verlof kunnen
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel30
  - number: '32'
    text: |-
      Het recht van de jeugdige op onaantastbaarheid van zijn lichaam, zijn kleding en de van zijn lichaam afgescheiden
      stoffen en zijn kamer kan overeenkomstig de bepalingen van dit hoofdstuk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel32
  - number: '33.1'
    text: |-
      De directeur stelt bij binnenkomst in en bij het verlaten van de inrichting, bij de tenuitvoerlegging van een bevel
      als bedoeld in [artikel 2, eerste lid, aanhef, van de Wet DNA-onderzoek bij veroordeelden][ref1] en voor zover dit
      anderszins noodzakelijk is, de identiteit van de jeugdige vast.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '2'
  - number: '33.2'
    text: |-
      De directeur stelt tevens voorafgaand aan en na afloop van bezoek de identiteit van de jeugdige vast, tenzij een
      personeelslid of medewerker op de jeugdige voortdurend en persoonlijk toezicht houdt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel33
  - number: '33.3'
    text: |-
      Het vaststellen van de identiteit van de jeugdige omvat bij de eerste opname in de inrichting
      het vragen naar zijn naam, voornamen, geboorteplaats en geboortedatum, het adres waarop hij in de
      basisregistratie personen is ingeschreven en het adres van zijn feitelijke verblijfplaats buiten
      de inrichting. Het omvat tevens het nemen van een of meer van zijn vingerafdrukken. In de gevallen
      waarin van de gedetineerde eerder overeenkomstig het [Wetboek van Strafvordering][ref1] of de
      [Vreemdelingenwet 2000][ref2] vingerafdrukken zijn genomen en verwerkt, omvat het vaststellen van zijn
      identiteit bij binnenkomst in de inrichting tevens een vergelijking van zijn vingerafdrukken met de
      van hem verwerkte vingerafdrukken. In de andere gevallen omvat het vaststellen van zijn identiteit een
      onderzoek van zijn identiteitsbewijs, bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref3].
      [Artikel 29c, tweede lid, van het Wetboek van Strafvordering][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0011823
      [ref3]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel29c
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0011823
      - id: ref3
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 29c
  - number: '33.4'
    text: |-
      Het vaststellen van de identiteit van de jeugdige omvat in de andere gevallen dan de eerste opname in de
      inrichting het nemen van een of meer vingerafdrukken en het vergelijken van die vingerafdrukken met de
      van hem bij binnenkomst genomen vingerafdrukken. Bij de tenuitvoerlegging van een bevel als bedoeld in
      [artikel 2, eerste lid, aanhef, van de Wet DNA-onderzoek][ref1] bij veroordeelden worden van de jeugdige tevens een
      of meer vingerafdrukken overeenkomstig het [Wetboek van Strafvordering][ref2] genomen en verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001903
  - number: '33.5'
    text: |-
      De directeur is bevoegd van de jeugdige een of meer foto’s te nemen. De foto’s kunnen worden gebruikt voor het
      vervaardigen van een legitimatiebewijs en voor het voorkomen, opsporen, vervolgen en berechten van strafbare
      feiten. De jeugdige is verplicht het legitimatiebewijs bij zich te dragen en op verzoek van een ambtenaar of
      medewerker te tonen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel33
  - number: '33.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor het verwerken van de persoonsgegevens,
      bedoeld in het derde tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel33
  - number: '34.1'
    text: |-
      De directeur is bevoegd een jeugdige bij binnenkomst of bij het verlaten van de inrichting, voorafgaand aan of na
      afloop van bezoek, dan wel, indien dit anderszins noodzakelijk is in het belang van de handhaving van de orde of de
      veiligheid in de inrichting, aan zijn lichaam of aan zijn kleding te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel34
  - number: '34.2'
    text: |-
      Het onderzoek aan het lichaam van de jeugdige omvat mede het uitwendig schouwen van de openingen en holten van het
      lichaam van de jeugdige. Het onderzoek aan de kleding van de jeugdige omvat mede het onderzoek van de voorwerpen
      die de jeugdige bij zich draagt of met zich mee voert.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel34
  - number: '34.3'
    text: |-
      Het onderzoek aan het lichaam van de jeugdige wordt op besloten plaatsen en, voor zover mogelijk, door personen van
      hetzelfde geslacht als de jeugdige verricht.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel34
  - number: '34.4'
    text: |-
      Indien bij een onderzoek aan het lichaam of de kleding voorwerpen worden aangetroffen die niet in het bezit van de
      jeugdige mogen zijn, en, voor zover het onderzoek betrekking heeft op de openingen of holten van het lichaam van
      de jeugdige, deze voorwerpen zonder het gebruik van hulpmiddelen daaruit kunnen worden verwijderd, is de directeur
      bevoegd deze in beslag te nemen. Hij draagt zorg dat deze voorwerpen, hetzij onder afgifte van een bewijs van
      ontvangst ten behoeve van de jeugdige op diens kosten worden bewaard, hetzij met toestemming van de jeugdige worden
      vernietigd, hetzij aan een opsporingsambtenaar ter hand worden gesteld met het oog op de voorkoming of de opsporing
      van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel34
  - number: '35.1'
    text: |-
      De directeur kan, indien dit noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in
      de inrichting dan wel in verband met de beslissing tot plaatsing of overplaatsing dan wel in verband met de
      toestemming tot het verlaten van de inrichting, een jeugdige verplichten urine af te staan ten behoeve van een
      onderzoek van die urine op aanwezigheid van gedragsbeïnvloedende middelen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel35
  - number: '35.2'
    text: |-
      Onze Minister stelt nadere regels vast omtrent de wijze van uitvoering van het urineonderzoek. Deze regels
      betreffen in elk geval het recht van de jeugdige om de uitslag te vernemen en om voor eigen rekening een hernieuwd
      onderzoek van de afgestane urine te laten plaatsvinden. [Artikel 34, derde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel34
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '34'
        hoofdstuk: VII
  - number: '36.1'
    text: |-
      De directeur kan bepalen dat een jeugdige in het lichaam wordt onderzocht, indien dit noodzakelijk is ter afwending
      van ernstig gevaar voor de handhaving van de orde of de veiligheid in de inrichting dan wel voor de gezondheid
      van de jeugdige. Het onderzoek in het lichaam wordt verricht door een arts of, in diens opdracht, door een
      verpleegkundige.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel36
  - number: '36.2'
    text: |-
      Een personeelslid of medewerker van de inrichting waar de jeugdige verblijft kan bij dringende noodzakelijkheid een
      beslissing als bedoeld in het eerste lid nemen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel36
  - number: '36.3'
    text: |-
      Indien bij het onderzoek in het lichaam voorwerpen worden aangetroffen die niet in het bezit van de jeugdige mogen
      zijn, en deze voorwerpen door de arts of verpleegkundige uit het lichaam kunnen worden verwijderd, is de directeur
      bevoegd deze in beslag te nemen. [Artikel 34, vierde lid][ref1], laatste volzin, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel34
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '34'
        hoofdstuk: VII
  - number: '37.1'
    text: |-
      De directeur kan een jeugdige verplichten te gedogen dat ten aanzien van hem een bepaalde geneeskundige handeling
      wordt verricht, indien die handeling naar het oordeel van een arts volstrekt noodzakelijk is ter afwending van
      gevaar voor de gezondheid of veiligheid van de jeugdige of van anderen. De handeling wordt verricht door een arts
      of, in diens opdracht, door een verpleegkundige.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel37
  - number: '37.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste lid. Deze
      regels betreffen in ieder geval de melding en de registratie van de geneeskundige handeling, alsmede de taak van
      de verantwoordelijke arts indien de geneeskundige handeling volstrekt noodzakelijk is ter afwending van gevaar
      voortvloeiend uit de geestelijke stoornis van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel37
  - number: '38.1'
    text: |-
      De directeur kan bepalen dat een jeugdige tijdens de afzondering door bevestiging van mechanische middelen
      aan zijn lichaam voor een periode van ten hoogste twaalf uren voor jeugdigen tot zestien jaar en ten hoogste
      vierentwintig uren voor jeugdigen van zestien jaar en ouder in zijn bewegingsvrijheid wordt beperkt, indien die
      beperking noodzakelijk is ter afwending van een van de jeugdige uitgaand ernstig gevaar voor diens gezondheid of de
      veiligheid van anderen dan de jeugdige. De directeur stelt de arts of diens vervanger en de commissie van toezicht
      van de bevestiging onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel38
  - number: '38.2'
    text: |-
      Indien onverwijlde tenuitvoerlegging van de maatregel, bedoeld in het eerste lid, geboden is, kan een personeelslid
      of medewerker deze voor een periode van ten hoogste vier uren ten uitvoer leggen. De directeur en de arts of diens
      vervanger en de commissie van toezicht worden hiervan onverwijld in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel38
  - number: '38.3'
    text: Onze Minister stelt nadere regels omtrent de bevestiging van mechanische middelen aan het lichaam.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel38
  - number: '39.1'
    text: |-
      De directeur is bevoegd de kamer van een jeugdige op de aanwezigheid van voorwerpen die niet in zijn bezit mogen
      zijn te onderzoeken:
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel39
  - number: 39.1.a
    text: |-
      indien dit onderzoek plaatsvindt in het kader van het algemeen toezicht op de aanwezigheid van verboden voorwerpen
      in de kamers van jeugdigen;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel39
  - number: 39.1.b
    text: |-
      indien dit anderszins noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in de
      inrichting.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel39
  - number: '39.2'
    text: |-
      [Artikel 34, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel34
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '34'
        hoofdstuk: VII
  - number: '39.3'
    text: |-
      De directeur is bevoegd de kamer van een jeugdige te onderzoeken op de aanwezigheid van voorwerpen waarop
      vermoedelijk celmateriaal van de jeugdige aanwezig is en deze voorwerpen in beslag te nemen, indien de officier van
      justitie hem op grond van [artikel 6, eerste lid, van de Wet DNA-onderzoek bij veroordeelden][ref1] een opdracht
      tot het in beslag nemen van deze voorwerpen heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel6
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '6'
  - number: '40.1'
    text: |-
      De directeur is bevoegd jegens een jeugdige geweld te gebruiken dan wel vrijheidsbeperkende middelen aan te wenden,
      voor zover zulks noodzakelijk is met het oog op een van de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel40
  - number: 40.1.a
    text: de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel40
  - number: 40.1.b
    text: de uitvoering van een door de directeur genomen beslissing;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel40
  - number: 40.1.c
    text: de voorkoming van het zich onttrekken door de jeugdige aan het op hem uitgeoefende toezicht;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel40
  - number: 40.1.d
    text: |-
      de uitvoering van een ingevolge het [Wetboek van Strafvordering][ref1] of de
      [Wet DNA-onderzoek bij veroordeelden][ref2] door de officier van justitie of de rechter-commissaris genomen
      beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0017212
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0017212
  - number: '40.2'
    text: |-
      De selectiefunctionaris of een daartoe door hem aangewezen personeelslid of medewerker is bevoegd jegens een
      jeugdige geweld te gebruiken of vrijheidsbeperkende middelen aan te wenden voor zover zulks noodzakelijk is met het
      oog op een van de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel40
  - number: 40.2.a
    text: de uitvoering van een door hem genomen beslissing;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel40
  - number: 40.2.b
    text: de voorkoming van het zich onttrekken van de jeugdige aan het op hem uitgeoefende toezicht.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel40
  - number: '40.3'
    text: |-
      Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf. Degene die geweld heeft gebruikt maakt
      hiervan onverwijld een schriftelijk verslag en doet dit verslag onverwijld aan de directeur onderscheidenlijk de
      selectiefunctionaris toekomen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel40
  - number: '40.4'
    text: Onze Minister stelt nadere regels omtrent het gebruik van geweld en de aanwending van vrijheidsbeperkende middelen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel40
  - number: '41.1'
    text: |-
      De jeugdige heeft, behoudens de overeenkomstig het tweede tot en met het vierde lid te stellen beperkingen, het
      recht brieven en stukken per post te verzenden en te ontvangen. De hieraan verbonden kosten komen, tenzij de
      directeur anders bepaalt, voor rekening van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel41
  - number: '41.2'
    text: |-
      De directeur is bevoegd enveloppen of andere poststukken, afkomstig van of bestemd voor jeugdigen, op de
      aanwezigheid van bijgesloten voorwerpen te onderzoeken en deze hiertoe te openen. Indien de enveloppen of andere
      poststukken afkomstig zijn van of bestemd zijn voor de in [artikel 42, eerste en tweede lid][ref1], genoemde
      personen of instanties, geschiedt dit onderzoek in aanwezigheid van de betrokken jeugdige.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel42
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '42'
        hoofdstuk: VIII
  - number: '41.3'
    text: |-
      De directeur is bevoegd op de inhoud van brieven of andere poststukken afkomstig van of bestemd voor jeugdigen
      toezicht uit te oefenen met het oog op een belang als bedoeld in het vierde lid. Dit toezicht kan omvatten het
      kopiëren van brieven of andere poststukken. Van de wijze van uitoefenen van toezicht wordt aan de jeugdige tevoren
      mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel41
  - number: '41.4'
    text: |-
      De directeur kan de verzending of de uitreiking van bepaalde brieven of andere poststukken alsmede bijgesloten
      voorwerpen weigeren, indien dit noodzakelijk is met het oog op een van de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel41
  - number: 41.4.a
    text: de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel41
  - number: 41.4.b
    text: de voorkoming of de opsporing van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel41
  - number: 41.4.c
    text: de bescherming van slachtoffers van of anderszins betrokkenen bij misdrijven;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel41
  - number: 41.4.d
    text: de geestelijke of lichamelijke ontwikkeling van de jeugdige;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel41
  - number: 41.4.e
    text: de uitvoering van het perspectiefplan.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel41
  - number: '41.5'
    text: |-
      De directeur draagt zorg dat de niet uitgereikte brieven of andere poststukken dan wel bijgesloten voorwerpen,
      hetzij worden teruggegeven aan de jeugdige of voor diens rekening worden gezonden aan de verzender of een door de
      jeugdige op te geven adres, hetzij onder afgifte van een bewijs van ontvangst ten behoeve van de jeugdige worden
      bewaard, hetzij met toestemming van de jeugdige worden vernietigd, hetzij aan een opsporingsambtenaar ter hand
      worden gesteld met het oog op de voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel41
  - number: '42.1'
    text: |-
      [Artikel 41, derde en vierde lid][ref1], is niet van toepassing op brieven door de jeugdige gericht aan of
      afkomstig van:


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel41
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '41'
        hoofdstuk: VIII
  - number: 42.1.a
    text: leden van het Koninklijk Huis;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
  - number: 42.1.b
    text: |-
      de Eerste of Tweede Kamer der Staten-Generaal, leden daarvan, de Nederlandse leden van het Europese Parlement of
      een commissie uit een van beide parlementen;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
  - number: 42.1.c
    text: Onze Minister;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
  - number: 42.1.d
    text: justitiële autoriteiten;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
  - number: 42.1.e
    text: de Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
  - number: 42.1.f
    text: de inspecteurs van de Inspectie gezondheidszorg en jeugd;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
  - number: 42.1.g
    text: de Raad, een commissie daaruit of leden of buitengewone leden daarvan;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
  - number: 42.1.h
    text: de commissie van toezicht, een beklagcommissie, of leden daarvan;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
  - number: 42.1.i
    text: diens rechtsbijstandverlener;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
  - number: 42.1.j
    text: diens reclasseringsmedewerker of medewerkers van de gecertificeerde instelling;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
  - number: 42.1.k
    text: |-
      diens ouders of voogd, stiefouder of pleegouders, behoudens ingeval zwaarwegende belangen van de jeugdige zich
      daartegen verzetten;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
  - number: 42.1.l
    text: andere door Onze Minister of de directeur aan te wijzen personen of instanties.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
  - number: '42.2'
    text: |-
      Voor de toepassing van het eerste lid, onder d, wordt onder justitiële autoriteiten mede begrepen: organen die
      krachtens een wettelijk voorschrift of een in Nederland geldend verdrag bevoegd zijn tot kennisneming van klachten
      of behandeling van met een klacht aangevangen zaken.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
  - number: '42.3'
    text: |-
      Onze Minister kan nadere regels stellen omtrent de wijze van verzending van brieven aan en door de in het eerste
      lid genoemde personen en instanties.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel42
  - number: '43.1'
    text: |-
      De jeugdige heeft het recht gedurende ten minste één uur per week op in de huisregels vastgestelde tijden en
      plaatsen bezoek te ontvangen. Onze Minister kan nadere regels stellen omtrent de toelating en weigering van bezoek.
      In de huisregels worden regels gesteld omtrent het aanvragen van bezoek.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel43
  - number: '43.2'
    text: |-
      De directeur kan het aantal tegelijk tot de jeugdige toe te laten personen beperken, indien dit noodzakelijk is in
      het belang van de handhaving van de orde of de veiligheid in de inrichting.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel43
  - number: '43.3'
    text: |-
      De directeur kan de toelating tot de jeugdige van een bepaalde persoon of bepaalde personen weigeren, indien dit
      noodzakelijk is met het oog op een belang als bedoeld in [artikel 41, vierde lid][ref1]. Deze weigering van een
      bezoeker op de grond van [artikel 41, vierde lid, onder a, b, d of e][ref2], geldt voor ten hoogste twaalf maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel41
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '41'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '41'
        hoofdstuk: VIII
  - number: '43.4'
    text: |-
      De directeur kan bepalen dat tijdens het bezoek toezicht wordt uitgeoefend, indien dit noodzakelijk is met het
      oog op een belang als bedoeld in [artikel 41, vierde lid][ref1]. Dit toezicht kan omvatten het beluisteren of het
      opnemen van het gesprek tussen de bezoeker en de jeugdige. Tevoren wordt aan betrokkenen mededeling gedaan van de
      aard en de reden van het toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel41
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '41'
        hoofdstuk: VIII
  - number: '43.5'
    text: |-
      Iedere bezoeker dient zich bij binnenkomst op deugdelijke wijze te legitimeren. De directeur kan bepalen dat
      een bezoeker aan zijn kleding wordt onderzocht op de aanwezigheid van voorwerpen die een gevaar kunnen opleveren
      voor de orde of de veiligheid in de inrichting. Dit onderzoek kan ook betrekking hebben op door hem meegebrachte
      voorwerpen. De directeur is bevoegd dergelijke voorwerpen gedurende de duur van het bezoek onder zich te nemen
      tegen afgifte van een bewijs van ontvangst dan wel aan een opsporingsambtenaar ter hand te stellen met het oog
      op de voorkoming of de opsporing van strafbare feiten. De directeur kan voorwaarden verbinden aan het voorgenomen
      bezoek van een persoon aan wie op grond van het derde lid eerder de toegang is geweigerd. Deze voorwaarden kunnen
      inhouden dat de bezoeker voorafgaand aan het bezoek, aan zijn lichaam wordt onderzocht. Dit onderzoek kan mede
      omvatten het uitwendig schouwen van de openingen en holten van het lichaam van de bezoeker.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel43
  - number: '43.6'
    text: |-
      De directeur kan het bezoek binnen de daarvoor bestemde tijd beëindigen en de bezoeker uit de inrichting doen
      verwijderen, indien dit noodzakelijk is met het oog op een belang als bedoeld in [artikel 41, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel41
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '41'
        hoofdstuk: VIII
  - number: '43.7'
    text: |-
      De in [artikel 42, eerste lid, onder f, g en h][ref1], genoemde personen en instanties hebben te allen tijde
      toegang tot de jeugdige. De overige in dat lid genoemde personen en instanties hebben toegang tot de jeugdige op
      in de huisregels vastgestelde tijden en plaatsen. Indien de in artikel 42, eerste lid, onder k, genoemde personen
      vanwege dringende verplichtingen of belemmeringen niet in staat blijken de jeugdige op de in de huisregels
      vastgestelde tijden en plaatsen gedurende de week te bezoeken, stelt de directeur hen buiten deze tijden, door de
      week of in het weekeinde, daartoe in de gelegenheid. Tijdens dit bezoek kunnen zij zich vrijelijk met de jeugdige
      onderhouden, behoudens ingeval de directeur, na overleg met de desbetreffende bezoeker, van mening is dat van de
      jeugdige een ernstig gevaar uitgaat voor de veiligheid van de bezoeker. In dat geval laat de directeur voor het
      bezoek weten welke toezichthoudende maatregelen genomen worden om het onderhoud zo ongestoord mogelijk te laten
      verlopen. De toezichthoudende maatregelen mogen er niet toe leiden dat vertrouwelijke mededelingen in het onderhoud
      tussen de jeugdige en diens rechtsbijstandverlener bij derden bekend kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel42
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '42'
        hoofdstuk: VIII
  - number: '44.1'
    text: |-
      De jeugdige heeft, behoudens de overeenkomstig het tweede tot en met het vierde lid te stellen beperkingen, het
      recht ten minste tweemaal per week op in de huisregels vastgestelde tijden en plaatsen en met behulp van een
      daartoe aangewezen toestel gedurende tien minuten een of meer telefoongesprekken te voeren met personen buiten de
      inrichting. De hieraan verbonden kosten komen, tenzij de directeur anders bepaalt, voor rekening van de jeugdige.
      In verband met het uitoefenen van toezicht als bedoeld in het tweede lid, kunnen telefoongesprekken worden
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel44
  - number: '44.2'
    text: |-
      De directeur kan bepalen dat op de door of met de jeugdige gevoerde telefoongesprekken toezicht wordt uitgeoefend,
      indien dit noodzakelijk is om de identiteit van de persoon met wie de jeugdige een gesprek voert vast te stellen
      dan wel met het oog op een belang als bedoeld in [artikel 41, vierde lid][ref1]. Dit toezicht kan omvatten het
      beluisteren van een telefoongesprek of het uitluisteren van een opgenomen telefoongesprek. Aan de betrokkene wordt
      mededeling gedaan van de aard en de reden van het toezicht. Bij algemene maatregel van bestuur worden nadere regels
      gesteld over het opnemen van telefoongesprekken en het bewaren en verstrekken van opgenomen telefoongesprekken.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel41
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '41'
        hoofdstuk: VIII
  - number: '44.3'
    text: |-
      De directeur kan de gelegenheid tot het voeren van een bepaald telefoongesprek of telefoongesprekken weigeren
      of een telefoongesprek binnen de daarvoor bestemde tijd beëindigen, indien dit noodzakelijk is met het oog
      op een belang als bedoeld in [artikel 41, vierde lid][ref1]. De beslissing tot het weigeren van een bepaald
      telefoongesprek of bepaalde telefoongesprekken geldt voor ten hoogste vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel41
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '41'
        hoofdstuk: VIII
  - number: '44.4'
    text: |-
      De jeugdige wordt in staat gesteld met de in [artikel 42, eerste lid][ref1], genoemde personen en instanties
      telefonisch contact te hebben, indien hiervoor de noodzaak en de gelegenheid bestaan. Op deze gesprekken wordt geen
      ander toezicht uitgeoefend dan voor zover noodzakelijk is om de identiteit van de persoon of instantie met wie de
      jeugdige een telefoongesprek voert of wenst te voeren vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel42
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '42'
        hoofdstuk: VIII
  - number: '45.1'
    text: |-
      De directeur kan toestemming geven voor het voeren van een gesprek tussen de jeugdige en een vertegenwoordiger van
      de media, voor zover dit zich verdraagt met de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel45
  - number: 45.1.a
    text: de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel45
  - number: 45.1.b
    text: de bescherming van de openbare orde en de goede zeden;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel45
  - number: 45.1.c
    text: de geestelijke of lichamelijke ontwikkeling van de jeugdige;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel45
  - number: 45.1.d
    text: de uitvoering van het perspectiefplan;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel45
  - number: 45.1.e
    text: de bescherming van de rechten en de vrijheden van anderen dan de jeugdige;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel45
  - number: 45.1.f
    text: de voorkoming of de opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel45
  - number: '45.2'
    text: |-
      De directeur kan met het oog op de bescherming van de in het eerste lid genoemde belangen aan de toegang
      van een vertegenwoordiger van de media tot de inrichting voorwaarden verbinden. De directeur is bevoegd een
      vertegenwoordiger van de media uit de inrichting te doen verwijderen, indien hij de hem opgelegde voorwaarden niet
      nakomt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel45
  - number: '45.3'
    text: |-
      De directeur kan op het contact met een vertegenwoordiger van de media toezicht uitoefenen,
      indien dit noodzakelijk is met het oog op een belang als bedoeld in het eerste lid.
      [Artikel 43, vierde lid, tweede en derde volzin, en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel43
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '43'
        hoofdstuk: VIII
  - number: '46.1'
    text: |-
      De jeugdige heeft het recht zijn godsdienst of levensovertuiging, individueel of in gemeenschap met anderen, vrij
      te belijden en te beleven.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel46
  - number: '46.2'
    text: |-
      De directeur draagt zorg dat in de inrichting voldoende geestelijke verzorging, die zoveel mogelijk aansluit bij de
      godsdienst of levensovertuiging van de jeugdigen, beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel46
  - number: '46.3'
    text: 'De directeur stelt de jeugdige in de gelegenheid op in de huisregels vastgestelde tijden en plaatsen:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel46
  - number: 46.3.a
    text: |-
      persoonlijk contact te onderhouden met de geestelijke verzorger van de godsdienst of de levensovertuiging van zijn
      keuze, die aan de inrichting is verbonden;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel46
  - number: 46.3.b
    text: |-
      contact te onderhouden met andere dan de onder a genoemde geestelijke verzorgers volgens [artikel 43][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel43
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '43'
        hoofdstuk: VIII
  - number: 46.3.c
    text: |-
      in de inrichting te houden godsdienstige of levensbeschouwelijke bijeenkomsten van zijn keuze bij te wonen.
      [Artikel 24][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel24
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '24'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '46.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld ten aanzien van de beschikbaarheid
      van de geestelijke verzorging. Deze regels hebben betrekking op de verlening van geestelijke verzorging door of
      vanwege verschillende richtingen van godsdienst of levensovertuiging, op de organisatie en de bekostiging van de
      geestelijke verzorging en op de aanstelling van geestelijke verzorgers bij een inrichting.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel46
  - number: '47.1'
    text: De jeugdige heeft recht op verzorging door een aan de inrichting verbonden arts of diens vervanger.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel47
  - number: '47.2'
    text: |-
      De jeugdige heeft recht op raadpleging, voor eigen rekening, van een arts van zijn keuze. De directeur stelt in
      overleg met de gekozen arts de plaats en het tijdstip van de raadpleging vast.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel47
  - number: '47.3'
    text: 'De directeur draagt zorg dat een aan de inrichting verbonden arts of diens vervanger:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel47
  - number: 47.3.a
    text: regelmatig beschikbaar is voor het houden van een spreekuur;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel47
  - number: 47.3.b
    text: op andere tijdstippen beschikbaar is, indien dit in het belang van de gezondheid van de jeugdige noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel47
  - number: 47.3.c
    text: |-
      de jeugdigen die hiervoor in aanmerking komen onderzoekt op hun geschiktheid voor deelname aan sport of een andere
      activiteit.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel47
  - number: '47.4'
    text: 'De directeur draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel47
  - number: 47.4.a
    text: |-
      de verstrekking van de door de aan de inrichting verbonden arts of diens vervanger voorgeschreven medicijnen en
      diëten;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel47
  - number: 47.4.b
    text: de behandeling van de jeugdige op aanwijzing van de aan de inrichting verbonden arts of diens vervanger;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel47
  - number: 47.4.c
    text: |-
      de overbrenging van de jeugdige naar een ziekenhuis dan wel een andere instelling, indien de onder b bedoelde
      behandeling aldaar plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel47
  - number: '47.5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld inzake het klagen over beslissingen die ten aanzien van
      jeugdigen zijn genomen door de aan de inrichting verbonden arts of diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel47
  - number: '48.1'
    text: De jeugdige heeft recht op sociale verzorging en hulpverlening.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel48
  - number: '48.2'
    text: |-
      De directeur draagt zorg dat de maatschappelijk werkers van gecertificeerde instellingen, reclasseringswerkers en
      daarvoor in aanmerking komende gedragsdeskundigen de in het eerste lid omschreven zorg en hulp in de inrichting
      kunnen verlenen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel48
  - number: '48.3'
    text: |-
      De directeur draagt zorg voor overbrenging van de jeugdige naar de daartoe bestemde plaats, indien de in het eerste
      lid omschreven zorg en hulp dit noodzakelijk maken en een dergelijke overbrenging zich verdraagt met de ongestoorde
      tenuitvoerlegging van de vrijheidsbeneming.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel48
  - number: '49.1'
    text: |-
      De directeur draagt zorg dat aan de jeugdige voeding, noodzakelijke kleding en schoeisel worden verstrekt dan wel
      dat hem voldoende geldmiddelen ter beschikking worden gesteld om hierin naar behoren te voorzien.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel49
  - number: '49.2'
    text: |-
      De jeugdige heeft recht op het dragen van eigen kleding en schoeisel, tenzij die een gevaar kunnen opleveren voor
      de orde of de veiligheid in de inrichting. Hij kan worden verplicht tijdens het deelnemen aan activiteiten of
      sport aangepaste kleding of schoeisel te dragen. In de huisregels kunnen regels worden gesteld omtrent de wijze van
      gebruik en onderhoud van kleding en schoeisel.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel49
  - number: '49.3'
    text: |-
      De directeur draagt zorg dat bij de verstrekking van voeding zoveel mogelijk rekening wordt gehouden met de
      godsdienst of de levensovertuiging van de jeugdigen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel49
  - number: '49.4'
    text: |-
      De directeur draagt zorg dat de jeugdige in staat wordt gesteld zijn uiterlijk en lichamelijke hygiëne naar behoren
      te verzorgen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel49
  - number: '49.5'
    text: |-
      In de huisregels worden regels gesteld omtrent de aankoop door jeugdigen van andere gebruiksartikelen dan die welke
      door de directeur ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel49
  - number: '50.1'
    text: |-
      In de huisregels kan worden bepaald dat het bezit van bepaalde soorten voorwerpen binnen de inrichting of een
      bepaalde afdeling daarvan verboden is, indien dit noodzakelijk is in het belang van de handhaving van de orde of de
      veiligheid in de inrichting dan wel de beperking van de aansprakelijkheid van de directeur voor de voorwerpen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel50
  - number: '50.2'
    text: |-
      De directeur kan een jeugdige toestemming geven hem toebehorende voorwerpen waarvan het bezit niet is verboden
      ingevolge het eerste lid, in zijn kamer te plaatsen dan wel bij zich te hebben voor zover dit zich verdraagt met de
      volgende belangen:
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel50
  - number: 50.2.a
    text: de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel50
  - number: 50.2.b
    text: de geestelijke of de lichamelijke ontwikkeling van de jeugdige;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel50
  - number: 50.2.c
    text: de uitvoering van het perspectiefplan;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel50
  - number: 50.2.d
    text: de aansprakelijkheid van de directeur voor de voorwerpen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel50
  - number: '50.3'
    text: |-
      De directeur kan aan de toestemming, bedoeld in het tweede lid, voorwaarden verbinden die kunnen betreffen het
      gebruik van en de aansprakelijkheid voor deze voorwerpen. Bij of krachtens algemene maatregel van bestuur kunnen
      regels worden gesteld krachtens welke de aansprakelijkheid van de directeur voor voorwerpen die een jeugdige
      ingevolge het tweede lid onder zich heeft wordt beperkt tot een bepaald bedrag.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel50
  - number: '50.4'
    text: |-
      De directeur is bevoegd aan de jeugdige toebehorende voorwerpen voor diens rekening te laten onderzoeken, ten einde
      vast te stellen of de toelating of het bezit daarvan kan worden toegestaan dan wel is verboden ingevolge het eerste
      onderscheidenlijk het tweede lid.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel50
  - number: '50.5'
    text: |-
      De directeur is bevoegd voorwerpen die verboden zijn dan wel ten aanzien waarvan geen toestemming is verleend
      ingevolge het eerste onderscheidenlijk het tweede lid, in beslag te nemen. Hij draagt zorg dat deze voorwerpen
      hetzij onder afgifte van een bewijs van ontvangst ten behoeve van de jeugdige op diens kosten worden bewaard,
      hetzij met toestemming van de jeugdige worden vernietigd, hetzij aan een opsporingsambtenaar ter hand worden
      gesteld met het oog op de voorkoming of de opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel50
  - number: '51.1'
    text: |-
      Het bezit van contant geld door de jeugdigen in de inrichting of een afdeling is verboden, tenzij in de huisregels
      anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51
  - number: '51.2'
    text: |-
      In inrichtingen of afdelingen waar het bezit door de jeugdigen van contant geld is verboden, heeft de jeugdige de
      beschikking over een rekening-courant bij de inrichting.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51
  - number: '51.3'
    text: Aan de jeugdige kan een zakgeld worden toegekend volgens door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51
  - number: '51.4'
    text: |-
      In de huisregels kunnen nadere regels worden gesteld omtrent het bezit van contant geld en het gebruik van de
      rekening-courant. Deze regels kunnen een beperking inhouden van het bedrag waarover de jeugdige ten hoogste in
      contanten of door middel van zijn rekening-courant mag beschikken.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51
  - number: 51a
    text: 'Voor de toepassing van deze paragraaf wordt onder gevaar verstaan:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51a
  - number: 51a.1
    text: 'gevaar voor de jeugdige, die het veroorzaakt, hetgeen onder meer bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51a
  - number: 51a.1.a
    text: het gevaar dat de jeugdige zich van het leven zal beroven of zichzelf ernstig lichamelijk letsel zal toebrengen;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51a
  - number: 51a.1.b
    text: het gevaar dat de jeugdige maatschappelijk te gronde gaat;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51a
  - number: 51a.1.c
    text: het gevaar dat de jeugdige zichzelf in ernstige mate zal verwaarlozen;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51a
  - number: 51a.1.d
    text: het gevaar dat de jeugdige met hinderlijk gedrag agressie van anderen zal oproepen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51a
  - number: 51a.2
    text: 'gevaar voor een of meer anderen, hetgeen onder meer bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51a
  - number: 51a.2.a
    text: het gevaar dat de jeugdige een ander van het leven zal beroven of hem ernstig lichamelijk letsel zal toebrengen;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51a
  - number: 51a.2.b
    text: het gevaar voor de psychische gezondheid van een ander;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51a
  - number: 51a.2.c
    text: het gevaar dat de jeugdige een ander, die aan zijn zorg is toevertrouwd, zal verwaarlozen;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51a
  - number: 51a.3
    text: gevaar voor de algemene veiligheid van personen of goederen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51a
  - number: 51b.1
    text: |-
      De directeur draagt zorg dat binnen twee weken na plaatsing op een afdeling voor intensieve zorg als bedoeld in
      [artikel 22a][ref1] of een afdeling voor intensieve behandeling als bedoeld in [artikel 22b][ref2], in overleg met
      de jeugdige een geneeskundige behandelingsplan wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel22b
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51b
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 22a
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: 22b
        hoofdstuk: VI
        paragraaf: '1'
  - number: 51b.2
    text: |-
      Het geneeskundig behandelingsplan is gericht op het zodanig wegnemen van het gevaar dat de stoornis van
      de geestvermogens de jeugdige doet veroorzaken dat de jeugdige niet langer in verband met zijn geestelijke
      gezondheidstoestand op een afdeling voor intensieve zorg of intensieve behandeling behoeft te verblijven. Zo
      mogelijk geschiedt dit door het behandelen van de stoornis. Indien dit niet mogelijk is, geschiedt dit door het
      anderszins wegnemen van het gevaar.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51b
  - number: 51b.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de eisen waaraan een geneeskundig behandelingsplan
      tenminste moet voldoen en de voorschriften die bij een wijziging daarvan in acht genomen moeten worden.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51b
  - number: 51c
    text: |-
      Behandeling van de jeugdige op een afdeling voor intensieve zorg als bedoeld in [artikel 22a][ref1] of een afdeling
      voor intensieve behandeling als bedoeld in [artikel 22b][ref2] vindt slechts plaats:


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel22b
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51c
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 22a
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: 22b
        hoofdstuk: VI
        paragraaf: '1'
  - number: 51c.a
    text: |-
      voor zover deze is voorzien in het geneeskundig behandelingsplan bedoeld in [artikel 51b, eerste lid][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51b
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51c
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51b
        hoofdstuk: IX
        paragraaf: 1a
  - number: 51c.b
    text: |-
      indien het overleg over het geneeskundig behandelingsplan, bedoeld in [artikel 51b, eerste lid][ref1], heeft geleid
      tot overeenstemming met de jeugdige en, indien de jeugdige de leeftijd van zestien jaar nog niet heeft bereikt, met
      zijn ouders of voogd, stiefouder of pleegouders dan wel de gecertificeerde instelling, en


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51b
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51c
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51b
        hoofdstuk: IX
        paragraaf: 1a
  - number: 51c.c
    text: |-
      indien de jeugdige of, indien de jeugdige de leeftijd van zestien jaar nog niet heeft bereikt, zijn ouders
      of voogd, stiefouder of pleegouders dan wel de gecertificeerde instelling, zich niet tegen de geneeskundige
      behandeling verzetten.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51c
  - number: 51d
    text: |-
      Indien niet wordt voldaan aan de voorwaarden van [artikel 51c, onderdelen b en c][ref1], kan niettemin als uiterste
      redmiddel geneeskundige behandeling plaatsvinden:


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51c
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51d
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51c
        hoofdstuk: IX
        paragraaf: 1a
  - number: 51d.a
    text: |-
      voor zover aannemelijk is dat zonder die behandeling het gevaar dat de stoornis van de geestvermogens de jeugdige
      doet veroorzaken niet binnen een redelijke termijn kan worden weggenomen, of
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51d
  - number: 51d.b
    text: |-
      voor zover dit volstrekt noodzakelijk is om het gevaar dat de stoornis van de geestvermogens de jeugdige binnen de
      inrichting doet veroorzaken, af te wenden.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51d
  - number: 51e.1
    text: |-
      Behandeling overeenkomstig [artikel 51d, onder a][ref1], vindt plaats na een schriftelijke beslissing van de
      directeur waarin wordt vermeld voor welke termijn zij geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51d
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51e
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51d
        hoofdstuk: IX
        paragraaf: 1a
  - number: 51e.2
    text: |-
      Ten behoeve van deze beslissing dient te worden overgelegd een verklaring van de behandelend psychiater alsmede
      van een psychiater die de jeugdige met het oog daarop kort tevoren heeft onderzocht maar niet bij diens behandeling
      betrokken was. Uit de verklaringen dient te blijken dat de jeugdige op wie de verklaring betrekking heeft, is
      gestoord in zijn geestvermogens en dat een geval als bedoeld in [artikel 51d, onder a][ref1], zich voordoet. De
      verklaringen moeten met redenen zijn omkleed en ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51d
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51e
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51d
        hoofdstuk: IX
        paragraaf: 1a
  - number: 51e.3
    text: |-
      De beslissing als bedoeld in het eerste lid wordt gemeld aan de voorzitter van de Commissie van Toezicht. De
      voorzitter van de Commissie van Toezicht doet onverwijld een melding aan de maandcommissaris.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51e
  - number: 51e.4
    text: |-
      De termijn als bedoeld in het eerste lid is zo kort mogelijk, maar niet langer dan drie maanden, gerekend vanaf de
      dag waarop de beslissing tot stand komt. De directeur doet onverwijld een afschrift van de beslissing toekomen aan
      de jeugdige en, indien de jeugdige de leeftijd van 16 jaar nog niet heeft bereikt, tevens aan zijn ouders of voogd,
      stiefouder of pleegouders dan wel de gecertificeerde instelling.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51e
  - number: 51e.5
    text: |-
      Indien na afloop van de termijn als bedoeld in het eerste lid, voortzetting van de behandeling overeenkomstig
      [artikel 51d, onder a][ref1], nodig is, geschiedt dit slechts krachtens een schriftelijke beslissing van de
      directeur. Het bepaalde in de voorgaande volzin is eveneens van toepassing indien binnen zes maanden na afloop van
      de termijn als bedoeld in het vierde lid opnieuw behandeling overeenkomstig [artikel 51d, onder a][ref2], nodig is.
      De directeur geeft in zijn beslissing aan waarom van een behandeling alsnog het beoogde effect wordt verwacht. Op
      zodanige beslissingen is het vierde lid, eerste volzin van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51d
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel51d
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51e
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51d
        hoofdstuk: IX
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0011756
        artikel: 51d
        hoofdstuk: IX
        paragraaf: 1a
  - number: 51e.6
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste, tweede,
      vierde en vijfde lid alsmede omtrent de toepassing van [artikel 51d, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51d
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51e
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51d
        hoofdstuk: IX
        paragraaf: 1a
  - number: 51e.7
    text: |-
      Deze in het zesde lid bedoelde regels betreffen in ieder geval de melding en de registratie van de behandeling
      alsmede de taak van de behandelend arts. Tevens kunnen categorieën van behandelingsmiddelen of -maatregelen
      worden aangewezen die niet mogen worden toegepast bij een behandeling overeenkomstig het eerste lid. Bij algemene
      maatregel van bestuur kunnen voorts ten aanzien van daarbij aangegeven categorieën van behandelingsmiddelen of
      -maatregelen regels worden gegeven met betrekking tot de wijze waarop tot toepassing daarvan moet worden besloten.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel51e
  - number: '52.1'
    text: |-
      De jeugdige is verplicht tot het volgen van onderwijs dan wel tot het deelnemen aan andere activiteiten in het
      kader van zijn pedagogische vorming.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel52
  - number: '52.2'
    text: |-
      In het voor de jeugdige opgestelde perspectiefplan wordt opgenomen welk onderwijs hij volgt of aan welke
      activiteiten in het kader van zijn pedagogische vorming hij deelneemt. Bij de keuze daarvan worden de mate van
      beveiliging van de inrichting of de afdeling en het voor de jeugdige geldende stelsel van vrijheden in acht
      genomen, en wordt zo veel mogelijk rekening gehouden met redelijke wensen van de jeugdige, alsmede met die van zijn
      ouders of voogd, stiefouder of pleegouders.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel52
  - number: '52.3'
    text: |-
      De directeur draagt zorg voor de beschikbaarheid van onderwijs en andere activiteiten in het kader van de
      pedagogische vorming, alsmede voor de voorziening daarin door daarvoor in aanmerking komende functionarissen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel52
  - number: '52.4'
    text: |-
      Onze Minister kan regels stellen omtrent de voorwaarden waaronder een tegemoetkoming kan worden verleend in de
      kosten die voor de jeugdige aan het volgen van onderwijs en het deelnemen aan activiteiten in het kader van zijn
      pedagogische vorming, voor zover hierin niet door de directeur van de inrichting kan worden voorzien, kunnen
      zijn verbonden. Deze voorwaarden kunnen betreffen de aard, de duur en de kosten van deze activiteiten alsmede de
      vooropleiding van de jeugdige en diens vorderingen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel52
  - number: '52.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de eisen waaraan het onderwijs in de
      inrichting en de andere activiteiten in het kader van de pedagogische vorming moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel52
  - number: '53.1'
    text: |-
      De jeugdige heeft recht op het kennis nemen van het nieuws, voor eigen rekening, en het wekelijks gebruik maken van
      een bibliotheekvoorziening.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel53
  - number: '53.2'
    text: |-
      De jeugdige heeft recht op lichamelijke oefening en het beoefenen van sport gedurende ten minste tweemaal drie
      kwartier per week, voor zover zijn gezondheid zich daar niet tegen verzet.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel53
  - number: '53.3'
    text: |-
      De jeugdige heeft recht op recreatie en dagelijks verblijf in de buitenlucht, voor zover zijn gezondheid zich daar
      niet tegen verzet.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel53
  - number: '53.4'
    text: |-
      De directeur draagt zorg dat de jeugdige in de gelegenheid wordt gesteld tot deelname aan recreatieve activiteiten
      gedurende ten minste twee uren per dag.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel53
  - number: '53.5'
    text: |-
      De directeur draagt zorg dat de jeugdige in de gelegenheid wordt gesteld dagelijks ten minste een uur in de
      buitenlucht te verblijven.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel53
  - number: '54.1'
    text: |-
      Indien een personeelslid of medewerker constateert dat een jeugdige betrokken is bij feiten die onverenigbaar zijn
      met de orde of de veiligheid in de inrichting dan wel met de ongestoorde tenuitvoerlegging van de vrijheidsbeneming
      en hij voornemens is daarover aan de directeur schriftelijk verslag te doen, deelt hij dit de jeugdige mede.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel54
  - number: '54.2'
    text: |-
      De directeur beslist over het opleggen van een disciplinaire straf zo spoedig mogelijk nadat hem dit verslag is
      gedaan.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel54
  - number: '54.3'
    text: |-
      Indien de directeur of zijn plaatsvervanger feiten als bedoeld in het eerste lid constateert, blijft het eerste lid
      buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel54
  - number: '54.4'
    text: |-
      Een straf kan worden opgelegd dan wel ten uitvoer gelegd in een andere inrichting of afdeling dan waarin het
      verslag, bedoeld in het eerste lid is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel54
  - number: '55.1'
    text: |-
      De directeur kan wegens het begaan van feiten als bedoeld in [artikel 54, eerste lid][ref1], de navolgende
      disciplinaire straffen opleggen:


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel54
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '54'
        hoofdstuk: X
  - number: 55.1.a
    text: |-
      opsluiting in een strafcel dan wel een andere verblijfsruimte voor ten hoogste vier dagen voor jeugdigen tot
      zestien jaar en ten hoogste zeven dagen voor jeugdigen van zestien jaar en ouder;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel55
  - number: 55.1.b
    text: |-
      ontzegging van bezoek van een bepaald persoon of bepaalde personen voor ten hoogste vier weken, indien het feit
      plaatsvond in verband met bezoek van die persoon of personen;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel55
  - number: 55.1.c
    text: |-
      uitsluiting van deelname aan een of meer bepaalde activiteiten voor ten hoogste vier dagen voor jeugdigen tot
      zestien jaar en ten hoogste zeven dagen voor jeugdigen van zestien jaar en ouder;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel55
  - number: 55.1.d
    text: weigering, intrekking of beperking van het eerstvolgende verlof;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel55
  - number: 55.1.e
    text: |-
      geldboete tot een bedrag van ten hoogste het zakgeld, bedoeld in [artikel 51, derde lid][ref1], over één week.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '51'
        hoofdstuk: IX
        paragraaf: '1'
  - number: '55.2'
    text: |-
      De directeur bepaalt bij de oplegging van een geldboete tevens door welke andere straf deze zal worden vervangen,
      ingeval de boete niet binnen de daartoe door hem gestelde termijn is betaald.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel55
  - number: '55.3'
    text: |-
      De directeur kan voor feiten als bedoeld in [artikel 54, eerste lid][ref1], meer dan één straf opleggen, met dien
      verstande dat de in het eerste lid onder a en c genoemde straffen slechts kunnen worden opgelegd voor zover zij te
      zamen niet langer duren dan vier dagen voor jeugdigen tot zestien jaar en zeven dagen voor jeugdigen van zestien
      jaar en ouder.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel54
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '54'
        hoofdstuk: X
  - number: '55.4'
    text: |-
      De oplegging van een straf laat onverlet de mogelijkheid voor de directeur om ter zake van de door de jeugdige
      toegebrachte schade met hem dan wel zijn wettelijk vertegenwoordiger een regeling te treffen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel55
  - number: '55.5'
    text: |-
      Geen straf kan worden opgelegd, indien de jeugdige voor het begaan van een feit als bedoeld in
      [artikel 54, eerste lid][ref1], niet verantwoordelijk kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel54
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '54'
        hoofdstuk: X
  - number: '55.6'
    text: |-
      Indien een straf is opgelegd wordt deze onverwijld ten uitvoer gelegd. De directeur kan bepalen dat een straf niet
      of slechts ten dele ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel55
  - number: 55a.1
    text: |-
      De directeur kan, indien dit ter bescherming van de geestelijke of lichamelijke toestand van de jeugdige
      noodzakelijk is, bepalen dat de jeugdige die in de strafcel verblijft, dag en nacht door middel van een camera
      wordt geobserveerd.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel55a
  - number: 55a.2
    text: |-
      Alvorens hij hiertoe beslist, wint hij het advies in van een gedragsdeskundige onderscheidenlijk de
      inrichtingsarts, tenzij dit advies niet kan worden afgewacht. In dat geval wint de directeur het advies zo spoedig
      mogelijk na zijn beslissing in.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel55a
  - number: '56.1'
    text: |-
      Indien de tenuitvoerlegging van de opsluiting in een strafcel of andere verblijfsruimte in de inrichting of de
      afdeling waarin zij is opgelegd niet mogelijk is of op ernstige bezwaren stuit, kan zij in een andere inrichting of
      afdeling worden ondergaan.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel56
  - number: '56.2'
    text: |-
      Indien de directeur van oordeel is dat de in het eerste lid bedoelde omstandigheid zich voordoet, plaatst hij in
      overeenstemming met de selectiefunctionaris de jeugdige hiertoe over.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel56
  - number: '56.3'
    text: Onze Minister stelt nadere regels omtrent de procedure van overplaatsing ingevolge het tweede lid.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel56
  - number: '57.1'
    text: Een straf kan geheel of ten dele voorwaardelijk worden opgelegd. De proeftijd bedraagt ten hoogste twee maanden.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel57
  - number: '57.2'
    text: |-
      De directeur stelt in elk geval als voorwaarde dat de jeugdige zich onthoudt van het plegen van feiten die
      onverenigbaar zijn met de orde of de veiligheid in de inrichting dan wel met de ongestoorde tenuitvoerlegging van
      de vrijheidsbeneming. De directeur kan andere voorwaarden aan het gedrag van de jeugdige stellen. De opgelegde
      voorwaarden worden vermeld in de mededeling, bedoeld in [artikel 62, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel62
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '62'
        hoofdstuk: XI
  - number: '57.3'
    text: |-
      Bij het overtreden van een voorwaarde binnen de proeftijd kan de directeur bepalen dat de opgelegde voorwaardelijke
      straf geheel of ten dele ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel57
  - number: '57.4'
    text: De directeur kan een onvoorwaardelijke straf geheel of ten dele omzetten in een voorwaardelijke straf.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel57
  - number: '58.1'
    text: Van elke strafoplegging dan wel wijziging daarvan houdt de directeur aantekening in een register.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel58
  - number: '58.2'
    text: |-
      Indien een straf ingevolge de[ hoofdstukken XII][ref1], [XIII][ref2] of [XIV][ref3] geheel of ten dele wordt
      herzien, houdt de directeur hiervan aantekening in een register.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXII
      [ref2]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXIII
      [ref3]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXIV
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0011756
        hoofdstuk: XII
      - id: ref2
        bwb_id: BWBR0011756
        hoofdstuk: XIII
      - id: ref3
        bwb_id: BWBR0011756
        hoofdstuk: XIV
  - number: '58.3'
    text: |-
      De ouders of voogd, stiefouder of pleegouders dan wel de gecertificeerde instelling, worden van het opleggen van
      een straf, bedoeld in [artikel 55, eerste lid][ref1], en van de redenen daarvan op de hoogte gesteld. Ten aanzien
      van jeugdigen van achttien jaar en ouder is de instemming van de jeugdige vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel55
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '55'
        hoofdstuk: X
  - number: '58.4'
    text: 'De directeur kan van het doen van mededelingen omtrent de redenen voor het opleggen van de straf afzien indien:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel58
  - number: 58.4.a
    text: |-
      de ouders, voogd, stiefouder of pleegouders te kennen hebben gegeven niet betrokken te willen worden bij het
      verblijf van de jeugdige in de inrichting;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel58
  - number: 58.4.b
    text: zwaarwegende belangen van de jeugdige zich tegen het doen van deze mededelingen verzetten.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel58
  - number: '59.1'
    text: |-
      De jeugdige aan wie de disciplinaire straf van opsluiting, bedoeld in [artikel 55, eerste lid, onder a][ref1], is
      opgelegd is uitgesloten van deelname aan activiteiten, voor zover de directeur niet anders bepaalt en behoudens het
      dagelijks verblijf in de buitenlucht, bedoeld in [artikel 53, derde lid][ref2]. De directeur kan het contact met de
      buitenwereld, bedoeld in [hoofdstuk VIII][ref3], gedurende de opsluiting beperken of uitsluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0011756#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '55'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '53'
        hoofdstuk: IX
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0011756
        hoofdstuk: VIII
  - number: '59.2'
    text: |-
      De directeur draagt zorg dat, ingeval de opsluiting in een strafcel ten uitvoer wordt gelegd en langer dan
      vierentwintig uren duurt, de commissie van toezicht en de aan de inrichting verbonden arts of diens vervanger
      terstond hiervan in kennis worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel59
  - number: '59.3'
    text: |-
      Onze Minister stelt nadere regels omtrent het verblijf in en de inrichting van de strafcel. Deze betreffen in elk
      geval de rechten die tijdens het verblijf in de strafcel aan de jeugdige toekomen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel59
  - number: '60.1'
    text: |-
      De directeur draagt zorg dat de jeugdige bij binnenkomst in de inrichting, schriftelijk en zoveel mogelijk in
      een voor hem begrijpelijke taal, op de hoogte wordt gesteld van zijn bij of krachtens deze wet gestelde rechten
      en plichten.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel60
  - number: '60.2'
    text: 'De jeugdige wordt hierbij in het bijzonder gewezen op diens bevoegdheid:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel60
  - number: 60.2.a
    text: |-
      een bezwaar- of verzoekschrift in te dienen overeenkomstig [hoofdstuk IV][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0011756
        hoofdstuk: IV
  - number: 60.2.b
    text: zich te wenden tot de maandcommissaris van de commissie van toezicht overeenkomstig hoofdstuk XII;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel60
  - number: 60.2.c
    text: |-
      een klaag- of beroepschrift in te dienen overeenkomstig de [hoofdstukken XIII][ref1], [XIV][ref2] en [XV][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXIII
      [ref2]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXIV
      [ref3]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXV
