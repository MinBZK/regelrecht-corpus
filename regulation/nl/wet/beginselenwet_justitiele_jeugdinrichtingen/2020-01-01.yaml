  - number: '61.5'
    text: |-
      Een jeugdige vreemdeling wordt bij binnenkomst in de inrichting geïnformeerd over zijn recht de consulaire
      vertegenwoordiger van zijn land van zijn detentie op de hoogte te laten stellen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel61
  - number: '62.1'
    text: |-
      De directeur geeft de jeugdige van elke beslissing als bedoeld in [artikel 61, eerste lid][ref1], onverwijld
      schriftelijk en zoveel mogelijk in een voor hem begrijpelijke taal een met redenen omklede, gedagtekende en
      ondertekende mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel61
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '61'
        hoofdstuk: XI
  - number: '62.2'
    text: 'De directeur geeft de jeugdige op de in het eerste lid omschreven wijze een mededeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel62
  - number: 62.2.a
    text: |-
      de weigering van verzending of uitreiking van een brief of ander poststuk dan wel van bijgesloten voorwerpen als
      bedoeld in [artikel 41, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel41
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '41'
        hoofdstuk: VIII
