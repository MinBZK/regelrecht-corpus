      het verbod van het voeren van een bepaald telefoongesprek of bepaalde telefoongesprekken als bedoeld in
      [artikel 44, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel44
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel62
