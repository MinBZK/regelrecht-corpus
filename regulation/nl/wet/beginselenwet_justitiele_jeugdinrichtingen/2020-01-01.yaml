        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0011756
        artikel: '26'
        hoofdstuk: VI
        paragraaf: '2'
  - number: 65.1.f
    text: |-
      de tijdelijke plaatsing en de verlenging hiervan, bedoeld in [artikel 27, eerste onderscheidenlijk derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel27
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '27'
        hoofdstuk: VI
        paragraaf: '2'
  - number: 65.1.g
    text: |-
      de beperking en de intrekking van verlof, bedoeld in de [artikelen 29, tweede lid][ref1],
      [30, derde en vierde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel30
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
    references:
