        bwb_id: BWBR0011756
        hoofdstuk: XV
  - number: '61.1'
    text: |-
      De directeur stelt de jeugdige in de gelegenheid te worden gehoord, zoveel mogelijk in een voor de jeugdige
      begrijpelijke taal, alvorens hij beslist omtrent:
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel61
