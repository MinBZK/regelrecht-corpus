  - number: 65.1.i
    text: |-
      het gedogen van een geneeskundige handeling, bedoeld in [artikel 37][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel37
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '37'
        hoofdstuk: VII
  - number: 65.1.j
    text: |-
      het verrichten van een geneeskundige behandeling, bedoeld in [artikel 51d, onder b][ref1], of voortzetting van een
      geneeskundige behandeling, bedoeld in [artikel 51e, vijfde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51d
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel51e
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51d
