      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel68
      [ref4]: https://wetten.overheid.nl/BWBR0011756#Artikel69
      [ref5]: https://wetten.overheid.nl/BWBR0011756#Artikel70
      [ref6]: https://wetten.overheid.nl/BWBR0011756#Artikel71
      [ref7]: https://wetten.overheid.nl/BWBR0011756#Artikel72
      [ref8]: https://wetten.overheid.nl/BWBR0011756#Artikel73
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel78
