        hoofdstuk: III
  - number: 80b.d
    text: |-
      [artikel 17][ref1], met als doel de vaststelling van andersoortige wijzen van onderbrenging van de jeugdige;


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel17
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '17'
