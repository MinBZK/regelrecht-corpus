  - number: 4.4.j
    text: |-
      het verrichten van geneeskundige behandeling als bedoeld in [artikel 51d, onder a of b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51d
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
    references:
