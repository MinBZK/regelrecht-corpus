  - number: 78.4.a
    text: de betrokkenen uitsluitend in de gelegenheid worden gesteld het beroepschrift schriftelijk toe te lichten;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel78
  - number: 78.4.b
    text: |-
      de mondelinge opmerkingen ten overstaan van een lid van de commissie, bedoeld in het eerste lid, kunnen worden
      gemaakt;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel78
  - number: 78.4.c
    text: |-
      ingeval bij een ander persoon mondeling inlichtingen worden ingewonnen, de betrokkenen uitsluitend in de
      gelegenheid worden gesteld schriftelijk de vragen op te geven die zij aan die persoon gesteld wensen te zien.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel78
  - number: '79'
    text: |-
      De directeur draagt zorg voor een regelmatig overleg met de jeugdigen over zaken die rechtstreeks hun verblijf
      raken. Zowel de jeugdigen als de directeur kunnen deze onderwerpen in dat overleg aan de orde stellen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel79
  - number: '80.1'
    text: |-
      De in de [artikelen 18][ref1] en [19][ref2] alsmede [hoofdstukken XII tot en met XV][ref3] aan de jeugdige
      toegekende rechten kunnen, behoudens ingeval de selectiefunctionaris onderscheidenlijk de beklag- of
      beroepscommissie van oordeel is dat zwaarwegende belangen van de jeugdige zich daartegen verzetten, mede worden
      uitgeoefend door diens ouders of voogd, stiefouder of pleegouders.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXII
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '19'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0011756
        hoofdstuk: XII
  - number: '80.2'
    text: |-
      De directeur draagt zorg dat de in het eerste lid genoemde personen bij binnenkomst van de jeugdige schriftelijk en
      voor zover mogelijk in een voor hem begrijpelijke taal op deze rechten opmerkzaam worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel80
  - number: 80a.1
    text: |-
      Bij algemene maatregel van bestuur kunnen bij wijze van experiment regels worden gesteld waarmee tijdelijk wordt
      afgeweken van de in [artikel 80b][ref1] te noemen bepalingen, zulks met inachtneming van de aldaar genoemde doelen
      met het oog waarop afwijking van de betreffende bepaling gedurende de werkingsduur van de maatregel plaats kan
      hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel80b
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 80b
        hoofdstuk: XVIa
  - number: 80a.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel80a
  - number: 80a.3
    text: Onze Minister kan nadere regels stellen ter uitvoering van het experiment.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel80a
  - number: 80a.4
    text: |-
      Onze Minister zendt tenminste drie maanden voor het einde van de werkingsduur van een algemene maatregel van
      bestuur als bedoeld in het eerste lid aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten
      van het experiment in de praktijk.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel80a
  - number: 80a.5
    text: |-
      De algemene maatregel van bestuur bedoeld in het eerste lid, geldt voor een periode van ten hoogste twee jaar na
      inwerkingtreding daarvan.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel80a
  - number: 80a.6
    text: |-
      Het vijfde lid is niet van toepassing, indien binnen de twee jaar voordracht plaatsvindt van een voorstel van wet,
      waarmee in het onderwerp van de maatregel wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel80a
  - number: 80b
    text: |-
      Op de wijze als voorzien in [artikel 80a][ref1] kan worden afgeweken van:


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel80a
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 80a
        hoofdstuk: XVIa
  - number: 80b.a
    text: |-
      [artikel 1, onderdeel v][ref1], ten aanzien van de grootte van de groep, voor zover dit dienstig is aan een
      experiment ingevolge de navolgende onderdelen van dit artikel en voor zover dit in het belang is van de opvoeding
      of de behandeling van de jeugdige;


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
        hoofdstuk: I
  - number: 80b.b
    text: |-
      [artikel 3][ref1], met als doel de vaststelling van een vroeger moment waarop de jeugdige aan een scholings- en
      trainingsprogramma kan deelnemen;


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel3
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: 80b.c
    text: |-
      [artikel 10][ref1], met als doel de vaststelling van andersoortige mate van beveiliging voor zover bijzondere
      technologische ontwikkelingen daartoe aanleiding geven;


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel10
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0011756
