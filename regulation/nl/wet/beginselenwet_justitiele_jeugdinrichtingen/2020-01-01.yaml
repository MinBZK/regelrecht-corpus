  - number: 4.4.f
    text: |-
      de tijdelijke overplaatsing en de verlenging hiervan, bedoeld in
      [artikel 27, eerste, onderscheidenlijk het derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel27
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
