        artikel: 51e
        hoofdstuk: IX
        paragraaf: 1a
  - number: 65.1.k
    text: |-
      de bevestiging door mechanische middelen, bedoeld in [artikel 38, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel38
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '38'
        hoofdstuk: VII
  - number: 65.1.l
    text: |-
      de oplegging van een disciplinaire straf, bedoeld in [artikel 55][ref1] en de toepassing van de
      [artikelen 56][ref2] en [57, derde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel57
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '55'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '56'
        hoofdstuk: X
      - id: ref3
        bwb_id: BWBR0011756
        artikel: '57'
        hoofdstuk: X
  - number: 65.1.m
    text: |-
      de observatie door middel van een camera, bedoeld in de [artikelen 25a, eerste lid][ref1], en
      [55a, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel55a
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 25a
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: 55a
        hoofdstuk: X
  - number: 65.1.n
    text: |-
      enige andere beslissing die een beperking inhoudt van een recht dat de jeugdige op grond van een bij of krachtens
      deze wet of een een ieder verbindende bepaling van een in Nederland geldend verdrag toekomt.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
  - number: '65.2'
    text: |-
      Met een beslissing als bedoeld in het eerste lid wordt gelijkgesteld een verzuim of weigering om te beslissen. Het
      nemen van een beslissing wordt geacht te zijn verzuimd of geweigerd, indien niet binnen de wettelijke of, bij het
      ontbreken daarvan, binnen een redelijke termijn een beslissing is genomen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
  - number: '65.3'
    text: |-
      De directeur draagt zorg dat een jeugdige die beklag wenst te doen daartoe zo spoedig mogelijk in de gelegenheid
      wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
  - number: '66.1'
    text: |-
      De jeugdige doet beklag door de indiening van een klaagschrift bij de beklagcommissie bij de inrichting waar de
      beslissing waarover hij klaagt is genomen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel66
  - number: '66.2'
    text: |-
      De indiening van het klaagschrift kan door tussenkomst van de directeur van de inrichting waar de jeugdige
      verblijft geschieden. De directeur draagt in dat geval zorg dat het klaagschrift, of, indien het klaagschrift zich
      in een envelop bevindt, de envelop van een dagtekening wordt voorzien, welke geldt als dag van indiening.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel66
  - number: '66.3'
    text: |-
      Het klaagschrift vermeldt zo nauwkeurig mogelijk de beslissing waarover wordt geklaagd en de redenen van het
      beklag.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel66
  - number: '66.4'
    text: |-
      De beklagcommissie stelt de maandcommissaris onverwijld op de hoogte van de klacht en doet hem deze onverwijld in
      een gesloten enveloppe toekomen. Indien de indiening van het klaagschrift heeft plaatsgevonden door tussenkomst van
      de directeur, dan stelt deze de maandcommissaris onverwijld op de hoogte van de klacht en doet deze toekomen aan
      de maandcommissaris.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel66
  - number: '66.5'
    text: |-
      De maandcommissaris onderzoekt of terzake het onderwerp van de klacht tussen de jeugdige en de directeur kan worden
      bemiddeld. [Artikel 64, derde tot en met zevende lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel64
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '64'
        hoofdstuk: XII
  - number: '66.6'
    text: |-
      Indien de jeugdige de Nederlandse taal niet voldoende beheerst kan hij het klaagschrift in een andere taal
      indienen. De voorzitter van de beklagcommissie kan bepalen dat het klaagschrift in de Nederlandse taal wordt
      vertaald. De vergoeding van de voor de vertaling gemaakte kosten geschiedt volgens regelen te stellen bij algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel66
  - number: '66.7'
    text: |-
      Het klaagschrift wordt uiterlijk op de zevende dag na die waarop de jeugdige kennis heeft gekregen van de
      beslissing waarover hij zich wenst te beklagen ingediend. Een na afloop van deze termijn ingediend klaagschrift is
      niettemin ontvankelijk, indien redelijkerwijs niet kan worden geoordeeld dat de jeugdige in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel66
  - number: '66.8'
    text: |-
      Indien de jeugdige een verzoek tot bemiddeling heeft gedaan, wordt, in afwijking van het zevende lid, het
      klaagschrift ingediend uiterlijk op de zevende dag na die waarop de jeugdige de schriftelijke mededeling van
      bevindingen van de maandcommissaris heeft ontvangen. Het indienen van een verzoek tot bemiddeling, stuit de in het
      vorige lid genoemde termijn voor het indienen van een klaagschrift.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel66
  - number: '67.1'
    text: |-
      Het klaagschrift wordt behandeld door een door de commissie van toezicht uit haar midden benoemde beklagcommissie,
      bestaande uit drie leden, die wordt bijgestaan door een secretaris. Een lid van de commissie van toezicht neemt
      geen deel aan de behandeling van het klaagschrift, indien hij heeft bemiddeld ter zake van de beslissing waarop het
      klaagschrift betrekking heeft of daarmee op enige andere wijze bemoeienis heeft gehad.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel67
  - number: '67.2'
    text: |-
      De voorzitter dan wel een door hem aangewezen lid van de beklagcommissie kan, indien hij het beklag van eenvoudige
      aard, dan wel kennelijk niet-ontvankelijk, kennelijk ongegrond of kennelijk gegrond acht, het klaagschrift
      enkelvoudig afdoen, met dien verstande dat hij tevens de bevoegdheden bezit die aan de voorzitter van de voltallige
      beklagcommissie toekomen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel67
  - number: '67.3'
    text: |-
      De voorzitter, dan wel het door hem aangewezen lid, bedoeld in het tweede lid, kan de behandeling te allen tijde
      verwijzen naar de voltallige beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel67
  - number: '67.4'
    text: |-
      De behandeling van het klaagschrift vindt niet in het openbaar plaats, behoudens ingeval de beklagcommissie van
      oordeel is dat de niet openbare behandeling niet verenigbaar is met enige een ieder verbindende bepaling van een in
      Nederland geldend verdrag.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel67
  - number: '68.1'
    text: De secretaris van de beklagcommissie zendt de directeur een afschrift van het klaagschrift toe.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel68
  - number: '68.2'
    text: |-
      De directeur geeft dienaangaande desgevraagd zo spoedig mogelijk schriftelijk de nodige inlichtingen aan de
      beklagcommissie. Hij voegt daaraan de opmerkingen toe, waartoe het klaagschrift hem overigens aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel68
  - number: '68.3'
    text: |-
      Aan de klager geeft de secretaris van de beklagcommissie schriftelijk kennis van de inhoud van deze inlichtingen
      en opmerkingen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel68
  - number: '68.4'
    text: |-
      Indien de commissie van toezicht omtrent de beslissing waarover wordt geklaagd heeft bemiddeld en zij
      haar bevindingen schriftelijk aan de klager en de directeur mede heeft gedeeld, voegt de secretaris van de
      beklagcommissie de bevindingen bij de processtukken.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel68
  - number: '69.1'
    text: |-
      De beklagcommissie stelt de klager en de directeur in de gelegenheid omtrent het klaagschrift mondeling opmerkingen
      te maken, tenzij zij het beklag aanstonds kennelijk niet-ontvankelijk, kennelijk ongegrond of kennelijk gegrond
      acht.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel69
  - number: '69.2'
    text: |-
      De klager en de directeur kunnen de voorzitter van de beklagcommissie de vragen opgeven die zij aan elkaar gesteld
      wensen te zien.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel69
  - number: '69.3'
    text: |-
      De beklagcommissie kan de directeur en de klager buiten elkaars aanwezigheid horen. In dat geval worden zij in de
      gelegenheid gesteld vooraf de vragen op te geven die zij gesteld wensen te zien en wordt de zakelijke inhoud van de
      aldus afgelegde verklaring door de voorzitter van de beklagcommissie aan de klager onderscheidenlijk de directeur
      mondeling medegedeeld.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel69
  - number: '69.4'
    text: |-
      De beklagcommissie kan ook bij andere personen mondeling of schriftelijk inlichtingen inwinnen. Indien mondeling
      inlichtingen worden ingewonnen, zijn het tweede en derde lid, tweede volzin, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel69
  - number: '70.1'
    text: |-
      De klager heeft het recht zich te doen bijstaan door een rechtsbijstandverlener of een andere vertrouwenspersoon,
      die daartoe van de beklagcommissie toestemming heeft gekregen. Indien aan de klager een advocaat is toegevoegd,
      geschieden diens beloning en de vergoeding van de door hem gemaakte kosten volgens regelen te stellen bij algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel70
  - number: '70.2'
    text: |-
      Indien de klager de Nederlandse taal niet voldoende beheerst, draagt de voorzitter zorg voor de bijstand van een
      tolk. De beloning en de vergoeding van de door de tolk gemaakte kosten geschieden volgens regelen te stellen bij
      algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel70
  - number: '70.3'
    text: |-
      Tijdens de beklagprocedure staat de beklagcommissie aan de klager op diens verzoek toe van de gedingstukken kennis
      te nemen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel70
  - number: '70.4'
    text: |-
      Indien de klager elders verblijft, kunnen de opmerkingen, bedoeld in [artikel 69, eerste lid][ref1], op verzoek van
      de beklagcommissie ten overstaan van een lid van een andere beklagcommissie worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel69
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '69'
        hoofdstuk: XIII
  - number: '70.5'
    text: |-
      Van het horen van de betrokkenen maakt de secretaris een schriftelijk verslag, dat door de voorzitter en de
      secretaris wordt ondertekend. Bij verhindering van een van hen wordt de reden daarvan in het verslag vermeld.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel70
  - number: '71.1'
    text: |-
      Hangende de uitspraak op het klaagschrift kan de voorzitter van de beroepscommissie op verzoek van de klager, na de
      directeur te hebben gehoord, de tenuitvoerlegging van de beslissing waarop het klaagschrift betrekking heeft geheel
      of gedeeltelijk schorsen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel71
  - number: '71.2'
    text: De voorzitter doet hiervan onverwijld mededeling aan de directeur en de klager.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel71
  - number: '72.1'
    text: |-
      De beklagcommissie doet zo spoedig mogelijk, doch in ieder geval binnen een termijn van vier weken te rekenen vanaf
      de datum waarop het klaagschrift is ontvangen, uitspraak. In bijzondere omstandigheden kan de beklagcommissie deze
      termijn met ten hoogste vier weken verlengen. Van deze verlenging wordt aan de directeur en de klager mededeling
      gedaan.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel72
  - number: '72.2'
    text: |-
      De uitspraak is met redenen omkleed en gedagtekend. Zij bevat een verslag van het horen van personen door de
      beklagcommissie. Zij wordt door de voorzitter, alsmede door de secretaris ondertekend. Bij verhindering van een
      van hen wordt de reden daarvan in de uitspraak vermeld. Aan de klager en de directeur wordt onverwijld en kosteloos
      een afschrift van de beslissing van de beklagcommissie toegezonden of uitgereikt. De datum van die toezending of
      uitreiking wordt op dit afschrift aangetekend.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel72
  - number: '72.3'
    text: |-
      De uitspraak vermeldt de mogelijkheid van het instellen van beroep bij de beroepscommissie, de wijze waarop en de
      termijn waarbinnen dit moet worden gedaan alsmede de mogelijkheid tot schorsing van de tenuitvoerlegging van de
      uitspraak, bedoeld in [artikel 75, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel75
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '75'
        hoofdstuk: XIV
  - number: '72.4'
    text: |-
      Indien de klager de Nederlandse taal niet voldoende beheerst en in de inrichting niet op andere wijze in een
      vertaling kan worden voorzien, draagt de voorzitter van de beklagcommissie zorg voor een vertaling van de uitspraak
      en de mededeling, bedoeld in het tweede, onderscheidenlijk derde lid. De vergoeding van de voor de vertaling
      gemaakte kosten geschiedt volgens regelen te stellen bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel72
  - number: '72.5'
    text: |-
      De voorzitter van de beklagcommissie kan de uitspraak ook mondeling mededelen aan de klager en de directeur. Deze
      worden daarbij gewezen op de mogelijkheid tot het instellen van beroep bij de beroepscommissie, de wijze waarop
      en de termijn waarbinnen dit moet worden gedaan, alsmede op de mogelijkheid tot schorsing van de tenuitvoerlegging
      van de uitspraak, bedoeld in [artikel 75, tweede lid][ref1]. Als dag van de uitspraak geldt de dag van het doen van
      deze mededeling. Indien mondeling uitspraak wordt gedaan, wordt de uitspraak op het klaagschrift aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel75
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '75'
        hoofdstuk: XIV
  - number: '72.6'
    text: |-
      Indien het vijfde lid toepassing heeft gevonden en beroep wordt ingesteld als voorzien in
      [artikel 74, eerste lid][ref1], vindt uitwerking van de beslissing van de beklagcommissie plaats op de wijze,
      bedoeld in het tweede lid. De secretaris van de beklagcommissie zendt een afschrift van deze uitspraak toe aan de
      directeur, de klager en de beroepscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel74
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '74'
        hoofdstuk: XIV
  - number: '72.7'
    text: |-
      De secretaris zendt van alle uitspraken van de beklagcommissie een afschrift naar Onze Minister. Een ieder heeft
      recht op kennisneming van deze uitspraken en het ontvangen van een afschrift daarvan. Onze Minister draagt zorg dat
      dit afschrift geen gegevens bevat waaruit de identiteit van de jeugdige kan worden afgeleid. Met betrekking tot de
      kosten van het ontvangen van een afschrift is het bij of krachtens de [Wet griffierechten burgerlijke zaken][ref1]
      bepaalde van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028899
  - number: '73.1'
    text: 'De uitspraak van de beklagcommissie strekt tot gehele of gedeeltelijke:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: 73.1.a
    text: niet-ontvankelijkverklaring van het beklag;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: 73.1.b
    text: ongegrondverklaring van het beklag;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: 73.1.c
    text: gegrondverklaring van het beklag.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: '73.2'
    text: 'Indien de beklagcommissie van oordeel is dat de beslissing waarover is geklaagd:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: 73.2.a
    text: |-
      in strijd is met een in de inrichting geldend wettelijk voorschrift of een een ieder verbindende bepaling van een
      in Nederland geldend verdrag, dan wel
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: 73.2.b
    text: |-
      bij afweging van alle in aanmerking komende belangen, waaronder de veiligheid van de samenleving en de belangen
      van slachtoffers en nabestaanden, onredelijk of onbillijk moet worden geacht, verklaart zij het beklag gegrond en
      vernietigt zij de beslissing geheel of gedeeltelijk.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: '73.3'
    text: 'Bij toepassing van het tweede lid kan de beklagcommissie:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: 73.3.a
    text: de directeur opdragen een nieuwe beslissing te nemen met inachtneming van haar uitspraak;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: 73.3.b
    text: bepalen dat haar uitspraak in de plaats treedt van de vernietigde beslissing;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: 73.3.c
    text: volstaan met de gehele of gedeeltelijke vernietiging.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: '73.4'
    text: Bij toepassing van het derde lid, onder a, kan de beklagcommissie in haar uitspraak een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: '73.5'
    text: De beklagcommissie kan bepalen dat de uitspraak buiten werking blijft totdat deze onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: '73.6'
    text: |-
      Indien het tweede lid toepassing vindt, worden de rechtsgevolgen van de vernietigde beslissing, voor zover
      mogelijk, door de directeur ongedaan gemaakt, dan wel in overeenstemming gebracht met de uitspraak van de
      beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: '73.7'
    text: |-
      Voor zover de in het zesde lid bedoelde gevolgen niet meer ongedaan te maken zijn, bepaalt de beklagcommissie dan
      wel de voorzitter, na de directeur te hebben gehoord, of enige tegemoetkoming aan de klager geboden is. Zij stelt
      de tegemoetkoming, die geldelijk van aard kan zijn, vast.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel73
  - number: '74.1'
    text: |-
      Tegen de uitspraak van de beklagcommissie kunnen de directeur en de klager beroep instellen door het indienen van
      een beroepschrift. Het met redenen omklede beroepschrift moet uiterlijk op de zevende dag na die van de ontvangst
      van het afschrift van de uitspraak onderscheidenlijk na die van de mondelinge mededeling van de uitspraak worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel74
  - number: '74.2'
    text: |-
      Het beroepschrift wordt ingediend bij en behandeld door een door de Raad benoemde beroepscommissie van drie leden
      of buitengewone leden, die wordt bijgestaan door een secretaris.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel74
  - number: '74.3'
    text: |-
      De voorzitter dan wel een door hem aangewezen lid van de beroepscommissie die een met rechtspraak belast lid van de
      rechterlijke macht is, kan het beroepschrift enkelvoudig afdoen indien hij het beroep kennelijk niet-ontvankelijk,
      kennelijk ongegrond of kennelijk gegrond acht, met dien verstande dat hij tevens de bevoegdheden bezit die aan de
      voorzitter van de voltallige beroepscommissie toekomen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel74
  - number: '74.4'
    text: |-
      De voorzitter, dan wel het door hem aangewezen lid, bedoeld in het derde lid, kan de behandeling te allen tijde
      verwijzen naar de voltallige beroepscommissie.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel74
  - number: '74.5'
    text: |-
      Ten aanzien van de behandeling van het beroepschrift zijn de [artikelen 65, derde lid][ref1],
      [66, tweede en vierde lid][ref2], [67, vierde lid][ref3], [68, eerste, tweede en derde lid][ref4], [69][ref5] en
      [70, eerste, tweede en derde lid][ref6], van overeenkomstige toepassing, met dien verstande dat de beroepscommissie
      kan bepalen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0011756#Artikel68
      [ref5]: https://wetten.overheid.nl/BWBR0011756#Artikel69
      [ref6]: https://wetten.overheid.nl/BWBR0011756#Artikel70
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '65'
        hoofdstuk: XIII
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '66'
        hoofdstuk: XIII
      - id: ref3
        bwb_id: BWBR0011756
        artikel: '67'
        hoofdstuk: XIII
      - id: ref4
        bwb_id: BWBR0011756
        artikel: '68'
        hoofdstuk: XIII
      - id: ref5
        bwb_id: BWBR0011756
        artikel: '69'
        hoofdstuk: XIII
      - id: ref6
        bwb_id: BWBR0011756
        artikel: '70'
        hoofdstuk: XIII
  - number: 74.5.a
    text: |-
      de directeur en de klager uitsluitend in de gelegenheid worden gesteld het beroepschrift schriftelijk toe te
      lichten;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel74
  - number: 74.5.b
    text: de mondelinge opmerkingen ten overstaan van een lid van de beroepscommissie kunnen worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel74
  - number: 74.5.c
    text: |-
      ingeval bij een ander persoon mondeling inlichtingen worden ingewonnen, de directeur en de klager uitsluitend in de
      gelegenheid worden gesteld schriftelijk de vragen op te geven die zij aan die persoon gesteld wensen te zien.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel74
  - number: '75.1'
    text: |-
      Het indienen van een beroepschrift schorst de tenuitvoerlegging van de uitspraak van de beklagcommissie niet,
      behalve voor zover deze de toekenning van een tegemoetkoming als bedoeld in [artikel 73, zevende lid][ref1],
      inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel73
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '73'
        hoofdstuk: XIII
  - number: '75.2'
    text: |-
      Hangende de uitspraak op het beroepschrift kan de voorzitter van de beroepscommissie op verzoek van degene die
      het beroep heeft ingesteld en gehoord de andere betrokkene in de procedure de tenuitvoerlegging van de uitspraak
      van de beklagcommissie geheel of gedeeltelijk schorsen. Hij doet hiervan onverwijld mededeling aan de directeur en
      de klager.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel75
  - number: '76.1'
    text: De beroepscommissie doet zo spoedig mogelijk uitspraak.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel76
  - number: '76.2'
    text: 'De uitspraak van de beroepscommissie strekt tot gehele of gedeeltelijke:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel76
  - number: 76.2.a
    text: niet-ontvankelijkverklaring van het beroep;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel76
  - number: 76.2.b
    text: bevestiging van de uitspraak van de beklagcommissie, hetzij met overneming, hetzij met verbetering van de gronden;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel76
  - number: 76.2.c
    text: vernietiging van de uitspraak van de beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel76
  - number: '76.3'
    text: |-
      Indien het tweede lid, onder c, toepassing vindt, doet de beroepscommissie hetgeen de beklagcommissie had behoren
      te doen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel76
  - number: '76.4'
    text: |-
      Ten aanzien van de uitspraak van de beroepscommissie zijn de [artikelen 71][ref1] en
      [72, tweede lid, eerste en derde tot en met vijfde volzin, vierde en zevende lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel72
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '71'
        hoofdstuk: XIII
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '72'
        hoofdstuk: XIII
  - number: '77.1'
    text: |-
      De betrokkene heeft het recht tegen de beslissing van de selectiefunctionaris op het bezwaar- of verzoekschrift
      voor zover dit betreft een gehele of gedeeltelijke ongegrondverklaring, onderscheidenlijk afwijzing als bedoeld in
      de [artikelen 18][ref1] en [19][ref2] een met redenen omkleed beroepschrift in te dienen bij de commissie, bedoeld
      in [artikel 78, eerste lid][ref3]. De betrokkene heeft ook het recht een beroepschrift in te dienen in het geval
      dat het indienen van een bezwaarschrift op de grond als vermeld in [artikel 18, vijfde lid][ref4], achterwege is
      gebleven.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel78
      [ref4]: https://wetten.overheid.nl/BWBR0011756#Artikel18
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '19'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0011756
        artikel: '78'
        hoofdstuk: XV
      - id: ref4
        bwb_id: BWBR0011756
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '77.2'
    text: |-
      De jeugdige heeft het recht tegen een hem betreffende beslissing aangaande verlof, voor zover hiertegen geen beklag
      ingevolge [artikel 65, eerste en tweede lid][ref1], openstaat, een met redenen omkleed beroepschrift in te dienen
      bij de commissie, bedoeld in [artikel 78, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel78
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '65'
        hoofdstuk: XIII
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '78'
        hoofdstuk: XV
  - number: '77.3'
    text: |-
      Het tweede lid is overeenkomstig van toepassing op de beslissing van Onze Minister, strekkende tot weigering van
      het verlenen van een machtiging tot deelname aan het scholings- en trainingsprogramma, na het verzoek, bedoeld in
      [artikel 3, zesde lid][ref1]. De jeugdige heeft ook het recht een beroepschrift in te dienen indien een tijdige
      beslissing op de aanvraag tot het verlenen van een machtiging uitblijft en tegen de beslissing tot intrekking van
      die machtiging door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel3
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '77.4'
    text: |-
      Tegen een beslissing als bedoeld in [artikel 51e, eerste lid][ref1], kan rechtstreeks beroep worden ingesteld bij
      de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel51e
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 51e
        hoofdstuk: IX
        paragraaf: 1a
  - number: '78.1'
    text: |-
      Het beroepschrift wordt behandeld door een door de Raad benoemde commissie van drie leden of buitengewone
      leden, die wordt bijgestaan door een secretaris. Ten aanzien van het beroepschrift, bedoeld in
      [artikel 77, eerste lid][ref1], is [artikel 74, derde en vierde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel74
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '77'
        hoofdstuk: XV
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '74'
        hoofdstuk: XIV
  - number: '78.2'
    text: |-
      Het beroepschrift moet worden ingediend uiterlijk op de zevende dag na die waarop de betrokkene kennis heeft
      gekregen van de beslissing waartegen hij beroep instelt. Een na afloop van deze termijn ingediend beroepschrift is
      niettemin ontvankelijk, indien blijkt dat redelijkerwijs niet kan worden geoordeeld dat de betrokkene in verzuim
      is geweest.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel78
  - number: '78.3'
    text: |-
      Indien de betrokkene in een inrichting verblijft, kan de indiening van het beroepschrift geschieden door
      tussenkomst van de directeur van de inrichting of afdeling. De directeur draagt zorg dat het beroepschrift
      onverwijld van een dagtekening wordt voorzien. Als dag waarop het beroepschrift is ingediend geldt die van de
      dagtekening.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel78
  - number: '78.4'
    text: |-
      De [artikelen 65, derde lid][ref1], [66, vierde lid][ref2],
      [68, eerste, tweede en derde lid][ref3], [69][ref4], [70][ref5], [71][ref6],
      __REF006___________________________________________________________________________________________________________
      ___________, [73, eerste tot en met vierde, zesde en zevende lid][ref8], zijn van overeenkomstige toepassing, met
      dien verstande dat de commissie, bedoeld in het eerste lid, kan bepalen dat:


