  - number: '62.3'
    text: |-
      In de gevallen, genoemd in het tweede lid, kan de mededeling achterwege blijven, indien de beslissing
      van de directeur strekt ter uitvoering van een beperking die aan de jeugdige is opgelegd ingevolge de
      [artikelen 62][ref1], [62a][ref2] en [76 van het Wetboek van Strafvordering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel62a
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel76
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 62a
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '76'
  - number: '62.4'
    text: |-
      De jeugdige wordt in de mededeling, bedoeld in het eerste en tweede lid, gewezen op de mogelijkheid van
      het verzoeken om bemiddeling, bedoeld in [hoofdstuk XII][ref1] of het instellen van beklag, bedoeld in
      [hoofdstuk XIII][ref2], de wijze waarop en de termijn waarbinnen zulks dient te geschieden, alsmede op de
      mogelijkheid tot het doen van een verzoek aan de voorzitter van de beroepscommissie om hangende de uitspraak op het
      klaagschrift de tenuitvoerlegging van de beslissing geheel of gedeeltelijk te schorsen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXII
      [ref2]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXIII
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0011756
        hoofdstuk: XII
      - id: ref2
        bwb_id: BWBR0011756
        hoofdstuk: XIII
  - number: '63.1'
    text: |-
      De directeur draagt zorg dat ten dienste van het verblijf van de jeugdige een dossier wordt aangelegd, waarin in
      ieder geval de volgende gegevens worden vastgelegd:
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel63
  - number: 63.1.a
    text: |-
      rapporten uitgebracht door of aan de inrichting betreffende de tenuitvoerlegging van de aan de jeugdige opgelegde
      vrijheidsstraf of vrijheidsbenemende maatregel;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel63
  - number: 63.1.b
    text: het perspectiefplan;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel63
  - number: 63.1.c
    text: |-
      op schrift gestelde samenvattingen van besprekingen voor zover betrekking hebbende op de vaststelling en de
      wijziging van het verblijfs- en behandelplan;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel63
  - number: 63.1.d
    text: evaluatieverslagen;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel63
  - number: 63.1.e
    text: opname- en ontslaggegevens;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel63
  - number: 63.1.f
    text: |-
      de aantekening omtrent de oplegging van een disciplinaire straf als bedoeld in [artikel 58, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel58
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '58'
        hoofdstuk: X
  - number: 63.1.g
    text: |-
      adviezen en aantekeningen als bedoeld in [artikel 6:6:31, vijfde lid, van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '63.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld inzake de eisen waaraan het dossier ten minste moet
      voldoen, de gegevens die daarin moeten worden vastgelegd, het recht op inzage of afschrift van het dossier door de
      betrokken jeugdige en zijn ouders of voogd, stiefouders of pleegouders dan wel de gecertificeerde instelling en de
      beperkingen daarop, de termijn gedurende welke het dossier moet worden bewaard, de wijze waarop het dossier moet
      worden beheerd, bewaard en, na afloop van de bewaartermijn, vernietigd, alsmede de overdracht van gegevens in geval
      van een overplaatsing van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel63
  - number: '63.3'
    text: |-
      Met toepassing van het bepaalde in [artikel 464 van Boek 7 van het Burgerlijk Wetboek][ref1] zijn de
      [artikelen 454][ref2], [455][ref3] en [456 van dit boek][ref4] niet van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel464
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel454
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel455
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel456
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '464'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '454'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '455'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '456'
  - number: '64.1'
    text: |-
      De jeugdige heeft het recht zich, mondeling of schriftelijk, tot de maandcommissaris, bedoeld in
      [artikel 7, vierde lid][ref1], te wenden met het verzoek te bemiddelen terzake van een grief omtrent de wijze
      waarop de directeur zich in een bepaalde aangelegenheid jegens hem heeft gedragen of een bij of krachtens deze wet
      gestelde zorgplicht heeft betracht. Een gedraging van een personeelslid of medewerker van de inrichting jegens de
      jeugdige wordt met het oog op de toepassing van deze bepaling als een gedraging van de directeur aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel7
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '7'
        hoofdstuk: II
        paragraaf: '3'
  - number: '64.2'
    text: |-
      Indien de grief een beslissing betreft waartegen beklag openstaat, dient dit verzoek uiterlijk op de zevende dag na
      die waarop de jeugdige kennis heeft gekregen van die beslissing te worden ingediend.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel64
  - number: '64.3'
    text: De maandcommissaris streeft ernaar binnen zes weken een voor partijen aanvaardbare oplossing te bereiken.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel64
  - number: '64.4'
    text: |-
      De maandcommissaris stelt de jeugdige en de directeur in de gelegenheid, al dan niet in elkaars tegenwoordigheid,
      hun standpunt mondeling toe te lichten. Indien de jeugdige de Nederlandse taal niet voldoende beheerst, draagt de
      maandcommissaris zorg voor de bijstand van een tolk.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel64
  - number: '64.5'
    text: |-
      Hij legt de resultaten van de bemiddeling neer in een schriftelijke mededeling en zendt een gedagtekend afschrift
      daarvan aan de directeur en de jeugdige. De datum van die toezending of uitreiking wordt op dit afschrift
      aangetekend. Indien de jeugdige de Nederlandse taal niet voldoende begrijpt, draagt de maandcommissaris zorg voor
      een vertaling van de mededeling. In de gevallen, bedoeld in [artikel 65][ref1], wordt de jeugdige gewezen op de
      mogelijkheid van beklag en de wijze waarop en de termijn waarbinnen dit moet worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel65
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '65'
        hoofdstuk: XIII
  - number: '64.6'
    text: |-
      De directeur deelt, binnen vier weken na ontvangst van de mededeling, bedoeld in het vijfde lid, de jeugdige
      alsmede de commissie van toezicht mede of hij het oordeel van de maandcommissaris over de grief deelt en of hij
      naar aanleiding van dat oordeel maatregelen zal nemen en zo ja welke.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel64
  - number: '64.7'
    text: |-
      Tegen de beslissing, bedoeld in het zesde lid, kan de jeugdige een klacht indienen bij de beklagcommissie. In dat
      geval is het bepaalde in [artikel 68, vierde lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel68
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '68'
        hoofdstuk: XIII
  - number: '64.8'
    text: |-
      De ouders of voogd, stiefouder of pleegouders hebben het recht als bedoeld in het eerste lid ter zake van een grief
      omtrent de wijze waarop de directeur zich in een bepaalde aangelegenheid jegens hen heeft gedragen. Het eerste en
      derde tot en met zevende lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel64
  - number: '65.1'
    text: |-
      Een jeugdige kan bij de beklagcommissie beklag doen over een hem betreffende door of namens de directeur genomen
      beslissing betreffende:
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
  - number: 65.1.a
    text: |-
      de weigering op het verzoek tot deelname aan een scholings-en trainingsprogramma, bedoeld in
      [artikel 3, zesde lid][ref1], alsmede de beëindiging van de deelname aan een scholings- en trainingsprogramma,
      bedoeld in artikel 3, vijfde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel3
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: 65.1.b
    text: |-
      de weigering of de intrekking van de toestemming om een kind in de inrichting onder te brengen, bedoeld in artikel
      16;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
  - number: 65.1.c
    text: |-
      de voortzetting van het verblijf op een afdeling voor intensieve zorg, bedoeld in [artikel 22a, derde lid][ref1],
      op een afdeling voor intensieve behandeling, bedoeld in [artikel 22b, derde lid][ref2], of een individuele
      trajectafdeling, bedoeld in [artikel 22c, vijfde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel22b
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel22c
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: 22a
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: 22b
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011756
        artikel: 22c
        hoofdstuk: VI
        paragraaf: '1'
  - number: 65.1.d
    text: |-
      de uitsluiting van het verblijf in de groep of van deelname aan activiteiten en de verlenging daarvan, bedoeld in
      [artikel 23, derde lid][ref1], en [24, eerste lid, aanhef en onder a of b][ref2], onderscheidenlijk artikel 23,
      vierde lid en 24, tweede lid, alsmede verlenging van de uitsluiting van verblijf in de groep, bedoeld in artikel
      23, tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel24
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '23'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '24'
        hoofdstuk: VI
        paragraaf: '2'
  - number: 65.1.e
    text: |-
      de plaatsing in afzondering en de verlenging hiervan, bedoeld in [artikel 25, eerste lid][ref1], op de grond
      van [artikel 24, eerste lid, onder a of b][ref2], onderscheidenlijk artikel 25, derde lid, en de toepassing van
      [artikel 26][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel26
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
    references:
      - id: ref1
