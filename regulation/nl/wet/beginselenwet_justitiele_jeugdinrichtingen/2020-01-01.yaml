      het gedogen van een geneeskundige handeling, bedoeld in [artikel 37][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel37
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
    references:
