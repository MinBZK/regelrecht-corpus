  - number: '89'
    text: |-
      Deze wet heeft geen gevolgen voor klaagschriften of beroepschriften die zijn ingediend voor de inwerkingtreding van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel89
  - number: '90'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel90
  - number: '91'
    text: 'Deze wet wordt aangehaald als: Beginselenwet justitiële jeugdinrichtingen.'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel91
