        hoofdstuk: VII
  - number: 4.4.l
    text: |-
      de oplegging van een disciplinaire straf, bedoeld in [artikel 55][ref1], de toepassing van
      [artikel 56, eerste en tweede lid][ref2], en [artikel 57, derde en vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel56
