        paragraaf: '3'
  - number: 65.1.h
    text: |-
      het onderzoek in het lichaam, bedoeld in [artikel 36, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel36
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel65
    references:
      - id: ref1
