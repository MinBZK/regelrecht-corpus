preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een integrale regeling te treffen voor de materiële
    en formele rechtspositie ten aanzien van wie de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
    maatregel plaatsvindt door verblijf in een justitiële jeugdinrichting dan wel door deelname aan een scholings-
    en trainingsprogramma en in verband daarmede het Wetboek van Strafrecht en de Wet op de jeugdhulpverlening te
    wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#ArtikelAanhef
