  - number: '2.1'
    text: |-
      De tenuitvoerlegging van een vrijheidsstraf of een vrijheidsbenemende maatregel vindt, voor zover niet bij
      of krachtens de wet anders is bepaald, plaats door onderbrenging van de persoon aan wie deze is opgelegd
      in een inrichting dan wel door diens deelname aan een scholings- en trainingsprogramma, als bedoeld in
      [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel3
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '2.2'
    text: |-
      Met handhaving van het karakter van de straf of de maatregel wordt de tenuitvoerlegging hiervan aangewend voor
      de opvoeding van de jeugdige en zoveel mogelijk dienstbaar gemaakt aan de voorbereiding op diens terugkeer in de
      maatschappij. In het geval dat een vrijheidsbenemende maatregel behandeling inhoudt wordt de tenuitvoerlegging
      tevens hierop afgestemd. Bij het verlenen van vrijheden aan jeugdigen wordt rekening gehouden met de veiligheid van
      de samenleving en de belangen van slachtoffers en nabestaanden.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel2
  - number: '2.3'
    text: |-
      De tenuitvoerlegging van vrijheidsstraffen of vrijheidsbenemende maatregelen vindt zo spoedig mogelijk plaats na de
      oplegging van de straf of de maatregel.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel2
  - number: '2.4'
    text: 'Jeugdigen in een inrichting worden aan geen andere beperkingen onderworpen dan die welke noodzakelijk zijn voor:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel2
  - number: 2.4.a
    text: |-
      het doel van de vrijheidsbeneming, waaronder begrepen hun geestelijke en lichamelijke ontwikkeling en de uitvoering
      van het perspectiefplan;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel2
  - number: 2.4.b
    text: de handhaving van de orde of de veiligheid in de inrichting.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel2
  - number: '3.1'
    text: |-
      Personen ten aanzien van wie de tenuitvoerlegging van vrijheidsstraffen of vrijheidsbenemende maatregelen
      plaatsvindt kunnen in aansluiting op hun verblijf in de inrichting door de directeur met machtiging van Onze
      Minister in de gelegenheid worden gesteld aan een scholings- en trainingsprogramma deel te nemen. Een scholings-
      en trainingsprogramma is een samenstel van activiteiten waaraan wordt deelgenomen door jeugdigen ter verdere
      tenuitvoerlegging van de aan hen opgelegde vrijheidsstraf of vrijheidsbenemende maatregel dat als zodanig door Onze
      Minister is erkend, met inachtneming van de regels ingevolge het derde lid.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      Personen ten aanzien van wie de tenuitvoerlegging van jeugddetentie plaatsvindt waarvan de totale duur die van een
      ondergane voorlopige hechtenis met een bij algemene maatregel van bestuur te bepalen duur overschrijdt, nemen deel
      aan een scholings- en trainingsprogramma. Het programma staat ten dienste aan de begeleiding van de jeugdige in
      aansluiting op het verblijf in een justitiële jeugdinrichting.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3
  - number: '3.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven die in elk geval de inhoud, de voorwaarden
      voor en het toezicht op deelname, de gevolgen van niet-nakoming van de voorwaarden en de rechtspositie van de
      deelnemers aan een scholings- en trainingsprogramma betreffen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3
  - number: '3.4'
    text: |-
      Met inachtneming van de regels ingevolge het derde lid kan Onze Minister bepalen welke jeugdigen voor deelname aan
      een scholings- en trainingsprogramma in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3
  - number: '3.5'
    text: |-
      Bij het niet voldoen aan de voorwaarden voor deelname, bedoeld in het derde lid, kan de directeur de deelname
      beëindigen en wordt de tenuitvoerlegging van vrijheidsstraffen of vrijheidsbenemende maatregelen in de inrichting
      voortgezet.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3
  - number: '3.6'
    text: |-
      De jeugdige heeft het recht bij de directeur een met redenen omkleed verzoekschrift in te dienen, strekkende
      tot deelname aan een scholings- of trainingsprogramma. [Artikel 66, zesde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel66
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '66'
        hoofdstuk: XIII
  - number: 3a.1
    text: |-
      Onze Minister subsidieert of houdt in stand landelijke voorzieningen van residentiële hulpverlening ten
      behoeve van de tenuitvoerlegging van vrijheidsstraffen en vrijheidsbenemende maatregelen als bedoeld in de
      [artikelen 77h van het Wetboek van Strafrecht][ref1] alsmede voor de tenuitvoerlegging van een machtiging in een
      geval als bedoeld in [artikel 6.2.2, tweede lid, van de Jeugdwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77h
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
  - number: 3a.2
    text: De inrichtingen worden onderscheiden in rijksinrichtingen en particuliere inrichtingen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3a
  - number: 3b.1
    text: |-
      Particuliere inrichtingen zijn in de Europese Economische Ruimte gevestigde rechtspersonen met
      volledige rechtsbevoegdheid tot wier doelstelling opvang en behandeling van jeugdigen als bedoeld in
      [artikel 1, onderdeel g][ref1], behoren en die daartoe door Onze Minister zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
        hoofdstuk: I
  - number: 3b.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de aanwijzing als particuliere
      inrichting en de daaraan te verbinden voorwaarden, alsmede omtrent het verstrekken van subsidie. Hetgeen bij en
      krachtens de [artikelen 4.1.1, tweede lid, eerste volzin][ref1], juncto [4.1.5, eerste lid, van de Jeugdwet][ref2]
      is bepaald ten aanzien van jeugdhulpaanbieders, is voor wat betreft de verantwoordelijkheidstoedeling van
      overeenkomstige toepassing op particuliere inrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
  - number: 3b.3
    text: |-
      Het beheer van een particuliere inrichting berust bij de directeur, die door het bestuur benoemd wordt. De
      directeur van een particuliere inrichting wijst met machtiging van het bestuur een of meer personen als zijn
      vervanger aan.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3b
  - number: 3c.1
    text: |-
      Rijksinrichtingen worden door Onze Minister aangewezen. Het opperbeheer van de rijksinrichtingen berust bij Onze
      Minister. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld betreffende de uitvoering
      hiervan.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3c
  - number: 3c.2
    text: |-
      Het beheer van een rijksinrichting berust bij de directeur, die als zodanig door Onze Minister wordt aangewezen.
      Onze Minister wijst een of meer personen aan als vervanger van de directeur.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3c
  - number: 3c.3
    text: |-
      Onze Minister kan mandaat verlenen betreffende de hem bij of krachtens deze wet toegekende bevoegdheden tot het
      vaststellen van algemeen verbindende voorschriften aan het hoofd van de Dienst Justitiële Inrichtingen.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3c
  - number: 3d
    text: Bij algemene maatregel van bestuur worden met het oog op een goede kwaliteit van de inrichtingen regels gesteld.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel3d
  - number: '4.1'
    text: |-
      De directeur stelt in aanvulling op de bij of krachtens deze wet gestelde regels en met inachtneming van het
      dienaangaande door Onze Minister vast te stellen model en door deze te geven aanwijzingen huisregels voor de
      inrichting of afdeling vast.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
  - number: '4.2'
    text: |-
      De directeur kan personeelsleden en medewerkers machtigen tot de uitoefening van hem bij of krachtens deze wet
      gegeven bevoegdheden en de naleving van zijn zorgplichten, met uitzondering van de bevoegdheden, genoemd in het
      eerste en vierde lid.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
  - number: '4.3'
    text: 'De directeur is bevoegd aan de jeugdigen aanwijzingen te geven, voor zover zulks noodzakelijk is in het belang van:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
  - number: 4.3.a
    text: de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
  - number: 4.3.b
    text: een ongestoorde tenuitvoerlegging van de vrijheidsbeneming;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
  - number: 4.3.c
    text: hun geestelijke of lichamelijke ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
  - number: 4.3.d
    text: de uitvoering van het perspectiefplan.
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
  - number: '4.4'
    text: 'Aan de directeur is voorbehouden de beslissing omtrent:'
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
  - number: 4.4.a
    text: de deelname aan en beëindiging van de deelname aan een scholings- en trainingsprogramma;
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
  - number: 4.4.b
    text: |-
      de onderbrenging van een kind in een inrichting als bedoeld in [artikel 16, eerste en vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel13
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
    references:
      - id: ref1
