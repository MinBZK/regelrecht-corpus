  - number: 4.4.k
    text: |-
      de bevestiging van mechanische middelen, bedoeld in [artikel 38, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel38
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel4
    references:
      - id: ref1
