  - number: 80b.e
    text: |-
      de [artikelen 22 tot en met 22b][ref1], voorzover dit dienstig is aan een experiment waarbij de jeugdige in een
      inrichting, afdeling of plaats met een bijzondere bestemming als bedoeld in [artikel 8, derde lid][ref2], verblijft
      en voor zover dit in het belang is van de opvoeding of de behandeling van de jeugdige;


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel8
    url: https://wetten.overheid.nl/BWBR0011756/2020-01-01#Artikel80b
