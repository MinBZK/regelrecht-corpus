  - number: '10'
    text: |-
      1 De kosten voor de regiegroep komen, voor zover goedgekeurd, voor rekening van de minister.

      2 Onder kosten worden in ieder geval verstaan:

      a. de kosten voor vergaderingen, voor secretariële ondersteuning, huisvesting en uitvoering;

      b. de kosten voor het inschakelen van externe deskundigheid en het laten verrichten van onderzoek;

      c. de kosten voor publicatie van rapportages.

      3 De regiegroep biedt zo spoedig mogelijk na zijn instelling een begroting en een planning aan de minister aan.
    url: https://wetten.overheid.nl/BWBR0025596/2009-04-05#Artikel10
  - number: '11'
    text: |-
      De regiegroep draagt zo spoedig mogelijk na beëindiging van zijn werkzaamheden of, zo de omstandigheden daartoe
      aanleiding geven, zoveel eerder de bescheiden betreffende die werkzaamheden over aan het archief van de directie
      Media, Letteren en Bibliotheken van het Ministerie van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0025596/2009-04-05#Artikel11
  - number: '12'
    text: |-
      De regiegroep neemt geheimhouding in acht ten aanzien van alle informatie die in het kader van dit besluit bekend
      wordt en waarvan het karakter als vertrouwelijk is aan te merken.
    url: https://wetten.overheid.nl/BWBR0025596/2009-04-05#Artikel12
