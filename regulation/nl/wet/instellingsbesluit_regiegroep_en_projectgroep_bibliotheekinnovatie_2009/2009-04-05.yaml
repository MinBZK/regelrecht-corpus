    text: |-
      In dit besluit wordt verstaan onder:

      a. *minister:* de Minister van Onderwijs, Cultuur en Wetenschap;

      b. *regiegroep:* de Regiegroep Bibliotheekinnovatie, bedoeld in [artikel 2][ref1];

      c. *projectgroep:* de Projectgroep Bibliotheekinnovatie, bedoeld in de [artikelen 7][ref2] en [8][ref3];

      d. *bestuurlijke afspraken:* de afspraken tussen de minister, Interprovinciaal Overleg (IPO) en Vereniging
      Nederlandse Gemeenten (VNG);

      e. *Adviescommissie Bibliotheekinnovatie:* de commissie, bedoeld in het
      [besluit van de Minister van OCW van 18 augustus 2008, nr. MLB/JZ/40984][ref4] (Stcrt. 2008, 165).


