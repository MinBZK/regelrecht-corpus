  - number: '2'
    text: |-
      1 Er is een Regiegroep Bibliotheekinnovatie.

      2 De regiegroep wordt ingesteld voor de duur van één jaar, te rekenen vanaf de datum van publicatie van dit
      besluit.

      3 De regiegroep heeft tot taak:

      a. het samenstellen van een projectgroep die de in [artikel 8][ref1] omschreven taken gaat uitvoeren, volgens de in
      [artikel 7][ref2] omschreven procedure;

      b. het vervullen van de regierol ten opzichte van de projectgroep;

      c. het bewaken van de inhoudelijke kaders van het proces van bibliotheekinnovatie in 2009, gebaseerd op het advies
      van de commissie bibliotheekinnovatie en de bestuurlijke afspraken van 15 december 2008;

      d. het vaststellen van het door de projectgroep opgestelde projectplan 2009 en de daarop gebaseerde begroting en
      het bewaken van de voortgang;

      e. het vaststellen van het inhoudelijke verslag over de voortgang van het bibliotheekinnovatieproces.


      [ref1]: https://wetten.overheid.nl/BWBR0025596#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025596#Artikel7
    url: https://wetten.overheid.nl/BWBR0025596/2009-04-05#Artikel2
    references:
