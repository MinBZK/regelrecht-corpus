        artikel: '7'
  - number: '3'
    text: |-
      Het inhoudelijke verslag van de regiegroep wordt binnen drie maanden na afloop van de

      instellingsperiode vastgesteld en terstond toegezonden aan de minister.
    url: https://wetten.overheid.nl/BWBR0025596/2009-04-05#Artikel3
  - number: '4'
    text: |-
      De regiegroep draagt zorg voor een goede overdracht van het ingezette innovatiebeleid, inclusief de door de
      projectgroep verrichtte werkzaamheden en de vergaarde kennis- en informatieoverdracht, aan het per 2010 nieuw in te
      stellen sectorinstituut voor de openbare bibliotheeksector.
    url: https://wetten.overheid.nl/BWBR0025596/2009-04-05#Artikel4
  - number: '5'
    text: |-
      1 De regiegroep bestaat uit drie leden:

      a. mevrouw M.J. Hammersma, directeur Media Letteren Bibliotheken, tevens voorzitter,

      b. de heer G.C. Reussink, bestuurslid van de Vereniging van Openbare Bibliotheken,

      c. mevrouw J. Calff, voorzitter van de Adviescommissie Bibliotheekinnovatie.

      2 Bij tussentijds vertrek van een lid kan de minister een ander lid benoemen.
    url: https://wetten.overheid.nl/BWBR0025596/2009-04-05#Artikel5
  - number: '6'
    text: |-
      1 De regiegroep stelt zijn eigen werkwijze vast.

      2 De regiegroep kan zich door andere personen doen bijstaan voor zover dat voor de vervulling van haar taak nodig
      is waaronder, op persoonlijke titel, ambtelijke deskundigen.

      3 Indien de regiegroep ten behoeve van zijn werk ambtelijke en/of andere deskundigen raadpleegt waaraan kosten zijn
      verbonden, dient voor vergoeding van deze kosten vooraf contact op te worden genomen met OCW.

      4 De regiegroep wordt bijgestaan door een ambtelijk secretaris van het ministerie van Onderwijs, Cultuur en
      Wetenschap.
    url: https://wetten.overheid.nl/BWBR0025596/2009-04-05#Artikel6
  - number: '7'
    text: |-
      1 Er is een Projectgroep Bibliotheekinnovatie.

      2 De projectgroep bestaat uit één programmamanager tevens kwartiermaker sectorinstituut en drie
      programmacoördinatoren.

      3 De regiegroep benoemt de programmamanager van de projectgroep.

      4 De projectgroep wordt ingesteld voor de duur van één jaar, te rekenen vanaf de datum van publicatie van dit
      besluit.

      5 De programmamanager stuurt de projectgroep aan en draagt eindverantwoordelijkheid voor het project.

      6 De programmamanager zorgt voor de inhoudelijke ondersteuning van de regiegroep.

      7 De programmamanager legt verantwoording af aan de regiegroep.
    url: https://wetten.overheid.nl/BWBR0025596/2009-04-05#Artikel7
  - number: '8'
    text: |-
      De projectgroep heeft tot taak:

      a. het opstellen van een projectplan met werkzaamheden voor 2009, rekening houdend met lopende initiatieven, op het
      terrein van bibliotheekinnovatie, in het land;

      b. het faciliteren en stimuleren van de uitvoering van het projectplan, onder meer door het initiëren van actieve
      kennisuitwisseling en communicatie tussen bibliotheekpartijen;

      c. het nauwlettend volgen van de voortgang van de uitvoering en het tijdig signaleren van knelpunten;

      d. het fungeren als aanspreek-, informatie-, en adviespunt voor de bibliotheekbranche wat betreft de
      bibliotheekinnovatie in 2009;

      e. het voorbereiden en opstellen van het eindverslag over het vernieuwingsproces in 2009.
    url: https://wetten.overheid.nl/BWBR0025596/2009-04-05#Artikel8
  - number: '9'
    text: |-
      1 De leden van de regiegroep, met uitzondering van de voorzitter, voor zover niet onder de
      uitzondering van [artikel 2, derde lid, van de Wet vergoedingen adviescolleges en commissies][ref1]
      vallende, ontvangen per vergadering een vergoeding op basis van
      [artikel 2, eerste lid, van de Wet vergoedingen adviescolleges en commissies][ref2] en
      [artikel 2 van het Besluit vergoedingen adviescolleges en commissies][ref3].

      2 De vergoeding per vergadering van de leden van de regiegroep, met uitzondering van de voorzitter, bedraagt 3% van
      het maximum van salarisschaal 18 van [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref4].

      3 De leden van de regiegroep, met uitzondering van de voorzitter, ontvangen een vergoeding van reis- en
      verblijfkosten op de voet van het Reisbesluit binnenland en het Reisbesluit buitenland.

      4 Twee of meer vergaderingen op dezelfde dag worden als één vergadering aangemerkt.


