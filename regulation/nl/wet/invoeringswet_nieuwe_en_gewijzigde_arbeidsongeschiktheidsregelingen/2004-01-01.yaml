  - number: XXIV.5
    text: |-
      Beschikkingen ten aanzien van de in het eerste lid bedoelde persoon, genomen met toepassing van
      bepalingen van de Algemene Arbeidsongeschiktheidswet, worden aangemerkt als beschikkingen op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: XXIV.6
    text: |-
      Betaling aan een persoon als bedoeld in het eerste lid, van een uitkering, waarop over een periode gelegen
      voor de dag van inwerkingtreding van deze wet op grond van de Algemene Arbeidsongeschiktheidswet recht
      bestond, met uitzondering van een uitkering op grond van de artikelen 57, 57a, 58 of 59b van de Algemene
      Arbeidsongeschiktheidswet, die plaatsvindt op of na de dag van inwerkingtreding van deze wet, wordt aangemerkt als
      betaling van een uitkering op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: XXIV.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot dit artikel voor
      gevallen waarin dit artikel niet voorziet, dan wel toepassing van dit artikel tot onbedoelde consequenties leidt.
      Deze regels kunnen onder meer inhouden:
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
  - number: XXIV.7.a
    text: |-
      de aanwijzing van andere categorieën personen, dan de in het eerste lid genoemde, op wie dit artikel van toepassing
      is;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
  - number: XXIV.7.b
    text: |-
      het buiten toepassing verklaren van meer artikelen van de Algemene Arbeidsongeschiktheidswet dan de in het
      tweede lid genoemde, dan wel in afwijking van het tweede lid, het alsnog van toepassing verklaren van een of meer
      artikelen in dat lid genoemd;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
  - number: XXIV.7.c
    text: |-
      het van toepassing verklaren van meer artikelen van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1] dan de in het vierde lid genoemde, dan wel in
      afwijking van het vierde lid, het alsnog buiten toepassing verklaren van een of meer artikelen in dat lid genoemd;


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: XXIV.7.d
    text: |-
      het geheel of gedeeltelijk buiten toepassing verklaren van artikelen van de Algemene Arbeidsongeschiktheidswet ten
      aanzien van bepaalde personen;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
  - number: XXIV.7.e
    text: |-
      het van toepassing verklaren van bepalingen van de Algemene Arbeidsongeschiktheidswet ten aanzien van bepaalde
      groepen van personen, anders dan uit het eerste tot en met derde lid voortvloeit.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
  - number: XXV.1
    text: |-
      Voor de persoon die als jonggehandicapte, bedoeld in
      [artikel 5 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1] recht krijgt op een
      arbeidsongeschiktheidsuitkering op grond van die wet blijft artikel 5 van de Algemene Arbeidsongeschiktheidswet,
      zoals dat artikel luidde op 31 juli 1993, van toepassing, indien hij op die dag recht had op een
      arbeidsongeschiktheidsuitkering op grond van artikel 6, eerste lid, onderdeel *b*, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel5
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXV
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '5'
  - number: XXV.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat voor gevallen waarin dit artikel niet voorziet, dan wel
      toepassing van dit artikel tot onbedoelde consequenties leidt, zonodig in afwijking van het eerste lid, artikelen
      van de Algemene Arbeidsongeschiktheidswet, zoals die artikelen luidden tot een bij die maatregel te bepalen datum,
      gelegen voor de datum van inwerkingtreding van deze wet, voor al dan niet bepaalde duur van toepassing blijven op
      een persoon als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXV
  - number: XXVI
    text: |-
      Voor de toepassing van de [artikelen 21][ref1] en
      [22 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2] wordt onder
      arbeidsongeschiktheidsuitkering tevens verstaan de arbeidsongeschiktheidsuitkering op grond van de Algemene
      Arbeidsongeschiktheidswet.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel22
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXVI
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '22'
  - number: XXVII.1
    text: |-
      In afwijking van [artikel 28, eerste lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1]
      wordt de periode van toekenning van een arbeidsongeschiktheidsuitkering tot een nader bij algemene maatregel van
      bestuur te bepalen tijdstip gesteld op vijf jaar. Bij algemene maatregel van bestuur kan voorts worden bepaald,
      dat na het in de eerste zin bedoelde tijdstip, tot nog een later tijdstip, een termijn van vier jaar in aanmerking
      wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel28
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXVII
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '28'
  - number: XXVII.2
    text: |-
      De wijziging van de termijn, bedoeld in het eerste lid, brengt geen wijziging in de termijnen, zoals die gelden
      terzake van arbeidsongeschiktheidsuitkeringen, die zijn toegekend of voortgezet op een tijdstip gelegen voor het
      tijdstip van wijziging van de termijn.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXVII
  - number: XXVIII
    text: |-
      Aaneensluitende verzekering op grond van de Algemene Arbeidsongeschiktheidswet en jonggehandicapt zijn in de zin
      van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1] wordt als één ononderbroken verzekering dan
      wel situatie van jonggehandicapt zijn aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXVIII
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: LVA
    text: |-
      Degene, die op de dag voor de inwerkingtreding van deze wet een arbeidsongeschiktheidsuitkering
      ingevolge de Algemene Arbeidsongeschiktheidswet ontving en ingevolge
      [artikel 16, tweede lid, onderdeel a, van de Wet op de toegang tot ziektekostenverzekeringen][ref1],
      zoals dat onderdeel luidde op de dag voorafgaande aan de dag met ingang waarvan deze wet in werking is
      getreden, niet verplicht verzekerd is ingevolge de [Ziekenfondswet][ref2], blijft zolang met toepassing
      van de [artikelen XII][ref3] en [XIII][ref4] een uitkering wordt ontvangen en de omstandigheden bedoeld in
      [artikel 16, tweede lid, onderdeel a, van de Wet op de toegang tot ziektekostenverzekeringen][ref5], zoals dat
      onderdeel luidde op de dag, voorafgaande aan de dag met ingang waarvan deze wet in werking is getreden, op hem van
      toepassing zijn, uitgezonderd van de verplichte verzekering ingevolge de [Ziekenfondswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003934#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002460
      [ref3]: https://wetten.overheid.nl/BWBR0008658#ArtikelXII
      [ref4]: https://wetten.overheid.nl/BWBR0008658#ArtikelXIII
      [ref5]: https://wetten.overheid.nl/BWBR0003934#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVA
    references:
      - id: ref1
        bwb_id: BWBR0003934
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002460
      - id: ref3
        bwb_id: BWBR0008658
        artikel: XII
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0008658
        artikel: XIII
        hoofdstuk: '3'
        paragraaf: '1'
