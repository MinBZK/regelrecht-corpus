    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVII
  - number: LVII.3.d
    text: |-
      de [Toeslagenwet][ref1] over de toeslag op een uitkering op grond van de in de onderdelen *a* tot en met *c*
      genoemde wetten;


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVII
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: LVII.3.e
    text: |-
      de [Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006072
