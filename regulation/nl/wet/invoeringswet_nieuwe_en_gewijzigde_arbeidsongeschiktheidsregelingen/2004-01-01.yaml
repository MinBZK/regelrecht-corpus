  - number: LVII.3
    text: |-
      Indien de datum van inwerkingtreding als bedoeld in het tweede lid is gelegen na 1 januari 1997, is
      [afdeling 7.1. van de Algemene wet bestuursrecht][ref1] tot die datum niet van toepassing op besluiten, die geen
      betrekking hebben op de verzekeringsplicht of de verschuldigde premie op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling7.1
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVII
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '7.1'
  - number: LVII.3.a
    text: |-
      de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVII
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: LVII.3.b
    text: |-
      de [Ziektewet][ref1];

