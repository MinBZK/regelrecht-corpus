    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelI
  - number: I.3
    text: |-
      Onder «Algemene Arbeidsongeschiktheidswet» wordt verstaan: de Algemene Arbeidsongeschiktheidswet en de daarop
      berustende bepalingen, zoals die wet en die bepalingen luidden op de dag voorafgaand aan de inwerkingtreding
      van deze wet, met inbegrip van alle bij of krachtens wet met betrekking tot bepalingen van de Algemene
      Arbeidsongeschiktheidswet getroffen invoerings- en overgangsbepalingen die op die dag van kracht waren.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelI
  - number: II.1
    text: |-
      De Algemene Arbeidsongeschiktheidswet wordt ingetrokken, onverminderd de [artikelen VIII, zesde lid][ref1],
      [IX][ref2], [XIII][ref3], [XIV][ref4], [XXIV][ref5] en [XXV][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0008658#ArtikelVIII
      [ref2]: https://wetten.overheid.nl/BWBR0008658#ArtikelIX
