  - number: II.2
    text: |-
      De intrekking van de Algemene Arbeidsongeschiktheidswet, bedoeld in het eerste lid, geldt met uitzondering van
      artikel 4, in combinatie met de artikelen 57, 57a, 58 en 59b, van die wet. Voor bepaalde categorieën van werknemers
      kan bij wet worden bepaald dat de uitzondering, bedoeld in de eerste zin, mede andere artikelen van de Algemene
      Arbeidsongeschiktheidswet betreft, in combinatie met de artikelen 57, 57a, 58 en 59b, van die wet.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelII
  - number: II.3
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de toepasselijkheid van de Algemene Arbeidsongeschiktheidswet,
      bedoeld in het tweede lid, met betrekking tot voorzieningen op grond van artikel 57, eerste en tweede lid,
      onderdelen b en c, van die wet, met ingang van een bij die regeling te bepalen datum eindigt.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelII
  - number: II.4
    text: |-
      De algemene maatregel van bestuur, op grond van artikel 43 van de Algemene
      Arbeidsongeschiktheidswet getroffen, berust na de inwerkingtreding van deze wet op
      [artikel 59, achtste lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] en
      [artikel 51, negende lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel51
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '51'
  - number: III
    text: |-
      [Titel 4.2. van de Algemene wet bestuursrecht][ref1] is niet van toepassing op aanspraken uit hoofde van de in
      [artikel II, tweede lid][ref2], genoemde artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0008658#ArtikelII
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0008658
        artikel: II
        hoofdstuk: '1'
  - number: IV.1
    text: |-
      [Artikel 81, eerste lid, onderdeel c, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], zoals dat luidt op
      de dag van inwerkingtreding van deze wet, is tevens van toepassing op een persoon als bedoeld in dat onderdeel, die
      voor de dag van inwerkingtreding van deze wet, doch niet eerder dan 21 april 1997, de aldaar bedoelde werkzaamheden
      is gaan uitoefenen en overigens voldoet aan de in dat onderdeel gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
  - number: IV.2
    text: |-
      In afwijking van [artikel 83, eerste lid, onderdeel a, van de Wet op de arbeidsongeschiktheidsverzekering][ref1]
      wordt het verzoek om toelating tot de vrijwillige verzekering door de in het eerste lid bedoelde persoon gedaan
      binnen drie maanden, te rekenen vanaf de datum van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel83
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '83'
  - number: IV.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing met betrekking tot de vrijwillige verzekering
      op grond van de [Ziektewet][ref1], met dien verstande dat in plaats van het in het eerste lid genoemde
      [artikel 81, eerste lid, onderdeel c, van de Wet op de arbeidsongeschiktheidsverzekering][ref2] wordt gelezen
      «[artikel 64, eerste lid, onderdeel c, van de Ziektewet][ref3]» en dat in plaats van het in het tweede lid genoemde
      [artikel 83, eerste lid, onderdeel a, van de Wet op de arbeidsongeschiktheidsverzekering][ref4] wordt gelezen
      «[artikel 66, eerste lid, onderdeel a, van de Ziektewet][ref5]».


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel64
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel83
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel66
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '81'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '64'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '83'
      - id: ref5
        bwb_id: BWBR0001888
        artikel: '66'
  - number: V.1
    text: |-
      Beschikkingen van het Uitvoeringsinstituut werknemersverzekeringen op grond van artikel 59a
      van de Algemene Arbeidsongeschiktheidswet worden aangemerkt als beschikkingen op grond van
      [artikel 81, tweede lid, onderdeel b, van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '81'
  - number: V.2
    text: |-
      Op verzoek van een belanghebbende, die als gevolg van de overgang van de vrijwillige verzekering op grond
      van artikel 59a van de Algemene Arbeidsongeschiktheidswet naar de vrijwillige verzekering op grond van
      [Hoofdstuk VI van de Wet op de arbeidsongeschiktheidsverzekering][ref1], met ingang van de dag van inwerkingtreding
      van deze wet:


      [ref1]: https://wetten.overheid.nl/BWBR0002524#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0002524
        hoofdstuk: VI
  - number: V.2.a
    text: |-
      een dagloon heeft op grond van
      [artikel 84, eerste lid, onderdeel b van de Wet op de arbeidsongeschiktheidsverzekering][ref1], dat lager
      is dan de grondslag waarnaar zijn arbeidsongeschiktheidsuitkering zou zijn berekend op grond van de Algemene
      Arbeidsongeschiktheidswet, of


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel84
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '84'
  - number: V.2.b
    text: |-
      een premie is verschuldigd op grond van
      [artikel 84, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], die hoger
      is dan de premie die hij op grond van de Algemene Arbeidsongeschiktheidswet was verschuldigd
      op de dag voorafgaand aan de inwerkingtreding van deze wet; stelt het Uitvoeringsinstituut
      werknemersverzekeringen gedurende een periode van vijf jaar vanaf de dag van inwerkingtreding
      van deze wet, een ander dagloon of een ander premiebedrag vast dan als bedoeld in
      [artikel 84, eerste lid, onderdeel b en derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel84
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '84'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '84'
  - number: V.3
    text: |-
      De vaststelling van het andere dagloon, bedoeld in het tweede lid, geschiedt zodanig dat het bedrag dat ten
      grondslag zou liggen aan de uitkering op grond van de Algemene Arbeidsongeschiktheidswet, indien betrokkene op de
      dag voorafgaande aan de inwerkingtreding van deze wet recht zou hebben gehad op een uitkering op grond van die wet,
      elk jaar na de inwerkingtreding van deze wet geleidelijk lager wordt vastgesteld. De vaststelling van het andere
      premiebedrag, bedoeld in het tweede lid, geschiedt zodanig dat het premiebedrag, zoals dat op grond van de Algemene
      Arbeidsongeschiktheidswet ten aanzien van betrokkene gold op de dag voorafgaande aan de inwerkingtreding van deze
      wet, elk jaar na de inwerkingtreding van deze wet geleidelijk hoger wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelV
  - number: V.4
    text: |-
      Uiterlijk met ingang van de dag gelegen vijf jaar na inwerkingtreding van deze wet worden het
      dagloon en de premie voor de belanghebbende, bedoeld in het tweede lid, vastgesteld op grond van
      [artikel 84, eerste lid, onderdeel b, en derde lid van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel84
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '84'
  - number: V.5
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het tweede en derde lid. Bij die regels kan voor
      situaties, waarin het tweede of derde lid onvoldoende voorziet, worden afgeweken van die leden.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelV
  - number: VI
    text: |-
      De persoon die op de dag voor inwerkingtreding van deze wet recht had op verhoging van de
      arbeidsongeschiktheidsuitkering op grond van [artikel 46][ref1], behoudt deze verhoging zolang hij daar
      op grond van dat artikel recht op zou hebben als dat artikel en de Algemene Arbeidsongeschiktheidswet
      nog van kracht zouden zijn geweest. De verhoging wordt aangemerkt als uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel46a
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 46a
      - id: ref2
        bwb_id: BWBR0002524
  - number: VIA
    text: |-
      De algemene maatregel van bestuur, op grond van [artikel 52 van de Wet op de arbeidsongeschiktheidsverzekering][ref1],
      zoals dat artikel luidde op de dag voorafgaande aan de inwerkingtreding van de
      [Wet premiedifferentiatie en marktwerking bij arbeidsongeschiktheidsverzekeringen][ref2], getroffen, berust na de
      inwerkingtreding van die wet op [artikel 65, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0008655
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel65
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelVIA
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0008655
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '65'
  - number: VII
    text: |-
      [Artikel 84][ref1], zoals dat artikel luidde op de dag voorafgaand aan de inwerkingtreding van deze wet, blijft van
      toepassing op de persoon, bedoeld in [artikel XII][ref2], ten aanzien van wie de Algemene Arbeidsongeschiktheidswet
      op grond van [artikel XIII][ref3] van toepassing blijft, met dien verstande dat in [artikel 84][ref4] in plaats van
      «Algemene Arbeidsongeschiktheidswet» wordt gelezen: [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel84a
      [ref2]: https://wetten.overheid.nl/BWBR0008658#ArtikelXII
      [ref3]: https://wetten.overheid.nl/BWBR0008658#ArtikelXIII
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel84a
      [ref5]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 84a
      - id: ref2
        bwb_id: BWBR0008658
        artikel: XII
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008658
        artikel: XIII
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 84a
      - id: ref5
        bwb_id: BWBR0008656
  - number: VIII.1
    text: |-
      Met uitzondering van de vermogensbestanddelen die noodzakelijk zijn ter financiering van de toekenningen in het
      kader van de besluiten van het Landelijk instituut sociale verzekeringen op grond van de artikelen 57, 57a, 58
      en 59b van de Algemene Arbeidsongeschiktheidswet, met inbegrip van kosten van uitvoering, beheer en administratie
      van die besluiten, gaan alle vermogensbestanddelen die door het Landelijk instituut sociale verzekeringen
      afzonderlijk worden beheerd en geadministreerd in de vorm van het Algemeen Arbeidsongeschiktheidsfonds, over op het
      Arbeidsongeschiktheidsfonds en het Arbeidsongeschiktheidsfonds zelfstandigen, overeenkomstig door Onze Minister te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelVIII
  - number: VIII.2
    text: |-
      De bepalingen, betrekking hebbend op het beheer en de administratie van het Algemeen Arbeidsongeschiktheidsfonds,
      zoals die voor de datum van inwerkingtreding van deze wet in de Organisatiewet sociale verzekeringen 1997 en
      de [Wet financiering volksverzekeringen][ref1] voorkomen, blijven van kracht voor zolang dit beheer en deze
      administratie nog plaatsvinden ter uitvoering van hetgeen bij en krachtens het eerste lid is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004538
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelVIII
    references:
      - id: ref1
        bwb_id: BWBR0004538
  - number: IX
    text: |-
      De op basis van artikel 8, derde lid, van de Algemene Arbeidsongeschiktheidswet bij het Uitvoeringsinstituut
      werknemersverzekeringen ingediende declaraties die op de datum van inwerkingtreding van deze wet nog niet zijn
      afgehandeld worden met ingang van die datum afgehandeld door het Uitvoeringsinstituut werknemersverzekeringen ten
      laste van het Algemeen Arbeidsongeschiktheidsfonds.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelIX
  - number: X.1
    text: |-
      [Artikel 17, eerste lid, onderdeel c, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1] is niet
      van toepassing ten aanzien van de jonggehandicapte die op de dag vóór de inwerkingtreding van deze wet recht had
      op arbeidsongeschiktheidsuitkering op grond van de Algemene Arbeidsongeschiktheidswet en niet in Nederland woonde,
      zolang laatstgenoemde omstandigheid voortduurt.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel17
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '17'
  - number: X.2
    text: |-
      Het eerste lid is eveneens van toepassing ten aanzien van de in dat lid genoemde jonggehandicapte die na de
      inwerkingtreding van deze wet, maar voor 1 januari 2003, in Nederland is gaan wonen en vervolgens weer niet in
      Nederland is gaan wonen, zolang laatstgenoemde omstandigheid voorduurt.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelX
  - number: XI
    text: |-
      Voor de toepassing van [artikel 29][ref1], zoals dit artikellid luidt na inwerkingtreding van deze wet, wordt een
      uitkering op grond van de Algemene Arbeidsongeschiktheidswet of de wachttijd van 52 weken, bedoeld in artikel 6
      van de Algemene Arbeidsongeschiktheidswet, genoten of doorgemaakt voor de dag van inwerkingtreding van deze wet,
      aangemerkt als uitkering of wachttijd als bedoeld in een wet, genoemd in [artikel 29][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29b
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 29b
  - number: XIA
    text: |-
      [Artikel 90, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], zoals dat luidt na
      inwerkingtreding van de [Wet premiedifferentiatie en marktwerking bij arbeidsongeschiktheidsverzekeringen][ref2],
      is slechts van toepassing op arbeidsongeschiktheid die is ingetreden op of na de dag van inwerkingtreding van die
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0008655
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIA
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '90'
      - id: ref2
        bwb_id: BWBR0008655
  - number: XII.1
    text: |-
      De bepalingen van deze paragraaf zijn uitsluitend van toepassing op personen die op de dag voorafgaand aan de
      inwerkingtreding van deze wet waren verzekerd op grond van de Algemene Arbeidsongeschiktheidswet en op wie een
      omstandigheid als bedoeld in artikel XIII van toepassing is, welke omstandigheid rechtstreeks voortvloeit uit het
      hebben verworven van winst of inkomsten uit werkzaamheden verricht in het bedrijfs- en beroepsleven als:
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXII
  - number: XII.1.a
    text: zelfstandige;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXII
  - number: XII.1.b
    text: meewerkende echtgenoot;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXII
  - number: XII.1.c
    text: |-
      verzekerde op grond van de Algemene Arbeidsongeschiktheidswet, zonder dat met betrekking tot deze werkzaamheden een
      andere wettelijke regeling inzake tegemoetkoming in de geldelijke gevolgen van langdurige arbeidsongeschiktheid op
      hem van toepassing was.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXII
  - number: XII.2
    text: |-
      Als zelfstandige dan wel als meewerkende echtgenoot wordt aangemerkt de persoon die op grond van de Algemene
      Arbeidsongeschiktheidswet winst geniet uit bedrijf of zelfstandig uitgeoefend beroep of twee personen die op grond
      van de Algemene Arbeidsongeschiktheidswet echtgenoten van elkaar zijn en samenwerken in de uitoefening van een
      bedrijf of in de zelfstandige uitoefening van een beroep, waarbij ieder van de echtgenoten een deel van de winst
      geniet.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXII
  - number: XIII.1
    text: |-
      De Algemene Arbeidsongeschiktheidswet, zoals die wet op de dag voorafgaand aan de inwerkingtreding van deze wet
      te zijnen aanzien gold, blijft, met uitzondering van de in het tweede lid genoemde artikelen, van toepassing op
      de persoon:
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
  - number: XIII.1.a
    text: |-
      wiens arbeidsongeschiktheid in de zin van de Algemene Arbeidsongeschiktheidswet voor de datum van inwerkingtreding
      van deze wet is ingetreden en uitsluitend omdat de wachttijd, bedoeld in artikel 6, eerste lid, van die
      wet nog niet was verstreken, op de dag voorafgaand aan de inwerkingtreding van deze wet geen recht op
      arbeidsongeschiktheidsuitkering had, met betrekking tot het recht op arbeidsongeschiktheidsuitkering, onmiddellijk
      na afloop van het in dat lid genoemde tijdvak van 52 weken of binnen vier weken na afloop van dat tijdvak;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
  - number: XIII.1.b
    text: |-
      die op de dag voorafgaand aan de inwerkingtreding van deze wet recht had op een arbeidsongeschiktheidsuitkering op
      grond van de Algemene Arbeidsongeschiktheidswet, met betrekking tot dat recht;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
  - number: XIII.1.d
    text: |-
      die op de dag voorafgaand aan de inwerkingtreding van deze wet geen recht op arbeidsongeschiktheidsuitkering op
      grond van de Algemene Arbeidsongeschiktheidswet had, doch met toepassing van artikel 32a, 37 of 38 van die wet in
      aanmerking zou komen voor toekenning of heropening van de arbeidsongeschiktheidsuitkering, met betrekking tot die
      arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
  - number: XIII.1.e
    text: |-
      wiens arbeidsongeschiktheid in de zin van de Algemene Arbeidsongeschiktheidswet voor de dag van inwerkingtreding
      van deze wet is ingetreden en voor wie de wachttijd, bedoeld in artikel 6, eerste lid, van die wet op die dag
      was verstreken, doch die op die dag geen recht had op een arbeidsongeschiktheidsuitkering op grond van die
      wet, uitsluitend omdat een aanvraag tot toekenning van die uitkering niet was ingediend, met betrekking tot die
      arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
  - number: XIII.2
    text: |-
      De artikelen 3a, 10, tweede, vijfde, zevende en achtste lid, 12, eerste lid, 13, 14, 15, 16, 17, 18,
      19, 20, 20a, 20b, 20c, 20d, 20e, 20f, 20g, 25, 26a, 27, 28, 29, 29a , 30, 31, 32, 32a, 33, 37, 39, 40,
      41, 41a, 44, 45, 47, 48, 48a, 48b, 50, 52, 53, 55, 56, 61, 62, 63, 65, 78, 86, 87 en 88 van de Algemene
      Arbeidsongeschiktheidswet blijven niet van toepassing op de in het eerste lid bedoelde persoon. Artikel
      36a blijft niet van toepassing voorzover de hoogte van de arbeidsongeschiktheidsuitkering op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] de arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] overtreft, tenzij [artikel VI][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0008656
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008658#ArtikelVI
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
    references:
      - id: ref1
        bwb_id: BWBR0008656
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008658
        artikel: VI
        hoofdstuk: '2'
  - number: XIII.3
    text: |-
      De toepasselijkheid van de Algemene Arbeidsongeschiktheidswet eindigt indien een persoon niet of niet langer in
      aanmerking komt voor toekenning of heropening van zijn recht op arbeidsongeschiktheidsuitkering, anders dan op
      grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
  - number: XIII.4
    text: |-
      Ten aanzien van de in het eerste lid bedoelde persoon zijn uitsluitend de [artikelen 7b][ref1],
      [8, zevende, achtste, negende en tiende lid][ref2], [9, eerste lid][ref3], [10][ref4], [12, vijfde lid][ref5],
