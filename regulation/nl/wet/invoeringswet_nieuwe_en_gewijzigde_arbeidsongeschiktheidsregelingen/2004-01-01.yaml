  - number: XIII.5
    text: |-
      Beschikkingen ten aanzien van de in het eerste lid bedoelde persoon, genomen met toepassing van
      bepalingen van de Algemene Arbeidsongeschiktheidswet, worden aangemerkt als beschikkingen op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: XIII.6
    text: |-
      De persoon, bedoeld in het eerste lid, ten aanzien van wie geen beschikking als bedoeld in het vijfde lid
      is genomen, wordt vanaf de dag van inwerkingtreding van deze wet aangemerkt als verzekerde in de zin van
      [artikel 3, tweede lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
  - number: XIII.7
    text: |-
      Betaling aan een persoon als bedoeld in het eerste lid, van een uitkering, waarop over een periode gelegen
      voor de dag van inwerkingtreding van deze wet op grond van de Algemene Arbeidsongeschiktheidswet recht
      bestond, met uitzondering van een uitkering op grond van de artikelen 57, 57a, 58 of 59b van de Algemene
      Arbeidsongeschiktheidswet, die plaatsvindt op of na de dag van inwerkingtreding van deze wet, wordt aangemerkt als
      betaling van een uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: XIII.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot dit artikel voor
      gevallen waarin dit artikel niet voorziet, dan wel toepassing van dit artikel tot onbedoelde consequenties leidt.
      Deze regels kunnen onder meer inhouden:
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
  - number: XIII.8.a
    text: |-
      de aanwijzing van andere categorieën personen, dan de in het eerste lid genoemde, op wie dit artikel mede van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
  - number: XIII.8.b
    text: |-
      het buiten toepassing verklaren van meer artikelen van de Algemene Arbeidsongeschiktheidswet dan de in het
      tweede lid genoemde, dan wel in afwijking van het tweede lid, het alsnog van toepassing verklaren van een of meer
      artikelen in dat lid genoemd;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
  - number: XIII.8.c
    text: |-
      het van toepassing verklaren van meer artikelen van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1]
      dan de in het vierde lid genoemde, dan wel in afwijking van het vierde lid, het alsnog buiten toepassing verklaren
      van een of meer artikelen in dat lid genoemd;


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: XIII.8.d
    text: |-
      het geheel of gedeeltelijk buiten toepassing verklaren van artikelen van de Algemene Arbeidsongeschiktheidswet ten
      aanzien van bepaalde personen;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
  - number: XIII.8.e
    text: |-
      het van toepassing verklaren van bepalingen van de Algemene Arbeidsongeschiktheidswet ten aanzien van bepaalde
      groepen van personen, anders dan uit het eerste tot en met derde lid voortvloeit.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIII
  - number: XIV.1
    text: |-
      Voor een persoon die als verzekerde, bedoeld in
      [artikel 3, eerste lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1], recht krijgt op een
      arbeidsongeschiktheidsuitkering op grond van die wet, blijven:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIV
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
  - number: XIV.1.a
    text: |-
      de artikelen 5, 12, tweede tot en met vierde lid, en 23, van de Algemene Arbeidsongeschiktheidswet,
      zoals die artikelen luidden op 31 december 1986, van toepassing, indien hij op die dag recht had op een
      arbeidsongeschiktheidsuitkering en op 1 augustus 1993 de leeftijd van 45 jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIV
  - number: XIV.1.b
    text: |-
      indien onderdeel *a* niet van toepassing is, artikel 5 van de Algemene Arbeidsongeschiktheidswet, zoals dat artikel
      luidde op 31 juli 1993, van toepassing, indien hij op die dag recht had op een arbeidsongeschiktheidsuitkering en
      op 1 augustus 1993 de leeftijd van 45 jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIV
  - number: XIV.1.c
    text: |-
      de artikelen 24 en 26 van de Algemene Arbeidsongeschiktheidswet, zoals die artikelen luidden op 31 juli 1993,
      van toepassing, indien hij op die dag recht had op een arbeidsongeschiktheidsuitkering en op 1 augustus 1993 de
      leeftijd van 50 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIV
  - number: XIV.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat voor gevallen waarin dit artikel niet voorziet, dan wel
      toepassing van dit artikel tot onbedoelde consequenties leidt, zonodig in afwijking van het eerste lid, artikelen
      van de Algemene Arbeidsongeschiktheidswet, zoals die artikelen luidden tot een bij die maatregel te bepalen datum,
      gelegen voor de datum van inwerkingtreding van deze wet, voor al dan niet bepaalde duur van toepassing blijven op
      een persoon als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIV
  - number: XVIII
    text: |-
      De vrouw die verzekerd is op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] heeft recht
      op uitkering in verband met haar bevalling, indien haar bevalling op of na de dag van inwerkingtreding van deze
      wet plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXVIII
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: XIX
    text: |-
      Ten aanzien van de vrouw die vanaf de dag van inwerkingtreding van deze wet op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] is verzekerd en wier bevalling blijkens een verklaring
      van een arts of verloskundige binnen drie maanden na de dag van inwerkingtreding van deze wet is te verwachten
      blijft [artikel 34 van die wet][ref2] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel34
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXIX
    references:
      - id: ref1
        bwb_id: BWBR0008656
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '34'
  - number: XX
    text: |-
      Voor de toepassing van de [artikelen 25][ref1] en
      [26 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] wordt onder arbeidsongeschiktheidsuitkering
      of uitkering in verband met bevalling, tevens verstaan de arbeidsongeschiktheidsuitkering op grond van de Algemene
      Arbeidsongeschiktheidswet.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel26
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXX
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '26'
  - number: XXI.1
    text: |-
      In afwijking van [artikel 35, eerste lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] wordt
      het tijdvak van toekenning van een arbeidsongeschiktheidsuitkering tot een nader bij algemene maatregel van bestuur
      te bepalen tijdstip gesteld op vijf jaar. Bij algemene maatregel van bestuur kan voorts worden bepaald, dat na
      het in de eerste zin bedoelde tijdstip, tot nog een later tijdstip, een tijdvak van vier jaar in aanmerking wordt
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel35
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXI
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '35'
  - number: XXI.2
    text: |-
      De wijziging van het tijdvak, bedoeld in het eerste lid, brengt geen wijziging in de tijdvakken, zoals die gelden
      terzake van arbeidsongeschiktheidsuitkeringen, die zijn toegekend of voortgezet op een tijdstip gelegen voor het
      tijdstip van wijziging van het tijdvak.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXI
  - number: XXII
    text: |-
      Aaneensluitende verzekeringen op grond van de Algemene Arbeidsongeschiktheidswet en op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] gelden als één verzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXII
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: XXIII.1
    text: |-
      De bepalingen van deze paragraaf zijn uitsluitend van toepassing op de persoon die op de dag voorafgaand aan de
      inwerkingtreding van deze wet:
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIII
  - number: XXIII.1.a
    text: |-
      verzekerd was op grond van de Algemene Arbeidsongeschiktheidswet, zonder dat terzake van een op hem betrekking
      hebbende situatie als bedoeld in [artikel XXIV][ref1], enige andere wettelijke regeling inzake tegemoetkoming in de
      geldelijke gevolgen van langdurige arbeidsongeschiktheid op hem van toepassing was;


      [ref1]: https://wetten.overheid.nl/BWBR0008658#ArtikelXXIV
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIII
    references:
      - id: ref1
        bwb_id: BWBR0008658
        artikel: XXIV
        hoofdstuk: '4'
        paragraaf: '1'
  - number: XXIII.1.b
    text: |-
      op wie op die dag een situatie als bedoeld in [artikel XXIV][ref1] van toepassing was; en


      [ref1]: https://wetten.overheid.nl/BWBR0008658#ArtikelXXIV
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIII
    references:
      - id: ref1
        bwb_id: BWBR0008658
        artikel: XXIV
        hoofdstuk: '4'
        paragraaf: '1'
  - number: XXIII.1.c
    text: |-
      op wie [artikel XII][ref1] niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0008658#ArtikelXII
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIII
    references:
      - id: ref1
        bwb_id: BWBR0008658
        artikel: XII
        hoofdstuk: '3'
        paragraaf: '1'
  - number: XXIII.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, wordt mede als verzekerd op grond van de Algemene
      Arbeidsongeschiktheidswet aangemerkt de persoon die op de dag voorafgaand aan de inwerkingtreding van deze wet
      recht had op uitkering op grond van de Algemene Arbeidsongeschiktheidswet, doch op grond van die wet en de daarop
      berustende bepalingen niet als verzekerde werd aangemerkt.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIII
  - number: XXIV.1
    text: |-
      De Algemene Arbeidsongeschiktheidswet, zoals die wet op de dag voorafgaand aan de inwerkingtreding van deze wet
      te zijnen aanzien gold, blijft, met uitzondering van de in het tweede lid genoemde artikelen, van toepassing op
      de persoon:
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
  - number: XXIV.1.a
    text: |-
      wiens arbeidsongeschiktheid in de zin van de Algemene Arbeidsongeschiktheidswet voor de datum van inwerkingtreding
      van deze wet is ingetreden en uitsluitend omdat de wachttijd, bedoeld in artikel 6, eerste lid, van die
      wet nog niet was verstreken, op de dag voorafgaand aan de inwerkingtreding van deze wet geen recht op
      arbeidsongeschiktheidsuitkering had, met betrekking tot het recht op arbeidsongeschiktheidsuitkering, onmiddellijk
      na afloop van het in dat lid genoemde tijdvak van 52 weken of binnen vier weken na afloop van dat tijdvak;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
  - number: XXIV.1.b
    text: |-
      die op de dag voorafgaand aan de inwerkingtreding van deze wet recht had op een arbeidsongeschiktheidsuitkering op
      grond van de Algemene Arbeidsongeschiktheidswet, met betrekking tot dat recht;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
  - number: XXIV.1.d
    text: |-
      die op de dag voorafgaand aan de inwerkingtreding van deze wet geen recht op arbeidsongeschiktheidsuitkering op
      grond van de Algemene Arbeidsongeschiktheidswet had, doch met toepassing van artikel 32a, 37 of 38 van die wet in
      aanmerking zou komen voor toekenning of heropening van de arbeidsongeschiktheidsuitkering, met betrekking tot die
      arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
  - number: XXIV.1.e
    text: |-
      wiens arbeidsongeschiktheid in de zin van de Algemene Arbeidsongeschiktheidswet voor de dag van inwerkingtreding
      van deze wet is ingetreden en voor wie de wachttijd, bedoeld in artikel 6, eerste lid, van die wet op die dag
      was verstreken, doch die op die dag geen recht had op een arbeidsongeschiktheidsuitkering op grond van die
      wet, uitsluitend omdat een aanvraag tot toekenning van die uitkering niet was ingediend, met betrekking tot die
      arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
  - number: XXIV.2
    text: |-
      De artikelen 3a, 10, tweede, vijfde, zevende en achtste lid, 12, 13, 14, 15, 16, 17, 18, 19, 20, 20a, 20b, 20c,
      20d, 20e, 20f, 20g, 25, 26a, 27, 28, 29, 29a, 30, 31, 32, 32a, 33, 37, 39, 40, 41, 41a, 43, 44, 45, 47, 48, 48a,
      48b, 50, 52, 53, 55, 56, 61, 62, 63, 65, 78, 86, 87 en 88 van de Algemene Arbeidsongeschiktheidswet blijven niet
      van toepassing op de in het eerste lid bedoelde persoon.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
  - number: XXIV.3
    text: |-
      De toepasselijkheid van de Algemene Arbeidsongeschiktheidswet eindigt indien een persoon niet of niet langer in
      aanmerking komt voor toekenning of heropening van zijn recht op arbeidsongeschiktheidsuitkering, anders dan op
      grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelXXIV
  - number: XXIV.4
    text: |-
      Ten aanzien van de in het eerste lid bedoelde persoon zijn uitsluitend de [artikelen 6b][ref1],
      [7][ref2], [8][ref3], [9][ref4], [11, vijfde lid][ref5], [12][ref6], [13][ref7], [14][ref8],
      [15][ref9], [16][ref10], [17][ref11], [18][ref12], [19][ref13], [20][ref14], [21][ref15], [22][ref16],
      [23][ref17], [27][ref18], [29][ref19], [30][ref20], [31][ref21], [33][ref22], [34][ref23],
      [35][ref24], [36][ref25], [37][ref26], [38][ref27], [39][ref28], [40][ref29], [41][ref30], [42][ref31],
      [43][ref32], [44][ref33], [45][ref34], [46][ref35], [47][ref36], [48][ref37], [49][ref38], [50][ref39],
      [51][ref40], [52][ref41], [53][ref42], [54][ref43], [55][ref44], [56][ref45], [57][ref46], [58][ref47],
      [59][ref48], [62][ref49], [66][ref50], [66a][ref51], [68][ref52], [73][ref53], [74][ref54] en
      [75 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref55] van toepassing.


