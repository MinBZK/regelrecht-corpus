        bwb_id: BWBR0003934
        artikel: '16'
      - id: ref6
        bwb_id: BWBR0002460
  - number: LVI.1
    text: |-
      Met betrekking tot de mogelijkheid tot het maken van bezwaar en het instellen van beroep tegen besluiten, die geen
      betrekking hebben op het verzekerd zijn of op de verschuldigde premie, op grond van:
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVI
  - number: LVI.1.a
    text: |-
      de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVI
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: LVI.1.b
    text: |-
      de [Ziektewet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVI
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: LVI.1.c
    text: de Algemene Arbeidsongeschiktheidswet met uitzondering van de artikelen 57, 57*a* en 58;
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVI
  - number: LVI.1.d
    text: |-
      de [Toeslagenwet][ref1] over de toeslag op een uitkering op grond van de in de onderdelen *a* tot en met *c*
      genoemde wetten;


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVI
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: LVI.1.e
    text: |-
      de [Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref1]; die zijn bekendgemaakt voor de
      datum van inwerkingtreding als bedoeld in [artikel LVII, tweede lid][ref2], blijven de wettelijke bepalingen van
      toepassing zoals deze golden voor die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0006072
      [ref2]: https://wetten.overheid.nl/BWBR0008658#ArtikelLVII
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVI
    references:
      - id: ref1
        bwb_id: BWBR0006072
      - id: ref2
        bwb_id: BWBR0008658
        artikel: LVII
        hoofdstuk: '6'
  - number: LVI.2
    text: |-
      Met betrekking tot de in het eerste lid bedoelde besluiten die zijn bekendgemaakt binnen dertien weken na de
      inwerkingtreding als bedoeld in [artikel LVII, tweede lid][ref1], en die reeds aan een heroverweging onderworpen
      zijn geweest, vindt [afdeling 7.1 van de Algemene wet bestuursrecht][ref2] geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008658#ArtikelLVII
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling7.1
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVI
    references:
      - id: ref1
        bwb_id: BWBR0008658
        artikel: LVII
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '7.1'
  - number: LVI.3
    text: |-
      Met betrekking tot de behandeling van het beroep of hoger beroep tegen een besluit op grond
      van de [Ziektewet][ref1] dat is bekendgemaakt voor de datum van inwerkingtreding als bedoeld in
      [artikel LVII, tweede lid][ref2], en dat uitsluitend betrekking heeft op het bestaan of voortbestaan van de
      ongeschiktheid tot werken blijft het recht van toepassing zoals het gold voor die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0008658#ArtikelLVII
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVI
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0008658
        artikel: LVII
        hoofdstuk: '6'
  - number: LVII.1
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor verschillende artikelen,
      onderdelen of subonderdelen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVII
  - number: LVII.2
    text: |-
      In afwijking van het eerste lid treden de [artikelen XXXI][ref1], [XXXIII][ref2], [XXXIV, onderdeel H][ref3],
      [XXXVII onderdeel B][ref4], [XLVIII, onderdeel A, onder 1][ref5], [LV][ref6] en [LVI][ref7] in werking met
      ingang van 1 januari 1997. Indien het *Staatsblad* waarin deze wet wordt geplaatst, dan wel het *Staatsblad*
      waarin de [Wet premiedifferentiatie en marktwerking bij arbeidsongeschiktheidsverzekeringen][ref8]
      wordt geplaatst, wordt uitgegeven na 31 december 1996, treden de in het eerste zin bedoelde artikelen
      in werking met ingang van de eerste dag van de kalendermaand na zowel de datum van uitgifte van het
      Staatsblad waarin deze wet wordt geplaatst als de datum van uitgifte van het *Staatsblad* waarin de
      [Wet premiedifferentiatie en marktwerking bij arbeidsongeschiktheidsverzekeringen][ref9] wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0008658#ArtikelXXXI
      [ref2]: https://wetten.overheid.nl/BWBR0008658#ArtikelXXXIII
      [ref3]: https://wetten.overheid.nl/BWBR0008658#ArtikelXXXIV
      [ref4]: https://wetten.overheid.nl/BWBR0008658#ArtikelXXXVII
      [ref5]: https://wetten.overheid.nl/BWBR0008658#ArtikelXLVIII
      [ref6]: https://wetten.overheid.nl/BWBR0008658#ArtikelLV
      [ref7]: https://wetten.overheid.nl/BWBR0008658#ArtikelLVI
      [ref8]: https://wetten.overheid.nl/BWBR0008655
      [ref9]: https://wetten.overheid.nl/BWBR0008655
    url: https://wetten.overheid.nl/BWBR0008658/2004-01-01#ArtikelLVII
    references:
      - id: ref1
        bwb_id: BWBR0008658
        artikel: XXXI
        hoofdstuk: '5'
      - id: ref2
