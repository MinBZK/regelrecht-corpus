  - number: '1'
    text: |-
      Als maat voor de middellijn van de ringetjes alsmede de gaten, bedoeld in artikel 1, eerste lid, onderdeel g, van
      het Reglement voor de Binnenvisserij 1985 wordt vastgesteld: 12 mm.
    url: https://wetten.overheid.nl/BWBR0009007/1997-11-16#Artikel1
  - number: '2'
    text: De regeling van de Staatssecretaris van Landbouw en Visserij van 25 februari 1986, nr. J. 1212, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009007/1997-11-16#Artikel2
  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
