  - number: 37t
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze afdeling, dan wel van verplichtingen die
      voortvloeien uit een EG-verordening voor zover deze betrekking heeft op de beveiliging van de burgerluchtvaart
      en voor het toezicht daarop geen andere autoriteit is aangewezen, is belast de Commandant van de Koninklijke
      marechaussee. Onze Minister van Justitie kan daartoe aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel37t
  - number: 37u
    text: |-
      1 Onze Minister van Justitie is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het
      bepaalde bij of krachtens deze afdeling, onverminderd de [artikelen 29][ref1] en [35][ref2].

      2 Onze Minister van Justitie kan van de in het eerste lid genoemde bevoegdheid mandaat verlenen aan de Commandant
      van de Koninklijke marechaussee.


