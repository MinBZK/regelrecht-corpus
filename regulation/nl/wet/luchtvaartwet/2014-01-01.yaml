  - number: '71'
    text: |-
      Als personen met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn, behalve de bij
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen personen, belast:

      a. de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane;

      b. de door Onze Minister aan te wijzen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '72'
    text: |-
      Onverminderd [artikel 37h][ref1] is Onze Minister bevoegd tot oplegging van een last onder bestuursdwang ter
      handhaving van de bij of krachtens deze wet gestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37h
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37h
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: '73'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan:

      a. ambtenaren aanwijzen, die voor zover het betreft de burgerluchtvaart belast zijn met het toezicht op de naleving
      van het bij of krachtens deze wet bepaalde;

      b. personen aanwijzen, die bevoegd zijn de opstijging van luchtvaartuigen te verbieden en te beletten.

      2 De bevoegdheid, bedoeld in het eerste lid onder a, kan eveneens worden uitgeoefend met betrekking tot militaire
      luchtvaartterreinen, die krachtens hun aanwijzing of een terzake verleende ontheffing mede door burgerlijke
      luchtvaartuigen mogen worden gebruikt, en met betrekking tot gedeelten van militaire fabrieken, werkplaatsen en
      aanhorigheden, waar zich burgerlijke luchtvaartuigen bevinden, mits een en ander geschiedt in overeenstemming met
      de door de militaire autoriteiten gegeven richtlijnen.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel73
  - number: 73b
    text: |-
      Ieder is verplicht aan de krachtens [artikel 73][ref1] aangewezen ambtenaren desgevraagd alle medewerking te
      verlenen en alle inlichtingen te verstrekken, die zij redelijkerwijs bij de uitvoering van de hun op grond van deze
      wet opgedragen taak behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel73
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel73b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '73'
        hoofdstuk: VI
  - number: '75'
    text: |-
      Op de eerste vordering van de in [artikel 71][ref1] bedoelde personen zijn de gezagvoerder en de overige leden van
      de bemanning van een luchtvaartuig verplicht de bij of krachtens deze wet vereiste bescheiden behoorlijk ter inzage
      af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel71
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '71'
        hoofdstuk: VI
  - number: 75a
    text: |-
      Ingeval bij of krachtens deze wet regels worden gesteld ter uitvoering van het op 7 december 1944 te Chicago tot
      stand gekomen Verdrag inzake de internationale burgerluchtvaart (Trb. 1973, 109), kan overtreding van die regels
      ook als strafbaar feit worden aangemerkt dan wel worden bestraft met een bestuurlijke sanctie indien deze regels in
      de Engelse taal zijn gesteld en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel75a
  - number: '76'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven:

      a. ter uitvoering van de voorafgaande hoofdstukken of indien de in deze hoofdstukken geregelde onderwerpen in het
      belang van een goede uitvoering van de wet nadere regeling behoeven;

      b.

      c.

      d. ter beveiliging van militaire belangen;

      e. ter beperking van de geluidhinder door luchtvaartuigen met uitzondering van de geluidhinder
      ten gevolge van de uitoefening van de burgerluchtvaart boven gebieden, aangewezen overeenkomstig
      [artikel 1.2, tweede lid, onder d, van de Wet milieubeheer][ref1];

      f.

      g. betreffende de opleiding van vliegtuigbestuurders;

      h.

      i.

      j.

      k. betreffende de regels, die luchtvaartmaatschappijen in acht moeten nemen bij de uitvoering van bepaalde soorten
      van luchtvervoer in, naar of uit Nederland of met Nederland als tussenstation;

      l. betreffende de door luchtvaartmaatschappijen toe te passen tarieven en andere vervoersvoorwaarden;

      m. betreffende de regels, die in acht moeten worden genomen bij de uitvoering van vluchten naar of uit
      Nederland of met Nederland als tussenstation, waarop géén vervoer plaats vindt, dan wel vluchten welke niet door
      luchtvaartmaatschappijen worden uitgevoerd.

      2 Voorts kunnen bij of krachtens algemene maatregel van bestuur de vergoedingen worden geregeld, verschuldigd voor:

      a. het gebruik van ’s lands luchtvaartterreinen;

      b. werkzaamheden, door de Staat verricht;

      c. diensten, door de Staat verstrekt.

      3 Indien een algemene maatregel van bestuur als bedoeld in het eerste lid onder *e*, normen bevat, welke
      betrekking hebben op aan luchtvaartuigen aan te brengen technische voorzieningen ter zake van een vermindering
      van de geluidsproduktie tijdens een vlucht, bij opstijging of landing, of tijdens het proefdraaien op het
      luchtvaartterrein anders dan bij de uitvoering van een vlucht, kan tevens worden bepaald in welke mate deze normen
      in een aan te geven toekomstige periode zullen worden verzwaard.

      4 Een algemene maatregel van bestuur als bedoeld in het eerste lid onder *a, e, k, l* en *m* of een wijziging
      daarvan treedt niet eerder in werking dan twee maanden na datum van uitgifte van het *Staatsblad* waarin deze wordt
      geplaatst. Van de plaatsing wordt onverwijld aan de Staten-Generaal mededeling gedaan.


