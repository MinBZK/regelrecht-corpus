  - number: '80'
    text: |-
      1 De wet van 30 Juli 1926, *Stb.* 249 (Luchtvaartwet), wordt ingetrokken.

      2 De op grond dier wet afgegeven bewijzen van inschrijving, van luchtwaardigheid, van geschiktheid en van
      gelijkstelling blijven, voor zover zij hun geldigheid krachtens de bepalingen dier wet niet hebben verloren,
      hun geldigheid behouden, totdat bij algemene maatregel van bestuur een nadere regeling te dien aanzien zal zijn
      getroffen.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel80
  - number: 80a
    text: |-
      1 [Hoofdstuk IV][ref1] van deze wet, met uitzondering van de [afdelingen 3A][ref2] en [5][ref3], is niet van
      toepassing op de luchthaven Schiphol.

      2 Bij toepassing van deze wet op de luchthaven Schiphol moet onder «luchtvaartterrein» en «exploitant van het
      luchtvaartterrein» verstaan worden: luchthavengebied onderscheidenlijk exploitant van de luchthaven als bedoeld in
      [hoofdstuk 8 van de Wet luchtvaart][ref4].


