  - number: '68'
    text: |-
      Hij, die een handeling verricht met het oogmerk de uitoefening van de bevoegdheden vermeld in de
      [artikelen 58 tot en met 61][ref1] te belemmeren, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
