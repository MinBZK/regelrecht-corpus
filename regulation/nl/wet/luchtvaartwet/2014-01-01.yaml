  - number: 37p
    text: |-
      1 De Commandant van de Koninklijke marechaussee houdt een register bij van natuurlijke personen of rechtspersonen
      die bedrijfsmatig vracht aanbieden, doen vervoeren of vervoeren. In het register staan slechts personen
      ingeschreven op hun verzoek. Daarin worden in ieder geval vermeld de naam, het adres en de vestigingsplaats van
      de geregistreerde, het nummer van inschrijving bij de Kamer van Koophandel en de datum van inschrijving in het
      register.

      2 Personen als bedoeld in het eerste lid kunnen worden ingeschreven onder afgifte van een verklaring waaruit blijkt
      dat is voldaan aan de bij regeling van Onze Minister van Justitie gestelde eisen, met het oog op de veiligheid en
      de betrouwbaarheid van de door hen aangeboden vracht.

      3 Personen als bedoeld in het eerste lid kunnen zich in het register doen inschrijven door inzending van een
      ingevuld aanmeldingsformulier waarvan bij regeling van Onze Minister van Justitie een model wordt vastgesteld.

      4 In het buitenland gevestigde natuurlijke personen of rechtspersonen die bedrijfsmatig vracht aanbieden, doen
      vervoeren of vervoeren, kunnen zich in het register doen inschrijven overeenkomstig bij regeling van Onze Minister
      van Justitie nader te stellen regels.

      5 De Commandant van de Koninklijke marechaussee weigert inschrijving in het register als bedoeld in het eerste lid,
      indien niet is voldaan of in onvoldoende mate blijkt dat is voldaan aan de bij ministeriële regeling gestelde eisen
      met het oog op de veiligheid en de betrouwbaarheid van de door hen aangeboden vracht.

      6 Bij regeling van Onze Minister van Justitie kunnen regels worden gesteld ten aanzien van:

      a. de inhoud van de verklaring, bedoeld in het tweede lid;

      b. de procedure van inschrijving en het melden van wijzigingen;

      c. op te nemen categorieën van gegevens in het register.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel37p
  - number: 37q
    text: |-
      1 De geregistreerde, bedoeld in [artikel 37p][ref1], is verplicht iedere wijziging die optreedt in de in
      [artikel 37p, tweede lid][ref2] bedoelde gegevens onverwijld door te geven.

      2 De Commandant van de Koninklijke marechaussee haalt de inschrijving in het register, bedoeld in artikel 37p,
      door:

      a. op verzoek van de geregistreerde, of

      b. bij beëindiging van de werkzaamheden tot het bedrijfsmatig aanbieden of vervoeren van vracht.

      3 De Commandant van de Koninklijke marechaussee haalt de inschrijving in het register, bedoeld in
      [artikel 37p][ref3], op last van Onze Minister van Justitie door:

      a. indien bij controle blijkt dat de geregistreerde aan de bij of krachtens dit hoofdstuk gegeven voorschriften
      geen uitvoering geeft, of

      b. bij controle blijkt van zodanige aanwijzingen van betrokkenheid bij gepleegde of te plegen misdrijven dat
      gerechtvaardigde twijfel bestaat omtrent de betrouwbaarheid van de geregistreerde.

      4 Een doorhaling als bedoeld in het derde lid, onderdeel a, vindt plaats voor ten hoogste twee jaren. Na
      verstrijken van deze termijn kan opnieuw inschrijving overeenkomstig dit artikel plaatsvinden.

      5 Een doorhaling als bedoeld in het derde lid, onderdeel b, vindt plaats voor onbepaalde tijd. Hernieuwde
      inschrijving vindt slechts plaats na toestemming van Onze Minister van Justitie.

      6 De inschrijving dan wel de doorhaling van de inschrijving in het register bedoeld in het derde lid, wordt niet
      eerder van kracht dan twee weken nadat de Commandant van de Koninklijke marechaussee daarvan mededeling heeft
      gedaan aan de geregistreerde.

      7 Voor zover zij deze behoeven voor de vervulling van de in [artikel 37j, eerste lid][ref4], en [artikel 37r][ref5]
      bedoelde verplichtingen worden uit het register, bedoeld in [artikel 37p, eerste lid][ref6], gegevens verstrekt
      aan:

      a. luchtvaartmaatschappijen, en

      b. geregistreerde personen als bedoeld in [artikel 37p][ref7].

      8 Aan andere dan de in het zevende lid bedoelde personen wordt desgevraagd meegedeeld of bepaalde natuurlijke
      personen of rechtspersonen die bedrijfsmatig vracht aanbieden of vervoeren, zijn ingeschreven in het register,
      bedoeld in [artikel 37p, eerste lid][ref8].

      9 Tegen besluiten van de Commandant van de Koninklijke marechaussee verband houdend met het register, bedoeld
      in [artikel 37p, eerste lid][ref9], kan een belanghebbende administratief beroep instellen bij de Minister van
      Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
