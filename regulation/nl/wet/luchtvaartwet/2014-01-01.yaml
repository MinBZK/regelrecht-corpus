  - number: 37hd
    text: |-
      De bepalingen in deze paragraaf laten onverlet dat de exploitant van een luchtvaartterrein op verzoek van een
      luchtvaartmaatschappij of een buitenlandse overheid een verdergaande controle kan uitvoeren, indien dit in de
      vervoersovereenkomst tussen de passagier en de luchtvaartmaatschappij wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel37hd
  - number: 37j
    text: |-
      1 De luchtvaartmaatschappij draagt zorg voor de controle van vracht op de aanwezigheid van gevaarlijke goederen.

      2 Het gestelde in het eerste lid kan, onverminderd het bepaalde bij of krachtens deze of andere wetten, achterwege
      blijven indien er sprake is van:

      a. vracht bestemd om te worden overgeladen van het ene vliegtuig op het andere, voor zover deze is voorzien van
      bescherming tegen bemoeienis door ongeautoriseerde personen;

      b. vervoer van stoffelijke overschotten;

      c. levende dieren;

      d. levensreddende materialen, voor zover de controle afbreuk kan doen aan de levensreddende kwaliteit van het
      materiaal;

      e. nucleair materiaal, of

      f. andere bij regeling van Onze Minister van Justitie aangewezen vracht, voor zover de controle afbreuk kan doen
      aan de kwaliteit van de vracht.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel37j
  - number: 37k
    text: |-
      1 De controle, bedoeld in het [artikel 37j, eerste lid][ref1], omvat in ieder geval:

      a. een onderzoek naar de identiteit van degene die feitelijk vracht aanbiedt;

      b. het stelselmatig uitvoeren van onderzoek met de hand, met behulp van passende detectieapparatuur of van andere
      technische hulpmiddelen en

      c. de verificatie van de luchtvrachtbrief en de verzamelstaat.

      2 Voor zover de aard of samenstelling van de vracht zich tegen controle verzet, kan bij regeling van Onze Minister
      van Justitie vrijstelling worden verleend van handelingen als bedoeld in het eerste lid, onderdeel b.

      3 De [artikelen 37c, derde en vierde lid][ref2], en [37f, derde lid][ref3], zijn van overeenkomstige toepassing.

      4 De luchtvaartmaatschappij doet de bij de controle aangetroffen gevaarlijke goederen of de vracht waarin
      gevaarlijke goederen zijn aangetroffen, aan boord van een luchtvaartuig brengen overeenkomstig door Onze Minister
      van Justitie vast te stellen regels of te geven aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37j
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37c
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
