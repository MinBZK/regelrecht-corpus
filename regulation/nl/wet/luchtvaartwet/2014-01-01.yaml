  - number: '60'
    text: |-
      1 Onze Minister van Defensie is, onverminderd de bevoegdheden bij andere wetten verleend, bevoegd:

      a. aanwijzingen te geven aan rechthebbenden ten aanzien van luchtvaartterreinen met betrekking tot het beheer en
      het gebruik van die luchtvaartterreinen;

      b. aanwijzingen te geven aan rechthebbenden ten aanzien van roerende en onroerende zaken, welke zich op
      luchtvaartterreinen bevinden, met betrekking tot het beheer en het gebruik van die zaken;

      c. werken te doen uitvoeren op luchtvaartterreinen;

      d. voorzieningen te doen uitvoeren aan de zich op luchtvaartterreinen bevindende roerende en onroerende zaken, en

      e. luchtvaartterreinen en de daarbij behorende gebouwen en inrichtingen, met inbegrip van woongedeelten,
      alsmede fabrieken, werkplaatsen en aanhorigheden, welke dienstbaar zijn aan de luchtvaart, te doen
      betreden voor zover dat redelijkerwijs voor de vervulling van zijn taak nodig is. In afwijking
      van [artikel 2 van de Algemene wet op het binnentreden][ref1] is het militaire gezag bevoegd
      zonder machtiging binnen te treden. Het militaire gezag is bevoegd een machtiging als bedoeld in
      [artikel 3 van de Algemene wet op het binnentreden][ref2] te geven. [Artikel 3 van die wet][ref3] is van
      toepassing.

      2 Op de maatregelen getroffen krachtens dit artikel zijn het [tweede tot en met vijfde lid van artikel 58][ref4]
      van overeenkomstige toepassing met dien verstande dat voor Onze Minister wordt gelezen: Onze Minister van Defensie.

      3 Op de maatregelen getroffen krachtens dit artikel is tevens het [zesde lid van artikel 58][ref5] van
      overeenkomstige toepassing met dien verstande dat de voordracht geschiedt door Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006763#Artikel3
