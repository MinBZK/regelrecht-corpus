  - number: '67'
    text: |-
      1 Hij, die niet voldoet aan een krachtens [artikel 58][ref1] gegeven aanwijzing, wordt gestraft met hechtenis van
      ten hoogste één jaar of geldboete van de derde categorie.

      2 Hij die in strijd handelt met een ingevolge [artikel 59][ref2] gegeven aanwijzing of gedane vordering, wordt
      gestraft met hechtenis van ten hoogste één jaar of geldboete van de derde categorie.

      3 Hij, die in strijd handelt met een ingevolge [artikel 60][ref3] gegeven aanwijzing, wordt gestraft met hechtenis
      van ten hoogste zes maanden of geldboete van de derde categorie.

      4 Hij, die een ingevolge [artikel 61][ref4] gegeven opdracht niet uitvoert, wordt gestraft met hechtenis van ten
      hoogste zes maanden of geldboete van de derde categorie.


