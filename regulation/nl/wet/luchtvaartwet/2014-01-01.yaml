preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen omtrent de luchtvaart te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder

      a. luchtvaart: het gebruik van luchtvaartuigen;

      b. luchtvaartuig: toestel, bedoeld in [artikel 1.1, eerste lid, van de Wet luchtvaart][ref1];

      c. vliegtuigen: luchtvaartuigen zwaarder dan lucht en voorzien van een voortstuwingsinrichting;

      d. exploitant van een luchtvaartterrein: degene, te wiens name ingevolge deze wet een luchtvaartterrein wordt
      aangewezen;

      e.

      f. buitenlandse luchtvaartuigen: luchtvaartuigen, ingeschreven in een buitenlands luchtvaartuigregister;

      g. luchtvaartterreinen: een aangewezen terrein ingericht voor het opstijgen en landen van luchtvaartuigen;

      h. luchtvaartmaatschappijen: eigenaren van ondernemingen, die geheel of gedeeltelijk hun bedrijf maken van het
      vervoer van personen, dieren of goederen met luchtvaartuigen;

      i. verkeersvlucht: een vlucht, die vervoer door een luchtvaartmaatschappij ten doel heeft;

      j. Onze Minister: voor wat de burgerluchtvaart en de algemene verkeersveiligheid in de lucht betreft: Onze Minister
      van Verkeer en Waterstaat: voor wat de militaire luchtvaart betreft: Onze Minister van Defensie;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1.1'
  - number: '2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt mede verstaan onder

      a. gezagvoerder: hij, die een luchtvaartuig alleen bedient;

      b. bedienen van een luchtvaartuig: het verrichten van handelingen aan boord van een luchtvaartuig ten behoeve van
      het gebruik van dat luchtvaartuig;

      c. terreinen: watergebieden;

      d. bouwwerken: getimmerten, constructiemasten, bovengrondse geleidingen, dijken en kaden.

      e. luchtwaardigheid: de toelaatbaarheid van het door het luchtvaartuig veroorzaakte geluid.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel2
  - number: '9'
    text: |-
      Ten aanzien van het in luchtwaardige toestand houden van Nederlandse luchtvaartuigen worden de bewijzen van
      bevoegdheid afgegeven, geschorst of ingetrokken door Onze Minister en wel, voor wat burgerluchtvaartuigen betreft,
      naar regelen, gesteld bij of krachtens algemene maatregel van bestuur. Voorts kan Onze Minister bewijzen van
      gelijkstelling van buitenlandse bewijzen van bevoegdheid afgeven, schorsen en intrekken, naar regelen, gesteld bij
      of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel9
  - number: '16'
    text: |-
      Voor zover bij internationale overeenkomst niet anders is bepaald mag vervoer met luchtvaartuigen in, naar of uit
      Nederland, of met Nederland als tussenstation, slechts geschieden door luchtvaartmaatschappijen aan wie daartoe
      door Onze Minister vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel16
  - number: 16a
    text: |-
      1 Ten aanzien van vergunningen als bedoeld in [artikel 16][ref1] die vallen onder Verordening (EG) nr. 1008/2008
      van het Europees Parlement en de Raad van de Europese Unie van 24 september 2008 inzake gemeenschappelijke regels
      voor de exploitatie van luchtdiensten in de Gemeenschap (PbEU L 293), wordt toegepast hetgeen bij of krachtens die
      verordening is bepaald.

      2 Een wijziging van het bepaalde bij of krachtens de verordening, genoemd in het eerste lid, treedt voor de
      toepassing van het eerste lid in werking met ingang van de dag waarop de betrokken wijzigingsregeling in werking
      treedt.

      3 Aan een vergunning als bedoeld in het eerste lid kunnen voorschriften worden verbonden voor zover deze in
      overeenstemming zijn met de verordening.

      4 Onze Minister kan een vergunning als bedoeld in het eerste lid, met inachtneming van de verordening, schorsen
      of intrekken.

      5 Onze Minister kan een vergunning als bedoeld in het eerste lid, op verzoek van de houder wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
  - number: 16b
    text: |-
      1 Een vergunning als bedoeld in [artikel 16][ref1] die niet valt onder de in [artikel 16a, eerste lid][ref2]
      genoemde verordening, wordt verleend voor een bepaalde, daarin genoemde, termijn van ten hoogste vijf jaar. Zij kan
      door Onze Minister worden verlengd.

      2 Aan een vergunning als bedoeld in het eerste lid, kunnen voorschriften of beperkingen worden verbonden.

      3 Onze Minister kan een vergunning als bedoeld in het eerste lid, schorsen of intrekken:

      a. indien de vergunninghouder daarom verzoekt;

      b. wegens niet-uitoefening van het vervoer;

      c. wegens uitoefening van het vervoer in strijd met bij of krachtens deze wet gegeven voorschriften;

      d. wegens niet-inachtneming van aan de vergunning verbonden voorschriften of beperkingen;

      e. indien ter verkrijging van de vergunning onjuiste of onvolledige gegevens zijn verstrekt.

      4 Onze Minister kan een vergunning als bedoeld in het eerste lid, op verzoek van de houder wijzigen.

      5 Een vergunning als bedoeld in het eerste lid verliest haar geldigheid zolang en voor zover de vergunninghouder
      is geplaatst op de communautaire lijst, bedoeld in Verordening (EG) nr. 2111/2005 van het Europees Parlement en de
      Raad van de Europese Gemeenschappen van 14 december 2005 betreffende de vaststelling van een communautaire lijst
      van luchtvaartmaatschappijen waaraan een exploitatieverbod binnen de Gemeenschap is opgelegd en het informeren van
      luchtreizigers over de identiteit van de exploiterende luchtvaartmaatschappij en tot intrekking van artikel 9 van
      richtlijn nr. 2004/36/EG.

      6 Een aanvraag voor een vergunning als bedoeld in het eerste lid, of voor een verlenging voor een dergelijke
      vergunning wordt afgewezen voor zover de aanvraag betrekking heeft op activiteiten waarvoor de aanvrager op de
      communautaire lijst, bedoeld in het vijfde lid, is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel16a
