  - number: 37b
    text: |-
      1 De exploitant van een luchtvaartterrein wijst de delen daarvan aan:

      a. die door het publiek slechts betreden mogen worden, indien de betrokken personen in het bezit zijn van een
      geldig reisbiljet of een daartoe afgegeven persoonsgebonden kaart;

      b. die niet voor het publiek toegankelijk zijn;

      c. die slechts voor een beperkte categorie van de op het luchtvaartterrein werkzame personen toegankelijk zijn;

      d. die voor het publiek toegankelijk zijn.

      2 Onze Minister van Justitie, in overeenstemming met Onze Minister, kan delen van het luchtvaartterrein aanwijzen
      die in ieder geval tot een van de in het eerste lid bedoelde delen behoren.

      3 De exploitant van een luchtvaartterrein draagt er zorg voor:

      a. dat een ieder die toegang heeft tot een van de in het eerste lid, onder *b* en *c*, bedoelde delen, over een
      door hem verstrekt of erkend toegangsbewijs beschikt, waaruit tevens duidelijk kenbaar is tot welke delen de drager
      toegang heeft;

      b. dat een ieder die zich in een van de in het eerste lid, onder *b* en *c*, bedoelde delen bevindt, verplicht is
      het onder *a* bedoelde toegangsbewijs zichtbaar te dragen;

      c. dat een ieder die zich in een van de in het eerste lid, onder *a*, bedoelde delen bevindt, verplicht is het
      onder *a* bedoelde toegangsbewijs dan wel een geldig reisbiljet of een daartoe afgegeven persoonsgebonden kaart bij
      zich te hebben en dit te allen tijde op verzoek van een lid van het beveiligingspersoneel ter inzage te geven;

      d. dat voertuigen die worden gebruikt op de delen, bedoeld in het eerste lid onder b en c, zijn voorzien van een
      door de exploitant van een luchtvaartterrein afgegeven toegangsbewijs dat duidelijk zichtbaar is aangebracht en
      waarop duidelijk kenbaar is tot welke delen het voertuig toegang heeft.

      4 De exploitant van een luchtvaartterrein schermt de in het eerste lid, onder *b* en *c*, bedoelde delen van het
      luchtvaartterrein zodanig onderling van elkaar af dat zij slechts op een beperkt aantal door beveiligingspersoneel
      of anderszins bewaakte plaatsen toegankelijk zijn na controle van het toegangsbewijs. Delen als bedoeld in
      het eerste lid, onder *c*, die voor onderscheiden categorieën personeel toegankelijk zijn worden daarbij als
      onderscheiden delen aangemerkt.

      5 De plaatsen bedoeld in het vierde lid, dienen duidelijk gemarkeerd te zijn onder aanduiding van de categorieën
      personen die toegang hebben. De plaatsen dienen steeds helder verlicht en afsluitbaar te zijn.

      6 Een ieder die op de plaatsen, bedoeld in het vierde lid, toegang zoekt tot of zich bevindt op een van de in het
      eerste lid, onder b en c, bedoelde delen, gedoogt dat vanwege de exploitant van een luchtvaartterrein onderzoek
      plaatsvindt aan zijn kleding, van voorwerpen die hij bij zich heeft of van het voertuig dat hij gebruikt.

      7 De exploitant van een luchtvaartterrein draagt er zorg voor, dat personen die niet voldoen aan het derde
      lid, onder *b* en *c*, of het zesde lid, de verdere toegang tot de in het eerste lid bedoelde delen van het
      luchtvaartterrein wordt ontzegd.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel37b
  - number: 37c
    text: |-
      1 De exploitant van een luchtvaartterrein treft de nodige voorzieningen om te voorkomen dat personen of bagage aan
      boord van een luchtvaartuig gaan zonder dat deze zijn onderworpen aan een controle overeenkomstig paragraaf 3.

      2 De exploitant van een luchtvaartterrein is verplicht te beschikken over:

      a. voldoende en passende detectieapparatuur voor de uitoefening van de controle door het beveiligingspersoneel
      overeenkomstig paragraaf 3;

      b. een ruimte voor vertrekkende passagiers die zodanig is ingericht dat gecontroleerde passagiers en handbagage
      zijn afgeschermd en een vermenging met niet gecontroleerde personen en voorwerpen niet mogelijk is;

      c. een ruimte voor onderzoek van bagage en dieren bestemd voor vervoer en

      d. een afsluitbare en beveiligde ruimte bestemd voor het bewaren van verdachte bagage.

      3 Onze Minister van Justitie kan, in overeenstemming met Onze Minister, nadere regels stellen met betrekking tot de
      voorzieningen die zijn vereist ter beveiliging van de burgerluchtvaart.

      4 Onze Minister van Justitie kan de exploitant van een luchtvaartterrein een aanwijzing geven inzake de aanschaf
      van detectie-apparatuur indien deze apparatuur redelijkerwijs niet als passend kan worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel37c
  - number: 37d
    text: |-
      De exploitant van een luchtvaartterrein richt de luchthaven zodanig in, en treft zodanige voorzieningen dat:

      a. een plaats beschikbaar is voor het afzonderen van een luchtvaartuig;

      b. het beveiligingspersoneel snel en op eenvoudige wijze de verschillende delen van het luchtvaartterrein kan
      bereiken en toezicht kan houden op daar aanwezige personen;

      c. redelijkerwijze voorkomen wordt dat onbevoegden een geparkeerd luchtvaartuig betreden.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel37d
  - number: 37e
    text: |-
      1 De exploitant van een luchtvaartterrein is gehouden een plan op te stellen met betrekking tot de beveiliging van
      het luchtvaartterrein. Het plan behoeft de instemming van Onze Minister van Justitie in overeenstemming met Onze
      Minister. Het plan wordt op hun verzoek, onder het stellen van een redelijke termijn, aangepast.

      2 Het plan, bedoeld in het eerste lid, omvat onder meer:

      a. de plichten, verantwoordelijkheden, maatregelen en procedures die zijn vastgesteld met het oog op de beveiliging
      van het luchtvaartterrein;

      b. de bijzondere procedures en maatregelen voor situaties als bedoeld in [artikel 37ad, eerste lid][ref1];

      c. de maatregelen en procedures in geval van dreiging van onwettige daden van geweld, bomalarm, kaping of gewapende
      aanvallen op het luchtvaartterrein en

      d. andere bij algemene maatregel van bestuur te bepalen onderwerpen.

      3 Met het oog op de afstemming met het crisisplan, bedoeld in [artikel 16 van de Wet veiligheidsregio’s][ref2],
      wordt het bestuur van de veiligheidsregio in de gelegenheid gesteld zijn zienswijze te geven over een ontwerp van
      een plan als bedoeld in het eerste lid of een wijziging van dat plan.

      4 De exploitant van een luchtvaartterrein informeert uit eigen beweging Onze Minister en Onze Minister van Justitie
      indien het plan door omstandigheden niet kan worden uitgevoerd of daarin wijzigingen worden aangebracht. Hij
      verstrekt desgevraagd Onze Ministers informatie over de beveiliging van het luchtvaartterrein.

      5 Indien een onderdeel van het plan niet wordt uitgevoerd, kan Onze Minister van Justitie de exploitant van een
      luchtvaartterrein een aanwijzing geven die ertoe strekt zo veel mogelijk het oorspronkelijk in het plan aangegeven
      niveau van beveiliging te benaderen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ad
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel16
