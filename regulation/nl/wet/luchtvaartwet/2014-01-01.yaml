  - number: 37m
    text: |-
      1 Aan de luchtvaartmaatschappij voor vervoer toevertrouwde brieven worden zonder goedvinden van de afzender of van
      de geadresseerde slechts geopend indien de rechter-commissaris in de rechtbank van het arrondissement waarbinnen de
      brief is aangetroffen, daartoe, op verzoek van de luchtvaartmaatschappij, bevel heeft gegeven.

      2 Het bevel, bedoeld in het eerste lid, wordt slechts gegeven indien het vermoeden bestaat dat zich in de brief
      gevaarlijke goederen bevinden.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel37m
  - number: 37n
    text: |-
      1 De luchtvaartmaatschappij beschikt over een afsluitbare en beveiligde ruimte bestemd voor de ontvangst en
      bewaring van vracht.

      2 Zij stelt de identiteit van de aanbieders van vracht vast, indien deze personen niet zijn geregistreerd
      overeenkomstig [artikel 37p][ref1], en registreert of doet registreren de naam en het adres van die personen en van
      de afzender.

      3 Onze Minister van Justitie kan, in overeenstemming met Onze Minister, bij ministeriële regeling nadere
      voorschriften geven aan de luchtvaartmaatschappij ter beveiliging van de burgerluchtvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel37n
