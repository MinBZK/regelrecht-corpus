        hoofdstuk: III
        afdeling: '3'
  - number: 16d
    text: |-
      1 Onze Minister kan ontheffing verlenen van de in [artikel 16][ref1] vervatte verplichting. Van de beschikking ter
      zake wordt mededeling in de *Staatscourant* gedaan.

      2 Aan de in het eerste lid bedoelde ontheffingen kunnen voorschriften of beperkingen worden verbonden.

      3 Onze Minister kan een ontheffing schorsen of intrekken wegens niet inachtneming van de aan de ontheffing
      verbonden voorschriften of beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel16d
