  - number: '64'
    text: |-
      1 Bij veroordeling wegens overtreding van:

      a. een van de [artikelen 4][ref1], [8][ref2], en [17][ref3],

      b. een voorschrift van een krachtens deze wet vastgestelde algemene maatregel van bestuur, kan de schuldige de
      bevoegdheid een luchtvaartuig te bedienen voor ten hoogste drie jaren worden ontzegd.

      2 Bij toepassing van het bepaalde in het eerste lid verliest een aan de veroordeelde afgegeven bewijs van
      bevoegdheid of van gelijkstelling zijn geldigheid voor de duur van de ontzegging, zodra de rechterlijke uitspraak,
      voor wat betreft deze bijkomende straf, voor tenuitvoerlegging vatbaar is geworden. De betrokken ambtenaar van
      het Openbaar Ministerie brengt dit onverwijld ter kennis van Onze Minister, die daarvan aankondiging doet in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel17
