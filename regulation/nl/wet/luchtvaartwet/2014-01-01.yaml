        artikel: '58'
        hoofdstuk: V
  - number: '62'
    text: |-
      1 Hij, die een van de [artikelen 8][ref1], [9][ref2], [14, eerste lid onder c][ref3], [16][ref4],
      [17, eerste lid][ref5], [30b, zesde lid][ref6], [31][ref7], [32][ref8], [33][ref9], [34][ref10], [36][ref11],
      [37][ref12], [38, vijfde lid][ref13], of [74][ref14] overtreedt, wordt gestraft hetzij met hechtenis van ten
      hoogste zes maanden en geldboete van de derde categorie, hetzij met één van deze straffen.

      2 Met dezelfde straf wordt gestraft de gezagvoerder, die een van de [artikelen 4][ref15],
      [14, eerste lid onder a en b][ref16], of [17, tweede lid][ref17], overtreedt.

      3 Overtreding van een voorschrift gegeven bij of krachtens algemene maatregel van bestuur ingevolge deze wet,
      wordt, voor zover die overtreding uitdrukkelijk als strafbaar feit is aangemerkt, gestraft hetzij met hechtenis van
      ten hoogste zes maanden en geldboete van de derde categorie, hetzij met één van deze straffen.

      4 De eigenaar of houder van een luchtvaartuig, die in strijd met een van de [artikelen 4][ref18], [8][ref19] of
      [16][ref20] de luchtvaart doet of laat uitoefenen, wordt gestraft hetzij met hechtenis van ten hoogste zes maanden
      en geldboete van de derde categorie, hetzij met één van deze straffen.


