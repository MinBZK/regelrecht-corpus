  - number: 37f
    text: |-
      1 De exploitant van een luchtvaartterrein doet de personen die als passagiers aan boord gaan van een luchtvaartuig,
      alsmede hun handbagage, door het beveiligingspersoneel controleren op de aanwezigheid van voor bedreiging geschikte
      voorwerpen.

      2 De exploitant van een luchtvaartterrein kan:

      a. voor vervoer met een passagiersvlucht aangeboden ruimbagage door het beveiligingspersoneel doen controleren op
      de aanwezigheid van voor bedreiging geschikte voorwerpen en

      b. de personen die anders dan als passagier aan boord kunnen gaan van een luchtvaartuig door het
      beveiligingspersoneel doen controleren op hun identiteit en op de rechtmatigheid van hun aanwezigheid op het
      luchtvaartterrein.

      3 Indien bij controle voor bedreiging geschikte voorwerpen worden aangetroffen of de naleving van het gestelde
      in dit artikel met betrekking tot de uitvoering van de controle in gevaar komt, doet de exploitant van een
      luchtvaartterrein daarvan onverwijld mededeling aan de Commandant van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel37f
  - number: 37g
    text: |-
      1 De luchtvaartmaatschappij draagt zorg dat geen ruimbagage aan boord is die niet toebehoort aan de aan boord
      zijnde passagiers. Bij regeling van Onze Minister van Justitie, in overeenstemming met Onze Minister, kan hiervoor
      vrijstelling worden verleend. Daarbij worden voorschriften gegeven als vervangende waarborg met het oog op de
      beveiliging. In bijzondere gevallen kan Onze Minister van Justitie ontheffing verlenen.

      2 De luchtvaartmaatschappij draagt zorg voor de controle op de aanwezigheid van voor bedreiging geschikte
      voorwerpen van alle goederen die aan boord gaan van een luchtvaartuig niet zijnde bagage of vracht.

      3 Het bepaalde in [artikel 37f, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
