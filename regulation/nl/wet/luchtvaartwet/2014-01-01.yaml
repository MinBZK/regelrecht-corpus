  - number: 37hc
    text: |-
      De personen die aan boord gaan van een luchtvaartuig, zijn verplicht:

      a. zich te onderwerpen aan een controle als bedoeld in [artikel 37f, eerste lid en tweede lid, onderdeel b][ref1]
      en

      b. medewerking te verlenen aan de handelingen ter uitvoering van de verplichting, bedoeld in
      [artikel 37hb, onderdeel a tot en met c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
