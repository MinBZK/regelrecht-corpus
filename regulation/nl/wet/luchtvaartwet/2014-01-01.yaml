      1 Een klacht tegen beveiligingspersoneel als bedoeld in [artikel 37a, eerste lid, onderdeel b, onder 1°][ref1],
      over een gedraging bij de uitvoering van een taak ingevolge deze afdeling, kan worden ingediend bij de Commandant
      van de Koninklijke marechaussee.

      2 De klacht wordt behandeld door Onze Minister van Justitie. Deze kan hiervoor mandaat verlenen aan de Commandant
      van de Koninklijke marechaussee.

      3 [Titel 9.1 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing. De regels vastgesteld
      krachtens [artikel 6, onder i, van de Wet particuliere beveiligingsorganisaties][ref3] blijven buiten werking.

      4 Voor de toepassing van de [Wet Nationale ombudsman][ref4] en [titel 9.2 van de Algemene wet bestuursrecht][ref5]
      wordt een gedraging als bedoeld in het eerste lid, aangemerkt als een gedraging van Onze Minister van Justitie.

      5 Indien de klacht zich tevens richt tegen beveiligingspersoneel als bedoeld in
      [artikel 37a, eerste lid, onderdeel b, onder 2°][ref6], en betrekking heeft op hetzelfde feitencomplex, wordt deze
      behandeld volgens de procedure die geldt voor dat beveiligingspersoneel.


