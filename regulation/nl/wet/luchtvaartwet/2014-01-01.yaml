  - number: 37l
    text: |-
      1 [Artikel 37k][ref1] is niet van toepassing indien vracht wordt aangeboden door de personen, bedoeld in het tweede
      lid, en uit een uitwendige visuele controle is gebleken, dat:

      a. de vracht is verpakt;

      b. de verpakking onbeschadigd is;

      c. geen gevaarlijke goederen zijn toegevoegd, en

      d. geen onregelmatigheden met de verpakking hebben plaatsgevonden.

      2 De personen, bedoeld in het eerste lid, aanhef, zijn:

      a. een geregistreerde als bedoeld in [artikel 37p, eerste lid][ref2];

      b. een niet-geregistreerde voor zover de vracht afkomstig is van een geregistreerde en deze is verpakt
      overeenkomstig de bij regeling van Onze Minister van Justitie vast te stellen voorschriften om te voorkomen dat
      daaraan gevaarlijke goederen worden toegevoegd;

      c. een rechtspersoon waarop een verplichting tot vervoer van voorwerpen rust ingevolge de [Postwet][ref3], of een
      overeenkomstige buitenlandse postinstelling, of

      d. de bij regeling van Onze Minister van Justitie vast te stellen categorieën van natuurlijke personen of
      rechtspersonen, die in het buitenland zijn gevestigd en ten aanzien waarvan op grond van internationale afspraken
      toereikende waarborgen aanwezig zijn dat maatregelen zijn genomen ter beveiliging van de aangeboden vracht.

      3 Onze Minister van Justitie kan bepalen dat de uitzondering, bedoeld in het eerste lid, niet van toepassing is op
      de rechtspersoon, bedoeld in het tweede lid, onderdeel c, indien er een gerechtvaardigd vermoeden is dat bepaalde
      vracht gevaarlijke goederen bevat.

      4 Bij regeling van Onze Minister van Justitie, in overeenstemming met Onze Minister, kunnen ter voorkoming van
      vervoer van gevaarlijke goederen door een luchtvaartmaatschappij, voorschriften worden gegeven met betrekking tot
      vracht aangeboden door een rechtspersoon als bedoeld in het tweede lid, onderdeel c.

      5 Bij regeling van Onze Minister van Justitie kunnen, met het oog op de controle ter beveiliging van vracht,
      voorschriften worden gegeven over de afhandeling van vracht door personen die in het buitenland zijn gevestigd en
      vracht aanbieden door tussenkomst van de personen, bedoeld in het tweede lid, onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37k
