  - number: '17'
    text: |-
      1 Het is verboden luchtvaartvertoningen of luchvaartwedstrijden te houden zonder vergunning van Onze Minister.

      2 Het is verboden boven Nederland deel te nemen aan een vertoning of wedstrijd als bedoeld in het eerste lid,
      waarvoor geen vergunning is verleend.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven waaraan bij het aanvragen van een
      vergunning tot het houden van een luchtvaartvertoning of een luchtvaartwedstrijd en bij het houden van zodanige
      vertoning of wedstrijd moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel17
  - number: 37a
    text: |-
      1 Voor de toepassing van deze afdeling en de daarop berustende bepalingen wordt verstaan onder:

      a. luchtvaartterreinen: een luchtvaartterrein dat mede wordt gebruikt voor verkeersvluchten, met uitzondering
      van die delen van een militair luchtvaartterrein die niet uitsluitend ten behoeve van de burgerluchtvaart worden
      gebruikt;

      b. beveiligingspersoneel:

      1°. personen in dienst van een door de exploitant van een luchtvaartterrein met de uitvoering van de beveiliging
      belaste particuliere beveiligingsorganisatie, waaraan door Onze Minister van Justitie een vergunning is verleend
      als bedoeld in [artikel 3 van de Wet particuliere beveiligingsorganisaties en recherchebureaus][ref1], en

      2°. de door Onze Minister van Justitie aangewezen ambtenaren van politie, ambtenaren van de Koninklijke
      marechaussee en de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane;

      c. voor bedreiging geschikte voorwerpen: wapens, explosieven of andere voorwerpen en stoffen, die voor de
      bedreiging van personen geschikt zijn dan wel de veiligheid van het luchtvaartuig in gevaar kunnen brengen;

      d. gevaarlijke goederen: explosieven of andere voorwerpen en stoffen, die de veiligheid van het luchtvaartuig in
      gevaar kunnen brengen;

      e. bagage: goederen toebehorende aan passagiers,

      1°. die deze zelf in het luchtvaartuig meenemen als handbagage, of

      2°. die deze in verband met hun reis aan de luchtvaartmaatschappij hebben afgegeven teneinde in het ruim van het
      luchtvaartuig te worden vervoerd als ruimbagage;

      f. vracht: goederen, niet zijnde bagage, die voor vervoer door de lucht worden aangeboden, daaronder begrepen
      poststukken als bedoeld in [artikel 2, onderdeel b, van de Postwet 2009][ref2], tenzij deze goederen door de lucht
      worden aangevoerd en het vliegtuig niet verlaten.

      2 Met betrekking tot militaire luchtvaartterreinen waarvan delen uitsluitend ten behoeve van de burgerluchtvaart
      worden gebruikt, wordt in afwijking van [artikel 1, eerste lid, onder d][ref3], voor de toepassing van deze
      afdeling als exploitant van een luchtvaartterrein aangemerkt, de bij koninklijk besluit aan te wijzen rechtspersoon
      aan wie het medegebruik ten behoeve van de burgerluchtvaart is verleend.

      3 Een koninklijk besluit als bedoeld in het tweede lid wordt genomen op voordracht van Onze Minister van Verkeer en
      Waterstaat in overeenstemming met Onze Ministers van Justitie en van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025572#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel1
