  - number: 37h
    text: |-
      1 De controle, bedoeld in [artikel 37f, eerste lid][ref1], omvat:

      a. een onderzoek met behulp van daartoe bestemde detectieapparatuur van passagiers en handbagage;

      b. steekproefsgewijs, en indien de detectieapparatuur daartoe aanleiding geeft, een onderzoek van passagiers aan
      hun kleding en een nader onderzoek van hun handbagage;

      c. de stelselmatige uitvoering van het onderzoek aan kleding van passagiers en van handbagage in door Onze Minister
      van Justitie bij ministeriële regeling te bepalen gevallen;

      d. een bevraging van de passagiers met het oog op hun betrouwbaarheid in door Onze Minister van Justitie bij
      ministeriële regeling te bepalen gevallen.

      2 De controle, bedoeld in [artikel 37f, tweede lid, onderdeel a][ref2], omvat in ieder geval:

      a. een onderzoek met behulp van daartoe bestemde detectieapparatuur of andere technische hulpmiddelen;

      b. een nader onderzoek naar de inhoud van de bagage indien daartoe aanleiding is.

      3 De controle, bedoeld in [artikel 37f, tweede lid, onderdeel b][ref3], kan omvatten:

      a. een nader onderzoek van het toegangsbewijs waarover de betrokkene beschikt;

      b. een onderzoek met behulp van daartoe bestemde detectieapparatuur;

      c. een onderzoek, indien daartoe aanleiding is, van meegevoerde goederen en aan de kleding.

      4 De controle, bedoeld in [artikel 37g, tweede lid][ref4], omvat in ieder geval een visuele uitwendige controle van
      de goederen of hun verpakking.

      5 Bij regeling van Onze Minister van Justitie, in overeenstemming met Onze Minister, kan ten aanzien van bepaalde
      soorten vluchten of luchtvaartuigen, vrijstelling worden verleend van een controle als bedoeld in het eerste en
      tweede lid, wanneer de dreiging voor deze vluchten of luchtvaartuigen als gevolg van voor bedreiging geschikte
      voorwerpen, verwaarloosbaar is. Daarbij kunnen nadere voorschriften worden gegeven.

      6 Onze Minister van Justitie kan in bijzondere gevallen op de grond, bedoeld in het vijfde lid, ontheffing verlenen
      van de controle.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
