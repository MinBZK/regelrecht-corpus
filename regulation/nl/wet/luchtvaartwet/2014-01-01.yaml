  - number: '61'
    text: |-
      1 Onze Minister van Defensie is bevoegd opdrachten te geven aan personen die in het bezit zijn van een ingevolge
      deze wet uitgereikt bewijs van bevoegdheid alsmede aan personen, behorende tot bij algemene maatregel van bestuur
      aan te wijzen categorieën van personeel dat werkzaam is ten behoeve van de luchtvaart.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld betreffende de aard en de duur van de
      opdrachten alsmede de wijze waarop en de voorwaarden waaronder zij kunnen worden gegeven, zomede betreffende de
      schadeloosstelling in verband met de verstrekte opdrachten. De rechtspositie van de personen, die een opdracht
      hebben ontvangen, wordt bij algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel61
  - number: 61a
    text: |-
      1 Voordat Onze Minister van Defensie een hem krachtens dit hoofdstuk ten aanzien van burgerluchtvaart toekomende
      bevoegdheid uitoefent, richt hij een verzoek aan Onze Minister van Verkeer en Waterstaat om aan de behoefte
      gesteld door Onze Minister van Defensie te voldoen. Onze Minister van Defensie oefent de bevoegdheden krachtens
      dit hoofdstuk ten aanzien van burgerluchtvaart niet uit dan nadat Onze Minister van Verkeer en Waterstaat te kennen
      heeft gegeven niet te zullen voldoen aan dit verzoek.

      2 In dringende omstandigheden kan Onze Minister van Defensie afwijken van het eerste lid. Hij stelt Onze Minister
      van Verkeer en Waterstaat daarvan terstond in kennis. Zodra de omstandigheden dat naar het oordeel van Onze
      Minister van Defensie en van Onze Minister van Verkeer en Waterstaat toelaten, wordt aan de door Onze Minister van
      Defensie gestelde behoefte voldaan door Onze Minister van Verkeer en Waterstaat.

      3 Indien een in deze wet toegekende bevoegdheid door Onze Minister van Verkeer en Waterstaat wordt
      uitgeoefend ten behoeve van de uitvoering van de militaire taak, vindt toekenning van een vergoeding krachtens
      [artikel 58, vijfde lid][ref1], plaats in overeenstemming met Onze Minister van Defensie. Deze vergoeding komt voor
      rekening van Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel61a
