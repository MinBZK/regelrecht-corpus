  - number: '65'
    text: |-
      Het is degene, die weet, of redelijkerwijze moet weten, dat hem bij rechterlijke uitspraak de bevoegdheid een
      luchtvaartuig te bedienen is ontzegd, verboden, gedurende de tijd, dat hem die bevoegdheid ontzegd is, een
      luchtvaartuig te bedienen.
    url: https://wetten.overheid.nl/BWBR0002267/2014-01-01#Artikel65
  - number: '66'
    text: |-
      1 Hij, die opzettelijk niet voldoet aan een krachtens [artikel 58][ref1] gegeven aanwijzing, wordt gestraft met
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.

      2 Hij die opzettelijk in strijd handelt met een ingevolge [artikel 59][ref2] gegeven aanwijzing of gedane
      vordering, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.

      3 Hij die opzettelijk in strijd handelt met een ingevolge [artikel 60][ref3] gegeven aanwijzing, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.

      4 Hij, die opzettelijk een ingevolge [artikel 61][ref4] gegeven opdracht niet uitvoert, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel59
