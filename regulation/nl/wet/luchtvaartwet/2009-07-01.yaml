  - number: 77b.3
    text: 'Met betrekking tot de invordering geldt vervolgens dat:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel77b
  - number: 77b.3.a
    text: de belastingaanslagen terstond en tot het volle bedrag invorderbaar zijn;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel77b
  - number: 77b.3.b
    text: |-
      wat betreft de toepassing van [artikel 8, eerste lid, van de Invorderingswet 1990][ref1] uitsluitend bevoegd
      is de functionaris of ambtenaar bedoeld in het eerste lid. De in de [artikelen 11][ref2], [12][ref3] en
      [15, eerste lid, onderdeel a, van de Invorderingswet 1990][ref4] bedoelde bevoegdheden komen uitsluitend toe aan de
      functionaris of ambtenaar bedoeld in het eerste lid. De in [artikel 26 van de Invorderingswet 1990][ref5] bedoelde
      bevoegdheid komt uitsluitend toe aan de door Onze Minister van Verkeer en Waterstaat aan te wijzen ambtenaar, met
      dien verstande dat voor de toepassing van [artikel 26 van die wet][ref6] de door Onze Minister van Financiën bij
      ministeriële regeling gestelde regels van toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '15'
      - id: ref5
        bwb_id: BWBR0004770
        artikel: '26'
      - id: ref6
        bwb_id: BWBR0004770
        artikel: '26'
  - number: 77b.3.c
    text: |-
      de overige bij de invordering van toepassing zijnde bevoegdheden, met uitzondering van die bedoeld in de
      [artikelen 24, tweede en derde lid][ref1], [25][ref2] en [58 van de Invorderingswet 1990][ref3], uitsluitend
      toekomen aan de ontvanger bedoeld in het eerste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '58'
  - number: 77b.3.d
    text: |-
      de bevoegdheid bedoeld in [artikel 24, tweede en derde lid, van de Invorderingswet 1990][ref1] zowel toekomt aan de
      functionaris of ambtenaar bedoeld in het eerste lid als aan de ontvanger bedoeld in het eerste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
  - number: 77b.3.e
    text: |-
      de bevoegdheden bedoeld in [artikel 25][ref1] en [artikel 58 van de Invorderingswet 1990][ref2] toekomen, indien
      de functionaris of ambtenaar bedoeld in het eerste lid met de invordering is belast, aan deze functionaris of
      ambtenaar en indien de ontvanger bedoeld in het eerste lid met de invordering is belast, aan de ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '58'
  - number: 77b.4
    text: |-
      In het kader van het verzet tegen de tenuitvoerlegging van het dwangbevel moet in
      [artikel 17 van de Invorderingswet 1990][ref1] voor "de ontvanger die het dwangbevel heeft uitgevaardigd" telkens
      worden gelezen: de met de tenuitvoerlegging van het dwangbevel belaste ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel17
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '17'
  - number: 77b.5
    text: |-
      Betaling van de heffing dient te geschieden aan de functionaris of ambtenaar bedoeld in het eerste lid. Na de
      betekening van het dwangbevel dient te worden betaald aan de ontvanger bedoeld in het eerste lid die is vermeld op
      het dwangbevel.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel77b
  - number: 77c.1
    text: |-
      Bij ministeriële regeling van Onze Minister van Verkeer en Waterstaat kunnen inzake de heffing en de invordering
      van de geluidsheffing nadere in het kader van de [artikelen 77 tot en met 77][ref1] passende regels worden gesteld
      ter aanvulling van de daarin geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel77
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel77c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '77'
        hoofdstuk: VII
  - number: 77c.2
    text: |-
      Bij ministeriële regeling van Onze Minister van Verkeer en Waterstaat worden regels gesteld inzake de afdracht
      van de door de functionaris als bedoeld in [artikel 77][ref1], ingevorderde heffing aan Onze Minister van Verkeer
      en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel77b
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel77c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 77b
        hoofdstuk: VII
  - number: '80.1'
    text: De wet van 30 Juli 1926, *Stb.* 249 (Luchtvaartwet), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel80
  - number: '80.2'
    text: |-
      De op grond dier wet afgegeven bewijzen van inschrijving, van luchtwaardigheid, van geschiktheid en van
      gelijkstelling blijven, voor zover zij hun geldigheid krachtens de bepalingen dier wet niet hebben verloren,
      hun geldigheid behouden, totdat bij algemene maatregel van bestuur een nadere regeling te dien aanzien zal zijn
      getroffen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel80
  - number: 80a.1
    text: |-
      [Hoofdstuk IV van deze wet][ref1], met uitzondering van [artikel 37][ref2] en van de [afdelingen 3A][ref3] en
      [5][ref4], is niet van toepassing op de luchthaven Schiphol.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002267#HoofdstukIV
      [ref4]: https://wetten.overheid.nl/BWBR0002267#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '37'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002267
        hoofdstuk: IV
        afdeling: 3A
      - id: ref4
        bwb_id: BWBR0002267
        hoofdstuk: IV
        afdeling: '5'
  - number: 80a.2
    text: |-
      Bij toepassing van deze wet op de luchthaven Schiphol moet onder «luchtvaartterrein» en «exploitant van het
      luchtvaartterrein» verstaan worden: luchthavengebied onderscheidenlijk exploitant van de luchthaven als bedoeld in
      [hoofdstuk 8 van de Wet luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '8'
  - number: '81'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip; Wij kunnen Ons voorbehouden een ander tijdstip vast
      te stellen, waarop [artikel 56][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel56
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '56'
        hoofdstuk: IV
        afdeling: '5'
  - number: '82'
    text: Deze wet kan worden aangehaald als "Luchtvaartwet".
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel82
