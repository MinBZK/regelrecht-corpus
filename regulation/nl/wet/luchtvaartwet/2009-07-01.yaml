$id: luchtvaartwet
regulatory_layer: WET
publication_date: '2025-10-30'
valid_from: '2009-07-01'
bwb_id: BWBR0002267
url: https://wetten.overheid.nl/BWBR0002267/2009-07-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen omtrent de luchtvaart te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel1
  - number: 1.1.a
    text: 'luchtvaart: het gebruik van luchtvaartuigen;'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel1
  - number: 1.1.b
    text: |-
      luchtvaartuig: toestel, bedoeld in [artikel 1.1, eerste lid, van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
  - number: 1.1.c
    text: 'vliegtuigen: luchtvaartuigen zwaarder dan lucht en voorzien van een voortstuwingsinrichting;'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel1
  - number: 1.1.d
    text: |-
      exploitant van een luchtvaartterrein: degene, te wiens name ingevolge deze wet een luchtvaartterrein wordt
      aangewezen;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel1
  - number: 1.1.f
    text: 'buitenlandse luchtvaartuigen: luchtvaartuigen, ingeschreven in een buitenlands luchtvaartuigregister;'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel1
  - number: 1.1.g
    text: 'luchtvaartterreinen: een aangewezen terrein ingericht voor het opstijgen en landen van luchtvaartuigen;'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel1
  - number: 1.1.h
    text: |-
      luchtvaartmaatschappijen: eigenaren van ondernemingen, die geheel of gedeeltelijk hun bedrijf maken van het vervoer
      van personen, dieren of goederen met luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel1
  - number: 1.1.i
    text: 'verkeersvlucht: een vlucht, die vervoer door een luchtvaartmaatschappij ten doel heeft;'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel1
  - number: 1.1.j
    text: |-
      Onze Minister: voor wat de burgerluchtvaart en de algemene verkeersveiligheid in de lucht betreft: Onze Minister
      van Verkeer en Waterstaat: voor wat de militaire luchtvaart betreft: Onze Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel1
  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder uitwendige scheidingsconstructie,
      verblijfsgebiedverblijfsruimte en gezondheidszorggebouw verstaan hetgeen daaronder wordt verstaan in
      [artikel 1 van het Bouwbesluit][ref1] (*Stb.* 1991, 680). Voor de toepassing van [artikel 26b][ref2]
      en de daarop berustende bepalingen wordt voor wat betreft de voorschriften die samenhangen met de in
      [artikel 25, vierde lid][ref3], bedoelde grenswaarde onder gezondheidszorggebouwen verstaan die gedeelten van
      gezondheidszorggebouwen waarin personen die medisch worden verpleegd, verzorgd of behandeld, de nacht doorbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005321#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel26b
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel25
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005321
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 26b
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '25'
        hoofdstuk: IV
        afdeling: '1'
  - number: '2'
    text: Voor de toepassing van het bij of krachtens deze wet bepaalde wordt mede verstaan onder
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel2
  - number: 2.a
    text: 'gezagvoerder: hij, die een luchtvaartuig alleen bedient;'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel2
  - number: 2.b
    text: |-
      bedienen van een luchtvaartuig: het verrichten van handelingen aan boord van een luchtvaartuig ten behoeve van het
      gebruik van dat luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel2
  - number: 2.c
    text: 'terreinen: watergebieden;'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel2
  - number: 2.d
    text: 'bouwwerken: getimmerten, constructiemasten, bovengrondse geleidingen, dijken en kaden.'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel2
  - number: 2.e
    text: 'luchtwaardigheid: de toelaatbaarheid van het door het luchtvaartuig veroorzaakte geluid.'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel2
  - number: '9'
    text: |-
      Ten aanzien van het in luchtwaardige toestand houden van Nederlandse luchtvaartuigen worden de bewijzen van
      bevoegdheid afgegeven, geschorst of ingetrokken door Onze Minister en wel, voor wat burgerluchtvaartuigen betreft,
      naar regelen, gesteld bij of krachtens algemene maatregel van bestuur. Voorts kan Onze Minister bewijzen van
      gelijkstelling van buitenlandse bewijzen van bevoegdheid afgeven, schorsen en intrekken, naar regelen, gesteld bij
      of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel9
  - number: '14.1'
    text: 'Het is verboden binnen Nederland:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel14
  - number: 14.1.a
    text: met een luchtvaartuig op te stijgen of een luchtvaartuig te doen opstijgen anders dan van een luchtvaartterrein;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel14
  - number: 14.1.b
    text: met een luchtvaartuig te landen of een luchtvaartuig te doen landen anders dan op een luchtvaartterrein;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel14
  - number: 14.1.c
    text: een niet als luchtvaartterrein aangewezen terrein in te richten voor het opstijgen en landen van luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel14
  - number: '14.2'
    text: 'Het bepaalde in het eerste lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel14
  - number: 14.2.a
    text: in de gevallen, aangegeven bij algemene maatregel van bestuur;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel14
  - number: 14.2.b
    text: indien en voor zover Onze Minister ontheffing heeft verleend.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel14
  - number: '16'
    text: |-
      Voor zover bij internationale overeenkomst niet anders is bepaald mag vervoer met luchtvaartuigen in, naar of uit
      Nederland, of met Nederland als tussenstation, slechts geschieden door luchtvaartmaatschappijen aan wie daartoe
      door Onze Minister vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16
  - number: 16a.1
    text: |-
      Ten aanzien van vergunningen als bedoeld in [artikel 16][ref1] die vallen onder [verordening (EEG) nr. 2407/92]
      (31992R2407) van de Raad van de Europese Gemeenschappen van 23 juli 1992 betreffende de verlening, intrekking en
      schorsing van exploitatievergunningen aan luchtvaartmaatschappijen (*PbEG* L 240), wordt toegepast hetgeen bij of
      krachtens die verordening is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
  - number: 16a.2
    text: |-
      Een wijziging van het bepaalde bij of krachtens de verordening, genoemd in het eerste lid, treedt voor de
      toepassing van het eerste lid in werking met ingang van de dag waarop de betrokken wijzigingsregeling in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16a
  - number: 16a.3
    text: |-
      Aan een vergunning als bedoeld in het eerste lid kunnen voorschriften worden verbonden voor zover deze in
      overeenstemming zijn met de verordening.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16a
  - number: 16a.4
    text: 'Onverminderd de verordening kan Onze Minister een vergunning als bedoeld in het eerste lid, schorsen of intrekken:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16a
  - number: 16a.4.a
    text: indien de vergunninghouder daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16a
  - number: 16a.4.b
    text: wegens uitoefening van het vervoer in strijd met bij of krachtens deze wet gegeven voorschriften;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16a
  - number: 16a.4.c
    text: wegens niet-inachtneming van aan de vergunning verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16a
  - number: 16a.4.d
    text: indien ter verkrijging van de vergunning onjuiste of onvolledige gegevens zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16a
  - number: 16a.5
    text: Onze Minister kan een vergunning als bedoeld in het eerste lid, op verzoek van de houder wijzigen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16a
  - number: 16b.1
    text: |-
      Een vergunning als bedoeld in [artikel 16][ref1] die niet valt onder de in [artikel 16a, eerste lid][ref2] genoemde
      verordening, wordt verleend voor een bepaalde, daarin genoemde, termijn van ten hoogste vijf jaar. Zij kan door
      Onze Minister worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel16a
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 16a
        hoofdstuk: III
        afdeling: '3'
  - number: 16b.2
    text: Aan een vergunning als bedoeld in het eerste lid, kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16b
  - number: 16b.3
    text: 'Onze Minister kan een vergunning als bedoeld in het eerste lid, schorsen of intrekken:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16b
  - number: 16b.3.a
    text: indien de vergunninghouder daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16b
  - number: 16b.3.b
    text: wegens niet-uitoefening van het vervoer;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16b
  - number: 16b.3.c
    text: wegens uitoefening van het vervoer in strijd met bij of krachtens deze wet gegeven voorschriften;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16b
  - number: 16b.3.d
    text: wegens niet-inachtneming van aan de vergunning verbonden voorschriften of beperkingen;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16b
  - number: 16b.3.e
    text: indien ter verkrijging van de vergunning onjuiste of onvolledige gegevens zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16b
  - number: 16b.4
    text: Onze Minister kan een vergunning als bedoeld in het eerste lid, op verzoek van de houder wijzigen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16b
  - number: 16b.5
    text: |-
      Een vergunning als bedoeld in het eerste lid verliest haar geldigheid zolang en voor zover de vergunninghouder is
      geplaatst op de communautaire lijst, bedoeld in Verordening (EG) nr. 2111/2005 van het Europees Parlement en de
      Raad van de Europese Gemeenschappen van 14 december 2005 betreffende de vaststelling van een communautaire lijst
      van luchtvaartmaatschappijen waaraan een exploitatieverbod binnen de Gemeenschap is opgelegd en het informeren van
      luchtreizigers over de identiteit van de exploiterende luchtvaartmaatschappij en tot intrekking van artikel 9 van
      richtlijn nr. 2004/36/EG.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16b
  - number: 16b.6
    text: |-
      Een aanvraag voor een vergunning als bedoeld in het eerste lid, of voor een verlenging voor een dergelijke
      vergunning wordt afgewezen voor zover de aanvraag betrekking heeft op activiteiten waarvoor de aanvrager op de
      communautaire lijst, bedoeld in het vijfde lid, is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16b
  - number: 16c
    text: |-
      Bij ministeriële regeling kunnen bepaalde soorten van vervoer worden uitgezonderd van de in [artikel 16][ref1]
      vervatte verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
  - number: 16d.1
    text: |-
      Onze Minister kan ontheffing verlenen van de in [artikel 16][ref1] vervatte verplichting. Van de beschikking ter
      zake wordt mededeling in de *Staatscourant* gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
  - number: 16d.2
    text: Aan de in het eerste lid bedoelde ontheffingen kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16d
  - number: 16d.3
    text: |-
      Onze Minister kan een ontheffing schorsen of intrekken wegens niet inachtneming van de aan de ontheffing verbonden
      voorschriften of beperkingen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel16d
  - number: '17.1'
    text: Het is verboden luchtvaartvertoningen of luchvaartwedstrijden te houden zonder vergunning van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel17
  - number: '17.2'
    text: |-
      Het is verboden boven Nederland deel te nemen aan een vertoning of wedstrijd als bedoeld in het eerste lid,
      waarvoor geen vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel17
  - number: '17.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven waaraan bij het aanvragen van een
      vergunning tot het houden van een luchtvaartvertoning of een luchtvaartwedstrijd en bij het houden van zodanige
      vertoning of wedstrijd moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel17
  - number: 37a.1
    text: 'Voor de toepassing van deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37a
  - number: 37a.1.a
    text: |-
      luchtvaartterreinen: een luchtvaartterrein dat mede wordt gebruikt voor verkeersvluchten, met uitzondering van die
      delen van een militair luchtvaartterrein die niet uitsluitend ten behoeve van de burgerluchtvaart worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37a
  - number: 37a.1.b
    text: 'beveiligingspersoneel:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37a
  - number: 37a.1.b.1°
    text: |-
      personen in dienst van een door de exploitant van een luchtvaartterrein met de uitvoering van de beveiliging
      belaste particuliere beveiligingsorganisatie, waaraan door Onze Minister van Justitie een vergunning is verleend
      als bedoeld in [artikel 3 van de Wet particuliere beveiligingsorganisaties en recherchebureaus][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel3
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '3'
  - number: 37a.1.b.2°
    text: |-
      de door Onze Minister van Justitie aangewezen ambtenaren van politie, ambtenaren van de Koninklijke marechaussee en
      de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37a
  - number: 37a.1.c
    text: |-
      voor bedreiging geschikte voorwerpen: wapens, explosieven of andere voorwerpen en stoffen, die voor de bedreiging
      van personen geschikt zijn dan wel de veiligheid van het luchtvaartuig in gevaar kunnen brengen;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37a
  - number: 37a.1.d
    text: |-
      gevaarlijke goederen: explosieven of andere voorwerpen en stoffen, die de veiligheid van het luchtvaartuig in
      gevaar kunnen brengen;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37a
  - number: 37a.1.e
    text: 'bagage: goederen toebehorende aan passagiers,'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37a
  - number: 37a.1.e.1°
    text: die deze zelf in het luchtvaartuig meenemen als handbagage, of
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37a
  - number: 37a.1.e.2°
    text: |-
      die deze in verband met hun reis aan de luchtvaartmaatschappij hebben afgegeven teneinde in het ruim van het
      luchtvaartuig te worden vervoerd als ruimbagage;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37a
  - number: 37a.1.f
    text: |-
      vracht: goederen, niet zijnde bagage, die voor vervoer door de lucht worden aangeboden, daaronder begrepen
      poststukken als bedoeld in [artikel 2, onderdeel b, van de Postwet 2009][ref1], tenzij deze goederen door de lucht
      worden aangevoerd en het vliegtuig niet verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0025572#Artikel2
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0025572
        artikel: '2'
  - number: 37a.2
    text: |-
      Met betrekking tot militaire luchtvaartterreinen waarvan delen uitsluitend ten behoeve van de burgerluchtvaart
      worden gebruikt, wordt in afwijking van [artikel 1, eerste lid, onder d][ref1], voor de toepassing van deze
      afdeling als exploitant van een luchtvaartterrein aangemerkt, de bij koninklijk besluit aan te wijzen rechtspersoon
      aan wie het medegebruik ten behoeve van de burgerluchtvaart is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel1
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '1'
        hoofdstuk: I
  - number: 37a.3
    text: |-
      Een koninklijk besluit als bedoeld in het tweede lid wordt genomen op voordracht van Onze Minister van Verkeer en
      Waterstaat in overeenstemming met Onze Ministers van Justitie en van Defensie.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37a
  - number: 37ab
    text: |-
      Onze Minister van Justitie is belast met de beveiliging van de burgerluchtvaart. De exploitant van een
      luchtvaartterrein, een luchtvaartmaatschappij en een persoon als bedoeld in [artikel 37p][ref1], eerste lid,
      zijn gehouden te voldoen aan door Onze Minister van Justitie of namens deze door de Commandant van de Koninklijke
      marechaussee gegeven aanwijzingen inzake de nakoming van een verplichting die op hen rust ingevolge de
      [artikelen 37ada][ref2], [37b, zesde lid][ref3], [37f][ref4], [37g][ref5], [37h][ref6], [37hb][ref7], [37hd][ref8],
      [37k][ref9], [37l][ref10], [37n][ref11] of [37r][ref12], of ingevolge een verplichting die voortvloeit uit een EG-
      verordening voor zover deze betrekking heeft op de beveiliging van de burgerluchtvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37ada
