  - number: 37ac.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven voor de uitvoering van de
      controle, bedoeld in [artikel 37b, zesde lid][ref1], en de paragrafen 3 en 4, alsmede voor de afhandeling van
      daarbij geconstateerde onregelmatigheden. De controle wordt verricht met inachtneming van de door Onze Minister van
      Justitie gegeven algemene aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ac
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37b
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: 3A
  - number: 37ac.2
    text: |-
      Onze Minister van Justitie kan naar aanleiding van onvoorziene omstandigheden bijzondere aanwijzingen geven voor
      de uitvoering van de controle, bedoeld in het eerste lid. In dat geval bepaalt Onze Minister van Justitie dat de
      kosten worden vergoed die redelijkerwijs zijn gemaakt om de aanwijzing uit te voeren.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ac
  - number: 37ad.1
    text: |-
      Onze Minister van Justitie kan op grond van omstandigheden of inlichtingen vaststellen, dat er voor een
      luchtvaartterrein dan wel bepaalde daar aanwezige luchtvaartuigen, een bijzonder gevaar bestaat dat zij het object
      van geweldpleging, aanslagen of bedreiging zullen vormen. Hij geeft hiervan onverwijld kennis aan de exploitant van
      dat luchtvaartterrein en, in voorkomend geval, aan de luchtvaartmaatschappij van die luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ad
  - number: 37ad.2
    text: |-
      Na toepassing van het eerste lid worden geen goederen aan boord van de betrokken luchtvaartuigen gebracht dan na,
      zonodig stuksgewijs, onderzoek op de aanwezigheid van voor bedreiging geschikte voorwerpen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ad
  - number: 37ad.3
    text: |-
      Onze Minister van Justitie kan in andere dan de in het eerste lid bedoelde gevallen, luchtvaartuigen aanwijzen
      waarop het tweede lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ad
  - number: 37ada.1
    text: |-
      Ter beveiliging van de burgerluchtvaart kan Onze Minister van Justitie vluchten van een luchtvaartmaatschappij
      aanwijzen waarop ambtenaren van de Koninklijke marechaussee worden ingezet.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ada
  - number: 37ada.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld ten aanzien van het bepaalde in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ada
  - number: 37ae.1
    text: |-
      Indien de naleving van de bij of krachtens deze afdeling gestelde voorschriften of van een verplichting die
      voortvloeit uit een EG-verordening voor zover deze betrekking heeft op de beveiliging van de burgerluchtvaart,
      gevaar dreigt te lopen, doet de exploitant van een luchtvaartterrein, de betrokken luchtvaartmaatschappij of een
      persoon als bedoeld in [artikel 37p, eerste lid][ref1], daarvan onverwijld mededeling aan de Commandant van de
      Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ae
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37p
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37ae.2
    text: |-
      Bij wijze van bestuursdwang kan Onze Minister van Justitie het opstijgen van een luchtvaartuig verbieden en
      beletten indien er een redelijk vermoeden bestaat dat wegens het niet naleven van de bij of krachtens deze afdeling
      gestelde voorschriften of van een verplichting die voortvloeit uit een EG-verordening voor zover deze betrekking
      heeft op de beveiliging van de burgerluchtvaart, de beveiliging van de burgerluchtvaart in gevaar kan komen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ae
  - number: 37ae.3
    text: |-
      Onze Minister van Justitie kan de bevoegdheid, bedoeld in het tweede lid, mandateren aan de Commandant van de
      Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ae
  - number: 37af
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de inhoud van de
      opleiding in het kader van de beveiliging van de burgerluchtvaart en de organisaties die deze opleiding verzorgen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37af
  - number: 37ag.1
    text: |-
      De exploitant van een luchtvaartterrein draagt ervoor zorg dat het beveiligingspersoneel, bedoeld in
      [artikel 37a, eerste lid, onderdeel b, onder 1][ref1], en het personeel dat werkzaam is op de delen van het
      luchtvaartterrein, bedoeld in [artikel 37b, eerste lid, onderdeel a tot en met c][ref2], met uitzondering van het
      beveiligingspersoneel, bedoeld in [artikel 37a, eerste lid, onderdeel b, onder 2][ref3], een opleiding in het kader
      van de beveiliging van de burgerluchtvaart hebben gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ag
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37a
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37b
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: 3A
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 37a
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
  - number: 37ag.2
    text: |-
      De luchtvaartmaatschappij draagt ervoor zorg dat het personeel dat belast is met de taken, bedoeld in
      [artikel 37g][ref1], en het personeel dat direct toegang heeft tot of belast is met de beveiliging van luchtvracht,
      een opleiding in het kader van de beveiliging van de burgerluchtvaart hebben gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37g
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ag
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37g
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37ag.3
    text: |-
      De houder van de concessie, bedoeld in [artikel 2a van de Postwet][ref1], draagt ervoor zorg dat het personeel
      dat direct toegang heeft tot of belast is met de beveiliging van luchtpost, een opleiding in het kader van de
      beveiliging van de burgerluchtvaart heeft gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ag
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 2a
  - number: 37ag.4
    text: |-
      De personen, bedoeld in [artikel 37p, eerste lid][ref1], dragen ervoor zorg dat het personeel dat direct toegang
      heeft tot of belast is met de beveiliging van luchtvracht, een opleiding in het kader van de beveiliging van de
      burgerluchtvaart heeft gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ag
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37p
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37b.1
    text: 'De exploitant van een luchtvaartterrein wijst de delen daarvan aan:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37b.1.a
    text: |-
      die door het publiek slechts betreden mogen worden, indien de betrokken personen in het bezit zijn van een geldig
      reisbiljet of een daartoe afgegeven persoonsgebonden kaart;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37b.1.b
    text: die niet voor het publiek toegankelijk zijn;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37b.1.c
    text: die slechts voor een beperkte categorie van de op het luchtvaartterrein werkzame personen toegankelijk zijn;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37b.1.d
    text: die voor het publiek toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37b.2
    text: |-
      Onze Minister van Justitie, in overeenstemming met Onze Minister, kan delen van het luchtvaartterrein aanwijzen die
      in ieder geval tot een van de in het eerste lid bedoelde delen behoren.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37b.3
    text: 'De exploitant van een luchtvaartterrein draagt er zorg voor:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37b.3.a
    text: |-
      dat een ieder die toegang heeft tot een van de in het eerste lid, onder *b* en *c*, bedoelde delen, over een door
      hem verstrekt of erkend toegangsbewijs beschikt, waaruit tevens duidelijk kenbaar is tot welke delen de drager
      toegang heeft;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37b.3.b
    text: |-
      dat een ieder die zich in een van de in het eerste lid, onder *b* en *c*, bedoelde delen bevindt, verplicht is het
      onder *a* bedoelde toegangsbewijs zichtbaar te dragen;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37b.3.c
    text: |-
      dat een ieder die zich in een van de in het eerste lid, onder *a*, bedoelde delen bevindt, verplicht is het onder
      *a* bedoelde toegangsbewijs dan wel een geldig reisbiljet of een daartoe afgegeven persoonsgebonden kaart bij zich
      te hebben en dit te allen tijde op verzoek van een lid van het beveiligingspersoneel ter inzage te geven;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37b.3.d
    text: |-
      dat voertuigen die worden gebruikt op de delen, bedoeld in het eerste lid onder b en c, zijn voorzien van een door
      de exploitant van een luchtvaartterrein afgegeven toegangsbewijs dat duidelijk zichtbaar is aangebracht en waarop
      duidelijk kenbaar is tot welke delen het voertuig toegang heeft.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37b.4
    text: |-
      De exploitant van een luchtvaartterrein schermt de in het eerste lid, onder *b* en *c*, bedoelde delen van het
      luchtvaartterrein zodanig onderling van elkaar af dat zij slechts op een beperkt aantal door beveiligingspersoneel
      of anderszins bewaakte plaatsen toegankelijk zijn na controle van het toegangsbewijs. Delen als bedoeld in
      het eerste lid, onder *c*, die voor onderscheiden categorieën personeel toegankelijk zijn worden daarbij als
      onderscheiden delen aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37b.5
    text: |-
      De plaatsen bedoeld in het vierde lid, dienen duidelijk gemarkeerd te zijn onder aanduiding van de categorieën
      personen die toegang hebben. De plaatsen dienen steeds helder verlicht en afsluitbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37b.6
    text: |-
      Een ieder die op de plaatsen, bedoeld in het vierde lid, toegang zoekt tot of zich bevindt op een van de in het
      eerste lid, onder b en c, bedoelde delen, gedoogt dat vanwege de exploitant van een luchtvaartterrein onderzoek
      plaatsvindt aan zijn kleding, van voorwerpen die hij bij zich heeft of van het voertuig dat hij gebruikt.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37b.7
    text: |-
      De exploitant van een luchtvaartterrein draagt er zorg voor, dat personen die niet voldoen aan het derde lid, onder
      *b* en *c*, of het zesde lid, de verdere toegang tot de in het eerste lid bedoelde delen van het luchtvaartterrein
      wordt ontzegd.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37b
  - number: 37c.1
    text: |-
      De exploitant van een luchtvaartterrein treft de nodige voorzieningen om te voorkomen dat personen of bagage aan
      boord van een luchtvaartuig gaan zonder dat deze zijn onderworpen aan een controle overeenkomstig paragraaf 3.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37c
  - number: 37c.2
    text: 'De exploitant van een luchtvaartterrein is verplicht te beschikken over:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37c
  - number: 37c.2.a
    text: |-
      voldoende en passende detectieapparatuur voor de uitoefening van de controle door het beveiligingspersoneel
      overeenkomstig paragraaf 3;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37c
  - number: 37c.2.b
    text: |-
      een ruimte voor vertrekkende passagiers die zodanig is ingericht dat gecontroleerde passagiers en handbagage zijn
      afgeschermd en een vermenging met niet gecontroleerde personen en voorwerpen niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37c
  - number: 37c.2.c
    text: een ruimte voor onderzoek van bagage en dieren bestemd voor vervoer en
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37c
  - number: 37c.2.d
    text: een afsluitbare en beveiligde ruimte bestemd voor het bewaren van verdachte bagage.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37c
  - number: 37c.3
    text: |-
      Onze Minister van Justitie kan, in overeenstemming met Onze Minister, nadere regels stellen met betrekking tot de
      voorzieningen die zijn vereist ter beveiliging van de burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37c
  - number: 37c.4
    text: |-
      Onze Minister van Justitie kan de exploitant van een luchtvaartterrein een aanwijzing geven inzake de aanschaf van
      detectie-apparatuur indien deze apparatuur redelijkerwijs niet als passend kan worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37c
  - number: 37d
    text: 'De exploitant van een luchtvaartterrein richt de luchthaven zodanig in, en treft zodanige voorzieningen dat:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37d
  - number: 37d.a
    text: een plaats beschikbaar is voor het afzonderen van een luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37d
  - number: 37d.b
    text: |-
      het beveiligingspersoneel snel en op eenvoudige wijze de verschillende delen van het luchtvaartterrein kan bereiken
      en toezicht kan houden op daar aanwezige personen;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37d
  - number: 37d.c
    text: redelijkerwijze voorkomen wordt dat onbevoegden een geparkeerd luchtvaartuig betreden.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37d
  - number: 37e.1
    text: |-
      De exploitant van een luchtvaartterrein is gehouden een plan op te stellen met betrekking tot de beveiliging van
      het luchtvaartterrein. Het plan behoeft de instemming van Onze Minister van Justitie in overeenstemming met Onze
      Minister. Het plan wordt op hun verzoek, onder het stellen van een redelijke termijn, aangepast.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37e
  - number: 37e.2
    text: 'Het plan, bedoeld in het eerste lid, omvat onder meer:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37e
  - number: 37e.2.a
    text: |-
      de plichten, verantwoordelijkheden, maatregelen en procedures die zijn vastgesteld met het oog op de beveiliging
      van het luchtvaartterrein;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37e
  - number: 37e.2.b
    text: |-
      de bijzondere procedures en maatregelen voor situaties als bedoeld in [artikel 37ad, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ad
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37e
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37ad
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
  - number: 37e.2.c
    text: |-
      de maatregelen en procedures in geval van dreiging van onwettige daden van geweld, bomalarm, kaping of gewapende
      aanvallen op het luchtvaartterrein en
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37e
  - number: 37e.2.d
    text: andere bij algemene maatregel van bestuur te bepalen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37e
  - number: 37e.3
    text: |-
      De exploitant van een luchtvaartterrein informeert uit eigen beweging Onze Minister en Onze Minister van Justitie
      indien het plan door omstandigheden niet kan worden uitgevoerd of daarin wijzigingen worden aangebracht. Hij
      verstrekt desgevraagd Onze Ministers informatie over de beveiliging van het luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37e
  - number: 37e.4
    text: |-
      Indien een onderdeel van het plan niet wordt uitgevoerd, kan Onze Minister van Justitie de exploitant van een
      luchtvaartterrein een aanwijzing geven die ertoe strekt zo veel mogelijk het oorspronkelijk in het plan aangegeven
      niveau van beveiliging te benaderen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37e
  - number: 37f.1
    text: |-
      De exploitant van een luchtvaartterrein doet de personen die als passagiers aan boord gaan van een luchtvaartuig,
      alsmede hun handbagage, door het beveiligingspersoneel controleren op de aanwezigheid van voor bedreiging geschikte
      voorwerpen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37f
  - number: 37f.2
    text: 'De exploitant van een luchtvaartterrein kan:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37f
  - number: 37f.2.a
    text: |-
      voor vervoer met een passagiersvlucht aangeboden ruimbagage door het beveiligingspersoneel doen controleren op de
      aanwezigheid van voor bedreiging geschikte voorwerpen en
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37f
  - number: 37f.2.b
    text: |-
      de personen die anders dan als passagier aan boord kunnen gaan van een luchtvaartuig door het beveiligingspersoneel
      doen controleren op hun identiteit en op de rechtmatigheid van hun aanwezigheid op het luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37f
  - number: 37f.3
    text: |-
      Indien bij controle voor bedreiging geschikte voorwerpen worden aangetroffen of de naleving van het gestelde
      in dit artikel met betrekking tot de uitvoering van de controle in gevaar komt, doet de exploitant van een
      luchtvaartterrein daarvan onverwijld mededeling aan de Commandant van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37f
  - number: 37g.1
    text: |-
      De luchtvaartmaatschappij draagt zorg dat geen ruimbagage aan boord is die niet toebehoort aan de aan boord
      zijnde passagiers. Bij regeling van Onze Minister van Justitie, in overeenstemming met Onze Minister, kan hiervoor
      vrijstelling worden verleend. Daarbij worden voorschriften gegeven als vervangende waarborg met het oog op de
      beveiliging. In bijzondere gevallen kan Onze Minister van Justitie ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37g
  - number: 37g.2
    text: |-
      De luchtvaartmaatschappij draagt zorg voor de controle op de aanwezigheid van voor bedreiging geschikte voorwerpen
      van alle goederen die aan boord gaan van een luchtvaartuig niet zijnde bagage of vracht.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37g
  - number: 37g.3
    text: |-
      Het bepaalde in [artikel 37f, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37g
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37h.1
    text: |-
      De controle, bedoeld in [artikel 37f, eerste lid][ref1], omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37h.1.a
    text: een onderzoek met behulp van daartoe bestemde detectieapparatuur van passagiers en handbagage;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
  - number: 37h.1.b
    text: |-
      steekproefsgewijs, en indien de detectieapparatuur daartoe aanleiding geeft, een onderzoek van passagiers aan hun
      kleding en een nader onderzoek van hun handbagage;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
  - number: 37h.1.c
    text: |-
      de stelselmatige uitvoering van het onderzoek aan kleding van passagiers en van handbagage in door Onze Minister
      van Justitie bij ministeriële regeling te bepalen gevallen;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
  - number: 37h.1.d
    text: |-
      een bevraging van de passagiers met het oog op hun betrouwbaarheid in door Onze Minister van Justitie bij
      ministeriële regeling te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
  - number: 37h.2
    text: |-
      De controle, bedoeld in [artikel 37f, tweede lid, onderdeel a][ref1], omvat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37h.2.a
    text: een onderzoek met behulp van daartoe bestemde detectieapparatuur of andere technische hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
  - number: 37h.2.b
    text: een nader onderzoek naar de inhoud van de bagage indien daartoe aanleiding is.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
  - number: 37h.3
    text: |-
      De controle, bedoeld in [artikel 37f, tweede lid, onderdeel b][ref1], kan omvatten:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37h.3.a
    text: een nader onderzoek van het toegangsbewijs waarover de betrokkene beschikt;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
  - number: 37h.3.b
    text: een onderzoek met behulp van daartoe bestemde detectieapparatuur;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
  - number: 37h.3.c
    text: een onderzoek, indien daartoe aanleiding is, van meegevoerde goederen en aan de kleding.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
  - number: 37h.4
    text: |-
      De controle, bedoeld in [artikel 37g, tweede lid][ref1], omvat in ieder geval een visuele uitwendige controle van
      de goederen of hun verpakking.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37g
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37g
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37h.5
    text: |-
      Bij regeling van Onze Minister van Justitie, in overeenstemming met Onze Minister, kan ten aanzien van bepaalde
      soorten vluchten of luchtvaartuigen, vrijstelling worden verleend van een controle als bedoeld in het eerste en
      tweede lid, wanneer de dreiging voor deze vluchten of luchtvaartuigen als gevolg van voor bedreiging geschikte
      voorwerpen, verwaarloosbaar is. Daarbij kunnen nadere voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
  - number: 37h.6
    text: |-
      Onze Minister van Justitie kan in bijzondere gevallen op de grond, bedoeld in het vijfde lid, ontheffing verlenen
      van de controle.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37h
  - number: 37ha
    text: |-
      Een lid van het beveiligingspersoneel belast met de controle, dat daarbij de beschikking krijgt over gegevens
      waarvan hij het vertrouwelijk karakter kent of redelijkerwijze moet vermoeden, en voor wie niet reeds uit hoofde
      van ambt of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37ha
  - number: 37hb
    text: 'De exploitant van een luchtvaartterrein doet:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37hb
  - number: 37hb.a
    text: |-
      personen die weigeren zichzelf of hun bagage te onderwerpen aan de controle bedoeld in
      [artikel 37f, eerste lid][ref1], verhinderen enig luchtvaartuig te betreden, hen de verdere toegang tot de in
      [artikel 37b, eerste lid][ref2], bedoelde delen ontzeggen en hen daaruit zo nodig verwijderen;


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37hb
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37b
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: 3A
  - number: 37hb.b
    text: |-
      bij de controle van personen aangetroffen voor bedreiging geschikte voorwerpen, niet dan in overeenstemming met
      door Onze Minister van Justitie te stellen regels of te geven aanwijzingen, aan boord van een luchtvaartuig brengen
      en
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37hb
  - number: 37hb.c
    text: |-
      de maatregelen als bedoeld in onderdeel a, treffen jegens degene bij wie of in wiens bagage voor bedreiging
      geschikte voorwerpen worden aangetroffen, indien deze niet overeenkomstig de regels of aanwijzingen als bedoeld in
      onderdeel b, op verzoek van het beveiligingspersoneel zijn afgegeven.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37hb
  - number: 37hc
    text: 'De personen die aan boord gaan van een luchtvaartuig, zijn verplicht:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37hc
  - number: 37hc.a
    text: |-
      zich te onderwerpen aan een controle als bedoeld in [artikel 37f, eerste lid en tweede lid, onderdeel b][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37hc
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37hc.b
    text: |-
      medewerking te verlenen aan de handelingen ter uitvoering van de verplichting, bedoeld in
      [artikel 37hb, onderdeel a tot en met c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37hb
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37hc
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37hb
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37hd
    text: |-
      De bepalingen in deze paragraaf laten onverlet dat de exploitant van een luchtvaartterrein op verzoek van een
      luchtvaartmaatschappij of een buitenlandse overheid een verdergaande controle kan uitvoeren, indien dit in de
      vervoersovereenkomst tussen de passagier en de luchtvaartmaatschappij wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37hd
  - number: 37j.1
    text: De luchtvaartmaatschappij draagt zorg voor de controle van vracht op de aanwezigheid van gevaarlijke goederen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37j
  - number: 37j.2
    text: |-
      Het gestelde in het eerste lid kan, onverminderd het bepaalde bij of krachtens deze of andere wetten, achterwege
      blijven indien er sprake is van:
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37j
  - number: 37j.2.a
    text: |-
      vracht bestemd om te worden overgeladen van het ene vliegtuig op het andere, voor zover deze is voorzien van
      bescherming tegen bemoeienis door ongeautoriseerde personen;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37j
  - number: 37j.2.b
    text: vervoer van stoffelijke overschotten;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37j
  - number: 37j.2.c
    text: levende dieren;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37j
  - number: 37j.2.d
    text: |-
      levensreddende materialen, voor zover de controle afbreuk kan doen aan de levensreddende kwaliteit van het
      materiaal;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37j
  - number: 37j.2.e
    text: nucleair materiaal, of
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37j
  - number: 37j.2.f
    text: |-
      andere bij regeling van Onze Minister van Justitie aangewezen vracht, voor zover de controle afbreuk kan doen aan
      de kwaliteit van de vracht.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37j
  - number: 37k.1
    text: |-
      De controle, bedoeld in het [artikel 37j, eerste lid][ref1], omvat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37j
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37k
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37j
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37k.1.a
    text: een onderzoek naar de identiteit van degene die feitelijk vracht aanbiedt;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37k
  - number: 37k.1.b
    text: |-
      het stelselmatig uitvoeren van onderzoek met de hand, met behulp van passende detectieapparatuur of van andere
      technische hulpmiddelen en
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37k
  - number: 37k.1.c
    text: de verificatie van de luchtvrachtbrief en de verzamelstaat.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37k
  - number: 37k.2
    text: |-
      Voor zover de aard of samenstelling van de vracht zich tegen controle verzet, kan bij regeling van Onze Minister
      van Justitie vrijstelling worden verleend van handelingen als bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37k
  - number: 37k.3
    text: |-
      De [artikelen 37c, derde en vierde lid][ref1], en [37f, derde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37c
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37k
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37c
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37k.4
    text: |-
      De luchtvaartmaatschappij doet de bij de controle aangetroffen gevaarlijke goederen of de vracht waarin gevaarlijke
      goederen zijn aangetroffen, aan boord van een luchtvaartuig brengen overeenkomstig door Onze Minister van Justitie
      vast te stellen regels of te geven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37k
  - number: 37l.1
    text: |-
      [Artikel 37k][ref1] is niet van toepassing indien vracht wordt aangeboden door de personen, bedoeld in het tweede
      lid, en uit een uitwendige visuele controle is gebleken, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37k
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37l
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37k
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37l.1.a
    text: de vracht is verpakt;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37l
  - number: 37l.1.b
    text: de verpakking onbeschadigd is;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37l
  - number: 37l.1.c
    text: geen gevaarlijke goederen zijn toegevoegd, en
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37l
  - number: 37l.1.d
    text: geen onregelmatigheden met de verpakking hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37l
  - number: 37l.2
    text: 'De personen, bedoeld in het eerste lid, aanhef, zijn:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37l
  - number: 37l.2.a
    text: |-
      een geregistreerde als bedoeld in [artikel 37p, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37l
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37p
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37l.2.b
    text: |-
      een niet-geregistreerde voor zover de vracht afkomstig is van een geregistreerde en deze is verpakt overeenkomstig
      de bij regeling van Onze Minister van Justitie vast te stellen voorschriften om te voorkomen dat daaraan
      gevaarlijke goederen worden toegevoegd;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37l
  - number: 37l.2.c
    text: |-
      een rechtspersoon waarop een verplichting tot vervoer van voorwerpen rust ingevolge de [Postwet][ref1], of een
      overeenkomstige buitenlandse postinstelling, of


      [ref1]: https://wetten.overheid.nl/BWBR0004423
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37l
    references:
      - id: ref1
        bwb_id: BWBR0004423
  - number: 37l.2.d
    text: |-
      de bij regeling van Onze Minister van Justitie vast te stellen categorieën van natuurlijke personen of
      rechtspersonen, die in het buitenland zijn gevestigd en ten aanzien waarvan op grond van internationale afspraken
      toereikende waarborgen aanwezig zijn dat maatregelen zijn genomen ter beveiliging van de aangeboden vracht.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37l
  - number: 37l.3
    text: |-
      Onze Minister van Justitie kan bepalen dat de uitzondering, bedoeld in het eerste lid, niet van toepassing is op
      de rechtspersoon, bedoeld in het tweede lid, onderdeel c, indien er een gerechtvaardigd vermoeden is dat bepaalde
      vracht gevaarlijke goederen bevat.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37l
  - number: 37l.4
    text: |-
      Bij regeling van Onze Minister van Justitie, in overeenstemming met Onze Minister, kunnen ter voorkoming van
      vervoer van gevaarlijke goederen door een luchtvaartmaatschappij, voorschriften worden gegeven met betrekking tot
      vracht aangeboden door een rechtspersoon als bedoeld in het tweede lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37l
  - number: 37l.5
    text: |-
      Bij regeling van Onze Minister van Justitie kunnen, met het oog op de controle ter beveiliging van vracht,
      voorschriften worden gegeven over de afhandeling van vracht door personen die in het buitenland zijn gevestigd en
      vracht aanbieden door tussenkomst van de personen, bedoeld in het tweede lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37l
  - number: 37m.1
    text: |-
      Aan de luchtvaartmaatschappij voor vervoer toevertrouwde brieven worden zonder goedvinden van de afzender of van
      de geadresseerde slechts geopend indien de rechter-commissaris in de rechtbank van het arrondissement waarbinnen de
      brief is aangetroffen, daartoe, op verzoek van de luchtvaartmaatschappij, bevel heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37m
  - number: 37m.2
    text: |-
      Het bevel, bedoeld in het eerste lid, wordt slechts gegeven indien het vermoeden bestaat dat zich in de brief
      gevaarlijke goederen bevinden.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37m
  - number: 37n.1
    text: |-
      De luchtvaartmaatschappij beschikt over een afsluitbare en beveiligde ruimte bestemd voor de ontvangst en bewaring
      van vracht.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37n
  - number: 37n.2
    text: |-
      Zij stelt de identiteit van de aanbieders van vracht vast, indien deze personen niet zijn geregistreerd
      overeenkomstig [artikel 37p][ref1], en registreert of doet registreren de naam en het adres van die personen en van
      de afzender.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37n
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37p
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37n.3
    text: |-
      Onze Minister van Justitie kan, in overeenstemming met Onze Minister, bij ministeriële regeling nadere
      voorschriften geven aan de luchtvaartmaatschappij ter beveiliging van de burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37n
  - number: 37o.1
    text: |-
      Bij regeling van Onze Minister van Justitie, in overeenstemming met Onze Minister, kan ten aanzien
      van bepaalde vluchten of luchtvaartuigen vrijstelling worden verleend voor de controle, bedoeld in
      [artikel 37j, eerste lid][ref1], indien de dreiging voor deze vluchten of luchtvaartuigen als gevolg van
      gevaarlijke goederen verwaarloosbaar is. Daarbij kunnen nadere voorschriften worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37j
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37o
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37j
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37o.2
    text: |-
      Onze Minister van Justitie kan in bijzondere gevallen op de grond, bedoeld in het eerste lid, ontheffing verlenen
      van de controle.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37o
  - number: 37p.1
    text: |-
      De Commandant van de Koninklijke marechaussee houdt een register bij van natuurlijke personen of rechtspersonen die
      bedrijfsmatig vracht aanbieden, doen vervoeren of vervoeren. In het register staan slechts personen ingeschreven op
      hun verzoek. Daarin worden in ieder geval vermeld de naam, het adres en de vestigingsplaats van de geregistreerde,
      het nummer van inschrijving bij de Kamer van Koophandel en de datum van inschrijving in het register.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37p
  - number: 37p.2
    text: |-
      Personen als bedoeld in het eerste lid kunnen worden ingeschreven onder afgifte van een verklaring waaruit blijkt
      dat is voldaan aan de bij regeling van Onze Minister van Justitie gestelde eisen, met het oog op de veiligheid en
      de betrouwbaarheid van de door hen aangeboden vracht.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37p
  - number: 37p.3
    text: |-
      Personen als bedoeld in het eerste lid kunnen zich in het register doen inschrijven door inzending van een ingevuld
      aanmeldingsformulier waarvan bij regeling van Onze Minister van Justitie een model wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37p
  - number: 37p.4
    text: |-
      In het buitenland gevestigde natuurlijke personen of rechtspersonen die bedrijfsmatig vracht aanbieden, doen
      vervoeren of vervoeren, kunnen zich in het register doen inschrijven overeenkomstig bij regeling van Onze Minister
      van Justitie nader te stellen regels.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37p
  - number: 37p.5
    text: |-
      De Commandant van de Koninklijke marechaussee weigert inschrijving in het register als bedoeld in het eerste lid,
      indien niet is voldaan of in onvoldoende mate blijkt dat is voldaan aan de bij ministeriële regeling gestelde eisen
      met het oog op de veiligheid en de betrouwbaarheid van de door hen aangeboden vracht.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37p
  - number: 37p.6
    text: 'Bij regeling van Onze Minister van Justitie kunnen regels worden gesteld ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37p
  - number: 37p.6.a
    text: de inhoud van de verklaring, bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37p
  - number: 37p.6.b
    text: de procedure van inschrijving en het melden van wijzigingen;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37p
  - number: 37p.6.c
    text: op te nemen categorieën van gegevens in het register.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37p
  - number: 37q.1
    text: |-
      De geregistreerde, bedoeld in [artikel 37p][ref1], is verplicht iedere wijziging die optreedt in de in
      [artikel 37p, tweede lid][ref2] bedoelde gegevens onverwijld door te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37p
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37p
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37q.2
    text: 'De Commandant van de Koninklijke marechaussee haalt de inschrijving in het register, bedoeld in artikel 37p, door:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
  - number: 37q.2.a
    text: op verzoek van de geregistreerde, of
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
  - number: 37q.2.b
    text: bij beëindiging van de werkzaamheden tot het bedrijfsmatig aanbieden of vervoeren van vracht.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
  - number: 37q.3
    text: |-
      De Commandant van de Koninklijke marechaussee haalt de inschrijving in het register, bedoeld in
      [artikel 37p][ref1], op last van Onze Minister van Justitie door:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37p
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37q.3.a
    text: |-
      indien bij controle blijkt dat de geregistreerde aan de bij of krachtens dit hoofdstuk gegeven voorschriften geen
      uitvoering geeft, of
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
  - number: 37q.3.b
    text: |-
      bij controle blijkt van zodanige aanwijzingen van betrokkenheid bij gepleegde of te plegen misdrijven dat
      gerechtvaardigde twijfel bestaat omtrent de betrouwbaarheid van de geregistreerde.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
  - number: 37q.4
    text: |-
      Een doorhaling als bedoeld in het derde lid, onderdeel a, vindt plaats voor ten hoogste twee jaren. Na verstrijken
      van deze termijn kan opnieuw inschrijving overeenkomstig dit artikel plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
  - number: 37q.5
    text: |-
      Een doorhaling als bedoeld in het derde lid, onderdeel b, vindt plaats voor onbepaalde tijd. Hernieuwde
      inschrijving vindt slechts plaats na toestemming van Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
  - number: 37q.6
    text: |-
      De inschrijving dan wel de doorhaling van de inschrijving in het register bedoeld in het derde lid, wordt niet
      eerder van kracht dan twee weken nadat de Commandant van de Koninklijke marechaussee daarvan mededeling heeft
      gedaan aan de geregistreerde.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
  - number: 37q.7
    text: |-
      Voor zover zij deze behoeven voor de vervulling van de in [artikel 37j, eerste lid][ref1], en [artikel 37r][ref2]
      bedoelde verplichtingen worden uit het register, bedoeld in [artikel 37p, eerste lid][ref3], gegevens verstrekt
      aan:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37j
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37r
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37j
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37r
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 37p
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37q.7.a
    text: luchtvaartmaatschappijen, en
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
  - number: 37q.7.b
    text: |-
      geregistreerde personen als bedoeld in [artikel 37p][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37p
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37q.8
    text: |-
      Aan andere dan de in het zevende lid bedoelde personen wordt desgevraagd meegedeeld of bepaalde natuurlijke
      personen of rechtspersonen die bedrijfsmatig vracht aanbieden of vervoeren, zijn ingeschreven in het register,
      bedoeld in [artikel 37p, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37p
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37q.9
    text: |-
      Tegen besluiten van de Commandant van de Koninklijke marechaussee verband houdend met het register, bedoeld
      in [artikel 37p, eerste lid][ref1], kan een belanghebbende administratief beroep instellen bij de Minister van
      Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37q
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37p
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37r
    text: |-
      De geregistreerde, bedoeld in [artikel 37p][ref1], doet vracht afkomstig van een niet-geregistreerde, controleren
      op de aanwezigheid van gevaarlijke goederen. De [artikelen 37f, derde lid][ref2], en [37j tot en met 37o][ref3]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel37j
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37r
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37p
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 37j
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37s
    text: |-
      In verband met de taakuitoefening, bedoeld in [artikel 37p, eerste lid][ref1], kan de Commandant van de Koninklijke
      marechaussee onderzoek doen naar de betrouwbaarheid van de geregistreerde personen, bedoeld in [artikel 37p][ref2].
      Hij kan daartoe inlichtingen en inzage van zakelijke gegevens en bescheiden vragen alsmede kopieën daarvan maken,
      alsmede politiegegevens raadplegen overeenkomstig het bepaalde bij of krachtens de [Wet politiegegevens][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
      [ref3]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37s
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37p
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37p
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
      - id: ref3
        bwb_id: BWBR0022463
  - number: 37t
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze afdeling, dan wel van verplichtingen die
      voortvloeien uit een EG-verordening voor zover deze betrekking heeft op de beveiliging van de burgerluchtvaart
      en voor het toezicht daarop geen andere autoriteit is aangewezen, is belast de Commandant van de Koninklijke
      marechaussee. Onze Minister van Justitie kan daartoe aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37t
  - number: 37u.1
    text: |-
      Onze Minister van Justitie is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het
      bepaalde bij of krachtens deze afdeling, onverminderd de [artikelen 29][ref1] en [35][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel35
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37u
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '29'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '35'
        hoofdstuk: IV
        afdeling: '3'
  - number: 37u.2
    text: |-
      Onze Minister van Justitie kan van de in het eerste lid genoemde bevoegdheid mandaat verlenen aan de Commandant van
      de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37u
  - number: 37v.1
    text: |-
      Een klacht tegen beveiligingspersoneel als bedoeld in [artikel 37a, eerste lid, onderdeel b, onder 1°][ref1], over
      een gedraging bij de uitvoering van een taak ingevolge deze afdeling, kan worden ingediend bij de Commandant van de
      Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37v
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37a
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
  - number: 37v.2
    text: |-
      De klacht wordt behandeld door Onze Minister van Justitie. Deze kan hiervoor mandaat verlenen aan de Commandant van
      de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37v
  - number: 37v.3
    text: |-
      [Titel 9.1 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing. De regels vastgesteld
      krachtens [artikel 6, onder i, van de Wet particuliere beveiligingsorganisaties][ref2] blijven buiten werking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0008973#Artikel6
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37v
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0008973
        artikel: '6'
  - number: 37v.4
    text: |-
      Voor de toepassing van de [Wet Nationale ombudsman][ref1] en [titel 9.2 van de Algemene wet bestuursrecht][ref2]
      wordt een gedraging als bedoeld in het eerste lid, aangemerkt als een gedraging van Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0003372
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37v
    references:
      - id: ref1
        bwb_id: BWBR0003372
      - id: ref2
        bwb_id: BWBR0005537
  - number: 37v.5
    text: |-
      Indien de klacht zich tevens richt tegen beveiligingspersoneel als bedoeld in
      [artikel 37a, eerste lid, onderdeel b, onder 2°][ref1], en betrekking heeft op hetzelfde feitencomplex, wordt deze
      behandeld volgens de procedure die geldt voor dat beveiligingspersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel37v
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37a
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
  - number: '57.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, de [artikelen 58][ref3],
      [59][ref4], [60][ref5] en [61][ref6] gezamenlijk of afzonderlijk in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel59
      [ref5]: https://wetten.overheid.nl/BWBR0002267#Artikel60
      [ref6]: https://wetten.overheid.nl/BWBR0002267#Artikel61
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0002267
        artikel: '59'
        hoofdstuk: V
      - id: ref5
        bwb_id: BWBR0002267
        artikel: '60'
        hoofdstuk: V
      - id: ref6
        bwb_id: BWBR0002267
        artikel: '61'
        hoofdstuk: V
  - number: '57.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen wordt onverwijld een voorstel van wet aan de Tweede Kamer
      gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel57
  - number: '57.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel57
  - number: '57.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel57
  - number: '57.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel57
  - number: '57.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel57
  - number: '59.1'
    text: |-
      Onze Minister van Defensie kan ten aanzien van militaire luchtvaartuigen en de leden van hun bemanning, alsmede ten
      aanzien van militaire luchtvaartterreinen afwijken van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel59
  - number: '59.2'
    text: |-
      Onze Minister van Defensie kan, onverminderd de bevoegdheden bij andere wetten verleend, bepalen dat houders
      van luchtvaartuigen op daartoe strekkende aanwijzing door Onze Minister van Defensie verplicht zijn met deze
      vervoermiddelen het vervoer van bepaalde personen of zaken te bewerkstelligen en de vervoermiddelen daartoe
      volledig uitgerust op een aangewezen plaats ter beschikking te stellen; deze plaats, alsmede de plaats van
      bestemming kunnen buiten Nederland zijn gelegen. Het [tweede tot en met vijfde lid van artikel 58][ref1] zijn van
      overeenkomstige toepassing met dien verstande dat voor Onze Minister wordt gelezen: Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '59.3'
    text: |-
      Onze Minister van Defensie is, onverminderd de bevoegdheden bij andere wetten verleend, bevoegd ten behoeve
      van de krijgsmacht de terbeschikkingstelling te vorderen van luchtvaartterreinen met bijbehorende gebouwen
      en inrichtingen alsmede van de zich in die gebouwen en inrichtingen bevindende roerende goederen. Het
      [tweede tot en met vijfde lid van artikel 58][ref1] zijn van overeenkomstige toepassing met dien verstande dat voor
      Onze Minister wordt gelezen: Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '59.4'
    text: |-
      Gedurende de tijd, dat ingevolge het tweede en derde lid ten behoeve van de krijgsmacht luchtvaartuigen zijn
      aangewezen en luchtvaartterreinen ter beschikking zijn gesteld, worden deze beschouwd als militaire luchtvaartuigen
      en als militaire luchtvaartterreinen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel59
  - number: '60.1'
    text: 'Onze Minister van Defensie is, onverminderd de bevoegdheden bij andere wetten verleend, bevoegd:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel60
  - number: 60.1.a
    text: |-
      aanwijzingen te geven aan rechthebbenden ten aanzien van luchtvaartterreinen met betrekking tot het beheer en het
      gebruik van die luchtvaartterreinen;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel60
  - number: 60.1.b
    text: |-
      aanwijzingen te geven aan rechthebbenden ten aanzien van roerende en onroerende zaken, welke zich op
      luchtvaartterreinen bevinden, met betrekking tot het beheer en het gebruik van die zaken;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel60
  - number: 60.1.c
    text: werken te doen uitvoeren op luchtvaartterreinen;
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel60
  - number: 60.1.d
    text: voorzieningen te doen uitvoeren aan de zich op luchtvaartterreinen bevindende roerende en onroerende zaken, en
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel60
  - number: 60.1.e
    text: |-
      luchtvaartterreinen en de daarbij behorende gebouwen en inrichtingen, met inbegrip van woongedeelten,
      alsmede fabrieken, werkplaatsen en aanhorigheden, welke dienstbaar zijn aan de luchtvaart, te doen
      betreden voor zover dat redelijkerwijs voor de vervulling van zijn taak nodig is. In afwijking
      van [artikel 2 van de Algemene wet op het binnentreden][ref1] is het militaire gezag bevoegd
      zonder machtiging binnen te treden. Het militaire gezag is bevoegd een machtiging als bedoeld in
      [artikel 3 van de Algemene wet op het binnentreden][ref2] te geven. [Artikel 3 van die wet][ref3] is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006763#Artikel3
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0006763
        artikel: '3'
  - number: '60.2'
    text: |-
      Op de maatregelen getroffen krachtens dit artikel zijn het [tweede tot en met vijfde lid van artikel 58][ref1] van
      overeenkomstige toepassing met dien verstande dat voor Onze Minister wordt gelezen: Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '60.3'
    text: |-
      Op de maatregelen getroffen krachtens dit artikel is tevens het [zesde lid van artikel 58][ref1] van
      overeenkomstige toepassing met dien verstande dat de voordracht geschiedt door Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '61.1'
    text: |-
      Onze Minister van Defensie is bevoegd opdrachten te geven aan personen die in het bezit zijn van een ingevolge deze
      wet uitgereikt bewijs van bevoegdheid alsmede aan personen, behorende tot bij algemene maatregel van bestuur aan te
      wijzen categorieën van personeel dat werkzaam is ten behoeve van de luchtvaart.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel61
  - number: '61.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld betreffende de aard en de duur van de
      opdrachten alsmede de wijze waarop en de voorwaarden waaronder zij kunnen worden gegeven, zomede betreffende de
      schadeloosstelling in verband met de verstrekte opdrachten. De rechtspositie van de personen, die een opdracht
      hebben ontvangen, wordt bij algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel61
  - number: 61a.1
    text: |-
      Voordat Onze Minister van Defensie een hem krachtens dit hoofdstuk ten aanzien van burgerluchtvaart toekomende
      bevoegdheid uitoefent, richt hij een verzoek aan Onze Minister van Verkeer en Waterstaat om aan de behoefte
      gesteld door Onze Minister van Defensie te voldoen. Onze Minister van Defensie oefent de bevoegdheden krachtens
      dit hoofdstuk ten aanzien van burgerluchtvaart niet uit dan nadat Onze Minister van Verkeer en Waterstaat te kennen
      heeft gegeven niet te zullen voldoen aan dit verzoek.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel61a
  - number: 61a.2
    text: |-
      In dringende omstandigheden kan Onze Minister van Defensie afwijken van het eerste lid. Hij stelt Onze Minister van
      Verkeer en Waterstaat daarvan terstond in kennis. Zodra de omstandigheden dat naar het oordeel van Onze Minister
      van Defensie en van Onze Minister van Verkeer en Waterstaat toelaten, wordt aan de door Onze Minister van Defensie
      gestelde behoefte voldaan door Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel61a
  - number: 61a.3
    text: |-
      Indien een in deze wet toegekende bevoegdheid door Onze Minister van Verkeer en Waterstaat wordt uitgeoefend
      ten behoeve van de uitvoering van de militaire taak, vindt toekenning van een vergoeding krachtens
      [artikel 58, vijfde lid][ref1], plaats in overeenstemming met Onze Minister van Defensie. Deze vergoeding komt voor
      rekening van Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '62.1'
    text: |-
      Hij, die een van de [artikelen 8][ref1], [9][ref2], [14, eerste lid onder c][ref3], [16][ref4],
      [17, eerste lid][ref5], [30b, zesde lid][ref6], [31][ref7], [32][ref8], [33][ref9], [34][ref10], [36][ref11],
      [37][ref12], [38, vijfde lid][ref13], of [74][ref14] overtreedt, wordt gestraft hetzij met hechtenis van ten
      hoogste zes maanden en geldboete van de derde categorie, hetzij met één van deze straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel14
