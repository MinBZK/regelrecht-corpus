        hoofdstuk: VI
  - number: '62.2'
    text: |-
      Met dezelfde straf wordt gestraft de gezagvoerder, die een van de [artikelen 4][ref1],
      [14, eerste lid onder a en b][ref2], of [17, tweede lid][ref3], overtreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel17
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '4'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '14'
        hoofdstuk: III
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '17'
        hoofdstuk: III
        afdeling: '3'
  - number: '62.3'
    text: |-
      Overtreding van een voorschrift gegeven bij of krachtens algemene maatregel van bestuur ingevolge deze wet, wordt,
      voor zover die overtreding uitdrukkelijk als strafbaar feit is aangemerkt, gestraft hetzij met hechtenis van ten
      hoogste zes maanden en geldboete van de derde categorie, hetzij met één van deze straffen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel62
  - number: '62.4'
    text: |-
      De eigenaar of houder van een luchtvaartuig, die in strijd met een van de [artikelen 4][ref1], [8][ref2] of
      [16][ref3] de luchtvaart doet of laat uitoefenen, wordt gestraft hetzij met hechtenis van ten hoogste zes maanden
      en geldboete van de derde categorie, hetzij met één van deze straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '4'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '8'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
  - number: 62a.1
    text: |-
      Hij die een op grond van [artikel 37b, eerste lid, onder b en c][ref1], aangewezen luchtvaartterrein
      wederrechtelijk binnendringt of wederrechtelijk aldaar verblijft, wordt gestraft met gevangenisstraf van ten
      hoogste drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37b
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: 3A
  - number: 62a.2
    text: |-
      Hij die zich wederrechtelijk toegang verschaft tot een in het eerste lid bedoeld terrein door middel van braak
      of inklimming, van valse sleutels, van een valse order, een vals kostuum of een valse of niet aan betrokkene
      toebehorende toegangspas wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel62a
  - number: 62a.3
    text: |-
      De in het eerste en tweede lid bepaalde gevangenisstraffen kunnen met een derde worden verhoogd, indien twee of
      meer verenigde personen het misdrijf plegen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel62a
  - number: '63'
    text: |-
      Overtreding van een van de [artikelen 15][ref1] of [65][ref2] wordt gestraft met gevangenisstraf van ten hoogste
      drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel65
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '15'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '65'
        hoofdstuk: VI
  - number: '64.1'
    text: 'Bij veroordeling wegens overtreding van:'
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel64
  - number: 64.1.a
    text: |-
      een van de [artikelen 4][ref1], [8][ref2], en [17][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel17
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '4'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '8'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '17'
        hoofdstuk: III
        afdeling: '3'
  - number: 64.1.b
    text: |-
      een voorschrift van een krachtens deze wet vastgestelde algemene maatregel van bestuur, kan de schuldige de
      bevoegdheid een luchtvaartuig te bedienen voor ten hoogste drie jaren worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel64
  - number: '64.2'
    text: |-
      Bij toepassing van het bepaalde in het eerste lid verliest een aan de veroordeelde afgegeven bewijs van bevoegdheid
      of van gelijkstelling zijn geldigheid voor de duur van de ontzegging, zodra de rechterlijke uitspraak, voor wat
      betreft deze bijkomende straf, voor tenuitvoerlegging vatbaar is geworden. De betrokken ambtenaar van het Openbaar
      Ministerie brengt dit onverwijld ter kennis van Onze Minister, die daarvan aankondiging doet in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel64
  - number: '65'
    text: |-
      Het is degene, die weet, of redelijkerwijze moet weten, dat hem bij rechterlijke uitspraak de bevoegdheid een
      luchtvaartuig te bedienen is ontzegd, verboden, gedurende de tijd, dat hem die bevoegdheid ontzegd is, een
      luchtvaartuig te bedienen.
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel65
  - number: '66.1'
    text: |-
      Hij, die opzettelijk niet voldoet aan een krachtens [artikel 58][ref1] gegeven aanwijzing, wordt gestraft met
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '66.2'
    text: |-
      Hij die opzettelijk in strijd handelt met een ingevolge [artikel 59][ref1] gegeven aanwijzing of gedane vordering,
      wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel59
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '59'
        hoofdstuk: V
  - number: '66.3'
    text: |-
      Hij die opzettelijk in strijd handelt met een ingevolge [artikel 60][ref1] gegeven aanwijzing, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel60
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '60'
        hoofdstuk: V
  - number: '66.4'
    text: |-
      Hij, die opzettelijk een ingevolge [artikel 61][ref1] gegeven opdracht niet uitvoert, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel61
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '61'
        hoofdstuk: V
  - number: '67.1'
    text: |-
      Hij, die niet voldoet aan een krachtens [artikel 58][ref1] gegeven aanwijzing, wordt gestraft met hechtenis van ten
      hoogste één jaar of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '67.2'
    text: |-
      Hij die in strijd handelt met een ingevolge [artikel 59][ref1] gegeven aanwijzing of gedane vordering, wordt
      gestraft met hechtenis van ten hoogste één jaar of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel59
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '59'
        hoofdstuk: V
  - number: '67.3'
    text: |-
      Hij, die in strijd handelt met een ingevolge [artikel 60][ref1] gegeven aanwijzing, wordt gestraft met hechtenis
      van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel60
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '60'
        hoofdstuk: V
  - number: '67.4'
    text: |-
      Hij, die een ingevolge [artikel 61][ref1] gegeven opdracht niet uitvoert, wordt gestraft met hechtenis van ten
      hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel61
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '61'
        hoofdstuk: V
  - number: '68'
    text: |-
      Hij, die een handeling verricht met het oogmerk de uitoefening van de bevoegdheden vermeld in de
      [artikelen 58 tot en met 61][ref1] te belemmeren, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '70'
    text: |-
      De feiten strafbaar gesteld bij de [artikelen 62a][ref1], [63][ref2], [66][ref3] en [68][ref4] zijn misdrijven. De
      feiten strafbaar gesteld bij de [artikelen 62][ref5] en [67][ref6] zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel62a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel66
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel68
      [ref5]: https://wetten.overheid.nl/BWBR0002267#Artikel62
      [ref6]: https://wetten.overheid.nl/BWBR0002267#Artikel67
    url: https://wetten.overheid.nl/BWBR0002267/2009-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 62a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '63'
        hoofdstuk: VI
      - id: ref3
