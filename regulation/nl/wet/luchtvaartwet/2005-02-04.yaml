---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: luchtvaartwet
regulatory_layer: WET
publication_date: '2025-10-30'
valid_from: '2005-02-04'
bwb_id: BWBR0002267
url: https://wetten.overheid.nl/BWBR0002267/2005-02-04
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen omtrent de luchtvaart te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#ArtikelAanhef
articles:
  - number: '1.1'
    text: Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel1
  - number: 1.1.a
    text: 'luchtvaart: het gebruik van luchtvaartuigen;'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel1
  - number: 1.1.b
    text: |-
      luchtvaartuig: toestel, bedoeld in [artikel 1.1. eerste lid, onderdeel j, van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
  - number: 1.1.c
    text: 'vliegtuigen: luchtvaartuigen zwaarder dan lucht en voorzien van een voortstuwingsinrichting;'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel1
  - number: 1.1.d
    text: |-
      exploitant van een luchtvaartterrein: degene, te wiens name ingevolge deze wet een luchtvaartterrein wordt
      aangewezen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel1
  - number: 1.1.f
    text: 'buitenlandse luchtvaartuigen: luchtvaartuigen, ingeschreven in een buitenlands luchtvaartuigregister;'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel1
  - number: 1.1.g
    text: 'luchtvaartterreinen: een aangewezen terrein ingericht voor het opstijgen en landen van luchtvaartuigen;'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel1
  - number: 1.1.h
    text: |-
      luchtvaartmaatschappijen: eigenaren van ondernemingen, die geheel of gedeeltelijk hun bedrijf maken van het vervoer
      van personen, dieren of goederen met luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel1
  - number: 1.1.i
    text: 'verkeersvlucht: een vlucht, die vervoer door een luchtvaartmaatschappij ten doel heeft;'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel1
  - number: 1.1.j
    text: |-
      Onze Minister: voor wat de burgerluchtvaart en de algemene verkeersveiligheid in de lucht betreft: Onze Minister
      van Verkeer en Waterstaat: voor wat de militaire luchtvaart betreft: Onze Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel1
  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder uitwendige scheidingsconstructie,
      verblijfsgebiedverblijfsruimte en gezondheidszorggebouw verstaan hetgeen daaronder wordt verstaan in
      [artikel 1 van het Bouwbesluit][ref1] (*Stb.* 1991, 680). Voor de toepassing van [artikel 26b][ref2]
      en de daarop berustende bepalingen wordt voor wat betreft de voorschriften die samenhangen met de in
      [artikel 25, vierde lid][ref3], bedoelde grenswaarde onder gezondheidszorggebouwen verstaan die gedeelten van
      gezondheidszorggebouwen waarin personen die medisch worden verpleegd, verzorgd of behandeld, de nacht doorbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005321#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel26b
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel25
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005321
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 26b
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '25'
        hoofdstuk: IV
        afdeling: '1'
  - number: '2'
    text: Voor de toepassing van het bij of krachtens deze wet bepaalde wordt mede verstaan onder
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel2
  - number: 2.a
    text: 'gezagvoerder: hij, die een luchtvaartuig alleen bedient;'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel2
  - number: 2.b
    text: |-
      bedienen van een luchtvaartuig: het verrichten van handelingen aan boord van een luchtvaartuig ten behoeve van het
      gebruik van dat luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel2
  - number: 2.c
    text: 'terreinen: watergebieden;'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel2
  - number: 2.d
    text: 'bouwwerken: getimmerten, constructiemasten, bovengrondse geleidingen, dijken en kaden.'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel2
  - number: 2.e
    text: 'luchtwaardigheid: de toelaatbaarheid van het door het luchtvaartuig veroorzaakte geluid.'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel2
  - number: 8a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gegeven ten aanzien van de voorbereiding en
      uitvoering van verkeersvluchten met Nederlandse luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel8a
  - number: 8a.2
    text: |-
      Voor andere vluchten dan verkeersvluchten kunnen ten aanzien van de voorbereiding en uitvoering daarvan, in het
      belang van de algemene veiligheid bij of krachtens algemene maatregel van bestuur regelen worden gegeven. Deze
      bepaling vindt geen toepassing met betrekking tot vluchten met militaire luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel8a
  - number: 8a.3
    text: |-
      Op daartoe strekkend verzoek kan Onze Minister in bijzondere gevallen, voor zover de veiligheid zulks toelaat,
      ontheffing verlenen van de in het eerste en tweede lid van dit artikel bedoelde regelen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel8a
  - number: '9'
    text: |-
      Ten aanzien van het in luchtwaardige toestand houden van Nederlandse luchtvaartuigen worden de bewijzen van
      bevoegdheid afgegeven, geschorst of ingetrokken door Onze Minister en wel, voor wat burgerluchtvaartuigen betreft,
      naar regelen, gesteld bij of krachtens algemene maatregel van bestuur. Voorts kan Onze Minister bewijzen van
      gelijkstelling van buitenlandse bewijzen van bevoegdheid afgeven, schorsen en intrekken, naar regelen, gesteld bij
      of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel9
  - number: '14.1'
    text: 'Het is verboden binnen Nederland:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel14
  - number: 14.1.a
    text: met een luchtvaartuig op te stijgen of een luchtvaartuig te doen opstijgen anders dan van een luchtvaartterrein;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel14
  - number: 14.1.b
    text: met een luchtvaartuig te landen of een luchtvaartuig te doen landen anders dan op een luchtvaartterrein;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel14
  - number: 14.1.c
    text: een niet als luchtvaartterrein aangewezen terrein in te richten voor het opstijgen en landen van luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel14
  - number: '14.2'
    text: 'Het bepaalde in het eerste lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel14
  - number: 14.2.a
    text: in de gevallen, aangegeven bij algemene maatregel van bestuur;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel14
  - number: 14.2.b
    text: indien en voor zover Onze Minister ontheffing heeft verleend.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel14
  - number: '16'
    text: |-
      Voor zover bij internationale overeenkomst niet anders is bepaald mag vervoer met luchtvaartuigen in, naar of uit
      Nederland, of met Nederland als tussenstation, slechts geschieden door luchtvaartmaatschappijen aan wie daartoe
      door Onze Minister vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16
  - number: 16a.1
    text: |-
      Ten aanzien van vergunningen als bedoeld in [artikel 16][ref1] die vallen onder [verordening (EEG) nr. 2407/92]
      (31992R2407) van de Raad van de Europese Gemeenschappen van 23 juli 1992 betreffende de verlening, intrekking en
      schorsing van exploitatievergunningen aan luchtvaartmaatschappijen (*PbEG* L 240), wordt toegepast hetgeen bij of
      krachtens die verordening is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
  - number: 16a.2
    text: |-
      Een wijziging van het bepaalde bij of krachtens de verordening, genoemd in het eerste lid, treedt voor de
      toepassing van het eerste lid in werking met ingang van de dag waarop de betrokken wijzigingsregeling in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16a
  - number: 16a.3
    text: |-
      Aan een vergunning als bedoeld in het eerste lid kunnen voorschriften worden verbonden voor zover deze in
      overeenstemming zijn met de verordening.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16a
  - number: 16a.4
    text: 'Onverminderd de verordening kan Onze Minister een vergunning als bedoeld in het eerste lid, schorsen of intrekken:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16a
  - number: 16a.4.a
    text: indien de vergunninghouder daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16a
  - number: 16a.4.b
    text: wegens uitoefening van het vervoer in strijd met bij of krachtens deze wet gegeven voorschriften;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16a
  - number: 16a.4.c
    text: wegens niet-inachtneming van aan de vergunning verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16a
  - number: 16a.4.d
    text: indien ter verkrijging van de vergunning onjuiste of onvolledige gegevens zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16a
  - number: 16a.5
    text: Onze Minister kan een vergunning als bedoeld in het eerste lid, op verzoek van de houder wijzigen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16a
  - number: 16b.1
    text: |-
      Een vergunning als bedoeld in [artikel 16][ref1] die niet valt onder de in [artikel 16][ref2] genoemde verordening,
      wordt verleend voor een bepaalde, daarin genoemde, termijn van ten hoogste vijf jaar. Zij kan door Onze Minister
      worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel16a
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 16a
        hoofdstuk: III
        afdeling: '3'
  - number: 16b.2
    text: Aan een vergunning als bedoeld in het eerste lid, kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16b
  - number: 16b.3
    text: 'Onze Minister kan een vergunning als bedoeld in het eerste lid, schorsen of intrekken:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16b
  - number: 16b.3.a
    text: indien de vergunninghouder daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16b
  - number: 16b.3.b
    text: wegens niet-uitoefening van het vervoer;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16b
  - number: 16b.3.c
    text: wegens uitoefening van het vervoer in strijd met bij of krachtens deze wet gegeven voorschriften;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16b
  - number: 16b.3.d
    text: wegens niet-inachtneming van aan de vergunning verbonden voorschriften of beperkingen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16b
  - number: 16b.3.e
    text: indien ter verkrijging van de vergunning onjuiste of onvolledige gegevens zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16b
  - number: 16b.4
    text: Onze Minister kan een vergunning als bedoeld in het eerste lid, op verzoek van de houder wijzigen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16b
  - number: 16c
    text: |-
      Bij ministeriële regeling kunnen bepaalde soorten van vervoer worden uitgezonderd van de in [artikel 16][ref1]
      vervatte verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
  - number: 16d.1
    text: |-
      Onze Minister kan ontheffing verlenen van de in [artikel 16][ref1] vervatte verplichting. Van de beschikking ter
      zake wordt mededeling in de *Staatscourant* gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
  - number: 16d.2
    text: Aan de in het eerste lid bedoelde ontheffingen kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16d
  - number: 16d.3
    text: |-
      Onze Minister kan een ontheffing schorsen of intrekken wegens niet inachtneming van de aan de ontheffing verbonden
      voorschriften of beperkingen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel16d
  - number: '17.1'
    text: Het is verboden luchtvaartvertoningen of luchvaartwedstrijden te houden zonder vergunning van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel17
  - number: '17.2'
    text: |-
      Het is verboden boven Nederland deel te nemen aan een vertoning of wedstrijd als bedoeld in het eerste lid,
      waarvoor geen vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel17
  - number: '17.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven waaraan bij het aanvragen van een
      vergunning tot het houden van een luchtvaartvertoning of een luchtvaartwedstrijd en bij het houden van zodanige
      vertoning of wedstrijd moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer,
      gehoord de Rijksplanologische Commissie en de Rijksmilieuhygiënische Commissie, luchtvaartterreinen aanwijzen:
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel18
  - number: 18.1.a
    text: ambtshalve;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel18
  - number: 18.1.b
    text: op schriftelijk verzoek,
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel18
  - number: '18.2'
    text: |-
      Bij een verzoekschrift moeten in tweevoud worden gevoegd de bescheiden, bedoeld in
      [artikel 20, tweede lid, onder a, b, c en d][ref1]. Het verzoekschrift alsmede de bescheiden kunnen niet
      elektronisch worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel20
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '20'
        hoofdstuk: IV
        afdeling: '1'
  - number: '18.3'
    text: |-
      Onze Minister kan, na overleg met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, een
      verzoek tot aanwijzing om redenen ontleend aan het algemeen belang onmiddellijk afwijzen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel18
  - number: '19.1'
    text: |-
      Onze Minister en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer stellen een ontwerp-
      aanwijzing op na overleg met Gedeputeerde Staten en de gemeenteraden van respectievelijk de provincies en de
      gemeenten binnen de grenzen waarvan het gebied of een gedeelte van het gebied ligt, dat door de ontwerp-aanwijzing
      wordt bestreken. Zij kunnen na overleg met de gemeenteraden besluiten om in één of meer van die gemeenten
      hoorzittingen te houden of te doen houden.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel19
  - number: '19.2'
    text: |-
      Onze in het eerste lid bedoelde Ministers plegen bovendien overleg met de gemeenteraden van andere dan in
      het eerste lid bedoelde gemeenten, alsmede met andere openbare lichamen, zo deze naar hun mening bijzondere
      verantwoordelijkheden of bevoegdheden bezitten die met de aanwijzing van het luchtvaartterrein samenhangen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel19
  - number: '20.1'
    text: |-
      Met betrekking tot de vaststelling van een ontwerp-aanwijzing wordt toepassing gegeven aan de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '20.2'
    text: 'Het ontwerp omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
  - number: 20.2.a
    text: een kaart waarop duidelijk zijn aangegeven
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
  - number: 20.2.a.1°
    text: de ligging, de grenzen en de grootte van het tot luchtvaartterrein te bestemmen terrein; en
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
  - number: 20.2.a.2°
    text: |-
      met betrekking tot de binnen de onder 1° bedoelde grenzen liggende onroerende zaken, de kadastrale gemeente en
      sectie waarbinnen die zaken zijn gelegen, hun kadastrale grenzen en de nummers van de betreffende percelen en van,
      indien een of meer van die zaken een gedeelte van een perceel uitmaken, de betreffende perceelsgedeelten.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
  - number: 20.2.b
    text: |-
      een lijst van de onroerende zaken, waarop de ontwerp-aanwijzing betrekking heeft, aangeduid met hun kadastrale
      aanduiding met vermelding van
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
  - number: 20.2.b.1°
    text: |-
      de grootte volgens de kadastrale registratie van elk der betreffende percelen en, indien een onroerende zaak een
      gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte; en
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
  - number: 20.2.b.2°
    text: |-
      de namen en woonplaatsen van degenen, die met betrekking tot elk dezer zaken in de kadastrale registratie
      staan vermeld als eigenaar of rechthebbende op een beperkt recht waaraan die zaken onderworpen zijn en de
      wettelijke benaming van de beperkte rechten, met dien verstande dat ingeval een onroerende zaak is belast met
      een erfdienstbaarheid bij een zodanig recht tevens wordt aangegeven ten behoeve van welke onroerende zaak,
      aangeduid met haar kadastrale aanduiding, zij is verkregen, alsmede de namen en woonplaatsen volgens de kadastrale
      registratie van de eigenaren van laatstbedoelde onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
  - number: 20.2.c
    text: |-
      voor zover deze Onze Minister bekend zijn een lijst van namen en woonplaatsen van degenen, die persoonlijk
      gerechtigde zijn tot elk der onroerende zaken, waarop de ontwerp-aanwijzing betrekking heeft, een en ander op
      overeenkomstige wijze als onder *b* ten eerste is bepaald.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
  - number: 20.2.d
    text: 'een plan in hoofdzaak voor de aanleg en het gebruik van het luchtvaartterrein, waarin in ieder geval is aangegeven:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
  - number: 20.2.d.1
    text: de ligging van de banen met de daarbij behorende aan- en uitvliegroutes;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
  - number: 20.2.d.2
    text: |-
      een beschrijving van de te verwachten ontwikkelingen naar aard en omvang van het luchtverkeer op het
      luchtvaartterrein en de daarmee samenhangende geluidsbelasting door luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
  - number: 20.2.d.3
    text: |-
      de toegepaste luchtverkeersgegevens voor de berekeningen van de geluidsbelastingscontouren, die ten grondslag
      liggen aan de in de onderdelen e en f van dit lid bedoelde kaarten;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
  - number: 20.2.e
    text: |-
      de ingevolge de [artikelen 25a][ref1], [25b][ref2] en [25c][ref3] vast te stellen geluidszones, alsmede een of
      meer kaarten waarop, op basis van de vastgestelde grenswaarden voor de maximale geluidsbelasting, met gebruikmaking
      van de in onderdeel d bedoelde gegevens, de in de [artikelen 25a][ref4], [25b][ref5] en [25c][ref6] bedoelde
      geluidszones zijn aangegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25b
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel25c
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
      [ref5]: https://wetten.overheid.nl/BWBR0002267#Artikel25b
      [ref6]: https://wetten.overheid.nl/BWBR0002267#Artikel25c
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 25b
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 25c
        hoofdstuk: IV
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0002267
        artikel: 25b
        hoofdstuk: IV
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0002267
        artikel: 25c
        hoofdstuk: IV
        afdeling: '1'
  - number: 20.2.f
    text: |-
      de ingevolge [artikel 25d][ref1] vast te stellen geluidscontouren binnen iedere in onderdeel e bedoelde
      geluidszone, welke worden aangegeven op de bij die geluidszone behorende kaart;


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25d
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25d
        hoofdstuk: IV
        afdeling: '1'
  - number: 20.2.g
    text: |-
      een verantwoording van de gebruikmaking van de bevoegdheid, bedoeld in [artikel 25c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25c
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25c
        hoofdstuk: IV
        afdeling: '1'
  - number: 20.2.h
    text: |-
      een ontwerp van de aanwijzingen, bedoeld in [artikel 26, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel26
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '26'
        hoofdstuk: IV
        afdeling: '1'
  - number: 20.2.i
    text: |-
      een beschrijving van de specifieke maatregelen ter beperking van de geluidsbelasting veroorzaakt door
      luchtvaartuigen die van het luchtvaartterrein gebruik maken.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
  - number: '20.3'
    text: |-
      Het ontwerp kan bovendien omvatten een kaart, waarop de optimale buitengrens van iedere ingevolge
      [artikel 25a][ref1] vast te stellen geluidszone staat aangegeven, waarnaar als eindfase gestreefd dient te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
  - number: '20.4'
    text: |-
      Eveneens worden ter inzage gelegd het advies van de Rijksplanologische Commissie en de Rijksmilieuhygiënische
      Commissie als bedoeld in [artikel 18, eerste lid][ref1], en de resultaten van het overleg bedoeld in
      [artikel 19][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel19
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '18'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: '20.5'
    text: Tevens wordt ter inzage gelegd het verzoekschrift zo dit is ingekomen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
  - number: '20.6'
    text: |-
      De terinzagelegging van de stukken geschiedt ter griffie en ter secretarie van respectievelijk de provincies en
      gemeenten, bedoeld in [artikel 19, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel19
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: '21.1'
    text: |-
      De terinzagelegging, bedoeld in [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref1], geschieden
      door de zorg van Gedeputeerde Staten van de provincies" bedoeld in [artikel 19, eerste lid][ref2], op één en
      dezelfde dag binnen een maand, nadat zij de in het vorig artikel genoemde bescheiden van Onze Minister hebben
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel19
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: '21.2'
    text: |-
      De personen, vermeld op de in het [tweede lid onder ][ref1] bedoelde lijsten, worden door Gedeputeerde Staten bij
      aangetekende brief van de nederlegging in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel20
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '20'
        hoofdstuk: IV
        afdeling: '1'
  - number: '21.3'
    text: |-
      Zienswijzen als bedoeld in [artikel 3:13, eerste lid, van de Algemene wet bestuursrecht][ref1], kunnen door
      een ieder schriftelijk naar voren worden gebracht bij een commissie, ingesteld door gedeputeerde staten van
      een provincie, bedoeld in [artikel 19, eerste lid][ref2], mondeling kunnen zienswijzen naar voren worden
      gebracht op een door deze commissie vast te stellen zitting. Gedeputeerde Staten van de provincies, bedoeld in
      [artikel 19, eerste lid][ref3], wijzen gezamenlijk de voorzitter van de commissie aan. De commissie bestaat voorts
      uit:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel19
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: 21.3.a
    text: een lid van elk van die colleges van Gedeputeerde Staten door hen aangewezen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel21
  - number: 21.3.b
    text: één vertegenwoordiger, aangewezen door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel21
  - number: 21.3.c
    text: twee vertegenwoordigers, aangewezen door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel21
  - number: 21.3.d
    text: |-
      twee door burgemeester en wethouders van elke gemeente als bedoeld in [artikel 19, eerste lid][ref1], aan te
      wijzen vertegenwoordigers, waarvan tenminste een als vertegenwoordiger van de omwonenden van het betrokken
      luchtvaartterrein kan worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel19
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: '22.1'
    text: |-
      De commissie brengt binnen drie maanden na het verstrijken van de termijn voor het schriftelijk naar voren brengen
      van zienswijzen advies uit aan Onze Minister inzake de bij haar naar voren gebrachte zienswijzen tegen de ontwerp-
      aanwijzing.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel22
  - number: '22.2'
    text: |-
      Het advies is vergezeld van de schriftelijk naar voren gebrachte zienswijzen en van een verslag van hetgeen op de
      hoorzitting mondeling naar voren is gebracht.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel22
  - number: '22.3'
    text: |-
      Zij zendt een afschrift van het advies en van de in het tweede lid bedoelde stukken aan Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel22
  - number: '22.4'
    text: De in het eerste en tweede lid genoemde stukken zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel22
  - number: '23.1'
    text: |-
      Door de zorg van Gedeputeerde Staten van de provincies" bedoeld in [artikel 19, eerste lid][ref1], worden
      afschriften van de in het vorige artikel genoemde bescheiden, alsmede van de in [artikel 20][ref2] genoemde
      stukken, gedurende een maand ter griffie van deze provincies en ter secretarie van de gemeenten, bedoeld in
      [artikel 19, eerste en tweede lid][ref3], voor een ieder ter inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel19
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '20'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: '23.2'
    text: |-
      Van de terinzagelegging wordt door de zorg van gedeputeerde staten tevoren kennis gegeven in de *Staatscourant*
      en in één of meer door hen aan te wijzen nieuwsbladen. De burgemeester van elke gemeente als bedoeld in
      [artikel 19, eerste en tweede lid][ref1], geeft van de terinzagelegging eveneens kennis op de gebruikelijke wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel19
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: '24.1'
    text: |-
      Binnen zes maanden na de ontvangst van het in [artikel 22][ref1] bedoelde advies beslist Onze Minister in
      overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer omtrent de
      aanwijzing. Dat besluit behelst een verwijzing naar een bijgevoegde kaart en naar lijsten als bedoeld in
      [artikel 20, tweede lid onder a, b en c][ref2]. Het wordt verzonden aan de exploitant van het luchtvaartterrein,
      de in [artikel 19, eerste en tweede lid][ref3] bedoelde provincies en gemeenten, aan de leden van de in
      [artikel 21, derde lid][ref4], bedoelde commissie, alsmede aan degenen, die op de lijsten zijn vermeld als
      eigenaren, mede-eigenaren, beperkt gerechtigden en persoonlijk gerechtigden.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel21
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '22'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '20'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002267
        artikel: '21'
        hoofdstuk: IV
        afdeling: '1'
  - number: '24.2'
    text: 'De bestemming van het luchtvaartterrein kan bij de aanwijzing worden beperkt tot het gebruik door:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel24
  - number: 24.2.a
    text: bepaalde soorten van luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel24
  - number: 24.2.b
    text: bepaalde vormen van luchtvaart.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel24
  - number: '24.3'
    text: |-
      In de aanwijzing worden in ieder geval voorschriften gesteld om te voorkomen dat buiten de geluidszones, bedoeld in
      [artikel 25a][ref1], een hogere geluidsbelasting dan de vastgestelde grenswaarde optreedt. Deze kunnen beperkingen
      inhouden ten aanzien van het gebruik van het luchtvaartterrein.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
  - number: 24a.1
    text: |-
      Indien op grond van [artikel 26][ref1] ten aanzien van gronden binnen één of meer geluidszones aanwijzingen
      als bedoeld in [artikel 37 van de Wet op de Ruimtelijke Ordening][ref2] worden gegeven, wordt de beslissing
      omtrent de aanwijzing van een luchtvaartterrein niet eerder genomen dan nadat de aanwijzingen als bedoeld in
      [artikel 37 van de Wet op de Ruimtelijke Ordening][ref3] gelet op het bepaalde in het tweede lid van dat artikel
      kunnen worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel37
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '26'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0002375
        artikel: '37'
  - number: 24a.2
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      de beslissing omtrent de aanwijzing van een luchtvaartterrein voor ten hoogste zes maanden verdagen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel24a
  - number: 24a.3
    text: |-
      Indien binnen de termijn, bedoeld in [artikel 24, eerste lid][ref1], of het tweede lid van dit artikel, Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, de Tweede Kamer der Staten-Generaal van zijn
      voornemen tot het geven van de in het eerste lid bedoelde aanwijzingen in kennis heeft gesteld, kan in afwijking
      van het bepaalde in [artikel 24, eerste lid][ref2], of het tweede lid van dit artikel, de beslissing omtrent de
      aanwijzing van een luchtvaartterrein worden genomen een maand na het tijdstip waarop de in het eerste lid bedoelde
      aanwijzingen ingevolge [artikel 37, tweede lid, van de Wet op de Ruimtelijke Ordening][ref3] kunnen worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel24a
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel37
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 24a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 24a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002375
        artikel: '37'
  - number: 24a.4
    text: |-
      Indien niet binnen de termijn, bedoeld in [artikel 24, eerste lid][ref1], en het tweede en derde lid van dit
      artikel is beslist, doen Onze Minister en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      daarvan onder opgave van redenen mededeling aan de Tweede Kamer der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel24a
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 24a
        hoofdstuk: IV
        afdeling: '1'
  - number: 24a.5
    text: |-
      Indien de beslissing om te verdagen niet binnen de in [artikel 24, eerste lid][ref1], bedoelde termijn is genomen,
      is het tweede lid van dit artikel van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel24
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '24'
        hoofdstuk: IV
        afdeling: '1'
  - number: 24b.1
    text: |-
      Onze Minister doet mededeling van zijn beslissing omtrent de aanwijzing van het luchtvaartterrein in de
      *Staatscourant* en in de daarvoor in aanmerking komende dag- en nieuwsbladen. Hij maakt bij die gelegenheid tevens
      de nederlegging bekend van de afschriften van de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel24b
  - number: 24b.2
    text: |-
      Onze Minister zendt afschrift van zijn beslissing omtrent de aanwijzing aan de Rijksplanologische Commissie en
      de Rijksmilieuhygiënische Commissie en aan de commissie, bedoeld in [artikel 28][ref1], indien deze reeds is
      ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel28
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '28'
        hoofdstuk: IV
        afdeling: '1'
  - number: 24b.3
    text: |-
      Vanaf de dag der verzending van de afschriften ligt de aanwijzing van het luchtvaartterrein voor een
      ieder ter inzage ter griffie en ter secretarie van respectievelijk de provincies en gemeenten, bedoeld in
      [artikel 19, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel19
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: 24b.4
    text: |-
      Gedeputeerde Staten van de provincies, bedoeld in [artikel 19, eerste lid][ref1], dragen zorg voor de verzending
      van de afschriften aan degenen die bij hen schriftelijk bezwaren hebben ingediend, tenzij publicatie hiervan
      plaatsvindt in de plaatselijke bladen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel19
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: '25.1'
    text: |-
      Bij algemene maatregel van bestuur worden voor bij die maatregel aan te wijzen luchtvaartterreinen de volgende
      uniforme grenswaarden vastgesteld voor de maximaal toegelaten geluidsbelasting door landende en opstijgende
      luchtvaartuigen:
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25
  - number: 25.1.a
    text: |-
      één voor luchtvaartuigen met een toegelaten totaalmassa van ten minste 6000 kg dan wel minder dan 6000 kg maar
      meer dan 390 kg, voor zover dit hefschroefvliegtuigen betreft dan wel deze luchtvaartuigen gebruik maken van
      dezelfde aan- en uitvliegroutes als de luchtvaartuigen van ten minste 6000 kg, dan wel de vliegpatronen van deze
      luchtvaartuigen overeenkomen met die van luchtvaartuigen van ten minste 6000 kg en
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25
  - number: 25.1.b
    text: één voor luchtvaartuigen minder dan 6000 kg, maar meer dan 390 kg, voor zover niet begrepen onder *a*.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25
  - number: '25.2'
    text: |-
      De vaststelling van de grenswaarde bedoeld in het eerste lid, onder *a*, blijft achterwege indien de daarbij
      behorende zone bedoeld in [artikel 25][ref1] geheel ligt binnen de grenzen van het luchtvaartterrein en voor dat
      luchtvaartterrein een zone behorende bij de grenswaarde bedoeld in het eerste lid, onder *b*, wordt vastgesteld. De
      vaststelling van de grenswaarde bedoeld in het eerste lid, onder *b*, blijft achterwege indien de daarbij behorende
      zone bedoeld in [artikel 25][ref2] geheel ligt binnen de zone behorende bij de grenswaarde bedoeld in het eerste
      lid, onder *a*.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
  - number: '25.3'
    text: |-
      Bij algemene maatregel van bestuur worden vastgesteld maximale waarden van geluidsbelasting boven de in het eerste
      lid bedoelde grenswaarden, ter bepaling van de toelaatbaarheid van zekere bestemmingen op gronden gelegen binnen
      de geluidszone.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25
  - number: '25.4'
    text: |-
      De grenswaarde voor structureel uitgevoerd nachtelijk vliegverkeer in de nachtelijke periode is LAeq 26 dB(A).
      De nachtelijke periode wordt bij de aanwijzing krachtens [artikel 24][ref1] vastgesteld en beslaat een periode
      van zeven aaneengesloten uren tussen 23.00 uur en 07.00 uur plaatselijke tijd. Bij algemene maatregel van bestuur
      worden de luchtvaartterreinen aangewezen waarvoor deze grenswaarde vanwege het gebruik van die luchtvaartterreinen
      voor starts en landingen met luchtvaartuigen geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel24
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '24'
        hoofdstuk: IV
        afdeling: '1'
  - number: '25.5'
    text: |-
      Voorts worden bij of krachtens algemene maatregel van bestuur op grond van deze wet of de [Woningwet][ref1] (*Stb.*
      1991, 439) in verband met het structureel uitgevoerd nachtelijk vliegverkeer voorschriften gegeven met betrekking
      tot de karakteristieke geluidwering van een uitwendige scheidingsconstructie die de scheiding vormt tussen een
      verblijfsgebied en de buitenlucht van een te bouwen woning en een te bouwen gezondheidszorggebouw. Daarbij wordt
      aangegeven op welk deel van het verblijfsgebied deze voorschriften betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '25.6'
    text: |-
      De voordracht voor de in het eerste, derde, vierde en vijfde lid bedoelde algemene maatregelen van bestuur wordt
      gedaan door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer na overleg met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25
  - number: '25.7'
    text: |-
      Over de wijziging van een waarde als bedoeld in het eerste lid vindt overleg plaats met de exploitant van het
      luchtvaartterrein waarvoor die waarde wordt gewijzigd alsmede met de gebruikers van luchtvaartuigen welke geregeld
      op dat luchtvaartterrein landen en daarvan opstijgen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25
  - number: '25.8'
    text: |-
      De voordracht voor een algemene maatregel van bestuur, waarbij een eerder vastgestelde waarde als bedoeld in het
      eerste lid wordt gewijzigd, wordt Ons niet gedaan dan nadat de betrokken commissie, bedoeld in [artikel 28][ref1],
      gedurende een door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer bij de toezending van
      het ontwerp vast te stellen termijn in de gelegenheid is gesteld over dat ontwerp advies uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel28
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '28'
        hoofdstuk: IV
        afdeling: '1'
  - number: '25.9'
    text: |-
      Het ontwerp van een algemene maatregel van bestuur als bedoeld in het achtste lid wordt gelijktijdig met de
      toezending aan de commissie, bedoeld in [artikel 28][ref1], overgelegd aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel28
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '28'
        hoofdstuk: IV
        afdeling: '1'
  - number: 25a
    text: |-
      Voor iedere grenswaarde die krachtens [artikel 25, eerste en vierde lid][ref1], ten aanzien van een
      luchtvaartterrein wordt vastgesteld, wordt bij de aanwijzing van dat luchtvaartterrein een geluidszone rond dat
      terrein vastgesteld, waarbuiten de geluidsbelasting door landende en opstijgende luchtvaartuigen de grenswaarde
      niet mag overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '25'
        hoofdstuk: IV
        afdeling: '1'
  - number: 25b.1
    text: |-
      Bij de aanwijzing van het luchtvaartterrein kunnen afhankelijk van het beschikbare banenstelsel of van de aan-
      en uitvliegroutes meerdere varianten geluidszones worden vastgesteld voor iedere voor het luchtvaartterrein
      vastgestelde grenswaarde.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25b
  - number: 25b.2
    text: |-
      Indien het eerste lid wordt toegepast, dient de aanwijzing zo te worden geformuleerd dat op een bij de aanwijzing
      vastgesteld tijdstip uit de aanwijzing volgt welke variant op dat tijdstip als de definitieve geluidszone moet
      worden beschouwd. Op dat tijdstip vervallen de overige varianten.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25b
  - number: 25b.3
    text: |-
      Het in het tweede lid bedoelde tijdstip kan worden bepaald op ten hoogste tien jaar te rekenen vanaf het tijdstip
      waarop de mededeling, bedoeld in [artikel 24b, eerste lid][ref1], in de *Staatscourant* is bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel24b
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 24b
        hoofdstuk: IV
        afdeling: '1'
  - number: 25b.4
    text: |-
      Indien het in het tweede lid bedoelde tijdstip is bepaald op een tijdstip binnen de tien jaar, bedoeld in het derde
      lid, kan door middel van een wijziging van de aanwijzing een ander tijdstip worden bepaald binnen het resterende
      tijdvak van de tien jaar, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25b
  - number: 25b.5
    text: |-
      Indien het eerste lid wordt toegepast, kan bij de aanwijzing worden bepaald dat ten aanzien van één of meer
      varianten voor een aangegeven tijdsduur de regeling, bedoeld in [artikel 26b][ref1], geheel of gedeeltelijk niet,
      dan wel op bij de aanwijzing aangegeven wijze gewijzigd, van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel26b
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 26b
        hoofdstuk: IV
        afdeling: '1'
  - number: 25c.1
    text: |-
      Bij de aanwijzing van het luchtvaartterrein kunnen vooruitlopend op de vaststelling van de varianten, bedoeld in
      [artikel 25b, eerste lid][ref1], of de vaststelling van de geluidszone, bedoeld in [artikel 25a][ref2], een of meer
      tijdelijke geluidszones worden vastgesteld. [Artikel 25b, vijfde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25b
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel25b
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25b
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 25b
        hoofdstuk: IV
        afdeling: '1'
  - number: 25c.2
    text: |-
      Ten aanzien van iedere tijdelijke zone wordt de geldingsduur aangegeven. Bij de bepaling van de geldingsduur is
      [artikel 25b, derde en vierde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25b
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25b
        hoofdstuk: IV
        afdeling: '1'
  - number: 25c.3
    text: |-
      Indien de geldingsduur van een tijdelijke zone is verstreken voordat het gebruik van het luchtvaartterrein
      plaatsvindt overeenkomstig de bij de vaststelling van die zone beschreven situatie vervalt de tijdelijke zone, met
      dien verstande dat tot het tijdstip waarop het gebruik van het luchtvaartterrein plaatsvindt overeenkomstig de bij
      de vaststelling van die zone beschreven situatie:
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25c
  - number: 25c.3.a
    text: |-
      de rechten die omwonenden van het luchtvaartterrein aan de regeling omtrent de tijdelijke zone in de aanwijzing
      kunnen ontlenen onverminderd van kracht blijven;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25c
  - number: 25c.3.b
    text: |-
      de rechten en verplichtingen van de gebruikers van luchtvaartuigen, welke geregeld op dat luchtvaartterrein landen
      en daarvan opstijgen, van kracht blijven, voor zover dat is bepaald in de aanwijzing of voor zover dat wordt
      bepaald in het gebruiksplan, bedoeld in [artikel 30b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel30b
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 30b
        hoofdstuk: IV
        afdeling: '2'
  - number: 25c.4
    text: |-
      Indien de geldingsduur van een tijdelijke zone is verstreken voordat het gebruik van het luchtvaartterrein
      plaatsvindt overeenkomstig de bij de vaststelling van die zone beschreven situatie is de regeling, bedoeld
      in [artikel 26b][ref1], ongewijzigd geheel van toepassing tot het tijdstip waarop het gebruik van het
      luchtvaartterrein plaatsvindt overeenkomstig de bij de vaststelling van die zone beschreven situatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel26b
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 26b
        hoofdstuk: IV
        afdeling: '1'
  - number: 25c.5
    text: |-
      Uiterlijk een jaar vóór het tijdstip waarop de geldingsduur van een tijdelijke zone vervalt, maakt Onze Minister
      in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer in de Staatscourant
      bekend of de exploitant aan het vervallen van de tijdelijke zone gevolgen moet verbinden met betrekking tot het
      gebruiksplan, en zo ja, welke. De exploitant is verplicht die gevolgen te verwerken in het gebruiksplan tot het
      tijdstip waarop het gebruik van het luchtvaartterrein plaatsvindt overeenkomstig de bij de vaststelling van die
      zone beschreven situatie.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25c
  - number: 25c.6
    text: |-
      Tegelijkertijd met de bekendmaking, bedoeld in het vijfde lid, maakt Onze Minister in overeenstemming met Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer in de Staatscourant bekend op welke wijze tot
      het tijdstip waarop het gebruik van het luchtvaartterrein plaatsvindt overeenkomstig de bij de vaststelling van die
      zone beschreven situatie versneld uitvoering wordt gegeven aan de regeling, bedoeld in [artikel 26b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel26b
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 26b
        hoofdstuk: IV
        afdeling: '1'
  - number: 25d
    text: |-
      Bij de aanwijzing van het luchtvaartterrein worden ten aanzien van iedere definitieve en tijdelijke geluidszone
      geluidscontouren vastgesteld, behorende bij de maximale waarden, bedoeld in [artikel 25, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '25'
        hoofdstuk: IV
        afdeling: '1'
  - number: 25e
    text: |-
      De [artikelen 25][ref1], [25a][ref2], [25b][ref3], [25c][ref4] en [25d][ref5] zijn niet van toepassing indien
      in de aanwijzing van het luchtvaartterrein het gebruik daarvan door van een voortstuwingsinstallatie voorziene
      luchtvaartuigen wordt uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel25b
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel25c
      [ref5]: https://wetten.overheid.nl/BWBR0002267#Artikel25d
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25e
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '25'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 25b
        hoofdstuk: IV
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002267
        artikel: 25c
        hoofdstuk: IV
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0002267
        artikel: 25d
        hoofdstuk: IV
        afdeling: '1'
  - number: 25f
    text: |-
      Indien ten gevolge van groot onderhoud van een baan of banen, van een ongeval of van een ander bijzonder
      voorval sprake is van langdurige afwijking van het voorgeschreven gebruik van het luchtvaartterrein, waardoor
      de geluidszone voor de grenswaarde bedoeld in [artikel 25, eerste lid][ref1], of [artikel 25, vierde lid][ref2],
      eenmalig overschreden zal worden, kan door Onze Minister ontheffing worden verleend van het verbod bedoeld in
      [artikel 25a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25f
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '25'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '25'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
  - number: 25g.1
    text: |-
      Onze Minister stelt in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      regels vast omtrent de wijze van meten, berekenen en registreren van de geluidsbelasting binnen en buiten iedere op
      grond van de [artikelen 25a][ref1], [25b][ref2] en [25c][ref3] geldende geluidszone.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25b
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel25c
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25g
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 25b
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 25c
        hoofdstuk: IV
        afdeling: '1'
  - number: 25g.2
    text: |-
      De kosten verbonden aan metingen, berekeningen en registraties van de geluidsbelasting komen ten laste van de
      exploitant van het luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25g
  - number: 25h.1
    text: |-
      Met het toezicht op de naleving van de voorschriften die krachtens deze wet zijn vastgesteld om een overschrijding
      van de grenswaarden van de geluidsbelasting buiten de geluidszone van burgerluchtvaartterreinen te voorkomen, zijn
      belast de door Onze Minister van Verkeer en Waterstaat aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25h
  - number: 25h.2
    text: |-
      Onze Minister van Defensie is belast met het toezicht op de naleving van de voorschriften, die krachtens deze
      wet zijn vastgesteld om een overschrijding van de grenswaarden van de geluidsbelasting buiten de geluidszone van
      militaire luchtvaartterreinen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25h
  - number: 25i
    text: |-
      Alle gegevens, welke ingevolge de [artikelen 20, tweede lid, onder d][ref1], en [25g][ref2] zijn verzameld met
      betrekking tot de geluidsbelasting, zijn openbaar, tenzij het belang van de veiligheid van de Staat zich daartegen
      verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel25i
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '20'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '25'
        hoofdstuk: IV
        afdeling: '1'
  - number: '26.1'
    text: |-
      Indien de beschikking, bedoeld in [artikel 24, eerste lid][ref1], inhoudt dat een aanwijzing wordt gegeven
      met één of meer geluidszones geeft Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer in
      overeenstemming met Onze Minister op het tijdstip waarop die beschikking wordt gegeven met inachtneming van het
      krachtens [artikel 25, derde, vierde en vijfde lid][ref2] bepaalde, ten aanzien van gronden, gelegen binnen die
      geluidszones aanwijzingen als bedoeld in [artikel 37 van de Wet op de Ruimtelijke Ordening][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel37
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '24'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '25'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002375
        artikel: '37'
  - number: '26.2'
    text: |-
      Indien bij de aanwijzing van het luchtvaartterrein krachtens [artikel 25][ref1] meer varianten worden vastgesteld
      kan Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer bij aanwijzingen als bedoeld in
      [artikel 37 van de Wet op de Ruimtelijke Ordening][ref2] van die geluidszones een andere variant, al dan niet
      met elementen uit de overige varianten, als uitgangspunt nemen dan is gedaan bij de aanwijzing op grond van
      [artikel 25a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25b
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25b
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
  - number: '26.3'
    text: |-
      Aanwijzingen als bedoeld in [artikel 37 van de Wet op de Ruimtelijke Ordening][ref1] kunnen achterwege blijven ten
      aanzien van gronden gelegen in een tijdelijke zone.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel37
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '37'
  - number: 26a.1
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kan bij het geven van aanwijzingen als
      bedoeld in [artikel 26, eerste lid][ref1], aangeven op welke wijze aan bestemmingsplannen, nadat zij zo nodig
      in overeenstemming zijn gebracht met de door hem gegeven voorschriften omtrent de inhoud daarvan, uitvoering zou
      moeten worden gegeven, in het bijzonder met het oog op de beëindiging van het gebruik of de bewoning van daarin
      begrepen bestaande bebouwing, dan wel in voorkomend geval de afbraak daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel26
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '26'
        hoofdstuk: IV
        afdeling: '1'
  - number: 26a.2
    text: |-
      Beëindiging van het gebruik of de bewoning kan echter niet worden gevergd van degene die, op het tijdstip van het
      van kracht worden van de beschikking, bedoeld in [artikel 24, eerste lid][ref1], gebruiker of bewoner is.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel24
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '24'
        hoofdstuk: IV
        afdeling: '1'
  - number: 26a.3
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kan bij het geven van aanwijzingen als
      bedoeld in [artikel 26, eerste lid][ref1], tevens aangeven op welke wijze en in welke gevallen geldelijke steun uit
      ’s Rijks kas kan worden verleend ter bestrijding van de kosten ten gevolge van uitvoering van de in overeenstemming
      met de aanwijzingen gebrachte bestemmingsplannen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel26
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '26'
        hoofdstuk: IV
        afdeling: '1'
  - number: 26b
    text: |-
      Onze Minister stelt in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer een regeling vast inzake geluidwerende voorzieningen ten aanzien van aanwezige woningen en andere
      geluidsgevoelige gebouwen, welke bij de uitvoering van de in overeenstemming met de aanwijzingen, bedoeld in
      [artikel 26a, eerste lid][ref1], gebrachte bestemmingsplannen niet behoeven te worden afgebroken, of waarvan het
      gebruik of de bewoning niet behoeft te worden beëindigd, binnen:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel26a
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 26a
        hoofdstuk: IV
        afdeling: '1'
  - number: 26b.a
    text: |-
      de voor de in [artikel 25, eerste lid, onder a][ref1], bedoelde grenswaarde vastgestelde geluidszone, en


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '25'
        hoofdstuk: IV
        afdeling: '1'
  - number: 26b.b
    text: |-
      voor zover [artikel 25, vierde lid][ref1], is toegepast, de voor de grenswaarde voor structureel uitgevoerd
      nachtelijk vliegverkeer vastgestelde geluidszone.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '25'
        hoofdstuk: IV
        afdeling: '1'
  - number: 26c
    text: |-
      Vooruitlopend op de vaststelling van een geluidszone voor de in [artikel 25, eerste lid, onder a][ref1],
      bedoelde grenswaarde en op de vaststelling van een geluidszone voor de grenswaarde voor structureel uitgevoerd
      nachtelijk vliegverkeer kan Onze Minister in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer, voor woningen en andere geluidsgevoelige gebouwen in het gebied dat naar verwachting
      deel zal uitmaken van een definitieve of tijdelijke zone, maatregelen nemen ter beperking van geluidhinder door
      luchtvaartuigen. De in [artikel 26b][ref2] bedoelde regeling is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel26b
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel26c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '25'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 26b
        hoofdstuk: IV
        afdeling: '1'
  - number: 26d
    text: |-
      De geldelijke steun, bedoeld in [artikel 26a, derde lid][ref1], en de kosten verbonden aan de uitvoering van de
      regeling, bedoeld in [artikel 26b][ref2], en de kosten verbonden aan de toepassing van [artikel 26c][ref3] komen
      ten laste van het Rijk, met dien verstande dat door de eigenaar of houder van een burgerluchtvaartuig ter zake
      van het landen met dat luchtvaartuig op een luchtvaartterrein dan wel door de luchtpassagier die van enigerlei
      luchthaven gebruik maakt een vergoeding verschuldigd is aan de Staat ter bestrijding van die geldelijke steun en
      vorenbedoelde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel26a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel26b
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel26c
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel26d
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 26a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 26b
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 26c
        hoofdstuk: IV
        afdeling: '1'
  - number: '27.1'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      een aanwijzing te allen tijde wijzigen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel27
  - number: '27.2'
    text: |-
      De [artikelen 18, tweede lid, tot en met 26][ref1] zijn van overeenkomstige toepassing ten aanzien van de wijziging
      van een aanwijzing indien het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel18
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '18'
        hoofdstuk: IV
        afdeling: '1'
  - number: 27.2.a
    text: een vergroting van het luchtvaartterrein;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel27
  - number: 27.2.b
    text: |-
      een wijziging in de ligging van banen, een vergroting van lengte of breedte van bestaande banen of een verharding
      van banen, indien zulks een vergroting van een of meer geluidszones ten gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel27
  - number: 27.2.c
    text: een vergroting van een of meer geluidszones om andere dan onder *b* genoemde redenen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel27
  - number: '27.3'
    text: |-
      Onze Minister kan de [artikelen 19-24, eerste lid][ref1] en [27, tweede lid][ref2], met betrekking tot terreinen,
      welke niet voor gebruik door vliegtuigen worden aangewezen, buiten toepassing laten.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel27
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '27'
        hoofdstuk: IV
        afdeling: '1'
  - number: '28.1'
    text: |-
      Ten behoeve van overleg en voorlichting omtrent de milieuhygiëne rond het luchtvaartterrein kan Onze Minister een
      commissie instellen. De instelling van deze commissie geschiedt in elk geval bij een luchtvaartterrein waarvoor een
      geluidszone als bedoeld in de [artikelen 25a][ref1], [25b][ref2] en [25c][ref3] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25b
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel25c
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 25b
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 25c
        hoofdstuk: IV
        afdeling: '1'
  - number: '28.2'
    text: |-
      De commissie kan worden gehoord inzake de vaststelling van het handhavingsvoorschrift bedoeld in
      [artikel 30a][ref1] en de vaststelling van het gebruiksplan bedoeld in [artikel 30 b][ref2]. Onze Minister kan
      de commissie in de gelegenheid stellen advies uit te brengen over alle maatregelen en voorschriften met gevolg
      voor de geluidsbelasting rond het luchtvaartterrein alsmede over de wijze van handhaving van deze maatregelen en
      voorschriften. De commissie is bevoegd Onze Minister ongevraagd voorstellen terzake te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel30b
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 30a
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 30b
        hoofdstuk: IV
        afdeling: '2'
  - number: '28.3'
    text: |-
      Onze Minister stelt bij de instelling van een commissie als bedoeld in het eerste lid nadere regels vast omtrent
      de taak en de samenstelling na overleg met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      en na overleg met de besturen van de provincies en gemeenten, bedoeld in [artikel 19][ref1]. In de commissie hebben
      zitting:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel19
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: 28.3.a
    text: |-
      één vertegenwoordiger van elke provincie als bedoeld in [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel19
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: 28.3.b
    text: |-
      twee vertegenwoordigers van elke gemeente als bedoeld in [artikel 19][ref1], waarvan tenminste één als
      vertegenwoordiger van in die gemeente woonachtige omwonenden van het luchtvaartterrein kan worden beschouwd;


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel19
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '19'
        hoofdstuk: IV
        afdeling: '1'
  - number: 28.3.c
    text: ten hoogste twee vertegenwoordigers van de exploitant van het luchtvaartterrein;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel28
  - number: 28.3.d
    text: |-
      ten hoogste twee vertegenwoordigers van de gebruikers van luchtvaartuigen, welke geregeld op het luchtvaartterrein
      landen en daarvan opstijgen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel28
  - number: 28.3.e
    text: |-
      ten hoogste twee door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aan te wijzen
      vertegenwoordigers;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel28
  - number: 28.3.f
    text: één vertegenwoordiger van rechtspersoonlijkheid bezittende milieuorganisaties;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel28
  - number: 28.3.g
    text: indien sprake is van burgerluchtvaart, een door Onze Minister aan te wijzen vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel28
  - number: 28.3.h
    text: |-
      voor zover dit op het betreffende luchtvaartterrein van toepassing is één vertegenwoordiger van de
      verkeersleidingsdienst.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel28
  - number: '28.4'
    text: |-
      Onze Minister kan na overleg met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer op
      verzoek van een ander land ten hoogste twee vertegenwoordigers van de grensregio van dat land aanwijzen als lid of
      als waarnemer van een commissie als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel28
  - number: '29.1'
    text: |-
      Onze Minister kan de aanwijzing van een luchtvaartterrein dat uitsluitend voor de militaire luchtvaart is
      aangewezen, te allen tijde intrekken.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel29
  - number: '29.2'
    text: |-
      Buiten het geval, bedoeld in het eerste lid kan Onze Minister in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer een aanwijzing intrekken:
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel29
  - number: 29.2.a
    text: op schriftelijke verzoek van de exploitant van het luchtvaartterrein;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel29
  - number: 29.2.b
    text: |-
      indien het gebruik van het luchtvaartterrein dermate bij de gedachtenontwikkeling ten achter blijft dat de
      aanwijzing niet langer gerechtvaardigd kan worden geacht;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel29
  - number: 29.2.c
    text: indien de bij de aanwijzing gestelde bepalingen of voorschriften niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel29
  - number: '29.3'
    text: |-
      Onze Minister geeft kennis van het voornemen tot intrekking van een aanwijzing door publicatie in de
      *Staatscourant* en in één of meer door hem aan te wijzen nieuwsbladen. In het geval, bedoeld in het tweede lid,
      onder *a* geschiedt zulks binnen drie weken na ontvangst van het verzoek. De intrekking geschiedt niet eerder dan
      zes weken, doch uiterlijk binnen zes maanden na de dag van de publikatie in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel29
  - number: '29.4'
    text: In het geval bedoeld in het tweede lid onder *c* kan de intrekking van de aanwijzing onmiddellijk geschieden.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel29
  - number: '30.1'
    text: |-
      Tegen een besluit als bedoeld in de [artikelen 24, eerste lid][ref1], en [27, eerste lid][ref2], kan een
      belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State. Het beroep kan mede de
      in [artikel 26, eerste lid][ref3], bedoelde aanwijzingen en voorschriften omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel26
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '24'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '27'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '26'
        hoofdstuk: IV
        afdeling: '1'
  - number: '30.2'
    text: |-
      Indien omtrent het ontwerp van een bestemmingsplan dat ter uitvoering van de in [artikel 26, eerste lid][ref1],
      bedoelde aanwijzingen en voorschriften wordt vastgesteld of herzien, zienswijzen als bedoeld in
      [artikel 23, tweede lid, van de Wet op de Ruimtelijke Ordening][ref2] kenbaar zijn gemaakt, kunnen deze geen
      grond vinden in bedenkingen tegen de aanwijzing van het luchtvaartterrein of de in [artikel 26, eerste lid][ref3],
      bedoelde aanwijzingen en voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel26
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '26'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '26'
        hoofdstuk: IV
        afdeling: '1'
  - number: 30a.1
    text: |-
      Voor elk luchtvaartterrein waarvoor een of meer zones, als bedoeld in de [artikelen 25a][ref1], [25b][ref2] en
      [25c][ref3] worden vastgesteld, stelt Onze Minister in overeenstemming met Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer een handhavingsvoorschrift vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25b
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel25c
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 25b
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 25c
        hoofdstuk: IV
        afdeling: '1'
  - number: 30a.2
    text: |-
      Het handhavingsvoorschrift legt de hoofdlijnen vast van de wijze waarop toezicht plaatsvindt op de voor het gebruik
      van een luchtvaartterrein gestelde voorschriften als bedoeld in [artikel 24, derde lid][ref1], alsmede op andere
      voorschriften en maatregelen die gericht zijn op het voorkomen of bestrijden van geluidhinder, en bevat tenminste:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel24
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '24'
        hoofdstuk: IV
        afdeling: '1'
  - number: 30a.2.a
    text: |-
      regels omtrent de wijze waarop de voor het meten, berekenen en registreren van de geluidsbelasting benodigde
      gegevens worden verzameld;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30a
  - number: 30a.2.b
    text: |-
      regels omtrent de wijze waarop het feitelijke gebruik van het luchtvaartterrein wordt getoetst aan het voorgenomen
      gebruik dat in het gebruiksplan, bedoeld in [artikel 30b][ref1], is aangegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel30b
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 30b
        hoofdstuk: IV
        afdeling: '2'
  - number: 30a.2.c
    text: |-
      regels omtrent de wijze waarop kan worden geconstateerd of het gebruik van het luchtvaartterrein afwijkt van de
      voorschriften in de aanwijzing bedoeld in [artikel 24, derde lid][ref1], met betrekking tot de geluidsbelasting of
      andere voorschriften en maatregelen die gericht zijn op het voorkomen of bestrijden van geluidhinder.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel24
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '24'
        hoofdstuk: IV
        afdeling: '1'
  - number: 30a.3
    text: Het handhavingsvoorschrift is openbaar.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30a
  - number: 30a.4
    text: |-
      Onze Minister brengt uiterlijk vóór 1 april van elk kalenderjaar in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aan de milieucommissie, bedoeld in [artikel 28][ref1], een
      evaluatierapport uit over de werking van het handhavingsvoorschrift in het voorgaande kalenderjaar. Zonodig bevat
      het evaluatierapport voorstellen omtrent de werking van het handhavingsvoorschrift in het voorgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel28
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '28'
        hoofdstuk: IV
        afdeling: '1'
  - number: 30b.1
    text: De exploitant van een luchtvaartterrein
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30b
  - number: 30b.1.a
    text: |-
      in gebruik voor luchtvaartuigen als bedoeld in [artikel 25, eerste lid, onderdeel a][ref1], zendt Onze Minister een
      voorstel inzake het gebruik van het luchtvaartterrein voor een nader met Onze Minister overeen te komen periode van
      12 achtereenvolgende maanden, verder te noemen gebruiksplan;


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '25'
        hoofdstuk: IV
        afdeling: '1'
  - number: 30b.1.b
    text: |-
      alleen in gebruik voor luchtvaartuigen als bedoeld in [artikel 25, eerste lid, onderdeel b][ref1], toont ten
      genoegen van Onze Minister aan dat door het te verwachten gebruik van het luchtvaartterrein de geluidszone niet zal
      worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '25'
        hoofdstuk: IV
        afdeling: '1'
  - number: 30b.2
    text: 'Het gebruiksplan bevat:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30b
  - number: 30b.2.a
    text: |-
      een voorstel voor de wijze waarop het luchtvaartterrein zal worden gebruikt, met inbegrip van de door de exploitant
      van het desbetreffende luchtvaartterrein tweemaal per jaar vast te stellen capaciteit;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30b
  - number: 30b.2.b
    text: |-
      tenminste alle gegevens die volgens het in [artikel 30a][ref1] bedoelde handhavingsvoorschrift nodig zijn om de
      geluidsbelasting te bepalen die zal worden veroorzaakt door het in het gebruiksplan voorgestelde gebruik van het
      luchtvaartterrein;


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 30a
        hoofdstuk: IV
        afdeling: '2'
  - number: 30b.2.c
    text: |-
      de maatregelen, die de exploitant in ieder geval dient te nemen om voor zover dat in zijn vermogen ligt er voor
      zorg te dragen, dat bij het gebruik van het desbetreffende luchtvaartterrein de geluidsbelasting de vastgestelde
      grenswaarde buiten de daarbij behorende geluidszone niet overschrijdt;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30b
  - number: 30b.2.d
    text: |-
      op verzoek van Onze Minister: de wijze waarop en de frequentie waarmee de exploitant rapporteert omtrent de onder c
      bedoelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30b
  - number: 30b.3
    text: |-
      Onze Minister stelt na overleg met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer het
      gebruiksplan binnen zes weken na ontvangst vast, indien is aangetoond dat: - het gebruik van het luchtvaartterrein
      zoals aangegeven in het gebruiksplan niet zal leiden tot een hogere geluidsbelasting dan is toegelaten volgens de
      voor het luchtvaartterrein op grond van de [artikelen 25a][ref1], [25b][ref2] en [25c][ref3] vastgestelde zones, en
        - de op grond van [artikel 24, derde lid][ref4], of op andere wijze gestelde voorschriften en maatregelen die zijn
      gericht op het voorkomen of bestrijden van geluidhinder, in acht zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25b
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel25c
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel24
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 25b
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 25c
        hoofdstuk: IV
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002267
        artikel: '24'
        hoofdstuk: IV
        afdeling: '1'
  - number: 30b.4
    text: |-
      Zolang voor de voorliggende periode van 12 maanden geen gebruiksplan is vastgesteld, hanteert de exploitant van het
      luchtvaartterrein het laatst vastgestelde gebruiksplan.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30b
  - number: 30b.5
    text: |-
      Indien het gebruik van het luchtvaartterrein gaat afwijken van het geldend gebruiksplan, zendt de exploitant een
      voorstel tot wijziging van het gebruiksplan aan Onze Minister. Het tweede en derde lid zijn van overeenkomstige
      toepassing met dien verstande dat een wijziging van het gebruiksplan door Onze Minister na overleg met Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer binnen drie weken na ontvangst wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30b
  - number: 30b.6
    text: |-
      De exploitant zendt het in het eerste lid, onder a, bedoelde voorstel uiterlijk acht weken en het in het vijfde
      lid bedoelde voorstel uiterlijk vier weken voorafgaand aan de periode waarop het voorstel betrekking heeft aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30b
  - number: 30b.7
    text: Het gebruiksplan is openbaar.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30b
  - number: 30c.1
    text: De in deze afdeling opgenomen bepalingen zijn niet van toepassing op militaire luchtvaartterreinen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30c
  - number: 30c.2
    text: |-
      De gegevens omtrent het feitelijk gebruik van militaire luchtvaartterreinen worden jaarlijks door Onze Minister in
      overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer herleid tot contouren
      welke de actuele geluidsbelasting in dat jaar weergeven.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30c
  - number: 30c.3
    text: De contourenkaarten zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel30c
  - number: '31.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel31
  - number: 31.1.a
    text: |-
      op een luchtvaartterrein bouwwerken of andere opstallen op te richten of te hebben dan wel gewassen te planten of
      te hebben;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel31
  - number: 31.1.b
    text: |-
      op een luchtvaartterrein roerende zaken te hebben of graafwerk te verrichten, anders dan in verband met de
      dagelijkse exploitatie of het dagelijkse onderhoud van het luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel31
  - number: '31.2'
    text: 'Het bepaalde in het eerste lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel31
  - number: 31.2.a
    text: in de gevallen, aangegeven bij algemene maatregel van bestuur;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel31
  - number: 31.2.b
    text: indien en voor zover Onze Minister ontheffing heeft verleend.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel31
  - number: '32'
    text: |-
      De exploitant van een uitsluitend of mede voor het openbare burgerlijke luchtverkeer aangewezen luchtvaartterrein
      is, met inachtneming van de bij of krachtens deze wet gestelde bepalingen, verplicht dit luchtverkeer op het
      luchtvaartterrein toe te laten.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel32
  - number: '33.1'
    text: |-
      Het is de exploitant van een luchtvaartterrein verboden een luchtvaartterrein te gebruiken of te doen of te laten
      gebruiken:
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel33
  - number: 33.1.a
    text: in strijd met de bepalingen en voorschriften bij de aanwijzing gesteld;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel33
  - number: 33.1.b
    text: |-
      in strijd met de door Onze Minister gegeven voorschriften, als bedoeld in [artikel 35][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel35
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '35'
        hoofdstuk: IV
        afdeling: '3'
  - number: 33.1.c
    text: voor andere doeleinden, dan die, welke verband houden met de exploitatie van het luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel33
  - number: '33.2'
    text: Het bepaalde in het eerste lid geldt niet, indien Onze Minister ontheffing heeft verleend.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel33
  - number: '33.3'
    text: |-
      De exploitant maakt de beslissing van Onze Minister omtrent de ontheffing bekend aan de gezagvoerder en de
      eigenaar, houder of bezitter van een luchtvaartuig, indien de beslissing op een of meer van de hiervoor genoemde
      personen betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel33
  - number: '34.1'
    text: |-
      Het is de gezagvoerder en de eigenaar, houder of bezitter van een luchtvaartuig verboden een luchtvaartterrein
      te gebruiken:
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel34
  - number: 34.1.a
    text: in strijd met de bepalingen en voorschriften bij de aanwijzing gesteld;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel34
  - number: 34.1.b
    text: |-
      in strijd met de door Onze Minister gegeven voorschriften als bedoeld in [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel35
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '35'
        hoofdstuk: IV
        afdeling: '3'
  - number: '34.2'
    text: |-
      Het bepaalde in het eerste lid geldt niet, indien en voor zover Onze Minister ontheffing heeft verleend, dan wel
      voor zover een ontheffing is verleend als bedoeld in [artikel 33, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel33
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '33'
        hoofdstuk: IV
        afdeling: '3'
  - number: '35.1'
    text: |-
      Onze Minister kan, in verband met de gesteldheid van het luchtvaartterrein of om andere redenen de veiligheid
      van de luchtvaart betreffende dan wel op grond van de omstandigheid, dat de bij de aanwijzing gestelde bepalingen
      of voorschriften niet worden nageleefd, een luchtvaartterrein tijdelijk gesloten verklaren. Voor zover Onze
      Minister geen ontheffing als bedoeld in [artikel 25f][ref1] heeft verleend voor een tijdelijke overschrijding
      van de geluidszones, bedoeld in de [artikelen 25a][ref2], [25b][ref3] en [25c][ref4], kan een luchtvaartterrein
      tijdelijk gesloten worden verklaard indien buiten de geluidszones een hogere geluidsbelasting is opgetreden dan de
      vastgestelde grenswaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25f
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel25b
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel25c
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25f
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 25a
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 25b
        hoofdstuk: IV
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002267
        artikel: 25c
        hoofdstuk: IV
        afdeling: '1'
  - number: '35.2'
    text: |-
      Onze Minister kan in geval van dreigende overschrijding van een vastgestelde grenswaarde buiten de daarbij
      behorende geluidszone het desbetreffende luchtvaartterrein tijdelijk gesloten verklaren, indien de exploitant alle
      in [artikel 30b, tweede lid, onderdeel c][ref1], bedoelde maatregelen zal nemen of heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel30b
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 30b
        hoofdstuk: IV
        afdeling: '2'
  - number: '35.3'
    text: |-
      De sluiting kan, met inachtneming van hetgeen daaromtrent bij internationale overeenkomst is bepaald, worden
      beperkt tot:
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel35
  - number: 35.3.a
    text: bepaalde soorten van luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel35
  - number: 35.3.b
    text: bepaalde vormen van luchtvaart;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel35
  - number: 35.3.c
    text: bepaalde start- of landingsbanen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel35
  - number: 35.3.d
    text: bepaalde tijdsperioden;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel35
  - number: 35.3.e
    text: |-
      luchtvaartuigen behorend tot het soort luchtvaartuigen in beheer of in eigendom van een natuurlijke persoon of
      rechtspersoon, waarmee een gezagvoerder in zijn dienst of voor zijn rekening gedurende een periode van twaalf
      maanden tenminste twee keer het verbod, bedoeld in [artikel 34, eerste lid][ref1], heeft overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel34
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '34'
        hoofdstuk: IV
        afdeling: '3'
  - number: '36.1'
    text: |-
      De exploitant van een luchtvaartterrein, uitsluitend of mede aangewezen voor het openbare burgerlijke
      luchtverkeer, is verplicht tarieven vast te stellen voor het gebruik dat door luchtvaartuigen wordt gemaakt van dit
      luchtvaartterrein en van de zich daarop bevindende opstallen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel36
  - number: '36.2'
    text: Deze tarieven behoeven Onze toestemming.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel36
  - number: '36.3'
    text: |-
      Indien aangaande een besluit van de Staten ener provincie of de raad ener gemeente betreffende de vaststelling van
      tarieven, als bedoeld in het eerste lid, reeds ingevolge de [Provinciewet][ref1] of de [Gemeentewet][ref2] (*Stb.*
      1992, 96) Onze goedkeuring is vereist, wordt Onze beslissing genomen op voordracht van Onze Minister van Verkeer en
      Waterstaat en Onze Minister van Binnenlandse Zaken gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005645
      [ref2]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005645
      - id: ref2
        bwb_id: BWBR0005416
  - number: '37'
    text: |-
      Het is verboden voor het in [artikel 36][ref1] bedoelde gebruik andere tarieven te heffen, dan de ingevolge dat
      artikel door Ons goedgekeurde tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel36
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '36'
        hoofdstuk: IV
        afdeling: '3'
  - number: 37a.1
    text: 'Voor de toepassing van deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37a
  - number: 37a.1.a
    text: |-
      luchtvaartterreinen: een luchtvaartterrein dat mede wordt gebruikt voor verkeersvluchten, met uitzondering van die
      delen van een militair luchtvaartterrein die niet uitsluitend ten behoeve van de burgerluchtvaart worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37a
  - number: 37a.1.b
    text: 'beveiligingspersoneel:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37a
  - number: 37a.1.b.1°
    text: |-
      personen in dienst van een door de exploitant van een luchtvaartterrein met de uitvoering van de beveiliging
      belaste particuliere beveiligingsorganisatie, waaraan door Onze Minister van Justitie een vergunning is verleend
      als bedoeld in [artikel 3 van de Wet particuliere beveiligingsorganisaties en recherchebureaus][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel3
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '3'
  - number: 37a.1.b.2°
    text: |-
      de door Onze Minister van Justitie aangewezen politie-ambtenaren, ambtenaren van de Koninklijke marechaussee en de
      ambtenaren van de rijksbelastingdienst, bevoegd inzake douane;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37a
  - number: 37a.1.c
    text: |-
      voor bedreiging geschikte voorwerpen: wapens, explosieven of andere voorwerpen en stoffen, die voor de bedreiging
      van personen geschikt zijn dan wel de veiligheid van het luchtvaartuig in gevaar kunnen brengen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37a
  - number: 37a.1.d
    text: |-
      gevaarlijke goederen: explosieven of andere voorwerpen en stoffen, die de veiligheid van het luchtvaartuig in
      gevaar kunnen brengen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37a
  - number: 37a.1.e
    text: 'bagage: goederen toebehorende aan passagiers,'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37a
  - number: 37a.1.e.1°
    text: die deze zelf in het luchtvaartuig meenemen als handbagage, of
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37a
  - number: 37a.1.e.2°
    text: |-
      die deze in verband met hun reis aan de luchtvaartmaatschappij hebben afgegeven teneinde in het ruim van het
      luchtvaartuig te worden vervoerd als ruimbagage;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37a
  - number: 37a.1.f
    text: |-
      vracht: goederen, niet zijnde bagage, die voor vervoer door de lucht worden aangeboden, daaronder begrepen
      postzendingen als bedoeld in [artikel 1, onderdeel c, van de Postwet][ref1], tenzij deze goederen door de lucht
      worden aangevoerd en het vliegtuig niet verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel1
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: '1'
  - number: 37a.2
    text: |-
      Met betrekking tot militaire luchtvaartterreinen waarvan delen uitsluitend ten behoeve van de burgerluchtvaart
      worden gebruikt, wordt in afwijking van [artikel 1, eerste lid, onder d][ref1], voor de toepassing van deze
      afdeling als exploitant van een luchtvaartterrein aangemerkt, de bij koninklijk besluit aan te wijzen rechtspersoon
      aan wie het medegebruik ten behoeve van de burgerluchtvaart is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel1
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '1'
        hoofdstuk: I
  - number: 37a.3
    text: |-
      Een koninklijk besluit als bedoeld in het tweede lid wordt genomen op voordracht van Onze Minister van Verkeer en
      Waterstaat in overeenstemming met Onze Ministers van Justitie en van Defensie.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37a
  - number: 37ab
    text: |-
      Onze Minister van Justitie is belast met de beveiliging van de burgerluchtvaart. De exploitant van een
      luchtvaartterrein, een luchtvaartmaatschappij en een persoon als bedoeld in [artikel 37p][ref1], eerste lid,
      zijn gehouden te voldoen aan door Onze Minister van Justitie of namens deze door de Commandant van de Koninklijke
      marechaussee gegeven aanwijzingen inzake de nakoming van een verplichting die op hen rust ingevolge de artikelen
      [37b, zesde lid][ref2], [37f][ref3], [37g][ref4], [37h][ref5], [37hb][ref6], [37hd][ref7], [37k][ref8],
      [37l][ref9], [37n][ref10] of [37r][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37p
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel37g
      [ref5]: https://wetten.overheid.nl/BWBR0002267#Artikel37h
      [ref6]: https://wetten.overheid.nl/BWBR0002267#Artikel37hb
      [ref7]: https://wetten.overheid.nl/BWBR0002267#Artikel37hd
      [ref8]: https://wetten.overheid.nl/BWBR0002267#Artikel37k
      [ref9]: https://wetten.overheid.nl/BWBR0002267#Artikel37l
      [ref10]: https://wetten.overheid.nl/BWBR0002267#Artikel37n
      [ref11]: https://wetten.overheid.nl/BWBR0002267#Artikel37r
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel37ab
