        artikel: '54'
      - id: ref10
        bwb_id: BWBR0002320
        artikel: '68'
  - number: 77a.3
    text: |-
      De bevoegdheden en de verplichtingen van de hierna vermelde, in de [Algemene wet inzake rijksbelastingen][ref1]
      genoemde functionarissen gelden met betrekking tot de geluidsheffing burgerluchtvaart voor de daarachter genoemde
      functionarissen:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 77a.3.a
    text: 'Onze Minister van Financiën: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77a
  - number: 77a.3.b
    text: 'de inspecteur:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77a
  - number: 77a.3.b.1°
    text: |-
      ten aanzien van burgerluchtvaartterreinen: de door Onze Minister van Verkeer en Waterstaat daartoe aan te wijzen
      functionaris van de exploitant van een luchtvaartterrein;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77a
  - number: 77a.3.b.2°
    text: |-
      ten aanzien van militaire luchtvaartterreinen: de door Onze Minister van Verkeer en Waterstaat in overeenstemming
      met Onze Minister van Financiën aan te wijzen ambtenaar van de Dienst der Domeinen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77a
  - number: 77a.4
    text: |-
      In afwijking van het derde lid, onderdeel b, onder 1°, treedt voor de toepassing van
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] de door Onze Minister van Verkeer en
      Waterstaat aan te wijzen ambtenaar in de plaats van de inspecteur. Voorts treedt voor de toepassing van
      [artikel 28, eerste lid van de Algemene wet inzake rijksbelastingen][ref2] Onze Minister van Verkeer en Waterstaat
      in de plaats van Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel28
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '28'
  - number: 77a.5
    text: |-
      De heffing wordt geheven bij wege van aanslag. Zij wordt geheven over een bij ministeriële regeling van Onze
      Minister van Verkeer en Waterstaat te bepalen tijdvak.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77a
  - number: 77b.1
    text: |-
      De heffing wordt ingevorderd door de door Onze Minister van Verkeer en Waterstaat aan te wijzen functionaris van
      de exploitant van een luchtvaartterrein, door de door Onze Minister van Verkeer en Waterstaat in overeenstemming
      met Onze Minister van Financiën aan te wijzen ambtenaar van de Dienst der Domeinen en door de ontvanger, bedoeld in
      [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
  - number: 77b.2
    text: |-
      Onverminderd het overigens in dit artikel bepaalde wordt de heffing ingevorderd met overeenkomstige
      toepassing van de [Invorderingswet 1990][ref1] en de [Kostenwet invordering rijksbelastingen][ref2]
      (*Stb.* 1969, 83), met dien verstande dat van de [Invorderingswet 1990][ref3] buiten toepassing blijven de
      [artikelen 9, eerste tot en met negende lid][ref4], [59][ref5] en [62][ref6]. Voorts blijven bij de toepassing
      van [artikel 66 van die wet][ref7] de [artikelen 76][ref8], [80, tweede, derde en vierde lid][ref9], [82][ref10],
      [84][ref11], [86][ref12] en [87 van de Algemene wet inzake rijksbelastingen][ref13] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0002645
      [ref3]: https://wetten.overheid.nl/BWBR0004770
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel59
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel62
      [ref7]: https://wetten.overheid.nl/BWBR0004770#Artikel66
      [ref8]: https://wetten.overheid.nl/BWBR0002320#Artikel76
      [ref9]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref10]: https://wetten.overheid.nl/BWBR0002320#Artikel82
      [ref11]: https://wetten.overheid.nl/BWBR0002320#Artikel84
      [ref12]: https://wetten.overheid.nl/BWBR0002320#Artikel86
      [ref13]: https://wetten.overheid.nl/BWBR0002320#Artikel87
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
