        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '17'
        hoofdstuk: III
        afdeling: '3'
  - number: '62.3'
    text: |-
      Overtreding van een voorschrift gegeven bij of krachtens algemene maatregel van bestuur ingevolge deze wet, wordt,
      voor zover die overtreding uitdrukkelijk als strafbaar feit is aangemerkt, gestraft hetzij met hechtenis van ten
      hoogste zes maanden en geldboete van de derde categorie, hetzij met één van deze straffen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel62
  - number: '62.4'
    text: |-
      De eigenaar of houder van een luchtvaartuig, die in strijd met een van de [artikelen 4][ref1], [8][ref2] of
      [16][ref3] de luchtvaart doet of laat uitoefenen, wordt gestraft hetzij met hechtenis van ten hoogste zes maanden
      en geldboete van de derde categorie, hetzij met één van deze straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '4'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '8'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
  - number: '63'
    text: |-
      Overtreding van een van de [artikelen 15][ref1] of [65][ref2] wordt gestraft met gevangenisstraf van ten hoogste
      drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel65
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '15'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '65'
        hoofdstuk: VI
  - number: '64.1'
    text: 'Bij veroordeling wegens overtreding van:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel64
  - number: 64.1.a
    text: |-
      een van de [artikelen 4][ref1], [8][ref2], en [17][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel17
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '4'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '8'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '17'
        hoofdstuk: III
        afdeling: '3'
  - number: 64.1.b
    text: |-
      een voorschrift van een krachtens deze wet vastgestelde algemene maatregel van bestuur, kan de schuldige de
      bevoegdheid een luchtvaartuig te bedienen voor ten hoogste drie jaren worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel64
  - number: '64.2'
    text: |-
      Bij toepassing van het bepaalde in het eerste lid verliest een aan de veroordeelde afgegeven bewijs van bevoegdheid
      of van gelijkstelling zijn geldigheid voor de duur van de ontzegging, zodra de rechterlijke uitspraak, voor wat
      betreft deze bijkomende straf, voor tenuitvoerlegging vatbaar is geworden. De betrokken ambtenaar van het Openbaar
      Ministerie brengt dit onverwijld ter kennis van Onze Minister, die daarvan aankondiging doet in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel64
  - number: '65'
    text: |-
      Het is degene, die weet, of redelijkerwijze moet weten, dat hem bij rechterlijke uitspraak de bevoegdheid een
      luchtvaartuig te bedienen is ontzegd, verboden, gedurende de tijd, dat hem die bevoegdheid ontzegd is, een
      luchtvaartuig te bedienen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel65
  - number: '66.1'
    text: |-
      Hij, die opzettelijk niet voldoet aan een krachtens [artikel 58][ref1] gedane vordering, wordt gestraft met
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '66.2'
    text: |-
      Hij, die opzettelijk in strijd handelt met een ingevolge [artikel 59][ref1] gegeven aanwijzing, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel59
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '59'
        hoofdstuk: V
  - number: '66.3'
    text: |-
      Hij, die opzettelijk een ingevolge [artikel 61][ref1] gegeven opdracht niet uitvoert, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel61
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '61'
        hoofdstuk: V
  - number: '67.1'
    text: |-
      Hij, die niet voldoet aan een krachtens [artikel 58][ref1] gedane vordering, wordt gestraft met hechtenis van ten
      hoogste één jaar of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '67.2'
    text: |-
      Hij, die in strijd handelt met een ingevolge [artikel 59][ref1] gegeven aanwijzing, wordt gestraft met hechtenis
      van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel59
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '59'
        hoofdstuk: V
  - number: '67.3'
    text: |-
      Hij, die een ingevolge [artikel 61][ref1] gegeven opdracht niet uitvoert, wordt gestraft met hechtenis van ten
      hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel61
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '61'
        hoofdstuk: V
  - number: '68'
    text: |-
      Hij, die een handeling verricht met het oogmerk de uitoefening van de bevoegdheden vermeld in de
      [artikelen 58][ref1], [59][ref2] en [61][ref3] te belemmeren, wordt gestraft met gevangenisstraf van ten hoogste
      twee jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel61
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '59'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '61'
        hoofdstuk: V
  - number: '70'
    text: |-
      De feiten strafbaar gesteld bij de [artikelen 63][ref1], [66][ref2] en [68][ref3] zijn misdrijven. De feiten
      strafbaar gesteld bij de [artikelen 62][ref4] en [67][ref5] zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel68
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel62
      [ref5]: https://wetten.overheid.nl/BWBR0002267#Artikel67
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '63'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '66'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '68'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0002267
        artikel: '62'
        hoofdstuk: VI
      - id: ref5
        bwb_id: BWBR0002267
        artikel: '67'
        hoofdstuk: VI
  - number: '71'
    text: |-
      Als personen met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn, behalve de bij
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen personen, belast:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 71.a
    text: de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel71
  - number: 71.b
    text: de door Onze Minister aan te wijzen personen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel71
  - number: '72'
    text: |-
      Onverminderd [artikel 37h][ref1] is Onze Minister bevoegd tot toepassing van bestuursdwang ter handhaving van de
      bij of krachtens deze wet gestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37h
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37h
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: '73.1'
    text: 'Onze Minister van Verkeer en Waterstaat kan:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel73
  - number: 73.1.a
    text: |-
      ambtenaren aanwijzen, die voor zover het betreft de burgerluchtvaart belast zijn met het toezicht op de naleving
      van het bij of krachtens deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel73
  - number: 73.1.b
    text: personen aanwijzen, die bevoegd zijn de opstijging van luchtvaartuigen te verbieden en te beletten.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel73
  - number: '73.2'
    text: |-
      De bevoegdheid, bedoeld in het eerste lid onder a, kan eveneens worden uitgeoefend met betrekking tot militaire
      luchtvaartterreinen, die krachtens hun aanwijzing of een terzake verleende ontheffing mede door burgerlijke
      luchtvaartuigen mogen worden gebruikt, en met betrekking tot gedeelten van militaire fabrieken, werkplaatsen en
      aanhorigheden, waar zich burgerlijke luchtvaartuigen bevinden, mits een en ander geschiedt in overeenstemming met
      de door de militaire autoriteiten gegeven richtlijnen.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel73
  - number: 73b
    text: |-
      Ieder is verplicht aan de krachtens [artikel 73][ref1] aangewezen ambtenaren desgevraagd alle medewerking te
      verlenen en alle inlichtingen te verstrekken, die zij redelijkerwijs bij de uitvoering van de hun op grond van deze
      wet opgedragen taak behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel73
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel73b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '73'
        hoofdstuk: VI
  - number: 73c.1
    text: |-
      Onze Minister is bevoegd aan de overtreder of de houder, bezitter of eigenaar van het betrokken luchtvaartuig
      een last onder dwangsom op te leggen, indien de gezagvoerder voor de tweede keer een overtreding heeft begaan als
      bedoeld in [artikel 34][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel34
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel73c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '34'
        hoofdstuk: IV
        afdeling: '3'
  - number: 73c.2
    text: |-
      De [artikelen 5.3.1, tweede tot en met vijfde lid](onbekend), en [5.3.2 tot en met 5.3.4 van de Algemene wet
      bestuursrecht](onbekend) zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel73c
  - number: '75'
    text: |-
      Op de eerste vordering van de in [artikel 71][ref1] bedoelde personen zijn de gezagvoerder en de overige leden van
      de bemanning van een luchtvaartuig verplicht de bij of krachtens deze wet vereiste bescheiden behoorlijk ter inzage
      af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel71
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '71'
        hoofdstuk: VI
  - number: '76.1'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: 76.1.a
    text: |-
      ter uitvoering van de voorafgaande hoofdstukken of indien de in deze hoofdstukken geregelde onderwerpen in het
      belang van een goede uitvoering van de wet nadere regeling behoeven;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: 76.1.c
    text: betreffende de aanleg, de inrichting en het gebruik van luchtvaartterreinen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: 76.1.d
    text: ter beveiliging van militaire belangen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: 76.1.e
    text: |-
      ter beperking van de geluidhinder door luchtvaartuigen met uitzondering van de geluidhinder ten
      gevolge van de uitoefening van de burgerluchtvaart boven gebieden, aangewezen overeenkomstig
      [artikel 1.2, tweede lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 76.1.g
    text: betreffende de opleiding van vliegtuigbestuurders;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: 76.1.j
    text: betreffende het vervoer van dieren in luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: 76.1.k
    text: |-
      betreffende de regels, die luchtvaartmaatschappijen in acht moeten nemen bij de uitvoering van bepaalde soorten van
      luchtvervoer in, naar of uit Nederland of met Nederland als tussenstation;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: 76.1.l
    text: betreffende de door luchtvaartmaatschappijen toe te passen tarieven en andere vervoersvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: 76.1.m
    text: |-
      betreffende de regels, die in acht moeten worden genomen bij de uitvoering van vluchten naar of uit Nederland
      of met Nederland als tussenstation, waarop géén vervoer plaats vindt, dan wel vluchten welke niet door
      luchtvaartmaatschappijen worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: '76.2'
    text: 'Voorts kunnen bij of krachtens algemene maatregel van bestuur de vergoedingen worden geregeld, verschuldigd voor:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: 76.2.a
    text: het gebruik van ’s lands luchtvaartterreinen;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: 76.2.b
    text: werkzaamheden, door de Staat verricht;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: 76.2.c
    text: diensten, door de Staat verstrekt.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: '76.3'
    text: |-
      Indien een algemene maatregel van bestuur als bedoeld in het eerste lid onder *e*, normen bevat, welke
      betrekking hebben op aan luchtvaartuigen aan te brengen technische voorzieningen ter zake van een vermindering
      van de geluidsproduktie tijdens een vlucht, bij opstijging of landing, of tijdens het proefdraaien op het
      luchtvaartterrein anders dan bij de uitvoering van een vlucht, kan tevens worden bepaald in welke mate deze normen
      in een aan te geven toekomstige periode zullen worden verzwaard.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: '76.4'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid onder *a, e, k, l* en *m* of een wijziging
      daarvan treedt niet eerder in werking dan twee maanden na datum van uitgifte van het *Staatsblad* waarin deze wordt
      geplaatst. Van de plaatsing wordt onverwijld aan de Staten-Generaal mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel76
  - number: '77.1'
    text: 'Met betrekking tot de financiering en de bekostiging van:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: 77.1.a
    text: de kosten van de uitvoering van de aanwijzing, de voorschriften en de maatregelen, bedoeld in artikel 26d, en
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: 77.1.b
    text: |-
      de kosten van de uitvoering van [artikel 8.32 van de Wet luchtvaart][ref1], wordt onder de naam
      «geluidsheffing burgerluchtvaart» een heffing geheven. Voor het luchtvaartterrein Schiphol wordt
      naast de geluidsheffing burgerluchtvaart een heffing geheven ter financiering van de kosten van de
      uitvoering van [artikel 8.33 van de Wet luchtvaart][ref2], alsmede de kosten van het Schadeschap
      Luchthaven Schiphol en van zijn uitspraken voor zover deze betrekking hebben op de uitvoering van
      __REF002___________________________________________________________________________________________________________
      _________________________________.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009989#Artikel9
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0009989
        artikel: '9'
  - number: '77.2'
    text: |-
      De heffingen worden geheven ter zake van het landen met een burgerluchtvaartuig op een luchtvaartterrein tot het
      tijdstip waarop de kosten als bedoeld in het eerste lid voor dat luchtvaartterrein zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: '77.3'
    text: |-
      De heffingen worden geheven van de natuurlijke persoon of de rechtspersoon die als eigenaar of houder van
      een burgerluchtvaartuig dit te zijner beschikking heeft en dit onder zijn verantwoordelijkheid laat deelnemen
      aan het luchtverkeer. De natuurlijke persoon of rechtspersoon, bedoeld in de eerste volzin, is in ieder geval
      belanghebbende bij een uitspraak van het Schadeschap Luchthaven Schiphol als bedoeld in het eerste lid, tweede
      volzin.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: '77.4'
    text: |-
      De geluidsheffing burgerluchtvaart wordt geheven naar de geluidsproduktie van het burgerluchtvaartuig uitgedrukt in
      een aantal rekeneenheden.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: '77.5'
    text: 'De geluidsproduktie wordt bepaald met toepassing van de volgende formules:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: 77.5.a
    text: |-
      voor burgerluchtvaartuigen met een startmassa van meer dan 390 kilogram doch niet meer dan 20 000 kilogram, met
      uitzondering van burgervliegtuigen met luchtschroefaandrijving met een startgewicht van meer dan 390 kilogram doch
      niet meer dan 6000 kilogram,: 0,20 + 0,04 * M;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: 77.5.b
    text: |-
      voor burgerluchtvaartuigen met een startmassa van meer dan 20 000 kilogram, die blijkens een verklaring van het
      bevoegde gezag van de Staat van registratie van het burgerluchtvaartuig ten minste voldoen aan de in bijlage 16,
      deel I, van het Verdrag van Chicago (*Trb.* 1973, 109) vastgestelde geluidsnormen: met dien verstande dat het
      aantal rekeneenheden ten minste op één wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: 77.c
    text: |-
      voor burgerluchtvaartuigen met een startmassa van meer dan 20 000 kilogram, andere dan die bedoeld in onderdeel
      *b*: k * M2/3, met dien verstande dat het aantal rekeneenheden ten minste op één wordt gesteld. In de formules
      stellen voor: M: de maximaal toegelaten startmassa van het burgerluchtvaartuig uitgedrukt in gehele eenheden
      van 1000 kilogram, waarbij een gedeelte van een eenheid geldt als een gehele eenheid; n: de correctiefactor van
      geluidcertificatiemeetpunten en meetcondities met toepassing van de in het zesde lid opgenomen tabel; Lr: de
      som van de geluidsniveaus op de geluidcertificatiemeetpunten; k: de constante, aangegeven per vliegtuigtype en
      onderscheiden naar klassen van geschatte geluidsniveaus als opgenomen in een overeenkomstig het zevende lid vast te
      stellen tabel.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: '77.6'
    text: 'De correctiefactor n wordt vastgesteld met toepassing van de volgende tabel: Ingedeeld worden:'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: 77.6.a
    text: 'in kolom A: de luchtvaartuigen als aangegeven in hoofdstuk 2 van Bijlage 16, deel I, van het Verdrag van Chicago;'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: 77.6.b
    text: 'in kolom B: de luchtvaartuigen als aangegeven in hoofdstuk 3 van Bijlage 16, deel I, van het Verdrag van Chicago;'
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: 77.6.c
    text: |-
      in kolom C: de "stage 2"-luchtvaartuigen als aangegeven in "Federal Aviation Regulations, part 36 (Noise Standards:
      Aircraft Type and Airworthiness Certification)", met inbegrip van amendment 36-12, in werking getreden op 1
      augustus 1981;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: 77.6.d
    text: |-
      in kolom D: de "stage 3"-luchtvaartuigen als aangegeven in "Federal Aviation Regulations, part 36" bedoeld in
      onderdeel *c*.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: '77.7'
    text: |-
      Onze Minister van Verkeer en Waterstaat deelt de vliegtuigtypen op grond van de geschatte geluidsniveaus in de
      klassentabel, bedoeld in het vijfde lid, volgens de volgende tabel in.






                    Geluidsklasse


                    Geluidsniveau L






                    I


                    I L > Llim + 9dB




                    II


                    II Llim < L Llim + 9 dB




                    III


                    III Llim - 9 dB < L ≤ Llim




                    IV


                    IV Llim - 18 dB < L ≤ Llim - 9 dB




                    V


                    V L ≤ Llim - 18 dB




           In de tabel stelt voor: L: de som van de geschatte geluidsniveaus op de geluidcertificatiemeetpunten; Llim: de
      som van de maximale geluidsniveaus op de geluidcertificatiemeetpunten volgens de formule Llim = 29.88logM + 251.22.
      In deze formule stelt voor: M: de maximaal toegelaten startmassa van het burgerluchtvaartuig uitgedrukt in gehele
      eenheden van 1000 kilogram, waarbij een gedeelte van een eenheid geldt dit als een gehele eenheid.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: '77.8'
    text: |-
      Het tarief van de heffing per rekeneenheid geluidsproductie bedraagt in het jaar 2004 € 27,–. Het tarief van de
      heffing per rekeneenheid geluidsproductie wordt na 2004 met ingang van elk daaropvolgend kalenderjaar verhoogd met
      € 1,–.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: '77.9'
    text: |-
      Voor het luchtvaartterrein Schiphol wordt het tarief van de heffing per rekeneenheid geluidsproductie, bedoeld in
      het achtste lid, verhoogd met:
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: 77.9.a
    text: € 98,50 tot het jaar 2010;
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: 77.9.b
    text: |-
      € 40,– vanaf het jaar 2010, met dien verstande dat deze verhoging na het jaar 2010 met ingang van elk daaropvolgend
      kalenderjaar wordt vermeerderd met € 1,25.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: '77.10'
    text: |-
      Het tarief van de in het eerste lid, tweede volzin, bedoelde heffing bedraagt € 0,50 per ton van de maximale
      toegelaten startmassa van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: '77.11'
    text: |-
      De eigenaar of houder van een luchtvaartuig dient de ter bepaling van de geluidsheffing noodzakelijke gegevens ter
      beschikking van Onze Minister van Verkeer en Waterstaat te stellen overeenkomstig door hem te geven regels.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: '77.12'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan bij de toepassing van het eerste lid een deel van de kosten buiten
      toepassing laten indien toepassing, gelet op het belang van de burgerluchtvaart zal leiden tot een onbillijkheid
      van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77
  - number: 77a.1
    text: De heffing wordt door Onze Minister van Verkeer en Waterstaat geheven.
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77a
  - number: 77a.2
    text: |-
      Onverminderd het overigens in dit artikel bepaalde wordt de heffing geheven met overeenkomstige toepassing
      van de [Algemene wet inzake rijksbelastingen][ref1] (*Stb.* 1959, 301), met dien verstande dat van die wet
      buiten toepassing blijven, de [artikelen 2, vierde lid][ref2], [37][ref3], [38][ref4], [47a][ref5], [48][ref6],
      [52][ref7], [53][ref8] en [54][ref9] alsmede [68 tot en met 88][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel47a
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel48
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref8]: https://wetten.overheid.nl/BWBR0002320#Artikel53
      [ref9]: https://wetten.overheid.nl/BWBR0002320#Artikel54
      [ref10]: https://wetten.overheid.nl/BWBR0002320#Artikel68
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '37'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '38'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: 47a
      - id: ref6
        bwb_id: BWBR0002320
        artikel: '48'
