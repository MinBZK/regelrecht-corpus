  - number: '62.2'
    text: |-
      Met dezelfde straf wordt gestraft de gezagvoerder, die een van de [artikelen 4][ref1],
      [14, eerste lid onder a en b][ref2], of [17, tweede lid][ref3], overtreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel17
    url: https://wetten.overheid.nl/BWBR0002267/2005-02-04#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '4'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
