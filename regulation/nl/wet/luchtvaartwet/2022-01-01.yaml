  - number: 37aba.1
    text: |-
      De exploitant van een luchtvaartterrein houdt een beveiligingsprogramma als bedoeld in artikel 12 van
      EG-[verordening 300/2008](32008R0300) in stand.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37aba
  - number: 37aba.2
    text: |-
      Het beveiligingsprogramma, bedoeld in het eerste lid, alsmede de wijziging daarvan, behoeft instemming van Onze
      Minister van Justitie en Veiligheid in overeenstemming met Onze Minister. Het programma wordt op hun verzoek, onder
      het stellen van een redelijke termijn, aangepast.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37aba
  - number: 37aba.3
    text: |-
      Met het oog op de afstemming met het crisisplan, bedoeld in [artikel 16 van de Wet veiligheidsregio’s][ref1],
      wordt het bestuur van de veiligheidsregio waarin het luchtvaartterrein is gelegen in de gelegenheid gesteld zijn
      zienswijze te geven over een ontwerp van een programma als bedoeld in het eerste lid of een wijziging van dat
      programma.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37aba
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '16'
  - number: 37aba.4
    text: |-
      De exploitant van een luchtvaartterrein informeert onverwijld en uit eigen beweging Onze Minister van Justitie en
      Veiligheid en Onze Minister indien het beveiligingsprogramma niet kan worden uitgevoerd. Hij verstrekt desgevraagd
      Onze Ministers informatie over de beveiliging van het luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37aba
  - number: 37aba.5
    text: |-
      Indien een onderdeel van het programma niet kan worden uitgevoerd, kan Onze Minister van Justitie en Veiligheid de
      exploitant van een luchtvaartterrein een aanwijzing geven die ertoe strekt zo veel mogelijk het oorspronkelijk in
      het programma aangegeven niveau van beveiliging te benaderen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37aba
  - number: 37abb.1
    text: |-
      De luchtvaartmaatschappij houdt een beveiligingsprogramma als bedoeld in artikel 13 van EG-[verordening 300/2008]
      (32008R0300) in stand.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37abb
  - number: 37abb.2
    text: |-
      Het beveiligingsprogramma van de luchtvaartmaatschappij waarvan de exploitatievergunning in Nederland is verleend
      door Onze Minister, alsmede de wijziging daarvan, behoeft instemming van Onze Minister van Justitie en Veiligheid,
      in overeenstemming met Onze Minister. Het programma wordt op hun verzoek, onder het stellen van een redelijke
      termijn, aangepast.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37abb
  - number: 37abb.3
    text: |-
      Op verzoek van Onze Minister van Justitie en Veiligheid legt de luchtvaartmaatschappij waarvan de
      exploitatievergunning niet in Nederland is verleend door Onze Minister een verklaring over waaruit blijkt
      dat de bevoegde autoriteit van de staat die de exploitatievergunning heeft verleend, heeft ingestemd met het
      beveiligingsprogramma. Indien de luchtvaartmaatschappij niet beschikt over een verklaring als hiervoor bedoeld,
      kan Onze Minister van Justitie en Veiligheid verlangen dat de luchtvaartmaatschappij haar beveiligingsprogramma
      ter instemming voorlegt aan Onze Minister van Justitie en Veiligheid in overeenstemming met Onze Minister. Het
      programma wordt op hun verzoek, onder het stellen van een redelijke termijn, aangepast.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37abb
  - number: 37abb.4
    text: |-
      Onze Minister van Justitie en Veiligheid kan verlangen dat de luchtvaartmaatschappij, niet zijnde een
      communautaire luchtvaartmaatschappij, die een verklaring als bedoeld in het derde lid heeft overgelegd, haar
      beveiligingsprogramma ter instemming voorlegt aan Onze Minister van Justitie en Veiligheid in overeenstemming met
      Onze Minister. Het programma wordt op hun verzoek, onder het stellen van een redelijke termijn, aangepast.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37abb
  - number: 37abb.5
    text: |-
      De luchtvaartmaatschappij informeert onverwijld en uit eigen beweging Onze Minister van Justitie en Veiligheid en
      Onze Minister, indien het beveiligingsprogramma niet kan worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37abb
  - number: 37abb.6
    text: |-
      Indien een onderdeel van het beveiligingsprogramma niet kan worden uitgevoerd, kan Onze Minister van Justitie en
      Veiligheid de luchtvaartmaatschappij een aanwijzing geven die ertoe strekt zo veel mogelijk het oorspronkelijk in
      het programma aangegeven niveau van beveiliging te benaderen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37abb
  - number: 37abc.1
    text: |-
      De entiteit houdt een beveiligingsprogramma als bedoeld in artikel 14 van EG-[verordening 300/2008](32008R0300)
      in stand.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37abc
  - number: 37abc.2
    text: |-
      Op verzoek van Onze Minister van Justitie en Veiligheid, wordt het beveiligingsprogramma, bedoeld in het eerste
      lid, alsmede de wijziging daarvan, aan hem ter instemming voorgelegd. Het programma wordt op zijn verzoek, onder
      het stellen van een redelijke termijn, aangepast.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37abc
  - number: 37abc.3
    text: |-
      De entiteit informeert Onze Minister van Justitie en Veiligheid onverwijld en uit eigen beweging indien het
      programma niet kan worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37abc
  - number: 37abc.4
    text: |-
      Indien een onderdeel van het programma niet kan worden uitgevoerd, kan Onze Minister van Justitie en Veiligheid
      de entiteit een aanwijzing geven die ertoe strekt zo veel mogelijk het oorspronkelijk in het programma aangegeven
      niveau van beveiliging te benaderen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37abc
  - number: 37abd
    text: |-
      Bij regeling van Onze Minister van Justitie en Veiligheid kunnen regels worden gesteld over de inhoud van de
      beveiligingsprogramma’s, genoemd in de [artikelen 37aba][ref1], [37abb][ref2] en [37abc][ref3]. Deze regels kunnen
      betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37aba
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37abb
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel37abc
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37abd
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37aba
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37abb
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 37abc
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
  - number: 37abd.a
    text: |-
      de methoden en procedures die de exploitant van het luchtvaartterrein, de luchtvaartmaatschappij of de
      entiteit dient te volgen om te voldoen aan EG-[verordening 300/2008](32008R0300) en het programma, bedoeld in
      [artikel 37ab, tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ab
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37abd
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37ab
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
  - number: 37abd.b
    text: |-
      de wijze waarop de exploitant van het luchtvaartterrein, de luchtvaartmaatschappij of de entiteit toezicht houdt op
      de naleving van deze methoden en procedures.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37abd
  - number: 37ac.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de uitvoering van de
      bij deze wet voorgeschreven toegangscontrole, beveiligingsonderzoeken, en andere beveiligingscontroles, alsmede
      voor de afhandeling van daarbij geconstateerde onregelmatigheden. Toegangscontroles, beveiligingsonderzoeken en
      andere beveiligingscontroles worden verricht met inachtneming van de door Onze Minister van Justitie en Veiligheid
      gegeven algemene aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ac
  - number: 37ac.2
    text: |-
      Onze Minister van Justitie en Veiligheid kan naar aanleiding van onvoorziene omstandigheden bijzondere aanwijzingen
      geven voor de uitvoering van de toegangscontrole, beveiligingsonderzoeken en andere beveiligingscontroles, bedoeld
      in het eerste lid. In dat geval bepaalt Onze Minister van Justitie en Veiligheid dat de kosten worden vergoed die
      redelijkerwijs zijn gemaakt om de aanwijzing uit te voeren.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ac
  - number: 37ac.3
    text: |-
      Onze Minister van Justitie en Veiligheid kan met inachtneming van artikel 1 van EU-[verordening 1254/2009]
      (32009R1254) vrijstelling verlenen van een of meer gemeenschappelijke basisnormen, genoemd in bijlage I bij
      EG-[verordening 300/2008](32008R0300). De vrijstelling kan onder voorwaarden of beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ac
  - number: 37ac.4
    text: |-
      Onze Minister van Justitie en Veiligheid kan met inachtneming van punt 1.0.3 van de bijlage bij EU-[verordening
      2015/1998](31998R2015) de exploitant van een luchtvaartterrein tijdelijk ontheffing verlenen van een of meer
      gemeenschappelijke basisnormen, genoemd in bijlage I bij EG-[verordening 300/2008](32008R0300). De ontheffing kan
      onder voorwaarden of beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ac
  - number: 37ac.5
    text: 'De vrijstelling of ontheffing, bedoeld in het derde of vierde lid, wordt geschorst of ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ac
  - number: 37ac.5.a
    text: de aan de vrijstelling of ontheffing verbonden voorwaarden of beperkingen niet in acht worden genomen;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ac
  - number: 37ac.5.b
    text: |-
      de vrijstelling of ontheffing in strijd komt met een Europese verordening voor zover deze betrekking heeft op de
      beveiliging van de burgerluchtvaart, of;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ac
  - number: 37ac.5.c
    text: het belang van de beveiliging van de burgerluchtvaart dat vordert.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ac
  - number: 37aca.1
    text: |-
      De ingebruikname van detectieapparatuur ten behoeve van de uitvoering van beveiligingsonderzoek behoeft instemming
      van Onze Minister van Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37aca
  - number: 37aca.2
    text: 'De instemming, bedoeld in het eerste lid, wordt verleend, indien:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37aca
  - number: 37aca.2.a
    text: |-
      de detectieapparatuur voldoet aan de vastgelegde specificaties als bedoeld in punt 12 van bijlage I bij
      EG-[verordening 300/2008](32008R0300) en met het oog op het uit te voeren beveiligingsonderzoek redelijkerwijs als
      passend kan worden beschouwd, en
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37aca
  - number: 37aca.2.b
    text: |-
      het beoogde gebruik van de detectieapparatuur niet in strijd komt met de regels en aanwijzingen, bedoeld in
      [artikel 37ac, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ac
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37aca
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37ac
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
  - number: 37aca.3
    text: |-
      Bij regeling van Onze Minister van Justitie en Veiligheid kunnen nadere regels worden gesteld omtrent de procedure
      tot instemming.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37aca
  - number: 37aca.4
    text: |-
      Onze Minister van Justitie en Veiligheid kan de instemming, bedoeld in het tweede lid, schorsen of intrekken,
      indien:
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37aca
  - number: 37aca.4.a
    text: |-
      de apparatuur die wordt gebruikt niet langer voldoet aan de vastgelegde specificaties als bedoeld in punt 12 van
      bijlage I bij EG-[verordening 300/2008](32008R0300) of niet langer redelijkerwijs als passend kan worden beschouwd
      met het oog op het uit te voeren beveiligingsonderzoek, of
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37aca
  - number: 37aca.4.b
    text: |-
      het gebruik van de detectieapparatuur in strijd komt met de regels of aanwijzingen, bedoeld in
      [artikel 37ac, eerste lid en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ac
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37aca
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37ac
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
  - number: 37acb.1
    text: |-
      De ingebruikname van explosievenspeurhonden ten behoeve van de uitvoering van beveiligingsonderzoek behoeft
      instemming van Onze Minister van Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37acb
  - number: 37acb.2
    text: 'De instemming, bedoeld in het eerste lid, wordt verleend, indien:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37acb
  - number: 37acb.2.a
    text: |-
      de explosievenspeurhond en zijn begeleider met succes de relevante opleiding op het gebied van de beveiliging van
      de burgerluchtvaart hebben doorlopen, en
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37acb
  - number: 37acb.2.b
    text: |-
      vastgesteld is dat de explosievenspeurhond en zijn begeleider voldoen aan de bij of krachtens EU-[verordening
      2015/1998](31998R2015) vastgestelde prestatievereisten.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37acb
  - number: 37acb.3
    text: De instemming geldt voor een bij algemene maatregel van bestuur te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37acb
  - number: 37acb.4
    text: Bij regeling van Onze Minister van kunnen nadere regels worden gesteld omtrent de procedure tot instemming.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37acb
  - number: 37acb.5
    text: |-
      Onze Minister van Justitie en Veiligheid kan de exploitant van een luchtvaartterrein, de luchtvaartmaatschappij
      of de entiteit een aanwijzing geven inzake de inzet van explosievenspeurhonden, indien deze speurhonden,
      of de inzet daarvan, redelijkerwijs niet als passend kan worden beschouwd met het oog op het uit te voeren
      beveiligingsonderzoek.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37acb
  - number: 37acb.6
    text: |-
      Voor het in behandeling nemen van een aanvraag om instemming met de ingebruikname van explosievenspeurhonden kan
      Onze Minister van Justitie en Veiligheid een vergoeding van kosten verlangen. De kostenvergoeding is niet hoger dan
      een bij ministeriële regeling van Onze Minister van Justitie en Veiligheid vast te stellen bedrag.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37acb
  - number: 37ad.1
    text: |-
      Onze Minister van Justitie en Veiligheid kan op grond van omstandigheden of inlichtingen vaststellen, dat er
      voor een luchtvaartterrein dan wel bepaalde daar aanwezige luchtvaartuigen, een bijzonder gevaar bestaat dat
      zij het object van geweldpleging, aanslagen of bedreiging zullen vormen. Hij geeft hiervan onverwijld kennis
      aan de exploitant van dat luchtvaartterrein en, in voorkomend geval, aan de luchtvaartmaatschappij van die
      luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ad
  - number: 37ad.2
    text: |-
      Na toepassing van het eerste lid worden geen goederen aan boord van de betrokken luchtvaartuigen gebracht dan na,
      zonodig stuksgewijs, onderzoek op de aanwezigheid van verboden voorwerpen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ad
  - number: 37ad.3
    text: |-
      Onze Minister van Justitie en Veiligheid kan in andere dan de in het eerste lid bedoelde gevallen, luchtvaartuigen
      aanwijzen waarop het tweede lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ad
  - number: 37ada.1
    text: |-
      Ter beveiliging van de burgerluchtvaart kan Onze Minister van Justitie en Veiligheid vluchten van een
      luchtvaartmaatschappij aanwijzen waarop ambtenaren van de Koninklijke marechaussee worden ingezet.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ada
  - number: 37ada.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld ten aanzien van het bepaalde in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ada
  - number: 37ada.3
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Justitie en Veiligheid, ter uitvoering van
      EG-[verordening 300/2008](32008R0300) regels stellen over beveiligingsmaatregelen tijdens de vlucht.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ada
  - number: 37ae.1
    text: |-
      Indien de naleving van de bij of krachtens deze afdeling gestelde voorschriften of van een verplichting
      die voortvloeit uit een Europese verordening voor zover deze betrekking heeft op de beveiliging van
      de burgerluchtvaart, gevaar dreigt te lopen, doet de betrokken exploitant van een luchtvaartterrein,
      luchtvaartmaatschappij of entiteit daarvan onverwijld mededeling aan de commandant van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ae
  - number: 37ae.2
    text: |-
      Bij wijze van bestuursdwang kan Onze Minister van Justitie en Veiligheid het opstijgen van een luchtvaartuig
      verbieden en beletten indien er een redelijk vermoeden bestaat dat wegens het niet naleven van de bij of krachtens
      deze afdeling gestelde voorschriften of van een verplichting die voortvloeit uit een Europese verordening voor
      zover deze betrekking heeft op de beveiliging van de burgerluchtvaart, de beveiliging van de burgerluchtvaart in
      gevaar kan komen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ae
  - number: 37ae.3
    text: |-
      Onze Minister van Justitie en Veiligheid kan de bevoegdheid, bedoeld in het tweede lid, mandateren aan de
      commandant van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ae
  - number: 37b.1
    text: |-
      Overeenkomstig punt 1.1 van bijlage I bij EG-[verordening 300/2008](32008R0300), verdeelt de exploitant van een
      luchtvaartterrein het luchtvaartterrein in:
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.1.a
    text: een landzijde;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.1.b
    text: een luchtzijde;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.1.c
    text: om beveiligingsredenen beperkt toegankelijke zones;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.1.d
    text: kritieke delen van om beveiligingsredenen beperkt toegankelijke zones.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.2
    text: |-
      Onze Minister van Justitie en Veiligheid, in overeenstemming met Onze Minister, kan delen van het luchtvaartterrein
      aanwijzen die in ieder geval tot een van de in het eerste lid bedoelde delen behoren.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.3
    text: |-
      Overeenkomstig de punten 1.2.1, 1.2.2, 1.2.3, 1.3, 1.4 en 1.5 van bijlage I bij EG-[verordening 300/2008]
      (32008R0300), draagt de exploitant van een luchtvaartterrein ervoor zorg:
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.3.a
    text: |-
      dat personen die toegang hebben tot de in het eerste lid, onder b, c en d bedoelde delen een door hem
      verstrekt of erkend toegangsbewijs dragen en dit toegangsbewijs op verzoek ter controle voorleggen aan het
      beveiligingspersoneel;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.3.b
    text: |-
      dat voertuigen die toegang hebben tot de in het eerste lid, onder b, c en d bedoelde delen voorzien zijn van een
      door hem verstrekt toegangsbewijs dat op een duidelijk zichtbare plaats in het voertuig aanwezig is;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.3.c
    text: |-
      dat alle personen en voertuigen die zich begeven in de in het eerste lid, onder b, c en d bedoelde delen aan een
      toegangscontrole worden onderworpen;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.3.d
    text: |-
      dat personen anders dan passagiers die zich begeven in de in het eerste lid, onder c, bedoelde deel, alsmede de
      voorwerpen die zij bij zich dragen, door middel van voortdurende steekproeven aan een beveiligingsonderzoek worden
      onderworpen;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.3.e
    text: |-
      dat alle personen anders dan passagiers die zich begeven in het in het eerste lid, onder d, bedoelde deel, alsmede
      de voorwerpen die zij bij zich dragen, aan een beveiligingsonderzoek worden onderworpen;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.3.f
    text: |-
      dat alle voertuigen die zich begeven in de in het eerste lid, onder c en d, bedoelde delen worden onderworpen aan
      een voertuigonderzoek;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.3.g
    text: |-
      dat het beveiligingspersoneel, bedoeld in [artikel 37a, tweede lid, onderdeel h, sub 1][ref1], op onvoorspelbare en
      op risico gebaseerde wijze patrouilles uitvoert op het luchtvaartterrein.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37a
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
  - number: 37b.4
    text: |-
      Overeenkomstig punt 1.2.4 van bijlage I bij EG-[verordening 300/2008](32008R0300), dragen de exploitant van een
      luchtvaartterrein en de luchtvaartmaatschappij ervoor zorg dat personen anders dan passagiers met succes een
      achtergrondcontrole hebben doorlopen, alvorens hen een toegangsbewijs wordt verstrekt dat onbegeleid toegang biedt
      tot de delen van het luchtvaarterrein, bedoeld in het eerste lid, onderdeel c en d.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.5
    text: |-
      Een ieder die toegang zoekt tot of zich bevindt op de plaatsen, bedoeld in het eerste lid, onder c en d, gedoogt
      dat vanwege de exploitant van een luchtvaartterrein onderzoek plaatsvindt aan zijn kleding, van voorwerpen die hij
      bij zich heeft of van het voertuig dat hij gebruikt.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37b.6
    text: |-
      De exploitant van een luchtvaartterrein draagt er zorg voor, dat personen die niet voldoen aan het vijfde lid, de
      verdere toegang tot de in het eerste lid, onder c en d, bedoelde delen van het luchtvaartterrein wordt ontzegd.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37b
  - number: 37c.1
    text: |-
      Overeenkomstig punt 9 van bijlage I bij EG-[verordening 300/2008](32008R0300), draagt de exploitant van een
      luchtvaartterrein ervoor zorg dat luchthavenbenodigdheden die in een deel van het luchtvaartterrein, als bedoeld
      in [artikel 37b, eerste lid, onder c of d][ref1], worden binnengebracht, aan een beveiligingsonderzoek door het
      beveiligingspersoneel of de vereiste beveiligingscontroles zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37b
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: 3A
  - number: 37c.2
    text: |-
      Indien bij het beveiligingsonderzoek, bedoeld in het eerste lid, verboden voorwerpen worden aangetroffen, of
      de uitvoering van het onderzoek in gevaar komt, doet de exploitant van het luchtvaartterrein daarvan onverwijld
      mededeling aan de commandant van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37c
  - number: 37d.1
    text: 'De exploitant van een luchtvaartterrein richt de luchthaven zodanig in, en treft zodanige voorzieningen dat:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37d
  - number: 37d.1.a
    text: een plaats beschikbaar is voor het afzonderen van een luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37d
  - number: 37d.1.b
    text: |-
      het beveiligingspersoneel snel en op eenvoudige wijze de verschillende delen van het luchtvaartterrein kan bereiken
      en toezicht kan houden op de daar aanwezige personen;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37d
  - number: 37d.1.c
    text: |-
      redelijkerwijze wordt voorkomen dat onbevoegden de in [artikel 37b, eerste lid, onder b, c en d][ref1] bedoelde
      delen betreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37d
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37b
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: 3A
  - number: 37d.2
    text: 'De exploitant van het luchtvaartterrein beschikt over:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37d
  - number: 37d.2.a
    text: |-
      voldoende en passende detectieapparatuur voor de uitvoering van de beveiligingsonderzoeken, genoemd in de
      [artikelen 37b, derde lid][ref1], [37c][ref2] en [37f][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37c
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37d
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37b
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37c
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: 3A
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37d.2.b
    text: |-
      een ruimte voor vertrekkende passagiers die zodanig is ingericht dat gecontroleerde passagiers en handbagage zijn
      afgeschermd en een vermenging met niet gecontroleerde personen en voorwerpen niet mogelijk is;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37d
  - number: 37d.2.c
    text: een ruimte voor onderzoek van handbagage, ruimbagage en dieren bestemd voor vervoer in een luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37d
  - number: 37d.2.d
    text: een afsluitbare en beveiligde ruimte bestemd voor het bewaren van verdachte handbagage en ruimbagage.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37d
  - number: 37d.3
    text: |-
      Onze Minister van Justitie en Veiligheid kan, in overeenstemming met Onze Minister, nadere regels stellen met
      betrekking tot de voorzieningen die zijn vereist ter beveiliging van de burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37d
  - number: 37e.1
    text: |-
      Overeenkomstig punt 3.1 en 3.2 van bijlage I bij EG-[verordening 300/2008](32008R0300), draagt de
      luchtvaartmaatschappij ervoor zorg dat een door haar geëxploiteerd luchtvaartuig:
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37e
  - number: 37e.1.a
    text: voor vertrek is onderworpen aan een beveiligingscontrole of een beveiligingsdoorzoeking van vliegtuigen, en
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37e
  - number: 37e.1.b
    text: is beschermd tegen manipulatie en betreding door onbevoegden.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37e
  - number: 37e.2
    text: |-
      Met inachtneming van EG-[verordening 300/2008](32008R0300), kan Onze Minister van Justitie en Veiligheid voor
      bepaalde vluchten of luchtvaartuigen vrijstelling verlenen van het eerste lid, onder a, indien de dreiging voor
      deze vluchten of luchtvaartuigen als gevolg van verboden voorwerpen verwaarloosbaar is. Onze Minister van Justitie
      en Veiligheid geeft in dat geval aanwijzingen over vervangende maatregelen. [Artikel 37ac, vijfde lid][ref1], is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ac
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37e
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37ac
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
  - number: 37f.1
    text: |-
      Overeenkomstig punten 4.1.1, 4.2.1, 5.1.1 en 5.2 van bijlage I bij EG-[verordening 300/2008](32008R0300), draagt
      de exploitant van een luchtvaartterrein ervoor zorg dat alle passagiers die aan boord gaan van een luchtvaartuig,
      alsmede hun handbagage en ruimbagage:
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37f
  - number: 37f.1.a
    text: door het beveiligingspersoneel aan een beveiligingsonderzoek zijn onderworpen, en
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37f
  - number: 37f.1.b
    text: beschermd zijn tegen manipulatie door onbevoegden.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37f
  - number: 37f.2
    text: |-
      De exploitant van een luchtvaartterrein kan de personen die anders dan als passagier aan boord kunnen gaan van een
      luchtvaartuig door het beveiligingspersoneel doen controleren op hun identiteit.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37f
  - number: 37f.3
    text: |-
      Indien bij het beveiligingsonderzoek verboden voorwerpen worden aangetroffen of de uitvoering van het
      beveiligingsonderzoek in gevaar komt, doet de exploitant van een luchtvaartterrein daarvan onverwijld mededeling
      aan de commandant van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37f
  - number: 37g.1
    text: |-
      Overeenkomstig punt 5.3 van bijlage I bij EG-[verordening 300/2008](32008R0300) draagt de luchtvaartmaatschappij
      ervoor zorg dat:
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37g
  - number: 37g.1.a
    text: |-
      alle voor vervoer in een door haar geëxploiteerd luchtvaartuig aangeboden ruimbagage wordt geïdentificeerd als
      zijnde begeleid of onbegeleid, en
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37g
  - number: 37g.1.b
    text: |-
      onbegeleide ruimbagage niet wordt vervoerd, tenzij die bagage van de passagier is gescheiden door factoren waarover
      de passagier geen controle heeft of de bagage aan passende beveiligingscontroles is onderworpen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37g
  - number: 37g.2
    text: |-
      [Artikel 37f, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37g
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37h.1
    text: |-
      Het beveiligingsonderzoek van passagiers en hun handbagage, bedoeld in
      [artikel 37f, eerste lid, onderdeel a][ref1], omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37h.1.a
    text: een onderzoek met behulp van daartoe bestemde detectieapparatuur van passagiers en handbagage;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
  - number: 37h.1.b
    text: |-
      steekproefsgewijs, en indien de detectieapparatuur daartoe aanleiding geeft, een onderzoek van passagiers aan hun
      kleding en een nader onderzoek van hun handbagage;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
  - number: 37h.1.c
    text: |-
      de stelselmatige uitvoering van het onderzoek aan kleding van passagiers en van handbagage in door Onze Minister
      van Justitie en Veiligheid bij ministeriële regeling te bepalen gevallen;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
  - number: 37h.1.d
    text: |-
      een bevraging van de passagiers met het oog op hun betrouwbaarheid in door Onze Minister van Justitie en Veiligheid
      bij ministeriële regeling te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
  - number: 37h.2
    text: |-
      Het beveiligingsonderzoek van ruimbagage, bedoeld in [artikel 37f, eerste lid, onderdeel a][ref1], omvat in ieder
      geval:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37h.2.a
    text: een onderzoek met behulp van daartoe bestemde detectieapparatuur of andere technische hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
  - number: 37h.2.b
    text: een nader onderzoek naar de inhoud van de bagage indien daartoe aanleiding is.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
  - number: 37h.3
    text: |-
      Het beveiligingsonderzoek van personen anders dan passagiers en de voorwerpen die zij bij zich dragen, bedoeld in
      [artikel 37b, derde lid, onderdeel d en e][ref1], kan omvatten:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37b
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: 3A
  - number: 37h.3.a
    text: een nader onderzoek van het toegangsbewijs waarover de betrokkene beschikt;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
  - number: 37h.3.b
    text: een onderzoek met behulp van daartoe bestemde detectieapparatuur;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
  - number: 37h.3.c
    text: een onderzoek, indien daartoe aanleiding is, van meegevoerde voorwerpen en aan de kleding.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
  - number: 37h.4
    text: |-
      Het beveiligingsonderzoek, bedoeld in de [artikelen 37c, eerste lid][ref1], [37k][ref2] en [37l, eerste lid][ref3],
      omvat in ieder geval een visueel uitwendig beveiligingsonderzoek van de luchthavenbenodigdheden, bedrijfspost, het
      bedrijfsmateriaal, de vluchtbenodigdheden of hun verpakking.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37c
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37k
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel37l
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37c
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37k
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 37l
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37h.5
    text: |-
      Met inachtneming van EG-[verordening 300/2008](32008R0300), kan Onze Minister van Justitie en Veiligheid, in
      overeenstemming met Onze Minister, ten aanzien van bepaalde categorieën personen, ruimbagage of handbagage
      vrijstelling verlenen van een beveiligingsonderzoek als bedoeld in het eerste, tweede of derde lid. Daarbij kunnen
      aanwijzingen voor vervangende maatregelen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
  - number: 37h.6
    text: |-
      Onze Minister van Justitie en Veiligheid kan in bijzondere gevallen op de grond, bedoeld in het vijfde lid,
      ontheffing verlenen van het beveiligingsonderzoek.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37h
  - number: 37ha.1
    text: |-
      Een lid van het beveiligingspersoneel belast met de controle, dat de beschikking krijgt over gegevens waarvan hij
      het vertrouwelijk karakter kent of redelijkerwijze moet vermoeden, en voor wie niet reeds uit hoofde van ambt of
      wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot geheimhouding
      daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn taak de
      noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ha
  - number: 37ha.2
    text: |-
      Een gelijke verplichting bestaat voor degene die anders dan bedoeld in het eerste lid ten
      behoeve van de beveiliging van de burgerluchtvaart een vertrouwensfunctie als bedoeld in
      [artikel 3 van de Wet veiligheidsonderzoeken][ref1] vervult.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel3
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ha
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '3'
  - number: 37hb
    text: 'De exploitant van een luchtvaartterrein doet:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37hb
  - number: 37hb.a
    text: |-
      personen die weigeren medewerking te verlenen aan het beveiligingsonderzoek, bedoeld in
      [artikel 37b, derde lid, onder d en e][ref1], [37f, eerste lid, onder a][ref2] en [37g, eerste lid, onder a][ref3],
      verhinderen enig luchtvaartuig te betreden, hen de verdere toegang tot de in artikel 37b, eerste lid, onder c en d,
      bedoelde delen ontzeggen en hen daaruit zo nodig te verwijderen;


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel37g
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37hb
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37b
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
      - id: ref3
        bwb_id: BWBR0002267
        artikel: 37g
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37hb.b
    text: |-
      bij het beveiligingsonderzoek, bedoeld in [artikel 37f][ref1] en [37g, eerste lid, onder a][ref2], aangetroffen
      verboden voorwerpen, niet dan in overeenstemming met door Onze Minister van Justitie en Veiligheid te stellen
      regels of te geven aanwijzingen, aan boord van een luchtvaartuig brengen, en;


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37g
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37hb
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37g
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37hb.c
    text: |-
      de maatregelen als bedoeld in onderdeel a, treffen jegens degene bij wie of in wiens handbagage of ruimbagage
      verboden voorwerpen worden aangetroffen, indien deze niet overeenkomstig de regels of aanwijzingen als bedoeld in
      onderdeel b, op verzoek van het beveiligingspersoneel zijn afgegeven.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37hb
  - number: 37hc
    text: 'De personen die aan boord gaan van een luchtvaartuig, zijn verplicht:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37hc
  - number: 37hc.a
    text: |-
      zich te onderwerpen aan een beveiligingsonderzoek als bedoeld in [artikel 37f, eerste lid, onder a][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37f
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37hc
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37f
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37hc.b
    text: |-
      medewerking te verlenen aan de handelingen ter uitvoering van de verplichting, bedoeld in
      [artikel 37hb, onderdeel a tot en met c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37hb
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37hc
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37hb
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: 37hd
    text: |-
      De bepalingen in deze paragraaf laten onverlet dat de exploitant van een luchtvaartterrein op verzoek van een
      luchtvaartmaatschappij of een buitenlandse overheid een verdergaande controle kan uitvoeren, indien dit in de
      vervoersovereenkomst tussen de passagier en de luchtvaartmaatschappij wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37hd
  - number: 37j.1
    text: |-
      Overeenkomstig punt 6.1.1 van bijlage I bij EG-[verordening 300/2008](32008R0300), draagt de luchtvaartmaatschappij
      ervoor zorg dat alle vracht en post die in een door haar geëxploiteerd luchtvaartuig wordt geladen aan een
      beveiligingsonderzoek of de vereiste beveiligingscontroles is onderworpen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37j
  - number: 37j.2
    text: |-
      Overeenkomstig punt 6.2.1 en 6.2.2 van bijlage I bij EG-[verordening 300/2008](32008R0300), draagt de
      luchtvaartmaatschappij ervoor zorg dat vracht en post die, nadat de vereiste beveiligingscontroles zijn uitgevoerd,
      niet afdoende is beschermd tegen manipulatie door onbevoegden of tekenen van manipulatie vertoont, aan een
      beveiligingsonderzoek is onderworpen alvorens in een door haar geëxploiteerd luchtvaartuig te worden geladen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37j
  - number: 37j.3
    text: |-
      Onverminderd [artikel 6.51 van de Wet luchtvaart][ref1], worden samengestelde en explosieve en brandgevaarlijke
      apparaten die niet overeenkomstig bij regeling van Onze Minister van Justitie en Veiligheid vastgestelde
      veiligheidsvoorschriften worden vervoerd als verboden voorwerpen in vracht- en postzendingen beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37j
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
  - number: 37j.4
    text: |-
      Indien bij het beveiligingsonderzoek, bedoeld in het eerste of tweede lid, verboden voorwerpen worden aangetroffen,
      of de uitvoering van het beveiligingsonderzoek in gevaar komt, doet de luchtvaartmaatschappij of erkend agent
      daarvan onverwijld mededeling aan de commandant van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37j
  - number: 37k.1
    text: |-
      Overeenkomstig punt 7 van bijlage I bij EG-[verordening 300/2008](32008R0300), draagt de luchtvaartmaatschappij
      ervoor zorg dat bedrijfspost en bedrijfsmateriaal die in een door haar geëxploiteerd luchtvaartuig wordt vervoerd
      aan de vereiste beveiligingscontroles is onderworpen en vervolgens is beschermd tegen manipulatie door onbevoegden
      tot ze in het luchtvaartuig is geladen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37k
  - number: 37k.2
    text: |-
      [Artikel 37j, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37j
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37k
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37j
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37l.1
    text: |-
      Overeenkomstig punt 8 van bijlage I bij EG-[verordening 300/2008](32008R0300), draagt de luchtvaartmaatschappij
      ervoor zorg dat vluchtbenodigdheden die in een door haar geëxploiteerd luchtvaartuig worden vervoerd aan de
      vereiste beveiligingscontroles zijn onderworpen en vervolgens zijn beschermd tegen manipulatie door onbevoegden tot
      ze in het luchtvaartuig zijn geladen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37l
  - number: 37l.2
    text: |-
      [Artikel 37j, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37j
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37l
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37j
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
  - number: 37m.1
    text: |-
      Aan de luchtvaartmaatschappij voor vervoer toevertrouwde brieven worden zonder goedvinden van de afzender of van
      de geadresseerde slechts geopend indien de rechter-commissaris in de rechtbank van het arrondissement waarbinnen de
      brief is aangetroffen, daartoe, op verzoek van de luchtvaartmaatschappij, bevel heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37m
  - number: 37m.2
    text: |-
      Het bevel, bedoeld in het eerste lid, wordt slechts gegeven indien het vermoeden bestaat dat zich in de brief
      verboden voorwerpen bevinden.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37m
  - number: 37n.1
    text: |-
      Met inachtneming van EG-[verordening 300/2008](32008R0300), kan Onze Minister van Justitie en Veiligheid, ten
      aanzien van bepaalde categorieën vracht of post vrijstelling verlenen van het beveiligingsonderzoek, bedoeld in
      [artikel 37j, eerste lid][ref1]. Onze Minister van Justitie en Veiligheid kan in dat geval aanwijzingen geven over
      vervangende maatregelen. [Artikel 37ac, vijfde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37j
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37ac
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37n
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37j
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37ac
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
  - number: 37n.2
    text: |-
      Met inachtneming van EG-[verordening 300/2008](32008R0300), kan Onze Minister van Justitie en Veiligheid in
      bijzondere gevallen ontheffing verlenen van het beveiligingsonderzoek, bedoeld in [artikel 37j, eerste lid][ref1].
      [Artikel 37ac, vijfde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37j
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37ac
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37n
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37j
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37ac
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
  - number: 37o.1
    text: |-
      Overeenkomstig EG-[verordening 300/2008](32008R0300), kan Onze Minister van Justitie en Veiligheid de volgende
      erkenningen verlenen of intrekken:
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37o
  - number: 37o.1.a
    text: een erkenning als erkend agent;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37o
  - number: 37o.1.b
    text: een erkenning als bekende afzender;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37o
  - number: 37o.1.c
    text: een erkenning als erkend leverancier van vluchtbenodigdheden;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37o
  - number: 37o.1.d
    text: een erkenning als EU-luchtvaartbeveiligingsvalidateur;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37o
  - number: 37o.1.e
    text: |-
      een andere erkenning die op grond van EU-[verordening 2015/1998](31998R2015) door de bevoegde autoriteit wordt
      verleend en ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37o
  - number: 37o.2
    text: |-
      Overeenkomstig EG-[verordening 300/2008](32008R0300), kan Onze Minister van Justitie en Veiligheid een
      luchtvaartmaatschappij een erkenning verlenen als ACC3-luchtvaartmaatschappij.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37o
  - number: 37o.3
    text: |-
      De erkenningen, genoemd in het eerste en tweede lid, gelden voor een bij algemene maatregel van bestuur te bepalen
      termijn.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37o
  - number: 37o.4
    text: |-
      Onze Minister van Justitie en Veiligheid kan de uitoefening van de in het eerste en tweede lid genoemde
      bevoegdheden mandateren aan de commandant van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37o
  - number: 37o.5
    text: |-
      Bij regeling van Onze Minister van Justitie en Veiligheid kunnen nadere regels worden gesteld over de verlening van
      een erkenning, als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37o
  - number: 37p.1
    text: |-
      De Minister van Justitie en Veiligheid is verantwoordelijk voor het in overeenstemming met EG-[verordening
      300/2008](32008R0300) en op behoorlijke en zorgvuldige wijze bijhouden van de EU-gegevensbank betreffende de
      beveiliging van de toeleveringsketen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37p
  - number: 37p.2
    text: |-
      De commandant van de Koninklijke marechaussee verricht onder verantwoordelijkheid van Onze Minister van Justitie
      en Veiligheid de inschrijving in de gegevensbank, bedoeld in het eerste lid, alsmede de wijziging en doorhaling van
      inschrijvingen. Onze Minister van Justitie en Veiligheid kan daartoe aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37p
  - number: 37p.3
    text: |-
      Bij regeling van Onze Minister van Justitie en Veiligheid kunnen nadere regels worden gesteld over de inschrijving
      in de gegevensbank, bedoeld in het eerste lid, en over de doorhaling of wijziging van inschrijvingen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37p
  - number: 37q.1
    text: |-
      In verband met de taakuitoefening, bedoeld in [artikel 37o, eerste en tweede lid][ref1], kan Onze Minister van
      Justitie en Veiligheid onderzoek doen naar de betrouwbaarheid van personen werkzaam voor de aanvrager van een
      erkenning, als bedoeld in artikel 37o, eerste en tweede lid en voor de houder van een erkenning, als bedoeld
      in artikel 37o, eerste lid. Hij kan daartoe inlichtingen en inzage van zakelijke gegevens en bescheiden vragen
      alsmede kopieën daarvan maken, alsmede politiegegevens raadplegen overeenkomstig het bepaalde bij of krachtens
      de [Wet politiegegevens][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37o
      [ref2]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37q
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37o
        hoofdstuk: IV
        paragraaf: '4'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0022463
  - number: 37q.2
    text: |-
      Onze Minister van Justitie en Veiligheid kan de bevoegdheid, bedoeld in het eerste lid, mandateren aan de
      commandant van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37q
  - number: 37r
    text: |-
      De erkend agent, de bekende afzender en de vaste afzender passen ten aanzien van de door hen behandelde vracht of
      post de in hoofdstuk 6.3.2, 6.4.2, 6.6.1 en 6.6.2 van EU-[verordening 2015/1998](31998R2015) en in hoofdstuk 6.7
      van Uitvoeringsbesluit C(2015) 8005 van de Commissie gespecificeerde beveiligingscontroles toe.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37r
  - number: 37ra.1
    text: |-
      Overeenkomstig punt 11.1 van bijlage I bij EG-[verordening 300/2008](32008R0300), dragen exploitanten van
      luchtvaartterreinen, luchtvaartmaatschappijen en entiteiten ervoor zorg dat de volgende personen worden
      geworven, opgeleid en, in voorkomend geval, gecertificeerd, teneinde te garanderen dat ze geschikt zijn voor hun
      werkzaamheden en bevoegd zijn om de hen toegewezen taken uit te voeren:
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ra
  - number: 37ra.1.a
    text: |-
      personen die beveiligingsonderzoeken, toegangscontroles of andere beveiligingscontroles uitvoeren, of
      verantwoordelijk zijn voor de uitvoering ervan, en
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ra
  - number: 37ra.1.b
    text: |-
      personen die toegang hebben tot identificeerbare luchtvracht, luchtpost, vluchtbenodigdheden, of
      luchthavenbenodigdheden.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ra
  - number: 37ra.2
    text: |-
      Overeenkomstig punt 11.2 van bijlage I bij EG-[verordening 300/2008](32008R0300), dragen de exploitant van een
      luchtvaartterrein en de luchtvaartmaatschappij ervoor zorg dat personen anders dan passagiers, met uitzondering van
      het beveiligingspersoneel, bedoeld in [artikel 37a, tweede lid, onder h, sub 2][ref1], een beveiligingsopleiding
      hebben gevolgd, alvorens hen een toegangsbewijs wordt verstrekt dat onbegeleid toegang biedt tot de delen van het
      luchtvaarterrein, bedoeld in [artikel 37b, eerste lid, onder c en d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ra
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37a
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 37b
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: 3A
  - number: 37ra.3
    text: |-
      De in het eerste en tweede lid bedoelde opleiding op het gebied van de beveiliging van de burgerluchtvaart omvat
      een basisopleiding en geregelde herhalingsopleiding. De frequentie van deze herhalingsopleiding wordt bij regeling
      van Onze Minister van Justitie en Veiligheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ra
  - number: 37rb
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen eisen worden gesteld aan de organisatie en het bestuur van
      opleidingsinstellingen. Deze eisen kunnen in ieder geval betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rb
  - number: 37rb.a
    text: de rechtsvorm van de opleidingsinstelling;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rb
  - number: 37rb.b
    text: de bekwaamheid en betrouwbaarheid van het bestuur van de opleidingsinstelling.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rb
  - number: 37rc.1
    text: |-
      Het opleidingsprogramma van een opleiding, als bedoeld in [artikel 37ra, eerste en tweede lid][ref1], alsmede de
      wijziging daarvan, behoeft instemming van Onze Minister van Justitie en Veiligheid. De instemming wordt verleend,
      indien het opleidingsprogramma aan bij of krachtens algemene maatregel van bestuur gestelde eisen voldoet. Deze
      eisen kunnen betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ra
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rc
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37ra
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: 3A
  - number: 37rc.1.a
    text: de inhoud van de opleiding;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rc
  - number: 37rc.1.b
    text: de duur en inrichting van de opleiding;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rc
  - number: 37rc.1.c
    text: de bekwaamheid en betrouwbaarheid van de instructeurs;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rc
  - number: 37rc.1.d
    text: de examens en de rechtsbescherming van de cursisten.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rc
  - number: 37rc.2
    text: |-
      De instemming wordt geweigerd, indien de opleidingsinstelling niet voldoet aan de eisen, bedoeld in
      [artikel 37rb][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37rb
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rc
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37rb
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: 3A
  - number: 37rc.3
    text: 'De instemming wordt geschorst of ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rc
  - number: 37rc.3.a
    text: het opleidingsprogramma niet langer voldoet aan de eisen, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rc
  - number: 37rc.3.b
    text: |-
      de opleidingsinstelling niet langer voldoet aan de eisen, bedoeld in [artikel 37rb][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37rb
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rc
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37rb
        hoofdstuk: IV
        paragraaf: '5'
        afdeling: 3A
  - number: 37rc.4
    text: |-
      Bij regeling van Onze Minister van Justitie en Veiligheid kunnen regels worden gesteld over de procedure tot
      instemming met het opleidingsprogramma.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rc
  - number: 37rd.1
    text: |-
      Beveiligingstaken die op grond van EG-[verordening 300/2008](32008R0300) slechts mogen worden uitgevoerd door
      gecertificeerd personeel, worden uitgevoerd door personen ten aanzien waarvan door Onze Minister van Justitie en
      Veiligheid is vastgesteld dat zij voldoen aan de eisen van bekwaamheid die noodzakelijk zijn voor de uitvoering van
      deze taken.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rd
  - number: 37rd.2
    text: |-
      De krachtens het eerste lid verleende erkenning geldt voor een bij algemene maatregel van bestuur te bepalen
      termijn.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rd
  - number: 37rd.3
    text: |-
      Onze Minister van Justitie en Veiligheid kan de uitoefening van de in het eerste en tweede lid bedoelde
      bevoegdheden mandateren aan de commandant van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rd
  - number: 37rd.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de bekwaamheid die noodzakelijk is
      voor de uitoefening van de in het eerste lid bedoelde beveiligingstaken en de wijze waarop deze bekwaamheid wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rd
  - number: 37re.1
    text: |-
      Opleidingen die op grond van EG-[verordening 300/2008](32008R0300) slechts mogen worden verzorgd door
      gecertificeerde instructeurs, worden gegeven door personen ten aanzien waarvan door Onze Minister van Justitie
      en Veiligheid is vastgesteld dat zij beschikken over de bekwaamheid en betrouwbaarheid die noodzakelijk is om de
      desbetreffende opleiding te kunnen verzorgen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37re
  - number: 37re.2
    text: |-
      Onze Minister van Justitie en Veiligheid kan de uitoefening van de in het eerste lid bedoelde bevoegdheid
      mandateren aan de commandant van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37re
  - number: 37re.3
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37re
  - number: 37re.3.a
    text: |-
      de bekwaamheid en betrouwbaarheid die noodzakelijk is voor het geven van de opleidingen, bedoeld in het eerste lid,
      en de wijze waarop deze bekwaamheid en betrouwbaarheid wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37re
  - number: 37re.3.b
    text: de geldigheidsduur van de krachtens het eerste lid verleende erkenning.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37re
  - number: 37rf.1
    text: |-
      Indien op grond van EG-[verordening 300/2008](32008R0300) is vereist dat een persoon met succes een
      achtergrondcontrole heeft ondergaan, dient de betrokkene een verklaring omtrent het gedrag, als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1], te kunnen overleggen, tenzij de betrokkene
      beschikt over een verklaring waaruit blijkt dat diens betrouwbaarheid en geschiktheid reeds is vastgesteld op basis
      van een achtergrondcontrole anders dan op grond van artikel 28 van de Wet justitiële en strafvorderlijke gegevens
      die in ieder geval bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rf
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 37rf.1.a
    text: het vaststellen van de identiteit van de betrokkene aan de hand van een geldig identiteitsbewijs, en
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rf
  - number: 37rf.1.b
    text: een controle van de justitiële documentatie ten aanzien van de betrokkene over tenminste de afgelopen vijf jaar.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rf
  - number: 37rf.2
    text: De verklaring, bedoeld in het eerste lid, geldt voor een bij algemene maatregel van bestuur te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rf
  - number: 37rf.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing, indien de betrokkene een functie vervult
      die overeenkomstig [artikel 3 van de Wet veiligheidsonderzoeken][ref1] is aangewezen als
      vertrouwensfunctie. In dat geval dient ten behoeve van de betrokkene een verklaring als bedoeld
      in[ artikel 1, eerste lid, onder b, van de Wet veiligheidsonderzoeken][ref2] te zijn afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rf
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '1'
  - number: 37rf.4
    text: |-
      De exploitant van een luchtvaartterrein, de luchtvaartmaatschappij en de entiteit dragen ervoor zorg dat personen
      ten aanzien waarvan op grond van EG-[verordening 300/2008](32008R0300) een achtergrondcontrole is vereist, voor
      aanvang van hun werkzaamheden worden onderworpen aan een controle van hun opleiding en loopbaan in de afgelopen
      vijf jaar, alsmede eventuele onderbrekingen in deze opleiding en loopbaan.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rf
  - number: 37rf.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, met het oog op de goede uitvoering van EG-[verordening
      300/2008](32008R0300), nadere regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rf
  - number: 37rf.5.a
    text: de achtergrondcontrole, bedoeld in het eerste lid, en de periodieke herhaling daarvan;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rf
  - number: 37rf.5.b
    text: de controle van de opleiding en loopbaan, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rf
  - number: 37rg
    text: '**[VERVALLEN]**'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37rg
  - number: 37t.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze afdeling, dan wel van verplichtingen
      die voortvloeien uit een Europese verordening voor zover deze betrekking heeft op de beveiliging van de
      burgerluchtvaart en voor het toezicht daarop geen andere autoriteit is aangewezen, is belast de commandant van de
      Koninklijke marechaussee. Onze Minister van Justitie en Veiligheid kan daartoe aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37t
  - number: 37t.2
    text: |-
      Onze Minister van Justitie en Veiligheid is belast met het in stand houden van het nationaal
      kwaliteitscontroleprogramma, bedoeld in artikel 11 van EG-[verordening 300/2008](32008R0300).
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37t
  - number: 37u.1
    text: |-
      Onze Minister van Justitie en Veiligheid kan een last onder bestuursdwang opleggen ter handhaving van het bepaalde
      bij of krachtens deze afdeling en van EG-[verordening 300/2008](32008R0300).
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37u
  - number: 37u.2
    text: |-
      Onze Minister van Justitie en Veiligheid kan de uitoefening van de in het eerste lid genoemde bevoegdheid
      mandateren aan de commandant van de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37u
  - number: 37v.1
    text: |-
      Een klacht tegen beveiligingspersoneel als bedoeld in [artikel 37a, tweede lid, onderdeel h, onder 1°][ref1], over
      een gedraging bij de uitvoering van een taak ingevolge deze afdeling, kan worden ingediend bij de Commandant van de
      Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37v
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37a
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
  - number: 37v.2
    text: |-
      De klacht wordt behandeld door Onze Minister van Justitie. Deze kan hiervoor mandaat verlenen aan de Commandant van
      de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37v
  - number: 37v.3
    text: |-
      [Titel 9.1 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing. De regels vastgesteld
      krachtens [artikel 6, onder i, van de Wet particuliere beveiligingsorganisaties][ref2] blijven buiten werking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0008973#Artikel6
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37v
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0008973
        artikel: '6'
  - number: 37v.4
    text: |-
      Voor de toepassing van de [Wet Nationale ombudsman][ref1] en [titel 9.2 van de Algemene wet bestuursrecht][ref2]
      wordt een gedraging als bedoeld in het eerste lid, aangemerkt als een gedraging van Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0003372
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37v
    references:
      - id: ref1
        bwb_id: BWBR0003372
      - id: ref2
        bwb_id: BWBR0005537
  - number: 37v.5
    text: |-
      Indien de klacht zich tevens richt tegen beveiligingspersoneel als bedoeld in
      [artikel 37a, eerste lid, onderdeel h, onder 2°][ref1], en betrekking heeft op hetzelfde feitencomplex, wordt deze
      behandeld volgens de procedure die geldt voor dat beveiligingspersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37a
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37v
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37a
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: 3A
  - number: 37w.1
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *derde land:* elke
      staat of elk grondgebied waarop het Verdrag betreffende de werking van de Europese Unie niet van toepassing is;
        - *bestemmingsuitwijkhaven:* een uitwijkhaven als bedoeld in artikel 2, onderdeel 38, van Uitvoeringsverordening
      (EU) nr. 923/2012 van de Commissie van 26 september 2012 tot vaststelling van gemeenschappelijke
      luchtverkeersregels en operationele bepalingen betreffende luchtvaartnavigatiediensten en -procedures en tot
      wijziging van Uitvoeringsverordening (EU) nr. 1035/2011 en Verordeningen (EG) nr. 1265/2007, (EG) nr. 1794/2006,
      (EG) nr. 730/2006, (EG) nr. 1033/2006 en (EU) nr. 255/2010 (PbEU 2012, L 281);
        - *risicovlucht:* een verkeersvlucht die overeenkomstig [artikel 37x, tweede lid][ref1], is aangewezen als
      risicovlucht.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37x
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37w
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37x
        hoofdstuk: IVa
  - number: 37w.2
    text: |-
      Een wijziging van Uitvoeringsverordening (EU) nr. 923/2012 van de Commissie van 26 september 2012 tot vaststelling
      van gemeenschappelijke luchtverkeersregels en operationele bepalingen betreffende luchtvaartnavigatiediensten en
      -procedures en tot wijziging van Uitvoeringsverordening (EU) nr. 1035/2011 en Verordeningen (EG) nr. 1265/2007,
      (EG) nr. 1794/2006, (EG) nr. 730/2006, (EG) nr. 1033/2006 en (EU) nr. 255/2010 (PbEU 2012, L 281) gaat voor de
      toepassing van de Luchtvaartwet gelden met ingang van de dag waarop aan de betrokken wijziging uitvoering moet
      zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37w
  - number: 37x.1
    text: |-
      Het is verboden een risicovlucht te doen landen op een niet overeenkomstig het derde lid aangewezen
      luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37x
  - number: 37x.2
    text: |-
      Onze Minister van Justitie en Veiligheid kan in overeenstemming met Onze Minister van Infrastructuur en Waterstaat
      verkeersvluchten, afkomstig uit een derde land, aanwijzen als risicovlucht, indien een sterk verhoogd risico
      bestaat dat vluchten uit dat land gebruikt zullen worden voor het binnen het grondgebied van Nederland brengen van
      middelen, als bedoeld in [artikel 2][ref1] en [3 van de Opiumwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37x
    references:
      - id: ref1
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 37x.3
    text: |-
      Indien toepassing wordt gegeven aan het tweede lid, wijst Onze Minister van Justitie en Veiligheid in
      overeenstemming met Onze Minister van Infrastructuur en Waterstaat, in het belang van een doelmatige
      rechtshandhaving, een of meer luchtvaartterreinen aan die zijn bestemd voor de landing van risicovluchten.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37x
  - number: 37x.4
    text: |-
      Het eerste lid is niet van toepassing, indien het luchtvaartuig waarmee de risicovlucht wordt uitgevoerd, wordt
      omgeleid naar een bestemmingsuitwijkhaven.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37x
  - number: '57.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, de [artikelen 58][ref3],
      [59][ref4], [60][ref5] en [61][ref6] gezamenlijk of afzonderlijk in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel59
      [ref5]: https://wetten.overheid.nl/BWBR0002267#Artikel60
      [ref6]: https://wetten.overheid.nl/BWBR0002267#Artikel61
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0002267
        artikel: '59'
        hoofdstuk: V
      - id: ref5
        bwb_id: BWBR0002267
        artikel: '60'
        hoofdstuk: V
      - id: ref6
        bwb_id: BWBR0002267
        artikel: '61'
        hoofdstuk: V
  - number: '57.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen wordt onverwijld een voorstel van wet aan de Tweede Kamer
      gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel57
  - number: '57.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel57
  - number: '57.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel57
  - number: '57.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel57
  - number: '57.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel57
  - number: '58.1'
    text: |-
      Onze Minister kan bepalen, dat houders van luchtvaartuigen op daartoe strekkende aanwijzing door Onze Minister
      verplicht zijn met deze vervoermiddelen het vervoer van bepaalde personen of zaken te bewerkstelligen en de
      vervoermiddelen daartoe volledig uitgerust op een aangewezen plaats ter beschikking te stellen; deze plaats,
      alsmede de plaats van bestemming kunnen buiten Nederland zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel58
  - number: '58.2'
    text: |-
      De aanwijzing wordt zo mogelijk schriftelijk gegeven; een op andere wijze gegeven aanwijzing wordt zo spoedig
      mogelijk door een schriftelijke aanwijzing gevolgd. Voor de aanvang van het vervoer wordt de vervoerder medegedeeld
      te wiens behoeve het vervoer plaats vindt.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel58
  - number: '58.3'
    text: |-
      Met betrekking tot het in het eerste lid bedoelde vervoer gelden tussen de vervoerder en hem te wiens behoeve het
      vervoer plaats vindt de voor soortgelijk vervoer rechtens geldende dan wel gebruikelijke tarieven en voorwaarden;
      bij gebreke zowel van gebruikelijke als van rechtens geldende tarieven en voorwaarden gelden de door Onze Minister
      vastgestelde tarieven en voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel58
  - number: '58.4'
    text: |-
      Onze Minister kan bij ministeriële regeling regels stellen ter aanvulling of ter vervanging van de rechtens
      geldende of gebruikelijke tarieven en voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel58
  - number: '58.5'
    text: |-
      Onze Minister kan aan de houder van luchtvaartuigen aan wie een aanwijzing is gegeven krachtens het eerste lid, een
      naar billijkheid te bepalen vergoeding toekennen ter zake van buitengewone kosten door betrokkene gemaakt vanwege
      de naleving van de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel58
  - number: '58.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen op voordracht van Onze Ministers van Infrastructuur en Milieu en van
      Defensie regels worden gesteld ter zake van de toepassing van het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel58
  - number: '59.1'
    text: |-
      Onze Minister van Defensie kan ten aanzien van militaire luchtvaartuigen en de leden van hun bemanning, alsmede ten
      aanzien van militaire luchtvaartterreinen afwijken van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel59
  - number: '59.2'
    text: |-
      Onze Minister van Defensie kan, onverminderd de bevoegdheden bij andere wetten verleend, bepalen dat houders
      van luchtvaartuigen op daartoe strekkende aanwijzing door Onze Minister van Defensie verplicht zijn met deze
      vervoermiddelen het vervoer van bepaalde personen of zaken te bewerkstelligen en de vervoermiddelen daartoe
      volledig uitgerust op een aangewezen plaats ter beschikking te stellen; deze plaats, alsmede de plaats van
      bestemming kunnen buiten Nederland zijn gelegen. Het [tweede tot en met vijfde lid van artikel 58][ref1] zijn van
      overeenkomstige toepassing met dien verstande dat voor Onze Minister wordt gelezen: Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '59.3'
    text: |-
      Onze Minister van Defensie is, onverminderd de bevoegdheden bij andere wetten verleend, bevoegd ten behoeve
      van de krijgsmacht de terbeschikkingstelling te vorderen van luchtvaartterreinen met bijbehorende gebouwen
      en inrichtingen alsmede van de zich in die gebouwen en inrichtingen bevindende roerende goederen. Het
      [tweede tot en met vijfde lid van artikel 58][ref1] zijn van overeenkomstige toepassing met dien verstande dat voor
      Onze Minister wordt gelezen: Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '59.4'
    text: |-
      Gedurende de tijd, dat ingevolge het tweede en derde lid ten behoeve van de krijgsmacht luchtvaartuigen zijn
      aangewezen en luchtvaartterreinen ter beschikking zijn gesteld, worden deze beschouwd als militaire luchtvaartuigen
      en als militaire luchtvaartterreinen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel59
  - number: '60.1'
    text: 'Onze Minister van Defensie is, onverminderd de bevoegdheden bij andere wetten verleend, bevoegd:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel60
  - number: 60.1.a
    text: |-
      aanwijzingen te geven aan rechthebbenden ten aanzien van luchtvaartterreinen met betrekking tot het beheer en het
      gebruik van die luchtvaartterreinen;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel60
  - number: 60.1.b
    text: |-
      aanwijzingen te geven aan rechthebbenden ten aanzien van roerende en onroerende zaken, welke zich op
      luchtvaartterreinen bevinden, met betrekking tot het beheer en het gebruik van die zaken;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel60
  - number: 60.1.c
    text: werken te doen uitvoeren op luchtvaartterreinen;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel60
  - number: 60.1.d
    text: voorzieningen te doen uitvoeren aan de zich op luchtvaartterreinen bevindende roerende en onroerende zaken, en
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel60
  - number: 60.1.e
    text: |-
      luchtvaartterreinen en de daarbij behorende gebouwen en inrichtingen, met inbegrip van woongedeelten,
      alsmede fabrieken, werkplaatsen en aanhorigheden, welke dienstbaar zijn aan de luchtvaart, te doen
      betreden voor zover dat redelijkerwijs voor de vervulling van zijn taak nodig is. In afwijking
      van [artikel 2 van de Algemene wet op het binnentreden][ref1] is het militaire gezag bevoegd
      zonder machtiging binnen te treden. Het militaire gezag is bevoegd een machtiging als bedoeld in
      [artikel 3 van de Algemene wet op het binnentreden][ref2] te geven. [Artikel 3 van die wet][ref3] is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006763#Artikel3
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0006763
        artikel: '3'
  - number: '60.2'
    text: |-
      Op de maatregelen getroffen krachtens dit artikel zijn het [tweede tot en met vijfde lid van artikel 58][ref1] van
      overeenkomstige toepassing met dien verstande dat voor Onze Minister wordt gelezen: Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '60.3'
    text: |-
      Op de maatregelen getroffen krachtens dit artikel is tevens het [zesde lid van artikel 58][ref1] van
      overeenkomstige toepassing met dien verstande dat de voordracht geschiedt door Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '61.1'
    text: |-
      Onze Minister van Defensie is bevoegd opdrachten te geven aan personen die in het bezit zijn van een ingevolge deze
      wet uitgereikt bewijs van bevoegdheid alsmede aan personen, behorende tot bij algemene maatregel van bestuur aan te
      wijzen categorieën van personeel dat werkzaam is ten behoeve van de luchtvaart.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel61
  - number: '61.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld betreffende de aard en de duur van de
      opdrachten alsmede de wijze waarop en de voorwaarden waaronder zij kunnen worden gegeven, zomede betreffende de
      schadeloosstelling in verband met de verstrekte opdrachten. De rechtspositie van de personen, die een opdracht
      hebben ontvangen, wordt bij algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel61
  - number: 61a.1
    text: |-
      Voordat Onze Minister van Defensie een hem krachtens dit hoofdstuk ten aanzien van burgerluchtvaart toekomende
      bevoegdheid uitoefent, richt hij een verzoek aan Onze Minister van Infrastructuur en Waterstaat om aan de behoefte
      gesteld door Onze Minister van Defensie te voldoen. Onze Minister van Defensie oefent de bevoegdheden krachtens
      dit hoofdstuk ten aanzien van burgerluchtvaart niet uit dan nadat Onze Minister van Infrastructuur en Waterstaat te
      kennen heeft gegeven niet te zullen voldoen aan dit verzoek.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel61a
  - number: 61a.2
    text: |-
      In dringende omstandigheden kan Onze Minister van Defensie afwijken van het eerste lid. Hij stelt Onze Minister
      van Infrastructuur en Waterstaat daarvan terstond in kennis. Zodra de omstandigheden dat naar het oordeel van
      Onze Minister van Defensie en van Onze Minister van Infrastructuur en Waterstaat toelaten, wordt aan de door Onze
      Minister van Defensie gestelde behoefte voldaan door Onze Minister van Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel61a
  - number: 61a.3
    text: |-
      Indien een in deze wet toegekende bevoegdheid door Onze Minister van Infrastructuur en Waterstaat wordt
      uitgeoefend ten behoeve van de uitvoering van de militaire taak, vindt toekenning van een vergoeding krachtens
      [artikel 58, vijfde lid][ref1], plaats in overeenstemming met Onze Minister van Defensie. Deze vergoeding komt voor
      rekening van Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '62.1'
    text: |-
      Hij, die een van de [artikelen 8][ref1], [9][ref2], [14, eerste lid onder c][ref3], [16][ref4],
      [17, eerste lid][ref5], [30b, zesde lid][ref6], [31][ref7], [32][ref8], [33][ref9], [34][ref10], [36][ref11],
      [37][ref12], [38, vijfde lid][ref13], of [74][ref14] overtreedt, wordt gestraft hetzij met hechtenis van ten
      hoogste zes maanden en geldboete van de derde categorie, hetzij met één van deze straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel9
