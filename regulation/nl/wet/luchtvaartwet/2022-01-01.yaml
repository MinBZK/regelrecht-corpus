---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: luchtvaartwet
regulatory_layer: WET
publication_date: '2025-10-30'
valid_from: '2022-01-01'
bwb_id: BWBR0002267
url: https://wetten.overheid.nl/BWBR0002267/2022-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen omtrent de luchtvaart te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel1
  - number: 1.a
    text: 'luchtvaart: het gebruik van luchtvaartuigen;'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel1
  - number: 1.b
    text: |-
      luchtvaartuig: toestel, bedoeld in [artikel 1.1, eerste lid, van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
  - number: 1.c
    text: 'vliegtuigen: luchtvaartuigen zwaarder dan lucht en voorzien van een voortstuwingsinrichting;'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel1
  - number: 1.d
    text: |-
      exploitant van een luchtvaartterrein: degene, te wiens name ingevolge deze wet een luchtvaartterrein wordt
      aangewezen;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel1
  - number: 1.f
    text: 'buitenlandse luchtvaartuigen: luchtvaartuigen, ingeschreven in een buitenlands luchtvaartuigregister;'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel1
  - number: 1.g
    text: 'luchtvaartterreinen: een aangewezen terrein ingericht voor het opstijgen en landen van luchtvaartuigen;'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel1
  - number: 1.h
    text: |-
      luchtvaartmaatschappijen: eigenaren van ondernemingen, die geheel of gedeeltelijk hun bedrijf maken van het vervoer
      van personen, dieren of goederen met luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel1
  - number: 1.i
    text: 'verkeersvlucht: een vlucht, die vervoer door een luchtvaartmaatschappij ten doel heeft;'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel1
  - number: 1.j
    text: |-
      Onze Minister: voor wat de burgerluchtvaart en de algemene verkeersveiligheid in de lucht betreft: Onze Minister
      van Infrastructuur en Waterstaat: voor wat de militaire luchtvaart betreft: Onze Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel1
  - number: '2'
    text: Voor de toepassing van het bij of krachtens deze wet bepaalde wordt mede verstaan onder
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel2
  - number: 2.a
    text: 'gezagvoerder: hij, die een luchtvaartuig alleen bedient;'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel2
  - number: 2.b
    text: |-
      bedienen van een luchtvaartuig: het verrichten van handelingen aan boord van een luchtvaartuig ten behoeve van het
      gebruik van dat luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel2
  - number: 2.c
    text: 'terreinen: watergebieden;'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel2
  - number: 2.d
    text: 'bouwwerken: getimmerten, constructiemasten, bovengrondse geleidingen, dijken en kaden.'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel2
  - number: 2.e
    text: 'luchtwaardigheid: de toelaatbaarheid van het door het luchtvaartuig veroorzaakte geluid.'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel2
  - number: '9'
    text: |-
      Ten aanzien van het in luchtwaardige toestand houden van Nederlandse luchtvaartuigen worden de bewijzen van
      bevoegdheid afgegeven, geschorst of ingetrokken door Onze Minister en wel, voor wat burgerluchtvaartuigen betreft,
      naar regelen, gesteld bij of krachtens algemene maatregel van bestuur. Voorts kan Onze Minister bewijzen van
      gelijkstelling van buitenlandse bewijzen van bevoegdheid afgeven, schorsen en intrekken, naar regelen, gesteld bij
      of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel9
  - number: '16'
    text: |-
      Voor zover bij internationale overeenkomst niet anders is bepaald mag vervoer met luchtvaartuigen in, naar of uit
      Nederland, of met Nederland als tussenstation, slechts geschieden door luchtvaartmaatschappijen aan wie daartoe
      door Onze Minister vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16
  - number: 16a.1
    text: |-
      Ten aanzien van vergunningen als bedoeld in [artikel 16][ref1] die vallen onder Verordening (EG) nr. 1008/2008
      van het Europees Parlement en de Raad van de Europese Unie van 24 september 2008 inzake gemeenschappelijke regels
      voor de exploitatie van luchtdiensten in de Gemeenschap (PbEU L 293), wordt toegepast hetgeen bij of krachtens die
      verordening is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
  - number: 16a.2
    text: |-
      Een wijziging van het bepaalde bij of krachtens de verordening, genoemd in het eerste lid, treedt voor de
      toepassing van het eerste lid in werking met ingang van de dag waarop de betrokken wijzigingsregeling in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16a
  - number: 16a.3
    text: |-
      Aan een vergunning als bedoeld in het eerste lid kunnen voorschriften worden verbonden voor zover deze in
      overeenstemming zijn met de verordening.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16a
  - number: 16a.4
    text: |-
      Onze Minister kan een vergunning als bedoeld in het eerste lid, met inachtneming van de verordening, schorsen of
      intrekken.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16a
  - number: 16a.5
    text: Onze Minister kan een vergunning als bedoeld in het eerste lid, op verzoek van de houder wijzigen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16a
  - number: 16b.1
    text: |-
      Een vergunning als bedoeld in [artikel 16][ref1] die niet valt onder de in [artikel 16a, eerste lid][ref2] genoemde
      verordening, wordt verleend voor een bepaalde, daarin genoemde, termijn van ten hoogste vijf jaar. Zij kan door
      Onze Minister worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel16a
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 16a
        hoofdstuk: III
        afdeling: '3'
  - number: 16b.2
    text: Aan een vergunning als bedoeld in het eerste lid, kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16b
  - number: 16b.3
    text: 'Onze Minister kan een vergunning als bedoeld in het eerste lid, schorsen of intrekken:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16b
  - number: 16b.3.a
    text: indien de vergunninghouder daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16b
  - number: 16b.3.b
    text: wegens niet-uitoefening van het vervoer;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16b
  - number: 16b.3.c
    text: wegens uitoefening van het vervoer in strijd met bij of krachtens deze wet gegeven voorschriften;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16b
  - number: 16b.3.d
    text: wegens niet-inachtneming van aan de vergunning verbonden voorschriften of beperkingen;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16b
  - number: 16b.3.e
    text: indien ter verkrijging van de vergunning onjuiste of onvolledige gegevens zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16b
  - number: 16b.4
    text: Onze Minister kan een vergunning als bedoeld in het eerste lid, op verzoek van de houder wijzigen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16b
  - number: 16b.5
    text: |-
      Een vergunning als bedoeld in het eerste lid verliest haar geldigheid zolang en voor zover de vergunninghouder is
      geplaatst op de communautaire lijst, bedoeld in Verordening (EG) nr. 2111/2005 van het Europees Parlement en de
      Raad van de Europese Gemeenschappen van 14 december 2005 betreffende de vaststelling van een communautaire lijst
      van luchtvaartmaatschappijen waaraan een exploitatieverbod binnen de Gemeenschap is opgelegd en het informeren van
      luchtreizigers over de identiteit van de exploiterende luchtvaartmaatschappij en tot intrekking van artikel 9 van
      richtlijn nr. 2004/36/EG.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16b
  - number: 16b.6
    text: |-
      Een aanvraag voor een vergunning als bedoeld in het eerste lid, of voor een verlenging voor een dergelijke
      vergunning wordt afgewezen voor zover de aanvraag betrekking heeft op activiteiten waarvoor de aanvrager op de
      communautaire lijst, bedoeld in het vijfde lid, is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16b
  - number: 16c
    text: |-
      Bij ministeriële regeling kunnen bepaalde soorten van vervoer worden uitgezonderd van de in [artikel 16][ref1]
      vervatte verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
  - number: 16d.1
    text: |-
      Onze Minister kan ontheffing verlenen van de in [artikel 16][ref1] vervatte verplichting. Van de beschikking ter
      zake wordt mededeling in de *Staatscourant* gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
  - number: 16d.2
    text: Aan de in het eerste lid bedoelde ontheffingen kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16d
  - number: 16d.3
    text: |-
      Onze Minister kan een ontheffing schorsen of intrekken wegens niet inachtneming van de aan de ontheffing verbonden
      voorschriften of beperkingen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel16d
  - number: '17.1'
    text: Het is verboden luchtvaartvertoningen of luchtvaartwedstrijden te houden zonder vergunning van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel17
  - number: '17.2'
    text: |-
      Het is verboden boven Nederland deel te nemen aan een vertoning of wedstrijd als bedoeld in het eerste lid,
      waarvoor geen vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel17
  - number: '17.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven waaraan bij het aanvragen van een
      vergunning tot het houden van een luchtvaartvertoning of een luchtvaartwedstrijd en bij het houden van zodanige
      vertoning of wedstrijd moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel17
  - number: 37a.1
    text: |-
      Voor de toepassing van deze afdeling en de daarop berustende bepalingen wordt verstaan onder: - *EG-verordening
      300/2008:* Verordening (EG) nr. 300/2008 van het Europees Parlement en de Raad van 11 maart 2008 inzake
      gemeenschappelijke regels op het gebied van de beveiliging van de burgerluchtvaart en tot intrekking van
      Verordening (EG) nr. 2320/2002 (Pb EU 2008, L 97/72) en de uitvoeringsbepalingen daarvan;
        - *EG-verordening 272/2009:* Verordening (EG) nr. 272/2009 van de Commissie van 2 april 2009 ter aanvulling
      van de in de bijlage bij Verordening (EG) nr. 300/2008 van het Europees Parlement en de Raad vastgestelde
      gemeenschappelijke basisnormen voor de beveiliging van de burgerluchtvaart (Pb EU 2009, L 91/7);
        - *EU-verordening 1254/2009:* Verordening (EU) nr. 1254/2009 van de Commissie van 18 december 2009 tot vaststelling
      van criteria waaraan lidstaten moeten voldoen om te mogen afwijken van de gemeenschappelijke basisnormen inzake
      beveiliging van de burgerluchtvaart en om alternatieve beveiligingsmaatregelen te mogen vaststellen (Pb EU 2009,
      L 338/17);
        - *EU-verordening 2015/1998:* Uitvoeringsverordening (EU) nr. 2015/1998 van de Commissie van 5 november 2015 tot
      vaststelling van gedetailleerde maatregelen voor de tenuitvoerlegging van de gemeenschappelijke basisnormen op het
      gebied van de beveiliging van de burgerluchtvaart (Pb EU 2015, L 299/1).
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37a
  - number: 37a.2
    text: |-
      Voor de toepassing van deze afdeling en de daarop berustende bepalingen wordt verstaan onder: - *ACC3-
      luchtvaartmaatschappij:* de luchtvervoersonderneming, bedoeld in punt 6.8.8.1 van EU-[verordening 2015/1998]
      (31998R2015);
        - *bedrijfsmateriaal van een luchtvaartmaatschappij:* materiaal als bedoeld in artikel 3, punt 23, van
      EG-[verordening 300/2008](32008R0300);
        - *bedrijfspost van een luchtvaartmaatschappij:* post als bedoeld in artikel 3, punt 22, van EG-[verordening
      300/2008](32008R0300);
        - *bekende afzender:* de natuurlijke persoon of rechtspersoon, bedoeld in artikel 3, punt 27, van EG-[verordening
      300/2008](32008R0300);
        - *beveiligingscontrole:* de controle, bedoeld in artikel 3, punt 9, van EG-[verordening 300/2008](32008R0300);
        - *beveiligingsdoorzoeking:* de inspectie, bedoeld in artikel 3, punt 30, van EG-[verordening 300/2008]
      (32008R0300);
        - *beveiligingsonderzoek:* het onderzoek, bedoeld in artikel 3, punt 8, van EG-[verordening 300/2008](32008R0300);
        - *beveiligingspersoneel:* 1°. personen in dienst van een door de exploitant van een luchtvaartterrein
      met de uitvoering van de beveiliging belaste particuliere beveiligingsorganisatie, waaraan
      door Onze Minister van Justitie en Veiligheid een vergunning is verleend als bedoeld in
      [artikel 3 van de Wet particuliere beveiligingsorganisaties en recherchebureaus][ref1], en 2°. de door Onze
      Minister van Justitie en Veiligheid aangewezen ambtenaren van politie, ambtenaren van de Koninklijke marechaussee
      en de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane;
        - *communautaire luchtvaartmaatschappij:* de luchtvaartmaatschappij, bedoeld in artikel 3, punt 5, van
      EG-[verordening 300/2008](32008R0300);
        - *detectieapparatuur:* de uitrusting, bedoeld in punt 12 van bijlage I bij EG-[verordening 300/2008](32008R0300),
      met uitzondering van explosievenspeurhonden;
        - *entiteit:* de natuurlijke persoon of rechtspersoon die gemeenschappelijke basisnormen voor de beveiliging
      van de burgerluchtvaart toepast, met uitzondering van de exploitant van een luchtvaartterrein of de
      luchtvaartmaatschappij, als bedoeld in artikel 3, punt 6, van EG-[verordening 300/2008](32008R0300);
        - *erkend agent:* de natuurlijke persoon of rechtspersoon, bedoeld in artikel 3, punt 26, van EG-[verordening
      300/2008](32008R0300);
        - *EU-gegevensbank betreffende de beveiliging van de toeleveringsketen:* de gegevensbank, bedoeld in punt 6.3.1.2
      van de bijlage bij EU-[verordening 2015/1998](31998R2015);
        - *handbagage:* bagage als bedoeld in artikel 3, punt 19, van EG-[verordening 300/2008](32008R0300);
        - *luchthavenbenodigdheden:* de voorwerpen, bedoeld in artikel 2, punt 1, van EG-[verordening 272/2009]
      (32009R0272);
        - *luchtvaartmaatschappij:* een luchtvervoersonderneming als bedoeld in artikel 3, punt 4, van EG-[verordening
      300/2008](32008R0300);
        - *luchtvaartterrein:* een luchtvaartterrein of deel daarvan dat niet uitsluitend voor militaire doeleinden wordt
      gebruikt, met inbegrip van vliegtuigen, bussen, bagagekarretjes of andere vervoersmiddelen, dan wel wandelgangen
      of loopbruggen;
        - *opleidingsinstelling:* een onderneming die zich geheel of gedeeltelijk bezig houdt met het geven van opleidingen
      op het gebied van de beveiliging van de burgerluchtvaart;
        - *post:* zendingen van correspondentie en andere voorwerpen als bedoeld in artikel 3, punt 24 van EG-[verordening
      300/2008](32008R0300);
        - *ruimbagage:* bagage als bedoeld in artikel 3, punt 20, van EG-[verordening 300/2008](32008R0300);
        - *toegangsbewijs:* 1°. een toegangsbewijs, als bedoeld in punt 1.2.2.2 van de bijlage bij EU- [verordening
      2015/1998](31998R2015), en 2°. een voertuigpas, als bedoeld punt 1.2.1.3 van de bijlage bij EU- [verordening
      2015/1998](31998R2015);
        - *toegangscontrole:* de controle, bedoeld in artikel 3, punt 10, van EG-[verordening 300/2008](32008R0300);
        - *vaste afzender:* de natuurlijke persoon of rechtspersoon, bedoeld in artikel 3, punt 28, van EG-[verordening
      300/2008](32008R0300);
        - *verboden voorwerpen:* de voorwerpen, bedoeld in artikel 3, punt 7, van EG-[verordening 300/2008](32008R0300);
        - *vluchtbenodigdheden:* de voorwerpen, bedoeld in artikel 2, punt 2, van EG-[verordening 272/2009](32009R0272).
        - *vracht:* goederen als bedoeld in artikel 3, punt 25, van EG-[verordening 300/2008](32008R0300).


      [ref1]: https://wetten.overheid.nl/BWBR0008973#Artikel3
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0008973
        artikel: '3'
  - number: 37a.3
    text: |-
      Met betrekking tot militaire luchtvaartterreinen waarvan delen uitsluitend ten behoeve van de burgerluchtvaart
      worden gebruikt, wordt in afwijking van [artikel 1, eerste lid, onder d][ref1], voor de toepassing van deze
      afdeling als exploitant van een luchtvaartterrein aangemerkt, de bij koninklijk besluit aan te wijzen rechtspersoon
      aan wie het medegebruik ten behoeve van de burgerluchtvaart is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel1
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '1'
        hoofdstuk: I
  - number: 37a.4
    text: |-
      Een koninklijk besluit als bedoeld in het derde lid wordt genomen op voordracht van Onze Minister van
      Infrastructuur en Waterstaat in overeenstemming met Onze Ministers van Justitie en Veiligheid en van Defensie.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37a
  - number: 37ab.1
    text: |-
      Onze Minister van Justitie en Veiligheid is belast met de beveiliging van de burgerluchtvaart. Hij is de bevoegde
      autoriteit, bedoeld in artikel 9 van EG-[verordening 300/2008](32008R0300).
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ab
  - number: 37ab.2
    text: |-
      Onze Minister van Justitie en Veiligheid is belast met het in stand houden van het Nationaal programma voor de
      beveiliging van de burgerluchtvaart, bedoeld in artikel 10 van EG-[verordening 300/2008](32008R0300).
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel37ab
  - number: 37ab.3
    text: |-
      Exploitanten van luchtvaartterreinen, luchtvaartmaatschappijen en entiteiten zijn gehouden te voldoen aan door
      Onze Minister van Justitie en Veiligheid of namens deze door de commandant van de Koninklijke marechaussee
      gegeven aanwijzingen inzake de nakoming van een verplichting die op hen rust ingevolge de [artikelen 37ada][ref1],
      [37b][ref2], [37f][ref3], [37g][ref4], [37h][ref5], [37hb][ref6], [37hd][ref7], [37j][ref8], [37k][ref9],
      [37l][ref10], [37ra][ref11], [37rf][ref12] en [37rg][ref13], of ingevolge een verplichting die voortvloeit uit een
      Europese verordening voor zover deze betrekking heeft op de beveiliging van de burgerluchtvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ada
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
