        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '17'
        hoofdstuk: III
        afdeling: '3'
  - number: '62.3'
    text: |-
      Overtreding van een voorschrift gegeven bij of krachtens algemene maatregel van bestuur ingevolge deze wet, wordt,
      voor zover die overtreding uitdrukkelijk als strafbaar feit is aangemerkt, gestraft hetzij met hechtenis van ten
      hoogste zes maanden en geldboete van de derde categorie, hetzij met één van deze straffen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel62
  - number: '62.4'
    text: |-
      De eigenaar of houder van een luchtvaartuig, die in strijd met een van de [artikelen 4][ref1], [8][ref2] of
      [16][ref3] de luchtvaart doet of laat uitoefenen, wordt gestraft hetzij met hechtenis van ten hoogste zes maanden
      en geldboete van de derde categorie, hetzij met één van deze straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '4'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '8'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '16'
        hoofdstuk: III
        afdeling: '3'
  - number: 62a.1
    text: |-
      Hij die een op grond van [artikel 37b, eerste lid, onder b, c en d][ref1], aangewezen deel van een
      luchtvaartterrein wederrechtelijk binnendringt of wederrechtelijk aldaar verblijft, wordt gestraft met
      gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37b
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37b
        hoofdstuk: IV
        paragraaf: '2'
        afdeling: 3A
  - number: 62a.2
    text: |-
      Hij die zich wederrechtelijk toegang verschaft tot een in het eerste lid bedoeld terrein door middel van braak
      of inklimming, van valse sleutels, van een valse order, een vals kostuum of een valse of niet aan betrokkene
      toebehorende toegangspas wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel62a
  - number: 62a.3
    text: |-
      De in het eerste en tweede lid bepaalde gevangenisstraffen kunnen met een derde worden verhoogd, indien twee of
      meer verenigde personen het misdrijf plegen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel62a
  - number: '63'
    text: |-
      Overtreding van een van de [artikelen 15][ref1] of [65][ref2] wordt gestraft met gevangenisstraf van ten hoogste
      drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel65
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '15'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '65'
        hoofdstuk: VI
  - number: '64.1'
    text: 'Bij veroordeling wegens overtreding van:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel64
  - number: 64.1.a
    text: |-
      een van de [artikelen 4][ref1], [8][ref2], en [17][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel17
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '4'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '8'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '17'
        hoofdstuk: III
        afdeling: '3'
  - number: 64.1.b
    text: |-
      een voorschrift van een krachtens deze wet vastgestelde algemene maatregel van bestuur, kan de schuldige de
      bevoegdheid een luchtvaartuig te bedienen voor ten hoogste drie jaren worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel64
  - number: '64.2'
    text: |-
      Bij toepassing van het bepaalde in het eerste lid verliest een aan de veroordeelde afgegeven bewijs van bevoegdheid
      of van gelijkstelling zijn geldigheid voor de duur van de ontzegging, zodra de rechterlijke uitspraak, voor wat
      betreft deze bijkomende straf, voor tenuitvoerlegging vatbaar is geworden. De betrokken ambtenaar van het Openbaar
      Ministerie brengt dit onverwijld ter kennis van Onze Minister, die daarvan aankondiging doet in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel64
  - number: '65'
    text: |-
      Het is degene, die weet, of redelijkerwijze moet weten, dat hem bij rechterlijke uitspraak de bevoegdheid een
      luchtvaartuig te bedienen is ontzegd, verboden, gedurende de tijd, dat hem die bevoegdheid ontzegd is, een
      luchtvaartuig te bedienen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel65
  - number: '66.1'
    text: |-
      Hij, die opzettelijk niet voldoet aan een krachtens [artikel 58][ref1] gegeven aanwijzing, wordt gestraft met
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '66.2'
    text: |-
      Hij die opzettelijk in strijd handelt met een ingevolge [artikel 59][ref1] gegeven aanwijzing of gedane vordering,
      wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel59
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '59'
        hoofdstuk: V
  - number: '66.3'
    text: |-
      Hij die opzettelijk in strijd handelt met een ingevolge [artikel 60][ref1] gegeven aanwijzing, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel60
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '60'
        hoofdstuk: V
  - number: '66.4'
    text: |-
      Hij, die opzettelijk een ingevolge [artikel 61][ref1] gegeven opdracht niet uitvoert, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel61
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '61'
        hoofdstuk: V
  - number: '67.1'
    text: |-
      Hij, die niet voldoet aan een krachtens [artikel 58][ref1] gegeven aanwijzing, wordt gestraft met hechtenis van ten
      hoogste één jaar of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '67.2'
    text: |-
      Hij die in strijd handelt met een ingevolge [artikel 59][ref1] gegeven aanwijzing of gedane vordering, wordt
      gestraft met hechtenis van ten hoogste één jaar of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel59
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '59'
        hoofdstuk: V
  - number: '67.3'
    text: |-
      Hij, die in strijd handelt met een ingevolge [artikel 60][ref1] gegeven aanwijzing, wordt gestraft met hechtenis
      van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel60
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '60'
        hoofdstuk: V
  - number: '67.4'
    text: |-
      Hij, die een ingevolge [artikel 61][ref1] gegeven opdracht niet uitvoert, wordt gestraft met hechtenis van ten
      hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel61
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '61'
        hoofdstuk: V
  - number: '68'
    text: |-
      Hij, die een handeling verricht met het oogmerk de uitoefening van de bevoegdheden vermeld in de
      [artikelen 58 tot en met 61][ref1] te belemmeren, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel58
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '58'
        hoofdstuk: V
  - number: '70'
    text: |-
      De feiten strafbaar gesteld bij de [artikelen 62a][ref1], [63][ref2], [66][ref3] en [68][ref4] zijn misdrijven. De
      feiten strafbaar gesteld bij de [artikelen 62][ref5] en [67][ref6] zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel62a
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel66
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel68
      [ref5]: https://wetten.overheid.nl/BWBR0002267#Artikel62
      [ref6]: https://wetten.overheid.nl/BWBR0002267#Artikel67
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 62a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '63'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '66'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0002267
        artikel: '68'
        hoofdstuk: VI
      - id: ref5
        bwb_id: BWBR0002267
        artikel: '62'
        hoofdstuk: VI
      - id: ref6
        bwb_id: BWBR0002267
        artikel: '67'
        hoofdstuk: VI
  - number: '71'
    text: |-
      Als personen met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn, behalve de bij
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen personen, belast:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 71.a
    text: de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel71
  - number: 71.b
    text: de door Onze Minister aan te wijzen personen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel71
  - number: '72'
    text: |-
      Onverminderd [artikel 37h][ref1] is Onze Minister bevoegd tot oplegging van een last onder bestuursdwang ter
      handhaving van de bij of krachtens deze wet gestelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37h
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37h
        hoofdstuk: IV
        paragraaf: '3'
        afdeling: 3A
  - number: '73.1'
    text: 'Onze Minister van Infrastructuur en Waterstaat kan:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel73
  - number: 73.1.a
    text: |-
      ambtenaren aanwijzen, die voor zover het betreft de burgerluchtvaart belast zijn met het toezicht op de naleving
      van het bij of krachtens deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel73
  - number: 73.1.b
    text: personen aanwijzen, die bevoegd zijn de opstijging van luchtvaartuigen te verbieden en te beletten.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel73
  - number: '73.2'
    text: |-
      De bevoegdheid, bedoeld in het eerste lid onder a, kan eveneens worden uitgeoefend met betrekking tot militaire
      luchtvaartterreinen, die krachtens hun aanwijzing of een terzake verleende ontheffing mede door burgerlijke
      luchtvaartuigen mogen worden gebruikt, en met betrekking tot gedeelten van militaire fabrieken, werkplaatsen en
      aanhorigheden, waar zich burgerlijke luchtvaartuigen bevinden, mits een en ander geschiedt in overeenstemming met
      de door de militaire autoriteiten gegeven richtlijnen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel73
  - number: 73b
    text: |-
      Ieder is verplicht aan de krachtens [artikel 73][ref1] aangewezen ambtenaren desgevraagd alle medewerking te
      verlenen en alle inlichtingen te verstrekken, die zij redelijkerwijs bij de uitvoering van de hun op grond van deze
      wet opgedragen taak behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel73
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel73b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '73'
        hoofdstuk: VI
  - number: '75'
    text: |-
      Op de eerste vordering van de in [artikel 71][ref1] bedoelde personen zijn de gezagvoerder en de overige leden van
      de bemanning van een luchtvaartuig verplicht de bij of krachtens deze wet vereiste bescheiden behoorlijk ter inzage
      af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel71
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '71'
        hoofdstuk: VI
  - number: 75a
    text: |-
      Ingeval bij of krachtens deze wet regels worden gesteld ter uitvoering van het op 7 december 1944 te Chicago tot
      stand gekomen Verdrag inzake de internationale burgerluchtvaart (Trb. 1973, 109), kan overtreding van die regels
      ook als strafbaar feit worden aangemerkt dan wel worden bestraft met een bestuurlijke sanctie indien deze regels in
      de Engelse taal zijn gesteld en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel75a
  - number: '76.1'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel76
  - number: 76.1.a
    text: |-
      ter uitvoering van de voorafgaande hoofdstukken of indien de in deze hoofdstukken geregelde onderwerpen in het
      belang van een goede uitvoering van de wet nadere regeling behoeven;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel76
  - number: 76.1.d
    text: ter beveiliging van militaire belangen;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel76
  - number: 76.1.e
    text: |-
      ter beperking van de geluidhinder door luchtvaartuigen met uitzondering van de geluidhinder ten
      gevolge van de uitoefening van de burgerluchtvaart boven gebieden, aangewezen overeenkomstig
      [artikel 1.2, tweede lid, onder d, van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 76.1.g
    text: betreffende de opleiding van vliegtuigbestuurders;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel76
  - number: 76.1.k
    text: |-
      betreffende de regels, die luchtvaartmaatschappijen in acht moeten nemen bij de uitvoering van bepaalde soorten van
      luchtvervoer in, naar of uit Nederland of met Nederland als tussenstation;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel76
  - number: 76.1.l
    text: betreffende de door luchtvaartmaatschappijen toe te passen tarieven en andere vervoersvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel76
  - number: 76.1.m
    text: |-
      betreffende de regels, die in acht moeten worden genomen bij de uitvoering van vluchten naar of uit Nederland
      of met Nederland als tussenstation, waarop géén vervoer plaats vindt, dan wel vluchten welke niet door
      luchtvaartmaatschappijen worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel76
  - number: '76.2'
    text: 'Voorts kunnen bij of krachtens algemene maatregel van bestuur de vergoedingen worden geregeld, verschuldigd voor:'
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel76
  - number: 76.2.a
    text: het gebruik van ’s lands luchtvaartterreinen;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel76
  - number: 76.2.b
    text: werkzaamheden, door de Staat verricht;
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel76
  - number: 76.2.c
    text: diensten, door de Staat verstrekt.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel76
  - number: '76.3'
    text: |-
      Indien een algemene maatregel van bestuur als bedoeld in het eerste lid onder *e*, normen bevat, welke
      betrekking hebben op aan luchtvaartuigen aan te brengen technische voorzieningen ter zake van een vermindering
      van de geluidsproduktie tijdens een vlucht, bij opstijging of landing, of tijdens het proefdraaien op het
      luchtvaartterrein anders dan bij de uitvoering van een vlucht, kan tevens worden bepaald in welke mate deze normen
      in een aan te geven toekomstige periode zullen worden verzwaard.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel76
  - number: '76.4'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid onder *a, e, k, l* en *m* of een wijziging
      daarvan treedt niet eerder in werking dan twee maanden na datum van uitgifte van het *Staatsblad* waarin deze wordt
      geplaatst. Van de plaatsing wordt onverwijld aan de Staten-Generaal mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel76
  - number: '80.1'
    text: De wet van 30 Juli 1926, *Stb.* 249 (Luchtvaartwet), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel80
  - number: '80.2'
    text: |-
      De op grond dier wet afgegeven bewijzen van inschrijving, van luchtwaardigheid, van geschiktheid en van
      gelijkstelling blijven, voor zover zij hun geldigheid krachtens de bepalingen dier wet niet hebben verloren,
      hun geldigheid behouden, totdat bij algemene maatregel van bestuur een nadere regeling te dien aanzien zal zijn
      getroffen.
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel80
  - number: 80a.1
    text: |-
      [Hoofdstuk IV][ref1] van deze wet, met uitzondering van de [afdelingen 3A][ref2] en 5, is niet van toepassing op de
      luchthaven Schiphol.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0002267#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002267
        hoofdstuk: IV
        afdeling: 3A
  - number: 80a.2
    text: |-
      Bij toepassing van deze wet op de luchthaven Schiphol moet onder «luchtvaartterrein» en «exploitant van het
      luchtvaartterrein» verstaan worden: luchthavengebied onderscheidenlijk exploitant van de luchthaven als bedoeld in
      [hoofdstuk 8 van de Wet luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '8'
  - number: 80b.1
    text: |-
      [Afdeling 3A van hoofdstuk IV][ref1] is van toepassing op burgerluchthavens van regionale betekenis als
      bedoeld in [titel 8.3 van de Wet luchtvaart][ref2], burgerluchthavens van nationale betekenis, als bedoeld in
      [titel 8.4 van die wet][ref3] en militaire luchthavens waarvan delen uitsluitend ten behoeve van burgerluchtvaart
      worden gebruikt, als bedoeld in [titel 10.3 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0005555
      [ref3]: https://wetten.overheid.nl/BWBR0005555
      [ref4]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        hoofdstuk: IV
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0005555
      - id: ref3
        bwb_id: BWBR0005555
      - id: ref4
        bwb_id: BWBR0005555
  - number: 80b.2
    text: |-
      Bij toepassing van [afdeling 3A van hoofdstuk IV][ref1] op burgerluchthavens van regionale betekenis,
      burgerluchthavens van nationale betekenis en militaire luchthavens waarvan delen uitsluitend ten behoeve van
      burgerluchtvaart worden gebruikt, moet onder «luchtvaartterrein» en «exploitant van het luchtvaartterrein» verstaan
      worden: luchthaven onderscheidenlijk exploitant van de luchthaven als bedoeld in de [Wet luchtvaart][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        hoofdstuk: IV
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0005555
  - number: '81'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip; Wij kunnen Ons voorbehouden een ander tijdstip vast
      te stellen, waarop [artikel 56][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel56
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '56'
        hoofdstuk: IVa
  - number: '82'
    text: Deze wet kan worden aangehaald als "Luchtvaartwet".
    url: https://wetten.overheid.nl/BWBR0002267/2022-01-01#Artikel82
