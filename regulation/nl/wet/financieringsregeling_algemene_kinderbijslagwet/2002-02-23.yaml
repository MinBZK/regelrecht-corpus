---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: financieringsregeling_algemene_kinderbijslagwet
regulatory_layer: WET
publication_date: '2005-07-07'
valid_from: '2002-02-23'
bwb_id: BWBR0009501
url: https://wetten.overheid.nl/BWBR0009501/2002-02-23
preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Financiën;

    Gelet op artikel 71 van de Organisatie-wet sociale verzekeringen 1997;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel1
  - number: 1.a
    text: '*De Minister:* Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel1
  - number: 1.b
    text: |-
      *de lasten met betrekking tot het Algemeen Kinderbijslagfonds:* de ingevolge de [Algemene Kinderbijslagwet][ref1]
      uit te keren kinderbijslagen, alsmede de aan de uitvoering van de [Algemene Kinderbijslagwet][ref2] verbonden
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0002368
  - number: '2'
    text: |-
      Voor de tiende dag van de maand voorafgaande aan het begin van een kwartaal verstrekt de Sociale verzekeringsbank
      aan de Minister:
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel2
  - number: 2.a
    text: een raming van de lasten met betrekking tot het Algemeen Kinderbijslag-fonds voor het komende kwartaal;
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel2
  - number: 2.b
    text: een uitsplitsing naar maand van het totaalbedrag van de in onderdeel a bedoelde raming;
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel2
  - number: 2.c
    text: een opgave van de werkelijke lasten in het vorige kwartaal;
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel2
  - number: 2.d
    text: een overzicht van uitstaande vorderingen ter zake van uitkeringen aan derden per de ultimo van het vorige kwartaal.
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel2
  - number: '3.1'
    text: |-
      Op de eerste dag van elke maand draagt het Rijk de geraamde lasten van het Algemeen Kinderbijslagfonds over die
      maand af aan de Sociale verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel3
  - number: '3.2'
    text: |-
      Op de eerste dag van elk kwartaal verrekent het Rijk het verschil tussen de werkelijke lasten en de geraamde lasten
      over het kwartaal gelegen twee kwartalen voor het huidige kwartaal.
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel3
  - number: '3.3'
    text: |-
      Indien de in het eerste en tweede lid genoemde dag een zaterdag, zondag of een algemeen erkende feestdag is, wordt
      de eerstvolgende dag die niet een zaterdag, zondag of een algemeen erkende feestdag is, in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel3
  - number: '4'
    text: |-
      In afwijking van [artikel 3][ref1] kan in bijzondere gevallen een hoger of een lager voorschot worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009501#Artikel3
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009501
        artikel: '3'
  - number: '5.1'
    text: |-
      De in [artikel 2, onderdeel a][ref1], genoemde raming wordt zodanig gespecificeerd dat daarin afzonderlijk worden
      vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0009501#Artikel2
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009501
        artikel: '2'
  - number: 5.1.a
    text: het totaalbedrag, gesplitst naar kinderbijslagen, uitvoeringskosten en overige lasten;
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel5
  - number: 5.1.b
    text: het aantal kinderbijslaggerechtigden, gesplitst naar gezinsgrootte;
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel5
  - number: 5.1.c
    text: het aantal kinderen naar de onderscheiden leeftijdscategorieën, gesplitst naar gezinsgrootte.
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel5
  - number: '5.2'
    text: |-
      De in [artikel 2, onderdeel c][ref1], genoemde opgave wordt zodanig gespecificeerd dat daarin afzonderlijk worden
      vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0009501#Artikel2
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009501
        artikel: '2'
  - number: 5.2.a
    text: |-
      het totaalbedrag, gesplitst naar kinderbijslagen, uitvoeringskosten en overige lasten, verminderd met de baten,
      alsmede naar de maand waarin de uitgaven zijn gedaan respectievelijk de ontvangsten zijn ontvangen;
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel5
  - number: 5.2.b
    text: het aantal kinderbijslaggerechtigden, gesplitst naar gezinsgrootte;
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel5
  - number: 5.2.c
    text: het aantal kinderen naar de onderscheiden leeftijdscategorieën, gesplitst naar gezinsgrootte.
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel5
  - number: '6'
    text: |-
      Zo spoedig mogelijk na ontvangst van de jaarrekening van het Algemeen Kinderbijslagfonds vindt een voorlopige
      afrekening met de Sociale verzekeringsbank plaats.
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel6
  - number: '7.1'
    text: |-
      e Minister stelt jaarlijks vóór 31 oktober de omvang van de middelen tot dekking van de uitgaven ten laste van het
      Algemeen Kinderbijslagfonds over het afgelopen kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel7
  - number: '7.2'
    text: |-
      In het besluit bedoeld in het eerste lid wordt afzonderlijk vermeld de omvang van de middelen tot dekking
      van de betaalde kinderbijslagen en de omvang van de middelen tot dekking van de aan uitvoering van de
      [Algemene Kinderbijslagwet][ref1] verbonden kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '7.3'
    text: |-
      Indien de op grond van het eerste lid vastgestelde omvang van de middelen tot dekking van de uitgaven ten laste
      van het fonds afwijkt van de op basis van [artikelen 2][ref1] tot en met [6][ref2] betaalde bedragen vindt een
      definitieve afrekening met de Sociale verzekeringsbank ten gunste of ten laste van het Algemeen Kinderbijslagfonds
      plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0009501#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009501#Artikel6
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009501
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009501
        artikel: '6'
  - number: '8'
    text: |-
      De Financieringsregeling Algemene Kinderbijslagwet en [Toeslagenwet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Financieringsregeling Algemene Kinderbijslagwet.'
    url: https://wetten.overheid.nl/BWBR0009501/2002-02-23#Artikel10
