articles:
  - number: '1'
    text: |-
      In dit Besluit wordt verstaan onder:

      a. de commissie: de Evaluatiecommissie Regeling Geordende en Toegankelijke Staat Archiefbescheiden;

      b. de regeling: de
      [Regeling Geordende en Toegankelijke Staat Archiefbescheiden ex artikel 12 Archiefbesluit 1995][ref1];

      c. de staatssecretaris: de Staatssecretaris van Cultuur, in dezen vertegenwoordigd door het Nationaal Archief.


      [ref1]: https://wetten.overheid.nl/BWBR0013439
    url: https://wetten.overheid.nl/BWBR0017768/2004-12-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013439
  - number: '2'
    text: Er is een Evaluatiecommissie Regeling Geordende en Toegankelijke Staat Archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0017768/2004-12-29#Artikel2
  - number: '3'
    text: |-
      De commissie heeft ten minste tot taak:

      a. het beoordelen van de actualiteitswaarde van de regeling;

      b. het toetsen van de in de regeling opgenomen normen en standaarden op adequaatheid uitvoerbaarheid, effectiviteit
      en handhaafbaarheid;

      c. het adviseren omtrent wijziging en aanvulling van de gehele regeling.
    url: https://wetten.overheid.nl/BWBR0017768/2004-12-29#Artikel3
  - number: '4'
    text: |-
      Samenstelling van de commissie:

      a. de commissie bestaat uit minimaal 3 en maximaal 6 leden;

      b. de leden van de commissie worden door de staatssecretaris benoemd voor de periode van twee jaar;

      c. aftredende leden kunnen ten hoogste eenmaal worden herbenoemd;

      d. de commissie benoemt uit haar leden een voorzitter en een plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0017768/2004-12-29#Artikel4
  - number: '5'
    text: |-
      Bijeenkomen van de commissie:

      a. de commissie vergadert tenminste vier maal per jaar;

      b. de commissie wordt door de voorzitter bijeengeroepen;

      c. de vergaderingen van de commissie zijn openbaar;

      d. in geval van belet of ontsteltenis van een vast lid neemt een plaatsvervangend lid met toestemming van de
      overige leden van de commissie aan de bijeenkomsten van genoemde commissie deel.
    url: https://wetten.overheid.nl/BWBR0017768/2004-12-29#Artikel5
  - number: '6'
    text: |-
      De werkwijze en het tijdstraject van de commissie zijn als volgt bepaald:

      a. na het eerste jaar wordt een concept-advies uitgebracht, waarin worden opgenomen de voorlopige bevindingen en
      aanbevelingen betreffende het genoemde in [artikel 3][ref1];

      b. In het tweede jaar worden de bevindingen, zoals weergegeven in het concept-advies, nader uitgewerkt;

      c. Aan het einde van het tweede jaar wordt door de commissie een definitief advies uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0017768#Artikel3
    url: https://wetten.overheid.nl/BWBR0017768/2004-12-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017768
        artikel: '3'
  - number: '7'
    text: |-
      Besluitvorming in de commissie:

      a. de commissie besluit bij meerderheid van stemmen;

      b. besluiten worden slechts genomen, indien meer dan de helft van de leden aanwezig is;

      c. Indien de stemmen staken is de stem van de voorzitter bepalend.
    url: https://wetten.overheid.nl/BWBR0017768/2004-12-29#Artikel7
  - number: '8'
    text: |-
      Secretariaat en archiefbeheer:

      a. in het secretariaat van de commissie wordt door de staatssecretaris voorzien;

      b. het beheer van de bescheiden betreffende de werkzaamheden van de commissie geschiedt op overeenkomstige wijze
      als bij het Nationaal Archief;

      c. de bescheiden worden bij opheffing van de commissie opgenomen in het archief van het Nationaal Archief;

      d. in de juridische ondersteuning zal door het Nationaal Archief worden voorzien.
    url: https://wetten.overheid.nl/BWBR0017768/2004-12-29#Artikel8
  - number: '9'
    text: |-
      Met het oog op de uitoefening van haar taak stelt de commissie, met inachtneming van het bepaalde in dit Besluit,
      ten behoeve van haar interne werkwijze een reglement in.
    url: https://wetten.overheid.nl/BWBR0017768/2004-12-29#Artikel9
  - number: '10'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0017768/2004-12-29#Artikel10
