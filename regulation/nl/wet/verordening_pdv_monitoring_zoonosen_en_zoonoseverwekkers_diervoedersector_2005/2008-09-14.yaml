preamble:
  text: |-
    Gezien Verordening (EG) nr. 2160/2003 van het Europees Parlement en de raad van de Europese Unie van 17 november
    2003 inzake de bestrijding van salmonella en andere specifieke door voedsel overgedragen zoönoseverwekkers (PbEU L
    325) en Richtlijn 2003/99/EG van het Europees Parlement en de Raad van de Europese Unie van 17 november 2003 inzake
    de bewaking va zoönoseverwekkers en houdende wijziging van Beschikking 90/424/EEG van de raad en intrekking van
    Richtlijn 92/117/EEG van de Raad (PbEU L 325);

    Gelet op artikel 9a, eerste lid van de Regeling aanvullende voorschriften besmettelijke dierziekten en zoönosen;

    Gelet op de artikelen 96 en 104 van de Wet op de bedrijfsorganisatie en artikel 12 van het Instellingsbesluit
    akkerbouwproductschappen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018025/2008-09-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt verstaan onder:









                  a. productschap


                  :


                  Productschap Diervoeder;




                  b. bestuur


                  :


                  het bestuur van het productschap;




                  c. voorzitter


                  :


                  de voorzitter van het productschap;




                  d. ondernemer


                  :


                  leverancier van voedermiddelen en mengvoederbereider;




                  e. Salmonella


                  :


                  alle typen Salmonella.
    url: https://wetten.overheid.nl/BWBR0018025/2008-09-14#Artikel1
  - number: '2'
    text: |-
      1 Iedere ondernemer is verplicht de af te leveren voedermiddelen en de mengvoeders en voedermiddelen bestemd voor
      de (pluim-)veehouderijbedrijven door middel van monsterneming te onderzoeken op de aanwezigheid van Salmonella.

      2 Het in het eerste lid bedoelde onderzoek geschiedt overeenkomstig het door het bestuur bij besluit vastgesteld
      Programma “monitoring salmonella in de diervoedersector”.

      3 De monsters dienen te worden onderzocht door een erkend laboratorium, dat wordt aangewezen door de voorzitter, op
      basis van door het bestuur bij besluit vast te stellen erkenningsvoorwaarden.

      4 De ondernemer is verplicht de uitslag van het onderzoek, bedoeld in het eerste lid, twee jaar te bewaren.

      5 Een monster waarbij Salmonella is geconstateerd dient te allen tijde nader te worden geserotypeerd.
    url: https://wetten.overheid.nl/BWBR0018025/2008-09-14#Artikel2
  - number: '3'
    text: |-
      1 De ondernemer is verplicht de informatie die is verkregen door het onderzoek, bedoeld in
      [artikel 2, eerste lid][ref1], maandelijks door te geven aan het productschap.

      2 De bereider en de leverancier van pluimveevoeder is verplicht, indien uit het onderzoek, bedoeld in
      [artikel 2, eerste lid][ref2], blijkt dat er een positieve salmonella-analyse is, dit zo snel mogelijk door te
      geven aan de pluimveehouder. Hij is ook verplicht om onverwijld een salmonellatypering uit te laten voeren en het
      resultaat hiervan aan de pluimveehouder door te geven.

      3 De ondernemer is verplicht de in het tweede lid bedoelde gegevens ook onverwijld aan het productschap door te
      geven door invoering ervan in de Databank ongewenste stoffen (DOS).


      [ref1]: https://wetten.overheid.nl/BWBR0018025#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018025#Artikel2
