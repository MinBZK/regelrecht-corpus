      1 De gemeenten hebben tot taak de bevordering van de inschakeling in het arbeidsproces van arbeidsgehandicapten
      die:

      a. recht hebben op een uitkering op grond van de [Wet werk en bijstand][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3], de
      [Wet werk en inkomen kunstenaars][ref4] of de [Algemene nabestaandenwet][ref5] en niet tevens recht hebben op een
      uitkering als bedoeld in [artikel 10, eerste lid][ref6];

      b. als werkzoekende bij de Centrale organisatie werk en inkomen zijn geregistreerd en niet worden bedoeld in
      onderdeel a, of [artikel 10][ref7] en [11][ref8].

      2 Uit hoofde van de uitoefening van de taak, bedoeld in het eerste lid, verstrekt het gemeentebestuur voorzieningen
      als bedoeld in [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref9] gericht op behoud, herstel
      of bevordering van de mogelijkheid tot het verrichten van arbeid.


