  - number: '35'
    text: |-
      1 De voorziening of de kosten van de voorziening, bedoeld in [artikel 22][ref1] en [31][ref2], de toelage,
      bedoeld in [artikel 28][ref3], de inkomenssuppletie, bedoeld in [artikel 29][ref4] en de loonsuppletie, bedoeld in
      [artikel 32][ref5], die als gevolg van een besluit als bedoeld in [artikel 34][ref6] onverschuldigd zijn verstrekt
      worden door het Uitvoeringsinstituut werknemersverzekeringen teruggevorderd.

      2 Subsidies als bedoeld in [artikel 30][ref7], [33][ref8] of [33a][ref9] die onverschuldigd zijn betaald, worden
      door het Uitvoeringsinstituut werknemersverzekeringen teruggevorderd.

      3 Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van terugvordering af te zien.

      4 Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd en de termijn of de termijnen waarbinnen
      moet worden betaald, alsmede dat het besluit bij gebreke van tijdige betaling zal worden tenuitvoergelegd op de
      wijze als omschreven in het zesde en zevende lid.

      5 De persoon van wie wordt teruggevorderd is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de terugvordering van belang zijn.

      6 Het besluit tot terugvordering levert een executoriale titel op in de zin van het [Tweede Boek van het Wetboek
      van Burgerlijke Rechtsvordering](onbekend).

      7 [Artikel 29g van de WAO][ref10] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld
      inkomen van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref11] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref12] niet te boven is gegaan, het Uitvoeringsinstituut
      werknemersverzekeringen de aflossingsbedragen lager vaststelt.

      8 Bij ministeriële regeling worden regels gesteld met betrekking tot de terugvordering en de tenuitvoerlegging van
      besluiten tot terugvordering als bedoeld in dit artikel.

      9 In afwijking van het eerste en tweede lid, kan het Uitvoeringsinstituut werknemersverzekeringen, onder
      voorwaarden die Onze Minister kan stellen, besluiten van terugvordering af te zien indien het terug te vorderen
      bedrag een door Onze Minister vast te stellen bedrag niet te boven gaat.


