  - number: '3'
    text: |-
      1 De vaststelling, bedoeld in [artikel 2, derde lid][ref1], geschiedt door het Uitvoeringsinstituut
      werknemersverzekeringen ten aanzien van de persoon die:

      a. recht heeft op doorbetaling van loon als bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref2],
      na daarover geadviseerd te zijn door de persoon, bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref3], die belast is met de taken,
      bedoeld in [artikel 14, eerste lid, onderdeel b, van die wet][ref4], die door de werkgever is
      ingeschakeld of de arbodienst van de werkgever die het loon bij ziekte van de werknemer doorbetaalt,
      in welk advies wordt aangegeven of de werknemer, naar het oordeel de persoon, bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref5], voor zover die belast is met de taken,
      bedoeld in [artikel 14, eerste lid, onderdeel b, van die wet][ref6] of de arbodienst, arbeidsgehandicapt is, met
      toepassing van een voorziening de eigen arbeid kan blijven verrichten, of bij dezelfde werkgever, al dan niet met
      toepassing van een voorziening, in een andere functie arbeid kan verrichten;

      b. recht heeft op een uitkering op grond van de [ZW][ref7], de [WW][ref8] of de [WBIA][ref9];

      c. verzekerd is op grond van de [WAZ][ref10];

      d. ingezetene is als bedoeld in [artikel 3 van de WAJONG][ref11] en de leeftijd van 18 jaar nog niet heeft bereikt;

      e. als overheidswerknemer als bedoeld in
      [artikel 1, onderdeel l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref12], recht heeft
      op bezoldiging of uitkering ingeval van ziekte als bedoeld in [artikel 1, onderdeel e, van die wet][ref13], na
      daarover op overeenkomstige wijze als bedoeld in onderdeel a, geadviseerd te zijn door de persoon, bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref14], die belast is met de taken, bedoeld in
      [artikel 14, eerste lid, onderdeel b, van die wet][ref15], die door de werkgever is ingeschakeld of de arbodienst
      van de werkgever die de bezoldiging of de uitkering bij ziekte van de werknemer betaalt;

      f. als gewezen overheidswerknemer recht heeft op bezoldiging of uitkering in geval van ziekte als bedoeld in
      [artikel 1, onderdeel e, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref16] of recht heeft op
      een wachtgeld als bedoeld in [artikel 1, onderdeel r, van die wet][ref17].

      2 De vaststelling, bedoeld in [artikel 2, derde lid][ref18], ten aanzien van de persoon die
      uitsluitend recht heeft op een uitkering op grond van de [Wet werk en bijstand][ref19], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref20], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref21] of de
      [Wet werk en inkomen kunstenaars][ref22] geschiedt door het gemeentebestuur van de gemeente, waarin die persoon
      woonachtig is.

      3 De vaststelling, bedoeld in [artikel 2, derde lid][ref23], ten aanzien van de persoon die uitsluitend recht
      heeft op een uitkering op grond van de [Algemene nabestaandenwet][ref24] en ten aanzien van de persoon voor
      wie de vaststelling, bedoeld in [artikel 2, derde lid][ref25], niet is opgedragen aan het Uitvoeringsinstituut
      werknemersverzekeringen of de gemeenten geschiedt door het gemeentebestuur van de gemeente, waarin hij woonachtig
      is, indien hij als werkloos werkzoekende bij de Centrale organisatie werk en inkomen is geregistreerd.


