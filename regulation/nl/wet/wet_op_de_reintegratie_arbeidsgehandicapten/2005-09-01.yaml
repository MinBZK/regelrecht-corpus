  - number: '21'
    text: |-
      1 Subsidies als bedoeld in [artikel 16][ref1] die onverschuldigd zijn betaald, worden door het Uitvoeringsinstituut
      werknemersverzekeringen teruggevorderd.

      2 Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van terugvordering af te zien.

      3 Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd en de termijn of de termijnen waarbinnen
      moet worden betaald.

      4 De persoon van wie wordt teruggevorderd is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de terugvordering van belang zijn.

      5 Het besluit tot terugvordering levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref2].

      6 [Artikel 29g, vijfde tot en met tiende lid, van de WAO][ref3] is van overeenkomstige toepassing, met dien
      verstande dat indien het gemiddeld inkomen van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in
      de [artikelen 475c][ref4] en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref5] niet te boven is gegaan,
      het Uitvoeringsinstituut werknemersverzekeringen de aflossingsbedragen lager vaststelt.

      7 Bij ministeriële regeling worden regels gesteld met betrekking tot de terugvordering en de tenuitvoerlegging van
      besluiten tot terugvordering als bedoeld in dit artikel.

      8 In afwijking van het eerste lid, kan het Uitvoeringsinstituut werknemersverzekeringen, onder voorwaarden die Onze
      Minister kan stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze
      Minister vast te stellen bedrag niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0001827
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel29g
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
