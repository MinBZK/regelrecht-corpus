  - number: '31'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan aan de arbeidsgehandicapte die arbeid in dienstbetrekking
      verricht op aanvraag voorzieningen toekennen die strekken tot behoud, herstel of bevordering van de mogelijkheid
      tot het verrichten van arbeid.

      2 Onder voorzieningen als bedoeld in het eerste lid, worden uitsluitend verstaan:

      a. vervoersvoorzieningen die er toe strekken dat de arbeidsgehandicapte werknemer zijn werkplek kan bereiken;

      b. noodzakelijke persoonlijke ondersteuning van de werknemer, bedoeld in het eerste lid, bij het verrichten van
      de hem opgedragen taken, indien die ondersteuning een compensatie vormt voor specifiek met de handicap van de
      werknemer samenhangende beperkingen;

      c. communicatievoorzieningen voor doven;

      d. meeneembare voorzieningen ten behoeve van de inrichting van de arbeidsplaats, de productie- en werkmethoden, en
      de bij de arbeid te gebruiken hulpmiddelen die in overwegende mate op het individu van de werknemer zijn afgestemd.

      3 Het Uitvoeringsinstituut werknemersverzekeringen kan aan de persoon, bedoeld in het eerste lid, op aanvraag
      vervoersvoorzieningen toekennen die strekken tot verbetering van zijn leefomstandigheden en die deel uitmaken van
      danwel rechtstreeks samenhangen met voorzieningen als bedoeld in het tweede lid, onderdeel a.

      4 Onder arbeidsgehandicapte als bedoeld in het eerste lid, wordt voor de toepassing van dit artikel mede verstaan,
      de arbeidsgehandicapte, bedoeld in [artikel 10][ref1], die arbeid in dienstbetrekking gaat verrichten.

      5 Bij of krachtens algemene maatregel van bestuur worden met betrekking tot dit artikel nadere regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel31
