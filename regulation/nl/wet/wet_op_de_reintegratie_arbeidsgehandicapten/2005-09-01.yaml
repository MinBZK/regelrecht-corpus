  - number: 87c
    text: |-
      1 Ten aanzien van de persoon wiens eerste dag van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte
      is gelegen voor 1 januari 2004 blijft [artikel 5, tweede lid][ref1], van toepassing zoals deze luidde op 31
      december 2003.

      2 Voor de bepaling van de eerste dag van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte,
      zwangerschap of bevalling, bedoeld in het eerste lid, worden perioden van ongeschiktheid tot werken geacht
      eenzelfde, niet onderbroken periode van ongeschiktheid te vormen, indien zij elkaar met een onderbreking
      van minder dan vier weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een periode waarin
      uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref2], [3:8][ref3] of
      [3:10, eerste lid, van de Wet arbeid en zorg][ref4], tenzij de ongeschiktheid redelijkerwijs niet geacht kan worden
      voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel5
