  - number: '43'
    text: |-
      1 Ten laste van het Reïntegratiefonds komen de kosten verband houdende met de uitvoering van [artikel 10][ref1] en
      [11][ref2] en de door het Uitvoeringsinstituut werknemersverzekeringen verstrekte of toegekende:

      a. subsidies, bedoeld in de [artikelen 16][ref3], [30][ref4], [33][ref5] en [33a][ref6] of overeenkomsten bedoeld
      in [artikel 33][ref7] dan wel [33a, eerste lid, onderdeel b][ref8];

      b. voorzieningen, bedoeld in [artikel 22][ref9] en [31][ref10] en tegemoetkoming in de kosten van kinderopvang als
      bedoeld in [artikel 29, eerste lid, van de Wet kinderopvang][ref11] ten behoeve van de ouder die een persoon is als
      bedoeld in [artikel 6, eerste lid, onder i, van die wet][ref12];

      c.

      d. toelagen, bedoeld in [artikel 28][ref13], alsmede de op grond van enige wet over deze toelagen verschuldigde
      premies die niet op deze toelagen in mindering kunnen worden gebracht;

      e. inkomenssuppletie, bedoeld in [artikel 29][ref14], alsmede de op grond van enige wet over deze suppletie
      verschuldigde premies die niet op deze suppletie in mindering kunnen worden gebracht;

      f. loonsuppletie, bedoeld in [artikel 32][ref15], alsmede de op grond van enige wet over deze suppletie
      verschuldigde premies die niet op deze suppletie in mindering kunnen worden gebracht;

      g. uitkeringen, bedoeld in [artikel 29b van de ZW][ref16], alsmede de op grond van enige wet over deze uitkeringen
      verschuldigde premies die niet op deze uitkeringen in mindering kunnen worden gebracht;

      h. gelden, bedoeld in [artikel 40][ref17].

      2 Vergoedingen aan gemeenten die worden overeengekomen ter uitvoering van [artikel 14, eerste lid][ref18], komen
      tevens ten laste van het Reïntegratiefonds.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld.


