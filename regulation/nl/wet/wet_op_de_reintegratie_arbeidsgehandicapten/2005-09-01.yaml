  - number: '33'
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld op grond waarvan het Landelijk instituut sociale
      verzekeringen aan de arbeidsgehandicapte, bedoeld in [artikel 22][ref1], en aan de arbeidsgehandicapte werknemer,
      bedoeld in [artikel 31][ref2], op aanvraag in plaats van bij die regeling vast te stellen reïntegratie-instrumenten
      als bedoeld in dit hoofdstuk, een subsidie verstrekt in de vorm van een op de arbeidsinschakeling gericht
      persoonsgebonden reïntegratiebudget. In deze regeling kunnen regels worden gesteld omtrent de aard en de omvang van
      de activiteiten en de aan de subsidie te verbinden verplichtingen.

      2 Een ministeriële regeling als bedoeld in het eerste lid treedt niet eerder in werking dan vier weken nadat een
      ontwerp daartoe aan beide kamers der Staten-Generaal is voorgelegd.

      3 Onze Minister zendt binnen vier jaar na de inwerkingtreding van een ministeriële regeling als bedoeld in het
      eerste lid, aan beide Kamers der Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
