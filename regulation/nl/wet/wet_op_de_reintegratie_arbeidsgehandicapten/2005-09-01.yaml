      1 [Artikel 29b van de ZW][ref1], zoals dit artikel luidde op de dag voorafgaand aan de inwerkingtreding van deze
      wet, blijft van toepassing op de persoon die geen arbeidsgehandicapte is als bedoeld in [artikel 2][ref2].

      2 In afwijking van het eerste lid blijft [artikel 29b van de ZW][ref3], zoals dat artikel luidde voorafgaand aan de
      inwerkingtreding van deze wet, niet van toepassing op de persoon, die werkzaam is in een dienstbetrekking in de zin
      van de [WSW][ref4], die is aangevangen voorafgaand aan de dag waarop deze wet in werking treedt.

      3 [Artikel 29b van de ZW][ref5] is niet van toepassing, indien de dienstbetrekking met de in het eerste lid van
      dat artikel bedoelde werknemer is aangevangen voorafgaand aan de dag waarop deze wet in werking treedt en op die
      werknemer [artikel 29b van de ZW][ref6], zoals dat artikel luidde voorafgaand aan de inwerkingtreding van deze wet,
      niet van toepassing was.


