  - number: '76'
    text: |-
      1 [Artikel 60 van de WAO][ref1] en de daarop berustende bepalingen, zoals deze luidden op de dag voorafgaand aan
      de inwerkingtreding van deze wet, blijven van toepassing op de persoon aan wie vóór die datum loonsuppletie is
      toegekend, zolang die suppletie duurt.

      2 [Artikel 62 van de WAO][ref2] en de daarop berustende bepalingen, zoals deze luidden op de dag voorafgaand aan de
      inwerkingtreding van deze wet, blijven van toepassing op de werkgever aan wie vóór die datum een loonkostensubsidie
      is toegekend, zolang die subsidie duurt.

      3 [Artikel 63 van de WAO][ref3] en de daarop berustende bepalingen, zoals deze luidden op de dag voorafgaand aan
      de inwerkingtreding van deze wet, blijven van toepassing op de persoon aan wie vóór die datum een reïntegratie-
      uitkering is toegekend, zolang de in het vijfde lid van dat artikel bedoelde periode van ten hoogste drie maanden
      niet is verstreken.

      4 [Artikel 64 van de WAO][ref4], zoals dit artikel luidde op de dag voorafgaand aan de inwerkingtreding van deze
      wet, blijft van toepassing op de financiering van de kosten van opleiding of scholing die vóór die datum door
      het Uitvoeringsinstituut werknemersverzekeringen werden gefinancierd, zolang die financiering niet geheel heeft
      plaatsgevonden.


