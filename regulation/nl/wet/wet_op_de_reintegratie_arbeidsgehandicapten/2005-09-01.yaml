  - number: '9'
    text: |-
      1 De werkgever past uit hoofde van de uitoefening van zijn taak, bedoeld in [artikel 8][ref1], de samenstelling en
      toewijzing van de arbeid, de inrichting van de arbeidsplaatsen, de productie- en werkmethoden en de bij de arbeid
      te gebruiken hulpmiddelen aan de in [artikel 8, eerste lid][ref2], bedoelde werknemer aan en past de inrichting
      van het bedrijf aan, voorzover de behoefte daaraan wordt opgeroepen door de deelneming van die werknemer aan de
      werkzaamheden of het daarmee samenhangende verblijf in het bedrijf.

      2 Onze Minister kan aan een werkgever een eis stellen betreffende de wijze waarop de verplichting, bedoeld in het
      eerste lid, wordt nageleefd. [Artikel 27, tweede, derde en zesde lid, van de Arbeidsomstandighedenwet 1998][ref3]
      is van overeenkomstige toepassing.

      3 Met het toezicht op de naleving van de in het eerste lid bedoelde verplichting en van een aan een werkgever
      gestelde eis als bedoeld in het tweede lid, zijn belast de bij besluit van Onze Minister aangewezen onder hem
      ressorterende ambtenaren. Van dat besluit wordt mededeling gedaan door plaatsing in de Staatscourant.

      4 Voor de toepassing van dit artikel wordt onder werkgever mede verstaan de eigenrisicodrager, bedoeld in
      [artikel 8, twaalfde lid][ref4], en wordt onder werknemer, bedoeld in [artikel 8, eerste lid][ref5], mede verstaan
      de persoon, bedoeld in [artikel 8, twaalfde lid][ref6], aan wie de eigenrisicodrager ziekengeld moet betalen.


