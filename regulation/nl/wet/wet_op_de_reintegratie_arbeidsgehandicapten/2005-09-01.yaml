  - number: '44'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt ten laste van het Reïntegratiefonds per kalenderjaar
      aan door Onze Minister aan te wijzen scholingsinstituten die ten doel hebben de arbeidsintegratie van
      arbeidsgehandicapten te bevorderen, een subsidie ter hoogte van een bij ministeriële regeling te bepalen bedrag.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan in het belang van deze wet ten laste van het
      Reïntegratiefonds subsidie verstrekken aan andere instellingen of organisaties, dan de scholingsinstituten, bedoeld
      in het eerste lid, die ten doel hebben het nemen of bevorderen van maatregelen, die strekken tot behoud, herstel of
      bevordering van de mogelijkheid tot het verrichten van arbeid.

      3 Het Uitvoeringsorgaan werknemersverzekeringen kan bij de subsidieverlening, bedoeld in het eerste of het
      tweede lid, aan de subsidie-ontvanger verplichtingen opleggen omtrent vermogensvorming, het hanteren van een
      registratiesysteem waaruit blijkt of het doel van de subsidie is bereikt en de vergoeding van met subsidie behaald
      vermogensvoordeel.
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel44
  - number: 44a
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, zo dikwijls hij zulks nodig oordeelt personen oproepen ten
      aanzien van wie of ten behoeve van wie instrumenten als bedoeld in [hoofdstuk 3][ref1] of [4][ref2] zijn toegekend
      of waarvan toekenning wordt overwogen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009565
        hoofdstuk: '4'
  - number: '45'
    text: |-
      De persoon, of diens wettelijk vertegenwoordiger, aan wie een reïntegratie-instrument als bedoeld in
      [hoofdstuk 3][ref1] of [hoofdstuk 4][ref2] is verstrekt of toegekend, of aan wie verstrekking of toekenning
      daarvan wordt overwogen, is verplicht het Uitvoeringsinstituut werknemersverzekeringen op zijn verzoek of uit eigen
      beweging alle feiten en omstandigheden mede te delen, waarvan hem redelijkerwijs duidelijk moet zijn dat zij van
      invloed kunnen zijn op de verstrekking of toekenning of op de duur of de hoogte van het reïntegratie-instrument.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0009565
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009565
        hoofdstuk: '4'
  - number: '46'
    text: |-
      1 Aan de persoon die de verplichting, bedoeld in [artikel 45][ref1] niet of niet behoorlijk is nagekomen, wordt
      door het Uitvoeringsinstituut werknemersverzekeringen een boete opgelegd van ten hoogste € 2 269.

      2 De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de belanghebbende de
      gedraging verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een boete wordt in elk
      geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.

      3 Indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 45][ref2], niet heeft geleid
      tot het ten onrechte of tot een te hoog bedrag toekennen of verstrekken van een reïntegratie-instrument, kan het
      Uitvoeringsinstituut werknemersverzekeringen afzien van het opleggen van een boete en volstaan met het geven van
      een schriftelijke waarschuwing ter zake van het niet of niet behoorlijk nakomen van de verplichting, tenzij het
      niet of niet behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf
      de datum waarop eerder aan de belanghebbende een zodanige waarschuwing is gegeven.

      4 Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      van het opleggen van een boete af te zien.

      5 De persoon aan wie een boete is opgelegd is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.

      6 Voorzover de boete nog niet is geïnd vervalt zij door het overlijden van de persoon aan wie zij is opgelegd.

      7 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en het
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel45
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel46
