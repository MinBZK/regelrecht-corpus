      a. de voorzieningen, bedoeld in [artikel 22][ref1] en [31][ref2];

      b.

      c. de toelage, bedoeld in [artikel 28][ref3];

      d. de inkomenssuppletie, bedoeld in [artikel 29][ref4];

      e. de gelden, bedoeld in [artikel 30][ref5];

      f. de loonsuppletie, bedoeld in [artikel 32][ref6].

      2 Volmacht tot ontvangst van een uitkering onder welke vorm of benaming ook verleend, is steeds herroepelijk.

      3 Elk beding, strijdig met dit artikel, is nietig.


