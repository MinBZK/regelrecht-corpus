    text: |-
      1 Indien het Uitvoeringsinstituut werknemersverzekeringen ter uitvoering van de taak, bedoeld in
      [artikel 10, eerste lid][ref1], of [artikel 11][ref2], voor een arbeidsgehandicapte, die recht heeft op uitkering
      op grond van de [WAO][ref3], de [WAZ][ref4] of de [WAJONG][ref5], die niet tevens recht heeft op uitkering op grond
      van [hoofdstuk IIa](onbekend) of [IIb van de WW](onbekend) een plan heeft opgesteld of laten opstellen, gericht op
      behoud, herstel of bevordering van de mogelijkheid tot het verrichten van arbeid, tekent die arbeidsgehandicapte,
      een exemplaar van dat plan voor gezien en verstrekt dit aan het instituut. Het plan wordt tevens getekend door het
      Uitvoeringsinstituut werknemersverzekeringen.

      2 Indien een plan als bedoeld in het eerste lid is opgesteld, en in het besluit tot toekenning of herziening
      van een arbeidsongeschiktheidsuitkering op grond van de in het eerste lid bedoelde wetten wordt verwezen naar
      voorschriften in het belang van behoud, herstel en bevordering van de mogelijkheid tot het verrichten van arbeid,
      wordt dit plan in een bijlage bij dat besluit opgenomen.


