  - number: '14'
    text: |-
      1 Artikel 10 is niet van toepassing op arbeidsgehandicapten die recht hebben op een uitkering op grond van
      de [WAO][ref1], de [WAZ][ref2] of de [WAJONG][ref3], die niet tevens recht hebben op uitkering op grond
      van [hoofdstuk IIa][ref4] of [IIb van de WW][ref5], indien het Uitvoeringsinstituut werknemersverzekeringen
      met het college van burgemeester en wethouders van een gemeente overeenkomt dat op die arbeidsgehandicapten
      [artikel 7, eerste lid, aanhef en onderdeel a, van de Wet werk en bijstand][ref6] van toepassing is.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de overgang van de taak
      van de werkgever op grond van [artikel 8][ref7], op het Uitvoeringsinstituut werknemersverzekeringen op grond
      van [artikel 10][ref8] of op de gemeenten op grond van [artikel 12][ref9], alsmede voor het geval dat voor een
      arbeidsgehandicapte werknemer meerdere werkgevers verantwoordelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
