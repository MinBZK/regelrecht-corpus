  - number: '2'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt onder arbeidsgehandicapte verstaan:

      a. de persoon die recht heeft op een arbeidsongeschiktheidsuitkering op grond van de [WAO][ref1], de [WAZ][ref2] of
      de [WAJONG][ref3];

      b. de persoon aan wie op grond van een wettelijk voorschrift in verband met ziekte of gebrek een voorziening is
      toegekend die strekt tot behoud, herstel of bevordering van de mogelijkheid tot het verrichten van arbeid of ten
      behoeve van wie een subsidie voor met een voorziening verband houdende kosten is verstrekt;

      c. de persoon die bij indicatiebeschikking of herindicatiebeschikking op grond van de [WSW][ref4] behoort tot
      de doelgroep voor de [WSW][ref5], doch niet werkzaam is als werknemer in de zin van de [WSW][ref6] of op een
      arbeidsovereenkomst als bedoeld in [artikel 7 van de WSW][ref7];

      d. voor de duur van vijf jaar na de datum van beëindiging van een dienstbetrekking op grond van de [WSW][ref8], de
      persoon die arbeid heeft verricht op grond van de [WSW][ref9];

      e. voor de duur van vijf jaar na de datum van een herindicatiebeschikking op grond van de [WSW][ref10], de persoon
      die na herindicatie niet meer behoort tot de doelgroep van de [WSW][ref11].

      2 De persoon, bedoeld in het eerste lid, onderdeel a of b, blijft arbeidsgehandicapte in de zin van deze wet voor
      de periode van vijf jaar na de datum waarop de arbeidsongeschiktheidsuitkering, bedoeld in onderdeel a, in verband
      met vermindering van de arbeidsongeschiktheid of de voorziening, bedoeld in onderdeel b, is geëindigd.

      3 In deze wet en de daarop berustende bepalingen wordt tevens onder arbeidsgehandicapte verstaan, de persoon die
      niet behoort tot een categorie van personen als bedoeld in het eerste en tweede lid, doch ten aanzien van wie
      op grond van een medisch-arbeidskundige beoordeling is vastgesteld, dat hij in verband met ziekte of gebrek een
      belemmering heeft bij het verkrijgen of verrichten van arbeid.

      4 De persoon, bedoeld in het derde lid, blijft gedurende een periode van vijf jaar te rekenen vanaf de datum van
      het intreden van de arbeidshandicap, arbeidsgehandicapte in de zin van deze wet. Onmiddellijk na afloop van deze
      periode wordt opnieuw vastgesteld of hij in verband met ziekte of gebrek een belemmering heeft bij het verkrijgen
      of verrichten van arbeid.

      5 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt niet als arbeidsgehandicapte aangemerkt:

      a. de persoon, bedoeld in het eerste tot en met vierde lid, vanaf de eerste dag van de maand waarin hij de leeftijd
      van 65 jaar bereikt;

      b. de persoon die werkzaam is als werknemer in de zin van de [WSW][ref12] of op een arbeidsovereenkomst als bedoeld
      in [artikel 7 van de WSW][ref13].

      6 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het derde lid.


