  - number: '22'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan aan de arbeidsgehandicapte, bedoeld in [artikel 10][ref1],
      op aanvraag of ambtshalve voorzieningen toekennen die strekken tot behoud, herstel of bevordering van de
      mogelijkheid tot het verrichten van arbeid.

      2 Onder voorzieningen als bedoeld in het eerste lid, worden in ieder geval verstaan:

      a. scholing of opleiding;

      b. voorzieningen die noodzakelijk zijn voor het kunnen volgen van scholing of opleiding als bedoeld in onderdeel a;

      c. voorzieningen die noodzakelijk zijn voor het kunnen verrichten van onbeloonde werkzaamheden op een proefplaats
      bij een werkgever en voor het kunnen deelnemen aan andere activiteiten die bevorderlijk zijn voor de inschakeling
      in de arbeid.

      3 Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de arbeidsgehandicapte, bedoeld in
      [artikel 10, eerste lid, onderdeel b][ref2], andere voorzieningen toekennen die strekken tot behoud, herstel of
      bevordering van de mogelijkheid tot het verrichten van arbeid dan de voorzieningen, bedoeld in het tweede lid,
      indien zij noodzakelijk zijn voor de uitoefening van de werkzaamheden op grond waarvan de arbeidsgehandicapte
      verzekerd is voor de [WAZ][ref3].

      4 Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de persoon, bedoeld in [artikel 11][ref4]
      voorzieningen toekennen die hem in staat stellen onderwijs te volgen.

      5 Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de persoon, bedoeld in het eerste, derde en
      vierde lid, vervoersvoorzieningen toekennen die strekken tot verbetering van zijn leefomstandigheden en die deel
      uitmaken van danwel rechtstreeks samenhangen met voorzieningen als bedoeld in het tweede lid, onderdeel b en c, het
      derde en het vierde lid.

      6 Onder voorzieningen als bedoeld in dit artikel wordt niet verstaan financiering van, of tegemoetkoming in de
      kosten van, kinderopvang.

      7 Bij of krachtens algemene maatregel van bestuur worden met betrekking tot dit artikel nadere regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel10
