  - number: 87d
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de werkgever, bedoeld in [artikel 8][ref1],
      ten aanzien van de werknemer, wiens eerste dag van ongeschiktheid tot het verrichten van arbeid wegens ziekte is
      gelegen voor 1 januari 2004, met toepassing van [artikel 15][ref2], zoals dit artikel luidde op 31 december 2003,
      subsidie voor noodzakelijk te maken kosten van werkzaamheden verstrekken, indien de aanvraag is ingediend voor 1
      april 2004.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de werkgever, bedoeld in [artikel 8][ref3],
      ten aanzien van de werknemer, wiens eerste dag van ongeschiktheid tot het verrichten van arbeid wegens ziekte is
      gelegen voor 1 januari 2004, met toepassing van [artikel 15][ref4], zoals dit artikel luidde op 31 december 2003,
      een aanvullende subsidie voor noodzakelijk te maken kosten van werkzaamheden, in verband met de indiensttreding van
      zijn arbeidsgehandicapte werknemer bij een andere werkgever, verstrekken, indien de aanvraag is ingediend voor 1
      juli 2005 en een subsidie als bedoeld in het eerste lid is verstrekt.

      3 Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de werkgever, bedoeld in [artikel 8][ref5],
      ten aanzien van de werknemer, wiens eerste dag van ongeschiktheid tot het verrichten van arbeid wegens ziekte is
      gelegen voor 1 januari 2004, met toepassing van [artikel 16][ref6], zoals dit artikel luidde op 31 december 2003,
      subsidie verstrekken voor het totaal van de kosten ten behoeve van die werknemer en verband houdende met kosten
      die voortvloeien uit scholing, training en begeleiding van die werknemer, indien de aanvraag is ingediend voor 1
      april 2004.

      4 Bij algemene maatregel van bestuur kunnen nadere en afwijkende regels worden gesteld omtrent de voorwaarden
      waaronder en het tijdvak waarvoor de subsidie op grond van het eerste, tweede en derde lid wordt verstrekt.


