  - number: '41'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de middelen tot
      dekking van de uitgaven in de vorm van een Reïntegratiefonds dat deel uitmaakt van het Uitvoeringsinstituut
      werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel41
  - number: '42'
    text: |-
      1 De middelen tot dekking van de uitgaven ten laste van het Reïntegratiefonds worden verkregen uit:

      a. bijdragen uit het Arbeidsongeschiktheidsfonds, het Arbeidsongeschiktheidsfonds jonggehandicapten, het Algemeen
      Werkloosheidsfonds en het Uitvoeringsfonds voor de overheid;

      b. de gelden die het Uitvoeringsinstituut werknemersverzekeringen ontvangt door toepassing van [artikel 21][ref1],
      [35][ref2] en [46][ref3].

      2 Bij ministeriële regeling worden de bijdragen, bedoeld in het eerste lid, onderdeel a, en de onderlinge
      verhouding tussen de ten laste van de verschillende fondsen komende bijdragen, bedoeld in dat onderdeel,
      vastgesteld. Bij deze regeling kan worden bepaald dat in de middelen tot dekking van de uitgaven ten laste van
      het Reïntegratiefonds mede wordt voorzien door het Rijk en kunnen nadere regels worden gesteld in verband met de
      besteding van die Rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel46
