      1 Na inwerkingtreding van deze wet komen ten laste van het Reïntegratiefonds:

      a. de op grond van artikel 57, 57a, 58 en 59b van de AAW toegekende voorzieningen, vergoedingen, toelagen en
      inkomenssuppleties, bedoeld in [artikel 75][ref1];

      b. de op grond van [artikel 60][ref2], [62][ref3], [63][ref4] en [64 van de WAO][ref5] toegekende loonsuppleties,
      loonkostensubsidies, reïntegratie-uitkeringen en kosten van scholing of opleiding, bedoeld in [artikel 76][ref6].

      2 De middelen tot dekking van de uitgaven ten laste van het Reïntegratiefonds, bedoeld in het eerste lid, onderdeel
      a, worden verkregen uit een bijdrage uit het Algemeen Arbeidsongeschiktheidsfonds.

      3 De middelen tot dekking van de uitgaven ten laste van het Reïntegratiefonds, bedoeld in het eerste lid, onderdeel
      b, worden verkregen uit een bijdrage uit het Arbeidsongeschiktheidsfonds.


