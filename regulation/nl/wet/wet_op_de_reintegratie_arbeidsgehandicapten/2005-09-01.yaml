  - number: '4'
    text: |-
      1 Werkgevers, organisaties van werkgevers en organisaties van werknemers hebben tot taak, voorzover dat
      redelijkerwijs in hun vermogen ligt, gelijke kansen van arbeidsgehandicapte en niet-arbeidsgehandicapte werknemers
      voor deelname aan het arbeidsproces te bevorderen en de nodige voorzieningen te treffen, gericht op behoud, herstel
      of bevordering van de mogelijkheid tot het verrichten van arbeid van werknemers.

      2 Voor de toepassing van het eerste lid worden onder werknemers mede begrepen diegenen, die beschikbaar zijn of
      door het treffen van voorzieningen beschikbaar kunnen komen voor het als werknemer verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel4
  - number: '5'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat een werkgever, die behoort tot een in die maatregel
      aangewezen tak van bedrijf of beroep of gedeelte daarvan, dan wel onderdeel van de openbare dienst, verplicht is er
      voor zorg te dragen dat het aantal bij hem in dienst zijnde arbeidsgehandicapte werknemers ten minste een bij die
      maatregel te bepalen deel uitmaakt van het totaal van de bij hem in dienst zijnde werknemers. In deze maatregel kan
      het in de eerste zin bedoelde deel niet lager worden gesteld dan 3 per 100 en niet hoger dan 7 per 100.

      2 Bij de berekening of op een bepaalde datum door een werkgever wordt voldaan aan een op grond van het eerste
      lid opgelegde verplichting blijven buiten beschouwing die werknemers die op die datum en in de 104 aan die datum
      voorafgaande weken wegens ziekte of gebreken geen arbeid hebben verricht bij die werkgever. Voor het bepalen van
      de periode van 104 weken, bedoeld in de eerste zin, worden perioden gedurende welke wegens ziekte of gebreken geen
      arbeid werd verricht samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen.

      3 Voorzover een werkgever niet voldoet aan een op grond van het eerste lid opgelegde verplichting, is hij periodiek
      een geldelijke bijdrage verschuldigd, afgestemd op het aantal arbeidsgehandicapte werknemers dat een werkgever in
      dienst zou moeten nemen om aan een op grond van het eerste lid opgelegde verplichting te voldoen.

      4 In de maatregel, bedoeld in het eerste lid:

      a. kunnen werkgevers, waarbij in de regel minder dan een bij de maatregel aangewezen aantal personen werkzaam zijn,
      van de verplichting, bedoeld in het eerste lid, worden uitgezonderd;

      b. kan worden geregeld in hoeverre arbeidsgehandicapte werknemers, met wie een arbeidsduur is overeengekomen die
      korter is dan de normale arbeidsduur, worden meegeteld bij de berekening of wordt voldaan aan een op grond van het
      eerste lid opgelegde verplichting;

      c. kan de hoogte van de in het derde lid bedoelde geldelijke bijdrage worden vastgesteld;

      d. kunnen regels worden gesteld omtrent de vaststelling, invordering en afdracht van de in het derde lid bedoelde
      geldelijke bijdrage;

      e. kunnen regels worden gesteld omtrent een door de werkgever te voeren administratie waaruit kan worden afgeleid
      welke dienstbetrekkingen met arbeidsgehandicapte werknemers bestaan.
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister kan een werkgever ontheffing verlenen van een op grond van [artikel 5, eerste lid][ref1], opgelegde
      verplichting indien te verwachten valt dat de werkgever gedurende langere tijd in redelijkheid niet aan die
      verplichting zal kunnen voldoen.

      2 Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
      Aan een ontheffing kan terugwerkende kracht worden verleend tot aan het tijdstip van de aanvraag. Indien de
      werkgever de aan een ontheffing verbonden voorschriften niet naleeft kan de ontheffing, zo nodig met terugwerkende
      kracht, worden ingetrokken.

      3 Een ontheffing als bedoeld in het eerste lid wordt verleend in overeenstemming met Onze Minister van
      Binnenlandse Zaken indien het de burgerlijke openbare dienst of een onderwijsinstelling als bedoeld in
      [artikel 2, eerste lid, onderdeel b, c, d of e van de Wet privatisering ABP][ref2] betreft, en in overeenstemming
      met Onze Minister van Defensie indien het de militaire dienst betreft.


