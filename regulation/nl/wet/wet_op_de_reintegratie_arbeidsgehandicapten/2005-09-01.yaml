  - number: '7'
    text: |-
      1 Iedere arbeidsgehandicapte werknemer heeft jegens zijn werkgever aanspraak op een geldelijke beloning voor
      de verrichte arbeid die gelijk is aan de geldelijke beloning die een niet arbeidsgehandicapte werknemer in een
      gelijkwaardige functie bij dezelfde arbeidsduur pleegt te ontvangen.

      2 Indien de arbeidsprestatie van een arbeidsgehandicapte werknemer in een bepaalde functie ten gevolge van ziekte
      of gebreken duidelijk minder is dan de arbeidsprestatie, die in de desbetreffende functie als normaal wordt
      beschouwd, vermindert het Uitvoeringsinstituut werknemersverzekeringen op verzoek van de betrokken werkgever of
      werknemer de hoogte van de aanspraak op een geldelijke beloning voor de verrichte arbeid naar evenredigheid, zo
      nodig in afwijking van hetgeen bij en krachtens de Wet minimumloon en minimumvakantiebijslag is bepaald.

      3 Het tweede lid is niet van toepassing op de arbeidsgehandicapte werknemer, werkzaam in openbare dienst. Onder
      openbare dienst worden mede begrepen de instellingen, diensten en bedrijven door de Staat en de openbare lichamen
      beheerd. De geldelijke beloning voor de verrichte arbeid van een arbeidsgehandicapte werknemer, werkzaam in
      openbare dienst, kan in het in het tweede lid bedoelde geval worden verminderd in overeenstemming met de voor de
      werknemer geldende bezoldigingsvoorschriften.

      4 Elk beding waarbij een geldelijke beloning voor de verrichte arbeid wordt overeengekomen die lager is dan de
      beloning die voortvloeit uit het eerste lid, danwel lager is dan de beloning, vastgesteld op grond van het tweede
      of derde lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel7
  - number: '8'
    text: |-
      1 De werkgever bevordert ten aanzien van zijn werknemer die wegens ziekte of gebrek niet in staat is de bedongen
      arbeid te verrichten, de inschakeling in de arbeid in zijn bedrijf en indien vaststaat dat in zijn bedrijf voor
      deze werknemer geen passende arbeid voorhanden is, bevordert de werkgever de inschakeling van deze werknemer in de
      arbeid in het bedrijf van een andere werkgever.

      2 Uit hoofde van de uitoefening van zijn taak, bedoeld in het eerste lid, treft de werkgever maatregelen gericht
      op behoud, herstel of bevordering van de mogelijkheid tot het verrichten van arbeid van zijn in het eerste lid
      bedoelde werknemer.

      3 De verplichting van de werkgever, bedoeld in het eerste lid, geldt in ieder geval voor de duur van de
      dienstbetrekking met de in het eerste lid bedoelde werknemer.

      4 Indien de werkgever aan het Uitvoeringsinstituut werknemersverzekeringen schriftelijk heeft gemeld dat hij
      zijn in het eerste lid bedoelde taak na het einde van de dienstbetrekking van zijn werknemers blijft verrichten
      gedurende een door hem bij die melding aangegeven periode, geldt de verplichting, bedoeld in het eerste lid, na
      het einde van elke dienstbetrekking van zijn vroegere werknemer gedurende die periode. De duur van deze periode
      is ten hoogste zes jaar na de datum waarop de in het eerste lid bedoelde werknemer ongeschikt is geworden tot het
      verrichten van zijn arbeid wegens ziekte of gebrek.

      5 De werkgever laat de werkzaamheden, bedoeld in dit artikel, verrichten door een of meer personen als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1] of een of meer arbodiensten of een natuurlijke
      persoon dan wel rechtspersoon, die in het kader van de uitoefening van beroep of bedrijf de inschakeling van
      personen in de arbeid bevordert.

      6 De werkgever en de persoon, bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref2]
      die door de werkgever is ingeschakeld of de arbodienst van de werkgever verstrekken aan de in het vijfde lid
      bedoelde natuurlijke persoon of rechtspersoon gegevens voorzover deze noodzakelijk zijn voor de uitvoering
      van de in het tweede lid bedoelde werkzaamheden, alsmede het sociaal-fiscaalnummer van de persoon wiens
      inschakeling in de arbeid door die natuurlijke persoon of rechtspersoon wordt bevorderd. Deze natuurlijke
      persoon of rechtspersoon verwerkt de in dit lid bedoelde gegevens slechts voorzover dat noodzakelijk is
      voor de werkzaamheden, bedoeld in het tweede lid, en gebruikt slechts met dat doel het sociaal-fiscaalnummer
      bij die verwerking. Onder sociaal-fiscaalnummer wordt in deze wet verstaan het nummer, bedoeld in
      [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref3].

      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:

      a. de mogelijkheid van verlenging van de in dit artikel bedoelde taak van de werkgever op grond van het vierde lid;

      b. de mogelijkheid van verlenging van de in dit artikel bedoelde taak van de werkgever na het einde van de
      dienstbetrekking in een individueel geval;

      c. de mogelijkheid van beëindiging van de in het vierde lid bedoelde verplichting;

      d. het vijfde en zesde lid;

      e. de verplichtingen van de werkgever in verband met de beëindiging van de dienstbetrekking van de in het eerste
      lid bedoelde werknemer.

      8 Nadat de werkgever op grond van [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref4] een
      reïntegratieverslag heeft opgesteld of aangevuld, houdt de werkgever aantekening bij van het verloop en de
      reïntegratie van de in het eerste lid bedoelde werknemer en de in het vierde lid bedoelde vroegere werknemer
      gedurende de in het derde, vierde en zevende lid, bedoelde periode en stelt hij in die periode jaarlijks uiterlijk
      twaalf maanden na deze opstelling of aanvulling van het reïntegratieverslag opnieuw met de werknemer of vroegere
      werknemer een reïntegratieverslag op en verstrekt hij hiervan afschrift aan de werknemer of vroegere werknemer.

      9 Bij de uitvoering van het achtste lid laat de werkgever zich bijstaan door de persoon, bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref5] of de arbodienst. De werknemer of vroegere
      werknemer verleent zijn medewerking bij het opstellen van het reïntegratieverslag.

      10 Bij ministeriële regeling kunnen regels worden gesteld omtrent het achtste en negende lid.

      11 Dit artikel is niet van toepassing op de werkgever, bedoeld in [artikel 9 van de WAO][ref6].

      12 Zo nodig in afwijking van het elfde lid zijn het eerste, tweede, vijfde, zesde, achtste en negende lid, alsmede
      de regels op grond van het zevende lid, onderdelen d en e, en op grond van het tiende lid, van overeenkomstige
      toepassing op de eigenrisicodrager, bedoeld in [artikel 1, eerste lid, onderdeel h, van de ZW][ref7] en de persoon,
      bedoeld in [artikel 63, eerste lid, van de ZW][ref8], gedurende de periode dat de eigenrisicodrager aan die persoon
      ziekengeld moet betalen.


