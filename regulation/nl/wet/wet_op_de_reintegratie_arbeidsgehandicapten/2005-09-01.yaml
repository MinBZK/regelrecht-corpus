  - number: '16'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag van de werkgever die met een werknemer een
      dienstbetrekking van ten minste zes maanden is aangegaan of waarmee door elkaar opvolgende dienstbetrekkingen
      gedurende ten minste zes maanden een dienstbetrekking blijkt te bestaan, subsidie verstrekken voor meerkosten
      voorzover:

      a. die werkgever aantoont dat het totaal van de kosten die hij maakt of heeft gemaakt ten behoeve van het in dienst
      houden van een arbeidsgehandicapte werknemer meer bedraagt dan:

      1°. € 450,–, indien het loon van de werknemer over het kalenderjaar minder dan 50% van het naar een jaarbedrag
      herleide minimumloon bedraagt zoals dat voor de werknemer gold op 1 januari van het desbetreffende kalenderjaar; of

      2°. € 2000,–, indien het loon van de werknemer over het kalenderjaar ten minste 50% van het bij ten eerste bedoelde
      minimumloon bedraagt; of

      b. die werkgever aantoont dat het totaal van de kosten die hij maakt of heeft gemaakt ten behoeve van het in dienst
      nemen van een arbeidsgehandicapte werknemer, meer bedraagt dan:

      1°. € 1350,–, indien het loon van de werknemer over het kalenderjaar minder dan 50% van het minimumloon, bedoeld in
      onderdeel a, bedraagt; of

      2°. € 6000,–, indien het loon van de werknemer over het kalenderjaar ten minste 50% van het minimumloon, bedoeld in
      onderdeel a, bedraagt; of

      c. die werkgever, na ommekomst van de periode van 3 respectievelijk 1 jaar, genoemd in
      [artikel 79b van de Wet op de arbeidsongeschiktheidsverzekering][ref1] en [artikel 82][ref2], [82a][ref3] of
      [97c van de Werkloosheidswet][ref4], kosten maakt of heeft gemaakt ten behoeve van het in dienst houden van een
      arbeidsgehandicapte werknemer.

      2 Onder het totaal van de kosten, bedoeld in het eerste lid, wordt verstaan het totaal van de kosten ten behoeve
      van een arbeidsgehandicapte werknemer en verband houdende met kosten die voortvloeien uit de noodzakelijke
      aanpassingen van de samenstelling en toewijzing van arbeid, de inrichting van de arbeidsplaats, de productie-
      en werkmethoden, en de bij de arbeid te gebruiken hulpmiddelen, alsmede met de kosten die voortvloeien uit de
      aanpassing van de inrichting van het bedrijf, voorzover de behoefte daaraan wordt opgeroepen door de deelneming van
      de arbeidsgehandicapte werknemer aan de werkzaamheden of het daarmee samenhangende verblijf in het bedrijf.

      3 Een subsidie als bedoeld in het eerste lid wordt niet verstrekt, indien de subsidie wordt aangevraagd voor
      een werknemer voor wie reeds eerder aan de werkgever subsidie op grond van dit artikel is verstrekt, tenzij de
      subsidieaanvraag:

      a. geen verband houdt met feiten en omstandigheden die aanleiding zijn geweest voor het verstrekken van de
      subsidie;

      b. betrekking heeft op door de werkgever gemaakte kosten ter vervanging van de bij de arbeid te gebruiken
      hulpmiddelen door de werknemer.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld met
      betrekking tot het eerste, tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel79b
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel82a
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel97c
