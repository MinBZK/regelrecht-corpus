    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de toekenning door het
      Uitvoeringsinstituut werknemersverzekeringen van loonsuppletie aan een arbeidsgehandicapte die werk in
      dienstbetrekking aanvaardt of verricht tegen een lager loon dan het bij of krachtens [artikel 2 van de WAZ][ref1],
      [artikel 2 van de WAJONG][ref2] of [artikel 18 van de WAO][ref3] vastgestelde inkomen of loon dat hij nog zou
      kunnen verdienen.


