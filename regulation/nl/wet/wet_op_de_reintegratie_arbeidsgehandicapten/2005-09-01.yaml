      1 Een besluit tot toekenning van voorzieningen als bedoeld in [artikel 22][ref1] en [31][ref2], van toelagen als
      bedoeld in [artikel 28][ref3], van inkomenssuppletie als bedoeld in [artikel 29][ref4] en van loonsuppletie als
      bedoeld in [artikel 32][ref5] wordt ingetrokken of herzien indien de voorzieningen de financiering van, of de
      tegemoetkoming in de kosten van kinderopvang, de toelagen, de inkomenssuppletie of de loonsuppletie als hiervoor
      bedoeld ten onrechte of tot een te hoog bedrag zijn verleend.

      2 Het besluit tot vaststelling van een subsidie als bedoeld in [artikel 30][ref6], [33][ref7]
      of [33a][ref8] wordt ingetrokken of gewijzigd indien sprake is van een omstandigheid als bedoeld in
      [artikel 4:49, eerste lid, onderdeel a, b, of c, van de Algemene wet bestuursrecht][ref9].


