  - number: '78'
    text: |-
      1 Toekenning van voorzieningen als bedoeld in [artikel 22][ref1] en [31][ref2], van financiering van,
      of tegemoetkoming in de kosten van, kinderopvang als bedoeld in [artikel 22a][ref3] en van toelagen als
      bedoeld in [artikel 28][ref4] vindt uitsluitend plaats voorzover ten aanzien van de arbeidsgehandicapte
      [artikel 75, eerste of derde lid][ref5], geen toepassing vindt, of ten aanzien van de werkgever van de
      arbeidsgehandicapte werknemer [artikel 75, tweede lid][ref6], geen toepassing vindt. De eerste zin is van
      overeenkomstige toepassing op de verstrekking van een subsidie in de vorm van een persoonsgebonden budget als
      bedoeld in [artikel 33][ref7].

      2 Toekenning van een reïntegratie-uitkering als bedoeld in [artikel 23, eerste lid][ref8], vindt uitsluitend plaats
      indien de werkzaamheden op een proefplaats of de scholing of opleiding zijn aangevangen op of na de dag waarop deze
      wet in werking treedt.

      3 Toekenning van inkomenssuppletie als bedoeld in [artikel 29][ref9] vindt uitsluitend plaats aan een persoon die
      op of na de dag van inwerkingtreding van deze wet arbeidsgehandicapte is geworden in de zin van [artikel 2][ref10].

      4 Toekenning van loonsuppletie als bedoeld in [artikel 32][ref11] vindt uitsluitend plaats terzake van een
      dienstbetrekking die is aangevangen op of na de dag waarop deze wet in werking treedt.


