preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de integratie en reïntegratie van arbeidsgehandicapten
    een krachtige impuls te geven, daartoe bestaande wettelijke instrumenten uit te breiden en institutionele
    belemmeringen die aan de integratie en reïntegratie van arbeidsgehandicapten in de weg staan weg te nemen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      c. Centrale organisatie werk en inkomen: Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      d arbodienst: een arbodienst als bedoeld in de [Arbeidsomstandighedenwet 1998][ref3].

      e. WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref4];

      f. WAZ: [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5];

      g. WAJONG: [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6];

      h. WW: [Werkloosheidswet][ref7];

      i. WBIA: [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref8];

      j. ZW: [Ziektewet][ref9];

      k. AAW: Algemene Arbeidsongeschiktheidswet;

      l. WSW: [Wet sociale werkvoorziening][ref10];

      m. dienstbetrekking: een dienstbetrekking in de zin van [artikel 3 van de WAO][ref11], of een op grond van
      [artikel 4][ref12] of [5 van de WAO][ref13] daarmee gelijkgestelde arbeidsverhouding;

      n. werknemer: de persoon die in dienstbetrekking werkzaam is en verzekerd is voor de [WAO][ref14];

      o. werkgever: de persoon tot wie een werknemer in dienstbetrekking staat;

      p. zelfstandige: de zelfstandige, bedoeld in [artikel 4, aanhef en onderdeel a, van de WAZ][ref15].

      q. minimumloon: het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel c, van de Wet minimumloon en minimumvakantiebijslag][ref16];

      r. loon: het loon in de zin van de [Coördinatiewet Sociale Verzekering][ref17].


