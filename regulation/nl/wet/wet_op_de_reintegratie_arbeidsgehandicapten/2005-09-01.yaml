  - number: 87e
    text: |-
      1 De [artikelen 22, tweede lid, onderdeel c][ref1], [22a, eerste lid][ref2], [23 tot en met 27][ref3],
      [34, eerste lid][ref4], [35, eerste lid][ref5], [36, eerste lid][ref6], en [37][ref7] en de daarop berustende
      bepalingen, zoals die luidden op de dag voor inwerkingtreding van de wet van 23 december 2004 houdende
      wijziging van enkele socialeverzekeringswetten en enige andere wetten in verband met het aanbrengen van enige
      vereenvoudigingen, blijven van toepassing op de arbeidsgehandicapte die voor de datum van inwerkingtreding van
      die wet:

      a. een voor hem, naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen, noodzakelijke opleiding of
      scholing volgt, of

      b. een reïntegratie-uitkering als bedoeld in
      [artikel 23, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref8], zoals dat artikel luidde
      op de dag voor de inwerkingtreding van de in de aanhef genoemde wet, ontvangt, voor de duur van die opleiding of
      scholing respectievelijk die reïntegratie-uitkering.

      2 [Artikel 16, eerste lid, onderdeel a][ref9], zoals dat luidde op de dag voor inwerkingtreding van de wet
      van 23 december 2004 houdende wijziging van enkele socialeverzekeringswetten en enige andere wetten in verband
      met het aanbrengen van enige vereenvoudigingen, blijft van toepassing op aanvragen voor subsidie voor extra
      reïntegratiekosten als bedoeld in [artikel 16, eerste lid, aanhef en onderdelen a en b][ref10], die voor de datum
      van inwerkingtreding van die wet zijn ingediend.


