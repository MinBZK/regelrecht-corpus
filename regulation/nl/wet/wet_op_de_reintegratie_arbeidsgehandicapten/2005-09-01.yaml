  - number: '57'
    text: |-
      Overtreding van bepalingen van een krachtens deze wet uitgevaardigde algemene maatregel van bestuur voorzover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met een hechtenis van ten
      hoogste een maand of een geldboete van de tweede categorie. De in de eerste zin bedoelde strafbare feiten zijn
      overtredingen.
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel57
  - number: '59'
    text: |-
      Het recht tot strafvordering vervalt indien het Uitvoeringsinstituut werknemersverzekeringen aan de belanghebbende
      terzake van hetzelfde feit reeds een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel59
  - number: '75'
    text: |-
      1 Artikel 57 van de AAW en de daarop berustende bepalingen, zoals deze luidden op de dag voorafgaand aan de
      inwerkingtreding van deze wet, blijven van toepassing op de persoon die vóór die datum een aanvraag heeft
      ingediend of in aanmerking is gebracht voor een voorziening tot behoud, herstel of ter bevordering van de
      arbeidsgeschiktheid, zolang die voorziening wordt verstrekt.

      2 Artikel 57a van de AAW en de daarop berustende bepalingen, zoals deze luidden op de dag voorafgaand aan de
      inwerkingtreding van deze wet, blijven van toepassing op de persoon die vóór die datum een aanvraag heeft ingediend
      of in aanmerking is gebracht voor vergoeding van kosten als bedoeld in dat artikel, zolang deze vergoeding niet
      daadwerkelijk geheel is verleend.

      3 Artikel 58 van de AAW, zoals dit artikel luidde op de dag voorafgaand aan de inwerkingtreding van deze wet blijft
      van toepassing op de persoon die vóór die datum een aanvraag heeft ingediend of in aanmerking is gebracht voor een
      toelage of vergoeding, zolang die toelage of vergoeding wordt verleend.

      4 Artikel 59b van de AAW en de daarop berustende bepalingen, zoals deze luidden op de dag voorafgaand aan de
      inwerkingtreding van deze wet, blijven van toepassing op de persoon die vóór die datum een aanvraag heeft ingediend
      of in aanmerking is gebracht voor inkomenssuppletie.

      5 Bij ministeriële regeling kan worden bepaald dat de toepasselijkheid van de
      [Algemene Arbeidsongeschiktheidswet][ref1], bedoeld in het eerste lid:

      a. met betrekking tot voorzieningen op grond van [artikel 57, eerste en tweede lid, onderdeel b, van die wet][ref2],
      met ingang van een bij die regeling te bepalen datum eindigt;

      b. met betrekking tot voorzieningen op grond van [artikel 57, tweede lid, onderdeel c][ref3], toegekend aan
      personen die buiten het Rijk verblijven, wordt voortgezet, indien voor de voortzetting van deze voorziening een
      nieuw besluit van het Uitvoeringsinstituut werknemersverzekeringen noodzakelijk is.

      6 De bruikleenovereenkomst of de overeenkomst met betrekking tot het in gebruik geven van een blindengeleidehond
      tussen het Uitvoeringsinstituut werknemersverzekeringen en een persoon aan wie een voorziening is toegekend
      op grond van artikel 57 van de AAW, zoals dat luidde voor de inwerkingtreding van deze wet, betreffende de
      verstrekking van een blindengeleidehond, wordt met ingang van de datum die is bepaald op grond van het vijfde lid,
      onderdeel a, of indien de overeenkomst op een latere datum is aangegaan, met ingang van die datum, aangemerkt als
      een bruikleenovereenkomst of een overeenkomst met betrekking tot het in gebruik geven van een blindengeleidehond
      tussen de Ziekenfondsraad en genoemde persoon.

      7 De overeenkomst tot levering of de overeenkomst met betrekking tot het in gebruik geven van een
      blindengeleidehond tussen een persoon of rechtspersoon die blindengeleidehonden opleidt en het Uitvoeringsinstituut
      werknemersverzekeringen, dat genoemde overeenkomst aangaat of is aangegaan met als doel deze hond te verstrekken
      aan een persoon aan wie deze voorziening is toegekend op grond van artikel 57 van de AAW, zoals dat luidde voor de
      inwerkingtreding van deze wet, wordt met ingang van de datum die is bepaald op grond van het vijfde lid, onderdeel
      a, of indien de overeenkomst op een latere datum is aangegaan, met ingang van die datum, aangemerkt als een
      overeenkomst tot levering of een overeenkomst met betrekking tot het in gebruik geven van een blindengeleidehond
      tussen de persoon of rechtspersoon die blindengeleidehonden opleidt en de Ziekenfondsraad.

      8 De blindengeleidehond die op of na de op grond van het vijfde lid, onderdeel a, vastgestelde datum tot het
      eigendom van het Uitvoeringsinstituut werknemersverzekeringen behoort, wordt met ingang van de datum waarop het
      Uitvoeringsinstituut werknemersverzekeringen eigendom heeft verkregen, doch niet eerder dan met ingang van de op
      grond van het vijfde lid, onderdeel a, vastgestelde datum, eigendom van de Ziekenfondsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel57
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel75
