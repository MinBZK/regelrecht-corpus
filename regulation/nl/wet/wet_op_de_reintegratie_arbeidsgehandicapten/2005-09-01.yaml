  - number: 49a
    text: |-
      1 Beschikkingen op grond van deze wet en de daarop berustende bepalingen worden gegeven binnen een redelijke
      termijn na ontvangst van de aanvraag.

      2 De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.

      3 Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.

      4 Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen acht weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel49a
  - number: '50'
    text: |-
      1 In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken na ontvangst van het bezwaarschrift.

      2 Indien bezwaar wordt gemaakt tegen een besluit waaraan een medische of arbeidskundige beoordeling
      ten grondslag ligt, beslist het Uitvoeringsinstituut werknemersverzekeringen, in afwijking van
      [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref2], binnen zeventien weken, of indien het advies
      vraagt aan een deskundige die niet onder zijn verantwoordelijkheid werkzaam is, binnen eenentwintig weken, na
      ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel710
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel710
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:10
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 7:10
  - number: '51'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de behandeling van bezwaarschriften
      tegen besluiten waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel51
  - number: '52'
    text: |-
      Ten aanzien van besluiten waaraan een medische beoordeling ten grondslag ligt zijn de
      [artikelen 88 tot en met 88i van de WAO][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel88
    url: https://wetten.overheid.nl/BWBR0009565/2005-09-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '88'
  - number: '53'
    text: |-
      [Titel 4.2. van de Algemene wet bestuursrecht][ref1] is niet van toepassing op aanspraken op grond van de
      [artikelen 22][ref2] en [31][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
