  - number: '10'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen heeft tot taak de bevordering van de inschakeling in het
      arbeidsproces van de arbeidsgehandicapte ten aanzien van wie de werkgever geen verplichting heeft als bedoeld in
      [artikel 8][ref1], die

      a. recht heeft op een uitkering op grond van de [ZW][ref2], de [WAO][ref3], de [WAJONG][ref4], de [WW][ref5],
      tenzij [artikel 72a van de WW][ref6] van toepassing is, of de [WBIA][ref7];

      b. verzekerd is op grond van de [WAZ][ref8], of recht heeft op een uitkering op grond van de [WAZ][ref9];

      c. ingezetene is als bedoeld in [artikel 3 van de WAJONG][ref10] en de leeftijd van 18 jaar nog niet heeft bereikt;

      d. als gewezen overheidswerknemer recht heeft op bezoldiging of uitkering in geval van ziekte als bedoeld in
      [artikel 1, onderdeel e, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref11] of recht heeft op
      een wachtgeld als bedoeld in [artikel 1, onderdeel r, van die wet][ref12].

      2 Uit hoofde van de uitoefening van zijn taak, bedoeld in het eerste lid, verstrekt het Uitvoeringsinstituut
      werknemersverzekeringen aan arbeidsgehandicapten instrumenten als bedoeld in [hoofdstuk 4][ref13] van deze wet en
      verstrekt het aan werkgevers instrumenten als bedoeld in [hoofdstuk 3][ref14] van deze wet om indiensttreding van
      deze personen te bevorderen.

      3 Het Uitvoeringsinstituut werknemersverzekeringen laat de werkzaamheden waarmee de in het eerste lid bedoelde taak
      wordt uitgevoerd, verrichten door een natuurlijke persoon dan wel rechtspersoon die in het kader van de uitoefening
      van beroep of bedrijf de inschakeling van personen in de arbeid bevordert.

      4 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan de in het derde lid bedoelde natuurlijke
      persoon of rechtspersoon gegevens voorzover deze noodzakelijk zijn voor de uitvoering van de in het tweede lid
      bedoelde werkzaamheden, alsmede het sociaal-fiscaalnummer van de persoon wiens inschakeling in de arbeid door die
      natuurlijke persoon of rechtspersoon wordt bevorderd. Deze natuurlijke persoon of rechtspersoon verwerkt de in dit
      lid bedoelde gegevens slechts voor zover dat noodzakelijk is voor de werkzaamheden, bedoeld in het derde lid, en
      gebruikt slechts met dat doel het sociaal-fiscaalnummer bij die verwerking.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de uitvoering van het
      derde en vierde lid, waarbij in ieder geval regels kunnen worden gesteld voor de inhoud van de overeenkomst met
      de in het derde lid bedoelde natuurlijke of rechtspersoon, het verstrekken en verwerken van gegevens en de soort
      werkzaamheden.

      6 De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


