  - number: '77'
    text: |-
      1 De persoon die op de dag voorafgaand aan de inwerkingtreding van
      [artikel I, onderdeel C, van de Wet einde toegang verzekering WAZ][ref1] verzekerd is op grond van de [WAZ][ref2]
      en voor of op die dag een aanvraag heeft ingediend of in aanmerking is gebracht voor een voorziening op grond van
      [artikel 22][ref3] of een verstrekking op grond van [artikel 30][ref4] wordt voor de toepassing van die artikelen
      met betrekking tot en voor de duur van die voorziening of verstrekking geacht verzekerd te zijn op grond van de
      [WAZ][ref5].

      2 Indien het eerste lid toepassing vindt, wordt in [artikel 22, derde lid][ref6], voor «werkzaamheden op grond
      waarvan de arbeidsgehandicapte verzekerd is voor de [WAZ][ref7]» gelezen: werkzaamheden als zelfstandige,
      beroepsbeoefenaar of meewerkende echtgenoot als bedoeld in de [WAZ][ref8].

      3 De persoon die voorafgaand aan de inwerkingtreding van de Regeling tot intrekking van de
      Experimentele regeling subsidieverstrekking arbeidsgehandicapten een subsidieaanvraag als bedoeld
      in [artikel 33][ref9] heeft ingediend en op de dag voorafgaand aan de inwerkingtreding van
      [artikel I, onderdeel C, van de Wet einde toegang verzekering WAZ][ref10] verzekerd was op grond van de
      [WAZ][ref11], wordt voor de toepassing van [artikel 33][ref12] met betrekking tot en voor de duur van het tijdvak
      van de subsidie geacht verzekerd te zijn op grond van de [WAZ][ref13].

      4 De persoon die, op de dag voorafgaand aan de inwerkingtreding van
      [artikel I, onderdeel C, van de Wet einde toegang verzekering WAZ][ref14] verzekerd is op grond van de
      [WAZ][ref15] en ten behoeve van wie het Uitvoeringsinstituut werknemersverzekeringen werkzaamheden als bedoeld in
      [artikel 10, derde lid][ref16], laat verrichten, wordt voor de toepassing van dat artikel met betrekking tot en
      voor duur van die werkzaamheden geacht verzekerd te zijn op grond van de [WAZ][ref17].

      5 De persoon die op de dag voorafgaand aan de inwerkingtreding van
      [artikel I, onderdeel C, van de Wet einde toegang verzekering WAZ][ref18] verzekerd is op grond van
      de [WAZ][ref19] en voor of op die dag een aanvraag om een individuele reïntegratieovereenkomst als
      bedoeld in [artikel 4.2 van het Besluit SUWI][ref20] heeft ingediend, wordt voor de toepassing van
      [artikel 10, derde lid][ref21], met betrekking tot en voor de duur van het tijdvak van de overeenkomst geacht
      verzekerd te zijn op grond van de [WAZ][ref22].


