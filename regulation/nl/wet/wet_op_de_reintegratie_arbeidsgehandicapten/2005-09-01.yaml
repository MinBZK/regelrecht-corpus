      ___________________________________, blijven van toepassing op dienstbetrekkingen die zijn aangegaan tot en met 31
      december 2001 en ingeval een werknemer zijn eigen arbeid of een andere functie bij dezelfde werkgever heeft hervat
      vóór 1 januari 2002 dan wel nadat diens arbeidsplaats is aangepast tot behoud, herstel of ter bevordering van de
      arbeidsgeschiktheid van die werknemer voor de eigen arbeid voor die datum.

      2 Het Uitvoeringsinstituut werknemersverzekeringen voert de uit het eerste lid voortvloeiende werkzaamheden uit.

      3 Een aanvraag voor een subsidie op grond van het in het eerste lid bedoelde [artikel 15][ref5] kan tot 1 januari
      2004 worden ingediend.

      4 Een aanvraag voor een subsidie op grond van het in het eerste lid bedoelde [artikel 16][ref6] of [17][ref7] of
      een aanvraag voor een pakket op maat op grond van het in het eerste lid bedoelde artikel 18 kan tot 1 juli 2005
      worden ingediend.


