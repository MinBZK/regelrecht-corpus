  - number: '17'
    text: |-
      1 In geval van overgang van een onderneming als bedoeld in
      [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1], waarbij aan de werkgever die de onderneming overdraagt
      een subsidie is verstrekt als bedoeld in [artikel 16][ref2], wordt voor de toepassing van deze wet de subsidie
      aangemerkt als een subsidie verstrekt aan de werkgever die de onderneming overneemt.

      2 Indien slechts een deel van de onderneming overgaat als bedoeld in het eerste lid, vindt het eerste lid
      uitsluitend toepassing, indien de werknemers voor wie subsidies zijn verstrekt als bedoeld in het eerste lid, hun
      werkzaamheden uitoefenen bij het deel van de onderneming dat wordt overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel16
