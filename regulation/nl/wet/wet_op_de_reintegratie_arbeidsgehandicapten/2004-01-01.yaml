  - number: 87d.4
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere en afwijkende regels worden gesteld omtrent de voorwaarden
      waaronder en het tijdvak waarvoor de subsidie op grond van het eerste, tweede en derde lid wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel87d
  - number: '89'
    text: De Wet arbeid gehandicapte werknemers wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel89
  - number: '92'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel92
  - number: '93'
    text: 'Deze wet wordt aangehaald als: Wet op de (re)integratie arbeidsgehandicapten.'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel93
