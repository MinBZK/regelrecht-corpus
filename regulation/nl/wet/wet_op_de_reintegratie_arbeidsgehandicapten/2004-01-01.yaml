  - number: 87b.2
    text: Het Uitvoeringsinstituut werknemersverzekeringen voert de uit het eerste lid voortvloeiende werkzaamheden uit.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel87b
  - number: 87b.3
    text: |-
      Een aanvraag voor een subsidie op grond van het in het eerste lid bedoelde [artikel 15][ref1] kan tot 1 januari
      2004 worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel15
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 87c.1
    text: |-
      Ten aanzien van de persoon wiens eerste dag van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte is
      gelegen voor 1 januari 2004 blijft [artikel 5, tweede lid][ref1], van toepassing zoals deze luidde op 31 december
      2003.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel5
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel87c
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '5'
        hoofdstuk: '1'
  - number: 87c.2
    text: |-
      Voor de toepassing van het eerste lid worden perioden van ongeschiktheid tot werken geacht eenzelfde, niet
      onderbroken periode van ongeschiktheid te vormen, indien zij elkaar met een onderbreking van minder dan vier
      weken opvolgen. Bij de vaststelling van de periode van vier weken blijven perioden, waarin zwangerschaps- of
      bevallingsverlof wordt genoten overeenkomstig [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1],
      buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel87c
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 87d.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de werkgever, bedoeld in [artikel 8][ref1],
      ten aanzien van de werknemer, wiens eerste dag van ongeschiktheid tot het verrichten van arbeid wegens ziekte is
      gelegen voor 1 januari 2004, met toepassing van [artikel 15][ref2], zoals dit artikel luidde op 31 december 2003,
      subsidie voor noodzakelijk te maken kosten van werkzaamheden verstrekken, indien de aanvraag is ingediend voor 1
      april 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel15
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel87d
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 87d.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de werkgever, bedoeld in [artikel 8][ref1],
      ten aanzien van de werknemer, wiens eerste dag van ongeschiktheid tot het verrichten van arbeid wegens ziekte is
      gelegen voor 1 januari 2004, met toepassing van [artikel 15][ref2], zoals dit artikel luidde op 31 december 2003,
      een aanvullende subsidie voor noodzakelijk te maken kosten van werkzaamheden, in verband met de indiensttreding van
      zijn arbeidsgehandicapte werknemer bij een andere werkgever, verstrekken, indien de aanvraag is ingediend voor 1
      juli 2005 en een subsidie als bedoeld in het eerste lid is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel15
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel87d
