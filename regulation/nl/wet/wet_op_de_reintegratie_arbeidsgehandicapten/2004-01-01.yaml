  - number: 36.1.b
    text: |-
      de uitkering, bedoeld in [artikel 23][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel23
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel36
    references:
      - id: ref1
