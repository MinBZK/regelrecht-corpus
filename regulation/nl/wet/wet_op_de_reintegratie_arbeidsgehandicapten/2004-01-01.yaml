  - number: 36.1.c
    text: |-
      de toelage, bedoeld in [artikel 28][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel28
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel36
    references:
