  - number: '2.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt onder arbeidsgehandicapte verstaan:'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel2
  - number: 2.1.a
    text: |-
      de persoon die recht heeft op een arbeidsongeschiktheidsuitkering op grond van de [WAO][ref1], de [WAZ][ref2] of
      de [WAJONG][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
  - number: 2.1.b
    text: |-
      de persoon aan wie op grond van een wettelijk voorschrift in verband met ziekte of gebrek een voorziening is
      toegekend die strekt tot behoud, herstel of bevordering van de mogelijkheid tot het verrichten van arbeid of ten
      behoeve van wie een subsidie voor met een voorziening verband houdende kosten is verstrekt;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel2
  - number: 2.1.c
    text: |-
      de persoon die bij indicatiebeschikking of herindicatiebeschikking op grond van de [WSW][ref1] behoort tot
      de doelgroep voor de [WSW][ref2], doch niet werkzaam is als werknemer in de zin van de [WSW][ref3] of op een
      arbeidsovereenkomst als bedoeld in [artikel 7 van de WSW][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0008903
      [ref3]: https://wetten.overheid.nl/BWBR0008903
      [ref4]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0008903
      - id: ref3
        bwb_id: BWBR0008903
      - id: ref4
        bwb_id: BWBR0008903
        artikel: '7'
  - number: 2.1.d
    text: |-
      voor de duur van vijf jaar na de datum van beëindiging van een dienstbetrekking op grond van de [WSW][ref1], de
      persoon die arbeid heeft verricht op grond van de [WSW][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0008903
  - number: 2.1.e
    text: |-
      voor de duur van vijf jaar na de datum van een herindicatiebeschikking op grond van de [WSW][ref1], de persoon die
      na herindicatie niet meer behoort tot de doelgroep van de [WSW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0008903
  - number: '2.2'
    text: |-
      De persoon, bedoeld in het eerste lid, onderdeel a of b, blijft arbeidsgehandicapte in de zin van deze wet voor de
      periode van vijf jaar na de datum waarop de arbeidsongeschiktheidsuitkering, bedoeld in onderdeel a, in verband met
      vermindering van de arbeidsongeschiktheid of de voorziening, bedoeld in onderdeel b, is geëindigd.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel2
  - number: '2.3'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt tevens onder arbeidsgehandicapte verstaan, de persoon die niet
      behoort tot een categorie van personen als bedoeld in het eerste en tweede lid, doch ten aanzien van wie op grond
      van een medisch-arbeidskundige beoordeling is vastgesteld, dat hij in verband met ziekte of gebrek een belemmering
      heeft bij het verkrijgen of verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel2
  - number: '2.4'
    text: |-
      De persoon, bedoeld in het derde lid, blijft gedurende een periode van vijf jaar te rekenen vanaf de datum van
      het intreden van de arbeidshandicap, arbeidsgehandicapte in de zin van deze wet. Onmiddellijk na afloop van deze
      periode wordt opnieuw vastgesteld of hij in verband met ziekte of gebrek een belemmering heeft bij het verkrijgen
      of verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel2
  - number: '2.5'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt niet als arbeidsgehandicapte aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel2
  - number: 2.5.a
    text: |-
      de persoon, bedoeld in het eerste tot en met vierde lid, vanaf de eerste dag van de maand waarin hij de leeftijd
      van 65 jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel2
  - number: 2.5.b
    text: |-
      de persoon die werkzaam is als werknemer in de zin van de [WSW][ref1] of op een arbeidsovereenkomst als bedoeld in
      [artikel 7 van de WSW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '7'
  - number: '2.6'
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het derde lid.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel2
  - number: '3.1'
    text: |-
      De vaststelling, bedoeld in [artikel 2, derde lid][ref1], geschiedt door het Uitvoeringsinstituut
      werknemersverzekeringen ten aanzien van de persoon die:


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
        hoofdstuk: '1'
  - number: 3.1.a
    text: |-
      recht heeft op doorbetaling van loon als bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1],
      na daarover geadviseerd te zijn door de arbodienst van de werkgever die het loon bij ziekte van de
      werknemer doorbetaalt, in welk advies wordt aangegeven of de werknemer, naar het oordeel van de arbodienst,
      arbeidsgehandicapt is, met toepassing van een voorziening de eigen arbeid kan blijven verrichten, of bij dezelfde
      werkgever, al dan niet met toepassing van een voorziening, in een andere functie arbeid kan verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
  - number: 3.1.b
    text: |-
      recht heeft op een uitkering op grond van de [ZW][ref1], de [WW][ref2] of de [WBIA][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0007891
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0007891
  - number: 3.1.c
    text: |-
      verzekerd is op grond van de [WAZ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 3.1.d
    text: |-
      ingezetene is als bedoeld in [artikel 3 van de WAJONG][ref1] en de leeftijd van 18 jaar nog niet heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '3'
  - number: 3.1.e
    text: |-
      als overheidswerknemer als bedoeld in
      [artikel 1, onderdeel l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1], recht heeft op
      bezoldiging of uitkering ingeval van ziekte als bedoeld in [artikel 1, onderdeel e, van die wet][ref2], na daarover
      op overeenkomstige wijze als bedoeld in onderdeel a, geadviseerd te zijn door de arbodienst van de werkgever die de
      bezoldiging of de uitkering bij ziekte van de werknemer betaalt;


      [ref1]: https://wetten.overheid.nl/BWBR0009267#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009267
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009267
        artikel: '1'
  - number: 3.1.f
    text: |-
      als gewezen overheidswerknemer recht heeft op bezoldiging of uitkering in geval van ziekte als bedoeld in
      [artikel 1, onderdeel e, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1] of recht heeft op
      een wachtgeld als bedoeld in [artikel 1, onderdeel r, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009267#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009267
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009267
        artikel: '1'
  - number: '3.2'
    text: |-
      De vaststelling, bedoeld in [artikel 2, derde lid][ref1], ten aanzien van de persoon die
      uitsluitend recht heeft op een uitkering op grond van de [Wet werk en bijstand][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref3], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref4] of de
      [Wet inkomensvoorziening kunstenaars][ref5] geschiedt door het gemeentebestuur van de gemeente, waarin die persoon
      woonachtig is.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0004044
      [ref4]: https://wetten.overheid.nl/BWBR0004163
      [ref5]: https://wetten.overheid.nl/BWBR0009344
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0015703
      - id: ref3
        bwb_id: BWBR0004044
      - id: ref4
        bwb_id: BWBR0004163
      - id: ref5
        bwb_id: BWBR0009344
  - number: '3.3'
    text: |-
      De vaststelling, bedoeld in [artikel 2, derde lid][ref1], ten aanzien van de persoon die uitsluitend recht
      heeft op een uitkering op grond van de [Algemene nabestaandenwet][ref2] en ten aanzien van de persoon voor
      wie de vaststelling, bedoeld in [artikel 2, derde lid][ref3], niet is opgedragen aan het Uitvoeringsinstituut
      werknemersverzekeringen of de gemeenten geschiedt door het gemeentebestuur van de gemeente, waarin hij woonachtig
      is, indien hij als werkloos werkzoekende bij de Centrale organisatie werk en inkomen is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '2'
        hoofdstuk: '1'
  - number: '4.1'
    text: |-
      Werkgevers, organisaties van werkgevers en organisaties van werknemers hebben tot taak, voorzover dat
      redelijkerwijs in hun vermogen ligt, gelijke kansen van arbeidsgehandicapte en niet-arbeidsgehandicapte werknemers
      voor deelname aan het arbeidsproces te bevorderen en de nodige voorzieningen te treffen, gericht op behoud, herstel
      of bevordering van de mogelijkheid tot het verrichten van arbeid van werknemers.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel4
  - number: '4.2'
    text: |-
      Voor de toepassing van het eerste lid worden onder werknemers mede begrepen diegenen, die beschikbaar zijn of door
      het treffen van voorzieningen beschikbaar kunnen komen voor het als werknemer verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel4
  - number: '5.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat een werkgever, die behoort tot een in die maatregel
      aangewezen tak van bedrijf of beroep of gedeelte daarvan, dan wel onderdeel van de openbare dienst, verplicht is er
      voor zorg te dragen dat het aantal bij hem in dienst zijnde arbeidsgehandicapte werknemers ten minste een bij die
      maatregel te bepalen deel uitmaakt van het totaal van de bij hem in dienst zijnde werknemers. In deze maatregel kan
      het in de eerste zin bedoelde deel niet lager worden gesteld dan 3 per 100 en niet hoger dan 7 per 100.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel5
  - number: '5.2'
    text: |-
      Bij de berekening of op een bepaalde datum door een werkgever wordt voldaan aan een op grond van het eerste lid
      opgelegde verplichting blijven buiten beschouwing die werknemers die op die datum en in de 104 aan die datum
      voorafgaande weken wegens ziekte of gebreken geen arbeid hebben verricht bij die werkgever. Voor het bepalen van
      de periode van 104 weken, bedoeld in de eerste zin, worden perioden gedurende welke wegens ziekte of gebreken geen
      arbeid werd verricht samengeteld, indien zij elkaar met een onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel5
  - number: '5.3'
    text: |-
      Voorzover een werkgever niet voldoet aan een op grond van het eerste lid opgelegde verplichting, is hij periodiek
      een geldelijke bijdrage verschuldigd, afgestemd op het aantal arbeidsgehandicapte werknemers dat een werkgever in
      dienst zou moeten nemen om aan een op grond van het eerste lid opgelegde verplichting te voldoen.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel5
  - number: '5.4'
    text: 'In de maatregel, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel5
  - number: 5.4.a
    text: |-
      kunnen werkgevers, waarbij in de regel minder dan een bij de maatregel aangewezen aantal personen werkzaam zijn,
      van de verplichting, bedoeld in het eerste lid, worden uitgezonderd;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel5
  - number: 5.4.b
    text: |-
      kan worden geregeld in hoeverre arbeidsgehandicapte werknemers, met wie een arbeidsduur is overeengekomen die
      korter is dan de normale arbeidsduur, worden meegeteld bij de berekening of wordt voldaan aan een op grond van het
      eerste lid opgelegde verplichting;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel5
  - number: 5.4.c
    text: kan de hoogte van de in het derde lid bedoelde geldelijke bijdrage worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel5
  - number: 5.4.d
    text: |-
      kunnen regels worden gesteld omtrent de vaststelling, invordering en afdracht van de in het derde lid bedoelde
      geldelijke bijdrage;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel5
  - number: 5.4.e
    text: |-
      kunnen regels worden gesteld omtrent een door de werkgever te voeren administratie waaruit kan worden afgeleid
      welke dienstbetrekkingen met arbeidsgehandicapte werknemers bestaan.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister kan een werkgever ontheffing verlenen van een op grond van [artikel 5, eerste lid][ref1], opgelegde
      verplichting indien te verwachten valt dat de werkgever gedurende langere tijd in redelijkheid niet aan die
      verplichting zal kunnen voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel5
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '5'
        hoofdstuk: '1'
  - number: '6.2'
    text: |-
      Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden. Aan
      een ontheffing kan terugwerkende kracht worden verleend tot aan het tijdstip van de aanvraag. Indien de werkgever
      de aan een ontheffing verbonden voorschriften niet naleeft kan de ontheffing, zo nodig met terugwerkende kracht,
      worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel6
  - number: '6.3'
    text: |-
      Een ontheffing als bedoeld in het eerste lid wordt verleend in overeenstemming met Onze Minister van
      Binnenlandse Zaken indien het de burgerlijke openbare dienst of een onderwijsinstelling als bedoeld in
      [artikel 2, eerste lid, onderdeel b, c, d of e van de Wet privatisering ABP][ref1] betreft, en in overeenstemming
      met Onze Minister van Defensie indien het de militaire dienst betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: '7.1'
    text: |-
      Iedere arbeidsgehandicapte werknemer heeft jegens zijn werkgever aanspraak op een geldelijke beloning voor de
      verrichte arbeid die gelijk is aan de geldelijke beloning die een niet arbeidsgehandicapte werknemer in een
      gelijkwaardige functie bij dezelfde arbeidsduur pleegt te ontvangen.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel7
  - number: '7.2'
    text: |-
      Indien de arbeidsprestatie van een arbeidsgehandicapte werknemer in een bepaalde functie ten gevolge van ziekte of
      gebreken duidelijk minder is dan de arbeidsprestatie, die in de desbetreffende functie als normaal wordt beschouwd,
      vermindert het Uitvoeringsinstituut werknemersverzekeringen op verzoek van de betrokken werkgever of werknemer
      de hoogte van de aanspraak op een geldelijke beloning voor de verrichte arbeid naar evenredigheid, zo nodig in
      afwijking van hetgeen bij en krachtens de Wet minimumloon en minimumvakantiebijslag is bepaald.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het tweede lid is niet van toepassing op de arbeidsgehandicapte werknemer, werkzaam in openbare dienst. Onder
      openbare dienst worden mede begrepen de instellingen, diensten en bedrijven door de Staat en de openbare lichamen
      beheerd. De geldelijke beloning voor de verrichte arbeid van een arbeidsgehandicapte werknemer, werkzaam in
      openbare dienst, kan in het in het tweede lid bedoelde geval worden verminderd in overeenstemming met de voor de
      werknemer geldende bezoldigingsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel7
  - number: '7.4'
    text: |-
      Elk beding waarbij een geldelijke beloning voor de verrichte arbeid wordt overeengekomen die lager is dan de
      beloning die voortvloeit uit het eerste lid, danwel lager is dan de beloning, vastgesteld op grond van het tweede
      of derde lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel7
  - number: '8.1'
    text: |-
      De werkgever bevordert ten aanzien van zijn werknemer die wegens ziekte of gebrek niet in staat is de bedongen
      arbeid te verrichten, de inschakeling in de arbeid in zijn bedrijf en indien vaststaat dat in zijn bedrijf voor
      deze werknemer geen passende arbeid voorhanden is, bevordert de werkgever de inschakeling van deze werknemer in de
      arbeid in het bedrijf van een andere werkgever.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
  - number: '8.2'
    text: |-
      Uit hoofde van de uitoefening van zijn taak, bedoeld in het eerste lid, treft de werkgever maatregelen gericht
      op behoud, herstel of bevordering van de mogelijkheid tot het verrichten van arbeid van zijn in het eerste lid
      bedoelde werknemer.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
  - number: '8.3'
    text: |-
      De verplichting van de werkgever, bedoeld in het eerste lid, geldt in ieder geval voor de duur van de
      dienstbetrekking met de in het eerste lid bedoelde werknemer.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
  - number: '8.4'
    text: |-
      Indien de werkgever aan het Uitvoeringsinstituut werknemersverzekeringen schriftelijk heeft gemeld dat hij zijn in
      het eerste lid bedoelde taak na het einde van de dienstbetrekking van zijn werknemers blijft verrichten gedurende
      een door hem bij die melding aangegeven periode, geldt de verplichting, bedoeld in het eerste lid, na het einde van
      elke dienstbetrekking van zijn vroegere werknemer gedurende die periode. De duur van deze periode is ten hoogste
      zes jaar na de datum waarop de in het eerste lid bedoelde werknemer ongeschikt is geworden tot het verrichten van
      zijn arbeid wegens ziekte of gebrek.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
  - number: '8.5'
    text: |-
      De werkgever laat de werkzaamheden, bedoeld in dit artikel, verrichten door een of meer arbodiensten of
      een natuurlijke persoon dan wel rechtspersoon, die in het kader van de uitoefening van beroep of bedrijf de
      inschakeling van personen in de arbeid bevordert.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
  - number: '8.6'
    text: |-
      De werkgever en zijn arbodienst verstrekken aan de in het vijfde lid bedoelde natuurlijke persoon of rechtspersoon
      gegevens voorzover deze noodzakelijk zijn voor de uitvoering van de in het tweede lid bedoelde werkzaamheden,
      alsmede het sociaal-fiscaalnummer van de persoon wiens inschakeling in de arbeid door die natuurlijke persoon of
      rechtspersoon wordt bevorderd. Deze natuurlijke persoon of rechtspersoon verwerkt de in dit lid bedoelde gegevens
      slechts voorzover dat noodzakelijk is voor de werkzaamheden, bedoeld in het tweede lid, en gebruikt slechts met
      dat doel het sociaal-fiscaalnummer bij die verwerking. Onder sociaal-fiscaalnummer wordt in deze wet verstaan het
      nummer, bedoeld in [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: '8.7'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
  - number: 8.7.a
    text: de mogelijkheid van verlenging van de in dit artikel bedoelde taak van de werkgever op grond van het vierde lid;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
  - number: 8.7.b
    text: |-
      de mogelijkheid van verlenging van de in dit artikel bedoelde taak van de werkgever na het einde van de
      dienstbetrekking in een individueel geval;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
  - number: 8.7.c
    text: de mogelijkheid van beëindiging van de in het vierde lid bedoelde verplichting;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
  - number: 8.7.d
    text: het vijfde en zesde lid;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
  - number: 8.7.e
    text: |-
      de verplichtingen van de werkgever in verband met de beëindiging van de dienstbetrekking van de in het eerste lid
      bedoelde werknemer.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
  - number: '8.8'
    text: |-
      Nadat de werkgever op grond van [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref1] een
      reïntegratieverslag heeft opgesteld of aangevuld, houdt de werkgever aantekening bij van het verloop en de
      reïntegratie van de in het eerste lid bedoelde werknemer en de in het vierde lid bedoelde vroegere werknemer
      gedurende de in het derde, vierde en zevende lid, bedoelde periode en stelt hij in die periode jaarlijks uiterlijk
      twaalf maanden na deze opstelling of aanvulling van het reïntegratieverslag opnieuw met de werknemer of vroegere
      werknemer een reïntegratieverslag op en verstrekt hij hiervan afschrift aan de werknemer of vroegere werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: '8.9'
    text: |-
      Bij de uitvoering van het achtste lid laat de werkgever zich bijstaan door een arbodienst als bedoeld in de
      [Arbeidsomstandighedenwet 1998][ref1]. De werknemer of vroegere werknemer verleent zijn medewerking bij het
      opstellen van het reïntegratieverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: '8.10'
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het achtste en negende lid.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
  - number: '8.11'
    text: |-
      Dit artikel is niet van toepassing op de werkgever, bedoeld in [artikel 9 van de WAO][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel9
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '9'
  - number: '8.12'
    text: |-
      Zo nodig in afwijking van het elfde lid zijn het eerste, tweede, vijfde, zesde, achtste en negende lid, alsmede
      de regels op grond van het zevende lid, onderdelen d en e, en op grond van het tiende lid, van overeenkomstige
      toepassing op de eigenrisicodrager, bedoeld in [artikel 1, eerste lid, onderdeel h, van de ZW][ref1] en de persoon,
      bedoeld in [artikel 63, eerste lid, van de ZW][ref2], gedurende de periode dat de eigenrisicodrager aan die persoon
      ziekengeld moet betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel63
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '63'
  - number: '9.1'
    text: |-
      De werkgever past uit hoofde van de uitoefening van zijn taak, bedoeld in [artikel 8][ref1], de samenstelling en
      toewijzing van de arbeid, de inrichting van de arbeidsplaatsen, de productie- en werkmethoden en de bij de arbeid
      te gebruiken hulpmiddelen aan de in [artikel 8, eerste lid][ref2], bedoelde werknemer aan en past de inrichting
      van het bedrijf aan, voorzover de behoefte daaraan wordt opgeroepen door de deelneming van die werknemer aan de
      werkzaamheden of het daarmee samenhangende verblijf in het bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel8
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.2'
    text: |-
      Onze Minister kan aan een werkgever een eis stellen betreffende de wijze waarop de verplichting, bedoeld in het
      eerste lid, wordt nageleefd. [Artikel 27, tweede, derde en zesde lid, van de Arbeidsomstandighedenwet 1998][ref1]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel27
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '27'
  - number: '9.3'
    text: |-
      Met het toezicht op de naleving van de in het eerste lid bedoelde verplichting en van een aan een werkgever
      gestelde eis als bedoeld in het tweede lid, zijn belast de bij besluit van Onze Minister aangewezen onder hem
      ressorterende ambtenaren. Van dat besluit wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel9
  - number: '9.4'
    text: |-
      Voor de toepassing van dit artikel wordt onder werkgever mede verstaan de eigenrisicodrager, bedoeld in
      [artikel 8, twaalfde lid][ref1], en wordt onder werknemer, bedoeld in [artikel 8, eerste lid][ref2], mede verstaan
      de persoon, bedoeld in [artikel 8, twaalfde lid][ref3], aan wie de eigenrisicodrager ziekengeld moet betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel8
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '10.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft tot taak de bevordering van de inschakeling in het
      arbeidsproces van de arbeidsgehandicapte ten aanzien van wie de werkgever geen verplichting heeft als bedoeld in
      [artikel 8][ref1], die


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel8
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 10.1.a
    text: |-
      recht heeft op een uitkering op grond van de [ZW][ref1], de [WAO][ref2], de [WAJONG][ref3], de [WW][ref4] of de
      [WBIA][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008657
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0007891
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008657
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0007891
  - number: 10.1.b
    text: |-
      verzekerd is op grond van de [WAZ][ref1], of recht heeft op een uitkering op grond van de [WAZ][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008656
      [ref2]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008656
      - id: ref2
        bwb_id: BWBR0008656
  - number: 10.1.c
    text: |-
      ingezetene is als bedoeld in [artikel 3 van de WAJONG][ref1] en de leeftijd van 18 jaar nog niet heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '3'
  - number: 10.1.d
    text: |-
      als gewezen overheidswerknemer recht heeft op bezoldiging of uitkering in geval van ziekte als bedoeld in
      [artikel 1, onderdeel e, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1] of recht heeft op
      een wachtgeld als bedoeld in [artikel 1, onderdeel r, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009267#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009267
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009267
        artikel: '1'
  - number: '10.2'
    text: |-
      Uit hoofde van de uitoefening van zijn taak, bedoeld in het eerste lid, verstrekt het Uitvoeringsinstituut
      werknemersverzekeringen aan arbeidsgehandicapten instrumenten als bedoeld in [hoofdstuk 4][ref1] van deze wet en
      verstrekt het aan werkgevers instrumenten als bedoeld in [hoofdstuk 3][ref2] van deze wet om indiensttreding van
      deze personen te bevorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009565
        hoofdstuk: '3'
  - number: '10.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen laat de werkzaamheden waarmee de in het eerste lid bedoelde taak
      wordt uitgevoerd, verrichten door een natuurlijke persoon dan wel rechtspersoon die in het kader van de uitoefening
      van beroep of bedrijf de inschakeling van personen in de arbeid bevordert.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel10
  - number: '10.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan de in het derde lid bedoelde natuurlijke persoon
      of rechtspersoon gegevens voorzover deze noodzakelijk zijn voor de uitvoering van de in het tweede lid bedoelde
      werkzaamheden, alsmede het sociaal-fiscaalnummer van de persoon wiens inschakeling in de arbeid door die
      natuurlijke persoon of rechtspersoon wordt bevorderd. Deze natuurlijke persoon of rechtspersoon verwerkt de in dit
      lid bedoelde gegevens slechts voor zover dat noodzakelijk is voor de werkzaamheden, bedoeld in het derde lid, en
      gebruikt slechts met dat doel het sociaal-fiscaalnummer bij die verwerking.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel10
  - number: '10.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de uitvoering van het derde
      en vierde lid, waarbij in ieder geval regels kunnen worden gesteld voor de inhoud van de overeenkomst met de
      in het derde lid bedoelde natuurlijke of rechtspersoon, het verstrekken en verwerken van gegevens en de soort
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel10
  - number: '10.6'
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel10
  - number: '11'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft mede tot taak te bevorderen dat belemmeringen worden
      weggenomen die de ingezetene, bedoeld in [artikel 3 van de WAJONG][ref1], vanwege ziekte of gebrek ondervindt bij
      het volgen van onderwijs, indien het een persoon betreft die:


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '3'
  - number: 11.a
    text: jonger is dan 17 jaar;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel11
  - number: 11.b
    text: |-
      studerende is als bedoeld in [artikel 5 van de WAJONG][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel5
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '5'
  - number: 11.c
    text: |-
      jonger is dan 30 jaar en uitsluitend vanwege zijn ziekte of gebrek niet kan worden aangemerkt als studerende als
      bedoeld in [artikel 5 van de WAJONG][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel5
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '5'
  - number: '12.1'
    text: 'De gemeenten hebben tot taak de bevordering van de inschakeling in het arbeidsproces van arbeidsgehandicapten die:'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel12
  - number: 12.1.a
    text: |-
      recht hebben op een uitkering op grond van de [Wet werk en bijstand](onbekend), de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2],
      de[ Wet inkomensvoorziening kunstenaars][ref3] of de [Algemene nabestaandenwet][ref4] en niet tevens recht hebben
      op een uitkering als bedoeld in [artikel 10, eerste lid][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
      [ref3]: https://wetten.overheid.nl/BWBR0009344
      [ref4]: https://wetten.overheid.nl/BWBR0007795
      [ref5]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004163
      - id: ref3
        bwb_id: BWBR0009344
      - id: ref4
        bwb_id: BWBR0007795
      - id: ref5
        bwb_id: BWBR0009565
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 12.1.b
    text: |-
      als werkzoekende bij de Centrale organisatie werk en inkomen zijn geregistreerd en niet worden bedoeld in onderdeel
      a, of [artikel 10][ref1] en [11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel11
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Uit hoofde van de uitoefening van de taak, bedoeld in het eerste lid, verstrekt het gemeentebestuur voorzieningen
      als bedoeld in [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref1] gericht op behoud, herstel
      of bevordering van de mogelijkheid tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
  - number: '13.1'
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen ter uitvoering van de taak, bedoeld in
      [artikel 10, eerste lid][ref1], of [artikel 11][ref2], voor een arbeidsgehandicapte, die recht heeft op uitkering
      op grond van de [WAO][ref3], de [WAZ][ref4] of de [WAJONG][ref5], die niet tevens recht heeft op uitkering op grond
      van [hoofdstuk IIa](onbekend) of [IIb van de WW](onbekend) een plan heeft opgesteld of laten opstellen, gericht op
      behoud, herstel of bevordering van de mogelijkheid tot het verrichten van arbeid, tekent die arbeidsgehandicapte,
      een exemplaar van dat plan voor gezien en verstrekt dit aan het instituut. Het plan wordt tevens getekend door het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0008656
      [ref5]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0008656
      - id: ref5
        bwb_id: BWBR0008657
  - number: '13.2'
    text: |-
      Indien een plan als bedoeld in het eerste lid is opgesteld, en in het besluit tot toekenning of herziening van een
      arbeidsongeschiktheidsuitkering op grond van de in het eerste lid bedoelde wetten wordt verwezen naar voorschriften
      in het belang van behoud, herstel en bevordering van de mogelijkheid tot het verrichten van arbeid, wordt dit plan
      in een bijlage bij dat besluit opgenomen.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel13
  - number: '14.1'
    text: |-
      Artikel 10 is niet van toepassing op arbeidsgehandicapten die recht hebben op een uitkering op grond van
      de [WAO][ref1], de [WAZ][ref2] of de [WAJONG][ref3], die niet tevens recht hebben op uitkering op grond
      van [hoofdstuk IIa][ref4] of [IIb van de WW][ref5], indien het Uitvoeringsinstituut werknemersverzekeringen
      met het college van burgemeester en wethouders van een gemeente overeenkomt dat op die arbeidsgehandicapten
      [artikel 7, eerste lid, aanhef en onderdeel a, van de Wet werk en bijstand][ref6] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
      [ref4]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIA
      [ref5]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIB
      [ref6]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
      - id: ref4
        bwb_id: BWBR0004045
        hoofdstuk: IIA
      - id: ref5
        bwb_id: BWBR0004045
        hoofdstuk: IIB
      - id: ref6
        bwb_id: BWBR0015703
        artikel: '7'
  - number: '14.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de overgang van de taak
      van de werkgever op grond van [artikel 8][ref1], op het Uitvoeringsinstituut werknemersverzekeringen op grond
      van [artikel 10][ref2] of op de gemeenten op grond van [artikel 12][ref3], alsmede voor het geval dat voor een
      arbeidsgehandicapte werknemer meerdere werkgevers verantwoordelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel12
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '16.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag van de werkgever die met een werknemer een
      dienstbetrekking van ten minste zes maanden is aangegaan of waarmee door elkaar opvolgende dienstbetrekkingen
      gedurende ten minste zes maanden een dienstbetrekking blijkt te bestaan, subsidie verstrekken voor meerkosten
      voorzover:
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel16
  - number: 16.1.a
    text: |-
      die werkgever aantoont dat het totaal van de kosten die hij heeft gemaakt ten behoeve van het in dienst nemen of
      in dienst houden van een arbeidsgehandicapte werknemer meer bedraagt dan de som van de premiekortingen, bedoeld
      in [artikel 79b van de Wet op de arbeidsongeschiktheidsverzekering][ref1] en [artikel 82][ref2], [82a][ref3]
      of [97c van de Werkloosheidswet][ref4]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel79b
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel82a
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel97c
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 79b
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '82'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 82a
      - id: ref4
        bwb_id: BWBR0004045
        artikel: 97c
  - number: 16.1.b
    text: |-
      die werkgever, na ommekomst van de periode van 3 respectievelijk 1 jaar, genoemd in de aangehaalde wetsartikelen,
      kosten heeft gemaakt ten behoeve van het in dienst houden van een arbeidsgehandicapte werknemer.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel16
  - number: '16.2'
    text: |-
      Onder het totaal van de kosten, bedoeld in het eerste lid, wordt verstaan het totaal van de kosten ten behoeve
      van een arbeidsgehandicapte werknemer en verband houdende met kosten die voortvloeien uit de noodzakelijke
      aanpassingen van de samenstelling en toewijzing van arbeid, de inrichting van de arbeidsplaats, de productie-
      en werkmethoden, en de bij de arbeid te gebruiken hulpmiddelen, alsmede met de kosten die voortvloeien uit de
      aanpassing van de inrichting van het bedrijf, voorzover de behoefte daaraan wordt opgeroepen door de deelneming van
      de arbeidsgehandicapte werknemer aan de werkzaamheden of het daarmee samenhangende verblijf in het bedrijf.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel16
  - number: '16.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld met
      betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel16
  - number: '17.1'
    text: |-
      In geval van overgang van een onderneming als bedoeld in [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1],
      waarbij aan de werkgever die de onderneming overdraagt een subsidie is verstrekt als bedoeld in [artikel 16][ref2],
      wordt voor de toepassing van deze wet de subsidie aangemerkt als een subsidie verstrekt aan de werkgever die de
      onderneming overneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel16
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '17.2'
    text: |-
      Indien slechts een deel van de onderneming overgaat als bedoeld in het eerste lid, vindt het eerste lid uitsluitend
      toepassing, indien de werknemers voor wie subsidies zijn verstrekt als bedoeld in het eerste lid, hun werkzaamheden
      uitoefenen bij het deel van de onderneming dat wordt overgenomen.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel17
  - number: '20'
    text: |-
      Het besluit tot vaststelling van een subsidie als bedoeld in [artikel 16][ref1]
      wordt ingetrokken of gewijzigd indien sprake is van een omstandigheid als bedoeld in
      [artikel 4:49, eerste lid, onderdeel a, b of c, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '21.1'
    text: |-
      Subsidies als bedoeld in [artikel 16][ref1] die onverschuldigd zijn betaald, worden door het Uitvoeringsinstituut
      werknemersverzekeringen teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '21.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21
  - number: '21.3'
    text: |-
      Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd en de termijn of de termijnen waarbinnen moet
      worden betaald.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21
  - number: '21.4'
    text: |-
      De persoon van wie wordt teruggevorderd is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21
  - number: '21.5'
    text: |-
      Het besluit tot terugvordering levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '21.6'
    text: |-
      [Artikel 29g, vijfde tot en met tiende lid, van de WAO][ref1] is van overeenkomstige toepassing, met dien verstande
      dat indien het gemiddeld inkomen van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de
      [artikelen 475c][ref2] en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, het
      Uitvoeringsinstituut werknemersverzekeringen de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29g
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29g
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '21.7'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de terugvordering en de tenuitvoerlegging van
      besluiten tot terugvordering als bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21
  - number: '21.8'
    text: |-
      In afwijking van het eerste lid, kan het Uitvoeringsinstituut werknemersverzekeringen, onder voorwaarden die Onze
      Minister kan stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze
      Minister vast te stellen bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21
  - number: 21a.1
    text: |-
      In afwijking van [artikel 21][ref1] kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van
      terugvordering af te zien, indien de persoon van wie wordt teruggevorderd:


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel21
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 21a.1.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21a
  - number: 21a.1.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21a
  - number: 21a.1.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21a
  - number: 21a.1.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21a
  - number: 21a.2
    text: 'De in het eerste lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21a
  - number: 21a.2.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de [artikelen 475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 21a.2.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 45][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel45
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '45'
        hoofdstuk: '6'
  - number: 21a.3
    text: Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel21a
  - number: '22.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan aan de arbeidsgehandicapte, bedoeld in [artikel 10][ref1], op
      aanvraag of ambtshalve voorzieningen toekennen die strekken tot behoud, herstel of bevordering van de mogelijkheid
      tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '22.2'
    text: 'Onder voorzieningen als bedoeld in het eerste lid, worden in ieder geval verstaan:'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22
  - number: 22.2.a
    text: scholing of opleiding;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22
  - number: 22.2.b
    text: voorzieningen die noodzakelijk zijn voor het kunnen volgen van scholing of opleiding als bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22
  - number: 22.2.c
    text: |-
      voorzieningen die noodzakelijk zijn voor het kunnen verrichten van arbeid op een proefplaats als bedoeld in
      [artikel 23, eerste lid, onderdeel a][ref1], en voor het kunnen deelnemen aan andere activiteiten die bevorderlijk
      zijn voor de inschakeling in de arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel23
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '22.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de arbeidsgehandicapte, bedoeld in
      [artikel 10, eerste lid, onderdeel b][ref1], andere voorzieningen toekennen die strekken tot behoud, herstel of
      bevordering van de mogelijkheid tot het verrichten van arbeid dan de voorzieningen, bedoeld in het tweede lid,
      indien zij noodzakelijk zijn voor de uitoefening van de werkzaamheden op grond waarvan de arbeidsgehandicapte
      verzekerd is voor de [WAZ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008656
  - number: '22.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de persoon, bedoeld in [artikel 11][ref1]
      voorzieningen toekennen die hem in staat stellen onderwijs te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel11
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '22.5'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de persoon, bedoeld in het eerste, derde en
      vierde lid, vervoersvoorzieningen toekennen die strekken tot verbetering van zijn leefomstandigheden en die deel
      uitmaken van danwel rechtstreeks samenhangen met voorzieningen als bedoeld in het tweede lid, onderdeel b en c, het
      derde en het vierde lid.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22
  - number: '22.6'
    text: |-
      Onder voorzieningen als bedoeld in dit artikel wordt niet verstaan financiering van, of tegemoetkoming in de kosten
      van, kinderopvang.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22
  - number: '22.7'
    text: Bij of krachtens algemene maatregel van bestuur worden met betrekking tot dit artikel nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22
  - number: 22a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan ten behoeve van de arbeidsgehandicapte, ten behoeve van wie
      het Uitvoeringsinstituut werknemersverzekeringen werkzaamheden gericht op de bevordering van de inschakeling in het
      arbeidsproces als bedoeld in [artikel 10, derde lid][ref1], laat verrichten of aan wie een voorziening als bedoeld
      in [artikel 22, eerste tot en met vierde lid][ref2], is toegekend, of die werkzaamheden op een proefplaats verricht
      als bedoeld in [artikel 23, eerste lid, onderdeel a][ref3], op diens aanvraag een schriftelijke overeenkomst met
      betrekking tot kinderopvang sluiten met een rechtspersoon of een natuurlijke persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel23
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 22a.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan aan de werkgever, op diens aanvraag, een tegemoetkoming in de
      kosten in verband met kinderopvang voor de arbeidsgehandicapte werknemer verstrekken:
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22a
  - number: 22a.2.a
    text: |-
      indien deze uiterlijk zes maanden na beëindiging van de overeenkomst, bedoeld in het eerste lid, werkzaamheden gaat
      verrichten in een dienstbetrekking voor de duur van ten minste zes maanden;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22a
  - number: 22a.2.b
    text: |-
      indien deze, na het tijdstip gelegen zes maanden na ingang van diens uitkering op grond van de [WAO][ref1],
      [WAZ][ref2] of [WAJONG][ref3], werkzaamheden gaat verrichten in een dienstbetrekking voor de duur van ten minste
      zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
  - number: 22a.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan het eerste en het tweede lid van dit artikel en
      [artikel 74, eerste en tweede lid, van de Werkloosheidswet][ref1] per kalenderjaar toepassen op, in totaal, ten
      hoogste 4000 werknemers. Indien het eerste en het tweede lid in enig kalenderjaar worden toegepast op dezelfde
      arbeidsgehandicapte is dit een toepassing op twee arbeidsgehandicapten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel74
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '74'
  - number: 22a.4
    text: |-
      De bevoegdheid, bedoeld in het eerste en tweede lid, bestaat uitsluitend ter zake van opvang van een kind
      in de leeftijd van 0 jaar tot de leeftijd waarop het primair onderwijs voor dat kind eindigt en voor wie de
      arbeidsgehandicapte recht heeft op kinderbijslag op grond van de[ Algemene Kinderbijslagwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 22a.5
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt verstaan onder kinderopvang: het in georganiseerd verband
      tegen vergoeding verzorgen en opvoeden van kinderen door anderen dan de eigen ouder, pleeg- of stiefouder op
      uren dat deze zelf hiervoor niet beschikbaar is wegens de omstandigheden, bedoeld in het eerste en tweede lid,
      waarbij wordt voldaan aan de eisen gesteld bij [artikel 20 van de Welzijnswet 1994][ref1] en de daarop berustende
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel20
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '20'
  - number: 22a.6
    text: |-
      De arbeidsgehandicapte, ten behoeve van wie het Uitvoeringsinstituut werknemersverzekeringen een schriftelijke
      overeenkomst met betrekking tot kinderopvang sluit als bedoeld in het eerste lid, is een eigen bijdrage
      verschuldigd aan het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22a
  - number: 22a.7
    text: De eigen bijdrage, bedoeld in het zesde lid, wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22a
  - number: 22a.8
    text: 'De tegemoetkoming, bedoeld in het tweede lid, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22a
  - number: 22a.8.a
    text: |-
      met betrekking tot een bij de aanvang van de werkzaamheden ongehuwde arbeidsgehandicapte of gehuwde
      arbeidsgehandicapte, wiens echtgenoot geen inkomen uit arbeid geniet, de kosten die de werkgever in verband met
      kinderopvang heeft gemaakt over de periode van twaalf maanden vanaf de datum van aanvang van de werkzaamheden,
      waarbij de arbeidsgehandicapte geacht wordt een eigen bijdrage te zijn verschuldigd overeenkomstig het zesde lid;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22a
  - number: 22a.8.b
    text: |-
      met betrekking tot een bij de aanvang van de werkzaamheden gehuwde arbeidsgehandicapte, wiens echtgenoot inkomsten
      uit arbeid geniet, vijftig procent van de kosten als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22a
  - number: 22a.9
    text: |-
      Voor de toepassing van dit artikel wordt gelijkgesteld met gehuwd, ongehuwd en echtgenoot, hetgeen daarmee gelijk
      wordt gesteld op grond van [artikel 1 van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel1
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '1'
  - number: '23.1'
    text: |-
      Aan de arbeidsgehandicapte die recht heeft op een uitkering op grond van de [WW][ref1] of de [WBIA][ref2], kan door
      het Uitvoeringsinstituut werknemersverzekeringen een reïntegratie-uitkering worden toegekend indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0007891
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0007891
  - number: 23.1.a
    text: op een proefplaats bij een werkgever onbeloonde werkzaamheden gaat verrichten;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel23
  - number: 23.1.b
    text: |-
      een naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen noodzakelijke scholing of opleiding gaat
      volgen.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel23
  - number: '23.2'
    text: |-
      Met de arbeidsgehandicapte, bedoeld in het eerste lid, wordt gelijkgesteld de arbeidsgehandicapte die geen
      recht heeft op uitkering op grond van de [WW][ref1] omdat hij niet voldoet aan de voorwaarde, bedoeld in
      [artikel 16, eerste lid, onderdeel b, van de WW][ref2], wegens het enkele feit dat hij voorafgaande aan of
      aansluitend op het arbeidsurenverlies en het verlies van het recht op doorbetaling van loon als bedoeld in
      [artikel 16, eerste lid, onderdeel a, van de WW][ref3], deelneemt of gaat deelnemen aan een scholing of opleiding
      als bedoeld in het eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '16'
  - number: '23.3'
    text: |-
      Indien de arbeidsgehandicapte, bedoeld in het eerste en tweede lid, recht heeft op een
      arbeidsongeschiktheidsuitkering op grond van de [WAO][ref1], de [WAZ][ref2] of de [WAJONG][ref3], wordt deze
      uitkering gedurende de periode waarover de reïntegratie-uitkering wordt verstrekt, terzake van de onbeloonde
      werkzaamheden niet ingetrokken of herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
  - number: '23.4'
    text: |-
      Een uitkering als bedoeld in het eerste lid, wordt voor de toepassing van andere wetten en de daarop berustende
      bepalingen, met uitzondering van de [WW][ref1], aangemerkt als een uitkering op grond van de verplichte verzekering
      op grond van de [WW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
  - number: '24.1'
    text: |-
      Een aanvraag voor toekenning van een reïntegratie-uitkering wordt voor aanvang van de onbeloonde werkzaamheden,
      scholing of opleiding als bedoeld in [artikel 23, eerste lid][ref1], of binnen een maand na die aanvang, ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel23
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '24.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kent de reïntegratie-uitkering terzake van het verrichten van
      onbeloonde werkzaamheden op een proefplaats niet toe, indien:
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel24
  - number: 24.2.a
    text: |-
      vaststaat dat de onbeloonde werkzaamheden, bedoeld in [artikel 23, eerste lid][ref1], de krachten en bekwaamheden
      van de werknemer te boven gaan;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel23
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 24.2.b
    text: |-
      de onbeloonde werkzaamheden, bedoeld in [artikel 23, eerste lid][ref1], op grond van de [WW][ref2] met behoud van
      de uitkering kunnen worden verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
  - number: 24.2.c
    text: |-
      de werkgever waarbij de proefplaatsing geschiedt geen aansprakelijkheids- en ongevallenverzekering ten behoeve van
      de werknemer heeft afgesloten;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel24
  - number: 24.2.d
    text: |-
      de arbeidsgehandicapte dezelfde of gelijksoortige werkzaamheden reeds eerder onbeloond op een proefplaats bij de
      werkgever of diens rechtsvoorganger heeft verricht en terzake van deze eerste proefplaatsing een reïntegratie-
      uitkering is toegekend.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel24
  - number: '24.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kent de reïntegratie-uitkering terzake van het volgen van scholing
      of opleiding niet toe indien de arbeidsgehandicapte dezelfde of een soortgelijke scholing of opleiding reeds heeft
      gevolgd.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel24
  - number: '24.4'
    text: |-
      De reïntegratie-uitkering die is toegekend terzake van het volgen van scholing of opleiding wordt beëindigd, indien
      de persoon aan wie hij is toegekend zich onvoldoende inspant om de scholing of opleiding met een gunstig resultaat
      af te ronden.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel24
  - number: '24.5'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het tweede lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel24
  - number: '25.1'
    text: |-
      De [artikelen 30, eerste lid en tweede lid, onderdelen a en b][ref1], [31, eerste lid][ref2], [32][ref3],
      [33, eerste, tweede en derde lid][ref4], [37][ref5] en [39 van de WW][ref6] zijn voor wat betreft de betaling van
      de reïntegratie-uitkering van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel33
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel37
      [ref6]: https://wetten.overheid.nl/BWBR0004045#Artikel39
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '31'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '32'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '33'
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '37'
      - id: ref6
        bwb_id: BWBR0004045
        artikel: '39'
  - number: '25.2'
    text: |-
      Indien de persoon aan wie een reïntegratie-uitkering terzake van het volgen van scholing of opleiding is toegekend
      arbeid gaat verrichten, wordt de reïntegratie-uitkering verminderd met 70% van hetgeen hij met die arbeid verdient.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel25
  - number: '25.3'
    text: |-
      Op de reïntegratie-uitkering worden geheel in mindering gebracht de inkomsten uit of in verband met scholing
      of opleiding voorzover zij meer bedragen dan het door Onze Minister op grond van [artikel 35a van de WW][ref1]
      vastgestelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel35a
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 35a
  - number: '25.4'
    text: |-
      [Artikel 34 van de WW][ref1] is van overeenkomstige toepassing, met dien verstande dat een uitkering op grond van
      de [WW][ref2] of de [WBIA][ref3] niet in mindering wordt gebracht op de reïntegratie-uitkering, tenzij het recht
      op uitkering voortvloeit uit het verrichten van arbeid aangevangen na toekenning van een reïntegratie-uitkering als
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0007891
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0007891
  - number: '26.1'
    text: |-
      De reïntegratie-uitkering terzake van het verrichten van onbeloonde werkzaamheden als bedoeld in
      [artikel 23, eerste lid, onderdeel a][ref1], wordt verstrekt over een aaneengesloten periode van zes maanden of
      zoveel korter als de onbeloonde werkzaamheden op de proefplaats worden verricht, te rekenen vanaf de eerste dag van
      de kalenderweek waarin de werkzaamheden een aanvang hebben genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel23
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '26.2'
    text: |-
      De reïntegratie-uitkering terzake van het volgen van scholing of opleiding als bedoeld in
      [artikel 23, eerste lid, onderdeel b][ref1], wordt verstrekt over een aaneengesloten periode van twee jaar of
      zoveel korter als de scholing of opleiding wordt gevolgd, te rekenen vanaf de eerste dag van de kalenderweek waarin
      de scholing of opleiding een aanvang heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel23
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '26.3'
    text: |-
      Indien de werkzaamheden op een proefplaats of de scholing of opleiding, bedoeld in het eerste lid, wegens ziekte
      worden onderbroken, wordt de periode waarin een uitkering bij ziekte wordt ontvangen, voor de toepassing van het
      eerste en tweede lid buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel26
  - number: '27.1'
    text: |-
      De hoogte van de reïntegratie-uitkering is gelijk aan het bedrag van de uitkering op grond van de [WW][ref1] of
      de [WBIA][ref2] dat zonder toepassing van [artikel 33, derde lid, van de WW][ref3] zou zijn betaald voorzover
      betrokkene over de uren waarop hij de werkzaamheden op een proefplaats verricht werknemer zou zijn gebleven of
      het recht op uitkering op grond van [artikel 19, eerste lid, onderdeel m, van de WW][ref4] niet zou zijn geëindigd
      wegens het ontvangen van een reïntegratie-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0007891
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0007891
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '33'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '19'
  - number: '27.2'
    text: |-
      Bij de bepaling van de hoogte van de reïntegratie-uitkering wordt geen rekening gehouden met een eventuele
      verlaging of eindiging van de uitkering op grond van de [WW][ref1] die zou zijn opgetreden indien deze uitkering
      gedurende de proefplaatsing, scholing of opleiding zou zijn doorbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '27.3'
    text: |-
      De hoogte van de reïntegratie-uitkering voor de arbeidsgehandicapte, bedoeld in [artikel 23, tweede lid][ref1], is
      gelijk aan het bedrag dat hij aan uitkering op grond van de [WW][ref2] zou hebben ontvangen, indien hij wel aan de
      voorwaarde, bedoeld in [artikel 16, eerste lid, onderdeel b, van de WW][ref3], zou hebben voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '16'
  - number: '28'
    text: |-
      Indien het treffen van een voorziening tot gevolg heeft dat de arbeidsgehandicapte die verzekerd is op grond
      van de [WAZ][ref1] geen of slechts gedeeltelijk arbeid kan verrichten en uit dien hoofde inkomen derft, heeft
      hij tijdens de duur van die voorziening aanspraak op een door het Uitvoeringsinstituut werknemersverzekeringen
      op aanvraag toe te kennen toelage die overeenkomt met het bedrag van het gederfde inkomen, met dien
      verstande, dat de toelage of, indien een arbeidsongeschiktheidsuitkering op grond van de [WAZ][ref2],
      [WAO][ref3] of [WAJONG][ref4] wordt genoten, de toelage vermeerderd met die uitkering, per dag het in
      [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref5] bedoelde maximum dagloon, niet te boven
      gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008656
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008656
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0008657
      - id: ref5
        bwb_id: BWBR0002126
        artikel: '9'
  - number: '29'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de toekenning door het
      Uitvoeringsinstituut werknemersverzekeringen van inkomenssuppletie aan een arbeidsgehandicapte die de uitoefening
      van zijn bedrijf of beroep voortzet of die werkzaamheden als zelfstandige gaat verrichten en wiens inkomen uit dat
      bedrijf of beroep lager is dan het bij of krachtens [artikel 2 van de WAZ][ref1], [artikel 2 van de WAJONG][ref2]
      of [artikel 18 van de WAO][ref3] vastgestelde inkomen of loon dat hij nog zou kunnen verdienen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '18'
  - number: '30'
    text: |-
      Ter voorziening in de behoefte aan bedrijfskapitaal van een arbeidsgehandicapte, bedoeld in [artikel 10][ref1], die
      werkzaamheden als zelfstandige gaat verrichten kunnen bij algemene maatregel van bestuur regels worden gesteld met
      betrekking tot de verstrekking door het Uitvoeringsinstituut werknemersverzekeringen van gelden in de vorm van een
      lening of het door het Uitvoeringsinstituut werknemersverzekeringen verlenen van borgtocht, alsmede omtrent de aard
      en de omvang van de activiteiten en de aan de subsidie te verbinden verplichtingen. Bij deze algemene maatregel
      van bestuur kan worden bepaald, dat het Uitvoeringsinstituut werknemersverzekeringen, alvorens over te gaan tot
      toekenning, advies vraagt aan derden over het door een arbeidsgehandicapte over te leggen bedrijfsplan waaruit de
      levensvatbaarheid van het bedrijf of de voorgenomen zelfstandige uitoefening van een beroep blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '31.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan aan de arbeidsgehandicapte die arbeid in dienstbetrekking
      verricht op aanvraag voorzieningen toekennen die strekken tot behoud, herstel of bevordering van de mogelijkheid
      tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel31
  - number: '31.2'
    text: 'Onder voorzieningen als bedoeld in het eerste lid, worden uitsluitend verstaan:'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel31
  - number: 31.2.a
    text: vervoersvoorzieningen die er toe strekken dat de arbeidsgehandicapte werknemer zijn werkplek kan bereiken;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel31
  - number: 31.2.b
    text: |-
      noodzakelijke persoonlijke ondersteuning van de werknemer, bedoeld in het eerste lid, bij het verrichten van de hem
      opgedragen taken, indien die ondersteuning een compensatie vormt voor specifiek met de handicap van de werknemer
      samenhangende beperkingen;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel31
  - number: 31.2.c
    text: communicatievoorzieningen voor doven;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel31
  - number: 31.2.d
    text: |-
      meeneembare voorzieningen ten behoeve van de inrichting van de arbeidsplaats, de productie- en werkmethoden, en de
      bij de arbeid te gebruiken hulpmiddelen die in overwegende mate op het individu van de werknemer zijn afgestemd.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel31
  - number: '31.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan aan de persoon, bedoeld in het eerste lid, op aanvraag
      vervoersvoorzieningen toekennen die strekken tot verbetering van zijn leefomstandigheden en die deel uitmaken van
      danwel rechtstreeks samenhangen met voorzieningen als bedoeld in het tweede lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel31
  - number: '31.4'
    text: |-
      Onder arbeidsgehandicapte als bedoeld in het eerste lid, wordt voor de toepassing van dit artikel mede verstaan, de
      arbeidsgehandicapte, bedoeld in [artikel 10][ref1], die arbeid in dienstbetrekking gaat verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '31.5'
    text: Bij of krachtens algemene maatregel van bestuur worden met betrekking tot dit artikel nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel31
  - number: '32'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de toekenning door het
      Uitvoeringsinstituut werknemersverzekeringen van loonsuppletie aan een arbeidsgehandicapte die werk in
      dienstbetrekking aanvaardt of verricht tegen een lager loon dan het bij of krachtens [artikel 2 van de WAZ][ref1],
      [artikel 2 van de WAJONG][ref2] of [artikel 18 van de WAO][ref3] vastgestelde inkomen of loon dat hij nog zou
      kunnen verdienen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '18'
  - number: '33.1'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld op grond waarvan het Landelijk instituut sociale
      verzekeringen aan de arbeidsgehandicapte, bedoeld in [artikel 22][ref1], en aan de arbeidsgehandicapte werknemer,
      bedoeld in [artikel 31][ref2], op aanvraag in plaats van bij die regeling vast te stellen reïntegratie-instrumenten
      als bedoeld in dit hoofdstuk, met uitzondering van de financiering van, of tegemoetkoming in de kosten van,
      kinderopvang, bedoeld in [artikel 22a][ref3], een subsidie verstrekt in de vorm van een op de arbeidsinschakeling
      gericht persoonsgebonden reïntegratiebudget. In deze regeling kunnen regels worden gesteld omtrent de aard en de
      omvang van de activiteiten en de aan de subsidie te verbinden verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel22a
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: 22a
        hoofdstuk: '4'
        paragraaf: 1a
  - number: '33.2'
    text: |-
      Een ministeriële regeling als bedoeld in het eerste lid treedt niet eerder in werking dan vier weken nadat een
      ontwerp daartoe aan beide kamers der Staten-Generaal is voorgelegd.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel33
  - number: '33.3'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van een ministeriële regeling als bedoeld in het eerste
      lid, aan beide Kamers der Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze regeling.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel33
  - number: 33a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag van een arbeidsgehandicapte werknemer als bedoeld
      in [artikel 31, eerste lid][ref1], en van de persoon, bedoeld in [artikel 8, twaalfde lid][ref2], aan wie de
      eigenrisicodrager ziekengeld moet betalen, besluiten:


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel8
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 33a.1.a
    text: |-
      aan de aanvrager subsidie te verstrekken in de vorm van een op zijn arbeidsinschakeling gericht persoonsgebonden
      reïntegratiebudget; of
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel33a
  - number: 33a.1.b
    text: |-
      met een natuurlijke persoon of rechtspersoon die in het kader van de uitoefening van beroep of bedrijf
      de inschakeling van personen in de arbeid bevordert, een overeenkomst te sluiten die is gericht op de
      arbeidsinschakeling van deze aanvrager.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel33a
  - number: 33a.2
    text: |-
      Een subsidie als bedoeld in het eerste lid, onderdeel a, of een overeenkomst als bedoeld in het eerste lid,
      onderdeel b, kan het Uitvoeringsinstituut werknemersverzekeringen op aanvraag van een arbeidsgehandicapte werknemer
      uitsluitend verstrekken of sluiten, indien dit instituut van oordeel is dat in het bedrijf van zijn werkgever of
      een ander bedrijf geen passende arbeid aanwezig is die de betrokken werknemer kan verrichten.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel33a
  - number: 33a.3
    text: |-
      De in het eerste lid bedoelde subsidie-ontvanger laat de werkzaamheden die zijn gericht op arbeidsinschakeling,
      bedoeld in het eerste lid, verrichten door een natuurlijke persoon dan wel rechtspersoon, die in het kader van de
      uitoefening van beroep of bedrijf de inschakeling van personen in de arbeid bevordert.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel33a
  - number: 33a.4
    text: |-
      De in het eerste lid bedoelde aanvrager verstrekt de gegevens, voorzover deze noodzakelijk zijn voor de uitvoering
      van de werkzaamheden die zijn gericht op arbeidsinschakeling, bedoeld in het eerste lid, alsmede zijn sociaal-
      fiscaalnummer aan de natuurlijke persoon of rechtspersoon, die in het kader van de uitoefening van beroep of
      bedrijf zijn inschakeling in de arbeid bevordert.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel33a
  - number: 33a.5
    text: |-
      De in het vierde lid bedoelde natuurlijke persoon of rechtspersoon verwerkt de in dat lid bedoelde gegevens slechts
      voorzover dat noodzakelijk is voor de werkzaamheden, bedoeld in het eerste lid, en gebruikt slechts met dat doel
      het sociaal-fiscaalnummer bij die verwerking.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel33a
  - number: 33a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent dit artikel, waarbij kan
      worden bepaald in welke situaties een deel van de subsidiekosten in rekening kan worden gebracht bij de werkgever.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel33a
  - number: 33a.7
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het vierde lid treedt niet eerder in werking dan vier weken na de
      datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan
      aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel33a
  - number: '34.1'
    text: |-
      Een besluit tot toekenning van voorzieningen als bedoeld in [artikel 22][ref1] en [31][ref2], van financiering van,
      of tegemoetkoming in de kosten van, kinderopvang als bedoeld in artikel 22a, van een reïntegratie-uitkering als
      bedoeld in [artikel 23][ref3], van toelagen als bedoeld in [artikel 28][ref4], van inkomenssuppletie als bedoeld
      in [artikel 29][ref5] en van loonsuppletie als bedoeld in [artikel 32][ref6] wordt ingetrokken of herzien indien de
      voorzieningen de financiering van, of de tegemoetkoming in de kosten van kinderopvang,, de reïntegratie-uitkering,
      de toelagen, de inkomenssuppletie of de loonsuppletie als hiervoor bedoeld ten onrechte of tot een te hoog bedrag
      zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0009565#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0009565#Artikel29
      [ref6]: https://wetten.overheid.nl/BWBR0009565#Artikel32
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009565
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0009565
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0009565
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '34.2'
    text: |-
      Het besluit tot vaststelling van een subsidie als bedoeld in [artikel 30][ref1], [33][ref2]
      of [33a][ref3] wordt ingetrokken of gewijzigd indien sprake is van een omstandigheid als bedoeld in
      [artikel 4:49, eerste lid, onderdeel a, b, of c, van de Algemene wet bestuursrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: 33a
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '35.1'
    text: |-
      De voorziening of de kosten van de voorziening, bedoeld in [artikel 22][ref1] en [31][ref2], de financiering van,
      of de tegemoetkoming in de kosten van, kinderopvang, bedoeld in [artikel 22a][ref3], de reïntegratie-uitkering,
      bedoeld in [artikel 23][ref4], de toelage, bedoeld in [artikel 28][ref5], de inkomenssuppletie, bedoeld in
      [artikel 29][ref6] en de loonsuppletie, bedoeld in [artikel 32][ref7], die als gevolg van een besluit als bedoeld
      in [artikel 34][ref8] onverschuldigd zijn verstrekt worden door het Uitvoeringsinstituut werknemersverzekeringen
      teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel22a
      [ref4]: https://wetten.overheid.nl/BWBR0009565#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0009565#Artikel28
      [ref6]: https://wetten.overheid.nl/BWBR0009565#Artikel29
      [ref7]: https://wetten.overheid.nl/BWBR0009565#Artikel32
      [ref8]: https://wetten.overheid.nl/BWBR0009565#Artikel34
