        paragraaf: '2'
  - number: 43.1.d
    text: |-
      toelagen, bedoeld in [artikel 28][ref1], alsmede de op grond van enige wet over deze toelagen verschuldigde premies
      die niet op deze toelagen in mindering kunnen worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel28
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 43.1.e
    text: |-
      inkomenssuppletie, bedoeld in [artikel 29][ref1], alsmede de op grond van enige wet over deze suppletie
      verschuldigde premies die niet op deze suppletie in mindering kunnen worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel29
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 43.1.f
    text: |-
      loonsuppletie, bedoeld in [artikel 32][ref1], alsmede de op grond van enige wet over deze suppletie verschuldigde
      premies die niet op deze suppletie in mindering kunnen worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel32
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 43.1.g
    text: |-
      uitkeringen, bedoeld in [artikel 29b van de ZW][ref1], alsmede de op grond van enige wet over deze uitkeringen
      verschuldigde premies die niet op deze uitkeringen in mindering kunnen worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29b
  - number: 43.1.h
    text: |-
      gelden, bedoeld in [artikel 40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel40
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '40'
        hoofdstuk: '5'
  - number: '43.2'
    text: |-
      Vergoedingen aan gemeenten die worden overeengekomen ter uitvoering van [artikel 14, eerste lid][ref1], komen
      tevens ten laste van het Reïntegratiefonds.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel14
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '43.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel43
  - number: '44.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt ten laste van het Reïntegratiefonds per kalenderjaar
      aan door Onze Minister aan te wijzen scholingsinstituten die ten doel hebben de arbeidsintegratie van
      arbeidsgehandicapten te bevorderen, een subsidie ter hoogte van een bij ministeriële regeling te bepalen bedrag.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel44
  - number: '44.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan in het belang van deze wet ten laste van het Reïntegratiefonds
      subsidie verstrekken aan andere instellingen of organisaties, dan de scholingsinstituten, bedoeld in het eerste
      lid, die ten doel hebben het nemen of bevorderen van maatregelen, die strekken tot behoud, herstel of bevordering
      van de mogelijkheid tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel44
  - number: '44.3'
    text: |-
      Het Uitvoeringsorgaan werknemersverzekeringen kan bij de subsidieverlening, bedoeld in het eerste of het
      tweede lid, aan de subsidie-ontvanger verplichtingen opleggen omtrent vermogensvorming, het hanteren van een
      registratiesysteem waaruit blijkt of het doel van de subsidie is bereikt en de vergoeding van met subsidie behaald
      vermogensvoordeel.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel44
  - number: 44a
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, zo dikwijls hij zulks nodig oordeelt personen oproepen ten
      aanzien van wie of ten behoeve van wie instrumenten als bedoeld in [hoofdstuk 3][ref1] of [4][ref2] zijn toegekend
      of waarvan toekenning wordt overwogen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009565
        hoofdstuk: '4'
  - number: '45'
    text: |-
      De persoon, of diens wettelijk vertegenwoordiger, aan wie een reïntegratie-instrument als bedoeld in
      [hoofdstuk 3][ref1] of [hoofdstuk 4][ref2] is verstrekt of toegekend, of aan wie verstrekking of toekenning
      daarvan wordt overwogen, is verplicht het Uitvoeringsinstituut werknemersverzekeringen op zijn verzoek of uit eigen
      beweging alle feiten en omstandigheden mede te delen, waarvan hem redelijkerwijs duidelijk moet zijn dat zij van
      invloed kunnen zijn op de verstrekking of toekenning of op de duur of de hoogte van het reïntegratie-instrument.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0009565
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009565
        hoofdstuk: '4'
  - number: '46.1'
    text: |-
      Aan de persoon die de verplichting, bedoeld in [artikel 45][ref1] niet of niet behoorlijk is nagekomen, wordt door
      het Uitvoeringsinstituut werknemersverzekeringen een boete opgelegd van ten hoogste € 2 269.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel45
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '45'
        hoofdstuk: '6'
  - number: '46.2'
    text: |-
      De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de belanghebbende de gedraging
      verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een boete wordt in elk geval
      afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel46
  - number: '46.3'
    text: |-
      Indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 45][ref1], niet heeft geleid
      tot het ten onrechte of tot een te hoog bedrag toekennen of verstrekken van een reïntegratie-instrument, kan het
      Uitvoeringsinstituut werknemersverzekeringen afzien van het opleggen van een boete en volstaan met het geven van
      een schriftelijke waarschuwing ter zake van het niet of niet behoorlijk nakomen van de verplichting, tenzij het
      niet of niet behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf
      de datum waarop eerder aan de belanghebbende een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel45
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '45'
        hoofdstuk: '6'
  - number: '46.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van
      het opleggen van een boete af te zien.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel46
  - number: '46.5'
    text: |-
      De persoon aan wie een boete is opgelegd is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel46
  - number: '46.6'
    text: Voorzover de boete nog niet is geïnd vervalt zij door het overlijden van de persoon aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel46
  - number: '46.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel46
  - number: '47'
    text: |-
      De [artikelen 29b tot en met 29g van de WAO][ref1] zijn bij de toepassing van [artikel 46][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel46
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29b
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '46'
        hoofdstuk: '6'
  - number: '48'
    text: |-
      Bij de vaststelling van de schadevergoeding, waarop de arbeidsgehandicapte, bedoeld in [artikel 10][ref1], naar
      burgerlijk recht aanspraak kan maken terzake van zijn arbeidshandicap houdt de rechter rekening met de aanspraken
      die de arbeidsgehandicapte op grond van deze wet heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '49.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft voor de op grond van deze wet gemaakte kosten verhaal op
      de persoon, die in verband met het veroorzaken van de arbeidshandicap, jegens de arbeidsgehandicapte, bedoeld
      in [artikel 10][ref1], naar burgerlijk recht tot schadevergoeding verplicht is, doch ten hoogste tot het bedrag,
      waarover deze bij het ontbreken van de aanspraken op grond van deze wet naar burgerlijk recht verplicht zou zijn,
      verminderd met een bedrag gelijk aan dat van de schadevergoeding tot betaling waarvan de aansprakelijke persoon
      jegens de arbeidsgehandicapte naar burgerlijk recht gehouden is.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '49.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan indien een aanspraak als bedoeld in het eerste lid, wordt
      toegekend in de vorm van periodieke verstrekkingen, de contante waarde daarvan vorderen in de vorm van een
      jaarlijks vast te stellen afkoopsom die aan het Uitvoeringsinstituut werknemersverzekeringen wordt vergoed voor de
      totale schadelast ten gevolge van het veroorzaken van de arbeidshandicap.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel49
  - number: '49.3'
    text: |-
      Het eerste lid geldt ten aanzien van de naar burgerlijk recht tot schadevergoeding verplichte werkgever van
      een arbeidsgehandicapte, bedoeld in [artikel 10][ref1], onderscheidenlijk ten aanzien van de naar burgerlijk
      recht tot schadevergoeding verplichte werknemer, die in dienstbetrekking staat tot dezelfde werkgever als de
      arbeidsgehandicapte jegens wie naar burgerlijk recht verplichting tot schadevergoeding bestaat, slechts indien de
      arbeidshandicap is te wijten aan opzet of bewuste roekeloosheid van die werkgever onderscheidenlijk werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '49.4'
    text: |-
      Voor de toepassing van het derde lid wordt mede als werkgever beschouwd de persoon, die op grond van
      [artikel 16a van de Coördinatiewet Sociale Verzekering][ref1] mede als werkgever wordt beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel16a
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: 16a
  - number: 49a.1
    text: |-
      Onverminderd [artikel 49b][ref1], worden beschikkingen op grond van deze wet en de daarop berustende bepalingen
      gegeven binnen een redelijke termijn na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel49b
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 49b
        hoofdstuk: '7'
  - number: 49a.2
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel49a
  - number: 49a.3
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel49a
  - number: 49a.4
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen acht weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel49a
  - number: 49b.1
    text: |-
      Een beschikking op grond van [artikel 24][ref1] wordt gegeven:


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel24
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 49b.1.a
    text: |-
      indien de aanvraag betrekking heeft op het verkrijgen van een reïntegratie-uitkering die verband houdt met een
      proefplaatsing: binnen twee weken na ontvangst van de aanvraag;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel49b
  - number: 49b.1.b
    text: |-
      indien de aanvraag betrekking heeft op het verkrijgen van een reïntegratie-uitkering die verband houdt met
      scholing: binnen vier weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel49b
  - number: 49b.2
    text: |-
      Indien een beschikking als bedoeld in het eerste lid niet binnen de toepasselijke termijn kan worden gegeven, wordt
      dit schriftelijk aan de aanvrager medegedeeld onder vermelding van een zo kort mogelijke termijn waarbinnen de
      beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel49b
  - number: 49b.3
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen de toepasselijke termijn gegeven
      kan worden, wordt deze termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging
      schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel49b
  - number: '50.1'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '50.2'
    text: |-
      Indien bezwaar wordt gemaakt tegen een besluit waaraan een medische of arbeidskundige beoordeling
      ten grondslag ligt, beslist het Uitvoeringsinstituut werknemersverzekeringen, in afwijking van
      [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1], binnen zeventien weken, of indien het advies
      vraagt aan een deskundige die niet onder zijn verantwoordelijkheid werkzaam is, binnen eenentwintig weken, na
      ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '51'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de behandeling van bezwaarschriften
      tegen besluiten waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel51
  - number: '52'
    text: |-
      Ten aanzien van besluiten waaraan een medische beoordeling ten grondslag ligt zijn de
      [artikelen 88 tot en met 88i van de WAO][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel88
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '88'
  - number: '53'
    text: |-
      [Titel 4.2. van de Algemene wet bestuursrecht][ref1] is niet van toepassing op aanspraken op grond van
      [artikel 22][ref2], [22a][ref3] en [31][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel22a
      [ref4]: https://wetten.overheid.nl/BWBR0009565#Artikel31
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: 22a
        hoofdstuk: '4'
        paragraaf: 1a
      - id: ref4
        bwb_id: BWBR0009565
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '57'
    text: |-
      Overtreding van bepalingen van een krachtens deze wet uitgevaardigde algemene maatregel van bestuur voorzover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met een hechtenis van ten
      hoogste een maand of een geldboete van de tweede categorie. De in de eerste zin bedoelde strafbare feiten zijn
      overtredingen.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel57
  - number: '59'
    text: |-
      Het recht tot strafvordering vervalt indien het Uitvoeringsinstituut werknemersverzekeringen aan de belanghebbende
      terzake van hetzelfde feit reeds een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel59
  - number: '75.1'
    text: |-
      Artikel 57 van de AAW en de daarop berustende bepalingen, zoals deze luidden op de dag voorafgaand aan de
      inwerkingtreding van deze wet, blijven van toepassing op de persoon die vóór die datum een aanvraag heeft
      ingediend of in aanmerking is gebracht voor een voorziening tot behoud, herstel of ter bevordering van de
      arbeidsgeschiktheid, zolang die voorziening wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel75
  - number: '75.2'
    text: |-
      Artikel 57a van de AAW en de daarop berustende bepalingen, zoals deze luidden op de dag voorafgaand aan de
      inwerkingtreding van deze wet, blijven van toepassing op de persoon die vóór die datum een aanvraag heeft ingediend
      of in aanmerking is gebracht voor vergoeding van kosten als bedoeld in dat artikel, zolang deze vergoeding niet
      daadwerkelijk geheel is verleend.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel75
  - number: '75.3'
    text: |-
      Artikel 58 van de AAW, zoals dit artikel luidde op de dag voorafgaand aan de inwerkingtreding van deze wet blijft
      van toepassing op de persoon die vóór die datum een aanvraag heeft ingediend of in aanmerking is gebracht voor een
      toelage of vergoeding, zolang die toelage of vergoeding wordt verleend.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel75
  - number: '75.4'
    text: |-
      Artikel 59b van de AAW en de daarop berustende bepalingen, zoals deze luidden op de dag voorafgaand aan de
      inwerkingtreding van deze wet, blijven van toepassing op de persoon die vóór die datum een aanvraag heeft ingediend
      of in aanmerking is gebracht voor inkomenssuppletie.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel75
  - number: '75.5'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de toepasselijkheid van de
      [Algemene Arbeidsongeschiktheidswet][ref1], bedoeld in het eerste lid:


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 75.5.a
    text: |-
      met betrekking tot voorzieningen op grond van [artikel 57, eerste en tweede lid, onderdeel b, van die wet][ref1],
      met ingang van een bij die regeling te bepalen datum eindigt;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel57
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '57'
        hoofdstuk: '9'
  - number: 75.5.b
    text: |-
      met betrekking tot voorzieningen op grond van [artikel 57, tweede lid, onderdeel c][ref1], toegekend aan personen
      die buiten het Rijk verblijven, wordt voortgezet, indien voor de voortzetting van deze voorziening een nieuw
      besluit van het Uitvoeringsinstituut werknemersverzekeringen noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel57
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '57'
        hoofdstuk: '9'
  - number: '75.6'
    text: |-
      De bruikleenovereenkomst of de overeenkomst met betrekking tot het in gebruik geven van een blindengeleidehond
      tussen het Uitvoeringsinstituut werknemersverzekeringen en een persoon aan wie een voorziening is toegekend
      op grond van artikel 57 van de AAW, zoals dat luidde voor de inwerkingtreding van deze wet, betreffende de
      verstrekking van een blindengeleidehond, wordt met ingang van de datum die is bepaald op grond van het vijfde lid,
      onderdeel a, of indien de overeenkomst op een latere datum is aangegaan, met ingang van die datum, aangemerkt als
      een bruikleenovereenkomst of een overeenkomst met betrekking tot het in gebruik geven van een blindengeleidehond
      tussen de Ziekenfondsraad en genoemde persoon.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel75
  - number: '75.7'
    text: |-
      De overeenkomst tot levering of de overeenkomst met betrekking tot het in gebruik geven van een blindengeleidehond
      tussen een persoon of rechtspersoon die blindengeleidehonden opleidt en het Uitvoeringsinstituut
      werknemersverzekeringen, dat genoemde overeenkomst aangaat of is aangegaan met als doel deze hond te verstrekken
      aan een persoon aan wie deze voorziening is toegekend op grond van artikel 57 van de AAW, zoals dat luidde voor de
      inwerkingtreding van deze wet, wordt met ingang van de datum die is bepaald op grond van het vijfde lid, onderdeel
      a, of indien de overeenkomst op een latere datum is aangegaan, met ingang van die datum, aangemerkt als een
      overeenkomst tot levering of een overeenkomst met betrekking tot het in gebruik geven van een blindengeleidehond
      tussen de persoon of rechtspersoon die blindengeleidehonden opleidt en de Ziekenfondsraad.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel75
  - number: '75.8'
    text: |-
      De blindengeleidehond die op of na de op grond van het vijfde lid, onderdeel a, vastgestelde datum tot het
      eigendom van het Uitvoeringsinstituut werknemersverzekeringen behoort, wordt met ingang van de datum waarop het
      Uitvoeringsinstituut werknemersverzekeringen eigendom heeft verkregen, doch niet eerder dan met ingang van de op
      grond van het vijfde lid, onderdeel a, vastgestelde datum, eigendom van de Ziekenfondsraad.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel75
  - number: '76.1'
    text: |-
      [Artikel 60 van de WAO][ref1] en de daarop berustende bepalingen, zoals deze luidden op de dag voorafgaand aan
      de inwerkingtreding van deze wet, blijven van toepassing op de persoon aan wie vóór die datum loonsuppletie is
      toegekend, zolang die suppletie duurt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel60
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '60'
  - number: '76.2'
    text: |-
      [Artikel 62 van de WAO][ref1] en de daarop berustende bepalingen, zoals deze luidden op de dag voorafgaand aan de
      inwerkingtreding van deze wet, blijven van toepassing op de werkgever aan wie vóór die datum een loonkostensubsidie
      is toegekend, zolang die subsidie duurt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel62
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '62'
  - number: '76.3'
    text: |-
      [Artikel 63 van de WAO][ref1] en de daarop berustende bepalingen, zoals deze luidden op de dag voorafgaand aan
      de inwerkingtreding van deze wet, blijven van toepassing op de persoon aan wie vóór die datum een reïntegratie-
      uitkering is toegekend, zolang de in het vijfde lid van dat artikel bedoelde periode van ten hoogste drie maanden
      niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '76.4'
    text: |-
      [Artikel 64 van de WAO][ref1], zoals dit artikel luidde op de dag voorafgaand aan de inwerkingtreding van deze
      wet, blijft van toepassing op de financiering van de kosten van opleiding of scholing die vóór die datum door
      het Uitvoeringsinstituut werknemersverzekeringen werden gefinancierd, zolang die financiering niet geheel heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel64
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '64'
  - number: 76a
    text: |-
      Voor de toepassing van [artikel 2, tweede lid][ref1], wordt onder de persoon, bedoeld in het eerste lid, onderdeel
      a, van dat artikel tevens verstaan de persoon die recht heeft op een arbeidsongeschiktheidsuitkering op grond
      van de AAW, op een met overeenkomstige toepassing van de [WAO][ref2] toegekende arbeidsongeschiktheidsuitkering,
      bedoeld in [artikel 32, eerste lid, van de Wet privatisering ABP][ref3], op een pensioen ter zake van
      arbeidsongeschiktheid als bedoeld in [artikel E6, eerste lid, van de Algemene militaire pensioenwet](onbekend)
      zoals dat artikel luidde op de dag voorafgaande aan de intrekking daarvan, op een pensioen ter zake van
      arbeidsongeschiktheid op grond van de [Kaderwet militaire pensioenen][ref4] en de daarop berustende bepalingen
      of op een uitkering die naar aard en strekking met een van de genoemde uitkeringen overeenkomt en wordt onder de
      arbeidsongeschiktheidsuitkering, bedoeld in onderdeel a, tevens verstaan een uitkering als hiervoor bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '32'
      - id: ref4
        bwb_id: BWBR0011955
  - number: '78.1'
    text: |-
      Toekenning van voorzieningen als bedoeld in [artikel 22][ref1] en [31][ref2], van financiering van, of
      tegemoetkoming in de kosten van, kinderopvang als bedoeld in [artikel 22a][ref3] en van toelagen als
      bedoeld in [artikel 28][ref4] vindt uitsluitend plaats voorzover ten aanzien van de arbeidsgehandicapte
      [artikel 75, eerste of derde lid][ref5], geen toepassing vindt, of ten aanzien van de werkgever van de
      arbeidsgehandicapte werknemer [artikel 75, tweede lid][ref6], geen toepassing vindt. De eerste zin is van
      overeenkomstige toepassing op de verstrekking van een subsidie in de vorm van een persoonsgebonden budget als
      bedoeld in [artikel 33][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel22a
      [ref4]: https://wetten.overheid.nl/BWBR0009565#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0009565#Artikel75
      [ref6]: https://wetten.overheid.nl/BWBR0009565#Artikel75
      [ref7]: https://wetten.overheid.nl/BWBR0009565#Artikel33
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel78
    references:
