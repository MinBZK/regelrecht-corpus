        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '36.2'
    text: Volmacht tot ontvangst van een uitkering onder welke vorm of benaming ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel36
  - number: '36.3'
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel36
  - number: '37'
    text: 'Niet vatbaar voor beslag zijn:'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel37
  - number: 37.a
