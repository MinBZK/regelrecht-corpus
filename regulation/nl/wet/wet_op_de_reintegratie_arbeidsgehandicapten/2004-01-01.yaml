  - number: '35.2'
    text: |-
      Subsidies als bedoeld in [artikel 30][ref1], [33][ref2] of [33a][ref3] die onverschuldigd zijn betaald, worden door
      het Uitvoeringsinstituut werknemersverzekeringen teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: 33a
        hoofdstuk: '4'
        paragraaf: '5'
  - number: '35.3'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35
  - number: '35.4'
    text: |-
      Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd en de termijn of de termijnen waarbinnen moet
      worden betaald, alsmede dat het besluit bij gebreke van tijdige betaling zal worden tenuitvoergelegd op de wijze
      als omschreven in het zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35
  - number: '35.5'
    text: |-
      De persoon van wie wordt teruggevorderd is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35
  - number: '35.6'
    text: |-
      Het besluit tot terugvordering levert een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van
      Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35
  - number: '35.7'
    text: |-
      [Artikel 29g van de WAO][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld
      inkomen van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref2] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, het Uitvoeringsinstituut
      werknemersverzekeringen de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel29g
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 29g
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '35.8'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de terugvordering en de tenuitvoerlegging van
      besluiten tot terugvordering als bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35
  - number: '35.9'
    text: |-
      In afwijking van het eerste en tweede lid, kan het Uitvoeringsinstituut werknemersverzekeringen, onder voorwaarden
      die Onze Minister kan stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door
      Onze Minister vast te stellen bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35
  - number: 35a.1
    text: |-
      In afwijking van [artikel 35][ref1] kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van
      terugvordering af te zien, indien de persoon van wie wordt teruggevorderd:


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel35
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 35a.1.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35a
  - number: 35a.1.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35a
  - number: 35a.1.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35a
  - number: 35a.1.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35a
  - number: 35a.2
    text: 'De in het eerste lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35a
  - number: 35a.2.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de [artikelen 475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 35a.2.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 45][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel45
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '45'
        hoofdstuk: '6'
  - number: 35a.3
    text: Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel35a
  - number: '36.1'
    text: 'Onvervreemdbaar en niet vatbaar voor verpanding of belening zijn:'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel36
  - number: 36.1.a
    text: |-
      de voorzieningen, bedoeld in [artikel 22][ref1] en [31][ref2] en de financiering van, of tegemoetkoming in de
      kosten van, kinderopvang, bedoeld in [artikel 22a][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel22a
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel36
    references:
