        paragraaf: '3'
  - number: '39'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de aanvraag van de instrumenten, bedoeld
      in [hoofdstuk 3][ref1] en [4 van deze wet][ref2], en de termijn waarbinnen die aanvraag wordt ingediend alsmede
      omtrent de rechtsgevolgen die aan overschrijding van die termijn zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009565
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009565
        hoofdstuk: '4'
  - number: '41'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de middelen tot
      dekking van de uitgaven in de vorm van een Reïntegratiefonds dat deel uitmaakt van het Uitvoeringsinstituut
      werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel41
  - number: '42.1'
    text: 'De middelen tot dekking van de uitgaven ten laste van het Reïntegratiefonds worden verkregen uit:'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel42
  - number: 42.1.a
    text: |-
      bijdragen uit het Arbeidsongeschiktheidsfonds, het Arbeidsongeschiktheidsfonds zelfstandigen, het
      Arbeidsongeschiktheidsfonds jonggehandicapten, het Algemeen Werkloosheidsfonds en het Uitvoeringsfonds voor de
      overheid;
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel42
  - number: 42.1.b
    text: |-
      de gelden die het Uitvoeringsinstituut werknemersverzekeringen ontvangt door toepassing van [artikel 21][ref1],
      [35][ref2] en [46][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel46
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '46'
        hoofdstuk: '6'
  - number: '42.2'
    text: |-
      Bij ministeriële regeling worden de bijdragen, bedoeld in het eerste lid, onderdeel a, en de onderlinge verhouding
      tussen de ten laste van de verschillende fondsen komende bijdragen, bedoeld in dat onderdeel, vastgesteld. Bij
      deze regeling kan worden bepaald dat in de middelen tot dekking van de uitgaven ten laste van het Reïntegratiefonds
      mede wordt voorzien door het Rijk en kunnen nadere regels worden gesteld in verband met de besteding van die
      Rijksbijdrage.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel42
  - number: '43.1'
    text: |-
      Ten laste van het Reïntegratiefonds komen de kosten verband houdende met de uitvoering van [artikel 10][ref1] en
      [11][ref2] en de door het Uitvoeringsinstituut werknemersverzekeringen verstrekte of toegekende:


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel11
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 43.1.a
    text: |-
      subsidies, bedoeld in de [artikelen 16][ref1], [30][ref2], [33][ref3] en [33a][ref4] of overeenkomsten bedoeld in
      [artikel 33][ref5] dan wel [33a, eerste lid, onderdeel b][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
      [ref5]: https://wetten.overheid.nl/BWBR0009565#Artikel33
      [ref6]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
