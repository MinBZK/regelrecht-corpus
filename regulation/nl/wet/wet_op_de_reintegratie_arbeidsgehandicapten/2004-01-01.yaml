  - number: 87d.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag aan de werkgever, bedoeld in [artikel 8][ref1],
      ten aanzien van de werknemer, wiens eerste dag van ongeschiktheid tot het verrichten van arbeid wegens ziekte is
      gelegen voor 1 januari 2004, met toepassing van [artikel 16][ref2], zoals dit artikel luidde op 31 december 2003,
      subsidie verstrekken voor het totaal van de kosten ten behoeve van die werknemer en verband houdende met kosten
      die voortvloeien uit scholing, training en begeleiding van die werknemer, indien de aanvraag is ingediend voor 1
      april 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel16
