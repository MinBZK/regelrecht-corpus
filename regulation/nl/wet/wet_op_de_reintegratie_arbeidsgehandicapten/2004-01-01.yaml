      de inkomenssuppletie, bedoeld in [artikel 29][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel29
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel36
    references:
      - id: ref1
