  - number: '78.2'
    text: |-
      Toekenning van een reïntegratie-uitkering als bedoeld in [artikel 23, eerste lid][ref1], vindt uitsluitend plaats
      indien de werkzaamheden op een proefplaats of de scholing of opleiding zijn aangevangen op of na de dag waarop deze
      wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel23
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '78.3'
    text: |-
      Toekenning van inkomenssuppletie als bedoeld in [artikel 29][ref1] vindt uitsluitend plaats aan een persoon die op
      of na de dag van inwerkingtreding van deze wet arbeidsgehandicapte is geworden in de zin van [artikel 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '2'
        hoofdstuk: '1'
  - number: '78.4'
    text: |-
      Toekenning van loonsuppletie als bedoeld in [artikel 32][ref1] vindt uitsluitend plaats terzake van een
      dienstbetrekking die is aangevangen op of na de dag waarop deze wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel32
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '79.1'
    text: 'Na inwerkingtreding van deze wet komen ten laste van het Reïntegratiefonds:'
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel79
  - number: 79.1.a
    text: |-
      de op grond van artikel 57, 57a, 58 en 59b van de AAW toegekende voorzieningen, vergoedingen, toelagen en
      inkomenssuppleties, bedoeld in [artikel 75][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel75
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '75'
        hoofdstuk: '11'
  - number: 79.1.b
    text: |-
      de op grond van [artikel 60][ref1], [62][ref2], [63][ref3] en [64 van de WAO][ref4] toegekende loonsuppleties,
      loonkostensubsidies, reïntegratie-uitkeringen en kosten van scholing of opleiding, bedoeld in [artikel 76][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel64
      [ref5]: https://wetten.overheid.nl/BWBR0009565#Artikel76
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '62'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '63'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '64'
      - id: ref5
        bwb_id: BWBR0009565
        artikel: '76'
        hoofdstuk: '11'
  - number: '79.2'
    text: |-
      De middelen tot dekking van de uitgaven ten laste van het Reïntegratiefonds, bedoeld in het eerste lid, onderdeel
      a, worden verkregen uit een bijdrage uit het Algemeen Arbeidsongeschiktheidsfonds.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel79
  - number: '79.3'
    text: |-
      De middelen tot dekking van de uitgaven ten laste van het Reïntegratiefonds, bedoeld in het eerste lid, onderdeel
      b, worden verkregen uit een bijdrage uit het Arbeidsongeschiktheidsfonds.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel79
  - number: '80'
    text: |-
      [Artikel 49][ref1] is uitsluitend van toepassing indien de arbeidshandicap, bedoeld in
      [artikel 49, eerste lid][ref2], veroorzaakt is op of na de datum van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel49
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '49'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '49'
        hoofdstuk: '7'
  - number: '81.1'
    text: |-
      [Artikel 29b van de ZW][ref1], zoals dit artikel luidde op de dag voorafgaand aan de inwerkingtreding van deze wet,
      blijft van toepassing op de persoon die geen arbeidsgehandicapte is als bedoeld in [artikel 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29b
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '2'
        hoofdstuk: '1'
  - number: '81.2'
    text: |-
      In afwijking van het eerste lid blijft [artikel 29b van de ZW][ref1], zoals dat artikel luidde voorafgaand aan de
      inwerkingtreding van deze wet, niet van toepassing op de persoon, die werkzaam is in een dienstbetrekking in de zin
      van de [WSW][ref2], die is aangevangen voorafgaand aan de dag waarop deze wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29b
      - id: ref2
        bwb_id: BWBR0008903
  - number: '81.3'
    text: |-
      [Artikel 29b van de ZW][ref1] is niet van toepassing, indien de dienstbetrekking met de in het eerste lid van
      dat artikel bedoelde werknemer is aangevangen voorafgaand aan de dag waarop deze wet in werking treedt en op die
      werknemer [artikel 29b van de ZW][ref2], zoals dat artikel luidde voorafgaand aan de inwerkingtreding van deze wet,
      niet van toepassing was.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29b
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 29b
  - number: '83'
    text: |-
      Onder arbeidsongeschiktheidsuitkering als bedoeld in [artikel 75a, derde lid, van de WAO][ref1], wordt uitsluitend
      verstaan, een arbeidsongeschiktheidsuitkering toegekend aan een werknemer terzake van arbeidsongeschiktheid uit een
      dienstbetrekking die op of na 1 januari 1998 is aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 75a
  - number: '84'
    text: |-
      Onder arbeidsongeschiktheidsuitkering als bedoeld in [artikel 76f, zesde lid, onderdeel c, van de WAO](onbekend),
      wordt uitsluitend verstaan, een arbeidsongeschiktheidsuitkering toegekend aan een werknemer terzake van
      arbeidsongeschiktheid uit een dienstbetrekking die op of na 1 januari 1998 is aangegaan.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel84
  - number: '85.1'
    text: |-
      Beschikkingen op grond van [artikel 60][ref1], [62][ref2], [63][ref3] en [64 van de WAO][ref4] worden na
      inwerkingtreding van deze wet aangemerkt als beschikkingen op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel64
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '62'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '63'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '64'
  - number: '85.2'
    text: |-
      Beschikkingen op grond van artikel 57, 57a, 58 en 59b van de AAW worden na inwerkingtreding van deze wet aangemerkt
      als beschikkingen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel85
  - number: '86'
    text: |-
      Beschikkingen op grond van artikel 6 en 8 van de Wet arbeid gehandicapte werknemers, zoals deze wet luidde tot de
      datum van inwerkingtreding van deze wet, worden na de inwerkingtreding van deze wet aangemerkt als beschikkingen op
      grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel86
  - number: '87'
    text: |-
      [Titel 4.2. van de Algemene wet bestuursrecht][ref1] is niet van toepassing op aanspraken als bedoeld in dit
      hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 87a.1
    text: |-
      Op aanvragen van subsidie als bedoeld in [artikel 44, tweede lid][ref1], ontvangen voor de dag van inwerkingtreding
      van artikel IV van de Verzamelwet SZW-wetten 2001, blijft [artikel 49b, derde lid][ref2], zoals dat luidde op de
      dag voor de dag van inwerkingtreding van dat artikel IV, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel49b
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '44'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: 49b
        hoofdstuk: '7'
  - number: 87a.2
    text: |-
      Op aanvragen van voorzieningen als bedoeld in paragraaf 1 of [3 van hoofdstuk 4][ref1], ontvangen voor 1 januari
      2004, blijft [artikel 49b, derde lid][ref2], zoals dat luidde op 31 december 2003, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel49b
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: 49b
        hoofdstuk: '7'
  - number: 87b.1
    text: |-
      De [artikelen 15 tot en met 21a][ref1] en de daarop berustende bepalingen, met uitzondering
      van [artikel 16a][ref2], zoals deze luidden op het tijdstip van inwerkingtreding van
      [artikel 57 van de Invoeringswet Wet structuur uitvoeringsorganisatie werk en inkomen][ref3]
      doch vóór het tijdstip van inwerkingtreding van
      __REF003___________________________________________________________________________________________________________
      ___________________________________, blijven van toepassing op dienstbetrekkingen die zijn aangegaan tot en met 31
      december 2001 en ingeval een werknemer zijn eigen arbeid of een andere functie bij dezelfde werkgever heeft hervat
      vóór 1 januari 2002 dan wel nadat diens arbeidsplaats is aangepast tot behoud, herstel of ter bevordering van de
      arbeidsgeschiktheid van die werknemer voor de eigen arbeid voor die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel16a
      [ref3]: https://wetten.overheid.nl/BWBR0013061#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0013190#ArtikelI
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel87b
