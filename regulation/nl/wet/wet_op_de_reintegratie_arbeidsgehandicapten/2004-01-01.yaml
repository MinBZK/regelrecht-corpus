preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de integratie en reïntegratie van arbeidsgehandicapten
    een krachtige impuls te geven, daartoe bestaande wettelijke instrumenten uit te breiden en institutionele
    belemmeringen die aan de integratie en reïntegratie van arbeidsgehandicapten in de weg staan weg te nemen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#ArtikelAanhef
