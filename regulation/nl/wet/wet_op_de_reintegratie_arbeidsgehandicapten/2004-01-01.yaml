        paragraaf: 1a
  - number: 43.1.c
    text: |-
      reïntegratie-uitkeringen, bedoeld in [artikel 23][ref1], alsmede de op grond van enige wet over deze uitkeringen
      verschuldigde premies die niet op deze uitkeringen in mindering kunnen worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel23
    url: https://wetten.overheid.nl/BWBR0009565/2004-01-01#Artikel43
    references:
