preamble:
  text: |-
    Gelet op de artikelen 5, 9, eerste lid, 11, vijfde lid, 14, tweede lid, 24, derde lid, 26, tweede lid, 36, tweede
    lid, en 43, tweede lid, van het Bekostigingsbesluit cultuuruitingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            de minister:

              de Minister van Onderwijs, Cultuur en Wetenschap;



            b
            het Besluit:

              het [Bekostigingsbesluit cultuuruitingen][ref1];



            c
            uitkering:

              een uitkering als bedoeld in [artikel 18][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006759
      [ref2]: https://wetten.overheid.nl/BWBR0007155#Artikel18
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006759
      - id: ref2
        bwb_id: BWBR0007155
        artikel: '18'
        hoofdstuk: IV
  - number: '2'
    text: |-
      De minister kan van deze regeling afwijken, mits de beschikking waarbij een subsidie of een uitkering wordt
      verstrekt, de afwijking uitdrukkelijk vermeldt.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel2
  - number: '3'
    text: |-
      Aan een instelling kan tezelfdertijd zowel een jaarlijkse als een vierjaarlijkse instellingssubsidie worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel3
  - number: '4.1'
    text: |-
      De minister betaalt per kwartaal als voorschot een evenredig deel van de subsidie die aan een instelling is
      verleend.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel4
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid kan de Minister een groter of kleiner deel van de subsidie als voorschot betalen in
      door hem te bepalen termijnen.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel4
  - number: '5'
    text: |-
      Indien de minister voorschotten toekent voordat hij een beschikking tot een subsidieverlening heeft genomen, worden
      de voorschotten zo mogelijk gebaseerd op het bedrag dat in het voorgaande jaar als subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel5
  - number: '6'
    text: |-
      Het bestuursverslag, de jaarrekening, het financieel verslag en het activiteitenverslag, bedoeld in de
      [artikelen 24][ref1] en [33 tot en met 36 van het Besluit][ref2], van instellingen met een vierjaarlijkse
      instellingssubsidie, van aangewezen instellingen en van fondsen voldoen aan de eisen genoemd in:


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0006759#Artikel33
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0006759
        artikel: '33'
  - number: 6.a
    text: |-
      de [bijlage IA][ref1] bij deze regeling voor zover het betreft instellingen met een jaarlijkse of vierjaarlijkse
      instellingssubsidie en aangewezen instellingen; en


      [ref1]: https://wetten.overheid.nl/BWBR0007155
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007155
  - number: 6.b
    text: |-
      de [bijlage IB][ref1] bij deze regeling voor zover het betreft de fondsen.


      [ref1]: https://wetten.overheid.nl/BWBR0007155
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007155
  - number: '7.1'
    text: 'Indien de verleende subsidie minder dan € 125.000 per jaar bedraagt:'
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel7
  - number: 7.1.a
    text: kan in plaats van een jaarrekening een financieel verslag worden ingediend;
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel7
  - number: 7.1.b
    text: |-
      is [artikel 37, eerste en tweede lid, van het Besluit][ref1] niet van toepassing, tenzij in [bijlage IA][ref2] bij
      deze regeling anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0007155
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0007155
  - number: '7.2'
    text: |-
      De rapportage over de naleving van de subsidiebepalingen, bedoeld in [artikel 37 van het Besluit][ref1], geschiedt
      overeenkomstig de als [bijlagen IIA][ref2] en [IIB][ref3] bij deze regeling gevoegde controleprotocollen met
      gebruikmaking van de bij [die bijlagen][ref4] opgenomen accountantsverklaringen.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0007155
      [ref3]: https://wetten.overheid.nl/BWBR0007155
      [ref4]: https://wetten.overheid.nl/BWBR0007155
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0007155
      - id: ref3
        bwb_id: BWBR0007155
      - id: ref4
        bwb_id: BWBR0007155
  - number: '8'
    text: |-
      Bij het niet tijdig indienen van de jaar- of eindverantwoording, bedoeld in de [artikelen 24][ref1],
      onderscheidenlijk [33, van het Besluit][ref2], wordt de subsidie voor iedere maand dat de subsidieontvanger in
      verzuim is, verlaagd met 1% van het subsidiebedrag genoemd in het besluit tot verlening van subsidie, tot een
      maximum van € 10.000.00 per maand. Elke volgende maand dat de subsidieontvanger in verzuim blijft, wordt de
      subsidie met eenzelfde bedrag verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0006759#Artikel33
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0006759
        artikel: '33'
  - number: '9.1'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9
  - number: 9.1.a
    text: |-
      instelling: instelling als bedoeld in [artikel 1, onder b, van het Besluit][ref1], niet zijnde een aangewezen
      instelling of een fonds;


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel1
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '1'
  - number: 9.1.b
    text: 'regio:'
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9
  - number: 9.1.b.1°
    text: 'noorden: provincies Groningen, Friesland en Drenthe,'
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9
  - number: 9.1.b.2°
    text: 'oosten: provincies Overijssel en Gelderland,'
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9
  - number: 9.1.b.3°
    text: 'midden: provincies Flevoland en Utrecht, of'
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9
  - number: 9.1.b.4°
    text: 'zuiden: provincies Zeeland, Noord-Brabant en Limburg;'
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9
  - number: 9.1.c
    text: 'gemeente: gemeente Amsterdam, gemeente Den Haag of gemeente Rotterdam;'
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9
  - number: 9.1.d
    text: 'podium: voorziening in een gebouw bestemd voor de presentatie van podiumkunsten.'
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9
  - number: '9.2'
    text: |-
      Dit hoofdstuk is van toepassing op de verstrekking van vierjaarlijkse instellingssubsidie aan instellingen voor de
      uitvoering van hun activiteiten in de jaren 2009 tot en met 2012.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9
  - number: 9a
    text: |-
      Voor subsidieverlening op grond van dit hoofdstuk is voor de jaren 2009 tot en met 2012 jaarlijks een bedrag van €
      75 miljoen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9a
  - number: 9b.1
    text: |-
      De minister kan aan een instelling met als kernactiviteit het verzorgen van toneelrepertoire een vierjaarlijkse
      instellingssubsidie verstrekken, indien de instelling:
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9b
  - number: 9b.1.a
    text: |-
      de beschikking heeft over een podium of een podium bespeelt, dat minimaal 350 zitplaatsen heeft in de regio of de
      gemeente waar de instelling haar standplaats heeft;
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9b
  - number: 9b.1.b
    text: haar activiteiten verspreid over het jaar realiseert; en
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9b
  - number: 9b.1.c
    text: voor haar artistieke continuïteit niet afhankelijk is van één maker of een groep van makers van toneel.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9b
  - number: 9b.2
    text: |-
      Aan ten hoogste acht instellingen kan subsidie worden verstrekt, waarbij in iedere regio, uitgezonderd de regio
      zuiden, en in iedere gemeente steeds aan één instelling subsidie wordt verstrekt. In de regio zuiden kan aan ten
      hoogste twee instellingen subsidie worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9b
  - number: 9c.1
    text: |-
      De minister kan aan een instelling met als kernactiviteit het verzorgen van dansrepertoire een vierjaarlijkse
      instellingssubsidie verstrekken, indien de instelling:
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9c
  - number: 9c.1.a
    text: |-
      de beschikking heeft over een podium of een podium bespeelt, dat minimaal 350 zitplaatsen heeft in de regio of de
      gemeente waar de instelling haar standplaats heeft;
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9c
  - number: 9c.1.b
    text: haar activiteiten verspreid over het jaar realiseert; en
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9c
  - number: 9c.1.c
    text: voor haar artistieke continuïteit niet afhankelijk is van één maker of een groep van makers van dans.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9c
  - number: 9c.2
    text: |-
      Aan ten hoogste vijf instellingen kan subsidie worden verstrekt, met dien verstande dat in de regio’s noorden,
      oosten en zuiden en in de gemeenten Amsterdam en Rotterdam steeds aan één instelling subsidie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9c
  - number: 9d
    text: |-
      Indien geen van de subsidieaanvragen ingediend voor een regio of een gemeente op grond van de [artikelen 9b][ref1]
      en [9c][ref2] voldoet aan alle in deze artikelen bedoelde vereisten, kan de minister niettemin aan ten hoogste één
      instelling subsidie verstrekken in die regio of gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0007155#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0007155#Artikel9c
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0007155
        artikel: 9b
        hoofdstuk: IIA
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007155
        artikel: 9c
        hoofdstuk: IIA
        paragraaf: '3'
  - number: 9e.1
    text: |-
      De minister kan aan een instelling met als kernactiviteit het verzorgen van operarepertoire een vierjaarlijkse
      instellingssubsidie verstrekken, indien de instelling:
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9e
  - number: 9e.1.a
    text: haar standplaats heeft in de regio zuiden; en
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9e
  - number: 9e.1.b
    text: haar activiteiten verspreid over het jaar realiseert.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9e
  - number: 9e.2
    text: Er wordt aan ten hoogste één instelling subsidie verstrekt.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9e
  - number: 9f
    text: |-
      De minister kan aan een instelling met als kernactiviteit het verzorgen van repertoire op het terrein van de
      podiumkunsten voor de jeugd tot 18 jaar een vierjaarlijkse instellingssubsidie verstrekken, indien de instelling:
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9f
  - number: 9f.a
    text: een substantieel deel van haar voorstellingen realiseert op een podium; en
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9f
  - number: 9f.b
    text: haar activiteiten verspreid over het jaar realiseert.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9f
  - number: 9g.1
    text: |-
      De minister kan aan een instelling met als kernactiviteit het verzorgen van Friestalig toneelrepertoire voor alle
      leeftijden een vierjaarlijkse instellingssubsidie verstrekken, indien de instelling:
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9g
  - number: 9g.1.a
    text: haar standplaats heeft in de regio noorden; en
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9g
  - number: 9g.1.b
    text: haar activiteiten verspreid over het jaar realiseert.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9g
  - number: 9g.2
    text: Er wordt aan ten hoogste één instelling subsidie verstrekt.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9g
  - number: 9h.1
    text: |-
      De minister kan aan een instelling met als kernactiviteit de presentatie van actueel of vernieuwend aanbod in een
      internationale context op het terrein van een of meer van de scheppende of uitvoerende kunsten een vierjaarlijkse
      instellingssubsidie verstrekken, indien de activiteiten van de instelling:
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9h
  - number: 9h.1.a
    text: er mede op gericht zijn een platform te bieden voor internationale uitwisseling tussen vakgenoten;
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9h
  - number: 9h.1.b
    text: jaarlijks of tweejaarlijks gedurende een in de tijd beperkte periode plaatsvinden; en
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9h
  - number: 9h.1.c
    text: |-
      niet zijn aan te merken als activiteiten van één specifieke schouwburg, concertzaal of andere instantie die zich
      primair richt op de presentatie van cultuuruitingen.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9h
  - number: 9h.2
    text: |-
      Op elk terrein van de scheppende of uitvoerende kunsten of op elk duidelijk te onderscheiden onderdeel daarvan
      wordt ten hoogste aan één instelling subsidie verstrekt.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9h
  - number: 9i
    text: |-
      De minister kan aan een instelling met als kernactiviteit de ontwikkeling en presentatie door beginnende
      of freelance makers van vernieuwende of experimentele activiteiten op het terrein van de podiumkunsten, een
      vierjaarlijkse instellingssubsidie verstrekken, indien de instelling:
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9i
  - number: 9i.a
    text: beschikt over voorzieningen die geschikt zijn om beginnende makers van podiumkunsten te begeleiden;
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9i
  - number: 9i.b
    text: de presentatie van de te verrichten activiteiten op een podium kan garanderen;
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9i
  - number: 9i.c
    text: haar activiteiten verspreid over het jaar realiseert; en
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9i
  - number: 9i.d
    text: voor haar artistieke continuïteit niet afhankelijk is van één of enkele artistiek leiders.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9i
  - number: 9j
    text: |-
      De minister kan aan een instelling met als kernactiviteit de presentatie van een vernieuwend of experimenteel
      aanbod van hedendaagse beeldende kunst in een internationale context een vierjaarlijkse instellingssubsidie
      verstrekken, indien de instelling:
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9j
  - number: 9j.a
    text: beschikt over een ruimte die geschikt is voor het tonen van de presentaties;
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9j
  - number: 9j.b
    text: haar activiteiten verspreid over het jaar realiseert;
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9j
  - number: 9j.c
    text: voor haar artistieke continuïteit niet afhankelijk is van één of enkele artistiek leiders; en
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9j
  - number: 9j.d
    text: niet overwegend gericht is op het beheer en behoud van een collectie van cultureel erfgoed.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9j
  - number: 9k
    text: |-
      De minister kan aan een instelling met als kernactiviteit het verzorgen van een programma op het terrein van de
      podiumkunsten, architectuur, beeldende kunst, vormgeving, nieuwe media of film, dat een vervolg is op een bachelor-
      of masteropleiding op het gebied van de kunst, een vierjaarlijkse instellingssubsidie verstrekken, indien de
      instelling beschikt over voorzieningen die geschikt zijn om de deelnemers aan het programma te begeleiden.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9k
  - number: 9l
    text: |-
      De minister kan aan een instelling op het terrein van de amateurkunst of cultuureducatie, de architectuur, het
      erfgoed, de film, de letteren, media en bibliotheken, de nieuwe media of vormgeving, dan wel op het intercultureel
      terrein, met als kernactiviteit de ontwikkeling of vernieuwing van het betreffende terrein door de begeleiding
      of de presentatie van talent, de facilitering van experimenten, het uitvoeren van onderzoek of het anderszins
      bijdragen aan verdieping op het betreffende terrein, een vierjaarlijkse instellingssubsidie verstrekken, voor zover
      de instelling niet overwegend gericht is op het beheer en behoud van een collectie van cultureel erfgoed.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9l
  - number: 9m.1
    text: |-
      De minister kan aan een instelling met als kernactiviteit het uitvoeren van één of meer ondersteunende taken op een
      terrein van het cultuurbestel, een vierjaarlijkse instellingssubsidie verstrekken, voor zover de instelling:
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9m
  - number: 9m.1.a
    text: |-
      niet als doel heeft de belangen te behartigen van ondernemers die behoren tot eenzelfde bedrijfstak of een
      onderdeel daarvan; en
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9m
  - number: 9m.1.b
    text: zich niet beweegt op een terrein waarop al een sectorinstituut werkzaam is.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9m
  - number: 9m.2
    text: 'Ondersteunende taken als bedoeld in het eerste lid zijn:'
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9m
  - number: 9m.2.a
    text: |-
      nationale of internationale vertegenwoordiging en promotie van het betreffende terrein van scheppende of
      uitvoerende kunsten;
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9m
  - number: 9m.2.b
    text: |-
      verzorging van educatie, informatie en reflectie over ontwikkelingen op het betreffende terrein door middel van
      exposities, lezingen, studiedagen en publicaties;
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9m
  - number: 9m.2.c
    text: inventariseren, waarderen en ontsluiten van erfgoed;
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9m
  - number: 9m.2.d
    text: |-
      verzorging van documentatie en archivering van relevant materiaal op het betreffende terrein door middel van een
      archief, een bibliotheek of een video- en mediatheek;
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9m
  - number: 9m.2.e
    text: afstemming en coördinatie tussen relevante partijen op het betreffende terrein.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9m
  - number: 9m.3
    text: |-
      Een sectorinstituut als bedoeld in het eerste lid, onder b, is een aangewezen instelling waar alle ondersteunende
      taken als bedoeld in het tweede lid, voor zover deze op het betreffende terrein van scheppende of uitvoerende
      kunsten voorkomen, worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9m
  - number: 9n
    text: |-
      De minister kan aan een instelling met als kernactiviteit het verrichten van coördinerende activiteiten inzake één
      of meer ondersteunende taken als bedoeld in [artikel 9m, tweede lid][ref1], op het terrein van de cultuureducatie
      dan wel op het interculturele of het internationale terrein een vierjaarlijkse instellingssubsidie verstrekken,
      voor zover de instelling niet als doel heeft de belangen te behartigen van ondernemers die behoren tot eenzelfde
      bedrijfstak of een onderdeel daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0007155#Artikel9m
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9n
    references:
      - id: ref1
        bwb_id: BWBR0007155
        artikel: 9m
        hoofdstuk: IIA
        paragraaf: '6'
  - number: 9o.1
    text: |-
      Een subsidieaanvraag voor een vierjaarlijkse instellingssubsidie voldoet aan de eisen die zijn opgenomen in de bij
      deze regeling behorende [bijlage IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007155
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9o
    references:
      - id: ref1
        bwb_id: BWBR0007155
  - number: 9o.2
    text: |-
      Een subsidieaanvraag voor een vierjaarlijkse instellingssubsidie wordt bij voorkeur elektronisch ingediend. De
      indiening geschiedt via de website www.cultuursubsidie.nl.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9o
  - number: 9o.3
    text: |-
      Als tijdstip van ontvangst van een elektronisch ingediende subsidieaanvraag geldt het tijdstip waarop het
      aanvraagformulier aan de hand waarvan die subsidieaanvraag wordt ingediend, elektronisch is ontvangen. In
      aansluiting op de elektronische verzending van het aanvraagformulier wordt een ondertekende afdruk van de laatste
      pagina van het formulier per post toegezonden aan de minister.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9o
  - number: 9o.4
    text: |-
      Wordt een subsidieaanvraag schriftelijk ingediend dan geschiedt dit op een door de minister vastgesteld
      aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9o
  - number: 9p.1
    text: 'De subsidie wordt verleend op grond van de volgende overwegingen:'
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9p
  - number: 9p.1.a
    text: het belang van de activiteiten van de subsidieaanvrager;
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9p
  - number: 9p.1.b
    text: de positie van de subsidieaanvrager in het cultuurbestel; en
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9p
  - number: 9p.1.c
    text: de samenhang tussen de subsidieaanvragen.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9p
  - number: 9p.2
    text: |-
      Bij de verlening van subsidies als bedoeld in de [artikelen 9i][ref1] en [9j][ref2] gelden tevens als overwegingen:


      [ref1]: https://wetten.overheid.nl/BWBR0007155#Artikel9i
      [ref2]: https://wetten.overheid.nl/BWBR0007155#Artikel9j
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9p
    references:
      - id: ref1
        bwb_id: BWBR0007155
        artikel: 9i
        hoofdstuk: IIA
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0007155
        artikel: 9j
        hoofdstuk: IIA
        paragraaf: '5'
  - number: 9p.2.a
    text: de spreiding van instellingen over het land; en
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9p
  - number: 9p.2.b
    text: |-
      de aanwezigheid van een opleiding of lerarenopleiding op het gebied van de kunst zoals bedoeld in het
      [Bekostigingsbesluit WHW][ref1] in de plaats van vestiging van de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006338
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9p
    references:
      - id: ref1
        bwb_id: BWBR0006338
  - number: 9q
    text: |-
      Onverminderd de [artikelen 4:35 van de Algemene wet bestuursrecht][ref1] en [4 van het Besluit][ref2] wordt de
      subsidieverlening geweigerd, indien de aanvraag wordt ingediend door een instelling die bekostiging ontvangt op
      grond van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] of door een instelling waarvan de
      activiteiten naar het oordeel van de minister het initieel onderwijs overlappen waarvoor op grond van die wet
      bekostiging mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006759#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel9q
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006759
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005682
  - number: '10'
    text: |-
      Subsidie in de kosten van projecten op het terrein van het specifiek cultuurbeleid wordt verstrekt met toepassing
      van dit hoofdstuk, tenzij voor een bepaalde sector van dat terrein een aparte regeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel10
  - number: 10a
    text: |-
      Een experiment of project op het terrein van de monumentenzorg komt voor subsidie in aanmerking indien het
      experiment of project naar het oordeel van de minister:
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel10a
  - number: 10a.a
    text: een bijdrage zal kunnen leveren aan het behoud van monumenten van bouwkunst; en
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel10a
  - number: 10a.b
    text: een landelijke voorbeeldfunctie zal kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel10a
  - number: 12a.1
    text: |-
      In afwijking van [artikel 7, derde lid, van het Besluit][ref1] worden aanvragen voor een subsidie voor een
      experiment of project als bedoeld in [artikel 10a][ref2] ingediend vóór 1 oktober van het jaar voorafgaand aan het
      jaar waarin de uitvoering van het experiment of het project is voorgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007155#Artikel10a
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007155
        artikel: 10a
        hoofdstuk: III
  - number: 12a.2
    text: De beslissing op aanvragen als bedoeld in het eerste lid wordt genomen vóór 1 januari.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel12a
  - number: '14'
    text: In de beschikking tot subsidieverlening worden de hoogte en het tempo van de bevoorschotting vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel14
  - number: '17'
    text: |-
      [Artikel 37, eerste en tweede lid, van het Besluit][ref1] zijn niet van toepassing indien de verleende subsidie
      minder dan € 125.000 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel37
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '37'
  - number: '18'
    text: |-
      Een uitkering aan een provincie of een gemeente ten behoeve van het door het desbetreffende openbaar lichaam
      te voeren cultuurbeleid wordt verstrekt met toepassing van dit hoofdstuk, tenzij voor het verstrekken van een
      dergelijke uitkering een aparte regeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel18
  - number: '19'
    text: |-
      De uitkering bestaat uit een bedrag voor de door de minister in de beslissing tot toekenning van een uitkering
      aangeduide doelen.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel19
  - number: '20'
    text: |-
      Geen uitkering ten behoeve van doelen wordt verstrekt ten behoeve van apparaatskosten van het betrokken openbaar
      lichaam.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel20
  - number: '21'
    text: In de beschikking tot toekenning van een uitkering worden de hoogte en het tempo van de bevoorschotting geregeld.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel21
  - number: '22'
    text: |-
      Ten aanzien van subsidies die zijn verstrekt voorafgaand aan de inwerkingtreding van deze regeling, blijft de
      Regeling subsidies en uitkeringen cultuuruitingen zoals die op 31 december 2008 luidde, van kracht.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel22
  - number: '24'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel24
  - number: '25'
    text: 'Deze regeling wordt aangehaald als: Regeling subsidies en uitkeringen cultuuruitingen.'
    url: https://wetten.overheid.nl/BWBR0007155/2010-01-01#Artikel25
