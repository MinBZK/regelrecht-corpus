$id: regeling_specifieke_uitkering_voorbereidingskosten_landelijk_gebied_versnellingsvoorstellen_en_pas_melders
regulatory_layer: WET
publication_date: '2022-11-23'
valid_from: '2024-04-18'
bwb_id: BWBR0047505
url: https://wetten.overheid.nl/BWBR0047505/2024-04-18
preamble:
  text: |-
    Gelet op de artikelen 2a, eerste lid, en 3 van de Kaderwet EZK- en LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *minister:* Minister voor Natuur en Stikstof;
        - *Nationaal Programma Landelijk Gebied:* programma waarin gebiedsgerichte opgaven en maatregelen voor natuur,
      stikstof, landbouw, water, bodem en klimaat zijn opgenomen, zoals beschreven in de startnotitie van 10 juni 2022
      (Kamerstukken II 2021/22, 34 682, nr. 96).
        - *uitvoeringskosten:* door de provincie gemaakte of nog te maken: a. kosten voor de ontwikkeling
      en ondersteuning van de Realisatie Transitie Landelijk Gebied op basis van het Nationaal Programma
      Landelijk Gebied; b. kosten voor de voorbereiding van de versnellingsvoorstellen waarvoor op grond van de
      [Regeling specifieke uitkering provinciale versnellingsvoorstellen transitie landelijk gebied][ref1] een
      specifieke uitkering is of wordt verstrekt, en de operationele kosten die zijn verbonden aan de realisatie van die
      versnellingsvoorstellen; of c. kosten voor de voorbereiding van maatregelen ten behoeve van PAS-melders waarvoor
      een specifieke uitkering is of wordt verstrekt ingevolge de aankondiging in de brief van 15 juli 2022 (Kamerstukken
      II 2021/22, 35 925-XIV, nr. 161) om € 250 miljoen aan de provincies beschikbaar te stellen ter versnelling van het
      legalisatieprogramma, en de operationele kosten die zijn verbonden aan de realisatie van die maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0047503
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0047503
  - number: '2.1'
    text: |-
      De minister verstrekt aan de provincies op aanvraag een specifieke uitkering om bij te dragen in de
      uitvoeringskosten.
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel2
  - number: '2.2'
    text: Per provincie wordt één specifieke uitkering verstrekt.
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel2
  - number: '2.3'
    text: |-
      De specifieke uitkering wordt verstrekt voor kosten die zijn of worden gemaakt in de periode 5 april 2022 tot en
      met 31 december 2023.
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel2
  - number: '2.4'
    text: De specifieke uitkering wordt niet verstrekt voor kosten die reeds uit anderen hoofde zijn of worden gesubsidieerd.
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel2
  - number: '3.1'
    text: |-
      De specifieke uitkering bedraagt 100% van de uitvoeringskosten, doch ten hoogste het in de beschikking vastgestelde
      bedrag, inclusief BTW.
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel3
  - number: '3.2'
    text: |-
      De betaling wordt verminderd met de kosten waarvoor de provincie op grond van de
      [Wet op het BTW-compensatiefonds][ref1] voor compensatie in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: '4.1'
    text: De specifieke uitkering kan worden aangevraagd tot 1 december 2022, 17:00.
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel4
  - number: '4.2'
    text: 'De aanvraag bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel4
  - number: 4.2.a
    text: |-
      de beschrijving van de activiteiten en de opgave van de omvang van de kosten waarvoor de specifieke uitkering wordt
      aangevraagd;
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel4
  - number: 4.2.b
    text: |-
      de opgave van de omvang van de kosten waarvoor de provincie in aanmerking komt voor compensatie op grond van de
      [Wet op het BTW-compensatiefonds][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: '5'
    text: De minister verleent de specifieke uitkering uiterlijk op 31 december 2022.
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel5
  - number: '6'
    text: |-
      De provincie wendt de specifieke uitkering zodanig aan dat geen sprake is van ongeoorloofde verlening van
      staatssteun.
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel6
  - number: '7'
    text: |-
      De minister verleent de provincie in de beschikking tot de verlening een voorschot van 100% van het
      uitkeringsbedrag.
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel7
  - number: '8.1'
    text: |-
      De provincie legt verantwoording af over de besteding van de specifieke uitkering op de wijze, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '8.2'
    text: |-
      Nadat de minister de relevante verantwoordingsinformatie, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1], van de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties heeft ontvangen, stelt de minister binnen 22 weken na die ontvangst de uitkering ambtshalve
      vast.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '9.1'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel9
  - number: '9.2'
    text: |-
      Deze regeling vervalt met ingang van 24 november 2027, met dien verstande dat zij van toepassing blijft op voordien
      ingediende aanvragen.
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel9
  - number: '10'
    text: |-
      Deze regeling wordt aangehaald als: Regeling specifieke uitkering voorbereidingskosten landelijk gebied,
      versnellingsvoorstellen en PAS-melders.
    url: https://wetten.overheid.nl/BWBR0047505/2024-04-18#Artikel10
