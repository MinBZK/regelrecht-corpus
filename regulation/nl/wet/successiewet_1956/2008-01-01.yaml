        hoofdstuk: III
  - number: '24.2'
    text: 'Onder verkrijger in tariefgroep I wordt verstaan een verkrijger – niet zijnde de echtgenoot – die:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel24
  - number: 24.2.a
    text: |-
      tot het tijdstip van het overlijden of de schenking samen met de erflater of de schenker een als duurzaam bedoelde
      gemeenschappelijke huishouding heeft gevoerd, welke huishouding in geval van overlijden reeds zes maanden heeft
      geduurd en in geval van schenking reeds twee jaar heeft geduurd, waarbij slechts in aanmerking wordt genomen een
      periode na het bereiken van de 18-jarige leeftijd. Het voeren van een gemeenschappelijke huishouding als bedoeld
      in dit letteronderdeel wordt slechts aangenomen indien de verkrijger en de erflater of de schenker volgens de
      basisadministratie persoonsgegevens of een daarmee naar aard en strekking overeenkomende administratie buiten
      Nederland op hetzelfde woonadres staan ingeschreven en een wederzijdse zorgverplichting zijn aangegaan, vastgelegd
      in een notarieel samenlevingscontract. Dit letteronderdeel is niet van toepassing op bloedverwanten in de rechte
      lijn van de erflater of schenker en op verkrijgers die gedurende de laatste vijf kalenderjaren voorafgaand aan
      het kalenderjaar van overlijden onderscheidenlijk van schenking, voor de heffing van de inkomstenbelasting hadden
      kunnen kwalificeren als partner van de erflater of schenker, doch zulks hebben nagelaten. De in dit letteronderdeel
      bedoelde verkrijger dient als enige persoon te voldoen aan de in dit onderdeel gestelde eisen; of
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel24
  - number: 24.2.b
    text: |-
      tot het tijdstip van het overlijden of de schenking samen met de erflater of de schenker na hun 22e jaar gedurende
      een aaneengesloten periode van ten minste 5 jaren en met geen ander dan met een of meer kinderen jonger dan 27 jaar
      van een van hen of van hen beiden een gemeenschappelijke huishouding heeft gevoerd. Voor dit letteronderdeel wordt
      met een kind gelijkgesteld een pleegkind, waaronder voor de toepassing van dit letteronderdeel wordt verstaan een
      kind dat door de verkrijger en de erflater of de schenker als een eigen kind is onderhouden en opgevoed; dan wel
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel24
  - number: 24.2.c
    text: |-
      tot het tijdstip van het overlijden of de schenking samen met de erflater of de schenker na hun 22e jaar gedurende
      een aaneengesloten periode van ten minste 5 jaren een gemeenschappelijke huishouding heeft gevoerd.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel24
  - number: '24.3'
    text: |-
      Voor zover een schenking binnen het Rijk gelegen onroerende zaken en de rechten waaraan deze zijn onderworpen
      of voor de heffing van de overdrachtsbelasting daarmee gelijkgestelde certificaatrechten en dergelijke of
      rechten van lidmaatschap van verenigingen of coöperaties tot voorwerp heeft, bedraagt het recht van schenking
      of het recht van overgang niet minder dan de overdrachtsbelasting welke zou zijn verschuldigd, indien
      [artikel 15, eerste lid, letter d, van de Wet op belastingen van rechtsverkeer][ref1] niet van toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel15
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '15'
  - number: '24.4'
    text: |-
      De overdrachtsbelasting betaald over het bedrag waarover recht van schenking of recht van overgang verschuldigd is,
      strekt in mindering van het recht van schenking onderscheidenlijk het recht van overgang.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel24
  - number: '25.1'
    text: |-
      Verkrijging krachtens erfrecht door met elkaar gehuwde personen, die niet van tafel en bed zijn gescheiden, worden,
      voor de berekening van het recht van successie, aangemerkt als verkrijgingen door één van de echtgenoten, bij
      verschil in graad door degene van hen, die de erflater het naast verwant is.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel25
  - number: '25.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing bij verkrijgingen door ongehuwd samenwonenden als bedoeld in
      [artikel 24, tweede lid, letter a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel24
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '24'
        hoofdstuk: III
  - number: '26.1'
    text: |-
      Met elkaar gehuwde personen, die niet van tafel en bed zijn gescheiden, worden, voor de berekening van het recht
      van schenking, als één en dezelfde persoon aangemerkt. Het schenkingsrecht wordt alsdan berekend naar de naaste
      verwantschap tussen de schenker of één van de gehuwde schenkers en de begiftigde of één van de gehuwde begiftigden.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel26
  - number: '26.2'
    text: |-
      Indien schenkingen worden gedaan binnen een jaar vóór het huwelijk van de schenkers of van de begiftigden, wordt
      het huwelijk geacht reeds ten tijde van die schenkingen te hebben bestaan.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel26
  - number: '26.3'
    text: |-
      Het in het eerste lid bepaalde is niet toepasselijk op schenkingen door een echtgenoot aan degene met wie hij is
      gehuwd.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel26
  - number: '26.4'
    text: |-
      De vorige leden zijn van overeenkomstige toepassing op verkrijgingen door ongehuwd samenwonenden als bedoeld in
      [artikel 24, tweede lid, letter a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel24
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '24'
        hoofdstuk: III
  - number: '27'
    text: |-
      De gedurende een kalenderjaar door dezelfde schenker aan dezelfde begiftigde gedane schenkingen worden aangemerkt
      als deel uitmakend van één schenking ten belope van het gezamenlijke bedrag.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel27
  - number: '28'
    text: |-
      Schenkingen, door ouders tezamen of afzonderlijk gedurende een kalenderjaar aan een kind gedaan, worden aangemerkt
      als één schenking ten belope van het gezamenlijk bedrag.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel28
  - number: '29.1'
    text: |-
      Indien onzekerheid bestaat omtrent de verwantschap of omtrent de persoon van de schenker of van de verkrijger,
      wordt het hoogste recht geheven, dat verschuldigd zou kunnen zijn, behoudens vermindering van de aanslag, voor
      zover deze naderhand blijkt te hoog te zijn.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel29
  - number: '29.2'
    text: |-
      Bestaat de onzekerheid ten aanzien van de persoon van de schenker, dan wordt deze, behoudens tegenbewijs, geacht
      binnen het Rijk te wonen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel29
  - number: '29.3'
    text: |-
      De bepalingen van dit artikel zijn mede toepasselijk, indien de naam of de woonplaats van de schenker of van de
      begiftigde desgevraagd niet wordt genoemd.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel29
  - number: '30.1'
    text: |-
      Het bedrag van de rechten ondergaat ten gevolge van verwerping of van afstand van rechten geen vermindering. De
      eerste volzin is niet van toepassing indien op de voet van [artikel 18 van Boek 4 van het Burgerlijk Wetboek][ref1]
      wordt afgezien van een wettelijke verdeling van de nalatenschap overeenkomstig
      [artikel 13 van Boek 4 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '30.2'
    text: |-
      Bij verwerping door de erfgenamen van een overledene van hetgeen aan deze uit een vroeger opengevallen nalatenschap
      is opgekomen, wordt ten laste van hen, die ten gevolge van die verwerping verkrijgen, niet minder recht geheven,
      dan in totaal verschuldigd zou zijn wegens de verkrijging door de overledene en wegens de overgang van deze op
      zijn erfgenamen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel30
  - number: '30.3'
    text: |-
      Indien de verwachters gedurende het leven van de bezwaarde afstand doen van hun recht of dat na zijn dood
      verwerpen of niet aanvaarden, wordt ten laste van hen, die het bezwaarde goed uit de nalatenschap van de bezwaarde
      verkrijgen, niet minder recht geheven, dan zonder die afstand, verwerping of niet aanvaarding verschuldigd zou
      zijn.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel30
  - number: '31'
    text: |-
      Het recht, verschuldigd wegens de afstand van vermogen verkregen onder een in [artikel 21, tweede lid][ref1],
      bedoelde voorwaarde door de bezwaarde aan de echtgenoot of een of meer van de bloed- of aanverwanten tot en met
      de vierde graad van de verwachter of aan de echtgenoot van één van die verwanten, bedraagt niet minder dan het
      recht, verschuldigd wegens de overgang van dat goed van de bezwaarde op de verwachter krachtens de vervulling van
      de voorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel21
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '21'
        hoofdstuk: II
  - number: 31a.1
    text: |-
      Indien in de belastbare verkrijging te conserveren waarde als bedoeld in [artikel 35c][ref1] is begrepen, is de
      verschuldigde belasting voorzover deze bij wege van aanslag op de voet van [artikel 37, eerste lid][ref2], wordt
      geheven de belasting die wordt berekend over de belastbare verkrijging verminderd, maar niet verder dan tot nihil,
      met de daarin begrepen te conserveren waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel37
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '37'
        hoofdstuk: IV
  - number: 31a.2
    text: |-
      De over te conserveren waarde verschuldigde belasting is het bedrag aan belasting dat verschuldigd zou zijn zonder
      de in het eerste lid bedoelde vermindering aan te conserveren waarde, na aftrek van de overeenkomstig het eerste
      lid bepaalde belasting.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel31a
  - number: 31a.3
    text: |-
      De aan de op grond van [artikel 35c, eerste en tweede lid][ref1], te conserveren waarde – de voorwaardelijk
      onbelaste geconserveerde waarde – toe te rekenen belasting is het verschil tussen de belasting die
      verschuldigd zou zijn zonder de in het eerste lid bedoelde vermindering aan te conserveren waarde en de
      belasting die verschuldigd zou zijn over de belastbare verkrijging nadat die is verminderd met de op grond van
      [artikel 35c, eerste en tweede lid][ref2], te conserveren waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
  - number: 31a.4
    text: |-
      De aan de op grond van [artikel 35c, derde lid][ref1], te conserveren waarde – de belaste geconserveerde waarde
      – toe te rekenen belasting bedraagt het verschil tussen het op grond van het tweede lid berekende bedrag aan
      belasting en het op grond van het derde lid berekende bedrag aan belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
  - number: '32.1'
    text: 'Van het recht van successie is vrijgesteld, hetgeen wordt verkregen:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
  - number: 32.1.1°
    text: door de Staat;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
  - number: 32.1.2°
    text: |-
      door een provincie of een gemeente binnen het Rijk, zonder bijzondere opdracht of met een opdracht, indien en voor
      zover deze opdracht aan de making niet het karakter ontneemt van te zijn geschied in het algemeen belang;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
  - number: 32.1.3°
    text: |-
      door een instelling als bedoeld in [artikel 6.33, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref1],
      voorzover aan de verkrijging niet een opdracht is verbonden, welke aan de verkrijging het karakter ontneemt van te
      zijn geschied in het algemeen belang;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 32.1.4°
    text: 'door de hierna genoemde personen tot de daarachter vermelde bedragen:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
  - number: 32.1.4°.a
    text: |-
      echtgenoot of verkrijger als bedoeld in [artikel 24, tweede lid, letter a][ref1]:  € 523 667;


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel24
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '24'
        hoofdstuk: III
  - number: 32.1.4°.b
    text: |-
      kinderen tot 23 jaar: € 4479 voor ieder jaar dat de verkrijger jonger is dan 23 jaar (een gedeelte van een jaar
      voor een vol jaar gerekend), met dien verstande dat de vrijstelling ten minste € 10 150 bedraagt; indien het kind
      verkeert in een geval als is bedoeld onder *c*, bedraagt de vrijstelling ten minste € 13 429;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
  - number: 32.1.4°.c
    text: |-
      kinderen ouder dan 23 jaar, die grotendeels op kosten van de overledene werden onderhouden en, hetzij ouder zijn
      dan 60 jaar, hetzij ten gevolge van ziekte of gebreken vermoedelijk in de eerstkomende drie jaren buiten staat
      zullen zijn om met arbeid die voor hun kracht berekend is, de helft te verdienen van hetgeen lichamelijk en
      geestelijk gezonde personen van gelijke leeftijd in staat zijn aan inkomen uit arbeid te verwerven: € 10 150;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
  - number: 32.1.4°.d
    text: |-
      kinderen voor wie de vrijstelling onder *b* en *c* genoemd niet van toepassing is: € 10 150 indien het saldo van de
      verkrijging niet meer bedraagt dan € 26 852;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
  - number: 32.1.4°.e
    text: |-
      verkrijger als bedoeld in [artikel 24, tweede lid, letter b][ref1]:  € 523 667 en verkrijgers als bedoeld in
      [artikel 24, tweede lid, letter c][ref2]: € 261 836; indien de in genoemde bepalingen bedoelde gemeenschappelijke
      huishouding vier, drie of twee jaren heeft geduurd bedraagt de vrijstelling onderscheidenlijk  € 209 465,  € 157
      098 en  € 104 729;


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel24
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '24'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '24'
        hoofdstuk: III
  - number: 32.1.4°.f
    text: 'ouders voor wie de vrijstelling onder *e* genoemd niet van toepassing is: € 44 752.'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
  - number: 32.1.5°
    text: |-
      aan waarde van aanspraken ingevolge een pensioenregeling, aan waarde van lijfrenten alsmede aan waarde van
      aanspraken op periodieke uitkeringen bij overlijden;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
  - number: 32.1.6°
    text: |-
      door bloedverwanten in de rechte lijn in gevallen waarin 4°, letters *b*, *c*, *d*, *e* en *f* niet van toepassing
      is, indien de verkrijging € 10 150 niet te boven gaat;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
  - number: 32.1.7°
    text: |-
      in andere gevallen, tot een bedrag van  € 1942. Indien meer dan het vrijgestelde wordt verkregen, is het recht
      slechts over het meerdere verschuldigd;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
  - number: 32.1.9°
    text: |-
      door een werknemer van de erflater of zijn echtgenoot of door een nabestaande van zodanige werknemer, voor
      zover het verkregene kan worden beschouwd als de voldoening aan een ter zake van de verrichte arbeid bestaande
      natuurlijke verbintenis als is bedoeld in artikel 3 van Boek 6 van het Burgerlijk Wetboek. Voor zover een
      verkrijging van een nabestaande van de werknemer aan periodieke uitkeringen ingevolge deze bepaling is vrijgesteld
      van successierecht, wordt zij, voor de toepassing van deze wet, beschouwd als een aan de werknemer toe te rekenen
      bevoordeling krachtens een ten behoeve van de verkrijger gemaakt beding;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
  - number: 32.1.10°
    text: aan nog niet vorderbare termijnen van renten, van uitkeringen, van bezoldigingen en van andere inkomsten.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
  - number: '32.2'
    text: |-
      De waarde van aanspraken ingevolge een pensioenregeling - andere dan die ingevolge de
      [Algemene nabestaandenwet][ref1] -, van lijfrenten alsmede van aanspraken op periodieke uitkeringen bij overlijden
      welke door een kind of een ouder ten gevolge van het overlijden worden verkregen en hetzij van het recht van
      successie zijn vrijgesteld ingevolge het eerste lid, 5°, hetzij naar hun aard niet krachtens deze wet belastbaar
      zijn, strekt in mindering van de in het eerste lid, 4°, letters *b* en *f*, genoemde bedragen, met dien verstande
      dat na deze korting de vrijstelling niet minder bedraagt dan € 13 429 voor een kind als bedoeld in het eerste lid,
      onder 4°, onderdeel b, slot, € 10 150 voor de andere onder die letter bedoelde kinderen en € 8952 voor een ouder.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: '32.3'
    text: |-
      De waarde van aanspraken ingevolge een pensioenregeling - andere dan die ingevolge de
      [Algemene Ouderdomswet][ref1] en de [Algemene nabestaandenwet][ref2] -, van lijfrenten alsmede van
      aanspraken op periodieke uitkeringen bij overlijden welke door de echtgenoot of een verkrijger als bedoeld in
      [artikel 24, tweede lid, letters a, b en c][ref3] ten gevolge van het overlijden worden verkregen en hetzij
      van het recht van successie zijn vrijgesteld ingevolge het eerste lid, 5°, hetzij naar hun aard niet krachtens
      deze wet belastbaar zijn, strekt voor de helft in mindering van het in het eerste lid, 4°, letter *a*,
      onderscheidenlijk het in letter *e* als eerste dan wel als tweede genoemde bedrag, met dien verstande dat na
      deze korting de vrijstelling niet minder bedraagt dan € 149 622 voor een echtgenoot alsmede voor een verkrijger
      als bedoeld in [artikel 24, tweede lid, letters a en b][ref4] en € 74 817 voor een verkrijger als bedoeld
      in [artikel 24, tweede lid, letter c][ref5]. Voor de toepassing van dit lid blijft [artikel 23][ref6] buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0002226#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0002226#Artikel24
      [ref6]: https://wetten.overheid.nl/BWBR0002226#Artikel23
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0002226
        artikel: '24'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002226
        artikel: '24'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0002226
        artikel: '24'
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0002226
        artikel: '23'
        hoofdstuk: II
  - number: '32.4'
    text: |-
      Onder pensioenregeling wordt voor de toepassing van deze wet verstaan een pensioenregeling als bedoeld in
      [artikel 1.7, tweede lid, van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: '32.5'
    text: |-
      Onder lijfrenten worden verstaan lijfrenten als bedoeld in [artikel 3.125 van de Wet inkomstenbelasting 2001][ref1],
      welke zijn verzekerd bij een verzekeraar als bedoeld in [artikel 3.126 van die wet][ref2], alsmede
      aanspraken op tegoeden van lijfrentespaarrekeningen of waarden van lijfrentebeleggingsrechten als bedoeld in
      [artikel 3.126a van die wet][ref3], voorzover de terzake voldane premies respectievelijk de overgemaakte bedragen
      voor de heffing van de inkomstenbelasting als uitgaven voor inkomensvoorzieningen in aftrek konden worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '32.6'
    text: |-
      Onder aanspraken op periodieke uitkeringen bij overlijden worden verstaan aanspraken op periodieke uitkeringen
      als bedoeld in [artikel 11, eerste lid, onderdeel g, van de Wet op de loonbelasting 1964][ref1], die ingaan bij
      het overlijden van de werknemer of de gewezen werknemer en toekomen aan zijn echtgenoot of gewezen echtgenoot
      dan wel degene met wie hij duurzaam een gezamenlijke huishouding voert of heeft gevoerd en met wie geen bloed- of
      aanverwantschap in rechte lijn bestaat, of aan zijn eigen kinderen of pleegkinderen die de leeftijd van 30 jaar nog
      niet hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
  - number: 32a
    text: |-
      Van het recht van overgang is vrijgesteld, hetgeen wordt verkregen door een instelling als bedoeld in
      [artikel 6.33, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref1], voorzover aan de verkrijging
      niet een opdracht is verbonden, welke aan de verkrijging het karakter ontneemt van te zijn geschied in het algemeen
      belang.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: '33.1'
    text: 'Van het recht van schenking is vrijgesteld, hetgeen wordt verkregen:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel33
  - number: 33.1.1°
    text: van de Koningin of de leden van het Koninklijk Huis;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel33
  - number: 33.1.2°
    text: door de Staat, of van de Staat, een provincie of gemeente;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel33
  - number: 33.1.3°
    text: |-
      door een provincie of gemeente binnen het Rijk, zonder bijzondere opdracht of met een opdracht, indien en voor
      zover deze opdracht aan de schenking niet het karakter ontneemt van te zijn geschied in het algemeen belang;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel33
  - number: 33.1.4°
    text: |-
      door een instelling als bedoeld in [artikel 6.33, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref1],
      voorzover aan de verkrijging niet een opdracht is verbonden, welke aan de verkrijging het karakter ontneemt van te
      zijn geschied in het algemeen belang;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 33.1.5°
    text: |-
      door een kind van de ouders, tot een bedrag van € 4479. Voor een kind tussen 18 en 35 jaar wordt het bedrag
      van € 4479 voor één kalenderjaar tot € 22 379 verhoogd, mits op deze verhoogde vrijstelling in de aangifte een
      beroep wordt gedaan. Indien meer dan het vrijgestelde wordt verkregen, is het recht slechts over het meerdere
      verschuldigd;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel33
  - number: 33.1.7°
    text: in alle andere gevallen, indien het verkregene een bedrag van € 2688 niet te boven gaat;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel33
  - number: 33.1.8°
    text: |-
      door iemand, die niet in staat is zijn schulden te betalen, indien en voor zover het verkregene strekt om de
      begiftigde daartoe in staat te stellen;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel33
  - number: 33.1.9°
    text: |-
      door iemand te wiens laste over die verkrijging inkomstenbelasting of een voorheffing van die belasting wordt
      geheven;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel33
  - number: 33.1.10°
    text: |-
      van een instelling als bedoeld in [artikel 6.33, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref1],
      voorzover de uitkeringen geheel of nagenoeg geheel het karakter hebben van te zijn geschied in het algemeen belang;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 33.1.11°
    text: |-
      door een rechtspersoon, welke uitsluitend of nagenoeg uitsluitend ten doel heeft de bevordering van de materiële en
      geestelijke belangen van de werknemers in het bedrijf van de schenker, dan wel in de bedrijven van de schenker en
      anderen, of van de nabestaanden van die werknemers;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel33
  - number: 33.1.12
    text: |-
      indien en voor zover de schenking heeft gestrekt tot voldoening aan een natuurlijke verbintenis als is bedoeld in
      [artikel 3 van Boek 6 van het Burgerlijk Wetboek][ref1]. Voor zover een ingevolge deze bepaling van het recht van
      schenking vrijgestelde verkrijging haar grond vindt in de voldoening aan een natuurlijke verbintenis als is bedoeld
      in de vorige volzin tot verzorging na het overlijden van de schuldenaar - de omzetting van zodanige verbintenis
      in een rechtens afdwingbare daaronder begrepen - wordt zij geacht krachtens erfrecht door het overlijden te zijn
      verkregen. Voor zover een schenking van een periodieke uitkering door een werkgever of zijn echtgenoot of door een
      pensioenfonds aan een nabestaande van een werknemer ingevolge deze bepaling is vrijgesteld van schenkingsrecht,
      wordt zij, voor de toepassing van deze wet, beschouwd als een aan de werknemer toe te rekenen bevoordeling
      krachtens een ten behoeve van de verkrijger gemaakt beding.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel3
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '3'
  - number: '33.2'
    text: |-
      Voor zover een hiervoor bedoelde schenking binnen het Rijk gelegen onroerende zaken en de rechten waaraan
      deze zijn onderworpen of voor de heffing van de overdrachtsbelasting daarmee gelijkgestelde certificaatrechten
      en dergelijke of rechten van lidmaatschap van verenigingen of coöperaties tot voorwerp heeft, wordt over het
      vrijgestelde gedeelte van de waarde van de bevoordeling een recht van schenking geheven, gelijk aan de in
      [artikel 24, derde lid][ref1], bedoelde overdrachtsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel24
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '24'
        hoofdstuk: III
  - number: '34'
    text: |-
      Wij behouden Ons voor bij algemene maatregel van bestuur regelen te stellen, ten doel hebbende te bevorderen,
      dat het vermogen van de in [artikel 33, eerste lid, onder 11°][ref1], bedoelde rechtspersonen blijvend wordt
      aangewend voor het door die rechtspersonen beoogde doel; bij niet-naleving van deze regelen blijft gemelde
      vrijstellingsbepaling buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel33
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '33'
        hoofdstuk: III
  - number: '35.1'
    text: |-
      Het recht bedraagt niet meer dan het drie-vierde gedeelte van het bedrag, waarmede de verkrijging het voor de
      verkrijger bepaalde maximum van de gehele vrijstelling te boven gaat. Indien een verkrijging het voor de toepassing
      van de gedeeltelijke vrijstelling bepaalde maximum te boven gaat, bedraagt het recht niet meer dan het totaal van:
      *a.* het drievierde gedeelte van het bedrag waarmee de verkrijging dit maximum te boven gaat, en *b.* het bedrag
      dat aan recht verschuldigd zou zijn wegens een verkrijging tot het bedrag van dit maximum.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35
  - number: '35.2'
    text: |-
      Bij verkrijgingen, welke aan een verschillend percentage zijn onderworpen, worden de gedeeltelijke vrijstellingen
      op de voor de verkrijger meest voordelige wijze toegepast.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35
  - number: 35a.1
    text: |-
      Met betrekking tot de bedragen vermeld in de [artikelen 24][ref1],
      [32, eerste lid, 4°, 6° en 7°, tweede lid en derde lid][ref2], en [33, eerste lid, 5° en 7°][ref3], zijn de
      [artikelen 10.1][ref4] en [10.2 van de Wet inkomstenbelasting 2001][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '24'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '32'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002226
        artikel: '33'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '10'
  - number: 35a.2
    text: |-
      De vervangende bedragen zijn van toepassing, indien het overlijden, de schenking of de in
      [artikel 45, derde lid, tweede zin][ref1], of in [artikel 53][ref2], eerste lid, bedoelde gebeurtenis plaatsvindt
      op of na 1 januari van het jaar waarvoor de vervanging geldt, zo mede indien op of na 1 januari van dat jaar
      krachtens schenking wordt verkregen ten gevolge van de vervulling van een voorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel53
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '45'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '53'
        hoofdstuk: VII
  - number: 35b.1
    text: |-
      Op verzoek van de verkrijger wordt op grond van [artikel 35c][ref1] de waarde, dan wel een deel van de waarde,
      van in de verkrijging begrepen vermogensbestanddelen die zijn aangeduid in het tweede lid, aangemerkt als te
      conserveren waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
  - number: 35b.2
    text: 'De vermogensbestanddelen, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35b
  - number: 35b.2.a
    text: |-
      de bestanddelen van het vermogen van een onderneming van een ondernemer als bedoeld in [artikel 3.4][ref1]
      of [3.5 van de Wet inkomstenbelasting 2001][ref2] of van een medegerechtigdheid als bedoeld in
      [artikel 3.3, eerste lid, onderdeel a, van die wet][ref3], de bestanddelen van een gedeelte van een onderneming
      daaronder begrepen, mits het een onderneming betreft van de erflater of schenker die door de verkrijger
      rechtstreeks wordt voortgezet;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 35b.2.b
    text: |-
      de aandelen in en winstbewijzen van een vennootschap welker kapitaal geheel of ten dele in aandelen is verdeeld,
      niet zijnde een lichaam waarvan de feitelijke werkzaamheid bestaat in het, onmiddellijk of middellijk, beleggen
      van vermogen of daarmee overeenkomende werkzaamheid, die behoorden tot een aanmerkelijk belang in de zin van
      [afdeling 4.3 van de Wet inkomstenbelasting 2001][ref1] bij de erflater of schenker.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling4.3
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '4.3'
  - number: 35b.3
    text: |-
      Voor de toepassing van het tweede lid, onderdeel b, wordt, volgens bij ministeriële regeling te
      stellen regels, slechts dat deel van de waarde van de aandelen of winstbewijzen in aanmerking genomen
      dat is toe te rekenen aan het deel van het vermogen van de vennootschap dat voor de toepassing van de
      [Wet op de vennootschapsbelasting 1969][ref1] zou worden gerekend tot het ondernemingsvermogen, indien de
      vennootschap een rechtspersoon zou zijn als bedoeld in [artikel 2, eerste lid, onderdeel e, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel2
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0002672
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '2'
  - number: 35b.4
    text: |-
      Voor de toepassing van dit hoofdstuk zijn de [artikelen 4.3 tot en met 4.5a van de Wet inkomstenbelasting 2001][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 35b.5
    text: Bij ministeriële regeling worden nadere regels gesteld voor de toepassing van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35b
  - number: 35c.1
    text: |-
      Indien de op de voet van [artikel 21][ref1] bepaalde waarde van de in de verkrijging begrepen
      vermogensbestanddelen, bedoeld in [artikel 35b, tweede lid][ref2], uitgaat boven de waarde van
      die bestanddelen met inachtneming van de verplichting van de verkrijger onderscheidenlijk het in
      [artikel 35b, tweede lid, onderdeel b][ref3], bedoelde lichaam, om de onderneming gedurende een periode van ten
      minste vijf jaren voort te zetten, wordt op verzoek van de verkrijger het verschil tussen de eerstgenoemde en de
      laatstgenoemde waarde aangemerkt als te conserveren waarde (voorwaardelijk onbelaste geconserveerde waarde).


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '21'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
      - id: ref3
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
  - number: 35c.2
    text: |-
      Op verzoek van de verkrijger wordt 75 percent van de waarde van de in de verkrijging begrepen
      vermogensbestanddelen, bedoeld in [artikel 35b, tweede lid][ref1], nadat deze waarde is verminderd met de op
      grond van het eerste lid te conserveren waarde, aangemerkt als te conserveren waarde (voorwaardelijk onbelaste
      geconserveerde waarde).


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
  - number: 35c.3
    text: |-
      Op verzoek van de verkrijger wordt de waarde van de in de verkrijging begrepen vermogensbestanddelen, bedoeld
      in [artikel 35b, tweede lid][ref1], nadat die is verminderd met de op grond van het eerste en het tweede lid te
      conserveren waarde, aangemerkt als te conserveren waarde (belaste geconserveerde waarde).


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
  - number: 35c.4
    text: |-
      In geval van schenking is dit artikel slechts van toepassing indien de schenker ten tijde van de schenking
      hetzij de leeftijd van 55 jaren heeft bereikt, hetzij voor 45 percent of meer arbeidsongeschikt is in de zin
      van [artikel 6.20 van de Wet inkomstenbelasting 2001][ref1]. Voorts geldt als voorwaarde dat, te rekenen tot het
      tijdstip van de schenking:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 35c.4.a
    text: |-
      indien het een verkrijging als bedoeld in [artikel 35b, tweede lid, onderdeel a][ref1], betreft: het verkregen
      ondernemingsvermogen behoorde tot een gedurende ten minste vijf jaren voor rekening van de schenker gedreven
      onderneming;


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
  - number: 35c.4.b
    text: |-
      indien het een verkrijging als bedoeld in [artikel 35b, tweede lid, onderdeel b][ref1], betreft: de
      verkregen aandelen of winstbewijzen gedurende ten minste vijf jaren tot een aanmerkelijk belang in de zin van
      [afdeling 4.3 van de Wet inkomstenbelasting 2001][ref2] van de schenker behoorden.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Afdeling4.3
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0011353
        afdeling: '4.3'
  - number: 35c.5
    text: De in het eerste, tweede en derde lid bedoelde verzoeken worden gedaan gelijktijdig met de aangifte.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel35c
  - number: '36'
    text: De belasting wordt geheven van de verkrijger.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel36
  - number: '37.1'
    text: De belasting wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel37
  - number: '37.2'
    text: |-
      In afwijking van het eerste lid wordt de belasting bedoeld in [artikel 31a, tweede lid][ref1], geheven bij wege van
      conserverende aanslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel31a
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 31a
        hoofdstuk: III
  - number: '38'
    text: |-
      De erfgenaam die is uitgenodigd tot het doen van aangifte, is gehouden mede aangifte te doen van de gegevens
      welke van belang kunnen zijn voor de heffing van het recht van successie van de andere verkrijgers, niet zijnde
      erfgenamen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel38
  - number: '39'
    text: |-
      Indien meer verkrijgers gehouden zijn aangifte te doen ter zake van dezelfde nalatenschap, kunnen zij gezamenlijk
      aangifte doen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel39
  - number: '40.1'
    text: |-
      De inspecteur kan de schenker die naar zijn mening vermoedelijk een belastbare schenking heeft gedaan, uitnodigen
      tot het doen van aangifte.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel40
  - number: '40.2'
    text: De schenker en de begiftigde - dan wel de gezamenlijke schenkers of begiftigden - kunnen gezamenlijk aangifte doen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel40
  - number: '42'
    text: |-
      Indien na te noemen verplichtingen niet reeds op een ander rusten, is degene, die door de verwerping, afstand
      of niet aanvaarding van rechten, bedoeld in [artikel 30][ref1], is gebaat, op dezelfde wijze en onder dezelfde
      bepalingen tot aangifte en betaling gehouden, als degene, door wie die verwerping, afstand of niet aanvaarding
      heeft plaats gehad, verplicht zou zijn geweest, indien een of ander niet was geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel30
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '30'
        hoofdstuk: III
  - number: '43.1'
    text: |-
      In iedere aangifte wordt één woonplaats gekozen binnen het Rijk. De stukken betreffende de heffing van de
      belasting kunnen worden gezonden hetzij aan de gekozen woonplaats hetzij aan de werkelijke woonplaats of plaats van
      vestiging. [Artikel 57 van de Algemene wet inzake rijksbelastingen][ref1] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel57
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '57'
  - number: '43.2'
    text: |-
      Zij, die voor het recht van successie geen aangifte hebben gedaan of geen woonplaats hebben gekozen, worden geacht
      hun woonplaats te hebben gekozen ter laatste woonplaats van de overledene gedurende een jaar na het overlijden;
      na die tijd, alsmede indien niet een bepaald adres binnen het Rijk als de werkelijke laatste woonplaats van de
      overledene kan worden aangewezen, ter secretarie van de gemeente, binnen welke de aangifte moet geschieden.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel43
  - number: '43.3'
    text: |-
      Zij, die voor het recht van overgang geen aangifte hebben gedaan of geen woonplaats hebben gekozen, worden geacht
      hun woonplaats te hebben gekozen ter secretarie van de gemeente, binnen welke de aangifte moet geschieden.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel43
  - number: '43.4'
    text: |-
      Zij, die voor het recht van schenking geen aangifte hebben gedaan of geen woonplaats hebben gekozen, worden geacht
      hun woonplaats te hebben gekozen ter woonplaats van de schenker, of, indien niet een bepaald adres binnen het Rijk
      als de werkelijke woonplaats van de schenker kan worden aangewezen, ter secretarie van de gemeente, binnen welke de
      aangifte moet geschieden.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel43
  - number: '45.1'
    text: |-
      De inspecteur stelt de termijn voor het doen van aangifte voor het recht van successie en voor het recht van
      overgang zodanig vast dat deze niet eerder verstrijkt dan acht maanden na het overlijden of na de schenking.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel45
  - number: '45.2'
    text: |-
      Indien zwangerschap oorzaak is, dat onzekerheid bestaat omtrent de persoon van de erfgenaam of de heffing van de
      belasting, gaat de in het eerste lid bedoelde termijn van acht maanden in van de dag van de bevalling, of indien
      de vrouw vroeger mocht overlijden van de dag van haar overlijden, of indien geen van beide op de 306de dag na
      de dood van de erflater mocht hebben plaats gehad, van de eerste daarop volgende dag. Deze bepaling kan niet
      worden ingeroepen door degene, op het erfdeel van wie, wat de hoegrootheid betreft, de bevalling geen invloed kan
      uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel45
  - number: '45.3'
    text: |-
      De in het eerste lid bedoelde termijn van acht maanden loopt niet gedurende de tijd dat de nalatenschap
      onbeheerd is gelaten en geen vereffenaar is benoemd. Indien verkregen wordt ten gevolge van de vervulling
      van een voorwaarde, van aanvaarding nadat eerst verwerping had plaatsgehad, van een afstand door een
      verkrijger onder een ontbindende voorwaarde als bedoeld in [artikel 21, tweede lid][ref1], ten behoeve
      van de verwachters, van de uitoefening van een wilsrecht voortspruitende uit ten sterfdage of ten tijde
      van de verkrijging bestaande of ontstane rechtsverhoudingen, dan wel ten gevolge van de toepassing van
      [artikel 33 van Boek 4 van het Burgerlijk Wetboek][ref2], gaat de in het eerste lid bedoelde termijn van acht
      maanden in op de dag waarop één van die gebeurtenissen plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel33
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '21'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '33'
  - number: '46.1'
    text: |-
      De inspecteur stelt de termijn voor het doen van aangifte voor het recht van schenking zodanig vast, dat deze niet
      eerder verstrijkt dan twee maanden na het einde van het kalenderjaar waarin de schenking heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel46
  - number: '46.2'
    text: |-
      Een schenking onder opschortende voorwaarde wordt, voor de toepassing van dit artikel, geacht tot stand te zijn
      gekomen op de dag, waarop de voorwaarde is vervuld.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel46
  - number: '47'
    text: |-
      Ingeval sprake is van meer dan één verkrijger van dezelfde erflater of krachtens een gezamenlijke schenking, kunnen
      de ter zake vastgestelde belastingaanslagen worden opgenomen in één aanslagbiljet.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel47
  - number: '52'
    text: |-
      Navordering op de voet van [hoofdstuk III van de Algemene wet inzake rijksbelastingen][ref1] kan mede plaatsvinden
      in gevallen waarin van een verkrijger te weinig belasting is geheven doordat een aan een andere verkrijger
      opgelegde aanslag, anders dan ingevolge [artikel 53][ref2], is verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel53
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '53'
        hoofdstuk: VII
  - number: '53.1'
    text: |-
      Behalve in de gevallen bij deze wet voorzien, wordt vermindering van de aanslag of de conserverende aanslag
      verleend, indien en voorzover ten gevolge van een beroep op de legitieme portie, van de vervulling van
      een voorwaarde, van de uitoefening van een op de wet berustend terugvorderingsrecht, van de toepassing van
      [artikel 33 van Boek 4 van het Burgerlijk Wetboek][ref1] of van de uitoefening van een wilsrecht, voortspruitende
      uit ten sterfdage of ten tijde van de verkrijging reeds bestaande of ontstane rechtsverhoudingen, anders
      dan door opvolging krachtens een voorwaarde als bedoeld in [artikel 21, tweede lid][ref2], wijziging wordt
      gebracht in de persoon van de verkrijger of in het verkregene. De eerste volzin is niet van toepassing
      bij de uitoefening van een wilsrecht als bedoeld in de [artikelen 19][ref3], [20][ref4], [21][ref5]en
      [22 van Boek 4 van het Burgerlijk Wetboek][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0002761#Artikel21
      [ref6]: https://wetten.overheid.nl/BWBR0002761#Artikel22
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '21'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0002761
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0002761
        artikel: '21'
      - id: ref6
        bwb_id: BWBR0002761
        artikel: '22'
  - number: '53.2'
    text: |-
      De vermindering wordt verleend op een verzoek dat geschiedt door het doen van aangifte. De inspecteur beslist op
      het verzoek bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel53
  - number: '53.3'
    text: |-
      In de gevallen, waarin de oorzaak tot de vermindering anderzijds aanleiding geeft tot heffing van recht, kan de in
      het vorige lid bedoelde aangifte worden opgenomen in de overeenkomstig [artikel 45, derde lid][ref1], in te dienen
      aangifte. In de andere gevallen moet die aangifte worden ingediend binnen acht maanden, nadat de oorzaak tot de
      vermindering is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel45
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '45'
        hoofdstuk: IV
  - number: '53.4'
    text: |-
      De teruggave, waartoe een vermindering aanleiding geeft, kan geschieden door verrekening met het terzake van
      dezelfde nalatenschap of schenking verschuldigde.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel53
  - number: 53a.1
    text: |-
      Indien na het opleggen van de aanslag of de conserverende aanslag, ten gevolge van de verdeling van de nalatenschap
      wijziging komt in de gerechtigdheid tot de vermogensbestanddelen, bedoeld in [artikel 35b][ref1], vinden op
      verzoek van de verkrijger wiens gerechtigdheid tot de genoemde vermogensbestanddelen toeneemt, de bepalingen van
      [hoofdstuk IIIA ][ref2]toepassing op basis van de aldus ontstane gerechtigdheid. De aanslag onderscheidenlijk de
      conserverende aanslag worden opgelegd op basis van, dan wel in overeenstemming gebracht met, de gerechtigdheid
      zoals die op grond van de in de eerste volzin bedoelde verdeling is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
      [ref2]: https://wetten.overheid.nl/BWBR0002226#HoofdstukIIIA
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002226
        hoofdstuk: IIIA
  - number: 53a.2
    text: |-
      Het verzoek, bedoeld in het eerste lid, en de nieuwe verzoeken voor de toepassing van [artikel 35c][ref1],
      geschieden door het doen van aangifte binnen acht maanden nadat de in het eerste lid bedoelde verdeling heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
  - number: 53a.3
    text: |-
      Dit artikel vindt slechts toepassing indien de verdeling van de nalatenschap heeft plaatsgevonden binnen twee jaren
      na het overlijden van de erflater.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel53a
  - number: 53b.1
    text: |-
      Indien binnen vijf jaren na de verkrijging, onderscheidenlijk de in [artikel 53a, eerste lid][ref1] bedoelde
      verdeling, zich een van de in het derde lid bedoelde gebeurtenissen voordoet, doet de verkrijger hiervan aangifte
      binnen een termijn van acht maanden nadat die gebeurtenis zich heeft voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel53a
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 53a
        hoofdstuk: VII
  - number: 53b.2
    text: |-
      In de gevallen, bedoeld in het eerste lid, wordt de op grond van [artikel 35c][ref1] bepaalde te conserveren
      waarde herzien en, met overeenkomstige toepassing van de bepalingen van [hoofdstuk IIIA][ref2], opnieuw
      vastgesteld met inachtneming van de in het eerste lid bedoelde gebeurtenis, met dien verstande dat daarbij de in
      het eerste lid bedoelde aangifte in de plaats treedt van de in [artikel 35c][ref3] bedoelde verzoeken. De aanslag
      onderscheidenlijk de conserverende aanslag worden opgelegd op basis van, dan wel in overeenstemming gebracht met,
      de aldus opnieuw vastgestelde te conserveren waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
      [ref2]: https://wetten.overheid.nl/BWBR0002226#HoofdstukIIIA
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002226
        hoofdstuk: IIIA
      - id: ref3
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
  - number: 53b.3
    text: |-
      Van een gebeurtenis als bedoeld in het eerste lid is sprake ingeval, volgens bij ministeriële regeling te stellen
      nadere regels,
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel53b
  - number: 53b.3.a
    text: |-
      indien het een verkrijging als bedoeld in [artikel 35b, tweede lid, onderdeel a][ref1], betreft: de verkrijger
      ophoudt uit de onderneming, of een gedeelte daarvan, winst te genieten;


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
  - number: 53b.3.b
    text: |-
      indien het een verkrijging als bedoeld in [artikel 35b, tweede lid, onderdeel b][ref1], betreft: de verkrijger
      tot de verkrijging behorende aandelen of winstbewijzen vervreemdt of een gedeelte van de in deze aandelen of
      winstbewijzen besloten liggende rechten vervreemdt, de vennootschap waarin de aandelen of winstbewijzen zijn
      verkregen haar onderneming staakt of een gedeelte van die onderneming staakt dan wel een lichaam wordt waarvan
      de feitelijke werkzaamheid bestaat in het onmiddellijk of middellijk, beleggen van vermogen of een daarmee
      overeenkomende werkzaamheid; een en ander indien de waarde van de in onderdeel a en b bedoelde verkrijgingen geheel
      of voor een deel is aangemerkt als te conserveren waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
  - number: 53b.4
    text: |-
      Voor de toepassing van het derde lid, onderdeel b, wordt onder
      vervreemden mede verstaan een handeling of gebeurtenis als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______________________, ook als deze handeling of gebeurtenis betrekking heeft op aandelen
      of winstbewijzen die bij de verkrijger niet tot een aanmerkelijk belang behoren in de zin van
      [afdeling 4.3 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Afdeling4.3
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        afdeling: '4.3'
  - number: 53c
    text: |-
      De na de toepassing van [artikel 53b][ref1] in een conserverende aanslag begrepen belasting bedoeld in
      [artikel 31a, derde lid][ref2], wordt na afloop van de in [artikel 53b, eerste lid][ref3], bedoelde periode van
      vijf jaren verminderd tot nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel53b
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel31a
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel53b
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel53c
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 53b
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002226
        artikel: 31a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002226
        artikel: 53b
        hoofdstuk: VII
  - number: '54'
    text: |-
      Een beroepschrift kan op de voet van [artikel 26a van de Algemene wet inzake rijksbelastingen][ref1] eveneens
      worden ingediend door de verkrijger die belang heeft bij de aan een andere verkrijger uit dezelfde nalatenschap
      opgelegde aanslag of verleende vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel26a
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 26a
  - number: '66.1'
    text: |-
      De in [artikel 11, derde lid][ref1], en
      [artikel 16, derde en vierde lid, van de Algemene wet inzake rijksbelastingen][ref2] vermelde termijnen van
      onderscheidenlijk drie, vijf en twaalf jaren voor het vervallen van de bevoegdheid tot het vaststellen van een
      aanslag of van een navorderingsaanslag gaan in:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '16'
  - number: 66.1.1°
    text: |-
      voor het recht van successie of het recht van overgang wegens een verkrijging krachtens erfrecht, na de dag van de
      inschrijving van de akte van overlijden in de registers van de burgerlijke stand hier te lande of na de dag waarop
      akten of stukken, waaruit het overlijden blijkt, ter kennis van de inspecteur zijn gekomen. In de gevallen, bij
      [artikel 45, tweede en derde lid][ref1], bedoeld, beginnen de termijnen niet eerder te lopen dan van de dag waarop
      de termijn van aangifte ingaat, en worden zij verlengd met de tijd dat de termijn van aangifte niet loopt;


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel45
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '45'
        hoofdstuk: IV
  - number: 66.1.2°
    text: |-
      voor het recht van schenking of het recht van overgang wegens een verkrijging krachtens schenking, na de dag van
      de inschrijving van de akte van overlijden van de schenker of van de begiftigde in de registers van de burgerlijke
      stand hier te lande of na de dag waarop akten of stukken, waaruit het overlijden van de schenker of van de
      begiftigde blijkt, ter kennis van de inspecteur zijn gekomen. Ingeval zowel de schenker als de begiftigde een
      rechtspersoon is, vervalt de bevoegdheid twintig jaren na de schenking. Ingeval een opschortende voorwaarde aan de
      schenking is verbonden, gaat de termijn van drie, vijf of twintig jaren niet vroeger in dan na de vervulling van
      de voorwaarde.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel66
  - number: '66.2'
    text: |-
      Betreft het de bevoegdheid tot het vaststellen van een navorderingsaanslag wegens het ten onrechte of tot een te
      hoog bedrag verlenen van een vermindering op grond van [artikel 53][ref1], dan gaat de termijn in na de dag waarop
      de vermindering is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel53
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '53'
        hoofdstuk: VII
  - number: '67.1'
    text: 'Door Onze Minister kan gehele of gedeeltelijke kwijtschelding worden verleend van:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel67
  - number: 67.1.1°
    text: |-
      het recht, verschuldigd wegens een schenking aan natuurlijke personen, waarvan overtuigend wordt aangetoond, dat
      zij slechts heeft gestrekt tot het verschaffen van levensonderhoud van een begiftigde, die verstoken is van eigen
      middelen van bestaan en die wegens ouderdom, invaliditeit of om andere redenen buiten staat is zich die middelen
      door arbeid te verschaffen;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel67
  - number: 67.1.2°
    text: |-
      het recht, verschuldigd wegens een schenking aan natuurlijke personen, beneden de leeftijd van 27 jaren, van welke
      schenking overtuigend wordt aangetoond, dat zij slechts heeft gestrekt tot betaling van - of bijdrage tot - de
      kosten van studie of opleiding voor enig beroep van een begiftigde, die zonder die schenking niet in staat zou zijn
      die studie of opleiding aan te vangen of te genieten;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel67
  - number: 67.1.4°
    text: |-
      het recht, verschuldigd wegens een schenking ten algemenen nutte voor het grondgebied van het Rijk, welke aan een
      bepaald tijdstip of een bepaalde gebeurtenis gebonden is.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel67
  - number: '67.2'
    text: 'Onze Minister kan kwijtschelding verlenen van het recht verschuldigd wegens verkrijgingen door:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel67
  - number: 67.2.a
    text: een andere Staat, voor zover het recht meer bedraagt dan het recht dat de Nederlandse Staat verschuldigd zou zijn;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel67
  - number: 67.2.b
    text: |-
      een staatkundig onderdeel of een plaatselijk publiekrechtelijk lichaam van een andere Staat, voor zover het recht
      meer bedraagt dan het recht dat een Nederlandse provincie of gemeente verschuldigd zou zijn;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel67
  - number: '67.3'
    text: |-
      Onze Minister kan, in bij algemene maatregel van bestuur te bepalen gevallen en volgens daarbij te stellen regels,
      geheel of gedeeltelijk kwijtschelding verlenen van het verschuldigde recht van successie indien voorwerpen uit de
      nalatenschap met een nationaal cultuurhistorisch of kunsthistorisch belang, door de verkrijger in eigendom worden
      overgedragen aan de Staat. Het bedrag van de kwijtschelding beloopt 120 percent van de waarde van de overgedragen
      voorwerpen maar niet meer dan het verschuldigde recht.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel67
  - number: '71.1'
    text: |-
      Het aanvaarden van een nalatenschap onder het voorrecht van boedelbeschrijving ontheft niet van de verplichtingen,
      voortvloeiende uit de bij of krachtens deze wet gemaakte bepalingen. De verplichtingen worden niet geschorst
      gedurende de in [artikel 192, tweede lid, van Boek 4 van het Burgerlijk Wetboek][ref1] bedoelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel192
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '192'
  - number: '71.2'
    text: De vervulling van die verplichtingen wordt niet beschouwd als een daad van aanvaarding.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel71
  - number: '72.1'
    text: |-
      Executeurs van nalatenschappen zijn, op gelijke wijze als de erfgenamen, tot vervulling van al de aan deze bij
      deze wet opgelegde verplichtingen gehouden, in geval al de erfgenamen buiten het Rijk hun woonplaats hebben. Zij
      zijn tot het doen van aangifte bevoegd, bijaldien één of meer van de erfgenamen hun woonplaats binnen het Rijk
      hebben. Indien zij van deze bevoegdheid hebben gebruik gemaakt, zijn zij, op gelijke wijze als de erfgenamen, tot
      vervulling van al de aan deze bij deze wet opgelegde verplichtingen gehouden.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel72
  - number: '72.2'
    text: |-
      Door de rechter benoemde vereffenaars van nalatenschappen zijn gehouden tot al de bij deze wet aan erfgenamen
      opgelegde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel72
  - number: '73'
    text: |-
      Zij, die goederen niet zijnde registergoederen of daarop betrekking hebbende bewijsstukken onder zich hebben
      met de opdracht om die bij het overlijden van iemand, die binnen het Rijk woonde, niet in de nalatenschap te
      brengen, of daarmede zo te handelen, dat zij niet in de nalatenschap komen, zijn verplicht daarvan overeenkomstig
      door Onze Minister te stellen regelen aangifte te doen. Deze aangifte moet worden ingeleverd binnen een maand na
      schriftelijke aanmaning en in ieder geval voordat de goederen of bewijsstukken uit handen worden gegeven of op
      andere wijze aan de opdracht gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel73
  - number: '74.1'
    text: |-
      In alle gevallen, waarin de mogelijkheid bestaat, dat zich in een gesloten kist of onder een verzegelde omslag
      goederen niet zijnde registergoederen of daarop betrekking hebbende bewijsstukken bevinden, waarvan op grond
      van de [artikelen 8][ref1] of [73][ref2] aangifte moet geschieden, zal op verzoek van de executeur of door de
      rechter benoemde vereffenaar van de nalatenschap, van de erfgenamen of van de houder, de opening, vóór de afgifte,
      geschieden door een notaris, die wordt aangewezen door de kantonrechter van de rechtbank van het arrondissement
      waarin de kist of de omslag zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel73
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '8'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '73'
        hoofdstuk: XII
  - number: '74.2'
    text: |-
      De notaris zal van de opening een proces-verbaal opmaken, waarin de uitwendige toestand en de inhoud van het ter
      opening aangebodene worden beschreven. De notaris zendt een dubbel van het proces-verbaal aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel74
  - number: '75.1'
    text: |-
      Indien tengevolge van het overlijden van iemand, die binnen het Rijk woonde, een uitkering krachtens
      levensverzekering of derdenbeding moet plaats hebben, alsmede indien een verandering in zodanige uitkering plaats
      heeft, is de verzekeraar of degene, die de uitkering doet, verplicht om overeenkomstig door Onze Minister te
      stellen regelen en binnen een door die Minister te stellen termijn de gegevens te verstrekken, welke voor de
      uitvoering van deze wet van belang kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel75
  - number: '75.2'
    text: |-
      Het in het vorige lid bepaalde is mede toepasselijk, indien, anders dan bij overlijden, een uitkering moet plaats
      hebben, hetzij krachtens een overeenkomst van levensverzekering, waarvan premies zijn betaald door een ander -
      binnen het Rijk wonende - dan degene, aan wie de uitkering moet geschieden, of waarvan de premiebetaler niet bekend
      is, hetzij krachtens een door iemand, die binnen het Rijk woont, ten behoeve van een derde gemaakt beding.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel75
  - number: '75.3'
    text: |-
      Indien de verzekeraar niet binnen het Rijk zijn woonplaats heeft of gevestigd is, wordt onder verzekeraar begrepen
      zijn vertegenwoordiger of hoofdvertegenwoordiger hier te lande.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel75
  - number: '75.4'
    text: |-
      Met betrekking tot de verplichtingen, bedoeld in dit artikel, blijft
      [artikel 53, derde lid, van de Algemene wet inzake rijksbelastingen][ref1] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel53
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '53'
  - number: '76'
    text: |-
      Hij die een aangifte heeft ingediend of moet indienen uitsluitend of mede ten behoeve van de heffing van belasting,
      welke ingevolge de bepalingen van deze wet door anderen verschuldigd is, is gehouden tot het verstrekken van
      gegevens, inlichtingen en inzage op dezelfde wijze en onder dezelfde bepalingen alsof die belasting te zijnen
      aanzien was of zou moeten worden geheven.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel76
  - number: '78.1'
    text: |-
      Ieder, die goederen verkrijgt onder bezwaar van een uit dezelfde nalatenschap verkregen vruchtgebruik, en
      ieder, aan wie goederen worden geschonken onder bezwaar van een door de schenker ten behoeve van zich of
      een derde voorbehouden vruchtgebruik, is, voor zover daaromtrent door de erflater of schenker niet anders
      is bepaald, bevoegd te vorderen, dat de rechten, deswege door hem verschuldigd, worden betaald uit de met
      vruchtgebruik bezwaarde goederen, tenzij de vruchtgebruiker verkiest het bedrag voor te schieten. Wegens
      deze betaling of dat voorschot is aan de vruchtgebruiker geen rente verschuldigd. De eerste en tweede volzin
      zijn niet van toepassing met betrekking tot geldvorderingen als bedoeld in [artikel 13, derde lid][ref1],
      en [artikel 80, eerste lid, van Boek 4 van het Burgerlijk Wetboek][ref2] indien de nalatenschap is verdeeld
      overeenkomstig [artikel 13 van Boek 4 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '80'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '78.2'
    text: |-
      Het recht op periodieke uitkeringen, bij de instelling verschuldigd, wordt voorgeschoten door hem, die met de
      uitkering is belast, en bij iedere termijn van betaling, naar evenredigheid van het aantal malen, waarvoor de te
      betalen termijn in de voor de heffing van het recht in aanmerking genomen waarde van de uitkering is begrepen,
      gekort, met bijberekening van de wettelijke rente over het te korten gedeelte van het voorgeschoten recht van de
      dag, waarop het recht is voorgeschoten, tot de dag van de korting, alles tenzij andere regelingen zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel78
  - number: '82'
    text: 'De navolgende bezettingsregelingen vervallen:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel82
  - number: 82.a
    text: |-
      Besluit van de Secretaris-Generaal van het Departement van Financiën van 14 November 1940 (*Ned. Staatscourant*
      1940, no. 234), betreffende de waarde van zaken, waarover recht van successie verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel82
  - number: 82.b
    text: |-
      Besluit van de Secretaris-Generaal van het Departement van Financiën van 24 December 1941 (*Ned. Staatscourant*
      1941, no. 251), betreffende verlenging van de duur van enige heffingen van opcenten en verhoging van opcenten, voor
      zover dit besluit betrekking heeft op de rechten van successie, van overgang en van schenking;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel82
  - number: 82.c
    text: |-
      Besluit van de Secretaris-Generaal van het Departement van Financiën van 24 September 1942 (*Ned. Staatscourant*
      1942, no. 203), betreffende verlenging van de duur van verschillende heffingen, voor zover dit besluit betrekking
      heeft op de rechten van successie, van overgang en van schenking.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel82
  - number: '83.1'
    text: |-
      Met ingang van de eerste dag van de maand, volgende op die, waarin deze wet in het *Staatsblad* wordt geplaatst,
      treden in werking: de [Hoofdstukken I][ref1], [II][ref2] en [III][ref3], met uitzondering van artikel 20; de
      [artikelen 80][ref4], [81][ref5] - voor zoveel betreft de halvering van de grondslag der heffing en de bijvordering
      van recht ten aanzien van voor het publiek opengestelde landgoederen -[ 82][ref6] en[ 83][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002226#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0002226#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0002226#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0002226#Artikel80
      [ref5]: https://wetten.overheid.nl/BWBR0002226#Artikel81
      [ref6]: https://wetten.overheid.nl/BWBR0002226#Artikel82
      [ref7]: https://wetten.overheid.nl/BWBR0002226#Artikel83
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002226
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002226
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002226
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002226
        artikel: '80'
        hoofdstuk: XII
      - id: ref5
        bwb_id: BWBR0002226
        artikel: '81'
        hoofdstuk: XIII
      - id: ref6
        bwb_id: BWBR0002226
        artikel: '82'
        hoofdstuk: XIII
      - id: ref7
        bwb_id: BWBR0002226
        artikel: '83'
        hoofdstuk: XIII
  - number: '83.2'
    text: |-
      De overige bepalingen van deze wet treden in werking met ingang van een door Ons te bepalen tijdstip, dat voor de
      onderscheidene bepalingen verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel83
  - number: '83.3'
    text: |-
      Op het in het eerste lid bepaalde tijdstip treden buiten werking de artikelen van de wet van 13 Mei
      1859 (*Staatsblad* no. 36), welke dezelfde onderwerpen regelen als de artikelen, waarvan het tijdstip
      van inwerkingtreding in dat lid is bepaald. De overige bepalingen van gemelde wet treden buiten werking
      onderscheidenlijk op de tijdstippen waarop de bepalingen van deze wet welke dezelfde onderwerpen regelen als
      eerstbedoelde bepalingen op de voet van het tweede lid in werking treden.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel83
  - number: '83.4'
    text: |-
      Verwijzingen naar artikelen van de in het vorige lid vermelde wet worden, zodra die artikelen buiten werking zijn
      getreden, aangemerkt als verwijzingen naar de overeenkomstige artikelen van deze wet. Verwijzingen in artikelen
      van deze wet naar andere artikelen van deze wet worden, zolang laatstbedoelde artikelen nog niet in werking zijn
      getreden, aangemerkt als verwijzingen naar de overeenkomstige artikelen van de in het vorige lid vermelde wet.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel83
  - number: '83.5'
    text: |-
      In de gevallen waarin volgens de in het derde lid vermelde wet op een aangever een bewijslast rust geldt, zolang
      de [Hoofdstukken IV tot en met VIII][ref1] van deze wet nog niet geheel van toepassing zijn, zulks in dezelfde mate
      voor de toepassing van de overeenkomstige artikelen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002226
        hoofdstuk: IV
  - number: '83.6'
    text: |-
      De bepalingen van deze wet zijn toepasselijk, indien het overlijden, de schenking of de in
      [artikel 45, derde lid, tweede zin][ref1], of [artikel 53, eerste lid][ref2], bedoelde gebeurtenis op of na het
      tijdstip van haar inwerkingtreding plaats heeft, zomede indien op of na dat tijdstip krachtens schenking wordt
      verkregen tengevolge van de vervulling van een voorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel53
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '45'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '53'
        hoofdstuk: VII
  - number: '83.7'
    text: |-
      Deze wet kan worden aangehaald als Successiewet, met vermelding van het jaar, waarin zij in het *Staatsblad* wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel83
  - number: '84.1'
    text: |-
      Wij behouden Ons voor de nummering van de artikelen van deze wet en de aanduiding van de onderdelen van die
      artikelen opnieuw vast te stellen, zulks met inachtneming van de bestaande volgorde, alsmede de aanhaling in deze
      wet van artikelen en onderdelen van artikelen daarmede in overeenstemming te brengen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel84
  - number: '84.2'
    text: De tekst van deze wet, zoals die luidt na toepassing van het vorige lid, wordt in het *Staatsblad* geplaatst.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel84
