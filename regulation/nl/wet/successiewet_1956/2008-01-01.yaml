preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is gebleken de wettelijke regeling betreffende de heffing
    van de rechten van successie, van overgang en van schenking, welke thans voorkomt in de wet van 13 Mei 1859,
    Staatsblad no. 36 (Successiewet), zoals die wet nader is gewijzigd en aangevuld, aan een technische herziening te
    onderwerpen en in verband daarmede de geldende wet door een andere te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Krachtens deze wet worden de volgende belastingen geheven:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel1
  - number: 1.1.1°
    text: |-
      recht van successie van de waarde van al wat krachtens erfrecht wordt verkregen door het overlijden van iemand, die
      ten tijde van dat overlijden binnen het Rijk woonde;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel1
  - number: 1.1.2°
    text: |-
      recht van overgang van de waarde van het in [artikel 5, tweede lid][ref1], nader omschrevene, verkregen krachtens
      schenking, of krachtens erfrecht door het overlijden, van iemand, die ten tijde van die schenking of van dat
      overlijden niet binnen het Rijk woonde;


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel5
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '5'
        hoofdstuk: I
  - number: 1.1.3°
    text: |-
      recht van schenking van de waarde van al wat door schenking wordt verkregen van iemand, die ten tijde van die
      schenking binnen het Rijk woonde.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel1
  - number: '1.2'
    text: |-
      Onder verkrijging krachtens erfrecht wordt voor de toepassing van deze wet mede verstaan de verkrijging
      van vergunningen en aanspraken bij of na het overlijden van de erflater indien die verkrijging rechtstreeks
      verband houdt met de omstandigheid dat de erflater die of dergelijke vergunningen en aanspraken bezat,
      alsmede de verkrijging ingevolge een overeenkomst met betrekking tot rentevergoeding als bedoeld in
      [artikel 13, vierde lid, van Boek 4 van het Burgerlijk Wetboek][ref1] indien een dergelijke rentevergoeding
      binnen de met inachtneming van [artikel 45][ref2] vastgestelde aangiftetermijn wordt overeengekomen. Hetgeen
      wordt verkregen krachtens de uitoefening van een wilsrecht als bedoeld in de [artikelen 19][ref3], [20][ref4],
      [21][ref5]en [22 van Boek 4 van het Burgerlijk Wetboek][ref6], wordt voor de toepassing van deze wet niet
      aangemerkt als een verkrijging krachtens erfrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0002761#Artikel21
      [ref6]: https://wetten.overheid.nl/BWBR0002761#Artikel22
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel1
    references:
      - id: ref1
