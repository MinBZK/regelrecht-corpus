        artikel: '22'
  - number: '1.3'
    text: |-
      Onder schenking wordt voor de toepassing van deze wet verstaan de gift, bedoeld in
      [artikel 186, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref1], voor zover [artikel 13][ref2]
      niet van toepassing is, en voorts de voldoening aan een natuurlijke verbintenis als bedoeld in
      [artikel 3 van Boek 6 van het Burgerlijk Wetboek][ref3]. Onder schenking wordt niet begrepen de
      bevoordeling als gevolg van verwerping door een erfgenaam of legataris, noch de bevoordeling als gevolg
      van het afzien door de echtgenoot van een wettelijke verdeling van de nalatenschap op de voet van
      [artikel 18 van Boek 4 van het Burgerlijk Wetboek][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel186
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel18
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '186'
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '13'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0002761
        artikel: '18'
  - number: '1.4'
    text: |-
      Indien de waarde van het in [artikel 5, tweede lid][ref1], omschrevene, 90% of meer uitmaakt van hetgeen krachtens
      deze wet zou worden belast met het recht van successie in het geval de erflater binnen het Rijk zou hebben
      gewoond, wordt op gezamenlijk verzoek van alle verkrijgers uit die nalatenschap de erflater ten tijde van het
      overlijden geacht binnen het Rijk te hebben gewoond. Indien de waarde van het in [artikel 5, tweede lid][ref2],
      omschrevene, 90% of meer uitmaakt van hetgeen krachtens deze wet zou worden belast met het recht van schenking
      in het geval de schenker binnen het Rijk zou hebben gewoond, wordt op verzoek van de verkrijger de schenker ten
      tijde van de schenking geacht binnen het Rijk te hebben gewoond. Bij de toepassing van de tweede volzin zijn de
      [artikelen 27][ref3] en [28][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0002226#Artikel28
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '5'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002226
        artikel: '27'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002226
        artikel: '28'
        hoofdstuk: III
  - number: '1.5'
    text: |-
      Indien ten gevolge van uiterste wilsbeschikkingen die inhoudelijk overeenkomen met het bepaalde in
      [afdeling 1 van titel 3 van Boek 4 van het Burgerlijk Wetboek][ref1] geldvorderingen of wilsrechten opkomen,
      worden die voor de toepassing van deze wet op dezelfde wijze behandeld als de geldvorderingen en wilsrechten,
      bedoeld in [artikel 13, derde lid][ref2], onderscheidenlijk de [artikelen 19][ref3], [20][ref4], [21][ref5] en
      [22 van Boek 4 van het Burgerlijk Wetboek][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0002761#Artikel21
      [ref6]: https://wetten.overheid.nl/BWBR0002761#Artikel22
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002761
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0002761
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0002761
        artikel: '21'
      - id: ref6
        bwb_id: BWBR0002761
        artikel: '22'
  - number: '2.1'
    text: |-
      De buiten het Rijk verblijf houdende Nederlander die in dienstbetrekking staat tot een Nederlandse
      publiekrechtelijke rechtspersoon, alsmede zijn niet duurzaam gescheiden van hem levende echtgenoot en de eigen
      kinderen en stiefkinderen die jonger dan 27 jaar zijn en in belangrijke mate door hem worden onderhouden in de
      zin van [artikel 1.5 van de Wet inkomstenbelasting 2001][ref1], worden geacht binnen het Rijk te wonen. De vorige
      volzin blijft buiten toepassing ten aanzien van de aldaar bedoelde Nederlander, echtgenoot en kinderen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 2.1.a
    text: indien die Nederlander buiten het Rijk werkzaam is in het land waar hij is aangeworven, tenzij hij militair is;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel2
  - number: 2.1.b
    text: |-
      indien die Nederlander militair is en bij of krachtens algemene maatregel van bestuur is bepaald, dat hij geacht
      wordt blijvend buiten het Rijk werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel2
  - number: '2.2'
    text: |-
      In geval van schenking door een rechtspersoon wordt de plaats, waar de schenker is gevestigd, als zijn woonplaats
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel2
  - number: '3.1'
    text: |-
      Een Nederlander, die binnen het Rijk heeft gewoond en binnen tien jaren, nadat hij het Rijk metterwoon heeft
      verlaten, is overleden of een schenking heeft gedaan, wordt geacht ten tijde van zijn overlijden of van het doen
      van de schenking binnen het Rijk te hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onverminderd het in het eerste lid bepaalde wordt ieder, die binnen het Rijk heeft gewoond en binnen een jaar,
      nadat hij het Rijk metterwoon heeft verlaten, een schenking heeft gedaan, geacht ten tijde van het doen van de
      schenking binnen het Rijk te hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel3
  - number: '4.1'
    text: |-
      De verklaring van vermoedelijk overlijden wordt, voor de toepassing van deze wet, met werkelijk overlijden in alle
      opzichten gelijk gesteld, behoudens vermindering van de dientengevolge opgelegde belastingaanslagen in de gevallen
      bij de [artikelen 422][ref1] en [423 van Boek 1 van het Burgerlijk Wetboek][ref2] voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel422
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel423
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '422'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '423'
  - number: '4.2'
    text: De dagtekening van de verklaring wordt als de dag van het overlijden beschouwd.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het recht van successie wordt geheven van hetgeen ieder verkrijgt, eventueel na aftrek van zijn aandeel in de
      volgens deze wet voor aftrek in aanmerking komende schulden, legaten en lasten.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
  - number: '5.2'
    text: 'Het recht van overgang wordt geheven van de waarde van:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
  - number: 5.2.1°
    text: de binnenlandse bezittingen na aftrek van binnenlandse schulden;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
  - number: 5.2.2°
    text: |-
      andere dan de onder 1° bedoelde bezittingen, dan wel laatstbedoelde bezittingen zonder aftrek van sommige van
      de onder 1° bedoelde schulden, indien en voor zover Wij bij algemene maatregel van bestuur vaststellen dat in
      de Staat, waarin de erflater of schenker ten tijde van het overlijden of van de schenking woonplaats had, hetzij
      zodanige andere bezittingen, nagelaten of geschonken door niet in die Staat wonenden, middellijk of onmiddellijk
      onderworpen zijn aan een belasting, die gelijksoortig is aan het recht van overgang, dan wel voor de regeling
      van die gelijksoortige belasting dergelijke schulden niet mogen worden afgetrokken. Wij behouden Ons voor nadere
      regelen te geven aangaande de heffing van de ten gevolge van deze bepaling verschuldigde belasting.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
  - number: '5.3'
    text: 'Binnenlandse bezittingen zijn:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
  - number: 5.3.a
    text: |-
      bezittingen die behoren tot een Nederlandse onderneming, zijnde een onderneming die, of het gedeelte van een
      onderneming dat wordt gedreven met behulp van een in Nederland aanwezige vaste inrichting of van een vaste
      vertegenwoordiger in Nederland;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
  - number: 5.3.b
    text: 'niet tot een Nederlandse onderneming behorende:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
  - number: 5.3.b.1°
    text: |-
      in Nederland gelegen onroerende zaken of rechten waaraan deze zijn onderworpen, alsmede economische eigendom als
      bedoeld in [artikel 2, tweede lid, van de Wet op belastingen van rechtsverkeer][ref1] van in Nederland gelegen
      onroerende zaken of rechten waaraan deze zijn onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
  - number: 5.3.b.2°
    text: |-
      rechten op aandelen in de winst van een onderneming waarvan de leiding in Nederland is gevestigd, voorzover zij
      niet voortspruiten uit effectenbezit of uit dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
  - number: '5.4'
    text: 'Binnenlandse schulden zijn:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
  - number: 5.4.a
    text: tot een Nederlandse onderneming behorende schulden;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
  - number: 5.4.b
    text: |-
      schulden, verzekerd door hypotheek op een in Nederland gelegen onroerende zaak of een recht waaraan deze is
      onderworpen, voorzover deze schulden zijn aangegaan ter financiering van de verwerving, de verbetering of het
      onderhoud van deze onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
  - number: '5.5'
    text: |-
      Met onroerende zaken als bedoeld in het derde lid worden gelijkgesteld fictieve onroerende zaken als bedoeld
      in [artikel 4 van de Wet op belastingen van rechtsverkeer][ref1]. Fictieve onroerende zaken worden voor de
      toepassing van dit artikel in aanmerking genomen voor de waarde die is bepaald met overeenkomstige toepassing
      van [artikel 10 van de Wet op belastingen van rechtsverkeer][ref2]. Bij de berekening van de in de tweede volzin
      bedoelde waarde is [artikel 5, vierde lid, onderdeel b][ref3], van overeenkomstige toepassing op schulden van het
      in [artikel 4, eerste lid, Wet op belastingen van rechtsverkeer][ref4] bedoelde lichaam die betrekking hebben op de
      tot zijn vermogen behorende onroerende zaken die op grond van dit lid in aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002740#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002740
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002226
        artikel: '5'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0002740
        artikel: '4'
  - number: '5.6'
    text: |-
      Indien de economische eigendom, bedoeld in
      [artikel 2, tweede lid, van de Wet op belastingen van rechtsverkeer][ref1], van een in Nederland gelegen onroerende
      zaak of een recht waaraan deze is onderworpen berust bij een ander dan de erflater dan wel schenker van die
      onroerende zaak of dat recht, wordt de waarde bedoeld in het tweede lid van die zaak of dat recht bepaald met
      inachtneming van die omstandigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
  - number: '5.7'
    text: |-
      Het recht van schenking wordt geheven van hetgeen de begiftigde verkrijgt, eventueel na aftrek van aan de schenking
      verbonden lasten en verplichtingen, waardoor hetzij de schenker, hetzij een derde wordt gebaat.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel5
  - number: '6'
    text: |-
      Al wat een in gemeenschap gehuwde, tengevolge van de door de erfgenamen van zijn echtgenoot gedane afstand van de
      gemeenschap, geniet, wordt hij, voor de toepassing van deze wet, geacht krachtens erfrecht door het overlijden van
      zijn echtgenoot te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel6
  - number: '7'
    text: |-
      Hetgeen aan de langstlevende echtgenoot, krachtens een bij huwelijksvoorwaarden gemaakt en van het overlijden van
      de eerststervende afhankelijk beding, bij dat overlijden meer toekomt dan de helft der gemeenschap of, in geval
      van een verrekenbeding of deelgenootschap, meer toekomt dan volgens de wettelijke regeling het geval zou zijn,
      wordt, voor de toepassing van deze wet, geacht krachtens erfrecht door het overlijden van de eerststervende te
      zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel7
  - number: '8.1'
    text: |-
      Goederen, niet zijnde registergoederen, welke - of waarvan de daarop betrekking hebbende bewijsstukken - bij
      het overlijden onder de overledene berustten of voor hem door anderen werden bewaard of bezeten, worden, voor de
      toepassing van deze wet, geacht krachtens erfrecht door het overlijden te zijn verkregen door hem, aan wie die
      goederen of die bewijsstukken moeten worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien en voor zover de goederen reeds vóór het overlijden aan anderen toebehoorden, kan op de in het vorige lid
      bedoelde verkrijging de verplichting tot afgifte in mindering worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel8
  - number: '8.3'
    text: 'De in de voorgaande leden vervatte bepalingen zijn niet toepasselijk voor goederen of bewijsstukken:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel8
  - number: 8.3.1°
    text: |-
      welke de overledene, tengevolge van de uitoefening van een beroep of bedrijf, onder zich had voor iemand, niet
      behorende tot zijn bloed- of aanverwanten tot de vierde graad ingesloten of hun echtgenoten;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel8
  - number: 8.3.2°
    text: |-
      welke de overledene onder zich had als openbaar ambtenaar, als ouder uitoefenende het ouderlijk gezag, als voogd,
      als curator, als executeur of door de rechter benoemde vereffenaar van een nalatenschap of als bewindvoerder in
      de gevallen waarin deze als zodanig volgens een uitdrukkelijke wetsbepaling is aangesteld of bij verdeling van een
      gemeenschap is benoemd;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel8
  - number: 8.3.3°
    text: |-
      welke bij het overlijden verblijven aan deelgenoten, ingevolge een overeenkomst tussen de overledene en die
      deelgenoten gesloten;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel8
  - number: 8.3.4°
    text: |-
      welke toebehoren aan de echtgenoot van de overledene of verkrijger als bedoeld in [artikel 24, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel24
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '24'
        hoofdstuk: III
  - number: '8.4'
    text: |-
      De bepalingen van dit artikel zijn mede toepasselijk op de daarin bedoelde goederen of bewijsstukken, berustende
      onder of bewaard of bezeten voor de in algehele gemeenschap van goederen gehuwde echtgenoot van de overledene.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel8
  - number: '9.1'
    text: |-
      Wat is schuldig erkend of kwijtgescholden onder voorwaarde van overleving van hem, aan wie is schuldig erkend of
      kwijtgescholden en wat is schuldig erkend bij uiterste wil wordt, voor de toepassing van deze wet, geacht krachtens
      erfrecht door het overlijden te zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het in het vorige lid bepaalde is, voor zoveel het bij uiterste wil schuldig erkende betreft, niet toepasselijk,
      indien de schuld reeds tijdens het leven van de erflater bestond en rechtens afdwingbaar was.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel9
  - number: '9.3'
    text: |-
      De overdrachtsbelasting - voor zover deze niet heeft geleid tot toepassing van
      [artikel 13 van de Wet op belastingen van rechtsverkeer][ref1] - en de rechten van schenking en van overgang,
      betaald ter zake van de waarde welke op grond van dit artikel voor de heffing van het recht van successie of van
      overgang in aanmerking komt, strekken in mindering van het ten gevolge van dit artikel verschuldigde recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel13
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '13'
  - number: '9.4'
    text: |-
      Het in dit artikel bepaalde is niet toepasselijk op overeenkomsten, als bedoeld zijn in
      [artikel 11, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel11
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '11'
        hoofdstuk: I
  - number: '10.1'
    text: |-
      Al wat iemand ten koste van erflaters vermogen heeft verkregen in verband met een rechtshandeling, waarbij de
      overledene partij was, wordt, indien na te melden omstandigheden aanwezig zijn, voor de regeling van de rechten van
      successie en van overgang, geacht krachtens erfrecht door het overlijden te zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel10
  - number: '10.2'
    text: |-
      Het in het vorige lid bepaalde is toepasselijk, indien de overledene in verband met die rechtshandeling tot zijn
      overlijden of een daarmede verband houdend tijdstip het genot heeft gehad van een vruchtgebruik of een periodieke
      uitkering en een vruchtgebruik of een periodieke uitkering ten laste van de in het eerste lid bedoelde verkrijger
      is gekomen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel10
  - number: '10.3'
    text: |-
      Van de te dezer zake aan te geven waarde kan, voor de regeling van het recht van successie, worden
      afgetrokken wat bij de rechtshandeling door de overledene werd bedongen, vermeerderd met interest naar het in
      [artikel 21, achtste lid][ref1], bedoelde percentage van de dag van betaling van het bedongene tot het overlijden.
      Voor vruchtgebruik wordt, voor zover dat middellijk of onmiddellijk door de erflater is genoten, geen aftrek
      toegelaten en de aftrek van aldus genoten periodieke uitkeringen wordt beperkt tot de waarde, welke de verkrijger
      ter zake heeft opgeofferd. Een eventuele negatieve waarde van de verkrijging wordt buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel21
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '21'
        hoofdstuk: II
  - number: '10.4'
    text: |-
      De overdrachtsbelasting - voor zover deze niet heeft geleid tot toepassing van
      [artikel 13 van de Wet op belastingen van rechtsverkeer][ref1] - en de rechten van schenking en van overgang,
      betaald ter zake van de waarde welke op grond van dit artikel voor de heffing van het recht van successie of van
      overgang in aanmerking komt, strekken in mindering van het ten gevolge van dit artikel verschuldigde recht.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel13
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '13'
  - number: '10.5'
    text: 'De bepalingen van dit artikel zijn niet toepasselijk:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel10
  - number: 10.5.1°
    text: |-
      indien de verkrijger niet is de echtgenoot van de erflater, noch behoort tot diens bloed- of aanverwanten tot en
      met de vierde graad of hun echtgenoten, noch een verkrijger als bedoeld in [artikel 24, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel24
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '24'
        hoofdstuk: III
  - number: 10.5.2°
    text: indien het genot voor de erflater meer dan 180 dagen vóór zijn overlijden is geëindigd;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel10
  - number: 10.5.3°
    text: indien de verkrijger vóór de erflater is overleden.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel10
  - number: '11.1'
    text: |-
      Indien het aandeel van een erflater in goederen, tengevolge van een overeenkomst, bij zijn overlijden hetzij
      verblijft of kan worden toegedeeld aan, hetzij kan worden overgenomen door de deelgenoten of één of meer van hen,
      wordt het verbleven, toegedeelde of overgenomen aandeel, voor de toepassing van deze wet, geacht krachtens erfrecht
      door het overlijden te zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel11
  - number: '11.2'
    text: |-
      Het in het vorige lid bepaalde is van overeenkomstige toepassing op goederen, waaromtrent een overeenkomst is
      gesloten krachtens welke die goederen bij overlijden van de rechthebbende zullen toebehoren aan of kunnen worden
      overgenomen door de overige contractanten of één of meer van hen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel11
  - number: '11.3'
    text: |-
      Van de waarde van het aandeel of van het gehele goed kan, voor de regeling van het recht van successie, worden
      afgetrokken de waarde van hetgeen door de verkrijger voor zijn verkrijging werkelijk is opgeofferd. Een eventuele
      negatieve waarde van de verkrijging wordt buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel11
  - number: '11.4'
    text: |-
      De overdrachtsbelasting, betaald ter zake van de waarde welke op grond van dit artikel voor de heffing van het
      recht van successie of van overgang in aanmerking komt, strekt in mindering van het ten gevolge van dit artikel
      verschuldigde recht.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel11
  - number: '11.5'
    text: 'De bepalingen van dit artikel zijn niet toepasselijk:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel11
  - number: 11.5.1°
    text: |-
      ten aanzien van bedingen, als bedoeld zijn in [artikel 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel7
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '7'
        hoofdstuk: I
  - number: 11.5.2°
    text: |-
      indien de verkrijger niet is de echtgenoot van de erflater, noch behoort tot diens bloed- of aanverwanten tot en
      met de vierde graad of hun echtgenoten, noch een verkrijger als bedoeld in [artikel 24, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel24
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '24'
        hoofdstuk: III
  - number: '12.1'
    text: |-
      Al wat binnen 180 dagen aan het overlijden voorafgegaan is geschonken door een erflater, die ten tijde van dat
      overlijden binnen het Rijk woonde, wordt, voor de regeling van het recht van successie, geacht krachtens erfrecht
      door het overlijden te zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel12
  - number: '12.2'
    text: |-
      [Artikel 10, vierde lid][ref1], en [artikel 10, vijfde lid, 3°][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel10
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '10'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '10'
        hoofdstuk: I
  - number: '12.3'
    text: 'Het in het eerste lid bepaalde is niet toepasselijk op schenkingen:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel12
  - number: 12.3.1°
    text: |-
      bedoeld in [artikel 33, 1°, 2°, 3°, 5°, tweede alinea, 8°, 9°, 11° en 12°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel33
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '33'
        hoofdstuk: III
  - number: 12.3.2°
    text: |-
      waarvan het schenkingsrecht is kwijtgescholden op grond van [artikel 67][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel67
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '67'
        hoofdstuk: XI
  - number: '13'
    text: |-
      Al wat tengevolge van of na het overlijden van een erflater wordt verkregen krachtens een overeenkomst van
      levensverzekering - ongevallenverzekering daaronder begrepen - of krachtens een beding ten behoeve van een derde,
      wordt, voor de toepassing van deze wet, geacht door de bevoordeelde krachtens erfrecht door het overlijden te zijn
      verkregen, tenzij voor de verkrijging niets aan het vermogen van de erflater is onttrokken. Ingeval het verkregene
      op grond van deze bepaling geacht wordt krachtens erfrecht te zijn verkregen van meer dan één erflater, vindt de
      bepaling slechts toepassing met betrekking tot de nalatenschap van de erflater die het laatst is overleden.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel13
  - number: 13a.1
    text: |-
      Indien aandelen in of winstbewijzen van een vennootschap welker kapitaal geheel of ten dele in aandelen is verdeeld
      in waarde zijn gestegen door het overlijden van de erflater en deze aandelen of winstbewijzen worden gehouden door
      een ander dan de erflater, worden deze geacht door de houder krachtens erfrecht te zijn verkregen, waarbij deze
      aandelen of winstbewijzen voor het bedrag van de bedoelde waardestijging in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel13a
  - number: 13a.2
    text: 'Het eerste lid vindt slechts toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel13a
  - number: 13a.2.a
    text: |-
      de aandelen of winstbewijzen behoren tot een aanmerkelijk belang in de zin van [afdeling 4.3 van de Wet
      inkomstenbelasting 2001](onbekend), en
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel13a
  - number: 13a.2.b
    text: |-
      de houder van de aandelen of winstbewijzen de echtgenoot van de erflater is of behoort tot diens bloed- of
      aanverwanten tot en met de vierde graad of hun echtgenoten, dan wel een verkrijger is als bedoeld in artikel 24,
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel13a
  - number: 13a.3
    text: |-
      Bij het bepalen van de in het eerste lid bedoelde waardestijging blijven buiten aanmerking verplichtingen die in
      verband met het overlijden van de erflater ontstaan, voorzover deze middellijk of onmiddellijk een waardedrukkend
      effect hebben op de waarde van de aandelen of winstbewijzen, behoudens voorzover deze verplichtingen leiden
      tot verkrijgingen die ten gevolge van het overlijden van de erflater op grond van deze wet in de heffing worden
      betrokken of zijn vrijgesteld.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel13a
  - number: 13a.4
    text: |-
      Indien een verplichting die ingevolge het derde lid buiten aanmerking blijft, aanleiding geeft tot inkomsten die
      bij een in het eerste lid bedoelde houder op grond van de [Wet inkomstenbelasting 2001](onbekend) in de heffing
      worden betrokken, wordt de door die houder daarover verschuldigde inkomstenbelasting in mindering gebracht op de
      bij die houder in aanmerking te nemen waardestijging.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel13a
  - number: 13a.5
    text: |-
      Voor de toepassing van dit artikel zijn de [artikelen 4.3 tot en met 4.5a van de Wet inkomstenbelasting 2001]
      (onbekend) van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel13a
  - number: '14'
    text: |-
      Opzegging van een beperkt recht wordt voor de toepassing van deze wet gelijkgesteld met verkrijging van dat recht
      door degene, ten behoeve van wie de opzegging heeft plaatsgehad.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel14
  - number: '15.1'
    text: |-
      Voor de regeling van het recht van overgang worden bezittingen als bedoeld in [artikel 5, tweede lid][ref1], welke
      door de overledene binnen het jaar voorafgaand aan zijn overlijden onder bezwarende titel zijn vervreemd, geacht
      krachtens erfrecht te zijn verkregen door degene die die bezittingen hetzij vóór, hetzij binnen een jaar na dat
      overlijden, onder bezwarende titel heeft verkregen, mits de verkrijger uit andere hoofde reeds krachtens erfrecht
      verkrijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel5
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '5'
        hoofdstuk: I
  - number: '15.2'
    text: |-
      Schulden, als bedoeld zijn in [artikel 5, tweede lid][ref1], ontstaan binnen een jaar voorafgaand aan het
      overlijden of de schenking, worden, voor de regeling van het recht van overgang, niet in aftrek toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel5
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '5'
        hoofdstuk: I
  - number: '15.3'
    text: |-
      De in de vorige leden vervatte bepalingen zijn niet toepasselijk, indien en voor zover bij de in het eerste lid
      bedoelde overdracht of als gevolg van het ontstaan van de in het tweede lid bedoelde schulden door de erflater of
      schenker bezittingen in de zin van [artikel 5, tweede lid][ref1], zijn of worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel5
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '5'
        hoofdstuk: I
  - number: '15.4'
    text: |-
      Een verkrijging als bedoeld in het eerste lid wordt bij een in dat lid bedoelde verkrijger in aanmerking genomen
      tot ten hoogste de waarde van hetgeen die verkrijger krachtens erfrecht door het overlijden van de erflater
      heeft verkregen, waarbij voor het bepalen van de laatstbedoelde waarde bezittingen en schulden als bedoeld in
      [artikel 5, tweede lid][ref1], buiten beschouwing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel5
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '5'
        hoofdstuk: I
  - number: '15.5'
    text: |-
      De overdrachtsbelasting strekt in mindering van het ten gevolge van het eerste lid verschuldigde recht van
      overgang.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel15
  - number: '16'
    text: |-
      De goederen, door de erflater bij uiterste wil bestemd tot vermogen van een stichting welke overeenkomstig
      [artikel 135, tweede en derde lid, van Boek 4 van het Burgerlijk Wetboek][ref1] na het overlijden van de erflater
      wordt opgericht, worden beschouwd als door de stichting krachtens erfrecht te zijn verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel135
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '135'
  - number: '17.1'
    text: |-
      De goederen, op andere wijze dan bij uiterste wil bestemd om daarmede een stichting in het leven te roepen, worden,
      voor de toepassing van deze wet, beschouwd als door de stichting bij schenking te zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel17
  - number: '17.2'
    text: |-
      Indien de stichting door meer dan één persoon in het leven wordt geroepen, worden, voor de regeling van het recht
      van schenking, de oprichters als één en dezelfde persoon aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel17
  - number: '18.1'
    text: |-
      Onder vruchtgebruik worden, voor de toepassing van deze wet, mede verstaan vruchtgenot, gebruik en bewoning,
      vruchten en inkomsten, jaarlijkse opbrengst en soortgelijke uitkeringen uit daartoe aangewezen goederen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel18
  - number: '18.2'
    text: |-
      Onder periodieke uitkering wordt, voor de toepassing van deze wet, behalve de uitkering in geld, mede verstaan elke
      andere, voortdurende, of op vastgestelde tijdstippen terugkerende, prestatie.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel18
  - number: '19.1'
    text: 'Voor de toepassing van deze wet worden gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel19
  - number: 19.1.a
    text: |-
      aanverwantschap met bloedverwantschap, doch na de ontbinding van het huwelijk dat de aanverwantschap deed ontstaan,
      alleen indien het door de dood is ontbonden;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel19
  - number: 19.1.b
    text: pleegkinderen met kinderen die in familierechtelijke betrekking tot de pleegouder staan;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel19
  - number: 19.1.c
    text: |-
      kinderen over wie overeenkomstig [artikel 253][ref1] een ander dan de ouder gezamenlijk met de ouder het ouderlijk
      gezag uitoefent of heeft uitgeoefend met kinderen die in familierechtelijke betrekking tot die ander staan;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253t
  - number: 19.1.d
    text: |-
      kinderen over wie overeenkomstig [artikel 282 van Boek 1 van het Burgerlijk Wetboek][ref1] de voogdij door twee
      personen gezamenlijk wordt uitgeoefend of is uitgeoefend met kinderen die tot die personen in familierechtelijke
      betrekking staan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel282
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '282'
  - number: '19.2'
    text: |-
      Als pleegkinderen worden aangemerkt zij, die vóór het tijdstip waarop zij de leeftijd van 21 jaar hebben bereikt
      dan wel het tijdstip waarop zij vóór die leeftijd in het huwelijk zijn getreden, gedurende ten minste vijf jaren
      uitsluitend door de pleegouder - dan wel uitsluitend door hem en zijn echtgenoot tezamen - als een eigen kind zijn
      onderhouden en opgevoed.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel19
  - number: '20.1'
    text: |-
      Voor de regeling van het recht van successie kunnen van de nalatenschap als lasten slechts worden afgetrokken de
      kosten van lijkbezorging voor zover zij niet bovenmatig zijn.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
  - number: '20.2'
    text: |-
      Onder de kosten van lijkbezorging kunnen worden begrepen de sommen, besproken of uitgekeerd voor de uitvaart van
      de erflater en de te zijnen behoeve te houden kerkelijke diensten dan wel godsdienstige of levensbeschouwelijke
      plechtigheden, sedert de dag van zijn overlijden tot en met het eerste jaargetijde, zulks geëvenredigd aan de stand
      en het vermogen van de overledene, met inachtneming van het plaatselijk gebruik en de bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
  - number: '20.3'
    text: |-
      De schulden ten laste van de erflater kunnen slechts worden afgetrokken voor zover zij rechtens afdwingbaar zijn en
      alsdan behoudens het navolgende:
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
  - number: 20.3.a
    text: |-
      lopende interessen en andere periodieke verplichtingen, alsmede zakelijke belastingen, dijk- en polderlasten,
      molen- en sluisgelden en soortgelijke omslagen zijn slechts aftrekbaar tot en met de dag van het overlijden;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
  - number: 20.3.b
    text: belastingschulden kunnen niet worden afgetrokken, voor zover daarvoor ontheffing kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
  - number: '20.4'
    text: |-
      Rechtsvorderingen tot nakoming van schulden, ten aanzien waarvan ten tijde van het overlijden de verjaringstermijn
      is verstreken, worden vermoed te zijn verjaard.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
  - number: '20.5'
    text: |-
      Op de verkrijging wordt in mindering gebracht de inkomstenbelasting welke de verkrijger verschuldigd kan worden ter
      zake van:
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
  - number: 20.5.a
    text: |-
      in het verkregen vermogen van een onderneming begrepen reserves in de zin van de
      [Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 20.5.b
    text: |-
      termijnen van verkregen, niet tot het vermogen van een onderneming behorende rechten die ingevolge de
      [Wet inkomstenbelasting 2001][ref1] belastbare periodieke uitkeringen en verstrekkingen opleveren (stamrechten);


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 20.5.c
    text: |-
      verkregen aandelen, winstbewijzen, bewijzen van deelgerechtigdheid en koopopties als bedoeld in
      [artikel 4.4 van de Wet inkomstenbelasting 2001][ref1] die ingevolge die wet tot een aanmerkelijk belang behoren.
      [Artikel 4.5a van de Wet inkomstenbelasting 2001][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '20.6'
    text: 'De in het vijfde lid bedoelde belasting wordt gesteld op:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
  - number: 20.6.a
    text: 30% van het bedrag van de reserves, voorzover het de oudedagsreserve betreft;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
  - number: 20.6.b
    text: 20% van het bedrag van de overige reserves;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
  - number: 20.6.c
    text: 30% van de waarde van de stamrechten;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
  - number: 20.6.d
    text: |-
      6,25% van de waarde van de aandelen, winstbewijzen, bewijzen van deelgerechtigdheid en koopopties, voorzover deze
      de verkrijgingsprijs daarvan in de zin van de [Wet inkomstenbelasting 2001][ref1] overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '20.7'
    text: 'Voor de toepassing van dit artikel:'
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
  - number: 20.7.a
    text: |-
      wordt met de houder van de in het vijfde lid, onderdeel c, genoemde vermogensbestanddelen gelijkgesteld degene die
      slechts is gerechtigd tot voordelen uit die vermogensbestanddelen en wordt zijn gerechtigdheid aangemerkt als een
      dergelijk vermogensbestanddeel;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
  - number: 20.7.b
    text: |-
      is [artikel 4.5a van de Wet inkomstenbelasting 2001][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '21.1'
    text: |-
      Het verkregene wordt in aanmerking genomen naar de waarde welke daaraan op het tijdstip van de verkrijging in het
      economische verkeer kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel21
  - number: '21.2'
    text: |-
      Goederen, verkregen onder de ontbindende voorwaarde van overlijden waarbij zich een opschortende voorwaarde ten
      gunste van een verwachter aansluit, worden in aanmerking genomen naar de waarde van die goederen als waren zij
      onvoorwaardelijk verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel21
  - number: '21.3'
    text: |-
      Voor de effecten die zijn opgenomen in een prijscourant, aangewezen krachtens
      [artikel 5.21 van de Wet inkomstenbelasting 2001][ref1], wordt de waarde in het economische verkeer gesteld op de
      slotnotering die is vermeld in de prijscourant die betrekking heeft op de laatste beursdag voorafgaande aan de dag
      van de verkrijging.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '21.4'
    text: |-
      De waarde van in de verkrijging begrepen ondernemingsvermogen wordt in aanmerking genomen voor de waarde in het
      economische verkeer van dat vermogen met inbegrip van de voor overdracht vatbare goodwill, maar, in zoverre in
      afwijking van het vijfde lid, ten minste op de liquidatiewaarde.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel21
  - number: '21.5'
    text: |-
      Wat in het economische verkeer als een eenheid pleegt te worden beschouwd, wordt in aanmerking genomen met
      inachtneming van die omstandigheid.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel21
  - number: '21.6'
    text: |-
      Wij behouden Ons voor bij algemene maatregel van bestuur regelen te geven nopens de in aanmerking te nemen waarde
      van rechten op en verplichtingen tot periodieke uitkeringen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel21
  - number: '21.7'
    text: |-
      Bij verkrijging door de vervulling van een opschortende voorwaarde welke zich aansluit bij de ontbindende
      voorwaarde van het overlijden van een eerdere verkrijger, is voor de bepaling van de aard en waarde van het
      verkregene beslissend het tijdstip waarop het genot voor de verwachter aanvangt.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel21
  - number: '21.8'
    text: |-
      De waarde van een vruchtgebruik wordt gesteld op het overeenkomstig het zesde lid tot kapitaal gebrachte bedrag van
      de jaarlijkse inkomsten. Wij behouden Ons voor bij algemene maatregel van bestuur de jaarlijkse inkomsten vast te
      stellen op een daarbij te bepalen percentage van de overeenkomstig de vorige leden te bepalen waarde van hetgeen
      aan het vruchtgebruik is onderworpen, naar het tijdstip waarop het genot aanvangt.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel21
  - number: '21.9'
    text: |-
      De waarde van hetgeen onder de last van vruchtgebruik of van periodieke uitkering wordt verkregen, wordt gesteld
      op het verschil tussen de waarden van de onbezwaarde goederen en het vruchtgebruik of de periodieke uitkering,
      beide waarden vastgesteld overeenkomstig de vorige leden. Met elkander opvolgende vruchtgebruiken en periodieke
      uitkeringen wordt bij de waardebepaling van de daarmede bezwaarde goederen terstond rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel21
  - number: '21.10'
    text: |-
      Een geldvordering als bedoeld in [artikel 13, derde lid, van Boek 4 van het Burgerlijk Wetboek][ref1] alsmede,
      indien de nalatenschap is verdeeld overeenkomstig [artikel 13 van Boek 4 van het Burgerlijk Wetboek][ref2],
      een geldvordering als bedoeld in [artikel 80, eerste lid, van Boek 4 van het Burgerlijk Wetboek][ref3],
      wordt in aanmerking genomen als een renteloze vordering, indien daarop het rentepercentage,
      berekend overeenkomstig het bepaalde in [artikel 13, vierde lid][ref4], onderscheidenlijk
      [artikel 84 van Boek 4 van het Burgerlijk Wetboek][ref5], van toepassing is. De eerste volzin is van
      overeenkomstige toepassing op de schulden die corresponderen met de aldaar bedoelde geldvorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel80
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0002761#Artikel84
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '80'
      - id: ref4
        bwb_id: BWBR0002761
        artikel: '13'
      - id: ref5
        bwb_id: BWBR0002761
        artikel: '84'
  - number: '21.11'
    text: |-
      Ingeval het verkregene een onroerende zaak betreft waarin de erflater tot het tijdstip van zijn overlijden heeft
      gewoond onderscheidenlijk de schenker woont, dan wel de verkrijger ten tijde van de verkrijging woont, wordt bij
      de bepaling van de waarde in het economische verkeer van het verkregene geen rekening gehouden met die bewoning.
      In geval van de verkrijging van een vruchtgebruik van een onroerende zaak dan wel van de verkrijging van een
      onroerende zaak onder de last van een vruchtgebruik en het betreft een onroerende zaak die tot woning dient zonder
      dat daar een huurcontract aan ten grondslag ligt, wordt bij de bepaling van de waarde in het economische verkeer
      van het verkregene geen rekening gehouden met het feit dat die onroerende zaak wordt bewoond. De eerste en tweede
      volzin zijn van overeenkomstige toepassing bij rechten waaraan een onroerende zaak is onderworpen.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel21
  - number: '23'
    text: |-
      De waarde van een verkrijging krachtens levensverzekering of derdenbeding wordt voor de berekening van het recht
      verminderd met de bedragen:
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel23
  - number: 23.1°
    text: |-
      welke voor de verkrijging door de daarop rechthebbende werkelijk zijn opgeofferd; renteverlies blijft in deze
      buiten aanmerking;
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel23
  - number: 23.2°
    text: |-
      waarover door de verkrijger recht van schenking of van successie is verschuldigd geworden wegens verkrijging van de
      rechten, welke aan de polis worden ontleend, tijdens het leven van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0002226/2008-01-01#Artikel23
  - number: '24.1'
    text: |-
      Behoudens de toepassing van [artikel 35][ref1] wordt de belasting geheven naar het volgende tarief, uitgedrukt in
      euro’s. In dit tarief is telkens vermeld onder letter *a:* de belasting bij een belaste verkrijging als daarnaast
      is vermeld in kolom (1); onder letter *b:* het heffingspercentage over het gedeelte der belaste verkrijging,
      gelegen tussen de daarnaast in de kolommen (1) en (2) vermelde bedragen.












