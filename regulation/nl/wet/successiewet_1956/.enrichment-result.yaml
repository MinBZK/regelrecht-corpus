open_terms:
  - article: 33
    id: vrijstelling_kind_studie
    delegation_type: MINISTERIELE_REGELING
    note: >
      The studie exemption amount (€69.009) is stated in the law text, but eligibility
      conditions are delegated to ministerial regulation. The open_term covers the
      delegated conditions; the amount itself could alternatively be a constant definition.

reverse_validation_assumptions:
  - article: 1a
    description: >
      Time period validation (lid 2) not modelled: 6 months for erfbelasting, 2 years
      for schenkbelasting. Parameters are boolean flags pre-computed for the relevant
      period by the caller. The period selection logic requires knowing which tax is
      at issue and the reference date.
  - article: 12
    description: >
      Residency condition omitted: "erflater die ten tijde van dat overlijden in Nederland
      woonde" is not a parameter. Callers are expected to pre-check Dutch residency via
      Arts. 2-3 before invoking this article's machine_readable.
  - article: 20
    description: >
      Aanmerkelijk belang: the waarde parameter is assumed to represent the excess over
      verkrijgingsprijs (art. 20 lid 6d: "voorzover deze de verkrijgingsprijs... overtreft").
      The parameter description should make this explicit.
  - article: 24
    description: >
      Implicit constraint: is_afstammeling_tweede_of_verdere_graad=true is legally
      impossible when verkrijgerskategorie="II". The 1.80 multiplier from footnote 1
      applies only to column I (category I) verkrijgers. The code does not guard against
      this invalid parameter combination, relying on callers to pass consistent inputs.

