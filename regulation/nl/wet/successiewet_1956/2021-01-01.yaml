---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: successiewet_1956
regulatory_layer: WET
publication_date: '2024-12-23'
valid_from: '2021-01-01'
bwb_id: BWBR0002226
url: https://wetten.overheid.nl/BWBR0002226/2021-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is gebleken de wettelijke regeling betreffende de heffing
    van de rechten van successie, van overgang en van schenking, welke thans voorkomt in de wet van 13 Mei 1859,
    Staatsblad no. 36 (Successiewet), zoals die wet nader is gewijzigd en aangevuld, aan een technische herziening te
    onderwerpen en in verband daarmede de geldende wet door een andere te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Krachtens deze wet worden de volgende belastingen geheven:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1
  - number: 1.1.1°
    text: |-
      erfbelasting over de waarde van al wat krachtens erfrecht wordt verkregen door het overlijden van iemand die ten
      tijde van het overlijden in Nederland woonde;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1
  - number: 1.1.2°
    text: |-
      schenkbelasting over de waarde van al wat krachtens schenking wordt verkregen van iemand die ten tijde van de
      schenking in Nederland woonde.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1
  - number: '1.2'
    text: |-
      Onder verkrijging krachtens erfrecht wordt voor de toepassing van deze wet mede verstaan de verkrijging van
      vergunningen en aanspraken bij of na het overlijden van de erflater indien die verkrijging rechtstreeks verband
      houdt met de omstandigheid dat de erflater die of dergelijke vergunningen en aanspraken bezat.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1
  - number: '1.3'
    text: 'De verkrijging ten gevolge van de vaststelling van een rentevergoeding op grond van:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1
  - number: 1.3.a
    text: een uiterste wilsbeschikking ten aanzien van vorderingen en schulden die zijn ontstaan krachtens erfrecht, of
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1
  - number: 1.3.b
    text: |-
      een overeenkomst als bedoeld in [artikel 13, vierde lid, van Boek 4 van het Burgerlijk Wetboek][ref1], wordt voor
      de toepassing van deze wet geacht alleen krachtens erfrecht door het overlijden te zijn verkregen indien deze
      binnen de met inachtneming van [artikel 45][ref2] vastgestelde aangiftetermijn is vastgesteld of overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel45
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '45'
        hoofdstuk: IV
  - number: '1.4'
    text: |-
      Indien de rentevergoeding, bedoeld in het derde lid, wordt vastgesteld of overeengekomen na de in dat lid bedoelde
      termijn, wordt het daaruit voortvloeiende voordeel geacht krachtens schenking te zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1
  - number: '1.5'
    text: |-
      De verkrijging krachtens de uitoefening van een wilsrecht als bedoeld in de [artikelen 19][ref1], [20][ref2],
      [21][ref3] en [22 van Boek 4 van het Burgerlijk Wetboek][ref4] wordt voor de toepassing van deze wet niet
      aangemerkt als een verkrijging krachtens erfrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel22
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0002761
        artikel: '22'
  - number: '1.6'
    text: |-
      Indien ten gevolge van uiterste wilsbeschikkingen die inhoudelijk overeenkomen met het bepaalde in
      [afdeling 1 van titel 3 van Boek 4 van het Burgerlijk Wetboek][ref1] wilsrechten opkomen, worden die voor de
      toepassing van deze wet op dezelfde wijze behandeld als wilsrechten als bedoeld in de [artikelen 19][ref2],
      [20][ref3], [21][ref4] en [22 van Boek 4 van het Burgerlijk Wetboek][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0002761#Artikel22
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002761
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0002761
        artikel: '21'
      - id: ref5
        bwb_id: BWBR0002761
        artikel: '22'
  - number: '1.7'
    text: |-
      Onder schenking wordt voor de toepassing van deze wet verstaan de gift, bedoeld in
      [artikel 186, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref1], voor zover [artikel 13][ref2]
      niet van toepassing is, en voorts de voldoening aan een natuurlijke verbintenis als bedoeld in
      [artikel 3 van Boek 6 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel186
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '186'
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '13'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '3'
  - number: '1.8'
    text: |-
      Onder schenking wordt niet begrepen de bevoordeling als gevolg van verwerping door een erfgenaam of legataris, noch
      de bevoordeling als gevolg van het afzien door de echtgenoot van een wettelijke verdeling van de nalatenschap op de
      voet van [artikel 18 van Boek 4 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel18
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '18'
  - number: '1.9'
    text: |-
      Een gift onder opschortende voorwaarde wordt voor de toepassing van deze wet geacht tot stand te komen op het
      moment dat de voorwaarde wordt vervuld.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1
  - number: 1a.1
    text: |-
      In afwijking van [artikel 5a, eerste lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref1] worden
      voor de toepassing van deze wet en de daarop berustende bepalingen twee ongehuwde personen slechts als partner
      aangemerkt indien zij gedurende de in het tweede lid genoemde periode:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5a
  - number: 1a.1.a
    text: beiden meerderjarig zijn;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1a
  - number: 1a.1.b
    text: |-
      op hetzelfde woonadres staan ingeschreven in de basisregistratie personen of een daarmee naar aard en strekking
      overeenkomende registratie buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1a
  - number: 1a.1.c
    text: ingevolge een notarieel samenlevingscontract een wederzijdse zorgverplichting hebben;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1a
  - number: 1a.1.d
    text: geen bloedverwanten in de rechte lijn zijn, en
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1a
  - number: 1a.1.e
    text: niet met een ander aan de in de onderdelen a tot en met d genoemde voorwaarden voldoen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1a
  - number: 1a.2
    text: 'De in de aanhef van het eerste lid bedoelde periode is:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1a
  - number: 1a.2.a
    text: |-
      voor de bepalingen die zien op de heffing van erfbelasting: zes maanden voorafgaand aan het overlijden dat
      aanleiding is tot de heffing van erfbelasting;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1a
  - number: 1a.2.b
    text: 'voor de bepalingen die zien op de heffing van schenkbelasting: twee jaar voorafgaand aan de schenking.'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1a
  - number: 1a.3
    text: |-
      De in het eerste lid, onderdeel c, gestelde voorwaarde geldt niet voor personen die tot het tijdstip van het
      overlijden of de schenking gedurende een onafgebroken periode van ten minste vijf jaren staan ingeschreven
      op hetzelfde woonadres in de basisregistratie personen of een daarmee naar aard en strekking overeenkomende
      registratie buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1a
  - number: 1a.4
    text: |-
      [Artikel 5a, zevende lid, van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing op
      de personen, bedoeld in het eerste en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5a
  - number: 1a.5
    text: |-
      [Artikel 5a, tweede lid, vierde lid en vijfde lid, derde volzin, van de Algemene wet inzake rijksbelastingen][ref1]
      blijft buiten toepassing voor deze wet en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5a
  - number: 1b
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen worden de landen van het Koninkrijk der
      Nederlanden aangemerkt als afzonderlijke mogendheden.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel1b
  - number: '2.1'
    text: |-
      Een Nederlander die in dienstbetrekking staat tot de Staat der Nederlanden, wordt steeds geacht in Nederland te
      wonen, indien hij is uitgezonden:
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel2
  - number: 2.1.a
    text: |-
      als lid van een diplomatieke, permanente of consulaire vertegenwoordiging van het Koninkrijk der Nederlanden in het
      buitenland, of
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel2
  - number: 2.1.b
    text: |-
      om in het kader van een verdrag waarbij de Staat der Nederlanden partij is, in een andere mogendheid werkzaamheden
      te verrichten.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel2
  - number: '2.2'
    text: |-
      Indien een Nederlander op grond van het eerste lid geacht wordt in Nederland te wonen, worden de partner en
      de kinderen die jonger zijn dan 27 jaar en die in belangrijke mate door hem worden onderhouden in de zin van
      [artikel 1.5 van de Wet inkomstenbelasting 2001][ref1], tevens geacht in Nederland te wonen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
  - number: '2.3'
    text: |-
      In geval van schenking door een rechtspersoon wordt de plaats, waar de schenker is gevestigd, als zijn woonplaats
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel2
  - number: '3.1'
    text: |-
      Een Nederlander die in Nederland heeft gewoond en binnen tien jaren nadat hij Nederland metterwoon heeft verlaten,
      is overleden of een schenking heeft gedaan, wordt geacht ten tijde van zijn overlijden of van het doen van de
      schenking in Nederland te hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onverminderd het in het eerste lid bepaalde wordt ieder die in Nederland heeft gewoond en binnen een jaar nadat hij
      Nederland metterwoon heeft verlaten een schenking heeft gedaan, geacht ten tijde van het doen van de schenking in
      Nederland te hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel3
  - number: '4.1'
    text: |-
      De verklaring van vermoedelijk overlijden wordt, voor de toepassing van deze wet, met werkelijk overlijden in alle
      opzichten gelijk gesteld, behoudens vermindering van de dientengevolge opgelegde belastingaanslagen in de gevallen
      bij de [artikelen 422][ref1] en [423 van Boek 1 van het Burgerlijk Wetboek][ref2] voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel422
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel423
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '422'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '423'
  - number: '4.2'
    text: De dagtekening van de verklaring wordt als de dag van het overlijden beschouwd.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel4
  - number: '5.1'
    text: |-
      De erfbelasting wordt geheven van hetgeen ieder verkrijgt, eventueel na aftrek van zijn aandeel in de volgens deze
      wet voor aftrek in aanmerking komende schulden, legaten en lasten.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel5
  - number: '5.2'
    text: |-
      De schenkbelasting wordt geheven van hetgeen de begiftigde verkrijgt, eventueel na aftrek van aan de schenking
      verbonden lasten en verplichtingen, waardoor hetzij de schenker, hetzij een derde wordt gebaat.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel5
  - number: '6'
    text: |-
      Al wat een in gemeenschap gehuwde, tengevolge van de door de erfgenamen van zijn echtgenoot gedane afstand van de
      gemeenschap, geniet, wordt hij, voor de toepassing van deze wet, geacht krachtens erfrecht door het overlijden van
      zijn echtgenoot te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel6
  - number: '7.1'
    text: |-
      De waarde van hetgeen de verkrijger voor zijn verkrijging heeft opgeofferd of van hetgeen door de erflater ten
      laste van de verkrijger werd bedongen, strekt in mindering van de waarde welke op grond van de [artikelen 8][ref1],
      [10][ref2], [11][ref3] en [13, tweede lid][ref4], in aanmerking wordt genomen voor de erfbelasting, maar niet
      verder dan tot nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0002226#Artikel13
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '8'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '10'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002226
        artikel: '11'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0002226
        artikel: '13'
        hoofdstuk: I
  - number: '7.2'
    text: |-
      De overdrachtsbelasting, voor zover deze niet heeft geleid tot toepassing van
      [artikel 13 van de Wet op belastingen van rechtsverkeer][ref1], en de schenkbelasting, betaald ter zake van de in
      aanmerking genomen waarde, bedoeld in het eerste lid, strekken in mindering van de belasting die verschuldigd is
      ten gevolge van de in het eerste lid bedoelde artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel13
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '13'
  - number: '7.3'
    text: |-
      De bedragen die ten gevolge van het eerste en tweede lid in mindering strekken, worden vermeerderd met een
      enkelvoudige rente naar het in [artikel 21, veertiende lid][ref1], bedoelde percentage van de dag van betaling
      van die bedragen tot en met de dag van het overlijden ten gevolge waarvan de verkrijging op grond van de
      [artikelen 8][ref2], [10][ref3], [11][ref4] en [13, tweede lid][ref5], geacht wordt plaats te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002226#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0002226#Artikel13
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '21'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '8'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002226
        artikel: '10'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0002226
        artikel: '11'
        hoofdstuk: I
      - id: ref5
        bwb_id: BWBR0002226
        artikel: '13'
        hoofdstuk: I
  - number: '8.1'
    text: |-
      Goederen, niet zijnde registergoederen, welke - of waarvan de daarop betrekking hebbende bewijsstukken - bij
      het overlijden onder de overledene berustten of voor hem door anderen werden bewaard of bezeten, worden, voor de
      toepassing van deze wet, geacht krachtens erfrecht door het overlijden te zijn verkregen door hem, aan wie die
      goederen of die bewijsstukken moeten worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien en voor zover de goederen reeds vóór het overlijden aan anderen toebehoorden, kan op de in het vorige lid
      bedoelde verkrijging de verplichting tot afgifte in mindering worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel8
  - number: '8.3'
    text: |-
      Wat is schuldig erkend bij uiterste wil, wordt voor de toepassing van deze wet geacht krachtens erfrecht door het
      overlijden te zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel8
  - number: '8.4'
    text: |-
      De in de voorgaande leden vervatte bepalingen zijn niet toepasselijk voor goederen, bewijsstukken of
      schuldigerkenningen:
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel8
  - number: 8.4.1°
    text: |-
      welke de overledene, tengevolge van de uitoefening van een beroep of bedrijf, onder zich had voor iemand, niet
      behorende tot zijn bloed- of aanverwanten tot de vierde graad ingesloten of hun partners;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel8
  - number: 8.4.2°
    text: |-
      welke de overledene onder zich had als openbaar ambtenaar, als ouder uitoefenende het ouderlijk gezag, als voogd,
      als curator, als executeur of door de rechter benoemde vereffenaar van een nalatenschap of als bewindvoerder in
      de gevallen waarin deze als zodanig volgens een uitdrukkelijke wetsbepaling is aangesteld of bij verdeling van een
      gemeenschap is benoemd;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel8
  - number: 8.4.3°
    text: |-
      welke bij het overlijden verblijven aan deelgenoten, ingevolge een overeenkomst tussen de overledene en die
      deelgenoten gesloten;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel8
  - number: 8.4.4°
    text: welke toebehoren aan de partner;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel8
  - number: 8.4.5°
    text: welke reeds tijdens het leven van de erflater bestonden en rechtens afdwingbaar waren.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel8
  - number: '8.5'
    text: |-
      De bepalingen van dit artikel zijn mede toepasselijk op de daarin bedoelde goederen, bewijsstukken of
      schuldigerkenningen, berustende onder of bewaard of bezeten voor de in algehele gemeenschap van goederen gehuwde
      echtgenoot van de overledene.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel8
  - number: '9.1'
    text: |-
      Geldvorderingen die zijn ontstaan als gevolg van een verkrijging krachtens erfrecht worden ongeacht de hoogte van
      de rente die zij op grond van een uiterste wilsbeschikking of op grond van een rentevaststelling als bedoeld in
      [artikel 1, derde lid][ref1], dragen, in aanmerking genomen voor ten hoogste de nominale waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel1
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '1'
        hoofdstuk: I
  - number: '9.2'
    text: |-
      Ingeval een geldvordering als bedoeld in het eerste lid ten gevolge van of na het overlijden van de schuldenaar
      opeisbaar wordt, onderscheidenlijk tijdens het leven van de schuldenaar opeisbaar wordt of wordt afgelost, en
      deze vordering op grond van een uiterste wilsbeschikking of op grond van een rentevaststelling als bedoeld in
      [artikel 1, derde lid][ref1], een rentebestanddeel bevat dat hoger is dan indien de vordering een samengestelde
      rente had gedragen naar het percentage, bedoeld in [artikel 21, veertiende lid][ref2], wordt het deel van
      de rente dat uitgaat boven de rente die bij het hiervoor bedoelde percentage zou zijn opgebouwd, zonodig in
      afwijking van artikel 1, derde lid, voor de toepassing van deze wet geacht door de schuldeiser krachtens erfrecht,
      onderscheidenlijk krachtens schenking te zijn verkregen van de schuldenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel21
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '21'
        hoofdstuk: II
  - number: '9.3'
    text: |-
      In afwijking van het tweede lid wordt het deel van de rente, bedoeld in dat lid, dat wordt
      betaald door de uitoefening van een wilsrecht als bedoeld in de [artikelen 19][ref1] of
      [21 van Boek 4 van het Burgerlijk Wetboek][ref2], bij het overlijden van de langstlevende ouder of stiefouder,
      bedoeld in die artikelen, geacht krachtens erfrecht van die ouder of stiefouder te zijn verkregen. Op het moment
      dat de ouder of stiefouder afziet van het vruchtgebruik, bedoeld in de artikelen 19 of 21 van Boek 4 van het
      Burgerlijk Wetboek, dan wel daarvan afstand doet, is het bepaalde in de eerste volzin niet of niet langer van
      toepassing en wordt de in de eerste volzin bedoelde rente geacht krachtens schenking van de langstlevende ouder of
      stiefouder te zijn verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel21
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '21'
  - number: '10.1'
    text: |-
      Al wat iemand ten koste van het vermogen van de erflater heeft verkregen in verband met een rechtshandeling of
      een samenstel van rechtshandelingen waarbij de erflater of diens echtgenoot partij was, en alle goederen waarop
      de erflater ten laste van zijn vermogen een vruchtgebruik heeft verworven, worden geacht krachtens erfrecht door
      overlijden te zijn verkregen, indien:
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
  - number: 10.1.a
    text: |-
      de erflater in verband daarmee tot aan zijn overlijden of een daarmee verband houdend tijdstip het genot heeft
      gehad van een vruchtgebruik of een periodieke uitkering, en
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
  - number: 10.1.b
    text: het vruchtgebruik onderscheidenlijk de periodieke uitkering ten laste is gekomen van de verkrijger.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
  - number: '10.2'
    text: |-
      In afwijking van [artikel 7, eerste lid][ref1], wordt op de waarde van hetgeen op grond van het eerste lid voor de
      erfbelasting in aanmerking wordt genomen, geen aftrek toegelaten voor vruchtgebruik voor zover dat middellijk of
      onmiddellijk door de erflater is genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel7
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '7'
        hoofdstuk: I
  - number: '10.3'
    text: |-
      Voor de toepassing van dit artikel wordt de erflater geacht een genot van een vruchtgebruik te hebben gehad van
      de in het eerste lid bedoelde goederen indien hij tegenover het genot dat hij van de goederen heeft aan degene
      ten laste van wie dat genot komt niet jaarlijks daadwerkelijk een bedrag betaalt dat ten minste gelijk is aan het
      percentage, bedoeld in [artikel 21, veertiende lid][ref1], van de waarde van de goederen in onbezwaarde staat.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel21
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '21'
        hoofdstuk: II
  - number: '10.4'
    text: 'Dit artikel is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
  - number: 10.4.a
    text: |-
      de verkrijger niet is de partner van de erflater, noch behoort tot diens bloed- of aanverwanten tot en met de
      vierde graad of hun partners, of
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
  - number: 10.4.b
    text: |-
      het genot van het vruchtgebruik of de periodieke uitkering voor de erflater meer dan 180 dagen vóór zijn overlijden
      is geëindigd.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
  - number: '10.5'
    text: |-
      Dit artikel is niet van toepassing voor zover het genot, bedoeld in het eerste lid, betrekking heeft op een
      onderbedelingsvordering die is ontstaan als gevolg van een verdeling van de volle eigendom van goederen en voor
      zover het nominale bedrag van de met de onderbedelingsvordering corresponderende overbedelingsschuld niet groter is
      dan de waarde van de overbedeling.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
  - number: '10.6'
    text: |-
      Dit artikel is niet van toepassing indien het vruchtgebruik, bedoeld in het eerste lid, bestaat uit een
      vruchtgebruik van een geldsom dat is ontstaan doordat bij een legaat tegen inbreng van die geldsom, de inbreng
      op basis van een testamentaire bepaling schuldig is gebleven. De eerste volzin is niet van toepassing voor
      zover de schuldig gebleven inbreng direct of indirect verband houdt met de verkrijging door de erflater van een
      vruchtgebruik dat ten gevolge van het overlijden van de erflater teniet gaat.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
  - number: '10.7'
    text: 'Voor de toepassing van dit artikel wordt niet als een rechtshandeling in de zin van dit artikel aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
  - number: 10.7.a
    text: |-
      de overdracht van de blote eigendom als gevolg van de uitoefening van een wilsrecht als bedoeld in de
      [artikelen 19][ref1] of [21 van Boek 4 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel21
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '21'
  - number: 10.7.b
    text: |-
      een schuldigerkenning op grond van een wilsrecht opgenomen in [Boek 4 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002761
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002761
  - number: '10.8'
    text: |-
      Indien bij iemand ten aanzien van wie dit artikel zou zijn toegepast indien hij ten tijde van het overlijden van
      de erflater nog in leven zou zijn geweest, [artikel 7][ref1] van toepassing zou zijn geweest, vindt ten aanzien van
      zijn rechtsopvolgers krachtens erfrecht laatstgenoemd artikel toepassing naar rato van hun verkrijging op grond van
      dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel7
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '7'
        hoofdstuk: I
  - number: '10.9'
    text: |-
      Het eerste lid is mede van toepassing indien tot het vermogen van de erflater een of meer als gevolg van een
      uiterste wil ontstane schulden behoren, voor zover de nominale waarde van die schuld, onderscheidenlijk die
      schulden, meer bedraagt dan de waarde van hetgeen die erflater krachtens erfrecht heeft verkregen van degene die de
      uiterste wil heeft opgemaakt. Voor de bepaling van de laatstbedoelde waarde worden de in de eerste volzin bedoelde
      schulden buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel10
  - number: '11.1'
    text: |-
      Indien het aandeel van een persoon in goederen ten gevolge van een vennootschapsovereenkomst bij zijn leven hetzij
      verblijft of kan worden toegedeeld aan, hetzij kan worden overgenomen door de deelgenoten of één of meer van hen,
      wordt het verbleven, toegedeelde of overgenomen aandeel voor de toepassing van deze wet geacht krachtens schenking
      te zijn verkregen. Het in de vorige volzin bepaalde is van overeenkomstige toepassing op goederen waaromtrent een
      vennootschapsovereenkomst is gesloten krachtens welke die goederen van de rechthebbende zullen toebehoren aan of
      kunnen worden overgenomen door de overige contractanten of één of meer van hen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel11
  - number: '11.2'
    text: |-
      Indien het aandeel van een erflater in goederen ten gevolge van een overeenkomst bij zijn overlijden hetzij
      verblijft of kan worden toegedeeld aan, hetzij kan worden overgenomen door de deelgenoten of één of meer van hen,
      wordt het verbleven, toegedeelde of overgenomen aandeel voor de toepassing van deze wet geacht krachtens erfrecht
      door het overlijden te zijn verkregen. Het in de vorige volzin bepaalde is van overeenkomstige toepassing op
      goederen waaromtrent een overeenkomst is gesloten krachtens welke die goederen bij overlijden van de rechthebbende
      zullen toebehoren aan of kunnen worden overgenomen door de overige contractanten of één of meer van hen, alsmede
      op goederen waaromtrent door de erflater een verplichting tot levering is aangegaan en de levering plaatsvindt bij
      overlijden of een daarmee verband houdend tijdstip.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel11
  - number: '11.3'
    text: |-
      Al wat is schuldig erkend of kwijtgescholden onder voorwaarde van overleving van degene aan wie is schuldig erkend
      of kwijtgescholden, wordt voor de toepassing van deze wet geacht krachtens erfrecht door het overlijden te zijn
      verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel11
  - number: '11.4'
    text: |-
      Hetgeen aan de langstlevende echtgenoot, krachtens een bij huwelijksvoorwaarden gemaakt en van het overlijden van
      de eerststervende afhankelijk beding, bij dat overlijden meer toekomt dan de helft der gemeenschap of, in geval
      van een verrekenbeding of deelgenootschap, meer toekomt dan volgens de wettelijke regeling het geval zou zijn,
      wordt voor de toepassing van deze wet geacht krachtens erfrecht door het overlijden van de eerststervende te zijn
      verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel11
  - number: '11.5'
    text: |-
      Het eerste en het tweede lid zijn uitsluitend van toepassing indien de verkrijger de partner is van de schenker of
      de erflater of behoort tot diens bloed- of aanverwanten tot en met de vierde graad of hun partners.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel11
  - number: '12.1'
    text: |-
      Al wat binnen 180 dagen aan het overlijden voorafgegaan is geschonken door een erflater, die ten tijde van dat
      overlijden in Nederland woonde, wordt, voor de regeling van de erfbelasting, geacht krachtens erfrecht door het
      overlijden te zijn verkregen. Al wat wordt verkregen krachtens een schenking die tot stand is gekomen na het
      overlijden van de schenker, wordt voor de toepassing van deze wet geacht krachtens erfrecht door het overlijden te
      zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel12
  - number: '12.2'
    text: |-
      [Artikel 7, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel7
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '7'
        hoofdstuk: I
  - number: '12.3'
    text: 'Het in het eerste lid, eerste volzin, bepaalde is niet toepasselijk op schenkingen:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel12
  - number: 12.3.1°
    text: |-
      als bedoeld in [artikel 33, onderdelen 1°, 2°, 3°, 8°, 9°, 11° en 12°][ref1] en, voor zover het een
      schenking betreft waarvoor de verhoogde vrijstelling geldt, 5° en 7°;


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel33
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '33'
        hoofdstuk: III
  - number: 12.3.2°
    text: |-
      waarvan de schenkbelasting is kwijtgescholden op grond van [artikel 67][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel67
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '67'
        hoofdstuk: XI
  - number: '13.1'
    text: |-
      Al wat ten gevolge van of na het overlijden van een erflater wordt verkregen krachtens een overeenkomst van
      levensverzekering, ongevallenverzekering daaronder begrepen, of krachtens een derdenbeding, wordt voor de
      toepassing van deze wet geacht krachtens erfrecht door het overlijden te zijn verkregen, voor zover de verkrijging
      kan worden toegerekend aan een onttrekking aan het vermogen van de erflater, behoudens voor zover bij de verkrijger
      de aan die onttrekking ontleende rechten reeds voor het overlijden van de erflater aan de heffing van schenk- of
      erfbelasting waren onderworpen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel13
  - number: '13.2'
    text: |-
      Indien de erflater bij een overeenkomst van levensverzekering verzekerde is en de erflater, diens partner of een
      van diens bloed- of aanverwanten tot en met de vierde graad of hun partners bij die overeenkomst als verzekeraar
      is opgetreden, wordt voor de toepassing van het eerste lid een verkrijging krachtens die overeenkomst van
      levensverzekering geacht volledig aan het vermogen van de erflater te zijn onttrokken.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel13
  - number: 13a.1
    text: |-
      Indien aandelen in of winstbewijzen van een vennootschap welker kapitaal geheel of ten dele in aandelen is verdeeld
      in waarde zijn gestegen door het overlijden van de erflater en deze aandelen of winstbewijzen worden gehouden door
      een ander dan de erflater, worden deze geacht door de houder krachtens erfrecht te zijn verkregen, waarbij deze
      aandelen of winstbewijzen voor het bedrag van de bedoelde waardestijging in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel13a
  - number: 13a.2
    text: 'Het eerste lid vindt slechts toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel13a
  - number: 13a.2.a
    text: |-
      de aandelen of winstbewijzen behoren tot een aanmerkelijk belang in de zin van
      [afdeling 4.3 van de Wet inkomstenbelasting 2001][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling4.3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '4.3'
  - number: 13a.2.b
    text: |-
      de houder van de aandelen of winstbewijzen de partner van de erflater is of behoort tot diens bloed- of
      aanverwanten tot en met de vierde graad of hun partners.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel13a
  - number: 13a.3
    text: |-
      Bij het bepalen van de in het eerste lid bedoelde waardestijging blijven buiten aanmerking verplichtingen die in
      verband met het overlijden van de erflater ontstaan, voorzover deze middellijk of onmiddellijk een waardedrukkend
      effect hebben op de waarde van de aandelen of winstbewijzen, behoudens voorzover deze verplichtingen leiden
      tot verkrijgingen die ten gevolge van het overlijden van de erflater op grond van deze wet in de heffing worden
      betrokken of zijn vrijgesteld.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel13a
  - number: 13a.4
    text: |-
      Indien een verplichting die ingevolge het derde lid buiten aanmerking blijft, aanleiding geeft tot inkomsten die
      bij een in het eerste lid bedoelde houder op grond van de [Wet inkomstenbelasting 2001][ref1] in de heffing worden
      betrokken, wordt de door die houder daarover verschuldigde inkomstenbelasting in mindering gebracht op de bij die
      houder in aanmerking te nemen waardestijging.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 13a.5
    text: |-
      Voor de toepassing van dit artikel zijn de [artikelen 4.3 tot en met 4.5a van de Wet inkomstenbelasting 2001][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '14'
    text: |-
      Opzegging van een beperkt recht wordt voor de toepassing van deze wet gelijkgesteld met verkrijging van dat recht
      door degene, ten behoeve van wie de opzegging heeft plaatsgehad.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel14
  - number: '15.1'
    text: |-
      Van een geldlening die geen rente draagt, of een rente draagt die lager is dan het percentage, bedoeld in
      [artikel 21, veertiende lid][ref1], en welke lening rechtens dan wel in feite direct opeisbaar is of dat op enig
      moment wordt, wordt de schuldeiser vanaf de dag waarop de lening opeisbaar wordt voor de toepassing van deze wet
      geacht van dag tot dag een vruchtgebruik aan de schuldenaar te hebben geschonken.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel21
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '21'
        hoofdstuk: II
  - number: '15.2'
    text: |-
      Het eerste lid is uitsluitend van toepassing op een geldlening die direct of indirect aan een natuurlijk persoon is
      verstrekt door een natuurlijk persoon die daarbij niet handelt in de uitoefening van zijn beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel15
  - number: '16.1'
    text: |-
      De bezittingen en de schulden van een afgezonderd particulier vermogen als bedoeld in
      [artikel 2.14a, tweede lid, van de Wet inkomstenbelasting 2001][ref1], die tot het overlijden van een erflater
      ingevolge dat artikel zijn toegerekend aan die erflater, en met ingang van zijn overlijden aan zijn erfgenamen,
      worden voor de toepassing van deze wet en de daarop berustende bepalingen geacht door die erfgenamen krachtens
      erfrecht te zijn verkregen en wel per erfgenaam voor het deel dat ingevolge dat artikel aan de erfgenaam wordt
      toegerekend. De eerste volzin is van overeenkomstige toepassing met betrekking tot bezittingen en schulden als
      bedoeld in artikel 2.14a, zevende lid, van de Wet inkomstenbelasting 2001 die zonder toepassing van dat lid tot
      het overlijden van de erflater zouden zijn toegerekend aan die erflater, en met ingang van zijn overlijden aan
      zijn erfgenamen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '16.2'
    text: |-
      Onder hetgeen krachtens erfrecht wordt verkregen, wordt voor de toepassing van deze wet en de daarop
      berustende bepalingen mede verstaan het ten gevolge van het overlijden van een erflater verkrijgen
      van een in rechte vorderbare aanspraak op een afgezonderd particulier vermogen als bedoeld in
      [artikel 2.14a van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '16.3'
    text: Bij ministeriële regeling kunnen regels worden gesteld ter zake van de in dit artikel bedoelde verkrijging.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel16
  - number: '17.1'
    text: |-
      Al wat wordt verkregen van een afgezonderd particulier vermogen als bedoeld in
      [artikel 2.14a, tweede lid, van de Wet inkomstenbelasting 2001][ref1], op andere wijze dan bedoeld in
      [artikel 16][ref2], wordt voor de toepassing van deze wet en de daarop berustende bepalingen, geacht door schenking
      te zijn verkregen van de persoon of personen waaraan de bezittingen en schulden van het afgezonderd particulier
      vermogen ingevolge artikel 2.14a van de Wet inkomstenbelasting 2001 worden toegerekend. De eerste volzin is van
      overeenkomstige toepassing met betrekking tot al wat wordt verkregen, op andere wijze dan bedoeld in artikel 16,
      ten laste van bezittingen als bedoeld in artikel 2.14a, zevende lid, van de Wet inkomstenbelasting 2001, met dien
      verstande dat in dat geval wordt geacht te zijn verkregen van de persoon of personen waaraan die bezittingen zonder
      toepassing van dat lid zouden zijn toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel16
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '16'
        hoofdstuk: I
  - number: '17.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld van ter zake van de in dit artikel bedoelde schenking.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel17
  - number: 17a
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt de afzondering van vermogen, bedoeld in
      [artikel 2.14a van de Wet inkomstenbelasting 2001][ref1], niet als verkrijging aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '18.1'
    text: |-
      Onder vruchtgebruik worden, voor de toepassing van deze wet, mede verstaan vruchtgenot, gebruik en bewoning,
      vruchten en inkomsten, jaarlijkse opbrengst en soortgelijke uitkeringen uit daartoe aangewezen goederen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel18
  - number: '18.2'
    text: |-
      Onder periodieke uitkering wordt, voor de toepassing van deze wet, behalve de uitkering in geld, mede verstaan elke
      andere, voortdurende, of op vastgestelde tijdstippen terugkerende, prestatie.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel18
  - number: '19.1'
    text: 'Voor de toepassing van deze wet worden gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel19
  - number: 19.1.a
    text: |-
      voor de bepaling van aanverwantschap, twee ongehuwde personen die ingevolge [artikel 1a][ref1] als elkaars partners
      worden aangemerkt, met gehuwden;


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 1a
        hoofdstuk: I
  - number: 19.1.b
    text: |-
      aanverwanten met bloedverwanten, met dien verstande dat deze gelijkstelling eindigt ingeval het partnerschap dat de
      aanverwantschap deed ontstaan anders dan door overlijden is geëindigd;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel19
  - number: 19.1.c
    text: pleegkinderen met kinderen die in familierechtelijke betrekking tot de pleegouder staan;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel19
  - number: 19.1.d
    text: |-
      kinderen over wie overeenkomstig [artikel 253t van Boek 1 van het Burgerlijk Wetboek][ref1] een ander dan de ouder
      gezamenlijk met de ouder het ouderlijk gezag uitoefent of heeft uitgeoefend met kinderen die in familierechtelijke
      betrekking tot die ander staan;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253t
  - number: 19.1.e
    text: |-
      kinderen over wie overeenkomstig [artikel 282][ref1] of [292 van Boek 1 van het Burgerlijk Wetboek][ref2] de
      voogdij door twee personen gezamenlijk wordt uitgeoefend of is uitgeoefend met kinderen die tot die personen in
      familierechtelijke betrekking staan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel282
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel292
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '282'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '292'
  - number: '19.2'
    text: |-
      Als pleegkinderen worden aangemerkt zij, die vóór het tijdstip waarop zij de leeftijd van 21 jaar hebben bereikt
      dan wel het tijdstip waarop zij vóór die leeftijd in het huwelijk zijn getreden, gedurende ten minste vijf jaren
      uitsluitend door de pleegouder - dan wel uitsluitend door hem en zijn echtgenoot tezamen - als een eigen kind zijn
      onderhouden en opgevoed.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel19
  - number: '20.1'
    text: |-
      Voor de regeling van de erfbelasting kunnen van de nalatenschap als lasten slechts worden afgetrokken de kosten van
      lijkbezorging voor zover zij niet bovenmatig zijn.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
  - number: '20.2'
    text: |-
      Onder de kosten van lijkbezorging kunnen worden begrepen de sommen, besproken of uitgekeerd voor de uitvaart van
      de erflater en de tot een jaar na het overlijden te zijnen behoeve te houden godsdienstige of levensbeschouwelijke
      plechtigheden.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
  - number: '20.3'
    text: |-
      De schulden ten laste van de erflater kunnen slechts worden afgetrokken voor zover zij rechtens afdwingbaar zijn en
      alsdan behoudens het navolgende:
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
  - number: 20.3.a
    text: |-
      lopende renten en andere periodieke verplichtingen, alsmede zakelijke belastingen, dijk- en polderlasten, molen- en
      sluisgelden en soortgelijke omslagen zijn slechts aftrekbaar tot en met de dag van het overlijden;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
  - number: 20.3.b
    text: belastingschulden kunnen niet worden afgetrokken, voor zover daarvoor ontheffing kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
  - number: '20.4'
    text: |-
      Rechtsvorderingen tot nakoming van schulden, ten aanzien waarvan ten tijde van het overlijden de verjaringstermijn
      is verstreken, worden vermoed te zijn verjaard.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
  - number: '20.5'
    text: |-
      Op de verkrijging wordt in mindering gebracht de inkomstenbelasting welke de verkrijger verschuldigd kan worden ter
      zake van:
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
  - number: 20.5.a
    text: |-
      in het verkregen vermogen van een onderneming of een werkzaamheid begrepen reserves in de zin van de
      [Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 20.5.b
    text: |-
      termijnen van verkregen, niet tot het vermogen van een onderneming behorende rechten die ingevolge de
      [Wet inkomstenbelasting 2001][ref1] belastbare periodieke uitkeringen en verstrekkingen opleveren (stamrechten);


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 20.5.c
    text: |-
      verkregen aandelen, winstbewijzen, bewijzen van deelgerechtigdheid en koopopties als bedoeld in
      [artikel 4.4 van de Wet inkomstenbelasting 2001][ref1] die ingevolge die wet tot een aanmerkelijk belang behoren.
      [Artikel 4.5a van de Wet inkomstenbelasting 2001][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '20.6'
    text: 'De in het vijfde lid bedoelde belasting wordt gesteld op:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
  - number: 20.6.a
    text: 30% van het bedrag van de reserves, voorzover het de oudedagsreserve betreft;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
  - number: 20.6.b
    text: 20% van het bedrag van de overige reserves;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
  - number: 20.6.c
    text: 30% van de waarde van de stamrechten;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
  - number: 20.6.d
    text: |-
      6,25% van de waarde van de aandelen, winstbewijzen, bewijzen van deelgerechtigdheid en koopopties, voorzover deze
      de verkrijgingsprijs daarvan in de zin van de [Wet inkomstenbelasting 2001][ref1] overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '20.7'
    text: 'Voor de toepassing van dit artikel:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
  - number: 20.7.a
    text: |-
      wordt met de houder van de in het vijfde lid, onderdeel c, genoemde vermogensbestanddelen gelijkgesteld degene die
      slechts is gerechtigd tot voordelen uit die vermogensbestanddelen en wordt zijn gerechtigdheid aangemerkt als een
      dergelijk vermogensbestanddeel;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
  - number: 20.7.b
    text: |-
      is [artikel 4.5a van de Wet inkomstenbelasting 2001][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '21.1'
    text: |-
      Het verkregene wordt in aanmerking genomen naar de waarde welke daaraan op het tijdstip van de verkrijging in het
      economische verkeer kan worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
  - number: '21.2'
    text: |-
      Goederen, verkregen onder de ontbindende voorwaarde van overlijden waarbij zich een opschortende voorwaarde ten
      gunste van een verwachter aansluit, worden in aanmerking genomen naar de waarde van die goederen als waren zij
      onvoorwaardelijk verkregen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
  - number: '21.3'
    text: |-
      Voor de effecten die zijn opgenomen in een prijscourant, aangewezen krachtens
      [artikel 5.21 van de Wet inkomstenbelasting 2001][ref1], wordt de waarde in het economische verkeer gesteld op de
      slotnotering die is vermeld in de prijscourant die betrekking heeft op de laatste beursdag voorafgaande aan de dag
      van de verkrijging.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '21.4'
    text: |-
      Bij verkrijging door de vervulling van een opschortende voorwaarde welke zich aansluit bij de ontbindende
      voorwaarde van het overlijden van een eerdere verkrijger, is voor de bepaling van de aard en waarde van het
      verkregene beslissend het tijdstip waarop het genot voor de verwachter aanvangt.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
  - number: '21.5'
    text: |-
      Onroerende zaken die in gebruik zijn als woning, worden in aanmerking genomen naar de volgens
      [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] voor die onroerende zaken vastgestelde waarde voor
      het kalenderjaar waarin de verkrijging plaatsvindt dan wel, ingeval de verkrijger daarvoor kiest, voor het op
      dat kalenderjaar volgende kalenderjaar. Indien de woning deel uitmaakt van een onroerende zaak als bedoeld in
      [artikel 16 van de Wet waardering onroerende zaken][ref2], wordt de waarde van de woning gesteld op het gedeelte
      van de waarde van de onroerende zaak dat kan worden toegerekend aan de woning.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
  - number: '21.6'
    text: |-
      Met betrekking tot een woning ter zake waarvan het vijfde lid geen toepassing kan vinden door het ontbreken
      van een op grond van [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] vastgestelde waarde,
      wordt de waarde van de woning bepaald met overeenkomstige toepassing van het bepaalde bij of krachtens de
      [artikelen 16 tot en met 18][ref2] en [20, tweede lid, van die wet][ref3] en van het vijfde lid, tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel20
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '20'
  - number: '21.7'
    text: |-
      Indien zich in het kalenderjaar waarin de verkrijging plaatsvindt, maar op of vóór het moment van de verkrijging,
      met betrekking tot een onroerende zaak als bedoeld in het vijfde of zesde lid een gebeurtenis voordoet als bedoeld
      in [artikel 18, derde lid, van de Wet waardering onroerende zaken][ref1], wordt, in afwijking van het vijfde
      en zesde lid, de waarde van de onroerende zaak bepaald met overeenkomstige toepassing van het bepaalde bij of
      krachtens de [artikelen 16 tot en met 18][ref2] en [20, tweede lid van die wet][ref3], naar de staat van die zaak
      op het moment van de verkrijging.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel20
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '20'
  - number: '21.8'
    text: |-
      Indien een woning geheel of gedeeltelijk wordt verhuurd en op deze verhuur
      [afdeling 5 van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref1] van toepassing is, of ingevolge
      een voor ten minste 12 jaren aangegane pachtovereenkomst wordt verpacht en op deze verpachting
      [titel 5 van Boek 7 van het Burgerlijk Wetboek][ref2] van toepassing is, wordt de waarde gesteld op een bij
      algemene maatregel van bestuur vast te stellen, van de huurprijs afhankelijk percentage van het waardegegeven,
      bedoeld in het vijfde of zesde lid. Een onroerende zaak als bedoeld in de eerste volzin wordt niet voor een lagere
      waarde in aanmerking genomen dan de waarde, bedoeld in het vijfde of zesde lid, indien deze wordt verkregen door
      een huurder, onderscheidenlijk een pachter, van die onroerende zaak of zijn partner.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
      [ref2]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
  - number: '21.9'
    text: |-
      De waarde van een recht van erfpacht op een onroerende zaak die als woning in gebruik is, wordt gesteld op de
      waarde van die onroerende zaak, berekend volgens het vijfde of zesde lid, verminderd met de overeenkomstig het
      veertiende lid bepaalde waarde van de canon.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
  - number: '21.10'
    text: |-
      In afwijking van het vijfde tot en met zevende lid wordt een woning in aanmerking genomen naar de waarde in het
      economische verkeer ingeval de waarde in het economische verkeer van de woning als gevolg van een persoonlijke
      verplichting tot betaling van servicekosten voor diensten die geen betrekking hebben op de woning zelf in
      belangrijke mate afwijkt van de waarde, bedoeld in het vijfde, zesde of zevende lid.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
  - number: '21.11'
    text: |-
      De waarde van hetgeen onder de last van een vruchtgebruik, een beperkt recht of van een periodieke uitkering wordt
      verkregen, wordt gesteld op de waarde in onbezwaarde staat, verminderd met de waarde van die last. Met elkaar
      opvolgende vruchtgebruiken, beperkte rechten en periodieke uitkeringen wordt bij de waardebepaling van de daarmee
      bezwaarde goederen terstond rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
  - number: '21.12'
    text: |-
      Wat in het economische verkeer als een eenheid pleegt te worden beschouwd, wordt in aanmerking genomen met
      inachtneming van die omstandigheid.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
  - number: '21.13'
    text: |-
      De waarde van een onderneming wordt bepaald alsof de onderneming wordt voortgezet (waarde going concern),
      maar ten minste op de liquidatiewaarde. De eerste volzin is van overeenkomstige toepassing met betrekking
      tot de waardering van vermogensbestanddelen die behoren tot een aanmerkelijk belang als bedoeld in
      [afdeling 4.3 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling4.3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '4.3'
  - number: '21.14'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld voor de bepaling van de waarde van een vruchtgebruik, van
      beperkte rechten en van rechten op en verplichtingen tot periodieke uitkeringen en voor het daarbij te gebruiken
      percentage.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
  - number: '21.15'
    text: |-
      Een geldvordering als bedoeld in [artikel 13, derde lid, van Boek 4 van het Burgerlijk Wetboek][ref1] alsmede,
      indien de nalatenschap is verdeeld overeenkomstig [artikel 13 van Boek 4 van het Burgerlijk Wetboek][ref2],
      een geldvordering als bedoeld in [artikel 80, eerste lid, van Boek 4 van het Burgerlijk Wetboek][ref3],
      wordt in aanmerking genomen als een renteloze vordering, indien daarop het rentepercentage,
      berekend overeenkomstig het bepaalde in [artikel 13, vierde lid][ref4], onderscheidenlijk
      [artikel 84 van Boek 4 van het Burgerlijk Wetboek][ref5], van toepassing is. De eerste volzin is van
      overeenkomstige toepassing op de schulden die corresponderen met de aldaar bedoelde geldvorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel80
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0002761#Artikel84
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '80'
      - id: ref4
        bwb_id: BWBR0002761
        artikel: '13'
      - id: ref5
        bwb_id: BWBR0002761
        artikel: '84'
  - number: '24.1'
    text: |-
      De belasting wordt geheven naar het volgende tarief. In dit tarief is in de derde en vierde kolom voor de daarin
      genoemde verkrijgers het heffingspercentage opgenomen over het gedeelte van de belaste verkrijging, gelegen tussen
      de daarnaast in de eerste en tweede kolom genoemde bedragen.








                    Gedeelte van de belaste verkrijging tussen


                    en


                    I. indien verkregen door partner of afstammelingen in de rechte lijn1)


                    II. in overige gevallen






                    € 0


                    € 128.751


                    10%


                    30%




                    € 128.751 en hoger



                    20%


                    40%




           1 Voor afstammelingen in de tweede of verdere graad bedraagt de belasting het ingevolge deze kolom
      verschuldigde, vermeerderd met 80% daarvan.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel24
  - number: '24.2'
    text: |-
      De overdrachtsbelasting, voor zover deze niet heeft geleid tot toepassing van
      [artikel 13 van de Wet op belastingen van rechtsverkeer][ref1], betaald over het bedrag waarover schenkbelasting
      verschuldigd is, strekt in mindering van de schenkbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel13
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '13'
  - number: '25'
    text: |-
      Verkrijgingen krachtens erfrecht door partners worden voor de berekening van de erfbelasting aangemerkt als
      verkrijging door één van de partners, bij verschil in graad door degene van hen, die de erflater het naast verwant
      is.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel25
  - number: '26.1'
    text: |-
      Partners worden voor de berekening van de schenkbelasting als één en dezelfde persoon aangemerkt. De
      schenkbelasting wordt alsdan berekend naar de naaste verwantschap tussen de schenker of diens partner en de
      begiftigde of diens partner.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel26
  - number: '26.2'
    text: |-
      Indien schenkingen worden gedaan binnen een jaar vóór het huwelijk van de schenkers of van de begiftigden, wordt
      het huwelijk geacht reeds ten tijde van die schenkingen te hebben bestaan.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel26
  - number: '26.3'
    text: Het eerste lid is niet van toepassing op schenkingen van een partner aan zijn partner.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel26
  - number: 26a
    text: |-
      Voor de berekening van de schenkbelasting wordt een verkrijging van een afgezonderd particulier
      vermogen als bedoeld in [artikel 17][ref1] geacht te zijn verkregen van de persoon of personen waarop
      [artikel 2.14a van de Wet inkomstenbelasting 2001][ref2] voor het desbetreffende afgezonderd particulier vermogen
      van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '17'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '27'
    text: |-
      De gedurende een kalenderjaar door dezelfde schenker aan dezelfde begiftigde gedane schenkingen worden aangemerkt
      als deel uitmakend van één schenking ten belope van het gezamenlijke bedrag.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel27
  - number: '28'
    text: |-
      Schenkingen, door ouders tezamen of afzonderlijk gedurende een kalenderjaar aan een kind gedaan, worden aangemerkt
      als één schenking ten belope van het gezamenlijk bedrag.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel28
  - number: '29.1'
    text: |-
      Indien onzekerheid bestaat omtrent de verwantschap of omtrent de persoon van de schenker of van de verkrijger,
      wordt de maximale belasting geheven, die verschuldigd zou kunnen zijn, behoudens vermindering van de aanslag, voor
      zover deze naderhand blijkt te hoog te zijn.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel29
  - number: '29.2'
    text: |-
      Bestaat de onzekerheid ten aanzien van de persoon van de schenker, dan wordt deze, behoudens tegenbewijs, geacht in
      Nederland te wonen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel29
  - number: '29.3'
    text: |-
      Met betrekking tot aanslagen die onder toepassing van dit artikel zijn vastgesteld, geldt de schenker,
      zolang er onzekerheid bestaat over de persoon van de verkrijger, als belanghebbende als bedoeld in
      [artikel 1:2 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '29.4'
    text: |-
      De bepalingen van dit artikel zijn mede toepasselijk, indien de naam of de woonplaats van de schenker of van de
      begiftigde desgevraagd niet wordt genoemd.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel29
  - number: '30.1'
    text: |-
      Het bedrag van de belastingen ondergaat ten gevolge van verwerping of van afstand van rechten geen vermindering. De
      eerste volzin is niet van toepassing indien op de voet van [artikel 18 van Boek 4 van het Burgerlijk Wetboek][ref1]
      wordt afgezien van een wettelijke verdeling van de nalatenschap overeenkomstig
      [artikel 13 van Boek 4 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '30.2'
    text: |-
      Bij verwerping door de erfgenamen van een overledene van hetgeen aan deze uit een vroeger opengevallen nalatenschap
      is opgekomen, wordt ten laste van hen, die ten gevolge van die verwerping verkrijgen, niet minder belasting
      geheven, dan in totaal verschuldigd zou zijn wegens de verkrijging door de overledene en wegens de overgang van
      deze op zijn erfgenamen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel30
  - number: '30.3'
    text: |-
      Indien de verwachters gedurende het leven van de bezwaarde afstand doen van hun recht of dat na zijn dood
      verwerpen of niet aanvaarden, wordt ten laste van hen, die het bezwaarde goed uit de nalatenschap van de bezwaarde
      verkrijgen, niet minder belasting geheven, dan zonder die afstand, verwerping of niet aanvaarding verschuldigd
      zou zijn.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel30
  - number: '31'
    text: |-
      De belasting, verschuldigd wegens de afstand van vermogen verkregen onder een in [artikel 21, tweede lid][ref1],
      bedoelde voorwaarde door de bezwaarde aan de echtgenoot of een of meer van de bloed- of aanverwanten tot en met
      de vierde graad van de verwachter of aan de echtgenoot van één van die verwanten, bedraagt niet minder dan de
      belasting, verschuldigd wegens de overgang van dat goed van de bezwaarde op de verwachter krachtens de vervulling
      van de voorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel21
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '21'
        hoofdstuk: II
  - number: '32.1'
    text: 'Van erfbelasting is vrijgesteld, hetgeen wordt verkregen:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: 32.1.1°
    text: door de Staat;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: 32.1.2°
    text: |-
      door een provincie, de openbare lichamen Bonaire, Sint Eustatius en Saba of een gemeente in Nederland, zonder
      bijzondere opdracht of met een opdracht, indien en voor zover deze opdracht aan de making niet het karakter
      ontneemt van te zijn geschied in het algemeen belang;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: 32.1.3°
    text: |-
      door een algemeen nut beogende instelling, voor zover aan de verkrijging niet een opdracht is verbonden, welke aan
      de verkrijging het karakter ontneemt van te zijn geschied in het algemeen belang;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: 32.1.4°
    text: 'door de hierna genoemde personen tot de daarachter vermelde bedragen:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: 32.1.4°.a
    text: 'partner: € 671.910;'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: 32.1.4°.b
    text: |-
      kinderen die grotendeels op kosten van de overledene werden onderhouden en die ten gevolge van ziekte of gebreken
      vermoedelijk in de eerstkomende drie jaren buiten staat zullen zijn om met arbeid die voor hun kracht berekend is,
      de helft te verdienen van hetgeen lichamelijk en geestelijk gezonde personen van gelijke leeftijd in staat zijn aan
      inkomen uit arbeid te verwerven: € 63.836;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: 32.1.4°.c
    text: 'kinderen voor wie de onder b bedoelde vrijstelling niet van toepassing is: € 21.282;'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: 32.1.4°.d
    text: 'kleinkinderen: € 21.282;'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: 32.1.4°.e
    text: 'ouders: € 50.397;'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: 32.1.4°.f
    text: 'overige verkrijgers: € 2.244;'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: 32.1.5°
    text: aan waarde van aanspraken ingevolge een pensioenregeling alsmede aan waarde van lijfrenten;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: 32.1.8°
    text: |-
      door een sociaal belang behartigende instelling, voor zover aan de verkrijging niet een opdracht is verbonden welke
      aan de verkrijging het karakter ontneemt van te zijn geschied in het sociaal belang;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: 32.1.9°
    text: |-
      door een steunstichting SBBI, voor zover aan de verkrijging niet een opdracht is verbonden welke aan de verkrijging
      het karakter ontneemt van te zijn bestemd voor de realisatie van de doelstelling van de steunstichting;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: 32.1.10°
    text: |-
      door een werknemer van de erflater of zijn partner of door een nabestaande van zodanige werknemer, voor zover het
      verkregene kan worden beschouwd als de voldoening aan een ter zake van de verrichte arbeid bestaande natuurlijke
      verbintenis als is bedoeld in [artikel 3 van Boek 6 van het Burgerlijk Wetboek][ref1]. Voor zover een verkrijging
      van een nabestaande van de werknemer aan periodieke uitkeringen ingevolge deze bepaling is vrijgesteld van
      erfbelasting, wordt zij, voor de toepassing van deze wet, beschouwd als een aan de werknemer toe te rekenen
      bevoordeling krachtens een ten behoeve van de verkrijger gemaakt beding;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '3'
  - number: 32.1.11°
    text: aan nog niet vorderbare termijnen van renten, van uitkeringen, van bezoldigingen en van andere inkomsten.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
  - number: '32.2'
    text: |-
      De waarde van aanspraken ingevolge een pensioenregeling – andere dan die ingevolge de [Algemene Ouderdomswet][ref1]
      en de [Algemene nabestaandenwet][ref2] –, van lijfrenten alsmede van aanspraken op periodieke uitkeringen bij
      overlijden welke door een partner ten gevolge van het overlijden worden verkregen en hetzij van erfbelasting zijn
      vrijgesteld ingevolge het eerste lid, onder 5°, hetzij naar hun aard niet krachtens deze wet belastbaar zijn,
      strekt voor de helft in mindering van het in het eerste lid, onder 4°, onderdeel a, bedoelde bedrag, met dien
      verstande dat na deze korting de vrijstelling niet minder bedraagt dan € 173.580. Voor zover de omvang van de in
      de eerste volzin bedoelde aanspraken wordt bepaald met toepassing van [artikel 13][ref3], wordt de verkrijging van
      deze aanspraken voor de toepassing van dit lid, geacht geheel te kunnen worden toegerekend aan een onttrekking aan
      het vermogen van de erflater.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel13
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0002226
        artikel: '13'
        hoofdstuk: I
  - number: '32.3'
    text: |-
      Onder pensioenregeling wordt voor de toepassing van deze wet verstaan een pensioenregeling als bedoeld in
      [artikel 1.7, tweede lid, van de Wet inkomstenbelasting 2001][ref1] of een nettopensioenregeling als bedoeld in
      [artikel 5.17 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '32.4'
    text: |-
      Onder lijfrenten worden verstaan lijfrenten als bedoeld in [artikel 3.125 van de Wet inkomstenbelasting 2001][ref1],
      welke zijn verzekerd bij een verzekeraar als bedoeld in [artikel 3.126 van die wet][ref2], alsmede
      aanspraken op tegoeden van lijfrenterekeningen of waarden van lijfrentebeleggingsrechten als bedoeld in
      [artikel 3.126a van die wet][ref3], voorzover de terzake voldane premies respectievelijk de overgemaakte bedragen
      voor de heffing van de inkomstenbelasting als uitgaven voor inkomensvoorzieningen in aftrek konden worden gebracht,
      alsmede nettolijfrenten als bedoeld in [artikel 5.16 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '33'
    text: 'Van schenkbelasting is vrijgesteld, hetgeen wordt verkregen:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.1°
    text: 'van:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.1°.a
    text: de Koning;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.1°.b
    text: de vermoedelijke opvolger van de Koning;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.1°.c
    text: de Koning die afstand van het koningschap heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.1°.d
    text: |-
      de echtgenoot of echtgenote van de Koning, de echtgenoot of echtgenote van de vermoedelijke opvolger van de Koning
      of de echtgenoot of echtgenote van de Koning die afstand van het koningschap heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.2°
    text: door de Staat, of van de Staat, een provincie, de openbare lichamen Bonaire, Sint Eustatius en Saba of gemeente;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.3°
    text: |-
      door een provincie of gemeente in Nederland, zonder bijzondere opdracht of met een opdracht, indien en voor zover
      deze opdracht aan de schenking niet het karakter ontneemt van te zijn geschied in het algemeen belang;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.4°
    text: |-
      door een algemeen nut beogende instelling, voor zover aan de verkrijging niet een opdracht is verbonden, welke aan
      de verkrijging het karakter ontneemt van te zijn geschied in het algemeen belang;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.5°
    text: |-
      door een kind van de ouders, tot een bedrag van € 6.604, met dien verstande dat dit bedrag voor een kind tussen
      18 en 40 jaar voor één kalenderjaar wordt verhoogd, mits op deze verhoogde vrijstelling in de aangifte een beroep
      wordt gedaan, tot een bedrag van:
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.5°.a
    text: € 26.881;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.5°.b
    text: |-
      € 55.996, onder bij ministeriële regeling te stellen voorwaarden, indien het bedrag is bestemd voor de betaling
      van kosten van een studie of de opleiding voor een beroep ten behoeve van dat kind en deze kosten aanzienlijk hoger
      zijn dan gebruikelijk, of;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.5°.c
    text: |-
      € 105.302, onder bij ministeriële regeling te stellen voorwaarden, indien het bedrag een schenking ten behoeve van
      een eigen woning betreft;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.7°
    text: |-
      in alle andere gevallen: € 3.244, met dien verstande dat dit bedrag voor iemand tussen 18 en 40 jaar voor één
      kalenderjaar, onder bij ministeriële regeling te stellen voorwaarden, wordt verhoogd tot een bedrag van € 105.302
      indien het een schenking ten behoeve van een eigen woning betreft en mits op deze vrijstelling in de aangifte een
      beroep wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.8°
    text: |-
      door iemand, die niet in staat is zijn schulden te betalen, indien en voor zover het verkregene strekt om de
      begiftigde daartoe in staat te stellen;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.9°
    text: |-
      door iemand te wiens laste over die verkrijging inkomstenbelasting of een voorheffing van die belasting wordt
      geheven;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.10°
    text: |-
      van een algemeen nut beogende instelling, voor zover de uitkeringen geheel of nagenoeg geheel het karakter hebben
      van te zijn geschied in het algemeen belang;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.11°
    text: |-
      door een rechtspersoon, welke uitsluitend of nagenoeg uitsluitend ten doel heeft de bevordering van de materiële en
      geestelijke belangen van de werknemers in het bedrijf van de schenker, dan wel in de bedrijven van de schenker en
      anderen, of van de nabestaanden van die werknemers;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: '33.12'
    text: |-
      indien en voor zover de schenking heeft gestrekt tot voldoening aan een natuurlijke verbintenis als is bedoeld in
      [artikel 3 van Boek 6 van het Burgerlijk Wetboek][ref1]. Voor zover een ingevolge deze bepaling van schenkbelasting
      vrijgestelde verkrijging haar grond vindt in de voldoening aan een natuurlijke verbintenis als is bedoeld in
      de vorige volzin tot verzorging na het overlijden van de schuldenaar - de omzetting van zodanige verbintenis in
      een rechtens afdwingbare daaronder begrepen - wordt zij geacht krachtens erfrecht door het overlijden te zijn
      verkregen. Voor zover een schenking van een periodieke uitkering door een werkgever of zijn echtgenoot of door een
      pensioenfonds aan een nabestaande van een werknemer ingevolge deze bepaling is vrijgesteld van schenkbelasting,
      wordt zij, voor de toepassing van deze wet, beschouwd als een aan de werknemer toe te rekenen bevoordeling
      krachtens een ten behoeve van de verkrijger gemaakt beding;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '3'
  - number: 33.13°
    text: |-
      door een sociaal belang behartigende instelling, voor zover aan de verkrijging niet een opdracht is verbonden welke
      aan de verkrijging het karakter ontneemt van te zijn geschied in het sociaal belang;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33.14°
    text: |-
      door een steunstichting SBBI, voor zover aan de verkrijging niet een opdracht is verbonden welke aan de verkrijging
      het karakter ontneemt van te zijn bestemd voor de realisatie van de doelstelling van de steunstichting.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33
  - number: 33a.1
    text: |-
      Voor de toepassing van [artikel 33, onderdelen 5° en 7°][ref1], wordt, met inachtneming van bij ministeriële
      regeling te stellen voorwaarden, onder een schenking ten behoeve van een eigen woning verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel33
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '33'
        hoofdstuk: III
  - number: 33a.1.a
    text: |-
      een schenking van een woning die voor de verkrijger een eigen woning is als bedoeld in
      [artikel 3.111, eerste of derde lid, van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 33a.1.b
    text: een schenking van een bedrag ter zake van de verwerving van een woning als bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33a
  - number: 33a.1.c
    text: |-
      een schenking van een bedrag ter zake van de kosten voor verbetering of onderhoud van een woning als bedoeld in
      onderdeel a;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33a
  - number: 33a.1.d
    text: |-
      een schenking van een bedrag ter zake van de afkoop van rechten van erfpacht, opstal of beklemming met betrekking
      tot een woning als bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33a
  - number: 33a.1.e
    text: |-
      een schenking van een bedrag voor de aflossing van een eigenwoningschuld als bedoeld in
      [artikel 3.119a van de Wet inkomstenbelasting 2001][ref1] of voor de aflossing van een schuld die de verkrijger had
      op het moment direct voorafgaand aan een vervreemding van een eigen woning voor zover deze schuld heeft geleid tot
      een negatief vervreemdingssaldo eigen woning als bedoeld in [artikel 3.119aa van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 33a.2
    text: |-
      Een verkrijger die in een kalenderjaar de verhoogde vrijstelling, bedoeld in
      [artikel 33, onderdeel 5°, onder c, of onderdeel 7°][ref1], slechts gedeeltelijk heeft benut, kan, in afwijking
      van artikel 33, onderdeel 5°, onderscheidenlijk onderdeel 7°, van dezelfde schenker ontvangen schenkingen ten
      behoeve van een eigen woning als bedoeld in het eerste lid, tot ten hoogste het onbenutte gedeelte gespreid
      over een direct op dat kalenderjaar volgende periode van ten hoogste twee kalenderjaren, onder bij ministeriële
      regeling te stellen voorwaarden, alsnog ten laste van die verhoogde vrijstelling brengen voor zover de schenkingen
      plaatsvinden in de periode dat de verkrijger niet ouder dan 39 jaar is en mits ter zake van de schenkingen op de
      vrijstelling in de aangifte een beroep wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel33
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '33'
        hoofdstuk: III
  - number: 33a.3
    text: |-
      Ingeval in de aangifte een beroep is gedaan op de vrijstelling, bedoeld in
      [artikel 33, onderdeel 5°, onder c, of onderdeel 7°][ref1], voor een schenking als bedoeld in het eerste
      en tweede lid, wordt de in [artikel 11, derde lid, van de Algemene wet inzake rijksbelastingen][ref2] vermelde
      termijn van drie jaren verlengd met twee jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel11
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '33'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '11'
  - number: '34'
    text: |-
      Wij behouden Ons voor bij algemene maatregel van bestuur regelen te stellen, ten doel hebbende te bevorderen,
      dat het vermogen van de in [artikel 33, onder 11°][ref1], bedoelde rechtspersonen blijvend wordt aangewend voor
      het door die rechtspersonen beoogde doel; bij niet-naleving van deze regelen blijft gemelde vrijstellingsbepaling
      buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel33
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '33'
        hoofdstuk: III
  - number: 35a.1
    text: |-
      Met betrekking tot de in de [artikelen 24][ref1], [32, eerste lid, onderdeel 4°, en tweede lid][ref2],
      [33, onderdelen 5° en 7°][ref3], en [35b, eerste lid][ref4], vermelde bedragen zijn de [artikelen 10.1][ref5] en
      [10.2 van de Wet inkomstenbelasting 2001][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '24'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '32'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002226
        artikel: '33'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
      - id: ref5
        bwb_id: BWBR0011353
        artikel: '10'
      - id: ref6
        bwb_id: BWBR0011353
        artikel: '10'
  - number: 35a.2
    text: |-
      De vervangende bedragen zijn van toepassing, indien het overlijden, de schenking of de in
      [artikel 45, derde lid, tweede zin][ref1], of in [artikel 53][ref2], eerste lid, bedoelde gebeurtenis plaatsvindt
      op of na 1 januari van het jaar waarvoor de vervanging geldt, zo mede indien op of na 1 januari van dat jaar
      krachtens schenking wordt verkregen ten gevolge van de vervulling van een voorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel53
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '45'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '53'
        hoofdstuk: VII
  - number: 35b.1
    text: |-
      Indien tot de verkrijging ondernemingsvermogen behoort als bedoeld in [artikel 35c][ref1], dat wordt verkregen
      in het kader van een bedrijfsopvolging als bedoeld in het vijfde lid, wordt op verzoek van de verkrijger een
      voorwaardelijke vrijstelling verleend van:


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
  - number: 35b.1.a
    text: |-
      indien de totale waarde van het ondernemingsvermogen van de objectieve onderneming waarop de verkrijging betrekking
      heeft € 1.119.845 niet te boven gaat: 100%;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35b
  - number: 35b.1.b
    text: 'in alle overige gevallen:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35b
  - number: 35b.1.b.1°
    text: |-
      indien de liquidatiewaarde van het ondernemingsvermogen van de objectieve onderneming waarop de verkrijging
      betrekking heeft hoger is dan de waarde going concern: 100 percent van het verschil tussen liquidatiewaarde en
      lagere waarde going concern;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35b
  - number: 35b.1.b.2°
    text: |-
      voor zover de totale waarde van het ondernemingsvermogen van de objectieve onderneming waarop de verkrijging
      betrekking heeft, na toepassing van hetgeen is bepaald onder 1°, € 1.119.845 niet te boven gaat: 100%, en
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35b
  - number: 35b.1.b.3°
    text: |-
      voor zover de totale waarde van het ondernemingsvermogen van de objectieve onderneming waarop de verkrijging
      betrekking heeft, na toepassing van hetgeen is bepaald onder 1°, € 1.119.845 te boven gaat: 83%.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35b
  - number: 35b.2
    text: |-
      Op verzoek van de verkrijger wordt voorts de waarde van het verkregen ondernemingsvermogen na aftrek van het bedrag
      van de voorwaardelijke vrijstelling aangemerkt als geconserveerde waarde, dit met het oog op de toepassing van
      [artikel 25, twaalfde lid, van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 35b.3
    text: |-
      De belasting over de geconserveerde waarde wordt bepaald op het verschil tussen de belasting over de belaste
      verkrijging en de belasting over de belaste verkrijging verminderd met deze geconserveerde waarde.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35b
  - number: 35b.4
    text: |-
      Indien het ondernemingsvermogen is verkregen onder een last of tegen een tegenprestatie, wordt voor de
      toepassing van dit artikel die last of tegenprestatie niet in mindering gebracht op de waarde van het verkregen
      ondernemingsvermogen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35b
  - number: 35b.5
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt onder een bedrijfsopvolging verstaan:
      een verkrijging van ondernemingsvermogen als bedoeld in [artikel 35c][ref1], van een erflater of schenker die
      voldoet aan de bezitstermijn als bedoeld in [artikel 35d][ref2], mits de verkrijger gedurende vijf jaren voldoet
      aan het voortzettingvereiste, bedoeld in [artikel 35e][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel35d
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel35e
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002226
        artikel: 35d
        hoofdstuk: IIIA
      - id: ref3
        bwb_id: BWBR0002226
        artikel: 35e
        hoofdstuk: IIIA
  - number: 35b.6
    text: |-
      Ingeval op enig tijdstip binnen vijf jaren na de verkrijging van het ondernemingsvermogen niet meer of niet meer
      geheel wordt voldaan aan het voortzettingvereiste, vervalt in zoverre de voorwaardelijke vrijstelling.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35b
  - number: 35b.7
    text: De verzoeken, bedoeld in het eerste en tweede lid, worden gelijktijdig met de aangifte gedaan.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35b
  - number: 35c.1
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt onder de verkrijging van
      ondernemingsvermogen verstaan de verkrijging van:
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35c.1.a
    text: |-
      een onderneming als bedoeld in [artikel 3.2 van de Wet inkomstenbelasting 2001][ref1], of een gedeelte daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 35c.1.b
    text: |-
      een medegerechtigdheid als bedoeld in
      [artikel 3.3, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1], of een gedeelte daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 35c.1.c
    text: |-
      vermogensbestanddelen die bij de erflater of schenker behoorden tot een aanmerkelijk belang als bedoeld in
      [afdeling 4.3][ref1], met uitzondering van [artikel 4.10, van de Wet inkomstenbelasting 2001][ref2], mits
      het lichaam waarop het belang betrekking heeft een onderneming drijft als bedoeld in onderdeel a, of een
      medegerechtigdheid houdt als bedoeld in onderdeel b, en waarbij slechts als ondernemingsvermogen wordt aangemerkt
      de waarde van deze vermogensbestanddelen voor zover die waarde toerekenbaar is aan:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling4.3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '4.3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 35c.1.c.1°
    text: bedoelde onderneming of medegerechtigdheid, en
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35c.1.c.2°
    text: het beleggingsvermogen van dat lichaam tot maximaal 5 percent van de ingevolge onder 1° toegerekende waarde;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35c.1.d
    text: |-
      onroerende zaken die bij de erflater of schenker behoorden tot een werkzaamheid als bedoeld in
      [artikel 3.92 van de Wet inkomstenbelasting 2001][ref1], mits deze dienstbaar zijn aan de onderneming van een
      lichaam als bedoeld in onderdeel c, en de verkrijger tegelijkertijd vermogensbestanddelen als bedoeld in onderdeel
      c, verkrijgt die op dat lichaam betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 35c.2
    text: |-
      Het eerste lid, onderdeel b, is met betrekking tot een medegerechtigdheid alleen van toepassing voor zover
      dit een medegerechtigdheid betreft die een rechtstreekse voortzetting vormt van een eerder door de erflater
      of schenker gedreven onderneming als bedoeld in [artikel 3.2 van de Wet inkomstenbelasting 2001][ref1], en de
      medegerechtigdheid wordt verkregen door een persoon die reeds beherend vennoot is van de onderneming waarop de
      medegerechtigdheid betrekking heeft, dan wel enig aandeelhouder is van een vennootschap die reeds een zodanig
      beherend vennoot is.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 35c.3
    text: |-
      Het eerste lid, onderdeel c, is met betrekking tot een medegerechtigdheid alleen van toepassing voor zover dit een
      medegerechtigdheid betreft die een rechtstreekse voortzetting vormt van een eerder door de vennootschap gedreven
      onderneming als bedoeld in [artikel 3.2 van de Wet inkomstenbelasting 2001][ref1], en de vermogensbestanddelen
      die bij de erflater of schenker behoorden tot een aanmerkelijk belang worden verkregen door een persoon die reeds
      beherend vennoot is van de onderneming waarop de medegerechtigdheid betrekking heeft, dan wel enig aandeelhouder is
      van een vennootschap die reeds een zodanig beherend vennoot is.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 35c.4
    text: 'Het eerste lid, onderdeel c, is met betrekking tot preferente aandelen uitsluitend van toepassing, indien:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35c.4.a
    text: |-
      de preferente aandelen een omzetting vormen van een eerder door de erflater of schenker gehouden aanmerkelijk
      belang van gewone aandelen;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35c.4.b
    text: de omzetting tot preferente aandelen gepaard is gegaan met het toekennen van gewone aandelen aan een ander;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35c.4.c
    text: |-
      ten tijde van de omzetting tot preferente aandelen de vennootschap waarop de omgezette aandelen betrekking hadden
      een onderneming dreef als bedoeld in het eerste lid, onderdeel a, of een medegerechtigdheid hield als bedoeld in
      het eerste lid, onderdeel b, en
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35c.4.d
    text: |-
      de verkrijger van de preferente aandelen reeds voor ten minste 5% van het geplaatste kapitaal aandeelhouder is van
      gewone aandelen als bedoeld in onderdeel b.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35c.5
    text: |-
      Ingeval het lichaam waarin de erflater of schenker een aanmerkelijk belang als bedoeld in het eerste lid, onderdeel
      c, hield, direct of indirect een belang heeft in een ander lichaam, worden voor de toepassing van dit hoofdstuk en
      de daarop berustende bepalingen de bezittingen en schulden van dat andere lichaam, met inachtneming van de omvang
      van dat belang, toegerekend aan eerstbedoeld lichaam, mits:
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35c.5.a
    text: |-
      de erflater of schenker in dat andere lichaam indirect een aanmerkelijk belang hield als bedoeld in
      [afdeling 4.3 van de Wet inkomstenbelasting 2001][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling4.3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '4.3'
  - number: 35c.5.b
    text: 'de erflater of schenker in dat andere lichaam indirect een belang hield van minder dan 5% doch ten minste 0,5% en:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35c.5.b.1°
    text: |-
      dat belang bij een van zijn rechtsvoorgangers krachtens erfrecht, huwelijksvermogensrecht of schenking een indirect
      aanmerkelijk belang heeft gevormd als bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35c.5.b.2°
    text: dat belang uitsluitend is verwaterd door vererving, overgang krachtens huwelijksvermogensrecht of schenking, en
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35c.5.b.3°
    text: |-
      direct voorafgaande aan de verwatering van dat belang tot beneden de 5% dat andere lichaam een onderneming dreef of
      een medegerechtigdheid hield als bedoeld in het eerste lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35c.6
    text: |-
      Tot het vermogen van de onderneming, bedoeld in het eerste lid, onderdeel c, onder 1°, wordt niet gerekend een
      belang in een ander lichaam.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35c.7
    text: |-
      Onder onroerende zaken als bedoeld in het eerste lid, onderdeel d, worden mede verstaan appartementsrechten,
      rechten van opstal en erfpacht of vruchtgebruik van onroerende zaken, dan wel de economische eigendom, opgevat
      overeenkomstig [artikel 2, tweede lid, van de Wet op belastingen van rechtsverkeer][ref1], van onroerende zaken of
      genoemde rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
  - number: 35c.8
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen zijn de
      [artikelen 4.3 tot en met 4.5a van de Wet inkomstenbelasting 2001][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 35c.9
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35c
  - number: 35d.1
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt onder een erflater of schenker
      verstaan een erflater die gedurende één jaar tot het overlijden, onderscheidenlijk een schenker die gedurende vijf
      jaren tot de schenking:
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35d
  - number: 35d.1.a
    text: |-
      ondernemer was in de zin van [artikel 3.4][ref1] of [artikel 3.5 van de Wet inkomstenbelasting 2001][ref2] met
      betrekking tot de in [artikel 35c, eerste lid, onderdeel a][ref3], bedoelde onderneming;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
  - number: 35d.1.b
    text: |-
      medegerechtigde was in de zin van [artikel 3.3, eerste lid, onderdeel a van de Wet inkomstenbelasting 2001][ref1]
      met betrekking tot de in [artikel 35c, eerste lid, onderdeel b][ref2], bedoelde medegerechtigdheid;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
  - number: 35d.1.c
    text: |-
      aanmerkelijkbelanghouder was van de vermogensbestanddelen, bedoeld in [artikel 35c, eerste lid, onderdeel c][ref1],
      en het lichaam waarop het aanmerkelijk belang betrekking heeft gedurende de in de aanhef bedoelde periode van
      één jaar, onderscheidenlijk vijf jaren, de daar bedoelde onderneming dreef of de daar bedoelde medegerechtigdheid
      bezat, en het in artikel 35c, eerste lid, onderdeel c, onder 2°, bedoelde beleggingsvermogen niet in deze periode
      via een storting in het lichaam is ingebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
  - number: 35d.1.d
    text: |-
      resultaat uit een werkzaamheid genoot met betrekking tot de onroerende zaak, bedoeld in
      [artikel 35c, eerste lid, onderdeel d][ref1], en die onroerende zaak gedurende de in de aanhef bedoelde periode van
      één jaar, onderscheidenlijk vijf jaren, dienstbaar was aan de onderneming van het lichaam, bedoeld in artikel 35c,
      eerste lid, onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
  - number: 35d.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35d
  - number: 35e.1
    text: |-
      Een verkrijger voldoet aan het voortzettingsvereiste indien gedurende de periode van vijf jaren, bedoeld in
      [artikel 35b, vijfde lid][ref1], zich geen van de hierna genoemde gebeurtenissen voordoet:


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
  - number: 35e.1.a
    text: |-
      indien het een verkrijging betreft als bedoeld in [artikel 35c, eerste lid, onderdeel a][ref1]: de verkrijger houdt
      op uit de onderneming, of een gedeelte daarvan, winst te genieten of gaat ter zake belastbare winst genieten in de
      zin van [artikel 3.3 van de Wet inkomstenbelasting 2001][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 35e.1.b
    text: |-
      indien het een verkrijging betreft als bedoeld in [artikel 35c, eerste lid, onderdeel b][ref1]: de verkrijger houdt
      op uit de verkregen medegerechtigdheid, of een gedeelte daarvan, winst te genieten;


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
  - number: 35e.1.c
    text: |-
      indien het een verkrijging betreft van vermogensbestanddelen als bedoeld in
      [artikel 35c, eerste lid, onderdeel c][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
  - number: 35e.1.c.1°
    text: |-
      de verkrijger vervreemdt vermogensbestanddelen of een gedeelte van de in deze vermogensbestanddelen liggende
      rechten;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
  - number: 35e.1.c.2°
    text: |-
      vermogensbestanddelen worden omgezet in preferente aandelen of op andere wijze wordt de aanspraak van de verkregen
      vermogensbestanddelen op toekomstige winsten of waardeontwikkelingen beperkt, of
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
  - number: 35e.1.c.3°
    text: |-
      het lichaam waarop de vermogensbestanddelen betrekking hebben, houdt op uit de onderneming of de
      medegerechtigdheid, of een gedeelte daarvan, winst te genieten;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
  - number: 35e.1.d
    text: |-
      indien het een verkrijging betreft als bedoeld in [artikel 35c, eerste lid, onderdeel d][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
  - number: 35e.1.d.1°
    text: |-
      de verkrijger houdt op de onroerende zaak geheel of voor een gedeelte daarvan ter beschikking te stellen aan het in
      dat lid bedoelde lichaam, of
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
  - number: 35e.1.d.2°
    text: |-
      de onroerende zaak houdt op geheel of voor een gedeelte daarvan dienstbaar te zijn aan de in dat lid bedoelde
      onderneming.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
  - number: 35e.2
    text: |-
      Indien de verkrijger in de periode, bedoeld in het eerste lid, een samenwerkingsverband aangaat, houdt hij voor de
      toepassing van dit artikel slechts op winst te genieten voor zover zijn gerechtigdheid tot de winst daardoor verder
      afneemt dan het aandeel in de winst waartoe hij gerechtigd was vóór de verkrijging waarop [artikel 35b][ref1] is
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
  - number: 35e.3
    text: |-
      Voor de toepassing van het eerste lid, onderdeel c, wordt onder
      vervreemden mede verstaan een handeling of gebeurtenis als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________, ook als deze handeling of gebeurtenis betrekking heeft op vermogensbestanddelen die bij de verkrijger
      niet tot een aanmerkelijk belang behoren als bedoeld in [afdeling 4.3 van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Afdeling4.3
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        afdeling: '4.3'
  - number: 35e.4
    text: |-
      Het eerste lid, onderdeel c, is van overeenkomstige toepassing op de gewone aandelen van de verkrijger, bedoeld
      in [artikel 35c, vierde lid][ref1]. Ingeval met betrekking tot de in de eerste volzin bedoelde gewone aandelen
      niet wordt voldaan aan het eerste lid, onderdeel c, vervalt de voorwaardelijke vrijstelling met betrekking tot
      de preferente aandelen, bedoeld in artikel 35c, vierde lid, overeenkomstig [artikel 35b, zesde lid][ref2], naar
      evenredigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35c
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35c
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
  - number: 35e.5
    text: |-
      Indien zich een van de in het eerste lid bedoelde gebeurtenissen heeft voorgedaan, doet de verkrijger hiervan
      aangifte binnen acht maanden na die gebeurtenis.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
  - number: 35e.6
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35e
  - number: 35f.1
    text: |-
      Indien ten gevolge van de verdeling van de nalatenschap wijziging komt in de gerechtigdheid tot het
      ondernemingsvermogen, vindt dit hoofdstuk op verzoek van de verkrijger van wie de gerechtigdheid toeneemt,
      toepassing op basis van de aldus ontstane gerechtigdheid.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35f
  - number: 35f.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de verdeling van de huwelijksgoederengemeenschap waarin de
      erflater was gerechtigd. De vorige volzin is niet van toepassing op de echtgenoot van de erflater.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35f
  - number: 35f.3
    text: |-
      Dit artikel vindt uitsluitend toepassing indien de verdeling van de nalatenschap, onderscheidenlijk de
      huwelijksgoederengemeenschap heeft plaatsgevonden binnen twee jaren na het overlijden van de erflater.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35f
  - number: 35f.4
    text: |-
      Het verzoek, bedoeld in het eerste en tweede lid, geschiedt door het doen van aangifte binnen acht maanden nadat de
      in het eerste lid onderscheidenlijk tweede lid bedoelde verdeling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35f
  - number: 35g.1
    text: |-
      Indien krachtens erfrecht de blote eigendom wordt verkregen van een woning die voor de vruchtgebruiker een eigen
      woning is als bedoeld in [artikel 3.111 van de Wet inkomstenbelasting 2001][ref1], wordt, met het oog op de
      toepassing van [artikel 25, twintigste lid, van de Invorderingswet 1990][ref2], op verzoek van de verkrijger de
      waarde van de blote eigendom aangemerkt als geconserveerde waarde, voor zover het deel van de verkrijging dat niet
      bestaat uit de blote eigendom van de woning wordt overschreden door het bedrag van de verschuldigde erfbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35g
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 35g.2
    text: |-
      De belasting over de geconserveerde waarde wordt bepaald op het verschil tussen de belasting over de belaste
      verkrijging en de belasting over de belaste verkrijging verminderd met deze geconserveerde waarde.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35g
  - number: 35g.3
    text: |-
      Indien de verkrijging omvat zowel blote eigendom als bedoeld in het eerste lid als ondernemingsvermogen als bedoeld
      in [artikel 35b, tweede lid][ref1], wordt voor de bepaling van de belasting over de geconserveerde waarde van de
      blote eigendom de verkrijging van het ondernemingsvermogen genegeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35g
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
  - number: 35g.4
    text: |-
      Dit artikel is van overeenkomstige toepassing op de verkrijging van een krachtens erfrecht verkregen
      onderbedelingsvordering.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel35g
  - number: '36'
    text: De belasting wordt geheven van de verkrijger.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel36
  - number: '37.1'
    text: De belasting wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel37
  - number: '37.2'
    text: |-
      In afwijking van het eerste lid wordt de belasting bedoeld in [artikel 35b, derde lid][ref1], of
      [artikel 35g][ref2], geheven bij wege van conserverende aanslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel35g
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0002226
        artikel: 35g
        hoofdstuk: IIIb
  - number: '37.3'
    text: |-
      Vanwege het vervallen van een voorwaardelijke vrijstelling als bedoeld in [artikel 35b, eerste lid][ref1], kan een
      aanslag of conserverende aanslag door een of meer aanslagen of conserverende aanslagen worden aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35b
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35b
        hoofdstuk: IIIA
  - number: '37.4'
    text: |-
      Rechtsmiddelen tegen de in het derde lid bedoelde aanslagen kunnen uitsluitend worden ingeroepen tegen de in die
      aanslagen opgenomen grondslag voorzover daarvoor nog niet eerder een rechtsmiddel openstond.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel37
  - number: '38'
    text: |-
      De erfgenaam die is uitgenodigd tot het doen van aangifte, is gehouden mede aangifte te doen van de gegevens welke
      van belang kunnen zijn voor de heffing van de erfbelasting van de andere verkrijgers, niet zijnde erfgenamen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel38
  - number: '39'
    text: |-
      Indien meer verkrijgers gehouden zijn aangifte te doen ter zake van dezelfde nalatenschap, kunnen zij gezamenlijk
      aangifte doen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel39
  - number: '40.1'
    text: |-
      De inspecteur kan de schenker die naar zijn mening vermoedelijk een belastbare schenking heeft gedaan, uitnodigen
      tot het doen van aangifte.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel40
  - number: '40.2'
    text: De schenker en de begiftigde - dan wel de gezamenlijke schenkers of begiftigden - kunnen gezamenlijk aangifte doen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel40
  - number: '42'
    text: |-
      Indien na te noemen verplichtingen niet reeds op een ander rusten, is degene, die door de verwerping, afstand
      of niet aanvaarding van rechten, bedoeld in [artikel 30][ref1], is gebaat, op dezelfde wijze en onder dezelfde
      bepalingen tot aangifte en betaling gehouden, als degene, door wie die verwerping, afstand of niet aanvaarding
      heeft plaats gehad, verplicht zou zijn geweest, indien een of ander niet was geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel30
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '30'
        hoofdstuk: III
  - number: '43.1'
    text: |-
      In iedere aangifte wordt één woonplaats gekozen in Nederland. De stukken betreffende de heffing van de belasting
      kunnen worden gezonden hetzij aan de gekozen woonplaats hetzij aan de werkelijke woonplaats of plaats van
      vestiging. [Artikel 57 van de Algemene wet inzake rijksbelastingen][ref1] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel57
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '57'
  - number: '43.2'
    text: |-
      Zij, die voor de erfbelasting geen aangifte hebben gedaan of geen woonplaats hebben gekozen, worden geacht hun
      woonplaats te hebben gekozen ter laatste woonplaats van de overledene gedurende een jaar na het overlijden; na die
      tijd, alsmede indien niet een bepaald adres in Nederland als de werkelijke laatste woonplaats van de overledene kan
      worden aangewezen, ter secretarie van de gemeente, binnen welke de aangifte moet geschieden.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel43
  - number: '43.3'
    text: |-
      Zij, die voor de schenkbelasting geen aangifte hebben gedaan of geen woonplaats hebben gekozen, worden geacht hun
      woonplaats te hebben gekozen ter woonplaats van de schenker, of, indien niet een bepaald adres in Nederland als
      de werkelijke woonplaats van de schenker kan worden aangewezen, ter secretarie van de gemeente, binnen welke de
      aangifte moet geschieden.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel43
  - number: '45.1'
    text: |-
      De inspecteur stelt de termijn voor het doen van aangifte voor de erfbelasting zodanig vast dat deze niet eerder
      verstrijkt dan acht maanden na het overlijden.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel45
  - number: '45.2'
    text: |-
      Indien zwangerschap oorzaak is, dat onzekerheid bestaat omtrent de persoon van de erfgenaam of de heffing van de
      belasting, gaat de in het eerste lid bedoelde termijn van acht maanden in van de dag van de bevalling, of indien
      de vrouw vroeger mocht overlijden van de dag van haar overlijden, of indien geen van beide op de 306de dag na
      de dood van de erflater mocht hebben plaats gehad, van de eerste daarop volgende dag. Deze bepaling kan niet
      worden ingeroepen door degene, op het erfdeel van wie, wat de hoegrootheid betreft, de bevalling geen invloed kan
      uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel45
  - number: '45.3'
    text: |-
      De in het eerste lid bedoelde termijn van acht maanden loopt niet gedurende de tijd dat de nalatenschap
      onbeheerd is gelaten en geen vereffenaar is benoemd. Indien verkregen wordt ten gevolge van de vervulling
      van een voorwaarde, van aanvaarding nadat eerst verwerping had plaatsgehad, van een afstand door een
      verkrijger onder een ontbindende voorwaarde als bedoeld in [artikel 21, tweede lid][ref1], ten behoeve
      van de verwachters, van de uitoefening van een wilsrecht voortspruitende uit ten sterfdage of ten tijde
      van de verkrijging bestaande of ontstane rechtsverhoudingen, dan wel ten gevolge van de toepassing van
      [artikel 33 van Boek 4 van het Burgerlijk Wetboek][ref2], gaat de in het eerste lid bedoelde termijn van acht
      maanden in op de dag waarop één van die gebeurtenissen plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel33
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '21'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '33'
  - number: '46'
    text: |-
      De inspecteur stelt de termijn voor het doen van aangifte voor de schenkbelasting zodanig vast, dat deze niet
      eerder verstrijkt dan twee maanden na het einde van het kalenderjaar waarin de schenking heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel46
  - number: '47'
    text: |-
      Ingeval sprake is van meer dan één verkrijger van dezelfde erflater of krachtens een gezamenlijke schenking, kunnen
      de ter zake vastgestelde belastingaanslagen worden opgenomen in één aanslagbiljet.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel47
  - number: '52'
    text: |-
      Navordering op de voet van [hoofdstuk III van de Algemene wet inzake rijksbelastingen][ref1] kan mede plaatsvinden
      in gevallen waarin van een verkrijger te weinig belasting is geheven doordat een aan die verkrijger opgelegde
      andere belastingaanslag of een aan een andere verkrijger opgelegde belastingaanslag, anders dan ingevolge
      [artikel 53][ref2], is verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel53
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '53'
        hoofdstuk: VII
  - number: '53.1'
    text: |-
      Behalve in de gevallen bij deze wet voorzien, wordt vermindering van de aanslag of de conserverende aanslag
      verleend, indien en voorzover ten gevolge van een beroep op de legitieme portie, van de vervulling van
      een voorwaarde, van de uitoefening van een op de wet berustend terugvorderingsrecht, van de toepassing van
      [artikel 33 van Boek 4 van het Burgerlijk Wetboek][ref1] of van de uitoefening van een wilsrecht, voortspruitende
      uit ten sterfdage of ten tijde van de verkrijging reeds bestaande of ontstane rechtsverhoudingen, anders
      dan door opvolging krachtens een voorwaarde als bedoeld in [artikel 21, tweede lid][ref2], wijziging wordt
      gebracht in de persoon van de verkrijger of in het verkregene. De eerste volzin is niet van toepassing
      bij de uitoefening van een wilsrecht als bedoeld in de [artikelen 19][ref3], [20][ref4], [21][ref5]en
      [22 van Boek 4 van het Burgerlijk Wetboek][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0002761#Artikel21
      [ref6]: https://wetten.overheid.nl/BWBR0002761#Artikel22
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '21'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0002761
        artikel: '20'
      - id: ref5
        bwb_id: BWBR0002761
        artikel: '21'
      - id: ref6
        bwb_id: BWBR0002761
        artikel: '22'
  - number: '53.2'
    text: |-
      Het bedrag van de vermindering, bedoeld in het eerste lid, wordt verlaagd, maar niet verder dan tot nihil, met het
      bedrag aan belasting dat verschuldigd zou zijn geweest indien dat was berekend over het voordeel dat tijdens de
      bezitsperiode is genoten.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel53
  - number: '53.3'
    text: |-
      Het in het tweede lid bedoelde genoten voordeel is het bedrag van de waarde van het daadwerkelijk genoten voordeel
      over het verkregene gedurende de bezitsperiode, dan wel, indien het verkregene een vruchtgebruik is, de waarde van
      dat vruchtgebruik over de bezitsperiode.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel53
  - number: '53.4'
    text: |-
      De erfbelasting die van een verkrijger is geheven, wordt verminderd tot nihil indien over het verkregene, bij het
      overlijden van die verkrijger binnen dertig dagen na de verkrijging, nogmaals erfbelasting wordt geheven.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel53
  - number: '53.5'
    text: |-
      De vermindering wordt verleend op een verzoek dat geschiedt door het doen van aangifte. In deze aangifte wordt
      tevens de hoogte van het in het tweede lid bedoelde voordeel vermeld. De inspecteur beslist op het verzoek bij voor
      bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel53
  - number: '53.6'
    text: |-
      In de gevallen, waarin de oorzaak tot de vermindering anderzijds aanleiding geeft tot heffing van belasting, kan
      de in het vorige lid bedoelde aangifte worden opgenomen in de overeenkomstig [artikel 45, derde lid][ref1], in te
      dienen aangifte. In de andere gevallen moet die aangifte worden ingediend binnen acht maanden, nadat de oorzaak tot
      de vermindering is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel45
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '45'
        hoofdstuk: IV
  - number: '53.7'
    text: |-
      De teruggave, waartoe een vermindering aanleiding geeft, kan geschieden door verrekening met het terzake van
      dezelfde nalatenschap of schenking verschuldigde.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel53
  - number: '54'
    text: |-
      Een beroepschrift kan op de voet van [artikel 26a van de Algemene wet inzake rijksbelastingen][ref1] eveneens
      worden ingediend door de verkrijger die belang heeft bij de aan een andere verkrijger uit dezelfde nalatenschap
      opgelegde aanslag of verleende vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel26a
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 26a
  - number: '66.1'
    text: |-
      De in de [artikelen 11, derde lid][ref1], en
      [16, derde en vierde lid, van de Algemene wet inzake rijksbelastingen][ref2] vermelde termijnen van
      onderscheidenlijk drie, vijf en twaalf jaren gaan in:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '16'
  - number: 66.1.1°
    text: |-
      voor de erfbelasting na de dag van inschrijving van de akte van overlijden in de registers van de burgerlijke
      stand, met dien verstande dat in de gevallen, bedoeld in [artikel 45, tweede en derde lid][ref1], de termijnen niet
      eerder beginnen te lopen dan vanaf de dag waarop de termijn van aangifte ingaat en worden verlengd met de tijd dat
      de termijn van aangifte niet loopt;


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel45
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '45'
        hoofdstuk: IV
  - number: 66.1.2°
    text: |-
      voor de schenkbelasting, ingeval geen aangifte is gedaan, na de dag van inschrijving van de akte van overlijden van
      de schenker of van de begiftigde in de registers van de burgerlijke stand, dan wel ingeval meer dan vier maanden
      na het einde van het kalenderjaar waarin de schenking heeft plaatsgevonden aangifte is gedaan, na de dag van die
      aangifte met dien verstande dat ingeval zowel de schenker als de begiftigde een rechtspersoon is, de bevoegdheid
      tot het vaststellen van een aanslag of navorderingsaanslag twintig jaren na de schenking vervalt;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel66
  - number: 66.1.3°
    text: |-
      voor het geval het betreft het vaststellen van een aanslag of conserverende aanslag in verband met een gebeurtenis
      als bedoeld in [artikel 35e][ref1], na de dag waarop die gebeurtenis zich heeft voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel35e
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: 35e
        hoofdstuk: IIIA
  - number: '66.2'
    text: |-
      Betreft het de bevoegdheid tot het vaststellen van een navorderingsaanslag in gevallen waarin een vermindering als
      bedoeld in [artikel 52][ref1] is verleend, dan gaat de termijn in na de dag waarop de vermindering is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel52
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '52'
        hoofdstuk: VI
  - number: '66.3'
    text: |-
      Betreft het de bevoegdheid tot het vaststellen van een navorderingsaanslag wegens het ten onrechte of tot een te
      hoog bedrag verlenen van een vermindering op grond van [artikel 53][ref1], dan gaat de termijn in na de dag waarop
      de vermindering is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel53
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '53'
        hoofdstuk: VII
  - number: '66.4'
    text: |-
      Indien voor de erfbelasting de aangifte over een bestanddeel van het voorwerp van die belasting dat in het
      buitenland wordt gehouden of is opgekomen niet, onjuist of onvolledig is gedaan, vervalt, in afwijking van
      [artikel 16, vierde lid, van de Algemene wet inzake rijksbelastingen][ref1], de bevoegdheid tot het vaststellen van
      een navorderingsaanslag niet.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel16
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '16'
  - number: '67.1'
    text: 'Door Onze Minister kan gehele of gedeeltelijke kwijtschelding worden verleend van:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel67
  - number: 67.1.1°
    text: |-
      de belasting, verschuldigd wegens een schenking aan natuurlijke personen, waarvan overtuigend wordt aangetoond, dat
      zij slechts heeft gestrekt tot het verschaffen van levensonderhoud van een begiftigde, die verstoken is van eigen
      middelen van bestaan en die wegens ouderdom, invaliditeit of om andere redenen buiten staat is zich die middelen
      door arbeid te verschaffen;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel67
  - number: 67.1.2°
    text: |-
      de belasting, verschuldigd wegens een schenking aan natuurlijke personen, beneden de leeftijd van 27 jaren, van
      welke schenking overtuigend wordt aangetoond, dat zij slechts heeft gestrekt tot betaling van - of bijdrage tot -
      de kosten van studie of opleiding voor enig beroep van een begiftigde, die zonder die schenking niet in staat zou
      zijn die studie of opleiding aan te vangen of te genieten;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel67
  - number: 67.1.4°
    text: |-
      de belasting, verschuldigd wegens een schenking ten algemenen nutte voor het grondgebied van Nederland, welke aan
      een bepaald tijdstip of een bepaalde gebeurtenis gebonden is.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel67
  - number: '67.2'
    text: 'Onze Minister kan kwijtschelding verlenen van de belasting verschuldigd wegens verkrijgingen door:'
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel67
  - number: 67.2.a
    text: |-
      een andere Staat, voor zover de belasting meer bedraagt dan de belasting die de Nederlandse Staat verschuldigd
      zou zijn;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel67
  - number: 67.2.b
    text: |-
      een staatkundig onderdeel of een plaatselijk publiekrechtelijk lichaam van een andere Staat, voor zover de
      belasting meer bedraagt dan de belasting die een Nederlandse provincie of gemeente verschuldigd zou zijn;
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel67
  - number: '67.3'
    text: |-
      Onze Minister kan, in bij algemene maatregel van bestuur te bepalen gevallen en volgens daarbij te stellen regels,
      geheel of gedeeltelijk kwijtschelding verlenen van de verschuldigde erfbelasting en de evenredig met deze gehele of
      gedeeltelijke kwijtschelding samenhangende belastingrente indien voorwerpen uit de nalatenschap met een nationaal
      cultuurhistorisch of kunsthistorisch belang, door de verkrijger in eigendom worden overgedragen aan de Staat. Het
      bedrag van de kwijtschelding beloopt 120 percent van de waarde van de overgedragen voorwerpen maar niet meer dan de
      verschuldigde belasting en de in rekening gebrachte belastingrente.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel67
  - number: '71.1'
    text: |-
      Het aanvaarden van een nalatenschap onder het voorrecht van boedelbeschrijving ontheft niet van de verplichtingen,
      voortvloeiende uit de bij of krachtens deze wet gemaakte bepalingen. De verplichtingen worden niet geschorst
      gedurende de in [artikel 192, tweede lid, van Boek 4 van het Burgerlijk Wetboek][ref1] bedoelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel192
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '192'
  - number: '71.2'
    text: De vervulling van die verplichtingen wordt niet beschouwd als een daad van aanvaarding.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel71
  - number: '72.1'
    text: |-
      Executeurs van nalatenschappen zijn, op gelijke wijze als de erfgenamen, tot vervulling van al de bij deze wet
      opgelegde verplichtingen gehouden.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel72
  - number: '72.2'
    text: |-
      Door de rechter benoemde vereffenaars van nalatenschappen zijn gehouden tot al de bij deze wet aan erfgenamen
      opgelegde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel72
  - number: '72.3'
    text: |-
      Desgevraagd verstrekt de Belastingdienst de erfgenaam inzage in de voor de belastingheffing te zijnen aanzien van
      belang zijnde stukken.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel72
  - number: '73'
    text: |-
      Zij, die goederen niet zijnde registergoederen of daarop betrekking hebbende bewijsstukken onder zich hebben met
      de opdracht om die bij het overlijden van iemand, die in Nederland woonde, niet in de nalatenschap te brengen,
      of daarmede zo te handelen, dat zij niet in de nalatenschap komen, zijn verplicht daarvan overeenkomstig door
      Onze Minister te stellen regelen aangifte te doen. Deze aangifte moet worden ingeleverd binnen een maand na
      schriftelijke aanmaning en in ieder geval voordat de goederen of bewijsstukken uit handen worden gegeven of op
      andere wijze aan de opdracht gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel73
  - number: '74.1'
    text: |-
      In alle gevallen, waarin de mogelijkheid bestaat, dat zich in een gesloten kist of onder een verzegelde omslag
      goederen niet zijnde registergoederen of daarop betrekking hebbende bewijsstukken bevinden, waarvan op grond
      van de [artikelen 8][ref1] of [73][ref2] aangifte moet geschieden, zal op verzoek van de executeur of door de
      rechter benoemde vereffenaar van de nalatenschap, van de erfgenamen of van de houder, de opening, vóór de afgifte,
      geschieden door een notaris, die wordt aangewezen door de kantonrechter van de rechtbank van het arrondissement
      waarin de kist of de omslag zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel73
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '8'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '73'
        hoofdstuk: XII
  - number: '74.2'
    text: |-
      De notaris zal van de opening een proces-verbaal opmaken, waarin de uitwendige toestand en de inhoud van het ter
      opening aangebodene worden beschreven. De notaris zendt een dubbel van het proces-verbaal aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel74
  - number: '75.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden administratieplichtigen aangewezen die gehouden zijn aan
      de verplichtingen ingevolge [artikel 53, tweede en derde lid, van de Algemene wet inzake rijksbelastingen][ref1]
      te voldoen. Bij of krachtens algemene maatregel van bestuur worden de te verstrekken gegevens en inlichtingen
      aangewezen. Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het uiterste
      tijdstip en de wijze waarop de in de tweede volzin bedoelde gegevens en inlichtingen aan de inspecteur dienen te
      worden verstrekt. De eerste, tweede en derde volzin zijn van overeenkomstige toepassing op degene die een uitkering
      moet doen krachtens een ten behoeve van een derde gemaakt beding.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel53
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '53'
  - number: '75.2'
    text: |-
      Bij algemene maatregel van bestuur kan het niet nakomen van de verplichtingen, bedoeld in het eerste lid, worden
      aangemerkt als een overtreding. Indien het niet nakomen van die verplichtingen te wijten is aan opzet of grove
      schuld van de administratieplichtige of degene die een uitkering moet doen, vormt dit een vergrijp ter zake waarvan
      de inspecteur hem een bestuurlijke boete van ten hoogste het bedrag van de geldboete van de vierde categorie,
      bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '76'
    text: |-
      Hij die een aangifte heeft ingediend of moet indienen uitsluitend of mede ten behoeve van de heffing van belasting,
      welke ingevolge de bepalingen van deze wet door anderen verschuldigd is, is gehouden tot het verstrekken van
      gegevens, inlichtingen en inzage op dezelfde wijze en onder dezelfde bepalingen alsof die belasting te zijnen
      aanzien was of zou moeten worden geheven.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel76
  - number: '78.1'
    text: |-
      Ieder, die goederen verkrijgt onder bezwaar van een uit dezelfde nalatenschap verkregen vruchtgebruik, en
      ieder, aan wie goederen worden geschonken onder bezwaar van een door de schenker ten behoeve van zich of
      een derde voorbehouden vruchtgebruik, is, voor zover daaromtrent door de erflater of schenker niet anders
      is bepaald, bevoegd te vorderen, dat de belastingen, deswege door hem verschuldigd, worden betaald uit de
      met vruchtgebruik bezwaarde goederen, tenzij de vruchtgebruiker verkiest het bedrag voor te schieten. Wegens
      deze betaling of dat voorschot is aan de vruchtgebruiker geen rente verschuldigd. De eerste en tweede volzin
      zijn niet van toepassing met betrekking tot geldvorderingen als bedoeld in [artikel 13, derde lid][ref1],
      en [artikel 80, eerste lid, van Boek 4 van het Burgerlijk Wetboek][ref2] indien de nalatenschap is verdeeld
      overeenkomstig [artikel 13 van Boek 4 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '80'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '78.2'
    text: |-
      De belasting op periodieke uitkeringen, bij de instelling verschuldigd, wordt voorgeschoten door hem, die met de
      uitkering is belast, en bij iedere termijn van betaling, naar evenredigheid van het aantal malen, waarvoor de te
      betalen termijn in de voor de heffing van de belasting in aanmerking genomen waarde van de uitkering is begrepen,
      gekort, met bijberekening van de wettelijke rente over het te korten gedeelte van de voorgeschoten belasting van de
      dag waarop de belasting is voorgeschoten, tot de dag van de korting, alles tenzij andere regelingen zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel78
  - number: '82'
    text: |-
      Met betrekking tot op 31 december 2013 bestaande aanspraken op periodieke uitkeringen ter vervanging
      van gederfd of te derven loon als bedoeld in de [artikelen 11, eerste lid, onderdeel g][ref1], en
      [37 van de Wet op de loonbelasting 1964][ref2], zoals die op 31 december 2013 luidden, en daarmee
      gelijkgestelde bedragen als bedoeld in [artikel 11a, eerste lid, van de Wet op de loonbelasting 1964][ref3],
      zoals dat op 31 december 2013 luidde, blijft [artikel 32, eerste lid, onderdeel 5°, en vijfde lid][ref4],
      zoals dat op 31 december 2013 luidde, met overeenkomstige toepassing van
      [artikel 39f, eerste en tweede lid, van de Wet op de loonbelasting 1964][ref5], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel11a
      [ref4]: https://wetten.overheid.nl/BWBR0002226#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0002471#Artikel39f
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 11a
      - id: ref4
        bwb_id: BWBR0002226
        artikel: '32'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0002471
        artikel: 39f
  - number: 82a.1
    text: |-
      De verhoogde vrijstelling, bedoeld in [artikel 33, onderdeel 5°, onder a en b][ref1], is niet van toepassing
      en de verhoogde vrijstelling, bedoeld in artikel 33, onderdeel 5°, onder c, wordt verlaagd tot het verschil tussen
      het bedrag, genoemd in artikel 33, onderdeel 5°, onder b, en het bedrag, genoemd in artikel 33, onderdeel 5°, onder
      a, indien voorafgaande aan 1 januari 2010 de verhoogde vrijstelling, bedoeld in artikel 33, eerste lid, onderdeel
      5°, zoals dat luidde op 31 december 2009, door het kind is toegepast, terwijl in de kalenderjaren 2010 tot en
      met 2016 niet de verhoogde vrijstelling, bedoeld in artikel 33, onderdeel 6°, zoals dat luidde in die jaren, of
      [artikel 33a][ref2], zoals dat luidde op 31 december 2014, is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '33'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002226
        artikel: 33a
        hoofdstuk: III
  - number: 82a.2
    text: |-
      De verhoogde vrijstelling, bedoeld in [artikel 33, onderdeel 5°][ref1], is niet van toepassing indien in een van
      de kalenderjaren 2010 tot en met 2016 de verhoogde vrijstelling, bedoeld in artikel 33, onderdelen 5° of 6°, zoals
      die luidden in die kalenderjaren, of [artikel 33a][ref2], zoals dat luidde op 31 december 2014, door het kind is
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '33'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002226
        artikel: 33a
        hoofdstuk: III
  - number: 82a.3
    text: |-
      De verhoogde vrijstelling, bedoeld in [artikel 33, onderdeel 7°][ref1], is niet van toepassing indien ter zake van
      een verkrijging van dezelfde schenker of diens partner de vrijstelling, bedoeld in [artikel 33a][ref2], zoals dat
      luidde op 31 december 2014, is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '33'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002226
        artikel: 33a
        hoofdstuk: III
  - number: '83.1'
    text: |-
      Met ingang van de eerste dag van de maand, volgende op die, waarin deze wet in het *Staatsblad* wordt geplaatst,
      treden in werking: de [Hoofdstukken I][ref1], [II][ref2] en [III][ref3], met uitzondering van artikel 20; de
      [artikelen 80][ref4], [81][ref5] - voor zoveel betreft de halvering van de grondslag der heffing en de bijvordering
      van recht ten aanzien van voor het publiek opengestelde landgoederen -[ 82][ref6] en[ 83][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002226#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0002226#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0002226#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0002226#Artikel80
      [ref5]: https://wetten.overheid.nl/BWBR0002226#Artikel81
      [ref6]: https://wetten.overheid.nl/BWBR0002226#Artikel82
      [ref7]: https://wetten.overheid.nl/BWBR0002226#Artikel83
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002226
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002226
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002226
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0002226
        artikel: '80'
        hoofdstuk: XII
      - id: ref5
        bwb_id: BWBR0002226
        artikel: '81'
        hoofdstuk: XIII
      - id: ref6
        bwb_id: BWBR0002226
        artikel: '82'
        hoofdstuk: XIII
      - id: ref7
        bwb_id: BWBR0002226
        artikel: '83'
        hoofdstuk: XIII
  - number: '83.2'
    text: |-
      De overige bepalingen van deze wet treden in werking met ingang van een door Ons te bepalen tijdstip, dat voor de
      onderscheidene bepalingen verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel83
  - number: '83.3'
    text: |-
      Op het in het eerste lid bepaalde tijdstip treden buiten werking de artikelen van de wet van 13 Mei
      1859 (*Staatsblad* no. 36), welke dezelfde onderwerpen regelen als de artikelen, waarvan het tijdstip
      van inwerkingtreding in dat lid is bepaald. De overige bepalingen van gemelde wet treden buiten werking
      onderscheidenlijk op de tijdstippen waarop de bepalingen van deze wet welke dezelfde onderwerpen regelen als
      eerstbedoelde bepalingen op de voet van het tweede lid in werking treden.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel83
  - number: '83.4'
    text: |-
      Verwijzingen naar artikelen van de in het vorige lid vermelde wet worden, zodra die artikelen buiten werking zijn
      getreden, aangemerkt als verwijzingen naar de overeenkomstige artikelen van deze wet. Verwijzingen in artikelen
      van deze wet naar andere artikelen van deze wet worden, zolang laatstbedoelde artikelen nog niet in werking zijn
      getreden, aangemerkt als verwijzingen naar de overeenkomstige artikelen van de in het vorige lid vermelde wet.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel83
  - number: '83.5'
    text: |-
      In de gevallen waarin volgens de in het derde lid vermelde wet op een aangever een bewijslast rust geldt, zolang
      de [Hoofdstukken IV tot en met VIII][ref1] van deze wet nog niet geheel van toepassing zijn, zulks in dezelfde mate
      voor de toepassing van de overeenkomstige artikelen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002226
        hoofdstuk: IV
  - number: '83.6'
    text: |-
      De bepalingen van deze wet zijn toepasselijk, indien het overlijden, de schenking of de in
      [artikel 45, derde lid, tweede zin][ref1], of [artikel 53, eerste lid][ref2], bedoelde gebeurtenis op of na het
      tijdstip van haar inwerkingtreding plaats heeft, zomede indien op of na dat tijdstip krachtens schenking wordt
      verkregen tengevolge van de vervulling van een voorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel53
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '45'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '53'
        hoofdstuk: VII
  - number: '83.7'
    text: |-
      Deze wet kan worden aangehaald als Successiewet, met vermelding van het jaar, waarin zij in het *Staatsblad* wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel83
  - number: '84.1'
    text: |-
      Wij behouden Ons voor de nummering van de artikelen van deze wet en de aanduiding van de onderdelen van die
      artikelen opnieuw vast te stellen, zulks met inachtneming van de bestaande volgorde, alsmede de aanhaling in deze
      wet van artikelen en onderdelen van artikelen daarmede in overeenstemming te brengen.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel84
  - number: '84.2'
    text: De tekst van deze wet, zoals die luidt na toepassing van het vorige lid, wordt in het *Staatsblad* geplaatst.
    url: https://wetten.overheid.nl/BWBR0002226/2021-01-01#Artikel84
