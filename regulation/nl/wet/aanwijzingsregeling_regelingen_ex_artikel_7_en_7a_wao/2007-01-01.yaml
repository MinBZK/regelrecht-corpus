  - number: '7'
    text: |-
      [ Artikel 2, tweede lid][ref1], zoals dat luidde op de dag voor inwerkingtreding van artikel IX onderdeel A, van
      de regeling van 4 september tot wijziging van enige ministeriële regelingen in verband met de inwerkingtreding van
      de Wet wijziging WW-stelsel (Stcrt. 182) blijft van toepassing met betrekking tot een recht op uitkering waarvan de
      eerste werkloosheidsdag is gelegen voor de dag van inwerkingtreding van dat onderdeel.


