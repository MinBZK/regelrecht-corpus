        artikel: '76'
  - number: '3'
    text: |-
      1 Voor de toepassing van de [WAO][ref1] en de [Wet WIA][ref2] wordt als werknemer beschouwd de persoon, die wegens
      werkloosheid niet werkt, doch aan wie geen wachtgeld als bedoeld in [artikel 2][ref3] wordt verleend:

      a. op grond van een bepaling overeenkomstig
      [artikel 19, eerste lid, onderdelen j en k, en derde lid van de WW][ref4];

      b. op grond van een bepaling overeenkomstig de [artikelen 19, eerste lid, onderdelen e en g][ref5],
      [24, eerste lid, onderdeel b][ref6], [25][ref7], en [26, eerste lid][ref8], en [27 van de WW][ref9] en de daarop
      berustende bepalingen;

      c. over de zaterdagen en zondagen.

      2 Het eerste lid, onderdeel b, is slechts van toepassing indien de periode, waarover op grond van bedoelde bepaling
      geen uitkering wordt verleend, voorafgaat aan, dan wel een onderbreking vormt van een periode, waarover wel
      uitkering wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
