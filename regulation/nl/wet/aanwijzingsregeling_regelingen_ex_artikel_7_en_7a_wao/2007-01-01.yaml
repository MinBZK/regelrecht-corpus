  - number: '6'
    text: |-
      Deze regeling treedt in werking op het tijdstip van aanvang van fase 1 van de
      [Wet overheidspersoneel onder de werknemersverzekeringen][ref1], bedoeld in [artikel 50 van die wet][ref2]. Indien
      de Staatscourant waarin deze regeling wordt geplaatst, wordt uitgegeven na vorenbedoeld tijdstip, treedt zij in
      werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij wordt geplaatst, en werkt
      zij terug tot en met vorenbedoeld tijdstip. Deze regeling vervalt op het tijdstip van aanvang van fase 3 van de
      [Wet overheidspersoneel onder de werknemersverzekeringen][ref3], bedoeld in [artikel 54 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009267
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0009267
      [ref4]: https://wetten.overheid.nl/BWBR0009267#Artikel54
