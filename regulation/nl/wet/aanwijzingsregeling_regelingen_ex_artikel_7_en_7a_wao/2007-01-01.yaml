  text: |-
    Gelet op de artikelen 7, onderdelen c en d, 7a, onderdeel b, 10, eerste lid, en 99 van de Wet op de
    arbeidsongeschiktheidsverzekering;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008484/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            WAO:

              [Wet op de arbeidsongeschiktheidsverzekering][ref1];



            b
            Wet WIA:

              [Wet werk en inkomen naar arbeidsvermogen][ref2];



            c
            WW:

              [Werkloosheidswet][ref3];



            d
            ZW:

              [Ziektewet][ref4];



            e
             wachtgeld:

              wachtgeld op grond van het [Rijkswachtgeldbesluit 1959][ref5], uitkering op grond van het
      [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref6], wachtgeld of daarmee gelijkgestelde uitkering
      op grond van de Algemene militaire pensioenwet, of een met die wachtgelden of die uitkeringen vergelijkbare
      uitkering op grond van ontslag of werkloosheid, met uitzondering van een uitkering in verband met functioneel
      leeftijdsontslag of vrijwillig vervroegd uittreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0004045
