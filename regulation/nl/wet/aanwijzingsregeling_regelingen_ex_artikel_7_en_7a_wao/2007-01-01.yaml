  - number: '2'
    text: |-
      1 Voor de toepassing van de [WAO][ref1] en de [Wet WIA][ref2] wordt als werknemer beschouwd de persoon, die wegens
      werkloosheid niet werkt, en die een wachtgeld ontvangt uit hoofde van een dienstbetrekking die is geëindigd voor 1
      januari 2001.

      2 Voor de toepassing van de [WAO][ref3] en de [Wet WIA][ref4] wordt eveneens als werknemer beschouwd de persoon,
      die wegens werkloosheid niet werkt en die een wachtgeld ontvangt uit hoofde van een dienstbetrekking die is
      geëindigd op of na 1 januari 2001, voorzover het recht op wachtgeld zich uitstrekt over een periode gelegen na het
      bereiken van de volledige uitkeringsduur van het, in verband met dezelfde werkloosheid ontstane, recht op uitkering
      op grond van de [WW][ref5], bedoeld in [hoofdstuk II van die wet][ref6], inclusief een eventuele verlenging van die
      duur op grond van [artikel 76 van die wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
