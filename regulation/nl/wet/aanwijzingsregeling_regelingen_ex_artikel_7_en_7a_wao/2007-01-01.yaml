    text: |-
      Als werkgever van de in de [artikelen 2][ref1] en [3][ref2] bedoelde werknemer wordt beschouwd de instantie die de
      daar bedoelde bezoldiging of uitkering betaalt of zou betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0008484#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008484#Artikel3
