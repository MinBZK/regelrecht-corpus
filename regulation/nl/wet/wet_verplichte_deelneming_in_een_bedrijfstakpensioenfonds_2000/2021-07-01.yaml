  - number: 1.h
    text: |-
      lichamen: rechtspersonen, maat- en vennootschappen, samenwerkingsvormen zonder rechtspersoonlijkheid die met
      verenigingen maatschappelijk gelijk kunnen worden gesteld, ondernemingen van publiekrechtelijke rechtspersonen
      en doelvermogens;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel1
  - number: 1.i
    text: |-
      verplichtstelling: de verplichte deelneming in een bedrijfstakpensioenfonds op grond van
      [artikel 2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel2
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012092
