preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in verband met modernisering van de pensioenwetgeving,
    de Wet betreffende verplichte deelneming in een bedrijfspensioenfonds in te trekken en te vervangen door een nieuwe
    wet ter zake;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: de Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel1
  - number: 1.b
    text: 'de Nederlandsche Bank: De Nederlandsche Bank N.V.;'
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel1
  - number: 1.c
    text: |-
