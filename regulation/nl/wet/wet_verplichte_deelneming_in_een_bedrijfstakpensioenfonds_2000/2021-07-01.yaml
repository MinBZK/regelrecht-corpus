  - number: '40'
    text: De Wet betreffende verplichte deelneming in een bedrijfspensioenfonds wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel40
  - number: '41'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip dat voor
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel41
  - number: '42'
    text: |-
      Deze wet wordt aangehaald als: «Wet verplichte deelneming in een bedrijfstakpensioenfonds», onder toevoeging van
      het jaartal van het Staatsblad waarin zij zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel42
