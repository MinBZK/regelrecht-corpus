  - number: 1.g
    text: |-
      deelnemer: de deelnemer, bedoeld in [artikel 1 van de Pensioenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel1
    references:
      - id: ref1
