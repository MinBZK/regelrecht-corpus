        paragraaf: '2'
  - number: 1.j
    text: |-
      nettopensioen: het nettopensioen, bedoeld in [artikel 1 van de Pensioenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
  - number: '2.1'
    text: |-
      Onze Minister kan op aanvraag van het georganiseerde bedrijfsleven binnen een bedrijfstak dat naar zijn oordeel
      een belangrijke meerderheid van de in die bedrijfstak werkzame personen vertegenwoordigt, deelneming in een
      bedrijfstakpensioenfonds voor een of meer bepaalde groepen van personen die in de betrokken bedrijfstak werkzaam
      zijn, verplichtstellen.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel2
  - number: '2.2'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel2
  - number: 2.2.a
    text: |-
      een verklaring waaruit blijkt dat de organisaties die de aanvraag doen, een belangrijke meerderheid van de in die
      bedrijfstak werkzame personen vertegenwoordigen;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel2
  - number: 2.2.b
    text: een authentiek afschrift van de akte van oprichting van het desbetreffende bedrijfstakpensioenfonds;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel2
  - number: 2.2.c
    text: een door het bestuur van het bedrijfstakpensioenfonds gewaarmerkt exemplaar van de reglementen;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel2
  - number: 2.2.d
    text: |-
      een actuariële en bedrijfstechnische nota als bedoeld in [artikel 145 van de Pensioenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '145'
  - number: 2.2.e
    text: |-
      een authentiek afschrift van de akte houdende wijziging van de statuten indien er een wijziging van de statuten
      heeft plaatsgevonden, en
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel2
  - number: 2.2.f
    text: |-
      een door het bestuur van het bedrijfstakpensioenfonds gewaarmerkt exemplaar van de wijzigingen van de reglementen
      indien er een wijziging van de reglementen heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel2
  - number: '2.3'
    text: 'Van de verplichtstelling zijn uitgesloten:'
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel2
  - number: 2.3.a
    text: |-
      arbitrale bedingen als bedoeld in [artikel 1020, vijfde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1020
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1020'
  - number: 2.3.b
    text: |-
      pensioenregelingen die niet blijven binnen de begrenzingen die zijn opgenomen in
      [artikel 18a van de Wet op de loonbelasting 1964][ref1] en die niet krachtens [artikel 19d van die wet][ref2]
      zijn aangewezen, behalve indien en zolang de in artikel 18a van die wet opgenomen begrenzingen op grond van
      [hoofdstuk VIII van die wet][ref3] op die pensioenregelingen niet van toepassing zijn of sprake is van een
      nettopensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19d
      [ref3]: https://wetten.overheid.nl/BWBR0002471#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19d
      - id: ref3
        bwb_id: BWBR0002471
        hoofdstuk: VIII
  - number: '2.4'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot de aanvraag alsmede met betrekking tot het tweede lid nadere
      regels worden gesteld, waarbij kan worden bepaald dat de indiening van de aanvraag uitsluitend langs elektronische
      weg kan geschieden, tenzij er naar het oordeel van Onze Minister sprake is van omstandigheden die zich daartegen
      verzetten.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel2
  - number: '2.5'
    text: |-
      Voor de toepassing van het derde lid, onderdeel b, zijn de [artikelen 3.18, vierde en vijfde lid][ref1], en
      [3.95, eerste lid, tweede volzin, van de Wet inkomstenbelasting 2001][ref2] alsmede de daarop berustende bepalingen
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '3.1'
    text: |-
      Zolang de verplichtstelling duurt zijn de [artikelen 4 tot en met 26][ref1] en de daarop berustende bepalingen
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel4
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '4'
        paragraaf: '3'
  - number: '3.2'
    text: |-
      Na beëindiging van de verplichtstelling blijven de [artikelen 4 tot en met 26][ref1] en de daarop berustende
      bepalingen van toepassing voorzover ze betrekking hebben op de periode waarover de verplichtstelling duurde.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel4
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '4'
        paragraaf: '3'
  - number: '4'
    text: |-
      De deelnemers alsmede, voorzover het werknemers betreft, hun werkgevers leven de statuten en reglementen en de
      daarop gebaseerde besluiten van het bestuur van het bedrijfstakpensioenfonds na.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel4
  - number: '5.1'
    text: |-
      Het bedrijfstakpensioenfonds draagt er zorg voor dat in het economisch verkeer geen ander
      lichaam bij het geven van informatie aan consumenten over financiële producten als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] gebruik maakt van een naam of het merk dat door het
      bedrijfstakpensioenfonds wordt gebruikt dan wel gebruik maakt van een naam, merk of daarmee overeenstemmend teken
      indien door dat gebruik de mogelijkheid bestaat dat bij de consument een associatie wordt gewekt tussen de naam of
      het merk van het bedrijfstakpensioenfonds en de naam, het merk of het teken dat het lichaam gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '5.2'
    text: |-
      Onder consument als bedoeld in het eerste lid wordt verstaan: een niet in de uitoefening van zijn beroep of
      bedrijf handelende natuurlijke persoon, alsmede de als werkgever in de zin van [artikel 1 van de Pensioenwet][ref1]
      handelende natuurlijke- of rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
  - number: '5.3'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel5
  - number: 5.3.a
    text: |-
      met betrekking tot het gebruik van een naam als bedoeld in het eerste lid wanneer uitsluitend informatie
      wordt gegeven over de wijze waarop financiële producten zich verhouden tot de bij het bedrijfstakpensioenfonds
      ondergebrachte pensioenregeling, waarbij geen kwalitatief oordeel wordt gegeven over de relatie van het product tot
      de betreffende pensioenregeling; of
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel5
  - number: 5.3.b
    text: |-
      indien [artikel 6, derde lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel6
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '6'
        paragraaf: '3'
  - number: '5.4'
    text: |-
      Het bedrijfstakpensioenfonds draagt de naam die of het merk dat het bedrijfstakpensioenfonds gebruikt of heeft
      gebruikt niet over aan een ander lichaam.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel5
  - number: '6.1'
    text: |-
      Het bedrijfstakpensioenfonds verstrekt gegevens betreffende een deelnemer, een gewezen deelnemer, een andere
      aanspraakgerechtigde of een pensioengerechtigde, slechts aan de desbetreffende deelnemer en zijn werkgever, de
      desbetreffende gewezen deelnemer, andere aanspraakgerechtigde of pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel6
  - number: '6.2'
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel6
  - number: 6.2.a
    text: er sprake is van een wettelijke verplichting tot gegevensverstrekking;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel6
  - number: 6.2.b
    text: gegevensverstrekking noodzakelijk is voor de uitvoering van de pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel6
  - number: 6.2.c
    text: |-
      gegevensverstrekking noodzakelijk is in verband met waardeoverdracht als bedoeld in
      [artikel 1 van de Pensioenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
  - number: 6.2.d
    text: |-
      het gegevensverstrekking betreft aan de Nederlandsche Bank voorzover deze gegevensverstrekking nodig is voor de
      vervulling van haar bij of krachtens deze wet en de [Pensioenwet][ref1] opgelegde taken; of


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: 6.2.e
    text: |-
      er sprake is van het verstrekken van naam-, adres-, en woonplaatsgegevens aan verenigingen met volledige
      rechtsbevoegdheid die als statutair doel of mede als statutair doel hebben het behartigen van de belangen van haar
      leden als belanghebbenden bij een bedrijfstakpensioenfonds.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel6
  - number: '6.3'
    text: |-
      De natuurlijke- of rechtspersoon aan wie de gegevensverstrekking, bedoeld in het tweede lid, onderdeel b,
      heeft plaatsgevonden gebruikt in het kader van de werkzaamheden uit hoofde waarvan de gegevens zijn verstrekt
      in contacten met deelnemers, gewezen deelnemers, andere aanspraakgerechtigden, pensioengerechtigden en bij het
      bedrijfstakpensioenfonds aangesloten werkgevers uitsluitend de naam of het merk van het bedrijfstakpensioenfonds.
      [Artikel 7, vierde en vijfde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel7
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '7'
        paragraaf: '3'
  - number: '6.4'
    text: |-
      In afwijking van het eerste lid kan een deelnemer, een gewezen deelnemer, een andere aanspraakgerechtigde of een
      pensioengerechtigde, het bedrijfstakpensioenfonds machtigen zijn gegevens te verstrekken aan een door hem aan te
      wijzen derde. Het bedrijfstakpensioenfonds onthoudt zich daarbij van suggesties met betrekking tot de aan te wijzen
      derde.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel6
  - number: '6.5'
    text: |-
      Indien er gegevensverstrekking als bedoeld in het tweede lid, onderdeel b of onderdeel e heeft plaatsgevonden,
      zijn het eerste, tweede en vierde lid van overeenkomstige toepassing op de natuurlijke- of rechtspersoon aan wie
      de gegevens zijn verstrekt. Indien de rechtspersoon naast de werkzaamheden uit hoofde waarvan de gegevens zijn
      verstrekt ook andere werkzaamheden verricht, wordt bij de toepassing van het vierde lid, de rechtspersoon als derde
      aangemerkt voor zover het de andere werkzaamheden betreft.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel6
  - number: '6.6'
    text: |-
      Het eerste lid is niet van toepassing indien het gegevensverstrekking betreft aan in dezelfde bedrijfstak werkzame
      fondsen voor vervroegd uittreden. Indien in verband met de uitvoering van de pensioenregeling gegevensverstrekking
      als bedoeld in het tweede lid, onderdeel b, heeft plaatsgevonden kan de natuurlijke- of rechtspersoon aan wie
      de gegevens zijn verstrekt de gegevensverstrekking, bedoeld in de eerste zin, verrichten na machtiging door het
      bedrijfstakpensioenfonds. Het eerste, tweede en vierde lid zijn van overeenkomstige toepassing op de fondsen aan
      wie de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel6
  - number: '7.1'
    text: |-
      Behoudens het geven van algemene informatie, geeft het bedrijfstakpensioenfonds deelnemers, gewezen deelnemers,
      andere aanspraakgerechtigden, pensioengerechtigden en de bij het bedrijfstakpensioenfonds aangesloten werkgevers
      slechts informatie over regelingen die door het bedrijfstakpensioenfonds zelf worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel7
  - number: '7.2'
    text: |-
      Het bedrijfstakpensioenfonds hanteert gelijke voorwaarden voor alle aanbieders van reclame-uitingen in
      informatiedragers van het bedrijfstakpensioenfonds. Deze voorwaarden worden op een voor een ieder toegankelijke
      wijze gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel7
  - number: '7.3'
    text: |-
      Indien er in verband met de uitvoering van een pensioenregeling gegevensverstrekking als bedoeld in
      [artikel 6, tweede lid, onderdeel b][ref1], heeft plaatsgevonden, is het eerste lid van overeenkomstige toepassing
      op de natuurlijke- of rechtspersoon aan wie de gegevens zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel6
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '6'
        paragraaf: '3'
  - number: '7.4'
    text: |-
      Indien er in verband met de uitvoering van een pensioenregeling gegevensverstrekking als bedoeld in
      [artikel 6, tweede lid, onderdeel b][ref1], heeft plaatsgevonden, mag, in afwijking van artikel 6, derde lid, in
      contacten met deelnemers, gewezen deelnemers, andere aanspraakgerechtigden, pensioengerechtigden en de bij het
      bedrijfstakpensioenfonds aangesloten werkgevers wel de naam worden vermeld van de natuurlijke- of rechtspersoon aan
      wie de gegevens zijn verstrekt. De natuurlijke- of rechtspersoon, bedoeld in de vorige zin, kan in contacten met
      bij het bedrijfstakpensioenfonds aangesloten werkgevers informatie dan wel gecombineerde nota’s verstrekken mede
      op naam van en met andere in dezelfde bedrijfstak werkzame fondsen die werkzaamheden hebben uitbesteed aan deze
      natuurlijke- of rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel6
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '6'
        paragraaf: '3'
  - number: '7.5'
    text: |-
      In afwijking van het eerste lid kan het bedrijfstakpensioenfonds samen met andere bedrijfstakpensioenfondsen
      dan wel samen met in dezelfde bedrijfstak werkzame fondsen voor vervroegd uittreden informatie verstrekken over
      activiteiten in verband met pensioenuitkeringen en werkzaamheden die daarmee verband houden.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel7
  - number: '8.1'
    text: |-
      De door of voor de deelnemers verschuldigde bijdrage is voor alle deelnemers gelijk of bedraagt voor alle
      deelnemers een gelijk percentage van het loon dan wel van het gedeelte van het loon dat voor de pensioenberekening
      in aanmerking wordt genomen, met dien verstande dat er voor verschillende vormen van pensioen en voor verschillende
      pensioenregelingen verschillende bijdragen kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel8
  - number: '8.2'
    text: |-
      Het eerste lid is niet van toepassing op de door of voor deelnemers verschuldigde bijdragen ten behoeve van
      vrijwillige pensioenvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel8
  - number: '8.3'
    text: |-
      In afwijking van het eerste lid worden voor verschillende pensioenregelingen die worden uitgevoerd door hetzelfde
      bedrijfstakpensioenfonds geen verschillende bijdragen vastgesteld indien die pensioenregelingen dezelfde of
      nagenoeg dezelfde inhoud hebben.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel8
  - number: '8.4'
    text: |-
      Het derde lid is niet van toepassing indien bij een bedrijfstakpensioenfonds sprake is van een regeling die voor
      alle deelnemers geldt en de actuariële waarde van de uit die regeling voortvloeiende verplichtingen ten minste
      tweederde van de actuariële waarde van de uit het totaal van de pensioenregelingen van het fonds anders dan
      regelingen voor nabestaanden- of invaliditeitspensioen, voortvloeiende verplichtingen met uitzondering van de uit
      de vrijwillige pensioenvoorzieningen voortvloeiende verplichtingen, betreft.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel8
  - number: '9.1'
    text: |-
      Indien een wijziging van de statuten heeft plaatsgevonden zendt het bestuur van het bedrijfstakpensioenfonds een
      authentiek afschrift van de akte houdende wijziging van de statuten, binnen twee weken nadat de notariële akte
      inzake die wijziging is verleden aan de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel9
  - number: '9.2'
    text: |-
      Indien een wijziging van de reglementen heeft plaatsgevonden zendt het bestuur van het bedrijfstakpensioenfonds
      een door het bestuur gewaarmerkt exemplaar houdende wijziging van de reglementen, binnen twee weken na de
      totstandkoming daarvan aan de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de Nederlandsche Bank van mening is dat de statuten of reglementen in strijd zijn met enig wettelijk
      voorschrift doet zij daarvan mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel9
  - number: '9.4'
    text: |-
      Indien de gewijzigde statuten of reglementen op grond van het feit dat zij in strijd zijn met enig wettelijk
      voorschrift wederom gewijzigd worden, is het bedrijfstakpensioenfonds gehouden om de kosten te vergoeden die in
      verband met die wijziging van de statuten of reglementen zijn gemaakt door een werkgever of een pensioenuitvoerder
      om te kunnen blijven voldoen aan de voorschriften die zijn verbonden aan een vrijstelling op grond van
      [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel13
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '13'
        paragraaf: '3'
  - number: '10.1'
    text: |-
      Onze Minister kan op aanvraag van het georganiseerde bedrijfsleven binnen een bedrijfstak dat naar zijn oordeel
      een belangrijke meerderheid van de in die bedrijfstak werkzame personen vertegenwoordigt, de verplichtstelling
      wijzigen. [Artikel 2, tweede lid, onderdelen a, d, e en f, derde lid, vierde lid en vijfde lid][ref1], is van
      overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel2
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '2'
        paragraaf: '2'
  - number: '10.2'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot het eerste lid nadere regels worden gesteld, waarbij kan worden
      bepaald dat de indiening van de aanvraag uitsluitend langs elektronische weg kan geschieden, tenzij er naar het
      oordeel van Onze Minister sprake is van omstandigheden die zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan de verplichtstelling ambtshalve voor alle of voor een of meer bepaalde groepen van deelnemers
      intrekken. De Minister kan de verplichtstelling in ieder geval ambtshalve intrekken, indien het betreft een
      pensioenregeling als bedoeld in [artikel 2, derde lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel2
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '2'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Onze Minister kan op aanvraag van het georganiseerde bedrijfsleven binnen een bedrijfstak dat naar zijn oordeel
      een belangrijke meerderheid van de in die bedrijfstak werkzame personen vertegenwoordigt, de verplichtstelling voor
      alle deelnemers in die bedrijfstak intrekken.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel11
  - number: '11.3'
    text: |-
      Onze Minister kan op aanvraag van het georganiseerde bedrijfsleven binnen een bedrijfstak dat naar zijn oordeel een
      belangrijke meerderheid van de in die bedrijfstak werkzame personen vertegenwoordigt, de verplichtstelling voor een
      deel van de deelnemers die in de bedrijfstak werkzaam zijn, intrekken.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel11
  - number: '11.4'
    text: |-
      Bij de intrekking kunnen door Onze Minister ter bescherming van de rechten van de deelnemers of gewezen deelnemers
      voorschriften worden gegeven met betrekking tot de rechten en verplichtingen van de deelnemers, gewezen deelnemers
      of hun werkgevers.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel11
  - number: '11.5'
    text: |-
      De aanvraag, bedoeld in het tweede lid, gaat vergezeld van een verklaring waaruit blijkt dat de organisaties die de
      aanvraag doen, een belangrijke meerderheid van de in die bedrijfstak werkzame personen vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel11
  - number: '11.6'
    text: |-
      De aanvraag, bedoeld in het derde lid, gaat vergezeld van een verklaring waaruit blijkt dat de organisaties
      die de aanvraag doen, een belangrijke meerderheid van de in dat deel van die bedrijfstak werkzame personen
      vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel11
  - number: '11.7'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot de aanvraag alsmede met betrekking tot het vijfde en zesde
      lid nadere regels worden gesteld, waarbij kan worden bepaald dat de indiening van de aanvraag uitsluitend langs
      elektronische weg kan geschieden, tenzij er naar het oordeel van Onze Minister sprake is van omstandigheden die
      zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel11
  - number: '12.1'
    text: |-
      Op verzoek van Onze Minister toont het georganiseerde bedrijfsleven in de betrokken bedrijfstak binnen acht
      weken na dat verzoek aan dat het georganiseerde bedrijfsleven dat voortzetting van de verplichtstelling wenst,
      naar het oordeel van Onze Minister, een belangrijke meerderheid van de in die bedrijfstak werkzame personen
      vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister doet het verzoek, bedoeld in het eerste lid, ten minste acht weken voordat er vijf jaren zijn
      verstreken sinds de datum waarop voor het laatst is gebleken dat het georganiseerde bedrijfsleven in de betrokken
      bedrijfstak dat de verplichtstelling wenst, naar het oordeel van Onze Minister, een belangrijke meerderheid van de
      in die bedrijfstak werkzame personen vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel12
  - number: '12.3'
    text: |-
      Als de datum waarop voor het laatst is gebleken dat het georganiseerde bedrijfsleven binnen de betrokken
      bedrijfstak dat de verplichtstelling wenst, naar het oordeel van Onze Minister, een belangrijke meerderheid van de
      in die bedrijfstak werkzame personen vertegenwoordigt, wordt aangemerkt:
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel12
  - number: 12.3.a
    text: de datum waarop de verplichtstelling is opgelegd;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel12
  - number: 12.3.b
    text: de datum waarop de verplichtstelling is gewijzigd, of
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel12
  - number: 12.3.c
    text: |-
      de datum waarop na het verzoek van Onze Minister, bedoeld in het eerste of vijfde lid, is aangetoond dat het
      georganiseerde bedrijfsleven binnen de betrokken bedrijfstak dat de verplichtstelling wenst, naar het oordeel van
      Onze Minister een belangrijke meerderheid van de in die bedrijfstak werkzame personen vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel12
  - number: '12.4'
    text: |-
      Indien het georganiseerde bedrijfsleven binnen de betrokken bedrijfstak niet binnen acht weken na het verzoek,
      bedoeld in het eerste lid, heeft aangetoond dat het georganiseerde bedrijfsleven in de betrokken bedrijfstak dat de
      verplichtstelling wenst, naar het oordeel van Onze Minister, een belangrijke meerderheid van de in die bedrijfstak
      werkzame personen vertegenwoordigt, doet Onze Minister daarvan mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel12
  - number: '12.5'
    text: |-
      Acht weken voordat er twee jaren zijn verstreken sinds de mededeling, bedoeld in het vierde lid, doet Onze
      Minister opnieuw een verzoek als bedoeld in het eerste lid. Indien het georganiseerde bedrijfsleven in de
      betrokken bedrijfstak, binnen acht weken na dat verzoek niet aantoont dat het georganiseerde bedrijfsleven dat de
      verplichtstelling wenst, naar het oordeel van Onze Minister, een belangrijke meerderheid van de in die bedrijfstak
      werkzame personen vertegenwoordigt, trekt Onze Minister de verplichtstelling met betrekking tot die bedrijfstak in.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel12
  - number: '12.6'
    text: |-
      In afwijking van het vijfde lid trekt Onze Minister de verplichtstelling niet in zolang tegen die intrekking
      overwegende bezwaren bestaan in verband met de bescherming van de rechten van de deelnemers of gewezen deelnemers.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel12
  - number: '12.7'
    text: |-
      Bij de intrekking kunnen door Onze Minister ter bescherming van de rechten van de deelnemers of gewezen deelnemers
      voorschriften worden gegeven met betrekking tot de rechten en verplichtingen van de deelnemers, gewezen deelnemers
      of hun werkgevers.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel12
  - number: '12.8'
    text: Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel12
  - number: '13.1'
    text: |-
      Het bedrijfstakpensioenfonds heeft tot taak het verlenen en het intrekken van vrijstellingen van de
      verplichtstelling.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel13
  - number: '13.2'
    text: Het bedrijfstakpensioenfonds kan aan de vrijstelling voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel13
  - number: '13.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de gevallen waarin en de
      voorwaarden waaronder het bedrijfstakpensioenfonds vrijstelling van de verplichtstelling verleent, kan verlenen,
      intrekt en kan intrekken alsmede met betrekking tot de voorschriften die het bedrijfstakpensioenfonds aan de
      vrijstelling kan verbinden. Tevens kunnen regels worden gesteld met betrekking tot de procedure.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel13
  - number: '14.1'
    text: |-
      Van de verplichtstelling, wordt op zijn aanvraag, door het bedrijfstakpensioenfonds vrijgesteld de persoon die
      gemoedsbezwaren heeft tegen iedere vorm van verzekering, alsmede de rechtspersoon waarbij natuurlijke personen
      betrokken zijn, die zodanige bezwaren hebben.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel14
  - number: '14.2'
    text: |-
      Bij ministeriële regeling worden met betrekking tot het eerste lid nadere regels gesteld. Bij ministeriële regeling
      worden tevens regels gesteld betreffende de gevolgen van de vrijstelling, alsmede betreffende de intrekking van
      de vrijstelling.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel14
  - number: '15.1'
    text: |-
      Onverminderd [artikel 97, tweede lid, van de Pensioenwet][ref1] kan Onze Minister een persoon die slechts tijdelijk
      in Nederland werkzaam is, op aanvraag in een bijzonder, individueel geval voorwaardelijk of onvoorwaardelijk en al
      of niet voor een bepaalde tijd ontheffing verlenen van de verplichtstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel97
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '97'
  - number: '15.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels met betrekking tot de aanvraag worden gesteld, waarbij voor de
      indiening van de aanvraag kan worden bepaald dat deze uitsluitend langs elektronische weg kan geschieden, tenzij er
      naar het oordeel van Onze Minister sprake is van omstandigheden die zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel15
  - number: '16.1'
    text: 'Onze Minister doet mededeling in de Staatscourant van:'
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel16
  - number: 16.1.a
    text: een aanvraag tot verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel16
  - number: 16.1.b
    text: een verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel16
  - number: 16.1.c
    text: een aanvraag betreffende wijziging van de verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel16
  - number: 16.1.d
    text: een wijziging van de verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel16
  - number: 16.1.e
    text: een aanvraag tot intrekking van een verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel16
  - number: 16.1.f
    text: een voornemen tot ambtshalve intrekking van een verplichtstelling, en
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel16
  - number: 16.1.g
    text: een intrekking van een verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel16
  - number: 16.1.h
    text: het niet verder in behandeling nemen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel16
  - number: '16.2'
    text: |-
      Bij de mededelingen, bedoeld in het eerste lid, onderdelen a, c, e en f, vermeldt Onze Minister de termijn
      waarbinnen zienswijzen tegen de inhoud van hetgeen is meegedeeld schriftelijk bij hem naar voren kunnen worden
      gebracht. Bij ministeriële regeling kan worden bepaald dat de indiening van de zienswijze uitsluitend langs
      elektronische weg kan plaatsvinden, tenzij er naar het oordeel van Onze Minister sprake is van omstandigheden die
      zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel16
  - number: 16a
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is niet van toepassing op bedrijfstakpensioenfondsen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '17.1'
    text: |-
      Het toezicht op de uitvoering van de [artikelen 5][ref1], [6][ref2], [7][ref3], [8][ref4] en
      [9, eerste en tweede lid][ref5], berust bij de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012092#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0012092#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0012092#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0012092#Artikel9
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012092
        artikel: '6'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0012092
        artikel: '7'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0012092
        artikel: '8'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0012092
        artikel: '9'
        paragraaf: '3'
  - number: '17.2'
    text: |-
      De [artikelen 152][ref1], [153][ref2], [163 tot en met 166a][ref3] en [188 tot en met 191 van de Pensioenwet][ref4]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel153
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel163
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel188
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '152'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '153'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '163'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '188'
  - number: '18.1'
    text: |-
      De Nederlandsche Bank kan een last onder dwangsom opleggen ter zake van een overtreding van de voorschriften,
      gesteld bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel18
  - number: '18.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld ter zake van de uitoefening van de bevoegdheid tot het
      opleggen van een last onder dwangsom.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel18
  - number: '19.1'
    text: |-
      De Nederlandsche Bank kan een bestuurlijke boete opleggen ter zake van overtreding van voorschriften, gesteld bij
      de [artikelen 5][ref1], [6][ref2], [7][ref3], [8][ref4] en [9, eerste en tweede lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012092#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0012092#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0012092#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0012092#Artikel9
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012092
        artikel: '6'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0012092
        artikel: '7'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0012092
        artikel: '8'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0012092
        artikel: '9'
        paragraaf: '3'
  - number: '19.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitoefening van de bevoegdheid,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel19
  - number: '19.3'
    text: |-
      [Artikel 184 van de Pensioenwet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel184
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '184'
  - number: '20.1'
    text: |-
      Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur, met dien verstande dat
      de bestuurlijke boete voor een afzonderlijke overtreding ten hoogste € 4 000 000 bedraagt. Indien tijdens het
      plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een bestuurlijke boete aan de
      overtreder ter zake van eenzelfde overtreding, wordt het bedrag van de bestuurlijke boete, bedoeld in de eerste
      volzin, voor een afzonderlijke overtreding verdubbeld.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel20
  - number: '20.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalt bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen bestuurlijke boete. De overtredingen worden gerangschikt in categorieën naar
      zwaarte van de overtreding met de daarbij behorende basisbedragen, minimumbedragen en maximumbedragen. Daarbij
      wordt de volgende indeling gebruikt:








                    Categorie


                    Basisbedrag


                    Minimumbedrag


                    Maximumbedrag






                    1


                    € 10 000,–


                    € 0,–


                    € 10 000,–




                    2


                    € 500 000,–


                    € 0,–


                    € 1 000 000,–




                    3


                    € 2 000 000,–


                    € 0,–


                    € 4 000 000,–
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel20
  - number: '20.3'
    text: |-
      In afwijking van het eerste en tweede lid kan de toezichthouder de hoogte van de bestuurlijke boete vaststellen
      op ten hoogste twee keer het bedrag van het voordeel dat de overtreder door de overtreding heeft verkregen indien
      diens voordeel groter is dan € 2 000 000.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel20
  - number: '21.1'
    text: |-
      Indien een bijdrage na aanmaning per aangetekende brief niet of niet geheel binnen dertig dagen wordt voldaan
      kan het bedrijfstakpensioenfonds, vertegenwoordigd door de personen die op grond van de statuten van het
      bedrijfstakpensioenfonds bevoegd zijn het fonds in rechte te vertegenwoordigen, de premie, wettelijke of
      reglementaire renten of reglementaire boete en de aanmaningskosten invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel21
  - number: '21.2'
    text: |-
      De in het eerste lid bedoelde aanmaning vermeldt de inhoud van het eerste en vierde tot en met het achtste lid van
      dit artikel en van [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel4
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '4'
        paragraaf: '3'
  - number: '21.3'
    text: 'Het dwangbevel houdt in:'
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel21
  - number: 21.3.a
    text: de naam en de zetel van het bedrijfstakpensioenfonds;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel21
  - number: 21.3.b
    text: de namen van de vertegenwoordigers, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel21
  - number: 21.3.c
    text: de naam, het beroep, de woonplaats en het adres van de schuldenaar;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel21
  - number: 21.3.d
    text: |-
      het bedrag van de achterstallige bijdragen, dat van de wettelijke of reglementaire renten of reglementaire boeten,
      voorzover daarop aanspraak wordt gemaakt en de aanmaningskosten voorzover daarop aanspraak wordt gemaakt, alsmede
      de gronden waarop de vordering berust;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel21
  - number: 21.3.e
    text: de datum waarop de in het eerste lid bedoelde aanmaning is geschied.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel21
  - number: '21.4'
    text: |-
      Het dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] kan worden ten uitvoer gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '21.5'
    text: |-
      Het dwangbevel kan niet ten uitvoer worden gelegd voordat acht dagen na de betekening daarvan zijn verstreken. De
      persoon of rechtspersoon aan wie het dwangbevel is gericht kan gedurende dertig dagen na de betekening door het
      instellen van een vordering tegen de tenuitvoerlegging van een dwangbevel in verzet komen bij de kantonrechter van
      de rechtbank van het arrondissement waarin hij woont of is gevestigd. Indien de persoon of de rechtspersoon buiten
      Nederland woont of is gevestigd dan wel in Nederland geen vaste woonplaats of plaats van vestiging heeft, kan hij
      in verzet komen bij de kantonrechter van de rechtbank van het arrondissement waarin het kantoor is gevestigd van
      het bedrijfstakpensioenfonds.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel21
  - number: '21.6'
    text: Het verzet schorst de tenuitvoerlegging van het dwangbevel voorzover deze door het verzet wordt bestreden.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel21
  - number: '21.7'
    text: |-
      Indien het verzet zich richt of mede richt tegen de hoogte van de gevorderde reglementaire rente of reglementaire
      boete, kan de rechter indien deze hem bovenmatig voorkomt, de bedongen reglementaire rente of reglementaire boete
      matigen, met dien verstande dat deze niet minder kan bedragen dan de wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel21
  - number: '21.8'
    text: Het recht tot invorderen bij dwangbevel strekt zich uit tot de kosten van vervolging.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel21
  - number: '22.1'
    text: 'Hoofdelijk aansprakelijk is voor de bijdragen ter zake van deelneming in een bedrijfstakpensioenfonds:'
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel22
  - number: 22.1.a
    text: |-
      verschuldigd door een niet binnen Nederland wonende of gevestigde werkgever: de leider van zijn vaste inrichting
      binnen Nederland, zijn binnen Nederland wonende of gevestigde vaste vertegenwoordiger, dan wel de persoon, die de
      leiding heeft van de hier te lande verrichte werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel22
  - number: 22.1.b
    text: 'verschuldigd door twee of meer werkgevers: ieder van die werkgevers;'
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel22
  - number: 22.1.c
    text: |-
      verschuldigd door een lichaam zonder rechtspersoonlijkheid of door een rechtspersoonlijkheid bezittend lichaam dat
      niet volledig rechtsbevoegd is: ieder van de bestuurders.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel22
  - number: '22.2'
    text: |-
      Indien een bestuurder van een lichaam zelf een lichaam is, wordt onder bestuurder mede verstaan ieder van de
      bestuurders van laatstbedoeld lichaam.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel22
  - number: '22.3'
    text: |-
      [Artikel 21][ref1] is ten aanzien van de persoon, die krachtens dit artikel hoofdelijk aansprakelijk is, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel21
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '21'
        paragraaf: '5'
  - number: '23.1'
    text: |-
      Hoofdelijk aansprakelijk is voor de bijdragen ter zake van deelneming in een bedrijfstakpensioenfonds verschuldigd
      door een rechtspersoonlijkheid bezittend lichaam dat volledig rechtsbevoegd is, voorzover het aan de heffing van
      vennootschapsbelasting is onderworpen: ieder van de bestuurders overeenkomstig het tweede tot en met het twaalfde
      lid.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
  - number: '23.2'
    text: |-
      Het lichaam, bedoeld in het eerste lid, doet onverwijld nadat gebleken is, dat het niet tot betaling in staat
      is, daarvan mededeling aan het bedrijfstakpensioenfonds en, indien het bedrijfstakpensioenfonds dit verlangt,
      verstrekt het nadere inlichtingen en legt het stukken over. Elke bestuurder is bevoegd om namens het lichaam aan
      deze verplichting te voldoen. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met
      betrekking tot de inhoud van de mededeling, de aard en de inhoud van de te verstrekken inlichtingen en de over te
      leggen stukken alsmede de termijnen waarbinnen het doen van de mededeling, het verstrekken van de inlichtingen en
      het overleggen van de stukken dienen te geschieden.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
  - number: '23.3'
    text: |-
      Indien het lichaam op juiste wijze aan zijn in het tweede lid bedoelde verplichting heeft voldaan, is een
      bestuurder aansprakelijk indien aannemelijk is dat het niet betalen van de bijdragen het gevolg is van aan hem te
      wijten kennelijk onbehoorlijk bestuur in de periode van drie jaar voorafgaande aan het tijdstip van de mededeling.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
  - number: '23.4'
    text: |-
      Indien het lichaam niet of niet op de juiste wijze aan zijn in het tweede lid bedoelde verplichting heeft voldaan,
      is een bestuurder op voet van het derde lid aansprakelijk met dien verstande dat vermoed wordt dat de niet-betaling
      aan hem is te wijten en dat de periode van drie jaar geacht wordt in te gaan op het tijdstip waarop het lichaam in
      gebreke is. Tot de weerlegging van het vermoeden wordt slechts toegelaten de bestuurder die aannemelijk maakt dat
      het niet aan hem te wijten is dat het lichaam niet aan zijn in het tweede lid bedoelde verplichting heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
  - number: '23.5'
    text: De bestuurder kan slechts worden aangesproken indien het lichaam met de betaling van de bijdragen in gebreke is.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
  - number: '23.6'
    text: 'Voor de toepassing van dit artikel wordt onder bestuurder mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
  - number: 23.6.a
    text: de gewezen bestuurder tijdens wiens bestuur de bijdragenschuld is ontstaan;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
  - number: 23.6.b
    text: |-
      de persoon ten aanzien van wie aannemelijk is dat hij het beleid van het lichaam heeft bepaald of mede heeft
      bepaald als ware hij bestuurder, met uitzondering van de door de rechter benoemde bewindvoerder;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
  - number: 23.6.c
    text: |-
      ieder van de met de vereffening belaste personen ingeval het lichaam is ontbonden, met uitzondering van de door de
      rechter benoemde vereffenaar;
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
  - number: 23.6.d
    text: 'indien een bestuurder van een lichaam een lichaam is: ieder van de bestuurders van laatstbedoeld lichaam.'
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
  - number: '23.7'
    text: De tweede zin van het vierde lid is niet van toepassing op de gewezen bestuurder.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
  - number: '23.8'
    text: |-
      Indien het bedrijfstakpensioenfonds een bestuurder hoofdelijk aansprakelijk stelt, doet het hem daarvan
      schriftelijk mededeling. De mededeling bevat de gronden waarop de aansprakelijkheid van de bestuurder berust.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
  - number: '23.9'
    text: |-
      De persoon die hoofdelijk aansprakelijk is gesteld, kan ter zake van de hoogte van de door het lichaam aan het
      bedrijfstakpensioenfonds verschuldigde bijdragen geen vordering bij de rechter instellen, indien daaromtrent een
      onherroepelijk rechterlijk vonnis is gewezen in een door het lichaam of door een of meer andere aansprakelijk
      gestelde bestuurders ingestelde vordering.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
  - number: '23.10'
    text: |-
      Na het overlijden van de bestuurder zijn de erfgenamen niet aansprakelijk als het bedrijfstakpensioenfonds niet
      vóór het overlijden de bestuurder bij schriftelijke mededeling aansprakelijk heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
  - number: '23.11'
    text: |-
      Indien de bestuurder van het lichaam op grond van dit artikel aansprakelijk is en niet in staat is tot betaling van
      zijn schuld ter zake, zijn de door die bestuurder onverplicht verrichte rechtshandelingen waardoor de mogelijkheid
      tot verhaal op hem is verminderd, vernietigbaar en kan het bedrijfstakpensioenfonds deze vernietigingsgrond
      inroepen, indien aannemelijk is dat deze geheel of nagenoeg geheel met dat oogmerk zijn verricht.
      [Artikel 45, vierde en vijfde lid, van Boek 3 van het Burgerlijk Wetboek][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel45
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '45'
  - number: '23.12'
    text: |-
      [Artikel 21][ref1] is ten aanzien van de persoon die krachtens dit artikel hoofdelijk aansprakelijk is, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel21
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '21'
        paragraaf: '5'
  - number: '24.1'
    text: |-
      Indien verhaal op het lichaam door de persoon die op grond van [artikel 23][ref1] bijdragen heeft voldaan geheel
      of gedeeltelijk onmogelijk blijkt en twee of meer personen op grond van dat artikel hoofdelijk aansprakelijk zijn,
      dragen deze onderling voor gelijke delen in het onverhaald gebleven deel bij. De persoon die meer heeft voldaan dan
      zijn aandeel, heeft voor het meerdere verhaal op de persoon die minder dan zijn aandeel heeft voldaan. Een tekort
      veroorzaakt doordat een of meer van hen geen verhaal biedt onderscheidenlijk bieden, wordt voor gelijke delen
      onderscheidenlijk naar evenredigheid van de gedeelten waarvoor de schuld ieder van hen aanging over de anderen
      verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel23
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '23'
        paragraaf: '5'
  - number: '24.2'
    text: Ieder die heeft bijgedragen, blijft gerechtigd het bijgedragene alsnog van het lichaam terug te vorderen.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel24
  - number: '24.3'
    text: Van het eerste en het tweede lid kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel24
  - number: '25'
    text: |-
      Van burgerlijke rechtsvorderingen ter zake van deelneming in en uitkering uit een bedrijfstakpensioenfonds neemt de
      kantonrechter kennis.
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel25
  - number: '39.1'
    text: |-
      Op een aanvraag tot het verplichtstellen van deelneming in een bepaald bedrijfstakpensioenfonds ontvangen voor de
      inwerkingtreding van [artikel 2, eerste lid][ref1], beslist Onze Minister volgens het ten tijde van de ontvangst
      van de aanvraag geldende recht.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel2
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '2'
        paragraaf: '2'
  - number: '39.2'
    text: |-
      Op bezwaar- en beroepschriften die zijn ingediend voor de inwerkingtreding van [artikel 2, eerste lid][ref1], wordt
      beslist op grond van het ten tijde van de indiening geldende recht.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel2
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '2'
        paragraaf: '2'
  - number: '39.3'
    text: |-
      Een verplichting tot het deelnemen in een fonds op grond van artikel 3, eerste lid, van de Wet betreffende
      verplichte deelneming in een bedrijfspensioenfonds, zoals dat luidde op de dag voorafgaand aan de
      inwerkingtreding van [artikel 2, eerste lid][ref1], wordt aangemerkt als een verplichtstelling op grond van
      [artikel 2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012092#Artikel2
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012092
        artikel: '2'
        paragraaf: '2'
  - number: '39.4'
    text: |-
      Een vrijstelling die is verleend op grond van artikel 16 van de Wet betreffende verplichte deelneming in een
      bedrijfspensioenfonds, zoals dat luidde op de dag voorafgaand aan de inwerkingtreding van [artikel 15][ref1] wordt
      aangemerkt als een ontheffing op grond van [artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0012092#Artikel15
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '15'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012092
        artikel: '15'
        paragraaf: '3'
  - number: '39.5'
    text: |-
      Een vrijstelling als bedoeld in artikel 1, onderdeel b, van de Vrijstellingsregeling Wet Bpf, zoals dat luidde op
      de dag voorafgaand aan de inwerkingtreding van [artikel 13][ref1] wordt aangemerkt als een vrijstelling als bedoeld
      in [artikel 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0012092#Artikel13
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '13'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012092
        artikel: '13'
        paragraaf: '3'
  - number: '39.6'
    text: |-
      Een vrijstelling als bedoeld in artikel 1, eerste lid, van de regeling van de Minister van Sociale Zaken van 17
      december 1949, nr. 2602 tot vaststelling van richtlijnen met betrekking tot het bepaalde in het tweede lid, onder
      II, letter k, van artikel 5 der Wet betreffende verplichte deelneming in een bedrijfspensioenfonds (Stcrt. 249),
      zoals dat luidde op de dag voorafgaand aan de inwerkingtreding van [artikel 14, eerste lid][ref1], wordt aangemerkt
      als een vrijstelling als bedoeld in [artikel 14, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0012092#Artikel14
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '14'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012092
        artikel: '14'
        paragraaf: '3'
  - number: '39.8'
    text: |-
      Ten aanzien van bedrijfstakpensioenfondsen die voor de inwerkingtreding van [artikel 12, eerste lid][ref1],
      zijn verplichtgesteld, doet Onze Minister de eerste keer het verzoek, bedoeld in [artikel 12, eerste lid][ref2],
      ten minste acht weken voordat er vijf jaren zijn verstreken sinds de datum van inwerkingtreding van
      [artikel 12, eerste lid][ref3], tenzij er na de inwerkingtreding van [artikel 12, eerste lid][ref4], een wijziging
      van de verplichtstelling heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0012092#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0012092#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0012092#Artikel12
    url: https://wetten.overheid.nl/BWBR0012092/2021-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '12'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012092
        artikel: '12'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0012092
        artikel: '12'
