---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: boswet
regulatory_layer: WET
publication_date: '2016-01-19'
valid_from: '2013-01-01'
bwb_id: BWBR0002357
url: https://wetten.overheid.nl/BWBR0002357/2013-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen vast te stellen ter bewaring van bossen
    en andere houtopstanden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Deze wet verstaat onder: Onze Minister: Onze Minister van Economische Zaken, Landbouw en Innovatie; eigenaar: hij,
      die krachtens eigendom of een beperkt recht het genot heeft van grond; dunning: velling, welke uitsluitend als een
      verzorgingsmaatregel ter bevordering van de groei van de overblijvende houtopstand moet worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van deze wet wordt onder herbeplanten mede begrepen herbebossen en wordt onder vellen mede
      begrepen rooien alsmede het verrichten van handelingen, welke de dood of ernstige beschadiging van houtopstand ten
      gevolge kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel1
  - number: '1.3'
    text: Het periodieke vellen van griend- en hakhout wordt voor de toepassing van deze wet niet onder vellen begrepen.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel1
  - number: '1.4'
    text: |-
      De hierna volgende artikelen van deze wet zijn, behoudens het bepaalde in [afdeling VII][ref1], niet van toepassing
      op:


      [ref1]: https://wetten.overheid.nl/BWBR0002357#AfdelingVII
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002357
        afdeling: VII
  - number: 1.4.a
    text: houtopstanden op erven en in tuinen;
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel1
  - number: 1.4.b
    text: andere houtopstanden dan op erven en in tuinen binnen een bebouwde kom als bedoeld in het volgende lid;
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel1
  - number: 1.4.c
    text: |-
      wegbeplantingen en eenrijige beplantingen op of langs landbouwgronden, beide voorzover bestaande uit populieren
      of wilgen;
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel1
  - number: 1.4.d
    text: Italiaanse populier, linde, paardenkastanje en treurwilg;
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel1
  - number: 1.4.e
    text: vruchtbomen en windschermen om boomgaarden;
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel1
  - number: 1.4.f
    text: |-
      fijnsparren, niet ouder dan twaalf jaren, bestemd om te dienen als kerstbomen en geteeld op daarvoor in het
      bijzonder bestemde terreinen;
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel1
  - number: 1.4.g
    text: kweekgoed.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel1
  - number: '1.5'
    text: |-
      De gemeenteraad stelt bij besluit vast, welke voor de toepassing van deze wet de grenzen van de bebouwde kom of
      kommen der gemeente zijn. Het ontwerp van het door de gemeenteraad te nemen besluit ligt gedurende dertig dagen ter
      gemeentesecretarie voor een ieder ter inzage. De burgemeester maakt de nederlegging tevoren in de *Staatscourant*,
      in één of meer dag- of nieuwsbladen, die in de gemeente verspreid worden, en voorts op de gebruikelijke wijze
      bekend.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel1
  - number: '2.1'
    text: |-
      Hij, die het voornemen heeft om tot vellen of doen vellen van houtopstand, anders dan bij wijze van dunning, over
      te gaan, is verplicht van dat voornemen ten minste één maand doch niet langer dan één jaar tevoren door toezending
      van een formulier, dat als aangetekend stuk wordt verzonden, kennis te geven aan Onze Minister alsmede, zo hij niet
      de eigenaar is van de te ontbloten grond, ook aan deze laatste. Onze Minister stelt het model voor dit formulier
      vast. Onze Minister zendt onverwijld een bevestiging van de ontvangst van de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel2
  - number: '2.2'
    text: |-
      De in het vorige lid bedoelde afzender is verplicht het formulier juist en volledig in te vullen en te
      ondertekenen.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden te vellen of te doen vellen, anders dan bij wijze van dunning, zonder dat een voorafgaande tijdige
      kennisgeving als bedoeld in het eerste lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      De eigenaar van grond, waarop een houtopstand, anders dan bij wijze van dunning, is geveld of op andere wijze
      tenietgegaan, is verplicht binnen een tijdvak van drie jaren na de velling of het tenietgaan van de houtopstand te
      herbeplanten volgens regelen bij of krachtens algemene maatregel van bestuur te stellen.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel3
  - number: '3.2'
    text: |-
      De in het vorige lid bedoelde eigenaar is tevens verplicht beplanting die niet is aangeslagen binnen drie jaren na
      de herbeplanting te vervangen.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel3
  - number: '3.3'
    text: |-
      De in de voorgaande leden bedoelde eigenaar kan aan Onze Minister een verklaring vragen, inhoudende dat de door hem
      voorgestelde herbeplanting voldoet aan de regelen, krachtens het eerste lid gesteld.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel3
  - number: '4'
    text: |-
      Hij, die de eigendom van grond als bedoeld in [artikel 3, eerste lid][ref1], overdraagt of een gebruiksrecht daarop
      vestigt of overdraagt, is verplicht aan de verkrijger kennis te geven van het bestaan van de verplichting tot
      herbeplanting en van haar omvang en daarvan uitdrukkelijk in de akte van levering, vereist voor de overdracht of
      vestiging, te doen blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel3
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '3'
        afdeling: II
  - number: '5.1'
    text: |-
      Het bepaalde bij de [artikelen 2][ref1] en [3][ref2] vindt geen toepassing, indien de grond, waarop de velling zal
      worden verricht of waarop zich de gevelde of tenietgegane houtopstand bevond, nodig is voor de uitvoering van een
      werk overeenkomstig het bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002357#Artikel3
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002357
        artikel: '3'
        afdeling: II
  - number: '5.2'
    text: |-
      Het bepaalde bij de [artikelen 2][ref1] en [3][ref2] vindt voorts geen toepassing ten aanzien van houtopstanden,
      welke een zelfstandige eenheid vormen, en hetzij geen grotere oppervlakte beslaan dan 10 are, hetzij ingeval van
      rijbeplanting, gerekend over het totaal aantal rijen, niet meer bomen omvatten dan 20.


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002357#Artikel3
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002357
        artikel: '3'
        afdeling: II
  - number: '6.1'
    text: |-
      Onze Minister kan bij regeling voor door hem daarbij aan te wijzen groepen van gevallen, al dan niet onder
      voorwaarden, vrijstelling van het bepaalde bij of krachtens de [artikelen 2][ref1] en [3][ref2] verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002357#Artikel3
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002357
        artikel: '3'
        afdeling: II
  - number: '6.2'
    text: |-
      Onze Minister kan in bijzondere gevallen van het bepaalde bij of krachtens de [artikelen 2][ref1] en [3][ref2], al
      dan niet onder voorwaarden, ontheffing verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002357#Artikel3
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0002357
        artikel: '3'
        afdeling: II
  - number: '13.1'
    text: |-
      Onze Ministers van Onderwijs, Cultuur en Wetenschap en van Economische Zaken, Landbouw en Innovatie kunnen ter
      bewaring van natuur- en landschapsschoon het vellen en doen vellen, anders dan bij wijze van dunning, van bossen en
      andere houtopstanden telkens voor ten hoogste vijf jaar verbieden.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel13
  - number: '13.2'
    text: |-
      De bekendmaking van een besluit houdende een verbod als bedoeld in het eerste lid, geschiedt door toezending of
      uitreiking aan de gebruiker van de grond waarop de houtopstand zich bevindt en, indien deze niet de eigenaar van
      die grond is, tevens aan deze laatste. Van het besluit wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel13
  - number: '13.3'
    text: |-
      Een verbod als bedoeld in het eerste lid kan niet worden opgelegd in het geval, omschreven in
      [artikel 5, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel5
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '5'
        afdeling: II
  - number: '13.4'
    text: |-
      Indien de in het tweede lid bedoelde gebruiker of eigenaar tengevolge van een verbod, als bedoeld in het eerste
      lid, schade lijdt, welke redelijkerwijze niet of niet geheel te zijnen laste behoort te blijven, kennen Onze in
      het eerste lid genoemde Ministers hem op zijn verzoek een naar billijkheid te bepalen schadevergoeding uit 's Lands
      kas toe.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel13
  - number: '15.1'
    text: |-
      De aan andere openbare lichamen toekomende bevoegdheden worden ten aanzien van de onderwerpen, waarin deze wet
      voorziet, slechts beperkt door hetgeen hierna uitdrukkelijk is bepaald.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel15
  - number: '15.2'
    text: 'De provinciale staten en de gemeenteraad zijn niet bevoegd regelen te stellen ter bewaring van:'
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel15
  - number: 15.2.a
    text: |-
      wegbeplantingen en eenrijige beplantingen op of langs landbouwgronden, beide voorzover bestaande uit populieren of
      wilgen, tenzij deze zijn geknot;
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel15
  - number: 15.2.b
    text: vruchtbomen en windschermen om boomgaarden;
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel15
  - number: 15.2.c
    text: |-
      fijnsparren, niet ouder dan twaalf jaar, bestemd om te dienen als kerstbomen en geteeld op daarvoor in het
      bijzonder bestemde terreinen;
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel15
  - number: 15.2.d
    text: kweekgoed.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel15
  - number: '15.3'
    text: |-
      Voorts zijn de in het vorige lid bedoelde colleges niet bevoegd regelen te stellen ter bewaring van bossen en
      andere houtopstanden, welke deel uitmaken van bosbouwondernemingen, die als zodanig bij het Bosschap geregistreerd
      staan, en niet gelegen zijn binnen een bebouwde kom als bedoeld in [artikel 1, vijfde lid][ref1], behoudens ter
      bewaring van houtopstanden als bedoeld in [artikel 5, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002357#Artikel5
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002357
        artikel: '5'
        afdeling: II
  - number: '17'
    text: |-
      Indien de gebruiker of eigenaar van een houtopstand tengevolge van een krachtens provinciale of gemeentelijke
      verordening genomen besluit, houdende een verbod tot vellen van een houtopstand of een weigering tot ontheffing
      van een verbod tot vellen van een houtopstand, schade lijdt, welke redelijkerwijs niet of niet geheel voor zijn
      rekening behoort te blijven, kennen de in de provinciale, onderscheidenlijk de gemeentelijke verordening aangewezen
      organen hem op zijn verzoek een naar billijkheid te bepalen schadevergoeding uit de provinciale, onderscheidenlijk
      de gemeentekas toe.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel17
  - number: '22.1'
    text: 'Ingetrokken worden:'
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel22
  - number: 22.1.a
    text: de Boschwet 1922 (wet van 19 mei 1922, *Stb.* 349);
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel22
  - number: 22.1.b
    text: de Bodemproductiebeschikking 1949 Bosbouw en Houtteelt (*Stcrt.* 184);
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel22
  - number: '23'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel23
  - number: '24'
    text: Deze wet kan worden aangehaald onder de titel van "Boswet".
    url: https://wetten.overheid.nl/BWBR0002357/2013-01-01#Artikel24
