---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wetboek_van_koophandel
regulatory_layer: WET
publication_date: '2014-12-12'
valid_from: '2013-01-01'
bwb_id: BWBR0001838
url: https://wetten.overheid.nl/BWBR0001838/2013-01-01
articles:
  - number: '1'
    text: |-
      Het Burgerlijk Wetboek is, voor zoo verre daarvan bij dit Wetboek niet bijzonderlijk is afgeweken, ook op de in dit
      Wetboek behandelde onderwerpen toepasselijk.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel1
  - number: '15'
    text: |-
      De in dezen titel genoemde vennootschappen worden geregeerd door de overeenkomsten van partijen, door dit Wetboek
      en door het Burgerlijk Regt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel15
  - number: '16'
    text: |-
      De vennootschap onder eene firma is de maatschap, tot de uitoefening van een bedrijf onder eenen
      gemeenschappelijken naam aangegaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel16
  - number: '17.1'
    text: |-
      Elk der vennooten, die daarvan niet is uitgesloten, is bevoegd ten name der vennootschap te handelen, gelden uit te
      geven en te ontvangen, en de vennootschap aan derden, en derden aan de vennootschap te verbinden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel17
  - number: '17.2'
    text: |-
      Handelingen welke niet tot de vennootschap betrekkelijk zijn, of tot welke de vennooten volgens de overeenkomst
      onbevoegd zijn, worden onder deze bepaling niet begrepen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel17
  - number: '18'
    text: |-
      In vennootschappen onder eene firma is elk der vennooten, wegens de verbindtenissen der vennootschap, hoofdelijk
      verbonden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel18
  - number: '19.1'
    text: |-
      De vennootschap bij wijze van geldschieting, anders *en commandite* genaamd, wordt aangegaan tusschen eenen
      persoon, of tusschen meerdere hoofdelijk verbonden vennoten, en eenen of meer andere personen als geldschieters.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel19
  - number: '19.2'
    text: |-
      Eene vennootschap kan alzoo te gelijker tijd zijn eene vennootschap onder eene firma, ten aanzien van de vennooten
      onder de firma, en eene vennootschap bij wijze van geldschieting, ten aanzien van den geldschieter.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel19
  - number: '19.3'
    text: De vennootschap bij wijze van geldschieting heeft geen in aandelen verdeeld kapitaal.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel19
  - number: '20.1'
    text: |-
      Behoudens de uitzondering, in het tweede lid van [art. 30][ref1] voorkomende, mag de naam van den vennoot bij wijze
      van geldschieting in de firma niet worden gebezigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel30
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '30'
  - number: '20.2'
    text: |-
      Deze vennoot mag geene daad van beheer verrigten of in de zaken van de vennootschap werkzaam zijn, zelfs niet uit
      kracht eener volmagt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel20
  - number: '20.3'
    text: |-
      Hij draagt niet verder in de schade dan ten beloope der gelden, welke hij in de vennootschap heeft ingebragt of
      heeft moeten inbrengen, zonder dat hij immer tot teruggave van genotene winsten verpligt zij.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel20
  - number: '21'
    text: |-
      De vennoot bij wijze van geldschieting, die de bepalingen van het eerste of van het tweede lid van het vorige
      artikel overtreedt, is wegens alle de schulden en verbindtenissen van de vennootschap hoofdelijk verbonden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel21
  - number: '22'
    text: |-
      De vennootschappen onder eene firma moeten worden aangegaan bij authentieke of bij onderhandsche akte, zonder dat
      het gemis eener akte aan derden kan worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel22
  - number: '23'
    text: |-
      De vennooten onder eene firma zijn verpligt de vennootschap te doen inschrijven in het handelsregister,
      overeenkomstig de daarvoor geldende wettelijke bepalingen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel23
  - number: '29'
    text: |-
      Zoolang de inschrijving in het handelsregister niet is geschied, zal de vennootschap onder eene firma, ten aanzien
      van derden, worden aangemerkt als algemeen voor alle zaken, als aangegaan voor eenen onbepaalden tijd, en als
      geenen der vennooten uitsluitende van het regt om voor de firma te handelen en te teekenen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel29
  - number: '30.1'
    text: |-
      De firma van eene ontbondene vennootschap kan, het zij uit kracht der overeenkomst, het zij indien de gewezen
      vennoot, wiens naam in de firma voorkwam, daarin uitdrukkelijk toestemt, of, bij overlijden, deszelfs erfgenamen
      zich niet daartegen verzetten, door eenen of meer personen worden aangehouden, welke, ten blijke daarvan, eene
      akte moeten uitbrengen, en dezelve doen inschrijven in het handelsregister, overeenkomstig de daarvoor geldende
      wettelijke bepalingen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel30
  - number: '30.2'
    text: |-
      De bepaling van het eerste lid van [art. 20][ref1] is niet toepasselijk, indien de afgetredene, van vennoot onder
      eene firma, vennoot bij wijze van geldschieting is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel20
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '20'
  - number: '31'
    text: |-
      De ontbinding eener vennootschap onder eene firma vóór den tijd bij de overeenkomst bepaald, of door afstand
      of opzegging tot stand gebragt, derzelver verlenging na verloop van het bepaalde tijdstip, mitsgaders alle
      veranderingen in de oorspronkelijke overeenkomst gemaakt, welke derden aangaan, zijn aan de voormelde inschrijving
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel31
  - number: '32.1'
    text: |-
      Bij de ontbinding der vennootschap zullen de vennooten, die het regt van beheer hebben gehad, de zaken der gewezen
      vennootschap moeten vereffenen in naam van dezelfde firma, ten zij bij de overeenkomst anders ware bepaald, of de
      gezamenlijke vennooten (die bij wijze van geldschieting niet daaronder begrepen), hoofdelijk en bij meerderheid van
      stemmen, eenen anderen vereffenaar hadden benoemd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel32
  - number: '32.2'
    text: |-
      Indien de stemmen staken beschikt de rechtbank, zoodanig als zij in het belang der ontbondene vennootschap meest
      geraden zal achten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel32
  - number: '33'
    text: |-
      Indien de staat der kas van de ontbondene vennootschap niet toereikt om de opeischbare schulden te betalen, zullen
      zij, die met de vereffening belast zijn, de benoodigde penningen kunnen vorderen, welke door elk der vennooten,
      voor zijn aandeel in de vennootschap, zullen moeten worden ingebragt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel33
  - number: '34'
    text: |-
      De gelden die gedurende de vereffening uit de kas der vennootschap kunnen gemist worden, zullen voorloopig worden
      verdeeld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel34
  - number: '59'
    text: |-
      De beurs van koophandel is de zamenkomst van kooplieden, schippers, tussenpersonen, kassiers en andere personen tot
      den koophandel in betrekking staande. Zij heeft plaats op gezag van het plaatselijk bestuur.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel59
  - number: '60.1'
    text: |-
      Uit de handelingen en afspraken, ter beurze gesloten, worden opgemaakt de bepaling van den wisselkoers, de prijs
      der koopmanschappen, der assurantien, der zeevrachten, der kosten van vervoer te water en te lande, der binnen- en
      buitenlandsche obligatien, fondsen en andere papieren, die voor bepaling van koers vatbaar zijn.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel60
  - number: '60.2'
    text: Deze onderscheidene koersen of prijzen worden volgens plaatselijke reglementen of gebruiken opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel60
  - number: '61'
    text: |-
      Het uur van het aangaan en afloopen der beurs, en alles wat de goede orde aldaar betreft, wordt door plaatselijke
      reglementen bepaald.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel61
  - number: '62.1'
    text: 'Onder tussenpersoon wordt verstaan degene die:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel62
  - number: 62.1.a
    text: |-
      zijn bedrijf maakt van het verlenen van bemiddeling bij het totstandbrengen en het sluiten van overeenkomsten in
      opdracht en op naam van personen tot wie hij niet in een vaste dienstbetrekking staat,
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel62
  - number: 62.1.b
    text: |-
      beherend vennoot van een vennootschap of bestuurder van een rechtspersoon is die haar bedrijf maakt van het
      verrichten van de in onderdeel a genoemde handelingen, of
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel62
  - number: 62.1.c
    text: |-
      in arbeidsovereenkomst staande tot een persoon, vennootschap of rechtspersoon als bedoeld in dit artikel, namens
      zijn werkgever de in onderdeel a genoemde handelingen verricht.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel62
  - number: '62.2'
    text: |-
      Het in het eerste lid bedoelde bedrijf kan mede omvatten het bemonsteren en waarderen van goederen en het
      uitbrengen van deskundigenberichten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel62
  - number: '68'
    text: |-
      De tussenpersoon is verplicht van iedere door hem gesloten overeenkomst aantekening te houden; hij doet van de
      aantekening aan ieder der partijen terstond een door hem gewaarmerkt afschrift toekomen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel68
  - number: 68b.1
    text: |-
      Tenzij hij daarvan door partijen is ontslagen, is de tussenpersoon verplicht van elke door hem op monster verkochte
      partij goederen het monster, voorzien van een duidelijk herkenningsteken, te bewaren gedurende een redelijke
      termijn overeenkomstig de gebruiken in de handel.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel68b
  - number: 68b.2
    text: |-
      De rechter kan aan een tussenpersoon de overlegging van het door hem bewaarde monster in rechte bevelen teneinde
      dit te bezichtigen en hij kan daaromtrent zijn toelichting vorderen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel68b
  - number: '69'
    text: |-
      De tussenpersoon die een door hem verhandelde wisselbrief of ander handelspapier aan de koper ter hand stelt, staat
      in voor de echtheid van de zich daarop bevindende handtekening van de verkoper.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel69
  - number: '70'
    text: |-
      De [artikelen 68][ref1], [68b][ref2] en [69][ref3] zijn van overeenkomstige toepassing op de vennootschap en de
      rechtspersoon die bemiddeling door middel van tussenpersonen tot bedrijf hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel68b
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel69
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '68'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 68b
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001838
        artikel: '69'
        afdeling: Tweede
  - number: '100'
    text: 'De wisselbrief behelst:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel100
  - number: 100.1°
    text: de benaming "wisselbrief", opgenomen in den tekst zelf en uitgedrukt in de taal, waarin de titel is gesteld;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel100
  - number: 100.2°
    text: de onvoorwaardelijke opdracht tot betaling van een bepaalde som;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel100
  - number: 100.3°
    text: den naam van dengene, die betalen moet (betrokkene);
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel100
  - number: 100.4°
    text: de aanwijzing van den vervaldag;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel100
  - number: 100.5°
    text: die van de plaats, waar de betaling moet geschieden;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel100
  - number: 100.6°
    text: den naam van dengene, aan wien of aan wiens order de betaling moet worden gedaan;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel100
  - number: 100.7°
    text: de vermelding van de dagteekening, alsmede van de plaats, waar de wisselbrief is getrokken;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel100
  - number: 100.8°
    text: de handteekening van dengene, die den wisselbrief uitgeeft (trekker).
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel100
  - number: '101.1'
    text: |-
      De titel, waarin ééne der vermeldingen, in het voorgaande artikel aangegeven, ontbreekt, geldt niet als
      wisselbrief, behoudens in de hieronder genoemde gevallen:
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel101
  - number: '101.2'
    text: De wisselbrief, waarvan de vervaldag niet is aangewezen, wordt beschouwd als betaalbaar op zicht.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel101
  - number: '101.3'
    text: |-
      Bij gebreke van een bijzondere aanwijzing wordt de plaats, aangegeven naast den naam van den betrokkene, geacht te
      zijn de plaats van betaling en tevens de plaats van het domicilie des betrokkenen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel101
  - number: '101.4'
    text: |-
      De wisselbrief, welke niet de plaats aanwijst, waar hij is getrokken, wordt geacht te zijn onderteekend in de
      plaats, aangegeven naast den naam des trekkers.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel101
  - number: '102.1'
    text: De wisselbrief kan aan de order van den trekker luiden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel102
  - number: '102.2'
    text: Hij kan worden getrokken op den trekker zelf.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel102
  - number: '102.3'
    text: |-
      Hij kan worden getrokken voor rekening van eenen derde. De trekker wordt geacht voor zijne eigene rekening te
      hebben getrokken, indien uit den wisselbrief of uit den adviesbrief niet blijkt, voor wiens rekening zulks is
      geschied.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel102
  - number: 102a.1
    text: |-
      Wanneer de trekker op den wisselbrief de vermelding "waarde ter incasseering", "ter incasso", "in lastgeving",
      of eenige andere vermelding met zich brengend een bloote opdracht tot inning, heeft geplaatst, kan de nemer alle
      uit den wisselbrief voortvloeiende rechten uitoefenen, maar hij kan dezen niet anders endosseeren dan bijwege van
      lastgeving.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel102a
  - number: 102a.2
    text: |-
      Bij een zoodanigen wisselbrief kunnen de wisselschuldenaren aan den houder slechts de verweermiddelen tegenwerpen,
      welke aan den trekker zouden kunnen worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel102a
  - number: 102a.3
    text: |-
      De opdracht, vervat in een incasso-wisselbrief, eindigt niet door den dood of de latere onbekwaamheid van den
      lastgever.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel102a
  - number: '103'
    text: |-
      Een wisselbrief kan betaalbaar zijn aan de woonplaats van eenen derde, hetzij in de plaats, waar de betrokkene zijn
      domicilie heeft, hetzij in een andere plaats.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel103
  - number: '104.1'
    text: |-
      In eenen wisselbrief, betaalbaar op zicht of een zekeren tijd na zicht, kan de trekker bepalen, dat de som rente
      draagt. In elken anderen wisselbrief wordt deze clausule voor niet geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel104
  - number: '104.2'
    text: |-
      De rentevoet moet in den wisselbrief worden aangegeven. Bij gebreke hiervan wordt de renteclausule voor niet
      geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel104
  - number: '104.3'
    text: De rente loopt te rekenen van de dagteekening van den wisselbrief, tenzij een andere dag is aangegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel104
  - number: '105.1'
    text: |-
      De wisselbrief, waarvan het bedrag voluit in letters en tevens in cijfers is geschreven, geldt, in geval van
      verschil, ten beloope van de som, voluit in letters geschreven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel105
  - number: '105.2'
    text: |-
      De wisselbrief, waarvan het bedrag meermalen is geschreven, hetzij voluit in letters, hetzij in cijfers, geldt, in
      geval van verschil, slechts ten beloope van de kleinste som.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel105
  - number: '106'
    text: |-
      Indien de wisselbrief handteekeningen bevat van personen, die onbekwaam zijn zich door middel van eenen wisselbrief
      te verbinden, valsche handteekeningen, of handteekeningen van verdichte personen, of handteekeningen, welke,
      onverschillig om welke andere reden, de personen, die die handteekeningen hebben geplaatst of in wier naam zulks
      is geschied, niet kunnen verbinden, zijn de verbintenissen der andere personen, wier handteekeningen op den
      wisselbrief voorkomen, desniettemin geldig.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel106
  - number: '107'
    text: |-
      Ieder, die zijne handteekening op eenen wisselbrief plaatst als vertegenwoordiger van eenen persoon, voor wien
      hij niet de bevoegdheid had te handelen, is zelf krachtens den wisselbrief verbonden, en heeft, betaald hebbende,
      dezelfde rechten, als de beweerde vertegenwoordigde zou hebben gehad. Hetzelfde geldt ten aanzien van den
      vertegenwoordiger, die zijne bevoegdheid heeft overschreden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel107
  - number: '108.1'
    text: De trekker staat in voor de acceptatie en voor de betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel108
  - number: '108.2'
    text: |-
      Hij kan zijne verplichting, voor de acceptatie in te staan, uitsluiten; elke clausule, waarbij hij de verplichting,
      voor de betaling in te staan, uitsluit, wordt voor niet-geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel108
  - number: '109'
    text: |-
      Indien een wisselbrief, onvolledig ten tijde der uitgifte, is volledig gemaakt in strijd met de aangegane
      overeenkomsten, kan de niet-naleving van die overeenkomsten niet worden tegengeworpen aan den houder, die de wissel
      te goeder trouw heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel109
  - number: 109a
    text: |-
      De trekker is verplicht, ter keuze van den nemer, den wisselbrief te stellen betaalbaar aan den nemer zelven, of
      aan eenigen anderen persoon, in beide gevallen aan order of zonder bijvoeging van order dan wel met bijvoeging van
      eene uitdrukking, als bedoeld in [artikel 110, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel110
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '110'
        afdeling: Tweede
  - number: 109b
    text: |-
      De trekker, of degene voor wiens rekening de wisselbrief is getrokken, is verplicht zorg te dragen, dat de
      betrokkene, ten vervaldage, in handen hebbe het noodige fonds tot betaling, zelfs indien de wisselbrief bij eenen
      derde is betaalbaar gesteld, met dien verstande echter, dat de trekker zelf in alle gevallen aan den houder en de
      vroegere endossanten persoonlijk verantwoordelijk blijft.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel109b
  - number: 109c
    text: |-
      De betrokkene wordt geacht, het noodige fonds in handen te hebben, indien hij bij het vervallen van den wisselbrief
      of op het tijdstip, waarop ingevolge het [derde lid van artikel 142][ref1] de houder regres kan nemen, aan den
      trekker of aan dengene voor wiens rekening is getrokken, eene opeischbare som schuldig is, ten minste gelijkstaande
      met het beloop van den wisselbrief.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel142
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel109c
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '142'
        afdeling: Zevende
  - number: '110.1'
    text: |-
      Elke wisselbrief, ook die welke niet uitdrukkelijk aan order luidt, kan door middel van endossement worden
      overgedragen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel110
  - number: '110.2'
    text: |-
      Indien de trekker in den wisselbrief de woorden: "niet aan order" of een soortgelijke uitdrukking heeft opgenomen,
      kan het stuk slechts worden overgedragen in den vorm en met de gevolgen van een gewone cessie. Een op zulk een
      wisselbrief geplaatst endossement geldt als een gewone cessie.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel110
  - number: '110.3'
    text: |-
      Het endossement kan worden gesteld zelfs ten voordeele van den betrokkene, al of niet acceptant, van den trekker,
      of van elken anderen wisselschuldenaar. Deze personen kunnen den wisselbrief opnieuw endosseeren.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel110
  - number: '111.1'
    text: Het endossement moet onvoorwaardelijk zijn. Elke daarin opgenomen voorwaarde wordt voor niet-geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel111
  - number: '111.2'
    text: Het gedeeltelijke endossement is nietig.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel111
  - number: '111.3'
    text: Het endossement aan toonder geldt als endossement in blanco.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel111
  - number: '112.1'
    text: |-
      Het endossement moet worden gesteld op den wisselbrief of op een daaraan vastgehecht blad (verlengstuk). Het moet
      worden onderteekend door den endossant.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel112
  - number: '112.2'
    text: |-
      Het endossement kan den geëndosseerde onvermeld laten of bestaan uit de enkele handteekening van den endossant
      (endossement in blanco). In het laatste geval moet het endossement, om geldig te zijn, op de rugzijde van den
      wisselbrief of op het verlengstuk worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel112
  - number: '113.1'
    text: Door het endossement worden alle uit den wisselbrief voortvloeiende rechten overgedragen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel113
  - number: '113.2'
    text: 'Indien het endossement in blanco is, kan de houder:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel113
  - number: 113.2.1°
    text: het blanco invullen, hetzij met zijn eigen naam, hetzij met den naam van een anderen persoon;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel113
  - number: 113.2.2°
    text: den wisselbrief wederom in blanco of aan een anderen persoon endosseeren;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel113
  - number: 113.2.3°
    text: den wisselbrief aan eenen derde overgeven, zonder het blanco in te vullen en zonder hem te endosseeren.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel113
  - number: '114.1'
    text: Tenzij het tegendeel bedongen is, staat de endossant in voor de acceptatie en voor de betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel114
  - number: '114.2'
    text: |-
      Hij kan een nieuw endossement verbieden; in dat geval staat hij tegenover de personen, aan wie de wisselbrief later
      is geëndosseerd, niet in voor de acceptatie en voor de betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel114
  - number: '115.1'
    text: |-
      Hij, die eenen wisselbrief onder zich heeft, wordt beschouwd als de rechtmatige houder, indien hij van zijn
      recht doet blijken door een ononderbroken reeks van endossementen, zelfs indien het laatste endossement in blanco
      is gesteld. De doorgehaalde endossementen worden te dien aanzien voor niet geschreven gehouden. Wanneer een
      endossement in blanco door een ander endossement is gevolgd, wordt de onderteekenaar van dit laatste geacht den
      wisselbrief door een endossement in blanco verkregen te hebben.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel115
  - number: '115.2'
    text: |-
      Indien iemand, op welke wijze dan ook, het bezit van den wisselbrief heeft verloren, is de houder, die van zijn
      recht doet blijken op de wijze, bij het voorgaande lid aangegeven, niet verplicht den wisselbrief af te geven,
      indien hij deze te goeder trouw heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel115
  - number: '116'
    text: |-
      Zij, die uit hoofde van den wisselbrief worden aangesproken, kunnen de verweermiddelen, gegrond op hun persoonlijke
      verhouding tot den trekker of tot vroegere houders, niet aan den houder tegenwerpen, tenzij deze bij de verkrijging
      van den wisselbrief desbewust ten nadeele van den schuldenaar heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel116
  - number: '117.1'
    text: |-
      Wanneer het endossement de vermelding bevat: "waarde ter incasseering", "ter incasso", "in lastgeving", of eenige
      andere vermelding, met zich brengend een bloote opdracht tot inning, kan de houder alle uit den wisselbrief
      voortvloeiende rechten uitoefenen, maar hij kan dezen niet anders endosseeren dan bij wege van lastgeving.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel117
  - number: '117.2'
    text: |-
      De wisselschuldenaren kunnen in dat geval aan den houder slechts de verweermiddelen tegenwerpen, welke aan den
      endossant zouden kunnen worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel117
  - number: '117.3'
    text: |-
      De opdracht, vervat in een incasso-endossement, eindigt niet door den dood of door de latere onbekwaamheid van
      den lastgever.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel117
  - number: '118.1'
    text: |-
      Wanneer een endossement de vermelding bevat: "waarde tot zekerheid", "waarde tot pand", of eenige andere
      vermelding, welke inpandgeving met zich brengt, kan de houder alle uit den wisselbrief voortvloeiende rechten
      uitoefenen, maar een door hem gesteld endossement geldt slechts als endossement bij wege van lastgeving.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel118
  - number: '118.2'
    text: |-
      De wisselschuldenaren kunnen den houder de verweermiddelen, gegrond op hun persoonlijke verhouding tot den
      endossant, niet tegenwerpen, tenzij de houder bij de ontvangst van den wisselbrief desbewust ten nadeele van den
      schuldenaar heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel118
  - number: '119.1'
    text: |-
      Een endossement, gesteld na den vervaldag, heeft dezelfde gevolgen als een endossement, gesteld vóór den vervaldag.
      Echter heeft het endossement, gesteld na het protest van non-betaling of na het verstrijken van den termijn, voor
      het opmaken van het protest bepaald, slechts de gevolgen eener gewone cessie.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel119
  - number: '119.2'
    text: |-
      Behoudens tegenbewijs wordt het endossement zonder dagteekening geacht te zijn gesteld vóór het verstrijken van den
      termijn, voor het opmaken van het protest bepaald.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel119
  - number: '120'
    text: |-
      De wisselbrief kan tot den vervaldag door den houder of door iemand, die hem enkel onder zich heeft, aan den
      betrokkene te zijner woonplaats ter acceptatie worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel120
  - number: '121.1'
    text: |-
      In elken wisselbrief kan de trekker, al dan niet met vaststelling van een termijn, bepalen, dat deze ter acceptatie
      moet worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel121
  - number: '121.2'
    text: |-
      Hij kan in den wisselbrief de aanbieding ter acceptatie verbieden, behoudens in wisselbrieven, betaalbaar bij eenen
      derde, of betaalbaar in een andere plaats dan die van het domicilie des betrokkenen of betaalbaar een zekeren tijd
      na zicht.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel121
  - number: '121.3'
    text: Hij kan ook bepalen, dat de aanbieding ter acceptatie niet kan plaats hebben vóór een bepaalden dag.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel121
  - number: '121.4'
    text: |-
      Tenzij de trekker heeft verklaard, dat de wisselbrief niet vatbaar is voor acceptatie, kan elke endossant, al dan
      niet met vaststelling van eenen termijn, bepalen, dat hij ter acceptatie moet worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel121
  - number: '122.1'
    text: |-
      Wisselbrieven, betaalbaar een zekeren tijd na zicht, moeten ter acceptatie worden aangeboden binnen een jaar na
      hunne dagteekening.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel122
  - number: '122.2'
    text: De trekker kan dezen termijn verkorten of verlengen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel122
  - number: '122.3'
    text: De endossanten kunnen deze termijnen verkorten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel122
  - number: '123.1'
    text: |-
      De betrokkene kan verzoeken, dat hem een tweede aanbieding wordt gedaan den dag, volgende op de eerste.
      Belanghebbenden zullen zich er niet op mogen beroepen, dat aan dit verzoek geen gevolg is gegeven, tenzij het
      verzoek in het protest is vermeld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel123
  - number: '123.2'
    text: De houder is niet verplicht, den ter acceptatie aangeboden wisselbrief aan den betrokkene af te geven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel123
  - number: '124.1'
    text: |-
      De acceptatie wordt op den wisselbrief gesteld. Zij wordt uitgedrukt door het woord: "geaccepteerd", of door een
      soortgelijk woord; zij wordt door den betrokkene onderteekend. De enkele handteekening van den betrokkene, op de
      voorzijde van den wisselbrief gesteld, geldt als acceptatie.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel124
  - number: '124.2'
    text: |-
      Wanneer de wisselbrief betaalbaar is een zekeren tijd na zicht, of wanneer hij krachtens een uitdrukkelijk beding
      ter acceptatie moet worden aangeboden binnen een bepaalden termijn, moet de acceptatie als dagteekening inhouden
      den dag, waarop zij is geschied, tenzij de houder dien van de aanbieding eischt. Bij gebreke van dagteekening moet
      de houder dit verzuim door een tijdig protest doen vaststellen, op straffe van verlies van zijn recht van regres op
      de endossanten en op den trekker, die fonds heeft bezorgd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel124
  - number: '125.1'
    text: De acceptatie is onvoorwaardelijk, maar de betrokkene kan haar beperken tot een gedeelte van de som.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel125
  - number: '125.2'
    text: |-
      Elke andere wijziging, door den acceptant met betrekking tot het in den wisselbrief vermelde aangebracht, geldt als
      weigering van acceptatie. De acceptant is echter gehouden overeenkomstig den inhoud zijner acceptatie.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel125
  - number: '126.1'
    text: |-
      Wanneer de trekker den wisselbrief op een andere plaats dan die van het domicilie des betrokkenen heeft betaalbaar
      gesteld, zonder eenen derde aan te wijzen, bij wien de betaling moet worden gedaan, kan de betrokkene dezen bij de
      acceptatie aanwijzen. Bij gebreke van zoodanige aanwijzing wordt de acceptant geacht zich verbonden te hebben zelf
      te betalen op de plaats van betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel126
  - number: '126.2'
    text: |-
      Indien de wisselbrief betaalbaar is aan het domicilie des betrokkenen, kan deze, in de acceptatie, een adres
      aanwijzen, in dezelfde plaats, waar de betaling moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel126
  - number: '127.1'
    text: Door de acceptatie verbindt de betrokkene zich, den wisselbrief op den vervaldag te betalen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel127
  - number: '127.2'
    text: |-
      Bij gebreke van betaling heeft de houder, al ware hij de trekker, tegen den acceptant een rechtstreeksche
      vordering, uit den wisselbrief voortspruitend, voor al hetgeen kan worden gevorderd krachtens de
      [artikelen 147][ref1] en [148][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel148
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '147'
        afdeling: Zevende
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '148'
        afdeling: Zevende
  - number: 127a
    text: |-
      Hij, die het noodige fonds in handen heeft, bijzonderlijk bestemd tot de betaling van eenen getrokken wisselbrief,
      is, op straffe van schadevergoeding jegens den trekker, tot de acceptatie verplicht.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel127a
  - number: 127b.1
    text: |-
      Belofte om eenen wisselbrief te zullen accepteeren geldt niet als acceptatie, maar geeft aan den trekker eene
      rechtsvordering tot schadevergoeding tegen den belover, die weigert zijne belofte gestand te doen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel127b
  - number: 127b.2
    text: |-
      Deze schade bestaat in de kosten van protest en herwissel, wanneer de wisselbrief voor des trekkers eigene rekening
      was getrokken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel127b
  - number: 127b.3
    text: |-
      Wanneer de trekking voor rekening van eenen derde was gedaan, bestaat de schade in de kosten van protest en
      herwissel, en in het beloop van hetgeen de trekker, uit hoofde van de bekomene toezegging van den belover, aan dien
      derde, op het crediet van den wisselbrief, heeft voorgeschoten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel127b
  - number: 127c
    text: |-
      De trekker is verplicht aan den betrokkene tijdig kennis of advies te geven van den door hem getrokken wisselbrief,
      en, bij nalatigheid daarvan, gehouden tot vergoeding van de kosten, door weigering van acceptatie of betaling uit
      dien hoofde gevallen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel127c
  - number: 127d
    text: |-
      Indien de wisselbrief voor rekening van eenen derde is getrokken, is deze alleen daarvoor aan den acceptant
      verbonden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel127d
  - number: '128.1'
    text: |-
      Indien de betrokkene zijn op den wisselbrief gestelde acceptatie heeft doorgehaald vóór de teruggave van den
      wisselbrief, wordt de acceptatie geacht te zijn geweigerd. Behoudens tegenbewijs wordt de doorhaling geacht te zijn
      geschied vóór de teruggave van den wisselbrief.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel128
  - number: '128.2'
    text: |-
      Indien echter de betrokkene van zijne acceptatie schriftelijk heeft doen blijken aan den houder of aan iemand,
      wiens handteekening op den wisselbrief voorkomt, is hij tegenover dezen gehouden overeenkomstig den inhoud van
      zijne acceptatie.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel128
  - number: '129.1'
    text: |-
      De betaling van eenen wisselbrief kan voor het geheel of een gedeelte van de wisselsom door eenen borgtocht (aval)
      worden verzekerd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel129
  - number: '129.2'
    text: |-
      Deze borgtocht kan door eenen derde, of zelfs door iemand, wiens handteekening op den wisselbrief voorkomt, worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel129
  - number: '130.1'
    text: Het aval wordt op den wisselbrief of op een verlengstuk gesteld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel130
  - number: '130.2'
    text: |-
      Het wordt uitgedrukt door de woorden: "goed voor aval" of door een soortgelijke uitdrukking; het wordt door den
      avalgever onderteekend.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel130
  - number: '130.3'
    text: |-
      De enkele handteekening van den avalgever, gesteld op de voorzijde van den wisselbrief, geldt als aval, behalve
      wanneer de handteekening die is van den betrokkene of van den trekker.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel130
  - number: '130.4'
    text: Het kan ook geschieden bij een afzonderlijk geschrift of bij een brief, vermeldende de plaats, waar het is gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel130
  - number: '130.5'
    text: |-
      In het aval moet worden vermeld, voor wien het is gegeven. Bij gebreke hiervan wordt het geacht voor den trekker te
      zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel130
  - number: '131.1'
    text: De avalgever is op dezelfde wijze verbonden als degenen, voor wien het aval is gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel131
  - number: '131.2'
    text: |-
      Zijne verbintenis is geldig, zelfs indien, wegens een andere oorzaak dan een vormgebrek, de door hem gewaarborgde
      verbintenis nietig is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel131
  - number: '131.3'
    text: |-
      Door te betalen verkrijgt de avalgever de rechten, welke krachtens den wisselbrief kunnen worden uitgeoefend tegen
      dengene, voor wien het aval is gegeven en tegen degenen, die tegenover dezen krachtens den wisselbrief verbonden
      zijn.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel131
  - number: '132.1'
    text: |-
      Een wisselbrief kan worden getrokken: op zicht; op een zekeren tijd na zicht; op een zekeren tijd na dagteekening;
      op een bepaalden dag.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel132
  - number: '132.2'
    text: Wisselbrieven met anders bepaalde vervaldagen of in termijnen betaalbaar zijn nietig.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel132
  - number: '133.1'
    text: |-
      De wisselbrief, getrokken op zicht, is betaalbaar bij de aanbieding. Hij moet ter betaling worden aangeboden binnen
      een jaar na zijne dagteekening. De trekker kan dezen termijn verkorten of verlengen. De endossanten kunnen deze
      termijnen verkorten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel133
  - number: '133.2'
    text: |-
      De trekker kan voorschrijven, dat een wisselbrief niet ter betaling mag worden aangeboden vóór een bepaalden dag.
      In dat geval loopt de termijn van aanbieding van dien dag af.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel133
  - number: '134.1'
    text: |-
      De vervaldag van eenen wisselbrief, getrokken op een zekeren tijd na zicht, wordt bepaald, hetzij door de
      dagteekening der acceptatie, hetzij door die van het protest.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel134
  - number: '134.2'
    text: |-
      Bij gebreke van protest wordt de niet-gedagteekende acceptatie ten aanzien van den acceptant geacht te zijn gedaan
      op den laatsten dag van den termijn, voor de aanbieding ter acceptatie voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel134
  - number: '135.1'
    text: |-
      De wisselbrief, getrokken op een of meer maanden na dagteekening of na zicht, vervalt op den overeenkomstigen dag
      van de maand, waarin de betaling moet worden gedaan. Bij gebreke van een overeenkomstigen dag vervalt een zoodanige
      wisselbrief op den laatsten dag van die maand.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel135
  - number: '135.2'
    text: |-
      Bij eenen wisselbrief, getrokken op een of meer maanden en een halve maand na dagteekening of na zicht, worden
      eerst de geheele maanden gerekend.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel135
  - number: '135.3'
    text: |-
      Is de vervaldag bepaald op het begin, het midden (half Januari, half Februari enz.) of op het einde van eene maand,
      dan wordt onder die uitdrukkingen verstaan: de eerste, de vijftiende, de laatste van die maand.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel135
  - number: '135.4'
    text: |-
      Onder de uitdrukkingen: "acht dagen", "vijftien dagen", moet worden verstaan niet ééne of twee weken, maar een
      termijn van acht of van vijftien dagen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel135
  - number: '135.5'
    text: De uitdrukking "halve maand" duidt eenen termijn van vijftien dagen aan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel135
  - number: '136.1'
    text: |-
      De vervaldag van eenen wisselbrief, betaalbaar op een bepaalden dag, in eene plaats, waar de tijdrekening een
      andere is dan die van de plaats van uitgifte, wordt geacht te zijn vastgesteld volgens de tijdrekening van de
      plaats van betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel136
  - number: '136.2'
    text: |-
      De dag van uitgifte van eenen wisselbrief, getrokken tusschen twee plaatsen met verschillende tijdrekening en
      betaalbaar een zekeren tijd na dagteekening, wordt herleid tot den overeenkomstigen dag van de tijdrekening van de
      plaats van betaling en de vervaldag wordt dienovereenkomstig vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel136
  - number: '136.3'
    text: De termijnen van aanbieding der wisselbrieven worden berekend overeenkomstig de bepalingen van het voorgaande lid.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel136
  - number: '136.4'
    text: |-
      Dit artikel is niet van toepassing, indien uit eene in den wisselbrief opgenomen clausule of uit zijne bewoordingen
      een afwijkende bedoeling kan worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel136
  - number: '137.1'
    text: |-
      De houder van eenen wisselbrief, betaalbaar op een bepaalden dag of een zekeren tijd na dagteekening of na zicht,
      moet dezen ter betaling aanbieden, hetzij den dag, waarop hij betaalbaar is, hetzij eenen der twee daaropvolgende
      werkdagen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel137
  - number: '137.2'
    text: |-
      De aanbieding van eenen wisselbrief aan eene verrekeningskamer geldt als aanbieding ter betaling. Bij
      algemeenen maatregel van bestuur zullen de instellingen worden aangewezen, die in den zin van dezen Titel als
      verrekeningskamers worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel137
  - number: '138.1'
    text: |-
      Buiten het geval, in [artikel 167b][ref1] vermeld, kan de betrokkene, den wisselbrief betalende, vorderen, dat hem
      deze, van behoorlijke kwijting van den houder voorzien, wordt uitgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel167b
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 167b
        paragraaf: '3'
        afdeling: Negende
  - number: '138.2'
    text: De houder mag niet weigeren een gedeeltelijke betaling aan te nemen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel138
  - number: '138.3'
    text: |-
      In geval van gedeeltelijke betaling kan de betrokkene vorderen, dat van die betaling op den wisselbrief melding
      wordt gemaakt en dat hem daarvoor kwijting wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel138
  - number: '139.1'
    text: De houder van eenen wisselbrief kan niet genoodzaakt worden, vóór den vervaldag betaling te ontvangen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel139
  - number: '139.2'
    text: De betrokkene, die vóór den vervaldag betaalt, doet zulks op eigen verantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel139
  - number: '139.3'
    text: |-
      Hij, die op den vervaldag betaalt, is deugdelijk gekweten, mits er zijnerzijds geen bedrog plaats heeft of grove
      schuld aanwezig is. Hij is gehouden, de regelmatigheid van de reeks van endossementen, maar niet de handteekening
      der endossanten te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel139
  - number: '139.4'
    text: |-
      Indien hij, niet bevrijdend betaald hebbende, verplicht wordt, ten tweede male te betalen, heeft hij verhaal op
      allen die de wissel niet te goeder trouw hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel139
  - number: '140.1'
    text: |-
      Een wisselbrief, waarvan de betaling is bedongen in ander geld dan dat van de plaats van betaling, kan worden
      betaald in het geld van het land volgens zijne waarde op den vervaldag. Indien de schuldenaar in gebreke is, kan de
      houder te zijner keuze vorderen, dat de wisselsom betaald wordt in het geld van het land volgens den koers, hetzij
      van den vervaldag, hetzij van den dag van betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel140
  - number: '140.2'
    text: |-
      De waarde van het vreemde geld wordt bepaald volgens de gebruiken van de plaats van betaling. De trekker kan echter
      voorschrijven, dat het te betalen bedrag moet worden berekend volgens een in den wisselbrief voorgeschreven koers.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel140
  - number: '140.3'
    text: |-
      Het bovenstaande is niet van toepassing, indien de trekker heeft voorgeschreven, dat de betaling moet geschieden in
      een bepaald aangeduid geld (clausule van werkelijke betaling in vreemd geld).
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel140
  - number: '140.4'
    text: |-
      Indien het bedrag van den wisselbrief is aangegeven in geld, hetwelk dezelfde benaming, maar eene verschillende
      waarde heeft in het land van uitgifte en in dat van betaling, wordt men vermoed het geld van de plaats van betaling
      te hebben bedoeld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel140
  - number: '141'
    text: |-
      Bij gebreke van aanbieding ter betaling van den wisselbrief binnen den termijn, bij [artikel 137][ref1]
      vastgesteld, heeft elke schuldenaar de bevoegdheid, het bedrag te bevoegder plaatse in consignatie te geven, op
      kosten en onder verantwoordelijkheid van den houder.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel137
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '137'
        afdeling: Zesde
  - number: '142.1'
    text: |-
      De houder kan zijn recht van regres op de endossanten, den trekker en de andere wisselschuldenaren uitoefenen: Op
      den vervaldag: indien de betaling niet heeft plaats gehad;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel142
  - number: '142.2'
    text: 'Zelfs vóór den vervaldag:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel142
  - number: 142.2.1°
    text: indien de acceptatie geheel of gedeeltelijk is geweigerd;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel142
  - number: 142.2.2°
    text: |-
      in geval van faillissement van den betrokkene, al of niet acceptant, of het ten aanzien van hem van toepassing
      verklaren van de schuldsaneringsregeling natuurlijke personen en van het oogenblik af, waarop eene hem verleende
      surséance van betaling is ingegaan;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel142
  - number: 142.2.3°
    text: |-
      in geval van faillissement van den trekker of het ten aanzien van hem van toepassing verklaren van de
      schuldsaneringsregeling natuurlijke personen van een niet voor acceptatie vatbaren wisselbrief.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel142
  - number: '143.1'
    text: |-
      De weigering van acceptatie of van betaling moet worden vastgesteld bij authentieke acte (protest van non-
      acceptatie of van non-betaling).
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143
  - number: '143.2'
    text: |-
      Het protest van non-acceptatie moet worden opgemaakt binnen de termijnen, voor de aanbieding ter acceptatie
      vastgesteld. Indien, in het geval bij [artikel 123, lid 1][ref1], voorzien, de eerste aanbieding heeft plaats gehad
      op den laatsten dag van den termijn, kan het protest nog op den volgenden dag worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel123
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '123'
        afdeling: Derde
  - number: '143.3'
    text: |-
      Het protest van non-betaling van eenen wisselbrief, betaalbaar op een bepaalden dag of zekeren tijd na dagteekening
      of na zicht, moet worden gedaan op éénen der twee werkdagen, volgende op den dag, waarop de wisselbrief betaalbaar
      is. Indien het eenen wisselbrief, betaalbaar op zicht, betreft, moet het protest worden gedaan, overeenkomstig de
      bepalingen bij het voorgaande lid vastgesteld voor het opmaken van het protest van non-acceptatie.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143
  - number: '143.4'
    text: Het protest van non-acceptatie maakt de aanbieding ter betaling en het protest van non-betaling overbodig.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143
  - number: '143.5'
    text: |-
      In geval van benoeming van bewindvoerders op verzoek van den betrokkene, al of niet acceptant, tot surséance
      van betaling kan de houder zijn recht van regres niet uitoefenen, dan nadat de wisselbrief ter betaling aan den
      betrokkene is aangeboden en protest is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143
  - number: '143.6'
    text: |-
      Indien de betrokkene, al of niet acceptant, is failliet verklaard, of indien de trekker van eenen wisselbrief,
      welke niet vatbaar is voor acceptatie, is failliet verklaard, kan de houder, voor de uitoefening van zijn recht van
      regres, volstaan met overlegging van het vonnis, waarbij het faillissement is uitgesproken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143
  - number: '143.7'
    text: |-
      Het zesde lid is van overeenkomstige toepassing indien de schuldsaneringsregeling natuurlijke personen van
      toepassing is verklaard.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143
  - number: 143a.1
    text: |-
      De betaling van eenen wisselbrief moet gevraagd en het daarop volgende protest gedaan worden ter woonplaats van
      den betrokkene.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143a
  - number: 143a.2
    text: |-
      Indien de wisselbrief getrokken is om in eene andere aangewezene woonplaats of door eenen anderen aangewezen
      persoon, hetzij in dezelfde, hetzij in eene andere gemeente te worden betaald, moet de betaling gevraagd en het
      protest opgemaakt worden ter aangewezene woonplaats of aan den aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143a
  - number: 143a.3
    text: |-
      [Artikel 54 van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel54
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '54'
  - number: 143b.1
    text: |-
      De protesten, zowel van non-acceptatie als van non-betaling, worden gedaan door een deurwaarder. Deze kan zich
      desverkiezende doen vergezellen door een of twee getuigen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143b
  - number: 143b.2
    text: 'De protesten behelzen:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143b
  - number: 143b.2.1°
    text: |-
      een letterlijk afschrift van den wisselbrief, van de acceptatie, van de endossementen, van het aval en van de
      adressen daarop gesteld;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143b
  - number: 143b.2.2°
    text: |-
      de vermelding dat zij de acceptatie of betaling aan de personen, of ter plaatse in het voorgaand artikel gemeld,
      afgevraagd en niet bekomen hebben;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143b
  - number: 143b.2.3°
    text: de vermelding van de opgegevene reden van non-acceptatie of non-betaling;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143b
  - number: 143b.2.4°
    text: de aanmaning om het protest te teekenen, en de redenen van weigering;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143b
  - number: 143b.2.5°
    text: de vermelding, dat hij, deurwaarder, wegens die non-acceptatie of non-betaling heeft geprotesteerd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143b
  - number: 143b.3
    text: |-
      Indien het protest een vermisten wisselbrief betreft, volstaat, in plaats van het bepaalde onder 1°. van het
      voorgaande lid, eene zoo nauwkeurig mogelijke omschrijving van den inhoud des wisselbriefs.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143b
  - number: 143c
    text: |-
      De deurwaarders zijn verplicht, op straffe van schadevergoeding, afschrift van het protest te laten, en hiervan
      melding in het afschrift te maken, en hetzelve, naar orde des tijds, in te schrijven in een bijzonder register,
      genommerd en gewaarmerkt door de kantonrechter van de rechtbank van het arrondissement waarin hun woonplaats is
      gelegen, en om wijders, zulks begeerd wordende, een of meer afschriften van het protest aan de belanghebbenden
      te leveren.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143c
  - number: 143d
    text: |-
      Als protest van non-acceptatie, onderscheidenlijk van non-betaling geldt de door dengene, aan wien de acceptatie
      of de betaling wordt afgevraagd, met toestemming van den houder op den wisselbrief gestelde, gedagteekende en
      onderteekende verklaring, dat hij dezelve weigert, tenzij de trekker heeft aangeteekend, dat hij een authentiek
      protest verlangt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel143d
  - number: '144.1'
    text: |-
      De houder moet van de non-acceptatie of van de non-betaling kennis geven aan zijnen endossant en aan den trekker
      binnen de vier werkdagen, volgende op den dag van het protest of, indien de wisselbrief getrokken is met de
      clausule zonder kosten, volgende op dien der aanbieding. Elke endossant moet binnen de twee werkdagen, volgende
      op den dag van ontvangst der kennisgeving, de door hem ontvangen kennisgeving aan zijnen endossant mededeelen,
      met aanwijzing van de namen en adressen van degenen, die de voorafgaande kennisgevingen hebben gedaan, en zoo
      vervolgens, teruggaande tot den trekker. Deze termijnen loopen van de ontvangst der voorafgaande kennisgeving af.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel144
  - number: '144.2'
    text: |-
      Indien overeenkomstig het voorgaande lid eene kennisgeving is gedaan aan iemand, wiens handteekening op den
      wisselbrief voorkomt, moet gelijke kennisgeving binnen denzelfden termijn aan diens avalgever worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel144
  - number: '144.3'
    text: |-
      Indien een endossant zijn adres niet of op onleesbare wijze heeft aangeduid, kan worden volstaan met kennisgeving
      aan den voorafgaanden endossant.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel144
  - number: '144.4'
    text: |-
      Hij, die eene kennisgeving heeft te doen, kan zulks doen in iederen vorm, zelfs door enkele terugzending van den
      wisselbrief.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel144
  - number: '144.5'
    text: |-
      Hij moet bewijzen, dat hij de kennisgeving binnen den vastgestelden termijn heeft gedaan. Deze termijn wordt
      gehouden te zijn in acht genomen, wanneer een brief, die de kennisgeving behelst, binnen den genoemden termijn ter
      post is bezorgd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel144
  - number: '144.6'
    text: |-
      Hij, die de kennisgeving niet binnen den bovenvermelden termijn doet, stelt zich niet bloot aan verval van
      zijn recht; hij is, indien daartoe aanleiding bestaat, verantwoordelijk voor de schade, door zijne nalatigheid
      veroorzaakt, zonder dat echter de schadevergoeding de wisselsom kan te boven gaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel144
  - number: '145.1'
    text: |-
      De trekker, een endossant of een avalgever kan, door de clausule "zonder kosten", "zonder protest", of een andere
      soortgelijke op den wisselbrief gestelde en onderteekende clausule, den houder van het opmaken van een protest van
      non-acceptatie of van non-betaling, ter uitoefening van zijn recht van regres, ontslaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel145
  - number: '145.2'
    text: |-
      Deze clausule ontslaat den houder niet van de aanbieding van den wisselbrief binnen de voorgeschreven termijnen,
      noch van het doen van de kennisgevingen. Het bewijs van de niet-inachtneming der termijnen moet worden geleverd
      door dengene, die zich daarop tegenover den houder beroept.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel145
  - number: '145.3'
    text: |-
      Is de clausule door den trekker gesteld, dan heeft zij gevolgen ten aanzien van allen, wier handteekeningen op den
      wisselbrief voorkomen; is zij door eenen endossant of door eenen avalgever gesteld, dan heeft zij gevolgen alleen
      voor dezen endossant of avalgever. Indien de houder, ondanks de door den trekker gestelde clausule, toch protest
      doet opmaken, zijn de kosten daarvan voor zijne rekening. Indien de clausule van eenen endossant of eenen avalgever
      afkomstig is, kunnen de kosten van het protest, indien dit is opgemaakt, op allen, wier handteekeningen op den
      wisselbrief voorkomen, worden verhaald.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel145
  - number: '146.1'
    text: |-
      Allen, die eenen wisselbrief hebben getrokken, geaccepteerd, geëndosseerd, of voor aval geteekend, zijn hoofdelijk
      tegenover den houder verbonden. Bovendien is ook de derde, voor wiens rekening de wisselbrief is getrokken en die
      de waarde daarvoor heeft genoten, jegens den houder aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel146
  - number: '146.2'
    text: |-
      De houder kan deze personen, zoowel ieder afzonderlijk, als gezamenlijk, aanspreken, zonder verplicht te zijn de
      volgorde, waarin zij zich hebben verbonden, in acht te nemen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel146
  - number: '146.3'
    text: |-
      Hetzelfde recht komt toe aan ieder, wiens handteekening op den wisselbrief voorkomt en die dezen, ter voldoening
      aan zijnen regresplicht, heeft betaald.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel146
  - number: '146.4'
    text: |-
      De vordering, ingesteld tegen éénen der wisselschuldenaren, belet niet de anderen aan te spreken, al hadden dezen
      zich later verbonden dan de eerst aangesprokene.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel146
  - number: 146a.1
    text: |-
      De houder van eenen geprotesteerden wisselbrief heeft in geen geval eenig recht op het fonds, dat de betrokkene van
      den trekker in handen heeft.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel146a
  - number: 146a.2
    text: |-
      Indien de wisselbrief niet is geaccepteerd, behooren die penningen, bij faillissement van den trekker of indien ten
      aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, aan diens boedel.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel146a
  - number: 146a.3
    text: |-
      In geval van acceptatie, blijft het fonds, tot het beloop van den wisselbrief, aan den betrokkene, behoudens de
      verplichting van dezen om jegens den houder aan zijne acceptatie te voldoen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel146a
  - number: '147.1'
    text: 'De houder kan van dengene, tegen wien hij zijn recht van regres uitoefent, vorderen:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel147
  - number: 147.1.1°
    text: de som van den niet-geaccepteerden of niet betaalden wisselbrief met de rente, zoo deze bedongen is;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel147
  - number: 147.1.2°
    text: |-
      de wettelijke rente, te rekenen van de vervaldag, voor wissels die in Nederland uitgegeven en betaalbaar zijn, en
      een rente van zes ten honderd, te rekenen van de vervaldag, voor alle overige wissels;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel147
  - number: 147.1.3°
    text: de kosten van protest, die van de gedane kennisgevingen alsmede de andere kosten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel147
  - number: '147.2'
    text: |-
      Zoo de uitoefening van het recht van regres vóór den vervaldag plaats heeft, wordt op de wisselsom eene korting
      toegepast. Deze korting wordt berekend volgens het officiëele disconto (bankdisconto), geldende ter woonplaats van
      den houder, op den dag van de uitoefening van het recht van regres.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel147
  - number: '148'
    text: |-
      Hij, die ter voldoening aan zijnen regresplicht den wisselbrief heeft betaald, kan van degenen, die tegenover hem
      regresplichtig zijn, vorderen:
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel148
  - number: 148.1°
    text: het geheele bedrag, dat hij betaald heeft;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel148
  - number: 148.2°
    text: |-
      de wettelijke rente, te rekenen van de dag der betaling, voor wissels die in Nederland uitgegeven en betaalbaar
      zijn, en een rente van zes ten honderd, te rekenen van de dag der betaling, voor alle overige wissels;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel148
  - number: 148.3°
    text: de door hem gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel148
  - number: '149.1'
    text: |-
      Elke wisselschuldenaar, tegen wien het recht van regres wordt of kan worden uitgeoefend, kan, tegen betaling ter
      voldoening aan zijnen regresplicht, de afgifte vorderen van den wisselbrief met het protest, alsmede een voor
      voldaan geteekende rekening.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel149
  - number: '149.2'
    text: |-
      Elke endossant, die ter voldoening aan zijnen regresplicht den wisselbrief heeft betaald, kan zijn endossement en
      dat van de volgende endossanten doorhalen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel149
  - number: '150'
    text: |-
      Bij gedeeltelijke acceptatie kan degene, die ter voldoening aan zijnen regresplicht het niet geaccepteerde gedeelte
      van de wisselsom heeft betaald, vorderen, dat die betaling op den wisselbrief wordt vermeld en dat hem daarvan
      kwijting wordt gegeven. De houder moet hem daarenboven uitleveren een voor eensluidend geteekend afschrift van den
      wisselbrief, alsmede het protest, om hem de uitoefening van zijn verdere regresrechten mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel150
  - number: '151.1'
    text: |-
      Ieder, die een recht van regres kan uitoefenen, kan, tenzij het tegendeel bedongen is, zich de vergoeding bezorgen
      door middel van een nieuwen wisselbrief (herwissel), getrokken op zicht op éénen van degenen, die tegenover hem
      regresplichtig zijn en betaalbaar te diens woonplaats.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel151
  - number: '151.2'
    text: |-
      De herwissel omvat, behalve de bedragen in de [artikelen 147][ref1] en [148][ref2] aangegeven, de bedragen van
      provisie en het zegel van den herwissel.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel148
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '147'
        afdeling: Zevende
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '148'
        afdeling: Zevende
  - number: '151.3'
    text: |-
      Indien de herwissel door den houder is getrokken, wordt het bedrag bepaald volgens den koers van eenen
      zichtwissel, getrokken van de plaats, waar de oorspronkelijke wisselbrief betaalbaar was, op de woonplaats van
      den regresplichtige. Indien de herwissel is getrokken door eenen endossant, wordt het bedrag bepaald volgens den
      koers van eenen zichtwissel, getrokken van de woonplaats van den trekker van den herwissel op de woonplaats van
      den regresplichtige.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel151
  - number: '152.1'
    text: |-
      Na afloop van de termijnen vastgesteld: voor de aanbieding van eenen wisselbrief getrokken op zicht of zekeren tijd
      na zicht; voor het opmaken van het protest van non-acceptatie of van non-betaling; voor de aanbieding ter betaling
      in geval van beding zonder kosten, vervalt het recht van den houder tegen de endossanten, tegen den trekker, en
      tegen de andere wisselschuldenaren, met uitzondering van den acceptant.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel152
  - number: '152.2'
    text: |-
      Bij gebreke van aanbieding ter acceptatie binnen den door den trekker voorgeschreven termijn, vervalt het recht
      van regres van den houder, zoowel wegens non-betaling als wegens non-acceptatie, tenzij uit de bewoordingen van den
      wisselbrief blijkt, dat de trekker zich slechts heeft willen bevrijden van zijne verplichting, voor de acceptatie
      in te staan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel152
  - number: '152.3'
    text: |-
      Indien de bepaling van eenen termijn voor de aanbieding in een endossement is vervat, kan alleen de endossant
      daarop een beroep doen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel152
  - number: 152a.1
    text: |-
      De wisselbrief van non-acceptatie of van non-betaling zijnde geprotesteerd, is niettemin de trekker, al ware
      het protest niet intijds gedaan, tot vrijwaring gehouden, tenzij hij bewees, dat de betrokkene op den vervaldag
      het noodige fonds tot betaling des wisselbriefs in handen had. Indien het vereischte fonds slechts gedeeltelijk
      aanwezig was, is de trekker voor het ontbrekende gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel152a
  - number: 152a.2
    text: |-
      Was de wisselbrief niet geaccepteerd, dan is, ingeval van niet tijdig protest, de trekker, op straffe van tot
      vrijwaring te zijn gehouden, verplicht, den houder af te staan en over te dragen de vordering op het fonds, dat de
      betrokkene van hem ten vervaldage heeft in handen gehad, en zulks tot het beloop van den wisselbrief; en hij moet
      aan den houder, te diens koste, de noodige bewijzen verschaffen om die vordering te doen gelden. Indien de trekker
      in staat van faillissement is verklaard of ten aanzien van hem de schuldsaneringsregeling natuurlijke personen
      van toepassing is verklaard, zijn de curatoren onderscheidenlijk de bewindvoerders in zijnen boedel tot dezelfde
      verplichtingen gehouden, ten ware deze mochten verkiezen, den houder als schuldeischer, voor het beloop van den
      wisselbrief, toe te laten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel152a
  - number: '153.1'
    text: |-
      Wanneer de aanbieding van den wisselbrief of het opmaken van het protest binnen de voorgeschreven termijnen wordt
      verhinderd door een onoverkomelijk beletsel (wettelijk voorschrift van eenigen Staat of ander geval van overmacht),
      worden deze termijnen verlengd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel153
  - number: '153.2'
    text: |-
      De houder is verplicht, van de overmacht onverwijld aan zijnen endossant kennis te geven, en deze kennisgeving
      gedagteekend en onderteekend op den wisselbrief of op een verlengstuk te vermelden; voor het overige zijn de
      bepalingen van [artikel 144][ref1] toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel144
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '144'
        afdeling: Zevende
  - number: '153.3'
    text: |-
      Na het ophouden van de overmacht moet de houder onverwijld den wisselbrief ter acceptatie of ter betaling aanbieden
      en, indien daartoe aanleiding bestaat, protest doen opmaken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel153
  - number: '153.4'
    text: |-
      Indien de overmacht meer dan dertig dagen, te rekenen van den vervaldag, aanhoudt, kan het recht van regres worden
      uitgeoefend, zonder dat de aanbieding of het opmaken van protest noodig is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel153
  - number: '153.5'
    text: |-
      Voor wisselbrieven, getrokken op zicht of op zekeren tijd na zicht, loopt de termijn van dertig dagen van den dag,
      waarop de houder, al ware het vóór het einde van den aanbiedingstermijn, van de overmacht aan zijnen endossant
      heeft kennis gegeven; voor wisselbrieven, getrokken op zekeren tijd na zicht, wordt de termijn van dertig dagen
      verlengd met den zichttermijn, in den wisselbrief aangegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel153
  - number: '153.6'
    text: |-
      Feiten, welke voor den houder, of voor dengene, dien hij met de aanbieding van den wisselbrief of met het opmaken
      van het protest belastte, van zuiver persoonlijken aard zijn, worden niet beschouwd als gevallen van overmacht.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel153
  - number: '154.1'
    text: |-
      De trekker, een endossant, of een avalgever, kan iemand aanwijzen om, in geval van nood, te accepteeren of te
      betalen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel154
  - number: '154.2'
    text: |-
      Onder de hierna vastgestelde voorwaarden kan de wisselbrief worden geaccepteerd of betaald door iemand, die
      tusschenkomt voor eenen schuldenaar, op wien recht van regres kan worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel154
  - number: '154.3'
    text: |-
      De interveniënt kan een derde zijn, zelfs de betrokkene, of een reeds krachtens den wisselbrief verbonden persoon,
      behalve de acceptant.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel154
  - number: '154.4'
    text: |-
      De interveniënt geeft binnen den termijn van twee werkdagen van zijne tusschenkomst kennis aan dengene, voor
      wien hij tusschenkwam. In geval van niet-inachtneming van dien termijn is hij, indien daartoe aanleiding bestaat,
      verantwoordelijk voor de schade, door zijne nalatigheid veroorzaakt, zonder dat echter de schadevergoeding de
      wisselsom kan te boven gaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel154
  - number: '155.1'
    text: |-
      De acceptatie bij tusschenkomst kan plaats hebben in alle gevallen, waarin de houder van eenen voor acceptatie
      vatbaren wisselbrief vóór den vervaldag recht van regres kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel155
  - number: '155.2'
    text: |-
      Wanneer op den wisselbrief iemand is aangewezen om dezen, in geval van nood, ter plaatse van betaling te
      accepteeren of te betalen, kan de houder zijn recht tegen dengene, die de aanwijzing heeft gedaan en tegen hen,
      die daarna hunne handteekeningen op den wisselbrief hebben geplaatst, niet vóór den vervaldag uitoefenen, tenzij
      hij den wisselbrief aan den aangewezen persoon heeft aangeboden, en van diens weigering tot acceptatie protest
      is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel155
  - number: '155.3'
    text: |-
      In de andere gevallen van tusschenkomst kan de houder de acceptatie bij tusschenkomst weigeren. Indien hij haar
      echter aanneemt, verliest hij zijn recht van regres, hetwelk hem vóór den vervaldag toekomt tegen dengene, voor
      wien de acceptatie is gedaan, en tegen hen, die daarna hunne handteekeningen op den wisselbrief hebben geplaatst.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel155
  - number: '156'
    text: |-
      De acceptatie bij tusschenkomst wordt op den wisselbrief vermeld; zij wordt door den interveniënt onderteekend.
      Zij wijst aan, voor wien zij is geschied; bij gebreke van die aanwijzing wordt zij geacht voor den trekker te zijn
      geschied.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel156
  - number: '157.1'
    text: |-
      De acceptant bij tusschenkomst is tegenover den houder en tegenover de endossanten, die den wisselbrief hebben
      geëndosseerd na dengene, voor wien de tusschenkomst is geschied, op dezelfde wijze als deze laatste verbonden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel157
  - number: '157.2'
    text: |-
      Niettegenstaande de acceptatie bij tusschenkomst kunnen degene, voor wien zij werd gedaan en degenen, die tegenover
      dezen regresplichtig zijn, van den houder, indien daartoe aanleiding bestaat, tegen terugbetaling van de bij
      [artikel 147][ref1] aangewezen som, de afgifte van den wisselbrief, van het protest en van een voor voldaan
      geteekende rekening vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel147
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '147'
        afdeling: Zevende
  - number: '158.1'
    text: |-
      De betaling bij tusschenkomst kan plaats hebben in alle gevallen, waarin, hetzij op den vervaldag, hetzij vóór den
      vervaldag, de houder recht van regres heeft.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel158
  - number: '158.2'
    text: De betaling moet de geheele som beloopen, welke degene, voor wien zij heeft plaats gehad, moest voldoen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel158
  - number: '158.3'
    text: |-
      Zij moet plaats hebben uiterlijk op den dag volgende op den laatsten dag, waarop het protest van non-betaling kan
      worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel158
  - number: '159.1'
    text: |-
      Indien de wisselbrief is geaccepteerd door interveniënten, wier domicilie ter plaatse van betaling is gevestigd,
      of indien personen, wier domicilie in dezelfde plaats is gevestigd, zijn aangeduid om in geval van nood te betalen,
      moet de houder den wisselbrief aan al die personen aanbieden, en, indien daartoe aanleiding bestaat, protest van
      non-betaling doen opmaken uiterlijk op den dag volgende op den laatsten dag, waarop dit kan geschieden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel159
  - number: '159.2'
    text: |-
      Bij gebreke van protest binnen dien termijn zijn degene, die het noodadres heeft gesteld of voor wien de
      wisselbrief is geaccepteerd, en de latere endossanten van hunne verbintenis bevrijd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel159
  - number: '160'
    text: |-
      De houder, die weigert de betaling bij tusschenkomst aan te nemen, verliest zijn recht van regres op hen, die
      daardoor zouden zijn bevrijd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel160
  - number: '161.1'
    text: |-
      De betaling bij tusschenkomst moet worden vastgesteld door eene kwijting, geplaatst op den wisselbrief met
      aanwijzing van dengene, voor wien zij is gedaan. Bij gebreke van die aanwijzing wordt de betaling geacht voor den
      trekker te zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel161
  - number: '161.2'
    text: |-
      De wisselbrief en het protest, indien dit is opgemaakt, moeten worden uitgeleverd aan hem, die bij tusschenkomst
      betaalt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel161
  - number: '162.1'
    text: |-
      Hij, die bij tusschenkomst betaalt, verkrijgt de rechten, uit den wisselbrief voortvloeiende, tegen dengene, voor
      wien hij heeft betaald, en tegen degenen, die tegenover dezen laatste krachtens den wisselbrief verbonden zijn. Hij
      mag echter den wisselbrief niet opnieuw endosseeren.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel162
  - number: '162.2'
    text: De endossanten, volgende op dengene, voor wien de betaling heeft plaats gehad, zijn bevrijd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel162
  - number: '162.3'
    text: |-
      Indien zich meer personen tot de betaling bij tusschenkomst aanbieden, heeft de voorkeur de betaling, welke het
      grootste aantal bevrijdingen teweegbrengt. De interveniënt, die desbewust in strijd hiermede handelt, verliest zijn
      recht van regres tegen hen, die anders zouden zijn bevrijd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel162
  - number: '163.1'
    text: De wisselbrief kan in meer gelijkluidende exemplaren worden getrokken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel163
  - number: '163.2'
    text: |-
      Die exemplaren moeten in den tekst zelf van den titel worden genummerd, bij gebreke waarvan elk exemplaar wordt
      beschouwd als een afzonderlijke wisselbrief.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel163
  - number: '163.3'
    text: |-
      Iedere houder van eenen wisselbrief, waarin niet is vermeld, dat deze in een enkel exemplaar getrokken is, kan
      op zijne kosten de levering van meer exemplaren vorderen. Te dien einde moet hij zich tot zijn onmiddellijken
      endossant wenden, die verplicht is zijne medewerking te verleenen om zijn eigen endossant aan te spreken, en
      zoo vervolgens, teruggaande tot den trekker. De endossanten zijn verplicht, de endossementen ook op de nieuwe
      exemplaren aan te brengen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel163
  - number: '164.1'
    text: |-
      De betaling, op één der exemplaren gedaan, bevrijdt, ook al ware niet bedongen, dat die betaling de kracht der
      andere exemplaren te niet doet. Echter blijft de betrokkene verbonden wegens elk geaccepteerd exemplaar, dat hem
      niet is uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel164
  - number: '164.2'
    text: |-
      De endossant, die de exemplaren aan verschillende personen heeft overgedragen, alsook de latere endossanten, zijn
      verbonden wegens alle exemplaren, die hunne handteekening dragen en die niet zijn uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel164
  - number: '165.1'
    text: |-
      Hij, die één der exemplaren ter acceptatie heeft gezonden, moet op de andere exemplaren den naam van den persoon
      aanwijzen, in wiens handen dat exemplaar zich bevindt. Deze is verplicht, dit aan den rechtmatigen houder van een
      ander exemplaar uit te leveren.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel165
  - number: '165.2'
    text: |-
      Weigert hij dit, dan kan de houder slechts zijn recht van regres uitoefenen, nadat hij door een protest heeft doen
      vaststellen:
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel165
  - number: 165.2.1°
    text: dat het ter acceptatie gezonden exemplaar hem desgevraagd niet is uitgeleverd;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel165
  - number: 165.2.2°
    text: dat hij de acceptatie of de betaling op een ander exemplaar niet heeft kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel165
  - number: '166.1'
    text: Elke houder van eenen wisselbrief heeft het recht, daarvan afschriften te vervaardigen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel166
  - number: '166.2'
    text: |-
      Het afschrift moet het oorspronkelijke nauwkeurig weergeven met de endossementen en alle andere vermeldingen, die
      er op voorkomen. Het moet aangeven, waar het afschrift ophoudt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel166
  - number: '166.3'
    text: |-
      Het kan worden geëndosseerd en voor aval geteekend op dezelfde wijze en met dezelfde gevolgen, als het
      oorspronkelijke.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel166
  - number: '167.1'
    text: |-
      Het afschrift moet dengene, in wiens handen het oorspronkelijke stuk zich bevindt, vermelden. Deze is verplicht het
      oorspronkelijke stuk aan den rechtmatigen houder van het afschrift uit te leveren.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel167
  - number: '167.2'
    text: |-
      Weigert hij dit, dan kan de houder zijn recht van regres tegen hen, die het afschrift hebben geëndosseerd of voor
      aval geteekend, slechts uitoefenen, nadat hij door een protest heeft doen vaststellen, dat het oorspronkelijke stuk
      hem desgevraagd niet is uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel167
  - number: '167.3'
    text: |-
      Indien na het laatste daarop geplaatste endossement, alvorens het afschrift is vervaardigd, het oorspronkelijke
      stuk de clausule draagt: "van hier af geldt het endossement slechts op de copie", of eenige andere soortgelijke
      clausule, is een nadien op het oorspronkelijk stuk geplaatst endossement nietig.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel167
  - number: 167a
    text: |-
      Degene die een wisselbrief, waarvan hij houder was, vermist, kan met inachtneming van
      [artikel 49, derde lid, van Boek 6 van het Burgerlijk Wetboek][ref1] van de betrokkene betaling vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel49
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel167a
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '49'
  - number: 167b
    text: |-
      Degene die een wisselbrief waarvan hij houder was, en welke is vervallen, en, zoveel nodig, geprotesteerd, vermist,
      kan met inachtneming van [artikel 49, derde lid, van Boek 6 van het Burgerlijk Wetboek][ref1], zijn rechten alleen
      tegen de acceptant en tegen de trekker uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel49
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel167b
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '49'
  - number: '168'
    text: |-
      In geval van verandering van den tekst van eenen wisselbrief, zijn zij, die daarna hunne handteekeningen op den
      wisselbrief geplaatst hebben, volgens den veranderden tekst verbonden; zij, die daarvoor hunne handteekeningen op
      den wisselbrief geplaatst hebben, zijn verbonden volgens den oorspronkelijken tekst.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel168
  - number: 168a
    text: |-
      Behoudens de bepaling van het volgende artikel gaat wisselschuld te niet door alle middelen van schuldbevrijding,
      bij het Burgerlijk Wetboek aangewezen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel168a
  - number: '169.1'
    text: |-
      Alle rechtsvorderingen, welke uit den wisselbrief tegen den acceptant voortspruiten, verjaren door een tijdsverloop
      van drie jaren, te rekenen van den vervaldag.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel169
  - number: '169.2'
    text: |-
      De rechtsvorderingen van den houder tegen de endossanten en tegen den trekker verjaren door een tijdsverloop van
      een jaar, te rekenen van de dagteekening van het tijdig opgemaakte protest of, ingeval van de clausule zonder
      kosten, van den vervaldag.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel169
  - number: '169.3'
    text: |-
      De rechtsvorderingen van de endossanten tegen elkander en tegen den trekker verjaren door tijdsverloop van zes
      maanden, te rekenen van den dag, waarop de endossant ter voldoening aan zijnen regresplicht den wisselbrief heeft
      betaald, of van den dag, waarop hij zelf in rechte is aangesproken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel169
  - number: '169.4'
    text: |-
      De in het eerste lid bedoelde verjaring kan niet worden ingeroepen door den acceptant, indien of voor zoover hij
      fonds heeft ontvangen of zich ongerechtvaardigd zou hebben verrijkt; evenmin kan de in het tweede en derde lid
      bedoelde verjaring worden ingeroepen door den trekker, indien of voor zoover hij geen fonds heeft bezorgd noch door
      den trekker of de endossanten, die zich ongerechtvaardigd zouden hebben verrijkt; alles onverminderd het bepaalde
      in [artikel 306 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel306
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '306'
  - number: '170.1'
    text: |-
      De stuiting der verjaring is slechts van kracht tegen dengene, ten aanzien van wien de stuitingshandeling heeft
      plaats gehad.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel170
  - number: '170.2'
    text: |-
      Op de in het vorige artikel bedoelde verjaringen is [artikel 321, eerste lid, onder ][ref1] niet van toepassing;
      in de gevallen bedoeld in [artikel 321, eerste lid, onder ][ref2] heeft de onbekwame of rechthebbende wiens
      rechtsvordering is verjaard, verhaal op de wettelijke vertegenwoordiger of bewindvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel321
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel321
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '321'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '321'
  - number: '171.1'
    text: |-
      De betaling van eenen wisselbrief, waarvan de vervaldag een wettelijke feestdag is, kan eerst worden gevorderd op
      den eerstvolgenden werkdag. Evenzoo kunnen alle andere handelingen met betrekking tot wisselbrieven, met name de
      aanbieding ter acceptatie en het protest, niet plaats hebben dan op eenen werkdag.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel171
  - number: '171.2'
    text: |-
      Wanneer ééne van die handelingen moet worden verricht binnen een zekeren termijn, waarvan de laatste dag een
      wettelijke feestdag is, wordt deze termijn verlengd tot den eersten werkdag, volgende op het einde van dien
      termijn. De tusschenliggende feestdagen zijn begrepen in de berekening van den termijn.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel171
  - number: 171a
    text: |-
      Als wettelijke feestdag in den zin van deze Afdeeling worden beschouwd de Zondag, de Nieuwjaarsdag, de Christelijke
      tweede Paasch- en Pinksterdagen, de beide Kerstdagen, de Hemelvaartsdag en de verjaardag des Konings.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel171a
  - number: '172'
    text: |-
      In de wettelijke of bij overeenkomst vastgestelde termijnen is niet begrepen de dag, waarop deze termijnen beginnen
      te loopen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel172
  - number: '173'
    text: Geen enkele respijtdag, noch wettelijke, noch rechterlijke, is toegestaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel173
  - number: '174'
    text: 'Het orderbriefje behelst:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel174
  - number: 174.1°
    text: |-
      hetzij de orderclausule, hetzij de benaming "orderbriefje" of "promesse aan order", opgenomen in den tekst zelf, en
      uitgedrukt in de taal, waarin de titel is gesteld;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel174
  - number: 174.2°
    text: de onvoorwaardelijke belofte een bepaalde som te betalen;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel174
  - number: 174.3°
    text: de aanwijzing van den vervaldag;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel174
  - number: 174.4°
    text: die van de plaats, waar de betaling moet geschieden;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel174
  - number: 174.5°
    text: den naam van dengene, aan wien of aan wiens order de betaling moet worden gedaan;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel174
  - number: 174.6°
    text: de vermelding van de dagteekening, alsmede van de plaats, waar het orderbiljet is onderteekend;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel174
  - number: 174.7°
    text: de handteekening van hem, die den titel uitgeeft (onderteekenaar).
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel174
  - number: '175.1'
    text: |-
      De titel, waarin ééne der vermeldingen, in het voorgaande artikel aangegeven, ontbreekt, geldt niet als
      orderbriefje, behoudens in de hieronder genoemde gevallen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel175
  - number: '175.2'
    text: Het orderbriefje, waarvan de vervaldag niet is aangewezen, wordt beschouwd als betaalbaar op zicht.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel175
  - number: '175.3'
    text: |-
      Bij gebreke van een bijzondere aanwijzing wordt de plaats van de onderteekening van den titel geacht te zijn de
      plaats van betaling en tevens de plaats van het domicilie van den onderteekenaar.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel175
  - number: '175.4'
    text: |-
      Het orderbriefje, dat de plaats van zijne onderteekening niet vermeldt, wordt geacht te zijn onderteekend in de
      plaats, aangegeven naast den naam van den onderteekenaar.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel175
  - number: '176.1'
    text: |-
      Voor zooverre zij niet onvereenigbaar zijn met den aard van het orderbriefje, zijn daarop toepasselijk
      de bepalingen over wisselbrieven betreffende: het endossement ([artikelen 110-119][ref1]); den vervaldag
      ([artikelen 132-136][ref2]); de betaling ([artikelen 137-141][ref3]); het recht van regres in geval van non-
      betaling ([artikelen 142-149][ref4], [151-153][ref5]); de betaling bij tusschenkomst ([artikelen 154][ref6],
      [158-162][ref7]); de wisselafschriften ([artikelen 166][ref8] en [167][ref9]); de vermiste wisselbrieven
      ([artikel 167a][ref10]); de veranderingen ([artikel 168][ref11]); de verjaring ([artikelen 168a][ref12]
      en [169-170][ref13]); de feestdagen, de berekening der termijnen en het verbod van respijtdagen
      ([artikelen 171][ref14], [171a][ref15], [172][ref16] en [173][ref17]).


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel132
