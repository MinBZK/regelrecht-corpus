        paragraaf: '2'
  - number: 452u
    text: |-
      De [artikelen 444][ref1], [451][ref2], [451a][ref3], [451d][ref4] en [451e][ref5] zijn van overeenkomstige
      toepassing met dien verstande dat in de [artikelen 451][ref6], [451a][ref7] en [451e][ref8] in plaats
      van «zeewerkgever» wordt gelezen: eigenaar, of ingeval van rompbevrachting: rompbevrachter, en in
      [artikel 451d, tweede lid][ref9]: maatschap, dat in plaats van «arbeidsovereenkomst» wordt gelezen:
      maatschapsovereenkomst en dat in plaats van «loon» wordt gelezen: aandeel in de besomming.


