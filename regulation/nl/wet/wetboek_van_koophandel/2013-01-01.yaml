  - number: '451.1'
    text: |-
      Alvorens te vertrekken, is de kapitein verplicht tot het opmaken van de monsterrol. De monsterrol is een staat,
      houdende de namen van de kapitein en van de schepelingen en de hoedanigheid waarin iedere schepeling aan boord
      dienst doet. De monsterrol vermeldt bovendien de naam van het schip, de met het schip te maken zeereis of
      zeereizen, de naam van de zeewerkgever, en wie van de schepelingen de rang van officier zullen hebben. Nadat de
      monsterrol voor de eerste maal is opgemaakt, wordt zij vervolgens ten minste eenmaal per twaalf maanden opnieuw
      opgemaakt. Na een tussentijdse wijziging van de gegevens, bedoeld in de tweede en derde volzin, wordt de monsterrol
      binnen 24 uur bijgesteld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel451
  - number: '451.2'
    text: |-
      De monsterrol wordt, na te zijn opgemaakt of bijgesteld, ondertekend door of namens de zeewerkgever, door de
      kapitein en door de desbetreffende schepelingen. De kapitein dient de monsterrol aan boord te houden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel451
  - number: '451.3'
    text: |-
      Nietig zijn bepalingen in de monsterrol, welke afwijken van de met een schepeling gesloten arbeidsovereenkomst of
      welke deze aanvullen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel451
  - number: 451a.1
    text: |-
      Bij het opmaken van de monsterrol is de zeewerkgever verplicht de met de schepelingen gesloten
      arbeidsovereenkomsten aan de kapitein over te leggen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel451a
  - number: 451a.2
    text: |-
      Deze vergewist zich ervan dat de inhoud van de arbeidsovereenkomsten door de schepelingen is begrepen en dat de
      overeenkomsten door partijen zijn ondertekend. Hij neemt daaromtrent een verklaring in de monsterrol op.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel451a
  - number: 451a.3
    text: |-
      Door de kapitein gewaarmerkte afschriften van de arbeidsovereenkomsten welke daartoe door de zeewerkgever ter
      beschikking van de kapitein worden gesteld, worden als bijlagen gevoegd bij het exemplaar van de monsterrol
      dat aan boord blijft. Iedere schepeling moet aan boord in de gelegenheid worden gesteld van de hem betreffende
      arbeidsovereenkomst inzage te nemen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel451a
  - number: 451a.4
    text: |-
      Het in het eerste en het derde lid bepaalde geldt mede voor de collectieve arbeidsovereenkomsten op de grondslag
      waarvan een of meer arbeidsovereenkomsten met de in de monsterrol genoemde schepelingen zijn gesloten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel451a
  - number: 451d
    text: |-
      De zeewerkgever draagt de kosten van het geneeskundig onderzoek volgens een bij of krachtens de in
      [artikel 451][ref1] bedoelde algemene maatregel van bestuur vast te stellen tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel451i
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel451d
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 451i
        paragraaf: '3'
  - number: 451e.1
    text: |-
      Na de monstering blijft het monsterboekje in handen van de kapitein; deze geeft het de schepeling terug bij het
      einde van de dienst aan boord van het schip.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel451e
  - number: 451e.2
    text: |-
      De kapitein vermeldt in het boekje den datum waarop en de plaats waar de dienst aan boord van het schip is
      geëindigd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel451e
  - number: 451e.3
    text: |-
      Indien de kapitein het monsterboekje niet kan teruggeven aan de schepeling, doet hij het toekomen aan de
      zeewerkgever die het, onder vermelding van de reden waarom het niet aan de schepeling is teruggegeven, zendt aan de
      inspecteur-generaal van de Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel451e
  - number: 451e.4
    text: |-
      De Raad voor de scheepvaart kan, op verzoek van de zeewerkgever, de inspecteur-generaal van de Inspectie Verkeer
      en Waterstaat gehoord, het monsterboekje gedurende de tijd van ten hoogste een jaar inhouden, ingeval de schepeling
      de arbeidsovereenkomst heeft doen eindigen en deswege schadeplichtig is geworden. De schepeling wordt vooraf
      opgeroepen om te worden gehoord; hij kan ook verschijnen bij een bijzonder gemachtigde of vergezeld van een
      raadsman.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel451e
  - number: 451e.5
    text: |-
      De bevoegdheid van de zeewerkgever tot het doen van het verzoek vervalt door verloop van één maand na het eindigen
      van de arbeidsovereenkomst in eene Nederlandsche haven en van zes maanden na het eindigen dier overeenkomst in
      het buitenland.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel451e
  - number: '452.1'
    text: Zeevisserij is de vaart ter bedrijfsmatige uitoefening der visserij buitengaats.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452
  - number: '452.2'
    text: |-
      Schepeling ter zeevisserij is de persoon die een schriftelijke arbeidsovereenkomst met de zeewerkgever of een
      schriftelijke maatschapsovereenkomst heeft aangegaan in het kader van de zeevisserij, uitgezonderd de kapitein.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452
  - number: '452.3'
    text: |-
      De bepalingen van de tweede en de derde paragraaf van dezen titel vinden geen toepassing ten aanzien van de
      schepelingen ter kustvisscherij. De arbeidsovereenkomsten van deze schepelingen worden uitsluitend geregeld door de
      bepalingen van het Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452
  - number: 452a
    text: |-
      Ten aanzien van de schepelingen ter zeevisserij die een arbeidsovereenkomst met de zeewerkgever hebben gesloten
      vinden de bepalingen van dezen titel toepassing, voorzoover daarvan in de volgende artikelen niet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452a
  - number: 452b
    text: |-
      Op de arbeidsovereenkomst tusschen zeewerkgever en een schepeling ter zeevisscherij blijft het bepaalde bij
      [artikel 400 onder 7°][ref1] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel400
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452b
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '400'
        paragraaf: '2'
  - number: 452c
    text: |-
      Op de in het vorige artikel bedoelde overeenkomst is [artikel 402][ref1] van toepassing, behoudens dat het
      dagverblijf kan worden vervangen door het volkslogies.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel402
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452c
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '402'
        paragraaf: '2'
  - number: 452d
    text: |-
      Het bij [artikel 407][ref1] omtrent de voeding bepaalde geldt ten aanzien van schepelingen ter zeevisscherij
      alleen, wanneer de zeewerkgever de zorg voor de voeding bij de arbeidsovereenkomst uitdrukkelijk op zich heeft
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel407
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452d
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '407'
        paragraaf: '2'
  - number: 452e
    text: |-
      De [artikelen 409][ref1] en [410][ref2] gelden niet ten aanzien van schepelingen ter zeevisscherij.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel409
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel410
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452e
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '409'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '410'
        paragraaf: '2'
  - number: 452f.1
    text: |-
      [Artikel 413][ref1] geldt ten aanzien van schepelingen ter zeevisscherij met deze aanvulling, dat het in geld
      vastgesteld loon voorzoover het afhankelijk is van de opbrengst der vangst in de arbeidsovereenkomst moet worden
      begroot op zijn vermoedelijk bedrag naar tijdruimte; bij de toepassing van de [artikelen 425][ref2], [428][ref3],
      [438][ref4] en [450][ref5] wordt dergelijk loon berekend naar deze begrooting.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel413
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel425
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel428
      [ref4]: https://wetten.overheid.nl/BWBR0001838#Artikel438
      [ref5]: https://wetten.overheid.nl/BWBR0001838#Artikel450
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452f
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '413'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '425'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001838
        artikel: '428'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0001838
        artikel: '438'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0001838
        artikel: '450'
        paragraaf: '2'
  - number: 452f.2
    text: |-
      De schepeling heeft geen aanspraak tegen de zeewerkgever op grond dat krachtens [artikel 425][ref1] of [428][ref2]
      ingevolge de begrooting aan een derde meer is uitbetaald dan strookt met het loon, dat ten slotte aan den
      schepeling verschuldigd blijkt te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel425
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel428
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452f
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '425'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '428'
        paragraaf: '2'
  - number: 452g
    text: |-
      [Artikel 414][ref1] geldt niet ten aanzien van schepelingen ter zeevisscherij.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel414
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452g
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '414'
        paragraaf: '2'
  - number: 452h
    text: |-
      Voor de toepassing van de [artikelen 415][ref1], [415][ref2] en [415][ref3] geldt als loon van de schepelingen
      ter zeevisserij het voor hen bij algemene maatregel van bestuur vastgestelde bedrag, indien het werkelijke loon
      afhankelijk is van de vangst of de opbrengst daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel415a
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel415g
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452h
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '415'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 415a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001838
        artikel: 415g
        paragraaf: '2'
  - number: 452i
    text: |-
      [Artikel 417][ref1] geldt ten aanzien van schepelingen ter zeevisscherij, behoudens dat deze alleen in de eerste
      Nederlandsche haven, welke het schip aandoet, de tusschenkomst van den kantonrechter kunnen inroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel417
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452i
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '417'
        paragraaf: '2'
  - number: 452j
    text: |-
      [Artikel 421][ref1] geldt ten aanzien van schepelingen ter zeevisscherij, behoudens, dat de kapitein kan volstaan
      met vermelding van de reden van weigering van een gevraagd verlof in het dagboek.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel421
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452j
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '421'
        paragraaf: '2'
  - number: 452k
    text: |-
      De [artikelen 423][ref1] en [424][ref2] gelden niet ten aanzien van schepelingen ter zeevisscherij.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel423
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel424
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452k
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '423'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '424'
        paragraaf: '2'
  - number: 452l
    text: |-
      [Artikel 425][ref1] geldt ten aanzien van schepelingen ter zeevisscherij, behoudens dat de uitbetaling aan de
      echtgenoote steeds wekelijks moet geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel425
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452l
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '425'
        paragraaf: '2'
  - number: 452m
    text: |-
      [Artikel 427][ref1] geldt niet ten aanzien van schepelingen ter zeevisscherij.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel427
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452m
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '427'
        paragraaf: '2'
  - number: 452n
    text: |-
      [Artikel 439][ref1] vindt toepassing op de arbeidsovereenkomsten tusschen zeewerkgever en schepelingen ter
      zeevisscherij, behoudens dat ieder der partijen zich uitsluitend kan wenden tot den daar bedoelden kantonrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel439
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452n
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '439'
        paragraaf: '2'
  - number: 452o.1
    text: |-
      [Artikel 450][ref1] geldt voor den zeewerkgever en de schepelingen ter zeevisscherij, behoudens dat de
      schadeloosstelling is beperkt tot twee derde van het bij de overeenkomst in geld vastgestelde deel van het loon.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel450
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452o
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '450'
        paragraaf: '2'
  - number: 452o.2
    text: |-
      Ten aanzien van schepen, welke uitsluitend de seizoenvisscherij uitoefenen, bepalen Wij telken jare op welken dag
      het seizoen geacht wordt te eindigen. De zeewerkgever van zoodanig schip is in geen geval verplicht de uitbetaling
      langer te doen dan tot het einde van het seizoen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452o
  - number: 452p
    text: |-
      De [artikelen 613 tot en met 613][ref1], [617][ref2], [620][ref3], [624][ref4], [625][ref5],
      [627][ref6], [artikel 629, lid 10][ref7] en [artikel 629][ref8] voor zover het betreft de toepassing
      van [artikel 628, leden 3 en 4][ref9], [652][ref10], [658][ref11], [676][ref12], [683][ref13] en
      [684 van Boek 7 van het Burgerlijk Wetboek][ref14] vinden geen toepassing ten aanzien van de dienst aan boord van
      de schepeling ter zeevisserij.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel613
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel617
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel620
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel624
