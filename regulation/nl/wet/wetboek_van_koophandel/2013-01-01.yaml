  - number: 452q.1
    text: |-
      De maatschapsovereenkomst moet, op straffe van nietigheid, schriftelijk worden aangegaan. In de
      maatschapsovereenkomst wordt bepaald, wie van de maten de kapitein zal zijn.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452q
  - number: 452q.2
    text: |-
      [Artikel 400, onder 1°-4°, onder 5°][ref1], met dien verstande dat in plaats van "waarin de schepeling
      in dienst zal treden" wordt gelezen: waarin de maat op het schip werkzaam zal zijn en onder 6°, zomede
      [artikel 401, eerste lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel400
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel401
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452q
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '400'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '401'
        paragraaf: '2'
  - number: 452q.3
    text: |-
      De overeenkomst moet een regeling bevatten omtrent de wijze waarop ieders aandeel in de opbrengst van de maatschap
      (besomming) zal worden bepaald.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452q
  - number: 452q.4
    text: 'Tevens moet de maatschapsovereenkomst behelzen de wijze van haar beëindiging, namelijk:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452q
  - number: 452q.4.a
    text: |-
      indien de overeenkomst voor onbepaalde tijd wordt aangegaan, de inhoud van [artikel 434, eerste lid][ref1], met
      dien verstande dat daarin in plaats van "arbeidsovereenkomst" gelezen wordt: maatschapsverhouding;


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel434
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452q
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '434'
        paragraaf: '2'
  - number: 452q.4.b
    text: |-
      indien de overeenkomst voor bepaalde tijd wordt aangegaan, de dag waarop de overeenkomst eindigt met vermelding
      van de inhoud van [artikel 431][ref1] met dien verstande dat in plaats van "arbeidsovereenkomst" wordt gelezen:
      maatschapsverhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel431
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452q
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '431'
        paragraaf: '2'
  - number: 452q.4.c
    text: |-
      indien de overeenkomst bij de reis wordt aangegaan, de haven overeengekomen voor de beëindiging van de
      maatschapsverhouding met vermelding van de inhoud van [artikel 432, tweede lid][ref1], met dien verstande dat
      daarin in plaats van "arbeidsovereenkomst" gelezen wordt: maatschapsverhouding en, indien de haven een Nederlandse
      haven is, met vermelding van de inhoud van het [eerste of tweede lid van artikel 433][ref2], naar gelang de haven
      al of niet met name is genoemd, met dien verstande dat in dat artikel in plaats van "arbeidsovereenkomst" gelezen
      wordt: maatschapsverhouding en in plaats van "zeewerkgever" elke vennoot.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel433
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452q
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '432'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '433'
        paragraaf: '2'
  - number: 452q.5
    text: |-
      Nietig is een beding waarbij een maat wordt beperkt in zijn vrijheid, na het einde van de maatschapsovereenkomst,
      arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452q
  - number: 452r.1
    text: |-
      Vanaf het ogenblik dat de kapitein het schip buitengaats brengt tot aan het ogenblik dat het schip in Nederland
      weer binnengaats wordt gebracht, is de kapitein bevoegd om als vertegenwoordiger van een maatschap op te treden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452r
  - number: 452r.2
    text: |-
      Ten aanzien van de maatschapskapitein zijn de [artikelen 364][ref1] en [375 tot en met 392][ref2] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel364
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel375
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452r
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '364'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '375'
  - number: 452s
    text: Schepelingendienst mag uitsluitend worden verricht door hen die in de monsterrol zijn genoemd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452s
  - number: 452t
    text: |-
      Van overeenkomstige toepassing zijn de [artikelen 405][ref1], [407, eerste-zesde lid][ref2], voorzover
      het de verblijven, de kombuis en andere ruimten voor de voeding betreft, met dien verstande dat in
      [artikel 407, eerste lid][ref3], voor "zeewerkgever" wordt gelezen: eigenaar, de [artikelen 411][ref4], [412][ref5]
      en [416][ref6], met dien verstande dat in het laatstgenoemde artikel voor "in dienst van de zeewerkgever" moet
      worden gelezen: deel uitmakend van de maatschap, en voor "zeewerkgever": maatschap.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel405
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel407
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel407
      [ref4]: https://wetten.overheid.nl/BWBR0001838#Artikel411
      [ref5]: https://wetten.overheid.nl/BWBR0001838#Artikel412
      [ref6]: https://wetten.overheid.nl/BWBR0001838#Artikel416
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452t
