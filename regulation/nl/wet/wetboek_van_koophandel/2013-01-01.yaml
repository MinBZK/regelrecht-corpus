  - number: '392'
    text: |-
      Bij overeenkomst kunnen partijen niet afwijken van het bepaalde in de [artikelen 376-378][ref1], [380][ref2] en
      [383][ref3], noch ook ten nadeele van den kapitein van het bepaalde in de [artikelen 381][ref4], [384][ref5] en
      [389][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel376
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel380
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel383
      [ref4]: https://wetten.overheid.nl/BWBR0001838#Artikel381
      [ref5]: https://wetten.overheid.nl/BWBR0001838#Artikel384
      [ref6]: https://wetten.overheid.nl/BWBR0001838#Artikel389
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel392
