  - number: 450d.2
    text: |-
      In de gevallen van de [artikelen 415, derde lid][ref1], [424, laatste lid][ref2], [445][ref3],
      [448][ref4], [449][ref5] en [450][ref6] kan de beschikking worden gegeven in den vorm bij
      [artikel 430 van het Wetboek van Burgerlijke Rechtsvordering][ref7] bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415
