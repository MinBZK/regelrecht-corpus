        artikel: '130'
        afdeling: Vierde
  - number: '177.1'
    text: De onderteekenaar van een orderbriefje is op dezelfde wijze verbonden als de acceptant van eenen wisselbrief.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel177
  - number: '177.2'
    text: |-
      De orderbriefjes, betaalbaar zekeren tijd na zicht, moeten ter teekening voor "gezien" aan den onderteekenaar
      worden aangeboden binnen den bij [artikel 122][ref1] vastgestelden termijn. De zichttermijn loopt van de
      dagteekening van het visum, hetwelk door den onderteekenaar op het orderbriefje moet worden geplaatst. De weigering
      van dezen zijn visum te plaatsen, moet worden vastgesteld door een protest ([artikel 124][ref2]), van welks
      dagteekening de zichttermijn begint te loopen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel124
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel177
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '122'
        afdeling: Derde
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '124'
        afdeling: Derde
  - number: '178'
    text: 'De chèque behelst:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel178
  - number: 178.1°
    text: de benaming "chèque", opgenomen in den tekst zelf en uitgedrukt in de taal, waarin de titel is gesteld;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel178
  - number: 178.2°
    text: de onvoorwaardelijke opdracht tot betaling van een bepaalde som;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel178
  - number: 178.3°
    text: den naam van dengene, die betalen moet (betrokkene);
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel178
  - number: 178.4°
    text: de aanwijzing van de plaats, waar de betaling moet geschieden;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel178
  - number: 178.5°
    text: de vermelding van de dagteekening, alsmede van de plaats, waar de chèque is getrokken;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel178
  - number: 178.6°
    text: de handteekening van dengene, die de chèque uitgeeft (trekker).
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel178
  - number: '179.1'
    text: |-
      De titel, waarin ééne der vermeldingen, in het voorgaande artikel aangegeven, ontbreekt, geldt niet als chèque,
      behoudens in de hieronder genoemde gevallen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel179
  - number: '179.2'
    text: |-
      Bij gebreke van een bijzondere aanwijzing, wordt de plaats, aangegeven naast den naam van den betrokkene, geacht
      te zijn de plaats van betaling. Indien meerdere plaatsen zijn aangegeven naast den naam van den betrokkene, is de
      chèque betaalbaar op de eerstaangegeven plaats.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel179
  - number: '179.3'
    text: |-
      Bij gebreke van die aanwijzingen of van iedere andere aanwijzing, is de chèque betaalbaar in de plaats, waar het
      hoofdkantoor van den betrokkene is gevestigd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel179
  - number: '179.4'
    text: |-
      De chèque, welke niet de plaats aanwijst, waar zij is getrokken, wordt geacht te zijn onderteekend in de plaats,
      aangegeven naast den naam des trekkers.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel179
  - number: '180'
    text: |-
      De chèque moet worden getrokken op eenen bankier, die fonds onder zich heeft ter beschikking van den trekker, en
      krachtens een uitdrukkelijke of stilzwijgende overeenkomst, volgens welke de trekker het recht heeft per chèque
      over dat fonds te beschikken. In geval van niet-inachtneming van die voorschriften blijft de titel echter als
      chèque geldig.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel180
  - number: '181'
    text: |-
      De chèque kan niet worden geaccepteerd. Eene vermelding van acceptatie, op de chèque gesteld, wordt voor niet
      geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel181
  - number: '182.1'
    text: |-
      De chèque kan betaalbaar worden gesteld: aan een met name genoemden persoon, met of zonder uitdrukkelijke clausule:
      "aan order"; aan een met name genoemden persoon, met de clausule: "niet aan order", of een soortgelijke clausule;
      aan toonder.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel182
  - number: '182.2'
    text: |-
      De chèque, betaalbaar gesteld aan een met name genoemden persoon, met de vermelding: "of aan toonder", of een
      soortgelijke uitdrukking, geldt als chèque aan toonder.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel182
  - number: '182.3'
    text: De chèque zonder vermelding van den nemer geldt als chèque aan toonder.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel182
  - number: '183.1'
    text: De chèque kan aan de order van den trekker luiden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel183
  - number: '183.2'
    text: |-
      De chèque kan worden getrokken voor rekening van eenen derde. De trekker wordt geacht voor zijn eigene rekening te
      hebben getrokken, indien uit de chèque of uit den adviesbrief niet blijkt, voor wiens rekening zulks is geschied.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel183
  - number: '183.3'
    text: De chèque kan op den trekker zelf getrokken worden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel183
  - number: 183a.1
    text: |-
      Wanneer de trekker op de chèque de vermelding "waarde ter incasseering", "ter incasso", "in lastgeving" of eenige
      andere vermelding, met zich brengend een bloote opdracht tot inning, heeft geplaatst, kan de nemer alle uit de
      chèque voortvloeiende rechten uitoefenen, maar hij kan deze niet anders overdragen dan bijwege van lastgeving.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel183a
  - number: 183a.2
    text: |-
      Bij een zoodanige chèque kunnen de chèqueschuldenaren aan den houder slechts de verweermiddelen tegenwerpen, welke
      aan den trekker zouden kunnen worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel183a
  - number: 183a.3
    text: De opdracht, vervat in een incasso-chèque, eindigt niet door dood of latere onbekwaamheid van den lastgever.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel183a
  - number: '184'
    text: Eene in de chèque opgenomen renteclausule wordt voor niet geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel184
  - number: '185'
    text: |-
      De chèque kan betaalbaar zijn aan de woonplaats van eenen derde, hetzij in de plaats, waar de betrokkene zijn
      domicilie heeft, hetzij in een andere plaats.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel185
  - number: '186.1'
    text: |-
      De chèque, waarvan het bedrag voluit in letters en tevens in cijfers is geschreven, geldt, in geval van verschil,
      ten beloope van de som, voluit in letters geschreven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel186
  - number: '186.2'
    text: |-
      De chèque, waarvan het bedrag meermalen is geschreven, hetzij voluit in letters, hetzij in cijfers, geldt, in geval
      van verschil, slechts ten beloope van de kleinste som.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel186
  - number: '187'
    text: |-
      Indien de chèque handteekeningen bevat van personen, die onbekwaam zijn zich door middel van een chèque te
      verbinden, valsche handteekeningen of handteekeningen van verdichte personen, of handteekeningen, welke,
      onverschillig om welke andere reden, de personen, die die handteekeningen hebben geplaatst of in wier naam zulks
      is geschied, niet kunnen verbinden, zijn de verbintenissen der andere personen, wier handteekeningen op de chèque
      voorkomen, desniettemin geldig.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel187
  - number: '188'
    text: |-
      Ieder, die zijne handteekening op eene chèque plaatst als vertegenwoordiger van eenen persoon, voor wien hij
      niet de bevoegdheid had te handelen, is zelf krachtens de chèque verbonden, en heeft, betaald hebbende, dezelfde
      rechten, als de beweerde vertegenwoordigde zou hebben gehad. Hetzelfde geldt ten aanzien van den vertegenwoordiger,
      die zijne bevoegdheid heeft overschreden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel188
  - number: '189'
    text: |-
      De trekker staat in voor de betaling. Elke clausule, waarbij hij deze verplichting uitsluit, wordt voor niet
      geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel189
  - number: '190'
    text: |-
      Indien eene chèque, onvolledig ten tijde der uitgifte, is volledig gemaakt in strijd met de aangegane
      overeenkomsten, kan de niet-naleving van die overeenkomsten niet worden tegengeworpen aan den houder, die de cheque
      te goeder trouw heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel190
  - number: 190a
    text: |-
      De trekker, of degene voor wiens rekening de chèque is getrokken, is verplicht zorg te dragen dat het noodige fonds
      tot betaling op den dag der aanbieding in handen van den betrokkene zij, zelfs indien de chèque bij eenen derde is
      betaalbaar gesteld, onverminderd de verplichting van den trekker overeenkomstig [artikel 189][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel189
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel190a
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '189'
        afdeling: Eerste
  - number: 190b
    text: |-
      De betrokkene wordt geacht, het noodige fonds in handen te hebben, indien hij bij de aanbieding van de chèque
      aan den trekker of aan dengene voor wiens rekening is getrokken, een opeischbare som schuldig is, ten minste
      gelijkstaande met het beloop van de chèque.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel190b
  - number: '191.1'
    text: |-
      De chèque, die betaalbaar is gesteld aan een met name genoemden persoon met of zonder uitdrukkelijke clausule: "aan
      order", kan door middel van endossement worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel191
  - number: '191.2'
    text: |-
      De chèque, die betaalbaar is gesteld aan een met name genoemden persoon met de clausule: "niet aan order", of een
      soortgelijke clausule, kan slechts worden overgedragen in den vorm en met de gevolgen van een gewone cessie. Een op
      zulk een chèque geplaatst endossement geldt als een gewone cessie.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel191
  - number: '191.3'
    text: |-
      Het endossement kan worden gesteld zelfs ten voordeele van den trekker of van iederen anderen chèqueschuldenaar.
      Deze personen kunnen de chèque opnieuw endosseeren.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel191
  - number: '192.1'
    text: Het endossement moet onvoorwaardelijk zijn. Elke daarin opgenomen voorwaarde wordt voor niet geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel192
  - number: '192.2'
    text: Het gedeeltelijke endossement is nietig.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel192
  - number: '192.3'
    text: Eveneens is nietig het endossement van den betrokkene.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel192
  - number: '192.4'
    text: Het endossement aan toonder geldt als endossement in blanco.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel192
  - number: '192.5'
    text: |-
      Het endossement aan den betrokkene geldt slechts als kwijting, behoudens wanneer de betrokkene meer kantoren heeft
      en wanneer het endossement is gesteld ten voordeele van een ander kantoor dan dat, waarop de chèque is getrokken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel192
  - number: '193.1'
    text: |-
      Het endossement moet gesteld worden op de chèque of op een vastgehecht blad (verlengstuk). Het moet worden
      onderteekend door den endossant.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel193
  - number: '193.2'
    text: |-
      Het endossement kan den geëndosseerde onvermeld laten, of bestaan uit de enkele handteekening van den endossant
      (endossement in blanco). In het laatste geval moet het endossement om geldig te zijn, op de rugzijde van de chèque
      of op het verlengstuk worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel193
  - number: '194.1'
    text: Door het endossement worden alle uit de chèque voortvloeiende rechten overgedragen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel194
  - number: '194.2'
    text: 'Indien het endossement in blanco is, kan de houder:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel194
  - number: 194.2.1°
    text: het blanco invullen, hetzij met zijn eigen naam, hetzij met den naam van een anderen persoon;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel194
  - number: 194.2.2°
    text: de chèque wederom in blanco of aan een anderen persoon endosseeren;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel194
  - number: 194.2.3°
    text: de chèque aan eenen derde overgeven, zonder het blanco in te vullen, en zonder haar te endosseeren.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel194
  - number: '195.1'
    text: Tenzij het tegendeel bedongen is, staat de endossant in voor de betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel195
  - number: '195.2'
    text: |-
      Hij kan een nieuw endossement verbieden; in dat geval staat hij tegenover de personen, aan wie de chèque later is
      geëndosseerd, niet in voor de betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel195
  - number: '196'
    text: |-
      Hij, die een door endossement overdraagbare chèque onder zich heeft, wordt beschouwd als de rechtmatige houder,
      indien hij van zijn recht doet blijken door een ononderbroken reeks van endossementen, zelfs indien het laatste
      endossement in blanco is gesteld. De doorgehaalde endossementen worden te dien aanzien voor niet geschreven
      gehouden. Wanneer een endossement in blanco door een ander endossement is gevolgd, wordt de onderteekenaar van dit
      laatste geacht, de chèque door het endossement in blanco verkregen te hebben.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel196
  - number: '197'
    text: |-
      Een op eene chèque aan toonder voorkomend endossement maakt den endossant verantwoordelijk overeenkomstig de
      bepalingen betreffende het recht van regres; het maakt overigens den titel niet tot eene chèque aan order.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel197
  - number: '198'
    text: |-
      Indien iemand, op welke wijze dan ook, het bezit van de chèque heeft verloren, is de houder, in wiens handen de
      chèque zich bevindt, niet verplicht de chèque af te geven, indien hij deze te goeder trouw heeft verkregen en zulks
      onverschillig of het betreft eene chèque aan toonder, dan wel een voor endossement vatbare chèque, ten aanzien van
      welke de houder op de wijze in [artikel 196][ref1] voorzien van zijn recht doet blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel196
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel198
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '196'
        afdeling: Tweede
  - number: '199'
    text: |-
      Zij, die uit hoofde van de chèque worden aangesproken, kunnen de verweermiddelen, gegrond op hun persoonlijke
      verhouding tot den trekker of tot vroegere houders, niet aan den houder tegenwerpen, tenzij deze bij de verkrijging
      van de chèque desbewust ten nadeele van den schuldenaar heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel199
  - number: '200.1'
    text: |-
      Wanneer het endossement de vermelding bevat: "waarde ter incasseering", "ter incasso", "in lastgeving" of
      eenige andere vermelding, met zich brengend een bloote opdracht tot inning, kan de houder alle uit de chèque
      voortvloeiende rechten uitoefenen, maar hij kan deze niet anders endosseeren dan bijwege van lastgeving.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel200
  - number: '200.2'
    text: |-
      De chèqueschuldenaren kunnen in dat geval aan den houder slechts de verweermiddelen tegenwerpen, welke aan den
      endossant zouden kunnen worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel200
  - number: '200.3'
    text: |-
      De opdracht, vervat in een incasso-endossement, eindigt niet door den dood of door de latere onbekwaamheid van
      den lastgever.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel200
  - number: '201.1'
    text: |-
      Het endossement, na het protest of de daarmede gelijkstaande verklaring, of na het einde van den aanbiedingstermijn
      op de chèque gesteld, heeft slechts de gevolgen eener gewone cessie.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel201
  - number: '201.2'
    text: |-
      Behoudens tegenbewijs, wordt het endossement zonder dagteekening geacht te zijn gesteld vóór het protest of de
      daarmede gelijkstaande verklaringen, of vóór het verstrijken van den in het voorgaande lid bedoelden termijn.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel201
  - number: '202.1'
    text: |-
      De betaling van de chèque kan zoowel voor haar geheele bedrag als voor een gedeelte daarvan door eenen borgtocht
      (aval) worden verzekerd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel202
  - number: '202.2'
    text: |-
      Deze borgtocht kan door eenen derde, behalve door den betrokkene, of zelfs door iemand, wiens handteekening op de
      chèque voorkomt, worden gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel202
  - number: '203.1'
    text: Het aval wordt op de chèque of op een verlengstuk gesteld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel203
  - number: '203.2'
    text: |-
      Het wordt uitgedrukt door de woorden: "goed voor aval", of door een soortgelijke uitdrukking; het wordt door den
      avalgever onderteekend.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel203
  - number: '203.3'
    text: |-
      De enkele handteekening van den avalgever, gesteld op de voorzijde van de chèque, geldt als aval, behalve wanneer
      de handteekening die is van den trekker.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel203
  - number: '203.4'
    text: Het kan ook geschieden bij een afzonderlijk geschrift of bij een brief, vermeldende de plaats, waar het is gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel203
  - number: '203.5'
    text: |-
      In het aval moet worden vermeld, voor wien het is gegeven. Bij gebreke hiervan wordt het geacht voor den trekker te
      zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel203
  - number: '204.1'
    text: De avalgever is op dezelfde wijze verbonden als degene, voor wien het aval is gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel204
  - number: '204.2'
    text: |-
      Zijne verbintenis is geldig, zelfs indien, wegens een andere oorzaak dan een vormgebrek de door hem gewaarborgde
      verbintenis nietig is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel204
  - number: '204.3'
    text: |-
      Door te betalen verkrijgt de avalgever de rechten, welke krachtens de chèque kunnen worden uitgeoefend tegen
      dengene, voor wien het aval is gegeven en tegen degenen, die tegenover dezen krachtens de chèque verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel204
  - number: '205.1'
    text: De chèque is betaalbaar op zicht. Elke vermelding van het tegendeel wordt voor niet geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel205
  - number: '205.2'
    text: |-
      De chèque, die ter betaling wordt aangeboden vóór den dag, vermeld als datum van uitgifte, is betaalbaar op den dag
      van de aanbieding.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel205
  - number: '206.1'
    text: |-
      De chèque, die in hetzelfde land uitgegeven en betaalbaar is, moet binnen den termijn van acht dagen ter
      betaling worden aangeboden. Indien echter uit de chèque zelve blijkt, dat zij bestemd is om in een ander land
      te circuleeren, wordt deze termijn verlengd, hetzij tot twintig, hetzij tot zeventig dagen, al naar gelang zij
      bestemd was in hetzelfde of in een ander werelddeel te circuleeren. Te dien aanzien worden de chèques, uitgegeven
      en betaalbaar in een land in Europa en bestemd om te circuleeren in een kustland van de Middellandsche Zee of
      omgekeerd, beschouwd als bestemd om te circuleeren in hetzelfde werelddeel.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel206
  - number: '206.2'
    text: |-
      De chèque, uitgegeven in het Rijk in Europa en betaalbaar in Nederlandsch-Indië, Suriname of Curaçao, of omgekeerd,
      moet ter betaling aangeboden worden binnen den tijd van zeventig dagen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel206
  - number: '206.3'
    text: |-
      De chèque, die uitgegeven is in een ander land dan dat, waar zij betaalbaar is, moet worden aangeboden binnen een
      termijn, hetzij van twintig dagen, hetzij van zeventig dagen, naar gelang de plaats van uitgifte en de plaats van
      betaling gelegen zijn in hetzelfde of in een ander werelddeel.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel206
  - number: '206.4'
    text: |-
      Te dien aanzien worden de chèques, uitgegeven in een land in Europa en betaalbaar in een kustland van de
      Middellandsche Zee of omgekeerd, beschouwd als uitgegeven en betaalbaar in hetzelfde werelddeel.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel206
  - number: '206.5'
    text: De bovengenoemde termijnen beginnen te loopen van den dag, op de chèque als datum van uitgifte vermeld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel206
  - number: '207'
    text: |-
      De dag van uitgifte van eene chèque, getrokken tusschen twee plaatsen met verschillende tijdrekening, wordt herleid
      tot den overeenkomstigen dag van de tijdrekening van de plaats van betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel207
  - number: '208.1'
    text: De aanbieding aan eene verrekeningskamer geldt als aanbieding ter betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel208
  - number: '208.2'
    text: |-
      Bij algemeenen maatregel van bestuur zullen de instellingen worden aangewezen, die in den zin van dezen Titel als
      verrekeningskamers worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel208
  - number: '209.1'
    text: De herroeping van de chèque is slechts van kracht na het einde van den termijn van aanbieding.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel209
  - number: '209.2'
    text: Indien geene herroeping plaats heeft, kan de betrokkene zelfs na het einde van dien termijn betalen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel209
  - number: '210'
    text: |-
      Noch de dood van den trekker, noch zijn na de uitgifte opkomende onbekwaamheid zijn van invloed op de gevolgen van
      de chèque.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel210
  - number: '211.1'
    text: |-
      Buiten het geval, in [artikel 227a][ref1] vermeld, kan de betrokkene de chèque betalende, vorderen, dat hem deze,
      van behoorlijke kwijting van den houder voorzien, wordt uitgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel227a
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 227a
        afdeling: Zevende
  - number: '211.2'
    text: De houder mag niet weigeren een gedeeltelijke betaling aan te nemen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel211
  - number: '211.3'
    text: |-
      In geval van gedeeltelijke betaling kan de betrokkene vorderen, dat van die betaling op de chèque melding wordt
      gemaakt en dat hem daarvoor kwijting wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel211
  - number: '212.1'
    text: |-
      De betrokkene, die een door endossement overdraagbare chèque betaalt, is gehouden de regelmatigheid van de reeks
      van endossementen, maar niet de handteekening der endossanten te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel212
  - number: '212.2'
    text: |-
      Indien hij, niet bevrijdend betaald hebbende, verplicht wordt, ten tweede male te betalen, heeft hij verhaal op
      allen die de cheque niet te goeder trouw hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel212
  - number: '213.1'
    text: |-
      Eene chèque, waarvan de betaling is bedongen in ander geld dan dat van de plaats van betaling, kan binnen den
      termijn van aanbieding worden betaald in het geld van het land volgens zijne waarde op den dag van betaling. Indien
      de betaling niet heeft plaats gehad bij de aanbieding, kan de houder te zijner keuze vorderen, dat de chèquesom
      voldaan wordt in het geld van het land volgens den koers, hetzij van den dag van aanbieding, hetzij van den dag
      van betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel213
  - number: '213.2'
    text: |-
      De waarde van het vreemde geld wordt bepaald volgens de gebruiken van de plaats van betaling. De trekker kan echter
      voorschrijven, dat het te betalen bedrag moet worden berekend volgens een in de chèque voorgeschreven koers.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel213
  - number: '213.3'
    text: |-
      Het bovenstaande is niet van toepassing, indien de trekker heeft voorgeschreven, dat de betaling moet geschieden in
      een bepaald aangeduid geld (clausule van werkelijke betaling in vreemd geld).
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel213
  - number: '213.4'
    text: |-
      Indien het bedrag van de chèque is aangegeven in geld, hetwelk dezelfde benaming maar een verschillende waarde
      heeft in het land van uitgifte en in dat van betaling, wordt men vermoed het geld van de plaats van betaling te
      hebben bedoeld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel213
  - number: '214.1'
    text: De trekker of de houder van eene chèque kan deze kruisen met de in het volgende artikel genoemde gevolgen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel214
  - number: '214.2'
    text: |-
      De kruising geschiedt door het plaatsen van twee evenwijdige lijnen op de voorzijde van de chèque. Zij kan algemeen
      zijn of bijzonder.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel214
  - number: '214.3'
    text: |-
      De kruising is algemeen, indien zij tusschen de twee lijnen geen enkele aanwijzing bevat, of wel de vermelding:
      "bankier", of een soortgelijk woord; zij is bijzonder, indien de naam van eenen bankier voorkomt tusschen de twee
      lijnen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel214
  - number: '214.4'
    text: |-
      De algemeene kruising kan worden veranderd in een bijzondere, maar de bijzondere kruising kan niet worden veranderd
      in een algemeene.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel214
  - number: '214.5'
    text: De doorhaling van de kruising of van den naam van den aangewezen bankier wordt geacht niet te zijn geschied.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel214
  - number: '215.1'
    text: |-
      Eene chèque met algemeene kruising kan door den betrokkene slechts worden betaald aan eenen bankier of aan eenen
      cliënt van den betrokkene.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel215
  - number: '215.2'
    text: |-
      Eene chèque met bijzondere kruising kan door den betrokkene slechts worden betaald aan den aangewezen bankier
      of, indien deze de betrokkene is, slechts aan een zijner cliënten. Echter kan de aangegeven bankier de chèque ter
      incasseering aan een anderen bankier overdragen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel215
  - number: '215.3'
    text: |-
      Een bankier mag een gekruiste chèque slechts in ontvangst nemen van een van zijne cliënten of van een anderen
      bankier. Hij mag haar niet innen voor rekening van andere personen dan deze.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel215
  - number: '215.4'
    text: |-
      Een chèque, welke meer dan één bijzondere kruising draagt, mag door den betrokkene slechts worden betaald, indien
      er niet meer dan twee kruisingen zijn, waarvan de ééne strekt tot inning door eene verrekeningskamer.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel215
  - number: '215.5'
    text: |-
      De betrokkene of de bankier, die de bovenstaande bepalingen niet naleeft, is verantwoordelijk voor de schade tot
      beloop van het bedrag van de chèque.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel215
  - number: '216.1'
    text: |-
      De trekker, alsmede de houder van eene chèque, kan verbieden, dat deze in baar geld betaald wordt door op de
      voorzijde in schuinsche richting te vermelden: "in rekening te brengen", of een soortgelijke uitdrukking op te
      nemen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel216
  - number: '216.2'
    text: |-
      In dat geval mag de chèque den betrokkene slechts aanleiding geven tot eene boeking (rekening-courant, giro of
      schuldvergelijking). De boeking geldt als betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel216
  - number: '216.3'
    text: 'De doorhaling van de vermelding: "in rekening te brengen" wordt geacht niet te zijn geschied.'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel216
  - number: '216.4'
    text: |-
      De betrokkene, die de bovenstaande bepalingen niet naleeft, is verantwoordelijk voor de schade tot beloop van het
      bedrag van de chèque.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel216
  - number: '217'
    text: |-
      De houder kan zijn recht van regres uitoefenen op de endossanten, den trekker en de andere chèqueschuldenaren,
      indien de chèque, tijdig aangeboden, niet wordt betaald en indien de weigering van betaling wordt vastgesteld:
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel217
  - number: 217.1°
    text: hetzij door een authentieke akte (protest);
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel217
  - number: 217.2°
    text: |-
      hetzij door eene verklaring van den betrokkene, gedagteekend en geschreven op de chèque onder vermelding van den
      dag van aanbieding;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel217
  - number: 217.3°
    text: |-
      hetzij door een gedagteekende verklaring van eene verrekeningskamer, waarbij vastgesteld wordt, dat de chèque
      tijdig aangeboden en niet betaald is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel217
  - number: 217a.1
    text: |-
      Indien de non-betaling van de chèque door protest of een daarmede gelijkstaande verklaring is vastgesteld, is
      niettemin de trekker, al ware het protest niet in tijds gedaan of de met protest gelijkstaande verklaring niet
      in tijds afgegeven, tot vrijwaring gehouden, tenzij hij bewees, dat de betrokkene op den dag der aanbieding het
      noodige fonds tot betaling van de chèque in handen had. Indien het vereischte fonds slechts gedeeltelijk aanwezig
      was, is de trekker voor het ontbrekende gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel217a
  - number: 217a.2
    text: |-
      In geval van niet tijdig protest of niet tijdige met protest gelijkstaande verklaring is de trekker, op straffe van
      tot vrijwaring te zijn gehouden, verplicht, den houder af te staan en over te dragen de vordering op het fonds, dat
      de betrokkene van hem op den dag der aanbieding heeft in handen gehad, en zulks tot het beloop van de chèque; en
      hij moet aan den houder, te diens koste, de noodige bewijzen verschaffen om die vordering te doen gelden. Indien
      de trekker in staat van faillissement is verklaard of ten aanzien van hem de schuldsaneringsregeling natuurlijke
      personen van toepassing is verklaard, zijn de curatoren onderscheidenlijk de bewindvoerders in zijnen boedel tot
      dezelfde verplichtingen gehouden, ten ware deze mochten verkiezen, den houder als schuldeischer, voor het beloop
      van de chèque, toe te laten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel217a
  - number: '218.1'
    text: |-
      Het protest of de daarmede gelijkstaande verklaring moet worden gedaan vóór het einde van den termijn van
      aanbieding.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel218
  - number: '218.2'
    text: |-
      Indien de aanbieding plaats heeft op den laatsten dag van den termijn, kan het protest of de daarmede gelijkstaande
      verklaring op den eerstvolgenden werkdag worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel218
  - number: 218a.1
    text: |-
      De betaling van eene chèque moet gevraagd en het daaropvolgend protest gedaan worden ter woonplaatse van den
      betrokkene.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel218a
  - number: 218a.2
    text: |-
      Indien de chèque getrokken is om in een andere aangewezen woonplaats of door een anderen aangewezen persoon, hetzij
      in dezelfde, hetzij in een andere gemeente te worden betaald, moet de betaling gevraagd en het protest opgemaakt
      worden ter aangewezene woonplaats of aan den aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel218a
  - number: 218a.3
    text: |-
      [Artikel 54 van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel54
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel218a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '54'
  - number: 218b.1
    text: |-
      Het protest van non-betaling wordt gedaan door een deurwaarder. Deze kan zich desverkiezende doen vergezellen door
      een of twee getuigen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel218b
  - number: 218b.2
    text: 'Het protest behelst:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel218b
  - number: 218b.2.1°
    text: een letterlijk afschrift van de chèque, van de endossementen, van het aval en van de adressen daarop gesteld;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel218b
  - number: 218b.2.2°
    text: |-
      de vermelding dat zij de betaling aan de personen, of ter plaatse in het voorgaand artikel gemeld, afgevraagd en
      niet bekomen hebben;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel218b
  - number: 218b.2.3°
    text: de vermelding van de opgegeven reden van non-betaling;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel218b
  - number: 218b.2.4°
    text: de aanmaning om het protest te teekenen, en de redenen van weigering;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel218b
  - number: 218b.2.5°
    text: de vermelding, dat hij, deurwaarder, wegens die non-betaling heeft geprotesteerd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel218b
  - number: 218b.3
    text: |-
      Indien het protest een vermiste chèque betreft, volstaat, in plaats van het bepaalde onder 1°. van het voorgaande
      lid, een zoo nauwkeurig mogelijke omschrijving van den inhoud der chèque.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel218b
  - number: 218c
    text: |-
      De deurwaarders zijn verplicht, op straffe van schadevergoeding, afschrift van het protest te laten, en hiervan
      melding in het afschrift te maken, en hetzelve, naar orde des tijds, in te schrijven in een bijzonder register,
      genommerd en gewaarmerkt door de kantonrechter van de rechtbank van het arrondissement waarin hun woonplaats is
      gelegen, en om wijders, zulks begeerd wordende, een of meer afschriften van het protest aan de belanghebbenden
      te leveren.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel218c
  - number: '219.1'
    text: |-
      De houder moet van de non-betaling kennisgeven aan zijnen endossant en aan den trekker binnen de vier werkdagen,
      volgende op den dag van het protest of de daarmede gelijkstaande verklaring en, indien de chèque getrokken is met
      de clausule zonder kosten, volgende op dien der aanbieding. Elke endossant moet binnen de twee werkdagen, volgende
      op den dag van ontvangst der kennisgeving, de door hem ontvangen kennisgeving aan zijnen endossant mededeelen,
      met aanwijzing van de namen en adressen van degenen, die de voorafgaande kennisgevingen hebben gedaan, en zoo
      vervolgens, teruggaande tot den trekker. Deze termijnen loopen van de ontvangst der voorafgaande kennisgeving af.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel219
  - number: '219.2'
    text: |-
      Indien overeenkomstig het voorgaande lid eene kennisgeving is gedaan aan iemand, wiens handteekening op de chèque
      voorkomt, moet gelijke kennisgeving binnen denzelfden termijn aan diens avalgever worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel219
  - number: '219.3'
    text: |-
      Indien een endossant zijn adres niet of op onleesbare wijze heeft aangeduid, kan worden volstaan met kennisgeving
      aan den voorafgaanden endossant.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel219
  - number: '219.4'
    text: |-
      Hij, die eene kennisgeving heeft te doen, kan zulks doen in iederen vorm, zelfs door enkele terugzending van de
      chèque.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel219
  - number: '219.5'
    text: |-
      Hij moet bewijzen, dat hij de kennisgeving binnen den vastgestelden termijn heeft gedaan. Deze termijn wordt
      gehouden te zijn in acht genomen, wanneer een brief, die de kennisgeving behelst, binnen den genoemden termijn ter
      post is bezorgd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel219
  - number: '219.6'
    text: |-
      Hij, die de kennisgeving niet binnen den bovenvermelden termijn doet, stelt zich niet bloot aan verval van
      zijn recht, hij is, indien daartoe aanleiding bestaat, verantwoordelijk voor de schade, door zijne nalatigheid
      veroorzaakt, zonder dat echter de schadevergoeding de chèquesom kan te boven gaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel219
  - number: '220.1'
    text: |-
      De trekker, een endossant of een avalgever kan door de clausule "zonder kosten", "zonder protest", of een andere
      soortgelijke op de chèque gestelde en onderteekende clausule, den houder van het opmaken van een protest of een
      daarmede gelijkstaande verklaring ter uitoefening van zijn recht van regres ontslaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel220
  - number: '220.2'
    text: |-
      Deze clausule ontslaat den houder niet van de aanbieding van de chèque binnen de voorgeschreven termijnen, noch
      van het doen van de kennisgevingen. Het bewijs van de niet-inachtneming der termijnen moet worden geleverd door
      dengene, die zich daarop tegenover den houder beroept.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel220
  - number: '220.3'
    text: |-
      Is de clausule door den trekker gesteld, dan heeft zij gevolgen ten aanzien van allen, wier handteekeningen op de
      chèque voorkomen; is zij door eenen endossant of door eenen avalgever gesteld, dan heeft zij gevolgen alleen voor
      dezen endossant of avalgever. Indien de houder, ondanks de door den trekker gestelde clausule, toch de weigering
      van betaling doet vaststellen door protest of een daarmede gelijkstaande verklaring, zijn de kosten daarvan voor
      zijne rekening. Indien de clausule van eenen endossant of eenen avalgever afkomstig is, kunnen de kosten van het
      protest of van de daarmede gelijkstaande verklaring, indien een akte van dien aard is opgesteld, op allen, wier
      handteekeningen op de chèque voorkomen, worden verhaald.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel220
  - number: '221.1'
    text: |-
      Allen, die uit hoofde van eene chèque verbonden zijn, zijn hoofdelijk jegens den houder verbonden. Bovendien is
      ook de derde, voor wiens rekening de chèque is getrokken en die de waarde daarvoor heeft genoten, jegens den houder
      aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel221
  - number: '221.2'
    text: |-
      De houder kan deze personen, zoowel ieder afzonderlijk, als gezamenlijk, aanspreken, zonder verplicht te zijn de
      volgorde, waarin zij zich hebben verbonden, in acht te nemen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel221
  - number: '221.3'
    text: |-
      Hetzelfde recht komt toe aan ieder, wiens handteekening op de chèque voorkomt en die deze, ter voldoening aan
      zijnen regresplicht, heeft betaald.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel221
  - number: '221.4'
    text: |-
      De vordering, ingesteld tegen éénen der chèqueschuldenaren, belet niet de anderen aan te spreken, al hadden dezen
      zich later verbonden dan de eerst aangesprokene.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel221
  - number: 221a.1
    text: |-
      De houder van eene chèque, waarvan de non-betaling door protest of een daarmede gelijk staande verklaring is
      vastgesteld, heeft in geen geval eenig recht op het fonds, dat de betrokkene van den trekker in handen heeft.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel221a
  - number: 221a.2
    text: |-
      Bij faillissement van den trekker of indien ten aanzien van hem van de schuldsaneringsregeling natuurlijke personen
      van toepassing is verklaard behooren die penningen aan diens boedel.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel221a
  - number: '222'
    text: 'De houder kan van dengene, tegen wien hij zijn recht van regres uitoefent, vorderen:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel222
  - number: 222.1°
    text: de som van de niet betaalde chèque;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel222
  - number: 222.2°
    text: |-
      de wettelijke rente, te rekenen van de dag der aanbieding, voor chèques die in Nederland uitgegeven en betaalbaar
      zijn, en een rente van zes ten honderd, te rekenen van de dag der aanbieding, voor alle overige chèques;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel222
  - number: 222.3°
    text: |-
      de kosten van protest of van de daarmede gelijkstaande verklaring, die van de gedane kennisgevingen, alsmede de
      andere kosten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel222
  - number: '223'
    text: |-
      Hij, die ter voldoening aan zijnen regresplicht de chèque heeft betaald, kan van degenen, die tegenover hem
      regresplichtig zijn, vorderen:
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel223
  - number: 223.1°
    text: het geheele bedrag, dat hij betaald heeft;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel223
  - number: 223.2°
    text: |-
      de wettelijke rente, te rekenen van de dag der betaling, voor chèques die in Nederland uitgegeven en betaalbaar
      zijn, en een rente van zes ten honderd, te rekenen van de dag der betaling, voor alle overige chèques;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel223
  - number: 223.3°
    text: de door hem gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel223
  - number: '224.1'
    text: |-
      Elke chèqueschuldenaar, tegen wien het recht van regres wordt of kan worden uitgeoefend, kan, tegen betaling ter
      voldoening aan zijnen regresplicht, de afgifte vorderen van de chèque met het protest, of de daarmede gelijkstaande
      verklaring, alsmede een voor voldaan geteekende rekening.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel224
  - number: '224.2'
    text: |-
      Elke endossant, die ter voldoening aan zijnen regresplicht, de chèque heeft betaald, kan zijn endossement en dat
      van de volgende endossanten doorhalen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel224
  - number: '225.1'
    text: |-
      Wanneer de aanbieding van de chèque, het opmaken van het protest, of de daarmede gelijkstaande verklaring, binnen
      de voorgeschreven termijnen wordt verhinderd door een onoverkomelijk beletsel (wettelijk voorschrift van eenigen
      Staat of ander geval van overmacht), worden deze termijnen verlengd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel225
  - number: '225.2'
    text: |-
      De houder is verplicht van de overmacht onverwijld aan zijnen endossant kennis te geven, en deze kennisgeving,
      gedagteekend en onderteekend op de chèque of op een verlengstuk te vermelden; voor het overige zijn de bepalingen
      van [artikel 219][ref1] toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel219
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '219'
        afdeling: Zesde
  - number: '225.3'
    text: |-
      Na ophouden van de overmacht moet de houder onverwijld de chèque ter betaling aanbieden, en, indien daartoe
      aanleiding bestaat, de weigering van betaling doen vaststellen door protest of een daarmede gelijkstaande
      verklaring.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel225
  - number: '225.4'
    text: |-
      Indien de overmacht meer dan vijftien dagen aanhoudt, te rekenen van den dag, waarop de houder, al ware het vóór
      het einde van den aanbiedingstermijn, van de overmacht aan zijnen endossant heeft kennis gegeven, kan het recht
      van regres worden uitgeoefend, zonder dat de aanbieding of het opmaken van protest of de daarmede gelijkstaande
      verklaring noodig zijn.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel225
  - number: '225.5'
    text: |-
      Feiten, welke voor den houder of voor dengene, dien hij met de aanbieding van de chèque of met het opmaken van het
      protest of de daarmede gelijkstaande verklaring belastte, van zuiver persoonlijken aard zijn, worden niet beschouwd
      als gevallen van overmacht.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel225
  - number: '226'
    text: |-
      Behoudens de chèques aan toonder, kan elke chèque, uitgegeven in een land en betaalbaar in een ander land of in een
      overzeesch gebied van hetzelfde land en omgekeerd, of wel uitgegeven en betaalbaar in een zelfde overzeesch gebied
      of in verschillende overzeesche gebieden van hetzelfde land, in meer gelijkluidende exemplaren worden getrokken.
      Wanneer eene chèque in meer exemplaren is getrokken, moeten die exemplaren in den tekst zelf van den titel worden
      genummerd bij gebreke waarvan elk exemplaar wordt beschouwd als een afzonderlijke chèque.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel226
  - number: '227.1'
    text: |-
      De betaling op één der exemplaren gedaan, bevrijdt, ook al ware niet bedongen, dat die betaling de kracht der
      andere exemplaren te niet doet.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel227
  - number: '227.2'
    text: |-
      De endossant, die de exemplaren aan verschillende personen heeft overgedragen, alsook de latere endossanten, zijn
      verbonden wegens alle exemplaren, die hunne handteekening dragen en die niet zijn uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel227
  - number: 227a
    text: |-
      Degene die de cheque waarvan hij houder was, vermist, kan met inachtneming van
      [artikel 49, derde lid, van Boek 6 van het Burgerlijk Wetboek][ref1] van de betrokkene betaling vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel49
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '49'
  - number: 227b
    text: |-
      Degene die een cheque waarvan hij houder was, en welke is vervallen en, zoveel nodig, geprotesteerd, vermist, kan
      met inachtneming van [artikel 49, derde lid, van Boek 6 van het Burgerlijk Wetboek][ref1] zijn rechten alleen tegen
      de trekker uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel49
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '49'
  - number: '228'
    text: |-
      In geval van verandering van den tekst van eene chèque zijn zij, die daarna hunne handteekeningen op de chèque
      geplaatst hebben, volgens den veranderden tekst verbonden; zij, die daarvoor hunne handteekeningen op de chèque
      geplaatst hebben, zijn verbonden volgens den oorspronkelijken tekst.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel228
  - number: 228a
    text: |-
      Behoudens de bepalingen van het volgende artikel gaat schuld uit eene chèque te niet door alle middelen van
      schuldbevrijding, bij het Burgerlijk Wetboek aangewezen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel228a
  - number: '229.1'
    text: |-
      De regresvorderingen van den houder tegen de endossanten, den trekker en de andere chèqueschuldenaren, verjaren
      door een tijdsverloop van zes maanden, te rekenen van het einde van den termijn van aanbieding.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229
  - number: '229.2'
    text: |-
      De regresvorderingen van de verschillende chèqueschuldenaren tegen elkander, die gehouden zijn tot de betaling van
      eene chèque, verjaren door een tijdsverloop van zes maanden, te rekenen van den dag, waarop de chèqueschuldenaar
      ter voldoening aan zijnen regresplicht de chèque heeft betaald, of van den dag, waarop hij zelf in rechte is
      aangesproken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229
  - number: '229.3'
    text: |-
      De in het eerste en tweede lid bedoelde verjaring kan niet worden ingeroepen door den trekker, indien of voor
      zoover hij geen fonds heeft bezorgd noch door den trekker of de endossanten, die zich ongerechtvaardigd zouden
      hebben verrijkt; alles onverminderd het bepaalde in [artikel 306 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel306
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '306'
  - number: 229a.1
    text: |-
      De stuiting der verjaring is slechts van kracht tegen dengene, ten aanzien van wien de stuitingshandeling heeft
      plaats gehad.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229a
  - number: 229a.2
    text: |-
      Op de in het vorige artikel bedoelde verjaringen is [artikel 321, eerste lid, onder ][ref1] niet van toepassing;
      in de gevallen bedoeld in [artikel 321, eerste lid, onder ][ref2] heeft de onbekwame of rechthebbende, wiens
      rechtsvordering is verjaard, verhaal op de wettelijke vertegenwoordiger of bewindvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel321
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel321
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '321'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '321'
  - number: 229abis
    text: |-
      Met bankiers, genoemd in de voorafgaande Afdeelingen van dezen Titel worden gelijkgesteld alle personen of
      instellingen, die in hun werkzaamheid regelmatig gelden ter onmiddellijke beschikking van anderen houden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229abis
  - number: 229b.1
    text: De aanbieding en het protest van eene chèque kunnen niet plaats hebben dan op eenen werkdag.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229b
  - number: 229b.2
    text: |-
      Wanneer de laatste dag van den termijn, door de wet gesteld voor het verrichten van handelingen nopens de chèque,
      met name voor de aanbieding en voor het opmaken van het protest of een daarmede gelijkstaande verklaring, een
      wettelijke feestdag is, wordt deze termijn verlengd tot den eersten werkdag, volgende op het einde van dien
      termijn. De tusschenliggende feestdagen zijn begrepen in de berekening van den termijn.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229b
  - number: 229bbis
    text: |-
      Als wettelijke feestdag in den zin van deze Afdeeling worden beschouwd de Zondag, de Nieuwjaarsdag, de Christelijke
      tweede Paasch- en Pinksterdagen, de beide Kerstdagen, de Hemelvaartsdag en de verjaardag des Konings.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229bbis
  - number: 229c
    text: |-
      In de termijnen, bij de voorafgaande Afdeelingen van dezen Titel voorzien, is niet begrepen de dag, waarop deze
      termijnen beginnen te loopen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229c
  - number: 229d
    text: Geen enkele respijtdag, noch wettelijke, noch rechterlijke, is toegestaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229d
  - number: 229e
    text: Quitantiën en promessen aan toonder moeten de juiste dagteekening der oorspronkelijke uitgifte bevatten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229e
  - number: 229f
    text: |-
      De oorspronkelijke uitgever van quitantiën aan toonder, door eenen derde betaalbaar, is jegens iederen houder voor
      de voldoening aansprakelijk gedurende tien dagen na de dagteekening, die dag niet daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229f
  - number: 229g.1
    text: |-
      De verantwoordelijkheid van den oorspronkelijken uitgever blijft echter voortduren, tenzij hij bewees, dat hij,
      gedurende den bij het vorige artikel bepaalden tijd, fonds ten beloope van het uitgegeven papier bij den persoon,
      op wien hetzelve is afgegeven, heeft gehad.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229g
  - number: 229g.2
    text: |-
      De oorspronkelijke uitgever is, op straffe van voortduring van zijne verantwoordelijkheid, verpligt den houder
      af te staan en over te dragen de vordering op het fonds, dat de persoon, op wien het papier is afgegeven van
      hem ten vervaldage heeft in handen gehad, en zulks ten beloope van het uitgegeven papier; en hij moet aan den
      houder, te diens koste, de noodige bewijzen verschaffen om die vordering te doen gelden. Indien de oorspronkelijke
      uitgever in staat van faillissement is verklaard of ten aanzien van hem de schuldsaneringsregeling natuurlijke
      personen van toepassing is verklaard, zijn de curatoren onderscheidenlijk de bewindvoerders in zijnen boedel tot
      dezelfde verpligtingen gehouden, ten ware deze mogten verkiezen, den houder als schuldeischer, ten beloope van het
      uitgegeven papier, toe te laten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229g
  - number: 229h
    text: |-
      Buiten den oorspronkelijken uitgever, blijft een ieder die het voormeld papier in betaling heeft gegeven, gedurende
      den tijd van drie dagen daarna, de dag der uitgifte niet daaronder begrepen, aansprakelijk jegens dengenen die het
      van hem heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229h
  - number: 229i.1
    text: |-
      De houder eener promesse aan toonder is verpligt voldoening te vorderen binnen den tijd van drie dagen na den dag,
      op welken hij dat papier heeft in betaling genomen, die dag niet daaronder gerekend, en hij moet, bij wanbetaling,
      binnen een gelijken termijn daarna, de promesse ter intrekking aanbieden aan dengenen die hem dezelve heeft in
      betaling gegeven, alles op verbeurte van zijn verhaal tegen denzelven, doch onverminderd zijn regt tegen dengenen
      die de promesse heeft geteekend.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229i
  - number: 229i.2
    text: |-
      Indien bij de promesse de dag is uitgedrukt op welken dezelve betaalbaar is, begint de termijn van drie dagen eerst
      te loopen daags na den uitgedrukten betaaldag.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229i
  - number: 229j
    text: |-
      Indien de laatste dag van eenigen termijn, waaromtrent in deze Afdeeling eenige bepaling voorkomt, invalt op eenen
      wettelijken feestdag in den zin van [art. 229b bis][ref1], blijft de verpligting en verantwoordelijkheid voortduren
      tot en met den eersten daaropvolgenden dag, welke geen wettelijke feestdag is.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel229bbis
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229j
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 229bbis
        afdeling: Tiende
  - number: 229k.1
    text: |-
      Alle regtsvordering tegen de in deze Afdeeling vermelde uitgevers van papier, of tegen hen, die buiten den
      oorspronkelijken uitgever het papier in betaling hebben gegeven, verjaart door tijdsverloop van zes maanden, te
      rekenen van den dag der oorspronkelijke uitgifte.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229k
  - number: 229k.2
    text: |-
      De in het vorig lid bedoelde verjaring kan niet worden ingeroepen door den uitgever, indien of voor zoover hij
      geen fonds heeft bezorgd noch door den uitgever of door hen, die buiten den oorspronkelijken uitgever het papier
      in betaling hebben gegeven, voor zoover ze zich ongeregtvaardigd zouden hebben verrijkt; alles onverminderd het
      bepaalde in [artikel 306 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel306
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229k
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '306'
  - number: 229k.3
    text: |-
      Op de in dit artikel genoemde verjaringen is het [tweede lid van art. 229a][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel229a
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel229k
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 229a
        afdeling: Negende
  - number: '309.1'
    text: |-
      De betekenis van begrippen voorkomende in [Boek 8 van het Burgerlijk Wetboek][ref1], met uitzondering van die
      voorkomende in de [artikelen 5][ref2], [6][ref3], [7][ref4] en [10][ref5], geldt evenzeer voor dit wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0005034
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0005034#Artikel10
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel309
    references:
      - id: ref1
        bwb_id: BWBR0005034
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0005034
        artikel: '10'
  - number: '309.2'
    text: Onder zeewerkgever is te verstaan de eigenaar of, in geval van rompbevrachting, de rompbevrachter.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel309
  - number: '310'
    text: In den eersten tot en met den vierden titel van dit boek worden onder schepen uitsluitend verstaan zeeschepen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel310
  - number: '311.1'
    text: 'Een schip is een Nederlands schip indien voldaan wordt aan de volgende vereisten:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311
  - number: 311.1.a
    text: 'het schip is eigendom van een of meer:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311
  - number: 311.1.a.1°
    text: |-
      natuurlijke personen die de nationaliteit bezitten van een lidstaat van de Europese Unie, van een andere staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, van Zwitserland of die worden
      gelijkgesteld met EU-onderdanen ingevolge het van het Gemeenschapsrecht afgeleide recht;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311
  - number: 311.1.a.2°
    text: |-
      vennootschappen waarop het recht van een lidstaat van de Europese Unie, van een van de landen, eilanden of
      gebieden, bedoeld in artikel 299, tweede tot en met vijfde lid en zesde lid, onder c, van het EG-Verdrag, van
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of van Zwitserland
      toepasselijk is;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311
  - number: 311.1.a.3°
    text: |-
      rechtspersonen, niet zijnde een vennootschap als bedoeld onder 2°, waarop het recht van een lidstaat van de
      Europese Unie, van een van de landen, eilanden of gebieden, bedoeld in artikel 299, tweede tot en met vijfde lid
      en zesde lid, onder c, van het EG-Verdrag, van een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of van Zwitserland toepasselijk is;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311
  - number: 311.1.a.4°
    text: |-
      natuurlijke personen, vennootschappen of rechtspersonen niet bedoeld onder 1°, 2°, onderscheidenlijk 3°, die
      aanspraak kunnen maken op het Europese recht van vrije vestiging ingevolge een overeenkomst tussen de Europese Unie
      en een derde staat;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311
  - number: 311.1.b
    text: |-
      de eigenaar heeft in Nederland een hoofdvestiging of nevenvestiging in de zin van de
      [Handelsregisterwet 2007][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 311.1.c
    text: |-
      een of meer natuurlijke personen die in Nederland kantoor houden zijn namens de eigenaar verantwoordelijk voor het
      schip, de kapitein en de overige leden van de bemanning, alsmede voor de daarmee verband houdende aangelegenheden
      en zijn dienaangaande alleen of tezamen beslissingsbevoegd en beschikken over vertegenwoordigingsbevoegdheid, en
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311
  - number: 311.1.d
    text: |-
      een of meer van de natuurlijke personen als bedoeld onder c of, bij verhindering, een plaatsvervanger is bij
      voortduring bereikbaar en beschikt over bevoegdheden om onverwijld te kunnen handelen in situaties waarin dat
      geboden is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311
  - number: '311.2'
    text: |-
      Ingeval een schip eigendom is van een natuurlijke persoon die tevens kapitein is van dat schip is dat schip een
      Nederlands schip indien wordt voldaan aan het eerste lid, onderdeel a, onder 1° of onder 4° en onderdeel b, en er
      in Nederland aan de wal een vertegenwoordiger van die eigenaar is die bij voortduring bereikbaar is en beschikt
      over bevoegdheden om onverwijld te kunnen handelen in situaties waarin dat geboden is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311
  - number: '311.3'
    text: |-
      Ingeval de eigenaar de verantwoordelijkheid voor het beheer van zijn schip overdraagt aan een vennootschap als
      bedoeld in het eerste lid, onderdeel a, onder 2°, of onder 4°, en het beheer van dat schip voor rekening van de
      eigenaar geschiedt, is dat schip een Nederlands schip indien die vennootschap voldoet aan de vereisten, bedoeld
      in het eerste lid, onderdelen b tot en met d. De eigenaar behoeft in dat geval niet te voldoen aan het eerste lid,
      onderdelen b tot en met d. Indien de eigenaar niet voldoet aan het eerste lid, onderdeel b, kiest hij woonplaats
      ten kantore van de vestiging in Nederland van de vennootschap waaraan het beheer is overgedragen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311
  - number: '311.4'
    text: |-
      Een schip dat uitsluitend anders dan in de uitoefening van een beroep of bedrijf wordt gebruikt, is een Nederlands
      schip indien wordt voldaan aan het eerste lid, onderdeel a, onder 1°, onder 3° of onder 4° en er in Nederland
      aan de wal een natuurlijk persoon is met voldoende volmacht van de eigenaar om onverwijld te kunnen handelen in
      situaties waarin dat geboden is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311
  - number: 311a.1
    text: |-
      Door of namens Onze Minister van Verkeer en Waterstaat wordt ten behoeve van de teboekstelling, bedoeld in
      [artikel 194 van Boek 8 van het Burgerlijk Wetboek][ref1], op verzoek van de reder aan deze een verklaring
      afgegeven, dat met betrekking tot zijn schip wordt voldaan aan de in [artikel 311][ref2] genoemde vereisten.
      Indien met betrekking tot een schip niet langer wordt voldaan aan de in artikel 311 genoemde vereisten wordt
      deze verklaring door Onze Minister van Verkeer en Waterstaat ingetrokken. Van deze intrekking wordt, nadat de
      beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist, onverwijld mededeling gedaan
      aan de in [artikel 6 van de Kadasterwet][ref3] bedoelde bewaarder van het kadaster en de openbare registers van het
      kantoor waar het schip te boek staat.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel311
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel6
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311a
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '194'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '311'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '6'
  - number: 311a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld betreffende de schriftelijke bewijsstukken en
      andere gegevens die de reder bij de aanvraag van de verklaring, bedoeld in het eerste lid, dient te verstrekken,
      alsmede betreffende het toezicht op het voldoen aan de in [artikel 311][ref1] genoemde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311a
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
  - number: 311a.3
    text: |-
      De kosten van aanvraag en afgifte van een verklaring als bedoeld in de eerste volzin van het eerste lid, komen ten
      laste van de aanvrager. Het tarief voor deze kosten wordt vastgesteld bij regeling van Onze Minister van Verkeer
      en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311a
  - number: 311b.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de [artikelen 311][ref1] en [311a][ref2] bepaalde, zijn
      belast de bij besluit van Onze Minister van Verkeer en Waterstaat aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel311a
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311b
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 311a
  - number: 311b.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311b
  - number: 311b.3
    text: |-
      De toezichthoudende ambtenaren zijn bevoegd inlichtingen te verlangen, voor zover dat voor de vervulling van hun
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel311b
  - number: '312'
    text: |-
      Een schip, dat hier te lande is of wordt gebouwd, wordt als een Nederlandsch schip beschouwd, totdat de bouwer het
      heeft opgeleverd aan hem, voor wiens rekening het is of wordt gebouwd, of wel het voor eigen rekening in de vaart
      heeft gebracht.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel312
  - number: '319'
    text: |-
      Op zeevissersschepen zijn de [artikelen 311][ref1] en [312][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel312
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel319
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '312'
  - number: 319b
    text: |-
      De bepalingen van de [artikelen 311][ref1] en [312][ref2] zijn niet van toepassing op schepen, aan het Rijk of
      eenig openbaar lichaam toebehoorende, welke tot den openbaren dienst zijn bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel312
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel319b
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '312'
  - number: '340'
    text: |-
      In deze titel wordt verstaan onder Nederlands schip: een schip dat Nederlands is op grond van [artikel 311][ref1]
      van dit boek, dan wel op grond van [artikel 5 van de Wet nationaliteit zeeschepen in rompbevrachting][ref2] .


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
      [ref2]: https://wetten.overheid.nl/BWBR0005681#Artikel5
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel340
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
      - id: ref2
        bwb_id: BWBR0005681
        artikel: '5'
  - number: '341'
    text: Onder opvarenden worden in dezen titel verstaan allen, die zich aan boord bevinden, buiten den kapitein.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel341
  - number: '342'
    text: |-
      De kapitein is verplicht met zoodanige bekwaamheid en nauwgezetheid en met zoodanig beleid te handelen als voor
      eene behoorlijke vervulling zijner taak noodig is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel342
  - number: '343.1'
    text: |-
      De kapitein is verplicht de gebruikelijke regels en de bestaande voorschriften ter verzekering van de
      zeewaardigheid en de veiligheid van het schip, van de veiligheid der opvarenden en der zaken aan boord, met
      nauwgezetheid op te volgen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel343
  - number: '343.2'
    text: |-
      Hij onderneemt de reis niet, tenzij het schip tot het volvoeren daarvan geschikt, naar behooren uitgerust en
      voldoende bemand is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel343
  - number: '344'
    text: |-
      De kapitein is verplicht overal waar de wet, de gewoonte of de voorzichtigheid dit gebiedt, zich van een loods
      te bedienen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel344
  - number: '345'
    text: |-
      De kapitein mag gedurende de vaart of bij dreigend gevaar het schip niet verlaten, tenzij zijne afwezigheid
      volstrekt noodzakelijk is of de zorg voor lijfsbehoud hem daartoe dwingt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel345
  - number: '346'
    text: |-
      De kapitein is verplicht voor de aan boord zijnde goederen van een gedurende de reis overleden opvarende te zorgen
      en ten overstaan van twee der opvarenden daarvan een behoorlijke beschrijving te maken of te doen maken, welke door
      hem en door deze opvarenden wordt onderteekend.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel346
  - number: '347.1'
    text: |-
      De kapitein moet aan boord voorzien zijn van: den zeebrief, den meetbrief en een uittreksel uit de registratie
      voor schepen als bedoeld in [artikel 101, eerste lid, van de Kadasterwet][ref1] vermeldende tenminste de gegevens,
      bedoeld in [artikel 85, tweede lid, onder ][ref2], alsmede de gegevens omtrent niet doorgehaalde voorlopige
      aantekeningen, met dien verstande dat, ingeval dat uittreksel meer dan één dag vóór die van het laatste vertrek
      van het schip uit een Nederlandse haven is afgegeven, op dat uittreksel een verklaring van de bewaarder van het
      kadaster en de openbare registers moet voorkomen dat sedert de afgifte de op dat uittreksel vermelde gegevens
      blijkens de stukken, ingeschreven in de desbetreffende openbare registers tot op de dag vóór die van het vertrek,
      geen wijziging hebben ondergaan; het manifest der lading, de charter-partij en de cognossementen, dan wel
      afschriften van die stukken; de Nederlandsche wetten en reglementen op de reis van toepassing, en alle verdere
      noodige papieren.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel347
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '101'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '85'
  - number: '347.2'
    text: |-
      Ten aanzien van de charter-partij en de cognossementen geldt deze verplichting niet in de door Ons te omschrijven
      omstandigheden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel347
  - number: '348.1'
    text: |-
      De kapitein zorgt, dat aan boord een scheepsdagboek (*dagregister* of *journaal*) wordt gehouden, waarin alles van
      eenig belang, dat op de reis voorvalt, nauwkeurig wordt opgeteekend.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel348
  - number: '348.2'
    text: |-
      De kapitein van een schip, dat door mechanische kracht wordt voortbewogen, zorgt bovendien, dat door een lid van
      het machinekamer-personeel een machine-dagboek wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel348
  - number: '349.1'
    text: Op Nederlandse schepen mogen alleen dagboeken in gebruik worden genomen, welke blad voor blad zijn genummerd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel349
  - number: '349.2'
    text: |-
      De dagboeken worden, zo mogelijk, dagelijks bijgehouden, gedagtekend en door de kapitein en de schepeling, die hij
      met het houden van het boek heeft belast, ondertekend.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel349
  - number: '349.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het inrichten van de
      dagboeken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel349
  - number: '350'
    text: |-
      De kapitein, de eigenaar en de rompbevrachter zijn verplicht aan belanghebbenden op hunne aanvrage inzage en, tegen
      betaling van de kosten, afschrift van de dagboeken te geven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel350
  - number: '351'
    text: |-
      Wanneer de kapitein zich in zaken van aanbelang met leden van de bemanning heeft beraden, wordt van de hem gegeven
      adviezen in het scheepsdagboek melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel351
  - number: '353.1'
    text: |-
      Na aankomst in een haven kan de kapitein door een notaris eene scheepsverklaring doen opmaken omtrent de voorvallen
      der reis.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel353
  - number: '353.2'
    text: |-
      Indien het schip of de zaken aan boord schade hebben geleden of eenig buitengewoon voorval heeft plaats gehad, is
      de kapitein verplicht binnen 48 uren na aankomst, in de plaats van aankomst of in een nabijgelegen plaats althans
      eene voorloopige verklaring te doen opmaken. Eene voorloopige verklaring moet binnen acht dagen door eene volledige
      verklaring worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel353
  - number: '353.3'
    text: |-
      De kapitein heeft zich te wenden in het Koninkrijk buiten Europa tot het bevoegde gezag en buiten het Koninkrijk
      tot den Nederlandschen consulairen ambtenaar of, bij ontstentenis van zoodanigen ambtenaar, tot het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel353
  - number: '353.4'
    text: |-
      De notaris is verplicht van scheepsverklaringen tegen betaling der kosten afschrift uit te reiken aan ieder die
      het verlangt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel353
  - number: '354.1'
    text: |-
      Bij het berekenen van de in [artikel 353][ref1] genoemde wettelijke termijn tellen de Zondag en de daarmede
      gelijkgestelde dagen en, in het buitenland, de aldaar algemeen erkende wettelijke feestdagen niet mede.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel353
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel354
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '353'
  - number: '354.2'
    text: |-
      Met den Zondag worden gelijkgesteld de Nieuwjaarsdag, de Christelijke tweede Paasch- en Pinksterdagen, de beide
      Kerstdagen en de Hemelvaartsdag.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel354
  - number: '355'
    text: |-
      De door den kapitein aan te wijzen schepelingen zijn verplicht bij het opmaken van de scheepsverklaring hunne
      medewerking te verleenen door van hunne bevinding verklaring af te leggen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel355
  - number: '356'
    text: |-
      De beoordeeling van de bewijskracht van scheepsdagboeken en scheepsverklaringen, ten aanzien van de daarin vermelde
      voorvallen der reis, is voor ieder geval aan den rechter overgelaten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel356
  - number: '357'
    text: |-
      De kapitein is bevoegd, indien dit tot behoud van schip of lading noodzakelijk is, scheepstoebehooren en
      bestanddeelen van de lading zoowel over boord te werpen als te verbruiken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel357
  - number: '358'
    text: |-
      De kapitein is in geval van nood gedurende de reis bevoegd, levensmiddelen, welke in het bezit zijn van opvarenden
      of tot de lading behooren, tegen schadevergoeding tot zich te nemen, ten einde die te verbruiken in het belang van
      allen die zich aan boord bevinden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel358
  - number: 358a.1
    text: |-
      De kapitein is verplicht aan personen, die in gevaar verkeeren, en in het bijzonder, als zijn schip bij eene
      aanvaring betrokken is geweest, aan de andere daarbij betrokken schepen en de personen, die zich aan boord dier
      schepen bevinden, de hulp te verleenen, waartoe hij bij machte is, zonder zijn eigen schip en de opvarenden daarvan
      aan ernstig gevaar bloot te stellen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel358a
  - number: 358a.2
    text: |-
      Hij is bovendien verplicht, voor zooverre hem dit mogelijk is, aan de andere bij de aanvaring betrokken schepen
      op te geven den naam van zijn schip, van de haven waar het thuis behoort en van de havens van waar het komt en
      waarheen het bestemd is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel358a
  - number: 358a.3
    text: |-
      Niet-nakoming van deze verplichtingen door den kapitein geeft geen aanspraak tegen hem, die uit welken hoofde dan
      ook verantwoordelijk is voor het optreden van de kapitein.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel358a
  - number: 358b.1
    text: |-
      De kapitein van een Nederlandsch, naar Nederland bestemd schip, in eene buitenlandsche haven vertoevend, is
      verplicht, zich daar bevindende, hulpbehoevende Nederlandsche zeelieden, voorzoover aan boord voor hen plaats is,
      op verlangen van den Nederlandschen consulairen ambtenaar of, waar deze ontbreekt, van de plaatselijke overheid,
      naar Nederland over te brengen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel358b
  - number: 358b.2
    text: |-
      De kosten hiervan zijn voor rekening van den Staat. De vaststelling dier kosten geschiedt op den grondslag door Ons
      te bepalen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel358b
  - number: '359'
    text: |-
      De kapitein heeft de zorg voor alles wat met het beladen en het lossen van het schip in verband staat, voor
      zooverre niet andere personen daarmee zijn belast.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel359
  - number: '364.1'
    text: |-
      Tegenover de zee-werkgever is de kapitein steeds verplicht te handelen overeenkomstig de bepalingen, waaronder
      hij is aangesteld, en de hem krachtens die aanstelling gegeven orders, mits deze bepalingen of deze orders niet in
      strijd zijn met de verplichtingen, hem als gezagvoerder door de wet opgelegd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel364
  - number: '364.2'
    text: |-
      Hij geeft de zeewerkgever doorloopend kennis van alles wat het schip en de zaken aan boord betreft, en vraagt diens
      orders, alvorens tot eenigen maatregel van geldelijk aanbelang over te gaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel364
  - number: '364.3'
    text: |-
      Overigens is het bepaalde bij de [artikelen 359][ref1] ook op zijne verhouding tot de zeewerkgever van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel359
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel364
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '359'
  - number: '367'
    text: |-
      De kapitein, vernemende dat de vlag, waaronder hij vaart, onvrij is geworden, is verplicht in de meest in de
      nabijheid gelegen onzijdige haven binnen te loopen en aldaar te blijven liggen, totdat hij op veilige wijze kan
      vertrekken of van hem die daartoe bevoegd is stellige orders om te vertrekken heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel367
  - number: '368'
    text: |-
      Indien den kapitein blijkt, dat de haven, waarheen het schip is bestemd, wordt geblokkeerd, is hij verplicht in de
      meest geschikte in de nabijheid gelegen haven binnen te loopen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel368
  - number: '370'
    text: De kapitein mag van den koers, welken hij moet volgen, afwijken ter redding van menschenlevens.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel370
  - number: 371a
    text: |-
      Indien gedurende de reis iemand aan boord wordt ontdekt, die niet in het bezit is van een geldig reisbiljet en niet
      bereid of niet in staat is op eerste aanmaning van den kapitein vracht te betalen, heeft deze het recht hem aan
      boord werk te laten verrichten, waartoe hij in staat is, en hem bij de eerste gelegenheid die zich voordoet van
      boord te verwijderen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel371a
  - number: '372'
    text: |-
      Noch de kapitein, noch een opvarende mag voor eigen rekening goederen in het schip vervoeren, tenzij krachtens
      overeenkomst met of verlof van de eigenaar en, indien het schip is vervracht, ook van den bevrachter.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel372
  - number: '374.1'
    text: |-
      [Artikel 347][ref1], het [tweede lid van artikel 348][ref2] en [artikel 349, eerste lid][ref3], zijn niet van
      toepassing op zeevissersschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel347
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel348
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel349
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel374
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '347'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '348'
      - id: ref3
        bwb_id: BWBR0001838
        artikel: '349'
  - number: '374.2'
    text: |-
      Aan boord moeten aanwezig zijn een uittreksel uit de registratie voor schepen als bedoeld in
      [artikel 101, eerste lid, van de Kadasterwet][ref1] vermeldende tenminste de gegevens, bedoeld in
      [artikel 85, tweede lid, onder ][ref2], alsmede de gegevens omtrent niet doorgehaalde voorlopige aantekeningen,
      welk uittreksel op een zodanig tijdstip moet zijn afgegeven door de bewaarder van het kadaster en de openbare
      registers dat de daarin vermelde gegevens overeenstemmen met die welke in de registratie voor schepen ten aanzien
      van het betrokken schip staan vermeld ten tijde van het uitvaren van dat schip, en de wetten en reglementen op deze
      schepen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel374
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '101'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '85'
  - number: '375'
    text: |-
      Op de arbeidsovereenkomst tusschen de zeewerkgever en de kapitein zijn de bepalingen van het Burgerlijk Wetboek van
      toepassing, voor zoover daarvan in dit wetboek niet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel375
  - number: '376.1'
    text: |-
      De arbeidsovereenkomst tusschen de zeewerkgever en de kapitein moet, op straffe van nietigheid, schriftelijk worden
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel376
  - number: '376.2'
    text: Kosten der akte en andere bijkomende kosten zijn ten laste van de zeewerkgever.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel376
  - number: '377'
    text: |-
      Een door de zeewerkgever vastgesteld reglement betreffende den dienst aan boord is voor den kapitein verbindend,
      mits hem een exemplaar daarvan is verstrekt, en voor zooverre de inhoud niet in strijd is met de door hem aangegane
      arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel377
  - number: '378'
    text: |-
      Boete kan den kapitein slechts worden opgelegd krachtens beding in de arbeidsovereenkomst wegens overtreding van
      daarin te omschrijven bepalingen en tot het daarin vast te stellen maximum. De bestemming der boete moet in de
      overeenkomst worden aangegeven. De boete mag niet de zeewerkgever ten goede komen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel378
  - number: '379.1'
    text: |-
      Van het oogenblik waarop volgens de arbeidsovereenkomst de arbeidsovereenkomst zal aanvangen heeft de kapitein zich
      te houden ter beschikking van den zeewerkgever tot het voeren van het in de overeenkomst aangewezen schip, of, bij
      stilzwijgen van deze, van een door den zeewerkgever aan te wijzen schip, mits dit behoort tot de schepen welke de
      zeewerkgever voor de vaart ter zee gebruikt. Is omtrent den aanvang van de arbeidsovereenkomst niets bepaald, dan
      wordt die voor de toepassing van dit voorschrift geacht samen te vallen met het sluiten der overeenkomst.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel379
  - number: '379.2'
    text: |-
      De kapitein wordt geacht in dienst te zijn aan boord van een schip van den dag, waarop hij zijne taak aan boord op
      zich neemt, tot den dag waarop hij daarvan wordt ontheven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel379
  - number: '380'
    text: De kapitein heeft gedurende den tijd dat hij in dienst is aan boord van een schip, recht op voeding en logies.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel380
  - number: '381.1'
    text: De kapitein heeft aanspraak op vakantie overeenkomstig het bepaalde in artikel 414 van het Wetboek van Koophandel.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel381
  - number: '381.2'
    text: Het bepaalde in het vorige lid geldt niet voor de kapitein ter visserij.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel381
  - number: '382'
    text: |-
      Behalve in de gevallen, bedoeld in [artikel 678, lid 2, van Boek 7 van het Burgerlijk Wetboek][ref1], zullen voor
      de zeewerkgever dringende redenen onder andere aanwezig geacht kunnen worden:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel678
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel382
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '678'
  - number: 382.1°
    text: |-
      wanneer de kapitein een opvarende van het door hem gevoerde schip mishandelt, grovelijk beleedigt of op ernstige
      wijze bedreigt of verleidt of tracht te verleiden tot handelingen strijdig met de wetten of de goede zeden;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel382
  - number: 382.2°
    text: |-
      wanneer de kapitein weigert te voldoen aan eene opdracht hem gegeven overeenkomstig het bepaalde in
      [artikel 379][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel379
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel382
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '379'
  - number: 382.3°
    text: |-
      wanneer den kapitein, hetzij tijdelijk, hetzij voor goed, de bevoegdheid wordt ontnomen, als zoodanig op een schip
      dienst te doen;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel382
  - number: 382.4°
    text: wanneer de kapitein, buiten weten van de zeewerkgever, smokkelwaren aan boord heeft gebracht of daar toegelaten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel382
  - number: '383.1'
    text: |-
      Ieder der partijen is te allen tijde, ook vóórdat de arbeidsovereenkomst is aangevangen, bevoegd zich wegens
      gewichtige redenen te wenden tot de kantonrechter van de rechtbank van het arrondissement waarin de plaats
      van haar werkelijk verblijf gelegen is, of het schip zich bevindt, of in het Koninkrijk buiten Europa tot het
      bevoegde gezag, of buiten het Koninkrijk tot den het eerst te bereiken Nederlandschen diplomatieken of bezoldigden
      consulairen ambtenaar, met het verzoek de arbeidsovereenkomst ontbonden te verklaren. [Artikel 450][ref1], vindt
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel450d
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel383
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 450d
        paragraaf: '2'
  - number: '383.2'
    text: |-
      Als gewichtige redenen worden, behalve die genoemd in
      [artikel 685, lid 2, van Boek 7 van het Burgerlijk Wetboek][ref1], ook beschouwd omstandigheden, na den aanvang van
      den dienst aan boord aan den verzoeker gebleken of na dien opgekomen, waardoor de voortzetting van de reis, waarop
      het schip zich bevindt, den kapitein of de opvarenden aan onvoorzien, groot levensgevaar zou blootstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel685
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel383
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '685'
  - number: '383.3'
    text: |-
      Indien het betreft eene arbeidsovereenkomst tusschen zeewerkgever en kapitein ter zeevisscherij, kan ieder der
      partijen zich alleen wenden tot den in het eerste lid bedoelden kantonrechter.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel383
  - number: '384.1'
    text: |-
      Eindigt de arbeidsovereenkomst in het buitenland dan heeft de kapitein recht op vrij vervoer tot een haven in
      Nederland, tenzij hij wegens de wijze, waarop de arbeidsovereenkomst is beëindigd, schadeplichtig is geworden.
      Indien de arbeidsovereenkomst is ontbonden op verzoek van de kapitein, op grond van gewichtige redenen, heeft hij
      dit recht slechts, indien de zeewerkgever schadeplichtig is geworden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel384
  - number: '384.2'
    text: |-
      Onder het vrij vervoer zijn begrepen de kosten van onderhoud en nachtverblijf van het eindigen der
      arbeidsovereenkomst tot de aankomst van den kapitein in de plaats zijner bestemming.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel384
  - number: '385'
    text: |-
      De kapitein die de arbeidsovereenkomst doet eindigen, terwijl het door hem gevoerde schip zich op reis bevindt,
      is verplicht de maatregelen te nemen, welke in verband daarmede noodig zijn voor de veiligheid van het schip, de
      opvarenden en de zaken aan boord, op straffe van schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel385
  - number: '386'
    text: |-
      De bepalingen van de vorige artikelen laten onaangetast de bevoegdheid van de zeewerkgever, te allen tijde den
      kapitein het gezag over het schip te ontnemen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel386
  - number: '387.1'
    text: |-
      De boeten en de schadeloosstelling bedoeld in de [artikelen 378][ref1], [385][ref2] en [438][ref3] in verband met
      [artikel 390][ref4], zijn bevoorrecht op het in geld vastgestelde deel van het loon van den kapitein, hetwelk tot
      het bedrag daarvan kan worden ingehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel378
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel385
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel438
      [ref4]: https://wetten.overheid.nl/BWBR0001838#Artikel390
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel387
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '378'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '385'
      - id: ref3
        bwb_id: BWBR0001838
        artikel: '438'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0001838
        artikel: '390'
  - number: '387.2'
    text: |-
      Boete en schadeloosstelling komen in de eerste plaats ten laste van het deel van het loon, dat aan den kapitein
      persoonlijk moet worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel387
  - number: '387.3'
    text: |-
      Het laatste lid van [artikel 429][ref1] vindt toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel429
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel387
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '429'
        paragraaf: '2'
  - number: '388'
    text: |-
      Na afloop van eene reis is de kapitein verplicht de scheepspapieren aan de zeewerkgever af te geven tegen
      ontvangstbewijs.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel388
  - number: '389'
    text: |-
      De zeewerkgever verbeurt ten behoeve van den kapitein voor iederen dag, dat hij dezen, gedurende of bij het
      einde van zijn dienst aan boord van een schip, zonder wettige reden ophoudt in het verkrijgen van het in geld
      vastgestelde deel van zijn loon, € 1,36.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel389
  - number: '390.1'
    text: |-
      De [artikelen 399][ref1], [403][ref2], [408][ref3], [413][ref4], [415][ref5], [416][ref6], [425][ref7],
      [426][ref8], [428][ref9], [431-435][ref10], [437][ref11], [438][ref12], [440-442][ref13], [450a][ref14],
      [450aa][ref15] en [450c][ref16] zijn van overeenkomstige toepassing op de arbeidsovereenkomst van den kapitein.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel399
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel403
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel408
