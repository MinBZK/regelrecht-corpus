  - number: '176.2'
    text: |-
      Eveneens zijn op het orderbriefje toepasselijk de bepalingen betreffende den wisselbrief, betaalbaar bij eenen
      derde of in een andere plaats dan die van het domicilie van den betrokkene ([artikelen 103][ref1] en [126][ref2]),
      de renteclausule ([artikel 104][ref3]), de verschillen in de vermelding met betrekking tot de som, welke moet
      worden betaald ([artikel 105][ref4]), de gevolgen van het plaatsen eener handteekening onder de omstandigheden
      bedoeld in [artikel 106][ref5], die van de handteekening van eenen persoon, die handelt zonder bevoegdheid of die
      zijne bevoegdheid overschrijdt ([artikel 107][ref6]), en den wisselbrief in blanco ([artikel 109][ref7]).


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel126
