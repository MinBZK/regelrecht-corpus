  - number: 392a
    text: |-
      In deze titel wordt verstaan onder Nederlands schip: een schip dat Nederlands is op grond van [artikel 311][ref1]
      van dit boek, dan wel op grond van [artikel 5 van de Wet nationaliteit zeeschepen in rompbevrachting][ref2] (*Stb.*
      1992, 541).


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
      [ref2]: https://wetten.overheid.nl/BWBR0005681#Artikel5
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel392a
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
      - id: ref2
        bwb_id: BWBR0005681
        artikel: '5'
  - number: '393.1'
    text: Scheepsofficieren zijn de schepelingen, aan wie de monsterrol den rang van officier toekent.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel393
  - number: '393.2'
    text: Scheepsgezellen zijn alle overige schepelingen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel393
  - number: '394'
    text: |-
      Voor zoover de zeewerkgever de verhouding tusschen de scheepsofficieren onderling, tusschen de scheepsgezellen
      onderling en tusschen de scheepsofficieren en de scheepsgezellen niet heeft geregeld, beslist de kapitein
      daaromtrent.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel394
  - number: '396.1'
    text: |-
      Als schepelingen worden alleen aangemerkt personen, die eene arbeidsovereenkomst met de zeewerkgever hebben
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel396
  - number: '396.2'
    text: |-
      De kapitein vertegenwoordigt de zeewerkgever in de uitvoering van de arbeidsovereenkomsten met de schepelingen, die
      in dienst zijn aan boord van het door hem gevoerde schip.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel396
  - number: '397'
    text: |-
      Op de arbeidsovereenkomst tusschen de zeewerkgever en den schepeling zijn de bepalingen van het Burgerlijk Wetboek
      van toepassing, voor zoover daarvan in dit wetboek niet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel397
  - number: '398.1'
    text: |-
      De arbeidsovereenkomst tusschen de zeewerkgever en den schepeling moet, op straffe van nietigheid, schriftelijk
      worden aangegaan en door den laatste persoonlijk worden onderteekend.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel398
  - number: '398.2'
    text: Kosten der akte en andere bijkomstige kosten zijn ten laste van de zeewerkgever.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel398
  - number: '399'
    text: |-
      De arbeidsovereenkomst kan worden aangegaan hetzij voor een bepaalden tijd, hetzij voor één of meer reizen (*bij de
      reis*), hetzij voor onbepaalden tijd of tot wederopzegging.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel399
  - number: '400'
    text: 'De overeenkomst moet behelzen, behalve hetgeen elders in de wet is voorgeschreven:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel400
  - number: 400.1°
    text: den naam en de voornamen van den schepeling, den dag van zijne geboorte of zijn leeftijd, en zijne geboorteplaats;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel400
  - number: 400.2°
    text: de plaats en den dag van het sluiten van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel400
  - number: 400.3°
    text: de aanduiding van het schip of de schepen, waarop de schepeling zich verbindt dienst te doen;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel400
  - number: 400.4°
    text: de te ondernemen reis of reizen, indien deze reeds vaststaan;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel400
  - number: 400.5°
    text: de hoedanigheid, waarin de schepeling in dienst zal treden;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel400
  - number: 400.6°
    text: indien mogelijk, de plaats waar en den dag waarop de dienst aan boord zal aanvangen;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel400
  - number: 400.7°
    text: |-
      het bepaalde bij [artikel 414][ref1] nopens het recht op vrije dagen;


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel414
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel400
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '414'
        paragraaf: '2'
  - number: 400.8°
    text: 'de beëindiging van de arbeidsovereenkomst, namelijk:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel400
  - number: 400.8°.a
    text: |-
      indien de overeenkomst voor een bepaalden tijd wordt aangegaan, den dag waarop de arbeidsovereenkomst eindigt, met
      vermelding van den inhoud van [artikel 431][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel431
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel400
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '431'
        paragraaf: '2'
  - number: 400.8°.b
    text: |-
      indien de overeenkomst bij de reis wordt aangegaan, de haven overeengekomen voor de beëindiging der
      arbeidsovereenkomst, met vermelding van den inhoud van [artikel 432, tweede lid][ref1], alsmede, indien de haven
      eene Nederlandsche haven is, van het [eerste of van het tweede lid van artikel 433][ref2], naar gelang de haven al
      of niet met name is genoemd,


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel433
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel400
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '432'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '433'
        paragraaf: '2'
  - number: 400.8°.c
    text: |-
      indien de overeenkomst voor onbepaalden tijd wordt aangegaan, den inhoud van [artikel 434, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel434
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel400
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '434'
        paragraaf: '2'
  - number: '401.1'
    text: |-
      Voor zoover de namen, de plaats of dag van geboorte van den schepeling niet bekend zijn, wordt dit in de
      overeenkomst vermeld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel401
  - number: '401.2'
    text: |-
      De aanduiding in de overeenkomst van het schip of de schepen, waarop de schepeling zich verbindt dienst te doen,
      kan ook geschieden door te bepalen, dat hij dienst zal doen op een of meer door de zeewerkgever aan te wijzen
      schepen, behoorende tot die, welke de zeewerkgever voor de vaart ter zee gebruikt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel401
  - number: '401.3'
    text: |-
      Indien partijen van het bepaalde bij de [artikelen 414][ref1], [431][ref2], [432, tweede lid][ref3],
      [433, eerste of tweede lid][ref4], of [434, eerste lid][ref5], wenschen af te wijken, voor zoover wettelijk
      geoorloofd, wordt in plaats daarvan die afwijkende regeling in de overeenkomst opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel414
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel431
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel432
      [ref4]: https://wetten.overheid.nl/BWBR0001838#Artikel433
      [ref5]: https://wetten.overheid.nl/BWBR0001838#Artikel434
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel401
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '414'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '431'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001838
        artikel: '432'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0001838
        artikel: '433'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0001838
        artikel: '434'
        paragraaf: '2'
  - number: '402'
    text: |-
      Een door de zeewerkgever vastgesteld reglement betreffende den dienst aan boord is voor den schepeling verbindend,
      mits een in de Nederlandsche taal gesteld exemplaar daarvan in een mede voor hem bestemd dagverblijf der
      schepelingen is en blijft opgehangen en behoorlijk leesbaar is, en voor zooverre de inhoud niet in strijd is met de
      door hem aangegane arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel402
  - number: '403'
    text: |-
      Nietig is een beding waarbij de schepeling wordt beperkt in zijne vrijheid, na het einde der arbeidsovereenkomst
      arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel403
  - number: '404'
    text: |-
      Van het oogenblik waarop volgens de overeenkomst de arbeidsovereenkomst zal aanvangen is de schepeling verplicht
      zich te houden ter beschikking van de zeewerkgever om gemonsterd te worden op een door de overeenkomst aangeduid
      schip. Is omtrent den aanvang van de arbeidsovereenkomst niets bepaald, dan wordt die voor de toepassing van dit
      voorschrift geacht samen te vallen met het sluiten der overeenkomst.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel404
  - number: '405'
    text: |-
      De schepeling wordt geacht in dienst te zijn aan boord van een schip van den dag, in de monsterrol daarvoor
      aangewezen, of, bij gebreke daarvan, van den dag, waarop de monsterrol is opgemaakt, tot en met den dag waarop hij
      van zijne werkzaamheden aan boord wordt ontheven of hij deze neerlegt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel405
  - number: '406'
    text: 'Schepelingen-dienst mag niet worden verricht:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel406
  - number: 406.1°
    text: door hen, die niet met de zeewerkgever eene arbeidsovereenkomst hebben aangegaan,
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel406
  - number: 406.2°
    text: |-
      door hen, die, hoewel zij met de zeewerkgever eene arbeidsovereenkomst hebben aangegaan, niet in de monsterrol
      zijn genoemd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel406
  - number: '407.1'
    text: |-
      De zeewerkgever is verplicht te zorgen voor voeding en verblijven van de schepeling aan boord, alsmede voor een
      kombuis en andere ruimten voor de voeding, een en ander op zodanige wijze dat een behoorlijke voorziening verzekerd
      is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel407
  - number: '407.2'
    text: |-
      Voor een schip, waarvan de verblijven, de kombuis en andere ruimten voor de voeding voldoen aan de in het zesde
      lid bedoelde voorschriften, wordt door Onze Minister van Verkeer en Waterstaat een certificaat voor de verblijven
      uitgereikt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel407
  - number: '407.3'
    text: |-
      Wanneer de inrichting van de verblijven, van de kombuis en van de andere ruimten voor de voeding niet meer voldoet
      aan de in het zesde lid bedoelde voorschriften, wordt het certificaat door Onze Minister van Verkeer en Waterstaat
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel407
  - number: '407.5'
    text: |-
      De kapitein mag met zijn schip geen reis ondernemen, zonder dat voor het schip een geldig certificaat voor de
      verblijven bestaat.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel407
  - number: '407.6'
    text: |-
      Nadere voorschriften tot uitvoering van het bepaalde in de vorige leden worden bij algemene maatregel van bestuur
      gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel407
  - number: '407.7'
    text: |-
      In geen geval mag de zeewerkgever de voeding of de levering van de daarvoor benoodigde eet- en drinkwaren bij wijze
      van aanbesteding opdragen aan den kapitein of aan een schepeling.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel407
  - number: '408'
    text: |-
      De schepeling heeft voor iederen dag, dat hem de verschuldigde voeding niet of niet ten volle wordt verstrekt,
      recht op eene vergoeding, waarvan het bedrag bij de arbeidsovereenkomst of, bij stilzwijgen van deze, door het
      gebruik of de billijkheid wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel408
  - number: '409.1'
    text: |-
      Ten verzoeke van een derde van de schepelingen heeft buitenslands een onderzoek plaats naar de deugdelijkheid en
      voldoende hoeveelheid der eet- en drinkwaren. Het onderzoek wordt door den Nederlandschen consulairen ambtenaar of,
      bij gebreke van dezen, en in het Koninkrijk buiten Europa, door het bevoegde gezag ingesteld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel409
  - number: '409.2'
    text: |-
      De kapitein is verplicht de onbruikbare eet- en drinkwaren, op last dezer autoriteiten, tegen bruikbare te
      verwisselen en het noodige zich aan te schaffen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel409
  - number: '410.1'
    text: |-
      Door een gelijk deel van de schepelingen kan bij dezelfde autoriteiten buitenslands over onvoldoende ligging of
      ruimte, na de afreis ontstaan, worden geklaagd; een onderzoek wordt daarnaar ingesteld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel410
  - number: '410.2'
    text: De kapitein is op last der autoriteiten verplicht in het gebrekkige te voorzien.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel410
  - number: '410.3'
    text: |-
      De kapitein, die aan de hem, overeenkomstig dit en het vorig artikel, gegeven bevelen niet heeft voldaan, wordt
      geacht zich jegens de schepelingen te hebben misdragen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel410
  - number: '411.1'
    text: De schepeling mag geen sterken drank of wapens aan boord brengen of hebben zonder toestemming van den kapitein.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel411
  - number: '411.2'
    text: De kapitein kan hetgeen hij in strijd met deze bepaling aan boord aantreft, in beslag nemen en vernietigen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel411
  - number: '411.3'
    text: |-
      Dezelfde bevoegdheid heeft de kapitein ten aanzien van smokkelwaren, contrabande en opium of andere verdoovende
      middelen, welke de schepeling aan boord brengt of heeft.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel411
  - number: '412.1'
    text: |-
      Voor verbruik door de bemanning mag geen sterke drank aan boord zijn boven de hoeveelheid, door Ons bij algemeenen
      maatregel van bestuur te bepalen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel412
  - number: '412.2'
    text: |-
      Sterke drank, in strijd met deze bepaling aan boord aangetroffen door de ambtenaren van politie, aangesteld voor de
      uitvoering van de politietaak, of de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, wordt door hen
      in beslag genomen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel412
  - number: '413.1'
    text: |-
      De arbeidsovereenkomst moet, op straffe van nietigheid, het bedrag van het in geld uit te betalen loon bepalen
      of aangeven hoe het zal worden bepaald. De bepaling kan niet aan het goedvinden van een der partijen worden
      overgelaten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel413
  - number: '413.2'
    text: |-
      Bij de toepassing van het bepaalde in de [artikelen 415, tweede lid][ref1], [415a, eerste lid][ref2], [415g][ref3],
      [423, eerste lid][ref4], [425, derde lid][ref5], [433, derde lid][ref6], [438][ref7] en [440][ref8] wordt loon,
      vastgesteld bij de reis, geacht te zijn vastgesteld voor eene tijdruimte gelijk aan den gemiddelden duur van de
      reis.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel415a
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel415g
      [ref4]: https://wetten.overheid.nl/BWBR0001838#Artikel423
      [ref5]: https://wetten.overheid.nl/BWBR0001838#Artikel425
      [ref6]: https://wetten.overheid.nl/BWBR0001838#Artikel433
      [ref7]: https://wetten.overheid.nl/BWBR0001838#Artikel438
      [ref8]: https://wetten.overheid.nl/BWBR0001838#Artikel440
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel413
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '415'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 415a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001838
        artikel: 415g
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0001838
        artikel: '423'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0001838
        artikel: '425'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0001838
        artikel: '433'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0001838
        artikel: '438'
        paragraaf: '2'
      - id: ref8
        bwb_id: BWBR0001838
        artikel: '440'
        paragraaf: '2'
  - number: '414.1'
    text: |-
      De schepeling verwerft over ieder jaar waarin hij gedurende de volledige overeengekomen arbeidsduur recht op loon
      heeft gehad, aanspraak op vakantie van ten minste dertig dagen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel414
  - number: '414.2'
    text: |-
      De schepeling behoudt zijn aanspraak op vakantie over het tijdvak gedurende hetwelk hij studieverlof geniet en van
      zijn werkgever een studieuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel414
  - number: '414.3'
    text: 'Niet tot vakantie wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel414
  - number: 414.3.a
    text: officieel of algemeen erkende feestdagen;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel414
  - number: 414.3.b
    text: tijdelijk verlof om aan wal te gaan;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel414
  - number: 414.3.c
    text: compensatieverlof;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel414
  - number: 414.3.d
    text: de tijd van het vervoer, bedoeld in lid 7.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel414
  - number: '414.4'
    text: |-
      De werkgever van de schepeling is verplicht om vijftien kalenderdagen van de vakantie, bedoeld in lid 1,
      aaneengesloten te geven. Van deze verplichting kan worden afgeweken bij collectieve arbeidsovereenkomst of bij
      regeling door of namens een bevoegd publiekrechtelijk lichaam.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel414
  - number: '414.5'
    text: |-
      De vakantie moet zo worden verleend dat de schepeling telkens na verloop van twee jaren
      alle dagen heeft genoten waarop hij aanspraak heeft. De verjaringstermijn, bedoeld in
      [artikel 642 van Boek 7 van het Burgerlijk Wetboek][ref1], beloopt voor de schepeling drie jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel642
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '642'
  - number: '414.6'
    text: |-
      De vakantie, bedoeld in lid 1 en in [artikel 641, lid 3, van Boek 7 van het Burgerlijk Wetboek][ref1], wordt
      desverlangd aan de schepeling gegeven in de plaats alwaar hij is gemonsterd, of de plaats alwaar hij is
      aangeworven, al naar gelang die plaats het dichtst is gelegen bij de woonplaats van de schepeling. Van deze
      regeling kan worden afgeweken bij collectieve arbeidsovereenkomst of bij regeling door of namens een bevoegd
      publiekrechtelijk lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel641
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '641'
  - number: '414.7'
    text: |-
      Indien de schepeling genoodzaakt is de vakantie, bedoeld in lid 1 en in
      [artikel 641, lid 3, van Boek 7 van het Burgerlijk Wetboek][ref1] aan te vangen op een andere plaats dan die
      bedoeld in lid 6, is de werkgever gehouden zorg te dragen voor kosteloos vervoer naar die andere plaats alsmede
      voor de betaling van de kosten van levensonderhoud gedurende dat vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel641
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '641'
  - number: '414.8'
    text: |-
      Een schepeling die zijn vakantie, bedoeld in lid 1 en in
      [artikel 641, lid 3, van Boek 7 van het Burgerlijk Wetboek][ref1] geniet, wordt slechts in gevallen van uiterste
      noodzaak teruggeroepen en wel na tijdige kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel641
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '641'
  - number: '414.9'
    text: |-
      De aanspraak op vakantie zonder behoud van loon, bedoeld in
      [artikel 641, lid 3, van Boek 7 van het Burgerlijk Wetboek][ref1], wordt verminderd met de tijd gedurende welke de
      schepeling, nadat hij de aanspraak heeft verworven, nog niet in dienst was getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel641
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '641'
  - number: '415.1'
    text: De schepeling, die ziek wordt, blijft in het genot van het volle loon zolang hij aan boord is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415
  - number: '415.2'
    text: |-
      Na zijn herstel heeft de schepeling, ongeacht het voortduren van de arbeidsovereenkomst, recht op een uitkering,
      gelijk aan het naar tijdruimte in geld vastgestelde loon, dat hij genoot toen hij ziek werd, indien hij ter
      verpleging is achtergelaten buiten het land waar hij thuisbehoort en elders dan ter plaatse waar hij zich bevond
      toen zijn rechtsverhouding met de zeewerkgever aanving. Hij heeft voorts aanspraak op huisvesting en voeding en
      recht op vrij vervoer tot een haven in het land waar hij thuisbehoort of tot de plaats waar hij zich bevond toen
      zijn rechtsverhouding met de zeewerkgever aanving, zulks ter keuze van de zeewerkgever. Onder vrij vervoer zijn
      begrepen de kosten van onderhoud en nachtverblijf gedurende de reis. De geldelijke uitkering na zijn herstel en het
      recht op huisvesting en voeding, waarop hij ingevolge dit lid aanspraak kan maken, nemen in ieder geval een einde
      zodra hij passende arbeid kan verkrijgen en verrichten dan wel is teruggekeerd in of had kunnen terugkeren naar
      een haven in het land waar hij thuisbehoort of de plaats waar hij zich bevond toen zijn rechtsverhouding met de
      zeewerkgever aanving.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415
  - number: '415.3'
    text: |-
      Indien de ziekte een gevolg is van opzet, wordt de geldelijke uitkering verbeurd of verminderd, ter beoordeling van
      de kantonrechter van de rechtbank van het arrondissement waarin de zetel van het scheepsbedrijf is gevestigd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415
  - number: '415.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld ter voorkoming of beperking van
      samenloop van loon als bedoeld in het eerste lid met uitkering of inkomensvoorziening ingevolge de
      [Wet werk en inkomen naar arbeidsvermogen][ref1], de [Wet op de arbeidsongeschiktheidsverzekering][ref2],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3], de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref4], dan wel met uitkering of
      inkomensvoorziening ingevolge zowel de [Wet werk en inkomen naar arbeidsvermogen][ref5], de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6], de [Wet op de arbeidsongeschiktheidsverzekering][ref7]
      als de Wet werk en arbeidsondersteuning jonggehandicapten.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0019057
      [ref6]: https://wetten.overheid.nl/BWBR0008656
      [ref7]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
      - id: ref5
        bwb_id: BWBR0019057
      - id: ref6
        bwb_id: BWBR0008656
      - id: ref7
        bwb_id: BWBR0002524
  - number: '415.5'
    text: |-
      De schepeling, die ziek wordt, heeft tot zijn herstel recht op behoorlijke verpleging en geneeskundige
      behandeling. Dit recht komt evenwel niet toe aan de schepeling, die verzekeringsplichtige is op grond van de
      [Zorgverzekeringswet][ref1], zolang hij verblijft in Nederland en evenmin aan de schepeling, die verblijft in het
      land waar hij thuisbehoort. Het recht eindigt, indien de schepeling is teruggekeerd in of heeft kunnen terugkeren
      naar het land waar hij thuisbehoort. Op de aanspraken, welke de schepeling heeft ingevolge het bepaalde in dit lid,
      komen de aanspraken ingevolge de [Algemene Wet Bijzondere Ziektekosten][ref2] in mindering.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0002614
  - number: 415a.1
    text: |-
      De schepeling, die op het tijdstip, waarop hij ziek wordt, niet is verzekerd ingevolge de [Ziektewet][ref1]
      en op wie niet enige daarmee overeenkomende wettelijke regeling van een lidstaat van de Europese Unie van
      toepassing is, heeft, zolang hij niet hersteld is, gedurende ten hoogste 52 weken, ongeacht het voortduren van de
      arbeidsovereenkomst, recht op 80% van het naar tijdruimte in geld vastgestelde loon, dat hij genoot toen hij ziek
      werd, verhoogd met de bij algemene maatregel van bestuur vast te stellen geldswaarde van andere loonbestanddelen.
      Deze termijn van 52 weken gaat in: 1°. als de schepeling ziek wordt, terwijl hij niet aan boord van een schip in
      dienst is, op de dag, waarop hij ziek wordt; 2°. als hij ziek wordt, terwijl hij aan boord van een schip in dienst
      is, op de dag, waarop hij aan de wal ter verpleging wordt achtergelaten of waarop hij, nog niet hersteld, met
      het schip terugkomt. Wordt hij ter verpleging achtergelaten buiten het land waar hij thuisbehoort, dan wordt de
      uitkering van 80% gedurende de eerste twaalf weken verhoogd tot 100%.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415a
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 415a.2
    text: |-
      De geldelijke uitkering, waarop de schepeling recht heeft ingevolge het bepaalde in de laatste volzin van het
      vorige lid neemt in ieder geval een einde zodra hij passende arbeid kan verkrijgen en verrichten dan wel is
      teruggekeerd in of had kunnen terugkeren naar een haven in het land waar hij thuisbehoort.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415a
  - number: 415a.3
    text: |-
      [Artikel 415, derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415a
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '415'
        paragraaf: '2'
  - number: 415b.1
    text: |-
      De schepeling, die op het tijdstip, waarop hem een ongeval in verband met zijn arbeidsovereenkomst overkomt, niet
      is verzekerd ingevolge de [Ziektewet][ref1] en op wie niet enige daarmee overeenkomende wettelijke regeling van een
      lidstaat van de Europese Unie van toepassing is, heeft, ongeacht het voortduren van de arbeidsovereenkomst, of zijn
      nagelaten betrekkingen hebben, indien hij ten gevolge van een zodanig ongeval overlijdt, recht op uitkeringen en
      voorzieningen overeenkomstig het bepaalde in de [artikelen 415][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel415c
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415b
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 415c
        paragraaf: '2'
  - number: 415b.2
    text: |-
      Voor de toepassing van het bepaalde in het vorige lid en in de [artikelen 415][ref1] worden met een ongeval,
      in verband met de arbeidsovereenkomst overkomen, gelijkgesteld de ziekten, voorkomende op een bij algemene
      maatregel van bestuur vast te stellen lijst van ziekten, indien de schepeling die ziekte heeft gekregen in
      verband met de arbeidsovereenkomst. De ziekte wordt, tenzij het tegendeel blijkt, geacht verband te houden met
      de arbeidsovereenkomst, indien zij zich gedurende de arbeidsovereenkomst of binnen een bij algemene maatregel van
      bestuur vast te stellen termijn na het beëindigen van de arbeidsovereenkomst openbaart.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415c
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415b
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 415c
        paragraaf: '2'
  - number: 415b.3
    text: |-
      De in het vorige lid bedoelde gelijkstelling is niet van toepassing indien de schepeling zonder deugdelijke grond
      ter zake van de in dat lid bedoelde ziekte geweigerd heeft een profylactische behandeling te ondergaan dan wel
      heeft nagelaten zich aan een zodanige behandeling te onderwerpen, ofschoon hem daartoe kosteloos gelegenheid werd
      geboden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415b
  - number: 415c.1
    text: |-
      De schepeling, bedoeld in [artikel 415b][ref1], heeft na afloop van de termijn van 52 weken, bedoeld in
      [artikel 415a, eerste lid][ref2], in geval van tijdelijke gehele ongeschiktheid tot werken, recht op een uitkering
      van 70% van zijn loon en, in geval van tijdelijke gedeeltelijke ongeschiktheid tot werken, op een uitkering ter
      hoogte van een in verhouding tot de verloren geschiktheid tot werken staand deel van 70% van zijn loon.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415b
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel415a
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415c
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 415b
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 415a
        paragraaf: '2'
  - number: 415c.2
    text: |-
      De in het vorige lid bedoelde uitkering eindigt met ingang van de dag, waarop blijvende gehele of gedeeltelijke
      ongeschiktheid tot werken intreedt, dan wel, indien de tijdelijke gehele of gedeeltelijke ongeschiktheid tot werken
      voortduurt, uiterlijk met ingang van de dag, gelegen drie jaren na afloop van de termijn van 52 weken, bedoeld in
      [artikel 415a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415a
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415c
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 415a
        paragraaf: '2'
  - number: 415c.3
    text: |-
      De schepeling, bedoeld in [artikel 415b][ref1], die op de dag, gelegen na afloop van de termijn van 52 weken,
      bedoeld in [artikel 415a, eerste lid][ref2], blijvend geheel of gedeeltelijk ongeschikt is tot werken of binnen
      drie jaren na die dag blijvend geheel of gedeeltelijk ongeschikt wordt tot werken, dan wel op de dag, gelegen
      drie jaren na vorenbedoelde dag, nog tijdelijk geheel of gedeeltelijk ongeschikt is tot werken, heeft recht op
      een uitkering ineens van driemaal de uitkering over een jaar, berekend naar de uitkering, waarop hij laatstelijk
      aanspraak had vóór de dag, waarop dat recht ontstaat. Met ingang van de dag, waarop recht ontstaat op een uitkering
      ineens als bedoeld in de vorige volzin, kunnen ter zake van het betreffende ongeval overigens geen rechten meer
      worden ontleend aan de [artikelen 415b - 415h][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415b
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel415a
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel415b
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415c
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 415b
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 415a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001838
        artikel: 415b
        paragraaf: '2'
  - number: 415c.4
    text: |-
      Voor de toepassing van het bepaalde in de vorige leden wordt een schepeling geheel of gedeeltelijk ongeschikt
      geacht tot werken, indien hij ten gevolge van een ongeval als bedoeld in [artikel 415b][ref1] geheel of
      gedeeltelijk ongeschikt is geworden tot arbeid, die voor zijn krachten en bekwaamheden is berekend en die met het
      oog op zijn opleiding en vroeger beroep hem in billijkheid kan worden opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415b
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415c
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 415b
        paragraaf: '2'
  - number: 415c.5
    text: |-
      Indien de schepeling, bedoeld in [artikel 415b][ref1], niet de medewerking verleent, die redelijkerwijs van hem
      verlangd kan worden tot het herkrijgen van zijn gezondheid of zijn arbeidsvermogen, voor zover deze door een
      ongeval als bedoeld in dat artikel zijn geschaad, zal bij de schatting van de mate van ongeschiktheid tot werken,
      bedoeld in de vorige leden, de toestand in aanmerking genomen kunnen worden, die waarschijnlijk zou zijn ontstaan,
      indien die medewerking ten volle zou zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415b
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415c
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 415b
        paragraaf: '2'
  - number: 415d.1
    text: |-
      De schepeling, bedoeld in [artikel 415b][ref1], heeft ter zake van een ongeval als bedoeld in dat artikel van
      de dag van het ongeval af recht op geneeskundige behandeling of vergoeding daarvoor, indien hij verblijft in of
      heeft kunnen terugkeren naar het land, waar hij thuisbehoort, doch uiterlijk tot de dag, gelegen drie jaren na
      afloop van de termijn van 52 weken, bedoeld in [artikel 415a, eerste lid][ref2] en onverminderd het bepaalde in
      de [laatste volzin van het derde lid van artikel 415c][ref3]. Onder geneeskundige behandeling is begrepen het
      verstrekken van kunstmiddelen, voor zover deze zijn geschiktheid tot werken kunnen bevorderen of tot verbetering
      van zijn levensomstandigheden kunnen bijdragen, alsmede het onderricht in het gebruik van die kunstmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415b
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel415a
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel415c
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415d
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 415b
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 415a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001838
        artikel: 415c
        paragraaf: '2'
  - number: 415d.2
    text: Bij algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot het bepaalde in dit artikel.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415d
  - number: 415e.1
    text: |-
      Onverminderd het bepaalde in [artikel 674 van Boek 7 van het Burgerlijk Wetboek][ref1] hebben de nagelaten
      betrekkingen, bedoeld in [artikel 415][ref2], recht op een uitkering ineens, welke bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel674
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel415b
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '674'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 415b
        paragraaf: '2'
  - number: 415e.1.1°
    text: |-
      voor de vrouw, met wie de overledene ten tijde van het ongeval gehuwd was of een geregistreerd partnerschap was
      aangegaan: driemaal de uitkering over een jaar, berekend naar 30% van het loon van de overledene;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415e
  - number: 415e.1.2°
    text: |-
      voor de man, met wie de overledene ten tijde van het ongeval gehuwd was of een geregistreerd partnerschap was
      aangegaan, indien deze zijn kostwinster was: driemaal de uitkering over een jaar, berekend naar 30% van het loon
      van de overledene;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415e
  - number: 415e.1.3°
    text: |-
      voor elk kind beneden de leeftijd van zestien jaar dat tot de overleden vader of moeder in familierechtelijke
      betrekking stond: driemaal de uitkering over een jaar, berekend naar 15% en, indien dit kind ouderloos is, berekend
      naar 20% van het loon van de overledene;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415e
  - number: 415e.1.4°
    text: |-
      voor elk stiefkind beneden de leeftijd van zestien jaar van de overledene: driemaal de uitkering over een jaar,
      berekend naar 15% en, indien dit kind ouderloos is, berekend naar 20% van het loon van de overledene;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415e
  - number: 415e.1.5°
    text: |-
      voor degene, voor wie de overledene ten tijde van het ongeval kostwinner was, niet vallende onder 1°, 2°, 3° of
      4°: driemaal hetgeen hij in de regel over een jaar tot diens levensonderhoud bijdroeg, doch niet meer dan driemaal
      de uitkering over een jaar, berekend naar 30% van het loon van de overledene, met dien verstande, dat, indien
      de betrokkene jonger is dan zestien jaar, niet meer wordt uitgekeerd dan hij als kind dat in familierechtelijke
      betrekking tot de overledene stond zou hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415e
  - number: 415e.2
    text: |-
      De in het vorige lid bedoelde uitkeringen zullen tezamen niet meer bedragen dan driemaal de uitkering over een
      jaar, berekend naar 60% van het loon van de overledene. De personen, bedoeld in het vorige lid, onder 5°, hebben
      alleen recht op een uitkering, indien de personen, bedoeld onder 1°, 2°, 3° en 4°, van dat lid allen hun volle
      uitkering hebben ontvangen. Indien de personen, bedoeld in het vorige lid, onder 1°, 2°, 3° en 4°, tezamen een
      uitkering zouden ontvangen van meer dan driemaal de uitkering over een jaar, berekend naar 60% van het loon van de
      overledene, ondergaat elk van deze uitkeringen een evenredige vermindering.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415e
  - number: 415e.3
    text: |-
      Voor de toepassing van dit artikel en van artikel 415*b* is het bepaalde bij of krachtens
      [artikel 8 van de Algemene nabestaandenwet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel8
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415e
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '8'
  - number: 415f
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld ter voorkoming of beperking van samenloop van
      uitkeringen of voorzieningen, bedoeld in de [artikelen 415][ref1] , met uitkeringen of voorzieningen uit anderen
      hoofde.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415a
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415f
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 415a
        paragraaf: '2'
  - number: 415g
    text: |-
      Onder loon van de schepeling wordt voor de toepassing van de [artikelen 415][ref1] en [415][ref2] verstaan het
      naar tijdruimte in geld vastgestelde loon, dat hij genoot toen het ongeval als bedoeld in [artikel 415][ref3]
      plaatsvond, verhoogd met de bij algemene maatregel van bestuur vast te stellen geldswaarde van andere
      loonbestanddelen. Hetgeen het naar tijdruimte in geld vastgestelde loon meer bedraagt dan een bij algemene
      maatregel van bestuur te bepalen bedrag, wordt daarbij niet in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415c
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel415e
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel415b
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415g
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 415c
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 415e
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001838
        artikel: 415b
        paragraaf: '2'
  - number: 415h.1
    text: |-
      Indien een daartoe door Ons erkende vereniging met volledige rechtsbevoegdheid is opgericht, is de zeewerkgever,
      die een of meer schepelingen in dienst heeft, die, niet zijn verzekerd ingevolge de [Ziektewet][ref1] en op wie
      niet enige daarmee overeenkomende wettelijke regeling van een lidstaat van de Europese Unie van toepassing is,
      ter waarborging van zijn tegenover die schepelingen en hun nagelaten betrekkingen uit de [artikelen 415][ref2]
      voortvloeiende verplichtingen van rechtswege aangesloten bij die vereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel415a
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415h
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 415a
        paragraaf: '2'
  - number: 415h.2
    text: |-
      In het geval, bedoeld in het vorige lid, zijn de zeewerkgever en de vereniging hoofdelijk verbonden tegenover die
      schepelingen en hun nagelaten betrekkingen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415h
  - number: 415h.3
    text: |-
      Op haar verzoek kan een vereniging worden erkend als vereniging, bedoeld in het eerste lid, indien zij voldoet aan
      de volgende vereisten:
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415h
  - number: 415h.3.1°
    text: |-
      dat zij opgericht is door een of meer naar Ons oordeel representatieve organisaties van zeewerkgevers en een
      of meer naar Ons oordeel representatieve organisaties van schepelingen, al dan niet tezamen met een of meer
      zeewerkgevers;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415h
  - number: 415h.3.2°
    text: dat zij niet beoogt winst te maken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415h
  - number: 415h.4
    text: Voor de in het vorige lid bedoelde erkenning komt niet meer dan één vereniging in aanmerking.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415h
  - number: 415h.5
    text: 'De statuten van de in het eerste lid bedoelde vereniging moeten zodanige bepalingen inhouden, dat:'
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415h
  - number: 415h.5.1°
    text: |-
      het bestuur voor de helft wordt samengesteld uit vertegenwoordigers van de zeewerkgevers en voor de helft uit
      vertegenwoordigers van de schepelingen;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415h
  - number: 415h.5.2°
    text: |-
      de gezamenlijke vertegenwoordigers van de zeewerkgevers ter vergadering evenveel stemmen uitbrengen als de
      gezamenlijke vertegenwoordigers van de schepelingen;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415h
  - number: 415h.5.3°
    text: |-
      de kosten van de uit de [artikelen 415][ref1] voortvloeiende verplichtingen met betrekking tot de in het
      eerste lid bedoelde schepelingen en hun nagelaten betrekkingen, alsmede de kosten verbonden aan de vorming en
      instandhouding van een reserve, per jaar worden omgeslagen over de zeewerkgevers naar rato van het loon, dat
      door hen in dat jaar aan die schepelingen is uitbetaald, waarbij onder loon wordt verstaan loon in de zin van
      [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415a
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415h
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 415a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017745
        hoofdstuk: '3'
  - number: 415i.1
    text: |-
      [ Artikel 93, aanhef en onder c, van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van toepassing op alle
      vorderingen krachtens de [artikelen 415a - 415h][ref2] door of tegen de in het eerste lid van [artikel 415h][ref3]
      bedoelde schepelingen of hun nagelaten betrekkingen ingesteld tegen onderscheidenlijk door de in dat lid bedoelde
      vereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel415a
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel415h
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415i
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '93'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 415a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001838
        artikel: 415h
        paragraaf: '2'
  - number: 415i.2
    text: |-
      Elk beding strijdig met enige bepaling van dit of het vorige artikel is nietig, behoudens dat partijen kunnen
      overeenkomen om een geschil omtrent een vordering als bedoeld in het vorige lid aan de uitspraak van scheidslieden
      te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel415i
  - number: '416.1'
    text: |-
      Indien de schepeling, in dienst van de zeewerkgever, overlijdt buiten het land waar hij thuis behoort, komen voor
      rekening van de zeewerkgever:
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel416
  - number: 416.1.1°
    text: indien de lijkbezorging plaats vindt buiten het land waar hij thuis behoort, de daartoe gemaakte kosten;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel416
  - number: 416.1.2°
    text: |-
      indien de lijkbezorging plaats vindt in het land waar hij thuis behoort, de gemaakte kosten van en in verband
      met het vervoer van het stoffelijk overschot naar de woonplaats in dat land, alsmede de gemaakte kosten van en
      in verband met de daartoe noodzakelijke opgraving van het stoffelijk overschot, zulks met inachtneming van bij
      algemene maatregel van bestuur te bepalen maximum bedragen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel416
  - number: '416.2'
    text: |-
      De in het vorige lid onder 2° bedoelde kosten komen niet voor rekening van de zeewerkgever, indien het vervoer van
      het stoffelijk overschot niet binnen redelijke korte tijd na het overlijden plaats vindt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel416
  - number: '417.1'
    text: |-
      Gedurende den tijd, dat de schepeling in dienst is aan boord van een schip, is hij verplicht de bevelen van den
      kapitein met stiptheid op te volgen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel417
  - number: '417.2'
    text: |-
      Indien hij meent, dat deze bevelen onrechtmatig zijn, kan hij in de eerste haven, die het schip aandoet, de
      tusschenkomst inroepen van de inspecteur-generaal van de Inspectie Verkeer en Waterstaat of in het Koninkrijk
      buiten Europa van het bevoegde gezag of buiten het Koninkrijk, indien dit redelijkerwijze zonder oponthoud van het
      schip kan geschieden, van den Nederlandschen diplomatieken of bezoldigden consulairen ambtenaar, die het eerst te
      bereiken is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel417
  - number: '418'
    text: |-
      De kapitein is verplicht den arbeid van den schepeling te regelen in overeenstemming met de daaromtrent bij de wet
      en, binnen de grenzen der wet, bij de arbeidsovereenkomst gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel418
  - number: '419.1'
    text: |-
      De schepeling is verplicht het hem door den kapitein opgedragen werk te verrichten, doch heeft recht op een bijslag
      op het loon voor den tijd, gedurende welken hij langer dan den door de wet of de arbeidsovereenkomst bepaalden
      normalen arbeidsduur werk verricht, tenzij de kapitein het werk noodzakelijk acht tot behoud van het schip, de
      opvarenden of de zaken aan boord. Het bedrag van dien bijslag wordt bepaald door de arbeidsovereenkomst of, bij
      haar stilzwijgen, door het gebruik of de billijkheid.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel419
  - number: '419.2'
    text: |-
      De kapitein doet van ieder geval van overwerk aanteekening houden in een daartoe bestemd register. Elke
      aanteekening wordt door den daarbij betrokken schepeling mede-onderteekend.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel419
  - number: '419.3'
    text: |-
      Het recht, betaling van den bijslag te vorderen, vervalt door verloop van één maand na het eindigen van den
      dienst aan boord in eene Nederlandsche haven en van zes maanden na het eindigen van den dienst aan boord in het
      buitenland.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel419
  - number: '419.4'
    text: |-
      Op den scheepsofficier, tevens hoofd van dienst, den geneeskundige en den marconist zijn de bepalingen van dit
      artikel niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel419
  - number: '420'
    text: |-
      Indien aan den schepeling andere werkzaamheden worden opgedragen dan hij heeft te verrichten overeenkomstig de
      hoedanigheid, waarin hij volgens de arbeidsovereenkomst aan boord dienst doet, en deze werkzaamheden volgens
      overeenkomst of gebruik hooger worden beloond, heeft hij aanspraak op daarmede overeenkomend hooger loon.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel420
  - number: '421.1'
    text: Zonder toestemming van den kapitein mag de schepeling het schip niet verlaten.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel421
  - number: '421.2'
    text: |-
      Weigert de kapitein toestemming, dan is hij verplicht de reden voor zijne weigering in het dagboek te vermelden en
      aan den schepeling, op diens verlangen, deze weigering binnen twaalf uur schriftelijk te bevestigen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel421
  - number: '422'
    text: |-
      De kapitein heeft disciplinair gezag over den schepeling. Hij kan tot handhaving van dit gezag de redelijkerwijze
      noodige maatregelen nemen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel422
  - number: '423.1'
    text: |-
      De kapitein kan den schepeling in geval van verwijdering van boord zonder zijne toestemming, van niet tijdig
      terugkeeren aan boord, van dienstweigering, van gebrekkige dienstvervulling, van onbehoorlijk optreden tegen een
      lid der bemanning of een der andere opvarenden en van ordeverstoring, eene boete opleggen ten bedrage van het naar
      tijdruimte in geld vastgestelde loon over ten hoogste tien dagen; echter mag de boete nooit meer bedragen dan een
      derde van dat loon voor den geheelen duur der reis. In een tijdsverloop van tien dagen mag geen hooger bedrag aan
      gezamenlijke boeten worden opgelegd dan de genoemde hoogste bedragen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel423
  - number: '423.2'
    text: De oplegging der boete kan voorwaardelijk geschieden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel423
  - number: '423.3'
    text: |-
      Indien de kapitein wegens eenig feit de arbeidsovereenkomst doet eindigen, overeenkomstig het bepaalde in
      [artikel 677, lid 1, van Boek 7 van het Burgerlijk Wetboek][ref1], kan hij te dier zake niet tevens disciplinaire
      straf opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel423
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
  - number: '423.4'
    text: |-
      De bestemming der boeten moet in de arbeidsovereenkomst worden aangegeven. De boete mag noch de zeewerkgever noch
      de kapitein ten goede komen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel423
  - number: '424.1'
    text: |-
      Alvorens boete op te leggen is de kapitein verplicht den betrokkene en de getuigen te hooren in het bijzijn, zoo
      mogelijk, van ten minste twee schepelingen van gelijken of hoogeren rang, overeenkomstig de monsterrol daartoe
      aangewezen. Het proces-verbaal van dit verhoor moet door allen, die daarbij tegenwoordig zijn geweest, worden
      onderteekend. Van weigering om te onderteekenen wordt daarin melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel424
  - number: '424.2'
    text: |-
      Boete kan niet vroeger worden opgelegd dan twaalf uren en niet later dan eene week, nadat het feit heeft plaats
      gehad, tenzij bijzondere omstandigheden afwijking noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel424
  - number: '424.3'
    text: |-
      Elke boete moet onverwijld worden ingeschreven in een daartoe bestemd register, met vermelding van het feit, dat
      tot de oplegging aanleiding heeft gegeven en van den dag waarop het heeft plaats gehad, alsmede van den dag waarop
      de boete is opgelegd. Iedere inschrijving moet worden onderteekend door den kapitein en de in het eerste lid
      genoemde schepelingen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel424
  - number: '424.4'
    text: Eene boete, niet ingeschreven in het register, wordt geacht ten onrechte te zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel424
  - number: '424.5'
    text: |-
      De schepeling kan van de oplegging van boete in beroep komen bij de rechtbank van het arrondissement waarin
      de zetel van het scheepsbedrijf is gelegen. Het beroep wordt behandeld en beslist door de kantonrechter. Het
      [derde lid van artikel 419][ref1] vindt overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel419
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel424
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '419'
        paragraaf: '2'
  - number: '425.1'
    text: |-
      Gedurende den tijd, dat de schepeling in dienst van de zeewerkgever aan boord van een schip of in het buitenland
      verblijft, heeft zijne niet van tafel en bed gescheiden echtgenoote recht op uitbetaling, op den voet als in de
      volgende leden bepaald, van ten hoogste het twee derde gedeelte van het in geld vastgestelde loon, tot onderhoud
      van haar en hare kinderen, die niet in staat zijn in hun onderhoud te voorzien.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel425
  - number: '425.2'
    text: |-
      De uitbetaling door de zeewerkgever geschiedt aan de echtgenoote tegen overlegging van eene met het oog op de
      laatste monstering afgegeven verklaring van haren man of beschikking van de kantonrechter van de rechtbank van het
      arrondissement waarin haar woonplaats is gelegen en wel voor het gedeelte van het aan den schepeling verschuldigde
      loon, in die verklaring of die beschikking genoemd. Wanneer eene onmiddellijke voorziening wordt vereischt, zal de
      kantonrechter aanstonds bepalen het gedeelte van het loon van den schepeling, op welks uitbetaling de echtgenoote
      voorloopig recht heeft tot onderhoud van haar en de kinderen in het eerste lid bedoeld. Deze beschikking behoudt
      tegenover de zeewerkgever hare kracht gedurende eene maand na den dag harer dagteekening, voor zooveel hem niet
      voor den afloop van dien termijn de eindbeschikking van den kantonrechter is overgelegd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel425
  - number: '425.3'
    text: |-
      Het gedeelte van het loon, op welks uitbetaling de echtgenoote recht heeft, wordt haar uitgekeerd op de tijdstippen
      voor de uitbetaling bepaald door de arbeidsovereenkomst of, bij stilzwijgen van deze, door het gebruik of de
      billijkheid, met dien verstande, dat, indien het loon naar tijdruimte is vastgesteld, de hierbedoelde uitbetaling
      uiterlijk telkens na eene maand geschiedt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel425
  - number: '426.1'
    text: |-
      De uitbetaling van het in geld vastgestelde deel van het in dienst aan boord van een schip verdiende loon moet
      geschieden in de munt, waarin het bij de arbeidsovereenkomst is uitgedrukt, of in de munt, gangbaar ter plaatse van
      de uitbetaling. De koers waartegen in het laatste geval de herleiding geschiedt, moet den schepeling schriftelijk
      worden medegedeeld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel426
  - number: '426.2'
    text: |-
      Onverminderd het bepaalde in [artikel 445][ref1], kan de schepeling, indien hij meent, dat de hem medegedeelde
      koers niet juist is, zich na afloop van de reis deswege wenden tot de voorzitter van de Kamer van Koophandel en
      Fabrieken te Rotterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel445
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel426
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '445'
        paragraaf: '2'
  - number: '427.1'
    text: |-
      Behoudens het bepaalde in [artikel 425][ref1] heeft de schepeling recht op uitbetaling van het in dienst aan
      boord van een schip verdiend loon: 1°. indien het naar tijdruimte is vastgesteld, in iedere haven, welke het schip
      gedurende de reis aandoet, mits zeven dagen zijn verloopen sedert de laatste uitbetaling, 2°. indien het niet naar
      tijdruimte is vastgesteld, op de tijdstippen voor de uitbetaling bepaald door de arbeidsovereenkomst of, bij haar
      stilzwijgen, door het gebruik of de billijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel425
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel427
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '425'
        paragraaf: '2'
  - number: '427.2'
    text: |-
      Zoolang de reis niet is geëindigd, is de zeewerkgever niet verplicht in het geheel meer dan 5/6 deel van het loon
      uit te betalen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel427
  - number: '427.3'
    text: |-
      De uitbetaling van het in het eerste lid onder 1°. bedoelde loon geschiedt uiterlijk op den dag volgende op dien
      van de aankomst, de in [artikel 354][ref1] bedoelde dagen niet medegerekend, doch in ieder geval voor het vertrek
      uit de haven.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel354
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel427
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '354'
  - number: '428'
    text: |-
      De schepeling kan zijn recht op het in geld vastgestelde deel van zijn in dienst aan boord van een schip verdiend
      loon, voor zoover dit te zijner beschikking is, alleen afstaan, in pand geven daaronder begrepen, ten behoeve van
      zijne echtgenoote voor ten hoogste één derde, van zijne kinderen, de verzorgers zijner kinderen en zijne ouders
      voor ten hoogste de helft, en van andere bloedverwanten tot den vierden graad en van aanverwanten tot denzelfden
      graad voor ten hoogste één derde; alles met dien verstande, dat het bedrag van hetgeen hij afstaat, gevoegd bij het
      ingevolge [artikel 425][ref1] aan de echtgenoote uit te betalen bedrag, twee derde gedeelte van het geheele in geld
      vastgestelde loon niet mag overtreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel425
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel428
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '425'
        paragraaf: '2'
  - number: '429.1'
    text: |-
      De boeten en de schadeloosstelling bedoeld in de [artikelen 423][ref1] en [438][ref2] zijn bevoorrecht op het in
      geld vastgestelde deel van het loon van den schepeling, hetwelk tot het bedrag daarvan kan worden ingehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel423
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel438
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel429
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '423'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '438'
        paragraaf: '2'
  - number: '429.2'
    text: |-
      Boete en schadeloosstelling komen in de eerste plaats ten laste van het deel van het loon, dat aan den schepeling
      persoonlijk moet worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel429
  - number: '429.3'
    text: |-
      Op het gedeelte van het loon, ten aanzien waarvan volgens [artikel 632 van Boek 7 van het Burgerlijk Wetboek][ref1]
      verrekening door de zeewerkgever voor het einde van de arbeidsovereenkomst is toegelaten, wordt hetgeen aan boeten,
      als hier bedoeld, is ingehouden in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel632
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel429
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '632'
  - number: '431'
    text: |-
      De arbeidsovereenkomst, voor bepaalde tijd aangegaan of voortgezet, eindigt in de eerste haven, welke het schip
      aandoet nadat die tijd is verstreken en, voorzoveel nodig, opzegging heeft plaats gevonden.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel431
  - number: '432.1'
    text: |-
      De arbeidsovereenkomst, aangegaan bij de reis, eindigt als de reis of de reizen, waarvoor zij is aangegaan, is of
      zijn afgeloopen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel432
  - number: '432.2'
    text: |-
      Evenwel kan de schepeling, na verloop van anderhalf jaar, de arbeidsovereenkomst door opzegging doen eindigen
      in iedere haven, welke het schip daarna aandoet. Bij de opzegging moet hij den termijn in acht nemen, welke
      redelijkerwijze noodig is voor zijne vervanging in die haven.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel432
  - number: '433.1'
    text: |-
      Indien is overeengekomen, dat de arbeidsovereenkomst zal eindigen bij terugkomst van het schip in eene met name
      genoemde Nederlandsche haven, is de zeewerkgever bevoegd haar te doen eindigen in eene haven, van waaruit de
      genoemde Nederlandsche haven, anders dan met een luchtvaartuig, binnen vier en twintig uur kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel433
  - number: '433.2'
    text: |-
      Is de Nederlandsche haven, waarop het schip zal terugkomen, niet met name genoemd, dan is de zeewerkgever bevoegd
      de arbeidsovereenkomst te doen eindigen in eene haven in het buitenland van waaruit Amsterdam of Rotterdam op de in
      het eerste lid bedoelde wijze kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel433
  - number: '433.3'
    text: |-
      Behalve de reiskosten heeft de zeewerkgever den schepeling voor de dagen nà de beëindiging van de
      arbeidsovereenkomst tot den dag, volgende op dien, waarop deze ter plaatse had kunnen aankomen, loon te betalen op
      den voet van het in de arbeidsovereenkomst naar tijdruimte in geld vastgesteld deel van het loon, alsmede de kosten
      van onderhoud en zoo noodig van nachtverblijf.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel433
  - number: '434.1'
    text: |-
      De arbeidsovereenkomst, aangegaan voor onbepaalden tijd, kan ieder der partijen gedurende den tijd, dat de
      schepeling in dienst is aan boord van een schip, door opzegging, met inachtneming van den daarvoor gestelden
      termijn, doen eindigen in iedere haven, waar het schip laadt of lost. Tenzij een langere termijn van opzegging is
      overeengekomen of uit de wet voortvloeit, bedraagt deze vier en twintig uren. De opzegging geschiedt schriftelijk.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel434
  - number: '434.2'
    text: De opzeggingstermijn mag voor de zeewerkgever niet korter worden gesteld dan voor den schepeling.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel434
  - number: '434.3'
    text: |-
      Dit artikel is mede van toepassing als de zeewerkgever overlijdt gedurende den tijd, dat de schepeling in dienst is
      aan boord van een schip, en hetzij de erfgenamen van de zeewerkgever hetzij de schepeling gebruik willen maken van
      de bevoegdheid hun gegeven in [artikel 675 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel675
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel434
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '675'
  - number: '435'
    text: |-
      Gedurende eene reis van het schip, waarop de schepeling in dienst is, kan een der partijen de arbeidsovereenkomst
      overeenkomstig het bepaalde in [artikel 677, eerste lid van Boek 7 van het Burgerlijk Wetboek][ref1] alleen doen
      eindigen tegen het tijdstip, op hetwelk het schip zich in eene haven bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel435
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
  - number: '436'
    text: |-
      Behalve in de gevallen, genoemd in [artikel 678, lid 2, van Boek 7 van het Burgerlijk Wetboek][ref1], zullen voor
      de zeewerkgever dringende redenen onder andere aanwezig geacht kunnen worden:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel678
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel436
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '678'
  - number: 436.1°
    text: |-
      wanneer de schepeling den kapitein of een opvarende van het schip mishandelt, grovelijk beleedigt of op ernstige
      wijze bedreigt of hem verleidt of tracht te verleiden tot handelingen strijdig met de wetten of de goede zeden;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel436
  - number: 436.2°
    text: |-
      wanneer, na den aanvang der arbeidsovereenkomst, de schepeling zich niet op den door de zeewerkgever aangegeven
      tijd doet monsteren of, na de monstering, aan boord van het schip aanmeldt;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel436
  - number: 436.3°
    text: |-
      wanneer den schepeling hetzij tijdelijk, hetzij voor goed de bevoegdheid wordt ontnomen, op een schip dienst te
      doen in de hoedanigheid, waarin hij zich heeft verbonden dienst te doen;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel436
  - number: 436.4°
    text: |-
      wanneer de schepeling, buiten weten van de zeewerkgever of den kapitein, smokkelwaren aan boord heeft gebracht of
      daar onder zijne berusting heeft.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel436
  - number: '437'
    text: |-
      Behalve in de gevallen, genoemd in [artikel 679, lid 2, van Boek 7 van het Burgerlijk Wetboek][ref1], zullen voor
      den schepeling dringende redenen onder andere aanwezig geacht kunnen worden:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel679
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel437
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '679'
  - number: 437.1°
    text: |-
      wanneer de zeewerkgever hem orders geeft, welke in strijd zijn met de arbeidsovereenkomst of met verplichtingen,
      welke de wet den schepeling oplegt;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel437
  - number: 437.2°
    text: |-
      wanneer de zeewerkgever het schip bestemt naar eene haven van een land, dat in een zee-oorlog is gewikkeld, of naar
      eene haven welke is geblokkeerd, tenzij de arbeidsovereenkomst dit uitdrukkelijk voorziet en is gesloten nà het
      uitbreken van den oorlog of nà het afkondigen van de blokkade;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel437
  - number: 437.3°
    text: |-
      wanneer in het geval van [artikel 367][ref1] de zeewerkgever orders geeft te vertrekken naar eene vijandelijke
      haven;


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel367
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel437
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '367'
  - number: 437.4°
    text: |-
      wanneer de zeewerkgever het schip gebruikt of laat gebruiken voor slavenhandel, zeeroof, strafbare kaapvaart of het
      vervoer van goederen waarvan de invoer verboden is in het land van bestemming;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel437
  - number: 437.5°
    text: |-
      wanneer de zeewerkgever het schip bestemt voor vervoer van contrabande, tenzij de arbeidsovereenkomst dit
      uitdrukkelijk voorziet en is gesloten nà het uitbreken van den oorlog;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel437
  - number: 437.6°
    text: wanneer voor hem aan boord gevaar voor mishandeling van de zijde van den kapitein of van een opvarende dreigt;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel437
  - number: 437.7°
    text: wanneer het logies aan boord in een toestand verkeert, welke schadelijk is voor de gezondheid der bemanning;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel437
  - number: 437.8°
    text: |-
      wanneer hem de voeding, waarop hij recht heeft, niet of niet in deugdelijken toestand wordt verstrekt, of wanneer
      de zeewerkgever handelt in strijd met het bepaalde bij het tweede lid van [artikel 407][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel407
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel437
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '407'
        paragraaf: '2'
  - number: 437.9°
    text: wanneer het schip het recht verliest de Nederlandsche vlag te voeren;
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel437
  - number: 437.10°
    text: |-
      wanneer de arbeidsovereenkomst is aangegaan voor een of meer bepaalde reizen en de zeewerkgever het schip andere
      reizen laat maken.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel437
  - number: '438.1'
    text: |-
      Indien de arbeidsovereenkomst wordt beëindigd gedurende eene reis van het schip, is de schadeloosstelling,
      bedoeld in [artikel 680, lid 1, van Boek 7 van het Burgerlijk Wetboek][ref1], bij eene arbeidsovereenkomst voor
      een bepaalden tijd aangegaan, gelijk aan het bedrag van het voor den dienst aan boord van een schip in geld
      vastgestelde loon voor den tijd, dat de arbeidsovereenkomst volgens de overeenkomst of de wet had behooren voort te
      duren, doch niet langer dan drie maanden. Hetzelfde geldt wanneer de arbeidsovereenkomst bij de reis is aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel680
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel438
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '680'
  - number: '438.2'
    text: |-
      Bij eene arbeidsovereenkomst, voor een onbepaalden tijd aangegaan, is de schadeloosstelling ten minste gelijk aan
      het bedrag van het voor den dienst aan boord van een schip in geld vastgestelde loon voor één maand.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel438
  - number: '439.1'
    text: |-
      Ieder der partijen is te allen tijde, ook vóórdat de arbeidsovereenkomst is aangevangen, bevoegd zich wegens
      gewichtige redenen te wenden tot de kantonrechter van de rechtbank van het arrondissement waarin de plaats van haar
      werkelijk verblijf gelegen is, of het schip zich bevindt, of in het Koninkrijk buiten Europa tot het bevoegde gezag
      of buiten het Koninkrijk tot den het eerst te bereiken Nederlandschen diplomatieken of bezoldigden consulairen
      ambtenaar, met het verzoek de arbeidsovereenkomst ontbonden te verklaren.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel439
  - number: '439.2'
    text: |-
      Als gewichtige redenen worden, behalve die genoemd in
      [artikel 685, lid 2, van Boek 7 van het Burgerlijk Wetboek][ref1], ook beschouwd omstandigheden, na den aanvang van
      den dienst aan boord aan den verzoeker gebleken of na dien opgekomen, waardoor de voortzetting van de reis, waarop
      het schip zich bevindt, hem aan onvoorzien, groot levensgevaar zou blootstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel685
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel439
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '685'
  - number: '439.3'
    text: |-
      Indien het den schepeling mogelijk is eene hoogere betrekking te verkrijgen, is hij steeds bevoegd het in het
      eerste lid bedoelde verzoek te doen, mits hij zorgt voor zijne vervanging zonder nieuwe kosten voor de zeewerkgever
      en te diens genoegen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel439
  - number: '440.1'
    text: |-
      Indien de arbeidsovereenkomst is aangegaan bij de reis en tengevolge van een maatregel van hooger hand of
      van andere overmacht de reis niet wordt aangevangen of, nadat zij is aangevangen, wordt gestaakt, neemt de
      arbeidsovereenkomst een einde. De schepeling heeft in het laatstbedoelde geval recht op het naar tijdruimte in geld
      vastgestelde loon, totdat hij in Nederland kan zijn teruggekomen of totdat hij eerder werk heeft gevonden. In geval
      van geschil wordt het bedrag van het loon vastgesteld door de kantonrechter van de rechtbank van het arrondissement
      waarin de zetel van het scheepsbedrijf is gelegen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel440
  - number: '440.2'
    text: |-
      Indien de schepeling zich heeft verbonden uitsluitend aan boord van een bepaald schip dienst te doen en dit schip
      vergaat, geldt het in het eerste lid bepaalde ook al is de arbeidsovereenkomst niet bij de reis aangegaan.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel440
  - number: '441'
    text: |-
      Voor zoover het in geld uitgedrukte deel van het loon is vastgesteld bij de reis, heeft de schepeling recht op eene
      evenredige verhooging van het loon, wanneer de reis door toedoen van de zeewerkgever, door molest of door verblijf
      in eene noodhaven of eene andere soortgelijke reden in het belang van het schip en de zaken aan boord daarvan wordt
      verlengd.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel441
  - number: '442'
    text: |-
      Indien de arbeidsovereenkomst is aangegaan bij de reis en de reis door toedoen van de zeewerkgever
      niet wordt aangevangen of, nadat zij is aangevangen, wordt gestaakt, neemt de arbeidsovereenkomst
      een einde. De schepeling heeft alsdan het recht op de schadeloosstelling, bepaald in
      [artikel 680 van Boek 7 van het Burgerlijk Wetboek][ref1] in verband met [artikel 438, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel680
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel438
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '680'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '438'
        paragraaf: '2'
  - number: '443.1'
    text: |-
      Eindigt de arbeidsovereenkomst in het buitenland, dan heeft de schepeling recht op vrij vervoer, indien hij
      Nederlander is, tot een haven in Nederland, indien hij niet Nederlander is, ter keuze van de zeewerkgever,
      tot de plaats waar de dienst aan boord van het schip is begonnen of tot een haven van het land waar hij thuis
      behoort, mits de schepeling zijn verlangen daartoe te kennen geeft uiterlijk op de dag volgende op die, waarop
      de arbeidsovereenkomst eindigt, de in [artikel 354][ref1] bedoelde dagen niet medegerekend, doch in ieder geval
      voor het vertrek van het schip. Echter heeft de schepeling dit recht niet, indien hij wegens de wijze, waarop
      de arbeidsovereenkomst is beëindigd, schadeplichtig is geworden. Indien de arbeidsovereenkomst is ontbonden op
      verzoek van de schepeling op grond van gewichtige redenen, heeft hij dit recht slechts, indien de zeewerkgever
      schadeplichtig is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel354
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel443
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '354'
  - number: '443.2'
    text: |-
      Onder het vrij vervoer zijn begrepen de kosten van onderhoud en nachtverblijf van het eindigen der
      arbeidsovereenkomst tot de aankomst van den schepeling in de plaats zijner bestemming.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel443
  - number: '444'
    text: Iedere beëindiging van den dienst aan boord van het schip wordt door den kapitein aangeteekend op de monsterrol.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel444
  - number: '445.1'
    text: |-
      De zeewerkgever is verplicht bij het einde van den dienst aan boord aan den schepeling eene schriftelijke
      afrekening ter hand te stellen. Indien geschil ontstaat over de afrekening, kan de meest gerede partij zich wenden
      tot de kantonrechter van de rechtbank van het arrondissement waar het schip is aangekomen of waar de zetel van het
      scheepsbedrijf is gelegen, met het verzoek de afrekening te onderzoeken en vast te stellen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel445
  - number: '445.2'
    text: |-
      Eindigt de dienst buiten Nederland, dan kan ieder der partijen, ter verkrijging van eene voorloopige beslissing,
      zich wenden, in het Koninkrijk buiten Europa, tot het bevoegde gezag, en buiten het Koninkrijk, tot den
      Nederlandschen diplomatieken of bezoldigden consulairen ambtenaar, die het eerst te bereiken is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel445
  - number: '446'
    text: |-
      Na het eindigen der reis is de schepeling, wiens arbeidsovereenkomst is afgeloopen, niettemin gedurende drie
      werkdagen gehouden op verlangen van den kapitein mede te werken tot het opmaken van eene scheepsverklaring.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel446
  - number: '447'
    text: |-
      De zeewerkgever verbeurt voor iederen dag, dat hij een officier of een scheepsgezel, gedurende of bij het einde van
      den dienst aan boord van een schip, zonder wettige reden, ophoudt in het verkrijgen van het in geld vastgestelde
      deel van zijn loon, ten behoeve van den officier € 1,36 en ten behoeve van den scheepsgezel € 0,68.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel447
  - number: '448.1'
    text: |-
      De schepelingen zijn verplicht aan het behoud van het schip en de zaken aan boord mede te werken. Zij hebben recht
      op buitengewone belooning voor de dagen, gedurende welke zij werkzaam zijn geweest.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel448
  - number: '448.2'
    text: |-
      In geval van geschil wordt de belooning vastgesteld door de rechtbank van het arrondissement waarin de
      werkzaamheden tot behoud hebben plaats gehad. In het Koninkrijk buiten Europa geschiedt de vaststelling door het
      bevoegde gezag en buiten het Koninkrijk door den Nederlandschen diplomatieken of bezoldigden consulairen ambtenaar,
      die het eerst te bereiken is.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel448
  - number: '449.1'
    text: |-
      Indien een schip, dat tot het verrichten van sleepdienst niet is bestemd, aan een ander in open zee aangetroffen
      schip sleepdienst bewijst onder omstandigheden welke niet aanspraak geven op hulploon, hebben niettemin de
      schepelingen recht op een aandeel in het sleeploon. De zeewerkgever is verplicht iederen schepeling vóór de
      uitbetaling desverlangd het bedrag van het sleeploon en de verdeeling daarvan schriftelijk mede te deelen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel449
  - number: '449.2'
    text: |-
      Het aandeel van de schepelingen in het sleeploon wordt, in geval van geschil, door de kantonrechter van de
      rechtbank van het arrondissement waar het schip is aangekomen of waar de zetel van het scheepsbedrijf is gelegen,
      naar billijkheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel449
  - number: '450.1'
    text: |-
      In geval van verlies van het schip door schipbreuk, is de zeewerkgever verplicht aan den schepeling, zoolang hij
      dientengevolge werkloos is, doch ten hoogste gedurende twee maanden, eene schadeloosstelling te betalen tot een
      bedrag gelijk aan het bij de arbeidsovereenkomst in geld vastgestelde deel van het loon. Is het loon geheel of
      voor een deel niet naar tijdruimte vastgesteld, dan is een bedrag verschuldigd gelijk aan het loon, dat volgens het
      gebruik wegens eene reis als die waarop het schip is verloren gegaan, bij vaststelling van het geheele loon naar
      tijdruimte, wordt betaald. In geval van geschil beslist de kantonrechter van de rechtbank van het arrondissement
      waarin de zetel van het scheepsbedrijf is gelegen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel450
  - number: '450.2'
    text: |-
      Voor zoover de schepeling krachtens het bepaalde in [artikel 440][ref1] recht heeft op loon, komt dit loon in
      mindering van de hierbedoelde schadeloosstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel440
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel450
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '440'
        paragraaf: '2'
  - number: '450.3'
    text: |-
      De vordering tot schadeloosstelling is bevoorrecht op alle de roerende en onroerende
      goederen van den zeewerkgever; het voorrecht staat in rang gelijk met dat bedoeld in
      [artikel 288 onder e van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel450
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '288'
  - number: '450.4'
    text: |-
      De zeewerkgever die meent dat een of meer van de schepelingen ten aanzien van de schipbreuk grove schuld treft, kan
      zich wenden tot de kantonrechter met het verzoek hem van zijn in het eerste lid bedoelde verplichting tegenover de
      betrokken schepelingen te ontheffen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel450
  - number: 450a.1
    text: |-
      De zeewerkgever, die verplicht is tot vrij vervoer van den schepeling naar eene haven, heeft het recht zich van die
      verplichting te kwijten, door hem, mits hij tot werken in staat is, aan boord van een naar die haven bestemd schip
      eene betrekking te verschaffen, overeenkomstig die, welke hij in dienst van den zeewerkgever bekleedde.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel450a
  - number: 450a.2
    text: |-
      Een Nederlandsch schepeling kan verlangen, dat de betrekking hem aan boord van een Nederlandsch schip wordt
      verschaft.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel450a
  - number: 450a.3
    text: |-
      Geschillen over de uitvoering dezer bepaling beslist in het Koninkrijk buiten Europa het bevoegde gezag en buiten
      het Koninkrijk de Nederlandsche diplomatieke of bezoldigde consulaire ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel450a
  - number: 450aa.1
    text: |-
      Bij verlies van de gehele uitrusting van de schepeling door een ramp aan het schip overkomen, heeft de schepeling,
      die niet bij die gebeurtenis het leven verliest, aanspraak op een uitkering ineens en heeft, indien de schepeling
      bij die gebeurtenis het leven verliest, de overlevende echtgenoot of geregistreerde partner of hebben, bij
      ontstentenis van deze, de gezamenlijke kinderen of, bij ontstentenis van dezen, de ouders recht op een uitkering
      ineens. Onder verlies van de gehele uitrusting wordt verstaan, dat niets is gered dan hetgeen de schepeling op of
      bij zich draagt.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel450aa
  - number: 450aa.2
    text: |-
      Bij algemene maatregel van bestuur wordt voor de verschillende groepen van schepelingen het bedrag van de in het
      vorige lid bedoelde uitkering bepaald.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel450aa
  - number: 450aa.3
    text: |-
      Bij verlies van een gedeelte van de uitrusting van de schepeling door een ramp aan het schip overkomen, bestaat een
      gelijke aanspraak als bedoeld in het eerste lid, met dien verstande, dat het bedrag van de uitkering wordt gesteld
      op de geldswaarde van het verloren gegane deel van de uitrusting tot ten hoogste het krachtens het tweede lid
      bepaalde bedrag.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel450aa
  - number: 450b
    text: |-
      De [artikelen 613 tot en met 613][ref1], [617][ref2], [620][ref3], [623][ref4], [624][ref5], [625][ref6],
      [627][ref7], [artikel 629, lid 10][ref8] en [artikel 629][ref9] voor zover het betreft de toepassing van
      [artikel 628, leden 3 en 4][ref10], [650][ref11], [652][ref12], [657][ref13], [658][ref14], [676][ref15],
      [683][ref16] en [684 van Boek 7 van het Burgerlijk Wetboek][ref17] vinden geen toepassing ten aanzien van de dienst
      van de schepeling aan boord van een schip.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel613
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel617
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel620
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel623
