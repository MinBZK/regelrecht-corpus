        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0001838
        artikel: 452l
        paragraaf: '5'
  - number: '391'
    text: |-
      De [artikelen 613 tot en met 613][ref1], [617][ref2], [620][ref3], [624][ref4], [625][ref5],
      [627][ref6], [artikel 629, lid 10][ref7] en [artikel 629][ref8] voor zover het betreft de toepassing van
      [artikel 628, leden 3 en 4][ref9], [652][ref10], [657][ref11], [658][ref12], [676][ref13], [683][ref14] en
      [684 van Boek 7 van het Burgerlijk Wetboek][ref15] vinden geen toepassing ten aanzien van de dienst van de kapitein
      aan boord van een schip.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel613
