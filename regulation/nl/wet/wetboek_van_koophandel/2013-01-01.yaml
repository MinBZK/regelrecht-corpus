      - id: ref15
        bwb_id: BWBR0001838
        artikel: 450aa
        paragraaf: '2'
      - id: ref16
        bwb_id: BWBR0001838
        artikel: 450c
        paragraaf: '2'
  - number: '390.2'
    text: |-
      Wanneer het betreft de arbeidsovereenkomst van een kapitein ter zeevisscherij, vinden bovendien de
      [artikelen 452f][ref1], [452h][ref2] en [452l][ref3] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel452f
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel452h
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel452l
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel390
    references:
