  - number: 450c.1
    text: |-
      Bij overeenkomst kunnen partijen niet afwijken van het bepaalde in de [artikelen 398-401][ref1], [407][ref2],
      [408][ref3], [413][ref4], [416-419][ref5], [421-426][ref6], [428][ref7], [439, eerste en tweede lid][ref8],
      [445][ref9], [448][ref10] en [449][ref11], noch ook ten nadeele van den schepeling van het bepaalde in de
      [artikelen 402][ref12], [414][ref13], [415 - 415h][ref14], [420][ref15], [427][ref16], [432-434][ref17],
      [438][ref18], [439, laatste lid][ref19], [440-443][ref20], [447][ref21], [450][ref22], [450a][ref23] en
      [450aa][ref24].


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel398
