  - number: 452v
    text: |-
      Na het eindigen van een reis is de schepeling gedurende drie werkdagen gehouden op verlangen van de kapitein mede
      te werken tot het opmaken van een scheepsverklaring.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel452v
  - number: 452w
    text: |-
      Bij overeenkomst kunnen partijen niet afwijken van het bepaalde in [artikel 452][ref1] en de in [artikel 452][ref2]
      genoemde [artikelen 407, eerste-zesde lid][ref3], [411][ref4], [412][ref5] en [416][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel452q
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel452t
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel407
