  - number: '176.3'
    text: |-
      Eveneens zijn op het orderbriefje toepasselijk de bepalingen betreffende het aval ([artikelen 129-131][ref1]);
      indien overeenkomstig hetgeen is bepaald bij [artikel 130, laatste lid][ref2], het aval niet vermeldt, voor wien
      het is gegeven, wordt het geacht voor rekening van den onderteekenaar van het orderbriefje te zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel130
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel176
