  - number: 450c.2
    text: |-
      Zij mogen in de arbeidsovereenkomst geen bepalingen opnemen, welke afwijken van de wettelijke regels betreffende
      de bevoegdheid des rechters kennis te nemen van geschillen betrekkelijk deze overeenkomst, onverminderd de
      mogelijkheid zich te verbinden om geschillen aan de uitspraak van scheidslieden te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0001838/2013-01-01#Artikel450c
  - number: 450d.1
    text: |-
      Eene beschikking ingevolge de [artikelen 415, derde lid][ref1], [424, laatste lid][ref2], [439][ref3], [445][ref4],
      [448][ref5], [449][ref6] en [450][ref7] geeft de kantonrechter niet dan na verhoor of behoorlijke oproeping van
      partijen. De oproeping geschiedt door den griffier op de wijze, bij algemeenen maatregel van bestuur te bepalen.
      Bij de oproeping van de wederpartij wordt een afschrift van het verzoekschrift gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel415
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel424
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel439
      [ref4]: https://wetten.overheid.nl/BWBR0001838#Artikel445
      [ref5]: https://wetten.overheid.nl/BWBR0001838#Artikel448
      [ref6]: https://wetten.overheid.nl/BWBR0001838#Artikel449
      [ref7]: https://wetten.overheid.nl/BWBR0001838#Artikel450
