      [ref7]: https://wetten.overheid.nl/BWBR0005290#Artikel627
      [ref8]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref9]: https://wetten.overheid.nl/BWBR0005290#Artikel629b
      [ref10]: https://wetten.overheid.nl/BWBR0005290#Artikel628
      [ref11]: https://wetten.overheid.nl/BWBR0005290#Artikel650
