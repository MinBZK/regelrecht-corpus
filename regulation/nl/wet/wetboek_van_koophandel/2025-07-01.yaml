  - number: '310'
    text: |-
      In de [eerste tot en met derde titel][ref1] van dit boek worden onder schepen uitsluitend verstaan zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel310
    references:
      - id: ref1
        bwb_id: BWBR0001838
  - number: '341'
    text: Onder opvarenden worden in dezen titel verstaan allen, die zich aan boord bevinden, buiten den kapitein.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel341
  - number: '342'
    text: |-
      De kapitein is verplicht met zoodanige bekwaamheid en nauwgezetheid en met zoodanig beleid te handelen als voor
      eene behoorlijke vervulling zijner taak noodig is.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel342
  - number: '343'
    text: |-
      1 De kapitein is verplicht de gebruikelijke regels en de bestaande voorschriften ter verzekering van de
      zeewaardigheid en de veiligheid van het schip, van de veiligheid der opvarenden en der zaken aan boord, met
      nauwgezetheid op te volgen.

      2 Hij onderneemt de reis niet, tenzij het schip tot het volvoeren daarvan geschikt, naar behooren uitgerust en
      voldoende bemand is.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel343
  - number: '344'
    text: |-
      De kapitein is verplicht overal waar de wet, de gewoonte of de voorzichtigheid dit gebiedt, zich van een loods
      te bedienen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel344
  - number: '345'
    text: |-
      De kapitein mag gedurende de vaart of bij dreigend gevaar het schip niet verlaten, tenzij zijne afwezigheid
      volstrekt noodzakelijk is of de zorg voor lijfsbehoud hem daartoe dwingt.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel345
  - number: '347'
    text: |-
      1 De kapitein moet aan boord voorzien zijn van:

      den zeebrief, den meetbrief en een uittreksel uit de registratie voor schepen als bedoeld in
      [artikel 101, eerste lid, van de Kadasterwet][ref1] vermeldende tenminste de gegevens, bedoeld in
      [artikel 85, tweede lid, onder ][ref2], alsmede de gegevens omtrent niet doorgehaalde voorlopige aantekeningen,
      met dien verstande dat, ingeval dat uittreksel meer dan één dag vóór die van het laatste vertrek van het schip
      uit een Nederlandse haven is afgegeven, op dat uittreksel een verklaring van de bewaarder van het kadaster en de
      openbare registers moet voorkomen dat sedert de afgifte de op dat uittreksel vermelde gegevens blijkens de stukken,
      ingeschreven in de desbetreffende openbare registers tot op de dag vóór die van het vertrek, geen wijziging hebben
      ondergaan;

      het manifest der lading, de charter-partij en de cognossementen, dan wel afschriften van die stukken;

      de Nederlandsche wetten en reglementen op de reis van toepassing, en alle verdere noodige papieren.

      2 Ten aanzien van de charter-partij en de cognossementen geldt deze verplichting niet in de door Ons te omschrijven
      omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel347
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '101'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '85'
  - number: '348'
    text: |-
      1 De kapitein zorgt, dat aan boord een scheepsdagboek (*dagregister* of *journaal*) wordt gehouden, waarin alles
      van eenig belang, dat op de reis voorvalt, nauwkeurig wordt opgeteekend.

      2 De kapitein van een schip, dat door mechanische kracht wordt voortbewogen, zorgt bovendien, dat door een lid van
      het machinekamer-personeel een machine-dagboek wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel348
  - number: '349'
    text: |-
      1 Op Nederlandse schepen mogen alleen dagboeken in gebruik worden genomen, welke blad voor blad zijn genummerd.

      2 De dagboeken worden, zo mogelijk, dagelijks bijgehouden, gedagtekend en door de kapitein en de zeevarende, die
      hij met het houden van het boek heeft belast, ondertekend.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het inrichten van de
      dagboeken.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel349
  - number: '350'
    text: |-
      De kapitein, de eigenaar en de rompbevrachter zijn verplicht aan belanghebbenden op hunne aanvrage inzage en, tegen
      betaling van de kosten, afschrift van de dagboeken te geven.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel350
  - number: '351'
    text: |-
      Wanneer de kapitein zich in zaken van aanbelang met leden van de bemanning heeft beraden, wordt van de hem gegeven
      adviezen in het scheepsdagboek melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel351
  - number: '353'
    text: |-
      1 Na aankomst in een haven kan de kapitein door een notaris eene scheepsverklaring doen opmaken omtrent de
      voorvallen der reis.

      2 Indien het schip of de zaken aan boord schade hebben geleden of eenig buitengewoon voorval heeft plaats gehad, is
      de kapitein verplicht binnen 48 uren na aankomst, in de plaats van aankomst of in een nabijgelegen plaats althans
      eene voorloopige verklaring te doen opmaken. Eene voorloopige verklaring moet binnen acht dagen door eene volledige
      verklaring worden gevolgd.

      3 De kapitein heeft zich te wenden in het Koninkrijk buiten Europa tot het bevoegde gezag en buiten het Koninkrijk
      tot den Nederlandschen consulairen ambtenaar of, bij ontstentenis van zoodanigen ambtenaar, tot het bevoegde gezag.

      4 De notaris is verplicht van scheepsverklaringen tegen betaling der kosten afschrift uit te reiken aan ieder die
      het verlangt.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel353
  - number: '354'
    text: |-
      1 Bij het berekenen van de in [artikel 353][ref1] genoemde wettelijke termijn tellen de Zondag en de daarmede
      gelijkgestelde dagen en, in het buitenland, de aldaar algemeen erkende wettelijke feestdagen niet mede.

      2 Met den Zondag worden gelijkgesteld de Nieuwjaarsdag, de Christelijke tweede Paasch- en Pinksterdagen, de beide
      Kerstdagen en de Hemelvaartsdag.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel353
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel354
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '353'
  - number: '355'
    text: |-
      De door den kapitein aan te wijzen zeevarenden zijn verplicht bij het opmaken van de scheepsverklaring hunne
      medewerking te verleenen door van hunne bevinding verklaring af te leggen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel355
  - number: '356'
    text: |-
      De beoordeeling van de bewijskracht van scheepsdagboeken en scheepsverklaringen, ten aanzien van de daarin vermelde
      voorvallen der reis, is voor ieder geval aan den rechter overgelaten.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel356
  - number: '357'
    text: |-
      De kapitein is bevoegd, indien dit tot behoud van schip of lading noodzakelijk is, scheepstoebehooren en
      bestanddeelen van de lading zoowel over boord te werpen als te verbruiken.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel357
  - number: '358'
    text: |-
      De kapitein is in geval van nood gedurende de reis bevoegd, levensmiddelen, welke in het bezit zijn van opvarenden
      of tot de lading behooren, tegen schadevergoeding tot zich te nemen, ten einde die te verbruiken in het belang van
      allen die zich aan boord bevinden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel358
  - number: 358a
    text: |-
      1 De kapitein is verplicht aan personen, die in gevaar verkeeren, en in het bijzonder, als zijn schip bij eene
      aanvaring betrokken is geweest, aan de andere daarbij betrokken schepen en de personen, die zich aan boord dier
      schepen bevinden, de hulp te verleenen, waartoe hij bij machte is, zonder zijn eigen schip en de opvarenden daarvan
      aan ernstig gevaar bloot te stellen.

      2 Hij is bovendien verplicht, voor zooverre hem dit mogelijk is, aan de andere bij de aanvaring betrokken schepen
      op te geven den naam van zijn schip, van de haven waar het thuis behoort en van de havens van waar het komt en
      waarheen het bestemd is.

      3 Niet-nakoming van deze verplichtingen door den kapitein geeft geen aanspraak tegen hem, die uit welken hoofde dan
      ook verantwoordelijk is voor het optreden van de kapitein.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel358a
  - number: 358b
    text: |-
      1 De kapitein van een Nederlandsch, naar Nederland bestemd schip, in eene buitenlandsche haven vertoevend, is
      verplicht, zich daar bevindende, hulpbehoevende Nederlandsche zeelieden, voorzoover aan boord voor hen plaats is,
      op verlangen van den Nederlandschen consulairen ambtenaar of, waar deze ontbreekt, van de plaatselijke overheid,
      naar Nederland over te brengen.

      2 De kosten hiervan zijn voor rekening van den Staat. De vaststelling dier kosten geschiedt op den grondslag door
      Ons te bepalen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel358b
  - number: '359'
    text: |-
      De kapitein heeft de zorg voor alles wat met het beladen en het lossen van het schip in verband staat, voor
      zooverre niet andere personen daarmee zijn belast.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel359
  - number: '367'
    text: |-
      De kapitein, vernemende dat de vlag, waaronder hij vaart, onvrij is geworden, is verplicht in de meest in de
      nabijheid gelegen onzijdige haven binnen te loopen en aldaar te blijven liggen, totdat hij op veilige wijze kan
      vertrekken of van hem die daartoe bevoegd is stellige orders om te vertrekken heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel367
  - number: '368'
    text: |-
      Indien den kapitein blijkt, dat de haven, waarheen het schip is bestemd, wordt geblokkeerd, is hij verplicht in de
      meest geschikte in de nabijheid gelegen haven binnen te loopen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel368
  - number: '370'
    text: De kapitein mag van den koers, welken hij moet volgen, afwijken ter redding van menschenlevens.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel370
  - number: 371a
    text: |-
      Indien gedurende de reis iemand aan boord wordt ontdekt, die niet in het bezit is van een geldig reisbiljet en niet
      bereid of niet in staat is op eerste aanmaning van den kapitein vracht te betalen, heeft deze het recht hem aan
      boord werk te laten verrichten, waartoe hij in staat is, en hem bij de eerste gelegenheid die zich voordoet van
      boord te verwijderen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel371a
  - number: '372'
    text: |-
      Noch de kapitein, noch een opvarende mag voor eigen rekening goederen in het schip vervoeren, tenzij krachtens
      overeenkomst met of verlof van de eigenaar en, indien het schip is vervracht, ook van den bevrachter.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel372
  - number: '374'
    text: |-
      1 [Artikel 347][ref1], het [tweede lid van artikel 348][ref2] en [artikel 349, eerste lid][ref3], zijn niet van
      toepassing op zeevissersschepen.

      2 Aan boord moeten aanwezig zijn een uittreksel uit de registratie voor schepen als bedoeld in
      [artikel 101, eerste lid, van de Kadasterwet][ref4] vermeldende tenminste de gegevens, bedoeld in
      [artikel 85, tweede lid, onder ][ref5], alsmede de gegevens omtrent niet doorgehaalde voorlopige aantekeningen,
      welk uittreksel op een zodanig tijdstip moet zijn afgegeven door de bewaarder van het kadaster en de openbare
      registers dat de daarin vermelde gegevens overeenstemmen met die welke in de registratie voor schepen ten aanzien
      van het betrokken schip staan vermeld ten tijde van het uitvaren van dat schip, en de wetten en reglementen op deze
      schepen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel347
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel348
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel349
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel101
      [ref5]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel374
