articles:
  - number: '1'
    text: |-
      Het Burgerlijk Wetboek is, voor zoo verre daarvan bij dit Wetboek niet bijzonderlijk is afgeweken, ook op de in dit
      Wetboek behandelde onderwerpen toepasselijk.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel1
  - number: '15'
    text: |-
      De in dezen titel genoemde vennootschappen worden geregeerd door de overeenkomsten van partijen, door dit Wetboek
      en door het Burgerlijk Regt.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel15
  - number: '16'
    text: |-
      De vennootschap onder eene firma is de maatschap, tot de uitoefening van een bedrijf onder eenen
      gemeenschappelijken naam aangegaan.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel16
  - number: '17'
    text: |-
      1 Elk der vennooten, die daarvan niet is uitgesloten, is bevoegd ten name der vennootschap te handelen, gelden uit
      te geven en te ontvangen, en de vennootschap aan derden, en derden aan de vennootschap te verbinden.

      2 Handelingen welke niet tot de vennootschap betrekkelijk zijn, of tot welke de vennooten volgens de overeenkomst
      onbevoegd zijn, worden onder deze bepaling niet begrepen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel17
  - number: '18'
    text: |-
      In vennootschappen onder eene firma is elk der vennooten, wegens de verbindtenissen der vennootschap, hoofdelijk
      verbonden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel18
  - number: '19'
    text: |-
      1 De vennootschap bij wijze van geldschieting, anders *en commandite* genaamd, wordt aangegaan tusschen eenen
      persoon, of tusschen meerdere hoofdelijk verbonden vennoten, en eenen of meer andere personen als geldschieters.

      2 Eene vennootschap kan alzoo te gelijker tijd zijn eene vennootschap onder eene firma, ten aanzien van de
      vennooten onder de firma, en eene vennootschap bij wijze van geldschieting, ten aanzien van den geldschieter.

      3 De vennootschap bij wijze van geldschieting heeft geen in aandelen verdeeld kapitaal.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel19
  - number: '20'
    text: |-
      1 Behoudens de uitzondering, in het tweede lid van [art. 30][ref1] voorkomende, mag de naam van den vennoot bij
      wijze van geldschieting in de firma niet worden gebezigd.

      2 Deze vennoot mag geene daad van beheer verrigten of in de zaken van de vennootschap werkzaam zijn, zelfs niet uit
      kracht eener volmagt.

      3 Hij draagt niet verder in de schade dan ten beloope der gelden, welke hij in de vennootschap heeft ingebragt of
      heeft moeten inbrengen, zonder dat hij immer tot teruggave van genotene winsten verpligt zij.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel30
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '30'
  - number: '21'
    text: |-
      De vennoot bij wijze van geldschieting, die de bepalingen van het eerste of van het tweede lid van het vorige
      artikel overtreedt, is wegens alle de schulden en verbindtenissen van de vennootschap hoofdelijk verbonden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel21
  - number: '22'
    text: |-
      De vennootschappen onder eene firma moeten worden aangegaan bij authentieke of bij onderhandsche akte, zonder dat
      het gemis eener akte aan derden kan worden tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel22
  - number: '23'
    text: |-
      De vennooten onder eene firma zijn verpligt de vennootschap te doen inschrijven in het handelsregister,
      overeenkomstig de daarvoor geldende wettelijke bepalingen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel23
  - number: '29'
    text: |-
      Zoolang de inschrijving in het handelsregister niet is geschied, zal de vennootschap onder eene firma, ten aanzien
      van derden, worden aangemerkt als algemeen voor alle zaken, als aangegaan voor eenen onbepaalden tijd, en als
      geenen der vennooten uitsluitende van het regt om voor de firma te handelen en te teekenen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel29
  - number: '30'
    text: |-
      1 De firma van eene ontbondene vennootschap kan, het zij uit kracht der overeenkomst, het zij indien de gewezen
      vennoot, wiens naam in de firma voorkwam, daarin uitdrukkelijk toestemt, of, bij overlijden, deszelfs erfgenamen
      zich niet daartegen verzetten, door eenen of meer personen worden aangehouden, welke, ten blijke daarvan, eene
      akte moeten uitbrengen, en dezelve doen inschrijven in het handelsregister, overeenkomstig de daarvoor geldende
      wettelijke bepalingen.

      2 De bepaling van het eerste lid van [art. 20][ref1] is niet toepasselijk, indien de afgetredene, van vennoot onder
      eene firma, vennoot bij wijze van geldschieting is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel20
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '20'
  - number: '31'
    text: |-
      De ontbinding eener vennootschap onder eene firma vóór den tijd bij de overeenkomst bepaald, of door afstand
      of opzegging tot stand gebragt, derzelver verlenging na verloop van het bepaalde tijdstip, mitsgaders alle
      veranderingen in de oorspronkelijke overeenkomst gemaakt, welke derden aangaan, zijn aan de voormelde inschrijving
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel31
  - number: '32'
    text: |-
      1 Bij de ontbinding der vennootschap zullen de vennooten, die het regt van beheer hebben gehad, de zaken der
      gewezen vennootschap moeten vereffenen in naam van dezelfde firma, ten zij bij de overeenkomst anders ware
      bepaald, of de gezamenlijke vennooten (die bij wijze van geldschieting niet daaronder begrepen), hoofdelijk en bij
      meerderheid van stemmen, eenen anderen vereffenaar hadden benoemd.

      2 Indien de stemmen staken beschikt de rechtbank, zoodanig als zij in het belang der ontbondene vennootschap meest
      geraden zal achten.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel32
  - number: '33'
    text: |-
      Indien de staat der kas van de ontbondene vennootschap niet toereikt om de opeischbare schulden te betalen, zullen
      zij, die met de vereffening belast zijn, de benoodigde penningen kunnen vorderen, welke door elk der vennooten,
      voor zijn aandeel in de vennootschap, zullen moeten worden ingebragt.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel33
  - number: '34'
    text: |-
      De gelden die gedurende de vereffening uit de kas der vennootschap kunnen gemist worden, zullen voorloopig worden
      verdeeld.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel34
  - number: '59'
    text: |-
      De beurs van koophandel is de zamenkomst van kooplieden, schippers, tussenpersonen, kassiers en andere personen tot
      den koophandel in betrekking staande. Zij heeft plaats op gezag van het plaatselijk bestuur.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel59
  - number: '60'
    text: |-
      1 Uit de handelingen en afspraken, ter beurze gesloten, worden opgemaakt de bepaling van den wisselkoers, de prijs
      der koopmanschappen, der assurantien, der zeevrachten, der kosten van vervoer te water en te lande, der binnen- en
      buitenlandsche obligatien, fondsen en andere papieren, die voor bepaling van koers vatbaar zijn.

      2 Deze onderscheidene koersen of prijzen worden volgens plaatselijke reglementen of gebruiken opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel60
  - number: '61'
    text: |-
      Het uur van het aangaan en afloopen der beurs, en alles wat de goede orde aldaar betreft, wordt door plaatselijke
      reglementen bepaald.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel61
  - number: '62'
    text: |-
      1 Onder tussenpersoon wordt verstaan degene die:

      a. zijn bedrijf maakt van het verlenen van bemiddeling bij het totstandbrengen en het sluiten van overeenkomsten in
      opdracht en op naam van personen tot wie hij niet in een vaste dienstbetrekking staat,

      b. beherend vennoot van een vennootschap of bestuurder van een rechtspersoon is die haar bedrijf maakt van het
      verrichten van de in onderdeel a genoemde handelingen, of

      c. in arbeidsovereenkomst staande tot een persoon, vennootschap of rechtspersoon als bedoeld in dit artikel, namens
      zijn werkgever de in onderdeel a genoemde handelingen verricht.

      2 Het in het eerste lid bedoelde bedrijf kan mede omvatten het bemonsteren en waarderen van goederen en het
      uitbrengen van deskundigenberichten.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel62
  - number: '68'
    text: |-
      De tussenpersoon is verplicht van iedere door hem gesloten overeenkomst aantekening te houden; hij doet van de
      aantekening aan ieder der partijen terstond een door hem gewaarmerkt afschrift toekomen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel68
  - number: 68b
    text: |-
      1 Tenzij hij daarvan door partijen is ontslagen, is de tussenpersoon verplicht van elke door hem op monster
      verkochte partij goederen het monster, voorzien van een duidelijk herkenningsteken, te bewaren gedurende een
      redelijke termijn overeenkomstig de gebruiken in de handel.

      2 De rechter kan aan een tussenpersoon de overlegging van het door hem bewaarde monster in rechte bevelen teneinde
      dit te bezichtigen en hij kan daaromtrent zijn toelichting vorderen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel68b
  - number: '69'
    text: |-
      De tussenpersoon die een door hem verhandelde wisselbrief of ander handelspapier aan de koper ter hand stelt, staat
      in voor de echtheid van de zich daarop bevindende handtekening van de verkoper.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel69
  - number: '70'
    text: |-
      De [artikelen 68][ref1], [68b][ref2] en [69][ref3] zijn van overeenkomstige toepassing op de vennootschap en de
      rechtspersoon die bemiddeling door middel van tussenpersonen tot bedrijf hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel68b
      [ref3]: https://wetten.overheid.nl/BWBR0001838#Artikel69
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '68'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 68b
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001838
        artikel: '69'
        afdeling: Tweede
  - number: '100'
    text: |-
      De wisselbrief behelst:

      1°. de benaming "wisselbrief", opgenomen in den tekst zelf en uitgedrukt in de taal, waarin de titel is gesteld;

      2°. de onvoorwaardelijke opdracht tot betaling van een bepaalde som;

      3°. den naam van dengene, die betalen moet (betrokkene);

      4°. de aanwijzing van den vervaldag;

      5°. die van de plaats, waar de betaling moet geschieden;

      6°. den naam van dengene, aan wien of aan wiens order de betaling moet worden gedaan;

      7°. de vermelding van de dagteekening, alsmede van de plaats, waar de wisselbrief is getrokken;

      8°. de handteekening van dengene, die den wisselbrief uitgeeft (trekker).
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel100
  - number: '101'
    text: |-
      1 De titel, waarin ééne der vermeldingen, in het voorgaande artikel aangegeven, ontbreekt, geldt niet als
      wisselbrief, behoudens in de hieronder genoemde gevallen:

      2 De wisselbrief, waarvan de vervaldag niet is aangewezen, wordt beschouwd als betaalbaar op zicht.

      3 Bij gebreke van een bijzondere aanwijzing wordt de plaats, aangegeven naast den naam van den betrokkene, geacht
      te zijn de plaats van betaling en tevens de plaats van het domicilie des betrokkenen.

      4 De wisselbrief, welke niet de plaats aanwijst, waar hij is getrokken, wordt geacht te zijn onderteekend in de
      plaats, aangegeven naast den naam des trekkers.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel101
  - number: '102'
    text: |-
      1 De wisselbrief kan aan de order van den trekker luiden.

      2 Hij kan worden getrokken op den trekker zelf.

      3 Hij kan worden getrokken voor rekening van eenen derde. De trekker wordt geacht voor zijne eigene rekening te
      hebben getrokken, indien uit den wisselbrief of uit den adviesbrief niet blijkt, voor wiens rekening zulks is
      geschied.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel102
  - number: 102a
    text: |-
      1 Wanneer de trekker op den wisselbrief de vermelding "waarde ter incasseering", "ter incasso", "in lastgeving",
      of eenige andere vermelding met zich brengend een bloote opdracht tot inning, heeft geplaatst, kan de nemer alle
      uit den wisselbrief voortvloeiende rechten uitoefenen, maar hij kan dezen niet anders endosseeren dan bijwege van
      lastgeving.

      2 Bij een zoodanigen wisselbrief kunnen de wisselschuldenaren aan den houder slechts de verweermiddelen
      tegenwerpen, welke aan den trekker zouden kunnen worden tegengeworpen.

      3 De opdracht, vervat in een incasso-wisselbrief, eindigt niet door den dood of de latere onbekwaamheid van den
      lastgever.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel102a
  - number: '103'
    text: |-
      Een wisselbrief kan betaalbaar zijn aan de woonplaats van eenen derde, hetzij in de plaats, waar de betrokkene zijn
      domicilie heeft, hetzij in een andere plaats.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel103
  - number: '104'
    text: |-
      1 In eenen wisselbrief, betaalbaar op zicht of een zekeren tijd na zicht, kan de trekker bepalen, dat de som rente
      draagt. In elken anderen wisselbrief wordt deze clausule voor niet geschreven gehouden.

      2 De rentevoet moet in den wisselbrief worden aangegeven. Bij gebreke hiervan wordt de renteclausule voor niet
      geschreven gehouden.

      3 De rente loopt te rekenen van de dagteekening van den wisselbrief, tenzij een andere dag is aangegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel104
  - number: '105'
    text: |-
      1 De wisselbrief, waarvan het bedrag voluit in letters en tevens in cijfers is geschreven, geldt, in geval van
      verschil, ten beloope van de som, voluit in letters geschreven.

      2 De wisselbrief, waarvan het bedrag meermalen is geschreven, hetzij voluit in letters, hetzij in cijfers, geldt,
      in geval van verschil, slechts ten beloope van de kleinste som.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel105
  - number: '106'
    text: |-
      Indien de wisselbrief handteekeningen bevat van personen, die onbekwaam zijn zich door middel van eenen wisselbrief
      te verbinden, valsche handteekeningen, of handteekeningen van verdichte personen, of handteekeningen, welke,
      onverschillig om welke andere reden, de personen, die die handteekeningen hebben geplaatst of in wier naam zulks
      is geschied, niet kunnen verbinden, zijn de verbintenissen der andere personen, wier handteekeningen op den
      wisselbrief voorkomen, desniettemin geldig.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel106
  - number: '107'
    text: |-
      Ieder, die zijne handteekening op eenen wisselbrief plaatst als vertegenwoordiger van eenen persoon, voor wien
      hij niet de bevoegdheid had te handelen, is zelf krachtens den wisselbrief verbonden, en heeft, betaald hebbende,
      dezelfde rechten, als de beweerde vertegenwoordigde zou hebben gehad. Hetzelfde geldt ten aanzien van den
      vertegenwoordiger, die zijne bevoegdheid heeft overschreden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel107
  - number: '108'
    text: |-
      1 De trekker staat in voor de acceptatie en voor de betaling.

      2 Hij kan zijne verplichting, voor de acceptatie in te staan, uitsluiten; elke clausule, waarbij hij de
      verplichting, voor de betaling in te staan, uitsluit, wordt voor niet-geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel108
  - number: '109'
    text: |-
      Indien een wisselbrief, onvolledig ten tijde der uitgifte, is volledig gemaakt in strijd met de aangegane
      overeenkomsten, kan de niet-naleving van die overeenkomsten niet worden tegengeworpen aan den houder, die de wissel
      te goeder trouw heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel109
  - number: 109a
    text: |-
      De trekker is verplicht, ter keuze van den nemer, den wisselbrief te stellen betaalbaar aan den nemer zelven, of
      aan eenigen anderen persoon, in beide gevallen aan order of zonder bijvoeging van order dan wel met bijvoeging van
      eene uitdrukking, als bedoeld in [artikel 110, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel110
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '110'
        afdeling: Tweede
  - number: 109b
    text: |-
      De trekker, of degene voor wiens rekening de wisselbrief is getrokken, is verplicht zorg te dragen, dat de
      betrokkene, ten vervaldage, in handen hebbe het noodige fonds tot betaling, zelfs indien de wisselbrief bij eenen
      derde is betaalbaar gesteld, met dien verstande echter, dat de trekker zelf in alle gevallen aan den houder en de
      vroegere endossanten persoonlijk verantwoordelijk blijft.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel109b
  - number: 109c
    text: |-
      De betrokkene wordt geacht, het noodige fonds in handen te hebben, indien hij bij het vervallen van den wisselbrief
      of op het tijdstip, waarop ingevolge het [derde lid van artikel 142][ref1] de houder regres kan nemen, aan den
      trekker of aan dengene voor wiens rekening is getrokken, eene opeischbare som schuldig is, ten minste gelijkstaande
      met het beloop van den wisselbrief.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel142
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel109c
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '142'
        afdeling: Zevende
  - number: '110'
    text: |-
      1 Elke wisselbrief, ook die welke niet uitdrukkelijk aan order luidt, kan door middel van endossement worden
      overgedragen.

      2 Indien de trekker in den wisselbrief de woorden: "niet aan order" of een soortgelijke uitdrukking heeft
      opgenomen, kan het stuk slechts worden overgedragen in den vorm en met de gevolgen van een gewone cessie. Een op
      zulk een wisselbrief geplaatst endossement geldt als een gewone cessie.

      3 Het endossement kan worden gesteld zelfs ten voordeele van den betrokkene, al of niet acceptant, van den trekker,
      of van elken anderen wisselschuldenaar. Deze personen kunnen den wisselbrief opnieuw endosseeren.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel110
  - number: '111'
    text: |-
      1 Het endossement moet onvoorwaardelijk zijn. Elke daarin opgenomen voorwaarde wordt voor niet-geschreven gehouden.

      2 Het gedeeltelijke endossement is nietig.

      3 Het endossement aan toonder geldt als endossement in blanco.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel111
  - number: '112'
    text: |-
      1 Het endossement moet worden gesteld op den wisselbrief of op een daaraan vastgehecht blad (verlengstuk). Het moet
      worden onderteekend door den endossant.

      2 Het endossement kan den geëndosseerde onvermeld laten of bestaan uit de enkele handteekening van den endossant
      (endossement in blanco). In het laatste geval moet het endossement, om geldig te zijn, op de rugzijde van den
      wisselbrief of op het verlengstuk worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel112
  - number: '113'
    text: |-
      1 Door het endossement worden alle uit den wisselbrief voortvloeiende rechten overgedragen.

      2 Indien het endossement in blanco is, kan de houder:

      1°. het blanco invullen, hetzij met zijn eigen naam, hetzij met den naam van een anderen persoon;

      2°. den wisselbrief wederom in blanco of aan een anderen persoon endosseeren;

      3°. den wisselbrief aan eenen derde overgeven, zonder het blanco in te vullen en zonder hem te endosseeren.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel113
  - number: '114'
    text: |-
      1 Tenzij het tegendeel bedongen is, staat de endossant in voor de acceptatie en voor de betaling.

      2 Hij kan een nieuw endossement verbieden; in dat geval staat hij tegenover de personen, aan wie de wisselbrief
      later is geëndosseerd, niet in voor de acceptatie en voor de betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel114
  - number: '115'
    text: |-
      1 Hij, die eenen wisselbrief onder zich heeft, wordt beschouwd als de rechtmatige houder, indien hij van zijn
      recht doet blijken door een ononderbroken reeks van endossementen, zelfs indien het laatste endossement in blanco
      is gesteld. De doorgehaalde endossementen worden te dien aanzien voor niet geschreven gehouden. Wanneer een
      endossement in blanco door een ander endossement is gevolgd, wordt de onderteekenaar van dit laatste geacht den
      wisselbrief door een endossement in blanco verkregen te hebben.

      2 Indien iemand, op welke wijze dan ook, het bezit van den wisselbrief heeft verloren, is de houder, die van zijn
      recht doet blijken op de wijze, bij het voorgaande lid aangegeven, niet verplicht den wisselbrief af te geven,
      indien hij deze te goeder trouw heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel115
  - number: '116'
    text: |-
      Zij, die uit hoofde van den wisselbrief worden aangesproken, kunnen de verweermiddelen, gegrond op hun persoonlijke
      verhouding tot den trekker of tot vroegere houders, niet aan den houder tegenwerpen, tenzij deze bij de verkrijging
      van den wisselbrief desbewust ten nadeele van den schuldenaar heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel116
  - number: '117'
    text: |-
      1 Wanneer het endossement de vermelding bevat: "waarde ter incasseering", "ter incasso", "in lastgeving", of
      eenige andere vermelding, met zich brengend een bloote opdracht tot inning, kan de houder alle uit den wisselbrief
      voortvloeiende rechten uitoefenen, maar hij kan dezen niet anders endosseeren dan bij wege van lastgeving.

      2 De wisselschuldenaren kunnen in dat geval aan den houder slechts de verweermiddelen tegenwerpen, welke aan den
      endossant zouden kunnen worden tegengeworpen.

      3 De opdracht, vervat in een incasso-endossement, eindigt niet door den dood of door de latere onbekwaamheid van
      den lastgever.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel117
  - number: '118'
    text: |-
      1 Wanneer een endossement de vermelding bevat: "waarde tot zekerheid", "waarde tot pand", of eenige andere
      vermelding, welke inpandgeving met zich brengt, kan de houder alle uit den wisselbrief voortvloeiende rechten
      uitoefenen, maar een door hem gesteld endossement geldt slechts als endossement bij wege van lastgeving.

      2 De wisselschuldenaren kunnen den houder de verweermiddelen, gegrond op hun persoonlijke verhouding tot den
      endossant, niet tegenwerpen, tenzij de houder bij de ontvangst van den wisselbrief desbewust ten nadeele van den
      schuldenaar heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel118
  - number: '119'
    text: |-
      1 Een endossement, gesteld na den vervaldag, heeft dezelfde gevolgen als een endossement, gesteld vóór den
      vervaldag. Echter heeft het endossement, gesteld na het protest van non-betaling of na het verstrijken van den
      termijn, voor het opmaken van het protest bepaald, slechts de gevolgen eener gewone cessie.

      2 Behoudens tegenbewijs wordt het endossement zonder dagteekening geacht te zijn gesteld vóór het verstrijken van
      den termijn, voor het opmaken van het protest bepaald.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel119
  - number: '120'
    text: |-
      De wisselbrief kan tot den vervaldag door den houder of door iemand, die hem enkel onder zich heeft, aan den
      betrokkene te zijner woonplaats ter acceptatie worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel120
  - number: '121'
    text: |-
      1 In elken wisselbrief kan de trekker, al dan niet met vaststelling van een termijn, bepalen, dat deze ter
      acceptatie moet worden aangeboden.

      2 Hij kan in den wisselbrief de aanbieding ter acceptatie verbieden, behoudens in wisselbrieven, betaalbaar bij
      eenen derde, of betaalbaar in een andere plaats dan die van het domicilie des betrokkenen of betaalbaar een zekeren
      tijd na zicht.

      3 Hij kan ook bepalen, dat de aanbieding ter acceptatie niet kan plaats hebben vóór een bepaalden dag.

      4 Tenzij de trekker heeft verklaard, dat de wisselbrief niet vatbaar is voor acceptatie, kan elke endossant, al dan
      niet met vaststelling van eenen termijn, bepalen, dat hij ter acceptatie moet worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel121
  - number: '122'
    text: |-
      1 Wisselbrieven, betaalbaar een zekeren tijd na zicht, moeten ter acceptatie worden aangeboden binnen een jaar na
      hunne dagteekening.

      2 De trekker kan dezen termijn verkorten of verlengen.

      3 De endossanten kunnen deze termijnen verkorten.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel122
  - number: '123'
    text: |-
      1 De betrokkene kan verzoeken, dat hem een tweede aanbieding wordt gedaan den dag, volgende op de eerste.
      Belanghebbenden zullen zich er niet op mogen beroepen, dat aan dit verzoek geen gevolg is gegeven, tenzij het
      verzoek in het protest is vermeld.

      2 De houder is niet verplicht, den ter acceptatie aangeboden wisselbrief aan den betrokkene af te geven.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel123
  - number: '124'
    text: |-
      1 De acceptatie wordt op den wisselbrief gesteld. Zij wordt uitgedrukt door het woord: "geaccepteerd", of door een
      soortgelijk woord; zij wordt door den betrokkene onderteekend. De enkele handteekening van den betrokkene, op de
      voorzijde van den wisselbrief gesteld, geldt als acceptatie.

      2 Wanneer de wisselbrief betaalbaar is een zekeren tijd na zicht, of wanneer hij krachtens een uitdrukkelijk beding
      ter acceptatie moet worden aangeboden binnen een bepaalden termijn, moet de acceptatie als dagteekening inhouden
      den dag, waarop zij is geschied, tenzij de houder dien van de aanbieding eischt. Bij gebreke van dagteekening moet
      de houder dit verzuim door een tijdig protest doen vaststellen, op straffe van verlies van zijn recht van regres op
      de endossanten en op den trekker, die fonds heeft bezorgd.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel124
  - number: '125'
    text: |-
      1 De acceptatie is onvoorwaardelijk, maar de betrokkene kan haar beperken tot een gedeelte van de som.

      2 Elke andere wijziging, door den acceptant met betrekking tot het in den wisselbrief vermelde aangebracht, geldt
      als weigering van acceptatie. De acceptant is echter gehouden overeenkomstig den inhoud zijner acceptatie.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel125
  - number: '126'
    text: |-
      1 Wanneer de trekker den wisselbrief op een andere plaats dan die van het domicilie des betrokkenen heeft
      betaalbaar gesteld, zonder eenen derde aan te wijzen, bij wien de betaling moet worden gedaan, kan de betrokkene
      dezen bij de acceptatie aanwijzen. Bij gebreke van zoodanige aanwijzing wordt de acceptant geacht zich verbonden te
      hebben zelf te betalen op de plaats van betaling.

      2 Indien de wisselbrief betaalbaar is aan het domicilie des betrokkenen, kan deze, in de acceptatie, een adres
      aanwijzen, in dezelfde plaats, waar de betaling moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel126
  - number: '127'
    text: |-
      1 Door de acceptatie verbindt de betrokkene zich, den wisselbrief op den vervaldag te betalen.

      2 Bij gebreke van betaling heeft de houder, al ware hij de trekker, tegen den acceptant een rechtstreeksche
      vordering, uit den wisselbrief voortspruitend, voor al hetgeen kan worden gevorderd krachtens de
      [artikelen 147][ref1] en [148][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel148
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '147'
        afdeling: Zevende
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '148'
        afdeling: Zevende
  - number: 127a
    text: |-
      Hij, die het noodige fonds in handen heeft, bijzonderlijk bestemd tot de betaling van eenen getrokken wisselbrief,
      is, op straffe van schadevergoeding jegens den trekker, tot de acceptatie verplicht.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel127a
  - number: 127b
    text: |-
      1 Belofte om eenen wisselbrief te zullen accepteeren geldt niet als acceptatie, maar geeft aan den trekker eene
      rechtsvordering tot schadevergoeding tegen den belover, die weigert zijne belofte gestand te doen.

      2 Deze schade bestaat in de kosten van protest en herwissel, wanneer de wisselbrief voor des trekkers eigene
      rekening was getrokken.

      3 Wanneer de trekking voor rekening van eenen derde was gedaan, bestaat de schade in de kosten van protest en
      herwissel, en in het beloop van hetgeen de trekker, uit hoofde van de bekomene toezegging van den belover, aan dien
      derde, op het crediet van den wisselbrief, heeft voorgeschoten.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel127b
  - number: 127c
    text: |-
      De trekker is verplicht aan den betrokkene tijdig kennis of advies te geven van den door hem getrokken wisselbrief,
      en, bij nalatigheid daarvan, gehouden tot vergoeding van de kosten, door weigering van acceptatie of betaling uit
      dien hoofde gevallen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel127c
  - number: 127d
    text: |-
      Indien de wisselbrief voor rekening van eenen derde is getrokken, is deze alleen daarvoor aan den acceptant
      verbonden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel127d
  - number: '128'
    text: |-
      1 Indien de betrokkene zijn op den wisselbrief gestelde acceptatie heeft doorgehaald vóór de teruggave van den
      wisselbrief, wordt de acceptatie geacht te zijn geweigerd. Behoudens tegenbewijs wordt de doorhaling geacht te zijn
      geschied vóór de teruggave van den wisselbrief.

      2 Indien echter de betrokkene van zijne acceptatie schriftelijk heeft doen blijken aan den houder of aan iemand,
      wiens handteekening op den wisselbrief voorkomt, is hij tegenover dezen gehouden overeenkomstig den inhoud van
      zijne acceptatie.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel128
  - number: '129'
    text: |-
      1 De betaling van eenen wisselbrief kan voor het geheel of een gedeelte van de wisselsom door eenen borgtocht
      (aval) worden verzekerd.

      2 Deze borgtocht kan door eenen derde, of zelfs door iemand, wiens handteekening op den wisselbrief voorkomt,
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel129
  - number: '130'
    text: |-
      1 Het aval wordt op den wisselbrief of op een verlengstuk gesteld.

      2 Het wordt uitgedrukt door de woorden: "goed voor aval" of door een soortgelijke uitdrukking; het wordt door den
      avalgever onderteekend.

      3 De enkele handteekening van den avalgever, gesteld op de voorzijde van den wisselbrief, geldt als aval, behalve
      wanneer de handteekening die is van den betrokkene of van den trekker.

      4 Het kan ook geschieden bij een afzonderlijk geschrift of bij een brief, vermeldende de plaats, waar het is
      gegeven.

      5 In het aval moet worden vermeld, voor wien het is gegeven. Bij gebreke hiervan wordt het geacht voor den trekker
      te zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel130
  - number: '131'
    text: |-
      1 De avalgever is op dezelfde wijze verbonden als degenen, voor wien het aval is gegeven.

      2 Zijne verbintenis is geldig, zelfs indien, wegens een andere oorzaak dan een vormgebrek, de door hem gewaarborgde
      verbintenis nietig is.

      3 Door te betalen verkrijgt de avalgever de rechten, welke krachtens den wisselbrief kunnen worden uitgeoefend
      tegen dengene, voor wien het aval is gegeven en tegen degenen, die tegenover dezen krachtens den wisselbrief
      verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel131
  - number: '132'
    text: |-
      1 Een wisselbrief kan worden getrokken:

      op zicht;

      op een zekeren tijd na zicht;

      op een zekeren tijd na dagteekening;

      op een bepaalden dag.

      2 Wisselbrieven met anders bepaalde vervaldagen of in termijnen betaalbaar zijn nietig.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel132
  - number: '133'
    text: |-
      1 De wisselbrief, getrokken op zicht, is betaalbaar bij de aanbieding. Hij moet ter betaling worden aangeboden
      binnen een jaar na zijne dagteekening. De trekker kan dezen termijn verkorten of verlengen. De endossanten kunnen
      deze termijnen verkorten.

      2 De trekker kan voorschrijven, dat een wisselbrief niet ter betaling mag worden aangeboden vóór een bepaalden dag.
      In dat geval loopt de termijn van aanbieding van dien dag af.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel133
  - number: '134'
    text: |-
      1 De vervaldag van eenen wisselbrief, getrokken op een zekeren tijd na zicht, wordt bepaald, hetzij door de
      dagteekening der acceptatie, hetzij door die van het protest.

      2 Bij gebreke van protest wordt de niet-gedagteekende acceptatie ten aanzien van den acceptant geacht te zijn
      gedaan op den laatsten dag van den termijn, voor de aanbieding ter acceptatie voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel134
  - number: '135'
    text: |-
      1 De wisselbrief, getrokken op een of meer maanden na dagteekening of na zicht, vervalt op den overeenkomstigen dag
      van de maand, waarin de betaling moet worden gedaan. Bij gebreke van een overeenkomstigen dag vervalt een zoodanige
      wisselbrief op den laatsten dag van die maand.

      2 Bij eenen wisselbrief, getrokken op een of meer maanden en een halve maand na dagteekening of na zicht, worden
      eerst de geheele maanden gerekend.

      3 Is de vervaldag bepaald op het begin, het midden (half Januari, half Februari enz.) of op het einde van eene
      maand, dan wordt onder die uitdrukkingen verstaan: de eerste, de vijftiende, de laatste van die maand.

      4 Onder de uitdrukkingen: "acht dagen", "vijftien dagen", moet worden verstaan niet ééne of twee weken, maar een
      termijn van acht of van vijftien dagen.

      5 De uitdrukking "halve maand" duidt eenen termijn van vijftien dagen aan.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel135
  - number: '136'
    text: |-
      1 De vervaldag van eenen wisselbrief, betaalbaar op een bepaalden dag, in eene plaats, waar de tijdrekening een
      andere is dan die van de plaats van uitgifte, wordt geacht te zijn vastgesteld volgens de tijdrekening van de
      plaats van betaling.

      2 De dag van uitgifte van eenen wisselbrief, getrokken tusschen twee plaatsen met verschillende tijdrekening en
      betaalbaar een zekeren tijd na dagteekening, wordt herleid tot den overeenkomstigen dag van de tijdrekening van de
      plaats van betaling en de vervaldag wordt dienovereenkomstig vastgesteld.

      3 De termijnen van aanbieding der wisselbrieven worden berekend overeenkomstig de bepalingen van het voorgaande
      lid.

      4 Dit artikel is niet van toepassing, indien uit eene in den wisselbrief opgenomen clausule of uit zijne
      bewoordingen een afwijkende bedoeling kan worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel136
  - number: '137'
    text: |-
      1 De houder van eenen wisselbrief, betaalbaar op een bepaalden dag of een zekeren tijd na dagteekening of na zicht,
      moet dezen ter betaling aanbieden, hetzij den dag, waarop hij betaalbaar is, hetzij eenen der twee daaropvolgende
      werkdagen.

      2 De aanbieding van eenen wisselbrief aan eene verrekeningskamer geldt als aanbieding ter betaling. Bij
      algemeenen maatregel van bestuur zullen de instellingen worden aangewezen, die in den zin van dezen Titel als
      verrekeningskamers worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel137
  - number: '138'
    text: |-
      1 Buiten het geval, in [artikel 167b][ref1] vermeld, kan de betrokkene, den wisselbrief betalende, vorderen, dat
      hem deze, van behoorlijke kwijting van den houder voorzien, wordt uitgeleverd.

      2 De houder mag niet weigeren een gedeeltelijke betaling aan te nemen.

      3 In geval van gedeeltelijke betaling kan de betrokkene vorderen, dat van die betaling op den wisselbrief melding
      wordt gemaakt en dat hem daarvoor kwijting wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel167b
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 167b
        paragraaf: '3'
        afdeling: Negende
  - number: '139'
    text: |-
      1 De houder van eenen wisselbrief kan niet genoodzaakt worden, vóór den vervaldag betaling te ontvangen.

      2 De betrokkene, die vóór den vervaldag betaalt, doet zulks op eigen verantwoordelijkheid.

      3 Hij, die op den vervaldag betaalt, is deugdelijk gekweten, mits er zijnerzijds geen bedrog plaats heeft of grove
      schuld aanwezig is. Hij is gehouden, de regelmatigheid van de reeks van endossementen, maar niet de handteekening
      der endossanten te onderzoeken.

      4 Indien hij, niet bevrijdend betaald hebbende, verplicht wordt, ten tweede male te betalen, heeft hij verhaal op
      allen die de wissel niet te goeder trouw hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel139
  - number: '140'
    text: |-
      1 Een wisselbrief, waarvan de betaling is bedongen in ander geld dan dat van de plaats van betaling, kan worden
      betaald in het geld van het land volgens zijne waarde op den vervaldag. Indien de schuldenaar in gebreke is, kan de
      houder te zijner keuze vorderen, dat de wisselsom betaald wordt in het geld van het land volgens den koers, hetzij
      van den vervaldag, hetzij van den dag van betaling.

      2 De waarde van het vreemde geld wordt bepaald volgens de gebruiken van de plaats van betaling. De trekker kan
      echter voorschrijven, dat het te betalen bedrag moet worden berekend volgens een in den wisselbrief voorgeschreven
      koers.

      3 Het bovenstaande is niet van toepassing, indien de trekker heeft voorgeschreven, dat de betaling moet geschieden
      in een bepaald aangeduid geld (clausule van werkelijke betaling in vreemd geld).

      4 Indien het bedrag van den wisselbrief is aangegeven in geld, hetwelk dezelfde benaming, maar eene verschillende
      waarde heeft in het land van uitgifte en in dat van betaling, wordt men vermoed het geld van de plaats van betaling
      te hebben bedoeld.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel140
  - number: '141'
    text: |-
      Bij gebreke van aanbieding ter betaling van den wisselbrief binnen den termijn, bij [artikel 137][ref1]
      vastgesteld, heeft elke schuldenaar de bevoegdheid, het bedrag te bevoegder plaatse in consignatie te geven, op
      kosten en onder verantwoordelijkheid van den houder.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel137
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '137'
        afdeling: Zesde
  - number: '142'
    text: |-
      1 De houder kan zijn recht van regres op de endossanten, den trekker en de andere wisselschuldenaren uitoefenen:

      Op den vervaldag:

      indien de betaling niet heeft plaats gehad;

      2 Zelfs vóór den vervaldag:

      1°. indien de acceptatie geheel of gedeeltelijk is geweigerd;

      2°. in geval van faillissement van den betrokkene, al of niet acceptant, of het ten aanzien van hem van toepassing
      verklaren van de schuldsaneringsregeling natuurlijke personen en van het oogenblik af, waarop eene hem verleende
      surséance van betaling is ingegaan;

      3°. in geval van faillissement van den trekker of het ten aanzien van hem van toepassing verklaren van de
      schuldsaneringsregeling natuurlijke personen van een niet voor acceptatie vatbaren wisselbrief.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel142
  - number: '143'
    text: |-
      1 De weigering van acceptatie of van betaling moet worden vastgesteld bij authentieke acte (protest van non-
      acceptatie of van non-betaling).

      2 Het protest van non-acceptatie moet worden opgemaakt binnen de termijnen, voor de aanbieding ter acceptatie
      vastgesteld. Indien, in het geval bij [artikel 123, lid 1][ref1], voorzien, de eerste aanbieding heeft plaats gehad
      op den laatsten dag van den termijn, kan het protest nog op den volgenden dag worden gedaan.

      3 Het protest van non-betaling van eenen wisselbrief, betaalbaar op een bepaalden dag of zekeren tijd na
      dagteekening of na zicht, moet worden gedaan op éénen der twee werkdagen, volgende op den dag, waarop de
      wisselbrief betaalbaar is. Indien het eenen wisselbrief, betaalbaar op zicht, betreft, moet het protest worden
      gedaan, overeenkomstig de bepalingen bij het voorgaande lid vastgesteld voor het opmaken van het protest van non-
      acceptatie.

      4 Het protest van non-acceptatie maakt de aanbieding ter betaling en het protest van non-betaling overbodig.

      5 In geval van benoeming van bewindvoerders op verzoek van den betrokkene, al of niet acceptant, tot surséance
      van betaling kan de houder zijn recht van regres niet uitoefenen, dan nadat de wisselbrief ter betaling aan den
      betrokkene is aangeboden en protest is opgemaakt.

      6 Indien de betrokkene, al of niet acceptant, is failliet verklaard, of indien de trekker van eenen wisselbrief,
      welke niet vatbaar is voor acceptatie, is failliet verklaard, kan de houder, voor de uitoefening van zijn recht van
      regres, volstaan met overlegging van het vonnis, waarbij het faillissement is uitgesproken.

      7 Het zesde lid is van overeenkomstige toepassing indien de schuldsaneringsregeling natuurlijke personen van
      toepassing is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel123
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '123'
        afdeling: Derde
  - number: 143a
    text: |-
      1 De betaling van eenen wisselbrief moet gevraagd en het daarop volgende protest gedaan worden ter woonplaats van
      den betrokkene.

      2 Indien de wisselbrief getrokken is om in eene andere aangewezene woonplaats of door eenen anderen aangewezen
      persoon, hetzij in dezelfde, hetzij in eene andere gemeente te worden betaald, moet de betaling gevraagd en het
      protest opgemaakt worden ter aangewezene woonplaats of aan den aangewezen persoon.

      3 [Artikel 54 van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel54
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel143a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '54'
  - number: 143b
    text: |-
      1 De protesten, zowel van non-acceptatie als van non-betaling, worden gedaan door een deurwaarder. Deze kan zich
      desverkiezende doen vergezellen door een of twee getuigen.

      2 De protesten behelzen:

      1°. een letterlijk afschrift van den wisselbrief, van de acceptatie, van de endossementen, van het aval en van de
      adressen daarop gesteld;

      2°. de vermelding dat zij de acceptatie of betaling aan de personen, of ter plaatse in het voorgaand artikel
      gemeld, afgevraagd en niet bekomen hebben;

      3°. de vermelding van de opgegevene reden van non-acceptatie of non-betaling;

      4°. de aanmaning om het protest te teekenen, en de redenen van weigering;

      5°. de vermelding, dat hij, deurwaarder, wegens die non-acceptatie of non-betaling heeft geprotesteerd.

      3 Indien het protest een vermisten wisselbrief betreft, volstaat, in plaats van het bepaalde onder 1°. van het
      voorgaande lid, eene zoo nauwkeurig mogelijke omschrijving van den inhoud des wisselbriefs.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel143b
  - number: 143c
    text: |-
      De deurwaarders zijn verplicht, op straffe van schadevergoeding, afschrift van het protest te laten, en hiervan
      melding in het afschrift te maken, en hetzelve, naar orde des tijds, in te schrijven in een bijzonder register,
      genommerd en gewaarmerkt door de kantonrechter van de rechtbank van het arrondissement waarin hun woonplaats is
      gelegen, en om wijders, zulks begeerd wordende, een of meer afschriften van het protest aan de belanghebbenden
      te leveren.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel143c
  - number: 143d
    text: |-
      Als protest van non-acceptatie, onderscheidenlijk van non-betaling geldt de door dengene, aan wien de acceptatie
      of de betaling wordt afgevraagd, met toestemming van den houder op den wisselbrief gestelde, gedagteekende en
      onderteekende verklaring, dat hij dezelve weigert, tenzij de trekker heeft aangeteekend, dat hij een authentiek
      protest verlangt.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel143d
  - number: '144'
    text: |-
      1 De houder moet van de non-acceptatie of van de non-betaling kennis geven aan zijnen endossant en aan den trekker
      binnen de vier werkdagen, volgende op den dag van het protest of, indien de wisselbrief getrokken is met de
      clausule zonder kosten, volgende op dien der aanbieding. Elke endossant moet binnen de twee werkdagen, volgende
      op den dag van ontvangst der kennisgeving, de door hem ontvangen kennisgeving aan zijnen endossant mededeelen,
      met aanwijzing van de namen en adressen van degenen, die de voorafgaande kennisgevingen hebben gedaan, en zoo
      vervolgens, teruggaande tot den trekker. Deze termijnen loopen van de ontvangst der voorafgaande kennisgeving af.

      2 Indien overeenkomstig het voorgaande lid eene kennisgeving is gedaan aan iemand, wiens handteekening op den
      wisselbrief voorkomt, moet gelijke kennisgeving binnen denzelfden termijn aan diens avalgever worden gedaan.

      3 Indien een endossant zijn adres niet of op onleesbare wijze heeft aangeduid, kan worden volstaan met kennisgeving
      aan den voorafgaanden endossant.

      4 Hij, die eene kennisgeving heeft te doen, kan zulks doen in iederen vorm, zelfs door enkele terugzending van
      den wisselbrief.

      5 Hij moet bewijzen, dat hij de kennisgeving binnen den vastgestelden termijn heeft gedaan. Deze termijn wordt
      gehouden te zijn in acht genomen, wanneer een brief, die de kennisgeving behelst, binnen den genoemden termijn ter
      post is bezorgd.

      6 Hij, die de kennisgeving niet binnen den bovenvermelden termijn doet, stelt zich niet bloot aan verval van
      zijn recht; hij is, indien daartoe aanleiding bestaat, verantwoordelijk voor de schade, door zijne nalatigheid
      veroorzaakt, zonder dat echter de schadevergoeding de wisselsom kan te boven gaan.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel144
  - number: '145'
    text: |-
      1 De trekker, een endossant of een avalgever kan, door de clausule "zonder kosten", "zonder protest", of een andere
      soortgelijke op den wisselbrief gestelde en onderteekende clausule, den houder van het opmaken van een protest van
      non-acceptatie of van non-betaling, ter uitoefening van zijn recht van regres, ontslaan.

      2 Deze clausule ontslaat den houder niet van de aanbieding van den wisselbrief binnen de voorgeschreven termijnen,
      noch van het doen van de kennisgevingen. Het bewijs van de niet-inachtneming der termijnen moet worden geleverd
      door dengene, die zich daarop tegenover den houder beroept.

      3 Is de clausule door den trekker gesteld, dan heeft zij gevolgen ten aanzien van allen, wier handteekeningen op
      den wisselbrief voorkomen; is zij door eenen endossant of door eenen avalgever gesteld, dan heeft zij gevolgen
      alleen voor dezen endossant of avalgever. Indien de houder, ondanks de door den trekker gestelde clausule, toch
      protest doet opmaken, zijn de kosten daarvan voor zijne rekening. Indien de clausule van eenen endossant of eenen
      avalgever afkomstig is, kunnen de kosten van het protest, indien dit is opgemaakt, op allen, wier handteekeningen
      op den wisselbrief voorkomen, worden verhaald.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel145
  - number: '146'
    text: |-
      1 Allen, die eenen wisselbrief hebben getrokken, geaccepteerd, geëndosseerd, of voor aval geteekend, zijn
      hoofdelijk tegenover den houder verbonden. Bovendien is ook de derde, voor wiens rekening de wisselbrief is
      getrokken en die de waarde daarvoor heeft genoten, jegens den houder aansprakelijk.

      2 De houder kan deze personen, zoowel ieder afzonderlijk, als gezamenlijk, aanspreken, zonder verplicht te zijn de
      volgorde, waarin zij zich hebben verbonden, in acht te nemen.

      3 Hetzelfde recht komt toe aan ieder, wiens handteekening op den wisselbrief voorkomt en die dezen, ter voldoening
      aan zijnen regresplicht, heeft betaald.

      4 De vordering, ingesteld tegen éénen der wisselschuldenaren, belet niet de anderen aan te spreken, al hadden dezen
      zich later verbonden dan de eerst aangesprokene.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel146
  - number: 146a
    text: |-
      1 De houder van eenen geprotesteerden wisselbrief heeft in geen geval eenig recht op het fonds, dat de betrokkene
      van den trekker in handen heeft.

      2 Indien de wisselbrief niet is geaccepteerd, behooren die penningen, bij faillissement van den trekker of indien
      ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, aan diens boedel.

      3 In geval van acceptatie, blijft het fonds, tot het beloop van den wisselbrief, aan den betrokkene, behoudens de
      verplichting van dezen om jegens den houder aan zijne acceptatie te voldoen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel146a
  - number: '147'
    text: |-
      1 De houder kan van dengene, tegen wien hij zijn recht van regres uitoefent, vorderen:

      1°. de som van den niet-geaccepteerden of niet betaalden wisselbrief met de rente, zoo deze bedongen is;

      2°. de wettelijke rente, te rekenen van de vervaldag, voor wissels die in Nederland uitgegeven en betaalbaar zijn,
      en een rente van zes ten honderd, te rekenen van de vervaldag, voor alle overige wissels;

      3°. de kosten van protest, die van de gedane kennisgevingen alsmede de andere kosten.

      2 Zoo de uitoefening van het recht van regres vóór den vervaldag plaats heeft, wordt op de wisselsom eene korting
      toegepast. Deze korting wordt berekend volgens het officiëele disconto (bankdisconto), geldende ter woonplaats van
      den houder, op den dag van de uitoefening van het recht van regres.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel147
  - number: '148'
    text: |-
      Hij, die ter voldoening aan zijnen regresplicht den wisselbrief heeft betaald, kan van degenen, die tegenover hem
      regresplichtig zijn, vorderen:

      1°. het geheele bedrag, dat hij betaald heeft;

      2°. de wettelijke rente, te rekenen van de dag der betaling, voor wissels die in Nederland uitgegeven en betaalbaar
      zijn, en een rente van zes ten honderd, te rekenen van de dag der betaling, voor alle overige wissels;

      3°. de door hem gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel148
  - number: '149'
    text: |-
      1 Elke wisselschuldenaar, tegen wien het recht van regres wordt of kan worden uitgeoefend, kan, tegen betaling
      ter voldoening aan zijnen regresplicht, de afgifte vorderen van den wisselbrief met het protest, alsmede een voor
      voldaan geteekende rekening.

      2 Elke endossant, die ter voldoening aan zijnen regresplicht den wisselbrief heeft betaald, kan zijn endossement en
      dat van de volgende endossanten doorhalen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel149
  - number: '150'
    text: |-
      Bij gedeeltelijke acceptatie kan degene, die ter voldoening aan zijnen regresplicht het niet geaccepteerde gedeelte
      van de wisselsom heeft betaald, vorderen, dat die betaling op den wisselbrief wordt vermeld en dat hem daarvan
      kwijting wordt gegeven. De houder moet hem daarenboven uitleveren een voor eensluidend geteekend afschrift van den
      wisselbrief, alsmede het protest, om hem de uitoefening van zijn verdere regresrechten mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel150
  - number: '151'
    text: |-
      1 Ieder, die een recht van regres kan uitoefenen, kan, tenzij het tegendeel bedongen is, zich de vergoeding
      bezorgen door middel van een nieuwen wisselbrief (herwissel), getrokken op zicht op éénen van degenen, die
      tegenover hem regresplichtig zijn en betaalbaar te diens woonplaats.

      2 De herwissel omvat, behalve de bedragen in de [artikelen 147][ref1] en [148][ref2] aangegeven, de bedragen van
      provisie en het zegel van den herwissel.

      3 Indien de herwissel door den houder is getrokken, wordt het bedrag bepaald volgens den koers van eenen
      zichtwissel, getrokken van de plaats, waar de oorspronkelijke wisselbrief betaalbaar was, op de woonplaats van
      den regresplichtige. Indien de herwissel is getrokken door eenen endossant, wordt het bedrag bepaald volgens den
      koers van eenen zichtwissel, getrokken van de woonplaats van den trekker van den herwissel op de woonplaats van
      den regresplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel147
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel148
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel151
