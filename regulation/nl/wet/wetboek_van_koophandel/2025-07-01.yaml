  - number: '152'
    text: |-
      1 Na afloop van de termijnen vastgesteld:

      voor de aanbieding van eenen wisselbrief getrokken op zicht of zekeren tijd na zicht;

      voor het opmaken van het protest van non-acceptatie of van non-betaling;

      voor de aanbieding ter betaling in geval van beding zonder kosten,

      vervalt het recht van den houder tegen de endossanten, tegen den trekker, en tegen de andere wisselschuldenaren,
      met uitzondering van den acceptant.

      2 Bij gebreke van aanbieding ter acceptatie binnen den door den trekker voorgeschreven termijn, vervalt het recht
      van regres van den houder, zoowel wegens non-betaling als wegens non-acceptatie, tenzij uit de bewoordingen van den
      wisselbrief blijkt, dat de trekker zich slechts heeft willen bevrijden van zijne verplichting, voor de acceptatie
      in te staan.

      3 Indien de bepaling van eenen termijn voor de aanbieding in een endossement is vervat, kan alleen de endossant
      daarop een beroep doen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel152
  - number: 152a
    text: |-
      1 De wisselbrief van non-acceptatie of van non-betaling zijnde geprotesteerd, is niettemin de trekker, al ware
      het protest niet intijds gedaan, tot vrijwaring gehouden, tenzij hij bewees, dat de betrokkene op den vervaldag
      het noodige fonds tot betaling des wisselbriefs in handen had. Indien het vereischte fonds slechts gedeeltelijk
      aanwezig was, is de trekker voor het ontbrekende gehouden.

      2 Was de wisselbrief niet geaccepteerd, dan is, ingeval van niet tijdig protest, de trekker, op straffe van tot
      vrijwaring te zijn gehouden, verplicht, den houder af te staan en over te dragen de vordering op het fonds, dat de
      betrokkene van hem ten vervaldage heeft in handen gehad, en zulks tot het beloop van den wisselbrief; en hij moet
      aan den houder, te diens koste, de noodige bewijzen verschaffen om die vordering te doen gelden. Indien de trekker
      in staat van faillissement is verklaard of ten aanzien van hem de schuldsaneringsregeling natuurlijke personen
      van toepassing is verklaard, zijn de curatoren onderscheidenlijk de bewindvoerders in zijnen boedel tot dezelfde
      verplichtingen gehouden, ten ware deze mochten verkiezen, den houder als schuldeischer, voor het beloop van den
      wisselbrief, toe te laten.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel152a
  - number: '153'
    text: |-
      1 Wanneer de aanbieding van den wisselbrief of het opmaken van het protest binnen de voorgeschreven termijnen wordt
      verhinderd door een onoverkomelijk beletsel (wettelijk voorschrift van eenigen Staat of ander geval van overmacht),
      worden deze termijnen verlengd.

      2 De houder is verplicht, van de overmacht onverwijld aan zijnen endossant kennis te geven, en deze kennisgeving
      gedagteekend en onderteekend op den wisselbrief of op een verlengstuk te vermelden; voor het overige zijn de
      bepalingen van [artikel 144][ref1] toepasselijk.

      3 Na het ophouden van de overmacht moet de houder onverwijld den wisselbrief ter acceptatie of ter betaling
      aanbieden en, indien daartoe aanleiding bestaat, protest doen opmaken.

      4 Indien de overmacht meer dan dertig dagen, te rekenen van den vervaldag, aanhoudt, kan het recht van regres
      worden uitgeoefend, zonder dat de aanbieding of het opmaken van protest noodig is.

      5 Voor wisselbrieven, getrokken op zicht of op zekeren tijd na zicht, loopt de termijn van dertig dagen van den
      dag, waarop de houder, al ware het vóór het einde van den aanbiedingstermijn, van de overmacht aan zijnen endossant
      heeft kennis gegeven; voor wisselbrieven, getrokken op zekeren tijd na zicht, wordt de termijn van dertig dagen
      verlengd met den zichttermijn, in den wisselbrief aangegeven.

      6 Feiten, welke voor den houder, of voor dengene, dien hij met de aanbieding van den wisselbrief of met het opmaken
      van het protest belastte, van zuiver persoonlijken aard zijn, worden niet beschouwd als gevallen van overmacht.


