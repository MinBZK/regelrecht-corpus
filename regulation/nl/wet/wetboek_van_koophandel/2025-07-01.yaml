  - number: '178'
    text: |-
      De chèque behelst:

      1°. de benaming "chèque", opgenomen in den tekst zelf en uitgedrukt in de taal, waarin de titel is gesteld;

      2°. de onvoorwaardelijke opdracht tot betaling van een bepaalde som;

      3°. den naam van dengene, die betalen moet (betrokkene);

      4°. de aanwijzing van de plaats, waar de betaling moet geschieden;

      5°. de vermelding van de dagteekening, alsmede van de plaats, waar de chèque is getrokken;

      6°. de handteekening van dengene, die de chèque uitgeeft (trekker).
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel178
  - number: '179'
    text: |-
      1 De titel, waarin ééne der vermeldingen, in het voorgaande artikel aangegeven, ontbreekt, geldt niet als chèque,
      behoudens in de hieronder genoemde gevallen.

      2 Bij gebreke van een bijzondere aanwijzing, wordt de plaats, aangegeven naast den naam van den betrokkene, geacht
      te zijn de plaats van betaling. Indien meerdere plaatsen zijn aangegeven naast den naam van den betrokkene, is de
      chèque betaalbaar op de eerstaangegeven plaats.

      3 Bij gebreke van die aanwijzingen of van iedere andere aanwijzing, is de chèque betaalbaar in de plaats, waar het
      hoofdkantoor van den betrokkene is gevestigd.

      4 De chèque, welke niet de plaats aanwijst, waar zij is getrokken, wordt geacht te zijn onderteekend in de plaats,
      aangegeven naast den naam des trekkers.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel179
  - number: '180'
    text: |-
      De chèque moet worden getrokken op eenen bankier, die fonds onder zich heeft ter beschikking van den trekker, en
      krachtens een uitdrukkelijke of stilzwijgende overeenkomst, volgens welke de trekker het recht heeft per chèque
      over dat fonds te beschikken. In geval van niet-inachtneming van die voorschriften blijft de titel echter als
      chèque geldig.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel180
  - number: '181'
    text: |-
      De chèque kan niet worden geaccepteerd. Eene vermelding van acceptatie, op de chèque gesteld, wordt voor niet
      geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel181
  - number: '182'
    text: |-
      1 De chèque kan betaalbaar worden gesteld:

      aan een met name genoemden persoon, met of zonder uitdrukkelijke clausule: "aan order";

      aan een met name genoemden persoon, met de clausule: "niet aan order", of een soortgelijke clausule;

      aan toonder.

      2 De chèque, betaalbaar gesteld aan een met name genoemden persoon, met de vermelding: "of aan toonder", of een
      soortgelijke uitdrukking, geldt als chèque aan toonder.

      3 De chèque zonder vermelding van den nemer geldt als chèque aan toonder.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel182
  - number: '183'
    text: |-
      1 De chèque kan aan de order van den trekker luiden.

      2 De chèque kan worden getrokken voor rekening van eenen derde. De trekker wordt geacht voor zijn eigene rekening
      te hebben getrokken, indien uit de chèque of uit den adviesbrief niet blijkt, voor wiens rekening zulks is
      geschied.

      3 De chèque kan op den trekker zelf getrokken worden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel183
  - number: 183a
    text: |-
      1 Wanneer de trekker op de chèque de vermelding "waarde ter incasseering", "ter incasso", "in lastgeving" of eenige
      andere vermelding, met zich brengend een bloote opdracht tot inning, heeft geplaatst, kan de nemer alle uit de
      chèque voortvloeiende rechten uitoefenen, maar hij kan deze niet anders overdragen dan bijwege van lastgeving.

      2 Bij een zoodanige chèque kunnen de chèqueschuldenaren aan den houder slechts de verweermiddelen tegenwerpen,
      welke aan den trekker zouden kunnen worden tegengeworpen.

      3 De opdracht, vervat in een incasso-chèque, eindigt niet door dood of latere onbekwaamheid van den lastgever.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel183a
  - number: '184'
    text: Eene in de chèque opgenomen renteclausule wordt voor niet geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel184
  - number: '185'
    text: |-
      De chèque kan betaalbaar zijn aan de woonplaats van eenen derde, hetzij in de plaats, waar de betrokkene zijn
      domicilie heeft, hetzij in een andere plaats.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel185
  - number: '186'
    text: |-
      1 De chèque, waarvan het bedrag voluit in letters en tevens in cijfers is geschreven, geldt, in geval van verschil,
      ten beloope van de som, voluit in letters geschreven.

      2 De chèque, waarvan het bedrag meermalen is geschreven, hetzij voluit in letters, hetzij in cijfers, geldt, in
      geval van verschil, slechts ten beloope van de kleinste som.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel186
  - number: '187'
    text: |-
      Indien de chèque handteekeningen bevat van personen, die onbekwaam zijn zich door middel van een chèque te
      verbinden, valsche handteekeningen of handteekeningen van verdichte personen, of handteekeningen, welke,
      onverschillig om welke andere reden, de personen, die die handteekeningen hebben geplaatst of in wier naam zulks
      is geschied, niet kunnen verbinden, zijn de verbintenissen der andere personen, wier handteekeningen op de chèque
      voorkomen, desniettemin geldig.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel187
  - number: '188'
    text: |-
      Ieder, die zijne handteekening op eene chèque plaatst als vertegenwoordiger van eenen persoon, voor wien hij
      niet de bevoegdheid had te handelen, is zelf krachtens de chèque verbonden, en heeft, betaald hebbende, dezelfde
      rechten, als de beweerde vertegenwoordigde zou hebben gehad. Hetzelfde geldt ten aanzien van den vertegenwoordiger,
      die zijne bevoegdheid heeft overschreden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel188
  - number: '189'
    text: |-
      De trekker staat in voor de betaling. Elke clausule, waarbij hij deze verplichting uitsluit, wordt voor niet
      geschreven gehouden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel189
  - number: '190'
    text: |-
      Indien eene chèque, onvolledig ten tijde der uitgifte, is volledig gemaakt in strijd met de aangegane
      overeenkomsten, kan de niet-naleving van die overeenkomsten niet worden tegengeworpen aan den houder, die de cheque
      te goeder trouw heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel190
  - number: 190a
    text: |-
      De trekker, of degene voor wiens rekening de chèque is getrokken, is verplicht zorg te dragen dat het noodige fonds
      tot betaling op den dag der aanbieding in handen van den betrokkene zij, zelfs indien de chèque bij eenen derde is
      betaalbaar gesteld, onverminderd de verplichting van den trekker overeenkomstig [artikel 189][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel189
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel190a
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '189'
        afdeling: Eerste
  - number: 190b
    text: |-
      De betrokkene wordt geacht, het noodige fonds in handen te hebben, indien hij bij de aanbieding van de chèque
      aan den trekker of aan dengene voor wiens rekening is getrokken, een opeischbare som schuldig is, ten minste
      gelijkstaande met het beloop van de chèque.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel190b
  - number: '191'
    text: |-
      1 De chèque, die betaalbaar is gesteld aan een met name genoemden persoon met of zonder uitdrukkelijke clausule:
      "aan order", kan door middel van endossement worden overgedragen.

      2 De chèque, die betaalbaar is gesteld aan een met name genoemden persoon met de clausule: "niet aan order", of een
      soortgelijke clausule, kan slechts worden overgedragen in den vorm en met de gevolgen van een gewone cessie. Een op
      zulk een chèque geplaatst endossement geldt als een gewone cessie.

      3 Het endossement kan worden gesteld zelfs ten voordeele van den trekker of van iederen anderen chèqueschuldenaar.
      Deze personen kunnen de chèque opnieuw endosseeren.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel191
  - number: '192'
    text: |-
      1 Het endossement moet onvoorwaardelijk zijn. Elke daarin opgenomen voorwaarde wordt voor niet geschreven gehouden.

      2 Het gedeeltelijke endossement is nietig.

      3 Eveneens is nietig het endossement van den betrokkene.

      4 Het endossement aan toonder geldt als endossement in blanco.

      5 Het endossement aan den betrokkene geldt slechts als kwijting, behoudens wanneer de betrokkene meer kantoren
      heeft en wanneer het endossement is gesteld ten voordeele van een ander kantoor dan dat, waarop de chèque is
      getrokken.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel192
  - number: '193'
    text: |-
      1 Het endossement moet gesteld worden op de chèque of op een vastgehecht blad (verlengstuk). Het moet worden
      onderteekend door den endossant.

      2 Het endossement kan den geëndosseerde onvermeld laten, of bestaan uit de enkele handteekening van den endossant
      (endossement in blanco). In het laatste geval moet het endossement om geldig te zijn, op de rugzijde van de chèque
      of op het verlengstuk worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel193
  - number: '194'
    text: |-
      1 Door het endossement worden alle uit de chèque voortvloeiende rechten overgedragen.

      2 Indien het endossement in blanco is, kan de houder:

      1°. het blanco invullen, hetzij met zijn eigen naam, hetzij met den naam van een anderen persoon;

      2°. de chèque wederom in blanco of aan een anderen persoon endosseeren;

      3°. de chèque aan eenen derde overgeven, zonder het blanco in te vullen, en zonder haar te endosseeren.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel194
  - number: '195'
    text: |-
      1 Tenzij het tegendeel bedongen is, staat de endossant in voor de betaling.

      2 Hij kan een nieuw endossement verbieden; in dat geval staat hij tegenover de personen, aan wie de chèque later is
      geëndosseerd, niet in voor de betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel195
  - number: '196'
    text: |-
      Hij, die een door endossement overdraagbare chèque onder zich heeft, wordt beschouwd als de rechtmatige houder,
      indien hij van zijn recht doet blijken door een ononderbroken reeks van endossementen, zelfs indien het laatste
      endossement in blanco is gesteld. De doorgehaalde endossementen worden te dien aanzien voor niet geschreven
      gehouden. Wanneer een endossement in blanco door een ander endossement is gevolgd, wordt de onderteekenaar van dit
      laatste geacht, de chèque door het endossement in blanco verkregen te hebben.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel196
  - number: '197'
    text: |-
      Een op eene chèque aan toonder voorkomend endossement maakt den endossant verantwoordelijk overeenkomstig de
      bepalingen betreffende het recht van regres; het maakt overigens den titel niet tot eene chèque aan order.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel197
  - number: '198'
    text: |-
      Indien iemand, op welke wijze dan ook, het bezit van de chèque heeft verloren, is de houder, in wiens handen de
      chèque zich bevindt, niet verplicht de chèque af te geven, indien hij deze te goeder trouw heeft verkregen en zulks
      onverschillig of het betreft eene chèque aan toonder, dan wel een voor endossement vatbare chèque, ten aanzien van
      welke de houder op de wijze in [artikel 196][ref1] voorzien van zijn recht doet blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel196
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel198
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '196'
        afdeling: Tweede
  - number: '199'
    text: |-
      Zij, die uit hoofde van de chèque worden aangesproken, kunnen de verweermiddelen, gegrond op hun persoonlijke
      verhouding tot den trekker of tot vroegere houders, niet aan den houder tegenwerpen, tenzij deze bij de verkrijging
      van de chèque desbewust ten nadeele van den schuldenaar heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel199
  - number: '200'
    text: |-
      1 Wanneer het endossement de vermelding bevat: "waarde ter incasseering", "ter incasso", "in lastgeving" of
      eenige andere vermelding, met zich brengend een bloote opdracht tot inning, kan de houder alle uit de chèque
      voortvloeiende rechten uitoefenen, maar hij kan deze niet anders endosseeren dan bijwege van lastgeving.

      2 De chèqueschuldenaren kunnen in dat geval aan den houder slechts de verweermiddelen tegenwerpen, welke aan den
      endossant zouden kunnen worden tegengeworpen.

      3 De opdracht, vervat in een incasso-endossement, eindigt niet door den dood of door de latere onbekwaamheid van
      den lastgever.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel200
  - number: '201'
    text: |-
      1 Het endossement, na het protest of de daarmede gelijkstaande verklaring, of na het einde van den
      aanbiedingstermijn op de chèque gesteld, heeft slechts de gevolgen eener gewone cessie.

      2 Behoudens tegenbewijs, wordt het endossement zonder dagteekening geacht te zijn gesteld vóór het protest of de
      daarmede gelijkstaande verklaringen, of vóór het verstrijken van den in het voorgaande lid bedoelden termijn.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel201
  - number: '202'
    text: |-
      1 De betaling van de chèque kan zoowel voor haar geheele bedrag als voor een gedeelte daarvan door eenen borgtocht
      (aval) worden verzekerd.

      2 Deze borgtocht kan door eenen derde, behalve door den betrokkene, of zelfs door iemand, wiens handteekening op de
      chèque voorkomt, worden gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel202
  - number: '203'
    text: |-
      1 Het aval wordt op de chèque of op een verlengstuk gesteld.

      2 Het wordt uitgedrukt door de woorden: "goed voor aval", of door een soortgelijke uitdrukking; het wordt door den
      avalgever onderteekend.

      3 De enkele handteekening van den avalgever, gesteld op de voorzijde van de chèque, geldt als aval, behalve wanneer
      de handteekening die is van den trekker.

      4 Het kan ook geschieden bij een afzonderlijk geschrift of bij een brief, vermeldende de plaats, waar het is
      gegeven.

      5 In het aval moet worden vermeld, voor wien het is gegeven. Bij gebreke hiervan wordt het geacht voor den trekker
      te zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel203
  - number: '204'
    text: |-
      1 De avalgever is op dezelfde wijze verbonden als degene, voor wien het aval is gegeven.

      2 Zijne verbintenis is geldig, zelfs indien, wegens een andere oorzaak dan een vormgebrek de door hem gewaarborgde
      verbintenis nietig is.

      3 Door te betalen verkrijgt de avalgever de rechten, welke krachtens de chèque kunnen worden uitgeoefend tegen
      dengene, voor wien het aval is gegeven en tegen degenen, die tegenover dezen krachtens de chèque verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel204
  - number: '205'
    text: |-
      1 De chèque is betaalbaar op zicht. Elke vermelding van het tegendeel wordt voor niet geschreven gehouden.

      2 De chèque, die ter betaling wordt aangeboden vóór den dag, vermeld als datum van uitgifte, is betaalbaar op den
      dag van de aanbieding.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel205
  - number: '206'
    text: |-
      1 De chèque, die in hetzelfde land uitgegeven en betaalbaar is, moet binnen den termijn van acht dagen ter
      betaling worden aangeboden. Indien echter uit de chèque zelve blijkt, dat zij bestemd is om in een ander land
      te circuleeren, wordt deze termijn verlengd, hetzij tot twintig, hetzij tot zeventig dagen, al naar gelang zij
      bestemd was in hetzelfde of in een ander werelddeel te circuleeren. Te dien aanzien worden de chèques, uitgegeven
      en betaalbaar in een land in Europa en bestemd om te circuleeren in een kustland van de Middellandsche Zee of
      omgekeerd, beschouwd als bestemd om te circuleeren in hetzelfde werelddeel.

      2 De chèque, uitgegeven in het Rijk in Europa en betaalbaar in Nederlandsch-Indië, Suriname of Curaçao, of
      omgekeerd, moet ter betaling aangeboden worden binnen den tijd van zeventig dagen.

      3 De chèque, die uitgegeven is in een ander land dan dat, waar zij betaalbaar is, moet worden aangeboden binnen een
      termijn, hetzij van twintig dagen, hetzij van zeventig dagen, naar gelang de plaats van uitgifte en de plaats van
      betaling gelegen zijn in hetzelfde of in een ander werelddeel.

      4 Te dien aanzien worden de chèques, uitgegeven in een land in Europa en betaalbaar in een kustland van de
      Middellandsche Zee of omgekeerd, beschouwd als uitgegeven en betaalbaar in hetzelfde werelddeel.

      5 De bovengenoemde termijnen beginnen te loopen van den dag, op de chèque als datum van uitgifte vermeld.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel206
  - number: '207'
    text: |-
      De dag van uitgifte van eene chèque, getrokken tusschen twee plaatsen met verschillende tijdrekening, wordt herleid
      tot den overeenkomstigen dag van de tijdrekening van de plaats van betaling.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel207
  - number: '208'
    text: |-
      1 De aanbieding aan eene verrekeningskamer geldt als aanbieding ter betaling.

      2 Bij algemeenen maatregel van bestuur zullen de instellingen worden aangewezen, die in den zin van dezen Titel als
      verrekeningskamers worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel208
  - number: '209'
    text: |-
      1 De herroeping van de chèque is slechts van kracht na het einde van den termijn van aanbieding.

      2 Indien geene herroeping plaats heeft, kan de betrokkene zelfs na het einde van dien termijn betalen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel209
  - number: '210'
    text: |-
      Noch de dood van den trekker, noch zijn na de uitgifte opkomende onbekwaamheid zijn van invloed op de gevolgen van
      de chèque.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel210
  - number: '211'
    text: |-
      1 Buiten het geval, in [artikel 227a][ref1] vermeld, kan de betrokkene de chèque betalende, vorderen, dat hem deze,
      van behoorlijke kwijting van den houder voorzien, wordt uitgeleverd.

      2 De houder mag niet weigeren een gedeeltelijke betaling aan te nemen.

      3 In geval van gedeeltelijke betaling kan de betrokkene vorderen, dat van die betaling op de chèque melding wordt
      gemaakt en dat hem daarvoor kwijting wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel227a
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 227a
        afdeling: Zevende
  - number: '212'
    text: |-
      1 De betrokkene, die een door endossement overdraagbare chèque betaalt, is gehouden de regelmatigheid van de reeks
      van endossementen, maar niet de handteekening der endossanten te onderzoeken.

      2 Indien hij, niet bevrijdend betaald hebbende, verplicht wordt, ten tweede male te betalen, heeft hij verhaal op
      allen die de cheque niet te goeder trouw hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel212
  - number: '213'
    text: |-
      1 Eene chèque, waarvan de betaling is bedongen in ander geld dan dat van de plaats van betaling, kan binnen den
      termijn van aanbieding worden betaald in het geld van het land volgens zijne waarde op den dag van betaling. Indien
      de betaling niet heeft plaats gehad bij de aanbieding, kan de houder te zijner keuze vorderen, dat de chèquesom
      voldaan wordt in het geld van het land volgens den koers, hetzij van den dag van aanbieding, hetzij van den dag
      van betaling.

      2 De waarde van het vreemde geld wordt bepaald volgens de gebruiken van de plaats van betaling. De trekker kan
      echter voorschrijven, dat het te betalen bedrag moet worden berekend volgens een in de chèque voorgeschreven koers.

      3 Het bovenstaande is niet van toepassing, indien de trekker heeft voorgeschreven, dat de betaling moet geschieden
      in een bepaald aangeduid geld (clausule van werkelijke betaling in vreemd geld).

      4 Indien het bedrag van de chèque is aangegeven in geld, hetwelk dezelfde benaming maar een verschillende waarde
      heeft in het land van uitgifte en in dat van betaling, wordt men vermoed het geld van de plaats van betaling te
      hebben bedoeld.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel213
  - number: '214'
    text: |-
      1 De trekker of de houder van eene chèque kan deze kruisen met de in het volgende artikel genoemde gevolgen.

      2 De kruising geschiedt door het plaatsen van twee evenwijdige lijnen op de voorzijde van de chèque. Zij kan
      algemeen zijn of bijzonder.

      3 De kruising is algemeen, indien zij tusschen de twee lijnen geen enkele aanwijzing bevat, of wel de vermelding:
      "bankier", of een soortgelijk woord; zij is bijzonder, indien de naam van eenen bankier voorkomt tusschen de twee
      lijnen.

      4 De algemeene kruising kan worden veranderd in een bijzondere, maar de bijzondere kruising kan niet worden
      veranderd in een algemeene.

      5 De doorhaling van de kruising of van den naam van den aangewezen bankier wordt geacht niet te zijn geschied.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel214
  - number: '215'
    text: |-
      1 Eene chèque met algemeene kruising kan door den betrokkene slechts worden betaald aan eenen bankier of aan eenen
      cliënt van den betrokkene.

      2 Eene chèque met bijzondere kruising kan door den betrokkene slechts worden betaald aan den aangewezen bankier
      of, indien deze de betrokkene is, slechts aan een zijner cliënten. Echter kan de aangegeven bankier de chèque ter
      incasseering aan een anderen bankier overdragen.

      3 Een bankier mag een gekruiste chèque slechts in ontvangst nemen van een van zijne cliënten of van een anderen
      bankier. Hij mag haar niet innen voor rekening van andere personen dan deze.

      4 Een chèque, welke meer dan één bijzondere kruising draagt, mag door den betrokkene slechts worden betaald, indien
      er niet meer dan twee kruisingen zijn, waarvan de ééne strekt tot inning door eene verrekeningskamer.

      5 De betrokkene of de bankier, die de bovenstaande bepalingen niet naleeft, is verantwoordelijk voor de schade tot
      beloop van het bedrag van de chèque.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel215
  - number: '216'
    text: |-
      1 De trekker, alsmede de houder van eene chèque, kan verbieden, dat deze in baar geld betaald wordt door op de
      voorzijde in schuinsche richting te vermelden: "in rekening te brengen", of een soortgelijke uitdrukking op te
      nemen.

      2 In dat geval mag de chèque den betrokkene slechts aanleiding geven tot eene boeking (rekening-courant, giro of
      schuldvergelijking). De boeking geldt als betaling.

      3 De doorhaling van de vermelding: "in rekening te brengen" wordt geacht niet te zijn geschied.

      4 De betrokkene, die de bovenstaande bepalingen niet naleeft, is verantwoordelijk voor de schade tot beloop van het
      bedrag van de chèque.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel216
  - number: '217'
    text: |-
      De houder kan zijn recht van regres uitoefenen op de endossanten, den trekker en de andere chèqueschuldenaren,
      indien de chèque, tijdig aangeboden, niet wordt betaald en indien de weigering van betaling wordt vastgesteld:

      1°. hetzij door een authentieke akte (protest);

      2°. hetzij door eene verklaring van den betrokkene, gedagteekend en geschreven op de chèque onder vermelding van
      den dag van aanbieding;

      3°. hetzij door een gedagteekende verklaring van eene verrekeningskamer, waarbij vastgesteld wordt, dat de chèque
      tijdig aangeboden en niet betaald is.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel217
  - number: 217a
    text: |-
      1 Indien de non-betaling van de chèque door protest of een daarmede gelijkstaande verklaring is vastgesteld, is
      niettemin de trekker, al ware het protest niet in tijds gedaan of de met protest gelijkstaande verklaring niet
      in tijds afgegeven, tot vrijwaring gehouden, tenzij hij bewees, dat de betrokkene op den dag der aanbieding het
      noodige fonds tot betaling van de chèque in handen had. Indien het vereischte fonds slechts gedeeltelijk aanwezig
      was, is de trekker voor het ontbrekende gehouden.

      2 In geval van niet tijdig protest of niet tijdige met protest gelijkstaande verklaring is de trekker, op straffe
      van tot vrijwaring te zijn gehouden, verplicht, den houder af te staan en over te dragen de vordering op het fonds,
      dat de betrokkene van hem op den dag der aanbieding heeft in handen gehad, en zulks tot het beloop van de chèque;
      en hij moet aan den houder, te diens koste, de noodige bewijzen verschaffen om die vordering te doen gelden. Indien
      de trekker in staat van faillissement is verklaard of ten aanzien van hem de schuldsaneringsregeling natuurlijke
      personen van toepassing is verklaard, zijn de curatoren onderscheidenlijk de bewindvoerders in zijnen boedel tot
      dezelfde verplichtingen gehouden, ten ware deze mochten verkiezen, den houder als schuldeischer, voor het beloop
      van de chèque, toe te laten.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel217a
  - number: '218'
    text: |-
      1 Het protest of de daarmede gelijkstaande verklaring moet worden gedaan vóór het einde van den termijn van
      aanbieding.

      2 Indien de aanbieding plaats heeft op den laatsten dag van den termijn, kan het protest of de daarmede
      gelijkstaande verklaring op den eerstvolgenden werkdag worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel218
  - number: 218a
    text: |-
      1 De betaling van eene chèque moet gevraagd en het daaropvolgend protest gedaan worden ter woonplaatse van den
      betrokkene.

      2 Indien de chèque getrokken is om in een andere aangewezen woonplaats of door een anderen aangewezen persoon,
      hetzij in dezelfde, hetzij in een andere gemeente te worden betaald, moet de betaling gevraagd en het protest
      opgemaakt worden ter aangewezene woonplaats of aan den aangewezen persoon.

      3 [Artikel 54 van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel54
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel218a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '54'
  - number: 218b
    text: |-
      1 Het protest van non-betaling wordt gedaan door een deurwaarder. Deze kan zich desverkiezende doen vergezellen
      door een of twee getuigen.

      2 Het protest behelst:

      1°. een letterlijk afschrift van de chèque, van de endossementen, van het aval en van de adressen daarop gesteld;

      2°. de vermelding dat zij de betaling aan de personen, of ter plaatse in het voorgaand artikel gemeld, afgevraagd
      en niet bekomen hebben;

      3°. de vermelding van de opgegeven reden van non-betaling;

      4°. de aanmaning om het protest te teekenen, en de redenen van weigering;

      5°. de vermelding, dat hij, deurwaarder, wegens die non-betaling heeft geprotesteerd.

      3 Indien het protest een vermiste chèque betreft, volstaat, in plaats van het bepaalde onder 1°. van het voorgaande
      lid, een zoo nauwkeurig mogelijke omschrijving van den inhoud der chèque.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel218b
  - number: 218c
    text: |-
      De deurwaarders zijn verplicht, op straffe van schadevergoeding, afschrift van het protest te laten, en hiervan
      melding in het afschrift te maken, en hetzelve, naar orde des tijds, in te schrijven in een bijzonder register,
      genommerd en gewaarmerkt door de kantonrechter van de rechtbank van het arrondissement waarin hun woonplaats is
      gelegen, en om wijders, zulks begeerd wordende, een of meer afschriften van het protest aan de belanghebbenden
      te leveren.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel218c
  - number: '219'
    text: |-
      1 De houder moet van de non-betaling kennisgeven aan zijnen endossant en aan den trekker binnen de vier werkdagen,
      volgende op den dag van het protest of de daarmede gelijkstaande verklaring en, indien de chèque getrokken is met
      de clausule zonder kosten, volgende op dien der aanbieding. Elke endossant moet binnen de twee werkdagen, volgende
      op den dag van ontvangst der kennisgeving, de door hem ontvangen kennisgeving aan zijnen endossant mededeelen,
      met aanwijzing van de namen en adressen van degenen, die de voorafgaande kennisgevingen hebben gedaan, en zoo
      vervolgens, teruggaande tot den trekker. Deze termijnen loopen van de ontvangst der voorafgaande kennisgeving af.

      2 Indien overeenkomstig het voorgaande lid eene kennisgeving is gedaan aan iemand, wiens handteekening op de chèque
      voorkomt, moet gelijke kennisgeving binnen denzelfden termijn aan diens avalgever worden gedaan.

      3 Indien een endossant zijn adres niet of op onleesbare wijze heeft aangeduid, kan worden volstaan met kennisgeving
      aan den voorafgaanden endossant.

      4 Hij, die eene kennisgeving heeft te doen, kan zulks doen in iederen vorm, zelfs door enkele terugzending van
      de chèque.

      5 Hij moet bewijzen, dat hij de kennisgeving binnen den vastgestelden termijn heeft gedaan. Deze termijn wordt
      gehouden te zijn in acht genomen, wanneer een brief, die de kennisgeving behelst, binnen den genoemden termijn ter
      post is bezorgd.

      6 Hij, die de kennisgeving niet binnen den bovenvermelden termijn doet, stelt zich niet bloot aan verval van
      zijn recht, hij is, indien daartoe aanleiding bestaat, verantwoordelijk voor de schade, door zijne nalatigheid
      veroorzaakt, zonder dat echter de schadevergoeding de chèquesom kan te boven gaan.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel219
  - number: '220'
    text: |-
      1 De trekker, een endossant of een avalgever kan door de clausule "zonder kosten", "zonder protest", of een andere
      soortgelijke op de chèque gestelde en onderteekende clausule, den houder van het opmaken van een protest of een
      daarmede gelijkstaande verklaring ter uitoefening van zijn recht van regres ontslaan.

      2 Deze clausule ontslaat den houder niet van de aanbieding van de chèque binnen de voorgeschreven termijnen, noch
      van het doen van de kennisgevingen. Het bewijs van de niet-inachtneming der termijnen moet worden geleverd door
      dengene, die zich daarop tegenover den houder beroept.

      3 Is de clausule door den trekker gesteld, dan heeft zij gevolgen ten aanzien van allen, wier handteekeningen op de
      chèque voorkomen; is zij door eenen endossant of door eenen avalgever gesteld, dan heeft zij gevolgen alleen voor
      dezen endossant of avalgever. Indien de houder, ondanks de door den trekker gestelde clausule, toch de weigering
      van betaling doet vaststellen door protest of een daarmede gelijkstaande verklaring, zijn de kosten daarvan voor
      zijne rekening. Indien de clausule van eenen endossant of eenen avalgever afkomstig is, kunnen de kosten van het
      protest of van de daarmede gelijkstaande verklaring, indien een akte van dien aard is opgesteld, op allen, wier
      handteekeningen op de chèque voorkomen, worden verhaald.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel220
  - number: '221'
    text: |-
      1 Allen, die uit hoofde van eene chèque verbonden zijn, zijn hoofdelijk jegens den houder verbonden. Bovendien is
      ook de derde, voor wiens rekening de chèque is getrokken en die de waarde daarvoor heeft genoten, jegens den houder
      aansprakelijk.

      2 De houder kan deze personen, zoowel ieder afzonderlijk, als gezamenlijk, aanspreken, zonder verplicht te zijn de
      volgorde, waarin zij zich hebben verbonden, in acht te nemen.

      3 Hetzelfde recht komt toe aan ieder, wiens handteekening op de chèque voorkomt en die deze, ter voldoening aan
      zijnen regresplicht, heeft betaald.

      4 De vordering, ingesteld tegen éénen der chèqueschuldenaren, belet niet de anderen aan te spreken, al hadden dezen
      zich later verbonden dan de eerst aangesprokene.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel221
  - number: 221a
    text: |-
      1 De houder van eene chèque, waarvan de non-betaling door protest of een daarmede gelijk staande verklaring is
      vastgesteld, heeft in geen geval eenig recht op het fonds, dat de betrokkene van den trekker in handen heeft.

      2 Bij faillissement van den trekker of indien ten aanzien van hem van de schuldsaneringsregeling natuurlijke
      personen van toepassing is verklaard behooren die penningen aan diens boedel.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel221a
  - number: '222'
    text: |-
      De houder kan van dengene, tegen wien hij zijn recht van regres uitoefent, vorderen:

      1°. de som van de niet betaalde chèque;

      2°. de wettelijke rente, te rekenen van de dag der aanbieding, voor chèques die in Nederland uitgegeven en
      betaalbaar zijn, en een rente van zes ten honderd, te rekenen van de dag der aanbieding, voor alle overige chèques;

      3°. de kosten van protest of van de daarmede gelijkstaande verklaring, die van de gedane kennisgevingen, alsmede de
      andere kosten.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel222
  - number: '223'
    text: |-
      Hij, die ter voldoening aan zijnen regresplicht de chèque heeft betaald, kan van degenen, die tegenover hem
      regresplichtig zijn, vorderen:

      1°. het geheele bedrag, dat hij betaald heeft;

      2°. de wettelijke rente, te rekenen van de dag der betaling, voor chèques die in Nederland uitgegeven en betaalbaar
      zijn, en een rente van zes ten honderd, te rekenen van de dag der betaling, voor alle overige chèques;

      3°. de door hem gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel223
  - number: '224'
    text: |-
      1 Elke chèqueschuldenaar, tegen wien het recht van regres wordt of kan worden uitgeoefend, kan, tegen betaling ter
      voldoening aan zijnen regresplicht, de afgifte vorderen van de chèque met het protest, of de daarmede gelijkstaande
      verklaring, alsmede een voor voldaan geteekende rekening.

      2 Elke endossant, die ter voldoening aan zijnen regresplicht, de chèque heeft betaald, kan zijn endossement en dat
      van de volgende endossanten doorhalen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel224
  - number: '225'
    text: |-
      1 Wanneer de aanbieding van de chèque, het opmaken van het protest, of de daarmede gelijkstaande verklaring, binnen
      de voorgeschreven termijnen wordt verhinderd door een onoverkomelijk beletsel (wettelijk voorschrift van eenigen
      Staat of ander geval van overmacht), worden deze termijnen verlengd.

      2 De houder is verplicht van de overmacht onverwijld aan zijnen endossant kennis te geven, en deze kennisgeving,
      gedagteekend en onderteekend op de chèque of op een verlengstuk te vermelden; voor het overige zijn de bepalingen
      van [artikel 219][ref1] toepasselijk.

      3 Na ophouden van de overmacht moet de houder onverwijld de chèque ter betaling aanbieden, en, indien daartoe
      aanleiding bestaat, de weigering van betaling doen vaststellen door protest of een daarmede gelijkstaande
      verklaring.

      4 Indien de overmacht meer dan vijftien dagen aanhoudt, te rekenen van den dag, waarop de houder, al ware het vóór
      het einde van den aanbiedingstermijn, van de overmacht aan zijnen endossant heeft kennis gegeven, kan het recht
      van regres worden uitgeoefend, zonder dat de aanbieding of het opmaken van protest of de daarmede gelijkstaande
      verklaring noodig zijn.

      5 Feiten, welke voor den houder of voor dengene, dien hij met de aanbieding van de chèque of met het opmaken van
      het protest of de daarmede gelijkstaande verklaring belastte, van zuiver persoonlijken aard zijn, worden niet
      beschouwd als gevallen van overmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel219
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel225
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '219'
        afdeling: Zesde
  - number: '226'
    text: |-
      Behoudens de chèques aan toonder, kan elke chèque, uitgegeven in een land en betaalbaar in een ander land of in een
      overzeesch gebied van hetzelfde land en omgekeerd, of wel uitgegeven en betaalbaar in een zelfde overzeesch gebied
      of in verschillende overzeesche gebieden van hetzelfde land, in meer gelijkluidende exemplaren worden getrokken.
      Wanneer eene chèque in meer exemplaren is getrokken, moeten die exemplaren in den tekst zelf van den titel worden
      genummerd bij gebreke waarvan elk exemplaar wordt beschouwd als een afzonderlijke chèque.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel226
  - number: '227'
    text: |-
      1 De betaling op één der exemplaren gedaan, bevrijdt, ook al ware niet bedongen, dat die betaling de kracht der
      andere exemplaren te niet doet.

      2 De endossant, die de exemplaren aan verschillende personen heeft overgedragen, alsook de latere endossanten, zijn
      verbonden wegens alle exemplaren, die hunne handteekening dragen en die niet zijn uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel227
  - number: 227a
    text: |-
      Degene die de cheque waarvan hij houder was, vermist, kan met inachtneming van
      [artikel 49, derde lid, van Boek 6 van het Burgerlijk Wetboek][ref1] van de betrokkene betaling vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel49
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel227a
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '49'
  - number: 227b
    text: |-
      Degene die een cheque waarvan hij houder was, en welke is vervallen en, zoveel nodig, geprotesteerd, vermist, kan
      met inachtneming van [artikel 49, derde lid, van Boek 6 van het Burgerlijk Wetboek][ref1] zijn rechten alleen tegen
      de trekker uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel49
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel227b
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '49'
  - number: '228'
    text: |-
      In geval van verandering van den tekst van eene chèque zijn zij, die daarna hunne handteekeningen op de chèque
      geplaatst hebben, volgens den veranderden tekst verbonden; zij, die daarvoor hunne handteekeningen op de chèque
      geplaatst hebben, zijn verbonden volgens den oorspronkelijken tekst.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel228
  - number: 228a
    text: |-
      Behoudens de bepalingen van het volgende artikel gaat schuld uit eene chèque te niet door alle middelen van
      schuldbevrijding, bij het Burgerlijk Wetboek aangewezen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel228a
  - number: '229'
    text: |-
      1 De regresvorderingen van den houder tegen de endossanten, den trekker en de andere chèqueschuldenaren, verjaren
      door een tijdsverloop van zes maanden, te rekenen van het einde van den termijn van aanbieding.

      2 De regresvorderingen van de verschillende chèqueschuldenaren tegen elkander, die gehouden zijn tot de
      betaling van eene chèque, verjaren door een tijdsverloop van zes maanden, te rekenen van den dag, waarop de
      chèqueschuldenaar ter voldoening aan zijnen regresplicht de chèque heeft betaald, of van den dag, waarop hij zelf
      in rechte is aangesproken.

      3 De in het eerste en tweede lid bedoelde verjaring kan niet worden ingeroepen door den trekker, indien of voor
      zoover hij geen fonds heeft bezorgd noch door den trekker of de endossanten, die zich ongerechtvaardigd zouden
      hebben verrijkt; alles onverminderd het bepaalde in [artikel 306 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel306
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '306'
  - number: 229a
    text: |-
      1 De stuiting der verjaring is slechts van kracht tegen dengene, ten aanzien van wien de stuitingshandeling heeft
      plaats gehad.

      2 Op de in het vorige artikel bedoelde verjaringen is [artikel 321, eerste lid, onder ][ref1] niet van toepassing;
      in de gevallen bedoeld in [artikel 321, eerste lid, onder ][ref2] heeft de onbekwame of rechthebbende, wiens
      rechtsvordering is verjaard, verhaal op de wettelijke vertegenwoordiger of bewindvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel321
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel321
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel229a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '321'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '321'
  - number: 229abis
    text: |-
      Met bankiers, genoemd in de voorafgaande Afdeelingen van dezen Titel worden gelijkgesteld alle personen of
      instellingen, die in hun werkzaamheid regelmatig gelden ter onmiddellijke beschikking van anderen houden.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel229abis
  - number: 229b
    text: |-
      1 De aanbieding en het protest van eene chèque kunnen niet plaats hebben dan op eenen werkdag.

      2 Wanneer de laatste dag van den termijn, door de wet gesteld voor het verrichten van handelingen nopens de
      chèque, met name voor de aanbieding en voor het opmaken van het protest of een daarmede gelijkstaande verklaring,
      een wettelijke feestdag is, wordt deze termijn verlengd tot den eersten werkdag, volgende op het einde van dien
      termijn. De tusschenliggende feestdagen zijn begrepen in de berekening van den termijn.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel229b
  - number: 229bbis
    text: |-
      Als wettelijke feestdag in den zin van deze Afdeeling worden beschouwd de Zondag, de Nieuwjaarsdag, de Christelijke
      tweede Paasch- en Pinksterdagen, de beide Kerstdagen, de Hemelvaartsdag en de verjaardag van de Koning.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel229bbis
  - number: 229c
    text: |-
      In de termijnen, bij de voorafgaande Afdeelingen van dezen Titel voorzien, is niet begrepen de dag, waarop deze
      termijnen beginnen te loopen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel229c
  - number: 229d
    text: Geen enkele respijtdag, noch wettelijke, noch rechterlijke, is toegestaan.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel229d
  - number: 229e
    text: Quitantiën en promessen aan toonder moeten de juiste dagteekening der oorspronkelijke uitgifte bevatten.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel229e
  - number: 229f
    text: |-
      De oorspronkelijke uitgever van quitantiën aan toonder, door eenen derde betaalbaar, is jegens iederen houder voor
      de voldoening aansprakelijk gedurende tien dagen na de dagteekening, die dag niet daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel229f
  - number: 229g
    text: |-
      1 De verantwoordelijkheid van den oorspronkelijken uitgever blijft echter voortduren, tenzij hij bewees, dat hij,
      gedurende den bij het vorige artikel bepaalden tijd, fonds ten beloope van het uitgegeven papier bij den persoon,
      op wien hetzelve is afgegeven, heeft gehad.

      2 De oorspronkelijke uitgever is, op straffe van voortduring van zijne verantwoordelijkheid, verpligt den houder
      af te staan en over te dragen de vordering op het fonds, dat de persoon, op wien het papier is afgegeven van
      hem ten vervaldage heeft in handen gehad, en zulks ten beloope van het uitgegeven papier; en hij moet aan den
      houder, te diens koste, de noodige bewijzen verschaffen om die vordering te doen gelden. Indien de oorspronkelijke
      uitgever in staat van faillissement is verklaard of ten aanzien van hem de schuldsaneringsregeling natuurlijke
      personen van toepassing is verklaard, zijn de curatoren onderscheidenlijk de bewindvoerders in zijnen boedel tot
      dezelfde verpligtingen gehouden, ten ware deze mogten verkiezen, den houder als schuldeischer, ten beloope van het
      uitgegeven papier, toe te laten.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel229g
  - number: 229h
    text: |-
      Buiten den oorspronkelijken uitgever, blijft een ieder die het voormeld papier in betaling heeft gegeven, gedurende
      den tijd van drie dagen daarna, de dag der uitgifte niet daaronder begrepen, aansprakelijk jegens dengenen die het
      van hem heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel229h
  - number: 229i
    text: |-
      1 De houder eener promesse aan toonder is verpligt voldoening te vorderen binnen den tijd van drie dagen na
      den dag, op welken hij dat papier heeft in betaling genomen, die dag niet daaronder gerekend, en hij moet, bij
      wanbetaling, binnen een gelijken termijn daarna, de promesse ter intrekking aanbieden aan dengenen die hem dezelve
      heeft in betaling gegeven, alles op verbeurte van zijn verhaal tegen denzelven, doch onverminderd zijn regt tegen
      dengenen die de promesse heeft geteekend.

      2 Indien bij de promesse de dag is uitgedrukt op welken dezelve betaalbaar is, begint de termijn van drie dagen
      eerst te loopen daags na den uitgedrukten betaaldag.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel229i
  - number: 229j
    text: |-
      Indien de laatste dag van eenigen termijn, waaromtrent in deze Afdeeling eenige bepaling voorkomt, invalt op eenen
      wettelijken feestdag in den zin van [art. 229b bis][ref1], blijft de verpligting en verantwoordelijkheid voortduren
      tot en met den eersten daaropvolgenden dag, welke geen wettelijke feestdag is.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel229bbis
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel229j
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 229bbis
        afdeling: Tiende
  - number: 229k
    text: |-
      1 Alle regtsvordering tegen de in deze Afdeeling vermelde uitgevers van papier, of tegen hen, die buiten den
      oorspronkelijken uitgever het papier in betaling hebben gegeven, verjaart door tijdsverloop van zes maanden, te
      rekenen van den dag der oorspronkelijke uitgifte.

      2 De in het vorig lid bedoelde verjaring kan niet worden ingeroepen door den uitgever, indien of voor zoover hij
      geen fonds heeft bezorgd noch door den uitgever of door hen, die buiten den oorspronkelijken uitgever het papier
      in betaling hebben gegeven, voor zoover ze zich ongeregtvaardigd zouden hebben verrijkt; alles onverminderd het
      bepaalde in [artikel 306 van Boek 3 van het Burgerlijk Wetboek][ref1].

      3 Op de in dit artikel genoemde verjaringen is het [tweede lid van art. 229a][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel306
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel229a
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel229k
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '306'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 229a
        afdeling: Negende
  - number: '309'
    text: |-
