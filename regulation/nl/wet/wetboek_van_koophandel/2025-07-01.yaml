  - number: '154'
    text: |-
      1 De trekker, een endossant, of een avalgever, kan iemand aanwijzen om, in geval van nood, te accepteeren of te
      betalen.

      2 Onder de hierna vastgestelde voorwaarden kan de wisselbrief worden geaccepteerd of betaald door iemand, die
      tusschenkomt voor eenen schuldenaar, op wien recht van regres kan worden uitgeoefend.

      3 De interveniënt kan een derde zijn, zelfs de betrokkene, of een reeds krachtens den wisselbrief verbonden
      persoon, behalve de acceptant.

      4 De interveniënt geeft binnen den termijn van twee werkdagen van zijne tusschenkomst kennis aan dengene, voor
      wien hij tusschenkwam. In geval van niet-inachtneming van dien termijn is hij, indien daartoe aanleiding bestaat,
      verantwoordelijk voor de schade, door zijne nalatigheid veroorzaakt, zonder dat echter de schadevergoeding de
      wisselsom kan te boven gaan.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel154
  - number: '155'
    text: |-
      1 De acceptatie bij tusschenkomst kan plaats hebben in alle gevallen, waarin de houder van eenen voor acceptatie
      vatbaren wisselbrief vóór den vervaldag recht van regres kan uitoefenen.

      2 Wanneer op den wisselbrief iemand is aangewezen om dezen, in geval van nood, ter plaatse van betaling te
      accepteeren of te betalen, kan de houder zijn recht tegen dengene, die de aanwijzing heeft gedaan en tegen hen,
      die daarna hunne handteekeningen op den wisselbrief hebben geplaatst, niet vóór den vervaldag uitoefenen, tenzij
      hij den wisselbrief aan den aangewezen persoon heeft aangeboden, en van diens weigering tot acceptatie protest
      is opgemaakt.

      3 In de andere gevallen van tusschenkomst kan de houder de acceptatie bij tusschenkomst weigeren. Indien hij haar
      echter aanneemt, verliest hij zijn recht van regres, hetwelk hem vóór den vervaldag toekomt tegen dengene, voor
      wien de acceptatie is gedaan, en tegen hen, die daarna hunne handteekeningen op den wisselbrief hebben geplaatst.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel155
  - number: '156'
    text: |-
      De acceptatie bij tusschenkomst wordt op den wisselbrief vermeld; zij wordt door den interveniënt onderteekend.
      Zij wijst aan, voor wien zij is geschied; bij gebreke van die aanwijzing wordt zij geacht voor den trekker te zijn
      geschied.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel156
  - number: '157'
    text: |-
      1 De acceptant bij tusschenkomst is tegenover den houder en tegenover de endossanten, die den wisselbrief hebben
      geëndosseerd na dengene, voor wien de tusschenkomst is geschied, op dezelfde wijze als deze laatste verbonden.

      2 Niettegenstaande de acceptatie bij tusschenkomst kunnen degene, voor wien zij werd gedaan en degenen, die
      tegenover dezen regresplichtig zijn, van den houder, indien daartoe aanleiding bestaat, tegen terugbetaling van
      de bij [artikel 147][ref1] aangewezen som, de afgifte van den wisselbrief, van het protest en van een voor voldaan
      geteekende rekening vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel147
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '147'
        afdeling: Zevende
  - number: '158'
    text: |-
      1 De betaling bij tusschenkomst kan plaats hebben in alle gevallen, waarin, hetzij op den vervaldag, hetzij vóór
      den vervaldag, de houder recht van regres heeft.

      2 De betaling moet de geheele som beloopen, welke degene, voor wien zij heeft plaats gehad, moest voldoen.

      3 Zij moet plaats hebben uiterlijk op den dag volgende op den laatsten dag, waarop het protest van non-betaling kan
      worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel158
  - number: '159'
    text: |-
      1 Indien de wisselbrief is geaccepteerd door interveniënten, wier domicilie ter plaatse van betaling is gevestigd,
      of indien personen, wier domicilie in dezelfde plaats is gevestigd, zijn aangeduid om in geval van nood te betalen,
      moet de houder den wisselbrief aan al die personen aanbieden, en, indien daartoe aanleiding bestaat, protest van
      non-betaling doen opmaken uiterlijk op den dag volgende op den laatsten dag, waarop dit kan geschieden.

      2 Bij gebreke van protest binnen dien termijn zijn degene, die het noodadres heeft gesteld of voor wien de
      wisselbrief is geaccepteerd, en de latere endossanten van hunne verbintenis bevrijd.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel159
  - number: '160'
    text: |-
      De houder, die weigert de betaling bij tusschenkomst aan te nemen, verliest zijn recht van regres op hen, die
      daardoor zouden zijn bevrijd.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel160
  - number: '161'
    text: |-
      1 De betaling bij tusschenkomst moet worden vastgesteld door eene kwijting, geplaatst op den wisselbrief met
      aanwijzing van dengene, voor wien zij is gedaan. Bij gebreke van die aanwijzing wordt de betaling geacht voor den
      trekker te zijn gedaan.

      2 De wisselbrief en het protest, indien dit is opgemaakt, moeten worden uitgeleverd aan hem, die bij tusschenkomst
      betaalt.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel161
  - number: '162'
    text: |-
      1 Hij, die bij tusschenkomst betaalt, verkrijgt de rechten, uit den wisselbrief voortvloeiende, tegen dengene, voor
      wien hij heeft betaald, en tegen degenen, die tegenover dezen laatste krachtens den wisselbrief verbonden zijn. Hij
      mag echter den wisselbrief niet opnieuw endosseeren.

      2 De endossanten, volgende op dengene, voor wien de betaling heeft plaats gehad, zijn bevrijd.

      3 Indien zich meer personen tot de betaling bij tusschenkomst aanbieden, heeft de voorkeur de betaling, welke het
      grootste aantal bevrijdingen teweegbrengt. De interveniënt, die desbewust in strijd hiermede handelt, verliest zijn
      recht van regres tegen hen, die anders zouden zijn bevrijd.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel162
  - number: '163'
    text: |-
      1 De wisselbrief kan in meer gelijkluidende exemplaren worden getrokken.

      2 Die exemplaren moeten in den tekst zelf van den titel worden genummerd, bij gebreke waarvan elk exemplaar wordt
      beschouwd als een afzonderlijke wisselbrief.

      3 Iedere houder van eenen wisselbrief, waarin niet is vermeld, dat deze in een enkel exemplaar getrokken is, kan
      op zijne kosten de levering van meer exemplaren vorderen. Te dien einde moet hij zich tot zijn onmiddellijken
      endossant wenden, die verplicht is zijne medewerking te verleenen om zijn eigen endossant aan te spreken, en
      zoo vervolgens, teruggaande tot den trekker. De endossanten zijn verplicht, de endossementen ook op de nieuwe
      exemplaren aan te brengen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel163
  - number: '164'
    text: |-
      1 De betaling, op één der exemplaren gedaan, bevrijdt, ook al ware niet bedongen, dat die betaling de kracht der
      andere exemplaren te niet doet. Echter blijft de betrokkene verbonden wegens elk geaccepteerd exemplaar, dat hem
      niet is uitgeleverd.

      2 De endossant, die de exemplaren aan verschillende personen heeft overgedragen, alsook de latere endossanten, zijn
      verbonden wegens alle exemplaren, die hunne handteekening dragen en die niet zijn uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel164
  - number: '165'
    text: |-
      1 Hij, die één der exemplaren ter acceptatie heeft gezonden, moet op de andere exemplaren den naam van den persoon
      aanwijzen, in wiens handen dat exemplaar zich bevindt. Deze is verplicht, dit aan den rechtmatigen houder van een
      ander exemplaar uit te leveren.

      2 Weigert hij dit, dan kan de houder slechts zijn recht van regres uitoefenen, nadat hij door een protest heeft
      doen vaststellen:

      1°. dat het ter acceptatie gezonden exemplaar hem desgevraagd niet is uitgeleverd;

      2°. dat hij de acceptatie of de betaling op een ander exemplaar niet heeft kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel165
  - number: '166'
    text: |-
      1 Elke houder van eenen wisselbrief heeft het recht, daarvan afschriften te vervaardigen.

      2 Het afschrift moet het oorspronkelijke nauwkeurig weergeven met de endossementen en alle andere vermeldingen, die
      er op voorkomen. Het moet aangeven, waar het afschrift ophoudt.

      3 Het kan worden geëndosseerd en voor aval geteekend op dezelfde wijze en met dezelfde gevolgen, als het
      oorspronkelijke.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel166
  - number: '167'
    text: |-
      1 Het afschrift moet dengene, in wiens handen het oorspronkelijke stuk zich bevindt, vermelden. Deze is verplicht
      het oorspronkelijke stuk aan den rechtmatigen houder van het afschrift uit te leveren.

      2 Weigert hij dit, dan kan de houder zijn recht van regres tegen hen, die het afschrift hebben geëndosseerd of voor
      aval geteekend, slechts uitoefenen, nadat hij door een protest heeft doen vaststellen, dat het oorspronkelijke stuk
      hem desgevraagd niet is uitgeleverd.

      3 Indien na het laatste daarop geplaatste endossement, alvorens het afschrift is vervaardigd, het oorspronkelijke
      stuk de clausule draagt: "van hier af geldt het endossement slechts op de copie", of eenige andere soortgelijke
      clausule, is een nadien op het oorspronkelijk stuk geplaatst endossement nietig.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel167
  - number: 167a
    text: |-
      Degene die een wisselbrief, waarvan hij houder was, vermist, kan met inachtneming van
      [artikel 49, derde lid, van Boek 6 van het Burgerlijk Wetboek][ref1] van de betrokkene betaling vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel49
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel167a
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '49'
  - number: 167b
    text: |-
      Degene die een wisselbrief waarvan hij houder was, en welke is vervallen, en, zoveel nodig, geprotesteerd, vermist,
      kan met inachtneming van [artikel 49, derde lid, van Boek 6 van het Burgerlijk Wetboek][ref1], zijn rechten alleen
      tegen de acceptant en tegen de trekker uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel49
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel167b
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '49'
  - number: '168'
    text: |-
      In geval van verandering van den tekst van eenen wisselbrief, zijn zij, die daarna hunne handteekeningen op den
      wisselbrief geplaatst hebben, volgens den veranderden tekst verbonden; zij, die daarvoor hunne handteekeningen op
      den wisselbrief geplaatst hebben, zijn verbonden volgens den oorspronkelijken tekst.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel168
  - number: 168a
    text: |-
      Behoudens de bepaling van het volgende artikel gaat wisselschuld te niet door alle middelen van schuldbevrijding,
      bij het Burgerlijk Wetboek aangewezen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel168a
  - number: '169'
    text: |-
      1 Alle rechtsvorderingen, welke uit den wisselbrief tegen den acceptant voortspruiten, verjaren door een
      tijdsverloop van drie jaren, te rekenen van den vervaldag.

      2 De rechtsvorderingen van den houder tegen de endossanten en tegen den trekker verjaren door een tijdsverloop
      van een jaar, te rekenen van de dagteekening van het tijdig opgemaakte protest of, ingeval van de clausule zonder
      kosten, van den vervaldag.

      3 De rechtsvorderingen van de endossanten tegen elkander en tegen den trekker verjaren door tijdsverloop van zes
      maanden, te rekenen van den dag, waarop de endossant ter voldoening aan zijnen regresplicht den wisselbrief heeft
      betaald, of van den dag, waarop hij zelf in rechte is aangesproken.

      4 De in het eerste lid bedoelde verjaring kan niet worden ingeroepen door den acceptant, indien of voor zoover
      hij fonds heeft ontvangen of zich ongerechtvaardigd zou hebben verrijkt; evenmin kan de in het tweede en derde lid
      bedoelde verjaring worden ingeroepen door den trekker, indien of voor zoover hij geen fonds heeft bezorgd noch door
      den trekker of de endossanten, die zich ongerechtvaardigd zouden hebben verrijkt; alles onverminderd het bepaalde
      in [artikel 306 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel306
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '306'
  - number: '170'
    text: |-
      1 De stuiting der verjaring is slechts van kracht tegen dengene, ten aanzien van wien de stuitingshandeling heeft
      plaats gehad.

      2 Op de in het vorige artikel bedoelde verjaringen is [artikel 321, eerste lid, onder ][ref1] niet van toepassing;
      in de gevallen bedoeld in [artikel 321, eerste lid, onder ][ref2] heeft de onbekwame of rechthebbende wiens
      rechtsvordering is verjaard, verhaal op de wettelijke vertegenwoordiger of bewindvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel321
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel321
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '321'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '321'
  - number: '171'
    text: |-
      1 De betaling van eenen wisselbrief, waarvan de vervaldag een wettelijke feestdag is, kan eerst worden gevorderd
      op den eerstvolgenden werkdag. Evenzoo kunnen alle andere handelingen met betrekking tot wisselbrieven, met name de
      aanbieding ter acceptatie en het protest, niet plaats hebben dan op eenen werkdag.

      2 Wanneer ééne van die handelingen moet worden verricht binnen een zekeren termijn, waarvan de laatste dag een
      wettelijke feestdag is, wordt deze termijn verlengd tot den eersten werkdag, volgende op het einde van dien
      termijn. De tusschenliggende feestdagen zijn begrepen in de berekening van den termijn.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel171
  - number: 171a
    text: |-
      Als wettelijke feestdag in den zin van deze Afdeeling worden beschouwd de Zondag, de Nieuwjaarsdag, de Christelijke
      tweede Paasch- en Pinksterdagen, de beide Kerstdagen, de Hemelvaartsdag en de verjaardag van de Koning.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel171a
  - number: '172'
    text: |-
      In de wettelijke of bij overeenkomst vastgestelde termijnen is niet begrepen de dag, waarop deze termijnen beginnen
      te loopen.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel172
  - number: '173'
    text: Geen enkele respijtdag, noch wettelijke, noch rechterlijke, is toegestaan.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel173
  - number: '174'
    text: |-
      Het orderbriefje behelst:

      1°. hetzij de orderclausule, hetzij de benaming "orderbriefje" of "promesse aan order", opgenomen in den tekst
      zelf, en uitgedrukt in de taal, waarin de titel is gesteld;

      2°. de onvoorwaardelijke belofte een bepaalde som te betalen;

      3°. de aanwijzing van den vervaldag;

      4°. die van de plaats, waar de betaling moet geschieden;

      5°. den naam van dengene, aan wien of aan wiens order de betaling moet worden gedaan;

      6°. de vermelding van de dagteekening, alsmede van de plaats, waar het orderbiljet is onderteekend;

      7°. de handteekening van hem, die den titel uitgeeft (onderteekenaar).
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel174
  - number: '175'
    text: |-
      1 De titel, waarin ééne der vermeldingen, in het voorgaande artikel aangegeven, ontbreekt, geldt niet als
      orderbriefje, behoudens in de hieronder genoemde gevallen.

      2 Het orderbriefje, waarvan de vervaldag niet is aangewezen, wordt beschouwd als betaalbaar op zicht.

      3 Bij gebreke van een bijzondere aanwijzing wordt de plaats van de onderteekening van den titel geacht te zijn de
      plaats van betaling en tevens de plaats van het domicilie van den onderteekenaar.

      4 Het orderbriefje, dat de plaats van zijne onderteekening niet vermeldt, wordt geacht te zijn onderteekend in de
      plaats, aangegeven naast den naam van den onderteekenaar.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel175
  - number: '176'
    text: |-
      1 Voor zooverre zij niet onvereenigbaar zijn met den aard van het orderbriefje, zijn daarop toepasselijk de
      bepalingen over wisselbrieven betreffende:

      het endossement ([artikelen 110-119][ref1]);

      den vervaldag ([artikelen 132-136][ref2]);

      de betaling ([artikelen 137-141][ref3]);

      het recht van regres in geval van non-betaling ([artikelen 142-149][ref4], [151-153][ref5]);

      de betaling bij tusschenkomst ([artikelen 154][ref6], [158-162][ref7]);

      de wisselafschriften ([artikelen 166][ref8] en [167][ref9]);

      de vermiste wisselbrieven ([artikel 167a][ref10]);

      de veranderingen ([artikel 168][ref11]);

      de verjaring ([artikelen 168a][ref12] en [169-170][ref13]);

      de feestdagen, de berekening der termijnen en het verbod van respijtdagen ([artikelen 171][ref14], [171a][ref15],
      [172][ref16] en [173][ref17]).

      2 Eveneens zijn op het orderbriefje toepasselijk de bepalingen betreffende den wisselbrief, betaalbaar bij
      eenen derde of in een andere plaats dan die van het domicilie van den betrokkene ([artikelen 103][ref18] en
      [126][ref19]), de renteclausule ([artikel 104][ref20]), de verschillen in de vermelding met betrekking tot de
      som, welke moet worden betaald ([artikel 105][ref21]), de gevolgen van het plaatsen eener handteekening onder
      de omstandigheden bedoeld in [artikel 106][ref22], die van de handteekening van eenen persoon, die handelt
      zonder bevoegdheid of die zijne bevoegdheid overschrijdt ([artikel 107][ref23]), en den wisselbrief in blanco
      ([artikel 109][ref24]).

      3 Eveneens zijn op het orderbriefje toepasselijk de bepalingen betreffende het aval ([artikelen 129-131][ref25]);
      indien overeenkomstig hetgeen is bepaald bij [artikel 130, laatste lid][ref26], het aval niet vermeldt, voor wien
      het is gegeven, wordt het geacht voor rekening van den onderteekenaar van het orderbriefje te zijn gegeven.


