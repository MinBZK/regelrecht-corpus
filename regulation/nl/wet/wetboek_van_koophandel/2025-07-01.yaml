  - number: '388'
    text: |-
      Na afloop van eene reis is de kapitein verplicht de scheepspapieren aan de werkgever af te geven tegen
      ontvangstbewijs.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel388
  - number: '782'
    text: |-
      1 De schipper is verplicht de gebruikelijke regels en de bestaande voorschriften ter verzekering van de
      deugdelijkheid en de veiligheid van het schip voor de vaart op binnenwateren, van de veiligheid der opvarenden en
      der zaken aan boord met nauwgezetheid op te volgen.

      2 Hij onderneemt de reis niet, tenzij het schip tot het volvoeren daarvan geschikt, naar behooren uitgerust en
      voldoende bemand is.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel782
  - number: '783'
    text: |-
      1 De schipper kan na aankomst in eene haven door een notaris eene scheepsverklaring doen opmaken omtrent de
      voorvallen der reis. Buiten Nederland wendt hij zich tot den Nederlandschen consulairen ambtenaar of, bij
      ontstentenis van zoodanigen ambtenaar, tot het bevoegde gezag.

      2 De notaris en de consulaire ambtenaar zijn verplicht van scheepsverklaringen tegen betaling van kosten afschrift
      uit te reiken aan ieder, die het verlangt.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel783
  - number: '785'
    text: |-
      1 De schipper is verplicht aan personen, die in gevaar verkeeren, en in het bijzonder, als zijn schip bij eene
      aanvaring betrokken is geweest, aan de andere daarbij betrokken schepen en de personen, die zich aan boord dier
      schepen bevinden, de hulp te verleenen, waartoe hij bij machte is zonder zijn eigen schip en de opvarenden daarvan
      aan ernstig gevaar bloot te stellen.

      2 Hij is bovendien verplicht, voor zooverre hem dit mogelijk is, aan de andere bij de aanvaring betrokken schepen
      op te geven den naam van zijn schip, van de plaats, waar het thuis behoort, van de plaats, vanwaar het komt en
      waarheen het bestemd is, alsmede inzage te verstrekken van het bewijs van inschrijving in het register.

      3 Niet-nakoming van deze verplichtingen door den schipper geeft geen aanspraak jegens hem, die uit welken hoofde
      dan ook verantwoordelijk is voor het optreden van de schipper.
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel785
  - number: '958'
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de termijnen, gesteld in de hierna genoemde onderdelen
      van dit wetboek:

      van het eerste boek:

      Artikel 82 tweede lid, Titel IV derde en vierde afdeling en de Titels VI en VII;

      van het tweede boek:

      de Titels III, IV en Titel IX derde afdeling.

      Zij is echter wel van toepassing op de termijnen, gesteld in de artikelen 419 en 451e.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0001838/2025-07-01#Artikel958
    references:
      - id: ref1
        bwb_id: BWBR0002448
