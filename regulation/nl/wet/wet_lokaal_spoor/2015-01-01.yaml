  - number: '2.1'
    text: Lokale spoorwegen worden bij koninklijk besluit aangewezen.
    url: https://wetten.overheid.nl/BWBR0034363/2015-01-01#Artikel2
  - number: '2.2'
    text: 'Een spoorweg kan als lokale spoorweg worden aangewezen, indien de spoorweg:'
    url: https://wetten.overheid.nl/BWBR0034363/2015-01-01#Artikel2
  - number: 2.2.a
    text: |-
      is bestemd voor openbaar personenvervoer met stads-, voorstads- of regionale spoorvervoerdiensten of voor
      goederenvervoer; en
    url: https://wetten.overheid.nl/BWBR0034363/2015-01-01#Artikel2
  - number: 2.2.b
    text: |-
      geen hoofdspoorweg is als bedoeld in [artikel 2, eerste lid, van de Spoorwegwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel2
    url: https://wetten.overheid.nl/BWBR0034363/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '2'
  - number: '2.3'
    text: |-
      Indien een lokale spoorweg niet meer voldoet aan het tweede lid, wordt de aanwijzing als lokale spoorweg
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0034363/2015-01-01#Artikel2
  - number: '2.4'
    text: |-
      Een besluit tot aanwijzing dan wel intrekking van een aanwijzing als lokale spoorweg wordt bekendgemaakt in het
      Staatsblad.
    url: https://wetten.overheid.nl/BWBR0034363/2015-01-01#Artikel2
  - number: '2.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de elementen aangewezen die tot de lokale
      spoorweginfrastructuur behoren.
    url: https://wetten.overheid.nl/BWBR0034363/2015-01-01#Artikel2
  - number: '3.1'
    text: |-
      De [hoofdstukken 2 tot en met 10][ref1] zijn uitsluitend van toepassing op lokale spoorwegen die uitgesloten
      kunnen worden van het toepassingsgebied van [richtlijn 2001/14/EG](32001L0014) en van de uitvoeringsmaatregelen bij
      [richtlijn 2008/57/EG](32008L0057) en [richtlijn 2004/49/EG](32004L0049).


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0034363/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0034363
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      Tenzij bij of krachtens deze wet anders is bepaald, zijn lokale spoorwegen als bedoeld in het eerste lid
      uitgesloten van het toepassingsgebied van [richtlijn 2001/14/EG](32001L0014) en van de uitvoeringsmaatregelen
      bij [richtlijn 2008/57/EG](32008L0057) en [richtlijn 2004/49/EG](32004L0049). Vervoerders die gebruik maken van
      een dergelijke lokale spoorweg zijn uitgesloten van het toepassingsgebied van [richtlijn 95/18/EG](31995L0018).
      Bestuurders op een dergelijke spoorweg zijn vrijgesteld van de uitvoeringsmaatregelen bij [richtlijn 2007/59/EG]
      (32007L0059).
    url: https://wetten.overheid.nl/BWBR0034363/2015-01-01#Artikel3
  - number: '3.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels gesteld worden over lokale spoorwegen
      die niet uitgesloten kunnen worden van het toepassingsgebied van [richtlijn 2001/14/EG](32001L0014) en van de
      uitvoeringsmaatregelen bij [richtlijn 2008/57/EG](32008L0057) en [richtlijn 2004/49/EG](32004L0049).
    url: https://wetten.overheid.nl/BWBR0034363/2015-01-01#Artikel3
  - number: '3.4'
    text: |-
      De regels, bedoeld in het derde lid, kunnen in ieder geval inhouden het geheel of gedeeltelijk van toepassing
      verklaren van deze wet, de [Spoorwegwet][ref1] of de op die wetten berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel2
    url: https://wetten.overheid.nl/BWBR0034363/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '2'
  - number: '3.5'
    text: |-
      In het koninklijk besluit, bedoeld in [artikel 2][ref1], wordt vermeld of het een lokale spoorweg als bedoeld in
      het eerste of het derde lid betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel2
    url: https://wetten.overheid.nl/BWBR0034363/2015-01-01#Artikel3
    references:
