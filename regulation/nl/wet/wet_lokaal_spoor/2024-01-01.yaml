  - number: '17'
    text: |-
      1 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur stellen ten minste een maal in de vier jaar
      een visie vast ten aanzien van een kwalitatief goed en doelmatig beheer. De visie is ten minste uitgewerkt
      in prestatienormen die betrekking hebben op de kwaliteit, betrouwbaarheid en beschikbaarheid van de lokale
      spoorweginfrastructuur. Daarbij worden tevens de tijdstippen bepaald waarop de verschillende onderdelen van de
      lokale spoorweginfrastructuur periodiek door de beheerder worden geschouwd.

      2 De prestatienormen worden door gedeputeerde staten onderscheidenlijk het dagelijks bestuur, in overleg met de
      beheerder, nader geconcretiseerd door middel van prestatie-indicatoren.

      3 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur maken jaarlijks aan de hand van de prestatienormen
      en bijbehorende prestatie-indicatoren, bedoeld in het eerste en tweede lid, afspraken met de beheerder over de
      uitvoering van de beheertaken, alsmede over de benodigde financiële middelen ter realisatie van de afspraken.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel17
  - number: '18'
    text: |-
      1 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur wijzen ten behoeve van het beheer van de lokale
      spoorweginfrastructuur voor een door hen te bepalen termijn een of meerdere beheerders aan.

      2 Een aanwijzing kan uitsluitend plaatsvinden indien de beheerder beschikt over een veiligheidsbeheersysteem als
      bedoeld in [artikel 19][ref1].

      3 De op grond van het eerste lid aan te wijzen beheerder overlegt ten behoeve van de aanwijzing een schriftelijke
      verklaring van de toezichthouder waaruit blijkt in hoeverre hij in staat is om bij de start van zijn werkzaamheden
      te beschikken over een veiligheidsbeheersysteem dat voldoet aan [artikel 19][ref2].

      4 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur houden bij de aanwijzing van een beheerder rekening
      met gerechtvaardigde belangen van de rechthebbende op de lokale spoorweginfrastructuur.

      5 Een aanwijzing vindt niet plaats dan nadat de rechthebbende is gehoord.

      6 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen aan de aanwijzing voorschriften verbinden
      met betrekking tot de uitvoering van de beheertaak en de door de beheerder te verstrekken gegevens aan de
      toezichthouder.

      7 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen de voorschriften, bedoeld in het zesde lid,
      wijzigen in het belang van de veiligheid op en in de directe nabijheid van de lokale spoorweg.

      8 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen een aanwijzing schorsen of intrekken.

      9 Tot intrekking van de aanwijzing wordt in ieder geval overgegaan indien het veiligheidsbeheersysteem als bedoeld
      in het tweede lid:

      a. niet adequaat door de beheerder wordt toegepast; of

      b. niet meer voldoet aan de in [artikel 19][ref3] bedoelde eisen.

      10 Een intrekking op de gronden, genoemd in het negende lid, vindt niet plaats dan nadat gedeputeerde staten
      onderscheidenlijk het dagelijks bestuur de beheerder in de gelegenheid hebben gesteld om binnen een door hen
      te bepalen termijn het veiligheidsbeheersysteem adequaat toe te passen respectievelijk alsnog te voldoen aan
      [artikel 19][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0034363#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0034363#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0034363#Artikel19
