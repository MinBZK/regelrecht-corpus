      1 [Artikel 32][ref1] is niet van toepassing op een spoorvoertuig dat voorafgaand aan het tijdstip van
      inwerkingtreding van artikel 32 op de lokale spoorweg is toegelaten en waarmee onmiddellijk voorafgaand aan het
      tijdstip van inwerkingtreding van artikel 32 verkeer wordt verricht op die lokale spoorweg.

