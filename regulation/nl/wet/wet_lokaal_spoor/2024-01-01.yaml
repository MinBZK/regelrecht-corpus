  - number: 29a
    text: |-
      Een vervoerder die niet alleen onder de directe of indirecte zeggenschap staat van een onderneming of een andere
      entiteit die andere spoorvervoerdiensten dan stads-, voorstads- en regionale diensten verricht of integreert, maar
      die ook direct of indirect eigendom is van of wordt beheerd door de Staat, heeft een onafhankelijke rechtspositie
      op het vlak van bestuur, administratief beheer en interne administratieve, economische en boekhoudkundige controle,
      volgens welke hij in het bijzonder beschikt over een vermogen, een begroting en een boekhouding die gescheiden zijn
      van die van de Staat.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel29a
  - number: 29b
    text: |-
      1 Indien een vervoerder onder de directe of indirecte zeggenschap staat van een onderneming of een andere entiteit
      die andere spoorvervoerdiensten dan stads-, voorstads- en regionale diensten verricht of integreert, worden de
      winst-en-verliesrekeningen en balansen gescheiden opgesteld en gepubliceerd voor zover het betreft enerzijds
      activiteiten met betrekking tot de levering van vervoerdiensten door die vervoerder en anderzijds activiteiten met
      betrekking tot de levering van vervoerdiensten door die onderneming of andere entiteit.

      2 Financiële middelen die door een bestuursorgaan zijn verstrekt met het oog op een van de in het eerste lid
      bedoelde activiteiten worden niet overgedragen naar de andere activiteit.

      3 De wijze waarop de boekhoudingen van de verschillende bedoelde activiteiten worden gevoerd, maakt het mogelijk
      toe te zien op het verbod op de overdracht van openbare financiële middelen van het ene activiteitengebied naar
      het andere.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel29b
  - number: '30'
    text: |-
      1 Een tussen de beheerder en de vervoerder gesloten toegangsovereenkomst over het gebruik van de door de beheerder
      toegewezen vervoercapaciteit bevat in elk geval bedingen over:

      a. de door de beheerder te bieden kwaliteit van de lokale spoorweginfrastructuur; en

      b. de dagen en tijdstippen waarop het vervoer over de lokale spoorweginfrastructuur is toegestaan.

      2 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur stellen een beleidskader vast met
      toewijzingscriteria, dat de beheerder in acht neemt bij de verdeling van de vervoercapaciteit, waarbij voorrang
      wordt gegeven aan de capaciteit die redelijkerwijs nodig is voor de uitvoering van de concessie, bedoeld in
      [artikel 20, tweede of derde lid, van de Wet personenvervoer 2000][ref1].

      3 Het is verboden de door de beheerder toegewezen vervoercapaciteit over te dragen of in gebruik te geven aan een
      andere vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
