        hoofdstuk: '7'
  - number: '39'
    text: |-
      Het is degene onder wiens gezag een veiligheidsfunctie wordt uitgeoefend verboden om een veiligheidsfunctie binnen
      het lokale spoorwegverkeerssysteem te doen uitoefenen door een persoon van wie hij weet of redelijkerwijs moet
      weten dat die persoon niet voldoet aan de bij of krachtens deze wet aan de uitoefening van de veiligheidsfunctie
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel39
  - number: '40'
    text: |-
      1 Degene onder wiens gezag een persoon binnen het lokale spoorwegverkeerssysteem een functie uitoefent die van
      invloed kan zijn op de veiligheid van het verkeer over de lokale spoorweg, draagt er zorg voor dat die persoon
      daartoe geschikt is en de nodige kennis en bekwaamheid bezit.

      2 Het eerste lid is in ieder geval van toepassing op een veiligheidsfunctie als bedoeld in [artikel 36][ref1].

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      vakbekwaamheidseisen van een veiligheidsfunctie.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel36
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0034363
        artikel: '36'
        hoofdstuk: '6'
  - number: '41'
    text: |-
      1 Het is een ieder verboden een veiligheidsfunctie uit te oefenen dan wel op de uitoefening van een zodanige
      functie toezicht te houden terwijl diegene verkeert onder zodanige invloed van een stof, waarvan hij weet of
      redelijkerwijs moet vermoeden dat het gebruik daarvan, al dan niet in combinatie met het gebruik van een andere
      stof, de vaardigheid tot het uitoefenen van die functie of tot het houden van toezicht daarop kan verminderen, dat
      hij niet tot het behoorlijk uitoefenen van die functie of tot het behoorlijk uitoefenen van toezicht op die functie
      in staat moet worden geacht.

      2 Het is een ieder verboden om een veiligheidsfunctie uit te oefenen dan wel op de uitoefening van zodanige functie
      toezicht te houden na zodanig gebruik van alcoholhoudende drank, dat:

      a. het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan tweehonderdtwintig microgram alcohol
      per liter uitgeademde lucht, dan wel

      b. het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan een halve milligram alcohol per
      milliliter bloed.

      3 Het is verboden een veiligheidsfunctie te doen uitoefenen dan wel op de uitoefening van zodanige functie toezicht
      te doen houden door een persoon van wie men weet of redelijkerwijs moet vermoeden dat deze verkeert in een toestand
      als bedoeld in het eerste of tweede lid.

      4 Op de eerste vordering van bij of krachtens deze wet of [artikel 141 van het Wetboek van Strafvordering][ref1]
      met de opsporing van strafbare feiten belaste ambtenaren zijn personen die een veiligheidsfunctie uitoefenen dan
      wel op de uitoefening van zodanige functie toezicht houden, of daartoe aanstalten maken, verplicht hun medewerking
      te verlenen aan een voorlopig onderzoek van uitgeademde lucht en daartoe volgens door die ambtenaar te geven
      aanwijzingen ademlucht te blazen in een door die ambtenaar aangewezen apparaat.

      5 Dit artikel is niet van toepassing voor zover [artikel 8 van de Wegenverkeerswet 1994][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel8
