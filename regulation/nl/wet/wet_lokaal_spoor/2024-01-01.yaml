  - number: '36'
    text: |-
      1 Onder een veiligheidsfunctie wordt in dit hoofdstuk verstaan een functie binnen het lokale spoorwegverkeersysteem
      die van aanmerkelijke invloed is op de veiligheid van het spoorverkeer over de lokale spoorweg.

      2 De bestuurder van een spoorvoertuig oefent een veiligheidsfunctie uit.

      3 Bij of krachtens algemene maatregel van bestuur kunnen tevens andere functies als veiligheidsfunctie binnen het
      lokale spoorwegverkeerssysteem worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel36
  - number: '37'
    text: |-
      1 Een veiligheidsfunctie wordt slechts uitgeoefend door een persoon die:

      a. de leeftijd van achttien jaar heeft bereikt;

      b. de taal die door de verkeersleiding wordt gebruikt voldoende beheerst om de voor de uitoefening van de betrokken
      functie gebruikelijke procescommunicatie te voeren en te begrijpen; en

      c. geen lichamelijke of geestelijke beperkingen heeft die een goede uitoefening van de veiligheidsfunctie
      belemmeren, hetgeen blijkt uit onderzoek dat is verricht door een deskundige die is aangewezen door gedeputeerde
      staten onderscheidenlijk het dagelijks bestuur.

      2 Degene onder wiens gezag een veiligheidsfunctie wordt uitgeoefend, draagt er zorg voor dat de
      veiligheidsfunctionaris in ieder geval elke vijf jaar aan een onderzoek als bedoeld in het eerste lid, onderdeel c,
      wordt onderworpen.

      3 Indien degene onder wiens gezag een veiligheidsfunctie wordt uitgeoefend, vermoedt dat de desbetreffende
      veiligheidsfunctionaris niet langer voldoet aan het eerste lid, onderdeel c, kan hij van de betreffende
      functionaris verlangen dat hij zich aan een nieuw onderzoek onderwerpt.

      4 Bij ministeriële regeling kunnen nadere regels worden gegeven omtrent het onderzoek, bedoeld in het eerste lid,
      onderdeel c.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel37
  - number: '38'
    text: |-
      1 Degene die bij of krachtens het bepaalde in deze wet gerechtigd is om een veiligheidsfunctie uit te oefenen,
      ontvangt van degene onder wiens gezag hij die functie uitoefent, een bedrijfspas.

      2 De houder van de bedrijfspas is verplicht de bedrijfspas op eerste vordering te tonen aan de in de
      [artikelen 42][ref1] en [45][ref2] bedoelde personen.

      3 Bij ministeriële regeling kunnen nadere regels worden gegeven omtrent de in het eerste lid bedoelde bedrijfspas.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0034363#Artikel45
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel38
