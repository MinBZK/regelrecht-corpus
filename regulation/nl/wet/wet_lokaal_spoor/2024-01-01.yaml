    text: |-
      1 Lokale spoorwegen worden bij koninklijk besluit aangewezen.

      2 Een spoorweg kan als lokale spoorweg worden aangewezen, indien de spoorweg:

      a. is bestemd voor openbaar personenvervoer met stads-, voorstads- of regionale spoorvervoerdiensten of voor
      goederenvervoer; en

      b. geen hoofdspoorweg is als bedoeld in [artikel 2, eerste lid, van de Spoorwegwet][ref1].

      3 Indien een lokale spoorweg niet meer voldoet aan het tweede lid, wordt de aanwijzing als lokale spoorweg
      ingetrokken.

      4 Een besluit tot aanwijzing dan wel intrekking van een aanwijzing als lokale spoorweg wordt bekendgemaakt in het
      Staatsblad.

      5 Bij of krachtens algemene maatregel van bestuur worden de elementen aangewezen die tot de lokale
      spoorweginfrastructuur behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel2
