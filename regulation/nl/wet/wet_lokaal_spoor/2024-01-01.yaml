  - number: '5'
    text: |-
      1 De lokale spoorweginfrastructuur wordt zodanig aangelegd dat de lokale spoorweginfrastructuur:

      a. in goede staat verkeert, betrouwbaar en beschikbaar is;

      b. geschikt is voor het gebruik waarvoor zij is bestemd;

      c. bij normaal gebruik geen gevaar of schade oplevert voor personen of zaken; en

      d. veilig en doelmatig met de toegestane maximumsnelheid kan worden bereden.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels omtrent dit artikel worden gesteld.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel5
  - number: '6'
    text: |-
      1 Onverminderd [artikel 5, eerste lid][ref1], wordt nieuwe ondergrondse lokale spoorweginfrastructuur zodanig
      aangelegd dat:

      a. reizigers te allen tijde een spoorvoertuig kunnen verlaten en het dichtstbijzijnde station, een nooduitgang of
      een plaats die bereikbaar is vanaf de voor het openbaar verkeer openstaande weg, kunnen bereiken; en

      b. hulpverleningsdiensten in staat zijn om tijdens calamiteiten hun

      werkzaamheden naar behoren uit te voeren.

      2 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur laten in het geval dat overwogen wordt een tunnel aan
      te leggen die onderdeel uitmaakt van een lokale spoorweg en langer is dan 250 meter een risicoanalyse uitvoeren ten
      aanzien van het ontwerp van de tunnel.

      3 De aanleg van een tunnel als bedoeld in het tweede lid vindt uitsluitend plaats indien uit de risicoanalyse
      blijkt dat het risico lager is dan de bij ministeriële regeling vastgelegde risiconorm.

      4 Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de methode voor het uitvoeren van een
      risicoanalyse en de aspecten die in ieder geval bij de risicoanalyse worden betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel5
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel6
