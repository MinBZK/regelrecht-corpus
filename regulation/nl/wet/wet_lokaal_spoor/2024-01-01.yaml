  - number: '35'
    text: |-
      1 De vervoerder verricht uitsluitend vervoer met een spoorvoertuig dat zich in een veilige staat bevindt en dat
      zodanig is onderhouden dat het blijft voldoen aan [artikel 32, tweede lid, onderdelen a tot en met d][ref1].

      2 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen het gebruik van een spoorvoertuig verbieden,
      indien niet is voldaan aan het eerste lid.

      3 Het is verboden te handelen in strijd met een verbod als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel32
