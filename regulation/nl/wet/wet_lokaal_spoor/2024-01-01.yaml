  - number: '33'
    text: |-
      1 Het is verboden om een spoorvoertuig dat aanmerkelijk is gewijzigd in dienst te stellen zonder:

      a. een informatiedossier aan gedeputeerde staten onderscheidenlijk het dagelijks bestuur te overleggen waarin de
      wijziging is beschreven en gedocumenteerd; en

      b. een voor de wijziging of voor het gewijzigde spoorvoertuig verleende vergunning voor indienststelling als
      bedoeld in [artikel 32, eerste lid][ref1], indien gedeputeerde staten onderscheidenlijk het dagelijks bestuur die
      krachtens het derde lid eist.

      2 Van een aanmerkelijke wijziging als bedoeld in het eerste lid is sprake indien de gebruiksmogelijkheden van het
      spoorvoertuig aanmerkelijk veranderen door wijziging van de technische of functionele eigenschappen.

      3 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur eisen op basis van het informatiedossier, bedoeld
      in het eerste lid, onderdeel a, een vergunning voor indienststelling voor de wijziging of voor het gewijzigde
      spoorvoertuig, voor zover de omvang van de verbetering, vernieuwing of wijziging of de mogelijke gevolgen daarvan
      voor de veiligheid op en in de directe nabijheid van de lokale spoorweg dat noodzakelijk maakt of maken.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over het eerste lid.

      5 Het eerste lid is niet van toepassing op spoorvoertuigen waarvoor ingevolge [artikel 32, achtste lid][ref2], geen
      vergunning voor indienststelling verplicht is.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0034363#Artikel32
