  - number: '34'
    text: |-
      1 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur verlenen op aanvraag een vergunning voor
      indienststelling voor een type spoorvoertuig.

      2 De vergunning, bedoeld in het eerste lid, wordt, de beheerder gehoord, uitsluitend verleend indien het type
      spoorvoertuig voldoet aan de voorschriften, bedoeld in [artikel 32, tweede lid][ref1].

      3 Bij de aanvraag van een vergunning als bedoeld in het eerste lid wordt een schriftelijke verklaring van de
      toezichthouder overgelegd waarin is beschreven in hoeverre het type spoorvoertuig voldoet aan het bepaalde in
      [artikel 32, tweede lid][ref2].

      4 In afwijking van [artikel 32, tweede lid][ref3], wordt een vergunning voor indienststelling verleend, indien het
      spoorvoertuig overeenstemt met een type dat is voorzien van een vergunning als bedoeld in het eerste lid.

      5 De overeenstemming met een type blijkt uit een verklaring van overeenstemming die bij de aanvraag voor een
      vergunning voor indienststelling wordt overgelegd.

      6 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen nadere regels stellen over de verklaring van
      overeenstemming, bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0034363#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0034363#Artikel32
