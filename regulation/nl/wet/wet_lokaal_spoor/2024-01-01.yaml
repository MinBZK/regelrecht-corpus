  - number: '13'
    text: |-
      De rechthebbende wiens onroerende zaak door de lokale spoorweg wordt afgesneden van een openbare weg, heeft
      een recht van uitweg over de lokale spoorweg. [Artikel 57 van Boek 5 van het Burgerlijk Wetboek][ref1] is van
      toepassing, met uitzondering van de schadevergoedingsplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel57
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '57'
  - number: '14'
    text: |-
      1 De natuurlijke of rechtspersoon die verantwoordelijk is voor de inrichting en het gebruik van een gebouw of
      werk dat geheel of gedeeltelijk bestemd is voor de aankomst en het vertrek van spoorvoertuigen met het oog op het
      in-, uit- of overstappen van reizigers draagt er zorg voor dat de inrichting en uitrusting van het gebouw of werk
      voldoet aan de bij of krachtens algemene maatregel van bestuur gestelde regels.

      2 De regels, bedoeld in het eerste lid, zien op maatregelen ter bevordering van de toegankelijkheid van de gebouwen
      of werken voor reizigers met een functiebeperking.

      3 De regels, bedoeld in het eerste lid, kunnen voor de verschillende soorten gebouwen of werken verschillend luiden
      en kunnen in ieder geval betrekking hebben op:

      a. de aard van de maatregelen, bedoeld in het tweede lid;

      b. het moment waarop de maatregelen voor de verschillende soorten gebouwen, werken of trajecten worden doorgevoerd
      en de hoeveelheid aangepaste gebouwen of werken.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel14
  - number: '15'
    text: |-
      1 Het is verboden om:

      a. in te grijpen in de bediening of de werking van installaties van de lokale spoorweginfrastructuur;

      b. de lokale spoorweginfrastructuur te verwijderen, te beschadigen of te wijzigen;

      c. zich te bevinden op of langs een voor personen afgesloten lokale spoorweg of een gedeelte daarvan dan wel daarop
      of daarlangs dieren te drijven of te laten lopen;

      d. zich zodanig te gedragen, dat het beheer van of het verkeer over de lokale spoorweg wordt of kan worden
      gehinderd of belemmerd.

      2 Het eerste lid is niet van toepassing voor zover de handelingen worden verricht in het kader van de rechtmatige
      uitoefening van het beheer, het vervoer of het toezicht daarop in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel15
  - number: '16'
    text: |-
      1 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen onderzoek verrichten naar de oorzaken
      van ongevallen en incidenten op lokale spoorwegen en naar andere onregelmatigheden in de afwikkeling van het
      spoorverkeer waardoor de veiligheid van het spoorverkeer of van daarbij betrokken personen in gevaar is gebracht
      of in gevaar gebracht had kunnen worden, indien zij dat onderzoek nodig achten ter evaluatie van het beleid op het
      terrein van de veiligheid van het spoorverkeer.

      2 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen een ander machtigen tot het verrichten van het
      onderzoek, bedoeld in het eerste lid.

      3 Ten behoeve van het onderzoek hebben gedeputeerde staten, het dagelijks bestuur
      of de gemachtigde jegens vervoerders en beheerders de bevoegdheden, bedoeld in de
      [artikelen 5:15 tot en met 5:19 van de Algemene wet bestuursrecht][ref1]. De [artikelen 5:12][ref2], [5:13][ref3]
      en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing.

      4 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur zijn bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref5] ten aanzien van de toepassing van het derde lid.

      5 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur onthouden zich van het onderzoek naar de oorzaken van
      ongevallen en incidenten op lokale spoorwegen voor zover de Onderzoeksraad voor veiligheid daarnaar een onderzoek
      instelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel515
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel512
