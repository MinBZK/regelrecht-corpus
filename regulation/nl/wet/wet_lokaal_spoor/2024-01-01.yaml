preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de regels inzake de aanleg, het beheer, het gebruik
    en de veiligheid van lokale spoorwegen te moderniseren en de verantwoordelijkheid van de decentrale overheden voor
    de lokale spoorweginfrastructuur vast te leggen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *beheerder:* beheerder van de lokale spoorweginfrastructuur die als zodanig is aangewezen op grond van
      [artikel 18, eerste lid][ref1];
        - *dagelijks bestuur:* dagelijks bestuur van een openbaar lichaam als bedoeld in
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref2];
        - *interoperabiliteitsrichtlijn:* richtlijn (EU) 2016/797 van het Europees Parlement en de Raad van 11 mei 2016
      betreffende de interoperabiliteit van het spoorwegsysteem in de Europese Unie (PbEU L 2016, 138);
        - *Locaalspoor- en Tramwegwet:*
      __REF002___________________________________________________________________________________________________________
      _________________________________________ (Stb. 1900, 118);
        - *lokaal spoorwegverkeerssysteem:* verkeerssysteem van de krachtens [artikel 2, eerste lid][ref4], als zodanig
      aangewezen lokale spoorweg;
        - *lokale spoorweg:* spoorweg die krachtens [artikel 2, eerste lid][ref5], als zodanig is aangewezen;
        - *lokale spoorweginfrastructuur:* de elementen, bedoeld in [artikel 2, vijfde lid][ref6];
        - *Metroreglement:*
      [Besluit van 30 oktober 1981, houdende vaststelling van een Algemeen reglement voor de stadsspoorwegen][ref7]
      (Stb. 1981, 700);
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *rechthebbende:* eigenaar, bezitter of degene die een recht van erfpacht, opstal, vruchtgebruik, gebruik, huur of
      pacht heeft;
        - *Reglement dienst hoofd- en lokaalspoorwegen:*
      __REF007___________________________________________________________________________________________________________
      ___________________ (Stb. 1977, 152);
        - *richtlijn 2007/59/EG:* [richtlijn 2007/59/EG](32007L0059) van het Europees Parlement en de Raad van de Europese
      Unie van 23 oktober 2007 inzake de certificering van machinisten die locomotieven en treinen op het spoorwegsysteem
      van de Gemeenschap besturen (PbEU 2007, L 315);
        - *richtlijn 2012/34/EU:* richtlijn 2012/34/EU van het Europees Parlement en de Raad van 21 november 2012 tot
      instelling van één Europese spoorwegruimte (PbEU L 2012, 343/32);
        - *spoorvoertuig:* voertuig, bestemd voor verkeer over de lokale spoorweg;
        - *spoorwegveiligheidsrichtlijn:* richtlijn (EU) 2016/798 van het Europees Parlement en de Raad inzake veiligheid
      op het spoor (PbEU L 2016, 138);
        - *toezichthouder:* de bij besluit van Onze Minister aangewezen personen, bedoeld in
      [artikel 42, eerste lid][ref9];
        - *vervoerder:* onderneming die met een spoorvoertuig vervoer verricht over een lokale spoorweg;
        - *wegbeheerder:* overheden, genoemd in de [artikelen 15 tot en met 17 van de Wegenwet][ref10] of, indien van
      toepassing, het openbaar lichaam als bedoeld in [artikel 20, derde lid van de Wet personenvervoer 2000][ref11] voor
      zover het wegbeheer aan het openbaar lichaam is overgedragen;
        - *weggebruiker:* weggebruiker als bedoeld in
      [artikel 1 van het Reglement verkeersregels en verkeerstekens 1990][ref12];
        - *Wet aanleg locaalspoor- en tramwegen:*
      __REF012___________________________________________________________________________________________________________
      _________________________________________________________________________________________ (Stb. 1917, 703);
        - *Wet zwerfstroomen:*
      __REF013___________________________________________________________________________________________________________
      _________________________________________________________________________________________ (Stb. 1924, 498).


