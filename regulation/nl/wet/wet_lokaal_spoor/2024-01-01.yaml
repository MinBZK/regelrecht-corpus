  - number: '49'
    text: |-
      1 Vervoerders en beheerders verstrekken gedeputeerde staten onderscheidenlijk het dagelijks bestuur mondeling,
      schriftelijk of op andere door gedeputeerde staten onderscheidenlijk het dagelijks bestuur te bepalen wijze, alle
      bij hen berustende gegevens en geven inzage in boeken en bescheiden die betrekking hebben op het gebruik of beheer
      van de lokale spoorweginfrastructuur, voor zover gedeputeerde staten onderscheidenlijk het dagelijks bestuur dat
      redelijkerwijs voor de vervulling van hun taken nodig achten.

      2 Degene van wie krachtens het eerste lid gegevens worden verlangd is op de door gedeputeerde staten
      onderscheidenlijk het dagelijks bestuur aan te geven wijze en binnen de door hen te bepalen termijn verplicht
      deze volledig en naar waarheid te verstrekken. Degene van wie inzage wordt verlangd is verplicht deze ongestoord
      te verlenen.

      3 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur gebruiken de gegevens of inlichtingen uitsluitend
      voor de uitvoering van hun taken en bevoegdheden krachtens deze wet of hun taken en bevoegdheden op het gebied van
      lokale spoorwegen krachtens de [Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: '50'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet gaat een wijziging van de
      spoorwegveiligheidsrichtlijn gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering
      moet zijn gegeven, tenzij bij ministerieel besluit dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel50
  - number: '51'
    text: |-
      Het dagelijks bestuur kan de kosten die samenhangen met het in behandeling nemen van de aanvragen in verband met
      documenten die bij of krachtens deze wet worden afgegeven ten laste brengen van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel51
  - number: '61'
    text: |-
      [Artikel 6, tweede tot en met vierde lid][ref1], is niet van toepassing op tunnels:

      a. waarover voorafgaand aan het tijdstip van inwerkingtreding van [artikel 6][ref2] een overeenkomst met een
      ontwerpend adviseur, een geïntegreerde overeenkomst voor ontwerp en realisatie of een overeenkomst tot bouw is
      gesloten;

      b. waarvoor voorafgaand aan het tijdstip van inwerkingtreding van [artikel 6][ref3] een reguliere bouwvergunning,
      als bedoeld in [artikel 44 van de Woningwet][ref4] is verleend; of

      c. waarvan de bouw voorafgaand aan het tijdstip van inwerkingtreding van [artikel 6][ref5] al is begonnen.


