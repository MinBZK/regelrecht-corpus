  - number: '12'
    text: |-
      Het dagelijks bestuur wijst het beperkingengebied aan waarbinnen het vergunningsvereiste, bedoeld in
      [artikel 5.1, tweede lid, aanhef en onder f, onder 4°, van de Omgevingswet][ref1] geldt, voor zover dat
      beperkingengebied gelegen is in het krachtens [artikel 20, derde lid, van de Wet personenvervoer 2000][ref2]
      aangewezen gebied.


