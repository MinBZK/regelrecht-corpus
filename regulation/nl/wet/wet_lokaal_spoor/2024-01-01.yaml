      uitgifte van het Staatsblad waarin zij wordt geplaatst met uitzondering van [hoofdstuk 1][ref1], dat in werking
      treedt met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt geplaatst.


