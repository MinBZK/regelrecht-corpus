  - number: '65'
    text: |-
      Ten aanzien van degene die op het tijdstip van inwerkingtreding van [artikel 37, eerste lid, onderdeel c][ref1],
      een functie uitoefent binnen het lokale spoorwegverkeersysteem die van aanmerkelijke invloed is op de veiligheid
      van het spoorverkeer over de lokale spoorweg, geldt het bepaalde in artikel 37, eerste lid, onderdeel c, met ingang
      van de datum na een jaar van inwerkingtreding van artikel 37, eerste lid, onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel37
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel65
