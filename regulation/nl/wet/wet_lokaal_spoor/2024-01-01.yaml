  - number: '42'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van Onze
      Minister aangewezen personen.

      2 De toezichthouder heeft tevens tot taak het afgeven van een schriftelijke verklaring, als bedoeld in de
      [artikelen 9, derde lid][ref1], [18, derde lid][ref2], [27, derde lid][ref3], [32, derde lid][ref4], en
      [34, derde lid][ref5].

      3 De [artikelen 5:12 tot en met 5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref6] zijn van
      overeenkomstige toepassing ten aanzien van de toezichthouder bij de uitoefening van de in het tweede lid genoemde
      taken.

      4 De toezichthouder verricht de in het eerste lid genoemde taken uit eigen beweging of op verzoek van gedeputeerde
      staten onderscheidenlijk het dagelijks bestuur.

      5 De toezichthouder brengt van zijn bevindingen ten aanzien van de uitoefening van de in het eerste lid bedoelde
      taken verslag uit aan gedeputeerde staten onderscheidenlijk het dagelijks bestuur.

      6 Indien de toezichthouder de in het eerste lid genoemde taak op verzoek van gedeputeerde staten onderscheidenlijk
      het dagelijks bestuur verricht, neemt hij de instructies van gedeputeerde staten onderscheidenlijk het dagelijks
      bestuur in acht.

      7 Onze Minister kan de kosten van de werkzaamheden die worden verricht in verband met de uitvoering van de in het
      eerste lid bedoelde taak in rekening brengen bij gedeputeerde staten onderscheidenlijk het dagelijks bestuur op
      wie ingevolge [artikel 4, eerste of tweede lid][ref7], de zorgplicht voor de aanleg en het beheer van de lokale
      spoorweginfrastructuur rust.

      8 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het zevende lid.
      Daarbij kan onderscheid worden gemaakt tussen incidenteel en jaarlijks in rekening te brengen kosten.

      9 Bij ministeriële regeling kunnen regels worden gesteld over de vergoeding die de aanvrager verschuldigd is voor
      de behandeling van de aanvraag tot verlening van de schriftelijke verklaring bedoeld in het tweede lid.

      10 De ingevolge het zevende tot en met het negende lid in rekening gebrachte bedragen worden zodanig vastgesteld
      dat de geraamde baten niet uitgaan boven de geraamde kosten die in een rechtstreeks verband staan met de betrokken
      werkzaamheden.


