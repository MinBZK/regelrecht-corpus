  - number: '31'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toegankelijkheid van
      spoorvoertuigen voor mensen met een functiebeperking.

      2 De regels, bedoeld in het eerste lid, kunnen voor de verschillende soorten spoorvoertuigen verschillend luiden en
      kunnen in ieder geval betrekking hebben op:

      a. de aard van de maatregelen;

      b. het moment waarop de maatregelen voor de verschillende soorten

      spoorvoertuigen of trajecten worden doorgevoerd en de hoeveelheid aangepaste spoorvoertuigen.

      3 De regels, bedoeld in het eerste lid, zijn niet van toepassing op het verrichten van incidenteel vervoer met
      historische spoorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel31
  - number: '32'
    text: |-
      1 Het is verboden om van een lokale spoorweg gebruik te maken met een spoorvoertuig waarvoor gedeputeerde staten
      onderscheidenlijk het dagelijks bestuur geen vergunning voor indienststelling hebben verleend.

      2 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur verlenen, na de beheerder te hebben gehoord, een
      vergunning voor indienststelling, indien het spoorvoertuig:

      a. beschikt over de eigenschappen die noodzakelijk zijn om veilig gebruik te kunnen maken van de desbetreffende
      spoorweginfrastructuur;

      b. geen storingen, buitensporige slijtage of schade aan de desbetreffende spoorweginfrastructuur veroorzaakt;

      c. zo gebouwd is dat het gebruik geen schade of gevaar oplevert voor personen of zaken; en

      d. voldoet aan de bij of krachtens [artikel 31][ref1] gestelde eisen met betrekking tot de toegankelijkheid van
      spoorvoertuigen voor mensen met een functiebeperking.

      3 Bij de aanvraag van een vergunning als bedoeld in het eerste lid wordt een schriftelijke verklaring van de
      toezichthouder overgelegd waarin is beschreven in hoeverre het spoorvoertuig voldoet aan het bepaalde in het tweede
      lid.

      4 De aanvrager van de vergunning voor indienststelling levert ten behoeve van de verklaring, bedoeld in het derde
      lid, aan gedeputeerde staten onderscheidenlijk het dagelijks bestuur, de betrokken beheerder of beheerders en
      aan de toezichthouder een informatiedossier aan waarin de technische specificaties van het spoorvoertuig worden
      beschreven en gedocumenteerd en waaruit blijkt dat het spoorvoertuig voldoet aan het tweede lid.

      5 Een vergunning als bedoeld in het eerste lid kan onder beperkingen worden verleend. Aan een vergunning kunnen
      voorschriften worden verbonden in het belang van de veiligheid op en in de directe nabijheid van de lokale
      spoorweg.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld over het tweede, derde, vierde en vijfde lid.

      7 Het is verboden te handelen in strijd met de voorschriften en beperkingen, bedoeld in het vijfde lid.

      8 Het eerste lid is niet van toepassing op het verrichten van proefritten met het oog op het opdoen van ervaring
      met spoorvoertuigen of het testen van procedures in het kader van het veiligheidsbeheersysteem.

      9 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen ontheffing verlenen van
      het eerste lid, indien voor een spoorvoertuig reeds een voertuigvergunning als bedoeld in
      [artikel 26k, eerste lid, van de Spoorwegwet][ref2], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel26k
