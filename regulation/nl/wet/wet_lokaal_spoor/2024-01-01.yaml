  - number: '19'
    text: |-
      1 Het veiligheidsbeheersysteem van de beheerder:

      a. voldoet aan artikel 9, derde en vierde lid, van de spoorwegveiligheidsrichtlijn, met uitzondering van het derde
      lid, onderdeel c;

      b. bevat procedures om te voldoen aan het bepaalde in het tweede lid en het krachtens het derde lid bepaalde;

      c. bevat, voor zover op grond van [artikel 9, vierde lid][ref1], beperkingen of voorschriften zijn verbonden aan
      een vergunning voor indienststelling, procedures om te voldoen aan die beperkingen of voorschriften;

      d. bevat, voor zover op grond van [artikel 18, zesde lid][ref2], voorschriften zijn verbonden aan de aanwijzing van
      de beheerder, procedures om te voldoen aan die voorschriften; en

      e. bevat procedures om te voldoen aan [artikel 20, eerste lid][ref3].

      2 Het veiligheidsbeheersysteem is op zodanige wijze geoperationaliseerd en wordt op zodanige wijze toegepast dat
      de beheerder:

      a. bij de normale bedrijfsvoering en bij voorzienbare afwijkingen daarvan geen schade veroorzaakt, niemand
      onnodig hindert of in gevaar brengt en zorgt dat het spoorverkeer zo veel mogelijk zonder verstoringen kan worden
      afgewikkeld;

      b. rekening houdt met de specifieke vereisten wanneer de normale bedrijfsvoering raakt aan die van andere
      gebruikers van de lokale spoorweg;

      c. de aan de bedrijfsvoering verbonden risico’s onderkent en passende maatregelen neemt om deze afdoende te
      beheersen en daarbij rekening houdt met de stand der techniek en de binnen de bedrijfstak aanwezige kennis en
      richtsnoeren voor een veilige bedrijfsvoering;

      d. corrigerende maatregelen neemt bij afwijkingen en incidenten;

      e. het veiligheidsniveau van de bedrijfsvoering voortdurend verbetert met het oog op zich wijzigende omstandigheden
      en op grond van opgedane ervaringen;

      f. ervoor zorg draagt dat werknemers met een veiligheidsfunctie met het oog op het behouden van hun geschiktheid,
      kennis en bekwaamheid, voor de desbetreffende functie de noodzakelijke oefening hebben en de noodzakelijke nadere
      of aanvullende scholing, opleiding en studie volgen; en

      g. zijn veiligheidsbeheersysteem heeft afgestemd op het veiligheidsbeheersysteem van de vervoerder. Indien de
      beheerder tevens vervoerder is kan worden volstaan met een integraal veiligheidsbeheersysteem voor zowel het beheer
      als het vervoer.

      3 Bij ministeriële regeling worden nadere regels gesteld over het veiligheidsbeheersysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0034363#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0034363#Artikel20
