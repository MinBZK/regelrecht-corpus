  - number: '4'
    text: |-
      1 Gedeputeerde staten dragen zorg voor de aanleg en het beheer van de lokale spoorweginfrastructuur
      in het gebied van de provincie voor zover die infrastructuur niet is gelegen in het krachtens
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref1] aangewezen gebied.

      2 Het dagelijks bestuur draagt zorg voor de aanleg en het beheer van de lokale spoorweginfrastructuur, voor zover
      die gelegen is in het krachtens [artikel 20, derde lid, van de Wet personenvervoer 2000][ref2] aangewezen gebied.

      3 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen hun bevoegdheden, bedoeld in de
      [artikelen 9, tweede lid][ref3], [10, derde lid][ref4], [11][ref5], [17, derde lid][ref6], [18][ref7],
      [20, vierde lid][ref8], [21, tweede, derde en vierde lid][ref9], [22, tweede lid][ref10], [24, eerste lid][ref11],
      [32, tweede en vijfde lid][ref12], [33, derde lid][ref13], [34, eerste en zesde lid][ref14], en
      [35, tweede lid][ref15], overdragen aan het college van burgemeester en wethouders van een van de in het gebied van
      die provincie of in het krachtens [artikel 20, derde lid, van de Wet personenvervoer 2000][ref16] aangewezen gebied
      liggende gemeenten.

      4 Het dagelijks bestuur kan zijn bevoegdheid, bedoeld in [artikel 12][ref17], overdragen
      aan het college van burgemeester en wethouders van een van de in het krachtens
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref18] aangewezen gebied liggende gemeenten.


