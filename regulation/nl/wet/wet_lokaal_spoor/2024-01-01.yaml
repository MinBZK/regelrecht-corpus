  - number: '3'
    text: |-
      1 Deze wet is van toepassing op lokale spoorwegen.

      2 Indien de interoperabiliteitsrichtlijn, de spoorveiligheidsrichtlijn of [richtlijn 2012/34](32012L0034)/EU
      vanwege het toepassingsgebied van de desbetreffende richtlijn geheel of gedeeltelijk van toepassing is op een
      lokale spoorweg, worden, voor zover dit voor een goede toepassing van deze richtlijn nodig is, bij of krachtens
      algemene maatregel van bestuur regels gesteld. Deze regels kunnen in ieder geval strekken tot:

      a. het geheel of gedeeltelijk buiten toepassing laten van het bij of krachtens deze wet bepaalde op de
      desbetreffende lokale spoorweg;

      b. het geheel of gedeeltelijk van toepassing verklaren van het bij of krachtens de [Spoorwegwet][ref1] bepaalde op
      de desbetreffende lokale spoorweg.

      3 Een lokale spoorweg is uitgesloten van de reikwijdte van een richtlijn genoemd in het tweede lid, indien de
      desbetreffende richtlijn deze mogelijkheid biedt, tenzij bij of krachtens algemene maatregel van bestuur anders
      is bepaald.

      4 Tenzij bij of krachtens deze wet anders is bepaald, zijn bestuurders op een lokale spoorweg vrijgesteld van de
      uitvoeringsmaatregelen bij [richtlijn 2007/59/EG](32007L0059).


      [ref1]: https://wetten.overheid.nl/BWBR0015007
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel3
