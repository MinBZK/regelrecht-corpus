  - number: '11'
    text: |-
      Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen een vergunning als bedoeld in [artikel 9][ref1]
      schorsen of intrekken indien:

      a. dat naar het oordeel van gedeputeerde staten onderscheidenlijk het dagelijks bestuur noodzakelijk is in verband
      met de veiligheid op en in de directe nabijheid van de lokale spoorweg;

      b. de lokale spoorweginfrastructuur niet meer voldoet aan de [artikelen 5][ref2] en [6][ref3].


