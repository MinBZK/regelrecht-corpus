      1 [Artikel 9][ref1] is niet van toepassing ten aanzien van lokale spoorweginfrastructuur die
      voorafgaand aan het tijdstip van inwerkingtreding van artikel 9 in gebruik is genomen op grond van de
      [Spoorwegwet][ref2], de [Spoorwegwet 1875][ref3], de [Wet aanleg locaalspoor- en tramwegen][ref4] dan wel de
      [Locaalspoor- en Tramwegwet][ref5], en die onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van
      artikel 9 als zodanig in gebruik is.

      2 [Artikel 10][ref6] is onverminderd van toepassing op in gebruik genomen lokale spoorweginfrastructuur als bedoeld
      in het eerste lid.


