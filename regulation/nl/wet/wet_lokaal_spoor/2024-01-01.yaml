  - number: '29'
    text: |-
      1 Een veiligheidscertificaat is ten hoogste vijf jaar geldig.

      2 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen een veiligheidscertificaat schorsen of
      intrekken, indien het veiligheidsbeheersysteem van de vervoerder:

      a. niet adequaat door de vervoerder wordt toegepast; of

      b. niet meer voldoet aan [artikel 28][ref1].

      3 Een intrekking als bedoeld in het tweede lid vindt niet plaats dan nadat gedeputeerde staten onderscheidenlijk
      het dagelijks bestuur de vervoerder in de gelegenheid hebben gesteld om binnen een door hen te bepalen termijn het
      veiligheidsbeheersysteem adequaat toe te passen respectievelijk alsnog te voldoen aan [artikel 28][ref2].

      4 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen nadere regels stellen over de uitvoering van
      het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0034363#Artikel28
