      1 Overtreding van de [artikelen 15, eerste lid, onderdelen c en d][ref1], en [25, vierde lid][ref2], wordt gestraft
      met hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie.

      2 Overtreding van de [artikelen 15, eerste lid, onderdelen a en b][ref3], en [41, vierde lid][ref4], wordt gestraft
      met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.

      3 Overtreding van de [artikelen 41, eerste tot en met derde lid][ref5], [47, derde lid][ref6], en
      [48, tweede, zesde, achtste en negende lid][ref7], wordt gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de vierde categorie.

      4 Bij veroordeling van een persoon die een veiligheidsfunctie uitoefent, wegens overtreding van
      [artikel 41, eerste of tweede lid][ref8], kan hem de bevoegdheid tot het uitoefenen van die functie voor ten
      hoogste vijf jaren worden ontzegd.

      5 Bij veroordeling van een persoon die een veiligheidsfunctie uitoefent, wegens overtreding van het bepaalde
      krachtens deze wet, kan hem in die gevallen waarin dit bij algemene maatregel van bestuur is bepaald, de
      bevoegdheid tot het uitoefenen van die functie voor ten hoogste twee jaar worden ontzegd.

      6 De feiten strafbaar gesteld bij dan wel krachtens de in het eerste en tweede lid bedoelde bepalingen zijn
      overtredingen. De in het derde lid strafbaar gestelde feiten zijn misdrijven.


