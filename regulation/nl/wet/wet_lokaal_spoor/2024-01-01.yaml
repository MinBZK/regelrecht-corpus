  - number: '10'
    text: |-
      1 Het is verboden om een aanmerkelijke verbetering, vernieuwing of wijziging van de lokale spoorweginfrastructuur
      in dienst te stellen

      a. voordat de beheerder een informatiedossier aan gedeputeerde staten onderscheidenlijk het dagelijks bestuur, aan
      de toezichthouder en aan de betrokken vervoerder of vervoerders heeft overlegd, waarin de verbetering, vernieuwing
      of wijziging is beschreven en gedocumenteerd; en

      b. zonder een voor die verbetering, vernieuwing of wijziging verleende vergunning voor indienststelling als bedoeld
      in [artikel 9, eerste lid][ref1], indien gedeputeerde staten onderscheidenlijk het dagelijks bestuur die krachtens
      het derde lid eisen.

      2 Van een aanmerkelijke verbetering, vernieuwing of wijziging als bedoeld in het eerste lid is sprake indien de
      gebruiksmogelijkheden van de lokale spoorweginfrastructuur aanmerkelijk veranderen door wijziging van de technische
      of functionele eigenschappen.

      3 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur eisen op basis van het informatiedossier, bedoeld in
      het eerste lid, onderdeel a, een vergunning voor indienststelling, indien de omvang van de verbetering, vernieuwing
      of wijziging of de mogelijke gevolgen daarvan voor de veiligheid op en in de directe nabijheid van de lokale
      spoorweg dat noodzakelijk maakt of maken.

      4 De beheerder vermeldt in het informatiedossier de zienswijze van de rechthebbende op de lokale
      spoorweginfrastructuur en motiveert, indien de voorgenomen verbetering, vernieuwing of wijziging afwijkt van die
      zienswijze, de redenen van die afwijking.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel9
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel10
