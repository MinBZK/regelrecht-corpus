  - number: '47'
    text: |-
      1 Een van de bij of krachtens [artikel 45][ref1] van deze wet of
      [artikel 141 van het Wetboek van Strafvordering][ref2] met de opsporing van strafbare feiten belaste ambtenaren,
      kan een in [artikel 41, eerste lid][ref3], bedoelde persoon van wie, uit het in artikel 41, vierde lid, bedoelde
      onderzoek of op andere wijze, naar het oordeel van die ambtenaar gebleken is dat hij onder zodanige invloed van
      het gebruik van een stof als bedoeld in artikel 41, eerste lid, verkeert, dat hij onvoldoende in staat is een
      veiligheidsfunctie uit te oefenen dan wel op de uitoefening van zodanige functie toezicht te houden, een verbod
      opleggen tot het uitoefenen van die functie of tot het houden van toezicht daarop, voor de tijd gedurende welke
      redelijkerwijs verwacht mag worden dat deze toestand zal voortduren tot ten hoogste vierentwintig uur. De eerste
      volzin is van overeenkomstige toepassing op degene die aanstalten maakt een veiligheidsfunctie te gaan uitoefenen
      dan wel op de uitoefening van zodanige functie toezicht te houden.

      2 De ambtenaar die een verbod als bedoeld in het eerste lid oplegt, legt dit vast in een beschikking die het
      tijdstip van ingang en de duur van het verbod bevat.

      3 Het is degene aan wie een verbod als bedoeld in het eerste lid is opgelegd, verboden een veiligheidsfunctie uit
      te oefenen dan wel op de uitoefening van zodanige functie toezicht te houden, gedurende de tijd waarvoor dat verbod
      geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0034363#Artikel41
