    text: |-
      Het dagelijks bestuur is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of
      krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel43
  - number: '44'
    text: |-
      1 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen een bestuurlijke boete opleggen
      ter zake van overtreding van de bij of krachtens de [artikelen 9, eerste en zevende lid][ref1],
      [10, eerste lid][ref2], [14, eerste lid][ref3], [22, eerste lid][ref4], [23, vierde lid][ref5],
      [24, derde lid][ref6], [25, vierde lid][ref7], [26, derde lid][ref8], [27, zevende lid][ref9],
      [28][ref10], [31, eerste lid][ref11], [32, eerste en zevende lid][ref12], [33, eerste lid][ref13],
      [35, eerste en derde lid][ref14], [37, eerste en tweede lid][ref15], [38 tweede en derde lid][ref16],
      [39][ref17],[ 40, eerste lid en derde lid][ref18], en[ 49, tweede lid][ref19], gestelde voorschriften.

      2 De boete die ten hoogste kan worden opgelegd, bedraagt indien begaan door:

      a. een natuurlijk persoon, niet zijnde een onderneming € 5.700,–;

      b. een onderneming € 225.000,–.

      3 De hoogte van de bestuurlijke boete is in ieder geval afgestemd op de omzet van een onderneming, indien de
      overtreder een onderneming is.

      4 Indien de gegevens omtrent de omzet van een onderneming, bedoeld in het derde lid, niet aan gedeputeerde staten
      onderscheidenlijk het dagelijks bestuur beschikbaar zijn gesteld, kunnen gedeputeerde staten onderscheidenlijk het
      dagelijks bestuur aan degene aan wie de boete wordt opgelegd verzoeken deze gegevens binnen een door hen te stellen
      termijn te verstrekken. Indien de betrokkene niet binnen de gestelde termijn voldoet aan dit verzoek, is de hoogte
      van de boete gelijk aan het maximale boetebedrag, bedoeld in het tweede lid, onderdeel b.

      5 De in het tweede lid genoemde bedragen kunnen elke twee jaar, met ingang van 1 januari van een jaar, bij
      ministeriële regeling worden aangepast aan de ontwikkeling van de consumentenprijsindex sinds de vorige aanpassing
      van deze bedragen. Bij deze aanpassing wordt het geldbedrag van op een veelvoud van € 5,– naar beneden afgerond.


