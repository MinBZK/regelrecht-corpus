  - number: '66'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet aanhangige bezwaar- en beroepschriften tegen
      besluiten op grond van de [Spoorwegwet 1875][ref1], de [Wet aanleg locaalspoor- en tramwegen][ref2],
      de [Locaalspoor- en Tramwegwet][ref3], het [Reglement dienst hoofd- en lokaalspoorwegen][ref4], het
      [Tramwegreglement][ref5] dan wel het [Metroreglement][ref6] worden afgehandeld overeenkomstig het recht zoals dat
      gold voor het tijdstip van inwerkingtreding van deze wet.


