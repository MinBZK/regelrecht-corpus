  - number: '27'
    text: |-
      1 De vervoerder beschikt over een door gedeputeerde staten onderscheidenlijk het dagelijks bestuur verleend
      veiligheidscertificaat.

      2 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur verlenen het veiligheidscertificaat indien de
      vervoerder beschikt over een veiligheidsbeheersysteem dat voldoet aan [artikel 28][ref1].

      3 Bij de aanvraag van een veiligheidscertificaat als bedoeld in het eerste lid wordt een schriftelijke verklaring
      van de toezichthouder overgelegd waarin is beschreven in hoeverre de vervoerder in staat is om bij het voorgenomen
      gebruik van de lokale spoorweg te beschikken over een veiligheidsbeheersysteem dat voldoet aan [artikel 28][ref2].

      4 Een veiligheidscertificaat kan onder beperkingen worden verleend. Aan een veiligheidscertificaat kunnen
      voorschriften worden verbonden in het belang van de veiligheid op en in de directe nabijheid van de lokale
      spoorweg.

      5 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen de beperkingen of voorschriften, verbonden
      aan een veiligheidscertificaat wijzigen in het belang van de veiligheid op en in de directe nabijheid van de lokale
      spoorweg.

      6 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen nadere regels stellen over het vierde lid.

      7 Het is verboden te handelen in strijd met de voorschriften en beperkingen, bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0034363#Artikel28
