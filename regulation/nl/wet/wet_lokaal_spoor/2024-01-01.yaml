  - number: '22'
    text: |-
      1 De beheerder draagt er zorg voor dat werkzaamheden aan en in de directe nabijheid van de lokale spoorweg
      alsmede het met die werkzaamheden samenhangend verkeer veilig plaatsvinden. De beheerder treft maatregelen die
      redelijkerwijs noodzakelijk zijn om te voorkomen dat gevaar kan ontstaan voor:

      a. het verkeer over de lokale spoorweg;

      b. de weggebruikers van de aan de lokale spoorweg grenzende openbare weg;

      c. het verkeer over een aan de lokale spoorweg grenzende hoofdspoorweg of bijzondere spoorweg als bedoeld in
      [artikel 2, eerste lid, van de Spoorwegwet][ref1];

      d. de omwonenden; en

      e. de baanwerkers.

      2 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen regels stellen over de veilige uitvoering van
      de werkzaamheden aan of in de directe nabijheid van de lokale spoorweg.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel2
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '2'
  - number: '23'
    text: |-
      1 Indien de veiligheid van het gebruik of van het beheer van de lokale spoorweginfrastructuur in gevaar komt of
      dreigt te komen, neemt de beheerder passende maatregelen, waaronder zo nodig het geheel of gedeeltelijk buiten
      dienst stellen van de lokale spoorweg.

      2 De beheerder stelt de vervoerder en de toezichthouder onmiddellijk in kennis van de maatregelen, bedoeld in het
      eerste lid.

      3 De beheerder kan de vervoerder aanwijzingen geven:

      a. in het belang van een veilig gebruik van de lokale spoorweginfrastructuur;

      b. ter voorkoming van overmatige slijtage aan de lokale spoorweginfrastructuur; of

      c. in verband met maatregelen als bedoeld in het eerste lid.

      4 De vervoerder volgt de aanwijzingen, bedoeld in het derde lid, op.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel23
  - number: '24'
    text: |-
      1 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur belast de beheerder dan wel een vervoerder met de
      verkeersleiding over de lokale spoorweg.

      2 De verkeersleiding kan bestuurders van een spoorvoertuig aanwijzingen geven met betrekking tot het verrichten van
      veilig en doelmatig vervoer.

      3 Bestuurders van een spoorvoertuig volgen de aanwijzingen van de verkeersleiding op.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de taken van de
      verkeersleiding.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel24
  - number: '25'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld in het belang van de
      verkeersveiligheid op de lokale spoorweg en de daaraan grenzende hoofdspoorwegen of bijzondere spoorwegen, bedoeld
      in [artikel 2, tweede of derde lid, van de Spoorwegwet][ref1], alsmede aan de daaraan grenzende wegen, bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wegenverkeerswet 1994][ref2].

      2 De regels bedoeld in het eerste lid kunnen tevens een verplichting inhouden voor gedeputeerde staten
      onderscheidenlijk het dagelijks bestuur om regels te stellen in het belang van de verkeersveiligheid op de lokale
      spoorweg.

      3 De regels, bedoeld in het eerste lid, kunnen in ieder geval de volgende onderwerpen betreffen:

      a. seingeving;

      b. veiligheidsvoorzieningen en maatregelen;

      c. verlichting en signalering van spoorvoertuigen;

      d. overwegen en spoorbruggen;

      e. verkeersregels en verkeerstekens;

      f. rijvaardigheid en rijbevoegdheid;

      g. verplichtingen van vervoerders, bestuurders van spoorvoertuigen en andere personen die deelnemen aan het verkeer
      over de lokale spoorweg, in verband met storingen, ongevallen, incidenten en andere onregelmatigheden.

      4 Een ieder die zich op de lokale spoorweg bevindt, neemt de regels, bedoeld in het eerste en derde lid in acht.

      5 Indien gedeputeerde staten onderscheidenlijk het dagelijks bestuur niet tevens wegbeheerder zijn van de aan
      de lokale spoorweg grenzende weg, treft het openbaar lichaam dat het beheer heeft over de weg of, indien geen
      openbaar lichaam het beheer heeft, de eigenaar van de weg, op verzoek van gedeputeerde staten onderscheidenlijk het
      dagelijks bestuur de maatregelen die door gedeputeerde staten onderscheidenlijk het dagelijks bestuur noodzakelijk
      worden geacht voor het veilig verkeer op de lokale spoorweg.

      6 De maatregelen, bedoeld in het vijfde lid, betreffen:

      a. de plaatsing of verwijdering van verkeerstekens of onderborden; of

      b. het treffen van maatregelen op of aan de weg tot wijziging van de inrichting van de weg of tot het aanbrengen of
      verwijderen van voorzieningen ter regeling van het verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel25
