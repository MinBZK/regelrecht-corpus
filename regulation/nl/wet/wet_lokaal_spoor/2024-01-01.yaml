  - number: 19a
    text: |-
      De infrastructuurbeheerder is verantwoordelijk voor zijn eigen beheer, bestuur en interne controle en neemt hierbij
      het heffings- en toewijzingskader en de specifieke regels die door de lidstaten zijn opgesteld, in acht.
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel19a
  - number: '20'
    text: |-
      1 De lokale spoorweginfrastructuur waarover vervoer wordt verricht wordt door de beheerder zodanig beheerd dat de
      lokale spoorweginfrastructuur blijft voldoen aan de [artikelen 5][ref1] en [6][ref2].

      2 Van ernstige incidenten doet de beheerder onmiddellijk melding aan de toezichthouder.

      3 De beheerder stemt het beheer van de lokale spoorweg af met:

      a. de beheerder van een daaraan grenzende lokale spoorweg;

      b. de beheerder van een daaraan grenzende hoofdspoorweg of bijzondere spoorweg als bedoeld in
      [artikel 2, eerste lid, van de Spoorwegwet][ref3]; of

      c. de wegbeheerder van een daaraan grenzende weg.

      4 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen de beheerder bindende aanwijzingen geven met
      betrekking tot het beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0034363#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel2
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel20
