  - number: '63'
    text: |-
      Een vergunning, toestemming of ontheffing, die betrekking heeft op een lokale spoorweg en die is verleend
      op grond van [artikel 19 van de Spoorwegwet][ref1], [artikel 39 van de Spoorwegwet 1875][ref2], de
      [artikelen 14, derde lid][ref3], of [15 van het Reglement dienst hoofd- en lokaalspoorwegen][ref4],
      de [artikelen 5, tweede lid][ref5], of [14, derde lid, van het Tramwegreglement][ref6], dan wel de
      [artikelen 12, derde lid][ref7], of [15 van het Metroreglement][ref8], en die onmiddellijk voorafgaand aan het
      tijdstip van inwerkingtreding van [artikel 12][ref9] van kracht en onherroepelijk is, wordt gelijkgesteld met een
      vergunning als bedoeld in artikel 12.


