        artikel: '5'
        hoofdstuk: '2'
  - number: '9'
    text: |-
      1 Het is verboden om lokale spoorweginfrastructuur in dienst te stellen zonder dat daarvoor een vergunning voor
      indienststelling is verleend door gedeputeerde staten onderscheidenlijk het dagelijks bestuur.

      2 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur verlenen de vergunning, bedoeld in het eerste lid,
      indien de lokale spoorweginfrastructuur voldoet aan de [artikelen 5][ref1] en [6, eerste lid][ref2].

      3 Bij de aanvraag van een vergunning als bedoeld in het eerste lid wordt een schriftelijke verklaring van
      de toezichthouder overlegd waarin is beschreven in hoeverre de lokale spoorweginfrastructuur voldoet aan de
      [artikelen 5][ref3] en [6, eerste lid][ref4].

      4 Een vergunning als bedoeld in het eerste lid kan onder beperkingen worden verleend. Aan een vergunning kunnen
      voorschriften worden verbonden in het belang van de veiligheid op en in de directe nabijheid van de lokale
      spoorweg.

      5 De beheerder levert ten behoeve van de verklaring, bedoeld in het derde lid, aan gedeputeerde staten
      onderscheidenlijk het dagelijks bestuur en aan de toezichthouder een informatiedossier aan waarin de technische
      specificaties van de lokale spoorweginfrastructuur worden beschreven en gedocumenteerd en waaruit blijkt dat de
      lokale spoorweginfrastructuur voldoet aan de [artikelen 5][ref5] en [6, eerste lid][ref6].

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld over de schriftelijke verklaring, bedoeld in het
      derde lid en het informatiedossier, bedoeld in het vijfde lid.

      7 Het is verboden te handelen in strijd met de voorschriften en beperkingen, bedoeld in het vierde lid.


