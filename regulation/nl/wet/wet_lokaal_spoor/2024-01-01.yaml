  - number: '21'
    text: |-
      1 De beheerder stelt, na overleg met de vervoerder en andere rechthebbenden op de lokale spoorweginfrastructuur
      jaarlijks ter uitvoering van de visie, bedoeld in [artikel 17][ref1], een beheerplan op.

      2 Het beheerplan behoeft de instemming van gedeputeerde staten onderscheidenlijk het dagelijks bestuur.

      3 De beheerder legt jaarlijks voor 1 april aan gedeputeerde staten onderscheidenlijk het dagelijks bestuur in een
      jaarverslag verantwoording af over de uitoefening van zijn taken in het afgelopen kalenderjaar.

      4 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen in de voorschriften, bedoeld in
      [artikel 18, zesde lid][ref2], eisen stellen aan de inhoud en de procedure van totstandkoming van het beheerplan
      alsmede aan het jaarverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0034363#Artikel18
