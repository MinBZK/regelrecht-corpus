  - number: '26'
    text: |-
      1 Het is verboden met een spoorvoertuig over een lokale spoorweg te rijden zonder:

      a. een geldig veiligheidscertificaat als bedoeld in [artikel 27][ref1];

      b. een met de beheerder gesloten toegangsovereenkomst als bedoeld in [artikel 30][ref2]; en

      c. voldoende verzekerd te zijn tegen de financiële risico’s die voortvloeien uit de wettelijke aansprakelijkheid
      als vervoerder. [Artikel 6 van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref3] is van overeenkomstige
      toepassing.

      2 Het eerste lid, onderdeel a, is niet van toepassing op:

      a. het verrichten van proefritten met het oog op het opdoen van ervaring met spoorvoertuigen of het testen van
      procedures in het kader van het veiligheidsbeheersysteem; of

      b. het verkeer dat wordt verricht in het kader van de uitvoering van de beheertaken, bedoeld in
      [hoofdstuk 3][ref4].

      3 Het is verboden om tijdens het verkeer, bedoeld in het tweede lid, reizigers te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0034363#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0034363#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0034363#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0034363/2024-01-01#Artikel26
