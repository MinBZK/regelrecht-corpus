---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.4/schema/v0.5.4/schema.json
$id: regeling_verdeling_premiekorting_wao
regulatory_layer: WET
publication_date: '2005-12-13'
valid_from: '2002-08-22'
valid_to: '2005-12-31'
bwb_id: BWBR0013962
url: https://wetten.overheid.nl/BWBR0013962/2002-08-22
preamble:
  text: |-
    Gelet op artikel 79b, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013962/2002-08-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De premiekorting, bedoeld in
      [artikel 79b, eerste, tweede en derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt
      toegekend op de basispremie.

      2 Voorzover de werkgever, bedoeld in
      [artikel 79b, eerste, tweede en derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2], minder
      basispremie verschuldigd is dan de hem toegekende premiekorting, wordt de resterende premiekorting toegekend op de
      gedifferentieerde premie voorzover de werkgever deze premie verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel79b
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel79b
    url: https://wetten.overheid.nl/BWBR0013962/2002-08-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 79b
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 79b
    machine_readable:
      inputs:
        - premiekorting
        - basispremie
        - gedifferentieerde_premie
      outputs:
        - toegekende_premiekorting_basispremie
        - toegekende_premiekorting_gedifferentieerde_premie
      logic:
        - IF:
            condition:
              GREATER_THAN:
                left: premiekorting
                right: basispremie
            then:
              - SET:
                  name: toegekende_premiekorting_basispremie
                  value: basispremie
              - SET:
                  name: toegekende_premiekorting_gedifferentieerde_premie
                  value:
                    SUBTRACT:
                      left: premiekorting
                      right: basispremie
            else:
              - SET:
                  name: toegekende_premiekorting_basispremie
                  value: premiekorting
              - SET:
                  name: toegekende_premiekorting_gedifferentieerde_premie
                  value: 0
  - number: '2'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0013962/2002-08-22#Artikel2
