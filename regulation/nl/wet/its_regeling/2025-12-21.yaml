preamble:
  text: |-
    Gelet op de artikelen 3, aanhef en onder c en e in samenhang met 6, eerste lid van de richtlijn 2010/40/EU
    van het Europees Parlement en de Raad van 7 juli 2010 betreffende het kader voor het invoeren van intelligente
    vervoerssystemen op het gebied van wegvervoer en voor interfaces met andere vervoerswijzen (PbEU 2010, L 207),
    de artikelen 1, 3, 5, derde lid, en 8, eerste lid, van de gedelegeerde verordening (EU) nr. 885/2013 van de
    Commissie van 15 mei 2013 ter aanvulling van Richtlijn 2010/40/EU van het Europees Parlement en de Raad met
    betrekking tot het verstrekken van informatiediensten voor veilige en beveiligde parkeerplaatsen voor vrachtwagens
    en bedrijfsvoertuigen (PbEU 2013, L 247), de artikelen 1, 5, eerste lid, 7, tweede lid, en 9, eerste lid van de
    gedelegeerde verordening (EU) nr. 886/2013 van de Commissie van 15 mei 2013 tot aanvulling van Richtlijn 2010/40/
    EU van het Europees Parlement en de Raad met betrekking tot de gegevens en procedures voor het aanbieden, waar
    mogelijk, van minimale universele verkeersveiligheidsinformatie die kosteloos is voor de gebruikers (PbEU 2013,
    L 247), en op de artikelen 4b, tweede lid, aanhef en onder b, en 145g, tweede lid, van de Wegenverkeerswet 1994;

    BESLUIT:
  url: https://wetten.overheid.nl/BWBR0036478/2025-12-21#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *gedelegeerde verordening (EU) 885/2013:* gedelegeerde verordening (EU) nr. 885/2013 van de Commissie van 15 mei
      2013 ter aanvulling van [Richtlijn 2010/40](32010L0040)/EU van het Europees Parlement en de Raad met betrekking
      tot het verstrekken van informatiediensten voor veilige en beveiligde parkeerplaatsen voor vrachtwagens en
      bedrijfsvoertuigen (PbEU 2013, L 247);
        - *gedelegeerde verordening (EU) 886/2013:* gedelegeerde verordening (EU) nr. 886/2013 van de commissie van 15 mei
      2013 tot aanvulling van [richtlijn 2010/40](32010L0040)/EU van het Europees Parlement en de Raad met betrekking tot
      de gegevens en procedures voor het aanbieden, waar mogelijk, van minimale universele verkeersveiligheidsinformatie
      die kosteloos is voor de gebruikers (PbEU 2013, L 247);
        - *gedelegeerde verordening (EU) 2017/1926:* gedelegeerde [verordening (EU) nr. 2017/1926](32017R1926) van de
      Commissie van 31 mei 2017 tot aanvulling van [Richtlijn 2010/40/EU](32010L0040) van het Europees Parlement en de
      Raad met betrekking tot het aanbieden van EU-brede multimodale reisinformatiediensten (PbEU 2017, L 272);
        - *gedelegeerde verordening (EU) 2022/670:* gedelegeerde [verordening (EU) nr. 2022/670](32022R0670) van de
      Commissie van 2 februari 2022 ter aanvulling van [Richtlijn 2010/40/EU](32010L0040) van het Europees Parlement en
      de Raad wat betreft de verlening van EU-wijde realtimeverkeersinformatiediensten (PbEU 2022, L 122).
    url: https://wetten.overheid.nl/BWBR0036478/2025-12-21#Artikel1.1
  - number: '2.1'
    text: |-
      1 De Minister van Infrastructuur en Waterstaat is belast met het beheer van het nationaal toegangspunt, bedoeld in:

      a. artikel 5, derde lid, van gedelegeerde [verordening (EU) 885/2013](32013R0885);

      b. artikel 7, tweede lid, van gedelegeerde [verordening (EU) 886/2013](32013R0886).

      2 De Minister van Infrastructuur en Waterstaat is het nationaal toegangspunt, bedoeld in:

      a. artikel 3, eerste lid, van de gedelegeerde [verordening (EU) 2017/1926](32017R1926);

      b. artikel 3, eerste lid, van de gedelegeerde [verordening (EU) 2022/670](32022R0670).
    url: https://wetten.overheid.nl/BWBR0036478/2025-12-21#Artikel2.1
  - number: '3.1'
    text: |-
      De minimale universele verkeersveiligheidsinformatiedienst, bedoeld in artikel 2, onderdeel l, van gedelegeerde
      verordening (EU) 886/2013, met inachtneming van de in die verordening gestelde eisen, is van toepassing op de in
      [bijlage 1][ref1] vastgestelde wegvakken.


      [ref1]: https://wetten.overheid.nl/BWBR0036478
    url: https://wetten.overheid.nl/BWBR0036478/2025-12-21#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0036478
  - number: '4.1'
    text: |-
      De informatiediensten over veilige en beveiligde parkeerplaatsen, bedoeld in artikel 3, eerste lid, van
      gedelegeerde verordening (EU) 885/2013, met inachtneming van de in die verordening gestelde eisen, zijn van
      toepassing in de in [bijlage 2][ref1] vastgestelde zones.


      [ref1]: https://wetten.overheid.nl/BWBR0036478
    url: https://wetten.overheid.nl/BWBR0036478/2025-12-21#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0036478
  - number: '4.3'
    text: |-
      De verplichting tot beschikbaarheid van gegevens inzake intelligente vervoerssystemen, indien de onderliggende
      informatie reeds bestaat, als bedoeld in artikel 6 bis van [Richtlijn 2010/40/EU](32010L0040), met inachtneming
      van de in die richtlijn gestelde eisen, is van toepassing op de in [bijlage 3][ref1] van deze regeling vastgestelde
      gegevenstypen en geografische dekking.


      [ref1]: https://wetten.overheid.nl/BWBR0036478
    url: https://wetten.overheid.nl/BWBR0036478/2025-12-21#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0036478
  - number: '4.4'
    text: |-
      De verplichting als bedoeld in [artikel 4.3][ref1] van deze regeling wordt uitgevoerd door de partijen waarop de
      verplichting rust tot het toegankelijk maken van gegevenstypen waarop de gedelegeerde verordeningen als bedoeld in
      [artikel 1.1][ref2] van deze regeling van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0036478#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0036478#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0036478/2025-12-21#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0036478
        artikel: '4.3'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0036478
        artikel: '1.1'
        paragraaf: '1'
  - number: '4.5'
    text: |-
      Dienstverleners verwerken en integreren gegevens over minimale universele verkeersveiligheidsinformatiediensten
      die door de bevoegde autoriteiten zijn ingevoerd in de relevante diensten die zij aan eindgebruikers verstrekken,
      zonder extra kosten, mits deze voldoen aan de tussen de bevoegde autoriteiten en dienstverleners overeengekomen
      minimale kwaliteitseisen en via het nationaal toegangspunt als bedoeld in [artikel 2.1][ref1] van deze regeling in
      een digitaal machineleesbaar formaat toegankelijk zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0036478#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0036478/2025-12-21#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0036478
        artikel: '2.1'
        paragraaf: '2'
  - number: '4.6'
    text: |-
      De verplichting als bedoeld in [artikel 4.5][ref1] van deze regeling is van toepassing op de in [bijlage 3][ref2]
      van deze regeling vastgestelde geografische dekking.


      [ref1]: https://wetten.overheid.nl/BWBR0036478#Artikel4.5
      [ref2]: https://wetten.overheid.nl/BWBR0036478
    url: https://wetten.overheid.nl/BWBR0036478/2025-12-21#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0036478
        artikel: '4.5'
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0036478
  - number: '5.2'
    text: Deze regeling treedt in werking met ingang van 1 juli 2015.
    url: https://wetten.overheid.nl/BWBR0036478/2025-12-21#Artikel5.2
  - number: '5.3'
    text: 'Deze regeling wordt aangehaald als: ITS-Regeling.'
    url: https://wetten.overheid.nl/BWBR0036478/2025-12-21#Artikel5.3
