$id: its_regeling
regulatory_layer: WET
publication_date: '2025-11-18'
valid_from: '2017-07-13'
bwb_id: BWBR0036478
url: https://wetten.overheid.nl/BWBR0036478/2017-07-13
preamble:
  text: |-
    Gelet op de artikelen 3, aanhef en onder c en e in samenhang met 6, eerste lid van de richtlijn 2010/40/EU
    van het Europees Parlement en de Raad van 7 juli 2010 betreffende het kader voor het invoeren van intelligente
    vervoerssystemen op het gebied van wegvervoer en voor interfaces met andere vervoerswijzen (PbEU 2010, L 207),
    de artikelen 1, 3, 5, derde lid, en 8, eerste lid, van de gedelegeerde verordening (EU) nr. 885/2013 van de
    Commissie van 15 mei 2013 ter aanvulling van Richtlijn 2010/40/EU van het Europees Parlement en de Raad met
    betrekking tot het verstrekken van informatiediensten voor veilige en beveiligde parkeerplaatsen voor vrachtwagens
    en bedrijfsvoertuigen (PbEU 2013, L 247), de artikelen 1, 5, eerste lid, 7, tweede lid, en 9, eerste lid van de
    gedelegeerde verordening (EU) nr. 886/2013 van de Commissie van 15 mei 2013 tot aanvulling van Richtlijn 2010/40/
    EU van het Europees Parlement en de Raad met betrekking tot de gegevens en procedures voor het aanbieden, waar
    mogelijk, van minimale universele verkeersveiligheidsinformatie die kosteloos is voor de gebruikers (PbEU 2013, L
    247), en op de artikelen 4b, tweede lid, aanhef en onder b, en 145g, tweede lid, van de Wegenverkeerswet 1994;

    BESLUIT:
  url: https://wetten.overheid.nl/BWBR0036478/2017-07-13#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *gedelegeerde verordening (EU) 885/2013:* gedelegeerde verordening
      (EU) nr. 885/2013 van de Commissie van 15 mei 2013 ter aanvulling van [Richtlijn 2010/40](32010L0040)/EU van het
      Europees Parlement en de Raad met betrekking tot het verstrekken van informatiediensten voor veilige en beveiligde
      parkeerplaatsen voor vrachtwagens en bedrijfsvoertuigen (PbEU 2013, L 247);
        - *gedelegeerde verordening (EU) 886/2013:* gedelegeerde verordening (EU) nr. 886/2013 van de commissie van 15 mei
      2013 tot aanvulling van [richtlijn 2010/40](32010L0040)/EU van het Europees Parlement en de Raad met betrekking tot
      de gegevens en procedures voor het aanbieden, waar mogelijk, van minimale universele verkeersveiligheidsinformatie
      die kosteloos is voor de gebruikers (PbEU 2013, L 247);
        - *gedelegeerde verordening (EU) 2015/962:* gedelegeerde verordening (EU) nr. 2015/962 van de Commissie van 18
      december 2014 ter aanvulling van [Richtlijn 2010/40](32010L0040)/EU van het Europees Parlement en de Raad wat de
      verlening van EU-wijde realtimeverkeersinformatiediensten betreft (PbEU 2015, L 157).
    url: https://wetten.overheid.nl/BWBR0036478/2017-07-13#Artikel1.1
  - number: '2.1'
    text: |-
      Gedelegeerde verordening (EU) 2015/962 is van toepassing op de in [bijlage 1][ref1] vastgestelde wegvakken.


      [ref1]: https://wetten.overheid.nl/BWBR0036478
    url: https://wetten.overheid.nl/BWBR0036478/2017-07-13#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0036478
  - number: '2.2'
    text: |-
      De Nationale Databank Wegverkeersgegevens is het nationaal toegangspunt, bedoeld in artikel 3, eerste lid, van
      gedelegeerde verordening (EU) 2015/962.
    url: https://wetten.overheid.nl/BWBR0036478/2017-07-13#Artikel2.2
  - number: '3.1'
    text: |-
      De minimale universele verkeersveiligheidsinformatiedienst, bedoeld in artikel 2, onderdeel l, van gedelegeerde
      verordening (EU) 886/2013, met inachtneming van de in die verordening gestelde eisen, is van toepassing op de in
      [bijlage 1][ref1] vastgestelde wegvakken.


      [ref1]: https://wetten.overheid.nl/BWBR0036478
    url: https://wetten.overheid.nl/BWBR0036478/2017-07-13#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0036478
  - number: '3.2'
    text: |-
      De Nationale Databank Wegverkeersgegevens is belast met het beheer van het nationale toegangspunt, bedoeld in
      artikel 7, eerste lid, van gedelegeerde verordening (EU) 886/2013.
    url: https://wetten.overheid.nl/BWBR0036478/2017-07-13#Artikel3.2
  - number: '4.1'
    text: |-
      De informatiediensten over veilige en beveiligde parkeerplaatsen, bedoeld in artikel 3, eerste lid, van
      gedelegeerde verordening (EU) 885/2013, met inachtneming van de in die verordening gestelde eisen, zijn van
      toepassing in de in [bijlage 2][ref1] vastgestelde zones.


      [ref1]: https://wetten.overheid.nl/BWBR0036478
    url: https://wetten.overheid.nl/BWBR0036478/2017-07-13#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0036478
  - number: '4.2'
    text: |-
      De Nationale Databank Wegverkeersgegevens is belast met het beheer van het nationale toegangspunt, bedoeld in
      artikel 5, derde lid, van gedelegeerde verordening (EU) 885/2013.
    url: https://wetten.overheid.nl/BWBR0036478/2017-07-13#Artikel4.2
  - number: '5.2'
    text: Deze regeling treedt in werking met ingang van 1 juli 2015.
    url: https://wetten.overheid.nl/BWBR0036478/2017-07-13#Artikel5.2
  - number: '5.3'
    text: 'Deze regeling wordt aangehaald als: ITS-Regeling.'
    url: https://wetten.overheid.nl/BWBR0036478/2017-07-13#Artikel5.3
