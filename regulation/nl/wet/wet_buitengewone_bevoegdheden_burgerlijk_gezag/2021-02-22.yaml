  - number: '28'
    text: |-
      1 Onze Minister van Veiligheid en Justitie kan, indien bij nader onderzoek blijkt dat een internering ten onrechte
      heeft plaatsgevonden, op verzoek van een gewezen geïnterneerde of diens erfgenamen naar billijkheid een geldelijke
      tegemoetkoming toekennen voor de schade die de gewezen geïnterneerde als onmiddellijk gevolg van de internering
      heeft geleden.

      2 Het daartoe strekkend verzoek wordt slechts in behandeling genomen, indien het is ingediend binnen drie maanden
      na de dag waarop de invrijheidstelling of het overlijden tijdens de internering heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel28
  - number: '29'
    text: |-
      Onze Minister van Veiligheid en Justitie is bevoegd tot toepassing van bestuursdwang ter handhaving van zijn
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel29
  - number: '30'
    text: |-
      1 Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft:

      a. hij die in strijd handelt met een verbod als bedoeld in [artikel 12][ref1];

      b. hij die in strijd handelt met een beperking, bevel of verbod als bedoeld in [de artikelen 8, eerste lid][ref2],
      en [9, eerste lid][ref3];

      c. hij die in strijd handelt met een beperking of een verbod als bedoeld in [artikel 17, eerste lid][ref4];

      d. hij die in strijd handelt met een bepaling of een verbod als bedoeld in [artikel 13][ref5];

      e. hij die in strijd handelt met een bepaling of een verbod als bedoeld in [het eerste lid van artikel 11][ref6],
      of een voorwaarde als bedoeld in het tweede lid van dat artikel, niet nakomt.

      2 Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft hij die
      opzettelijk in strijd handelt met een bevel of verbod als bedoeld in [artikel 9][ref7].

      3 De feiten, in het eerste lid strafbaar gesteld, worden beschouwd als overtredingen, die in het tweede lid
      strafbaar gesteld, als misdrijven.


