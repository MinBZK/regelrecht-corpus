  - number: '17'
    text: |-
      1 De autoriteiten die daartoe door Onze Minister van Veiligheid en Justitie zijn aangewezen, zijn bevoegd alle
      voorwerpen ten aanzien waarvan ernstig vermoeden bestaat dat zij zullen dienen tot verstoring van de openbare orde
      en veiligheid, of waaruit aanwijzingen kunnen worden verkregen omtrent een mogelijke verstoring van de openbare
      orde, te onderzoeken, in beslag te nemen, dan wel het gebruik daarvan te beperken of geheel te verbieden.

      2 Van elke inbeslagneming wordt proces-verbaal opgemaakt. Dit proces-verbaal, dat mede de redenen van de
      inbeslagneming vermeldt, wordt binnen tweemaal vierentwintig uren aan Onze Minister van Veiligheid en Justitie
      en aan de belanghebbende in afschrift medegedeeld, voor zover mededeling aan de belanghebbende niet strijdig kan
      worden geoordeeld met het belang van de staat. Voorts wordt van elke beperking en elk verbod aan Onze voornoemde
      Minister onverwijld kennis gegeven, onder opgave van de redenen die tot deze maatregel hebben geleid.

      3 Tegen elke inbeslagneming, elke beperking of elk verbod kan door belanghebbenden beroep worden ingesteld bij Onze
      Minister van Veiligheid en Justitie. Onze Minister beslist hierop zo spoedig mogelijk, doch in elk geval binnen
      acht weken.

      4 Bij regeling van Onze Minister van Veiligheid en Justitie worden nadere regels gegeven met betrekking tot de
      uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel17
  - number: '18'
    text: |-
      1 Indien de omstandigheden die tot de afkondiging van de algemene noodtoestand hebben geleid, een bedreiging
      voor het volksbestaan inhouden, zijn Onze Minister van Veiligheid en Justitie en, indien onverwijld ingrijpen
      noodzakelijk is, de commissaris van de Koning bevoegd iedere persoon ten aanzien van wie gegrond vermoeden bestaat
      dat hij de openbare orde en veiligheid in gevaar zal brengen, te interneren.

      2 De geïnterneerde wordt zo spoedig mogelijk in kennis gesteld van de redenen van zijn internering, voor zover
      het belang van de staat zich hiertegen niet verzet, en wordt hierover zo mogelijk gehoord. Van elke internering
      wordt proces-verbaal opgemaakt. In dit proces-verbaal, dat mede de redenen van de internering vermeldt, wordt de
      verklaring van de geïnterneerde of de reden van het ontbreken daarvan opgenomen.

      3 Het proces-verbaal wordt binnen tweemaal vierentwintig uren in afschrift toegezonden aan Onze Minister
      van Veiligheid en Justitie, aan de rechtbank van de plaats waar de geïnterneerde geïnterneerd is, en aan de
      geïnterneerde. Voor zover mededeling van de redenen van de internering aan de geïnterneerde strijdig wordt
      geoordeeld met het belang van de staat, worden deze in het voor hem bestemde afschrift niet opgenomen. Bij
      de toezending van het afschrift aan de geïnterneerde wordt mededeling gedaan van het recht een verzoekschrift
      overeenkomstig [artikel 19][ref1] in te dienen en om aanwijzing van een raadsman te verzoeken.

      4 Op verzoek van de rechtbank zendt Onze Minister van Veiligheid en Justitie haar alle ter zake dienende stukken en
      verschaft hij haar mondeling alle gevraagde inlichtingen. Onze voornoemde Minister is bevoegd bij het verschaffen
      van schriftelijke en mondelinge gegevens te bepalen dat het belang van de staat zich verzet tegen kennisneming
      daarvan door anderen dan de rechtbank.

      5 Op verzoek van de geïnterneerde die geen raadsman heeft, wordt voor hem een raadsman aangewezen. De
      [artikelen 37][ref2], [38][ref3] en [43 tot en met 45 van het Wetboek van Strafvordering][ref4] zijn van
      overeenkomstige toepassing.

      6 De geïnterneerde heeft recht op kennisneming van de processtukken, behoudens voor zover het bepaalde in de
      laatste volzin van het vierde lid toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel43
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel18
