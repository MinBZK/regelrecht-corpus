  - number: '23'
    text: |-
      In het bestuur van de goederen van de geïnterneerde en het waarnemen van diens belangen wordt zonodig voorzien op
      de wijze voorgeschreven in [afdeling 1 van titel 18 van Boek 1 van het Burgerlijk Wetboek][ref1]. Te dien einde
      wordt aan de officier van justitie in het arrondissement van de woonplaats van de geïnterneerde onverwijld kennis
      gegeven van de internering. [Artikel 9, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0007982#Artikel9
