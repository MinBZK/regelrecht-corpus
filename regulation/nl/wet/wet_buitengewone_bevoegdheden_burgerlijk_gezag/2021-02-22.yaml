  - number: '20'
    text: |-
      De rechtbank is bevoegd een verzoekschrift niet in behandeling te nemen, indien binnen twee maanden voorafgaand
      aan de indiening op een eerder verzoekschrift ter zake van dezelfde internering is beslist, tenzij uit het latere
      verzoekschrift blijkt van nieuwe feiten of omstandigheden.
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel20
  - number: '21'
    text: |-
      1 De rechtbank is bevoegd ambtshalve te beslissen over de rechtmatigheid van een internering.

      2 Daartoe hoort zij de geïnterneerde en stelt zij Onze Minister van Veiligheid en Justitie in de gelegenheid de
      redenen van de internering nader toe te lichten.

      3 [Artikel 19, derde tot en met twaalfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel19
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007982
        artikel: '19'
        hoofdstuk: II
  - number: '22'
    text: |-
      1 Tegen een beslissing van de rechtbank genomen op grond van [artikel 19, elfde lid][ref1], of
      [artikel 21, eerste lid][ref2], kan binnen twee maanden na verzending van de beschikking beroep in cassatie worden
      ingesteld door de geïnterneerde en Onze Minister van Veiligheid en Justitie. De [artikelen 426][ref3] zijn op de
      behandeling van dit beroep van toepassing.

      2 Tegen een afwijzende beslissing ingevolge [artikel 19, derde lid][ref4], staat beroep in cassatie slechts open
      gelijktijdig met dat tegen een in het eerste lid bedoelde beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0007982#Artikel21
