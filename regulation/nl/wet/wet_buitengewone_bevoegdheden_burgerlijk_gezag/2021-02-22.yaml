preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de totstandkoming van de Coördinatiewet
    uitzonderingstoestanden wenselijk is de regels met betrekking tot buitengewone bevoegdheden van burgerlijk gezag
    opnieuw vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, [de artikelen 5][ref3],
      [6][ref4], [7][ref5], [8, eerste en derde lid][ref6], [9, eerste, tweede, derde en vijfde lid][ref7], en
      [10][ref8] gezamenlijk of afzonderlijk in werking worden gesteld.

      2 Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij het in het eerste lid bedoelde besluit in werking
      gestelde bepalingen.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.

      6 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.


