  - number: '27'
    text: |-
      In zaken betreffende een verzoek als bedoeld in [artikel 19, eerste lid][ref1], en betreffende beroep in cassatie
      als bedoeld in [artikel 22][ref2] is geen griffierecht ingevolge de [Wet griffierechten burgerlijke zaken][ref3]
      verschuldigd.


