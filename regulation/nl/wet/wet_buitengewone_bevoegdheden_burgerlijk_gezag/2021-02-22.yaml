  - number: '19'
    text: |-
      1 De geïnterneerde kan de in [artikel 18, derde lid][ref1], bedoelde rechtbank schriftelijk verzoeken te beslissen
      over de rechtmatigheid van de internering en zijn invrijheidstelling te gelasten. De rechtbank hoort hem zo spoedig
      mogelijk, doch uiterlijk binnen een maand na de indiening van het verzoekschrift.

      2 Onze Minister van Veiligheid en Justitie wordt in de gelegenheid gesteld de redenen van de internering nader toe
      te lichten.

      3 De rechtbank kan hetzij ambtshalve, hetzij op verzoek van de geïnterneerde of van Onze Minister van Veiligheid
      en Justitie, bepaalde personen als getuige of deskundige oproepen. Zij kan zonodig tolken oproepen. Een verzoek tot
      het horen van bepaalde getuigen of deskundigen kan slechts bij gemotiveerde beslissing worden afgewezen.

      4 De oproepingen geschieden door de griffier bij aangetekende brief, tenzij de rechtbank een andere wijze van
      oproepen beveelt.

      5 De rechtbank kan bevelen dat getuigen, deskundigen of tolken die, hoewel wettelijk opgeroepen, niet zijn
      verschenen, door de openbare macht voor haar worden gebracht om aan hun verplichtingen te voldoen.

      6 Een ieder is verplicht, daartoe op wettige wijze opgeroepen, getuigenis af te leggen. Van deze verplichting
      kunnen zich verschonen:

      a. de bloed- of aanverwanten van de geïnterneerde in de rechte lijn, de bloed- of aanverwanten van de geïnterneerde
      in de zijlijn tot de derde graad ingesloten en de echtgenoot of vroegere echtgenoot van de geïnterneerde;

      b. zij die tot geheimhouding verplicht zijn uit hoofde van hun ambt, beroep of betrekking omtrent hetgeen hun in
      die hoedanigheid is toevertrouwd.

      7 De getuige kan zich verschonen van het beantwoorden van een hem gestelde vraag, indien hij daardoor of zichzelf,
      of een van zijn bloed- of aanverwanten in de rechte lijn of in de zijlijn tot de derde graad ingesloten of zijn
      echtgenoot of vroegere echtgenoot aan het gevaar van een strafrechtelijke veroordeling ter zake van een misdrijf
      zou blootstellen.

      8 De rechtbank kan bevelen dat getuigen niet zullen worden gehoord dan na het afleggen van een eed of belofte.
      De getuige legt in dat geval in handen van de voorzitter de eed of belofte af dat hij de waarheid en niets dan de
      waarheid zal zeggen.

      9 Getuigen, deskundigen en tolken, opgeroepen ingevolge het derde lid, ontvangen desverlangd voor reis- en
      verblijfkosten alsmede wegens tijdverzuim en daarmee verband houdende noodzakelijke kosten, een vergoeding uit ’s
      Rijks kas overeenkomstig het bij of krachtens de [Wet griffierechten burgerlijke zaken][ref2] bepaalde.

      10 De behandeling geschiedt ter openbare terechtziting, maar de rechtbank kan gehele of gedeeltelijke behandeling
      met gesloten deuren bevelen in het belang van de openbare orde of ’s lands veiligheid, of ter bescherming van de
      persoonlijke levenssfeer van de geïnterneerde. De uitspraak geschiedt in het openbaar.

      11 De rechtbank beslist zo spoedig mogelijk op het verzoekschrift, doch uiterlijk binnen twee maanden na de
      indiening daarvan. Deze termijn kan met ten hoogste een maand worden verlengd. De beschikking van de rechtbank is
      met redenen omkleed, behoudens voor zover het belang van de staat zich tegen vermelding van deze redenen verzet.
      Indien de rechtbank de internering onrechtmatig oordeelt, gelast zij de onmiddellijke invrijheidstelling.

      12 De griffier verzendt terstond een afschrift van de beschikking aan de geïnterneerde en aan Onze Minister
      van Veiligheid en Justitie. De aan de geïnterneerde en aan de Minister gezonden afschriften van de beschikking
      vermelden de datum van verzending.


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel19
