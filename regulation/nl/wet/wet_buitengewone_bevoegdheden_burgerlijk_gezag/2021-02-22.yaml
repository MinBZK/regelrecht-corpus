  - number: '11'
    text: |-
      1 De burgemeester is bevoegd te bepalen dat geen samenkomsten of vergaderingen op openbare plaatsen, geen
      samenkomsten of vergaderingen van meer dan tien personen op andere dan openbare plaatsen of geen betogingen zullen
      worden gehouden dan met zijn schriftelijke vergunning.

      2 Aan de vergunning kunnen beperkingen en voorschriften worden verbonden.

      3 Elke samenkomst, vergadering of betoging gaat, ook indien voor het houden daarvan vergunning is gegeven, op door
      of namens de burgemeester gedane vordering terstond uiteen.

      4 Het eerste tot en met derde lid is niet van toepassing op samenkomsten tot het belijden van godsdienst of
      levensovertuiging op andere dan openbare plaatsen.
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel11
  - number: '12'
    text: |-
      Onze Minister van Veiligheid en Justitie is bevoegd de vertoning in het openbaar, dan wel in tegenwoordigheid van
      meer dan tien personen van alle, dan wel van door Onze voornoemde Minister niet met name toegelaten films voor een
      door hem daarbij te bepalen tijdsduur te verbieden.
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel12
  - number: '13'
    text: |-
      1 Onze Minister van Veiligheid en Justitie is bevoegd beperkende bepalingen vast te stellen omtrent het
      vervaardigen, uitgeven, voorhanden hebben, verspreiden, aanbrengen of in de handel brengen van geschriften,
      opschriften, tekeningen of afbeeldingen. Hij kan een en ander ten aanzien van bepaalde geschriften, opschriften,
      tekeningen of afbeeldingen geheel verbieden.

      2 De daartoe strekkende regelingen van Onze voornoemde Minister worden op een door hem te bepalen wijze
      bekendgemaakt en treden na deze bekendmaking terstond in werking. Deze regels worden in ieder geval geplaatst in
      de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel13
  - number: '14'
    text: |-
      1 De autoriteiten die daartoe door Onze Minister van Veiligheid en Justitie zijn aangewezen, zijn bevoegd elk
      aan de post of aan andere instellingen van vervoer of aan een inrichting van telecommunicatie toevertrouwd
      stuk of bericht in beslag te nemen, af te luisteren of op te nemen, te onderzoeken, achter te houden, geheel of
      gedeeltelijk te vernietigen, te wijzigen, onleesbaar te maken of te verhinderen dat het zijn bestemming bereikt.

      2 Bij regeling van Onze Minister van Veiligheid en Justitie worden nadere regels gegeven met betrekking tot de
      uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel14
  - number: '15'
    text: |-
      1 De burgemeester is bevoegd een ieder aan zijn kleding en degene die de openbare orde en veiligheid verstoort of
      ten aanzien van wie een gegrond vermoeden bestaat dat hij zich daaraan schuldig zal maken, ook aan zijn lichaam
      te onderzoeken.

      2 Bij regeling van Onze Minister van Veiligheid en Justitie worden nadere regels gegeven met betrekking tot de
      uitoefening van de bevoegdheid, bedoeld in het eerste lid.

      3 Indien een of meer van de [artikelen 9 tot en met 53 van de Oorlogswet voor Nederland][ref1] in werking zijn
      gesteld, wordt van de bevoegdheid, bedoeld in het eerste lid, geen gebruik gemaakt jegens militairen.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel9
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel15
