        hoofdstuk: II
  - number: '3'
    text: |-
      De bevoegdheden die deze wet aan organen van burgerlijk gezag toekent, worden slechts uitgeoefend voor zover dit
      met het oog op de handhaving van de openbare orde en veiligheid naar het oordeel van die organen geboden is.
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel3
  - number: '4'
    text: |-
      Onder maatregel wordt in deze wet begrepen een voorschrift, een beslissing alsmede de buitenwerkingstelling van een
      zodanige maatregel of een daarin aangebrachte wijziging.
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister van Veiligheid en Justitie, de commissaris van de Koning en de burgemeester zijn bevoegd, indien
      kennis daarvan naar hun oordeel voor de uitoefening van de in dit hoofdstuk gegeven bevoegdheden noodzakelijk is,
      van een ieder inlichtingen te verlangen en inzage te vorderen van bescheiden alsmede van informatiedragers waarop
      gegevens zijn vastgelegd.

      2 Indien inzage als bedoeld in het eerste lid is gevorderd, kunnen zij teneinde afschriften te maken voor korte
      tijd afgifte vorderen dan wel schriftelijke vastlegging en afgifte vorderen.

      3 Een ieder is verplicht de op grond van het eerste lid verlangde inlichtingen volledig en naar waarheid te
      verstrekken en de op grond van dat lid gevorderde inzage alsmede de op grond van het tweede lid gevorderde afgifte
      dan wel schriftelijke vastlegging en afgifte te verlenen.

      4 Onze Minister van Veiligheid en Justitie, de commissaris van de Koning dan wel de burgemeester bepaalt op welke
      wijze en binnen welke termijn de in het derde lid bedoelde verplichting moet worden nagekomen.

      5 Zij die uit hoofde van hun stand, beroep of ambt tot geheimhouding verplicht zijn, kunnen zich verschonen van
      het verschaffen van inlichtingen, doch uitsluitend voor zover het betreft hetgeen hun in hun hoedanigheid is
      toevertrouwd. Zij kunnen voorts het verlenen van inzage van bescheiden en gegevens, alsmede het verlenen van
      medewerking weigeren, voor zover hun geheimhoudingsplicht zich daartoe uitstrekt.
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel5
  - number: '6'
    text: |-
      1 De commissaris van de Koning en de burgemeester handelen bij de uitoefening van hun bevoegdheden die betrekking
      hebben op de handhaving van de openbare orde en veiligheid, in overeenstemming met de aanwijzingen van Onze
      Minister van Veiligheid en Justitie.

      2 De burgemeester handelt bij de uitoefening van zijn bevoegdheden die betrekking hebben op de handhaving van de
      openbare orde en veiligheid, mede in overeenstemming met de aanwijzingen van de commissaris van de Koning.

      3 Bij twijfel of de bevoegdheden, bedoeld in het eerste en tweede lid, zijn uitgeoefend in overeenstemming met de
      aanwijzingen van Onze voornoemde Minister en van de commissaris van de Koning, verbinden de maatregelen, genomen
      krachtens die bevoegdheden, totdat zij zijn ingetrokken.

      4 Ten aanzien van de voorschriften die op de voet van dit artikel zijn uitgevaardigd, blijft
      [artikel 176, derde tot en met zesde lid, van de Gemeentewet][ref1] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel176
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '176'
  - number: '7'
    text: |-
      1 Onze Minister van Veiligheid en Justitie is bevoegd te voorzien in de uitoefening van de bevoegdheden van
      de commissaris van de Koning en de burgemeester die betrekking hebben op de handhaving van de openbare orde en
      veiligheid, door die uitoefening geheel of ten dele aan zich te trekken dan wel daarmee geheel of ten dele een
      ander orgaan van burgerlijk gezag te belasten.

      2 Indien Onze voornoemde Minister van de bevoegdheid, bedoeld in het eerste lid, gebruik maakt, brengt hij dit
      terstond ter algemene kennis. [Artikel 176, derde tot en met zesde lid, van de Gemeentewet][ref1] blijft in dat
      geval buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel176
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel7
    references:
