  - number: '24'
    text: |-
      1 Onze Minister van Veiligheid en Justitie bepaalt waar de internering geschiedt.

      2 Onze Minister van Veiligheid en Justitie is belast met het beheer van de inrichtingen alwaar de internering
      geschiedt, alsmede met de zorg voor de geïnterneerden.
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel24
  - number: '25'
    text: |-
      Onverminderd de [artikelen 19][ref1], [21][ref2] en [22][ref3] wordt een geïnterneerde in vrijheid gesteld, zodra
      dit naar het oordeel van Onze Minister van Veiligheid en Justitie mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0007982#Artikel21
