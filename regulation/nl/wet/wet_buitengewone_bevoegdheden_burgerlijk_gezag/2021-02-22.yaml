        artikel: '9'
  - number: '16'
    text: |-
      1 De burgemeester is bevoegd alle plaatsen, ook tegen de wil van de rechthebbende, te betreden dan wel door
      ambtenaren van politie of buitengewone opsporingsambtenaren te doen betreden en aldaar onderzoek of een doorzoeking
      te verrichten of door die ambtenaren te doen verrichten, voor zover dat redelijkerwijs voor de vervulling van hun
      taak nodig is. Zo nodig verschaffen zij zich de toegang met behulp van de sterke arm.

      2 De ambtenaren, bedoeld in het eerste lid, zijn bevoegd zich bij het betreden door andere personen te doen
      vergezellen.

      3 Een machtiging als bedoeld in [artikel 2 van de Algemene wet op het binnentreden][ref1] kan worden gegeven voor
      een groter aantal woningen dan bedoeld in [artikel 5, eerste lid, van die wet][ref2]. Het verslag, bedoeld in
      [artikel 10 van de Algemene wet op het binnentreden][ref3], wordt mede toegezonden aan Onze Minister van Veiligheid
      en Justitie.

      4 Bij regeling van Onze Minister van Veiligheid en Justitie worden nadere regels gegeven met betrekking tot de
      uitoefening van de bevoegdheid, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel5
