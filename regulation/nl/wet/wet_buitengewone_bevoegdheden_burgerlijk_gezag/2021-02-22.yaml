        bwb_id: BWBR0005416
        artikel: '176'
  - number: '8'
    text: |-
      1 Onze Minister van Veiligheid en Justitie en de commissaris van de Koning zijn bevoegd het vertoeven in de open
      lucht te beperken.

      2 Bij algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot de uitoefening van de
      bevoegdheid, bedoeld in het eerste lid.

      3 Onze Minister van Veiligheid en Justitie is bevoegd in spoedeisende gevallen regels te geven waarbij wordt
      afgeweken van de regels, bedoeld in het tweede lid, of deze buiten werking worden gesteld. De door Onze voornoemde
      Minister gegeven regels worden op een door hem te bepalen wijze bekendgemaakt en treden na deze bekendmaking
      terstond in werking. Deze regels worden in ieder geval geplaatst in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel8
  - number: '9'
    text: |-
      1 Onze Minister van Veiligheid en Justitie en de commissaris van de Koning zijn bevoegd aan personen ten aanzien
      van wie ernstig vermoeden bestaat dat zij de openbare orde en veiligheid in gevaar zullen brengen, te bevelen een
      gebied te verlaten of te verbieden zich daarheen te begeven of daarin terug te keren.

      2 Onze Minister van Veiligheid en Justitie is bevoegd aan degene op wie het eerste lid is toegepast, een
      tegemoetkoming toe te kennen in de kosten van het levensonderhoud van hem en van degenen in wier onderhoud hij
      voorziet.

      3 Indien iemand ingevolge het eerste lid niet in zijn woonplaats kan verblijven, is Onze Minister van Veiligheid en
      Justitie bevoegd hem op diens verzoek onderdak, verzorging en verpleging voor rekening van het Rijk te verschaffen.

      4 Bij algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot de uitoefening van de
      bevoegdheid, bedoeld in het eerste en tweede lid.

      5 Onze Minister van Veiligheid en Justitie is bevoegd in spoedeisende gevallen regels te geven waarbij wordt
      afgeweken van de regels, bedoeld in het vierde lid, of deze buiten werking worden gesteld. De door Onze voornoemde
      Minister gegeven regels worden op een door hem te bepalen wijze bekendgemaakt en treden na deze bekendmaking
      terstond in werking. Deze regels worden in ieder geval geplaatst in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007982/2021-02-22#Artikel9
  - number: '10'
    text: |-
      1 Onze Minister van Veiligheid en Justitie kan [artikel 56 van de Politiewet 2012][ref1] of afzonderlijke
      artikelleden daarvan voor het gehele land of een gedeelte daarvan buiten werking stellen.

      2 Onze voornoemde Minister treft de nodige voorzieningen met betrekking tot de bijstand van de politie voor het
      geval dat op grond van het eerste lid bepalingen van de [Politiewet 2012][ref2] buiten werking worden gesteld.

      3 Voor zover deze voorzieningen betrekking hebben op bijstand van de politie gedurende situaties waarin op grond
      van [artikel 7, eerste lid][ref3], of [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref4]
      bepalingen uit de [Oorlogswet voor Nederland][ref5] in werking zijn, geschiedt het treffen van deze voorzieningen
      in overeenstemming met Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel56
