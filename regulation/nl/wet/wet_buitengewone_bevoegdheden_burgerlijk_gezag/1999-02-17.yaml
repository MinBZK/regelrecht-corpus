  - number: '1.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij het in het eerste lid bedoelde besluit in werking
      gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel1
  - number: '1.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel1
  - number: '1.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel1
  - number: '1.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel1
  - number: '1.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel1
  - number: '2'
    text: |-
      Zo spoedig mogelijk na het moment waarop bepalingen uit [hoofdstuk II][ref1] buiten werking zijn gesteld, dan
      wel het moment waarop de werking van deze bepalingen van rechtswege is geëindigd, wordt van Onzentwege aan de
      beide kamers der Staten-Generaal mededeling gedaan van hetgeen is verricht ingevolge de bevoegdheden die in die
      bepalingen zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007982#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007982
        hoofdstuk: II
  - number: '3'
    text: |-
      De bevoegdheden die deze wet aan organen van burgerlijk gezag toekent, worden slechts uitgeoefend voor zover dit
      met het oog op de handhaving van de openbare orde en veiligheid naar het oordeel van die organen geboden is.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel3
  - number: '4'
    text: |-
      Onder maatregel wordt in deze wet begrepen een voorschrift, een beslissing alsmede de buitenwerkingstelling van een
      zodanige maatregel of een daarin aangebrachte wijziging.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel4
  - number: '8.1'
    text: |-
      Onze Minister van Veiligheid en Justitie en de commissaris van de Koning zijn bevoegd het vertoeven in de open
      lucht te beperken.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel8
  - number: '8.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot de uitoefening van de
      bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel8
  - number: '8.3'
    text: |-
      Onze Minister van Veiligheid en Justitie is bevoegd in spoedeisende gevallen regels te geven waarbij wordt
      afgeweken van de regels, bedoeld in het tweede lid, of deze buiten werking worden gesteld. De door Onze voornoemde
      Minister gegeven regels worden op een door hem te bepalen wijze bekendgemaakt en treden na deze bekendmaking
      terstond in werking. Deze regels worden in ieder geval geplaatst in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister van Veiligheid en Justitie en de commissaris van de Koning zijn bevoegd aan personen ten aanzien
      van wie ernstig vermoeden bestaat dat zij de openbare orde en veiligheid in gevaar zullen brengen, te bevelen een
      gebied te verlaten of te verbieden zich daarheen te begeven of daarin terug te keren.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister van Veiligheid en Justitie is bevoegd aan degene op wie het eerste lid is toegepast, een
      tegemoetkoming toe te kennen in de kosten van het levensonderhoud van hem en van degenen in wier onderhoud hij
      voorziet.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel9
  - number: '9.3'
    text: |-
      Indien iemand ingevolge het eerste lid niet in zijn woonplaats kan verblijven, is Onze Minister van Veiligheid en
      Justitie bevoegd hem op diens verzoek onderdak, verzorging en verpleging voor rekening van het Rijk te verschaffen.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel9
  - number: '9.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot de uitoefening van de
      bevoegdheid, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel9
  - number: '9.5'
    text: |-
      Onze Minister van Veiligheid en Justitie is bevoegd in spoedeisende gevallen regels te geven waarbij wordt
      afgeweken van de regels, bedoeld in het vierde lid, of deze buiten werking worden gesteld. De door Onze voornoemde
      Minister gegeven regels worden op een door hem te bepalen wijze bekendgemaakt en treden na deze bekendmaking
      terstond in werking. Deze regels worden in ieder geval geplaatst in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel9
  - number: '11.1'
    text: |-
      De burgemeester is bevoegd te bepalen dat geen samenkomsten of vergaderingen op openbare plaatsen, geen
      samenkomsten of vergaderingen van meer dan tien personen op andere dan openbare plaatsen of geen betogingen zullen
      worden gehouden dan met zijn schriftelijke vergunning.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel11
  - number: '11.2'
    text: Aan de vergunning kunnen beperkingen en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel11
  - number: '11.3'
    text: |-
      Elke samenkomst, vergadering of betoging gaat, ook indien voor het houden daarvan vergunning is gegeven, op door of
      namens de burgemeester gedane vordering terstond uiteen.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel11
  - number: '11.4'
    text: |-
      Het eerste tot en met derde lid is niet van toepassing op samenkomsten tot het belijden van godsdienst of
      levensovertuiging op andere dan openbare plaatsen.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel11
  - number: '14.1'
    text: |-
      De autoriteiten die daartoe door Onze Minister van Binnenlandse Zaken in overeenstemming met Onze Minister
      van Justitie zijn aangewezen, zijn bevoegd elk aan de post of aan andere instellingen van vervoer of aan een
      inrichting van telecommunicatie toevertrouwd stuk of bericht in beslag te nemen, af te luisteren of op te nemen,
      te onderzoeken, achter te houden, geheel of gedeeltelijk te vernietigen, te wijzigen, onleesbaar te maken of te
      verhinderen dat het zijn bestemming bereikt.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister van Binnenlandse Zaken geeft in overeenstemming met Onze Minister van Justitie nadere regels met
      betrekking tot de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel14
  - number: '15.1'
    text: |-
      De burgemeester is bevoegd een ieder aan zijn kleding en degene die de openbare orde en veiligheid verstoort of
      ten aanzien van wie een gegrond vermoeden bestaat dat hij zich daaraan schuldig zal maken, ook aan zijn lichaam
      te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel15
  - number: '15.2'
    text: |-
      Onze Minister van Binnenlandse Zaken geeft in overeenstemming met Onze Minister van Justitie nadere regels met
      betrekking tot de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel15
  - number: '15.3'
    text: |-
      Indien een of meer van de [artikelen 9 tot en met 53 van de Oorlogswet voor Nederland][ref1] in werking zijn
      gesteld, wordt van de bevoegdheid, bedoeld in het eerste lid, geen gebruik gemaakt jegens militairen.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel9
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007983
        artikel: '9'
  - number: '16.1'
    text: |-
      De burgemeester is bevoegd alle plaatsen, ook tegen de wil van de rechthebbende, te betreden dan wel door
      ambtenaren van politie of buitengewone opsporingsambtenaren te doen betreden en aldaar onderzoek of huiszoeking te
      verrichten of door die ambtenaren te doen verrichten, voor zover dat redelijkerwijs voor de vervulling van hun taak
      nodig is. Zo nodig verschaffen zij zich de toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel16
  - number: '16.2'
    text: |-
      De ambtenaren, bedoeld in het eerste lid, zijn bevoegd zich bij het betreden door andere personen te doen
      vergezellen.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel16
  - number: '16.3'
    text: |-
      Een machtiging als bedoeld in [artikel 2 van de Algemene wet op het binnentreden][ref1] kan worden gegeven
      voor een groter aantal woningen dan bedoeld in [artikel 5, eerste lid, van die wet][ref2]. Het verslag, bedoeld
      in [artikel 10 van de Algemene wet op het binnentreden][ref3], wordt mede toegezonden aan Onze Minister van
      Binnenlandse Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0006763#Artikel10
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0006763
        artikel: '10'
  - number: '16.4'
    text: |-
      Onze Minister van Binnenlandse Zaken geeft in overeenstemming met Onze Minister van Justitie nadere regels met
      betrekking tot de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel16
  - number: '17.1'
    text: |-
      De autoriteiten die daartoe door Onze Minister van Binnenlandse Zaken zijn aangewezen, zijn bevoegd alle voorwerpen
      ten aanzien waarvan ernstig vermoeden bestaat dat zij zullen dienen tot verstoring van de openbare orde en
      veiligheid, of waaruit aanwijzingen kunnen worden verkregen omtrent een mogelijke verstoring van de openbare orde,
      te onderzoeken, in beslag te nemen, dan wel het gebruik daarvan te beperken of geheel te verbieden.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel17
  - number: '17.2'
    text: |-
      Van elke inbeslagneming wordt proces-verbaal opgemaakt. Dit proces-verbaal, dat mede de redenen van de
      inbeslagneming vermeldt, wordt binnen tweemaal vierentwintig uren aan Onze Minister van Binnenlandse Zaken en aan
      de belanghebbende in afschrift medegedeeld, voor zover mededeling aan de belanghebbende niet strijdig kan worden
      geoordeeld met het belang van de staat. Voorts wordt van elke beperking en elk verbod aan Onze voornoemde Minister
      onverwijld kennis gegeven, onder opgave van de redenen die tot deze maatregel hebben geleid.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel17
  - number: '17.3'
    text: |-
      Tegen elke inbeslagneming, elke beperking of elk verbod kan door belanghebbenden beroep worden ingesteld bij Onze
      Minister van Binnenlandse Zaken. Onze Minister beslist hierop zo spoedig mogelijk, doch in elk geval binnen acht
      weken.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel17
  - number: '17.4'
    text: |-
      Onze Minister van Binnenlandse Zaken geeft in overeenstemming met Onze Minister van Justitie nadere regels met
      betrekking tot de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel17
  - number: '20'
    text: |-
      De rechtbank is bevoegd een verzoekschrift niet in behandeling te nemen, indien binnen twee maanden voorafgaand
      aan de indiening op een eerder verzoekschrift ter zake van dezelfde internering is beslist, tenzij uit het latere
      verzoekschrift blijkt van nieuwe feiten of omstandigheden.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel20
  - number: '26.1'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot de uitoefening van de
      bevoegdheid, bedoeld in [artikel 18, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel18
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007982
        artikel: '18'
        hoofdstuk: II
  - number: '26.2'
    text: |-
      Onze Minister van Veiligheid en Justitie is bevoegd in spoedeisende gevallen regels te geven waarbij wordt
      afgeweken van de regels, bedoeld in het eerste lid, of deze buiten werking worden gesteld. De door Onze Minister
      gegeven regels worden op een door hem te bepalen wijze bekendgemaakt en treden na deze bekendmaking terstond in
      werking. Deze regels worden in ieder geval geplaatst in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel26
  - number: '29'
    text: |-
      Onze Minister van Binnenlandse Zaken is bevoegd tot toepassing van bestuursdwang ter handhaving van zijn
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel29
  - number: '30.1'
    text: 'Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel30
  - number: 30.1.a
    text: |-
      hij die in strijd handelt met een verbod als bedoeld in [artikel 12][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel12
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007982
        artikel: '12'
        hoofdstuk: II
  - number: 30.1.b
    text: |-
      hij die in strijd handelt met een beperking, bevel of verbod als bedoeld in [de artikelen 8, eerste lid][ref1],
      en [9, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007982#Artikel9
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007982
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007982
        artikel: '9'
        hoofdstuk: II
  - number: 30.1.c
    text: |-
      hij die in strijd handelt met een beperking of een verbod als bedoeld in [artikel 17, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel17
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007982
        artikel: '17'
        hoofdstuk: II
  - number: 30.1.d
    text: |-
      hij die in strijd handelt met een bepaling of een verbod als bedoeld in [artikel 13][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel13
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007982
        artikel: '13'
        hoofdstuk: II
  - number: 30.1.e
    text: |-
      hij die in strijd handelt met een bepaling of een verbod als bedoeld in [het eerste lid van artikel 11][ref1], of
      een voorwaarde als bedoeld in het tweede lid van dat artikel, niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel11
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007982
        artikel: '11'
        hoofdstuk: II
  - number: '30.2'
    text: |-
      Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft hij die
      opzettelijk in strijd handelt met een bevel of verbod als bedoeld in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel9
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007982
        artikel: '9'
        hoofdstuk: II
  - number: '30.3'
    text: |-
      De feiten, in het eerste lid strafbaar gesteld, worden beschouwd als overtredingen, die in het tweede lid strafbaar
      gesteld, als misdrijven.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel30
  - number: '31'
    text: |-
      Indien de misdrijven, bedoeld in de [artikelen 131][ref1], [132][ref2], [138][ref3], [139][ref4], [141][ref5],
      [143][ref6], [179 tot en met 182][ref7], [184][ref8], [186][ref9] en [187 van het Wetboek van Strafrecht][ref10]
      worden begaan gedurende de beperkte of de algemene noodtoestand, kunnen de bij die artikelen gestelde
      gevangenisstraffen met een derde worden verhoogd en kan de naasthogere categorie geldboete worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel132
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel138
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel139
