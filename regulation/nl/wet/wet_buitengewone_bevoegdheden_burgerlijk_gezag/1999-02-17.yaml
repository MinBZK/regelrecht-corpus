  - number: '32.1'
    text: |-
      Bij het opsporen van een bij deze wet strafbaar gesteld feit hebben de opsporingsambtenaren toegang tot elke
      plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel32
  - number: '32.2'
    text: |-
      De ambtenaren, bedoeld in het eerste lid, zijn bevoegd zich bij het betreden door andere personen te doen
      vergezellen.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel32
  - number: '34'
    text: De Wet buitengewone bevoegdheden burgerlijk gezag (*Stb*. 1952, 361) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007982/1999-02-17#Artikel34
  - number: '35'
    text: |-
      Deze wet treedt, met uitzondering van [de artikelen 5][ref1], [6][ref2], [7][ref3],
      [8, eerste en derde lid][ref4], [9, eerste, tweede, derde en vijfde lid][ref5], [10 tot en met 13][ref6],
      [14, eerste lid][ref7], [15, eerste en derde lid][ref8], [16, eerste, tweede en derde lid][ref9],
      [17, eerste, tweede en derde lid][ref10], [18 tot en met 25][ref11], [26, tweede lid][ref12], [27][ref13] en
      [28][ref14] in werking op een bij koninklijk besluit te bepalen tijdstip.


