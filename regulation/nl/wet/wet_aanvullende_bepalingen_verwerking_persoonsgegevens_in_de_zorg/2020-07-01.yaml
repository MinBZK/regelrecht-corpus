  - number: '2'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat daarbij aan te wijzen artikelen van deze wet niet
      gelden voor bepaalde vormen van zorg, categorieën van zorgaanbieders, categorieën van indicatieorganen of
      categorieën van zorgverzekeraars.

      2 Bij algemene maatregel van bestuur kunnen handelingen die rechtstreeks verband houden met zorg, worden aangewezen
      als zorg in de zin van deze wet, waarbij uitvoerders of verzekeraars van die handelingen kunnen worden aangewezen
      als zorgaanbieders onderscheidenlijk zorgverzekeraars in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel2
  - number: '3'
    text: |-
      Indien het betreft een zorgaanbieder waarbij natuurlijke personen of rechtspersonen gezamenlijk een organisatorisch
      verband vormen dat strekt tot de verlening van zorg, richten de uit deze wet voortvloeiende verplichtingen zich tot
      ieder van die personen.
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel3
  - number: '4'
    text: |-
      Een zorgaanbieder gebruikt het burgerservicenummer van een cliënt met het doel te waarborgen dat de in het kader
      van de verlening van zorg te verwerken persoonsgegevens op die cliënt betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel4
  - number: '5'
    text: |-
      De zorgaanbieder stelt de identiteit en het burgerservicenummer van een cliënt vast:

      a. wanneer de cliënt zich voor de eerste maal tot de zorgaanbieder wendt ter verkrijging van zorg;

      b. voor zover dat redelijkerwijs nodig is ter uitvoering van
      [artikel 12 van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel12
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '12'
  - number: '6'
    text: |-
      1 De zorgaanbieder stelt de identiteit van de cliënt vast aan de hand van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1], dat de cliënt hem desgevraagd ter inzage geeft.

      2 De zorgaanbieder neemt aard en nummer van het in het eerste lid bedoelde document in zijn administratie op.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '7'
    text: |-
      1 Teneinde het burgerservicenummer van de cliënt vast te stellen, raadpleegt
      de zorgaanbieder het nummerregister en de registraties, bedoeld in
      [artikel 3, eerste lid, onder b en d, van de Wet algemene bepalingen burgerservicenummer][ref1].

      2 De zorgaanbieder kan de raadpleging, bedoeld in het eerste lid, achterwege laten
      indien het burgerservicenummer is verstrekt door een andere gebruiker als bedoeld in
      [artikel 1, onderdeel d, van de Wet algemene bepalingen burgerservicenummer][ref2],
      die bij of krachtens wet gehouden is het burgerservicenummer van de cliënt vast
      te stellen aan de hand van het nummerregister en de registraties, bedoeld in
      [artikel 3, eerste lid, onder b en d, van de Wet algemene bepalingen burgerservicenummer][ref3].

      3 De zorgaanbieder kan de raadpleging, bedoeld in het eerste lid, achterwege laten indien de zorgaanbieder het
      burgerservicenummer heeft verkregen uit de basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel7
    references:
