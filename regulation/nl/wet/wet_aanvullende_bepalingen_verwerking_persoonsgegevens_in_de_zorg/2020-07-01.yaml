  - number: 15a
    text: |-
      1 De zorgaanbieder stelt gegevens van de cliënt slechts beschikbaar via een elektronisch uitwisselingssysteem, voor
      zover de zorgaanbieder heeft vastgesteld dat de cliënt daartoe uitdrukkelijk toestemming heeft gegeven.

      2

      3 De zorgaanbieder stelt gegevens van de cliënt slechts beschikbaar via een elektronisch uitwisselingssysteem, voor
      zover bij het raadplegen van die gegevens door een andere zorgaanbieder, de persoonlijke levenssfeer van een ander
      dan de cliënt niet wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel15a
  - number: 15c
    text: |-
      1 De zorgaanbieder geeft de cliënt informatie over zijn rechten bij elektronische gegevensuitwisseling, de wijze
      waarop hij zijn rechten kan uitoefenen en over de werking van het elektronisch uitwisselingssysteem dat voor de
      gegevensuitwisseling wordt gebruikt. Indien nieuwe categorieën van zorgaanbieders aansluiten bij het elektronisch
      uitwisselingssysteem, of de werking van het elektronisch uitwisselingssysteem anderszins substantieel wordt
      gewijzigd, informeert de zorgaanbieder de cliënt over deze wijziging alsmede over de mogelijkheid om de gegeven
      toestemming, bedoeld in [artikel 15a][ref1], aan te passen of in te trekken.

      2


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel15a
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: 15a
        hoofdstuk: 3a
  - number: 15d
    text: |-
      1 Indien de cliënt verzoekt om inzage of afschrift van het dossier van de desbetreffende cliënt, of van de gegevens
      betreffende deze cliënt die de zorgaanbieder via een elektronisch uitwisselingssysteem beschikbaar stelt, wordt de
      inzage of het afschrift op verzoek van de cliënt, met redelijke tussenpozen, door de zorgaanbieder op elektronische
      wijze verstrekt.

      2 Bij de afgifte van medicijnen door een apotheker, verschaft de apotheker de cliënt desgevraagd direct op
      elektronische wijze inzage in zijn medicatiegegevens. Op verzoek van de cliënt worden door de apotheker desgevraagd
      door de cliënt verstrekte gegevens over het gebruik van zelfmedicatie beschikbaar gesteld via het elektronisch
      uitwisselingssysteem.

      3 De in het eerste en tweede lid bedoelde elektronische inzage, en de in het eerste lid bedoelde elektronische
      afschriften, worden kosteloos verschaft.
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel15d
  - number: 15e
    text: |-
      Onverminderd het bepaalde in artikel 15 van de Algemene verordening gegevensbescherming, wordt in een afschrift als
      bedoeld in [artikel 15d, eerste lid][ref1], op verzoek van de cliënt opgenomen:

      a. wie bepaalde informatie via het elektronisch uitwisselingssysteem beschikbaar heeft gesteld en op welke datum;

      b. wie bepaalde informatie heeft ingezien of opgevraagd en op welke datum.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel15d
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: 15d
        hoofdstuk: 3a
  - number: 15f
    text: |-
      1 Een zorgverzekeraar heeft geen toegang tot elektronische uitwisselingssystemen.

      2 Voor zover een zorgaanbieder werkzaamheden verricht als bedrijfsarts, verzekeringsarts, dan wel als keurend
      arts voor keuringen als bedoeld in de [Wet op de medische keuringen][ref1], verschaft hij zich geen toegang tot
      elektronische uitwisselingssystemen en verwerkt geen gegevens uit elektronische uitwisselingssystemen.


      [ref1]: https://wetten.overheid.nl/BWBR0008819
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0008819
  - number: 15g
    text: |-
      Indien de cliënt een wettelijk vertegenwoordiger heeft, worden de op grond van deze paragraaf aan de
      cliënt toekomende rechten uitgeoefend door deze vertegenwoordiger, met dien verstande dat in afwijking van
      [artikel 5, eerste lid, van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] toestemming voor het
      verwerken van persoonsgegevens, mede is vereist van de cliënt die de leeftijd van twaalf maar nog niet van zestien
      jaren heeft bereikt, tenzij de desbetreffende cliënt niet in staat kan worden geacht tot een redelijke waardering
      van zijn belangen ter zake.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel5
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '5'
  - number: 15h
    text: |-
      De verwerkingsverantwoordelijke als bedoeld in artikel 4 van de Algemene verordening gegevensbescherming,
      voor een elektronisch uitwisselingssysteem, doet in geval van een vermoeden van een overtreding van
      het verbod, bedoeld in [artikel 15f, eerste lid][ref1], mededeling aan de zorgautoriteit, bedoeld in de
      [Wet marktordening gezondheidszorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel15f
      [ref2]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel15h
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: 15f
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0020078
  - number: 15i
    text: |-
      Indien een zorgverlener wordt veroordeeld voor het plegen van een van de in de [artikelen 138ab][ref1] of
      [272 van het Wetboek van Strafrecht][ref2] omschreven misdrijven, kan hij, indien het feit met betrekking tot
      patiëntgegevens is begaan, bij zijn veroordeling door de strafrechter van de uitoefening van zijn beroep worden
      ontzet.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel138ab
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel272
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 138ab
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '272'
  - number: 15j
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de functionele, technische en
      organisatorische maatregelen voor het beheer, de beveiliging en het gebruik van een zorginformatiesysteem of een
      elektronisch uitwisselingssysteem.

      2 De voordracht voor een algemene maatregel van bestuur als bedoeld in het eerste lid, wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Indien een der kamers der
      Staten-Generaal besluit niet in te stemmen met het ontwerp, wordt er geen voordracht gedaan en kan niet eerder dan
      zes weken na het besluit van die kamer der Staten-Generaal een nieuw ontwerp aan beide kamers der Staten-Generaal
      worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel15j
  - number: '17'
    text: |-
      1 Onverminderd het bepaalde bij of krachtens de [Wet basisregistratie personen][ref1], kunnen bij of krachtens
      algemene maatregel van bestuur regels worden gesteld ten aanzien van:

      a. de wijze en het tijdstip waarop burgerservicenummers van personen die op het tijdstip van inwerkingtreding van
      deze wet cliënt zijn van een zorgaanbieder, een indicatieorgaan of een zorgverzekeraar, aan deze ter beschikking
      worden gesteld;

      b. de wijze waarop de zorgaanbieder, het indicatieorgaan en de zorgverzekeraar de identiteit en het
      burgerservicenummer vaststellen van de cliënten, bedoeld onder a;

      c. de verwerking van persoonsnummers van de cliënten, bedoeld onder a, waarover de zorgaanbieder, het
      indicatieorgaan en de zorgverzekeraar op het tijdstip van inwerkingtreding van deze wet beschikken.

      2 Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kan onderscheid worden gemaakt tussen
      verschillende categorieën cliënten, zorgaanbieders, indicatieorganen en zorgverzekeraars.

      3 Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kan worden afgeweken van de bepalingen
      in deze wet, de [Wet algemene bepalingen burgerservicenummer][ref2], de [Wet langdurige zorg][ref3] en de
      [Zorgverzekeringswet][ref4] omtrent het gebruik van het burgerservicenummer alsmede omtrent het vaststellen van de
      identiteit en het burgerservicenummer van cliënten.


      [ref1]: https://wetten.overheid.nl/BWBR0033715
      [ref2]: https://wetten.overheid.nl/BWBR0022428
      [ref3]: https://wetten.overheid.nl/BWBR0035917
      [ref4]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0033715
      - id: ref2
        bwb_id: BWBR0022428
      - id: ref3
        bwb_id: BWBR0035917
      - id: ref4
        bwb_id: BWBR0018450
  - number: 17a
    text: |-
      1 Vooruitlopend op de inwerkingtreding van een wettelijke verplichting tot gebruik van het burgerservicenummer
      kan bij algemene maatregel van bestuur worden bepaald dat daarbij aan te wijzen categorieën zorgaanbieders,
      indicatieorganen of zorgverzekeraars voor daarbij aan te wijzen vormen van zorg gedurende een daarbij aan te wijzen
      periode het burgerservicenummer van een cliënt mogen gebruiken.

      2 Op het gebruik van het burgerservicenummer op grond van de algemene maatregel van bestuur, bedoeld in het
      eerste lid, is het gestelde bij of krachtens deze wet, de [Wet algemene bepalingen burgerservicenummer][ref1], de
      [Wet langdurige zorg][ref2] en de [Zorgverzekeringswet][ref3] omtrent het gebruik van het burgerservicenummer, met
      inbegrip van de beveiliging, de geheimhouding, het toezicht en de handhaving, alsmede omtrent het vaststellen van
      de identiteit en het burgerservicenummer van cliënten van toepassing met dien verstande dat:

      a. ingevolge die toepassing een bevoegdheid in plaats van een verplichting ontstaat tot het gebruik van het
      burgerservicenummer;

      b. het gestelde omtrent het vaststellen van de identiteit en het burgerservicenummer, slechts van toepassing is ten
      aanzien van cliënten waarvan dat nummer wordt gebruikt;

      c. de zorgaanbieder, het indicatieorgaan en de zorgverzekeraar worden aangemerkt als gebruiker in de zin van de
      [Wet algemene bepalingen burgerservicenummer][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022428
      [ref2]: https://wetten.overheid.nl/BWBR0035917
      [ref3]: https://wetten.overheid.nl/BWBR0018450
      [ref4]: https://wetten.overheid.nl/BWBR0022428
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel17a
    references:
      - id: ref1
