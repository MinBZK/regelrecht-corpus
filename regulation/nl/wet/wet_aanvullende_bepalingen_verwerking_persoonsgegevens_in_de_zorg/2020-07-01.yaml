        artikel: '3'
  - number: '8'
    text: |-
      1 De zorgaanbieder neemt het burgerservicenummer van de cliënt in zijn administratie op bij het vastleggen van
      persoonsgegevens met betrekking tot de verlening van zorg.

      2 Indien de zorgaanbieder overeenkomstig het bepaalde in [artikel 15a][ref1] gegevens van de cliënt beschikbaar
      stelt via een elektronisch uitwisselingssysteem, is de rechtspersoon die dat elektronisch uitwisselingssysteem
      beheert en in stand houdt, bevoegd tot het verwerken van het burgerservicenummer van die cliënt voor zover dat
      noodzakelijk is om zijn taak als beheerder uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel15a
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: 15a
        hoofdstuk: 3a
  - number: '9'
    text: |-
      1 De zorgaanbieder vermeldt bij het verstrekken van persoonsgegevens met betrekking tot de verlening van,
      indicatiestelling voor of verzekering van zorg aan een zorgaanbieder, een indicatieorgaan of een zorgverzekeraar
      steeds het burgerservicenummer van de cliënt.

      2 De zorgaanbieder vermeldt bij het verstrekken van persoonsgegevens met betrekking tot de subsidiëring door
      Onze Minister van verleende zorg steeds het burgerservicenummer van de cliënt voor zover noodzakelijk voor de
      subsidiëring.
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel9
  - number: '10'
    text: |-
      Bij ministeriële regeling kan worden bepaald aan welke beveiligingseisen de gegevensverwerking, bedoeld in de
      [artikelen 8][ref1] en [9][ref2], voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0023864#Artikel9
    url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#Artikel10
    references:
