  - number: '13'
    text: |-
      1 Op de zorgverzekeraar die is aangewezen op grond van [artikel 2, tweede lid][ref1], alsmede op de
      zorgverzekeraar, bedoeld in [artikel 1, onderdeel e, onder 3°][ref2], is, met uitzondering van de
      bewaartermijn als omschreven in [artikel 86, eerste lid, van de Zorgverzekeringswet][ref3], het bepaalde bij
      of krachtens de [artikelen 4, tweede tot en met vijfde lid][ref4], en [86 van de Zorgverzekeringswet][ref5]
      van overeenkomstige toepassing met betrekking tot de verzekering van respectievelijk handelingen als bedoeld in
      [artikel 2, tweede lid][ref6], en zorg als bedoeld in [artikel 1, onderdeel e, onder 3°][ref7].

      2 Personen werkzaam bij of ten behoeve van de zorgverzekeraar, bedoeld in het eerste lid, voor wie niet reeds
      uit hoofde van ambt of beroep een geheimhoudingplicht geldt, zijn verplicht tot geheimhouding van de gegevens die
      zij op grond van de eerste volzin verwerken, behoudens voor zover enig wettelijk voorschrift hen tot mededeling
      verplicht.

      3 De Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref8], is, voor zover
      dat niet aan andere toezichthouders is voorbehouden, belast met het toezicht op de uitvoering van het eerste
      lid door zorgverzekeraars. [Artikel 89, eerste, tweede en negende lid, van de Zorgverzekeringswet][ref9]
      en de [artikelen 77][ref10], [79][ref11], [80][ref12], [81][ref13],
      [83, eerste lid][ref14], [88][ref15], [89][ref16], [104, tweede lid][ref17], [105][ref18] en
      [106 van de Wet marktordening gezondheidszorg][ref19] zijn van overeenkomstige toepassing met dien verstande dat
      [artikel 89, eerste, tweede en zesde lid, van de Zorgverzekeringswet][ref20] uitsluitend van toepassing is voor
      zover het een verzoek van de Nederlandse Zorgautoriteit betreft.


