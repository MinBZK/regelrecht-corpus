preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in de zorgsector het burgerservicenummer te gebruiken
    teneinde te waarborgen dat verwerkte persoonsgegevens op de betrokken cliënt betrekking hebben;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023864/2020-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport of Onze Minister voor Medische Zorg;

      b. zorg:

      1°. zorg of dienst als omschreven bij of krachtens de [Zorgverzekeringswet][ref1] en de
      [Wet langdurige zorg][ref2];

      2°. vorm van hulp voor de kosten waarvan een subsidie wordt verstrekt op grond van
      [artikel 3.3.3 van de Wet langdurige zorg][ref3] of [artikel 68 van de Zorgverzekeringswet][ref4];

      3°. zorg als bedoeld in de [artikelen 5][ref5], [6b][ref6] en [12a van de Wet publieke gezondheid][ref7];

      4°. individuele gezondheidszorg als bedoeld in
      [artikel 1 van de Wet op de beroepen in de individuele gezondheidszorg][ref8];

      één en ander met inbegrip van de financiële afwikkeling;

      c. zorgaanbieder: zorgaanbieder als bedoeld in de [Wet kwaliteit, klachten en geschillen zorg][ref9];

      d. *indicatieorgaan:* het CIZ, genoemd in [artikel 7.1.1, eerste lid, van de Wet langdurige zorg][ref10];

      e. zorgverzekeraar:

      1°. Wlz-uitvoerder als bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref11];

      2°. zorgverzekeraar als bedoeld in [artikel 1, onder b, van de Zorgverzekeringswet][ref12];

      3°. verzekeringsonderneming als bedoeld in de richtlijn solvabiliteit II voor zover deze verzekeringen
      aanbiedt of uitvoert krachtens welke het verzekerde risico de behoefte aan zorg is waarop bij of krachtens de
      [Algemene Wet Bijzondere Ziektekosten][ref13] geen aanspraak bestaat en waarbij de verzekerde prestaties het bij of
      krachtens de [Zorgverzekeringswet][ref14] geregelde te boven gaat;

      f. cliënt: degene aan wie zorg wordt verleend, voor wie zorg wordt geïndiceerd of voor wie zorg wordt verzekerd;

      g. burgerservicenummer: burgerservicenummer als bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref15];

      h. richtlijn solvabiliteit II: richtlijn 2009/138/EG van het Europees Parlement en de Raad van 25 november 2009
      betreffende de toegang tot en uitoefening van het verzekerings- en het herverzekeringsbedrijf (Solvabiliteit II)
      (PbEU 2009, L 335);

      i. *dossier:* de schriftelijk of elektronisch vastgelegde gegevens met betrekking tot de verlening van zorg aan
      een cliënt;

      j. *elektronisch uitwisselingssysteem:* een systeem waarmee zorgaanbieders op elektronische wijze, dossiers,
      gedeelten van dossiers of gegevens uit dossiers voor andere zorgaanbieders raadpleegbaar kunnen maken, waaronder
      niet begrepen een systeem binnen een zorgaanbieder, voor het bijhouden van een elektronisch dossier;

      k. *behandelrelatie:* de relatie tussen de cliënt en de zorgverlener met wie de cliënt een behandelingsovereenkomst
      als bedoeld in [artikel 7:446, eerste lid BW][ref16] heeft, of degene die rechtstreeks betrokken is bij
      de uitvoering van die behandelingsovereenkomst, of degene die optreedt als vervanger van degene die een
      behandelingsovereenkomst heeft met de cliënt;

      l. *zorgverlener:* natuurlijke persoon die in een register als bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref17] staat ingeschreven of die een beroep
      uitoefent waarvan de opleiding krachtens [artikel 34, eerste lid, van die wet][ref18] is geregeld of aangewezen;

      m. *zorginformatiesysteem:* elektronisch systeem van een zorgaanbieder voor het verwerken van persoonsgegevens in
      een dossier, niet zijnde een elektronisch uitwisselingssysteem.


