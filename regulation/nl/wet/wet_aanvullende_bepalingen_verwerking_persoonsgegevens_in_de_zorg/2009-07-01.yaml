preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in de zorgsector het burgerservicenummer te gebruiken
    teneinde te waarborgen dat verwerkte persoonsgegevens op de betrokken cliënt betrekking hebben;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023864/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. zorg:

      1°. zorg of dienst als omschreven bij of krachtens de [Zorgverzekeringswet][ref1] en de
      [Algemene Wet Bijzondere Ziektekosten][ref2];

      2°. vorm van hulp voor de kosten waarvan een subsidie wordt verstrekt op grond van
      [artikel 44 van de Algemene Wet Bijzondere Ziektekosten][ref3] of [artikel 68 van de Zorgverzekeringswet][ref4];

      3°. jeugdgezondheidszorg als omschreven bij of krachtens de [Wet publieke gezondheid][ref5];

      4°. handelingen op het gebied van de individuele gezondheidszorg als bedoeld in
      [artikel 1 van de Wet op de beroepen in de individuele gezondheidszorg][ref6];

      één en ander met inbegrip van de financiële afwikkeling;

      c. zorgaanbieder:

      1°. zorgaanbieder als bedoeld in [artikel 1 van de Kwaliteitswet zorginstellingen][ref7];

      2°. degene die in een register als bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref8] staat ingeschreven of die
      een beroep uitoefent waarvan de opleiding krachtens [artikel 34, eerste lid, van die wet][ref9] is geregeld
      of aangewezen, en die zijn beroep uitoefent anders dan in het kader van een instelling als bedoeld in
      [artikel 1 van de Kwaliteitswet zorginstellingen][ref10];

      d. indicatieorgaan:

      1°. indicatieorgaan als bedoeld in [artikel 9a, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref11];

      2°. stichting als bedoeld in [artikel 9b, vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref12];

      e. zorgverzekeraar:

      1°. zorgverzekeraar als bedoeld in
      [artikel 1, eerste lid, onder b, van de Algemene Wet Bijzondere Ziektekosten][ref13];

      2°. zorgverzekeraar als bedoeld in [artikel 1, onder b, van de Zorgverzekeringswet][ref14];

      3°. verzekeringsonderneming als bedoeld in de eerste richtlijn schadeverzekering voor zover deze verzekeringen
      aanbiedt of uitvoert krachtens welke het verzekerde risico de behoefte aan zorg is waarop bij of krachtens de
      [Algemene Wet Bijzondere Ziektekosten][ref15] geen aanspraak bestaat en waarbij de verzekerde prestaties het bij of
      krachtens de [Zorgverzekeringswet][ref16] geregelde te boven gaat;

      f. cliënt: degene aan wie zorg wordt verleend, voor wie zorg wordt geïndiceerd of voor wie zorg wordt verzekerd;

      g. burgerservicenummer: burgerservicenummer als bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref17];

      h. eerste richtlijn schadeverzekering: [richtlijn nr. 73/239/EEG](31973L0239) van de Raad van de Europese
      Gemeenschappen van 24 juli 1973 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende de
      toegang tot het directe verzekeringsbedrijf, met uitzondering van de levensverzekeringsbranche en de uitoefening
      daarvan (PbEG L 228).


