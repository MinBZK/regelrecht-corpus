  - number: '8'
    text: |-
      De zorgaanbieder neemt het burgerservicenummer van de cliënt in zijn administratie op bij het vastleggen van
      persoonsgegevens met betrekking tot de verlening van zorg.
    url: https://wetten.overheid.nl/BWBR0023864/2009-07-01#Artikel8
  - number: '9'
    text: |-
      De zorgaanbieder vermeldt bij het verstrekken van persoonsgegevens met betrekking tot de verlening van,
      indicatiestelling voor of verzekering van zorg aan een zorgaanbieder, een indicatieorgaan of een zorgverzekeraar
      steeds het burgerservicenummer van de cliënt.
    url: https://wetten.overheid.nl/BWBR0023864/2009-07-01#Artikel9
  - number: '10'
    text: |-
      Bij ministeriële regeling kan worden bepaald aan welke beveiligingseisen de gegevensverwerking, bedoeld in de
      [artikelen 8][ref1] en [9][ref2], voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0023864#Artikel9
    url: https://wetten.overheid.nl/BWBR0023864/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023864
        artikel: '9'
        hoofdstuk: '2'
  - number: '11'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over door zorgaanbieders te
      verwerken feiten of gegevens met betrekking tot cliënten van wie het vaststellen van de identiteit of het
      burgerservicenummer onmogelijk blijkt of een onevenredige inspanning kost.

      2 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kan worden bepaald aan welke
      beveiligingseisen de gegevensverwerking, bedoeld in het eerste lid, voldoet.
    url: https://wetten.overheid.nl/BWBR0023864/2009-07-01#Artikel11
  - number: '12'
    text: |-
      1 De zorgaanbieder kan van de bij of krachtens de [artikelen 5][ref1], [6][ref2], [7][ref3] en [17][ref4]
      gestelde verplichtingen afwijken voor zolang dit noodzakelijk is voor het verlenen van spoedeisende zorg aan een
      bepaalde cliënt.

      2 Indien op grond van het eerste lid wordt afgeweken van de bij of krachtens de [artikelen 5][ref5], [6][ref6]
      en [17][ref7] gestelde verplichtingen met betrekking tot het vaststellen van de identiteit van de cliënt,
      is het bepaalde bij of krachtens de [artikelen 4][ref8], [10][ref9] en [11][ref10] slechts van toepassing
      voor het opvragen en raadplegen van persoonsgegevens van de cliënt en is het bepaalde bij of krachtens de
      [artikelen 8][ref11] en [9][ref12] niet van toepassing.

      3 Indien op grond van het eerste lid wordt afgeweken van de bij of krachtens de [artikelen 5][ref13], [6][ref14],
      [7][ref15] en [17][ref16] gestelde verplichtingen is het bepaalde bij of krachtens de [artikelen 4][ref17],
      [8][ref18], [9][ref19], [10][ref20] en [11][ref21] niet van toepassing.


