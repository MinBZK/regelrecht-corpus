  - number: 17b
    text: |-
      De voordracht voor een krachtens deze wet vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan
      dan twee weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0023864/2009-07-01#Artikel17b
  - number: '25'
    text: 'Deze wet wordt aangehaald als: Wet gebruik burgerservicenummer in de zorg.'
    url: https://wetten.overheid.nl/BWBR0023864/2009-07-01#Artikel25
  - number: '26'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan alsmede voor verschillende vormen van zorg en categorieën van
      zorgaanbieders, indicatieorganen en zorgverzekeraars verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023864/2009-07-01#Artikel26
