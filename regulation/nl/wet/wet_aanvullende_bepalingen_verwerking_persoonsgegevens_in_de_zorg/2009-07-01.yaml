  - number: '14'
    text: |-
      1 Er worden ingesteld een register van zorgaanbieders, een register van indicatieorganen en een register
      van zorgverzekeraars waarin onderscheidenlijk een zorgaanbieder, een indicatieorgaan en een zorgverzekeraar
      op hun verzoek worden opgenomen teneinde gebruik te kunnen maken van de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onder c en d, van de Wet algemene bepalingen burgerservicenummer][ref1].

      2 Elk register wordt ingesteld en beheerd door Onze Minister of een door Onze Minister aangewezen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0023864/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: '15'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het opnemen, wijzigen en
      verwijderen van gegevens in onderscheidenlijk uit de in [artikel 14][ref1] bedoelde registers van zorgaanbieders,
      indicatieorganen en zorgverzekeraars, alsmede over het beheer van de registers, in ieder geval wat betreft de
      beveiliging van persoonsgegevens en het toezicht op het functioneren van de registers.

      2 Bij de maatregel, bedoeld in het eerste lid, kunnen bijdragen van de zorgaanbieders, indicatieorganen en
      zorgverzekeraars worden verlangd in de kosten van de registers.

      3 De beheerder van een register als bedoeld in [artikel 14][ref2] verschaft aan een in het register ingeschreven
      zorgaanbieder, indicatieorganen en zorgverzekeraar op diens verzoek een middel waarmee deze ten behoeve van
      de raadpleging, bedoeld in [artikel 7, eerste lid][ref3], toegang kan krijgen tot de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onder c en d, van de Wet algemene bepalingen burgerservicenummer][ref4].

      4 De beheerder kan voor het middel een vergoeding verlangen.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de kenmerken, de aanvraag, de
      productie, de verstrekking, het beheer, de beveiliging, het gebruik en de intrekking van alsmede de vergoeding voor
      het middel.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0023864#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0023864#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0023864/2009-07-01#Artikel15
