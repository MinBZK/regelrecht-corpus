      (PbEU 2009, L 335).
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel1
  - number: '2.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat daarbij aan te wijzen artikelen van deze wet niet gelden
      voor bepaalde vormen van zorg, categorieën van zorgaanbieders, categorieën van indicatieorganen of categorieën
      van zorgverzekeraars.
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen handelingen die rechtstreeks verband houden met zorg, worden aangewezen
      als zorg in de zin van deze wet, waarbij uitvoerders of verzekeraars van die handelingen kunnen worden aangewezen
      als zorgaanbieders onderscheidenlijk zorgverzekeraars in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel2
  - number: '3'
    text: |-
      Indien het betreft een zorgaanbieder waarbij natuurlijke personen of rechtspersonen gezamenlijk een organisatorisch
      verband vormen dat strekt tot de verlening van zorg, richten de uit deze wet voortvloeiende verplichtingen zich tot
      ieder van die personen.
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel3
  - number: '4'
    text: |-
      Een zorgaanbieder gebruikt het burgerservicenummer van een cliënt met het doel te waarborgen dat de in het kader
      van de verlening van zorg te verwerken persoonsgegevens op die cliënt betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel4
  - number: '5'
    text: 'De zorgaanbieder stelt de identiteit en het burgerservicenummer van een cliënt vast:'
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel5
  - number: 5.a
    text: wanneer de cliënt zich voor de eerste maal tot de zorgaanbieder wendt ter verkrijging van zorg;
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel5
  - number: 5.b
    text: |-
      voor zover dat redelijkerwijs nodig is ter uitvoering van
      [artikel 12 van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel12
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '12'
  - number: '6.1'
    text: |-
      De zorgaanbieder stelt de identiteit van de cliënt vast aan de hand van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1], dat de cliënt hem desgevraagd ter inzage geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '6.2'
    text: De zorgaanbieder neemt aard en nummer van het in het eerste lid bedoelde document in zijn administratie op.
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel6
  - number: '7.1'
    text: |-
      Teneinde het burgerservicenummer van de cliënt vast te stellen, raadpleegt
      de zorgaanbieder het nummerregister en de registraties, bedoeld in
      [artikel 3, eerste lid, onder b en d, van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: '7.2'
    text: |-
      De zorgaanbieder kan de raadpleging, bedoeld in het eerste lid, achterwege laten
      indien het burgerservicenummer is verstrekt door een andere gebruiker als bedoeld in
      [artikel 1, onderdeel d, van de Wet algemene bepalingen burgerservicenummer][ref1],
      die bij of krachtens wet gehouden is het burgerservicenummer van de cliënt vast
      te stellen aan de hand van het nummerregister en de registraties, bedoeld in
      [artikel 3, eerste lid, onder b en d, van de Wet algemene bepalingen burgerservicenummer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '3'
  - number: '7.3'
    text: |-
      De zorgaanbieder kan de raadpleging, bedoeld in het eerste lid, achterwege laten indien de zorgaanbieder het
      burgerservicenummer heeft verkregen uit de basisregistratie personen.
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel7
  - number: '8'
    text: |-
      De zorgaanbieder neemt het burgerservicenummer van de cliënt in zijn administratie op bij het vastleggen van
      persoonsgegevens met betrekking tot de verlening van zorg.
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel8
  - number: '9'
    text: |-
      De zorgaanbieder vermeldt bij het verstrekken van persoonsgegevens met betrekking tot de verlening van,
      indicatiestelling voor of verzekering van zorg aan een zorgaanbieder, een indicatieorgaan of een zorgverzekeraar
      steeds het burgerservicenummer van de cliënt.
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel9
  - number: '10'
    text: |-
      Bij ministeriële regeling kan worden bepaald aan welke beveiligingseisen de gegevensverwerking, bedoeld in de
      [artikelen 8][ref1] en [9][ref2], voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0023864#Artikel9
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023864
        artikel: '9'
        hoofdstuk: '2'
  - number: '11.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over door zorgaanbieders te verwerken
      feiten of gegevens met betrekking tot cliënten van wie het vaststellen van de identiteit of het burgerservicenummer
      onmogelijk blijkt of een onevenredige inspanning kost.
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel11
  - number: '11.2'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kan worden bepaald aan welke
      beveiligingseisen de gegevensverwerking, bedoeld in het eerste lid, voldoet.
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel11
  - number: '12.1'
    text: |-
      De zorgaanbieder kan van de bij of krachtens de [artikelen 5][ref1], [6][ref2], [7][ref3] en [17][ref4] gestelde
      verplichtingen afwijken voor zolang dit noodzakelijk is voor het verlenen van spoedeisende zorg aan een bepaalde
      cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0023864#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0023864#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0023864#Artikel17
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023864
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0023864
        artikel: '7'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0023864
        artikel: '17'
        hoofdstuk: '4'
  - number: '12.2'
    text: |-
      Indien op grond van het eerste lid wordt afgeweken van de bij of krachtens de [artikelen 5][ref1], [6][ref2]
      en [17][ref3] gestelde verplichtingen met betrekking tot het vaststellen van de identiteit van de cliënt, is het
      bepaalde bij of krachtens de [artikelen 4][ref4], [10][ref5] en [11][ref6] slechts van toepassing voor het opvragen
      en raadplegen van persoonsgegevens van de cliënt en is het bepaalde bij of krachtens de [artikelen 8][ref7] en
      [9][ref8] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel5
