  - number: '13.1'
    text: |-
      Op de zorgverzekeraar die is aangewezen op grond van [artikel 2, tweede lid][ref1], alsmede op de
      zorgverzekeraar, bedoeld in [artikel 1, onderdeel e, onder 3°][ref2], is, met uitzondering van de
      bewaartermijn als omschreven in [artikel 86, eerste lid, van de Zorgverzekeringswet][ref3], het bepaalde bij
      of krachtens de [artikelen 4, tweede tot en met vijfde lid][ref4], en [86 van de Zorgverzekeringswet][ref5]
      van overeenkomstige toepassing met betrekking tot de verzekering van respectievelijk handelingen als bedoeld in
      [artikel 2, tweede lid][ref6], en zorg als bedoeld in [artikel 1, onderdeel e, onder 3°][ref7].


