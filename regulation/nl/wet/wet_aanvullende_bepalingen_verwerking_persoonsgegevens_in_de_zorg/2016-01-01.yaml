  - number: '13.2'
    text: |-
      Personen werkzaam bij of ten behoeve van de zorgverzekeraar, bedoeld in het eerste lid, voor wie niet reeds uit
      hoofde van ambt of beroep een geheimhoudingplicht geldt, zijn verplicht tot geheimhouding van de gegevens die
      zij op grond van de eerste volzin verwerken, behoudens voor zover enig wettelijk voorschrift hen tot mededeling
      verplicht.
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel13
  - number: '13.3'
    text: |-
      De Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref1], is, voor zover dat
      niet aan andere toezichthouders is voorbehouden, belast met het toezicht op de uitvoering van het eerste
      lid door zorgverzekeraars. De [artikelen 89, eerste, tweede en zesde lid, van de Zorgverzekeringswet][ref2]
      en de [artikelen 77][ref3], [79][ref4], [80][ref5], [81][ref6], [83, eerste lid][ref7],
      [88][ref8], [89][ref9], [104, tweede lid][ref10], [105][ref11] en
      [106 van de Wet marktordening gezondheidszorg][ref12] zijn van overeenkomstige toepassing met dien verstande dat
      [artikel 89, eerste, tweede en zesde lid, van de Zorgverzekeringswet][ref13] uitsluitend van toepassing is voor
      zover het een verzoek van de Nederlandse Zorgautoriteit betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0020078
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0020078#Artikel79
      [ref5]: https://wetten.overheid.nl/BWBR0020078#Artikel80
      [ref6]: https://wetten.overheid.nl/BWBR0020078#Artikel81
      [ref7]: https://wetten.overheid.nl/BWBR0020078#Artikel83
      [ref8]: https://wetten.overheid.nl/BWBR0020078#Artikel88
      [ref9]: https://wetten.overheid.nl/BWBR0020078#Artikel89
      [ref10]: https://wetten.overheid.nl/BWBR0020078#Artikel104
      [ref11]: https://wetten.overheid.nl/BWBR0020078#Artikel105
      [ref12]: https://wetten.overheid.nl/BWBR0020078#Artikel106
      [ref13]: https://wetten.overheid.nl/BWBR0018450#Artikel89
    url: https://wetten.overheid.nl/BWBR0023864/2016-01-01#Artikel13
