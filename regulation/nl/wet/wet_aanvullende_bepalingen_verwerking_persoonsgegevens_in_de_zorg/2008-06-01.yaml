  - number: 1.f
    text: 'cliënt: degene aan wie zorg wordt verleend, voor wie zorg wordt geïndiceerd of voor wie zorg wordt verzekerd;'
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel1
  - number: 1.g
    text: |-
      burgerservicenummer: burgerservicenummer als bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel1
    references:
