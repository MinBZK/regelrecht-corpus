        bwb_id: BWBR0022428
        artikel: '1'
  - number: 1.h
    text: |-
      eerste richtlijn schadeverzekering: [richtlijn nr. 73/239/EEG](31973L0239) van de Raad van de Europese
      Gemeenschappen van 24 juli 1973 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende de
      toegang tot het directe verzekeringsbedrijf, met uitzondering van de levensverzekeringsbranche en de uitoefening
      daarvan (PbEG L 228).
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel1
  - number: '2.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat daarbij aan te wijzen artikelen van deze wet niet gelden
      voor bepaalde vormen van zorg, categorieën van zorgaanbieders, categorieën van indicatieorganen of categorieën
      van zorgverzekeraars.
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel2
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen handelingen die rechtstreeks verband houden met zorg, worden aangewezen
      als zorg in de zin van deze wet, waarbij uitvoerders of verzekeraars van die handelingen kunnen worden aangewezen
      als zorgaanbieders onderscheidenlijk zorgverzekeraars in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel2
  - number: '3'
    text: |-
      Indien het betreft een zorgaanbieder waarbij natuurlijke personen of rechtspersonen gezamenlijk een organisatorisch
      verband vormen dat strekt tot de verlening van zorg, richten de uit deze wet voortvloeiende verplichtingen zich tot
      ieder van die personen.
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel3
  - number: '10'
    text: |-
      Bij ministeriële regeling kan worden bepaald aan welke beveiligingseisen de gegevensverwerking, bedoeld in de
      [artikelen 8][ref1] en [9][ref2], voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0023864#Artikel9
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023864
        artikel: '9'
        hoofdstuk: '2'
  - number: '11.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over door zorgaanbieders te verwerken
      feiten of gegevens met betrekking tot cliënten van wie het vaststellen van de identiteit of het burgerservicenummer
      onmogelijk blijkt of een onevenredige inspanning kost.
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel11
  - number: '11.2'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kan worden bepaald aan welke
      beveiligingseisen de gegevensverwerking, bedoeld in het eerste lid, voldoet.
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel11
  - number: '14.1'
    text: |-
      Er worden ingesteld een register van zorgaanbieders, een register van indicatieorganen en een register van
      zorgverzekeraars waarin onderscheidenlijk een zorgaanbieder, een indicatieorgaan en een zorgverzekeraar
      op hun verzoek worden opgenomen teneinde gebruik te kunnen maken van de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onder c en d, van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: '14.2'
    text: Elk register wordt ingesteld en beheerd door Onze Minister of een door Onze Minister aangewezen instelling.
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel14
  - number: '15.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het opnemen, wijzigen en verwijderen van
      gegevens in onderscheidenlijk uit de in [artikel 14][ref1] bedoelde registers van zorgaanbieders, indicatieorganen
      en zorgverzekeraars, alsmede over het beheer van de registers, in ieder geval wat betreft de beveiliging van
      persoonsgegevens en het toezicht op het functioneren van de registers.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel14
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '14'
        hoofdstuk: '3'
  - number: '15.2'
    text: |-
      Bij de maatregel, bedoeld in het eerste lid, kunnen bijdragen van de zorgaanbieders, indicatieorganen en
      zorgverzekeraars worden verlangd in de kosten van de registers.
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel15
  - number: '15.3'
    text: |-
      De beheerder van een register als bedoeld in [artikel 14][ref1] verschaft aan een in het register ingeschreven
      zorgaanbieder, indicatieorganen en zorgverzekeraar op diens verzoek een middel waarmee deze ten behoeve van
      de raadpleging, bedoeld in [artikel 7, eerste lid][ref2], toegang kan krijgen tot de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onder c en d, van de Wet algemene bepalingen burgerservicenummer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0023864#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '14'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0023864
        artikel: '7'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0022428
        artikel: '3'
  - number: '15.4'
    text: De beheerder kan voor het middel een vergoeding verlangen.
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel15
  - number: '15.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de kenmerken, de aanvraag, de
      productie, de verstrekking, het beheer, de beveiliging, het gebruik en de intrekking van alsmede de vergoeding voor
      het middel.
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel15
  - number: '16'
    text: |-
      De zorgaanbieder verstrekt op verzoek aan de ambtenaren, bedoeld in
      [artikel 86, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref1] en
      [artikel 8, eerste lid, van de Kwaliteitswet zorginstellingen][ref2] kosteloos alle inlichtingen en gegevens,
      waaronder persoonsgegevens als bedoeld in de [Wet bescherming persoonsgegevens][ref3], die noodzakelijk zijn voor
      het toezicht op de naleving van de eerstgenoemde wetten voor wat betreft het gebruik van het burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0007850#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '86'
      - id: ref2
        bwb_id: BWBR0007850
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011468
  - number: '17.1'
    text: |-
      Onverminderd het bepaalde bij of krachtens de [Wet gemeentelijke basisadministratie persoonsgegevens][ref1], kunnen
      bij of krachtens algemene maatregel van bestuur regels worden gesteld ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: 17.1.a
    text: |-
      de wijze en het tijdstip waarop burgerservicenummers van personen die op het tijdstip van inwerkingtreding van deze
      wet cliënt zijn van een zorgaanbieder, een indicatieorgaan of een zorgverzekeraar, aan deze ter beschikking worden
      gesteld;
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel17
  - number: 17.1.b
    text: |-
      de wijze waarop de zorgaanbieder, het indicatieorgaan en de zorgverzekeraar de identiteit en het
      burgerservicenummer vaststellen van de cliënten, bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel17
  - number: 17.1.c
    text: |-
      de verwerking van persoonsnummers van de cliënten, bedoeld onder a, waarover de zorgaanbieder, het indicatieorgaan
      en de zorgverzekeraar op het tijdstip van inwerkingtreding van deze wet beschikken.
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel17
  - number: '17.2'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kan onderscheid worden gemaakt tussen
      verschillende categorieën cliënten, zorgaanbieders, indicatieorganen en zorgverzekeraars.
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel17
  - number: '17.3'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, kan worden afgeweken van de bepalingen in deze
      wet, de [Wet algemene bepalingen burgerservicenummer][ref1], de [Algemene Wet Bijzondere Ziektekosten][ref2] en de
      [Zorgverzekeringswet][ref3] omtrent het gebruik van het burgerservicenummer alsmede omtrent het vaststellen van de
      identiteit en het burgerservicenummer van cliënten.


      [ref1]: https://wetten.overheid.nl/BWBR0022428
      [ref2]: https://wetten.overheid.nl/BWBR0002614
      [ref3]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022428
      - id: ref2
        bwb_id: BWBR0002614
      - id: ref3
        bwb_id: BWBR0018450
  - number: 17a.1
    text: |-
      Vooruitlopend op de inwerkingtreding van een wettelijke verplichting tot gebruik van het burgerservicenummer
      kan bij algemene maatregel van bestuur worden bepaald dat daarbij aan te wijzen categorieën zorgaanbieders,
      indicatieorganen of zorgverzekeraars voor daarbij aan te wijzen vormen van zorg gedurende een daarbij aan te wijzen
      periode het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer van een cliënt mogen
      gebruiken.
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel17a
  - number: 17a.2
    text: |-
      Op het gebruik van het burgerservicenummer op grond van de algemene maatregel van bestuur, bedoeld in het
      eerste lid, is het gestelde bij of krachtens deze wet, de [Wet algemene bepalingen burgerservicenummer][ref1],
      de [Algemene Wet Bijzondere Ziektekosten][ref2] en de [Zorgverzekeringswet][ref3] omtrent het gebruik van het
      burgerservicenummer, met inbegrip van de beveiliging, de geheimhouding, het toezicht en de handhaving, alsmede
      omtrent het vaststellen van de identiteit en het burgerservicenummer van cliënten van toepassing met dien verstande
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0022428
      [ref2]: https://wetten.overheid.nl/BWBR0002614
      [ref3]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0022428
      - id: ref2
        bwb_id: BWBR0002614
      - id: ref3
        bwb_id: BWBR0018450
  - number: 17a.2.a
    text: |-
      ingevolge die toepassing een bevoegdheid in plaats van een verplichting ontstaat tot het gebruik van het
      burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer;
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel17a
  - number: 17a.2.b
    text: |-
      het gestelde omtrent het vaststellen van de identiteit en het burgerservicenummer of, bij het ontbreken daarvan,
      het sociaal-fiscaalnummer, slechts van toepassing is ten aanzien van cliënten waarvan dat nummer wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel17a
  - number: 17a.2.c
    text: |-
      de zorgaanbieder, het indicatieorgaan en de zorgverzekeraar worden aangemerkt als gebruiker in de zin van de
      [Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0022428
  - number: 17b
    text: |-
      De voordracht voor een krachtens deze wet vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan
      dan twee weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel17b
  - number: '25'
    text: 'Deze wet wordt aangehaald als: Wet gebruik burgerservicenummer in de zorg.'
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel25
  - number: '26'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan alsmede voor verschillende vormen van zorg en categorieën van
      zorgaanbieders, indicatieorganen en zorgverzekeraars verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023864/2008-06-01#Artikel26
