  - number: '11'
    text: |-
      De rapportage over de naleving van de uitkeringsbepalingen, bedoeld in de [artikelen 45][ref1] en
      [47 van het Bekostigingsbesluit cultuuruitingen][ref2], geschiedt overeenkomstig de volgende bijlagen bij deze
      regeling:

      a. [bijlage II][ref3], Controleprotocol;

      b. [bijlage III][ref4], Model accountantsverklaring;

      c. [bijlage IV][ref5], Model inhoudelijke verantwoording gemeenten en provincies Actieplan Cultuurbereik;

      d. [bijlage V][ref6], Model inhoudelijke verantwoording gemeenten en provincies Geldstroom Beeldende Kunst en
      Vormgeving;

      e. [bijlage VI][ref7], Model inhoudelijke verantwoording gemeenten en provincies Cultuureducatie Primair Onderwijs;

      f. [bijlage VII][ref8], Model financiële verantwoording gemeenten en provincies Actieplan Cultuurbereik en
      gemeenten Geldstroom Beeldende Kunst en Vormgeving;

      g. [bijlage VIII][ref9], Model financiële verantwoording provincies Geldstroom Beeldende Kunst en Vormgeving;

      h. [bijlage IX][ref10], Model financiële verantwoording gemeenten en provincies Cultuureducatie Primair Onderwijs.


