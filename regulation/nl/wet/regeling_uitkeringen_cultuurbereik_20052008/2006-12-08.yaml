  - number: '7'
    text: |-
      1 De minister betaalt een voorschot van één vierde deel van de uitkering, bedoeld in
      [artikel 3, eerste en tweede lid][ref1], in de maand juni van het desbetreffende jaar waarvoor het voorschot is
      bestemd.

      2 De minister betaalt in de maand juni van 2005 een voorschot op de uitkering, bedoeld in
      [artikel 3, derde lid][ref2], van € 1,– vermenigvuldigd met het door de scholen opgegeven aantal leerlingen dat op
      1 oktober 2004:

      a. binnen de desbetreffende gemeente primair onderwijs volgt, of

      b. binnen de desbetreffende provincie primair onderwijs volgt minus het aantal leerlingen dat primair onderwijs
      volgt binnen een gemeente die in deze provincie ligt.

      3 De minister betaalt in de maand juni van 2006 een voorschot op de uitkering, bedoeld in
      [artikel 3, derde lid][ref3], van € 1,50 vermenigvuldigd met het door de scholen opgegeven aantal leerlingen dat op
      1 oktober 2005:

      a. binnen de desbetreffende gemeente primair onderwijs volgt, of

      b. binnen de desbetreffende provincie primair onderwijs volgt minus het vastgestelde aantal leerlingen dat primair
      onderwijs volgt binnen een gemeente die in deze provincie ligt.

      4 Indien een uitkering als bedoeld in [artikel 3, derde lid][ref4], wordt verlengd tot en met het jaar 2007,
      betaalt de Minister in de maand juni van 2007 een voorschot op de uitkering van € 1,50 vermenigvuldigd met het door
      de scholen opgegeven aantal leerlingen dat op 1 oktober 2006:

      a. binnen de desbetreffende gemeente primair onderwijs volgt, of

      b. binnen de desbetreffende provincie primair onderwijs volgt minus het vastgestelde aantal leerlingen dat primair
      onderwijs volgt binnen een gemeente die in deze provincie ligt.


