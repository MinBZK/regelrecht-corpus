    Besluit:
  url: https://wetten.overheid.nl/BWBR0018160/2006-12-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. aanvrager: een college van burgemeester en wethouders van een gemeente of een college van gedeputeerde staten
      van een provincie;

      b. gemeente: Alkmaar, Almere, Amersfoort, Amsterdam, Apeldoorn, Arnhem, Breda, Delft, Den Bosch, Den Haag,
      Dordrecht, Ede, Eindhoven, Emmen, Enschede, Groningen, Haarlem, Haarlemmermeer, Heerlen, Hengelo, Leeuwarden,
      Leiden, Maastricht, Nijmegen, Rotterdam, Tilburg, Utrecht, Zaanstad, Zoetermeer of Zwolle;

      c. minister: de Minister van Onderwijs, Cultuur en Wetenschap;

      d. primair onderwijs: onderwijs als bedoeld in de [Wet op het primair onderwijs][ref1] of de
      [Wet op de expertisecentra][ref2];

      e. school: een school in de zin van de [Wet op het primair onderwijs][ref3] of de
      [Wet op de expertisecentra][ref4];

      f. uitkering: een specifieke uitkering als bedoeld in [artikel 3, eerste, tweede of derde lid][ref5].


