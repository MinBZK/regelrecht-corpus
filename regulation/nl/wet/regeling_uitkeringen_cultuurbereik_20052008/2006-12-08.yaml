  - number: '2'
    text: |-
      De minister kan van deze regeling afwijken, mits de beschikking waarbij een uitkering wordt verstrekt, de afwijking
      nadrukkelijk vermeldt.
    url: https://wetten.overheid.nl/BWBR0018160/2006-12-08#Artikel2
  - number: '3'
    text: |-
      1 De minister kan voor de periode 2005–2008 aan een gemeente of een provincie een specifieke uitkering verstrekken
      voor het in die gemeente of provincie te voeren beleid ten aanzien van cultuurbereik.

      2 De minister kan voor de periode 2005–2008 aan de gemeenten Amsterdam, Arnhem, Breda, Den Bosch, Den Haag,
      Eindhoven, Enschede, Groningen, Leeuwarden, Maastricht, Rotterdam, Tilburg, Utrecht, Zwolle of provincies
      specifieke uitkeringen verstrekken voor het in die gemeente of provincie te voeren beleid ten aanzien van beeldende
      kunst en vormgeving.

      3 De minister kan voor de jaren 2005 en 2006 aan een gemeente of een provincie een specifieke uitkering verstrekken
      voor het in die gemeente of provincie te voeren beleid ten aanzien van cultuureducatie in het primair onderwijs.

      4 De Minister kan een specifieke uitkering die aan een gemeente of provincie wordt verstrekt op grond van het derde
      lid, verlengen tot en met het jaar 2007, indien die gemeente of provincie daarmee instemt.
    url: https://wetten.overheid.nl/BWBR0018160/2006-12-08#Artikel3
  - number: '4'
    text: |-
      De uitkering bestaat uit een bedrag voor de door de minister in de beslissing tot toekenning van een uitkering
      aangeduide doelen.
    url: https://wetten.overheid.nl/BWBR0018160/2006-12-08#Artikel4
  - number: '5'
    text: |-
      1 Onverminderd [artikel 41, tweede lid, van het Bekostigingsbesluit cultuuruitingen][ref1], omvat de aanvraag voor
      een uitkering:

      a. een analyse van de gemeentelijke of provinciale infrastructuur op het gebied van cultuurbereik, beeldende kunst
      en vormgeving of cultuureducatie in het primair onderwijs binnen de gemeente of provincie;

      b. een opsomming van keuzes op basis van de analyse, bedoeld in onderdeel a, die past binnen het gemeentelijke
      of provinciale beleid in de uitkeringsperiode ten aanzien van cultuurbereik, beeldende kunst en vormgeving of
      cultuureducatie in het primair onderwijs;

      c. een beschrijving van de beoogde meetbare doelstellingen die passen in de gemeentelijke of provinciale context
      die voortkomen uit de keuzelijst, bedoeld in onderdeel b, en die tevens een bijdrage leveren aan het bereiken van
      de rijksbrede doelstelling, bedoeld in:

      1°. het Beleidskader Actieplan Cultuurbereik 2005–2008, bedoeld in de bijlage bij Kamerstukken II 2003/04, 29200
      VIII, nr. 133,

      2°. het Beleidskader Geldstroom Beeldende Kunst en Vormgeving 2005–2008, bedoeld in de bijlage bij Kamerstukken II
      2003/04, 29200 VIII, nr. 133, of

      3°. de Afspraak tussen de Minister en Staatssecretaris van Onderwijs, Cultuur en Wetenschap, het bestuur van het
      Interprovinciaal Overleg en het bestuur van de Vereniging van Nederlandse Gemeenten over Cultuureducatie Primair
      Onderwijs, bedoeld in de bijlage bij Kamerstukken II 2003/04, 29200 VIII, nr. 133;

      d. de omschrijving van de wijze waarop en de lijst van indicatoren waaraan de gemeente of provincie de
      doelstellingen gaan meten;

      e. een meerjarenbegroting overeenkomstig het als [bijlage I][ref2] bij deze regeling gevoegde model.

      2 Indien de aanvraag een uitkering als bedoeld in [artikel 3, derde lid][ref3], betreft, geeft de aanvrager tevens
      aan hoe gestimuleerd wordt dat:

      a. passende cultuureducatieve activiteiten beschikbaar komen, en

      b. netwerken van scholen en culturele instellingen tot stand worden gebracht.

      3 Indien de aanvrager een college van gedeputeerde staten is, geeft het college in de aanvraag voor een uitkering
      als bedoeld in [artikel 3, derde lid][ref4], tevens aan hoe het college zorg gaat dragen voor de bovenlokale
      coördinatie, bemiddeling en afstemming tussen vraag en aanbod.


