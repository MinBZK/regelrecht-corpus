  - number: '10'
    text: |-
      1 De minister stelt het bedrag van de uitkering, bedoeld in [artikel 3, derde lid][ref1], voor de jaren 2005 en
      2006, voor de desbetreffende gemeente vast aan de hand van de volgende formule: A = B × € 1,– + C × € 1,50.

      2 De minister stelt het bedrag van de uitkering, bedoeld in [artikel 3, derde lid][ref2], voor de jaren 2005
      en 2006, voor de desbetreffende provincie vast aan de hand van de volgende formule: A = (D – B) × € 1,– + (E –
        C) × € 1,50.

      3 De Minister stelt het bedrag van de uitkering, bedoeld in [artikel 3, derde en vierde lid][ref3], voor de jaren
      2005 tot en met 2007 voor de desbetreffende gemeente vast aan de hand van de volgende formule: A = B × € 1,– + C ×
      € 1,50 + F × € 1,50.

      4 De Minister stelt het bedrag van de uitkering, bedoeld in [artikel 3, derde en vierde lid][ref4], voor de jaren
      2005 tot en met 2007 voor de desbetreffende provincie vast aan de hand van de volgende formule: A = (D – B) × € 1,–
      + (E – C) × € 1,50 + (G – F) × € 1,50.

      5 In de formule als bedoeld in het eerste en tweede lid is:

      A: het bedrag van de uitkering, bedoeld in [artikel 3, derde lid][ref5];

      B: het door de scholen opgegeven aantal leerlingen dat binnen de desbetreffende gemeente primair onderwijs volgt op
      1 oktober 2004;

      C: het door de scholen opgegeven aantal leerlingen dat binnen de desbetreffende gemeente primair onderwijs volgt op
      1 oktober 2005;

      D: het door de scholen opgegeven aantal leerlingen dat binnen de desbetreffende provincie primair onderwijs volgt
      op 1 oktober 2004;

      E: het door de scholen opgegeven aantal leerlingen dat binnen de desbetreffende provincie primair onderwijs volgt
      op 1 oktober 2005;

      F. het door de scholen opgegeven aantal leerlingen dat binnen de desbetreffende gemeente primair onderwijs volgt op
      1 oktober 2006;

      G. het door de scholen opgegeven aantal leerlingen dat binnen de desbetreffende provincie primair onderwijs volgt
      op 1 oktober 2006.


