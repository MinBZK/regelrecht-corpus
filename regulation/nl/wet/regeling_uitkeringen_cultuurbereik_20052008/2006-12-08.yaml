    text: |-
      1 Onverminderd [artikel 4, eerste en tweede lid, van het Bekostigingsbesluit cultuuruitingen][ref1] weigert de
      minister aan:

      a. de desbetreffende gemeente of provincie een uitkering als bedoeld in [artikel 3, eerste lid][ref2], te
      verstrekken als de eigen bijdrage van deze gemeente of provincie lager is dan deze uitkering;

      b. Amsterdam, Arnhem, Den Haag, Eindhoven, Enschede, Groningen, Maastricht, Rotterdam en Utrecht een uitkering als
      bedoeld in [artikel 3, tweede lid][ref3], te verstrekken als de eigen bijdrage van deze gemeente lager is dan deze
      uitkering;

      c. de desbetreffende provincie een uitkering als bedoeld in [artikel 3, tweede lid][ref4], te verstrekken als
      de eigen bijdrage van deze provincie lager is dan deze uitkering minus het bedrag dat deze provincie besteedt in
      samenwerking met een of meer gemeenten.

      d. de desbetreffende gemeente of provincie een uitkering, bedoeld in [artikel 3, derde lid][ref5], te verstrekken
      als de financiële inzet in het jaar 2005 en 2006 van deze gemeente of provincie op het gebied van aanbod,
      ondersteuning en bemiddeling ten behoeve van cultuureducatie voor het primair onderwijs lager is dan de financiële
      inzet in 2004.

      2 Onder gemeenten in het eerste lid, onderdeel c, worden ook andere gemeenten verstaan dan de gemeenten, genoemd in
      [artikel 1, onderdeel b][ref6].


