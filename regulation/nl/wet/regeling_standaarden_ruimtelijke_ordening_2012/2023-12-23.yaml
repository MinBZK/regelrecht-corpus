  - number: '2.1'
    text: |-
      De vormgeving, inrichting en elektronische beschikbaarstelling van een visie, plan, besluit of
      verordening als bedoeld in [artikel 1.2.1, eerste lid, van het besluit][ref1] en de elektronische
      beschikbaarstelling van de informatie, bedoeld in artikel 1.2.1, derde lid, een ontwerpbesluit
      als bedoeld in [artikel 1.2.1a, van het besluit][ref2] en een mededeling als bedoeld in
      [artikel 6.14, eerste lid, van het Besluit omgevingsrecht][ref3], vinden plaats overeenkomstig de standaarden
      IMRO2012, IMROPT2012, SVBP2012 en STRI2012, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0027464#Artikel6
    url: https://wetten.overheid.nl/BWBR0031829/2023-12-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0023798
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0027464
        artikel: '6'
  - number: 2.1.a
    text: |-
      de standaard SVBP2012 alleen van toepassing is op bestemmingsplannen, rijksbestemmingsplannen en wijzigings- of
      uitwerkingsplannen;
    url: https://wetten.overheid.nl/BWBR0031829/2023-12-23#Artikel2
  - number: 2.1.b
    text: |-
      de standaard IMROPT2012 slechts wordt gebruikt voor zover een visie, plan, besluit of verordening objectgerichte
      planteksten bevat.
    url: https://wetten.overheid.nl/BWBR0031829/2023-12-23#Artikel2
  - number: '2.2'
    text: |-
      Het beheer van de in het eerste lid bedoelde standaarden wordt opgedragen aan een of meer door Onze Minister aan te
      wijzen instanties.
    url: https://wetten.overheid.nl/BWBR0031829/2023-12-23#Artikel2
  - number: '2.3'
    text: |-
      De vormgeving, inrichting en elektronische beschikbaarstelling van een welstandsnota als bedoeld in
      [artikel 12a van de Woningwet][ref1] die wordt aangeboden voor publicatie op de landelijke voorziening, bedoeld in
      [artikel 1.2.1, tweede lid, van het besluit][ref2], vinden plaats overeenkomstig de standaard STRI2012.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel1
    url: https://wetten.overheid.nl/BWBR0031829/2023-12-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
      - id: ref2
        bwb_id: BWBR0023798
        artikel: '1'
  - number: '3'
    text: |-
      Voor zover in de bijlagen bij deze regeling ten aanzien van producten technische voorschriften zijn gesteld als
      bedoeld in de [richtlijn nr. 98/34/EG](31998L0034) van het Europees Parlement en de Raad van de Europese Unie van
      22 juni 1998 betreffende een informatieprocedure op het gebied van normen en technische voorschriften en regels
      betreffende diensten van de informatiemaatschappij (PbEG L 204), zoals gewijzigd bij [richtlijn nr. 98/48/EG]
      (31998L0048) van 20 juli 1998 (PbEG L 217), worden met die producten gelijkgesteld producten die rechtmatig zijn
      vervaardigd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie dan wel rechtmatig zijn
      vervaardigd of in de handel zijn gebracht in een staat niet zijnde een lidstaat van de Europese Unie, die partij
      is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en die voldoen aan eisen die
      een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met die technische voorschriften
      wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0031829/2023-12-23#Artikel3
  - number: '4'
    text: |-
      De [Regeling standaarden ruimtelijke ordening 2008][ref1] wordt ingetrokken.


