articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *besluit:* [Besluit ruimtelijke ordening][ref1];
        - *bijlage:* bij deze regeling behorende bijlage;
        - *IMRO2012:* Informatiemodel Ruimtelijke Ordening 2012, opgenomen in [bijlage 4][ref2];
        - *IMROPT2012:* Informatiemodel Ruimtelijke Ordening Planteksten 2012, opgenomen in [bijlage 7][ref3];
        - *STRI2012:* Standaard Toegankelijkheid Ruimtelijke Instrumenten 2012, opgenomen in [bijlage 6][ref4];
        - *SVBP2012:* Standaard Vergelijkbare Bestemmingsplannen 2012, opgenomen in [bijlage 5][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0023798
