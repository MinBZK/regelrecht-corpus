preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat Verordening (EG) 2157/2001 van de Raad van de Europese Unie van 8
    oktober 2001 betreffende het statuut van de Europese vennootschap (SE) (PbEG L 294) moet worden uitgevoerd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van de [artikelen 2 tot en met 22][ref1] van deze wet wordt onder «Verordening» verstaan de
      [Verordening (EG) nr. 2157/2001](32001R2157) van de Raad van de Europese Unie van 8 oktober 2001 betreffende het
      statuut van de Europese vennootschap (SE) (PbEG L 294).


      [ref1]: https://wetten.overheid.nl/BWBR0018114#Artikel2
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018114
        artikel: '2'
        hoofdstuk: '1'
  - number: '2'
    text: |-
      Een vennootschap in de zin van artikel 2, vijfde lid, van de Verordening kan deelnemen aan de oprichting van een
      Europese naamloze vennootschap met statutaire zetel in Nederland.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel2
  - number: '3'
    text: |-
      Ten behoeve van de verplaatsing van de statutaire zetel naar een andere lidstaat van de Europese Gemeenschap,
      legt een Europese naamloze vennootschap met statutaire zetel in Nederland een voorstel tot zetelverplaatsing als
      bedoeld in artikel 8, tweede lid, van de Verordening neer ten kantore van het handelsregister. De Europese naamloze
      vennootschap kondigt in een landelijk verspreid dagblad aan dat het voorstel is neergelegd, met opgave van het
      handelsregister waar het voorstel ligt en van het adres waar krachtens artikel 8, vierde lid, van de Verordening
      van het voorstel kennis kan worden genomen.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel3
  - number: '4'
    text: |-
      1 Een Europese naamloze vennootschap met statutaire zetel in Nederland die tot zetelverplaatsing naar een andere
      lidstaat van de Europese Gemeenschap wil overgaan moet, op straffe van gegrondverklaring van een verzet als bedoeld
      in lid 2, voor iedere schuldeiser die dit verlangt zekerheid stellen of hem een andere waarborg geven voor de
      voldoening van zijn vordering die voor de zetelverplaatsing is ontstaan of kan ontstaan. Dit geldt niet, indien de
      schuldeiser voldoende waarborgen heeft of de vermogenstoestand van de vennootschap voldoende zekerheid biedt dat de
      vordering zal worden voldaan.

      2 Tot twee maanden nadat de vennootschap de nederlegging van het voorstel tot zetelverplaatsing heeft aangekondigd
      kan iedere schuldeiser door indiening van een verzoek bij de rechtbank tegen het voorstel tot zetelverplaatsing in
      verzet komen met vermelding van de waarborg die wordt verlangd.

      3 Voordat de rechter beslist, kan hij de vennootschap in de gelegenheid stellen binnen een door hem te stellen
      termijn een door hem omschreven waarborg te geven.

      4 Indien tijdig verzet is gedaan, mag de verklaring in de zin van artikel 8, achtste lid, van de Verordening eerst
      worden afgegeven, zodra het verzet is ingetrokken of de opheffing van het verzet uitvoerbaar is.

      5 Indien de zetelverplaatsing al heeft plaatsgevonden, kan de rechter op een ingesteld rechtsmiddel het stellen van
      een door hem omschreven waarborg bevelen en daaraan een dwangsom verbinden.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel4
  - number: '5'
    text: |-
      1 De zetelverplaatsing van een Europese naamloze vennootschap met statutaire zetel in Nederland naar een andere
      lidstaat van de Europese Gemeenschap heeft geen rechtsgevolg wanneer Onze Minister van Justitie zich daartegen
      verzet om redenen van algemeen belang door nederlegging van een daarop betrekking hebbende verklaring ten
      kantore van het handelsregister, binnen twee maanden na de aankondiging van de nederlegging van het voorstel. De
      verklaring in de zin van artikel 8, achtste lid, van de Verordening mag eerst worden afgegeven, zodra het verzet is
      ingetrokken of de opheffing van het verzet onherroepelijk is.

      2 Voor de toepassing van artikel 8, veertiende lid, tweede alinea, van de Verordening is de tweede zin van het
      eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel5
  - number: '6'
    text: |-
      1 Als register voor de inschrijving van een Europese naamloze vennootschap met statutaire zetel in Nederland of van
      een Nederlandse nevenvestiging van een Europese naamloze vennootschap wordt aangewezen: het handelsregister bedoeld
      in [artikel 2 van de Handelsregisterwet 2007][ref1].

      2 Bij inschrijving van de zetelverplaatsing van een Europese naamloze vennootschap naar Nederland
      wordt een notariële akte die de statuten van de vennootschap bevat en is verleden door een notaris met
      standplaats in Nederland neergelegd ten kantore van het handelsregister. De [artikelen 65][ref2] en
      [69 van boek 2 van het Burgerlijk Wetboek][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel69
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '65'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '69'
  - number: '7'
    text: |-
      Een vennootschap met statutaire zetel in Nederland kan niet aan de oprichting van een Europese naamloze
      vennootschap door fusie deelnemen wanneer Onze Minister van Justitie zich daartegen verzet om redenen van algemeen
      belang door nederlegging van een daarop betrekking hebbende verklaring ten kantore van het handelsregister binnen
      een maand na de bekendmaking van de gegevens als bedoeld in artikel 21 van de Verordening. De deelneming aan de
      fusie heeft eerst rechtsgevolg zodra het verzet is ingetrokken of de opheffing van het verzet onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel7
  - number: '8'
    text: |-
      1 Voor de toepassing van artikel 32, derde lid, van de Verordening legt elke initiatief nemende vennootschap met
      statutaire zetel in Nederland ten kantore van het handelsregister neer:

      a. het voorstel tot oprichting van een Europese naamloze vennootschap;

      b. een schriftelijk verslag als bedoeld in artikel 32, vierde lid, van de Verordening.

      2 Tegelijkertijd leggen de leidinggevende of de bestuursorganen de stukken neer ten kantore van de initiatief
      nemende vennootschap of, bij gebreke van een kantoor, aan de woonplaats van een bestuurder. De stukken liggen
      tot het tijdstip van de oprichting van de holding-SE ter inzage voor de aandeelhouders. In dit tijdvak kunnen zij
      kosteloos een afschrift daarvan krijgen.

      3 Een initiatief nemende vennootschap met statutaire zetel in Nederland kondigt in een landelijk verspreid dagblad
      aan dat de stukken zijn neergelegd, met opgave van de openbare registers waar zij liggen en van het adres waar zij
      krachtens het tweede lid ter inzage liggen.

      4 Indien de leidinggevende of de bestuursorganen het voorstel tot oprichting van een holding-SE wijzigen, is dit
      artikel van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel8
  - number: '9'
    text: |-
      Ter uitvoering van artikel 33, derde lid, van de Verordening deponeert elke initiatief nemende vennootschap met
      statutaire zetel in Nederland ten kantore van het handelsregister een verklaring dat aan alle voorwaarden voor de
      oprichting van een Europese naamloze vennootschap is voldaan en kondigt zij de nederlegging aan in een landelijk
      verspreid dagblad.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel9
  - number: '10'
    text: |-
      De naamloze vennootschap met statutaire zetel in Nederland die overeenkomstig artikel 37 van de Verordening een
      voorstel tot omzetting in een Europese naamloze vennootschap heeft opgesteld, legt het voorstel neer ten kantore
      van het handelsregister en kondigt de nederlegging aan in een landelijk verspreid dagblad.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel10
  - number: '11'
    text: |-
      1 De benoeming van de leden van het leidinggevend orgaan geschiedt door het toezichthoudend orgaan, tenzij in de
      statuten is bepaald dat benoeming geschiedt door de algemene vergadering.

      2 Voor de toepassing van artikel 39, tweede lid, van de Verordening zijn de [artikelen 133][ref1] en
      [134 van boek 2 van het Burgerlijk Wetboek][ref2] van overeenkomstige toepassing op de Europese naamloze
      vennootschap met statutaire zetel in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel134
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '133'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '134'
  - number: '12'
    text: |-
      Voor de toepassing van artikel 39, derde lid, van de Verordening is
      [artikel 134, vierde lid, van boek 2 van het Burgerlijk Wetboek][ref1] van overeenkomstige toepassing op de
      Europese naamloze vennootschap met statutaire zetel in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel134
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '134'
  - number: '13'
    text: Het bestuursorgaan als bedoeld in artikel 43 van de Verordening bestaat uit ten minste drie leden.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel13
  - number: '14'
    text: |-
      Voor de toepassing van artikel 47, eerste lid, van de Verordening geldt dat de leden van het bestuursorgaan die
      overeenkomstig een onderlinge taakverdeling niet belast zijn met het uitvoerend bestuur, natuurlijke personen
      moeten zijn.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel14
  - number: '15'
    text: |-
      Voor de toepassing van artikel 54 van de Verordening geldt dat de eerste algemene vergadering binnen achttien
      maanden na de oprichting mag plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel15
  - number: '16'
    text: |-
      Voor de toepassing van artikel 56 van de Verordening is [artikel 114a van boek 2 van het Burgerlijk Wetboek][ref1]
      van overeenkomstige toepassing op een Europese naamloze vennootschap met statutaire zetel in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel114a
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 114a
  - number: '17'
    text: |-
      Voor de toepassing van artikel 59 van de Verordening geldt dat een besluit tot statutenwijziging waaromtrent bij de
      statuten geen grotere meerderheid is voorgeschreven, wordt genomen bij volstrekte meerderheid van de uitgebrachte
      stemmen in een vergadering waarin ten minste de helft van het geplaatste kapitaal is vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel17
  - number: '18'
    text: |-
      Een Europese naamloze vennootschap met statutaire zetel in Nederland wordt door de rechtbank op verzoek van het
      Openbaar Ministerie ontbonden indien het hoofdbestuur niet in Nederland is gevestigd. Alvorens de ontbinding uit
      te spreken kan de rechtbank de vennootschap in de gelegenheid stellen binnen een door haar te bepalen termijn het
      hoofdbestuur naar Nederland te verplaatsen dan wel de statutaire zetel te verplaatsen overeenkomstig artikel 8 van
      de Verordening.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel18
  - number: '19'
    text: |-
      De Europese naamloze vennootschap met statutaire zetel in Nederland die overeenkomstig artikel 66 van de
      Verordening een voorstel tot omzetting in een naamloze vennootschap heeft opgesteld, legt het voorstel neer ten
      kantore van het handelsregister en kondigt de nederlegging aan in een landelijk verspreid dagblad.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel19
  - number: '20'
    text: |-
      Als bevoegde autoriteit in de zin van artikel 8, achtste lid, artikel 25, tweede lid, en artikel 26, eerste lid,
      van de Verordening wordt aangewezen: een notaris met vestigingsplaats in Nederland.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel20
  - number: '21'
    text: |-
      Als bevoegde autoriteit in de zin van artikel 55, derde lid, van de Verordening wordt aangewezen: de
      voorzieningenrechter van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel21
  - number: '22'
    text: |-
      Als bevoegde autoriteit in de zin van artikel 64, vierde lid, van de Verordening wordt aangewezen: het hoofd van
      het ressortsparket.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel22
  - number: '26'
    text: 'Deze wet wordt aangehaald als: Uitvoeringswet verordening Europese vennootschap.'
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel26
  - number: '27'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0018114/2017-09-01#Artikel27
