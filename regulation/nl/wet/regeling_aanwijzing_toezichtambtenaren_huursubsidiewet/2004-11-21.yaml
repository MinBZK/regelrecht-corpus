$id: regeling_aanwijzing_toezichtambtenaren_huursubsidiewet
regulatory_layer: WET
publication_date: '2004-12-27'
valid_from: '2004-11-21'
bwb_id: BWBR0017539
url: https://wetten.overheid.nl/BWBR0017539/2004-11-21
preamble:
  text: |-
    Gelet op de artikelen 33, tweede lid, en 48b, eerste lid, van de Huursubsidiewet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017539/2004-11-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als ambtenaren bedoeld in de [artikelen 33, tweede lid](onbekend), en [48b, eerste lid, van de Huursubsidiewet]
      (onbekend) worden aangewezen:

      a. de met opsporing belaste ambtenaren van de VROM inlichtingen- en opsporingsdienst van het Inspectoraat-Generaal
      VROM;

      b. de ambtenaren die zich bezighouden met informatie-inwinning bij die dienst.
    url: https://wetten.overheid.nl/BWBR0017539/2004-11-21#Artikel1
  - number: '2'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0017539/2004-11-21#Artikel2
  - number: '3'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing toezichtambtenaren Huursubsidiewet.'
    url: https://wetten.overheid.nl/BWBR0017539/2004-11-21#Artikel3
