  - number: '27'
    text: |-
      1 Het bevoegd gezag draagt er zorg voor dat aan de school een aantal leraren is verbonden dat nodig is om onderwijs
      van voldoende kwaliteit te bieden.

      2 Het bevoegd gezag legt ten aanzien van elke leraar vast over welke opleiding en ervaring deze beschikt. Een
      overzicht wordt op diens verzoek aan de inspectie overgelegd.

      3 Het bevoegd gezag benoemt, schorst en ontslaat de leraar in algemene dienst.
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel27
  - number: '28'
    text: |-
      1 Aan het hoofd van de school staat een directeur.

      2 Het overige personeel heeft tot taak het onderwijs te ondersteunen of de directeur bij te staan.

      3 [Artikel 27, tweede en derde lid][ref1], zijn op de directeur en het overige personeel van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045020#Artikel27
