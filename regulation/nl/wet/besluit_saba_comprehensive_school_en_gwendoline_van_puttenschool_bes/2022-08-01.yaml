  - number: '2'
    text: |-
      De Gwendoline van Puttenschool en de Saba Comprehensive School worden aangewezen als inrichting als bedoeld in
      [artikel 2.86, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.86
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.86'
  - number: '3'
    text: |-
      Onverminderd het bij of krachtens de [wet][ref1] bepaalde, zijn de bepalingen in dit besluit voorwaarden voor
      bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0044212
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0044212
  - number: '4'
    text: |-
      1 Het bevoegd gezag biedt onderwijs aan gericht op CSEC, CVQ, alsmede praktijkonderwijs.

      2 Het bevoegd gezag kan onderwijs aanbieden gericht op CAPE.
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel4
  - number: '5'
    text: |-
      Het bevoegd gezag leeft de regels na die CXC stelt met betrekking tot:

      a. de maatstaven voor CCSLC onderwijs;

      b. de inrichting van CSEC, CVQ en CAPE onderwijs;

      c. het aanbieden en het inrichten van een examen en assessments;

      d. de wijze van examinering;

      e. het behalen van een deelcertificaat, certificaat en diploma, alsmede het vaststellen van de modellen van die
      documenten; en

      f. de competentie van leraren, assessoren en verifiers.
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel5
  - number: '6'
    text: |-
      1 Het onderwijs wordt gegeven en de examens worden afgenomen in het Engels.

      2 Bij het geven van onderwijs kan een andere taal dan het Engels worden gebruikt als:

      a. onderwijs over die andere taal wordt gegeven;

      b. dat noodzakelijk is vanwege de specifieke aard, de inrichting of de kwaliteit van het onderwijs; of

      c. dat noodzakelijk is vanwege de herkomst van de deelnemers.

      3 Het bevoegd gezag stelt voor de school een gedragscode vast voor het gebruik van een andere taal dan het Engels
      bij het geven van onderwijs in de gevallen, bedoeld in het tweede lid, onderdelen b en c. De gedragscode wordt aan
      de inspectie gestuurd.

      4 In afwijking van [artikel 2.34 van de wet][ref1] is de aandacht voor de bestrijding van taalachterstanden in het
      bijzonder gericht op de beheersing van de Engelse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.34
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.34'
  - number: '7'
    text: |-
      1 Een basisvak Nederlands maakt deel uit van alle onderwijsprogramma’s op de school, met uitzondering van dat van
      CAPE onderwijs.

      2 Het bevoegd gezag neemt bij de leerling een schoolexamen in het basisvak Nederlands af.

      3 Het bevoegd gezag stelt de leerling in de gelegenheid om een verdiepend vak Nederlands te volgen.

      4 Het bevoegd gezag stelt de leerling in de gelegenheid om een examen in het verdiepende vak Nederlands af te
      leggen. Bij ministeriële regeling wordt vastgesteld welke examens kunnen worden afgelegd.

      5 De ERK niveaus voor het basisvak Nederlands zijn voor:

      a. CVQ: A2; en

      b. CSEC: B1.

      6 De ERK niveaus voor het verdiepende vak Nederlands zijn voor:

      a. CVQ: B1; en

      b. CSEC en CAPE: B2.

      7 Het bevoegd gezag richt het onderwijs zo in dat de leerling optimaal in de gelegenheid gesteld wordt om de
      niveaus behorende bij de betreffende onderwijssoort te halen. Het bevoegd gezag bewaakt de voortgang in de
      ontwikkeling van de leerling.
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel7
  - number: '8'
    text: |-
      In de eerste drie leerjaren wordt door het bevoegd gezag een samenhangend onderwijsprogramma ingericht, dat is
      gebaseerd op CCSLC onderwijs, het basisvak Nederlands, bedoeld in [artikel 7, eerste lid][ref1], omvat, en dat, met
      behoud van keuzevrijheid, de doorstroming van de leerlingen naar CSEC onderwijs of CVQ onderwijs bevordert.


      [ref1]: https://wetten.overheid.nl/BWBR0045020#Artikel7
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0045020
        artikel: '7'
        hoofdstuk: '2'
  - number: '9'
    text: |-
      1 CSEC onderwijs is het onderwijs, volgend op het onderwijs, bedoeld in [artikel 8][ref1], dat is ingericht ter
      voorbereiding op aansluitend beroepsonderwijs.

      2 Het onderwijs omvat het basisvak Nederlands, bedoeld in [artikel 7, eerste lid][ref2], en ten minste vijf CSEC
      vakken, waaronder in ieder geval:

      a. English language and literature; en

      b. Mathematics.

      3 Het onderwijs omvat, samen met het onderwijs, bedoeld in [artikel 8][ref3], ten minste 4.700 klokuren verdeeld
      over een cursusduur van vijf jaar. Het bevoegd gezag beschikt over geordende gegevens over de invulling en over de
      spreiding van de uren over de verschillende leerjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0045020#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0045020#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0045020#Artikel8
