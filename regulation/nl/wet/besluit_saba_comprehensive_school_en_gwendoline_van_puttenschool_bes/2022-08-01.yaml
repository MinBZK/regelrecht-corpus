  - number: '11'
    text: |-
      1 Ten minste een vijfde deel van het CVQ onderwijs is onderricht in de praktijk van het beroep.

      2 Op het buitenschoolse praktijkgedeelte CVQ onderwijs zijn de [artikelen 11.30][ref1], [11.31][ref2],
      [11.58][ref3], en [2.103, vijfde lid, van de wet][ref4] en [artikel 2.64 van het Uitvoeringsbesluit WVO 2020][ref5]
      van overeenkomstige toepassing.

      3 De wijze waarop het buitenschoolse praktijkgedeelte binnen de CVQ opleidingen wordt ingericht, wordt opgenomen in
      het schoolplan.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11.30
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel11.31
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel11.58
