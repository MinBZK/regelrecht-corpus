        artikel: '9'
        hoofdstuk: '2'
  - number: '13'
    text: |-
      1 Praktijkonderwijs is onderwijs bedoeld voor leerlingen voor wie:

      a. overwegend een orthopedagogische en orthodidactische benadering is geboden; en

      b. redelijkerwijs kan worden aangenomen dat het volgen van onderwijs niet leidt tot het behalen van een CSEC of CVQ
      2 certificaat.

      2 Het onderwijs bestaat uit een gedeelte waarin aangepast theoretisch onderwijs, persoonlijkheidsvorming en het
      aanleren van sociale vaardigheden worden verzorgd, en een gedeelte waarin de leerling wordt voorbereid op het
      uitoefenen van functies op de arbeidsmarkt op een niveau dat ligt onder het niveau van CVQ 1.

      3 Het onderwijs sluit zo veel mogelijk aan bij de inhoud van CVQ 1. [Artikel 2.38, zevende lid, van de wet][ref1]
      en de [artikelen 2.34 tot en met 2.36][ref2] en [2.39 van het Uitvoeringsbesluit WVO 2020][ref3], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.38
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2.34
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2.39
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.38'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2.34'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '2.39'
  - number: '14'
    text: |-
      1 Met in achtneming van de regels van CXC beslist het bevoegd gezag tot welke vorm van onderwijs en tot welk
      leerjaar de leerling wordt toegelaten op grond van criteria die in de schoolgids worden opgenomen.

      2 Aan de ouders van een leerling van wie het bevoegd gezag redelijkerwijs kan aannemen dat deze niet in staat
      is onderwijs CSEC of CVQ 2 met een certificaat af te sluiten, kan het bevoegd gezag voorstellen deze leerling in
      plaats daarvan praktijkonderwijs te doen volgen. Het [tweede en derde lid van artikel 11.8 van de wet][ref1] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11.8
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '11.8'
  - number: '15'
    text: |-
      1 Met inachtneming van de regels van CXC kan het bevoegd gezag na overleg met de ouders een leerling ontheffing
      verlenen voor onderdelen van het onderwijsprogramma. Het bevoegd gezag bepaalt bij de ontheffing welk onderwijs
      voor de leerling in de plaats komt voor de onderdelen waarvoor ontheffing is verleend.

      2 Het bevoegd gezag kan een leerling uitsluitend ontheffing verlenen van het volgen van het onderwijs in het vak
      lichamelijke opvoeding indien de leerling vanwege diens lichamelijke gesteldheid niet in staat is dit onderwijs
      te volgen.
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel15
  - number: '16'
    text: |-
      1 Het bevoegd gezag kan met opgave van redenen een leerling voor een periode van ten hoogste één week schorsen.

      2 Het besluit tot schorsing wordt schriftelijk aan de betrokkene en, indien deze nog niet meerderjarig is, ook aan
      de ouders, voogden of verzorgers van de betrokkene bekendgemaakt.

      3 Het bevoegd gezag stelt de inspectie van een schorsing voor een periode langer dan één dag schriftelijk en met
      opgave van redenen in kennis.
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel16
  - number: '17'
    text: |-
      1 Het bevoegd gezag kan besluiten tot definitieve verwijdering van een leerling nadat deze en, indien de leerling
      nog niet meerderjarig is, ook diens ouders, voogden of verzorgers, in de gelegenheid is onderscheidenlijk zijn
      gesteld hierover te worden gehoord. Een leerling wordt op grond van onvoldoende vorderingen niet in de loop van een
      schooljaar verwijderd.

      2 Definitieve verwijdering van een leerplichtige leerling geschiedt slechts na overleg met de inspectie. Hangende
      dit overleg kan de leerling worden geschorst. Het overleg strekt er mede toe, na te gaan op welke andere wijze de
      betrokken leerling onderwijs zal kunnen volgen.

      3 Het bevoegd gezag stelt de inspectie van een definitieve verwijdering schriftelijk en met opgave van redenen
      in kennis.
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel17
  - number: '18'
    text: |-
      1 De besluiten tot weigering van de toelating van een kandidaat-leerling of tot definitieve verwijdering van een
      leerling worden schriftelijk en met opgave van redenen aan de leerling en, indien deze nog niet meerderjarig is,
      ook aan diens ouders, voogden of verzorgers, bekendgemaakt, waarbij tevens de inhoud van het tweede lid wordt
      vermeld.

      2 Binnen zes weken na de bekendmaking kunnen belanghebbenden bezwaar maken bij het bevoegd gezag.

      3 Het bevoegd gezag beslist in overeenstemming met [artikel 8.8, zesde lid, van de wet][ref1] binnen vier weken
      na ontvangst van het bezwaarschrift, doch niet eerder dan nadat de kandidaat-leerling, onderscheidenlijk de
      leerling en, indien deze nog niet meerderjarig is, ook diens ouders, voogden of verzorgers, in de gelegenheid is,
      onderscheidenlijk zijn gesteld, te worden gehoord en kennis heeft onderscheidenlijk hebben kunnen nemen van de op
      die besluiten betrekking hebbende adviezen of rapporten.

      4 Het bevoegd gezag kan de desbetreffende leerling, gedurende de behandeling van het bezwaar tegen een besluit tot
      definitieve verwijdering de toegang tot de school ontzeggen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8.8
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '8.8'
  - number: '19'
    text: |-
      1 Met inachtneming van de regels van CXC stelt het bevoegd gezag een examenreglement vast, dat in ieder geval
      regels bevat over:

      a. de wijze waarop het examen of assessment wordt afgenomen;

      b. de volgorde waarin, de tijdvakken waarbinnen en het aantal malen per studiejaar dat gelegenheid wordt geboden
      tot het afleggen het examens of assessment;

      c. de organisatie van het examen of assessment;

      d. de gang van zaken tijdens het examen of assessment;

      e. de wijze waarop en de termijn waarbinnen de leerling inzage krijgt in zijn beoordeelde werk;

      f. de herkansingsmogelijkheden; en

      g. de wijze waarop geschillen over de toepassing van het onderwijs- en examenreglement kunnen worden beslecht.

      2 De directeur verstrekt het examenreglement voor aanvang van het schooljaar aan de examenkandidaten en zendt het
      aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel19
  - number: '20'
    text: |-
      1 Het bevoegd gezag stelt de leerling die CSEC onderwijs heeft gevolgd in de gelegenheid om een afsluitend examen
      af te leggen.

      2 De directeur van de school reikt een deelcertificaat uit aan de leerling die heeft voldaan aan alle eisen die
      voor het behalen van dat vak zijn gesteld.

      3 De directeur reikt het certificaat CSEC uit aan de leerling die heeft voldaan aan alle eisen die voor het behalen
      van dat certificaat zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel20
  - number: '21'
    text: |-
      1 Het bevoegd gezag stelt de leerling die CVQ onderwijs heeft gevolgd in de gelegenheid om assessments af te
      leggen.

      2 De assessments worden afgenomen door een assessor en gecontroleerd door een internal verifier. De assessor en de
      internal verifier worden door het bevoegd gezag aangewezen.

      3 De assessments worden verzameld in een portfolio. Het portfolio wordt beoordeeld door een external verifier, die
      wordt aangewezen door een door Onze Minister aan te wijzen organisatie.

      4 De directeur reikt het certificaat CVQ uit aan de leerling die heeft voldaan aan alle eisen die voor het behalen
      van dat certificaat zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel21
  - number: '22'
    text: |-
      1 Het bevoegd gezag stelt de leerling die CAPE onderwijs heeft gevolgd in de gelegenheid om een afsluitend examen
      af te leggen.

      2 De directeur van de school reikt een deelcertificaat uit aan de leerling voor elk vak ten aanzien waarvan die
      leerling heeft voldaan aan alle eisen die voor het behalen van dat vak zijn gesteld.

      3 De directeur reikt het diploma CAPE uit aan de leerling die tenminste zes certificaten, waaronder het vak
      Caribbean Studies, heeft behaald binnen een tijdsbestek van twee jaar.
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel22
  - number: '23'
    text: |-
      [Artikel 2.58, derde lid, van de wet][ref1] is van overeenkomstige toepassing op het praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.58
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.58'
  - number: '24'
    text: |-
      1 De directeur reikt een schooldiploma uit aan de leerling die:

      a. zes vakken voor CAPE met de grades I, II of III heeft afgelegd en voor het examen in het verdiepende vak
      Nederlands, bedoeld in [artikel 7, vierde lid][ref1], een cijfer 6,0 of hoger heeft behaald;

      b. zes vakken voor CSEC met de grades I, II of III heeft afgelegd en voor het examen in het verdiepende vak
      Nederlands, bedoeld in [artikel 7, vierde lid][ref2], een cijfer 6,0 of hoger heeft behaald;

      c. vijf vakken voor CSEC heeft afgelegd met een andere combinatie van grades, dan genoemd in onderdeel b, en voor
      het examen in het verdiepende vak Nederlands, bedoeld in [artikel 7, vierde lid][ref3], een cijfer 6,0 of hoger
      heeft behaald; of

      d. het certificaat CVQ 2 heeft verkregen en voor het examen in het verdiepende vak Nederlands, bedoeld in
      [artikel 7, vierde lid][ref4], een cijfer 6,0 of hoger heeft behaald.

      2 Bij ministeriële regeling worden de modellen voor de schooldiploma’s vastgesteld.


