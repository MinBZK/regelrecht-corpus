  - number: '26'
    text: |-
      1 Onze Minister kan een CVQ opleiding voor bekostiging in aanmerking brengen indien redelijkerwijs kan worden
      aangenomen dat deze opleiding zal worden bezocht door een aantal leerlingen dat, mede gelet op de hoogte van de
      bekostiging die krachtens de [wet][ref1] wordt verstrekt, voldoende is om een CVQ opleiding van voldoende kwaliteit
      in stand te houden.

      2 Het bevoegd gezag dient een aanvraag om een CVQ opleiding voor bekostiging in aanmerking te brengen in bij Onze
      Minister. De aanvraag voor bekostiging van een nieuwe CVQ opleiding gaat vergezeld van een beschrijving van de
      regionale beroepsstandaarden, waaronder een beschrijving van de inhoud van de opleiding.

      3 Bij het besluit om een opleiding voor bekostiging in aanmerking te brengen, betrekt Onze Minister het advies van
      de ROA CN over de doelmatigheid van de opleiding, gelet op de arbeidsmarktrelevantie van die opleiding.

      4 Onze Minister besluit binnen zes maanden na ontvangst van de aanvraag. Indien de beschikking niet binnen zes
      maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.

      5 De bekostiging neemt een aanvang nadat de opleiding door CXC is goedgekeurd en daadwerkelijk is gestart.

      6 De bekostiging van een CVQ opleiding wordt beëindigd indien de opleiding gedurende drie achtereenvolgende
      schooljaren telkens is bezocht door nul leerlingen.

      7 Onze Minister kan de bekostiging van een CVQ opleiding beëindigen indien de kwaliteit van die opleiding naar het
      oordeel van Onze Minister onvoldoende is.

      8 Voordat Onze Minister een beschikking neemt overeenkomstig het zevende lid, geeft hij aan de school een
      waarschuwing op grond van zijn bevindingen ten aanzien van de kwaliteit van de opleiding. Onze Minister geeft eerst
      toepassing aan het zevende lid, nadat:

      a. na de waarschuwing ten minste een jaar verstreken is, en

      b. Onze Minister aan de hand van een nader onderzoek tot het oordeel is gekomen dat niet of niet in voldoende mate
      gevolg is gegeven aan de waarschuwing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel26
