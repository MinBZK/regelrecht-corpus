  - number: '10'
    text: |-
      1 CVQ onderwijs is het onderwijs, volgend op het onderwijs, bedoeld in [artikel 8][ref1], dat is ingericht
      ter voorbereiding op aansluitend beroepsonderwijs of op het uitoefenen van een beroep, waarvoor een
      beroepskwalificerende opleiding is vereist of dienstig kan zijn.

      2 Het onderwijs omvat, samen met onderwijs, bedoeld in [artikel 8][ref2], en het basisvak Nederlands, bedoeld in
      [artikel 7, eerste lid][ref3], ten minste 4.700 klokuren verdeeld over een cursusduur van vijf jaar. Het bevoegd
      gezag beschikt over geordende gegevens over de invulling en over de spreiding van de uren over de verschillende
      leerjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0045020#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0045020#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0045020#Artikel7
