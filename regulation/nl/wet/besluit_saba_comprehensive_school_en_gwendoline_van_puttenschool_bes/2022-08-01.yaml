articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *Bevoegd gezag:* het bevoegd gezag van de school;
        - *CAPE:* de Caribbean Advanced Proficiency Examination;
        - *CCSLC:* het Caribbean Certificate of Secondary Level Competence;
        - *CSEC:* het Caribbean Secondary Education Certificate;
        - *CVQ:* de Caribbean Vocational Qualification, niveau 1 of 2;
        - *CXC:* de Caribbean Examinations Council, gevestigd in Barbados;
        - *deelcertificaat:* een certificaat voor een vak;
        - *praktijkonderwijs:* praktijkonderwijs als bedoeld in [artikel 13][ref1];
        - *ERK-niveaus:* niveaus, overeenkomstig het Europees Referentiekader voor moderne vreemde talen, van beheersing
      van de Nederlandse taal, waarmee de beheersing van de Nederlandse taal door de leerlingen aan het einde van een
      onderwijssoort kan worden vergeleken, zoals opgenomen in de bijlage bij dit besluit;
        - *ROA CN:* de Raad onderwijs arbeidsmarkt, bedoeld in [artikel 11.1 van de wet][ref2];
        - *school:* de Gwendoline van Puttenschool of de Saba Comprehensive School;
        - *wet:* de [Wet voortgezet onderwijs 2020][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0045020#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel11.1
      [ref3]: https://wetten.overheid.nl/BWBR0044212
