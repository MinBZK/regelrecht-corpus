  - number: '25'
    text: |-
      Als diploma in de zin van [artikel 1, onderdeel f, van de Leerplichtwet BES][ref1] worden aangewezen:

      a. het certificaat CSEC, bedoeld in [artikel 20, derde lid][ref2];

      b. een certificaat CVQ, bedoeld in [artikel 21, vierde lid][ref3], op niveau 2; en

      c. het diploma CAPE, bedoeld in [artikel 22, derde lid][ref4].


