  - number: '12'
    text: |-
      1 CAPE onderwijs is het onderwijs, volgend op het CSEC onderwijs, bedoeld in [artikel 9][ref1], dat is ingericht
      ter voorbereiding op wetenschappelijk onderwijs.

      2 Het onderwijs omvat ten minste zes CAPE vakken, waaronder in ieder geval:

      a. English language and literature;

      b. Mathematics; en

      c. Caribbean Studies.

      3 Het onderwijs heeft een cursusduur van twee jaar en omvat ten minste 1.700 klokuren. Het bevoegd gezag beschikt
      over geordende gegevens over de invulling en over de spreiding van de uren over de verschillende leerjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0045020#Artikel9
    url: https://wetten.overheid.nl/BWBR0045020/2022-08-01#Artikel12
