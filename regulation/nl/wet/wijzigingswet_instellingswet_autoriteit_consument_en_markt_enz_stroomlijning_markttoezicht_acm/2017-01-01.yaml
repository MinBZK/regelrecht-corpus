preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om in verband met de instelling van de Autoriteit
    Consument en Markt het door haar te houden markttoezicht zoveel mogelijk te stroomlijnen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035297/2017-01-01#ArtikelAanhef
articles:
  - number: XXVa
    text: |-
      Op een verzoekschrift dat is ingediend overeenkomstig de
      [artikelen 2.5 van de Wet handhaving consumentenbescherming][ref1] en
      [305d van Boek 3 van het Burgerlijk Wetboek][ref2], zoals die luidden onmiddellijk voor inwerkingtreding van
      de [artikelen V][ref3], [VI][ref4], en [XVI, onderdeel F][ref5], van deze wet, blijven de bepalingen van de
      [Wet handhaving consumentenbescherming][ref6] van toepassing zoals die luidden onmiddellijk voor inwerkingtreding
      van de genoemde artikelen V, VI en XVI, onderdeel F.


