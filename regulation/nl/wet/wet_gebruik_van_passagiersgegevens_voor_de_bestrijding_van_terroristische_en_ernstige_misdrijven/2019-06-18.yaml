preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te geven in verband met de implementatie
    van richtlijn (EU) 2016/681 van het Europees Parlement en de Raad van 27 april 2016 over het gebruik van
    persoonsgegevens van passagiers (PNR-gegevens) voor het voorkomen, opsporen, onderzoeken en vervolgen van
    terroristische misdrijven en ernstige criminaliteit (PbEU 2016, L 119);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Autoriteit persoonsgegevens:* de
      Autoriteit, bedoeld in [artikel 6 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1];
        - *betrokkene:* degene op wie een persoonsgegeven betrekking heeft;
        - *bevoegde instantie:* een instantie als bedoeld in [artikel 9][ref2];
        - *bijzondere opsporingsdiensten:* de bijzondere opsporingsdiensten, bedoeld in
      [artikel 2 van de Wet op de bijzondere opsporingsdiensten][ref3];
        - *depersonaliseren door afscherming van gegevens:* het voor een gebruiker onzichtbaar maken van die
      gegevenselementen waaruit de identiteit van de betrokkenen rechtstreeks zou kunnen worden afgeleid;
        - *derde land:* een land dat geen lidstaat is van de Europese Unie;
        - *ernstig misdrijf:* een strafbaar feit als bedoeld in [bijlage 2][ref4] van deze wet, waarop naar wettelijke
      omschrijving een gevangenisstraf van drie jaar of meer is gesteld;
        - *functionaris voor gegevensbescherming:* de functionaris, bedoeld in [artikel 18][ref5];
        - *luchtvaartmaatschappij:* een luchtvervoersonderneming met een geldige exploitatievergunning voor het
      luchtvervoer van passagiers als bedoeld in [artikel 1 van de Wet luchtvaart][ref6];
        - *Onze Minister:* Onze Minister van Justitie en Veiligheid;
        - *passagier:* iedere persoon, met inbegrip van de transferpassagiers en transitpassagiers en met uitsluiting van
      de bemanningsleden, die met toestemming van de luchtvaartmaatschappij in een luchtvaartuig wordt vervoerd of zal
      worden vervoerd, en waarbij die toestemming blijkt uit de vermelding van die persoon op de passagierslijst;
        - *passagiersgegevens:* de gegevens, bedoeld in [bijlage 1][ref7] van deze wet;
        - *Passagiersinformatie-eenheid:* de eenheid, bedoeld in [artikel 5][ref8];
        - *persoonsgegevens:* hetgeen daaronder wordt verstaan in
      [artikel 1, onderdeel b, van de Wet politiegegevens][ref9];
        - *PNR:* een bestand met de reisgegevens van iedere passagier, dat informatie bevat die de boekende en de
      deelnemende luchtvaartmaatschappijen nodig hebben om reserveringen te kunnen verwerken en controleren bij elke
      reis die door of namens iemand wordt geboekt; dit bestand kan zich bevinden in een reserveringssysteem, een
      vertrekcontrolesysteem dat wordt gebruikt bij het inchecken van passagiers op vluchten, of een soortgelijk systeem
      dat dezelfde functies vervult;
        - *terroristisch misdrijf:* een misdrijf als bedoeld in [artikel 83][ref10] of
      [artikel 83b van het Wetboek van Strafrecht][ref11];
        - *verwerking van persoonsgegevens:* elke handeling of elk geheel van handelingen met betrekking tot
      persoonsgegevens, waar onder in ieder geval het verzamelen, vastleggen, ordenen, bewaren, bijwerken, wijzigen,
      opvragen, raadplegen, gebruiken, vergelijken, verstrekken door middel van doorzending, verspreiding of enige vorm
      van terbeschikkingstelling, samenbrengen, met elkaar in verband brengen, alsmede het afschermen, uitwissen of
      vernietigen van persoonsgegevens;
        - *vlucht binnen de Europese Unie:* een vlucht door een luchtvaartmaatschappij die vanuit een andere lidstaat,
      zonder tussenlandingen op het grondgebied van een derde land, volgens plan zal aankomen op het grondgebied van
      Nederland, of die zal vertrekken vanaf het grondgebied van Nederland en, zonder tussenlandingen op het grondgebied
      van een derde land, volgens plan zal aankomen op het grondgebied van een of meer andere lidstaten;
        - *vlucht naar of vanuit derde landen:* een vlucht door een luchtvaartmaatschappij, waaronder de vluchten met
      tussenlandingen op het grondgebied van lidstaten of derde landen, die volgens plan vanuit een derde land zal
      aankomen op het grondgebied van Nederland of zal vertrekken vanaf het grondgebied van Nederland en volgens plan zal
      aankomen op het grondgebied van een derde land.


