  - number: '2'
    text: |-
      De overeenkomstig deze wet verzamelde passagiersgegevens worden door de Passagiersinformatie-eenheid uitsluitend
      verwerkt voor het voorkomen, opsporen, onderzoeken en vervolgen van terroristische en ernstige misdrijven met
      inachtneming van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel2
  - number: '3'
    text: |-
      Deze wet is van toepassing op vluchten naar of vanuit derde landen, alsmede op vluchten binnen de Europese Unie, en
      de passagiersgegevens van deze vluchten.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel3
  - number: '4.1'
    text: |-
      Een luchtvaartmaatschappij verstrekt van elke vlucht als bedoeld in [artikel 3][ref1] aan de Passagiersinformatie-
      eenheid de passagiersgegevens waarover zij ten behoeve van haar bedrijfsvoering beschikt. In geval van een gedeelde
      vlucht van twee of meer luchtvaartmaatschappijen, is de maatschappij die de vlucht uitvoert verplicht om alle
      passagiersgegevens te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel3
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '3'
        paragraaf: '1'
  - number: '4.2'
    text: 'De passagiersgegevens worden langs elektronische weg verstrekt:'
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel4
  - number: 4.2.a
    text: |-
      op een of meer door Onze Minister vast te stellen tijdstippen tussen 48 en 24 uur voor de geplande vertrektijd van
      een vlucht; en
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel4
  - number: 4.2.b
    text: |-
      onmiddellijk na het aan boord gaan van de passagiers in het vliegtuig dat klaar staat voor vertrek en waar de
      passagiers niet meer aan of van boord kunnen gaan.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel4
  - number: '4.3'
    text: |-
      In geval van verstrekking als bedoeld in het tweede lid, onderdeel b, kan worden volstaan met het doorgeven van de
      wijzigingen ten opzichte van de op grond van het tweede lid, onderdeel a, verstrekte passagiersgegevens.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel4
  - number: '4.4'
    text: |-
      Een luchtvaartmaatschappij verstrekt op verzoek van de Passagiersinformatie-eenheid de passagiersgegevens tevens
      op andere dan de in het tweede lid genoemde tijdstippen. De Passagiersinformatie-eenheid kan hier uitsluitend
      om verzoeken indien toegang tot deze gegevens naar haar oordeel noodzakelijk is om te kunnen reageren op een
      specifieke en concrete dreiging die verband houdt met een terroristisch of ernstig misdrijf.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel4
  - number: '4.5'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de wijze waarop de passagiersgegevens
      door een luchtvaartmaatschappij aan de Passagiersinformatie-eenheid worden verstrekt, met dien verstande
      dat de Passagiersinformatie-eenheid geen rechtstreekse toegang krijgt tot het reserveringssysteem van de
      luchtvaartmaatschappij.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel4
  - number: '5.1'
    text: 'Er is een Passagiersinformatie-eenheid die tot taak heeft:'
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel5
  - number: 5.1.a
    text: |-
      passagiersgegevens die op grond van [artikel 4][ref1] door een luchtvaartmaatschappij worden verstrekt, te
      verzamelen, op te slaan en anderszins te verwerken, en die gegevens of het resultaat van de verwerking ervan door
      te geven aan de bevoegde instanties; en


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel4
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '4'
        paragraaf: '2'
  - number: 5.1.b
    text: |-
      passagiersgegevens of het resultaat van de verwerking ervan uit te wisselen met de Passagiersinformatie-eenheden
      van de andere lidstaten en met Europol.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel5
  - number: '5.2'
    text: |-
      De Passagiersinformatie-eenheid is ondergebracht bij een door Onze Minister op te richten of aan te wijzen
      instantie of een onderdeel daarvan die bevoegd is terroristische en ernstige misdrijven te voorkomen, op te sporen,
      te onderzoeken of te vervolgen.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel5
  - number: '5.3'
    text: De taken vermeld in het eerste lid worden uitgevoerd onder verantwoordelijkheid van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel5
  - number: '5.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de organisatie, inrichting
      en werkwijze van de Passagiersinformatie-eenheid.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel5
  - number: '6.1'
    text: |-
      De Passagiersinformatie-eenheid verwerkt de overeenkomstig [artikel 4][ref1] ontvangen passagiersgegevens
      uitsluitend met het oog op:


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel4
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '4'
        paragraaf: '2'
  - number: 6.1.a
    text: |-
      het beoordelen van de passagiers voorafgaand aan hun geplande aankomst in of geplande vertrek uit Nederland, om
      te bepalen welke personen vanwege mogelijke betrokkenheid bij een terroristisch of ernstig misdrijf moeten worden
      onderworpen aan een nader onderzoek door een bevoegde instantie of Europol;
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel6
  - number: 6.1.b
    text: 'het voldoen aan:'
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel6
  - number: 6.1.b.1
    text: |-
      een vordering van gegevens van een bevoegde instantie op grond van het [Wetboek van Strafvordering][ref1] of
      [artikel 19 van de Wet op de economische delicten][ref2] in een onderzoek naar een terroristisch of ernstig
      misdrijf; of


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel19
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '19'
  - number: 6.1.b.2
    text: |-
      een verzoek van Europol als bedoeld in [artikel 12][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel12
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '12'
        paragraaf: '6'
  - number: 6.1.c
    text: |-
      het analyseren van passagiersgegevens voor het opstellen van nieuwe of het bijstellen van bestaande criteria die
      worden gebruikt bij de beoordelingen die worden verricht op grond van het tweede lid, aanhef en onderdeel b, om te
      bepalen welke personen betrokken zouden kunnen zijn bij een terroristisch of ernstig misdrijf.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel6
  - number: '6.2'
    text: |-
      Bij het beoordelen van de passagiers als bedoeld in het eerste lid, onderdeel a, is de Passagiersinformatie-eenheid
      bevoegd de passagiersgegevens:
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel6
  - number: 6.2.a
    text: |-
      te vergelijken met een door Onze Minister aangewezen databank of onderdelen daarvan die nationaal dan wel
      internationaal worden bijgehouden voor het voorkomen, opsporen, onderzoeken of vervolgen van terroristische of
      ernstige misdrijven; of
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel6
  - number: 6.2.b
    text: |-
      te verwerken overeenkomstig criteria die vooraf zijn vastgesteld met inachtneming van [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel7
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '7'
        paragraaf: '4'
  - number: '6.3'
    text: |-
      Het beoordelen van passagiers, op grond van het tweede lid, aanhef en onderdeel b, wordt verricht op een niet-
      discriminerende wijze, zodanig dat geen onderscheid wordt gemaakt naar iemands godsdienst of levensovertuiging,
      ras of etnische afkomst, politieke gezindheid, gezondheid, seksuele leven of geaardheid of lidmaatschap van een
      vakvereniging.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel6
  - number: '7.1'
    text: |-
      De criteria, bedoeld in [artikel 6, eerste lid, onderdeel c][ref1], worden door de Passagiersinformatie-eenheid in
      overeenstemming met de betrokken bevoegde instanties vastgesteld en regelmatig getoetst.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel6
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '6'
        paragraaf: '4'
  - number: '7.2'
    text: |-
      De criteria zijn doelgericht, evenredig en specifiek voor het misdrijf waarbij de mogelijke betrokkenheid van een
      persoon overeenkomstig de criteria kan worden bepaald.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel7
  - number: '7.3'
    text: |-
      De criteria zijn niet gebaseerd op godsdienst of levensovertuiging, ras of etnische afkomst, politieke gezindheid,
      gezondheid, seksuele leven of geaardheid of lidmaatschap van een vakvereniging van betrokkenen.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel7
  - number: '7.4'
    text: 'Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel7
  - number: 7.4.a
    text: de wijze waarop de criteria worden opgesteld en bijgesteld; en
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel7
  - number: 7.4.b
    text: de eisen waaraan de criteria en de toepassing ervan moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel7
  - number: '8.1'
    text: |-
      Een positieve overeenkomst bij een verwerking als bedoeld in [artikel 6, tweede lid][ref1], die op geautomatiseerde
      wijze heeft plaatsgevonden, wordt door menselijke tussenkomst gecontroleerd om te bepalen of een bevoegde instantie
      maatregelen moet treffen of nader onderzoek moet doen.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel6
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '6'
        paragraaf: '4'
  - number: '8.2'
    text: |-
      De gegevens, bedoeld in het eerste lid, kunnen door de Passagiersinformatie-eenheid uitsluitend per geval aan een
      bevoegde instantie worden doorgegeven.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel8
  - number: '9.1'
    text: |-
      De bevoegde instanties die van de Passagiersinformatie-eenheid passagiersgegevens of het verwerkingsresultaat van
      die gegevens kunnen verzoeken of ontvangen, teneinde de gegevens die zijn ontvangen nader te onderzoeken, of de
      nodige maatregelen te treffen voor het voorkomen, opsporen, onderzoeken of vervolgen van terroristische of ernstige
      misdrijven, zijn:
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel9
  - number: 9.1.a
    text: het openbaar ministerie;
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel9
  - number: 9.1.b
    text: de politie;
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel9
  - number: 9.1.c
    text: de bijzondere opsporingsdiensten;
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel9
  - number: 9.1.d
    text: de Koninklijke marechaussee; en
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel9
  - number: 9.1.e
    text: de Rijksrecherche.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel9
  - number: '9.2'
    text: |-
      Een bevoegde instantie verwerkt de van de Passagiersinformatie-eenheid ontvangen passagiersgegevens of het
      verwerkingsresultaat van die gegevens uitsluitend verder voor het voorkomen, opsporen, onderzoeken of vervolgen van
      terroristische of ernstige misdrijven.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel9
  - number: 9a
    text: |-
      De Passagiersinformatie-eenheid verstrekt de door de Passagiersinformatie-eenheden van de andere lidstaten
      ontvangen passagiersgegevens of het verwerkingsresultaat van die gegevens voor nader onderzoek aan de bevoegde
      instanties. [Artikel 8][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel8
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '8'
        paragraaf: '4'
  - number: '10.1'
    text: |-
      De Passagiersinformatie-eenheid verstrekt ingeval een persoon is aangemerkt op grond van
      [artikel 6, eerste lid, onderdeel a][ref1], alle passagiersgegevens of het verwerkingsresultaat van die gegevens
      aan de betrokken Passagiersinformatie-eenheden van de andere lidstaten indien dat noodzakelijk en relevant is voor
      het voorkomen, opsporen, onderzoeken of vervolgen van terroristische of ernstige misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel6
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '6'
        paragraaf: '4'
  - number: '10.2'
    text: |-
      De Passagiersinformatie-eenheid verstrekt zo spoedig mogelijk op een voldoende gemotiveerd verzoek van de
      Passagiersinformatie-eenheid van een andere lidstaat, voor zover dit in een bepaald geval noodzakelijk is
      voor het voorkomen, opsporen, onderzoeken of vervolgen van een terroristisch of ernstig misdrijf, de verzochte
      passagiersgegevens en zo nodig het verwerkingsresultaat van die gegevens, ingeval de verwerking al overeenkomstig
      [artikel 6, eerste lid, onderdeel a][ref1], is uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel6
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '6'
        paragraaf: '4'
  - number: '10.3'
    text: |-
      Indien een verzoek als bedoeld in het tweede lid betrekking heeft op passagiersgegevens die op grond van
      [artikel 20, eerste lid, onder d][ref1], zijn gedepersonaliseerd door afscherming van de gegevens, is verstrekking
      van deze gegevens uitsluitend mogelijk met toestemming van de officier van justitie en na kennisgeving aan de
      functionaris gegevensbescherming, die de verwerking achteraf controleert.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel20
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '20'
        paragraaf: '8'
  - number: '10.4'
    text: |-
      In geval van dringende noodzaak kunnen passagiersgegevens, met inachtneming van de voorwaarden in het tweede en
      derde lid, desgevraagd rechtstreeks aan een bevoegde instantie van een andere lidstaat worden verstrekt. Van het
      verzoek dat aan de verstrekking ten grondslag ligt, wordt door de Passagiersinformatie-eenheid een afschrift aan de
      Passagiersinformatie-eenheid van de verzoekende lidstaat gestuurd.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel10
  - number: '10.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de verstrekking van gegevens als bedoeld in
      het eerste tot en met vierde lid, alsmede over de verdere verwerking en de daarbij te stellen voorwaarden aan het
      gebruik daarvan door de ontvangstgerechtigde autoriteiten.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel10
  - number: '11'
    text: |-
      In geval van een specifieke en concrete dreiging van een terroristisch of ernstig misdrijf, kan de
      Passagiersinformatie-eenheid op verzoek van de Passagiersinformatie-eenheid van een andere lidstaat dat voldoet
      aan de voorwaarden van [artikel 10, tweede lid][ref1], een luchtvaartmaatschappij een verzoek als bedoeld in
      [artikel 4, vierde lid][ref2], doen, teneinde de ontvangen passagiersgegevens aan de Passagiersinformatie-eenheid
      van die andere lidstaat te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0042301#Artikel4
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '10'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0042301
        artikel: '4'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      De Passagiersinformatie-eenheid geeft op een voldoende gemotiveerd verzoek van Europol, via de nationale Europol-
      eenheid, passagiersgegevens en zo nodig het verwerkingsresultaat van die gegevens door, voor zover dit in een
      bepaald geval noodzakelijk is voor Europol ter ondersteuning en versterking van het optreden van de lidstaten
      bij het voorkomen, opsporen, onderzoeken of vervolgen van een terroristisch of ernstig misdrijf dat onder de
      bevoegdheid van Europol valt.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel12
  - number: '12.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de doorgifte van gegevens als bedoeld in het
      eerste lid, alsmede over de verdere verwerking en de daarbij te stellen voorwaarden aan het gebruik daarvan door
      Europol.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel12
  - number: '13.1'
    text: |-
      De Passagiersinformatie-eenheid kan passagiersgegevens en zo nodig het verwerkingsresultaat van die gegevens
      ingeval de verwerking al overeenkomstig [artikel 6, eerste lid, onderdeel a][ref1], is uitgevoerd, uitsluitend aan
      een autoriteit in een derde land, doorgeven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel6
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '6'
        paragraaf: '4'
  - number: 13.1.a
    text: |-
      de doorgifte in een bepaald geval noodzakelijk is voor het voorkomen, opsporen, onderzoeken of vervolgen van een
      terroristisch of ernstig misdrijf;
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel13
  - number: 13.1.b
    text: |-
      de autoriteit van het derde land er mee instemt de ontvangen gegevens alleen aan een ander derde land door te geven
      indien dit strikt noodzakelijk is voor de in onderdeel a genoemde doeleinden en nadat voor de doorgifte toestemming
      is verleend door de verwerkingsverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel13
  - number: 13.1.c
    text: |-
      aan de voorwaarden, bedoeld in [artikel 10, tweede en derde lid][ref1], is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel10
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '10'
        paragraaf: '6'
  - number: 13.1.d
    text: |-
      aan de voorwaarden, bedoeld in [artikel 17a, eerste tot en met zevende lid, van de Wet politiegegevens][ref1] voor
      de doorgifte van politiegegevens aan autoriteiten van andere landen wordt voldaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel17
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '17'
  - number: 13.1.e
    text: |-
      aan de voorwaarden die bij algemene maatregel van bestuur worden gesteld aan de doorgifte van gegevens als bedoeld
      in de aanhef, alsmede aan de verdere verwerking daarvan door de autoriteiten van derde landen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel13
  - number: '13.2'
    text: |-
      De Passagiersinformatie-eenheid kan passagiersgegevens die zijn verkregen van een andere lidstaat, zonder
      voorafgaande toestemming van die lidstaat alleen doorgeven aan de bevoegde autoriteit van een derde land, waar
      nodig in afwijking van het eerste lid, indien:
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel13
  - number: 13.2.a
    text: |-
      deze doorgiften van essentieel belang zijn om te kunnen reageren op een specifiek en daadwerkelijk gevaar in
      verband met terroristische misdrijven of ernstige criminaliteit in een lidstaat of een derde land; en
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel13
  - number: 13.2.b
    text: de voorafgaande toestemming van de lidstaat waarvan de gegevens zijn verkregen niet tijdig kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel13
  - number: '13.3'
    text: |-
      In geval van toepassing van het tweede lid informeert de Passagiersinformatie-eenheid onverwijld de autoriteit die
      voor het verlenen van toestemming bevoegd is en zorgt zij voor deugdelijke registratie van de doorgifte ten behoeve
      van een controle die achteraf wordt verricht.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel13
  - number: '13.4'
    text: |-
      De functionaris voor gegevensbescherming wordt onverwijld geïnformeerd over een doorgifte die op grond van dit
      artikel is gedaan.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel13
  - number: '14.1'
    text: |-
      De Passagiersinformatie-eenheid kan, voor zover dit in een bepaald geval noodzakelijk is voor het voorkomen,
      opsporen, onderzoeken of vervolgen van een terroristisch of ernstig misdrijf, de Passagiersinformatie-eenheid van
      een andere lidstaat gemotiveerd verzoeken om passagiersgegevens of de gegevens van een persoon die is aangemerkt na
      beoordeling voorafgaand aan zijn geplande aankomst in of geplande vertrek uit die lidstaat.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel14
  - number: '14.2'
    text: |-
      De Passagiersinformatie-eenheid kan op verzoek van een bevoegde instantie in een bepaald geval waarbij is voldaan
      aan de vereisten die op grond van het [Wetboek van Strafvordering][ref1] gelden voor toepassing van de gevraagde
      bevoegdheden in een nationaal onderzoek naar een terroristisch of een ernstig misdrijf, de Passagiersinformatie-
      eenheid van een andere lidstaat gemotiveerd verzoeken om passagiersgegevens of de gegevens van een persoon die is
      aangemerkt na beoordeling voorafgaand aan zijn geplande aankomst in of geplande vertrek uit die lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '14.3'
    text: |-
      De Passagiersinformatie-eenheid geeft de op grond van het eerste of tweede lid ontvangen gegevens door aan de
      bevoegde instantie die de gegevens heeft verzocht of die bevoegd is maatregelen te treffen of nader onderzoek uit
      te voeren.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel14
  - number: '14.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze waarop en de
      voorwaarden waaronder een verzoek als bedoeld in het eerste of tweede lid moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel14
  - number: '15.1'
    text: |-
      De Passagiersinformatie-eenheid kan in geval van een ernstige en concrete dreiging van een terroristisch of
      ernstig misdrijf, de Passagiersinformatie-eenheid van een andere lidstaat verzoeken een luchtvaartmaatschappij
      een verzoek als bedoeld in [artikel 4, vierde lid][ref1], te doen, teneinde de ontvangen gegevens door te geven
      aan een bevoegde instantie voor het voorkomen, dan wel opsporen, onderzoeken of vervolgen van het betreffende
      terroristische of ernstige misdrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel4
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '4'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze waarop en de
      voorwaarden waaronder een verzoek als bedoeld in het eerste lid moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel15
  - number: '16.1'
    text: |-
      Een bevoegde instantie kan in geval van dringende noodzaak en indien is voldaan aan de vereisten die op
      grond van het [Wetboek van Strafvordering][ref1] gelden voor toepassing van de gevraagde bevoegdheden in een
      nationaal onderzoek naar een terroristisch of een ernstig misdrijf, rechtstreeks een gemotiveerd verzoek aan de
      Passagiersinformatie-eenheid van een andere lidstaat doen om passagiersgegevens of de gegevens van een persoon die
      is aangemerkt na beoordeling voor geplande aankomst of vertrek door te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '16.2'
    text: |-
      Van een verzoek als bedoeld in het eerste lid stuurt de bevoegde instantie een afschrift aan de
      Passagiersinformatie-eenheid.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel16
  - number: '16.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze waarop en de
      voorwaarden waaronder een verzoek als bedoeld in het eerste lid moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel16
  - number: '17'
    text: |-
      Op de verwerking van persoonsgegevens door de Passagiersinformatie-eenheid zijn de [artikelen 1][ref1],
      [4 tot en met 4c][ref2], [6][ref3], [6a][ref4], [6c][ref5], [7][ref6], [17][ref7], [24a tot en met 31c][ref8],
      [33 tot en met 33b][ref9] en [35 tot en met 35c van de Wet politiegegevens][ref10] van overeenkomstige
      toepassing, met dien verstande dat Onze Minister voor de Passagiersinformatie-eenheid wordt aangemerkt als
      verwerkingsverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0022463#Artikel6a
      [ref5]: https://wetten.overheid.nl/BWBR0022463#Artikel6c
      [ref6]: https://wetten.overheid.nl/BWBR0022463#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0022463#Artikel17
      [ref8]: https://wetten.overheid.nl/BWBR0022463#Artikel24a
      [ref9]: https://wetten.overheid.nl/BWBR0022463#Artikel33
      [ref10]: https://wetten.overheid.nl/BWBR0022463#Artikel35
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0022463
        artikel: 6a
      - id: ref5
        bwb_id: BWBR0022463
        artikel: 6c
      - id: ref6
        bwb_id: BWBR0022463
        artikel: '7'
      - id: ref7
        bwb_id: BWBR0022463
        artikel: '17'
      - id: ref8
        bwb_id: BWBR0022463
        artikel: 24a
      - id: ref9
        bwb_id: BWBR0022463
        artikel: '33'
      - id: ref10
        bwb_id: BWBR0022463
        artikel: '35'
  - number: '18.1'
    text: |-
      De verwerkingsverantwoordelijke benoemt een functionaris voor gegevensbescherming die, onverminderd het bepaalde
      in de [artikelen 10, derde lid][ref1], [13, tweede lid][ref2] en [20, eerste lid, onder d][ref3], is belast met de
      controle op de verwerking van de persoonsgegevens door de Passagiersinformatie-eenheid en met de uitvoering van de
      desbetreffende waarborgen voor de gegevensbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0042301#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0042301#Artikel20
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '10'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0042301
        artikel: '13'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0042301
        artikel: '20'
        paragraaf: '8'
  - number: '18.2'
    text: |-
      De functionaris voor gegevensbescherming zendt jaarlijks voor 1 juli een rapportage aan Onze Minister, de beide
      Kamers der Staten-Generaal en de Autoriteit persoonsgegevens over het voorgaande kalenderjaar, waarin hij ingaat
      op de wijze waarop controle is uitgeoefend op de verwerking van de persoonsgegevens door de Passagiersinformatie-
      eenheid en de wijze waarop de waarborgen voor de gegevensbescherming zijn uitgevoerd. De rapportage bevat voorts
      statistieken over de mate waarin passagiersgegevens op grond van de [artikelen 9a tot en met 16][ref1] zijn
      verstrekt, doorgegeven of verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel9a
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: 9a
        paragraaf: '6'
  - number: '18.3'
    text: |-
      De functionaris voor gegevensbescherming is voor een betrokkene het contactpunt voor alle aangelegenheden in
      verband met de verwerking van de persoonsgegevens van die betrokkene door de verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel18
  - number: '18.4'
    text: |-
      De functionaris voor gegevensbescherming heeft voor de uitvoering van de taken, bedoeld in het eerste en derde lid,
      toegang tot alle gegevens die door de Passagiersinformatie-eenheid worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel18
  - number: '18.5'
    text: |-
      Ingeval de functionaris voor gegevensbescherming vaststelt dat een verwerking van persoonsgegevens door de
      Passagiersinformatie-eenheid niet rechtmatig is, kan hij de Autoriteit persoonsgegevens hierover informeren.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel18
  - number: '18.6'
    text: |-
      [Artikel 36 van de Wet politiegegevens][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel36
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '36'
  - number: '19.1'
    text: |-
      De verwerking van persoonsgegevens als bedoeld in deze wet mag geen betrekking hebben op persoonsgegevens waaruit
      iemands godsdienst of levensovertuiging, ras of etnische afkomst, politieke gezindheid, gezondheid, seksuele leven
      of geaardheid of lidmaatschap van een vakvereniging blijkt.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel19
  - number: '19.2'
    text: |-
      In het geval de Passagiersinformatie-eenheid gegevens als bedoeld in het eerste lid ontvangt, worden deze gegevens
      onmiddellijk gewist.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel19
  - number: '20.1'
    text: 'De Passagiersinformatie-eenheid draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel20
  - number: 20.1.a
    text: |-
      de passagiersgegevens gedurende een termijn van vijf jaar na ontvangst van deze gegevens worden bewaard en dat de
      passagiersgegevens na deze termijn worden gewist;
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel20
  - number: 20.1.b
    text: |-
      in het geval een luchtvaartmaatschappij andere gegevens dan passagiersgegevens aan de Passagiersinformatie-eenheid
      verstrekt, deze gegevens onmiddellijk worden gewist;
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel20
  - number: 20.1.c
    text: |-
      de ontvangen passagiersgegevens worden opgeslagen en verwerkt in Nederland of in een andere lidstaat van de
      Europese Unie;
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel20
  - number: 20.1.d
    text: |-
      de passagiersgegevens waaruit rechtstreeks de identiteit van een persoon kan worden afgeleid, zes maanden
      na ontvangst ervan worden gedepersonaliseerd door afscherming van die gegevens, waarna deze gegevens
      uitsluitend indien dit redelijkerwijs noodzakelijk is voor een vordering of een verzoek als bedoeld in
      [artikel 6, eerste lid, onderdeel b][ref1], met toestemming van de officier van justitie en na kennisgeving aan de
      functionaris gegevensbescherming, die deze verwerking achteraf controleert, kunnen worden doorgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel6
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '6'
        paragraaf: '4'
  - number: '20.2'
    text: 'Onder de gegevens, bedoeld in het eerste lid, onderdeel d, worden in ieder geval verstaan:'
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel20
  - number: 20.2.a
    text: naam of namen, waaronder de namen van andere personen in het PNR en het aantal personen in het PNR;
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel20
  - number: 20.2.b
    text: adres en contactgegevens, waaronder telefoonnummer en e-mailadres;
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel20
  - number: 20.2.c
    text: |-
      alle betalingsinformatie, met inbegrip van het factuuradres, voor zover daarin informatie is opgenomen waaruit de
      identiteit van een persoon rechtstreeks zou kunnen worden afgeleid;
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel20
  - number: 20.2.d
    text: |-
      informatie betreffende personen die gebruikmaken van een loyaliteitsprogramma voor frequent reizen als bedoeld in
      [bijlage 1][ref1] van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0042301
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0042301
  - number: 20.2.e
    text: |-
      algemene opmerkingen als bedoeld in [bijlage 1][ref1] van deze wet, voor zover deze informatie bevat waaruit
      rechtstreeks de identiteit kan worden afgeleid van een persoon; en


      [ref1]: https://wetten.overheid.nl/BWBR0042301
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0042301
  - number: 20.2.f
    text: |-
      verzamelde API-gegevens als bedoeld in [bijlage 1][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0042301
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0042301
  - number: '20.3'
    text: |-
      De persoonsgegevens die het resultaat zijn van een verwerking als bedoeld in
      [artikel 6, eerste lid, onderdeel a][ref1], worden door de Passagiersinformatie-eenheid niet langer bewaard dan
      noodzakelijk is om deze gegevens te kunnen melden aan een bevoegde instantie, Europol of een Passagiersinformatie-
      eenheid van een andere lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel6
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '6'
        paragraaf: '4'
  - number: '20.4'
    text: |-
      Indien een overeenkomst bij een verwerking als bedoeld in [artikel 6, eerste lid, onderdeel a][ref1], ten onrechte
      positief is, kunnen de persoonsgegevens van betrokkene, met inachtneming van het bepaalde in het eerste lid,
      door de Passagiersinformatie-eenheid worden bewaard voor het doel om nieuwe onjuiste positieve overeenkomsten te
      onderkennen.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel6
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '6'
        paragraaf: '4'
  - number: '21'
    text: '*(Vervallen)*'
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel21
  - number: '22.1'
    text: 'De verwerkingsverantwoordelijke houdt een register bij dat de volgende gegevens bevat:'
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel22
  - number: 22.1.a
    text: |-
      de namen en contactgegevens van de verwerkingsverantwoordelijke, de organisatie en de ambtenaren van de
      Passagiersinformatie-eenheid die belast zijn met de verwerking van passagiersgegevens, en van de functionaris
      gegevensbescherming;
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel22
  - number: 22.1.b
    text: |-
      de namen en contactgegevens van de bevoegde instanties, de Passagiersinformatie-eenheden en de bevoegde instanties
      van andere lidstaten (en derde landen); en
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel22
  - number: 22.1.c
    text: de autorisaties die zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel22
  - number: '22.2'
    text: 'De verwerkingsverantwoordelijke draagt zorg voor de vastlegging van:'
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel22
  - number: 22.2.a
    text: de verzoeken om passagiersgegevens of de verwerking ervan van bevoegde instanties;
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel22
  - number: 22.2.b
    text: |-
      de verzoeken om passagiersgegevens van Europol en van Passagiersinformatie-eenheden en bevoegde instanties van
      andere lidstaten; en
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel22
  - number: 22.2.c
    text: de verzoeken om passagiersgegevens van derde landen en de doorgiften aan die landen.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel22
  - number: '22.3'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van vastlegging.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel22
  - number: '22.4'
    text: |-
      De verwerkingsverantwoordelijke stelt de documentatie, bedoeld in het tweede lid, desgevraagd ter beschikking aan
      de Autoriteit persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel22
  - number: '23.1'
    text: |-
      De verwerkingsverantwoordelijke draagt zorg voor de vastlegging langs elektronische weg van ten minste de volgende
      verwerkingen: het verzamelen, raadplegen, verstrekking onder meer in de vorm van doorgiften en wissen van de
      passagiersgegevens en de resultaten van de verwerking van die gegevens, met uitzondering van de verstrekking,
      bedoeld in [artikel 17 van de Wet politiegegevens][ref1], indien dit zich niet verdraagt met het belang van de
      veiligheid van de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel17
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '17'
  - number: '23.2'
    text: |-
      De vastgelegde gegevens inzake het raadplegen en verstrekken als bedoeld in het eerste lid bevatten in ieder geval
      informatie over het doel, de datum en het tijdstip van het raadplegen en het verstrekken, de identiteit van de
      persoon die de passagiersgegevens of een verwerking ervan heeft geraadpleegd of verstrekt en de identiteit van de
      ontvangers van die gegevens.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel23
  - number: '23.3'
    text: |-
      De vastgelegde gegevens, bedoeld in het eerste lid, worden gedurende vijf jaar bewaard en worden uitsluitend
      gebruikt voor de controle van de rechtmatigheid van de gegevensverwerking, de interne controle, het waarborgen van
      de integriteit en de beveiliging van de persoonsgegevens en voor de strafrechtelijke procedures.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel23
  - number: '23.4'
    text: |-
      De verwerkingsverantwoordelijke stelt de vastgelegde gegevens, bedoeld in het eerste lid, desgevraagd ter
      beschikking aan de Autoriteit persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel23
  - number: '24.1'
    text: |-
      Overtreding van het bepaalde in [artikel 4, eerste tot en met vierde lid][ref1], of krachtens artikel 4, vijfde
      lid, wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel4
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: '4'
        paragraaf: '2'
  - number: '24.2'
    text: De in het eerste lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel24
  - number: '25'
    text: |-
      Onze Minister zendt binnen twee jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk. In dat verslag wordt afzonderlijk aandacht besteed aan
      de verwerking van passagiersgegevens van vluchten binnen de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel25
  - number: '26.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, met uitzondering van
      [artikel 25a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel25a
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: 25a
        paragraaf: '10'
  - number: '26.2'
    text: |-
      [Artikel 25a][ref1] treedt in werking drie jaren na het tijdstip van inwerkingtreding van deze wet, tenzij voordien
      bij algemene maatregel van bestuur is bepaald dat artikel 25a vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0042301#Artikel25a
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0042301
        artikel: 25a
        paragraaf: '10'
  - number: '26.3'
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel26
  - number: '27'
    text: |-
      Deze wet wordt aangehaald als: Wet gebruik van passagiersgegevens voor de bestrijding van terroristische en
      ernstige misdrijven.
    url: https://wetten.overheid.nl/BWBR0042301/2019-06-18#Artikel27
