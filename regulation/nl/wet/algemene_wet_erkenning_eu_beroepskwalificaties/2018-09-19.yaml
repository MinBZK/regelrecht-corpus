  - number: '2.1'
    text: |-
      Voor de erkenning als specialist in de zin van
      [artikel 14 van de Wet op de beroepen in de individuele gezondheidszorg][ref1] wordt onder Onze minister die het
      aangaat verstaan het orgaan, bedoeld in [artikel 14, tweede lid, onder e, van die wet][ref2].


