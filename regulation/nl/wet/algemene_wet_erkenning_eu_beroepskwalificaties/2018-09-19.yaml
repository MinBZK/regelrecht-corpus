  - number: '3'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt het beroep dat de migrerende
      beroepsbeoefenaar in een betrokken staat wenst uit te oefenen, aangemerkt als hetzelfde als dat waarvoor hij in
      de betrokken staat van oorsprong of herkomst de kwalificaties bezit, indien daaronder vergelijkbare werkzaamheden
      vallen.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel3
  - number: '4.1'
    text: |-
      Deze wet is van toepassing op gereglementeerde beroepen, voor zover niet bij of krachtens wet ten aanzien van een
      beroep is geïmplementeerd:
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel4
  - number: 4.1.a
    text: de richtlijn, of
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel4
  - number: 4.1.b
    text: een afzonderlijke EU-richtlijn inzake de onderlinge erkenning van beroepskwalificaties.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel4
  - number: '4.2'
    text: |-
      Deze wet is niet van toepassing op de gereglementeerde beroepen van notaris en toegevoegd notaris als bedoeld
      in [artikel 1, eerste lid, onderdeel a, respectievelijk onderdeel b, van de Wet op het notarisambt][ref1]. Deze
      wet is evenmin van toepassing op het gereglementeerde beroep van kandidaat-notaris als bedoeld in artikel 1,
      eerste lid, onderdeel c, van de Wet op het notarisambt, voor zover deze is belast met waarneming als bedoeld in
      [artikel 29 van de Wet op het notarisambt][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel29
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '29'
  - number: '4.3'
    text: |-
      Deze wet is niet van toepassing op een gereglementeerd beroep dat tevens een betrekking in overheidsdienst is
      als bedoeld in artikel 45, vierde lid, van het Verdrag betreffende de werking van de Europese Unie, tenzij bij of
      krachtens de wet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel4
  - number: 4a
    text: |-
      Dit hoofdstuk ziet op de migrerende beroepsbeoefenaar die in Nederland toegang tot of uitoefening van een
      gereglementeerd beroep wenst op basis van beroepskwalificaties die in een andere betrokken staat verplicht zijn
      gesteld voor toegang tot of uitoefening van dat beroep.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel4a
  - number: '5.1'
    text: |-
      Onze minister die het aangaat kan erkenning van beroepskwalificaties verlenen aan een migrerende beroepsbeoefenaar
      die in Nederland toegang tot of uitoefening van een gereglementeerd beroep wenst op basis van beroepskwalificaties
      die in een andere betrokken staat verplicht zijn gesteld voor toegang tot of uitoefening van dat beroep.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel5
  - number: '5.2'
    text: |-
      De migrerende beroepsbeoefenaar aan wie erkenning van beroepskwalificaties is verleend ten aanzien van een
      gereglementeerd beroep, voldoet aan de bij of krachtens wet voor de toelating tot of uitoefening van het
      desbetreffende beroep vereiste beroepskwalificaties en kan dat beroep uitoefenen onder de voorwaarden die in
      Nederland voor die beroepsuitoefening zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel5
  - number: '6.1'
    text: |-
      Onze minister die het aangaat verleent erkenning van beroepskwalificaties indien de migrerende beroepsbeoefenaar in
      het bezit is van een opleidingstitel die of een door het bevoegd gezag in een andere betrokken staat dan Nederland
      afgegeven bekwaamheidsattest dat blijk geeft van een beroepskwalificatieniveau, bedoeld in [artikel 9][ref1], dat
      in de andere betrokken staat verplicht wordt gesteld aan de uitoefening van het betrokken beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel9
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '9'
        hoofdstuk: '2'
  - number: '6.2'
    text: |-
      Onze minister die het aangaat verleent eveneens erkenning van beroepskwalificaties indien de migrerende
      beroepsbeoefenaar het beroep in de tien jaar voorafgaand aan de aanvraag gedurende een jaar voltijds of gedurende
      een gelijkwaardige periode deeltijds heeft uitgeoefend in een andere betrokken staat dan Nederland waar dat beroep
      niet is gereglementeerd en de migrerende beroepsbeoefenaar in het bezit is van een of meer opleidingstitels of door
      het bevoegd gezag in een andere betrokken staat dan Nederland afgegeven bekwaamheidsattesten die aantonen dat de
      migrerende beroepsbeoefenaar op de uitoefening van het betrokken beroep is voorbereid.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel6
  - number: '6.3'
    text: 'Onze minister die het aangaat erkent:'
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel6
  - number: 6.3.a
    text: |-
      een door een andere betrokken staat geattesteerd opleidingsniveau als bedoeld in [artikel 9][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel9
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '9'
        hoofdstuk: '2'
  - number: 6.3.b
    text: |-
      het certificaat waarmee de andere betrokken staat verklaart dat de opleiding, bedoeld in
      [artikel 9, onderdeel c, onder 2°][ref1], gelijkwaardig is aan het niveau, bedoeld in artikel 9, onderdeel c,
      onder 1°.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel9
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '9'
        hoofdstuk: '2'
  - number: '7'
    text: |-
      De beroepservaring van een jaar, bedoeld in [artikel 6, tweede lid][ref1], wordt niet geëist indien de migrerende
      beroepsbeoefenaar met de opleidingstitel of opleidingstitels een gereglementeerde opleiding heeft afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel6
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '6'
        hoofdstuk: '2'
  - number: '8'
    text: |-
      In afwijking van de [artikelen 6, eerste en tweede lid, derde lid, onderdeel a][ref1], en [11][ref2], kan Onze
      minister die het aangaat erkenning van beroepskwalificaties weigeren indien de migrerende beroepsbeoefenaar in het
      bezit is van een bekwaamheidsattest op het kwalificatieniveau, bedoeld in [artikel 9, onderdeel e][ref3], en voor
      toegang tot of uitoefening van het betrokken beroep een beroepskwalificatie van het kwalificatieniveau, bedoeld in
      artikel 9, onderdeel a, verplicht is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0023066#Artikel9
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '11'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0023066
        artikel: '9'
        hoofdstuk: '2'
  - number: '9'
    text: |-
      Voor de toepassing van [artikel 6][ref1] en [artikel 11, zevende lid][ref2], worden de beroepskwalificaties
      onderscheiden in de volgende vijf niveaus:


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel11
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '11'
        hoofdstuk: '2'
  - number: 9.a
    text: |-
      een diploma ter afsluiting van een opleiding op het niveau van het hoger onderwijs met een duur van ten minste
      vier jaar of, in geval van een deeltijdse opleiding, met een daaraan gelijkwaardige duur, die daarnaast kan worden
      uitgedrukt in een daaraan gelijkwaardig aantal ECTS-studiepunten, aan een universiteit of een instelling voor hoger
      onderwijs of aan een andere instelling met hetzelfde opleidingsniveau, en in voorkomend geval ter afsluiting van de
      beroepsopleiding die als aanvulling op deze hogeronderwijsopleiding is vereist;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: 9.b
    text: |-
      een diploma ter afsluiting van een opleiding op het niveau van het hoger onderwijs met een duur van ten minste drie
      jaar en ten hoogste vier jaar, of, in geval van een deeltijdse opleiding, met een daaraan gelijkwaardige duur, die
      daarnaast kan worden uitgedrukt in een daaraan gelijkwaardig aantal ECTS-studiepunten, aan een universiteit of een
      instelling voor hoger onderwijs of aan een andere instelling met hetzelfde opleidingsniveau, en in voorkomend geval
      ter afsluiting van de beroepsopleiding die als aanvulling op deze hogeronderwijsopleiding is vereist;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: 9.c
    text: 'een diploma ter afsluiting van:'
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: 9.c.1°
    text: |-
      een opleiding op het niveau van het hoger onderwijs met een duur van ten minste één en minder dan drie jaar,
      of, in geval van een deeltijdse opleiding, met een daaraan gelijkwaardige duur, waarvoor als een van de
      toelatingsvoorwaarden in de regel geldt dat de secundaironderwijsopleiding is voltooid die voor de toegang tot
      het universitair of hoger onderwijs is vereist of een gelijkwaardige schoolopleiding van secundair niveau, en in
      voorkomend geval de beroepsopleiding die als aanvulling op deze hogeronderwijsopleiding is vereist, of
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: 9.c.2°
    text: |-
      een gereglementeerde opleiding of, in het geval van gereglementeerde beroepen, een beroepsopleiding met een
      bijzondere structuur, mits het diploma vergezeld gaat van een certificaat van de betrokken staat van oorsprong:
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: 9.c.2°.a
    text: |-
      waarbij competenties worden aangereikt die de competenties van het kwalificatieniveau, bedoeld in onderdeel d,
      overstijgen; en
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: 9.c.2°.b
    text: |-
      die gelijkwaardig is aan het opleidingsniveau, bedoeld onder 1°, en opleidt tot een daarmee vergelijkbare
      beroepsbekwaamheid alsook voorbereidt op een vergelijkbaar niveau van verantwoordelijkheden en taken;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: 9.d
    text: 'een certificaat ter afsluiting van een opleiding op een niveau niet zijnde hoger onderwijs:'
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: 9.d.1°
    text: |-
      van algemene aard, aangevuld met een andere dan de onder c bedoelde studiecyclus of beroepsopleiding of met de
      beroepsstage of praktijkervaring die als aanvulling op deze studiecyclus is vereist, of
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: 9.d.2°
    text: |-
      van technische of beroepsmatige aard, in voorkomend geval aangevuld met een studiecyclus of beroepsopleiding als
      bedoeld onder 1°, of met de beroepsstage of praktijkervaring die als aanvulling op deze studiecyclus is vereist;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: 9.e
    text: 'een bekwaamheidsattest:'
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: 9.e.1°
    text: |-
      na het volgen van een opleiding die niet wordt afgesloten met een certificaat of diploma als bedoeld onder a tot en
      met d, of
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: 9.e.2°
    text: na het afleggen van een specifiek examen zonder voorafgaande opleiding, of
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: 9.e.3°
    text: |-
      waaruit blijkt dat het beroep tijdens de voorafgaande tien jaar gedurende drie opeenvolgende jaren voltijds of
      gedurende een gelijkwaardige periode deeltijds in een andere betrokken staat dan Nederland is uitgeoefend, of
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: 9.e.4°
    text: |-
      na het volgen van een algemene opleiding op het niveau van het primair of secundair onderwijs, waaruit een zekere
      algemene ontwikkeling blijkt.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel9
  - number: '10'
    text: |-
      Met een opleidingstitel ter afsluiting van een in [artikel 9][ref1] bedoelde opleiding, met inbegrip van het
      betrokken niveau, wordt gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel9
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '9'
        hoofdstuk: '2'
  - number: 10.a
    text: |-
      een opleidingstitel die, of een geheel van opleidingstitels dat door het bevoegd gezag in een andere betrokken
      staat dan Nederland is afgegeven, wanneer daarmee een in de gebieden waarop de Overeenkomst betreffende de Europese
      Economische Ruimte van toepassing is of Zwitserland op voltijdse of deeltijdse basis zowel binnen als buiten
      formele programma’s gevolgde opleiding wordt afgesloten die door deze betrokken staat als gelijkwaardig wordt
      erkend en waaraan dezelfde rechten voor de toegang tot of uitoefening van een beroep zijn verbonden, of die een
      voorbereiding vormt op de uitoefening van dat beroep.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel10
  - number: 10.b
    text: |-
      een beroepskwalificatie die weliswaar niet meer voldoet aan de eisen die bij of krachtens wet in de betrokken staat
      van oorsprong of herkomst voor de toegang tot of uitoefening van een beroep zijn vastgesteld, maar die de houder
      ervan bij of krachtens wet in die betrokken staat verworven rechten verleent.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel10
  - number: '11.1'
    text: |-
      Onze minister die het aangaat kan eisen dat de migrerende beroepsbeoefenaar een aanpassingsstage van ten hoogste
      drie jaar doorloopt of een proeve van bekwaamheid aflegt, indien:
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
  - number: 11.1.a
    text: |-
      de door de migrerende beroepsbeoefenaar gevolgde opleiding betrekking heeft op vakken die wezenlijk verschillen van
      de vakken die worden bestreken door de in Nederland vereiste opleiding, of
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
  - number: 11.1.b
    text: |-
      het in Nederland gereglementeerde beroep een of meer gereglementeerde beroepswerkzaamheden omvat die niet bestaan
      in hetzelfde beroep in de betrokken staat van oorsprong of herkomst van de migrerende beroepsbeoefenaar, en
      dit verschil wordt gekenmerkt door een opleiding die in Nederland is vereist en betrekking heeft op vakken die
      wezenlijk verschillen van de vakken die vallen onder het bekwaamheidsattest of de opleidingstitel van de migrerende
      beroepsbeoefenaar.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
  - number: '11.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder vakken die wezenlijk verschillen verstaan vakken waarvan de
      kennis, vaardigheden en competenties van essentieel belang zijn voor de uitoefening van het beroep en waarvoor de
      door de migrerende beroepsbeoefenaar ontvangen opleiding naar inhoud in wezenlijke mate afwijkt van de in Nederland
      vereiste opleiding.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
  - number: '11.3'
    text: |-
      Bij de toepassing van het eerste lid gaat Onze minister die het aangaat eerst na of de kennis, vaardigheden en
      competenties die de aanvrager heeft verworven in het kader van zijn beroepservaring of in het kader van een leven
      lang leren, en die met dat doel door een bevoegde instantie formeel zijn gevalideerd, in een betrokken staat of
      derde land, het wezenlijke verschil, bedoeld in het tweede lid, geheel of gedeeltelijk kunnen ondervangen.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
  - number: '11.4'
    text: De migrerende beroepsbeoefenaar wordt de keuze gelaten tussen een aanpassingsstage en een proeve van bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
  - number: '11.5'
    text: 'De migrerende beroepsbeoefenaar komt de keuze, bedoeld in het vierde lid, niet toe:'
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
  - number: 11.5.a
    text: |-
      met betrekking tot een beroep waarvan voor de uitoefening een precieze kennis van het Nederlands recht is vereist
      en waarvan het verstrekken van advies of het verlenen van bijstand op het gebied van het Nederlands recht een
      wezenlijk en vast onderdeel van de uitoefening vormt;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
  - number: 11.5.b
    text: in geval van een in een derde land afgegeven opleidingstitel;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
  - number: 11.5.c
    text: |-
      indien hij houder is van een beroepskwalificatie van een niveau als bedoeld in [artikel 9, onderdeel e][ref1], en
      in Nederland voor toegang tot of uitoefening van het betrokken gereglementeerd beroep een beroepskwalificatie is
      vereist van het niveau, bedoeld in artikel 9, onderdeel c;


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel9
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '9'
        hoofdstuk: '2'
  - number: 11.5.d
    text: |-
      indien hij houder is van een beroepskwalificatie van een niveau als bedoeld in [artikel 9, onderdeel d][ref1], en
      in Nederland voor toegang tot of uitoefening van het betrokken gereglementeerd beroep een beroepskwalificatie is
      vereist van het niveau, bedoeld in artikel 9, onderdeel a of b.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel9
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '9'
        hoofdstuk: '2'
  - number: '11.6'
    text: |-
      In afwijking van het eerste lid, kan Onze minister die het aangaat eisen dat de migrerende beroepsbeoefenaar zowel
      een aanpassingsstage doorloopt als een proeve van bekwaamheid aflegt, indien de beroepsbeoefenaar in het bezit
      is van een beroepskwalificatie van een niveau als bedoeld in [artikel 9, onderdeel e][ref1], en in Nederland voor
      toegang tot of uitoefening van het betrokken gereglementeerd beroep een beroepskwalificatie is vereist van het
      niveau, bedoeld in artikel 9, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel9
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '9'
        hoofdstuk: '2'
  - number: '11.7'
    text: |-
      Indien Onze minister die het aangaat een aanpassingsstage of een proeve van bekwaamheid eist, informeert hij de
      migrerende beroepsbeoefenaar over de redenen daartoe en verschaft daarbij informatie over:
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
  - number: 11.7.a
    text: |-
      het in Nederland voor de toegang tot en uitoefening van het betrokken gereglementeerd beroep vereiste
      niveau, bedoeld in [artikel 9][ref1], en het niveau waarop de door de migrerende beroepsbeoefenaar behaalde
      beroepskwalificatie wordt ingedeeld; en


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel9
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '9'
        hoofdstuk: '2'
  - number: 11.7.b
    text: |-
      de wezenlijke verschillen, bedoeld in het tweede lid, en de redenen waarom deze verschillen niet kunnen worden
      gecompenseerd door de kennis, vaardigheden en competenties die de migrerende beroepsbeoefenaar heeft verworven door
      beroepservaring of in het kader van een leven lang leren en die met dat doel door een bevoegde instantie formeel
      zijn gevalideerd.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
  - number: '11.8'
    text: |-
      Onze minister die het aangaat stelt de migrerende beroepsbeoefenaar van wie hij een proeve van bekwaamheid eist in
      de gelegenheid de proeve van bekwaamheid af te leggen binnen zes maanden na het nemen van het besluit.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel11
  - number: '12.1'
    text: |-
      Indien de verschillen tussen in de betrokken staat van oorsprong of herkomst verrichte beroepswerkzaamheden en de
      beroepswerkzaamheden die het in Nederland gereglementeerde beroep omvat dermate groot zijn dat het eisen van een
      aanpassingsstage dan wel proeve van bekwaamheid, bedoeld in [artikel 11, eerste lid][ref1], zou neerkomen op het
      volgen van een volledig onderwijs- of opleidingsprogramma, verleent Onze minister die het aangaat gedeeltelijke
      toegang tot het gereglementeerd beroep, als aan de volgende voorwaarden is voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '11'
        hoofdstuk: '2'
  - number: 12.1.a
    text: |-
      de migrerende beroepsbeoefenaar is volledig gekwalificeerd om in de betrokken staat van oorsprong of herkomst de
      beroepswerkzaamheden uit te oefenen waarvoor gedeeltelijke toegang wordt verleend; en
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel12
  - number: 12.1.b
    text: |-
      de beroepswerkzaamheden die de aanvrager wenst uit te oefenen kunnen objectief worden gescheiden van de andere
      beroepswerkzaamheden die het gereglementeerde beroep in Nederland omvat.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel12
  - number: '12.2'
    text: |-
      Onze minister die het aangaat kan weigeren gedeeltelijke toegang te verlenen indien deze weigering wordt
      gerechtvaardigd door een dwingende reden van algemeen belang en noodzakelijk is om het desbetreffende belang te
      beschermen.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel12
  - number: '12.3'
    text: |-
      De migrerende beroepsbeoefenaar aan wie gedeeltelijke toegang is verleend, oefent de beroepswerkzaamheden uit
      onder de beroepstitel van zijn betrokken staat van oorsprong of herkomst. Onze minister die het aangaat kan bij
      ministeriële regeling het gebruik van die beroepstitel in een in Nederland officiële taal voorschrijven.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel12
  - number: '12.4'
    text: |-
      De migrerende beroepsbeoefenaar maakt aan de afnemers van de diensten duidelijk kenbaar welke beroepswerkzaamheden
      hij gerechtigd is uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel12
  - number: '13.1'
    text: |-
      Onze minister die het aangaat kan alvorens te beslissen op een aanvraag om erkenning van beroepskwalificaties de
      volgende documenten eisen:
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel13
  - number: 13.1.a
    text: |-
      een bewijs van de nationaliteit van de migrerende beroepsbeoefenaar alsmede, indien de definitie van migrerende
      beroepsbeoefenaar, onder 2°, van toepassing is, een door Nederland afgegeven EU-verblijfsvergunning voor langdurig
      ingezetenen als bedoeld in artikel 8 van [richtlijn nr. 2003/109/EG](32003L0109) van de Raad van de Europese
      Unie van 25 november 2003 betreffende de status van langdurig ingezeten onderdanen van derde landen (PbEU L
      016), of een door een andere betrokken staat dan Nederland afgegeven zodanige EU-verblijfsvergunning en een
      verblijfsvergunning als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref1], of, indien de definitie van
      migrerende beroepsbeoefenaar, onder 3°, van toepassing is, een verblijfskaart van een familielid van een burger van
      de Unie of een duurzame verblijfskaart of een ander bewijsmiddel waaruit blijkt dat de aanvrager het verblijfsrecht
      of het duurzaam verblijfsrecht heeft verkregen als bedoeld in hoofdstuk III, respectievelijk hoofdstuk IV van
      [richtlijn nr. 2004/38/EG](32004L0038) van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004
      betreffende het recht van vrij verkeer en verblijf op het grondgebied van de lidstaten voor de burgers van de Unie
      en hun familieleden (PbEU L 158 en L 229);


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 13.1.b
    text: |-
      een kopie van de bekwaamheidsattesten of van de opleidingstitels waarop de migrerende beroepsbeoefenaar zich
      beroept;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel13
  - number: 13.1.c
    text: in voorkomend geval een bewijs van de beroepservaring van de migrerende beroepsbeoefenaar;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel13
  - number: 13.1.d
    text: |-
      een attest ter bevestiging dat de migrerende beroepsbeoefenaar niet strafrechtelijk is veroordeeld noch aan hem een
      tijdelijk of permanent verbod op beroepsuitoefening is opgelegd, indien Nederland dat ook van zijn eigen onderdanen
      eist;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel13
  - number: 13.1.e
    text: |-
      documenten, verklaringen en attesten als bedoeld in de [artikelen 14 tot en met 16][ref1], voor zover de toegang
      tot of uitoefening van een gereglementeerd beroep daarvan mede afhankelijk is gesteld, en


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel14
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '14'
        hoofdstuk: '2'
  - number: 13.1.f
    text: |-
      documenten als bedoeld in [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel17
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '17'
        hoofdstuk: '2'
  - number: '13.2'
    text: |-
      Onze minister die het aangaat kan de migrerende beroepsbeoefenaar verzoeken informatie omtrent zijn opleiding
      te verstrekken, voor zover dat noodzakelijk is voor de vaststelling van wezenlijke verschillen als bedoeld in
      [artikel 11, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '11'
        hoofdstuk: '2'
  - number: '14.1'
    text: 'Indien de toegang tot of uitoefening van een gereglementeerd beroep mede afhankelijk is gesteld van:'
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel14
  - number: 14.1.a
    text: |-
      een verklaring omtrent het gedrag of een ander document waaruit blijkt van een betrouwbaarheidsoordeel bij of
      krachtens de [Wet justitiële en strafvorderlijke gegevens][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 14.1.b
    text: |-
      een document waaruit blijkt dat de migrerende beroepsbeoefenaar niet in staat van faillissement heeft verkeerd,
      noch ten aanzien van de migrerende beroepsbeoefenaar de schuldsaneringsregeling natuurlijke personen van toepassing
      is geweest, geldt als zodanig een met die verklaring of dat document overeenkomend document, afgegeven door het
      bevoegd gezag van de betrokken staat van oorsprong of herkomst van de migrerende beroepsbeoefenaar.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel14
  - number: '14.2'
    text: |-
      Indien documenten als bedoeld in het eerste lid niet door het bevoegd gezag in de betrokken staat van oorsprong
      of herkomst worden afgegeven, kan de migrerende beroepsbeoefenaar volstaan met het afleggen van een verklaring
      onder ede of een plechtige verklaring ten overstaan van een daartoe in die betrokken staat bevoegde gerechtelijke
      of bestuurlijke autoriteit, een notaris of een in die betrokken staat bevoegde beroepsorganisatie, die een attest
      afgeeft waaruit blijkt dat deze verklaring onder ede of plechtige verklaring is afgelegd.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel14
  - number: '14.3'
    text: |-
      De in het eerste en tweede lid bedoelde verklaringen, documenten en attesten mogen bij indiening van een aanvraag
      tot het verkrijgen van een erkenning van beroepskwalificaties niet ouder zijn dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel14
  - number: '15.1'
    text: |-
      Indien de toegang tot of uitoefening van een gereglementeerd beroep mede afhankelijk is gesteld van een document
      betreffende de geestelijke of lichamelijke gezondheid, geldt als zodanig het document dat in de betrokken staat van
      oorsprong of herkomst ter zake is vereist.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel15
  - number: '15.2'
    text: |-
      Indien in de betrokken staat van oorsprong of herkomst een document als bedoeld in het eerste lid niet is vereist,
      kan de migrerende beroepsbeoefenaar volstaan met een attest afgegeven door het bevoegd gezag van die betrokken
      staat.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel15
  - number: '15.3'
    text: |-
      [Artikel 14, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel14
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '14'
        hoofdstuk: '2'
  - number: '16.1'
    text: 'Indien de toegang tot of uitoefening van een gereglementeerd beroep mede afhankelijk is gesteld van:'
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel16
  - number: 16.1.a
    text: een bewijs van financiële draagkracht, of
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel16
  - number: 16.1.b
    text: |-
      een bewijs van verzekering tegen de financiële risico’s die verband houden met beroepsaansprakelijkheid, geldt als
      genoegzaam bewijs een attest ter zake afgegeven door banken of verzekeringsmaatschappijen van een andere betrokken
      staat dan Nederland.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel16
  - number: '16.2'
    text: |-
      [Artikel 14, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel14
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '14'
        hoofdstuk: '2'
  - number: '17.1'
    text: |-
      Indien Onze minister die het aangaat de toegang tot of uitoefening van een gereglementeerd beroep tijdelijk
      of permanent verbiedt in geval van tuchtrechtelijke of strafrechtelijke inbreuken, gelden documenten afgegeven
      door het bevoegd gezag van de betrokken staat van oorsprong of herkomst waaruit blijkt dat aan de migrerende
      beroepsbeoefenaar geen tijdelijk of permanent tuchtrechtelijk of strafrechtelijk beroepsuitoefeningsverbod is
      opgelegd als genoegzaam bewijs.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel17
  - number: '17.2'
    text: |-
      [Artikel 14, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel14
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '14'
        hoofdstuk: '2'
  - number: '18'
    text: |-
      Indien voor de toegang tot of uitoefening van een gereglementeerd beroep het afleggen van een eed of belofte is
      vereist en de formule van deze eed of belofte niet door de migrerende beroepsbeoefenaar kan worden gebruikt, draagt
      Onze minister die het aangaat ervoor zorg dat de migrerende beroepsbeoefenaar een passende gelijkwaardige formule
      kan gebruiken.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel18
  - number: '19.1'
    text: |-
      Onze minister die het aangaat bevestigt binnen een maand de ontvangst van een aanvraag om erkenning van
      beroepskwalificaties, en deelt bij die gelegenheid in voorkomend geval mede met welke documenten de aanvraag dient
      te worden aangevuld.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel19
  - number: '19.2'
    text: |-
      Onze minister die het aangaat beslist zo spoedig mogelijk en in elk geval binnen drie maanden op de aanvraag.
      Deze termijn kan eenmaal met een maand worden verlengd, tenzij sprake is van een gereglementeerd beroep waarvoor
      een automatische erkenning geldt als bedoeld in titel III, hoofdstuk III, van de richtlijn of van automatische
      erkenning op basis van gemeenschappelijke opleidingsbeginselen als bedoeld in artikel 30c.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel19
  - number: '19.3'
    text: |-
      Het besluit, bedoeld in het tweede lid, kan worden aangehouden in geval van het eisen van een aanpassingsstage of
      een proeve van bekwaamheid als bedoeld in [artikel 11][ref1]. De migrerende beroepsbeoefenaar wordt daarvan binnen
      de in het tweede lid bedoelde termijn op de hoogte gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '11'
        hoofdstuk: '2'
  - number: '19.4'
    text: |-
      In geval van toepassing van het derde lid neemt Onze minister die het aangaat zo spoedig mogelijk en in elk geval
      binnen een maand nadat de migrerende beroepsbeoefenaar een aanpassingsstage heeft doorlopen of een proeve van
      bekwaamheid heeft afgelegd, een besluit als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel19
  - number: '20'
    text: |-
      Indien in Nederland voorschriften gelden voor het voeren van de beroepstitel voor een van de werkzaamheden van
      het betrokken gereglementeerde beroep, voert de migrerende beroepsbeoefenaar die op grond van dit hoofdstuk is
      gerechtigd het gereglementeerde beroep uit te oefenen, de beroepstitel die in Nederland bij dit beroep behoort, en
      maakt de migrerende beroepsbeoefenaar gebruik van de eventuele afkorting van deze titel.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel20
  - number: '21'
    text: |-
      In dit hoofdstuk wordt onder dienstverrichter verstaan een migrerende beroepsbeoefenaar die zich vanuit een andere
      betrokken staat waar de migrerende beroepsbeoefenaar op wettige wijze is gevestigd om er een beroep uit te oefenen
      naar Nederland begeeft om er bij wijze van tijdelijke en incidentele dienstverrichting hetzelfde gereglementeerde
      beroep uit te oefenen. Het tijdelijke en incidentele karakter van de dienstverrichting wordt per geval beoordeeld,
      met name in het licht van de duur, frequentie, regelmaat en continuïteit van de dienstverrichting.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel21
  - number: '22'
    text: |-
      Onverminderd de [artikelen 23][ref1], [24][ref2], [27][ref3] en [28][ref4] stelt Onze minister die het aangaat aan
      een dienstverrichter geen beperkingen wegens beroepskwalificaties indien:


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0023066#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0023066#Artikel28
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '23'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '24'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0023066
        artikel: '27'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0023066
        artikel: '28'
        hoofdstuk: '3'
  - number: 22.a
    text: |-
      het beroep, het onderwijs, of de opleiding die leidt tot toegang tot of uitoefening van het beroep in de betrokken
      staat van vestiging is gereglementeerd, of
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel22
  - number: 22.b
    text: |-
      het beroep of de opleiding die leidt tot toegang tot of uitoefening van het beroep in een of meer betrokken
      staten niet is gereglementeerd en de migrerende beroepsbeoefenaar tijdens de tien jaar voorafgaand aan de
      dienstverrichting in Nederland gedurende ten minste een jaar dat beroep heeft uitgeoefend in een of meer betrokken
      staten.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel22
  - number: '23.1'
    text: |-
      Onze minister die het aangaat kan van een dienstverrichter voorafgaand aan de eerste dienstverrichting in Nederland
      een schriftelijke verklaring eisen met daarin gegevens betreffende verzekering of gelijksoortige bescherming tegen
      de financiële risico’s van beroepsaansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel23
  - number: '23.2'
    text: |-
      De verklaring kan met alle middelen worden aangeleverd en wordt steeds na een jaar opnieuw afgegeven door de
      dienstverrichter indien hij voornemens is om gedurende het opvolgende jaar in Nederland tijdelijk en incidenteel
      diensten te verrichten.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel23
  - number: '23.3'
    text: |-
      Onze minister die het aangaat kan eisen dat de verklaring die voorafgaat aan de eerste dienstverrichting in
      Nederland vergezeld gaat van de volgende documenten, afgegeven door de terzake bevoegde autoriteit van de
      desbetreffende betrokken staat:
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel23
  - number: 23.3.a
    text: |-
      een bewijs van de nationaliteit van de dienstverrichter alsmede, indien de definitie van migrerende
      beroepsbeoefenaar, onder 2°, van toepassing is, een door Nederland afgegeven EU-verblijfsvergunning voor langdurig
      ingezetenen als bedoeld in artikel 8 van [richtlijn nr. 2003/109/EG](32003L0109) van de Raad van de Europese
      Unie van 25 november 2003 betreffende de status van langdurig ingezeten onderdanen van derde landen (PbEU L
      016), of een door een andere betrokken staat dan Nederland afgegeven zodanige EU-verblijfsvergunning en een
      verblijfsvergunning als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref1], of, indien de definitie van
      migrerende beroepsbeoefenaar, onder 3°, van toepassing is, een verblijfskaart van een familielid van een burger van
      de Unie of een duurzame verblijfskaart of een ander bewijsmiddel waaruit blijkt dat de aanvrager het verblijfsrecht
      of het duurzaam verblijfsrecht heeft verkregen als bedoeld in hoofdstuk III, respectievelijk hoofdstuk IV van
      [richtlijn nr. 2004/38/EG](32004L0038) van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004
      betreffende het recht van vrij verkeer en verblijf op het grondgebied van de lidstaten voor de burgers van de Unie
      en hun familieleden (PbEU L 158 en L 229);


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 23.3.b
    text: |-
      een attest dat de dienstverrichter rechtmatig in een andere betrokken staat dan Nederland is gevestigd om er de
      betrokken werkzaamheden uit te oefenen, en dat de dienstverrichter op het moment van afgifte van het attest geen
      permanent of tijdelijk beroepsverbod is opgelegd;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel23
  - number: 23.3.c
    text: bewijs van beroepskwalificaties;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel23
  - number: 23.3.d
    text: |-
      voor gevallen als bedoeld in [artikel 22, onder b][ref1], een bewijs van de daar omschreven beroepservaring;


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel22
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '22'
        hoofdstuk: '3'
  - number: 23.3.e
    text: |-
      voor gereglementeerde beroepen in de veiligheidssector en de gezondheidssector alsmede voor gereglementeerde
      beroepen in de onderwijssector waar met minderjarigen wordt gewerkt, waaronder gereglementeerde beroepen in de
      kinderopvang, de voorschoolse educatie en de vroegschoolse educatie, een bewijs dat de dienstverrichter geen
      tijdelijk of permanent beroepsverbod heeft of niet strafrechtelijk is veroordeeld, indien Nederland dat ook van
      zijn eigen onderdanen eist;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel23
  - number: 23.3.f
    text: |-
      voor gereglementeerde beroepen die implicaties hebben voor patiëntveiligheid, een verklaring waaruit blijkt dat de
      dienstverrichter beschikt over de taalkennis die noodzakelijk is voor de uitoefening van de betrokken werkzaamheden
      in Nederland.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel23
  - number: '23.4'
    text: |-
      Indien zich een wezenlijke verandering heeft voorgedaan in de door de documenten, bedoeld in het derde lid,
      gestaafde situatie, maakt de dienstverrichter daarvan binnen een maand melding bij Onze minister die het aangaat,
      onder overlegging van documenten als bedoeld in het derde lid waaruit die nieuwe situatie blijkt.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel23
  - number: '23.5'
    text: |-
      Indien het beroep in delen van het grondgebied van Nederland verschillend is gereglementeerd kan Onze minister
      die het aangaat ter zake met betrekking tot de beroepskwalificaties van de dienstverrichter de in het derde lid
      vermelde aanvullende gegevens eisen indien:
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel23
  - number: 23.5.a
    text: deze reglementering ook op alle onderdanen van Nederland van toepassing is;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel23
  - number: 23.5.b
    text: |-
      deze verschillen in regelgeving te rechtvaardigen zijn door dwingende redenen van algemeen belang die verband
      houden met de volksgezondheid of de openbare veiligheid van de afnemers van de diensten; en
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel23
  - number: 23.5.c
    text: Onze minister die het aangaat over geen andere middelen beschikt om deze informatie te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel23
  - number: '24'
    text: |-
      Een dienstverrichter is vrijgesteld van de eisen die gelden voor in Nederland gevestigde beroepsbeoefenaren met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel24
  - number: 24.a
    text: de autorisatie door een beroepsorganisatie;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel24
  - number: 24.b
    text: de inschrijving bij een beroepsorganisatie of bij een bij of krachtens wet ingesteld register; of
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel24
  - number: 24.c
    text: de aansluiting bij een beroepsorganisatie.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel24
  - number: '25.1'
    text: |-
      Een dienstverrichter valt onder de beroepsregels die rechtstreeks verband houden met beroepskwalificaties en de
      tuchtrechtelijke bepalingen die in Nederland van toepassing zijn op beoefenaren van hetzelfde beroep.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel25
  - number: '25.2'
    text: |-
      Om toepassing van de tuchtrechtelijke bepalingen, bedoeld in het eerste lid, mogelijk te maken, draagt
      Onze minister die het aangaat ervoor zorg dat is voorzien in automatische tijdelijke inschrijving bij een
      beroepsorganisatie of een bij of krachtens wet ingesteld register dan wel aansluiting pro forma bij een
      beroepsorganisatie, voor zover dit de dienstverrichting op geen enkele wijze vertraagt of bemoeilijkt en voor de
      dienstverrichter geen extra kosten meebrengt.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel25
  - number: '25.3'
    text: |-
      Onze minister die het aangaat stuurt aan de betrokken beroepsorganisatie of het betrokken bij of krachtens wet
      ingestelde register een kopie van de in [artikel 23][ref1] bedoelde verklaring en in voorkomend geval de verlenging
      daarvan, alsmede, voor beroepen die verband houden met de volksgezondheid en de openbare veiligheid als bedoeld in
      [artikel 27][ref2], of waarvoor een automatische erkenning geldt als bedoeld in titel III, hoofdstuk III, van de
      richtlijn, een kopie van de in [artikel 23, derde lid][ref3], bedoelde documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0023066#Artikel23
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '23'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '27'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0023066
        artikel: '23'
        hoofdstuk: '3'
  - number: '25.4'
    text: |-
      Het moment van versturen van de kopieën, bedoeld in het derde lid, wordt gelijkgesteld met een automatische
      tijdelijke inschrijving of aansluiting pro forma als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel25
  - number: '26.1'
    text: |-
      De dienstverrichter voert de beroepstitel waartoe hij in de betrokken staat van vestiging is gerechtigd. Deze titel
      wordt vermeld in de officiële taal of één van de officiële talen van de betrokken staat van vestiging.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel26
  - number: '26.2'
    text: |-
      Indien de titel, bedoeld in het eerste lid, niet bestaat, voert de dienstverrichter de titel die behoort bij zijn
      opleiding in de officiële taal of één van de officiële talen van de betrokken staat van vestiging.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel26
  - number: '26.3'
    text: 'De dienstverrichter voert de Nederlandse beroepstitel:'
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel26
  - number: 26.3.a
    text: |-
      in geval van een gereglementeerd beroep waarvoor een automatische erkenning geldt als bedoeld in titel III,
      hoofdstuk III, van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel26
  - number: 26.3.b
    text: |-
      in de gevallen waarin de beroepskwalificaties overeenkomstig [artikel 27][ref1] zijn geverifieerd.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel27
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '27'
        hoofdstuk: '3'
  - number: '27.1'
    text: |-
      Onze minister die het aangaat kan voorafgaand aan de eerste dienstverrichting de beroepskwalificaties van de
      dienstverrichter controleren indien de te verrichten dienst een gereglementeerd beroep betreft met implicaties
      voor de volksgezondheid of de openbare veiligheid en dat is geplaatst op een door Onze minister bij ministeriële
      regeling vastgestelde lijst.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel27
  - number: '27.2'
    text: |-
      De controle is slechts toegestaan voor zover deze tot doel heeft ernstige schade voor de gezondheid of de
      veiligheid van de afnemer van de dienstverrichting als gevolg van een niet toereikende beroepskwalificatie van de
      dienstverrichter te voorkomen.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel27
  - number: '27.3'
    text: |-
      Indien de beroepskwalificaties van de dienstverrichter wezenlijk verschillen van de in Nederland voor de toelating
      tot of uitoefening van het desbetreffende gereglementeerde beroep vereiste opleiding, en wel in die mate dat
      dit verschil de volksgezondheid of de openbare veiligheid kan schaden, en wanneer de dienstverrichter dit niet
      kan compenseren met beroepservaring of met in het kader van een leven lang leren verworven kennis, vaardigheden
      of competenties die met dat doel door een bevoegde instantie formeel zijn gevalideerd, biedt Onze minister die
      het aangaat de dienstverrichter de mogelijkheid om aan te tonen dat hij de ontbrekende kennis, vaardigheden of
      competenties heeft verworven, door middel van een proeve van bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel27
  - number: '27.4'
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing in geval van beroepskwalificaties als bedoeld in artikel
      30c.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel27
  - number: '28.1'
    text: |-
      In geval van toepassing van [artikel 27, eerste lid][ref1], beslist Onze minister die het aangaat binnen een maand
      na ontvangst van de verklaring en de documenten, bedoeld in [artikel 23][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel23
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '27'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '23'
        hoofdstuk: '3'
  - number: 28.1.a
    text: de beroepskwalificaties niet te controleren, of
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel28
  - number: 28.1.b
    text: 'na de beroepskwalificaties te hebben gecontroleerd:'
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel28
  - number: 28.1.b.1°
    text: |-
      van de dienstverrichter het afleggen van een proeve van bekwaamheid, als bedoeld in [artikel 27, derde lid][ref1],
      te verlangen;


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel27
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '27'
        hoofdstuk: '3'
  - number: 28.1.b.2°
    text: de dienstverrichting toe te staan; of
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel28
  - number: 28.1.b.3°
    text: |-
      indien de verschillen tussen in de betrokken staat van vestiging verrichte beroepswerkzaamheden en de
      beroepswerkzaamheden die het in Nederland gereglementeerde beroep omvat dermate groot zijn dat het eisen van
      een proeve van bekwaamheid als bedoeld in [artikel 27, derde lid][ref1], zou neerkomen op het volgen van een
      volledig onderwijs- of opleidingsprogramma, gedeeltelijke toegang te verlenen voor het verrichten van die
      beroepswerkzaamheden waartoe de dienstverrichter in de betrokken staat van vestiging is gekwalificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel27
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '27'
        hoofdstuk: '3'
  - number: '28.2'
    text: |-
      Onze minister die het aangaat kan de beslistermijn, bedoeld in het eerste lid, opschorten door de aanvrager
      binnen die termijn in kennis te stellen van de opschorting, onder vermelding van de reden. De termijn
      waarvoor kan worden opgeschort bedraagt hoogstens een maand, in voorkomende gevallen in afwijking van
      [artikel 4:15 van de Algemene wet bestuursrecht][ref1]. Nadat de termijn van opschorting is verstreken, beslist
      Onze minister die het aangaat binnen twee maanden, ongeacht, in afwijking van artikel 4:15 van de Algemene wet
      bestuursrecht, welk deel na de termijn van opschorting nog resteert van de beslistermijn, bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '28.3'
    text: |-
      Onze minister die het aangaat beslist binnen een maand na het besluit, bedoeld in het eerste lid, onderdeel b,
      onder 1°, op basis van het resultaat van de proeve van bekwaamheid over het toestaan van de dienstverrichting.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel28
  - number: '28.4'
    text: |-
      Indien Onze minister die het aangaat de beslistermijnen, bedoeld in dit artikel, overschrijdt, wordt de
      dienstverrichting geacht te zijn toegestaan. [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '28.5'
    text: |-
      In het geval van toepassing van het eerste lid, onderdeel b, onder 3°, is [artikel 12][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel12
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '12'
        hoofdstuk: '2'
  - number: '29'
    text: |-
      Wanneer de dienstverrichter de beroepstitel waartoe hij in de betrokken staat van vestiging is gerechtigd of de
      titel die behoort bij zijn opleiding, bedoeld in [artikel 26, tweede lid][ref1], voert, kan Onze minister die het
      aangaat eisen dat de dienstverrichter aan de afnemer van de dienst de volgende gegevens verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel26
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '26'
        hoofdstuk: '3'
  - number: 29.a
    text: |-
      wanneer de dienstverrichter in een handelsregister of een vergelijkbaar openbaar register is ingeschreven, het
      register waar hij is ingeschreven en zijn inschrijvingsnummer, of een vergelijkbaar middel ter identificatie in
      dat register;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel29
  - number: 29.b
    text: |-
      wanneer voor uitoefening van de betrokken werkzaamheid in de betrokken staat van vestiging een vergunning is
      vereist, de naam en het adres van de bevoegde toezichthoudende instantie;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel29
  - number: 29.c
    text: de beroepsordes of soortgelijke organisaties waarbij de dienstverrichter is aangesloten;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel29
  - number: 29.d
    text: |-
      wanneer de dienstverrichter een onder de omzetbelasting vallende werkzaamheid uitoefent, het btw-
      identificatienummer, bedoeld in [artikel 2a, eerste lid, onderdeel g, van de Wet op de omzetbelasting 1968][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel2a
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: 2a
  - number: 29.e
    text: |-
      gegevens betreffende verzekering of gelijksoortige bescherming tegen de financiële risico’s van
      beroepsaansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel29
  - number: '30.1'
    text: |-
      Onze minister die het aangaat verstrekt aan een bevoegde autoriteit van een andere betrokken staat dan Nederland
      waar een migrerende beroepsbeoefenaar die in Nederland is gevestigd tijdelijk en incidenteel diensten gaat
      verrichten op diens verzoek en indien het verzoek deugdelijk is gemotiveerd:
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30
  - number: 30.1.a
    text: |-
      in geval van gegronde twijfel, informatie over de migrerende beroepsbeoefenaar inzake de rechtmatigheid van de
      vestiging, het goede gedrag, alsmede over het ontbreken van tuchtrechtelijke maatregelen of strafrechtelijke
      sancties ter zake van de beroepsuitoefening;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30
  - number: 30.1.b
    text: |-
      informatie over opleidingscursussen van de migrerende beroepsbeoefenaar voor zover noodzakelijk om wezenlijke
      verschillen die de volksgezondheid of de openbare veiligheid kunnen beschadigen te beoordelen.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30
  - number: '30.2'
    text: |-
      Voor de toepassing van het eerste lid, aanhef en onderdeel a, zijn de
      [artikelen 34, tweede tot en met vierde lid][ref1], [34a][ref2] en [34b][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel34a
      [ref3]: https://wetten.overheid.nl/BWBR0023066#Artikel34b
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '34'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: 34a
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0023066
        artikel: 34b
        hoofdstuk: '4'
  - number: '30.3'
    text: |-
      Onze minister die het aangaat kan een bevoegde autoriteit uit een andere betrokken staat van vestiging van een
      dienstverrichter die in Nederland tijdelijk en incidenteel diensten wenst te verrichten verzoeken, mits deugdelijk
      gemotiveerd, om:
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30
  - number: 30.3.a
    text: |-
      in geval van gegronde twijfel, informatie over de dienstverrichter inzake de rechtmatigheid van de vestiging, het
      goede gedrag, alsmede over het ontbreken van tuchtrechtelijke maatregelen of strafrechtelijke sancties ter zake van
      de beroepsuitoefening;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30
  - number: 30.3.b
    text: |-
      informatie over opleidingscursussen van de dienstverrichter voor zover noodzakelijk om wezenlijke verschillen die
      de volksgezondheid of de openbare veiligheid kunnen beschadigen te beoordelen.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30
  - number: '30.4'
    text: De verstrekking, bedoeld in het eerste lid, alsmede het verzoek, bedoeld in het derde lid, geschiedt via het IMI.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30
  - number: '30.5'
    text: |-
      Indien een verzoek als bedoeld in het derde lid een beroep betreft dat in de andere betrokken staat niet
      gereglementeerd is, kan dat verzoek in plaats van aan een bevoegde autoriteit van de andere betrokken staat, worden
      gericht aan een assistentiecentrum als bedoeld in artikel 57 ter van de richtlijn van die andere betrokken staat.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30
  - number: 30a.1
    text: |-
      Onze ministers die het aangaat kunnen onderling informatie opvragen over een dienstverrichter en zij verstrekken
      onderling informatie over een dienstverrichter voor zover noodzakelijk voor de afhandeling van een klacht van een
      afnemer over de dienstverrichter in het kader van de beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30a
  - number: 30a.2
    text: |-
      Onze minister die het aangaat verstrekt aan een bevoegde autoriteit van een andere betrokken staat dan Nederland
      op diens verzoek en mits het verzoek deugdelijk is gemotiveerd, informatie over een dienstverrichter voor zover
      noodzakelijk voor de afhandeling van een klacht van een afnemer over de dienstverrichter in het kader van de
      beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30a
  - number: 30a.3
    text: |-
      Onze minister die het aangaat kan bij een bevoegde autoriteit van een andere betrokken staat dan Nederland
      informatie opvragen over een dienstverrichter voor zover noodzakelijk voor de afhandeling van een klacht van
      een afnemer over de dienstverrichter in het kader van de beroepsuitoefening en mits het verzoek om informatie
      deugdelijk is gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30a
  - number: 30a.4
    text: |-
      Dit artikel geldt onverminderd het bepaalde in de [artikelen 34 tot en met 34b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel34
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '34'
        hoofdstuk: '4'
  - number: 30a1.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels vastgesteld voor een Europese beroepskaart als
      bedoeld in de richtlijn voor een beroep dat in Nederland gereglementeerd is.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30a1
  - number: 30a1.2
    text: 'De regels betreffen onder meer:'
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30a1
  - number: 30a1.2.a
    text: de procedures voor de aanvraag en afgifte van een Europese beroepskaart;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30a1
  - number: 30a1.2.b
    text: |-
      de verwerking van persoonsgegevens in verband met een afgegeven Europese beroepskaart of de
      verkrijging van een Europese beroepskaart, waaronder bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2] in verband met artikel 4
      sexies van de richtlijn;


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30a1
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 30a1.2.c
    text: |-
      indien de richtlijn en de daarop berustende bepalingen daartoe aanleiding geven, dat indien Onze minister die het
      aangaat kennis neemt van de indiening in een andere betrokken staat van een aanvraag voor een Europese beroepskaart
      voor de toegang tot of uitoefening van het beroep in Nederland, en de aanvrager tevens op grond van deze wet
      een aanvraag heeft ingediend voor de toegang tot of uitoefening van het beroep in Nederland inzake hetzelfde
      gereglementeerde beroep, Onze minister die het aangaat besluit laatstgenoemde aanvraag niet te behandelen dan wel
      buiten behandeling te stellen, in afwijking van [artikel 4:5 van de Algemene wet bestuursrecht][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30a1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 30a1.2.d
    text: |-
      indien de richtlijn en de daarop berustende bepalingen daartoe aanleiding geven, dat een termijn voor het geven van
      een beschikking in afwijking van [artikel 4:15 van de Algemene wet bestuursrecht][ref1] niet wordt opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30a1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 30a1.3
    text: |-
      De regels kunnen onder meer betreffen het ten laste van de aanvrager van een Europese beroepskaart brengen van
      kosten in verband met die aanvraag, met dien verstande dat de kosten die ten laste van de aanvrager worden gebracht
      redelijk, evenredig en in verhouding zijn tot de gemaakte kosten, de gemaakte kosten niet overschrijden, en het
      doen van een aanvraag niet ontmoedigen.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30a1
  - number: 30b.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels vastgesteld voor een Europese beroepskaart als
      bedoeld in de richtlijn voor een beroep dat in Nederland niet gereglementeerd is.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30b
  - number: 30b.2
    text: 'De regels kunnen onder meer betreffen:'
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30b
  - number: 30b.2.a
    text: in hoeverre en op welke wijze artikelen van deze wet van overeenkomstige toepassing zijn; en
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30b
  - number: 30b.2.b
    text: de aanwijzing van een bevoegde autoriteit als bedoeld in artikel 3, eerste lid, onderdeel d, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30b
  - number: 30b.3
    text: Het tweede en derde lid van artikel 30a1 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30b
  - number: 30c
    text: |-
      Indien de Europese Commissie gemeenschappelijke opleidingsbeginselen heeft vastgesteld als bedoeld in titel
      III, hoofdstuk III bis, van de richtlijn, en er geen vrijstelling is als bedoeld in de artikelen 49 bis, vijfde
      lid, en 49 ter, vijfde lid, van de richtlijn, verleent Onze minister die het aangaat automatische erkenning
      aan beroepskwalificaties op basis van die gemeenschappelijke opleidingsbeginselen, met inachtneming van bij
      ministeriële regeling te stellen regels. [Artikel 33, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel33
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '33'
        hoofdstuk: '4'
  - number: '31.1'
    text: |-
      De migrerende beroepsbeoefenaar die op grond van [hoofdstuk 2][ref1] of [hoofdstuk 3][ref2] erkenning van
      beroepskwalificaties heeft verkregen respectievelijk is toegelaten als dienstverrichter, of die een Europese
      beroepskaart heeft verkregen met het oog op beroepsuitoefening in Nederland, beschikt over de talenkennis die voor
      de uitoefening van het desbetreffende gereglementeerde beroep is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0023066
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023066
        hoofdstuk: '3'
  - number: '31.2'
    text: 'Onze minister die het aangaat kan besluiten de talenkennis, bedoeld in het eerste lid, te controleren:'
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31
  - number: 31.2.a
    text: bij gereglementeerde beroepen met implicaties voor patiëntveiligheid;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31
  - number: 31.2.b
    text: bij de overige gereglementeerde beroepen, in geval van ernstige en concrete twijfel.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31
  - number: '31.3'
    text: |-
      De taalcontrole is evenredig aan de uit te oefenen beroepswerkzaamheden en beperkt zich tot de kennis van één
      officiële taal in Nederland.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31
  - number: 31a.1
    text: |-
      Onze minister die het aangaat stelt de bevoegde autoriteiten van alle andere betrokken staten in kennis van
      een in Nederland door een rechterlijke instantie of een andere bij of krachtens de wet bevoegde instantie aan
      een migrerende beroepsbeoefenaar opgelegd verbod of een opgelegde beperking, tijdelijk dan wel permanent, op de
      uitoefening van een in Nederland gereglementeerd beroep. Het opgelegde verbod of de opgelegde beperking heeft
      betrekking op:
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.1.a
    text: een gereglementeerd beroep als bedoeld in artikel 56 bis, eerste lid, onderdelen a tot en met j, van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.1.b
    text: een gereglementeerd beroep dat beroepswerkzaamheden omvat met implicaties voor de patiëntveiligheid; of
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.1.c
    text: |-
      een gereglementeerd beroep dat verband houdt met onderwijs aan minderjarigen, de kinderopvang, de voorschoolse
      educatie en de vroegschoolse educatie.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.2
    text: |-
      De kennisgeving, bedoeld in het eerste lid, geschiedt via het IMI en vindt plaats binnen drie dagen nadat ingevolge
      het verbod of de beperking de uitoefening van het betreffende beroep daadwerkelijk niet of slechts beperkt mag
      geschieden. De kennisgeving bevat uitsluitend de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.2.a
    text: de identiteit van de desbetreffende migrerende beroepsbeoefenaar;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.2.b
    text: het betrokken gereglementeerde beroep;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.2.c
    text: |-
      de rechterlijke instantie of andere bij of krachtens de wet bevoegde instantie die het verbod of de beperking heeft
      opgelegd;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.2.d
    text: de reikwijdte van de beperking of het verbod; en
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.2.e
    text: de periode gedurende welke de beperking of het verbod van kracht is.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.3
    text: |-
      De rechterlijke instanties en andere bij of krachtens de wet bevoegde instanties, bedoeld in het eerste lid,
      verstrekken Onze minister die het aangaat de gegevens, bedoeld in het tweede lid. De verstrekking kan ook
      geschieden door of via andere daartoe aangewezen instanties of personen.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.4
    text: |-
      De bevoegde autoriteiten van de andere betrokken staten worden onverwijld in kennis gesteld indien een verbod of
      een beperking als bedoeld in het eerste lid eindigt.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.5
    text: |-
      De gegevens van een kennisgeving als bedoeld in het eerste lid worden uit het IMI verwijderd binnen drie dagen
      nadat het verbod of de beperking is opgeheven of geëindigd.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.6
    text: |-
      Het besluit tot de kennisgeving, bedoeld in het eerste lid, alsmede het besluit tot wijziging van die kennisgeving
      op grond van dit artikel, is een besluit als bedoeld in [artikel 1:3 van de Algemene wet bestuursrecht][ref1]. Van
      dit besluit wordt de migrerende beroepsbeoefenaar schriftelijk in kennis gesteld op hetzelfde moment als waarop de
      kennisgeving, bedoeld in het eerste lid, of een wijziging daarvan wordt verricht. Indien tegen dit besluit bezwaar
      of beroep aanhangig is, deelt Onze minister die het aangaat dit via het IMI mede aan de bevoegde autoriteiten van
      de andere betrokken staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 31a.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld ter uitvoering van dit artikel.
      Deze voorschriften kunnen onder meer inhouden:
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.7.a
    text: een nadere bepaling van de beroepen, bedoeld in het eerste lid, onderdelen a, b, en c;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.7.b
    text: een nadere bepaling welke verboden en beperkingen een kennisgeving, bedoeld in het eerste lid, kan betreffen;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.7.c
    text: regels over de voor de toepassing van dit artikel noodzakelijke verwerking van persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.7.d
    text: |-
      voorschriften in verband met door de Europese Commissie vastgestelde uitvoeringshandelingen krachtens artikel 56
      bis, achtste lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31a.8
    text: |-
      Onze minister die het aangaat kan in verband met de afhandeling van een bezwaar of beroep als bedoeld in het
      zesde lid, gegevens in verband met de kennisgeving verwerken voor zover dit noodzakelijk is met het oog op die
      afhandeling.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31a
  - number: 31b.1
    text: |-
      Indien een migrerende beroepsbeoefenaar door een rechterlijke instantie of een andere bij of krachtens de wet
      bevoegde instantie in Nederland schuldig is bevonden aan het gebruik van valse beroepskwalificaties in verband met
      een procedure als bedoeld in de [hoofdstukken 2][ref1], [3][ref2] of 3a, stelt Onze minister die het aangaat de
      bevoegde autoriteiten van alle andere betrokken staten daarvan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0023066
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023066
        hoofdstuk: '3'
  - number: 31b.2
    text: |-
      De kennisgeving, bedoeld in het eerste lid, geschiedt via het IMI en vindt plaats binnen drie dagen na de uitspraak
      van de desbetreffende instantie.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31b
  - number: 31b.3
    text: |-
      [Artikel 31a, tweede tot en met achtste lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel31a
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: 31a
        hoofdstuk: '4'
  - number: 31c.1
    text: |-
      Onze minister die het aangaat kan de door hem ontvangen waarschuwingen die bevoegde autoriteiten van andere
      betrokken staten hebben verricht in het waarschuwingsmechanisme, bedoeld in artikel 56 bis van de richtlijn,
      verwerken.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31c
  - number: 31c.2
    text: |-
      De verwerking, bedoeld in het eerste lid, kan onder meer inhouden het onderzoeken of voor degene op wie de
      ontvangen waarschuwing betrekking heeft een procedure op grond van deze wet aanhangig is of is geweest, en of
      degene op wie de ontvangen waarschuwing betrekking heeft in Nederland werkzaam is in een gereglementeerd beroep,
      en als dat het geval is waar. Desgevraagd verstrekken derden Onze minister die het aangaat de hiervoor benodigde
      informatie.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31c
  - number: 31c.3
    text: De verwerking, bedoeld in het eerste lid, kan onder meer het informeren van derden over een waarschuwing inhouden.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31c
  - number: 31c.4
    text: |-
      Onze minister die het aangaat kan bij de bevoegde autoriteit van de betrokken staat waarvan de waarschuwing
      afkomstig is, nadere informatie opvragen over de waarschuwing, waaronder informatie over de aanleiding voor het
      verbod of de beperking op de uitoefening van het beroep dan wel voor het schuldig bevinden aan het gebruik van
      valse beroepskwalificaties.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31c
  - number: 31c.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld voor de verwerking, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel31c
  - number: '32.1'
    text: |-
      Onverminderd de [artikelen 20][ref1] en [26][ref2], heeft de migrerende beroepsbeoefenaar het recht gebruik te
      maken van academische titels die aan de migrerende beroepsbeoefenaar zijn verleend in de betrokken staat van
      oorsprong of herkomst, en eventueel van de afkorting daarvan, in de taal van die betrokken staat. Onze minister
      die het aangaat kan voorschrijven dat deze titel wordt gevolgd door de naam en de plaats van de instelling of de
      examencommissie die de titel heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel26
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '20'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '26'
        hoofdstuk: '3'
  - number: '32.2'
    text: |-
      Indien een academische titel als bedoeld in het eerste lid kan worden verward met een titel waarvoor in Nederland
      een aanvullende opleiding is vereist die de migrerende beroepsbeoefenaar niet heeft gevolgd, kan Onze minister
      die het aangaat voorschrijven dat de migrerende beroepsbeoefenaar de academische titel van de betrokken staat van
      oorsprong of herkomst voert in een door Onze minister die het aangaat aangegeven passende vorm.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel32
  - number: 32a.1
    text: |-
      Indien een migrerende beroepsbeoefenaar die in het bezit is van in Nederland behaalde beroepskwalificaties, in
      een andere betrokken staat een beroepsstage heeft doorlopen en toegang wenst tot een gereglementeerd beroep in
      Nederland waarvoor een beroepsstage is vereist, beschouwt Onze minister die het aangaat, indien hij een verzoek
      om toelating om het gereglementeerde beroep uit te oefenen, in overweging neemt, de in de andere betrokken staat
      gevolgde beroepsstage als die vereiste beroepsstage, mits de in de andere betrokken staat gevolgde beroepsstage in
      overeenstemming is met door Onze minister die het aangaat vast te stellen beleidsregels op grond van het derde lid.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel32a
  - number: 32a.2
    text: |-
      Indien een migrerende beroepsbeoefenaar die in het bezit is van in Nederland behaalde beroepskwalificaties,
      in een derde land een beroepsstage heeft doorlopen en toegang wenst tot een gereglementeerd beroep waarvoor
      een beroepsstage is vereist, houdt Onze minister die het aangaat rekening met de in het derde land gevolgde
      beroepsstage bij de behandeling van het verzoek tot toegang tot het desbetreffende gereglementeerde beroep.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel32a
  - number: 32a.3
    text: |-
      Onze minister die het aangaat stelt beleidsregels vast voor de toepassing van het eerste en tweede lid, en voor
      de organisatie van de beroepsstage, met name betreffende de rol van de supervisor van de beroepsstage. Daarbij
      kunnen regels worden gesteld om de duur van het deel van de beroepsstage die in een andere betrokken staat of
      een derde land mag worden gevolgd, tot een redelijke periode te beperken. [Artikel 33, vierde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel33
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '33'
        hoofdstuk: '4'
  - number: 32a.4
    text: |-
      Het beschouwen als vereiste beroepsstage en het rekening houden met een beroepsstage, bedoeld in het eerste
      respectievelijk tweede lid, vervangt niet een voor de toelating tot het desbetreffende beroep verplicht af te
      leggen examen.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel32a
  - number: '33.1'
    text: |-
      Onze minister die het aangaat geeft bij ministeriële regeling per gereglementeerd beroep nadere regels ten
      aanzien van de aanvraag tot het verkrijgen van erkenning, de aanpassingsstage en de proeve van bekwaamheid. Deze
      regels hebben in ieder geval betrekking op de documenten die bij de aanvraag moeten worden gevoegd alsmede op de
      beoordeling van de aanpassingsstage en de proeve van bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel33
  - number: '33.2'
    text: |-
      Onze minister die het aangaat geeft bij ministeriële regeling per gereglementeerd beroep nadere regels ten aanzien
      van de verklaring en de documenten, bedoeld in [artikel 23][ref1], de controle in verband met volksgezondheid of
      openbare veiligheid, bedoeld in [artikel 27][ref2], en het verstrekken van gegevens voor afnemers van de dienst,
      bedoeld in [artikel 29][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0023066#Artikel29
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '23'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '27'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0023066
        artikel: '29'
        hoofdstuk: '3'
  - number: '33.3'
    text: |-
      Onze minister die het aangaat kan regels vaststellen voor het ten laste van de aanvrager brengen van kosten die
      samenhangen met diens aanvraag, zoals het in behandeling nemen van de aanvraag, de afgifte van besluiten en het
      organiseren van een proeve van bekwaamheid en van een aanpassingsstage. De kosten die ten laste van de aanvrager
      worden gebracht zijn redelijk, evenredig en in verhouding tot de gemaakte kosten, overschrijden de gemaakte kosten
      niet, en ontmoedigen het doen van een aanvraag niet.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel33
  - number: '33.4'
    text: |-
      In geval onder Onze minister die het aangaat wordt verstaan het orgaan, bedoeld in
      [artikel 14, tweede lid, onder e, van de Wet op de beroepen in de individuele gezondheidszorg][ref1], worden de
      nadere regels, bedoeld in het eerste, tweede en derde lid, gesteld bij regeling van het orgaan, bedoeld in artikel
      14, tweede lid, onder d, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '14'
  - number: '34.1'
    text: |-
      Onze minister die het aangaat verstrekt aan een bevoegde autoriteit van een andere betrokken staat dan Nederland
      op diens verzoek en mits het verzoek deugdelijk is gemotiveerd, informatie over tuchtrechtelijke maatregelen,
      strafrechtelijke sancties of andere specifieke ernstige feiten ten aanzien van een migrerende beroepsbeoefenaar,
      voor zover noodzakelijk voor de beoordeling van de rechtmatigheid van de toegang tot of uitoefening van een
      gereglementeerd beroep in het kader van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34
  - number: '34.2'
    text: |-
      Voor de toepassing van het eerste lid wordt, voor zover het strafrechtelijke sancties betreft, een verklaring
      omtrent het gedrag aangemerkt als informatie omtrent strafrechtelijke sancties.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34
  - number: '34.3'
    text: |-
      In afwijking van [artikel 33 van de Wet justitiële en strafvorderlijke gegevens][ref1] wordt een aanvraag tot het
      afgeven van een verklaring omtrent het gedrag ten aanzien van een migrerende beroepsbeoefenaar ingediend door een
      bevoegde autoriteit van een andere betrokken staat dan Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel33
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '33'
  - number: '34.4'
    text: |-
      Een aanvraag als bedoeld in het derde lid wordt, in afwijking van
      [artikel 30, eerste lid, eerste volzin, van de Wet justitiële en strafvorderlijke gegevens][ref1] ingediend bij
      Onze minister van Veiligheid en Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel30
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '30'
  - number: '34.5'
    text: |-
      Onze minister die het aangaat kan bij een bevoegde autoriteit van een andere betrokken staat dan Nederland
      informatie opvragen over tuchtrechtelijke maatregelen, strafrechtelijke sancties of andere ernstige feiten ten
      aanzien van migrerende beroepsbeoefenaars, voor zover noodzakelijk voor de beoordeling van de rechtmatigheid van
      de toegang tot of uitoefening van een gereglementeerd beroep in het kader van deze wet en mits het verzoek om
      informatie deugdelijk is gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34
  - number: '34.6'
    text: Onze minister die het aangaat verstrekt de informatie, bedoeld in het eerste en tweede lid, via het IMI.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34
  - number: 34a.1
    text: |-
      Voor de toepassing van de [artikelen 32, eerste lid][ref1], [34][ref2], [35][ref3] en
      [36 van de Wet justitiële en strafvorderlijke gegevens][ref4] wordt als aanvrager aangemerkt de migrerende
      beroepsbeoefenaar ten aanzien van wie de verklaring omtrent het gedrag wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0014194#Artikel36
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0014194
        artikel: '36'
  - number: 34a.2
    text: |-
      Onze minister van Veiligheid en Justitie stelt de migrerende beroepsbeoefenaar ten aanzien van wie de verklaring
      omtrent het gedrag wordt gevraagd in kennis van de aanvraag, bedoeld in [artikel 34, derde lid][ref1], en vraagt
      zijn instemming met het in behandeling nemen van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel34
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '34'
        hoofdstuk: '4'
  - number: 34a.3
    text: |-
      Indien de migrerende beroepsbeoefenaar geen instemming verleent, bericht Onze minister van Veiligheid en Justitie
      dit aan de bevoegde autoriteit van een andere betrokken staat dan Nederland die de verklaring omtrent het gedrag
      heeft aangevraagd.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34a
  - number: 34a.4
    text: |-
      Voor het in behandeling nemen van de aanvraag tot afgifte van een verklaring omtrent het gedrag kan Onze
      minister van Veiligheid en Justitie van de aanvrager, bedoeld in het eerste lid, een vergoeding van kosten
      verlangen. [Artikel 39, tweede en vierde lid, van de Wet justitiële en strafvorderlijke gegevens][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '39'
  - number: 34b.1
    text: |-
      Onze minister van Veiligheid en Justitie informeert de migrerende beroepsbeoefenaar ten aanzien van wie de
      verklaring omtrent het gedrag wordt gevraagd indien hij voornemens is de afgifte van de verklaring omtrent het
      gedrag te weigeren.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34b
  - number: 34b.2
    text: |-
      Onze minister van Veiligheid en Justitie verstrekt de verklaring omtrent het gedrag dan wel de weigering tot
      afgifte daarvan aan de migrerende beroepsbeoefenaar, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34b
  - number: 34b.3
    text: |-
      Onze minister van Veiligheid en Justitie stelt de bevoegde autoriteit van een andere betrokken staat dan Nederland
      zo spoedig mogelijk op de hoogte van de afgifte dan wel weigering van de verklaring omtrent het gedrag. Bij de
      kennisgeving over de afgifte van de verklaring omtrent het gedrag wordt de strekking van de afgegeven verklaring
      omtrent het gedrag medegedeeld.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34b
  - number: 34b.4
    text: |-
      Indien de weigering van de verklaring omtrent het gedrag nog niet onherroepelijk is, informeert Onze minister van
      Veiligheid en Justitie de bevoegde autoriteit van een andere betrokken staat dan Nederland daarover.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34b
  - number: 34c.1
    text: |-
      De procedures in het kader van erkenning van beroepskwalificaties als bedoeld in [hoofdstuk 2][ref1],
      tijdelijke en incidentele dienstverrichting als bedoeld in [hoofdstuk 3][ref2] en de Europese beroepskaart
      als bedoeld in hoofdstuk 3a, zijn beschikbaar langs elektronische weg, via het centraal loket als bedoeld in
      [artikel 5 van de Dienstenwet][ref3], of via Onze minister die het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0026759#Artikel5
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0023066
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023066
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0026759
        artikel: '5'
  - number: 34c.2
    text: |-
      Het eerste lid is niet van toepassing op het uitvoeren van een aanpassingsstage als bedoeld in
      [artikel 11, eerste lid][ref1], of een proeve van bekwaamheid als bedoeld in artikel 11, eerste lid of
      [artikel 27, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel27
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '11'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '27'
        hoofdstuk: '3'
  - number: 34d
    text: |-
      Onze minister van Onderwijs, Cultuur en Wetenschap wijst een assistentiecentrum aan als bedoeld in
      artikel 57 ter van de richtlijn en kan daarbij de taken en bevoegdheden van het assistentiecentrum
      nader bepalen, waaronder taken en bevoegdheden inzake de verwerking van persoonsgegevens, waarbij de
      [artikelen 34, eerste tot en met vierde lid en zesde lid][ref1], [34a][ref2] en [34b][ref3] van overeenkomstige
      toepassing kunnen worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel34a
      [ref3]: https://wetten.overheid.nl/BWBR0023066#Artikel34b
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '34'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: 34a
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0023066
        artikel: 34b
        hoofdstuk: '4'
  - number: '35'
    text: 'Onze minister die het aangaat draagt zorg voor registratie van:'
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel35
  - number: 35.a
    text: |-
      de wijze van afhandeling van de aanvragen op grond van deze wet en de daarop berustende bepalingen, en van de
      controles, bedoeld in [artikel 27][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel27
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '27'
        hoofdstuk: '3'
  - number: 35.b
    text: |-
      het aantal en de soorten besluiten die op grond van deze wet en de daarop berustende bepalingen worden genomen, met
      inbegrip van de soorten besluiten over gedeeltelijke toegang die overeenkomstig [artikel 12][ref1] zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel12
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '12'
        hoofdstuk: '2'
  - number: '36'
    text: |-
      Onze minister die het aangaat kan de taken en bevoegdheden die hij heeft op grond van deze wet delegeren, met
      uitzondering van de bevoegdheid tot het stellen van nadere regels bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel36
  - number: '54.1'
    text: |-
      Een EG-verklaring die is afgegeven op grond van de [Algemene wet erkenning EG-hoger-onderwijsdiploma’s][ref1]
      of de [Algemene wet erkenning EG-beroepsopleidingen][ref2] geldt als een erkenning van beroepskwalificaties als
      bedoeld in [artikel 6][ref3] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006317
      [ref2]: https://wetten.overheid.nl/BWBR0006781
      [ref3]: https://wetten.overheid.nl/BWBR0023066#Artikel6
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0006317
      - id: ref2
        bwb_id: BWBR0006781
      - id: ref3
        bwb_id: BWBR0023066
        artikel: '6'
        hoofdstuk: '2'
  - number: '54.2'
    text: |-
      Een toelating tot een gereglementeerd beroep op grond van
      [artikel 7, tweede en derde lid, van de Algemene wet erkenning EG-beroepsopleidingen][ref1] geldt als een erkenning
      van beroepskwalificaties als bedoeld in [artikel 6][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel6
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '6'
        hoofdstuk: '2'
  - number: '54.3'
    text: |-
      Een op de datum van inwerkingtreding van deze wet aanhangige aanvraag tot het verkrijgen van een EG-
      verklaring als bedoeld in [artikel 8 van de Algemene wet erkenning EG-hoger-onderwijsdiploma’s][ref1] of
      [artikel 10 van de Algemene wet erkenning EG-beroepsopleidingen][ref2] geldt als een aanvraag tot het verlenen van
      erkenning van beroepskwalificaties overeenkomstig [hoofdstuk 2][ref3] van deze wet dan wel, ingeval de aanvraag
      ziet op tijdelijke en incidentele dienstverrichting, als een verklaring van een dienstverrichter als bedoeld in
      [artikel 23][ref4] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006781#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0023066#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0023066#Artikel23
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0006317
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006781
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0023066
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0023066
        artikel: '23'
        hoofdstuk: '3'
  - number: '54.4'
    text: |-
      Een op de datum van inwerkingtreding van deze wet aanhangig of tijdig in te dienen bezwaarschrift
      tegen een beslissing op grond van de [Algemene wet erkenning EG-hoger-onderwijsdiploma’s][ref1] of de
      [Algemene wet erkenning EG-beroepsopleidingen][ref2] wordt overeenkomstig deze wet afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006317
      [ref2]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0006317
      - id: ref2
        bwb_id: BWBR0006781
  - number: '54.5'
    text: |-
      Op een op de datum van inwerkingtreding van deze wet ingesteld of tijdig in te stellen beroep tegen
      een beslissing op grond van de [Algemene wet erkenning EG-hoger-onderwijsdiploma’s][ref1] of de
      [Algemene wet erkenning EG-beroepsopleidingen][ref2] blijft het recht zoals het gold voor die datum van toepassing,
      met dien verstande dat het beroep wordt geacht te zijn gericht tegen een beslissing van Onze minister die het
      aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006317
      [ref2]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0006317
      - id: ref2
        bwb_id: BWBR0006781
  - number: '55'
    text: |-
      De [Algemene wet erkenning EG-hoger-onderwijsdiploma’s][ref1] en de
      [Algemene wet erkenning EG-beroepsopleidingen][ref2] worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006317
      [ref2]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0006317
      - id: ref2
        bwb_id: BWBR0006781
  - number: '56'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst, met dien verstande dat [artikel 42][ref1] terugwerkt tot en met 1 januari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel42
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '42'
        hoofdstuk: '5'
  - number: '57'
    text: 'Deze wet wordt aangehaald als: Algemene wet erkenning EU-beroepskwalificaties.'
    url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#Artikel57
