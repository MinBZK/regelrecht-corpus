preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het noodzakelijk is bij de wet regels te stellen ter uitvoering
    van richtlijn nr. 2005/36/EG van het Europees Parlement en de Raad van de Europese Unie van 7 september 2005
    betreffende de erkenning van beroepskwalificaties (PbEU L 255);

    dat deze regels voor onderdanen van de lidstaten van de Europese Unie, andere staten die partij zijn bij
    de Overeenkomst betreffende de Europese Economische Ruimte en Zwitserland de toegang tot en uitoefening van
    een gereglementeerd beroep in Nederland moeten waarborgen die afhankelijk zijn gesteld van het bezit van
    bepaalde beroepskwalificaties, indien de in een andere betrokken staat of andere betrokken staten verworven
    beroepskwalificaties aan hen het recht verlenen aldaar hetzelfde beroep uit te oefenen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023066/2018-09-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: **aanpassingsstage**: uitoefening in Nederland
      van een gereglementeerd beroep onder verantwoordelijkheid van een gekwalificeerde beroepsbeoefenaar, met in
      voorkomend geval een aanvullende opleiding, teneinde te kunnen beoordelen of de migrerende beroepsbeoefenaar
      voldoende bekwaamheid bezit om het desbetreffende beroep in Nederland uit te oefenen; **bekwaamheidsattest**:
      bekwaamheidsattest als bedoeld in [artikel 9, onder e][ref1]; **beroepservaring**: daadwerkelijke en
      geoorloofde voltijdse of gelijkwaardige deeltijdse uitoefening van het betrokken beroep in een betrokken staat;
      **beroepskwalificaties**: kwalificaties die worden gestaafd door een opleidingstitel, een bekwaamheidsattest of
      beroepservaring; **beroepsstage**: een periode van beroepsuitoefening onder toezicht van een supervisor die geldt
      als een voorwaarde voor toegang tot of uitoefening van een gereglementeerd beroep, en die plaatsvindt tijdens
      dan wel na afloop van een opleiding die leidt tot een diploma, certificaat of bekwaamheidsattest als bedoeld
      in [artikel 9][ref2]; **betrokken staat**: lidstaat van de Europese Unie, andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland; **dwingende redenen van algemeen belang**:
      redenen die als zodanig zijn erkend in de rechtspraak van het Hof van Justitie van de Europese Unie; **ECTS-
      studiepunten**: studiepunten die zijn gewaardeerd conform het European Credit Transfer System; **een leven lang
      leren**: het geheel van alle vormen van algemeen onderwijs, beroepsonderwijs en beroepsopleidingen, niet-formeel
      onderwijs en informeel leren die gedurende het gehele leven plaatsvinden en die tot meer kennis, vaardigheden en
      competenties leiden, eventueel ook op het gebied van de beroepsethiek; **erkenning van beroepskwalificaties**:
      erkenning van beroepskwalificaties als bedoeld in [artikel 5][ref3]; **Europese beroepskaart**: elektronisch
      document dat dient als bewijs dat een migrerende beroepsbeoefenaar aan de noodzakelijke voorwaarden voldoet voor
      toegang tot of uitoefening van een gereglementeerd beroep in een betrokken staat; **gereglementeerd beroep**:
      1°. beroepswerkzaamheid of geheel van beroepswerkzaamheden waarvoor geldt dat de toegang daartoe of uitoefening
      daarvan, waaronder het voeren van een beroepstitel, bij of krachtens wet direct of indirect afhankelijk is
      gesteld van het bezit van bepaalde beroepskwalificaties, of 2°. beroep dat wordt uitgeoefend door de leden van de
      verenigingen of organisaties die zijn genoemd in bijlage I van richtlijn nr. 2005/36/EG van het Europees Parlement
      en de Raad van de Europese Unie van 7 september 2005 betreffende de erkenning van beroepskwalificaties (PbEU L
      255); **gereglementeerde opleiding**: opleiding die specifiek op een bepaald beroep is gericht en die bestaat uit
      een studiecyclus waarvan de structuur en het niveau bij of krachtens wet zijn vastgesteld, in voorkomend geval
      aangevuld met een beroepsopleiding, beroepsstage of praktijkervaring, waarvan de structuur en het niveau bij of
      krachtens wet zijn vastgesteld; **IMI**: elektronisch informatiesysteem, bedoeld in artikel 1 van Verordening
      (EU) nr. 1024/2012 betreffende de administratieve samenwerking via het Informatiesysteem interne markt («de IMI-
      verordening»); **migrerende beroepsbeoefenaar**: 1°. onderdaan van een betrokken staat; 2°. onderdaan van een derde
      land die houder is van een door een lidstaat van de Europese Unie afgegeven EU-verblijfsvergunning voor langdurig
      ingezetenen als bedoeld in artikel 8 van [richtlijn nr. 2003/109/EG](32003L0109) van de Raad van de Europese Unie
      van 25 november 2003 betreffende de status van langdurig ingezeten onderdanen van derde landen (PbEU L 016); 3°.
      familielid van een onderdaan van een betrokken staat dat onderdaan is van een derde land en dat uit hoofde van
      [richtlijn nr. 2004/38/EG](32004L0038) van het Europees Parlement en de Raad van de Europese Unie van 29 april 2004
      betreffende het recht van vrij verkeer en verblijf op het grondgebied van de lidstaten voor de burgers van de Unie
      en hun familieleden (PbEU L 158 en L 229), gerechtigd is een betrokken staat binnen te komen en er te verblijven;
      **Onze minister**: Onze minister van Onderwijs, Cultuur en Wetenschap; **Onze minister die het aangaat**: Onze
      minister onder wiens beleidsverantwoordelijkheid de reglementering bij of krachtens wet van de toegang tot of
      uitoefening van het desbetreffende gereglementeerde beroep valt; **opleidingstitel**: 1°. kwalificatie als bedoeld
      in [artikel 9, onder a tot en met d][ref4], die door het daartoe bij of krachtens wet in een andere betrokken staat
      dan Nederland bevoegde gezag is afgegeven ter afsluiting van een overwegend in de gebieden waarop de Overeenkomst
      betreffende de Europese Economische Ruimte van toepassing is of Zwitserland gevolgde beroepsopleiding; of 2°.
      kwalificatie als bedoeld in [artikel 9, onder a tot en met d][ref5], die door het daartoe bij of krachtens wet
      in een derde land bevoegde gezag is afgegeven, indien de migrerende beroepsbeoefenaar in het betrokken beroep
      een beroepservaring van ten minste drie jaar heeft opgedaan op het grondgebied van een betrokken staat anders
      dan Nederland die de betrokken kwalificatie heeft erkend en indien die betrokken staat deze beroepservaring
      bevestigt; **proeve van bekwaamheid**: toets afgenomen of aanvaard door Onze minister die het aangaat, inzake
      de beroepskennis, -vaardigheden en -competenties van de migrerende beroepsbeoefenaar, die tot doel heeft te
      beoordelen of de migrerende beroepsbeoefenaar de bekwaamheid bezit om in Nederland een gereglementeerd beroep uit
      te oefenen, en die betrekking heeft op de vakgebieden die niet worden bestreken door de opleiding die de migrerende
      beroepsbeoefenaar heeft gevolgd en die wezenlijk zijn voor de uitoefening van het beroep in Nederland, en waaronder
      mede kan zijn begrepen kennis van de beroepsregels die in Nederland op de betrokken activiteiten van toepassing
      zijn, waarbij in aanmerking wordt genomen dat de migrerende beroepsbeoefenaar in de betrokken staat van oorsprong
      of herkomst een gekwalificeerde beroepsbeoefenaar is; **richtlijn**: Richtlijn 2005/36/EG van het Europees
      Parlement en de Raad van de Europese Unie van 7 september 2005 betreffende de erkenning van beroepskwalificaties
      (PbEU L 255), zoals deze laatstelijk gewijzigd is bij Richtlijn 2013/55/EU van het Europees Parlement en de Raad
      van 20 november 2013 tot wijziging van Richtlijn 2005/36/EG betreffende de erkenning van beroepskwalificaties
      en Verordening (EU) nr. 1024/2012 betreffende de administratieve samenwerking via het Informatiesysteem interne
      markt («de IMI-verordening») (PbEU 2013, L 354)»; **verklaring omtrent het gedrag**: verklaring als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref6].


