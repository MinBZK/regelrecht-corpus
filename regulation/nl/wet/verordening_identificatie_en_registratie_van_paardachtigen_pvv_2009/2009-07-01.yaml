regulatory_layer: WET
publication_date: '2014-12-24'
valid_from: '2009-07-01'
bwb_id: BWBR0026239
url: https://wetten.overheid.nl/BWBR0026239/2009-07-01
preamble:
  text: |-
    Gelet op Verordening (EG) Nr. 504/2008 van de Commissie van 6 juni 2008 ter uitvoering van de Richtlijnen 90/426/
    EEG en 90/427/EEG van de Raad wat betreft de methoden voor de identificatie van paardachtigen (PB L 149), de
    artikelen 96, 105, 108 en 108a van de Gezondheids- en welzijnswet voor dieren (Stb. 1992, 585), artikel 2 van
    het Besluit identificatie en registratie van dieren, de artikelen 1 en 2 van de Regeling medebewind vergoeding en
    tuchtrechtelijke maatregelen identificatie en registratie van eenhoevige dieren (Stcrt. 2003, 241) en de artikelen
    96, 97, 98 en 104 van de Wet op de bedrijfsorganisatie,

    Gezien Richtlijn 90/426/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling van
    veterinairrechtelijke voorschriften voor het verkeer van paardachtigen en de invoer van paardachtigen uit
    derde landen (PB L 224), Richtlijn 90/427/EEG van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot
    vaststelling van zoötechnische en genealogische voorschriften voor het intracommunautaire handelsverkeer in
    paardachtigen (PB L 224);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt verstaan onder:







                  a. productschap


                  :


                  Productschap Vee en Vlees;




                  b. voorzitter


                  :


                  de voorzitter van het productschap;




                  c.bestuur


                  :


                  het bestuur van het productschap;




                  d. Verordening (EG) Nr. 504/2008


                  :


                  Verordening (EG) Nr. 504/2008 van de Commissie van 6 juni 2008 ter uitvoering van de Richtlijnen
      90/426/EEG en 90/427/EEG van de Raad wat betreft de methoden voor de identificatie van paardachtigen (PB L 149);




                  e. erkende instelling


                  :


                  een krachtens het [Fokkerijbesluit ][ref1]erkende organisatie die één of meer stamboeken of registers
      bijhoudt;




                  f. hippische sportorganisatie


                  :


                  een organisatie die de paardensport professioneel bevordert en daartoe onder andere wedstrijden of
      paardenrennen organiseert;




                  g. dierenarts


                  :


                  degene die krachtens de [Wet op de uitoefening van de diergeneeskunde][ref2] (Stb. 1990, 214) is
      toegelaten tot de uitoefening van de diergeneeskunde;




                  h. gekwalificeerde dierenarts


                  :


                  een in het register Identificatie en Registratie paardendierenarts van de Stichting Veterinair
      Administratie Kantoor ingeschreven dierenarts;




                  i. paardenpaspoortconsulent


                  :


                  een door de voorzitter aangewezen persoon die in het bezit is van een getuigschrift van het met
      goed gevolg afgelegd hebben van het afsluitend examen van de onder auspiciën van het productschap georganiseerde
      opleiding paardenpaspoortconsulent, en beroepsmatig ten minste 50 transponders per jaar implanteert;




                  j. paspoort


                  :


                  het identificatiedocument als bedoeld in artikel 3, derde lid, onder a, van Verordening (EG) Nr.
      504/2008;




                  k. natuurterrein


                  :


                  een door de voorzitter als zodanig aangewezen gebied, waarbij de voorzitter zich bij de beoordeling
      daarvoor richt op de Leidraad Grote Grazers (kamerstukken II 1999/2000, 26 800, nr. 85).


      [ref1]: https://wetten.overheid.nl/BWBR0006862
      [ref2]: https://wetten.overheid.nl/BWBR0004730
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006862
      - id: ref2
        bwb_id: BWBR0004730
  - number: '2.1'
    text: 'Het is verboden paardachtigen te houden, te vervoeren of te doen vervoeren, tenzij zij:'
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel2
  - number: 2.1.a
    text: vergezeld gaan van een paspoort;
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel2
  - number: 2.1.b
    text: zijn voorzien van een transponder, en
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel2
  - number: 2.1.c
    text: zijn geregistreerd in een daarvoor bestemde database,
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel2
  - number: '2.2'
    text: 'Het in het eerste lid bepaalde geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel2
  - number: 2.2.a
    text: paardachtigen die op een natuurterrein leven, tenzij zij het betreffende natuurterrein verlaten;
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel2
  - number: 2.2.b
    text: paardachtigen jonger dan 6 maanden, tenzij zij voor export of slachting worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel2
  - number: '3.1'
    text: |-
      De in [artikel 2, tweede lid, onder a][ref1], bedoelde natuurterreinen worden door de voorzitter bij besluit
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0026239#Artikel2
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026239
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: Het besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel3
  - number: '4'
    text: |-
      Transponders worden met inachtneming van het bepaalde in Verordening (EG) Nr. 504/2008 en het bepaalde bij of
      krachtens deze verordening geïmplanteerd.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel4
  - number: '5'
    text: |-
      Het is verboden de in hoofdstuk IX, deel II, van het paspoort eenmaal bepaalde bestemming van de paardachtige
      inhoudende niet bestemd voor de slacht voor menselijke consumptie, te wijzigen.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel5
  - number: '6.1'
    text: |-
      Het paspoort wordt door het bestuur uitgegeven. Hiertoe gemandateerde erkende instellingen en hippische
      sportorganisaties dragen namens het bestuur zorg voor de uitgifte van het paspoort.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel6
  - number: '6.2'
    text: De in het eerste lid bedoelde mandatering geschiedt bij afzonderlijk besluit van het bestuur.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel6
  - number: '6.3'
    text: |-
      Bij het in het tweede lid bedoelde besluit wijst het bestuur de functionarissen van de erkende instellingen en
      hippische sportorganisaties aan die worden gemandateerd om de paspoortaanvragen te beoordelen en paspoorten uit
      te geven.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel6
  - number: '6.4'
    text: |-
      Het bestuur stelt bij afzonderlijk besluit een protocol vast, waarin door de erkende instellingen en hippische
      sportorganisaties in acht te nemen nadere voorschriften worden gegeven ter zake van het uitgeven van paspoorten.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel6
  - number: '6.5'
    text: De in het tweede en vierde lid bedoelde besluiten worden gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel6
  - number: '7.1'
    text: |-
      Het paspoort wordt door de houder aangevraagd door indiening van een door een gekwalificeerde dierenarts
      of paardenpaspoortconsulent volledig en naar waarheid ingevuld en ondertekend aanvraagformulier dat mede is
      ondertekend door de houder.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel7
  - number: '7.2'
    text: |-
      Het aanvraagformulier voor een paspoort wordt uiterlijk 7 dagen na de dag waarop de transponder is geïmplanteerd,
      door de houder ingediend:
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel7
  - number: 7.2.a
    text: |-
      in het geval het een geregistreerde paardachtige betreft: bij de erkende instelling waar de paardachtige is
      geregistreerd;
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel7
  - number: 7.2.b
    text: |-
      in het geval het een andere dan een geregistreerde paardachtige betreft: naar keuze van de aanvrager, bij één van
      de in [artikel 6, eerste lid][ref1], bedoelde erkende instellingen of hippische sportorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0026239#Artikel6
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026239
        artikel: '6'
        paragraaf: '3'
  - number: '7.3'
    text: |-
      Het bestuur stelt bij besluit de gegevens vast, die ten minste in het in het eerste lid bedoelde aanvraagformulier
      worden opgenomen. Het besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel7
  - number: '7.4'
    text: |-
      Behoudens het bepaalde in [artikel 10][ref1], wordt niet meer dan éénmaal een paspoort voor dezelfde paardachtige
      aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0026239#Artikel10
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026239
        artikel: '10'
        paragraaf: '3'
  - number: '8.1'
    text: |-
      Voor het paspoort is een vergoeding verschuldigd. De hoogte van de vergoeding wordt bij besluit van de voorzitter
      vastgesteld. Het besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel8
  - number: '8.2'
    text: |-
      Het paspoort wordt niet eerder in handen gesteld van de aanvrager dan nadat de vergoeding aan de in
      [artikel 6, eerste lid][ref1], bedoelde erkende instelling of hippische sportorganisatie is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0026239#Artikel6
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026239
        artikel: '6'
        paragraaf: '3'
  - number: '9.1'
    text: Het model van het paspoort is opgenomen in de bijlage.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel9
  - number: '9.2'
    text: |-
      In het paspoort worden geen wijzigingen of aantekeningen aangebracht, behoudens de aantekeningen ingevolge
      Verordening (EG) Nr. 504/2008 en deze verordening.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel9
  - number: '9.3'
    text: |-
      Indien in strijd met het bepaalde in het tweede lid, in het paspoort wijzigingen of aantekeningen zijn aangebracht,
      is het paspoort ongeldig voor de identificatiedoeleinden als bedoeld in [artikel 2, eerste lid, onder a][ref1]. Het
      ongeldige paspoort kan op last van de voorzitter worden ingenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0026239#Artikel2
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026239
        artikel: '2'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Indien het paspoort is kwijtgeraakt, kan op aanvraag en overeenkomstig het bepaalde in artikel 16 en 17 van
      Verordening (EG) Nr. 504/2008, een duplicaatpaspoort of een vervangend paspoort worden uitgegeven.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel10
  - number: '10.2'
    text: |-
      De in het eerste lid bedoelde aanvraag wordt door de houder ingediend bij de ingevolge de artikelen 16 en 17 van
      Verordening (EG) Nr. 504/2008 bepaalde paspoortuitgevende instantie.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel10
  - number: '10.3'
    text: |-
      Behoudens in het in het eerste lid van dit artikel genoemde geval en overeenkomstig de in het eerste en vierde
      lid bedoelde voorschriften, wordt geen duplicaat paspoort of vervangend paspoort uitgegeven. Een in strijd met het
      voorgaande uitgegeven duplicaat paspoort of vervangend paspoort is ongeldig en kan op last van de voorzitter worden
      ingenomen.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel10
  - number: '10.4'
    text: |-
      Het bestuur stelt bij besluit nadere voorschriften vast ter zake van het uitgeven van een duplicaatpaspoort en een
      vervangend paspoort. Het besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel10
  - number: '11.1'
    text: |-
      Indien het paspoort op grond van de in artikel 14, derde lid, van Verordening (EG) Nr. 504/2008, aan de
      in [artikel 6, eerste lid][ref1], bedoelde erkende instelling of hippische sportorganisatie of aan de in
      Verordening (EG) Nr. 504/2008 bedoelde bevoegde autoriteit is overgedragen, wordt overeenkomstig genoemd
      [artikel 14, derde lid][ref2], een tijdelijk document verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0026239#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0026239#Artikel14
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0026239
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0026239
        artikel: '14'
        paragraaf: '5'
  - number: '11.2'
    text: |-
      Bij het besluit bedoeld in [artikel 10, vierde lid][ref1], stelt het bestuur nadere voorschriften vast ter zake van
      het uitgeven van een tijdelijk document.


      [ref1]: https://wetten.overheid.nl/BWBR0026239#Artikel10
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0026239
        artikel: '10'
        paragraaf: '3'
  - number: '12.1'
    text: |-
      Het ingevolge het eerste lid, onder b, van artikel 19 van Verordening (EG) Nr. 504/2008, ongeldig gemaakte
      paspoort wordt onder verwijzing naar artikel 19, vierde lid, van Verordening (EG) Nr. 504/2008, door de in het
      tweede lid van bedoeld artikel genoemde persoon of instantie teruggestuurd naar de erkende instelling of hippische
      sportorganisatie die het paspoort heeft uitgegeven.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel12
  - number: '12.2'
    text: |-
      In andere gevallen dan de in het eerste lid bedoelde gevallen, stuurt de houder op de voet van artikel 19, vijfde
      lid, van Verordening (EG) Nr. 504/2008, het paspoort terug naar de erkende instelling of hippische sportorganisatie
      die het heeft uitgegeven.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel12
  - number: '12.3'
    text: |-
      Het bestuur kan bij besluit de procedure vaststellen voor het terugsturen van paspoorten als bedoeld in het eerste
      lid. Het besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel12
  - number: '13.1'
    text: |-
      De transponder wordt aan de linkerkant van de hals van de paardachtige en met inachtneming van het bepaalde in het
      tweede en derde lid, geïmplanteerd door een dierenarts of door een paardenpaspoortconsulent.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel13
  - number: '13.2'
    text: |-
      In aanvulling op het bepaalde in artikel 2, tweede lid, onder b), van Verordening (EG) Nr. 504/2008, begint het
      transpondernummer van de transponder met de landencode van Nederland, zijnde 528.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel13
  - number: '13.3'
    text: |-
      Het bestuur stelt bij besluit een protocol vast, waarin in aanvulling op het bepaalde in artikel 11, van
      Verordening (EG) Nr. 504/2008, voorschriften worden gegeven ter zake van het implanteren van transponders. Het
      besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel13
  - number: '14.1'
    text: |-
      De in artikel 21, eerste lid, onder a en f, van Verordening (EG) Nr. 504/2008 te registreren gegevens worden door
      de in [artikel 6, eerste lid][ref1], bedoelde erkende instelling of hippische sportorganisatie binnen een maand na
      het opnemen daarvan en binnen een maand na aanvulling op of wijziging van die gegevens doorgegeven aan een door de
      voorzitter bij besluit aangewezen databank onder zijn beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0026239#Artikel6
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0026239
        artikel: '6'
        paragraaf: '3'
  - number: '14.2'
    text: |-
      De voorzitter geeft de in het eerste lid bedoelde erkende instelling of hippische sportorganisatie aanwijzingen ter
      zake van de registratie en de periodieke doorgifte van gegevensbestanden.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel14
  - number: '15'
    text: |-
      Op overtreding van het bepaalde in de [artikelen 7, eerste en tweede lid][ref1], [9, tweede lid][ref2],
      [10, derde lid][ref3] en [12][ref4], worden tuchtrechtelijke maatregelen gesteld zoals voorzien in de
      [Wet tuchtrechtspraak bedrijfsorganisatie 2004][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0026239#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0026239#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0026239#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0026239#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0016341
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026239
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0026239
        artikel: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0026239
        artikel: '10'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0026239
        artikel: '12'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0016341
  - number: '16'
    text: |-
      De [Verordening identificatie en registratie van paardachtigen (PVV) 2004][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015767
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0015767
  - number: '17.1'
    text: De verordening treedt in werking met ingang van 1 juli 2009.
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel17
  - number: '17.2'
    text: 'De verordening wordt aangehaald als: Verordening identificatie en registratie van paardachtigen (PVV) 2009.'
    url: https://wetten.overheid.nl/BWBR0026239/2009-07-01#Artikel17
