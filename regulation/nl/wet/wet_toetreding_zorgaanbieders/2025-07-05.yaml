      1 Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van het bepaalde bij of krachtens de
      [artikelen 2, eerste lid][ref1], en [4, eerste en tweede lid][ref2].

      2 De op grond van het eerste lid vast te stellen bestuurlijke boete bedraagt voor een overtreding van
      [artikel 2, eerste lid][ref3], ten hoogste het bedrag dat is vastgesteld voor de vierde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref4].

      3 De op grond van het eerste lid vast te stellen bestuurlijke boete bedraagt voor een overtreding van het bepaalde
      bij of krachtens [artikel 4, eerste en tweede lid][ref5], ten hoogste het bedrag dat is vastgesteld voor de vijfde
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref6].


