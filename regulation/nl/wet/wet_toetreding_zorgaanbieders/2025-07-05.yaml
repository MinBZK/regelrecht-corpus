  - number: '16'
    text: |-
      1 Ten aanzien van aanvragen voor een toelating en bezwaar en beroep tegen een besluit dat op grond van
      [artikel 5, eerste lid, van de Wet toelating zorginstellingen][ref1] is genomen voor het tijdstip van
      inwerkingtreding van deze wet, is het recht zoals dat gold voorafgaand aan het tijdstip van inwerkingtreding
      van deze wet van toepassing. Indien naar aanleiding van de aanvraag of dat bezwaar of beroep de toelating wordt
      verleend is [artikel 14][ref2] van overeenkomstige toepassing.

      2 Indien op het tijdstip van inwerkintreding van deze wet nog beroep kon worden ingesteld of beroep was ingesteld
      tegen een besluit dat op grond van [artikel 5, eerste lid, van de Wet toelating zorginstellingen][ref3] is genomen,
      blijft de Afdeling bestuursrechtspraak van de Raad van State bevoegd om beroepen te behandelen.


