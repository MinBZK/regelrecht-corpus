      1 Onze Minister verstrekt aan de Wlz-uitvoerders als bedoeld in de [Wet langdurige zorg][ref1] respectievelijk
      de zorgverzekeraars als bedoeld in de [Zorgverzekeringswet][ref2] met het oog op de vervulling van hun bij
      of krachtens de Wet langdurige zorg of de Zorgverzekeringswet geregelde taken respectievelijk de uit hun
      zorgverzekeringen voortvloeiende verplichtingen het nummer van inschrijving bij de Kamer van Koophandel van de
      zorgaanbieder die een melding als bedoeld in [artikel 2, eerste lid][ref3], heeft gedaan.

      2 Het eerste lid is van overeenkomstige toepassing op zorgaanbieders aan wie een toelatingsvergunning is verleend
      of van wie de toelatingsvergunning wordt ingetrokken.


