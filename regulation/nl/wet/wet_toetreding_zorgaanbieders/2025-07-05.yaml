    text: |-
      1 De kosten die samenhangen met het in behandeling nemen van de aanvraag en de afgifte van de toelatingsvergunning
      worden ten laste gebracht van de aanvrager van de toelatingsvergunning.

      2 De hoogte van de kosten wordt bij ministeriële regeling vastgesteld. Daarbij kan onderscheid worden gemaakt
      tussen verschillende categorieën van zorgaanbieders.
    url: https://wetten.overheid.nl/BWBR0043797/2025-07-05#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister kan de toelatingsvergunning intrekken, indien:

      a. de zorgaanbieder gedurende een jaar de bij of krachtens [artikel 4][ref1] bedoelde zorg of dienst niet heeft
      verleend of heeft doen verlenen;

      b. de zorgaanbieder ophoudt te bestaan of diens bestuursstructuur aanzienlijk wijzigt;

      c. niet wordt voldaan aan de eisen, bedoeld in [artikel 5, tweede lid, onderdelen a, b, c of d, of derde lid][ref2];

      d. [artikel 35, eerste, tweede, zesde of zevende lid, van de Wet marktordening gezondheidszorg][ref3] is
      overtreden; of

      e. de zorgaanbieder onjuiste gegevens heeft verstrekt terwijl op grond van de juiste gegevens de
      toelatingsvergunning zou zijn geweigerd.

      2 Onze Minister kan de toelatingsvergunning intrekken, indien de zorgaanbieder in bij of krachtens algemene
      maatregel van bestuur aangewezen gevallen op verzoek van Onze Minister geen verklaring omtrent het gedrag als
      bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref4] kan verstrekken ten behoeve van
      een rechtspersoon als bedoeld in [artikel 1, onderdeel d, van die wet][ref5] of een natuurlijke persoon die behoort
      tot een van de bij of krachtens algemene maatregel van bestuur aangewezen categorieën van natuurlijke personen. De
      verklaring is niet ouder dan 3 maanden.

      3 Een toelatingsvergunning kan voorts door Onze Minister worden ingetrokken, indien er sprake is van het geval
      en onder de voorwaarden, bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen][ref6] door het
      openbaar bestuur. [Artikel 5, zesde lid][ref7], is van overeenkomstige toepassing.


