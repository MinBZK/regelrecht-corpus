  - number: '4'
    text: |-
      1 Een instelling beschikt over een toelatingsvergunning van Onze Minister voor zover deze:

      a. medisch specialistische zorg verleent of doet verlenen, of

      b. zorg of een andere dienst als omschreven bij of krachtens de [Wet langdurige zorg][ref1] of de
      [Zorgverzekeringswet][ref2] verleent of doet verlenen.

      2 Bij algemene maatregel van bestuur kunnen categorieën van zorgaanbieders worden aangewezen die eveneens over een
      toelatingsvergunning dienen te beschikken. De voordracht voor deze algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.

      3 De indiening van de aanvraag om een toelatingsvergunning geschiedt op een bij ministeriële regeling vastgestelde
      wijze. Bij die ministeriële regeling kunnen nadere regels worden gesteld over de bij de aanvraag te verstrekken
      bescheiden en gegevens. Deze nadere regels hebben in ieder geval betrekking op eisen omtrent de bedrijfsvoering
      en de bestuursstructuur, alsmede voorwaarden voor een goede kwaliteit van zorg, en kunnen per categorie van
      zorgaanbieders verschillen.

      4 Bij algemene maatregel van bestuur kunnen categorieën van zorgaanbieders worden aangewezen waarop het eerste lid
      niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0043797/2025-07-05#Artikel4
