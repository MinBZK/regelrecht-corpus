    text: |-
      Onze Minister kan persoonsgegevens, waaronder persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] verwerken voor zover die
      verwerking noodzakelijk is voor de weigering dan wel de intrekking van de toelatingsvergunning.


