    text: |-
      Een instelling die op het moment van inwerkingtreding van
      [artikel VIIIa, onderdeel A, van de Verzamelwet VWS 2023][ref1], ingevolge dit artikel voor het eerst over een
      toelatingsvergunning als bedoeld in [artikel 4, eerste lid][ref2], moet beschikken, verkrijgt van rechtswege een
      toelatingsvergunning.


