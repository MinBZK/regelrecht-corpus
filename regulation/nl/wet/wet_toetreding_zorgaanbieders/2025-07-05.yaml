  - number: '2'
    text: |-
      1 De zorgaanbieder die zorg als bedoeld bij of krachtens de [Wet kwaliteit, klachten en geschillen zorg][ref1] wil
      gaan verlenen of laten verlenen, zorgt ervoor dat de verlening van die zorg niet eerder aanvangt dan nadat hij dit
      aan Onze Minister heeft gemeld.

      2 De melding geschiedt langs elektronische weg op een bij ministeriële regeling vastgestelde wijze.
      De daarbij door de zorgaanbieder te verstrekken gegevens kunnen per categorie van zorgaanbieders
      verschillen en hebben betrekking op de aard van de te verlenen zorg, de personele en materiële
      organisatorische inrichting en voorwaarden betreffende kwaliteit van zorg, waaronder het bepaalde in
      [artikel 2, tweede lid, onderdeel b, van de Wet kwaliteit, klachten en geschillen zorg][ref2].

      3 Bij algemene maatregel van bestuur kunnen categorieën van zorgaanbieders worden aangewezen waarop het eerste lid
      niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0037173
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel2
