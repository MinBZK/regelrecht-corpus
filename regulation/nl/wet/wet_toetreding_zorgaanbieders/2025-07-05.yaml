  - number: '5'
    text: |-
      1 Onze Minister weigert de toelatingsvergunning indien de krachtens [artikel 4, derde lid][ref1], te verstrekken
      bescheiden en gegevens niet volledig worden aangeleverd.

      2 Onze Minister weigert de toelatingsvergunning voorts indien aannemelijk is dat niet zal worden voldaan aan de
      volgende eisen voor zover deze op de instelling van toepassing zijn:

      a. de bij of krachtens [artikel 3][ref2] gestelde eisen;

      b. de bij de [artikelen 3][ref3], [7][ref4] en
      [9, tweede lid, van de Wet kwaliteit, klachten en geschillen zorg][ref5] gestelde eisen;

      c. de bij [artikel 40a, eerste, tweede en vierde lid, van de Wet marktordening gezondheidszorg][ref6] gestelde
      eisen;

      d. de bij [artikel 3, eerste lid, van de Wet medezeggenschap cliënten zorginstellingen 2018][ref7] gestelde eis;

      e. het bepaalde in [artikel 35, eerste, tweede, zesde of zevende lid, van de Wet marktordening gezondheidszorg][ref8].

      3 Onze Minister weigert de toelatingsvergunning voorts indien de zorgaanbieder behoort tot een bij algemene
      maatregel van bestuur aangewezen categorie van zorgaanbieders en aannemelijk is dat niet zal worden voldaan aan
      de bij algemene maatregel van bestuur gestelde voorwaarden met betrekking tot de bij die maatregel aangewezen
      kwaliteitsstandaard als bedoeld in [artikel 1, onderdeel z, van de Zorgverzekeringswet][ref9].

      4 Onze Minister kan de toelatingsvergunning weigeren, indien de zorgaanbieder in bij of krachtens algemene
      maatregel van bestuur aangewezen gevallen op verzoek van Onze Minister geen verklaring omtrent het gedrag als
      bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref10] kan verstrekken ten behoeve
      van een rechtspersoon als bedoeld in [artikel 1, onderdeel d, van die wet][ref11] of een natuurlijke persoon die
      behoort tot een van de bij of krachtens algemene maatregel van bestuur aangewezen categorieën van natuurlijke
      personen. De verklaring is niet ouder dan 3 maanden.

      5 Onze Minister kan de toelatingsvergunning voorts weigeren in geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref12].

      6 Voordat toepassing wordt gegeven aan het vijfde lid, kan het Bureau
      bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref13], om een advies als
      bedoeld in [artikel 9 van die wet][ref14] worden gevraagd.


