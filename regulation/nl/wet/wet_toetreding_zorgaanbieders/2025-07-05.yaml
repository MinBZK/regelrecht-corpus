preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat elke nieuwe zorgaanbieder zich meldt voordat hij
    aanvangt met de zorgverlening, zodat het toezicht op nieuwe zorgaanbieders effectiever kan worden vormgegeven en
    wordt gewaarborgd dat de zorgaanbieder vooraf kennis heeft genomen van de eisen die gelden vanaf het moment waarop
    hij zorg gaat verlenen en voorts dat het wenselijk is dat bepaalde zorgaanbieders die een instelling zijn een
    vergunning aanvragen waarbij, naast eisen omtrent de bedrijfsvoering en de bestuursstructuur, ook gekeken wordt
    naar voorwaarden voor een goede kwaliteit van zorg;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043797/2025-07-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *instelling:* rechtspersoon die bedrijfsmatig zorg verleent of doet verlenen, organisatorisch verband van
      natuurlijke personen die bedrijfsmatig zorg verlenen of doen verlenen of natuurlijk persoon die bedrijfsmatig
      zorg doet verlenen, met uitzondering van een instelling die binnen het kader van de binnen een andere instelling
      verleende zorg een deel van die zorg verleent;
        - *medisch specialistische zorg:* bij ministeriële regeling aangewezen zorg die door
      een arts wordt verleend en valt binnen de bijzondere deskundigheid van artsen aan wie de
      bevoegdheid toekomt tot het voeren van een wettelijk erkende specialistentitel als bedoeld in
      [artikel 14 van de Wet op de beroepen in de individuele gezondheidszorg][ref1];
        - *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;
        - *solistisch werkende zorgverlener:* zorgverlener die, anders dan in dienst of onmiddellijk of middellijk in
      opdracht van een instelling, beroepsmatig zorg verleent;
        - *toelatingsvergunning:* vergunning als bedoeld in [artikel 4, eerste of tweede lid][ref2];
        - *zorgaanbieder:* instelling dan wel solistisch werkende zorgverlener;
        - *zorgverlener:* natuurlijke persoon die beroepsmatig zorg verleent.

      2 Voor de toepassing van de [artikelen 2][ref3] en [8, eerste lid][ref4], worden tevens als zorgaanbieder
      aangemerkt:

      a. een instelling die binnen het kader van de binnen een andere instelling verleende zorg een deel van die zorg
      verleent; en

      b. een zorgverlener die, anders dan in dienst van een instelling, middellijk of onmiddellijk in opdracht van een
      instelling beroepsmatig zorg verleent.


