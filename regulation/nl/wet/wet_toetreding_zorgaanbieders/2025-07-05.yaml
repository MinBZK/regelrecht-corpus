  - number: '14'
    text: |-
      1 Indien een instelling op het tijdstip van inwerkingtreding van deze wet in het bezit is van een toelating op
      grond van [artikel 5, eerste lid, van de Wet toelating zorginstellingen][ref1], zoals dat artikel luidde direct
      voorafgaand aan dat tijdstip, geldt die toelating als een toelatingsvergunning, indien deze instelling op grond van
      het bepaalde bij of krachtens [artikel 4][ref2] over een toelatingsvergunning dient te beschikken.

      2 Indien een instelling op het tijdstip van inwerkingtreding van deze wet in het bezit is van een toelating op
      grond van [artikel 5, eerste lid, van de Wet toelating zorginstellingen][ref3], zoals dat artikel luidde direct
      voorafgaand aan dat tijdstip, vervalt die toelating indien die instelling niet op grond van het bepaalde bij of
      krachtens [artikel 4][ref4] over een toelatingsvergunning dient te beschikken.


