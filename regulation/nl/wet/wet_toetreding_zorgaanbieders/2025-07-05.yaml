  - number: '3'
    text: |-
      1 Een zorgaanbieder die op grond van het bepaalde bij of krachtens [artikel 4][ref1] dient te beschikken over een
      toelatingsvergunning voldoet aan de volgende eisen omtrent de bestuursstructuur:

      a. er is een interne toezichthouder die toezicht houdt op het beleid van de dagelijkse of algemene leiding van
      de instelling en de algemene gang van zaken binnen de instelling en die de dagelijkse of algemene leiding van de
      instelling met raad ter zijde staat;

      b. een persoon maakt niet tegelijk deel uit van de interne toezichthouder en de dagelijkse of algemene leiding van
      de instelling;

      c. de interne toezichthouder is zodanig samengesteld dat de leden ten opzichte van elkaar, de dagelijkse of
      algemene leiding van de instelling en welk deelbelang dan ook onafhankelijk en kritisch kunnen opereren;

      d. de instelling legt op inzichtelijke wijze de verantwoordelijkheidsverdeling tussen de interne toezichthouder en
      de dagelijkse of algemene leiding vast, alsmede de wijze waarop interne conflicten tussen de interne toezichthouder
      en de dagelijkse of algemene leiding worden geregeld.

      2 Bij algemene maatregel van bestuur kunnen nadere eisen worden gesteld betreffende de bestuursstructuur
      waaraan een zorgaanbieder als bedoeld in het eerste lid moet voldoen. Deze nadere eisen kunnen per categorie van
      zorgaanbieders verschillen en hebben in ieder geval betrekking op:

      a. de waarborging van de onafhankelijke taakvervulling door de interne toezichthouder;

      b. de samenstelling van de interne toezichthouder;

      c. de verstrekking van inlichtingen en gegevens aan de interne toezichthouder;

      d. de taken of bevoegdheden van de interne toezichthouder.

      3 De instelling legt schriftelijk vast op welke wijze zij voldoet aan het bepaalde in het eerste en tweede lid.
      Hierover kunnen bij ministeriële regeling nadere regels worden gesteld die per categorie van zorgaanbieders kunnen
      verschillen.

      4 Bij algemene maatregel van bestuur kunnen categorieën van zorgaanbieders worden aangewezen waarop het eerste lid
      niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0043797#Artikel4
