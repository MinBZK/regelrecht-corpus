  - number: '15'
    text: |-
      1 Indien een instelling op het tijdstip van inwerkingtreding van deze wet op grond van
      [artikel 1, derde lid, van de Wet toelating zorginstellingen][ref1], zoals dat artikel luidde direct voorafgaand
      aan dat tijdstip, van rechtswege in het bezit is van een toelating, vraagt de instelling binnen twee jaar na
      inwerkingtreding van deze wet een toelatingsvergunning aan indien deze instelling op grond van het bepaalde bij of
      krachtens [artikel 4][ref2] over een toelatingsvergunning dient te beschikken.

      2 Indien een zorgaanbieder op het tijdstip van inwerkingtreding van deze wet niet in het bezit hoefde te zijn
      van een toelating op grond van [artikel 5, eerste lid, van de Wet toelating zorginstellingen][ref3], zoals dat
      artikel luidde direct voorafgaand aan dat tijdstip, doch vanaf het tijdstip van inwerkingtreding van deze wet
      over een toelatingsvergunning dient te beschikken, vraagt de zorgaanbieder die vergunning binnen twee jaar na
      inwerkingtreding van deze wet aan.

      3 Aan de aanvraag om een toelatingsvergunning zijn voor de zorgaanbieder, bedoeld in het eerste en tweede lid, in
      afwijking van [artikel 6][ref4], gedurende bedoelde twee jaar geen kosten verbonden.


