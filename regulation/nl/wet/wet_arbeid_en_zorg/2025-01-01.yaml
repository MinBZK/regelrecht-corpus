  - number: 1:4
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt met een collectieve arbeidsovereenkomst
      gelijkgesteld een regeling door of namens een daartoe bevoegd bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel14
  - number: 1:5
    text: |-
      Voor de toepassing van de [artikelen 4:7][ref1] en 5:16 geldt een afwijkende regeling door of namens een daartoe
      bevoegd bestuursorgaan of een afwijkende regeling waaromtrent de werkgever schriftelijk overeenstemming heeft
      bereikt met de ondernemingsraad, of bij het ontbreken daarvan, met de personeelsvertegenwoordiging, voor vijf jaren
      vanaf het tijdstip waarop die regeling ingaat, indien geen termijn van ten hoogste vijf jaren is bepaald. Indien
      geen termijn is bepaald gaat bij wijziging van de regeling waarvan de in de eerste zin bedoelde afwijking deel
      uitmaakt binnen het in die zin bedoelde tijdvak, ten aanzien van de afwijking een nieuw tijdvak in op het tijdstip
      van inwerkingtreding van de wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel47
