  - number: 3:9
    text: |-
      1 De gelijkgestelde heeft in verband met de adoptie van een kind recht op uitkering.

      2 Het recht op uitkering in verband met adoptie bedraagt ten hoogste zes aaneengesloten weken gedurende een tijdvak
      van zesentwintig weken. Het tijdvak van zesentwintig weken gaat in vier weken vóór de eerste dag dat de feitelijke
      opneming ter adoptie een aanvang heeft genomen of zal nemen, zoals die dag is aangeduid in een door de werknemer
      aan de werkgever overgelegd document waaruit blijkt dat een kind ter adoptie is of zal worden opgenomen.

      3 Indien als gevolg van een adoptieverzoek tegelijkertijd twee of meer kinderen feitelijk ter adoptie worden
      opgenomen, bestaat het recht op uitkering slechts ten aanzien van één van die kinderen.

      4 Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op de werknemer die een pleegkind opneemt als
      bedoeld in [artikel 5:1, tweede lid, onder d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel51
