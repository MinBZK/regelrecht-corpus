  - number: 5:16
    text: |-
      Van dit hoofdstuk kan uitsluitend ten nadele van de werknemer worden afgeweken bij collectieve arbeidsovereenkomst
      of bij regeling door of namens een daartoe bevoegd bestuursorgaan dan wel, indien geen collectieve
      arbeidsovereenkomst of regeling van toepassing is of terzake geen bepaling bevat, indien de werkgever terzake
      schriftelijke overeenstemming heeft bereikt met de ondernemingsraad of bij het ontbreken daarvan, met de
      personeelsvertegenwoordiging met dien verstande dat de werknemer bij afwijking van [artikel 5:2][ref1] in elke
      periode van 12 achtereenvolgende maanden ten minste recht houdt op eenmaal de arbeidsduur per week en bij afwijking
      van [artikel 5:15][ref2] ten minste recht houdt op het wettelijke minimum aan vakantie-aanspraken.


