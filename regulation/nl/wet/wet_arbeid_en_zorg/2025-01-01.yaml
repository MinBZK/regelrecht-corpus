  - number: 3:11
    text: |-
      1 De vrouwelijke werknemer of gelijkgestelde, die in aanmerking wenst te komen voor toekenning van een
      uitkering in verband met zwangerschap en bevalling doet de aanvraag daartoe door tussenkomst van de werkgever
      bij het Uitvoeringsinstituut werknemersverzekeringen uiterlijk twee weken voor de datum van ingang van het
      zwangerschapsverlof onderscheidenlijk de datum waarop zij het recht op uitkering wil laten ingaan. Bij die aanvraag
      wordt gemeld:

      a. de vermoedelijke datum van bevalling;

      b. de datum waarop het zwangerschapsverlof ingaat dan wel de datum waarop de gelijkgestelde het recht op uitkering
      wil laten ingaan.

      Indien het bevallingsverlof van de vrouwelijke werknemer of het recht op uitkering van de vrouwelijke
      werknemer of gelijkgestelde wordt verlengd op grond van [artikel 3:1, vijfde lid][ref1], onderscheidenlijk
      [3:8, vijfde lid][ref2], brengt de werkgever het Uitvoeringsinstituut werknemersverzekeringen daarvan op de hoogte.
      De werkgever verstrekt aan het Uitvoeringsinstituut werknemersverzekeringen de op verzoek van de vrouwelijke
      werknemer of gelijkgestelde door het ziekenhuis af te geven verklaring, bedoeld in [artikel 3:3, tweede lid][ref3].

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan de vrouwelijke werknemer of gelijkgestelde, uiterlijk binnen
      een jaar na het tijdstip waarop de uitkering geëindigd is, een verklaring vragen van een arts of verloskundige
      over de vermoedelijke datum van bevalling, welke is opgemaakt uiterlijk twee weken voor de datum van ingang van het
      zwangerschapsverlof onderscheidenlijk twee weken voor de datum waarop de vrouwelijke werknemer of gelijkgestelde
      het recht op uitkering wil laten ingaan.

      3 De werknemer of gelijkgestelde, die in aanmerking wenst te komen voor toekenning van een uitkering in verband
      met adoptie of pleegzorg, doet de aanvraag daartoe door tussenkomst van de werkgever bij het Uitvoeringsinstituut
      werknemersverzekeringen uiterlijk twee weken voor de datum van ingang van het verlof in verband met adoptie of
      pleegzorg onderscheidenlijk de datum waarop hij het recht op uitkering wil laten ingaan. Bij de aanvraag worden
      documenten gevoegd waaruit blijkt dat een kind ter adoptie of pleegzorg is of zal worden opgenomen en wanneer die
      opneming ter adoptie of pleegzorg heeft plaatsgevonden of zal plaatsvinden. Bij die aanvraag wordt de datum waarop
      het verlof in verband met adoptie of pleegzorg ingaat gemeld dan wel de datum waarop hij het recht op uitkering wil
      laten ingaan.

      4 Indien de aanvraag niet tijdig wordt gedaan, wordt de uitkering uitsluitend toegekend voor zover het tijdvak
      waarin sprake was van recht op uitkering in verband met zwangerschap en bevalling, adoptie of pleegzorg, valt in
      het jaar voorafgaand aan de datum van aanvraag. Het Uitvoeringsinstituut werknemersverzekeringen kan in bijzondere
      gevallen ten gunste van de werknemer of gelijkgestelde afwijken van de eerste zin.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel33
