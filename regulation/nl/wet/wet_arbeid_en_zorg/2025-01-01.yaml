preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels vast te stellen, waarin een nieuw evenwicht tot
    stand wordt gebracht tussen arbeid en zorg in de ruimste zin;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      Tenzij anders is bepaald, wordt voor de toepassing van deze wet verstaan onder:

      a. werkgever: degene die een ander krachtens arbeidsovereenkomst naar burgerlijk recht of publiekrechtelijke
      aanstelling arbeid laat verrichten;

      b. werknemer: de ander, bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel11
  - number: 1:2
    text: |-
      1 Tenzij anders is bepaald, wordt voor de toepassing van deze wet verstaan onder loon: de naar tijdruimte
      vastgestelde vergoeding die de werkgever aan de werknemer verschuldigd is voor de bedongen arbeid.

      2 Voor de toepassing van deze wet wordt, indien het loon op andere wijze dan naar tijdruimte is vastgesteld, als
      loon beschouwd het gemiddelde loon dat de werknemer, wanneer hij geen gebruik had gemaakt van een door deze wet
      gegeven recht op verlof, gedurende die tijd had kunnen verdienen.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel12
  - number: 1:3
    text: |-
      1 Voor de toepassing van deze wet wordt verstaan onder:

      a. Arbeidsongeschiktheidsfonds: het fonds, bedoeld in
      [artikel 112 van de Wet financiering sociale verzekeringen][ref1];

      b. Algemeen Werkloosheidsfonds: het fonds, bedoeld in
      [artikel 93 van de Wet financiering sociale verzekeringen][ref2];

      c. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];

      d. militaire ambtenaar: de militaire ambtenaar, bedoeld in
      [artikel 1, eerste en tweede lid, van de Wet ambtenaren defensie][ref4];

      e. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid.

      2 Voor de toepassing van deze wet is sprake van ongehuwd samenwonen als twee ongehuwde personen een gezamenlijke
      huishouding voeren. Van een gezamenlijke huishouding als bedoeld in de eerste volzin is sprake indien de
      betrokkenen hun hoofdverblijf hebben in dezelfde woning en blijk geven zorg te dragen voor elkaar door middel van
      het leveren van een bijdrage in de kosten van de huishouding danwel op andere wijze in elkaars verzorging voorzien.

      3 Voor de toepassing van deze wet wordt verstaan onder levensbedreigend ziek: de gezondheidssituatie die zo ernstig
      is dat volgens objectieve medische maatstaven het leven van de persoon op korte termijn ernstig gevaar loopt.

      4 Voor de toepassing van deze wet wordt verstaan onder hulpbehoevend: de toestand van een persoon waardoor deze ten
      behoeve van zelfredzaamheid, participatie, beschermd wonen of opvang hulp nodig heeft die niet in het kader van een
      hulpverlenend beroep wordt geboden en die de gebruikelijke hulp overstijgt.


