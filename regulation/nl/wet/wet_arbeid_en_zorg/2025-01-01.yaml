  - number: 4:2
    text: |-
      1 Na de bevalling van de echtgenote, de geregistreerde partner, de persoon met wie de werknemer ongehuwd samenwoont
      of degene van wie de werknemer het kind erkent, heeft de werknemer gedurende een tijdvak van vier weken, te rekenen
      vanaf de eerste dag na de bevalling, recht op geboorteverlof met behoud van loon van eenmaal de arbeidsduur per
      week.

      2 Indien de arbeidsovereenkomst of de publiekrechtelijke aanstelling wordt beëindigd voordat het geboorteverlof
      volledig is genoten, heeft de werknemer, indien hij een nieuwe arbeidsovereenkomst of publiekrechtelijke
      aanstelling aangaat, tegenover de nieuwe werkgever aanspraak op het verlof dat nog niet is opgenomen, met
      inachtneming van dit hoofdstuk.

      3 Indien de arbeidsovereenkomst of publiekrechtelijke aanstelling wordt beëindigd, is de werkgever verplicht aan
      de werknemer, op diens verzoek, een verklaring uit te reiken waaruit blijkt op hoeveel geboorteverlof de werknemer
      aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel42
  - number: 4:2a
    text: |-
      1 Nadat de werknemer het geboorteverlof, bedoeld in [artikel 4:2][ref1], heeft opgenomen, heeft hij gedurende een
      tijdvak van zes maanden, te rekenen vanaf de eerste dag na de bevalling, recht op aanvullend geboorteverlof zonder
      behoud van loon.

      2 Het aanvullend geboorteverlof bedraagt ten hoogste vijf gehele weken gebaseerd op de arbeidsduur per week.

      3 [Artikel 4:2, tweede en derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel42
