  - number: 3:13
    text: |-
      1 De uitkering, bedoeld in deze paragraaf, bedraagt per dag het dagloon.

      2 Voor de berekening van de uitkering waarop op grond van deze paragraaf recht bestaat, wordt als dagloon
      beschouwd 1/261 deel van het loon, bedoeld in [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref1],
      dat de werknemer of de gelijkgestelde, bedoeld in [artikel 3:6][ref2], dan wel de betrokkene, bedoeld in
      [artikel 3:10][ref3], in de periode van één jaar, die eindigt op de laatste dag van het tweede aangiftetijdvak
      voorafgaande aan het aangiftetijdvak waarin het recht op uitkering op grond van deze paragraaf is ontstaan,
      verdiende in de dienstbetrekking waaruit dat recht is ontstaan, doch ten hoogste het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref4], met betrekking tot een loontijdvak
      van een dag.

      3 In afwijking van het tweede lid, wordt, indien de gelijkgestelde, bedoeld in [artikel 3:6, eerste lid][ref5],
      direct voorafgaand aan het recht op uitkering op grond van deze wet of de betrokkene, bedoeld in
      [artikel 3:10][ref6], voorafgaand aan het recht op uitkering op grond van deze wet, een recht op uitkering heeft
      gehad op grond van de [Ziektewet][ref7], de [Werkloosheidswet][ref8], met uitzondering van [artikel 18][ref9]
      en [hoofdstuk IV][ref10], of de [Wet werk en inkomen naar arbeidsvermogen][ref11], voor de hoogte van het dagloon
      uitgegaan van het dagloon zoals dat op grond van de Ziektewet, Werkloosheidswet, of Wet werk en inkomen naar
      arbeidsvermogen is vastgesteld en herzien.

      4 Bij algemene maatregel van bestuur worden ten aanzien van de vaststelling en de herziening van het dagloon,
      bedoeld in het tweede en derde lid, nadere en zo nodig afwijkende regels gesteld, onder meer over de vaststelling
      en herziening van het dagloon wanneer de dienstbetrekking in het tweede lid, korter heeft geduurd dan het
      jaar, bedoeld in dat lid en over de vaststelling van het dagloon voor de vrijwillig verzekerde, bedoeld in
      [artikel 3:6, tweede lid][ref12], van deze wet.

      5 Op een op grond van dit artikel vastgesteld dagloon, is [artikel 16 van de Ziektewet][ref13] van overeenkomstige
      toepassing.

      6 Indien het gaat om een werknemer waarvoor de werkgever loonkostensubsidie als bedoeld in
      [artikel 10d, eerste of tweede lid, van de Participatiewet][ref14] ontvangt en de werknemer recht heeft op een
      uitkering als bedoeld in [artikel 3:7, eerste lid][ref15], wordt de uitkering vermenigvuldigd met de voor die
      werknemer vastgestelde loonwaarde, bedoeld in [artikel 6, eerste lid, onderdeel g, van de Participatiewet][ref16].

      7 Voor de toepassing van het zesde lid wordt:

      a. indien de voor de werknemer vastgestelde loonwaarde lager is dan 30 procent, de loonwaarde gesteld op
      30 procent;

      b. indien de loonkostensubsidie, met toepassing van
      [artikel 10d, eerste lid, onderdeel b, van de Participatiewet][ref17] wordt verstrekt zonder dat de loonwaarde is
      vastgesteld, de loonwaarde gesteld op 50 procent.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het zesde en zevende lid.


