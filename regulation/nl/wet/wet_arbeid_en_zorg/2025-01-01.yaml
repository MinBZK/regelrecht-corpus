  - number: 4:1
    text: |-
      1 De werknemer heeft recht op verlof met behoud van loon voor een korte, naar billijkheid te berekenen tijd,
      wanneer hij zijn arbeid niet kan verrichten wegens:

      a. onvoorziene omstandigheden die een onmiddellijke onderbreking van de arbeid vergen;

      b. zeer bijzondere persoonlijke omstandigheden;

      c. een door wet of overheid, zonder geldelijke vergoeding, opgelegde verplichting, waarvan de vervulling niet in
      zijn vrije tijd kon plaatsvinden;

      d. de uitoefening van het actief kiesrecht.

      2 Onder zeer bijzondere persoonlijke omstandigheden worden in ieder geval begrepen:

      a. de bevalling van de echtgenote, de geregistreerde partner of de persoon met wie de werknemer ongehuwd
      samenwoont;

      b. het overlijden en de lijkbezorging van een van zijn huisgenoten of een van zijn bloed- en aanverwanten in de
      rechte lijn en in de tweede graad van de zijlijn;

      c. spoedeisend, onvoorzien of redelijkerwijze niet buiten werktijd om te plannen arts- of ziekenhuisbezoek door de
      werknemer of de noodzakelijke begeleiding daarbij van de personen, bedoeld in [artikel 5:1][ref1];

      d. noodzakelijke verzorging op de eerste ziektedag van de personen, bedoeld in [artikel 5:1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel51
