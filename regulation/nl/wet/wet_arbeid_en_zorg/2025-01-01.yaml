    text: |-
      1 Het verlof eindigt met het verstrijken van de duur waarvoor het verlof is verleend.

      2 Indien voor het verstrijken van de in het eerste lid bedoelde verlofduur de persoon ten behoeve van wiens
      verzorging het verlof is verleend overlijdt, dan wel niet langer niet langer in een omstandigheid verkeert als
      bedoeld in [artikel 5:9][ref1], eindigt het verlof met ingang van de dag na die waarop deze omstandigheid zich
      heeft voorgedaan.


