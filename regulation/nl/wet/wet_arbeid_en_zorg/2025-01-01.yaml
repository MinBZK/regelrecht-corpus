  - number: 3:22
    text: |-
      1 De vrouwelijke zelfstandige of de vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst, die in aanmerking wenst
      te komen voor toekenning van een uitkering in verband met zwangerschap en bevalling, doet de aanvraag daartoe
      bij het Uitvoeringsinstituut werknemersverzekeringen uiterlijk twee weken voor de datum van ingang van het
      zwangerschapsverlof. Bij die aanvraag wordt gemeld:

      a. de vermoedelijke datum van bevalling;

      b. de datum waarop het zwangerschapsverlof, respectievelijk het recht op uitkering, bedoeld in
      [artikel 3:18, tweede lid][ref1], ingaat;

      c. of zij de uitkering wil genieten in de vorm van een uitkering ter zake van vervanging.

      2 Indien de aanvraag niet tijdig wordt gedaan, wordt de uitkering uitsluitend toegekend voor zover het tijdvak
      waarin sprake was van recht op uitkering in verband met zwangerschap en bevalling, valt in het jaar voorafgaand
      aan de aanvraag. Het Uitvoeringsinstituut werknemersverzekeringen kan in bijzondere gevallen ten gunste van de
      vrouwelijke zelfstandige of de vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst afwijken van de eerste zin.

      3 Het Uitvoeringsinstituut werknemersverzekeringen kan de vrouwelijke zelfstandige of vrouwelijke beroepsbeoefenaar
      op arbeidsovereenkomst, uiterlijk binnen een jaar na het tijdstip waarop de uitkering geëindigd is, een verklaring
      vragen van een arts of verloskundige over de vermoedelijke datum van bevalling, welke is opgemaakt uiterlijk twee
      weken voor de datum van ingang van het zwangerschapsverlof onderscheidenlijk twee weken voor de datum waarop de
      vrouwelijke zelfstandige of vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst het recht op uitkering wil laten
      ingaan.

      4 Het Uitvoeringsinstituut werknemersverzekeringen kan de werknemer, uiterlijk binnen een jaar na het tijdstip
      waarop de uitkering geëindigd is, een verklaring vragen van een arts of verloskundige over de vermoedelijke
      datum van bevalling, welke is opgemaakt uiterlijk twee weken voor de datum van ingang van het zwangerschapsverlof
      onderscheidenlijk twee weken voor de datum waarop de vrouwelijke werknemer het recht op uitkering wil laten ingaan.

      5 De aanvraag voor de uitkering, bedoeld in [artikel 3:18, tiende of elfde lid][ref2], doet de partner, bedoeld in
      [artikel 3:1a, tweede lid][ref3], uiterlijk twee weken na de datum van het overlijden bij het Uitvoeringsinstituut
      werknemersverzekeringen. Bij de aanvraag wordt een afschrift van de akte van overlijden van de moeder en van de
      akte van geboorte van het kind gevoegd.

      6 Het Uitvoeringsinstituut werknemersverzekeringen kan in bijzondere gevallen ten gunste van de partner, bedoeld in
      [artikel 3:1a, tweede lid][ref4], afwijken van de termijn bedoeld in het derde lid.

      7 De vrouwelijke zelfstandige, de vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst of de partner, bedoeld
      in [artikel 3:1a, tweede lid][ref5], die zelfstandige of beroepsbeoefenaar op arbeidsovereenkomst is of de
      persoon wiens arbeidsverhouding gelijk is gesteld met een dienstbetrekking als bedoeld in [artikel 4][ref6] of
      [5 van de Ziektewet][ref7] verstrekt in voorkomend geval aan het Uitvoeringsinstituut werknemersverzekeringen de
      verklaring, bedoeld in [artikel 3:3, tweede lid][ref8].


