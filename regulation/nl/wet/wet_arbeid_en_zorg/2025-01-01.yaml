  - number: 5:10
    text: |-
      Het verlof bedraagt in elke periode van twaalf achtereenvolgende maanden ten hoogste zesmaal de arbeidsduur per
      week. De periode van twaalf maanden gaat in op de eerste dag waarop het verlof wordt genoten.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel510
  - number: 5:11
    text: |-
      1 De werknemer dient het verzoek om verlof ten minste twee weken voor het beoogde tijdstip van ingang van
      het verlof schriftelijk in bij de werkgever onder opgave van de reden, de persoon die verzorging behoeft, het
      tijdstip van ingang, de omvang, de voorgenomen duur van het verlof en de spreiding van de uren over de week of het
      anderszins overeengekomen tijdvak.

      2 De werknemer verstrekt desgevraagd aan de werkgever schriftelijk aanvullende informatie waarover hij
      redelijkerwijs en op korte termijn kan beschikken teneinde aannemelijk te maken dat is voldaan aan de op grond
      van [artikel 5:9][ref1] geldende voorwaarden. De werkgever doet een schriftelijk verzoek tot het verstrekken van
      aanvullende informatie binnen een week nadat het verzoek om verlof bij hem is ingediend.

      3 De werkgever willigt het verzoek om verlof van de werknemer in, tenzij hij tegen het opnemen van het verlof een
      zodanig zwaarwegend bedrijfs- of dienstbelang heeft, dat het belang van de werknemer daarvoor naar maatstaven van
      redelijkheid en billijkheid moet wijken.

      4 Een werkgever die geen beroep doet op een zwaarwegend bedrijfs- of dienstbelang, kan dit nadien evenmin, tenzij
      het een militaire ambtenaar betreft.

      5 Indien de werkgever overweegt het verzoek om verlof niet of niet geheel in te willigen, pleegt hij overleg met
      de werknemer over diens verzoek. De beslissing op het verzoek om verlof wordt door de werkgever schriftelijk aan
      de werknemer medegedeeld. Indien de werkgever het verzoek niet of niet geheel inwilligt, wordt dit onder opgave van
      redenen aan de werknemer medegedeeld.

      6 Indien de werkgever niet een week voor het beoogde tijdstip van ingang van het verlof de beslissing op het
      verzoek schriftelijk heeft medegedeeld aan de werknemer, gaat het verlof in overeenkomstig het verzoek van de
      werknemer. Zolang de werknemer niet heeft voldaan aan een verzoek van de werkgever om informatie als bedoeld in het
      tweede lid, wordt de in de eerste volzin bedoelde periode verlengd met het aantal dagen dat de werknemer niet heeft
      voldaan aan het verzoek van de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel59
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel511
