      - id: ref2
        bwb_id: BWBR0013008
        artikel: 5:1
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '1'
  - number: 5:7
    text: |-
      1 Indien de werknemer op grond van enige wettelijk voorgeschreven verzekering of krachtens enige verzekering
      of uit enig fonds waarin de deelneming is overeengekomen bij of voortvloeit uit de arbeidsovereenkomst of
      publiekrechtelijke aanstelling, een geldelijke uitkering toekomt, wordt het loon verminderd met het bedrag van
      die uitkering.

      2 Het loon wordt verminderd met het bedrag van de door de werkgever vergoede onkosten die de werknemer door het
      niet verrichten van zijn arbeid heeft bespaard.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel57
  - number: 5:8
    text: |-
      Indien zowel de in artikel 4:1 als de in artikel 5:1 gestelde voorwaarden worden vervuld, eindigt het in artikel
      4:1 bedoelde verlof na één dag.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel58
  - number: 5:9
    text: |-
      De werknemer heeft recht op verlof zonder behoud van loon voor:

      a. de verzorging van een persoon als bedoeld in [artikel 5:1, tweede lid][ref1], die levensbedreigend ziek is; of

      b. de noodzakelijke verzorging van een persoon als bedoeld in [artikel 5:1, tweede lid][ref2], die ziek of
      hulpbehoevend is.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel51
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel59
