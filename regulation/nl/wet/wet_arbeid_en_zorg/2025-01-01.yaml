  - number: 3:27
    text: |-
      1 Met betrekking tot een uitkering op grond van deze paragraaf zijn de volgende artikelen van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] en de op die artikelen berustende bepalingen van
      overeenkomstige toepassing:

      a. ter zake van het recht op uitkering: de [artikelen 7a][ref2], [7b][ref3], [7c][ref4],
      [19, vierde en vijfde lid][ref5], [19a][ref6], [21a][ref7], [21b][ref8], [21c][ref9] en [101g][ref10];

      b. ter zake van herziening of intrekking: [artikel 18][ref11];

      c.

      d. ter zake van oproeping en ondervraging: de [artikelen 41, eerste lid][ref12], en [42][ref13];

      e. ter zake van maatregelen: de [artikelen 45][ref14], [artikel 46, eerste lid, onderdelen d en k][ref15], en
      [47][ref16];

      f. ter zake van de inlichtingenverplichting: [artikel 70][ref17];

      g. ter zake van de uitvoering: [artikel 81][ref18];

      h. ter zake van de termijn waarbinnen op het bezwaarschrift moet zijn beslist: [artikel 96, eerste lid][ref19];

      i. ter zake van het beroep in cassatie: [artikel 98][ref20];

      j.

      k. ter zake van terugvordering: [artikel 63][ref21], met dien verstande dat bij algemene maatregel van bestuur
      kan worden bepaald dat, in afwijking van het eerste lid van dat artikel, onder bij dat besluit te bepalen
      omstandigheden, een uitkering ter zake van vervanging niet wordt teruggevorderd;

      l. ter zake van vervreemding, verpanding en volmacht tot ontvangst: [artikel 66][ref22];

      m. ter zake van bestuurlijke boeten: de [artikelen 48][ref23], [54][ref24] en [54a][ref25];

      n. ter zake van het afzien van het horen van de belanghebbende: [artikel 95b][ref26].

      2 De strafbepaling van [artikel 84, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref27]
      is van overeenkomstige toepassing.

      3 [Artikel 56 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref28] is van overeenkomstige toepassing
      op een uitkering op grond van deze paragraaf met uitzondering van de uitkering ter zake van vervanging.

      4 Ter zake van overlijden zijn de [artikelen 1, tweede tot en met zevende lid][ref29], [61][ref30] en
      [67, onderdeel b, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref31] van overeenkomstige toepassing
      met dien verstande dat:

      a. het [derde lid van artikel 61][ref32] wordt toegepast ongeacht of het recht op uitkering met ingang van de dag
      na het overlijden binnen een maand zou zijn geëindigd;

      b. indien een uitkering is toegekend in de vorm van een uitkering ter zake van vervanging, de overlijdensuitkering
      wordt betaald overeenkomstig het [eerste lid van artikel 61][ref33], als was de uitkering toegekend als uitkering
      in verband met zwangerschap en bevalling of adoptie. Het [zevende lid van artikel 61][ref34] blijft daarbij buiten
      toepassing.

      5 Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig
      [artikel 45 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref35] indien de vrouwelijke
      beroepsbeoefenaar op arbeidsovereenkomst of de vrouwelijke zelfstandige zich niet houdt aan de voorschriften,
      bedoeld in [artikel 3:22, eerste of derde lid][ref36].

      6 Op de instelling, bedoeld in [artikel 3:21, tweede lid, onderdeel b][ref37], is
      [artikel 70, eerste lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref38] van overeenkomstige
      toepassing.


