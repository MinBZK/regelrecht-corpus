  - number: 4:4a
    text: |-
      1 De werkgever stemt in met een verzoek van de werknemer om het aanvullend geboorteverlof niet op te nemen
      of niet voort te zetten als gevolg van het opnemen van het zwangerschaps- of bevallingsverlof, bedoeld in
      [artikel 3:1, eerste lid][ref1], het verlof, bedoeld in [artikel 3:1a, eerste lid of vierde lid][ref2], of het
      adoptieverlof, bedoeld in [artikel 3:2, eerste lid][ref3]. In dat geval wordt het recht op verlof opgeschort.
      Verlof dat niet wordt opgenomen gedurende het tijdvak, bedoeld in [artikel 4:2a][ref4], vervalt. De werkgever hoeft
      aan het verzoek niet met ingang van een vroeger tijdstip gevolg te geven dan vier weken na het verzoek.

      2 De werkgever stemt in met een verzoek van de werknemer om het aanvullend geboorteverlof niet op te nemen of niet
      voort te zetten als gevolg van onvoorziene omstandigheden, tenzij een zwaarwegend bedrijfs- of dienstbelang zich
      hiertegen verzet. Indien de werkgever instemt met het verzoek wordt het recht op verlof opgeschort. Verlof dat niet
      wordt opgenomen gedurende het tijdvak, bedoeld in [artikel 4:2a][ref5], vervalt. De werkgever hoeft aan het verzoek
      niet met ingang van een vroeger tijdstip gevolg te geven dan vier weken na het verzoek. Indien de werkgever het
      verzoek weigert, motiveert hij dit schriftelijk binnen een redelijke termijn na de indiening van het verzoek.


