      De uitkering ter zake van vervanging bedraagt de grondslag, bedoeld in [artikel 3:23][ref1], eerste
      lid, vermeerderd met het bedrag aan premies en aan inkomensafhankelijke bijdrage als bedoeld in
      [artikel 42 van de Zorgverzekeringswet][ref2], dat het Uitvoeringsinstituut werknemersverzekeringen bij uitbetaling
      als uitkering in verband met zwangerschap en bevalling daarover verschuldigd zou zijn.


