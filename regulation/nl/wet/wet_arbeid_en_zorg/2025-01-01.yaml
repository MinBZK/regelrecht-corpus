  - number: 3:7
    text: |-
      1 De vrouwelijke werknemer heeft gedurende de periode dat het zwangerschaps- en bevallingsverlof wordt genoten
      overeenkomstig [artikel 3:1, tweede, derde en vijfde lid][ref1], recht op uitkering.

      2 De werknemer heeft gedurende de periode dat het verlof in verband met adoptie of de opname van een pleegkind
      wordt genoten overeenkomstig [artikel 3:2, tweede lid of vijfde lid][ref2], recht op uitkering.


