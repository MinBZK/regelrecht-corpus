    text: |-
      1 Op de zelfstandige, bedoeld in artikel 3:17, onderdeel a, zoals dat luidde op de dag voorafgaand aan de
      inwerkingtreding van [artikel II, onderdeel D, van de Wet einde toegang verzekering WAZ][ref1], van wie de
      vermoedelijke of feitelijke bevallingsdatum valt binnen 40 weken na de inwerkingtreding van [dat artikel][ref2]
      dan wel die binnen 40 weken na de inwerkingtreding van dat artikel feitelijk een kind ter adoptie of pleegzorg
      heeft opgenomen, blijft hoofdstuk 3, afdeling 2, paragraaf 2, zoals dat luidde op de dag voorafgaand aan de
      inwerkingtreding van [artikel II, onderdeel D, van de Wet einde toegang verzekering WAZ][ref3] van toepassing met
      betrekking tot die bevalling dan wel die opneming.

      2 Op de beroepsbeoefenaar op arbeidsovereenkomst, bedoeld in artikel 3:17, onderdeel
      b, zoals dat onderdeel luidde op de dag voorafgaand aan de inwerkingtreding van
      [artikel II, onderdeel D, van de Wet einde toegang verzekering WAZ][ref4], die binnen 40 weken na
      de inwerkingtreding van dat artikel feitelijk een kind ter adoptie of pleegzorg heeft opgenomen,
      blijft hoofdstuk 3, afdeling 2, paragraaf 2, zoals dat luidde voorafgaand aan de inwerkingtreding van
      [artikel II, onderdeel D, van de Wet einde toegang verzekering WAZ][ref5] van toepassing met betrekking tot die
      opneming.

      3 In afwijking van het eerste en tweede lid komen de onder toepassing van dit artikel te betalen uitkeringen en de
      uitvoeringskosten met betrekking tot die uitkeringen ten laste van het Arbeidsongeschiktheidsfonds.


