  - number: 3:1a
    text: |-
      1 Indien op de dag van de bevalling dan wel tijdens het bevallingsverlof de vrouwelijke werknemer overlijdt en
      een akte van geboorte van haar kind is opgemaakt heeft haar partner, indien deze werknemer is als bedoeld in
      [artikel 3:6][ref1], recht op het resterende bevallingsverlof met behoud van loon.

      2 Voor de toepassing van dit hoofdstuk wordt als partner aangemerkt degene die:

      a. ten tijde van het overlijden van de moeder met haar was gehuwd of een geregistreerd partnerschap was aangegaan;
      of

      b. het kind heeft erkend.

      3 De duur van het resterende bevallingsverlof wordt berekend overeenkomstig
      [artikel 3:1, derde en vijfde lid][ref2]. Artikel 3:1, zesde lid, is van overeenkomstige toepassing op het opnemen
      van het resterende bevallingsverlof, met dien verstande dat in plaats van «vrouwelijke werknemer» telkens wordt
      gelezen: partner.

      4 De partner, die werknemer is als bedoeld in [artikel 3:6][ref3], heeft ook recht op verlof met behoud van
      loon, indien de moeder van het kind een gelijkgestelde was als bedoeld in artikel 3:6, een zelfstandige of een
      beroepsbeoefenaar op arbeidsovereenkomst als bedoeld in [artikel 3:17, eerste lid][ref4], of geen recht had op
      bevallingsverlof of een uitkering als bedoeld in [afdeling 2 van hoofdstuk 3][ref5].

      5 De werkgever kan het op grond van het eerste of vierde lid voldane loon binnen zes weken na afloop van het
      resterende bevallingsverlof in rekening brengen bij het Uitvoeringsinstituut werknemersverzekeringen. De werkgever
      verstrekt genoemd instituut een afschrift van de akte van geboorte van het kind en van de akte van overlijden van
      de moeder. Het loon wordt door het Uitvoeringsinstituut werknemersverzekeringen aan de werkgever betaald zonder
      dat dit bij beschikking is vastgesteld, indien redelijkerwijs mag worden aangenomen dat aan een beschikking geen
      behoefte bestaat.

      6 Indien het verzoek, bedoeld in het vijfde lid, niet tijdig wordt gedaan, wordt de vergoeding van het op grond
      van het eerste of vierde lid voldane loon uitsluitend toegekend voor zover het tijdvak waarover dit loon in
      rekening wordt gebracht, valt in het jaar voorafgaand aan de datum van het verzoek. Het Uitvoeringsinstituut
      werknemersverzekeringen kan in bijzondere gevallen ten gunste van de werkgever afwijken van de eerste zin.

      7 Indien de moeder gelijkgestelde, zelfstandige of beroepsbeoefenaar op arbeidsovereenkomst was, wordt
      de duur van het verlof gelijkgesteld aan de duur van het resterende recht op uitkering, bedoeld in
      [afdeling 2 van hoofdstuk 3][ref6]. Indien de moeder geen recht had op bevallingsverlof of een uitkering als
      bedoeld in afdeling 2 van hoofdstuk 3, eindigt het verlof van de partner tien weken na de dag waarop het kind is
      geboren. [Artikel 3:1, vijfde lid][ref7], is van overeenkomstige toepassing.

      8 De partner meldt het overlijden van de moeder en de opname van het verlof uiterlijk op de tweede dag volgend op
      haar overlijden bij zijn werkgever. De partner verstrekt de werkgever binnen vier weken na het overlijden van de
      moeder een afschrift van de akte van geboorte van het kind en van de akte van overlijden van de moeder.


