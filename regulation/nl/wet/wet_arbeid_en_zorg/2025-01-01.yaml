  - number: 3:14a
    text: |-
      1 Is van de aanvrager of ontvanger van een uitkering in verband met zwangerschap en bevalling bij het
      Uitvoeringsinstituut werknemersverzekeringen een adres in Nederland bekend, terwijl in de basisregistratie
      personen ambtshalve is opgenomen dat hij is vertrokken naar een onbekend land van verblijf, dan verzoekt het
      Uitvoeringsinstituut werknemersverzekeringen hem de afwijkende registratie in de basisregistratie personen binnen
      een redelijke termijn ongedaan te laten maken.

      2 Wanneer na afloop van deze termijn, de afwijkende registratie niet is beëindigd of als uit de basisregistratie
      personen niet blijkt dat het college van burgemeester en wethouders van de desbetreffende gemeente de gegevens over
      het adres in onderzoek heeft genomen, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de
      uitkering aan de persoon, die recht heeft op de uitkering, op.

      3 De opschorting wordt beëindigd zodra is vastgesteld dat de persoon, bedoeld in het tweede lid, in het buitenland
      woont of verblijft of dat een adres in Nederland in de basisregistratie personen is opgenomen.

      4 Indien het onderzoek van het college van burgemeester en wethouders is afgerond en de persoon, bedoeld in
      het tweede lid, in de basisregistratie personen ambtshalve opgenomen blijft met gegevens over het vertrek uit
      Nederland, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de uitkering op tot verblijf in
      het buitenland kan worden vastgesteld of een adres in Nederland in de basisregistratie personen is opgenomen.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel314a
  - number: 3:16
    text: |-
      1 Met betrekking tot een uitkering op grond van deze paragraaf zijn de volgende artikelen van de [Ziektewet][ref1]
      en de op die artikelen berustende bepalingen van overeenkomstige toepassing:

      a. ter zake van het recht op uitkering: de [artikelen 19a][ref2], [19b][ref3], [19c][ref4] en [87c][ref5];

      b. ter zake van herziening of intrekking: [artikel 30a][ref6];

      c. ter zake van overlijden: de [artikelen 1, tweede tot en met zevende lid][ref7], en [35][ref8];

      d. ter zake van oproeping en ondervraging: [artikel 37][ref9];

      e. ter zake van ontheffing in verband met gemoedsbezwaren: [artikel 43][ref10];

      f. ter zake van maatregelen:
      [artikel 45, eerste lid, onderdelen e, h, i, j en r, en tweede tot en met zesde lid][ref11];

      g. ter zake van de inlichtingenverplichting: [artikel 49][ref12];

      h. ter zake van de uitvoering: de [artikelen 51][ref13], [53 tot en met 55][ref14] en [59][ref15];

      i. ter zake van de termijn waarbinnen op het bezwaarschrift moet zijn beslist: [artikel 74][ref16];

      j. ter zake van het beroep in cassatie: [artikel 75m][ref17];

      k.

      l. ter zake van de toepasselijkheid van de [Algemene termijnenwet][ref18]: [artikel 89][ref19];

      m. ter zake van terugvordering: de [artikelen 33 tot en met 34a][ref20];

      n. ter zake van vervreemding, verpanding en volmacht tot ontvangst: [artikel 50][ref21];

      o. ter zake van bestuurlijke boeten: de de [artikelen 45a][ref22] en [45g][ref23].

      2 De strafbepaling van [artikel 84, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref24]
      is van overeenkomstige toepassing.

      3 In afwijking van het eerste lid, is op de werknemer en de gelijkgestelde, bedoeld in
      [artikel 3:6, tweede lid][ref25], [artikel 43 van de Ziektewet][ref26] niet van overeenkomstige toepassing en is
      [artikel 55 van de Ziektewet][ref27] van overeenkomstige toepassing.

      4 [Artikel 35, derde lid, van de Ziektewet][ref28] is van overeenkomstige toepassing ongeacht of het recht op
      uitkering met ingang van de dag na het overlijden binnen een maand zou zijn geëindigd.


