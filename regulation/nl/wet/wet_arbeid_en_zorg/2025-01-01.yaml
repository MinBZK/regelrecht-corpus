  - number: 3:2
    text: |-
      1 De werknemer heeft in verband met de adoptie van een kind recht op verlof zonder behoud van loon.

      2 Het recht op verlof in verband met adoptie bestaat gedurende een tijdvak van zesentwintig weken en bedraagt ten
      hoogste zes aaneengesloten weken. Het recht bestaat vanaf vier weken vóór de eerste dag dat de feitelijke opneming
      ter adoptie een aanvang heeft genomen of zal nemen, zoals die dag is aangeduid in een door de werknemer aan de
      werkgever overgelegd document waaruit blijkt dat een kind ter adoptie is of zal worden opgenomen.

      3 Indien als gevolg van een adoptieverzoek tegelijkertijd twee of meer kinderen feitelijk ter adoptie worden
      opgenomen, bestaat het recht op verlof slechts ten aanzien van één van die kinderen.

      4 In afwijking van het tweede lid, eerste zin, kan de werknemer de werkgever verzoeken om het verlof te spreiden
      gedurende een tijdvak van zesentwintig weken. De werkgever kan dit verzoek afwijzen, indien zwaarwegende bedrijfs-
      of dienstbelangen zich hiertegen verzetten.

      5 Het eerste, tweede, derde en vierde lid en de [artikelen 3:3, derde lid][ref1], [3:4][ref2] en
      [3:5][ref3] zijn van overeenkomstige toepassing op de werknemer die een pleegkind opneemt als bedoeld in
      [artikel 5:1, tweede lid, onder d][ref4].


