  - number: 6:6
    text: |-
      1 De werkgever stemt in met een verzoek van de werknemer om het verlof niet op te nemen of niet voort te zetten
      als gevolg van het opnemen van het zwangerschaps- of bevallingsverlof, bedoeld in [artikel 3:1, eerste lid][ref1],
      het verlof, bedoeld in [artikel 3:1a, eerste lid of vierde lid][ref2], of het adoptieverlof, bedoeld in
      [artikel 3:2, eerste lid][ref3]. In dat geval wordt het recht op verlof opgeschort. Verlof dat niet wordt opgenomen
      voor de datum waarop het kind de leeftijd van acht jaren bereikt vervalt. De werkgever hoeft aan het verzoek niet
      met ingang van een vroeger tijdstip gevolg te geven dan vier weken na het verzoek.

      2 De werkgever stemt in met een verzoek van de werknemer om het verlof niet op te nemen of niet voort te zetten
      als gevolg van onvoorziene omstandigheden, tenzij een zwaarwegend bedrijfs- of dienstbelang zich hiertegen verzet.
      Indien de werkgever instemt met het verzoek wordt het recht op verlof opgeschort. Verlof dat niet wordt opgenomen
      voor de datum waarop het kind de leeftijd van acht jaren bereikt vervalt. De werkgever hoeft aan het verzoek niet
      met ingang van een vroeger tijdstip gevolg te geven dan vier weken na het verzoek. Indien de werkgever het verzoek
      weigert, motiveert hij dit schriftelijk binnen een redelijke termijn na de indiening van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel31a
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel32
