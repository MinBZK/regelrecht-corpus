  - number: 3:6
    text: |-
      1 Voor de toepassing van deze paragraaf wordt verstaan onder:

      a. werknemer: de werknemer, bedoeld in [artikel 1:1, onderdeel b][ref1], met uitzondering van degene die op grond
      van de [Eerste Afdeling, Paragraaf 2, van de Ziektewet][ref2] geen werknemer in de zin van die [wet][ref3] is;

      b. gelijkgestelde: degene die geen werknemer is als bedoeld in [artikel 1:1, onderdeel b][ref4], doch

      1°. op grond van de [Eerste Afdeling, Paragraaf 2, van de Ziektewet][ref5], met uitzondering van
      [artikel 8a][ref6], wel werknemer in de zin van [die wet][ref7] is, of

      2°. op grond van [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref8] recht heeft op de
      loongerelateerde uitkering van de werkhervattingsuitkering gedeeltelijk arbeidsgeschikten;

      c. werkgever: de werkgever, bedoeld in [artikel 1:1, onderdeel a][ref9], of de [artikelen 10][ref10], [11][ref11]
      of [12 van de Ziektewet][ref12].

      2 Voor de toepassing van deze paragraaf wordt mede verstaan onder:

      a. werknemer: de werknemer, bedoeld in [artikel 1:1, onderdeel b][ref13], die vrijwillig verzekerd is als bedoeld
      in de [Tweede Afdeling, Hoofdstuk IV, van de Ziektewet][ref14];

      b. gelijkgestelde: degene die geen werknemer is als bedoeld in onderdeel a doch wel vrijwillig verzekerd is als
      bedoeld in de [Tweede Afdeling, Hoofdstuk IV, van de Ziektewet][ref15].


