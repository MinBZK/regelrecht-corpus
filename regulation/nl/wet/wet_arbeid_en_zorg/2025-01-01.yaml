  - number: 5:14
    text: |-
      Indien het verzoek om langdurend zorgverlof wordt ingewilligd, kan het daaraan voorafgaand kortdurend
      zorgverlof bedoeld in [artikel 5:1][ref1] op verzoek van de werknemer en met inachtneming van
      [artikel 5:12, tweede lid][ref2], geheel of gedeeltelijk worden aangemerkt als langdurend zorgverlof.


