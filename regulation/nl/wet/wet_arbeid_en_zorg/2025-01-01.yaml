  - number: 8:1
    text: |-
      Onze Minister zendt, in overeenstemming met Onze Minister van Justitie en Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel81
  - number: 8:1a
    text: |-
      Het College, genoemd in [artikel 1 van de Wet College voor de rechten van de mens][ref1], kan onderzoeken of een
      onderscheid is of wordt gemaakt als bedoeld in de [artikelen 1:6][ref2] of [1:7][ref3]. De [artikelen 10][ref4],
      [11][ref5], [12][ref6], [13][ref7], [22][ref8] en [23 van de Wet College voor de rechten van de mens][ref9] zijn
      van overeenkomstige toepassing.


