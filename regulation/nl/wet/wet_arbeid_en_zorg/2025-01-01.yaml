  - number: 3:25
    text: |-
      1 De betaling geschiedt als regel in tijdvakken van een maand.

      2 De uitkering wordt betaald over iedere dag, doch niet over de zaterdagen en de zondagen.

      3 De uitkering ter zake van vervanging wordt uitbetaald aan de instelling bedoeld in artikel 3:21, tweede lid,
      onderdeel b.

      4 De [artikelen 55, tweede tot en met vijfde lid][ref1], [55a][ref2], [57][ref3], [62][ref4] en
      [66 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel55
