  - number: 5:12
    text: |-
      1 Het verlof bedoeld in [artikel 5:9][ref1] gaat niet in voordat ten minste twee weken zijn verstreken nadat de
      werknemer het verzoek om verlof bedoeld in [artikel 5:11][ref2] heeft ingediend.

      2 In afwijking van het eerste lid kan het verlof op verzoek van de werknemer ingaan op een eerder tijdstip indien
      de werkgever daarmee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel59
