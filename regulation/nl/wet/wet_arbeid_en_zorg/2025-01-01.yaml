  - number: 3:17
    text: |-
      1 Voor de toepassing van deze paragraaf wordt verstaan onder:

      a. beroepsbeoefenaar op arbeidsovereenkomst: de werknemer, bedoeld in [artikel 1:1, onderdeel b][ref1],
      die op grond van [artikel 6, eerste lid, onderdeel c, van de Ziektewet][ref2], geen werknemer in de zin van
      [die wet][ref3] is;

      b. zelfstandige: de persoon die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref4], nog niet heeft bereikt, die:

      1°. in Nederland woont en die winst uit onderneming geniet, tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft;

      2°. niet in Nederland woont en die belastbare winst uit onderneming geniet als bedoeld in
      [afdeling 7.2, van de Wet inkomstenbelasting 2001][ref5], tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft;

      3°. anders dan uit dienstbetrekking inkomsten uit tegenwoordige arbeid geniet;

      4°. anders dan in dienstbetrekking arbeid verricht ten behoeve van een lichaam waarin hij een aanmerkelijk belang
      heeft;

      5°. directeur-grootaandeelhouder is en het werk tot stand brengt uitsluitend voor rekening en risico van de
      onderneming van de rechtspersoon waarvan hij directeur-grootaandeelhouder is;

      6°. anders dan in dienstbetrekking of als zelfstandige als bedoeld in de onderdelen 1° tot en met 5° meewerkt in de
      onderneming van een echtgenoot of geregistreerde partner;

      c. winst uit onderneming: de belastbare winst uit onderneming, bedoeld in
      [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref6], vermeerderd met de ondernemersaftrek, bedoeld in
      [paragraaf 3.2.4 van die wet][ref7], en de MKB-winstvrijstelling, bedoeld in [paragraaf 3.2.5, van die wet][ref8];

      d. dienstbetrekking: een dienstbetrekking in de zin van de [Ziektewet][ref9];

      e. aanmerkelijk belang: aanmerkelijk belang als bedoeld in [hoofdstuk 4 van de Wet inkomstenbelasting 2001][ref10];

      f. inkomsten uit tegenwoordige arbeid: het gezamenlijke bedrag van:

      1°. het belastbaar loon uit tegenwoordige arbeid, bedoeld in
      [afdeling 3.3 van de Wet inkomstenbelasting 2001][ref11];

      2°. het belastbaar loon ter zake van het in Nederland verrichten van arbeid, bedoeld in
      [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref12];

      3°. het belastbaar resultaat uit overige werkzaamheden, bedoeld in
      [afdeling 3.4 van de Wet inkomstenbelasting 2001][ref13], behoudens voor zover het een
      werkzaamheid betreft als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b][ref14], en
      [3.92 van de Wet inkomstenbelasting 2001][ref15]; en

      4°. het belastbaar resultaat uit overige werkzaamheden in Nederland, bedoeld in
      [afdeling 7.2, van de Wet inkomstenbelasting 2001][ref16], behoudens voor zover het een
      werkzaamheid betreft als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b][ref17], en
      [3.92 van de Wet inkomstenbelasting 2001][ref18].

      2 Door Onze Minister worden, in overeenstemming met Onze Minister van Financiën, regels gesteld omtrent hetgeen
      onder directeur-grootaandeelhouder als bedoeld in het eerste lid onderdeel 5°, wordt verstaan.


