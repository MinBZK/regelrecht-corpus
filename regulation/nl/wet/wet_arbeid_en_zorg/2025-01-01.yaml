      1 Van [artikel 4:1][ref1], voor wat betreft de loonbetaling, en de [artikelen 4:4 tot en met 4:6][ref2] kan
      uitsluitend ten nadele van de werknemer worden afgeweken bij collectieve arbeidsovereenkomst of bij regeling door
      of namens een daartoe bevoegd bestuursorgaan dan wel, indien geen collectieve arbeidsovereenkomst of regeling
      van toepassing is of terzake geen bepaling bevat, indien de werkgever terzake schriftelijke overeenstemming heeft
      bereikt met de ondernemingsraad of, bij het ontbreken daarvan, met de personeelsvertegenwoordiging, met dien
      verstande dat de werknemer bij afwijking van [artikel 4:6][ref3] ten minste recht houdt op het wettelijke minimum
      aan vakantie-aanspraken.

      2 Van de [artikelen 4:2 tot en met 4:3][ref4] kan niet ten nadele van een werknemer worden afgeweken.


