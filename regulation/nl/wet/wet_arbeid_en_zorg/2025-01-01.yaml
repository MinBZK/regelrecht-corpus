    text: |-
      Dagen of gedeelten van dagen waarop de werknemer zijn arbeid niet verricht wegens het verlof, bedoeld in artikel
      6:1, kunnen niet worden aangemerkt als vakantie.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel67
  - number: 6:8
    text: |-
