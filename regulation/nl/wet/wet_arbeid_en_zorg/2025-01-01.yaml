  - number: 4:2b
    text: |-
      1 Op aanvraag van een werknemer als bedoeld in [artikel 3:6, eerste lid, aanhef en onderdeel a][ref1], verstrekt
      het Uitvoeringsinstituut werknemersverzekeringen bij opname van het aanvullend geboorteverlof, bedoeld in
      [artikel 4:2a][ref2], een uitkering aan die werknemer.

      2 De uitkering wordt over ten hoogste vijf gehele weken verstrekt.

      3 De uitkering bedraagt per dag 70% van het dagloon van de in het eerste lid bedoelde werknemer, doch ten hoogste
      70% van het bedrag, bedoeld in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref3], met
      betrekking tot een loontijdvak van een dag.

      4 Het dagloon, bedoeld in het derde lid, wordt berekend aan de hand van 1/261 deel van het loon, bedoeld in
      [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref4], dat de werknemer in de periode van een jaar,
      die eindigt op de laatste dag van het tweede aangiftetijdvak voorafgaande aan het aangiftetijdvak, waarin het recht
      op de uitkering is ontstaan, verdiende op grond van de arbeidsovereenkomst of de publiekrechtelijke aanstelling
      waaruit dat recht is ontstaan.

      5 Bij algemene maatregel van bestuur worden ten aanzien van de vaststelling en de herziening van het dagloon nadere
      en zo nodig afwijkende regels gesteld, onder meer over de vaststelling en de herziening van het dagloon wanneer de
      werknemer korter dan een jaar heeft gewerkt bij zijn werkgever.

      6 Op een op grond van dit artikel vastgesteld dagloon is [artikel 16 van de Ziektewet][ref5] van overeenkomstige
      toepassing.

      7 Het Uitvoeringsinstituut werknemersverzekeringen verstrekt op aanvraag aan een werknemer wiens
      arbeidsverhouding niet wordt beschouwd als dienstbetrekking op grond van [artikel 6 van de Ziektewet][ref6]
      en die uitsluitend om die reden niet wordt aangemerkt als werknemer in de zin van die wet, een
      uitkering bij opname van het aanvullend geboorteverlof, bedoeld in [artikel 4:2a][ref7]. De
      uitkering bedraagt naar rato van de overeengekomen arbeidsduur per week 70% van het loon, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref8] indien zijn recht
      op uitkering niet kan worden vastgesteld overeenkomstig het derde tot en met zesde lid. Bij de berekening van de
      uitkering wordt uitgegaan van een arbeidsduur van 36 uren per week.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel36
