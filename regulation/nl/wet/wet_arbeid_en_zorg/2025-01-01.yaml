  - number: 3:28
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan controlevoorschriften vaststellen. Deze voorschriften mogen
      niet verder gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel328
  - number: 3:29
    text: |-
      1 Indien een persoon over dezelfde periode op grond van dezelfde paragraaf zowel recht heeft op een uitkering
      in verband met zwangerschap en bevalling als op een uitkering in verband met adoptie of pleegzorg, wordt haar de
      uitkering in verband met adoptie of pleegzorg of ter zake van vervanging in verband met adoptie of pleegzorg niet
      uitbetaald.

      Indien een persoon over dezelfde periode op grond van dezelfde paragraaf zowel recht heeft op een uitkering in
      verband met adoptie als op een uitkering in verband met pleegzorg wordt hem de uitkering in verband met pleegzorg
      of ter zake van vervanging in verband met pleegzorg niet uitbetaald.

      2 Indien een persoon over dezelfde periode zowel recht heeft op een uitkering op grond van [paragraaf 1][ref1]
      als op een uitkering op grond van [paragraaf 2][ref2] van deze afdeling, wordt hem de uitkering op grond van
      [paragraaf 2][ref3] uitbetaald voorzover deze de uitkering op grond van [paragraaf 1][ref4] van deze afdeling
      overtreft. Indien de uitkering op grond van [paragraaf 1][ref5] geheel of gedeeltelijk wordt geweigerd op grond
      van enig handelen of nalaten dat de betrokkene kan worden verweten, wordt voor de toepassing van dit lid die
      uitkering in aanmerking genomen alsof die weigering niet heeft plaatsgevonden.

      3 Indien een vrouwelijke zelfstandige of een vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst over eenzelfde
      periode zowel recht heeft op een uitkering op grond van [paragraaf 1][ref6], als op een uitkering op grond van
      [paragraaf 2][ref7] van deze afdeling, worden haar, in afwijking van het tweede lid, zowel de uitkering op grond
      van zowel [paragraaf 1][ref8], als de uitkering op grond van [paragraaf 2][ref9] uitbetaald, mits de vrouwelijke
      zelfstandige of de vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst niet vrijwillig verzekerd is als bedoeld in
      de [Tweede Afdeling, Hoofdstuk IV, van de Ziektewet][ref10] en voor zover:

      a. werkzaamheden als vrouwelijke zelfstandige of vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst worden
      verricht; en

      b. de uitkering op grond van [paragraaf 1][ref11] en de uitkering op grond van [paragraaf 2][ref12] samen niet
      meer bedragen dan 100% van de som van de inkomsten uit of in verband met arbeid die de vrouwelijke zelfstandige
      of de vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst ontving op de dag direct voorafgaande aan de
      dag waarop recht op uitkering op grond van [afdeling 2, paragraaf 1][ref13], en de uitkering op grond van
      [afdeling 2, paragraaf 2][ref14], ontstaat.

      4 Indien een gelijkgestelde als bedoeld in [artikel 3:6, eerste lid, onderdeel b, onder 2°][ref15], over dezelfde
      periode tevens uit andere hoofde recht heeft op één of meerdere uitkeringen op grond van [paragraaf 1][ref16],
      wordt de uitkering van die gelijkgestelde uitbetaald voorzover deze uitkering samen met de andere uitkeringen
      niet meer bedraagt dan 100% van het dagloon dat ten grondslag ligt aan de loongerelateerde uitkering van de
      werkhervattingsuitkering gedeeltelijk arbeidsgeschikten.

      5 Indien een persoon over dezelfde periode zowel recht heeft op een uitkering op grond van
      [paragraaf 1][ref17] van deze afdeling als op arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref18] wordt eerstgenoemde uitkering uitbetaald voorzover deze samen
      met de arbeidsongeschiktheidsuitkering niet meer bedraagt dan het hoogste van de daglonen, die aan die uitkeringen
      ten grondslag liggen.

      6 Indien een persoon over dezelfde periode zowel recht heeft op een uitkering op grond van
      [paragraaf 2][ref19] van deze afdeling als op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref20], wordt:

      a. indien de grondslag van de eerstgenoemde uitkering lager is dan de grondslag van de
      arbeidsongeschiktheidsuitkering of daaraan gelijk is, de eerstgenoemde uitkering uitbetaald voorzover deze samen
      met de arbeidsongeschiktheidsuitkering niet meer bedraagt dan de grondslag van de arbeidsongeschiktheidsuitkering;

      b. indien de grondslag van de eerstgenoemde uitkering hoger is dan de grondslag van de
      arbeidsongeschiktheidsuitkering, de eerstgenoemde uitkering uitbetaald voorzover deze samen met de
      arbeidsongeschiktheidsuitkering niet meer bedraagt dan de grondslag van de eerstgenoemde uitkering;

      c. indien het recht op eerstgenoemde uitkering ontstaat in het tijdvak van 52 weken bedoeld in
      [artikel 7, tweede lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref21], in afwijking van
      de onderdelen a en b, de eerstgenoemde uitkering uitbetaald voorzover deze de arbeidsongeschiktheidsuitkering
      overtreft.

      7 Voor de toepassing van het tweede tot en met zesde lid wordt onder arbeidsongeschiktheidsuitkering op grond
      van de [Wet op de arbeidsongeschiktheidsverzekering][ref22], arbeidsongeschiktheidsuitkering op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref23], uitkering op grond van [paragraaf 1][ref24] van deze
      afdeling en uitkering op grond van [paragraaf 2][ref25] van deze afdeling tevens verstaan de vakantie-uitkering
      waarop uit hoofde van die arbeidsongeschiktheidsuitkeringen en die uitkeringen recht bestaat, voor zover die
      vakantie-uitkering over dezelfde periode is berekend.

      8 Indien de arbeidsongeschiktheidsuitkering geheel of gedeeltelijk wordt geweigerd op grond van enig handelen
      of nalaten dat de betrokkene kan worden verweten, wordt voor de toepassing van het vierde en vijfde lid de
      arbeidsongeschiktheidsuitkering in aanmerking genomen alsof die weigering niet heeft plaatsgevonden.


