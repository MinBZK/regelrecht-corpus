  - number: 6:4
    text: |-
      Geen recht op verlof als bedoeld in artikel 6:1 bestaat na de datum waarop het kind de leeftijd van acht jaren
      heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel64
  - number: 6:5
    text: |-
      1 De werknemer meldt het voornemen om verlof op te nemen ten minste twee maanden voor het tijdstip van ingang van
      het verlof schriftelijk aan de werkgever onder opgave van de periode, het aantal uren verlof per week of als de
      arbeidsduur over een ander tijdvak is overeengekomen over dat tijdvak en de spreiding daarvan over de week of het
      anderszins overeengekomen tijdvak.

      2 De tijdstippen van ingang en einde van het verlof kunnen afhankelijk worden gesteld van de datum van de
      bevalling, van het einde van het bevallingsverlof of van de aanvang van de verzorging.

      3 De werkgever kan, tot vier weken voor het tijdstip van ingang van het verlof, en na overleg met de werknemer,
      de door de werknemer gewenste wijze van invulling van het verlof gedurende een redelijke termijn wijzigen op grond
      van een zwaarwegend bedrijfs- of dienstbelang, met dien verstande dat de werknemer in ieder geval in staat wordt
      gesteld het verlof binnen de in de [artikelen 6:3, eerste lid][ref1], en [6:4][ref2], gestelde termijnen op te
      nemen. De werkgever motiveert een wijziging schriftelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel64
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel65
