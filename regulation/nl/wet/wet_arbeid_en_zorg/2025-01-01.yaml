  - number: 4:2c
    text: |-
      1 De werknemer, bedoeld in [artikel 4:2b, eerste lid][ref1], die in aanmerking wenst te komen voor de in dat
      lid genoemde uitkering, doet de aanvraag daartoe door tussenkomst van de werkgever bij het Uitvoeringsinstituut
      werknemersverzekeringen door middel van een door dit instituut beschikbaar gesteld aanvraagformulier. De aanvraag
      wordt eenmalig ingediend in de periode die gelegen is tussen vier weken voor de eerste dag waarop het aanvullend
      geboorteverlof wordt opgenomen en vier weken na de laatste dag, waarop dat verlof is opgenomen.

      2 De werknemer, bedoeld in [artikel 4:2b, zevende lid][ref2], die in aanmerking wenst te komen voor de uitkering,
      bedoeld in dat lid, doet de aanvraag daartoe, door tussenkomst van de werkgever, bij het Uitvoeringsinstituut
      werknemersverzekeringen door middel van een door dit instituut beschikbaar gesteld aanvraagformulier.
      Bij de aanvraag wordt de arbeidsovereenkomst of publiekrechtelijke aanstelling van de werknemer aan het
      Uitvoeringsinstituut werknemersverzekeringen overgelegd. De laatste zin van het eerste lid is van overeenkomstige
      toepassing.

      3 De uitkering, bedoeld in het eerste of tweede lid, wordt verstrekt voor zover het tijdvak, waarin er sprake was
      van het recht op uitkering, ligt in het jaar voorafgaand aan de datum van de aanvraag.

      4 Het Uitvoeringsinstituut werknemersverzekeringen kan controlevoorschriften vaststellen. Deze voorschriften mogen
      niet verder gaan dan strikt noodzakelijk is voor de juiste uitvoering van dit artikel of de [artikelen 4:2a][ref3]
      en [4:2b][ref4].

      5 De [artikelen 3.14, tweede en derde lid][ref5], [3:14a][ref6], [3:16, eerste tot en met derde lid][ref7], en
      [3:18, zesde tot en met achtste lid][ref8], zijn van overeenkomstige toepassing.


