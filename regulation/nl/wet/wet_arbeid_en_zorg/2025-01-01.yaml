  - number: 3:23
    text: |-
      1 De uitkering in verband met zwangerschap en bevalling wordt overeenkomstig
      [artikel 8 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] berekend naar de grondslag met dien
      verstande dat bij de overeenkomstige toepassing van het [derde lid van dat artikel][ref2] voor «intreden van zijn
      arbeidsongeschiktheid als beroepsbeoefenaar» wordt gelezen: de ingangsdatum van het recht op uitkering.

      2 De uitkering bedraagt per dag 100% van de grondslag en wordt ter zake van de vakantie-uitkering verhoogd met 8%.

      3 Zo nodig in afwijking van het tweede lid en van [artikel 3:29, derde lid, onder b][ref3],
      bedraagt de uitkering in verband met zwangerschap en bevalling 100% van het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref4], indien de vrouwelijke
      zelfstandige in het kalenderjaar voorafgaand aan het jaar waarin het recht op uitkering ontstaat als zelfstandige,
      aan werkzaamheden voor één of meer ondernemingen tenminste het aantal uren heeft besteed dat is vermeld in
      [artikel 3.6, eerste lid, van de Wet inkomstenbelasting 2001][ref5].

      4 De uitkering in verband met het overlijden van de moeder bedraagt voor de partner,
      bedoeld in [artikel 3:18, tiende of elfde lid][ref6], 100% van het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref7].

      5 Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref8], wordt gewijzigd, treedt
      dit gewijzigde percentage in de plaats van het in het tweede genoemde percentage van de vakantie-uitkering.
      Het gewijzigde percentage wordt in aanmerking genomen over de uitkering waarop recht bestaat over het tijdvak
      aanvangende met de dag waarop de wijziging ingaat.


