  - number: 3:10
    text: |-
      1 Een recht op uitkering als bedoeld in de [artikelen 3:7, eerste lid][ref1], en [3:8, eerste en vijfde lid][ref2],
      komt mede toe aan de vrouw wier bevalling waarschijnlijk is onderscheidenlijk plaatsvindt, binnen een
      periode van tien weken na het tijdstip dat zij niet langer werknemer of gelijkgestelde is als bedoeld in
      [artikel 3:6, eerste lid][ref3].

      2 Een recht op uitkering als bedoeld in de [artikelen 3:7, tweede lid][ref4], en [3:9, eerste lid][ref5], komt mede
      toe aan de persoon die, op de eerste dag dat een kind feitelijk ter adoptie is opgenomen, korter dan tien weken
      geen werknemer of gelijkgestelde meer is als bedoeld in [artikel 3:6, eerste lid][ref6].

      3 Het tweede lid is van overeenkomstige toepassing op de persoon die een pleegkind opneemt als bedoeld in
      [artikel 5:1, tweede lid, onder d][ref7].

      4 Het eerste tot en met derde lid zijn niet van toepassing indien het een gelijkgestelde betreft als bedoeld in
      [artikel 3.6, eerste lid, onderdeel b, onder 2°][ref8].


