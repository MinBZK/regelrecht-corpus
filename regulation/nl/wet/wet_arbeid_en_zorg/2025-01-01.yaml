  - number: 4:3
    text: |-
      1 De werknemer meldt vooraf aan de werkgever dat hij het verlof, bedoeld in [artikel 4:1][ref1], opneemt onder
      opgave van de reden. Indien dit niet mogelijk is, meldt de werknemer het opnemen van het verlof zo spoedig mogelijk
      aan de werkgever onder opgave van de reden.

      2 De werknemer meldt het voornemen om het verlof, bedoeld in de [artikelen 4:2][ref2] of [4:2a][ref3], op te nemen
      ten minste vier weken voor het tijdstip van ingang van het verlof schriftelijk of elektronisch aan de werkgever
      onder opgave van de periode, het aantal gehele weken waarvoor hij verlof opneemt, of als de arbeidsduur over een
      ander tijdvak is overeengekomen waarover hij verlof opneemt over dat tijdvak, en de spreiding daarvan over de week
      of het anderszins overeengekomen tijdvak. Indien het niet mogelijk is de melding van het verlof tijdig te doen,
      meldt de werknemer het voornemen om het verlof op te nemen zo spoedig mogelijk aan de werkgever.

      3 De tijdstippen van ingang en einde van het in de [artikelen 4:2][ref4] en [4:2a][ref5] bedoelde verlof kunnen
      afhankelijk worden gesteld van de datum van de bevalling en ten aanzien van het verlof, bedoeld in artikel 4:2a,
      eveneens van het einde van het bevallingsverlof.

      4 De werkgever kan, na overleg met de werknemer, de door de werknemer gewenste wijze van invulling van het in
      [artikel 4:2a][ref6] bedoelde verlof op grond van een zwaarwegend bedrijfs- of dienstbelang wijzigen tot twee weken
      voor het tijdstip van ingang van het verlof.

      5 Indien toepassing wordt gegeven aan de [artikelen 4:2, tweede lid][ref7], of [4:2a, derde lid][ref8], zijn het
      eerste tot en met vierde lid van overeenkomstige toepassing.

      6 Het verlof van de militaire ambtenaar vangt niet aan of eindigt in ieder geval zodra de werkgever aan hem
      kenbaar maakt dat hij tegen het opnemen van het verlof onderscheidenlijk de voortzetting daarvan een zodanig
      zwaarwegend dienstbelang heeft, dat het belang van de militaire ambtenaar daarvoor naar maatstaven van redelijkheid
      en billijkheid moet wijken. Toepassing van de eerste zin laat het recht op het geboorteverlof, bedoeld in
      [artikel 4:2][ref9], en vervolgens het recht op het aanvullend geboorteverlof, bedoeld in [artikel 4:2a][ref10],
      onverlet. De werkgever kan daarbij een tijdvak van maximaal negen maanden, te rekenen vanaf de eerste dag na de
      bevalling, toepassen.


