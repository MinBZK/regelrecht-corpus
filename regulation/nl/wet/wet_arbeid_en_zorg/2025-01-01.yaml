  - number: 6:3a
    text: |-
      1 De werknemer, bedoeld in [artikel 6:3, derde lid][ref1], die in aanmerking wenst te komen voor een uitkering
      als bedoeld in dat lid, doet de aanvraag daartoe door tussenkomst van de werkgever bij het Uitvoeringsinstituut
      werknemersverzekeringen. Het Uitvoeringsinstituut werknemersverzekeringen stelt het recht op, de hoogte en de
      maximale duur van de uitkering naar aanleiding van de aanvraag eenmalig vast.

      2 De werknemer, bedoeld in [artikel 6:3, zevende lid][ref2], die in aanmerking wenst te komen voor de uitkering,
      bedoeld in dat lid, doet de aanvraag daartoe, door tussenkomst van de werkgever, bij het Uitvoeringsinstituut
      werknemersverzekeringen door middel van een door dit instituut beschikbaar gesteld aanvraagformulier.
      Bij de aanvraag wordt de arbeidsovereenkomst of publiekrechtelijk aanstelling van de werknemer aan het
      Uitvoeringsinstituut werknemersverzekeringen overgelegd. De laatste zin van het eerste lid is van overeenkomstige
      toepassing.

      3 De aanvraag, bedoeld in het eerste of tweede lid, heeft betrekking op gehele weken en wordt ingediend in de
      periode die gelegen is tussen de eerste dag waarop het verlof, waarop de uitkering betrekking heeft, is genoten
      en drie maanden nadat het kind de leeftijd van een jaar heeft bereikt, dan wel bij adoptie of een pleegkind
      een jaar en drie maanden na de dag van de feitelijke opname ter adoptie of als pleegkind. De betaling van de
      uitkering heeft betrekking op verlof dat op het moment van de aanvraag reeds genoten is. Voor verlof dat is
      genoten nadat de aanvraag is ingediend, kan de werknemer ten hoogste tweemaal verzoeken om verdere betaling van de
      uitkering. Een verzoek om verdere betaling van de uitkering heeft betrekking op gehele weken en wordt gedaan door
      tussenkomst van de werkgever binnen de in de eerste zin genoemde periode conform de door het Uitvoeringsinstituut
      werknemersverzekeringen vastgestelde maximale duur van de uitkering. De verdere betaling van de uitkering wordt
      door het Uitvoeringsinstituut werknemersverzekeringen gedaan zonder dat dit bij beschikking is vastgesteld, indien
      redelijkerwijs mag worden aangenomen dat aan een beschikking geen behoefte bestaat.

      4 Een verzoek tot betaling als bedoeld in het derde lid, wordt gedaan door middel van een door het
      Uitvoeringsinstituut werknemersverzekeringen ter beschikking gesteld aanvraagformulier.

      5 Een uitkering als bedoeld in het eerste of tweede lid wordt verstrekt voor zover het tijdvak, waarin er sprake is
      van het recht op uitkering, ligt in het jaar en drie maanden voorafgaand aan de datum van de aanvraag.

      6 Het Uitvoeringsinstituut werknemersverzekeringen kan controlevoorschriften vaststellen. Deze voorschriften mogen
      niet verder gaan dan strikt noodzakelijk is voor de juiste uitvoering van deze paragraaf.

      7 De [artikelen 3:14, tweede lid en derde lid][ref3], [3:14a][ref4], [3:16, eerste tot en met derde lid][ref5], en
      [3:18, zesde tot en met achtste lid][ref6], zijn van overeenkomstige toepassing.

      8 De werknemer, bedoeld in [artikel 6:1, tweede lid][ref7], die in aanmerking wenst te komen voor een uitkering als
      bedoeld in [artikel 6:3][ref8] voegt, door tussenkomst van de werkgever, bij de aanvraag documenten waaruit blijkt
      met ingang van welke datum hij duurzaam de verzorging en de opvoeding van dat kind als zijn eigen kind op zich
      heeft genomen alsmede waaruit blijkt met ingang van welke datum hij het recht op verlof en het recht op uitkering
      wil laten ingaan.


