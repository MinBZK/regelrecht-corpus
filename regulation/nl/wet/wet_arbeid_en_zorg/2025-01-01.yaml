  - number: 3:3
    text: |-
      1 De vrouwelijke werknemer meldt aan de werkgever:

      a. de dag met ingang waarvan zij het zwangerschapsverlof opneemt uiterlijk drie weken voor die dag;

      b. haar bevalling uiterlijk op de tweede dag volgend op die van de bevalling.

      2 De werknemer die op grond van [artikel 3:1][ref1] of [3:1a][ref2] verlof geniet meldt de werkgever de dag waarop
      het kind vanwege zijn medische toestand tijdens het voornoemde verlof in het ziekenhuis is opgenomen alsmede
      wanneer de opname is beëindigd. Uiterlijk op de laatste dag van het in de eerste zin bedoelde verlof geeft het
      ziekenhuis op verzoek van de werknemer een verklaring af, waarin de gehele duur van de opname van het kind in het
      ziekenhuis tijdens het verlof staat vermeld. De werknemer verstrekt deze verklaring onverwijld aan de werkgever.

      3 De werknemer meldt aan de werkgever het opnemen van het verlof in verband met adoptie zo mogelijk uiterlijk
      drie weken voor de dag van ingang van het verlof onder opgave van de omvang van het verlof. Bij de melding worden
      documenten gevoegd waaruit blijkt dat een kind ter adoptie is of zal worden opgenomen.


