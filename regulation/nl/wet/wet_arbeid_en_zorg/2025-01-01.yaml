  - number: 6:1
    text: |-
      1 De werknemer die als ouder in familierechtelijke betrekking staat tot een kind, heeft recht op verlof zonder
      behoud van loon. Indien de werknemer met ingang van hetzelfde tijdstip tot meer dan één kind in familierechtelijke
      betrekking komt te staan, bestaat er ten aanzien van ieder van die kinderen recht op verlof.

      2 De werknemer die blijkens de basisregistratie personen op hetzelfde adres woont als een kind en duurzaam de
      verzorging en de opvoeding van dat kind als eigen kind op zich heeft genomen, heeft recht op verlof zonder behoud
      van loon. Indien de werknemer met het oog op adoptie met ingang van hetzelfde tijdstip de verzorging en opvoeding
      van meer dan één kind op zich heeft genomen, bestaat er ten aanzien van ieder van die kinderen recht op verlof.
      In alle andere gevallen waarin de in de eerste volzin gestelde voorwaarden voor meer dan één kind met ingang van
      hetzelfde tijdstip worden vervuld, bestaat er slechts recht op één keer verlof.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel61
  - number: 6:1a
    text: |-
      De werkgever mag de werknemer niet benadelen wegens de omstandigheid dat de werknemer in of buiten rechte het recht
      op verlof, bedoeld in [artikel 6:1][ref1], geldend maakt of ter zake bijstand heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel61
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: 6:1
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6:2
    text: |-
      1 Het aantal uren verlof waarop de werknemer ten hoogste recht heeft bedraagt zesentwintig maal de arbeidsduur
      per week.

      2 Indien de arbeidsverhouding wordt beëindigd voordat het verlof volledig is genoten, heeft de werknemer, indien
      hij een nieuwe arbeidsverhouding aangaat, tegenover de nieuwe werkgever aanspraak op het resterende deel van
      het verlof met inachtneming van dit hoofdstuk. De werkgever is in dat geval verplicht aan de werknemer, op diens
      verzoek, een verklaring uit te reiken waaruit blijkt op hoeveel verlof de werknemer nog aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel62
  - number: 6:3
    text: |-
      1 Een werknemer als bedoeld in [artikel 3:6, eerste lid, aanhef en onderdeel a][ref1], heeft gedurende de periode
      dat het kind de leeftijd van een jaar nog niet heeft bereikt recht op uitkering over een periode van ten hoogste
      negen maal de arbeidsduur per week, waarin hij het verlof, bedoeld in [artikel 6:1, eerste lid][ref2], geniet.
      Indien de werknemer verlof als bedoeld in artikel 6:1, tweede lid, geniet in verband met een geadopteerd kind of
      een pleegkind, bestaat het recht op uitkering in afwijking van de vorige zin gedurende het eerste jaar na de dag
      van de feitelijke opneming ter adoptie of als pleegkind en voor zover het kind de leeftijd van acht jaren nog niet
      heeft bereikt.

      2 Indien de werknemer met ingang van hetzelfde tijdstip tot meer dan één kind in familierechtelijke betrekking komt
      te staan of indien de werknemer met het oog op adoptie met ingang van hetzelfde tijdstip de verzorging en opvoeding
      van meer dan één kind op zich heeft genomen, bestaat er ten aanzien van ieder van die kinderen recht op uitkering.
      Indien de werknemer met het oog op een pleegkind met ingang van hetzelfde tijdstip de verzorging en opvoeding van
      meer dan één kind op zich heeft genomen bestaat er slechts recht op één keer een uitkering.

      3 De uitkering bedraagt per dag 70% van het dagloon van de werknemer, bedoeld in
      [artikel 3:6, eerste lid, aanhef en onderdeel a][ref3], van de wet, doch ten hoogste 70% van het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref4], met betrekking tot een loontijdvak
      van een dag.

      4 Het dagloon, bedoeld in het derde lid, wordt berekend aan de hand van 1/261 deel van het loon, bedoeld in
      [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref5], dat de werknemer in de periode van een jaar,
      die eindigt op de laatste dag van het tweede aangiftetijdvak voorafgaande aan het aangiftetijdvak, waarin het recht
      op de uitkering is ontstaan, verdiende op grond van de arbeidsovereenkomst of de publiekrechtelijke aanstelling
      waaruit dat recht is ontstaan.

      5 Bij algemene maatregel van bestuur worden ten aanzien van de vaststelling en de herziening van het dagloon nadere
      en zo nodig afwijkende regels gesteld, onder meer over de vaststelling en de herziening van het dagloon wanneer de
      werknemer korter dan een jaar heeft gewerkt bij zijn werkgever.

      6 Op een op grond van dit artikel vastgesteld dagloon is [artikel 16 van de Ziektewet][ref6] van overeenkomstige
      toepassing.

      7 Een werknemer wiens arbeidsverhouding niet wordt beschouwd als dienstbetrekking op grond van
      [artikel 6 van de Ziektewet][ref7] en die uitsluitend om die reden niet wordt aangemerkt als werknemer
      in de zin van die wet, heeft recht op een uitkering als bedoeld in het eerste of tweede lid. De
      uitkering bedraagt naar rato van de overeengekomen arbeidsduur per week 70% van het loon, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref8], indien zijn recht
      op uitkering niet kan worden vastgesteld overeenkomstig het derde tot en met zesde lid. Bij de berekening van de
      uitkering wordt uitgegaan van een arbeidsduur van 36 uren per week.

      8 Een uitkering als bedoeld in dit artikel wordt niet uitbetaald als over dezelfde periode recht bestaat op een
      uitkering in verband met zwangerschap en bevalling dan wel adoptie of pleegzorg als bedoeld in [hoofdstuk 3][ref9]
      of een uitkering in verband met aanvullend geboorteverlof als bedoeld in [hoofdstuk 4][ref10].


