  - number: 1:6
    text: |-
      1 De werknemer die verlof geniet op grond van deze wet behoudt gedurende het verlof de reeds verworven of in opbouw
      zijnde rechten die uit de arbeidsverhouding voortvloeien. Na afloop van het verlof zijn die rechten, met inbegrip
      van de uit de wet, collectieve arbeidsovereenkomst dan wel gebruiken voortvloeiende veranderingen, van toepassing.

      2 De werknemer die verlof geniet op grond van deze wet wordt in staat gesteld om na afloop van het verlof
      onder voor hem niet minder gunstige voorwaarden en omstandigheden terug te keren in de oorspronkelijke of een
      gelijkwaardige functie en te profiteren van elke verbetering van arbeidsvoorwaarden waarop hij aanspraak had kunnen
      maken indien hij het verlof niet had genoten.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel16
  - number: 1:7
    text: |-
      De werkgever mag de werknemer niet benadelen wegens de omstandigheid dat de werknemer in of buiten rechte een recht
      op verlof als bedoeld in deze wet geldend maakt, ter zake bijstand heeft verleend, of hieromtrent een klacht binnen
      de onderneming heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel17
  - number: 3:1
    text: |-
      1 De vrouwelijke werknemer heeft in verband met haar bevalling recht op zwangerschaps- en bevallingsverlof.

      2 Het recht op zwangerschapsverlof bestaat vanaf zes weken voor de dag na de vermoedelijke datum van bevalling,
      of vanaf tien weken voor die dag indien het een zwangerschap van meer dan één kind betreft, zoals aangegeven in
      een aan de werkgever overgelegde schriftelijke verklaring van een arts of verloskundige, tot en met de dag van de
      bevalling. Het zwangerschapsverlof gaat in uiterlijk vier weken voor de dag na de vermoedelijke datum van bevalling
      of uiterlijk acht weken voor die dag indien het een zwangerschap van meer dan één kind betreft.

      3 Het bevallingsverlof gaat in op de dag na de bevalling en bedraagt tien aaneengesloten weken vermeerderd met het
      aantal dagen dat het zwangerschapsverlof tot en met de vermoedelijke datum van bevalling, dan wel, indien eerder
      gelegen, tot en met de werkelijke datum van bevalling, minder dan zes weken heeft bedragen of, indien het een
      zwangerschap van meer dan een kind betreft, minder dan tien weken heeft bedragen.

      4 Voor de toepassing van het derde lid worden dagen waarover de vrouwelijke werknemer op grond van
      [artikel 29a, tweede lid, van de Ziektewet][ref1] ziekengeld heeft genoten in de periode dat zij recht heeft op
      zwangerschapsverlof, maar dat verlof nog niet is ingegaan, aangemerkt als dagen waarover zij zwangerschapsverlof
      heeft genoten.

      5 Als een kind tijdens het bevallingsverlof vanwege zijn medische toestand in een ziekenhuis is opgenomen, wordt
      het bevallingsverlof verlengd met het aantal opnamedagen, te rekenen vanaf de achtste dag van opname tot en met de
      laatste dag van het bevallingsverlof tot een maximum van tien weken. De in de eerste zin bedoelde verlenging van
      het bevallingsverlof is uitsluitend van toepassing voor zover de ziekenhuisopname langer duurt dan het aantal dagen
      waarmee het bevallingsverlof als gevolg van de werkelijke datum van bevalling op grond van het derde lid wordt
      verlengd.

      6 In afwijking van het derde lid kan de vrouwelijke werknemer de werkgever verzoeken het bevallingsverlof op te
      delen na 6 weken waarop het recht op dat verlof is ingegaan. De vrouwelijke werknemer kan dit deel van het verlof
      opnemen gedurende het tijdvak van 30 weken, welk tijdvak aanvangt de dag nadat het bevallingsverlof is opgedeeld.
      Het verzoek wordt gedaan uiterlijk drie weken nadat het verlof is ingegaan.

      7 De omvang van het bevallingsverlof dat is opgedeeld en dat later wordt opgenomen is gelijk aan de arbeidsduur per
      week ten tijde van het bevallingsverlof dat volgt na de werkelijke datum van de bevalling.

      8 De werkgever stemt uiterlijk twee weken nadat het verzoek, bedoeld in het zesde lid, is gedaan in met het
      verzoek, tenzij een zwaarwegend bedrijfs- of dienstbelang zich hiertegen verzet.

      9 Ingeval van toepassing van het vijfde lid, ziet het verzoek, bedoeld in het zesde lid, op de periode na afloop
      van de verlenging, bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
