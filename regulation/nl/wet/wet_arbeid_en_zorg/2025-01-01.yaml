  - number: 4:5
    text: |-
      1 Indien de werknemer op grond van enige wettelijk voorgeschreven verzekering of krachtens enige verzekering
      of uit enig fonds waarin de deelneming is overeengekomen bij of voortvloeit uit de arbeidsovereenkomst of
      publiekrechtelijke aanstelling, een geldelijke uitkering toekomt, wordt het loon verminderd met het bedrag van
      die uitkering.

      2 Het loon wordt verminderd met het bedrag van de door de werkgever vergoede onkosten die de werknemer door het
      niet verrichten van zijn arbeid heeft bespaard.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel45
  - number: 4:6
    text: |-
      1 Dagen of gedeelten van dagen waarop de werknemer zijn arbeid niet verricht wegens het verlof, bedoeld in
      [artikel 4:1][ref1], kunnen slechts indien in een voorkomend geval de werknemer ermee instemt worden aangemerkt
      als vakantie, met dien verstande dat de werknemer ten minste recht houdt op het wettelijk minimum aan vakantie-
      aanspraken.

      2 Dagen of gedeelten van dagen waarop de werknemer zijn arbeid niet verricht wegens het verlof, bedoeld in de
      [artikelen 4:2][ref2] of [4:2a][ref3], kunnen niet worden aangemerkt als vakantie.


