  - number: 5:1
    text: |-
      1 De werknemer heeft recht op verlof voor de noodzakelijke verzorging in verband met ziekte van een persoon als
      bedoeld in het tweede lid.

      2 Onder een persoon als bedoeld in het eerste lid, wordt verstaan:

      a. de echtgenoot, de geregistreerde partner of de persoon met wie de werknemer ongehuwd samenwoont;

      b. een kind tot wie de werknemer als ouder in een familierechtelijke betrekking staat;

      c. een kind van de echtgenoot, de geregistreerde partner of de persoon met wie de werknemer ongehuwd samenwoont;

      d. een pleegkind dat blijkens de basisregistratie personen op hetzelfde adres woont als de werknemer en dat hij als
      pleegouder als bedoeld in [artikel 1.1 van de Jeugdwet][ref1] verzorgt;

      e. een bloedverwant in de eerste of tweede graad;

      f. degene die, zonder dat er sprake is van een arbeidsrelatie, deel uitmaakt van de huishouding van de werknemer;
      of

      g. degene met wie de werknemer anderszins een sociale relatie heeft, voor zover de te verlenen verzorging
      rechtstreeks voortvloeit uit die relatie en redelijkerwijs door de werknemer moet worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1.1'
  - number: 5:2
    text: |-
      Het verlof bedraagt in elke periode van 12 achtereenvolgende maanden ten hoogste twee maal de arbeidsduur per week.
      De periode van 12 maanden gaat in op de eerste dag waarop het verlof wordt genoten.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel52
  - number: 5:3
    text: |-
      De werknemer meldt vooraf aan de werkgever dat hij het verlof, bedoeld in artikel 5:1 opneemt onder opgave van
      de reden. Indien dit niet mogelijk is, meldt de werknemer het opnemen van het verlof zo spoedig mogelijk aan de
      werkgever onder opgave van de reden. Bij die melding geeft de werknemer ook de omvang, de wijze van opneming en de
      vermoedelijke duur van het verlof aan.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel53
  - number: 5:4
    text: |-
      1 Het verlof gaat in op het tijdstip waarop de werknemer het opnemen ervan meldt aan de werkgever.

      2 Het verlof vangt niet aan of eindigt in ieder geval zodra de werkgever aan de werknemer kenbaar maakt dat hij
      tegen het opnemen van het verlof onderscheidenlijk de voortzetting daarvan een zodanig zwaarwegend bedrijfs- of
      dienstbelang heeft, dat het belang van de werknemer daarvoor naar maatstaven van redelijkheid en billijkheid moet
      wijken.

      3 Een werkgever die nadat een melding door de werknemer, niet zijnde een militaire ambtenaar, hem bereikt heeft en
      naar aanleiding daarvan geen beroep doet op een zwaarwegend bedrijfs- of dienstbelang, kan dit nadien evenmin.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel54
  - number: 5:5
    text: |-
      De werkgever kan achteraf van de werknemer verlangen dat hij aannemelijk maakt dat hij zijn arbeid niet heeft
      verricht in verband met de noodzakelijke verzorging van een persoon als bedoeld in artikel 5:1.
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel55
  - number: 5:6
    text: |-
      1 Voorzover het loon niet meer bedraagt dan het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1], met betrekking tot een loontijdvak
      van een dag, behoudt de werknemer, die anders dan op grond van een publiekrechtelijke aanstelling arbeid verricht,
      gedurende het verlof, bedoeld in [artikel 5:1][ref2], recht op 70% van het loon, maar ten minste op het voor hem
      geldende wettelijke minimumloon.

      2 Het eerste lid is van overeenkomstige toepassing op de werknemer, die arbeid verricht op grond van een
      publiekrechtelijke aanstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel51
    url: https://wetten.overheid.nl/BWBR0013008/2025-01-01#Artikel56
    references:
      - id: ref1
