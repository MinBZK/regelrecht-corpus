  - number: 3:8
    text: |-
      1 De vrouwelijke gelijkgestelde heeft in verband met haar zwangerschap en bevalling recht op uitkering gedurende
      ten minste zestien weken, overeenkomstig het tweede en derde lid.

      2 Het recht op uitkering in verband met zwangerschap vangt aan zes weken voor de dag na de vermoedelijke datum van
      bevalling, of tien weken voor die dag indien het een zwangerschap van meer dan één kind betreft, zoals aangegeven
      in een schriftelijke verklaring van een arts of verloskundige, tot en met de dag van de bevalling. Indien de
      vrouwelijke gelijkgestelde dat wenst vangt het recht op uitkering in verband met zwangerschap aan op een later
      tijdstip, doch uiterlijk vier weken voor de dag na de vermoedelijke datum van bevalling of uiterlijk acht weken
      voor die dag indien het een zwangerschap van meer dan één kind betreft.

      3 Het recht op uitkering in verband met bevalling vangt aan op de dag na de bevalling en bedraagt tien
      aaneengesloten weken vermeerderd met het aantal dagen dat de uitkering in verband met zwangerschap tot en met de
      vermoedelijke datum van bevalling, dan wel, indien eerder gelegen, tot en met de werkelijke datum van bevalling,
      minder dan zes weken heeft bedragen of, indien het een zwangerschap van meer dan een kind betreft, minder dan tien
      weken heeft bedragen.

      4 Voor de toepassing van het derde lid worden dagen waarover de vrouwelijke gelijkgestelde ziekengeld heeft genoten
      in de periode dat zij recht heeft op uitkering in verband met zwangerschap maar die uitkering nog niet is ingegaan,
      aangemerkt als dagen waarover zij uitkering in verband met zwangerschap heeft genoten.

      5 Als een kind tijdens de periode waarop een recht op uitkering in verband met bevalling bestaat vanwege zijn
      medische toestand in het ziekenhuis is opgenomen, wordt het recht op uitkering in verband met bevalling verlengd
      met de tijd dat het kind in het ziekenhuis heeft doorgebracht vanaf de achtste dag van opname tot en met de laatste
      dag waarop het recht op uitkering bestaat tot een maximum van tien weken. De in de eerste zin bedoelde verlenging
      van het recht op uitkering in verband met de bevalling is uitsluitend van toepassing voor zover de aldaar bedoelde
      ziekenhuisopname langer duurt dan het aantal dagen waarmee de uitkering in verband met de bevalling als gevolg van
      de werkelijke datum van bevalling op grond van het derde lid wordt verlengd. [Artikel 3:3, tweede lid][ref1], is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel33
