  - number: 3:18
    text: |-
      1 De vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst heeft gedurende de periode dat het zwangerschaps- en
      bevallingsverlof wordt genoten overeenkomstig [artikel 3:1, tweede en derde lid][ref1], recht op uitkering. Artikel
      3:1, vijfde lid, en [artikel 3:3, tweede lid, tweede volzin][ref2], zijn van overeenkomstige toepassing.

      2 De vrouwelijke zelfstandige heeft in verband met haar zwangerschap en bevalling recht op uitkering gedurende ten
      minste zestien weken. [Artikel 3:1, vijfde lid][ref3], en [artikel 3:3, tweede lid, tweede volzin][ref4], zijn van
      overeenkomstige toepassing.

      3 Het recht op uitkering in verband met zwangerschap vangt aan zes weken voor de dag na de vermoedelijke datum van
      bevalling, of tien weken voor die dag indien het een zwangerschap van meer dan één kind betreft, zoals aangegeven
      in een schriftelijke verklaring van een arts of verloskundige, tot en met de dag van de bevalling. Indien de
      vrouwelijke zelfstandige dat wenst, vangt het recht op uitkering in verband met zwangerschap aan op een later
      tijdstip, doch uiterlijk vier weken voor de dag na de vermoedelijke datum van bevalling of uiterlijk acht weken
      voor die dag indien het een zwangerschap van meer dan één kind betreft.

      4 Het recht op uitkering in verband met bevalling vangt aan op de dag na de bevalling en bedraagt tien
      aaneengesloten weken vermeerderd met het aantal dagen dat de uitkering in verband met zwangerschap tot en met de
      vermoedelijke datum van bevalling, dan wel, indien eerder gelegen, tot en met de werkelijke datum van bevalling,
      minder dan zes weken heeft bedragen of, indien het een zwangerschap van meer dan een kind betreft, minder dan tien
      weken heeft bedragen.

      5 Voor de toepassing van het vierde lid worden dagen waarover de vrouwelijke zelfstandige ziekengeld heeft genoten
      in de periode dat zij recht heeft op uitkering in verband met zwangerschap maar die uitkering nog niet is ingegaan,
      aangemerkt als dagen waarover zij uitkering in verband met zwangerschap heeft genoten.

      6 Geen recht op uitkering heeft de vreemdeling die niet rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onderdeel a tot en met e en l, van de Vreemdelingenwet 2000][ref5]

      7 Bij algemene maatregel van bestuur kan worden afgeweken van het zesde lid ten aanzien van:

      a. vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;

      b. vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref6] rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref7].

      8 Zo nodig in afwijking van het zesde en het zevende lid en de daarop berustende bepalingen, bestaat recht op een
      uitkering voor de persoon voor wie dit recht voortvloeit uit de toepassing van bepalingen van een verdrag of van
      een besluit van een volkenrechtelijke organisatie en bestaat geen recht op een uitkering voor de persoon op wie op
      grond van een verdrag of een besluit van een volkenrechtelijke organisatie de wetgeving van een andere mogendheid
      van toepassing is.

      9 Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het zesde lid en van
      [artikel 3:17, eerste lid][ref8], uitbreiding dan wel beperking worden gegeven aan de kring van verzekerden.

      10 De zelfstandige, de beroepsbeoefenaar op arbeidsovereenkomst, of de persoon wiens arbeidsverhouding
      gelijkgesteld is met een dienstbetrekking als bedoeld in [artikel 4][ref9] of [5 van de Ziektewet][ref10], en die
      partner is als bedoeld in [artikel 3:1a, tweede lid][ref11], heeft, indien de moeder overlijdt tijdens de periode,
      waarin recht op uitkering bestaat op grond van [artikel 3:7][ref12], [3:8][ref13] of [3:18][ref14], recht op
      uitkering gedurende het resterende aantal weken waarover voor de moeder nog recht op uitkering zou bestaan, met
      dien verstande dat [artikel 3:1, vijfde lid][ref15], van overeenkomstige toepassing is.

      11 De zelfstandige, de beroepsbeoefenaar op arbeidsovereenkomst of de persoon wiens arbeidsverhouding gelijkgesteld
      is met een dienstbetrekking als bedoeld in [artikel 4][ref16] of [5 van de Ziektewet][ref17], en die partner is
      als bedoeld in [artikel 3:1a, tweede lid][ref18], heeft recht op uitkering, indien de moeder, die geen recht had op
      bevallingsverlof of een uitkering als bedoeld in [afdeling 2 van hoofdstuk 3][ref19], overlijdt voordat tien weken
      na de dag van de geboorte van het kind zijn verstreken. Het recht bestaat vanaf de dag van overlijden en eindigt
      tien weken na de dag van de geboorte van het kind, met dien verstande dat [artikel 3:1, vijfde lid][ref20], van
      overeenkomstige toepassing is.


