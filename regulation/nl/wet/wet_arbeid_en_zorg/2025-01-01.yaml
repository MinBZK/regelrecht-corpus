  - number: 3:12
    text: |-
      1 Indien de vrouwelijke gelijkgestelde, die in aanmerking wenst te komen voor toekenning van een uitkering
      in verband met zwangerschap en bevalling, geen werkgever heeft, doet zij de aanvraag daartoe bij het
      Uitvoeringsinstituut werknemersverzekeringen uiterlijk twee weken voor de datum waarop zij het recht op
      uitkering wil laten ingaan. [Artikel 3:11, eerste lid, tweede volzin][ref1], is van toepassing. Indien het
      recht op uitkering van de vrouwelijke gelijkgestelde, bedoeld in de eerste volzin, wordt verlengd op grond van
      [artikel 3:8, vijfde lid][ref2], brengt zij het Uitvoeringsinstituut werknemersverzekeringen daarvan op de hoogte.
      [Artikel 3:3, tweede lid, tweede volzin][ref3], is van overeenkomstige toepassing. De vrouwelijke gelijkgestelde
      verstrekt aan het Uitvoeringsinstituut werknemersverzekeringen de op haar verzoek door het ziekenhuis af te geven
      verklaring, bedoeld in artikel 3:3, tweede lid.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan de vrouwelijke gelijkgestelde, uiterlijk binnen een jaar
      na het tijdstip waarop de uitkering geëindigd is, een verklaring vragen van een arts of verloskundige over de
      vermoedelijke datum van bevalling, welke is opgemaakt uiterlijk twee weken voor de datum van ingang van het
      zwangerschapsverlof onderscheidenlijk twee weken voor de datum waarop de vrouwelijke gelijkgestelde het recht op
      uitkering wil laten ingaan.

      3 Indien de gelijkgestelde, die in aanmerking wenst te komen voor toekenning van uitkering in verband
      met adoptie of pleegzorg, geen werkgever heeft, doet hij de aanvraag daartoe bij het Uitvoeringsinstituut
      werknemersverzekeringen uiterlijk twee weken voor ingang van de datum waarop hij het recht op uitkering wil laten
      ingaan. [Artikel 3:11, derde lid, tweede en derde volzin][ref4], is van toepassing.

      4 Indien de aanvraag niet tijdig wordt gedaan, wordt de uitkering uitsluitend toegekend voor zover het tijdvak
      waarin sprake was van recht op uitkering in verband met zwangerschap en bevalling, adoptie of pleegzorg, valt in
      het jaar voorafgaand aan de datum van aanvraag. Het Uitvoeringsinstituut werknemersverzekeringen kan in bijzondere
      gevallen ten gunste van de gelijkgestelde afwijken van de eerste zin.

      5 Voor de toepassing van dit artikel wordt onder gelijkgestelde mede verstaan degene die recht op uitkering heeft
      op grond van [artikel 3:10][ref5].


