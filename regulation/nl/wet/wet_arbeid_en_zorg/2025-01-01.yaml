  - number: 3:21
    text: |-
      1 De vrouwelijke zelfstandige of vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst kan een recht op uitkering op
      grond van [artikel 3:18][ref1], tezamen met het recht op vakantie-uitkering daarover, genieten in de vorm van een
      uitkering ter zake van vervanging.

      2 Toekenning van een uitkering ter zake van vervanging, bedoeld in het eerste lid, is uitsluitend mogelijk:

      a. indien ter vervanging van de vrouwelijke zelfstandige of vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst
      een persoon werkzaam is gedurende de periode dat het recht op uitkering bestaat, en

      b. de persoon die als vervanger werkzaam is, ter beschikking wordt gesteld door een rechtspersoonlijkheid
      bezittende instelling, die zich krachtens haar statuten ten doel stelt arbeidskrachten ter beschikking te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel318
