      - id: ref6
        bwb_id: BWBR0008656
        artikel: 21b
  - number: 3:27.1.b
    text: |-
      ter zake van herziening of intrekking: [artikel 18][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel18
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '18'
  - number: 3:27.1.c
    text: |-
      ter zake van de vakantie-uitkering: de [artikelen 25 tot en met 27][ref1], [40][ref2] en [60][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel60
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
