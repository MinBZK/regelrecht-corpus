        bwb_id: BWBR0008656
        artikel: '40'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '60'
  - number: 3:27.1.d
    text: |-
      ter zake van oproeping en ondervraging: de [artikelen 41, eerste lid][ref1], en [42][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel42
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '42'
  - number: 3:27.1.e
    text: |-
      ter zake van maatregelen: de [artikelen 45][ref1], [46, onderdeel d][ref2], en [47][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel47
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
