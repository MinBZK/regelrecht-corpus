$id: wet_arbeid_en_zorg
regulatory_layer: WET
publication_date: '2019-10-31'
valid_from: '2005-01-01'
bwb_id: BWBR0013008
url: https://wetten.overheid.nl/BWBR0013008/2005-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels vast te stellen, waarin een nieuw evenwicht tot
    stand wordt gebracht tussen arbeid en zorg in de ruimste zin;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#ArtikelAanhef
articles:
  - number: 1:1
    text: 'Tenzij anders is bepaald, wordt voor de toepassing van deze wet verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel11
  - number: 1:1.a
    text: |-
      werkgever: degene die een ander krachtens arbeidsovereenkomst naar burgerlijk recht of publiekrechtelijke
      aanstelling arbeid laat verrichten;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel11
  - number: 1:1.b
    text: 'werknemer: de ander, bedoeld in onderdeel a.'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel11
  - number: 1:2.1
    text: |-
      Tenzij anders is bepaald, wordt voor de toepassing van deze wet verstaan onder loon: de naar tijdruimte
      vastgestelde vergoeding die de werkgever aan de werknemer verschuldigd is voor de bedongen arbeid.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel12
  - number: 1:2.2
    text: |-
      Voor de toepassing van deze wet wordt, indien het loon op andere wijze dan naar tijdruimte is vastgesteld, als loon
      beschouwd het gemiddelde loon dat de werknemer, wanneer hij geen gebruik had gemaakt van een door deze wet gegeven
      recht op verlof, gedurende die tijd had kunnen verdienen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel12
  - number: 1:3.1
    text: 'Voor de toepassing van deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel13
  - number: 1:3.1.a
    text: |-
      Arbeidsongeschiktheidsfonds: het fonds, bedoeld in
      [artikel 72 van de Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel72
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '72'
  - number: 1:3.1.b
    text: |-
      Algemeen Werkloosheidsfonds: het fonds, bedoeld in [artikel 103 van de Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel103
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '103'
  - number: 1:3.1.c
    text: |-
      Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 1:3.1.d
    text: |-
      Centrale organisatie werk en inkomen: de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: 1:3.1.e
    text: |-
      militaire ambtenaar: de militaire ambtenaar, bedoeld in
      [artikel 1, eerste en tweede lid, van de Militaire Ambtenarenwet 1931][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
  - number: 1:3.1.f
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid.'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel13
  - number: 1:3.2
    text: |-
      Voor de toepassing van deze wet is sprake van ongehuwd samenwonen als twee ongehuwde personen een gezamenlijke
      huishouding voeren. Van een gezamenlijke huishouding als bedoeld in de eerste volzin is sprake indien de
      betrokkenen hun hoofdverblijf hebben in dezelfde woning en blijk geven zorg te dragen voor elkaar door middel van
      het leveren van een bijdrage in de kosten van de huishouding danwel op andere wijze in elkaars verzorging voorzien.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel13
  - number: 1:4
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt met een collectieve arbeidsovereenkomst
      gelijkgesteld een regeling door of namens een daartoe bevoegd bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel14
  - number: 3:1.1
    text: De vrouwelijke werknemer heeft in verband met haar bevalling recht op zwangerschaps- en bevallingsverlof.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel31
  - number: 3:1.2
    text: |-
      Het recht op zwangerschapsverlof bestaat vanaf zes weken voor de dag na de vermoedelijke datum van bevalling, zoals
      aangegeven in een aan de werkgever overgelegde schriftelijke verklaring van een arts of verloskundige, tot en met
      de dag van de bevalling. Het zwangerschapsverlof gaat in uiterlijk vier weken voor de dag na de vermoedelijke datum
      van bevalling.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel31
  - number: 3:1.3
    text: |-
      Het bevallingsverlof gaat in op de dag na de bevalling en bedraagt tien aaneengesloten weken vermeerderd met het
      aantal dagen dat het zwangerschapsverlof tot en met de vermoedelijke datum van bevalling, dan wel, indien eerder
      gelegen, tot en met de werkelijke datum van bevalling, minder dan zes weken heeft bedragen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel31
  - number: 3:1.4
    text: |-
      Voor de toepassing van het derde lid worden dagen waarover de vrouwelijke werknemer op grond van
      [artikel 29a, tweede lid, van de Ziektewet][ref1] ziekengeld heeft genoten in de periode dat zij recht heeft op
      zwangerschapsverlof, maar dat verlof nog niet is ingegaan, aangemerkt als dagen waarover zij zwangerschapsverlof
      heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 29a
  - number: 3:2.1
    text: De werknemer heeft in verband met de adoptie van een kind recht op verlof zonder behoud van loon.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel32
  - number: 3:2.2
    text: |-
      Het recht op verlof in verband met adoptie bestaat gedurende een tijdvak van achttien weken en bedraagt ten
      hoogste vier aaneengesloten weken. Het recht bestaat vanaf twee weken vóór de eerste dag dat de feitelijke opneming
      ter adoptie een aanvang heeft genomen of zal nemen, zoals die dag is aangeduid in een door de werknemer aan de
      werkgever overgelegd document waaruit blijkt dat een kind ter adoptie is of zal worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel32
  - number: 3:2.3
    text: |-
      Indien als gevolg van een adoptieverzoek tegelijkertijd twee of meer kinderen feitelijk ter adoptie worden
      opgenomen, bestaat het recht op verlof slechts ten aanzien van één van die kinderen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel32
  - number: 3:2.4
    text: |-
      Het eerste, tweede en derde lid en de artikelen 3:3, tweede lid, 3:4 en 3:5 zijn van overeenkomstige toepassing op
      de werknemer die een pleegkind opneemt als bedoeld in artikel 5:1, tweede lid, onder d.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel32
  - number: 3:3.1
    text: 'De vrouwelijke werknemer meldt aan de werkgever:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel33
  - number: 3:3.1.a
    text: de dag met ingang waarvan zij het zwangerschapsverlof opneemt uiterlijk drie weken voor die dag;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel33
  - number: 3:3.1.b
    text: haar bevalling uiterlijk op de tweede dag volgend op die van de bevalling.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel33
  - number: 3:3.2
    text: |-
      De werknemer meldt aan de werkgever het opnemen van het verlof in verband met adoptie zo mogelijk uiterlijk drie
      weken voor de dag van ingang van het verlof onder opgave van de omvang van het verlof. Bij de melding worden
      documenten gevoegd waaruit blijkt dat een kind ter adoptie is of zal worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel33
  - number: 3:4
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer zijn arbeid niet verricht wegens het verlof, bedoeld in de
      artikelen 3:1en 3:2, kunnen niet worden aangemerkt als vakantie.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel34
  - number: 3:5.1
    text: Behoudens het tweede lid kan van deze afdeling niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel35
  - number: 3:5.2
    text: |-
      In geval van buitengewone omstandigheden als bedoeld in de [Coördinatiewet uitzonderingstoestanden][ref1] kan Onze
      Minister van Defensie voor de militaire ambtenaar afwijken of doen afwijken van de artikelen 3:1 en 3:2.


      [ref1]: https://wetten.overheid.nl/BWBR0007981
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007981
  - number: 3:6.1
    text: 'Voor de toepassing van deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel36
  - number: 3:6.1.a
    text: |-
      werknemer: de werknemer, bedoeld in artikel 1:1, onderdeel b, met uitzondering van degene die op grond van de
      [Eerste Afdeling, Paragraaf 2, van de Ziektewet](onbekend) geen werknemer in de zin van die [wet][ref1] is;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 3:6.1.b
    text: |-
      gelijkgestelde: degene die geen werknemer is als bedoeld in artikel 1:1, onderdeel b, doch op grond van de [Eerste
      Afdeling, Paragraaf 2, van de Ziektewet](onbekend), met uitzondering van [artikel 8a][ref1], wel werknemer in de
      zin van die [wet][ref2] is;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0001888
  - number: 3:6.1.c
    text: |-
      werkgever: de werkgever, bedoeld in artikel 1:1, onderdeel a, of de artikelen [10][ref1], [11][ref2] of
      [12 van de Ziektewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel12
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '12'
  - number: 3:6.2
    text: 'Voor de toepassing van deze paragraaf wordt mede verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel36
  - number: 3:6.2.a
    text: |-
      werknemer: de werknemer, bedoeld in artikel 1:1, onderdeel b, die vrijwillig verzekerd is als bedoeld in de [Tweede
      Afdeling, Hoofdstuk IV, van de Ziektewet](onbekend);
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel36
  - number: 3:6.2.b
    text: |-
      gelijkgestelde: degene die geen werknemer is als bedoeld in onderdeel a doch wel vrijwillig verzekerd is als
      bedoeld in de [Tweede Afdeling, Hoofdstuk IV, van de Ziektewet](onbekend).
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel36
  - number: 3:7.1
    text: |-
      De vrouwelijke werknemer heeft gedurende de periode dat het zwangerschaps- of bevallingsverlof wordt genoten
      overeenkomstig artikel 3:1, tweede en derde lid, recht op uitkering.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel37
  - number: 3:7.2
    text: |-
      De werknemer heeft gedurende de periode dat het verlof in verband met adoptie of de opname van een pleegkind wordt
      genoten overeenkomstig artikel 3:2, tweede lid of vierde lid, recht op uitkering.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel37
  - number: 3:8.1
    text: |-
      De vrouwelijke gelijkgestelde heeft in verband met haar zwangerschap en bevalling recht op uitkering gedurende ten
      minste zestien weken.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel38
  - number: 3:8.2
    text: |-
      Het recht op uitkering in verband met zwangerschap vangt aan zes weken voor de dag na de vermoedelijke datum van
      bevalling, zoals aangegeven in een schriftelijke verklaring van een arts of verloskundige, tot en met de dag van de
      bevalling. Indien de vrouwelijke gelijkgestelde dat wenst vangt het recht op uitkering in verband met zwangerschap
      aan op een later tijdstip, doch uiterlijk vier weken voor de dag na de vermoedelijke datum van bevalling.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel38
  - number: 3:8.3
    text: |-
      Het recht op uitkering in verband met bevalling vangt aan op de dag na de bevalling en bedraagt tien aaneengesloten
      weken vermeerderd met het aantal dagen dat de uitkering in verband met zwangerschap tot en met de vermoedelijke
      datum van bevalling, dan wel, indien eerder gelegen, tot en met de werkelijke datum van bevalling, minder dan zes
      weken heeft bedragen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel38
  - number: 3:8.4
    text: |-
      Voor de toepassing van het derde lid worden dagen waarover de vrouwelijke gelijkgestelde ziekengeld heeft genoten
      in de periode dat zij recht heeft op uitkering in verband met zwangerschap maar die uitkering nog niet is ingegaan,
      aangemerkt als dagen waarover zij uitkering in verband met zwangerschap heeft genoten.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel38
  - number: 3:9.1
    text: De gelijkgestelde heeft in verband met de adoptie van een kind recht op uitkering.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel39
  - number: 3:9.2
    text: |-
      Het recht op uitkering in verband met adoptie bedraagt ten hoogste vier aaneengesloten weken gedurende een tijdvak
      van achttien weken. Het tijdvak van achttien weken gaat in twee weken vóór de eerste dag dat de feitelijke opneming
      ter adoptie een aanvang heeft genomen of zal nemen, zoals die dag is aangeduid in een door de werknemer aan de
      werkgever overgelegd document waaruit blijkt dat een kind ter adoptie is of zal worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel39
  - number: 3:9.3
    text: |-
      Indien als gevolg van een adoptieverzoek tegelijkertijd twee of meer kinderen feitelijk ter adoptie worden
      opgenomen, bestaat het recht op uitkering slechts ten aanzien van één van die kinderen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel39
  - number: 3:9.4
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op de werknemer die een pleegkind opneemt als
      bedoeld in artikel 5:1, tweede lid, onder d.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel39
  - number: 3:10.1
    text: |-
      Een recht op uitkering als bedoeld in de [artikelen 3:7, eerste lid][ref1], en [3:8, eerste lid][ref2], komt mede
      toe aan de vrouw wier bevalling waarschijnlijk is onderscheidenlijk plaatsvindt, binnen een periode van tien weken
      na het tijdstip dat zij niet langer werknemer of gelijkgestelde is als bedoeld in [artikel 3:6, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel310
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3:10.2
    text: |-
      Een recht op uitkering als bedoeld in de [artikelen 3:7, tweede lid][ref1], en [3:9, eerste lid][ref2], komt mede
      toe aan de persoon die, op de eerste dag dat een kind feitelijk ter adoptie is opgenomen, korter dan tien weken
      geen werknemer of gelijkgestelde meer is als bedoeld in [artikel 3:6, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel310
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3:10.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing op de persoon die een pleegkind opneemt als bedoeld in
      [artikel 5:1, tweede lid, onder d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel5
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel310
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 3:11.1
    text: |-
      De vrouwelijke werknemer of gelijkgestelde, die in aanmerking wenst te komen voor toekenning van een uitkering
      in verband met zwangerschap en bevalling doet de aanvraag daartoe door tussenkomst van de werkgever bij
      het Uitvoeringsinstituut werknemersverzekeringen uiterlijk twee weken voor de datum van ingang van het
      zwangerschapsverlof onderscheidenlijk de datum waarop zij het recht op uitkering wil laten ingaan. Bij die aanvraag
      wordt gemeld:
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel311
  - number: 3:11.1.a
    text: |-
      de vermoedelijke datum van bevalling, onder overlegging van de verklaring van een arts of van een verloskundige
      waarin die datum is aangegeven;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel311
  - number: 3:11.1.b
    text: |-
      de datum waarop het zwangerschapsverlof ingaat dan wel de datum waarop de gelijkgestelde het recht op uitkering wil
      laten ingaan.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel311
  - number: 3:11.2
    text: |-
      De werknemer of gelijkgestelde, die in aanmerking wenst te komen voor toekenning van een uitkering in verband
      met adoptie of pleegzorg, doet de aanvraag daartoe door tussenkomst van de werkgever bij het Uitvoeringsinstituut
      werknemersverzekeringen uiterlijk twee weken voor de datum van ingang van het verlof in verband met adoptie of
      pleegzorg onderscheidenlijk de datum waarop hij het recht op uitkering wil laten ingaan. Bij de aanvraag worden
      documenten gevoegd waaruit blijkt dat een kind ter adoptie of pleegzorg is of zal worden opgenomen en wanneer die
      opneming ter adoptie of pleegzorg heeft plaatsgevonden of zal plaatsvinden. Bij die aanvraag wordt de datum waarop
      het verlof in verband met adoptie of pleegzorg ingaat gemeld dan wel de datum waarop hij het recht op uitkering wil
      laten ingaan.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel311
  - number: 3:11.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan in bijzondere gevallen ten gunste van de werknemer of
      gelijkgestelde afwijken van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel311
  - number: 3:12.1
    text: |-
      Indien de vrouwelijke gelijkgestelde, die in aanmerking wenst te komen voor toekenning van een uitkering in verband
      met zwangerschap en bevalling, geen werkgever heeft, doet zij de aanvraag daartoe bij het Uitvoeringsinstituut
      werknemersverzekeringen uiterlijk twee weken voor de datum waarop zij het recht op uitkering wil laten ingaan.
      [Artikel 3:11, eerste lid, tweede volzin][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel312
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3:12.2
    text: |-
      Indien de gelijkgestelde, die in aanmerking wenst te komen voor toekenning van uitkering in verband met adoptie of
      pleegzorg, geen werkgever heeft, doet hij de aanvraag daartoe bij het Uitvoeringsinstituut werknemersverzekeringen
      uiterlijk twee weken voor ingang van de datum waarop hij het recht op uitkering wil laten ingaan.
      [Artikel 3:11, tweede lid, tweede en derde volzin][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel312
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3:12.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan in bijzondere gevallen ten gunste van de gelijkgestelde
      afwijken van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel312
  - number: 3:12.4
    text: |-
      Voor de toepassing van dit artikel wordt onder gelijkgestelde mede verstaan degene die recht op uitkering heeft op
      grond van [artikel 3:10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel312
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3:13.1
    text: De uitkering, bedoeld in deze paragraaf, bedraagt per dag het dagloon.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel313
  - number: 3:13.2
    text: |-
      Het dagloon wordt voor de werknemer en de gelijkgestelde, bedoeld in [artikel 3:6, eerste lid][ref1],
      en de betrokkene, bedoeld in [artikel 3:10, eerste en tweede lid][ref2], vastgesteld
      overeenkomstig [artikel 15 van de Ziektewet][ref3] en de daarop berustende bepalingen.
      [Artikel 9, eerste lid, tweede volzin, van de Coördinatiewet Sociale Verzekering][ref4] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel313
    references:
