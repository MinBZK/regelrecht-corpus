  - number: 3:17
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder beroepsbeoefenaar op
      arbeidsovereenkomst: de werknemer, bedoeld in [artikel 1:1, onderdeel b][ref1], die op grond van
      [artikel 6, eerste lid, onderdeel c, van de Ziektewet][ref2] geen werknemer in de zin van [die wet][ref3] is.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel317
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0001888
  - number: 3:18
    text: |-
      De vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst heeft gedurende de periode dat het zwangerschaps- en
      bevallingsverlof wordt genoten overeenkomstig [artikel 3:1, tweede en derde lid][ref1], recht op uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel318
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 3:21.1
    text: |-
      De beroepsbeoefenaar op arbeidsovereenkomst kan een recht op uitkering op grond van [artikel 3:18][ref1], tezamen
      met het recht op vakantie-uitkering daarover, genieten in de vorm van een uitkering ter zake van vervanging.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel321
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 3:21.2
    text: 'Toekenning van een uitkering ter zake van vervanging, bedoeld in het eerste lid, is uitsluitend mogelijk:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel321
  - number: 3:21.2.a
    text: |-
      indien ter vervanging van de beroepsbeoefenaar op arbeidsovereenkomst een persoon werkzaam is gedurende de periode
      dat het recht op uitkering bestaat, en
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel321
  - number: 3:21.2.b
    text: |-
      de persoon die als vervanger werkzaam is, ter beschikking wordt gesteld door een rechtspersoonlijkheid bezittende
      instelling, die zich krachtens haar statuten ten doel stelt arbeidskrachten ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel321
  - number: 3:22.1
    text: |-
      De vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst, die in aanmerking wenst te komen voor toekenning van
      een uitkering in verband met zwangerschap en bevalling, doet de aanvraag daartoe bij het Uitvoeringsinstituut
      werknemersverzekeringen uiterlijk twee weken voor de datum van ingang van het zwangerschapsverlof. Bij die aanvraag
      wordt gemeld:
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel322
  - number: 3:22.1.a
    text: |-
      de vermoedelijke datum van bevalling, onder overlegging van de verklaring van een arts of van een verloskundige
      waarin die datum is aangegeven;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel322
  - number: 3:22.1.b
    text: de datum waarop het zwangerschapsverlof ingaat;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel322
  - number: 3:22.1.c
    text: of zij de uitkering wil genieten in de vorm van een uitkering ter zake van vervanging.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel322
  - number: 3:22.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan in bijzondere gevallen ten gunste van de beroepsbeoefenaar op
      arbeidsovereenkomst afwijken van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel322
  - number: 3:23.1
    text: |-
      De uitkering in verband met zwangerschap en bevalling wordt overeenkomstig
      [artikel 8 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] berekend naar de grondslag met dien
      verstande dat bij de overeenkomstige toepassing van het [derde lid van dat artikel][ref2] voor «intreden van zijn
      arbeidsongeschiktheid als beroepsbeoefenaar» wordt gelezen: de ingangsdatum van het recht op uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel8
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel323
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '8'
  - number: 3:23.2
    text: De uitkering, bedoeld in het eerste lid, bedraagt per dag 100% van de grondslag.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel323
  - number: 3:24
    text: |-
      De uitkering ter zake van vervanging bedraagt de grondslag, bedoeld in artikel 3:23, eerste lid, vermeerderd
      met het bedrag aan premies dat het Uitvoeringsinstituut werknemersverzekeringen bij uitbetaling als uitkering in
      verband met zwangerschap en bevalling daarover verschuldigd zou zijn.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel324
  - number: 3:25.1
    text: |-
      Een uitkering als bedoeld in deze paragraaf wordt zo spoedig mogelijk maar uiterlijk binnen een maand nadat het
      Uitvoeringsinstituut werknemersverzekeringen het recht op uitkering heeft vastgesteld, uitbetaald. De betaling
      geschiedt als regel in tijdvakken van een maand.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel325
  - number: 3:25.2
    text: De uitkering wordt betaald over iedere dag, doch niet over de zaterdagen en de zondagen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel325
  - number: 3:25.3
    text: |-
      De uitkering ter zake van vervanging wordt uitbetaald aan de instelling bedoeld in artikel 3:21, tweede lid,
      onderdeel b.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel325
  - number: 3:25.4
    text: |-
      De [artikelen 55, tweede tot en met vijfde lid][ref1], [55a][ref2], [57][ref3], [62][ref4] en
      [66 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel55a
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel62
      [ref5]: https://wetten.overheid.nl/BWBR0008656#Artikel66
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel325
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 55a
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '57'
      - id: ref4
        bwb_id: BWBR0008656
        artikel: '62'
      - id: ref5
        bwb_id: BWBR0008656
        artikel: '66'
  - number: 3:26
    text: |-
      De op grond van deze paragraaf te betalen uitkeringen en de uitvoeringskosten met betrekking tot die uitkeringen
      komen ten laste van het Arbeidsongeschiktheidsfonds.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel326
  - number: 3:27.1
    text: |-
      Met betrekking tot een uitkering op grond van deze paragraaf zijn de volgende artikelen van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] en de op die artikelen berustende bepalingen van
      overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 3:27.1.a
    text: |-
      ter zake van het recht op uitkering: de [artikelen 7a][ref1], [7b][ref2], [19, vierde en vijfde lid][ref3],
      [19a][ref4], [21a][ref5] en[ 21b][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel19a
      [ref5]: https://wetten.overheid.nl/BWBR0008656#Artikel21a
      [ref6]: https://wetten.overheid.nl/BWBR0008656#Artikel21b
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 7a
      - id: ref2
