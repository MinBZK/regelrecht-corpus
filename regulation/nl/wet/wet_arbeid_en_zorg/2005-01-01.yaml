        bwb_id: BWBR0008656
        artikel: '47'
  - number: 3:27.1.f
    text: |-
      ter zake van de inlichtingenverplichting: [artikel 70][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
  - number: 3:27.1.g
    text: |-
      ter zake van de uitvoering: [artikel 81][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel81
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '81'
  - number: 3:27.1.h
    text: |-
      ter zake van de termijn waarbinnen op het bezwaarschrift moet zijn beslist: [artikel 96, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel96
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '96'
  - number: 3:27.1.i
    text: |-
      ter zake van het beroep in cassatie: [artikel 98][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel98
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '98'
  - number: 3:27.1.j
    text: |-
      ter zake van strafbepalingen: [artikel 100][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel100
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '100'
  - number: 3:27.2
    text: |-
      Met betrekking tot een uitkering op grond van deze paragraaf zijn de volgende artikelen van hoofdstuk 7 en de op
      die artikelen berustende bepalingen van overeenkomstige toepassing:
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
  - number: 3:27.2.a
    text: |-
      ter zake van terugvordering: artikel 7:13, met dien verstande dat bij algemene maatregel van bestuur kan worden
      bepaald dat, in afwijking van het eerste lid van dat artikel, onder bij dat besluit te bepalen omstandigheden, een
      uitkering ter zake van vervanging niet wordt teruggevorderd;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
  - number: 3:27.2.b
    text: 'ter zake van vervreemding, verpanding en volmacht tot ontvangst: artikel 7:14, eerste tot en met derde lid;'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
  - number: 3:27.2.c
    text: 'ter zake van boeten: de artikelen 7:16 tot en met 7:22.'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
  - number: 3:27.3
    text: |-
      De strafbepaling van [artikel 84, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel84
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '84'
  - number: 3:27.4
    text: |-
      [Artikel 56 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] is van overeenkomstige toepassing op
      een uitkering op grond van deze paragraaf met uitzondering van de uitkering ter zake van vervanging.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel56
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '56'
  - number: 3:27.5
    text: |-
      Ter zake van overlijden zijn de [artikelen 1, tweede tot en met zevende lid][ref1], [61][ref2] en
      [67, onderdeel b, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3] van overeenkomstige toepassing
      met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel67
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '61'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '67'
  - number: 3:27.5.a
    text: |-
      het [derde lid van artikel 61][ref1] wordt toegepast ongeacht of het recht op uitkering met ingang van de dag na
      het overlijden binnen een maand zou zijn geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel61
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '61'
  - number: 3:27.5.b
    text: |-
      indien een uitkering is toegekend in de vorm van een uitkering ter zake van vervanging, de overlijdensuitkering
      wordt betaald overeenkomstig het [eerste lid van artikel 61][ref1], als was de uitkering toegekend als uitkering
      in verband met zwangerschap en bevalling of adoptie. Het [zevende lid van artikel 61][ref2] blijft daarbij buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel61
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '61'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '61'
  - number: 3:27.6
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig
      [artikel 45 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] indien de beroepsbeoefenaar op
      arbeidsovereenkomst zich niet houdt aan het voorschrift, bedoeld in [artikel 3:22, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 3:27.7
    text: |-
      Op de instelling, bedoeld in artikel 3:21, tweede lid, onderdeel b, is
      [artikel 70, eerste lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
  - number: 3:28
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan controlevoorschriften vaststellen. Deze voorschriften mogen
      niet verder gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel328
  - number: 3:29.1
    text: |-
      Indien een persoon over dezelfde periode op grond van dezelfde paragraaf zowel recht heeft op een uitkering in
      verband met zwangerschap en bevalling als op een uitkering in verband met adoptie of pleegzorg, wordt haar de
      uitkering in verband met adoptie of pleegzorg of ter zake van vervanging in verband met adoptie of pleegzorg niet
      uitbetaald. Indien een persoon over dezelfde periode op grond van dezelfde paragraaf zowel recht heeft op een
      uitkering in verband met adoptie als op een uitkering in verband met pleegzorg wordt hem de uitkering in verband
      met pleegzorg of ter zake van vervanging in verband met pleegzorg niet uitbetaald.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel329
  - number: 3:29.2
    text: |-
      Indien een persoon over dezelfde periode zowel recht heeft op een uitkering op grond van paragraaf 1 als op een
      uitkering op grond van paragraaf 2 van deze afdeling, wordt hem de uitkering op grond van paragraaf 2 uitbetaald
      voorzover deze de uitkering op grond van paragraaf 1 van deze afdeling overtreft. Indien de uitkering op grond
      van paragraaf 1 geheel of gedeeltelijk wordt geweigerd op grond van enig handelen of nalaten dat de betrokkene kan
      worden verweten, wordt voor de toepassing van dit lid die uitkering in aanmerking genomen alsof die weigering niet
      heeft plaatsgevonden. De eerste zin is niet van toepassing op de werknemer en de gelijkgestelde, bedoeld in artikel
      3:6, tweede lid.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel329
  - number: 3:29.3
    text: |-
      Indien een persoon over dezelfde periode zowel recht heeft op een uitkering op grond van paragraaf 1 van deze
      afdeling als op arbeidsongeschiktheidsuitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1]
      wordt eerstgenoemde uitkering uitbetaald voorzover deze samen met de arbeidsongeschiktheidsuitkering niet meer
      bedraagt dan het hoogste van de daglonen, die aan die uitkeringen ten grondslag liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 3:29.4
    text: |-
      Indien een persoon over dezelfde periode zowel recht heeft op een uitkering op grond van
      paragraaf 2 van deze afdeling als op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1], wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 3:29.4.a
    text: |-
      indien de grondslag van de eerstgenoemde uitkering lager is dan de grondslag van de arbeidsongeschiktheidsuitkering
      of daaraan gelijk is, de eerstgenoemde uitkering uitbetaald voorzover deze samen met de
      arbeidsongeschiktheidsuitkering niet meer bedraagt dan de grondslag van de arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel329
  - number: 3:29.4.b
    text: |-
      indien de grondslag van de eerstgenoemde uitkering hoger is dan de grondslag van de
      arbeidsongeschiktheidsuitkering, de eerstgenoemde uitkering uitbetaald voorzover deze samen met de
      arbeidsongeschiktheidsuitkering niet meer bedraagt dan de grondslag van de eerstgenoemde uitkering;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel329
  - number: 3:29.4.c
    text: |-
      indien het recht op eerstgenoemde uitkering ontstaat in het tijdvak van 52 weken bedoeld in
      [artikel 7, tweede lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1], in afwijking van
      de onderdelen a en b, de eerstgenoemde uitkering uitbetaald voorzover deze de arbeidsongeschiktheidsuitkering
      overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
  - number: 3:29.5
    text: |-
      Voor de toepassing van het tweede tot en met het vierde lid wordt onder arbeidsongeschiktheidsuitkering op grond
      van de [Wet op de arbeidsongeschiktheidsverzekering][ref1], arbeidsongeschiktheidsuitkering op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2], uitkering op grond van paragraaf 1 van deze afdeling
      en uitkering op grond van paragraaf 2 van deze afdeling tevens verstaan de vakantie-uitkering waarop uit hoofde
      van die arbeidsongeschiktheidsuitkeringen en die uitkeringen recht bestaat, voor zover die vakantie-uitkering over
      dezelfde periode is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
  - number: 3:29.6
    text: |-
      Indien de arbeidsongeschiktheidsuitkering geheel of gedeeltelijk wordt geweigerd op grond van enig handelen
      of nalaten dat de betrokkene kan worden verweten, wordt voor de toepassing van het derde en vierde lid de
      arbeidsongeschiktheidsuitkering in aanmerking genomen alsof die weigering niet heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel329
  - number: 3:30.1
    text: |-
      Op de zelfstandige, bedoeld in artikel 3:17, onderdeel a, zoals dat luidde op de dag voorafgaand aan de
      inwerkingtreding van [artikel II, onderdeel D, van de Wet einde toegang verzekering WAZ][ref1], van wie de
      vermoedelijke of feitelijke bevallingsdatum valt binnen 40 weken na de inwerkingtreding van [dat artikel][ref2]
      dan wel die binnen 40 weken na de inwerkingtreding van dat artikel feitelijk een kind ter adoptie of pleegzorg
      heeft opgenomen, blijft hoofdstuk 3, afdeling 2, paragraaf 2, zoals dat luidde op de dag voorafgaand aan de
      inwerkingtreding van [artikel II, onderdeel D, van de Wet einde toegang verzekering WAZ][ref3] van toepassing met
      betrekking tot die bevalling dan wel die opneming.


      [ref1]: https://wetten.overheid.nl/BWBR0016985#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0016985#ArtikelII
      [ref3]: https://wetten.overheid.nl/BWBR0016985#ArtikelII
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel330
    references:
      - id: ref1
        bwb_id: BWBR0016985
        artikel: II
      - id: ref2
        bwb_id: BWBR0016985
        artikel: II
      - id: ref3
        bwb_id: BWBR0016985
        artikel: II
  - number: 3:30.2
    text: |-
      Op de beroepsbeoefenaar op arbeidsovereenkomst, bedoeld in artikel 3:17, onderdeel
      b, zoals dat onderdeel luidde op de dag voorafgaand aan de inwerkingtreding van
      [artikel II, onderdeel D, van de Wet einde toegang verzekering WAZ][ref1], die binnen 40 weken na
      de inwerkingtreding van dat artikel feitelijk een kind ter adoptie of pleegzorg heeft opgenomen,
      blijft hoofdstuk 3, afdeling 2, paragraaf 2, zoals dat luidde voorafgaand aan de inwerkingtreding van
      [artikel II, onderdeel D, van de Wet einde toegang verzekering WAZ][ref2] van toepassing met betrekking tot die
      opneming.


      [ref1]: https://wetten.overheid.nl/BWBR0016985#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0016985#ArtikelII
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel330
    references:
      - id: ref1
        bwb_id: BWBR0016985
        artikel: II
      - id: ref2
        bwb_id: BWBR0016985
        artikel: II
  - number: 3:30.3
    text: |-
      In afwijking van het eerste en tweede lid komen de onder toepassing van dit artikel te betalen uitkeringen en de
      uitvoeringskosten met betrekking tot die uitkeringen ten laste van het Arbeidsongeschiktheidsfonds.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel330
  - number: 4:1.1
    text: |-
      De werknemer heeft recht op verlof met behoud van loon voor een korte, naar billijkheid te berekenen tijd, wanneer
      hij zijn arbeid niet kan verrichten wegens:
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel41
  - number: 4:1.1.a
    text: zeer bijzondere persoonlijke omstandigheden;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel41
  - number: 4:1.1.b
    text: |-
      een door wet of overheid, zonder geldelijke vergoeding, opgelegde verplichting, waarvan de vervulling niet in zijn
      vrije tijd kon plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel41
  - number: 4:1.1.c
    text: de uitoefening van het actief kiesrecht.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel41
  - number: 4:1.2
    text: 'Onder zeer bijzondere persoonlijke omstandigheden worden in ieder geval begrepen:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel41
  - number: 4:1.2.a
    text: de bevalling van de echtgenote, de geregistreerde partner of de persoon met wie de werknemer ongehuwd samenwoont;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel41
  - number: 4:1.2.b
    text: |-
      het overlijden en de lijkbezorging van een van zijn huisgenoten of een van zijn bloed- en aanverwanten in de rechte
      lijn en in de tweede graad van de zijlijn.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel41
  - number: 4:2
    text: |-
      Na de bevalling van de echtgenote, de geregistreerde partner, de persoon met wie hij ongehuwd samenwoont of degene
      van wie hij het kind erkent, heeft de werknemer gedurende een tijdvak van vier weken recht op verlof met behoud
      van loon voor twee dagen waarop hij arbeid pleegt te verrichten. Het recht bestaat vanaf de eerste dag dat het kind
      feitelijk op hetzelfde adres als de moeder woont.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel42
  - number: 4:3.1
    text: |-
      De werknemer meldt vooraf aan de werkgever dat hij het verlof, bedoeld in de artikelen 4:1 en 4:2, opneemt onder
      opgave van de reden. Indien dit niet mogelijk is, meldt de werknemer het opnemen van het verlof zo spoedig mogelijk
      aan de werkgever onder opgave van de reden.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel43
  - number: 4:3.2
    text: |-
      Het verlof van de militaire ambtenaar vangt niet aan of eindigt in ieder geval zodra de werkgever aan hem kenbaar
      maakt dat hij tegen het opnemen van het verlof onderscheidenlijk de voortzetting daarvan een zodanig zwaarwegend
      dienstbelang heeft, dat het belang van de militaire ambtenaar daarvoor naar maatstaven van redelijkheid en
      billijkheid moet wijken.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel43
  - number: 4:4
    text: |-
      De werkgever kan achteraf van de werknemer verlangen dat hij aannemelijk maakt dat hij zijn arbeid niet heeft
      kunnen verrichten wegens een van de redenen genoemd in de artikelen 4:1 en 4:2.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel44
  - number: 4:5.1
    text: |-
      Indien de werknemer op grond van enige wettelijk voorgeschreven verzekering of krachtens enige verzekering
      of uit enig fonds waarin de deelneming is overeengekomen bij of voortvloeit uit de arbeidsovereenkomst of
      publiekrechtelijke aanstelling, een geldelijke uitkering toekomt, wordt het loon verminderd met het bedrag van
      die uitkering.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel45
  - number: 4:5.2
    text: |-
      Het loon wordt verminderd met het bedrag van de door de werkgever vergoede onkosten die de werknemer door het niet
      verrichten van zijn arbeid heeft bespaard.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel45
  - number: 4:6.1
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer zijn arbeid niet verricht wegens het verlof, bedoeld in artikel
      4:1, kunnen slechts indien in een voorkomend geval de werknemer ermee instemt worden aangemerkt als vakantie, met
      dien verstande dat de werknemer ten minste recht houdt op het wettelijk minimum aan vakantie-aanspraken.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel46
  - number: 4:6.2
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer zijn arbeid niet verricht wegens het verlof, bedoeld in artikel
      4:2, kunnen niet worden aangemerkt als vakantie.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel46
  - number: 4:7
    text: |-
      Van [artikel 4:1][ref1], voor wat betreft de loonbetaling, en de [artikelen 4:2 tot en met 4:6][ref2] kan
      uitsluitend worden afgeweken bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd
      bestuursorgaan dan wel, indien geen collectieve arbeidsovereenkomst of regeling van toepassing is of terzake geen
      bepaling bevat, indien de werkgever terzake schriftelijke overeenstemming heeft bereikt met de ondernemingsraad of,
      bij het ontbreken daarvan, met de personeelsvertegenwoordiging, met dien verstande dat de werknemer bij afwijking
      van [artikel 4:6][ref3] ten minste recht houdt op het wettelijke minimum aan vakantie-aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel4
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 5:1.1
    text: |-
      De werknemer heeft recht op verlof voor de noodzakelijke verzorging in verband met ziekte van een persoon als
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel51
  - number: 5:1.2
    text: 'Onder een persoon als bedoeld in het eerste lid, wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel51
  - number: 5:1.2.a
    text: de echtgenoot, de geregistreerde partner of de persoon met wie de werknemer ongehuwd samenwoont;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel51
  - number: 5:1.2.b
    text: een inwonend kind tot wie de werknemer als ouder in een familierechtelijke betrekking staat;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel51
  - number: 5:1.2.c
    text: |-
      een inwonend kind van de echtgenoot, de geregistreerde partner of de persoon met wie de werknemer ongehuwd
      samenwoont;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel51
  - number: 5:1.2.d
    text: |-
      een pleegkind dat blijkens verklaringen uit de gemeentelijke basisadministratie op hetzelfde adres woont als de
      werknemer en door hem in diens gezin duurzaam wordt verzorgd en opgevoed op basis van een pleegcontract als bedoeld
      in [artikel 22, eerste lid, van de Wet op de jeugdzorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel22
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '22'
  - number: 5:1.2.e
    text: een bloedverwant in de eerste graad, niet zijnde een kind.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel51
  - number: 5:2
    text: Het verlof bedraagt in elke periode van 12 achtereenvolgende maanden ten hoogste twee maal de arbeidsduur per week.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel52
  - number: 5:3
    text: |-
      De werknemer meldt vooraf aan de werkgever dat hij het verlof, bedoeld in artikel 5:1 opneemt onder opgave van
      de reden. Indien dit niet mogelijk is, meldt de werknemer het opnemen van het verlof zo spoedig mogelijk aan de
      werkgever onder opgave van de reden. Bij die melding geeft de werknemer ook de omvang, de wijze van opneming en de
      vermoedelijke duur van het verlof aan.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel53
  - number: 5:4.1
    text: Het verlof gaat in op het tijdstip waarop de werknemer het opnemen ervan meldt aan de werkgever.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel54
  - number: 5:4.2
    text: |-
      Het verlof vangt niet aan of eindigt in ieder geval zodra de werkgever aan de werknemer kenbaar maakt dat hij
      tegen het opnemen van het verlof onderscheidenlijk de voortzetting daarvan een zodanig zwaarwegend bedrijfs- of
      dienstbelang heeft, dat het belang van de werknemer daarvoor naar maatstaven van redelijkheid en billijkheid moet
      wijken.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel54
  - number: 5:4.3
    text: |-
      Een werkgever die nadat een melding door de werknemer, niet zijnde een militaire ambtenaar, hem bereikt heeft en
      naar aanleiding daarvan geen beroep doet op een zwaarwegend bedrijfs- of dienstbelang, kan dit nadien evenmin.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel54
  - number: 5:5
    text: |-
      De werkgever kan achteraf van de werknemer verlangen dat hij aannemelijk maakt dat hij zijn arbeid niet heeft
      verricht in verband met de noodzakelijke verzorging van een persoon als bedoeld in artikel 5:1.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel55
  - number: 5:6.1
    text: |-
      Voorzover het loon niet meer bedraagt dan het maximum dagloon, bedoeld in
      [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref1], behoudt de werknemer, die anders dan op
      grond van een publiekrechtelijke aanstelling arbeid verricht, gedurende het verlof, bedoeld in artikel 5:1, recht
      op 70% van het loon, maar ten minste op het voor hem geldende wettelijke minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '9'
  - number: 5:6.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de werknemer, die arbeid verricht op grond van een
      publiekrechtelijke aanstelling.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel56
  - number: 5:7.1
    text: |-
      Indien de werknemer op grond van enige wettelijk voorgeschreven verzekering of krachtens enige verzekering
      of uit enig fonds waarin de deelneming is overeengekomen bij of voortvloeit uit de arbeidsovereenkomst of
      publiekrechtelijke aanstelling, een geldelijke uitkering toekomt, wordt het loon verminderd met het bedrag van
      die uitkering.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel57
  - number: 5:7.2
    text: |-
      Het loon wordt verminderd met het bedrag van de door de werkgever vergoede onkosten die de werknemer door het niet
      verrichten van zijn arbeid heeft bespaard.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel57
  - number: 5:8
    text: |-
      Indien zowel de in artikel 4:1 als de in artikel 5:1 gestelde voorwaarden worden vervuld, eindigt het in artikel
      4:1 bedoelde verlof na één dag.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel58
  - number: 5:9
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer zijn arbeid niet verricht wegens het verlof, bedoeld in artikel
      5:1, kunnen niet worden aangemerkt als vakantie.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel59
  - number: 5:10
    text: |-
      Van dit hoofdstuk kan uitsluitend worden afgeweken bij collectieve arbeidsovereenkomst of bij regeling door of
      namens een daartoe bevoegd bestuursorgaan dan wel, indien geen collectieve arbeidsovereenkomst of regeling van
      toepassing is of terzake geen bepaling bevat, indien de werkgever terzake schriftelijke overeenstemming heeft
      bereikt met de ondernemingsraad of, bij het ontbreken daarvan, met de personeelsvertegenwoordiging, met dien
      verstande dat de werknemer bij afwijking van [artikel 5:9][ref1] ten minste recht houdt op het wettelijke minimum
      aan vakantie-aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel5
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel510
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 6:1.1
    text: |-
      De werknemer die als ouder in familierechtelijke betrekking staat tot een kind, heeft recht op verlof zonder
      behoud van loon. Indien de werknemer met ingang van hetzelfde tijdstip tot meer dan één kind in familierechtelijke
      betrekking komt te staan, bestaat er ten aanzien van ieder van die kinderen recht op verlof.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel61
  - number: 6:1.2
    text: |-
      De werknemer die blijkens verklaringen uit de gemeentelijke basisadministratie op hetzelfde adres woont als een
      kind en duurzaam de verzorging en de opvoeding van dat kind als eigen kind op zich heeft genomen, heeft recht
      op verlof zonder behoud van loon. Indien de werknemer met het oog op adoptie met ingang van hetzelfde tijdstip
      de verzorging en opvoeding van meer dan één kind op zich heeft genomen, bestaat er ten aanzien van ieder van die
      kinderen recht op verlof. In alle andere gevallen waarin de in de eerste volzin gestelde voorwaarden voor meer dan
      één kind met ingang van hetzelfde tijdstip worden vervuld, bestaat er slechts recht op één keer verlof.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel61
  - number: 6:1.3
    text: |-
      Indien de arbeid buiten Nederland wordt verricht heeft de werknemer recht op het verlof bedoeld in dit artikel,
      tenzij een zwaarwegend bedrijfs- of dienstbelang zich hiertegen verzet.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel61
  - number: 6:2.1
    text: Het aantal uren verlof waarop de werknemer ten hoogste recht heeft bedraagt dertien maal de arbeidsduur per week.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel62
  - number: 6:2.2
    text: Het verlof wordt per week opgenomen gedurende een aaneengesloten periode van ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel62
  - number: 6:2.3
    text: Het aantal uren verlof per week bedraagt ten hoogste de helft van de arbeidsduur per week.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel62
  - number: 6:2.4
    text: 'In afwijking van het tweede en derde lid kan de werknemer de werkgever verzoeken om:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel62
  - number: 6:2.4.a
    text: verlof voor een langere periode dan zes maanden, of
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel62
  - number: 6:2.4.b
    text: het verlof op te delen in ten hoogste drie perioden, waarbij iedere periode ten minste een maand bedraagt, of
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel62
  - number: 6:2.4.c
    text: meer uren verlof per week dan de helft van de arbeidsduur per week.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel62
  - number: 6:2.5
    text: |-
      De werkgever kan het verzoek van de werknemer, bedoeld in het vierde lid, afwijzen indien een zwaarwegend bedrijfs-
      of dienstbelang zich hiertegen verzet.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel62
  - number: 6:2.6
    text: |-
      Indien het verlof op grond van het vierde lid, onderdeel b, is opgedeeld en de arbeidsverhouding wordt beëindigd
      voordat het verlof volledig is genoten, heeft de werknemer, indien hij een nieuwe arbeidsovereenkomst aangaat,
      tegenover de nieuwe werkgever aanspraak op het resterende deel van het verlof met inachtneming van het bepaalde in
      dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel62
  - number: 6:3.1
    text: Het recht op verlof, bedoeld in artikel 6:1, bestaat indien de arbeidsverhouding ten minste een jaar heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel63
  - number: 6:3.2
    text: |-
      Voor de berekening van de termijn van een jaar worden perioden waarin arbeid wordt verricht, die elkaar opvolgen
      met een onderbreking van niet meer dan drie maanden samengeteld. De vorige volzin is van overeenkomstige toepassing
      op perioden waarin voor verschillende werkgevers arbeid wordt verricht die ten aanzien van de verrichte arbeid
      redelijkerwijs geacht moeten worden elkanders opvolger te zijn.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel63
  - number: 6:4
    text: |-
      Geen recht op verlof als bedoeld in artikel 6:1 bestaat na de datum waarop het kind de leeftijd van acht jaren
      heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel64
  - number: 6:5.1
    text: |-
      De werknemer meldt het voornemen om verlof op te nemen ten minste twee maanden voor het tijdstip van ingang van
      het verlof schriftelijk aan de werkgever onder opgave van de periode, het aantal uren verlof per week of als de
      arbeidsduur over een ander tijdvak is overeengekomen over dat tijdvak en de spreiding daarvan over de week of het
      anderszins overeengekomen tijdvak.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel65
  - number: 6:5.2
    text: |-
      De tijdstippen van ingang en einde van het verlof kunnen afhankelijk worden gesteld van de datum van de bevalling,
      van het einde van het bevallingsverlof of van de aanvang van de verzorging.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel65
  - number: 6:5.3
    text: |-
      De werkgever kan, na overleg met de werknemer, de spreiding van de uren over de week op grond van een zwaarwegend
      bedrijfs- of dienstbelang wijzigen, tot vier weken voor het tijdstip van ingang van het verlof.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel65
  - number: 6:5.4
    text: |-
      Indien op grond van artikel 6:2, vierde lid, onderdeel b, het verlof is opgedeeld, zijn het eerste tot en met derde
      lid op iedere periode van toepassing.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel65
  - number: 6:6.1
    text: |-
      De werkgever kan een verzoek van de werknemer om het verlof niet op te nemen of niet voort te zetten op grond van
      onvoorziene omstandigheden afwijzen indien een zwaarwegend bedrijfs- of dienstbelang zich hiertegen verzet.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel66
  - number: 6:6.2
    text: |-
      De werkgever hoeft aan het verzoek niet met ingang van een vroeger tijdstip gevolg te geven dan vier weken na het
      verzoek. In het geval dat het verlof met toepassing van het eerste lid na het tijdstip van ingang daarvan niet
      wordt voortgezet, vervalt het recht op het overige deel van het verlof.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel66
  - number: 6:6.3
    text: |-
      Indien op grond van artikel 6:2, vierde lid, onderdeel b, het verlof is opgedeeld, zijn het eerste en tweede lid op
      iedere periode van toepassing.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel66
  - number: 6:7
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer zijn arbeid niet verricht wegens het verlof, bedoeld in artikel
      6:1, kunnen niet worden aangemerkt als vakantie.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel67
  - number: 6:8
    text: |-
      Van de artikelen 6:1, derde lid, 6:2, vierde lid, onderdeel b, 6:3, eerste lid, 6:4, 6:5, eerste lid, ten
      aanzien van het tijdstip van melding, en tweede lid, en 6:6 kan uitsluitend worden afgeweken bij collectieve
      arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel68
  - number: 6:9
    text: Behoudens artikel 6:8 kan van dit hoofdstuk niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel69
  - number: 7:1
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel71
  - number: 7:1.a
    text: |-
      verlof: een, met instandhouding van de arbeidsovereenkomst of de publiekrechtelijke aanstelling, gehele of
      gedeeltelijke onderbreking van de arbeid ten behoeve van zorg of educatie waaronder mede wordt verstaan het
      vergroten van de arbeidskwalificatie;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel71
  - number: 7:1.b
    text: |-
      verlofganger: de werknemer die op grond van een wettelijk recht of een overeenkomst met zijn werkgever verlof
      opneemt.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel71
  - number: 7:2
    text: |-
      De afspraak over het begin en het einde van het verlof, en het aantal uren verlof per week wordt schriftelijk
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel72
  - number: 7:3.1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder vervanger: de persoon die, ter vervanging
      van één of meer verlofgangers,
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel73
  - number: 7:3.1.1°
    text: in dienst treedt van de werkgever waarbij de verlofganger in dienst is;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel73
  - number: 7:3.1.2°
    text: |-
      in het kader van een uitzendovereenkomst als bedoeld in [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref1]
      ter beschikking wordt gesteld van de werkgever waarbij de verlofganger in dienst is;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel690
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '690'
  - number: 7:3.1.3°
    text: |-
      ter beschikking wordt gesteld van de werkgever van de verlofganger door een rechtspersoonlijkheid bezittende
      organisatie die ten doel heeft om uitkeringsgerechtigden als bedoeld in het tweede lid in dienst te nemen en deze
      ter beschikking te stellen aan andere werkgevers.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel73
  - number: 7:3.2
    text: 'Bij het eerste lid, onder 1° en 2°, geldt dat de vervanger:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel73
  - number: 7:3.2.a
    text: 'als werkzoekende staat ingeschreven bij de Centrale organisatie werk en inkomen en:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel73
  - number: 7:3.2.b
    text: |-
      een uitkering krachtens de [Werkloosheidswet][ref1] of de [Algemene nabestaandenwet][ref2] ontvangt of
      een naar aard en strekking daarmee overeenkomende uitkering dan wel arbeidsgehandicapte is als bedoeld in
      [artikel 2 van de Wet op de (re) integratie van arbeidsgehandicapten][ref3], of


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '2'
  - number: 7:3.2.c
    text: |-
      algemene bijstand krachtens de [Wet werk en bijstand][ref1] ontvangt, dan wel een uitkering krachtens de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] dan wel de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3], of


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
  - number: 7:3.2.d
    text: |-
      gedurende twee jaar voorafgaand aan de vervanging niet meer dan 50 dagen of 400 uur op jaarbasis arbeid heeft
      verricht.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel73
  - number: 7:4.1
    text: Een vervanger mag meer dan één verlofganger vervangen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel74
  - number: 7:4.2
    text: Een verlofganger mag door meer dan één vervanger worden vervangen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel74
  - number: 7:4.3
    text: Een vervanger mag direct aansluitend op een periode van vervanging opnieuw als vervanger optreden.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel74
  - number: 7:5.1
    text: |-
      De verlofganger dient uiterlijk vier weken na de aanvang van het verlof een aanvraag om een financiële
      tegemoetkoming in bij het Uitvoeringsinstituut werknemersverzekeringen. Een aanvraag wordt ingediend door middel
      van een door het Uitvoeringsinstituut werknemersverzekeringen beschikbaar gesteld aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel75
  - number: 7:5.2
    text: Het Uitvoeringsinstituut werknemersverzekeringen beslist binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel75
  - number: 7:5.3
    text: |-
      Indien de termijn van vier weken, bedoeld in het eerste lid, wordt overschreden, vangt de financiële tegemoetkoming
      eerst aan op de eerste dag van de kalendermaand volgend op die waarin de aanvraag is ingediend en wordt deze
      slechts verleend voor de resterende duur van het verlof.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel75
  - number: 7:6.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kent aan de verlofganger op diens aanvraag een financiële
      tegemoetkoming toe, indien aan de in artikel 7:7 genoemde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel76
  - number: 7:6.2
    text: |-
      De financiële tegemoetkoming komt ten laste van het Algemeen Werkloosheidsfonds met uitzondering van hetgeen op
      grond van [artikel 97f, onderdeel i, van de Werkloosheidswet][ref1] ten laste komt van het Uitvoeringsfonds voor de
      overheid, bedoeld in [artikel 104 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel104
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '104'
  - number: 7:6.3
    text: |-
      Voor ieder opgenomen uur verlof per week, bedraagt de tegemoetkoming gerekend over een maand € 12,91. Met
      inachtneming van de vorige volzin kan de financiële tegemoetkoming per maand in totaal niet meer bedragen dan
      € 490,54.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel76
  - number: 7:6.4
    text: De financiële tegemoetkoming wordt verleend over in de verlofperiode gelegen volle maanden.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel76
  - number: 7:6.5
    text: |-
      De financiële tegemoetkoming wordt niet uitbetaald over tijdvakken waarin de verlofganger een uitkering ontvangt
      als bedoeld in hoofdstuk 3, afdeling 2.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel76
  - number: 7:6.6
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen keert de financiële tegemoetkoming uit na afloop van iedere
      kalendermaand.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel76
  - number: 7:6.7
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan regels stellen inzake de berekening van de financiële
      tegemoetkoming in geval van bijzondere arbeidspatronen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel76
  - number: 7:6.8
    text: |-
      De bedragen, bedoeld in het derde lid, kunnen met ingang van 1 januari van enig jaar bij regeling van Onze Minister
      worden herzien.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel76
  - number: 7:7.1
    text: 'De voorwaarden voor toekenning van een financiële tegemoetkoming zijn:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel77
  - number: 7:7.1.a
    text: |-
      de verlofganger is gedurende een periode van ten minste een jaar voorafgaand aan het moment waarop hij verlof
      opneemt in dienst geweest bij dezelfde werkgever. Voor de berekening van de termijn van een jaar worden perioden
      waarin arbeid wordt verricht, die elkaar opvolgen met tussenpozen van niet meer dan drie maanden samen geteld.
      Voor de berekening van de termijn van een jaar worden perioden waarin voor verschillende werkgevers arbeid wordt
      verricht die ten aanzien van de verrichte arbeid redelijkerwijs geacht moeten worden elkanders opvolger te zijn,
      mede in aanmerking genomen;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel77
  - number: 7:7.1.b
    text: |-
      de verlofganger heeft gedurende een aaneengesloten periode van een jaar, voorafgaand aan het moment waarop hij
      verlof opneemt, geen financiële tegemoetkoming als bedoeld in het eerste lid ontvangen;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel77
  - number: 7:7.1.c
    text: de tussen de werkgever en de verlofganger overeengekomen verlofperiode bedraagt minimaal twee maanden;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel77
  - number: 7:7.1.d
    text: |-
      het tussen de werkgever en de verlofganger overeengekomen verlof bedraagt ten minste 1/3 van de wekelijkse
      arbeidsduur van de verlofganger;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel77
  - number: 7:7.1.e
    text: |-
      de werkgever sluit een arbeidsovereenkomst met een vervanger voor ten minste dezelfde periode als waarover de
      verlofganger verlof opneemt en voor ten minste 12 uur per week.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel77
  - number: 7:7.1.f
    text: |-
      de arbeidsovereenkomst tussen de werkgever en de vervanger vangt niet eerder aan dan één maand voor het begin van
      het verlof en niet later dan één maand daarna.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel77
  - number: 7:7.2
    text: |-
      Indien een vervanger in het kader van een uitzendovereenkomst als bedoeld in
      [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref1] ter beschikking wordt gesteld van de werkgever van de
      verlofganger, geschiedt dit voor ten minste dezelfde periode als waarover de verlofganger verlof opneemt en voor
      ten minste 12 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel690
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '690'
  - number: 7:7.3
    text: |-
      Indien een vervanger door een rechtspersoonlijkheid bezittende organisatie als bedoeld in artikel 7:3, eerste lid,
      onder 3°, ter beschikking wordt gesteld van de werkgever waarbij de verlofganger in dienst is, geschiedt dit voor
      ten minste dezelfde periode als waarover de verlofganger verlof opneemt.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel77
  - number: 7:8.1
    text: |-
      Ingeval van verlof ten behoeve van de verzorging van een terminale zieke of bij een levensbedreigende ziekte van
      een kind:
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel78
  - number: 7:8.1.a
    text: geldt de in artikel 7:7, onderdeel a, genoemde minimumperiode niet;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel78
  - number: 7:8.1.b
    text: geldt de in artikel 7:7, onderdeel c, genoemde minimumperiode niet;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel78
  - number: 7:8.1.c
    text: is de voorwaarde, bedoeld in artikel 7:7, onderdeel e, niet van toepassing;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel78
  - number: 7:8.1.d
    text: is de voorwaarde, bedoeld in artikel 7:7, onderdeel f, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel78
  - number: 7:8.2
    text: |-
      Indien het eerste lid van toepassing is en een proeftijd tussen de verlofganger en de werkgever is bedongen, geldt
      in afwijking van dat artikellid, onderdeel a, juncto artikel 7:7, tweede lid, onderdeel a, deze proeftijd als
      periode die ten minste vooraf moet zijn gegaan aan het moment waarop de verlofganger verlof opneemt ten behoeve van
      de verzorging van een in het eerste lid bedoelde zieke of ziekte.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel78
  - number: 7:9.1
    text: |-
      De financiële tegemoetkoming wordt, met inachtneming van artikel 7:6, vierde lid, verleend voor de duur van het
      verlof, maar voor ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel79
  - number: 7:9.2
    text: |-
      Bij collectieve arbeidsovereenkomst kan worden overeengekomen dat de termijn bedoeld in artikel 7:7, eerste lid,
      onderdeel b, niet wordt toegepast. Indien geen collectieve arbeidsovereenkomst van toepassing is of de collectieve
      arbeidsovereenkomst daarover geen bepaling bevat, kan die termijn buiten toepassing worden gesteld, indien de
      werkgever daartoe schriftelijk overeenstemming heeft bereikt met de ondernemingsraad of, bij het ontbreken daarvan,
      met de personeelsvertegenwoordiging, of bij het ontbreken daarvan, met de belanghebbende werknemer.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel79
  - number: 7:9.3
    text: |-
      Indien het tweede lid wordt toegepast, bedraagt de periode waarvoor een financiële tegemoetkoming wordt toegekend
      ten hoogste 18 maanden.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel79
  - number: 7:10
    text: |-
      De financiële tegemoetkoming eindigt met ingang van de eerste dag van de kalendermaand volgend op die waarin de
      verlofganger arbeid in dienstbetrekking of in de uitoefening van een bedrijf of in de zelfstandige uitoefening van
      een beroep is gaan verrichten of de arbeidsovereenkomst tussen de werkgever en de verlofganger is geëindigd.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel710
  - number: 7:11.1
    text: |-
      Indien de arbeidsovereenkomst tussen de werkgever en de vervanger eindigt voor het einde van de periode van
      vervanging, leidt dit niet tot beëindiging van de financiële tegemoetkoming aan de verlofganger.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel711
  - number: 7:11.2
    text: |-
      De werkgever neemt voor het resterende deel van de overeengekomen verlofperiode binnen drie weken een nieuwe
      vervanger in dienst of komt met een reeds bij hem in dienst zijnde vervanger verhoging van het aantal uren binnen
      dat tijdvak overeen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel711
  - number: 7:11.3
    text: |-
      Indien de werkgever niet binnen de in het tweede lid genoemde termijn een nieuwe vervanger in dienst heeft genomen
      of met een reeds bij hem in dienst zijnde vervanger verhoging van het aantal uren is overeengekomen, verhaalt
      het Uitvoeringsinstituut werknemersverzekeringen op de werkgever de financiële tegemoetkoming over de periode
      vanaf de datum van eindiging van de arbeidsovereenkomst tussen de werkgever en de vervanger en het einde van de
      overeengekomen verlofperiode.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel711
  - number: 7:11.4
    text: |-
      Het besluit tot verhaal levert een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van
      Burgerlijke rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel711
  - number: 7:12.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen herziet een besluit tot toekenning van een tegemoetkoming of trekt
      dat in:
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel712
  - number: 7:12.1.a
    text: |-
      indien het niet of niet behoorlijk nakomen van de verplichting op grond van artikel 7:15, eerste lid, heeft geleid
      tot het ten onrechte of tot een te hoog bedrag verlenen van een tegemoetkoming;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel712
  - number: 7:12.1.b
    text: indien anderszins de tegemoetkoming ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel712
  - number: 7:12.1.c
    text: |-
      indien het niet of niet behoorlijk nakomen van de verplichting bedoeld in artikel 7:15, eerste lid, er toe leidt,
      dat niet kan worden vastgesteld of nog recht op een tegemoetkoming bestaat.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel712
  - number: 7:12.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan het eerste lid buiten toepassing laten of daarvan afwijken
      voorzover toepassing gelet op het belang van een juiste uitvoering van dit hoofdstuk zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel712
  - number: 7:13.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen vordert de financiële tegemoetkoming die onverschuldigd is
      betaald, van de betrokken verlofganger terug.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.2
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van terugvordering
      of van verdere terugvordering af te zien, indien de verlofganger:
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.3
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.3.a
    text: |-
      het gemiddeld inkomen van de verlofganger in die periode de beslagvrije voet bedoeld in de [artikelen 475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
  - number: 7:13.3.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      artikel 7:15.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.4
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.5
    text: |-
      Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd, de termijn of termijnen waarbinnen moet
      worden betaald, alsmede dat het besluit bij gebreke van tijdige betaling zal worden tenuitvoergelegd op de wijze
      als omschreven in het zevende tot en met het negende lid.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.6
    text: |-
      De verlofganger is verplicht desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen de inlichtingen te
      verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.7
    text: |-
      Het besluit tot terugvordering levert een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van
      Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.8
    text: |-
      Artikel 7:22 is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de verlofganger gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref1] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan, het Uitvoeringsinstituut
      werknemersverzekeringen de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 7:13.9
    text: |-
      In afwijking van het achtste lid is artikel 7:22, negende lid niet van overeenkomstige toepassing op de persoon die
      de verplichting, bedoeld in het zesde lid, niet of niet behoorlijk nakomt.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.10
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen, onder voorwaarden die Onze
      Minister kan stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze
      Minister vast te stellen bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.11
    text: Bij ministeriële regeling kunnen met betrekking tot het tweede en derde lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:13.12
    text: |-
      Het Landelijk instituut sociale verzekeringen stelt regels met betrekking tot het eerste, vierde, vijfde, zesde en
      achtste lid.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel713
  - number: 7:14.1
    text: 'De financiële tegemoetkoming is:'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel714
  - number: 7:14.1.a
    text: onvervreemdbaar;
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel714
  - number: 7:14.1.b
    text: niet vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel714
  - number: 7:14.2
    text: |-
      Volmacht tot ontvangst van de financiële tegemoetkoming onder welke vorm of welke benaming ook verleend, is steeds
      herroepelijk.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel714
  - number: 7:14.3
    text: Elk beding in strijd met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel714
  - number: 7:14.4
    text: |-
      In afwijking van het eerste tot en met derde lid betaalt het Uitvoeringsinstituut werknemersverzekeringen de
      financiële tegemoetkoming aan de werkgever teneinde deze tegemoetkoming door diens tussenkomst te doen uitbetalen
      aan de verlofganger, indien:
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel714
  - number: 7:14.4.a
    text: |-
      bij collectieve arbeidsovereenkomst is bepaald dat de werkgever tijdens het verlof het loon aan de verlofganger
      geheel of gedeeltelijk doorbetaalt; en
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel714
  - number: 7:14.4.b
    text: |-
      de werkgever het Uitvoeringsinstituut werknemersverzekeringen dit schriftelijk verzoekt en van dit verzoek melding
      heeft gedaan aan de verlofganger.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel714
  - number: 7:15.1
    text: |-
      Indien de verlofperiode eerder eindigt dan tussen de werkgever en de verlofganger was overeengekomen, het aantal
      overeengekomen verlofuren per week wijzigt of indien de verlofganger in de overeengekomen verlofperiode arbeid in
      dienstbetrekking of als zelfstandige aanvaardt, is de verlofganger verplicht hiervan onverwijld uit eigen beweging
      aan het Uitvoeringsinstituut werknemersverzekeringen mededeling te doen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel715
  - number: 7:15.2
    text: |-
      Indien de arbeidsovereenkomst tussen de werkgever en de vervanger eindigt voordat de overeengekomen periode van
      vervanging is geëindigd, of indien de werkgever niet heeft voldaan aan artikel 7:11, tweede lid, is die werkgever
      verplicht daarvan onverwijld uit eigen beweging aan het Uitvoeringsinstituut werknemersverzekeringen mededeling
      te doen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel715
  - number: 7:16.1
    text: |-
      Indien de verlofganger de verplichting, bedoeld in [artikel 7:15, eerste lid][ref1], of de werkgever de
      verplichting , bedoeld in [artikel 7:15, tweede lid][ref2], niet of niet behoorlijk is nagekomen, legt het
      Uitvoeringsinstituut werknemersverzekeringen hem een boete op van ten hoogste € 2 269.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel7
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel716
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
        afdeling: '2'
  - number: 7:16.2
    text: |-
      De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de verlofganger of de werkgever
      de gedraging verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een boete wordt in
      elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel716
  - number: 7:16.3
    text: |-
      Indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 7:15, eerste of tweede lid][ref1], niet heeft geleid tot het ten onrechte of tot een te hoog bedrag
      verlenen van de financiële tegemoetkoming, kan het Uitvoeringsinstituut werknemersverzekeringen afzien van het
      opleggen van een boete als bedoeld in het eerste lid en volstaan met het geven van een schriftelijke waarschuwing
      ter zake van het niet of niet behoorlijk nakomen van de verplichting, tenzij het niet of niet behoorlijk nakomen
      van de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de
      verlofganger of de werkgever een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel7
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel716
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
        afdeling: '2'
  - number: 7:16.4
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van
      het opleggen van een boete af te zien.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel716
  - number: 7:16.5
    text: |-
      Degene aan wie een boete is opgelegd is verplicht desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen
      de inlichtingen te verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel716
  - number: 7:16.6
    text: Voorzover de boete nog niet is geïnd vervalt zij door het overlijden van degene aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel716
  - number: 7:16.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel716
  - number: 7:17.1
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen jegens de werknemer/verlofganger of de werkgever een
      handeling verricht waaraan deze in redelijkheid de gevolgtrekking kan verbinden dat aan hem wegens een bepaalde
      gedraging een boete zal worden opgelegd, is de verlofganger of de werkgever niet langer verplicht ter zake van die
      gedraging enige verklaring af te leggen, voor zover het betreft de boeteoplegging. De verlofganger of de werkgever
      wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel717
  - number: 7:17.2
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen voornemens is om aan de verlofganger of de werkgever een
      boete op te leggen, wordt aan hem hiervan kennis gegeven onder vermelding van de gronden waarop het voornemen
      berust. De kennisgeving is een handeling als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel717
  - number: 7:17.3
    text: |-
      Op verzoek van de verlofganger of de werkgever die de in het vorige lid bedoelde kennisgeving wegens
      zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt het Uitvoeringsinstituut
      werknemersverzekeringen er zoveel mogelijk zorg voor dat de in die kennisgeving vermelde gronden worden medegedeeld
      in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel717
  - number: 7:17.4
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt het Uitvoeringsinstituut
      werknemersverzekeringen de verlofganger of de werkgever in de gelegenheid om naar keuze schriftelijk of mondeling
      zijn zienswijze naar voren te brengen voordat de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel717
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 7:17.5
    text: |-
      Indien de verlofganger of de werkgever zijn zienswijze mondeling naar voren brengt, draagt het Uitvoeringsinstituut
      werknemersverzekeringen er op verzoek van de verlofganger of de werkgever die de Nederlandse taal onvoldoende
      begrijpt, zorg voor dat een tolk wordt benoemd die hem kan bijstaan, tenzij redelijkerwijs kan worden aangenomen
      dat daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel717
  - number: 7:18.1
    text: |-
      Het besluit waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop het besluit bij gebreke van tijdige betaling, overeenkomstig artikel 7:22 zal
      worden tenuitvoergelegd.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel718
  - number: 7:18.2
    text: |-
      Op verzoek van de verlofganger of de werkgever die het in het eerste lid bedoelde besluit wegens zijn gebrekkige
      kennis van de Nederlandse taal onvoldoende begrijpt, draagt het Uitvoeringsinstituut werknemersverzekeringen er
      zoveel mogelijk zorg voor dat de in dat besluit vermelde informatie wordt meegedeeld in een voor hem begrijpelijke
      taal.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel718
  - number: 7:18.3
    text: Het Uitvoeringsinstituut werknemersverzekeringen stelt nadere regels met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel718
  - number: 7:19.1
    text: Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel719
  - number: 7:19.2
    text: |-
      De oplegging van een boete blijft definitief achterwege indien ter zake van de gedraging tegen de verlofganger of
      de werkgever een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan
      wel het recht tot strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel719
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 7:19.3
    text: |-
      Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel719
  - number: 7:20.1
    text: |-
      Een boete wordt opgelegd binnen een jaar nadat het Uitvoeringsinstituut werknemersverzekeringen de verlofganger
      of de werkgever overeenkomstig het bepaalde in artikel 7:17, vierde lid, in de gelegenheid heeft gesteld zijn
      zienswijze naar voren te brengen. Indien terzake aangifte is gedaan of proces-verbaal is opgemaakt en ingezonden
      vangt de termijn van een jaar aan op de dag na die waarop het openbaar ministerie aan het Uitvoeringsinstituut
      werknemersverzekeringen heeft medegedeeld dat geen strafvervolging wordt ingesteld.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel720
  - number: 7:20.2
    text: |-
      Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel720
  - number: 7:21
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de boete is vastgesteld ook ten nadele van de werknemer wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel721
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 7:22.1
    text: |-
      Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel722
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 7:22.2
    text: |-
      Indien degene aan wie een boete is opgelegd uitkering ontvangt op grond van deze wet, de [Ziektewet][ref1], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref5] of een toeslag op grond van de [Toeslagenwet][ref6], wordt
      het besluit waarbij de boete is opgelegd tenuitvoergelegd door verrekening met die uitkering of toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0002822
      [ref6]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel722
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
      - id: ref5
        bwb_id: BWBR0002822
      - id: ref6
        bwb_id: BWBR0004043
  - number: 7:22.3
    text: |-
      Indien degene aan wie een boete is opgelegd een uitkering ontvangt op grond van de
      [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2], de [Wet werk en bijstand][ref3],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5] of de
      [Wet werk en inkomen kunstenaars][ref6], betaalt de Sociale verzekeringsbank, onderscheidenlijk de betrokken
      gemeente het bedrag van die boete, zonder dat daarvoor een machtiging nodig is van hem, op zijn verzoek aan het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
      [ref6]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel722
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0015703
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
      - id: ref6
        bwb_id: BWBR0017837
  - number: 7:22.4
    text: |-
      Indien degene aan wie een boete is opgelegd geen uitkering als bedoeld in het tweede of derde lid ontvangt, of
      meer ontvangt, dan wel ten aanzien van zodanige uitkering toepassing van het tweede of derde lid niet mogelijk
      is, wordt het besluit waarbij de boete is opgelegd bij gebreke van tijdige betaling met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] op zijn kosten betekend en tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel722
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 7:22.5
    text: |-
      De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede of
      derde lid, dan wel van het vierde lid, dan wel van het tweede of derde lid in combinatie met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel722
  - number: 7:22.6
    text: |-
      Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel722
  - number: 7:22.7
    text: |-
      Op het executoriaal beslag ingevolge dit artikel door het Uitvoeringsinstituut werknemersverzekeringen
      op loon, sociale uitkeringen of andere periodieke betalingen, welke derden verschuldigd zijn of
      worden aan degene aan wie een boete is opgelegd, zijn de [artikelen 479b tot en met 479g][ref1],
      [behoudens artikel 479e, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] van overeenkomstige
      toepassing. De in [artikel 479g][ref3] aan de raad voor de kinderbescherming toegekende bevoegdheid komt
      gelijkelijk toe aan het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel722
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 479e
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479g
  - number: 7:22.8
    text: |-
      De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat de
      verlofganger blijft beschikken over een inkomen gelijk aan de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel722
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 7:22.9
    text: |-
      Het achtste lid geldt niet, zolang de verlofganger zijn verplichting bedoeld in artikel 7:16, vijfde lid, niet of
      niet behoorlijk nakomt.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel722
  - number: 8:1
    text: |-
      Onze Minister zendt, in overeenstemming met Onze Minister van Justitie en Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel81
  - number: 8:2
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel82
  - number: 8:3
    text: 'Deze wet wordt aangehaald als: Wet arbeid en zorg.'
    url: https://wetten.overheid.nl/BWBR0013008/2005-01-01#Artikel83
