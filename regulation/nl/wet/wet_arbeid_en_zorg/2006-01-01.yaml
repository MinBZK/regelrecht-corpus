      werkgever: de werkgever, bedoeld in [artikel 1:1, onderdeel a][ref1], of de [artikelen 10][ref2], [11][ref3]
      of [12 van de Ziektewet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel10
