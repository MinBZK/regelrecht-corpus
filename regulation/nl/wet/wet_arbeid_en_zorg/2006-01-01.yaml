  - number: 3:7.1
    text: |-
      De vrouwelijke werknemer heeft gedurende de periode dat het zwangerschaps- of bevallingsverlof wordt genoten
      overeenkomstig artikel 3:1, tweede en derde lid, recht op uitkering.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel37
  - number: 3:7.2
    text: |-
      De werknemer heeft gedurende de periode dat het verlof in verband met adoptie of de opname van een pleegkind wordt
      genoten overeenkomstig artikel 3:2, tweede lid of vierde lid, recht op uitkering.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel37
  - number: 3:8.1
    text: |-
      De vrouwelijke gelijkgestelde heeft in verband met haar zwangerschap en bevalling recht op uitkering gedurende ten
      minste zestien weken.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel38
  - number: 3:8.2
    text: |-
      Het recht op uitkering in verband met zwangerschap vangt aan zes weken voor de dag na de vermoedelijke datum van
      bevalling, zoals aangegeven in een schriftelijke verklaring van een arts of verloskundige, tot en met de dag van de
      bevalling. Indien de vrouwelijke gelijkgestelde dat wenst vangt het recht op uitkering in verband met zwangerschap
      aan op een later tijdstip, doch uiterlijk vier weken voor de dag na de vermoedelijke datum van bevalling.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel38
  - number: 3:8.3
    text: |-
      Het recht op uitkering in verband met bevalling vangt aan op de dag na de bevalling en bedraagt tien aaneengesloten
      weken vermeerderd met het aantal dagen dat de uitkering in verband met zwangerschap tot en met de vermoedelijke
      datum van bevalling, dan wel, indien eerder gelegen, tot en met de werkelijke datum van bevalling, minder dan zes
      weken heeft bedragen.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel38
  - number: 3:8.4
    text: |-
      Voor de toepassing van het derde lid worden dagen waarover de vrouwelijke gelijkgestelde ziekengeld heeft genoten
      in de periode dat zij recht heeft op uitkering in verband met zwangerschap maar die uitkering nog niet is ingegaan,
      aangemerkt als dagen waarover zij uitkering in verband met zwangerschap heeft genoten.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel38
  - number: 3:9.1
    text: De gelijkgestelde heeft in verband met de adoptie van een kind recht op uitkering.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel39
  - number: 3:9.2
    text: |-
      Het recht op uitkering in verband met adoptie bedraagt ten hoogste vier aaneengesloten weken gedurende een tijdvak
      van achttien weken. Het tijdvak van achttien weken gaat in twee weken vóór de eerste dag dat de feitelijke opneming
      ter adoptie een aanvang heeft genomen of zal nemen, zoals die dag is aangeduid in een door de werknemer aan de
      werkgever overgelegd document waaruit blijkt dat een kind ter adoptie is of zal worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel39
  - number: 3:9.3
    text: |-
      Indien als gevolg van een adoptieverzoek tegelijkertijd twee of meer kinderen feitelijk ter adoptie worden
      opgenomen, bestaat het recht op uitkering slechts ten aanzien van één van die kinderen.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel39
  - number: 3:9.4
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op de werknemer die een pleegkind opneemt als
      bedoeld in artikel 5:1, tweede lid, onder d.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel39
  - number: 3:10.1
    text: |-
      Een recht op uitkering als bedoeld in de [artikelen 3:7, eerste lid][ref1], en [3:8, eerste lid][ref2], komt mede
      toe aan de vrouw wier bevalling waarschijnlijk is onderscheidenlijk plaatsvindt, binnen een periode van tien weken
      na het tijdstip dat zij niet langer werknemer of gelijkgestelde is als bedoeld in [artikel 3:6, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel310
