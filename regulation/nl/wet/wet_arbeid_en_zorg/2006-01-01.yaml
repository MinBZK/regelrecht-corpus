        bwb_id: BWBR0001888
        artikel: '16'
  - number: 3:13.3
    text: |-
      Het dagloon wordt voor de werknemer en de gelijkgestelde, bedoeld in [artikel 3:6, tweede lid][ref1],
      vastgesteld overeenkomstig [artikel 68 van de Ziektewet][ref2] en de regels op grond van
      [artikel 71, onderdeel d, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel71
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel313
