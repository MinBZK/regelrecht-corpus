        afdeling: '2'
  - number: 3:10.2
    text: |-
      Een recht op uitkering als bedoeld in de [artikelen 3:7, tweede lid][ref1], en [3:9, eerste lid][ref2], komt mede
      toe aan de persoon die, op de eerste dag dat een kind feitelijk ter adoptie is opgenomen, korter dan tien weken
      geen werknemer of gelijkgestelde meer is als bedoeld in [artikel 3:6, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel310
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3:10.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing op de persoon die een pleegkind opneemt als bedoeld in
      [artikel 5:1, tweede lid, onder d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel5
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel310
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '1'
  - number: 3:11.1
    text: |-
      De vrouwelijke werknemer of gelijkgestelde, die in aanmerking wenst te komen voor toekenning van een uitkering
      in verband met zwangerschap en bevalling doet de aanvraag daartoe door tussenkomst van de werkgever bij
      het Uitvoeringsinstituut werknemersverzekeringen uiterlijk twee weken voor de datum van ingang van het
      zwangerschapsverlof onderscheidenlijk de datum waarop zij het recht op uitkering wil laten ingaan. Bij die aanvraag
      wordt gemeld:
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel311
  - number: 3:11.1.a
    text: |-
      de vermoedelijke datum van bevalling, onder overlegging van de verklaring van een arts of van een verloskundige
      waarin die datum is aangegeven;
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel311
  - number: 3:11.1.b
    text: |-
      de datum waarop het zwangerschapsverlof ingaat dan wel de datum waarop de gelijkgestelde het recht op uitkering wil
      laten ingaan.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel311
  - number: 3:11.2
    text: |-
      De werknemer of gelijkgestelde, die in aanmerking wenst te komen voor toekenning van een uitkering in verband
      met adoptie of pleegzorg, doet de aanvraag daartoe door tussenkomst van de werkgever bij het Uitvoeringsinstituut
      werknemersverzekeringen uiterlijk twee weken voor de datum van ingang van het verlof in verband met adoptie of
      pleegzorg onderscheidenlijk de datum waarop hij het recht op uitkering wil laten ingaan. Bij de aanvraag worden
      documenten gevoegd waaruit blijkt dat een kind ter adoptie of pleegzorg is of zal worden opgenomen en wanneer die
      opneming ter adoptie of pleegzorg heeft plaatsgevonden of zal plaatsvinden. Bij die aanvraag wordt de datum waarop
      het verlof in verband met adoptie of pleegzorg ingaat gemeld dan wel de datum waarop hij het recht op uitkering wil
      laten ingaan.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel311
  - number: 3:11.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan in bijzondere gevallen ten gunste van de werknemer of
      gelijkgestelde afwijken van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel311
  - number: 3:12.1
    text: |-
      Indien de vrouwelijke gelijkgestelde, die in aanmerking wenst te komen voor toekenning van een uitkering in verband
      met zwangerschap en bevalling, geen werkgever heeft, doet zij de aanvraag daartoe bij het Uitvoeringsinstituut
      werknemersverzekeringen uiterlijk twee weken voor de datum waarop zij het recht op uitkering wil laten ingaan.
      [Artikel 3:11, eerste lid, tweede volzin][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel312
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3:12.2
    text: |-
      Indien de gelijkgestelde, die in aanmerking wenst te komen voor toekenning van uitkering in verband met adoptie of
      pleegzorg, geen werkgever heeft, doet hij de aanvraag daartoe bij het Uitvoeringsinstituut werknemersverzekeringen
      uiterlijk twee weken voor ingang van de datum waarop hij het recht op uitkering wil laten ingaan.
      [Artikel 3:11, tweede lid, tweede en derde volzin][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel312
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3:12.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan in bijzondere gevallen ten gunste van de gelijkgestelde
      afwijken van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel312
  - number: 3:12.4
    text: |-
      Voor de toepassing van dit artikel wordt onder gelijkgestelde mede verstaan degene die recht op uitkering heeft op
      grond van [artikel 3:10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel312
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3:13.1
    text: De uitkering, bedoeld in deze paragraaf, bedraagt per dag het dagloon.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel313
  - number: 3:13.2
    text: |-
      Het dagloon wordt voor de werknemer en de gelijkgestelde, bedoeld in [artikel 3:6, eerste lid][ref1], en de
      betrokkene, bedoeld in [artikel 3:10, eerste en tweede lid][ref2], vastgesteld en herzien overeenkomstig de
      vaststelling en herziening met betrekking tot de werknemer, bedoeld in [artikel 29b van de Ziektewet][ref3], op
      grond van de [artikelen 15][ref4] en [16 van die wet][ref5] en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel16
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel313
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
