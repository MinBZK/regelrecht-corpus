  - number: 3:29.3
    text: |-
      Indien een gelijkgestelde als bedoeld in [artikel 3:6, eerste lid, onderdeel b, onder 2°][ref1], over dezelfde
      periode tevens uit andere hoofde recht heeft op één of meerdere uitkeringen op grond van [paragraaf 1][ref2],
      wordt de uitkering van die gelijkgestelde uitbetaald voorzover deze uitkering samen met de andere uitkeringen
      niet meer bedraagt dan 100% van het dagloon dat ten grondslag ligt aan de loongerelateerde uitkering van de
      werkhervattingsuitkering gedeeltelijk arbeidsgeschikten.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013008
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3:29.4
    text: |-
      Indien een persoon over dezelfde periode zowel recht heeft op een uitkering op grond van
      [paragraaf 1][ref1] van deze afdeling als op arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] wordt eerstgenoemde uitkering uitbetaald voorzover deze samen
      met de arbeidsongeschiktheidsuitkering niet meer bedraagt dan het hoogste van de daglonen, die aan die uitkeringen
      ten grondslag liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002524
  - number: 3:29.5
    text: |-
      Indien een persoon over dezelfde periode zowel recht heeft op een uitkering op grond van
      [paragraaf 2][ref1] van deze afdeling als op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2], wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008656
  - number: 3:29.5.a
    text: |-
      indien de grondslag van de eerstgenoemde uitkering lager is dan de grondslag van de arbeidsongeschiktheidsuitkering
      of daaraan gelijk is, de eerstgenoemde uitkering uitbetaald voorzover deze samen met de
      arbeidsongeschiktheidsuitkering niet meer bedraagt dan de grondslag van de arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel329
  - number: 3:29.5.b
    text: |-
      indien de grondslag van de eerstgenoemde uitkering hoger is dan de grondslag van de
      arbeidsongeschiktheidsuitkering, de eerstgenoemde uitkering uitbetaald voorzover deze samen met de
      arbeidsongeschiktheidsuitkering niet meer bedraagt dan de grondslag van de eerstgenoemde uitkering;
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel329
  - number: 3:29.5.c
    text: |-
      indien het recht op eerstgenoemde uitkering ontstaat in het tijdvak van 52 weken bedoeld in
      [artikel 7, tweede lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1], in afwijking van
      de onderdelen a en b, de eerstgenoemde uitkering uitbetaald voorzover deze de arbeidsongeschiktheidsuitkering
      overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '7'
  - number: 3:29.6
    text: |-
      Voor de toepassing van het derde tot en met vijfde lid wordt onder arbeidsongeschiktheidsuitkering op grond
      van de [Wet op de arbeidsongeschiktheidsverzekering][ref1], arbeidsongeschiktheidsuitkering op grond van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2], uitkering op grond van [paragraaf 1][ref3] van deze
      afdeling en uitkering op grond van [paragraaf 2][ref4] van deze afdeling tevens verstaan de vakantie-uitkering
      waarop uit hoofde van die arbeidsongeschiktheidsuitkeringen en die uitkeringen recht bestaat, voor zover die
      vakantie-uitkering over dezelfde periode is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0013008
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0013008
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 3:29.7
    text: |-
      Indien de arbeidsongeschiktheidsuitkering geheel of gedeeltelijk wordt geweigerd op grond van enig handelen
      of nalaten dat de betrokkene kan worden verweten, wordt voor de toepassing van het derde en vierde lid de
      arbeidsongeschiktheidsuitkering in aanmerking genomen alsof die weigering niet heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel329
  - number: 3:30.1
    text: |-
      Op de zelfstandige, bedoeld in artikel 3:17, onderdeel a, zoals dat luidde op de dag voorafgaand aan de
      inwerkingtreding van [artikel II, onderdeel D, van de Wet einde toegang verzekering WAZ][ref1], van wie de
      vermoedelijke of feitelijke bevallingsdatum valt binnen 40 weken na de inwerkingtreding van [dat artikel][ref2]
      dan wel die binnen 40 weken na de inwerkingtreding van dat artikel feitelijk een kind ter adoptie of pleegzorg
      heeft opgenomen, blijft hoofdstuk 3, afdeling 2, paragraaf 2, zoals dat luidde op de dag voorafgaand aan de
      inwerkingtreding van [artikel II, onderdeel D, van de Wet einde toegang verzekering WAZ][ref3] van toepassing met
      betrekking tot die bevalling dan wel die opneming.


      [ref1]: https://wetten.overheid.nl/BWBR0016985#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0016985#ArtikelII
      [ref3]: https://wetten.overheid.nl/BWBR0016985#ArtikelII
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel330
    references:
      - id: ref1
        bwb_id: BWBR0016985
        artikel: II
      - id: ref2
        bwb_id: BWBR0016985
        artikel: II
      - id: ref3
        bwb_id: BWBR0016985
        artikel: II
  - number: 3:30.2
    text: |-
      Op de beroepsbeoefenaar op arbeidsovereenkomst, bedoeld in artikel 3:17, onderdeel
      b, zoals dat onderdeel luidde op de dag voorafgaand aan de inwerkingtreding van
      [artikel II, onderdeel D, van de Wet einde toegang verzekering WAZ][ref1], die binnen 40 weken na
      de inwerkingtreding van dat artikel feitelijk een kind ter adoptie of pleegzorg heeft opgenomen,
      blijft hoofdstuk 3, afdeling 2, paragraaf 2, zoals dat luidde voorafgaand aan de inwerkingtreding van
      [artikel II, onderdeel D, van de Wet einde toegang verzekering WAZ][ref2] van toepassing met betrekking tot die
      opneming.


      [ref1]: https://wetten.overheid.nl/BWBR0016985#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0016985#ArtikelII
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel330
    references:
      - id: ref1
        bwb_id: BWBR0016985
        artikel: II
      - id: ref2
        bwb_id: BWBR0016985
        artikel: II
  - number: 3:30.3
    text: |-
      In afwijking van het eerste en tweede lid komen de onder toepassing van dit artikel te betalen uitkeringen en de
      uitvoeringskosten met betrekking tot die uitkeringen ten laste van het Arbeidsongeschiktheidsfonds.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel330
  - number: 4:1.1
    text: |-
      De werknemer heeft recht op verlof met behoud van loon voor een korte, naar billijkheid te berekenen tijd, wanneer
      hij zijn arbeid niet kan verrichten wegens:
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel41
  - number: 4:1.1.a
    text: zeer bijzondere persoonlijke omstandigheden;
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel41
  - number: 4:1.1.b
    text: |-
      een door wet of overheid, zonder geldelijke vergoeding, opgelegde verplichting, waarvan de vervulling niet in zijn
      vrije tijd kon plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel41
  - number: 4:1.1.c
    text: de uitoefening van het actief kiesrecht.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel41
  - number: 4:1.2
    text: 'Onder zeer bijzondere persoonlijke omstandigheden worden in ieder geval begrepen:'
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel41
  - number: 4:1.2.a
    text: de bevalling van de echtgenote, de geregistreerde partner of de persoon met wie de werknemer ongehuwd samenwoont;
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel41
  - number: 4:1.2.b
    text: |-
      het overlijden en de lijkbezorging van een van zijn huisgenoten of een van zijn bloed- en aanverwanten in de rechte
      lijn en in de tweede graad van de zijlijn.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel41
  - number: 4:2
    text: |-
      Na de bevalling van de echtgenote, de geregistreerde partner, de persoon met wie hij ongehuwd samenwoont of degene
      van wie hij het kind erkent, heeft de werknemer gedurende een tijdvak van vier weken recht op verlof met behoud
      van loon voor twee dagen waarop hij arbeid pleegt te verrichten. Het recht bestaat vanaf de eerste dag dat het kind
      feitelijk op hetzelfde adres als de moeder woont.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel42
  - number: 4:3.1
    text: |-
      De werknemer meldt vooraf aan de werkgever dat hij het verlof, bedoeld in de artikelen 4:1 en 4:2, opneemt onder
      opgave van de reden. Indien dit niet mogelijk is, meldt de werknemer het opnemen van het verlof zo spoedig mogelijk
      aan de werkgever onder opgave van de reden.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel43
  - number: 4:3.2
    text: |-
      Het verlof van de militaire ambtenaar vangt niet aan of eindigt in ieder geval zodra de werkgever aan hem kenbaar
      maakt dat hij tegen het opnemen van het verlof onderscheidenlijk de voortzetting daarvan een zodanig zwaarwegend
      dienstbelang heeft, dat het belang van de militaire ambtenaar daarvoor naar maatstaven van redelijkheid en
      billijkheid moet wijken.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel43
  - number: 4:4
    text: |-
      De werkgever kan achteraf van de werknemer verlangen dat hij aannemelijk maakt dat hij zijn arbeid niet heeft
      kunnen verrichten wegens een van de redenen genoemd in de artikelen 4:1 en 4:2.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel44
  - number: 4:5.1
    text: |-
      Indien de werknemer op grond van enige wettelijk voorgeschreven verzekering of krachtens enige verzekering
      of uit enig fonds waarin de deelneming is overeengekomen bij of voortvloeit uit de arbeidsovereenkomst of
      publiekrechtelijke aanstelling, een geldelijke uitkering toekomt, wordt het loon verminderd met het bedrag van
      die uitkering.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel45
  - number: 4:5.2
    text: |-
      Het loon wordt verminderd met het bedrag van de door de werkgever vergoede onkosten die de werknemer door het niet
      verrichten van zijn arbeid heeft bespaard.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel45
  - number: 4:6.1
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer zijn arbeid niet verricht wegens het verlof, bedoeld in artikel
      4:1, kunnen slechts indien in een voorkomend geval de werknemer ermee instemt worden aangemerkt als vakantie, met
      dien verstande dat de werknemer ten minste recht houdt op het wettelijk minimum aan vakantie-aanspraken.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel46
  - number: 4:6.2
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer zijn arbeid niet verricht wegens het verlof, bedoeld in artikel
      4:2, kunnen niet worden aangemerkt als vakantie.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel46
  - number: 4:7
    text: |-
      Van [artikel 4:1][ref1], voor wat betreft de loonbetaling, en de [artikelen 4:2 tot en met 4:6][ref2] kan
      uitsluitend ten nadele van de werknemer worden afgeweken bij collectieve arbeidsovereenkomst of bij regeling door
      of namens een daartoe bevoegd bestuursorgaan dan wel, indien geen collectieve arbeidsovereenkomst of regeling
      van toepassing is of terzake geen bepaling bevat, indien de werkgever terzake schriftelijke overeenstemming heeft
      bereikt met de ondernemingsraad of, bij het ontbreken daarvan, met de personeelsvertegenwoordiging, met dien
      verstande dat de werknemer bij afwijking van [artikel 4:6][ref3] ten minste recht houdt op het wettelijke minimum
      aan vakantie-aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel4
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 5:1.1
    text: |-
      De werknemer heeft recht op verlof voor de noodzakelijke verzorging in verband met ziekte van een persoon als
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel51
  - number: 5:1.2
    text: 'Onder een persoon als bedoeld in het eerste lid, wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel51
  - number: 5:1.2.a
    text: de echtgenoot, de geregistreerde partner of de persoon met wie de werknemer ongehuwd samenwoont;
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel51
  - number: 5:1.2.b
    text: een inwonend kind tot wie de werknemer als ouder in een familierechtelijke betrekking staat;
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel51
  - number: 5:1.2.c
    text: |-
      een inwonend kind van de echtgenoot, de geregistreerde partner of de persoon met wie de werknemer ongehuwd
      samenwoont;
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel51
  - number: 5:1.2.d
    text: |-
      een pleegkind dat blijkens verklaringen uit de gemeentelijke basisadministratie op hetzelfde adres woont als de
      werknemer en door hem in diens gezin duurzaam wordt verzorgd en opgevoed op basis van een pleegcontract als bedoeld
      in [artikel 22, eerste lid, van de Wet op de jeugdzorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel22
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '22'
  - number: 5:1.2.e
    text: een bloedverwant in de eerste graad, niet zijnde een kind.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel51
  - number: 5:2
    text: |-
      Het verlof bedraagt in elke periode van 12 achtereenvolgende maanden ten hoogste twee maal de arbeidsduur per week.
      De periode van 12 maanden gaat in op de eerste dag waarop het verlof wordt genoten.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel52
  - number: 5:3
    text: |-
      De werknemer meldt vooraf aan de werkgever dat hij het verlof, bedoeld in artikel 5:1 opneemt onder opgave van
      de reden. Indien dit niet mogelijk is, meldt de werknemer het opnemen van het verlof zo spoedig mogelijk aan de
      werkgever onder opgave van de reden. Bij die melding geeft de werknemer ook de omvang, de wijze van opneming en de
      vermoedelijke duur van het verlof aan.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel53
  - number: 5:4.1
    text: Het verlof gaat in op het tijdstip waarop de werknemer het opnemen ervan meldt aan de werkgever.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel54
  - number: 5:4.2
    text: |-
      Het verlof vangt niet aan of eindigt in ieder geval zodra de werkgever aan de werknemer kenbaar maakt dat hij
      tegen het opnemen van het verlof onderscheidenlijk de voortzetting daarvan een zodanig zwaarwegend bedrijfs- of
      dienstbelang heeft, dat het belang van de werknemer daarvoor naar maatstaven van redelijkheid en billijkheid moet
      wijken.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel54
  - number: 5:4.3
    text: |-
      Een werkgever die nadat een melding door de werknemer, niet zijnde een militaire ambtenaar, hem bereikt heeft en
      naar aanleiding daarvan geen beroep doet op een zwaarwegend bedrijfs- of dienstbelang, kan dit nadien evenmin.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel54
  - number: 5:5
    text: |-
      De werkgever kan achteraf van de werknemer verlangen dat hij aannemelijk maakt dat hij zijn arbeid niet heeft
      verricht in verband met de noodzakelijke verzorging van een persoon als bedoeld in artikel 5:1.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel55
  - number: 5:6.1
    text: |-
      Voorzover het loon niet meer bedraagt dan het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1], met betrekking tot een loontijdvak
      van een dag, behoudt de werknemer, die anders dan op grond van een publiekrechtelijke aanstelling arbeid verricht,
      gedurende het verlof, bedoeld in [artikel 5:1][ref2], recht op 70% van het loon, maar ten minste op het voor hem
      geldende wettelijke minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel5
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '1'
  - number: 5:6.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de werknemer, die arbeid verricht op grond van een
      publiekrechtelijke aanstelling.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel56
  - number: 5:7.1
    text: |-
      Indien de werknemer op grond van enige wettelijk voorgeschreven verzekering of krachtens enige verzekering
      of uit enig fonds waarin de deelneming is overeengekomen bij of voortvloeit uit de arbeidsovereenkomst of
      publiekrechtelijke aanstelling, een geldelijke uitkering toekomt, wordt het loon verminderd met het bedrag van
      die uitkering.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel57
  - number: 5:7.2
    text: |-
      Het loon wordt verminderd met het bedrag van de door de werkgever vergoede onkosten die de werknemer door het niet
      verrichten van zijn arbeid heeft bespaard.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel57
  - number: 5:8
    text: |-
      Indien zowel de in artikel 4:1 als de in artikel 5:1 gestelde voorwaarden worden vervuld, eindigt het in artikel
      4:1 bedoelde verlof na één dag.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel58
  - number: 5:9
    text: |-
      De werknemer heeft recht op verlof zonder behoud van loon voor de verzorging van een persoon, die levensbedreigend
      ziek is, indien het betreft:
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel59
  - number: 5:9.a
    text: de echtgenoot, de geregistreerde partner of de persoon met wie de werknemer ongehuwd samenwoont;
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel59
  - number: 5:9.b
    text: |-
      een kind tot wie de werknemer of de persoon bedoeld in onderdeel a als ouder in een familierechtelijke betrekking
      staat, dan wel een pleegkind van de werknemer als bedoeld in [artikel 5:1, eerste lid, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel5
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '1'
  - number: 5:9.c
    text: een bloedverwant in de eerste graad van de werknemer.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel59
  - number: 5:10.1
    text: |-
      Het verlof bedraagt in elke periode van twaalf achtereenvolgende maanden ten hoogste zes maal de arbeidsduur per
      week. De periode van 12 maanden gaat in op de eerste dag waarop het verlof wordt genoten.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel510
  - number: 5:10.2
    text: Het verlof wordt per week opgenomen gedurende een aaneengesloten periode van ten hoogste twaalf weken.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel510
  - number: 5:10.3
    text: Het aantal uren verlof per week bedraagt ten hoogste de helft van de arbeidsduur per week.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel510
  - number: 5:10.4
    text: 'In afwijking van het tweede en derde lid kan de werknemer de werkgever verzoeken om:'
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel510
  - number: 5:10.4.a
    text: verlof voor een langere periode dan twaalf weken tot ten hoogste achttien weken, of
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel510
  - number: 5:10.4.b
    text: meer uren verlof per week dan de helft van de arbeidsduur per week.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel510
  - number: 5:11.1
    text: |-
      De werknemer dient het verzoek om verlof ten minste twee weken voor het beoogde tijdstip van ingang van het verlof
      schriftelijk in bij de werkgever onder opgave van de reden, de persoon die verzorging behoeft, het tijdstip van
      ingang, de omvang, de voorgenomen duur van het verlof en de spreiding van de uren over de week of het anderszins
      overeengekomen tijdvak.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel511
  - number: 5:11.2
    text: |-
      De werknemer verstrekt desgevraagd aan de werkgever schriftelijk aanvullende informatie waarover hij
      redelijkerwijs en op korte termijn kan beschikken teneinde aannemelijk te maken dat is voldaan aan de op grond
      van [artikel 5:9][ref1] geldende voorwaarden. De werkgever doet een schriftelijk verzoek tot het verstrekken van
      aanvullende informatie binnen een week nadat het verzoek om verlof bij hem is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel5
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel511
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '2'
  - number: 5:11.3
    text: |-
      De werkgever willigt het verzoek om verlof van de werknemer in, tenzij hij tegen het opnemen van het verlof een
      zodanig zwaarwegend bedrijfs- of dienstbelang heeft, dat het belang van de werknemer daarvoor naar maatstaven van
      redelijkheid en billijkheid moet wijken.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel511
  - number: 5:11.4
    text: |-
      Een werkgever die geen beroep doet op een zwaarwegend bedrijfs- of dienstbelang, kan dit nadien evenmin, tenzij het
      een militaire ambtenaar betreft.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel511
  - number: 5:11.5
    text: |-
      Indien de werkgever overweegt het verzoek om verlof niet of niet geheel in te willigen, pleegt hij overleg met de
      werknemer over diens verzoek. De beslissing op het verzoek om verlof wordt door de werkgever schriftelijk aan de
      werknemer medegedeeld. Indien de werkgever het verzoek niet of niet geheel inwilligt, wordt dit onder opgave van
      redenen aan de werknemer medegedeeld.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel511
  - number: 5:11.6
    text: |-
      Indien de werkgever niet een week voor het beoogde tijdstip van ingang van het verlof de beslissing op het verzoek
      schriftelijk heeft medegedeeld aan de werknemer, gaat het verlof in overeenkomstig het verzoek van de werknemer.
      Zolang de werknemer niet heeft voldaan aan een verzoek van de werkgever om informatie als bedoeld in het tweede
      lid, wordt de in de eerste volzin bedoelde periode verlengd met het aantal dagen dat de werknemer niet heeft
      voldaan aan het verzoek van de werkgever.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel511
  - number: 5:12.1
    text: |-
      Het verlof bedoeld in [artikel 5:9][ref1] gaat niet in voordat ten minste twee weken zijn verstreken nadat de
      werknemer het verzoek om verlof bedoeld in [artikel 5:11][ref2] heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel5
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel512
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: '2'
  - number: 5:12.2
    text: |-
      In afwijking van het eerste lid kan het verlof op verzoek van de werknemer ingaan op een eerder tijdstip indien de
      werkgever daarmee instemt.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel512
  - number: 5:13.1
    text: Het verlof eindigt met het verstrijken van de duur waarvoor het verlof is verleend.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel513
  - number: 5:13.2
    text: |-
      Indien voor het verstrijken van de in het eerste lid bedoelde verlofduur de persoon ten behoeve van wiens
      verzorging het verlof is verleend overlijdt, dan wel niet langer levensbedreigend ziek is, eindigt het verlof met
      ingang van de dag na die waarop deze omstandigheid zich heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel513
  - number: 5:14
    text: |-
      Indien het verzoek om langdurend zorgverlof wordt ingewilligd, kan het daaraan voorafgaand kortdurend
      zorgverlof bedoeld in [artikel 5:1][ref1] op verzoek van de werknemer en met inachtneming van
      [artikel 5:12, tweede lid][ref2], geheel of gedeeltelijk worden aangemerkt als langdurend zorgverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel5
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel514
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: '2'
  - number: 5:15
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer zijn arbeid niet verricht wegens het verlof, bedoeld in
      [artikel 5:1][ref1] of [artikel 5:9][ref2], kunnen niet worden aangemerkt als vakantie.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel5
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel515
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '2'
  - number: 5:16
    text: |-
      Van dit hoofdstuk kan uitsluitend ten nadele van de werknemer worden afgeweken bij collectieve arbeidsovereenkomst
      of bij regeling door of namens een daartoe bevoegd bestuursorgaan dan wel, indien geen collectieve
      arbeidsovereenkomst of regeling van toepassing is of terzake geen bepaling bevat, indien de werkgever terzake
      schriftelijke overeenstemming heeft bereikt met de ondernemingsraad of bij het ontbreken daarvan, met de
      personeeelsvertegenwoordiging met dien verstande dat de werknemer bij afwijking van [artikel 5:15][ref1] ten minste
      recht houdt op het wettelijke minimum aan vakantie-aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel5
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel516
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '3'
  - number: 6:1.1
    text: |-
      De werknemer die als ouder in familierechtelijke betrekking staat tot een kind, heeft recht op verlof zonder
      behoud van loon. Indien de werknemer met ingang van hetzelfde tijdstip tot meer dan één kind in familierechtelijke
      betrekking komt te staan, bestaat er ten aanzien van ieder van die kinderen recht op verlof.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel61
  - number: 6:1.2
    text: |-
      De werknemer die blijkens verklaringen uit de gemeentelijke basisadministratie op hetzelfde adres woont als een
      kind en duurzaam de verzorging en de opvoeding van dat kind als eigen kind op zich heeft genomen, heeft recht
      op verlof zonder behoud van loon. Indien de werknemer met het oog op adoptie met ingang van hetzelfde tijdstip
      de verzorging en opvoeding van meer dan één kind op zich heeft genomen, bestaat er ten aanzien van ieder van die
      kinderen recht op verlof. In alle andere gevallen waarin de in de eerste volzin gestelde voorwaarden voor meer dan
      één kind met ingang van hetzelfde tijdstip worden vervuld, bestaat er slechts recht op één keer verlof.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel61
  - number: 6:1.3
    text: |-
      Indien de arbeid buiten Nederland wordt verricht heeft de werknemer recht op het verlof bedoeld in dit artikel,
      tenzij een zwaarwegend bedrijfs- of dienstbelang zich hiertegen verzet.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel61
  - number: 6:2.1
    text: Het aantal uren verlof waarop de werknemer ten hoogste recht heeft bedraagt dertien maal de arbeidsduur per week.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel62
  - number: 6:2.2
    text: Het verlof wordt per week opgenomen gedurende een aaneengesloten periode van ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel62
  - number: 6:2.3
    text: Het aantal uren verlof per week bedraagt ten hoogste de helft van de arbeidsduur per week.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel62
  - number: 6:2.4
    text: 'In afwijking van het tweede en derde lid kan de werknemer de werkgever verzoeken om:'
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel62
  - number: 6:2.4.a
    text: verlof voor een langere periode dan zes maanden, of
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel62
  - number: 6:2.4.b
    text: het verlof op te delen in ten hoogste drie perioden, waarbij iedere periode ten minste een maand bedraagt, of
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel62
  - number: 6:2.4.c
    text: meer uren verlof per week dan de helft van de arbeidsduur per week.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel62
  - number: 6:2.5
    text: |-
      De werkgever kan het verzoek van de werknemer, bedoeld in het vierde lid, afwijzen indien een zwaarwegend bedrijfs-
      of dienstbelang zich hiertegen verzet.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel62
  - number: 6:2.6
    text: |-
      Indien het verlof op grond van het vierde lid, onderdeel b, is opgedeeld en de arbeidsverhouding wordt beëindigd
      voordat het verlof volledig is genoten, heeft de werknemer, indien hij een nieuwe arbeidsovereenkomst aangaat,
      tegenover de nieuwe werkgever aanspraak op het resterende deel van het verlof met inachtneming van het bepaalde in
      dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel62
  - number: 6:3.1
    text: Het recht op verlof, bedoeld in artikel 6:1, bestaat indien de arbeidsverhouding ten minste een jaar heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel63
  - number: 6:3.2
    text: |-
      Voor de berekening van de termijn van een jaar worden perioden waarin arbeid wordt verricht, die elkaar opvolgen
      met een onderbreking van niet meer dan drie maanden samengeteld. De vorige volzin is van overeenkomstige toepassing
      op perioden waarin voor verschillende werkgevers arbeid wordt verricht die ten aanzien van de verrichte arbeid
      redelijkerwijs geacht moeten worden elkanders opvolger te zijn.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel63
  - number: 6:4
    text: |-
      Geen recht op verlof als bedoeld in artikel 6:1 bestaat na de datum waarop het kind de leeftijd van acht jaren
      heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel64
  - number: 6:5.1
    text: |-
      De werknemer meldt het voornemen om verlof op te nemen ten minste twee maanden voor het tijdstip van ingang van
      het verlof schriftelijk aan de werkgever onder opgave van de periode, het aantal uren verlof per week of als de
      arbeidsduur over een ander tijdvak is overeengekomen over dat tijdvak en de spreiding daarvan over de week of het
      anderszins overeengekomen tijdvak.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel65
  - number: 6:5.2
    text: |-
      De tijdstippen van ingang en einde van het verlof kunnen afhankelijk worden gesteld van de datum van de bevalling,
      van het einde van het bevallingsverlof of van de aanvang van de verzorging.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel65
  - number: 6:5.3
    text: |-
      De werkgever kan, na overleg met de werknemer, de spreiding van de uren over de week op grond van een zwaarwegend
      bedrijfs- of dienstbelang wijzigen, tot vier weken voor het tijdstip van ingang van het verlof.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel65
  - number: 6:5.4
    text: |-
      Indien op grond van artikel 6:2, vierde lid, onderdeel b, het verlof is opgedeeld, zijn het eerste tot en met derde
      lid op iedere periode van toepassing.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel65
  - number: 6:6.1
    text: |-
      De werkgever kan een verzoek van de werknemer om het verlof niet op te nemen of niet voort te zetten op grond van
      onvoorziene omstandigheden afwijzen indien een zwaarwegend bedrijfs- of dienstbelang zich hiertegen verzet.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel66
  - number: 6:6.2
    text: |-
      De werkgever hoeft aan het verzoek niet met ingang van een vroeger tijdstip gevolg te geven dan vier weken na het
      verzoek. In het geval dat het verlof met toepassing van het eerste lid na het tijdstip van ingang daarvan niet
      wordt voortgezet, vervalt het recht op het overige deel van het verlof.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel66
  - number: 6:6.3
    text: |-
      Indien op grond van artikel 6:2, vierde lid, onderdeel b, het verlof is opgedeeld, zijn het eerste en tweede lid op
      iedere periode van toepassing.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel66
  - number: 6:7
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer zijn arbeid niet verricht wegens het verlof, bedoeld in artikel
      6:1, kunnen niet worden aangemerkt als vakantie.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel67
  - number: 6:8
    text: |-
      Van de [artikelen 6:1, derde lid][ref1], [6:2, vierde lid, onderdeel b][ref2], [6:3, eerste lid][ref3],
      [6:4][ref4], [6:5, eerste lid][ref5], ten aanzien van het tijdstip van melding, en tweede lid, en [6:6][ref6] kan
      uitsluitend ten nadele van de werknemer worden afgeweken bij collectieve arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel6
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0013008
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0013008
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 6:9
    text: Behoudens artikel 6:8 kan van dit hoofdstuk niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel69
  - number: 7:1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel71
  - number: 7:1.a
    text: |-
      levensloopregeling: een regeling als bedoeld in [artikel 19g van de Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 7:1.b
    text: |-
      uitvoerder: een kredietinstelling, een verzekeraar of een beheerder van een beleggingsinstelling als bedoeld in
      [artikel 19g, derde lid, van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 7:2.1
    text: |-
      De werknemer heeft onder bij en krachtens de [Wet op de loonbelasting 1964][ref1] gestelde voorwaarden elk
      kalenderjaar recht deel te nemen aan een levensloopregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 7:2.2
    text: |-
      De werkgever draagt het op verzoek van de werknemer ter zake van een levensloopregeling ingehouden loon af aan de
      door de werknemer aangewezen uitvoerder.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel72
  - number: 7:2.3
    text: |-
      Bij het in het tweede lid bedoelde verzoek geeft de werknemer kennis aan de werkgever van de hoogte van het per
      kalenderjaar in te houden en af te dragen loon.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel72
  - number: 7:2.4
    text: |-
      De werkgever willigt het verzoek in uiterlijk met ingang van de aanvang van de derde kalendermaand na de indiening
      ervan.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel72
  - number: 7:2.5
    text: |-
      De werknemer kan het in het tweede lid bedoelde verzoek slechts een keer per jaar doen, met dien verstande dat de
      werknemer te allen tijde kan verzoeken om de inhoudingen en afdrachten te beëindigen.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel72
  - number: 7:3
    text: Van dit hoofdstuk kan niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel73
  - number: 8:1
    text: |-
      Onze Minister zendt, in overeenstemming met Onze Minister van Justitie en Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel81
  - number: 8:2
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel82
  - number: 8:3
    text: 'Deze wet wordt aangehaald als: Wet arbeid en zorg.'
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel83
