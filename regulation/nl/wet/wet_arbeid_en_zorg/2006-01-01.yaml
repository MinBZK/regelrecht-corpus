        artikel: '68'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '71'
  - number: 3:14.1
    text: |-
      Een uitkering als bedoeld in deze paragraaf wordt zo spoedig mogelijk, maar uiterlijk binnen een maand nadat het
      Uitvoeringsinstituut werknemersverzekeringen het recht op uitkering heeft vastgesteld, uitbetaald. De betaling
      geschiedt als regel in tijdvakken van een maand.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel314
  - number: 3:14.2
    text: De uitkering wordt betaald over iedere dag, doch niet over de zaterdagen en de zondagen.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel314
  - number: 3:14.3
    text: |-
      De artikelen [40][ref1], [41][ref2], [42][ref3], [47a][ref4], [48][ref5] en [85 van de Ziektewet][ref6] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel42
