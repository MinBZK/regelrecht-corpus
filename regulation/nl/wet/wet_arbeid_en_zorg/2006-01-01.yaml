    text: |-
      [Artikel 35, derde lid, van de Ziektewet][ref1] is van overeenkomstige toepassing ongeacht of het recht op
      uitkering met ingang van de dag na het overlijden binnen een maand zou zijn geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel316
