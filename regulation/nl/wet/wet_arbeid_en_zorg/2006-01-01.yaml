  - number: 3:18
    text: |-
      De vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst heeft gedurende de periode dat het zwangerschaps- en
      bevallingsverlof wordt genoten overeenkomstig [artikel 3:1, tweede en derde lid][ref1], recht op uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel318
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 3:21.1
    text: |-
      De beroepsbeoefenaar op arbeidsovereenkomst kan een recht op uitkering op grond van [artikel 3:18][ref1], tezamen
      met het recht op vakantie-uitkering daarover, genieten in de vorm van een uitkering ter zake van vervanging.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel321
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 3:21.2
    text: 'Toekenning van een uitkering ter zake van vervanging, bedoeld in het eerste lid, is uitsluitend mogelijk:'
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel321
  - number: 3:21.2.a
    text: |-
      indien ter vervanging van de beroepsbeoefenaar op arbeidsovereenkomst een persoon werkzaam is gedurende de periode
      dat het recht op uitkering bestaat, en
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel321
  - number: 3:21.2.b
    text: |-
      de persoon die als vervanger werkzaam is, ter beschikking wordt gesteld door een rechtspersoonlijkheid bezittende
      instelling, die zich krachtens haar statuten ten doel stelt arbeidskrachten ter beschikking te stellen.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel321
  - number: 3:22.1
    text: |-
      De vrouwelijke beroepsbeoefenaar op arbeidsovereenkomst, die in aanmerking wenst te komen voor toekenning van
      een uitkering in verband met zwangerschap en bevalling, doet de aanvraag daartoe bij het Uitvoeringsinstituut
      werknemersverzekeringen uiterlijk twee weken voor de datum van ingang van het zwangerschapsverlof. Bij die aanvraag
      wordt gemeld:
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel322
  - number: 3:22.1.a
    text: |-
      de vermoedelijke datum van bevalling, onder overlegging van de verklaring van een arts of van een verloskundige
      waarin die datum is aangegeven;
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel322
  - number: 3:22.1.b
    text: de datum waarop het zwangerschapsverlof ingaat;
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel322
  - number: 3:22.1.c
    text: of zij de uitkering wil genieten in de vorm van een uitkering ter zake van vervanging.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel322
  - number: 3:22.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan in bijzondere gevallen ten gunste van de beroepsbeoefenaar op
      arbeidsovereenkomst afwijken van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel322
  - number: 3:23.1
    text: |-
      De uitkering in verband met zwangerschap en bevalling wordt overeenkomstig
      [artikel 8 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] berekend naar de grondslag met dien
      verstande dat bij de overeenkomstige toepassing van het [derde lid van dat artikel][ref2] voor «intreden van zijn
      arbeidsongeschiktheid als beroepsbeoefenaar» wordt gelezen: de ingangsdatum van het recht op uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel8
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel323
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '8'
  - number: 3:23.2
    text: De uitkering, bedoeld in het eerste lid, bedraagt per dag 100% van de grondslag.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel323
  - number: 3:24
    text: |-
      De uitkering ter zake van vervanging bedraagt de grondslag, bedoeld in [artikel 3:23][ref1],
      eerste lid, vermeerderd met het bedrag aan premies en aan vergoeding als bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref2], dat het Uitvoeringsinstituut werknemersverzekeringen bij uitbetaling
      als uitkering in verband met zwangerschap en bevalling daarover verschuldigd zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel324
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
  - number: 3:25.1
    text: |-
      Een uitkering als bedoeld in deze paragraaf wordt zo spoedig mogelijk maar uiterlijk binnen een maand nadat het
      Uitvoeringsinstituut werknemersverzekeringen het recht op uitkering heeft vastgesteld, uitbetaald. De betaling
      geschiedt als regel in tijdvakken van een maand.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel325
  - number: 3:25.2
    text: De uitkering wordt betaald over iedere dag, doch niet over de zaterdagen en de zondagen.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel325
  - number: 3:25.3
    text: |-
      De uitkering ter zake van vervanging wordt uitbetaald aan de instelling bedoeld in artikel 3:21, tweede lid,
      onderdeel b.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel325
  - number: 3:25.4
    text: |-
      De [artikelen 55, tweede tot en met vijfde lid][ref1], [55a][ref2], [57][ref3], [62][ref4] en
      [66 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel55a
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel62
      [ref5]: https://wetten.overheid.nl/BWBR0008656#Artikel66
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel325
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 55a
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '57'
      - id: ref4
        bwb_id: BWBR0008656
        artikel: '62'
      - id: ref5
        bwb_id: BWBR0008656
        artikel: '66'
  - number: 3:26
    text: |-
      De op grond van deze paragraaf te betalen uitkeringen en de uitvoeringskosten met betrekking tot die uitkeringen
      komen ten laste van het Arbeidsongeschiktheidsfonds.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel326
  - number: 3:27.1
    text: |-
      Met betrekking tot een uitkering op grond van deze paragraaf zijn de volgende artikelen van de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] en de op die artikelen berustende bepalingen van
      overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 3:27.1.a
    text: |-
      ter zake van het recht op uitkering: de [artikelen 7a][ref1], [7b][ref2], [19, vierde en vijfde lid][ref3],
      [19a][ref4], [21a][ref5] en[ 21b][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0008656#Artikel19a
      [ref5]: https://wetten.overheid.nl/BWBR0008656#Artikel21a
      [ref6]: https://wetten.overheid.nl/BWBR0008656#Artikel21b
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0008656
        artikel: 7b
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0008656
        artikel: 19a
      - id: ref5
        bwb_id: BWBR0008656
        artikel: 21a
      - id: ref6
        bwb_id: BWBR0008656
        artikel: 21b
  - number: 3:27.1.b
    text: |-
      ter zake van herziening of intrekking: [artikel 18][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel18
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '18'
  - number: 3:27.1.c
    text: |-
      ter zake van de vakantie-uitkering: de [artikelen 25 tot en met 27][ref1], [40][ref2] en [60][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel60
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '40'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '60'
  - number: 3:27.1.d
    text: |-
      ter zake van oproeping en ondervraging: de [artikelen 41, eerste lid][ref1], en [42][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel42
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '42'
  - number: 3:27.1.e
    text: |-
      ter zake van maatregelen: de [artikelen 45][ref1], [46, onderdeel d][ref2], en [47][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel47
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '46'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '47'
  - number: 3:27.1.f
    text: |-
      ter zake van de inlichtingenverplichting: [artikel 70][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '70'
  - number: 3:27.1.g
    text: |-
      ter zake van de uitvoering: [artikel 81][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel81
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '81'
  - number: 3:27.1.h
    text: |-
      ter zake van de termijn waarbinnen op het bezwaarschrift moet zijn beslist: [artikel 96, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel96
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '96'
  - number: 3:27.1.i
    text: |-
      ter zake van het beroep in cassatie: [artikel 98][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel98
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '98'
  - number: 3:27.1.j
    text: |-
      ter zake van strafbepalingen: [artikel 100][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel100
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '100'
  - number: 3:27.1.k
    text: |-
      ter zake van terugvordering: [artikel 63][ref1], met dien verstande dat bij algemene maatregel van bestuur
      kan worden bepaald dat, in afwijking van het eerste lid van dat artikel, onder bij dat besluit te bepalen
      omstandigheden, een uitkering ter zake van vervanging niet wordt teruggevorderd;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel63
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '63'
  - number: 3:27.1.l
    text: |-
      ter zake van vervreemding, verpanding en volmacht tot ontvangst: [artikel 66][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel66
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '66'
  - number: 3:27.1.m
    text: |-
      ter zake van boeten: de [artikelen 48 tot en met 54][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel48
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '48'
  - number: 3:27.2
    text: |-
      De strafbepaling van [artikel 84, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel84
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '84'
  - number: 3:27.3
    text: |-
      [Artikel 56 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] is van overeenkomstige toepassing op
      een uitkering op grond van deze paragraaf met uitzondering van de uitkering ter zake van vervanging.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel56
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '56'
  - number: 3:27.4
    text: |-
      Ter zake van overlijden zijn de [artikelen 1, tweede tot en met zevende lid][ref1], [61][ref2] en
      [67, onderdeel b, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3] van overeenkomstige toepassing
      met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel67
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '61'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '67'
  - number: 3:27.4.a
    text: |-
      het [derde lid van artikel 61][ref1] wordt toegepast ongeacht of het recht op uitkering met ingang van de dag na
      het overlijden binnen een maand zou zijn geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel61
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '61'
  - number: 3:27.4.b
    text: |-
      indien een uitkering is toegekend in de vorm van een uitkering ter zake van vervanging, de overlijdensuitkering
      wordt betaald overeenkomstig het [eerste lid van artikel 61][ref1], als was de uitkering toegekend als uitkering
      in verband met zwangerschap en bevalling of adoptie. Het [zevende lid van artikel 61][ref2] blijft daarbij buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel61
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '61'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '61'
  - number: 3:27.5
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen handelt overeenkomstig
      [artikel 45 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] indien de beroepsbeoefenaar op
      arbeidsovereenkomst zich niet houdt aan het voorschrift, bedoeld in [artikel 3:22, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 3:27.6
    text: |-
      Op de instelling, bedoeld in [artikel 3:21, tweede lid, onderdeel b][ref1], is
      [artikel 70, eerste lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel70
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '70'
  - number: 3:28
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan controlevoorschriften vaststellen. Deze voorschriften mogen
      niet verder gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel328
  - number: 3:29.1
    text: |-
      Indien een persoon over dezelfde periode op grond van dezelfde paragraaf zowel recht heeft op een uitkering in
      verband met zwangerschap en bevalling als op een uitkering in verband met adoptie of pleegzorg, wordt haar de
      uitkering in verband met adoptie of pleegzorg of ter zake van vervanging in verband met adoptie of pleegzorg niet
      uitbetaald. Indien een persoon over dezelfde periode op grond van dezelfde paragraaf zowel recht heeft op een
      uitkering in verband met adoptie als op een uitkering in verband met pleegzorg wordt hem de uitkering in verband
      met pleegzorg of ter zake van vervanging in verband met pleegzorg niet uitbetaald.
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel329
  - number: 3:29.2
    text: |-
      Indien een persoon over dezelfde periode zowel recht heeft op een uitkering op grond van [paragraaf 1][ref1]
      als op een uitkering op grond van [paragraaf 2][ref2] van deze afdeling, wordt hem de uitkering op grond van
      [paragraaf 2][ref3] uitbetaald voorzover deze de uitkering op grond van [paragraaf 1][ref4] van deze afdeling
      overtreft. Indien de uitkering op grond van [paragraaf 1][ref5] geheel of gedeeltelijk wordt geweigerd op grond
      van enig handelen of nalaten dat de betrokkene kan worden verweten, wordt voor de toepassing van dit lid die
      uitkering in aanmerking genomen alsof die weigering niet heeft plaatsgevonden. De eerste zin is niet van toepassing
      op de werknemer en de gelijkgestelde, bedoeld in [artikel 3:6, tweede lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013008
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
