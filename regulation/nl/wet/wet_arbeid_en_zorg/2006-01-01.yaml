  - number: 3:6.1.b.2°
    text: |-
      op grond van [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref1] recht heeft op de loongerelateerde
      uitkering van de werkhervattingsuitkering gedeeltelijk arbeidsgeschikten;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0013008/2006-01-01#Artikel36
    references:
