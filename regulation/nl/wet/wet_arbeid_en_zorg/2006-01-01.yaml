      [artikel 3:6, tweede lid][ref1], de [artikelen 43][ref2] en [56 van de Ziektewet][ref3] niet van overeenkomstige
      toepassing en zijn van [artikel 55 van de Ziektewet][ref4] alleen de eerste volzin van het eerste lid en het
      zevende lid van overeenkomstige toepassing. Op de werknemer en de gelijkgestelde, bedoeld in de eerste volzin, is
      [artikel 67 van de Ziektewet][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel56
