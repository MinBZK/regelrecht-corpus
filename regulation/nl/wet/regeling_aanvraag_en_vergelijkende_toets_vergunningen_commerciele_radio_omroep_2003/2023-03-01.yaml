preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Economische Zaken;

    Gelet op de artikelen 3.3, vijfde lid, van de Telecommunicatiewet en 4, eerste lid, 6, eerste lid, en 8, eerste
    lid, van het Frequentiebesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014741/2023-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *minister:*


              Minister van Onderwijs, Cultuur en Wetenschappen;



            b

              *commerciële radio-omroep:*


              radio-omroep als bedoeld in [artikel 1, onder e, van de Mediawet][ref1] door een commerciële
      omroepinstelling als bedoeld in [artikel 1, onder dd, van die wet][ref2];



            c

              *landelijke commerciële radio-omroep:*


              commerciële radio-omroep via FM-frequenties die betrekking heeft op het verzorgen en uitzenden van
      radioprogramma's, bestemd voor een landelijk publiek;



            d

              *ongeclausuleerde landelijke commerciële radio-omroep:*


              landelijke commerciële radio-omroep, waarvoor op grond van de
      [Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref3] zoals deze luidde vóór de
      inwerkingtreding van de Regeling van de Regeling van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap van
      24 februari 2023, nr. WJZ 34858995 (14696), handelende in overeenstemming met de Minister van Economische Zaken
      en Klimaat, tot wijziging van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003 in
      verband met modernisering van de clausuleringen geen gebruiksvoorschriften gelden;



            e

              *geclausuleerde landelijke commerciële radio-omroep:*


              landelijke commerciële radio-omroep waarvoor op grond van de
      __REF003___________________________________________________________________________________________________________
      ___ zoals deze luidde vóór de inwerkingtreding van de Regeling van de Regeling van de Staatssecretaris van
      Onderwijs, Cultuur en Wetenschap van 24 februari 2023, nr. WJZ 34858995 (14696), handelende in overeenstemming met
      de Minister van Economische Zaken en Klimaat, tot wijziging van de Regeling aanwijzing en gebruik frequentieruimte
      commerciële radio-omroep 2003 in verband met modernisering van de clausuleringen gebruiksvoorschriften gelden;



            f

              *nieuws:*


              programmacategorie van geclausuleerde landelijke commerciële radio-omroep als bedoeld in
      [artikel 2 van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref5] zoals deze
      luidde vóór de inwerkingtreding van de Regeling van de Regeling van de Staatssecretaris van Onderwijs, Cultuur
      en Wetenschap van 24 februari 2023, nr. WJZ 34858995 (14696), handelende in overeenstemming met de Minister van
      Economische Zaken en Klimaat, tot wijziging van de Regeling aanwijzing en gebruik frequentieruimte commerciële
      radio-omroep 2003 in verband met modernisering van de clausuleringen;



            g

              *Nederlandstalige muziek:*


              programmacategorie van geclausuleerde landelijke commerciële radio-omroep als bedoeld in
      [artikel 3 van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref6] zoals deze
      luidde vóór de inwerkingtreding van de Regeling van de Regeling van de Staatssecretaris van Onderwijs, Cultuur
      en Wetenschap van 24 februari 2023, nr. WJZ 34858995 (14696), handelende in overeenstemming met de Minister van
      Economische Zaken en Klimaat, tot wijziging van de Regeling aanwijzing en gebruik frequentieruimte commerciële
      radio-omroep 2003 in verband met modernisering van de clausuleringen;



            h

              *klassieke muziek of jazz-muziek:*


              programmacategorie van geclausuleerde landelijke commerciële radio-omroep als bedoeld in
      [artikel 4 van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref7] zoals deze
      luidde vóór de inwerkingtreding van de Regeling van de Regeling van de Staatssecretaris van Onderwijs, Cultuur
      en Wetenschap van 24 februari 2023, nr. WJZ 34858995 (14696), handelende in overeenstemming met de Minister van
      Economische Zaken en Klimaat, tot wijziging van de Regeling aanwijzing en gebruik frequentieruimte commerciële
      radio-omroep 2003 in verband met modernisering van de clausuleringen;



            i

              *niet-recente bijzondere muziek:*


              programmacategorie van geclausuleerde landelijke commerciële radio-omroep als bedoeld in
      [artikel 5 van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref8] zoals deze
      luidde vóór de inwerkingtreding van de Regeling van de Regeling van de Staatssecretaris van Onderwijs, Cultuur
      en Wetenschap van 24 februari 2023, nr. WJZ 34858995 (14696), handelende in overeenstemming met de Minister van
      Economische Zaken en Klimaat, tot wijziging van de Regeling aanwijzing en gebruik frequentieruimte commerciële
      radio-omroep 2003 in verband met modernisering van de clausuleringen;



            j

              *recente bijzondere muziek:*


              programmacategorie van geclausuleerde landelijke commerciële radio-omroep als bedoeld in
      [artikel 6 van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref9] zoals deze
      luidde vóór de inwerkingtreding van de Regeling van de Regeling van de Staatssecretaris van Onderwijs, Cultuur
      en Wetenschap van 24 februari 2023, nr. WJZ 34858995 (14696), handelende in overeenstemming met de Minister van
      Economische Zaken en Klimaat, tot wijziging van de Regeling aanwijzing en gebruik frequentieruimte commerciële
      radio-omroep 2003 in verband met modernisering van de clausuleringen;



            k

              *niet-landelijke commerciële radio-omroep:*


              commerciële radio-omroep via FM- frequenties die betrekking heeft
      op het verzorgen en uitzenden van radio-programma's waarvoor op grond van
      [artikel 7 van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref10]
      gebruiksvoorschriften gelden;



            l

              *commerciële radio-omroep middengolf:*


              commerciële radio-omroep via middengolffrequenties die betrekking heeft op het verzorgen en uitzenden van
      radio-programma's;



            m

              *aanvraag:*


              aanvraag voor een of meer vergunningen voor het gebruik van frequentieruimte ten behoeve van commerciële
      radio-omroep;



            n

              *aanvrager:*


              degene die een aanvraag doet;



            o

              *aanvraagdocument:*


              document als bedoeld in [artikel 5, eerste lid, van het Frequentiebesluit][ref11] ten behoeve van de
      verdeling van frequentieruimte voor commerciële radio-omroep;



            p

              *kavel:*


              frequentie of samenstel van frequenties, ter beschikking voor de uitvoering van een vergunning, waarvan de
      aanspraken op het gebruiksrecht worden toegekend door middel van de procedure van vergelijkende toets;



            q

              *demografisch bereik:*


              het percentage van het aantal inwoners van Nederland dat bij benadering de uitzendingen via een
      etherfrequentie of een samenstel van etherfrequenties in het dekkingsgebied, berekend via de technische Zero Base-
      planningsnorm, kan ontvangen;



            r

              *notaris:*


              de notaris, genoemd in [artikel 6, tweede lid][ref12];



            s

              *financieel bod:*


              het bedrag dat de aanvrager als onderdeel van zijn aanvraag onvoorwaardelijk en onherroepelijk op een kavel
      uitbrengt.


