preamble:
  text: |-
    Gelet op artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011;

    Besluit vast te stellen het navolgende Organisatiebesluit:
  url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel1
  - number: 1.a
    text: '*ministerie:* Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel1
  - number: 1.b
    text: '*Minister:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel1
  - number: 1.c
    text: '*bewindspersonen:* de Minister of de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel1
  - number: 1.d
    text: |-
      *capaciteitsplan:* schriftelijk stuk waarin de uitwerking van de flexibele organisatiestructuur van een
      dienstonderdeel wordt vastgelegd evenals de verdeling van de formatie binnen deze structuur;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel1
  - number: 1.e
    text: |-
      *SG-Cluster:* de directies Concernondersteuning, Financieel-economische Zaken, Constitutionele Zaken en Wetgeving,
      BZK Flex en CIO & Informatiemanagement;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel1
  - number: 1.f
    text: |-
      *BZK Kerndepartement:* de directoraten-generaal Bestuur, Ruimte en Wonen, Koninkrijksrelaties en
      Overheidsorganisatie, het programma directoraat-generaal Omgevingswet en het SG-Cluster.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel1
  - number: '2.1'
    text: 'De hoofdstructuur van het ministerie bestaat uit de volgende dienstonderdelen:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
  - number: 2.1.a
    text: de Algemene Leiding (ALGL);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
  - number: 2.1.b
    text: het directoraat-generaal Bestuur, Ruimte en Wonen (DGBRW);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
  - number: 2.1.c
    text: het directoraat-generaal Koninkrijksrelaties (DGKR);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
  - number: 2.1.d
    text: het directoraat-generaal Overheidsorganisatie (DGOO);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
  - number: 2.1.e
    text: het programma directoraat-generaal Omgevingswet (PDGOW);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
  - number: 2.1.f
    text: het Bureau Algemene Bestuursdienst (BABD);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
  - number: 2.1.g
    text: de Algemene Inlichtingen- en Veiligheidsdienst (AIVD);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
  - number: 2.1.h
    text: het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk (DGVBR);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
  - number: 2.1.i
    text: het SG-Cluster (SGC);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
  - number: 2.1.j
    text: het agentschap Dienst van de Huurcommissie (DHC);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
  - number: 2.1.k
    text: het agentschap Logius;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
  - number: 2.1.l
    text: het agentschap Rijksdienst voor Identiteitsgegevens (RvIG).
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
  - number: '2.2'
    text: |-
      De dienstonderdelen bestaan uit organisatieonderdelen waarvan de inrichting nader kan worden beschreven op een
      wijze als bedoeld in [artikel 22, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041314#Artikel22
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0041314
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '2.3'
    text: |-
      De secretaris-generaal geeft rechtstreeks leiding aan de leidinggevende functionarissen van de dienstonderdelen,
      genoemd in het eerste lid, met uitzondering van het agentschap Dienst Huurcommissie dat ressorteert onder het
      bestuur van de Huurcommissie.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel2
  - number: '3.1'
    text: Er is een Bestuursraad Binnenlandse Zaken en Koninkrijksrelaties (BR).
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      De Bestuursraad is samengesteld uit de secretaris-generaal, de directeuren-generaal Bestuur, Ruimte en Wonen,
      Koninkrijksrelaties, Overheidsorganisatie, Bureau Algemene Bestuursdienst, Vastgoed en Bedrijfsvoering Rijk,
      Algemene Inlichtingen- en Veiligheidsdienst, de programma directeur-generaal Omgevingswet, de Chief Information
      Officer BZK en de directeur Concernondersteuning. De leden kunnen zich incidenteel laten vervangen door hun
      plaatsvervangers of, in uitzonderlijke gevallen, door een andere rechtstreeks onder hen ressorterende functionaris.
      De directeur Financieel-economische Zaken en de directeur Constitutionele Zaken en Wetgeving hebben een permanente
      uitnodiging tot het als adviseur bijwonen van de Bestuursraad.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel3
  - number: '3.3'
    text: |-
      Het overleg in de Bestuursraad heeft, onverminderd het bepaalde in de departementale mandaat- en volmachtbesluiten
      over de bevoegdheden van de afzonderlijke leden van de Bestuursraad ten aanzien van de onderwerpen die in het
      overleg aan de orde komen, ten doel het bespreken en het bereiken van overeenstemming over de departementale
      beleids- en beheerskaders en het toezien op de uitvoering van deze kaders.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel3
  - number: '3.4'
    text: |-
      De Bestuursraad heeft tevens tot doel het bespreken en het bereiken van overeenstemming over aspecten van het
      departementale personeelsbeleid en personele aangelegenheden alsmede het toezien op de uitvoering hiervan. In het
      overleg komen in ieder geval de volgende aangelegenheden aan de orde:
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel3
  - number: 3.4.a
    text: de ontwikkeling van het departementale HRM-beleid in brede zin;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel3
  - number: 3.4.b
    text: de beleidsontwikkeling van management-development bij het ministerie;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel3
  - number: 3.4.c
    text: de voordracht tot benoeming van kandidaten bij het ministerie die behoren tot de ABD-doelgroep topmanager;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel3
  - number: 3.4.d
    text: |-
      de werkzaamheden van de Bestuursraad met betrekking tot de personeelsschouw, zoals aangegeven in het departementale
      beleid ter zake.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel3
  - number: '3.5'
    text: |-
      Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of indien bij
      wettelijk voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel3
  - number: '3.6'
    text: De adviseur Politiek-bestuurlijke advisering voert het secretariaat van de Bestuursraad.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel3
  - number: '3.7'
    text: De directeur Concernondersteuning voert het secretariaat van de bespreking van het departementale personeelsbeleid.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel3
  - number: '4.1'
    text: De Algemene Leiding bestaat uit de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
  - number: '4.2'
    text: |-
      De secretaris-generaal is belast met de ambtelijke leiding van het ministerie. Tot deze taak behoort in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
  - number: 4.2.a
    text: |-
      het informeren en adviseren van de bewindspersonen over aangelegenheden, de bewindspersonen of het ministerie
      betreffende;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
  - number: 4.2.b
    text: |-
      het zorgdragen voor de coördinatie en integratie van beleidsvoorbereiding, beleidsontwikkeling en beleidsuitvoering
      binnen het ministerie;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
  - number: 4.2.c
    text: het uitoefenen van de algemene controlfunctie bij het ministerie;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
  - number: 4.2.d
    text: |-
      het rechtstreeks leiding geven aan de (programma) directeuren-generaal, de directeuren en Chief Information Officer
      BZK van het SG-Cluster, de algemeen directeur Logius en de directeur RvIG;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
  - number: 4.2.e
    text: het voorzitterschap van de Bestuursraad;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
  - number: 4.2.f
    text: |-
      het zorgdragen voor het nemen van besluiten over en het geven van algemene aanwijzingen ten aanzien van het
      algemene beleid en beheer inzake de bedrijfsvoering en de formatie van het ministerie;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
  - number: 4.2.g
    text: |-
      het voeren van overleg met de Departementale ondernemingsraad en de Ondernemingsraad BZK Kerndepartement, als
      bestuurder in de zin van de [Wet op de Ondernemingsraden][ref1], en de centrales van verenigingen van ambtenaren,
      bedoeld in [artikel 113 van het Algemeen Rijksambtenarenreglement][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel113
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002747
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '113'
  - number: 4.2.h
    text: |-
      het optreden als gemachtigd ambtenaar in de zin van de
      [Uitvoeringsregeling openbaarheid van bestuur Binnenlandse Zaken][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008536
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008536
  - number: 4.2.i
    text: het plegen van inhoudelijke afstemming met het secretariaat van de Raad voor het openbaar bestuur (sRob);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
  - number: 4.2.j
    text: het toezicht op het beheer van de zelfstandige bestuursorganen met een relatie met het ministerie;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
  - number: 4.2.k
    text: het eigenaarschap van alle tot het ministerie behorende agentschappen;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
  - number: 4.2.l
    text: |-
      het geven van uitvoering aan de [Regeling audit committees van het Rijk][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0040281
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0040281
  - number: 4.2.m
    text: het verlenen of weigeren van goedkeuring van besluiten tot uitzonderingen op de aanbestedingsregelgeving.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel4
  - number: '5.1'
    text: Het directoraat-generaal Bestuur, Ruimte en Wonen staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het directoraat-generaal Bestuur, Ruimte en Wonen draagt zorg voor sterk, vernieuwend en adaptief openbaar bestuur,
      een functionerend en zich ontwikkelend democratisch stelsel, een evenwichtige woningmarkt, een goed bouwklimaat
      en de verdere ontwikkeling van Nederland als een veilige, leefbare, bereikbare en concurrerende delta door het
      uitvoeren van de volgende taken:
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.a
    text: |-
      het bevorderen van een doelmatig, doeltreffend en democratisch openbaar bestuur, waaronder begrepen de relaties, de
      Europese Unie en andere internationale instellingen;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.b
    text: |-
      het zorgdragen voor een goede en adequate organisatie met betrekking tot het Nederlandse openbaar bestuur, onder
      andere met betrekking tot de financiën van gemeenten en provincies (het Gemeentefonds en het Provinciefonds);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.c
    text: |-
      het in overleg met de overige ministeries zorgdragen voor goede interbestuurlijke relaties, beredeneerd vanuit de
      eigenstandige positie van provincies en gemeenten en het bijdragen aan de oplossing van spanningen, dilemma’s en
      actuele vraagstukken op het snijvlak van politiek, bestuur en samenleving;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.d
    text: |-
      een functionerende woningmarkt met aandacht voor keuzevrijheid en betaalbaarheid, ook voor lagere inkomensgroepen,
      bijzondere (urgente) aandachtsgroepen en gebieden;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.e
    text: |-
      het bevorderen dat woningcorporaties het publiek belang behartigen en het waarborgen van een goed werkend
      corporatiestelsel;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.f
    text: |-
      het bevorderen van het tot stand komen van voldoende woningen en de bouwtechnische onderscheidenlijk
      gebruikskwaliteit daarvan en het ontwikkelen van beleid op het gebied van energiebesparing in de gebouwde omgeving;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.g
    text: het ter beschikking stellen van mensen en middelen aan de Hoge Raad van Adel;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.h
    text: 'het ontwikkelen en implementeren van beleid met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.h.1°
    text: de coördinatie en uitvoering van het nationaal ruimtelijk beleid;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.h.2°
    text: |-
      het doen van onderzoek naar de effecten van maatschappelijk ontwikkelingen op nationale ruimtelijke belangen, het
      afstemmen van het ruimtelijke beleid op ontwikkelingen in het buitenland alsmede het leveren van een bijdrage op
      Europese dossiers met een ruimtelijke component;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.h.3°
    text: het ruimtelijke instrumentarium, waaronder de wettelijke en bijbehorende digitale instrumenten en dienstverlening;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.h.4°
    text: |-
      de geo-informatie-infrastructuur en de basisregistraties, inclusief de bijbehorende digitale instrumenten en
      dienstverlening;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.h.5°
    text: ruimtelijk ontwerp en geo-analyse in ruimtelijke plannen, programma’s en projecten;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.h.6°
    text: gebieden van nationaal belang;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.h.7°
    text: ruimteprojecten van nationaal belang alsmede instrumenten ter ondersteuning van gebiedsgerichte projecten;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.h.8°
    text: de rijksagenda voor gebieden en fysieke projecten en het integreren van sectorale belangen in gebieden; en
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.2.h.9°
    text: |-
      de ruimtelijke en economische ontwikkeling van de mainport Schiphol in relatie tot de ruimtelijke belangen van de
      regio en het belang van de bereikbaarheid.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: '5.3'
    text: 'Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.3.a
    text: het bureau directeur-generaal (bdgBRW);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.3.b
    text: de directie Bestuur en Financiën (DBF);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.3.c
    text: de directie Democratie en Burgerschap (DDB);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.3.d
    text: de directie Woningmarkt (DWM);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.3.e
    text: de directie Ruimtelijke Ordening (DRO);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.3.f
    text: de directie Bouwen en Energie (DBE);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5.3.g
    text: het secretariaat van de adviescommissie geschilbeslechting.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5
  - number: 5a.1
    text: Het directoraat-generaal Koninkrijksrelaties staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2
    text: 'Het directoraat-generaal heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.a
    text: |-
      het zorg dragen voor een toekomstbeeld, scenario’s en handvatten om het Koninkrijk nader vorm en inhoud te geven,
      door beleidsvorming, beleidsvaststelling en uitvoering;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.b
    text: |-
      het onderhouden van goede relaties met en het coördineren van de samenwerking met de openbare lichamen van
      Caribisch Nederland en met Curaçao, Aruba en Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.c
    text: |-
      het met andere partners binnen en buiten het departement zorg dragen voor het opstellen en verwezenlijken van het
      beleid van het ministerie voor de openbare lichamen van Caribisch Nederland;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.d
    text: |-
      het met andere partners binnen en buiten het departement zorg dragen voor de coördinatie van het algemene beleid
      van de Rijksoverheid op dit terrein, met de speerpunten die samen met de openbare lichamen van Caribisch Nederland
      en de departementen worden bepaald;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.e
    text: |-
      het beheersmatig aansturen van de kabinetten van de gouverneur en de Rijksvertegenwoordiger voor de openbare
      lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.f
    text: |-
      het ter beschikking stellen van mensen en middelen aan het College Financieel Toezicht Curaçao en Sint Maarten, het
      College Financieel Toezicht Bonaire, Sint Eustatius en Saba, en het College Aruba Financieel Toezicht;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.g
    text: het aansturen van de Rijksdienst Caribisch Nederland (RCN);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.h
    text: |-
      het ondersteunen van de Vertegenwoordiger bij het uitvoeren van zijn taken en opdracht zoals vastgelegd in het
      Koninklijk Besluit van 4 maart 2013 (Stcrt. 2013, nr. 8486);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.i
    text: 'het uitvoeren van de taken van de Vertegenwoordiging van Nederland bij Curaçao, Aruba en Sint Maarten te weten:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.i.1°
    text: |-
      het adviseren van en rapporteren aan de bewindspersonen en desgewenst aan de overige ministers over het beleid voor
      Curaçao, Aruba, en Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.i.2°
    text: het begeleiden van officiële bezoeken van Nederlandse ministers, staatssecretarissen en delegaties;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.i.3°
    text: het uitvoeren van Kieswettaken voor de Tweede Kamerverkiezingen en de Europese verkiezingen;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.i.4°
    text: het verwijzen van Nederlanders die niet weten bij welke lokale instanties ze moeten zijn;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.i.5°
    text: het bieden van hulp aan Nederlanders die in de problemen zijn geraakt;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.i.6°
    text: het verlenen van gedetineerdenzorg aan Nederlanders die in Aruba, Curaçao en Sint Maarten zijn aangehouden;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.i.7°
    text: het geven van informatie over Nederlandse rijbewijzen en paspoorten;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.2.j
    text: het bijdragen aan de wederopbouw van de Nederlandse Bovenwindse eilanden Sint Maarten, Saba en Sint Eustatius.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.3
    text: 'Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.3.a
    text: de directie Koninkrijksrelaties (DKR);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.3.b
    text: de projectdirectie Wederopbouw Bovenwindse Eilanden (PDWBE);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: 5a.3.c
    text: de Rijksdienst Caribisch Nederland (RCN).
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel5a
  - number: '6.1'
    text: Het directoraat-generaal Overheidsorganisatie staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: '6.2'
    text: 'Het directoraat-generaal draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.2.a
    text: |-
      de ontwikkeling van het werkgeverschap in de publieke sector (met een accent op de kabinetssectoren), modernisering
      van het werkgeverschap voor de sector Rijk, en de doorontwikkeling van de personele functie (HRM) van en in de
      Rijksdienst;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.2.b
    text: 'de interbestuurlijke en interdepartementale ontwikkeling van de i-Overheid voor burgers en bedrijven:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.2.b.1°
    text: |-
      de randvoorwaardelijke beleidsontwikkeling ten behoeve van de i-samenleving waaruit onder andere voortvloeit
      de ontwikkeling en realisatie van de digitale basisvoorzieningen voor burgers en bedrijven, met inbegrip van de
      bijbehorende regelgeving, toezicht en de bijbehorende bestuurlijke structuur voor de aansturing en financiering van
      de voorzieningen;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.2.b.2°
    text: |-
      het opdrachtgeverschap aan RvIG, Logius, DICTU, ICTU, KOOP en de Kamer van Koophandel en de
      samenwerkingsovereenkomsten met de Rijksdienst voor ondernemend Nederland voor zover deze voortkomen uit de
      verantwoordelijkheid voor de voorzieningen en beleidsverantwoordelijkheden;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.2.b.3°
    text: de digitale identificatie (eID);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.2.c
    text: |-
      het bevorderen van de optimale vormgeving van de informatisering en ICT in het Rijk en bij zelfstandige
      bestuursorganen door het stellen van kaders en het toezicht daarop;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.2.d
    text: |-
      het toetsen van grote projecten binnen de rijksoverheid en publiekrechtelijke zelfstandige bestuursorganen
      (tijdelijk Bureau ICT-toetsing);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.2.e
    text: |-
      de ontwikkeling van en sturing op rijksbreed bedrijfsvoeringsbeleid en de beoordeling of de beleidsambities worden
      gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.2.f
    text: de kaders voor inkoop, aanbesteden, faciliteiten en huisvesting bij het Rijk en het toezicht daarop;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.2.g
    text: |-
      de doorontwikkeling van een rijksdienst en van een efficiënte en effectieve bedrijfsvoering van de overheid,
      inclusief de monitoring en verantwoording van het rijksbrede bedrijfsvoeringsbeleid;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.2.h
    text: |-
      het zorgdragen voor de stelsels van de basisregistratie personen, de Persoonsinformatievoorziening in de Caribische
      delen van het Koninkrijk (PIVA), het burgerservicenummer en reisdocumenten met de bijbehorende registraties,
      alsmede de verwerking van persoonsgegevens met het oog op die stelsels;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.2.i
    text: |-
      de zorg voor het bewaken van het integrale karakter en de consistentie van de rijksbrede kaders voor beveiliging
      alsmede het toezicht op de werking van de integrale beveiliging van de Rijksdienst.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: '6.3'
    text: 'Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.3.a
    text: |-
      het bureau directeur-generaal van het directoraat-generaal Overheidsorganisatie, inclusief bureau
      RijksBeveiligingsAmbtenaar (bdgOO);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.3.b
    text: de directie Ambtenaar en Organisatie (DA&O);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.3.c
    text: de directie Informatiesamenleving en Overheid (DI&O);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.3.d
    text: de directie Inkoop- Facilitair- en Huisvestingsbeleid Rijk (DIFHR);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.3.e
    text: de directie CIO-Rijk;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.3.f
    text: de programmadirectie i;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: 6.3.g
    text: het tijdelijk Bureau ICT-toetsing (BIT).
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel6
  - number: '7.1'
    text: Het programma directoraat-generaal Omgevingswet staat onder leiding van een programma directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel7
  - number: '7.2'
    text: 'Het programma directoraat-generaal heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel7
  - number: 7.2.a
    text: stelselherziening van het omgevingsrecht;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel7
  - number: 7.2.b
    text: |-
      ondersteunen en faciliteren en stimuleren van overheden, maatschappelijke partners, bedrijven, initiatiefnemers en
      belanghebbenden om te kunnen werken met de wet;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel7
  - number: 7.2.c
    text: |-
      realisatie van het digitaal stelsel [Omgevingswet][ref1], invoeringsproducten en de monitor op de Omgevingswet;


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 7.2.d
    text: |-
      ontwikkeling van een nationale omgevingsvisie, een instrument uit de nieuwe [Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: '7.3'
    text: 'Het programma directoraat-generaal bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel7
  - number: 7.3.a
    text: de programmadirectie Eenvoudig Beter (PDEB);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel7
  - number: 7.3.b
    text: de programmadirectie ‘Aan de slag’ (PDADS);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel7
  - number: 7.3.c
    text: de programmadirectie Nationale Omgevingsvisie (PDNOVI).
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel7
  - number: '8.1'
    text: Het Bureau Algemene Bestuursdienst staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel8
  - number: '8.2'
    text: 'Het Bureau heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel8
  - number: 8.2.a
    text: |-
      het bijdragen aan de versterking van het management door beleid te ontwikkelen en uit te voeren op het gebied van
      management development;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel8
  - number: 8.2.b
    text: het ontwikkelen van instrumenten nodig voor de realisatie van het beleid;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel8
  - number: 8.2.c
    text: het ontwikkelen van producten en diensten ter bevordering van de ontwikkeling van managers;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel8
  - number: 8.2.d
    text: het adviseren en begeleiden van individuele managers op gebied van opleiding en in hun (loopbaan)ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel8
  - number: 8.2.e
    text: het bijdragen aan de beschikbaarheid van managers en aan talentontwikkeling;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel8
  - number: 8.2.f
    text: het waar nodig realiseren van strategisch advies en de bezetting met tijdelijke capaciteit;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel8
  - number: 8.2.g
    text: |-
      het zorgen voor loopbaanbegeleiding en fungeren als gedelegeerd werkgever voor het topmanagement van de
      Rijksdienst;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel8
  - number: 8.2.h
    text: het uitvoeren van HRM-dienstverlening voor de bewindspersonen.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel8
  - number: '8.3'
    text: 'Het Bureau bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel8
  - number: 8.3.a
    text: de directie Management Development Rijk (MDR);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel8
  - number: 8.3.b
    text: de directie Stelselontwikkeling en Bestuursondersteuning;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel8
  - number: 8.3.c
    text: ABD Topconsult.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel8
  - number: '9.1'
    text: |-
      De Algemene Inlichtingen- en Veiligheidsdienst staat onder leiding van een directeur-generaal en een
      plaatsvervangend directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel9
  - number: '9.2'
    text: |-
      De Algemene Inlichtingen- en Veiligheidsdienst heeft de taken, bedoeld in
      [artikel 8 van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
  - number: '9.3'
    text: 'De Algemene Inlichtingen- en Veiligheidsdienst bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel9
  - number: 9.3.a
    text: de Directie Inlichtingen;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel9
  - number: 9.3.b
    text: de Directie Operatiën;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel9
  - number: 9.3.c
    text: de Directie Veiligheidsonderzoeken & Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel9
  - number: 9.3.d
    text: de Centrale Staf.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel9
  - number: '9.4'
    text: De Centrale Staf staat onder leiding van de plaatsvervangend directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel9
  - number: '10.1'
    text: Het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: '10.2'
    text: 'Het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.2.a
    text: het verwerven, ontwikkelen en aan onderdelen van de rijksoverheid ter beschikking stellen van vastgoed;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.2.b
    text: het efficiënt beheren, onderhouden en gebruiken van een uitgebalanceerde rijksvastgoedportefeuille;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.2.c
    text: de transformatie en het afstoten van overtollig rijksvastgoed;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.2.d
    text: het genereren van inkomsten met rijksvastgoed, indien (wettelijk) mogelijk;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.2.e
    text: het op kwalitatief goede en efficiënte wijze uitvoeren van bedrijfsvoeringstaken voor de rijksoverheid;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.2.f
    text: |-
      het bevorderen, realiseren en (doen) in stand houden van onderlinge samenhang, integratie en synergie in de
      dienstverlening vanuit het directoraat-generaal;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.2.g
    text: het optreden als gemandateerd eigenaar voor de agentschappen, genoemd in het derde lid, onder b tot en met e.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: '10.3'
    text: 'Het directoraat-generaal Vastgoed en Bedrijfsvoering Rijk bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.3.a
    text: het agentschap het Rijksvastgoedbedrijf (RVB);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.3.b
    text: het agentschap SSC-ICT;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.3.c
    text: het agentschap P-Direkt;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.3.d
    text: het agentschap Uitvoeringsorganisatie Bedrijfsvoering Rijk (UBR);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.3.e
    text: het agentschap FMHaaglanden (FMH);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.3.f
    text: de directie Doc-Direkt.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: '10.4'
    text: 'Het Rijksvastgoedbedrijf bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.4.a
    text: de directie Portefeuillestrategie & Portefeuillemanagement (P&P);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.4.b
    text: de directie Transacties & Projecten (T&P);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.4.c
    text: de directie Vastgoedbeheer (VB);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.4.d
    text: de directie Financiën en Bestuursadvisering (F&B) (Fin);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.4.e
    text: het bureau directeur-generaal (bdg);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: 10.4.f
    text: het Atelier Rijksbouwmeester (ARbm).
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: '10.5'
    text: |-
      Het Rijksvastgoedbedrijf staat onder leiding van een directeur-generaal die tevens directeur-generaal is van het
      directoraat-generaal Vastgoed en Bedrijfsvoering Rijk.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: '10.6'
    text: |-
      Voor aangelegenheden die behoren tot het werkterrein van het Rijksvastgoed treedt de directeur-generaal op en doet
      stukken af en ondertekent deze als directeur-generaal Rijksvastgoedbedrijf en voor de overige aangelegenheden als
      directeur-generaal Vastgoed en Bedrijfsvoering Rijk.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel10
  - number: '11.1'
    text: |-
      Het SG-Cluster staat onder inhoudelijke leiding van de Secretaris-generaal en onder beheersmatige leiding van de
      directeur Concernondersteuning.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel11
  - number: '11.2'
    text: 'Het SG-Cluster bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel11
  - number: 11.2.a
    text: de directie Concernondersteuning (DCO);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel11
  - number: 11.2.b
    text: de directie Financieel-Economische Zaken (FEZ);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel11
  - number: 11.2.c
    text: de directie Constitutionele Zaken en Wetgeving (CZW);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel11
  - number: 11.2.d
    text: CIO & Informatiemanagement BZK (CIO BZK);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel11
  - number: 11.2.e
    text: de directie BZK Flex (BZK Flex);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel11
  - number: 11.2.f
    text: het secretariaat van de Raad voor het openbaar bestuur (sRob).
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel11
  - number: '12.1'
    text: De directie Concernondersteuning staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel12
  - number: '12.2'
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel12
  - number: 12.2.a
    text: de concernsturing en de strategische advisering van de Bestuursraad;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel12
  - number: 12.2.b
    text: de dienstverlening en vakinhoudelijke advisering ten behoeve van het beleid van de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel12
  - number: 12.2.c
    text: de ondersteuning en het beheer van de bedrijfsprocessen;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel12
  - number: 12.2.d
    text: de regie op inzet van kennis, internationale zaken, Europa en Macro-Economie.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel12
  - number: '12.3'
    text: 'De directie bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel12
  - number: 12.3.a
    text: Staf en ondersteuning;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel12
  - number: 12.3.b
    text: Politiek-bestuurlijke advisering (PBA);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel12
  - number: 12.3.c
    text: Communicatie (C);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel12
  - number: 12.3.d
    text: Personeel en Organisatie (PO);
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel12
  - number: 12.3.e
    text: Kennis, Internationaal, Europa, Macro-Economie (KIEM).
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel12
  - number: '14.1'
    text: De directie Financieel-economische Zaken staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel14
  - number: '14.2'
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel14
  - number: 14.2.a
    text: |-
      de dienstverlening en vakinhoudelijke advisering ten behoeve van het beleid van de financieel-economische
      processen, het (doen) vertalen van centrale kaders en richtlijnen in specifieke voorschriften en procedures;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel14
  - number: 14.2.b
    text: |-
      het beoordelen van beleidsvoorstellen op samenhang tussen inhoudelijke doelstellingen en middeleninzet, inclusief
      de advisering aan de bewindspersonen, secretaris-generaal en de bestuursraad;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel14
  - number: 14.2.c
    text: |-
      het ministeriebreed toetsen van de producten in het kader van de begroting, beleid en beheer en het adviseren van
      de politieke en ambtelijke top hierover;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel14
  - number: 14.2.d
    text: |-
      het voeren van overleg namens het departement met het Ministerie van Financiën over alle begrotings- en
      verantwoordingsaangelegenheden;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel14
  - number: 14.2.e
    text: het zorgdragen voor een adequaat financieel-economisch beheer voor het ministerie;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel14
  - number: 14.2.f
    text: |-
      het borgen van de kwaliteit van de bedrijfsvoering en de daaraan verbonden (financieel administratieve) processen
      binnen het ministerie;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel14
  - number: 14.2.g
    text: |-
      het adviseren van de secretaris-generaal en de bewindspersonen ten aanzien van bijzondere vraagstukken op
      concernniveau.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel14
  - number: '14.3'
    text: |-
      De directeur Financieel-economische Zaken bekleedt de functie van coördinerend directeur Inkoop (CDI) en heeft
      vanuit die hoedanigheid de volgende taken:
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel14
  - number: 14.3.a
    text: het stellen van kaders voor het inkoopbeleid van het ministerie;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel14
  - number: 14.3.b
    text: de coördinatie van de inkoopfunctie en het contractbeheer van het ministerie;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel14
  - number: 14.3.c
    text: de centrale ondersteuning en advisering bij inkoopvraagstukken.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel14
  - number: '15.1'
    text: |-
      De directie Constitutionele Zaken en Wetgeving staat onder leiding van een directeur. De projectdirectie
      Omgevingsrecht maakt deel uit van de directie.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel15
  - number: '15.2'
    text: 'De directie heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel15
  - number: 15.2.a
    text: |-
      het beheer en onderhoud van de [Grondwet][ref1] en het [Statuut][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0002154
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001840
      - id: ref2
        bwb_id: BWBR0002154
  - number: 15.2.b
    text: |-
      de toetsing van (concept)regelgeving, beleid en maatregelen aan de [Grondwet][ref1], het [Statuut][ref2] en
      relevante internationale verdragen, inclusief het EU-recht;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0002154
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001840
      - id: ref2
        bwb_id: BWBR0002154
  - number: 15.2.c
    text: het opstellen van regelgeving waar de bewindspersonen eerstverantwoordelijk voor zijn;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel15
  - number: 15.2.d
    text: |-
      het bijdragen aan de totstandkoming van nationale en internationale wetgeving waarbij de bewindspersonen mede zijn
      betrokken;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel15
  - number: 15.2.e
    text: |-
      het adviseren over de noodzaak, wenselijkheid en mogelijkheid om door middel van wetgeving bij te dragen aan het
      bereiken van de beleidsdoelstellingen van de bewindspersonen;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel15
  - number: 15.2.f
    text: |-
      het adviseren over de noodzaak, wenselijkheid en mogelijkheid om de democratische constitutionele orde door middel
      van wetgeving aan te passen aan veranderende maatschappelijke behoeften;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel15
  - number: 15.2.g
    text: |-
      de bezwaar- en beroepsprocedures tegen de bewindspersonen of het ministerie en de advisering over juridische
      aangelegenheden in het algemeen;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel15
  - number: 15.2.h
    text: het ontwikkelen en implementeren van beleid met betrekking tot een eenvoudiger en beter omgevingsrecht.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel15
  - number: '16.1'
    text: De directie BZK Flex staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel16
  - number: '16.2'
    text: |-
      De directie heeft de volgende taak: het zorgen voor een wendbare organisatie, een organisatie die op inhoud en op
      capaciteit flexibel kan inspelen op actuele opgaven.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel16
  - number: '17.1'
    text: CIO & Informatiemanagement staat onder leiding van de Chief Information Officer (CIO).
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel17
  - number: '17.2'
    text: |-
      CIO & Informatiemanagement draagt zorg voor de advisering, kaderstelling, toezicht en handhaving op het terrein van
      de informatievoorziening en ICT binnen bedrijfsvoering en beleid in algemene zin, alsmede voor het bevorderen van
      informatiebewustzijn en het gebruik van ICT-middelen middels:
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel17
  - number: 17.2.a
    text: |-
      het opstellen en coördineren van de departementale strategie en visie op de informatievoorziening en ICT voor
      bedrijfsvoering en beleid;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel17
  - number: 17.2.b
    text: |-
      de advisering, kaderstelling, het toezicht en de handhaving met betrekking tot kwaliteit van informatie, waaronder
      informatieveiligheid;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel17
  - number: 17.2.c
    text: |-
      de advisering, kaderstelling, het toezicht en de handhaving met betrekking tot het vastleggen, hergebruiken en
      bewaren van informatie;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel17
  - number: 17.2.d
    text: |-
      de advisering, kaderstelling, het toezicht en de handhaving met betrekking tot ICT-werkomgeving binnen het
      ministerie;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel17
  - number: 17.2.e
    text: de advisering, kaderstelling, toezicht en handhaving met betrekking tot ICT-systemen en applicaties;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel17
  - number: 17.2.f
    text: |-
      het adviseren en geven van oordelen over risicobeheersing op het gebied van ICT en bij projecten of programma’s met
      een belangrijke ICT-component;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel17
  - number: 17.2.g
    text: de advisering over de voorzieningen in beheer;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel17
  - number: 17.2.h
    text: het opdrachtgeverschap SSC-ICT voor wat betreft de ICT-werkomgeving voor het ministerie;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel17
  - number: 17.2.i
    text: het opdrachtgeverschap Digidoc;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel17
  - number: 17.2.j
    text: het bevorderen van open data binnen het ministerie
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel17
  - number: '19.1'
    text: |-
      De Dienst van de Huurcommissie staat onder leiding van het bestuur van de Huurcommissie bedoeld in de
      [Uitvoeringswet huurprijzen woonruimte][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014315
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0014315
  - number: '19.2'
    text: |-
      De Dienst van de Huurcommissie heeft de taken bedoeld in de [artikelen 4][ref1], [4a][ref2] en
      [5 van de Uitvoeringswet huurprijzen woonruimte][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0014315#Artikel5
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: 4a
      - id: ref3
        bwb_id: BWBR0014315
        artikel: '5'
  - number: '20.1'
    text: Het agentschap staat onder leiding van een algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel20
  - number: '20.2'
    text: 'Het agentschap draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel20
  - number: 20.2.a
    text: |-
      het beheren en exploiteren van overheidsbrede samenhangende ICT voorzieningen, op het gebied van toegang,
      gegevensuitwisseling, informatiebeveiliging en standaardisatie; ten behoeve van digitale dienstverlening van de
      overheid en publieke instellingen aan burgers en bedrijven;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel20
  - number: 20.2.b
    text: het bevorderen van het gebruik van deze generieke voorzieningen;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel20
  - number: 20.2.c
    text: het beheren van stelsels van de generieke digitale infrastructuur;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel20
  - number: 20.2.d
    text: het voeren van het secretariaat voor het Forum voor Standaardisatie.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel20
  - number: '21.1'
    text: Het agentschap staat onder leiding van een algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel21
  - number: '21.2'
    text: 'Het agentschap:'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel21
  - number: 21.2.a
    text: |-
      draagt zorg voor het beheer van de basisregistratie personen, de persoonsinformatievoorziening in de Caribische
      delen van het Koninkrijk, het burgerservicenummer en de Nederlandse reisdocumenten;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel21
  - number: 21.2.b
    text: |-
      draagt zorg voor de wijze waarop de persoonsgegevens van burgers worden vastgelegd, beheerd en verstrekt voor de
      publieke dienstverlening;
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel21
  - number: 21.2.c
    text: draagt bij aan onderzoek en ontwikkeling, innovatie en regie in het identiteitsdomein.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel21
  - number: '22.1'
    text: |-
      De Minister stelt de inrichting van de organisatie vast conform het bepaalde in
      [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '3'
  - number: '22.2'
    text: |-
      De secretaris-generaal is bevoegd tot het nader vaststellen van de inrichting van de onder de directoraten-
      generaal, het Bureau Algemene Bestuursdienst, het SG-cluster, Logius en RvIG ressorterende organisatieonderdelen,
      na advisering door de directeur Concernondersteuning.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel22
  - number: '22.3'
    text: |-
      De secretaris-generaal is bevoegd tot het nader vaststellen van de inrichting van de Algemene Inlichtingen- en
      Veiligheidsdienst op voordracht van de directeur-generaal van de Algemene Inlichtingen- en Veiligheidsdienst en na
      advisering van de directeur Concernondersteuning.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel22
  - number: '22.4'
    text: |-
      De secretaris-generaal en de directeuren-generaal van het Bureau Algemene Bestuursdienst, van het directoraat-
      generaal Vastgoed en Bedrijfsvoering Rijk en van de Algemene Inlichtingen- en Veiligheidsdienst stellen met
      inachtneming van dit besluit ten behoeve van hun dienst- of organisatieonderdelen periodiek een capaciteitsplan
      vast.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel22
  - number: '23.1'
    text: |-
      Tot de taak van de directoraten-generaal, het Bureau Algemene Bestuursdienst, het SG-Cluster, RvIG en Logius
      behoort voorts de uitvoering van andere taken dan hiervoor genoemd, in opdracht van de bewindspersonen of de
      secretaris-generaal, voor zover hogere wet- en regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel23
  - number: '23.2'
    text: |-
      Tot de taak van de in dit besluit genoemde organisatieonderdelen, ressorterend onder de dienstonderdelen genoemd in
      het eerste lid, behoort voorts de uitvoering van andere taken dan vermeld, in opdracht van de bewindspersonen, de
      secretaris-generaal of het diensthoofd, voor zover hogere wet- en regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel23
  - number: '24.1'
    text: De directeur Concernondersteuning is belast met het beheer van dit besluit.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel24
  - number: '24.2'
    text: |-
      De secretaris-generaal, de directeuren-generaal, de directeuren van het SG-Cluster, de algemeen directeur Logius
      en de directeur RvIG, ieder voor zover het hen aangaat, zijn verantwoordelijk voor een juiste, volledige en tijdige
      aanlevering aan de directeur Concernondersteuning van de gegevens die een goed beheer van dit besluit mogelijk
      maken.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel24
  - number: '24.3'
    text: |-
      Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel24
  - number: '25'
    text: |-
      Wijziging van dit besluit is voorbehouden aan de Minister en geschiedt op voordracht van de directeur
      Concernondersteuning.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel25
  - number: '26'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 1 maart 2018.
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel26
  - number: '27'
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit BZK 2018.'
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel27
  - number: '28'
    text: |-
      Het [Organisatiebesluit BZK 2016][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0038547
    url: https://wetten.overheid.nl/BWBR0041314/2020-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0038547
