        artikel: '6'
  - number: '11'
    text: |-
      De minister kan besluiten:

      a. dat de voor het geven van het bijzonder gebruik en/of de bijzondere bestemming voorgeschreven termijn wordt
      verlengd met de tijd die op grond van de aangevoerde omstandigheden nodig wordt geacht;

      b. dat de controle kan worden geacht te zijn verricht indien de interventieprodukten onherroepelijk teloor zijn
      gegaan.
    url: https://wetten.overheid.nl/BWBR0003214/2005-01-01#Artikel11
  - number: '12'
    text: |-
      1 Dienst Regelingen onverminderd het gestelde in het tweede lid is belast met het houden van toezicht op de
      denaturatie van interventieprodukten, daarmee gelijkgestelde produkten als bedoeld in [artikel 4][ref1] en mager
      melkpoeder als bedoeld in [artikel 6, eerste lid][ref2], die plaatsvindt ten behoeve van de op het gebruik en/of de
      bijzondere bestemming van deze produkten in de zin van deze beschikking uit te oefenen controle.

      2 Het Produktschap Vis is belast met de denaturatie, dan wel met het toezicht op de denaturatie van uit de markt
      genomen produkten, waarop [Verordening (EEG) nr. 3796/81](31981R3796) (PbEG L 379) betrekking heeft, en waarvoor
      geen financiering uit de afdeling Garantie van het Europees Oriëntatie- en Garantiefonds voor de Landbouw wordt
      aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0003214#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003214#Artikel6
