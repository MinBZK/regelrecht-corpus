  - number: '5'
    text: |-
      1 Voor de toepassing van [artikel 3][ref1] worden met interventieproducten gelijkgesteld de producten, bedoeld
      in [artikel 4][ref2].

      2 De opgave, bedoeld in [artikel 3][ref3], wordt voor de in [artikel 4, onder a][ref4], bedoelde producten gedaan
      bij het Productschap Tuinbouw.

      3 De opgave, bedoeld in [artikel 3][ref5], wordt voor de in [artikel 4, onder b][ref6], bedoelde producten gedaan
      bij Dienst Regelingen voor producten waarvoor financiering uit de afdeling Garantie van het Europees Oriëntatie-
      en Garantiefonds voor de Landbouw wordt aangevraagd, en bij het Productschap Vis voor producten waarvoor geen
      financiering uit de afdeling Garantie van het Europees Oriëntatie- en Garantiefonds voor de Landbouw wordt
      aangevraagd.

      4 De opgave voor de in [artikel 4, onder c][ref7], bedoelde producten bevat tevens de beginvoorraad van deze
      producten.


