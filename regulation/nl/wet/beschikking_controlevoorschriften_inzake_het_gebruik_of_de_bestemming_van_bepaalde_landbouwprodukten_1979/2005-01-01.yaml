  - number: '9'
    text: |-
      1 Het is aan een ieder verboden produkten waarvan hij weet of redelijkerwijze kan vermoeden dat het
      interventieprodukten zijn, dan wel daarmee gelijkgestelde produkten als bedoeld in [artikel 4][ref1], te
      vervreemdem of af te leveren tenzij daardoor aan die produkten het bijzonder gebruik of de bijzondere bestemming
      als voorgeschreven wordt gegeven, dan wel de vervreemding of aflevering plaatsvindt aan een ondernemer, die van de
      handel in of de be- of verwerking van deze of soortgelijke produkten zijn beroep of bedrijf maakt en zich bij de
      transactie schriftelijk tegenover hem heeft verbonden zijnerzijds aan die produkten het voorgeschreven gebruik dan
      wel de voorgeschreven bestemming te geven en daarbij erkent kennis te dragen van de desbetreffende bepalingen van
      de onderhavige beschikking.

      2 Het is aan een ieder verboden de in het eerste lid bedoelde produkten bedrijfsmatig voorhanden of in voorraad
      te hebben dan wel te be- of verwerken anders dan ter nakoming van de met betrekking tot het gebruik en/of de
      bestemming van deze produkten ter zake van de verkoop uit interventie voortvloeiende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003214#Artikel4
    url: https://wetten.overheid.nl/BWBR0003214/2005-01-01#Artikel9
    references:
