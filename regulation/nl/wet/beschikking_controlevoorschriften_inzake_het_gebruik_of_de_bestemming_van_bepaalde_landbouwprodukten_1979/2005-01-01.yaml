  - number: '8'
    text: |-
      Al naar gelang van het geval, is degene, die tot het doen van de opgaven bedoeld in de [artikelen 3][ref1]
      en [5][ref2] is verplicht op daartoe strekkend verzoek verplicht aan Dienst Regelingen, aan het Productschap
      Tuinbouw, aan het Produktschap Vis, dan wel aan de Algemene Inspectiedienst nadere gegevens betreffende de opgave
      volledig en naar waarheid te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0003214#Artikel3
