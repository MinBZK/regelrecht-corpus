preamble:
  text: |-
    Gelet op de artikelen 19 en 23 van de Landbouwwet;

    Gehoord het Hoofdproduktschap voor Akkerbouwprodukten, het Produktschap voor Groenten en Fruit, het Produktschap
    voor Margarine, Vetten en Oliën, het Produktschap voor Vee en Vlees en het Produktschap voor Zuivel,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003214/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze beschikking wordt verstaan onder:




              *Verordening:*


              [Verordening (EEG) nr. 569/88](31988R0569) van de Commissie van 16 februari 1988 tot vaststelling van
      gemeenschappelijke bepalingen inzake de controle op het gebruik en/of de bestemming van produkten uit interventie
      (PbEG nr. L 55);




              *interventieprodukten:*


              produkten, die ingevolge de in artikel 1, eerste lid, van de Verordening genoemde communautaire regelingen
      in enige lid-staat zijn verkocht uit interventievoorraden onder voorwaarde van een bijzonder gebruik en/of
      een bijzondere bestemming als in de Verordening bedoeld, daaruit verkregen of met behulp daarvan vervaardigde
      produkten, zolang met betrekking tot de desbetreffende produkten die voorwaarde nog niet volledig is vervuld;



            Minister:

              Minister van Landbouw, Natuur en Voedselkwaliteit;



            Dienst Regelingen:

              Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;




              *het desbetreffende produktschap:*


              het produktschap dat is beslat met de toepassing van de marktorganisatie binnen welk kader de interventie
      van het betrokken produkt heeft plaatsgevonden;




              *fabrieksadministratie:*


              administratie van de met betrekking tot de be- of verwerking van interventieprodukten bedrijfsmatig
      verrichte werkzaamheden;




              *herkomst:*


              de EEG-lid-staat, door wiens interventiebureau de interventieprodukten uit de markt zijn genomen;




              *denatureren:*


              het wijzigen van de samenstelling van een produkt door het daaraan toevoegen van de naturatiemiddelen
      overeenkomstig en ter uitvoering van een communautaire regeling;




              *ondermelk:*


              melk en karnemelk met een vetgehalte van ten hoogste 1%;




              *mager melkpoeder:*


              melk en karnemelk in poedervorm met een vetgehalte van ten hoogste 11%.
    url: https://wetten.overheid.nl/BWBR0003214/2005-01-01#Artikel1
  - number: '2'
    text: |-
      1 Degene, die produkten, waarvan hij weet of redelijkerwijze kan vermoeden dat het interventieprodukten zijn,
      bedrijfsmatig voorhanden of in voorraad heeft, be- of verwerkt, dan wel ontvangt of aflevert is verplicht ter
      zake van de desbetreffende door hem verrichte gedragingen een dagelijks bij te houden boekhouding en voorraad- of
      fabrieksadministratie te voeren en deze boekhouding en voorraad- of fabrieksadministratie, alsmede de in het tweede
      lid bedoelde bescheiden, gedurende drie jaren te bewaren.

      2 De in het eerste lid bedoelde boekhouding en voorraad- of fabrieksadministratie dienen volledig te zijn,
      nauwkeurig en naar waarheid te worden bijgehouden en zodanig te zijn ingericht dat daaruit de volgende gegevens
      kunnen worden gekend, gestaafd door leveringsbewijzen, facturen en verwerkingsstaten:

      a. de dag van ontvangst en de ontvangen hoeveelheden interventieprodukten, onderscheiden naar hun aard en herkomst,
      alsmede de naam en het adres van de leverancier;

      b. de dag van be- of verwerking en de be- of verwerkte hoeveelheden interventieprodukten, alsmede de daarnaast
      in de voorraden interventieprodukten als gevolg van retourzendingen, verliezen of soortgelijke oorzaken en
      in voorkomende gevallen vervoedering, onderscheiden naar aard en hoeveelheid van deze produkten, opgetreden
      wijzigingen;

      c. de dag van aflevering en de afgeleverde hoeveelheden interventieprodukten en, indien het mager melkpoeder
      betreft, het mengvoeder waarvan het bestanddeel vormt, onderscheiden naar hun aard en herkomst alsmede de naam en
      het adres van de afnemer, geen kleinverbruiker zijnde;

      d. indien de be- of verwerking van de interventieprodukten bestaat uit of gepaard gaat met denatureren: bovendien
      de hierbij gebruikte denaturatiemiddelen, onderscheiden naar hun aard en hoeveelheden.

      3 De bovenstaande gegevens dienen voor elk stadium van be- of verwerking waarin de interventieprodukten zich in het
      bedrijf bevinden afzonderlijk te worden vermeld.

      4 Indien interventieprodukten van meer dan een leverancier zijn ontvangen, dient de boekhouding en voorraad- of
      fabrieksadministratie tevens zodanig te zijn ingericht, dat daaruit blijkt met welke van de ontvangen hoeveelheden
      de afgeleverde hoeveelheden interventieprodukten overeenkomen.

      5 Het bepaalde in de voorgaande leden laat onverlet de door het desbetreffende produktschap ter zake voorgeschreven
      nadere regelen.
    url: https://wetten.overheid.nl/BWBR0003214/2005-01-01#Artikel2
  - number: '3'
    text: |-
      1 Degene, die ingevolge [artikel 2][ref1] de aldaar bedoelde boekhouding en voorraad- of fabrieksadministratie
      dient bij te houden, is verplicht van de daarin opgenomen aflevering van interventieprodukten, anders dan aan
      kleinverbruikers, aan Dienst Regelingen opgave te doen van de dag van aflevering en de afgeleverde hoeveelheden,
      onderscheiden naar hun aard en herkomst, alsook van de naam en het adres van de afnemer.

      Indien degene, die de interventieprodukten aflevert, deze niet zelf uit interventie heeft aangekocht, dient bij de
      opgave tevens melding te worden gemaakt van de naam en het adres van de leverancier, wiens verplichtingen door de
      aflevering tegenover de Minister of het desbetreffende buitenlandse interventiebureau worden gekweten.

      2 De opgaven dienen te geschieden op door de Minister ter beschikking gestelde formulieren, waarvan de modellen
      door de Minister zijn opgesteld in overleg met het desbetreffende produktschap en met inachtneming van de
      communautaire bepalingen, voor de toepassing waarvan zij dienen.

      3 De opgaven dienen volledig, naar waarheid en met inachtneming van de op de formulieren gestelde onderscheidingen
      en aanwijzingen te worden gedaan en moeten gedateerd en ondertekend bij Dienst Regelingen worden ingediend binnen
      de door de Minister gestelde termijnen en met de door hem voorgeschreven periodiciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0003214#Artikel2
    url: https://wetten.overheid.nl/BWBR0003214/2005-01-01#Artikel3
