        artikel: '2'
  - number: '4'
    text: |-
      Voor de toepassing van [artikel 2][ref1] worden met interventieprodukten gelijkgesteld:

      a. de door telersverenigingen of groeperingen van telersverenigingen als bedoeld in artikel 13 onderscheidenlijk
      artikel 15 van [Verordening (EEG) nr. 1035/72](31972R1035) (Pb. E.G. nr. L 148) ingevolge de desbetreffende
      communautaire bepalingen uit de markt genomen produkten voor zover bij de verkoop aan deze produkten een bijzonder
      gebruik en/of een bijzondere bestemming dient te worden gegeven, zolang die voorwaarde nog niet volledig is
      vervuld;

      b. de door de producentengroeperingen als bedoeld in artikel 5 van [Verordening (EEG) nr. 3796/81](31981R3796)
      (PbEG L 379), ingevolge de desbetreffende communautaire bepalingen uit de markt genomen produkten, voor zover
      bij de verkoop aan die produkten een bijzonder gebruik en/of een bijzondere bestemming dient te worden gegeven en
      zolang die voorwaarden nog niet volledig is vervuld;

      c. de produkten, waarvoor een opslag- of verwerkingscontract is gesloten met de Minister of een buitenlands
      interventiebureau, indien daaraan om voor steun in aanmerking te komen ingevolge enige communautaire bepaling een
      bijzonder gebruik en/of een bijzondere bestemming dient te worden gegeven, zolang die voorwaarde nog niet volledig
      is vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0003214#Artikel2
    url: https://wetten.overheid.nl/BWBR0003214/2005-01-01#Artikel4
    references:
