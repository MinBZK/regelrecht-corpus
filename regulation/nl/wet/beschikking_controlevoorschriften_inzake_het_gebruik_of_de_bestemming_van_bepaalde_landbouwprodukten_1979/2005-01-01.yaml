  - number: '6'
    text: |-
      1 Het bepaalde in [artikel 2][ref1] is van overeenkomstige toepassing op de navolgende produkten, niet zijnde
      een interventieprodukt of een daarmee gelijkgesteld produkt als bedoeld in [artikel 4][ref2], waarvoor ingevolge
      enige EEG-verordening steun wordt verleend, onder de voorwaarde van denaturatie en/of verwerking dan wel onder
      de voorwaarde, dat bij verkoop aan deze produkten een bijzonder gebruik en/of een bijzondere bestemming dient te
      worden gegeven, en wordt het gestelde achter het eerste gedachtenstreepje gelezen als volgt: ondermelk, magere
      melkpoeder en boter; overeenkomstig het in de desbetreffende EEG-verordening bepaalde, zolang die voorwaarde nog
      niet volledig is vervuld:

        - ondermelk en mager melkpoeder:
        - dit ondermelk of mager melkpoeder verkregen of met behulp daarvan vervaardigde produkten.

      2 Het bepaalde in [artikel 2][ref3] is voorts een overeenkomstige toepassing op sojabonen waarvoor ingevolge
      [Verordening (EEG) nr. 1491/85](31985R1491) (PbEG L 151) en haar uitvoeringsbepalingen steun wordt verleend
      onder de voorwaarde van verwerking of aflevering aan een onderneming die gehouden is tot verwerking, zolang deze
      verwerking nog niet volledig is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0003214#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003214#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003214#Artikel2
