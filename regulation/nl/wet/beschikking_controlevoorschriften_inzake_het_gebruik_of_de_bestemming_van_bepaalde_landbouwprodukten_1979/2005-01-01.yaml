    text: |-
      1 De Beschikking administratieve voorschriften ondermelk en mager melkpoeder 1974, de Beschikking
      controlevoorschriften interventieprodukten 1976, en de Beschikking boterconcentraat en de Beschikking boter
      speciale verkoop EEG worden ingetrokken.

      2 De Overdrachtsbeschikking bevoegdheden [Landbouwwet][ref1] 1966, Algemeen wordt gewijzigd in dier voege dat in
      [artikel 1][ref2]

      a. de woorden ‘in de Heffings- en bijdragebeschikking zuivelprodukten 1968’ vervallen en

      b. in plaats van ‘in de Beschikking administratieve voorschriften ondermelk en mager melkpoeder
      1974 en in de Beschikking controlevoorschriften interventieprodukten 1976’ wordt gelezen: en in de
      [Beschikking controlevoorschriften inzake het gebruik of de bestemming van bepaalde landbouwprodukten 1979][ref3].


