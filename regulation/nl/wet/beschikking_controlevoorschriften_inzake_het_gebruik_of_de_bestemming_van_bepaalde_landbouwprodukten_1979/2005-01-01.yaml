  - number: '15'
    text: |-
      Deze beschikking kan worden aangehaald als:
      [Beschikking controlevoorschriften inzake het gebruik of de bestemming van bepaalde landbouwprodukten 1979][ref1]:
      zij wordt bekendgemaakt in de Nederlandse Staatscourant en treedt in werking met ingang van 1 januari 1979.


