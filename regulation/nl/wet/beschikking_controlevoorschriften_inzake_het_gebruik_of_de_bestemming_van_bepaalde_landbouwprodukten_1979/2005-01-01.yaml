        bwb_id: BWBR0003214
        artikel: '4'
  - number: '10'
    text: |-
      1 In de gevallen waarin ingevolge enige communautaire bepaling een controle-exemplaar dient te worden afgegeven
      nadat de interventieprodukten, de daarmee gelijkgestelde produkten, of het in [artikel 6][ref1] bedoelde mager
      melkpoeder, een gehele of gedeeltelijke be- of verwerking of denaturatie hebben ondergaan, vindt deze afgifte
      niet plaats dan na overlegging bij de aangifte ten uitvoer van een formulier L, als bedoeld in artikel 19,
      eerste lid, van de In- en uitvoerbeschikking landbouwgoederen 1981, in tweevoud ingevuld als aldaar in het
      eerste lid aangegeven en voorts houdende een door het desbetreffende produktschap gewaarmerkte aantekening dat
      alle voorschriften met betrekking tot het bijzonder gebruik en/of de bijzondere bestemming zijn nageleefd onder
      vermelding van alle gegevens die ter zake door de Verordening overigens zijn voorgeschreven.

      2 Voor in Benelux circulerende produkten als bedoeld in het eerste lid vindt in de aldaar bedoelde gevallen
      afgifte van een controledocument BENELUX-5 op de voet van het bepaalde in de artikenen la tot en met 2 van de
      Overdrachtsbeschikking bevoegdheden Landbouwwet 1966, Algemeen eveneens niet plaats dan nadat is vastgesteld dat
      alle vorenbedoelde voorschriften zijn nageleefd.

      Voor wat betreft interventieprodukten vermeldt Dienst Regelingen, en voor wat betreft daarmee gelijkgestelde
      produkten en de in [artikel 6][ref2] bedoelde produkten vermeldt het desbetreffende produktschap op het document
      alle gegevens die ter zake door de Verordening overigens zijn voorgeschreven


      [ref1]: https://wetten.overheid.nl/BWBR0003214#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003214#Artikel6
    url: https://wetten.overheid.nl/BWBR0003214/2005-01-01#Artikel10
    references:
