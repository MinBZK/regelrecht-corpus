  - number: '13'
    text: |-
      1 Inzake hetgeen aan Dienst Regelingen is gebleken met betrekking tot de denaturatie, de be- of verwerking,
      het gebruik of de bestemming van interventieprodukten, daarmede gelijkgestelde produkten als bedoeld in
      [artikel 4][ref1], of mager melkpoeder als bedoeld in [artikel 6, eerste lid][ref2], geeft het aan het
      desbetreffende produktschap de verklaringen af die dat produktschap behoeft met het oog op de afgifte van een
      controle-exemplaar of BENELUX 5-controle-document of de betaling van steun voor zodanige produkten.

      2 Op daartoe strekkend verzoek doet Dienst Regelingen aan het desbetreffende produktschap ook mededeling van de
      nadere gegevens als bedoeld in de [artikelen 3][ref3] en [5][ref4] die het produktschap voor de uitoefening van
      zijn taak behoeft.

      3 Van de verklaringen, bedoeld in het eerste lid, zendt Dienst Regelingen steeds afschrift toe aan de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0003214#Artikel4
