  - number: '2'
    text: |-
      1 Er is een Commissie registratie diergeneesmiddelen.

      2 De Commissie adviseert de minister omtrent de registratie van diergeneesmiddelen, alsmede omtrent de verlenging,
      wijziging, schorsing, opheffing van de schorsing of doorhaling van een registratie.

      3 De minister benoemt en ontslaat de leden van de Commissie.

      4 De Commissie bestaat uit zeven leden.
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel2
  - number: '3'
    text: |-
      Het onderzoek dat nodig is met het oog op de voorbereiding van de adviezen van de Commissie wordt op haar verzoek
      verricht door:

      a. het Rijkskwaliteitsinstituut voor land- en tuinbouwproducten;

      b. het Rijksinstituut voor Volksgezondheid en Milieuhygiëne;

      c. het Centraal Instituut voor Dierziekte-Controle Lelystad.
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel3
  - number: '4'
    text: |-
      1 Een aanvraag tot registratie van een diergeneesmiddel wordt ingediend bij het Bureau.

      2 Een aanvraag wordt ingediend door een in een lidstaat gevestigd persoon.
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel4
  - number: '5'
    text: |-
      1 Een aanvraag als bedoeld in [artikel 4][ref1] bestaat uit een dossier waarvan het aanvraagformulier deel
      uitmaakt.

      2 Aanvraagformulieren als bedoeld in het eerste lid zijn op aanvraag verkrijgbaar bij het Bureau.

      3 Het dossier van een aanvraag tot registratie van een diergeneesmiddel bevat de gegevens en bescheiden als bedoeld
      in artikel 12, derde lid, van [richtlijn nr. 2001/82/EG](32001L0082) in samenhang met bijlage I bij [richtlijn
      2001/82/EG](32001L0082).

      4 Indien het Bureau vaststelt dat een aanvraag tot registratie van eenzelfde diergeneesmiddel al in een andere
      lidstaat in behandeling is, weigert het de aanvraag te beoordelen en stelt het de aanvrager ervan in kennis dat
      [artikel 11][ref2] op deze aanvraag van toepassing is.

      5 Indien het Bureau ervan in kennis wordt gesteld dat in een andere lidstaat registratie voor een diergeneesmiddel
      is verleend, waarvoor een aanvraag tot registratie is ingediend, wijst het de aanvraag in afwijking van
      [artikel 4:5, eerste lid][ref3], en [4:15 van de Algemene wet bestuursrecht][ref4] af indien deze niet
      overeenkomstig de procedure van [artikel 11][ref5] is ingediend.


