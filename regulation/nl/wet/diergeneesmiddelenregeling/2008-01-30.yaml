  - number: '75'
    text: |-
      De minister kan op verzoek van een houder van een vergunning als bedoeld in [artikel 21 van de wet][ref1] of van de
      bevoegde instanties van het land waar de diergeneesmiddelen worden ingevoerd ten behoeve van de uitvoer hiervan een
      verklaring certificeren, waaruit blijkt dat de betreffende fabrikant in het bezit is van een vergunning voor het
      bereiden, verpakken, etiketteren of afleveren van deze diergeneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '77'
    text: |-
      1 Als diergeneesmiddelen als bedoeld in [artikel 29, eerste lid, van de wet][ref1], waarop de bepalingen van
      [Hoofdstuk IV van de wet][ref2] van toepassing zijn, worden aangewezen:

      a. antimicrobiële diergeneesmiddelen;

      b. resistentie-inducerende diergeneesmiddelen;

      c. hormoonpreparaten;

      d. sera en entstoffen;

      e. biologische diagnostica;

      f. diergeneesmiddelen die kunnen worden toegediend door middel van injectie of implantatie, tenzij uitsluitend
      subcutane, intramusculaire of intramammaire toediening is toegestaan;

      g. diergeneesmiddelen bestemd voor algehele verdoving, alsmede per injectie toe te dienen middelen voor
      plaatselijke verdoving;

      h. spierrelaxantia;

      i. diergeneesmiddelen, die een werkzaam bestanddeel bevatten dat niet gedurende ten minste 5 jaar in een
      geregistreerd diergeneesmiddel is verwerkt;

      j. diergeneesmiddelen die bestemd zijn om curatief te worden gebruikt bij ziekten van:

      1°. zenuwstelsel;

      2°. hart- en bloedvatenstelsel;

      3°. immuunsysteem of bloedbereidende organen;

      4°. inwendige nieuwvormingen;

      k. diergeneesmiddelen voor zover niet reeds uit andere hoofde onder het kanalisatieregime vallend die tevens
      geneesmiddelen zijn als bedoeld in [artikel 4, derde lid, van de Wet op de geneesmiddelenvoorziening][ref3];

      l. diergeneesmiddelen die β-agonisten bevatten;

      m. diergeneesmiddelen die bestemd zijn voor of mede bestemd zijn voor toepassing bij voedselproducerende dieren,
      voor zover zij niet reeds zijn aangewezen in de onderdelen a tot en met l.

      2 In afwijking van het eerste lid zijn de bepalingen van [hoofdstuk IV van de wet][ref4] niet van toepassing op:

      a. antimicrobiële diergeneesmiddelen en resistentie-inducerende diergeneesmiddelen uitsluitend geschikt en bestemd
      voor toepassing bij aquarium- en terrariumdieren, in een hoeveelheid van ten hoogste vijf gram van de werkzame stof
      per verpakking;

      b. diergeneesmiddelen uitsluitend geschikt en bestemd voor orale toepassing bij kooi- en volièrevogels en
      postduiven en niet bedrijfsmatig gehouden kleine knaagdieren, konijnen en fretten die als werkzame stof slechts
      chloortetracycline tetracycline, oxytetracycline of sulfonamiden bevatten in een hoeveelheid van ten hoogte vijf
      gram per verpakking.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0002290#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel77
