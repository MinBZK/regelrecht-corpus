      1 Onverminderd [artikel 86][ref1] doet een houder van een vergunning als bedoeld in [artikel 33 van de wet][ref2]
      éénmaal per kalenderjaar een opgave als bedoeld in [53, eerste lid, van het besluit][ref3], door middel van een
      overzicht van de in de administratie opgenomen gegevens met betrekking tot de benaming, de samenstelling en de
      hoeveelheid van de bereide halffabrikaten met medicinale werking.

      2 De houder van een vergunning, bedoeld in het eerste lid, doet het overzicht, bedoeld in het eerste lid,
      vóór 1 februari van het kalenderjaar volgend op dat waarop de administratie betrekking heeft, toekomen aan het
      Productschap Diervoeder.

      3 De houder van een vergunning, bedoeld in het eerste lid, bewaart het overzicht, bedoeld in het eerste lid,
      gedurende vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel86
