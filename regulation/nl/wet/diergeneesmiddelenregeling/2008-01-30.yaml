  - number: '74'
    text: |-
      1 Op de primaire verpakking en, in voorkomend geval, op de buitenverpakking van diergeneesmiddelen, bestemd voor
      uitvoer, zijn de voorschriften van [artikel 37 van het besluit][ref1] en de [artikelen 62][ref2], [63][ref3],
      [64][ref4], [67][ref5], [69][ref6] en [72, derde lid][ref7], van toepassing, met dien verstande dat alle
      aanduidingen op de verpakking gesteld zijn in de taal of één der talen van het land van bestemming.

      2 Het bepaalde in het eerste lid is niet van toepassing voor zover degene die het diergeneesmiddel uitvoert
      aantoont, dat verpakking en etikettering in overeenstemming zijn of zijn gebracht met de eisen van het land van
      bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel37
