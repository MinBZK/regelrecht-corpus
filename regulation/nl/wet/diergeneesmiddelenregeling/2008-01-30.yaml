  - number: '67'
    text: |-
      1 Op de primaire verpakking en, in voorkomend geval, op de buitenverpakking van een niet-geregistreerd
      diergeneesmiddel dat krachtens [artikel 19 van het besluit][ref1] van registratieplicht uitgezonderd is, wordt
      vermeld:

      a. de naam van het diergeneesmiddel, onmiddellijk gevolgd door de kwalitatieve en kwantitatieve samenstelling naar
      werkzame bestanddelen, afhankelijk van de farmaceutische vorm aangegeven per dosis of in procenten;

      b. de naam of handelsnaam en het adres van degene die voor het in de handel brengen van het diergeneesmiddel in
      Nederland verantwoordelijk is;

      c. het nummer van de partij;

      d. de vermelding ‘diergeneesmiddel’ of ‘geneesmiddel voor diergeneeskundig gebruik’ en de diersoort of diersoorten
      waarvoor het diergeneesmiddel is bestemd en de dosering of doseringen waarin het dient te worden toegepast;

      e. de uiterste gebruiksdatum, indien de maximale houdbaarheidsduur minder dan 3 jaar bedraagt;

      f. de aanbevelingen omtrent de wijze van bewaring;

      g. de veiligheidsmaatregelen voor de gebruiker;

      h. de farmaceutische vorm en de inhoud naar gewicht, het volume of het aantal doses.

      2 Op de primaire verpakking, en in voorkomend geval, op de buitenverpakking van een homeopathisch diergeneesmiddel,
      als bedoeld in [artikel 20, eerste lid, van het besluit][ref2], wordt in afwijking van het bepaalde in het eerste
      lid onder d, in plaats van het woord ‘diergeneesmiddel’ vermeld: ‘homeopathisch diergeneesmiddel vrijgesteld van
      registratieplicht en zonder goedgekeurde therapeutische indicatie’.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel20
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0018901
        artikel: '20'
  - number: '68'
    text: |-
      Op de primaire verpakking en, in voorkomend geval, op de buitenverpakking van een door een dierenarts of apotheker
      ingevolge het bepaalde in [artikel 2, tweede lid, onderdeel a, van de wet][ref1] bereid diergeneesmiddel wordt, in
      afwijking van het bepaalde in [artikel 67][ref2], vermeld:

      a. de naam van de bereider;

      b. de naam van het diergeneesmiddel, onmiddellijk gevolgd door de kwalitatieve en kwantitatieve samenstelling van
      werkzame bestanddelen, afhankelijk van de farmaceutische vorm aangegeven per dosis of in procenten;

      c. de naam van de houder van het dier of de dieren waarvoor het middel is bereid;

      d. de dosering waarin het diergeneesmiddel moet worden toegepast en wijze van toediening;

      e. de wachttermijn;

      f. de datum van bereiding;

      g. aanbevelingen omtrent het gebruik en de bewaring van het diergeneesmiddel;

      h. de eventuele veiligheidsmaatregelen voor de gebruiker;

      i. de uiterste gebruiksdatum, indien de maximale houdbaarheidstermijn minder dan drie jaar bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel67
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel68
    references:
      - id: ref1
