  - number: '87'
    text: |-
      1 De administratie, bedoeld in [artikel 86, eerste lid][ref1], van houders van vergunningen als bedoeld
      in [artikel 21][ref2] of [33 van de wet][ref3], dierenartsen, apothekers en personen als bedoeld in
      [artikel 30, tweede lid, onderdeel f, van de wet][ref4] is zodanig ingericht dat daaruit te allen tijde op
      eenvoudige wijze met betrekking tot elke transactie en elke zelfstandigheid kan worden afgeleid:

      a. datum van de transactie;

      b. benaming en, in voorkomend geval, het registratienummer van het diergeneesmiddel;

      c. partijnummer;

      d. ontvangen of afgeleverde hoeveelheid;

      e. naam en adres van de ontvanger of de leverancier;

      f. in voorkomend geval bij welke dieren de toepassing van het betrokken diergeneesmiddel plaatsvond of, ingeval dit
      middel niet volledig wordt toegepast, de bestemming van de resterende hoeveelheid ervan;

      g. voor zover de houder van een vergunning voor het afleveren van diergeneesmiddelen anders dan door middel van de
      detailhandel aflevert, de op de verpakking vermelde uiterste gebruiksdatum van het diergeneesmiddel.

      2

      3 De administratie, de bescheiden die verband houden met de aantekeningen in de administratie en het verslag,
      bedoeld in het derde lid, worden gedurende vijf jaar bewaard.

      4 Onverminderd het derde lid worden de administratie, de bescheiden, die verband houden met de aantekeningen in
      de administratie, en het verslag, bedoeld in het eerste lid, gedurende drie jaar bewaard door houders van een
      vergunning voor het bereiden van een diergeneesmiddel.


