  - number: 95b
    text: |-
      1 Een recept heeft een geldigheidsduur van twee weken na de datum van verstrekking.

      2 Een diergeneesmiddel wordt door houders van een vergunning als bedoeld in [artikel 21 van de wet][ref1] voor het
      afleveren van diergeneesmiddelen en apothekers niet afgeleverd na verloop van de periode, bedoeld in het eerste
      lid.

      3 Het tweede lid is niet van toepassing op diergeneesmiddelen als bedoeld in
      [artikel 77a, eerste lid, onderdelen a tot en met d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
