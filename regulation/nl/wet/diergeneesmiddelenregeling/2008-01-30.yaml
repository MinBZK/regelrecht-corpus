      1 De kosten verbonden aan de behandeling van een aanvraag van een vergunning, bedoeld in
      [artikel 21 van de wet][ref1] bedragen € 261.

      2 De kosten van een aanvraag tot wijziging van een vergunning bedragen € 104.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '111'
    text: |-
      De kosten verbonden aan een onderzoek ter plaatse als bedoeld in [artikel 24, onderdeel b, van de wet][ref1]
      bedragen indien de aanvraag betrekking heeft op het:

      a. bereiden, etiketteren of verpakken van diergeneesmiddelen € 1.044 per halve dag;

      b. afleveren van diergeneesmiddelen € 261 per halve dag.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel24
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '24'
  - number: '112'
    text: |-
      De kosten van een inspectie als bedoeld in [artikel 25, derde lid, van de wet][ref1] bedragen € 1.044 per halve
      dag.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel25
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '25'
  - number: '113'
    text: |-
      De kosten verbonden aan de behandeling van de aanvraag, bedoeld in [artikel 114][ref1] bedragen:

      a. voor de administratieve behandeling van de aanvraag een bedrag van € 288;

      b. voor de beoordeling van de aanvraag een bedrag van € 1.150;

      c. voor de administratieve behandeling van aanvragen tot wijziging of verlenging een bedrag van € 288.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel114
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '114'
        hoofdstuk: XI
        paragraaf: '1'
  - number: 113a
    text: |-
      De kosten verbonden aan de behandeling van een verzoek tot certificering als bedoeld in [artikel 75][ref1] bedragen
      € 56.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel75
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel113a
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '75'
        hoofdstuk: III
        paragraaf: '9'
  - number: '114'
    text: |-
      1 Een aanvraag om toestemming als bedoeld in artikel 75, eerste lid, van het besluit wordt ingediend bij het
      Bureau.

      2 Een aanvraag wordt ingediend door een in een lidstaat gevestigd persoon.
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel114
  - number: '115'
    text: |-
      1 Een aanvraag als bedoeld in [artikel 114][ref1] bestaat uit een dossier waarvan het aanvraagformulier deel
      uitmaakt.

      2 Aanvraagformulieren als bedoeld in het eerste lid zijn op aanvraag verkrijgbaar bij het Bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel114
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '114'
        hoofdstuk: XI
        paragraaf: '1'
  - number: '116'
    text: |-
      Een besluit omtrent toestemming als bedoeld in [artikel 114][ref1] wordt genomen binnen 60 dagen na ontvangst van
      de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel114
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '114'
        hoofdstuk: XI
        paragraaf: '1'
  - number: '118'
    text: |-
      1 In afwijking van [artikel 2, eerste lid, van de wet][ref1] en onverminderd het bepaalde in het tweede lid,
      onderdeel b, van dat artikel, is het toegestaan een diergeneesmiddel, waarvoor voor 1 mei 1987 een registratie
      is aangevraagd doch deze door de aanvrager schriftelijk werd ingetrokken of waarvan de beslissing tot het niet-
      ontvankelijk verklaren van de aanvraag dan wel tot afwijzing van de aanvraag onherroepelijk is geworden, te
      bereiden voorhanden of in voorraad te hebben, af te leveren of bij dieren toe te passen, mits ten aanzien van
      vorenstaande gevallen niet uitdrukkelijk anders wordt beslist, gedurende de in het tweede lid gestelde periode.

      2 De in het eerste lid bedoelde periode bedraagt:

      a. zes maanden voor het bereiden, voorhanden of in voorraad hebben ten behoeve van het afleveren in het geval een
      aanvraag is ingetrokken dan wel de termijn waarbinnen het beroep kon worden ingesteld is verstreken of de termijn
      waarbinnen beroep kon worden ingesteld is verstreken of de beslissing bedoeld in het eerste lid onherroepelijk
      is geworden;

      b. twaalf maanden voor het bereiden, voorhanden of in voorraad hebben met het oog op het afleveren of het afleveren
      ingeval de aanvraag is ingetrokken dan wel de termijn waarbinnen beroep kon worden ingesteld is verstreken of wel
      de beslissing bedoeld in het eerste lid onherroepelijk is geworden;

      c. twaalf maanden voor het voorhanden of in voorrad hebben met het oog op het toepassen of het toepassen bij dieren
      ingeval de aanvraag is ingetrokken dan wel de termijn waarbinnen beroep kan worden ingesteld is verstreken of de
      beslissing bedoeld in het eerste lid onherroepelijk is geworden.

      3 De in het tweede lid bedoelde periode is van overeenkomstige toepassing op het voorhanden of in voorraad,
      afleveren en toepassen van een diergeneesmiddel, waarvoor en afgeleide registratie of en registratie als parallel-
      geïmporteerd diergeneesmiddel van het in het eerste lid bedoelde diergeneesmiddel is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
  - number: '119'
    text: |-
      Van een beslissing als bedoeld in [artikel 118, eerste lid][ref1], wordt nadat de termijn van beroep is verstreken
      dan wel de beslissing onherroepelijk is geworden door het Bureau mededeling gedaan in de Staatscourant waarbij
      ook wordt vermeld op welk diergeneesmiddel, waarvoor een afgeleide registratie of een registratie als parallel-
      geïmporteerd diergeneesmiddel werd aangevraagd, de regeling toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel118
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '118'
        hoofdstuk: XI
        paragraaf: '3'
  - number: '120'
    text: |-
      Het is slechts toegestaan een diergeneesmiddel waarvan de registratie is ingetrokken of een beslissing als bedoeld
      in [artikel 118, eerste lid][ref1], is genomen, gedurende de in het tweede lid, onderdeel c, van dat artikel
      bedoelde periode bij dieren toe te passen, voor zover de toepassing geschiedt overeenkomstig de bij de aanvraag tot
      registratie verstrekte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel118
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '118'
        hoofdstuk: XI
        paragraaf: '3'
  - number: '121'
    text: |-
      De [artikelen 118 tot en met 120][ref1] zijn niet van toepassing op diergeneesmiddelen waarvoor voor de
      bekendmaking van de onderhavige regeling in de Staatscourant een aparte voorziening is getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel118
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '118'
        hoofdstuk: XI
        paragraaf: '3'
  - number: 121a
    text: |-
      Tot 1 januari 2008 is het fabrikanten, in afwijking van [artikel 62, onderdeel f][ref1] en
      [artikel 66, onderdeel a][ref2], toegestaan de volgende aanduidingen niet te vermelden:

      a. diergeneesmiddel, uitsluitend op recept afleveren;

      b. geneesmiddel voor diergeneeskundig gebruik, uitsluitend op recept afleveren, of

      c. uitsluitend op recept afleveren, dan wel ‘U.R.A.’.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel66
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel121a
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '62'
        hoofdstuk: III
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0019277
        artikel: '66'
        hoofdstuk: III
        paragraaf: '8'
  - number: 121b
    text: |-
      Tot en met 1 juli 2008 kunnen houders van een vergunning voor het afleveren van diergeneesmiddelen als bedoeld
      in [artikel 21, eerste lid, van de wet][ref1], dierenartsen en apothekers primaire verpakkingen en, in voorkomend
      geval, buitenverpakkingen van diergeneesmiddelen bedoeld in [artikel 77a][ref2] afleveren, voorhanden en in
      voorraad hebben waarop, in afwijking van de [artikelen 62, onderdeel f][ref3] en [66, onderdeel a][ref4], de
      volgende aanduidingen niet zijn vermeld:

      a. diergeneesmiddel, uitsluitend op recept afleveren, of

      b. geneesmiddel voor diergeneeskundig gebruik, uitsluitend op recept afleveren, of

      c. diergeneesmiddel, ‘U.R.A.’, of

      d. geneesmiddel voor diergeneeskundig gebruik, ‘U.R.A’.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel77a
      [ref3]: https://wetten.overheid.nl/BWBR0019277#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0019277#Artikel66
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel121b
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0019277
        artikel: 77a
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0019277
        artikel: '62'
        hoofdstuk: III
        paragraaf: '8'
      - id: ref4
        bwb_id: BWBR0019277
        artikel: '66'
        hoofdstuk: III
        paragraaf: '8'
  - number: 121c
    text: |-
      In afwijking van [artikel 77a, eerste lid][ref1], is het toegestaan de in dat artikel bedoelde diergeneesmiddelen
      tot en met 1 juli 2008 zonder recept van een dierenarts af te leveren aan houders van dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel77a
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel121c
