      1 De kosten voor het in behandeling nemen van een aanvraag als bedoeld in
      [artikel 3, tweede lid, onderdeel a, van de wet][ref1], bedragen € 288.

      2 Indien door één aanvrager uitsluitend met het oog op een zelfde wijziging van verschillende registraties
