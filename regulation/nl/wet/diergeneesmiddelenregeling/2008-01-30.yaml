    text: |-
      1 Houders van vergunningen als bedoeld in de [artikelen 21][ref1] of [33 van de wet][ref2], dierenartsen,
      apothekers en personen als bedoeld in [artikel 30, tweede lid, onderdeel f, van de wet][ref3], voeren een
      administratie omtrent in het voorkomende geval de ontvangst, de herkomst, degene aan wie is afgeleverd, de
      bestemming, de toepassing, het verlies en de vernietiging, alsmede de be- of verwerking van diergeneesmiddelen of
      gemedicineerde voeders, met dien verstande dat:

      a. de administratie van houders van een vergunning voor het afleveren van diergeneesmiddelen met betrekking tot het
      afleveren aan houders van dieren uitsluitend betrekking heeft op diergeneesmiddelen die bestemd zijn voor of mede
      bestemd zijn voor toepassing bij voedselproducerende dieren;

      b. de administratie van houders van een vergunning voor het bereiden van diergeneesmiddelen tevens betrekking heeft
      op de door hen gebruikte grondstoffen;

      c. de administratie van dierenartsen en apothekers onverminderd het bepaalde in [artikel 94][ref4]
      uitsluitend betrekking heeft op diergeneesmiddelen als bedoeld in [artikel 29 van de wet][ref5],
      diergeneesmiddelen waarvoor een wachttermijn geldt en diergeneesmiddelen die overeenkomstig
      [artikel 2, tweede lid, onderdeel a, van de wet][ref6] zijn bereid, alsmede op de bij de bereiding gebruikte
      grondstoffen;

      d. de administratie van personen als bedoeld in [artikel 30, tweede lid, onderdeel f, van de wet][ref7],
      uitsluitend betrekking heeft op diergeneesmiddelen als bedoeld in [artikel 29 van de wet][ref8] en
      diergeneesmiddelen waarvoor een wachttermijn geldt;

      e. de administratie van houders van een vergunning als bedoeld in [artikel 33 van de wet][ref9] zowel betrekking
      heeft op voormengsels met medicinale werking of halffabrikaten met medicinale werking als gemedicineerde voeders.

      2 Houders van een vergunning voor het afleveren van diergeneesmiddelen als bedoeld in
      [artikel 21 van de wet][ref10] houden ten minste éénmaal per kalenderjaar een nauwkeurige controle van de
      administratie, bedoeld in het eerste lid, door vergelijking van de ontvangen, afgeleverde en in voorkomend geval
      vernietigde diergeneesmiddelen met de aanwezige voorraden, ten bewijze waarvan een verslag wordt gemaakt dat in elk
      geval de geconstateerde verschillen bevat.


