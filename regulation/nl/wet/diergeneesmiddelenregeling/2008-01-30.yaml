        artikel: '3'
  - number: '25'
    text: |-
      1 Het register, bedoeld in [artikel 9 van de wet][ref1], berust bij en wordt bijgehouden door het Bureau.

      2 In het register worden in voorkomend geval ter zake het betrokken diergeneesmiddel onder vermelding van de datum
      aangetekend:

      a. de schorsing van een inschrijving;

      b. de opheffing van een schorsing;

      c. de doorhaling van een inschrijving;

      d. de wijziging van een inschrijving;

      e. de verlenging van een inschrijving.

      3 Vanaf de datum waarop een inschrijving van een diergeneesmiddel in het register is doorgehaald of vervallen
      worden de op dat diergeneesmiddel betrekking hebbende gegevens uit het register nog ten minste 10 jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel9
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '9'
  - number: '26'
    text: |-
      Een diergeneesmiddel dat een substantie bevat ten aanzien waarvan een monografie is opgenomen in de krachtens
      het Verdrag inzake de samenstelling van een Europese farmacopee van 22 juli 1964, Trb 1966, nr. 115 samengestelde
      Europese farmacopee, wordt alleen geregistreerd indien de substantie voldoet aan de in de desbetreffende monografie
      gegeven specificaties ten aanzien van de kwaliteit.
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel26
  - number: '27'
    text: |-
      Als substanties als bedoeld in [artikel 4, onderdeel d, van de wet][ref1] worden aangewezen smetstoffen die
      brucellosis melitensis, brucellosis suis, brucellosis bang of rundertuberculose kunnen veroorzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel4
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '4'
  - number: '28'
    text: |-
      Als substanties als bedoeld in [artikel 5 van de wet][ref1] worden aangewezen:

      a. substanties die niet zijn opgenomen in bijlage I, II of III bij [verordening (EEG) nr. 2377/90](31990R2377),
      voor zover het desbetreffende diergeneesmiddel is bestemd of mede is bestemd om bij voedselproducerende dieren te
      worden toegepast;

      b. somatropines;

      c. entstoffen voor honden en katten die een niet-geïnactiveerd hondsdolheidvirus bevatten;

      d. de stoffen, bedoeld in artikel 3, onderdeel a, van Richtlijn nr. 96/22/EG, tenzij toediening van deze stoffen
      aan landbouwhuisdieren of aquacultuurdieren op grond van artikel 4 tot en met 6 van Richtlijn nr. 96/22/EG is
      toegestaan;

      e. substanties die ingevolge [artikel 46 van het besluit][ref2] niet aan landbouwhuisdieren of aquacultuurdieren
      mogen worden toegediend;

      f. substanties die specifiek bestemd zijn om te worden toegepast bij paardachtigen die niet voedselproducerend
      zijn, wanneer reeds een registratie is verleend voor een ander diergeneesmiddel dat tevens is bestemd om eenzelfde
      aandoening, ziekte, ziekteverschijnsel pijn, verwonding of gebrek bij voedselproducerende paarden te genezen,
      lenigen of voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel46
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0018901
        artikel: '46'
  - number: '29'
    text: |-
      Als substanties als bedoeld in [artikel 19, onderdeel f, van het besluit][ref1] worden aangewezen de in
      [bijlage I][ref2] bij de regeling opgenomen substanties.


