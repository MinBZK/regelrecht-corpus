        artikel: '2'
  - number: '31'
    text: |-
      Een persoon als bedoeld in [artikel 13, eerste lid, van het besluit][ref1] is belast met:

      a. de totstandbrenging en het beheer van een systeem dat waarborgt dat gegevens over alle vermoedelijke
      bijwerkingen, die aan het personeel van de onderneming, waaronder het verkooppersoneel en de artsenbezoekers worden
      gemeld, bij het Europees Geneesmiddelenbureau worden vermeld, geordend en toegankelijk gemaakt;

      b. het opstellen van een verslag van alle vermoedelijke bijwerkingen en vermoedelijke bijwerkingen bij de mens die
      zich in een lidstaat of in een derde land voordoen, overeenkomstig de bepalingen van de richtsnoeren, bedoeld in
      artikel 77, eerste lid, van [richtlijn nr. 2001/82/EG](32001L0082);

      c. de taak ervoor te zorgen dat aan elk verzoek van de minister om verstrekking van de nodige aanvullende gegevens
      voor de beoordeling van de aan een diergeneesmiddel verbonden voordelen en risico's snel en volledig wordt voldaan,
      met inbegrip van gegevens over het afzetvolume van of het aantal recepten voor het betrokken diergeneesmiddel;

      d. de verstrekking aan de minister van alle andere informatie die relevant is voor de beoordeling van de baten en
      risico's van een diergeneesmiddel, met inbegrip van relevante informatie over veiligheidsonderzoek na toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel13
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '13'
  - number: '32'
    text: |-
      1 De registratiehouder bewaart de verslagen, bedoeld in [artikel 31, onderdeel b][ref1], ten minste vijf jaar.

      2 De verslagen, bedoeld in het eerste lid, bevatten in elk geval de meldingen voortkomend uit het systeem, bedoeld
      in [artikel 31, onderdeel a][ref2], en gaan vergezeld van een wetenschappelijke beoordeling van de baten en de
      risico's van het diergeneesmiddel.

      3 De registratiehouder overlegt de in het eerste lid bedoelde verslagen aan het Bureau:

      a. op een eerste daartoe strekkend verzoek van de minister;

      b. ten minste eenmaal per zes maanden, vanaf de registratie van het diergeneesmiddel waarop de verslagen betrekking
      hebben totdat het diergeneesmiddel voor het eerst in de handel wordt gebracht;

      c. ten minste eenmaal per zes maanden, gedurende de eerste twee jaar na het voor het eerst in de handel brengen van
      het diergeneesmiddel waarop de verslagen betrekking hebbben;

      d. ten minste eenmaal per jaar in het derde en vierde jaar na het voor het eerst in de handel brengen van het
      diergeneesmiddel waarop de verslagen betrekking hebben;

      e. ten minste eenmaal per drie jaar, vanaf het vijfde jaar na het voor het eerst in de handel brengen van het
      diergeneesmiddel waarop de verslagen betrekking hebben.

      4 In aanvulling op het derde lid overlegt de registratiehouder de verslagen bij de aanvraag voor verlenging van de
      registratie van het betreffende diergeneesmiddel aan het Bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel31
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '31'
        hoofdstuk: II
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0019277
        artikel: '31'
        hoofdstuk: II
        paragraaf: '10'
  - number: '33'
    text: |-
      Van het verbod, bedoeld in [artikel 2, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor het
      voorhanden hebben, afleveren of toepassen van niet geregistreerde diergeneesmiddelen aan dierenartsen als bedoeld
      in de [Regeling toelating onderdanen EEG-lidstaten][ref2] (Stcrt. 1991, 220) indien is voldaan aan de voorwaarden,
      gesteld in de [artikelen 35 tot en met 38][ref3], [artikel 78][ref4] en [93][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005255
      [ref3]: https://wetten.overheid.nl/BWBR0019277#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0019277#Artikel78
      [ref5]: https://wetten.overheid.nl/BWBR0019277#Artikel93
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005255
      - id: ref3
        bwb_id: BWBR0019277
        artikel: '35'
        hoofdstuk: II
        paragraaf: '11'
      - id: ref4
        bwb_id: BWBR0019277
        artikel: '78'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0019277
        artikel: '93'
        hoofdstuk: VIII
        paragraaf: '4'
  - number: '34'
    text: |-
      Onverminderd het bepaalde in [artikel 37][ref1] is het de dierenarts, bedoeld in [artikel 33][ref2] slechts
      toegestaan een niet in Nederland geregistreerd diergeneesmiddel voorhanden te hebben, af te leveren of toe te
      passen:

      a. indien het betrokken diergeneesmiddel in de lidstaat waar de dierenarts als zodanig is gevestigd, overeenkomstig
      de bepalingen van [richtlijn nr. 2001/82/EG](32001L0082) is toegelaten en het diergeneesmiddel uitsluitend wordt
      toegepast onder de voorwaarden waaronder de toelating is verleend;

      b. in een hoeveelheid die de normale dagelijkse behoefte voor de uitoefening van de diergeneeskunde volgens goed
      veterinair gebruik door een dierenarts niet overschrijdt, en

      c. indien, in het geval dat hij het diergeneesmiddel toepast bij voedselproducerende dieren, hij kan aantonen dat
      het betrokken diergeneesmiddel kwalitatief en kwantitatief hetzelfde of dezelfde werkzame bestanddelen bevat als
      een hier in Nederland voor eenzelfde therapeutisch doel geregistreerd diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel33
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '37'
        hoofdstuk: II
        paragraaf: '11'
      - id: ref2
        bwb_id: BWBR0019277
        artikel: '33'
        hoofdstuk: II
        paragraaf: '11'
  - number: '35'
    text: |-
      Het is de dierenarts, bedoeld in [artikel 33][ref1], slechts toegestaan een diergeneesmiddel als bedoeld in
      [artikel 34][ref2] voorhanden te hebben of te vervoeren indien:

      a. dit diergeneesmiddel zich bevindt in de oorspronkelijke primaire verpakking en buitenverpakking van degene, door
      wie het is bereid, en

      b. de aard en de hoeveelheid van het vervoerde diergeneesmiddel is afgestemd op de normale dagelijkse behoefte
      volgens goed veterinair gebruik voor de dieren waarvoor zijn hulp is ingeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel34
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '33'
        hoofdstuk: II
        paragraaf: '11'
      - id: ref2
        bwb_id: BWBR0019277
        artikel: '34'
        hoofdstuk: II
        paragraaf: '11'
  - number: '36'
    text: |-
      De dierenarts, bedoeld in [artikel 34][ref1], is verplicht, indien hij een diergeneesmiddel als bedoeld in
      [artikel 34][ref2] heeft afgeleverd of toegepast, aan de houder van het dier schriftelijk de wachttermijn
      mede te delen die vermeld wordt op het etiket of de bijsluiter van het betrokken diergeneesmiddel, tenzij
      hij redelijkerwijs geacht kan worden te weten, dat in Nederland een langere wachttermijn voor een dergelijk
      diergeneesmiddel in acht moet worden genomen, in welk geval hij verplicht is deze aan de houder van het dier mede
      te delen.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel34
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '34'
        hoofdstuk: II
        paragraaf: '11'
      - id: ref2
        bwb_id: BWBR0019277
        artikel: '34'
        hoofdstuk: II
        paragraaf: '11'
  - number: '37'
    text: |-
      1 Het is de dierenarts, bedoeld in [artikel 34][ref1], slechts toegestaan een diergeneesmiddel als bedoeld in
      [artikel 34][ref2] aan de houder van dieren af te leveren, indien:

      a. de dierenarts het dier of de dieren waarvoor het diergeneesmiddel is bestemd onder zijn behandeling heeft;

      b. de dierenarts het dier of de dieren heeft onderzocht.

      2 De hoeveelheid van het diergeneesmiddel, bedoeld in het eerste lid, overschrijdt de benodigde hoeveelheid voor
      een behandeling over ten hoogste drie dagen niet.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel34
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '34'
        hoofdstuk: II
        paragraaf: '11'
      - id: ref2
        bwb_id: BWBR0019277
        artikel: '34'
        hoofdstuk: II
        paragraaf: '11'
  - number: '38'
    text: |-
      De diergeneesmiddelen, bedoeld in de [artikelen 34][ref1] en [37][ref2], zijn diergeneesmiddelen met uitzondering
      van sera, entstoffen en biologische diagnostica.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel37
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '34'
        hoofdstuk: II
        paragraaf: '11'
      - id: ref2
        bwb_id: BWBR0019277
        artikel: '37'
        hoofdstuk: II
        paragraaf: '11'
  - number: '39'
    text: |-
      Van het verbod, bedoeld in [artikel 2, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor zover
      het betreft het voorhanden hebben, in voorraad hebben of toepassen van diergeneesmiddelen ten behoeve van
      dierproeven, voor zover deze proeven worden verricht in het kader van de [Wet op de dierproeven][ref2] door de in
      [die wet][ref3] bedoelde vergunninghouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003081
      [ref3]: https://wetten.overheid.nl/BWBR0003081
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003081
      - id: ref3
        bwb_id: BWBR0003081
  - number: '40'
    text: |-
      1 De aanvraag tot keuring van een partij, bedoeld in [artikel 15, eerste lid, van de wet][ref1] geschiedt door
      inzending bij het Bureau van een volledig ingevuld formulier en na betaling van het voor de keuring verschuldigde
      bedrag.

      2 Binnen drie dagen na ontvangst van die aanvraag bevestigt het Bureau schriftelijk die ontvangst onder vermelding
      van het nummer waaronder deze is ingeschreven.

      3 Formulieren als bedoeld in het eerste lid zijn op aanvraag verkrijgbaar bij het Bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel15
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '15'
  - number: '41'
    text: |-
      1 Een overeenkomstig [artikel 40][ref1] ingediende aanvraag wordt slechts in behandeling genomen indien:

      a. de aanvraag vergezeld gaat van een partijprotocol en een partijvrijgifte-document;

      b. het partijprotocol is gedagtekend en ondertekend door de persoon die verantwoordelijk is voor de controle;

      c. de aanvrager schriftelijk verklaart dat van de ter keuring aangeboden partij:

      1°. een voor die partij representatief monster bewaard wordt van een zodanige grootte, dat daarop een controle op
      de conformiteit als bedoeld in [artikel 16 van de wet][ref2] kan worden verricht;

      2°. het betrokken monster gedurende de houdbaarheidstermijn bewaard zal worden, en

      3°. zo de partij uit verschillende voor de gebruiker bestemde typen primaire verpakkingen bestaat, het onder 1
      bedoelde monster in elk geval een primaire verpakking van elk type omvat.

      2 De aanvrager stelt het monster, bedoeld in het eerste lid, onderdeel c, binnen vijf dagen op verzoek van het
      Bureau beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel16
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '40'
        hoofdstuk: II
        paragraaf: '13'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '16'
  - number: '42'
    text: |-
      1 De uitslag van de partijkeuring wordt de aanvrager uiterlijk binnen 60 dagen, nadat aan alle in [artikel 3][ref1]
      gestelde eisen is voldaan, medegedeeld.

      2 Bij de goedkeuring wordt een partijvrijgifte-certificaat verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel3
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '43'
    text: |-
      Van het verbod, bedoeld in [artikel 14, eerste lid, van de wet][ref1], wordt vrijstelling verleend met uitzondering
      van het verbod op het afleveren, voorhanden hebben, in voorraad hebben en toepassen van geregistreerde sera,
      entstoffen of biologische diagnostica die niet afkomstig zijn van een goedgekeurde partij.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel14
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '14'
  - number: '44'
    text: |-
      1 Een aanvraag tot het verlenen van een vergunning als bedoeld in [artikel 21 van de wet][ref1] wordt ingediend bij
      het Bureau.

      2 Een aanvraag als bedoeld in het eerste lid bestaat uit een aanvraagformulier.

      3 Aanvraagformulieren als bedoeld in het tweede lid zijn op aanvraag verkrijgbaar bij het Bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '45'
    text: |-
      Een aanvraag tot het verlenen van een vergunning als bedoeld in [artikel 21 van de wet][ref1] wordt eerst in
      behandeling genomen nadat de ingevolge [artikel 110][ref2] verschuldigde bedragen zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel110
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0019277
        artikel: '110'
        hoofdstuk: X
        paragraaf: '4'
  - number: '46'
    text: |-
      1 Alvorens een vergunning als bedoeld in [artikel 21 van de wet][ref1] wordt verleend of gewijzigd wordt een
      onderzoek ter plaatse verricht.

      2 In afwijking van het eerste lid wordt geen onderzoek ter plaatse verricht indien het een aanvraag tot wijziging
      van de vergunning als bedoeld in [artikel 21 van de wet][ref2], betreft en deze aanvraag uitsluitend betrekking
      heeft op:

      a. administratieve gegevens, of

      b. het bereiden, verpakken, etiketteren of afleveren van een diergeneesmiddel, indien:

      1°. dat middel dezelfde farmaceutische vorm heeft als een middel waarvoor ingevolge [artikel 21 van de wet][ref3]
      reeds aan de aanvrager een vergunning tot het verrichten van de betreffende handeling of handelingen is verleend,
      en

      2°. de handeling of handelingen met behulp van dezelfde apparatuur en in dezelfde lokaliteiten geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '47'
    text: |-
      Een besluit omtrent de verlening van een vergunning als bedoeld in [artikel 21 van de wet][ref1] wordt genomen
      binnen 12 weken na ontvangst van de betaling, bedoeld in [artikel 111][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel111
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0019277
        artikel: '111'
        hoofdstuk: X
        paragraaf: '4'
  - number: '48'
    text: |-
      1 De inschrijving van een vergunning als bedoeld in [artikel 21 van de wet][ref1] in het vergunningenregister,
      bedoeld in [artikel 27, eerste lid, van de wet][ref2], geschiedt onder vermelding van:

      a. de soort vergunning;

      b. het nummer van de vergunning;

      c. naam en adres van de vergunninghouder;

      d. de diergeneesmiddelen of de soorten diergeneesmiddelen waarop de vergunning betrekking heeft.

      2 Van de inschrijving, doorhaling of wijziging van de inschrijving in het vergunningenregister wordt mededeling
      gedaan in de Staatscourant.

      3 Het vergunningenregister berust bij het Bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel27
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '27'
  - number: '49'
    text: |-
      Bij een houder van een vergunning tot het bereiden, verpakken of etiketteren van diergeneesmiddelen als
      bedoeld in [artikel 21 van de wet][ref1] wordt ten minste om de drie jaar een inspectie, als bedoeld in
      [artikel 25, derde lid, van de wet][ref2] uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel25
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '25'
  - number: '50'
    text: |-
      1 De eisen, bedoeld in [artikel 26 van het besluit][ref1] voor het bereiden, verpakken en etiketteren van een
      diergeneesmiddel, zijn de eisen, gesteld in de [artikelen 51 tot en met 56][ref2] van deze regeling, de artikelen
      6 tot en met 14 van richtlijn nr. 91/412/EEG, alsmede de door de Commissie van de Europese Gemeenschappen
      geformuleerde gedetailleerde richtsnoeren, bedoeld in artikel 51 van richtlijn nr. 2001/82/EG.

      2 Voor de toepassing van het eerste lid wordt aangewezen als bevoegde instantie als bedoeld in artikel 13 van
      [richtlijn nr. 91/412/EEG](31991L0412): de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel51
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0019277
        artikel: '51'
        hoofdstuk: III
        paragraaf: '3'
  - number: '51'
    text: |-
      1 De houder van een vergunning als bedoeld in [artikel 21 van de wet][ref1], voor het bereiden, verpakken of
      etiketteren van een diergeneesmiddel beschikt over ten minste één met betrekking tot de bedrijfsuitoefening
      deskundige persoon, die:

      a. in het bezit is van een diploma, certificaat of ander bewijsstuk ter afsluiting van een hoger-onderwijsopleiding
      behaald dan wel erkend in een lidstaat van de Europese Gemeenschappen of van een opleiding die door de minister
      als gelijkwaardig wordt erkend, die ten minste vier jaar theoretisch en praktisch onderwijs omvat in farmacie,
      geneeskunde, diergeneeskunde, scheikunde, farmaceutische scheikunde en technologie of biologie, welke opleiding ten
      minste de basisvakken, bedoeld in [bijlage II][ref2] omvat, en

      b. over een praktijkervaring beschikt met betrekking tot het uitvoeren van de controle vóór, tijdens en ná het
      bereidingsproces, van twee jaar bij een nominale opleidingsduur van vier jaar, één jaar bij een opleidingsduur van
      vijf jaar en een half jaar bij een opleidingsduur van ten minste zes jaar.

      2 Het eerste lid is niet van toepassing indien de fabrikant zelf voldoet aan de vereisten gesteld aan de persoon,
      bedoeld in het eerste lid.

      3 Personen, van wie ten genoegen van de minister is aangetoond dat zij vóór 1 oktober 1986 verantwoordelijk waren
      voor de controle, bedoeld in het eerste lid, doch die niet een van de opleidingen, bedoeld in het eerste lid,
      hebben voltooid, worden voor de toepassing van dit besluit gelijkgesteld met personen die opleidingen als bedoeld
      in het eerste lid hebben voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0019277
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0019277
  - number: '52'
    text: |-
      De houder van een vergunning als bedoeld in [artikel 21, eerste lid, van de wet][ref1] is verplicht om:

      a. de persoon, bedoeld in [artikel 51][ref2], te allen tijde de gelegenheid te geven om te onderzoeken of:

      1°. elke partij diergeneesmiddelen voldoet aan de regels, bedoeld in de artikelen 10 en 11 van [richtlijn nr.
      91/412/EEG](31991L0412), de [artikelen 53][ref3], [54][ref4] en [55][ref5] alsmede aan de in voorkomend geval in de
      vergunning, bedoeld in [artikel 21 van de wet][ref6], gestelde voorschriften;

      2°. de volgens de gedetailleerde richtsnoeren, bedoeld in artikel 51 van [richtlijn nr. 2001/82/EG]
      (32001L0082),vereiste documenten of protocollen aanwezig zijn.

      b. het Bureau onverwijld in kennis te stellen van het feit dat de persoon, bedoeld in [artikel 51][ref7], zijn
      controlewerkzaamheden niet langer uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0019277#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0019277#Artikel54
      [ref5]: https://wetten.overheid.nl/BWBR0019277#Artikel55
      [ref6]: https://wetten.overheid.nl/BWBR0003818#Artikel21
