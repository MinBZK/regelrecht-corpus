      Als substanties als bedoeld in [artikel 44 van de wet][ref1] worden aangewezen:

      a. stilbenen, stilbeenderivaten, zouten en de esters daarvan;

      b. somatotropines;

      c. substanties die kunnen worden gebruikt voor de bereiding van diergeneesmiddelen welke zijn aangewezen ingevolge
      [artikel 29 van de wet][ref2];

      d. substanties die niet zijn opgenomen in bijlage I, II of III bij verordening (EEG) nr. 2377/90;

      e. entstoffen voor honden en katten die een niet-geïnactiveerd hondsdolheidvirus bevatten;

      f. substanties met thyreostatische, oestrogene, androgene of gestagene werking;

      g. β-agonisten.


