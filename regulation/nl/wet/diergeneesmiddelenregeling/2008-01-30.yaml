articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. besluit: [Diergeneesmiddelenbesluit][ref1];

      b. minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      c. Bureau: Agentschap ten behoeve van het College ter beoordeling van geneesmiddelen, bedoeld in
      [artikel 29 van de Wet op de Geneesmiddelenvoorziening][ref2], Bureau diergeneesmiddelen;

      d. Commissie: Commissie registratie diergeneesmiddelen, bedoeld in [artikel 2][ref3];

      e. richtlijn nr. nr. 91/412/EEG: [richtlijn nr. 91/412/EEG](31991L0412) van de Commissie van de Europese
      Gemeenschappen van 23 juli 1991 tot vastlegging van beginselen en richtsnoeren inzake goede praktijken bij het
      vervaardigen van geneesmiddelen voor diergeneeskundig gebruik (PbEG L 228);

      f. antimicrobiële diergeneesmiddelen: diergeneesmiddelen, niet zijnde sera of entstoffen, die substanties bevatten
      die al dan niet na omzetting, in staat zijn in een dier de vermeerdering van micro-organismen of virussen te
      verhinderen bij een concentratie van 10 microgram/ml of lager, of die in staat zijn de groei van een cultuur van
      micro-organismen of virussen tegen te gaan bij een concentratie van 5 microgram/ml of lager;

      g. resistentie-inducerende diergeneesmiddelen: diergeneesmiddelen die een blijvende resistentie kunnen induceren
      bij voordien voor dat diergeneesmiddel gevoelige pathogene micro-organismen, virussen, inwendige parasieten of
      uitwendige parasieten;

      h. hormoonpreparaten: diergeneesmiddelen die geheel of gedeeltelijk bestaan uit één of meer substanties die al dan
      niet na omzetting in het lichaam in een dier een fysiologisch gelijksoortige of tegengestelde werking uitoefenen
      als een of meer natuurlijke hormonen of die bestemd zijn om de werking van hormonen of endocriene organen
      rechtstreeks te beïnvloeden;

      i. partijprotocol: document opgesteld door de bereider ter zake van een bepaalde partij van een diergeneesmiddel
      waarop het verloop en de technische en wetenschappelijke resultaten van de bij de registratie voorgeschreven
      controles zijn vermeld of, indien het product is ingevoerd uit een land niet behorend tot een der lidstaten van
      de Europese Gemeenschap, het verloop en de technische en wetenschappelijke resultaten van de controles, bedoeld in
      [artikel 43 van het besluit][ref4];

      j. partijvrijgifte-document: document opgesteld door de bereider ter zake van een bepaalde partij van een
      diergeneesmiddel waarop zijn vermeld de naam en het registratienummer van het middel, het nummer van de
      desbetreffende partij, de partijgrootte alsmede een verklaring van de voor controle verantwoordelijke persoon dat
      de partij aan de gestelde eisen aangaande productie en controle voldoet;

      k. partijvrijgiftecertificaat: document afgegeven door het Bureau op grond waarvan de desbetreffende partij in de
      handel mag worden gebracht;

      l. experimentele keuring: een zuiverheids- en onschadelijkheidstest met betrekking tot een bepaalde partij van een
      voor het eerst in de handel gebracht serum, entstof of biologisch diagnosticum;

      m. [verordening (EG) nr. 1084/2003](32003R1084): Verordening EG) nr. 1084/2003 van de Commissie van de Europese
      Gemeenschappen van 3 juni 2003 betreffende het onderzoek van wijzigingen in de voorwaarden van een door een
      bevoegde instantie van een lidstaat verleende vergunning voor het in de handel brengen van geneesmiddelen voor
      menselijk gebruik en geneesmiddelen voor diergeneeskundig gebruik (Pb EU L 159);

      n. kleine wijziging van de eerste categorie: wijziging van een registratie die in bijlage I bij [verordening (EG)
      nr. 1084/2003](32003R1084) als type IA wordt aangeduid;

      o. kleine wijziging van de tweede categorie: wijziging van een registratie die in bijlage I bij [verordening (EG)
      nr. 1084/2003](32003R1084) als type IB wordt aangeduid;

      p. ingrijpende wijziging: wijziging van een registratie die niet kan worden beschouwd als een kleine wijziging van
      de eerste of tweede categorie of als een wijziging of uitbreiding als bedoeld in bijlage II bij [verordening (EG)
      nr. 1084/2003](32003R1084);

      q. lidstaat: lidstaat van de Europese Unie of andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte;

      r. richtlijn nr. 96/22/EG: richtlijn nr. 96/22/EG van de Raad van de Europese Unie van 29 april 1996 betreffende
      het verbod op het gebruik, in de veehouderij, van bepaalde stoffen met hormonale werking en van bepaalde stoffen
      met thyreostatische werking, alsmede van bèta-agonisten en tot intrekking van de richtlijnen 81/602/EEG, 88/146/EEG
      en 88/299/EEG (PbEG L 125);

      s. richtlijn nr. 2006/130/EG: richtlijn nr. 2006/130/EG van de Commissie van de Europese Gemeenschappen van
      11 december 2006 tot uitvoering van Richtlijn nr. 2001/82/EG van het Europees Parlement en de Raad, wat betreft
      de vaststelling van criteria voor de vrijstelling van het vereiste van een voorschrift van een dierenarts voor
      het verstrekken van bepaalde geneesmiddelen voor diergeneeskundig gebruik ten behoeve van voor de productie van
      levensmiddelen bestemde dieren (PbEG L349/15);

      t. verordening (EG) nr. 1950/2006: verordening (EG) nr. 1950/2006 van de Commissie van de Europese Gemeenschappen
      van 13 december 2006 tot vaststelling, overeenkomstig Richtlijn 2001/82/EG van het Europees Parlement en de Raad
      tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig gebruik van een
      lijst van stoffen die essentieel zijn voor de behandeling van paardachtigen (PbEG L367);

      u. beschikking nr. 93/623/EEG: beschikking nr. 93/623/EEG van de Commissie van 20 oktober 1993 tot
      vaststelling van het identificatiedocument (paspoort) dat geregistreerde paardachtigen moet vergezellen,
      zoals gewijzigd bij beschikking nr. 2000/68/EEG van de Commissie van 22 december 1999 tot vaststelling van de
      identificatievoorschriften voor als fok- en gebruiksdier gehouden paardachtigen (PbEG L298).

      2 Deze regeling berust mede op [artikel 42a, tweede lid, van het Diergeneesmiddelenbesluit][ref5].


