    text: |-
      De kosten van het onderzoek, bedoeld in [artikel 3, tweede lid, onderdeel b, van de wet][ref1], bedragen ingeval
      het diergeneesmiddel is bedoeld om uitsluitend te worden toegepast bij andere dan voedselproducerende dieren:

      a. €  10.839 voor een aanvraag als bedoeld in [Hoofdstuk II, paragraaf 2][ref2], indien aan elk van de volgende
      voorwaarden is voldaan:

      1°. [artikel 4, zesde lid, van het besluit][ref3] en [artikel 6, onderdeel a][ref4], zijn niet van toepassing;

      2°. de registratie niet plaatsvindt overeenkomstig artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082);

      b. € 18.343 voor een aanvraag als bedoeld in [Hoofdstuk II, paragraaf 2][ref5], indien aan elk van de volgende
      voorwaarden is voldaan:

      1°. [artikel 4, zesde lid, van het besluit][ref6] en [artikel 6, onderdeel a][ref7], zijn niet van toepassing;

      2°. de registratie plaatsvindt overeenkomstig artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082), waarbij
      Nederland referentielidstaat is;

      c. € 4.169 voor een aanvraag als bedoeld in [Hoofdstuk II, paragraaf 2][ref8], indien aan elk van de volgende
      voorwaarden is voldaan:

      1°. [artikel 4, zesde lid, van het besluit][ref9] en [artikel 6, onderdeel a][ref10], zijn van toepassing;

      2°. de registratie niet plaatsvindt overeenkomstig artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082);

      d. € 6.670 voor een aanvraag als bedoeld in [Hoofdstuk II, paragraaf 2][ref11], indien aan elk van de volgende
      voorwaarden is voldaan:

      1°. [artikel 4, zesde lid, van het besluit][ref12] en [artikel 6, onderdeel a][ref13], zijn van toepassing;

      2°. de registratie plaatsvindt overeenkomstig artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082), waarbij
      Nederland referentielidstaat is;

      e. € 4.169 voor een aanvraag als bedoeld in [artikel 9][ref14];

      f. € 1.668 voor een aanvraag als bedoeld in [artikel 10][ref15];

      g. € 8.338 voor een aanvraag als bedoeld in [artikel 11][ref16] indien de aanvraag die aan de in Nederland
      verleende registratie, bedoeld in artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082) is voorafgegaan aan elk van
      de volgende voorwaarden voldoet:

      1°. [artikel 4, zesde lid, van het besluit][ref17] en [artikel 6, onderdeel a][ref18], was niet van toepassing;

      2°. uit de aanvraag blijkt niet dat de registratie mede plaatsvindt overeenkomstig artikel 32 van [richtlijn nr.
      2001/82/EG](32001L0082);

      h. € 2.875 voor een aanvraag als bedoeld in artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082), indien de
      aanvraag die aan de in Nederland verleende registratie, bedoeld in artikel 32 van [richtlijn nr. 2001/82/EG]
      (32001L0082) is voorafgegaan aan elk van de volgende voorwaarden voldoet:

      1°. [artikel 4, zesde lid, van het besluit][ref19] en [artikel 6, onderdeel a][ref20], was van toepassing;

      2°. uit de aanvraag blijkt niet dat de registratie mede plaatsvindt overeenkomstig artikel 32 van [richtlijn nr.
      2001/82/EG](32001L0082);

      i. € 8.338 voor een aanvraag als bedoeld in artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082) indien
      [artikel 4, zesde lid, van het besluit][ref21] en [artikel 6, onderdeel a][ref22], niet van toepassing is, waarbij
      Nederland geen referentielidstaat is;

      j. € 3.335 voor een aanvraag als bedoeld in artikel 32 van richtlijn nr. 2001/82/EG, indien
      [artikel 4, zesde lid, van het besluit][ref23] en [artikel 6, onderdeel a][ref24], van toepassing zijn, waarbij
      Nederland geen referentielidstaat is;

      k. € 1.668 voor een aanvraag tot een kleine wijziging van de tweede categorie;

      l. € 8.338 voor een aanvraag tot een ingrijpende wijziging.

      m. € 4.169 voor een aanvraag als bedoeld in [artikel 14][ref25].


