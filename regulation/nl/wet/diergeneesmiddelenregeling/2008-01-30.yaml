  - number: '22'
    text: |-
      1 Op een aanvraag tot een ingrijpende wijziging zijn de [paragrafen 2][ref1] en [3][ref2] van overeenkomstige
      toepassing, met dien verstande dat een besluit omtrent de wijziging binnen de volgende termijn wordt genomen:

      a. 90 dagen nadat door het Bureau de ontvangst van de aanvraag is bevestigd aan de aanvrager, ingeval de wijziging
      betrekking heeft op de voedselproducerende diersoorten dan wel op de therapeutische indicaties waarbij het
      diergeneesmiddel kan worden toegepast;

      b. 60 dagen nadat door het Bureau de ontvangst van een aanvraag daartoe is bevestigd aan de aanvrager in andere
      gevallen.

      2 De aanvraag heeft betrekking op één wijziging.

      3 Indien uit een wijziging andere wijzigingen voortvloeien kan de aanvraag in afwijking van het tweede lid tevens
      op die andere wijzigingen betrekking hebben.

      4 In afwijking van [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref3] kan een aanvrager gedurende
      zes maanden in de gelegenheid worden gesteld om een aanvraag aan te vullen, ingeval niet is voldaan aan de
      eisen, gesteld in de [artikelen 16][ref4] en [17][ref5], of de bij de aanvraag verstrekte gegevens en bescheiden
      onvoldoende zijn voor de beoordeling van de aanvraag of voor de voorbereiding van het besluit.

      5 Indien een aanvrager in een gelegenheid als bedoeld in het vierde lid wordt gesteld, wordt een besluit in
      afwijking van het eerste lid genomen binnen 210 dagen nadat door het Bureau de ontvangst van aanvullingen op de
      aanvraag is bevestigd.


