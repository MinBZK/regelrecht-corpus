    text: |-
      Als instellingen als bedoeld in [artikel 57, eerste lid, van de wet][ref1] worden aangewezen:

      a. DLO-Kwaliteitsinstituut voor land- en tuinbouwproducten;

      b. Laboratorium Voedsel en Warenautoriteit regio Oost;

      c. Rijksinstituut voor volksgezondheid en milieu;

      d. Centraal Instituut voor DierziekteControle Lelystad;

      e. TNO Voeding;

      f. laboratorium van de gezondheidsdienst voor dieren B.V..


