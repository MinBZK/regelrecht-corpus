  - number: '96'
    text: |-
      1 Dierenartsen en personen als bedoeld in [artikel 30, tweede lid, onderdeel f, van de wet][ref1] zijn verplicht
      onmiddellijk na toepassing van diergeneesmiddelen als bedoeld in [artikel 29, eerste lid, van de wet][ref2] of van
      diergeneesmiddelen waarvoor een wachttermijn geldt aan de houder van dieren op wiens dieren die diergeneesmiddelen
      zijn toegepast schriftelijke mededeling te doen van:

      a. naam van het diergeneesmiddel;

      b. datum van toediening;

      c. gebruikte hoeveelheid;

      d. soort en het aantal dieren waarop die diergeneesmiddelen zijn toegepast;

      e. in voorkomend geval de in acht te nemen wachttermijn.

      2

      3 Het bepaalde in het eerste en tweede lid is van overeenkomstige toepassing op het
      toepassen van diergeneesmiddelen door een dierenarts van diergeneesmiddelen welke ingevolge
      [artikel 2, tweede lid, onderdeel a, van de wet][ref3] zijn bereid.

      4 In afwijking van het bepaalde in het eerste lid, aanhef en onder d, bevat de mededeling, bedoeld in het eerste
      lid, een identificatie van het behandelde dier of de kleinst mogelijke eenheid behandelde dieren indien een
      diergeneesmiddel als bedoeld in [artikel 28][ref4] is toegediend. De mededeling omvat in dat geval tevens het doel
      van de behandeling en de wijze van toediening van het diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0019277#Artikel28
