  - number: 95c
    text: |-
      In het recept is de hoeveelheid af te leveren diergeneesmiddelen beperkt tot hetgeen noodzakelijk is om de beoogde
      behandeling of therapie uit te kunnen voeren:

      a. in een periode van maximaal één maand, of

      b. ingeval het diergeneesmiddelen als bedoeld in [artikel 77a, eerste lid, onderdelen a tot en met d][ref1],
      betreft, in een periode van maximaal één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel77a
