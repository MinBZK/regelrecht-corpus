  - number: '95'
    text: |-
      1 Het recept voor de aflevering van gemedicineerd voeder aan houders van dieren, bedoeld in [artikel 83a][ref1]
      wordt vastgesteld overeenkomstig bijlage A bij [richtlijn nr. 90/167/EEG](31990L0167) en bestaat uit een origineel
      en drie afschriften.

      2 Het origineel en één afschrift van het recept zijn bestemd voor de bereider van het voorgeschreven gemedicineerde
      voeder.

      3 De overige twee afschriften van het recept zijn bestemd voor de dierenarts en voor de houder van de dieren.

      4 De bereider, bedoeld in het tweede lid, overlegt het afschrift, bedoeld in het tweede lid, aan de houder van de
      dieren bij de aflevering van het voorgeschreven gemedicineerde voeder.

      5 Een recept geeft slechts recht op een eenmalige behandeling met het voorgeschreven gemedicineerde voeder binnen
      een termijn van 3 maanden na dagtekening van het recept.

      6 De houder van de dieren bewaart de afschriften, bedoeld in het derde en vierde lid, gedurende 5 jaar bij het
      logboek, bedoeld in [artikel 91][ref2].

      7 De bereider van het voorgeschreven gemedicineerde voeder en de dierenarts bewaren het recept onderscheidenlijk
      het afschrift en het recept gedurende 5 jaar bij de administratie, bedoeld in [artikel 87][ref3] onderscheidenlijk
      [artikel 89][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel83a
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel91
