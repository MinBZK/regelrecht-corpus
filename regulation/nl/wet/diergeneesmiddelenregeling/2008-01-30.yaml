  - number: '24'
    text: |-
      Het Bureau kan schriftelijk worden verzocht om werkzaamheden te verrichten ten behoeve van een goede uitvoering van
      het onderzoek, bedoeld in [artikel 3, tweede lid, onderdeel b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel3
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel24
