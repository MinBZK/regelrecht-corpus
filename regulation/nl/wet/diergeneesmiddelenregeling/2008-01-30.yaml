        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '9'
    text: |-
      In afwijking van [artikel 5, derde lid][ref1], behoeft het dossier van een aanvraag tot registratie van een
      homeopathisch diergeneesmiddel geen resultaten van onschadelijkheidsproeven, preklinische en klinische proeven,
      als bedoeld in artikel 12, derde lid, onderdeel j, van [richtlijn nr. 2001/82/EG](32001L0082) te bevatten indien de
      aanvrager kan aantonen dat:

      a. de aanvraag een homeopathisch diergeneesmiddel betreft, dat is bestemd voor gezelschapsdieren of exotische
      diersoorten waarvan het vlees of de producten niet voor menselijke consumptie worden gebruikt, en

      b. door middel van een gedetailleerde wetenschappelijke documentatie afgestemd op de homeopathische veterinaire
      geneeskunde, dat de doeltreffendheid ervan vaststaat en het veiligheidsniveau aanvaardbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel5
