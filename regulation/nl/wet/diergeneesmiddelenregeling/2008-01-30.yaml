  - number: '94'
    text: |-
      1 Onverminderd [artikel 87][ref1] vermelden dierenartsen na het toepassen van een middel bij een voedselproducerend
      dier ingevolge [artikel 22 van het besluit][ref2] in hun administratie:

      a. naam en voor zover aanwezig het registratienummer van het middel;

      b. diersoort;

      c. aantal behandelde dieren;

      d. naam en adres van de houder van het dier;

      e. indicatie waarvoor het middel wordt toegepast;

      f. gebruikte hoeveelheid;

      g. dosering;

      h. duur van de behandeling;

      i. datum waarop het dier onderzocht is;

      j. datum waarop het middel is toegepast;

      k. aanbevolen wachttermijn;

      l. diergeneeskundige motivatie voor de toepassing van het middel.

      2 De administratie en de bescheiden die verband houden met de aantekeningen in de administratie worden vijf jaar
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel22
