    text: |-
      1 De aanvraag tot verlenging van een registratie wordt ten minste 6 maanden voor het verstrijken van de termijn
      waarvoor de registratie geldt, ingediend bij het Bureau.

      2 Op een aanvraag tot verlenging van een registratie zijn [paragraaf 2][ref1] en [artikel 13][ref2] van
      overeenkomstige toepassing.


