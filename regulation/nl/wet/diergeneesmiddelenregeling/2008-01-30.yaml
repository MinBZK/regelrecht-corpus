  - number: '101'
    text: |-
      1 Voor door het Bureau op grond van deze regeling verzonden nota’s geldt een betalingstermijn van twee weken,
      gerekend vanaf de datering van de nota’s.

      2 Indien twee weken na de datering van de in het eerste lid bedoelde nota het verschuldigde niet is voldaan, kan
      ten aanzien van de schuldenaar worden bepaald, zolang het verschuldigde niet is voldaan, dat het verrichten van
      werkzaamheden of het leveren van materialen slechts kan geschieden indien een door de minister goed te keuren
      bankinstelling zich voor twee jaar borg stelt voor de uit dien hoofde verschuldigde bedragen.

      3 Voor de bestaande vorderingen kan worden overgegaan tot gerechtelijke invordering.

      4 Voor zover verschuldigd wordt de omzetbelasting geacht in het tarief te zijn begrepen.
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel101
  - number: '102'
    text: |-
      1 Als kosten als bedoeld in [artikel 79, tweede lid, van het besluit][ref1] worden aangemerkt de kosten van:

      a. het onderzoek naar de redenen voor de aanwezigheid van residuen in de onderzochte monsters op enig bedrijf waar
      de bemonsterde dieren of producten van afkomstig zijn of kunnen zijn;

      b. het nemen van monsters;

      c. de analyse van de genomen monsters;

      d. overige onderzoeken.

      2 De kosten, bedoeld in het eerste lid, worden door de minister in rekening gebracht en zijn, in voorkomend geval,
      opgebouwd uit de volgende componenten:

      a. de laboratoriumkosten;

      b. de met de analyse van de monsters gemoeide verzendkosten;

      c. de administratiekosten;

      d. de verblijfskosten van de bij de werkzaamheden betrokkenen;

      e. de reiskosten van de bij de werkzaamheden betrokkenen;

      f. een bedrag per uur per met de werkzaamheden belaste persoon;

      g. overige kosten die verband houden met de werkzaamheden.

      3 Indien kosten in rekening worden gebracht ingevolge
      [artikel 6, eerste lid, van de Regeling verbod handel met bepaalde stoffen behandelde dieren en producten][ref2]
      kan het in het eerste lid bedoelde bedrag in rekening gebracht worden tezamen met de ingevolge die regeling in
      rekening te brengen kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel79
