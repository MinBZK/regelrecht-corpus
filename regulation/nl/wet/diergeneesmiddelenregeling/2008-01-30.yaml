  - number: '30'
    text: |-
      1 De lijst van homeopathische diergeneesmiddelen, bedoeld in [artikel 20, eerste lid, van het besluit][ref1],
      berust bij en wordt bijgehouden door de minister.

      2 De lijst van homeopathische diergeneesmiddelen, bedoeld in [artikel 20, eerste lid, van het besluit][ref2]
      is de Lijst van homeopathische diergeneesmiddelen 1993, bedoeld in
      [artikel 2, eerste lid, van het Besluit uitzonderingen registratieregime diergeneesmiddelen][ref3], zoals die gold
      voor inwerkingtreding van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel20
