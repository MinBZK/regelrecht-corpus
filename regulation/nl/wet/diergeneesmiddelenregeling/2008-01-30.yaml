  - number: '91'
    text: |-
      1 Het logboek, bedoeld in [artikel 40, tweede lid, van de wet][ref1], wordt overeenkomstig het tweede tot en met
      het vijfde lid bijgehouden.

      2 Bij aankoop wordt het aankoopbewijs van het diergeneesmiddel of het gemedicineerd diervoeder in de administratie
      van de degene die bedrijfsmatig dieren houdt opgenomen, met dien verstande dat in het geval degene die
      bedrijfsmatig dieren houdt het diergeneesmiddel of gemedicineerd diervoeder ontvangen heeft door tussenkomst
      van een dierenarts of personen als bedoeld in [artikel 30, tweede lid, onderdeel f, van de wet][ref2],
      de gegevens als opgenomen in de administratie van de dierenarts of de personen, bedoeld in
      [artikel 30, tweede lid, onderdeel f, van de wet][ref3], worden gelijkgesteld met het logboek.

      3 Het aankoopbewijs dan wel de administratie van de dierenarts of de personen, bedoeld in
      [artikel 30, tweede lid, onderdeel f, van de wet][ref4], bevat de volgende gegevens:

      a. naam van het diergeneesmiddel of de soort gemedicineerd voeder;

      b. naam en het adres van de leverancier;

      c. datum van aflevering;

      d. diersoort waarvoor het middel bestemd is;

      e. hoeveelheid.

      4 Bij toepassing wordt in de administratie van degene die bedrijfsmatig dieren houdt in het geval dat de dierenarts
      toedient een verklaring van de dierenarts en in het geval dat de veehouder zelf toedient een eigen aantekening
      opgenomen. De verklaring dan wel de aantekening bevat de volgende gegevens:

      a. naam van het diergeneesmiddel;

      b. gebruikte hoeveelheid;

      c. datum van toediening;

      d. identificatie van de behandelde dieren;

      e. einde van de wachttermijn.

      5 Bij verlies van diergeneesmiddelen of gemedicineerd voeder op andere wijze dan door toediening neemt de veehouder
      een aantekening in de administratie op. De bovengenoemde aantekening bevat de volgende gegevens:

      a. naam van het diergeneesmiddel;

      b. verloren gegane hoeveelheid;

      c. datum;

      d. wijze van verloren gaan.

      6 Het logboek dan wel in voorkomend geval de schriftelijke verklaring, bedoeld in de
      [artikelen 96, tweede lid][ref5], en [97][ref6], worden gedurende vijf jaar na de daarin laatst opgenomen
      vermeldingen bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel40
