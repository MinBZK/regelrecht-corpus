  - number: '97'
    text: |-
      1 Bij de aflevering of het voorschrijven van diergeneesmiddelen als bedoeld in
      [artikel 29, eerste lid, van de wet][ref1] en van diergeneesmiddelen waarvoor een wachttermijn geldt, en van
      diergeneesmiddelen die zijn bereid overeenkomstig [artikel 2, tweede lid, onderdeel a, van de wet][ref2], alsmede
      bij het voorschrijven van het vervoederen van gemedicineerde voeders, voor zover daarin althans diergeneesmiddelen
      als bedoeld in [artikel 29 van de wet][ref3] dan wel diergeneesmiddelen waarvoor een wachttermijn geldt, voorkomen,
      is de dierenarts verplicht degene die bedrijfsmatig dieren houdt opgave te doen van:

      a. naam en de hoeveelheid van het afgeleverde diergeneesmiddel, onderscheidenlijk het voorgeschreven gemedicineerde
      voeder, alsmede het tijdstip waarop het werd verstrekt onderscheidenlijk werd voorgeschreven en,

      b. in voorkomend geval de in acht te nemen wachttermijn.

      2 Indien een diergeneesmiddel als bedoeld in [artikel 28][ref4] wordt afgeleverd of voorgeschreven, bevat de
      verklaring, bedoeld in het eerste lid, een identificatie van het te behandelen dier of de kleinst mogelijke eenheid
      te behandelen dieren. In de verklaring wordt tevens het doel van de behandeling en de wijze van toediening van het
      diergeneesmiddel vermeld. De verklaring wordt schriftelijk verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel29
