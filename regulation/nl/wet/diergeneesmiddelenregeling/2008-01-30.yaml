      in artikel 4 van [verordening (EG) nr. 1084/2003](32003R1084), gehandeld bij wijziging van een registratie die via
      de procedure, bedoeld in artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082), in Nederland is verleend of in een
      volgende lidstaat is erkend.

      2 Voor de toepassing van het eerste lid wordt aangewezen:

      a. als bevoegde instantie als bedoeld in artikel 4, eerste lid, aanhef, van de verordening: het Bureau;

      b. als bevoegde instantie als bedoeld in artikel 4, vijfde lid, van de verordening: de minister;

      c. als toepasselijk nationale voorschrift als bedoeld in artikel 4, eerste lid, onderdeel c, van de verordening:
      [artikel 105, onderdelen j en k][ref4] en [artikel 106, onderdelen j en k][ref5].


