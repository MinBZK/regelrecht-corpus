        artikel: '67'
        hoofdstuk: III
        paragraaf: '8'
  - number: '69'
    text: |-
      1 In afwijking van het bepaalde in de [artikelen 62][ref1], [63][ref2], [67][ref3] en [68][ref4] is het
      toegestaan niet alle informatie, bedoeld in die artikelen, op de primaire verpakking en in voorkomend geval op de
      buitenverpakking te vermelden, indien aan de volgende voorwaarden is voldaan:

      a. de buitenverpakking is aanwezig;

      b. in de buitenverpakking, bedoeld in onderdeel a, bevindt zich een bijsluiter, met dien verstande dat de gegevens,
      bedoeld in het tweede lid, te allen tijde op de primaire verpakking en in voorkomend geval op de buitenverpakking
      voorkomen.

      2 De gegevens, bedoeld in het eerste lid, zijn:

      a. de vermelding ‘diergeneesmiddel’ of ‘geneesmiddel voor diergeneeskundig gebruik’ en de naam van het
      diergeneesmiddel;

      b. de kwalitatieve en kwantitatieve samenstelling aan werkzame bestanddelen;

      c. de wijze van toediening;

      d. indien het een geregistreerd diergeneesmiddel betreft het nummer waaronder de registratie is verleend
      voorafgegaan door de letters: Reg. NL en in voorkomend geval Reg. NL H;

      e. het nummer van de partij;

      f. de uiterste gebruiksdatum.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0019277#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0019277#Artikel68
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel69
