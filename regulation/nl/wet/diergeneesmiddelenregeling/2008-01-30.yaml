  - number: '16'
    text: |-
      1 Een aanvraag tot een kleine wijziging van de eerste of tweede categorie wordt ingediend bij het Bureau onder
      overlegging van de documenten die betrekking hebben op die wijziging.

      2 De aanvraag heeft betrekking op één wijziging.

      3 Indien uit een wijziging andere wijzigingen voortvloeien kan de aanvraag in afwijking van het tweede lid tevens
      op die andere wijzigingen betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel16
  - number: '17'
    text: |-
      Een kleine wijziging van de eerste of tweede categorie voldoet aan de voorwaarden, gesteld in bijlage I bij
      [verordening (EG) nr. 1084/2003](32003R1084).
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel17
  - number: '18'
    text: |-
      1 Een besluit omtrent een kleine wijziging van de eerste categorie wordt binnen 14 dagen na ontvangst van de
      aanvraag genomen.

      2 Indien het Bureau niet voldoet aan het eerste lid, wordt de registratie van rechtswege gewijzigd overeenkomstig
      de aanvraag bedoeld in [artikel 16][ref1].


