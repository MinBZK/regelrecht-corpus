  - number: '89'
    text: |-
      1 De administratie, bedoeld in [artikel 86, eerste lid][ref1], van houders van vergunningen als bedoeld in
      [artikel 33 van de wet][ref2] is voor wat betreft gemedicineerde voeders zodanig ingericht, dat daaruit te allen
      tijde op eenvoudige wijze met betrekking tot elke transactie en elke zelfstandigheid kan worden afgeleid:

      a. aard en hoeveelheid van de bereide en afgeleverde gemedicineerde voeders;

      b. aard en hoeveelheid van de gemedicineerde voeders die op het bedrijf voorhanden zijn;

      c. aard en hoeveelheid van de diervoeders, de voormengsels met medicinale werking en de halffabrikaten met
      medicinale werking die bij de bereiding van gemedicineerde voeders zijn gebruikt;

      d. naam en adres van de ontvanger, en

      e. naam en adres van de dierenarts door wie het recept voor het gemedicineerd voeder werd uitgeschreven.

      2 In de administratie worden de gegevens voor elk voormengsel met medicinale werking, voor elk halffabrikaat met
      medicinale werking en voor elk gemedicineerd voeder afzonderlijk vermeld.

      3 De administratie en de bescheiden die verband houden met de aantekeningen in de administratie worden gedurende
      vijf jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel33
