      1 Als diergeneesmiddelen als bedoeld in [artikel 40, tweede lid, van de wet][ref1] worden aangewezen:

      a. diergeneesmiddelen als bedoeld in [artikel 29 van de wet][ref2];

      b. diergeneesmiddelen waarvoor een wachttermijn geldt;

      c. gemedicineerde voeders als bedoeld in [artikel 97][ref3];

      d. diergeneesmiddelen, die zijn bereid overeenkomstig [artikel 2, tweede lid, onderdeel a, van de wet][ref4].

      2 Met betrekking tot de diergeneesmiddelen, bedoeld in het eerste lid, worden binnen 24 uur de in
      [artikel 91][ref5] voorgeschreven gegevens in het logboek te worden vermeld.


