  - number: '66'
    text: |-
      Op de primaire verpakking en, in voorkomend geval, op de buitenverpakking van diergeneesmiddelen waarop
      [hoofdstuk IV van de wet][ref1] van toepassing is, wordt onverminderd het bepaalde in [artikel 62][ref2] of
      [67][ref3] vermeld:

      a. wanneer het diergeneesmiddel niet krachtens [artikel 30, vierde lid, van de wet][ref4] is aangewezen:
      ‘uitsluitend aflevering door de dierenarts of op recept van de dierenarts door de apotheker’, dan wel ‘U.D.A.’ of,
      in voorkomend geval, uitsluitend op recept afleveren, dan wel ‘U.R.A.’;

      b. wanneer het diergeneesmiddel krachtens [artikel 30, vierde lid, van de wet][ref5] is aangewezen: ‘uitsluitend
      aflevering en toepassing door de dierenarts’, dan wel: ‘U.D.D.’.


