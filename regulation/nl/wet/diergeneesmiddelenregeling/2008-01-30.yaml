  - number: '70'
    text: |-
      1 In de verpakking van een diergeneesmiddel is een bijsluiter opgenomen, tenzij alle krachtens [artikel 71][ref1]
      vereiste informatie op de primaire verpakking en de buitenverpakking wordt vermeld.

      2 De bijsluiter heeft betrekking op het betrokken diergeneesmiddel.

      3 Andere vermeldingen betreffende het diergeneesmiddel dienen duidelijk van vorenbedoelde gegevens gescheiden te
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel71
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '71'
        hoofdstuk: III
        paragraaf: '8'
  - number: '71'
    text: |-
      De bijsluiter vermeldt ten minste de volgende gegevens overeenkomstig de bij de registratie gegeven voorschriften:

      a. de naam van het diergeneesmiddel, onmiddellijk gevolgd door de concentratie en de farmaceutische vorm, met dien
      verstande dat in het geval het diergeneesmiddel slechts één werkzaam bestanddeel bevat en voor dat diergeneesmiddel
      een fantasienaam wordt gebruikt, die fantasienaam duidelijk leesbaar vergezeld dient te gaan van de naam van het
      werkzame bestanddeel;

      b. de naam of handelsnaam en de woonplaats of plaats van vestiging van de registratiehouder alsmede, indien deze
      niet tevens registratiehouder is, de naam, handelsnaam of het merk van de houder van een vergunning als bedoeld in
      [artikel 21, eerste lid, van de wet][ref1] voor het bereiden van een diergeneesmiddel en, in voorkomend geval van
      de door de registratiehouder aangewezen vertegenwoordiger;

      c. de diersoort of diersoorten waarvoor de dosering of doseringen waarin en de wijze of wijzen waarop het betrokken
      diergeneesmiddel uitsluitend mag worden gebruikt;

      d. de wachttermijn;

      e. in voorkomend geval de aanbevelingen omtrent de wijze van bewaring en zo nodig aan wijzingen omtrent te
      nemen voorzorgsmaatregelen bij het zich ontdoen van niet gebruikte diergeneesmiddelen en daarvan afkomstige
      afvalproducten;

      f. therapeutische indicaties;

      g. contra-indicaties en bijwerkingen voor zover deze informatie noodzakelijk is voor het gebruik van het
      diergeneesmiddel;

      h. de veiligheidsmaatregelen en bijzondere waarschuwingen voor de gebruiker;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '72'
    text: |-
      1 Alle ingevolge de [artikelen 62 tot en met 71][ref1] voorgeschreven vermeldingen dienen te zijn gesteld in de
      Nederlandse taal in goed leesbaar en onuitwisbaar schrift en in begrijpelijke bewoordingen.

      2 Indien de bijsluiter in verschillende talen is opgesteld, is de informatie in alle gebruikte talen gelijk.

      3 Andere dan de ingevolge de [artikelen 62][ref2] en [66 tot en met 72][ref3] voorgeschreven vermeldingen mogen op,
      aan of bij de verpakking of op het begeleidend document slechts voorkomen voor zover zij niet met de voorgeschreven
      vermeldingen in strijd zijn en voor zover zij niet misleidend zijn ten aanzien van aard, samenstelling,
      eigenschappen en toepassingswijze van het diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0019277#Artikel66
