  - number: '105'
    text: |-
      De kosten van het onderzoek, bedoeld in [artikel 3, tweede lid, onderdeel b, van de wet][ref1], bedragen ingeval
      het diergeneesmiddel is bedoeld om mede of uitsluitend te worden toegepast bij voedselproducerende dieren:

      a. € 16.675 voor een aanvraag als bedoeld in [Hoofdstuk II, paragraaf 2][ref2] indien aan elk van de volgende
      voorwaarden is voldaan:

      1°. [artikel 4, zesde lid, van het besluit][ref3] en [artikel 6, onderdeel a][ref4], zijn niet van toepassing;

      2°. de registratie niet plaatsvindt overeenkomstig artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082);

      b. € 26.680 voor een aanvraag als bedoeld in [Hoofdstuk 2, paragraaf 2][ref5] indien aan elk van de volgende
      voorwaarden is voldaan:

      1°. [artikel 4, zesde lid, van het besluit][ref6] en [artikel 6, onderdeel a][ref7], zijn niet van toepassing;

      2°. de registratie plaatsvindt overeenkomstig artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082), waarbij
      Nederland referentielidstaat is;

      c. € 4.169 voor een aanvraag als bedoeld in [Hoofdstuk 2, paragraaf 2][ref8], indien aan elk van de volgende
      voorwaarden is voldaan:

      1°. [artikel 4, zesde lid, van het besluit][ref9] en [artikel 6, onderdeel a][ref10], zijn van toepassing;

      2°. de registratie niet plaatsvindt overeenkomstig artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082);

      d. €  6.670 voor een aanvraag als bedoeld in [Hoofdstuk II, paragraaf 2][ref11], indien aan elk van de volgende
      voorwaarden is voldaan:

      1°. [artikel 4, zesde lid, van het besluit][ref12] en [artikel 6, onderdeel a][ref13], zijn van toepassing;

      2°. de registratie plaatsvindt overeenkomstig artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082), waarbij
      Nederland referentielidstaat is;

      e. €  16.675 voor een aanvraag tot registratie van een homeopathisch diergeneesmiddel, voorzover de registratie
      plaatsvindt overeenkomstig [artikel 10][ref14];

      f. € 10.839 voor een aanvraag als bedoeld in [artikel 11, eerste lid][ref15], indien de aanvraag die aan de in
      Nederland verleende registratie, bedoeld in [artikel 11][ref16] is voorafgegaan aan elk van de volgende voorwaarden
      voldoet:

      1°. [artikel 4, zesde lid, van het besluit][ref17] en [artikel 6, onderdeel a][ref18], waren niet van toepassing;

      2°. uit de aanvraag blijkt niet dat de registratie mede was bestemd om te worden erkend in een volgende lidstaat,
      als bedoeld in [artikel 11][ref19];

      g. € 2.875 voor een aanvraag als bedoeld in [artikel 11][ref20] indien de aanvraag die aan de in Nederland
      verleende registratie, bedoeld in artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082), is voorafgegaan aan elk
      van de volgende voorwaarden voldoet:

      1°. [artikel 4, zesde lid, van het besluit][ref21] en [artikel 6, onderdeel a][ref22], waren van toepassing;

      2°. uit de aanvraag blijkt niet dat de registratie mede was bestemd om te worden erkend in een volgende lidstaat,
      als bedoeld in artikel 32, van [richtlijn nr. 2001/82/EG](32001L0082);

      h. € 13.340 voor een aanvraag als bedoeld in artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082) indien
      [artikel 4, zesde lid, van het besluit][ref23] en [artikel 6, onderdeel a][ref24], niet van toepassing zijn,
      waarbij Nederland geen referentielidstaat is.;

      i. € 3.335 voor een aanvraag als bedoeld in artikel 32 van richtlijn nr. 2001/82/EG, indien
      [artikel 4, zesde lid, van het besluit][ref25] en [artikel 6, onderdeel a][ref26], van toepassing zijn, waarbij
      Nederland geen referentielidstaat is;

      j. € 1.668 voor een aanvraag tot een kleine wijziging van de tweede categorie;

      k. € 8.338 voor een aanvraag tot een ingrijpende wijziging.

      l. € 4.169 voor een aanvraag als bedoeld in [artikel 14][ref27].


