  - number: '53'
    text: |-
      1 De minister kan op schriftelijk verzoek van de belanghebbende toestaan dat één of meer van de verrichtingen,
      bedoeld in artikel 11, tweede lid, van [richtlijn nr. 91/412/EEG](31991L0412), worden uitgevoerd door een extern
      laboratorium als bedoeld in artikel 11, tweede lid, van [richtlijn nr. 91/412/EEG](31991L0412), mits:

      a. wordt voldaan aan het ter zake de uitbesteding in artikel 12 van [richtlijn nr. 91/412/EEG](31991L0412)
      bepaalde, en

      b. een afschrift van de schriftelijke overeenkomst, bedoeld in de aanhef van artikel 12 van [richtlijn nr. 91/412/
      EEG](31991L0412), wordt overgelegd.

      2 Toestemming als bedoeld in het eerste lid is niet vereist, indien één of meer controles of onderzoeken wegens
      tijdelijke bijzondere omstandigheden niet in het eigen bedrijf kunnen worden verricht of indien het externe
      laboratorium voor een dergelijk onderzoek reeds een vergunning heeft ingevolge [artikel 21 van de wet][ref1]. In
      zodanig geval wordt hiervan, onder opgave van redenen en met vermelding van de te verwachten tijdsduur, de naam en
      het adres van het laboratorium waar de controles zullen worden verricht, onverwijld kennis gegeven aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '54'
    text: |-
      Een verzoek tot inschakeling van een extern laboratorium als bedoeld in artikel 11, tweede lid, van [richtlijn nr.
      91/412/EEG](31991L0412):

      a. is met redenen omkleed;

      b. bevat een opgave van de desbetreffende onderzoeken en controles;

      c. bevat de naam en het adres van het laboratorium alsmede een omschrijving van de voor de controles te benutten
      lokaliteiten en uitrusting;

      d. bevat de naam en hoedanigheid van de persoon, bedoeld in [artikel 51][ref1], die voor de uitbestede
      verrichtingen verantwoordelijk is, en

      e. bevat een afschrift van de schriftelijke overeenkomst ter zake de uitbestede verrichtingen, bedoeld in artikel
      12 van [richtlijn nr. 91/412/EEG](31991L0412).


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel51
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel54
