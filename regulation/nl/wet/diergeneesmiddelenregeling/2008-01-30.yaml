  - number: '55'
    text: |-
      De monsters, bedoeld in artikel 11, vierde lid, van [richtlijn nr. 91/412/EEG](31991L0412), zijn zodanig verpakt
      en gemerkt dat zij te allen tijde kunnen worden geïdentificeerd. De verpakking kan niet zonder zichtbare en
      onherstelbare schade worden geopend.
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel55
  - number: '56'
    text: |-
      De bevindingen van zelfinspecties als bedoeld in artikel 14 van [richtlijn nr. 91/412/EEG](31991L0412) alsmede de
      daaruit voortgevloeide maatregelen worden schriftelijk vastgelegd in een document. Dit document wordt gedurende
      vijf jaar bewaard in het documentatiesysteem, bedoeld in artikel 9 van [richtlijn nr. 91/412/EEG](31991L0412).
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel56
  - number: '57'
    text: |-
      De eisen, bedoeld in [artikel 26 van het besluit][ref1] voor het afleveren van een diergeneesmiddel, zijn de eisen,
      gesteld in de [artikelen 58 tot en met 59c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel58
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018901
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0019277
        artikel: '58'
        hoofdstuk: III
        paragraaf: '6'
  - number: '58'
    text: |-
      Het personeel van de houder van de vergunning voor het afleveren van diergeneesmiddelen is technisch voldoende
      geschoold om de opgedragen werkzaamheden naar behoren te kunnen verrichten.
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel58
  - number: '59'
    text: |-
      De houder van de vergunning voor het afleveren van diergeneesmiddelen beschikt over een noodplan voor het uit de
      handel nemen van een diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel59
  - number: 59a
    text: |-
      De lokaliteit voldoet aan elk van de volgende voorwaarden:

      a. zij is goed onderhouden, schoon, opgeruimd en goed verlicht;

      b. zij is voorzien van een zodanige klimaatbeheersing dat de temperatuur, de vochtigheidsgraad en de ventilatie
      geen ongewenste invloed uitoefenen op de zich daarin bevindende diergeneesmiddelen en apparatuur;

      c. de vloeren, muren en plafonds zijn zodanig geconstrueerd dat zij goed schoon te houden zijn;

      d. leidingen, ventilatoren en overige voorzieningen zijn zodanig aangelegd dat géén voor de reiniging
      ontoegankelijke plaatsen ontstaan;

      e. de gebouwen zijn zodanig ontworpen en uitgerust dat zij optimale bescherming bieden tegen het binnendringen
      van ongedierte;

      f. de opslagruimtes beschikken over voldoende capaciteit voor de ordelijke opslag van verschillende materialen
      en diergeneesmiddelen;

      g. opslagruimtes waar gekanaliseerde diergeneesmiddelen worden opgeslagen, zijn niet toegankelijk voor publiek;

      h. er is een afgescheiden opslagruimte voor diergeneesmiddelen die zijn afgekeurd, teruggeroepen of geretourneerd;

      i. op laad- en losplaatsen worden diergeneesmiddelen tegen de invloed van weersomstandigheden beschermd;

      j. de ruimte waarin sterk werkzame stoffen worden opgeslagen, wordt zodanig ontworpen, ingericht en uitgerust, dat
      de in een zodanige ruimte werkzame personen niet aan gevaren worden blootgesteld;

      k. dierenbehuizingen zijn goed afgescheiden van andere ruimtes.
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel59a
  - number: 59b
    text: |-
      De apparatuur voldoet aan elk van de volgende voorwaarden:

      a. zij is zodanig ontworpen dat zij gemakkelijk en grondig kan worden schoongemaakt;

      b. zij is zodanig geïnstalleerd dat elke vergissing wordt uitgesloten.
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel59b
  - number: 59c
    text: |-
      1 Uit te voeren reparatie- en onderhoudswerkzaamheden leveren geen enkel risico op voor de kwaliteit van de
      diergeneesmiddelen.

      2 Meet- en controleapparatuur worden met regelmaat overeenkomstig passende methoden gekalibreerd en gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel59c
  - number: '60'
    text: |-
      1 Degene die diergeneesmiddelen, afkomstig uit een derde land, in Nederland in het vrije verkeer brengt, voldoet
      aan de volgende eisen:

      a. degene die diergeneesmiddelen invoert, draagt ervoor zorg dat door of onder verantwoordelijkheid van een
      persoon als bedoeld in [artikel 51][ref1] in Nederland wordt gecontroleerd dat de door hem ingevoerde partijen
      een volledige kwalitatieve analyse, een kwantitatieve analyse van ten minste alle werkzame bestanddelen en alle
      andere proefnemingen of controles hebben ondergaan die nodig zijn om de kwaliteit van de diergeneesmiddelen
      te waarborgen conform de artikelen 6 tot en met 14 van [richtlijn nr. 91/412/EG](31991L0412) en de
      [artikelen 51 tot en met 56][ref2];

      b. de controle, bedoeld in onderdeel a, vindt plaats voordat de partij in Nederland wordt bereid, verpakt,
      geëtiketteerd of afgeleverd;

      c. het verloop en het resultaat van de controle, bedoeld in het tweede lid, worden in een protocol vastgelegd, dat
      wordt gedateerd en getekend door de persoon die de controle, bedoeld in onderdeel a, heeft uitgevoerd;

      2 Een uit een lidstaat ingevoerde partij diergeneesmiddelen gaat vergezeld van de door een daartoe in die lidstaat
      bevoegde persoon ondertekende controleverslagen, waaruit blijkt dat de desbetreffende partij voldoet aan de in de
      betrokken lidstaat geldende regels alsmede aan de bij de registratie gegeven voorschriften;

      a. de persoon, bedoeld in het eerste lid, onderdeel a, houdt van elke door hem ingevoerde partij monsters aan van
      voldoende grootte voor het verrichten van kwalitatieve en kwantitatieve controles;

      b. het bepaalde in [artikel 55][ref3] is op de monsters, bedoeld in onderdeel a, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0019277#Artikel55
    url: https://wetten.overheid.nl/BWBR0019277/2008-01-30#Artikel60
    references:
