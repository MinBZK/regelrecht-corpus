  - number: '93'
    text: |-
      1 Voorafgaand aan de toepassing van een diergeneesmiddel als bedoeld in [artikel 22 van het besluit][ref1],
      informeert de dierenarts de houder van dieren over de toepassing van middelen in afwijking van de in de
      registratiebeschikking vermelde toepassing en over de mogelijk daaraan verbonden risico’s.

      2 Onverminderd het bepaalde in de [artikelen 90][ref2], [91][ref3] en [92][ref4], meldt de dierenarts bij
      aflevering of bij het voorschrijven van diergeneesmiddelen waarop de bepalingen van [hoofdstuk IV van de wet][ref5]
      van toepassing zijn en diergeneesmiddelen waarvoor een wachttermijn geldt, schriftelijk aan de houder van de dieren
      waarvoor de diergeneesmiddelen bestemd zijn en die gehouden worden voor de productie van levensmiddelen:

      a. naam en hoeveelheid van het afgeleverde diergeneesmiddel, en

      b. de in acht te nemen wachttermijn.

      3 Onverminderd het bepaalde in de [artikelen 90][ref6], [91][ref7] en [92][ref8], maakt de dierenarts, in het
      geval een diergeneesmiddel waarop de bepalingen van [hoofdstuk IV van de wet][ref9] van toepassing zijn of een
      diergeneesmiddel waarvoor een wachttermijn geldt, geheel of gedeeltelijk verloren gaat, aantekening van de verloren
      gegane hoeveelheid, onder vermelding van datum van verlies en de wijze van verloren gaan.


