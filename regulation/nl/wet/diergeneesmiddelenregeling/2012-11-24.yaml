  - number: '97'
    text: |-
      1 Het recept voor een diergeneesmiddel bevat in ieder geval de informatie, bedoeld in
      [artikel 42a, eerste lid, van het besluit][ref1], in de volgorde als in dat lid bepaald.

      2 Een recept heeft een geldigheidsduur van twee weken na de datum van uitschrijven, bedoeld in
      [artikel 42a, eerste lid, onderdeel a, van het besluit][ref2].

      3 Een diergeneesmiddel wordt door houders van een vergunning als bedoeld in [artikel 21 van de wet][ref3] voor het
      afleveren van diergeneesmiddelen en apothekers niet afgeleverd na verloop van de periode, bedoeld in het tweede
      lid.

      4 Het derde lid is niet van toepassing op diergeneesmiddelen als bedoeld in
      [artikel 77a, eerste lid, onderdelen a tot en met d][ref4].

      5 In het recept is de hoeveelheid af te leveren diergeneesmiddelen beperkt tot hetgeen noodzakelijk is om de
      beoogde behandeling of therapie uit te kunnen voeren:

      a. in een periode van maximaal één maand of

      b. in geval het diergeneesmiddelen als bedoeld in [artikel 77a, eerste lid, onderdelen a tot en met d][ref5],
      betreft, in een periode van maximaal één jaar.

      6 Houders van een vergunning als bedoeld in [artikel 21 van de wet][ref6], en apothekers maken van iedere levering
      die betrekking heeft op een deel van het recept, aantekening op het recept, onder vermelding van de datum.


      [ref1]: https://wetten.overheid.nl/BWBR0018901#Artikel42a
