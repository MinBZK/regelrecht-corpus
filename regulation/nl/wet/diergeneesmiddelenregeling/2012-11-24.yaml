  - number: 116c
    text: |-
      1 De vermeldingen op de verpakking en de bijsluiter zijn in de Nederlandse taal gesteld.

      2 De dierenarts past het diergeneesmiddel, bedoeld in [artikel 116a][ref1], toe overeenkomstig de
      gebruiksvoorschriften en de instructies van de fabrikant van het middel.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel116a
