  - number: 77a
    text: |-
      1 In afwijking van [artikel 30, eerste lid, van de wet][ref1] is het houders van een vergunning voor het afleveren
      van diergeneesmiddelen als bedoeld in [artikel 21 van de wet][ref2] toegestaan de volgende diergeneesmiddelen die
      bestemd zijn voor of mede bestemd zijn voor voedselproducerende dieren op recept van een dierenarts aan houders van
      dieren af te leveren:

      a. ontwormingsmiddelen;

      b. middelen tegen parasieten;

      c. middelen tegen schimmels;

      d. kalmeringsmiddelen;

      e. niet-steroïde pijn-, koorts- en ontstekingsremmers.

      2 Het verbod, bedoeld in [artikel 31, eerste lid, van de wet][ref3] geldt niet voor houders van dieren voor zover
      het diergeneesmiddelen betreft bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel31
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0003818
        artikel: '31'
  - number: 77b
    text: |-
      1 Op grond van elk van de criteria bedoeld in artikel 2 van Richtlijn nr. 2006/130/EG, zijn de bepalingen
      van [hoofdstuk IV van de wet][ref1], in afwijking van [artikel 77, eerste lid, onderdeel m][ref2], niet van
      toepassing op de volgende diergeneesmiddelen die bestemd zijn voor of mede bestemd zijn voor toepassing bij
      voedselproducerende dieren:

      a. antidiarree middelen;

      b. vloeistof voor intraveneuze toediening uitsluitend bestemd voor het rund ter behandeling van kopziekte of
      melkziekte, welke vloeistof als werkzame bestanddelen calcium en magnesium bevat;

      c. stofwisselingscorrigerende middelen;

      d. desinfectantia en antiseptica;

      e. middelen tegen uitwendige parasieten, zonder werking tegen inwendige parasieten;

      f. slijmoplossers;

      g. kruidengeneesmiddelen;

      h. homeopatische diergeneesmiddelen;

      i. ijzerinjectie voor biggen en kalveren;

      j. laxeermiddelen;

      k. maagzuursecretieremmers;

      l. ondersteunende middelen bij huidaandoeningen;

      m. vitamines, electrolyten, mineralen en sporenelementen.

      2 In afwijking van het eerste lid kunnen de diergeneesmiddelen met de werkzame stoffen diazinon en amitraz
      uitsluitend overeenkomstig [artikel 77a, eerste lid][ref3], worden afgeleverd aan de houder van dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel77
      [ref3]: https://wetten.overheid.nl/BWBR0019277#Artikel77a
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel77b
