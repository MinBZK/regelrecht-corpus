      Op aanvragen om kleine wijzigingen van de eerste of tweede categorie en ingrijpende wijzigingen, waarop nog geen
      besluit is genomen op 1 januari 2010, wordt beslist met toepassing van het recht zoals dat gold onmiddellijk
      voorafgaand aan dat tijdstip.
