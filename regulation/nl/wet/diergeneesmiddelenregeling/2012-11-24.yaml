  - number: '101'
    text: |-
      1 Voor door het Bureau op grond van deze regeling verzonden nota’s geldt een betalingstermijn van twee weken,
      gerekend vanaf de datering van de nota’s.

      2 Indien twee weken na de datering van de in het eerste lid bedoelde nota het verschuldigde niet is voldaan, kan
      ten aanzien van de schuldenaar worden bepaald, zolang het verschuldigde niet is voldaan, dat het verrichten van
      werkzaamheden of het leveren van materialen slechts kan geschieden indien een door de minister goed te keuren
      bankinstelling zich voor twee jaar borg stelt voor de uit dien hoofde verschuldigde bedragen.

      3 Voor de bestaande vorderingen kan worden overgegaan tot gerechtelijke invordering.

      4 Voor zover verschuldigd wordt de omzetbelasting geacht in het tarief te zijn begrepen.
