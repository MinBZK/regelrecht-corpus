  - number: '64'
    text: |-
      1 In afwijking van [artikel 62][ref1] wordt de informatie, bedoeld in [dat artikel][ref2], uitsluitend vermeld op
      de buitenverpakking van een ampul.

      2 Op de primaire verpakking van een ampul wordt, overeenkomstig de bij de registratie gegeven voorschriften,
      vermeld:

      a. de naam van het diergeneesmiddel;

      b. de hoeveelheid werkzame stoffen;

      c. de wijze van toediening;

      d. het nummer van de partij;

      e. de uiterste gebuiksdatum;

      f. de vermelding ‘diergeneesmiddel’ of ‘geneesmiddel voor diergeneeskundig gebruik’.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel62
