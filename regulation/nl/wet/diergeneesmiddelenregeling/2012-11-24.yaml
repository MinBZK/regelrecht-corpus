  - number: '12'
    text: |-
      De aanvrager van een registratie van een diergeneesmiddel houdt één of meer monsters van het betrokken
      diergeneesmiddel, van de werkzame stof of stoffen, dan wel, in voorkomend geval, van de tussenproducten of van
      andere bestanddelen ten behoeve van de beoordeling van het diergeneesmiddel beschikbaar, welke monsters binnen vijf
      weken op verzoek van het Bureau worden gezonden.
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel12
  - number: '13'
    text: |-
      1 Een besluit omtrent registratie van een diergeneesmiddel wordt genomen binnen 210 dagen na ontvangst van de
      aanvraag.

      2 Indien registratie wordt verleend, deelt het Bureau aan de aanvrager het volgende mee:

      a. de samenvatting van de productkenmerken als bedoeld in artikel 14 van [richtlijn nr. 2001/82/EG](32001L0082);

      b. de aanduidingen met betrekking tot de etikettering;

      c. de aanduidingen met betrekking tot de bijsluiter.

      3 Het Bureau stelt een beoordelingsrapport als bedoeld in artikel 25, vierde lid, van [richtlijn nr. 2001/82/EG]
      (32001L0082) op.

      4 Het beoordelingsrapport wordt bijgewerkt zodra nieuwe gegevens beschikbaar komen die voor de beoordeling van de
      kwaliteit, de veiligheid of de werkzaamheid van het betreffende diergeneesmiddel van belang zijn.

      5 Het beoordelingsrapport, met weglating van alle vertrouwelijke commerciële informatie, de samenvatting van de
      productkenmerken en de registratie zijn op aanvraag verkrijgbaar bij het Bureau.
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel13
  - number: '14'
    text: |-
      1 In afwijking van [artikel 13, eerste lid][ref1], wordt een besluit omtrent registratie van een diergeneesmiddel
      genomen binnen 90 dagen na ontvangst van de aanvraag indien het diergeneesmiddel waarop de aanvraag tot registratie
      betrekking heeft:

      a. is betrokken uit een andere lidstaat, en

      b. gelijk of nagenoeg gelijk is aan een diergeneesmiddel waarvoor een registratie is verleend.

      2 Indien de aanvraag, bedoeld in het eerste lid, betrekking heeft op een in Nederland octrooirechtelijk of
      door middel van een aanvullend beschermingscertificaat beschermd geneesmiddel voor diergeneeskundig gebruik
      dat wordt betrokken uit Bulgarije, Estland, Hongarije, Letland, Litouwen, Polen, Roemenië, Slovenië, Slowakije,
      Tsjechië en daarvoor ten tijde van de registratie van het octrooi of het aanvullende beschermingscertificaat in
      de desbetreffende nieuwe lidstaat niet een dergelijke bescherming kon worden verkregen, wordt bij de aanvraag
      tevens overgelegd een afschrift van de schriftelijke kennisgeving aan de houder van het octrooi of het aanvullende
      beschermingscertificaat of de begunstigde van die bescherming met betrekking tot het referentiegeneesmiddel waaruit
      blijkt dat de kennisgeving is gedaan ten minste een maand voor de dag waarop de aanvraag is ingediend.

      3 Indien de registratie, bedoeld in het eerste lid, wordt verleend, stelt de registratiehouder de houder van de
      oorspronkelijke registratie hiervan onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel13
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel14
