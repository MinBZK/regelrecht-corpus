  - number: '62'
    text: |-
      Op de primaire verpakking en, in voorkomend geval, op de buitenverpakking van een geregistreerd diergeneesmiddel
      wordt, overeenkomstig de bij de registratie gegeven voorschriften, vermeld:

      a. de naam van het diergeneesmiddel, onmiddellijk gevolgd door de concentratie en de farmaceutische vorm met dien
      verstande dat in het geval het diergeneesmiddel slechts één werkzaam bestanddeel bevat en voor dat diergeneesmiddel
      een fantasienaam wordt gebruikt, die fantasienaam duidelijk leesbaar vergezeld dient te gaan van de naam van het
      werkzame bestanddeel;

      b. de kwalitatieve en kwantitatieve samenstelling aan werkzame stoffen per doseringseenheid, of, naar gelang van de
      toedieningsvorm, voor een bepaald volume of een bepaald gewicht, waarbij de algemene benamingen worden gebruikt;

      c. het nummer van de partij;

      d. het nummer waaronder de registratie is verleend, voorafgegaan door de letters ‘Reg. NL’;

      e. de naam of handelsnaam en de woonplaats of plaats van vestiging van de registratiehouder alsmede, indien deze
      niet tevens registratiehouder is, de naam, handelsnaam of het merk van de houder van een vergunning als bedoeld in
      [artikel 21, eerste lid, van de wet][ref1] voor het bereiden van een diergeneesmiddel en, in voorkomend geval van
      de door de registratiehouder aangewezen vertegenwoordiger;

      f. de vermelding ‘diergeneesmiddel’ of ‘geneesmiddel voor diergeneeskundig gebruik’ dan wel in voorkomend geval de
      woorden ‘homeopatisch diergeneesmiddel’ of homeopatisch geneesmiddel voor diergeneeskundig gebruik’;

      g. de diersoort of diersoorten waarvoor de dosering of doseringen waarin en de wijze of wijzen waarop het betrokken
      diergeneesmiddel uitsluitend mag worden gebruikt;

      h. de wachttermijn;

      i. de uiterste gebruiksdatum;

      j. de aanbevelingen omtrent de wijze van bewaring en zo nodig aanwijzingen omtrent te nemen voorzorgsmaatregelen
      bij het zich ontdoen van niet gebruikte diergeneesmiddelen en daarvan afkomstige afvalproducten;

      k. de veiligheidsmaatregelen en bijzondere waarschuwingen voor de gebruiker;


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '63'
    text: |-
      In afwijking van [artikel 62][ref1] wordt op de primaire verpakking en in voorkomend geval de buitenverpakking
      van een homeopathisch diergeneesmiddel dat is geregistreerd overeenkomstig de procedure, bedoeld in artikel 17
      van [richtlijn nr. 2001/82/EG](32001L0082), overeenkomstig de bij de registratie gegeven voorschriften uitsluitend
      vermeld:

      a. de woorden ‘homeopathisch diergeneesmiddel zonder goedgekeurde therapeutische indicatie’;

      b. de naam van het diergeneesmiddel en de wetenschappelijke benaming van de homeopathische grondstof of
      grondstoffen, gevolgd door de verdunningsgraad, waarvoor gebruik wordt gemaakt van de Europese Farmacopee;

      c. het nummer waaronder de registratie is verleend, voorafgegaan door de letters ‘Reg. NL H’;

      d. de naam of handelsnaam en het adres van de registratiehouder alsmede, indien deze niet tevens
      registratiehouder is, de naam, de handelsnaam of het merk van de houder van een vergunning als bedoeld in
      [artikel 21, eerste lid, van de wet][ref2] voor het bereiden van een diergeneesmiddel;.

      e. de diersoort of diersoorten waarvoor de dosering of doseringen waarin en de wijze of wijzen waarop het betrokken
      diergeneesmiddel uitsluitend mag worden gebruikt;

      f. het nummer van de partij;

      g. de uiterste gebruiksdatum;

      h. de farmaceutische vorm;

      i. de inhoud van de primaire verpakking naar gewicht, volume of aantal doses;

      j. de aanbevelingen omtrent de wijze van bewaring en zo nodig aan wijzingen omtrent te nemen voorzorgsmaatregelen
      bij het zich ontdoen van niet gebruikte diergeneesmiddelen en daarvan afkomstige afvalproducten;

      k. zonodig de veiligheidsmaatregelen en bijzondere waarschuwingen voor de gebruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: '62'
        hoofdstuk: III
        paragraaf: '8'
      - id: ref2
