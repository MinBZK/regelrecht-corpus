  - number: '73'
    text: |-
      Op de omdoos wordt, onverminderd het bepaalde bij of krachtens de [Wet vervoer gevaarlijke stoffen][ref1], vermeld:

      a. de naam van het diergeneesmiddel en het nummer waaronder het is geregistreerd, dan wel indien het een niet-
      geregistreerd diergeneesmiddel betreft de ingevolge [artikel 67][ref2] voorgeschreven naam;

      b. de naam en het adres van de registratiehouder;

      c. het nummer van de partij.


