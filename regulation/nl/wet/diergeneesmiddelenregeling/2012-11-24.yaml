  - number: '81'
    text: |-
      1 Als substanties als bedoeld in [artikel 46, eerste lid, van het besluit][ref1], die verboden zijn aan
      landbouwhuisdieren of aquacultuurdieren toe te dienen, worden de volgende substanties aangewezen:

      a. substanties met thyreostatische, oestrogene, androgene of gestagene werking;

      b. stilbenen, stilbeenderivaten, zouten en de esters daarvan;

      c. β-agonisten.

      2 In afwijking van [artikel 46, eerste lid, van het besluit][ref2] mogen de volgende substanties onder de volgende
      omstandigheden aan landbouwhuisdieren worden toegediend:

      a. diergeneesmiddelen die testosteron, progesteron en derivaten daarvan bevatten, die bij de hydrolyse na
      resorptie op de toedieningsplaats gemakkelijk weer de stamverbinding opleveren, in het kader van een therapeutische
      behandeling, toegediend in de vorm van een injectie of, voor de behandeling van stoornissen aan de eierstokken,
      door middel van spiraaltjes of vergelijkbare toedieningsvormen;

      b. diergeneesmiddelen die allyltrenbolon voor orale toediening of β-agonisten bevatten, voor toediening aan
      paardachtigen, in het kader van een therapeutische behandeling;

      c. diergeneesmiddelen die β-agonisten bevatten voor de toediening aan vrouwelijke runderen ter behandeling van
      tocolyse tijdens het kalven, toegediend in de vorm van een injectie;

      d. diergeneesmiddelen met oestrogene, androgene of gestagene werking, met uitzondering van 17-β-oestradiol, voor de
      toediening in het kader van zoötechnische behandeling als bedoeld in artikel 1, tweede lid, onderdeel c, onder i,
      van [richtlijn nr. 96/22/EG](31996L0022).

      3 In afwijking van [artikel 46, eerste lid, van het besluit][ref3] mogen diergeneesmiddelen met androgene werking
      aan jonge aquacultuurdieren worden toegediend gedurende de eerste drie maanden met het oog op geslachtsverandering.

      4 Het bepaalde in het tweede lid is niet van toepassing op de registratie van diergeneesmiddelen aan gebruiksdieren
      en aan dieren die bestemd zijn voor de mesterij, met inbegrip van voor de fokkerij afgeschreven dieren.

      5 Het bepaalde in het tweede lid is niet van toepassing op substanties:

      a. met hormonale en depotwerking;

      b. hormonale werking waarvan de wachttermijn meer dan 15 dagen na beëindiging van de behandeling bedraagt;

      c. die β-agonisten bevatten en waarvan de wachttermijn meer dan 28 dagen na beëindiging van de behandeling
      bedraagt;

      d. waarvan de gebruiksvoorwaarden niet bekend zijn, of

      e. waarvan reagentia of het nodige materiaal voor analysemethoden waarmee de aanwezigheid van residuen boven de
      toegestane maxima kan worden aangetoond, niet voorhanden zijn.


