    text: |-
      1 Ingeval de partijkeuring tevens een experimentele keuring betreft, bedragen de kosten voor de aanvraag tot
      keuring van een partij, bedoeld in [artikel 15, eerste lid, van de wet][ref1]:

      a. € 4.697 voor sera en entstoffen voor pluimvee;

      b. € 5.479 voor sera en entstoffen voor schaap of geit;

      c. € 6.262 voor sera en entstoffen voor varken, hond of kat;

      d. € 10.437 voor sera en entstoffen voor rund of paard;

      e. € 1.826 voor sera en entstoffen voor overige dieren;

      f. € 1.826 voor alle biologische diagnostica

      2 Ingeval geen experimentele keuring noodzakelijk is of indien ten aanzien van het betrokken diergeneesmiddel
      reeds eerder een zodanige keuring heeft plaatsgehad, waarbij goedkeuring plaatsvond, danwel een verklaring wordt
      overgelegd waaruit blijkt dat een partij een experimentele keuring heeft ondergaan in een andere lidstaat en is
      goedgekeurd, bedragen de kosten voor de administratieve behandeling van de aanvraag tot keuring van een partij,
      bedoeld in [artikel 15, eerste lid, van de wet][ref2], € 224.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel15
