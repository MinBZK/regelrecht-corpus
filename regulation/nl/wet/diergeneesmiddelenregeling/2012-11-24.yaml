      1 Onverminderd het bepaalde in de [artikelen 90][ref1], [91][ref2] en [92][ref3], voert de dierenarts, bedoeld
      in [artikel 34][ref4], in het geval door hem een niet in Nederland geregistreerd diergeneesmiddel is toegepast of
      afgeleverd, een administratie die de volgende gegevens bevat:

      a. de behandelde dieren;

      b. naam en adres van de houder van de dieren;

      c. de gestelde diagnose;

      d. het toegepaste en afgeleverde diergeneesmiddel alsmede de voorgeschreven dosis;

      e. de duur van de behandeling;

      f. de door de dierenarts opgegeven wachttermijn, indien voor het betrokken diergeneesmiddel een wachttermijn in
      acht moet worden genomen.

      2 De dierenarts, bedoeld in [artikel 34][ref5], houdt de administratie, bedoeld in het
      eerste lid, gedurende drie jaren beschikbaar en toont deze op eerste afroep aan de ingevolge
      [artikel 17, eerste lid, onderdeel 2, van de Wet op de economische delicten][ref6] met de opsporing belaste
      personen of aan ambtenaren, bedoeld in [artikel 99][ref7].


