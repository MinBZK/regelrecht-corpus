  - number: '91'
    text: |-
      1 Een dierenarts houdt bij toediening aan een voedselproducerend dier van een diergeneesmiddel dat overeenkomstig
      [artikel 2, tweede lid, onderdeel a, van de wet][ref1] is bereid, onderscheidenlijk een diergeneesmiddel als
      bedoeld in [artikel 22 van het besluit][ref2], gedurende vijf jaar in een register als bedoeld in artikel 11,
      vierde lid, van richtlijn nr. 2001/82/EG de volgende gegevens bij:

      a. de datum waarop de dieren werden onderzocht;

      b. naam en adres van de houder van de dieren;

      c. het aantal behandelde dieren;

      d. de diagnose;

      e. de diergeneeskundige motivering voor de toediening van het diergeneesmiddel;

      f. de voorgeschreven diergeneesmiddelen;

      g. de toegediende dosering;

      h. de duur van de behandeling;

      i. de vastgestelde wachttermijnen.

      2 De administratie van een dierenarts inzake het voorschrijven van diergeneesmiddelen die bestemd zijn om als
      zodanig aan dieren te worden vervoederd in de vorm van gemedicineerde voeders, bevat een afschrift van het door de
      dierenarts opgestelde recept, bedoeld in [artikel 98][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018901#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0019277#Artikel98
