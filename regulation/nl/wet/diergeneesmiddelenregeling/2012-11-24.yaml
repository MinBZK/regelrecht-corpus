  - number: '54'
    text: |-
      Een verzoek tot inschakeling van een extern laboratorium als bedoeld in artikel 11, tweede lid, van [richtlijn nr.
      91/412/EEG](31991L0412):

      a. is met redenen omkleed;

      b. bevat een opgave van de desbetreffende onderzoeken en controles;

      c. bevat de naam en het adres van het laboratorium alsmede een omschrijving van de voor de controles te benutten
      lokaliteiten en uitrusting;

      d. bevat de naam en hoedanigheid van de persoon, bedoeld in [artikel 51][ref1], die voor de uitbestede
      verrichtingen verantwoordelijk is, en

      e. bevat een afschrift van de schriftelijke overeenkomst ter zake de uitbestede verrichtingen, bedoeld in artikel
      12 van [richtlijn nr. 91/412/EEG](31991L0412).


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel51
