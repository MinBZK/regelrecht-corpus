      1 Bij een kleine wijziging van de eerste categorie ten aanzien van een registratie die via de procedure, bedoeld
      in artikel 32 van richtlijn 2001/82/EG, in Nederland is verleend of in een volgende lidstaat is erkend, geschiedt
      de wijziging overeenkomstig de procedure, bedoeld in artikel 8 van verordening (EG) nr. 1234/2008, in samenhang met
      artikel 11 van deze verordening en bijlage IV bij deze verordening.

      2 Voor de toepassing van het eerste lid wordt aangewezen:

      a. als bevoegde instantie als bedoeld in artikel 11, eerste lid, aanhef, van verordening (EG) nr. 1234/2008: de
      minister, indien Nederland referentielidstaat is als bedoeld in dat artikel;

      b. als toepasselijk nationaal voorschrift als bedoeld in onderdeel 6 van bijlage IV bij verordening (EG) nr.
      1234/2008: [artikel 106c, eerste lid, onderdelen h en i, en tweede lid][ref1].


