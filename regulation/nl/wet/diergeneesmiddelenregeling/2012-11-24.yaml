        artikel: '66'
        hoofdstuk: III
        paragraaf: '8'
  - number: 121c
    text: |-
      In afwijking van [artikel 77a, eerste lid][ref1], is het toegestaan de in dat artikel bedoelde diergeneesmiddelen
      tot en met 1 juli 2008 zonder recept van een dierenarts af te leveren aan houders van dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel77a
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel121c
    references:
      - id: ref1
        bwb_id: BWBR0019277
        artikel: 77a
        hoofdstuk: IV
  - number: 121d
    text: |-
      Tot en met 15 december 2008 is het fabrikanten, in afwijking van [artikel 62, onderdeel f][ref1], en
      [artikel 66, onderdeel a][ref2], toegestaan op de primaire verpakking en, in voorkomend geval, op de
      buitenverpakking van diergeneesmiddelen als bedoeld in [artikel 77, eerste lid, onderdeel n][ref3], de volgende
      aanduidingen niet te vermelden:

      a. diergeneesmiddel, uitsluitend aflevering door de dierenarts of op recept van de dierenarts door de apotheker;

      b. geneesmiddel voor diergeneeskundig gebruik, uitsluitend aflevering door de dierenarts of op recept van de
      dierenarts door de apotheker, of

      c. uitsluitend aflevering door de dierenarts of op recept van de dierenarts door de apotheker, dan wel ‘U.D.A.’.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0019277#Artikel77
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel121d
    references:
      - id: ref1
