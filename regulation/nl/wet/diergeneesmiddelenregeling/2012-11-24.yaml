  - number: '89'
    text: |-
      1 Een houder van een vergunning als bedoeld in [artikel 33 van de wet][ref1] voor het bereiden of afleveren van
      gemedicineerde voeders, voert een administratie inzake iedere transactie met gemedicineerde voeders.

      2 De administratie, bedoeld in het eerste lid, bevat:

      a. het recept, bedoeld in [artikel 98][ref2], en

      b. bewijzen, waaronder de facturen bij de ontvangst en de kopieën van facturen voor de aflevering, met ten minste
      de volgende gegevens:

      1°. aard en hoeveelheid van de bereide en afgeleverde gemedicineerde diervoeders;

      2°. aard en hoeveelheid van de gemedicineerde diervoeders die op het bedrijf opgeslagen zijn,

      3°. aard en hoeveelheid van de diervoeders, de voormengsels met medicinale werking en de halffabricaten met
      medicinale werking die bij de bereiding van gemedicineerde voeders zijn gebruikt,

      4°. naam en adres van de ontvanger, en

      5°. naam en adres van de dierenarts door wie het recept voor het gemedicineerd voeder werd uitgeschreven.

      3 In de administratie worden de gegevens, bedoeld in het tweede lid, onderdeel b, onder 3, voor elk voormengsel
      met medicinale werking, voor elk halffabricaat met medicinale werking en voor elk gemedicineerd voeder afzonderlijk
      vermeld.

      4 De administratie en de bescheiden die verband houden met de aantekeningen in de administratie worden gedurende
      drie jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel98
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel89
