  - number: 116f
    text: |-
      De dierenarts past het diergeneesmiddel, bedoeld in [artikel 116d][ref1], toe overeenkomstig de hiertoe ter
      beschikking gestelde informatie met betrekking tot het middel van de producent van het middel.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel116d
