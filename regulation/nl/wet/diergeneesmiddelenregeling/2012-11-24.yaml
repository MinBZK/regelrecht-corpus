  - number: '10'
    text: |-
      1 In afwijking van [artikel 5, derde lid][ref1], hoeft een aanvraag tot registratie van een homeopathisch
      diergeneesmiddel slechts vergezeld te gaan van de bescheiden, bedoeld in artikel 18 van [richtlijn nr. 2001/82/EG]
      (32001L0082), indien de aanvrager kan aantonen dat de aanvraag tot registratie voldoet aan elk van de voorwaarden,
      bedoeld in artikel 17, eerste lid, onderdelen a tot en met c, van [richtlijn nr. 2001/82/EG](32001L0082).

      2 Een aanvraag als bedoeld in het eerste lid kan betrekking hebben op een reeks diergeneesmiddelen die van dezelfde
      homeopathische grondstof of grondstoffen zijn afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel5
