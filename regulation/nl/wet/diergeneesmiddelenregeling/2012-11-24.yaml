  - number: '96'
    text: |-
      1 Een houder van dieren die de dieren houdt voor de productie van levensmiddelen voert een administratie inzake
      transacties met diergeneesmiddelen waarop de bepalingen van [hoofdstuk IV van de wet][ref1] van toepassing zijn
      en diergeneesmiddelen waarvoor een wachttermijn geldt, in welke administratie de volgende documenten en gegevens
      zijn opgenomen:

      a. voor zover een recept als bedoeld in [artikel 97][ref2] is opgesteld, een gewaarmerkt afschrift van dat recept;

      b. de facturen bij aankoop van diergeneesmiddelen;

      c. een lijst met de data van de uitgevoerde behandelingen met diergeneesmiddelen en de registratienummers van deze
      diergeneesmiddelen, voor zover de behandelingen door de houder zijn uitgevoerd;

      d. de identificatie van de behandelde dieren;

      e. de vastgestelde wachttermijn, voor zover deze niet reeds op een recept als bedoeld in onderdeel a, is vermeld;

      f. de aantekeningen, bedoeld in [artikel 92, eerste lid][ref3], van de dierenarts of van de persoon als bedoeld in
      [artikel 30, tweede lid, onderdeel f, van de wet][ref4].

      2 De houder van dieren, bedoeld in het eerste lid, kan de administratie, bedoeld in het eerste lid, doen uitvoeren
      in de door de dierenarts overeenkomstig de [artikelen 90][ref5] en [91][ref6] te voeren administratie.

      3 In het geval een diergeneesmiddel als bedoeld in het eerste lid geheel of gedeeltelijk verloren gaat, tekent
      de houder van dieren, bedoeld in het eerste lid, in zijn administratie de verloren gegane hoeveelheid aan, onder
      vermelding van de naam van het diergeneesmiddel, de datum van verlies en de wijze van verloren gaan.

      4 Een houder van dieren die de dieren houdt voor de productie van levensmiddelen voert een administratie inzake
      transacties met gemedicineerd voeder, in welke administratie de volgende gegevens zijn opgenomen:

      a. een gewaarmerkt afschrift van een recept als bedoeld in artikel 96, en, voor zover dit niet reeds op dat
      afschrift is vermeld:

      b. naam en hoeveelheid van het voorgeschreven gemedicineerde voeder;

      c. de datum waarop het gemedicineerde voeder werd voorgeschreven;

      d. de in acht te nemen wachttermijn;

      e. in het geval het gemedicineerde voeder geheel of gedeeltelijk verloren gaat, aantekening van de verloren gegane
      hoeveelheid, onder vermelding van datum van verlies en de wijze van verloren gaan.

      5 De administratie, bedoeld in het eerste, derde en vierde lid, en de bescheiden die verband houden met de
      aantekeningen in de administratie, worden gedurende vijf jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIV
