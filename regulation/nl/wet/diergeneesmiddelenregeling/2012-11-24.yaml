        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0019277
        artikel: '55'
        hoofdstuk: III
        paragraaf: '4'
  - number: '61'
    text: |-
      1 Ten aanzien van uit derde landen ingevoerde partijen diergeneesmiddelen kan de minister op aanvraag van degene
      die diergeneesmiddelen invoert ontheffing verlenen van [artikel 60, eerste lid, onderdeel a][ref1], indien tussen
      de Europese Gemeenschap en het land van uitvoer passende afspraken zijn gemaakt om te waarborgen dat de houder van
      een vergunning als bedoeld in [artikel 21, eerste lid, van de wet][ref2] voor het bereiden van een diergeneesmiddel
      van de betreffende diergeneesmiddelen normen voor goede praktijken bij het vervaardigen hanteert die tenminste
      gelijkwaardig zijn aan die in de artikelen 6 tot en met 14 van [richtlijn nr. 91/412/EG](31991L0412) en de
      [artikelen 51 tot en met 56][ref3] en dat de controles, bedoeld in [onderdeel a][ref4], in dat land van uitvoer
      zijn verricht.

      2 De minister doet mededeling in de Staatscourant van de passende afspraken, bedoeld in het [tweede lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0019277#Artikel51
