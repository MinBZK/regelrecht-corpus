  - number: 116d
    text: |-
      1 Van het verbod, gesteld in [artikel 2, eerste lid, van de Diergeneesmiddelenwet][ref1], wordt
      vrijstelling verleend voor de toepassing bij olifanten, neushoorns en tapirs, welke overeenkomstig
      [artikel 13 van het Dierentuinenbesluit][ref2] geregistreerd zijn en worden gehouden in een dierentuin die is
      aangesloten bij de Nederlandse Vereniging van Dierentuinen, van het diergeneesmiddel Modified Vaccinia Virus
      Ankara van het Institut für Medizinische Mikrobiologie, Infektions- und Seuchenmedizin van de Ludwig-Maximilians-
      Universität München, ten behoeve van het voorkomen van koepokken en met het oog daarop het voorhanden hebben of in
      voorraad hebben onder de voorwaarden, gesteld in [artikel 116f][ref3].

      2 De vrijstelling, bedoeld in het eerste lid, wordt verleend tot 1 januari 2018.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
