  - number: '65'
    text: |-
      Onverminderd [artikel 69][ref1] wordt bij kleine primaire verpakkingen die slechts één gebruiksdosis bevatten,
      waarop de informatie, bedoeld in [artikel 69][ref2] niet kan worden vermeld, de informatie, bedoeld in
      [artikel 62][ref3], overeenkomstig de bij de registratie gegeven voorschriften, op de buitenverpakking vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0019277#Artikel62
