  - number: '99'
    text: |-
      Als ambtenaren als bedoeld in [artikel 52, eerste lid, van de wet][ref1] worden aangewezen:

      a. ambtenaren van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      b. ambtenaren van de Voedsel en Waren Autoriteit van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      c. ambtenaren van de Inspectie voor de Gezondheidszorg van het Ministerie van Volksgezondheid, Welzijn en Sport
      voor zover het betreft het toezicht op de naleving van:

      1°. het bepaalde bij of krachtens [hoofdstuk III van de wet][ref2];

      2°. het bepaalde bij of krachtens [hoofdstuk II van de wet][ref3] ten aanzien van goede laboratoriumpraktijken als
      bedoeld in Bijlage I, Inleiding en algemene beginselen, onderdeel 6, van richtlijn nr. 2001/82/EG;

      d. ambtenaren van de Belastingdienst bevoegd inzake douane.


