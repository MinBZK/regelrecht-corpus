        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '7'
    text: |-
      In afwijking van [artikel 5, derde lid][ref1], behoeft het dossier geen wetenschappelijke bescheiden voor elke
      werkzame stof afzonderlijk te bevatten indien een diergeneesmiddel werkzame stoffen bevat die al zijn opgenomen in
      een geregistreerd diergeneesmiddel, maar niet eerder met therapeutisch oogmerk zijn samengevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel5
