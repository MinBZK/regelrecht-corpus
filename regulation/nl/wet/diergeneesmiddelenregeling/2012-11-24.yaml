  - number: '88'
    text: |-
      1 Een houder van een vergunning voor het afleveren van diergeneesmiddelen als bedoeld in
      [artikel 21 van de wet][ref1] houdt ten minste éénmaal per kalenderjaar een nauwkeurige controle van de
      administratie, bedoeld in [artikel 87, eerste lid][ref2], door vergelijking van de ontvangen en afgeleverde
      diergeneesmiddelen met de aanwezige voorraden, ten bewijze waarvan een verslag wordt gemaakt dat in elk geval de
      geconstateerde verschillen bevat.

      2 De administratie, bedoeld in de [artikelen 86, tweede lid][ref3], en [87, derde en vierde lid][ref4], de
      bescheiden die verband houden met de aantekeningen in de administratie en het verslag, bedoeld in het vorige lid,
      worden gedurende drie jaar bewaard.

      3 De administratie, bedoeld in het [artikel 87, vijfde lid][ref5], en de bescheiden die verband houden met de
      aantekeningen in de administratie worden gedurende vijf jaar bewaard.

      4 De administratie, bedoeld in [artikel 87, tweede lid][ref6], wordt gedurende drie jaar bewaard, voor zover deze
      betrekking heeft op de ontvangst van diergeneesmiddelen die vervolgens worden afgeleverd aan degene, bedoeld in
      artikel 87, derde onderscheidenlijk vierde lid.

      5 De administratie, bedoeld in [artikel 87, tweede lid][ref7], wordt gedurende vijf jaar bewaard, voor zover deze
      betrekking heeft op de ontvangst van diergeneesmiddelen die vervolgens worden afgeleverd aan degene, bedoeld in
      artikel 87, vijfde lid.


