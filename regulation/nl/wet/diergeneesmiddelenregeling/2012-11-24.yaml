      1 Een houder van een vergunning voor het bereiden van diergeneesmiddelen als bedoeld in
      [artikel 21 van de wet][ref1] voert een administratie inzake iedere transactie met diergeneesmiddelen.

      2 De administratie, bedoeld in het eerste lid, inzake de aflevering van diergeneesmiddelen aan een houder van een
      vergunning voor het afleveren van diergeneesmiddelen als bedoeld in [artikel 21 van de wet][ref2], bevat de kopieën
      van facturen met daarop of daarbij ten minste de volgende gegevens:

      a. datum van de transactie;

      b. benaming en, in voorkomend geval, het registratienummer van het diergeneesmiddel;

      c. partijnummer;

      d. afgeleverde hoeveelheid, en

      e. naam en adres van de ontvanger.

      3 De administratie, bedoeld in het tweede lid, heeft tevens betrekking op de grondstoffen die door de houder van
      een vergunning als bedoeld in het eerste lid, worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
