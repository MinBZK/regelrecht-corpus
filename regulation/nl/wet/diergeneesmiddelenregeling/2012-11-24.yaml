  - number: '78'
    text: |-
      1 Van de diergeneesmiddelen, bedoeld in [artikel 77][ref1], die ingevolge
      [artikel 30, vierde lid, van de wet][ref2], niet aan apothekers of houders van dieren mogen worden afgeleverd
      worden aangewezen:

      a. hormoonpreparaten met een gestagene, oestrogene of androgene werking;

      b. sera, entstoffen en immunologische diergeneesmiddelen;

      c. biologische diagnostica;

      d. diergeneesmiddelen die kunnen worden toegediend door middel van injectie of implantatie, tenzij uitsluitend
      subcutane, intramusculaire of intramammaire toediening is toegestaan;

      e. diergeneesmiddelen voor algehele verdoving, alsmede per injectie toe te dienen middelen voor plaatselijke
      verdoving;

      f. spierrelaxantia;

      g. diergeneesmiddelen die β-agonisten bevatten.

      2 De in het eerste lid, onderdeel a tot en met e, gegeven aanwijzing is niet van toepassing op de
      diergeneesmiddelen, die zijn genoemd in [bijlage III][ref3] bij deze regeling.

      3 De aanwijzing van entstoffen, bedoeld in het eerste lid, aanhef en onderdeel b, is niet van toepassing op een
      entstof die is bestemd om te worden toegepast bij varkens ter voorkoming van, onderscheidenlijk, bij een besmetting
      met influenza, vlekziekte, Porcine reproductive and Respiratory syndrome, Atrofische rhinitis, Escherichia coli,
      Clostridium perfringens, Mycoplasma hyopneumoniae, Actinobacillus pleuropneumoniae, parvovirus, rotavirus, de
      ziekte van Glässer, Lawsonia intracellularis of Porcine Circo Virus type 2, voorzover:

      a. de entstof aan een houder van varkens wordt afgeleverd:

      1°. door een dierenarts op grond van een overeenkomst tot begeleiding bij het gebruik van entstoffen, of

      2°. door een apotheker op recept van een dierenarts die een overeenkomst als bedoeld onder 1° met de houder heeft
      gesloten, en

      b. is voldaan aan elk van de voorwaarden, opgenomen in de [punten 2 tot en met 5 van Bijlage IV][ref4] bij deze
      regeling.

      4 De aanwijzing van immunologische diergeneesmiddelen, bedoeld in het eerste lid, aanhef en onderdeel b, is
      niet van toepassing op een immunologisch diergeneesmiddel dat bestemd is om te worden toegepast bij varkens ter
      voorkoming van berengeur, voor zover:

      a. het immunologisch diergeneesmiddel aan een houder van varkens wordt afgeleverd:

      1°. door een dierenarts op grond van een overeenkomst tot begeleiding bij het gebruik van een immunologisch
      diergeneesmiddel, of

      2°. door een apotheker op recept van een dierenarts die een overeenkomst als bedoeld onder 1° met de houder heeft
      gesloten, en

      b. is voldaan aan elk van de voorwaarden, opgenomen in de
      [punten 2 tot en met 5 van Bijlage IV bij deze regeling][ref5].

      5 Aan het bepaalde in het vierde lid, onderdeel a, en aan de in het vierde lid, onderdeel b, bedoelde voorwaarde
      opgenomen in [Bijlage IV, punt 3][ref6], bij deze regeling, wordt geacht te zijn voldaan, indien de houder van
      varkens, bedoeld in het vierde lid, onderdeel a, een overeenkomst met een dierenarts is aangegaan als bedoeld in
      het derde lid, onderdeel a.


