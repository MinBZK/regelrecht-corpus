  - number: '11'
    text: |-
      1 In aanvulling op [artikel 5, eerste lid][ref1], verzoekt de aanvrager van een registratie van een
      diergeneesmiddel als bedoeld in artikel 32 van [richtlijn nr. 2001/82/EG](32001L0082) een lidstaat:

      a. op te treden als referentielidstaat,

      b. ingeval van een aanvraag tot registratie als bedoeld in artikel 32, tweede lid, van [richtlijn nr. 2001/82/
      EG](32001L0082) een beoordelingsrapport over het betreffende diergeneesmiddel op te stellen dan wel het bestaande
      beoordelingsrapport bij te werken binnen 90 dagen na ontvangst van de aanvraag of,

      c. ingeval van een aanvraag tot registratie als bedoeld in artikel 32, derde lid, van [richtlijn nr. 2001/82/
      EG](32001L0082) een beoordelingsrapport over het betreffende diergeneesmiddel op te stellen binnen 120 dagen na
      ontvangst van een aanvraag.

      2 De aanvrager van een registratie van een diergeneesmiddel als bedoeld in artikel 32 van [richtlijn nr. 2001/82/
      EG](32001L0082) verklaart bij het indienen van de aanvraag dat het ingediende dossier in alle lidstaten geheel
      gelijk is.

      3 In afwijking van [artikel 13, eerste lid][ref2], wordt een besluit omtrent registratie van een diergeneesmiddel
      als bedoeld in artikel 32, tweede lid, en 32, derde lid, van [richtlijn nr. 2001/82/EG](32001L0082) genomen binnen
      respectievelijk 90 en 210 dagen na ontvangst van het beoordelingsrapport, de samenvatting van productkenmerken, de
      etikettering en de bijsluiter.

      4 In afwijking van het derde lid en van [artikel 13, eerste lid][ref3] wordt de beslistermijn verlengd tot 30
      dagen na afronding van de procedures, bedoeld in de artikelen 33 tot en met 38 van [richtlijn nr. 2001/82/EG]
      (32001L0082).

      5 Dit artikel is niet van toepassing op een aanvraag tot registratie van een homeopathisch diergeneesmiddel als
      bedoeld in [artikel 9][ref4].


