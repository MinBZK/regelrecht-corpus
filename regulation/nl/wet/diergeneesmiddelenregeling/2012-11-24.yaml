  - number: '18'
    text: |-
      1 Een besluit omtrent een kleine wijziging van de tweede categorie wordt genomen binnen 30 dagen nadat de ontvangst
      van de aanvraag, bedoeld in [artikel 16, eerste lid][ref1], is bevestigd.

      2 In afwijking van [artikel 4:5, eerste lid, van de Algemeen wet bestuursrecht][ref2] kan een aanvrager gedurende
      30 dagen in de gelegenheid worden gesteld om een aanvraag aan te vullen, ingeval niet is voldaan aan de eisen,
      gesteld in [artikel 16][ref3], of de bij de aanvraag verstrekte gegevens en bescheiden onvoldoende zijn voor de
      beoordeling van de aanvraag of voor de voorbereiding van het besluit.

      3 Indien een aanvrager in de gelegenheid als bedoeld in het tweede lid wordt gesteld, wordt een besluit in
      afwijking van het eerste lid genomen binnen 30 dagen na ontvangst van de aanvullingen.

      4 Indien het Bureau niet voldoet aan het eerste of derde lid, wordt de registratie van rechtswege gewijzigd
      overeenkomstig de aanvraag bedoeld in [artikel 16, eerste lid][ref4].


