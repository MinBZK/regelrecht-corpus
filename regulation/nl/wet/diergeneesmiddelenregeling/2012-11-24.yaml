preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Volksgezondheid, Welzijn en Sport en na overleg met de Minister
    van Sociale Zaken en Werkgelegenheid;

    Gelet op: richtlijn nr. 90/167/EEG van de Raad van de Europese Gemeenschappen van 26 maart 1990 tot vaststelling
    van de voorwaarden voor de bereiding, het in de handel brengen en het gebruik van diervoeders met medicinale
    werking (PbEG L 92); richtlijn nr. 91/412/EEG van de Commissie van de Europese Gemeenschappen van 23 juli 1991
    tot vastlegging van beginselen en richtsnoeren inzake goede praktijken bij het vervaardigen van geneesmiddelen
    voor diergeneeskundig gebruik (PbEG L 228); richtlijn nr. 96/22/EG van de Raad van de Europese Unie van 29 april
    1996 betreffende het verbod op het gebruik, in de veehouderij, van bepaalde stoffen met hormonale werking en van
    bepaalde stoffen met thyreostatische werking, alsmede van β-agonisten en tot intrekking van de Richtlijnen 81/602/
    EEG, 88/146/EEG en 88/299/EEG (PbEG L 125); richtlijn nr. 96/23/EG van de Raad van de Europese Unie van 29 april
    1996 inzake controlemaatregelen ten aanzien van bepaalde stoffen en residuen daarvan in levende dieren en in
    producten daarvan en tot intrekking van de Richtlijnen 85/358/EEG en 86/469/EEG en de Beschikkingen 89/187/EEG en
    91/664/EEG (PbEG L 125); richtlijn nr. 2001/82/EG van het Europees Parlement en de Raad van de Europese Unie van
    6 november 2001 tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig
    gebruik (PbEG L 311);

    Gelet op de artikelen 14, 15, 27, tweede, 29, eerste lid, 30, tweede en vierde lid, 31, eerste lid, 35, tweede
    lid, 40, eerste, tweede, derde en vierde lid, 44, 45, 52, eerste lid, 57, eerste lid, 58, derde lid, van de
    Diergeneesmiddelenwet, de artikelen 15, 19, 27 en 28 van de Landbouwwet en deartikelen 3, tweede lid, 12, tweede
    lid, 13, tweede lid, 16, 26, 31, tweede lid, 38, 45, 53, eerste lid, 64, tweede lid, 68, derde lid, 69, tweede en
    derde lid, 72, 75, 78, tweede lid, van het Diergeneesmiddelenbesluit;

