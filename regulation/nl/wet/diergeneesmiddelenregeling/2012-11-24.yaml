        artikel: '20'
  - number: '68'
    text: |-
      Op de primaire verpakking en, in voorkomend geval, op de buitenverpakking van een door een dierenarts of apotheker
      ingevolge het bepaalde in [artikel 2, tweede lid, onderdeel a, van de wet][ref1] bereid diergeneesmiddel wordt, in
      afwijking van het bepaalde in [artikel 67][ref2], vermeld:

      a. de naam van de bereider;

      b. de naam van het diergeneesmiddel, onmiddellijk gevolgd door de kwalitatieve en kwantitatieve samenstelling van
      werkzame bestanddelen, afhankelijk van de farmaceutische vorm aangegeven per dosis of in procenten;

      c. de naam van de houder van het dier of de dieren waarvoor het middel is bereid;

      d. de dosering waarin het diergeneesmiddel moet worden toegepast en wijze van toediening;

      e. de wachttermijn;

      f. de datum van bereiding;

      g. aanbevelingen omtrent het gebruik en de bewaring van het diergeneesmiddel;

      h. de eventuele veiligheidsmaatregelen voor de gebruiker;

      i. de uiterste gebruiksdatum, indien de maximale houdbaarheidstermijn minder dan drie jaar bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel67
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel68
