  - number: 116e
    text: |-
      Het diergeneesmiddel, bedoeld in [artikel 116d][ref1], wordt voor de toepassing van deze regeling aangewezen als:

      a. een middel als bedoeld in [artikel 29, eerste lid, van de Diergeneesmiddelenwet][ref2];

      b. een middel als bedoeld in [artikel 30, vierde lid, van de Diergeneesmiddelenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel116d
