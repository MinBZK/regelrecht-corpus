      (i) overeenkomstig de procedure, bedoeld in artikel 9 van verordening (EG) nr. 1234/2008, in samenhang met artikel
      11 van deze verordening en bijlage IV bij deze verordening,

      of, voor zover van toepassing,

      (ii) overeenkomstig de procedure, bedoeld in artikel 20 van verordening (EG) nr. 1234/2008, in samenhang met
      bijlagen IV en V bij deze verordening.

      2 Voor de toepassing van het eerste lid wordt aangewezen:

      a. als bevoegde instantie als bedoeld in artikel 9, eerste lid, tweede alinea, tweede lid, eerste en tweede alinea,
      derde lid, eerste alinea, en vierde lid, en artikel 11, eerste lid, aanhef, van verordening (EG) nr. 1234/2008: de
      minister, indien Nederland referentielidstaat is als bedoeld in dat artikel;

      b. als toepasselijk nationaal voorschrift als bedoeld in onderdeel 6 van bijlage IV bij verordening (EG) nr.
      1234/2008 is aangewezen: [artikel 106b, onderdeel e][ref1], [artikel 106c, eerste lid, onderdelen e en f][ref2].


