  - number: '8'
    text: |-
      In afwijking van [artikel 5, derde lid][ref1], behoeft het dossier bij een aanvraag tot registratie van een
      immunologisch diergeneesmiddel, serum of entstof geen resultaten van veldproeven bij de beoogde diersoort te
      bevatten indien de aanvrager kan aantonen dat deze veldproeven niet kunnen worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel5
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel8
