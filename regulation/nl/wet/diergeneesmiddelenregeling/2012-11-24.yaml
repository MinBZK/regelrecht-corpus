  - number: 15a
    text: |-
      Voor de toepassing van deze paragraaf wordt de minister aangewezen als de bevoegde instantie als bedoeld in artikel
      2, onderdeel 7, onder a, van verordening (EG) nr. 1234/2008, voor zover Nederland is aan te merken als betrokken
      lidstaat als bedoeld in dat artikel.
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel15a
  - number: '16'
    text: |-
      1 Een kennisgeving van een kleine wijziging van de eerste categorie, een aanvraag tot een kleine wijziging van de
      tweede categorie onderscheidenlijk een aanvraag tot een ingrijpende wijziging wordt bij het Bureau ingediend.

      2 Indien een kennisgeving of een aanvraag als bedoeld in het eerste lid betrekking heeft op verscheidene
      wijzigingen, wordt de kennisgeving of aanvraag ingediend met inachtneming van artikel 7 van verordening (EG) nr.
      1234/2008.

      3 De in het eerste lid bedoelde kennisgeving onderscheidenlijk een aanvraag als bedoeld in dat lid bevat de
      elementen, bedoeld in de onderdelen 2, 3 en 4 van Bijlage IV bij verordening (EG) nr. 1234/2008.
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel16
  - number: '17'
    text: |-
      1 Een kennisgeving van een kleine wijziging van de eerste categorie wordt ingediend binnen twaalf maanden na
      de uitvoering van de wijziging. Artikel 8, eerste lid, tweede alinea, van verordening (EG) nr. 1234/2008 is van
      overeenkomstige toepassing.

      2 Een besluit omtrent de in het eerste lid bedoelde wijziging wordt binnen 30 dagen na ontvangst van de in het
      eerste lid bedoelde kennisgeving genomen.

      3 Indien het besluit niet binnen de in het tweede lid bedoelde termijn wordt genomen, wordt de registratie van
      rechtswege gewijzigd overeenkomstig de kennisgeving, bedoeld in [artikel 16, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel16
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel17
