      Ingeval het diergeneesmiddel is bedoeld om mede of uitsluitend te worden toegepast bij voedselproducerende dieren
      bedragen de kosten voor het in behandeling nemen van een aanvraag, inclusief de kosten van het onderzoek, bedoeld
      in [artikel 3, tweede lid, onderdeel b, van de wet][ref1]:

      a. € 21.965 voor een aanvraag als bedoeld in [Hoofdstuk II, paragraaf 2][ref2], indien aan elk van de volgende
      voorwaarden is voldaan:

      1°. [artikel 4, zesde lid, van het besluit][ref3] en [artikel 6, onderdeel a][ref4], zijn niet van toepassing;

      2°. de registratie vindt niet plaats overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG;

      b. € 34.972 voor een aanvraag als bedoeld in [Hoofdstuk II, paragraaf 2][ref5], indien aan elk van de volgende
      voorwaarden is voldaan:

      1°. [artikel 4, zesde lid, van het besluit][ref6] en [artikel 6, onderdeel a][ref7], zijn niet van toepassing;

      2°. de registratie vindt plaats overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG, waarbij Nederland
      referentielidstaat is;

      c. € 5.707 voor een aanvraag als bedoeld in [Hoofdstuk II, paragraaf 2][ref8], indien aan elk van de volgende
      voorwaarden is voldaan:

      1°. [artikel 4, eerste tot en met vijfde lid, van het besluit][ref9] en [artikel 6, onderdeel a][ref10], zijn van
      toepassing;

      2°. [artikel 4, zesde lid, van het besluit][ref11] is niet van toepassing;

      3°. de registratie vindt niet plaats overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG;

      d. € 8.959 voor een aanvraag als bedoeld in [Hoofdstuk II, paragraaf 2][ref12], indien aan elk van de volgende
      voorwaarden is voldaan:

      1°. [artikel 4, eerste tot en met vijfde lid, van het besluit][ref13] en [artikel 6, onderdeel a][ref14], zijn
      van toepassing;

      2°. [artikel 4, zesde lid, van het besluit][ref15] is niet van toepassing;

      3°. de registratie vindt plaats overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG, waarbij Nederland
      referentielidstaat is;

      e. € 21.965 voor een aanvraag tot registratie van een homeopathisch diergeneesmiddel, voorzover de registratie
      plaatsvindt overeenkomstig [artikel 10][ref16];

      f. € 14.378 voor een aanvraag als bedoeld in artikel 32, tweede lid, van richtlijn nr. 2001/82/EG, waarbij
      Nederland wordt verzocht als referentielidstaat op te treden, indien de aanvraag die aan de verleende registratie
      is voorafgegaan aan elk van de volgende voorwaarden voldoet:

      1°. [artikel 4, zesde lid, van het besluit][ref17] en [artikel 6, onderdeel a][ref18], waren niet van toepassing;

      2°. de registratie heeft niet plaatsgevonden overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG;

      3°. uit de aanvraag blijkt niet dat de registratie mede was bestemd om te worden erkend in een volgende lidstaat,
      als bedoeld in artikel 32 van richtlijn nr. 2001/82/EG;

      g. € 4.025 voor een aanvraag als bedoeld in artikel 32, tweede lid, van richtlijn nr. 2001/82/EG, waarbij Nederland
      wordt verzocht als referentielidstaat op te treden, indien de aanvraag die aan de verleende registratie is
      voorafgegaan aan elk van de volgende voorwaarden voldoet:

      1°. [artikel 4, eerste tot en met vijfde lid, van het besluit][ref19] en [artikel 6, onderdeel a][ref20], waren
      van toepassing;

      2°. [artikel 4, zesde lid, van het besluit][ref21] was niet van toepassing;

      3°. de registratie heeft niet plaatsgevonden overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG;

      4°. uit de aanvraag blijkt niet dat de registratie mede was bestemd om te worden erkend in een volgende lidstaat,
      als bedoeld in artikel 32 van richtlijn nr. 2001/82/EG;

      h. € 13.628 voor een aanvraag als bedoeld in [Hoofdstuk II, paragraaf 2][ref22], indien aan elk van de volgende
      voorwaarden is voldaan:

      1°. [artikel 4, zesde lid, van het besluit][ref23] en [artikel 6, onderdeel a][ref24], zijn niet van toepassing;

      2°. de registratie vindt plaats overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG, waarbij Nederland geen
      referentielidstaat is;

      i. € 3.623 voor een aanvraag als bedoeld in [Hoofdstuk II, paragraaf 2][ref25], indien aan elk van de volgende
      voorwaarden is voldaan:

      1°. [artikel 4, eerste tot en met vijfde lid, van het besluit][ref26] en [artikel 6, onderdeel a][ref27], zijn
      van toepassing;

      2°. [artikel 4, zesde lid, van het besluit][ref28] is niet van toepassing;

      3°. de registratie vindt plaats overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG, waarbij Nederland geen
      referentielidstaat is;

      j. € 4.480 voor een aanvraag als bedoeld in artikel 32, tweede lid, van richtlijn nr. 2001/82/EG, indien voldaan is
      aan elk van de volgende voorwaarden:

      1°. Nederland is referentielidstaat;

      2°. de aanvraag heeft betrekking op een diergeneesmiddel dat reeds eerder op grond van artikel 32 van richtlijn
      nr. 2001/82/EG is geregistreerd;

      3°. met de aanvraag wordt beoogd een eerder verleende registratie als bedoeld in onderdeel 2°, uit te breiden naar
      andere lidstaten;

      k. € 1.344 voor een aanvraag als bedoeld in [Hoofdstuk II, paragraaf 2][ref29], indien
      [artikel 4, zesde lid, van het besluit][ref30] van toepassing is.


