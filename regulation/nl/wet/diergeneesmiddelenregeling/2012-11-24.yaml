  - number: '98'
    text: |-
      1 Het recept voor de aflevering van gemedicineerd voeder aan een houder van dieren, bedoeld in
      [artikel 95, derde lid][ref1], wordt vastgesteld overeenkomstig bijlage A bij richtlijn nr. 90/167/EEG en bestaat
      uit een origineel en drie afschriften.

      2 Het origineel en één afschrift van het recept zijn bestemd voor de bereider van het voorgeschreven gemedicineerde
      voeder.

      3 De overige twee afschriften van het recept zijn bestemd voor de dierenarts en de houder van de dieren.

      4 De bereider, bedoeld in het tweede lid, overlegt het afschrift, bedoeld in het tweede lid, aan de houder van de
      dieren bij de aflevering van het voorgeschreven gemedicineerde voeder.

      5 Een recept geeft slechts recht op een eenmalige behandeling met het voorgeschreven gemedicineerde voeder binnen
      een termijn van drie maanden na dagtekening van het recept.


