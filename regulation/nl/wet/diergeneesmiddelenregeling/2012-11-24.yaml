      nr. 2001/82/EG;

      b. € 4.480, indien de te verlengen registratie heeft plaatsgevonden overeenkomstig artikel 32 van richtlijn
      nr. 2001/82/EG, waarbij Nederland referentielidstaat is geweest;

      c. € 288, indien de te verlengen registratie heeft plaatsgevonden overeenkomstig artikel 32 van richtlijn
      nr. 2001/82/EG, waarbij Nederland geen referentielidstaat is geweest.


