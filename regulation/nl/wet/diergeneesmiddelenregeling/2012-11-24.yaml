  - number: 121f
    text: |-
      In afwijking van [artikel 30, derde lid, onderdeel b, van de wet][ref1], is het apothekers tot en met 15 juni 2009
      toegestaan diergeneesmiddelen als bedoeld in [artikel 77, eerste lid, onderdeel n][ref2], zonder recept van een
      dierenarts af te leveren aan houders van dieren.


