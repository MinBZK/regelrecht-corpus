  - number: '79'
    text: |-
      1 Als groepen als bedoeld in [artikel 30, tweede lid, onderdeel f, van de wet][ref1] worden
      aangewezen dierverloskundigen en castreurs als bedoeld in [artikel 5][ref2] onderscheidenlijk
      [artikel 6 van de Wet op de uitoefening van de diergeneeskunde 1990][ref3] .

      2 Als diergeneesmiddelen, die aan personen behorende tot de groep der dierverloskundigen, bedoeld in het eerste
      lid, mogen worden afgeleverd, worden aangewezen:

      a. diergeneesmiddelen uitsluitend bestemd voor intra-uterine toediening, welke als werkzaam bestanddeel uitsluitend
      oxytetracycline, chloortetracycline of tetracycline hycrochloride bevatten;

      b. hormoonpreparaten die geen andere werking hebben dan de beïnvloeding van de contractiliteit van de uterus;

      c. diergeneesmiddelen uitsluitend geschikt voor orale of nasale toediening, die als werkzaam bestanddeel
      uitsluitend prethcamide bevatten;

      d. vloeistof voor intraveneuze toediening, welke vloeistof als werkzame bestanddelen slechts calcium en magnesium
      bevat in een hoeveelheid van ten hoogste 500 ml;

      e. diergeneesmiddelen die als werkzaam bestanddeel lidocaïne bevatten bestemd voor epiduraalanesthesie bij
      embryotomie;

      f. diergeneesmiddelen die behoren tot de groep prostaglandinen;

      g. de diergeneesmiddelen ‘Buscopan’ en ‘Vetalgin’;

      h. diergeneesmiddelen met een combinatie van de werkzame stoffen ‘Trimethoprim’ en ‘Sulfadoxine’;

      i. vloeistof bestemd voor intraveneuze toediening bij runderen, welke vloeistof als werkzaam bestanddeel
      uitsluitend glucose bevat.

      3 Als diergeneesmiddelen, die aan personen behorende tot de groepen, bedoeld in het eerste lid, mogen worden
      afgeleverd, worden aangewezen:

      a. antimicrobiële- en resistentie inducerende diergeneesmiddelen, voor zover deze geschikt zijn voor en dienen ten
      behoeve van wondbehandeling ten gevolge van castratie of verlossing met uitzondering van die welke chlooramp⁠henicol
      bevatten;

      b. penicilline-G, streptomycines en tetracyclines uitsluitend geschikt voor intramusculaire toediening.

      4 Als diergeneesmiddelen, die aan personen behorende tot de groep castreurs, bedoeld in het eerste lid, mogen
      worden afgeleverd, worden aangewezen:

      a. lokale anesthetica voor injectie voor zover deze geschikt zijn voor en dienen om een castratie pijnloos te laten
      verlopen;

      b. diergeneesmiddelen die uitsluitend als werkzaam bestanddeel xylazine bevatten voor zover deze geschikt zijn voor
      en dienen om een castratie goed te laten verlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel30
