  - number: '87'
    text: |-
      1 Een houder van een vergunning voor het afleveren van diergeneesmiddelen als bedoeld in
      [artikel 21 van de wet][ref1] voert een administratie inzake iedere transactie met diergeneesmiddelen.

      2 De administratie, bedoeld in het eerste lid, inzake de aankoop van diergeneesmiddelen bevat de facturen behorende
      bij de ontvangst met daarop of daarbij ten minste de volgende gegevens:

      a. datum van de transactie;

      b. benaming en, in voorkomend geval, het registratienummer van het diergeneesmiddel;

      c. partijnummer;

      d. uiterste gebruiksdatum;

      e. ontvangen hoeveelheid;

      f. naam van de leverancier;

      3 De administratie, bedoeld in het eerste lid, inzake de aflevering van diergeneesmiddelen aan een dierenarts, een
      apotheker onderscheidenlijk een persoon als bedoeld [artikel 30, tweede lid, onderdeel f, van de wet][ref2], bevat
      de kopieën van facturen met daarop of daarbij ten minste de volgende gegevens:

      a. datum van de transactie;

      b. benaming en, in voorkomend geval, het registratienummer van het diergeneesmiddel;

      c. partijnummer;

      d. uiterste gebruiksdatum;

      e. afgeleverde hoeveelheid, en

      f. naam en adres van de ontvanger.

      4 De administratie, bedoeld in het eerste lid, inzake de aflevering van diergeneesmiddelen aan een houder van een
      vergunning als bedoeld in [artikel 21 van de wet][ref3], bevat:

      a. een betaalbewijs, voor zover het een transactie tegen betaling betreft, en

      b. een bewijs voor aflevering met de gegevens, bedoeld in het derde lid.

      5 De administratie, bedoeld in het eerste lid, inzake de aflevering van diergeneesmiddelen waarop de bepalingen van
      [hoofdstuk IV van de wet][ref4] van toepassing zijn en diergeneesmiddelen waarvoor een wachttermijn geldt, aan een
      houder van dieren bevat:

      a. het recept, bedoeld in [artikel 97][ref5], voor zover een recept is uitgeschreven, en

      b. kopieën van facturen met daarop of daarbij ten minste de volgende gegevens:

      1°. datum van de transactie;

      2°. benaming en, in voorkomend geval, het registratienummer van het diergeneesmiddel;

      3°. partijnummer;

      4°. afgeleverde hoeveelheid, en

      5°. naam en adres van de ontvanger of uniek bedrijfsnummer van de locatie waarop de dieren gehouden worden.


