  - number: 121e
    text: |-
      Tot en met 15 juni 2009 kunnen houders van een vergunning voor het afleveren van diergeneesmiddelen
      als bedoeld in [artikel 21, eerste lid, van de wet][ref1], personen die diergeneesmiddelen als bedoeld
      in [artikel 31, eerste lid, onderdeel b, van het besluit][ref2] afleveren, dierenartsen en apothekers
      primaire verpakkingen en, in voorkomend geval, buitenverpakkingen van diergeneesmiddelen als bedoeld in
      [artikel 77, eerste lid, onderdeel n][ref3], afleveren, voorhanden en in voorraad hebben waarop in afwijking van
      [artikel 62, onderdeel f][ref4] en [artikel 66, onderdeel a][ref5], de volgende aanduidingen niet zijn vermeld:

      a. diergeneesmiddel, uitsluitend aflevering door de dierenarts of op recept van de dierenarts door de apotheker;

      b. geneesmiddel voor diergeneeskundig gebruik, uitsluitend aflevering door de dierenarts of op recept van de
      dierenarts door de apotheker, of

      c. uitsluitend aflevering door de dierenarts of op recept van de dierenarts door de apotheker, dan wel ‘U.D.A.’.


