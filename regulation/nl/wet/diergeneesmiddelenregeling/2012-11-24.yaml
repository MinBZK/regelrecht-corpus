  - number: '92'
    text: |-
      1 Onverminderd het bepaalde in [artikel 90][ref1], tekent de dierenarts bij toediening aan een voedselproducerend
      dier van een diergeneesmiddel als bedoeld in artikel 90, eerste lid, of [91, eerste of tweede lid][ref2], in de
      administratie van de houder van dieren aan:

      a. de datum van de behandeling met diergeneesmiddelen voor zover door de dierenarts uitgevoerd;

      b. benaming en, in voorkomend geval, registratienummer van het diergeneesmiddel;

      c. de identificatie van de behandelde dieren;

      d. de in acht te nemen wachttermijn.

      2 Indien het diergeneesmiddel, bedoeld in [artikel 90][ref3] een stof is als bedoeld in bijlage II bij richtlijn
      nr. 96/22/EG, waarvan toediening is toegestaan op grond van artikel 4 van die richtlijn, tekent de dierenarts,
      onverminderd het bepaalde in het eerste lid, in de administratie, bedoeld in het eerste lid, tevens aan:

      a. het doel van de behandeling;

      b. de wijze van toediening van het diergeneesmiddel.

      3 De administratie, bedoeld in [artikel 90, eerste lid][ref4], en [artikel 91, tweede lid][ref5], en de bescheiden
      die verband houden met de aantekeningen in de administratie worden gedurende vijf jaar bewaard.

      4 Voor zover de toediening, bedoeld in het eerste lid, van een diergeneesmiddel als
      bedoeld in [artikel 90, eerste lid][ref6], geschiedt door een persoon als bedoeld in
      [artikel 30, tweede lid, onderdeel f][ref7], zijn het eerste, tweede en vierde lid van overeenkomstige toepassing.


