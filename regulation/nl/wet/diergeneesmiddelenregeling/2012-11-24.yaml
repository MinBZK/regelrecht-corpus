  - number: '6'
    text: |-
      In afwijking van [artikel 5, derde lid][ref1], behoeft het dossier van een aanvraag tot registratie van een
      diergeneesmiddel geen resultaten van onschadelijkheids- en residuproeven of van de preklinische of klinische
      proeven als bedoeld in artikel 12, derde lid, onderdeel j, van [richtlijn nr. 2001/82/EG](32001L0082) te bevatten,
      indien de aanvrager van een registratie van een diergeneesmiddel kan aantonen:

      a. dat het diergeneesmiddel in wezen gelijk is aan een diergeneesmiddel dat reeds is geregistreerd dan wel in
      voorkomend geval geregistreerd is of is geweest in een lidstaat of

      b. door middel van een wetenschappelijke bibliografie dat de werkzame stoffen van het diergeneesmiddel ten minste
      10 jaar zonder problemen in de Europese Unie zijn gebruikt en dat de werkzame stoffen een erkende werkzaamheid
      alsmede een aanvaardbaar veiligheidsniveau bieden overeenkomstig bijlage I bij [richtlijn nr. 2001/82/EG]
      (32001L0082).


      [ref1]: https://wetten.overheid.nl/BWBR0019277#Artikel5
    url: https://wetten.overheid.nl/BWBR0019277/2012-11-24#Artikel6
    references:
      - id: ref1
