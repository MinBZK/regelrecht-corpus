  - number: 106c
    text: |-
      1 De kosten voor het in behandeling nemen van een aanvraag tot wijziging van een registratie als bedoeld in
      [Hoofdstuk II, paragraaf 5][ref1], bedragen:

      a. € 336 voor een aanvraag tot een ingrijpende wijziging, indien voldaan is aan elk van de volgende voorwaarden:

      1° er vindt geen onderzoek als bedoeld in [artikel 3, tweede lid, onderdeel b, van de wet][ref2] plaats;

      2° de aanvraag heeft niet plaatsgevonden overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG;

      b. € 1.568 voor een aanvraag tot een ingrijpende wijziging, indien voldaan is aan elk van de volgende voorwaarden:

      1° er vindt geen onderzoek als bedoeld in [artikel 3, tweede lid, onderdeel b, van de wet][ref3] plaats;

      2° de aanvraag heeft plaatsgevonden overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG, waarbij Nederland
      referentielidstaat is geweest;

      c. € 448 voor een aanvraag tot een ingrijpende wijziging, indien voldaan is aan elk van de volgende voorwaarden:

      1° er vindt geen onderzoek als bedoeld in [artikel 3, tweede lid, onderdeel b, van de wet][ref4] plaats;

      2° de aanvraag heeft plaatsgevonden overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG, waarbij Nederland geen
      referentielidstaat is geweest;

      d. € 336 voor een aanvraag tot een kleine wijziging van de tweede categorie, indien voldaan is aan elk van de
      volgende voorwaarden:

      1° er vindt geen onderzoek als bedoeld in [artikel 3, tweede lid, onderdeel b, van de wet][ref5] plaats;

      2° de aanvraag heeft niet plaatsgevonden overeenkomstig 32 van richtlijn nr. 2001/82/EG;

      e. € 1.568 voor een aanvraag tot een kleine wijziging van de tweede categorie, indien voldaan is aan elk van de
      volgende voorwaarden:

      1° er vindt geen onderzoek als bedoeld in [artikel 3, tweede lid, onderdeel b, van de wet][ref6] plaats;

      2° de aanvraag heeft plaatsgevonden overeenkomstig 32 van richtlijn nr. 2001/82/EG, waarbij Nederland
      referentielidstaat is geweest;

      f. € 448 voor een aanvraag tot een kleine wijziging van de tweede categorie, indien voldaan is aan elk van de
      volgende voorwaarden:

      1° er vindt geen onderzoek als bedoeld in [artikel 3, tweede lid, onderdeel b, van de wet][ref7] plaats;

      2° de aanvraag heeft plaatsgevonden overeenkomstig 32 van richtlijn nr. 2001/82/EG, waarbij Nederland geen
      referentielidstaat is geweest;

      g. € 336 voor een aanvraag tot een kleine wijziging van de eerste categorie, indien voldaan is aan elk van de
      volgende voorwaarden:

      1° er vindt geen onderzoek als bedoeld in [artikel 3, tweede lid, onderdeel b, van de wet][ref8] plaats;

      2° de aanvraag heeft niet plaatsgevonden overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG;

      h. € 1.568 voor een aanvraag tot een kleine wijziging van de eerste categorie, indien voldaan is aan elk van de
      volgende voorwaarden:

      1° er vindt geen onderzoek als bedoeld in [artikel 3, tweede lid, onderdeel b, van de wet][ref9] plaats;

      2° de aanvraag heeft plaatsgevonden overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG, waarbij Nederland
      referentielidstaat is geweest;

      i. € 448 voor een aanvraag tot een kleine wijziging van de eerste categorie, indien voldaan is aan elk van de
      volgende voorwaarden:

      1° er vindt geen onderzoek als bedoeld in [artikel 3, tweede lid, onderdeel b, van de wet][ref10] plaats;

      2° de aanvraag heeft plaatsgevonden overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG, waarbij Nederland geen
      referentielidstaat is geweest.

      2 Indien door één aanvrager uitsluitend met het oog op een zelfde wijziging van verschillende registraties
      gelijktijdig meer dan één aanvraag tot een kleine wijziging van de eerste categorie wordt ingediend, bedragen de
      kosten, bedoeld in het eerste lid, onderdelen g, h en i, in totaal niet meer dan € 2.990.


