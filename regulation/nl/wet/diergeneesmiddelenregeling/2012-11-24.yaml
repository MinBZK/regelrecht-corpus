  - number: '90'
    text: |-
      1 Een dierenarts voert een administratie inzake transacties met diergeneesmiddelen waarop de bepalingen van
      [hoofdstuk IV van de wet][ref1] van toepassing zijn en diergeneesmiddelen waarvoor een wachttermijn geldt.

      2 De administratie, bedoeld in het eerste lid, inzake de ontvangst van diergeneesmiddelen bevat de facturen met
      daarop of daarbij ten minste de volgende gegevens:

      a. datum van de transactie;

      b. benaming en, in voorkomend geval, het registratienummer van het diergeneesmiddel;

      c. partijnummer;

      d. ontvangen hoeveelheid;

      e. naam van de leverancier;

      3 De administratie, bedoeld in het eerste lid, inzake het voorschrijven van diergeneesmiddelen door een dierenarts
      die deze niet zelf aflevert, bevat een afschrift van het door de dierenarts opgestelde recept, bedoeld in
      [artikel 97][ref2].

      4 De administratie, bedoeld in het eerste lid, inzake de aflevering van diergeneesmiddelen bevat:

      a. voor zover een recept als bedoeld in [artikel 97][ref3] is uitgeschreven, een afschrift van dat recept en

      b. kopieën van facturen met daarop of daarbij ten minste de volgende gegevens:

      1°. datum van de transactie;

      2°. benaming en, in voorkomend geval, het registratienummer van het diergeneesmiddel;

      3°. partijnummer;

      4°. afgeleverde hoeveelheid, en

      5°. naam en adres van de ontvanger of uniek bedrijfsnummer van de locatie waarop de dieren worden gehouden.

      5 Het vierde lid is van overeenkomstige toepassing op de toediening van diergeneesmiddelen door de dierenarts, met
      dien verstande dat in onderdeel b, onder 4, onder afgeleverde hoeveelheid wordt verstaan toegediende hoeveelheid.

      6 Voor zover een apotheker de transacties, bedoeld in het eerste lid, verricht, zijn het eerste, tweede en vierde
      lid van overeenkomstige toepassing.

      7 Voor zover een persoon als bedoeld in [artikel 30, tweede lid, onderdeel f, van de wet][ref4], de transacties,
      bedoeld in het eerste lid, verricht, zijn het eerste, tweede en vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0019277#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0019277#Artikel97
      [ref4]: https://wetten.overheid.nl/BWBR0003818#Artikel30
