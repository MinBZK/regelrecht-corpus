  - number: '19'
    text: |-
      1 Een besluit omtrent een ingrijpende wijziging wordt binnen de volgende termijn genomen:

      a. 90 dagen nadat door het Bureau de ontvangst van de aanvraag is bevestigd aan de aanvrager, ingeval het een
      wijziging betreft als vermeld in bijlage V bij verordening (EG) nr. 1234/2008;

      b. 60 dagen nadat door het Bureau de ontvangst van een aanvraag daartoe is bevestigd aan de aanvrager in andere
      gevallen.

      2 In afwijking van [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref1] kan een aanvrager gedurende
      zes maanden in de gelegenheid worden gesteld om een aanvraag aan te vullen, ingeval niet is voldaan aan de eisen,
      gesteld in [artikel 16][ref2], of de bij de aanvraag verstrekte gegevens en bescheiden onvoldoende zijn voor de
      beoordeling van de aanvraag of voor de voorbereiding van het besluit.

      3 Indien een aanvrager in een gelegenheid als bedoeld in het tweede lid wordt gesteld, wordt een besluit in
      afwijking van het eerste lid genomen binnen 210 dagen nadat door het Bureau de ontvangst van aanvullingen op de
      aanvraag is bevestigd.


