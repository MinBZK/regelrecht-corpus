      in [artikel 3, tweede lid, onderdeel b, van de wet][ref1], bedragen € 4.457 voor een aanvraag als bedoeld in
      [artikel 14][ref2].

      2 In afwijking van het eerste lid bedragen de kosten € 896, indien het diergeneesmiddel dat betrokken wordt uit
      een andere lidstaat en het diergeneesmiddel waarvoor reeds een registratie is verleend, beide zijn vervaardigd door
      dezelfde fabrikant of door fabrikanten die vennootschapsrechtelijk of contractueel met elkaar verbonden zijn.


