  - number: 106b
    text: |-
      De kosten voor het in behandeling nemen van een aanvraag tot wijziging van een registratie als
      bedoeld in [Hoofdstuk II, paragraaf 5][ref1], inclusief de kosten van het onderzoek, bedoeld in
      [artikel 3, tweede lid, onderdeel b, van de wet][ref2], bedragen:

      a. € 8.626 voor een aanvraag tot een ingrijpende wijziging, indien deze niet heeft plaatsgevonden overeenkomstig
      artikel 32 van richtlijn nr. 2001/82/EG;

      b. € 8.626 voor een aanvraag tot een ingrijpende wijziging, indien deze heeft plaatsgevonden overeenkomstig artikel
      32 van richtlijn nr. 2001/82/EG, waarbij Nederland referentielidstaat is geweest;

      c. € 8.626 voor een aanvraag tot een ingrijpende wijziging, indien deze heeft plaatsgevonden overeenkomstig artikel
      32 van richtlijn nr. 2001/82/EG, waarbij Nederland geen referentielidstaat is geweest;

      d. € 1.956 voor een aanvraag tot een kleine wijziging van de tweede categorie, indien de te wijzigen registratie
      niet heeft plaatsgevonden overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG;

      e. € 1.956 voor een aanvraag tot een kleine wijziging van de tweede categorie, indien de te wijzigen registratie
      heeft plaatsgevonden overeenkomstig artikel 32 van richtlijn nr. 2001/82/EG, waarbij Nederland referentielidstaat
      is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0019277#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel3
