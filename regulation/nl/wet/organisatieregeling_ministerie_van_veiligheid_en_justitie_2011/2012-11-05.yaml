  - number: '18'
    text: |-
      1 De directie Bedrijfsvoering en Ondersteuning Bestuursdepartement (DBOB) verzorgt voor het bestuursdepartement de
      levering van diensten op het gebied van grafische voorzieningen, inkoopondersteuning en diensten op het gebied van
      post en documentaire informatievoorziening.

      2 De directie bestaat uit:

      a. de afdeling Grafische Voorzieningen;

      b. de afdeling Inkoop;

      c. de afdeling Post;

      d. de afdeling Documentaire Informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel18
  - number: '19'
    text: |-
      1 Het Dienstencentrum i.o. (DC) verzorgt voor het bestuursdepartement de levering van diensten op het gebied van
      huisvesting, werkplekservices en informatievoorziening.

      2 Het Dienstencentrum i.o. bestaat uit :

      a. het cluster Klantmanagement;

      b. het cluster Leveranciersmanagement;

      c. het cluster Portfoliomanagement;

      d. het cluster Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel19
  - number: '20'
    text: |-
      1 De baten-lastendienst Gemeenschappelijk Dienstencentrum ICT (GDI) is belast met het leveren van generieke ICT-
      beheerdiensten (financiële systemen, websites en infrastructurele ICT-diensten), specifieke ICT-beheerdiensten
      (beheer van netwerk, werkplekken en applicaties) aan het ministerie en andere ministeries.

      2 Het GDI bestaat uit:

      a. de afdeling Bedrijfsvoering;

      b. de afdeling Business Development;

      c. de afdeling Front Office;

      d. de afdeling Beheer.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel20
  - number: '21'
    text: |-
      De Projectendirectie Huisvesting is belast met het realiseren van beleid, kaders en richtlijnen op het terrein van
      huisvesting en daarmee verband houdende faciliteiten alsmede met de uitvoering van huisvestingsprojecten voor het
      ministerie en aan het ministerie gerelateerde internationale organisaties.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel21
  - number: '22'
    text: |-
      De Beleidsacademie is belast met de ontwikkeling en organisatie van opleidingsprogramma’s ten behoeve van alle
      beleidsambtenaren van het ministerie.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel22
  - number: '23'
    text: |-
      1 Het directoraat-generaal Jeugd en Sanctietoepassing (DGJS) is belast met:

      a. het ontwikkelen en uitvoeren van beleid voor de bescherming en begeleiding van jeugdigen in onveilige
      opvoedsituaties en voor een persoonsgerichte en groepsgerichte aanpak van jeugdigen die in aanraking komen of
      dreigen te komen met politie en Justitie;

      b. het ontwikkelen en uitvoeren van beleid voor slachtoffers van geweld en criminaliteit;

      c. de bescherming van personen en instellingen tegen criminaliteit, recidive en onveiligheid;

      d. een effectieve en integrale tenuitvoerlegging van straffen en maatregelen inclusief de regie op dit deel van
      de strafrechtketen.

      2 Het directoraat-generaal bestaat uit een stafondersteuning en de volgende dienstonderdelen:

      a. de directie Sanctie- en Preventiebeleid (DSP);

      b. de directie Justitieel Jeugdbeleid (DJJ);

      c. de directie Control, Bedrijfsvoering en Juridische Zaken (CBJ);

      d. de baten-lastendienst Dienst JUSTIS;

      e. de baten-lastendienst Dienst Justitiële Inrichtingen (DJI);

      f. de raad voor de kinderbescherming (RvdK);

      g. het bureau van de Erkenningscommissie Gedragsinterventies Justitie.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel23
  - number: '24'
    text: |-
      1 De directeur-generaal wordt secretarieel, organisatorisch en administratief ondersteund door de
      stafondersteuning.

      2 Bij de directeur-generaal is het programma Modernisering Gevangeniswezen ondergebracht.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel24
  - number: '25'
    text: |-
      1 De directie Sanctie- en Preventiebeleid (DSP) is belast met de advisering aan de departementsleiding over en
      de coördinatie, ontwikkeling en evaluatie van beleid dat gericht is op het bevorderen van de veiligheid van de
      maatschappij door:

      a. de consequente en effectieve tenuitvoerlegging van vrijheidsbenemende en vrijheidsbeperkende straffen en
      maatregelen bij volwassenen;

      b. de vermindering van de recidive door gedragsinterventies en goede aansluiting op maatschappelijke opvang;

      c. het aanbieden van dienstverlening aan slachtoffers van criminaliteit;

      d. het voorkomen van criminaliteit door inzet van preventieve maatregelen met het oog op een veilige en
      rechtvaardige samenleving.

      2 Tevens is de directie belast met de advisering aan de departementsleiding over en de ontwikkeling, coördinatie en
      evaluatie van beleid dat gericht is op het reguleren en beheersen van kansspelen met bijzondere aandacht voor een
      passend en attractief aanbod van kansspelen, het beschermen van de consument, het tegengaan van kansspelverslaving
      en het tegengaan van illegaliteit en criminaliteit. De directie onderhoudt daartoe ook de relatie met de
      kansspelautoriteit.

      3 De directie heeft op haar terrein een coördinerende taak in de besturing en beleidsvoering van de Dienst JUSTIS
      en de dienst Justitiële Inrichtingen, voor zover het haar beleidsterrein betreft.

      4 De directie is beleidsmatig en budgettair verantwoordelijk voor de door de directie gesubsidieerde organisaties
      en instellingen en stuurt deze aan.

      5 De directie wordt ondersteund door een staf en bestaat uit:

      a. de afdeling Sanctie- en Reclasseringsbeleid;

      b. de afdeling Preventie- en Slachtofferbeleid;

      c. het programma Justitiële Voorwaarden;

      d. het programma Gewelddadige Vermogenscriminaliteit;

      e. het programma Modernisering Kansspelen;

      f. het programma Uitvoeringsketen Strafrechtelijke Beslissingen;

      g. het secretariaat van het Schadefonds Geweldsmisdrijven (secretariaat SGM);

      h. het secretariaat van de Raad voor strafrechtstoepassing en jeugdbescherming (secretariaat RSJ).

      6 De in het vijfde lid onder g en h, genoemde dienstonderdelen zijn belast met de bedrijfsvoering en ondersteuning
      van de in die onderdelen genoemde instellingen.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel25
  - number: '26'
    text: |-
      1 De directie Justitieel Jeugdbeleid (DJJ) is belast met de advisering aan de departementsleiding over en de
      coördinatie, ontwikkeling en evaluatie van beleid dat zich richt op:

      a. de bescherming van minderjarigen;

      b. het voorkomen en aanpakken van bedreigende situaties voor kinderen en gezinnen;

      c. het met justitiële instrumenten voorkomen en aanpakken van jeugdcriminaliteit;

      d. de bevordering van een samenhangende strafrechtelijke en pedagogische aanpak van de jeugdige nadat deze zich
      schuldig heeft gemaakt aan strafwaardig gedrag.

      2 De directie heeft een adviserende taak in de besturing en beleidsvoering van de raad voor de kinderbescherming en
      de dienst Justitiële Inrichtingen, voor zover het haar beleidsterrein betreft.

      3 De directie is beleidsmatig en budgettair verantwoordelijk voor de door de directie gesubsidieerde
      organisaties en instellingen en stuurt deze aan. Daarnaast onderhoudt de directie de besturingsrelatie
      omtrent de doeluitkeringen aan de provincies en grootstedelijke regio’s ten aanzien van de jeugdbescherming en
      jeugdreclassering.

      4 De directie heeft verder tot taak het Landelijk Bureau Inning Onderhoudsbijdragen beheersmatig en financieel aan
      te sturen.

      5 De directie wordt ondersteund door een staf en bestaat uit:

      a. de afdeling Jeugdbescherming;

      b. de afdeling Jeugdsancties en -preventie;

      c. het programma Doorontwikkeling Veiligheidshuizen;

      d. het programma Jeugdcriminaliteit en Jeugdgroepen;

      e. het programma Stelselwijziging Jeugd.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel26
  - number: '27'
    text: |-
      1 De directie Control, Bedrijfsvoering en Juridische Zaken (CBJ) is belast met een integrale controltaak
      en advisering daarover aan de directeur-generaal Jeugd en Sanctietoepassing en de directeuren Sanctie- en
      Preventiebeleid en Justitieel Jeugdbeleid. De controltaak omvat in ieder geval de financiële en beleidsmatige
      control ten aanzien van de taakorganisaties, rechtspersonen met een wettelijke taak, zelfstandige bestuursorganen
      en gesubsidieerde organisaties en instellingen op het terrein van DGJS.

      2 Daarnaast is de directie belast met het gevraagd en ongevraagd advies uitbrengen over bedrijfsvoerings- en
      juridische vraagstukken, het ondersteunen bij en voeren van juridische procedures en de verzorging van de interne
      bedrijfsvoering.

      3 De uitvoering van de werkzaamheden van de Centrale autoriteit interlandelijke adoptie, de Centrale autoriteit
      internationale kinderbescherming en de Centrale autoriteit internationale kinderontvoering is binnen de directie
      belegd bij de in het vierde lid, onder c, genoemde afdeling.

      4 De directie bestaat uit:

      a. de afdeling Control;

      b. de afdeling Bedrijfsvoering;

      c. de afdeling Juridische en Internationale Zaken.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel27
  - number: '28'
    text: |-
      De baten-lastendienst Dienst JUSTIS is belast met het namens de minister nemen van besluiten en verwerken van
      informatie ter bevordering van een betrouwbare, veilige en rechtvaardige samenleving in sectoren met kwetsbare
      belangen.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel28
  - number: '29'
    text: |-
      De baten-lastendienst Dienst Justitiële inrichtingen (DJI) is belast met het tenuitvoerleggen van vrijheidsstraffen
      en vrijheidsbenemende maatregelen en met het voorbereiden van de aan de zorg van de minister toevertrouwde personen
      op hun succesvolle terugkeer naar de maatschappij, binnen of buiten Nederland. Tevens is DJI belast met het
      behandelen van rechtshulpverzoeken inzake de overdracht en overname van de tenuitvoerlegging van vrijheidsstraffen
      en vrijheidsbenemende maatregelen op grond van de Wet overdracht tenuitvoerlegging strafvonnissen.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel29
  - number: '30'
    text: |-
      De raad voor de kinderbescherming (RvdK) is belast met het waarborgen van het fundamentele recht van het kind
      op een gezonde en evenwichtige ontwikkeling en uitgroei naar volwassenheid. De raad voert de volgende taken uit:
      beschermingszaken, scheiding en omgang, adoptie en strafzaken.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel30
  - number: '31'
    text: |-
      Het bureau van de Erkenningscommissie Gedragsinterventies Justitie is belast met de bedrijfsvoering en de
      ondersteuning van de Erkenningscommissie Gedragsinterventies Justitie.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel31
  - number: '32'
    text: |-
      1 Het directoraat-generaal Politie (DGPOL) is belast met:

      a. de verantwoordelijkheid voor het functioneren van de politieorganisatie en het leveren van politiezorg;

      b. het ontwikkelen van een visie op de kwaliteit, de inrichting en de ontwikkeling van de politieorganisatie.

      2 Ter uitvoering van de taken, bedoeld in het eerste lid, is het directoraat-generaal in het bijzonder belast met:

      a. de invoering van een stelsel van nationale politie;

      b. beleidsontwikkeling op het terrein van de politie;

      c. het vaststellen van beleidskaders voor de politieorganisatie en de uitvoering van politietaken, gericht op het
      realiseren van de beleidsprioriteiten van de minister en de gezagsdragers;

      d. het creëren van condities voor een goed en slagvaardig functionerend politieapparaat.

      3 Tot het directoraat-generaal behoren de portefeuille Politie en de portefeuille Vorming nationale politie alsmede
      de volgende dienstonderdelen:

      a. het bureau directoraat-generaal Politie (BDG Politie);

      b. het programma Financiën directoraat-generaal Politie (FDG Politie);

      c. het bureau Korpsbeheer en relatiebeheer agentschappen (KOBRA);

      d. de baten-lastendienst Korps landelijke politiediensten (KLPD);

      e. het korps politie Bonaire, Sint Eustatius en Saba (korps politie BES);

      f. het brandweerkorps Bonaire, Sint Eustatius en Saba (brandweerkorps BES).
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel32
  - number: '33'
    text: |-
      1 De portefeuille Politie heeft betrekking op het functioneren van de politiezorg en bestaat uit:

      a. het programma Bekostiging en Monitoring;

      b. het programma Bestuur en Organisatie;

      c. het programma Personeel en Materieel;

      d. het programma Veiligheid, Informatie en Technologie;

      e. het programma Overdracht Taken en Onderwijs.

      2 Het programma Bekostiging en Monitoring is belast met het beleid inzake de bekostiging en monitoring van de
      politie.

      3 Het programma Bestuur en Organisatie is belast met het ontwikkelen van beleid inzake de taakuitvoering en
      bevoegdheden van de politie en de besluitvorming over de landelijke prioriteiten van de politie.

      4 Het programma Personeel en Materieel is belast met het beleid inzake kwaliteit van personeel en materieel van
      de politie.

      5 Het programma Veiligheid, Informatie en Technologie is belast met het beleid ten aanzien van de
      informatiehuishouding en innovatie van de politie en de veiligheidsregio’s.

      6 Het programma Overdracht Taken en Onderwijs is belast met het beleid ten aanzien van het politie-onderwijs.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel33
  - number: '34'
    text: |-
      1 De portefeuille Vorming nationale politie heeft betrekking op de beleidsontwikkeling inzake de vorming van de
      nationale politie en het relatiebeheer van de politiekorpsen en de veiligheidsregio’s.

      a. het programma Doorontwikkeling Politiebestel;

      b. het programma Relatiebeheer.

      2 Het programma Doorontwikkeling Politiebestel is belast met de beleidsontwikkeling inzake de vorming van de
      nationale politie.

      3 Het programma Relatiebeheer is belast met het relatiebeheer van de politiekorpsen en de veiligheidsregio’s.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel34
  - number: '35'
    text: |-
      Het bureau directoraat-generaal Politie (BDG Politie) heeft tot taak het ondersteunen van het managementteam van
      het directoraat-generaal Politie bij de uitvoering van de beleids- en beheertaken van het directoraat-generaal.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel35
  - number: '36'
    text: |-
      Het programma Financiën DG-Politie (FDG Politie) heeft tot taak het ondersteunen van het directoraat-generaal
      Politie en daaronder ressorterende dienstonderdelen bij de uitvoering van de op het directoraat-generaal betrekking
      hebbende begrotingsartikelen.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel36
  - number: '37'
    text: |-
      Het bureau Korpsbeheer en relatiebeheer agentschappen (KOBRA) heeft de volgende taken:

      a. het adviseren en ondersteunen van de directeur-generaal Politie bij de uitvoering van diens taken als
      gemandateerd beheerder van het Korps landelijke politiediensten, het korps politie Bonaire, Sint Eustatius en Saba
      en het brandweerkorps Bonaire, Sint Eustatius en Saba en als beheerder van de Onderzoeksraad voor Veiligheid;

      b. het adviseren en ondersteunen van de functionarissen die op basis van ondermandaat door de directeur-generaal
      Politie als gemandateerd beheerder van het korps politie Bonaire, Sint Eustatius en Saba en het brandweerkorps
      Bonaire, Sint Eustatius en Saba uitvoeren;

      c. het faciliteren van het Korps landelijke politiediensten, het korps politie Bonaire, Sint Eustatius en Saba, het
      brandweerkorps Bonaire, Sint Eustatius en Saba en de Onderzoeksraad voor Veiligheid in de relatie met de beheerder;

      c. het faciliteren van de beleidsbepaling en kaderstelling ten aanzien van het Korps landelijke politiediensten,
      korps politie Bonaire, Sint Eustatius en Saba, het brandweerkorps Bonaire, Sint Eustatius en Saba en de
      Onderzoeksraad voor Veiligheid;

      d. het faciliteren van het Korps landelijke politiediensten, het korps politie Bonaire, Sint Eustatius en Saba,
      het brandweerkorps Bonaire, Sint Eustatius en Saba en de Onderzoeksraad voor Veiligheid in de relaties met het
      ministerie.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel37
  - number: '38'
    text: |-
      De baten-lastendienst Korps landelijke politiediensten (KLPD) is belast met de taken, bedoeld in
      [artikel 38 van de Politiewet 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38
