  - number: '2'
    text: |-
      Het ministerie heeft een hoofdstructuur, bestaande uit de volgende dienstonderdelen (clusters):

      a. het cluster secretaris-generaal (SG-cluster);

      b. het cluster plaatsvervangend secretaris-generaal (pSG-cluster);

      c. het directoraat-generaal Jeugd en Sanctietoepassing (DGJS);

      d. het directoraat-generaal Politie (DGPOL);

      e. het directoraat-generaal Rechtspleging en Rechtshandhaving (DGRR);

      f. de Nationaal Coördinator Terrorismebestrijding en Veiligheid (NCTV);

      g. de Inspectie Veiligheid en Justitie (IVenJ).
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel2
  - number: '3'
    text: |-
      1 De secretaris-generaal is ambtelijk eindverantwoordelijk voor de leiding van de in [artikel 2][ref1] genoemde
      dienstonderdelen.

      2 De secretaris-generaal wordt bij afwezigheid vervangen door de plaatsvervangend secretaris-generaal. Bij
      afwezigheid van de secretaris-generaal en de plaatsvervangend secretaris-generaal worden zij vervangen door de
      ambtenaar die door de minister is aangewezen als loco-secretaris-generaal. Bij afwezigheid van de loco-secretaris-
      generaal wordt deze vervangen door de directeuren-generaal, in volgorde van de datum van benoeming.

      3 De hoofden van de clusters zijn belast met de beleids- en bedrijfsvoering van de tot hun cluster behorende
      onderdelen. Eén van de tot het directoraat-generaal behorende directeuren wordt op voordracht van de betreffende
      directeur-generaal namens de minister door de secretaris-generaal aangewezen als plaatsvervangend directeur-
      generaal. De tweede volzin is van overeenkomstige toepassing op de Nationaal Coördinator Terrorismebestrijding en
      Veiligheid en het hoofd van de Inspectie Veiligheid en Justitie.

      4 De secretaris-generaal (voorzitter), de plaatsvervangend secretaris-generaal, de directeuren-generaal en de
      Nationaal Coördinator Terrorismebestrijding en Veiligheid vormen samen de bestuursraad. De bestuursraad formuleert
      de ministeriebrede en gemeenschappelijke kaders en bewaakt dat de activiteiten en het beleid van de onderscheiden
      clusters daarbinnen blijven. De voorzitter van het College van procureurs-generaal neemt als toehoorder deel aan
      de bestuursraad.


      [ref1]: https://wetten.overheid.nl/BWBR0030837#Artikel2
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel3
    references:
