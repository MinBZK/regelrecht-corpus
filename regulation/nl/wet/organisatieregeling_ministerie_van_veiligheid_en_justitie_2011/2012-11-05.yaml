    text: |-
      1 Het directoraat-generaal Rechtspleging en Rechtshandhaving (DGRR) is belast met:

      a. Het ontwikkelen en uitvoeren van beleid ten behoeve van het tegengaan van onveiligheid en criminaliteit;

      b. het scheppen van voorwaarden voor een goed functionerend rechtsbestel en een slagvaardige rechtspleging;

      c. het bewerkstelligen van een effectieve en professionele rechtshandhaving;

      d. de behandeling van uitvoeringsvraagstukken in de strafrechtketen waar een specifieke verantwoordelijkheid van de
      minister of staatssecretaris aan de orde is.

      2 Het directoraat-generaal bestaat uit een stafondersteuning en de volgende dienstonderdelen:

      a. de directie Rechtshandhaving en Criminaliteitsbestrijding (DRC);

      b. de directie Rechtsbestel (DRb);

      c. de directie Instrumentatie Rechtspleging en Rechtshandhaving (DIRR);

      d. de directie Juridische en Operationele Aangelegenheden (DJOA);

      e. de directie Veiligheid en Bestuur (DVB);

      f. de baten-lastendienst Nederlands Forensisch Instituut (NFI);

      g. de baten-lastendienst Centraal Justitieel Incassobureau (CJIB);

      h. de Justitiële Informatiedienst (JustID).
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel41
  - number: '42'
    text: |-
      1 De directeur-generaal is beheersverantwoordelijk voor het openbaar ministerie.

      2 De directeur-generaal wordt secretarieel, organisatorisch en administratief ondersteund door de
      stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel42
  - number: '43'
    text: |-
      1 De directie Rechtshandhaving en Criminaliteitsbestrijding (DRC) is belast met het ontwikkelen van visie, beleid
      en samenwerkingsvormen op het terrein van de rechtshandhaving, de criminaliteitsbestrijding en het waarborgen van
      de veiligheid.

      2 de directie bestaat uit:

      a. de afdeling Strategische Beleidsontwikkeling;

      b. de afdeling Georganiseerde Criminaliteit;

      c. de afdeling Fraude en Ordening;

      d. de afdeling Criminaliteit en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel43
  - number: '44'
    text: |-
      1 De directie Rechtsbestel (DRb) is belast met de instandhouding en ontwikkeling van het rechtsbestel, in het
      bijzonder met betrekking tot de toegang tot het recht, de organisatie en de kwaliteit van het rechtsbestel.
      Hieronder wordt in ieder geval begrepen het stelsel van de rechterlijke organisatie, alsmede de volgende
      beleidsterreinen: rechtsbijstand, juridische vrije beroepen, alternatieve geschillenbeslechting (ADR),
      schuldsanering natuurlijke personen en tolken en vertalers.

      2 De directie is voorts belast met het beheer van de Hoge Raad, het bureau van het Nederlands Register Gerechtelijk
      Deskundigen, het College bescherming persoonsgegevens, het Bureau Financieel Toezicht en de Commissie Gelijke
      Behandeling.

      3 De directie bestaat uit:

      a. de afdeling Strafrechtelijk Bestel & Arbeidsvoorwaarden;

      c. de afdeling Rechtspraak & Geschiloplossing;

      d. de afdeling Toegang Rechtsbestel.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel44
  - number: '45'
    text: |-
      1 De directie Instrumentatie Rechtspleging en Rechtshandhaving (DIRR) is belast met de instrumentatie van de
      overige directies binnen het directoraat-generaal Rechtspleging en Rechtshandhaving en de taakorganisaties op dit
      terrein. Onder deze instrumentatie wordt begrepen:

      a. de ontwikkeling van het informatievoorzieningbeleid voor de verschillende ketens op het terrein van de
      rechtspleging en rechtshandhaving, in het bijzonder de strafrechtketen,

      b. het stellen van financiële kaders, en

      c. het uitvoeren van impactanalyses en instrumentontwikkeling.

      2 Tevens fungeert de directie als centrale voorziening ten behoeve van de registratie van justitiële en
      strafvorderlijke gegevens en de verstrekking daarvan aan daartoe bevoegde personen en instanties.

      3 De directie bestaat uit:

      a. de afdeling Financiën, Bedrijfsvoering & Control (FBC)

      b. de afdeling Keteninformatievoorziening (KIV);

      c. het Financial Intelligence Unit netwerk (FIU.NET).
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel45
  - number: '46'
    text: |-
      1 De directie Juridische en Operationele Aangelegenheden (DJOA) is belast met de voorbereiding van beslissingen
      in individuele gevallen op het terrein van rechtspleging en rechtshandhaving met toepassing van bestaande
      regels en beleidskaders. De beslissingen hebben betrekking op bestuurlijk-juridische zaken, operationele
      zaken, rechtshulpverzoeken, benoemingen of incidenten. De directie levert op deze terreinen ook bijdragen aan
      beleidsvoorstellen.

      2 De directie voert de regie en coördineert de inzet van alle betrokken dienstonderdelen en taakorganisaties
      bij de afdoening van incidenten waaraan politiek-bestuurlijke aspecten zijn verbonden. De directie ontwikkelt en
      onderhoudt daartoe de benodigde expertise en incidentenstrategie en organiseert de voorbereiding van het ministerie
      van crisisbeheersing in het kader van het nationaal handboek crisisbeheersing.

      3 De directie fungeert als het juridisch expertisecentrum van het directoraat-generaal. De directie bewaakt de
      juridische kwaliteit van de diverse producten van het directoraat-generaal en beperkt de juridische risico’s.

      4 De directie is belast met de voorbereiding en uitvoering van beslissingen van de minister aangaande
      internationale rechtshulp in strafzaken, met uitzondering van beslissingen inzake de overdracht en
      overname van de tenuitvoerlegging van vrijheidsstraffen en vrijheidsbenemende maatregelen op grond van de
      [Wet overdracht tenuitvoerlegging strafvonnissen][ref1].

      5 De directie is voorts belast met de beantwoording van brieven van burgers alsmede de coördinatie van de
      beantwoording van Kamervragen en andere parlementaire zaken.

      6 De directie bestaat uit:

      a. de afdeling Bestuurlijke en Juridische Zaken;

      b. de afdeling Operationele Zaken en Incidentenmanagement;

      c. de afdeling Internationale Rechtshulp in Strafzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0004028
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004028
  - number: '47'
    text: |-
      1 De directie Veiligheid en Bestuur (DVB) is belast met:

      a. het faciliteren van het lokale bestuur om ten aanzien van maatschappelijke veiligheidsvraagstukken zijn eigen
      taken uit te voeren, relevante partners bijeen te brengen en waar nodig regie te voeren;

      b. het bijdragen aan een effectieve rechtspleging en rechtshandhaving door het realiseren van een goede
      informatievoorziening in de daarvoor relevante ketens.

      2 De directie bestaat uit:

      a. de afdeling Integrale veiligheid;

      b. de afdeling Bestuurlijke aanpak.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel47
  - number: '48'
    text: |-
      De baten-lastendienst Nederlands Forensisch Instituut (NFI) heeft met het oog op de waarheidsvinding in strafzaken
      de volgende kerntaken:

      a. het verrichten van onafhankelijk forensisch zaakonderzoek op overwegend technisch, medisch-biologisch en
      natuurwetenschappelijk gebied en het ter zake daarvan uitbrengen van verslag;

      b. het ontwikkelen en implementeren van nieuwe onderzoeksmethoden en technieken ter bevordering van kennis op het
      gebied van forensisch onderzoek;

      c. het zijn van (inter)nationaal kennis- en expertisecentrum op het gebied van forensisch onderzoek.

      Bij de uitvoering van deze taken levert het NFI producten of diensten aan het openbaar ministerie, de politie, de
      bijzondere opsporingsdiensten, de zittende magistratuur en het ministerie. Het NFI is voorts belast met door de
      minister aangewezen bijkomende taken.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel48
  - number: '49'
    text: |-
      De baten-lastendienst Centraal Justitieel Incassobureau (CJIB) heeft tot taak het openbaar ministerie en de
      departementsleiding te ondersteunen bij hun werkzaamheden ten behoeve van de tenuitvoerlegging van strafrechtelijke
      en administratieve sancties alsmede met betrekking tot het beheer en de verwerking van gegevens dienaangaande. Het
      CJIB heeft tevens tot taak door de minister aangewezen andere werkzaamheden te verrichten ter ondersteuning van het
      Rijk bij de uitvoering zijn taken.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel49
  - number: '50'
    text: |-
      De Justitiële Informatiedienst (JustID) fungeert als centrale voorziening ten behoeve van de registratie van
      justitiële en strafvorderlijke gegevens en de verstrekking daarvan aan daartoe bevoegde personen en instanties.
      Onder meer het Centraal Informatiepunt Onderzoek Telecommunicatie (CIOT) en het Platform Interceptie & Decriptie &
      Signaalanalyse (PIDS) zijn ondergebracht bij JustID.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel50
  - number: '51'
    text: |-
      1 De Nationaal Coördinator Terrorismebestrijding en Veiligheid (NCTV) heeft tot taak het versterken van de
      nationale veiligheid en het voorkomen van maatschappelijke ontwrichting door dreigingen voor de vitale belangen van
      de samenleving te identificeren en de weerbaarheid en bescherming van die vitale belangen te versterken. Hiertoe
      verricht de NCTV in het bijzonder activiteiten die zijn gericht op:

      a. het bevorderen van de identificatie en de analyse van dreigingen en risico's op het gebied van terrorisme en
      nationale veiligheid;

      b. het reduceren van kansen of effecten van de genoemde dreigingen en risico’s door:

      1º. het verhogen van weerbaarheid van vitale belangen;

      2º. zorg te dragen voor een dekkend stelsel van de crisisbeheersing vanaf het niveau van de veiligheidsregio’s, met
      name wat betreft de organisatie van de brandweerzorg en de geneeskundige hulpverlening in die regio’s, tot en met
      het nationale niveau;

      c. het nemen van beschermingsmaatregelen ten aanzien van daartoe aangewezen bijzondere personen, objecten en
      diensten;

      d. het adequaat functioneren van het stelsel van bewaken en beveiligen;

      e. het zorgdragen voor de samenhang in de besluitvorming bij een dreigende ramp of crisis;

      f. de strategieontwikkeling rond cyber security, het realiseren van risicomanagement op het gebied van cyber
      security en het bevorderen van de publiek-private samenwerking op het gebied van cyber security.

      2 De Nationaal Coördinator Terrorismebestrijding en Veiligheid bestaat uit de volgende dienstonderdelen:

      a. het bureau Algemene Zaken;

      b. het bureau Communicatie;

      c. de directie Beleid en Strategie (DBS);

      d. de directie Regie (DR);

      e. de directie Kennis & Analyse (DKA);

      f. de directie Beveiliging Burgerluchtvaart (DBB);

      g. de eenheid Bewaking en Beveiliging (EBB);

      h. de directie Nationale Veiligheid (DNV);

      i. de directie Cyber Security.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel51
  - number: '52'
    text: |-
      1 De NCTV legt inhoudelijk direct verantwoording af aan de minister.

      2 De NCTV wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel52
  - number: '53'
    text: |-
      1 Het bureau Algemene Zaken is belast met de ondersteuning van de NCTV in de dagelijkse aansturing van de
      dienstonderdelen die onder de NCTV ressorteren, de uitvoering van de begroting van de NCTV en de ondersteuning van
      de primaire processen.

      2 Het bureau coördineert de inzet van de voor terrorismebestrijding beschikbare middelen, bereidt beslissingen over
      de aanwending van die middelen voor en brengt hierover advies uit aan de NCTV.

      3 Het bureau adviseert de NCTV over beleidsvoorstellen waaraan financiële of uitvoeringsconsequenties zijn
      verbonden.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel53
  - number: '54'
    text: Het bureau Communicatie is belast met de regie van de communicatie in de aangelegenheden betreffende de NCTV.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel54
  - number: '55'
    text: |-
      1 De directie Beleid en Strategie (DBS) initieert, coördineert en evalueert het beleid op het terrein van
      terrorismebestrijding. Hiertoe coördineert zij de inzet van de betrokken ministeries en diensten.

      2 De directie geeft richting aan de strategieontwikkeling rond terrorisme en coördineert de uitvoering van de
      contra-terrorismestrategie.

      3 De directie is belast met de coördinatie van algemene parlementaire aangelegenheden en bereidt de
      interdepartementale en politiek-bestuurlijke besluitvorming voor.

      4 De directie is verantwoordelijk voor en coördineert de strategische en beleidsmatige juridische aangelegenheden
      van de NCTV.

      5 De directie bereidt de relevante internationale en Europese beleidsvorming voor in overleg met haar partners en
      coördineert en ondersteunt de internationale en Europese activiteiten van de NCTV.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel55
  - number: '56'
    text: |-
      De directie Regie (DR) is belast met:

      a. het regisseren van de samenwerking van de verschillende partijen op het terrein van terrorismebestrijding via
      structurele, procesgerichte regie en tevens incidentele, meer actiegerichte regie;

      b. het realiseren van een hogere samenwerkingsgraad tussen die partijen.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel56
  - number: '57'
    text: |-
      1 De directie Kennis & Analyse (DKA) is belast met het bijeenbrengen, combineren en verdelen van informatie van
      inlichtingenverschaffende diensten en bestuurlijke en wetenschappelijke bronnen ten behoeve van integrale analyses
      en dreigingsbeelden inzake terrorisme.

      2 De directie functioneert als het expertise- en informatiecentrum waarin alle andere partners op dit vlak
      participeren en hun informatie aanleveren. Verder vindt hier de waardering plaats van alle informatie uit
      bronnen op hoog en laag niveau binnen zeer diverse kringen, waarvoor het noodzakelijk is om informatiestromen te
      organiseren en te onderhouden.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel57
  - number: '58'
    text: |-
      1 De directie Beveiliging Burgerluchtvaart (DBB) is belast met de beveiliging van de burgerluchtvaart.

      2 De directie heeft de volgende hoofdtaken:

      a. het in nationaal en internationaal verband opstellen van het beleid op het gebied van de beveiliging van de
      burgerluchtvaart;

      b. het opstellen van regels en het geven van aanwijzingen aan de Koninklijke marechaussee en de luchtvaartsector op
      basis van de [Luchtvaartwet][ref1] en de[Politiewet 1993][ref2];

      c. het aansturen van de Koninklijke marechaussee, voor zover deze onder het gezag van de minister is belast met het
      toezicht op de uitvoering van de beveiligingsmaatregelen door de luchtvaartsector;

      d. het opstellen en actualiseren van het nationaal beveiligingsplan voor de burgerluchtvaart;

      e. het uitvoeren van risicoanalyses op basis waarvan eventuele aanvullende beveiligingsmaatregelen worden genomen;

      f. het monitoren van het beveiligingsniveau en het op basis daarvan evalueren van de effectiviteit van het gevoerde
      beleid;

      g. het goedkeuren van beveiligingsplannen van zowel de luchthavens als de luchtvaartmaatschappijen;

      h. het onderzoeken van nieuwe beveiligingsconcepten, beveiligingsprocessen en beveiligingsapparatuur;

      i. het certificeren van opleidingsorganisaties;

      j. het deelnemen aan internationale beveiligingsinspecties op luchthavens.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002267
      - id: ref2
        bwb_id: BWBR0006299
  - number: '59'
    text: |-
      De Eenheid Bewaking en Beveiliging (EBB) is belast met het onderhouden, uitvoeren en vernieuwen van het nationaal
      stelsel van bewaken en beveiligen, het stelsel van speciale eenheden, het Alerteringssysteem Terrorismebestrijding
      en het uitvoeren van de [Regeling bijstand bestrijding luchtvaartterrorisme][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018217
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0018217
  - number: '60'
    text: |-
      De directie Nationale Veiligheid (DNV) heeft de volgende taken:

      a. het voorkomen van en prepareren voor dreigingen tegen de nationale veiligheid;

      b. het in dit kader ontwikkelen van een eenheid in visie en optreden tussen de verschillende regio’s en het
      nationale niveau.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel60
  - number: '61'
    text: |-
      1 De directie Cyber Security heeft de volgende taken:

      a. het ontwikkelen en realiseren van de Nationale Cyber Security Strategie;

      b. het voeren van actief risicomanagement op het gebied van cyber security;

      c. het vergroten van de digitale weerbaarheid van de Nederlandse samenleving;

      d. het voeren van het secretariaat van de publiek-private samenwerking op het gebied van cyber security.

      2 De directie bestaat uit:

      a. het onderdeel Beleid en secretariaat;

      b. het Nationaal Cyber Security Centrum.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel61
  - number: '62'
    text: |-
      De Inspectie Veiligheid en Justitie (IVenJ) is belast met toezichtstaken op het terrein van het ministerie en heeft
      daartoe de volgende hoofdtaken:

      a. Het houden van toezicht op de uitvoering en de naleving van de regelgeving op het terrein van het ministerie en
      van regelgeving op andere daartoe bij of krachtens de wet aangewezen beleidsterreinen;

      b. het gevraagd en ongevraagd verstrekken van inlichtingen en adviezen aan de minister of staatssecretaris over
      onderwerpen die tot hun taken horen;

      c. het vervullen van andere door de minister aan de Inspectie opgedragen toezichtstaken.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel62
  - number: '63'
    text: |-
      Bij de hoofden van de in [artikel 2][ref1] genoemde clusters en daaronder ressorterende dienstonderdelen liggen
      voor het daarbij werkzame personeel ter inzage:

      a. een exemplaar van deze regeling;

      b. het organisatie- en formatierapport van het betreffende dienstonderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0030837#Artikel2
