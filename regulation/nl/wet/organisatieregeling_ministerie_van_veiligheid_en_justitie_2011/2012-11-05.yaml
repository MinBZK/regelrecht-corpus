articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *ministerie:* het Ministerie van Veiligheid en Justitie;

      b. *minister:* de Minister van Veiligheid en Justitie;

      c. *staatssecretaris:* de Staatssecretaris van Veiligheid en Justitie;

      d. *departementsleiding:* de minister en de staatssecretaris alsmede de secretaris-generaal, de plaatsvervangend
      secretaris-generaal, de directeuren-generaal, de Nationaal Coördinator Terrorismebestrijding en Veiligheid en het
      hoofd van de Inspectie Veiligheid en Justitie gezamenlijk;

      e. *bestuursdepartement:* de departementsleiding alsmede de beleids-, staf- en bedrijfsvoeringsonderdelen ter
      ondersteuning van de departementsleiding;

      f. *bestuursraad:* de bestuursraad, bedoeld in [artikel 3, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030837#Artikel3
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel1
