  - number: '64'
    text: |-
      1 Een voornemen tot aanpassing van de organisatie zoals deze is weergegeven in deze regeling, wordt genomen door de
      secretaris-generaal, gehoord de bestuursraad.

      2 De directeur Personeel en Organisatie adviseert de secretaris-generaal alvorens een beslissing omtrent instemming
      wordt genomen.
    url: https://wetten.overheid.nl/BWBR0030837/2012-11-05#Artikel64
  - number: '65'
    text: |-
      1 Elk van de dienstonderdelen welke ressorteren onder de in [artikel 2][ref1] genoemde clusters ontwerpt en
      onderhoudt een organisatierapport en een formatierapport en, voor zover van toepassing, een taakbesluit en een
      baten-lastendienstregeling.

      2 Voor zover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in
      [artikel 2, onder a, b, f en g][ref2], is de secretaris-generaal bevoegd het document namens de minister vast
      te stellen.

      3 Voor zover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in
      [artikel 2, onder c, d en e][ref3], is de directeur-generaal onder wie het dienstonderdeel ressorteert, bevoegd
      het document namens de minister vast te stellen.

      4 De secretaris-generaal respectievelijk de directeur-generaal kan de in het tweede respectievelijk derde lid
      bedoelde bevoegdheid mandateren aan een onder hem ressorterende ambtenaar.

      5 Alvorens een document als bedoeld in het eerste lid, kan worden vastgesteld, behoeft dit de instemming van de
      bestuursraad. De directeur Personeel en Organisatie adviseert de bestuursraad alvorens een beslissing omtrent
      instemming wordt genomen.


