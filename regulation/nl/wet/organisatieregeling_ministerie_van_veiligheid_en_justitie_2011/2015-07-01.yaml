  - number: '28'
    text: |-
      De baten-lastendienst Dienst JUSTIS is belast met het namens de minister nemen van besluiten en verwerken van
      informatie ter bevordering van een betrouwbare, veilige en rechtvaardige samenleving in sectoren met kwetsbare
      belangen.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel28
  - number: '29'
    text: |-
      De baten-lastendienst Dienst Justitiële inrichtingen (DJI) is belast met het tenuitvoerleggen van vrijheidsstraffen
      en vrijheidsbenemende maatregelen en met het voorbereiden van de aan de zorg van de minister toevertrouwde personen
      op hun succesvolle terugkeer naar de maatschappij, binnen of buiten Nederland. Tevens is DJI belast met het
      behandelen van rechtshulpverzoeken inzake de overdracht en overname van de tenuitvoerlegging van vrijheidsstraffen
      en vrijheidsbenemende maatregelen op grond van de [Wet overdracht tenuitvoerlegging strafvonnissen][ref1] en de
      [Wet wederzijdse erkenning en tenuitvoerlegging vrijheidsbenemende en voorwaardelijke sancties][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004028
      [ref2]: https://wetten.overheid.nl/BWBR0031814
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004028
      - id: ref2
        bwb_id: BWBR0031814
  - number: 29a
    text: |-
      De baten-lastendienst Centraal Justitieel Incassobureau (CJIB) heeft tot taak het openbaar ministerie en de
      departementsleiding te ondersteunen bij hun werkzaamheden ten behoeve van de tenuitvoerlegging van strafrechtelijke
      en administratieve sancties alsmede met betrekking tot het beheer en de verwerking van gegevens dienaangaande. Het
      CJIB heeft tevens tot taak door de minister aangewezen andere werkzaamheden te verrichten ter ondersteuning van het
      Rijk bij de uitvoering zijn taken.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel29a
  - number: '30'
    text: |-
      De Raad voor de kinderbescherming (RvdK) is belast met de bij of krachtens wet opgedragen taken. Deze
      taken omvatten onder meer dat de raad onderzoek doet naar het belang en de positie van het kind in
      beschermingszaken, strafzaken en gezag- en omgangszaken. De raad adviseert in juridische procedures en kan om
      kinderbeschermingsmaatregelen verzoeken bij de rechtbank. De raad coördineert de uitvoering van taakstraffen,
      voert casusregie in strafzaken en doet onderzoeken ten behoeve van het verkrijgen van een beginseltoestemming voor
      interlandelijke adoptie.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel30
  - number: '31'
    text: |-
      Het bureau van de Erkenningscommissie Gedragsinterventies Justitie is belast met de bedrijfsvoering en de
      ondersteuning van de Erkenningscommissie Gedragsinterventies Justitie.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel31
  - number: '32'
    text: |-
      1 Het directoraat-generaal Politie (DGPOL) is belast met:

      a. de verantwoordelijkheid voor het functioneren van de politieorganisatie en het leveren van politiezorg;

      b. het ontwikkelen van een visie op de kwaliteit, de inrichting en de ontwikkeling van de politieorganisatie.

      2 Ter uitvoering van de taken, bedoeld in het eerste lid, is het directoraat-generaal in het bijzonder belast met:

      a. de doorontwikkeling van het stelsel van de nationale politie;

      b. beleidsontwikkeling op het terrein van de politie;

      c. het vaststellen van beleidskaders voor de politieorganisatie en de uitvoering van politietaken, gericht op het
      realiseren van de beleidsprioriteiten van de minister en de gezagsdragers;

      d. het creëren van condities voor een goed en slagvaardig functionerend politieapparaat.

      3 Het directoraat-generaal bestaat uit de volgende portefeuilles en dienstonderdelen:

      a. de portefeuille Middelen Politie;

      b. de portefeuille Regie en Control;

      c. de portefeuille Politieel Beleid en Taakuitvoering;

      d. het korps politie Bonaire, Sint Eustatius en Saba;

      e. het brandweerkorps Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel32
  - number: '33'
    text: |-
      1 De portefeuille Middelen Politie is ter waarborging van de continuïteit van de politieorganisatie belast met het
      beleid inzake de bedrijfsvoering van de politie.

      2 De portefeuille Middelen Politie bestaat uit:

      a. het programma Financiën;

      b. het programma HRM en Onderwijs;

      c. het programma Arbeidsvoorwaarden;

      d. het programma Informatievoorziening en Inkoop.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel33
  - number: '34'
    text: |-
      1 De portefeuille Regie en Control is belast met:

      a. het beheer van het stelsel van planning en control in relatie tot de politie en het beleid hieromtrent;

      b. het beheer en de interne bedrijfsvoering van het directoraat-generaal;

      c. bestuurlijke, juridische, operationele aangelegenheden en management van incidenten;

      d. de coördinatie van parlementaire aangelegenheden;

      e. de coördinatie van afhandeling van burgerbrieven;

      f. het beleid inzake de organisatie van de meldkamers;

      g. het beleid inzake het communicatiesysteem van de hulpdiensten.

      2 De portefeuille Regie en Control bestaat uit:

      a. het programma Regie en Strategie;

      b. het programma Control;

      c. het programma Meldkamers en C2000.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel34
  - number: '35'
    text: |-
      1 De portefeuille Politieel Beleid en Taakuitvoering is belast met:

      a. het beleid inzake de primaire processen, taakuitvoering en bevoegdheden van de politie;

      b. de vermindering van administratieve lasten ten aanzien van de politie;

      c. internationale politiesamenwerking;

      d. het beheer van het korps politie Bonaire, Sint Eustatius en Saba en het brandweerkorps Bonaire, Sint Eustatius
      en Saba.

      2 De portefeuille Politieel beleid en Taakuitvoering bestaat uit:

      a. het programma Politiële Taken;

      b. het programma Implementatie Nationale Politie en Bevoegdheden;

      c. het programma Minder Regels, Meer Op Straat;

      d. het programma Internationale en Caribische Aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel35
  - number: '39'
    text: |-
      Het korps politie Bonaire, Sint Eustatius en Saba (korps politie BES) is belast met de taken bedoeld in
