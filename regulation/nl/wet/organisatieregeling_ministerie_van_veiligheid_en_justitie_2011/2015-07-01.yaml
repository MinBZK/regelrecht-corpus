  - number: '4'
    text: |-
      1 Het cluster secretaris-generaal (SG-cluster) heeft taken op de terreinen van wetgeving, Europese en
      internationale aangelegenheden, onderzoek, strategievorming, voorlichting, communicatie, financiën en bestuurlijke
      en parlementaire ondersteuning.

      2 Het SG-cluster bestaat uit de volgende dienstonderdelen:

      a. de directie Wetgeving en Juridische Zaken (DWJZ);

      b. de directie Europese en Internationale Aangelegenheden (DEIA);

      c. de directie Strategie (DS);

      d. het Wetenschappelijk Onderzoek- en Documentatiecentrum (WODC);

      e. het bureau Secretaris-Generaal (BSG);

      f. de directie Voorlichting (DV);

      g. de directie Financieel-Economische Zaken (DFEZ);

      h. het bureau Adviescollege Verloftoetsing tbs.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel4
  - number: '5'
    text: |-
      1 De directie Wetgeving en Juridische Zaken (DWJZ) is belast met de ontwikkeling, de totstandkoming, het
      beheer en het onderhoud van justitie- en veiligheidswetgeving en van andere wetgeving voor zover deze tot het
      werkterrein van een dienstonderdeel van het ministerie behoort, alsmede met het ontwikkelen en uitdragen van
      het wetgevingskwaliteitsbeleid en de toetsing van ontwerpwetgeving van de ministeries op rechtsstatelijke en
      bestuurlijke kwaliteit, met inbegrip van de constitutionele, Europeesrechtelijke en internationaalrechtelijke
      toetsing van wetgeving.

      2 De directie is tevens belast met:

      a. het in ondermandaat dan wel met volmacht of machtiging van de hoofden van de clusters behandelen van bezwaar-
      en beroepschriften, verzoeken om voorlopige voorziening, aansprakelijkstellingen, verzoeken om schadevergoeding en
      civielrechtelijke procedures;

      b. het ten behoeve van de hoofden van de clusters opstellen van overeenkomsten en convenanten, anders dan op het
      gebied van inkoop en aanbesteding;

      c. het vooraf toetsen van beslissingen die binnen het bestuursdepartement worden genomen op grond van de Wet
      openbaarheid van bestuur;

      d. het desgevraagd adviseren van de leden van de departementsleiding op juridisch-bestuurlijk gecompliceerde of
      gevoelige onderwerpen, alsmede het vervullen van bijzondere opdrachten van de departementsleiding;

      e. het in samenwerking met de clusters ontwikkelen, beheren en bewaken van de juridische kwaliteitsborging, gericht
      op het inzichtelijk maken, voorkomen en tegengaan van juridische risico’s en het waarborgen van een adequate
      juridische inbreng, zowel bij de voorbereiding als bij de uitvoering van beleid;

      f. klachtbehandeling op mensenrechtelijk terrein voor internationale gerechten en comités, mensenrechtelijke
      advisering in de brede zin en het voeren van internationale onderhandelingen namens het ministerie ten aanzien van
      mensenrechtelijke onderwerpen;

      g. het onderhouden van het geregelde contact met de landsadvocaat en het beslissen op verzoeken om inschakeling van
      de landsadvocaat.

      3 De directie bestaat uit:

      a. de sector Straf- en sanctierecht;

      b. de sector Staats- en bestuursrecht;

      c. de sector Privaatrecht;

      d. de sector Wetgevingskwaliteitsbeleid;

      e. de sector Juridische Zaken;

      f. de afdeling Ondersteuning.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel5
  - number: '6'
    text: |-
      1 De directie Europese en Internationale Aangelegenheden (DEIA) draagt zorg voor een ministeriebrede strategie- en
      visieontwikkeling ten aanzien van multilaterale, Europese en bilaterale horizontale dossiers en beleidsvraagstukken
      en ten aanzien van Koninkrijksamenwerking, internationale projecten en expertisegebieden. Tevens is de directie
      belast met de zorg voor een gecoördineerde en effectieve inzet van Nederland op het gebied van Veiligheid en
      Justitie binnen het kader van de samenwerking binnen de Europese Unie en in het kader van de samenwerking op
      multilateraal, bilateraal en Koninkrijksniveau. Tenslotte faciliteert de directie de politieke en ambtelijke
      leiding alsmede de directies in logistieke en instrumentele zin op voornoemde terreinen en verzorgt zij de daarop
      betrekking hebbende informatievoorziening aan interne dossierhouders en belanghebbenden.

      2 De directie bevordert en bewaakt de eenheid van optreden op de in het eerste lid genoemde terreinen met
      inachtneming van de eigen beleidsverantwoordelijkheid van andere dienstonderdelen voor de internationale aspecten
      van hun beleidsterrein

      3 De directie bestaat uit:

      a. de afdeling Europese Unie;

      b. de afdeling Internationale Betrekkingen en Projecten;

      c. de afdeling Veiligheid en Justitie van de Permanente Vertegenwoordiging bij de Europese Unie;

      d. de attachees Veiligheid en Justitie op andere Nederlandse ambassades en permanente vertegenwoordigingen in het
      buitenland;

      e. de managementondersteuning.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel6
  - number: '7'
    text: |-
      De directie Strategie (DS) is belast met het ondersteunen van de departementsleiding bij het ontwikkelen en
      vormgeven van ministeriebrede strategie. Dit bewerkstelligt zij in het bijzonder door het uitvoeren van toekomst-
      en omgevingsgerichte verkenningen en het op basis daarvan signaleren van strategische thema’s alsmede het
      bevorderen van de doorwerking daarvan, dit in goed samenspel met partners binnen en buiten het ministerie.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel7
  - number: '8'
    text: |-
      1 Het Wetenschappelijk Onderzoek- en Documentatiecentrum (WODC) is belast met:

      a. het verrichten van onderzoek en het doen verrichten van onderzoek, waaronder het evalueren van beleid en
      beleidsprogramma's;

      b. het adviseren over voorgenomen beleid en beleidsprogramma’s;

      c. het ontwikkelen, onderhouden en toegankelijk maken van data;

      d. het verspreiden van binnen het WODC aanwezige kennis;

      e. de documentatie van (sociaal-)wetenschappelijke publicaties op het terrein van Veiligheid en Justitie.

      2 Het WODC bestaat uit:

      a. de onderzoeksafdeling Criminaliteit, Veiligheid, Rechtshandhaving en Sancties (CVRS);

      b. de onderzoeksafdeling Rechtsbestel, Wetgeving, Internationale en vreemdelingenaangelegenheden (RWI);

      c. de afdeling Externe Wetenschappelijke Betrekkingen (EWB);

      d. de afdeling Statistische lnformatievoorziening en Beleidsanalyse (SIBa);

      e. de afdeling Documentaire lnformatievoorziening (DIV);

      f. de afdeling Bedrijfsbureau.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel8
  - number: '9'
    text: |-
      1 Het bureau Secretaris-Generaal (BSG) is belast met algemene staftaken, zoals de algemene parlementaire
      coördinatie en de secretariële, administratieve en organisatorische ondersteuning van de minister, de
      staatssecretaris, de secretaris-generaal en de plaatsvervangend secretaris-generaal.

      Het is voorts belast met de protocollaire ondersteuning van de departementsleiding van het ministerie en vervult
      daarbij een coördinerende rol. BSG is daarnaast belast met de integrale beveiliging van het departement. Deze taken
      worden gekenmerkt door een representatief of vertrouwelijk karakter.

      2 Het bureau bestaat uit:

      a. de afdeling Advies;

      b. de afdeling Project-, Programma- en Adviescentrum (PPAC);

      c. de afdeling Managementondersteuning Departementsleiding;

      d. het Bureau Beveiligingsautoriteit (BA);

      e. het Bureau Protocol en Evenementen;

      f. het Bedrijfsbureau.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel9
  - number: '10'
    text: |-
      1 De directie Voorlichting (DV) is belast met het geven van informatie van en over het ministerie. Hierbij wordt
      gezocht naar een goede balans tussen het belang van het ministerie en dat van de ontvangers. Ook heeft de directie
      tot taak om politieke en maatschappelijke signalen op te vangen en terug te koppelen binnen de organisatie.

      2 De directie bestaat uit:

      a. het Stafbureau;

      b. de afdeling Persvoorlichting, Beleidspresentatie en Nieuwsredactie;

      c. de afdeling Communicatie & Redactie.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel10
  - number: 10a
    text: |-
      1 De directie Financieel-Economische Zaken (DFEZ) is belast met de advisering van de departementsleiding
      over financiële en macro-economische aspecten van beleid, bedrijfsvoering en uitvoering als bedoeld in
      [artikel 27, eerste en tweede lid, van de Comptabiliteitswet 2001][ref1] en de daaruit voortvloeiende regelgeving.

      2 De directie bestaat uit:

      a. de afdeling Begroting en Kaderstelling;

      b. de afdeling Financiële Infrastructuur & Concernadministratie;

      c. de afdeling Financieel-Economische Advisering & Control.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel27
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '27'
  - number: '11'
    text: |-
      Het bureau Adviescollege Verloftoetsing tbs is belast met het ondersteunen van het Adviescollege Verloftoetsing tbs
      alsmede het ontwikkelen van richtlijnen en andere vormen van methodische aanpak ten behoeve van dat adviescollege.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel11
  - number: '13'
    text: |-
      1 Het cluster plaatsvervangend secretaris-generaal (pSG-cluster). Het pSG-cluster heeft taken op het terrein van de
      bedrijfsvoering van het ministerie, in het bijzonder betreffende personeel, informatievoorziening, organisatie,

      automatisering en huisvesting. Daarbij kunnen de volgende taken worden onderscheiden:

      a. departementsbrede kaderstelling, control en advisering aan de secretaris-generaal en bewindslieden;

      b. departementale controle- en auditfunctie;

      c. departementsbrede coördinatie ten behoeve van de inbreng van het VenJ-belang in interdepartementale overleggen
      en trajecten op het terrein van bedrijfsvoering;

      d. advisering van integraal managers in de rol van DG-controller;

      e. dienstverlening op het terrein van bedrijfsvoering ter ondersteuning van de primaire processen op het
      bestuursdepartement.

      2 Het pSG-cluster bestaat uit de volgende dienstonderdelen:

      a. de directie Personeel en Organisatie (DP&O);

      b. de directie Informatisering en Inkoop (DI&I);

      c. de directie Bedrijfsvoering en Ondersteuning Bestuursdepartement (DBOB);

      d. het Dienstencentrum i.o. (DC);

      e. de Projectendirectie Huisvesting (PDH).
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel13
  - number: '15'
    text: |-
      1 De directie Personeel en Organisatie (DP&O) is belast met advisering van de departementsleiding over en de
      ontwikkeling, organisatie, coördinatie van en control op het ministeriebreed organisatie- en personeelsbeleid.
      De directie is tevens belast met de ontwikkeling en organisatie van opleidingsprogramma’s ten behoeve van alle
      beleidsambtenaren van het ministerie.

      2 De directie bestaat uit:

      a. de afdeling Concern Personeel en Organisatie;

      b. de afdeling P&O-diensten;

      c. het team Bedrijfsvoering;

      d. de Beleidsacademie;

      e. het Bureau Ondersteuning Medezeggenschap.

      3 De afdeling Concern Personeel en Organisatie bestaat uit:

      a. het team Organisatie en Personeelsbeleid Concern (OPC);

      b. het team Concern Beleidsimplementatie & Informatiemanagement (CBI);

      c. het team Servicemanagement (TSM).

      4 De afdeling P&O diensten bestaat uit:

      a. team Personeel Service Centrum (PSC);

      b. team P&O-advies.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel15
  - number: '16'
    text: |-
      De directie Informatisering en Inkoop (DI&I) adviseert de departementsleiding over strategische vraagstukken op het
      gebied van informatievoorziening en ICT, ondersteunt de dienstonderdelen van het ministerie bij de inrichting van
      de keteninformatisering en de beheersing van grote ICT-projecten en draagt zorg voor de uitvoering van projecten
      op het gebied van de VenJ-brede ICT-infrastructuur. Daarnaast stelt de directie ten behoeve van de dienstonderdelen
      van het ministerie kaders en centrale voorzieningen vast met het oog op rechtmatige, efficiënte en duurzame
      inkoop .
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel16
  - number: '18'
    text: |-
      1 De directie Bedrijfsvoering en Ondersteuning Bestuursdepartement (DBOB) verzorgt voor het bestuursdepartement de
      levering van diensten op het gebied van grafische voorzieningen.

      2 De directie bestaat uit de afdeling Grafische Voorzieningen.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel18
  - number: '19'
    text: |-
      1 Het Dienstencentrum i.o. (DC) verzorgt voor het bestuursdepartement de levering van diensten op het gebied van
      huisvesting, facilitaire dienstverlening, ICT, inkoopondersteuning, werkplekservices en diensten op het gebied van
      post en informatievoorziening.

      2 Het Dienstencentrum i.o. bestaat uit:

      a. het cluster Klantadvies en ondersteuning;

      b. het cluster Leveranciersmanagement;

      c. het cluster Portfoliomanagement;

      d. het cluster Bedrijfsvoering;

      e. het cluster inkoop uitvoeringscentrum (IUC);

      f. het cluster Productie informatievoorziening (PIV).
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel19
  - number: '21'
    text: |-
      De Projectendirectie Huisvesting is belast met het realiseren van beleid, kaders en richtlijnen op het terrein van
      huisvesting en daarmee verband houdende faciliteiten alsmede met de uitvoering van huisvestingsprojecten voor het
      ministerie en aan het ministerie gerelateerde internationale organisaties.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel21
  - number: '23'
    text: |-
      1 Het directoraat-generaal Jeugd en Sanctietoepassing (DGJS) is belast met:

      a. het ontwikkelen en uitvoeren van beleid voor de bescherming en begeleiding van jeugdigen in onveilige
      opvoedsituaties en voor een persoonsgerichte en groepsgerichte aanpak van jeugdigen die in aanraking komen of
      dreigen te komen met politie en Justitie;

      b. het ontwikkelen en uitvoeren van beleid voor slachtoffers van geweld en criminaliteit;

      c. de bescherming van personen en instellingen tegen criminaliteit, recidive en onveiligheid;

      d. een effectieve en integrale tenuitvoerlegging van straffen en maatregelen inclusief de regie op dit deel van
      de strafrechtketen.

      2 Het directoraat-generaal bestaat uit een stafondersteuning en de volgende dienstonderdelen:

      a. de directie Sanctie- en Preventiebeleid (DSP);

      b. de directie Justitieel Jeugdbeleid (DJJ);

      c. de directie Control, Bedrijfsvoering en Juridische Zaken (CBJ);

      d. ketenunit i.o.;

      e. de baten-lastendienst Dienst JUSTIS;

      f. de baten-lastendienst Dienst Justitiële Inrichtingen (DJI);

      g. de baten-lastendienst Centraal Justitieel Incassobureau (CJIB);

      h. de raad voor de kinderbescherming (RvdK);

      i. het bureau van de Erkenningscommissie Gedragsinterventies Justitie.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel23
  - number: '24'
    text: De directeur-generaal wordt secretarieel, organisatorisch en administratief ondersteund door de stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel24
  - number: '25'
    text: |-
      1 De directie Sanctie- en Preventiebeleid (DSP) is belast met de advisering aan de departementsleiding over en
      de coördinatie, ontwikkeling en evaluatie van beleid dat gericht is op het bevorderen van de veiligheid van de
      maatschappij door:

      a. de consequente en effectieve tenuitvoerlegging van vrijheidsbenemende en vrijheidsbeperkende straffen en
      maatregelen bij volwassenen;

      b. de vermindering van de recidive door gedragsinterventies en goede aansluiting op maatschappelijke opvang;

      c. het aanbieden van dienstverlening aan slachtoffers van criminaliteit;

      d. het voorkomen van criminaliteit door inzet van preventieve maatregelen met het oog op een veilige en
      rechtvaardige samenleving.

      2 Tevens is de directie belast met de advisering aan de departementsleiding over en de ontwikkeling, coördinatie en
      evaluatie van beleid dat gericht is op het reguleren en beheersen van kansspelen met bijzondere aandacht voor een
      passend en attractief aanbod van kansspelen, het beschermen van de consument, het tegengaan van kansspelverslaving
      en het tegengaan van illegaliteit en criminaliteit. De directie onderhoudt daartoe ook de relatie met de
      kansspelautoriteit.

      3 De directie heeft op haar terrein een coördinerende taak in de besturing en beleidsvoering van de Dienst JUSTIS
      en de dienst Justitiële Inrichtingen, voor zover het haar beleidsterrein betreft.

      4 De directie is beleidsmatig en budgettair verantwoordelijk voor de door de directie gesubsidieerde organisaties
      en instellingen en stuurt deze aan.

      5 De directie wordt ondersteund door een staf en bestaat uit:

      a. de afdeling Sanctie- en Reclasseringsbeleid;

      b. de afdeling Preventie-, Kansspel- en Slachtofferbeleid;

      c. het programma Gewelddadige Vermogenscriminaliteit;

      d. het programma Modernisering Kansspelen;

      e. het programma Uitvoeringsketen Strafrechtelijke Beslissingen;

      f. het secretariaat van het Schadefonds Geweldsmisdrijven (secretariaat SGM);

      g. het secretariaat van de Raad voor strafrechtstoepassing en jeugdbescherming (secretariaat RSJ).

      6 De in het vijfde lid, onderdeel f en g, genoemde secretariaten zijn belast met de bedrijfsvoering en
      ondersteuning van de in die onderdelen genoemde instellingen.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel25
  - number: '26'
    text: |-
      1 De directie Justitieel Jeugdbeleid (DJJ) is belast met de advisering aan de departementsleiding over en de
      coördinatie, ontwikkeling en evaluatie van beleid dat zich richt op:

      a. de bescherming van minderjarigen;

      b. het voorkomen en aanpakken van bedreigende situaties voor kinderen en gezinnen;

      c. het met justitiële instrumenten voorkomen en aanpakken van jeugdcriminaliteit;

      d. de bevordering van een samenhangende strafrechtelijke en pedagogische aanpak van de jeugdige nadat deze zich
      schuldig heeft gemaakt aan strafwaardig gedrag;

      e. interlandelijke adoptie, internationale kinderbescherming en internationale kinderontvoering met uitzondering
      van het uitvoeringsbeleid.

      2 De directie heeft een adviserende taak in de besturing en beleidsvoering van de raad voor de kinderbescherming en
      de dienst Justitiële Inrichtingen, voor zover het haar beleidsterrein betreft.

      3 De directie is beleidsmatig en budgettair verantwoordelijk voor de door de directie gesubsidieerde
      organisaties en instellingen en stuurt deze aan. Daarnaast onderhoudt de directie de besturingsrelatie
      omtrent de doeluitkeringen aan de provincies en grootstedelijke regio’s ten aanzien van de jeugdbescherming en
      jeugdreclassering.

      4 De directie heeft verder tot taak het Landelijk Bureau Inning Onderhoudsbijdragen beheersmatig en financieel aan
      te sturen.

      5 De directie wordt ondersteund door een staf en bestaat uit:

      a. de afdeling Jeugdbescherming;

      b. de afdeling Jeugdsancties en -preventie;

      c. het programma Jeugdcriminaliteit en Problematische Jeugdgroepen;

      d. het programma Stelselwijziging Jeugd.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel26
  - number: '27'
    text: |-
      1 De directie Control, Bedrijfsvoering en Juridische Zaken (CBJ) is belast met een integrale controltaak
      en advisering daarover aan de directeur-generaal Jeugd en Sanctietoepassing en de directeuren Sanctie- en
      Preventiebeleid en Justitieel Jeugdbeleid. De controltaak omvat in ieder geval de financiële en beleidsmatige
      control ten aanzien van de taakorganisaties, rechtspersonen met een wettelijke taak, zelfstandige bestuursorganen
      en gesubsidieerde organisaties en instellingen op het terrein van DGJS.

      2 Daarnaast is de directie belast met het gevraagd en ongevraagd advies uitbrengen over bedrijfsvoerings-,
      informatiemanagement- en juridische vraagstukken, het ondersteunen bij en voeren van juridische procedures en de
      verzorging van de interne bedrijfsvoering.

      3 De directie is budgettair verantwoordelijk voor:

      a. de Stichting Adoptievoorzieningen;

      b. het Centrum Internationale Kinderontvoering;

      c. de International Social Services;

      d. de regeling tegemoetkoming adoptiekosten.

      4 De Centrale autoriteit Internationale Kinderaangelegenheden van de afdeling, genoemd in het vijfde lid, onder c,
      verricht de werkzaamheden van de Centrale autoriteit interlandelijke adoptie, de Centrale autoriteit internationale
      kinderbescherming en de Centrale autoriteit internationale kinderontvoering. De Centrale autoriteit Internationale
      Kinderaangelegenheden is verantwoordelijk voor het uitvoeringsbeleid ten aanzien van voornoemde werkzaamheden.

      5 De directie bestaat uit:

      a. de afdeling Control;

      b. de afdeling Bedrijfsvoering;

      c. de afdeling Juridische en Internationale Zaken;

      d. het onderdeel Informatiemanagement.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel27
  - number: 27a
    text: |-
      De ketenunit i.o. faciliteert het functioneren van de uitvoeringsketen van strafrechtelijke beslissingen, de
      jeugdketen en de slachtofferketen en faciliteert het verbeteren van de prestaties van deze ketens. De ketenunit
      i.o. ondersteunt de directies bedoeld in [artikel 23, tweede lid, onder a tot en met c][ref1], en de ketenpartners
      bij strategische en tactische ketenoverleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0030837#Artikel23
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel27a
