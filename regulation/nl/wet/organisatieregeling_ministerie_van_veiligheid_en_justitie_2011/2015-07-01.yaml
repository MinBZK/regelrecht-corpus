  - number: '2'
    text: |-
      Het ministerie heeft een hoofdstructuur, bestaande uit de volgende dienstonderdelen (clusters):

      a. het cluster secretaris-generaal (SG-cluster);

      b. het cluster plaatsvervangend secretaris-generaal (PSG-cluster);

      c. het directoraat-generaal Jeugd en Sanctietoepassing (DGJS);

      d. het directoraat-generaal Politie (DGPOL);

      e. het directoraat-generaal Rechtspleging en Rechtshandhaving (DGRR);

      f. het directoraat-generaal Vreemdelingenzaken (DGVZ);

      g. de Nationaal Coördinator Terrorismebestrijding en Veiligheid (NCTV);

      h. de Inspectie Veiligheid en Justitie (IVenJ).
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel2
  - number: '3'
    text: |-
      1 De secretaris-generaal is ambtelijk eindverantwoordelijk voor de leiding van de in [artikel 2][ref1] genoemde
      dienstonderdelen.

      2 De secretaris-generaal wordt bij afwezigheid vervangen door de loco-secretaris-generaal. Als loco-secretaris-
      generaal wordt aangewezen de directeur-generaal van het directoraat-generaal Rechtspleging en Rechtshandhaving.

      3 Bij afwezigheid van de secretaris-generaal en de loco-secretaris-generaal wordt de secretaris-generaal vervangen
      door de directeur Wetgeving en Juridische Zaken. Indien ook deze afwezig is, vindt vervanging plaats door een van
      directeuren-generaal of de Nationaal Coördinator Terrorismebestrijding en Veiligheid, in volgorde van de datum van
      benoeming. Indien ook geen directeur-generaal noch de Nationaal Coördinator Terrorismebestrijding en Veiligheid
      aanwezig is, wordt de secretaris-generaal vervangen door de plaatsvervangend secretaris-generaal.

      4 De hoofden van de clusters zijn belast met de beleids- en bedrijfsvoering van de tot hun cluster behorende
      onderdelen.

      5 Eén van de tot het directoraat-generaal behorende directeuren wordt op voordracht van de desbetreffende
      directeur-generaal namens de minister door de secretaris-generaal aangewezen als plaatsvervangend directeur-
      generaal. Het voorgaande is van overeenkomstige toepassing op de Nationaal Coördinator Terrorismebestrijding en
      Veiligheid en het hoofd van de Inspectie Veiligheid en Justitie.

      6 De secretaris-generaal (voorzitter), de plaatsvervangend secretaris-generaal, de directeuren-generaal en de
      Nationaal Coördinator Terrorismebestrijding en Veiligheid vormen samen de bestuursraad. De bestuursraad formuleert
      de ministeriebrede en gemeenschappelijke kaders en bewaakt dat de activiteiten en het beleid van de onderscheiden
      clusters daarbinnen blijven. De voorzitter van het College van procureurs-generaal neemt als toehoorder deel aan
      de bestuursraad.


      [ref1]: https://wetten.overheid.nl/BWBR0030837#Artikel2
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel3
