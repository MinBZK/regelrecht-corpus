  - number: '66'
    text: |-
      1 De directeur Personeel en Organisatie is belast met het beheer van deze regeling.

      2 De hoofden van de clusters zijn verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de
      directeur Personeel en Organisatie van de gegevens die een goed beheer van deze regeling mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel66
  - number: '70'
    text: |-
      De [Organisatieregeling Ministerie van Veiligheid en Justitie][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0029453
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel70
