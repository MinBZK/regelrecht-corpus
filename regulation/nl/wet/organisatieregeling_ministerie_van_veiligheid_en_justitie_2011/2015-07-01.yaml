  - number: '71'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 juli 2011.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel71
  - number: '72'
    text: |-
      Deze regeling wordt aangehaald als: Organisatieregeling Ministerie van Veiligheid en Justitie 2011. Deze regeling
      zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel72
