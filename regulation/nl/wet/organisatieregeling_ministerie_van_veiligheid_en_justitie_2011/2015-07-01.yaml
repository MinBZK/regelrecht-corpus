    text: |-
      1 Het directoraat-generaal Rechtspleging en Rechtshandhaving (DGRR) is belast met:

      a. Het ontwikkelen en uitvoeren van beleid ten behoeve van het tegengaan van onveiligheid en criminaliteit;

      b. het scheppen van voorwaarden voor een goed functionerend rechtsbestel en een slagvaardige rechtspleging;

      c. het bewerkstelligen van een effectieve en professionele rechtshandhaving;

      d. de behandeling van uitvoeringsvraagstukken in de strafrechtketen waar een specifieke verantwoordelijkheid van de
      minister of staatssecretaris aan de orde is.

      2 Het directoraat-generaal bestaat uit een stafondersteuning en de volgende dienstonderdelen:

      a. de directie Rechtshandhaving en Criminaliteitsbestrijding (DRC);

      b. de directie Rechtsbestel (DRb);

      c. de directie Financiën, Bedrijfsvoering en Control (FBC);

      d. de directie Juridische en Operationele Aangelegenheden (DJOA);

      e. de directie Veiligheid en Bestuur (DVB);

      f. de baten-lastendienst Nederlands Forensisch Instituut (NFI);

      g. de Justitiële Informatiedienst (JustID).
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel41
  - number: '42'
    text: |-
      1 De directeur-generaal is beheersverantwoordelijk voor het openbaar ministerie.

      2 De directeur-generaal wordt secretarieel, organisatorisch en administratief ondersteund door de
      stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel42
  - number: '43'
    text: |-
      1 De directie Rechtshandhaving en Criminaliteitsbestrijding (DRC) is belast met het ontwikkelen van visie, beleid
      en samenwerkingsvormen op het terrein van de rechtshandhaving, de criminaliteitsbestrijding en het waarborgen van
      de veiligheid.

      2 de directie bestaat uit:

      a. de afdeling Georganiseerde misdaad en Algemeen criminaliteitsbeleid;

      b. de afdeling Fraude en Ordening;

      c. de afdeling Criminaliteit en Veiligheid;

      d. het Financial Intelligence Unit netwerk (FIU.NET).
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel43
  - number: '44'
    text: |-
      1 De directie Rechtsbestel (DRb) is belast met de instandhouding en ontwikkeling van het rechtsbestel, in het
      bijzonder met betrekking tot de toegang tot het recht, de organisatie en de kwaliteit van het rechtsbestel.
      Hieronder wordt in ieder geval begrepen het stelsel van de rechterlijke organisatie, alsmede de volgende
      beleidsterreinen: rechtsbijstand, juridische vrije beroepen, alternatieve geschillenbeslechting (ADR),
      schuldsanering natuurlijke personen en tolken en vertalers.

      2 De directie is voorts belast met het beheer van de Hoge Raad, het bureau van het Nederlands Register Gerechtelijk
      Deskundigen, het College bescherming persoonsgegevens, het Bureau Financieel Toezicht en het College voor de
      Rechten van de Mens.

      3 De directie bestaat uit:

      a. de afdeling Strafrechtelijk Bestel & Arbeidsvoorwaarden;

      c. de afdeling Rechtspraak & Geschiloplossing;

      d. de afdeling Toegang Rechtsbestel.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel44
  - number: '45'
    text: |-
      1 De directie Financiën, Bedrijfsvoering en Control (FBC) is belast met de ondersteuning van de directeur-generaal,
      de overige directies en de taakorganisaties binnen het directoraat-generaal Rechtspleging en Rechtshandhaving.
      Onder deze ondersteuning wordt begrepen:

      a. de ontwikkeling van het informatievoorzieningbeleid voor de verschillende ketens op het terrein van de
      rechtspleging en rechtshandhaving, in het bijzonder de strafrechtketen;

      b. het stellen van financiële kaders;

      c. het uitvoeren van impactanalyses;

      d. het voeren van de interne bedrijfsvoering.

      2 De directie bestaat uit:

      a. de afdeling Control;

      b. de afdeling Planning, Control en Managementinformatie (PCM).
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel45
  - number: '46'
    text: |-
      1 De directie Juridische en Operationele Aangelegenheden (DJOA) is belast met de voorbereiding van beslissingen
      in individuele gevallen op het terrein van rechtspleging en rechtshandhaving met toepassing van bestaande
      regels en beleidskaders. De beslissingen hebben betrekking op bestuurlijk-juridische zaken, operationele
      zaken, rechtshulpverzoeken, benoemingen of incidenten. De directie levert op deze terreinen ook bijdragen aan
      beleidsvoorstellen.

      2 De directie voert de regie en coördineert de inzet van alle betrokken dienstonderdelen en taakorganisaties
      bij de afdoening van incidenten waaraan politiek-bestuurlijke aspecten zijn verbonden. De directie ontwikkelt en
      onderhoudt daartoe de benodigde expertise en incidentenstrategie en organiseert de voorbereiding van het ministerie
      van crisisbeheersing in het kader van het nationaal handboek crisisbeheersing.

      3 De directie fungeert als het juridisch expertisecentrum van het directoraat-generaal. De directie bewaakt de
      juridische kwaliteit van de diverse producten van het directoraat-generaal en beperkt de juridische risico’s.

      4 De directie is belast met de voorbereiding en uitvoering van beslissingen van de minister
      aangaande internationale rechtshulp in strafzaken, met uitzondering van beslissingen inzake
      de overdracht en overname van de tenuitvoerlegging van vrijheidsstraffen en vrijheidsbenemende
      maatregelen op grond van de [Wet overdracht tenuitvoerlegging strafvonnissen][ref1] en de
      [Wet wederzijdse erkenning en tenuitvoerlegging vrijheidsbenemende en voorwaardelijke sancties][ref2].

      5 De directie is voorts belast met de beantwoording van brieven van burgers alsmede de coördinatie van de
      beantwoording van Kamervragen en andere parlementaire zaken.

      6 De directie bestaat uit:

      a. de afdeling Juridische, Bestuurlijke en Operationele Zaken;

      b. de afdeling Internationale Aangelegenheden en Rechtshulp in Strafzaken;

      c. de afdeling Administratieve en Juridische Ondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0004028
      [ref2]: https://wetten.overheid.nl/BWBR0031814
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004028
      - id: ref2
        bwb_id: BWBR0031814
  - number: '47'
    text: |-
      1 De directie Veiligheid en Bestuur (DVB) is belast met:

      a. het faciliteren van het lokale bestuur om ten aanzien van maatschappelijke veiligheidsvraagstukken zijn eigen
      taken uit te voeren, relevante partners bijeen te brengen en waar nodig regie te voeren;

      b. het bijdragen aan een effectieve rechtspleging en rechtshandhaving door het realiseren van een goede
      informatievoorziening in de daarvoor relevante ketens.

      2 De directie bestaat uit:

      a. de afdeling Integrale veiligheid;

      b. de afdeling Bestuurlijke aanpak;

      c. de afdeling Keteninformatievoorziening (KIV);

      d. het Landelijk Informatie en Expertise Centrum (LIEC).
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel47
  - number: '48'
    text: |-
      De baten-lastendienst Nederlands Forensisch Instituut (NFI) heeft met het oog op de waarheidsvinding in strafzaken
      de volgende kerntaken:

      a. het verrichten van onafhankelijk forensisch zaakonderzoek op overwegend technisch, medisch-biologisch en
      natuurwetenschappelijk gebied en het ter zake daarvan uitbrengen van verslag;

      b. het ontwikkelen en implementeren van nieuwe onderzoeksmethoden en technieken ter bevordering van kennis op het
      gebied van forensisch onderzoek;

      c. het zijn van (inter)nationaal kennis- en expertisecentrum op het gebied van forensisch onderzoek.

      Bij de uitvoering van deze taken levert het NFI producten of diensten aan het openbaar ministerie, de politie, de
      bijzondere opsporingsdiensten, de zittende magistratuur en het ministerie. Het NFI is voorts belast met door de
      minister aangewezen bijkomende taken.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel48
  - number: '50'
    text: |-
      De Justitiële Informatiedienst (JustID) fungeert als centrale voorziening ten behoeve van de registratie van
      justitiële en strafvorderlijke gegevens en de verstrekking daarvan aan daartoe bevoegde personen en instanties.
      Onder meer het Centraal Informatiepunt Onderzoek Telecommunicatie (CIOT) en het Platform Interceptie & Decriptie &
      Signaalanalyse (PIDS) zijn ondergebracht bij JustID.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel50
  - number: 50a
    text: |-
      1 Het directoraat-generaal Vreemdelingenzaken (DGVZ) is belast met:

      a. het uitvoeren van de vreemdelingenwetgeving en van de [Rijkswet op het Nederlanderschap][ref1];

      b. een gereglementeerde en beheerste toelating van vreemdelingen tot Nederland, een gereglementeerd en beheerst
      verblijf in en vertrek uit Nederland en een gereglementeerde en beheerste terugkeer van vreemdelingen;

      c. het voeren van de regie op de keten van toegang, toelating, toezicht en terugkeer van vreemdelingen;

      d. het adviseren van de regering over het vreemdelingenrecht en het -beleid en over het naturalisatie- en
      nationaliteitsrecht.

      2 Het directoraat-generaal Vreemdelingenzaken bestaat uit de volgende dienstonderdelen:

      a. de directie migratiebeleid (DMB);

      b. de directie regie (DRI);

      c. de dienst Terugkeer en Vertrek (DT&V);

      d. de baten-lastendienst Immigratie en Naturalisatiedienst (IND);

      e. het secretariaat van de Adviescommissie voor Vreemdelingenzaken (ACVZ).


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: 50d
    text: |-
      1 De directie Migratiebeleid (DMB) is belast met de zorg voor een gereglementeerde en beheerste toelating tot
      verblijf in en vertrek uit Nederland of terugkeer van vreemdelingen op een in nationaal en internationaal opzicht
      maatschappelijk verantwoorde wijze.

      2 De directie bestaat uit:

      a. de afdeling Toezicht, Regulier en Nationaliteit;

      b. de afdeling Asiel, Opvang en Terugkeer;

      c. de afdeling Juridische en Algemene Zaken.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel50d
  - number: 50f
    text: |-
      1 De dienst Terugkeer en Vertrek (DT&V) is als taakorganisatie belast met de uitvoering van de
      vreemdelingenwetgeving ten aanzien van vertrek en uitzetting.

      2 De dienst bestaat uit:

      a. de directie Staf;

      b. de directie Voorbereiden Vertrek;

      c. de directie Bewaring;

      d. de directie Operationele Ondersteuning.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel50f
  - number: 50g
    text: |-
      De Immigratie- en Naturalisatiedienst (IND) is een baten-lastendienst die belast is met de uitvoering van de
      vreemdelingenwetgeving en van de [Rijkswet op het Nederlanderschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel50g
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: 50h
    text: |-
      1 Het secretariaat van de Adviescommissie voor Vreemdelingenzaken (secretariaat ACVZ) is belast met de ambtelijke
      ondersteuning van die commissie.

      2 Het secretariaat bestaat uit:

      a. het procescluster Advisering;

      b. het procescluster Informatie en Documentatie;

      c. het procescluster Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel50h
  - number: 50i
    text: |-
      1 De directie regie (DRI) heeft tot taak de vreemdelingenketen in staat te stellen de Vreemdelingenwet en het
      vreemdelingenbeleid snel en zorgvuldig uit te voeren en daarover verantwoording af te leggen door het ondersteunen
      van zowel de ketenregisseur als de bij de vreemdelingenketen aangesloten organisaties. De directie heeft
      binnen het cluster tevens een aantal ondersteunende taken, waaronder de controllersfunctie, en beheert met de
      Verantwoordelijke Autoriteit de Europese Migratie- en Veiligheidsfondsen voor meerdere beleidsonderwerpen.

      2 De directie bestaat uit:

      a. De afdeling Ketensturing;

      b. De afdeling Ketenvoorzieningen;

      c. Het bureau Bedrijfsvoering en Control;

      d. Het bureau Verantwoordelijke Autoriteit.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel50i
  - number: '51'
    text: |-
      1 De Nationaal Coördinator Terrorismebestrijding en Veiligheid (NCTV) heeft tot taak het versterken van de
      nationale veiligheid en het voorkomen van maatschappelijke ontwrichting door dreigingen voor de vitale belangen van
      de samenleving te identificeren en de weerbaarheid en bescherming van die vitale belangen te versterken. Hiertoe
      verricht de NCTV in het bijzonder activiteiten die zijn gericht op:

      a. het bevorderen van de identificatie en de analyse van dreigingen en risico's op het gebied van terrorisme en
      nationale veiligheid;

      b. het reduceren van kansen of effecten van de genoemde dreigingen en risico’s door:

      1º. het verhogen van weerbaarheid van vitale belangen;

      2º. zorg te dragen voor een dekkend stelsel van de crisisbeheersing vanaf het niveau van de veiligheidsregio’s, met
      name wat betreft de organisatie van de brandweerzorg en de geneeskundige hulpverlening in die regio’s, tot en met
      het nationale niveau;

      c. het nemen van beschermingsmaatregelen ten aanzien van daartoe aangewezen bijzondere personen, objecten en
      diensten;

      d. het adequaat functioneren van het stelsel van bewaken en beveiligen;

      e. het zorgdragen voor de samenhang in de besluitvorming bij een dreigende ramp of crisis;

      f. de strategieontwikkeling rond cyber security, het realiseren van risicomanagement op het gebied van cyber
      security en het bevorderen van de publiek-private samenwerking op het gebied van cyber security.

      2 De Nationaal Coördinator Terrorismebestrijding en Veiligheid bestaat uit de volgende dienstonderdelen:

      a. de directie Strategie en Bedrijfsvoering (DS&B);

      b. de directie Cyber Security (DCS);

      c. de directie Bewaking, Beveiliging, Burgerluchtvaart (DB3);

      d. de directie Risico’s en Dreiging (DRD);

      e. de directie Weerbaarheidsverhoging (WVH);

      f. het Nationaal Crisis Centrum (NCC);

      g. het Landelijk Operationeel Coördinatie Centrum (LOCC).
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel51
  - number: '52'
    text: |-
      1 De NCTV legt inhoudelijk direct verantwoording af aan de minister.

      2 De NCTV wordt hierbij secretarieel, organisatorisch en administratief ondersteund door de stafondersteuning.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel52
  - number: '53'
    text: |-
      1 De directie Strategie en Bedrijfsvoering heeft de volgende taken:

      a. de coördinatie van algemene parlementaire aangelegenheden en de voorbereiding van interdepartementale en
      politiek-bestuurlijke besluitvorming;

      b. de strategische positionering en het relatiebeheer van de NCTV;

      c. de uitvoering van de decentrale juridische functie ten behoeve van de NCTV;

      d. de voorbereiding van de internationale en Europese beleidsvorming op het gebied van de NCTV;

      e. de ondersteuning van de NCTV op het gebied van de bedrijfsvoering, in het bijzonder betreffende
      personeelsaangelegenheden, informatiemanagement, huisvesting, automatisering, beveiliging en de financiële
      controle.

      2 De directie bestaat uit:

      a. de afdeling Strategie;

      b. de afdeling Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel53
  - number: '54'
    text: |-
      1 De directie Cyber Security heeft de volgende taken:

      a. de coördinatie van de uitvoering van de Nationale Cyber Security Strategie;

      b. het voeren van actief risicomanagement op het gebied van cyber security;

      c. het vergroten van de digitale weerbaarheid van de Nederlandse samenleving;

      d. het voeren van het secretariaat van de publiek-private samenwerking op het gebied van cyber security.

      2 De directie bestaat uit:

      a. het cluster Operationele Ondersteuning;

      b. de afdeling Cyber Security Beleid;

      c. het Nationaal Cyber Security Centrum.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel54
  - number: '55'
    text: |-
      1 De directie Bewaking, Beveiliging, Burgerluchtvaart heeft de volgende taken:

      a. het opstellen, onderhouden en uitvoeren van het nationaal stelsel van bewaken en
      beveiligen, het stelsel van speciale eenheden, het Alerteringssysteem Terrorismebestrijding, de
      [Regeling bijstand bestrijding luchtvaartterrorisme][ref1] en het uitvoeren van risicoanalyses ten behoeve van de
      burgerluchtvaart op basis waarvan eventuele aanvullende beveiligingsmaatregelen worden genomen;

      b. het in nationaal en internationaal verband opstellen van het beleid op het gebied van de beveiliging van de
      burgerluchtvaart;

      c. het opstellen van regels en het geven van aanwijzingen aan de Koninklijke marechaussee en de luchtvaartsector op
      basis van de [Luchtvaartwet][ref2] en de [Politiewet 1993][ref3];

      d. het aansturen van de Koninklijke marechaussee, voor zover deze onder het gezag van de minister is belast met het
      toezicht op de uitvoering van de beveiligingsmaatregelen door de luchtvaartsector;

      e. het opstellen, onderhouden en uitvoeren van het Nationaal Beveiligingsplan voor de Burgerluchtvaart;

      f. het deelnemen aan internationale beveiligingsinspecties op luchthavens.

      2 De directie bestaat uit:

      a. de afdeling Beveiliging Burgerluchtvaart en Alertering Terrorismebestrijding;

      b. de afdeling Bewaking en Beveiliging.


      [ref1]: https://wetten.overheid.nl/BWBR0018217
      [ref2]: https://wetten.overheid.nl/BWBR0002267
      [ref3]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0018217
      - id: ref2
        bwb_id: BWBR0002267
      - id: ref3
        bwb_id: BWBR0006299
  - number: '56'
    text: |-
      1 De directie Risico’s en Dreigingen heeft de volgende taken:

      a. het in samenwerking en in overleg met andere partijen binnen en buiten de NCTV aanleveren van
      dreiginggerelateerde producten ten behoeve van de werkzaamheden van de NCTV;

      b. het tijdens een crisis opstellen van het actuele dreigings- en incidentenbeeld en de omgevingsanalyse ten
      behoeve van de crisisbesluitvorming.

      2 De directie bestaat uit:

      a. de afdeling Terrorisme en Extremisme;

      b. de afdeling Natuurlijke, technische en maatschappelijke dreiging.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel56
  - number: '57'
    text: |-
      1 De directie Weerbaarheidsverhoging heeft de volgende taken:

      a. het versterken van de weerbaarheid van de Nederlandse samenleving door het weerbaarder maken van vitale
      belangen, het voorkomen en beperken van de gevolgen van een ramp of crisis en het herstellen van de daardoor
      veroorzaakte schade;

      b. het zorg dragen voor een optimaal functioneren van het stelsel voor crisisbeheersing en rampenbestrijding, zowel
      voor de landelijke crisisorganisatie als voor het stelsel van veiligheidsregio’s.

      2 De directie bestaat uit:

      a. de afdeling Veiligheidsregio’s;

      b. de afdeling Generieke Veiligheid;

      c. de afdeling Risicoaanpak;

      d. de afdeling Informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel57
  - number: '58'
    text: |-
      1 Het Nationaal Crisis Centrum heeft de volgende taken:

      a. het zorg dragen voor rijksbrede crisiscoördinatie;

      b. het faciliteren, adviseren en het op verzoek coördineren bij grote evenementen met een potentieel risico op
      openbare orde- en veiligheidsproblematiek;

      c. het ontwikkelen en uitvoeren van de risico- en crisiscommunicatie en corporate communicatie.

      2 Het centrum bestaat uit:

      a. de eenheid Crisiscoördinatie;

      b. de eenheid Communicatie.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel58
  - number: '59'
    text: |-
      Het Landelijk Operationeel Coördinatie Centrum (LOCC) maakt deel uit van de nationale
      crisisbesluitvormingsstructuur en draagt hierbij zorg voor het aanleveren van het multidisciplinair Landelijk
      Operationeel Beeld en het operationeel advies bij nationale en internationale incidenten, crises, rampen en
      grootschalige evenementen. Het LOCC coördineert nationale en internationale bijstand, met inbegrip van de bijstand,
      bedoeld in de [Wet veiligheidsregio’s][ref1] en de [Politiewet 2012][ref2]. Ook draagt het LOCC als de National
      Training Coördinator zorg voor de coördinatie, opleiding en inzet van de Nederlandse experts in het kader van EU
      Civil Protection Mechanism.


      [ref1]: https://wetten.overheid.nl/BWBR0027466
      [ref2]: https://wetten.overheid.nl/BWBR0031788
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0027466
      - id: ref2
        bwb_id: BWBR0031788
  - number: '62'
    text: |-
      1 De Inspectie Veiligheid en Justitie (IVenJ) is belast met toezichtstaken op het terrein van het ministerie en
      heeft daartoe de volgende hoofdtaken:

      a. het houden van toezicht op de uitvoering en de naleving van de regelgeving op het terrein van het ministerie en
      van regelgeving op andere daartoe bij of krachtens de wet aangewezen beleidsterreinen;

      b. het gevraagd en ongevraagd verstrekken van inlichtingen en adviezen aan de minister of staatssecretaris over
      onderwerpen die tot hun taken horen;

      c. het vervullen van andere door de minister aan de Inspectie opgedragen toezichtstaken.

      2 De Inspectie Veiligheid en Justitie bestaat uit de volgende dienstonderdelen:

      a. de directie Toezicht (DT);

      b. de directie Strategie en Innovatie (DSI);

      c. het stafbureau Inspectie VenJ (Stafbureau IVenJ).
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel62
  - number: 62a
    text: |-
      De directie Toezicht is belast met de uitvoering van de toezichttaken conform het inspectiewerkplan. Binnen deze
      directie worden de inspectieonderzoeken uitgevoerd, geclusterd naar domein, waarbij domein gezien moet worden als
      een onderwerpinhoudelijk gerelateerde clustering van projecten.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel62a
  - number: 62b
    text: |-
      De directie Strategie en Innovatie is belast met zowel de strategische en innovatieve functie als met de
      ontwikkeling van nieuwe onderzoeksdomeinen en –taken. Daarnaast worden binnen deze directie ook onderzoeken
      voorbereid vanuit de ontwikkeltaak van de directie.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel62b
  - number: 62c
    text: |-
      Het Stafbureau IVenJ is belast met de bedrijfsvoering, de uitvoering van de communicatie en de ondersteuning van de
      leiding van IVenJ. Het bureau stelt de leiding in staat om de processen binnen IVenJ te beheersen en aan te sturen.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel62c
  - number: '63'
    text: |-
      Bij de hoofden van de in [artikel 2][ref1] genoemde clusters en daaronder ressorterende dienstonderdelen liggen
      voor het daarbij werkzame personeel ter inzage:

      a. een exemplaar van deze regeling;

      b. het organisatie- en formatierapport van het betreffende dienstonderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0030837#Artikel2
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0030837
        artikel: '2'
        hoofdstuk: I
  - number: '64'
    text: |-
      1 Een voornemen tot aanpassing van de organisatie zoals deze is weergegeven in deze regeling, wordt genomen door de
      secretaris-generaal, gehoord de bestuursraad.

      2 De directeur Personeel en Organisatie adviseert de secretaris-generaal alvorens een beslissing omtrent instemming
      wordt genomen.
    url: https://wetten.overheid.nl/BWBR0030837/2015-07-01#Artikel64
  - number: '65'
    text: |-
      1 Elk van de dienstonderdelen welke ressorteren onder de in [artikel 2][ref1] genoemde clusters ontwerpt en
      onderhoudt een organisatierapport en een formatierapport en, voor zover van toepassing, een taakbesluit en een
      baten-lastendienstregeling.

      2 Voor zover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in
      [artikel 2, onder a, b, g en h][ref2], is de secretaris-generaal bevoegd het document namens de minister vast
      te stellen.

      3 Voor zover een document als bedoeld in het eerste lid betrekking heeft op een dienstonderdeel, genoemd in
      [artikel 2, onder c, d, e en f][ref3], is de directeur-generaal onder wie het dienstonderdeel ressorteert, bevoegd
      het document namens de minister vast te stellen.

      4 De secretaris-generaal respectievelijk de directeur-generaal kan de in het tweede respectievelijk derde lid
      bedoelde bevoegdheid mandateren aan een onder hem ressorterende ambtenaar.

      5 Alvorens een document als bedoeld in het eerste lid, kan worden vastgesteld, behoeft dit de instemming van de
      bestuursraad. De directeur Personeel en Organisatie adviseert de bestuursraad alvorens een beslissing omtrent
      instemming wordt genomen.


