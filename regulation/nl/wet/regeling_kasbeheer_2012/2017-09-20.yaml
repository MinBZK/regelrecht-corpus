---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_kasbeheer_2012
regulatory_layer: WET
publication_date: '2017-04-07'
valid_from: '2017-09-20'
bwb_id: BWBR0030597
url: https://wetten.overheid.nl/BWBR0030597/2017-09-20
preamble:
  text: |-
    Gelet op artikel 3, eerste lid van het Besluit kasbeheer van 1 januari 2012;

    Na overleg met de Algemene Rekenkamer, brief van 23 juni 2011, nr. 11004111 R;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.1.a
    text: |-
      *administratieve organisatie:* het geheel van organisatorische maatregelen binnen een organisatie, inclusief het
      stelsel van maatregelen van interne beheersing, dat betrekking heeft op een goede werking van het kasbeheer, de
      financieel-administratieve systemen en op de recht- en doelmatigheid van het kasbeheer inclusief de verantwoording
      die hierover moet worden afgelegd;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.1.b
    text: '*betaalwijze:* een methode om schulden te vereffenen;'
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.1.c
    text: |-
      *betalingsordonnateur:* de functionaris die vaststelt dat er een betalingsverplichting is en daarna opdracht geeft
      aan de kasbeheerder om tot betaling over te gaan;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.1.d
    text: |-
      *controletechnische functiescheiding:* het zodanig scheiden van de functies bewaren, beschikken, betalen,
      innen, registreren en controleren, dat met de uitvoering daarvan functionarissen worden belast die in beginsel
      hiërarchisch onder het directe gezag staan van verschillende leidinggevenden;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.1.e
    text: |-
      *interne beheersing:* het systeem dat het management in staat stelt om de risico’s, die het behalen van de
      doelstellingen van de organisatie bedreigen, te identificeren, te prioriteren, te analyseren en te beheersen;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.1.f
    text: |-
      *kasbeheerder:* de functionaris die de betalingen verricht en de ontvangsten int, waartoe de ordonnateur opdracht
      heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.1.g
    text: '*kassen:* contant geld en tegoeden op bankrekeningen;'
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.1.h
    text: |-
      *kassier:* de functionaris die onder verantwoordelijkheid van de kasbeheerder contante betalingen verricht contante
      ontvangsten int of geldswaardige papieren beheert;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.1.i
    text: '*de ministers:* de betrokken ministers, ieder voor zover het hem aangaat;'
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.1.j
    text: |-
      *vorderingenordonnateur:* de functionaris die vaststelt dat er een recht op een vordering is ontstaan en daarna de
      vordering invorderbaar stelt door het versturen van bijvoorbeeld een factuur of een heffingsaanslag.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: '1.2'
    text: 'Tot het kasbeheer worden in elk geval de volgende beheershandelingen gerekend:'
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.2.a
    text: het bewaren van geld en geldswaardige papieren;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.2.b
    text: het betaalbaar stellen van aangegane financiële verplichtingen;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.2.c
    text: het verrichten van geldelijke betalingen;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.2.d
    text: het invorderbaar stellen van vorderingen;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.2.e
    text: het innen van geldelijke ontvangsten;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.2.f
    text: het opnemen en storten van contant geld;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.2.g
    text: het elektronisch opladen en afwaarderen van contantgeldkaarten;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.2.h
    text: het in ontvangst nemen en het afgeven van geldswaardige papieren;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.2.i
    text: het administreren van de beheershandelingen, genoemd onder a tot en met h.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: '1.3'
    text: 'Ten behoeve van het kasbeheer worden de volgende handelingen uitgevoerd:'
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.3.a
    text: het aanwijzen van betalingsordonnateurs, vorderingenordonnateurs, kasbeheerders en kassiers;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: 1.3.b
    text: het intrekken van zodanige aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel1
  - number: '2'
    text: |-
      De ministers leggen de beschrijving van de administratieve organisatie voor het kasbeheer vast, waarin is voorzien
      in voldoende controletechnische functiescheiding en interne beheersingsmaatregelen die borgen dat de beschreven
      procedures worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel2
  - number: '3.1'
    text: |-
      De betalingsordonnateur geeft de kasbeheerder opdrachten tot het verrichten van de betalingen die uit de financiële
      verplichtingen van het Rijk voortvloeien.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: '3.2'
    text: |-
      De vorderingenordonnateur geeft de kasbeheerder opdrachten tot het innen van de ontvangsten die uit de invorderbaar
      gestelde vorderingen van het Rijk voortvloeien.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: '3.3'
    text: 'De betalingsordonnateur stelt, voordat hij een opdracht tot betaling geeft, vast:'
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: 3.3.a
    text: of er voldoende budget is;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: 3.3.b
    text: of de noodzaak tot betaling bestaat;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: 3.3.c
    text: bij privaatrechtelijke betalingen of de prestatie door de wederpartij is geleverd;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: 3.3.d
    text: bij publiekrechtelijke betalingen of de wederpartij aan de voorwaarden van de toekenningsbeschikking heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: '3.4'
    text: |-
      In afwijking van het derde lid, aanhef en onder c, kan voor privaatrechtelijke betalingen tot hoogstens het
      grensbedrag, bedoeld in het vijfde lid, het vaststellen of de prestatie door de wederpartij is geleverd achterwege
      blijven, mits:
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: 3.4.a
    text: |-
      op basis van risico-inschatting in de administratieve organisatie is vastgelegd bij welke categorieën
      privaatrechtelijke betalingen en bij welk bedrag het achterwege laten van de prestatieverklaringen is toegestaan;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: 3.4.b
    text: |-
      de levering van de prestaties voor de betalingen, bedoeld onder a, na het verrichten van de betaling
      steekproefsgewijs worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: 3.4.c
    text: |-
      de inrichting, de omvang, de periodiciteit, de criteria en de evaluatie van de steekproef in de administratieve
      organisatie zijn vastgelegd;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: 3.4.d
    text: de risico-inschatting periodiek wordt geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: '3.5'
    text: |-
      In afwijking van het derde lid, aanhef en onder b en c, kan bij de vaststelling van de noodzaak tot betaling en
      de vaststelling of de prestatie door de wederpartij is geleverd bij privaatrechtelijke betalingen de hoogte van
      het bedrag ten hoogste tien procent met een maximum van € 1.000 inclusief btw afwijken van het bedrag waartegen
      de goederen of diensten zijn besteld of de prestatie is geleverd, mits in de administratieve organisatie is
      vastgelegd:
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: 3.5.a
    text: |-
      bij welke categorieën goederen en diensten, tot welk percentage en tot welk bedrag de afwijking op basis van
      risico-inschatting wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: 3.5.b
    text: |-
      wat de onderbouwing van de risico-inschatting per categorie goederen en diensten is, inclusief de onderbouwing van
      de beoogde doelmatigheidswinst, en deze waar mogelijk te kwantificeren;
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: 3.5.c
    text: |-
      op welke wijze de verantwoordelijkheden, de monitoring en de periodieke evaluatie van de risico-inschatting en de
      controle van de opzet en werking van de maatregelen, bedoeld onder a en b, zijn ingericht.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: '3.6'
    text: |-
      Met de schriftelijke instemming van de Minister van Financiën kan worden afgeweken van het percentage en het
      maximum bedrag, genoemd in [artikel 3, vijfde lid][ref1], aanhef. De Minister van Financiën verleent de instemming
      na overleg met de Auditdienst Rijk en de Algemene Rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0030597#Artikel3
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030597
        artikel: '3'
  - number: '3.7'
    text: Onze Minister van Financiën schrijft het grensbedrag voor privaatrechtelijke betalingen, voor.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: '3.8'
    text: De resultaten van de verificatie worden controleerbaar vastgelegd.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: '3.9'
    text: |-
      De vorderingenordonnateur draagt zorg voor een deugdelijke verificatie van het recht op de vorderingen, voordat hij
      een vordering invorderbaar stelt.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel3
  - number: '4.1'
    text: |-
      De kasbeheerder verricht de betalingen en int de ontvangsten waartoe de betrokken betalingsordonnateur
      respectievelijk vorderingenordonnateur hem opdracht geeft, is belast met de ontvangst en de afgifte van
      geldswaardige papieren en bewaart het contante geld en de geldswaardige papieren op een zo veilig mogelijke plaats.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel4
  - number: '4.2'
    text: |-
      De kasbeheerder draagt zorg voor de tijdigheid, juistheid en volledigheid van de te verrichten betalingen en te
      innen ontvangsten. Indien hij van oordeel is dat een betaling niet verschuldigd is of een ontvangst niet terecht
      is, overlegt hij met de betalingsordonnateur dan wel vorderingenordonnateur en zo nodig met het hoofd van de
      betaalorganisatie. Leidt dit overleg niet tot overeenstemming, dan wordt het geschil ter beslissing voorgelegd aan
      de betrokken directeur Financieel-Economische Zaken. In het betreffende dossier wordt vastgelegd wat het geschil
      inhoudt en welk besluit erover is genomen.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel4
  - number: '4.3'
    text: |-
      De kasbeheerder legt, met inachtneming van de door de betrokken minister gestelde regels, aan de hand van de
      financiële administratie periodiek verantwoording af aan het hoofd van de betaalorganisatie over de door hem in die
      functie verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel4
  - number: '4.4'
    text: |-
      Het hoofd van de betaalorganisatie kan, na verkregen instemming van de betrokken directeur Financieel-Economische
      Zaken en van de betrokken kasbeheerder, ter ondersteuning van de kasbeheerder één of meer kassiers benoemen.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel4
  - number: '4.5'
    text: |-
      Een kassier volgt, met inachtneming van de geldende voorschriften, bij de uitvoering van zijn werkzaamheden de
      aanwijzingen van de betrokken kasbeheerder op.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel4
  - number: '5.1'
    text: Betalingen door het Rijk geschieden door middel van een overboeking naar een bankrekening van de begunstigde.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel5
  - number: '5.2'
    text: Voor betalingen door het Rijk wordt in beginsel geen gebruik gemaakt van cheques.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel5
  - number: '5.3'
    text: |-
      Voor betalingen door het Rijk wordt in beginsel geen gebruik gemaakt van contant geld, contantgeldkaarten of
      bankpassen, tenzij dit aantoonbaar doelmatiger is.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel5
  - number: '5.4'
    text: |-
      Voor betalingen door het Rijk door middel van automatische incasso mogen alleen separate bankrekeningen met een
      beperkte intradaglimiet worden gebruikt, die uitsluitend voor dit doel zijn opengesteld.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel5
  - number: '5.5'
    text: Betalingen door het Rijk geschieden tegen ontvangst van een geldig betalingsbewijs.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel5
  - number: '6.1'
    text: |-
      Het gebruik van zakelijke creditkaarten door bewindspersonen of ten behoeve van bewindspersonen in Nederland en in
      het buitenland is toegestaan.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel6
  - number: '6.2'
    text: |-
      Het gebruik van zakelijke creditkaarten door ambtenaren in de zin van de Ambtenarenwet is uitsluitend toegestaan
      voor:
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel6
  - number: 6.2.a
    text: |-
      transacties via internet, indien het aan te schaffen product niet of moeilijk op rekening kan worden gekocht en
      bancair betaald kan worden.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel6
  - number: 6.2.b
    text: |-
      transacties in het buitenland indien er niet of moeilijk op rekening kan worden gekocht, of indien er regelmatig
      relatief grote betalingen worden gedaan.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel6
  - number: '6.3'
    text: |-
      De directeur FEZ is bevoegd voorwaarden te stellen waaronder het gebruik van zakelijke kaarten die vergelijkbaar
      zijn met een creditkaart is toegestaan.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel6
  - number: '7.1'
    text: |-
      De ministers bevorderen dat geldelijke ontvangsten van het Rijk zoveel mogelijk worden geïnd door middel van een
      overboeking naar of een storting op een bankrekening van het Rijk.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel7
  - number: '7.2'
    text: |-
      De ministers ontmoedigen het verrichten van geldelijke betalingen door derden aan het Rijk door middel van
      creditkaarten, cheques en contant geld, tenzij die wijzen van betalen in bepaalde situaties aantoonbaar doelmatiger
      zijn.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel7
  - number: '7.3'
    text: |-
      Ontvangen contant geld en cheques worden zoveel mogelijk dagelijks aangeboden aan de bank waar het ministerie zijn
      rekeningen aanhoudt, om als tegoed bij te schrijven.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel7
  - number: '7.4'
    text: |-
      Het als geldelijke betaling in ontvangst nemen van niet als wettig betaalmiddel aangemerkte zaken is niet
      toegestaan. Met de instemming van de Minister van Financiën kan hiervan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel7
  - number: '7.5'
    text: Het innen van ontvangsten met behulp van een machtiging tot automatische incasso is toegestaan.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel7
  - number: '8.1'
    text: |-
      Het afgeven aan derden van geldswaardige papieren, bedoeld in
      [artikel 1, tweede lid, onder a en c van het Besluit kasbeheer 2012][ref1] geschiedt tegen ontvangst van een geldig
      ontvangstbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030604#Artikel1
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030604
        artikel: '1'
  - number: '8.2'
    text: |-
      Het ontvangen van geldswaardige papieren van derden, bedoeld in
      [artikel 1, tweede lid, onder a en c van het Besluit kasbeheer 2012][ref1] geschiedt tegen afgifte van een geldig
      betalingsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0030604#Artikel1
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030604
        artikel: '1'
  - number: '9.1'
    text: |-
      De Circulaire gebruik van creditkaarten en bankpassen, kenmerk B93/47, 19 mei 1993, de Circulaire aanvulling
      regeling zakelijke creditkaarten binnen de rijksdienst, kenmerk FM 2004-00922 m, 16 december 2004 en de Circulaire
      tanken op krediet/Beschikking kasbeheer, kenmerk B93/276, 6 augustus 1993 worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel9
  - number: '9.2'
    text: 'Deze regeling kan worden aangehaald als: *Regeling kasbeheer 2012.*'
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel9
  - number: '9.3'
    text: |-
      Zij wordt ter kennis gebracht van de Algemene Rekenkamer en zal voorts openbaar worden gemaakt door publicatie in
      het Handboek Financiële Informatie en Administratie Rijksoverheid (www.minfin.nl/hafir).
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel9
  - number: '9.4'
    text: |-
      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst en treedt met ingang van 1 januari 2012
      in werking.
    url: https://wetten.overheid.nl/BWBR0030597/2017-09-20#Artikel9
