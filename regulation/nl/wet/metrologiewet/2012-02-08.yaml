  - number: '50'
    text: |-
      1 Op aanvragen om een toelating van een model als bedoeld in [artikel 11a, van de IJkwet][ref1], verzoeken om
      ontheffing als bedoeld in de [artikelen 21b][ref2] en [21c van die wet][ref3] en aanvragen om erkenning van
      ijkbevoegdheid als bedoeld in [artikel 26 van die wet][ref4], waarop nog geen besluit is genomen op het tijdstip
      van inwerkingtreding van [artikel 44][ref5], wordt beslist met toepassing van het recht zoals dat gold onmiddellijk
      voorafgaand aan dat tijdstip.

      2 Ten aanzien van bezwaarschriftprocedures, beroepsprocedures en andere gerechtelijke procedures waarin op het
      tijdstip van inwerkingtreding van [artikel 44][ref6] nog geen definitief bindende beslissing is genomen, blijft het
      recht zoals dat gold onmiddellijk voorafgaand aan dat tijdstip van toepassing.

      3 De op grond van [artikel 22 van de IJkwet][ref7] aangewezen rechtspersoon blijft voor de toepassing van dit
      artikel fungeren als ijkinstelling.


