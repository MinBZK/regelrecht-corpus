  - number: '27'
    text: |-
      1 Onze Minister wijst een in Nederland gevestigde rechtspersoon aan die tot taak heeft zorg te dragen voor
      de uitoefening van het toezicht op de naleving van het bepaalde bij of krachtens [hoofdstuk 5][ref1] en
      [artikel 39][ref2]. De [Kaderwet zelfstandige bestuursorganen][ref3] is van toepassing, met uitzondering van
      [artikel 22 van die wet][ref4].

      2 De aan te wijzen rechtspersoon voldoet aan de volgende eisen:

      a. hij is wat betreft organisatie, personeel en materieel in staat de in het eerste lid bedoelde taak naar behoren
      te vervullen;

      b. hij beschikt over standaarden die herleidbaar zijn naar nationale meetstandaarden van grootheden of naar
      andere meetstandaarden van grootheden die worden beheerd of verwezenlijkt met inachtneming van hetgeen terzake
      door de bevoegde organen van het in [artikel 3, tweede lid][ref5], bedoelde verdrag in het kader van dat verdrag
      is bepaald;

      c. hij is niet een aangewezen instantie als bedoeld in [artikel 12][ref6];

      d. de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke vervulling van de taak, alsmede naleving van de in deze wet neergelegde verplichtingen, is
      gewaarborgd.

      3 Wijziging van de statuten van de rechtspersoon behoeft de goedkeuring van Onze Minister.
      Onze Minister onthoudt zijn goedkeuring indien de statuten na de wijziging onvoldoende zouden
      zijn afgestemd op het uitoefenen van het toezicht en op de in het tweede lid gestelde eisen. De
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref7] zijn van overeenkomstige toepassing.

      4 Een aanwijzing kan worden ingetrokken indien:

      a. de rechtspersoon daarom verzoekt;

      b. de rechtspersoon zijn taak niet naar behoren uitoefent of zijn verplichtingen op grond van deze wet niet
      naleeft;

      c. de rechtspersoon niet meer voldoet aan de in het tweede lid opgenomen eisen.

      5 Van een beschikking tot aanwijzing of tot intrekking van een aanwijzing wordt mededeling gedaan in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Hoofdstuk5
