  - number: '30'
    text: |-
      1 De op grond van [artikel 29, eerste lid][ref1], aangewezen werknemers oefenen zonodig de in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref2] genoemde bevoegdheid uit met behulp van de sterke arm.

      2 De op grond van [artikel 29, eerste lid][ref3], aangewezen werknemers mogen bij het toezicht in hun oordeel
      betrekken de bevindingen van personen, die in de uitoefening van een beroep of bedrijf meetinstrumenten controleren
      of onderhouden, indien de toezichthoudende instantie zich er van heeft verzekerd dat die personen over de vereiste
      deskundigheid beschikken en de onafhankelijkheid van het toezicht niet in het geding is.


