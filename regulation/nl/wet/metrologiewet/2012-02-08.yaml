  - number: '28'
    text: |-
      1 Onze Minister kan, in voorkomend geval na overleg met Onze Minister wie het mede aangaat, ten aanzien
      van een meetinstrument of ten behoeve van een meettaak in plaats van de in [artikel 27][ref1] bedoelde
      rechtspersoon een andere instelling belasten met de zorg voor een of meer onderdelen van het toezicht, bedoeld in
      [artikel 27, eerste lid][ref2].

      2 De [artikelen 29 tot en met 34][ref3], [35, eerste lid][ref4], en [36][ref5] zijn van overeenkomstige toepassing.

      3 Een instelling als bedoeld in het eerste lid verstrekt desgevraagd aan Onze Minister alle voor de uitoefening
      van diens taak benodigde inlichtingen. Onze Minister kan inzage vorderen van alle zakelijke gegevens en bescheiden,
      indien dat voor de vervulling van zijn taak redelijkerwijs nodig is.

      4 Onze Minister oefent zijn bevoegdheden ten aanzien van de instelling, bedoeld in het eerste lid, uit na overleg
      met Onze Minister onder wiens verantwoordelijkheid de instelling ressorteert.


