  - number: '2'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor grootheden meeteenheden worden vastgesteld en kunnen tevens regels
      worden gesteld betreffende:

      a. het symbool, de aanduiding, de omschrijving en het gebruik van een meeteenheid;

      b. de benaming en de meetstandaard van een grootheid.
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel2
  - number: '3'
    text: |-
      1 Indien krachtens [artikel 2][ref1] een nationale meetstandaard van een grootheid wordt verwezenlijkt of
      beheerd, wijst Onze Minister één in Nederland gevestigde instelling aan die tot taak heeft zorg te dragen voor het
      verwezenlijken en beheren van die nationale meetstandaard.

      2 Voor een aanwijzing komt in aanmerking een instelling die

      a. wat betreft organisatie, personeel en materieel zodanig is ingericht dat de verwezenlijking of het beheer van
      de nationale meetstandaard van de betrokken grootheid kan worden verricht met inachtneming van hetgeen terzake
      door de bevoegde organen van het op 20 mei 1875 te Parijs gesloten verdrag ter verzekering van de internationale
      eenheid en de volmaking van het metrieke stelsel (Stb. 1929, 219) in het kader van dat verdrag is bepaald of in
      overeenstemming met het terzake bepaalde in een EG-besluit en

      b. de in het eerste lid bedoelde taak onafhankelijk kan vervullen.

      3 De aanwijzing kan worden ingetrokken indien:

      a. de betrokken instelling daarom verzoekt;

      b. blijkt dat de instelling de op grond van deze wet gestelde regels ten aanzien van de meetstandaard niet naleeft;

      c. de instelling niet meer voldoet aan de in het tweede lid bedoelde eisen;

      d. de instelling niet voldoet aan andere uit deze wet voortvloeiende verplichtingen.

      4 Een op grond van het eerste lid aangewezen instelling herleidt de meetstandaarden van aangewezen instanties en
      toezichthouders op hun verzoek naar de nationale meetstandaard van de betrokken grootheid.

      5 Onze Minister kan een instelling aanwijzingen geven met betrekking tot de uitoefening van haar taak.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel2
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '2'
        hoofdstuk: '2'
  - number: '4'
    text: |-
      1 Er is een Raad van deskundigen voor de nationale meetstandaarden die tot taak heeft:

      a. toezicht uit te oefenen op de verwezenlijking en het beheer van nationale meetstandaarden en omtrent dat
      toezicht jaarlijks verslag uit te brengen aan Onze Minister en hem overigens van raad te dienen;

      b. advies uit te brengen over aangelegenheden in verband met de meetstandaarden van grootheden.

      2 De raad wordt door Onze Minister in de gelegenheid gesteld zijn zienswijze te geven over het voornemen tot een
      aanwijzing of tot een intrekking van een aanwijzing op grond van [artikel 3][ref1].

      3 De raad bestaat uit ten hoogste negen leden.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel3
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '3'
        hoofdstuk: '2'
  - number: '5'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen uit hoofde van openbaar belang, volksgezondheid, openbare
      veiligheid, openbare orde, milieubescherming en consumentenbescherming of ten behoeve van eerlijke handel, van
      heffing van belastingen of van andere heffingen, regels worden gesteld omtrent meetinstrumenten met een meettaak
      ten behoeve van een specifieke toepassing, onder meer betreffende:

      a. de eisen waaraan een meetinstrument, dan wel een onderdeel van een meetinstrument, moet voldoen;

      b. de omstandigheden waaronder een meetinstrument wordt gebruikt;

      c. de aanwijzing van normen die overeenkomen met geharmoniseerde Europese normen voor een meetinstrument of met
      normatieve documenten en lijsten waarvan de referenties binnen de Europese Unie op de daarvoor geldende wijze zijn
      bekendgemaakt;

      d. de merktekens waaruit blijkt dat een meetinstrument voldoet aan de gestelde eisen, alsmede andere merktekens
      en opschriften.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de
      overeenstemmingsbeoordelingen van meetinstrumenten, alsmede omtrent het aanbrengen van de merktekens en opschriften
      en de aanwijzing van degenen die daartoe bevoegd zijn.

      3 In de in het eerste en tweede lid bedoelde regels kan onderscheid worden gemaakt tussen het in de handel brengen,
      in gebruik nemen, verhandelen en het gebruik van meetinstrumenten.
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel5
  - number: '6'
    text: |-
      1 Een geregeld meetinstrument ondergaat een voor dat meetinstrument op grond van [artikel 5][ref1] voorgeschreven
      overeenstemmingsbeoordeling voordat het in de handel wordt gebracht of in gebruik wordt genomen.

      2 Met meetinstrumenten die een in het eerste lid bedoelde overeenstemmingsbeoordeling hebben ondergaan, worden
      gelijkgesteld meetinstrumenten die in een andere lidstaat van de Europese Unie dan wel in een staat niet zijnde
      een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat
      Nederland bindt, rechtmatig zijn geproduceerd of in de handel zijn gebracht en die door een gelijkwaardige, door
      die staat erkende instantie op hun overeenstemming met de gestelde eisen zijn beoordeeld, mits bij die beoordeling
      aan gelijkwaardige eisen is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '5'
        hoofdstuk: '3'
  - number: '7'
    text: |-
      Een in gebruik genomen geregeld meetinstrument ondergaat een op grond van [artikel 5][ref1] voor dat meetinstrument
      voorgeschreven overeenstemmingsbeoordeling:

      a. voordat het meetinstrument weer wordt gebruikt na een reparatie of een verandering die van invloed kan zijn op
      de meetfunctie;

      b. na schending van de merktekens;

      c. op verzoek van de eigenaar of de gebruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '5'
        hoofdstuk: '3'
  - number: '8'
    text: |-
      Een meetinstrument dat bij de overeenstemmingsbeoordeling voldoet aan de aan dat meetinstrument gestelde eisen,
      wordt overeenkomstig de krachtens [artikel 5][ref1] gestelde regels voorzien van de voor dat meetinstrument
      vastgestelde merktekens en opschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '5'
        hoofdstuk: '3'
  - number: '9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het in de handel brengen, verhandelen of
      in gebruik nemen van andere meetinstrumenten dan geregelde meetinstrumenten, in verband met de uitvoering van een
      EG-besluit, regels als bedoeld in [artikel 5, eerste lid, onderdelen a tot en met d, en tweede lid][ref1], worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '5'
        hoofdstuk: '3'
  - number: '10'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de eisen vastgesteld waaraan instanties moeten voldoen die
      een toetsende taak in het kader van een overeenstemmingsbeoordeling uitvoeren.
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel10
  - number: '11'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat een aangewezen instantie volgens bij die regeling vastgestelde
      regels een natuurlijke persoon of een rechtspersoon een erkenning kan verlenen om bepaalde werkzaamheden uit te
      voeren in het kader van een overeenstemmingsbeoordeling van in gebruik genomen meetinstrumenten.

      2 In de in het eerste lid bedoelde regels wordt bepaald op welke wijze bekendheid wordt gegeven aan een verleende
      of ingetrokken erkenning.
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel11
  - number: '12'
    text: |-
      1 Onze Minister wijst de instanties aan die bevoegd zijn tot het uitvoeren van een toetsende taak in het kader van
      een overeenstemmingsbeoordeling van een meetinstrument. Hij kan daarbij bepalen dat de instantie een bevoegdheid
      heeft een erkenning als bedoeld in [artikel 11, eerste lid][ref1], te verlenen.

      2 Voor aanwijzing komt in aanmerking een instantie die een daartoe strekkende aanvraag doet en die voldoet aan de
      krachtens [artikel 10][ref2] gestelde eisen.

      3 Aan een aanwijzing kunnen voorschriften worden verbonden.

      4 Indien door de Commissie van de Europese Gemeenschappen een kenmerk of identificatienummer voor de aangewezen
      instantie is vastgesteld, wordt dit opgenomen in de aanwijzing. Voorts kan in de aanwijzing een vastgesteld
      nationaal kenmerk of identificatienummer voor de aangewezen instantie worden opgenomen.

      5 Onze Minister trekt een aanwijzing in indien:

      a. de aangewezen instantie daarom verzoekt;

      b. de aangewezen instantie niet langer voldoet aan de krachtens [artikel 10][ref3] gestelde eisen;

      c. de aangewezen instantie de haar op grond van deze wet toegekende taken verwaarloost.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0019517#Artikel10
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel12
    references:
      - id: ref1
