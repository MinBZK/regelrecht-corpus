  - number: '31'
    text: |-
      Onze Minister kan, indien een EG-besluit daartoe noodzaakt, de toezichthoudende instantie opdragen gebruik te maken
      van haar bevoegdheden om de naleving van deze wet af te dwingen.
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel31
  - number: '33'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de gegevensverstrekking door de toezichthoudende instantie
      aan aangewezen instanties en aan de instanties die in andere lidstaten van de Europese Unie of in een andere staat
      die partij is bij de Overeenkomst inzake de Europese Economische Ruimte belast zijn met het toezicht op de naleving
      van regels op het terrein van de metrologie die voortvloeien uit een EG-besluit.
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel33
  - number: '34'
    text: |-
      1 De op grond van [artikel 29][ref1] aangewezen werknemers van de toezichthoudende instantie zijn bevoegd geregelde
      meetinstrumenten die bij het onderzoek bedoeld in [artikel 5:18 van de Algemene wet bestuursrecht][ref2], niet aan
      de krachtens [artikel 5, eerste lid][ref3], gestelde eisen voldoen, te voorzien van een afkeurmerkteken.

      2 Het model van het in het eerste lid bedoelde afkeurmerkteken wordt bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel518
