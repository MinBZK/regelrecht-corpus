preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regels met betrekking tot meeteenheden en het in de
    handel brengen en het gebruik van meetinstrumenten op een aan de eisen van deze tijd aangepaste en overzichtelijke
    wijze vast te stellen, daarbij onder meer rekening houdend met de implementatie van EG-regelgeving op het terrein
    van de metrologie en in het bijzonder van richtlijn 2004/22/EG van het Europees Parlement en de Raad van 31 maart
    2004 betreffende meetinstrumenten (PbEU L 135);

    Zo is het, dat Wij, de Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken, Landbouw en Innovatie;

      b. EG-besluit: bindend besluit van de Raad van de Europese Unie, van het Europese Parlement en de Raad gezamenlijk
      of van de Commissie van de Europese Gemeenschappen;

      c. meetinstrument: apparaat of systeem met een meetfunctie;

      d. onderdeel: apparaat dat onafhankelijk functioneert en dat samen met andere compatibele onderdelen of een
      compatibel meetinstrument, een meetinstrument vormt;

      e. geregelde meettaak: meettaak ten behoeve van een specifieke toepassing, bedoeld in
      [artikel 5, eerste lid][ref1];

      f. geregeld meetinstrument: meetinstrument bestemd voor een geregelde meettaak ten aanzien waarvan krachtens
      [artikel 5, eerste lid][ref2], regels zijn gesteld;

      g. overeenstemmingsbeoordeling: beoordeling van de overeenstemming van een meetinstrument of van een onderdeel, met
      de gestelde eisen;

      h. in de handel brengen: voor het eerst al dan niet tegen betaling beschikbaar stellen van een voor een
      eindgebruiker bestemd meetinstrument;

      i. in gebruik nemen: eerste gebruik van een voor een eindgebruiker bestemd meetinstrument voor het doel waarvoor
      het was bestemd;

      j. aangewezen instantie: ingevolge [artikel 12][ref3] aangewezen instantie;

      k. toezichthoudende instantie: op grond van [artikel 27, eerste lid][ref4], aangewezen rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0019517#Artikel12
