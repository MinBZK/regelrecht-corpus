      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van te nemen maatregelen
      en te volgen procedures ingeval sprake is van overtreding van de [artikelen 23][ref1] of [24][ref2] of van een
      krachtens [artikel 26][ref3] vastgesteld verbod bij alle of een deel van de meetinstrumenten van een specifiek
      model, waarvoor ingevolge een EG-besluit regels krachtens [artikel 5][ref4] of [artikel 9][ref5] zijn gesteld.

      2 De toezichthoudende instantie stelt Onze Minister onverwijld in kennis van overtredingen als bedoeld in
      het eerste lid. Zij vermeldt daarbij tevens welke maatregelen zij heeft genomen of voornemens is te nemen ter
      voorkoming van verdere overtredingen.


