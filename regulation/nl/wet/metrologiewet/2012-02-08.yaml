      1 De toezichthoudende instantie wijst werknemers aan die zijn belast met het toezicht, bedoeld in
      [artikel 27, eerste lid][ref1].

      2 Een besluit tot aanwijzing van werknemers als bedoeld in het eerste lid wordt door de aangewezen rechtspersoon
      aan Onze Minister medegedeeld en in de Staatscourant geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel27
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel29
