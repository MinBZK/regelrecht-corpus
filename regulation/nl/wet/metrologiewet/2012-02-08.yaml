      1 Bij de toepassing van de [artikelen 45][ref1], [46][ref2] en [47][ref3] worden de in
      [artikel 22, eerste lid, onderdeel a, van de IJkwet][ref4] bedoelde taken en bevoegdheden van de ijkinstelling
      uitgevoerd door een aangewezen instantie als bedoeld in [artikel 12][ref5], die bevoegd is tot het verrichten van
      toetsende werkzaamheden ten aanzien van het desbetreffende meetinstrument, tenzij krachtens [artikel 51][ref6]
      anders is bepaald.

      2 De op grond van [artikel 27][ref7] aangewezen rechtspersoon draagt zorg voor het toezicht op de naleving van de
      [artikelen 45][ref8], [46][ref9] en [47][ref10].


