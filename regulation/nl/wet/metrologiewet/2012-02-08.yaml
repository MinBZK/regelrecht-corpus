  - number: '24'
    text: |-
      1 Het is verboden een meetinstrument te gebruiken, te bezitten of voorhanden te hebben voor een geregelde meettaak
      indien dat meetinstrument:

      a. niet een geregeld meetinstrument is dat overeenstemt met de eisen die terzake krachtens
      [artikel 5, eerste lid, onderdeel a][ref1], aan dat meetinstrument zijn gesteld of

      b. niet is voorzien van de vereiste merktekens.

      2 Het is verboden een meetinstrument te gebruiken voor een geregelde meettaak indien dat meetinstrument

      a. is voorzien van een afkeurmerkteken als bedoeld in [artikel 34][ref2] of

      b. ingevolge [artikel 7, onderdelen a of b][ref3], een overeenstemmingsbeoordeling moet ondergaan.

      3 Het is verboden anders dan overeenkomstig de krachtens [artikel 5, eerste lid, onderdeel b][ref4], gestelde
      regels gebruik te maken van een geregeld meetinstrument voor de geregelde meettaak waarvoor het is bestemd.

      4 Bij ministeriële regeling kan worden bepaald dat voor een meetinstrument, al dan niet in daarbij aangegeven
      gevallen of omstandigheden, zonodig onder beperkingen, een vrijstelling geldt of een ontheffing kan worden verleend
      van het in het eerste, tweede, of derde lid, opgenomen verbod. Aan een vrijstelling of een ontheffing kunnen
      voorschriften worden verbonden.

      5 Bij ministeriële regeling kunnen regels worden gesteld inzake de vergoeding van de kosten voor de behandeling van
      een aanvraag om ontheffing, alsmede omtrent de wijze van betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
