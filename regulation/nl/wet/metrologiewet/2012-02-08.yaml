    text: |-
      Indien een of meer van de [artikelen 1 tot en met 42][ref1] eerder in werking treden dan [artikel 44][ref2], kunnen
      bij of krachtens algemene maatregel van bestuur regels worden gesteld met het oog op de afstemming van uit de
      [IJkwet][ref3] en uit deze wet voortvloeiende taken, rechten en verplichtingen.


