      - id: ref3
        bwb_id: BWBR0019517
        artikel: '10'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '13'
    text: |-
      1 Onze Minister doet van de aanwijzing van een instantie mededeling in de Staatscourant onder vermelding van de
      procedures van overeenstemmingsbeoordeling, het meetinstrument waarvoor de bevoegdheid is verleend en in voorkomend
      geval van de bevoegdheid een erkenning als bedoeld in [artikel 11, eerste lid][ref1], te verlenen.

      2 Het eerste lid is van overeenkomstige toepassing op de intrekking van een aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel11
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '14'
    text: |-
      Onze Minister kan regels stellen met betrekking tot de taakuitoefening en de werkwijze van aangewezen instanties en
      van personen aan wie een erkenning als bedoeld in [artikel 11][ref1] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel11
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '15'
    text: |-
      Onze Minister kan ook na de aanwijzing van een instantie voorschriften verbinden aan de aanwijzing of de
      daaraan verbonden voorschriften wijzigen, indien dat als gevolg van een EG-besluit of de technische ontwikkeling
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel15
  - number: '16'
    text: |-
      1 Een aangewezen instantie verstrekt Onze Minister alle informatie die hij nodig heeft voor de uitoefening van zijn
      taak. Onze Minister kan inzage vorderen van de zakelijke gegevens en bescheiden voor zover dat voor de vervulling
      van zijn taak redelijkerwijs nodig is.

      2 Een aangewezen instantie is verplicht Onze Minister of een door hem daartoe aangezochte deskundige of instelling
      gelegenheid te geven, na te gaan of de aangewezen instantie voldoet aan de gestelde eisen en voorschriften.
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel16
  - number: '17'
    text: |-
      Met een aangewezen instantie als bedoeld in [artikel 12][ref1] wordt gelijkgesteld een door een andere lidstaat
      van de Europese Unie of een andere staat die partij is bij de Overeenkomst inzake de Europese Economische
      Ruimte bij de Commissie van de Europese Gemeenschappen aangemelde instantie die bevoegd is tot het uitvoeren van
      toetsende werkzaamheden in het kader van dezelfde procedures van overeenstemmingsbeoordeling van het desbetreffende
      meetinstrument.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel12
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '18'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het aanwijzen van instanties
      in verband met de uitvoering van een overeenkomst tussen de Europese Gemeenschap en een derde land betreffende de
      wederzijdse erkenning van overeenstemmingsbeoordelingen van meetinstrumenten.

      2 De in het eerste lid bedoelde regels kunnen onder meer betreffen:

      a. de eisen waaraan instanties voor aanwijzing moeten voldoen;

      b. de gronden voor schorsing of intrekking van een aanwijzing;

      c. de door instanties te hanteren tarieven;

      d. het toezicht op de instanties;

      e. de vergoeding van kosten van aanwijzing en toezicht.
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel18
  - number: '19'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de vergoeding door de aangewezen instantie
      van de kosten voor de werkzaamheden voortvloeiende uit de toepassing van de [artikelen 12][ref1] en
      [16, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel16
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019517
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '20'
    text: |-
      1 Onze Minister kan tarieven vaststellen die de aangewezen instanties ten hoogste mogen berekenen voor de door hen
      verrichte werkzaamheden in het kader van de overeenstemmingsbeoordeling van een meetinstrument. Daarbij kunnen voor
      verschillende werkzaamheden verschillende tarieven worden vastgesteld.

      2 Onze Minister kan tarieven vaststellen die de aangewezen instanties ten hoogste mogen berekenen voor hun
      werkzaamheden in verband met het verlenen van een erkenning als bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel11
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '21'
    text: |-
      1 Een aangewezen instantie zendt jaarlijks voor 1 juni een verslag van de werkzaamheden in het afgelopen
      kalenderjaar aan Onze Minister.

      2 Bij ministeriële regeling kunnen nadere eisen worden gesteld aan het verslag.
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel21
  - number: '22'
    text: |-
      1 Het is verboden:

      a. een grootheid uit te drukken in een andere meeteenheid dan de meeteenheid die krachtens [artikel 2][ref1] voor
      die grootheid is vastgesteld;

      b. voor een grootheid een benaming te bezigen in strijd met de krachtens [artikel 2][ref2] gestelde regels.

      2 Bij ministeriële regeling kunnen gevallen of omstandigheden worden bepaald waarin het in het eerste lid bedoelde
      verbod niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel2
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0019517
        artikel: '2'
        hoofdstuk: '2'
  - number: '23'
    text: |-
      1 Het is verboden een geregeld meetinstrument in de handel te brengen, in gebruik te nemen of voordat het in
      gebruik is genomen verder te verhandelen, indien het niet overeenstemt met de eisen die terzake aan dat instrument
      krachtens [artikel 5, eerste lid, onderdeel a][ref1], zijn gesteld.

      2 Het is verboden een geregeld meetinstrument in de handel te brengen, in gebruik te nemen of voordat het in
      gebruik is genomen, verder te verhandelen indien dat niet is voorzien van de merktekens waaruit de overeenstemming
      met de aan dat instrument krachtens [artikel 5, eerste lid, onderdeel a][ref2], terzake gestelde eisen blijkt.

      3 Bij ministeriële regeling kan worden bepaald dat in daarbij aangegeven gevallen of omstandigheden een
      vrijstelling geldt van het in het eerste, onderscheidenlijk het tweede lid, opgenomen verbod.

      4 Onze Minister kan ontheffing verlenen van het in het eerste lid, onderscheidenlijk, het tweede lid, opgenomen
      verbod.

      5 Een vrijstelling of ontheffing kan onder beperkingen worden verleend. Aan een vrijstelling of een ontheffing
      kunnen voorschriften worden verbonden.

      6 Bij ministeriële regeling kunnen regels worden gesteld inzake de vergoeding van de kosten voor de behandeling van
      een aanvraag om ontheffing, alsmede omtrent de wijze van betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel5
    url: https://wetten.overheid.nl/BWBR0019517/2012-02-08#Artikel23
