  - number: '13'
    text: |-
      1 Onze Minister doet van de aanwijzing van een instantie mededeling in de Staatscourant onder vermelding van de
      procedures van conformiteitsbeoordeling, het meetinstrument waarvoor de bevoegdheid is verleend en in voorkomend
      geval van de bevoegdheid een erkenning als bedoeld in [artikel 11, eerste lid][ref1], te verlenen.

      2 Het eerste lid is van overeenkomstige toepassing op de intrekking van een aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel11
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel13
