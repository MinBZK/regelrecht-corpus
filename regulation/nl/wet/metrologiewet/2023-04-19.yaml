      1 Onze Minister zendt elke vier jaar aan de Staten-Generaal een verslag over de doeltreffendheid van het
      functioneren van de aangewezen instanties.

      2
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel40
  - number: '45'
    text: |-
      1 In afwijking van [artikel 23][ref1] mogen geregelde meetinstrumenten waarop [richtlijn 2004/22/EG](32004L0022)
      van het Europees Parlement en de Raad van 31 maart 2004 betreffende meetinstrumenten van toepassing is, in
      de handel worden gebracht, in gebruik worden genomen of voor ingebruikneming verder worden verhandeld, indien
      uiterlijk 29 oktober 2006 overeenkomstig [artikel 11a van de IJkwet][ref2] een model van die instrumenten is
      toegelaten en zij voldoen aan de regels die op die datum bij of krachtens de [IJkwet][ref3] ten behoeve van het in
      de handel brengen of in gebruik nemen van toepassing waren op die instrumenten.

      2 Het eerste lid is van toepassing tot de datum waarop de geldigheidsduur van de op grond van
      [artikel 11a van de IJkwet][ref4] afgegeven verklaring inzake de toelating van het model van het meetinstrument is
      verstreken, dan wel bij gebreke daaraan, tot 1 november 2016 of een door Onze Minister te bepalen eerdere datum.

      3 Indien voor een meetinstrument als bedoeld in het eerste lid op grond van [artikel 21b van de IJkwet][ref5] een
      vrijstelling of ontheffing is verleend, blijft deze vrijstelling of ontheffing geldig tot 1 november 2016.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel11a
