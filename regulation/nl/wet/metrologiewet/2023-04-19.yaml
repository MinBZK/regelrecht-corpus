      1 Het is een ieder verboden een meetinstrument waar [verordening (EU) 2019/1020](32920R2019) op van toepassing is,
      in de handel te brengen in strijd met artikel 4, eerste lid, van die verordening.

      2 Het is ten aanzien van een meetinstrument waar [verordening (EU) 2019/1020](32920R2019) op van toepassing is,
      de fabrikant, de importeur, de gemachtigde, die is aangewezen om de in artikel 4, derde lid, van die verordening
      vermelde taken namens de fabrikant te verrichten of de fulfilmentdienstverlener verboden te handelen in strijd met
      artikel 4, derde en vierde lid, van die verordening.

      3 Het is de gemachtigde, bedoeld in het tweede lid, verboden te handelen in strijd met artikel 5, tweede lid, van
      [verordening (EU) 2019/1020](32920R2019).
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel23a
  - number: 23b
    text: |-
      1 Het is een marktdeelnemer en een fulfilmentdienstverlener ten aanzien van een meetinstrument waar [verordening
      (EU) 2019/1020](32920R2019) op van toepassing is, verboden te handelen in strijd met artikel 7, eerste lid, van
      die verordening.

      2 Het is aanbieders van diensten van de informatiemaatschappij ten aanzien van een meetinstrument waar [verordening
      (EU) 2019/1020](32920R2019) op van toepassing is, verboden te handelen in strijd met artikel 7, tweede lid, van
      die verordening.
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel23b
  - number: '24'
    text: |-
      1 Het is een ieder verboden een meetinstrument te gebruiken, te bezitten of voorhanden te hebben voor een geregelde
      meettaak indien dat meetinstrument:

      a. niet een geregeld meetinstrument is dat overeenstemt met de eisen die terzake krachtens
      [artikel 5, eerste lid, onderdeel a][ref1], aan dat meetinstrument zijn gesteld of

      b. niet is voorzien van de vereiste merktekens.

      2 Het is een ieder verboden een meetinstrument te gebruiken voor een geregelde meettaak indien dat meetinstrument

      a. is voorzien van een afkeurmerkteken als bedoeld in [artikel 34][ref2] of

      b. ingevolge [artikel 7, onderdelen a of b][ref3], een conformiteitsbeoordeling moet ondergaan.

      3 Het is een ieder verboden anders dan overeenkomstig de krachtens [artikel 5, eerste lid, onderdeel b][ref4],
      gestelde regels gebruik te maken van een geregeld meetinstrument voor de geregelde meettaak waarvoor het is
      bestemd.

      4 Bij ministeriële regeling kan worden bepaald dat voor een meetinstrument, al dan niet in daarbij aangegeven
      gevallen of omstandigheden, zonodig onder beperkingen, een vrijstelling geldt of een ontheffing kan worden verleend
      van het in het eerste, tweede, of derde lid, opgenomen verbod. Aan een vrijstelling of een ontheffing kunnen
      voorschriften worden verbonden.

      5 Bij ministeriële regeling kunnen regels worden gesteld inzake de vergoeding van de kosten voor de behandeling van
      een aanvraag om ontheffing, alsmede omtrent de wijze van betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
