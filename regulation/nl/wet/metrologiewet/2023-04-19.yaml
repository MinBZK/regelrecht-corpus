  - number: 28b
    text: |-
      1 De ambtenaren, bedoeld in [artikel 27][ref1], zijn bevoegd om, ter uitvoering van [verordening
      (EU) 2019/1020](32920R2019), onder verstrekking van onjuiste of onvolledige gegevens met betrekking
      tot hun identiteit en hoedanigheid, meetinstrumenten te verkrijgen en de hieraan gerelateerde
      handelingen te verrichten voor zover dat voor de vervulling van hun taak noodzakelijk is.
      [Artikel 5:12, tweede lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing.

      2 De ambtenaar die gebruik heeft gemaakt van de bevoegdheid, bedoeld in het eerste lid, maakt daarvan een
      schriftelijk verslag op waarin hij vermeldt:

      a. zijn naam of nummer en hoedanigheid;

      b. de motivering van de noodzaak tot uitoefening van de bevoegdheid;

      c. de voorschriften op de naleving waarvan wordt toegezien;

      d. het adres, waaronder indien van toepassing, het elektronische adres, waar het meetinstrument is verkregen en,
      voor zover bekend, de omschrijving van de betrokken marktdeelnemer;

      e. de onjuiste of onvolledige gegevens die bij de handelingen ten behoeve van het verkrijgen van het meetinstrument
      zijn verstrekt;

      f. de wijze waarop en het tijdvak waarin de handelingen hebben plaatsgevonden;

      g. hetgeen tijdens het onderzoek van het meetinstrument is verricht, gebleken en overigens is voorgevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel512
