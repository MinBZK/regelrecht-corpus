      1 Met het toezicht op de naleving van het bepaalde bij of krachtens [hoofdstuk 5][ref1] en [artikel 39][ref2] van
      deze wet en [verordening (EU) 2019/1020](32920R2019), voor zover die betrekking heeft op de in bijlage I van die
      verordening, onder 3, 6, 28, 50 en 51 genoemde richtlijnen zijn belast de bij besluit van Onze Minister aangewezen
