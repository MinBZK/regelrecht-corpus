  - number: '46'
    text: |-
      1 In afwijking van [artikel 23][ref1] mogen andere geregelde meetinstrumenten dan bedoeld in [artikel 45][ref2]
      in de handel worden gebracht, in gebruik worden genomen of voor ingebruikneming verder worden verhandeld indien
      uiterlijk 29 oktober 2006 overeenkomstig [artikel 11a van de IJkwet][ref3] een model van die instrumenten is
      toegelaten en zij voldoen aan de regels die op die datum bij of krachtens de [IJkwet][ref4] ten behoeve van het in
      de handel brengen of in gebruik nemen van toepassing waren op die instrumenten.

      2 Indien voor een ander geregeld meetinstrument dan bedoeld in [artikel 45, eerste lid][ref5], regels worden
      gesteld, worden daarbij de verkregen rechten uit een op grond van [artikel 21b][ref6] of [21c, van de IJkwet][ref7]
      verleende ontheffing voor het desbetreffende meetinstrument die onmiddellijk voorafgaand aan de inwerkingtreding
      van [artikel 44][ref8] geldig was, geëerbiedigd.


