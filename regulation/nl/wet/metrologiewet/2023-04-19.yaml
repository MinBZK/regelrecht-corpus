        artikel: '2'
        hoofdstuk: '2'
  - number: '4'
    text: |-
      1 Er is een Raad van deskundigen voor de nationale meetstandaarden die tot taak heeft:

      a. toezicht uit te oefenen op de verwezenlijking en het beheer van nationale meetstandaarden en omtrent dat
      toezicht jaarlijks verslag uit te brengen aan Onze Minister en hem overigens van raad te dienen;

      b. advies uit te brengen over aangelegenheden in verband met de meetstandaarden van grootheden.

      2 De raad wordt door Onze Minister in de gelegenheid gesteld zijn zienswijze te geven over het voornemen tot een
      aanwijzing of tot een intrekking van een aanwijzing op grond van [artikel 3][ref1].

      3 De raad bestaat uit ten hoogste negen leden.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel3
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '3'
        hoofdstuk: '2'
  - number: '5'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen uit hoofde van openbaar belang, volksgezondheid, openbare
      veiligheid, openbare orde, milieubescherming en consumentenbescherming of ten behoeve van eerlijke handel, van
      heffing van belastingen of van andere heffingen, regels worden gesteld omtrent meetinstrumenten met een meettaak
      ten behoeve van een specifieke toepassing, onder meer betreffende:

      a. de eisen waaraan een meetinstrument, dan wel een onderdeel van een meetinstrument, moet voldoen;

      b. de omstandigheden waaronder een meetinstrument wordt gebruikt;

      c. de EU-conformiteitsverklaring waarin wordt vermeld dat aangetoond is dat aan de gestelde eisen is voldaan;

      d. de merktekens waaruit blijkt dat een meetinstrument voldoet aan de gestelde eisen, alsmede andere merktekens.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      conformiteitsbeoordelingen van meetinstrumenten, alsmede met betrekking tot het aanbrengen van de merktekens,
      de aanwijzing van degenen die daartoe bevoegd zijn, en de verplichtingen van marktdeelnemers ten aanzien van de
      uitvoering van de in het eerste lid juncto het derde lid bedoelde regels.

      3 In de in het eerste en tweede lid bedoelde regels kan onderscheid worden gemaakt tussen het in de handel brengen,
      in gebruik nemen, op de markt aanbieden en het gebruik van meetinstrumenten.
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel5
  - number: '6'
    text: |-
      1 Een geregeld meetinstrument ondergaat een voor dat meetinstrument op grond van [artikel 5][ref1] voorgeschreven
      conformiteitsbeoordeling voordat het in de handel wordt gebracht of in gebruik wordt genomen.

      2 Met meetinstrumenten die een in het eerste lid bedoelde conformiteitsbeoordeling hebben ondergaan, worden
      gelijkgesteld meetinstrumenten die in een andere lidstaat van de Europese Unie dan wel in een staat niet zijnde
      een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat
      Nederland bindt, rechtmatig zijn geproduceerd of in de handel zijn gebracht en die door een gelijkwaardige, door
      die staat erkende instantie op hun overeenstemming met de gestelde eisen zijn beoordeeld, mits bij die beoordeling
      aan gelijkwaardige eisen is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '5'
        hoofdstuk: '3'
  - number: '7'
    text: |-
      Een in gebruik genomen geregeld meetinstrument ondergaat een op grond van [artikel 5][ref1] voor dat meetinstrument
      voorgeschreven conformiteitsbeoordeling:

      a. voordat het meetinstrument weer wordt gebruikt na een reparatie of een verandering die van invloed kan zijn op
      de meetfunctie;

      b. na schending van de merktekens;

      c. op verzoek van de eigenaar of de gebruiker;

      d. telkens na afloop van een bepaalde periode voor zover dat bij of krachtens algemene maatregel van bestuur is
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '5'
        hoofdstuk: '3'
  - number: '8'
    text: |-
      Een meetinstrument dat bij de conformiteitsbeoordeling voldoet aan de aan dat meetinstrument gestelde eisen, wordt
      overeenkomstig de krachtens [artikel 5][ref1] gestelde regels voorzien van de voor dat meetinstrument vastgestelde
      merktekens.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '5'
        hoofdstuk: '3'
  - number: '9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van het in de handel
      brengen, op de markt aanbieden of in gebruik nemen van andere meetinstrumenten dan geregelde
      meetinstrumenten, in verband met de uitvoering van een EU-besluit, regels als bedoeld in
      [artikel 5, eerste lid, onderdelen a tot en met d, en tweede lid][ref1], worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '5'
        hoofdstuk: '3'
  - number: 9a
    text: |-
      1 Indien Onze Minister vaststelt dat een meetinstrument dat aan de gestelde eisen voldoet een risico vormt
      voor de bescherming van een algemeen belang, kan hij de marktdeelnemer of de fulfilmentdienstverlener die het
      meetinstrument op de markt aanbiedt ertoe verplichten maatregelen te nemen.

      2 De in het eerste lid bedoelde maatregelen kunnen, afhankelijk van het vastgestelde risico, bestaan uit:

      a. aanpassing van het meetinstrument waardoor het risico wordt weggenomen;

      b. het niet langer op de markt aanbieden van een meetinstrument;

      c. het uit de handel nemen van het meetinstrument of het terughalen bij gebruikers;

      d. de in artikel 16, derde lid, onderdelen d tot en met g, van [verordening (EU) 2019/1020](32920R2019) bedoelde
      maatregelen, voor zover het een meetinstrument betreft waar die verordening op van toepassing is.
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel9a
  - number: '10'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de eisen vastgesteld waaraan instanties moeten voldoen die
      een toetsende taak in het kader van een conformiteitsbeoordeling uitvoeren.
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel10
  - number: '11'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat een aangewezen instantie volgens bij die regeling vastgestelde
      regels een natuurlijke persoon of een rechtspersoon een erkenning kan verlenen om bepaalde werkzaamheden uit te
      voeren in het kader van een conformiteitsbeoordeling van in gebruik genomen meetinstrumenten.

      2 In de in het eerste lid bedoelde regels wordt bepaald op welke wijze bekendheid wordt gegeven aan een verleende
      of ingetrokken erkenning.
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel11
  - number: '12'
    text: |-
      1 Onze Minister wijst de instanties aan die bevoegd zijn tot het uitvoeren van een toetsende taak in het kader van
      een conformiteitsbeoordeling van een meetinstrument. Hij kan daarbij bepalen dat de instantie een bevoegdheid heeft
      een erkenning als bedoeld in [artikel 11, eerste lid][ref1], te verlenen.

      2 Voor aanwijzing komt in aanmerking een instantie die een daartoe strekkende aanvraag doet en die voldoet aan de
      krachtens [artikel 10][ref2] gestelde eisen.

      3 Aan een aanwijzing kunnen voorschriften worden verbonden.

      4 Indien door de Europese Commissie een kenmerk of identificatienummer voor de aangewezen instantie is
      vastgesteld, wordt dit opgenomen in de aanwijzing. Voorts kan in de aanwijzing een vastgesteld nationaal kenmerk of
      identificatienummer voor de aangewezen instantie worden opgenomen.

      5 Onze Minister trekt een aanwijzing al dan niet tijdelijk in indien:

      a. de aangewezen instantie daarom verzoekt;

      b. de aangewezen instantie niet langer voldoet aan de krachtens [artikel 10][ref3] gestelde eisen;

      c. de aangewezen instantie de haar op grond van deze wet toegekende taken verwaarloost.

      6 Onze Minister kan regels stellen met betrekking tot de overdracht van dossiers van een aangewezen instantie wier
      aanwijzing wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0019517#Artikel10
