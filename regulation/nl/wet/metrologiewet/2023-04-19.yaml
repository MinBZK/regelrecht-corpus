        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '14'
    text: |-
      Onze Minister kan regels stellen met betrekking tot de taakuitoefening en de werkwijze van aangewezen instanties en
      van personen aan wie een erkenning als bedoeld in [artikel 11][ref1] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel11
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '15'
    text: |-
      Onze Minister kan ook na de aanwijzing van een instantie voorschriften verbinden aan de aanwijzing of de
      daaraan verbonden voorschriften wijzigen, indien dat als gevolg van een EU-besluit of de technische ontwikkeling
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel15
  - number: '16'
    text: |-
      1 Een aangewezen instantie verstrekt Onze Minister alle informatie die hij nodig heeft voor de uitoefening van zijn
      taak. Onze Minister kan inzage vorderen van de zakelijke gegevens en bescheiden voor zover dat voor de vervulling
      van zijn taak redelijkerwijs nodig is.

      2 Een aangewezen instantie is verplicht Onze Minister of een door hem daartoe aangezochte deskundige of instelling
      gelegenheid te geven, na te gaan of de aangewezen instantie voldoet aan de gestelde eisen en voorschriften.
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel16
  - number: '17'
    text: |-
      Met een aangewezen instantie als bedoeld in [artikel 12][ref1] wordt gelijkgesteld een door een andere lidstaat van
      de Europese Unie of een andere staat die partij is bij de Overeenkomst inzake de Europese Economische Ruimte bij de
      Europese Commissie aangemelde instantie die bevoegd is tot het uitvoeren van toetsende werkzaamheden in het kader
      van dezelfde procedures van conformiteitsbeoordeling van het desbetreffende meetinstrument.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel12
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '18'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het aanwijzen van instanties
      in verband met de uitvoering van een overeenkomst tussen de Europese Unie en een derde land betreffende de
      wederzijdse erkenning van conformiteitsbeoordelingen van meetinstrumenten.

      2 De in het eerste lid bedoelde regels kunnen onder meer betreffen:

      a. de eisen waaraan instanties voor aanwijzing moeten voldoen;

      b. de gronden voor schorsing of intrekking van een aanwijzing;

      c. de door instanties te hanteren tarieven;

      d. het toezicht op de instanties;

      e. de vergoeding van kosten van aanwijzing en toezicht.
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel18
  - number: '20'
    text: |-
      1 Onze Minister kan tarieven vaststellen die de aangewezen instanties ten hoogste mogen berekenen voor de door hen
      verrichte werkzaamheden in het kader van de conformiteitsbeoordeling van een meetinstrument. Daarbij kunnen voor
      verschillende werkzaamheden verschillende tarieven worden vastgesteld.

      2 Onze Minister kan tarieven vaststellen die de aangewezen instanties ten hoogste mogen berekenen voor hun
      werkzaamheden in verband met het verlenen van een erkenning als bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel11
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '21'
    text: |-
      1 Een aangewezen instantie zendt jaarlijks voor 1 juni een verslag van de werkzaamheden in het afgelopen
      kalenderjaar aan Onze Minister.

      2 Bij ministeriële regeling kunnen nadere eisen worden gesteld aan het verslag.
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel21
  - number: 21a
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden eisen vastgesteld waaraan een interne instantie die
      werkzaamheden uitvoert in het kader van een conformiteitsbeoordeling moet voldoen en waaraan de fabrikant waar de
      interne instantie onderdeel van uitmaakt moet voldoen inzake het verstrekken van inlichtingen aan Onze Minister
      over deze instantie.
    url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#Artikel21a
  - number: '22'
    text: |-
      1 Het is een ieder verboden:

      a. een grootheid uit te drukken in een andere meeteenheid dan de meeteenheid die krachtens [artikel 2][ref1] voor
      die grootheid is vastgesteld;

      b. voor een grootheid een benaming te bezigen in strijd met de krachtens [artikel 2][ref2] gestelde regels.

      2 Bij ministeriële regeling kunnen gevallen of omstandigheden worden bepaald waarin het in het eerste lid bedoelde
      verbod niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel2
