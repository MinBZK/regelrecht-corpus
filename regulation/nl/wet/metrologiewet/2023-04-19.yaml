  - number: '49'
    text: |-
      1 Een erkenning als bedoeld in [artikel 26 van de IJkwet][ref1] van een bevoegdheid tot het verrichten van
      werkzaamheden met betrekking tot een meetinstrument blijft geldig tot uiterlijk een jaar na inwerkingtreding van
      [artikel 44][ref2].

      2 De [artikelen 26c tot en met 26g van de IJkwet][ref3] en de daaruit voortvloeiende voorschriften en beperkingen
      blijven gedurende de periode bedoeld in het eerste lid van toepassing en Onze Minister wijst één aangewezen
      instantie aan die de in die artikelen bedoelde taken en bevoegdheden van de ijkinstelling uitoefent.

      3 De ijkbevoegde, die beschikt over een erkenning als bedoeld in [artikel 26 van de IJkwet][ref4] is gedurende de
      in het eerste lid bedoelde periode bevoegd de werkzaamheden die ingevolge de [IJkwet][ref5] tot zijn bevoegdheid
      behoorden, ten aanzien van de in [artikel 45, eerste lid][ref6], bedoelde meetinstrumenten voordat deze in de
      handel worden gebracht of in gebruik worden genomen, slechts uit te oefenen voorzover deze volgens de regels en
      voorschriften van de IJkwet worden beoordeeld.

      4 De in het derde lid bedoelde ijkbevoegde die beschikt over een krachtens [artikel 11][ref7] verleende erkenning,
      is bevoegd:

      a. de in het derde lid bedoelde werkzaamheden tot 1 november 2016 te verrichten;

      b. de werkzaamheden die ingevolge de [IJkwet][ref8] tot zijn bevoegdheid behoorden ten aanzien van de in
      [artikel 47][ref9] bedoelde meetinstrumenten te verrichten.

      5 De rechtspersoon die op grond van [artikel 22 van de IJkwet][ref10] was aangewezen als ijkinstelling draagt
      ten behoeve van de uitvoering van dit artikel of op verzoek van de ijkbevoegde, de archiefbescheiden inzake een
      erkenning op grond van [artikel 26 van de IJkwet][ref11] over aan de aangewezen instantie, bedoeld in het tweede
      lid, of aan de aangewezen instantie bij wie degene die over de erkenning beschikte een aanvraag tot erkenning als
      bedoeld in [artikel 11][ref12] doet.


