  - number: '36'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van te nemen maatregelen
      en te volgen procedures ingeval sprake is van overtreding van de [artikelen 23][ref1] of [24][ref2] of van een
      krachtens [artikel 26][ref3] vastgesteld verbod bij alle of een deel van de meetinstrumenten van een specifiek
      model, waarvoor ingevolge een EU-besluit regels krachtens [artikel 5][ref4] of [artikel 9][ref5] zijn gesteld.


