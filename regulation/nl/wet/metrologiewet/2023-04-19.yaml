preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regels met betrekking tot meeteenheden en het in de
    handel brengen en het gebruik van meetinstrumenten op een aan de eisen van deze tijd aangepaste en overzichtelijke
    wijze vast te stellen, daarbij onder meer rekening houdend met de implementatie van EG-regelgeving op het terrein
    van de metrologie en in het bijzonder van richtlijn 2004/22/EG van het Europees Parlement en de Raad van 31 maart
    2004 betreffende meetinstrumenten (PbEU L 135);

    Zo is het, dat Wij, de Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019517/2023-04-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken en Klimaat;

      b. EU-besluit: bindend besluit van de Raad van de Europese Unie, van het Europese Parlement en de Raad gezamenlijk
      of van de Europese Commissie;

      c. meetinstrument: apparaat of systeem met een meetfunctie;

      d. onderdeel: apparaat dat onafhankelijk functioneert en dat samen met andere compatibele onderdelen of een
      compatibel meetinstrument, een meetinstrument vormt;

      e. geregelde meettaak: meettaak ten behoeve van een specifieke toepassing, bedoeld in
      [artikel 5, eerste lid][ref1];

      f. geregeld meetinstrument: meetinstrument bestemd voor een geregelde meettaak ten aanzien waarvan krachtens
      [artikel 5, eerste lid][ref2], regels zijn gesteld;

      g. conformiteitsbeoordeling: beoordeling van de overeenstemming van een meetinstrument of van een onderdeel, met de
      gestelde eisen;

      h. in de handel brengen: het voor het eerst in de Europese Unie op de markt aanbieden van een meetinstrument;

      i. op de markt aanbieden: het al dan niet tegen betaling in het kader van een handelsactiviteit verstrekken van een
      meetinstrument met het oog op distributie of gebruik op de markt van de Europese Unie;

      j. in gebruik nemen: eerste gebruik van een voor een eindgebruiker bestemd meetinstrument voor het doel waarvoor
      het was bestemd;

      k. aangewezen instantie: ingevolge [artikel 12][ref3] aangewezen instantie;

      l. marktdeelnemer: fabrikant, gemachtigde, importeur of distributeur;

      m. fabrikant: een natuurlijke persoon of rechtspersoon die een meetinstrument vervaardigt of laat ontwerpen of
      vervaardigen, en het onder zijn naam of merknaam in de handel brengt of het voor eigen doeleinden in gebruik neemt;

      n. gemachtigde: een in de Europese Unie gevestigde natuurlijke persoon of rechtspersoon die schriftelijk door een
      fabrikant is gemachtigd om namens hem specifieke taken te vervullen;

      o. importeur: een in de Europese Unie gevestigde natuurlijke persoon of rechtspersoon die een meetinstrument uit
      een derde land in de Unie in de handel brengt;

      p. distributeur: een natuurlijke persoon of rechtspersoon in de toeleveringsketen, verschillend van de fabrikant of
      de importeur, die een meetinstrument op de markt aanbiedt;

      q. interne instantie: een afzonderlijk en te onderscheiden onderdeel binnen de onderneming van de fabrikant dat
      niet is betrokken bij het ontwerp, de productie, de levering, de installatie, het gebruik of het onderhoud van de
      meetinstrumenten, dat zij moet beoordelen;

      r. verordening (EU) 2019/1020:[Verordening (EU) 2019/1020](32920R2019) van het Europees Parlement en de Raad van
      20 juni 2019 betreffende markttoezicht en conformiteit van producten en tot wijziging van [Richtlijn 2004/42/EG]
      (32004L0042) en de [Verordeningen (EG) nr. 765/2008](32008R0765) en (EU) [nr. 305/2011](32011R0305) (PbEU 2019,
      L 169);

      s. fulfilmentdienstverlener: fulfilmentdienstverlener als bedoeld in artikel 3, onderdeel 11, van [verordening (EU)
      2019/1020](32920R2019);

      t. aanbieder van diensten van de informatiemaatschappij: aanbieder van een dienst zoals gedefinieerd in artikel
      1, eerste lid, onderdeel b, van [Richtlijn (EU) 2015/1535](32015L1535) van het Europees Parlement en de Raad
      van 9 september 2015 betreffende een informatieprocedure op het gebied van technische voorschriften en regels
      betreffende de diensten van de informatiemaatschappij (PbEU 2015, L 241);

      u. online interface: online interface als bedoeld in artikel 3, onderdeel 15, van [verordening (EU) 2019/1020]
      (32920R2019).


