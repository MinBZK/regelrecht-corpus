  - number: '23'
    text: |-
      1 Het is een marktdeelnemer en een eindgebruiker verboden een geregeld meetinstrument in de handel te brengen, in
      gebruik te nemen of voordat het in gebruik is genomen op de markt aan te bieden, indien het niet overeenstemt met
      de eisen die terzake aan dat instrument krachtens [artikel 5, eerste lid, onderdeel a][ref1], zijn gesteld.

      2 Het is een marktdeelnemer en een eindgebruiker verboden een geregeld meetinstrument in de handel te
      brengen, in gebruik te nemen of voordat het in gebruik is genomen, op de markt aan te bieden indien
      dat niet is voorzien van de merktekens waaruit de overeenstemming met de aan dat instrument krachtens
      [artikel 5, eerste lid, onderdeel a][ref2], terzake gestelde eisen blijkt.

      3 Bij ministeriële regeling kan worden bepaald dat in daarbij aangegeven gevallen of omstandigheden een
      vrijstelling geldt van het in het eerste, onderscheidenlijk het tweede lid, opgenomen verbod.

      4 Onze Minister kan ontheffing verlenen van het in het eerste lid, onderscheidenlijk, het tweede lid, opgenomen
      verbod.

      5 Een vrijstelling of ontheffing kan onder beperkingen worden verleend. Aan een vrijstelling of een ontheffing
      kunnen voorschriften worden verbonden.

      6 Bij ministeriële regeling kunnen regels worden gesteld inzake de vergoeding van de kosten voor de behandeling van
      een aanvraag om ontheffing, alsmede omtrent de wijze van betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel5
