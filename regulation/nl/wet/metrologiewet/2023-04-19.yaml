      1 De ambtenaren, bedoeld in [artikel 27][ref1] oefenen de hun in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref2] toegekende bevoegdheid zo nodig uit met behulp van de sterke
      arm.

      2 De ambtenaren, bedoeld in [artikel 27][ref3] mogen bij het toezicht in hun oordeel betrekken de bevindingen
      van personen, die in de uitoefening van een beroep of bedrijf meetinstrumenten controleren of onderhouden, indien
      de ambtenaren zich er van hebben verzekerd dat die personen over de vereiste deskundigheid beschikken en de
      onafhankelijkheid van het toezicht niet in het geding is.

      3 [Titel 5.2 van de Algemene wet bestuursrecht][ref4] is van overeenkomstige toepassing voor zover de ambtenaren,
      bedoeld in [artikel 27][ref5], bijstand verlenen aan een markttoezichtautoriteit als bedoeld in artikel 3,
      onderdeel 4, van [verordening (EU) 2019/1020](32920R2019) uit een andere lidstaat van de Europese Unie op grond van
      artikel 22 of artikel 23 van die verordening.


