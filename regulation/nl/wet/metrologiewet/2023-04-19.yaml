      2 Indien ambtenaren worden aangewezen die ressorteren onder een andere Minister, wordt het besluit tot aanwijzing
      van die ambtenaren genomen door Onze Minister in overeenstemming met die andere Minister.

      3 Van een besluit tot aanwijzing wordt mededeling gedaan door plaatsing in de Staatscourant.


