  - number: '47'
    text: |-
      1 Indien krachtens [artikel 5][ref1] regels gelden inzake het gebruik van een meetinstrument wordt bij de
      toepassing van [artikel 24, eerste lid, onderdelen a en b][ref2], een voor de desbetreffende meettaak bestemd
      meetinstrument, dat onmiddellijk voorafgaande aan de inwerkingtreding van [artikel 44][ref3] voldeed aan de bij of
      krachtens de [IJkwet][ref4] gestelde regels betreffende het gebruik, beschouwd als een geregeld meetinstrument dat
      voldoet aan de krachtens [artikel 5][ref5] gestelde regels.

      2 Het eerste lid geldt tenzij bij een conformiteitsbeoordeling op grond van [artikel 7][ref6] of anderszins blijkt
      dat het instrument niet aan de bij of krachtens de [IJkwet][ref7] gestelde regels voldoet.

      3 Bij ministeriële regeling kan voor een meetinstrument worden bepaald dat het eerste lid na een daarbij te bepalen
      termijn niet meer geldt.


