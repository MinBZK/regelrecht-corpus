  - number: '37'
    text: |-
      Beslissingen van een aangewezen instantie of van een natuurlijke persoon of een rechtspersoon aan wie op grond van
      [artikel 11][ref1] een erkenning is verleend, bij de uitvoering van toetsende werkzaamheden in het kader van een
      conformiteitsbeoordeling van een meetinstrument, die als gevolg of als strekking hebben dat het instrument niet
      voldoet aan de gestelde eisen, worden aan de betrokkenen schriftelijk en onder opgave van redenen medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel11
