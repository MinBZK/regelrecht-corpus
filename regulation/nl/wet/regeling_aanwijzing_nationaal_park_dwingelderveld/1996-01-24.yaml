preamble:
  text: |-
    Overwegende dat het beleid van de regeling is gericht op het tot stand brengen van een stelsel van nationale
    parken; dat er een goedgekeurd Beheers- en Inrichtingsplan Nationaal Park Dwingelderveld is, op basis waarvan aan
    het nationaal park in oprichting Dwingelderveld de definitieve status van nationaal park verleend kan worden.

    Gezien de adviezen van de Voorlopige Commissie Nationale Parken van 31 maart 1982 en 22 juni 1989;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005168/1996-01-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze regeling verstaat onder;




              *minister:*


              Minister van Landbouw, Natuurbeheer en Visserij;




              *overlegorgaan:*


              overlegorgaan als bedoeld in [artikel 3][ref1];




              *nationaal park:*


              gebied zoals omschreven in het Structuurschema Natuur- en Landschapsbehoud (Kamerstukken II, 1980/81, 16
      820, nrs. 1–2, blz. 122).


      [ref1]: https://wetten.overheid.nl/BWBR0005168#Artikel3
    url: https://wetten.overheid.nl/BWBR0005168/1996-01-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005168
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het natuur- en bosgebied Dwingelderveld, zoals aangegeven op de kaart die is
      opgenomen als figuur 1 in het plan, bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005168#Artikel6
    url: https://wetten.overheid.nl/BWBR0005168/1996-01-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005168
        artikel: '6'
  - number: '3'
    text: Er is een overlegorgaan Dwingelderveld.
    url: https://wetten.overheid.nl/BWBR0005168/1996-01-24#Artikel3
  - number: '4'
    text: |-
      Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting en het beheer van het nationaal park
      Dwingelderveld.
    url: https://wetten.overheid.nl/BWBR0005168/1996-01-24#Artikel4
  - number: '5'
    text: |-
      Tot de taak van het overlegorgaan behoort onder meer:

        - het streven naar onderlinge afstemming van alle voor de inrichting en het beheer van het nationaal park van
      belang zijnde plannen en activiteiten;
        - het doen van voorstellen aan de minister voor de besteding van de voor het nationaal park Dwingelderveld
      beschikbare middelen in het kader van een jaarlijks voor te stellen activiteitenprogramma met bijbehorende
      begroting;
        - het opstellen van een meerjarenprogramma voorlichting en educatie, ter bevordering en coördinatie van
      voorlichting en educatie met betrekking tot het nationaal park Dwingelderveld.
    url: https://wetten.overheid.nl/BWBR0005168/1996-01-24#Artikel5
  - number: '6'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het Beheers- en Inrichtingsplan Nationaal Park Dwingelderveld
      van 5 juli 1988, zoals dit door de minister op 12 oktober 1989 is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0005168/1996-01-24#Artikel6
  - number: '7'
    text: |-
      In het overlegorgaan hebben zitting:

      a. één door de minister te benoemen lid, tevens voorzitter;

      b. tien door de minister te benoemen leden, als vertegenwoordiger en op voordracht van onderscheidenlijk:

        - de provincie Drenthe;
        - de gemeente Beilen;
        - de gemeente Dwingeloo;
        - de gemeente Ruinen;
        - het waterschap De Oude Vaart;
        - het waterschap De Wold Aa;
        - het Recreatieschap Noord- en Midden-Drenthe;
        - het Recreatieschap Zuid-West Drenthe;
        - de Vereniging tot Behoud van Natuurmonumenten in Nederland;
        - het Staatsbosbeheer;

      c. twee door de minister te benoemen leden als vertegenwoordigers van de kleine particuliere eigenaren;

      d. de Directeur van de Directie Noord van het Ministerie van landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0005168/1996-01-24#Artikel7
  - number: '8'
    text: |-
      1 Het secretariaat van het overlegorgaan berust bij een door de provincie Drenthe te benoemen ambtenaar van die
      provincie.

      2 Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergaderingen alsmede de overige aspecten van zijn
      eigen inrichting en werkwijze.

      3 Het overlegorgaan brengt jaarlijks van zijn werkzaamheden verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0005168/1996-01-24#Artikel8
  - number: '9'
    text: |-
      Indien in het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter daarvan
      mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0005168/1996-01-24#Artikel9
  - number: '10'
    text: |-
      De voorzitter en de vertegenwoordigers van de kleine particuliere eigenaren genieten voor het bijwonen van
      vergaderingen en overige bijeenkomsten een vacatiegeld op grond van het [Vacatiegeldenbesluit 1988][ref1]. Voorts
      ontvangen zij vergoeding voor reis- en verblijfkosten overeenkomstig het voor ambtenaren geldende Reisbesluit 1971.


      [ref1]: https://wetten.overheid.nl/BWBR0004317
    url: https://wetten.overheid.nl/BWBR0005168/1996-01-24#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004317
  - number: '11'
    text: De Regeling aanwijzing nationaal park in oprichting Dwingelderveld (Stcrt. 1986, 129) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005168/1996-01-24#Artikel11
  - number: '12'
    text: |-
      1 Deze regeling kan worden aangehaald als: Regeling aanwijzing nationaal park Dwingelderveld.

      2 Zij treedt in werking met ingang van 22 augustus 1991 en zal worden bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005168/1996-01-24#Artikel12
