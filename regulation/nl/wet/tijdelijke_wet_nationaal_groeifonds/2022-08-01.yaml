  - number: '7'
    text: |-
      1 Onze Minister van Economische Zaken en Klimaat kan subsidies verstrekken voor activiteiten in het kader van het
      bereiken van het doel van het fonds, genoemd in [artikel 2, tweede lid][ref1].

      2 Onverminderd [artikel 4:35, derde lid, van de Algemene wet bestuursrecht][ref2], kan Onze Minister van
      Economische Zaken en Klimaat, voor zover subsidieverstrekking in strijd is met verdragsrechtelijke verplichtingen:

      a. subsidieverstrekking weigeren;

      b. een subsidie lager vaststellen dan overeenkomstig de subsidieverlening;

      c. een subsidieverlening of subsidievaststelling intrekken of ten nadele van de ontvanger wijzigen.

      3 Bij de vaststelling, intrekking of wijziging, bedoeld in het tweede lid, kan worden bepaald, dat over
      onverschuldigd betaalde subsidiebedragen een rentevergoeding verschuldigd is.

      4 De intrekking of wijziging, bedoeld in het tweede lid, werkt terug tot en met het tijdstip waarop de subsidie is
      verstrekt, tenzij bij de intrekking of wijziging anders is bepaald.

      5 De [artikelen 4:49, derde lid][ref3], en [4:57, vierde lid, van de Algemene wet bestuursrecht][ref4] zijn niet
      van toepassing op de vaststelling, intrekking en wijziging, bedoeld in het tweede lid.

      6 Onze Minister van Economische Zaken en Klimaat kan specifieke uitkeringen als bedoeld in
      [artikel 15a van de Financiële-verhoudingswet][ref5] verstrekken voor activiteiten in het kader van
      het bereiken van het doel, genoemd in [artikel 2, tweede lid][ref6]. Het tweede tot en met vijfde lid en
      [artikel 8, tweede tot en met zesde lid][ref7], zijn van overeenkomstige toepassing op deze uitkeringen.


