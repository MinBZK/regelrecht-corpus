  - number: '9'
    text: |-
      1 Er is een Adviescommissie Nationaal Groeifonds.

      2 De adviescommissie heeft tot taak Onze Ministers te adviseren over investeringsvoorstellen voor het beschikbaar
      stellen van financiële middelen, bedoeld in [artikel 2, tweede lid][ref1].

      3 De adviescommissie stelt een werkwijze vast voor de wijze waarop zij haar taken uitvoert en maakt deze openbaar.

      4 De leden van de adviescommissie worden benoemd door Onze Ministers en kunnen op eigen verzoek of wegens
      ongeschiktheid, onbekwaamheid of op andere zwaarwegende gronden worden geschorst en ontslagen door Onze Ministers.

      5 Bij ministeriële regeling van Onze Ministers worden nadere regels gesteld over onder meer de taak van de
      adviescommissie, de onafhankelijkheid van de leden van de adviescommissie en het afleggen van verantwoording door
      de adviescommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0046840#Artikel2
    url: https://wetten.overheid.nl/BWBR0046840/2022-08-01#Artikel9
