preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is om het duurzaam verdienvermogen van Nederland op
    de lange termijn te versterken door financiële middelen uit het Nationaal Groeifonds beschikbaar te stellen
    voor investeringen en daartoe tijdelijk een begrotingsfonds in te stellen als bedoeld in artikel 2.11 van de
    Comptabiliteitswet 2016;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0046840/2022-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *duurzaam verdienvermogen:* het bruto binnenlands product dat Nederland op de lange termijn op structurele basis
      kan genereren, met oog voor een economische, sociale en milieuvriendelijke duurzame toekomst voor de aarde en voor
      huidige en toekomstige generaties;
        - *fonds:* Nationaal Groeifonds, bedoeld in [artikel 2][ref1];
        - *Onze Ministers:* Onze Minister van Economische Zaken en Klimaat en Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0046840#Artikel2
    url: https://wetten.overheid.nl/BWBR0046840/2022-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0046840
        artikel: '2'
  - number: '2'
    text: |-
      1 Er is een Nationaal Groeifonds.

      2 Het fonds heeft als doel het beschikbaar stellen van financiële middelen om het duurzaam verdienvermogen te
      vergroten door het doen van investeringen, op het gebied van:

      a. kennisontwikkeling;

      b. onderzoek, ontwikkeling en innovatie.

      3 Uit het fonds kunnen financiële middelen ter beschikking worden gesteld voor activiteiten die ten minste:

      a. het duurzaam verdienvermogen vergroten;

      b. betrekking hebben op investeringen die niet structureel zijn;

      c. betrekking hebben op investeringen die additioneel zijn aan private investeringen;

      d. betrekking hebben op investeringen die additioneel zijn aan bestaande of geplande publieke investeringen en niet
      vallen binnen een bestaande regeling van de overheid;

      e. een positief saldo van maatschappelijke baten en lasten hebben;

      f. niet strijdig zijn met het kabinetsbeleid; en

      g. betrekking hebben op investeringen die voldoen aan het beginsel van subsidiariteit in relatie tot
      financieringsmogelijkheden die de Europese Unie of decentrale overheden kunnen bieden.

      4 Voor de activiteiten, bedoeld in het derde lid, kan een nader te bepalen omvang worden vastgesteld die
      noodzakelijk is om een substantieel effect te hebben op het duurzaam verdienvermogen, voor zover die betrekking
      heeft op de omvang van de activiteiten of de bijdrage uit het fonds.

      5 Bij het beschikbaar stellen van financiële middelen, bedoeld in het tweede lid, wordt een redelijke regionale
      spreiding over Nederland gewaarborgd.

      6 Deze wet is mede van toepassing op de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0046840/2022-08-01#Artikel2
  - number: '3'
    text: |-
      1 Het fonds is een begrotingsfonds als bedoeld in [artikel 2.11, eerste lid, van de Comptabiliteitswet 2016][ref1].

      2 Onze Ministers beheren het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2.11
