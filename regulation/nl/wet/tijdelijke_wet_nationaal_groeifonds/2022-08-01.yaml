  - number: '4'
    text: |-
      1 Jaarlijks bieden Onze Ministers gelijktijdig met het voorstel van wet tot vaststelling van de begrotingsstaat van
      het fonds een Meerjarenprogramma Nationaal Groeifonds aan de Staten-Generaal aan.

      2 Het meerjarenprogramma verschaft informatie over de meerjarige uitgaven van het fonds, bedoeld in
      [artikel 6, aanhef en onderdelen a en b][ref1]. Het meerjarenprogramma maakt tevens zichtbaar hoe de financiële
      middelen van het fonds worden verdeeld over verschillende beleidsterreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0046840#Artikel6
    url: https://wetten.overheid.nl/BWBR0046840/2022-08-01#Artikel4
