        artikel: '6'
  - number: '5'
    text: |-
      De ontvangsten van het fonds zijn:

      a. gelden verkregen uit algemene middelen van het Rijk;

      b. bijdragen ten laste van andere begrotingen van het Rijk als bedoeld in
      [artikel 2.1, eerste lid, van de Comptabiliteitswet 2016][ref1];

      c. ontvangsten van derden in het kader van het bereiken van het doel, genoemd in [artikel 2, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0046840#Artikel2
    url: https://wetten.overheid.nl/BWBR0046840/2022-08-01#Artikel5
