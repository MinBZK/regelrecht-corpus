  - number: '13'
    text: |-
      1 Deze wet treedt in werking en vervalt op een bij koninklijk besluit te bepalen tijdstip, met dien verstande dat
      de wet van toepassing blijft op uitgaven als bedoeld in [artikel 6][ref1] die zijn gedaan voordat de wet vervalt.

      2 Na zes jaar na het tijdstip van inwerkingtreding van deze wet worden geen financiële middelen beschikbaar gesteld
      als bedoeld in [artikel 2, tweede lid][ref2], voor het doen van nieuwe investeringen.


