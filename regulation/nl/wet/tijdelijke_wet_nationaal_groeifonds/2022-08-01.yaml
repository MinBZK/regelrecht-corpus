        artikel: '2'
  - number: '6'
    text: |-
      In het kader van het bereiken van het doel, genoemd in [artikel 2, tweede lid][ref1], komen ten laste van het
      fonds:

      a. subsidies aan provincies, gemeenten of andere publiekrechtelijke rechtspersonen, privaatrechtelijke
      rechtspersonen of natuurlijke personen;

      b. bijdragen aan andere begrotingen van het Rijk als bedoeld in
      [artikel 2.1, eerste lid, van de Comptabiliteitswet 2016][ref2];

      c. andere uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0046840#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel2.1
