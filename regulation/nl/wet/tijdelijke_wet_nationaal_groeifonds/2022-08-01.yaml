        artikel: '2'
  - number: '11'
    text: |-
      Onze Ministers zenden binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0046840/2022-08-01#Artikel11
  - number: '12'
    text: |-
      1 Onder vervanging van de puntkomma aan het slot van het vijfde lid, onderdeel d,
      van [artikel 2.1 van de Comptabiliteitswet 2016][ref1] door een punt, vervallen
      [artikel 2.1, vijfde lid, onderdeel e][ref2], en [artikel 4.3, vierde lid, van de Comptabiliteitswet 2016][ref3].

      2 Op financiële verplichtingen die zijn aangegaan voor het tijdstip van het vervallen van de artikelen, genoemd in
      het eerste lid, blijft het bij of krachtens die artikelen bepaalde van toepassing.


