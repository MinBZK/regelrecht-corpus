  - number: '8'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister van Economische Zaken en
      Klimaat kunnen nadere regels worden gesteld over de uitgaven ten laste van het fonds, bedoeld in artikel 6,
      onderdeel b.

      2 Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister van Economische Zaken en
      Klimaat kunnen regels over subsidies als bedoeld in [artikel 7][ref1] worden gesteld, met betrekking tot:

      a. de activiteiten waarvoor subsidie kan worden verstrekt;

      b. het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;

      c. de aanvraag van een subsidie en de besluitvorming daarover;

      d. de voorwaarden waaronder de subsidie wordt verleend;

      e. de verplichtingen voor de subsidieontvanger;

      f. de vaststelling van de subsidie;

      g. intrekking en wijziging van de subsidieverlening of -vaststelling;

      h. de betaling van de subsidie en het verlenen van voorschotten;

      i. het verslag over de doeltreffendheid en de effecten van de subsidie in de praktijk, bedoeld in
      [artikel 4:24 van de Algemene wet bestuursrecht][ref2].

      3 In de regels, bedoeld in het tweede lid, wordt voorzien in de vaststelling van een subsidieplafond, tenzij Onze
      Minister van Financiën heeft ingestemd met het achterwege laten daarvan.

      4 In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref3], kan in de regels, bedoeld
      in het tweede lid, [titel 4.2 van de Algemene wet bestuursrecht][ref4] van toepassing worden verklaard op subsidies
      die op grond van die regels uitsluitend voorzien in verstrekking aan rechtspersonen die krachtens publiekrecht
      zijn ingesteld.

      5 Met het toezicht op de naleving van het bepaalde bij of krachtens [artikel 7][ref5] en het tweede tot en met
      het vierde lid van dit artikel, zijn belast de bij besluit van Onze Minister van Economische Zaken en Klimaat
      aangewezen personen.

      6 Van een besluit als bedoeld in het vijfde lid wordt mededeling gedaan door plaatsing in de Staatscourant.


