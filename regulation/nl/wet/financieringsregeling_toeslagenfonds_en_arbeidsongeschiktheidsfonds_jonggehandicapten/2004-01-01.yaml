        bwb_id: BWBR0007891
      - id: ref3
        bwb_id: BWBR0008657
  - number: '4.2'
    text: De in het eerste lid, onderdeel a, bedoelde bedragen omvatten tevens de geraamde vakantie-uitkeringen.
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel4
  - number: '4.3'
    text: |-
      In de raming worden tevens de geraamde uitgaven opgenomen die op grond van
      [artikel 42 Wet op de (re)integratie arbeidsgehandicapten][ref1] en de daarop berustende bepalingen ten laste van
      het Wajong-fonds komen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel42
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '42'
  - number: '5.1'
    text: |-
      In de opgave van de gerealiseerde uitgaven, bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], worden
      overeenkomstig de bij deze regeling behorende [bijlagen 3][ref2] en [4][ref3], afzonderlijk per wet vermeld:


