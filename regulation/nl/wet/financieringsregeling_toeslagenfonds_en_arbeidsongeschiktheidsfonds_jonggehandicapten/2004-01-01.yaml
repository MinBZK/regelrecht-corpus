      de totaalbedragen aan geraamde toeslagen op grond van de [Toeslagenwet][ref1] en uitkeringen op grond van
      de [Tijdelijke wet BIA][ref2] en de [Wajong][ref3], inclusief de op grond van enige wet over de toeslagen en
