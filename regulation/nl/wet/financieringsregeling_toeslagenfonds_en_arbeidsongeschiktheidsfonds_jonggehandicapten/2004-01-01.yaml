      - id: ref3
        bwb_id: BWBR0008657
  - number: 4.1.b
    text: |-
      de totaalbedragen aan geraamde uitvoeringskosten van de [Toeslagenwet][ref1], de [Tijdelijke wet BIA][ref2] en
      de [Wajong][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0007891
      [ref3]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel4
