  - number: '2.1'
    text: 'Op de zesde dag van elke maand verstrekt het UWV aan de Minister:'
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel2
  - number: 2.1.a
    text: |-
      een raming van de uitgaven met betrekking tot het Toeslagenfonds, onderscheidenlijk het Wajong-fonds, in deze
      maand; en
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel2
  - number: 2.1.b
    text: |-
      een opgave van de gerealiseerde uitgaven met betrekking tot het Toeslagenfonds, onderscheidenlijk het Wajong-fonds,
      over de maand gelegen twee maanden voor deze maand.
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel2
  - number: '2.2'
    text: |-
      Indien de dag, bedoeld in het eerste lid, een zaterdag, zondag of algemeen erkende feestdag is, vindt de
      verstrekking plaats op de eerstvolgende dag die niet een zaterdag, zondag of algemeen erkende feestdag is.
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel2
  - number: '3.1'
    text: |-
      Met als valutadag de elfde dag van elke maand stort de Minister het bedrag van de geraamde uitgaven van het
      Toeslagenfonds, onderscheidenlijk het Wajong-fonds, in die maand op de rekening-courant ten name van het UWV bij de
      Minister van Financiën. De Minister kan, na overleg met het UWV, van het geraamde bedrag afwijken.
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel3
  - number: '3.2'
    text: |-
      Met als valutadag de elfde dag van elke maand verrekent de Minister het verschil tussen de gerealiseerde uitgaven
      en de geraamde uitgaven in de maand gelegen twee maanden voor die bedoeld in het eerste lid, met het bedrag bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel3
  - number: '3.3'
    text: |-
      Indien de dag, bedoeld in het eerste en tweede lid, een zaterdag, zondag of algemeen erkende feestdag is, vindt de
      afdracht plaats met als valutadag de eerstvolgende dag die niet een zaterdag, zondag of algemeen erkende feestdag
      is.
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel3
  - number: '4.1'
    text: |-
      In de raming, bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], worden, overeenkomstig de bij deze regeling
      behorende [bijlagen 1][ref2] en [2][ref3], afzonderlijk per wet vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0016020#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016020
      [ref3]: https://wetten.overheid.nl/BWBR0016020
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel4
