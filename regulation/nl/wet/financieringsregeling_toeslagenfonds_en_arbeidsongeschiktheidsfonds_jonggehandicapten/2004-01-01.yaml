  - number: '6.1'
    text: Uiterlijk op 1 juni dient het UWV de afrekening over het afgelopen kalenderjaar bij de Minister in.
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel6
  - number: '6.2'
    text: |-
      In de afrekening wordt, op basis van de jaarrekening, bedoeld in [artikel 49 van de Wet SUWI][ref1], de
      kasstroom inzichtelijk gemaakt, en deze wordt afzonderlijk per wet vermeld voor de toeslagen op grond van de
      [Toeslagenwet][ref2] en de uitkeringen op grond van de [Tijdelijke wet BIA][ref3] en de [Wajong][ref4] inclusief
      de op grond van enige wet over de toeslagen en uitkeringen door UWV verschuldigde premies, die niet op deze
      toeslagen en uitkeringen in mindering kunnen worden gebracht, de uitgaven en ontvangsten die betrekking hebben op
      overige posten en de vakantie-uitkeringen, alsmede de uitvoeringskosten op grond van de [Toeslagenwet][ref5], de
      [Tijdelijke wet BIA][ref6] en de [Wajong][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0004043
      [ref3]: https://wetten.overheid.nl/BWBR0007891
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0004043
      [ref6]: https://wetten.overheid.nl/BWBR0007891
      [ref7]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0004043
      - id: ref3
        bwb_id: BWBR0007891
      - id: ref4
        bwb_id: BWBR0008657
      - id: ref5
        bwb_id: BWBR0004043
      - id: ref6
        bwb_id: BWBR0007891
      - id: ref7
        bwb_id: BWBR0008657
  - number: '6.3'
    text: |-
      Op grond van de afrekening, bedoeld in het eerste lid, vindt voor 15 juli een betaling plaats ten gunste of ten
      laste van het Toeslagenfonds onderscheidenlijk het Wajong-fonds.
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel6
  - number: '7'
    text: |-
      De Minister stelt jaarlijks voor 31 oktober de omvang van de middelen tot dekking van de uitgaven ten laste van
      het Toeslagenfonds, onderscheidenlijk het Wajong-fonds, over het afgelopen kalenderjaar vast, gespecificeerd
      overeenkomstig [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016020#Artikel5
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016020
        artikel: '5'
  - number: '8'
    text: |-
      De [Financieringsregeling Toeslagenwet][ref1] en de
      [Financieringsregeling Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2] worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009502
      [ref2]: https://wetten.overheid.nl/BWBR0009504
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009502
      - id: ref2
        bwb_id: BWBR0009504
  - number: '9'
    text: |-
      De [Financieringsregeling Toeslagenwet][ref1] en de
      [Financieringsregeling Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2] blijven van toepassing op de
      kalenderjaren voor 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0009502
      [ref2]: https://wetten.overheid.nl/BWBR0009504
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009502
      - id: ref2
        bwb_id: BWBR0009504
  - number: '10'
    text: Deze regeling treedt in werking met ingang van 1 januari 2004.
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel10
  - number: '11'
    text: |-
      Deze regeling wordt aangehaald als: Financieringsregeling Toeslagenfonds en Arbeidsongeschiktheidsfonds
      jonggehandicapten.
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel11
