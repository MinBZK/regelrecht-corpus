  - number: '5.2'
    text: De in het eerste lid, onderdeel a, bedoelde bedragen omvatten tevens de uitbetaalde vakantie-uitkeringen.
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel5
  - number: '5.3'
    text: |-
      In de opgave worden tevens de gerealiseerde uitgaven opgenomen die op grond van
      [artikel 42 Wet op de (re)integratie arbeidsgehandicapten][ref1] en de daarop berustende bepalingen ten laste van
      het Wajong-fonds komen.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel42
    url: https://wetten.overheid.nl/BWBR0016020/2004-01-01#Artikel5
