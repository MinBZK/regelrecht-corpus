      overige posten: wettelijke rente, proceskosten, rentelasten, ontvangsten met betrekking tot verhaal op grond van
      [artikel 61 Wajong][ref1], en de vereveningsbijdrage, bedoeld in [artikel 48 van de Wajong][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel61
