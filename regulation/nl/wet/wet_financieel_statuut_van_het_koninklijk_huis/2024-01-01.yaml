                    € 285 646
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel1
  - number: '1.3'
    text: |-
      In dit artikel wordt onder echtgenote van de Koning mede verstaan de echtgenoot van de Koningin, draagster van
      de Kroon.
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel1
  - number: '2.1'
    text: |-
      Indien de Koning overlijdt, ontvangt de overlevende echtgenoot of echtgenote, zolang deze lid is van het koninklijk
      huis,:
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel2
  - number: 2.1.a
    text: |-
      gedurende de eerste twee jaren na het overlijden jaarlijks de geldelijke uitkering die hij of zij zou
      hebben ontvangen indien het overlijden niet zou hebben plaats gehad, vermeerderd met een kwart van het in
      [artikel 1, tweede lid, onder B][ref1], vermelde gedeelte van de uitkering van de Koning of, indien één van
      de wettige nakomelingen van de overleden Koning de minderjarige Koning is, gedurende de periode van diens
      minderjarigheid binnen de genoemde periode van de eerste twee jaren na het overlijden een jaarlijkse geldelijke
      uitkering ter hoogte van de uitkering van de vermoedelijke opvolger van de Koning;


      [ref1]: https://wetten.overheid.nl/BWBR0002845#Artikel1
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002845
        artikel: '1'
  - number: 2.1.b
    text: |-
      na de in onderdeel a bedoelde periode van twee jaren na het overlijden een jaarlijkse geldelijke uitkering ter
      hoogte van de helft van de uitkering van de vermoedelijke opvolger van de Koning of, indien na de in onderdeel
      a bedoelde periode van twee jaren na het overlijden één of meer van de wettige nakomelingen van de overleden
      Koning minderjarig is, gedurende de minderjarigheid van deze nakomeling of nakomelingen, een jaarlijkse geldelijke
      uitkering ter hoogte van de uitkering van de vermoedelijke opvolger van de Koning.
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel2
  - number: '2.2'
    text: |-
      Indien de vermoedelijke opvolger van de Koning overlijdt, ontvangt de overlevende echtgenoot of echtgenote, zolang
      deze lid is van het koninklijk huis,:
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel2
  - number: 2.2.a
    text: |-
      indien op het moment van overlijden van de vermoedelijke opvolger van de Koning één of meer van diens wettige
      nakomelingen minderjarig is, gedurende de minderjarigheid van deze nakomeling of nakomelingen een jaarlijkse
      geldelijke uitkering ter hoogte van de uitkering van de vermoedelijke opvolger van de Koning en na deze periode
      een jaarlijkse geldelijke uitkering ter hoogte van de helft van de uitkering van de vermoedelijke opvolger van
      de Koning;
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel2
  - number: 2.2.b
    text: |-
      indien geen toepassing wordt gegeven aan onderdeel a, gedurende de eerste twee jaren na het overlijden de
      jaarlijkse geldelijke uitkering die hij of zij zou hebben ontvangen indien het overlijden niet zou hebben plaats
      gehad, vermeerderd met een kwart van het in [artikel 1, tweede lid, onder B][ref1], vermelde gedeelte van de
      uitkering van de vermoedelijke opvolger van de Koning en na deze periode een jaarlijkse geldelijke uitkering ter
      hoogte van de helft van de uitkering van de vermoedelijke opvolger van de Koning.


      [ref1]: https://wetten.overheid.nl/BWBR0002845#Artikel1
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002845
        artikel: '1'
  - number: '2.3'
    text: |-
      Indien de Koning die afstand heeft gedaan van het koningschap overlijdt, ontvangt de overlevende echtgenoot of
      echtgenote, zolang deze lid is van het koninklijk huis,:
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel2
  - number: 2.3.a
    text: |-
      indien op het moment van overlijden van de Koning die afstand heeft gedaan van het koningschap één of meer van
      diens wettige nakomelingen minderjarig is, gedurende de minderjarigheid van deze nakomeling of nakomelingen, een
      jaarlijkse geldelijke uitkering ter hoogte van de uitkering van de vermoedelijke opvolger van de Koning en na deze
      periode een jaarlijkse geldelijke uitkering ter hoogte van de helft van de uitkering van de vermoedelijke opvolger
      van de Koning;
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel2
  - number: 2.3.b
    text: |-
      indien geen toepassing wordt gegeven aan onderdeel a van dit lid, gedurende de eerste twee jaren na het overlijden
      de jaarlijkse geldelijke uitkering die hij of zij zou hebben ontvangen indien het overlijden niet zou hebben
      plaats gehad, vermeerderd met een kwart van het in [artikel 1, tweede lid, onder B][ref1], vermelde gedeelte van de
      uitkering van de Koning die afstand heeft gedaan van het koningschap en na deze periode een jaarlijkse geldelijke
      uitkering ter hoogte van de helft van de uitkering van de vermoedelijke opvolger van de Koning.


      [ref1]: https://wetten.overheid.nl/BWBR0002845#Artikel1
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002845
        artikel: '1'
  - number: '2.4'
    text: |-
      In de in het eerste lid, onder b, en in het tweede lid, onder a en b, genoemde gevallen waarin is bepaald dat
      de overlevende echtgenoot of echtgenote een jaarlijkse geldelijke uitkering ontvangt ter hoogte van de uitkering
      van de vermoedelijke opvolger van de Koning onderscheidenlijk ter hoogte van de helft van de uitkering van de
      vermoedelijke opvolger van de Koning, is het gedeelte van de jaarlijkse geldelijke uitkering dat betrekking heeft
      op het inkomensbestanddeel in alle gevallen gelijk aan het in [artikel 1, tweede lid, onder A][ref1], vermelde
      gedeelte van de uitkering van de vermoedelijke opvolger van de Koning. Het overige gedeelte van de jaarlijkse
      geldelijke uitkering heeft betrekking op de materiële en personele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002845#Artikel1
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002845
        artikel: '1'
  - number: '2.5'
    text: |-
      In de in het eerste, tweede en derde lid genoemde gevallen waarin is bepaald dat de overlevende echtgenoot of
      echtgenote gedurende de eerste twee jaar na het overlijden de jaarlijkse geldelijke uitkering ontvangt die hij of
      zij zou hebben ontvangen indien het overlijden niet zou hebben plaatsgehad, vermeerderd met een kwart van het in
      [artikel 1, tweede lid, onder B][ref1], vermelde gedeelte van de uitkering van de overledene alsmede het andere
      in het eerste lid, onder a, genoemde geval en de overige in het derde lid, onder a en b, genoemde gevallen, is het
      gedeelte van de jaarlijkse geldelijke uitkering dat betrekking heeft op het inkomensbestanddeel in alle gevallen
      gelijk aan het in [artikel 1, tweede lid, onder A][ref2], vermelde gedeelte van de uitkering dat de overlevende
      echtgenoot of echtgenote ontving voordat het overlijden plaatsvond. Het overige gedeelte van de jaarlijkse
      geldelijke uitkering heeft betrekking op de materiële en personele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002845#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002845#Artikel1
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002845
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002845
        artikel: '1'
  - number: '3'
    text: |-
      Personele en materiële kosten die samenhangen met het koningschap, niet zijnde de uitkeringen die op grond van
      de [artikelen 1][ref1] en [2][ref2] worden verstrekt, worden bekostigd uit de begroting van het Rijk voor zover
      deze hiervoor een voorziening bevat en nadat de kosten door of vanwege de Koning daartoe door tussenkomst van Onze
      Minister-President bij Onze minister die het aangaat zijn gedeclareerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002845#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002845#Artikel2
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002845
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002845
        artikel: '2'
  - number: '4.1'
    text: |-
      Aan de Koning worden ten laste van het Rijk het paleis Noordeinde te ’s-Gravenhage, het paleis Huis ten Bosch te
      ’s-Gravenhage en het paleis op de Dam te Amsterdam tot gebruik ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij koninklijk besluit kunnen aan de Koning ten laste van het Rijk daarnaast tijdelijk andere woon- en
      werkverblijven tot gebruik ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel4
  - number: '4.3'
    text: |-
      Indien de Koning overlijdt, kan bij koninklijk besluit aan de overlevende echtgenoot of echtgenote, zolang deze lid
      is van het koninklijk huis, ten laste van het Rijk een woonverblijf tot gebruik ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel4
  - number: '4.4'
    text: |-
      Bij koninklijk besluit kan aan de vermoedelijke opvolger van de Koning onderscheidenlijk aan de Koning die afstand
      van het koningschap heeft gedaan ten laste van het Rijk een woonverblijf tot gebruik ter beschikking worden
      gesteld. In dit besluit kan worden bepaald dat indien de vermoedelijke opvolger van de Koning onderscheidenlijk de
      Koning die afstand van het koningschap heeft gedaan overlijdt, het woonverblijf aan de overlevende echtgenoot of
      echtgenote, zolang deze lid is van het koninklijk huis, tot gebruik ter beschikking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel4
  - number: '4.5'
    text: |-
      Een koninklijk besluit, strekkende tot de uitvoering van het tweede tot en met vierde lid, wordt in het
      *Staatsblad* geplaatst.
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel4
  - number: '6.1'
    text: |-
      Ten aanzien van de Staatsdomeinen blijft het genot van de jacht, bij het in werking treden van deze wet behorende
      tot of voortvloeiende uit het Kroondomein, bedoeld in de wet van 1 mei 1863, *Stb.* 43, afgestaan aan de Koning;
      deze is jachthouder in de zin van de [Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: '8'
    text: De wet van 5 maart 1952, *Stb.* 99, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel8
  - number: '9'
    text: 'Deze wet kan worden aangehaald als: Wet financieel statuut van het Koninklijk Huis.'
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel9
  - number: '10'
    text: Deze wet treedt in werking met ingang van 1 januari 1973.
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel10
