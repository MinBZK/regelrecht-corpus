preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ingevolge artikel 22 in samenhang met additioneel artikel VIII van de
    Grondwet, de wet regels dient te stellen ter zake van de uitkeringen die de Koning jaarlijks ten laste van het Rijk
    ontvangt en dient te bepalen aan welke andere leden van het Koninklijk Huis uitkeringen worden toegekend, waarbij
    deze uitkeringen dienen te worden geregeld, terwijl het mede met het oog daarop noodzakelijk is voorzieningen te
    treffen met betrekking tot de opheffing van het Kroondomein, bedoeld in de Wet van 1 mei 1863, Stb. 43;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De Koning en de na te noemen andere leden van het Koninklijk Huis ontvangen jaarlijks de volgende geldelijke
      uitkeringen: de Koning € 4 757 359 de echtgenote van de Koning € 821 946 de vermoedelijke opvolger van de Koning,
      te rekenen vanaf de leeftijd van 18 jaar € 1 281 313 de echtgenote of de echtgenoot van de vermoedelijke opvolger
      van de Koning € 578 077 de Koning die afstand van het koningschap heeft gedaan € 1 288 730 de echtgenoot of
      de echtgenote van de Koning die afstand van het koningschap heeft gedaan € 492 918 vermeerderd of verminderd
      in elk jaar waarover de uitkering wordt genoten: - voor het gedeelte van de uitkering dat betrekking heeft op
      het inkomensbestanddeel, vermeld onder A van de in het tweede lid opgenomen tabel, in de verhouding waarin de
      bezoldiging van de vice-president van de Raad van State in dat jaar afwijkt van de bezoldiging in het jaar 2007;
        - voor de helft van het gedeelte van de uitkering dat betrekking heeft op personele en materiële kosten, vermeld
      onder B van de in het tweede lid opgenomen tabel, in de verhouding waarin de bezoldiging van het burgerlijk
      rijkspersoneel afwijkt van deze bezoldiging in het jaar 2007 en voor de andere helft in de verhouding waarin het
      algemeen prijspeil van het gezinsverbruik blijkens de door het Centraal Bureau voor de Statistiek vastgestelde
      consumentenprijsindex in de maand juni van dat jaar afwijkt van dat prijspeil in de maand juni van het jaar 2007.
    url: https://wetten.overheid.nl/BWBR0002845/2024-01-01#Artikel1
  - number: '1.2'
    text: |-
      De in het eerste lid bedoelde gedeelten van de uitkeringen zijn voor elk van de in dat lid genoemde personen:








                    A


                    B






                    I. De Koning


                    € 764 304


                    € 3 993 055




                    II. De echtgenoot of echtgenote van de Koning


                    € 302 948


                    € 518 988




                    III. De vermoedelijke opvolger van de Koning


                    € 226 460


                    € 1 054 853




                    IV. De echtgenoot of echtgenote van de vermoedelijke opvolger van de Koning


                    € 226 460


                    € 351 617




                    V. De Koning die afstand van het koningschap heeft gedaan


