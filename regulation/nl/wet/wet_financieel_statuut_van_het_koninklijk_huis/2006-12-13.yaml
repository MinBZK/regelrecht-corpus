  - number: '4'
    text: |-
      1 Aan de Koning worden ten laste van het Rijk paleizen tot gebruik ter beschikking gesteld.

      2 Ons besluit, strekkende tot de uitvoering van het in het vorige lid bepaalde, wordt in het *Staatsblad*
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0002845/2006-12-13#Artikel4
  - number: '5'
    text: |-
      1 De wet van 1 mei 1863, *Stb.* 43, wordt ingetrokken.

      2 De tot het Kroondomein, bedoeld in voornoemde wet, behorende zaken worden met ingang van de datum waarop deze
      wet in werking treedt, in beheer genomen door Onze Minister van Financiën die, voorzover zulks alsdan nog niet is
      geschied, zorg draagt voor verrekening, op de voet van artikel 2 van de in het eerste lid genoemde wet, van de daar
      bedoelde inkomsten, lasten en kosten, betrekking hebbend op de voor deze datum gelegen tijdvakken.

      3 Bij of krachtens algemene maatregel van bestuur wordt een regeling getroffen met betrekking tot de rechtspositie
      van de administrateur van dit Kroondomein en het personeel op het tijdstip, bedoeld in het tweede lid, werkzaam bij
      de hoofdadministratie van dit domein en bij de rentambten

      a. Werkendam-Tholen-Roosendaal-Oosterhout-Dordrecht;

      b. Culemborg-Tiel-Grave-Arnhem;

      c. Amersfoort;

      d. Hulst-Middelburg-Goes.

      4 De inschrijvingen op het 2½% Grootboek der Nationale Schuld ten name van dit Kroondomein zijn te niet gegaan.

      5 Indien op het tijdstip, bedoeld in het tweede lid, overeenkomsten tot vervreemding of ruiling van goederen,
      behorende tot dit Kroondomein, zijn gesloten en de bij artikel 3 van de bedoelde wet vereiste goedkeuring bij de
      wet alsdan nog niet is verkregen, zijn op een zodanige vervreemding of ruiling van toepassing de desbetreffende
      bepalingen, geldend voor aan de Staat toebehorende goederen.

      6 Onze Minister van Financiën kan nadere regelen treffen die door hem in verband met de opheffing van dit
      Kroondomein nodig worden geacht.
    url: https://wetten.overheid.nl/BWBR0002845/2006-12-13#Artikel5
  - number: '6'
    text: |-
      1 Ten aanzien van de Staatsdomeinen blijft het genot van de jacht, bij het in werking treden van deze wet behorende
      tot of voortvloeiende uit het Kroondomein, bedoeld in de wet van 1 mei 1863, *Stb.* 43, afgestaan aan de Koning;
      deze is jachthouder in de zin van de [Flora- en faunawet][ref1].

