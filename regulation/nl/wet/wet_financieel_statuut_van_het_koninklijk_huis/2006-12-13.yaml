  - number: '2'
    text: |-
      1 Bij overlijden van de Koning dan wel van de vermoedelijke erfgenaam van de Kroon ontvangt de overlevende
      echtgenote of echtgenoot, zolang deze lid van het Koninklijk Huis is, een uitkering die binnen twee jaren na het
      overlijden geregeld wordt door aanvulling van deze wet.

      2 De in het eerste lid bedoelde echtgenote of echtgenoot ontvangt, zolang deze lid van het Koninklijk Huis is, tot
      het in werking treden van de in het eerste lid bedoelde regeling ten minste de uitkering die zij of hij volgens het
      bepaalde in [artikel 1][ref1] zou hebben ontvangen indien het overlijden niet zou hebben plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0002845#Artikel1
    url: https://wetten.overheid.nl/BWBR0002845/2006-12-13#Artikel2
