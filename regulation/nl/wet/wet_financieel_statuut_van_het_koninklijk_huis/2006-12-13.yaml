  - number: '3'
    text: |-
      Een Koning die afstand van de Kroon heeft gedaan alsmede zijn echtgenote ontvangen, zolang zij lid zijn van het
      Koninklijk Huis, een uitkering die geregeld wordt door aanvulling van deze wet. De [artikelen 1, vierde lid][ref1],
      en [2][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002845#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002845#Artikel2
