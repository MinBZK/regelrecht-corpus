preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ingevolge artikel 22 in samenhang met additioneel artikel VIII van de
    Grondwet, de wet regels dient te stellen ter zake van de uitkeringen die de Koning jaarlijks ten laste van het Rijk
    ontvangt en dient te bepalen aan welke andere leden van het Koninklijk Huis uitkeringen worden toegekend, waarbij
    deze uitkeringen dienen te worden geregeld, terwijl het mede met het oog daarop noodzakelijk is voorzieningen te
    treffen met betrekking tot de opheffing van het Kroondomein, bedoeld in de Wet van 1 mei 1863, Stb. 43;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002845/2006-12-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De Koning en de na te noemen andere leden van het Koninklijk Huis ontvangen jaarlijks de volgende geldelijke
      uitkeringen:

      de Koning € 1 225 206,58

      de echtgenote van de Koning € 245 041,32

      de vermoedelijke erfgenaam van de Kroon, te rekenen vanaf de leeftijd van 18 jaar € 281 343,73

      de echtgenote of de echtgenoot van de vermoedelijke erfgenaam van de Kroon € 249 579,12

      vermeerderd of verminderd in elk jaar waarover de uitkering wordt genoten:

        - voor het gedeelte van de uitkering dat betrekking heeft op personeelskosten, vermeld onder A van de in het vierde
      lid opgenomen tabel, in de verhouding waarin het ambtelijke inkomen van een ambtenaar in schaal 11 dan wel schaal
      3 - zulks naar gelang het betreft een lid van het Koninklijk Huis genoemd onder I en II dan wel onder III en IV van
      die tabel - in dat jaar afwijkt van dat ambtelijk inkomen in het jaar 1971;
        - voor het gedeelte van de uitkering dat betrekking heeft op overige kosten, vermeld onder B van de in het vierde
      lid opgenomen tabel, in de verhouding waarin het algemeen prijspeil van het gezinsverbruik blijkens de door het
      Centraal Bureau voor de Statistiek vastgestelde consumentenprijsindex in de maand juni van dat jaar afwijkt van dat
      prijspeil in de maand juni van het jaar 1971;
        - voor het gedeelte van de uitkering dat betrekking heeft op het inkomensbestanddeel, vermeld onder C van de in het
      vierde lid opgenomen tabel, in de verhouding waarin het netto-ambtelijk inkomen van de vice-president van de Raad
      van State in dat jaar afwijkt van dat netto-ambtelijk inkomen in het jaar 1971.

      2 In het eerste lid wordt verstaan onder:

        - het ambtelijk inkomen van een ambtenaar in schaal 11 dan wel schaal 3 het ambtelijk inkomen in de zin van artikel
      C1 van de Algemene burgerlijke pensioenwet, zoals dat luidde op 31 december 1995, met uitzondering van toelagen
      of uitkeringen, welke geen algemeen karakter dragen van een ambtenaar in schaal 11, onderscheidenlijk 3 van
      [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] (*Stb.* 1983, 571), die gedurende
      het desbetreffende jaar het maximum salaris van zijn schaal geniet;
        - het netto-ambtelijk inkomen van de vice-president van de Raad van State het ambtelijk inkomen in de zin van
      artikel C 1 van de Algemene burgerlijke pensioenwet, zoals dat luidde op 31 december 1995, met uitzondering
      van toelagen of uitkeringen, welke geen algemeen karakter dragen, van de vice-president van de Raad van State,
      verminderd met over het inkomen verschuldigde premies voor sociale verzekeringen en inkomstenbelasting waarbij voor
      de berekening wordt uitgegaan van een leeftijd beneden 65 jaar, inkomen uit tegenwoordige arbeid en tweemaal de
      algemene heffingskorting.

      3 Voor de toepassing van het eerste lid wordt niet als afwijking beschouwd de afwijking van het ambtelijk inkomen
      welke het gevolg is van de met de Wet afschaffing overneming premie AOW/AWW (*Stb.* 1985, 288) samenhangende
      salarisverhoging van het burgerlijk overheidspersoneel als geregeld in het koninklijk besluit van 8 augustus 1985,
      *Stb.* 451.

      4 De in het eerste lid bedoelde gedeelten van de uitkeringen zijn voor elk der in dat lid genoemde personen:













