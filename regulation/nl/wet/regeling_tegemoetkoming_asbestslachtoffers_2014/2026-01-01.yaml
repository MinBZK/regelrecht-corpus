  - number: '20'
    text: Deze regeling wordt uitgevoerd door de SVB.
    url: https://wetten.overheid.nl/BWBR0035006/2026-01-01#Artikel20
  - number: '21'
    text: |-
      1 De SVB kan over het recht op het voorschot advies vragen aan het Instituut Asbestslachtoffers.

      2 De SVB stelt de eisen vast waaraan het advies voldoet en stelt een termijn binnen welke het advies wordt
      verwacht.
    url: https://wetten.overheid.nl/BWBR0035006/2026-01-01#Artikel21
  - number: '22'
    text: |-
      1 De SVB en het Instituut Asbestslachtoffers stellen een overeenkomst op betreffende de samenwerking en werkwijze
      in het kader van de uitvoering van deze regeling.

      2 In de in het eerste lid bedoelde overeenkomst wordt ten minste vastgelegd:

      a. op welke wijze de behandeling van aanvragen van een voorschot plaatsvindt;

      b. op welke wijze de juistheid en de volledigheid van de verkregen inlichtingen wordt onderzocht;

      c. op welke wijze de informatievoorziening aan belanghebbenden wordt ingericht;

      d. welke vergoeding door de SVB aan het Instituut Asbestslachtoffers zal worden verstrekt;

      e. op welke wijze de verstrekking van de vergoedingen, bedoeld onder d, zal worden ingericht;

      f. dat periodiek overleg zal worden gevoerd betreffende de uitvoering van deze regeling, alsmede de frequentie
      daarvan;

      g. welke informatie door het Instituut Asbestslachtoffers aan de SVB wordt verstrekt ten behoeve van de
      informatieverplichting van de SVB aan de minister;

      h. hoe uit de overeenkomst voortvloeiende geschillen zullen worden beslecht.
    url: https://wetten.overheid.nl/BWBR0035006/2026-01-01#Artikel22
  - number: '23'
    text: |-
      1 Voor de datum, bedoeld in de eerste volzin van [artikel 5.3, eerste lid, van de Regeling SUWI][ref1] verstrekt
      de SVB aan de minister in het jaarplan met begroting een opgave van het totaalbedrag aan de voor het komende
      jaar geraamde baten en lasten met betrekking tot deze regeling, uitgesplitst naar uitkeringslasten per maand en
      uitvoeringskosten per jaar.

      2 In de opgave van de uitkeringslasten, bedoeld in het eerste lid, wordt rekening gehouden met de posten genoemd in
      [artikel 25, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013280#Artikel5.3
      [ref2]: https://wetten.overheid.nl/BWBR0035006#Artikel25
