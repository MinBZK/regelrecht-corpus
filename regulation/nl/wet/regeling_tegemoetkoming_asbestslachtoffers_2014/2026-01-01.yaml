  - number: '12'
    text: |-
      1 Indien de werknemer in verband met de blootstelling aan asbest tijdens het verrichten van arbeid buiten Nederland
      en het daardoor veroorzaakte asbestose een betaling van de werkgever of de productaansprakelijke heeft ontvangen,
      bestaat het recht op een voorschot in afwijking van [artikel 10][ref1] uitsluitend voor zover die betaling lager is
      dan € 27.030 ongeacht de vorm waarin de betaling is gedaan en de aard van de kosten waarin de betaling voorziet.

      2 Geen recht op een voorschot bestaat indien de werknemer of diens nabestaanden reeds een:

      a. voorschot op grond van deze regeling of een betaling als bedoeld in de [artikelen 3, onder b][ref2], en
      [10, onder b][ref3], van € 27.030 of hoger van de werkgever of de productaansprakelijke hebben ontvangen;

      b. voorschot of eenmalige uitkering op grond van de [Regeling tegemoetkoming asbestslachtoffers][ref4] hebben
      ontvangen;

      c. tegemoetkoming op grond van de
      [Regeling tegemoetkoming niet-loondienstgerelateerde slachtoffers van mesothelioom en asbestose][ref5] hebben
      ontvangen; of

      d. tegemoetkoming op grond van de [Regeling tegemoetkoming stoffengerelateerde beroepsziekten][ref6] hebben
      ontvangen.


