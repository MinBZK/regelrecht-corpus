articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *asbest:* stoffen die een of meer van de volgende vezelachtige silicaten bevatten: a. actinoliet (Cas-nummer
      77536-66-4); b. amosiet (Cas-nummer 12172-73-5); c. anthofylliet (Cas-nummer 77536-67-5); d. chrysotiel (Cas-nummer
      12001-29-5); e. tremoliet (Cas-nummer 77536-68-6); f. crocidoliet (Cas-nummer 12001-28-4);
        - *asbestose:* een aandoening die is gekenmerkt door verbindweefseling (longfibrose) van de long als gevolg van
      asbestblootstelling;
        - *huisgenoot:* de persoon met wie de werknemer een duurzaam hoofdverblijf heeft gehad in dezelfde woning ten tijde
      van de blootstelling aan asbest;
        - *Instituut Asbestslachtoffers:* Stichting Instituut Asbestslachtoffers te ‘s-Gravenhage;
        - *lasten:* a. voorschot; b. vergoedingen die door de SVB aan het Instituut Asbestslachtoffers worden verstrekt
      voor de advisering ten behoeve van deze regeling;
        - *maligne mesothelioom:* door blootstelling aan asbest veroorzaakte tumor van het longvlies, het buikvlies of het
      hartvlies als bedoeld in het protocol diagnostiek maligne mesothelioom;
        - *minister:* Minister van Sociale Zaken en Werkgelegenheid;
        - *nabestaanden:* a. de langstlevende van de echtgenoten; b. bij ontstentenis van de onder a bedoelde persoon, de
      minderjarige kinderen, tot wie de overledene in familierechtelijke betrekking stond; c. bij ontstentenis van de
      onder a en b bedoelde personen, degenen met wie hij in gezinsverband leefde; d. bij ontstentenis van de onder a,
      b en c bedoelde personen, erfgenamen als bedoeld in [Boek 4 van het Burgerlijk Wetboek][ref1], mits een verklaring
      van erfrecht wordt overgelegd;
        - *productaansprakelijke:* de producent, bedoeld in
      [artikel 187, tweede lid, van Boek 6 van het Burgerlijk Wetboek][ref2], wiens gebrekkig product oorzaak is van de
      asbestose of het maligne mesothelioom bij de werknemer;
        - *protocol diagnostiek asbestose:* protocol diagnostiek asbestose, opgenomen in [bijlage 1][ref3] bij deze
      regeling;
        - *protocol diagnostiek maligne mesothelioom:* protocol diagnostiek maligne mesothelioom, opgenomen in
      [bijlage 2][ref4] bij deze regeling;
        - *SVB:* Sociale verzekeringsbank, genoemd in [hoofdstuk 6 van de Wet SUWI][ref5];
        - *voorschot:* een uitkering als voorschot op de eventuele vordering op de werkgever op wie de immateriële schade
      kan worden verhaald;
        - *werkgever:* de natuurlijke of rechtspersoon voor wie de werknemer arbeid in Nederland verricht of het verricht
      krachtens een Nederlandse publiekrechtelijke aanstelling of krachtens een arbeidsovereenkomst waarop Nederlands
      recht van toepassing is of was;
        - *werknemer:* degene die voor een natuurlijke of rechtspersoon arbeid in Nederland verricht of heeft verricht
      krachtens een Nederlandse publiekrechtelijke aanstelling of krachtens een arbeidsovereenkomst waarop Nederlands
      recht van toepassing is of was;
        - *Wet SUWI:* [Wet structuur uitvoeringsorganisatie werk en inkomen][ref6].

      2 In deze regeling wordt met de echtgenoot gelijkgesteld de geregistreerde partner en de persoon die op grond van
      [artikel 1, derde lid, onder a, en vierde tot en met zevende lid, van de Algemene Ouderdomswet][ref7] en de daarop
      berustende bepalingen mede als zodanig wordt aangemerkt.

      3 In deze regeling wordt niet als echtgenoot aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie
      hij gehuwd is.


