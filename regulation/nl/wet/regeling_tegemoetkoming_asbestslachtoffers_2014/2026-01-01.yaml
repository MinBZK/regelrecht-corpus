  - number: '9'
    text: |-
      Voor de huisgenoot bestaat geen recht op een voorschot indien aan de huisgenoot of diens nabestaanden reeds
      een voorschot op grond van deze regeling of een betaling als bedoeld in de [artikelen 3, onder b][ref1], en
      [10, onder b][ref2], van € 27.030 of hoger door de werkgever of de productaansprakelijke is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0035006#Artikel3
