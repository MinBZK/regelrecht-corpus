      1 Het voorschot strekt tot tegemoetkoming in immateriële schade en bedraagt € 27.030.

      2 Indien de werkgever of productaansprakelijke in verband met de blootstelling aan asbest van de werknemer tijdens
      het verrichten van arbeid en het daardoor veroorzaakte asbestose een bedrag heeft betaald dat lager is dan € 27.030
