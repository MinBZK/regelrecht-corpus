  - number: '14'
    text: |-
      1 De SVB stelt op aanvraag van de werknemer vast of recht op het voorschot bestaat.

      2 Een aanvraag om het voorschot wordt bij de SVB ingediend.

      3 Indien er meer dan één nabestaande is, dragen de nabestaanden er zorg voor dat aan één van hen een volmacht wordt
      verleend tot vertegenwoordiging ten behoeve van de uitvoering van deze regeling, het in ontvangst nemen van het
      voorschot daarbij inbegrepen.
    url: https://wetten.overheid.nl/BWBR0035006/2026-01-01#Artikel14
  - number: '15'
    text: |-
      1 De behandeling van de aanvraag respectievelijk de behandeling van het verzoek tot bemiddeling en vervolgens de
      aanvraag worden ten behoeve van de nabestaanden voortgezet, tenzij deze schriftelijk te kennen geven daarop geen
      prijs te stellen, indien de werknemer is overleden:

      a. nadat hij de aanvraag heeft ingediend, doch voordat op de aanvraag is beslist; of

      b. voordat hij de aanvraag heeft ingediend, doch nadat hij bij het Instituut Asbestslachtoffers een verzoek tot
      bemiddeling heeft ingediend.

      2 [Artikel 14, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035006#Artikel14
    url: https://wetten.overheid.nl/BWBR0035006/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0035006
        artikel: '14'
        hoofdstuk: '4'
  - number: '16'
    text: |-
      1 De werknemer verstrekt de SVB of de door haar aangewezen personen of instellingen bij de indiening van de
      aanvraag om een voorschot in ieder geval de inlichtingen en bewijsstukken die noodzakelijk zijn ter vaststelling
      van maligne mesothelioom of asbestose.

      2 In verband met de voorwaarde dat aannemelijk wordt gemaakt dat het maligne mesothelioom of asbestose is
      veroorzaakt door blootstelling aan asbest tijdens het verrichten van arbeid als werknemer verstrekt de werknemer de
      SVB of de door haar aangewezen personen of instellingen bij de indiening van de aanvraag om een voorschot voorts in
      ieder geval de inlichtingen en zo mogelijk bewijsstukken omtrent:

      a. de blootstelling aan asbest gedurende het verrichten van arbeid als werknemer;

      b. de periode gedurende welke die blootstelling aan asbest heeft plaatsgevonden; c. degenen die in verband met de
      arbeid waarbij de blootstelling aan asbest heeft plaatsgevonden als werkgever worden aangemerkt.

      3 De werknemer verstrekt de SVB of de door haar aangewezen personen of instellingen op verzoek of uit eigen
      beweging de overige inlichtingen en bewijsstukken die nodig zijn voor de uitvoering van deze regeling en verleent
      ook overigens de medewerking die redelijkerwijs nodig is.

      4 Indien de aanvraag om het voorschot van een werknemer na diens overlijden wordt voortgezet ten behoeve van de
      nabestaanden, is dit artikel op hen van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0035006/2026-01-01#Artikel16
  - number: '17'
    text: |-
      Het voorschot wordt door de SVB zo spoedig mogelijk uitbetaald aan de werknemer of de nabestaande, bedoeld in
      [artikel 14, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035006#Artikel14
    url: https://wetten.overheid.nl/BWBR0035006/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0035006
        artikel: '14'
        hoofdstuk: '4'
  - number: '18'
    text: |-
      1 De SVB herziet een besluit tot toekenning van het voorschot of trekt dat in indien degene aan wie het voorschot
      is toegekend of de nabestaande hiervan:

      a. nadien alsnog een betaling heeft ontvangen waarmee rekening zou zijn gehouden bij de vaststelling van het recht
      op het voorschot, of

      b. de verplichtingen, bedoeld in de [artikelen 3, onder c, f en g][ref1], [10, onder c, f en g][ref2], en
      [16][ref3] niet of niet behoorlijk zijn nagekomen en dit heeft geleid tot het ten onrechte of tot een te hoog
      bedrag verlenen van het voorschot.

      2 Indien daarvoor dringende redenen aanwezig zijn kan de SVB besluiten geheel of gedeeltelijk van herziening of
      intrekking af te zien.

      3 Het voorschot dat als gevolg van een besluit als bedoeld in het eerste lid ten onrechte of tot een te hoog
      bedrag is verleend, alsmede hetgeen anderszins onverschuldigd is betaald, wordt van degene aan wie het voorschot is
      toegekend, of de nabestaande hiervan, teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0035006#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035006#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0035006#Artikel16
    url: https://wetten.overheid.nl/BWBR0035006/2026-01-01#Artikel18
