  - number: '10'
    text: |-
      De werknemer die op het moment van de aanvraag in leven is en bij wie met toepassing van het protocol diagnostiek
      asbestose de ziekte asbestose is vastgesteld en waarbij sprake is van een longfunctiebeperking als bedoeld in
      klasse 2, 3 en 4 van het protocol diagnostiek asbestose heeft recht op een voorschot, indien:

      a. hij aannemelijk heeft gemaakt dat de asbestose is veroorzaakt door blootstelling aan asbest tijdens het
      verrichten van arbeid als werknemer;

      b. hij geen betaling in verband met de blootstelling aan asbest tijdens het verrichten van die arbeid en het
      daardoor veroorzaakte asbestose van de werkgever of de productaansprakelijke heeft ontvangen, dan wel in verband
      daarmee een bedrag heeft ontvangen dat lager is dan € 27.030 ongeacht de vorm waarin de betaling is gedaan en de
      aard van de kosten waarin de betaling voorziet;

      c. hij zich verplicht tot medewerking aan bemiddeling door het Instituut Asbestslachtoffers tussen hem en de
      werkgever om de schade vergoed te krijgen en, met inachtneming van onder d, tot medewerking om de schade zo nodig
      langs gerechtelijke weg vergoed te krijgen;

      d. hij de SVB een onherroepelijke volmacht als bedoeld in [artikel 74 van Boek 3 van het Burgerlijk Wetboek][ref1]
      heeft verleend om zo nodig de immateriële schade langs gerechtelijke weg te verhalen tot een bedrag zoals is
      overeengekomen in het convenant tot oprichting van het Instituut Asbestslachtoffers;

      e. hij de SVB een onherroepelijke volmacht als bedoeld in [artikel 74 van Boek 3 van het Burgerlijk Wetboek][ref2]
      heeft verleend om de immateriële schadevergoeding namens hem van de werkgever te innen, teneinde dit te verrekenen
      met het verleende voorschot;

      f. hij, na ontvangst van de schadevergoeding van de werkgever of de productaansprakelijke, het voorschot voor het
      geheel of, wanneer de schadevergoeding lager is dan het verleende voorschot, het voorschot voor dat deel aan de SVB
      terugbetaalt, indien geen gebruik wordt gemaakt van de volmacht, bedoeld in onder d, en

      g. hij aan de SVB onverwijld mededeling doet van ontvangst van de schadevergoeding, bedoeld in onder f.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel74
