  - number: '4'
    text: |-
      De nabestaanden hebben in plaats van de werknemer recht op het voorschot indien de werknemer is overleden:

      a. nadat hij de aanvraag heeft ingediend, doch voordat op de aanvraag is beslist, en de werknemer recht op het
      voorschot zou hebben gehad; of

      b. voordat hij de aanvraag heeft ingediend, doch nadat hij bij het Instituut Asbestslachtoffers een verzoek tot
      bemiddeling heeft ingediend, en de werknemer recht op het voorschot zou hebben gehad.
    url: https://wetten.overheid.nl/BWBR0035006/2026-01-01#Artikel4
  - number: '5'
    text: |-
      1 Indien de werknemer in verband met de blootstelling aan asbest tijdens het verrichten van arbeid buiten Nederland
      en het daardoor veroorzaakte maligne mesothelioom een betaling van de werkgever of de productaansprakelijke
      heeft ontvangen, bestaat het recht op een voorschot in afwijking van [artikel 3][ref1] uitsluitend voor zover die
      betaling lager is dan € 27.030 ongeacht de vorm waarin de betaling is gedaan en de aard van de kosten waarin de
      betaling voorziet.

      2 Geen recht op een voorschot bestaat indien de werknemer of diens nabestaanden reeds een:

      a. voorschot op grond van deze regeling of een betaling als bedoeld in de [artikelen 3, onder b][ref2], en
      [10, onder b][ref3], van € 27.030 of hoger van de werkgever of de productaansprakelijke hebben ontvangen;

      b. voorschot of eenmalige uitkering op grond van de [Regeling tegemoetkoming asbestslachtoffers][ref4] hebben
      ontvangen;

      c. tegemoetkoming op grond van de
      [Regeling tegemoetkoming niet-loondienstgerelateerde slachtoffers van mesothelioom en asbestose][ref5] hebben
      ontvangen; of

      d. tegemoetkoming op grond van de [Regeling tegemoetkoming stoffengerelateerde beroepsziekten][ref6] hebben
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0035006#Artikel3
