  - number: '8'
    text: |-
      In afwijking van [artikel 3, onder a][ref1], heeft de huisgenoot die op het moment van aanvraag in leven is en bij
      wie met toepassing van het protocol diagnostiek maligne mesothelioom de ziekte maligne mesothelioom is vastgesteld,
      recht op een voorschot als bedoeld in [artikel 3][ref2] indien hij aannemelijk heeft gemaakt dat:

      a. er sprake is van een duurzaam hoofdverblijf als bedoeld in [artikel 1, eerste lid][ref3];

      b. de werknemer, bedoeld in artikel 1, eerste lid, is blootgesteld aan asbest tijdens het verrichten van arbeid als
      werknemer, en

      c. hij als gevolg hiervan de ziekte maligne mesothelioom heeft opgelopen.


      [ref1]: https://wetten.overheid.nl/BWBR0035006#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035006#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035006#Artikel1
