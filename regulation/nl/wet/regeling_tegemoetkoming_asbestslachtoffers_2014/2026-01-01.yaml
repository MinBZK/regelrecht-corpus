  - number: '6'
    text: |-
      1 Het voorschot strekt tot tegemoetkoming in immateriële schade en bedraagt € 27.030.

      2 Indien de werkgever of de productaansprakelijke in verband met de blootstelling aan asbest van de
      werknemer tijdens het verrichten van arbeid en het daardoor veroorzaakte maligne mesothelioom een bedrag
      heeft betaald dat lager is dan € 27.030 of indien de werknemer een betaling heeft ontvangen als bedoeld in
      [artikel 5, eerste lid][ref1], wordt de hoogte van het voorschot vastgesteld op het verschil tussen het ontvangen
      bedrag en € 27.030.

      3 Voor de toepassing van het tweede lid, wordt als maatstaf genomen de hoogte van de betaling nadat daarop de
      verschuldigde belasting op grond van de [Wet inkomstenbelasting 2001][ref2] en premies voor de volksverzekeringen
      op grond van de [Wet financiering sociale verzekeringen][ref3] in mindering zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0035006#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353
