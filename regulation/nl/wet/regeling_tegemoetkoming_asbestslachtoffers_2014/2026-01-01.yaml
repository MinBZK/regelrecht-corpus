  - number: '24'
    text: |-
      1 De uitkeringslasten en uitvoeringskosten van deze regeling worden gefinancierd uit een rijksbijdrage ten laste
      van de begroting van de minister.

      2 De minister stort op de rekening-courant, bedoeld in [artikel 5.16, onder a, van de Regeling Wfsv][ref1], een
      periodiek voorschot op het bedrag, bedoeld in [artikel 23][ref2], van:

      a. geraamde uitkeringslasten met als valutadatum de tweeëntwintigste dag van elke maand, en

      b. 1/12de deel van de geraamde uitvoeringskosten met als valutadatum de vijftiende dag van elke maand.

      3 De minister kan, na overleg met de SVB, van de in het tweede lid, onder a en b, bedoelde bedragen afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.16
      [ref2]: https://wetten.overheid.nl/BWBR0035006#Artikel23
    url: https://wetten.overheid.nl/BWBR0035006/2026-01-01#Artikel24
