  - number: '25'
    text: |-
      1 In de jaarrekening, bedoeld in [artikel 49 van de Wet SUWI][ref1], worden de baten en lasten, alsmede de
      ontvangen voorschotten, bedoeld in [artikel 17, tweede lid][ref2], uitgesplitst naar uitkeringslasten en
      uitvoeringskosten, met betrekking tot deze regeling opgenomen.

      2 Op de in het eerste lid bedoelde uitkeringslasten komen in mindering:

      a. de bedragen die op grond van de [artikelen 3, onder e en f][ref3], en [10, onder e en f][ref4], zijn
      terugbetaald;

      b. de voorschotten die op grond van [artikel 18][ref5] zijn teruggevorderd en zijn terugbetaald.

      3 Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref6], rekent de minister de baten
      en lasten, alsmede de ontvangen voorschotten, met betrekking tot het desbetreffende kalenderjaar af, met als
      valutadatum 1 juni van het hierop volgende kalenderjaar.


