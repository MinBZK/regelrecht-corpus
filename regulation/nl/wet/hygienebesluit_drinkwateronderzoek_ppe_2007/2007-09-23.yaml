  - number: '4'
    text: |-
      1 De resultaten van de analyse van het monster behorende bij een chemisch drinkwateronderzoek en een
      bacteriologisch drinkwateronderzoek voldoen aan de bacteriologische en chemische normen, zoals opgenomen in
      [Bijlage II][ref1].

      2 Indien de resultaten van de analyse behorende bij een chemisch drinkwateronderzoek niet voldoen aan de chemische
      normen, dan neemt de ondernemer maatregelen teneinde te bewerkstelligen dat de chemische waarden van het drinkwater
      voldoen aan de gestelde normen.

      3 Nadat de ondernemer de maatregelen, zoals bedoeld in het tweede lid, heeft genomen, wordt, binnen acht weken
      nadat de ondernemer kennis heeft genomen van de resultaten van de analyse, opnieuw een chemisch drinkwateronderzoek
      uitgevoerd.

      4 Indien de resultaten van de analyse behorende bij een bacteriologisch drinkwateronderzoek niet voldoen aan de
      bacteriologische normen, wordt door de ondernemer, tijdens de eerstvolgende leegstandperiode, het drinkwatersysteem
      gereinigd en ontsmet.


