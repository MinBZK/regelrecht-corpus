  text: |-
    Gelet op artikel 2, eerste lid, onder l. van de Verordening hygiënevoorschriften pluimveehouderij (PPE) 2007;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022583/2007-09-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Dit besluit neemt de terminologie, als omschreven in
      [artikel 1 van de Verordening hygiënevoorschriften pluimveehouderij (PPE) 2007][ref1] (hierna: de Verordening),
      over, en verstaat voorts onder:

      a. een gesloten drinkwatersysteem: een drinkwatersysteem dat vanaf de drinkwaterleiding tot aan het drinkpunt
      in de stal gesloten is. Voor het toedienen van medicijnen mag hierop een dosator, voorraad- of mengvat worden
      aangesloten. Deze dienen echter wel voorzien te zijn van een goed sluitend deksel.

      b. een open drinkwatersysteem:

        - een drinkwatersysteem dat geen goed sluitend deksel heeft; of,
        - een drinkwatersysteem dat open verbindingen heeft vanaf de drinkwaterleiding tot het drinkpunt in de stal.


      [ref1]: https://wetten.overheid.nl/BWBR0022479#Artikel1
    url: https://wetten.overheid.nl/BWBR0022583/2007-09-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022479
        artikel: '1'
  - number: '2'
    text: |-
      1 Ter waarborging van de kwaliteit van het drinkwater voor pluimvee, is de ondernemer verantwoordelijk voor het
      nemen van de volgende maatregelen:

      a. Indien gebruik wordt gemaakt van een gesloten drinkwatersysteem in combinatie met drinkwater van het openbaar
      waterleidingnet wordt één maal per kalenderjaar in één stal een bacteriologisch drinkwateronderzoek uitgevoerd,
      tenzij tijdens iedere leegstandperiode ieder drinkwatersysteem in alle stallen wordt gereinigd en ontsmet.

      b. Indien gebruik wordt gemaakt van een gesloten drinkwatersysteem in combinatie met drinkwater van een eigen bron
      een chemisch drinkwateronderzoek uitgevoerd en wordt per bron in één stal een bacteriologisch drinkwateronderzoek
      uitgevoerd.

      c. Indien gebruik wordt gemaakt van een open drinkwatersysteem in combinatie met drinkwater van het openbaar
      waterleidingnet wordt één maal per kalenderjaar in alle stallen een bacteriologisch drinkwateronderzoek uitgevoerd.

      d. Indien gebruik wordt gemaakt van een open drinkwatersysteem in combinatie met drinkwater van een eigen bron
      wordt één maal per kalenderjaar per bron een chemisch drinkwateronderzoek uitgevoerd en wordt in alle stallen een
      bacteriologisch drinkwateronderzoek uitgevoerd.

      2 De in het eerste lid bedoelde drinkwateronderzoeken vinden plaats door het nemen van watermonsters en analyse van
      de genomen monsters.
    url: https://wetten.overheid.nl/BWBR0022583/2007-09-23#Artikel2
  - number: '3'
    text: |-
      1 De monstername als bedoeld in [artikel 2, tweede lid][ref1], wordt hetzij door de ondernemer hetzij door een
      HOSOWO-instantie in opdracht van de ondernemer uitgevoerd.

      2 De monstername als bedoeld in [artikel 2, tweede lid][ref2], wordt uitgevoerd overeenkomstig de wijze
      voorgeschreven in [Bijlage I][ref3].

      3 De analyse van het monster als bedoeld in [artikel 2, tweede lid][ref4], wordt uitgevoerd door een HOSOWO-
      instantie.


