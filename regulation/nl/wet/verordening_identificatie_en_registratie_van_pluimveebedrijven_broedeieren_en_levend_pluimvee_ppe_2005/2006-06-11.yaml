$id: verordening_identificatie_en_registratie_van_pluimveebedrijven_broedeieren_en_levend_pluimvee_ppe_2005
regulatory_layer: WET
publication_date: '2011-12-16'
valid_from: '2006-06-11'
bwb_id: BWBR0019280
url: https://wetten.overheid.nl/BWBR0019280/2006-06-11
preamble:
  text: |-
    Gelet op artikel 5a van de Landbouwkwaliteitsregeling delegatie bevoegdheden eieren (Stcrt. 2002, 215), artikel
    12.1 van de Regeling handel levende dieren en levende producten (Stcrt. 1994, 250), de artikelen 93, 95, 96, 102 en
    104 van de Wet op de bedrijfsorganisatie en de artikelen 4, 6 en 7 van het Instellingsbesluit Productschap Pluimvee
    en Eieren;

    Gezien Richtlijn nr. 90/539/EG van de Raad van de Europese Gemeenschappen van 15 oktober 1990 tot vaststelling van
    veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer en de invoer uit derde landen van
    pluimvee en broedeieren (PbEG L 303), Richtlijn nr. 2002/4/EG van de Commissie van de Europese Gemeenschappen van
    30 januari 2002 met betrekking tot registratie van onder Richtlijn 1999/74/EG van de Raad vallende inrichtingen
    waar legkippen worden gehouden (PbEGL 30) en de Wet tuchtrechtspraak bedrijfsorganisatie 2004;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt verstaan onder:








                  a.


                  [Richtlijn 2002/4/EG](32002L0004)


                  :


                  [Richtlijn nr. 2002/4/EG](32002L0004) van de Commissie van de Europese Gemeenschappen van 30 januari
      2002 met betrekking tot registratie van onder [Richtlijn 1999/74/EG](31999L0074) van de Raad vallende inrichtingen
      waar legkippen worden gehouden (PbEGL 30);




                  b.


                  [Richtlijn 90/539/EEG](31990L0539)


                  :


                  [Richtlijn nr. 90/539/EG](31990L0539) van de Raad van de Europese Gemeenschappen van 15 oktober 1990
      tot vaststelling van veterinairrechtelijke voorschriften voor het intracommunautaire handelsverkeer en de invoer
      uit derde landen van pluimvee en broedeieren (PbEG L 303);




                  c.


                  productschap


                  :


                  het Productschap Pluimvee en Eieren;




                  d.


                  bestuur


                  :


                  het bestuur van het productschap;




                  e.


                  voorzitter


                  :


                  de voorzitter van het productschap;




                  f.


                  ondernemer


                  :


                  een natuurlijke persoon of rechtspersoon, die al dan niet voor eigen rekening en risico bedrijfsmatig
      een pluimveebedrijf uitoefent of handelt in broedeieren of pluimvee;




                  g.


                  pluimveebedrijf


                  :


                  voorziening - die een inrichting kan omvatten - die wordt gebruikt voor het opfokken of het houden van
      fok- of gebruikspluimvee;




                  h.


                  inrichting


                  :


                  een perceelsgebonden ruimte of ruimtes bestemd of gebruikt voor een van de volgende bedrijfssectoren:
                  fokbedrijf: inrichting die zich toelegt op de productie van broedeieren, bestemd voor de productie
      van fokpluimvee;
      vermeerderingsbedrijf: inrichting die zich toelegt op de productie van broedeieren, bestemd voor de productie van
      gebruikspluimvee;
      opfokbedrijf: ofwel een opfokbedrijf voor fokpluimvee, d.w.z. een inrichting die zich toelegt op het opfokken van
      fokpluimvee tot het voortplantingsstadium,
      ofwel een opfokbedrijf voor gebruikspluimvee, d.w.z. een inrichting die zich toelegt op het opfokken van legkippen
      tot het legstadium;
      kuikenbroederij: inrichting die zich toelegt op het inleggen en uitbroeden van broedeieren en het afleveren van
      eendagskuikens;




                  i.


                  pluimvee


                  :


                  kippen, kalkoenen, parelhoenders, eenden, ganzen, kwartels, duiven, fazanten, patrijzen en loopvogels
      (Ratites), die in gevangenschap worden opgefokt of gehouden voor de fokkerij, voor de productie van vlees of
      consumptie-eieren of om in het wild te worden uitgezet;




                  j.


                  broedeieren


                  :


                  eieren afkomstig van pluimvee, bestemd om te worden bebroed;




                  k.


                  eendagskuikens


                  :


                  pluimvee dat nog géén 72 uur oud is;




                  l.


                  fokpluimvee


                  :


                  pluimvee van 72 uur en ouder, bestemd voor de productie van broedeieren;




                  m.


                  gebruikspluimvee


                  :


                  pluimvee van 72 uur en ouder, dat wordt opgefokt of gehouden voor de productie van vlees of consumptie-
      eieren of om in het wild te worden uitgezet;




                  n.


                  koppel


                  :


                  alle pluimvee met dezelfde gezondheidsstatus dat in hetzelfde lokaal of binnen dezelfde uitloopruimte
      wordt gehouden en dat een epidemiologische eenheid vormt. In batterijen omvat deze term alle dieren die hetzelfde
      omsloten luchtvolume delen;




                  o.


                  legrassen


                  :


                  pluimvee, waarvan de nakomelingen bestemd zijn voor de productie van consumptie-eieren;




                  p.


                  vleesrassen


                  :


                  pluimvee, waarvan de nakomelingen bestemd zijn voor de productie van vlees;




                  q.


                  categorie


                  :


                  onderscheiden generaties pluimvee;




                  r.


                  type


                  :


                  vleesras of legras;




                  s.


                  geslacht


                  :


                  mannelijk of vrouwelijk;




                  t.


                  merk


                  :


                  een door een ondernemer gevoerde commerciële naam, die bij het productschap als zodanig is aangemeld;




                  u.


                  broedeierenstempel


                  :


                  een stempel, vermeldende het nummer waaronder het fokbedrijf of vermeerderingsbedrijf waar de
      broedeieren zijn voortgebracht, bij het productschap is geregistreerd;




                  v.


                  broedmachine


                  :


                  een machine bestemd voor het op kunstmatige wijze uitbroeden van broedeieren;




                  w.


                  afleveren


                  :


                  het verzenden van broedeieren of pluimvee naar een plaats binnen Nederland;




                  x.


                  afleverings- en meldingsformulier broedeieren


                  :


                  document dat een zending broedeieren vergezelt bij het afleveren van broedeieren of document ten
      behoeve van de melding door een ondernemer van de inleg van broedeieren, al dan niet betrokken van een in Nederland
      geregistreerd bedrijf, in diens broedmachine;




                  y.


                  afleverings- en meldingsformulier pluimvee


                  :


                  document dat een zending pluimvee vergezelt bij het afleveren van pluimvee of het document ten behoeve
      van de melding door een ondernemer van de opzet van pluimvee, al dan niet betrokken van een niet in Nederland
      geregistreerd bedrijf, op diens pluimveebedrijf;




                  z.


                  bonnummer


                  :


                  uniek nummer op het afleverings- en meldingsformulier pluimvee;




                  aa.


                  gezondheidscertificaat


                  :


                  een geldig, volledig ingevuld, gedagtekend en ondertekend certificaat als bedoeld in artikel 17 van
      [richtlijn 90/539/EEG](31990L0539) of in bijlage I van Beschikking nr 96/482/EG (PbEG L196);




                  bb.


                  productieperiode


                  :


                  aaneengesloten periode waarin door fok- respectievelijk gebruikspluimvee, broed- respectievelijk
      consumptie-eieren worden geproduceerd.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel1
  - number: '2.1'
    text: |-
      De ondernemer, met uitzondering van de ondernemer die handelt in slachtpluimvee, registreert zich bij het
      productschap.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel2
  - number: '2.2'
    text: |-
      Nadat de betrokken ondernemer naar waarheid opgave heeft gedaan van alle door de voorzitter ten aanzien van de
      registratie verlangde gegevens vindt registratie en toekenning van een registratienummer plaats per ondernemer of
      per pluimveebedrijf.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel2
  - number: '2.3'
    text: De in het tweede lid bedoelde gegevens hebben ten minste betrekking op de volgende gegevens;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel2
  - number: 2.3.a
    text: |-
      de naam, voornamen, geboortedatum en adres van de ondernemer, dan wel wanneer de onderneming door een rechtspersoon
      wordt gedreven de naam en adres van de onderneming;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel2
  - number: 2.3.b
    text: de rechtsvorm en de datum van oprichting van de onderneming;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel2
  - number: 2.3.c
    text: het bedrijfsadres van het (de) pluimveebedrijf(ven);
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel2
  - number: 2.3.d
    text: |-
      het soort, categorie en type pluimvee dat door de desbetreffende onderneming wordt gehouden of verhandeld, alsmede
      overige diersoorten die door de onderneming worden gehouden;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel2
  - number: 2.3.e
    text: het houderijsysteem van de pluimveebedrijven, het aantal stallen en de maximumcapaciteit per stal.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel2
  - number: '2.4'
    text: |-
      De ondernemer die is geregistreerd op basis van de
      [Verordening productie van en handel in broedeieren en levend pluimvee 2003][ref1], wordt geacht tevens te zijn
      geregistreerd conform onderhavige verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0014954
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014954
  - number: '2.5'
    text: |-
      De ondernemer meldt elke wijziging in de geregistreerde gegevens binnen 4 weken nadat het desbetreffende feit of de
      wijziging zich heeft voorgedaan schriftelijk aan de voorzitter.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel2
  - number: '3.1'
    text: |-
      De ondernemer voegt bij het afleveren van broedeieren, andere dan broedeieren afkomstig van duiven, ganzen,
      kwartels, fazanten, patrijzen en loopvogels, een daarop betrekking hebbend afleverings- en meldingsformulier
      broedeieren bij, waarop de volgende gegevens worden vermeld:
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel3
  - number: 3.1.a
    text: de naam of firmanaam, het adres en het registratienummer van het afleverende pluimveebedrijf;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel3
  - number: 3.1.b
    text: de naam of firmanaam, het adres en - voor zover bekend - het registratienummer van het ontvangende pluimveebedrijf;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel3
  - number: 3.1.c
    text: het (de) registratienummer(s) van het (de) bedrijf(-ven) dat (die) de broedeieren heeft (hebben) geproduceerd;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel3
  - number: 3.1.d
    text: het aantal afgeleverde broedeieren onderverdeeld naar soort, categorie, type en geslacht;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel3
  - number: 3.1.e
    text: de afleverdatum;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel3
  - number: 3.1.f
    text: |-
      het (de) bonnummer(s) van het (de) afleverings- en meldingsformulier(en) pluimvee van het (de) betreffende
      koppel(s) dat (die) de broedeieren heeft (hebben) geproduceerd;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel3
  - number: 3.1.g
    text: of sprake is van broedeieren afkomstig van niet in Nederland geregistreerde pluimveebedrijven.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel3
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid, is het de afleverende ondernemer toegestaan om in plaats van het afleverings- en
      meldingsformulier broedeieren een soortgelijk document te gebruiken, dat ten minste de gegevens bevat als genoemd
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel3
  - number: '4.1'
    text: |-
      De ondernemer voegt bij het afleveren van pluimvee, andere dan duiven, ganzen, kwartels, fazanten, patrijzen
      en loopvogels, een daarop betrekking hebbend afleverings- en meldingsformulier pluimvee bij, waarop de volgende
      gegevens worden vermeld:
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel4
  - number: 4.1.a
    text: de naam of firmanaam, het adres en het registratienummer van het afleverende pluimveebedrijf;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel4
  - number: 4.1.b
    text: de naam of firmanaam, het adres en - voor zover bekend - het registratienummer van het ontvangende bedrijf;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel4
  - number: 4.1.c
    text: het bonnummer;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel4
  - number: 4.1.d
    text: het aantal pluimvee onderverdeeld naar soort, categorie, type en geslacht;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel4
  - number: 4.1.e
    text: de geboortedatum van het pluimvee;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel4
  - number: 4.1.f
    text: de afleverdatum;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel4
  - number: 4.1.g
    text: |-
      het (de) bonnummer(s) van het (de) afleverings- en meldingsformulier(en) pluimvee van het (de) betreffende
      koppel(s) dat (die) de broedeieren heeft (hebben) geproduceerd, waaruit het betreffende pluimvee is voortgekomen
      of in geval van afleveringen, anders dan afleveringen van eendagskuikens, het (de) bonnummer(s) van het (de)
      afleverings- en meldingsformulier(en) pluimvee van het (de) betreffende koppel(s), waaruit het betreffende pluimvee
      is voortgekomen;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel4
  - number: 4.1.h
    text: of sprake is van pluimvee afkomstig van niet in Nederland geregistreerde pluimveebedrijven.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel4
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid, is het de afleverende ondernemer toegestaan om in plaats van het afleverings- en
      meldingsformulier pluimvee een soortgelijk document op te stellen, dat ten minste de gegevens bevat als genoemd in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel4
  - number: '5.1'
    text: |-
      De ontvangende ondernemer verzendt binnen 5 werkdagen na de datum van aflevering van het pluimvee als bedoeld in
      [artikel 4][ref1], een afschrift van het conform [artikel 4][ref2] opgestelde afleverings- en meldingsformulier
      pluimvee aan het productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0019280#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019280#Artikel4
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019280
        artikel: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0019280
        artikel: '4'
        paragraaf: '4'
  - number: '5.2'
    text: |-
      De ontvangende ondernemer is gekweten van de in het eerste lid bedoelde verplichting, indien de ondernemer die
      het pluimvee heeft afgeleverd, binnen 5 werkdagen na de datum van aflevering van het pluimvee als bedoeld in
      [artikel 4][ref1], het afschrift van het conform [artikel 4][ref2] opgestelde afleverings- en meldingsformulier
      pluimvee aan het productschap heeft gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0019280#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019280#Artikel4
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019280
        artikel: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0019280
        artikel: '4'
        paragraaf: '4'
  - number: '5.3'
    text: |-
      In afwijking van het eerste en tweede lid, is het de ondernemer toegestaan wekelijks een volledig en naar waarheid
      ingevuld en ondertekend overzicht van de afleveringen pluimvee aan het productschap te zenden, mits dit overzicht
      ten minste de gegevens bevat als genoemd in [artikel 4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019280#Artikel4
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019280
        artikel: '4'
        paragraaf: '4'
  - number: '6'
    text: |-
      De ondernemer die broedeieren, betrokken van niet in Nederland geregistreerde pluimveebedrijven, met uitzondering
      van broedeieren afkomstig van duiven, ganzen, kwartels, fazanten en loopvogels, inlegt in diens broedmachine, meldt
      deze broedeieren binnen 5 werkdagen na aflevering bij het productschap aan door middel van het toezenden van een
      volledig en naar waarheid ingevuld en ondertekend afleverings- en meldingsformulier broedeieren, dan wel van een
      afschrift van het op de broedeieren betrekking hebbende gezondheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel6
  - number: '7'
    text: |-
      De ondernemer die pluimvee, betrokken van niet in Nederland geregistreerde pluimveebedrijven, met uitzondering
      van duiven, ganzen, kwartels, fazanten, patrijzen en loopvogels, opzet, meldt het pluimvee binnen 5 werkdagen na
      aflevering bij het productschap door middel van het inzenden van een afschrift van het volledig en naar waarheid
      ingevuld en ondertekend afleverings- en meldingsformulier pluimvee.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel7
  - number: '8'
    text: |-
      Een koppel pluimvee, andere dan duiven, ganzen, kwartels, fazanten, patrijzen en loopvogels, dat meer dan één
      productieperiode wordt ingezet, wordt binnen 5 werkdagen na het begin van de nieuwe productieperiode door de
      ondernemer bij het productschap aangemeld door middel van het toezenden van een door de ondernemer ondertekend
      document waarin ten minste de volgende gegevens worden vermeld:
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel8
  - number: 8.a
    text: de naam of firmanaam, het adres en het registratienummer van het pluimveebedrijf;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel8
  - number: 8.b
    text: het aantal onderverdeeld naar soort, categorie, type en geslacht;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel8
  - number: 8.c
    text: de geboortedata van het pluimvee; en de
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel8
  - number: 8.d
    text: datum van het begin van de nieuwe productieperiode.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel8
  - number: '9.1'
    text: |-
      In afwijking van het bepaalde in de [artikelen 5][ref1] en [7][ref2] kan de voorzitter op verzoek van de
      ondernemer op elektronische wijze een afleverings- en meldingsformulier pluimvee aan de ondernemer verstrekken ter
      invulling en verzending.


      [ref1]: https://wetten.overheid.nl/BWBR0019280#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019280#Artikel7
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019280
        artikel: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0019280
        artikel: '7'
        paragraaf: '5'
  - number: '9.2'
    text: Het bestuur stelt bij besluit regels vast omtrent de in het vorige lid bedoelde wijze van melding.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel9
  - number: '9.3'
    text: Het in het tweede lid bedoelde besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel9
  - number: '10'
    text: |-
      De ondernemer bewaart een afschrift van de documenten en afleverings- en meldingsformulieren broedeieren en
      -pluimvee ten minste drie jaar te rekenen vanaf de datum van ondertekening.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel10
  - number: '11.1'
    text: |-
      Het toezicht op de naleving van de bij of krachtens deze verordening gestelde voorschriften wordt namens het
      productschap uitgeoefend door personen en instanties die hiervoor door het bestuur bij besluit zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel11
  - number: '11.2'
    text: 'Ondernemers zijn verplicht:'
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel11
  - number: 11.2.a
    text: |-
      aan de door het bestuur aangewezen personen en instanties al die gegevens te verstrekken of te doen verstrekken,
      die naar hun oordeel nodig zijn voor de vervulling van hun taak;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel11
  - number: 11.2.b
    text: |-
      aan de door het bestuur aangewezen personen en instanties inzage te geven of te doen geven van die boeken en
      bescheiden, die naar hun oordeel nodig zijn voor de vervulling van hun taak;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel11
  - number: 11.2.c
    text: |-
      aan de door het bestuur aangewezen personen en instanties te allen tijde toegang te geven of te doen geven tot de
      bedrijfsruimten en tot die plaatsen of vervoermiddelen, waar respectievelijk waarin voorraden, tot het bedrijf van
      de ondernemer behorende, zijn opgeslagen respectievelijk worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel11
  - number: 11.2.d
    text: |-
      voor het overige alle medewerking te verlenen ter vervulling van de aan de door het bestuur aangewezen personen en
      instanties opgedragen toezichtstaak.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel11
  - number: '11.3'
    text: |-
      De in het eerste lid bedoelde personen zijn bevoegd berechtingsrapporten ten behoeve van tuchtrechtelijke
      afhandeling op te maken.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel11
  - number: '11.4'
    text: Het besluit bedoeld in het eerste lid wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel11
  - number: '12'
    text: |-
      Het bij of krachtens deze verordening bepaalde is mede bindend voor natuurlijke en rechtspersonen, die geen
      ondernemers zijn, voor zover deze bedrijfsmatig handelingen verrichten, die in ondernemingen van ondernemers plegen
      te worden verricht.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel12
  - number: '13.1'
    text: |-
      Met de registratie van ondernemers en de identificatie en registratie van levend pluimvee en eieren worden gegevens
      verzameld die nodig zijn voor de goede vervulling van de taak van het productschap.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel13
  - number: '13.2'
    text: |-
      Uit hoofde van deze verordening verkregen gegevens omtrent ondernemingen worden slechts verstrekt aan derden voor
      zover zulks in overeenstemming is met de [artikelen 8][ref1] en [9 van de Wet bescherming persoonsgegevens][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel9
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '9'
  - number: '14'
    text: |-
      Op overtreding van het bepaalde in de [artikelen 2 tot en met 10][ref1] en
      [11, tweede lid][ref2], worden tuchtrechtelijke maatregelen gesteld zoals voorzien in
      [artikel 2 van de Wet tuchtrechtspraak bedrijfsorganisatie 2004][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019280#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019280#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0016341#Artikel2
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0019280
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019280
        artikel: '11'
        paragraaf: '9'
      - id: ref3
        bwb_id: BWBR0016341
        artikel: '2'
  - number: '15.2'
    text: |-
      Verwijzingen naar de in het eerste lid genoemde bepalingen gelden als verwijzingen naar de onderhavige verordening
      volgens de concordantietabel in de bijlage.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel15
  - number: '16.1'
    text: |-
      Deze verordening wordt aangehaald als: Verordening identificatie en registratie van pluimveebedrijven, broedeieren
      en levend pluimvee (PPE) 2005.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel16
  - number: '16.2'
    text: |-
      Deze verordening treedt in werking met ingang van de tweede dag na de dag van dagtekening van het Verordeningenblad
      Bedrijfsorganisatie waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0019280/2006-06-11#Artikel16
