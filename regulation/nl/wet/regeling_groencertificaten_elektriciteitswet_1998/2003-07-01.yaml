  - number: '4'
    text: |-
      1 De producent van duurzame elektriciteit stelt de netbeheerder in staat de vaststelling en het onderzoek, bedoeld
      in [artikel 2][ref1], te verrichten en stelt de netbeheerder dan wel het gecertificeerd meetbedrijf in staat de
      hoeveelheid duurzame elektriciteit te meten die met zijn installatie is opgewekt en op het net is ingevoed.

      2 Indien zich een omstandigheid voordoet die van belang is voor de bepaling hoeveel duurzame elektriciteit is
      opgewekt en op het net is ingevoed, meldt de producent die omstandigheid en het tijdstip waarop deze zich voordeed
      binnen twee weken aan de netbeheerder.


