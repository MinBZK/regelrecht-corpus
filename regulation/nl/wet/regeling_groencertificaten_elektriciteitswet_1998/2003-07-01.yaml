  - number: 7b
    text: |-
      1 Met betrekking tot duurzame elektriciteit die op een installatie wordt ingevoed, is deze regeling van
      overeenkomstige toepassing, met uitzondering van de [artikelen 6, vijfde en zesde lid][ref1], en [7a][ref2].

      2 Nadat een groencertificaat voor niet-netlevering is gebruikt om het voorschot, bedoeld in
      [artikel 72w, tweede lid, van de wet][ref3] te ontvangen, boekt de netbeheerder van het landelijk hoogspanningsnet
      het certificaat af van de groencertificatenrekening.


