  - number: '5'
    text: |-
      De netbeheerder deelt op verzoek van de Belastingdienst de meetgegevens mee die voor de Belastingdienst van belang
      zijn voor het uitoefenen van haar taak.
    url: https://wetten.overheid.nl/BWBR0012463/2003-07-01#Artikel5
  - number: '6'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet opent op verzoek van een producent, afnemer, leverancier of
      handelaar een groencertificatenrekening.

      2 De producent deelt bij het verzoek de uitkomst van het onderzoek, verkregen overeenkomstig [artikel 2][ref1], mee
      aan de netbeheerder van het landelijk hoogspanningsnet.

      3 De netbeheerder van het landelijk hoogspanningsnet boekt op verzoek groencertificaten op een
      daarbij aangegeven groencertificatenrekening, indien een in Nederland gevestigde producent of zijn
      gemachtigde bij het verzoek de meetgegevens omtrent duurzame elektriciteit, ontvangen overeenkomstig
      [artikel 16a, tweede en derde lid, van de wet][ref2], overlegt: en verklaart dat de desbetreffende hoeveelheid
      elektriciteit niet reeds in Nederland of in andere landen op enigerlei wijze als duurzame elektriciteit is verkocht
      of daarvoor een vergoeding is ontvangen.

      4 Een groencertificaat heeft betrekking op duurzame elektriciteit die in Nederland is geproduceerd na 1 juli 2001.

      5 De netbeheerder van het landelijk hoogspanningsnet boekt op verzoek van degene aan wie groencertificaten
      toekomen, een bij het verzoek aan te geven hoeveelheid groencertificaten over op een daarbij aangegeven andere
      groencertificatenrekening.

      6 Een groencertificaat verliest zijn geldigheid uiterlijk één jaar na de datum van boeking op grond van het derde
      lid en van [artikel 7a, eerste lid][ref3], dan wel nadat het groencertificaat is gebruikt voor toepassing van
      [artikel 36i van de Wet belastingen op milieugrondslag][ref4]. Nadat een groencertificaat zijn geldigheid heeft
      verloren, wordt het afgeboekt van de groencertificatenrekening.

      7 De netbeheerder van het landelijk hoogspanningsnet brengt de kosten van het beheer van de
      groencertificatenrekening in rekening bij degene die het verzoek, bedoeld in het eerste lid, doet.


      [ref1]: https://wetten.overheid.nl/BWBR0012463#Artikel2
