  - number: '8'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet deelt iedere maand aan de Minister van Economische Zaken
      mee, voor welke hoeveelheid duurzame elektriciteit overeenkomstig de [artikelen 6, derde lid][ref1], en
      [7a, eerste lid][ref2], groencertificaten zijn geboekt en overeenkomstig [artikel 6, zesde lid][ref3], zijn
      afgeboekt, alsmede op welke wijze de duurzame elektriciteit waarop die groencertificaten betrekking hebben, is
      opgewekt.


