  - number: '7'
    text: |-
      1 De producent die met behulp van naar haar aard zuivere biomassa duurzame elektriciteit opwekt en op het
      net invoedt, draagt er zorg voor dat een daartoe bevoegde instantie ten minste een keer per kalenderjaar een
      steekproef uitvoert met behulp van een daartoe geëigende methode waarbij zonodig aan de hand van bemonstering wordt
      vastgesteld of het materiaal waaruit de duurzame elektriciteit wordt opgewekt, is aan te merken als naar haar aard
      zuivere biomassa en wat de aard en de verhouding van de in de installatie verwerkte brandstoffen zijn.

      2 De producent die met behulp van naar zijn aard zuiver biogas duurzame elektriciteit opwekt en op het net
      invoedt, draagt er zorg voor dat een daartoe bevoegde instantie ten minste een keer per twee kalenderjaren een
      steekproef uitvoert met behulp van een daartoe geëigende methode waarbij zonodig aan de hand van bemonstering wordt
      vastgesteld of het materiaal waaruit de duurzame elektriciteit wordt opgewekt, is aan te merken als naar zijn aard
      zuiver biogas en wat de aard en de verhouding van de in de installatie verwerkte brandstoffen zijn.

      3 De netbeheerder van het landelijk hoogspanningsnet bepaalt de tijdstippen waarop de in de vorige twee leden
      bedoelde steekproeven worden uitgevoerd en deelt deze tijdig aan de producent of zijn gemachtigde mee.

      4 Bevoegde instanties als bedoeld in het eerste en tweede lid zijn de instanties die vermeld zijn op een door
      de Minister van Economische Zaken op te stellen lijst van instanties, die onafhankelijk zijn van producenten van
      elektriciteit en die naar zijn oordeel in staat zijn de steekproeven, bedoeld in het eerste en tweede lid, uit te
      voeren. Indien een instantie niet op de lijst is opgenomen, kan degene die het in [artikel 6, derde lid][ref1],
      bedoelde verzoek doet de Minister van Economische Zaken verzoeken de instantie op de lijst te plaatsen. De Minister
      van Economische Zaken plaatst een instantie op de lijst, indien die instantie voldoet aan de vereisten, genoemd in
      de eerste volzin.

      5 De instantie brengt de kosten van de steekproef in rekening bij de producent en deelt het resultaat van de
      steekproef ten hoogste vier weken na het moment waarop de monsterneming in het kader van de steekproef heeft
      plaatsgevonden mee aan de netbeheerder van het landelijk hoogspanningsnet en aan de producent of zijn gemachtigde.

      6 Indien geen steekproef wordt uitgevoerd op het tijdstip, bedoeld in het derde lid, dan wel indien uit de
      steekproef blijkt dat de biomassa niet aangemerkt kan worden als naar haar aard zuivere biomassa of naar zijn
      aard zuiver biogas, wordt de elektriciteit, opgewekt in de periode waarop de op het moment van uitvoering van de
      steekproef geldende verklaring, bedoeld in de [artikelen 6a, eerste en zesde lid][ref2], en [6b][ref3], betrekking
      heeft, aangemerkt als niet-duurzaam. De netbeheerder van het landelijk hoogspanningsnet boekt ten onrechte geboekte
      groencertificaten af van de groencertificatenrekening van de desbetreffende producent.

      7 Indien zich een geval voordoet als bedoeld in het vorige lid, is vanaf het moment waarop het resultaat van de
      steekproef op grond van het vijfde lid is meegedeeld aan de netbeheerder van het landelijk hoogspanningsnet en aan
      de producent of zijn gemachtigde [artikel 6a][ref4] van toepassing ten aanzien van de desbetreffende producent.

      8 De netbeheerder van het landelijk hoogspanningsnet meldt de toepasselijkheid van het zesde en zevende lid aan de
      desbetreffende producent of zijn gemachtigde en aan de Belastingdienst.


