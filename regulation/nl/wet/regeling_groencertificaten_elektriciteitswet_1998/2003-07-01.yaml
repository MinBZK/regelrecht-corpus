  - number: 7a
    text: |-
      1 Op verzoek van een afnemer, leverancier of handelaar of diens gemachtigde boekt de netbeheerder van het landelijk
      hoogspanningsnet groencertificaten op een bij het verzoek aangegeven groencertificatenrekening, indien die afnemer,
      leverancier, handelaar of gemachtigde bij het verzoek de meetgegevens alsmede gegevens omtrent de categorie
      productie-installatie overlegt met betrekking tot duurzame elektriciteit die uit een ander land afkomstig is en die
      op het Nederlandse net is ingevoed, mits de betrouwbaarheid van die gegevens is gewaarborgd.

      2 De betrouwbaarheid van de gegevens, bedoeld in het eerste lid, is gewaarborgd, indien de gegevens zijn verkregen
      van een of meer in het desbetreffende land tot afgeven van die gegevens bevoegde instanties. Een instantie wordt
      aangemerkt als bevoegde instantie, indien zij onafhankelijk is van producenten en leveranciers van elektriciteit en
      zij in het land van vestiging bevoegd is tot het meten van de opwekking of de afname van elektriciteit.

      3 De Minister van Economische Zaken stelt een lijst op van bevoegde instanties, waarop in ieder geval zijn
      opgenomen die instanties die voor het afgegeven van de gegevens, bedoeld in het eerste lid, zijn aangewezen
      of erkend door de overheid van het land van vestiging, door de Raad voor Accreditatie of in het kader van de
      organisatie ‘Renewable energy certificate system’. Indien een instantie niet op de lijst is opgenomen, kan degene
      die het in het eerste lid bedoelde verzoek doet de Minister van Economische Zaken verzoeken de instantie op de
      lijst te plaatsen. De Minister van Economische Zaken plaatst een instantie op de lijst, indien die instantie
      voldoet aan de vereisten, genoemd in het tweede lid, tweede volzin.

      4 De afnemer, leverancier, handelaar of diens gemachtigde doet het verzoek, bedoeld in het eerste lid, binnen een
      maand na verkrijging van de gegevens, bedoeld in dat lid.

      5 Bij zijn verzoek verklaart de afnemer, leverancier, handelaar of diens gemachtigde dat de duurzame elektriciteit
      waarvoor overeenkomstig het eerste lid boeking van groencertificaten wordt verzocht, niet in het land van productie
      of in andere landen op enigerlei wijze als duurzame elektriciteit is verkocht of daarvoor een vergoeding is
      ontvangen.

      6 De [artikelen 6a tot en met 7][ref1] zijn van overeenkomstige toepassing ten aanzien van duurzame elektriciteit,
      afkomstig uit een ander land dan Nederland, met inachtneming van het achtste lid en met dien verstande dat:

      a. onder ‘producent’ in de [artikelen 6a tot en met 7][ref2] mede verstaan wordt: afnemer, leverancier, handelaar
      of diens gemachtigde;

      b. onder ‘verzocht op grond van [artikel 6, derde lid][ref3]’ in de [artikelen 6a tot en met 7][ref4] mede verstaan
      wordt: verzocht op grond van [artikel 7a, eerste lid][ref5];

      c. voor de toepassing van het begrip naar haar aard zuivere biomassa met de NTA 8003 wordt gelijkgesteld een norm
      die toepasselijk in een andere lidstaat van de Europese Unie of in een staat die partij is bij de overeenkomst
      inzake de Europese Economische Ruimte en die ten minste een gelijk beschermingsniveau biedt.

      7 De elektriciteit is op het Nederlandse net ingevoed, indien de afnemer, leverancier, handelaar of
      gemachtigde bij het verzoek, bedoeld in het eerste lid, aangeeft dat hij voldoende transportcapaciteit op het
      landsgrensoverschrijdende net heeft verkregen om de duurzame elektriciteit waarop het groencertificaat betrekking
      heeft, te transporteren naar Nederland. De netbeheerder van het landelijk hoogspanningsnet gaat na of de
      transportcapaciteit gebruikt is om de desbetreffende hoeveelheid elektriciteit naar Nederland te transporteren.

      8 De Minister van Economische Zaken stelt ten aanzien van duurzame elektriciteit opgewekt met behulp van biomassa,
      afkomstig uit een ander land dan Nederland, voor de toepassing van de [artikelen 6a][ref6] en [7][ref7] een lijst
      op van instanties, die onafhankelijk zijn van producenten en leveranciers van elektriciteit en in het land van
      vestiging bevoegd zijn met behulp van een daartoe geëigende methode aan de hand van bemonstering vast te stellen
      of het materiaal waaruit de duurzame elektriciteit wordt opgewekt, is aan te merken als zuivere biomassa, dan wel
      wat het biologisch afbreekbare gedeelte is van de niet-zuivere biomassa waaruit de duurzame elektriciteit wordt
      opgewekt. Indien een instantie niet op de lijst is opgenomen, kan degene die het in het eerste lid bedoelde verzoek
      doet de Minister van Economische Zaken verzoeken de instantie op de lijst te plaatsen. De Minister van Economische
      Zaken plaatst een instantie op de lijst, indien die instantie voldoet aan de vereisten, genoemd in de eerste
      volzin.


