  - number: '3'
    text: |-
      1 Vanaf de eerste dag van de kalendermaand waarin de producent het verzoek, bedoeld in
      [artikel 2, eerste lid][ref1], bij de netbeheerder heeft ingediend, beschouwt de netbeheerder
      dan wel het gecertificeerd meetbedrijf de overeenkomstig de voorwaarden, bedoeld in
      [artikel 31, eerste lid, onderdeel b, van de wet][ref2], gemeten hoeveelheid elektriciteit die de producent
      met zijn installatie opwekt en op het net invoedt, als duurzame elektriciteit, voor zover de netbeheerder
      overeenkomstig [artikel 2][ref3] heeft vastgesteld dat de installatie van de producent geschikt is voor de
      opwekking van duurzame elektriciteit en dat de meetinrichting geschikt is om de hoeveelheid op het net ingevoede
      duurzame elektriciteit te meten.

      2 Bij installaties met een aansluitwaarde groter dan 3 x 80 A geschiedt de meting van de hoeveelheid opgewekte en
      op het net ingevoede duurzame elektriciteit iedere kalendermaand. Bij installaties met een aansluitwaarde gelijk
      aan of kleiner dan 3 x 80 A geschiedt de meting gelijktijdig met de jaarlijkse bepaling van de meterstanden,
      tenzij de producent de netbeheerder dan wel het gecertificeerd meetbedrijf verzoekt iedere kalendermaand te meten.
      De netbeheerder verdeelt de op grond van de jaarlijkse bepaling van de meterstanden verkregen meetgegevens van
      installaties met een aansluitwaarde gelijk aan of kleiner dan 3 x 80 A in gelijke delen over de twaalf voorafgaande
      kalendermaanden, tenzij de desbetreffende producent aantoont dat deze meetgegevens op een andere wijze over de
      twaalf voorafgaande kalendermaanden verdeeld moeten worden.

      3 Indien de installatie van de producent voor de opwekking van duurzame elektriciteit gebruik maakt van
      elektriciteit die is afgenomen van een net, brengt de netbeheerder dan wel het gecertificeerd meetbedrijf voor
      de bepaling van de hoeveelheid duurzame elektriciteit die op het net is ingevoed, de hoeveelheid elektriciteit
      die daarvoor is afgenomen van het net in mindering op de hoeveelheid duurzame elektriciteit die hij op grond van
      [artikel 16, eerste lid, onderdeel i, van de wet][ref4] meet.

      4 Tenzij de tariefstructuren, bedoeld in [artikel 27 van de wet][ref5], iets anders bepalen, brengt de netbeheerder
      de kosten van het vaststellen of de installatie en de meetinrichting van de producent geschikt zijn voor de
      opwekking en de meting van duurzame elektriciteit in rekening bij de producent en brengt de netbeheerder dan wel
      het gecertificeerd meetbedrijf de kosten van het meten van de hoeveelheid duurzame elektriciteit in rekening bij
      de producent.


