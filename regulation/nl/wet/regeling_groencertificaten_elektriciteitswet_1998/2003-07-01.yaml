  - number: 6a
    text: |-
      1 Indien de duurzame elektriciteit waarvoor boeking van groencertificaten wordt verzocht op grond van
      [artikel 6, derde lid][ref1], wordt opgewekt met behulp van zuivere biomassa, overlegt de producent of zijn
      gemachtigde iedere zes kalendermaanden ten hoogste een maand voor aanvang van deze zes kalendermaanden een
      verklaring dat hij met behulp van een daartoe geëigende methode aan de hand van bemonstering per partij vaststelt
      dat het materiaal waaruit de duurzame elektriciteit wordt opgewekt, is aan te merken als zuivere biomassa. De
      verklaring wordt overgelegd aan de netbeheerder van het landelijk hoogspanningsnet met gebruikmaking van het
      origineel van een ondertekend formulier, dat is opgenomen in de bij deze regeling behorende [bijlage 2][ref2].

      2 Indien de duurzame elektriciteit waarvoor boeking van groencertificaten wordt verzocht op grond van
      [artikel 6, derde lid][ref3], wordt opgewekt met behulp van door de producent gewonnen, niet naar zijn aard zuiver
      biogas, hanteert de producent of zijn gemachtigde ten aanzien van de grondstof die bij het ontstaan van dit biogas
      gebruikt wordt, een daartoe geëigende methode om aan de hand van bemonstering per partij vast te stellen dat het
      materiaal waaruit de duurzame elektriciteit is opgewekt, is aan te merken als zuivere biomassa.

      3 Indien de duurzame elektriciteit waarvoor boeking van groencertificaten wordt verzocht op grond van
      [artikel 6, derde lid][ref4], wordt opgewekt met behulp van niet-zuivere biomassa, overlegt de producent of
      zijn gemachtigde iedere zes kalendermaanden ten hoogste een maand voor aanvang van deze zes kalendermaanden een
      verklaring dat hij met behulp van een daartoe geëigende methode aan de hand van bemonstering per partij vaststelt
      wat het biologisch afbreekbare gedeelte is van de niet-zuivere biomassa waaruit de duurzame elektriciteit
      wordt opgewekt. De verklaring wordt overgelegd aan de netbeheerder van het landelijk hoogspanningsnet met
      gebruikmaking van het origineel van een ondertekend formulier, dat is opgenomen in de bij deze regeling behorende
      [bijlage 2][ref5].

      4 Indien de duurzame elektriciteit, waarvoor boeking van groencertificaten wordt verzocht op grond van
      [artikel 6, derde lid][ref6], wordt opgewekt met behulp van door de producent gewonnen, niet-zuiver biogas,
      hanteert de producent of zijn gemachtigde ten aanzien van de grondstof die bij het ontstaan van dit biogas gebruikt
      wordt, een daartoe geëigende methode om aan de hand van bemonstering per partij vast te stellen wat het biologisch
      afbreekbare gedeelte is van de niet-zuivere biomassa waaruit de duurzame elektriciteit wordt opgewekt.

      5 De methode van vaststelling, bedoeld in het eerste tot en met het vierde lid, wordt geacht geëigend te zijn als
      de producent ter zake van de werkzaamheden voor de bepaling van het biologisch afbreekbare gedeelte van de zuivere
      dan wel niet-zuivere biomassa beschikt over een productcertificaat als bedoeld in de Kiwa-beoordelingsrichtlijn
      BRL-K 10016 voor de vaststelling van het aandeel biomassa in secundaire brandstoffen, dan wel over een schriftelijk
      bewijs dat hij voldoet aan vergelijkbare procesnormen als vastgelegd in de Kiwa-beoordelingsrichtlijn BRL-K 10016.

      6 Steeds wanneer de producent voornemens is andere materialen in zijn installatie te verwerken dan in de verklaring
      zijn opgenomen, overlegt hij ten hoogste een maand voordat hij deze andere materialen daadwerkelijk verwerkt een
      nieuwe verklaring. De in het eerste en het derde lid bedoelde periode van zes kalendermaanden wordt in dit geval
      geacht aan te vangen op het moment dat de producent de in de vorige volzin bedoelde andere materialen daadwerkelijk
      verwerkt.


