        artikel: '31'
  - number: '2'
    text: |-
      1 Een in Nederland gevestigde producent van duurzame elektriciteit verzoekt de netbeheerder vast te stellen of
      zijn productie-installatie geschikt is voor de opwekking van duurzame elektriciteit alsmede of de meetinrichting
      geschikt is voor de meting van de elektriciteit die met de productie-installatie wordt opgewekt en op het net
      ingevoed, met gebruikmaking van het origineel van een ondertekend formulier, dat is opgenomen in de bij deze
      regeling behorende [bijlage 1][ref1].

      2 Naar aanleiding van het verzoek stelt de netbeheerder vast of de installatie geschikt is voor de opwekking van
      duurzame elektriciteit en of de meter geschikt is om de hoeveelheid op het net ingevoede duurzame elektriciteit te
      meten, door een administratief onderzoek in te stellen naar de installatie en de aansluiting daarvan op het net.

      3 De netbeheerder kan in aanvulling op het administratief onderzoek en ter verificatie van de in het formulier
      opgenomen gegevens de installatie van de producent onderzoeken om te bepalen welk gedeelte van de totale
      hoeveelheid door de installatie opgewekte en op het net ingevoede elektriciteit kan worden aangemerkt als duurzame
      elektriciteit.

      4 De netbeheerder deelt het resultaat van de vaststelling binnen vier weken na ontvangst van het verzoek, bedoeld
      in het eerste lid, mee aan de producent en aan de netbeheerder van het landelijk hoogspanningsnet.


      [ref1]: https://wetten.overheid.nl/BWBR0012463
    url: https://wetten.overheid.nl/BWBR0012463/2003-07-01#Artikel2
