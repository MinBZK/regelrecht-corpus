  - number: 6c
    text: |-
      1 Indien de duurzame elektriciteit waarvoor boeking van groencertificaten wordt verzocht op grond van
      [artikel 6, derde lid][ref1], is opgewekt met behulp van biomassa, deelt de producent of zijn gemachtigde met
      betrekking tot de periode, bedoeld in [artikel 3, tweede lid][ref2], die voorafgaat aan het tijdstip waarop het
      verzoek wordt gedaan, bij het verzoek mee, voor zover van toepassing, welk gewogen percentage van de door zijn
      installatie opgewekte totale hoeveelheid elektriciteit is opgewekt met behulp van:

      a. zuivere biomassa;

      b. niet-zuivere biomassa, waarbij hij een onderscheid maakt in het biologisch afbreekbare gedeelte en het niet
      biologisch afbreekbare gedeelte;

      c. overige brandstoffen.

      2 Indien de duurzame elektriciteit, waarvoor boeking van groencertificaten wordt verzocht op grond van
      [artikel 6, derde lid][ref3], is opgewekt met behulp van niet-zuivere biomassa in een afvalverbrandingsinstallatie,
      gaat de netbeheerder van het landelijk hoogspanningsnet er van uit dat een jaarlijks door Onze Minister vast te
      stellen percentage van de totale hoeveelheid door die installatie opgewekte elektriciteit duurzame elektriciteit
      is. Het vorige lid is in dit geval niet van toepassing.

      3 De netbeheerder van het landelijk hoogspanningsnet geeft op groencertificaten, geboekt ten behoeve van duurzame
      elektriciteit opgewekt met behulp van biomassa, aan met behulp van welke soorten biomassa de desbetreffende
      duurzame elektriciteit is opgewekt.


