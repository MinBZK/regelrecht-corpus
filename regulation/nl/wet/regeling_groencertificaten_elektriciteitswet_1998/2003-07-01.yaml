preamble:
  text: |-
    Gelet op de artikelen 16, eerste lid, onderdeel h, en 31, zevende lid, van de Elektriciteitswet 1998;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012463/2003-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a

                *wet:*


                [Elektriciteitswet 1998][ref1];



              b

                *gecertificeerd meetbedrijf:*


                een meetbedrijf, niet zijnde een netbeheerder, dat op grond van de voorwaarden, bedoeld in
      [artikel 31, eerste lid, onderdeel b, van de wet][ref2], is toegelaten tot het verrichten van de in die voorwaarden
      neergelegde werkzaamheden en dat de hoeveelheid elektriciteit meet die afkomstig is van een productie-installatie;



              c

                *groencertificaat voor niet-netlevering:*


                gegevens op een groencertificatenrekening, waarmee wordt aangetoond dat een in Nederland gevestigde
      producent met zijn installatie een hoeveelheid duurzame elektriciteit die een meervoud is van 1 MWh heeft opgewekt
      en op een installatie heeft ingevoed;



              d

                *groencertificaat:*


                gegevens op een groencertificatenrekening, waarmee wordt aangetoond dat een producent met zijn
      installatie een hoeveelheid duurzame elektriciteit die een meervoud is van 1 MWh heeft opgewekt en op het net heeft
      ingevoed;



              e

                *groencertificatenrekening:*


                rekening in het systeem van elektronische gegevensverwerking dat in stand wordt gehouden door de
      netbeheerder van het landelijk hoogspanningsnet en waarmee wordt bijgehouden voor welke hoeveelheid duurzame
      elektriciteit groencertificaten zijn verstrekt en aan wie de groencertificaten op enig moment toekomen;



              f

                *zuivere biomassa:*


                producten, afvalstoffen en residuen van de landbouw – met inbegrip van plantaardige en dierlijke
      stoffen –, de bosbouw en aanverwante bedrijfstakken die geheel biologisch afbreekbaar zijn, alsmede industrieel en
      huishoudelijk afval dat geheel biologisch afbreekbaar is;



              g
              NTA 8003:

                de Nederlandse Technische Afspraak 8003, Classificatie van biomassa voor energietoepassing, uitgegeven
      door het Nederlands Normalisatie-Instituut, zoals deze luidde in maart 2001;



              h
              naar haar aard zuivere biomassa:

                de zuivere biomassa opgenomen in het classificatie-overzicht van de NTA 8003, met uitzondering van de
      zuivere biomassa met groepsnummer 701, 709, 729 of 890;



              i
              naar zijn aard zuiver biogas:

                stortgas, rioolwaterzuiveringsgas en biogas dat is ontstaan door inwerking van micro-organismen op
      biologisch afbreekbare materialen;



              j
               partij:

                de op basis van één specificatie geleverde hoeveelheid materiaal die voor controle op het aandeel
      onvermijdbare kunststoffen en ander materiaal van langcyclisch organische oorsprong door de producent, die met
      behulp van het materiaal elektriciteit opwekt, gedurende een door hem vastgestelde periode als eenheid wordt
      aangemerkt en als zodanig identificeerbaar is;



              k
              niet-zuivere biomassa:

                biomassa, niet zijnde zuivere biomassa;



              l
              afvalverbrandingsinstallatie:

                de productie-installatie waarin al dan niet de opgewekte warmte wordt teruggewonnen en die uitsluitend of
      in hoofdzaak bestemd is voor:
                de verbranding door oxidatie van afvalstoffen;
      een andere thermische behandeling van afvalstoffen dan bedoeld onder 1° ingeval de producten daarvan vervolgens
      worden verbrand, of
      de verbranding van producten die voorkomen uit thermische behandeling van afvalstoffen;



              m
              installatie voor de opwekking van elektriciteit met behulp van windenergie op zee:

                installatie waarin elektriciteit wordt opgewekt met behulp van windenergie, die is opgericht in de
      territoriale zee of in de exclusieve economische zone;



              n
              installatie voor de opwekking van elektriciteit met behulp van windenergie op land:

                installatie waarin elektriciteit wordt opgewekt met behulp van windenergie, niet zijnde een installatie
      als bedoeld in onderdeel m.




      2 Voor de toepassing van het eerste lid, onderdeel f, worden producten, afvalstoffen en residuen van de landbouw –
      met inbegrip van plantaardige en dierlijke stoffen –, de bosbouw en aanverwante bedrijfstakken, alsmede industrieel
      en huishoudelijk afval met een aandeel onvermijdbare kunststoffen en ander materiaal van langcyclisch organische
      oorsprong van ten hoogste drie massaprocent per partij geacht geheel biologisch afbreekbaar te zijn.


