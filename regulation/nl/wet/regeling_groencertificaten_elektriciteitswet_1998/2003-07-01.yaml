  - number: 6d
    text: |-
      1 De producent of zijn gemachtigde zendt telkens binnen dertien weken na de periode van zes kalendermaanden, die
      aanvangt op 1 januari en eindigt op 30 juni en de periode van zes kalendermaanden die aanvangt op 1 juli en eindigt
      op 31 december, aan de netbeheerder van het landelijk hoogspanningsnet een verklaring van een accountant, die
      betrekking heeft op de voorafgaande periode van zes kalendermaanden.

      2 De accountantsverklaring heeft geen betrekking op de periode, bedoeld in [artikel 7, zesde lid][ref1].

      3 Uit de accountantsverklaring blijkt eenduidig:

      a. wat de aard en de verhouding van de in de installatie verwerkte brandstoffen zijn;

      b. of de door de producent of zijn gemachtigde op grond van [artikel 6c, eerste lid][ref2], meegedeelde percentages
      overeenstemmen met de verhouding van de onder a bedoelde brandstoffen;

      c. of uit de administratie van de producent of uit andere de accountant ter beschikking staande gegevens volgt dat
      er gedurende de afgelopen periode van zes kalendermaanden in overeenstemming is gehandeld met de op grond van de
      [artikelen 6a, eerste, derde en zesde lid][ref3], en [6b][ref4] overgelegde verklaringen.

      4 Ten aanzien van het bepaalde in het vorige lid, onderdeel b, gaat de accountant, voor zover van toepassing, na
      of de in [artikel 6a][ref5] bedoelde geëigende methode voor de vaststelling of het in de installatie verwerkte
      materiaal als zuivere biomassa kan worden aangemerkt dan wel welk gedeelte van de in de installatie verwerkte niet-
      zuivere biomassa biologisch afbreekbaar is, op een juiste wijze is toegepast voor zover dit betrekking heeft op de
      berekening die volgt uit de toepassing van de methode op de onder b genoemde gegevens.

      5 Indien de overeenkomstig [artikel 6c, eerste lid][ref6], meegedeelde percentages afwijken van de percentages die
      uit de accountantsverklaring blijken, corrigeert de netbeheerder van het landelijk hoogspanningsnet het ten gevolge
      van deze afwijking ontstane verschil in de hoeveelheid groencertificaten door groencertificaten bij te boeken op
      dan wel af te boeken van de groencertificatenrekening van de desbetreffende producent.

      6 Indien uit de accountantsverklaring blijkt dat de producent in de periode, bedoeld in het
      tweede lid, onderdeel c, niet in overeenstemming heeft gehandeld met zijn op grond van de
      [artikelen 6a, eerste, derde en zesde lid][ref7], en [6b][ref8] overgelegde verklaringen, wordt de in de
      desbetreffende periode opgewekte elektriciteit aangemerkt als niet-duurzaam. De netbeheerder van het landelijk
      hoogspanningsnet boekt ten onrechte geboekte groencertificaten af van de groencertificatenrekening van de
      desbetreffende producent.

      7 Indien geen accountantsverklaring binnen de termijn, genoemd in het eerste lid, wordt overgelegd, dan wel
      indien de accountantsverklaring niet voldoet aan de vereisten, bedoeld in het derde en vierde lid, wordt de in
      de desbetreffende periode opgewekte elektriciteit aangemerkt als niet-duurzaam. De netbeheerder van het landelijk
      hoogspanningsnet boekt ten onrechte geboekte groencertificaten af van de groencertificatenrekening van de
      desbetreffende producent.

      8 De netbeheerder van het landelijk hoogspanningsnet meldt de toepasselijkheid van het vijfde, zesde en zevende lid
      aan de desbetreffende producent of zijn gemachtigde en aan de Belastingdienst.

      9 Dit artikel is niet van toepassing indien de producent duurzame elektriciteit opwekt met behulp van niet-zuivere
      biomassa in een afvalverbrandingsinstallatie.


