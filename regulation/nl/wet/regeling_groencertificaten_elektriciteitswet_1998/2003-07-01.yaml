  - number: 6b
    text: |-
      1 Indien de duurzame elektriciteit waarvoor boeking van groencertificaten wordt verzocht op grond van
      [artikel 6, derde lid][ref1], uitsluitend wordt opgewekt met behulp van naar haar aard zuivere biomassa of naar
      zijn aard zuiver biogas, behoeft de producent of zijn gemachtigde, in afwijking van [artikel 6a][ref2], geen
      verklaring te overleggen dat hij met behulp van een daartoe geëigende methode aan de hand van bemonstering per
      partij vaststelt dat het materiaal waaruit de duurzame elektriciteit wordt opgewekt, is aan te merken als zuivere
      biomassa.

      2 In dit geval verklaart de producent of zijn gemachtigde dat hij gedurende de periode waarop de verklaring
      betrekking heeft uitsluitend met behulp van naar haar aard zuivere biomassa of naar zijn aard zuiver biogas
      duurzame elektriciteit zal opwekken. De verklaring wordt overgelegd aan de netbeheerder van het landelijk
      hoogspanningsnet met gebruikmaking van het origineel van een ondertekend formulier, dat is opgenomen in de bij deze
      regeling behorende [bijlage 2][ref3].


