  - number: '4'
    text: |-
      1 Van het verbod in [artikel 3 van het Besluit gebruik sera en entstoffen][ref1] wordt tot 1 juli 2006 vrijstelling
      verleend voor het overeenkomstig deze regeling vaccineren van hobbypluimvee, en biologische legkippen en legkippen
      met vrije uitloop, ouder dan achttien weken, en tot 1 juli 2007 voor het overeenkomstig deze regeling vaccineren
      van biologische legkippen en legkippen met vrije uitloop, jonger dan achttien weken, aan een dierenarts die zich
      daartoe heeft aangemeld bij het LNV-loket door inzending van een door de VWA verstrekt formulier dat ten minste de
      gegevens bevat die zijn opgenomen in de bijlage bij deze regeling, onder 1.

      2 De dierenarts vangt op een locatie niet aan met vaccineren dan nadat door de minister toestemming is verleend.

      3 De toestemming, bedoeld in het tweede lid, wordt door de dierenarts aangevraagd bij de VWA:

      a. voor zover het de vaccinatie van hobbypluimvee betreft, door het uiterlijk 1 juni 2006 aan het LNV-loket
      inzenden van een door de VWA verstrekt formulier dat ten minste de gegevens bevat die zijn opgenomen in de bijlage
      bij deze regeling, onder 2;

      b. voor zover het de vaccinatie van biologische legkippen en kippen met vrije uitloop, ouder dan achttien weken
      betreft, door het uiterlijk 1 juni 2006 aan het LNV-loket inzenden van een door de VWA verstrekt formulier dat ten
      minste de gegevens bevat die zijn opgenomen in de bijlage bij deze regeling, onder 3;

      c. voor zover het de vaccinatie van biologische legkippen en kippen met vrije uitloop, jonger dan achttien weken
      betreft, door het uiterlijk 1 juni 2007 inzenden aan het LNV-loket van een door de VWA verstrekt formulier dat ten
      minste de gegevens bevat die zijn opgenomen in de bijlage bij deze regeling, onder 4.


      [ref1]: https://wetten.overheid.nl/BWBR0009198#Artikel3
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel4
    references:
