  - number: '6'
    text: |-
      1 De houder meldt zich voorafgaand aan de eerste vaccinatie door tussenkomst van de dierenarts aan bij het LNV-
      loket, waarbij gebruik wordt gemaakt van een door de VWA verstrekt formulier dat ten minste de gegevens bevat die
      zijn opgenomen in de bijlage bij deze regeling, onder 2.

      2 De houder van hobbypluimvee dat overeenkomstig deze regeling wordt gevaccineerd, vult voorafgaand aan de eerste
      vaccinatie een door de VWA verstrekte eigenaarsverklaring in, die ten minste de gegevens bevat die zijn opgenomen
      in de bijlage bij deze regeling, onder 5, ondertekent deze verklaring en bewaart een afschrift.

      3 De houder van hobbypluimvee ondertekent mede de vaccinatieverklaring, bedoeld in [artikel 7, vierde lid][ref1],
      en bewaart een afschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel7
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel6
