  - number: '12'
    text: Het is verboden mest afkomstig van ingevolge deze regeling gevaccineerd hobbypluimvee buiten Nederland te brengen.
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel12
  - number: '13'
    text: |-
      1 Indien biologische legkippen en legkippen met vrije uitloop, jonger dan achttien weken, op grond van deze
      regeling worden gevaccineerd, dienen alle op het bedrijf aanwezige biologische legkippen en legkippen met vrije
      uitloop, jonger dan achttien weken, met uitzondering van de dieren, bedoeld in het tweede lid en bedoeld in
      [artikel 18][ref1], te worden gevaccineerd.

      2 Het is verboden het middel, bedoeld in [artikel 2][ref2], toe te passen op biologische legkippen en legkippen met
      vrije uitloop die jonger zijn dan zeven weken.

      3 Biologische legkippen en legkippen met vrije uitloop, ouder dan achttien weken, die op grond van deze regeling
      worden gevaccineerd, met uitzondering van de dieren, bedoeld in [artikel 18][ref3], dienen tweemaal te worden
      gevaccineerd in de periode van 16 maart tot 1 juli 2006.

      4 Biologische legkippen en legkippen met vrije uitloop, jonger dan achttien weken, die op grond van deze regeling
      worden gevaccineerd, met uitzondering van de dieren, bedoeld in [artikel 18][ref4], dienen tweemaal te worden
      gevaccineerd in de periode van 16 maart tot 1 juli 2007.

      5 De legkippen, bedoeld in het derde en vierde lid, worden gevaccineerd op het bedrijf waarvoor de toestemming,
      bedoeld in [artikel 4][ref5], is verleend.

      6 Bij verklikkerdieren als bedoeld in [artikel 18][ref6] wordt door de dierenarts die de vaccinatie uitvoert een
      door GD verstrekte, niet verwijderbare pootring, aangebracht waarop onuitwisbaar het kenmerk ‘Controle A.I. 2006
      NL’ is aangebracht.


