preamble:
  text: >-
    Handelende in overeenstemming met de Minister van Volksgezondheid, Welzijn en Sport;


    Gelet op beschikking nr. 2006/147/EG van de Commissie van de Europese Gemeenschappen van 24 februari 2006
    betreffende preventieve vaccinatie tegen hoogpathogene aviaire influenza H5N1 in Nederland en aanverwante
    bepalingen betreffende verplaatsingen (PbEU L 55), artikel 8 van richtlijn (EG) nr. 2001/82 van het Europees
    Parlement en de Raad van de Europese Unie van 6 november 2001 tot vaststelling van een communautair wetboek
    betreffende geneesmiddelen voor diergeneeskundig gebruik (PbEG L 311);


    Gelet op artikel 29, eerste lid, 30, vierde lid, en 45, eerste en derde lid, van de Diergeneesmiddelenwet, artikel
    17 van de Gezondheids- en welzijnswet voor dieren, artikel 19 van de Landbouwwet, en artikel 3 van het Besluit
    gebruik sera en entstoffen;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      In deze regeling wordt verstaan onder:


      a. VWA: Voedsel en Waren Autoriteit;


      b. AI: Aviaire Influenza;


      c. hobbypluimvee: pluimvee als bedoeld in artikel 1, tweede lid, onder a, van beschikking 2006/147/EG;


      d. biologische legkippen en legkippen met vrije uitloop: kippen als bedoeld in artikel 1, tweede lid, onder b, van
      beschikking 2006/147/EG;


      e. beschikking 2006/147/EG: beschikking van de Commissie van de Europese Gemeenschappen van 24 februari 2006
      betreffende preventieve vaccinatie tegen hoogpathogene aviaire influenza H5N1 in Nederland en aanverwante
      bepalingen betreffende verplaatsingen (PbEU L 55).
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel1
  - number: '2'
    text: |-
      1 Van het verbod, bedoeld in [artikel 2, eerste lid, van de Diergeneesmiddelenwet][ref1], wordt vrijstelling
      verleend voor het toepassen, het bereiden, voorhanden of in voorraad hebben, en afleveren van de volgende
      diergeneesmiddelen:

      a. voor zover het betreft hobbypluimvee:

      – Gallimune Flu H5N9 (geïnact. av.influenza virus stam A/Turkey/Winsconsin (H5N9)) van de firma Merial, te Lyon,
      Frankrijk.

      b. voor zover het betreft biologische legkippen of legkippen met vrije uitloop:

      – Gallimune Flu H5N9 (geïnact. av.influenza virus stam A/Turkey/Winsconsin (H5N9)) van de firma Merial, te Lyon,
      Frankrijk.

      2 Het eerste lid is uitsluitend van toepassing op het overeenkomstig deze regeling preventief vaccineren
      van hobbypluimvee en biologische legkippen en legkippen met vrije uitloop door een op grond van
      [artikel 10, eerste lid, van de Wet op de uitoefening van de Diergeneeskunde 1990][ref2] bij de VWA geregistreerde
      dierenarts.

      3 De vrijstelling, bedoeld in het eerste lid, wordt voor zover het betreft hobbypluimvee, en biologische legkippen
      en legkippen met vrije uitloop, ouder dan achttien weken, verleend tot 1 juli 2006 en voor zover het betreft
      biologische legkippen en legkippen met vrije uitloop, jonger dan achttien weken, tot 1 juli 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel10
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel2
    references:
