        paragraaf: '1'
  - number: '15'
    text: |-
      1 De dierenarts die biologische legkippen of legkippen met vrije uitloop overeenkomstig deze regeling vaccineert,
      werkt overeenkomstig de instructies van de VWA en voldoet aan het tweede tot en met achtste lid, en aan
      [artikel 19, eerste, derde en vierde lid][ref1].

      2 De dierenarts past het middel, bedoeld in [artikel 2][ref2], slechts toe indien is voldaan aan de
      [artikelen 13, zesde lid][ref3], [14, derde lid][ref4], en [artikel 19, eerste lid][ref5].

      3 De dierenarts past het middel, bedoeld in [artikel 2][ref6], toe overeenkomstig de gebruiksvoorschriften en de
      instructies van de fabrikant van het middel.

      4 De dierenarts die het middel toepast, vult terstond na de eerste vaccinatie van de biologische legkippen of
      legkippen met vrije uitloop een door de VWA verstrekte vaccinatieverklaring in, die ten minste de gegevens bevat
      die zijn opgenomen in de bijlage bij deze regeling, onder 11, ondertekent deze, en laat deze mede ondertekenen door
      de houder van de biologische legkippen of legkippen met vrije uitloop.

      5 De dierenarts stuurt de verklaring, bedoeld in het vierde lid, en een afschrift daarvan, naar GD, verstrekt een
      afschrift aan de houder van het gevaccineerde pluimvee, en bewaart een afschrift in zijn administratie gedurende
      drie jaar.

      6 De dierenarts stuurt de verklaring, bedoeld in [artikel 14, derde lid][ref7], en een afschrift daarvan naar GD,
      mede ten behoeve van de registratie van de gegevens van de gevaccineerde biologische legkippen en legkippen met
      vrije uitloop.

      7 De dierenarts houdt een register bij overeenkomstig een door de VWA verstrekt model dat ten minste de gegevens
      bevat die zijn opgenomen in de bijlage bij deze regeling, onder 12, en bewaart dit register gedurende drie jaar na
      de eerste toepassing van het middel.

      8 De dierenarts gebruikt de restanten van het middel niet ten behoeve van vaccinatie op een ander bedrijf of een
      andere locatie en bewaart de restanten van het middel op zijn praktijk totdat deze worden opgehaald door GD.


