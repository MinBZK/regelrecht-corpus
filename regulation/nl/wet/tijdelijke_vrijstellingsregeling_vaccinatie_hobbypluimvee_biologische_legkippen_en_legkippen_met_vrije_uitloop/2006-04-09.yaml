  - number: '18'
    text: |-
      1 De houder, bedoeld in [artikel 16][ref1], draagt er zorg voor dat ten hoogste één procent van de op zijn bedrijf
      gehouden biologische legkippen of legkippen met vrije uitloop, met een maximum van 60 dieren per stal, niet wordt
      gevaccineerd en wordt ingezet als verklikkerdieren. De verklikkerdieren worden verdeeld in groepen van ten hoogste
      vijf dieren en deze groepen worden gelijkmatig verspreid in de stal geplaatst.

      2 Indien de gevaccineerde dieren biologische legkippen of legkippen met vrije uitloop jonger zijn dan achttien
      weken, en binnen worden gehouden, hoeven de verklikkerdieren niet gelijkmatig verspreid over de stal te worden
      geplaatst. De verklikkerdieren worden in dat geval afgescheiden van de gevaccineerde dieren in de stal geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel16
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel18
