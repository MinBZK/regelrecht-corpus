  - number: '10'
    text: >-
      1 Voorafgaand aan de eerste vaccinatie, neemt de dierenarts die het hobbypluimvee gaat vaccineren bloedmonsters af
      bij vijf procent van de dieren, waarbij van ten minste twee en ten hoogste twintig dieren een bloedmonster wordt
      afgenomen. Indien er sprak is van één te vaccineren dier, wordt van dat dier een bloedmonster afgenomen.


      2 In de periode die aanvangt negen weken na de tweede vaccinatie van het hobbypluimvee en die eindigt twaalf
      maanden na die vaccinatie, neemt de dierenarts die het hobbypluimvee heeft gevaccineerd bloedmonsters af bij vijf
      procent van het hobbypluimvee, waarbij van ten minste vijf en ten hoogste twintig dieren een bloedmonster wordt
      afgenomen. Indien er sprake is van minder dan vijf gevaccineerde dieren, wordt van ieder dier een bloedmonster
      afgenomen.


      3 Indien op een locatie naast het gevaccineerde hobbypluimvee, hobbypluimvee jonger dan zeven weken of ander
      pluimvee dat hobbymatig wordt gehouden, aanwezig is, wordt bij voorkeur ten hoogste de helft van de bloedmonsters,
      bedoeld in het tweede lid, afgenomen bij dat andere hobbypluimvee of andere pluimvee.


      4 De dierenarts verstuurt de bloedmonsters, bedoeld in het eerste en tweede lid, terstond na het afnemen naar GD.
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel10
  - number: '11'
    text: |-
      1 Het is verboden ingevolge deze regeling gevaccineerd hobbypluimvee, eendagskuikens en broedeieren, afkomstig van
      dat pluimvee, te vervoeren of te laten vervoeren.

      2 In afwijking van het eerste lid kan de minister toestemming verlenen voor het vervoer van volledig
      gevaccineerd hobbypluimvee, eendagskuikens en broedeieren, afkomstig van dat pluimvee, naar andere gevaccineerde
      hobbypluimveehouderijen.

      3 Aan de toestemming, bedoeld in het tweede lid, kunnen voorwaarden worden verbonden.

      4 De voorwaarden, bedoeld in het derde lid, zijn in elk geval:

      a. er wordt voldaan aan de in artikel 4 van beschikking 2006/147/EG opgenomen voorwaarden;

      b. het te vervoeren hobbypluimvee gaat vergezeld van een kopie van de vaccinatieverklaring, bedoeld in
      [artikel 7, vierde lid][ref1], waarop het aantal te vervoeren gevaccineerde dieren wordt aangetekend;

      c. het te vervoeren hobbypluimvee, de eendagskuikens en broedeieren gaan vergezeld van de toestemming, bedoeld in
      het tweede lid.

      5 Een aanvraag voor de toestemming, bedoeld in het tweede lid, wordt ingediend bij het LNV-loket door inzending
      van een door de VWA verstrekt formulier dat ten minste de gegevens bevat die zijn opgenomen in de bijlage bij deze
      regeling, onder 9.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel7
