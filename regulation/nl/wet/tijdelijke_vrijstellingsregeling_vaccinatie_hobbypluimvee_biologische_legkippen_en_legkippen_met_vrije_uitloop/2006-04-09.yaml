  - number: '5'
    text: |-
      1 Indien op een bedrijf zowel bedrijfsmatig pluimvee wordt gehouden als hobbypluimvee wordt gehouden, is het
      verboden hobbypluimvee te vaccineren.

      2 Het is verboden het middel, bedoeld in [artikel 2][ref1], toe te passen op hobbypluimvee jonger dan zeven weken.

      3 Hobbypluimvee dat wordt gevaccineerd ingevolge deze regeling, dient tweemaal te worden gevaccineerd in de periode
      van 16 maart tot 1 juli 2006.

      4 Hobbypluimvee dat wordt gevaccineerd ingevolge deze regeling, wordt gevaccineerd op de locatie waarvoor de
      toestemming, bedoeld in [artikel 4][ref2], is verleend.

      5 Bij hobbypluimvee dat wordt gevaccineerd ingevolge deze regeling, wordt door de dierenarts die de vaccinatie
      uitvoert, voorafgaand aan de eerste vaccinatie een door GD verstrekte, niet verwijderbare pootring, aangebracht
      waarop onuitwisbaar het kenmerk ‘Vaccinatie A.I. 2006 NL’ is aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019657#Artikel4
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel5
