  - number: '8'
    text: |-
      De houder van ingevolge deze regeling gevaccineerd hobbypluimvee is verplicht:

      a. er voor zorg te dragen dat het hobbypluimvee op de datum die is vermeld op de verklaring, bedoeld in
      [artikel 7, vierde lid][ref1], voor de tweede maal wordt gevaccineerd;

      b. tot het bijhouden van een register overeenkomstig een door de VWA verstrekt model dat ten minste de gegevens
      bevat die zijn opgenomen in de bijlage bij deze regeling, onder 8, en bewaart dit register gedurende drie jaar;

      c. de verklaringen, bedoeld in de [artikelen 6, tweede lid][ref2], en[ 7, vierde lid][ref3], en het register,
      bedoeld in onderdeel b, gedurende drie jaar te bewaren;

      d. er zorg voor te dragen dat de dierenarts die de vaccinatie heeft uitgevoerd in de periode die aanvangt negen
      weken na de tweede vaccinatie en die eindigt twaalf maanden na die vaccinatie, de bloedmonsters als bedoeld in
      [artikel 10, tweede lid][ref4], neemt;

      e. tot twaalf maanden na de vaccinatie, bedoeld in onderdeel a, de dierenarts die het hobbypluimvee heeft
      gevaccineerd, te consulteren indien al dan niet gevaccineerd hobbypluimvee ziekteverschijnselen vertoont of sterft;

      f. de pootringen van gestorven gevaccineerde dieren te bewaren.


