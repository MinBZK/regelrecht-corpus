        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '21'
    text: >-
      Het is verboden mest afkomstig van bedrijven waar zich biologische legkippen of legkippen met vrije uitloop
      bevinden die ingevolge deze regeling zijn gevaccineerd buiten Nederland te brengen.
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel21
  - number: '22'
    text: >-
      1 Eieren afkomstig van bedrijven waar zich biologische legkippen of legkippen met vrije uitloop bevinden die
      ingevolge deze regeling zijn gevaccineerd, worden slechts naar een lidstaat verzonden indien is voldaan aan artikel
      7, onderdelen a en b, van beschikking 2006/147/EG.


      2 Een verpakkingscentrum als bedoeld in artikel 7, onderdeel b, van beschikking 2006/147/EG is een in Nederland
      gelegen verpakkingscentrum dat is geregistreerd overeenkomstig de Verordening registratie verzamelaars, grossiers
      en houders van een pakstation en heffingen consumptie-eieren 2003 van het Productschap Pluimvee en Eieren dan wel
      een door de bevoegde autoriteit van een andere lidstaat aangewezen verpakkingscentrum.
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel22
  - number: '23'
    text: >-
      1 Vers vlees afkomstig van bedrijven waar zich biologische legkippen of legkippen met vrije uitloop bevinden
      die ingevolge deze regeling zijn gevaccineerd, wordt alleen naar een lidstaat verzonden indien is voldaan aan de
      voorschriften bedoeld in artikel 8, eerste lid, de onderdelen a tot en met d, van beschikking 2006/147/EG en indien
      het bijgaande handelsdocument voldoet aan artikel 9 van beschikking 2006/147/EG.


      2 Gehakt vlees, vleesbereidingen en separatorvlees van pluimvee dat afkomstig is van bedrijven waar zich
      biologische legkippen of legkippen met vrije uitloop bevinden die ingevolge deze regeling zijn gevaccineerd,
      en vleesproducten dat vlees bevat van pluimvee dat afkomstig is van bedrijven waar zich biologische legkippen
      of legkippen met vrije uitloop bevinden die overeenkomstig deze regeling zijn gevaccineerd, wordt alleen naar
      een lidstaat verzonden indien voldaan is aan de voorschriften bedoeld in artikel 8, tweede lid, van beschikking
      2006/147/EG en indien het bijgaande handelsdocument voldoet aan artikel 9 van beschikking 2006/147/EG.
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel23
  - number: '24'
    text: |-
      1 Op bedrijven waar ingevolge deze regeling preventief is gevaccineerd, worden alle voor
      het vervoer van levend pluimvee, vers vlees van pluimvee, gehakt vlees, vleesbereidingen,
      separatorvlees, vleesproducten en pluimveeveevoeder gebruikte transportmiddelen onmiddellijk
      voor en na elk transport gereinigd en ontsmet overeenkomstig de voorschriften opgenomen in
      __REF000___________________________________________________________________________________________________________
      __________.

      2 Een bewijs van de reiniging en ontsmetting, bedoeld in het eerste lid, is te allen tijde in het vervoermiddel
      aanwezig en bevat tenminste datum en tijdstip van reiniging en ontsmetting en het kenteken van het gereinigde
      vervoermiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: '25'
    text: >-
      Het gezondheidscertificaat voor niet gevaccineerd levend pluimvee dat, en broedeieren en eendagskuikens die in het
      intracommunautaire handelsverkeer worden gebracht, voldoet aan artikel 6 van beschikking 2006/147/EG.
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel25
  - number: '27'
    text: Deze regeling treedt in werking op 16 maart 2006.
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel27
  - number: '28'
    text: >-
      Deze regeling zal worden aangehaald als: Tijdelijke vrijstellingsregeling vaccinatie hobbypluimvee, biologische
      legkippen en legkippen met vrije uitloop.
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel28
