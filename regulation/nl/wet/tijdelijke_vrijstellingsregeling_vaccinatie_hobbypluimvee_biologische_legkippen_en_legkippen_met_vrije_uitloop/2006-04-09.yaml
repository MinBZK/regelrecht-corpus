  - number: '16'
    text: |-
      De houder van ingevolge deze regeling gevaccineerde biologische legkippen en legkippen met vrije uitloop is
      verplicht:

      a. er voor zorg te dragen dat biologische legkippen en legkippen met vrije uitloop op de datum die is vermeld op de
      verklaring, bedoeld in [artikel 15, vierde lid][ref1], voor de tweede maal worden gevaccineerd;

      b. tot het vermelden in zijn administratie van de gegevens die zijn opgenomen in de bijlage bij deze regeling,
      onder 13, en het bewaren van die gegevens gedurende drie jaar;

      c. de verklaringen, bedoeld in de [artikelen 14, derde lid][ref2], en [15, vierde lid][ref3], en het register,
      bedoeld in onderdeel b, gedurende drie jaar te bewaren;

      d. de bij de verklikkerdieren aangebrachte pootring bij verlies te laten vervangen door de dierenarts;

      e. tot het melden van klinische verschijnselen en sterfte van pluimvee overeenkomstig de
      [Regeling preventie, bestrijding en monitoring van besmettelijke dierziekten en zoönosen en TSE’s][ref4].


