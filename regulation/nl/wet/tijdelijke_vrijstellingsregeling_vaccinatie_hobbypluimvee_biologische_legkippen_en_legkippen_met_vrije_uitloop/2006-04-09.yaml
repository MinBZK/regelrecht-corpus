        paragraaf: '1'
  - number: '7'
    text: |-
      1 De dierenarts die hobbypluimvee op grond van deze regeling vaccineert, werkt overeenkomstig de instructies van de
      VWA en voldoet aan het tweede tot en met negende lid, en aan [artikel 10][ref1].

      2 De dierenarts past het middel, bedoeld in [artikel 2][ref2], slechts toe indien is voldaan aan de
      [artikelen 5, vijfde lid][ref3], [6, tweede lid][ref4], en [10, eerste lid][ref5].

      3 De dierenarts past het middel, bedoeld in [artikel 2][ref6], toe overeenkomstig de gebruiksvoorschriften en de
      instructies van de fabrikant van het middel.

      4 De dierenarts vult terstond na de eerste vaccinatie van het hobbypluimvee een door de VWA
      verstrekte vaccinatieverklaring in, die ten minste de gegevens bevat die zijn opgenomen in de
      [bijlage bij deze regeling, onder 6][ref7], ondertekent deze en laat deze mede ondertekenen door de houder van
      het hobbypluimvee.

      5 De dierenarts stuurt de verklaring, bedoeld in het vierde lid, en een afschrift daarvan, naar GD, verstrekt
      een afschrift aan de houder van het gevaccineerde hobbypluimvee, en bewaart een afschrift in zijn administratie
      gedurende drie jaar.

      6 De dierenarts stuurt de verklaring, bedoeld in [artikel 6, tweede lid][ref8], en een afschrift daarvan, naar GD,
      mede ten behoeve van de registratie van de gegevens van het gevaccineerde hobbypluimvee.

      7 De dierenarts houdt een register bij overeenkomstig een door de VWA verstrekt model dat ten minste de gegevens
      bevat die zijn opgenomen in de bijlage bij deze regeling, onder 7, en bewaart dit register gedurende drie jaar na
      de eerste toepassing van het middel.

      8 De dierenarts gebruikt de restanten van het middel niet ten behoeve van vaccinatie op een andere locatie of een
      bedrijf en bewaart de restanten van het middel op zijn praktijk totdat deze worden opgehaald door GD.

      9 Indien de dierenarts ingevolge [artikel 8, onderdeel d][ref9], door de houder op de hoogte wordt gebracht van de
      sterfte van gevaccineerd hobbypluimvee, meldt de dierenarts die sterfte aan het LNV-loket.


