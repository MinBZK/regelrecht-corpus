        paragraaf: '1'
  - number: '19'
    text: |-
      1 Voorafgaand aan de eerste vaccinatie van de biologische legkippen of legkippen met vrije uitloop neemt de
      dierenarts die de legkippen vaccineert bloedmonsters af bij de verklikkerdieren, bedoeld in [artikel 18][ref1].

      2 De houder, bedoeld in [artikel 16][ref2], draagt er zorg voor dat de verklikkerdieren, bedoeld in
      [artikel 18][ref3], dagelijks klinisch worden onderzocht, meldt de sterfte van deze dieren aan de VWA en volgt de
      instructies van VWA ter zake.

      3 De houder, bedoeld in [artikel 16][ref4], draagt er zorg voor dat de dierenarts driemaandelijks na de eerste
      vaccinatie van ten minste 60 procent van elke groep verklikkerdieren een bloedmonster afneemt, waarbij van ten
      minste twintig en ten hoogste 36 dieren een bloedmonster wordt afgenomen.

      4 De dierenarts stuurt de monsters, bedoeld in het eerste en derde lid, terstond na het afnemen naar GD.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel18
