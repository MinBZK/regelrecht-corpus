  - number: '14'
    text: |-
      1 De houder van biologische legkippen of legkippen met vrije uitloop die overeenkomstig deze regeling worden
      gevaccineerd, meldt zich voorafgaand aan de eerste vaccinatie door tussenkomst van de dierenarts aan bij het LNV-
      loket, waarbij gebruik wordt gemaakt van een door de VWA verstrekt formulier dat ten minste de gegevens bevat die
      zijn opgenomen in de bijlage bij deze regeling, onder 3.

      2 Indien de te vaccineren legkippen, bedoeld in het eerste lid, jonger zijn dan achttien weken, en deze dieren
      zijn bestemd om te worden afgevoerd naar een ander bedrijf, meldt de houder naar wiens bedrijf deze legkippen
      zullen worden verplaatst zich eveneens aan bij het LNV-loket en wordt gebruik gemaakt van een door de VWA verstrekt
      formulier dat ten minste de gegevens bevat die zijn opgenomen in de bijlage bij deze regeling, onder 4.

      3 De houder van biologische legkippen of legkippen met vrije uitloop die overeenkomstig deze regeling worden
      gevaccineerd, vult voorafgaand aan de eerste vaccinatie een door de VWA verstrekte houdersverklaring in, die ten
      minste de gegevens bevat die zijn opgenomen in de bijlage bij deze regeling, onder 10, ondertekent deze verklaring
      en bewaart een afschrift.

      4 De houder van biologische legkippen of legkippen met vrije uitloop die overeenkomstig deze regeling worden
      gevaccineerd, ondertekent mede de vaccinatieverklaring, bedoeld in [artikel 15, vierde lid][ref1], en bewaart een
      afschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel15
    url: https://wetten.overheid.nl/BWBR0019657/2006-04-09#Artikel14
