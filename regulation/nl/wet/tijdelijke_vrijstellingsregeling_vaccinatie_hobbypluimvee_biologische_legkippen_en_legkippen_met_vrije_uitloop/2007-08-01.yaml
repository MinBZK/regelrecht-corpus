  - number: '20'
    text: |-
      1 Het is verboden pluimvee, eendagskuikens en broedeieren, afkomstig van bedrijven waar zich biologische legkippen
      of legkippen met vrije uitloop bevinden die ingevolge deze regeling zijn gevaccineerd of gehervaccineerd, te
      vervoeren of te laten vervoeren.

      2 In afwijking van het eerste lid kan de Minister toestemming verlenen voor het vervoer van pluimvee,
      eendagskuikens en broedeieren naar:

      a. een in het binnen- of buitenland gelegen slachthuis, en voor zover het vervoer naar een in het buitenland
      gelegen slachthuis betreft, na instemming van de lidstaat van bestemming, of

      b. naar in Nederland gelegen bedrijven waar is gevaccineerd of gehervaccineerd.

      3 Aan de toestemming, bedoeld in het tweede lid, kunnen voorwaarden worden verbonden.

      4 De voorwaarden, bedoeld in het derde lid, zijn in elk geval:

      a. er wordt voldaan aan de in artikel 6 van de Beschikking opgenomen voorwaarden;

      b. het te vervoeren pluimvee gaat vergezeld van de toestemming, bedoeld in het tweede lid;

      c. indien de te vervoeren dieren biologische legkippen of legkippen met vrije uitloop zijn, gaan deze
      dieren, ingeval zij gevaccineerd zijn, vergezeld van een kopie van de tweede vaccinatieverklaring, bedoeld in
      [artikel 15, vierde lid][ref1], waarop het aantal te vervoeren gevaccineerde dieren wordt aangetekend, en gaan
      deze dieren, ingeval zij gehervaccineerd zijn, vergezeld van een kopie van de vaccinatieverklaring, bedoeld in
      [artikel 17d, derde lid][ref2], waarop het aantal te vervoeren gehervaccineerde dieren wordt aangetekend.

      5 Een aanvraag voor de toestemming, bedoeld in het tweede lid, wordt ingediend bij het LNV-loket door inzending
      van een door de VWA verstrekt formulier dat ten minste de gegevens bevat die zijn opgenomen in de bijlage bij deze
      regeling, onder 8.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0019657#Artikel17d
