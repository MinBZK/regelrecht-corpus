  - number: 17a
    text: |-
      De houder die zijn biologische legkippen of legkippen met vrije uitloop ingevolge deze regeling heeft laten
      vaccineren, kan tot hervaccinatie van biologische legkippen of legkippen met vrije uitloop, ouder dan achttien
      weken overgaan, indien ten aanzien van de te hervaccineren dieren de eerste vaccinatie na 1 augustus 2007 is
      uitgevoerd, overeenkomstig de Tijdelijke vrijstellingsregeling vaccinatie hobbypluimvee, biologische legkippen en
      legkippen met vrije uitloop, zoals deze op het moment van eerste vaccinatie gold.
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel17a
  - number: 17b
    text: |-
      De houder die zijn biologische legkippen of legkippen met vrije uitloop ingevolge deze paragraaf wil laten
      hervaccineren, draagt er zorg voor dat deze hervaccinatie niet eerder plaatsvindt dan 3 kalendermaanden na de datum
      van de tweede vaccinatie, bedoeld in [artikel 16][ref1], en niet later plaatsvindt dan 12 kalendermaanden na de
      datum van de tweede vaccinatie.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel16
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel17b
    references:
