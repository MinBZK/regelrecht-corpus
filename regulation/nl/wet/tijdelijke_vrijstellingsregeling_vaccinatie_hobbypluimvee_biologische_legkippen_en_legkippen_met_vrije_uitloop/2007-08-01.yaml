        paragraaf: '1'
  - number: '17'
    text: |-
      De houder van ingevolge deze regeling gevaccineerd biologische legkippen of legkippen met vrije uitloop:

      a. vermeldt in zijn administratie de gegevens die zijn opgenomen in de bijlage bij deze regeling, onder 10, en
      bewaart die gegevens gedurende drie jaar;

      b. bewaart de twee vaccinatieverklaringen, bedoeld in [artikel 15, vierde lid][ref1], dan wel een kopie van de
      tweede vaccinatieverklaring indien het gaat om overeenkomstig [artikel 20][ref2] verplaatste biologische legkippen
      of legkippen met vrije uitloop, en het register, bedoeld in onderdeel a, gedurende drie jaar;

      c. laat de bij de verklikkerdieren aangebrachte pootringen bij verlies vervangen door:

      i. de dierenarts die de biologische legkippen of legkippen met vrije uitloop heeft gevaccineerd;

      ii. indien het gaat om overeenkomstig [artikel 20][ref3] verplaatste biologische legkippen of legkippen met vrije
      uitloop, een andere dierenarts die zich overeenkomstig [artikel 4, eerste lid][ref4], heeft aangemeld bij het LNV-
      loket.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0019657#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0019657#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0019657#Artikel4
