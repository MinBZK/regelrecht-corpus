  - number: '9'
    text: |-
      De houder van ingevolge deze regeling gevaccineerd hobbypluimvee:

      a. houdt een register bij overeenkomstig door de VWA verstrekte modellen die ten minste de gegevens bevatten die
      zijn opgenomen in de bijlage bij deze regeling, onder 7;

      b. bewaart de twee vaccinatieverklaringen, bedoeld in [artikel 7, vierde lid][ref1], dan wel een kopie van
      de tweede vaccinatieverklaring indien het gaat om overeenkomstig [artikel 11][ref2] verplaatst gevaccineerd
      hobbypluimvee, en het register, bedoeld in onderdeel a, gedurende drie jaar;

      c. consulteert indien zijn al dan niet gevaccineerd hobbypluimvee ziekteverschijnselen vertoont of sterft tot
      twaalf maanden na de tweede vaccinatie:

      i. de dierenarts die het hobbypluimvee heeft gevaccineerd, of

      ii. indien het gaat om overeenkomstig [artikel 11][ref3] verplaatst hobbypluimvee, een andere dierenarts die zich
      overeenkomstig [artikel 4, eerste lid][ref4], heeft aangemeld bij het LNV-loket.


