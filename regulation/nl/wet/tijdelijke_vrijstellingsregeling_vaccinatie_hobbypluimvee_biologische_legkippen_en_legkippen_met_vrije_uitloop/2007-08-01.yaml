preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Volksgezondheid, Welzijn en Sport;

    Gelet op beschikking nr. 2006/147/EG van de Commissie van de Europese Gemeenschappen van 24 februari 2006
    betreffende preventieve vaccinatie tegen hoogpathogene aviaire influenza H5N1 in Nederland en aanverwante
    bepalingen betreffende verplaatsingen (PbEU L 55), artikel 8 van richtlijn (EG) nr. 2001/82 van het Europees
    Parlement en de Raad van de Europese Unie van 6 november 2001 tot vaststelling van een communautair wetboek
    betreffende geneesmiddelen voor diergeneeskundig gebruik (PbEG L 311);

    Gelet op artikel 29, eerste lid, 30, vierde lid, en 45, eerste en derde lid, van de Diergeneesmiddelenwet, artikel
    17 van de Gezondheids- en welzijnswet voor dieren, artikel 19 van de Landbouwwet, en artikel 3 van het Besluit
    gebruik sera en entstoffen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. VWA: Voedsel en Waren Autoriteit;

      b. AI: Aviaire Influenza;

      c. hobbypluimvee: pluimvee als bedoeld in artikel 1, tweede lid, onder a, van beschikking 2006/147/EG;

      d. biologische legkippen en legkippen met vrije uitloop: kippen als bedoeld in artikel 2, onderdeel b, van de
      Beschikking;

      e. Beschikking: beschikking van de Commissie van de Europese Gemeenschappen van 6 juli 2007 betreffende preventieve
      vaccinatie tegen hoogpathogene aviaire influenza in Nederland en aanverwante bepalingen betreffende verplaatsingen;

      f. Minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      g. dierenarts: een op grond van
      [artikel 10, eerste lid, van de Wet op de uitoefening van de Diergeneeskunde 1990][ref1] bij de VWA geregistreerde
      dierenarts.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel10
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '10'
  - number: '2'
    text: |-
      1 Voor hobbypluimvee, biologische legkippen en legkippen met vrije uitloop, wordt vrijstelling verleend van het
      verbod, bedoeld in [artikel 2, eerste lid van de Diergeneesmiddelenwet][ref1], voor het toepassen, bereiden,
      voorhanden of in voorraad hebben, en afleveren van het volgende diergeneesmiddel: Nobilis Influenza H5N2 emulsie
      voor injectie, van de firma Intervet International B.V. te Boxmeer, Nederland.

      2 Het eerste lid is uitsluitend van toepassing op het overeenkomstig deze regeling preventief vaccineren en
      hervaccineren van:

      a. biologische legkippen en legkippen met vrije uitloop door een dierenarts of door personen die onder toezicht en
      verantwoordelijkheid van de dierenarts werken;

      b. hobbypluimvee door een dierenarts.

      3 De vrijstelling, bedoeld in het eerste lid, wordt verleend tot 1 augustus 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
  - number: '3'
    text: |-
      Het diergeneesmiddel, bedoeld in [artikel 2][ref1], wordt voor de toepassing van deze regeling aangewezen als:

      a. een middel als bedoeld in [artikel 29, eerste lid, van de Diergeneesmiddelenwet][ref2];

      b. een middel als bedoeld in [artikel 30, vierde lid ,van de Diergeneesmiddelenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0003818#Artikel30
