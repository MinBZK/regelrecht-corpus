  - number: 9c
    text: |-
      1 De [artikelen 5, eerste en vierde lid][ref1], en [6, derde lid][ref2], zijn van overeenkomstige toepassing op
      hervaccinatie van hobbypluimvee.

      2 [Artikel 7, eerste, tweede, vierde, vijfde, zesde en zevende lid][ref3], is van overeenkomstige toepassing op
      hervaccinatie van hobbypluimvee, met dien verstande dat de in het vierde lid bedoelde vaccinatieverklaring ingeval
      van hervaccinatie ten minste de gegevens bevat die zijn opgenomen in de bijlage bij deze regeling, onder 5a.


