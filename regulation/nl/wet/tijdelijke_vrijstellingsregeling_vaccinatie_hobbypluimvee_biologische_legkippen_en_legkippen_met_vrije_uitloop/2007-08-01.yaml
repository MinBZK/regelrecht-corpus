        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '15'
    text: |-
      1 De dierenarts die de biologische legkippen of legkippen met vrije uitloop op grond van deze regeling vaccineert,
      werkt overeenkomstig de instructies van de VWA en voldoet aan het tweede tot en met zevende lid, en aan
      [artikel 19, eerste, derde en vierde lid][ref1].

      2 De dierenarts past het middel, bedoeld in [artikel 2][ref2], toe overeenkomstig de gebruiksvoorschriften en de
      instructies van de fabrikant van het middel.

      3 De dierenarts past bij de eerste vaccinatie het middel, bedoeld in [artikel 2][ref3], slechts toe indien is
      voldaan aan de [artikelen 13, zesde lid][ref4], en [19, eerste lid][ref5].

      4 De dierenarts vult terstond na iedere vaccinatie van biologische legkippen of legkippen met vrije uitloop een
      door de VWA verstrekte vaccinatieverklaring in, die ten minste de gegevens bevat die zijn opgenomen in de bijlage
      bij deze regeling, onder 9, ondertekent deze en laat deze mede ondertekenen door de houder van de biologische
      legkippen of legkippen met vrije uitloop.

      5 De dierenarts stuurt de verklaring, bedoeld in het vierde lid, en een afschrift daarvan, binnen vijf werkdagen na
      vaccinatie naar GD, verstrekt een afschrift aan de houder van de gevaccineerde biologische legkippen of legkippen
      met vrije uitloop, en bewaart een afschrift in zijn administratie gedurende drie jaar.

      6 De dierenarts houdt een register bij overeenkomstig een door de VWA verstrekt model dat ten minste de gegevens
      bevat die zijn opgenomen in de bijlage bij deze regeling, onder 6, en bewaart dit register gedurende drie jaar na
      de eerste toepassing van het middel.

      7 De dierenarts gebruikt de restanten van het middel niet ten behoeve van vaccinatie op een andere locatie of een
      bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel19
