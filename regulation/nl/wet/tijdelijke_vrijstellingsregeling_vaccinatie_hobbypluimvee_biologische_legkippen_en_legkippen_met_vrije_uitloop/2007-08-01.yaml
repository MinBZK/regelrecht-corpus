        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 17c
    text: |-
      De houder van ingevolge deze regeling gehervaccineerde biologische legkippen of legkippen met vrije uitloop bewaart
      de vaccinatieverklaring, bedoeld in [artikel 17d, derde lid][ref1], dan wel een kopie van deze vaccinatieverklaring
      indien het gaat om overeenkomstig [artikel 20][ref2] verplaatste gehervaccineerde biologische legkippen of
      legkippen met vrije uitloop, gedurende drie jaar.


