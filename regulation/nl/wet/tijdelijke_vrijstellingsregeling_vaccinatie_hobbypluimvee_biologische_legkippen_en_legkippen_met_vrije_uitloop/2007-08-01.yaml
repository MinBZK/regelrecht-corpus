  - number: '8'
    text: |-
      1 De houder van hobbypluimvee die zijn hobbypluimvee ingevolge deze regeling laat vaccineren draagt er
      zorg voor dat het hobbypluimvee voor de tweede maal wordt gevaccineerd op de datum die staat vermeld op de
      vaccinatieverklaring, bedoeld in [artikel 7, vierde lid][ref1], die is opgemaakt na de eerste vaccinatie.

      2 De houder van hobbypluimvee die zijn nog niet eerder gevaccineerde hobbypluimvee ingevolge deze regeling laat
      vaccineren stemt erin toe dat in de periode die aanvangt zes weken na de tweede vaccinatie en die eindigt zes
      maanden na die vaccinatie, de bloedmonsters als bedoeld in [artikel 10, eerste lid][ref2], worden genomen door een
      dierenarts werkzaam bij de GD of door een dierenartsassistent paraveterinair werkzaam bij de GD, onder toezicht van
      een dierenarts, en verleent hieraan zijn medewerking.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019657#Artikel10
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel8
