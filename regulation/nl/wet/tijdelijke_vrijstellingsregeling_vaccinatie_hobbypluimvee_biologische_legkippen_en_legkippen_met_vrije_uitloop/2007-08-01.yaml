  - number: '5'
    text: |-
      1 Indien op een bedrijf zowel bedrijfsmatig pluimvee wordt gehouden als hobbypluimvee, is het verboden het
      hobbypluimvee te vaccineren.

      2 Het is verboden het middel, bedoeld in [artikel 2][ref1], toe te passen op hobbypluimvee waarbij een pootring als
      bedoeld in het vijfde lid niet behoorlijk is aan te brengen omdat de poten van de desbetreffende dieren nog niet
      volgroeid zijn.

      3 Hobbypluimvee dat wordt gevaccineerd ingevolge deze regeling, wordt twee maal gevaccineerd, overeenkomstig de
      bijsluiter bij het vaccin van de fabrikant, waarbij de tweede vaccinatie uiterlijk 1 augustus 2009 is verricht.

      4 Hobbypluimvee dat wordt gevaccineerd ingevolge deze regeling, wordt gevaccineerd op de locatie waar dit
      hobbypluimvee verblijft onderscheidenlijk op de praktijk van de dierenarts die de vaccinatie uitvoert.

      5 Bij hobbypluimvee dat wordt gevaccineerd ingevolge deze regeling, wordt door de dierenarts die de vaccinatie
      uitvoert, voorafgaand aan de eerste vaccinatie een niet verwijderbare pootring aangebracht waarop onuitwisbaar het
      kenmerk ‘NL VACCIN A.I. 07-2’ is aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel2
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019657
        artikel: '2'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      1 De houder die zijn hobbypluimvee ingevolge deze regeling wil laten vaccineren meldt zich voorafgaand aan de
      eerste vaccinatie door tussenkomst van de dierenarts aan bij het LNV-loket, waarbij gebruik wordt gemaakt van
      een door de VWA verstrekt formulier dat ten minste de gegevens bevat die zijn opgenomen in de bijlage bij deze
      regeling, onder 2.

      2 Het eerste lid is niet van toepassing op houders van hobbypluimvee ten aanzien waarvan de eerste en tweede
      vaccinatie in de periode van 1 maart 2006 tot 1 juli 2006 of in de periode van 1 augustus 2006 tot 1 augustus 2007
      is verricht.

      3 De houder van hobbypluimvee ondertekent na elke vaccinatie mede de vaccinatieverklaring, bedoeld in
      [artikel 7, vierde lid][ref1], en bewaart een afschrift gedurende drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel7
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel6
