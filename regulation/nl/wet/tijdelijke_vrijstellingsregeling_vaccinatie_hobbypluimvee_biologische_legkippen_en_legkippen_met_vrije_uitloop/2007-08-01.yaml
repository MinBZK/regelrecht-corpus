        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '7'
    text: |-
      1 De dierenarts die hobbypluimvee op grond van deze regeling vaccineert, werkt overeenkomstig de instructies van de
      VWA en voldoet aan het tweede tot en met zevende lid, en aan [artikel 10][ref1].

      2 De dierenarts past het middel, bedoeld in [artikel 2][ref2], toe overeenkomstig, voor zover van toepassing, de
      instructies van de fabrikant van het middel of de gebruiksaanwijzingen van de Minister.

      3 De dierenarts past bij de eerste vaccinatie van hobbypluimvee het middel, bedoeld in [artikel 2][ref3], slechts
      toe indien is voldaan aan [artikel 5, vijfde lid][ref4].

      4 De dierenarts vult terstond na iedere vaccinatie van hobbypluimvee een door de VWA verstrekte
      vaccinatieverklaring in, die ten minste de gegevens bevat die zijn opgenomen in de bijlage bij deze regeling, onder
      5, ondertekent deze en laat deze mede ondertekenen door de houder van het desbetreffende hobbypluimvee.

      5 De dierenarts stuurt de verklaring, bedoeld in het vierde lid, en een afschrift daarvan, binnen vijf werkdagen
      na vaccinatie naar GD, verstrekt een afschrift aan de houder van het gevaccineerde hobbypluimvee, en bewaart een
      afschrift in zijn administratie gedurende drie jaar.

      6 De dierenarts houdt een register bij overeenkomstig door de VWA verstrekte modellen die ten minste de gegevens
      bevatten die zijn opgenomen in de bijlage bij deze regeling, onder 6, en bewaart dit register gedurende drie jaar
      na de eerste toepassing van het middel.

      7 De dierenarts gebruikt de restanten van het middel niet ten behoeve van vaccinatie op een andere locatie of een
      bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel10
