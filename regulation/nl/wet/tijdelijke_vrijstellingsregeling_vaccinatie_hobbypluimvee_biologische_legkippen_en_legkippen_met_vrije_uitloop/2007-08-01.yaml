  - number: '19'
    text: |-
      1 Voorafgaand aan de eerste vaccinatie van de biologische legkippen of legkippen met vrije uitloop neemt de
      dierenarts die de legkippen vaccineert bloedmonsters af bij de verklikkerdieren, bedoeld in [artikel 18][ref1].

      2 De houder, bedoeld in [artikel 16][ref2] of [17][ref3] draagt er zorg voor dat de verklikkerdieren, bedoeld in
      [artikel 18][ref4], dagelijks klinisch worden onderzocht, meldt de sterfte van deze dieren aan de VWA, en volgt de
      instructies van de VWA ter zake.

      3 De houder, bedoeld in [artikel 16][ref5] of [17][ref6], draagt er zorg voor dat de dierenarts driemaandelijks
      na de eerste vaccinatie van maximaal 30 verklikkerdieren per bedrijf een bloedmonster afneemt, waarbij van ten
      minste 5 verklikkerdieren per stal een bloedmonster wordt afgenomen, maximaal verdeeld over de in de stal aanwezige
      groepen verklikkerdieren.

      4 De houder, bedoeld in [artikel 16][ref7] en [17][ref8], draagt er zorg voor dat de dierenarts:

      a. in de periode die aanvangt zes weken na de tweede vaccinatie van de biologische legkippen of legkippen met
      vrije uitloop en die eindigt 12 maanden na die vaccinatie, minimaal eenmaal en maximaal driemaal een bloedmonster
      afneemt, overeenkomstig de instructies van de VWA, bij een percentage van de gevaccineerde biologische legkippen
      of legkippen met vrije uitloop van de houder, waarbij het percentage wordt berekend op basis van het aantal bij de
      houder aanwezige biologische legkippen of legkippen met vrije uitloop, en

      b. de in onderdeel a bedoelde bloedmonsters binnen de in onderdeel a bedoelde periode afneemt op het zelfde moment
      als de in het derde lid bedoelde bloedmonsters van de verklikkerdieren van de betreffende houder worden afgenomen.

      5 De dierenarts stuurt de monsters, bedoeld in het eerste, derde en vierde lid, terstond na het afnemen naar GD.


