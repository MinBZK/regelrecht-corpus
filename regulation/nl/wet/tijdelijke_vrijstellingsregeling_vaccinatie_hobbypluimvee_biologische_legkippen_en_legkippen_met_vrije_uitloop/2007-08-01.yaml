  - number: '12'
    text: Het is verboden mest afkomstig van ingevolge deze regeling gevaccineerd hobbypluimvee buiten Nederland te brengen.
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel12
  - number: '13'
    text: |-
      1 Indien biologische legkippen en legkippen met vrije uitloop, jonger dan achttien weken, op grond van deze
      regeling worden gevaccineerd, dienen alle op het bedrijf aanwezige biologische legkippen en legkippen met vrije
      uitloop, jonger dan achttien weken, met uitzondering van de dieren, bedoeld in het tweede lid en bedoeld in
      [artikel 18][ref1], te worden gevaccineerd.

      2 Het is verboden het middel, bedoeld in [artikel 2][ref2], toe te passen op biologische legkippen en legkippen met
      vrije uitloop die jonger zijn dan zeven weken.

      3 Biologische legkippen en legkippen met vrije uitloop die op grond van deze regeling worden gevaccineerd, met
      uitzondering van de dieren, bedoeld in [artikel 18][ref3], dienen tweemaal te worden gevaccineerd overeenkomstig de
      bijsluiter bij het vaccin van de fabrikant, waarbij de tweede vaccinatie uiterlijk 1 augustus 2009 is verricht.

      4 De legkippen, bedoeld in het derde lid, worden gevaccineerd op het bedrijf waarvoor de toestemming, bedoeld in
      [artikel 4][ref4], is verleend.

      5 Bij verklikkerdieren als bedoeld in [artikel 18][ref5] wordt door de dierenarts die de vaccinatie uitvoert of
      de personen, bedoeld in [artikel 4, tweede lid, onder b][ref6], een niet verwijderbare pootring aangebracht waarop
      onuitwisbaar het kenmerk ‘Controle A.I. 2007- 2’ is aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel18
