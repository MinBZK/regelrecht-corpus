  - number: 17d
    text: |-
      1 [Artikel 13, vierde lid][ref1], is van overeenkomstige toepassing op hervaccinatie van biologische legkippen of
      legkippen met vrije uitloop.

      2 [Artikel 14, eerste en derde lid][ref2], is van overeenkomstige toepassing op hervaccinatie van biologische
      legkippen of legkippen met vrije uitloop, met dien verstande dat het in het eerste lid bedoelde formulier ingeval
      van hervaccinatie ten minste de gegevens bevat die zijn opgenomen in de bijlage bij deze regeling, onder 3a.

      3 [Artikel 15, eerste, tweede, vierde, vijfde, zesde en zevende lid][ref3], is van overeenkomstige toepassing op
      hervaccinatie van biologische legkippen of legkippen met vrije uitloop, met dien verstande dat de in het vierde
      lid bedoelde vaccinatieverklaring ingeval van hervaccinatie ten minste de gegevens bevat die zijn opgenomen in de
      bijlage bij deze regeling, onder 9a.

      4 [Artikel 15a][ref4] is van overeenkomstige toepassing op hervaccinatie van biologische legkippen of legkippen met
      vrije uitloop.


