  - number: '16'
    text: |-
      De houder van biologische legkippen of legkippen met vrije uitloop die deze dieren ingevolge deze regeling laat
      vaccineren draagt er zorg voor dat deze dieren voor de tweede maal wordt gevaccineerd op de datum die staat vermeld
      op de vaccinatieverklaring, bedoeld in [artikel 15, vierde lid][ref1], die is opgemaakt na de eerste vaccinatie.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel15
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel16
