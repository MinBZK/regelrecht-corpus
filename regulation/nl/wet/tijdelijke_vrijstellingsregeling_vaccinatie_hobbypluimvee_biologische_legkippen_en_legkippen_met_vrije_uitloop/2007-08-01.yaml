  - number: 9d
    text: |-
      De houder van ingevolge deze regeling gehervaccineerd hobbypluimvee:

      a. bewaart de vaccinatieverklaring, bedoeld in [artikel 9c, tweede lid][ref1], dan wel een kopie van deze
      vaccinatieverklaring indien het gaat om overeenkomstig [artikel 11][ref2] verplaatst gehervaccineerd hobbypluimvee,
      gedurende drie jaar;

      b. consulteert, indien zijn al dan niet gehervaccineerd hobbypluimvee ziekteverschijnselen vertoont of sterft tot
      twaalf maanden na de hervaccinatie:

      1°. De dierenarts die het hobbypluimvee heeft gehervaccineerd, of

      2°. Indien het gaat om overeenkomstig [artikel 11][ref3] verplaatst hobbypluimvee, een andere dierenarts die zich
      overeenkomstig [artikel 4, eerste lid][ref4], heeft aangemeld bij het LNV-loket.


