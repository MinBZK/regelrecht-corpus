  - number: '4'
    text: |-
      1 Van het verbod in [artikel 3 van het Besluit gebruik sera en entstoffen][ref1] wordt tot 1 augustus 2009
      vrijstelling verleend voor het overeenkomstig deze regeling vaccineren onderscheidenlijk hervaccineren van
      hobbypluimvee, aan een dierenarts die zich voor het vaccineren heeft aangemeld bij het LNV-loket door inzending
      van een door de VWA verstrekt formulier dat ten minste de gegevens bevat die zijn opgenomen in de bijlage bij deze
      regeling, onder 1;

      2 Van het verbod in [artikel 3 van het Besluit gebruik sera en entstoffen][ref2] wordt tot 1 augustus 2009
      vrijstelling verleend voor het overeenkomstig deze regeling vaccineren onderscheidenlijk hervaccineren van
      biologische legkippen en legkippen met vrije uitloop:

      a. aan een dierenarts die zich voor het vaccineren heeft aangemeld bij het LNV-loket door inzending van een door de
      VWA verstrekt formulier dat ten minste de gegevens bevat die zijn opgenomen in de bijlage bij deze regeling, onder
      1, en

      b. aan personen die tijdens het overeenkomstig deze regeling vaccineren of hervaccineren onder toezicht en
      verantwoordelijkheid staan van een dierenarts als bedoeld in onderdeel a.

      3 De dierenarts vangt met een vaccinatie, onderscheidenlijk hervaccinatie, niet aan dan nadat hij heeft
      vastgesteld dat de houder die het hobbypluimvee wil laten vaccineren, onderscheidenlijk hervaccineren, zich eenmaal
      overeenkomstig [artikel 6][ref3] heeft aangemeld bij het LNV-loket.

      4 Indien de dierenarts, bedoeld in het derde lid, heeft vastgesteld dat de in het derde lid bedoelde houder zich
      niet heeft aangemeld bij het LNV-loket, vangt de dierenarts met een vaccinatie, onderscheidenlijk hervaccinatie,
      niet aan dan nadat voor de desbetreffende vaccinatie, onderscheidenlijk hervaccinatie door de Minister toestemming
      is verleend.

      5 De toestemming, bedoeld in het vierde lid, wordt door de dierenarts aangevraagd bij het LNV-loket:

      a. voor zover het de vaccinatie, onderscheidenlijk hervaccinatie van hobbypluimvee betreft, door het uiterlijk
      1 juli 2009 Aan het LNV-loket inzenden van een door de VWA verstrekt formulier dat ingeval van vaccinatie ten
      minste de gegevens bevat die zijn opgenomen in de bijlage bij deze regeling, onder 2, en ingeval van hervaccinatie
      ten minste de gegevens bevat die zijn opgenomen in de bijlage bij deze regeling, onder 2a;

      b. voor zover het de vaccinatie, onderscheidenlijk hervaccinatie van biologische legkippen en legkippen met vrije
      uitloop, ouder dan achttien weken betreft, door het uiterlijk 1 juli 2009 Aan het LNV-loket inzenden van een door
      de VWA verstrekt formulier dat ingeval van vaccinatie ten minste de gegevens bevat die zijn opgenomen in de bijlage
      bij deze regeling, onder 3, en ingeval van hervaccinatie ten minste de gegevens bevat die zijn opgenomen in de
      bijlage bij deze regeling, onder 3a;

      c. voor zover het de vaccinatie, onderscheidenlijk hervaccinatie van biologische legkippen en legkippen met vrije
      uitloop, jonger dan achttien weken betreft, door het uiterlijk 1 juli 2009 aan het LNV-loket inzenden van een door
      de VWA verstrekt formulier dat ingeval van vaccinatie ten minste de gegevens bevat die zijn opgenomen in de bijlage
      bij deze regeling, onder 4.


