  - number: 9a
    text: |-
      De houder die zijn hobbypluimvee ingevolge deze regeling heeft laten vaccineren, kan tot hervaccinatie van deze
      dieren overgaan, indien overeenkomstig deze regeling ten aanzien van het te hervaccineren hobbypluimvee de eerste
      en tweede vaccinatie in de periode van 1 augustus 2007 tot 1 augustus 2009 is verricht.
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel9a
  - number: 9b
    text: |-
      De houder die hobbypluimvee ingevolge deze paragraaf wil laten hervaccineren, draagt er zorg voor dat deze
      hervaccinatie niet eerder plaatsvindt dan drie kalendermaanden na de datum van de tweede vaccinatie, bedoeld in
      [artikel 8, eerste lid][ref1], en niet later plaatsvindt dan twaalf kalendermaanden na de datum van de tweede
      vaccinatie.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel8
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel9b
