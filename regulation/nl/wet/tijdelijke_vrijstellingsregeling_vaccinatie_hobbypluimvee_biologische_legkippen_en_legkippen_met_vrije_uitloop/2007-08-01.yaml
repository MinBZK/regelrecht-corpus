  - number: '10'
    text: |-
      In de periode die aanvangt zes weken na de tweede vaccinatie van het hobbypluimvee en eindigt 6 maanden na die
      vaccinatie, neemt een dierenarts, werkzaam bij de GD, minimaal eenmaal en maximaal tweemaal bloedmonsters af bij
      vijf procent van het bij de houder aanwezige, al dan niet gevaccineerde hobbypluimvee, waarbij van ten minste
      vijf en ten hoogste twintig dieren een bloedmonster wordt afgenomen. Indien er sprake is van minder dan vijf
      gevaccineerde dieren, wordt van ieder dier een bloedmonster afgenomen.
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel10
  - number: '11'
    text: |-
      1 Het is verboden ingevolge deze regeling gevaccineerd of gehervaccineerd hobbypluimvee, eendagskuikens en
      broedeieren, afkomstig van dat pluimvee, ter vervoeren of te laten vervoeren.

      2 In afwijking van het eerste lid:

      a. mag volledig gevaccineerd of gehervaccineerd hobbypluimvee worden vervoerd ten behoeve van het
      tijdelijk verzamelen van deze dieren op tentoonstellingen en keuringen in binnen- en buitenland onder
      voorwaarde dat de houder van het gevaccineerd of gehervaccineerd hobbypluimvee in het register, bedoeld in
      [artikel 9, onderdeel a][ref1], melding maakt van het vervoer;

      b. mogen eendagskuikens en broedeieren afkomstig van ingevolge deze regeling gevaccineerd of gehervaccineerd
      hobbypluimvee worden vervoerd naar hobbypluimveehouderijen in Nederland;

      c. c. kan de Minister toestemming verlenen voor het vervoer van volledig gevaccineerd of ge-hervaccineerd
      hobbypluimvee naar andere hobbypluimveehouderijen in binnen- en buitenland.

      3 Indien het in onderdeel a, b, of c bedoelde vervoer een bestemming heeft in het buitenland, verkrijgt de houder
      voorafgaand aan het vervoer schriftelijke toestemming van de lidstaat van bestemming.

      4 Aan de toestemming, bedoeld in het tweede lid, onderdeel c, kunnen voorwaarden worden verbonden.

      5 De voorwaarden, bedoeld in het vierde lid, zijn in elk geval:

      a. er wordt voldaan aan de in artikel 5 van de Beschikking opgenomen voorwaarden;

      b. het te vervoeren hobbypluimvee gaat ingeval van gevaccineerde dieren vergezeld van een kopie van de tweede
      vaccinatieverklaring, bedoeld in [artikel 7, vierde lid][ref2], waarop het aantal te vervoeren gevaccineerde dieren
      wordt aangetekend, en gaat ingeval van gehervaccineerde dieren vergezeld van een kopie van de vaccinatieverklaring,
      bedoeld in [artikel 9c, tweede lid][ref3], waarop het aantal te vervoeren gehervaccineerde dieren wordt
      aangetekend;

      c. het te vervoeren hobbypluimvee gaat vergezeld van de toestemming, bedoeld in het tweede lid, onderdeel c.

      6 Een aanvraag voor de toestemming, bedoeld in het tweede lid, onderdeel c, wordt ingediend bij het LNV-loket door
      inzending van een door de VWA verstrekt formulier dat ten minste de gegevens bevat die zijn opgenomen in de bijlage
      bij deze regeling, onder 8.


      [ref1]: https://wetten.overheid.nl/BWBR0019657#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0019657#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0019657#Artikel9c
