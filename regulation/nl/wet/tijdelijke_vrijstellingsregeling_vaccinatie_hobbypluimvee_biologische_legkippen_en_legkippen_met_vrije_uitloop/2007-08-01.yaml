  - number: '21'
    text: |-
      Het is verboden mest afkomstig van bedrijven waar zich biologische legkippen of legkippen met vrije uitloop
      bevinden die ingevolge deze regeling zijn gevaccineerd of gehervaccineerd buiten Nederland te brengen.
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel21
  - number: '22'
    text: |-
      1 Eieren afkomstig van bedrijven waar zich biologische legkippen of legkippen met vrije uitloop bevinden die
      ingevolge deze regeling zijn gevaccineerd of gehervaccineerd, worden slechts naar een lidstaat verzonden indien is
      voldaan aan artikel 8, onderdelen a en b, van de Beschikking.

      2 Een verpakkingscentrum als bedoeld in artikel 8, onderdeel b, onder (i), van de Beschikking is een in Nederland
      gelegen verpakkingscentrum dat is geregistreerd overeenkomstig de Verordening registratie verzamelaars, grossiers
      en houders van een pakstation en heffingen consumptie-eieren 2003 van het Productschap Pluimvee en Eieren dan wel
      een door de bevoegde autoriteit van een andere lidstaat aangewezen verpakkingscentrum.
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel22
  - number: '23'
    text: |-
      1 Vers vlees afkomstig van bedrijven waar zich biologische legkippen of legkippen met vrije uitloop bevinden die
      ingevolge deze regeling zijn gevaccineerd of gehervaccineerd, wordt alleen naar een lidstaat verzonden indien is
      voldaan aan de voorschriften bedoeld in artikel 9, eerste lid, onderdelen a en b, van de Beschikking.

      2 Gehakt vlees, vleesbereidingen en separatorvlees van pluimvee dat afkomstig is van bedrijven waar zich
      biologische legkippen of legkippen met vrije uitloop bevinden die ingevolge deze regeling zijn gevaccineerd
      of gehervaccineerd, en vleesproducten dat vlees bevat van pluimvee dat afkomstig is van bedrijven waar zich
      biologische legkippen of legkippen met vrije uitloop bevinden die overeenkomstig deze regeling zijn gevaccineerd,
      wordt alleen naar een lidstaat verzonden indien voldaan is aan de voorschriften bedoeld in artikel 9, tweede lid,
      van de Beschikking.
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel23
  - number: '24'
    text: |-
      1 Op bedrijven waar zich biologische legkippen of legkippen met vrije uitloop bevinden die ingevolge deze regeling
      zijn gevaccineerd of gehervaccineerd, worden alle voor het vervoer van levend pluimvee, vers vlees van pluimvee,
      gehakt vlees, vleesbereidingen, separatorvlees, vleesproducten en pluimveeveevoeder gebruikte transportmiddelen
      onmiddellijk voor en na elk transport gereinigd en ontsmet overeenkomstig de voorschriften opgenomen in
      __REF000___________________________________________________________________________________________________________
      __________.

      2 Een bewijs van de reiniging en ontsmetting, bedoeld in het eerste lid, is te allen tijde in het vervoermiddel
      aanwezig en bevat tenminste datum en tijdstip van reiniging en ontsmetting en het kenteken van het gereinigde
      vervoermiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0018397
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018397
  - number: '25'
    text: |-
      1 Het gezondheidscertificaat voor gevaccineerd pluimvee dat, en broedeieren en eendagskuikens die in het
      intracommunautaire handelsverkeer worden gebracht, voldoet aan artikel 7, eerste lid, van de Beschikking.

      2 Het gezondheidscertificaat voor niet gevaccineerd pluimvee dat, en broedeieren en eendagskuikens die in het
      intracommunautaire handelsverkeer worden gebracht, voldoet aan artikel 7, tweede lid, van de Beschikking.
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel25
  - number: '27'
    text: Deze regeling treedt in werking op 16 maart 2006.
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel27
  - number: '28'
    text: |-
      Deze regeling zal worden aangehaald als: Tijdelijke vrijstellingsregeling vaccinatie hobbypluimvee, biologische
      legkippen en legkippen met vrije uitloop.
    url: https://wetten.overheid.nl/BWBR0019657/2007-08-01#Artikel28
