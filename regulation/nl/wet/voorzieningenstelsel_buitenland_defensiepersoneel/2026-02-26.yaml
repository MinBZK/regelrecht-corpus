  - number: '2'
    text: |-
      Onverminderd [artikel 5, vijfde lid][ref1], is dit hoofdstuk van toepassing op de defensie-ambtenaar
      die is geplaatst in een gebied buiten Nederland, tenzij op hem [hoofdstuk 3][ref2] dan wel de
      [Regeling voorzieningen bij vredes- en humanitaire operaties (VVHO)][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0039849#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0039789
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0039849
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0039789
  - number: '3'
    text: |-
      De defensie-ambtenaar is geplaatst in een gebied buiten Nederland, indien hij voor een tijdvak van langere duur dan
      dertig achtereenvolgende dagen – anders dan uitsluitend in verband met een militaire oefening – in dat gebied is
      tewerkgesteld en in dat gebied is gevestigd.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel3
  - number: '4'
    text: |-
      Het verblijf van de gezinsleden van de defensie-ambtenaar in een gebied buiten Nederland wordt uitsluitend in
      aanmerking genomen, indien de gezinsleden aldaar metterwoon zijn gevestigd en ter zake van dat verblijf is voldaan
      aan door de minister bepaalde regels.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel4
  - number: '5.1'
    text: |-
      De plaatsing van de defensie-ambtenaar en het verblijf van een of meer gezinsleden in een gebied buiten Nederland
      vangen aan op de dag van aankomst bij een grensstation of -overgang, in de eerste haven of op het eerste vliegveld
      aldaar.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel5
  - number: '5.2'
    text: |-
      Onverminderd het derde tot en met het zesde lid eindigen de plaatsing van de defensie-ambtenaar en het verblijf van
      een of meer gezinsleden in een gebied buiten Nederland op de dag van vertrek van een grensstation of -overgang, uit
      de laatste haven of van het laatste vliegveld aldaar.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel5
  - number: '5.3'
    text: 'De plaatsing van de defensie-ambtenaar in een gebied buiten Nederland eindigt, indien hij:'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel5
  - number: 5.3.a
    text: |-
      om redenen van dienst – waaronder mede te verstaan medische redenen – het gebied van plaatsing voor een tijdvak van
      langere duur dan dertig achtereenvolgende dagen verlaat of
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel5
  - number: 5.3.b
    text: |-
      om persoonlijke redenen het gebied van plaatsing voor een tijdvak van langere duur dan zestig achtereenvolgende
      dagen verlaat.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel5
  - number: '5.4'
    text: |-
      Onverminderd het vijfde lid wordt de plaatsing van de defensie-ambtenaar die is geplaatst in een gebied buiten
      Nederland en wiens gezinsleden aldaar metterwoon zijn gevestigd, geacht voort te duren zolang die defensie-
      ambtenaar voor de duur van ten hoogste zes maanden buiten het gebied van plaatsing verblijft, terwijl zijn
      gezinsleden aldaar achterblijven. In voorkomend geval eindigt de plaatsing op de dag waarop:
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel5
  - number: 5.4.a
    text: |-
      de duur van het verblijf van de defensie-ambtenaar buiten dat gebied de termijn van zes maanden overschrijdt, dan
      wel
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel5
  - number: 5.4.b
    text: |-
      de gezinsleden binnen de termijn van zes maanden dat gebied definitief of voor langere duur dan zestig dagen
      verlaten.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel5
  - number: '5.5'
    text: |-
      In afwijking van het vierde lid wordt de plaatsing van de militair als bedoeld in
      [artikel 7, eerste lid, onderdelen a en b][ref1], wiens gezinsleden aldaar metterwoon
      zijn gevestigd, en die is ingezet in het kader van een operatie als bedoeld in de
      [Regeling voorzieningen bij vredes- en humanitaire operaties][ref2], geacht voort te duren tijdens de periode van
      die inzet en van de direct daaraan voorafgaande opleiding ten behoeve van die inzet.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039789
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039789
  - number: '5.6'
    text: |-
      In afwijking van het vierde lid wordt de plaatsing van de militair als bedoeld in
      [artikel 7, eerste lid, onderdeel d][ref1], dan wel de militair als bedoeld in artikel
      7, eerste lid, onder f, die is ingezet in het kader van een operatie als bedoeld in de
      [Regeling voorzieningen bij vredes- en humanitaire operaties][ref2], geacht voort te duren tijdens de periode van
      die inzet en van de direct daaraan voorafgaande opleiding ten behoeve van die inzet indien de militair gedurende
      deze periode kosten maakt gerelateerd aan zijn huisvesting in het land van plaatsing.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039789
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039789
  - number: '5.7'
    text: |-
      Indien de defensie-ambtenaar bedoeld in [artikel 7, eerste lid, onderdelen a en b][ref1], bij eindiging van zijn
      plaatsing in een gebied buiten Nederland zijn gezinsleden daar moet achterlaten, kan hij, om reden van medische
      noodzaak, het afronden van het schooljaar van het kind van de defensieambtenaar en het verblijven buiten het land
      van plaatsing voor het volgen van een bij- of omscholingsopleiding met daarbij het oogmerk van de organisatie
      de defensieambtenaar terug te laten keren naar het land van plaatsing, niettemin in het genot van de toelage-
      buitenland, de verhoging daarvan en de overige voorzieningen ter zake van die plaatsing in dat gebied blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '5.8'
    text: |-
      De dag van aankomst, bedoeld in het eerste lid, mag maximaal vijf werkdagen voor aanvang van de functievervulling
      liggen.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel5
  - number: '5.9'
    text: |-
      Onverminderd het zevende lid, mag de dag van vertrek, bedoeld in het tweede lid, maximaal vijf werkdagen na einde
      van de functievervulling liggen.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel5
  - number: '6.1'
    text: |-
      Indien de defensie-ambtenaar reeds uit anderen hoofde aanspraak heeft op voorzieningen – al dan niet in natura
      – ter zake van zijn plaatsing in een gebied buiten Nederland, kan de aanspraak op voorzieningen op grond van dit
      hoofdstuk geheel of gedeeltelijk komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel6
  - number: '6.2'
    text: |-
      Indien de echtgenoot van de defensie-ambtenaar over hetzelfde tijdvak aanspraak kan maken op voorzieningen op grond
      van dit hoofdstuk of op daarmee gelijk te stellen voorzieningen voor ambtenaren behorende tot de Rijksoverheid:
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel6
  - number: 6.2.a
    text: |-
      komt de aanspraak van de defensie-ambtenaar op voorzieningen op grond van dit hoofdstuk te vervallen, indien het
      standaard netto Nederland van de echtgenoot hoger is;
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel6
  - number: 6.2.b
    text: |-
      wordt de aanspraak op voorzieningen verleend aan degene die daarvoor door beiden gezamenlijk is aangewezen, indien
      het standaard netto Nederland van de defensie-ambtenaar en dat van zijn echtgenoot gelijk zijn,
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel6
  - number: '6.3'
    text: |-
      De defensie-ambtenaar, bedoeld in het tweede lid, onder a, alsmede de defensie-ambtenaar die niet door beiden
      gezamenlijk is aangewezen, bedoeld in het tweede lid, onder b, heeft aanspraak op de voorzieningen waarop de
      ongehuwde defensie-ambtenaar, bedoeld in [artikel 7, eerste lid, onderdeel e][ref1], aanspraak zou hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *gehuwd, gezin met kinderen aldaar* de gehuwde
      defensieambtenaar die met zijn echtgenoot en kinderen woonachtig is in het land van plaatsing dan wel de
      alleenstaande ouder die met zijn kinderen woonachtig is in het land van plaatsing;
        - *gehuwd, gezin zonder kinderen aldaar* de gehuwde defensieambtenaar die met zijn echtgenoot woonachtig is in het
      land van plaatsing;
        - *gehuwd, gezin niet aldaar* de gehuwde defensieambtenaar, waarvan geen enkel gezinslid in het land van plaatsing
      woonachtig is, en die in het land van plaatsing huisvesting en voeding van rijkswege geniet;
        - *gehuwd, gezin niet aldaar, zelfstandig woonachtig aldaar* de gehuwde defensieambtenaar, waarvan geen enkel
      gezinslid in het land van plaatsing woonachtig is, en die metterwoon gevestigd is in het land van plaatsing;
        - *ongehuwd* de ongehuwde defensieambtenaar die in het land van plaatsing huisvesting en voeding van rijkswege
      geniet;
        - *ongehuwd en zelfstandig woonachtig aldaar* de ongehuwde defensieambtenaar die metterwoon gevestigd is in het
      land van plaatsing.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel7
  - number: '7.2'
    text: |-
      De defensieambtenaar met aanspraak op salaris die is geplaatst in een gebied buiten Nederland heeft aanspraak op
      een toelage-buitenland bestaande uit:
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel7
  - number: 7.2.a
    text: een koopkrachtcomponent bestaande uit een percentage, indien deze positief is, en
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel7
  - number: 7.2.b
    text: |-
      een verblijfscomponent bestaande uit een percentage, beide berekend over het voor belanghebbende geldende standaard
      netto Nederland, en
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel7
  - number: 7.2.c
    text: een verplaatsingcomponent bestaande uit een nominaal bedrag.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel7
  - number: '7.3'
    text: Alle in het tweede lid genoemde componenten worden vastgesteld met toepassing van tabel 1.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel7
  - number: '7.4'
    text: |-
      Indien er in een bepaald gebied sprake is van een verblijfscomponent die meer dan 10 punten hoger is dan de
      verblijfscomponent in de hoofdstad dan wel duurdere stad, dan wordt de verblijfscomponent voor de defensieambtenaar
      die in dat gebied woonachtig is, gebaseerd op dat gebied.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel7
  - number: '7.5'
    text: |-
      Uitgezonderd van de aanspraak op een toelage-buitenland is de defensieambtenaar die is geplaatst in een gebied
      buiten Nederland en naar het oordeel van de Minister in de gelegenheid is dagelijks te reizen tussen de woonplaats
      van zijn gezinsleden in Nederland en de plaats waar hij de dienst verricht, dan wel tussen zijn woonplaats in
      Nederland en de plaats waar hij de dienst verricht.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel7
  - number: '7.6'
    text: |-
      [Artikel 3, derde lid, van het Inkomstenbesluit militairen][ref1] wordt niet toegepast op de verplaatsingscomponent
      bij deeltijdverlof of ouderschapsverlof, evenmin wordt de verplaatsingscomponent voor de burgerambtenaar met een
      deeltijdaanstelling of ouderschapsverlof naar evenredigheid gekort.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel3
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '3'
  - number: '9.1'
    text: |-
      De defensie-ambtenaar bedoeld in [artikel 7, eerste lid, onderdelen a en b][ref1], heeft – met inachtneming van
      het tweede tot en met het zevende lid – aanspraak op een verhoging van zijn toelage-buitenland voor ieder van zijn
      kinderen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 9.1.a
    text: |-
      ten behoeve van dat kind aanspraak bestaat op kinderbijslag ingevolge de [Algemene Kinderbijslagwet][ref1], en/of
      het *Bundeskindergeldgesetz* of het *Einkommengesetz*, of


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 9.1.b
    text: |-
      dat kind de leeftijd van 25 jaar nog niet heeft bereikt en aan dat kind een basisbeurs is toegekend dan wel naar
      het oordeel van de commandant een basisbeurs zou zijn toegekend indien dat kind zijn studie in Nederland zou hebben
      gevolgd.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel9
  - number: '9.2'
    text: |-
      De in het eerste lid bedoelde aanspraak bestaat voor een kind dat verblijft in het gebied van plaatsing van de
      defensie-ambtenaar, mits dat verblijf uitsluitend het gevolg is van de plaatsing aldaar van die defensie-ambtenaar
      en de datum van aankomst van het kind in dat gebied is gelegen omstreeks of na de datum van plaatsing van de
      defensie-ambtenaar in het betreffende gebied. De verhoging bestaat uit een basisbedrag en de duurtecorrectie,
      indien deze positief is, berekend over een door de minister vastgesteld bedrag gebaseerd op de gemiddelde
      kinderbijslag per maand voor de eerste twee kinderen. Die bedragen zijn opgenomen in tabel 5.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel9
  - number: '9.3'
    text: |-
      De in het eerste lid bedoelde aanspraak bestaat voor een kind dat voor het volgen van onderwijs metterwoon in
      Nederland verblijft en wiens tijd grotendeels in beslag wordt genomen door of in verband met dat onderwijs. Het
      bedrag van de verhoging wordt vastgesteld met toepassing van tabel 6.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel9
  - number: '9.4'
    text: |-
      De aanspraak op de verhoging, bedoeld in het derde lid, blijft behouden indien het samenwonen met de gezinsleden
      wordt onderbroken voor een termijn van niet langer dan drie maanden, indien aan de voorwaarden die voor het
      verkrijgen van de aanspraak op die verhoging zijn gesteld, na het samenwonen weer volledig wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel9
  - number: '9.5'
    text: |-
      Voor een kind waarvoor de aanspraak op kinderbijslag pas ontstaat op de eerste dag van het kwartaal volgende op dat
      waarin het kind is aangekomen of geboren in het gebied van plaatsing van de defensie-ambtenaar, gaat de aanspraak
      op de verhoging in op de dag van aankomst, onderscheidenlijk van de geboorte, in dat gebied.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel9
  - number: '9.6'
    text: |-
      Indien een aangehuwd of pleegkind pas tijdens de plaatsing van de defensie-ambtenaar in een gebied buiten Nederland
      tot de gezinsleden van de defensie-ambtenaar gaat behoren, gaat de aanspraak op de verhoging van de toelage-
      buitenland in met ingang van de dag waarop het kind tot de gezinsleden gaat behoren.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel9
  - number: '9.7'
    text: |-
      Indien de aanspraak op kinderbijslag, de basisbeurs, of de fictieve basisbeurs, bedoeld in het eerste lid, voor
      een kind eindigt, vervalt ten aanzien van dat kind de aanspraak op de verhoging met ingang van de dag waarop die
      verandering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel9
  - number: '10'
    text: 'De militair die is geplaatst in een gebied buiten Nederland en die aanspraak heeft op:'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel10
  - number: 10.a
    text: |-
      de in de pensioengrondslag opgenomen toelage officieren-arts, -tandarts en -apotheker, bedoeld in artikel 7 van de
      Inkomstenregeling militairen;
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel10
  - number: 10.b
    text: de vliegtoelage, bedoeld in artikel 10 van de Inkomstenregeling militairen, of
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel10
  - number: 10.c
    text: de garantievliegtoelage, bedoeld in artikel 11 van de Inkomstenregeling militairen,
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel10
  - number: '11.1'
    text: |-
      Een verhoging van de toelage-buitenland als gevolg van een verandering in de burgerlijke staat van de defensie-
      ambtenaar gaat in op de dag waarop die verandering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel11
  - number: '11.2'
    text: |-
      Onverminderd het derde lid gaat een verlaging van de toelage-buitenland als gevolg van een verandering in de
      burgerlijke staat van de defensie-ambtenaar in op de dag waarop die verandering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel11
  - number: '11.3'
    text: |-
      Een verlaging van de toelage-buitenland of het verliezen van de aanspraak op de toelage-buitenland door het
      overlijden van een gezinslid, gaat in op de eerste dag van de derde maand volgende op die waarin dat overlijden
      heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel11
  - number: '11.4'
    text: |-
      Een verhoging van de toelage-buitenland als gevolg van de aankomst of geboorte van een kind in het gebied van
      plaatsing dan wel dat een aangehuwd of pleegkind in het gebied van plaatsing tot de gezinsleden van de defensie-
      ambtenaar gaat behoren, gaat in op de dag waarop het kind tot de gezinsleden gaat behoren.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel11
  - number: '11.5'
    text: |-
      Onverminderd het derde lid gaat een verlaging van de toelage-buitenland als gevolg van het niet meer behoren van
      kinderen tot de gezinsleden van de defensie-ambtenaar in het gebied van plaatsing van de defensie-ambtenaar, in op
      de dag waarop die verandering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel11
  - number: '12.1'
    text: |-
      In dit artikel wordt, indien de militair gebruik moet maken van de faciliteiten van in Duitsland gesitueerde Britse
      messes, verstaan onder *noodzakelijk gemaakte kosten*:
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel12
  - number: 12.1.a
    text: |-
      ten aanzien van huisvesting: de verschuldigde kosten wegens verstrekking van huisvesting (*accommodation charges*),
      in voorkomend geval vermeerderd met de verplichte bijdragen wegens *subscriptions*, *maintenance*, *sports*,
      *silver*, *fund*, *messfunctions*, *library*, *united services club* en *staff gratuities*, voor zover het totaal
      van die bijdragen een bedrag per maand te boven gaat van € 10,23 voor officieren of € 5,11 voor andere militairen;
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel12
  - number: 12.1.b
    text: |-
      ten aanzien van voeding: de verschuldigde kosten wegens verstrekking van voeding (*ration charges*), met inbegrip
      van de tafelgelden (*extra messing charges*).
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel12
  - number: '12.2'
    text: |-
      Aan de militair die is geplaatst in een gebied buiten Nederland en die gebruik maakt van huisvesting en voeding van
      defensie, wordt huisvesting en voeding verstrekt bij een onderdeel van de Nederlandse krijgsmacht, dan wel – indien
      dat niet leidt tot onnodig hoge kosten voor het Rijk – bij een onderdeel van de krijgsmacht van een buitenlandse
      mogendheid of een internationale organisatie waarbij Nederland krachtens een verdrag is aangesloten.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel12
  - number: '12.3'
    text: |-
      Indien geen of geen passende huisvesting als bedoeld in het tweede lid kan worden verstrekt, wordt de militair door
      de zorg van de commandant voor rekening van het Rijk elders gehuisvest.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel12
  - number: '12.4'
    text: Aan kosten van huisvesting worden vergoed de naar het oordeel van de commandant noodzakelijk gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel12
  - number: '12.5'
    text: |-
      De in een gebied buiten Nederland geplaatste militair die als bedoeld in
      [artikel 9, eerste lid, van de Regeling huisvesting en voeding militairen 2018][ref1] en die zelf voor betaling van
      voeding zorg dient te dragen, heeft aanspraak op een tegemoetkoming:


      [ref1]: https://wetten.overheid.nl/BWBR0040470#Artikel9
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0040470
        artikel: '9'
  - number: 12.5.a
    text: |-
      indien naar het oordeel van de commandant gebruik kan worden gemaakt van een passende, voor militairen bestemde
      eetgelegenheid: het voor het betreffende gebied geldende bedrag dat is opgenomen in tabel 8, vermeerderd met het
      bedrag van een toeslag, indien deze door de militair is verschuldigd;
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel12
  - number: 12.5.b
    text: |-
      in de overige gevallen: de naar het oordeel van de commandant noodzakelijk gemaakte kosten tot een maximum van
      de vergoedingen op basis van de [Regeling dienstreizen defensie, bijlage C][ref1], voor het betrokken gebied of
      gebiedsdeel, waarbij na zestig dagen verblijf aldaar op het aldus berekende bedrag 25 procent in mindering wordt
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0039787
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0039787
  - number: '12.6'
    text: |-
      De in een gebied buiten Nederland geplaatste militair die voeding van defensie tegen contante betaling geniet
      als bedoeld in [artikel 9, tweede lid van de Regeling huisvesting en voeding militairen 2018][ref1], maar van die
      voeding naar het oordeel van de commandant geen gebruik kan maken, heeft aanspraak op een tegemoetkoming:


      [ref1]: https://wetten.overheid.nl/BWBR0040470#Artikel9
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0040470
        artikel: '9'
  - number: 12.6.a
    text: |-
      indien naar het oordeel van de commandant gebruik kan worden gemaakt van een passende, voor militairen bestemde
      eetgelegenheid: het voor het betreffende gebied geldende bedrag dat is opgenomen in tabel 9, vermeerderd met het
      bedrag van een toeslag, indien deze door de militair is verschuldigd;
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel12
  - number: 12.6.b
    text: |-
      in de overige gevallen: de naar het oordeel van de commandant noodzakelijk gemaakte kosten tot een maximum van
      de vergoedingen op basis van de [Regeling dienstreizen defensie, bijlage C][ref1], voor het betrokken gebied of
      gebiedsdeel, waarbij na zestig dagen verblijf aldaar op het aldus berekende bedrag 25 procent in mindering wordt
      gebracht, verminderd met de som van:


      [ref1]: https://wetten.overheid.nl/BWBR0039787
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0039787
  - number: 12.6.b.1°
    text: |-
      het bedrag dat in Nederland zou zijn verschuldigd op grond van
      [artikel 9, tweede lid van de Regeling huisvesting en voeding militairen 2018][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0040470#Artikel9
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0040470
        artikel: '9'
  - number: 12.6.b.2°
    text: |-
      de voor het betrokken gebied geldende duurtecorrectie – voor zover deze positief is – berekend over het bedrag,
      bedoeld ten 1°.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel12
  - number: '13.1'
    text: |-
      In dit artikel wordt verstaan onder: - *passende woning* een woning die wat huurbedrag, aard, ruimte, indeling
      en ligging betreft, door de commandant – mede gelet op de plaatselijke normen – als een geschikte woning voor de
      defensie-ambtenaar wordt aangemerkt;
        - *vrije keuze woning* onder passende woning wordt mede verstaan die woning die alleen voor wat betreft
      het huurbedrag door de commandant als niet geschikt wordt aangemerkt, maar waarvoor bij de bepaling van de
      tegemoetkoming gerekend wordt met een door de commandant als geschikt aangemerkt maximaal huurbedrag;
        - *passende defensiewoning* een specifiek voor defensie-ambtenaren bestemde woning die door het Ministerie van
      Defensie in eigendom is verworven of is gehuurd en die wat aard, ruimte, indeling en ligging betreft door de
      commandant – mede gelet op de plaatselijke normen – als een geschikte woning voor de defensie-ambtenaar wordt
      aangemerkt;
        - *verschuldigde huur* voor zover niet anders is bepaald: de tegenwaarde in Nederlandse valuta van de
      som van: 1°. de kale huur; 2°. de huur van een garage, indien die tezamen met de woning moet worden
      gehuurd; 3°. de overige kosten die naar het oordeel van de commandant aan die huur zijn verbonden,
      waartoe ten minste behoren: (a). voor België en Luxemburg: de *risque locataire*, verminderd met
      het gedeelte van de premie dat is bestemd voor de inboedelverzekering, en de eventueel verschuldigde
      grondbelasting; (b). voor Frankrijk: de aan die huur verbonden *charges*, verminderd met de kosten voor
      verwarming en water, of – voor zover die kosten niet afzonderlijk worden berekend – verminderd met de in
      [artikel 7, derde lid, onderdeel b van de Regeling huisvesting en voeding militairen 2018][ref1] genoemde
      bedragen per maand voor verwarming en voor water; de *risque locataire*, verminderd met het gedeelte van de
      premie dat is bestemd voor de inboedelverzekering, en de eventueel verschuldigde *taxe immobilière*; (c). voor
      de Bondsrepubliek Duitsland: de eventueel door de defensie-ambtenaar verschuldigde kosten voor de medeverzekering
      van de aansprakelijkheid van de huurder ten opzichte van de verhuurder van schade door brand aan het door de
      huurder bewoonde pand en de eventueel verschuldigde *Grundsteuer*; (d). voor de Nederlandse Antillen en Aruba: de
      verschuldigde gebruiksbelasting;
        - *eigen bijdrage* zeventien procent van de som van: 1°. de voor de militair geldende bezoldiging,
      onderscheidenlijk het voor de ambtenaar geldende salaris, in voorkomend geval vermeerderd met de toelage
      minimumloon, bedoeld in [artikel 16 van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref2], en 2°. het
      bedrag van de voor het gebied van plaatsing geldende duurtecorrectie, indien deze positief is, berekend over het
      voor de militair, onderscheidenlijk ambtenaar, geldende standaard netto Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0040470#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel16
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0040470
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '16'
  - number: '13.2'
    text: |-
      De defensie-ambtenaar die aanspraak heeft op de toelage-buitenland, bedoeld in
      [artikel 7, eerste of derde lid][ref1], en die in het gebied van plaatsing een eigen huishouding voert, heeft
      aanspraak op een maandelijkse tegemoetkoming in de woninghuur, indien het hem naar het oordeel van de commandant
      niet mogelijk is geweest:


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 13.2.a
    text: |-
      in Duitsland, de Nederlandse Antillen of Aruba: een passende defensiewoning of, indien een zodanige woning naar het
      oordeel van de commandant niet beschikbaar is, een passende woning te huren;
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel13
  - number: 13.2.b
    text: 'in overige gebieden: een passende woning te huren,'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel13
  - number: '13.3'
    text: |-
      De aanspraak op de tegemoetkoming, bedoeld in het tweede lid, gaat in op de dag waarop de huur voor de eerste maal
      is verschuldigd, tenzij de defensie-ambtenaar dan nog geen aanspraak heeft op de voor hem vastgestelde toelage-
      buitenland, in welk geval de tegemoetkoming wordt toegekend met ingang van de dag waarop de aanspraak op die
      toelage-buitenland ontstaat.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel13
  - number: '13.4'
    text: |-
      De aanspraak op de tegemoetkoming, bedoeld in het tweede lid, eindigt op de dag waarop de huur niet langer is
      verschuldigd of de aanspraak op de toelage-buitenland vervalt.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel13
  - number: '13.5'
    text: |-
      De ongehuwde defensie - ambtenaar die is geplaatst in een gebied buiten Nederland en aldaar een eigen huishouding
      voert behoudt de aanspraak op de tegemoetkoming, bedoeld in het tweede lid, indien:
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel13
  - number: 13.5.a
    text: het verblijf van de defensieambtenaar buiten dat gebied de termijn van 6 maanden niet overschrijdt, dan wel,
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel13
  - number: 13.5.b
    text: |-
      de defensieambtenaar is ingezet in het kader van de
      [Regeling voorzieningen bij vredes- en humanitaire operaties][ref1], dan wel,


      [ref1]: https://wetten.overheid.nl/BWBR0039789
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0039789
  - number: 13.5.c
    text: |-
      de defensieambtenaar een bij- of omscholingsopleiding volgt met het oogmerk van de organisatie de defensieambtenaar
      terug te laten keren naar het land van plaatsing.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel13
  - number: '13.6'
    text: |-
      In geval van overlijden van de defensie-ambtenaar aan wie de tegemoetkoming, bedoeld in het tweede lid, is
      toegekend, wordt de betaling van die tegemoetkoming ten behoeve van zijn nagelaten gezinsleden gecontinueerd tot
      het tijdstip waarop zij de betrokken woning hebben ontruimd, maar ten hoogste voor een periode van drie maanden na
      de datum van overlijden.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel13
  - number: '13.7'
    text: |-
      In afwijking van het gestelde in het eerste lid, onderdeel d, is de eigen bijdrage 10%, indien de defensieambtenaar
      vanuit een eigendomswoning met een tegemoetkoming in de verplaatsingskosten is verhuisd naar het buitenland en hij
      gedurende zijn plaatsing, een deel van die plaatsing, of een aansluitende nieuwe plaatsing in het buitenland deze
      eigendomswoning aanhoudt en die woning niet verhuurt of ter beschikking stelt aan een ander dan een van de eigen-
      stief- of pleegkinderen van de defensieambtenaar.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel13
  - number: '14.1'
    text: |-
      Indien bij het in het gebied van plaatsing betrekken van een passende woning als bedoeld in
      [artikel 13, eerste lid, onder a][ref1], een waarborgsom voor de huurwoning moet worden gestort, kan een renteloze
      lening worden verstrekt aan:


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel13
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 14.1.a
    text: |-
      de defensie-ambtenaar die aanspraak heeft op de toelage-buitenland, bedoeld in
      [artikel 7, eerste lid, onderdelen a en b][ref1], en wiens gezinsleden zich naar verwachting voor ten minste zes
      achtereenvolgende maanden metterwoon in het gebied van plaatsing zullen vestigen of


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 14.1.b
    text: |-
      de defensie-ambtenaar die aanspraak heeft op de toelage-buitenland, bedoeld in
      [artikel 7, eerste lid, onderdelen d en f][ref1], die voor een tijdvak van ten minste zes achtereenvolgende maanden
      is geplaatst in een gebied buiten Nederland en die aldaar een eigen huishouding voert.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      Het bedrag van de lening is niet hoger dan het bedrag van de te storten waarborgsom, verminderd met het bedrag van
      de verschuldigde huur dat voor de betrokken woning voor één maand is verschuldigd en – in voorkomend geval – met de
      tegemoetkoming woninghuur waarop in die maand aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel14
  - number: '14.3'
    text: |-
      De lening wordt verstrekt en afgelost in de valuta waarin de waarborgsom is gestort. Indien zulks niet mogelijk
      is, wordt de lening verstrekt en afgelost in de tegenwaarde in Nederlandse valuta tegen de op dat moment geldende
      administratiekoers. Hieruit mogelijk voortvloeiende koersverschillen komen ten gunste of ten laste van het
      defensie.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel14
  - number: '14.4'
    text: |-
      De aflossing van de lening, met inbegrip van de eventueel daarover verkregen rente, geschiedt in eenmaal aan het
      eind van het verblijf in het gebied van plaatsing of bij het eerder verlaten van de woning.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel14
  - number: '15.1'
    text: |-
      De defensieambtenaar bedoeld in [artikel 7, eerste lid, onderdelen a, b en f][ref1], en die voor een tijdvak van
      langere duur dan zes maanden, maar van kortere duur dan anderhalf jaar binnen Europa, dan wel van kortere duur
      dan twee jaar buiten Europa, is geplaatst in een gebied buiten Nederland, heeft aanspraak op een maandelijkse
      tegemoetkoming in de doorlopende kosten. De tegemoetkoming bedraagt 10 procent van het voor hem geldende standaard
      netto Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '15.2'
    text: 'De aanspraak op de toelage, bedoeld in het eerste lid, bestaat niet, indien de defensie-ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel15
  - number: 15.2.a
    text: van rijkswege wordt gehuisvest of
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel15
  - number: 15.2.b
    text: |-
      aanspraak doet gelden op de verhuiskostenvergoeding, bedoeld in
      [artikel 2 van het Verplaatsingskostenbesluit militairen][ref1], dan wel [artikel 3, eerste lid][ref2], en
      [artikel 10 van het Verplaatsingskostenbesluit burgerlijke ambtenaren defensie][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005137#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006039#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006039#Artikel10
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005137
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006039
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0006039
        artikel: '10'
  - number: 15a.1
    text: |-
      De defensie-ambtenaar die geplaatst is in een gebied buiten Nederland, heeft bij aanvang van de plaatsing aanspraak
      op een eenmalige tegemoetkoming in de meerkosten beginperiode.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel15a
  - number: 15a.2
    text: |-
      De bedragen van deze tegemoetkoming zijn opgenomen in tabel 18. De tabelbedragen gelden voor een plaatsingsperiode
      van 36 maanden. Bij alle plaatsingsperiodes die afwijken van 36 maanden, wordt de tegemoetkoming evenredig
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel15a
  - number: 15a.3
    text: |-
      De hoogte van de tegemoetkoming wordt eenmalig, bij aanvang van de plaatsing, vastgesteld over de initiële
      plaatsingsduur.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel15a
  - number: 15a.4
    text: |-
      Indien de plaatsing door onvoorziene omstandigheden voortijdig wordt beëindigd, en deze omstandigheden niet aan de
      defensieambtenaar te wijten zijn, wordt de tegemoetkoming niet teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel15a
  - number: '16.1'
    text: |-
      In dit artikel wordt verstaan onder: - *erkende onderwijsinstelling* een door de overheid gesubsidieerde of naar
      het oordeel van de Minister daarmee gelijk te stellen instelling. Voor het buitenland wordt als erkend aangemerkt
      een Nederlandse of door Nederland gesubsidieerde school en bij het ontbreken daarvan een onderwijsinstelling voor
      lager of middelbaar onderwijs binnen of nabij de standplaats van de defensieambtenaar die - m.b.t. onderwijsaanbod,
      aansluiting op Nederlands onderwijs, kosten en plaatselijke omstandigheden door de commandant als passend wordt
      aangemerkt. Ter zake van universitair en hoger onderwijs een door de Minister erkende onderwijsinstelling.
        - *onderwijs* alle soorten van onderwijs aan een erkende onderwijsinstelling;
        - *onderwijskosten* voor het onderwijs verschuldigde schoolgelden, met inbegrip van de schoolgelden voor zogenaamde
      *summerschools* in de Verenigde Staten van Amerika en Canada en met uitzondering van de kosten van huisvesting,
      schoolmaaltijden en schooluniformen;
        - *bijkomende kosten* de, naar het oordeel van de commandant, noodzakelijke voor het onderwijs verschuldigde kosten
      van registratie, examenkosten en kosten van onderwijsmateriaal, met uitzondering van de kosten van huisvesting,
      schoolmaaltijden en schooluniformen;
        - *reiskosten* de noodzakelijk te maken reiskosten van huis naar school en terug;
        - *kind* een kind als bedoeld in [artikel 9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel9
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '16.2'
    text: |-
      De defensie-ambtenaar bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], die is geplaatst in een gebied buiten
      Nederland en die een of meer kinderen heeft die aldaar onderwijs genieten, heeft aanspraak op een tegemoetkoming in
      de daarmee verband houdende onderwijskosten, bijkomende kosten en de reiskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '16.3'
    text: De onderwijskosten worden vergoed naar de tarieven die door een erkende onderwijsinstelling worden gehanteerd.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
  - number: '16.4'
    text: |-
      Aanspraak op de tegemoetkoming, als bedoeld in het tweede lid, heeft ook de defensieambtenaar ter zake van de
      kosten van kleuteronderwijs voor zijn kind of kinderen met de leeftijd van drie jaren, indien het volgen van
      kleuteronderwijs door driejarigen in het gebied van plaatsing gebruikelijk is en met dien verstande dat de kosten
      van een crèche, peuterspeelzaal, kinderbewaarplaats en dergelijke niet in beschouwing worden genomen.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
  - number: '16.5'
    text: |-
      Bij het vaststellen van de onderwijskosten worden reeds op andere wijze genoten of nog te ontvangen bijdragen en
      uitkeringen – zoals studiebeurzen – daarop in mindering gebracht. Daarbij blijven premies voor en uitkeringen op
      grond van een studieverzekering en de basisbeurs buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
  - number: '16.6'
    text: 'Als reiskosten worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
  - number: 16.6.a
    text: 'voor de Verenigde Staten van Amerika en Canada:'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
  - number: 16.6.a.1°
    text: 'indien het onderwijs betreft tot en met het niveau van *highschool*: de kosten van het reizen per schoolbus;'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
  - number: 16.6.a.2°
    text: 'indien het onderwijs betreft als vervolg op de *high-school*:'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
  - number: 16.6.a.2°.(a)
    text: |-
      bij een afstand tussen de woning en de school van vijftien kilometer of minder, afhankelijk van het land van
      verblijf: de kosten per dagelijks af te leggen kilometer, waarvan het bedrag wordt vastgesteld met toepassing van
      [artikel 16 van de Verplaatsingskostenregeling defensie][ref1], met dien verstande dat de vermindering met de eigen
      bijdrage, genoemd in dat artikel, achterwege blijft;


      [ref1]: https://wetten.overheid.nl/BWBR0039786#Artikel16
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0039786
        artikel: '16'
  - number: 16.6.a.2°.(b)
    text: |-
      bij een afstand tussen de woning en de school van meer dan vijftien kilometer: de kosten, bedoeld onder (a),
      vermeerderd met de kosten voor een autoverzekering, indien het betrokken kind over een eigen auto beschikt;
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
  - number: 16.6.b
    text: |-
      voor overige gebieden: de kosten verbonden aan het vervoer per schoolbus, met dien verstande dat
      indien naar het oordeel van de commandant geen gebruik kan worden gemaakt van een schoolbus, aanspraak
      bestaat op een tegemoetkoming in de reiskosten, waarvan het bedrag wordt vastgesteld met toepassing van
      [artikel 16 van de Verplaatsingskostenregeling defensie][ref1], met dien verstande dat de vermindering met de eigen
      bijdrage, genoemd in dat artikel, achterwege blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0039786#Artikel16
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0039786
        artikel: '16'
  - number: '16.7'
    text: 'Het zesde lid, onder b, is niet van toepassing op de defensie-ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
  - number: 16.7.a
    text: die is geplaatst in de Nederlandse Antillen of Aruba of
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
  - number: 16.7.b
    text: wiens kind of kinderen onderwijs volgen op de zogenoemde Nederlandse scholen in Duitsland.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
  - number: '16.8'
    text: |-
      De defensie-ambtenaar bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], die voor tenminste zes maanden is
      geplaatst in het buitenland, en wiens kinderen in dat land verblijven en lager, middelbaar of hoger onderwijs
      volgen, terwijl op goede gronden kan worden aangenomen dat het gezinsverband aldaar tenminste drie maanden zal
      bestaan, heeft aanspraak op een tegemoetkoming in de, naar het oordeel van de commandant, noodzakelijk te maken
      kosten van aanschaf van de door de school voorgeschreven school- of sportkleding tot het maximumbedrag van € 350,–
      per schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '16.9'
    text: |-
      De defensie-ambtenaar bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], die voor tenminste zes maanden is
      geplaatst in de Verenigde Staten van Amerika en wiens kinderen aldaar verblijven en lager of middelbaar onderwijs
      volgen, terwijl op goede gronden kan worden aangenomen dat het gezinsverband aldaar tenminste drie maanden zal
      bestaan, heeft aanspraak op een tegemoetkoming in de, naar het oordeel van de commandant, noodzakelijk te maken
      kosten voor het volgen van het bijvak ‘Nederlandse taal en letterkunde’ tot het maximum bedrag van US$ 650 per
      schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '16.10'
    text: |-
      De commandant kan de defensie-ambtenaar bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], voorafgaande aan een
      plaatsing in het buitenland, toestemming verlenen advies in te winnen bij de Stichting Nederlands Onderwijs in het
      Buitenland indien, naar zijn oordeel, specifieke informatiebehoefte over onderwijsmogelijkheden in het buitenland
      benodigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '16.11'
    text: |-
      Kinderen van de uit het buitenland terugkerende defensieambtenaar die in het buitenland internationaal onderwijs
      hebben genoten zijn gerechtigd om die internationale opleiding aan een instelling voor Internationaal Voortgezet
      Gesubsidieerd Onderwijs in Nederland af te ronden uitsluitend voor klas 5 HAVO, klas 5 en/of 6 VWO of klas 5 en/
      of 6 van het Gymnasium. De vergoeding, die door de commandant voor ten hoogste twee jaar kan worden toegekend,
      bedraagt maximaal de kosten voor het verschuldigde schoolgeld verminderd met de normale voor een Nederlandse
      onderwijsinstelling verschuldigde ouderlijke bijdrage.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
  - number: '16.12'
    text: |-
      Door de commandant kan aan de partner en de kinderen van de defensieambtenaar aanspraak worden verleend op een
      vergoeding van de kosten van een taalcursus in de taal van het land waar de defensieambtenaar met zijn gezin is of
      wordt geplaatst indien dat, naar zijn oordeel, voor de integratie in dat land noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel16
  - number: '17.1'
    text: 'In dit artikel wordt mede verstaan onder *gebied binnen de keerkringen*:'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel17
  - number: 17.1.a
    text: |-
      de Verenigde Staten van Amerika bij een verblijf aldaar in een tijdvak waarin voor de Amerikaanse strijdkrachten
      regionaal het dragen van een tropentenue is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel17
  - number: 17.1.b
    text: |-
      andere gebieden met een warm klimaat, indien het hoofd defensieonderdeel heeft bepaald dat met de mogelijkheid van
      het voorschrijven van een tropentenue rekening moet worden gehouden.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel17
  - number: '17.2'
    text: |-
      De defensie-ambtenaar die voor een tijdvak van ten minste twee jaren wordt geplaatst in een gebied binnen
      de keerkringen, heeft voor zijn gezinsleden aanspraak op een tegemoetkoming in de kosten van aanschaf van de
      noodzakelijke kleding ter zake van het verblijf in dat gebied indien op goede gronden kan worden aangenomen dat het
      gezinsverband aldaar eveneens ten minste twee jaren zal bestaan.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel17
  - number: '17.3'
    text: |-
      De ambtenaar die voor een tijdvak van tenminste twee jaren wordt geplaatst in een gebied binnen de keerkringen,
      heeft voor zichzelf aanspraak op een tegemoetkoming in de kosten van de noodzakelijke kleding ter zake van het
      verblijf in dat gebied.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel17
  - number: '17.4'
    text: |-
      De bedragen van de tegemoetkoming zijn opgenomen in tabel 12. De tegemoetkoming wordt naar evenredigheid
      terugbetaald, indien om persoonlijke redenen de plaatsing of het verblijf van kortere duur is dan het tijdvak,
      bedoeld in het tweede onderscheidenlijk derde lid.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel17
  - number: '18'
    text: (vervallen)
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel18
  - number: '19'
    text: (vervallen)
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel19
  - number: '20.1'
    text: |-
      Aan de defensie-ambtenaar die voor ten minste zes achtereenvolgende maanden is of wordt geplaatst in een gebied
      buiten Nederland kan een renteloze lening worden verstrekt ter bestrijding van de aanloopkosten verbonden aan het
      verblijf in dat gebied.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel20
  - number: '20.2'
    text: |-
      De lening wordt berekend over ten hoogste twaalf maanden en bedraagt voor iedere maand dat de defensie-ambtenaar
      naar verwachting zal zijn geplaatst in dat gebied, niet meer dan één twaalfde deel van de som van het salaris en
      de toelage-buitenland, bedoeld in [artikel 7][ref1], waarop de defensie-ambtenaar op de datum van die plaatsing
      aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '20.3'
    text: |-
      De lening wordt niet eerder verstrekt dan één maand voor de datum van plaatsing of uiterlijk twee maanden nadat de
      defensie-ambtenaar, dan wel zijn gezinsleden – indien die pas na datum in het gebied van plaatsing aankomen – in
      dat gebied zijn aangekomen.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel20
  - number: '20.4'
    text: |-
      De aflossing van de lening geschiedt vóór het einde van de plaatsing in ten hoogste zesendertig gelijke
      maandelijkse opeenvolgende termijnen, aanvangende met de maand volgende op die waarin de lening is verstrekt.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel20
  - number: '20.5'
    text: |-
      Indien de lening niet wordt opgenomen in het tijdvak genoemd in het derde lid, dan kan aan de defensieambtenaar een
      renteloze lening worden verstrekt ter bestrijding van de aanloopkosten verbonden aan zijn terugkeer in Nederland.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel20
  - number: '20.6'
    text: |-
      De lening bedoeld in het vijfde lid bedraagt niet meer dan driemaal het salaris waarop de defensieambtenaar op de
      datum van plaatsing in Nederland aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel20
  - number: '20.7'
    text: |-
      De aflossing van de lening bedoeld in het vijfde lid geschiedt in ten hoogste 24 gelijke maandelijkse opeenvolgende
      termijnen, aanvangende met de maand volgende waarop die waarin de lening is verstrekt.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel20
  - number: '20.8'
    text: |-
      De lening bedoeld in het vijfde lid wordt naar rato verlaagd indien de defensieambtenaar binnen een periode van 24
      maanden na terugkeer in Nederland de dienst zal verlaten.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel20
  - number: 20a.1
    text: |-
      De defensieambtenaar die met aanspraak op een tegemoetkoming in de verhuiskosten is verhuisd naar een land buiten
      Europa, heeft aanspraak op een tegemoetkoming in de aanloopkosten.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel20a
  - number: 20a.2
    text: De tegemoetkoming bedoeld in het eerste lid, bedraagt € 1.404,63.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel20a
  - number: 20a.3
    text: De over deze tegemoetkoming verschuldigde loonheffing en inhoudingen komen voor rekening van Defensie.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel20a
  - number: '21.1'
    text: |-
      Aan de defensie-ambtenaar die voor het volgen van een opleiding of cursus is geplaatst in de Verenigde Staten van
      Amerika of Canada kan een lening worden verstrekt ter zake van de aankoop van een auto.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel21
  - number: '21.2'
    text: |-
      Het bedrag van de lening is niet hoger dan de aankoopprijs van de auto, met inachtneming van de maximumbedragen die
      zijn opgenomen in tabel 15.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel21
  - number: '21.3'
    text: Over de lening is een rente van 11 procent per jaar verschuldigd.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel21
  - number: '21.4'
    text: |-
      De aflossing van de lening geschiedt vóór het einde van de plaatsing in ten hoogste twaalf gelijke maandelijkse
      opeenvolgende termijnen, aanvangende met de maand volgende op die waarin de lening is verstrekt. Bij het
      vaststellen van het maandelijkse aflossingsbedrag kan desgewenst rekening worden gehouden met de vermoedelijke
      opbrengst van de verkoop van de auto bij het einde van de plaatsing. In dat geval wordt de maandelijkse aflossing
      vastgesteld op ten minste 50 procent van het maandelijkse aflossingsbedrag dat verschuldigd zou zijn, indien de
      gehele lening in maandelijkse termijnen zou worden afgelost.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel21
  - number: '22.1'
    text: |-
      De militair bedoeld in [artikel 7, eerste lid, onderdelen a en b][ref1], die voor een tijdsduur van ten minste
      twee jaar wordt geplaatst in de Verenigde Staten van Amerika, Canada, de Nederlandse Antillen of op Aruba heeft
      aanspraak op een renteloze lening ter zake van de aankoop van een tweede personenauto, indien op goede gronden kan
      worden aangenomen dat het gezinsverband aldaar eveneens ten minste twee jaar zal bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel7
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '22.2'
    text: |-
      Het bedrag van de lening is niet hoger dan de som van de aankoopprijs van de auto en de kosten voor een verzekering
      daarvan voor één jaar, met inachtneming van de maximumbedragen die zijn opgenomen in tabel 16.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel22
  - number: '22.3'
    text: |-
      De aflossing van de lening geschiedt vóór het einde van de plaatsing in ten hoogste zesendertig gelijke
      maandelijkse opeenvolgende termijnen, aanvangende met de maand volgende op die waarin de lening is verstrekt.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel22
  - number: '23.1'
    text: |-
      Dit hoofdstuk is van toepassing op de defensie-ambtenaar die in het buitenland wordt geplaatst of tewerkgesteld om
      voor een periode van drie maanden of meer werkzaamheden te verrichten bij een post, indien aan de werknemer van het
      Rijk die vergelijkbaar is met de betreffende defensie-ambtenaar aanspraak zou zijn verleend op de voorzieningen in
      de ACRU.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel23
  - number: '24.1'
    text: |-
      De defensie-ambtenaar heeft behalve op inkomsten op grond van het [Inkomstenbesluit militairen](onbekend),
      onderscheidenlijk het [Inkomstenbesluit burgerlijke ambtenaren defensie][ref1], in voorkomend geval aanspraak op
      voorzieningen op de voet van de ACRU.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '24.2'
    text: |-
      Bij toepassing van de aanspraken op de voet van de ACRU wordt het functieniveau van de defensie-ambtenaar bepaald
      met toepassing van tabel 17.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel24
  - number: '24.3'
    text: |-
      Bij toepassing van de koopkrachtgelijkstelling op de voet van de ACRU wordt het nettosalaris van de defensie-
      ambtenaar vastgesteld conform de berekening van het standaard netto Nederland in [artikel 1, onderdeel h][ref1].
      van deze regeling, zonder inachtneming van de daarin genoemde vermenigvuldigingsfactor.


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Artikel1
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0039849
        artikel: '1'
        hoofdstuk: '1'
  - number: '25'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25
  - number: 25.a
    text: |-
      *Groep 1, Wereld:* de defensieambtenaar, geplaatst buiten Nederland en aldaar wonend, niet zijnde een plaatsing op
      grond van [hoofdstuk 3][ref1] in een Verordeningsland;


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0039849
        hoofdstuk: '3'
  - number: 25.b
    text: |-
      *Groep 2, Diplomatieke posten:* de defensieambtenaar geplaatst buiten Nederland op grond van [hoofdstuk 3][ref1] en
      aldaar wonend;


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0039849
        hoofdstuk: '3'
  - number: 25.c
    text: |-
      *Groep 3,Verordeningslanden:* de defensieambtenaar geplaatst buiten Nederland in een Verordeningsland en aldaar
      wonend, niet zijnde een plaatsing op grond van [hoofdstuk 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039849#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0039849
        hoofdstuk: '3'
  - number: 25.d
    text: '*Groep 4, Grensgangers:* de defensieambtenaar geplaatst in Nederland en wonend in België of Duitsland.'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25
  - number: 25a.1
    text: |-
      Degene die behoort tot groep 1 of 2, heeft voor de aldaar met toestemming van de minister metterwoon verblijvende
      gezinsledenaanspraak op een collectieve zorgverzekering, tenzij het gezinslid:
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25a
  - number: 25a.1.a
    text: |-
      buiten Nederland arbeid verricht en de inkomsten uit deze arbeid meer bedragen dan het bedrag, genoemd in
      [artikel 8.14a, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 25a.1.b
    text: een uitkering ontvangt op grond van een buitenlandse wettelijke regeling inzake sociale zekerheid.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25a
  - number: 25a.2
    text: |-
      De omvang van de collectieve zorgverzekering, bedoeld in het eerste lid, alsmede de procedures met betrekking tot
      realisering van de aanspraak daar op zijn neergelegd in de door de minister met de aanbieder van de collectieve
      zorgverzekering overeengekomen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25a
  - number: 25a.3
    text: |-
      Degene die behoort tot groep 1 of 2 en van wie de gezinsleden gebruik maken van de collectieve zorgverzekering,
      bedoeld in het eerste lid, heeft voor deze gezinsleden tevens aanspraak op vergoeding van de gemaakte buitenlandse
      kosten van de voor hen verzekerde zorg, voor dat deel van de kosten dat het niveau van de verzekerde zorg in
      Nederland overstijgt, en voor zover niet uit andere hoofde aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25a
  - number: 25a.4
    text: |-
      Indien gebruik wordt gemaakt van de in het eerste lid bedoelde collectieve zorgverzekering is een premie
      verschuldigd van € 158,50 per maand per gezinslid, vanaf het moment dat het gezinslid de leeftijd van 18 jaar
      bereikt. De hoogte van dit bedrag zal jaarlijks door de minister worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25a
  - number: 25a.5
    text: |-
      Indien gebruik gemaakt wordt van de in het eerste lid bedoelde collectieve zorgverzekering dan geldt per verzekerde
      een verplicht eigen risico, als bedoeld in [artikel 1, onder g, van de Zorgverzekeringswet][ref1]. Het verplicht
      eigen risico wordt maandelijks verrekend met de declaratie die de verzekerde bij de aanbieder van de collectieve
      zorgverzekering heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
  - number: 25a.6
    text: |-
      De aanspraken opgenomen in het eerste, derde, vierde en vijfde lid zijn ook van toepassing op de burgerlijke
      ambtenaar behorend tot groep 1, 2 of 3.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25a
  - number: 25a.7
    text: |-
      Realisering van de aanspraak opgenomen in het derde lid wordt uitgevoerd door de rechtspersoon, bedoeld in
      [artikel 90a van het Algemeen militair ambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel90a
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 90a
  - number: 25b.1
    text: |-
      Degene die behoort tot groep 3, heeft voor de aldaar met toestemming van de minister metterwoon verblijvende
      gezinsleden aanspraak op een zorgkostenvoorziening. Degene die behoort tot groep 4, maakt eveneens aanspraak op een
      zorgkostenvoorziening voor de metterwoon verblijvende gezinsleden.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25b
  - number: 25b.2
    text: 'De in het eerste lid opgenomen aanspraken zijn van toepassing, tenzij het gezinslid:'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25b
  - number: 25b.2.a
    text: in dienstbetrekking of als zelfstandige werkt; of
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25b
  - number: 25b.2.b
    text: een werkloosheidsuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25b
  - number: 25b.3
    text: |-
      De omvang van de zorgkostenvoorziening, bedoeld in het eerste lid, alsmede de procedures met betrekking tot
      realisering van de aanspraak daar op zijn neergelegd in de voorwaarden, zoals geformuleerd door de aanbieder van de
      zorgkostenvoorziening en waarmee de minister heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25b
  - number: 25b.4
    text: |-
      Degene die behoort tot groep 3 of 4 en van wie de gezinsleden gebruik maken van de zorgkostenvoorziening, bedoeld
      in het eerste lid, heeft voor deze gezinsleden tevens aanspraak op vergoeding van de gemaakte buitenlandse kosten
      van de voor hen verzekerde zorg, voor dat deel van de kosten dat het niveau van de verzekerde zorg in Nederland
      overstijgt, en voor zover niet uit andere hoofde aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25b
  - number: 25b.5
    text: |-
      Indien gebruik wordt gemaakt van de in het eerste lid bedoelde zorgkostenvoorziening is een premievervangende
      bijdrage verschuldigd van € 158,50 per maand per gezinslid vanaf het moment dat het gezinslid de leeftijd van 18
      jaar bereikt. De hoogte van dit bedrag zal jaarlijks door de minister worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25b
  - number: 25b.6
    text: |-
      Indien gebruik gemaakt wordt van de in het eerste lid bedoelde zorgkostenvoorziening dan geldt per verzekerde een
      verplicht eigen risico, als bedoeld in [artikel 1, onder g, van de Zorgverzekeringswet][ref1]. Het verplicht eigen
      risico wordt jaarlijks achteraf ingehouden op het salaris van de defensieambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
  - number: 25b.7
    text: |-
      Realisering van de aanspraken opgenomen in het eerste en vierde lid worden uitgevoerd door de rechtspersoon,
      bedoeld in [artikel 90a van het Algemeen militair ambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel90a
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: 90a
  - number: 25c
    text: |-
      Degene die behoort tot groep 3, heeft voor de aldaar met toestemming van de minister metterwoon
      verblijvende gezinsleden aanspraak op vergoeding van de kosten voor vrijwillige verzekering voor de
      [Algemene ouderdomswet][ref1] en [Algemene nabestaandenwet][ref2], indien de door het gezinslid aangevraagde
      verzekering is goedgekeurd door de Sociale Verzekeringsbank, tenzij het gezinslid:


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: 25c.a
    text: in dienstbetrekking of als zelfstandige werkt; of
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25c
  - number: 25c.b
    text: een werkloosheidsuitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25c
  - number: 25d
    text: Dit hoofdstuk vindt uitsluitend toepassing in de periode van 1 januari 2026 tot en met 31 december 2027.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel25d
  - number: '26.1'
    text: |-
      De militair die vóór 1 oktober 1991 aanspraak had op de maandelijkse aanvullende toelage-buitenland op grond van
      de Regeling aanvullende toelage-buitenland militairen zeemacht, onderscheidenlijk Regeling aanvullende toelage-
      buitenland militairen land- en luchtmacht, zonder dat de toelage officieren-arts, -tandarts of -apotheker waarop
      hij gelijktijdig aanspraak had in de voor hem geldende pensioengrondslag was opgenomen, behoudt de aanspraak op die
      aanvullende toelage-buitenland.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel26
  - number: '26.2'
    text: |-
      De militair die aanspraak heeft op de toelage woninghuur Koninklijke marechaussee, bedoeld in artikel 39 van de
      Inkomstenregeling militairen, heeft aanspraak op een aanvullende toelage-buitenland, waarvan het bedrag wordt
      vastgesteld met toepassing van tabel 7.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel26
  - number: '27'
    text: (vervallen)
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel27
  - number: '28'
    text: |-
      De Minister is bevoegd te beslissen in die gevallen waarin deze regeling naar zijn oordeel niet of niet in
      redelijkheid voorziet
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel28
  - number: '29'
    text: 'Ingetrokken worden:'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel29
  - number: 29.a
    text: |-
      de ministeriële regeling van 28 augustus 1974, nr. 983972/978688 (Stationering van opvarenden van Nederlandse
      onderzeeboten die onder FOSM opereren);
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel29
  - number: 29.b
    text: de Tijdelijke maatregel ﬁnanciële voorzieningen Verenigde Staten van Amerika en Canada;
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel29
  - number: 29.c
    text: |-
      de ministeriële regeling van 27 juni 1986, nr. PB86/1510/2897 (Voorzieningen voor in het buitenland geplaatst
      burgerpersoneel);
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel29
  - number: 29.d
    text: |-
      de Regeling aanvullende toelage-buitenland militairen zeemacht, onderscheidenlijk de Regeling aanvullende toelage-
      buitenland militairen land- en luchtmacht;
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel29
  - number: 29.e
    text: de Regeling aanvullende voorzieningen Goose Bay;
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel29
  - number: 29.f
    text: de ministeriële regeling van 5 september 1984, nr. PP84/001/4382 (Aanvullende maandelijkse tegemoetkoming AFCENT);
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel29
  - number: 29.g
    text: het DBZ Voorzieningenstelsel Defensie (DBZV-DEF);
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel29
  - number: 29.h
    text: de Regeling faciliteiten genees- en tandheelkundige verstrekkingen buitenland;
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel29
  - number: 29.i
    text: de Regeling Voorzieningen UNTSO-waarnemers en
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel29
  - number: 29.j
    text: de ministeriële regeling van 25 februari 1982, nummer PP82/002/781 (Regeling Voorlopige voorzieningen Sinaï).
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel29
  - number: '30'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van ondertekening en werkt terug tot en met
      1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel30
  - number: '31'
    text: 'Deze regeling wordt aangehaald als: Voorzieningenstelsel buitenland defensiepersoneel (afgekort: VBD).'
    url: https://wetten.overheid.nl/BWBR0039849/2026-02-26#Artikel31
