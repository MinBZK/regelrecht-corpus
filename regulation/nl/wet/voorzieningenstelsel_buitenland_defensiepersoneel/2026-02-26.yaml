  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *hoofd defensieonderdeel* 1°. de Secretaris-Generaal, voor zover het
      betreft de Bestuursstaf; 2°. de commandant operationeel commando voor het desbetreffende commando; 3°. de directeur
      van de Defensie Materieel Organisatie, voor zover het betreft de Defensie Materieel Organisatie, met uitzondering
      van het deel ondergebracht in de Bestuursstaf; 4°. de commandant van het Defensie Ondersteuningscommando, voor
      zover het betreft het Defensie Ondersteuningscommando.
        - *commandant* de commandant van het dienstencentrum internationale ondersteuning defensie;
        - *defensie-ambtenaar* de militair of de ambtenaar;
        - *gezinsleden* de echtgenoot van de defensie-ambtenaar en de kinderen, stief- en pleegkinderen van de defensie-
      ambtenaar of van zijn echtgenoot;
        - *eigen huishouding voeren* hetgeen daaronder wordt verstaan in
      [artikel 1, eerste lid, van het Verplaatsingskostenbesluit defensie][ref1];
        - *gehuwde defensie-ambtenaar* de defensie-ambtenaar die met één of meer van zijn gezinsleden samenwoont en een
      eigen huishouding voert in een woning, of een gedeelte daarvan, waarover de gezinsleden de vrije en zelfstandige
      beschikking hebben;
        - *ongehuwde defensie-ambtenaar* iedere niet onder f bedoelde defensie-ambtenaar;
        - standaard netto Nederland 1°. voor de militair: (a) de bezoldiging; (b) de vaste vergoeding extra-
      beslaglegging; (c) de aanvullende WUL-compensatie; (d) de tijdelijke toelage loongebouw; (e) de maatregel
      voor negatieve inkomenseffecten pensioenpremie, verminderd met: (f) de premie voor het ouderdoms- en
      nabestaandenpensioen, die wordt ingehouden krachtens de [Kaderwet militaire pensioenen][ref2]; (g) de premie
      voor het bovenwettelijk arbeidsongeschiktheidspensioen, bedoeld in [artikel 23b van het Inkomstenbesluit
      militairen](onbekend); (h) de voor de militair verschuldigde premie, bedoeld in [artikel 4 van de Regeling][ref3]
      (i) [ziektekostenverzekering militairen][ref4], na aftrek van de werkgeversbijdrage als bedoeld in
      [artikel 5 van die regeling][ref5]; (j) de WGA-premie; (k) de over de voorgaande onderdelen verschuldigde
      loonheffing volgens de witte maandtabel voor inwoners van Nederland met loonheffingskorting, Vermeerderd met:
      (l) voor de gehuwde militair: het maximum bedrag algemene heffingskorting, en het resultaat vermenigvuldigd met
      de factor 1,1. 2°. Voor de ambtenaar: (a) de bezoldiging; (b) de inkomenstoeslag; (c) in voorkomend geval de
      vergoeding wegens overwerk, bedoeld in [artikel 49 van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref6],
      verminderd met: (d) de premie voor het ouderdoms- en nabestaandenpensioen, bedoeld in het pensioenreglement; (e)
      de premie voor het bovenwettelijk arbeidsongeschiktheidspensioen, bedoeld in het pensioenreglement; (f) de WGA-
      premie; (g) de over de voorgaande onderdelen verschuldigde loonheffing volgens de witte maandtabel voor inwoners
      van Nederland met loonheffingskorting, vermeerderd met: (h) voor de gehuwde ambtenaar: het maximum bedrag algemene
      heffingskorting, en het resultaat vermenigvuldigd met de factor 1,075.
        - *koopkrachtcomponent* het door de minister vastgestelde percentage van het Standaard Netto Nederland dat
      beoogt de koopkracht te behouden van een voor Nederland representatief geacht pakket van goederen en diensten van
      betrokkene en in voorkomend geval van zijn gezin;
        - *verblijfscomponent* het door de minister vastgestelde percentage van het Standaard Netto Nederland dat beoogt
      een tegemoetkoming te zijn voor de kosten die voortvloeien uit de verschillen in verblijfsomstandigheden tussen
      Nederland en het land van plaatsing;
        - *verplaatsingcomponent* het door de minister vastgestelde bedrag als tegemoetkoming in de kosten die het gevolg
      zijn van een plaatsing in het buitenland. Het betreft een tegemoetkoming voor de kosten die het gevolg zijn van:
      a. het eventuele verlies van schooljaren van de kinderen waardoor zij langer ten laste van de ouders blijven;
      b. het niet mogen of kunnen werken van de echtgeno(o)t(e) van de militair en de daaruit voortvloeiende derving
      van inkomsten en de kleinere kans op werk voor de echtgeno(o)t(e) bij terugkeer in Nederland; c. het worden
      geconfronteerd met een taal die men niet beheerst hetgeen in de beginperiode van de plaatsing buiten Nederland
      kan leiden tot meerkosten waaronder de uitgaven voor taalonderwijs; d. het bezit van een woning, met de daaraan
      verbonden kosten bij verkoop of verhuur (waaronder makelaars- en transactiekosten); e. de confrontatie met een
      hogere huur bij terugkeer uit het buitenland; f. de extra kosten die het gevolg zijn van de afstand tussen het land
      van plaatsing en het thuisland waar de achtergebleven familieleden verblijven; g. kosten a.g.v. de extra sociale
      verplichtingen in geval van plaatsing bij een niet Nederlands onderdeel;
        - *tegemoetkoming meerkosten beginperiode* dat deel van de verplaatsingcomponent dat ineens bij aanvang plaatsing
      in het buitenland wordt uitgekeerd ter bestrijding van de meerkosten in de beginperiode van de plaatsing;
        - *Wet FVP* de [Wet financiële voorzieningen privatisering ABP][ref7];
        - *Verordeningsland:* een land dat valt onder de territoriale werking van [Verordening (EG) nr. 883/2004]
      (32004R0883) van het Europees Parlement en de Raad van 29 april 2004, betreffende de coördinatie van de
      zekerheidsstelsels. Dit betreft de lidstaten van de Europese Unie, Zwitserland, het Verenigd Koninkrijk en de
      landen die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte: IJsland, Liechtenstein en
      Noorwegen;
        - *ACRU* de Aanvullende CAO Rijk Uitzendingen;
        - *post* een vertegenwoordiging van het Koninkrijk in het buitenland als bedoeld in Bijlage 1 van de ACRU;
        - *basisbeurs* de basisbeurs, bedoeld in [artikel 3.1 van de Wet studiefinanciering 2000][ref8],
      dan wel de tegemoetkoming scholieren, bedoeld in
      [artikel 1.1 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref9];
        - *metterwoon gevestigd* het daadwerkelijk wonen, zodanig dat de gezinsleden er het merendeel van de tijd de nacht
      doorbrengt, de maaltijden gebruikt en over het algemeen aldaar het leefpatroon heeft dat de gezinsleden volgens
      algemeen aanvaarde normen gewoonlijk op het huisadres pleegt te hebben;
        - *Europa* Europa inclusief Turkije;
        - *duurtecorrectie* %DC zoals opgenomen in tabel 2.


