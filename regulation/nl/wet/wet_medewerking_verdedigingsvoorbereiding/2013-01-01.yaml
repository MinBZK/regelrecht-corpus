---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_medewerking_verdedigingsvoorbereiding
regulatory_layer: WET
publication_date: '2021-03-17'
valid_from: '2013-01-01'
bwb_id: BWBR0001995
url: https://wetten.overheid.nl/BWBR0001995/2013-01-01
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is regelen te stellen met betrekking tot de
    medewerking van alle personen en lichamen aan de voorbereiding van de voorziening in geval van oorlog,
    oorlogsgevaar, daaraan verwante of daarmede verband houdende buitengewone omstandigheden in de behoeften van
    volkshuishouding en landsverdediging, zoomede aan de voorbereiding van de financiering dier voorziening;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel1
  - number: 1.a
    text: '"personen": ingezetenen des Rijks, alsmede binnen het Rijk in Europa verblijfhoudende niet-ingezetenen;'
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel1
  - number: 1.b
    text: '"lichamen":'
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel1
  - number: 1.b.1°
    text: publiekrechtelijke lichamen, met uitzondering van Staat, provinciën en gemeenten;
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel1
  - number: 1.b.2°
    text: binnen het Rijk in Europa gevestigde ondernemingen, diensten en instellingen;
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel1
  - number: 1.b.3°
    text: |-
      binnen het Rijk in Europa gevestigde filialen, bijkantoren of andere nederzettingen van een buiten het Rijk in
      Europa gevestigde onderneming, dienst of instelling.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel1
  - number: '2.1'
    text: |-
      Alle personen en lichamen, wier medewerking naar het oordeel van Onze Ministers van Economische Zaken, Landbouw
      en Innovatie, van Defensie of van Financiën noodzakelijk is ter voorbereiding van de voorziening in geval van
      buitengewone omstandigheden in de behoeften van volkshuishouding en landsverdediging, zoomede ter voorbereiding
      van de financiering dier voorziening, zijn verplicht deze medewerking te verleenen, indien zij overeenkomstig de
      bepalingen dezer wet wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel2
  - number: '2.2'
    text: 'De medewerking wordt gevorderd:'
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel2
  - number: 2.2.a
    text: |-
      met betrekking tot de behoeften der volkshuishouding, door Onze Minister van Economische Zaken, Landbouw en
      Innovatie;
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel2
  - number: 2.2.b
    text: met betrekking tot de behoeften der landsverdediging, door Onzen Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel2
  - number: 2.2.c
    text: met betrekking tot de financiering der in het eerste lid bedoelde voorziening, door Onzen Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel2
  - number: '2.3'
    text: |-
      De besturen van provinciën en gemeenten verleenen de in deze wet bedoelde medewerking, indien daartoe door Onze
      Ministers van Economische Zaken, Landbouw en Innovatie, van Defensie of van Financiën het verzoek wordt gedaan. Het
      bepaalde in lid 2 vindt te dezen overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel2
  - number: '2.4'
    text: |-
      Ten aanzien van de in het vorige lid bedoelde medewerking vindt het bepaalde in de [artikel 120][ref1] en
      [121 van de Provinciewet][ref2] en in de [artikelen 123][ref3] en [124 van de Gemeentewet][ref4] overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel120
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel123
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel124
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '120'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '121'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '123'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '124'
  - number: '3.1'
    text: |-
      Alvorens tot een vordering, als bedoeld in [artikel 2][ref1], wordt besloten, zal Onze daartoe aangewezen Minister
      overleg plegen met den betrokken persoon of het betrokken lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0001995#Artikel2
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001995
        artikel: '2'
  - number: '3.2'
    text: |-
      Wanneer zoodanig overleg zou moeten plaats hebben met een groep van personen of lichamen, die eenzelfde beroep,
      bedrijf of werkzaamheid uitoefenen of bij wie met betrekking tot de te vorderen medewerking overeenkomstige
      belangen aanwezig zijn, kan de Minister het overleg plegen met enkele dier personen of lichamen, door hem aan te
      wijzen. De aanwijzing geschiedt bij voorkeur, nadat de beroeps- of bedrijfsorganisaties der betrokkenen terzake
      zijn gehoord.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel3
  - number: '4'
    text: |-
      Indien op grond van het overleg, bedoeld in [artikel 3][ref1], vrijwillige medewerking wordt toegezegd, kan een
      vordering achterwege blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0001995#Artikel3
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001995
        artikel: '3'
  - number: '5.1'
    text: |-
      De in [artikel 2][ref1] bedoelde medewerking kan uitsluitend bestaan in:


      [ref1]: https://wetten.overheid.nl/BWBR0001995#Artikel2
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001995
        artikel: '2'
  - number: 5.1.a
    text: |-
      het verstrekken van zoodanige opgaven en inlichtingen, als met het oog op de in dat artikel bedoelde voorbereiding
      door den betrokken Minister noodzakelijk worden geacht;
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel5
  - number: 5.1.b
    text: |-
      het gedoogen van zoodanig persoonlijk onderzoek - inzage van zakelijke gegevens en bescheiden daaronder begrepen -
      door ambtenaren en deskundigen, daartoe door den betrokken Minister bij de vordering aan te wijzen, als met het oog
      op de in dat artikel bedoelde voorbereiding door dien Minister noodzakelijk wordt geacht;
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel5
  - number: 5.1.c
    text: |-
      het uitvoeren van opdrachten en het verrichten van werkzaamheden, welke verband houden met het onderzoek naar de
      productiemogelijkheden of met de voorbereiding van de aanpassing in geval van buitengewone omstandigheden aan de
      behoeften van volkshuishouding en landsverdediging;
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel5
  - number: 5.1.d
    text: het vormen en aanhouden van door den betrokken Minister te bepalen voorraden;
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel5
  - number: 5.1.e
    text: |-
      het voorbereiden van de geheele of gedeeltelijke overbrenging van bedrijven, werkzaamheden, administraties of
      voorraden, naar door den betrokken Minister aan te wijzen plaatsen;
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel5
  - number: 5.1.f
    text: |-
      het gedoogen van het treffen van eenvoudige, bij algemeenen maatregel van bestuur nader te bepalen voorbereidingen
      ten behoeve van de landsverdediging.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het verlenen van medewerking als bedoeld in het eerste lid, onder *a* en *b*, kan niet worden gevorderd van
      bankinstellingen, voor zover het de uitoefening van het bankbedrijf betreft. Voorts kunnen zij die uit hoofde van
      ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, het verlenen van medewerking als bedoeld in
      het eerste lid, onder *a* en *b*, weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel5
  - number: '5.3'
    text: |-
      De opdrachten en werkzaamheden, bedoeld in lid 1, onder *c*, kunnen niet strekken tot het telen van
      landbouwgewassen, noch tot het aanmaken van industrieele producten, anders dan bij wijze van proefneming.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel5
  - number: '6.1'
    text: |-
      Bij de beschikking houdende vordering tot het verlenen van medewerking wordt nauwkeurig omschreven, waartoe de
      vordering strekt, alsmede de wijze, waarop daaraan moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien eenzelfde vordering moet worden gericht tot een groep van personen of lichamen, die eenzelfde beroep,
      bedrijf of werkzaamheid uitoefenen of bij wie met betrekking tot de te vorderen medewerking overeenkomstige
      belangen aanwezig zijn, kan de bekendmaking daarvan geschieden door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel6
  - number: '6.3'
    text: Bij de vordering kunnen termijnen worden gesteld, binnen welke daaraan moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel6
  - number: '7.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens [artikel 2][ref1] zijn belast de ambtenaren en
      personen, aangewezen bij besluit van Onze Minister, bedoeld in [artikel 2, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001995#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001995#Artikel2
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001995
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001995
        artikel: '2'
  - number: '7.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:15][ref1], [5:18][ref2] en
      [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '9'
    text: |-
      De kosten, verbonden aan de in deze wet bedoelde medewerking, zullen niet worden vergoed, tenzij de daarbij
      betrokken Minister anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel9
  - number: '12.1'
    text: |-
      Hij die opzettelijk niet voldoet aan een vordering tot medewerking of aan de daaruit voortvloeiende verplichtingen,
      dan wel door handelen of nalaten opzettelijk bewerkt of opzettelijk medebewerkt, dat aan een zoodanige vordering of
      aan zoodanige verplichtingen niet wordt voldaan, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel12
  - number: '12.2'
    text: |-
      Hij aan wiens schuld te wijten is, dat aan een vordering tot medewerking of aan de daaruit voortvloeiende
      verplichtingen niet wordt voldaan, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van
      de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel12
  - number: '12.3'
    text: |-
      Hij die opzettelijk een toegezegde vrijwillige medewerking, als bedoeld in [artikel 4][ref1], niet verleent, dan
      wel door handelen of nalaten opzettelijk bewerkt of opzettelijk medebewerkt, dat een zoodanige medewerking niet
      wordt verleend, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001995#Artikel4
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001995
        artikel: '4'
  - number: '12.4'
    text: |-
      Hij aan wiens schuld te wijten is, dat een toegezegde vrijwillige medewerking, als bedoeld in [artikel 4][ref1],
      niet wordt verleend, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001995#Artikel4
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001995
        artikel: '4'
  - number: '12.5'
    text: |-
      Hij die - door zijn ambt, beroep of werkzaamheid betrokken bij de voldoening aan een vordering tot medewerking,
      aan een ander gedaan, of bij de verleening van door een ander toegezegde vrijwillige medewerking, als bedoeld in
      [artikel 4][ref1], - iets doet of nalaat, waardoor het voldoen aan die vordering of aan de daaruit voortvloeiende
      verplichtingen, dan wel het verleenen van die medewerking in gevaar wordt gebracht, wordt gestraft met hechtenis
      van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001995#Artikel4
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001995
        artikel: '4'
  - number: 12a
    text: |-
      De feiten, strafbaar gesteld bij de leden 1-4 van het vorige artikel, zijn misdrijven; het bij lid 5 strafbaar
      gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel12a
  - number: '13.1'
    text: |-
      Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de ambtenaren, daartoe aangewezen door een van Onze
      Ministers, belast met de uitvoering van deze wet. Deze ambtenaren zijn tevens belast met de opsporing van feiten,
      strafbaar gesteld in de [artikelen 179][ref2] tot en met [182][ref3] en [184 van het Wetboek van Strafrecht][ref4],
      voor zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel182
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '182'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '13.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel13
  - number: '13.3'
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5.16](onbekend), [5:17][ref3] en
      [5:20 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing ten aanzien van de in het eerste
      lid bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '13.4'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd bij het opsporen van de bij deze wet strafbaar gestelde
      feiten, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel13
  - number: '17'
    text: Deze wet treedt in werking met ingang van 1 Juli 1939.
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel17
  - number: '18'
    text: 'Deze wet wordt aangehaald als: Wet medewerking verdedigingsvoorbereiding.'
    url: https://wetten.overheid.nl/BWBR0001995/2013-01-01#Artikel18
