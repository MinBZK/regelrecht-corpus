preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Algemene pensioenwet politieke ambtsdragers te
    wijzigen in verband met de verhoging van de pensioengerechtigde leeftijd en de pensioenrichtleeftijd en in verband
    met enkele andere aspecten die de uitkering aan of het pensioen van politieke ambtsdragers betreffen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033719/2013-07-27#ArtikelAanhef
