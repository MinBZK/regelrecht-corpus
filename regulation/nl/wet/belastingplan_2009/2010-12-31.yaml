  - number: XXIX
    text: |-
      1 Deze wet treedt in werking met ingang van 1 januari 2009, met dien verstande dat:

      a. [artikel I, onderdelen A, P, Q, S, T, V, W en X][ref1], eerst toepassing vindt nadat
      [artikel 10.1 van de Wet inkomstenbelasting 2001][ref2] bij het begin van het kalenderjaar 2009 is toegepast;

      b. [artikel IV, onderdelen B, D, E, F en G][ref3], eerst toepassing vindt nadat
      [artikel 22d van de Wet op de loonbelasting 1964][ref4] bij het begin van het kalenderjaar 2009 is toegepast.

      2

      3 In afwijking van het eerste lid werkt [artikel VI, onderdeel A][ref5], terug tot en met 1 januari 2008.

      4 In afwijking van het eerste lid treedt [artikel VIII][ref6] in werking met ingang van 1 juli 2009.

      5 In afwijking van het eerste lid werkt [artikel IX, onderdelen A en B][ref7], terug tot en met 1 juli 2008.

      6 In afwijking van het eerste lid werken de
      [artikelen IX, onderdelen C, E, F, eerste lid, H tot en met J, L, P tot en met R][ref8], [X][ref9],
      [XXI, onderdeel A][ref10], en [XXIII, onderdelen D en E][ref11], terug tot en met 1 januari 2008.

      7 In afwijking van het eerste lid werkt [artikel IX, onderdeel N][ref12], terug tot en met 1 april 2008.

      8 In afwijking van het eerste lid treden de [artikelen XVIII, onderdelen C en D][ref13], en [XXVII][ref14] in
      werking met ingang van 1 april 2009.

      9 In afwijking van het eerste lid treedt [artikel XVIII, onderdeel F][ref15], in werking op een bij koninklijk
      besluit te bepalen tijdstip.

      10 In afwijking van het eerste lid werkt [artikel XXII, onderdeel B,][ref16] terug tot en met 16 september 2008
      voor aanslagen die op die datum nog niet onherroepelijk vaststaan.


