  - number: XXVI
    text: '*Vervallen*'
    url: https://wetten.overheid.nl/BWBR0024975/2010-12-31#ArtikelXXVI
  - number: XXVIIA
    text: |-
      Ingeval de samenloop van wetten die in 2008 in het Staatsblad zijn of worden gepubliceerd en wijzigingen aanbrengen
      in één of meer belastingwetten, niet of niet juist is geregeld, of als gevolg van die samenloop onjuistheden
      ontstaan in de aanduiding van artikelen, artikelonderdelen, verwijzingen en dergelijke in de desbetreffende wetten,
      kunnen die wetten op dit punt bij ministeriële regeling worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0024975/2010-12-31#ArtikelXXVIIA
  - number: XXVIII
    text: |-
      De wijziging ingevolge [artikel VI, onderdeel 0A][ref1], van
      [artikel 10, eerste lid, onderdeel j, van de Wet op de vennootschapsbelasting 1969][ref2] vindt geen toepassing
      met betrekking tot vóór 1 januari 2009 aan werknemers toegekende rechten welke zijn uitgeoefend of vervreemd vóór 1
      januari 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0024975#ArtikelVI
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel10
    url: https://wetten.overheid.nl/BWBR0024975/2010-12-31#ArtikelXXVIII
