  - number: XIII
    text: |-
      1 [Artikel 16a, eerste en tweede lid, van de Wet op de belasting van personenauto's en motorrijwielen 1992][ref1]
      is van overeenkomstige toepassing op de wijzigingen van het belastingbedrag in de [artikelen 9b][ref2],
      [9ba][ref3] en [9c van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref4] ingevolge
      [artikel XII, onderdelen Ba, C en D][ref5].

      2 [Artikel XII, onderdeel D][ref6], vindt geen toepassing ten aanzien van personenauto’s die vóór 1 januari 2009
      voor het eerst in gebruik zijn genomen.


