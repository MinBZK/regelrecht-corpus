preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het voor het jaar 2009 wenselijk is fiscale maatregelen te treffen in
    het kader van het inkomensbeleid en mede ter bevordering van innovatief ondernemerschap en arbeidsparticipatie,
    vergroening en vereenvoudiging;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024975/2010-12-31#ArtikelAanhef
articles:
  - number: X
    text: |-
      Voor de producent, bedoeld in [artikel 84a, eerste lid, van de Wet belastingen op milieugrondslag][ref1] die
      voor 1 april 2009 een verzoek als bedoeld in [artikel 84a, eerste lid][ref2], indient, kan het forfait ook worden
      vastgesteld over het kalenderjaar 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel84a
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel84a
    url: https://wetten.overheid.nl/BWBR0024975/2010-12-31#ArtikelX
