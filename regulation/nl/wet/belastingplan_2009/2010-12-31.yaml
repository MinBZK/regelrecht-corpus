  - number: XI
    text: |-
      [Artikel 90 van de Wet belastingen op milieugrondslag][ref1] vindt geen toepassing bij het begin van het
      kalenderjaar 2009 op de bedragen, genoemd in [artikel 86][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel86
