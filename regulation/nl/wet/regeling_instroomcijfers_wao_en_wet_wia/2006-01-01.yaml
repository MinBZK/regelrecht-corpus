        artikel: 80a
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '40'
  - number: '2'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen stelt jaarlijks een rapportage op betreffende de gegevens,
      bedoeld in [artikel 80a, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] en een rapportage
      betreffende de gegevens, bedoeld in [artikel 40 van de Wet werk en inkomen naar arbeidsvermogen][ref2].
      Deze gegevens worden gegroepeerd naar de sectoren, bedoeld in
      [artikel 95 van de Wet financiering sociale verzekeringen][ref3].

      2 De rapportages, genoemd in het eerste lid, zijn voorzien van een toelichting, waarin worden gemeld
      de in de [Wet instroomcijfers WAO][ref4] gehanteerde definitie en de voor het risico om recht te
      krijgen op uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref5] en de
      [Wet werk en inkomen naar arbeidsvermogen][ref6] relevante algemene en sectorale ontwikkelingen en gegevens.

      3 In de toelichting, bedoeld in het tweede lid, zal tevens worden opgenomen dat per werkgever geen rekening
      is gehouden met de samenstelling van het werknemersbestand, waaronder de verhouding mannen en vrouwen,
      de leeftijdsopbouw en het aandeel werknemers in dienst met een bovengemiddeld risico om recht te krijgen
      op uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref7] of op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref8]. Tevens zal worden opgenomen dat geen rekening is gehouden met de
      oorzaak en mate van arbeidsongeschiktheid en de omvang van het dienstverband.

      4 Daar waar een sector een substantieel aandeel werknemers kent met een bovengemiddeld risico om recht te
      krijgen op uitkering op grond van de [Wet op de arbeidsongeschiktheidsuitkering][ref9] of op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref10], zal dat in de toelichting bij het betreffende sectorale
      overzicht vermeld worden.

      5 Het Uitvoeringsinstituut werknemersverzekeringen maakt de rapportage, genoemd in het eerste lid, voorzien van
      de toelichting, genoemd in het tweede lid, voor 1 juli openbaar, nadat deze is toegestuurd aan de daarin vermelde
      werkgevers voorzover het de gegevens met betrekking tot de sector betreft waarbij de betrokken werkgever is
      aangesloten.

      6 Het Uitvoeringsinstituut werknemersverzekeringen maakt in de Staatscourant melding van de rapportage, van het
      jaar waarop deze betrekking heeft, alsmede van de wijze waarop het de rapportage openbaar heeft gemaakt.


