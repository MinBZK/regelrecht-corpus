preamble:
  text: |-
    Gelet op artikel 80a, eerste en tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014794/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De openbaarmaking van de gegevens, bedoeld in [artikel 80a van de Wet op de arbeidsongeschiktheidsverzekering][ref1]
      en [artikel 40 van de Wet werk en inkomen naar arbeidsvermogen][ref2], vindt plaats ten aanzien van werkgevers
      die gedurende het kalenderjaar dat voorafgaat aan het kalenderjaar waarop die openbaarmaking betrekking heeft,
      gemiddeld 250 werknemers of meer in dienst hadden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel40
    url: https://wetten.overheid.nl/BWBR0014794/2006-01-01#Artikel1
    references:
      - id: ref1
