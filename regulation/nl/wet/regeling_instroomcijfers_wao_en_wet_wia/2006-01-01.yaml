preamble:
  text: |-
    Gelet op artikel 80a, eerste en tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014794/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De openbaarmaking van de gegevens, bedoeld in [artikel 80a van de Wet op de arbeidsongeschiktheidsverzekering][ref1]
      en [artikel 40 van de Wet werk en inkomen naar arbeidsvermogen][ref2], vindt plaats ten aanzien van werkgevers
      die gedurende het kalenderjaar dat voorafgaat aan het kalenderjaar waarop die openbaarmaking betrekking heeft,
      gemiddeld 250 werknemers of meer in dienst hadden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel40
    url: https://wetten.overheid.nl/BWBR0014794/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 80a
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '40'
  - number: '2.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt jaarlijks een rapportage op betreffende de gegevens, bedoeld
      in [artikel 80a, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] en een rapportage betreffende
      de gegevens, bedoeld in [artikel 40 van de Wet werk en inkomen naar arbeidsvermogen][ref2]. Deze gegevens worden
      gegroepeerd naar de sectoren, bedoeld in [artikel 95 van de Wet financiering sociale verzekeringen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel95
    url: https://wetten.overheid.nl/BWBR0014794/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 80a
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '40'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '95'
  - number: '2.2'
    text: |-
      De rapportages, genoemd in het eerste lid, zijn voorzien van een toelichting, waarin worden gemeld
      de in de [Wet instroomcijfers WAO][ref1] gehanteerde definitie en de voor het risico om recht te
      krijgen op uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2] en de
      [Wet werk en inkomen naar arbeidsvermogen][ref3] relevante algemene en sectorale ontwikkelingen en gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0014451
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0014794/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014451
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0019057
  - number: '2.3'
    text: |-
      In de toelichting, bedoeld in het tweede lid, zal tevens worden opgenomen dat per werkgever geen rekening
      is gehouden met de samenstelling van het werknemersbestand, waaronder de verhouding mannen en vrouwen,
      de leeftijdsopbouw en het aandeel werknemers in dienst met een bovengemiddeld risico om recht te krijgen
      op uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] of op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref2]. Tevens zal worden opgenomen dat geen rekening is gehouden met de
      oorzaak en mate van arbeidsongeschiktheid en de omvang van het dienstverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0014794/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019057
  - number: '2.4'
    text: |-
      Daar waar een sector een substantieel aandeel werknemers kent met een bovengemiddeld risico om recht te
      krijgen op uitkering op grond van de [Wet op de arbeidsongeschiktheidsuitkering][ref1] of op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref2], zal dat in de toelichting bij het betreffende sectorale overzicht
      vermeld worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0014794/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019057
  - number: '2.5'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen maakt de rapportage, genoemd in het eerste lid, voorzien van de
      toelichting, genoemd in het tweede lid, voor 1 juli openbaar, nadat deze is toegestuurd aan de daarin vermelde
      werkgevers voorzover het de gegevens met betrekking tot de sector betreft waarbij de betrokken werkgever is
      aangesloten.
    url: https://wetten.overheid.nl/BWBR0014794/2006-01-01#Artikel2
  - number: '2.6'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen maakt in de Staatscourant melding van de rapportage, van het jaar
      waarop deze betrekking heeft, alsmede van de wijze waarop het de rapportage openbaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0014794/2006-01-01#Artikel2
  - number: '4'
    text: Deze regeling treedt in werking met ingang van 1 april 2003.
    url: https://wetten.overheid.nl/BWBR0014794/2006-01-01#Artikel4
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Regeling instroomcijfers WAO en Wet WIA.'
    url: https://wetten.overheid.nl/BWBR0014794/2006-01-01#Artikel5
