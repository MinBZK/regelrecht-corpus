$id: uitvoeringsregeling_openbaarheid_van_bestuur_binnenlandse_zaken
regulatory_layer: WET
publication_date: '2021-10-27'
valid_from: '1998-06-04'
bwb_id: BWBR0008536
url: https://wetten.overheid.nl/BWBR0008536/1998-06-04
preamble:
  text: |-
    Gelet op artikel 14 van de Wet openbaarheid van bestuur;

    Gezien de Aanwijzingen inzake openbaarheid van bestuur (Stcrt. 1992, 84);

    Besluit:

    vast te stellen de volgende regeling ter uitvoering van de Wet openbaarheid van bestuur.
  url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            de wet:

              de [Wet openbaarheid van bestuur][ref1];



            gemachtigd ambtenaar:

              een ambtenaar die door de minister tot het beslissen over verzoeken om informatie is gemachtigd;



            informatiepunt:

              een persoon of een plaats binnen het ministerie en binnen de daaronder ressorterende instellingen, diensten
      of bedrijven waar informatie kan worden verkregen;



            de minister:

              de Minister van Binnenlandse Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: '2'
    text: |-
      1 Er is een register waarin worden opgenomen:

      a. de onder verantwoordelijkheid van de minister werkzame instellingen, diensten en bedrijven;

      b. de niet-ambtelijke adviescommissies.

      2 Het register vermeldt de namen, adressen en informatiepunten van de instellingen, diensten en bedrijven.

      3 Het register ligt voor een ieder ter inzage in de leeszaal van de afdeling Bibliotheek van de directie
      Communicatie, Documentatie en Bibliotheek.

      4 Met het bijhouden van het register is belast de Directeur Communicatie, Documentatie en Bibliotheek.
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel2
  - number: '3'
    text: |-
      1 Als gemachtigd ambtenaar wordt aangewezen de Secretaris-Generaal, en bij diens afwezigheid of ontstentenis de
      plaatsvervangend Secretaris-Generaal.

      2 In de gevallen, bedoeld in [artikel 6][ref1], staat de Juridisch Adviseur de gemachtigd ambtenaar bij.


      [ref1]: https://wetten.overheid.nl/BWBR0008536#Artikel6
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008536
        artikel: '6'
        hoofdstuk: II
  - number: '4'
    text: |-
      1 De informatiepunten binnen het ministerie zijn:

      a. de afdeling Communicatiemanagement en Persvoorlichting van de Directie Communicatie, Documentatie en
      Bibliotheek;

      b. de afdeling Bibliotheek van de Directie Communicatie, Documentatie en Bibliotheek, voor zover het betreft ter
      inzage gelegde documenten.

      2 De informatiepunten voor de in het register vermelde instellingen, diensten en bedrijven worden aangewezen door
      de leiding daarvan.
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel4
  - number: '5'
    text: |-
      1 Het behandelen van verzoeken om informatie en vragen daaromtrent geschiedt door de dienstonderdelen die met
      voorlichting zijn belast, voor zover het niet door de bewindspersonen zelf geschiedt, of door hen in bepaalde
      gevallen aan anderen is opgedragen.

      2 Het in het eerste lid gestelde doet geen afbreuk aan de uit de normale taakuitoefening voortvloeiende plicht van
      de ambtenaar om aan particuliere personen en instanties met wie hij door zijn functie in contact komt, informatie
      op verzoek te verschaffen over de daarbij aan de orde zijnde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel5
  - number: '6'
    text: |-
      1 De in [artikel 5][ref1] bedoelde dienstonderdelen en ambtenaren leiden een verzoek om informatie met medeparaaf
      van de Juridisch Adviseur ter beslissing door naar de gemachtigd ambtenaar indien zij:

      a. in geval van een verzoek om informatie van oordeel zijn dat het verzoek op grond van de bij of krachtens de wet
      gestelde regels niet kan worden ingewilligd en de verzoeker om een schriftelijke beslissing vraagt;

      b. weten of redelijkerwijs kunnen vermoeden dat de geldende voorschriften ruimte laten voor verschillende uitleg
      over de vraag of een verzoek om informatie al dan niet behoort te worden ingewilligd;

      c. weten of redelijkerwijs kunnen vermoeden dat inwilliging of weigering van een verzoek om informatie belangrijke
      maatschappelijke, bestuurlijke of politieke gevolgen kan hebben.

      2 Indien tot een dienstonderdeel veel gelijksoortige verzoeken om informatie worden gericht, kan de gemachtigd
      ambtenaar de beslissing op verzoeken om informatie, bedoeld in het eerste lid, onder a, mandateren aan het
      betreffende hoofd van dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0008536#Artikel5
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008536
        artikel: '5'
        hoofdstuk: II
  - number: '7'
    text: |-
      De gemachtigd ambtenaar legt een verzoek om informatie aan de minister voor indien inwilliging of afwijzing daarvan
      belangrijke maatschappelijke, bestuurlijke of politieke gevolgen kan hebben. Over de afdoening van een verzoek van
      dien aard wordt overlegd met de Minister-President, Minister van Algemene Zaken.
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel7
  - number: '8'
    text: |-
      1 Als het document waarin de gevraagde gegevens zijn neergelegd berust onder de minister tot wie de verzoeker
      zich heeft gewend, maar het betrokken document tot stand gekomen is onder (eerste) verantwoordelijkheid van een
      andere minister, wordt de beslissing op het verzoek om informatie niet genomen dan nadat met de andere minister
      is overlegd.

      2 Leidt het overleg tot de slotsom dat de beslissing op het verzoek om informatie beter kan worden genomen door
      de andere minister, dan wordt de verzoeker naar hem verwezen. In het geval van een schriftelijk verzoek wordt dit
      doorgezonden onder mededeling van de doorzending aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel8
  - number: '9'
    text: |-
      Met de inning van gelden voor het verstrekken van kopieën, uittreksels of samenvattingen op verzoek op grond van
      het [Besluit tarieven openbaarheid van bestuur][ref1] is belast het hoofd van dienst van het dienstonderdeel dat
      het verzoek om informatie heeft behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005869
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005869
  - number: '10'
    text: |-
      Over openbaarmaking van adviezen van ambtelijke dan wel gemengde samengestelde adviescommissies werkzaam onder
      verantwoordelijkheid van de minister beslist de Secretaris-Generaal, onverminderd het bepaalde in artikel 4, tweede
      lid, onder g, van het Reglement van Orde voor de Raad van Ministers.
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel10
  - number: '11'
    text: |-
      De openbaarmaking van adviezen van niet-ambtelijke adviescommissies en het doen van mededeling daarvan in de
      Staatscourant geschieden door de zorg van de Directeur Communicatie, Documentatie en Bibliotheek.
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel11
  - number: '12'
    text: |-
      Adviezen, nota’s en rapporten die gezien hun omvang daarvoor in aanmerking komen, worden eventueel voorzien van een
      tevens voor openbaarmaking bestemde samenvatting.
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel12
  - number: '13'
    text: |-
      De Regeling van de Minister van Binnenlandse Zaken ter uitvoering van de [Wet openbaarheid van bestuur][ref1] van
      29 april 1980 (Stcrt. 89), wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: '14'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel14
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Uitvoeringsregeling openbaarheid van bestuur Binnenlandse Zaken.'
    url: https://wetten.overheid.nl/BWBR0008536/1998-06-04#Artikel15
