        artikel: 20a
      - id: ref4
        bwb_id: BWBR0003630
        artikel: '17'
      - id: ref5
        bwb_id: BWBR0003630
        artikel: 18a
  - number: '8'
    text: |-
      Indien de betrokkene op de datum van zijn ambtsjubileum buitengewoon verlof mede in het algemeen belang zonder
      behoud van bezoldiging dan wel levensloopverlof geniet, wordt voor de berekening van zijn ambtsjubileumgratificatie
      uitgegaan van de bezoldiging die hij genoot direct voorafgaand aan het verlof.
    url: https://wetten.overheid.nl/BWBR0004643/2010-10-10#Artikel8
  - number: '9'
    text: |-
      In uitzonderlijke gevallen, waarin toepassing van dit besluit tot kennelijke onbillijkheid zou leiden, kan van dit
      besluit worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0004643/2010-10-10#Artikel9
  - number: '10'
    text: Dit besluit treedt in werking met ingang van de dag nadat het in de Staatscourant is geplaatst.
    url: https://wetten.overheid.nl/BWBR0004643/2010-10-10#Artikel10
  - number: '11'
    text: Dit besluit kan worden aangehaald als Regeling gratificatie bij ambtsjubileum.
    url: https://wetten.overheid.nl/BWBR0004643/2010-10-10#Artikel11
