preamble:
  text: |-
    Gelet op artikel 79, derde lid, van het Algemeen Rijksambtenarenreglement, artikel 51, derde lid, van het
    Arbeidsovereenkomstenbesluit en artikel 114, derde lid, van het Ambtenarenreglement Staten-Generaal;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004643/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder betrokkene:

      a. de ambtenaar in de zin van het [Algemeen Rijksambtenarenreglement][ref1];

      b. de ambtenaar in de zin van het [Ambtenarenreglement Staten-Generaal][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0003229
    url: https://wetten.overheid.nl/BWBR0004643/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
      - id: ref2
        bwb_id: BWBR0003229
  - number: '2'
    text: |-
      1 Aan de betrokkene wordt bij het bereiken van een diensttijd van 12½, 25, 40 of 50 jaar een gratificatie toegekend
      wegens trouwe dienst. De gratificatie bedraagt 25% van de maandelijkse bezoldiging bij een 12½-jarig ambtsjubileum,
      70% van de maandelijkse bezoldiging bij een 25-jarig ambtsjubileum en 100% van de maandelijkse bezoldiging bij een
      40- of 50-jarig ambtsjubileum, naar boven af te ronden op een veelvoud van € 2,50.

      2 Het bepaalde in het eerste lid voor iedere functie waarin de betrokkene als zodanig werkzaam is.

      3 Indien aan de betrokkene bij een hem uit een eerdere betrekking verleend ontslag een diensttijdgratificatie is
      toegekend als bedoeld in het [tweede lid van de artikelen 79 van het Algemeen Rijksambtenarenreglement][ref1] of
      [114 van het Ambtenarenreglement Staten-Generaal][ref2] of in een daarmee overeenkomende regeling, wordt de in het
      eerste lid genoemde gratificatie verminderd met het bedrag van die diensttijdgratificatie voor zover dat bedrag
      betrekking heeft op de omvang van de betrekking en de diensttijd waarover de gratificatie bij ambtsjubileum is
      berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel114
    url: https://wetten.overheid.nl/BWBR0004643/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '79'
      - id: ref2
        bwb_id: BWBR0003229
        artikel: '114'
  - number: '3'
    text: |-
      1 Toekenning van een ambtsjubileum-gratificatie vindt niet plaats indien betrokkene ter zake van zijn
      dienstvervulling reeds een gratificatie of uitkering heeft ontvangen, welke naar haar aard overeenkomt met de
      gratificatie volgens dit besluit.

      2 Indien de betrokkene tijdens een hem mede in het algemeen belang verleend buitengewoon verlof jubileert, wordt
      op de datum van het ambtsjubileum geen gratificatie toegekend. Toekenning van de gratificatie kan alsnog geschieden
      zodra hij na de beëindiging van het verlof zijn werkzaamheden heeft hervat, tenzij hij in de betrekking welke
      tijdens het verlof werd vervuld, een gratificatie of uitkering heeft ontvangen welke naar haar aard overeenkomt met
      de gratificatie volgens dit besluit.
    url: https://wetten.overheid.nl/BWBR0004643/2010-10-10#Artikel3
  - number: '4'
    text: |-
      Als dienstijd voor de toepassing van een ambtsjubileumgratificatie geldt de tijd, doorgebracht:

      a. in een burgerlijke dienstbetrekking bij de Nederlandse overheid, waaronder te deze mede wordt begrepen de
      voormalige NV ‘Artillerie-Inrichtingen’;

      b. in een betrekking (vóór 1 januari 1966) als bedoeld in artikel 4, eerste lid, van de Pensioenwet 1922 (Stb.
      1922, 240), een betrekking als bedoeld in artikel B2 van de Algemene burgerlijke pensioenwet (Stb. 1966, 6) of een
      betrekking als bedoeld in artikel B3 van evengenoemde wet, alsmede (vóór en na 1 januari 1966) in een betrekking
      tot bedoeld in artikel U2 van die wet;

      c. in burgerlijke dienst bij de overheid in de landen Suriname (tot 25 november 1975), Aruba, Curaçao, Sint Maarten
      en de openbare lichamen Bonaire, Sint Eustatius en Saba, bij de voormalige gouvernementen van Suriname, Curaçao en
      Nieuw-Guinea en (tot 27 december 1949) bij de voormalige Indische Pensioenfondsen;

      d. in dienst bij het niet-openbaar onderwijs in de onder c genoemde landen en voormalige overzeese rijksdelen, voor
      zover zulks de betrokkene onder de werkingssfeer van een overheidspensioenregeling bracht of zou hebben gebracht
      indien hij in vaste dienst was geweest;

      e. tot en met 31 december 1954 in dienst van de Republiek Indonesië, voor zover die tijd door de
      [Garantiewet Burgerlijk Overheidspersoneel Indonesië][ref1] wordt bestreken;

      f. in Nederlandse militaire dienst of daarmede voor de toepassing van het [Algemeen Rijksambtenarenreglement][ref2]
      gelijkgestelde dienst, waaronder begrepen dienst bij het voormalig KNIL en de troepen in Suriname (tot 25 november
      1975) en Aruba, Curaçao, Sint Maarten en de openbare lichamen Bonaire, Sint Eustatius en Saba;

      g. als volontair met een volledige dagtaak;

      h. de tijd waaronder rechtsherstel is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002060
      [ref2]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0004643/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002060
      - id: ref2
        bwb_id: BWBR0001950
  - number: '5'
    text: |-
      1 Als diensttijd in de zin van dit besluit wordt niet aangemerkt dienstijd welke niet in actieve dienst is
      doorgebracht wegens het bekleden van een politiek ambt.

      2 Voorts komt als diensttijd niet in aanmerking tijd welke, zonder dat werkzaamheden zijn verricht, is doorgebracht
      buiten het genot van inkomsten uit de dienstbetrekking, behoudens voor zoveel het tijd betreft, gedurende welke
      betrokkene mede in het algemeen belang buitengewoon verlof dan wel levensloopverlof heeft genoten.

      3 Evenmin wordt als diensttijd aangemerkt fictieve diensttijd, onverminderd het gestelde in
      [artikel 4 onder h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004643#Artikel4
    url: https://wetten.overheid.nl/BWBR0004643/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004643
        artikel: '4'
  - number: '6'
    text: |-
      Diensttijd, gelijktijdig in meer dan één betrekking doorgebracht telt voor de vaststelling van de datum van het
      ambtsjubileum slechts eenmaal mede.
    url: https://wetten.overheid.nl/BWBR0004643/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 Voor de berekening van de gratificatie wordt onder bezoldiging verstaan: de bezoldiging in de zin van
      het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], welke voor betrokkene op de datum van het
      ambtsjubileum geldt, vermeerderd met de vakantie-uitkering en de eindejaarsuitkering, bedoeld in respectievelijk de
      [artikelen 21][ref2] en [20a van dat besluit][ref3].

      2 Indien betrokkene een toelage geniet als bedoeld in de [artikelen 17][ref4] en
      [18a van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref5], wordt dit bezoldigingsdeel vastgesteld
      op: het bedrag dat betrokkene in de drie kalendermaanden voorafgaande aan zijn jubileum aan bedoelde toelage
      gemiddeld per maand heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel20a
      [ref4]: https://wetten.overheid.nl/BWBR0003630#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
    url: https://wetten.overheid.nl/BWBR0004643/2010-10-10#Artikel7
    references:
