        artikel: '18.16'
  - number: '17'
    text: |-
      De ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, geven geen toestemming tot vertrek
      uit Nederland indien zij ernstige redenen hebben om te vermoeden dat in strijd met een der in de
      [artikelen 3, eerste lid][ref1] , en [4][ref2] omschreven verboden is of zal worden gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002975#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002975#Artikel4
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002975
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002975
        artikel: '4'
  - number: '18'
    text: |-
      Onze Minister doet jaarlijks verslag aan de Staten-Generaal over de aan deze wet gegeven toepassing. Dit verslag
      kan worden opgenomen als bijlage bij de memorie van toelichting op de Rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel18
  - number: '19'
    text: |-
      Een op grond van [artikel 1, vierde lid, van de Wet verontreiniging oppervlaktewateren][ref1] vóór het tijdstip van
      inwerkingtreding van deze wet verleende vergunning voor het in het water van de volle zee brengen van afvalstoffen,
      verontreinigende of schadelijke stoffen wordt voor de toepassing van deze wet gelijkgesteld met een ontheffing als
      bedoeld in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002975#Artikel4
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002975
        artikel: '4'
  - number: '21'
    text: Deze wet kan worden aangehaald als "Wet verontreiniging zeewater".
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel21
  - number: '22'
    text: Deze wet treedt in werking op een nader door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel22
