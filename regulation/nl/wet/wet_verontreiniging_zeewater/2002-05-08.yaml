preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het mede ter uitvoering van het op 15 februari 1972 te Oslo tot stand
    gekomen Verdrag, met bijlagen, ter voorkoming van verontreiniging van de zee tengevolge van het storten uit schepen
    en luchtvaartuigen (Trb. 1972, 62) noodzakelijk is voorschriften te stellen om de verontreiniging van de zee te
    voorkomen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      Onze Minister: Onze Minister van Verkeer en Waterstaat;

      het Verdrag: het op 15 februari 1972 te Oslo tot stand gekomen Verdrag, met bijlagen, ter voorkoming van
      verontreiniging van de zee tengevolge van het storten uit schepen en luchtvaartuigen (*Trb.* 1972, 62);

      lozen: zich ontdoen van stoffen door deze door of van vaartuigen of luchtvaartuigen in het water van de zee te
      brengen.

      2 Onder lozen wordt voor de toepassing van het bij of krachtens deze wet bepaalde mede verstaan het zich ontdoen
      van stoffen door deze op zee aan boord van een vaartuig te verbranden.

      3 Onder vaartuigen worden voor de toepassing van het bij of krachtens deze wet bepaalde mede verstaan:

      a. installaties, opgericht op de bodem van de territoriale zee of van dat deel van de Noordzee, waarvan de grenzen
      samenvallen met die van het aan Nederland toekomende gedeelte van het continentaal plat;

      b. luchtkussenvaartuigen.
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel1
  - number: '2'
    text: |-
      Deze wet is niet van toepassing op:

      a. het lozen, voorzover daaromtrent regelen zijn gesteld bij of krachtens de
      [Wet voorkoming verontreiniging door schepen][ref1] (*Stb.* 1983, 683);

      b. het lozen, het aan boord nemen en het ten vervoer afgeven van splijtstoffen, ertsen of radioactieve
      stoffen, voorzover voor een van die gedragingen een vergunning is vereist op grond van [artikel 15][ref2] of
      [artikel 29 van de Kernenergiewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003642
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel2
    references:
      - id: ref1
