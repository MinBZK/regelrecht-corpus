  - number: 8b
    text: |-
      Een beschikking tot verlening van een ontheffing of tot wijziging of aanvulling van de daaraan verbonden
      voorschriften ligt gedurende vier weken voor een ieder ter inzage. De terinzagelegging geschiedt op de dag van
      bekendmaking van de beschikking. Van de terinzagelegging wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel8b
  - number: '9'
    text: |-
      1 Onze Minister kan een ontheffing geheel of gedeeltelijk intrekken, indien:

      a. de te harer verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op het verzoek een andere
      beslissing zou zijn genomen als bij de beoordeling daarvan de juiste gegevens bekend waren geweest;

      b. de in [artikel 7, tweede lid][ref1], bedoelde voorschriften niet in acht worden genomen;

      c. op grond van een verandering van de omstandigheden of inzichten, opgetreden na de verlening der ontheffing, moet
      worden aangenomen dat het van kracht blijven der ontheffing het aan het tegengaan van de verontreiniging van de zee
      verbonden belang op onaanvaardbare wijze zou schaden, terwijl daaraan redelijkerwijs niet door het wijzigen of het
      aanvullen van de voorschriften kan worden tegemoet gekomen.

      2 Met betrekking tot een beschikking als bedoeld in het eerste lid, onder *a* en *b*, is [artikel 8][ref2] van
      overeenkomstige toepassing.

      3 Met betrekking tot een beschikking als bedoeld in het eerste lid, onder *c*, is [artikel 8][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002975#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002975#Artikel8b
      [ref3]: https://wetten.overheid.nl/BWBR0002975#Artikel8a
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel9
