  - number: 8a
    text: |-
      1 Paragraaf 3.5.6 van de [Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de Wet milieubeheer][ref2] zijn,
      behoudens het bepaalde in het tweede lid, van toepassing met betrekking tot de totstandkoming van een ambtshalve te
      geven beschikking tot wijziging of aanvulling van de aan een ontheffing verbonden voorschriften.

      2 In overeenkomstige gevallen als bedoeld in [artikel 8, derde lid][ref3], zijn paragraaf 3.5.6 van de
      [Algemene wet bestuursrecht][ref4] en [afdeling 13.2 van de Wet milieubeheer][ref5] niet van toepassing. In
      overeenkomstige gevallen als bedoeld in [artikel 8, vierde lid][ref6], kan Onze Minister in overeenstemming
      met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer bepalen dat die paragraaf van de
      [Algemene wet bestuursrecht][ref7] en die afdeling van de [Wet milieubeheer][ref8] niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
