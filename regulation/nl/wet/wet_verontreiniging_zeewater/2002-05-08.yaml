        artikel: '29'
  - number: '3'
    text: |-
      1 Het is verboden de bij algemene maatregel van bestuur aan te wijzen afvalstoffen, verontreinigende of schadelijke
      stoffen:

      a. te lozen, dan wel

      b. aan boord van een vaartuig of luchtvaartuig te nemen met het oogmerk om die stoffen te lozen, dan wel

      c. af te geven met het oogmerk om die stoffen te doen lozen.

      2 Bij een algemene maatregel van bestuur als bedoeld in het eerste lid kan worden bepaald dat met betrekking tot
      daarbij aangewezen stoffen de in dat lid gestelde verboden niet gelden indien deze stoffen op een daarbij aan te
      geven wijze worden of zullen worden geloosd.

      3 Het eerste lid is niet van toepassing op stoffen die slechts als sporen in andere stoffen voorkomen en die
      daaraan niet zijn toegevoegd met het doel om tezamen met die andere stoffen te worden geloosd.

      4 De voordracht tot een algemene maatregel van bestuur als bedoeld in het eerste lid wordt Ons gedaan door Onze
      Ministers van Verkeer en Waterstaat en van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel3
  - number: '4'
    text: |-
      Het is verboden afvalstoffen, verontreinigende of schadelijke stoffen, die niet vallen onder de in
      [artikel 3, eerste lid][ref1], bedoelde verboden:

      a. te lozen, dan wel

      b. aan boord van een vaartuig of luchtvaartuig te nemen met het oogmerk om die stoffen te lozen, dan wel

      c. af te geven met het oogmerk om die stoffen te doen lozen,

      tenzij voor dat lozen of voor dat aan boord nemen een ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002975#Artikel3
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002975
        artikel: '3'
  - number: '5'
    text: |-
      De in de [artikelen 3, eerste lid][ref1], en [4][ref2] omschreven verboden gelden niet voor het lozen van
      afvalstoffen, verontreinigende of schadelijke stoffen, voorzover die handeling samenhangt met of voortvloeit
      uit het normale gebruik van het vaartuig of luchtvaartuig, mits dat gebruik niet ten doel heeft het lozen van
      dergelijke stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002975#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002975#Artikel4
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002975
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002975
        artikel: '4'
  - number: '6'
    text: |-
      In de gevallen, waarin door overmacht het in [artikel 3, eerste lid][ref1], of het in [artikel 4][ref2] omschreven
      verbod om te lozen wordt overtreden, maakt de schipper van het vaartuig of de gezagvoerder van het luchtvaartuig
      van het voorval melding in het scheepsdagboek of het journaal. Tevens doet hij van dit voorval onverwijld
      mededeling aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002975#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002975#Artikel4
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002975
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002975
        artikel: '4'
  - number: 6a
    text: |-
      1 Degene aan wie gevaarlijke afvalstoffen in de zin van de [Wet milieubeheer][ref1] worden afgegeven met
      het oogmerk deze te doen lozen, is verplicht elke zodanige afgifte aan een door de provincie waarin hij die
      afvalstoffen in ontvangst neemt, aan te wijzen instantie te melden, met inachtneming van daartoe door Onze Minister
      vast te stellen regels.

      2 Van de melding, bedoeld in het eerste lid, wordt op diens verzoek mededeling gedaan aan Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.

      3 Het is een persoon als bedoeld in het eerste lid, verboden gevaarlijke afvalstoffen in
      ontvangst te nemen zonder dat hem daarbij een omschrijving en een begeleidingsbrief als bedoeld in
      [artikel 10.39 van de Wet milieubeheer][ref2] worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10.39
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10.39'
  - number: 6b
    text: |-
      Het is verboden afvalstoffen waarop de EEG-verordening overbrenging van afvalstoffen van toepassing is, binnen
      Nederlands grondgebied te brengen, indien dat naar het oordeel van Onze Minister, in overeenstemming met Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, in strijd zou zijn met het belang van de
      bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel6b
  - number: '7'
    text: |-
      1 Een ontheffing als bedoeld in [artikel 4][ref1] wordt verleend door Onze Minister, in overeenstemming met Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.

      2 Aan de ontheffing kunnen voorschriften worden verbonden. De voorschriften kunnen worden gewijzigd of aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0002975#Artikel4
    url: https://wetten.overheid.nl/BWBR0002975/2002-05-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002975
        artikel: '4'
  - number: '8'
    text: |-
      1 Bij regeling van Onze Minister wordt bepaald welke gegevens moeten worden verstrekt bij een verzoek om ontheffing
      of tot wijziging van de aan de ontheffing verbonden voorschriften. Bij regeling van Onze Minister kan worden
      bepaald dat een zodanig verzoek moet worden ingediend bij een daarbij aangewezen instantie.

      2 De paragrafen 3.5.2 tot en met 3.5.5 van de [Algemene wet bestuursrecht][ref1] en
      [afdeling 13.2 van de Wet milieubeheer][ref2] zijn, behoudens het bepaalde in het derde en vierde lid, van
      toepassing met betrekking tot de totstandkoming van een beschikking op een verzoek om verlening van een ontheffing
      onderscheidenlijk wijziging van de aan de ontheffing verbonden voorschriften.

      3 De paragrafen 3.5.2 tot en met 3.5.5 van de [Algemene wet bestuursrecht][ref3] en
      [afdeling 13.2 van de Wet milieubeheer][ref4] zijn niet van toepassing, indien het verzoek betrekking heeft op het
      in het buitenland aan boord van een Nederlands vaartuig of luchtvaartuig nemen van afvalstoffen, verontreinigende
      of schadelijke stoffen, met het oogmerk die stoffen te lozen, en de Staat op wier grondgebied dat aan boord nemen
      geschiedt, partij is bij:

      a. het op 15 februari 1972 te Oslo tot stand gekomen Verdrag, met bijlagen, ter voorkoming van verontreiniging van
      de zee tengevolge van het storten vanuit schepen of luchtvaartuigen (*Trb.* 1972, 62), dan wel bij

      b. het op 29 december 1972 te Londen tot stand gekomen verdrag, met bijlagen, ter voorkoming van verontreiniging
      van de zee door het storten van afval en vuil (*Trb.* 1973, 172).

      4 Voorts kan Onze Minister in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer bepalen dat de paragrafen 3.5.2 tot en met 3.5.5 van de [Algemene wet bestuursrecht][ref5] en
      [afdeling 13.2 van de Wet milieubeheer][ref6] niet van toepassing zijn indien het verzoek betrekking heeft op
      afvalstoffen, verontreinigende of schadelijke stoffen, waarvan door een ongewoon voorval de afvoer op korte termijn
      nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref3]: https://wetten.overheid.nl/BWBR0005537
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref5]: https://wetten.overheid.nl/BWBR0005537
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
