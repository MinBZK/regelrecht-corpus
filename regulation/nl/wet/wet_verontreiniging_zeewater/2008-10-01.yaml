preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het mede ter uitvoering van het op 15 februari 1972 te Oslo tot stand
    gekomen Verdrag, met bijlagen, ter voorkoming van verontreiniging van de zee tengevolge van het storten uit schepen
    en luchtvaartuigen (Trb. 1972, 62) noodzakelijk is voorschriften te stellen om de verontreiniging van de zee te
    voorkomen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002975/2008-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      lozen: het zich ontdoen van stoffen door deze vanaf of vanuit werken opgericht op de zeebodem, vaartuigen of
      luchtvaartuigen in zee te brengen, dan wel het zich in zee ontdoen van werken opgericht op de zeebodem, vaartuigen
      of luchtvaartuigen;

      Onze Minister: Onze Minister van Verkeer en Waterstaat;

      Protocol: het op 7 november 1996 te Londen tot stand gekomen Protocol bij het op 29 december 1972 te Londen tot
      stand gekomen Verdrag inzake de voorkoming van verontreiniging van de zee ten gevolge van het storten van afval en
      andere stoffen (Trb. 1998, 134 en Trb. 2000, 27);

      Verdrag: het op 22 september 1992 te Parijs tot stand gekomen Verdrag inzake de bescherming van het mariene milieu
      in het noordoostelijk deel van de Atlantische Oceaan (Trb. 1993, 16);

      VN-Zeerechtverdrag: het op 10 december 1982 te Montego-Bay tot stand gekomen Verdrag van de Verenigde Naties inzake
      het recht van de zee (Trb. 1983, 83);

      zee: alle mariene wateren, met uitzondering van de binnenwateren van staten, met inbegrip van de bodem en de
      ondergrond daarvan.

      2 Onder lozen wordt in deze wet en de daarop berustende bepalingen mede verstaan het zich ontdoen van stoffen door
      deze op zee op of vanaf een werk opgericht op de zeebodem of een vaartuig te verbranden.
    url: https://wetten.overheid.nl/BWBR0002975/2008-10-01#Artikel1
  - number: 1a
    text: |-
      1 Onverminderd het recht van andere staten om overeenkomstig het VN-Zeerechtverdrag tot rechtsvervolging over te
      gaan, is de Nederlandse strafwet toepasselijk op ieder die zich in of boven de Nederlandse exclusieve economische
      zone schuldig maakt aan overtreding van de voorschriften, gesteld bij of krachtens deze wet.

      2 Bij de opsporing en vervolging van strafbare feiten als bedoeld in het eerste lid wordt afdeling 7 van Deel XII
      van het VN-Zeerechtverdrag in acht genomen.
    url: https://wetten.overheid.nl/BWBR0002975/2008-10-01#Artikel1a
  - number: '2'
    text: |-
      Deze wet is niet van toepassing op:

      a. het lozen, voorzover daaromtrent regelen zijn gesteld bij of krachtens de
      [Wet voorkoming verontreiniging door schepen][ref1] (*Stb.* 1983, 683);

      b. het lozen, het aan boord nemen en het ten vervoer afgeven van splijtstoffen, ertsen of radioactieve stoffen,
      voorzover op een van die gedragingen [artikel 15][ref2] of [artikel 29 van de Kernenergiewet][ref3] van toepassing
      is;

      c. gedragingen aan boord van oorlogsschepen, marinehulpschepen en andere schepen die in gebruik zijn voor de
      uitvoering van de militaire taak;

      d. gedragingen waaromtrent regels zijn gesteld bij of krachtens de [Mijnbouwwet][ref4];

      e. het plaatsen van stoffen met een ander oogmerk dan het zich er enkel van ontdoen;

      f. het achterlaten van stoffen die aanvankelijk in zee zijn geplaatst met een ander oogmerk dan het zich ervan
      ontdoen.


      [ref1]: https://wetten.overheid.nl/BWBR0003642
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0002975/2008-10-01#Artikel2
