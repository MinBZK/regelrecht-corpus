      Deel XII van het VN-Zeerechtverdrag in acht.
    url: https://wetten.overheid.nl/BWBR0002975/2008-10-01#Artikel13
  - number: '17'
    text: |-
      De ambtenaren van de rijksbelastingdienst, bevoegd inzake douane, geven geen toestemming tot vertrek uit Nederland
      indien zij ernstige redenen hebben om te vermoeden dat in strijd met een in [artikel 3, eerste lid][ref1],
      omschreven verbod is of zal worden gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002975#Artikel3
