  - number: 8a
    text: |-
      1 Op de voorbereiding van een ambtshalve te geven beschikking tot wijziging of aanvulling van de aan
      een ontheffing verbonden voorschriften zijn [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en
      [afdeling 13.2 van de Wet milieubeheer][ref2] van toepassing, behoudens het bepaalde in het tweede lid.

      2 In overeenkomstige gevallen als bedoeld in [artikel 8, derde lid][ref3], zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] en [afdeling 13.2 van de Wet milieubeheer][ref5] niet
      van toepassing. In overeenkomstige gevallen als bedoeld in [artikel 8, vierde lid][ref6], kan Onze Minister in
      overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer bepalen dat die
      afdelingen niet van toepassing zijn.


