  - number: '7'
    text: |-
      1 Een ontheffing als bedoeld in [artikel 3][ref1] wordt verleend door Onze Minister, in overeenstemming met Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.

      2 Aan de ontheffing kunnen voorschriften worden verbonden. De voorschriften kunnen worden gewijzigd of aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0002975#Artikel3
    url: https://wetten.overheid.nl/BWBR0002975/2008-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002975
        artikel: '3'
  - number: '8'
    text: |-
      1 Bij regeling van Onze Minister wordt bepaald welke gegevens moeten worden verstrekt bij een verzoek om ontheffing
      of tot wijziging van de aan de ontheffing verbonden voorschriften. Bij regeling van Onze Minister kan worden
      bepaald dat een zodanig verzoek moet worden ingediend bij een daarbij aangewezen instantie.

      2 Op de voorbereiding van een beschikking op een verzoek om verlening van een ontheffing onderscheidenlijk wijziging
      van de aan de ontheffing verbonden voorschriften zijn [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en
      [afdeling 13.2 van de Wet milieubeheer][ref2] van toepassing, behoudens het bepaalde in het derde en vierde lid.

      3 [ Afdeling 3.4 van de Algemene wet bestuursrecht][ref3] en [afdeling 13.2 van de Wet milieubeheer][ref4] zijn
      niet van toepassing, indien het verzoek betrekking heeft op het in het buitenland aan boord van een Nederlands
      vaartuig of luchtvaartuig nemen van afvalstoffen, verontreinigende of schadelijke stoffen, met het oogmerk die
      stoffen te lozen, en de Staat op wier grondgebied dat aan boord nemen geschiedt, partij is bij het Protocol of
      het Verdrag.

      4 Voorts kan Onze Minister in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer bepalen dat [afdeling 3.4 van de Algemene wet bestuursrecht][ref5] en
      [afdeling 13.2 van de Wet milieubeheer][ref6] niet van toepassing zijn indien het verzoek betrekking heeft op
      afvalstoffen, verontreinigende of schadelijke stoffen, waarvan door een ongewoon voorval de afvoer op korte termijn
      nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
