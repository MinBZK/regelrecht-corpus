  - number: '3'
    text: |-
      1 Het is verboden afvalstoffen, verontreinigende of schadelijke stoffen:

      a. te lozen, dan wel

      b. aan boord van een vaartuig of luchtvaartuig te nemen met het oogmerk om die stoffen te lozen, dan wel

      c. af te geven met het oogmerk om die stoffen te doen lozen,

      tenzij voor dat lozen of voor dat aan boord nemen een ontheffing is verleend.

      2 Een ontheffing kan slechts worden verleend in overeenstemming met het Protocol en het Verdrag.
    url: https://wetten.overheid.nl/BWBR0002975/2008-10-01#Artikel3
  - number: '5'
    text: |-
      De in de [artikel 3, eerste lid][ref1], omschreven verboden gelden niet voor het lozen van afvalstoffen,
      verontreinigende of schadelijke stoffen, voorzover die handeling samenhangt met of voortvloeit uit het normale
      gebruik van het werk, vaartuig, of luchtvaartuig, mits dat gebruik niet ten doel heeft het lozen van dergelijke
      stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002975#Artikel3
    url: https://wetten.overheid.nl/BWBR0002975/2008-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002975
        artikel: '3'
  - number: '6'
    text: |-
      In de gevallen, waarin door overmacht het in [artikel 3, eerste lid, aanhef en onderdeel a][ref1], omschreven
      verbod wordt overtreden, maakt de schipper van het vaartuig of de gezagvoerder van het luchtvaartuig van het
      voorval melding in het scheepsdagboek of het journaal. Tevens doet hij van dit voorval onverwijld mededeling aan
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002975#Artikel3
    url: https://wetten.overheid.nl/BWBR0002975/2008-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002975
        artikel: '3'
  - number: 6a
    text: |-
      1 Degene aan wie gevaarlijke afvalstoffen in de zin van de [Wet milieubeheer][ref1] worden afgegeven met het
      oogmerk deze te doen lozen, is verplicht elke zodanige afgifte te melden aan de desbetreffende instantie, bedoeld
      in [artikel 10.40 van de Wet milieubeheer][ref2].

      2 Op een melding als bedoeld in het eerste lid zijn de regels die zijn vastgesteld krachtens
      [artikel 10.41 van de Wet milieubeheer][ref3] van overeenkomstige toepassing.

      3 Het is een persoon als bedoeld in het eerste lid, verboden gevaarlijke afvalstoffen in
      ontvangst te nemen zonder dat hem daarbij een omschrijving en een begeleidingsbrief als bedoeld in
      [artikel 10.39 van de Wet milieubeheer][ref4] worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10.40
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10.41
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10.39
    url: https://wetten.overheid.nl/BWBR0002975/2008-10-01#Artikel6a
