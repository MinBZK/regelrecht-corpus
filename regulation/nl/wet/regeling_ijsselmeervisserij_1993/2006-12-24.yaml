preamble:
  text: |-
    Gelet op artikel 6, derde lid, van het Reglement voor de Binnenvisserij 1985;

    Na overleg met het Produktschap voor Vis en Visprodukten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005886/2006-12-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *minister:*


              Minister van Landbouw, Natuurbeheer en Visserij;



            b

              *grote fuik:*


              aalfuik die met behulp van stokken of palen wordt uitgezet en verbonden is aan schutwant, al dan niet deel
      uitmakend van een fuikregel;



            c

              *schietfuik:*


              aalfuik die door een vleugel met een tweede aalfuik wordt verbonden, welke beide fuiken paarsgewijs worden
      uitgezet.
    url: https://wetten.overheid.nl/BWBR0005886/2006-12-24#Artikel1
  - number: '2.1'
    text: 'Het is verboden te vissen in het IJsselmeer met:'
    url: https://wetten.overheid.nl/BWBR0005886/2006-12-24#Artikel2
  - number: 2.1.a
    text: de grote fuik in de periode van 1 januari tot en met 30 april;
    url: https://wetten.overheid.nl/BWBR0005886/2006-12-24#Artikel2
  - number: 2.1.b
    text: de schietfuik in de periode van 1 oktober tot en met 30 april;
    url: https://wetten.overheid.nl/BWBR0005886/2006-12-24#Artikel2
  - number: 2.1.c
    text: het staand net in de periode van 16 maart tot en met 30 juni;
    url: https://wetten.overheid.nl/BWBR0005886/2006-12-24#Artikel2
  - number: 2.1.d
    text: het aalhoekwant in de periode van 1 november tot en met 11 april;
    url: https://wetten.overheid.nl/BWBR0005886/2006-12-24#Artikel2
  - number: 2.1.e
    text: het aalkistje in de periode van 1 november tot en met 11 april;
    url: https://wetten.overheid.nl/BWBR0005886/2006-12-24#Artikel2
  - number: 2.1.f
    text: de aaskuil in de periode van 1 november tot en met 11 april;
    url: https://wetten.overheid.nl/BWBR0005886/2006-12-24#Artikel2
  - number: 2.1.g
    text: de zegen in de periode van 16 maart tot en met 31 oktober.
    url: https://wetten.overheid.nl/BWBR0005886/2006-12-24#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden te vissen in het IJsselmeer met het staand net, het aalhoekwant of het aalkistje van vrijdagmiddag
      16.00 uur tot de daaropvolgende maandagmorgen 8.00 uur.
    url: https://wetten.overheid.nl/BWBR0005886/2006-12-24#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden te vissen in het IJsselmeer met de aaskuil van donderdag zonsondergang tot de daaropvolgende
      maandag 8.00 uur en voorts dagelijks van zonsondergang tot de daaropvolgende morgen 8.00 uur.
    url: https://wetten.overheid.nl/BWBR0005886/2006-12-24#Artikel2
  - number: '2.4'
    text: |-
      In afwijking van het bepaalde in het eerste lid, onderdelen a en b, is het toegestaan te vissen met de grote fuik
      en de schietfuik ten behoeve van de vangst van spiering gedurende een periode die de minister daartoe jaarlijks
      kan vaststellen, welke periode is gelegen in het tijdvak dat een aanvang neemt op 1 maart en eindigt uiterlijk vijf
      weken nadien.
    url: https://wetten.overheid.nl/BWBR0005886/2006-12-24#Artikel2
  - number: '2.5'
    text: |-
      In afwijking van het bepaalde in het eerste lid, onderdeel a, is het toegestaan in de periode van 1 januari tot
      en met 30 april te vissen met de grote fuik mits in het achterste deel van de fuik een netwerk, bestaande uit
      tenminste 80 mazen met een maaswijdte van tenminste 40 mm is aangebracht achter de laatste inkeling zodanig dat
      deze mazen in de te water staande fuik vierkant van vorm zijn en vis via deze mazen uit de fuik kan ontsnappen.
    url: https://wetten.overheid.nl/BWBR0005886/2006-12-24#Artikel2
