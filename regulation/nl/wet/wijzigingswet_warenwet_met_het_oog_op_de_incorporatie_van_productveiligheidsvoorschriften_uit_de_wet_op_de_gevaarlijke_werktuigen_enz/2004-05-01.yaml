  - number: II.3
    text: |-
      Na de inwerkingtreding van deze wet berusten de op grond van de [Wet op de gevaarlijke werktuigen][ref1],
      en de op grond van de in het vierde lid genoemde algemene maatregelen van bestuur verrichte keuringen,
      afgegeven certificaten van goedkeuring, aangebrachte merken van goedkeuring, verleende ontheffingen, gegeven
      beschikkingen en genomen besluiten op de [artikelen 1][ref2], [1a][ref3], [3 tot en met 11a][ref4], [14][ref5]
      en [16 van de Warenwet][ref6].


