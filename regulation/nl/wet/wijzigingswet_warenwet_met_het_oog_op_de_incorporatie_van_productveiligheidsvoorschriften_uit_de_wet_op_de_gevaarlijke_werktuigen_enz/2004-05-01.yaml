preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Warenwet te wijzigen, teneinde de voorschriften
    ten aanzien van productveiligheid uit de Wet op de gevaarlijke werktuigen daarin te incorporeren, zulks onder
    intrekking van deze wet en de Stoomwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012951/2004-05-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 De [Wet op de gevaarlijke werktuigen][ref1] wordt ingetrokken.

      2 De [Stoomwet][ref2] wordt ingetrokken.

      3 Na de inwerkingtreding van deze wet berusten de op grond van de [Wet op de gevaarlijke werktuigen][ref3],
      en de op grond van de in het vierde lid genoemde algemene maatregelen van bestuur verrichte keuringen,
      afgegeven certificaten van goedkeuring, aangebrachte merken van goedkeuring, verleende ontheffingen, gegeven
      beschikkingen en genomen besluiten op de [artikelen 1][ref4], [1a][ref5], [3 tot en met 11a][ref6], [14][ref7]
      en [16 van de Warenwet][ref8].

      4 Na de inwerkingtreding van deze wet berusten de volgende algemene maatregelen van bestuur en ministeriële
      regelingen op de [artikelen 1][ref9], [1a][ref10], [3 tot en met 11a][ref11], [13][ref12], [14][ref13] en
      [16 van de Warenwet][ref14]:

      a. het [Besluit schiethamers][ref15];

      b. de regeling van de Staatssecretaris van Sociale Zaken en Volksgezondheid van 19 april 1967, nr. 5340, ter
      uitvoering van de [Wet op de gevaarlijke werktuigen][ref16] en het [Besluit schiethamers][ref17] (Stcrt. 81);

      c. het [Besluit containers][ref18];

      d. de regeling van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, mevr. mr. A. Kappeyne van de Coppello
      van 28 januari 1985, nr. 84/15 335, ter uitvoering van de [Wet op de gevaarlijke werktuigen][ref19] en het
      [Besluit containers][ref20] (Stcrt. 23);

      e. het [Besluit drukvaten van eenvoudige vorm][ref21];

      f. de regeling van de Minister van Sociale Zaken en Werkgelegenheid van 30 september 1992, nr. 92/12 679, ter
      uitvoering van de [Wet op de gevaarlijke werktuigen][ref22] en het [Besluit drukvaten van eenvoudige vorm][ref23]
      (Stcrt. 208);

      g. het [Besluit explosieveilig materieel][ref24];

      h. de regeling van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 14 maart 1996, nr. 96/0292,
      houdende nadere regels ten aanzien van explosieveilig materieel (Stcrt. 57);

      i. het [Besluit liften][ref25];

      j. de regeling van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 12 december 1996, nr. 96/02 732,
      houdende nadere regels ten aanzien van liften (Stcrt. 243);

      k. het [Besluit veiligheid attractie- en speeltoestellen][ref26];

      l. de regeling van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 12 februari 1997, nr. 966008,
      houdende nadere regels ten aanzien van attractie- en speeltoestellen (Stcrt. 33);

      m. het [Besluit drukapparatuur][ref27];

      n. de regeling van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 23 november 1999, nr. 99/71 647,
      houdende nadere regels ten aanzien van drukapparatuur (Stcrt. 232).


