preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Warenwet te wijzigen, teneinde de voorschriften
    ten aanzien van productveiligheid uit de Wet op de gevaarlijke werktuigen daarin te incorporeren, zulks onder
    intrekking van deze wet en de Stoomwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012951/2004-05-01#ArtikelAanhef
