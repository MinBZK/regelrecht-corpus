---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_eenmalige_uitkering_spoorse_doorsnijdingen
regulatory_layer: WET
publication_date: '2006-02-21'
valid_from: '2013-12-15'
bwb_id: BWBR0019584
url: https://wetten.overheid.nl/BWBR0019584/2013-12-15
preamble:
  text: |-
    Gelet op artikel 17, vijfde lid van de Financiële-verhoudingswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel1
  - number: 1.a
    text: 'minister: de Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel1
  - number: 1.b
    text: 'MIT: het Meerjarenprogramma Infrastructuur en Transport;'
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel1
  - number: 1.c
    text: |-
      project: project gericht op het opheffen of verminderen van knelpunten rondom het spoor met betrekking tot
      stedelijke bereikbaarheid en/of een verbetering van de kwaliteit van leefomgeving en/of een verbetering van de
      veiligheid en/of een positief effect op het spoorgebruik;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel1
  - number: 1.d
    text: |-
      spoor: hoofdspoorwegen als aangewezen in het [Besluit aanwijzing hoofdspoorwegen][ref1] en de in onbruik geraakte
      spoorwegen;


      [ref1]: https://wetten.overheid.nl/BWBR0017794
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017794
  - number: 1.e
    text: 'plan: een beschrijving van de werkzaamheden die er toe leiden dat een project gerealiseerd wordt.'
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel1
  - number: '2'
    text: |-
      De minister kan op aanvraag een eenmalige specifieke uitkering ten behoeve van een project verstrekken aan
      gemeenten die aan het spoor gelokaliseerd zijn.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel2
  - number: '3.1'
    text: |-
      Het totale bedrag van de op grond van deze regeling te verlenen uitkeringen bedraagt € 300 miljoen (prijspeil
      2006).
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel3
  - number: '3.2'
    text: |-
      Het in het eerste lid genoemde bedrag wordt, voor zover het de reeds betaalde voorschotten overtreft, jaarlijks
      geïndexeerd met de Index Bruto Overheidsinvesteringen, met dien verstande dat de indexering niet meer kan bedragen
      dan het bedrag dat de begrotingswetgever voor die indexering beschikbaar heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel3
  - number: '4.1'
    text: |-
      De uitkering bedraagt ten hoogste 25% van de totale kosten van een project met dien verstande dat in de beschikking
      tot verlening van de uitkering het bedrag staat vermeld waarop de uitkering ten hoogste kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: '4.2'
    text: Het in het eerste lid genoemde bedrag kan niet meer bedragen dan € 40 miljoen per project.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: '4.3'
    text: 'Tot de kosten, bedoeld in het eerste lid, behoren de kosten van:'
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.3.a
    text: studies voor zover die door de minister aanvaardbaar worden geacht;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.3.b
    text: verwerving van een onroerende zaak voor zover die door de minister aanvaardbaar wordt geacht;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.3.c
    text: vergunningen en leges voorzover door de minister aanvaardbaar geacht;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.3.d
    text: |-
      bouwrente; deze is gelijk aan de rente van de meest recente staatslening op het moment van gunning van het werk;
      het bedrag en de termijn waarover de bouwrente vergoed wordt, behoeft de goedkeuring van de minister;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.3.e
    text: materialen;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.3.f
    text: werkzaamheden van aanleg, bouw, wijziging of inrichting van de betrokken infrastructuur;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.3.g
    text: bijkomende voorzieningen nodig om de betrokken infrastructuur na voltooiing zijn functie te kunnen laten vervullen;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.3.h
    text: met het project samenhangende door de minister redelijk geachte schadevergoedingen aan derden;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.3.i
    text: voorlichting over de uitvoering van het project als begeleiding gedurende de bouw;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.3.j
    text: |-
      de omzetbelasting die niet op voet van [artikel 15, eerste lid, van de Wet op de omzetbelasting 1968][ref1], in
      aftrek kan worden gebracht en geen recht geeft op een bijdrage uit het BTW-compensatiefonds, waarbij de toepassing
      van [artikel 2, tiende lid, van de Wet op het BTW-compensatiefonds][ref2], buiten aanmerking blijft;


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0013817#Artikel2
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0013817
        artikel: '2'
  - number: 4.3.k
    text: |-
      de voorbereiding, administratie en toezicht voor zover gerelateerd aan het project. Het percentage is afhankelijk
      van de hoogte van de bouwkosten:
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.3.k.I
    text: Projecten met bouwsom van meer dan € 100 miljoen tot een maximum van 13,75%;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.3.k.II
    text: Projecten met bouwsom tussen de € 10 en € 100 miljoen tot een maximum van 17%;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.3.k.III
    text: Projecten met bouwsom kleiner dan € 10 miljoen tot een maximum van 24%.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.3.l
    text: |-
      onvoorziene omstandigheden voorzover deze betrekking hebben op de kosten veroorzakende factoren genoemd in de
      onderdelen a tot en met i, waarbij een maximum geldt van 10%.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: '4.4'
    text: 'Tot de kosten, bedoeld in het eerste lid, behoren niet:'
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.4.a
    text: kosten van algemene bestuurlijke aard;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.4.b
    text: |-
      de kosten die reeds op grond van een andere regeling voor een financiële bijdrage van het Rijk of de Europese Unie
      in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: 4.4.c
    text: de kosten gemaakt in verband met het verkrijgen van een accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: '4.5'
    text: |-
      Indien voor de uitvoering van het project door het Rijk uit andere hoofde bijdragen worden verleend, wordt de
      uitkering op grond van deze regeling zodanig verlaagd dat de totale bijdrage van het Rijk niet meer dan 50% van de
      totale kosten bedraagt.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel4
  - number: '5.1'
    text: |-
      Een gemeente die een aanvraag voor een uitkering wil indienen, maakt dit voor 1 mei 2006 schriftelijk kenbaar aan
      de minister.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel5
  - number: '5.2'
    text: De aanvraag voor een uitkering wordt aan de minister gericht en ingediend bij het Directoraat-Generaal Mobiliteit.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel5
  - number: '5.3'
    text: |-
      De aanvraag bevat ten minste een volledig ingevuld aanvraagformulier, zoals opgenomen in [bijlage 1][ref1] van deze
      regeling en is ondertekend door het bestuur van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0019584
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019584
  - number: '5.4'
    text: |-
      De minister kan bepalen dat er in aanvulling op de in het derde lid bedoelde gegevens, andere voor de beoordeling
      van de aanvraag noodzakelijke gegevens worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel5
  - number: '5.5'
    text: De aanvraag wordt ingediend vóór 1 juni 2006.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel5
  - number: '6.1'
    text: 'De uitkering wordt niet verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel6
  - number: 6.1.a
    text: het project of onderdelen van het project zijn opgenomen in het MIT;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel6
  - number: 6.1.b
    text: |-
      gegronde reden bestaat om aan te nemen dat de aanvrager naast de uitkering onvoldoende financiële middelen ter
      beschikking staan ter uitvoering van het project;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel6
  - number: 6.1.c
    text: |-
      gegronde reden bestaat om aan te nemen dat de voor de uitvoering van het project benodigde besluiten niet zullen
      worden verkregen;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel6
  - number: 6.1.d
    text: het project naar het oordeel van de minister strijdig is met het vigerende rijksbeleid;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel6
  - number: 6.1.e
    text: de uitvoeringswerkzaamheden voor het project al voor publicatiedatum van deze regeling zijn gestart.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel6
  - number: '6.2'
    text: |-
      [Artikel 4:35 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '7.1'
    text: |-
      Na het verstrijken van de periode van indiening, bedoeld in [artikel 5][ref1], worden de aanvragen in rangorde
      geplaatst. Daarbij worden de aanvragen beoordeeld naar de mate waarin de voorgestelde projecten voldoen aan de
      volgende criteria:


      [ref1]: https://wetten.overheid.nl/BWBR0019584#Artikel5
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019584
        artikel: '5'
  - number: 7.1.a
    text: de bijdrage aan stedelijke bereikbaarheid;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel7
  - number: 7.1.b
    text: de bijdrage aan kwaliteit van leefomgeving;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel7
  - number: 7.1.c
    text: de bijdrage aan veiligheid;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel7
  - number: 7.1.d
    text: de bijdrage aan het spoorgebruik.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel7
  - number: '7.2'
    text: |-
      De criteria bedoeld in het eerste lid, zijn nader uitgewerkt in [bijlage 2][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019584
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019584
  - number: '7.3'
    text: |-
      Om in de rangorde te kunnen worden opgenomen dient het project in ieder geval een bijdrage te leveren aan de
      stedelijke bereikbaarheid en een bijdrage aan een van de andere criteria bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel7
  - number: '7.4'
    text: De rangorde wordt vastgesteld op basis van de verwachte effectiviteit van het project.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel7
  - number: '7.5'
    text: |-
      Nadat de projecten onderling vergeleken en gerangschikt zijn, wordt het plafond verdeeld in volgorde van de
      projecten met de hoogste score op effectiviteit.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel7
  - number: '7.6'
    text: |-
      Indien in de rangorde een aanvraag aan de orde is, waarvoor een hoger bedrag wordt aangevraagd dan het bedrag dat
      met toepassing van het plafond resteert, wordt het toe te kennen bedrag bepaald gelijk aan het bedrag dat resteert.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel7
  - number: '7.7'
    text: De minister wijst de resterende aanvragen af.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel7
  - number: '8.1'
    text: De minister beslist op een aanvraag voor een uitkering voor 1 februari 2007.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel8
  - number: '8.2'
    text: |-
      De uitkering wordt toegekend onder de voorwaarde dat voor het deel van de uitkering dat ten laste van een nog niet
      vastgestelde begroting komt, voldoende gelden ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel8
  - number: '8.3'
    text: |-
      De verstrekte uitkering wordt jaarlijks geïndexeerd overeenkomstig [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019584#Artikel3
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019584
        artikel: '3'
  - number: '9'
    text: 'De minister kan bij de verstrekking van de uitkering verplichtingen opleggen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel9
  - number: 9.a
    text: het moment waarop de uitkeringsontvanger aanvangt met de uitvoering van het project;
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel9
  - number: 9.b
    text: |-
      dat de uitkeringsontvanger handelt in overeenstemming met het ingediende project en het daarbij horende plan en het
      project uitvoert overeenkomstig het ingediende project.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel9
  - number: 9.c
    text: de verantwoording op de uitkering.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel9
  - number: '10'
    text: |-
      [Artikel 4:48 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '11.1'
    text: |-
      De minister kan in het jaar waarin de uitvoeringswerkzaamheden van het project aanvangen, een voorschot van 100% op
      de toegekende uitkering verlenen.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel11
  - number: '11.2'
    text: |-
      Het voorschot wordt voor aanvang van de uitvoering van het project betaalbaar gesteld. De uitkeringsontvanger dient
      hiertoe ten minste vier weken voor de aanvang schriftelijk een verzoek tot betaalbaarstelling in bij de minister.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel11
  - number: '12.1'
    text: |-
      De uitkeringsontvanger neemt in de verantwoordingsinformatie, bedoeld in
      [artikel 58a van het Besluit begroting en verantwoording provincies en gemeenten][ref1], informatie op over het
      project.


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel58a
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014606
        artikel: 58a
  - number: '12.2'
    text: |-
      Indien in de verantwoordingsinformatie, bedoeld in het eerste lid is opgenomen dat het project is afgerond, geldt
      deze mededeling als een aanvraag tot vaststelling van de uitkering.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel12
  - number: '12.3'
    text: |-
      De [artikelen 4:46][ref1], [4:47][ref2] en [4:49 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '13.1'
    text: De minister neemt binnen twaalf weken na ontvangst een beslissing op de aanvraag tot vaststelling van de uitkering.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel13
  - number: '13.2'
    text: |-
      Indien de beslissing niet binnen twaalf weken kan worden gegeven, stelt de minister de aanvrager daarvan in kennis
      en noemt hij een redelijke termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel13
  - number: '13.3'
    text: |-
      Het bedrag van de uitkering wordt overeenkomstig de vaststelling, binnen 6 weken na vaststelling, betaald onder
      verrekening van de betaalde voorschotten.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel13
  - number: '14.1'
    text: |-
      [Artikel 4:57 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '14.2'
    text: |-
      Bij vaststelling van de uitkering wordt bepaald dat over onverschuldigd betaalde uitkeringsbedragen de
      rente verschuldigd is welke, ingevolge [artikel 11, derde lid][ref1], door de Minister van Financiën aan de
      uitkeringsontvanger is vergoed, vanaf het moment van betaling van het voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0019584#Artikel11
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0019584
        artikel: '11'
  - number: '15'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel15
  - number: '16'
    text: 'Deze regeling wordt aangehaald als: Regeling eenmalige uitkering spoorse doorsnijdingen.'
    url: https://wetten.overheid.nl/BWBR0019584/2013-12-15#Artikel16
