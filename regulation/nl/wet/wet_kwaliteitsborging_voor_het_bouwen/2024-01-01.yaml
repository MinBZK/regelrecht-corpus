preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de verbetering van de bouwkwaliteit wenselijk is
    te regelen dat voor het bouwen van aan te wijzen categorieën bouwwerken gebruik wordt gemaakt van een toegelaten
    instrument voor kwaliteitsborging, dat voor die categorieën bouwwerken de beoordeling door het bevoegd gezag of
    het bouwen van het bouwwerk waarop de aanvraag om een omgevingsvergunning betrekking heeft, voldoet aan de bij of
    krachtens artikel 2 of 120 van de Woningwet gestelde voorschriften wordt vervangen door een beoordeling of voldaan
    wordt aan voor de toepassing van het instrument voor kwaliteitsborging gestelde eisen, en dat de privaatrechtelijke
    positie van de opdrachtgever wordt versterkt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0042732/2024-01-01#ArtikelAanhef
articles:
  - number: V
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0042732/2024-01-01#ArtikelV
  - number: VI
    text: 'Deze wet wordt aangehaald als: Wet kwaliteitsborging voor het bouwen.'
    url: https://wetten.overheid.nl/BWBR0042732/2024-01-01#ArtikelVI
