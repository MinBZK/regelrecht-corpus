  - number: '2'
    text: |-
      Onder de boedel van de Nederlandse Antillen wordt verstaan het geheel van rechten en verplichtingen van de
      Nederlandse Antillen onmiddellijk voorafgaande aan het tijdstip van transitie, met uitzondering van de rechten
      en verplichtingen die betrekking hebben op roerende zaken, behalve voor zover het gaat om zeer waardevolle zaken,
      zulks ter beoordeling van de commissie.
    url: https://wetten.overheid.nl/BWBR0028964/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Bij de vereffening van de boedel wordt de volgende verdeelsleutel gehanteerd: 73,3% voor Curaçao, 18,75% voor St.
      Maarten en 7,95% voor Nederland.

      2 De landen kunnen in onderlinge overeenstemming besluiten voor onderdelen van de boedel uit te gaan van een andere
      verdeelsleutel.
    url: https://wetten.overheid.nl/BWBR0028964/2010-10-10#Artikel3
  - number: '4'
    text: |-
      1 Binnen drie maanden na ontvangst van het advies, bedoeld in [artikel 9, tweede lid, eerste volzin][ref1],
      beslissen de ministers over de definitieve verdeling van de aan de Nederlandse Antillen toebehorende aandelen in
      de naamloze vennootschappen, genoemd in de [bijlage bij het Rijksbesluit rechtsopvolging burgerlijke rechten en
      verplichtingen Nederlands Antillen](onbekend), en stellen zij vast in hoeverre er onderlinge vorderingen tussen de
      landen bestaan, gelet op:

      a. de uit het [Rijksbesluit rechtsopvolging burgerlijke rechten en verplichtingen Nederlandse Antillen][ref2]
      of uit tussen de landen gemaakte boedelscheidingsafspraken voortvloeiende verdeling van activa en passiva, met
      uitzondering van die activa en passiva waarvan de waarde nog niet kan worden vastgesteld, en

      b. de toepassing van de in [artikel 3][ref3] bedoelde verdeelsleutel of verdeelsleutels.

      2 In het akkoord worden de in het eerste lid bedoelde activa en passiva vermeld en de overeengekomen waarde
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028964#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028594
      [ref3]: https://wetten.overheid.nl/BWBR0028964#Artikel3
