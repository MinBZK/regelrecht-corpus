  - number: '8'
    text: |-
      1 Een lid van de commissie kan niet tevens zijn:

      a. Gouverneur;

      b. minister of staatssecretaris;

      c. lid van de Staten of van een daarmee vergelijkbaar orgaan van Nederland;

      d. lid van de Raad van Advies van een van de landen;

      e. lid van de Raad van State van het Koninkrijk;

      f. lid van het College financieel toezicht Curaçao en Sint Maarten;

      g. lid van de Algemene Rekenkamer van een van de landen of van Nederland;

      h. ombudsman of substituut-ombudsman van een van de landen of van Nederland;

      i. ambtenaar bij een ministerie of een daaronder ressorterende instelling, dienst of bedrijf.

      2 Een lid vervult ook overigens geen andere betrekking of nevenfunctie die overigens ongewenst is met het oog op
      een goede vervulling van zijn functie of de handhaving van zijn onafhankelijkheid of van het vertrouwen daarin.

      3 Een lid meldt het voornemen tot het aanvaarden van een andere betrekking of nevenfunctie aan de commissie. De
      commissie informeert de ministers.

      4 De commissie maakt de nevenfuncties van een lid openbaar. Openbaarmaking geschiedt bij zijn benoeming en voorts
      door jaarlijkse publicatie van een opgave van deze nevenfuncties in de Staatscourant, de Curaçaosche Courant en de
      Landscourant Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0028964/2010-10-10#Artikel8
  - number: '9'
    text: |-
      1 De commissie adviseert de ministers over de verdeling van de aandelen, bedoeld in [artikel 4, eerste lid][ref1],
      en over door de hen vast te stellen onderlinge vorderingen als bedoeld in [paragraaf 2][ref2]. Die adviezen hebben
      mede betrekking op de vaststelling van:

      a. de waarde van de onderdelen van de boedel;

      b. de feitelijke toedeling van activa en passiva uit die boedel.

      2 Het advies ten behoeve van het besluit, bedoeld in [artikel 4][ref3], wordt zo spoedig mogelijk na het tijdstip
      van transitie uitgebracht. De overige adviezen, bedoeld in het eerste lid, worden steeds uiterlijk 15 augustus
      uitgebracht.

      3 De commissie kan zich op verzoek dan wel ambtshalve met tussentijdse rapportages, verzoeken en voorstellen
      rechtstreeks wenden tot de ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0028964#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028964#Paragraaf2
      [ref3]: https://wetten.overheid.nl/BWBR0028964#Artikel4
