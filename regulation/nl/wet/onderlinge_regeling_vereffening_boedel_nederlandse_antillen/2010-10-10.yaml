  - number: '16'
    text: |-
      1 Deze onderlinge regeling treedt in werking met ingang van het tijdstip van transitie en vervalt met ingang van 1
      januari 2014.

      2 In afwijking van het eerste lid kunnen de ministers bij gezamenlijk besluit de werking van deze regeling
      steeds met een jaar verlengen. Een dergelijk besluit wordt binnen 30 dagen na de ondertekening geplaatst in de
      Staatscourant, de Curaçaosche Courant en de Landscourant Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0028964/2010-10-10#Artikel16
  - number: '17'
    text: 'Deze onderlinge regeling wordt aangehaald als: Onderlinge regeling vereffening boedel Nederlandse Antillen.'
    url: https://wetten.overheid.nl/BWBR0028964/2010-10-10#Artikel17
