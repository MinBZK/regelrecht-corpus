  - number: '5'
    text: |-
      1 Met ingang van 2012 stellen de ministers jaarlijks vast in hoeverre er nadere onderlinge vorderingen tussen de
      landen bestaan betreffende de verdeling van activa en passiva waarvan de waarde ten tijde van het nemen van het
      besluit, bedoeld in [artikel 4][ref1], nog niet kon worden bepaald, alsmede van andere tot de boedel behorende
      activa en passiva die in 2010 nog niet bekend waren of om andere redenen niet in een eerder besluit als bedoeld in
      artikel 4 waren opgenomen.

      2 Een besluit als bedoeld in het eerste lid wordt genomen binnen drie maanden na ontvangst van het advies, bedoeld
      in [artikel 9, eerste lid][ref2].

      3 [Artikel 4, tweede lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028964#Artikel4
