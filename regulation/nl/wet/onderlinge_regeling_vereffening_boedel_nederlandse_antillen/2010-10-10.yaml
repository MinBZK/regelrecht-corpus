    text: |-
      1 Indien een besluit als bedoeld in de [artikelen 4][ref1] en [5][ref2] leidt tot de verplichting tot overdracht
      van aandelen of tot een of meer betalingsverplichtingen, wordt binnen drie maanden na vaststelling van het
      desbetreffende besluit aan die verplichtingen voldaan.

      2 In het besluit kan van het eerste lid worden afgeweken.


