  - number: '7'
    text: |-
      1 Er is een vereffeningscommissie.

      2 De commissie bestaat uit vier leden, waaronder een voorzitter:

      a. een lid namens Curaçao, aangewezen door de Minister van Financiën van Curaçao;

      b. een lid namens Sint Maarten, aangewezen door de Minister van Financiën van Sint Maarten;

      c. een lid namens Nederland, aangewezen door de Minister van Binnenlandse Zaken en Koninkrijksrelaties van
      Nederland;

      d. de voorzitter, aangewezen door de ministers gezamenlijk.

      3 De voorzitter en de overige leden worden benoemd door de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      van Nederland.

      4 De voorzitter heeft stemrecht. Bij het staken van de stemmen beslist de voorzitter.

      5 De commissie vangt met haar werkzaamheden aan met ingang van het tijdstip van transitie.

      6 De leden van het college oefenen hun functie uit zonder last of ruggespraak.

      7 De leden worden benoemd voor de periode gedurende welke deze onderlinge regeling van kracht is.

      8 Een lid wordt op eigen verzoek ontslagen.

      9 Een lid kan worden geschorst of ontslagen wegens ongeschiktheid voor de vervulde functie, dan wel wegens andere
      zwaarwegende in zijn persoon gelegen redenen, dan wel wegens het aanvaarden van een ambt, betrekking of functie als
      bedoeld in [artikel 8, eerste en tweede lid][ref1].

      10 De ministers beslissen gezamenlijk over schorsing en ontslag. Schorsing en ontslag geschieden bij besluit van de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties van Nederland.

      11 Voorafgaande aan een ontslag of een schorsing als bedoeld in het negende lid wordt de commissie gehoord, tenzij
      de omstandigheden met betrekking tot het ontslag of de schorsing dat horen belemmeren.

      12 De Minister van Binnenlandse Zaken en Koninkrijksrelaties van Nederland stelt in overeenstemming met de
      beide andere ministers de vaste vergoeding van de leden van de commissie vast. Hierbij wordt de toepasselijke
      salarisschaal van [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren][ref2] en de toepasselijke
      deeltijdfactor aangegeven. De leden hebben voorts overeenkomstig het [Reisbesluit binnenland][ref3] en het
      [Reisbesluit buitenland][ref4] recht op vergoeding van reis- en verblijfskosten. Daarnaast hebben de leden op
      declaratiebasis recht op vergoeding van kosten van internationale telefoongesprekken die zij maken in het kader van
      de werkzaamheden voor de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0028964#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003630
      [ref3]: https://wetten.overheid.nl/BWBR0005889
      [ref4]: https://wetten.overheid.nl/BWBR0006842
