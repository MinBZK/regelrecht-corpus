  - number: '10'
    text: |-
      1 De commissie bepaalt zelf haar werkwijze.

      2 De commissie kan haar taak, genoemd in [artikel 9, eerste lid][ref1], en andere taken geheel of gedeeltelijk
      laten uitvoeren door een door de commissie zelf aan te wijzen administratiekantoor. Het kantoor voert zijn
      werkzaamheden uit onder verantwoordelijkheid van de commissie.

      3 De commissie kan zich laten bijstaan door ambtenaren van de landen, aan te wijzen door de ministers en door
      deskundigen van buiten haar midden. Met instemming van de voorzitter kunnen deze adviseurs en deskundigen deelnemen
      aan bijeenkomsten en eventuele andere activiteiten van de commissie.

      4 De commissie kan voor haar taakvervulling voorts adviezen inwinnen.


      [ref1]: https://wetten.overheid.nl/BWBR0028964#Artikel9
    url: https://wetten.overheid.nl/BWBR0028964/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028964
        artikel: '9'
        paragraaf: '3'
  - number: '11'
    text: |-
      De leden van de commissie en de in [artikel 10][ref1] bedoelde ambtenaren en deskundigen, hun vertegenwoordigers
      alsmede hun echtgenoten of geregistreerde partners en minderjarige kinderen voor zover zij met hen een
      gemeenschappelijke huishouding voeren, worden van rechtswege toegelaten tot de landen. Aan de leden van de
      commissie en de desbetreffende ambtenaren, adviseurs en deskundigen, hun vertegenwoordigers alsmede hun echtgenoten
      of geregistreerde partners worden geen nadere voorwaarden gesteld voor de uitoefening van een beroep of het
      verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0028964#Artikel10
    url: https://wetten.overheid.nl/BWBR0028964/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028964
        artikel: '10'
        paragraaf: '3'
  - number: '12'
    text: |-
      1 De ministers verstrekken de commissie alle inlichtingen die zij voor de uitoefening van haar taken nodig acht.

      2 De ministers verlenen de commissie dan wel door haar aangewezen vertegenwoordigers, te allen tijde toegang tot
      dan wel inzage in alle goederen, administraties, documenten en andere informatiedragers.

      3 De commissie neemt de met betrekking tot natuurlijke personen en rechtspersonen in de desbetreffende landen
      geldende geheimhoudingsbepalingen in acht.
    url: https://wetten.overheid.nl/BWBR0028964/2010-10-10#Artikel12
  - number: '13'
    text: |-
      De kosten van de bezoldiging van de leden van de commissie, alsmede de bekostiging van de overige apparaatsuitgaven
      worden gelijkelijk verdeeld tussen de landen. Met het oog daarop dient de commissie jaarlijks voor 1 augustus een
      begroting in bij de ministers.
    url: https://wetten.overheid.nl/BWBR0028964/2010-10-10#Artikel13
  - number: '14'
    text: |-
      1 Als de ministers niet binnen de termijn, bedoeld in [artikel 4, eerste lid][ref1], of
      [artikel 5, tweede lid][ref2], overeenstemming kunnen bereiken over het te nemen besluit, wordt dat geschil
      voorgelegd aan een ter zake van de beslechting van dat geschil in te stellen arbitragecommissie. Het advies van de
      arbitragecommissie is bindend.

      2 De arbitragecommissie is als volgt samengesteld:

      a. een lid namens Curaçao, aangewezen door de Minister van Financiën van Curaçao;

      b. een lid namens Sint Maarten, aangewezen door de Minister van Financiën van Sint Maarten;

      c. een lid namens Nederland, aangewezen door de Minister van Binnenlandse Zaken en Koninkrijksrelaties van
      Nederland;

      d. een voorzitter, in onderlinge overeenstemming aangewezen door de leden, bedoeld onder a tot en met c.

      3 De voorzitter heeft stemrecht. Bij het staken van de stemmen beslist de voorzitter.

      4 De voorzitter en de leden kunnen niet tevens lid zijn van de vereffeningscommissie.

      5 De [artikelen 10, derde en vierde lid][ref3], en [11 tot en met 13][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028964#Artikel4
