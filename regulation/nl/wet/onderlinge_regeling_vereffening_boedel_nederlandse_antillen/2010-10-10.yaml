  - number: '15'
    text: |-
      Het beheer van de bescheiden betreffende de werkzaamheden van de commissie en van een arbitragecommissie als
      bedoeld in [artikel 14][ref1] wordt geregeld in de regeling van werkzaamheden van de vereffeningscommissie, bedoeld
      in [artikel 8, eerste lid][ref2]. De bescheiden worden na beëindiging van de werkzaamheden van de commissie bewaard
      in het archief van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties van Nederland. De bescheiden worden
      in afschrift ter beschikking gesteld van Curaçao en Sint Maarten.


      [ref1]: https://wetten.overheid.nl/BWBR0028964#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0028964#Artikel8
