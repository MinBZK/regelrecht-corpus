preamble:
  text: |-
    Overwegende, dat artikel I van de Rijkswet wijziging Statuut in verband met de opheffing van de Nederlandse
    Antillen er in voorziet dat het land de Nederlandse Antillen wordt opgeheven, dat Curaçao en Sint Maarten de
    hoedanigheid krijgen van land binnen het Koninkrijk en dat Bonaire, Sint Eustatius en Saba onderdeel worden van het
    staatsbestel van Nederland;

    dat de Gouverneur van de Nederlandse Antillen bij besluit van 26 juni 2006, nr. 1, een commissie inventarisatie en
    waardering boedel Nederlandse Antillen heeft ingesteld die tot taak kreeg de boedel van de Nederlandse Antillen in
    kaart te brengen en te laten taxeren, en een voorstel te doen met betrekking tot de verdeling van de boedel over de
    eilandgebieden die samen het grondgebied van de Nederlandse Antillen vormen;

    dat deze commissie heeft voorgesteld voor de vaststelling van een verdeelsleutel uit te gaan van een gemiddelde
    van het aandeel in het Bruto Binnenlands Product en het aandeel in het bevolkingsaantal van de Nederlandse Antillen
    en dat de politieke Stuurgroep Staatkundige Veranderingen Nederlandse Antillen op 1 juli 2010 heeft ingestemd met
    die verdeelsleutel;

    dat de rechtsopvolging in de burgerlijke rechten en verplichtingen van het land Nederlandse Antillen wordt geregeld
    in het Rijksbesluit rechtsopvolging burgerlijke rechten en verplichtingen Nederlandse Antillen en, voor zover
    het betreft de door het land Nederlandse Antillen aangegane geldleningen, het Rijksbesluit overname geldleningen
    Nederlandse Antillen, Curaçao en Sint Maarten;

    dat de toepassing van de in het Rijksbesluit rechtsopvolging burgerlijke rechten en verplichtingen Nederlandse
    Antillen opgenomen regels voor rechtsopvolging kunnen leiden tot een feitelijke toedeling van activa en passiva die
    op onderdelen niet overeenkomt met de beoogde verdeling van de totale waarde van de boedel zoals tot uitdrukking
    komt in de overeengekomen verdeelsleutels, en dat het met het oog daarop wenselijk is afspraken te maken over
    onderlinge verrekening tussen de landen ter compensatie van eventuele over- of onderbedelingen ten opzichte van de
    overeengekomen verdeelsleutels;

    dat het voorts wenselijk is afspraken te maken over de feitelijke afwikkeling van de scheiding van de boedel;

    Gelet op de artikelen 38, eerste lid, 38a en 60c van het Statuut voor het Koninkrijk;

    Komen het volgende overeen:
  url: https://wetten.overheid.nl/BWBR0028964/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder

      a. de Nederlandse Antillen: het land de Nederlandse Antillen, zoals dat bestaat tot de transitiedatum;

      b. landen: Curaçao, Sint Maarten en, met betrekking tot Bonaire, Sint Eustatius en Saba, Nederland;

      c. boedel: de boedel van de Nederlandse Antillen, zoals gedefinieerd in [artikel 2][ref1];

      d. de commissie: de vereffeningscommissie, genoemd in [artikel 8][ref2];

      e. de ministers: de Ministers van Financiën van Curaçao en van Sint Maarten en de Minister van Binnenlandse Zaken
      en Koninkrijksrelaties van Nederland;

      f. tijdstip van transitie: tijdstip waarop
