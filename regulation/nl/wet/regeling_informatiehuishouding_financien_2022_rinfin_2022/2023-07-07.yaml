articles:
  - number: '1'
    text: |-
      In deze regeling en de daarop berustende bepalingen wordt verstaan onder:

        - *archiefbeheerder:* degene die namens de plaatsvervangend secretaris-generaal verantwoordelijk is voor het laten
      uitvoeren van het beheer van de overheidsinformatie voor de onder hem vallende archiefvormende onderdelen;
        - *archiefbeherend onderdeel:* het organisatieonderdeel of de organisatie die tot taak heeft in opdracht van de
      archiefbeheerder de feitelijke werkzaamheden met betrekking tot het beheer van overheidsinformatie uit te voeren;
        - *archieffunctie:* de bedrijfsfunctie gericht op de kwaliteit van het duurzaam toegankelijk maken en houden,
      bewaren en beheren van de overheidsinformatie van de archiefvormende onderdelen;
        - *archiefsysteem:* een informatiesysteem dat het beheer van overheidsinformatie ondersteunt;
        - *archiefvormend onderdeel:* een organisatieonderdeel onder verantwoordelijkheid van de Minister, dat bevoegd
      is te handelen en op grond van de verantwoordelijkheid voor dat handelen overheidsinformatie verzamelt, ontvangt,
      produceert, verzendt of beheert;
        - *beheer van overheidsinformatie (synoniem: archiefbeheer):* de uitvoerende werkzaamheden om overheidsinformatie
      in goede, geordende en toegankelijke staat te brengen en te bewaren, als ook om overheidsinformatie die daarvoor in
      aanmerking komt te vernietigen dan wel over te brengen;
        - *CIO van een verzorgingsgebied:* Chief Information Officer van het kernministerie, het directoraat-generaal
      Belastingdienst, het directoraat-generaal Douane of het directoraat-generaal Toeslagen;
        - *conversie:* het proces van omzetten van informatie van het ene formaat naar het andere formaat;
        - *duurzaam toegankelijk:* overheidsinformatie vallend onder de archiefwettelijke zorg, moet gedurende de in
      een selectielijst opgenomen termijn in goede, geordende en toegankelijke staat worden bewaard, dat wil zeggen:
      • toegankelijk, vindbaar en in contextuele samenhang raadpleegbaar; • met de garantieresultaatverplichting dat
      deze juist, volledig en authentiek en leesbaar is, ook in de toekomst en, bij digitale overheidsinformatie,
      onafhankelijk van het gebruikte bestandsformaat;
        - *emulatie:* de techniek waarmee een computer of toepassingsprogrammatuur zich hetzelfde gedraagt als één van een
      oudere generatie;
        - *informatie:* een verzameling gegevens die in hun samenhang een bepaalde betekenis hebben;
        - *informatiehuishouding:* het totaal aan regels, voorzieningen, activiteiten en processen gericht op de
      informatiestromen en op het beheer van informatie;
        - *informatiesysteem:* een gegevensverwerkend systeem met als activiteiten het verzamelen, verwerken, bewerken,
      bewaren, overdragen en verstrekken van gegevens met betrekking tot een bepaald toepassingsgebied;
        - *kernministerie:* het directoraat-generaal Fiscale Zaken, het directoraat-generaal Rijksbegroting, de generale
      thesaurie, het programma directoraat-generaal Herstel en het cluster secretaris-generaal van het Ministerie van
      Financiën;
        - *migratie:* het overzetten van informatie en toepassingsprogrammatuur van het ene systeem en/of platform naar het
      andere, met behoud van authenticiteit, integriteit, betrouwbaarheid en bruikbaarheid;
        - *Minister:* de Minister van Financiën;
        - *ministerie:* het Ministerie van Financiën;
        - *noodvernietiging:* de mogelijkheid om voor vitale overheidsinformatie in buitengewone omstandigheden, waarbij
      de staatsveiligheid in gevaar is, af te wijken van voorgeschreven vernietigingsprocedures en deze direct te
      vernietigen;
        - *overheidsinformatie:* alle informatie die de overheid zelf maakt of van een ander ontvangt bij het uitvoeren
      van haar taken, ongeacht: • het proces waaruit de informatie voortkomt; • de inhoud van de informatie; • de formele
      status van de informatie; • de fase waarin de creatie en behandeling van de informatie verkeert; • de termijn dat
      de informatie bewaard moet worden (bewaartermijn); • de technische vorm van de informatie; • de applicaties waarmee
      de informatie is gemaakt en wordt beheerd; • door wie de informatie beheerd wordt;
        - *overbrenging:* overheidsinformatie die op grond van selectielijsten voor bewaring in aanmerking komt moet worden
      overgebracht naar een archiefbewaarplaats;
        - *SIO:* Strategisch Informatie Overleg tussen de Chief Information Officer van het Ministerie van Financiën en de
      Algemeen Rijksarchivaris over de informatiehuishouding van het Ministerie van Financiën;
        - *vernietiging:* het zodanig materieel behandelen van een informatiedrager (o.a. papier, geluidsband, database,
      film, usb stick, hard disk) met overheidsinformatie, die op grond van selectielijsten voor vernietiging in
      aanmerking komt, dan wel op grond van een machtiging van vervanging of op grond van noodvernietiging, dat de daarop
      vastgelegde informatie niet te reconstrueren is;
        - *vervanging:* de, al dan niet routinematige, vervanging van oorspronkelijke overheidsinformatie door
      reproducties, die daar volledig de plaats van innemen;
        - *vervreemding:* het in eigendom overdragen van overheidsinformatie aan een andere zorgdrager of aan derden;
        - *verzorgingsgebied:* archiefvormende onderdelen die: • vallen onder de kaderstellende en toezichthoudende
      bevoegdheid van één CIO, of; • vallen onder de verantwoordelijkheid van één archiefbeheerder, of; • diensten
      afnemen van één archiefbeherend onderdeel.
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel1
  - number: '2'
    text: |-
      Deze regeling is van toepassing op het beheer van alle overheidsinformatie vallend onder de archiefwettelijke zorg
      van de Minister.
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel2
  - number: '3'
    text: |-
      De Minister is de zorgdrager, bedoeld in [artikel 1, onderdeel d, van de Archiefwet 1995][ref1], voor de
      overheidsinformatie van het ministerie. De zorg van de Minister eindigt door overbrenging, vervreemding of
      vernietiging van de overheidsinformatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel1
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '1'
  - number: '4'
    text: |-
      De plaatsvervangend secretaris-generaal is:

      1. namens de Minister verantwoordelijk voor het beheer van overheidsinformatie bij het ministerie en voor de
      voorwaarden om dit mogelijk te maken;

      2. is verantwoordelijk voor de kwaliteit van het beheer van overheidsinformatie bij het ministerie;

      3. stelt regels ten aanzien van noodvernietiging.
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel4
  - number: '5'
    text: |-
      1 Het Ministerie van Financiën heeft een departementaal CIO-stelsel conform
      [artikel 9 van het CIO-stelsel Rijksdienst 2021][ref1].

      2 De departementale CIO Financiën:

      a. stelt departementale strategische beleids-, kwaliteits- en toetsingskaders op het gebied van het beheer van
      overheidsinformatie vast;

      b. vertegenwoordigt de zorgdrager in het strategisch informatieoverleg (SIO) met het Nationaal Archief;

      c. laat toezien op het naleven van het gestelde in deze regeling.

      3 De CIO van een verzorgingsgebied:

      a. stelt waar nodig nadere (beleids-)kaders en uitgangspunten op voor het beheer van overheidsinformatie binnen het
      eigen verzorgingsgebied;

      b. ziet toe op het naleven van het gestelde in deze regeling binnen het eigen verzorgingsgebied;

      c. is verantwoordelijk voor de verankering van archiveringsprincipes in de architectuur- en ontwerpfunctie
      (archivering bij ontwerp);

      d. is verantwoordelijk voor het beschikbaar zijn van een toepasbare vastgestelde selectielijst.


      [ref1]: https://wetten.overheid.nl/BWBR0044613#Artikel9
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0044613
        artikel: '9'
  - number: '6'
    text: |-
      1 De archiefbeheerders van het Ministerie van Financiën zijn:

      a. de directeur Digitalisering en Informatisering van het cluster secretaris-generaal voor het kernministerie en de
      inspectie belastingen, toeslagen en douane;

      b. de directeur-generaal Belastingdienst voor de hiërarchisch onder hem vallende archiefvormende onderdelen;

      c. de directeur-generaal Douane voor de hiërarchisch onder hem vallende archiefvormende onderdelen;

      d. de directeur-generaal Toeslagen voor de hiërarchisch onder hem vallende archiefvormende onderdelen.

      2 De archiefbeheerders zijn verantwoordelijk voor het ontwerpen en inrichten van de archieffunctie en zorgen voor:

      a. een kwaliteitszorgsysteem;

      b. voldoende personeel en financiële middelen;

      c. bekendmaking van deze regeling binnen hun verzorgingsgebied en het vastleggen van de afspraken hierover met de
      archiefbeherende onderdelen;

      d. de toepassing van een vastgestelde selectielijst;

      e. het laten uitvoeren van het beheer van de overheidsinformatie voor de onder hen vallende archiefvormende
      onderdelen in overeenstemming met het bepaalde in deze regeling en andere van toepassing zijnde regelgeving.

      3 Gelet op [artikel 5 van het Mandaatbesluit Ministerie van Financiën 2020][ref1] kunnen de archiefbeheerders
      bevoegdheden voor het beheer van overheidsinformatie ondermandateren aan onder hen ressorterende functionarissen.

      4 De uitvoering van het beheer van overheidsinformatie beleggen de archiefbeheerders bij de onder hun
      verantwoordelijkheid vallende archiefbeherende onderdelen of door een (externe) partij die werkt onder
      dienstverleningsafspraken.

      5 De archiefbeheerders leggen over het beheer van overheidsinformatie verantwoording af aan de plaatsvervangend
      secretaris-generaal.

      6 De archiefbeheerder van het kernministerie coördineert de actualisering van deze regeling voor het departement.


      [ref1]: https://wetten.overheid.nl/BWBR0043022#Artikel5
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0043022
        artikel: '5'
  - number: '7'
    text: |-
      1 De archiefbeherende onderdelen zijn verantwoordelijk voor het uitvoeren van de taken die aan hen zijn opgedragen
      door de archiefbeheerder, en zorgen voor:

      a. de aanwezigheid van voldoende en deskundig personeel hiervoor;

      b. het maken afspraken met de archiefbeheerders hierover.

      2 Medewerkers van het archiefbeherend onderdeel hebben toegang tot de overheidsinformatie in de voorzieningen voor
      document- en archiefbeheer die nodig is voor het uitvoeren van hun taken.
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel7
  - number: '8'
    text: |-
      1 Archiefvormende onderdelen zijn:

      a. de binnen het ministerie te onderscheiden organisatieonderdelen (directies);

      b. tijdelijke raden, formeel ingestelde commissies, samenwerkingsverbanden en projectorganisaties die onder de
      archiefwettelijke zorg van de Minister vallen;

      c. zelfstandige bestuursorganen zonder rechtspersoonlijkheid, zelfstandige bestuursorganen en geprivatiseerde
      onderdelen van het ministerie voor wat betreft de archieven van voor de verzelfstandiging of privatisering.

      2 De archiefvormende onderdelen zijn verantwoordelijk voor:

      a. het maken van afspraken met de verantwoordelijk archiefbeheerder over het beheer van de onder hen berustende
      overheidsinformatie;

      b. het uitvoeren van maatregelen om de onder hen berustende overheidsinformatie duurzaam toegankelijk te maken en
      te houden;

      c. het in beheer overdragen van de onder hen berustende overheidsinformatie aan hun archiefbeherend onderdeel, in
      overeenstemming met de gemaakte afspraken met de archiefbeheerder over de duurzame toegankelijkheid van de onder
      hen berustende overheidsinformatie.
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel8
  - number: '9'
    text: |-
      1 Bij de instelling van raden, commissies, samenwerkingsverbanden en programma- en/of projectorganisaties, worden
      in het instellingsbesluit de afspraken vastgelegd over het beheer van overheidsinformatie.

      2 Het instellend archiefvormend onderdeel is er verantwoordelijk voor dat de archiefbeherende onderdelen, worden
      geïnformeerd over de instelling, voor vaststelling van het instellingsbesluit.

      3 De raden, formeel ingestelde commissies, samenwerkingsverbanden en project- of programmadirecties beheren hun
      overheidsinformatie in overleg met de betrokken archiefbeheerder.

      4 De raden, formeel ingestelde commissies, samenwerkingsverbanden en project- of programmadirecties zorgen ervoor
      dat zij, zodra dit mogelijk is, hun overheidsinformatie in beheer overdragen aan de betrokken archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel9
  - number: '10'
    text: |-
      1 Er worden met externe private partijen, die in opdracht van het ministerie werken en daarbij overheidsinformatie
      produceren, door de opdrachtgever nadere afspraken gemaakt over het beheer hiervan.

      2 Als een private partij bij de uitvoering van een opdracht overheidsinformatie van het ministerie zal creëren
      of ontvangen, dient de opdrachtverstrekking afspraken te bevatten over het beheer van de overheidsinformatie en
      eventuele overdracht hiervan aan het ministerie na afloop van de opdracht.
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel10
  - number: '11'
    text: |-
      1 De archiefbeheerder kan besluiten over te gaan tot vervanging van overheidsinformatie door gelijkluidende
      reproducties, tenzij het overheidsinformatie betreft die is uitgesloten van vervanging. De vernietiging van de te
      vervangen originelen is onverbrekelijk onderdeel van het vervangingsproces.

      2 Van vervanging wordt door het archiefbeherend onderdeel een verklaring of besluit opgesteld en ter ondertekening
      aangeboden aan de archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel11
  - number: '12'
    text: |-
      1 Vernietiging van overheidsinformatie vindt uitsluitend plaats na verstrijken van de daarvoor in een selectielijst
      vastgestelde termijn, of na vervanging van de betreffende overheidsinformatie door reproducties. Tenzij er sprake
      is van een noodprocedure waardoor vernietiging eerder heeft plaatsgevonden.

      2 Het archiefvormend onderdeel geeft aan of vernietiging tijdelijk moet worden opgeschort, en zo ja op welke grond,
      of dat overheidsinformatie op grond van [artikel 5, eerste lid, onderdeel e, van het Archiefbesluit 1995][ref1]
      alsnog bewaard moet blijven.

      3 Van vernietiging wordt door het archiefbeherend onderdeel een verklaring opgesteld en ter ondertekening
      aangeboden aan de archiefbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel5
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '5'
  - number: '13'
    text: |-
      1 De archiefbeheerder maakt nadere afspraken met de archiefbeherende onderdelen over het overbrengen van
      overheidsinformatie naar een archiefbewaarplaats.

      2 Bij de overbrenging kan de archiefbeheerder, in overleg met de algemeen rijksarchivaris, voor een bepaalde
      periode beperkingen stellen aan de openbaarheid van de over te brengen overheidsinformatie. Van te stellen
      beperkingen aan de openbaarheid wordt door het desbetreffende archiefbeherend onderdeel een besluit tot beperking
      van de openbaarheid opgemaakt en ter ondertekening aangeboden aan de archiefbeheerder.

      3 Van de overbrenging van overheidsinformatie wordt door het desbetreffende archiefbeherend onderdeel een
      verklaring of opgesteld en ter ondertekening aangeboden aan de archiefbeheerder.

      4 Na verkregen machtiging van de Minister van Onderwijs, Cultuur en Wetenschap kan de overbrenging naar een
      archiefbewaarplaats van nog veelvuldig geraadpleegde overheidsinformatie worden opgeschort.

      5 Bij opschorting van overbrenging zijn de openbaarheidsregels van de [Archiefwet 1995][ref1] op de niet
      overgebrachte overheidsinformatie van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '14'
    text: |-
      1 Het archiefbeherend onderdeel maakt van conversie, migratie of emulatie een verklaring op.

      2 De verklaring van conversie, migratie of emulatie wordt ondertekend door de archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel14
  - number: '15'
    text: |-
      1 Een archiefbeheerder kan, in overleg met het archiefvormend onderdeel, besluiten tot vervreemding van
      overheidsinformatie die onder zijn verantwoordelijkheid valt.

      2 Voor vervreemding is een machtiging nodig van de Minister van Onderwijs, Cultuur en Wetenschap tenzij dit
      plaatsvindt als gevolg van een wettelijk voorschrift.

      3 Indien overheidsinformatie ten gevolge van de vervreemding niet bij een archiefbewaarplaats komt te berusten,
      betrekt het archiefvormend onderdeel bij de voorbereiding van het besluit tot vervreemding deskundigen op het
      gebied van organisatie en de taken van het overheidsorgaan dat het betreft, een deskundige op het gebied van
      beheer van overheidsinformatie van dit overheidsorgaan en de algemene rijksarchivaris of een door hem gemandateerde
      functionaris.

      4 Van de vervreemding wordt door het archiefbeherend onderdeel een verklaring opgesteld en ter ondertekening
      aangeboden aan de archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel15
  - number: '16'
    text: |-
      1 De archiefbeheerder is, bij een verandering in de organisatie van het ministerie door opheffing, samenvoeging,
      splitsing of door overdracht van taken, verantwoordelijk voor het treffen van maatregelen betreffende de bestemming
      en het beheer van overheidsinformatie met inachtneming van het Besluit Archiefoverdrachten Rijksadministratie.

      2 Indien er sprake is van een reorganisatie die de verzorgingsbieden van meerdere archiefbeheerders raakt, maken
      zij onderling afspraken over de te treffen maatregelen zoals bedoeld in het vorige lid.

      3 Als deze maatregelen bestaan uit het ter beschikking stellen van de overheidsinformatie dan wordt door het
      archiefbeherend onderdeel een verklaring opgesteld en ter ondertekening aangeboden aan de archiefbeheerder.
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel16
  - number: '17'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2022. Indien de Staatscourant waarin deze regeling wordt
      geplaatst wordt uitgegeven na 1 januari 2022, treedt zij in werking met ingang van de dag na de datum van uitgifte
      van de Staatscourant, en werkt zij terug tot en met 1 januari 2022.
    url: https://wetten.overheid.nl/BWBR0046157/2023-07-07#Artikel17
  - number: '18'
    text: |-
      De volgende regelingen worden ingetrokken:

      a. de [Regeling Informatiehuishouding Financiën 2016][ref1];

      b. de Regeling Archiefbeheer Belastingdienst 2011.


