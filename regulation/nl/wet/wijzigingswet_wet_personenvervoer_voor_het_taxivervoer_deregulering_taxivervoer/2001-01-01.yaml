preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van marktgerichte verhoudingen en de kwaliteit in
    het taxivervoer wenselijk is de regels voor het verrichten van taxivervoer fasegewijs te dereguleren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010955/2001-01-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Tot twee jaar na de datum van inwerkingtreding van deze wet, behoudens verlenging bij koninklijk besluit op grond
      van [artikel XIII][ref1], worden vergunningen krachtens de [Wet personenvervoer 2000][ref2] slechts verleend voor
      het verrichten van taxivervoer binnen en vanuit een van de gebieden, zoals die op de datum voor inwerkingtreding
      van deze wet golden op grond van artikel 57, tweede lid, van de Wet personenvervoer, zoals dat op deze datum
      luidde.

      2 In afwijking van het eerste lid kan een vergunning worden verleend voor een gebied bestaande uit twee of meer van
      de gebieden bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010955#ArtikelXIII
      [ref2]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0010955/2001-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0010955
        artikel: XIII
      - id: ref2
        bwb_id: BWBR0011470
  - number: IV
    text: |-
      1 Onze Minister kan tot twee jaar na de datum van inwerkingtreding van deze wet, behoudens verlenging bij
      koninklijk besluit op grond van [artikel XIII][ref1], een vergunning voor het verrichten van taxivervoer als
      bedoeld in de [Wet personenvervoer 2000][ref2] weigeren op grond van de vraag naar taxivervoer binnen het gebied
      waarvoor de vergunning wordt aangevraagd.

      2 Bij ministeriële regeling kunnen regels worden vastgesteld over de te hanteren normen bij de toetsing van de
      vraag naar taxivervoer ter uitoefening van de bevoegdheid, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010955#ArtikelXIII
      [ref2]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0010955/2001-01-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0010955
        artikel: XIII
      - id: ref2
        bwb_id: BWBR0011470
  - number: V
    text: |-
      Tot twee jaar na de datum van inwerkingtreding van deze wet, behoudens verlenging bij koninklijk besluit op grond
      van [artikel XIII][ref1], is het verboden buiten het gebied waarvoor de vergunning is verleend personen op te
      nemen, tenzij de rit door hen is besteld bij het kantoor van de vervoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0010955#ArtikelXIII
    url: https://wetten.overheid.nl/BWBR0010955/2001-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0010955
        artikel: XIII
  - number: VII
    text: |-
      Een vergunning voor het verrichten van taxivervoer, die voor de datum van inwerkingtreding van deze wet is verleend
      op grond van de artikelen 57, 63 of 63a van de Wet personenvervoer, zoals deze luidden voor die datum, geldt met
      ingang van de datum van inwerkingtreding van deze wet als een vergunning verleend door Onze Minister voor hetzelfde
      gebied op grond van artikel 57, zoals dat luidt met ingang van die datum. De vergunning geldt voor de duur van een
      jaar of tot het tijdstip waarop onherroepelijk is beslist op de aanvraag voor een vergunning, mits gedaan binnen
      dat jaar, onverminderd wijziging of intrekking van de vergunning als bedoeld in artikel 91 of het van rechtswege
      vervallen van de vergunning als bedoeld in artikel 7, eerste lid, van de Wet personenvervoer.
    url: https://wetten.overheid.nl/BWBR0010955/2001-01-01#ArtikelVII
  - number: VIII
    text: |-
      Een aanvraag voor een vergunning voor het verrichten van taxivervoer, die voor de datum van inwerkingtreding van
      deze wet is ingediend op grond van de artikelen 57, respectievelijk 63 of 63a van de Wet personenvervoer, zoals
      deze luidden voor die datum, bij gedeputeerde staten, respectievelijk een openbaar lichaam of een dagelijks bestuur
      van een regionaal openbaar lichaam als bedoeld in de [Kaderwet bestuur in verandering][ref1], en waarop nog geen
      beslissing is genomen, geldt met ingang van die datum als een aanvraag ingediend bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006620
    url: https://wetten.overheid.nl/BWBR0010955/2001-01-01#ArtikelVIII
    references:
      - id: ref1
        bwb_id: BWBR0006620
  - number: IX
    text: |-
      1 Een bezwaarschrift tegen een beslissing omtrent een vergunning voor het verrichten van taxivervoer, dat voor de
      datum van inwerkingtreding van deze wet is ingediend bij gedeputeerde staten, een openbaar lichaam of een dagelijks
      bestuur van een regionaal openbaar lichaam als bedoeld in de [Kaderwet bestuur in verandering][ref1], en waarop nog
      geen beslissing is genomen, wordt afgehandeld door het betrokken orgaan, volgens de regels die golden tot de datum
      van inwerkingtreding van deze wet.

      2 Een beroepschrift tegen een beslissing omtrent een vergunning voor het verrichten van taxivervoer, dat voor de
      datum van inwerkingtreding van deze wet is ingediend en waarop nog geen beslissing is genomen, wordt afgehandeld
      volgens de regels die golden tot de datum van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006620
    url: https://wetten.overheid.nl/BWBR0010955/2001-01-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0006620
  - number: X
    text: |-
      Een vergunning voor het verrichten van taxivervoer, die is verleend voor het verrichten van taxivervoer binnen
      een bepaald vervoergebied, geldt met ingang van twee jaar na de datum van inwerkingtreding van deze wet, behoudens
      verlenging bij koninklijk besluit op grond van [artikel XIII][ref1], als een vergunning voor heel Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0010955#ArtikelXIII
    url: https://wetten.overheid.nl/BWBR0010955/2001-01-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0010955
        artikel: XIII
  - number: XI
    text: |-
      De eerste vaststelling van een ministeriële regeling op grond van artikel 58, eerste lid, van de Wet
      personenvervoer en de voordracht voor de eerste vaststelling van een algemene maatregel van bestuur grond van
      artikel 60 van de Wet personenvervoer worden niet eerder gedaan dan vier weken nadat het ontwerp daarvoor aan beide
      kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0010955/2001-01-01#ArtikelXI
  - number: XII
    text: |-
      1 Onze Minister zendt binnen achttien maanden na de inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.

      2 Onze Minister voert over een door hem voorgesteld onderzoek naar de doeltreffendheid en de effecten van deze wet
      in de praktijk overleg met vertegenwoordigers van:

      a. werkgevers en werknemers in het taxivervoer;

      b. provincies en gemeenten;

      c. openbare lichamen en regionale openbare lichamen die op grond van de artikelen 63 respectievelijk 63a van de
      Wet personenvervoer, zoals die artikelen luidden voor de dag van inwerkingtreding van deze wet, de in die artikelen
      bedoelde bevoegdheden uitoefenen dan wel waaraan die bevoegdheden zijn overgedragen;

      d. representatieve consumentenorganisaties.

      3 Indien toepassing wordt gegeven aan [artikel XIII, eerste lid][ref1], wordt binnen drie jaar na de
      inwerkingtreding van deze wet opnieuw een verslag als bedoeld in het eerste lid uitgebracht, waarin met name die
      zwaarwegende redenen worden behandeld die de aanleiding tot de verlenging hebben gevormd.


      [ref1]: https://wetten.overheid.nl/BWBR0010955#ArtikelXIII
    url: https://wetten.overheid.nl/BWBR0010955/2001-01-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0010955
        artikel: XIII
  - number: XIII
    text: |-
      1 Indien naar het oordeel van Onze Minister zwaarwegende redenen aanwezig zijn om, mede gelet op de naar zijn
      oordeel gebleken doeltreffendheid en de effecten van deze wet in de praktijk en het met een of beide kamers der
      Staten-Generaal ter zake gevoerde overleg, de in de [artikelen III, eerste lid][ref1], [IV, eerste lid][ref2],
      [V][ref3] en [X][ref4] vermelde termijn van twee jaar te verlengen, kan voor het einde van die termijn bij
      koninklijk besluit worden bepaald dat die termijn met ten hoogste twee jaar wordt verlengd.

      2 In het in het eerste lid bedoelde geval wordt een ontwerp van een koninklijk besluit op grond van het eerste
      lid uiterlijk tweeëntwintig maanden na de inwerkingtreding van deze wet aan de beide kamers der Staten-Generaal
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0010955#ArtikelIII
      [ref2]: https://wetten.overheid.nl/BWBR0010955#ArtikelIV
      [ref3]: https://wetten.overheid.nl/BWBR0010955#ArtikelV
      [ref4]: https://wetten.overheid.nl/BWBR0010955#ArtikelX
    url: https://wetten.overheid.nl/BWBR0010955/2001-01-01#ArtikelXIII
