---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: ijkwet_bes
regulatory_layer: WET
publication_date: '2014-07-15'
valid_from: '2014-01-25'
bwb_id: BWBR0028247
url: https://wetten.overheid.nl/BWBR0028247/2014-01-25
articles:
  - number: '1'
    text: 'In deze wet en de voorschriften ter uitvoering daarvan wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel1
  - number: 1.a
    text: |-
      *maten en meetwerktuigen:* voorwerpen en instrumenten bestemd of gebruikt voor het verrichten van lengte-,
      oppervlakte- of inhoudsmetingen, en voorzover meetwerktuigen betreft tevens voor het meten van hoeveelheden
      electrische energie;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel1
  - number: 1.b
    text: '*gewichten en weegwerktuigen:* voorwerpen en instrumenten bestemd of gebruikt voor het verrichten van wegingen;'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel1
  - number: 1.c
    text: '*fijne weging goud:* de weging van edele metalen, parels en edelstenen;'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel1
  - number: 1.d
    text: '*fijne weging geneesmiddelen:* de weging van geneesmiddelen volgens doktersrecept;'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel1
  - number: 1.e
    text: '*grove weging:* weging van waren waarvan nauwkeurige gewichtsbepaling niet mogelijk of niet nodig is;'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel1
  - number: 1.f
    text: |-
      *ijk en ijken:* het waarmerken met geldige goedkeurings- of afkeuringsmerken, dan wel het afgeven van schriftelijke
      verklaringen ter vervanging van dat waarmerken door daartoe bevoegde ambtenaren op grond van door hen verrichte
      keuring van de daaraan onderworpen, nog niet in gebruik genomen maten, gewichten, meet- en weegwerktuigen;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel1
  - number: 1.g
    text: |-
      *herijk en herijken:* het periodiek waarmerken met geldige goedkeurings- of afkeuringsmerken, dan wel het afgeven
      van schriftelijke verklaringen ter vervanging van dat waarmerken door daartoe bevoegde ambtenaren, op grond
      van door hen verrichte keuring van de daaraan onderworpen, reeds in gebruik genomen maten, gewichten, meet- en
      weegwerktuigen.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel1
  - number: '2'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor grootheden meeteenheden worden vastgesteld en kunnen tevens regels
      worden gesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel2
  - number: 2.a
    text: het symbool, de aanduiding, de omschrijving en het gebruik van een meeteenheid;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel2
  - number: 2.b
    text: de benaming en de meetstandaard van een grootheid.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel2
  - number: '3'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel3
  - number: '4'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel4
  - number: '5'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel5
  - number: '6.1'
    text: |-
      Het is verboden in de uitoefening van een beroep of bedrijf bij het vragen, het aanbieden of het leveren van
      goederen of diensten:
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel6
  - number: 6.1.a
    text: |-
      een grootheid uit te drukken in een andere meeteenheid dan de meeteenheid die krachtens [artikel 2][ref1] voor die
      grootheid is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel2
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '2'
        paragraaf: '1'
  - number: 6.1.b
    text: |-
      voor een grootheid een andere benaming te bezigen in strijd met de krachtens [artikel 2][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel2
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '2'
        paragraaf: '1'
  - number: '6.2'
    text: |-
      Dit verbod is niet van toepassing op aankondigingen betreffende goederen, buitenslands gelegen dan wel voor het
      buitenland bestemd, of die in de toestand, waarin zij uit het buitenland zijn ingevoerd, bij de maat of het gewicht
      worden verkocht, voor zover dit in het land van herkomst gangbare aanduidingen betreft.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel6
  - number: '6.3'
    text: |-
      Ten aanzien van hier te lande gefabriceerde artikelen, welke in verpakte toestand op de markt verschijnen, mogen
      aankondigingen betreffende maat of gewicht, behalve in metrieke aanduidingen krachtens [artikel 4][ref1] geldend,
      tevens in niet metrieke plaats hebben, mits deze laatste aanduidingen niet over de eerste domineren.


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel4
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '4'
        paragraaf: '1'
  - number: '6.4'
    text: |-
      Aankondigingen betreffende textiel mogen, behalve per meter, tevens per yard plaats hebben, mits deze laatste
      aanduidingen niet over de eerste domineren. De yard wordt hierbij gelijkgesteld aan 91,44 cm.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel6
  - number: '6.5'
    text: Aankondigingen betreffende bouwmaterialen mogen per voet plaats hebben.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel6
  - number: '7'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel7
  - number: '8'
    text: |-
      Het is verboden waren per maat of gewicht te verkopen, te koop aan te bieden of op welke wijze ook in de handel te
      brengen, anders dan bij netto-inhoud of netto-gewicht.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel8
  - number: '9'
    text: 'Bij ministeriële regeling kunnen:'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel9
  - number: 9.a
    text: |-
      bepaalde verpakte artikelen worden aangewezen, waarop de netto-inhoud in metrieke maat of gewicht duidelijk moet
      zijn aangegeven;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel9
  - number: 9.b
    text: bepaalde goederen worden aangewezen, welke niet anders dan bij maat of gewicht mogen worden verkocht.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel9
  - number: 9.c
    text: |-
      voorschriften worden gegeven betreffende de mate waarin verpakkingen, die een bepaalde inhoud naar maat of gewicht
      doen veronderstellen, tenminste moeten zijn vervuld;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel9
  - number: 9.d
    text: |-
      bepaalde goederen worden aangewezen, welke niet anders dan in voor te schrijven maat- of gewichtshoeveelheden mogen
      worden verkocht.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel9
  - number: '10'
    text: |-
      De werkzaamheden, voortvloeiende uit het bij of krachtens deze wet bepaalde worden door een door het
      Bestuurscollege aan te wijzen dienst verricht.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel10
  - number: '11'
    text: |-
      Bij eilandsbesluit, houdende algemene maatregelen, worden de inrichting, samenstelling, werkwijze en bevoegdheden
      van de in [artikel 10][ref1] bedoelde dienst geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel10
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '10'
        paragraaf: '2'
  - number: '12'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel12
  - number: '13'
    text: 'De ijkmerken worden onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel13
  - number: 13.a
    text: goedkeuringsmerken; deze hebben een beperkte geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel13
  - number: 13.b
    text: afkeuringsmerken;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel13
  - number: 13.c
    text: verzegelingsmerken;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel13
  - number: '14.1'
    text: Bij ijk of herijk goedgekeurde maten, gewichten, meet- of weegwerktuigen krijgen een goedkeuringsmerk.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel14
  - number: '14.2'
    text: Vorm en geldigheidsduur daarvan worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel14
  - number: '14.3'
    text: |-
      Het hoofd van de in [artikel 10][ref1] bedoelde dienst bepaalt in welke gevallen het goedkeuringsmerk vervangen
      wordt door een schriftelijke verklaring, welke vrij van zegel is.


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel10
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '10'
        paragraaf: '2'
  - number: '15'
    text: |-
      Bij ijk of herijk afgekeurde maten, gewichten, meet- of weegwerktuigen krijgen een afkeuringsmerk. Dit
      afkeuringsmerk bestaat uit een gelijkzijdige driehoek, gearceerd loodrecht op een der zijden.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel15
  - number: '16.1'
    text: Het verzegelingsmerk is een kroon.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel16
  - number: '16.2'
    text: |-
      Het hoofd van de in [artikel 10][ref1] bedoelde dienst bepaalt de gevallen waarin een verzegelingsmerk wordt
      aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel10
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '10'
        paragraaf: '2'
  - number: '17'
    text: |-
      Bij ministeriële regeling worden de meet- en weegeigenschappen alsmede de overige bepalingen vastgesteld waaraan
      maten, gewichten, meet- en weegwerktuigen moeten voldoen om bij ijk of herijk te kunnen worden goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel17
  - number: '18'
    text: |-
      Op verzoek kunnen ook maten, gewichten, meet- en weegwerktuigen, welke niet voldoen aan de eisen gesteld
      ingevolge [artikel 17][ref1], alsmede diverse instrumenten voor zover de outillage zulks toelaat, door de in
      [artikel 10][ref2] bedoelde dienst worden onderzocht. Van dit onderzoek kan een verklaring worden afgegeven, welke
      vrij van zegel is.


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0028247#Artikel10
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '17'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028247
        artikel: '10'
        paragraaf: '2'
  - number: '19'
    text: |-
      Behoudens het bepaalde in [artikel 20][ref1] zijn aan ijk en herijk onderworpen:


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel20
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '20'
        paragraaf: '4'
  - number: 19.a
    text: 'de maten, gewichten, meet- en weegwerktuigen welke zich bevinden op plaatsen bestemd voor of gebruikt tot:'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel19
  - number: 19.a.1e
    text: het drijven van handel;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel19
  - number: 19.a.2e
    text: het bepalen van maat of gewicht ten behoeve van het drijven van handel;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel19
  - number: 19.a.3e
    text: het doen van leveringen;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel19
  - number: 19.a.4e
    text: het vaststellen van heffingen of arbeidsloon naar grondslag van maat of gewicht;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel19
  - number: 19.b
    text: de watermeters en electriciteitsmeters.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel19
  - number: '20'
    text: 'Van ijk en herijk zijn vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel20
  - number: 20.a
    text: |-
      de maten, gewichten, meet- en weegwerktuigen, niet bestemd en niet gebruikt voor handelsdoeleinden, welke als
      zodanig bij ministeriële regeling worden aangewezen en voldoen aan de regelen daarin te stellen;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel20
  - number: 20.b
    text: |-
      de maten, gewichten, meet- en weegwerktuigen, welke uitsluitend bestemd zijn en gebruikt worden voor
      bedrijfscontrole, mits zij zich niet bevinden in winkels of op markten;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel20
  - number: 20.c
    text: |-
      de maten en meetwerktuigen, welke uitsluitend bestemd zijn en gebruikt worden voor leveranties aan het buitenland
      en aan schepen.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel20
  - number: '21'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel21
  - number: '22'
    text: |-
      De openbare lichamen Bonaire, Sint Eustatius en Saba kunnen voor de ten behoeve van belanghebbenden uit te voeren
      ijkwerkzaamheden een retributie heffen.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel22
  - number: '23'
    text: Maten, gewichten, meet- en weegwerktuigen moeten worden gebruikt overeenkomstig hun aard en hun bestemming.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel23
  - number: '24'
    text: |-
      Inhoudsmaten moeten worden gevuld tot aan hun meetrand. Inhoudsmaten voor granen moeten na het vullen worden
      afgestreken met een strijker.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel24
  - number: '25'
    text: |-
      Meet- en weegwerktuigen, welke worden gebruikt in de kleinhandel, met uitzondering van die welke uitsluitend worden
      gebruikt voor het klaar maken van in verpakte toestand te koop aan te bieden of aan huis af te leveren goederen,
      moeten zodanig zijn geplaatst dat de koper het afmeten of afwegen kan gadeslaan en de aanwijzing duidelijk kan
      aflezen.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel25
  - number: '26.1'
    text: Weegwerktuigen mogen niet gebruikt worden ter bepaling van een gewicht groter dan 100% van het weegvermogen.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel26
  - number: '26.2'
    text: |-
      Weegwerktuigen voor fijne weging goud of fijne weging geneesmiddelen mogen niet worden gebruikt ter bepaling van
      een gewicht minder dan 1/2% van het weegvermogen.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel26
  - number: '26.3'
    text: Andere weegwerktuigen mogen niet worden gebruikt ter bepaling van een gewicht minder dan 2% van het weegvermogen.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel26
  - number: '27.1'
    text: |-
      Fijne weging goud of fijne weging geneesmiddelen mag niet anders geschieden dan met gewichten en weegwerktuigen,
      die als zodanig zijn geijkt of herijkt.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel27
  - number: '27.2'
    text: |-
      Weegwerktuigen voor grove weging mogen niet worden gebruikt voor de weging van andere goederen dan hiervoor bij
      ministeriële regeling worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel27
  - number: '28.1'
    text: |-
      Het is verboden te koop aan te bieden, te verkopen, te huur aan te bieden of te verhuren, alsmede op de plaatsen
      bedoeld in [artikel 19 onder a][ref1] voorhanden te hebben maten, gewichten, meet- en weegwerktuigen:


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel19
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '19'
        paragraaf: '4'
  - number: 28.1.a
    text: voorzien van een afkeuringsmerk;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28
  - number: 28.1.b
    text: niet voorzien van een geldig goedkeuringsmerk of de daarvoor in de plaats tredende verklaring;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28
  - number: 28.1.c
    text: |-
      niet voorzien van alle ingevolge [artikel 16][ref1] vereiste verzegelingsmerken;


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel16
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '16'
        paragraaf: '3'
  - number: 28.1.d
    text: |-
      welke na de verkrijging van het laatste goedkeuringsmerk herstellingen of veranderingen hebben ondergaan die
      invloed kunnen hebben op de weeg- of meeteigenschappen of waarvan de ijkmerken zijn beschadigd;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28
  - number: 28.1.e
    text: |-
      welke een lengte, inhoud, gewicht of aanwijzing hebben, welke meer afwijkt van de juiste waarde dan het dubbele van
      de afwijking, die bij herijk is toegestaan;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28
  - number: 28.1.f
    text: |-
      waarop kentekenen voorkomen, welke het mogelijk maken daarmede maat of gewicht te bepalen in een
      andere dan op grond van [artikel 2][ref1] vastgestelde meeteenheid, behoudens de gevallen bedoeld in
      [artikel 6, vierde en vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028247#Artikel6
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028247
        artikel: '6'
        paragraaf: '1'
  - number: '28.2'
    text: |-
      Dit verbod is niet van toepassing ten aanzien van maten, gewichten, meet- en weegwerktuigen bedoeld in
      [artikel 20][ref1], alsmede de watermeters en electriciteitsmeters zolang deze niet ingevolge [artikel 41][ref2]
      aan ijk en herijk zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0028247#Artikel41
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '20'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028247
        artikel: '41'
        paragraaf: '9'
  - number: 28a.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe door het
      Bestuurscollege aangewezen personen. Een zodanige aanwijzing wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28a
  - number: 28a.2
    text: |-
      De krachtens het eerste lid aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28a
  - number: 28a.2.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28a
  - number: 28a.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28a
  - number: 28a.2.c
    text: goederen aan opneming en onderzoek te onderwerpen en deze daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28a
  - number: 28a.2.d
    text: |-
      maten, gewichten, meet- en weegwerktuigen op de plaatsen, in [artikel 19, onderdeel a][ref1], vermeld, te allen
      tijde te onderzoeken en, indien zij niet voldoen aan de bij of krachtens deze wet voor het rijk gestelde eisen, van
      een afkeuringsmerk te voorzien;


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel19
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '19'
        paragraaf: '4'
  - number: 28a.2.f
    text: |-
      alle plaatsen, bedoeld in [artikel 19, onderdeel a][ref1], met uitzondering van woningen zonder de uitdrukkelijke
      toestemming van de bewoner, te betreden, vergezeld van door hen aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel19
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '19'
        paragraaf: '4'
  - number: 28a.3
    text: |-
      Zo nodig, wordt de ingang tot een plaats als bedoeld in het tweede lid, onderdeel f, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28a
  - number: 28a.4
    text: |-
      Bij ministeriële regeling, kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening van de
      krachtens het eerste lid aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28a
  - number: 28a.5
    text: |-
      Een ieder is verplicht aan de krachtens het eerste lid aangewezen personen alle medewerking te verlenen die op
      grond van het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel28a
  - number: '29'
    text: |-
      Met gevangenisstraf van ten hoogste drie jaren wordt, voor zover het [Wetboek van Strafrecht BES][ref1] er niet in
      voorziet, gestraft:


      [ref1]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028570
  - number: 29.1e
    text: hij, die op maten, gewichten, meet- of weegwerktuigen valse ijkmerken plaatst;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel29
  - number: 29.2e
    text: hij, die wederrechtelijk gebruik maakt van echte stempels;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel29
  - number: 29.3e
    text: |-
      hij, die echte ijkmerken inzet, aanvoegt of overbrengt in, aan of op andere maten, gewichten, meet- of
      weegwerktuigen dan die, waaraan zij oorspronkelijk zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel29
  - number: '30'
    text: |-
      Met gevangenisstraf van ten hoogste drie jaren wordt, voor zover het [Wetboek van Strafrecht BES][ref1] er niet in
      voorziet, gestraft:


      [ref1]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028570
  - number: 30.1e
    text: |-
      hij, die maten, gewichten, meet- en weegwerktuigen, nadat zij van een ijkmerk zijn voorzien, vervalst, met het
      oogmerk om ze als echt en onvervalst te gebruiken of te doen gebruiken;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel30
  - number: 30.2e
    text: |-
      hij, die opzettelijk gebruik maakt van vervalste maten, gewichten, meet- en weegwerktuigen, als waren zij echt
      en onvervalst.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel30
  - number: '31'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar wordt, voor zover het [Wetboek van Strafrecht BES][ref1] er niet in
      voorziet, gestraft:


      [ref1]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028570
  - number: 31.1e
    text: |-
      hij, die een geijkt voorwerp ontdoet van het daarop geplaatste afkeuringsmerk, met het oogmerk dat voorwerp te
      gebruiken of te doen gebruiken als ware het niet afgekeurd;
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel31
  - number: 31.2e
    text: |-
      hij, die opzettelijk een van een afkeuringsmerk ontdaan voorwerp gebruikt, verkoopt, te koop aanbiedt, aflevert of
      ten verkoop voorhanden heeft, als ware het niet afgekeurd.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel31
  - number: '32'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar wordt, voor zover het [Wetboek van Strafrecht BES][ref1] er niet
      in voorziet, gestraft, hij, die ten behoeve van handel en bedrijf getal, maat of gewicht der goederen heeft
      vastgesteld of op zijn last heeft doen vaststellen, wetende of redelijkerwijze kunnende vermoeden, dat de
      vastgestelde netto-hoeveelheid in zijn voordeel of het voordeel van de lastgever afwijkt van de ware netto-
      hoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028570
  - number: '33'
    text: |-
      De in de [artikelen 29 t/m 32][ref1] strafbaar gestelde feiten worden beschouwd als misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel29
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '29'
        paragraaf: '7'
  - number: '34'
    text: |-
      Met hechtenis van ten hoogste een week of geldboete van ten hoogste USD 110 wordt gestraft hij, die handelt
      in strijd met dan wel niet voldoet aan de vereisten gesteld in een der [artikelen 6][ref1], [8][ref2] en
      [23 t/m 28][ref3], alsmede de aanwijzing gedaan krachtens [artikel 9][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028247#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028247#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0028247#Artikel9
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028247
        artikel: '8'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028247
        artikel: '23'
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0028247
        artikel: '9'
        paragraaf: '1'
  - number: '35'
    text: |-
      Met hechtenis van ten hoogste een week of geldboete van ten hoogste USD 110 wordt gestraft hij, die ten behoeve van
      handel of bedrijf, getal, maat of gewicht der goederen heeft vastgesteld of op zijn last heeft doen vaststellen,
      indien die netto-hoeveelheid meer dan het dubbele van de afwijking, die voor het gebezigde weeg- of meetwerktuig
      bij herijk is toegestaan, in zijn voordeel of het voordeel van de lastgever afwijkt van de ware netto-hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel35
  - number: '36'
    text: |-
      De in de [artikelen 34][ref1] en [35][ref2] strafbaar gestelde feiten worden beschouwd als overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0028247#Artikel35
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '34'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0028247
        artikel: '35'
        paragraaf: '7'
  - number: '37'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel37
  - number: '38'
    text: |-
      In beslag genomen maten, gewichten, meet- en weegwerktuigen worden niet aan de rechthebbende teruggegeven alvorens
      te zijn geijkt of herijkt.
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel38
  - number: '39'
    text: |-
      Met het opsporen van de in deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 184 van het Wetboek van Strafvordering Bonaire, Sint Eustatius en Saba][ref1], belast de door Onze
      Minister van Veiligheid en Justitie, in overeenstemming met Onze Minister van Economische Zaken aangewezen
      ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '40'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel40
  - number: '41.1'
    text: |-
      Het gestelde in [artikel 19, onder b][ref1], betreffende watermeters treedt in werking op een bij ministeriële
      regeling te bepalen tijdstip, dat voor de onderscheiden openbare lichamen Bonaire, Sint Eustatius en Saba
      verschillend kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel19
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '19'
        paragraaf: '4'
  - number: '41.2'
    text: |-
      In een ministeriële regeling als bedoeld in het tweede lid kan tevens bepaald worden dat de inwerkingtreding van
      [artikel 28, eerste lid, onder b, c en e][ref1], voor watermeters wordt uitgesteld tot het tijdstip waarop zij in
      de openbare lichamen Bonaire, Sint Eustatius en Saba voor de eerste maal zijn geijkt of herijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028247#Artikel28
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0028247
        artikel: '28'
        paragraaf: '6'
  - number: '42'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel42
  - number: '43'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel43
  - number: '44'
    text: 'Deze wet wordt aangehaald als: IJkwet BES.'
    url: https://wetten.overheid.nl/BWBR0028247/2014-01-25#Artikel44
