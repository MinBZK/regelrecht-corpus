---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_medezeggenschap_clienten_zorginstellingen
regulatory_layer: WET
publication_date: '2021-10-27'
valid_from: '2015-01-01'
bwb_id: BWBR0007920
url: https://wetten.overheid.nl/BWBR0007920/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is wettelijke regels te stellen ter bevordering van de
    medezeggenschap van de cliënten van uit collectieve middelen gefinancierde instellingen op het terrein van de
    maatschappelijke zorg en gezondheidszorg;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel1
  - number: 1.1.b
    text: 'instelling:'
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel1
  - number: 1.1.b.1°
    text: |-
      een instelling in de zin van de [Wet toelating zorginstellingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018906
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018906
  - number: 1.1.b.2°
    text: |-
      elk in de maatschappij als zelfstandige eenheid optredend organisatorisch verband waarin gezondheidszorg wordt
      verleend en dat wordt gefinancierd:
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel1
  - number: 1.1.b.2°.a
    text: |-
      door het Zorginstituut Nederland op grond van de [Zorgverzekeringswet][ref1] of de [Wet langdurige zorg][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0035917
  - number: 1.1.b.2°.b
    text: |-
      door Onze Minister op grond van [Kaderwet VWS-subsidies][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009455
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009455
  - number: 1.1.b.3°
    text: |-
      elk in de maatschappij als zelfstandige eenheid optredend organisatorisch verband waarin verslavingszorg wordt
      verleend en dat wordt gefinancierd door Onze Minister, een gemeente of een provincie;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel1
  - number: 1.1.c
    text: 'zorgaanbieder:'
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel1
  - number: 1.1.c.1°
    text: een rechtspersoon of natuurlijke persoon, die een instelling in stand houdt;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel1
  - number: 1.1.c.2°
    text: de rechtspersonen of natuurlijke personen, die gezamenlijk een instelling in stand houden;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel1
  - number: 1.1.d
    text: 'cliënt: een natuurlijk persoon ten behoeve van wie de instelling werkzaam is.'
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel1
  - number: '1.2'
    text: |-
      Bij ministeriële regeling kunnen in de maatschappij als zelfstandige eenheid optredende organisatorische verbanden
      waarin gezondheidszorg wordt verleend en die, anders dan op grond van een wettelijke bekostigingsregeling door Onze
      Minister worden gefinancierd, worden aangemerkt als instelling in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel1
  - number: '1.3'
    text: |-
      Deze wet is niet van toepassing op justitiële inrichtingen voor verpleging van ter beschikking gestelden als
      bedoeld in [artikel 90 quinquies, tweede lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel90quinquies
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 90quinquies
  - number: '2.1'
    text: |-
      De zorgaanbieder stelt voor elke door hem in stand gehouden instelling een cliëntenraad in, die binnen het kader
      van de doelstellingen van de instelling in het bijzonder de gemeenschappelijke belangen van de cliënten behartigt.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel2
  - number: '2.2'
    text: 'De zorgaanbieder regelt schriftelijk:'
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel2
  - number: 2.2.a
    text: |-
      het aantal leden van de cliëntenraad, de wijze van benoeming, welke personen tot lid kunnen worden benoemd en de
      zittingsduur van de leden;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel2
  - number: 2.2.b
    text: |-
      de materiële middelen van de instelling, waarover de cliëntenraad ten behoeve van zijn werkzaamheden kan
      beschikken.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel2
  - number: '2.3'
    text: 'De in het tweede lid bedoelde regeling is zodanig dat de cliëntenraad:'
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel2
  - number: 2.3.a
    text: redelijkerwijze representatief kan worden geacht voor de cliënten en
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel2
  - number: 2.3.b
    text: redelijkerwijze in staat kan worden geacht hun gemeenschappelijke belangen te behartigen.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel2
  - number: '2.4'
    text: De cliëntenraad regelt schriftelijk zijn werkwijze met inbegrip van zijn vertegenwoordiging in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel2
  - number: '2.5'
    text: |-
      De kosten van het voeren van rechtsgedingen door de cliëntenraad, zoals bedoeld in [artikel 10, tweede lid][ref1],
      komen slechts ten laste van de zorgaanbieder indien deze van de te maken kosten vooraf in kennis is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007920#Artikel10
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007920
        artikel: '10'
        hoofdstuk: V
  - number: '2.6'
    text: |-
      Na vaststelling van de in het tweede lid bedoelde regeling treft de zorgaanbieder de voorzieningen die op grond
      van die regeling noodzakelijk zijn voor de benoeming van de leden van de cliëntenraad. De zorgaanbieder treft
      de bedoelde voorzieningen opnieuw telkens wanneer de cliëntenraad gedurende twee jaren niet heeft gefunctioneerd
      wegens het ontbreken van het in de regeling vastgestelde aantal leden.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel2
  - number: '3.1'
    text: |-
      De zorgaanbieder stelt de cliëntenraad in ieder geval in de gelegenheid advies uit te brengen over elk voorgenomen
      besluit dat de instelling betreft, inzake:
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: 3.1.a
    text: een wijziging van de doelstelling of de grondslag;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: 3.1.b
    text: |-
      het overdragen van de zeggenschap of fusie of het aangaan of verbreken van een duurzame samenwerking met een andere
      instelling;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: 3.1.c
    text: de gehele of een gedeeltelijke opheffing van de instelling, verhuizing of ingrijpende verbouwing;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: 3.1.d
    text: een belangrijke wijziging in de organisatie;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: 3.1.e
    text: een belangrijke inkrimping, uitbreiding of andere wijziging van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: 3.1.f
    text: |-
      het benoemen van personen die rechtstreeks de hoogste zeggenschap zullen uitoefenen bij de leiding van arbeid in
      de instelling;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: 3.1.g
    text: de begroting en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: 3.1.h
    text: het algemeen beleid inzake de toelating van cliënten en de beëindiging van deze zorgverlening aan cliënten;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: 3.1.i
    text: |-
      voedingsaangelegenheden van algemene aard en het algemeen beleid op het gebied van de veiligheid, de gezondheid
      of de hygiëne en de geestelijke verzorging van, maatschappelijke bijstand aan en recreatiemogelijkheden en
      ontspanningsactiviteiten voor cliënten;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: 3.1.j
    text: de systematische bewaking, beheersing of verbetering van de kwaliteit van de aan cliënten te verlenen zorg;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: 3.1.k
    text: |-
      de vaststelling of wijziging van een regeling inzake de behandeling van klachten van cliënten en het aanwijzen van
      personen die belast worden met de behandeling van klachten van cliënten;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: 3.1.l
    text: |-
      wijziging van de regeling, bedoeld in [artikel 2, tweede lid][ref1], en de vaststelling of wijziging van andere
      voor cliënten geldende regelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0007920#Artikel2
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007920
        artikel: '2'
        hoofdstuk: II
  - number: 3.1.m
    text: |-
      het belasten van personen met de leiding van een onderdeel van de instelling, waarin gedurende het etmaal zorg
      wordt verleend aan cliënten die in de regel langdurig in die instelling verblijven.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: '3.2'
    text: Het advies wordt op een zodanig tijdstip gevraagd, dat het van wezenlijke invloed kan zijn op het te nemen besluit.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: '3.3'
    text: |-
      De cliëntenraad is bevoegd de zorgaanbieder ook ongevraagd te adviseren inzake de in het eerste lid genoemde en
      andere onderwerpen, die voor de cliënten van belang zijn.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel3
  - number: '4.1'
    text: |-
      De zorgaanbieder neemt geen van een schriftelijk door de cliëntenraad uitgebracht advies afwijkend besluit dan
      nadat daarover, voor zover dat redelijkerwijze mogelijk is, ten minste eenmaal met de cliëntenraad overleg is
      gepleegd.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel4
  - number: '4.2'
    text: |-
      Ten aanzien van de onderwerpen, genoemd in [artikel 3, eerste lid, onder i tot en met m][ref1], neemt de
      zorgaanbieder, behoudens voor zover het besluit door de zorgaanbieder moet worden genomen krachtens een wettelijk
      voorschrift, geen van een door de cliëntenraad schriftelijk uitgebracht advies afwijkend besluit, tenzij de
      commissie, bedoeld in [artikel 10][ref2], heeft vastgesteld dat de zorgaanbieder bij afweging van de betrokken
      belangen in redelijkheid tot zijn voornemen heeft kunnen komen.


      [ref1]: https://wetten.overheid.nl/BWBR0007920#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007920#Artikel10
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007920
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007920
        artikel: '10'
        hoofdstuk: V
  - number: '4.3'
    text: |-
      De zorgaanbieder doet van een besluit inzake een onderwerp waarover de cliëntenraad schriftelijk advies heeft
      uitgebracht, schriftelijk, en voor zover hij van het advies afwijkt onder opgave van redenen, mededeling aan de
      cliëntenraad.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel4
  - number: '4.4'
    text: |-
      Een besluit van de zorgaanbieder, genomen in strijd met het tweede lid, is nietig, indien de cliëntenraad tegenover
      de zorgaanbieder schriftelijk een beroep op de nietigheid heeft gedaan. De cliëntenraad kan slechts een beroep op
      de nietigheid doen binnen een maand nadat de zorgaanbieder hem zijn besluit heeft medegedeeld dan wel, bij gebreke
      van deze mededeling, de cliëntenraad is gebleken dat de zorgaanbieder uitvoering of toepassing geeft aan zijn
      besluit.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel4
  - number: '5.1'
    text: |-
      De zorgaanbieder verstrekt de cliëntenraad tijdig en, desgevraagd, schriftelijk alle inlichtingen en gegevens die
      deze voor de vervulling van zijn taak redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel5
  - number: '5.2'
    text: |-
      De zorgaanbieder verstrekt de cliëntenraad voorts ten minste eenmaal per jaar mondeling of schriftelijk algemene
      gegevens omtrent het beleid dat in het verstreken tijdvak is gevoerd en in het komende jaar zal worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel5
  - number: '6.1'
    text: |-
      De zorgaanbieder kan aan de cliëntenraad schriftelijk verder gaande bevoegdheden dan de in deze wet genoemde
      toekennen. Een zodanig besluit wordt schriftelijk aan de cliëntenraad medegedeeld.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel6
  - number: '6.2'
    text: |-
      De zorgaanbieder stelt de cliëntenraad in de gelegenheid advies uit te brengen over een voornemen een besluit
      te nemen als bedoeld in het eerste lid en over het voornemen een zodanig besluit te wijzigen. Artikel 4 is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel6
  - number: '7.1'
    text: |-
      Indien de zorgaanbieder een rechtspersoon is als bedoeld in artikel 3 van Boek 2 van het Burgerlijk Wetboek,
      voorzien de statuten in een regeling die waarborgt dat de cliënten invloed kunnen uitoefenen op de samenstelling
      van het bestuur. De bedoelde regeling houdt ten minste in dat één bestuurslid wordt benoemd op bindende voordracht
      van de cliëntenraad of cliëntenraden, tenzij deze van de mogelijkheid een voordracht te doen, geen gebruik heeft
      onderscheidenlijk hebben gemaakt.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid is niet van toepassing indien het bestuur van een zorgaanbieder bestaat uit één of meer personen die
      deze functie uitoefent of uitoefenen op grond van een arbeidsrelatie waaraan een geldelijke beloning is verbonden.
      In dat geval is het eerste lid van overeenkomstige toepassing op de samenstelling van het orgaan dat is belast met
      het toezicht op of goedkeuring van besluiten van het bestuur.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel7
  - number: '8'
    text: |-
      De zorgaanbieder stelt jaarlijks een schriftelijk verslag op over de wijze waarop ten aanzien van de instelling
      deze wet is toegepast.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel8
  - number: '9.1'
    text: 'De zorgaanbieder maakt binnen tien dagen na vaststelling openbaar:'
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel9
  - number: 9.1.a
    text: het jaarverslag;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel9
  - number: 9.1.b
    text: |-
      op schrift gestelde uitgangspunten voor het beleid, waaronder begrepen de algemene criteria, welke bij de
      zorgverlening worden gehanteerd;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel9
  - number: 9.1.c
    text: |-
      de notulen en de besluitenlijst van de vergaderingen van het bestuur, voor zover deze algemene beleidszaken
      betreffen;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel9
  - number: 9.1.d
    text: |-
      een regeling inzake de behandeling van klachten van cliënten en andere voor cliënten geldende regelingen, alsmede
      een regeling als bedoeld in [artikel 2, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007920#Artikel2
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007920
        artikel: '2'
        hoofdstuk: II
  - number: 9.1.e
    text: |-
      het verslag, bedoeld in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007920#Artikel8
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007920
        artikel: '8'
        hoofdstuk: IV
  - number: '9.2'
    text: |-
      De openbaarmaking geschiedt door de stukken voor cliënten ter inzage te leggen en hen op verzoek daarvan
      afschriften te verstrekken.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel9
  - number: '9.3'
    text: |-
      Van de terinzagelegging wordt mededeling gedaan op de in de instelling voor het doen van mededelingen aan cliënten
      gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel9
  - number: '9.4'
    text: |-
      Voor het op verzoek verstrekken van afschriften kan een tarief in rekening worden gebracht, ten hoogste gelijk aan
      de kostprijs, tenzij ten aanzien van de instelling de [Wet openbaarheid van bestuur][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: '10.1'
    text: |-
      De zorgaanbieder stelt in overeenstemming met de cliëntenraad of cliëntenraden een uit drie leden bestaande
      commissie van vertrouwenslieden in, waarvan een lid door hem wordt aangewezen, een lid door de cliëntenraad
      of cliëntenraden kan worden aangewezen en een lid door de beide andere leden wordt aangewezen, of wijst een
      door een of meer cliëntenorganisaties en een of meer organisaties van zorgaanbieders ingestelde commissie van
      vertrouwenslieden aan, die tot taak heeft te bemiddelen en zonodig een bindende uitspraak te doen:
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel10
  - number: 10.1.a
    text: |-
      op verzoek van de cliëntenraad, in geschillen met de zorgaanbieder over de uitvoering van [de artikelen 3][ref1],
      [4, eerste en derde lid][ref2], [5, eerste lid][ref3], en [9][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0007920#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007920#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007920#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0007920#Artikel9
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007920
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007920
        artikel: '4'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0007920
        artikel: '5'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0007920
        artikel: '9'
        hoofdstuk: IV
  - number: 10.1.b
    text: |-
      op verzoek van de zorgaanbieder, indien deze ten aanzien van een onderwerp, genoemd in
      [artikel 3, eerste lid, onder i tot en met m][ref1], waarover door de cliëntenraad een schriftelijk advies is
      uitgebracht, een van dat advies afwijkend besluit wenst te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0007920#Artikel3
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007920
        artikel: '3'
        hoofdstuk: II
  - number: '10.2'
    text: |-
      De cliëntenraad en iedere cliënt van de instelling kunnen de kantonrechter van de rechtbank van het arrondissement
      waarin de woonplaats van de zorgaanbieder is gelegen schriftelijk verzoeken de zorgaanbieder te bevelen
      [de artikelen 2, 5, tweede lid, 7 en 8 en het eerste lid van dit artikel][ref1] na te leven. Een verzoeker die niet
      vooraf schriftelijk aan de zorgaanbieder heeft verzocht te handelen overeenkomstig hetgeen in het verzoekschrift
      is verzocht en deze daarbij niet een redelijke termijn heeft gegeven om aan dat verzoek te voldoen, wordt niet-
      ontvankelijk verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0007920#Artikel10
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007920
        artikel: '10'
        hoofdstuk: V
  - number: '10.3'
    text: |-
      De kantonrechter kan in zijn beschikking aan de zorgaanbieder de verplichting opleggen bepaalde handelingen te
      verrichten of na te laten.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel10
  - number: '10.4'
    text: |-
      De bepalingen van de derde afdeling van de vijfde titel van het tweede boek van het Wetboek van Burgerlijk
      Rechtsvordering zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel10
  - number: '13.1'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de maand van uitgifte van
      het *Staatsblad* waarin zij wordt geplaatst, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel13
  - number: 13.1.a
    text: |-
      de zorgaanbieder uiterlijk drie maanden na het tijdstip van inwerkingtreding een regeling als bedoeld in
      [artikel 2, tweede lid][ref1], vaststelt;


      [ref1]: https://wetten.overheid.nl/BWBR0007920#Artikel2
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007920
        artikel: '2'
        hoofdstuk: II
  - number: 13.1.b
    text: |-
      de zorgaanbieder uiterlijk drie maanden nadat de onder *a* bedoelde regeling is vastgesteld, de voorzieningen
      treft, die op grond van die regeling noodzakelijk zijn voor de benoeming van de leden van de cliëntenraad;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel13
  - number: 13.1.c
    text: |-
      de artikelen 3 en 4 buiten toepassing blijven ten aanzien van besluiten, genomen voor de datum van benoeming van de
      leden van de cliëntenraad;
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel13
  - number: 13.1.d
    text: |-
      de statuten van de zorgaanbieder uiterlijk zes maanden na het tijdstip van inwerkingtreding in overeenstemming zijn
      met [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007920#Artikel7
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007920
        artikel: '7'
        hoofdstuk: III
  - number: '13.2'
    text: |-
      Indien vóór het tijdstip van inwerkingtreding van deze wet door de zorgaanbieder aan enig orgaan dat in
      het bijzonder werkzaam is ter behartiging van de gemeenschappelijke belangen van cliënten in de instelling,
      bevoegdheden of materiële middelen zijn toegekend, behoudt dat orgaan die bevoegdheden en materiële middelen tot
      het tijdstip met ingang waarvan de leden van de cliëntenraad met toepassing van deze wet zijn benoemd. Voor zover
      de bedoelde bevoegdheden verder gaan dan de in deze wet genoemde, worden die bevoegdheden eveneens toegekend aan de
      cliëntenraad, behoudens overeenkomstige toepassing van [artikel 6, tweede lid][ref1], juncto [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007920#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007920#Artikel4
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007920
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007920
        artikel: '4'
        hoofdstuk: II
  - number: '14'
    text: 'Deze wet kan worden aangehaald als: Wet medezeggenschap cliënten zorginstellingen.'
    url: https://wetten.overheid.nl/BWBR0007920/2015-01-01#Artikel14
