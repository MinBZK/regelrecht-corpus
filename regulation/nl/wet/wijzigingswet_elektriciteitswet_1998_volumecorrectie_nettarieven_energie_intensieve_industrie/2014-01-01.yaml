  - number: III
    text: |-
      1 [Artikel I, onderdelen E, onderdeel 2 en J][ref1], en [artikel II][ref2] treden in werking met ingang van 1
      januari 2014. Indien het Staatsblad waarin deze wet wordt geplaatst, wordt uitgegeven na 31 december 2013, treedt
      zij in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt geplaatst en
      werkt zij terug tot en met 1 januari 2014.

      2 [Artikel I, onderdelen A, B, C, D, E, onderdeel 1, F, G, H, I, K, L en M][ref3] treden in werking met ingang van
      1 januari 2015.


