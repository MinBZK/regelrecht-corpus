preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat wenselijk is een volumecorrectie toe te passen op de nettarieven voor
    energie-intensieve bedrijven om zo hun bijdrage aan de netstabiliteit tot uitdrukking te brengen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034520/2014-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 In 2014 corrigeert de netbeheerder, bedoeld in
      [artikel 1, eerste lid, onderdeel k, van de Elektriciteitswet 1998][ref1], de eigenaar van een gesloten
      distributiesysteem, bedoeld in [artikel 15, vijfde lid, van die wet][ref2] en de producent, bedoeld in
      [artikel 9h, van die wet][ref3], het tarief, bedoeld in [artikel 30, eerste lid, van die wet][ref4] voor een
      afnemer als bedoeld in [artikel 29, zevende lid, van die wet][ref5] met het op basis van artikel 29, zevende lid,
      van die wet bedoelde percentage.

      2 De Autoriteit Consument en Markt kan de tarieven die zullen gelden in het jaar t corrigeren met de gederfde
      inkomsten die voor de netbeheerder van het landelijk hoogspanningsnet zijn ontstaan door toepassing van de
      correctie op grond van het eerste lid.

      3 De methode die de Autoriteit Consument en Markt op basis van [artikel 41e, van de Elektriciteitswet 1998][ref6]
      zoals dat luidde tot en met 31 december 2014, heeft vastgesteld voor de periode van 1 januari 2014 tot
      en met 31 december 2016 wordt met ingang van 1 januari 2015 geacht te zijn vastgesteld op basis van
      [artikel 41, eerste lid, onderdeel b, van die wet][ref7].

      4 In de tariefbesluiten, bedoeld in [artikel 41c, eerste lid, van de Elektriciteitswet 1998][ref8]
      kan de Autoriteit Consument en Markt afwijken van de wijze waarop de geschatte kosten als bedoeld in
      [artikel 41b, tweede lid, van de Elektriciteitswet 1998][ref9] worden bepaald op grond van de voor de jaren 2015
      en 2016 vastgestelde methode krachtens [artikel 41, eerste lid, onderdeel a, van de Elektriciteitswet 1998][ref10]
      voor zover dat noodzakelijk is in verband met deze wet.


