---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_audit_committees_van_het_rijk
regulatory_layer: WET
publication_date: '2017-12-04'
valid_from: '2018-01-01'
bwb_id: BWBR0040281
url: https://wetten.overheid.nl/BWBR0040281/2018-01-01
preamble:
  text: |-
    Gelet op artikel 4.20, tweede lid, aanhef en onderdeel b, van de Comptabiliteitswet 2016;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *audit committee:* het adviesorgaan van een ministerie met betrekking tot
      audit- en bedrijfsvoeringsaangelegenheden;
        - *directeur van de Auditdienst Rijk:* een persoon die deel uitmaakt van de directie van de Auditdienst Rijk;
        - *directeur FEZ:* de persoon die binnen een ministerie leiding geeft aan het centrale dienstonderdeel dat belast
      is met financieel-economische aangelegenheden;
        - *externe leden:* de personen die niet bij of voor het betrokken ministerie werkzaam zijn;
        - *Minister:* de Minister die het aangaat.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel1
  - number: '1.2'
    text: |-
      De begrippen van [artikel 1.1 van de Comptabiliteitswet 2016][ref1] zijn van overeenkomstige toepassing op deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel1
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '1'
  - number: '2'
    text: De Minister die belast is met de leiding van een ministerie stelt een audit committee in.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel2
  - number: '3.1'
    text: 'Het audit committee bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel3
  - number: 3.1.a
    text: personen die behoren tot de ambtelijke leiding van het betrokken ministerie;
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel3
  - number: 3.1.b
    text: ten minste twee onafhankelijke externe leden.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel3
  - number: '3.2'
    text: In afwijking van het eerste lid kan het audit committee uitsluitend uit externe leden bestaan.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel3
  - number: '3.3'
    text: De Minister benoemt uit de leden de voorzitter van het audit committee.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel3
  - number: '3.4'
    text: De Minister benoemt de externe leden op voordracht van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel3
  - number: '3.5'
    text: |-
      De benoeming van de externe leden geschiedt voor de duur van maximaal vier jaren. Zij kunnen voor de duur van
      maximaal vier jaren worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel3
  - number: '3.6'
    text: |-
      Aan de externe leden wordt op eigen verzoek door de Minister ontslag verleend, indien de ontslagdatum afwijkt van
      de duur van de benoeming.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel3
  - number: '4.1'
    text: Ten minste een extern lid beschikt over financiële expertise op het gebied van openbare financiën.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het audit committee stelt voor het werven en selecteren van de externe leden een profielschets op, rekening houdend
      met zijn taken en de gewenste deskundigheid, achtergrond en ervaring van zijn leden.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel4
  - number: '4.3'
    text: |-
      Het audit committee selecteert de externe leden op grond van de profielschets. Het audit committee legt de
      uitkomsten van de selectieprocedure schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel4
  - number: '5.1'
    text: Het audit committee benoemt een ambtelijk secretaris die de vergaderingen bijwoont.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel5
  - number: '5.2'
    text: De secretaris stelt in overleg met de voorzitter voor elke vergadering een agenda op.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel5
  - number: '5.3'
    text: |-
      De secretaris stelt van elke vergadering een verslag op en beheert het archief van het audit committee. Het verslag
      wordt tevens aan de Minister aangeboden. Indien van toepassing bevat het verslag de afwijkende standpunten van de
      externe leden.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel5
  - number: '6'
    text: |-
      De betrokken directeur FEZ en een directeur van de Auditdienst Rijk ondersteunen vanuit hun deskundigheid het audit
      committee bij zijn taken, bedoeld in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040281#Artikel8
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0040281
        artikel: '8'
        paragraaf: '3'
  - number: '7.1'
    text: |-
      Het audit committee vergadert ten minste vier keer per jaar. De vergaderingen sluiten aan bij de relevante momenten
      in de planning- en controlcyclus van het ministerie.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel7
  - number: '7.2'
    text: |-
      De voorzitter kan een aanvullende vergadering bijeen roepen voor zover hij dit nodig acht of een van de leden, de
      betrokken directeur FEZ of een directeur van de Auditdienst Rijk dit verlangt.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel7
  - number: '7.3'
    text: De voorzitter leidt de vergaderingen.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel7
  - number: '7.4'
    text: |-
      De voorzitter kan andere personen dan de leden, bedoeld in [artikel 3, eerste lid][ref1], uitnodigen om aan een
      vergadering deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0040281#Artikel3
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0040281
        artikel: '3'
        paragraaf: '2'
  - number: '7.5'
    text: |-
      De Algemene Rekenkamer ontvangt de vergaderstukken van het audit committee en kan op haar verzoek deelnemen aan
      de vergaderingen.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel7
  - number: '7.6'
    text: |-
      De leden, de betrokken directeur FEZ en een directeur van de Auditdienst Rijk kunnen een onderwerp voor de agenda
      van een volgende vergadering aandragen.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel7
  - number: '8.1'
    text: 'Het audit committee adviseert in elk geval over:'
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel8
  - number: 8.1.a
    text: het borgen van de kwaliteit van de bedrijfsvoering en de financiële verslaggeving;
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel8
  - number: 8.1.b
    text: de regie op het auditbeleid;
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel8
  - number: 8.1.c
    text: het risicomanagementbeleid en de uitkomsten daarvan.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel8
  - number: '8.2'
    text: |-
      Het audit committee legt in elk geval zijn adviezen met betrekking tot het risicomanagementbeleid en de uitkomsten
      daarvan schriftelijk vast. Het audit committee stuurt de adviezen aan de ambtelijke leiding van het betrokken
      ministerie voordat de risicoanalyse van het ministerie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel8
  - number: '9'
    text: Het audit committee kan voor zijn werkzaamheden een huishoudelijk reglement vaststellen.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel9
  - number: '10.1'
    text: 'De externe leden kunnen de ambtelijke leiding van het betrokken ministerie verzoeken om:'
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel10
  - number: 10.1.a
    text: ambtelijke ondersteuning;
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel10
  - number: 10.1.b
    text: |-
      toegang tot alle informatie die zij voor de uitoefening van hun taken, bedoeld in [artikel 8][ref1], nodig achten;


      [ref1]: https://wetten.overheid.nl/BWBR0040281#Artikel8
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0040281
        artikel: '8'
        paragraaf: '3'
  - number: 10.1.c
    text: |-
      te spreken met de betrokken directeur FEZ, een directeur van de Auditdienst Rijk of andere personen die bij of voor
      het betrokken ministerie werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel10
  - number: '10.2'
    text: |-
      De externe leden zijn tot geheimhouding gehouden van de informatie waarvan zij als lid van het audit committee
      kennis hebben genomen.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel10
  - number: '11.1'
    text: De externe leden kunnen een vergoeding ontvangen voor hun werkzaamheden voor het audit committee.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel11
  - number: '11.2'
    text: |-
      De Minister stelt met inachtneming van de [Wet vergoedingen adviescolleges en commissies][ref1] en het
      [Besluit vergoedingen adviescolleges en commissies][ref2] de vergoeding, bedoeld in het eerste lid, vast. De
      vergoeding kan per vergadering of als vaste vergoeding per maand worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024775
      [ref2]: https://wetten.overheid.nl/BWBR0025279
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024775
      - id: ref2
        bwb_id: BWBR0025279
  - number: '11.3'
    text: Een vaste vergoeding per maand is gebaseerd op een maximale arbeidsduurfactor van 0,1.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel11
  - number: '12.1'
    text: Het functioneren van de audit committees van het Rijk wordt periodiek door de Minister van Financiën geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel12
  - number: '12.2'
    text: |-
      Onverminderd het eerste lid evalueert het audit committee ten minste een keer in de twee jaren zelf zijn
      functioneren. Het audit committee legt de uitkomsten van de evaluatie schriftelijk vast en biedt deze aan de
      Minister aan.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel12
  - number: '12.3'
    text: |-
      De evaluatie, bedoeld in het tweede lid, heeft in elk geval betrekking op de uitoefening van de taken, bedoeld
      in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040281#Artikel8
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0040281
        artikel: '8'
        paragraaf: '3'
  - number: '13'
    text: Deze regeling treedt in werking met ingang van 1 januari 2018.
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Regeling audit committees van het Rijk.'
    url: https://wetten.overheid.nl/BWBR0040281/2018-01-01#Artikel14
