  - number: '43.2'
    text: Zienswijzen kunnen naar voren worden gebracht door eenieder.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel43
  - number: '43.3'
    text: Onze Minister geeft toepassing aan de in het eerste lid genoemde afdeling.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel43
  - number: '44'
    text: |-
      De voordracht voor algemene maatregelen van bestuur krachtens deze wet wordt Ons gedaan door Onze Minister of, voor
      zover deze maatregelen worden getroffen in het belang van de bescherming van de bodem, door Onze Minister en Onze
      Minister van Infrastructuur en Milieu te zamen.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel44
  - number: '45'
    text: |-
      De ministeriële regelingen, bedoeld in [hoofdstuk III][ref1], en krachtens [artikel 38, eerste lid][ref2],
      vastgestelde regelingen houdende vrijstelling van het bij of krachtens hoofdstuk III bepaalde worden vastgesteld
      door Onze Minister in overeenstemming met Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel38
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004054
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '38'
        hoofdstuk: VII
  - number: '46'
    text: |-
      Onze Minister zendt in 2007 en vervolgens telkens na ten hoogste vijf jaar aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel46
  - number: '47.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel47
  - number: '47.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel47
  - number: '48'
    text: |-
      Onze Minister kan voorschriften geven betreffende de monsterneming, de verpakking, de conservering, de verzegeling,
      de verzending en het onderzoek van de in [artikel 5:18 van de Algemene wet bestuursrecht][ref1] bedoelde monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '49'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens deze
      wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel49
  - number: '51'
    text: |-
      Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van het bepaalde bij of krachtens
      de [artikelen 7][ref1], [9, tweede en derde lid][ref2], [11, vijfde lid][ref3], [13, vierde lid][ref4],
      [14, eerste lid][ref5], [15][ref6], [34][ref7], [35][ref8], [36][ref9], [37][ref10], [38, derde lid][ref11], of
      [40][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel9
