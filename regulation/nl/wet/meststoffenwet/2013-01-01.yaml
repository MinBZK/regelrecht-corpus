  - number: '55'
    text: |-
      Indien de ernst van de overtreding of de omstandigheden waaronder zij is begaan daartoe aanleiding geven, wordt zij
      aan het openbaar ministerie voorgelegd.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel55
  - number: '57.1'
    text: |-
      Ingeval van overtreding van [artikel 7][ref1] bedraagt de bestuurlijke boete:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel7
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '7'
        hoofdstuk: III
  - number: 57.1.a
    text: |-
      € 7 per kilogram stikstof waarmee de in [artikel 8, onderdeel a][ref1], bedoelde gebruiksnorm voor dierlijke
      meststoffen is overschreden, vermeerderd met


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '8'
        hoofdstuk: III
  - number: 57.1.b
    text: |-
      € 7 per kilogram stikstof waarmee de in [artikel 8, onderdeel b][ref1], bedoelde stikstofgebruiksnorm is
      overschreden, en vermeerderd met


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '8'
        hoofdstuk: III
  - number: 57.1.c
    text: |-
      € 11 per kilogram fosfaat waarmee de in [artikel 8, onderdeel c][ref1], bedoelde fosfaatgebruiksnorm is
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '8'
        hoofdstuk: III
  - number: '57.2'
    text: |-
      Indien zowel de gebruiksnorm voor dierlijke meststoffen als de stikstofgebruiksnorm is overschreden, geldt, in
      zoverre in afwijking van het eerste lid, onderdeel b, een tarief van € 3,50 voor de kilogrammen stikstof waarvoor
      wegens overschrijding van de gebruiksnorm voor dierlijke meststoffen reeds het tarief van € 7 is toegepast.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel57
  - number: '57.3'
    text: |-
      Indien zowel de gebruiksnorm voor dierlijke meststoffen als de fosfaatgebruiksnorm is overschreden, geldt,
      in zoverre in afwijking van het eerste lid, onderdeel c, een tarief van € 5,50 voor de kilogrammen fosfaat
      overeenkomend met het aantal kilogrammen stikstof waarmee de gebruiksnorm voor dierlijke meststoffen is
      overschreden.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel57
  - number: '58.1'
    text: |-
      Ingeval van overtreding van [artikel 14, eerste lid][ref1], bedraagt de bestuurlijke boete € 11 per kilogram
      fosfaat en € 7 per kilogram stikstof waarvan de afvoer niet kan worden verantwoord.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel14
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '14'
        hoofdstuk: IV
  - number: '58.2'
    text: |-
      In afwijking van het eerste lid wordt geen bestuurlijke boete opgelegd voor zover wegens overtreding van
      [artikel 7][ref1] een bestuurlijke boete wordt opgelegd voor de kilogrammen stikstof en fosfaat waarmee de in
      [artikel 8][ref2] bedoelde stikstofgebruiksnorm voor meststoffen, onderscheidenlijk fosfaatgebruiksnorm voor
      meststoffen is overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel8
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '7'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '8'
        hoofdstuk: III
  - number: '60.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen van de [artikelen 57, eerste lid][ref1], en [58, eerste lid][ref2],
      afwijkende tarieven worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '57'
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '58'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '60.2'
    text: De afwijking bedraagt ten hoogste 50%.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel60
  - number: '60.3'
    text: |-
      Na de plaatsing in het Staatsblad van de algemene maatregel van bestuur wordt een voorstel van wet tot regeling van
      het betrokken onderwerp zo spoedig mogelijk bij de Staten-Generaal ingediend. Indien het voorstel wordt ingetrokken
      of indien een van de beide kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene
      maatregel van bestuur onverwijld ingetrokken. Wordt het voorstel tot wet verheven, dan wordt de algemene maatregel
      van bestuur ingetrokken op het tijdstip van inwerkingtreding van die wet.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel60
  - number: '60.4'
    text: |-
      [Artikel 1, tweede lid, van het Wetboek van Strafrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel1
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '1'
  - number: '62.1'
    text: |-
      De op grond van [artikel 57][ref1] of [58][ref2] te bepalen bestuurlijke boete bedraagt ten hoogste het bedrag dat
      is bepaald voor de vijfde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3], per
      overtreding begaan door een natuurlijke persoon, en ten hoogste het bedrag dat is bepaald voor de zesde categorie,
      bedoeld in artikel 23, vierde lid, van het Wetboek van Strafrecht, per overtreding begaan door een rechtspersoon of
      een vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '57'
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '58'
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '62.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de hoogte van de bestuurlijke boete die
      voor een overtreding of voor categorieën van overtredingen ten hoogste kan worden opgelegd ter zake van overtreding
      van het bij of krachtens [artikel 9, tweede en derde lid][ref1], [11, vijfde lid][ref2], [13, vierde lid][ref3],
      [15][ref4], [34][ref5], [35][ref6], [36][ref7], [37][ref8], [38, derde lid][ref9], of [40][ref10] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel34
      [ref6]: https://wetten.overheid.nl/BWBR0004054#Artikel35
      [ref7]: https://wetten.overheid.nl/BWBR0004054#Artikel36
      [ref8]: https://wetten.overheid.nl/BWBR0004054#Artikel37
      [ref9]: https://wetten.overheid.nl/BWBR0004054#Artikel38
      [ref10]: https://wetten.overheid.nl/BWBR0004054#Artikel40
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel62
