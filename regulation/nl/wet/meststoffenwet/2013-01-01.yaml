  - number: 43.1.c
    text: |-
      een besluit als bedoeld in [artikel 38, eerste en tweede lid][ref1], houdende vrijstelling of ontheffing van
      het bepaalde bij of krachtens [artikel 4][ref2], [5][ref3], [6][ref4], [7][ref5], [14][ref6], [16][ref7],
      [19][ref8], [20, eerste lid][ref9], [21][ref10], [26][ref11], [32][ref12] of [33][ref13].


