---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: meststoffenwet
regulatory_layer: WET
publication_date: '2024-12-02'
valid_from: '2013-01-01'
bwb_id: BWBR0004054
url: https://wetten.overheid.nl/BWBR0004054/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen met betrekking tot het verhandelen
    van meststoffen, zowel in het belang van de bevordering van de deugdelijkheid voor het doel waarvoor zij zijn
    bestemd als in het belang van de bescherming van de bodem, en voorts regelen te stellen in het belang van een
    doelmatige afvoer van mestoverschotten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.a
    text: 'grond: dat deel van de bodem dat wordt gebruikt of is bestemd om te worden gebruikt als voedingsbodem voor planten;'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.b
    text: |-
      groeimedium: materiaal in vaste of vloeibare vorm, niet zijnde grond, dat wordt gebruikt of is bestemd om te worden
      gebruikt als voedingsbodem voor planten;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.c
    text: |-
      dierlijke meststoffen: uitwerpselen van voor gebruiks- of winstdoeleinden gehouden dieren, daaronder begrepen de
      geheel of gedeeltelijk verteerde maag- of darminhoud van deze dieren en mengsels van strooisel met de uitwerpselen,
      alsook producten daarvan;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.d
    text: 'meststoffen: dierlijke meststoffen, ongeacht hun bestemming, en producten die zijn bestemd om:'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.d.1°
    text: |-
      te worden toegevoegd aan grond of aan een groeimedium en die geheel of gedeeltelijk bestaan uit stoffen, organismen
      daaronder begrepen, of mengsels van stoffen, die als zodanig kunnen dienen om grond of een groeimedium geschikt of
      beter geschikt te maken als voedingsbodem voor planten;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.d.2°
    text: te worden gebruikt als groeimedium;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.d.3°
    text: |-
      te worden gebruikt als voedsel voor planten of delen van planten, voor zover deze producten niet reeds zijn
      begrepen onder 1° of 2°;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.e
    text: |-
      verhandelen van meststoffen: afleveren van meststoffen aan handelaren in of gebruikers van meststoffen alsmede het
      met het oog daarop voorhanden of in voorraad hebben, aanbieden of vervoeren van meststoffen;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.f
    text: 'Onze Minister: Onze Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.g
    text: |-
      landbouw: akkerbouw, veehouderij – daaronder begrepen elke bedrijfsmatige vorm van houden van dieren voor gebruiks-
      of winstdoeleinden – , tuinbouw – daaronder begrepen fruitteelt en het kweken van bomen, planten, bloemen en
      bloembollen – en bosbouw die aan bij ministeriële regeling gestelde regels voldoet;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.h
    text: 'landbouwgrond: grond waarop daadwerkelijk enige vorm van landbouw wordt uitgeoefend;'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.i
    text: |-
      bedrijf: geheel van productie-eenheden bestaande uit één of meer gebouwen of afgescheiden gedeelten daarvan en de
      daarbij behorende landbouwgrond, uitsluitend of onder meer dienende tot de uitoefening van enige vorm van landbouw,
      zulks beoordeeld naar de feitelijke omstandigheden;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.j
    text: 'stikstof: stikstof, in welke vorm of verbinding dan ook;'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.k
    text: 'fosfaat: fosfor, in welke vorm of verbinding dan ook, vermenigvuldigd met de factor 2,29;'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.l
    text: 'hectare: hectare in gemeten maat;'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.m
    text: |-
      tot het bedrijf behorende oppervlakte landbouwgrond: in Nederland gelegen oppervlakte landbouwgrond, die in het
      kader van een normale bedrijfsvoering bij het bedrijf in gebruik is;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.n
    text: |-
      veengrond: perceel waarvan blijkens representatieve grondmonsters ten minste de helft van de oppervlakte voor meer
      dan de helft van de dikte van de grondlaag tot een diepte van 80 centimeter onder het maaiveld bestaat uit veen;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.o
    text: |-
      zand- of lössgrond: perceel waarvan blijkens representatieve grondmonsters ten minste de helft van de oppervlakte
      voor meer dan de helft van de dikte van de grondlaag tot een diepte van 80 centimeter onder het maaiveld bestaat
      uit zand of löss;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.p
    text: 'kleigrond: grond niet zijnde veengrond of zand- of lössgrond;'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.q
    text: 'grasland: landbouwgrond waarop gras wordt geteeld dat is bestemd om te worden gebruikt als veevoer;'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.r
    text: 'bouwland: landbouwgrond, niet zijnde grasland;'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.s
    text: 'Pw-getal: waarde voor de fosfaattoestand van bouwland, uitgedrukt in milligrammen PO per liter grond;'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.t
    text: 'PAL-getal: waarde voor de fosfaattoestand van grasland, uitgedrukt in milligrammen PO per 100 gram grond;'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.u
    text: |-
      grond met lage fosfaattoestand: landbouwgrond waarvan blijkens de aan Onze Minister verstrekte gegevens de waarde
      voor de fosfaattoestand van de bodem lager is dan het Pw-getal 36 of een daarmee overeenkomende bij ministeriële
      regeling vastgestelde aanduiding, indien het bouwland betreft, dan wel lager is dan het PAL-getal 27 of een daarmee
      overeenkomende bij ministeriële regeling vastgestelde aanduiding, indien het grasland betreft;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.v
    text: |-
      grond met neutrale fosfaattoestand: landbouwgrond waarvan blijkens de aan Onze Minister verstrekte gegevens
      de waarde voor de fosfaattoestand van de bodem hoger is dan of gelijk is aan het Pw-getal 36 of een daarmee
      overeenkomende bij ministeriële regeling vastgestelde aanduiding, en lager is dan of gelijk is aan het Pw-getal
      55 of een daarmee overeenkomende bij ministeriële regeling vastgestelde aanduiding, indien het bouwland betreft,
      dan wel hoger is dan of gelijk is aan het PAL-getal 27 of een daarmee overeenkomende bij ministeriële regeling
      vastgestelde aanduiding, en lager is dan of gelijk is aan het PAL-getal 50 of een daarmee overeenkomende bij
      ministeriële regeling vastgestelde aanduiding, indien het grasland betreft;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.w
    text: |-
      grond met hoge fosfaattoestand: landbouwgrond niet zijnde grond met lage fosfaattoestand of grond met neutrale
      fosfaattoestand;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.x
    text: |-
      mestoverschot: de in een bepaald kalenderjaar geproduceerde, aangevoerde of uit opslag komende hoeveelheid
      dierlijke meststoffen, die van een bedrijf moet worden afgevoerd om te voldoen aan de voorwaarden, bedoeld in
      [artikel 8][ref1], en om te voldoen aan [artikel 14][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel14
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '8'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '14'
        hoofdstuk: IV
  - number: 1.1.y
    text: |-
      varkensrecht: gemiddeld aantal varkens, uitgedrukt in varkenseenheden, dat op grond van [hoofdstuk V][ref1] in een
      kalenderjaar ten hoogste mag worden gehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        hoofdstuk: V
  - number: 1.1.z
    text: |-
      pluimveerecht: gemiddeld aantal kippen en kalkoenen, uitgedrukt in pluimvee-eenheden, dat op grond van
      [hoofdstuk V][ref1] in een kalenderjaar ten hoogste mag worden gehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        hoofdstuk: V
  - number: 1.1.aa
    text: 'productierecht: varkensrecht of pluimveerecht;'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: 1.1.bb
    text: |-
      concentratiegebied: concentratiegebied Zuid of concentratiegebied Oost als aangegeven in [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder bedrijf mede verstaan: een op het Nederlands grondgebied
      gelegen deel van een in het buitenland gevestigd bedrijf.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: '1.3'
    text: |-
      In het eerste lid, onderdelen n en o, wordt onder perceel verstaan: aaneengesloten, door wegen, waterwegen, sloten,
      houtopstanden, muren, wallen of anderszins topografisch begrensde oppervlakte grond.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: '1.4'
    text: |-
      Voor de toepassing van deze wet wordt veengrond, zand- of lössgrond, en kleigrond aangeduid op bij algemene
      maatregel van bestuur vastgestelde kaarten.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel1
  - number: '2.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld waaraan landbouwgrond moet
      voldoen om te worden aangemerkt als tot het bedrijf behorende oppervlakte landbouwgrond.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de gevallen waarin en de voorwaarden waaronder,
      in afwijking van [artikel 1, eerste lid, onderdeel m][ref1], ook in de grensgebieden gelegen landbouwgrond buiten
      Nederland tot de tot het bedrijf behorende oppervlakte landbouwgrond wordt gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
        hoofdstuk: I
  - number: '3.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt geen rekening gehouden met handelingen waarvan,
      op grond van de omstandigheid dat zij geen wezenlijke verandering van feitelijke verhoudingen hebben ten doel gehad
      of op grond van andere bepaalde feiten en omstandigheden, moet worden aangenomen dat zij achterwege zouden zijn
      gebleven, indien daarmee niet de toepassing van deze wet voor het vervolg geheel of ten dele onmogelijk zou worden
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel3
  - number: '3.2'
    text: |-
      [Hoofdstuk III][ref1] van deze wet is niet van toepassing op natuurterreinen die de hoofdfunctie natuur hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004054
        hoofdstuk: III
  - number: '4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in het belang van de bevordering van de deugdelijkheid voor
      het doel waarvoor meststoffen zijn bestemd, alsmede in het belang van de bescherming van de bodem, het verhandelen
      van meststoffen worden verboden indien deze meststoffen niet voldoen aan de bij of krachtens die maatregel gestelde
      eisen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel4
  - number: 4.a
    text: |-
      de hoedanigheid, de aard, de gehalten aan bepaalde stoffen en verdere samenstelling, het gewicht en de verpakking
      van meststoffen;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel4
  - number: 4.b
    text: de benaming, de gebruiksaanwijzing en andere vermeldingen voor meststoffen;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel4
  - number: 4.c
    text: de wijze waarop de vermeldingen van meststoffen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel4
  - number: '5'
    text: |-
      Het is verboden een product, dat blijkens zijn aanduiding of anderszins kennelijk bestemd is om als meststof te
      worden gebruikt, te verhandelen, indien dat product niet voldoet aan de krachtens [artikel 4][ref1] met betrekking
      tot meststoffen gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel4
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '4'
        hoofdstuk: II
  - number: '6.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur bedoeld in [artikel 4][ref1] kan het verhandelen als meststof van
      producten die geheel of gedeeltelijk uit zuiveringsslib, havenslib, compost of andere soortgelijke voor bemesting
      bruikbare producten bestaan, zonder vergunning verleend door Onze Minister of door een bij de maatregel aangewezen
      overheidsorgaan, worden verboden. Daarbij kunnen tevens regels worden gesteld met betrekking tot het verlenen,
      weigeren of intrekken van een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel4
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '4'
        hoofdstuk: II
  - number: '6.2'
    text: |-
      Aan een vergunning, als bedoeld in het vorige lid, kunnen voorschriften worden verbonden. Zij kan onder beperkingen
      worden verleend. Tot de voorschriften kunnen onder meer behoren:
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel6
  - number: 6.2.a
    text: |-
      de verplichting om van monsters, welke op een daarbij aangegeven wijze zijn genomen, analyses te verrichten ten
      aanzien van de hoedanigheid, de aard, de gehalten aan bepaalde stoffen en verdere samenstelling van de meststof;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel6
  - number: 6.2.b
    text: |-
      de verplichting de uitkomsten van de onder a bedoelde analyses ter beschikking te stellen aan afnemers van de
      betrokken meststof of aan te wijzen overheidsorganen;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel6
  - number: 6.2.c
    text: |-
      een verbod de meststof af te leveren aan bepaalde, bij het voorschrift aangewezen gebruikers of groepen van
      gebruikers, in grotere dan bij het voorschrift vastgestelde hoeveelheden;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel6
  - number: 6.2.d
    text: |-
      de verplichting om de naleving van de onder c bedoelde voorschriften te staven met bij het voorschrift vastgestelde
      bewijsstukken;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel6
  - number: 6.2.e
    text: |-
      voorschriften inzake het voeren van een administratie, welke worden gesteld om de naleving van de onder c bedoelde
      voorschriften genoegzaam te kunnen controleren.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel6
  - number: '6.3'
    text: |-
      De aan een vergunning, als bedoeld in het eerste lid, verbonden voorschriften en de beperkingen waaronder zij is
      verleend, kunnen worden gewijzigd, aangevuld of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel6
  - number: '7'
    text: Het is verboden in enig kalenderjaar op een bedrijf meststoffen op of in de bodem te brengen.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel7
  - number: '8'
    text: |-
      Het in [artikel 7][ref1] gestelde verbod geldt niet indien de op of in de landbouwgrond gebrachte hoeveelheid
      meststoffen in het desbetreffende jaar geen van de volgende normen overschrijdt:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel7
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '7'
        hoofdstuk: III
  - number: 8.a
    text: de gebruiksnorm voor dierlijke meststoffen;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel8
  - number: 8.b
    text: de stikstofgebruiksnorm voor meststoffen;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel8
  - number: 8.c
    text: de fosfaatgebruiksnorm voor meststoffen.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel8
  - number: '9.1'
    text: |-
      De gebruiksnorm voor dierlijke meststoffen, bedoeld in [artikel 8, onderdeel a][ref1], is 170 kilogram stikstof per
      hectare van de tot het bedrijf behorende oppervlakte landbouwgrond.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '8'
        hoofdstuk: III
  - number: '9.2'
    text: |-
      Bij ministeriële regeling kan een hogere gebruiksnorm voor dierlijke meststoffen worden vastgesteld, die van
      toepassing is in de gevallen en onder de voorwaarden en beperkingen, bepaald bij de regeling.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel9
  - number: '9.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan voor de bij of krachtens die maatregel aangegeven gevallen
      en onder de bij of krachtens die maatregel vastgestelde voorwaarden en beperkingen een lagere gebruiksnorm voor
      dierlijke meststoffen worden vastgesteld of kan de gebruiksnorm voor dierlijke meststoffen op nul worden gesteld
      voor zover dit naar het oordeel van Onze Minister noodzakelijk is om waterverontreiniging door stikstof uit
      meststoffen te verminderen en verdere verontreiniging te voorkomen. Dit is in het bijzonder het geval als bij het
      achterwege blijven van deze maatregel de hoeveelheid van 11,3 milligram stikstof per liter in zoet oppervlaktewater
      of van 50 milligram nitraat per liter in grondwater dreigt te worden overschreden of een betekenisvolle bijdrage
      aan de eutrofiëring van natuurlijke zoetwatermeren, andere zoetwatermassa’s, estuaria, kustwateren of zeewater mag
      worden verwacht.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel9
  - number: '10.1'
    text: |-
      De stikstofgebruiksnorm voor meststoffen, bedoeld in [artikel 8, onderdeel b][ref1], is een bij ministeriële
      regeling vastgestelde hoeveelheid stikstof per hectare van de tot het bedrijf behorende oppervlakte landbouwgrond.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '8'
        hoofdstuk: III
  - number: '10.2'
    text: |-
      De hoeveelheid stikstof per hectare van de tot het bedrijf behorende oppervlakte landbouwgrond kan verschillend
      worden vastgesteld al naar gelang het gewas, de gewasopbrengst, de toegepaste landbouwpraktijk, de ecologische
      kenmerken van een waterlichaam en de kenmerken van de bodem, en al naar gelang sprake is van kleigrond, veengrond,
      of zand- of lössgrond.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel10
  - number: '10.3'
    text: |-
      De hoeveelheid stikstof per hectare van de tot het bedrijf behorende oppervlakte landbouwgrond wordt gebaseerd op
      een balans tussen enerzijds de te verwachten stikstofbehoeften van de gewassen en anderzijds de stikstoftoevoer
      naar de gewassen uit de bodem en uit meststoffen. De stikstoftoevoer naar de gewassen uit de bodem komt overeen
      met de hoeveelheid stikstof die in de bodem aanwezig is op het moment dat het gewas begint de stikstof in
      betekenisvolle mate te gebruiken en de toevoer van stikstof door nettomineralisatie van de voorraden organische
      stikstof in de bodem.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel10
  - number: '10.4'
    text: |-
      De overeenkomstig het derde lid bepaalde hoeveelheid stikstof wordt verlaagd voor zover dit naar het oordeel van
      Onze Minister noodzakelijk is om waterverontreiniging door stikstof uit meststoffen te verminderen en verdere
      verontreiniging te voorkomen. Dit is in het bijzonder het geval als bij het achterwege blijven van deze verlaging
      de hoeveelheid van 11,3 milligram stikstof per liter in zoet oppervlaktewater of van 50 milligram nitraat per liter
      in grondwater dreigt te worden overschreden of een betekenisvolle bijdrage aan de eutrofiëring van natuurlijke
      zoetwatermeren, andere zoetwatermassa’s, estuaria, kustwateren of zeewater mag worden verwacht.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel10
  - number: '11.1'
    text: |-
      De fosfaatgebruiksnorm voor meststoffen, bedoeld in [artikel 8, onderdeel c][ref1], is in de jaren 2010 tot en
      met 2013 per hectare grasland van de tot het bedrijf behorende oppervlakte landbouwgrond voor zover het grond met
      neutrale fosfaattoestand betreft, 95 kilogram fosfaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '8'
        hoofdstuk: III
  - number: '11.2'
    text: |-
      De fosfaatgebruiksnorm voor meststoffen, bedoeld in [artikel 8, onderdeel c][ref1], is per hectare bouwland van de
      tot het bedrijf behorende oppervlakte landbouwgrond voor zover het grond met neutrale fosfaattoestand betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '8'
        hoofdstuk: III
  - number: 11.2.a
    text: 80 kilogram fosfaat in 2010;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel11
  - number: 11.2.b
    text: 75 kilogram fosfaat in 2011;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel11
  - number: 11.2.c
    text: 70 kilogram fosfaat in 2012;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel11
  - number: 11.2.d
    text: 65 kilogram fosfaat in 2013.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel11
  - number: '11.3'
    text: |-
      De fosfaatgebruiksnormen voor meststoffen voor de jaren 2014 en volgende voor grond met neutrale fosfaattoestand
      worden vastgesteld bij algemene maatregel van bestuur. De normen kunnen verschillend worden vastgesteld al naar
      gelang het gewas, de gewasopbrengst, de toegepaste landbouwpraktijk, de kenmerken van de bodem en de grondsoort,
      de grondwaterstand en de mate waarin de ecologische toestand van een gebied afhankelijk is van de hoeveelheid
      fosfaat in het oppervlaktewater en kunnen telkens ten opzichte van de voor het voorgaande jaar geldende norm
      met ten hoogste 5 kilogram fosfaat per hectare per jaar worden verlaagd, met het oog op het in 2015 bereiken
      van een situatie waarbij de toevoer van fosfaat uit meststoffen en uit de bodem gemiddeld in evenwicht is met de
      fosfaatbehoefte van de gewassen. Zolang de algemene maatregel van bestuur niet in werking is getreden, blijft voor
      de jaren 2014 en volgende de in het eerste en tweede lid genoemde fosfaatgebruiksnorm voor 2013 van toepassing.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel11
  - number: '11.4'
    text: |-
      De fosfaatgebruiksnorm voor meststoffen voor grond met hoge fosfaattoestand wordt bij algemene maatregel van
      bestuur vastgesteld. De norm kan ten opzichte van de bij of krachtens het eerste tot en met derde lid voor grond
      met neutrale fosfaattoestand geldende norm ten hoogste 10 kilogram fosfaat per hectare lager worden vastgesteld. De
      norm kan verschillend worden vastgesteld al naar gelang het gewas, de toegepaste landbouwpraktijk, de kenmerken van
      de bodem en de grondsoort, de grondwaterstand en de mate waarin de ecologische toestand van een gebied afhankelijk
      is van de hoeveelheid fosfaat in het oppervlaktewater. Zolang de algemene maatregel van bestuur niet in werking is
      getreden, is de bij of krachtens het eerste tot en met derde lid voor grond met neutrale fosfaattoestand geldende
      norm van toepassing.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel11
  - number: '11.5'
    text: |-
      Bij ministeriële regeling wordt voor grond met lage fosfaattoestand een hogere fosfaatgebruiksnorm voor meststoffen
      vastgesteld dan de bij of krachtens het eerste, tweede of derde lid voor grond met neutrale fosfaattoestand
      vastgestelde fosfaatgebruiksnorm. De norm is van toepassing onder bij de regeling bepaalde voorwaarden en
      beperkingen. Zolang de ministeriële regeling niet in werking is getreden, is de bij of krachtens het eerste tot en
      met derde lid voor grond met neutrale fosfaattoestand geldende norm van toepassing.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel11
  - number: '11.6'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een bedrijf in enig jaar, in afwijking van het tweede en derde
      lid, een hogere fosfaatgebruiksnorm voor meststoffen op bouwland kan toepassen, ingeval de hoeveelheid fosfaat
      waarmee de ingevolge het tweede of derde lid geldende fosfaatgebruiksnorm is overschreden in het navolgende jaar
      volledig wordt gecompenseerd. Compensatie geschiedt door vermindering van de hoeveelheid fosfaat die ingevolge
      de in het navolgende jaar geldende fosfaatgebruiksnorm voor meststoffen op of in de bodem kan worden gebracht
      met de hoeveelheid waarmee in het voorgaande jaar de fosfaatgebruiksnorm voor meststoffen is overschreden. De
      afwijkende gebruiksnorm, bedoeld in de eerste volzin, bedraagt ten hoogste de bij de ministeriële regeling bepaalde
      hoeveelheid fosfaat, die niet meer dan 20 kilogram fosfaat per hectare per jaar hoger is dan de fosfaatgebruiksnorm
      die geldt ingevolge het tweede of derde lid.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel11
  - number: '12.1'
    text: |-
      Voor de toepassing van [artikel 8, aanhef en onderdeel a][ref1], wordt de op of in de bodem gebrachte hoeveelheid
      meststoffen bepaald door bij elkaar op te tellen de in het desbetreffende jaar op het bedrijf geproduceerde,
      aangevoerde en per saldo uit opslag gekomen hoeveelheden dierlijke meststoffen, en de uitkomst te verminderen met
      de in dat jaar van het bedrijf afgevoerde hoeveelheid dierlijke meststoffen. De hoeveelheden worden uitgedrukt in
      kilogrammen stikstof.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '8'
        hoofdstuk: III
  - number: '12.2'
    text: |-
      Voor de toepassing van [artikel 8, aanhef en onderdeel b][ref1], wordt de op of in de bodem gebrachte hoeveelheid
      meststoffen bepaald overeenkomstig het eerste lid, met dien verstande dat niet alleen dierlijke meststoffen maar
      ook andere meststoffen in aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '8'
        hoofdstuk: III
  - number: '12.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat bij de bepaling van de in het tweede lid bedoelde hoeveelheid
      meststoffen de hoeveelheid stikstof in dierlijke meststoffen of in andere, bij de regeling omschreven organische
      meststoffen slechts voor een bij de regeling bepaald percentage in aanmerking wordt genomen. Het percentage kan
      al naar gelang de aard van de meststoffen, de periode waarin zij op of in de bodem worden gebracht en de daarbij
      toegepaste landbouwpraktijk en al naar gelang er sprake is van kleigrond, veengrond, of zand- of lössgrond, dan wel
      van bouwland of grasland verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel12
  - number: '12.4'
    text: |-
      Voor de toepassing van [artikel 8, onderdeel c][ref1], wordt de op of in de bodem gebrachte hoeveelheid meststoffen
      bepaald overeenkomstig het tweede lid in samenhang met het eerste lid, met dien verstande dat de hoeveelheden
      meststoffen steeds worden uitgedrukt in kilogrammen fosfaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '8'
        hoofdstuk: III
  - number: '12.5'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat bij de bepaling van de in het vierde lid bedoelde hoeveelheid
      meststoffen de hoeveelheid fosfaat in bij de regeling omschreven organische meststoffen slechts voor een bij
      de regeling bepaald deel in aanmerking wordt genomen. Dit deel kan al naar gelang de aard van de meststoffen
      verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel12
  - number: '13.1'
    text: |-
      Tot de voorwaarden, bedoeld in de [artikelen 9, tweede lid][ref1], en [11, vijfde lid][ref2], kan behoren een
      vergunning verleend door Onze Minister of de registratie van een kennisgeving door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel11
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '9'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '11'
        hoofdstuk: III
  - number: '13.2'
    text: |-
      Ingeval de Commissie van de Europese Gemeenschappen Nederland derogatie heeft verleend om een grotere hoeveelheid
      dierlijke meststoffen toe te staan dan de in [artikel 9, eerste lid][ref1], genoemde gebruiksnorm en aan die
      derogatie de voorwaarde heeft verbonden een monitoringsnetwerk tot stand te brengen en in stand te houden, kan
      bij de regeling, bedoeld in [artikel 9, tweede lid][ref2], ter bestrijding van de jaarlijkse kosten die daarmee
      samenhangen, aan degenen die op hun bedrijf een grotere hoeveelheid dierlijke meststoffen toepassen dan de
      in [artikel 9, eerste lid][ref3], genoemde gebruiksnorm, de verplichting worden opgelegd tot het betalen van
      een geldsom ten behoeve van ’s Rijks kas. De hoogte van de geldsom kan bij deze regeling verschillend worden
      vastgesteld al naar gelang de tot het bedrijf behorende oppervlakte landbouwgrond. Bij de regeling kan worden
      bepaald dat een kennisgeving eerst wordt geregistreerd nadat deze geldsom is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel9
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '9'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '9'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '9'
        hoofdstuk: III
  - number: '13.3'
    text: |-
      Bij de regeling, bedoeld in [artikel 9][ref1], kan de toepasselijkheid van een hogere hoeveelheid stikstof in
      verband met een meer dan gemiddelde stikstofopname door gewassen binnen een bepaalde soort worden verbonden aan
      de voorwaarde van een vergunning verleend door Onze Minister of de registratie van een kennisgeving door Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel9
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '9'
        hoofdstuk: III
  - number: '13.4'
    text: |-
      Aan een vergunning kunnen voorschriften worden verbonden en zij kan onder beperkingen worden verleend. De
      voorschriften en beperkingen kunnen worden gewijzigd, aangevuld of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel13
  - number: '13.5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het verlenen, weigeren of intrekken van
      een vergunning.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel13
  - number: '14.1'
    text: |-
      Degene die dierlijke meststoffen produceert of verhandelt kan steeds verantwoorden dat de op het eigen bedrijf
      geproduceerde of aangevoerde dierlijke meststoffen of de op de eigen onderneming aangevoerde dierlijke meststoffen
      zijn afgevoerd.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel14
  - number: '14.2'
    text: |-
      De verantwoording heeft betrekking op de hoeveelheid fosfaat in de meststoffen en betreft mede de afnemers waarnaar
      de meststoffen zijn afgevoerd.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel14
  - number: '14.3'
    text: |-
      De verantwoording door degene die dierlijke meststoffen produceert heeft mede betrekking op de hoeveelheid stikstof
      in de meststoffen.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel14
  - number: '14.4'
    text: |-
      Voor de toepassing van het eerste lid wordt op de geproduceerde of aangevoerde hoeveelheid dierlijke meststoffen
      in mindering gebracht de hoeveelheid dierlijke meststoffen waarvan aannemelijk wordt gemaakt dat deze op het eigen
      bedrijf of in het kader van de eigen onderneming is gebruikt of opgeslagen.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel14
  - number: '15.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, in het belang van een doelmatige afvoer van
      mestoverschotten of de bescherming en verbetering van het milieu, regels worden gesteld met betrekking tot het in
      voorraad hebben, verwerken, vernietigen, vervoeren en verhandelen van dierlijke meststoffen.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel15
  - number: '15.2'
    text: |-
      De in het eerste lid bedoelde regels kunnen onder meer inhouden een verbod de in het eerste lid bedoelde
      meststoffen:
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel15
  - number: 15.2.a
    text: te verhandelen zonder kennisgeving daarvan op een daarbij aangegeven wijze aan een daarbij aangewezen orgaan;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel15
  - number: 15.2.b
    text: in voorraad te houden, te verwerken of te vernietigen op een andere wijze dan daarbij is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel15
  - number: 15.2.c
    text: |-
      te verhandelen zonder vergunning verleend door of vanwege Onze Minister, door of vanwege een bevoegde autoriteit
      als bedoeld in een bindend besluit van de Raad van de Europese Unie, van het Europees Parlement en de Raad
      gezamenlijk of van de Commissie van de Europese Gemeenschappen, of door of vanwege een bij de maatregel aangewezen
      orgaan, waarbij tevens regels kunnen worden gesteld met betrekking tot de verlening, weigering of intrekking van
      een vergunning;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel15
  - number: 15.2.d
    text: |-
      te verhandelen zonder dat een financiële zekerheid is gesteld bij Onze Minister of bij de bevoegde autoriteit of
      het orgaan, bedoeld in onderdeel c, waarbij tevens regels kunnen worden gesteld over de omvang van de zekerheid en
      de wijze waarop de zekerheid wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel15
  - number: '15.3'
    text: |-
      Aan een vergunning, als bedoeld in het tweede lid, onderdeel c, kunnen voorschriften worden verbonden. Zij kan
      onder beperkingen worden verleend. Tot de voorschriften kunnen onder meer behoren:
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel15
  - number: 15.3.a
    text: |-
      een verbod de desbetreffende meststoffen af te leveren aan bij het voorschrift aangewezen gebruikers of groepen van
      gebruikers, in grotere dan bij het voorschrift vastgestelde hoeveelheden;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel15
  - number: 15.3.b
    text: |-
      de verplichting de naleving van de onder a bedoelde voorschriften te staven met bij het voorschrift vastgestelde
      bewijsstukken;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel15
  - number: 15.3.c
    text: |-
      voorschriften inzake het voeren van een administratie welke worden gesteld om de naleving van de onder a bedoelde
      voorschriften te kunnen controleren.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel15
  - number: '15.4'
    text: |-
      De aan een vergunning, als bedoeld in het tweede lid, onderdeel c, verbonden voorschriften en de beperkingen
      waaronder zij is verleend, kunnen worden gewijzigd, aangevuld of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel15
  - number: '16.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de minimumomvang van de opslagruimte voor
      dierlijke meststoffen op een bedrijf.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel16
  - number: '16.2'
    text: |-
      Onverminderd het bepaalde bij of krachtens de [Wet milieubeheer][ref1] of de
      [Wet algemene bepalingen omgevingsrecht][ref2] kunnen bij de maatregel voorwaarden worden gesteld waaraan een
      opslagruimte moet voldoen om bij de bepaling van de omvang van de op het bedrijf beschikbare opslagruimte voor
      dierlijke meststoffen in aanmerking te worden genomen, waartoe kunnen behoren regels omtrent de maximale afstand
      van de opslagruimte tot de huisvesting waarin dieren worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0024779
  - number: '17'
    text: |-
      De toepassing van de in de [artikel 15][ref1] bedoelde regels kan worden beperkt tot bepaalde, bij of krachtens de
      in [artikel 15][ref2] bedoelde maatregel aangewezen gebieden, waarbij deze regelen per gebied en per categorie van
      bedrijven alsmede dierlijke meststoffensoort verschillend kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel15
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '15'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '15'
        hoofdstuk: IV
  - number: '18'
    text: 'Voor de toepassing van dit hoofdstuk:'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel18
  - number: 18.a
    text: |-
      worden de aantallen varkens, onderscheiden naar diercategorie, uitgedrukt in varkenseenheden overeenkomstig de in
      [bijlage II][ref1] daarvoor opgenomen normen;


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 18.b
    text: |-
      worden de aantallen kippen en kalkoenen, onderscheiden naar diercategorie, uitgedrukt in pluimvee-eenheden
      overeenkomstig de in [bijlage II][ref1] daarvoor opgenomen normen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '19'
    text: |-
      Het is verboden op een bedrijf gemiddeld in een kalenderjaar een groter aantal varkens te houden dan het op het
      bedrijf rustende varkensrecht.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel19
  - number: '20.1'
    text: |-
      Het is verboden op een bedrijf gemiddeld in een kalenderjaar een groter aantal kippen en kalkoenen te houden dan
      het op het bedrijf rustende pluimveerecht.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel20
  - number: '20.2'
    text: |-
      Het eerste lid is niet van toepassing indien op het bedrijf op geen enkel moment een groter aantal kippen en
      kalkoenen wordt gehouden dan overeenkomt met 250 pluimvee-eenheden.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel20
  - number: '21.1'
    text: |-
      Het is verboden anders dan op een bedrijf op enig moment een groter aantal varkens te houden dan overeenkomt met
      3 varkenseenheden.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel21
  - number: '21.2'
    text: |-
      Het is verboden anders dan op een bedrijf op enig moment een groter aantal kippen en kalkoenen te houden dan
      overeenkomt met 250 pluimvee-eenheden.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel21
  - number: '22.1'
    text: |-
      Onze Minister kan ten aanzien van een bedrijf waarvan het productierecht is overschreden bepalen, dat het op enig
      moment gehouden aantal varkens en het op enig moment gehouden aantal kippen en kalkoenen de door hem vastgestelde
      aantallen niet mogen overschrijden.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel22
  - number: '22.2'
    text: |-
      De in het eerste lid bedoelde aantallen komen overeen met het aantal varkens, onderscheidenlijk het aantal kippen
      en kalkoenen dat overeenkomstig het varkensrecht en het pluimveerecht gemiddeld gedurende het jaar mag worden
      gehouden, vermeerderd met 15%.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel22
  - number: '22.3'
    text: |-
      Onverminderd de [artikelen 19][ref1] en [20][ref2] is het verboden op enig moment een groter aantal varkens of een
      groter aantal kippen en kalkoenen te houden dan het door Onze Minister vastgestelde aantal.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel20
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '19'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '20'
        hoofdstuk: V
  - number: '22.4'
    text: |-
      De in het eerste lid bedoelde bevoegdheid kan ten aanzien van een bedrijf voor een aaneengesloten periode van ten
      hoogste drie jaar worden uitgeoefend. De periode kan telkens worden verlengd tot drie jaar te rekenen vanaf het
      tijdstip waarop een overtreding van het verbod, bedoeld in het derde lid, wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel22
  - number: '23.1'
    text: |-
      Het op het bedrijf rustende varkensrecht op het tijdstip van inwerkingtreding van het verbod, bedoeld in
      [artikel 19][ref1], komt overeen met het varkensrecht zoals dat onmiddellijk voorafgaand aan dat tijdstip voor het
      bedrijf gold op grond van de [Wet herstructurering varkenshouderij][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0009542
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '19'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0009542
  - number: '23.2'
    text: |-
      Het op het bedrijf rustende pluimveerecht op het tijdstip van inwerkingtreding van het verbod, bedoeld in
      [artikel 20][ref1], eerste lid, komt overeen met het pluimveerecht, uitgedrukt in kilogrammen fosfaat, zoals dat
      onmiddellijk voorafgaand aan dat tijdstip voor het bedrijf gold op grond van deze wet, met dien verstande dat
      de kilogrammen fosfaat worden omgerekend naar pluimvee-eenheden. Voor deze omrekening komt 0,5 kilogram fosfaat
      overeen met 1 pluimvee-eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel20
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '20'
        hoofdstuk: V
  - number: '24.1'
    text: |-
      Het overeenkomstig [artikel 23][ref1] bepaalde productierecht wordt gecorrigeerd, indien voorafgaand aan het in
      dat artikel bedoelde tijdstip, in hetzelfde kalenderjaar met betrekking tot het bedrijf een registratie heeft
      plaatsgevonden van een kennisgeving van overgang van het varkensrecht of pluimveerecht, of een gedeelte daarvan,
      maar de omvang van de verkleining, dan wel vergroting van het desbetreffende productierecht werd beperkt ingevolge
      [artikel 18, zesde lid, van de Wet herstructurering varkenshouderij][ref2], onderscheidenlijk artikel 58q, vierde
      lid, van de Meststoffenwet, zoals deze artikelen luidden op het tijdstip van de registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel18
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '23'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '18'
  - number: '24.2'
    text: |-
      De correctie geschiedt van rechtswege bij aanvang van het kalenderjaar volgend op het kalenderjaar waarin de
      registratie van de kennisgeving van overgang plaatsvond en leidt tot een verkleining, onderscheidenlijk vergroting
      van het desbetreffende productierecht met het aantal varkenseenheden of pluimvee-eenheden waarop de beperking
      betrekking had.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel24
  - number: '24.3'
    text: |-
      Voor de toepassing van het tweede lid ten aanzien van het pluimveerecht komt 0,5 kilogram fosfaat overeen met 1
      pluimvee-eenheid.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel24
  - number: '25'
    text: |-
      Een productierecht kan, onder welke titel dan ook, overgaan naar een ander bedrijf, overeenkomstig het bepaalde in
      deze paragraaf en [artikel 32][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel32
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '32'
        hoofdstuk: V
  - number: '26.1'
    text: |-
      Een productierecht, of een gedeelte daarvan, afkomstig van een bedrijf dat geheel of gedeeltelijk is gelegen in
      het ene concentratiegebied kan niet overgaan naar een bedrijf dat geheel of gedeeltelijk is gelegen in het andere
      concentratiegebied.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel26
  - number: '26.2'
    text: |-
      Een productierecht, of een gedeelte daarvan, afkomstig van een bedrijf dat geheel of gedeeltelijk is gelegen
      buiten de concentratiegebieden kan niet overgaan naar een bedrijf dat geheel of gedeeltelijk is gelegen in een
      concentratiegebied.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel26
  - number: '26.3'
    text: |-
      Een bedrijf is gedeeltelijk gelegen in een concentratiegebied, als een of meer voor de varkens-, kippen- of
      kalkoenenhouderij bestemde stallen in dat gebied zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel26
  - number: '26.4'
    text: |-
      In zoverre in afwijking van het eerste lid kan een productierecht, of een gedeelte daarvan, afkomstig van
      een bedrijf dat geheel is gelegen in een van de concentratiegebieden overgaan naar een bedrijf dat in beide
      concentratiegebieden is gelegen, onder de voorwaarde dat het productierecht, of gedeelte daarvan, na overgang
      uitsluitend wordt gebruikt ten behoeve van de varkens-, kippen- of kalkoenenhouderij op een locatie die in
      hetzelfde concentratiegebied is gelegen als het bedrijf waarvan het afkomstig is.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel26
  - number: '26.5'
    text: |-
      Het eerste en het tweede lid gelden niet ingeval van overgang van het productierecht bij een samenvoeging van
      bedrijven.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel26
  - number: '26.6'
    text: 'Het is verboden om binnen een bedrijf de varkens-, kippen- of kalkoenenhouderij te verplaatsen:'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel26
  - number: 26.6.a
    text: van een locatie gelegen buiten de concentratiegebieden naar een locatie gelegen in een concentratiegebied, of
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel26
  - number: 26.6.b
    text: van een locatie gelegen in het ene concentratiegebied naar een locatie gelegen in het andere concentratiegebied.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel26
  - number: '26.7'
    text: |-
      Het eerste, tweede en zesde lid zijn niet van toepassing voor zover een bedrijf dat geheel of gedeeltelijk
      is gelegen in een concentratiegebied de geproduceerde hoeveelheid dierlijke meststoffen in verband met het
      productierecht of gedeelte daarvan dat overgaat, dan wel de varkens-, kippen- of kalkoenhouderij die wordt
      verplaatst, zelf verwerkt door middel van mestverwerking of mestvergisting en deze hoeveelheid buiten de markt voor
      dierlijke mest wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel26
  - number: '26.8'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld ter uitvoering van het zevende lid.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel26
  - number: '27.1'
    text: |-
      De belanghebbende naar wiens bedrijf het productierecht, of gedeelte daarvan, moet overgaan en de belanghebbende
      van wiens bedrijf het productierecht, of gedeelte daarvan, afkomstig is, geven van de overgang kennis aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel27
  - number: '27.2'
    text: |-
      Er kan pas aanspraak worden gemaakt op het van het andere bedrijf afkomstige productierecht, of gedeelte daarvan,
      met ingang van het tijdstip van registratie van de kennisgeving door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel27
  - number: '27.3'
    text: Bij ministeriële regeling worden regels gesteld over de wijze waarop de kennisgeving wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel27
  - number: '28.1'
    text: |-
      Op het tijdstip van registratie van de kennisgeving, bedoeld in [artikel 27, tweede lid][ref1], vindt een
      verkleining plaats van het varkensrecht, onderscheidenlijk pluimveerecht van het bedrijf waarvan het desbetreffende
      productierecht, of gedeelte daarvan, afkomstig is, en vindt een vergroting plaats van het varkensrecht,
      onderscheidenlijk het pluimveerecht van het bedrijf waarnaar het desbetreffende productierecht, of gedeelte
      daarvan, overgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel27
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '27'
        hoofdstuk: V
  - number: '28.2'
    text: |-
      De verkleining en de vergroting komen overeen met het aantal varkenseenheden, onderscheidenlijk pluimvee-eenheden
      waarop de kennisgeving betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel28
  - number: '28.3'
    text: |-
      Voor het jaar waarin de kennisgeving wordt geregistreerd zijn de verkleining en de vergroting beperkt tot het deel
      van het desbetreffende productierecht waarvan de betrokken partijen bij de kennisgeving hebben aangegeven dat dit
      in dat jaar op het bedrijf waarvan het afkomstig is niet wordt benut voor het houden van dieren.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel28
  - number: '29.1'
    text: |-
      De registratie, bedoeld in [artikel 27, tweede lid][ref1], vindt niet plaats indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel27
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '27'
        hoofdstuk: V
  - number: 29.1.a
    text: |-
      de kennisgeving niet overeenkomstig de regels, bedoeld in [artikel 27, derde lid][ref1], is gedaan,


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel27
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '27'
        hoofdstuk: V
  - number: 29.1.b
    text: |-
      de kennisgeving betrekking heeft op een groter aantal varkenseenheden of pluimvee-eenheden dan overeenkomt met het
      desbetreffende productierecht van het bedrijf waarvan het afkomstig is,
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel29
  - number: 29.1.c
    text: |-
      de kennisgeving betrekking heeft op het productierecht afkomstig van een bedrijf ten aanzien waarvan Onze Minister
      gebruik maakt van de in [artikel 22][ref1] bedoelde bevoegdheid, of


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel22
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '22'
        hoofdstuk: V
  - number: 29.1.d
    text: |-
      de overgang van het productierecht in strijd is met [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel26
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '26'
        hoofdstuk: V
  - number: '29.2'
    text: |-
      Indien pas na registratie blijkt dat niet aan de in het eerste lid genoemde voorwaarden is voldaan, wordt de
      registratie door Onze Minister ongedaan gemaakt. Met terugwerkende kracht tot het tijdstip van de registratie
      vervallen de rechtsgevolgen van die registratie.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel29
  - number: '30.1'
    text: |-
      In afwijking van [artikel 228 van Boek 3 van het Burgerlijk Wetboek][ref1] kan op het productierecht geen pandrecht
      worden gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel228
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '228'
  - number: '30.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat alvorens Onze Minister de in [artikel 27, eerste lid][ref1],
      bedoelde kennisgeving in behandeling neemt, van deze kennisgeving mededeling wordt gedaan aan in die regeling
      genoemde derdebelanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel27
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '27'
        hoofdstuk: V
  - number: '30.3'
    text: 'Bij de ministeriële regeling worden nadere regels gesteld voor de uitvoering van het tweede lid, onder meer over:'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel30
  - number: 30.3.a
    text: de wijze waarop en de termijn waarbinnen de derdebelanghebbenden zich bij Onze Minister kunnen aanmelden,
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel30
  - number: 30.3.b
    text: de gegevens die Onze Minister aan de derdebelanghebbenden kenbaar maakt, en
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel30
  - number: 30.3.c
    text: de periode gedurende welke Onze Minister de kennisgeving niet in behandeling neemt.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel30
  - number: '31.1'
    text: |-
      De belanghebbende kan bij Onze Minister een kennisgeving doen van het vervallen of het gedeeltelijk vervallen van
      het productierecht.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel31
  - number: '31.2'
    text: |-
      Na registratie van de kennisgeving door Onze Minister is het desbetreffende productierecht nihil, onderscheidenlijk
      vindt een verkleining van dat recht plaats met het aantal varkenseenheden of pluimvee-eenheden waarop de
      kennisgeving betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel31
  - number: '31.3'
    text: Bij ministeriële regeling worden regels gesteld over de wijze waarop de kennisgeving wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel31
  - number: '32.1'
    text: |-
      Indien op landelijk niveau de omvang van de productie van dierlijke meststoffen, uitgedrukt in kilogrammen
      stikstof of fosfaat, afkomstig van varkens of van pluimvee de omvang van die productie in 2002 overschrijdt,
      en indien dit ook geldt voor de totale omvang van de productie van dierlijke meststoffen, kan, al naar gelang
      de overschrijding betrekking heeft op varkensmest of op pluimveemest, bij algemene maatregel van bestuur, in
      zoverre in afwijking van [artikel 28, tweede lid][ref1], worden bepaald dat, de vergroting van het varkensrecht,
      onderscheidenlijk dat de vergroting van het pluimveerecht wordt beperkt tot een bij de maatregel vastgesteld
      percentage van het aantal varkenseenheden, onderscheidenlijk pluimvee-eenheden waarop de kennisgeving, bedoeld in
      [artikel 27, eerste lid][ref2], betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel27
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '28'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '27'
        hoofdstuk: V
  - number: '32.2'
    text: Het in het eerste lid bedoelde percentage is ten minste 75%.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel32
  - number: '32.3'
    text: Voor verschillende groepen van gevallen kan het percentage verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel32
  - number: '32.4'
    text: |-
      De voordracht van een algemene maatregel van bestuur als bedoeld in het eerste lid wordt niet eerder gedaan dan
      vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel32
  - number: '33.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat ingeval van een bedrijfsoverdracht het op het bedrijf
      rustende productierecht wordt verlaagd met een bij de maatregel vastgesteld percentage.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel33
  - number: '33.2'
    text: Het in het eerste lid bedoelde percentage is ten hoogste 25%.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel33
  - number: '33.3'
    text: Voor verschillende groepen van gevallen kan het percentage verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel33
  - number: '33.4'
    text: |-
      Onder bedrijfsoverdracht wordt mede begrepen de inbreng van een bedrijf in een maatschap en de verkrijging van een
      meerderheid van de aandelen in een vennootschap.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel33
  - number: '33.5'
    text: |-
      Dit artikel is niet van toepassing op een overdracht aan een persoon waarmee bloed- of aanverwantschap in de eerste
      graad bestaat, of op de inbreng in een maatschap met een zodanige persoon, en evenmin op een verkrijging van een
      bedrijf onder algemene titel.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel33
  - number: '34'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het opmaken, bewaren, overleggen en
      afdragen van gegevens door natuurlijke personen, rechtspersonen of samenwerkingsverbanden van natuurlijke personen
      of rechtspersonen die meststoffen produceren, verhandelen of gebruiken. Deze regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel34
  - number: 34.a
    text: |-
      het bedrijf of de onderneming, zoals de aard en de locatie van het bedrijf of de onderneming en van de daartoe
      behorende onderdelen en bedrijfsmiddelen, de tenaamstelling of handelsnaam, de rechtsvorm, in voorkomend geval de
      aard en samenstelling van het samenwerkingsverband van personen of rechtspersonen dat het bedrijf of de onderneming
      voert, de inschrijving in het handelsregister en de bij het bedrijf of de onderneming werkzame personen en hun
      bevoegdheden;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel34
  - number: 34.b
    text: |-
      de geproduceerde, in voorraad gehouden, aangevoerde, afgevoerde, verhandelde, be- of verwerkte, op of in de
      bodem gebrachte en anderszins gebruikte hoeveelheden meststoffen, de samenstelling, herkomst en bestemming van de
      meststoffen en de gegevens, bedoeld in [artikel 35, tweede lid, onderdelen b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel35
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '35'
        hoofdstuk: VI
  - number: 34.c
    text: |-
      de tot het bedrijf behorende oppervlakte landbouwgrond en de overige gebruikte grond, met inbegrip van gegevens
      over naar de aard van de teelt of het gebruik te onderscheiden aaneengesloten oppervlakten en de topografische
      ligging daarvan, en met inbegrip van gegevens met betrekking tot grond die nog in gebruik moet worden genomen en
      met betrekking tot nog aan te vangen teelten en vormen van gebruik.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel34
  - number: '35.1'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de bepaling van:'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel35
  - number: 35.1.a
    text: |-
      de hoeveelheden meststoffen, bedoeld in [artikel 34, onderdeel b][ref1], uitgedrukt in kilogrammen stikstof of
      fosfaat;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel34
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '34'
        hoofdstuk: VI
  - number: 35.1.b
    text: de verdere samenstelling van deze meststoffen;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel35
  - number: 35.1.c
    text: |-
      de tot het bedrijf behorende oppervlakten, bedoeld in [artikel 34, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel34
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '34'
        hoofdstuk: VI
  - number: 35.1.d
    text: |-
      de aantallen gehouden, uitgeschaarde, ingeschaarde, tijdelijk elders ter weiding ondergebrachte of tijdelijk ter
      weiding aangenomen dieren en de aantallen dieren die anderszins op een bedrijf of in het kader van een onderneming
      aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel35
  - number: 35.1.e
    text: |-
      de aard, de fosfaattoestand en de samenstelling van de bodem alsmede de gewasopbrengst, voor zover dat relevant is
      voor de hoeveelheid meststoffen die op of in de bodem mag worden gebracht.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel35
  - number: '35.2'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur kunnen mede regels worden gesteld omtrent gevallen waarin,
      de voorwaarden waaronder en de wijze waarop de hoeveelheid geproduceerde dierlijke meststoffen, uitgedrukt in
      kilogrammen stikstof of fosfaat, wordt bepaald op basis van:
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel35
  - number: 35.2.a
    text: |-
      bij of krachtens de maatregel vastgestelde forfaitaire productienormen, onderscheiden naar diersoort, diercategorie
      en bedrijfssysteem en uitgedrukt in kilogrammen stikstof, onderscheidenlijk fosfaat, per dier per jaar;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel35
  - number: 35.2.b
    text: |-
      gegevens met betrekking tot de samenstelling van het door de dieren gebruikte diervoeder en de forfaitair bepaalde
      vastlegging van stikstof, onderscheidenlijk fosfaat, in de dieren en dierlijke producten, alsmede de forfaitair
      bepaalde gasvormige verliezen van stikstof uit de stal en de mestopslagruimte;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel35
  - number: 35.2.c
    text: indien het melkvee betreft, de melkproductie per dier en de samenstelling van de melk;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel35
  - number: 35.2.d
    text: een combinatie van deze bepalingswijzen.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel35
  - number: '35.3'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur kunnen mede regels worden gesteld omtrent de gevallen waarin en
      de voorwaarden waaronder de hoeveelheid in voorraad gehouden, aangevoerde, afgevoerde of verhandelde meststoffen,
      uitgedrukt in kilogrammen stikstof of fosfaat, wordt bepaald op basis van bij of krachtens de maatregel
      vastgestelde forfaitaire omrekennormen, onderscheiden naar mestvorm, diersoort, diercategorie en bedrijfssysteem en
      uitgedrukt in kilogrammen stikstof, onderscheidenlijk fosfaat, per gewichts- of volume-eenheid.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel35
  - number: '35.4'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur worden de forfaitaire waarden, bedoeld in het tweede lid,
      onderdeel b, vastgesteld. Deze waarden kunnen verschillend worden vastgesteld al naar gelang, voor zover van
      toepassing, de diersoort en diercategorie, de aard en het gewicht van het dierlijke product en de aard en de omvang
      van de stal en de mestopslagruimte.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel35
  - number: '35.5'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur kunnen regels worden gesteld over de wijze van bepaling van de
      hoeveelheid en de samenstelling van het diervoeder en de melk, bedoeld in het tweede lid, onderdelen b en c.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel35
  - number: '36.1'
    text: |-
      De bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 35][ref1], gestelde regels kunnen
      mede betrekking hebben op de bevoegdheid tot het doen van vaststellingen ten behoeve van de bepaling van de in
      dat artikel bedoelde hoeveelheden, hoedanigheden en oppervlakten en op de voor die vaststellingen te gebruiken
      apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel35
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '35'
        hoofdstuk: VI
  - number: '36.2'
    text: 'De bevoegdheid tot het doen van vaststellingen kan worden verbonden aan:'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel36
  - number: 36.2.a
    text: een door Onze Minister overeenkomstig bij of krachtens de maatregel gestelde voorwaarden verleende erkenning;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel36
  - number: 36.2.b
    text: |-
      een door de Raad voor Accreditatie verleende accreditatie overeenkomstig een door Onze Minister goedgekeurd
      programma van eisen.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel36
  - number: '36.3'
    text: |-
      Aan een erkenning kunnen voorschriften worden verbonden en zij kan onder beperkingen worden verleend. De
      voorschriften en beperkingen kunnen worden gewijzigd, aangevuld of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel36
  - number: '36.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het verlenen, weigeren of intrekken van
      een erkenning.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel36
  - number: '37'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het opmaken, bewaren,
      overleggen en afdragen van gegevens door degenen die:
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel37
  - number: 37.a
    text: |-
      betrokken zijn bij het doen van vaststellingen ten behoeve van de bepaling van de hoeveelheden, hoedanigheden en
      oppervlakten, bedoeld in [artikel 34][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel34
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '34'
        hoofdstuk: VI
  - number: 37.b
    text: |-
      diervoeder of dieren, als bedoeld in [artikel 35, tweede lid, onderdeel b][ref1], op bedrijven afleveren, dan wel
      dieren, melk en andere dierlijke producten, als bedoeld in [artikel 35, tweede lid, onderdelen b en c][ref2], van
      bedrijven afnemen of be- of verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel35
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '35'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '35'
        hoofdstuk: VI
  - number: '38.1'
    text: Bij ministeriële regeling kan vrijstelling worden verleend van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel38
  - number: '38.2'
    text: Onze Minister kan ontheffing verlenen van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel38
  - number: '38.3'
    text: Aan de vrijstelling of de ontheffing kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel38
  - number: '39.1'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent het indienen van aanvragen voor vergunningen,
      ontheffingen en erkenningen, die krachtens deze wet kunnen worden verleend, en het indienen van kennisgevingen, die
      ingevolge bij of krachtens deze wet gestelde regels moeten worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel39
  - number: '39.2'
    text: 'Bij de regeling kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel39
  - number: 39.2.a
    text: |-
      dat een aanvraag eerst in behandeling wordt genomen of dat een kennisgeving eerst wordt geregistreerd nadat een
      daarvoor vastgesteld bedrag is voldaan;
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel39
  - number: 39.2.b
    text: |-
      de kosten van het onderzoek voortvloeiende uit de aanvraag geheel of gedeeltelijk ten laste van de aanvrager wordt
      gebracht.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel39
  - number: '40.1'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel40
  - number: '40.2'
    text: |-
      Indien onderwerpen waarop deze wet van toepassing is, ter uitvoering van een bindend besluit van de Raad van de
      Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen
      regeling behoeven, kan dit geschieden bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel40
  - number: '41.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan medewerking worden gevorderd van het bestuur van een
      bedrijfslichaam.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel41
  - number: '41.2'
    text: |-
      Indien de van het bestuur van een bedrijfslichaam gevorderde medewerking bestaat in het stellen van nadere regels
      bij verordening, behoeft deze verordening de goedkeuring van Onze Minister en van Onze Ministers wie het mede
      aangaat, tezamen. Krachtens de verordening genomen besluiten behoeven, voorzover dit bij of krachtens de maatregel
      als bedoeld in het eerste lid is bepaald, de goedkeuring van de daarbij aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel41
  - number: '43.1'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 43.1.a
    text: |-
      een algemene maatregel van bestuur als bedoeld in de [artikelen 4][ref1], [6][ref2], [11, vierde lid][ref3],
      [16][ref4], [32][ref5], [33][ref6] en [76, eerste lid][ref7],


