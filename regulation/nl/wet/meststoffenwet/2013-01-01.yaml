        hoofdstuk: IX
  - number: 43.1.b
    text: |-
      een ministeriële regeling als bedoeld in de [artikelen 10][ref1], [11, vijfde lid][ref2], en [12, derde lid][ref3],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel12
