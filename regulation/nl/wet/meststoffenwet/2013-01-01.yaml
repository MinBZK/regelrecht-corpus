  - number: '62.3'
    text: |-
      De op grond van het tweede lid te bepalen bestuurlijke boete bedraagt per overtreding ten hoogste het bedrag dat is
      bepaald voor de vijfde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '69'
    text: |-
      Onze Minister kan de bestuurlijke boete verrekenen met te verstrekken subsidies bij of krachtens de
      [Kaderwet LNV-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009194
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0009194
  - number: '74.1'
    text: |-
      Voor de toepassing van de [artikelen 19][ref1] en [20, eerste lid][ref2], wordt ten aanzien van een bedrijf
      dat geheel of gedeeltelijk is gelegen in een concentratiegebied, van het op dat bedrijf rustende varkensrecht
      onderscheidenlijk pluimveerecht dat deel buiten beschouwing gelaten dat in de periode met ingang van 23 april 2010
      tot het tijdstip van inwerkingtreding van dit artikel, is overgegaan van een bedrijf dat geheel of gedeeltelijk is
      gelegen buiten dat concentratiegebied.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel20
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '19'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '20'
        hoofdstuk: V
  - number: '74.2'
    text: |-
      Het is verboden varken, kippen of kalkoenen te houden op een locatie gelegen in een concentratiegebied indien deze
      varkens-, kippen- of kalkoenenhouderij na 22 april 2010 binnen een bedrijf is verplaatst van een locatie gelegen
      buiten dat concentratiegebied.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel74
  - number: '75'
    text: |-
      [Artikel 74, eerste lid][ref1], is niet van toepassing indien met betrekking tot de in dat lid bedoelde overgang:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel74
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '74'
        hoofdstuk: IX
  - number: 75.a
    text: |-
      vóór 23 april 2010 een kennisgeving als bedoeld in [artikel 27, eerste lid][ref1], heeft plaatsgevonden; of


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel27
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '27'
        hoofdstuk: V
  - number: 75.b
    text: |-
      vóór 23 april 2010 een schriftelijke overeenkomst is gesloten en vóór 8 mei 2010 een kennisgeving als bedoeld in
      [artikel 27, eerste lid][ref1], heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel27
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '27'
        hoofdstuk: V
  - number: '76.1'
    text: |-
      De verschillende artikelen van deze wet, of onderdelen daarvan, komen te vervallen op een bij algemene maatregel
      van bestuur te bepalen tijdstip dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden
      bepaald.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel76
  - number: '76.2'
    text: |-
      Op het in het eerste lid bedoelde tijdstip vervallen in [artikel 1a van de Wet op de economische delicten][ref1] de
      verwijzingen naar de betrokken artikelen of onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: 1a
  - number: '76.3'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid wordt aan beide kamers der Staten-Generaal
      overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij
      koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten minste
      een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp
      bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.
      Indien het voorstel van wet wordt ingetrokken of indien een van beide kamers van de Staten-Generaal besluit het
      voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel76
  - number: '77'
    text: |-
      [Hoofdstuk V][ref1] vervalt met ingang van 1 januari 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0004054
        hoofdstuk: V
  - number: '78'
    text: 'Deze wet wordt aangehaald als: Meststoffenwet.'
    url: https://wetten.overheid.nl/BWBR0004054/2013-01-01#Artikel78
