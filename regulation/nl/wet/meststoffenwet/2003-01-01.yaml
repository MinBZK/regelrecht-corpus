  - number: 1.1.aa
    text: |-
      zand- of lössgrond: perceel dat op bij algemene maatregel van bestuur vastgestelde kaarten wordt aangeduid als
      zand- of lössgrond, welke aanduiding geschiedt als het perceel blijkens na 1950 genomen representatieve monsters
      van de grondlaag tot een diepte van ten hoogste 120 centimeter onder het maaiveld voor ten minste de helft bestaat
      uit zand of löss, alsmede perceel kleiner dan 12,5 hectare dat is omsloten door percelen die voldoen aan de
      voornoemde criteria;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.ab
    text: 'klei- of veengrond: grond, niet zijnde zand- of lössgrond;'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.ac
    text: |-
      uitspoelingsgevoelige grond: zand- of lössgrond die op bij algemene maatregel van bestuur vastgestelde kaarten
      wordt aangeduid als uitspoelingsgevoelige grond, welke aanduiding geschiedt als bij ten minste twee derde deel van
      het perceel sprake is van een gemiddeld hoogste grondwaterstand van ten minste 40 centimeter onder het maaiveld en
      een gemiddeld laagste grondwaterstand van meer dan 120 centimeter onder het maaiveld;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.ad
    text: |-
