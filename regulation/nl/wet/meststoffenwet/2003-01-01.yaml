        artikel: 58ae
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004054
        artikel: 58aka
        hoofdstuk: V
        paragraaf: '4'
  - number: 58an.1.a
    text: de overeenkomst is vóór 1 oktober van het desbetreffende jaar gesloten en schriftelijk vastgelegd;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58an
  - number: 58an.1.b
    text: |-
      de overeenkomst, zoals deze schriftelijk is vastgelegd, is aan het Bureau Heffingen verzonden en blijkens de
      registratie van dat bureau uiterlijk op 1 oktober van het desbetreffende jaar door het bureau ontvangen;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58an
  - number: 58an.1.c
    text: |-
      de wederpartij bij de overeenkomst heeft in het desbetreffende jaar de in de [artikelen 58aj, eerste lid][ref1],
      [58ak, eerste lid][ref2], [58 aka, eerste lid][ref3], en [58al][ref4] gestelde verboden niet overtreden;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58aj
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58ak
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58aka
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel58al
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58an
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58aj
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58ak
        hoofdstuk: V
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004054
        artikel: 58aka
        hoofdstuk: V
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0004054
        artikel: 58al
        hoofdstuk: V
        paragraaf: '4'
  - number: 58an.1.d
    text: |-
      de overeenkomst bevat de verplichting voor de wederpartij om in het desbetreffende kalenderjaar de in de
      overeenkomst genoemde hoeveelheid dierlijke meststoffen, al dan niet door tussenkomst van een onderneming als
      bedoeld in [artikel 29 van de wet][ref1], op het in de overeenkomst genoemde bedrijf of onderneming aan te voeren,
      voorzover deze hoeveelheid daadwerkelijk worden geleverd;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel29
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58an
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '29'
        hoofdstuk: IV
  - number: 58an.1.e
    text: de overeenkomst voldoet aan bij ministeriële regeling gestelde regels.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58an
  - number: 58an.2
    text: |-
      Het eerste lid, onderdeel c in samenhang met de aanhef, geldt uitsluitend voor de mestafzetovereenkomsten die
      in het desbetreffende jaar verplichten tot de afname van een hoeveelheid stikstof die, gegeven de eerder door
      het Bureau Heffingen met betrekking tot dat jaar ontvangen mestafzetovereenkomsten, de in [artikel 58aj][ref1],
      onderscheidenlijk [artikel 58ak, tweede en derde lid][ref2], bedoelde mestaanvoerruimte, of de in
      [artikel 58aka, eerste lid][ref3], onderscheidenlijk de in [artikel 58al][ref4] bedoelde hoeveelheid overschrijdt.
      Ingeval verschillende overeenkomsten op dezelfde dag door het Bureau Heffingen zijn ontvangen en de totale
      hoeveelheid stikstof tot afname waarvan deze overeenkomsten tezamen verplichten de bedoelde mestaanvoerruimte,
      onderscheidenlijk hoeveelheid overschrijdt, geldt het eerste lid, aanhef en onderdeel c, met betrekking tot elk van
      deze overeenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58aj
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58ak
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58aka
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel58al
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58an
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58aj
        hoofdstuk: V
        paragraaf: '4'
