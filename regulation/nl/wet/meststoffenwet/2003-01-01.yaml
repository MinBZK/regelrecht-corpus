  - number: 58ao.2
    text: |-
      [Artikel 58an, tweede lid][ref1], is van overeenkomstige toepassing op het eerste lid, onderdeel b in samenhang met
      de aanhef.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58an
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ao
