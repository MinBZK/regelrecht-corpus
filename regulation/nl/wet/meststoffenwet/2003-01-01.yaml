  - number: '71.2'
    text: |-
      Handelen in strijd met het bepaalde bij of krachtens de [artikelen 3][ref1], [4][ref2], [5][ref3],
      [6][ref4], [6a][ref5], [7][ref6], [7a][ref7], [42a, eerste lid][ref8], [55][ref9], [57, tweede lid][ref10],
      [58][ref11], [58c][ref12], [58d, tweede lid][ref13], [58e, derde lid][ref14], [58f, eerste lid][ref15],
      [58aa][ref16], [58ae, vierde en zesde lid][ref17], [58af, eerste lid][ref18], [58aj, eerste lid][ref19],
      [58ak, eerste lid][ref20], [58aka, eerste, derde en vierde lid][ref21], [58al][ref22], [59, derde lid][ref23], en
      [61][ref24] is een strafbaar feit.


