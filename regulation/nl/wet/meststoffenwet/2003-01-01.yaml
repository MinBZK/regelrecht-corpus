      - id: ref4
        bwb_id: BWBR0004054
        artikel: 58ak
        hoofdstuk: V
        paragraaf: '4'
  - number: 58an.4
    text: |-
      Indien de producent van de dierlijke meststoffen of de erkende tussenpersoon eerst na 1 augustus van
      het desbetreffende jaar kennis neemt van het feit dat zijn wederpartij bij de overeenkomst het in
      [artikel 58aj, eerste lid][ref1], [58ak, eerste lid][ref2], [58aka, eerste lid][ref3], of [58al][ref4] gestelde
      verbod heeft overtreden, en de producent, onderscheidenlijk tussenpersoon daar redelijkerwijs niet eerder bekend
      mee had kunnen zijn, kan de producent, onderscheidenlijk tussenpersoon in afwijking van het eerste lid, onderdeel
      a, voor de hoeveelheid stikstof waarop de ingevolge het eerste lid, aanhef en onderdeel c, niet in aanmerking
      genomen overeenkomst betrekking had nog tot en met 31 december van dat jaar mestafzetovereenkomsten sluiten.
      In zoverre in afwijking van het eerste lid, onderdeel b, is het afschrift van de in de eerste volzin bedoelde
      overeenkomst blijkens de registratie van het Bureau Heffingen uiterlijk op 2 januari van het volgende jaar door het
      bureau ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58aj
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58ak
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58aka
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel58al
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58an
    references:
