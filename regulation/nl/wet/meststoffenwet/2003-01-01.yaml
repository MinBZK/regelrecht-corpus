  - number: 1.1.k
    text: |-
      produceren van dierlijke meststoffen: produceren van dierlijke meststoffen door het houden van dieren, door
      uitscharing van dieren of door tijdelijke onderbrenging ter weiding van dieren elders;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.l
    text: |-
      aanvoeren van meststoffen: feitelijk afnemen van meststoffen van een derde of van een ander bedrijf, daaronder
      begrepen de dierlijke meststoffen geproduceerd door ter inscharing aangenomen dieren of door tijdelijk ter weiding
      aangenomen dieren;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.m
    text: |-
      afvoeren van meststoffen: feitelijk afleveren van meststoffen aan een derde of aan een ander bedrijf, daaronder
      begrepen de dierlijke meststoffen geproduceerd door uitgeschaarde dieren of door tijdelijk elders ter weiding
      ondergebrachte dieren;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.n
    text: |-
      mestoverschot: de in een bepaald kalenderjaar geproduceerde, aangevoerde of uit opslag komende hoeveelheid
      dierlijke meststoffen die in dat jaar niet op het eigen bedrijf wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.o
    text: |-
      perceel: aaneengesloten, door wegen, waterwegen, sloten, houtopstanden, muren, wallen of anderszins topografisch
      begrensde oppervlakte grond;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.p
    text: |-
      landbouwgrond: grond waarop enige vorm van akkerbouw, veehouderij – daaronder begrepen intensieve veehouderij –
      tuinbouw – daaronder begrepen fruitteelt en het kweken van bomen, planten, bloemen en bloembollen – en bosbouw die
      aan bij ministeriële regeling gestelde regels voldoet, wordt uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.q
    text: |-
      tot het bedrijf behorende oppervlakte landbouwgrond: in Nederland gelegen oppervlakte landbouwgrond, daaronder
      niet begrepen de oppervlakte waarop zich de bedrijfsgebouwen en daarbij behorende voorzieningen bevinden, die
      tot het bedrijf behoort op grond van eigendom, een zakelijk gebruiksrecht of een door de grondkamer goedgekeurde
      pachtovereenkomst als bedoeld in [artikel 12, eerste lid, van de Pachtwet][ref1], en die in het kader van een
      normale bedrijfsvoering bij dat bedrijf in gebruik is;


      [ref1]: https://wetten.overheid.nl/BWBR0002269#Artikel12
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002269
        artikel: '12'
  - number: 1.1.r
    text: 'grasland: landbouwgrond waarop gras wordt geteeld;'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.s
    text: 'bouwland: landbouwgrond, niet zijnde grasland en niet zijnde braakland;'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.t
    text: |-
      braakland: landbouwgrond waarop in het betreffende kalenderjaar gedurende ten minste zes maanden aaneengesloten
      geen gewas wordt geteeld, dan wel waarop gedurende zodanige periode een gewas wordt geteeld ten behoeve van
      groenbemesting;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.u
    text: |-
      grond met een houtopstand: grond met een houtopstand waarvan velling – anders dan bij wijze van dunning –
      een verplichting tot herbeplanten op grond van [artikel 3 van de Boswet][ref1], dan wel enig ander algemeen
      verbindend voorschrift doet ontstaan, alsmede grond waarop zich een dergelijke houtopstand bevond, tenzij aan
      de verplichting tot herbeplanten is voldaan door beplanting van andere grond of een ontheffing als bedoeld in
      [artikel 6, tweede lid, van de Boswet][ref2] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002357#Artikel6
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
