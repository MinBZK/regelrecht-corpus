preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen met betrekking tot het verhandelen
    van meststoffen, zowel in het belang van de bevordering van de deugdelijkheid voor het doel waarvoor zij zijn
    bestemd als in het belang van de bescherming van de bodem, en voorts regelen te stellen in het belang van een
    doelmatige afvoer van mestoverschotten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Landbouw, Natuurbeheer en Visserij;'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.b
    text: 'grond: dat deel van de bodem dat wordt gebruikt of is bestemd om te worden gebruikt als voedingsbodem voor planten;'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.c
    text: |-
      groeimedium: materiaal in vaste of vloeibare vorm, niet zijnde grond, dat wordt gebruikt of is bestemd om te worden
      gebruikt als voedingsbodem voor planten;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.d
    text: 'meststoffen: producten die bestemd zijn om'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.d.1°
    text: |-
      te worden toegevoegd aan grond of aan een groeimedium en die geheel of gedeeltelijk bestaan uit stoffen, organismen
      daaronder begrepen, of mengsels van stoffen, die als zodanig kunnen dienen om grond of een groeimedium geschikt of
      beter geschikt te maken als voedingsbodem voor planten;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.d.2°
    text: te worden gebruikt als groeimedium;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.d.3°
    text: |-
      te worden gebruikt als voedsel voor planten of delen van planten, voor zover deze producten niet reeds zijn
      begrepen onder 1° of 2°;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.e
    text: |-
      dierlijke meststoffen: meststoffen of producten die geheel of grotendeels bestaan uit uitwerpselen van de in
      [bijlage A][ref1] bij deze wet opgenomen diersoorten, onderverdeeld in categorieën per soort, daaronder begrepen de
      door mestscheiding of andere vormen van be- of verwerking van de meststoffen verkregen waterige fractie;


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 1.1.f
    text: |-
      overige organische meststoffen: organische meststoffen, niet zijnde dierlijke meststoffen, die zijn opgenomen in
      [bijlage B][ref1] bij deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 1.1.g
    text: |-
      andere meststoffen: meststoffen, niet zijnde dierlijke of overige organische meststoffen, die zijn opgenomen in
      [bijlage B][ref1] bij deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 1.1.h
    text: |-
      verhandelen van meststoffen: afleveren van meststoffen aan handelaren in of gebruikers dan wel verwerkers
      van meststoffen alsmede het met het oog daarop voorhanden of in voorraad hebben, aanbieden of vervoeren van
      meststoffen;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.i
    text: |-
      diervoeders: producten van plantaardige of dierlijke oorsprong, in natuurlijke staat, vers of verduurzaamd, en de
      afgeleide producten van hun industriële verwerking, alsmede organische of anorganische stoffen, al dan niet in de
      vorm van een mengsel, met of zonder toevoegingsmiddelen en diergeneesmiddelen, en bestemd voor dierlijke voeding
      langs orale weg;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: 1.1.j
    text: |-
      bedrijf: geheel van productie-eenheden bestaande uit één of meer gebouwen of afgescheiden gedeelten daarvan
      en de daarbij behorende landbouwgrond, uitsluitend of onder meer dienende tot de uitoefening van de landbouw,
      zulks beoordeeld naar de feitelijke omstandigheden, en in ieder geval dat geheel van productie-eenheden dat
      als één bedrijf is opgegeven op grond van de krachtens [artikel 7][ref1] gestelde regels inzake de registratie
      van de productie van dierlijke meststoffen, dan wel het na deze opgave ontstane geheel van productie-
      eenheden als gevolg van splitsing of samenvoeging overeenkomstig de bij of krachtens [hoofdstuk V][ref2], de
      [Wet verplaatsing mestproductie][ref3] of de [Wet herstructurering varkenshouderij][ref4] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004054#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0006285
      [ref4]: https://wetten.overheid.nl/BWBR0009542
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
    references:
      - id: ref1
