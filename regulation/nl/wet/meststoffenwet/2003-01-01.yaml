  - number: 58aq.3
    text: |-
      De in het tweede lid bedoelde afwijkende hoeveelheden kunnen verschillend worden vastgesteld al naar gelang sprake
      is van zand- of lössgrond, klei- of veengrond, uitspoelingsgevoelige grond, niet-uitspoelingsgevoelige grond of
      andere bij de maatregel op basis van de grondsoort of grondwaterstand aangeduide gronden.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58aq
  - number: '59.1'
    text: Bij ministeriële regeling kan vrijstelling worden verleend van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel59
  - number: '59.2'
    text: Onze Minister kan ontheffing verlenen van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel59
  - number: '59.3'
    text: Aan de vrijstelling of de ontheffing kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel59
  - number: '60.1'
    text: |-
      Onze Minister kan regelen stellen omtrent het indienen van aanvragen voor vergunningen, ontheffingen en
      erkenningen, die krachtens deze wet kunnen worden verleend en de wijze van behandeling van die aanvragen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel60
  - number: '60.2'
    text: Bij de in het eerste lid bedoelde regelen kan worden bepaald dat
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel60
  - number: 60.2.a
    text: een aanvraag eerst in behandeling wordt genomen nadat een daarvoor vastgesteld bedrag is voldaan;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel60
  - number: 60.2.b
    text: |-
      de kosten van het onderzoek voortvloeiende uit de aanvraag om een vergunning, een ontheffing of een erkenning
      geheel of gedeeltelijk ten laste van de aanvrager worden gebracht.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel60
  - number: '61.1'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel61
  - number: '61.2'
    text: |-
      Indien onderwerpen waarop deze wet van toepassing is, ter uitvoering van een bindend besluit van de Raad van de
      Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen
      regeling behoeven, kan dit geschieden bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel61
  - number: 61a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan medewerking worden gevorderd van het bestuur van een
      bedrijfslichaam.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel61a
  - number: 61a.2
    text: |-
      Indien de van het bestuur van een bedrijfslichaam gevorderde medewerking bestaat in het stellen van nadere regels
      bij verordening, behoeft deze verordening de goedkeuring van Onze Minister en van Onze Ministers wie het mede
      aangaat, tezamen. Krachtens de verordening genomen besluiten behoeven, voorzover dit bij of krachtens de maatregel
      als bedoeld in het eerste lid is bepaald, de goedkeuring van de daarbij aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel61a
  - number: '62'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel62
  - number: '63.1'
    text: |-
      Het ontwerp van een algemene maatregel van bestuur als bedoeld in de [artikelen 1, onderdelen aa en ac][ref1],
      [6][ref2], [46][ref3], [47][ref4], [48][ref5], [49][ref6], [50][ref7], [58][ref8] en [75][ref9], wordt in de
      Staatscourant bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel47
