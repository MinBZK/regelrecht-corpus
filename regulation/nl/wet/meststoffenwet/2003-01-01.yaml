  - number: 58aq.2
    text: |-
      Bij algemene maatregel van bestuur kunnen voor de toepassing van de [artikelen 58ac][ref1], [58ad][ref2],
      [58ah][ref3] en [58ai][ref4] en voor de toepassing van de [artikelen 58aj, derde lid][ref5], en
      [58ak, derde lid][ref6] in samenhang met de [artikelen 58ah][ref7] en [58ai][ref8], van de hoeveelheden stikstof
      genoemd in de [artikelen 58ac, onderdeel a, onder 1° en 2°][ref9], [58ad, onderdeel a, onder 1° en 2°][ref10],
      [58ah, onderdeel a, onder 1° en 2°][ref11], en [58ai, onderdeel a, onder 1° en 2°][ref12], afwijkende
      hoeveelheden worden vastgesteld. De afwijking bedraagt ten hoogste 35%.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ac
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58ad
