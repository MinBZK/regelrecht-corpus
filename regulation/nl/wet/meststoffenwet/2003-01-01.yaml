  - number: '63.2'
    text: |-
      Binnen een bij de bekendmaking, bedoeld in het eerste lid, te stellen termijn, kan een ieder de gelegenheid worden
      geboden zijn wensen en bezwaren ter kennis van Onze Minister te brengen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel63
  - number: '64'
    text: |-
      De voordracht voor algemene maatregelen van bestuur krachtens deze wet wordt Ons gedaan door Onze Minister of, voor
      zover deze maatregelen worden getroffen in het belang van de bescherming van de bodem, door Onze Minister en Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer te zamen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel64
  - number: '65'
    text: |-
      Een krachtens de [artikelen 6][ref1], [46, eerste lid][ref2], [47][ref3], [48][ref4], [49][ref5], [50][ref6],
      [58][ref7], [58aq, tweede lid][ref8], en 80 vastgestelde algemene maatregel van bestuur wordt aan de beide kamers
      der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn
      verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door ten minste een vijfde van het
      grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene
      maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig
      mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de beide kamers van de Staten-
      Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel47
