  - number: 58k.1.c
    text: |-
      de op het bedrijf geproduceerde hoeveelheid meststoffen afkomstig van kippen en kalkoenen in 1995, 1996 en
      1997 gemiddeld minder dan 5% was van de hoeveelheid die in die jaren ingevolge het voor het bedrijf geldende
      mestproductierecht mocht worden geproduceerd, terwijl dat percentage in 1998 ten minste 25% was;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58k
  - number: 58k.1.d
    text: |-
      de op het bedrijf geproduceerde hoeveelheid meststoffen afkomstig van kippen en kalkoenen in 1998 ten minste 25%
      groter was dan de door deze diersoorten gemiddeld in 1995, 1996 en 1997 geproduceerde hoeveelheid meststoffen, en
      deze vergroting gepaard ging met ten minste eenzelfde vergroting van zowel het grondgebonden mestproductierecht als
      het mestproductierecht, als gevolg van een vergroting van de tot het bedrijf behorende oppervlakte landbouwgrond in
      de periode van 1 januari 1997 tot en met 5 november 1998.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58k
  - number: 58k.2
    text: 'De overeenkomstig de maatregel bepaalde omvang van het pluimveerecht komt ten hoogste overeen met:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58k
  - number: 58k.2.a
    text: |-
      ingeval het eerste lid, onderdeel a, op het bedrijf van toepassing is, het op 5 november 1998 voor het bedrijf
      geldende mestproductierecht;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58k
  - number: 58k.2.b
    text: |-
      ingeval het eerste lid, onderdeel b, op het bedrijf van toepassing is, de overeenkomstig de [artikelen 58h][ref1],
      [58i][ref2] en [58j][ref3] bepaalde hoeveelheid, vermeerderd met het deel waarmee het varkensrecht waarop de
      belanghebbende op grond van [hoofdstuk II][ref4] en [artikel 24 van de Wet herstructurering varkenshouderij][ref5]
      ten hoogste aanspraak had kunnen maken ingevolge de melding is verlaagd, welk deel wordt uitgedrukt in kilogrammen
      fosfaat door vermenigvuldiging van het aantal varkenseenheden met 7,4 kilogram fosfaat;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58h
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58i
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58j
      [ref4]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
      [ref5]: https://wetten.overheid.nl/BWBR0009542#Artikel24
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58k
    references:
      - id: ref1
