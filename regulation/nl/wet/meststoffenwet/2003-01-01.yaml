        hoofdstuk: III
  - number: 55a.6
    text: |-
      De aangifte overschotheffing en de correcties daarop worden voor de toepassing van het vierde en het vijfde lid
      slechts in aanmerking genomen indien deze vóór 10 juli 1997 schriftelijk ter kennis van het Bureau Heffingen zijn
      gebracht.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55a
  - number: '56'
    text: |-
      Met ingang van het tijdstip van inwerkingtreding van [artikel 58c][ref1] wordt voor de toepassing van
      [artikel 55, eerste lid, onder][ref2] uitbreiding van de productie van dierlijke meststoffen verstaan: een grotere
      productie van dierlijke meststoffen dan het mestproductierecht dat is verminderd met het pluimveerecht geldend
      op het tijdstip van inwerkingtreding van [artikel 58c][ref3]. De vermindering geschiedt niet voor zover dit
      pluimveerecht groter is dan het niet-gebonden mestproductierecht, zoals dit gold onmiddellijk vóór het tijdstip van
      inwerkingtreding van [artikel 58c][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58c
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58c
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel58c
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58c
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '55'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0004054
        artikel: 58c
        hoofdstuk: V
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004054
        artikel: 58c
        hoofdstuk: V
        paragraaf: '2'
  - number: '57.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de gevallen waarin en de
      voorwaarden waaronder door Onze Minister de van de onderscheiden diersoorten afkomstige hoeveelheid dierlijke
      meststoffen, uitgedrukt in kilogrammen fosfaat, die op een bedrijf ten hoogste mag worden geproduceerd kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel57
  - number: '57.2'
    text: |-
      Het is verboden een grotere hoeveelheid dierlijke meststoffen te produceren dan de hoeveelheid die door Onze
      Minister overeenkomstig de in het eerste lid bedoelde regelen is vastgesteld. Artikel 55, achtste lid, is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel57
  - number: '57.3'
    text: |-
      Ten aanzien van de gevolgen van wijziging van de tot het bedrijf behorende oppervlakte landbouwgrond op de omvang
      van het mestproductierecht en het niet-gebonden mestproductierecht blijven [artikel 55][ref1] en de regels gesteld
      krachtens de [artikelen 1, derde lid][ref2], en [6 van de Wet verplaatsing mestproductie][ref3] onverkort van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0006285#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006285#Artikel6
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '55'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0006285
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0006285
        artikel: '6'
  - number: '58'
    text: |-
      Verplaatsing van de productie van dierlijke meststoffen naar een andere locatie of een ander bedrijf is verboden,
      tenzij aan bij algemene maatregel van bestuur te stellen voorwaarden wordt voldaan die onder meer betrekking kunnen
      hebben op:
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58
  - number: 58.a
    text: |-
      de omvang van de te verplaatsen bedrijfstak of bedrijfstakken van waaruit de dierlijke meststoffen worden
      verkregen;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58
  - number: 58.b
    text: de vermindering van de productie aan dierlijke meststoffen op het bedrijf van waaruit verplaatsing plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58
  - number: 58.c
    text: |-
      de aantekening van de verplaatsing bij de ingevolge [artikel 7][ref1] op te maken, te bewaren, over te leggen of af
      te dragen gegevens op een daarbij aangegeven wijze;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel7
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '7'
        hoofdstuk: III
  - number: 58.d
    text: |-
      een kennisgeving van de verplaatsing binnen een daarbij aan te geven termijn aan een daarbij aangewezen orgaan op
      een daarbij aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58
  - number: 58a
    text: 'In deze titel en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58a
  - number: 58a.a
    text: |-
      aangifte overschotheffing: schriftelijke opgave, zoals in voorkomend geval gecorrigeerd, die ter vaststelling van
      de verschuldigde overschotheffing met betrekking tot het bedrijf is gedaan krachtens de [artikelen 8][ref1] en
      [13][ref2], zoals deze artikelen luidden vóór 1 januari 1998;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel13
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '8'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '13'
        hoofdstuk: III
  - number: 58a.b
    text: |-
      afsluitformulier 1994: Afsluitformulier bijzondere gebruiksnormen 1994 (125-) als bedoeld in artikel 1, eerste lid,
      van de Regeling vaststelling afsluitformulieren 1994;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58a
  - number: 58a.c
    text: |-
      afsluitformulier 1995: Afsluitformulier bijzondere gebruiksnormen 1995 (125-) of Afsluitformulier mestboekhouding
      1995 (110-125) als bedoeld in artikel 1, eerste lid, van de Regeling vaststelling afsluitformulieren 1995;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58a
  - number: 58a.d
    text: |-
      afsluitformulier 1996: Afsluitformulier bijzondere gebruiksnormen 1996 (125-) of Afsluitformulier mestboekhouding
      1996 (110-125) als bedoeld in artikel 1, eerste lid, van de Regeling vaststelling afsluitformulieren 1996;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58a
  - number: 58a.e
    text: |-
      afsluitformulier 1997: Afsluitformulier bijzondere gebruiksnormen 1997 (125-) of Afsluitformulier mestboekhouding
      1997 (110-125) als bedoeld in artikel 1, eerste lid, van de Regeling vaststelling afsluitformulieren 1997;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58a
  - number: 58a.f
    text: |-
      vrijstellingsverklaring: formulier als bedoeld in artikel 3 van de Regeling vaststelling mestboekhoudplicht
      (algemeen);
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58a
  - number: 58a.g
    text: |-
      belanghebbende: persoon of rechtspersoon die, of samenwerkingsverband van personen of rechtspersonen dat over
      het desbetreffende bedrijf beschikt ingevolge eigendom, een zakelijk gebruiksrecht, of een door de grondkamer
      goedgekeurde pachtovereenkomst;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58a
  - number: 58a.h
    text: |-
      verplaatsing: verplaatsing als bedoeld in [artikel 1, eerste lid, van de Wet verplaatsing mestproductie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel1
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '1'
  - number: 58a.i
    text: |-
      kennisgeving van verplaatsing: kennisgeving als bedoeld in de [artikelen 9][ref1] en
      [10 van de Wet verplaatsing mestproductie][ref2], betrekking hebbend op de verplaatsing naar een ander bedrijf;


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006285#Artikel10
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0006285
        artikel: '10'
  - number: 58a.j
    text: |-
      registratie van een kennisgeving van verplaatsing: registratie als bedoeld in
      [artikel 9 van de Wet verplaatsing mestproductie][ref1] en als bedoeld in [artikel 10, tweede lid][ref2], in
      samenhang met [9 van die wet][ref3], betrekking hebbend op de verplaatsing naar een ander bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006285#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0006285#Artikel9
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0006285
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0006285
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0006285
        artikel: '9'
  - number: 58b.1
    text: 'Voor de toepassing van deze titel en de daarop berustende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58b
  - number: 58b.1.a
    text: |-
      worden het mestproductierecht, het niet-gebonden mestproductierecht en het grondgebonden mestproductierecht in
      aanmerking genomen zoals deze, al naar gelang het geval, op het desbetreffende tijdstip dan wel met betrekking tot
      het desbetreffende jaar voor het desbetreffende bedrijf door het Bureau Heffingen zijn geregistreerd;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58b
  - number: 58b.1.b
    text: |-
      wordt het niet-gebonden mestproductierecht voor varkens en kippen zoals dat gold met betrekking tot 1995, 1996 en
      1997 vermenigvuldigd met 10/7;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58b
  - number: 58b.1.c
    text: |-
      wordt de in enig jaar geproduceerde hoeveelheid dierlijke meststoffen afkomstig van de onderscheiden in
      [bijlage A][ref1] bij deze wet genoemde diersoorten bepaald overeenkomstig [artikel 55, achtste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel55
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '55'
        hoofdstuk: V
  - number: 58b.1.d
    text: |-
      is de in 1994, 1995, 1996 of 1997 op het bedrijf geproduceerde hoeveelheid dierlijke meststoffen afkomstig van de
      onderscheiden in [bijlage A][ref1] bij deze wet genoemde diersoorten, de hoeveelheid zoals deze met betrekking tot
      het desbetreffende jaar en het desbetreffende bedrijf is opgegeven in de aangifte overschotheffing, dan wel, bij
      gebreke daarvan, op het afsluitformulier 1994, onderscheidenlijk 1995, 1996 of 1997, dan wel, bij gebreke daarvan,
      voorzover het de in 1995, 1996 of 1997 geproduceerde hoeveelheid betreft, op de vrijstellingsverklaring;


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 58b.1.e
    text: |-
      worden de gegevens van de aangifte overschotheffing en de correcties daarop, het afsluitformulier 1994, het
      afsluitformulier 1995, het afsluitformulier 1996, het afsluitformulier 1997 en de vrijstellingsverklaring slechts
      in aanmerking genomen voor zover deze door het Bureau Heffingen zijn ontvangen vóór 6 november 1998.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58b
  - number: 58b.2
    text: |-
      Indien in 1994, 1995, 1996 of 1997 overdracht van het bedrijf heeft plaatsgevonden, wordt voor de toepassing van
      het eerste lid, onderdeel d, in aanmerking genomen de som van de door de vervreemder en door de verwerver van
      het bedrijf voor dat jaar ten aanzien van het bedrijf opgegeven hoeveelheden dierlijke meststoffen, zoals deze
      hoeveelheden over het gehele jaar zijn gemiddeld.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58b
  - number: 58c
    text: |-
      Het is verboden op een bedrijf in een kalenderjaar een grotere hoeveelheid dierlijke meststoffen afkomstig van
      kippen en kalkoenen te produceren dan het voor dat jaar voor het bedrijf geldende pluimveerecht.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58c
  - number: 58d.1
    text: |-
      Het in [artikel 58c][ref1] gestelde verbod is niet van toepassing indien op het bedrijf op geen enkel moment een
      groter aantal kippen en kalkoenen wordt gehouden dan overeenkomt met 250 legkippen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58c
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58d
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58c
        hoofdstuk: V
        paragraaf: '2'
  - number: 58d.2
    text: |-
      Het is verboden anders dan op een bedrijf op enig moment een groter aantal kippen en kalkoenen te houden dan
      overeenkomt met 250 legkippen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58d
  - number: 58d.3
    text: |-
      Voor de bepaling van het aantal dieren dat overeenkomt met 1 legkip wordt de voor de desbetreffende diersoort
      en diercategorie in [bijlage A][ref1] bij deze wet opgenomen norm voor de jaarlijkse fosfaatproductie per dier
      vermenigvuldigd met 2.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58d
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 58e.1
    text: |-
      Onze Minister kan ten aanzien van een bedrijf waarvan het pluimveerecht is overschreden bepalen dat het op enig
      moment op het bedrijf gehouden aantal kippen en kalkoenen het door hem vastgestelde aantal niet mag overschrijden.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58e
  - number: 58e.2
    text: |-
      Het in het eerste lid bedoelde aantal komt overeen met het aantal kippen en kalkoenen dat overeenkomstig het
      pluimveerecht gemiddeld gedurende het jaar mag worden gehouden, vermeerderd met 15%.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58e
  - number: 58e.3
    text: |-
      Onverminderd [artikel 58c][ref1] is het verboden op enig moment op een bedrijf een groter aantal kippen en
      kalkoenen te houden dan het overeenkomstig het eerste en tweede lid door Onze Minister bepaalde aantal.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58c
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58e
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58c
        hoofdstuk: V
        paragraaf: '2'
  - number: 58e.4
    text: |-
      De in het eerste lid bedoelde bevoegdheid kan met betrekking tot een bedrijf voor een aaneengesloten periode van
      ten hoogste drie jaar worden uitgeoefend. Deze periode kan telkens worden verlengd met eenzelfde periode te rekenen
      vanaf het tijdstip waarop wordt geconstateerd dat op het bedrijf een groter aantal kippen en kalkoenen wordt
      gehouden dan het door Onze Minister bepaalde aantal.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58e
  - number: 58f.1
    text: |-
      Het is verboden de productie van dierlijke meststoffen afkomstig van kippen of kalkoenen te verplaatsen naar een
      andere locatie van het bedrijf.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58f
  - number: 58f.2
    text: |-
      Het in het eerste lid gestelde verbod is niet van toepassing indien de locatie waarheen de productie wordt
      verplaatst sinds 31 december 1986 onafgebroken tot het bedrijf heeft behoord, dan wel indien is voldaan aan
      [artikel 58s][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58s
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58f
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58s
        hoofdstuk: V
        paragraaf: '4'
  - number: 58g.1
    text: |-
      De omvang van het voor een bedrijf geldende pluimveerecht op het tijdstip van inwerkingtreding van
      [artikel 58c][ref1] wordt bepaald overeenkomstig deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58c
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58g
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58c
        hoofdstuk: V
        paragraaf: '2'
  - number: 58g.2
    text: |-
      Voor de toepassing van deze paragraaf geldt 1997 als referentiejaar, tenzij ten aanzien van een daartoe door de
      belanghebbende aangemeld bedrijf 1995 of 1996 als referentiejaar is gekozen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58g
  - number: 58g.3
    text: |-
      In afwijking van het tweede lid kan ten aanzien van een door de belanghebbende daartoe aangemeld bedrijf 1994 als
      referentiejaar worden gekozen indien ten aanzien van dat bedrijf aan elk van de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58g
  - number: 58g.3.a
    text: |-
      de op het bedrijf geproduceerde hoeveelheid meststoffen afkomstig van kippen en kalkoenen in 1994 is ten minste 10%
      groter dan de door deze diersoorten in elk van de jaren 1995, 1996 en 1997 geproduceerde hoeveelheid meststoffen;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58g
  - number: 58g.3.b
    text: |-
      de mestproductie afkomstig van kippen en kalkoenen is in 1995, 1996 of 1997 ten minste 125 kilogram fosfaat en ten
      minste 5% van het met betrekking tot dat jaar geldende mestproductierecht.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58g
  - number: 58h.1
    text: |-
      Het pluimveerecht komt overeen met de in het referentiejaar op het bedrijf geproduceerde hoeveelheid dierlijke
      meststoffen afkomstig van kippen en kalkoenen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58h
  - number: 58h.2
    text: |-
      De in het referentiejaar op het bedrijf geproduceerde hoeveelheid dierlijke meststoffen afkomstig van kippen
      is niet groter dan de som van het grondgebonden mestproductierecht en het niet-gebonden mestproductierecht
      voor varkens en kippen geldend voor dat jaar, verminderd met de in dat jaar geproduceerde hoeveelheid dierlijke
      meststoffen afkomstig van varkens.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58h
  - number: 58h.3
    text: |-
      De in het referentiejaar op het bedrijf geproduceerde hoeveelheid dierlijke meststoffen afkomstig van kalkoenen is
      niet groter dan: - het voor dat jaar geldende niet-gebonden mestproductierecht voor andere diersoorten dan varkens
      en kippen,
        - vermeerderd met het verschil tussen enerzijds de som van het grondgebonden mestproductierecht en het niet-
      gebonden mestproductierecht voor varkens en kippen geldend voor dat jaar en anderzijds de in dat jaar geproduceerde
      hoeveelheid dierlijke meststoffen afkomstig van varkens en kippen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58h
  - number: 58i.1
    text: |-
      Het pluimveerecht van een door samenvoeging van bedrijven ontstaan bedrijf komt, indien de registratie van de
      kennisgeving van verplaatsing met betrekking tot de samenvoeging in het referentiejaar heeft plaatsgevonden,
      overeen met de som van de in dat jaar op de oorspronkelijke bedrijven en het na samenvoeging ontstane bedrijf
      geproduceerde hoeveelheden dierlijke meststoffen afkomstig van kippen en kalkoenen, zoals deze hoeveelheden over
      het gehele jaar zijn gemiddeld.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58i
  - number: 58i.2
    text: |-
      Het pluimveerecht van een door samenvoeging van bedrijven ontstaan bedrijf komt, indien de registratie van de
      kennisgeving van verplaatsing met betrekking tot de samenvoeging na het referentiejaar heeft plaatsgevonden en de
      kennisgeving is gedaan vóór 6 november 1998, overeen met de som van de in het referentiejaar op de oorspronkelijke
      bedrijven geproduceerde hoeveelheden dierlijke meststoffen afkomstig van kippen en kalkoenen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58i
  - number: 58i.3
    text: |-
      Onverminderd het vierde lid wordt de toepassing van dit artikel de hoeveelheid dierlijke meststoffen die op elk
      van de oorspronkelijke bedrijven en op het door samenvoeging ontstane bedrijf is geproduceerd slechts in aanmerking
      genomen tot ten hoogste de overeenkomstig [artikel 58h, tweede en derde lid][ref1], voor het desbetreffende bedrijf
      bepaalde hoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58h
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58i
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58h
        hoofdstuk: V
        paragraaf: '3'
  - number: 58i.4
    text: |-
      Indien het voor een van de oorspronkelijke bedrijven geldende niet-gebonden mestproductierecht tengevolge van de
      registratie van een of meer vóór 6 november 1998 gedane kennisgevingen van verplaatsing en in aanmerking genomen
      de gevolgen voor het niet-gebonden mestproductierecht van wijzigingen van de tot het bedrijf behorende oppervlakte
      landbouwgrond, na het referentiejaar per saldo is vergroot dan wel zou zijn vergroot indien geen samenvoeging had
      plaatsgevonden, wordt voor de toepassing van dit artikel de hoeveelheid dierlijke meststoffen die op het bedrijf is
      geproduceerd verhoogd met de door de belanghebbende bij wijze van melding aangegeven hoeveelheid fosfaat, die ten
      hoogste overeenkomt met de vergroting van het niet-gebonden mestproductierecht van het desbetreffende bedrijf.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58i
  - number: 58j.1
    text: |-
      Indien het voor het bedrijf geldende niet-gebonden mestproductierecht, tengevolge van de registratie van een of
      meer vóór 6 november 1998 gedane kennisgevingen van verplaatsing en in aanmerking genomen de gevolgen voor het
      niet-gebonden mestproductierecht van wijzigingen van de tot het bedrijf behorende oppervlakte landbouwgrond, per
      saldo is vergroot nà het referentiejaar of, indien het bedrijf door samenvoeging is ontstaan, nà de samenvoeging,
      wordt het overeenkomstig [artikel 58h][ref1] of [58i ][ref2]bepaalde pluimveerecht vergroot met de door de
      belanghebbende bij wijze van melding aangegeven hoeveelheid fosfaat, die ten hoogste overeenkomt met de vergroting
      van het niet-gebonden mestproductierecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58h
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58i
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58j
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58h
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58i
        hoofdstuk: V
        paragraaf: '3'
  - number: 58j.2
    text: |-
      Voor de toepassing van dit artikel wordt onder kennisgeving van verplaatsing niet begrepen een kennisgeving van
      verplaatsing met betrekking tot een samenvoeging van bedrijven.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58j
  - number: 58k.1
    text: |-
      De omvang van het pluimveerecht van een daartoe aangemeld bedrijf wordt, in afwijking van de [artikelen 58h][ref1],
      [58i][ref2] en [58j][ref3], bepaald overeenkomstig bij algemene maatregel van bestuur te stellen regels indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58h
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58i
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58j
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58k
    references:
