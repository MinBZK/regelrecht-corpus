  - number: 58an.1
    text: |-
      Voor de toepassing van de [artikelen 58ac, onderdeel a, onder 3°][ref1], 58ad, onderdeel a, onder 3°, [58ae][ref2]
      en [58aka, tweede lid][ref3], wordt de hoeveelheid dierlijke meststoffen die op grond van een mestafzetovereenkomst
      naar een ander bedrijf, een erkende tussenpersoon, een erkende mestverwerker of een erkende exporteur kan worden
      afgevoerd uitsluitend in aanmerking genomen indien is voldaan aan elk van de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ac
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58ae
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58aka
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58an
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ac
        hoofdstuk: V
        paragraaf: '2'
