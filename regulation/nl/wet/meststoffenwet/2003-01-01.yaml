        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0004054
        artikel: 58al
        hoofdstuk: V
        paragraaf: '4'
  - number: 58an.3
    text: |-
      Het eerste lid, onderdeel c in samenhang met de aanhef, geldt niet ingeval de wederpartij die het
      in [artikel 58aj, eerste lid][ref1], of [58ak, eerste lid][ref2], gestelde verbod heeft overtreden
      in het desbetreffende jaar de mestaanvoerruimte zodanig heeft vergroot dat deze ten minste de in
      [artikel 58aj, tweede en derde lid][ref3], onderscheidenlijk [artikel 58ak, tweede en derde lid][ref4], bedoelde
      omvang heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58aj
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58ak
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58aj
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel58ak
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58an
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58aj
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
