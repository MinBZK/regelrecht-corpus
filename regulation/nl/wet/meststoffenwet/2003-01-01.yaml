        hoofdstuk: IV
  - number: '67'
    text: |-
      De ministeriële regelingen bedoeld in [hoofdstuk IV][ref1], behoudens [titel 6][ref2], en in [artikel 59][ref3]
      worden vastgesteld door Onze Minister in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel59
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel67
