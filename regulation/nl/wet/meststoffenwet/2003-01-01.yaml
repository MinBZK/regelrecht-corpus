        artikel: 58m
        hoofdstuk: V
        paragraaf: '3'
  - number: 58o
    text: |-
      Een pluimveerecht kan, onder welke titel dan ook, met inachtneming van [artikel 58p][ref1], geheel of gedeeltelijk
      overgaan naar een ander bedrijf overeenkomstig de [artikelen 58q][ref2] en [58r][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58p
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58q
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58r
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58o
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58p
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58q
        hoofdstuk: V
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004054
        artikel: 58r
        hoofdstuk: V
        paragraaf: '4'
  - number: 58p.1
    text: |-
      Een pluimveerecht, of een gedeelte daarvan, afkomstig van een bedrijf dat geheel of gedeeltelijk is gelegen in
      het ene concentratiegebied kan niet overgaan naar een bedrijf dat geheel of gedeeltelijk is gelegen in het andere
      concentratiegebied.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58p
  - number: 58p.2
    text: |-
      Een pluimveerecht, of een gedeelte daarvan, afkomstig van een bedrijf dat geheel of gedeeltelijk is gelegen
      buiten de concentratiegebieden kan niet overgaan naar een bedrijf dat geheel of gedeeltelijk is gelegen binnen
      een concentratiegebied.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58p
  - number: 58q.1
    text: |-
      De belanghebbende naar wiens bedrijf het pluimveerecht, of een gedeelte daarvan, moet overgaan en de belanghebbende
      van wiens bedrijf het pluimveerecht, of een gedeelte daarvan, afkomstig is, geven van de overgang gezamenlijk
      kennis aan het Bureau Heffingen, met gebruikmaking van een daartoe bestemd, door het Bureau Heffingen op verzoek
      van de belanghebbende ter beschikking gesteld formulier, dat overeenkomstig de op het formulier aangegeven wijze
      volledig en naar waarheid is ingevuld en door beide belanghebbenden is ondertekend.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58q
  - number: 58q.2
    text: |-
      Er kan eerst aanspraak worden gemaakt op het van het andere bedrijf afkomstige pluimveerecht, of een gedeelte
      daarvan, vanaf het tijdstip van registratie van de kennisgeving door het Bureau Heffingen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58q
  - number: 58q.3
    text: |-
      Op het tijdstip van registratie van de kennisgeving vindt een verkleining plaats van het pluimveerecht van het
      bedrijf waarvan het pluimveerecht, of een gedeelte daarvan, afkomstig is, en vindt een vergroting plaats van het
      pluimveerecht van het bedrijf waarnaar het pluimveerecht, of een gedeelte daarvan, overgaat. De verkleining komt
      overeen met de hoeveelheid fosfaat waarop de kennisgeving betrekking heeft. De vergroting komt overeen met de
      hoeveelheid fosfaat waarop de kennisgeving betrekking heeft, verminderd met 25%.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58q
  - number: 58q.4
    text: |-
      Voor het lopende jaar is de in het derde lid bedoelde vergroting, onderscheidenlijk verkleining, van het
      pluimveerecht beperkt tot het deel van het pluimveerecht waarvan de betrokken partijen op het formulier van de
      kennisgeving hebben aangegeven dat dit in dat jaar op het bedrijf waarvan het afkomstig is niet is benut voor de
      productie van dierlijke meststoffen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58q
  - number: 58r.1
    text: |-
      De registratie, bedoeld in [artikel 58q][ref1], vindt niet plaats indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58q
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58r
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58q
        hoofdstuk: V
        paragraaf: '4'
  - number: 58r.1.a
    text: |-
      de kennisgeving betrekking heeft op een grotere hoeveelheid fosfaat dan overeenkomt met het pluimveerecht van het
      bedrijf waarvan het afkomstig is;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58r
  - number: 58r.1.b
    text: |-
      de kennisgeving betrekking heeft op het pluimveerecht van een bedrijf ten aanzien waarvan Onze Minister gebruik
      maakt van de in [artikel 58e, eerste lid][ref1], bedoelde bevoegdheid;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58e
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58r
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58e
        hoofdstuk: V
        paragraaf: '2'
  - number: 58r.1.c
    text: |-
      niet is voldaan aan [artikel 58p][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58p
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58r
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58p
        hoofdstuk: V
        paragraaf: '4'
  - number: 58r.1.d
    text: |-
      het formulier, bedoeld in [artikel 58q, eerste lid][ref1], niet volledig en naar waarheid is ingevuld en door beide
      belanghebbenden is ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58q
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58r
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58q
        hoofdstuk: V
        paragraaf: '4'
  - number: 58r.2
    text: |-
      Indien na de registratie blijkt dat niet aan de in het eerste lid bedoelde voorwaarden voor registratie is voldaan,
      wordt de registratie door het Bureau Heffingen doorgehaald. Met terugwerkende kracht tot het tijdstip van de
      registratie vindt een vergroting plaats van het pluimveerecht van het bedrijf waarvan het pluimveerecht, of een
      gedeelte daarvan, afkomstig was met de hoeveelheid fosfaat waarop de kennisgeving betrekking had, althans voor
      zover de kennisgeving niet betrekking had op een grotere hoeveelheid fosfaat dan overeenkwam met het pluimveerecht
      van dat bedrijf, en vindt een verkleining plaats van het pluimveerecht van het bedrijf waarnaar het pluimveerecht,
      of een gedeelte daarvan, is overgegaan met eenzelfde hoeveelheid fosfaat, verminderd met 25% dan wel, in voorkomend
      geval, het percentage dat ingevolge de krachtens [artikel 58t][ref1] gestelde regels bij de overgang van toepassing
      was.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58t
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58r
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58t
        hoofdstuk: V
        paragraaf: '4'
  - number: 58s.1
    text: |-
      Degene die voornemens is de productie van dierlijke meststoffen afkomstig van kippen of kalkoenen te verplaatsen
      naar een locatie die niet sinds 31 december 1986 onafgebroken tot het bedrijf heeft behoord, geeft daarvan kennis
      aan het Bureau Heffingen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58s
  - number: 58s.2
    text: |-
      De locatie kan eerst voor de productie van dierlijke meststoffen afkomstig van kippen of kalkoenen worden gebruikt
      vanaf het tijdstip van registratie van de kennisgeving door het Bureau Heffingen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58s
  - number: 58s.3
    text: |-
      Er kan geen verplaatsing van de productie van dierlijke meststoffen afkomstig van kippen of kalkoenen plaatsvinden
      naar een locatie die is gelegen in een concentratiegebied, tenzij de locatie waarvandaan de productie van dierlijke
      meststoffen wordt verplaatst is gelegen in hetzelfde gebied.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58s
  - number: 58s.4
    text: |-
      Op het tijdstip van registratie van de kennisgeving wordt het pluimveerecht verminderd met 25%, voor zover dit
      pluimveerecht blijkens de kennisgeving zal worden benut voor de productie van dierlijke meststoffen afkomstig van
      kippen of kalkoenen op de locatie waarheen de productie wordt verplaatst.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58s
  - number: 58s.5
    text: 'De registratie van de kennisgeving vindt niet plaats indien:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58s
  - number: 58s.5.a
    text: de kennisgeving betrekking heeft op een grotere hoeveelheid fosfaat dan overeenkomt met het pluimveerecht;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58s
  - number: 58s.5.b
    text: niet is voldaan aan het derde lid;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58s
  - number: 58s.5.c
    text: |-
      voor de kennisgeving niet gebruik is gemaakt van een daartoe bestemd, door het Bureau Heffingen op verzoek van
      de belanghebbende ter beschikking gesteld formulier, of dat formulier niet overeenkomstig de op het formulier
      aangegeven wijze volledig en naar waarheid is ingevuld en door de belanghebbende is ondertekend.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58s
  - number: 58t.1
    text: |-
      Bij algemene maatregel van bestuur kunnen in afwijking van de in de [artikelen 58q, derde lid][ref1], en
      [58s, vierde lid][ref2], genoemde percentages andere percentages worden vastgesteld. De bij de maatregel
      vastgestelde percentages zijn van toepassing op kennisgevingen van verplaatsing die zijn gedaan na het tijdstip van
      inwerkingtreding van de maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58q
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58s
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58t
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58q
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58s
        hoofdstuk: V
        paragraaf: '4'
  - number: 58t.2
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in het eerste lid kunnen voor verschillende groepen van gevallen
      de percentages verschillend worden vastgesteld. Bij de maatregel kunnen omtrent de groepen van gevallen nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58t
  - number: 58u.1
    text: |-
      In afwijking van [artikel 228 van Boek 3 van het Burgerlijk Wetboek][ref1] kan op pluimveerechten geen pandrecht
      worden gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel228
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '228'
  - number: 58u.2
    text: |-
      Bij ministeriële regeling kan worden bepaald dat alvorens het Bureau Heffingen de in
      [artikel 58q, eerste lid][ref1], of [58s, eerste lid][ref2], bedoelde kennisgeving in behandeling neemt, van deze
      kennisgeving mededeling wordt gedaan aan in die regeling aan te geven derde-belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58q
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58s
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58q
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58s
        hoofdstuk: V
        paragraaf: '4'
  - number: 58u.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de uitvoering van het tweede lid,
      waarbij onder meer kan worden bepaald welke gegevens door het Bureau Heffingen aan de derde-belanghebbenden
      kenbaar worden gemaakt, de periode gedurende welke het Bureau Heffingen de in [artikel 58q, eerste lid][ref1],
      of [58s, eerste lid][ref2], bedoelde kennisgeving niet in behandeling neemt, alsmede de wijze waarop en de
      termijn waarbinnen de in de regeling aangegeven derde-belanghebbenden zich bij het Bureau Heffingen dienen aan te
      melden. Bij de ministeriële regeling kan worden bepaald dat een aanmelding die is gedaan op grond van de krachtens
      [artikel 12, derde lid, van de Wet verplaatsing mestproductie][ref3] gestelde regels tevens in aanmerking wordt
      genomen voor de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58q
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58s
      [ref3]: https://wetten.overheid.nl/BWBR0006285#Artikel12
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58q
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58s
        hoofdstuk: V
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0006285
        artikel: '12'
  - number: 58v.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een kennisgeving als bedoeld in [artikel 58q, eerste lid][ref1],
      of [58s, eerste lid,][ref2] of een aanmelding als bedoeld in [artikel 58u, derde lid][ref3], eerst door het Bureau
      Heffingen in behandeling wordt genomen nadat een daarvoor vastgesteld bedrag is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58q
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58s
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58u
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58v
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58q
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58s
        hoofdstuk: V
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004054
        artikel: 58u
        hoofdstuk: V
        paragraaf: '4'
  - number: 58v.2
    text: |-
      Al naar gelang sprake is van een kennisgeving als bedoeld in [artikel 58q, eerste lid][ref1], van
      een kennisgeving als bedoeld in [artikel 58s, eerste lid][ref2], of van een aanmelding als bedoeld in
      [artikel 58u, derde lid][ref3], kan het bedrag verschillend worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58q
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58s
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58u
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58v
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58q
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58s
        hoofdstuk: V
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004054
        artikel: 58u
        hoofdstuk: V
        paragraaf: '4'
  - number: 58w.1
    text: |-
      In bij ministeriële regeling bepaalde gevallen kan Onze Minister het pluimveerecht van een bedrijf ambtshalve
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58w
  - number: 58w.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de in het eerste lid bedoelde vaststelling.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58w
  - number: 58x
    text: |-
      De belanghebbende kan met gebruikmaking van een daartoe bestemd, door het Bureau Heffingen op verzoek van de
      belanghebbende ter beschikking gesteld formulier, dat overeenkomstig de op het formulier aangegeven wijze volledig
      en naar waarheid is ingevuld en door hem is ondertekend, een kennisgeving van het vervallen, onderscheidenlijk
      gedeeltelijk vervallen, van het pluimveerecht van zijn bedrijf bij het Bureau Heffingen doen. Na registratie van de
      kennisgeving door het Bureau Heffingen is het pluimveerecht nihil, onderscheidenlijk vindt een verkleining van het
      pluimveerecht plaats met de hoeveelheid fosfaat waarop de kennisgeving betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58x
  - number: 58y.1
    text: |-
      Indien [artikel 58c][ref1] op een andere datum dan 1 januari in werking treedt, wordt voor de toepassing van
      dat artikel in het jaar van inwerkingtreding in plaats van «kalenderjaar» gelezen «het vanaf het tijdstip van
      inwerkingtreding van dit artikel resterende deel van het jaar», en wordt in plaats van «pluimveerecht» gelezen:
      pluimveerecht, vermenigvuldigd met het na het tijdstip van inwerkingtreding van artikel 58c in het desbetreffende
      jaar resterende aantal maanden gedeeld door twaalf.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58c
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58y
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58c
        hoofdstuk: V
        paragraaf: '2'
  - number: 58y.2
    text: |-
      Indien artikel 58c op een andere datum dan 1 januari in werking treedt, wordt voor de toepassing van
      [artikel 55, eerste lid][ref1], in het jaar van inwerkingtreding onder uitbreiding van de productie van dierlijke
      meststoffen verstaan: een grotere productie dan het op de dag voorafgaande aan het tijdstip van inwerkingtreding
      van [artikel 58c][ref2] geldende mestproductierecht, dat achtereenvolgens is vermenigvuldigd met het op het
      tijdstip van inwerkingtreding van [artikel 58c][ref3] in het desbetreffende jaar verstreken aantal maanden gedeeld
      door twaalf, en is vermeerderd met het op 31 december van het desbetreffende jaar geldende mestproductierecht dat
      is vermenigvuldigd met het sedert het tijdstip van inwerkingtreding van artikel 58c in het desbetreffende jaar
      verstreken aantal maanden gedeeld door twaalf.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58c
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58c
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58y
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '55'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58c
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004054
        artikel: 58c
        hoofdstuk: V
        paragraaf: '2'
  - number: 58y.3
    text: |-
      Voor de toepassing van het tweede lid en voor de toepassing van de [artikelen 56][ref1],
      [58k, tweede lid][ref2], en [58l][ref3] worden, ingeval in het desbetreffende kalenderjaar wijzigingen in
      de tot het bedrijf behorende oppervlakte landbouwgrond hebben plaatsgevonden of verplaatsing als bedoeld in
      [artikel 1 van de Wet verplaatsing mestproductie][ref4] heeft plaatsgevonden, de gevolgen daarvan voor de omvang
      van het in die bepalingen bedoelde mestproductierecht bepaald overeenkomstig de regels van [artikel 55][ref5] en
      overeenkomstig de regels gesteld bij of krachtens de [Wet verplaatsing mestproductie][ref6], alsof het de bepaling
      van het op de eerste dag van een kalenderjaar geldende mestproductierecht zou betreffen en de bedoelde wijzigingen
      of verplaatsing zich zouden hebben voorgedaan in het voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58l
      [ref4]: https://wetten.overheid.nl/BWBR0006285#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel55
      [ref6]: https://wetten.overheid.nl/BWBR0006285
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58y
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '56'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58k
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004054
        artikel: 58l
        hoofdstuk: V
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0006285
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0004054
        artikel: '55'
        hoofdstuk: V
      - id: ref6
        bwb_id: BWBR0006285
  - number: 58z
    text: 'Voor de toepassing van deze titel:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58z
  - number: 58z.a
    text: wordt de hoeveelheid dierlijke meststoffen uitgedrukt in kilogrammen stikstof;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58z
  - number: 58z.b
    text: worden de dierlijke meststoffen afkomstig van de diersoort schaap niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58z
  - number: 58aa
    text: |-
      Het is verboden op een bedrijf in een kalenderjaar een grotere hoeveelheid dierlijke meststoffen te produceren dan
      de mestplaatsingsruimte van dat bedrijf in dat jaar.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58aa
  - number: 58ab
    text: |-
      De hoeveelheid geproduceerde dierlijke meststoffen, bedoeld in [artikel 58aa][ref1], wordt vastgesteld op basis van
      het gemiddelde aantal in het desbetreffende kalenderjaar gehouden, uitgeschaarde of tijdelijk elders ter weiding
      ondergebrachte dieren van de onderscheiden diercategorieën en op basis van de forfaitaire productienormen voor de
      onderscheiden diercategorieën, uitgedrukt in kilogrammen stikstof per dier per jaar, die voor het desbetreffende
      jaar zijn opgenomen in [bijlage E][ref2] bij deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58aa
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ab
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58aa
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004054
  - number: 58ac
    text: |-
      De mestplaatsingsruimte, bedoeld in [artikel 58aa][ref1], in 2002 wordt bepaald door achtereenvolgens:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58aa
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ac
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58aa
        hoofdstuk: V
        paragraaf: '2'
  - number: 58ac.a
    text: 'bij elkaar op te tellen:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ac
  - number: 58ac.a.1°
    text: |-
      per hectare van de gemiddeld in 2002 tot het bedrijf behorende oppervlakte landbouwgrond: - 300 kilogram stikstof
      voor grasland,
        - 210 kilogram stikstof voor bouwland waarop maïs wordt geteeld en
        - 170 kilogram stikstof voor het overige bouwland en voor braakland;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ac
  - number: 58ac.a.2°
    text: 80 kilogram stikstof per hectare van de gemiddeld in 2002 tot het bedrijf behorende oppervlakte natuurterrein;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ac
  - number: 58ac.a.3°
    text: |-
      de hoeveelheid op het bedrijf geproduceerde of aangevoerde dierlijke meststoffen die in 2002 op grond van een
      mestafzetovereenkomst naar een ander bedrijf of naar een door Onze Minister erkende tussenpersoon kan worden
      afgevoerd;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ac
  - number: 58ac.b
    text: |-
      de overeenkomstig onderdeel a berekende hoeveelheid stikstof te verminderen met de hoeveelheid dierlijke
      meststoffen waarvoor in 2002 op grond van een mestafzetovereenkomst een verplichting tot aanvoer op het bedrijf
      geldt.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ac
  - number: 58ad
    text: |-
      De mestplaatsingsruimte, bedoeld in [artikel 58aa][ref1], in 2003 en in de daarop volgende jaren wordt bepaald
      door achtereenvolgens:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58aa
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ad
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58aa
        hoofdstuk: V
        paragraaf: '2'
  - number: 58ad.a
    text: 'bij elkaar op te tellen:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ad
  - number: 58ad.a.1°
    text: |-
      per hectare van de gemiddeld in het desbetreffende kalenderjaar tot het bedrijf behorende oppervlakte
      landbouwgrond: '- 250 kilogram stikstof voor grasland en'
        - 170 kilogram stikstof voor bouwland en braakland;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ad
  - number: 58ad.a.2°
    text: |-
      80 kilogram stikstof per hectare van de gemiddeld in het desbetreffende kalenderjaar tot het bedrijf behorende
      oppervlakte natuurterrein;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ad
  - number: 58ad.a.3°
    text: |-
      de hoeveelheid op het bedrijf geproduceerde of aangevoerde dierlijke meststoffen die in het desbetreffende jaar op
      grond van een mestafzetovereenkomst naar een ander bedrijf of naar een door Onze Minister erkende tussenpersoon kan
      worden afgevoerd;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ad
  - number: 58ad.b
    text: |-
      de overeenkomstig onderdeel a berekende hoeveelheid stikstof te verminderen met de hoeveelheid dierlijke
      meststoffen waarvoor in het desbetreffende jaar op grond van een mestafzetovereenkomst een verplichting tot aanvoer
      op het bedrijf geldt.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ad
  - number: 58ae.1
    text: |-
      Het in [artikel 58aa][ref1] gestelde verbod geldt niet voor die hoeveelheid dierlijke meststoffen waarvan de
      producent kan aantonen dat deze:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58aa
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58aa
        hoofdstuk: V
        paragraaf: '2'
  - number: 58ae.1.a
    text: op grond van een mestafzetovereenkomst is afgevoerd naar een door Onze Minister erkende mestverwerker;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.1.b
    text: |-
      in de vorm van onbewerkte, ingedikte of gedroogde pluimveemest op grond van een mestafzetovereenkomst is afgevoerd
      naar een door Onze Minister erkende exporteur; of
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.1.c
    text: door de producent, die daartoe door Onze Minister is erkend, op zijn bedrijf,
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.1.c.1°
    text: |-
      onomkeerbaar is verwerkt tot producten die niet als dierlijke meststoffen of overige organische meststoffen kunnen
      worden aangemerkt of tot samengestelde meststoffen die fosfor en stikstof dan wel ten minste één van deze elementen
      en kalium bevatten en voldoen aan de eisen gesteld in [richtlijn nr. 76/116/EEG](31976L0116) van de Raad van de
      Europese Unie van 18 december 1975 betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake
      meststoffen (PbEG 1976, L 24),
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.1.c.2°
    text: |-
      is be- of verwerkt tot dierlijke meststoffen met een droge-stofgehalte van ten minste 86% en vervolgens
      rechtstreeks of door tussenkomst van een derde buiten Nederland is afgezet, of
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.1.c.3°
    text: |-
      anderszins is be- of verwerkt en vervolgens rechtstreeks buiten Nederland is afgezet of is afgevoerd naar een
      erkende exporteur.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld voor de toepassing van het eerste
      lid ten aanzien van door de producent op zijn bedrijf geproduceerde dierlijke meststoffen. Deze betreffen in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.2.a
    text: |-
      de termijn waarbinnen de meststoffen worden afgevoerd naar de erkende mestverwerker of erkende exporteur, danwel
      door de producent na be- of verwerking rechtstreeks of door tussenkomst van een derde worden afgezet buiten
      Nederland, en de wijze waarop deze afvoer of afzet wordt aangetoond;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.2.b
    text: |-
      de be- of verwerking van de meststoffen door de producent, met inbegrip van de bedrijfsmiddelen met behulp waarvan
      en de termijn waarbinnen dit geschiedt, en de wijze waarop de be- of verwerking wordt aangetoond.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorwaarden gesteld voor de erkenning door Onze Minister van
      een producent, een mestverwerker of een exporteur. Deze betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.3.a
    text: de voorgenomen be- of verwerking en afzet;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.3.b
    text: de bedrijfsmiddelen;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.3.c
    text: |-
      de mate waarin wordt gewaarborgd dat de op grond van een mestafzetovereenkomst op het bedrijf of de onderneming van
      de mestverwerker aangevoerde dierlijke meststoffen op overeenkomstige wijze worden be- of verwerkt en vervolgens
      worden afgezet of afgevoerd als in het eerste lid, onderdeel c, is bepaald;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.3.d
    text: |-
      de mate waarin wordt gewaarborgd dat de dierlijke meststoffen, bedoeld in het eerste lid, die zijn be- of verwerkt
      overeenkomstig onderdeel c van dat artikellid, onderscheidenlijk in onderdeel c, tijdig door de producent,
      onderscheidenlijk de mestverwerker worden be- of verwerkt, en, dat deze meststoffen, voor zover deze niet
      onomkeerbaar zijn verwerkt tot producten die niet als dierlijke meststoffen of overige organische meststoffen
      kunnen worden aangemerkt of tot samengestelde meststoffen die fosfor en stikstof dan wel ten minsteéén van deze
      elementen en kalium bevatten en voldoen aan de eisen gesteld in [richtlijn nr. 76/116/EEG](31976L0116) van de Raad
      van de Europese Unie van 18 december 1975 betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten
      inzake meststoffen (PbEG 1976, L 24), tijdig buiten Nederland worden afgezet;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.3.e
    text: |-
      de zekerheid dat de exporteur de op zijn bedrijf aangevoerde dierlijke meststoffen tijdig en rechtstreeks buiten
      Nederland afzet;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.3.f
    text: |-
      de zekerheid dat, ingeval de mestverwerker of exporteur na erkenning zijn verplichtingen jegens de producent
      van de dierlijke meststoffen niet kan nakomen, diens verplichtingen door een andere erkende mestverwerker,
      onderscheidenlijk exporteur, worden nagekomen of schadevergoeding wordt geboden.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.4
    text: |-
      Bij of krachtens de maatregel worden aan de erkenning door Onze Minister van een producent, van een mestverwerker
      en van een exporteur voorwaarden en beperkingen verbonden. Deze betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.4.a
    text: voortdurende voldoening aan de voorwaarden, bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.4.b
    text: |-
      be- of verwerking van de dierlijke meststoffen door de producent of mestverwerker overeenkomstig de wijze en
      binnen de termijn, voorgeschreven bij of krachtens de maatregel, en de wijze waarop deze be- of verwerking wordt
      aangetoond;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.4.c
    text: |-
      afzet van de meststoffen die niet onomkeerbaar zijn verwerkt tot producten die niet als dierlijke meststoffen of
      overige organische meststoffen kunnen worden aangemerkt buiten Nederland, de termijn waarbinnen dit geschiedt en de
      wijze waarop dit wordt aangetoond;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de maximum hoeveelheid dierlijke
      meststoffen tot de afname waarvan de mestverwerker of exporteur zich bij mestafzetovereenkomst kan verplichten.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58ae.6
    text: Door Onze Minister kunnen aan een erkenning verdere beperkingen en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ae
  - number: 58af.1
    text: |-
      Het is verboden op een bedrijf op enig moment dierlijke meststoffen te produceren in een omvang die op jaarbasis
      groter is dan de mestplaatsingsruimte van dat bedrijf op het desbetreffende moment, vermeerderd met 15%.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58af
  - number: 58af.2
    text: |-
      Indien ten minste 50% van de op enig moment op een bedrijf geproduceerde dierlijke meststoffen afkomstig is van
      dieren van een diercategorie die in [bijlage E][ref1] bij deze wet wordt aangeduid met nummer 200, 201, 202, 210,
      300, 301, 310, 311, 312, 800, 801, of 951 geldt in afwijking van het in het eerste lid genoemde percentage een
      percentage van 30.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58af
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 58af.3
    text: |-
      Voor de toepassing van het eerste lid worden niet in aanmerking genomen de op het desbetreffende moment op het
      bedrijf geproduceerde dierlijke meststoffen afkomstig van dieren van een diercategorie die in [bijlage E][ref1] bij
      deze wet wordt aangeduid met nummer 600, 601, 700, 701, 702, 750, 751, 752, 900, 901, 902 of 903.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58af
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 58ag
    text: |-
      De omvang van de productie van dierlijke meststoffen op jaarbasis, bedoeld in [artikel 58af][ref1], wordt
      vastgesteld op basis van het aantal op het desbetreffende moment gehouden, uitgeschaarde of tijdelijk elders ter
      weiding ondergebrachte dieren van de onderscheiden diercategorieën en op basis van de forfaitaire productienormen
      voor de onderscheiden diercategorieën, uitgedrukt in kilogrammen stikstof per dier per jaar, die voor het
      desbetreffende jaar zijn opgenomen in [bijlage E][ref2] bij deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58af
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ag
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58af
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004054
  - number: 58ah
    text: |-
      De mestplaatsingsruimte, bedoeld in [artikel 58af][ref1], op enig moment in 2002 wordt bepaald door
      achtereenvolgens:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58af
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ah
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58af
        hoofdstuk: V
        paragraaf: '3'
  - number: 58ah.a
    text: 'bij elkaar op te tellen:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ah
  - number: 58ah.a.1°
    text: |-
      per hectare van de op dat moment tot het bedrijf behorende oppervlakte landbouwgrond: - 300 kilogram stikstof voor
      grasland,
        - 210 kilogram stikstof voor bouwland waarop maïs wordt geteeld en
        - 170 kilogram stikstof voor het overige bouwland en braakland;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ah
  - number: 58ah.a.2°
    text: 80 kilogram stikstof per hectare van de op dat moment tot het bedrijf behorende oppervlakte natuurterrein;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ah
  - number: 58ah.a.3°
    text: |-
      de hoeveelheid op het bedrijf geproduceerde of aangevoerde dierlijke meststoffen die in 2002 op grond van een
      vóór dat moment gesloten mestafzetovereenkomst naar een ander bedrijf of naar een door Onze Minister erkende
      tussenpersoon kan worden afgevoerd;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ah
  - number: 58ah.a.4°
    text: |-
      de hoeveelheid op het bedrijf geproduceerde of aangevoerde dierlijke meststoffen die in 2002 op grond van een vóór
      dat moment gesloten mestafzetovereenkomst naar een erkende exporteur of erkende mestbe- ofverwerker kan worden
      afgevoerd;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ah
  - number: 58ah.a.5°
    text: de hoeveelheid dierlijke meststoffen waarvoor de erkende producent voor het desbetreffende kalenderjaar is erkend;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ah
  - number: 58ah.b
    text: |-
      de overeenkomstig onderdeel a berekende hoeveelheid stikstof te verminderen met de hoeveelheid dierlijke
      meststoffen waarvoor in 2002 op grond van een vóór dat moment gesloten mestafzetovereenkomst een verplichting tot
      aanvoer op het bedrijf geldt.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ah
  - number: 58ai
    text: |-
      De mestplaatsingsruimte, bedoeld in [artikel 58af][ref1], op enig moment in 2003 of de daarop volgende jaren wordt
      bepaald door achtereenvolgens:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58af
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ai
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58af
        hoofdstuk: V
        paragraaf: '3'
  - number: 58ai.a
    text: 'bij elkaar op te tellen:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ai
  - number: 58ai.a.1°
    text: |-
      per hectare van de op dat moment tot het bedrijf behorende oppervlakte landbouwgrond: - 250 kilogram stikstof voor
      grasland en
        - 170 kilogram stikstof voor bouwland en braakland;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ai
  - number: 58ai.a.2°
    text: 80 kilogram stikstof per hectare van de op dat moment tot het bedrijf behorende oppervlakte natuurterrein;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ai
  - number: 58ai.a.3°
    text: |-
      de hoeveelheid op het bedrijf geproduceerde of aangevoerde dierlijke meststoffen die in het desbetreffende jaar op
      grond van een vóór dat moment gesloten mestafzetovereenkomst naar een ander bedrijf of naar een door Onze Minister
      erkende tussenpersoon kan worden afgevoerd;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ai
  - number: 58ai.a.4°
    text: |-
      de hoeveelheid op het bedrijf geproduceerde of aangevoerde dierlijke meststoffen die in het desbetreffende jaar
      op grond van een vóór dat moment gesloten mestafzetovereenkomst naar een erkende exporteur of erkende mestbe- of
      -verwerker kan worden afgevoerd;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ai
  - number: 58ai.a.5°
    text: de hoeveelheid dierlijke meststoffen waarvoor de erkende producent voor het desbetreffende kalenderjaar is erkend;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ai
  - number: 58ai.b
    text: |-
      de overeenkomstig onderdeel a berekende hoeveelheid stikstof te verminderen met de hoeveelheid dierlijke
      meststoffen waarvoor in het desbetreffende jaar op grond van een vóór dat moment gesloten mestafzetovereenkomst een
      verplichting tot aanvoer op het bedrijf geldt.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ai
  - number: 58aj.1
    text: |-
      Het is verboden zich bij mestafzetovereenkomst te verplichten om in een kalenderjaar, of gedeelte daarvan, een
      grotere hoeveelheid dierlijke meststoffen op een bedrijf aan te voeren dan de mestaanvoerruimte van dat bedrijf.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58aj
  - number: 58aj.2
    text: |-
      De mestaanvoerruimte, bedoeld in het eerste lid, is de mestaanvoerruimte van het bedrijf op het tijdstip met
      ingang waarvan in het desbetreffende jaar op grond van de mestafzetovereenkomst de aanvoer van meststoffen kan
      plaatsvinden. Bij gebreke van een in de mestafzetovereenkomst overeengekomen tijdstip geldt als zodanig 1 januari
      van het desbetreffende jaar.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58aj
  - number: 58aj.3
    text: |-
      De mestaanvoerruimte van een bedrijf op het in het tweede lid bedoelde tijdstip wordt bepaald overeenkomstig
      [artikel 58ah][ref1], indien het tijdstip in 2002 is gelegen, en overeenkomstig [artikel 58ai][ref2], indien het
      tijdstip in 2003 of de daarop volgende jaren is gelegen, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ah
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58ai
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58aj
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ah
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58ai
        hoofdstuk: V
        paragraaf: '3'
  - number: 58aj.3.a
    text: |-
      de hoeveelheid stikstof berekend overeenkomstig [artikel 58ah, onderdeel a, onder 1° en 2°][ref1],
      onderscheidenlijk [58ai, onderdeel a, onder 1° en 2°][ref2], achtereenvolgens wordt vermenigvuldigd met het op
      dat tijdstip resterende aantal maanden van het desbetreffende jaar en wordt gedeeld door twaalf, en


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ah
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58ai
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58aj
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ah
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58ai
        hoofdstuk: V
        paragraaf: '3'
  - number: 58aj.3.b
    text: |-
      de hoeveelheid stikstof, bedoeld in [artikel 58ah, onderdeel b][ref1], onderscheidenlijk [58ai, onderdeel b][ref2],
      uitsluitend in mindering wordt gebracht voor zover deze hoeveelheid groter is dan het verschil tussen enerzijds de
      hoeveelheid stikstof berekend overeenkomstig [artikel 58ah, onderdeel a, onder 1° en 2°][ref3], onderscheidenlijk
      [58ai, onderdeel a, onder 1° en 2°][ref4], en anderzijds de hoeveelheid stikstof berekend overeenkomstig
      onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ah
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58ai
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58ah
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel58ai
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58aj
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ah
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58ai
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004054
        artikel: 58ah
        hoofdstuk: V
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0004054
        artikel: 58ai
        hoofdstuk: V
        paragraaf: '3'
  - number: 58ak.1
    text: |-
      Het is verboden in een kalenderjaar, na het tijdstip met ingang waarvan op grond van een mestafzetovereenkomst
      een verplichting tot het aanvoeren van dierlijke meststoffen op een bedrijf geldt, de tot het bedrijf behorende
      oppervlakte landbouwgrond of natuurterrein te verkleinen, of de teelt van de landbouwgrond te wijzigen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ak
  - number: 58ak.2
    text: |-
      Het in het eerste lid gestelde verbod geldt niet indien na de verkleining van de oppervlakte of wijziging van de
      teelt, een mestaanvoerruimte resteert die ten minste zo groot is als de hoeveelheid dierlijke meststoffen waarvoor
      op grond van de mestafzetovereenkomst een verplichting tot aanvoer op het bedrijf geldt.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ak
  - number: 58ak.3
    text: |-
      De mestaanvoerruimte, bedoeld in het tweede lid, wordt berekend overeenkomstig [artikel 58aj, derde lid][ref1], op
      basis van de na de verkleining van de oppervlakte of wijziging van de teelt aanwezige oppervlakte en teelt.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58aj
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ak
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58aj
        hoofdstuk: V
        paragraaf: '4'
  - number: 58aka.1
    text: |-
      Het is de erkende tussenpersoon verboden zich bij mestafzetovereenkomst te verplichten in een kalenderjaar een
      grotere hoeveelheid dierlijke meststoffen aan te voeren dan de bij de verlening van de erkenning vastgestelde
      hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58aka
  - number: 58aka.2
    text: |-
      De bij verlening van de erkenning vastgestelde hoeveelheid dierlijke meststoffen is ten hoogste de hoeveelheid
      die de tussenpersoon in het desbetreffende jaar op grond van vóór indiening van de aanvraag om erkenning gesloten
      mestafzetovereenkomsten naar een bedrijf, een erkende mestverwerker of een erkende exporteur kan afvoeren.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58aka
  - number: 58aka.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorwaarden gesteld voor de erkenning door Onze
      Minister van een tussenpersoon en worden nadere voorwaarden en beperkingen aan de erkenning verbonden. Deze
      betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58aka
  - number: 58aka.3.a
    text: |-
      de verplichting om de in een mestafzetovereenkomst met een erkende mestverwerker of erkende exporteur
      overeengekomen hoeveelheid dierlijke meststoffen daadwerkelijk naar deze mestverwerker of exporteur af te voeren
      binnen de bij of krachtens de maatregel bepaalde termijn en om zulks aannemelijk te maken op de bij of krachtens de
      maatregel bepaalde wijze;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58aka
  - number: 58aka.3.b
    text: |-
      de zekerheid dat, ingeval de tussenpersoon na verlening van de erkenning zijn verplichtingen jegens de producent
      van de dierlijke meststoffen niet kan nakomen, diens verplichtingen door een andere erkende tussenpersoon of
      door een erkende mestverwerker of erkende exporteur worden nagekomen, dan wel schadevergoeding wordt geboden.
      De zekerheid kan door de tussenpersoon worden geboden door aansluiting bij een waarborgfonds dat voldoet aan
      bij of krachtens de maatregel te stellen eisen, dan wel op een andere, bij of krachtens de maatregel geregelde,
      gelijkwaardige wijze.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58aka
  - number: 58aka.4
    text: Door Onze Minister kunnen aan een erkenning verdere beperkingen en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58aka
  - number: 58al
    text: |-
      Het is de erkende exporteur of erkende mestverwerker verboden zich bij mestafzetovereenkomst te
      verplichten in een kalenderjaar een grotere hoeveelheid dierlijke meststoffen aan te voeren dan de in
      [artikel 58ae, vijfde lid][ref1], bedoelde hoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ae
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58al
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ae
        hoofdstuk: V
        paragraaf: '2'
  - number: 58am
    text: |-
      Voor de toepassing van de [artikelen 58ac, onderdeel a, onder 1° en 2°][ref1],
      [58ad, onderdeel a, onder 1° en 2°][ref2], [58ah, onderdeel a, onder 1° en 2°][ref3], en
      [58ai, onderdeel a, onder 1° en 2°][ref4], en voor de toepassing van deze bepalingen in samenhang met de
      [artikelen 58aj, derde lid][ref5], en [58ak, derde lid][ref6], worden de tot het bedrijf behorende oppervlakte
      landbouwgrond, onderscheiden naar grasland, bouwland beteeld met maïs, ander bouwland en braakland, en de tot het
      bedrijf behorende oppervlakte natuurterrein uitsluitend in aanmerking genomen voor zover de landbouwgrond of het
      natuurterrein overeenkomstig bij ministeriële regeling gestelde regels bij het in die regeling genoemde orgaan is
      aangemeld en deze melding daadwerkelijk door dat orgaan is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ac
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58ad
