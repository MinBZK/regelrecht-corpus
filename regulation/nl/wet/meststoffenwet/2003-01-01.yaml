  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder bedrijf mede verstaan: een op het Nederlands grondgebied
      gelegen deel van een in het buitenland gevestigd bedrijf, waarop dierlijke meststoffen worden geproduceerd of
      waarop dierlijke meststoffen, overige organische meststoffen of andere meststoffen worden aangevoerd.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: '1.3'
    text: |-
      In de [hoofdstukken III][ref1], [IV][ref2] en [V, titel 3][ref3], en de daarop berustende bepalingen, alsmede in
      de op de [artikelen 59, eerste lid][ref4], en [61][ref5] berustende bepalingen voor zover deze betrekking hebben
      op onderwerpen geregeld in of krachtens de [hoofdstukken III][ref6], [IV][ref7] en [V, titel 3][ref8], wordt onder
      tot het bedrijf behorende oppervlakte landbouwgrond mede verstaan: in Nederland gelegen oppervlakte landbouwgrond,
      daaronder niet begrepen de oppervlakte waarop zich de bedrijfsgebouwen en daarbij behorende voorzieningen bevinden,
      die tot het bedrijf behoort op grond van een door de grondkamer geregistreerde, onderscheidenlijk goedgekeurde
      pachtovereenkomst, als bedoeld in de [artikelen 70f, eerste lid][ref9], onderscheidenlijk [12, derde lid][ref10],
      of[ 70f, vijfde lid, van de Pachtwet][ref11], en die in het kader van een normale bedrijfsvoering bij dat bedrijf
      in gebruik is.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0004054#HoofdstukV
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel59
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel61
      [ref6]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIII
      [ref7]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref8]: https://wetten.overheid.nl/BWBR0004054#HoofdstukV
      [ref9]: https://wetten.overheid.nl/BWBR0002269#Artikel70f
      [ref10]: https://wetten.overheid.nl/BWBR0002269#Artikel12
      [ref11]: https://wetten.overheid.nl/BWBR0002269#Artikel70f
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
    references:
      - id: ref1
