  - number: 58aq.1
    text: |-
      Bij ministeriële regeling kunnen voor de toepassing van de [artikelen 58ab][ref1] en [58ag][ref2] in plaats van de
      in [bijlage E][ref3] bij deze wet opgenomen forfaitaire productienormen lagere productienormen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ab
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58ag
      [ref3]: https://wetten.overheid.nl/BWBR0004054
