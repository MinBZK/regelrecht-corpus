        hoofdstuk: V
        paragraaf: '3'
  - number: 58k.1.a
    text: |-
      in de periode van 1 januari 1994 tot en met 5 november 1998 ten behoeve van een vergroting van het aantal op
      het bedrijf te houden kippen of kalkoenen met ten minste 10% ten opzichte van het aantal dat zou kunnen worden
      gehouden indien het pluimveerecht zou worden bepaald overeenkomstig [artikel 58h][ref1] dan wel in voorkomend geval
      [artikel 58i][ref2], - door het bevoegd gezag een milieuvergunning is verleend,
        - bij het bevoegd gezag een milieuvergunning en een bouwvergunning als bedoeld in artikel 40 van de Woningwet zijn
      aangevraagd, dan wel
        - bij het bevoegd gezag overeenkomstig [artikel 4 van het Besluit melkrundveehouderijen milieubeheer][ref3]
      of [artikel 3 van het Besluit akkerbouwbedrijven milieubeheer][ref4] een of meer meldingen zijn gedaan en
      bouwvergunningen zijn aangevraagd, en uiterlijk op 1 januari 2004 extra huisvesting is gebouwd om alle kippen of
      kalkoenen die ingevolge het op het tijdstip van inwerkingtreding van [artikel 58c][ref5] geldende pluimveerecht
      kunnen worden gehouden, te kunnen huisvesten overeenkomstig de voor het bedrijf geldende milieuvergunning
      dan wel in voorkomend geval overeenkomstig het [Besluit melkrundveehouderijen milieubeheer][ref6] of het
      [Besluit akkerbouwbedrijven milieubeheer][ref7];


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58h
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58i
      [ref3]: https://wetten.overheid.nl/BWBR0005158#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0006449#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel58c
      [ref6]: https://wetten.overheid.nl/BWBR0005158
      [ref7]: https://wetten.overheid.nl/BWBR0006449
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58k
