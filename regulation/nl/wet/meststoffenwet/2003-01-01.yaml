  - number: 58ap
    text: |-
      Indien het Bureau Heffingen een afschrift van de mestafzetovereenkomst na het tijdstip,
      bedoeld in [artikel 58aj, tweede lid][ref1], heeft ontvangen, geldt voor de toepassing van de
      [artikelen 58aj, tweede en derde lid][ref2], [58ak][ref3] en [58an, vijfde lid][ref4], de datum van ontvangst door
      het Bureau Heffingen in afwijking van het in de mestafzetovereenkomst overeengekomen tijdstip als het tijdstip met
      ingang waarvan de aanvoer van meststoffen kan plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58aj
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58aj
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58ak
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel58an
