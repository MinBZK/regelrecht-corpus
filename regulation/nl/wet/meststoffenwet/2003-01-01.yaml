  - number: '1.4'
    text: |-
      Voor de toepassing van het eerste lid, onderdelen q en w, en het derde lid wordt grond ten aanzien waarvan een in
      die bepalingen bedoelde pachtovereenkomst is gesloten niet eerder tot het bedrijf gerekend dan met ingang van de
      datum waarop de grondkamer de desbetreffende overeenkomst heeft goedgekeurd, onderscheidenlijk geregistreerd.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
  - number: '1.5'
    text: |-
      In [hoofdstuk IV][ref1] en de daarop berustende bepalingen wordt in zoverre in afwijking van het eerste lid,
      onderdeel d, onder meststoffen verstaan: dierlijke meststoffen, overige organische meststoffen en andere
      meststoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        hoofdstuk: IV
  - number: 1a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld waaraan landbouwgrond moet
      voldoen om te worden aangemerkt als tot het bedrijf behorende oppervlakte landbouwgrond.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1a
  - number: 1a.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de gevallen waarin en de voorwaarden waaronder
      voor de toepassing van de [hoofdstukken III][ref1], [IV][ref2] en [V, titel 3][ref3], en de daarop berustende
      bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0004054#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004054
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004054
        hoofdstuk: V
  - number: 1a.2.a
    text: |-
      in afwijking van [artikel 1, eerste lid, onderdeel q, en derde lid][ref1], ook in de grensgebieden gelegen
      landbouwgrond buiten Nederland of landbouwgrond die anders dan op grond van één van de in dat artikel genoemde
      titels in gebruik is, tot de tot het bedrijf behorende oppervlakte landbouwgrond wordt gerekend;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
        hoofdstuk: I
  - number: 1a.2.b
    text: |-
      ook natuurterrein dat anders dan op grond van één van de in [artikel 1, eerste lid, onderdeel w][ref1], genoemde
      titels in gebruik is, tot de tot het bedrijf behorende oppervlakte natuurterrein wordt gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
        hoofdstuk: I
  - number: '2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt geen rekening gehouden met handelingen waarvan,
      op grond van de omstandigheid dat zij geen wezenlijke verandering van feitelijke verhoudingen hebben ten doel gehad
      of op grond van andere bepaalde feiten en omstandigheden, moet worden aangenomen dat zij achterwege zouden zijn
      gebleven, indien daarmee niet de toepassing van deze wet voor het vervolg geheel of ten dele onmogelijk zou worden
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel2
  - number: '3.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in het belang van de bevordering van de deugdelijkheid voor
      het doel waarvoor meststoffen zijn bestemd, alsmede in het belang van de bescherming van de bodem, het verhandelen
      van meststoffen worden verboden indien deze meststoffen niet voldoen aan de bij of krachtens die maatregel gestelde
      eisen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel3
  - number: 3.1.a
    text: |-
      de hoedanigheid, de aard, de gehalten aan bepaalde stoffen en verdere samenstelling, het gewicht en de verpakking
      van meststoffen;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel3
  - number: 3.1.b
    text: de benaming, de gebruiksaanwijzing en andere vermeldingen voor meststoffen;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel3
  - number: 3.1.c
    text: de wijze waarop de vermeldingen van meststoffen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel3
  - number: '3.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur, kunnen, in het belang van de bevordering van de deugdelijkheid
      voor het doel waarvoor dierlijke meststoffen zijn bestemd, alsmede in het belang van een doelmatige afvoer daarvan,
      regels worden gesteld aan de kwaliteit van diervoeders.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel3
  - number: '4'
    text: |-
      Het is verboden een produkt, dat blijkens zijn aanduiding of anderszins kennelijk bestemd is om als meststof te
      worden gebruikt, te verhandelen, indien dat produkt niet voldoet aan de krachtens [artikel 3][ref1] met betrekking
      tot meststoffen gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel3
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '3'
        hoofdstuk: II
  - number: '5.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur bedoeld in [artikel 3][ref1] kan het verhandelen als meststof van
      produkten die geheel of gedeeltelijk uit zuiveringsslib, havenslib, compost of andere soortgelijke voor bemesting
      bruikbare produkten bestaan, zonder vergunning verleend door Onze Minister of door een bij de maatregel aangewezen
      overheidsorgaan, worden verboden. Daarbij kunnen tevens regelen worden gesteld met betrekking tot het verlenen,
      weigeren of intrekken van een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel3
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '3'
        hoofdstuk: II
  - number: '5.2'
    text: |-
      Aan een vergunning, als bedoeld in het vorige lid, kunnen voorschriften worden verbonden. Zij kan onder beperkingen
      worden verleend. Tot de voorschriften kunnen onder meer behoren:
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel5
  - number: 5.2.a
    text: |-
      de verplichting om van monsters, welke op een daarbij aangegeven wijze zijn genomen, analyses te verrichten ten
      aanzien van de hoedanigheid, de aard, de gehalten aan bepaalde stoffen en verdere samenstelling van de meststof;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel5
  - number: 5.2.b
    text: |-
      de verplichting de uitkomsten van de onder a bedoelde analyses ter beschikking te stellen aan afnemers van de
      betrokken meststof of aan te wijzen overheidsorganen;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel5
  - number: 5.2.c
    text: |-
      een verbod de meststof af te leveren aan bepaalde, bij het voorschrift aangewezen gebruikers of groepen van
      gebruikers, in grotere dan bij het voorschrift vastgestelde hoeveelheden;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel5
  - number: 5.2.d
    text: |-
      de verplichting om de naleving van de onder c bedoelde voorschriften te staven met bij het voorschrift vastgestelde
      bewijsstukken;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel5
  - number: 5.2.e
    text: |-
      voorschriften inzake het voeren van een administratie, welke worden gesteld om de naleving van de onder c bedoelde
      voorschriften genoegzaam te kunnen controleren.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel5
  - number: '5.3'
    text: |-
      De aan een vergunning, als bedoeld in het eerste lid, verbonden voorschriften en de beperkingen waaronder zij is
      verleend, kunnen worden gewijzigd, aangevuld of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel5
  - number: '6.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in het belang van een doelmatige afvoer van mestoverschotten
      regelen worden gesteld met betrekking tot het in voorraad hebben, verwerken, vernietigen, vervoeren en verhandelen
      van dierlijke meststoffen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde regelen kunnen onder meer inhouden een verbod de in het eerste lid bedoelde
      meststoffen:
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel6
  - number: 6.2.a
    text: te verhandelen zonder kennisgeving daarvan op een daarbij aangegeven wijze aan een daarbij aangewezen orgaan;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel6
  - number: 6.2.b
    text: in voorraad te houden, te verwerken of te vernietigen op een andere wijze dan daarbij is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel6
  - number: 6.2.c
    text: |-
      te verhandelen zonder vergunning verleend door Onze Minister of een bij de maatregel aangewezen orgaan, waarbij
      tevens regelen kunnen worden gesteld met betrekking tot de verlening, weigering of intrekking van een vergunning.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel6
  - number: '6.3'
    text: |-
      Aan een vergunning, als bedoeld in het tweede lid, onder d, kunnen voorschriften worden verbonden. Zij kan onder
      beperkingen worden verleend. Tot de voorschriften kunnen onder meer behoren:
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel6
  - number: 6.3.a
    text: |-
      een verbod de desbetreffende meststoffen af te leveren aan bij het voorschrift aangewezen gebruikers of groepen van
      gebruikers, in grotere dan bij het voorschrift vastgestelde hoeveelheden;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel6
  - number: 6.3.b
    text: |-
      de verplichting de naleving van de onder a bedoelde voorschriften te staven met bij het voorschrift vastgestelde
      bewijsstukken;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel6
  - number: 6.3.c
    text: |-
      voorschriften inzake het voeren van een administratie welke worden gesteld om de naleving van de onder a bedoelde
      voorschriften te kunnen controleren.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel6
  - number: '6.4'
    text: |-
      De aan een vergunning, als bedoeld in het tweede lid, onder d, verbonden voorschriften en de beperkingen waaronder
      zij is verleend, kunnen worden gewijzigd, aangevuld of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel6
  - number: 6a.1
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de minimumomvang van de opslagruimte voor
      dierlijke meststoffen op een bedrijf.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel6a
  - number: 6a.2
    text: |-
      Onverminderd het bepaalde bij of krachtens de[ Wet milieubeheer][ref1] kunnen bij de maatregel voorwaarden worden
      gesteld waaraan een opslagruimte moet voldoen om bij de bepaling van de omvang van de op het bedrijf beschikbare
      opslagruimte voor dierlijke meststoffen in aanmerking te worden genomen, waartoe kunnen behoren regels omtrent de
      maximale afstand van de opslagruimte tot de huisvesting waarin dieren worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '7.1'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7
  - number: 7.1.a
    text: |-
      het opmaken, bewaren, overleggen en afdragen van gegevens door houders van dieren, daaronder begrepen personen,
      rechtspersonen of samenwerkingsverbanden van personen of rechtspersonen die de dieren tijdelijk in het kader
      van een onderneming, niet zijnde een bedrijf onder zich hebben, door andere producenten van meststoffen en door
      handelaren in en transporteurs en gebruikers van meststoffen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7
  - number: 7.1.a.1°
    text: |-
      het bedrijf of de onderneming, zoals de tenaamstelling of handelsnaam, de rechtsvorm, in voorkomend geval de aard
      en samenstelling van het samenwerkingsverband van personen of rechtspersonen dat het bedrijf of de onderneming
      voert, de inschrijving in het handelsregister en de bij het bedrijf of de onderneming werkzame personen en hun
      bevoegdheden,
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7
  - number: 7.1.a.2°
    text: de geproduceerde, in voorraad gehouden, ontvangen, verhandelde en gebruikte hoeveelheden meststoffen,
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7
  - number: 7.1.a.3°
    text: |-
      de tot het bedrijf behorende oppervlakte landbouwgrond en natuurterrein, zulks met inbegrip van de topografische
      ligging van de individuele percelen landbouwgrond en natuurterrein alsmede van de ligging en oppervlakte van de
      onderscheiden teelten op de percelen landbouwgrond, en
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7
  - number: 7.1.a.4°
    text: |-
      de aantallen gehouden dieren van de onderscheiden diersoorten, onderverdeeld in categorieën per soort, die zijn
      opgenomen in [bijlage A][ref1] bij deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 7.1.b
    text: de berekening van de hoeveelheden meststoffen, oppervlakte landbouwgrond en natuurterrein en aantallen dieren.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7
  - number: '7.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de gevallen waarin en de
      voorwaarden waaronder op verzoek van betrokkenen de gegevens, bedoeld in het eerste lid, geheel of gedeeltelijk
      kunnen worden doorgehaald, al dan niet onder gelijktijdige vervanging van deze gegevens door andere gegevens.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7
  - number: 7a.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat door iedere persoon of rechtspersoon die en ieder
      samenwerkingsverband van personen of rechtspersonen dat op een bedrijf meststoffen aanvoert of dierlijke
      meststoffen produceert, gegevens worden verstrekt met betrekking tot de identificatie van:
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7a
  - number: 7a.1.a
    text: |-
      de percelen van de tot het bedrijf behorende oppervlakte landbouwgrond en de onderscheiden teelten die daarop
      plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7a
  - number: 7a.1.b
    text: |-
      de percelen van de tot het bedrijf behorende oppervlakte natuurterrein en de daarbinnen naar de aard van het
      terrein of het gebruik daarvan te onderscheiden aaneengesloten oppervlakten;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7a
  - number: 7a.1.c
    text: |-
      de overige percelen die de desbetreffende persoon of rechtspersoon of het desbetreffende samenwerkingsverband in
      gebruik heeft en de daarbinnen naar de aard van het terrein of het gebruik daarvan te onderscheiden aaneengesloten
      oppervlakten.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7a
  - number: 7a.2
    text: |-
      De in het eerste lid bedoelde gegevens kunnen mede betrekking hebben op grond die nog bij het bedrijf in gebruik
      moet worden genomen en op nog aan te vangen teelten en vormen van gebruik.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7a
  - number: 7a.3
    text: 'De in het eerste lid bedoelde gegevens kunnen in ieder geval betreffen:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7a
  - number: 7a.3.a
    text: |-
      de oppervlakte van de percelen grasland, braakland en bouwland, onderscheiden naar de aard van de teelt, de
      oppervlakte van de percelen natuurterrein en de oppervlakte van de percelen overige grond;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7a
  - number: 7a.3.b
    text: de topografische ligging en kadastrale aanduiding van de percelen;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7a
  - number: 7a.3.c
    text: |-
      de topografische ligging van de aaneengesloten oppervlakten van de onderscheiden teelten op de percelen
      landbouwgrond;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7a
  - number: 7a.3.d
    text: |-
      de topografische ligging van de naar de aard van het terrein of het gebruik daarvan te onderscheiden aaneengesloten
      oppervlakten binnen de percelen van de tot het bedrijf behorende oppervlakte natuurterrein en binnen de percelen
      overige grond;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7a
  - number: 7a.3.e
    text: |-
      een vermelding van de titels, bedoeld in de [artikelen 1, eerste lid, onderdelen q en w, en derde lid][ref1],
      alsmede [1a, tweede lid][ref2], op grond waarvan de percelen of gedeelten daarvan bij het bedrijf in gebruik zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel1a
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 1a
        hoofdstuk: I
  - number: 7a.4
    text: |-
      De verstrekking van de gegevens geschiedt binnen een bij ministeriële regeling bepaalde termijn bij het in die
      regeling genoemde orgaan, met gebruikmaking van het daartoe door dat orgaan ter beschikking gestelde formulier,
      dat overeenkomstig de op het formulier aangegeven wijze volledig en, althans wat de op dat moment bekende gegevens
      betreft, naar waarheid is ingevuld en door de persoon of rechtspersoon of deelgenoten van het samenwerkingsverband
      is ondertekend.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel7a
  - number: '8'
    text: |-
      De toepassing van de in de [artikelen 6][ref1] en [7][ref2] bedoelde regelen kan worden beperkt tot bepaalde, bij
      of krachtens de in [artikel 6][ref3], onderscheidenlijk [artikel 7][ref4], bedoelde maatregel aangewezen gebieden,
      waarbij deze regelen per gebied en per categorie van bedrijven alsmede dierlijke meststoffensoort verschillend
      kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel7
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '7'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '6'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0004054
        artikel: '7'
        hoofdstuk: III
  - number: '14.1'
    text: |-
      Ter zake van het aanvoeren van meststoffen of het produceren van dierlijke meststoffen worden onder de naam
      «forfaitaire mineralenheffingen» regulerende heffingen geheven van iedere persoon of rechtspersoon die en ieder
      samenwerkingsverband van personen of rechtspersonen dat een bedrijf voert.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel14
  - number: '14.2'
    text: De heffingen worden geheven per bedrijf.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel14
  - number: '15.1'
    text: |-
      Er wordt een heffing geheven naar de belastbare hoeveelheid meststoffen in een kalenderjaar uitgedrukt in
      kilogrammen fosfaat.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel15
  - number: '15.2'
    text: |-
      Er wordt een heffing geheven naar de belastbare hoeveelheid meststoffen in een kalenderjaar uitgedrukt in
      kilogrammen stikstof.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel15
  - number: '16'
    text: 'De belastbare hoeveelheid meststoffen wordt bepaald door achtereenvolgens:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel16
  - number: 16.a
    text: 'bij elkaar op te tellen:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel16
  - number: 16.a.1°
    text: de hoeveelheid aangevoerde meststoffen,
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel16
  - number: 16.a.2°
    text: de hoeveelheid geproduceerde dierlijke meststoffen en,
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel16
  - number: 16.a.3°
    text: |-
      indien het de belastbare hoeveelheid meststoffen uitgedrukt in kilogrammen stikstof betreft, de stikstofbinding
      door het gewas, en
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel16
  - number: 16.b
    text: 'de overeenkomstig onderdeel a berekende hoeveelheid te verminderen met:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel16
  - number: 16.b.1°
    text: de hoeveelheid afgevoerde dierlijke meststoffen,
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel16
  - number: 16.b.2°
    text: de opname van meststoffen door het gewas, en
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel16
  - number: 16.b.3°
    text: het toelaatbare verlies van meststoffen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel16
  - number: '17.1'
    text: |-
      De hoeveelheid geproduceerde dierlijke meststoffen wordt vastgesteld op basis van het gemiddelde aantal in het
      desbetreffende kalenderjaar gehouden, uitgeschaarde of tijdelijk elders ter weiding ondergebrachte dieren van de
      onderscheiden diercategorieën en op basis van de forfaitaire productienormen voor de onderscheiden diercategorieën,
      uitgedrukt in kilogrammen fosfaat, onderscheidenlijk stikstof per dier per jaar, die zijn opgenomen in
      [bijlage A][ref1] bij deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '17.2'
    text: |-
      De hoeveelheid aangevoerde en de hoeveelheid afgevoerde dierlijke meststoffen worden vastgesteld op basis van
      het gewicht of het volume van de in het desbetreffende kalenderjaar aangevoerde en afgevoerde meststoffen en op
      basis van de forfaitaire omrekennormen, uitgedrukt in kilogrammen fosfaat, onderscheidenlijk stikstof per 1000
      kilogram dierlijke meststof, onderscheiden naar mestvorm, diercategorie en bedrijfssysteem, die zijn opgenomen in
      [bijlage C][ref1] bij deze wet. Daarbij worden de in [bijlage C][ref2] opgenomen bepalingen in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0004054
  - number: '17.3'
    text: |-
      De hoeveelheid aangevoerde overige organische meststoffen en andere meststoffen wordt vastgesteld op basis van
      het gewicht of volume en het fosfaatgehalte, onderscheidenlijk stikstofgehalte van de in het desbetreffende
      kalenderjaar aangevoerde overige organische en andere meststoffen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel17
  - number: '17.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de gevallen waarin en de voorwaarden waaronder, in
      afwijking van het tweede lid, ook de hoeveelheid aangevoerde dierlijke meststoffen wordt vastgesteld op basis van
      het fosfaatgehalte, onderscheidenlijk stikstofgehalte van de dierlijke meststoffen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel17
  - number: 17a
    text: |-
      De stikstofbinding door het gewas, bedoeld in [artikel 16, onderdeel a, onder 3°][ref1], is per hectare van de
      gemiddeld in het desbetreffende kalenderjaar tot het bedrijf behorende oppervlakte landbouwgrond: - 30 kilogram
      stikstof voor bouwland beteeld met stamslabonen;
        - 50 kilogram stikstof voor bouwland beteeld met erwten, pronkbonen of slabonen;
        - 120 kilogram stikstof voor bouwland beteeld met veldbonen of tuinbonen;
        - 160 kilogram stikstof voor bouwland beteeld met luzerne.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel16
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '16'
        hoofdstuk: IV
  - number: '18'
    text: |-
      De opname van meststoffen door het gewas, bedoeld in [artikel 16, onderdeel b, onder 2°][ref1], is per hectare van
      de gemiddeld in het desbetreffende kalenderjaar tot het bedrijf behorende oppervlakte landbouwgrond: - 65 kilogram
      fosfaat, onderscheidenlijk 300 kilogram stikstof voor grasland;
        - 50 kilogram fosfaat, onderscheidenlijk 125 kilogram stikstof voor bouwland.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel16
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '16'
        hoofdstuk: IV
  - number: '19.1'
    text: |-
      Het toelaatbare verlies van meststoffen, bedoeld in [artikel 16, onderdeel b, onder 3°][ref1], in 2002 is:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel16
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '16'
        hoofdstuk: IV
  - number: 19.1.a
    text: |-
      per hectare van de gemiddeld in 2002 tot het bedrijf behorende oppervlakte landbouwgrond 25 kilogram fosfaat voor
      grasland en 30 kilogram fosfaat voor bouwland en braakland, onderscheidenlijk: - 220 kilogram stikstof voor niet op
      uitspoelingsgevoelige grond gelegen grasland,
        - 190 kilogram stikstof voor op uitspoelingsgevoelige grond gelegen grasland,
        - 150 kilogram stikstof voor op klei- of veengrond gelegen bouwland en braakland,
        - 100 kilogram stikstof voor op uitspoelingsgevoelige grond gelegen bouwland en braakland en
        - 110 kilogram stikstof voor het overige bouwland en braakland;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel19
  - number: 19.1.b
    text: |-
      per hectare van de gemiddeld in 2002 tot het bedrijf behorende oppervlakte natuurterrein 10 kilogram fosfaat,
      onderscheidenlijk 50 kilogram stikstof.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel19
  - number: '19.2'
    text: |-
      Het toelaatbare verlies van meststoffen, bedoeld in [artikel 16, onderdeel b, onder 3°][ref1], in 2003 en in de
      daarop volgende jaren is:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel16
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '16'
        hoofdstuk: IV
  - number: 19.2.a
    text: |-
      per hectare van de gemiddeld in het desbetreffende kalenderjaar tot het bedrijf behorende oppervlakte landbouwgrond
      20 kilogram fosfaat, onderscheidenlijk: - 180 kilogram stikstof voor niet op uitspoelingsgevoelige grond gelegen
      grasland,
        - 140 kilogram stikstof voor op uitspoelingsgevoelige grond gelegen grasland,
        - 100 kilogram stikstof voor niet op uitspoelingsgevoelige grond gelegen bouwland en braakland en
        - 60 kilogram stikstof voor op uitspoelingsgevoelige grond gelegen bouwland en braakland;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel19
  - number: 19.2.b
    text: |-
      per hectare van de gemiddeld in het desbetreffende kalenderjaar tot het bedrijf behorende oppervlakte natuurterrein
      10 kilogram fosfaat, onderscheidenlijk 50 kilogram stikstof.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel19
  - number: '20.1'
    text: Het tarief van de heffing bedraagt € 9,– per kilogram fosfaat en € 2,30 per kilogram stikstof.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel20
  - number: '20.2'
    text: |-
      In 2002 bedraagt het tarief van de heffing voor een hoeveelheid stikstof overeenkomend met ten hoogste 40 kilogram
      per hectare van de gemiddeld in 2002 tot het bedrijf behorende oppervlakte landbouwgrond € 1,15 per kilogram
      stikstof.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel20
  - number: '21'
    text: |-
      De heffingen worden verschuldigd op het moment van aanvoeren van meststoffen of produceren van dierlijke
      meststoffen. Zij moeten na afloop van het kalenderjaar op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel21
  - number: '22'
    text: |-
      Ten aanzien van een tijdig daartoe aangemeld bedrijf worden, indien aan alle overige ter zake bij of krachtens deze
      wet gestelde regels wordt voldaan, niet de forfaitaire mineralenheffingen, bedoeld in [artikel 14][ref1], geheven,
      maar regulerende heffingen ter zake van het aanvoeren van mineralen door het feitelijk van een derde of van een
      ander bedrijf afnemen van in [bijlage D][ref2] als aanvoerpost benoemde producten of dieren. De heffingen worden
      geheven onder de naam «verfijnde mineralenheffingen».


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '14'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004054
  - number: '23.1'
    text: |-
      Er wordt een heffing geheven naar de belastbare hoeveelheid mineralen in een kalenderjaar uitgedrukt in kilogrammen
      fosfaat.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel23
  - number: '23.2'
    text: |-
      Er wordt een heffing geheven naar de belastbare hoeveelheid mineralen in een kalenderjaar uitgedrukt in kilogrammen
      stikstof.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel23
  - number: '24'
    text: 'De belastbare hoeveelheid mineralen wordt bepaald door achtereenvolgens:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel24
  - number: 24.a
    text: 'bij elkaar op te tellen:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel24
  - number: 24.a.1°
    text: de hoeveelheid aangevoerde mineralen en
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel24
  - number: 24.a.2°
    text: |-
      indien het de belastbare hoeveelheid mineralen uitgedrukt in kilogrammen stikstof betreft, de stikstofbinding door
      het gewas, en
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel24
  - number: 24.b
    text: 'de overeenkomstig onderdeel a berekende hoeveelheid te verminderen met:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel24
  - number: 24.b.1°
    text: de hoeveelheid afgevoerde mineralen en
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel24
  - number: 24.b.2°
    text: het toelaatbare mineralenverlies.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel24
  - number: '25.1'
    text: |-
      De hoeveelheid aangevoerde mineralen wordt vastgesteld als de som van de hoeveelheden fosfaat, onderscheidenlijk
      stikstof in de in het desbetreffende kalenderjaar feitelijk van een derde of van een ander bedrijf afgenomen
      producten of dieren die in [bijlage D][ref1] van deze wet zijn benoemd als aanvoerpost.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '25.2'
    text: |-
      De hoeveelheid afgevoerde mineralen wordt vastgesteld als de som van de hoeveelheden fosfaat, onderscheidenlijk
      stikstof in de in het desbetreffende kalenderjaar feitelijk aan een derde of aan een ander bedrijf afgeleverde
      producten of dieren die in [bijlage D][ref1] van deze wet zijn benoemd als afvoerpost.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '25.3'
    text: |-
      De in het eerste en tweede lid bedoelde hoeveelheden fosfaat, onderscheidenlijk stikstof worden vastgesteld
      overeenkomstig [bijlage D][ref1] bij deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '25.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de gevallen waarin en de voorwaarden waaronder,
      in afwijking van [bijlage D][ref1], de hoeveelheden fosfaat onderscheidenlijk stikstof in de aangevoerde en
      afgevoerde dierlijke meststoffen worden vastgesteld op basis van de forfaitaire omrekennormen, uitgedrukt in
      kilogrammen fosfaat, onderscheidenlijk stikstof per 1000 kilogram dierlijke meststof, onderscheiden naar mestvorm,
      diercategorie en bedrijfssysteem, die zijn opgenomen in [bijlage C][ref2] bij deze wet en die worden toegepast
      overeenkomstig de in die bijlage opgenomen bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0004054
  - number: '25.5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de gevallen waarin en de voorwaarden waaronder,
      in afwijking van [bijlage D][ref1], de hoeveelheden fosfaat, onderscheidenlijk stikstof in de aangevoerde en
      afgevoerde producten wordt vastgesteld op basis van het fosfaatgehalte, onderscheidenlijk stikstofgehalte van de
      producten.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 25a
    text: |-
      De stikstofbinding door het gewas, bedoeld in [artikel 24, onderdeel a, onder 2°][ref1], is per hectare van de
      gemiddeld in het desbetreffende kalenderjaar tot het bedrijf behorende oppervlakte landbouwgrond: - 30 kilogram
      stikstof voor bouwland beteeld met stamslabonen;
        - 50 kilogram stikstof voor bouwland beteeld met erwten, pronkbonen of slabonen;
        - 120 kilogram stikstof voor bouwland beteeld met veldbonen of tuinbonen;
        - 160 kilogram stikstof voor bouwland beteeld met luzerne.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel24
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '24'
        hoofdstuk: IV
  - number: '26.1'
    text: |-
      Het toelaatbare mineralenverlies, bedoeld in [artikel 24, onderdeel b, onder 2°][ref1], in 2002 is:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel24
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '24'
        hoofdstuk: IV
  - number: 26.1.a
    text: |-
      per hectare van de gemiddeld in 2002 tot het bedrijf behorende oppervlakte landbouwgrond 25 kilogram fosfaat voor
      grasland en 30 kilogram fosfaat voor bouwland en braakland, onderscheidenlijk: - 220 kilogram stikstof voor niet op
      uitspoelingsgevoelige grond gelegen grasland,
        - 190 kilogram stikstof voor op uitspoelingsgevoelige grond gelegen grasland,
        - 150 kilogram stikstof voor op klei- of veengrond gelegen bouwland en braakland,
        - 100 kilogram stikstof voor op uitspoelingsgevoelige grond gelegen bouwland en braakland en
        - 110 kilogram stikstof voor het overige bouwland en braakland;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel26
  - number: 26.1.b
    text: |-
      per hectare van de gemiddeld in 2002 tot het bedrijf behorende oppervlakte natuurterrein 10 kilogram fosfaat,
      onderscheidenlijk 50 kilogram stikstof.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel26
  - number: '26.2'
    text: |-
      Het toelaatbare mineralenverlies, bedoeld in [artikel 24, onderdeel b, onder 2°][ref1], in 2003 en in de daarop
      volgende jaren is:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel24
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '24'
        hoofdstuk: IV
  - number: 26.2.a
    text: |-
      per hectare van de gemiddeld in het desbetreffende kalenderjaar tot het bedrijf behorende oppervlakte landbouwgrond
      20 kilogram fosfaat, onderscheidenlijk: - 180 kilogram stikstof voor niet op uitspoelingsgevoelige grond gelegen
      grasland,
        - 140 kilogram stikstof voor op uitspoelingsgevoelige grond gelegen grasland,
        - 100 kilogram stikstof voor niet op uitspoelingsgevoelige grond gelegen bouwland en braakland en
        - 60 kilogram stikstof voor op uitspoelingsgevoelige grond gelegen bouwland en braakland;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel26
  - number: 26.2.b
    text: |-
      per hectare van de gemiddeld in het desbetreffende kalenderjaar tot het bedrijf behorende oppervlakte natuurterrein
      10 kilogram fosfaat, onderscheidenlijk 50 kilogram stikstof.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel26
  - number: '27.1'
    text: Het tarief van de heffing bedraagt € 9,– per kilogram fosfaat en € 2,30 per kilogram stikstof.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel27
  - number: '27.2'
    text: |-
      In 2002 bedraagt het tarief van de heffing voor een hoeveelheid stikstof overeenkomend met ten hoogste 40 kilogram
      per hectare van de gemiddeld in 2002 tot het bedrijf behorende oppervlakte landbouwgrond € 1,15 per kilogram
      stikstof.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel27
  - number: '28'
    text: |-
      De heffingen worden verschuldigd op het moment van aanvoeren van mineralen door het feitelijk van een derde of een
      ander bedrijf afnemen van producten of dieren, die in [bijlage D][ref1] bij deze wet zijn benoemd als aanvoerpost.
      Zij moeten na afloop van het kalenderjaar op aangifte worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '29.1'
    text: |-
      Ter zake van het aanvoeren van meststoffen wordt onder de naam «heffing van intermediaire ondernemingen» een
      regulerende heffing geheven van iedere persoon of rechtspersoon die en ieder samenwerkingsverband van personen of
      rechtspersonen dat een onderneming, niet zijnde een bedrijf, voert en in het kader van die onderneming dierlijke
      meststoffen aanvoert ten behoeve van handel, transport, opslag, be- of verwerking of anderszins.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel29
  - number: '29.2'
    text: |-
      Voorzover het aanvoeren van dierlijke meststoffen plaatsvindt op een op het Nederlandse grondgebied gelegen
      deel van een in het buitenland gevestigde onderneming, wordt voor de toepassing van het eerste lid het op het
      Nederlandse grondgebied gelegen deel van de onderneming als een afzonderlijke onderneming beschouwd.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel29
  - number: '30'
    text: |-
      De heffing wordt geheven naar de belastbare hoeveelheid meststoffen in een kalenderjaar uitgedrukt in kilogrammen
      fosfaat.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel30
  - number: '31'
    text: |-
      De belastbare hoeveelheid meststoffen wordt bepaald door de hoeveelheid aangevoerde meststoffen, verminderd met de
      hoeveelheid afgevoerde meststoffen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel31
  - number: '32.1'
    text: |-
      De hoeveelheid aangevoerde meststoffen en de hoeveelheid afgevoerde meststoffen worden vastgesteld op basis van
      het gewicht of het volume en het fosfaatgehalte van de in het betreffende kalenderjaar aangevoerde meststoffen en
      afgevoerde meststoffen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel32
  - number: '32.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de gevallen waarin en de voorwaarden waaronder, in
      afwijking van het eerste lid, de hoeveelheid aangevoerde of afgevoerde dierlijke meststoffen wordt vastgesteld op
      basis van de forfaitaire omrekennormen, uitgedrukt in kilogrammen fosfaat per 1000 kilogram dierlijke meststof,
      onderscheiden naar mestvorm, diercategorie en bedrijfssysteem, die zijn opgenomen in [bijlage C][ref1] bij deze
      wet. Bij de vaststelling worden dan de in [bijlage C][ref2] opgenomen bepalingen in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0004054
  - number: '33'
    text: Het tarief van de heffing bedraagt € 9,– per kilogram fosfaat.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel33
  - number: '34'
    text: |-
      De heffing wordt verschuldigd op het moment van het aanvoeren van meststoffen. Zij moet na afloop van het
      kalenderjaar op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel34
  - number: '41.1'
    text: De heffingen, bedoeld in dit hoofdstuk, worden door Onze Minister geheven.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel41
  - number: '41.2'
    text: |-
      Onverminderd het overigens bij of krachtens dit hoofdstuk bepaalde worden de heffingen geheven met
      overeenkomstige toepassing van de [Algemene wet inzake rijksbelastingen][ref1], met dien verstande dat
      van die wet buiten toepassing blijven de [artikelen 2, vierde lid][ref2], [37 tot en met 39][ref3], 47a,
      [53, tweede en derde lid][ref4], [76][ref5], 80, tweede, derde en vierde lid, 82, 84, 86 en 87.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel53
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel76
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '37'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0004054
        artikel: '53'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0004054
        artikel: '76'
        hoofdstuk: VIII
  - number: '41.3'
    text: |-
      Voor de toepassing van de [Algemene wet inzake rijksbelastingen][ref1] treedt Onze Minister in de plaats van Onze
      Minister van Financiën. Voor de in de [Algemene wet inzake rijksbelastingen][ref2] genoemde functionarissen treden
      in de plaats de door Onze Minister aangewezen functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002320
  - number: '41.4'
    text: |-
      Voor de toepassing van [artikel 21, derde lid, van de Algemene wet inzake rijksbelastingen][ref1] wordt met
      een onherroepelijke veroordeling gelijk gesteld het vervallen van het recht op strafvordering op de voet van de
      [artikelen 74][ref2] en [74a van het Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel74a
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 74a
  - number: '41.5'
    text: |-
      Voor de toepassing van het bij of krachtens dit hoofdstuk bepaalde wordt
      [artikel 52, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1] als volgt gelezen:
      Administratieplichtigen zijn: de personen, rechtspersonen en samenwerkingsverbanden, bedoeld in de
      [artikelen 14][ref2], [22][ref3] en [29][ref4], alsmede de producenten, leveranciers en afnemers, bedoeld in
      [artikel 53, onderdeel f][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel53
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '53'
  - number: '41.6'
    text: |-
      Voor de toepassing van [artikel 66 van de Algemene wet inzake rijksbelastingen][ref1] zijn de bij regeling van Onze
      Minister van Financiën gestelde regels van toepassing. Door Onze Minister worden de afwijkingen daarop vastgesteld
      die voor de juiste toepassing van het bij of krachtens dit hoofdstuk bepaalde noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel66
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '66'
  - number: '41.7'
    text: |-
      De [artikelen 68 tot en met 71 van de Algemene wet inzake rijksbelastingen][ref1] zijn niet van toepassing voor
      zover het handelen in strijd met de regels tevens een overtreding oplevert van regels gesteld bij of krachtens de
      in [artikel 71, tweede lid][ref2], genoemde artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel71
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '71'
        hoofdstuk: VIII
  - number: '42.1'
    text: |-
      De heffingen, bedoeld in dit hoofdstuk, worden ingevorderd door de door Onze Minister aangewezen functionaris en
      door de ontvanger, bedoeld in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
  - number: '42.2'
    text: |-
      Onverminderd het overigens bij of krachtens dit hoofdstuk bepaalde worden de heffingen ingevorderd met
      overeenkomstige toepassing van de [Invorderingswet 1990][ref1] en de [Kostenwet invordering rijksbelastingen][ref2],
      met dien verstande dat van de [Invorderingswet 1990][ref3] buiten toepassing blijven
      [artikel 17, tweede lid, tweede volzin][ref4], alsmede de [artikelen 59][ref5] en [62][ref6]. Voorts blijven bij
      de toepassing van [artikel 66 van die wet][ref7] de [artikelen 76][ref8], [80, tweede, derde en vierde lid][ref9],
      [82][ref10], [84][ref11], [86][ref12] en [87 van de Algemene wet inzake rijksbelastingen][ref13] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0002645
      [ref3]: https://wetten.overheid.nl/BWBR0004770
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel59
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel62
      [ref7]: https://wetten.overheid.nl/BWBR0004770#Artikel66
      [ref8]: https://wetten.overheid.nl/BWBR0002320#Artikel76
      [ref9]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref10]: https://wetten.overheid.nl/BWBR0002320#Artikel82
      [ref11]: https://wetten.overheid.nl/BWBR0002320#Artikel84
      [ref12]: https://wetten.overheid.nl/BWBR0002320#Artikel86
      [ref13]: https://wetten.overheid.nl/BWBR0002320#Artikel87
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0002645
      - id: ref3
        bwb_id: BWBR0004770
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '17'
      - id: ref5
        bwb_id: BWBR0004770
        artikel: '59'
      - id: ref6
        bwb_id: BWBR0004770
        artikel: '62'
      - id: ref7
        bwb_id: BWBR0004770
        artikel: '66'
      - id: ref8
        bwb_id: BWBR0002320
        artikel: '76'
      - id: ref9
        bwb_id: BWBR0002320
        artikel: '80'
      - id: ref10
        bwb_id: BWBR0002320
        artikel: '82'
      - id: ref11
        bwb_id: BWBR0002320
        artikel: '84'
      - id: ref12
        bwb_id: BWBR0002320
        artikel: '86'
      - id: ref13
        bwb_id: BWBR0002320
        artikel: '87'
  - number: '42.3'
    text: |-
      Behoudens voor zover de invordering is opgedragen aan de ontvanger, bedoeld in het eerste lid, treedt voor de
      toepassing van de [Invorderingswet 1990][ref1] Onze Minister in de plaats van Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004770
  - number: '42.4'
    text: 'Met betrekking tot de invordering geldt dat:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel42
  - number: 42.4.a
    text: |-
      voor de toepassing van [artikel 8, eerste lid, van de Invorderingswet 1990][ref1] uitsluitend bevoegd is de door
      Onze Minister aangewezen functionaris;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel8
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '8'
  - number: 42.4.b
    text: |-
      de in de [artikelen 10, eerste lid][ref1], [11][ref2], [12][ref3] en [26 van de Invorderingswet 1990][ref4]
      bedoelde bevoegdheden uitsluitend toekomen aan de door Onze Minister aangewezen functionaris, met dien verstande
      dat voor de toepassing van artikel 26 van die wet de bij regeling van Onze Minister van Financiën gestelde regels
      van toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '26'
  - number: 42.4.c
    text: |-
      de overige bij invordering van toepassing zijnde bevoegdheden, met uitzondering van die bedoeld in de
      [artikelen 24][ref1], [25][ref2] en [58 van de Invorderingswet 1990][ref3], uitsluitend toekomen aan de ontvanger,
      bedoeld in het eerste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel58
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '58'
  - number: 42.4.d
    text: |-
      de bevoegdheid, bedoeld in [artikel 24 van de Invorderingswet 1990][ref1], zowel toekomt aan de door Onze Minister
      aangewezen functionaris als aan de ontvanger, bedoeld in het eerste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
  - number: 42.4.e
    text: |-
      de bevoegdheden, bedoeld in de [artikelen 25][ref1] en [58 van de Invorderingswet 1990][ref2], toekomen aan de
      door Onze Minister aangewezen functionaris indien hij met de invordering is belast, en toekomen aan de ontvanger,
      bedoeld in het eerste lid, indien deze laatste met de invordering is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel58
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '58'
  - number: '42.5'
    text: |-
      In het kader van het verzet tegen de tenuitvoerlegging van het dwangbevel wordt voor de toepassing van
      [artikel 17 van de Invorderingswet 1990][ref1] voor «de ontvanger die het dwangbevel heeft uitgevaardigd» telkens
      gelezen: de met de tenuitvoerlegging van het dwangbevel belaste ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel17
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '17'
  - number: '42.6'
    text: |-
      Betaling van de heffingen geschiedt aan de door Onze Minister aangewezen functionaris. Na de betekening van het
      dwangbevel dient te worden betaald aan de ontvanger, bedoeld in het eerste lid, die is vermeld op het dwangbevel.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel42
  - number: 42a.1
    text: |-
      Bij de aangifte van de heffingen, bedoeld in de titels 1 en 2, wordt een verklaring van een registeraccountant
      of een accountant-administratieconsulent overgelegd indien de veebezetting op het bedrijf in het desbetreffende
      kalenderjaar gemiddeld meer is dan 2,5 grootvee-eenheden per hectare van de tot het bedrijf behorende oppervlakte
      landbouwgrond.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel42a
  - number: 42a.2
    text: |-
      De omrekening van dieren van de onderscheiden diercategorieën naar grootvee-eenheden geschiedt overeenkomstig de
      daarvoor in [bijlage A][ref1] bij deze wet opgenomen normen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '43.1'
    text: |-
      Ingeval in een kalenderjaar de belastbare hoeveelheid fosfaat, onderscheidenlijk stikstof, bedoeld in
      [artikel 24][ref1], minder is dan nihil, wordt deze verrekend met de belastbare hoeveelheden van de voorgaande
      drie kalenderjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel24
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '24'
        hoofdstuk: IV
  - number: '43.2'
    text: |-
      Indien na de verrekening een belastbare hoeveelheid fosfaat, onderscheidenlijk stikstof van minder dan nihil
      resteert, wordt deze verrekend met de daarop volgende kalenderjaren. De verrekening vindt plaats door vermindering
      van de belastbare hoeveelheid van een volgend jaar tot ten minste nihil.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel43
  - number: '43.3'
    text: |-
      Verrekening met betrekking tot een kalenderjaar vindt slechts plaats indien met betrekking tot dat kalenderjaar
      aangifte van de verschuldigde verfijnde mineralenheffingen, bedoeld in [artikel 22][ref1], is gedaan, en aan de in
      dat artikel bedoelde regels is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel22
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '22'
        hoofdstuk: IV
  - number: '43.4'
    text: De verrekening geschiedt in de volgorde waarin de belastbare hoeveelheden zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel43
  - number: '43.5'
    text: |-
      De verrekening en het verlenen van een uit een verrekening voortvloeiende teruggaaf, alsmede de vaststelling
      van een resterende belastbare hoeveelheid fosfaat, onderscheidenlijk stikstof van minder dan nihil, geschiedt op
      verzoek door de inspecteur bij voor bezwaar vatbare beschikking. De aangifte wordt aangemerkt als verzoek.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel43
  - number: '43.6'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de verrekening en de vaststelling
      van het saldo.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel43
  - number: '44.1'
    text: |-
      Een subsidie wordt verleend indien de belastbare hoeveelheid mineralen, bedoeld in [artikel 24][ref1], minder is
      dan nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel24
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '24'
        hoofdstuk: IV
  - number: '44.2'
    text: |-
      De subsidie wordt verleend vanaf een bij ministeriële regeling te bepalen tijdstip. Bij deze regeling worden nadere
      regels gesteld met betrekking tot de gevallen waarin en de voorwaarden waaronder de subsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel44
  - number: '44.3'
    text: |-
      De bij de ministeriële regeling vast te stellen hoogte van de subsidie bedraagt per kilogram fosfaat,
      onderscheidenlijk stikstof niet meer dan de tarieven, bedoeld in [artikel 27, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel27
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '27'
        hoofdstuk: IV
  - number: '44.4'
    text: |-
      Geen subsidie wordt verleend voor de hoeveelheid fosfaat, onderscheidenlijk stikstof die ingevolge
      [artikel 43, eerste lid][ref1], in aanmerking komt voor verrekening met belastbare hoeveelheden fosfaat,
      onderscheidenlijk stikstof van voorgaande jaren. De hoeveelheid fosfaat, onderscheidenlijk stikstof waarvoor een
      subsidie wordt verleend wordt niet meer in aanmerking genomen voor verrekening met navolgende kalenderjaren als
      bedoeld in [artikel 43, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel43
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '43'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '43'
        hoofdstuk: IV
  - number: '45'
    text: |-
      De verminderingen, bedoeld in de [artikelen 16, onderdeel b][ref1], [24, onderdeel b][ref2], [31][ref3],
      [47][ref4], [48][ref5] en [49][ref6] worden uitsluitend toegepast indien de heffingplichtige het recht tot
      vermindering kan aantonen op basis van de ter zake bij te houden, te bewaren, over te leggen of af te dragen
      gegevens, bescheiden en bewijsstukken, en indien aan de overigens ter zake gestelde regels is voldaan, waaronder
      de regels met betrekking tot de vaststelling van de hoeveelheid fosfaat, onderscheidenlijk stikstof waar de
      vermindering mee gepaard gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0004054#Artikel49
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '16'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '24'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '31'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0004054
        artikel: '47'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0004054
        artikel: '48'
        hoofdstuk: IV
      - id: ref6
        bwb_id: BWBR0004054
        artikel: '49'
        hoofdstuk: IV
  - number: '46.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor de bepaling van het toelaatbare verlies van meststoffen, bedoeld
      in [artikel 16, onderdeel b, onder 3°][ref1], en voor de bepaling van het toelaatbare mineralenverlies, bedoeld
      in [artikel 24, onderdeel b, onder 2°][ref2], hoeveelheden fosfaat, onderscheidenlijk stikstof per hectare van de
      gemiddeld in het jaar tot het bedrijf behorende oppervlakte landbouwgrond of natuurterrein worden vastgesteld die
      afwijken van de in de [artikelen 19][ref3] en [26][ref4] genoemde hoeveelheden. De afwijking bedraagt ten hoogste
      35%.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel26
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '16'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '24'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '19'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0004054
        artikel: '26'
        hoofdstuk: IV
  - number: '46.2'
    text: |-
      De in het eerste lid bedoelde afwijkende hoeveelheden kunnen verschillend worden vastgesteld al naar gelang
      sprake is van grond met een hoog of laag fosfaat- of stikstofgehalte, zand- of lössgrond, klei- of veengrond,
      uitspoelingsgevoelige grond, niet-uitspoelingsgevoelige grond of andere bij de maatregel op basis van de grondsoort
      of grondwaterstand aangeduide gronden.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel46
  - number: '47'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de gevallen waarin en de
      voorwaarden waaronder de hoeveelheid stikstof, waarover op grond van[ titel 1][ref1] of [2 van dit hoofdstuk][ref2]
      heffing is verschuldigd, wordt verminderd met een bij of krachtens de maatregel bepaalde hoeveelheid, overeenkomend
      met ten hoogste de gemiddelde hoeveelheid stikstof in dierlijke meststoffen die als ammoniak of in een andere vorm
      vervluchtigt.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0004054
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004054
        hoofdstuk: IV
  - number: '48'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de gevallen waarin en de
      voorwaarden waaronder de hoeveelheid fosfaat, onderscheidenlijk stikstof waarover op grond van [titel 1][ref1],
      [2][ref2] of [3 van dit hoofdstuk][ref3] heffing is verschuldigd, kan worden vermeerderd met de hoeveelheid
      fosfaat, onderscheidenlijk stikstof in dierlijke of in overige organische meststoffen in opslag bij het bedrijf
      of de onderneming bij aanvang van het betreffende kalenderjaar en verminderd met de hoeveelheid fosfaat,
      onderscheidenlijk stikstof in dierlijke of in overige organische meststoffen in opslag bij het bedrijf of de
      onderneming aan het einde van het betreffende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004054
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004054
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004054
        hoofdstuk: IV
  - number: '49'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de gevallen
      waarin en de voorwaarden waaronder de hoeveelheid fosfaat, onderscheidenlijk stikstof waarover op grond van
      [titel 1][ref1], [2][ref2] of [3 van dit hoofdstuk][ref3] heffing is verschuldigd, kan worden verminderd met
      de hoeveelheid fosfaat, onderscheidenlijk stikstof in dierlijke meststoffen die zijn verwerkt tot een niet als
      dierlijke meststof aan te merken product, of die in het kader van het proces van be- of verwerking verloren zijn
      gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004054
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004054
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004054
        hoofdstuk: IV
  - number: '50'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de gevallen waarin
      en de voorwaarden waaronder in plaats van de in de [artikelen 19][ref1] en [26][ref2] neergelegde hoeveelheden
      fosfaat, onderscheidenlijk stikstof, kleinere hoeveelheden fosfaat, onderscheidenlijk stikstof gelden, die zijn
      voorzien in krachtens [artikel 1.2 van de Wet milieubeheer][ref3] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '19'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '26'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '1'
  - number: '51.1'
    text: |-
      Bij ministeriële regeling kunnen de tarieven genoemd in de [artikelen 20][ref1], [27][ref2], [33][ref3], en
      [36][ref4] worden vervangen door andere tarieven. Een verhoging van het tarief bedraagt maximaal 100% van het
      oorspronkelijke tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel36
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '20'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '27'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '33'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0004054
        artikel: '36'
        hoofdstuk: IV
  - number: '51.2'
    text: |-
      Bij ministeriële regeling kunnen de hoeveelheden fosfaat en stikstof genoemd in de [artikelen 17a][ref1],
      [18][ref2], [19][ref3], [25a][ref4], [26][ref5] en [46][ref6] worden vervangen door andere hoeveelheden fosfaat
      en stikstof.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel25a
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel26
      [ref6]: https://wetten.overheid.nl/BWBR0004054#Artikel46
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 17a
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '18'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '19'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0004054
        artikel: 25a
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0004054
        artikel: '26'
        hoofdstuk: IV
      - id: ref6
        bwb_id: BWBR0004054
        artikel: '46'
        hoofdstuk: IV
  - number: '51.3'
    text: Bij ministeriële regeling kunnen de bijlagen bij deze wet worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel51
  - number: '51.4'
    text: |-
      Uiterlijk drie maanden na het tijdstip waarop een krachtens het eerste, tweede of derde lid vastgestelde
      ministeriële regeling in werking treedt, wordt een voorstel van wet tot goedkeuring van die regeling aan de Tweede
      Kamer der Staten-Generaal gezonden. Indien het voorstel wordt ingetrokken of indien een van de Kamers der Staten-
      Generaal tot het niet-aannemen van het voorstel besluit, worden onverwijld bij ministeriële regeling de krachtens
      het eerste, tweede of derde lid vastgestelde wijzigingen ongedaan gemaakt, zodanig dat de betrokken artikelen of
      bijlagen komen te luiden zoals zij voor het in de eerste volzin bedoelde tijdstip luidden.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel51
  - number: '51.5'
    text: Krachtens dit artikel vastgestelde ministeriële regelingen worden in het Staatsblad geplaatst.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel51
  - number: '52'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de vaststellingen, bedoeld in de
      [artikelen 17][ref1], [25][ref2] en [32][ref3], alsmede met betrekking tot de vaststelling van de stikstofbinding
      door het gewas, bedoeld in de [artikelen 17a][ref4] en [25a][ref5], de vaststelling van de opname van meststoffen
      door het gewas, bedoeld in [artikel 18][ref6] en de vaststelling van de toelaatbare verliezen, bedoeld in de
      [artikelen 19][ref7] en [26][ref8]. Deze regels hebben betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel17a
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel25a
      [ref6]: https://wetten.overheid.nl/BWBR0004054#Artikel18
      [ref7]: https://wetten.overheid.nl/BWBR0004054#Artikel19
      [ref8]: https://wetten.overheid.nl/BWBR0004054#Artikel26
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '17'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '25'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '32'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0004054
        artikel: 17a
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0004054
        artikel: 25a
        hoofdstuk: IV
      - id: ref6
        bwb_id: BWBR0004054
        artikel: '18'
        hoofdstuk: IV
      - id: ref7
        bwb_id: BWBR0004054
        artikel: '19'
        hoofdstuk: IV
      - id: ref8
        bwb_id: BWBR0004054
        artikel: '26'
        hoofdstuk: IV
  - number: 52.a
    text: de methode van weging, volumebepaling, bemonstering en analyse;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel52
  - number: 52.b
    text: de ten behoeve van de vaststelling te gebruiken apparatuur;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel52
  - number: 52.c
    text: |-
      de bevoegdheid tot het doen van de vaststelling, welke bevoegdheid kan worden verbonden aan een door Onze Minister
      overeenkomstig bij ministeriële regeling gestelde erkenningsvoorwaarden verleende erkenning;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel52
  - number: 52.d
    text: |-
      de plaats, het moment en de frequentie van vaststelling, daaronder begrepen tellingen voor de vaststelling van
      het gemiddelde aantal dieren en voor de vaststelling van de gemiddeld tot het bedrijf behorende oppervlakte
      landbouwgrond;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel52
  - number: 52.e
    text: |-
      de administratieve vastlegging en verantwoording van gegevens omtrent de vaststelling door direct bij het doen van
      de vaststelling betrokkenen;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel52
  - number: 52.f
    text: |-
      andere voorzieningen die de uitoefening van het toezicht op de naleving van de gestelde regels kunnen
      vergemakkelijken;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel52
  - number: 52.g
    text: |-
      andere voorwaarden waaraan de vaststelling moet voldoen wil de aldus bepaalde hoeveelheid fosfaat,
      onderscheidenlijk stikstof in aanmerking worden genomen voor de bepaling van de verschuldigdheid of hoogte van de
      heffing, waaronder begrepen regels in zake de toelaatbaarheid van onderlinge menging van dierlijke meststoffen,
      overige organische meststoffen en andere meststoffen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel52
  - number: '53'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over de volgende onderwerpen:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel53
  - number: 53.b
    text: |-
      nadere voorwaarden waaraan moet zijn voldaan voor de toepassing van de verminderingen, bedoeld in de
      [artikelen 16, onderdeel b][ref1], [24, onderdeel b][ref2], en [31][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel31
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '16'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '24'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '31'
        hoofdstuk: IV
  - number: 53.c
    text: |-
      de aanmelding, bedoeld in [artikel 22][ref1], en de functionaris bij wie de aanmelding geschiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel22
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '22'
        hoofdstuk: IV
  - number: 53.d
    text: |-
      nadere voorwaarden waaraan moet zijn voldaan wil een bedrijf in aanmerking komen voor de in [artikel 22][ref1]
      bedoelde mogelijkheid, waartoe kunnen behoren:


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel22
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '22'
        hoofdstuk: IV
  - number: 53.d.1
    text: |-
      de verplichting om in [bijlage D][ref1] bij de wet als aanvoerpost, onderscheidenlijk afvoerpost benoemde
      meststoffen, producten of dieren uitsluitend af te nemen van, onderscheidenlijk af te leveren aan door
      Onze Minister overeenkomstig bij ministeriële regeling gestelde erkenningsvoorwaarden erkende leveranciers,
      onderscheidenlijk afnemers;


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 53.d.2
    text: |-
      de verplichting om aan het slot van het voorgaande kalenderjaar aanwezige voorraden van in [bijlage D][ref1] bij
      deze wet als aanvoerpost benoemde producten of dieren in aanmerking te nemen als mineralenaanvoer als bedoeld in
      [artikel 24][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel24
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '24'
        hoofdstuk: IV
  - number: 53.e
    text: |-
      de ingevolge [artikel 42a][ref1] bij de aangifte van de heffing over te leggen verklaring;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel42a
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 42a
        hoofdstuk: IV
  - number: 53.f
    text: |-
      de regels waaraan de producenten, leveranciers en afnemers van de in [bijlage D][ref1] bij deze wet opgenomen
      meststoffen, producten en dieren, al dan niet in het kader van een erkenning als bedoeld in onderdeel d, onder 1°,
      moeten voldoen, waaronder het opmaken, bewaren, overleggen en afdragen van gegevens, bescheiden en bewijsstukken
      met betrekking tot de door hen geproduceerde, in voorraad gehouden, ontvangen, verhandelde en gebruikte aantallen
      of hoeveelheden van de meststoffen, producten en dieren, alsmede de daarmee gepaard gaande hoeveelheid fosfaat,
      onderscheidenlijk stikstof;


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 53.g
    text: |-
      de voor de bepaling van de verschuldigdheid en hoogte van de heffing, dan wel voor het toezicht op de naleving van
      de voorwaarden voor vrijstelling van de heffing op te maken, te bewaren, over te leggen en af te dragen gegevens,
      bescheiden en bewijsstukken;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel53
  - number: 53.h
    text: |-
      alle onderwerpen die in aanvulling op de [Algemene wet inzake rijksbelastingen][ref1] of de
      [Invorderingswet 1990][ref2] moeten worden geregeld met betrekking tot de uitvoering van het bij of krachtens dit
      hoofdstuk bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: '54'
    text: |-
      In afwijking van de [artikelen 16][ref1] en [17, derde lid][ref2], en van de [artikelen 24][ref3] en
      [25, eerste lid][ref4], juncto de [artikelen D1, eerste lid, onderdeel a, en D4, tweede lid, van bijlage D][ref5]
      bij deze wet, wordt de hoeveelheid fosfaat in andere meststoffen eerst vanaf een bij koninklijk besluit te bepalen
      tijdstip in aanmerking genomen bij de bepaling van onderscheidenlijk de belastbare hoeveelheid meststoffen, bedoeld
      in [artikel 16][ref6] en de belastbare hoeveelheid mineralen, bedoeld in [artikel 24][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0004054
      [ref6]: https://wetten.overheid.nl/BWBR0004054#Artikel16
      [ref7]: https://wetten.overheid.nl/BWBR0004054#Artikel24
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '16'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '17'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '24'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0004054
        artikel: '25'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0004054
      - id: ref6
        bwb_id: BWBR0004054
        artikel: '16'
        hoofdstuk: IV
      - id: ref7
        bwb_id: BWBR0004054
        artikel: '24'
        hoofdstuk: IV
  - number: '55.1'
    text: |-
      Het is verboden de productie van dierlijke meststoffen op een bedrijf uit te breiden indien de productie groter is
      of daarmee groter wordt dan 125 kilogram fosfaat per hectare per jaar van de tot het bedrijf behorende oppervlakte
      landbouwgrond.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55
  - number: '55.2'
    text: |-
      Indien geen productie van dierlijke meststoffen op een bedrijf plaatsvond, is het verboden dierlijke meststoffen
      te produceren in een grotere hoeveelheid dan 125 kilogram fosfaat per hectare per jaar van de tot het bedrijf
      behorende oppervlakte landbouwgrond.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55
  - number: '55.3'
    text: |-
      Het is verboden dierlijke meststoffen te produceren op een bedrijf waarvan de daartoe behorende oppervlakte
      landbouwgrond na inwerkingtreding van dit artikel is verkleind, tenzij de productie is verminderd met een
      hoeveelheid die overeenkomt met 125 kilogram fosfaat per hectare per jaar waarmee deze verkleining heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55
  - number: '55.4'
    text: 'Het bepaalde in het derde lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55
  - number: 55.4.a
    text: |-
      indien de productie van dierlijke meststoffen op het bedrijf na verkleining van de daartoe behorende oppervlakte
      landbouwgrond de 125 kilogram fosfaat per hectare per jaar niet overschrijdt;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55
  - number: 55.4.b
    text: |-
      indien de verkleining van de tot het bedrijf behorende oppervlakte landbouwgrond behoort tot een bij algemene
      maatregel van bestuur vastgestelde categorie van gevallen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55
  - number: '55.5'
    text: |-
      Voor de toepassing van het eerste lid wordt onder een uitbreiding van de productie van dierlijke meststoffen
      verstaan een grotere productie van dierlijke meststoffen dan de productie die blijkt uit de gegevens als bedoeld
      in [artikel 7][ref1], met dien verstande dat indien het bedrijf een varkens- en pluimveehouderijbedrijf betreft als
      bedoeld in artikel 1, eerste lid, van de Interimwet beperking varkens- en pluimveehouderijen (Stb*.* 1985, 1) deze
      productie niet groter is dan zoals die ten tijde van de werking van die wet toegestaan was.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel7
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '7'
        hoofdstuk: III
  - number: '55.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald wat voor daarbij aan te wijzen categorieën
      producenten van dierlijke meststoffen op daarbij aan te geven andere dan in het vijfde lid bedoelde wijze, voor
      de toepassing van het eerste lid dient te worden verstaan onder een uitbreiding van de productie van dierlijke
      meststoffen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55
  - number: '55.7'
    text: |-
      Indien aan [bijlage A][ref1] bij deze wet een diersoort wordt toegevoegd, is het gedurende drie jaren na
      inwerkingtreding van de betreffende wijziging van de bijlage verboden de hoeveelheid dierlijke meststoffen, die
      door deze diersoort op een bedrijf wordt geproduceerd, vervolgens te laten produceren door diersoorten die voordien
      wel in de bijlage waren opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '55.8'
    text: |-
      Voor de toepassing van dit artikel wordt de hoeveelheid geproduceerde dierlijke meststoffen vastgesteld op basis
      van het gemiddelde aantal in het betreffende kalenderjaar gehouden, uitgeschaarde of tijdelijk elders ter weiding
      ondergebrachte dieren, van de onderscheiden diercategorieën en op basis van de forfaitaire productienormen voor
      de onderscheiden diercategorieën, uitgedrukt in kilogrammen fosfaat per dier per jaar, die zijn opgenomen in
      [bijlage A][ref1] bij deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '55.9'
    text: |-
      Met ingang van het tijdstip van inwerkingtreding van [artikel 15 van de Wet herstructurering varkenshouderij][ref1]
      wordt voor de toepassing van het eerste, tweede en derde lid, voor de toepassing van de [artikelen 57][ref2] en
      [58][ref3], en voor de toepassing van [artikel 3 van de Wet verplaatsing mestproductie][ref4] de mestproductie
      afkomstig van de diersoort varken niet langer in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0006285#Artikel3
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '57'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '58'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0006285
        artikel: '3'
  - number: '55.10'
    text: |-
      Met ingang van het tijdstip van inwerkingtreding van [artikel 58c][ref1] wordt voor de toepassing van het eerste,
      tweede en derde lid, voor de toepassing van de [artikelen 57][ref2] en [58][ref3], en voor de toepassing van
      [artikel 3 van de Wet verplaatsing mestproductie][ref4] de mestproductie afkomstig van de diersoorten kip en
      kalkoen niet langer in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58c
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0006285#Artikel3
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58c
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '57'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0004054
        artikel: '58'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0006285
        artikel: '3'
  - number: '55.11'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze titel worden de dierlijke meststoffen afkomstig van de
      diersoort parelhoender niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55
  - number: 55a.1
    text: |-
      Met ingang van het tijdstip van inwerkingtreding van de [Wet herstructurering varkenshouderij][ref1] wordt
      voor de toepassing van [artikel 55, eerste lid, onder][ref2] uitbreiding van de productie van dierlijke
      meststoffen verstaan: een grotere productie van dierlijke meststoffen dan het mestproductierecht dat is
      verminderd met de hoeveelheid fosfaat die wordt bepaald door het overeenkomstig [hoofdstuk II][ref3] van
      de Wet herstructurering varkenshouderij bepaalde varkensrecht achtereenvolgens te vermenigvuldigen met
      100/90 en 7,4 kilogram fosfaat, en het product te vermeerderen met de latente ruimte. De vermindering
      geschiedt eerst ten aanzien van het de dag voorafgaand aan het tijdstip van inwerkingtreding van
      [artikel 15 van de Wet herstructurering varkenshouderij][ref4] geldende niet-gebonden mestproductierecht voor
      varkens en kippen, en vervolgens ten aanzien van het op die dag geldende nietgebonden recht voor andere diersoorten
      dan varkens en kippen. Geen vermindering geschiedt ten aanzien van het grondgebonden mestproductierecht.


      [ref1]: https://wetten.overheid.nl/BWBR0009542
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0004054#HoofdstukII
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel15
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0009542
      - id: ref2
        bwb_id: BWBR0004054
        artikel: '55'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0004054
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0009542
        artikel: '15'
  - number: 55a.2
    text: De vermindering vindt slechts plaats indien het varkensrecht groter is dan nihil.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55a
  - number: 55a.3
    text: |-
      Ingeval [artikel 24 van de Wet herstructurering varkenshouderij][ref1] van toepassing is, wordt in het eerste lid
      in plaats van 100/90 gelezen: 100 gedeeld door het getal voor het percentage dat in plaats van het percentage 90 is
      vastgesteld op basis van [artikel 24 van de Wet herstructurering varkenshouderij][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel24
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0009542
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '24'
  - number: 55a.4
    text: |-
      De latente ruimte komt overeen met het aantal kilogrammen fosfaat dat wordt bepaald door het niet-gebonden
      mestproductierecht voor varkens en kippen 1996 te verminderen met de overeenkomstig artikel 55, negende lid, van de
      Meststoffenwet bepaalde mestproductie afkomstig van de in 1996 gemiddeld op het bedrijf gehouden varkens en kippen
      en andere in [bijlage A][ref1] bij de wet opgenomen diersoorten, die zijn opgegeven in de aangifte overschotheffing
      1996, bedoeld in [artikel 5, eerste lid, onderdeel c, van de Wet herstructurering varkenshouderij][ref2]. De
      latente ruimte is ten minste nihil. De mestproductie afkomstig van andere diersoorten dan varkens en kippen wordt
      slechts in aanmerking genomen voor zover deze groter is dan de som van het met betrekking tot 1996 geldende niet-
      gebonden mestproductierecht voor andere diersoorten dan varkens en kippen en het met betrekking tot 1996 geldende
      grondgebonden mestproductierecht, zoals deze rechten met betrekking tot 1996 voor het desbetreffende bedrijf door
      het Bureau Heffingen zijn geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel5
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0004054
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '5'
  - number: 55a.5
    text: |-
      Indien het varkensrecht van het desbetreffende bedrijf wordt bepaald overeenkomstig
      [artikel 7 van de Wet herstructurering varkenshouderij][ref1], wordt de latente ruimte bepaald door overeenkomstige
      toepassing van het vierde lid, met dien verstande dat in het vierde lid en in artikel 1, eerste lid, onderdeel ad,
      in plaats van «1996» telkens wordt gelezen «1995» en in plaats van «[artikel 5, eerste lid, onderdeel c][ref2]»
      wordt gelezen: [artikel 5, eerste lid, onderdeel b][ref3]. Indien het varkensrecht van het desbetreffende bedrijf
      wordt bepaald overeenkomstig [artikel 8 van de Wet herstructurering varkenshouderij][ref4], komt de latente
      ruimte overeen met 18% van het overeenkomstig het eerste lid van voornoemd [artikel 8][ref5] bij wijze van melding
      aangegeven deel van het niet-gebonden mestproductierecht voor varkens en kippen 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0009542#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel8
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel55a
