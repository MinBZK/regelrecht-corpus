  - number: 58ao.1.a
    text: |-
      de overeenkomst, zoals deze schriftelijk is vastgelegd, is aan het Bureau Heffingen verzonden en op het
      desbetreffende moment blijkens de registratie van dat bureau ontvangen;
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58ao
  - number: 58ao.1.b
    text: |-
      de wederpartij bij de overeenkomst is niet in overtreding van de in de [artikelen 58aj, eerste lid][ref1],
      [58ak, eerste lid][ref2], [58aka, eerste lid][ref3], en [58al][ref4] gestelde verboden;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58aj
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58ak
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58aka
