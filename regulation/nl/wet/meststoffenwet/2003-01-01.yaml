        paragraaf: '4'
  - number: 58an.5
    text: |-
      Het Bureau Heffingen verzendt binnen 13 weken na het tijdstip, bedoeld in [artikel 58aj, tweede lid][ref1],
      aan elk van de partijen bij de mestafzetovereenkomst een overzicht van de gegevens met betrekking tot de
      mestplaatsingsruimte, onderscheidenlijk de mestaanvoerruimte van diens bedrijf, zoals deze door het bureau zijn
      geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58aj
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58an
    references:
