      begrepen de oppervlakte waarop zich de bedrijfsgebouwen bevinden, die tot het bedrijf in eigendom behoort, dan wel
      daartoe behoort ingevolge een zakelijk gebruiksrecht of een door de grondkamer geregistreerde, onderscheidenlijk
      goedgekeurde pachtovereenkomst als bedoeld in de [artikelen 70f, eerste lid][ref1], onderscheidenlijk [12][ref2]
      of [70f, vijfde lid, van de Pachtwet][ref3];


