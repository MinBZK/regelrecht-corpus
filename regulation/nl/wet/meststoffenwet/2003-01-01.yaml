        artikel: '59'
        hoofdstuk: VI
  - number: '68'
    text: |-
      Onze Minister doet over de werking van deze wet telkens na twee jaren een verslag aan de beide Kamers der Staten-
      Generaal toekomen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel68
  - number: '69.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel69
  - number: '69.2'
    text: |-
      Het besluit, bedoeld in het eerste lid, wordt genomen in overeenstemming met Onze bij algemene maatregel van
      bestuur aangewezen Ministers.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel69
  - number: '69.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel69
  - number: '70'
    text: |-
      Onze Minister kan voorschriften geven betreffende de monsterneming, de verpakking, de conservering, de verzegeling,
      de verzending en het onderzoek van de in [artikel 5:18 van de Algemene wet bestuursrecht][ref1] bedoelde monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '71.1'
    text: |-
      In [artikel 1a, onder 3°, van de Wet op de economische delicten][ref1] vervalt op een bij koninklijk besluit te
      bepalen tijdstip: de [Meststoffenwet 1947][ref2], de [artikelen 2][ref3] en [4][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0002028
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel4
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel71
