  - number: '66'
    text: |-
      Onze Minister kan de bevoegdheden die hem toekomen ingevolge [artikel 41, eerste lid][ref1], en de
      bevoegdheden tot het verlenen van erkenningen en tot het stellen van erkenningsvoorwaarden, bedoeld in de
      [artikelen 52, onderdeel c][ref2], en [53, onderdeel d, onder 1°][ref3], delegeren.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel53
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel66
