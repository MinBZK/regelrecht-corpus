        artikel: 58aj
        hoofdstuk: V
        paragraaf: '4'
  - number: 58ao.1
    text: |-
      Voor de toepassing van de [artikelen 58ae][ref1], [58ah, onderdeel a, onder 3° en 4°][ref2], en
      [58ai onderdeel a, onder 3° en 4°][ref3], en voor de toepassing van deze bepalingen in samenhang met de
      [artikelen 58aj, derde lid][ref4], en [58ak, derde lid][ref5], wordt de hoeveelheid dierlijke meststoffen die op
      grond van een mestafzetovereenkomst naar een ander bedrijf, een erkende tussenpersoon, een erkende mestverwerker
      of een erkende exporteur kan worden afgevoerd uitsluitend in aanmerking genomen indien is voldaan aan elk van de
      volgende voorwaarden:


