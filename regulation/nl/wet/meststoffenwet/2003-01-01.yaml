  - number: 71a
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel71a
  - number: 74a
    text: |-
      De [ titels 1][ref1] en [2 van hoofdstuk V][ref2] vervallen met ingang van 1 januari 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0004054#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004054
        hoofdstuk: V
  - number: '75'
    text: |-
      De verschillende artikelen van deze wet of onderdelen daarvan, komen te vervallen op een bij algemene maatregel
      van bestuur te bepalen tijdstip dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel75
  - number: '76.1'
    text: 'Deze wet kan worden aangehaald als: Meststoffenwet.'
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel76
  - number: '76.2'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel76
