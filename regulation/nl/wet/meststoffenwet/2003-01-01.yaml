  - number: 58k.1.b
    text: |-
      de belanghebbende met betrekking tot het bedrijf een melding als bedoeld in
      [artikel 14 van de Wet herstructurering varkenshouderij][ref1] heeft gedaan en, indien deze melding betrekking
      had op het gehele varkensrecht, verzoekt om doorhaling van de gegevens, bedoeld in [artikel 7, tweede lid][ref2],
      voor de omvang van de latente ruimte, bedoeld in [artikel 55a, eerste, vierde, vijfde en zesde lid][ref3],
      zoals deze ruimte in voorkomend geval in afwijking van dat artikel wordt bepaald op grond van krachtens de
      [artikelen 55, zesde lid][ref4], en [61][ref5] van de wet gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel55a
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel55
