        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0009542
        artikel: '24'
  - number: 58k.2.c
    text: |-
      ingeval het eerste lid, onderdeel c of d, op het bedrijf van toepassing is, het op 5 november 1998 voor het bedrijf
      geldende mestproductierecht of, indien de aldus bepaalde omvang van het pluimveerecht kleiner is, de in 1998
      geproduceerde hoeveelheid dierlijke meststoffen afkomstig van kippen en kalkoenen.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58k
  - number: 58k.3
    text: |-
      Bij de in het eerste lid bedoelde maatregel kunnen voor de toepassing van dit artikel nadere regels worden gesteld
      en kan de toepasselijkheid van dit artikel worden beperkt en aan voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58k
  - number: 58l
    text: |-
      Het pluimveerecht bepaald overeenkomstig deze paragraaf of de krachtens [artikel 58k][ref1] gestelde regels komt
      ten hoogste overeen met het op de dag voorafgaande aan het tijdstip van inwerkingtreding van [artikel 58c][ref2]
      voor het bedrijf geldende mestproductierecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58c
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58l
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58k
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58c
        hoofdstuk: V
        paragraaf: '2'
  - number: 58m
    text: |-
      Met betrekking tot een daartoe door de belanghebbende aangemeld bedrijf geldt in plaats van het overeenkomstig deze
      paragraaf bepaalde pluimveerecht een lager pluimveerecht overeenkomstig de in de melding gedane opgave.
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58m
  - number: 58n.1
    text: |-
      De belanghebbende doet de in de [artikelen 58g, tweede en derde lid][ref1], [58i, vierde lid][ref2],
      [58j, eerste lid][ref3], [58k, eerste lid][ref4], en [58m][ref5] bedoelde meldingen binnen zes weken na
      inwerkingtreding van artikel 58c bij het Bureau Heffingen, met gebruikmaking van een daartoe bestemd, door het
      Bureau Heffingen op verzoek van de belanghebbende ter beschikking gesteld formulier, dat overeenkomstig de op het
      formulier aangegeven wijze volledig en naar waarheid is ingevuld en door de belanghebbende is ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58g
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58i
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58j
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel58k
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel58m
    url: https://wetten.overheid.nl/BWBR0004054/2003-01-01#Artikel58n
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58g
        hoofdstuk: V
        paragraaf: '3'
