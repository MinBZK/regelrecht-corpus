  - number: '62'
    text: |-
      1 De op grond van [artikel 57][ref1], [58][ref2], [58a][ref3] of [59][ref4] te bepalen bestuurlijke
      boete bedraagt ten hoogste het bedrag dat is bepaald voor de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref5], per overtreding begaan door een natuurlijke
      persoon, en ten hoogste het bedrag dat is bepaald voor de zesde categorie, bedoeld in artikel 23, vierde lid, van
      het Wetboek van Strafrecht, per overtreding begaan door een rechtspersoon of een vennootschap.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de hoogte van de bestuurlijke boete
      die voor een overtreding of voor categorieën van overtredingen ten hoogste kan worden opgelegd ter zake van
      overtreding van het bij of krachtens [artikel 9, tweede en derde lid][ref6], [11, tweede en derde lid][ref7],
      [13, vierde lid][ref8], [15][ref9], [33b, vijfde lid][ref10], [34][ref11], [35][ref12], [36][ref13], [37][ref14],
      [38, derde lid][ref15], of [40][ref16] bepaalde.

      3 De op grond van het tweede lid te bepalen bestuurlijke boete bedraagt per overtreding ten hoogste het bedrag dat
      is bepaald voor de vijfde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref17].


