  - number: 32a
    text: |-
      1 De vergroting van het fosfaatrecht wordt, in afwijking van [artikel 28, tweede lid][ref1], beperkt tot 80 procent
      van de kilogrammen fosfaat waarop de kennisgeving, bedoeld in [artikel 27, eerste lid][ref2], betrekking heeft.

      2 De beperking, bedoeld in het eerste lid, is niet van toepassing voor overgang van het fosfaatrecht:

      a. door erfopvolging,

      b. naar een persoon waarmee bloed- of aanverwantschap bestaat in de eerste, tweede of derde graad, of

      c. naar een bedrijf waarvan dit fosfaatrecht, uitgedrukt in hetzelfde aantal kilogrammen fosfaat, eerder gedurende
      het kalenderjaar is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel27
