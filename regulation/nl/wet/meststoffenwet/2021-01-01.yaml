  - number: '75'
    text: |-
      [Artikel 74, eerste lid][ref1], is niet van toepassing indien met betrekking tot de in dat lid bedoelde overgang:

      a. vóór 23 april 2010 een kennisgeving als bedoeld in [artikel 27, eerste lid][ref2], heeft plaatsgevonden; of

      b. vóór 23 april 2010 een schriftelijke overeenkomst is gesloten en vóór 8 mei 2010 een kennisgeving als bedoeld in
      [artikel 27, eerste lid][ref3], heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel74
