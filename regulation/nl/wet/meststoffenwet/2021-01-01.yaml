  - number: 22a
    text: |-
      1 Onze Minister kan ten aanzien van een bedrijf waarvan het fosfaatrecht is overschreden bepalen dat het gehouden
      melkvee op enig moment de door hem vastgestelde aantallen niet mogen overschrijden.

      2 De in het eerste lid bedoelde aantallen komen overeen met het melkvee dat overeenkomstig het fosfaatrecht
      gemiddeld gedurende het jaar kan worden gehouden op basis van de overeenkomstig [artikel 35][ref1] vastgestelde
      forfaitaire productienormen.

      3 Onverminderd [artikel 21][ref2] is het een landbouwer op zijn bedrijf verboden op enig moment meer melkvee te
      houden dan het door Onze Minister vastgestelde aantal, bedoeld in het eerste lid.

      4 [Artikel 22, vierde lid][ref3], is van overeenkomstige toepassing.


