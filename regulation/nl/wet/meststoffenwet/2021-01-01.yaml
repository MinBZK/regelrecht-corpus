  - number: 33c
    text: |-
      1 Bij regeling van Onze Minister wordt het percentage, bedoeld in [artikel 33a, tweede lid, onderdeel b][ref1],
      vastgesteld, dat voor verschillende diersoorten, diercategorieën, mestsoorten en gebieden verschillend kan worden
      vastgesteld.

      2 Onze Minister houdt bij het vaststellen van het verwerkingspercentage in ieder geval rekening met de verwachte
      productie van dierlijke meststoffen in Nederland en de beschikbare landbouwgrond in Nederland.

      3 Bij regeling van Onze Minister kan worden bepaald dat voor landbouwers voor wie op grond van het eerste lid
      meerdere verwerkingspercentages van toepassing zijn, één van de verwerkingspercentages geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel33c
