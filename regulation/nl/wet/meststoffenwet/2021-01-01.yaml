  - number: '12'
    text: |-
      1 Voor de toepassing van [artikel 8, aanhef en onderdeel a][ref1], wordt de op of in de bodem gebrachte hoeveelheid
      meststoffen bepaald door bij elkaar op te tellen de in het desbetreffende jaar op het bedrijf geproduceerde,
      aangevoerde en per saldo uit opslag gekomen hoeveelheden dierlijke meststoffen, en de uitkomst te verminderen met
      de in dat jaar van het bedrijf afgevoerde hoeveelheid dierlijke meststoffen. De hoeveelheden worden uitgedrukt in
      kilogrammen stikstof.

      2 Voor de toepassing van [artikel 8, aanhef en onderdeel b][ref2], wordt de op of in de bodem gebrachte hoeveelheid
      meststoffen bepaald overeenkomstig het eerste lid, met dien verstande dat niet alleen dierlijke meststoffen maar
      ook andere meststoffen in aanmerking worden genomen.

      3 Bij ministeriële regeling kan worden bepaald dat bij de bepaling van de in het tweede lid bedoelde hoeveelheid
      meststoffen de hoeveelheid stikstof in dierlijke meststoffen of in andere, bij de regeling omschreven organische
      meststoffen slechts voor een bij de regeling bepaald percentage in aanmerking wordt genomen. Het percentage kan
      al naar gelang de aard van de meststoffen, de periode waarin zij op of in de bodem worden gebracht en de daarbij
      toegepaste landbouwpraktijk en al naar gelang er sprake is van kleigrond, veengrond, of zand- of lössgrond, waarbij
      onderscheid kan worden gemaakt naar regio’s waarin de landbouwgrond is gelegen, dan wel van bouwland of grasland
      verschillend worden vastgesteld.

      4 Voor de toepassing van [artikel 8, onderdeel c][ref3], wordt de op of in de bodem gebrachte hoeveelheid
      meststoffen bepaald overeenkomstig het tweede lid in samenhang met het eerste lid, met dien verstande dat de
      hoeveelheden meststoffen steeds worden uitgedrukt in kilogrammen fosfaat.

      5 Bij ministeriële regeling kan worden bepaald dat bij de bepaling van de in het vierde lid bedoelde hoeveelheid
      meststoffen de hoeveelheid fosfaat in bij de regeling omschreven organische meststoffen slechts voor een bij
      de regeling bepaald deel in aanmerking wordt genomen. Dit deel kan al naar gelang de aard van de meststoffen
      verschillend worden vastgesteld.


