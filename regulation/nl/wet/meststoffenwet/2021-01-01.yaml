  - number: '33'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat ingeval van een bedrijfsoverdracht het op het bedrijf
      rustende productierecht wordt verlaagd met een bij de maatregel vastgesteld percentage.

      2 Het in het eerste lid bedoelde percentage is ten hoogste 25%.

      3 Voor verschillende groepen van gevallen kan het percentage verschillend worden vastgesteld.

      4 Onder bedrijfsoverdracht wordt mede begrepen de inbreng van een bedrijf in een maatschap en de verkrijging van
      een meerderheid van de aandelen in een vennootschap.

      5 Dit artikel is niet van toepassing op een overdracht aan een persoon waarmee bloed- of aanverwantschap in de
      eerste graad bestaat, of op de inbreng in een maatschap met een zodanige persoon, en evenmin op een verkrijging van
      een bedrijf onder algemene titel.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel33
  - number: 33Aa
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over het omzetten door Onze Minister van een
      productierecht in een varkensrecht, pluimveerecht of fosfaatrecht met dien verstande dat de landbouwer op wiens
      bedrijf het om te zetten productierecht rust met omzetting instemt en de omzetting geen toename veroorzaakt van de
      hoeveelheid geproduceerde stikstofverbindingen, fosfaat en fijnstof.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel33Aa
  - number: 33Ab
    text: |-
      1 Bij algemene maatregel van bestuur kan een percentage worden vastgesteld waarmee het fosfaatrecht op een in die
      maatregel vastgesteld tijdstip wordt verminderd indien is vastgesteld dat de totale omvang van de productie van
      meststoffen afkomstig van melkvee, uitgedrukt in kilogrammen fosfaat of kilogrammen stikstof, de maximale omvang
      van die productie, bedoeld in [artikel 18a, tweede lid][ref1], heeft overschreden en de noodzakelijke verlaging van
      de totale omvang van de productie niet op een minder ingrijpende wijze kan worden bereikt, mede gelet op de totale
      omvang van de productie van dierlijke meststoffen in relatie tot de nationale plafonds, opgenomen in artikel 18a,
      eerste lid.

      2 De totale omvang van de productie van meststoffen afkomstig van melkvee en van de productie van dierlijke
      meststoffen, bedoeld in het eerste lid, betreft de totale productie in het voorafgaande kalenderjaar die
      overeenkomstig artikel 18a, vijfde lid, is bekendgemaakt.

      3 De vermindering, bedoeld in het eerste lid is niet groter dan overeenkomt met de overschrijding van de maximale
      omvang van de productie, bedoeld in [artikel 18a, tweede lid][ref2].

      4 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kan voor de vermindering, bedoeld
      in het eerste lid, een vergoeding worden vastgesteld die kan worden toegekend in de bij of krachtens die maatregel
      aangegeven gevallen en onder de bij of krachtens die maatregel vastgestelde voorwaarden en beperkingen.

      5 Het bepaalde in het eerste lid is niet van toepassing op een bedrijf waarvan de productie van dierlijke
      meststoffen door melkvee in kilogrammen fosfaat, twee kalenderjaren voorafgaande aan het tijdstip, bedoeld in het
      eerste lid, verminderd met de fosfaatruimte in dat kalenderjaar, negatief of nul is.

      6 Bij de toepassing van het percentage, bedoeld in het eerste lid, wordt het fosfaatrecht van een bedrijf
      slechts verminderd voor zover een gehele uitoefening van het fosfaatrecht de fosfaatruimte van dat bedrijf, twee
      kalenderjaren voorafgaande aan het tijdstip, bedoeld in het eerste lid, te boven gaat.

      7 In afwijking van het vijfde lid, is een vermindering van het fosfaatrecht in het kalenderjaar 2018 niet van
      toepassing op een bedrijf waarvan de productie van dierlijke meststoffen door melkvee in kilogrammen fosfaat in het
      kalenderjaar 2015, verminderd met de fosfaatruimte in dat kalenderjaar, negatief of nul is. Bij de toepassing van
      het percentage, bedoeld in het eerste lid, wordt, in afwijking van het zesde lid, het fosfaatrecht van een bedrijf
      slechts verminderd voor zover een gehele uitoefening van het fosfaatrecht de fosfaatruimte in het kalenderjaar 2015
      van dat bedrijf te boven gaat.

      8 Het ontwerp van een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt aan beide
      kamers der Staten-Generaal overgelegd. De voordracht voor de vast te stellen algemene maatregel van bestuur kan
      worden gedaan nadat vier weken na de overlegging zijn verstreken, tenzij binnen die termijn door of namens een
      der kamers of door ten minste een vijfde van het grondwettelijke aantal leden van een der kamers de wens te kennen
      wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt
      een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel18a
