      Uiterlijk twee weken nadat het totaal aantal fosfaatrechten niet meer bedraagt dan het fosfaat productie plafond,
      bedoeld in de staatssteunbeschikking van de Europese Commissie van 19 december 2017 (C(2017) 8483), wordt bij
