        bwb_id: BWBR0004054
        artikel: 33a
        hoofdstuk: V
  - number: 33d
    text: |-
      1 Een verwerker verwerkt de hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, waarvoor hij met
      betrekking tot een kalenderjaar mestverwerkingsovereenkomsten heeft gesloten.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld inzake de termijnen waarbinnen aan
      de verplichting, bedoeld in het eerste lid, moet zijn voldaan.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat krachtens die maatregel aan te wijzen soorten dierlijke
      meststoffen niet meetellen voor het voldoen aan de verplichting, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel33d
  - number: '34'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het opmaken, bewaren, overleggen en
      afdragen van gegevens door natuurlijke personen, rechtspersonen of samenwerkingsverbanden van natuurlijke personen
      of rechtspersonen die meststoffen produceren, verhandelen, gebruiken of verwerken. Deze regels kunnen betrekking
      hebben op:

      a. het bedrijf of de onderneming, zoals de aard en de locatie van het bedrijf of de onderneming en van de daartoe
      behorende onderdelen en bedrijfsmiddelen, de tenaamstelling of handelsnaam, de rechtsvorm, in voorkomend geval de
      aard en samenstelling van het samenwerkingsverband van personen of rechtspersonen dat het bedrijf of de onderneming
      voert, de inschrijving in het handelsregister en de bij het bedrijf of de onderneming werkzame personen en hun
      bevoegdheden;

      b. de geproduceerde, in voorraad gehouden, aangevoerde, afgevoerde, verhandelde, be- of verwerkte, op of in de
      bodem gebrachte en anderszins gebruikte hoeveelheden meststoffen, de samenstelling, herkomst en bestemming van de
      meststoffen en de gegevens, bedoeld in [artikel 35, tweede lid, onderdelen b en c][ref1];

      c. de tot het bedrijf behorende oppervlakte landbouwgrond en de overige gebruikte grond, met inbegrip van gegevens
      over naar de aard van de teelt of het gebruik te onderscheiden aaneengesloten oppervlakten en de topografische
      ligging daarvan, en met inbegrip van gegevens met betrekking tot grond die nog in gebruik moet worden genomen en
      met betrekking tot nog aan te vangen teelten en vormen van gebruik;

      d. het bepaalde bij of krachtens de [artikelen 33a][ref2], [33b][ref3] en [33d][ref4].

      2 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat:

      a. het opmaken, bewaren, overleggen en afdragen van gegevens, bedoeld in het eerste lid, uitsluitend langs
      elektronische weg kan geschieden, en

      b. Onze Minister onder voorwaarden ontheffing kan verlenen van het bepaalde op grond van onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel33b
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel33d
