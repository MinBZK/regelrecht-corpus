  - number: '74'
    text: |-
      1 Voor de toepassing van de [artikelen 19][ref1] en [20, eerste lid][ref2], wordt ten aanzien van een bedrijf
      dat geheel of gedeeltelijk is gelegen in een concentratiegebied, van het op dat bedrijf rustende varkensrecht
      onderscheidenlijk pluimveerecht dat deel buiten beschouwing gelaten dat in de periode met ingang van 23 april 2010
      tot het tijdstip van inwerkingtreding van dit artikel, is overgegaan van een bedrijf dat geheel of gedeeltelijk is
      gelegen buiten dat concentratiegebied.

      2 Het is verboden varken, kippen of kalkoenen te houden op een locatie gelegen in een concentratiegebied indien
      deze varkens-, kippen- of kalkoenenhouderij na 22 april 2010 binnen een bedrijf is verplaatst van een locatie
      gelegen buiten dat concentratiegebied.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel20
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel74
