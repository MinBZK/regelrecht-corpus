  - number: '26'
    text: |-
      1 Een varkensrecht of pluimveerecht, of een gedeelte daarvan, afkomstig van een bedrijf dat geheel of gedeeltelijk
      is gelegen in het ene concentratiegebied kan niet overgaan naar een bedrijf dat geheel of gedeeltelijk is gelegen
      in het andere concentratiegebied.

      2 Een varkensrecht of pluimveerecht, of een gedeelte daarvan, afkomstig van een bedrijf dat geheel of gedeeltelijk
      is gelegen buiten de concentratiegebieden kan niet overgaan naar een bedrijf dat geheel of gedeeltelijk is gelegen
      in een concentratiegebied.

      3 Een bedrijf is gedeeltelijk gelegen in een concentratiegebied, als een of meer voor de varkens-, kippen- of
      kalkoenenhouderij bestemde stallen in dat gebied zijn gelegen.

      4 In zoverre in afwijking van het eerste lid kan een varkensrecht of pluimveerecht, of een gedeelte daarvan,
      afkomstig van een bedrijf dat geheel is gelegen in een van de concentratiegebieden overgaan naar een bedrijf dat
      in beide concentratiegebieden is gelegen, onder de voorwaarde dat het productierecht, of gedeelte daarvan, na
      overgang uitsluitend wordt gebruikt ten behoeve van de varkens-, kippen- of kalkoenenhouderij op een locatie die in
      hetzelfde concentratiegebied is gelegen als het bedrijf waarvan het afkomstig is.

      5 Het eerste en het tweede lid gelden niet ingeval van overgang van het varkensrecht of pluimveerecht bij een
      samenvoeging van bedrijven.

      6 Het is verboden om binnen een bedrijf de varkens-, kippen- of kalkoenenhouderij te verplaatsen:

      a. van een locatie gelegen buiten de concentratiegebieden naar een locatie gelegen in een concentratiegebied, of

      b. van een locatie gelegen in het ene concentratiegebied naar een locatie gelegen in het andere concentratiegebied.

      7 Het eerste, tweede en zesde lid zijn niet van toepassing voor zover een bedrijf dat geheel of gedeeltelijk
      is gelegen in een concentratiegebied de geproduceerde hoeveelheid dierlijke meststoffen in verband met het
      varkensrecht of pluimveerecht of gedeelte daarvan dat overgaat, dan wel de varkens-, kippen- of kalkoenhouderij
      die wordt verplaatst, zelf verwerkt door middel van mestverwerking of mestvergisting en deze hoeveelheid buiten de
      markt voor dierlijke mest wordt gehouden.

      8 Bij regeling van Onze Minister kunnen nadere regels worden gesteld ter uitvoering van het zevende lid.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel26
  - number: '27'
    text: |-
      1 De belanghebbende naar wiens bedrijf het productierecht, of gedeelte daarvan, moet overgaan en de belanghebbende
      van wiens bedrijf het productierecht, of gedeelte daarvan, afkomstig is, geven van de overgang kennis aan Onze
      Minister.

      2 Er kan pas aanspraak worden gemaakt op het van het andere bedrijf afkomstige productierecht, of gedeelte daarvan,
      met ingang van het tijdstip van registratie van de kennisgeving door Onze Minister.

      3 Bij ministeriële regeling worden regels gesteld over de wijze waarop de kennisgeving wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel27
  - number: '28'
    text: |-
      1 Op het tijdstip van registratie van de kennisgeving, bedoeld in [artikel 27, tweede lid][ref1], vindt een
      verkleining plaats van het varkensrecht, pluimveerecht of fosfaatrecht van het bedrijf waarvan het desbetreffende
      productierecht, of gedeelte daarvan, afkomstig is, en vindt een vergroting plaats van het varkensrecht, het
      pluimveerecht of fosfaatrecht van het bedrijf waarnaar het desbetreffende productierecht, of gedeelte daarvan,
      overgaat.

      2 De verkleining en de vergroting komen overeen met het aantal varkenseenheden, pluimvee-eenheden, of kilogrammen
      fosfaat waarop de kennisgeving betrekking heeft.

      3 Voor het jaar waarin de kennisgeving wordt geregistreerd zijn de verkleining en de vergroting beperkt tot het
      deel van het desbetreffende productierecht waarvan de betrokken partijen bij de kennisgeving hebben aangegeven dat
      dit in dat jaar op het bedrijf waarvan het afkomstig is niet wordt benut.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel27
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '27'
        hoofdstuk: V
  - number: '29'
    text: |-
      1 De registratie, bedoeld in [artikel 27, tweede lid][ref1], vindt niet plaats indien:

      a. de kennisgeving niet overeenkomstig de regels, bedoeld in [artikel 27, derde lid][ref2], is gedaan,

      b. de kennisgeving betrekking heeft op een groter aantal varkenseenheden, pluimvee-eenheden of kilogrammen fosfaat
      dan overeenkomt met het desbetreffende productierecht van het bedrijf waarvan het afkomstig is,

      c. de kennisgeving betrekking heeft op het productierecht afkomstig van een bedrijf ten aanzien waarvan Onze
      Minister gebruik maakt van de in [artikel 22][ref3] of [22a][ref4] bedoelde bevoegdheid,

      d. de overgang van het productierecht in strijd is met [artikel 26][ref5], of

      e. de kennisgeving voor het overgaan van een fosfaatrecht, of gedeelte daarvan, voor 1 januari 2018 is gedaan.

      2 Indien pas na registratie blijkt dat niet aan de in het eerste lid genoemde voorwaarden is voldaan, wordt de
      registratie door Onze Minister ongedaan gemaakt. Met terugwerkende kracht tot het tijdstip van de registratie
      vervallen de rechtsgevolgen van die registratie.


