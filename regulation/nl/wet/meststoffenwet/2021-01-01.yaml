  - number: 33b
    text: |-
      1 Een mestverwerkingsovereenkomst als bedoeld in [artikel 1, eerste lid, onderdeel ee, onder 2°][ref1], of een
      overeenkomst als bedoeld in [artikel 33a, derde lid, onderdeel c][ref2], voldoet voor de toepassing van deze wet
      indien is voldaan aan de bij of krachtens de in het tweede tot en met vierde lid gestelde eisen.

      2 Een mestverwerkingsovereenkomst als bedoeld in [artikel 1, eerste lid, onderdeel ee, onder 2°][ref3], of een
      overeenkomst als bedoeld in [artikel 33a, derde lid, onderdeel c][ref4]:

      a. wordt uiterlijk in het kalenderjaar waarop de overeenkomst ziet schriftelijk op een duurzame gegevensdrager
      aangegaan en door partijen ondertekend;

      b. bevat ten minste een aanduiding van het kalenderjaar waarop de overeenkomst ziet;

      c. voldoet aan de bij regeling van Onze Minister gestelde regels.

      3 In een mestverwerkingsovereenkomst als bedoeld in [artikel 1, eerste lid, onderdeel ee, onder 2°][ref5], wordt
      opgenomen de hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, die de andere onderneming in het
      desbetreffende kalenderjaar zal afnemen en de verwerker zal afnemen met het oog op verwerking.

      4 In een overeenkomst als bedoeld in [artikel 33a, derde lid, onderdeel c][ref6], wordt opgenomen de hoeveelheid
      dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, waarvoor de andere landbouwer in het desbetreffende
      kalenderjaar in de plaats van de landbouwer uitvoering zal geven aan de voorwaarden, bedoeld in artikel 33a, tweede
      lid, onderdeel b.

      5 De gegevens uit een mestverwerkingsovereenkomst als bedoeld in
      [artikel 1, eerste lid, onderdeel ee, onder 2°][ref7], of een overeenkomst als bedoeld in
      [artikel 33a, derde lid, onderdeel c][ref8], worden uiterlijk in het kalenderjaar waarop de overeenkomst ziet langs
      elektronische weg aan Onze Minister verstrekt door alle partijen bij de overeenkomst.


