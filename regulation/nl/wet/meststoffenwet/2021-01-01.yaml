  - number: 33a
    text: |-
      1 Het is een landbouwer verboden in enig kalenderjaar op zijn bedrijf dierlijke meststoffen te produceren.

      2 Het eerste lid is niet van toepassing op een landbouwer die in het desbetreffende kalenderjaar:

      a. op zijn bedrijf geen bedrijfsoverschot produceert;

      b. een hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, minimaal gelijk aan een door Onze
      Minister voor het desbetreffende kalenderjaar vastgesteld percentage van het op zijn bedrijf geproduceerde
      bedrijfsoverschot:

      1° laat verwerken,

      2° voor zover de landbouwer behoort tot een bij regeling van Onze Minister aan te wijzen categorie landbouwers,
      overdraagt of laat overdragen aan een afnemer die behoort tot een bij regeling van Onze Minister aan te wijzen
      categorie afnemers, of

      3° brengt op of in de in het desbetreffende kalenderjaar bij het desbetreffende bedrijf in gebruik zijnde
      landbouwgrond die is gelegen in Duitsland of België op een bij regeling van Onze Minister vast te stellen afstand
      van de Nederlandse grens, voor zover is voldaan aan bij regeling van Onze Minister te stellen voorwaarden;

      c. op zijn bedrijf een bedrijfsoverschot produceert dat dusdanig in omvang is dat de hoeveelheid dierlijke
      meststoffen, uitgedrukt in kilogrammen fosfaat, bedoeld in onderdeel b, kleiner is dan een bij regeling van Onze
      Minister vast te stellen omvang, waarbij onderscheid kan worden gemaakt naar diersoort of diercategorie;

      d. op zijn bedrijf meststoffen produceert:

      1° met dieren waarvan ten minste 90% behoort tot een diercategorie die bij algemene maatregel van bestuur kan
      worden aangewezen of is gehuisvest in een huisvestingssysteem dat bij die maatregel kan worden aangewezen, omdat
      hierbij overwegend meststoffen worden geproduceerd met een hoog gehalte aan organische stof in de vorm van stro, en

      2° die voldoen aan regels die bij of krachtens algemene maatregel van bestuur kunnen worden gesteld, of

      e. het op zijn bedrijf geproduceerde bedrijfsoverschot geheel en rechtstreeks, blijkens een schriftelijke en vooraf
      gesloten overeenkomst, onder bij regeling van Onze Minister te stellen voorwaarden overdraagt of laat overdragen
      aan een hemelsbreed hoogstens twintig kilometer van de productielocatie verwijderd liggende locatie van bedrijven
      indien de overgedragen dierlijke meststoffen op landbouwgrond aangewend worden.

      3 Onder het laten verwerken van dierlijke meststoffen, bedoeld in het tweede lid, onderdeel b, onder 1°, wordt
      verstaan:

      a. het overdragen of laten overdragen van op zijn bedrijf geproduceerde dierlijke meststoffen aan een verwerkende
      onderneming, overeenkomstig een op het desbetreffende kalenderjaar betrekking hebbende mestverwerkingsovereenkomst
      als bedoeld in [artikel 1, eerste lid, onderdeel ee, onder 1°][ref1];

      b. het overdragen of laten overdragen van op zijn bedrijf geproduceerde dierlijke meststoffen aan een andere
      onderneming dan een verwerkende onderneming, op basis van een uiterlijk in het desbetreffende kalenderjaar gesloten
      mestverwerkingsovereenkomst als bedoeld in [artikel 1, eerste lid, onderdeel ee, onder 2°][ref2], of

      c. het sluiten van een overeenkomst met een andere landbouwer waarin is bepaald dat die andere landbouwer in zijn
      plaats uitvoering zal geven aan de voorwaarden, bedoeld in het tweede lid, onderdeel b, door middel van het laten
      verwerken, bedoeld in de onderdelen a of b.

      4 Een ondernemer die een andere onderneming voert als bedoeld in het derde lid, onderdeel b, draagt in een
      kalenderjaar de hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, waarvoor hij met betrekking
      tot het desbetreffende kalenderjaar mestverwerkingsovereenkomsten als bedoeld in het derde lid, onderdeel b, heeft
      gesloten, over of laat deze overdragen aan een verwerkende onderneming.

      5 Onverminderd het tweede lid, onderdeel b, laat de andere landbouwer, bedoeld in het derde lid, onderdeel c, in
      een kalenderjaar een op zijn bedrijf geproduceerde hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen
      fosfaat, waartoe hij zich met betrekking tot het desbetreffende kalenderjaar bij een overeenkomst als bedoeld in
      het derde lid, onderdeel c, heeft verplicht, verwerken als bedoeld in het derde lid, onderdeel a of b.

      6 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de mogelijkheid van het sluiten van een
      overeenkomst als bedoeld in het derde lid, onderdeel c, tussen een landbouwer die op zijn bedrijf in overwegende
      mate dierlijke meststoffen produceert van één of meer diersoorten of diercategorieën en een landbouwer die op zijn
      bedrijf in overwegende mate dierlijke meststoffen produceert van één of meer andere diersoorten of diercategorieën.

      7 Bij regeling van Onze Minister kunnen regels worden gesteld ten aanzien van een landbouwer of afnemer als bedoeld
      in het tweede lid, onderdeel b, onder 2°.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel1
