  - number: 33Ac
    text: |-
      1 Indien is vastgesteld dat de totale omvang van de productie van dierlijke meststoffen afkomstig van varkens,
      uitgedrukt in kilogrammen fosfaat of kilogrammen stikstof, de maximale omvang van die productie, bedoeld in
      [artikel 18a, derde lid][ref1], heeft overschreden en de noodzakelijke verlaging van de totale omvang van de
      productie niet op een minder ingrijpende wijze kan worden bereikt, mede gelet op het nationale plafond genoemd
      in artikel 18a, eerste lid, kan bij algemene maatregel van bestuur een percentage worden vastgesteld waarmee het
      varkensrecht op een in die maatregel vastgesteld tijdstip wordt verminderd.

      2 Indien is vastgesteld dat de totale omvang van de productie van dierlijke meststoffen afkomstig van pluimvee,
      uitgedrukt in kilogrammen fosfaat of kilogrammen stikstof, de maximale omvang van die productie, bedoeld in
      [artikel 18a, vierde lid][ref2], heeft overschreden en de noodzakelijke verlaging van de totale omvang van de
      productie niet op een minder ingrijpende wijze kan worden bereikt, mede gelet op het nationale plafond genoemd
      in artikel 18a, eerste lid, kan bij algemene maatregel van bestuur een percentage worden vastgesteld waarmee het
      pluimveerecht op een in die maatregel vastgesteld tijdstip wordt verminderd.

      3 De totale omvang van de productie, bedoeld in het eerste en tweede lid, betreft de totale productie in het
      voorafgaande kalenderjaar die overeenkomstig [artikel 18a, vijfde lid][ref3], is bekendgemaakt.

      4 De vermindering, bedoeld in het eerste of tweede lid is niet groter dan overeenkomt met de overschrijding van de
      maximale omvang van de productie, bedoeld in [artikel 18a, derde lid][ref4], onderscheidenlijk artikel 18a, vierde
      lid.

      5 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste of tweede lid, kan voor de
      vermindering, bedoeld in het eerste onderscheidenlijk tweede lid, een vergoeding worden vastgesteld die kan worden
      toegekend in de bij of krachtens die maatregel aangegeven gevallen en onder de bij of krachtens die maatregel
      vastgestelde voorwaarden en beperkingen.

      6 Het ontwerp van een krachtens het eerste en tweede lid vast te stellen algemene maatregel van bestuur wordt aan
      beide kamers der Staten-Generaal overgelegd. De voordracht voor de vast te stellen algemene maatregel van bestuur
      kan worden gedaan nadat vier weken na de overlegging zijn verstreken, tenzij binnen die termijn door of namens een
      der kamers of door ten minste een vijfde van het grondwettelijke aantal leden van een der kamers de wens te kennen
      wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt
      een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel18a
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel18a
