  - number: '76'
    text: |-
      1 De verschillende artikelen van deze wet, of onderdelen daarvan, komen te vervallen op een bij algemene maatregel
      van bestuur te bepalen tijdstip dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden
      bepaald.

      2 Op het in het eerste lid bedoelde tijdstip vervallen in [artikel 1a van de Wet op de economische delicten][ref1]
      de verwijzingen naar de betrokken artikelen of onderdelen.

      3 Een algemene maatregel van bestuur als bedoeld in het eerste lid wordt aan beide kamers der Staten-Generaal
      overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij
      koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten minste
      een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp
      bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.
      Indien het voorstel van wet wordt ingetrokken of indien een van beide kamers van de Staten-Generaal besluit het
      voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.


