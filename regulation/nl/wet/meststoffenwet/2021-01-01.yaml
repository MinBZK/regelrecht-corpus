  - number: 21a
    text: |-
      1 Onze Minister verleent aan een landbouwer, die in het kalenderjaar 2013 melkvee hield een
      melkveefosfaatreferentie, uitgedrukt in kilogrammen fosfaat. De melkveefosfaatreferentie vermeldt het bedrijf
      waarvoor de melkveefosfaatreferentie wordt afgegeven.

      2 De melkveefosfaatreferentie wordt berekend door de forfaitaire productie van dierlijke meststoffen door melkvee
      in het kalenderjaar 2013 op het bedrijf te verminderen met de fosfaatruimte van dat bedrijf in 2013. Bij de
      berekening volgens de eerste volzin wordt elk resultaat dat negatief is, op nul gesteld.

      3 Indien een landbouwer aantoont dat door bedrijfsoverdrachten tussen 1 januari 2013 en 1 november 2014, een
      lagere melkveefosfaatreferentie wordt afgegeven dan wanneer deze bedrijfsoverdrachten zouden zijn betrokken
      bij de berekening, bedoeld in het eerste lid, wordt de melkveefosfaatreferentie met inachtneming van deze
      bedrijfsoverdrachten vastgesteld.

      4 De forfaitaire productie van dierlijke meststoffen door melkvee wordt vastgesteld overeenkomstig de regels,
      bedoeld in artikel 35.

      5 De melkveefosfaatreferentie kan worden overgedragen aan een landbouwer waarmee bloed- of aanverwantschap in de
      eerste, tweede of derde graad bestaat voor het bedrijf waarvoor de melkveefosfaatreferentie is afgegeven.

      6 De melkveefosfaatreferentie gaat over aan degene die het bedrijf waarvoor deze melkveefosfaatreferentie is
      afgegeven bij erfopvolging verkrijgt.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel21a
  - number: 21b
    text: |-
      1 Het is een landbouwer verboden op zijn bedrijf in een kalenderjaar meer dierlijke meststoffen met melkvee,
      uitgedrukt in kilogrammen fosfaat, te produceren dan het op het bedrijf rustende fosfaatrecht. De productie
      van dierlijke meststoffen door melkvee wordt forfaitair vastgesteld overeenkomstig de regels, bedoeld in
      [artikel 35][ref1].

      2 In afwijking van het eerste lid kan de productie van dierlijke meststoffen door melkvee worden bepaald
      met gebruikmaking van een door Onze Minister aangewezen methode onder bij ministeriële regeling te stellen
      voorwaarden. Onze Minister kan deze methode aanwijzen indien aannemelijk is dat daarmee geen afbreuk wordt
      gedaan aan de naleving van een verplichting op grond van een voor Nederland verbindend verdrag of besluit van een
      volkenrechtelijke organisatie.

      3 Het is verboden anders dan op een bedrijf op enig moment meer melkvee te houden dan overeenkomt met een
      jaarlijkse productie van dierlijke meststoffen door melkvee van 100 kilogram fosfaat, forfaitair vastgesteld
      overeenkomstig de regels bedoeld in [artikel 35][ref2].

      4 Het ontwerp voor een krachtens het tweede lid vast te stellen ministeriële regeling wordt aan beide kamers der
      Staten Generaal overgelegd. De ministeriële regeling wordt niet eerder vastgesteld dan vier weken na de overlegging
      van het ontwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel35
