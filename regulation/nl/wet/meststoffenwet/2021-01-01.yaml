  - number: '30'
    text: |-
      1 In afwijking van [artikel 228 van Boek 3 van het Burgerlijk Wetboek][ref1] kan op het productierecht geen
      pandrecht worden gevestigd.

      2 Bij ministeriële regeling kan worden bepaald dat alvorens Onze Minister de in [artikel 27, eerste lid][ref2],
      bedoelde kennisgeving in behandeling neemt, van deze kennisgeving mededeling wordt gedaan aan in die regeling
      genoemde derdebelanghebbenden.

      3 Bij de ministeriële regeling worden nadere regels gesteld voor de uitvoering van het tweede lid, onder meer over:

      a. de wijze waarop en de termijn waarbinnen de derdebelanghebbenden zich bij Onze Minister kunnen aanmelden,

      b. de gegevens die Onze Minister aan de derdebelanghebbenden kenbaar maakt, en

      c. de periode gedurende welke Onze Minister de kennisgeving niet in behandeling neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel228
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel27
