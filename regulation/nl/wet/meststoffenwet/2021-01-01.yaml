  - number: '35'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de bepaling van:

      a. de hoeveelheden meststoffen, bedoeld in [artikel 34, eerste lid, onderdeel b][ref1], uitgedrukt in kilogrammen
      stikstof of fosfaat;

      b. de verdere samenstelling van deze meststoffen;

      c. de tot het bedrijf behorende oppervlakten, bedoeld in [artikel 34, eerste lid, onderdeel c][ref2];

      d. de aantallen gehouden, uitgeschaarde, ingeschaarde, tijdelijk elders ter weiding ondergebrachte of tijdelijk ter
      weiding aangenomen dieren en de aantallen dieren die anderszins op een bedrijf of in het kader van een onderneming
      aanwezig zijn;

      e. de aard, de fosfaattoestand en de samenstelling van de bodem alsmede de gewasopbrengst, voor zover dat relevant
      is voor de hoeveelheid meststoffen die op of in de bodem mag worden gebracht.

      2 Bij of krachtens de algemene maatregel van bestuur kunnen mede regels worden gesteld omtrent gevallen waarin,
      de voorwaarden waaronder en de wijze waarop de hoeveelheid geproduceerde dierlijke meststoffen, uitgedrukt in
      kilogrammen stikstof of fosfaat, wordt bepaald op basis van:

      a. bij of krachtens de maatregel vastgestelde forfaitaire productienormen, onderscheiden naar diersoort,
      diercategorie en bedrijfssysteem en uitgedrukt in kilogrammen stikstof, onderscheidenlijk fosfaat, per dier per
      jaar;

      b. gegevens met betrekking tot de samenstelling van het door de dieren gebruikte diervoeder en de forfaitair
      bepaalde vastlegging van stikstof, onderscheidenlijk fosfaat, in de dieren en dierlijke producten, alsmede de
      forfaitair bepaalde gasvormige verliezen van stikstof uit de stal en de mestopslagruimte;

      c. indien het melkvee betreft, de melkproductie per dier en de samenstelling van de melk;

      d. een combinatie van deze bepalingswijzen.

      3 Bij of krachtens de algemene maatregel van bestuur kunnen mede regels worden gesteld omtrent de gevallen
      waarin en de voorwaarden waaronder de hoeveelheid in voorraad gehouden, aangevoerde, afgevoerde of verhandelde
      meststoffen, uitgedrukt in kilogrammen stikstof of fosfaat, wordt bepaald op basis van bij of krachtens de
      maatregel vastgestelde forfaitaire omrekennormen, onderscheiden naar mestvorm, diersoort, diercategorie en
      bedrijfssysteem en uitgedrukt in kilogrammen stikstof, onderscheidenlijk fosfaat, per gewichts- of volume-eenheid.

      4 Bij of krachtens de algemene maatregel van bestuur worden de forfaitaire waarden, bedoeld in het tweede lid,
      onderdeel b, vastgesteld.

      Deze waarden kunnen verschillend worden vastgesteld al naar gelang, voor zover van toepassing, de diersoort
      en diercategorie, de aard en het gewicht van het dierlijke product en de aard en de omvang van de stal en de
      mestopslagruimte.

      5 Bij of krachtens de algemene maatregel van bestuur kunnen regels worden gesteld over de wijze van bepaling van de
      hoeveelheid en de samenstelling van het diervoeder en de melk, bedoeld in het tweede lid, onderdelen b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel34
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel35
