  - number: '60'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen van de [artikelen 57, eerste lid][ref1], [58, eerste lid][ref2],
      [58a][ref3] en [59][ref4] afwijkende tarieven worden vastgesteld.

      2 De afwijking bedraagt ten hoogste 50%.

      3 Na de plaatsing in het Staatsblad van de algemene maatregel van bestuur wordt een voorstel van wet tot regeling
      van het betrokken onderwerp zo spoedig mogelijk bij de Staten-Generaal ingediend. Indien het voorstel wordt
      ingetrokken of indien een van de beide kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt de
      algemene maatregel van bestuur onverwijld ingetrokken. Wordt het voorstel tot wet verheven, dan wordt de algemene
      maatregel van bestuur ingetrokken op het tijdstip van inwerkingtreding van die wet.

      4 [Artikel 1, tweede lid, van het Wetboek van Strafrecht][ref5] is van overeenkomstige toepassing.


