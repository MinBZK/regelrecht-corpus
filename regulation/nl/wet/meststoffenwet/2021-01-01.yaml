  - number: '58'
    text: |-
      1 Ingeval van overtreding van [artikel 14, eerste lid][ref1], bedraagt de bestuurlijke boete € 11 per kilogram
      fosfaat en € 7 per kilogram stikstof waarvan de afvoer niet kan worden verantwoord.

      2 In afwijking van het eerste lid wordt geen bestuurlijke boete opgelegd voor zover wegens overtreding van
      [artikel 7][ref2] een bestuurlijke boete wordt opgelegd voor de kilogrammen stikstof en fosfaat waarmee de in
      [artikel 8][ref3] bedoelde stikstofgebruiksnorm voor meststoffen, onderscheidenlijk fosfaatgebruiksnorm voor
      meststoffen is overschreden.


