  - number: '31'
    text: |-
      1 De belanghebbende kan bij Onze Minister een kennisgeving doen van het vervallen of het gedeeltelijk vervallen van
      het productierecht.

      2 Na registratie van de kennisgeving door Onze Minister is het desbetreffende productierecht nihil,
      onderscheidenlijk vindt een verkleining van dat recht plaats met het aantal varkenseenheden, pluimvee-eenheden of
      kilogrammen fosfaat waarop de kennisgeving betrekking heeft.

      3 Bij ministeriële regeling worden regels gesteld over de wijze waarop de kennisgeving wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel31
  - number: '32'
    text: |-
      1 Indien op landelijk niveau de omvang van de productie van dierlijke meststoffen, uitgedrukt in kilogrammen
      stikstof of fosfaat, afkomstig van varkens of van pluimvee de omvang van die productie, bedoeld in artikel 18a,
      derde onderscheidenlijk vierde lid, dreigt te overschrijden en mede gelet op de representativiteit van de prognose,
      het mogelijk structurele karakter van de overschrijding en op de totale omvang van de productie van dierlijke
      meststoffen in relatie tot de nationale plafonds, opgenomen in artikel 18a, eerste lid, kan, al naar gelang
      de overschrijding betrekking heeft op varkensmest of op pluimveemest, bij algemene maatregel van bestuur, in
      zoverre in afwijking van [artikel 28, tweede lid][ref1], worden bepaald dat, de vergroting van het varkensrecht,
      onderscheidenlijk dat de vergroting van het pluimveerecht wordt beperkt tot een bij de maatregel vastgesteld
      percentage van het aantal varkenseenheden, onderscheidenlijk pluimvee-eenheden waarop de kennisgeving, bedoeld in
      [artikel 27, eerste lid][ref2], betrekking heeft.

      2 Het in het eerste lid bedoelde percentage is ten minste 75%.

      3 Voor verschillende groepen van gevallen kan het percentage verschillend worden vastgesteld.

      4 De voordracht van een algemene maatregel van bestuur als bedoeld in het eerste lid wordt niet eerder gedaan dan
      vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel27
