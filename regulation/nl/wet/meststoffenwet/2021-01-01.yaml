  - number: '22'
    text: |-
      1 Onze Minister kan ten aanzien van een bedrijf waarvan het varkensrecht of het pluimveerecht is overschreden
      bepalen, dat het op enig moment gehouden aantal varkens en het op enig moment gehouden aantal kippen en kalkoenen
      de door hem vastgestelde aantallen niet mogen overschrijden.

      2 De in het eerste lid bedoelde aantallen komen overeen met het aantal varkens, onderscheidenlijk het aantal kippen
      en kalkoenen dat overeenkomstig het varkensrecht en het pluimveerecht gemiddeld gedurende het jaar mag worden
      gehouden, vermeerderd met 15%.

      3 Onverminderd de [artikelen 19][ref1] en [20][ref2] is het verboden op enig moment een groter aantal varkens of
      een groter aantal kippen en kalkoenen te houden dan het door Onze Minister vastgestelde aantal.

      4 De in het eerste lid bedoelde bevoegdheid kan ten aanzien van een bedrijf voor een aaneengesloten periode van
      ten hoogste drie jaar worden uitgeoefend. De periode kan telkens worden verlengd tot drie jaar te rekenen vanaf het
      tijdstip waarop een overtreding van het verbod, bedoeld in het derde lid, wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel20
