    text: |-
      1 Tot de voorwaarden, bedoeld in de [artikelen 9, tweede lid][ref1], en [11, derde lid][ref2], kan behoren een
      vergunning verleend door Onze Minister of de registratie van een kennisgeving door Onze Minister.

      2 Ingeval de Commissie van de Europese Gemeenschappen Nederland derogatie heeft verleend om een grotere hoeveelheid
      dierlijke meststoffen toe te staan dan de in [artikel 9, eerste lid][ref3], genoemde gebruiksnorm en aan die
      derogatie de voorwaarde heeft verbonden een monitoringsnetwerk tot stand te brengen en in stand te houden, kan bij
      de regeling, bedoeld in artikel 9, tweede lid, ter bestrijding van de jaarlijkse kosten die daarmee samenhangen,
      aan degenen die op hun bedrijf een grotere hoeveelheid dierlijke meststoffen toepassen dan de in artikel 9, eerste
      lid, genoemde gebruiksnorm, de verplichting worden opgelegd tot het betalen van een geldsom ten behoeve van ’s
      Rijks kas. De hoogte van de geldsom kan bij deze regeling verschillend worden vastgesteld al naar gelang de tot het
      bedrijf behorende oppervlakte landbouwgrond. Bij de regeling kan worden bepaald dat een kennisgeving eerst wordt
      geregistreerd nadat deze geldsom is voldaan.

      3 Bij de regeling, bedoeld in [artikel 9][ref4], kan de toepasselijkheid van een hogere hoeveelheid stikstof in
      verband met een meer dan gemiddelde stikstofopname door gewassen binnen een bepaalde soort worden verbonden aan
      de voorwaarde van een vergunning verleend door Onze Minister of de registratie van een kennisgeving door Onze
      Minister.

      4 Aan een vergunning kunnen voorschriften worden verbonden en zij kan onder beperkingen worden verleend. De
      voorschriften en beperkingen kunnen worden gewijzigd, aangevuld of ingetrokken.

      5 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het verlenen, weigeren of intrekken van
      een vergunning.


