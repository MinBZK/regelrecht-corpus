  - number: '11'
    text: |-
      1 De fosfaatgebruiksnorm voor meststoffen, bedoeld in [artikel 8, onderdeel c][ref1], bedraagt 75 kilogram fosfaat
      per hectare grasland en 40 kilogram fosfaat per hectare bouwland.

      2 Bij ministeriële regeling worden hogere fosfaatgebruiksnormen voor meststoffen vastgesteld die kunnen verschillen
      naargelang de fosfaattoestand van de bodem, het gebruik van de landbouwgrond als grasland of bouwland, de te
      telen gewassen, de toegepaste landbouwpraktijk, de gewasopbrengst, de kenmerken van de bodem, de grondsoort, de
      grondwatertoestand en de ecologie van een gebied.

      3 Bij ministeriële regeling kunnen voorwaarden of beperkingen worden gesteld aan de toepassing van hogere
      fosfaatgebruiksnormen voor meststoffen.


