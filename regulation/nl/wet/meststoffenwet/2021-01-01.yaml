  - number: '36'
    text: |-
      1 De bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 35][ref1], gestelde regels kunnen
      mede betrekking hebben op de bevoegdheid tot het doen van vaststellingen ten behoeve van de bepaling van de in
      dat artikel bedoelde hoeveelheden, hoedanigheden en oppervlakten en op de voor die vaststellingen te gebruiken
      apparatuur.

      2 De bevoegdheid tot het doen van vaststellingen kan worden verbonden aan:

      a. een door Onze Minister overeenkomstig bij of krachtens de maatregel gestelde voorwaarden verleende erkenning;

      b. een door de Raad voor Accreditatie verleende accreditatie overeenkomstig een door Onze Minister goedgekeurd
      programma van eisen.

      3 Aan een erkenning kunnen voorschriften worden verbonden en zij kan onder beperkingen worden verleend. De
      voorschriften en beperkingen kunnen worden gewijzigd, aangevuld of ingetrokken.

      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het verlenen, weigeren of intrekken van
      een erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel35
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '35'
        hoofdstuk: VI
  - number: '37'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het opmaken, bewaren,
      overleggen en afdragen van gegevens door degenen die:

      a. betrokken zijn bij het doen van vaststellingen ten behoeve van de bepaling van de hoeveelheden, hoedanigheden en
      oppervlakten, bedoeld in [artikel 34][ref1], of

      b. diervoeder of dieren, als bedoeld in [artikel 35, tweede lid, onderdeel b][ref2], op bedrijven afleveren, dan
      wel dieren, melk en andere dierlijke producten, als bedoeld in [artikel 35, tweede lid, onderdelen b en c][ref3],
      van bedrijven afnemen of be- of verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel35
