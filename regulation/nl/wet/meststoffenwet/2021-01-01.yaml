  - number: '77'
    text: |-
      1 [Hoofdstuk V, titels 1 tot en met 5][ref1], en [artikel 33Ac][ref2] vervallen op een bij koninklijk besluit te
      bepalen tijdstip.

      2 De voordracht voor het koninklijk besluit, bedoeld in het eerste lid, wordt niet eerder gedaan dan twee weken
      nadat het ontwerp ervan aan beide kamers der Staten-Generaal is overgelegd. Indien een der kamers der Staten-
      Generaal besluit niet in te stemmen met het ontwerp, wordt er geen voordracht gedaan en kan niet eerder dan zes
      weken na het besluit van die kamer der Staten-Generaal een nieuw ontwerp aan beide kamers der Staten-Generaal
      worden overgelegd.


