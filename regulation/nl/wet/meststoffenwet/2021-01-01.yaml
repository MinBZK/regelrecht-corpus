        hoofdstuk: III
  - number: '4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in het belang van de bevordering van de deugdelijkheid voor
      het doel waarvoor meststoffen zijn bestemd, alsmede in het belang van de bescherming van de bodem, het verhandelen
      van meststoffen worden verboden indien deze meststoffen niet voldoen aan de bij of krachtens die maatregel gestelde
      eisen met betrekking tot:

      a. de hoedanigheid, de aard, de gehalten aan bepaalde stoffen en verdere samenstelling, het gewicht en de
      verpakking van meststoffen;

      b. de benaming, de gebruiksaanwijzing en andere vermeldingen voor meststoffen;

      c. de wijze waarop de vermeldingen van meststoffen worden aangebracht.

      Deze eisen kunnen verschillend worden vastgesteld afhankelijk van het gebruiksdoel van de desbetreffende meststof.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel4
  - number: '5'
    text: |-
      Het is verboden een product, dat blijkens zijn aanduiding of anderszins kennelijk bestemd is om als meststof te
      worden gebruikt, te verhandelen, indien dat product niet voldoet aan de krachtens [artikel 4][ref1] met betrekking
      tot meststoffen gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel4
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '4'
        hoofdstuk: II
  - number: '6'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur bedoeld in [artikel 4][ref1] kan het verhandelen als meststof van
      producten die geheel of gedeeltelijk uit zuiveringsslib, havenslib, compost of andere soortgelijke voor bemesting
      bruikbare producten bestaan, zonder vergunning verleend door Onze Minister of door een bij de maatregel aangewezen
      overheidsorgaan, worden verboden. Daarbij kunnen tevens regels worden gesteld met betrekking tot het verlenen,
      weigeren of intrekken van een vergunning.

      2 Aan een vergunning, als bedoeld in het vorige lid, kunnen voorschriften worden verbonden. Zij kan onder
      beperkingen worden verleend. Tot de voorschriften kunnen onder meer behoren:

      a. de verplichting om van monsters, welke op een daarbij aangegeven wijze zijn genomen, analyses te verrichten ten
      aanzien van de hoedanigheid, de aard, de gehalten aan bepaalde stoffen en verdere samenstelling van de meststof;

      b. de verplichting de uitkomsten van de onder a bedoelde analyses ter beschikking te stellen aan afnemers van de
      betrokken meststof of aan te wijzen overheidsorganen;

      c. een verbod de meststof af te leveren aan bepaalde, bij het voorschrift aangewezen gebruikers of groepen van
      gebruikers, in grotere dan bij het voorschrift vastgestelde hoeveelheden;

      d. de verplichting om de naleving van de onder c bedoelde voorschriften te staven met bij het voorschrift
      vastgestelde bewijsstukken;

      e. voorschriften inzake het voeren van een administratie, welke worden gesteld om de naleving van de onder c
      bedoelde voorschriften genoegzaam te kunnen controleren.

      3 De aan een vergunning, als bedoeld in het eerste lid, verbonden voorschriften en de beperkingen waaronder zij is
      verleend, kunnen worden gewijzigd, aangevuld of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel4
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel6
