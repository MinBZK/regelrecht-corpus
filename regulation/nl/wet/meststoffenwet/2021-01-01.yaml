    text: |-
      1 Het is een landbouwer verboden op zijn bedrijf gemiddeld in een kalenderjaar een groter aantal varkens te houden
      dan het op het bedrijf rustende varkensrecht.

      2 Het is verboden anders dan op een bedrijf op enig moment een groter aantal varkens te houden dan overeenkomt met
      3 varkenseenheden.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel19
  - number: '20'
    text: |-
      1 Het is een landbouwer verboden op zijn bedrijf gemiddeld in een kalenderjaar een groter aantal kippen en
      kalkoenen te houden dan het op het bedrijf rustende pluimveerecht.

      2 Het eerste lid is niet van toepassing indien op het bedrijf op geen enkel moment een groter aantal kippen en
      kalkoenen wordt gehouden dan overeenkomt met 250 pluimvee-eenheden.

      3 Het is verboden anders dan op een bedrijf op enig moment een groter aantal kippen en kalkoenen te houden dan
      overeenkomt met 250 pluimvee-eenheden.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel20
  - number: '21'
    text: |-
      1 Het is een landbouwer verboden op zijn bedrijf in enig kalenderjaar fosfaat met melkvee te produceren.

      2 Het eerste lid is, onverminderd [artikel 21b][ref1] en [33a][ref2], niet van toepassing op een landbouwer die in
      het desbetreffende kalenderjaar:

      a. op zijn bedrijf minder dan 250 kilogram fosfaat met melkvee produceert,

      b. op zijn bedrijf geen bedrijfsoverschot produceert,

      c. op zijn bedrijf geen melkveefosfaatoverschot produceert,

      d. 100%, verminderd met het percentage, bedoeld in [artikel 33a, tweede lid, onderdeel b][ref3], van het
      melkveefosfaatoverschot:

      1°. laat verwerken,

      2°. voor zover de landbouwer behoort tot een bij regeling van Onze Minister aan te wijzen categorie landbouwers,
      overdraagt of laat overdragen aan een afnemer die behoort tot een bij regeling van Onze Minister aan te wijzen
      categorie afnemers,

      3°. brengt op of in de in gebruik zijnde landbouwgrond die is gelegen in Duitsland of België op een bij regeling
      van Onze Minister vast te stellen afstand van de Nederlandse grens, voor zover is voldaan aan bij regeling van Onze
      Minister te stellen voorwaarden,

      4°. geheel en rechtstreeks, blijkens een schriftelijke en vooraf gesloten overeenkomst, onder bij regeling van
      Onze Minister te stellen voorwaarden overdraagt of laat overdragen aan een hemelsbreed hoogstens twintig kilometer
      van de productielocatie verwijderd liggende locatie van bedrijven indien de overgedragen dierlijke meststoffen op
      landbouwgrond aangewend worden, of

      5°. produceert met dieren waarvan ten minste 90% behoort tot een diercategorie die bij algemene maatregel van
      bestuur kan worden aangewezen of is gehuisvest in een huisvestingssysteem dat bij die maatregel kan worden
      aangewezen, omdat hierbij overwegend meststoffen worden geproduceerd met een hoog gehalte aan organische stof in de
      vorm van stro en die voldoen aan regels die bij of krachtens algemene maatregel van bestuur kunnen worden gesteld.

      3 Het melkveefosfaatoverschot dat in enig jaar voor mestverwerking als bedoeld in het tweede lid, onderdeel d, in
      aanmerking komt is het melkveefosfaatoverschot dat in het jaar 2014 is ontstaan, vermeerderd met:

      a. ten hoogste 100% van het aantal additionele kilogrammen fosfaat dat in dat jaar ten opzichte van het jaar 2014
      met melkvee wordt geproduceerd indien het overschot per hectare lager is dan 20 kg/ha;

      b. ten hoogste 75% van het aantal additionele kilogrammen fosfaat dat in dat jaar ten opzichte van het jaar 2014
      met melkvee wordt geproduceerd indien het overschot per hectare gelijk is aan of hoger is dan 20kg/ha en gelijk is
      aan of lager is dan 50 kg/ha;

      c. ten hoogste 50% van het aantal additionele kilogrammen fosfaat dat in dat jaar ten opzichte van het jaar 2014
      met melkvee wordt geproduceerd indien het overschot per hectare hoger is dan 50 kg/ha.

      4 Het overschot per hectare, bedoeld in het derde lid wordt berekend door de productie van dierlijke meststoffen
      door melkvee op een bedrijf in kilogrammen fosfaat in het voorgaande kalenderjaar, verminderd met de fosfaatruimte
      van het bedrijf in het voorgaande kalenderjaar te delen door het aantal hectaren tot het bedrijf behorende
      oppervlakte landbouwgrond in het voorgaande kalenderjaar. Indien een landbouwer meldt en aantoont dat een deel van
      de grond in het voorgaande kalenderjaar tijdelijk niet kon worden gebruikt als landbouwgrond vanwege de aanleg van
      of onderhoud van publieke infrastructuur, wordt die grond voor de toepassing van het derde lid en dit artikellid
      beschouwd als tot het bedrijf behorende oppervlakte landbouwgrond.

      5 Het derde lid is niet van toepassing op een bedrijf dat:

      a. voor 1 februari 2016 heeft aangetoond dat het voor 30 maart 2015 financiële verplichtingen is aangegaan ten
      einde het gehele melkveefosfaatoverschot te laten verwerken, waardoor naleving van het eerste lid leidt tot
      disproportionele financiële last en

      b. het bedrijf binnen drie maanden na afloop van elk kalenderjaar aantoont dat het melkveefosfaatoverschot is
      verwerkt door degene met wie de financiële verplichtingen, bedoeld in onderdeel a, is aangegaan.

      6 [Artikel 33a, derde lid][ref4], is van overeenkomstige toepassing op het tweede lid, onderdeel d, onder 1.

      7 Bij de toepassing van het tweede lid, onderdeel d, blijven die kilogrammen fosfaat buiten beschouwing, die reeds
      in aanmerking zijn genomen voor de toepassing van [artikel 33a, tweede lid, onderdelen b tot en met e][ref5].

      8 Indien een landbouwer voor 1 april 2017 meldt en aantoont dat het melkveefosfaatoverschot dat in 2014 is
      ontstaan, bedoeld in het derde lid, door buitengewone omstandigheden lager is wordt voor het kalenderjaar 2014
      gerekend met het melkveefosfaatoverschot waarover deze landbouwer zonder deze buitengewone omstandigheden zou
      hebben beschikt.

      9 Van buitengewone omstandigheden als bedoeld in het achtste lid is uitsluitend sprake indien:

      a. het melkveefosfaatoverschot dat in 2014 is ontstaan lager is door de realisatie van een natuurgebied of de
      aanleg van of onderhoud van publieke infrastructuur;

      b. de productie van dierlijke meststoffen door melkvee op het bedrijf in kilogrammen fosfaat in 2014 minimaal vijf
      procent lager is door:

      1°. dierziekten of ernstige diergezondheidsproblemen,

      2°. ziekte of overlijden van een persoon van het samenwerkingsverband van de landbouwer of een bloed- of aanverwant
      in de eerste graad, of

      3°. vernieling van de stal waar het melkvee werd gehouden.

      10 Een melding als bedoeld in het vierde en achtste lid wordt ingediend met gebruikmaking van een middel dat door
      Onze Minister beschikbaar wordt gesteld.

      11 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de voorwaarden waaronder
      de productie van dierlijke meststoffen door melkvee, en de aanwending van zodanige meststoffen, uitgedrukt
      in kilogrammen fosfaat, op basis van een schriftelijke overeenkomst tussen een landbouwer die de meststoffen
      produceert enerzijds en een landbouwer met een bedrijf binnen een bij die maatregel vastgestelde straal van het
      bedrijf van die producent anderzijds, meetellen in de berekening van het melkveefosfaatoverschot.

      12 Het ontwerp van een krachtens het elfde lid vast te stellen algemene maatregel van bestuur wordt aan de beide
      kamers der Staten-Generaal overgelegd. De voordracht voor de vast te stellen algemene maatregel van bestuur kan
      worden gedaan nadat vier weken na de overlegging zijn verstreken, tenzij binnen die termijn door of namens een der
      kamers of door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt
      gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een
      daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel21b
