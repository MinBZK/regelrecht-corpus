  - number: '14'
    text: |-
      1 Degene die dierlijke meststoffen produceert of verhandelt kan steeds verantwoorden dat de op het eigen bedrijf
      geproduceerde of aangevoerde dierlijke meststoffen of de op de eigen onderneming aangevoerde dierlijke meststoffen
      zijn afgevoerd.

      2 De verantwoording heeft betrekking op de hoeveelheid fosfaat in de meststoffen en betreft mede de afnemers
      waarnaar de meststoffen zijn afgevoerd.

      3 De verantwoording door degene die dierlijke meststoffen produceert heeft mede betrekking op de hoeveelheid
      stikstof in de meststoffen.

      4 Voor de toepassing van het eerste lid wordt op de geproduceerde of aangevoerde hoeveelheid dierlijke meststoffen
      in mindering gebracht de hoeveelheid dierlijke meststoffen waarvan aannemelijk wordt gemaakt dat deze op het eigen
      bedrijf of in het kader van de eigen onderneming is gebruikt of opgeslagen.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel14
  - number: '15'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen, in het belang van een doelmatige afvoer van
      mestoverschotten of de bescherming en verbetering van het milieu, regels worden gesteld met betrekking tot het in
      voorraad hebben, verwerken, vervoeren en verhandelen van dierlijke meststoffen.

      2 De in het eerste lid bedoelde regels kunnen onder meer inhouden een verbod de in het eerste lid bedoelde
      meststoffen:

      a. te verhandelen zonder kennisgeving daarvan op een daarbij aangegeven wijze aan een daarbij aangewezen orgaan;

      b. in voorraad te houden of te verwerken op een andere wijze dan daarbij is voorgeschreven;

      c. te verhandelen zonder vergunning verleend door of vanwege Onze Minister, door of vanwege een bevoegde autoriteit
      als bedoeld in een bindend besluit van de Raad van de Europese Unie, van het Europees Parlement en de Raad
      gezamenlijk of van de Commissie van de Europese Gemeenschappen, of door of vanwege een bij de maatregel aangewezen
      orgaan, waarbij tevens regels kunnen worden gesteld met betrekking tot de verlening, weigering of intrekking van
      een vergunning;

      d. te verhandelen zonder dat een financiële zekerheid is gesteld bij Onze Minister of bij de bevoegde autoriteit of
      het orgaan, bedoeld in onderdeel c, waarbij tevens regels kunnen worden gesteld over de omvang van de zekerheid en
      de wijze waarop de zekerheid wordt gesteld.

      3 Aan een vergunning, als bedoeld in het tweede lid, onderdeel c, kunnen voorschriften worden verbonden. Zij kan
      onder beperkingen worden verleend. Tot de voorschriften kunnen onder meer behoren:

      a. een verbod de desbetreffende meststoffen af te leveren aan bij het voorschrift aangewezen gebruikers of groepen
      van gebruikers, in grotere dan bij het voorschrift vastgestelde hoeveelheden;

      b. de verplichting de naleving van de onder a bedoelde voorschriften te staven met bij het voorschrift vastgestelde
      bewijsstukken;

      c. voorschriften inzake het voeren van een administratie welke worden gesteld om de naleving van de onder a
      bedoelde voorschriften te kunnen controleren.

      4 De aan een vergunning, als bedoeld in het tweede lid, onderdeel c, verbonden voorschriften en de beperkingen
      waaronder zij is verleend, kunnen worden gewijzigd, aangevuld of ingetrokken.

      5 Bij algemene maatregel van bestuur kan worden bepaald dat het is verboden dierlijke meststoffen in voorraad
      te hebben, te verwerken, te vervoeren of te verhandelen zonder voorafgaande registratie bij Onze Minister.
      Daarbij kunnen regels worden gesteld over de weigering, schorsing of schrapping van een registratie. Die regels
      kunnen inhouden dat een registratie kan worden geweigerd of geschrapt in het geval en onder de voorwaarden,
      bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1] en
      dat daaraan voorafgaand het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2], om een advies als
      bedoeld in [artikel 9 van die wet][ref3] kan worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel9
