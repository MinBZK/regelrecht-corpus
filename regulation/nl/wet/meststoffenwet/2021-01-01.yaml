      1 De totale omvang van de productie van dierlijke meststoffen bedraagt per kalenderjaar uitgedrukt in kilogrammen
      fosfaat ten hoogste 172,9 miljoen en uitgedrukt in kilogrammen stikstof ten hoogste 504,4 miljoen.

      2 De totale omvang van de productie van dierlijke meststoffen afkomstig van melkvee bedraagt per kalenderjaar
      uitgedrukt in kilogrammen fosfaat ten hoogste 84,9 miljoen en uitgedrukt in kilogrammen stikstof ten hoogste 281,8
      miljoen.

      3 De totale omvang van de productie van dierlijke meststoffen afkomstig van varkens bedraagt per kalenderjaar
      uitgedrukt in kilogrammen fosfaat ten hoogste 39,7 miljoen en uitgedrukt in kilogrammen stikstof ten hoogste 99,1
      miljoen.

      4 De totale omvang van de productie van dierlijke meststoffen afkomstig van pluimvee bedraagt per kalenderjaar
      uitgedrukt in kilogrammen fosfaat ten hoogste 27,4 miljoen en uitgedrukt in kilogrammen stikstof ten hoogste 60,3
      miljoen.

      5 Onze Minister maakt de totale jaarlijkse productie van dierlijke meststoffen en de totale jaarlijkse productie
      van dierlijke meststoffen per sector, melkvee, varkens en pluimvee, bekend in de Staatscourant na afloop van het
      kalenderjaar waarin de productie heeft plaatsgevonden. Voor de melkveesector betreft dit de totale jaarlijkse
      productie, gecorrigeerd voor ruwvoer. Voor de pluimveesector betreft dit de totale jaarlijkse productie door dieren
      van diersoorten waarvoor het pluimveerechtenstelsel van toepassing is. Voor de bekendmaking gebruikt Onze Minister
      de door het Centraal bureau voor de statistiek gerapporteerde cijfers.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel18a
