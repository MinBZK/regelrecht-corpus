      [Artikel 32a, eerste lid][ref1], zoals dat luidde onmiddellijk voor het tijdstip van inwerkingtreding van het
      onderhavige artikel, blijft van toepassing op de overgang van een fosfaatrecht, of gedeelte daarvan, waarvan voor
      dat tijdstip een kennisgeving als bedoeld in [artikel 27, eerste lid][ref2], heeft plaatsgevonden.


