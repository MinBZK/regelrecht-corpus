  - number: '59'
    text: |-
      1 In geval van overtreding van [artikel 33a, eerste lid][ref1], bedraagt de bestuurlijke boete € 11 per kilogram
      fosfaat ten aanzien waarvan de landbouwer niet heeft gehandeld overeenkomstig artikel 33a, tweede lid, onderdeel b.

      2 In geval van overtreding van [artikel 33a, vierde lid][ref2], bedraagt de bestuurlijke boete € 11 per kilogram
      fosfaat waarmee dat lid wordt overtreden.

      3 In geval van overtreding van [artikel 33a, vijfde lid][ref3], bedraagt de bestuurlijke boete € 11 per kilogram
      fosfaat waarmee dat lid wordt overtreden.

      4 In geval van overtreding van het krachtens [artikel 33a, zevende lid][ref4], bepaalde, bedraagt de bestuurlijke
      boete € 11 per kilogram fosfaat waarmee dat lid wordt overtreden.

      5 In geval van overtreding van [artikel 33d, eerste lid][ref5], bedraagt de bestuurlijke boete € 11 per kilogram
      fosfaat waarmee dat lid wordt overtreden.


