        artikel: '1'
        hoofdstuk: I
  - number: '3'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt geen rekening gehouden met handelingen
      waarvan, op grond van de omstandigheid dat zij geen wezenlijke verandering van feitelijke verhoudingen hebben ten
      doel gehad of op grond van andere bepaalde feiten en omstandigheden, moet worden aangenomen dat zij achterwege
      zouden zijn gebleven, indien daarmee niet de toepassing van deze wet voor het vervolg geheel of ten dele onmogelijk
      zou worden gemaakt.

      2 [Hoofdstuk III][ref1] van deze wet is niet van toepassing op natuurterreinen die de hoofdfunctie natuur hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIII
