  - number: '55'
    text: |-
      Indien de ernst van de overtreding of de omstandigheden waaronder zij is begaan daartoe aanleiding geven, wordt zij
      aan het openbaar ministerie voorgelegd.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel55
  - number: '57'
    text: |-
      1 Ingeval van overtreding van [artikel 7][ref1] bedraagt de bestuurlijke boete:

      a. € 7 per kilogram stikstof waarmee de in [artikel 8, onderdeel a][ref2], bedoelde gebruiksnorm voor dierlijke
      meststoffen is overschreden, vermeerderd met

      b. € 7 per kilogram stikstof waarmee de in [artikel 8, onderdeel b][ref3], bedoelde stikstofgebruiksnorm is
      overschreden, en vermeerderd met

      c. € 11 per kilogram fosfaat waarmee de in [artikel 8, onderdeel c][ref4], bedoelde fosfaatgebruiksnorm is
      overschreden.

      2 Indien zowel de gebruiksnorm voor dierlijke meststoffen als de stikstofgebruiksnorm is overschreden, geldt, in
      zoverre in afwijking van het eerste lid, onderdeel b, een tarief van € 3,50 voor de kilogrammen stikstof waarvoor
      wegens overschrijding van de gebruiksnorm voor dierlijke meststoffen reeds het tarief van € 7 is toegepast.

      3 Indien zowel de gebruiksnorm voor dierlijke meststoffen als de fosfaatgebruiksnorm is overschreden, geldt,
      in zoverre in afwijking van het eerste lid, onderdeel c, een tarief van € 5,50 voor de kilogrammen fosfaat
      overeenkomend met het aantal kilogrammen stikstof waarmee de gebruiksnorm voor dierlijke meststoffen is
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel8
