  - number: 37a
    text: |-
      1 Bij ministeriële regeling worden regels gesteld over de wijze waarop de controleprogramma’s, bedoeld in artikel
      5, zesde lid, van richtlijn nr. 91/676/EEG van de Raad van de Europese Gemeenschappen van 12 december 1991
      inzake de bescherming van water tegen verontreiniging door nitraten uit agrarische bronnen (PbEG L 375), worden
      uitgevoerd.

      2 Het ontwerp van de ministeriële regeling, bedoeld in het vorige lid, wordt vier weken voor publicatie in de
      Staatscourant door Onze Minister aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel37a
  - number: '38'
    text: |-
      1 Bij ministeriële regeling kan vrijstelling worden verleend van het bij of krachtens deze wet bepaalde.

      2 Onze Minister kan ontheffing verlenen van het bij of krachtens deze wet bepaalde.

      3 Aan de vrijstelling of de ontheffing kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel38
  - number: 38a
    text: |-
      1 Indien geen afbreuk wordt gedaan aan de naleving van een verplichting op grond van een voor Nederland verbindend
      verdrag of besluit van een volkenrechtelijke organisatie wordt, onder bij ministeriële regeling te stellen
      voorwaarden, vrijstelling of ontheffing verleend van het verbod, bedoeld in [artikel 21b, eerste lid][ref1], ter
      bevordering van de grondgebondenheid of het stimuleren van jonge landbouwers in Nederland.

      2 Een vrijstelling of ontheffing, bedoeld in het eerste lid, wordt uitsluitend gegeven voor milieudoelstellingen
      die verder gaan dan die welke op grond van de voor de betrokken ondernemingen verplichte Unie-normen zouden zijn
      bereikt.

      3 De ministeriële regeling, bedoeld in het eerste lid, wordt niet eerder vastgesteld dan vier weken nadat het
      ontwerp ervan aan beide kamers der Staten Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel21b
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 21b
        hoofdstuk: V
  - number: '39'
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld omtrent het indienen van aanvragen voor vergunningen,
      ontheffingen en erkenningen, die krachtens deze wet kunnen worden verleend, en het indienen van kennisgevingen, die
      ingevolge bij of krachtens deze wet gestelde regels moeten worden geregistreerd.

      2 Bij de regeling kan worden bepaald:

      a. dat een aanvraag eerst in behandeling wordt genomen of dat een kennisgeving eerst wordt geregistreerd nadat een
      daarvoor vastgesteld bedrag is voldaan;

      b. de kosten van het onderzoek voortvloeiende uit de aanvraag geheel of gedeeltelijk ten laste van de aanvrager
      wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel39
  - number: '40'
    text: |-
      1 Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.

      2 Indien onderwerpen waarop deze wet van toepassing is, ter uitvoering van een bindend besluit van de Raad van de
      Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen
      regeling behoeven, kan dit geschieden bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel40
  - number: '43'
    text: |-
      1 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing op de voorbereiding van:

      a. een algemene maatregel van bestuur als bedoeld in de [artikelen 4][ref2], [6][ref3], [16][ref4], [32][ref5],
      [33][ref6] en [76, eerste lid][ref7],

      b. een ministeriële regeling als bedoeld in de [artikelen 10][ref8], [11, tweede en derde lid][ref9],
      [12, derde lid][ref10], en [21b, tweede lid][ref11], en

      c. een besluit als bedoeld in [artikel 38, eerste en tweede lid][ref12], houdende vrijstelling of ontheffing van
      het bepaalde bij of krachtens [artikel 4][ref13], [5][ref14], [6][ref15], [7][ref16], [14][ref17], [16][ref18],
      [19][ref19], [20, eerste lid][ref20], [21][ref21], [26][ref22], [32][ref23] of [33][ref24].

      2 Zienswijzen kunnen naar voren worden gebracht door eenieder.

      3 Onze Minister geeft toepassing aan de in het eerste lid genoemde afdeling.


