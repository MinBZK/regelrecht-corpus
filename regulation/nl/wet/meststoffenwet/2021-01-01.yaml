  - number: '25'
    text: |-
      Een productierecht kan, onder welke titel dan ook, overgaan naar een ander bedrijf, overeenkomstig het bepaalde in
      deze paragraaf en [artikel 32][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel32
