preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen met betrekking tot het verhandelen
    van meststoffen, zowel in het belang van de bevordering van de deugdelijkheid voor het doel waarvoor zij zijn
    bestemd als in het belang van de bescherming van de bodem, en voorts regelen te stellen in het belang van een
    doelmatige afvoer van mestoverschotten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. grond: dat deel van de bodem dat wordt gebruikt of is bestemd om te worden gebruikt als voedingsbodem voor
      planten;

      b. groeimedium: materiaal in vaste of vloeibare vorm, niet zijnde grond, dat wordt gebruikt of is bestemd om te
      worden gebruikt als voedingsbodem voor planten;

      c. dierlijke meststoffen: uitwerpselen van voor gebruiks- of winstdoeleinden gehouden dieren, daaronder begrepen de
      geheel of gedeeltelijk verteerde maag- of darminhoud van deze dieren en mengsels van strooisel met de uitwerpselen,
      alsook producten daarvan;

      d. meststoffen: dierlijke meststoffen, ongeacht hun bestemming, en producten die zijn bestemd om:

      1°. te worden toegevoegd aan grond of aan een groeimedium en die geheel of gedeeltelijk bestaan uit stoffen,
      organismen daaronder begrepen, of mengsels van stoffen, die als zodanig kunnen dienen om grond of een groeimedium
      geschikt of beter geschikt te maken als voedingsbodem voor planten;

      2°. te worden gebruikt als groeimedium;

      3°. te worden gebruikt als voedsel voor planten of delen van planten, voor zover deze producten niet reeds zijn
      begrepen onder 1° of 2°;

      e. verhandelen van meststoffen: afleveren van meststoffen aan handelaren in of gebruikers van meststoffen alsmede
      het met het oog daarop voorhanden of in voorraad hebben, aanbieden of vervoeren van meststoffen;

      f. Onze Minister: Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      g. landbouw: akkerbouw, veehouderij – daaronder begrepen elke bedrijfsmatige vorm van houden van dieren voor
      gebruiks- of winstdoeleinden – , tuinbouw – daaronder begrepen fruitteelt en het kweken van bomen, planten, bloemen
      en bloembollen – en bosbouw die aan bij ministeriële regeling gestelde regels voldoet;

      h. landbouwgrond: grond waarop daadwerkelijk enige vorm van landbouw wordt uitgeoefend;

      i. bedrijf: geheel van productie-eenheden bestaande uit één of meer gebouwen of afgescheiden gedeelten daarvan
      en de daarbij behorende landbouwgrond, uitsluitend of onder meer dienende tot de uitoefening van enige vorm van
      landbouw, zulks beoordeeld naar de feitelijke omstandigheden;

      j. stikstof: stikstof, in welke vorm of verbinding dan ook;

      k. fosfaat: fosfor, in welke vorm of verbinding dan ook, vermenigvuldigd met de factor 2,29;

      l. hectare: hectare in gemeten maat;

      m. tot het bedrijf behorende oppervlakte landbouwgrond: in Nederland gelegen oppervlakte landbouwgrond, die in het
      kader van een normale bedrijfsvoering bij het bedrijf in gebruik is;

      n. veengrond: perceel waarvan blijkens representatieve grondmonsters ten minste de helft van de oppervlakte voor
      meer dan de helft van de dikte van de grondlaag tot een diepte van 80 centimeter onder het maaiveld bestaat uit
      veen;

      o. zand- of lössgrond: perceel waarvan blijkens representatieve grondmonsters ten minste de helft van de
      oppervlakte voor meer dan de helft van de dikte van de grondlaag tot een diepte van 80 centimeter onder het
      maaiveld bestaat uit zand of löss;

      p. kleigrond: grond niet zijnde veengrond of zand- of lössgrond;

      q. grasland: landbouwgrond waarop gras wordt geteeld dat is bestemd om te worden gebruikt als veevoer;

      r. bouwland: landbouwgrond, niet zijnde grasland;

      s.

      t.

      u.

      v.

      w.

      x. mestoverschot: de in een bepaald kalenderjaar geproduceerde, aangevoerde of uit opslag komende hoeveelheid
      dierlijke meststoffen, die van een bedrijf moet worden afgevoerd om te voldoen aan de voorwaarden, bedoeld in
      [artikel 8][ref1], en om te voldoen aan [artikel 14][ref2];

      y. varkensrecht: gemiddeld aantal varkens, uitgedrukt in varkenseenheden, dat op grond van [hoofdstuk V][ref3] in
      een kalenderjaar ten hoogste mag worden gehouden;

      z. pluimveerecht: gemiddeld aantal kippen en kalkoenen, uitgedrukt in pluimvee-eenheden, dat op grond van
      [hoofdstuk V][ref4] in een kalenderjaar ten hoogste mag worden gehouden;

      za. fosfaatrecht: hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, die in een kalenderjaar ten
      hoogste met melkvee mag worden geproduceerd;

      aa. productierecht: varkensrecht, pluimveerecht of fosfaatrecht;

      bb. concentratiegebied: concentratiegebied Zuid of concentratiegebied Oost als aangegeven in [bijlage I][ref5];

      cc. bedrijfsoverschot: hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, die in een
      kalenderjaar op een bedrijf wordt geproduceerd boven de fosfaatruimte;

      dd. dierlijke meststoffen verwerken:

      1°. behandelen van dierlijke meststoffen tot een eindproduct dat voldoet aan de bij regeling van Onze Minister vast
      te stellen specificaties, of

      2°. exporteren van dierlijke meststoffen;

      ee. mestverwerkingsovereenkomst:

      1°. bij de overdracht van dierlijke meststoffen van een landbouwer die op zijn bedrijf dierlijke meststoffen
      produceert aan een verwerker behorend volledig ingevuld krachtens [artikel 34, onderdeel b][ref6], vastgesteld
      bewijsmiddel, voor zover de daarop vermelde gegevens overeenkomstig de daartoe krachtens artikel 34, onderdeel b,
      geldende voorschriften tijdig bij Onze Minister zijn ingediend, of

      2°. overeenkomst tussen een landbouwer die op zijn bedrijf dierlijke meststoffen produceert, een andere ondernemer
      dan een verwerker, en een verwerker;

      ff. produceren van dierlijke meststoffen: produceren van dierlijke meststoffen door het op een bedrijf houden of
      anderszins aanwezig hebben van dieren;

      gg. landbouwer: natuurlijke persoon of rechtspersoon die of samenwerkingsverband van natuurlijke personen of
      rechtspersonen dat enige vorm van landbouw uitoefent op een bedrijf;

      hh. verwerker: natuurlijke persoon of rechtspersoon die of samenwerkingsverband van natuurlijke personen of
      rechtspersonen dat een verwerkende onderneming voert;

      ii. verwerkende onderneming: onderneming, niet zijnde een bedrijf, in het kader waarvan dierlijke meststoffen
      worden verwerkt;

      jj. huisvestingssysteem: gedeelte van een dierenverblijf, waarin dieren van één diercategorie op dezelfde wijze
      worden gehouden;

      kk. melkvee:

      1°. melk- en kalfkoeien, te weten koeien (bos taurus) die ten minste éénmaal hebben gekalfd en die voor de
      melkproductie of de fokkerij worden gehouden met inbegrip van koeien die drooggezet zijn alsmede koeien die worden
      vetgemest en in de mesttijd worden gemolken;

      2°. jongvee jonger dan 1 jaar voor de melkveehouderij, en vrouwelijke opfokkalveren voor de vleesveehouderij tot 1
      jaar en

      3°. jongvee ouder dan 1 jaar, te weten alle runderen van 1 jaar en ouder inclusief overig vleesvee, maar met
      uitzondering van roodvleesstieren en fokstieren;

      ll. fosfaatruimte: hoeveelheid dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat, die in een kalenderjaar

      1°. ingevolge [artikel 8, onderdeel c][ref7], mag worden gebracht op of in de tot het desbetreffende bedrijf
      behorende oppervlakte landbouwgrond, en

      2°. ingevolge de krachtens de [artikelen 7][ref8] en [15 van de Wet bodembescherming][ref9] geldende voorschriften
      mag worden aangebracht op een in Nederland gelegen natuurterrein dat de hoofdfunctie natuur heeft en dat in het
      desbetreffende kalenderjaar op een bij algemene maatregel van bestuur vast te stellen datum bij het bedrijf in
      gebruik is;

      mm. melkveefosfaatreferentie: een beschikking als bedoeld in [artikel 21a, eerste lid][ref10];

      nn. melkveefosfaatoverschot: de productie van dierlijke meststoffen door melkvee op het bedrijf in
      kilogrammen fosfaat, verminderd met de fosfaatruimte, het aantal kilogrammen fosfaat, genoemd in de
      melkveefosfaatreferentie van dat bedrijf en het aantal kilogrammen fosfaat, genoemd in overeenkomsten als bedoeld
      in [artikel 21, elfde lid][ref11];

      oo. melkveefosfaatruimte: de fosfaatruimte van het bedrijf in 2015, verminderd met de krachtens
      [artikel 35][ref12] bepaalde forfaitaire productie van dierlijke meststoffen in dat kalenderjaar door
      melkvee dat op 2 juli 2015 op het bedrijf is gehouden en krachtens de [artikelen 4][ref13], [96][ref14] en
      [111 van de Gezondheids- en welzijnswet][ref15] voor dieren gestelde regels (I&R) is geregistreerd, waarbij in
      afwijking van onderdeel ll, onder 2°, voor in dat onderdeel bedoeld natuurterrein, zijnde grasland, wordt gerekend
      met 70 kilogram fosfaat per hectare en voor overig natuurterrein wordt gerekend met 20 kg fosfaat per hectare.

      2 In deze wet en de daarop berustende bepalingen wordt onder bedrijf mede verstaan: een op het Nederlands
      grondgebied gelegen deel van een in het buitenland gevestigd bedrijf.

      3 In het eerste lid, onderdelen n en o, wordt onder perceel verstaan: aaneengesloten, door wegen, waterwegen,
      sloten, houtopstanden, muren, wallen of anderszins topografisch begrensde oppervlakte grond.

      4 Voor de toepassing van deze wet wordt veengrond, zand- of lössgrond, en kleigrond aangeduid op bij algemene
      maatregel van bestuur vastgestelde kaarten.


