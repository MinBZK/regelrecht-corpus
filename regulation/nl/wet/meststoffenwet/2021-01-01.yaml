  - number: '46'
    text: |-
      Onze Minister zendt in 2007 en vervolgens telkens na ten hoogste vijf jaar aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel46
  - number: '47'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel47
  - number: '48'
    text: |-
      Onze Minister kan voorschriften geven betreffende de monsterneming, de verpakking, de conservering, de verzegeling,
      de verzending en het onderzoek van de in [artikel 5:18 van de Algemene wet bestuursrecht][ref1] bedoelde monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
  - number: '49'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens deze
      wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel49
