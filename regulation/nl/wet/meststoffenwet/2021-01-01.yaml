  - number: '23'
    text: |-
      1 Het op het bedrijf rustende varkensrecht op het tijdstip van inwerkingtreding van het verbod, bedoeld in
      [artikel 19][ref1], komt overeen met het varkensrecht zoals dat onmiddellijk voorafgaand aan dat tijdstip voor het
      bedrijf gold op grond van de [Wet herstructurering varkenshouderij][ref2].

      2 Het op het bedrijf rustende pluimveerecht op het tijdstip van inwerkingtreding van het verbod, bedoeld in
      [artikel 20][ref3], eerste lid, komt overeen met het pluimveerecht, uitgedrukt in kilogrammen fosfaat, zoals dat
      onmiddellijk voorafgaand aan dat tijdstip voor het bedrijf gold op grond van deze wet, met dien verstande dat
      de kilogrammen fosfaat worden omgerekend naar pluimvee-eenheden. Voor deze omrekening komt 0,5 kilogram fosfaat
      overeen met 1 pluimvee-eenheid.

      3 Het op het bedrijf rustende fosfaatrecht op het tijdstip van inwerkingtreding van het verbod, bedoeld in
      [artikel 21b, eerste lid][ref4], wordt door Onze Minister vastgesteld en komt overeen met de forfaitaire productie
      van dierlijke meststoffen in een kalenderjaar door melkvee dat op 2 juli 2015 op het bedrijf is gehouden en
      krachtens de [artikelen 4][ref5], [96][ref6] en [111 van de Gezondheids- en welzijnswet voor dieren][ref7] gestelde
      regels (I&R) is geregistreerd. [Artikel 21a, vierde lid][ref8], is van overeenkomstige toepassing.

      4 Indien een landbouwer voor een datum die bij ministeriële regeling wordt vastgesteld, meldt en aantoont dat
      tussen 2 juli 2015 en 1 januari 2018 een beëindigd bedrijf is overgenomen, wordt het fosfaatrecht, bedoeld in het
      derde lid, verhoogd, met het fosfaatrecht dat voor dit beëindigde bedrijf bij continuering, krachtens het derde lid
      zou zijn vastgesteld. Bij een gedeeltelijke overname vindt de verhoging naar rato plaats.

      5 Indien een landbouwer voor een datum die bij ministeriële regeling wordt vastgesteld, meldt en aantoont dat hij
      op 2 juli 2015 melkvee had uitgeschaard, wordt het fosfaatrecht, bedoeld in het derde lid, verhoogd en wordt het
      fosfaatrecht van de landbouwer die dat melkvee op die datum had ingeschaard, met diens instemming verlaagd. Deze
      verhoging onderscheidenlijk verlaging komt overeen met de forfaitaire productie van dierlijke meststoffen van het
      aantal uitgeschaarde onderscheidenlijk ingeschaarde stuks melkvee.

      6 Indien een landbouwer voor een datum die bij ministeriële regeling wordt vastgesteld, meldt en aantoont dat het
      krachtens het derde lid op het bedrijf rustende fosfaatrecht minimaal vijf procent lager is door bouwwerkzaamheden,
      diergezondheidsproblemen, ziekte, ziekte of overlijden van een persoon van het samenwerkingsverband van de
      landbouwer of een bloed- of aanverwant in de eerste graad, of vernieling van de melkveestallen, wordt door Onze
      Minister het fosfaatrecht bepaald aan de hand van het melkvee waarover deze landbouwer zonder deze buitengewone
      omstandigheden zou hebben beschikt.

      7 Een melding als bedoeld in het vierde, vijfde en zesde lid, wordt ingediend met gebruikmaking van een middel dat
      door Onze Minister beschikbaar wordt gesteld.

      8 Onze Minister van Economische Zaken maakt binnen zes maanden na de vaststelling van het op het bedrijf rustende
      fosfaatrecht de gegevens, bedoeld in paragraaf 3.2.7, onderdeel 104, van de staatssteunrichtsnoeren ten behoeve van
      milieubescherming en energie (PbEU 2014, C 200) bekend. Deze gegevens blijven voor ten minste tien jaar openbaar
      beschikbaar.

      9 Ten einde onbillijkheden van overwegende aard te voorkomen verhoogt Onze Minister het op het bedrijf rustende
      fosfaatrecht met ingang van het tijdstip waarop het verbod, bedoeld in [artikel 21b, eerste lid][ref9], in werking
      treedt, tot een bij algemene maatregel van bestuur bepaalde omvang, indien kan worden vastgesteld dat het bedrijf
      behoort tot een bij algemene maatregel van bestuur omschreven categorie van bedrijven. Bij of krachtens algemene
      maatregel van bestuur kunnen nadere regels worden gesteld voor het verkrijgen van een verhoging als bedoeld in de
      eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel19
