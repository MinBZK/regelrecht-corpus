  - number: 58a
    text: |-
      In geval van overtreding van [artikel 21, eerste lid][ref1], bedraagt de bestuurlijke boete € 11 per kilogram
      fosfaat ten aanzien waarvan de landbouwer de beperking als bedoeld in artikel 21, derde lid, niet in acht heeft
      genomen. De boete wordt vermeerderd met € 11 per kilogram fosfaat ten aanzien waarvan de landbouwer niet heeft
      gehandeld overeenkomstig artikel 21, tweede lid, onderdeel d, voor zover het kilogrammen fosfaat betreft die niet
      reeds als gevolg van de eerste volzin voor de bepaling van de boeteomvang in aanmerking zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel21
    url: https://wetten.overheid.nl/BWBR0004054/2021-01-01#Artikel58a
