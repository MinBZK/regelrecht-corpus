        artikel: '93'
  - number: '16'
    text: |-
      Voorschriften tot nadere regeling van het verlenen van hulp en steun aan veroordeelden worden vastgesteld bij of
      krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel16
  - number: '18.1'
    text: De duur van de hechtenis is ten minste een dag en ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel18
  - number: '18.2'
    text: |-
      Zij kan voor ten hoogste een jaar en vier maanden worden opgelegd in de gevallen waarin wegens strafverhoging
      ter zake van samenloop, herhaling van misdrijf of het bepaalde bij [artikel 44][ref1], de tijd van een jaar wordt
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel44
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '44'
  - number: '18.3'
    text: Zij kan in geen geval de tijd van een jaar en vier maanden te boven gaan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel18
  - number: '19'
    text: |-
      [Artikel 13][ref1] is op de tot hechtenis of vervangende hechtenis veroordeelde van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel13
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '13'
  - number: '21'
    text: |-
      De duur van de tijdelijke gevangenisstraf en de hechtenis wordt in de rechterlijke uitspraak aangewezen in dagen,
      weken, maanden en jaren, niet in gedeelten daarvan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel21
  - number: 22a
    text: |-
      Het hoofd van het Departement van Justitie is bevoegd in bijzondere omstandigheden in het belang van de veiligheid
      van de staat te bepalen, dat vrijheidsstraffen buiten het Rijk in Europa ten uitvoer worden gelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22a
  - number: 22c.1
    text: |-
      Het vonnis vermeldt of de taakstraf bestaat uit een werkstraf, een leerstraf of een combinatie van beide, alsmede
      het aantal uren dat de straf zal duren. Het vonnis kan de aard van de te verrichten werkzaamheden of het te volgen
      leerproject vermelden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22c
  - number: 22c.2
    text: |-
      Het aantal uren dat de taakstraf duurt bedraagt ten hoogste vierhonderdentachtig, waarvan niet meer dan
      tweehonderdenveertig uren werkstraf.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22c
  - number: 22c.3
    text: |-
      De termijn binnen welke de taakstraf moet worden voltooid bedraagt een jaar na het onherroepelijk worden van het
      vonnis. Het openbaar ministerie kan ambtshalve of op verzoek van de veroordeelde deze termijn eenmaal met een jaar
      verlengen. Het zendt hiervan zo spoedig mogelijk een kennisgeving aan de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22c
  - number: 22c.4
    text: |-
      De termijn binnen welke de taakstraf moet worden verricht wordt verlengd met de tijd dat de veroordeelde rechtens
      zijn vrijheid is ontnomen alsmede met de tijd dat hij ongeoorloofd afwezig is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22c
  - number: 22d.1
    text: |-
      In het vonnis waarbij taakstraf wordt opgelegd, beveelt de rechter, voor het geval dat de veroordeelde de taakstraf
      niet naar behoren verricht, dat vervangende hechtenis zal worden toegepast.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22d
  - number: 22d.2
    text: De duur van de vervangende hechtenis wordt in gehele dagen, weken of maanden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22d
  - number: 22d.3
    text: |-
      De vervangende hechtenis beloopt ten minste één dag en ten hoogste acht maanden. Voor elke twee uren van de
      taakstraf wordt niet meer dan één dag opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22d
  - number: 22d.4
    text: |-
      Wanneer een gedeelte van de te verrichten taakstraf is voldaan, vermindert de duur van de vervangende hechtenis
      naar evenredigheid. Heeft deze vermindering tot gevolg dat voor een gedeelte van een dag vervangende hechtenis zou
      moeten worden ondergaan, dan vindt afronding naar boven plaats tot het naaste aantal gehele dagen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22d
  - number: 22e
    text: |-
      Over de wijze waarop de taakstraf wordt of is verricht, kan het openbaar ministerie, naar regelen te stellen bij
      algemene maatregel van bestuur, inlichtingen inwinnen bij lichamen en personen die werkzaam zijn op het gebied van
      de reclassering. [Artikel 147 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel147
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22e
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '147'
  - number: 22f.1
    text: |-
      Het openbaar ministerie kan de opgelegde straf wijzigen voor wat betreft de aard van de te verrichten werkzaamheden
      of het te volgen leerproject, bedoeld in [artikel 22c, eerste lid, tweede volzin][ref1], indien het van oordeel is
      dat de veroordeelde de taakstraf niet geheel overeenkomstig de opgelegde straf kan of heeft kunnen verrichten. Het
      openbaar ministerie benadert daarbij zo veel mogelijk de opgelegde straf. Het openbaar ministerie geeft hiervan
      kennis aan de veroordeelde.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel22c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22f
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 22c
  - number: 22f.2
    text: |-
      Het openbaar ministerie doet deze kennisgeving zo spoedig mogelijk aan de veroordeelde betekenen. De kennisgeving
      behelst het aantal uren taakstraf dat naar het oordeel van het openbaar ministerie is verricht, alsmede de straf
      zoals deze voor het overige nader is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22f
  - number: 22f.3
    text: |-
      Tegen de kennisgeving, bedoeld in het tweede lid, kan de veroordeelde binnen veertien dagen na de betekening
      daarvan een bezwaarschrift indienen bij de rechter die de straf oplegde. De rechter kan de beslissing van het
      openbaar ministerie wijzigen. Het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22f
  - number: 22g.1
    text: |-
      Indien de tot een taakstraf veroordeelde niet aanvangt met de taakstraf of het openbaar ministerie van oordeel
      is dat de veroordeelde de opgelegde taakstraf niet naar behoren verricht of heeft verricht, kan het openbaar
      ministerie de tenuitvoerlegging van de vervangende hechtenis bevelen. Het openbaar ministerie geeft hiervan kennis
      aan de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22g
  - number: 22g.2
    text: |-
      Het openbaar ministerie doet deze kennisgeving zo spoedig mogelijk aan de veroordeelde betekenen. De kennisgeving
      behelst het aantal uren taakstraf dat naar het oordeel van het openbaar ministerie is verricht, alsmede het aantal
      dagen vervangende hechtenis.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22g
  - number: 22g.3
    text: |-
      Tegen de kennisgeving, bedoeld in het tweede lid, kan de veroordeelde binnen veertien dagen na de betekening
      daarvan een bezwaarschrift indienen bij de rechter die de straf oplegde. De rechter kan de beslissing van het
      openbaar ministerie wijzigen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22g
  - number: 22g.4
    text: |-
      Op de tenuitvoerlegging van de vervangende hechtenis is [artikel 15][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel15
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22g
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '15'
  - number: 22h
    text: |-
      Op de behandeling van het bezwaarschrift als bedoeld in
      [artikel 22f, derde lid][ref1], en [artikel 22g, derde lid][ref2], zijn de
      [artikelen 14h, met uitzondering van de eerste volzin van het eerste lid][ref3], [14i][ref4] en
      [14j van dit wetboek][ref5] en [artikel 449, derde lid, van het Wetboek van Strafvordering][ref6] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel22f
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel22g
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel14h
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel14i
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel14j
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel449
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22h
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 22f
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 22g
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 14h
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 14i
      - id: ref5
        bwb_id: BWBR0001854
        artikel: 14j
      - id: ref6
        bwb_id: BWBR0001903
        artikel: '449'
  - number: 22i
    text: |-
      Het openbaar ministerie kan een beslissing als bedoeld in [artikel 22f, eerste lid][ref1], of
      [artikel 22g, eerste lid][ref2], slechts nemen gedurende de termijn waarbinnen de taakstraf dient te zijn voltooid,
      genoemd in [artikel 22c, derde lid][ref3], of binnen drie maanden na afloop van deze termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel22f
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel22g
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel22c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22i
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 22f
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 22g
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 22c
  - number: 22j
    text: |-
      Indien naar het oordeel van het openbaar ministerie de opgelegde taak naar behoren is verricht, stelt het zo
      spoedig mogelijk de veroordeelde hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22j
  - number: 22k
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de inhoud van de taakstraf, de
      tenuitvoerlegging van de taakstraf en de rechten en plichten van de tot een taakstraf veroordeelde.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel22k
  - number: '23.1'
    text: |-
      Hij die tot een geldboete is veroordeeld is verplicht tot betaling van het bij de rechterlijke uitspraak
      vastgestelde bedrag aan de staat binnen de termijn door het openbaar ministerie dat met de tenuitvoerlegging van
      het vonnis of arrest is belast, te stellen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel23
  - number: '23.2'
    text: Het bedrag van de geldboete is ten minste € 3.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel23
  - number: '23.3'
    text: |-
      De geldboete die voor een strafbaar feit ten hoogste kan worden opgelegd, is gelijk aan het bedrag van de categorie
      die voor dat feit is bepaald.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel23
  - number: '23.4'
    text: |-
      Er zijn zes categorieën: de eerste categorie, € 335; de tweede categorie, € 3 350; de derde categorie, € 6 700; de
      vierde categorie, € 16 750; de vijfde categorie, € 67 000; de zesde categorie, € 670 000.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel23
  - number: '23.5'
    text: |-
      Voor een overtreding, onderscheidenlijk een misdrijf, waarop geen geldboete is gesteld, kan de rechter een
      geldboete opleggen tot ten hoogste het bedrag van de eerste, onderscheidenlijk de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel23
  - number: '23.6'
    text: |-
      Voor een overtreding, onderscheidenlijk een misdrijf, waarop een geldboete is gesteld, maar waarvoor geen
      boetecategorie is bepaald, kan de rechter een geldboete opleggen tot ten hoogste het bedrag van de eerste,
      onderscheidenlijk de derde categorie, indien dit bedrag hoger is dan het bedrag van de op het betrokken strafbare
      feit gestelde geldboete.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel23
  - number: '23.7'
    text: |-
      Bij veroordeling van een rechtspersoon kan, indien de voor het feit bepaalde boetecategorie geen passende
      bestraffing toelaat, een geldboete worden opgelegd tot ten hoogste het bedrag van de naast hogere categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel23
  - number: '23.8'
    text: |-
      Het voorgaande lid is van overeenkomstige toepassing bij veroordeling van een vennootschap zonder
      rechtspersoonlijkheid, maatschap of doelvermogen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel23
  - number: '23.9'
    text: |-
      De in het vierde lid genoemde bedragen worden elke twee jaar, met ingang van 1 januari van een jaar, bij algemene
      maatregel van bestuur aangepast aan de ontwikkeling van het prijsindexcijfer van de gezinsconsumptie sinds de
      vorige aanpassing van deze bedragen. Bij deze aanpassing wordt het geldbedrag van de eerste categorie op een
      veelvoud van € 5 naar beneden afgerond en worden, uitgaande van het geldbedrag van deze eerste categorie en onder
      instandhouding van de onderlinge verhouding tussen de bedragen van de geldboetecategorieën, de bedragen van de
      tweede tot en met de zesde geldboetecategorie bepaald.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel23
  - number: '24'
    text: |-
      Bij de vaststelling van de geldboete houdt de rechter rekening met de draagkracht van de verdachte in de mate
      waarin hij dat nodig acht met het oog op een passende bestraffing van de verdachte zonder dat deze in zijn inkomen
      en vermogen onevenredig wordt getroffen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24
  - number: 24a.1
    text: |-
      Indien bij het vonnis een of meer geldboeten zijn opgelegd tot een bedrag van ten minste € 225, is de rechter
      bevoegd bij de uitspraak te bepalen, dat de veroordeelde het bedrag in gedeelten mag voldoen. Elk van die gedeelten
      wordt daarbij op ten minste € 45 bepaald.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24a
  - number: 24a.2
    text: |-
      In geval van toepassing van het eerste lid stelt de rechter bij de uitspraak tevens termijnen vast voor de betaling
      van het tweede en - zo de geldboete in meer gedeelten mag worden voldaan - de volgende gedeelten.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24a
  - number: 24a.3
    text: |-
      Deze termijnen worden op ten minste één en ten hoogste drie maanden gesteld. Zij mogen te zamen een tijdvak van
      twee jaar niet overschrijden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24a
  - number: 24b.1
    text: |-
      Wanneer een ingevolge een onherroepelijke veroordeling tot geldboete te betalen bedrag binnen de daarvoor gestelde
      termijn niet in zijn geheel is voldaan, wordt de veroordeelde door het openbaar ministerie schriftelijk tot
      betaling aangemaand. Het bedrag wordt dan van rechtswege verhoogd met € 15. Het openbaar ministerie wijst de
      veroordeelde op het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24b
  - number: 24b.2
    text: |-
      Is het overeenkomstig het eerste lid verhoogde bedrag na verloop van de bij de aanmaning gestelde termijn geheel of
      ten dele onbetaald gebleven, dan wordt het bedrag, dan wel het nog verschuldigde gedeelte daarvan, van rechtswege
      verder verhoogd met een vijfde, doch ten minste met € 30.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24b
  - number: 24b.3
    text: |-
      Een geldboete die krachtens een rechterlijke beslissing overeenkomstig [artikel 24][ref1] in gedeelten mag worden
      voldaan, of ten aanzien waarvan het openbaar ministerie betaling in termijnen heeft toegestaan, is onmiddellijk in
      haar geheel opeisbaar, zodra een verhoging krachtens het eerste lid is ingetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 24a
  - number: 24b.4
    text: |-
      In gevallen waarin het openbaar ministerie, nadat de veroordeelde reeds in verzuim was, alsnog uitstel van betaling
      heeft verleend, dan wel afbetaling heeft toegestaan, vinden de voorgaande leden van dit artikel geen toepassing,
      zolang de veroordeelde zijn verplichtingen volgens de getroffen nadere regeling nakomt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24b
  - number: 24b.5
    text: |-
      Betalingen door de veroordeelde gedaan, worden geacht in de eerste plaats tot voldoening van de krachtens het
      eerste en tweede lid ingetreden verhogingen te strekken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24b
  - number: 24c.1
    text: |-
      Bij de uitspraak waarbij geldboete wordt opgelegd, beveelt de rechter voor het geval dat noch volledige betaling
      noch volledig verhaal van het verschuldigde bedrag volgt, dat vervangende hechtenis zal worden toegepast. Indien
      de veroordeelde een rechtspersoon is, blijft dit bevel achterwege. Artikel 51, laatste lid, is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24c
  - number: 24c.2
    text: De duur van de vervangende hechtenis wordt in gehele dagen, weken of maanden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24c
  - number: 24c.3
    text: |-
      De vervangende hechtenis beloopt ten minste één dag en ten hoogste een jaar. Voor elke volle € 25 van de geldboete
      wordt niet meer dan één dag opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24c
  - number: 24c.4
    text: |-
      Wanneer een gedeelte van het verschuldigde bedrag is voldaan, vermindert de duur van de vervangende hechtenis
      naar evenredigheid. Heeft deze vermindering tot gevolg dat voor een gedeelte van een dag vervangende hechtenis zou
      moeten worden ondergaan, dan vindt afronding naar boven plaats tot het naaste aantal gehele dagen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24c
  - number: 24c.5
    text: |-
      Het vorige lid is ook van toepassing in gevallen waarin de betaling geschiedt nadat reeds een deel van de
      vervangende hechtenis ten uitvoer is gelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24c
  - number: 24e
    text: |-
      Op de tenuitvoerlegging van vervangende hechtenis is het bepaalde in [artikel 15][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel15
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel24e
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '15'
  - number: '26'
    text: 'De gevangenisstraf en de hechtenis gaan, voor zover elk van deze straffen betreft, in:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel26
  - number: 26.a
    text: |-
      ten aanzien van veroordeelden die zich in voorlopige hechtenis bevinden ter zake van het feit waarvoor zij
      veroordeeld zijn, op de dag waarop de rechterlijke uitspraak in kracht van gewijsde is gegaan;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel26
  - number: 26.b
    text: ten aanzien van andere veroordeelden, op de dag van de tenuitvoerlegging van de rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel26
  - number: '27.1'
    text: |-
      Bij het opleggen van tijdelijke gevangenisstraf, hechtenis of taakstraf beveelt de rechter, dat de tijd die
      door de veroordeelde vóór de tenuitvoerlegging van de uitspraak in verzekering, in voorlopige hechtenis,
      in een psychiatrisch ziekenhuis of een inrichting voor klinische observatie bestemd ingevolge een bevel tot
      observatie of in detentie in het buitenland ingevolge een Nederlands verzoek om uitlevering of om overlevering
      is doorgebracht, bij de uitvoering van die straf geheel in mindering zal worden gebracht. Indien hij dit
      bevel geeft terzake van een taakstraf, bepaalt hij in zijn uitspraak volgens welke maatstaf de aftrek
      zal geschieden. Het vorenstaande blijft buiten toepassing voor zover die tijd reeds met toepassing van
      [artikel 68, eerste lid, laatste volzin, van het Wetboek van Strafvordering][ref1] in mindering is gebracht op een
      andere vrijheidsstraf die de veroordeelde heeft ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel68
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '68'
  - number: '27.2'
    text: |-
      Bij het berekenen van de in mindering te brengen tijd geldt de eerste dag van de verzekering als een volle dag en
      blijft de dag waarop zij is geëindigd buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel27
  - number: '27.3'
    text: |-
      De rechter kan een overeenkomstig bevel geven bij het opleggen van geldboete. Indien hij dit bevel geeft, bepaalt
      hij in zijn uitspraak volgens welke maatstaf de aftrek zal geschieden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel27
  - number: '27.4'
    text: |-
      De voorgaande leden van dit artikel zijn ook van toepassing in gevallen waarin, bij gelijktijdige vervolging wegens
      twee of meer feiten, de veroordeling wordt uitgesproken ter zake van een ander feit dan dat waarvoor de verzekering
      of de voorlopige hechtenis is bevolen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel27
  - number: 27a
    text: |-
      De tijd die door de tot gevangenisstraf of hechtenis veroordeelde in het buitenland in detentie is doorgebracht
      ingevolge een Nederlands verzoek om uitlevering ten behoeve van de tenuitvoerlegging of verdere tenuitvoerlegging
      van deze straf, komt daarop in mindering.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel27a
  - number: '28.1'
    text: |-
      De rechten waarvan de schuldige, in de bij de wet bepaalde gevallen, bij rechterlijke uitspraak kan worden ontzet,
      zijn:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel28
  - number: 28.1.1°
    text: het bekleden van ambten of van bepaalde ambten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel28
  - number: 28.1.2°
    text: het dienen bij de gewapende macht;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel28
  - number: 28.1.3°
    text: |-
      het recht de leden van algemeen vertegenwoordigende organen te verkiezen en tot lid van deze organen te worden
      verkozen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel28
  - number: 28.1.4°
    text: het zijn van raadsman of gerechtelijk bewindvoerder;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel28
  - number: 28.1.5°
    text: de uitoefening van bepaalde beroepen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel28
  - number: '28.2'
    text: |-
      Ontzetting van leden van de rechterlijke macht die, hetzij voor hun leven, hetzij voor een bepaalde tijd, zijn
      aangesteld, of van andere voor hun leven aangestelde ambtenaren, geschiedt, ten opzichte van het ambt waartoe zij
      aldus zijn aangesteld, alleen in de gevallen en op de wijze bij de wet bepaald.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel28
  - number: '28.3'
    text: |-
      Ontzetting van het recht bedoeld in het eerste lid, onder 3°, kan alleen worden uitgesproken bij veroordeling tot
      gevangenisstraf van ten minste een jaar.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel28
  - number: '29'
    text: |-
      Ontzetting van het recht om ambten of bepaalde ambten te bekleden en bij de gewapende macht te dienen kan, behalve
      in de gevallen in het Tweede Boek omschreven, worden uitgesproken bij veroordeling wegens enig ambtsmisdrijf of
      wegens enig misdrijf waardoor de schuldige een bijzondere ambtsplicht schond of waarbij hij gebruik maakte van
      macht, gelegenheid of middel hem door zijn ambt geschonken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel29
  - number: '31.1'
    text: 'Wanneer ontzetting van rechten wordt uitgesproken, bepaalt de rechter de duur als volgt:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel31
  - number: 31.1.1°
    text: bij veroordeling tot levenslange gevangenisstraf, voor het leven;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel31
  - number: 31.1.2°
    text: |-
      bij veroordeling tot tijdelijke gevangenisstraf of tot hechtenis, voor een tijd de duur van de hoofdstraf ten
      minste twee en ten hoogste vijf jaren te boven gaande;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel31
  - number: 31.1.3°
    text: bij veroordeling tot geldboete, voor een tijd van ten minste twee en ten hoogste vijf jaren;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel31
  - number: 31.1.4°
    text: bij afzonderlijke oplegging, voor een tijd van ten minste twee en ten hoogste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel31
  - number: '31.2'
    text: |-
      De ontzetting van het recht vermeld in [artikel 28, eerste lid, onder 3°][ref1], gaat in op de
      dag dat de veroordeling daartoe onherroepelijk is geworden. De ontzetting van een van de andere in
      [artikel 28, eerste lid][ref2], vermelde rechten gaat in op de dag waarop de rechterlijke uitspraak kan worden ten
      uitvoer gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '33.1'
    text: Verbeurdverklaring kan worden uitgesproken bij veroordeling wegens enig strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33
  - number: '33.2'
    text: |-
      [Artikel 24][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '24'
  - number: 33a.1
    text: 'Vatbaar voor verbeurdverklaring zijn:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33a
  - number: 33a.1.a
    text: |-
      voorwerpen die aan de veroordeelde toebehoren of die hij geheel of ten dele ten eigen bate kan aanwenden en die
      geheel of grotendeels door middel van het strafbare feit zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33a
  - number: 33a.1.b
    text: voorwerpen met betrekking tot welke het feit is begaan;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33a
  - number: 33a.1.c
    text: voorwerpen met behulp van welke het feit is begaan of voorbereid;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33a
  - number: 33a.1.d
    text: voorwerpen met behulp van welke de opsporing van het misdrijf is belemmerd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33a
  - number: 33a.1.e
    text: voorwerpen die tot het begaan van het misdrijf zijn vervaardigd of bestemd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33a
  - number: 33a.1.f
    text: zakelijke rechten op of persoonlijke rechten ten aanzien van de onder *a* tot en met *e* bedoelde voorwerpen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33a
  - number: 33a.2
    text: |-
      Voorwerpen als bedoeld in het eerste lid onder *a* tot en met *e* die niet aan de veroordeelde toebehoren kunnen
      alleen verbeurd worden verklaard indien:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33a
  - number: 33a.2.a
    text: |-
      degene aan wie zij toebehoren bekend was met hun verkrijging door middel van het strafbare feit of met het gebruik
      of de bestemming in verband daarmede, dan wel die verkrijging, dat gebruik of die bestemming redelijkerwijs had
      kunnen vermoeden, of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33a
  - number: 33a.2.b
    text: niet is kunnen worden vastgesteld aan wie zij toebehoren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33a
  - number: 33a.3
    text: |-
      Rechten als bedoeld in het eerste lid, onder *f*, die niet aan de veroordeelde toebehoren kunnen alleen verbeurd
      worden verklaard indien degene aan wie zij toebehoren bekend was met de verkrijging van de voorwerpen waarop of
      ten aanzien waarvan deze rechten bestaan, door middel van het strafbare feit of met het gebruik of de bestemming in
      verband daarmede, danwel die verkrijging, dat gebruik of die bestemming redelijkerwijs had kunnen vermoeden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33a
  - number: 33a.4
    text: Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33a
  - number: 33b
    text: |-
      In de verbeurdverklaring van een voorwerp is begrepen die van de verpakking waarin het zich bevindt, tenzij de
      rechter het tegendeel bepaalt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33b
  - number: 33c.1
    text: |-
      Bij de verbeurdverklaring van voorwerpen kan de rechter voor het geval waarin de verbeurd verklaarde voorwerpen
      meer zouden opbrengen dan een in de uitspraak vastgesteld bedrag, bevelen dat het verschil wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33c
  - number: 33c.2
    text: |-
      De rechter kent een vergoeding, als bedoeld in het eerste lid, of een geldelijke tegemoetkoming toe wanneer dit
      nodig is om te voorkomen dat de verdachte, of een ander aan wie de verbeurd verklaarde voorwerpen toebehoren,
      onevenredig zou worden getroffen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33c
  - number: 33c.3
    text: |-
      De rechter bepaalt aan wie het bedrag van de vergoeding of tegemoetkoming wordt uitbetaald; zulks laat ieders recht
      op dit bedrag onverlet.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel33c
  - number: '34.1'
    text: |-
      Niet in beslag genomen voorwerpen worden, bij verbeurdverklaring, in de uitspraak op een bepaald geldelijk bedrag
      geschat.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel34
  - number: '34.2'
    text: De voorwerpen moeten in dit geval worden uitgeleverd of de geschatte waarde moet worden betaald.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel34
  - number: '34.3'
    text: |-
      [De artikelen 24b][ref1], [24c][ref2] en 25 vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel24c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 24c
  - number: '35.1'
    text: |-
      De kosten van gevangenisstraf en hechtenis komen, voor zover niet bij of krachtens enige wet anders is bepaald, ten
      laste van de Staat.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel35
  - number: '35.2'
    text: Al hetgeen wordt verkregen uit geldboeten en verbeurdverklaringen komt ten bate van de Staat.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel35
  - number: '36.1'
    text: |-
      In de gevallen waarin de rechter krachtens de wet de openbaarmaking van zijn uitspraak gelast, bepaalt hij tevens
      de wijze waarop aan die last uitvoering wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36
  - number: '36.2'
    text: De kosten van openbaarmaking worden in de uitspraak op een bepaald bedrag geschat.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36
  - number: '36.3'
    text: |-
      De [artikelen 24b][ref1], [24c][ref2] en 25 vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel24c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 24c
  - number: 36a
    text: |-
      Alle kosten van tenuitvoerlegging van de in deze afdeling bedoelde maatregelen - met uitzondering van de kosten
      van het verhaal, de invorderingskosten daaronder begrepen, - komen ten laste, al hetgeen door die tenuitvoerlegging
      wordt verkregen, komt ten bate van de staat, met uitzondering van hetgeen door de tenuitvoerlegging van de
      maatregel, genoemd in [artikel 36f][ref1], wordt verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36f
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 36f
        afdeling: Eerste
  - number: 36b.1
    text: 'Onttrekking aan het verkeer van in beslag genomen voorwerpen kan worden uitgesproken:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36b
  - number: 36b.1.1°
    text: bij de rechterlijke uitspraak waarbij iemand wegens een strafbaar feit wordt veroordeeld;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36b
  - number: 36b.1.2°
    text: |-
      bij de rechterlijke uitspraak waarbij overeenkomstig [artikel 9][ref1] wordt bepaald dat geen straf zal worden
      opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 9a
  - number: 36b.1.3°
    text: |-
      bij de rechterlijke uitspraak waarbij, niettegenstaande vrijspraak of ontslag van alle rechtsvervolging, wordt
      vastgesteld dat een strafbaar feit is begaan;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36b
  - number: 36b.1.4°
    text: bij een afzonderlijke rechterlijke beschikking op vordering van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36b
  - number: 36b.2
    text: |-
      De [artikelen 33][ref1] en [33][ref2], alsmede [artikel 446 van het Wetboek van Strafvordering][ref3], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel33b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel33c
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel446
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 33b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 33c
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '446'
  - number: 36b.3
    text: De maatregel kan te zamen met straffen en met andere maatregelen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36b
  - number: 36c
    text: 'Vatbaar voor onttrekking aan het verkeer zijn alle voorwerpen:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36c
  - number: 36c.1°
    text: die geheel of grotendeels door middel van of uit de baten van het feit zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36c
  - number: 36c.2°
    text: met betrekking tot welke het feit is begaan;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36c
  - number: 36c.3°
    text: met behulp van welke het feit is begaan of voorbereid;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36c
  - number: 36c.4°
    text: met behulp van welke de opsporing van het feit is belemmerd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36c
  - number: 36c.5°
    text: die tot het begaan van het feit zijn vervaardigd of bestemd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36c
  - number: 36d
    text: |-
      Vatbaar voor onttrekking aan het verkeer zijn bovendien de aan de dader of verdachte toebehorende voorwerpen van
      zodanige aard dat het ongecontroleerde bezit daarvan in strijd is met de wet of met het algemeen belang, welke
      bij gelegenheid van het onderzoek naar het door hem begane feit, dan wel het feit waarvan hij wordt verdacht, zijn
      aangetroffen, doch alleen indien de voorwerpen kunnen dienen tot het begaan of de voorbereiding van soortgelijke
      feiten, dan wel tot de belemmering van de opsporing daarvan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36d
  - number: 36e.1
    text: |-
      Op vordering van het openbaar ministerie kan bij een afzonderlijke rechterlijke beslissing aan degene die is
      veroordeeld wegens een strafbaar feit de verplichting worden opgelegd tot betaling van een geldbedrag aan de staat
      ter ontneming van wederrechtelijk verkregen voordeel.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36e
  - number: 36e.2
    text: |-
      De verplichting kan worden opgelegd aan de in het eerste lid bedoelde persoon die voordeel heeft verkregen door
      middel van of uit de baten van het daar bedoelde strafbare feit of soortgelijke feiten of feiten waarvoor een
      geldboete van de vijfde categorie kan worden opgelegd, waaromtrent voldoende aanwijzingen bestaan dat zij door hem
      zijn begaan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36e
  - number: 36e.3
    text: |-
      Op vordering van het openbaar ministerie kan bij een afzonderlijke rechterlijke beslissing aan degene die is
      veroordeeld wegens een misdrijf, waarvoor een geldboete van de vijfde categorie kan worden opgelegd, en tegen
      wie als verdachte van dat misdrijf een strafrechtelijk financieel onderzoek is ingesteld, de verplichting worden
      opgelegd tot betaling van een geldbedrag aan de staat ter ontneming van wederrechtelijk verkregen voordeel, indien
      gelet op dat onderzoek aannemelijk is dat ook dat feit of andere strafbare feiten er op enigerlei wijze toe hebben
      geleid dat de veroordeelde wederrechtelijk voordeel heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36e
  - number: 36e.4
    text: |-
      De rechter stelt het bedrag vast waarop het wederrechtelijk verkregen voordeel wordt geschat. Onder voordeel is
      de besparing van kosten begrepen. De waarde van voorwerpen die door de rechter tot het wederrechtelijk verkregen
      voordeel worden gerekend, kan worden geschat op de marktwaarde op het tijdstip van de beslissing of door verwijzing
      naar de bij openbare verkoop te behalen opbrengst, indien verhaal moet worden genomen. De rechter kan het te
      betalen bedrag lager vaststellen dan het geschatte voordeel. Op het gemotiveerde verzoek van de verdachte of
      veroordeelde kan de rechter, indien de huidige en de redelijkerwijs te verwachten toekomstige draagkracht van de
      verdachte of veroordeelde niet toereikend zullen zijn om het te betalen bedrag te voldoen, bij de vaststelling van
      het te betalen bedrag daarmee rekening houden. Bij het ontbreken van zodanig verzoek kan de rechter ambtshalve of
      op vordering van de officier van justitie deze bevoegdheid toepassen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36e
  - number: 36e.5
    text: Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36e
  - number: 36e.6
    text: |-
      Bij de bepaling van de omvang van het bedrag waarop het wederrechtelijk verkregen voordeel wordt geschat, worden
      aan benadeelde derden in rechte toegekende vorderingen in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36e
  - number: 36e.7
    text: |-
      Bij de oplegging van de maatregel wordt rekening gehouden met uit hoofde van eerdere beslissingen opgelegde
      verplichtingen tot betaling van een geldbedrag ter ontneming van wederrechtelijk verkregen voordeel.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36e
  - number: 36e.8
    text: |-
      Lijfsdwang kan met toepassing van [artikel 577c van het Wetboek van Strafvordering][ref1] door de rechter tot
      maximaal drie jaar worden bevolen en geldt als maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel577c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36e
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 577c
  - number: 36f.1
    text: |-
      Bij een rechterlijke uitspraak waarbij iemand wegens een strafbaar feit wordt veroordeeld, kan hem de verplichting
      worden opgelegd tot betaling aan de staat van een som geld ten behoeve van het slachtoffer. De staat keert een
      ontvangen bedrag onverwijld uit aan het slachtoffer.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36f
  - number: 36f.2
    text: |-
      De rechter kan de maatregel opleggen indien en voor zover de verdachte jegens het slachtoffer naar burgerlijk recht
      aansprakelijk is voor de schade die door het strafbare feit is toegebracht.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36f
  - number: 36f.3
    text: De maatregel kan te zamen met straffen en andere maatregelen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36f
  - number: 36f.4
    text: |-
      De [artikelen 24][ref1] en [24][ref2], zijn van overeenkomstige toepassing, met dien verstande dat de verhoging van
      het ingevolge de maatregel verschuldigde bedrag vervalt aan de staat.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel24b
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36f
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 24a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 24b
  - number: 36f.5
    text: |-
      Betalingen door de veroordeelde aan de staat verricht, strekken in de eerste plaats tot voldoening van de maatregel
      en vervolgens tot voldoening van de krachtens het vierde lid ingetreden verhogingen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36f
  - number: 36f.6
    text: |-
      De [artikelen 24c][ref1] en [77l, tweede tot en met zesde lid][ref2], zijn van overeenkomstige toepassing, met dien
      verstande dat de toepassing van de vervangende hechtenis of vervangende jeugddetentie de verplichting ingevolge de
      maatregel tot schadevergoeding ten behoeve van het slachtoffer niet opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24c
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77l
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel36f
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 24c
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77l
  - number: '37.1'
    text: |-
      De rechter kan gelasten dat degene aan wie een strafbaar feit wegens de gebrekkige ontwikkeling of ziekelijke
      stoornis van zijn geestvermogens niet kan worden toegerekend, in een psychiatrisch ziekenhuis zal worden geplaatst
      voor een termijn van een jaar, doch alleen indien hij gevaarlijk is voor zichzelf, voor anderen, of voor de
      algemene veiligheid van personen of goederen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37
  - number: '37.2'
    text: |-
      De rechter geeft een last als bedoeld in het eerste lid slechts nadat hij zich een met redenen omkleed, gedagtekend
      en ondertekend advies heeft doen overleggen van ten minste twee gedragsdeskundigen van verschillende disciplines
        - waaronder een psychiater - die de betrokkene hebben onderzocht. Zodanig advies dient door de gedragsdeskundigen
      gezamenlijk dan wel door ieder van hen afzonderlijk te zijn uitgebracht. Indien dit advies eerder dan een jaar voor
      de aanvang van de terechtzitting is gedagtekend kan de rechter hiervan slechts gebruik maken met instemming van het
      openbaar ministerie en de verdachte.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37
  - number: '37.3'
    text: |-
      Het tweede lid blijft buiten toepassing indien de betrokkene weigert medewerking te verlenen aan het onderzoek
      dat ten behoeve van het advies moet worden verricht. Voor zover mogelijk maken de gedragsdeskundigen gezamenlijk
      dan wel ieder van hen afzonderlijk over de reden van de weigering rapport op. De rechter doet zich zoveel mogelijk
      een ander advies of rapport, dat hem over de wenselijkheid of noodzakelijkheid van een last als bedoeld in het
      eerste lid kan voorlichten en aan de totstandkoming waarvan de betrokkene wel bereid is om medewerking te verlenen,
      overleggen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37
  - number: 37a.1
    text: |-
      De verdachte bij wie tijdens het begaan van het feit gebrekkige ontwikkeling of ziekelijke stoornis van de
      geestvermogens bestond, kan op last van de rechter ter beschikking worden gesteld indien:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37a
  - number: 37a.1.1°
    text: |-
      het door hem begane feit een misdrijf is waarop naar de wettelijke omschrijving een
      gevangenisstraf van vier jaren of meer is gesteld dan wel behoort tot een der misdrijven
      omschreven in de [artikelen 132][ref1], [285, eerste lid][ref2], [285b][ref3], en
      [395 van het Wetboek van Strafrecht,][ref4][175, tweede lid, onderdeel b, van de Wegenverkeerswet 1994][ref5], en
      [11, tweede lid, van de Opiumwet][ref6], en


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel285
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel285b
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel395
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel175
      [ref6]: https://wetten.overheid.nl/BWBR0001941#Artikel11
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '132'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '285'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 285b
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '395'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '175'
      - id: ref6
        bwb_id: BWBR0001941
        artikel: '11'
  - number: 37a.1.2°
    text: |-
      de veiligheid van anderen, dan wel de algemene veiligheid van personen of goederen het opleggen van die maatregel
      eist.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37a
  - number: 37a.2
    text: |-
      Bij toepassing van het vorige lid kan de rechter afzien van het opleggen van straf, ook indien hij bevindt dat het
      feit wel aan de verdachte kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37a
  - number: 37a.3
    text: |-
      [Het tweede en derde lid van artikel 37][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '37'
        afdeling: Tweede
  - number: 37a.4
    text: |-
      Bij het geven van een last als bedoeld in het eerste lid neemt de rechter de inhoud van de overige adviezen en
      rapporten die over de persoonlijkheid van de verdachte zijn uitgebracht, alsmede de ernst van het begane feit of de
      veelvuldigheid van voorafgegane veroordelingen wegens misdrijf in aanmerking.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37a
  - number: 37b.1
    text: |-
      De rechter kan bevelen dat de ter beschikking gestelde van overheidswege wordt verpleegd, indien de veiligheid van
      anderen dan wel de algemene veiligheid van personen of goederen de verpleging eist.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37b
  - number: 37b.2
    text: |-
      Indien de rechter naast de maatregel van terbeschikkingstelling met bevel tot verpleging van overheidswege een
      gevangenisstraf heeft opgelegd kan de rechter in zijn uitspraak een advies opnemen omtrent het tijdstip waarop de
      terbeschikkingstelling met verpleging van overheidswege dient aan te vangen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37b
  - number: 37c.1
    text: |-
      Bij of krachtens de wet worden regels gesteld ten aanzien van de verpleging van overheidswege en de rechtspositie
      van de ter beschikking gestelden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37c
  - number: 37c.2
    text: |-
      De Minister van Justitie ziet erop toe, dat de ter beschikking gestelde die van overheidswege wordt verpleegd
      de nodige behandeling krijgt. Hij kan met betrekking tot bepaalde verpleegden aan het hoofd van de inrichting
      bijzondere aanwijzingen geven in het belang van de veiligheid van anderen of de algemene veiligheid van personen
      of goederen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37c
  - number: 37d.1
    text: 'Ter beschikking gestelden kunnen worden verpleegd in door de Minister van Justitie aangewezen:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37d
  - number: 37d.1.a
    text: particuliere inrichtingen, in beheer bij een in Nederland gevestigde rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37d
  - number: 37d.1.b
    text: rijksinrichtingen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37d
  - number: 37d.2
    text: De verpleging geschiedt bij voorkeur in een particuliere inrichting.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37d
  - number: 37e
    text: |-
      De kosten van de verpleging en behandeling van ter beschikking gestelden komen, voor zover niet bij of krachtens
      enige wet anders is bepaald, ten laste van de Staat.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel37e
  - number: '38.1'
    text: |-
      Indien de rechter niet een bevel als bedoeld in [artikel 37b][ref1] geeft, stelt hij ter bescherming van de
      veiligheid van anderen dan wel de algemene veiligheid van personen of goederen voorwaarden betreffende het gedrag
      van de ter beschikking gestelde. De rechter geeft tevens een in de uitspraak aangewezen instelling, die aan
      bepaalde, bij of krachtens algemene maatregel van bestuur te stellen, eisen voldoet opdracht de ter beschikking
      gestelde bij de naleving van de voorwaarden hulp en steun te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37b
        afdeling: Tweede
  - number: '38.2'
    text: |-
      Indien bij de uitspraak tevens een vrijheidsstraf wordt opgelegd, kan deze in het in het eerste lid van dit artikel
      bedoelde geval ten hoogste op drie jaar worden bepaald.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38
  - number: '38.3'
    text: |-
      Een voorwaarde als bedoeld in het eerste lid kan de rechter slechts stellen, indien de ter beschikking gestelde
      zich bereid heeft verklaard tot naleving van de voorwaarde.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38
  - number: '38.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de procedure van
      terbeschikkingstelling met voorwaarden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38
  - number: 38a.1
    text: |-
      De voorwaarden bedoeld in [het eerste lid van artikel 38][ref1] kunnen inhouden dat de ter beschikking gestelde
      zich in een door de rechter aangewezen inrichting laat opnemen, zich onder behandeling stelt van een in de
      uitspraak aangewezen deskundige, of door de behandelend arts voorgeschreven geneesmiddelen inneemt dan wel gedoogt
      dat deze door de behandelend arts aan hem worden toegediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '38'
        afdeling: Tweede
  - number: 38a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de eisen waaraan een door de
      rechter aan te wijzen inrichting moet voldoen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38a
  - number: 38a.3
    text: |-
      Het openbaar ministerie houdt, volgens regels te stellen bij algemene maatregel van bestuur, toezicht op de
      naleving van de gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38a
  - number: 38a.4
    text: |-
      De in [artikel 38, eerste lid][ref1], bedoelde voorwaarden mogen de vrijheid de godsdienst of levensovertuiging te
      belijden en de staatkundige vrijheid niet beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '38'
        afdeling: Tweede
  - number: 38b
    text: |-
      De rechter kan, op vordering van het openbaar ministerie of op verzoek van de ter beschikking gestelde of diens
      raadsman, met inachtneming van het bepaalde in de voorgaande artikelen van deze afdeling:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38b
  - number: 38b.1°
    text: de voorwaarden aanvullen, wijzigen of opheffen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38b
  - number: 38b.2°
    text: |-
      aan een andere instelling dan die welke daarmede tevoren was belast het verlenen van hulp en steun bij de naleving
      van de voorwaarden opdragen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38b
  - number: 38c
    text: |-
      De rechter kan, op vordering van het openbaar ministerie, indien een gestelde voorwaarde niet wordt nageleefd of
      anderszins het belang van de veiligheid van anderen dan wel de algemene veiligheid van personen of goederen zulks
      eist bevelen dat de ter beschikking gestelde alsnog van overheidswege zal worden verpleegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38c
  - number: 38d.1
    text: |-
      De terbeschikkingstelling geldt voor de tijd van twee jaar, te rekenen van de dag waarop de rechterlijke uitspraak
      waarbij zij is opgelegd onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38d
  - number: 38d.2
    text: |-
      De termijn van de terbeschikkingstelling kan, behoudens het bepaalde in [artikel 38e][ref1] of [artikel 38j][ref2],
      door de rechter, op vordering van het openbaar ministerie, telkens hetzij met een jaar hetzij met twee jaar
      worden verlengd, indien de veiligheid van anderen, dan wel de algemene veiligheid van personen of goederen die
      verlenging eist. Een tweede verlenging is slechts mogelijk wanneer een bevel als bedoeld in [artikel 37b][ref3] of
      [artikel 38c][ref4] is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38e
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38j
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel38c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38e
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38j
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 37b
        afdeling: Tweede
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 38c
        afdeling: Tweede
  - number: 38e.1
    text: |-
      De totale duur van de maatregel van terbeschikkingstelling gaat een periode van vier jaar niet te boven, tenzij
      de terbeschikkingstelling is opgelegd ter zake van een misdrijf dat gericht is tegen of gevaar veroorzaakt voor de
      onaantastbaarheid van het lichaam van een of meer personen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38e
  - number: 38e.2
    text: |-
      Indien de totale duur van de terbeschikkingstelling niet in tijd is beperkt, kan de termijn van de
      terbeschikkingstelling telkens worden verlengd, wanneer de veiligheid van anderen, dan wel de algemene veiligheid
      van personen die verlenging eist.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38e
  - number: 38f.1
    text: 'De termijn van de terbeschikkingstelling loopt niet:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38f
  - number: 38f.1.a
    text: |-
      gedurende de tijd dat de ter beschikking gestelde die van overheidswege wordt verpleegd uit anderen hoofde rechtens
      zijn vrijheid is ontnomen en gedurende de tijd dat hij uit zodanige vrijheidsontneming ongeoorloofd afwezig is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38f
  - number: 38f.1.b
    text: |-
      gedurende de tijd dat de ter beschikking gestelde met voorwaarden, bedoeld in [artikel 38, eerste lid][ref1],
      rechtens zijn vrijheid is ontnomen en gedurende de tijd dat hij uit zodanige vrijheidsontneming ongeoorloofd
      afwezig is;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '38'
        afdeling: Tweede
  - number: 38f.1.c
    text: |-
      gedurende de tijd dat de ter beschikking gestelde die van overheidswege wordt verpleegd, langer dan een week
      achtereen ongeoorloofd afwezig is uit de inrichting voor verpleging van ter beschikking gestelden;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38f
  - number: 38f.1.d
    text: |-
      gedurende de tijd dat de ter beschikking gestelde met voorwaarde langer dan een week achtereen ongeoorloofd afwezig
      is uit de inrichting waarin hij krachtens de voorwaarde is opgenomen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38f
  - number: 38f.2
    text: |-
      In afwijking van het eerste lid, onder a, loopt de termijn van de terbeschikkingstelling wel indien de ter
      beschikking gestelde:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38f
  - number: 38f.2.a
    text: |-
      krachtens een last als bedoeld in [artikel 13][ref1] of ingevolge het bepaalde bij of krachtens de
      [Penitentiaire beginselenwet][ref2] in een inrichting voor verpleging van ter beschikking gestelden of in een ander
      psychiatrisch ziekenhuis is opgenomen, tenzij hij langer dan een week ongeoorloofd afwezig is uit die inrichting of
      dat ziekenhuis;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009709
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009709
  - number: 38f.2.b
    text: |-
      nadat de termijn van de terbeschikkingstelling een aanvang heeft genomen, in een psychiatrisch ziekenhuis is
      opgenomen, tenzij hij langer dan een week ongeoorloofd afwezig is uit dat ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38f
  - number: 38g.1
    text: |-
      De verpleging van overheidswege kan bij de beslissing tot verlenging van de terbeschikkingstelling voor de tijd van
      een jaar door de rechter ambtshalve, op vordering van het openbaar ministerie of op verzoek van de ter beschikking
      gestelde of zijn raadsman voorwaardelijk worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38g
  - number: 38g.2
    text: |-
      Indien de rechter de verpleging van overheidswege op grond van het eerste lid beëindigt, stelt hij ter bescherming
      van de veiligheid van anderen dan wel de algemene veiligheid van personen en goederen voorwaarden betreffende
      het gedrag van de ter beschikking gestelde. De [artikelen 38, eerste lid, tweede volzin en derde lid][ref1] en
      [38a][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '38'
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38a
        afdeling: Tweede
  - number: 38g.3
    text: |-
      De in het tweede lid, bedoelde voorwaarden mogen de vrijheid de godsdienst of levensovertuiging te belijden en de
      staatkundige vrijheid niet beperken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38g
  - number: 38g.4
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de procedure van de voorwaardelijke
      beëindiging van het bevel tot verpleging.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38g
  - number: 38h.1
    text: |-
      Onverminderd het bepaalde in [artikel 38g, eerste lid][ref1], kan, indien het proefverlof van een ter
      beschikking gestelde ten minste twaalf maanden onafgebroken heeft voortgeduurd, zonder dat in deze periode
      de terbeschikkingstelling is verlengd, de rechter op vordering van het openbaar ministerie of op verzoek
      van de ter beschikking gestelde of diens raadsman de verpleging van overheidswege voorwaardelijk beëindigen.
      [Artikel 38g, tweede en derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38g
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38g
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38h
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38g
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38g
        afdeling: Tweede
  - number: 38h.2
    text: |-
      In zodanig geval beëindigt de rechter de verpleging van overheidswege voorwaardelijk voor de duur van het gegeven
      bevel tot terbeschikkingstelling.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38h
  - number: 38h.3
    text: |-
      De [artikelen 509p][ref1], [509r][ref2], [509s][ref3], [509t, eerste en vijfde lid][ref4], en [509u bis van het
      Wetboek van Strafvordering](onbekend) zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel509p
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel509r
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel509s
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel509t
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38h
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 509p
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 509r
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 509s
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 509t
  - number: 38i
    text: |-
      De rechter kan ambtshalve, op vordering van het openbaar ministerie of op verzoek van de ter beschikking gestelde
      of diens raadsman, met inachtneming van het bepaalde in de voorgaande artikelen van deze afdeling:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38i
  - number: 38i.1°
    text: de voorwaarden aanvullen, wijzigen of opheffen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38i
  - number: 38i.2°
    text: |-
      aan een andere instelling dan die welke daarmede tevoren was belast het verlenen van hulp en steun bij de naleving
      van voorwaarden opdragen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38i
  - number: 38j.1
    text: |-
      In geval van voorwaardelijke beëindiging van de verpleging van overheidswege kan de terbeschikkingstelling telkens
      met een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38j
  - number: 38j.2
    text: De totale duur van de voorwaardelijke beëindiging van de verpleging bedraagt ten hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38j
  - number: 38j.3
    text: |-
      Indien de in het tweede lid bedoelde termijn is verstreken, zonder dat een last tot hervatting van de verpleging
      van overheidswege als bedoeld in [artikel 38k][ref1] is gegeven, eindigt de terbeschikkingstelling van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38k
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38j
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38k
        afdeling: Tweede
  - number: 38k
    text: |-
      De rechter kan, op vordering van het openbaar ministerie, een last tot hervatting van de verpleging van
      overheidswege geven, indien:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38k
  - number: 38k.1°
    text: een gestelde voorwaarde niet wordt nageleefd of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38k
  - number: 38k.2°
    text: het belang van de veiligheid van anderen dan wel van de algemene veiligheid van personen of goederen zulks eist, of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38k
  - number: 38k.3°
    text: |-
      wanneer toepassing is gegeven aan [artikel 38e][ref1], het belang van de veiligheid van anderen dan wel de algemene
      veiligheid van personen zulks eist.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38e
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38e
        afdeling: Tweede
  - number: 38l.1
    text: |-
      Een terbeschikkingstelling vervalt bij het onherroepelijk worden van een rechterlijke uitspraak waarbij dezelfde
      persoon wederom ter beschikking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38l
  - number: 38l.2
    text: |-
      Een last tot plaatsing in een psychiatrisch ziekenhuis vervalt bij het onherroepelijk worden van een rechterlijke
      uitspraak waarbij ten aanzien van dezelfde persoon wederom een last tot plaatsing in een psychiatrisch ziekenhuis
      is gegeven.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38l
  - number: 38l.3
    text: |-
      Een last tot plaatsing in een psychiatrisch ziekenhuis eindigt van rechtswege bij het onherroepelijk worden van een
      rechterlijke uitspraak waarbij ten aanzien van dezelfde persoon een terbeschikkingstelling met bevel tot verpleging
      van overheidswege dan wel een last tot hervatting van zodanig bevel is gegeven.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38l
  - number: 38m.1
    text: |-
      De rechter kan op vordering van het openbaar ministerie de maatregel opleggen tot plaatsing van een verdachte in
      een inrichting voor stelselmatige daders, indien:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38m
  - number: 38m.1.1°
    text: het door de verdachte begane feit een misdrijf betreft waarvoor voorlopige hechtenis is toegelaten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38m
  - number: 38m.1.2°
    text: |-
      de verdachte in de vijf jaren voorafgaand aan het door hem begane feit ten minste driemaal wegens een misdrijf
      onherroepelijk tot een vrijheidsbenemende straf of maatregel, een vrijheidsbeperkende maatregel of een taakstraf is
      veroordeeld, het feit is begaan na tenuitvoerlegging van deze straffen of maatregelen en er voorts ernstig rekening
      mede moet worden gehouden dat de verdachte wederom een misdrijf zal begaan, en
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38m
  - number: 38m.1.3°
    text: de veiligheid van personen of goederen het opleggen van de maatregel eist.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38m
  - number: 38m.2
    text: De maatregel strekt tot beveiliging van de maatschappij en de beëindiging van de recidive van de verdachte.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38m
  - number: 38m.3
    text: |-
      Indien de verdachte verslaafde is dan wel ten aanzien van hem andere specifieke problematiek bestaat waarmee het
      plegen van strafbare feiten samenhangt, strekt de maatregel er mede toe een bijdrage te leveren aan de oplossing
      van zijn verslavingsproblematiek dan wel van die andere problematiek.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38m
  - number: 38m.4
    text: |-
      De rechter legt de maatregel slechts op, nadat hij een met redenen omkleed, gedagtekend en ondertekend advies over
      de wenselijkheid of noodzakelijkheid van de maatregel heeft doen overleggen. Indien dit advies eerder dan een jaar
      voor de aanvang van de terechtzitting is gedagtekend, kan de rechter hiervan slechts gebruik maken met instemming
      van het openbaar ministerie en de verdachte.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38m
  - number: 38m.5
    text: |-
      Het vierde lid blijft buiten toepassing indien de verdachte weigert medewerking te verlenen aan het onderzoek dat
      ten behoeve van het advies moet worden verricht. Voor zover mogelijk wordt over de reden van de weigering rapport
      opgemaakt. De rechter doet zich zo veel mogelijk een ander advies of rapport dat hem over de wenselijkheid of
      noodzakelijkheid van de maatregel kan voorlichten en aan de totstandkoming waarvan de verdachte wel bereid is om
      medewerking te verlenen, overleggen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38m
  - number: 38m.6
    text: |-
      Bij het opleggen van de maatregel neemt de rechter de inhoud van de overige adviezen en rapporten die over de
      verdachte zijn uitgebracht, alsmede de veelheid van misdrijven waarvoor deze eerder is veroordeeld in aanmerking.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38m
  - number: 38n.1
    text: |-
      De maatregel geldt voor de tijd van ten hoogste twee jaren, te rekenen van de dag waarop de rechterlijke uitspraak
      waarbij hij is opgelegd, onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38n
  - number: 38n.2
    text: |-
      Bij het bepalen van de duur van de maatregel kan de rechter rekening houden met de tijd die door de veroordeelde
      vóór de tenuitvoerlegging van de uitspraak in verzekering, in voorlopige hechtenis, in een psychiatrisch ziekenhuis
      of een inrichting voor klinische observatie bestemd ingevolge een bevel tot observatie, is doorgebracht.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38n
  - number: 38o.1
    text: De plaatsing geschiedt in een door onze Minister van Justitie aangewezen inrichting voor stelselmatige daders.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38o
  - number: 38o.2
    text: |-
      Bij of krachtens de wet worden regels gesteld ten aanzien van de tenuitvoerlegging van de maatregel in en buiten de
      inrichting en de rechtspositie van degene aan wie de maatregel is opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38o
  - number: 38o.3
    text: |-
      De kosten van de tenuitvoerlegging van de maatregel komen ten laste van de Staat. De kosten van de
      tenuitvoerlegging van de laatste fase van de maatregel komen overeenkomstig bij of krachtens algemene maatregel van
      bestuur te stellen regels ten laste van gemeenten die deelnemen aan de tenuitvoerlegging daarvan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38o
  - number: 38p.1
    text: De rechter kan bepalen dat de maatregel niet ten uitvoer zal worden gelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38p
  - number: 38p.2
    text: |-
      De rechter die bepaalt dat de door hem opgelegde maatregel niet ten uitvoer zal worden gelegd stelt daarbij een
      proeftijd vast van ten hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38p
  - number: 38p.3
    text: |-
      Bij de toepassing van het eerste lid geldt als algemene voorwaarde dat de veroordeelde zich voor het einde van de
      proeftijd niet schuldig maakt aan een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38p
  - number: 38p.4
    text: |-
      De rechter stelt ter bescherming van de veiligheid van personen of goederen voorwaarden betreffende het gedrag van
      de veroordeelde. De rechter kan een krachtens algemene maatregel van bestuur aangewezen reclasseringsinstelling
      opdracht geven de veroordeelde bij de naleving van de voorwaarden hulp en steun te verlenen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38p
  - number: 38p.5
    text: |-
      Een voorwaarde als bedoeld in het vierde lid kan inhouden dat de veroordeelde zich ambulant of intramuraal laat
      behandelen. Opname in een inrichting vindt in dit verband plaats voor een door de rechter te bepalen duur van ten
      hoogste twee jaren. Deze voorwaarde wordt slechts gesteld, indien de veroordeelde zich bereid heeft verklaard de
      behandeling te ondergaan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38p
  - number: 38p.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de eisen waaraan een
      inrichting en een behandeling als bedoeld in het vijfde lid moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38p
  - number: 38p.7
    text: |-
      De in het vierde lid gestelde voorwaarden mogen de vrijheid van de veroordeelde zijn godsdienst of
      levensovertuiging te belijden en de staatkundige vrijheid niet beperken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38p
  - number: 38p.8
    text: Het openbaar ministerie houdt toezicht op de naleving van de gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38p
  - number: 38q
    text: |-
      De rechter kan, op vordering van het openbaar ministerie, op verzoek van de veroordeelde of diens raadsman dan wel
      ambtshalve met inachtneming van de [artikelen 38m tot en met 38p][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38q
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38m
        afdeling: Derde
  - number: 38q.1°
    text: de voorwaarden aanvullen, wijzigen of opheffen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38q
  - number: 38q.2°
    text: |-
      aan een andere reclasseringsinstelling dan die welke daarmee tevoren was belast het verlenen van hulp en steun bij
      de naleving van de voorwaarden opdragen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38q
  - number: 38r
    text: |-
      De rechter kan, op vordering van het openbaar ministerie, indien een voorwaarde niet wordt nageleefd, bevelen dat
      de maatregel alsnog zal worden tenuitvoergelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38r
  - number: 38s.1
    text: |-
      De rechter kan, op vordering van het openbaar ministerie, op verzoek van de verdachte of diens raadsman dan wel
      ambtshalve, bij of na het opleggen van de maatregel beslissen tot een tussentijdse beoordeling van de noodzaak van
      de voortzetting van de tenuitvoerlegging van de maatregel. Het openbaar ministerie bericht hem daarover binnen een
      door hem te bepalen termijn. Bij het bericht is gevoegd een verklaring van de directeur van de inrichting omtrent
      de stand van de uitvoering van het verblijfsplan van de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38s
  - number: 38s.2
    text: |-
      Indien de rechter bij het opleggen van de maatregel niet beslist tot een tussentijdse beoordeling dan wel beslist
      tot een beoordeling na een jaar na aanvang van de tenuitvoerlegging van de maatregel, kan een verzoek als bedoeld
      in het eerste lid worden gedaan na zes maanden na aanvang van de tenuitvoerlegging van de maatregel. In de
      overige gevallen kan een verzoek worden gedaan na zes maanden na het onherroepelijk worden van de beslissing om
      niet tussentijds te beoordelen of van de beslissing dat voortzetting van de tenuitvoerlegging van de maatregel
      is vereist.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38s
  - number: 38s.3
    text: |-
      Indien de rechter naar aanleiding van de in het eerste lid bedoelde inlichtingen beslist dat de voortzetting van
      de tenuitvoerlegging van de maatregel niet langer is vereist, beëindigt hij deze met ingang van een door hem te
      bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38s
  - number: 38t
    text: 'De termijn van de maatregel loopt niet:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38t
  - number: 38t.a
    text: |-
      gedurende de tijd dat aan degene aan wie deze is opgelegd, uit anderen hoofde zijn vrijheid is ontnomen en
      gedurende de tijd dat hij ongeoorloofd afwezig is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38t
  - number: 38t.b
    text: zodra degene die in een inrichting geplaatst is, langer dan een dag ongeoorloofd afwezig is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38t
  - number: 38u
    text: Onze Minister van Justitie kan de maatregel te allen tijde beëindigen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel38u
  - number: '39'
    text: |-
      Niet strafbaar is hij die een feit begaat, dat hem wegens de gebrekkige ontwikkeling of ziekelijke stoornis van
      zijn geestvermogens niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel39
  - number: '40'
    text: Niet strafbaar is hij die een feit begaat waartoe hij door overmacht is gedrongen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel40
  - number: '41.1'
    text: |-
      Niet strafbaar is hij die een feit begaat, geboden door de noodzakelijke verdediging van eigen of eens anders lijf,
      eerbaarheid of goed tegen ogenblikkelijke, wederrechtelijke aanranding.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel41
  - number: '41.2'
    text: |-
      Niet strafbaar is de overschrijding van de grenzen van noodzakelijke verdediging, indien zij het onmiddellijk
      gevolg is geweest van een hevige gemoedsbeweging, door de aanranding veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel41
  - number: '42'
    text: Niet strafbaar is hij die een feit begaat ter uitvoering van een wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel42
  - number: '43.1'
    text: |-
      Niet strafbaar is hij die een feit begaat ter uitvoering van een ambtelijk bevel, gegeven door het daartoe bevoegde
      gezag.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel43
  - number: '43.2'
    text: |-
      Een onbevoegd gegeven ambtelijk bevel heft de strafbaarheid niet op, tenzij het door de ondergeschikte te goeder
      trouw als bevoegd gegeven werd beschouwd en de nakoming daarvan binnen de kring van zijn ondergeschiktheid was
      gelegen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel43
  - number: 43a
    text: |-
      De op een misdrijf gestelde tijdelijke gevangenisstraf of hechtenis kan, onverminderd [artikel 10][ref1], met
      een derde worden verhoogd indien tijdens het plegen van het misdrijf nog geen vijf jaren zijn verlopen sedert een
      veroordeling van de schuldige tot gevangenisstraf wegens een daaraan soortgelijk misdrijf in kracht van gewijsde
      is gegaan. De termijn van vijf jaren wordt verlengd met de tijd waarin de veroordeelde rechtens zijn vrijheid is
      ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel10
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '10'
  - number: 43b
