  - number: 4a.1
    text: |-
      De Nederlandse strafwet is toepasselijk op ieder tegen wie de strafvervolging door Nederland van een vreemde staat
      is overgenomen op grond van een verdrag waaruit de bevoegdheid tot strafvervolging voor Nederland volgt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel4a
  - number: 4a.2
    text: |-
      De Nederlandse strafwet is voorts toepasselijk op ieder wiens uitlevering of overlevering ter zake van
      een terroristisch misdrijf dan wel een der misdrijven omschreven in de [artikelen 225, derde lid][ref1],
      [311, eerste lid, onder 6°][ref2], [312, tweede lid, onder 5°][ref3], alsmede [317, derde lid][ref4], jo.
      [312, tweede lid, onder 5°][ref5], ontoelaatbaar is verklaard, is afgewezen of geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel311
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel312
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel317
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel312
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel4a
