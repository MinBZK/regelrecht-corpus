        artikel: '317'
      - id: ref9
        bwb_id: BWBR0001854
        artikel: '312'
  - number: 5a.2
    text: |-
      De vervolging kan ook plaatshebben, indien de verdachte eerst na het begaan van het feit een vaste woon- of
      verblijfplaats in Nederland heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel5a
  - number: '6'
    text: 'De Nederlandse strafwet is toepasselijk op:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel6
  - number: 6.1°
    text: |-
      de Nederlandse ambtenaar die zich buiten Nederland schuldig maakt aan een der misdrijven omschreven in Titel XXVIII
      van het Tweede Boek;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel6
  - number: 6.2°
    text: |-
      de persoon in de openbare dienst van een in Nederland gevestigde volkenrechtelijke organisatie die zich buiten
      Nederland schuldig maakt aan een der misdrijven omschreven in de [ artikelen 362 tot en met 364a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel362
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '362'
  - number: '7'
    text: |-
      De Nederlandse strafwet is toepasselijk op de schipper en de opvarenden van een Nederlands vaartuig die zich buiten
      Nederland, ook buiten boord, schuldig maken aan een der strafbare feiten omschreven in Titel XXIX van het Tweede
      Boek en Titel IX van het Derde Boek.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel7
  - number: '8'
    text: |-
      De toepasselijkheid van [de artikelen 2-7][ref1] wordt beperkt door de uitzonderingen in het volkenrecht erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel2
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '2'
  - number: '9.1'
    text: 'De straffen zijn:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9
  - number: 9.1.a
    text: 'hoofdstraffen:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9
  - number: 9.1.a.1°
    text: gevangenisstraf;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9
  - number: 9.1.a.2°
    text: hechtenis;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9
  - number: 9.1.a.3°
    text: taakstraf;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9
  - number: 9.1.a.4°
    text: geldboete;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9
  - number: 9.1.b
    text: 'bijkomende straffen:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9
  - number: 9.1.b.1°
    text: ontzetting van bepaalde rechten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9
  - number: 9.1.b.2°
    text: verbeurdverklaring;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9
  - number: 9.1.b.3°
    text: openbaarmaking van de rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9
  - number: '9.2'
    text: |-
      Ten aanzien van misdrijven die worden bedreigd met een vrijheidsstraf of een geldboete of ten aanzien van
      overtredingen die worden bedreigd met een vrijheidsstraf kan de rechter in de plaats daarvan een taakstraf
      opleggen. Een taakstraf bestaat uit een werkstraf, zijnde het verrichten van onbetaalde arbeid, of een leerstraf,
      zijnde het volgen van een leerproject, of een combinatie van beide.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9
  - number: '9.3'
    text: |-
      In geval van veroordeling tot gevangenisstraf, tot hechtenis, vervangende hechtenis daaronder niet begrepen, of tot
      taakstraf kan de rechter tevens een geldboete opleggen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9
  - number: '9.4'
    text: |-
      In geval van veroordeling tot gevangenisstraf of tot hechtenis, vervangende hechtenis daaronder niet begrepen,
      waarvan het onvoorwaardelijk ten uitvoer te leggen deel ten hoogste zes maanden bedraagt, kan de rechter tevens een
      taakstraf opleggen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9
  - number: '9.5'
    text: |-
      Een bijkomende straf kan, in de gevallen waarin de wet haar oplegging toelaat, zowel afzonderlijk als te zamen met
      hoofdstraffen en met andere bijkomende straffen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9
  - number: 9a
    text: |-
      Indien de rechter dit raadzaam acht in verband met de geringe ernst van het feit, de persoonlijkheid van de dader
      of de omstandigheden waaronder het feit is begaan, dan wel die zich nadien hebben voorgedaan, kan hij in het vonnis
      bepalen dat geen straf of maatregel zal worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel9a
  - number: '10.1'
    text: De gevangenisstraf is levenslang of tijdelijk.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel10
  - number: '10.2'
    text: De duur van de tijdelijke gevangenisstraf is ten minste een dag en ten hoogste vijftien achtereenvolgende jaren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel10
  - number: '10.3'
    text: |-
      Zij kan voor ten hoogste dertig achtereenvolgende jaren worden opgelegd in de gevallen waarin op het misdrijf
      levenslange en tijdelijke gevangenisstraf ter keuze van de rechter zijn gesteld, en in die waarin wegens
      strafverhoging ter zake van samenloop van misdrijven, terroristische misdrijven, herhaling van misdrijf of het
      bepaalde bij [artikel 44][ref1], de tijd van vijftien jaren wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel44
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '44'
  - number: '10.4'
    text: Zij kan in geen geval de tijd van dertig jaren te boven gaan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel10
  - number: '11'
    text: |-
      Bij of krachtens wet worden regels gesteld ten aanzien van de tenuitvoerlegging van vrijheidsstraffen en
      vrijheidsbenemende maatregelen. Deze regels betreffen in elk geval:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel11
  - number: 11.a
    text: de aanwijzing en de bestemming van inrichtingen bestemd voor deze tenuitvoerlegging;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel11
  - number: 11.b
    text: |-
      de selectie van de personen ten aanzien van wie de tenuitvoerlegging van de voornoemde straffen en maatregelen
      plaatsvindt voor de inrichtingen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel11
  - number: 11.c
    text: het beheer van de inrichtingen en het toezicht daarop;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel11
  - number: 11.d
    text: het regime in de inrichtingen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel11
  - number: 11.e
    text: |-
      gevallen waarin en de wijze waarop beperkingen op de grondrechten van de onder b omschreven personen plaats kan
      vinden;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel11
  - number: 11.f
    text: |-
      de rechtsgang voor de onder b omschreven personen aangaande hun rakende beslissingen het regime van de inrichting
      betreffende alsmede aangaande hun betreffende beslissingen tot plaatsing en overplaatsing.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel11
  - number: '13.1'
    text: |-
      Een veroordeelde tot gevangenisstraf die wegens de gebrekkige ontwikkeling of ziekelijke stoornis van zijn
      geestvermogens daarvoor in aanmerking komt, kan worden geplaatst in een justitiële inrichting voor verpleging
      van ter beschikking gestelden; de [artikelen 37c][ref1], [37d][ref2] en [37e][ref3] zijn in dat geval van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37c
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37d
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel37e
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37c
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 37d
        afdeling: Tweede
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 37e
        afdeling: Tweede
  - number: '13.2'
    text: |-
      Indien een veroordeelde tot gevangenisstraf tevens de maatregel van terbeschikkingstelling met bevel tot verpleging
      van overheidswege is opgelegd, wordt op regelmatige tijdstippen beoordeeld of de veroordeelde dient te worden
      geplaatst in een justitiële inrichting voor verpleging van ter beschikking gestelden. Bij of krachtens algemene
      maatregel van bestuur worden nadere regels gegeven omtrent deze beoordeling. Deze regels betreffen in elk geval
      de frequentie van de beoordelingen, de te volgen procedure, waaronder de advisering door gedragsdeskundigen, en de
      wijze waarop de beoordelingen dienen plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel13
  - number: '13.3'
    text: |-
      De plaatsing ingevolge het eerste lid en de beëindiging daarvan geschieden volgens regels, bij algemene maatregel
      van bestuur te stellen, op last van de Minister van Justitie, gegeven na een met redenen omkleed, gedagtekend en
      ondertekend advies van ten minste twee gedragsdeskundigen van verschillende disciplines - waaronder een psychiater
        - die de betrokkene hebben onderzocht. Zodanig advies dient door de gedragsdeskundigen gezamenlijk dan wel door
      ieder van hen afzonderlijk te zijn uitgebracht.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel13
  - number: '13.4'
    text: |-
      Tegen de beslissing tot plaatsing, de beslissing tot beëindiging daarvan en de beslissing
      tot niet plaatsing in afwijking van het advies van de rechter overeenkomstig het bepaalde in
      [artikel 37b, tweede lid][ref1], kan de veroordeelde binnen vier weken nadat die beslissing aan hem is
      medegedeeld beroep instellen bij de Raad voor strafrechtstoepassing en jeugdbescherming. Het bepaalde in
      [Hoofdstuk XVI van de Beginselenwet verpleging ter beschikking gestelden][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
      [ref2]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXVI
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37b
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0008765
        hoofdstuk: XVI
  - number: '13.5'
    text: |-
      De overplaatsing en het beroep daartegen van de veroordeelden geschieden overeenkomstig de regels die van
      toepassing zijn op de overplaatsing en het beroep daartegen van ter beschikking gestelden ten aanzien van wie een
      bevel tot verpleging van overheidswege als bedoeld in [artikel 37b][ref1] of [38c][ref2] is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37b
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 38c
        afdeling: Tweede
  - number: 14a.1
    text: |-
      In geval van veroordeling tot gevangenisstraf van ten hoogste twee jaren, tot hechtenis, vervangende hechtenis
      daaronder niet begrepen, tot taakstraf of tot geldboete, kan de rechter bepalen dat de straf of een gedeelte
      daarvan niet zal worden tenuitvoergelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14a
  - number: 14a.2
    text: |-
      Ingeval van veroordeling tot gevangenisstraf van meer dan twee jaren en ten hoogste vier jaren kan de rechter
      bepalen dat een gedeelte van de straf, tot ten hoogste twee jaren, niet zal worden tenuitvoergelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14a
  - number: 14a.3
    text: |-
      De rechter kan voorts bepalen dat opgelegde bijkomende straffen geheel of gedeeltelijk niet zullen worden
      tenuitvoergelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14a
  - number: 14b.1
    text: |-
      De rechter die bepaalt dat een door hem opgelegde straf geheel of gedeeltelijk niet zal worden tenuitvoergelegd,
      stelt daarbij een proeftijd vast.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14b
  - number: 14b.2
    text: |-
      De proeftijd bedraagt in de gevallen bedoeld in [artikel 14c, eerste lid en tweede lid, onder 3° en 4°][ref1],
      ten hoogste twee jaren en in de overige gevallen ten hoogste drie jaren. De proeftijd kan ten hoogste tien jaren
      bedragen indien er ernstig rekening mee moet worden gehouden dat de veroordeelde wederom een misdrijf zal begaan
      dat gericht is tegen of gevaar veroorzaakt voor de onaantastbaarheid van het lichaam van een of meer personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14c
  - number: 14b.3
    text: 'De proeftijd gaat in:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14b
  - number: 14b.3.a
    text: |-
      indien een kennisgeving als bedoeld in [artikel 366a, eerste en tweede lid, van het Wetboek van Strafvordering][ref1]
      is uitgereikt of toegezonden, op de vijftiende dag nadat de einduitspraak is gedaan, tenzij door de tijdige
      aanwending van een rechtsmiddel het vonnis of arrest niet onherroepelijk is geworden;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel366a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 366a
  - number: 14b.3.b
    text: |-
      indien een kennisgeving als bedoeld in [artikel 366a, derde lid, van het Wetboek van Strafvordering][ref1] moet
      worden betekend, op de vijftiende dag na die betekening, tenzij door de tijdige aanwending van een rechtsmiddel het
      vonnis of arrest niet onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel366a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 366a
  - number: 14b.4
    text: De proeftijd loopt niet gedurende de tijd dat de veroordeelde rechtens zijn vrijheid is ontnomen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14b
  - number: 14c.1
    text: |-
      Toepassing van [artikel 14][ref1] geschiedt onder de algemene voorwaarde dat de veroordeelde zich voor het einde
      van de proeftijd niet schuldig maakt aan een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14a
  - number: 14c.2
    text: |-
      Bij toepassing van [artikel 14][ref1] kunnen voorts de volgende bijzondere voorwaarden worden gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14a
  - number: 14c.2.1°
    text: |-
      gehele of gedeeltelijke vergoeding van de door het strafbare feit veroorzaakte schade binnen een door de rechter te
      bepalen termijn, korter dan de proeftijd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14c
  - number: 14c.2.2°
    text: |-
      opneming van de veroordeelde in een inrichting ter verpleging gedurende een door de rechter te bepalen termijn, ten
      hoogste gelijk aan de proeftijd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14c
  - number: 14c.2.3°
    text: |-
      storting van een door de rechter vast te stellen waarborgsom, ten hoogste gelijk aan het verschil tussen het
      maximum van de geldboete die voor het feit kan worden opgelegd en de opgelegde boete;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14c
  - number: 14c.2.4°
    text: |-
      storting van een door de rechter vast te stellen som gelds in het schadefonds geweldsmisdrijven of ten gunste van
      een instelling die zich ten doel stelt belangen van slachtoffers van strafbare feiten te behartigen. Het bedrag kan
      niet hoger zijn dan de geldboete die ten hoogste voor het strafbare feit kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14c
  - number: 14c.2.5°
    text: |-
      andere bijzondere voorwaarden, het gedrag van de veroordeelde betreffende, waaraan deze gedurende de proeftijd, of
      een bij de veroordeling te bepalen gedeelte daarvan, heeft te voldoen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14c
  - number: 14c.3
    text: |-
      De bijzondere voorwaarden mogen de vrijheid van de veroordeelde zijn godsdienst of levensovertuiging te belijden en
      de staatkundige vrijheid niet beperken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14c
  - number: 14c.4
    text: |-
      Bij het stellen van één van de bijzondere voorwaarden genoemd in het tweede lid, onder 3° en 4°, vinden de
      [artikelen 23, eerste en tweede lid][ref1], en [24][ref2] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel24
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '24'
  - number: 14d.1
    text: Met het toezicht op de naleving van de voorwaarden is het openbaar ministerie belast.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14d
  - number: 14d.2
    text: |-
      De rechter kan aan een krachtens algemene maatregel van bestuur aangewezen reclasseringsinstelling dan wel aan een
      bijzondere reclasseringsambtenaar opdracht geven de veroordeelde bij de naleving van de voorwaarden hulp en steun
      te verlenen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14d
  - number: 14f.1
    text: |-
      De rechter die de voorwaarde heeft gesteld kan hetzij na de ontvangst van een vordering van het openbaar
      ministerie, hetzij op verzoek van de veroordeelde de proeftijd verkorten of deze éénmaal verlengen. De verlenging
      geschiedt met ten hoogste één jaar.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14f
  - number: 14f.2
    text: |-
      Evenzo kan de in het eerste lid bedoelde rechter gedurende de proeftijd of gedurende de tijd dat deze is geschorst
      in de gestelde bijzondere voorwaarden of in de termijn waartoe deze voorwaarden in haar werking binnen de proeftijd
      zijn beperkt wijziging brengen, deze voorwaarden opheffen, alsnog bijzondere voorwaarden stellen en een opdracht
      als bedoeld in [artikel 14][ref1] geven, wijzigen of opheffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14d
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14f
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14d
  - number: 14g.1
    text: |-
      Indien enige gestelde voorwaarde niet wordt nageleefd kan de rechter, indien hij daartoe termen vindt, na ontvangst
      van een vordering van het openbaar ministerie en onverminderd het bepaalde in [artikel 14][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14f
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14g
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14f
  - number: 14g.1.1°
    text: gelasten dat de niet ten uitvoergelegde straf alsnog zal worden tenuitvoergelegd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14g
  - number: 14g.1.2°
    text: |-
      al of niet onder instandhouding of wijziging van de voorwaarden gelasten dat een gedeelte van de niet
      tenuitvoergelegde straf alsnog zal worden tenuitvoergelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14g
  - number: 14g.2
    text: |-
      In plaats van een last tot tenuitvoerlegging van een vrijheidsstraf te geven kan de rechter een taakstraf als
      bedoeld in [artikel 9, eerste lid, onderdeel a, onder 3°][ref1], gelasten. De artikelen [22c tot en met 22k][ref2]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel22c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14g
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 22c
  - number: 14g.3
    text: |-
      Tot behandeling van de vordering is bevoegd de rechter die de straf heeft opgelegd. Indien de veroordeelde wordt
      vervolgd wegens een strafbaar feit, begaan voor het einde van de proeftijd, is tot behandeling van de vordering
      bevoegd:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14g
  - number: 14g.3.a
    text: de rechtbank, indien deze bevoegd is tot kennisneming in eerste aanleg van het feit,
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14g
  - number: 14g.3.b
    text: |-
      de kantonrechter, indien deze bevoegd is tot kennisneming van dat feit en van feiten, terzake waarvan de
      veroordeling, waarop de vordering betrekking heeft, is uitgesproken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14g
  - number: 14g.4
    text: |-
      Wanneer overeenkomstig [artikel 14][ref1], een waarborgsom is gestort kan de rechter voorts een beslissing nemen,
      krachtens welke die som geheel of ten dele aan de Staat vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14g
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14c
  - number: 14g.5
    text: |-
      De in het eerste en tweede lid bedoelde vordering wordt gedagtekend op de dag van ontvangst ter griffie. Het
      openbaar ministerie is in zijn vordering niet ontvankelijk wanneer zij later wordt ingediend dan drie maanden na
      het verstrijken der proeftijd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14g
  - number: 14h.1
    text: |-
      In de gevallen in de [artikelen 14f][ref1] en [14g][ref2] bedoeld brengt het openbaar ministerie de zaak aan
      door de indiening van een met redenen omklede vordering. Is door de veroordeelde een verzoek tot toepassing
      van [artikel 14f][ref3] tot de rechter gericht, dan dient het openbaar ministerie ten spoedigste nadat het
      verzoekschrift in zijn handen is gesteld een met redenen omklede conclusie in.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14f
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel14g
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel14f
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14h
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14f
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 14g
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 14f
  - number: 14h.2
    text: |-
      Onmiddellijk na de indiening van de vordering of de conclusie bepaalt de rechter, tenzij de summiere kennisneming
      van de stukken hem aanleiding geeft om de vordering of het verzoek buiten behandeling te laten, een dag voor
      het onderzoek van de zaak. In het geval, bedoeld in [artikel 14g, derde lid, tweede volzin][ref1], geschiedt de
      behandeling van de vordering gelijktijdig met de behandeling van het feit waarvoor de veroordeelde wordt vervolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14g
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14h
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14g
  - number: 14h.3
    text: |-
      Het openbaar ministerie doet de veroordeelde en degene die met het verlenen van hulp en steun was belast tot
      bijwoning van het onderzoek oproepen, onder betekening van de vordering of de conclusie aan de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14h
  - number: 14h.4
    text: |-
      Zowel het openbaar ministerie als de veroordeelde is bevoegd getuigen en deskundigen te doen dagvaarden
      of schriftelijk te doen oproepen om bij het onderzoek tegenwoordig te zijn. De [artikelen 260][ref1] en
      [263 van het Wetboek van Strafvordering][ref2] vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel260
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel263
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14h
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '260'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '263'
  - number: 14h.5
    text: |-
      De veroordeelde en degene die met het verlenen van hulp en steun is belast kunnen vóór de aanvang van het onderzoek
      van de stukken kennis nemen. Hetzelfde geldt ten aanzien van de raadsman van de veroordeelde of, indien de zaak
      bij de kantonrechter wordt behandeld, ten aanzien van een bijzonder daartoe door de veroordeelde gemachtigde. Het
      bepaalde bij en krachtens [artikel 34 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel34
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14h
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '34'
  - number: 14i.1
    text: Het onderzoek vindt plaats ter openbare terechtzitting.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14i
  - number: 14i.2
    text: Het openbaar ministerie is bij het onderzoek tegenwoordig en wordt terzake gehoord.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14i
  - number: 14i.3
    text: |-
      De veroordeelde en degene die met het verlenen van hulp en steun is belast kunnen bij het onderzoek tegenwoordig
      zijn en worden alsdan gehoord. De veroordeelde kan zich door een raadsman of, indien de zaak bij de kantonrechter
      wordt behandeld, door een bijzonder daartoe door de veroordeelde gemachtigde, doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14i
  - number: 14i.4
    text: |-
      In gevallen waarin de behandeling van de zaak niet gelijktijdig geschiedt met de behandeling van een feit
      waarvoor de veroordeelde wordt vervolgd, vinden de [artikelen 260, eerste lid][ref1], [268, tweede lid][ref2],
      [269 tot en met 277][ref3], [278, tweede lid][ref4], [281][ref5], [284, eerste lid][ref6],
      [286][ref7], [287, tweede en derde lid][ref8], [288][ref9], [289, eerste, tweede en derde lid][ref10],
      [290 tot en met 297][ref11], [299][ref12], [300][ref13], [301][ref14], [309][ref15], [310][ref16],
      [311][ref17], [315][ref18], [316][ref19], [318][ref20], [319][ref21], [320, eerste en tweede lid][ref22],
      [322][ref23], [324][ref24], [326 tot en met 329][ref25], [331][ref26], [345, eerste en derde lid][ref27], en
      [346 van het Wetboek van Strafvordering][ref28] overeenkomstige toepassing.


