  - number: 83a
    text: |-
      Onder terroristisch oogmerk wordt verstaan het oogmerk om de bevolking of een deel der bevolking van een land
      ernstige vrees aan te jagen, dan wel een overheid of internationale organisatie wederrechtelijk te dwingen iets
      te doen, niet te doen of te dulden, dan wel de fundamentele politieke, constitutionele, economische of sociale
      structuren van een land of een internationale organisatie ernstig te ontwrichten of te vernietigen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel83a
  - number: '84.1'
    text: Onder ambtenaren worden begrepen leden van algemeen vertegenwoordigende organen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel84
  - number: '84.2'
    text: |-
      Onder ambtenaren en onder rechters worden begrepen scheidsrechters; onder rechters zij die administratieve
      rechtsmacht oefenen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel84
  - number: '84.3'
    text: Allen die tot de gewapende macht behoren worden mede als ambtenaar beschouwd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel84
  - number: 84bis
    text: Onder koopman wordt verstaan ieder die een bedrijf uitoefent.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel84bis
  - number: 84ter
    text: |-
      Onder muntspeciën, munt- en bankbiljetten worden begrepen muntspeciën, munt- en bankbiljetten die de hoedanigheid
      van wettig betaalmiddel nog zullen verkrijgen, alsmede muntspeciën, munt- en bankbiljetten die deze hoedanigheid
      verloren hebben en ingewisseld kunnen worden tegen wettige betaalmiddelen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel84ter
  - number: '85.1'
    text: Onder schipper wordt verstaan elke gezagvoerder van een vaartuig of die deze vervangt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel85
  - number: '85.2'
    text: Opvarenden zijn allen die zich aan boord bevinden, met uitzondering van de schipper.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel85
  - number: '85.3'
    text: Schepelingen zijn allen die zich als scheepsofficieren of scheepsgezellen aan boord bevinden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel85
  - number: '85.4'
    text: Vaartuigen in aanbouw noch schepen in aanbouw worden als vaartuigen of schepen aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel85
  - number: '86'
    text: |-
      Onder Nederlandse schepen worden alleen verstaan die vaartuigen welke door de wet betrekkelijk de afgifte van
      zeebrieven en vergunningen tot het voeren van de Nederlandse vlag als zeeschepen worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel86
  - number: 86a.1
    text: 'Onder Nederlandse luchtvaartuigen worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel86a
  - number: 86a.1.a
    text: luchtvaartuigen die zijn ingeschreven in Nederlandse luchtvaartuigregisters;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel86a
  - number: 86a.1.b
    text: |-
      luchtvaartuigen die zonder bemanning zijn verhuurd aan een huurder die de hoofdzetel van zijn bedrijf, of, indien
      de huurder niet een zodanige zetel heeft, zijn vaste verblijfplaats, in Nederland heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel86a
  - number: 86a.2
    text: |-
      Een luchtvaartuig is in vlucht van het moment af waarop alle buitendeuren, na het instappen, zijn gesloten tot het
      moment waarop een van de deuren wordt geopend voor het uitstappen. In geval van een noodlanding wordt de vlucht
      geacht voort te duren, totdat de bevoegde autoriteiten de verantwoordelijkheid voor het luchtvaartuig en voor de
      personen en goederen aan boord overnemen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel86a
  - number: 86a.3
    text: |-
      Een luchtvaartuig is in bedrijf van het begin van het gereedmaken van dat luchtvaartuig voor een bepaalde
      vlucht door het grondpersoneel of door de bemanning tot het moment dat sedert de landing vierentwintig uren zijn
      verstreken. De periode tijdens welke het luchtvaartuig in bedrijf is strekt zich in elk geval uit tot de gehele
      periode tijdens welke het luchtvaartuig in vlucht is, zoals omschreven in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel86a
  - number: '87.1'
    text: Onder vijand worden begrepen opstandelingen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel87
  - number: '87.2'
    text: Onder oorlog wordt begrepen burgeroorlog.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel87
  - number: '87.3'
    text: |-
      Onder tijd van oorlog wordt begrepen de tijd waarin oorlog dreigende is. Tijd van oorlog wordt mede geacht te
      bestaan zodra dienstplichtigen buitengewoon in werkelijke dienst worden opgeroepen en zolang zij buitengewoon in
      werkelijke dienst worden gehouden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel87
  - number: 87a
    text: |-
      Onder een bevriende staat wordt verstaan een buitenlandse mogendheid waarmede Nederland niet in een gewapend
      conflict is gewikkeld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel87a
  - number: 87b.1
    text: |-
      Onder internationaal beschermd persoon wordt verstaan een persoon vallende onder de omschrijving van artikel 1,
      eerste lid, van het Verdrag inzake de voorkoming en bestraffing van misdrijven tegen internationaal beschermde
      personen, met inbegrip van diplomaten van 14 december 1973 (*Trb.* 1981, 69).
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel87b
  - number: 87b.2
    text: |-
      Onder internationaal beschermd persoon wordt mede verstaan een persoon vallende onder de omschrijving van artikel
      1, onderdeel a of b, van het Verdrag inzake de veiligheid van VN-personeel en geassocieerd personeel van 9 december
      1994 (Trb. 1996, 62).
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel87b
  - number: 87b.3
    text: |-
      Onder beschermde goederen worden verstaan de goederen bedoeld in artikel 2, eerste lid, onder *b*, van het in het
      eerste lid genoemde verdrag en artikel 9, eerste lid, onderdeel b, van het in het tweede lid genoemde verdrag.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel87b
  - number: '88'
    text: |-
      Onder maand wordt verstaan een tijd van dertig dagen, onder dag, behoudens voor de toepassing van de
      [Algemene termijnenwet][ref1], een tijd van vierentwintig uren.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '89'
    text: |-
      Onder inklimming wordt begrepen ondergraving, alsmede het overschrijden van sloten of grachten tot afsluiting
      dienende.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel89
  - number: '90'
    text: Onder valse sleutels worden begrepen alle tot opening van het slot niet bestemde werktuigen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel90
  - number: 90bis.1
    text: Onder opkoper wordt verstaan hij die van opkopen een beroep of een gewoonte maakt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel90bis
  - number: 90bis.2
    text: Onder opkopen worden begrepen alle handelingen, hoe ook genaamd, waarmede kennelijk hetzelfde wordt beoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel90bis
  - number: 90ter.1
    text: |-
      Onder electriciteitswerken worden verstaan werken dienende tot voortbrenging, geleiding, transformatie of
      levering van electriciteit en daarmede in verband staande beveiligings-, bevestigings-, ondersteunings- en
      waarschuwingswerken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel90ter
  - number: 90ter.2
    text: Onder electriciteitswerken worden niet begrepen telegraaf- en telefoonwerken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel90ter
  - number: 90quater
    text: |-
      Onder discriminatie of discrimineren wordt verstaan elke vorm van onderscheid, elke uitsluiting, beperking of
      voorkeur, die ten doel heeft of ten gevolge kan hebben dat de erkenning, het genot of de uitoefening op voet van
      gelijkheid van de rechten van de mens en de fundamentele vrijheden op politiek, economisch, sociaal of cultureel
      terrein of op andere terreinen van het maatschappelijk leven, wordt teniet gedaan of aangetast.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel90quater
  - number: 90quinquies.1
    text: |-
      Onder inrichting voor verpleging van ter beschikking gestelden wordt verstaan een inrichting als bedoeld in
      [artikel 37d, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37d
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel90quinquies
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37d
        afdeling: Tweede
  - number: 90quinquies.2
    text: |-
      Onder justitiële inrichting voor verpleging van ter beschikking gestelden wordt verstaan een inrichting als bedoeld
      in [artikel 37d, eerste lid, onder a][ref1] waarvan de verpleegkosten vanwege de Minister van Justitie worden
      vergoed op grond van een door hem goedgekeurde inrichtingsbegroting, dan wel een inrichting als bedoeld in artikel
      37d, eerste lid, onder b waarvan de algehele exploitatiekosten ten laste van het Ministerie van Justitie komen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37d
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel90quinquies
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37d
        afdeling: Tweede
  - number: 90sexies
    text: 'Onder psychiatrisch ziekenhuis wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel90sexies
  - number: 90sexies.1°
    text: |-
      een krachtens artikel 5 van de Wet toelating zorginstellingen als ziekenhuis, verpleeginrichting of
      zwakzinnigeninrichting toegelaten instelling, voor zover die instelling blijkens de toelating gericht is op de
      behandeling van psychiatrische patiënten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel90sexies
  - number: 90sexies.2°
    text: een psychiatrische afdeling van een academisch ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel90sexies
  - number: 90septies
    text: Onder psychiater wordt verstaan een arts die bevoegd is de titel van psychiater of zenuwarts te voeren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel90septies
  - number: 90octies
    text: |-
      Waar van huwelijk of echtgenoot wordt gesproken wordt, met uitzondering van [artikel 449][ref1], daaronder mede
      begrepen geregistreerd partnerschap dan wel geregistreerde partner.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel449
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel90octies
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '449'
  - number: '91'
    text: |-
      De bepalingen van de Titels I-VIII A van dit Boek zijn ook toepasselijk op feiten waarop bij andere wetten of
      verordeningen straf is gesteld, tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel91
  - number: '92'
    text: |-
      De aanslag ondernomen met het oogmerk om de Koning, de regerende Koningin of de Regent van het leven of de vrijheid
      te beroven of tot regeren ongeschikt te maken, wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten
      hoogste dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel92
  - number: '93'
    text: |-
      De aanslag ondernomen met het oogmerk om het Rijk geheel of gedeeltelijk onder vreemde heerschappij te brengen of
      om een deel daarvan af te scheiden, wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste
      dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel93
  - number: '94'
    text: |-
      De aanslag ondernomen met het oogmerk om de grondwettige regeringsvorm of de orde van troonopvolging te vernietigen
      of op onwettige wijze te veranderen, wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste
      dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel94
  - number: '95'
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van de regeringsraad uiteenjaagt, tot het nemen of
      niet nemen van enig besluit dwingt, een lid uit die vergadering verwijdert of opzettelijk een lid verhindert die
      vergadering bij te wonen of daarin vrij en onbelemmerd zijn plicht te vervullen, wordt gestraft met levenslange
      gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel95
  - number: 95a
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van de raad van ministers uiteenjaagt, tot het nemen
      of niet nemen van enig besluit dwingt, een lid uit die vergadering verwijdert of opzettelijk een lid verhindert
      die vergadering bij te wonen of daarin vrij en onbelemmerd zijn plicht te vervullen, wordt gestraft met levenslange
      gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel95a
  - number: '96.1'
    text: |-
      De samenspanning tot een der in de [artikelen 92-95a][ref1] omschreven misdrijven wordt gestraft met
      gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel92
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '92'
  - number: '96.2'
    text: |-
      Dezelfde straf is toepasselijk op hem die, met het oogmerk om een der in de [artikelen 92-95a][ref1] omschreven
      misdrijven voor te bereiden of te bevorderen:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel92
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '92'
  - number: 96.2.1°
    text: |-
      een ander tracht te bewegen om het misdrijf te plegen, te doen plegen of mede te plegen, om daarbij behulpzaam te
      zijn of om daartoe gelegenheid, middelen of inlichtingen te verschaffen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel96
  - number: 96.2.2°
    text: gelegenheid, middelen of inlichtingen tot het plegen van het misdrijf zich of anderen tracht te verschaffen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel96
  - number: 96.2.3°
    text: voorwerpen voorhanden heeft waarvan hij weet dat zij bestemd zijn tot het plegen van het misdrijf;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel96
  - number: 96.2.4°
    text: |-
      plannen voor de uitvoering van het misdrijf, welke bestemd zijn om aan anderen te worden medegedeeld, in gereedheid
      brengt of onder zich heeft;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel96
  - number: 96.2.5°
    text: |-
      enige maatregel van regeringswege genomen om de uitvoering van het misdrijf te voorkomen of te onderdrukken, tracht
      te beletten, te belemmeren of te verijdelen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel96
  - number: '97.1'
    text: |-
      Hij die met een buitenlandse mogendheid in verbinding treedt, met het oogmerk om haar tot het plegen van
      vijandelijkheden of het voeren van oorlog tegen de staat te bewegen, haar in het daartoe opgevatte voornemen
      te versterken, haar daarbij hulp toe te zeggen of bij de voorbereiding hulp te verlenen, wordt gestraft met
      levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel97
  - number: '97.2'
    text: |-
      Handelingen gepleegd ter voorbereiding van een misdrijf als omschreven in het voorgaande lid, worden gestraft met
      gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel97
  - number: 97a
    text: |-
      Hij die met een in het buitenland gevestigd persoon of lichaam in verbinding treedt met het oogmerk om een zodanig
      persoon of lichaam tot het verschaffen van steun aan het voorbereiden, bevorderen of teweegbrengen van omwenteling
      te bewegen, om een zodanig persoon of lichaam in het daartoe opgevatte voornemen te versterken of aan een zodanig
      persoon of lichaam daarbij hulp toe te zeggen of te verlenen, of om omwenteling voor te bereiden, te bevorderen
      of teweeg te brengen, wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel97a
  - number: 97b
    text: 'Met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel97b
  - number: 97b.1°
    text: |-
      hij die enig voorwerp invoert dat geschikt is tot het verschaffen van stoffelijke steun aan het voorbereiden,
      bevorderen of teweegbrengen van omwenteling, indien hij weet of ernstige reden heeft om te vermoeden dat het
      daartoe bestemd is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel97b
  - number: 97b.2°
    text: |-
      hij die enig voorwerp onder zich heeft of tot onderwerp van een overeenkomst maakt dat geschikt is tot het
      verschaffen van stoffelijke steun aan het voorbereiden, bevorderen of teweegbrengen van omwenteling, indien hij
      weet of ernstige reden heeft om te vermoeden, dat het daartoe bestemd is en dat het voorwerp of enig ander voorwerp
      waarvoor het in de plaats is getreden, hetzij met die bestemming is ingevoerd, hetzij door of vanwege een in het
      buitenland gevestigd persoon of lichaam daartoe is bestemd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel97b
  - number: '98.1'
    text: |-
      Hij die een inlichting waarvan de geheimhouding door het belang van de staat of van zijn bondgenoten wordt geboden,
      een voorwerp waaraan een zodanige inlichting kan worden ontleend, of zodanige gegevens opzettelijk verstrekt aan
      of ter beschikking stelt van een tot kennisneming daarvan niet gerechtigd persoon of lichaam, wordt, indien hij
      weet of redelijkerwijs moet vermoeden dat het een zodanige inlichting, een zodanig voorwerp of zodanige gegevens
      betreft, gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel98
  - number: '98.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die een inlichting die van een verboden plaats afkomstig is en tot de
      veiligheid van de staat of van zijn bondgenoten in betrekking staat, een voorwerp waaraan een zodanige inlichting
      kan worden ontleend, of zodanige gegevens opzettelijk verstrekt aan of ter beschikking stelt van een tot
      kennisneming daarvan niet gerechtigd persoon of lichaam, indien hij weet of redelijkerwijs moet vermoeden dat het
      een zodanige inlichting, een zodanig voorwerp of zodanige gegevens betreft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel98
  - number: 98a.1
    text: |-
      Hij die een inlichting, een voorwerp of gegevens als bedoeld in [artikel 98][ref1], hetzij opzettelijk openbaar
      maakt, hetzij zonder daartoe gerechtigd te zijn opzettelijk verstrekt aan of ter beschikking stelt van een
      buitenlandse mogendheid, een in het buitenland gevestigd persoon of lichaam, dan wel een zodanig persoon of lichaam
      dat gevaar ontstaat dat de inlichting of de gegevens aan een buitenlandse mogendheid of aan een in het buitenland
      gevestigd persoon of lichaam bekend wordt, wordt, indien hij weet of redelijkerwijs moet vermoeden dat het een
      zodanige inlichting of zodanige gegevens betreft, gestraft met gevangenisstraf van ten hoogste vijftien jaren of
      geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel98
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel98a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '98'
  - number: 98a.2
    text: |-
      Indien de schuldige heeft gehandeld in tijd van oorlog dan wel in dienst of in opdracht van een buitenlandse
      mogendheid of van een in het buitenland gevestigd persoon of lichaam, kan levenslange gevangenisstraf of tijdelijke
      van ten hoogste dertig jaren of geldboete van de vijfde categorie worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel98a
  - number: 98a.3
    text: |-
      Handelingen gepleegd ter voorbereiding van een misdrijf als omschreven in de voorgaande leden worden gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel98a
  - number: 98b
    text: |-
      Hij aan wiens schuld te wijten is dat een inlichting, een voorwerp of gegevens als bedoeld in [artikel 98][ref1],
      openbaar worden gemaakt of ter beschikking komt van een tot kennisneming daarvan niet gerechtigd persoon of
      lichaam, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel98
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '98'
  - number: 98c.1
    text: 'Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel98c
  - number: 98c.1.1°
    text: |-
      hij die opzettelijk een inlichting, een voorwerp of gegevens als bedoeld in [artikel 98][ref1], zonder daartoe
      gerechtigd te zijn, onder zich neemt of houdt;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel98
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel98c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '98'
  - number: 98c.1.2°
    text: |-
      hij die enige handeling verricht, ondernomen met het oogmerk om, zonder daartoe gerechtigd te zijn, de beschikking
      te krijgen over een inlichting, een voorwerp of gegevens als bedoeld in [artikel 98][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel98
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel98c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '98'
  - number: 98c.1.3°
    text: |-
      hij die tersluik, onder een vals voorgeven, door middel van een vermomming of langs een andere dan de gewone
      toegang op of in een verboden plaats komt of tracht te komen, aldaar in dier voege aanwezig is, of zich op een van
      die wijzen of door een van die middelen vandaar verwijdert of tracht te verwijderen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel98c
  - number: 98c.2
    text: |-
      De bepaling onder 3° is niet toepasselijk, indien de rechter blijkt dat de dader niet heeft gehandeld met het
      oogmerk bedoeld onder 2°.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel98c
  - number: '99'
    text: |-
      Hij die een hem van regeringswege opgedragen onderhandeling met een buitenlandse mogendheid opzettelijk ten nadele
      van de staat voert, wordt gestraft met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel99
  - number: '100'
    text: 'Met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel100
  - number: 100.1°
    text: |-
      hij die, in geval van een oorlog waarin Nederland niet betrokken is, opzettelijk enige handeling verricht waardoor
      het gevaar ontstaat dat de staat in een oorlog wordt betrokken, of enig van regeringswege gegeven en bekendgemaakt
      bijzonder voorschrift tot handhaving van het niet deelnemen aan de oorlog opzettelijk overtreedt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel100
  - number: 100.2°
    text: |-
      hij die, in tijd van oorlog, enig voorschrift van regeringswege in het belang van de veiligheid van de staat
      gegeven en bekendgemaakt, opzettelijk overtreedt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel100
  - number: '101'
    text: |-
      De Nederlander die in het vooruitzicht van een oorlog met een buitenlandse mogendheid vrijwillig bij deze
      mogendheid in krijgsdienst treedt, wordt, indien de oorlog uitbreekt, gestraft met gevangenisstraf van ten hoogste
      vijftien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel101
  - number: '102'
    text: |-
      Met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie
      wordt gestraft hij die opzettelijk, in tijd van oorlog, de vijand hulp verleent of de staat tegenover de vijand
      benadeelt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel102
  - number: '103'
    text: |-
      De samenspanning tot het in [artikel 102][ref1] omschreven misdrijf wordt gestraft met gevangenisstraf van ten
      hoogste tien jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel102
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '102'
  - number: 103a
    text: |-
      Niet strafbaar is hij die een der in de [artikelen 102][ref1] en [103][ref2] omschreven misdrijven heeft begaan in
      de redelijke overtuiging het Nederlandse belang niet te schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel103
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel103a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '102'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '103'
  - number: '104'
    text: |-
      Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie wordt gestraft hij die, in tijd
      van oorlog, zonder oogmerk om de vijand hulp te verlenen of de staat tegenover de vijand te benadelen, opzettelijk:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel104
  - number: 104.1°
    text: een verspieder van de vijand opneemt, verbergt of voorthelpt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel104
  - number: 104.2°
    text: desertie van een krijgsman, in dienst van het Rijk, teweegbrengt of bevordert.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel104
  - number: '105.1'
    text: |-
      Hij die, in tijd van oorlog, enige bedrieglijke handeling pleegt bij levering van benodigdheden ten dienste van de
      krijgsmacht, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel105
  - number: '105.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die, met het opzicht over de levering van de goederen belast, de bedrieglijke
      handeling opzettelijk toelaat.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel105
  - number: '106.1'
    text: |-
      Bij veroordeling wegens het in [artikel 92][ref1] omschreven misdrijf, kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°-4°][ref2], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '92'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '106.2'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 93-103][ref1] omschreven misdrijven, kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°-3°][ref2], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '93'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '106.3'
    text: |-
      Bij veroordeling wegens het in [artikel 105][ref1] omschreven misdrijf, kan de schuldige worden
      ontzet van de uitoefening van het beroep waarin hij het misdrijf begaan heeft en van de in
      [artikel 28, eerste lid, onder 1°-4°][ref2], vermelde rechten, en kan openbaarmaking van de rechterlijke
      uitspraak worden gelast.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '105'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '107'
    text: |-
      De straffen gesteld op de in de [artikelen 102-105][ref1] omschreven feiten, zijn toepasselijk indien een van die
      feiten wordt gepleegd tegen of met betrekking tot de bondgenoten van de staat in een gemeenschappelijke oorlog.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel102
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '102'
  - number: 107a
    text: |-
      De [artikelen 100, onder 2°][ref1], en [101-107][ref2] vinden overeenkomstige toepassing in geval van een gewapend
      conflict dat niet als oorlog kan worden aangemerkt en waarbij Nederland is betrokken, hetzij ter individuele of
      collectieve zelfverdediging, hetzij tot herstel van internationale vrede en veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel101
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '100'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '101'
  - number: '108.1'
    text: |-
      De aanslag op het leven of de vrijheid van de echtgenoot van de Koning, van de vermoedelijke opvolger van de
      Koning, of van diens echtgenoot, wordt gestraft met gevangenisstraf van ten hoogste vijftien jaren of geldboete van
      de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel108
  - number: '108.2'
    text: |-
      Indien de aanslag op het leven de dood ten gevolge heeft of met voorbedachten rade wordt ondernomen, wordt
      levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren opgelegd of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel108
  - number: '109'
    text: |-
      Elke feitelijke aanranding van de persoon van de Koning die niet valt in een zwaardere strafbepaling wordt gestraft
      met gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel109
  - number: '110'
    text: |-
      Elke feitelijke aanranding van de persoon van de echtgenoot van de Koning, van de vermoedelijke opvolger van de
      Koning, van diens echtgenoot, of van de Regent die niet valt in een zwaardere strafbepaling wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel110
  - number: '111'
    text: |-
      Opzettelijke belediging van de Koning wordt gestraft met gevangenisstraf van ten hoogste vijf jaren of geldboete
      van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel111
  - number: '112'
    text: |-
      Opzettelijke belediging van de echtgenoot van de Koning, van de vermoedelijke opvolger van de Koning, van diens
      echtgenoot, of van de Regent, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel112
  - number: '113.1'
    text: |-
      Hij die een geschrift of afbeelding waarin een belediging voorkomt voor de Koning, de echtgenoot van de Koning, de
      vermoedelijke opvolger van de Koning, diens echtgenoot of de Regent, verspreidt, openlijk tentoonstelt of aanslaat
      of, om verspreid, openlijk tentoongesteld of aangeslagen te worden in voorraad heeft, wordt, indien hij weet of
      ernstige reden heeft om te vermoeden dat in het geschrift of de afbeelding zodanige belediging voorkomt, gestraft
      met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel113
  - number: '113.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die, met gelijke wetenschap of een gelijke reden tot vermoeden, de inhoud van
      een zodanig geschrift openlijk ten gehore brengt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel113
  - number: '113.3'
    text: |-
      Indien de schuldige een van de misdrijven omschreven in dit artikel in zijn beroep begaat en er, tijdens het plegen
      van het misdrijf, nog geen twee jaren zijn verlopen sedert een vroegere veroordeling van de schuldige wegens een
      van deze misdrijven onherroepelijk is geworden, kan hij van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel113
  - number: '114.1'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 108][ref1], [109][ref2] en [110][ref3] omschreven misdrijven kan
      ontzetting van de in [artikel 28, eerste lid, onder 1°-4°][ref4], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel109
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel110
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '108'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '109'
