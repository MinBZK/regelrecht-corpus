        bwb_id: BWBR0001854
        artikel: '110'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '114.2'
    text: |-
      Bij veroordeling wegens een der in [de artikelen 111][ref1] en [112][ref2] omschreven misdrijven, kan ontzetting
      van de in [artikel 28, eerste lid, onder 1°-3°][ref3], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel112
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '111'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '112'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 114a
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 108, eerste lid][ref1], [109][ref2] of [110][ref3], is begaan
      met een terroristisch oogmerk, wordt de in dat artikel bepaalde tijdelijke gevangenisstraf met de helft verhoogd en
      wordt, indien op het misdrijf een tijdelijke gevangenisstraf van ten hoogste vijftien jaren is gesteld, levenslange
      gevangenisstraf of tijdelijke van ten hoogste dertig jaren opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel109
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel110
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel114a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '108'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '109'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '110'
  - number: 114b.1
    text: |-
      De samenspanning tot de in [artikel 108][ref1] omschreven misdrijven, te begaan met een terroristisch oogmerk,
      wordt gestraft met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel108
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel114b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '108'
  - number: 114b.2
    text: |-
      [Artikel 96, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel96
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel114b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '96'
  - number: '115.1'
    text: |-
      De aanslag op het leven of de vrijheid van een hoofd van een bevriende staat wordt gestraft met gevangenisstraf van
      ten hoogste vijftien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel115
  - number: '115.2'
    text: |-
      Indien de aanslag op het leven de dood ten gevolge heeft of met voorbedachten rade wordt ondernomen, wordt
      levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel115
  - number: '116'
    text: |-
      Elke feitelijke aanranding van de persoon van een hoofd van een bevriende staat, die niet valt in een zwaardere
      strafbepaling, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel116
  - number: '117.1'
    text: |-
      De aanslag op het leven of de vrijheid van een internationaal beschermd persoon wordt gestraft met gevangenisstraf
      van ten hoogste twaalf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel117
  - number: '117.2'
    text: |-
      Indien de aanslag op het leven de dood ten gevolge heeft of met voorbedachte rade wordt ondernomen, wordt
      levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren opgelegd of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel117
  - number: 117a
    text: |-
      Elke feitelijke aanranding van de persoon van een internationaal beschermd persoon, die niet valt in een zwaardere
      strafbepaling, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel117a
  - number: 117b
    text: |-
      Hij die opzettelijk geweld pleegt tegen de beschermde goederen van een internationaal beschermd persoon
      wordt, indien daardoor gevaar voor de veiligheid of de vrijheid van die persoon te duchten is, gestraft met
      gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel117b
  - number: '118.1'
    text: |-
      Opzettelijke belediging van het hoofd of een lid van de regering van een bevriende staat, in de uitoefening van
      zijn ambt in Nederland verblijvende, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van
      de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel118
  - number: '118.2'
    text: |-
      Met dezelfde straf wordt gestraft opzettelijke belediging van een officieel bij de Nederlandse regering toegelaten
      vertegenwoordiger van een bevriende staat in diens hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel118
  - number: '118.3'
    text: |-
      Bij veroordeling wegens een der in dit artikel omschreven misdrijven kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°-2°][ref1], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '119.1'
    text: |-
      Hij die een geschrift of afbeelding waarin een belediging voorkomt voor het hoofd of een lid van de regering van
      een bevriende staat, in de uitoefening van zijn ambt in Nederland verblijvende, verspreidt, openlijk tentoonstelt
      of aanslaat, dan wel de inhoud van zulk een geschrift openlijk ten gehore brengt, wordt, indien hij weet of
      ernstige reden heeft om te vermoeden dat in het geschrift of de afbeelding zodanige belediging voorkomt, gestraft
      met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel119
  - number: '119.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die een geschrift of afbeelding waarin een belediging voorkomt voor een
      officieel bij de Nederlandse regering toegelaten vertegenwoordiger van een bevriende staat in diens hoedanigheid,
      verspreidt, openlijk tentoonstelt of aanslaat, of om verspreid, openlijk tentoongesteld of aangeslagen te worden
      in voorraad heeft, dan wel de inhoud van zulk een geschrift openlijk ten gehore brengt, indien hij weet of ernstige
      reden heeft om te vermoeden dat in het geschrift of de afbeelding zodanige belediging voorkomt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel119
  - number: '119.3'
    text: |-
      Indien de schuldige een van de misdrijven omschreven in dit artikel, in zijn beroep begaat en er, tijdens het
      plegen van het misdrijf, nog geen twee jaren zijn verlopen sedert een vroegere veroordeling van de schuldige wegens
      een van deze misdrijven onherroepelijk is geworden, kan hij van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel119
  - number: '120'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 115][ref1] en [116][ref2] omschreven misdrijven, kan ontzetting
      van de in [artikel 28, eerste lid, onder 1°-4°][ref3], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel116
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '115'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '116'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 120a
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 115, eerste lid][ref1], [116][ref2], [117, eerste lid][ref3],
      [117a][ref4] of [117b][ref5], is begaan met een terroristisch oogmerk, wordt de in dat artikel bepaalde tijdelijke
      gevangenisstraf met de helft verhoogd en wordt, indien op het misdrijf een tijdelijke gevangenisstraf van ten
      hoogste vijftien jaren is gesteld, levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel116
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel117
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel117a
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel117b
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel120a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '115'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '116'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '117'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 117a
      - id: ref5
        bwb_id: BWBR0001854
        artikel: 117b
  - number: 120b.1
    text: |-
      De samenspanning tot de in de [artikelen 115][ref1] en [117][ref2] omschreven misdrijven, te begaan met een
      terroristisch oogmerk, wordt gestraft met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel117
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel120b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '115'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '117'
  - number: 120b.2
    text: |-
      [Artikel 96, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel96
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel120b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '96'
  - number: '121'
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van de beide kamers der Staten-Generaal of van een
      van deze uiteenjaagt of tot het nemen of niet nemen van enig besluit dwingt, of een lid, een minister of een
      staatssecretaris uit die vergadering verwijdert of opzettelijk verhindert die bij te wonen of daarin vrij en
      onbelemmerd zijn plicht te vervullen, wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste
      dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel121
  - number: 121a
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van een commissie uit de beide kamers der Staten-
      Generaal of uit een van deze uiteenjaagt of tot het nemen of niet nemen van enig besluit dwingt of een lid, een
      minister of een staatssecretaris uit die vergadering verwijdert of opzettelijk verhindert die bij te wonen of
      daarin vrij en onbelemmerd zijn plicht te vervullen, wordt gestraft met gevangenisstraf van ten hoogste negen jaren
      of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel121a
  - number: '122.1'
    text: |-
      De samenspanning tot het in [artikel 121][ref1] omschreven misdrijf wordt gestraft met gevangenisstraf van ten
      hoogste tien jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel121
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '121'
  - number: '122.2'
    text: |-
      [Artikel 96, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel96
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '96'
  - number: '123'
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van de staten van een provincie uiteenjaagt of tot
      het nemen of niet nemen van enig besluit dwingt of een lid, de voorzitter of een gedeputeerde uit die vergadering
      verwijdert of opzettelijk verhindert die bij te wonen of daarin vrij en onbelemmerd zijn plicht te vervullen, wordt
      gestraft met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel123
  - number: 123a
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van een door de staten van een provincie ingestelde
      commissie uiteenjaagt of tot het nemen of niet nemen van enig besluit dwingt of een lid, een gedeputeerde of de
      commissaris van de Koning uit die vergadering verwijdert of opzettelijk verhindert die bij te wonen of daarin vrij
      en onbelemmerd zijn plicht te vervullen, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete
      van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel123a
  - number: '124'
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van de raad van een gemeente uiteenjaagt of tot
      het nemen of niet nemen van enig besluit dwingt of een lid, de voorzitter of een wethouder uit die vergadering
      verwijdert of opzettelijk verhindert die bij te wonen of daarin vrij en onbelemmerd zijn plicht te vervullen, wordt
      gestraft met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel124
  - number: 124a
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van een door de raad van een gemeente ingestelde
      commissie uiteenjaagt of tot het nemen of niet nemen van enig besluit dwingt of een lid, een wethouder of
      de burgemeester uit die vergadering verwijdert of opzettelijk verhindert die bij te wonen of daarin vrij en
      onbelemmerd zijn plicht te vervullen, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete
      van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel124a
  - number: '125'
    text: |-
      Hij die bij gelegenheid van een krachtens wettelijk voorschrift uitgeschreven verkiezing door geweld of bedreiging
      met geweld opzettelijk iemand verhindert zijn of eens anders kiesrecht vrij en onbelemmerd uit te oefenen, wordt
      gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel125
  - number: '126.1'
    text: |-
      Hij die bij gelegenheid van een krachtens wettelijk voorschrift uitgeschreven verkiezing door gift of belofte
      iemand omkoopt om zijn of eens anders kiesrecht hetzij niet, hetzij op bepaalde wijze uit te oefenen, wordt
      gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel126
  - number: '126.2'
    text: |-
      Dezelfde straf wordt toegepast op de kiezer of de gemachtigde van een kiezer die zich door gift of belofte tot een
      of ander laat omkopen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel126
  - number: '127'
    text: |-
      Hij die bij gelegenheid van een krachtens wettelijk voorschrift uitgeschreven verkiezing, enige bedrieglijke
      handeling pleegt waardoor een stem van onwaarde wordt of een ander dan de bij het uitbrengen van de stem bedoelde
      persoon wordt aangewezen, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel127
  - number: '128'
    text: |-
      Hij die opzettelijk zich voor een ander uitgevende, aan een krachtens wettelijk voorschrift uitgeschreven
      verkiezing deelneemt, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel128
  - number: '129'
    text: |-
      Hij die bij gelegenheid van een krachtens wettelijk voorschrift uitgeschreven verkiezing, opzettelijk een
      plaats gehad hebbende stemming verijdelt of enige bedrieglijke handeling pleegt waardoor aan de stemming een
      andere uitslag wordt gegeven dan door de wettig uitgebrachte stemmen zou zijn verkregen, wordt gestraft met
      gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel129
  - number: '130.1'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 121][ref1] en [123][ref2] omschreven misdrijven, kan ontzetting
      van de in [artikel 28, eerste lid, onder 1°-3°][ref3], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel123
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '121'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '123'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '130.2'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 122][ref1], [124][ref2] en [129][ref3] omschreven misdrijven, kan
      ontzetting van de in [artikel 28, eerste lid, onder 3°][ref4], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel124
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel129
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '122'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '124'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '129'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 130a
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 123][ref1] of [124][ref2], is begaan met een terroristisch
      oogmerk, wordt de in deze artikelen bepaalde tijdelijke gevangenisstraf met de helft verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel124
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel130a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '123'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '124'
  - number: '131'
    text: |-
      Hij die in het openbaar, mondeling of bij geschrift of afbeelding, tot enig strafbaar feit of tot gewelddadig
      optreden tegen het openbaar gezag opruit, wordt gestraft met gevangenisstraf van ten hoogste vijf jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel131
  - number: '132.1'
    text: |-
      Hij die een geschrift of afbeelding waarin tot enig strafbaar feit of tot gewelddadig optreden tegen het openbaar
      gezag wordt opgeruid, verspreidt, openlijk tentoonstelt of aanslaat of, om verspreid, openlijk tentoongesteld of
      aangeslagen te worden, in voorraad heeft, wordt, indien hij weet of ernstige reden heeft te vermoeden dat in het
      geschrift of de afbeelding zodanige opruiing voorkomt, gestraft met gevangenisstraf van ten hoogste drie jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel132
  - number: '132.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die, met gelijke wetenschap of een gelijke reden tot vermoeden, de inhoud van
      een zodanig geschrift openlijk ten gehore brengt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel132
  - number: '132.3'
    text: |-
      Indien de schuldige een van de misdrijven omschreven in dit artikel in zijn beroep begaat en er, tijdens het plegen
      van het misdrijf, nog geen vijf jaren zijn verlopen sedert een vroegere veroordeling van de schuldige wegens een
      van deze misdrijven onherroepelijk is geworden, kan hij van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel132
  - number: '133'
    text: |-
      Hij die in het openbaar, mondeling of bij geschrift of afbeelding, aanbiedt inlichtingen, gelegenheid of middelen
      te verschaffen om enig strafbaar feit te plegen, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel133
  - number: '134.1'
    text: |-
      Hij die een geschrift of afbeelding waarin wordt aangeboden inlichtingen, gelegenheid of middelen te verschaffen
      om enig strafbaar feit te plegen, verspreidt, openlijk tentoonstelt of aanslaat of, om verspreid, openlijk
      tentoongesteld of aangeslagen te worden, in voorraad heeft, wordt, indien hij weet of ernstige reden heeft om
      te vermoeden dat in het geschrift of de afbeelding zodanig aanbod voorkomt, gestraft met gevangenisstraf van ten
      hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel134
  - number: '134.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die, met gelijke wetenschap of een gelijke reden tot vermoeden, de inhoud van
      een zodanig geschrift openlijk ten gehore brengt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel134
  - number: '134.3'
    text: |-
      Indien de schuldige een van de misdrijven omschreven in dit artikel in zijn beroep begaat en er, tijdens het plegen
      van het misdrijf, nog geen vijf jaren zijn verlopen sedert een vroegere veroordeling van de schuldige wegens een
      van deze misdrijven onherroepelijk is geworden, kan hij van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel134
  - number: '135'
    text: |-
      Hij die, kennis dragende van een samenspanning tot een der in de [artikelen 92-95][ref1], [102][ref2] of
      [121][ref3] bedoelde misdrijven, op een tijdstip waarop het plegen van deze misdrijven nog kan worden voorkomen,
      opzettelijk nalaat daarvan tijdig voldoende kennis te geven, hetzij aan de ambtenaren van de justitie of politie,
      hetzij aan de bedreigde, wordt, indien het misdrijf is gevolgd, gestraft met gevangenisstraf van ten hoogste een
      jaar of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel102
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel121
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '92'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '102'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '121'
  - number: '136.1'
    text: |-
      Hij die, kennis dragende van een voornemen tot het plegen van een der in de [artikelen 92-110][ref1] omschreven
      misdrijven, tot desertie in tijd van oorlog, tot militair verraad, tot moord, mensenroof of verkrachting of tot
      een der in Titel VII van dit Boek omschreven misdrijven voor zover daardoor levensgevaar wordt veroorzaakt, op
      een tijdstip waarop het plegen van deze misdrijven nog kan worden voorkomen, opzettelijk nalaat daarvan tijdig
      voldoende kennis te geven, hetzij aan de ambtenaren van de justitie of politie, hetzij aan de bedreigde, wordt,
      indien het misdrijf is gevolgd, gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel92
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '92'
  - number: '136.2'
    text: |-
      Dezelfde straf is toepasselijk op hem die, kennis dragende van enig in het eerste lid vermeld reeds gepleegd
      misdrijf waardoor levensgevaar is ontstaan, op een tijdstip waarop de gevolgen nog kunnen worden afgewend,
      opzettelijk nalaat daarvan gelijke kennisgeving te doen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel136
  - number: '137'
    text: |-
      De bepalingen van de [artikelen 135][ref1] en [136][ref2] zijn niet van toepassing op hem die door de kennisgeving
      gevaar voor een strafvervolging zou doen ontstaan voor zichzelf, voor een van zijn bloedverwanten of aangehuwden in
      de rechte linie of in de tweede of derde graad van de zijlinie, voor zijn echtgenoot of gewezen echtgenoot, of voor
      een ander bij wiens vervolging hij zich, uit hoofde van zijn ambt of beroep, van het afleggen van getuigenis zou
      kunnen verschonen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel135
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel136
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '135'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '136'
  - number: 137c.1
    text: |-
      Hij die zich in het openbaar, mondeling of bij geschrift of afbeelding, opzettelijk beledigend uitlaat over een
      groep mensen wegens hun ras, hun godsdienst of levensovertuiging, hun hetero- of homoseksuele gerichtheid of hun
      lichamelijke, psychische of verstandelijke handicap, wordt gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel137c
  - number: 137c.2
    text: |-
      Indien het feit wordt gepleegd door een persoon die daarvan een beroep of gewoonte maakt of door twee of meer
      verenigde personen wordt gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel137c
  - number: 137d.1
    text: |-
      Hij die in het openbaar, mondeling of bij geschrift of afbeelding, aanzet tot haat tegen of discriminatie
      van mensen of gewelddadig optreden tegen persoon of goed van mensen wegens hun ras, hun godsdienst of
      levensovertuiging, hun geslacht, hun hetero- of homoseksuele gerichtheid of hun lichamelijke, psychische of
      verstandelijke handicap, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel137d
  - number: 137d.2
    text: |-
      Indien het feit wordt gepleegd door een persoon die daarvan een beroep of gewoonte maakt of door twee of meer
      verenigde personen wordt gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel137d
  - number: 137e.1
    text: 'Hij die, anders dan ten behoeve van zakelijke berichtgeving:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel137e
  - number: 137e.1.1°
    text: |-
      een uitlating openbaar maakt die, naar hij weet of redelijkerwijs moet vermoeden, voor een groep mensen wegens hun
      ras, hun godsdienst of levensovertuiging, hun hetero- of homoseksuele gerichtheid of hun lichamelijke, psychische
      of verstandelijke handicap beledigend is, of aanzet tot haat tegen of discriminatie van mensen of gewelddadig
      optreden tegen persoon of goed van mensen wegens hun ras, hun godsdienst of levensovertuiging, hun geslacht, hun
      hetero- of homoseksuele gerichtheid of hun lichamelijke, psychische of verstandelijke handicap;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel137e
  - number: 137e.1.2°
    text: |-
      een voorwerp waarin, naar hij weet of redelijkerwijs moet vermoeden, zulk een uitlating is vervat, aan iemand,
      anders dan op diens verzoek, doet toekomen, dan wel verspreidt of ter openbaarmaking van die uitlating of
      verspreiding in voorraad heeft;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel137e
  - number: 137e.2
    text: |-
      Indien het feit wordt gepleegd door een persoon die daarvan een beroep of gewoonte maakt of door twee of meer
      verenigde personen wordt gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel137e
  - number: 137e.3
    text: |-
      Indien de schuldige een van de strafbare feiten, omschreven in dit artikel, in zijn beroep begaat en er, tijdens
      het plegen van het feit, nog geen vijf jaren zijn verlopen sedert een vroegere veroordeling van de schuldige wegens
      een van deze misdrijven onherroepelijk is geworden, kan hij van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel137e
  - number: 137f
    text: |-
      Hij die deelneemt of geldelijke of andere stoffelijke steun verleent aan activiteiten gericht op discriminatie van
      mensen wegens hun ras, hun godsdienst, hun levensovertuiging, hun geslacht, hun hetero- of homoseksuele gerichtheid
      of hun lichamelijke, psychische of verstandelijke handicap, wordt gestraft met gevangenisstraf van ten hoogste drie
      maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel137f
  - number: 137g.1
    text: |-
      Hij die, in de uitoefening van een ambt, beroep of bedrijf personen opzettelijk discrimineert wegens hun ras, wordt
      gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel137g
  - number: 137g.2
    text: |-
      Indien het feit wordt gepleegd door een persoon die daarvan een gewoonte maakt of door twee of meer verenigde
      personen wordt gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel137g
  - number: '138.1'
    text: |-
      Hij die in de woning of het besloten lokaal of erf, bij een ander in gebruik, wederrechtelijk binnendringt of,
      wederrechtelijk aldaar vertoevende, zich niet op de vordering van of vanwege de rechthebbende aanstonds verwijdert,
      wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel138
  - number: '138.2'
    text: |-
      Hij die zich de toegang heeft verschaft door middel van braak of inklimming, van valse sleutels, van een
      valse order of een vals kostuum, of die, zonder voorkennis van de rechthebbende en anders dan ten gevolge van
      vergissing binnengekomen, aldaar wordt aangetroffen in de voor de nachtrust bestemde tijd, wordt geacht te zijn
      binnengedrongen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel138
  - number: '138.3'
    text: |-
      Indien hij bedreigingen uit of zich bedient van middelen geschikt om vrees aan te jagen, wordt hij gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel138
  - number: '138.4'
    text: |-
      De in het eerste en derde lid bepaalde gevangenisstraffen kunnen met een derde worden verhoogd, indien twee of meer
      verenigde personen het misdrijf plegen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel138
  - number: 138a.1
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt, als schuldig aan
      computervredebreuk, gestraft hij die opzettelijk en wederrechtelijk binnendringt in een geautomatiseerd werk of in
      een deel daarvan. Van binnendringen is in ieder geval sprake indien de toegang tot het werk wordt verworven:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel138a
  - number: 138a.1.a
    text: door het doorbreken van een beveiliging,
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel138a
  - number: 138a.1.b
    text: door een technische ingreep,
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel138a
  - number: 138a.1.c
    text: met behulp van valse signalen of een valse sleutel, of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel138a
  - number: 138a.1.d
    text: door het aannemen van een valse hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel138a
  - number: 138a.2
    text: |-
      Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie wordt gestraft
      computervredebreuk, indien de dader vervolgens gegevens die zijn opgeslagen, worden verwerkt of overgedragen door
      middel van het geautomatiseerd werk waarin hij zich wederrechtelijk bevindt, voor zichzelf of een ander overneemt,
      aftapt of opneemt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel138a
  - number: 138a.3
    text: |-
      Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie wordt gestraft
      computervredebreuk gepleegd door tussenkomst van een openbaar telecommunicatienetwerk, indien de dader vervolgens
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel138a
  - number: 138a.3.a
    text: |-
      met het oogmerk zichzelf of een ander wederrechtelijk te bevoordelen gebruik maakt van verwerkingscapaciteit van
      een geautomatiseerd werk;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel138a
  - number: 138a.3.b
    text: |-
      door tussenkomst van het geautomatiseerd werk waarin hij is binnengedrongen de toegang verwerft tot het
      geautomatiseerd werk van een derde.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel138a
  - number: 138b
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft hij die
      opzettelijk en wederrechtelijk de toegang tot of het gebruik van een geautomatiseerd werk belemmert door daaraan
      gegevens aan te bieden of toe te zenden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel138b
  - number: '139.1'
    text: |-
      Hij die in een voor de openbare dienst bestemd lokaal wederrechtelijk binnendringt, of, wederrechtelijk aldaar
      vertoevende, zich niet op de vordering van de bevoegde ambtenaar aanstonds verwijdert, wordt gestraft met
      gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139
  - number: '139.2'
    text: |-
      Hij die zich de toegang heeft verschaft door middel van braak of inklimming, van valse sleutels, van een valse
      order of een vals kostuum, of die zonder voorkennis van de bevoegde ambtenaar en anders dan ten gevolge van
      vergissing binnengekomen, aldaar wordt aangetroffen in de voor de nachtrust bestemde tijd, wordt geacht te zijn
      binnengedrongen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139
  - number: '139.3'
    text: |-
      Indien hij bedreigingen uit of zich bedient van middelen geschikt om vrees aan te jagen, wordt hij gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139
  - number: '139.4'
    text: |-
      De in het eerste en derde lid bepaalde gevangenisstraffen kunnen met een derde worden verhoogd, indien twee of meer
      verenigde personen het misdrijf plegen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139
  - number: 139a.1
    text: |-
      Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft hij die met een
      technisch hulpmiddel een gesprek dat in een woning, besloten lokaal of erf wordt gevoerd opzettelijk:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139a
  - number: 139a.1.1°
    text: anders dan in opdracht van een deelnemer aan dat gesprek afluistert;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139a
  - number: 139a.1.2°
    text: zonder deelnemer aan dat gesprek te zijn en anders dan in opdracht van zulk een deelnemer opneemt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139a
  - number: 139a.2
    text: 'Het eerste lid is niet van toepassing op het opnemen:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139a
  - number: 139a.2.1°
    text: |-
      van gegevens die worden verwerkt of overgedragen door middel van telecommunicatie of door middel van een
      geautomatiseerd werk;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139a
  - number: 139a.2.2°
    text: |-
      behoudens in geval van kennelijk misbruik, met een technisch hulpmiddel dat op gezag van degene bij wie de woning,
      het lokaal of het erf in gebruik is, niet heimelijk aanwezig is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139a
  - number: 139a.2.3°
    text: |-
      ter uitvoering van de [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139a
    references:
      - id: ref1
        bwb_id: BWBR0013409
  - number: 139b.1
    text: |-
      Met gevangenisstraf van ten hoogste drie maanden of geldboete van de derde categorie wordt gestraft hij die, met
      het oogmerk een gesprek dat elders dan in een woning, besloten lokaal of erf wordt gevoerd af te luisteren of op te
      nemen, dat gesprek met een technisch hulpmiddel heimelijk:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139b
  - number: 139b.1.1°
    text: anders dan in opdracht van een deelnemer aan dat gesprek afluistert;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139b
  - number: 139b.1.2°
    text: zonder deelnemer aan dat gesprek te zijn en anders dan in opdracht van zulk een deelnemer opneemt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139b
  - number: 139b.2
    text: |-
      [Artikel 139a, tweede lid, onder 1° en 3°][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel139a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 139a
  - number: 139c.1
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft hij die
      opzettelijk en wederrechtelijk met een technisch hulpmiddel gegevens aftapt of opneemt die niet voor hem bestemd
      zijn en die worden verwerkt of overgedragen door middel van telecommunicatie of door middel van een geautomatiseerd
      werk.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139c
  - number: 139c.2
    text: 'Het eerste lid is niet van toepassing op het aftappen of opnemen:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139c
  - number: 139c.2.1°
    text: |-
      van door middel van een radio-ontvangapparaat ontvangen gegevens, tenzij om de ontvangst mogelijk te maken een
      bijzondere inspanning is geleverd of een niet toegestane ontvanginrichting is gebruikt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139c
  - number: 139c.2.2°
    text: |-
      door of in opdracht van de gerechtigde tot een voor de telecommunicatie gebezigde aansluiting, behoudens in geval
      van kennelijk misbruik;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139c
  - number: 139c.2.3°
    text: |-
      ten behoeve van de goede werking van een openbaar telecommunicatienetwerk, ten behoeve van de strafvordering, dan
      wel ter uitvoering van de [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139c
    references:
      - id: ref1
        bwb_id: BWBR0013409
  - number: 139d.1
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft hij die met het
      oogmerk dat daardoor een gesprek, telecommunicatie of andere gegevensoverdracht of andere gegevensverwerking door
      een geautomatiseerd werk wederrechtelijk wordt afgeluisterd, afgetapt of opgenomen, een technisch hulpmiddel op een
      bepaalde plaats aanwezig doet zijn.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139d
  - number: 139d.2
    text: |-
      Met dezelfde straf wordt gestraft hij die, met het oogmerk dat daarmee een misdrijf als bedoeld in
      [artikel 138a, eerste lid][ref1], [138b][ref2] of [139c][ref3] wordt gepleegd:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel138a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel138b
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel139c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 138a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 138b
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 139c
  - number: 139d.2.a
    text: |-
      een technisch hulpmiddel dat hoofdzakelijk geschikt gemaakt of ontworpen is tot het plegen van een zodanig
      misdrijf, vervaardigt, verkoopt, verwerft, invoert, verspreidt of anderszins ter beschikking stelt of voorhanden
      heeft, of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139d
  - number: 139d.2.b
    text: |-
      een computerwachtwoord, toegangscode of daarmee vergelijkbaar gegeven waardoor toegang kan worden gekregen tot een
      geautomatiseerd werk of een deel daarvan, verkoopt, verwerft, verspreidt of anderszins ter beschikking stelt of
      voorhanden heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139d
  - number: 139d.3
    text: |-
      Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie wordt gestraft hij die
      het in het tweede lid bedoelde feit pleegt terwijl zijn oogmerk is gericht op een misdrijf als bedoeld in
      [artikel 138a, tweede of derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel138a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 138a
  - number: 139e
    text: 'Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139e
  - number: 139e.1°
    text: |-
      hij die de beschikking heeft over een voorwerp waarop, naar hij weet of redelijkerwijs moet vermoeden, gegevens
      zijn vastgelegd die door wederrechtelijk afluisteren, aftappen of opnemen van een gesprek, telecommunicatie of
      andere gegevensoverdracht of andere gegevensverwerking door een geautomatiseerd werk zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139e
  - number: 139e.2°
    text: |-
      hij die gegevens die hij door wederrechtelijk afluisteren, aftappen of opnemen van een gesprek, telecommunicatie of
      andere gegevensoverdracht of andere gegevensverwerking door een geautomatiseerd werk heeft verkregen of die, naar
      hij weet of redelijkerwijs moet vermoeden, ten gevolge van zulk afluisteren, aftappen of opnemen te zijner kennis
      zijn gekomen, opzettelijk aan een ander bekend maakt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139e
  - number: 139e.3°
    text: hij die een voorwerp als omschreven onder 1° opzettelijk ter beschikking stelt van een ander.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139e
  - number: 139f
    text: 'Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139f
  - number: 139f.1°
    text: |-
      hij die, gebruik makende van een technisch hulpmiddel waarvan de aanwezigheid niet op duidelijke wijze kenbaar
      is gemaakt, opzettelijk en wederrechtelijk van een persoon, aanwezig in een woning of op een andere niet voor het
      publiek toegankelijke plaats, een afbeelding vervaardigt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139f
  - number: 139f.2°
    text: |-
      hij die de beschikking heeft over een afbeelding welke, naar hij weet of redelijkerwijs moet vermoeden, door of ten
      gevolge van een onder 1° strafbaar gestelde handeling is verkregen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139f
  - number: 139g
    text: |-
      Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft hij die een
      afbeelding, als bedoeld in het vorige artikel, onder 2°, openbaar maakt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel139g
  - number: '140.1'
    text: |-
      Deelneming aan een organisatie die tot oogmerk heeft het plegen van misdrijven, wordt gestraft met gevangenisstraf
      van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel140
  - number: '140.2'
    text: |-
      Deelneming aan de voortzetting van de werkzaamheid van een rechtspersoon die bij onherroepelijke rechterlijke
      beslissing verboden is verklaard en deswege is ontbonden wordt gestraft met gevangenisstraf van ten hoogste een
      jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel140
  - number: '140.3'
    text: Ten aanzien van de oprichters, leiders of bestuurders kunnen de gevangenisstraffen met een derde worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel140
  - number: '140.4'
    text: |-
      Onder deelneming als omschreven in het eerste lid wordt mede begrepen het verlenen van geldelijke of andere
      stoffelijke steun aan alsmede het werven van gelden of personen ten behoeve van de daar omschreven organisatie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel140
  - number: 140a.1
    text: |-
      Deelneming aan een organisatie die tot oogmerk heeft het plegen van terroristische misdrijven, wordt gestraft met
      gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel140a
  - number: 140a.2
    text: |-
      Oprichters, leiders of bestuurders worden gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste
      dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel140a
  - number: 140a.3
    text: |-
      Het [vierde lid van artikel 140][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel140
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel140a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '140'
  - number: '141.1'
    text: |-
      Zij die openlijk in vereniging geweld plegen tegen personen of goederen, worden gestraft met gevangenisstraf van
      ten hoogste vier jaren en zes maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel141
  - number: '141.2'
    text: 'De schuldige wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel141
  - number: 141.2.1°
    text: |-
      met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie, indien hij opzettelijk goederen
      vernielt of indien het door hem gepleegde geweld enig lichamelijk letsel ten gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel141
  - number: 141.2.2°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien dat geweld zwaar
      lichamelijk letsel ten gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel141
  - number: 141.2.3°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien dat geweld de dood
      ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel141
  - number: '141.3'
    text: |-
      [Artikel 81][ref1] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel81
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '81'
  - number: '142.1'
    text: |-
      Hij die opzettelijk door valse alarmkreten of signalen de rust verstoort, wordt gestraft met gevangenisstraf van
      ten hoogste een jaar of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel142
  - number: '142.2'
    text: |-
      Hij die opzettelijk, zonder dat daartoe de noodzaak aanwezig is, gebruik maakt van een alarmnummer voor publieke
      diensten wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel142
  - number: 142a.1
    text: |-
      Hij die een voorwerp verzendt of op een al dan niet voor het publiek toegankelijke plaats achterlaat of plaatst,
      met het oogmerk een ander ten onrechte te doen geloven dat daardoor een ontploffing kan worden teweeggebracht,
      wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel142a
  - number: 142a.2
    text: |-
      Met dezelfde straf wordt gestraft hij die gegevens doorgeeft met het oogmerk een ander ten onrechte te doen geloven
      dat op een al dan niet voor het publiek toegankelijke plaats een voorwerp aanwezig is waardoor een ontploffing kan
      worden teweeggebracht.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel142a
  - number: '143'
    text: |-
      Hij die door geweld of bedreiging met geweld een geoorloofde openbare vergadering of betoging verhindert, wordt
      gestraft met gevangenisstraf van ten hoogste negen maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel143
  - number: '144'
    text: |-
      Hij die door het verwekken van wanorde of het maken van gedruis een geoorloofde openbare vergadering opzettelijk
      stoort, of door het verwekken van wanorde een geoorloofde betoging opzettelijk stoort, wordt gestraft met
      gevangenisstraf van ten hoogste twee weken of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel144
  - number: '145'
    text: |-
      Hij die door geweld of bedreiging met geweld hetzij een geoorloofde openbare samenkomst tot het belijden van
      godsdienst of levensovertuiging, hetzij een geoorloofde godsdienstige of levensbeschouwelijke plechtigheid of
      lijkplechtigheid verhindert, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel145
  - number: '146'
    text: |-
      Hij die door het verwekken van wanorde of het maken van gedruis hetzij een geoorloofde openbare samenkomst tot
      het belijden van godsdienst of levensovertuiging, hetzij een geoorloofde godsdienstige of levensbeschouwelijke
      plechtigheid of lijkplechtigheid opzettelijk stoort, wordt gestraft met gevangenisstraf van ten hoogste twee
      maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel146
  - number: '147'
    text: 'Met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel147
  - number: 147.1°
    text: |-
      hij die zich in het openbaar, mondeling of bij geschrift of afbeelding, door smalende godslasteringen op voor
      godsdienstige gevoelens krenkende wijze uitlaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel147
  - number: 147.2°
    text: hij die een bedienaar van de godsdienst in de geoorloofde waarneming van zijn bediening bespot;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel147
  - number: 147.3°
    text: |-
      hij die voorwerpen aan een eredienst gewijd, waar en wanneer de uitoefening van die dienst geoorloofd is,
      beschimpt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel147
  - number: 147a.1
    text: |-
      Hij die een geschrift of afbeelding waarin uitlatingen voorkomen die, als smalende godslasteringen, voor
      godsdienstige gevoelens krenkend zijn, verspreidt, openlijk tentoonstelt of aanslaat of, om verspreid, openlijk
      tentoongesteld of aangeslagen te worden, in voorraad heeft, wordt, indien hij weet of ernstige reden heeft om te
      vermoeden dat in het geschrift of de afbeelding zodanige uitlatingen voorkomen, gestraft met gevangenisstraf van
      ten hoogste twee maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel147a
  - number: 147a.2
    text: |-
      Met dezelfde straf wordt gestraft hij die, met gelijke wetenschap of een gelijke reden tot vermoeden, de inhoud van
      een zodanig geschrift openlijk ten gehore brengt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel147a
  - number: 147a.3
    text: |-
      Indien de schuldige een van de misdrijven omschreven in dit artikel in zijn beroep begaat en er, tijdens het plegen
      van het misdrijf, nog geen twee jaren zijn verlopen sedert een vroegere veroordeling van de schuldige wegens een
      van deze misdrijven onherroepelijk is geworden, kan hij van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel147a
  - number: '148'
    text: |-
      Hij die opzettelijk de geoorloofde toegang tot een begraafplaats of crematorium of het geoorloofd vervoer van een
      lijk naar een begraafplaats of crematorium verhindert of belemmert, wordt gestraft met gevangenisstraf van ten
      hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel148
  - number: '149'
    text: |-
      Hij die opzettelijk een graf schendt of enig op een begraafplaats opgericht gedenkteken opzettelijk en
      wederrechtelijk vernielt of beschadigt, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete
      van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel149
  - number: '150'
    text: |-
      Hij die opzettelijk en wederrechtelijk een lijk opgraaft of wegneemt of een opgegraven of weggenomen lijk
      verplaatst of vervoert, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel150
  - number: '151'
    text: |-
      Hij die een lijk begraaft, verbrandt, vernietigt, verbergt, wegvoert of wegmaakt, met het oogmerk om het feit of de
      oorzaak van het overlijden, dan wel van het dood ter wereld komen te verhelen, wordt gestraft met gevangenisstraf
      van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel151
  - number: 151a
    text: |-
      Hij die uit winstbejag opzettelijk bevordert dat een kind beneden de leeftijd van zes maanden hetwelk niet
      onder voogdij van een rechtspersoon staat, zonder voorafgaande schriftelijke toestemming van de raad voor de
      kinderbescherming, als pleegkind wordt opgenomen, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel151a
  - number: 151b.1
    text: |-
      Degene die in de uitoefening van een beroep of bedrijf opzettelijk teweegbrengt of bevordert dat een draagmoeder
      of een vrouw die draagmoeder wenst te worden, rechtstreeks of middellijk met een ander onderhandelt of een afspraak
      maakt ten einde het voornemen, bedoeld in het derde lid, uit te voeren, wordt gestraft met gevangenisstraf van ten
      hoogste een jaar of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel151b
  - number: 151b.2
    text: 'Met dezelfde straf wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel151b
  - number: 151b.2.a
    text: |-
      degene die in het openbaar diensten aanbiedt, bestaande uit het teweegbrengen of bevorderen van onderhandelingen of
      een afspraak als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel151b
  - number: 151b.2.b
    text: |-
      degene die openbaar maakt dat een vrouw draagmoeder wenst te worden of als zodanig beschikbaar is, dan wel dat een
      vrouw die draagmoeder wenst te worden of als zodanig beschikbaar is, wordt gezocht.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel151b
  - number: 151b.3
    text: |-
      Als draagmoeder wordt aangemerkt de vrouw die zwanger is geworden met het voornemen een kind te baren ten behoeve
      van een ander die het ouderlijk gezag over dat kind wil verwerven, dan wel anderszins duurzaam de verzorging en
      opvoeding van dat kind op zich wil nemen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel151b
  - number: 151c.1
    text: |-
      Degene die in de uitoefening van een beroep of bedrijf opzettelijk teweegbrengt of bevordert dat een vrouw
      rechtstreeks of middellijk met een ander onderhandelt of een afspraak maakt in verband met de wens van die vrouw de
      verzorging en opvoeding van haar kind duurzaam aan een ander over te laten, wordt gestraft met gevangenisstraf van
      ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel151c
  - number: 151c.2
    text: |-
      Onverminderd het bepaalde in [artikel 151][ref1], is het eerste lid niet van toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel151b
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel151c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 151b
  - number: 151c.2.a
    text: |-
      indien het in dat lid bedoelde teweegbrengen of bevorderen geschiedt door de raad voor de kinderbescherming of een
      door de raad daartoe aangewezen rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel151c
  - number: 151c.2.b
    text: |-
      indien het in dat lid bedoelde teweegbrengen of bevorderen een verwijzing betreft naar een organisatie als bedoeld
      onder *a*.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel151c
  - number: '157'
    text: 'Hij die opzettelijk brand sticht, een ontploffing teweegbrengt of een overstroming veroorzaakt, wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel157
  - number: 157.1°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daarvan gemeen gevaar
      voor goederen te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel157
  - number: 157.2°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar of gevaar voor zwaar lichamelijk letsel voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel157
  - number: 157.3°
    text: |-
      met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie,
      indien daarvan levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel157
  - number: '158'
    text: 'Hij aan wiens schuld brand, ontploffing of overstroming te wijten is, wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel158
  - number: 158.1°
    text: |-
      met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie, indien daardoor gemeen gevaar
      voor goederen ontstaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel158
  - number: 158.2°
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daardoor levensgevaar of
      gevaar voor zwaar lichamelijk letsel voor een ander ontstaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel158
  - number: 158.3°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands dood
      ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel158
  - number: '159'
    text: |-
      Hij die opzettelijk bij of in het vooruitzicht van brand blusgereedschappen of blusmiddelen wederrechtelijk
      verbergt of onbruikbaar maakt, of op enige wijze de blussing van brand verhindert of belemmert, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel159
  - number: '160'
    text: |-
      Hij die opzettelijk bij of in het vooruitzicht van watersnood dijkmaterialen of gereedschappen wederrechtelijk
      verbergt of onbruikbaar maakt, enige poging tot herstel van dijken of andere waterstaatswerken verijdelt, of de
      aangewende middelen tot het voorkomen of stuiten van overstroming tegenwerkt, wordt gestraft met gevangenisstraf
      van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel160
  - number: '161'
    text: |-
      Hij die opzettelijk enig werk dienend tot waterkering, waterlozing, gas- of waterleiding of riolering vernielt,
      onbruikbaar maakt of beschadigt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161
  - number: 161.1º
    text: |-
      met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor een
      overstroming of gemeen gevaar voor goederen te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161
  - number: 161.2º
    text: |-
      met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daarvan levensgevaar
      voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161
  - number: 161.3º
    text: |-
      met gevangenisstraf van ten hoogste vijften jaren of geldboete van de vijfde categorie, indien daarvan levensgevaar
      voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161
  - number: 161bis
    text: |-
      Hij die opzettelijk enig electriciteitswerk vernielt, beschadigt of onbruikbaar maakt, stoornis in de gang of in de
      werking van zodanig werk veroorzaakt, of een ten opzichte van zodanig werk genomen veiligheidsmaatregel verijdelt,
      wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161bis
  - number: 161bis.1°
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie, indien daardoor verhindering of
      bemoeilijking van stroomlevering ten algemenen nutte ontstaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161bis
  - number: 161bis.2°
    text: |-
      met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie, indien daarvan gemeen gevaar
      voor goederen te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161bis
  - number: 161bis.3°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daarvan levensgevaar
      voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161bis
  - number: 161bis.4°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161bis
  - number: 161ter
    text: |-
      Hij aan wiens schuld te wijten is, dat enig electriciteitswerk wordt vernield, beschadigd, of onbruikbaar gemaakt,
      dat stoornis in de gang of in de werking van zodanig werk ontstaat, of dat een ten opzichte van zodanig werk
      genomen veiligheidsmaatregel wordt verijdeld, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161ter
  - number: 161ter.1°
    text: |-
      met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie, indien daardoor verhindering
      of bemoeilijking van stroomlevering ten algemenen nutte of gemeen gevaar voor goederen ontstaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161ter
  - number: 161ter.2°
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daardoor levensgevaar
      voor een ander ontstaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161ter
  - number: 161ter.3°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands dood
      ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161ter
  - number: 161quater
    text: |-
      Hij die opzettelijk mensen, dieren, planten of goederen aan ioniserende stralen blootstelt, dan wel mensen, dieren,
      planten, goederen, bodem, water of lucht met radioactieve stoffen besmet, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161quater
  - number: 161quater.1°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor
      de openbare gezondheid of levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161quater
  - number: 161quater.2°
    text: |-
      met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie,
      indien daarvan levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161quater
  - number: 161quinquies
    text: |-
      Hij aan wiens schuld te wijten is dat mensen, dieren, planten of goederen aan ioniserende stralen worden
      blootgesteld, dan wel mensen, dieren, planten, goederen, bodem, water of lucht met radioactieve stoffen worden
      besmet, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161quinquies
  - number: 161quinquies.1°
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daarvan gevaar voor de
      openbare gezondheid of levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161quinquies
  - number: 161quinquies.2°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien daarvan levensgevaar
      voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161quinquies
  - number: 161sexies.1
    text: |-
      Hij die opzettelijk enig geautomatiseerd werk of enig werk voor telecommunicatie vernielt, beschadigt of
      onbruikbaar maakt, stoornis in de gang of in de werking van zodanig werk veroorzaakt, of een ten opzichte van
      zodanig werk genomen veiligheidsmaatregel verijdelt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161sexies
  - number: 161sexies.1.1°
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie, indien daardoor wederrechtelijk
      verhindering of bemoeilijking van de opslag, verwerking of overdracht van gegevens ten algemene nutte of stoornis
      in een openbaar telecommunicatienetwerk of in de uitvoering van een openbare telecommunicatiedienst, ontstaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161sexies
  - number: 161sexies.1.2°
    text: |-
      met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie, indien daarvan gemeen gevaar
      voor goederen of voor de verlening van diensten te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161sexies
  - number: 161sexies.1.3°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daarvan levensgevaar
      voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161sexies
  - number: 161sexies.1.4°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161sexies
  - number: 161sexies.2
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie wordt gestraft hij die, met het
      oogmerk dat daarmee een misdrijf als bedoeld in het eerste lid wordt gepleegd:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161sexies
  - number: 161sexies.2.a
    text: |-
      een technisch hulpmiddel dat hoofdzakelijk geschikt gemaakt of ontworpen is tot het plegen van een zodanig
      misdrijf, vervaardigt, verkoopt, verwerft, invoert, verspreidt of anderszins ter beschikking stelt of voorhanden
      heeft, of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161sexies
  - number: 161sexies.2.b
    text: |-
      een computerwachtwoord, toegangscode of daarmee vergelijkbaar gegeven waardoor toegang kan worden verkregen tot
      een geautomatiseerd werk of een deel daarvan, verkoopt, verwerft, verspreidt of anderszins ter beschikking stelt of
      voorhanden heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161sexies
  - number: 161septies
    text: |-
      Hij aan wiens schuld te wijten is dat enig geautomatiseerd werk of enig werk voor telecommunicatie wordt vernield,
      beschadigd of onbruikbaar gemaakt, dat stoornis in de gang of in de werking van zodanig werk ontstaat, of dat een
      ten opzichte van zodanig werk genomen veiligheidsmaatregel wordt verijdeld, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161septies
  - number: 161septies.1°
    text: |-
      met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie, indien daardoor verhindering
      of bemoeilijking van de opslag, verwerking of overdracht van gegevens ten algemenen nutte, stoornis in een openbaar
      telecommunicatienetwerk of in de uitvoering van een openbare telecommunicatiedienst, of gemeen gevaar voor goederen
      of voor de verlening van diensten ontstaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161septies
  - number: 161septies.2°
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daardoor levensgevaar
      voor een ander ontstaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161septies
  - number: 161septies.3°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands dood
      ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel161septies
  - number: '162'
    text: |-
      Hij die opzettelijk enig werk dienende voor het openbaar verkeer of het luchtverkeer vernielt, onbruikbaar maakt
      of beschadigt, enige openbare land- of waterweg verspert of een ten aanzien van zodanig werk of van zodanige weg
      genomen veiligheidsmaatregel verijdelt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel162
  - number: 162.1°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor de
      veiligheid van het verkeer te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel162
  - number: 162.2°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor
      de veiligheid van het verkeer te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel162
  - number: 162a
    text: |-
      Hij die opzettelijk op een luchthaven een luchtvaartuig buiten bedrijf of enige voorziening vernielt, onbruikbaar
      maakt of beschadigt, dan wel de diensten op een luchthaven verstoort, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel162a
  - number: 162a.1°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor de
      veiligheid van de luchtvaart te duchten valt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel162a
  - number: 162a.2°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor
      de veiligheid van de luchtvaart te duchten valt en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel162a
  - number: '163'
    text: |-
      Hij aan wiens schuld te wijten is dat enig werk dienende voor het openbaar verkeer of het luchtverkeer wordt
      vernield, onbruikbaar gemaakt of beschadigd, enige openbare land- of waterweg versperd of een ten aanzien van
      zodanig werk of van zodanige weg genomen veiligheidsmaatregel verijdeld wordt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel163
  - number: 163.1°
    text: |-
      met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie, indien daardoor het verkeer
      onveilig wordt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel163
  - number: 163.2°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands dood
      ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel163
  - number: '164.1'
    text: |-
      Hij die opzettelijk gevaar veroorzaakt voor het verkeer door mechanische kracht over een spoorweg, wordt gestraft
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel164
  - number: '164.2'
    text: |-
      Indien het feit iemands dood ten gevolge heeft, wordt de schuldige gestraft met levenslange gevangenisstraf of
      tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel164
  - number: '165.1'
    text: |-
      Hij aan wiens schuld te wijten is dat gevaar ontstaat voor het verkeer door mechanische kracht over een spoorweg,
      wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel165
  - number: '165.2'
    text: |-
      Indien het feit iemands dood ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste
      twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel165
  - number: '166'
    text: |-
      Hij die opzettelijk een voor de veiligheid van de scheepvaart of luchtvaart gesteld teken of hulpmiddel vernielt,
      beschadigt, wegneemt of verplaatst, de werking daarvan verijdelt of een verkeerd teken stelt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel166
  - number: 166.1°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor
      de veiligheid van de scheepvaart of luchtvaart te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel166
  - number: 166.2°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor
      de veiligheid van de scheepvaart of luchtvaart te duchten is en het feit het zinken, stranden of verongelukken van
      een vaartuig of een luchtvaartuig ten gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel166
  - number: 166.3°
    text: |-
      met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie,
      indien daarvan gevaar voor de veiligheid van de scheepvaart of luchtvaart te duchten is en het feit iemands dood
      ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel166
  - number: '167'
    text: |-
      Hij aan wiens schuld vernieling, beschadiging, wegneming of verplaatsing van een voor de veiligheid van de
      scheepvaart of luchtvaart gesteld teken of hulpmiddel dan wel de verijdeling van de werking daarvan of het stellen
      van een verkeerd teken te wijten is, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel167
  - number: 167.1°
    text: |-
      met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie, indien daardoor de
      scheepvaart of de luchtvaart onveilig wordt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel167
  - number: 167.2°
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien het feit het zinken,
      stranden of verongelukken van een vaartuig of een luchtvaartuig ten gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel167
  - number: 167.3°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands dood
      ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel167
  - number: '168'
    text: |-
      Hij die enig vaartuig, voertuig of luchtvaartuig opzettelijk en wederrechtelijk doet zinken, stranden of
      verongelukken, vernielt, onbruikbaar maakt of beschadigt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel168
  - number: 168.1°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel168
  - number: 168.2°
    text: |-
      met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie,
      indien daarvan levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel168
  - number: '169'
    text: |-
      Hij aan wiens schuld te wijten is dat enig vaartuig, voertuig of luchtvaartuig zinkt, strandt of verongelukt,
      vernield, onbruikbaar gemaakt of beschadigd wordt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel169
  - number: 169.1°
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daardoor levensgevaar
      voor een ander ontstaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel169
  - number: 169.2°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands dood
      ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel169
  - number: '170'
    text: |-
      Hij die enig gebouw, getimmerte, installatie ter zee of voor het publiek toegankelijke plaats opzettelijk vernielt
      of beschadigt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel170
  - number: 170.1°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daarvan gemeen gevaar
      voor goederen te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel170
  - number: 170.2°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel170
  - number: 170.3°
    text: |-
      met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie,
      indien daarvan levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel170
  - number: '171'
    text: |-
      Hij aan wiens schuld de vernieling of beschadiging van enig gebouw, getimmerte, installatie ter zee of voor het
      publiek toegankelijke plaats te wijten is, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel171
  - number: 171.1°
    text: |-
      met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie, indien daardoor gemeen gevaar
      voor goederen ontstaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel171
  - number: 171.2°
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daardoor levensgevaar
      voor een ander ontstaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel171
  - number: 171.3°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands dood
      ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel171
  - number: '172.1'
    text: |-
      Hij die opzettelijk en wederrechtelijk een stof in een inrichting ten behoeve van de drinkwatervoorziening of in
      een tot gezamenlijk gebruik van of met anderen bestemde waterleiding brengt, dan wel de aanmaak van drinkwater in
      of de toevoer van drinkwater vanuit de openbare drinkwatervoorziening belemmert, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel172
  - number: 172.1.1°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor
      een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel172
  - number: 172.1.2°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel172
  - number: '172.2'
    text: |-
      Hij die opzettelijk enig voor de openbare drinkwatervoorziening bestemd werk vernielt, beschadigt of onbruikbaar
      maakt, stoornis in de gang of in de werking van zodanig werk veroorzaakt, of een ten opzichte van zodanig werk
      genomen veiligheidsmaatregel verijdelt, wordt, indien daardoor verhindering of bemoeilijking van de openbare
      drinkwatervoorziening te duchten is, gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel172
  - number: '173.1'
    text: |-
      Hij aan wiens schuld te wijten is, dat wederrechtelijk een stof in een inrichting ten behoeve van de
      drinkwatervoorziening of in een tot gezamenlijk gebruik van of met anderen bestemde waterleiding, wordt gebracht,
      wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel173
  - number: 173.1.1°
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daarvan gevaar voor de
      openbare gezondheid of levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel173
  - number: 173.1.2°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien daarvan levensgevaar
      voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel173
  - number: '173.2'
    text: |-
      Hij aan wiens schuld te wijten is, dat enig voor de openbare drinkwatervoorziening bestemd werk wordt vernield,
      beschadigd, of onbruikbaar gemaakt, dat stoornis in de gang of in de werking van een zodanig werk ontstaat of dat
      een ten opzichte van zodanig werk genomen veiligheidsmaatregel wordt verijdeld, wordt, indien daardoor verhindering
      of bemoeilijking van de openbare drinkwatervoorziening te duchten is, gestraft met een gevangenisstraf van ten
      hoogste zes maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel173
  - number: 173a
    text: |-
      Hij die opzettelijk en wederrechtelijk een stof op of in de bodem, in de lucht of in het oppervlaktewater brengt,
      wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel173a
  - number: 173a.1°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor
      de openbare gezondheid of levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel173a
  - number: 173a.2°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel173a
  - number: 173b
    text: |-
      Hij aan wiens schuld te wijten is, dat wederrechtelijk een stof op of in de bodem, in de lucht of in het
      oppervlaktewater wordt gebracht, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel173b
  - number: 173b.1°
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daarvan gevaar voor de
      openbare gezondheid of levensgevaar voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel173b
  - number: 173b.2°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien daarvan levensgevaar
      voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel173b
  - number: '174.1'
    text: |-
      Hij die waren verkoopt, te koop aanbiedt, aflevert of uitdeelt, wetende dat zij voor het leven of de gezondheid
      schadelijk zijn, en dat schadelijk karakter verzwijgende, wordt gestraft met gevangenisstraf van ten hoogste
      vijftien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel174
  - number: '174.2'
    text: |-
      Indien het feit iemands dood ten gevolge heeft, wordt de schuldige gestraft met levenslange gevangenisstraf of
      tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel174
  - number: '175.1'
    text: |-
      Hij aan wiens schuld te wijten is dat waren, schadelijk voor het leven of de gezondheid, verkocht, afgeleverd of
      uitgedeeld worden, zonder dat de koper of verkrijger met dat schadelijk karakter bekend is, wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel175
  - number: '175.2'
    text: |-
      Indien het feit iemands dood ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste
      twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel175
  - number: 175a
    text: |-
      Hij die in geval van oorlog opzettelijk een bekendgemaakt bevel, bedoeld in
      [artikel 7 van de Wet bescherming bevolking][ref1] (*Stb.* 1952, 404), dan wel een bij of krachtens een van de
      algemene maatregelen van bestuur, bedoeld in [artikel 29 van de Intrekkingswet BB][ref2] (*Stb.* 1986, 312),
      gegeven en bekendgemaakt voorschrift overtreedt, wordt gestraft:


      [ref1]: https://wetten.overheid.nl/BWBR0002096#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel29
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel175a
    references:
      - id: ref1
        bwb_id: BWBR0002096
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '29'
  - number: 175a.1°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vijfde categorie, indien daarvan gemeen gevaar
      voor goederen te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel175a
  - number: 175a.2°
    text: |-
      met gevangenisstraf van ten hoogste drie jaren of geldboete van de vijfde categorie, indien daarvan levensgevaar
      voor een ander te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel175a
  - number: 175a.3°
    text: |-
      met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vijfde categorie, indien daarvan levensgevaar
      voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel175a
  - number: 175b
    text: |-
      Hij aan wiens schuld in geval van oorlog overtreding te wijten is van een bekendgemaakt bevel, bedoeld in
      [artikel 7 van de Wet bescherming bevolking][ref1], dan wel van een bij of krachtens een van de algemene
      maatregelen van bestuur, bedoeld in [artikel 29 van de Intrekkingswet BB][ref2], gegeven en bekendgemaakt
      voorschrift, wordt gestraft:


      [ref1]: https://wetten.overheid.nl/BWBR0002096#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel29
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel175b
    references:
      - id: ref1
        bwb_id: BWBR0002096
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '29'
  - number: 175b.1°
    text: |-
      met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie, indien daardoor gemeen gevaar
      voor goederen ontstaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel175b
  - number: 175b.2°
    text: |-
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daardoor levensgevaar
      voor een ander ontstaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel175b
  - number: 175b.3°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands dood
      ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel175b
  - number: '176.1'
    text: |-
      Bij veroordeling wegens enig in deze titel omschreven misdrijf kan de schuldige worden ontzet van de uitoefening
      van het beroep waarin hij het misdrijf begaan heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel176
  - number: '176.2'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 174][ref1] en [175][ref2] omschreven misdrijven, kan de rechter de
      openbaarmaking van zijn uitspraak gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel174
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel175
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '174'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '175'
  - number: 176a
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 157][ref1], [159][ref2], [160][ref3], [161][ref4],
      [161bis][ref5], [161quater][ref6], [161sexies][ref7], [162][ref8], [162a][ref9], [164][ref10], [166][ref11],
      [168][ref12], [170][ref13], [172][ref14], [173a][ref15] of [174][ref16], is begaan met een terroristisch oogmerk,
      wordt de in dat artikel bepaalde tijdelijke gevangenisstraf met de helft verhoogd en wordt, indien op het misdrijf
      een tijdelijke gevangenisstraf van ten hoogste vijftien jaren is gesteld, levenslange gevangenisstraf of tijdelijke
      van ten hoogste dertig jaren opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel159
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel160
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel161
