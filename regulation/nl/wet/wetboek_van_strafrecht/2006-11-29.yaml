        artikel: 173a
      - id: ref16
        bwb_id: BWBR0001854
        artikel: '174'
  - number: 176b.1
    text: |-
      De samenspanning tot de in de [artikelen 157][ref1], [161, onderdelen 2° en 3°][ref2],
      [161bis, onderdelen 3° en 4°][ref3], [161quater][ref4], [161 sexies, onderdelen 3° en 4°][ref5], [162][ref6],
      [164][ref7], [166][ref8], [168][ref9], [170][ref10], [172][ref11], [173a][ref12] en [174][ref13] omschreven
      misdrijven, te begaan met een terroristisch oogmerk, wordt gestraft met gevangenisstraf van ten hoogste tien jaren
      of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel161
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel161bis
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel161quater
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel161sexies
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel162
