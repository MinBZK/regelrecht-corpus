  - number: '5.1'
    text: 'De Nederlandse strafwet is toepasselijk op de Nederlander die zich buiten Nederland schuldig maakt:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel5
  - number: 5.1.1°
    text: |-
      aan een der misdrijven omschreven in de [Titels I][ref1] en [II van het Tweede Boek][ref2], en in de
      [artikelen 197a][ref3], [197b][ref4], [197c][ref5], [206][ref6], [237][ref7],[272][ref8] en [273][ref9] alsmede
      – voor zover het betreft een misdrijf, gericht tegen de rechtspleging van het Internationaal Strafhof, als
      bedoeld in artikel 70, eerste lid, van het op 17 juli 1998 te Rome tot stand gekomen Statuut van Rome inzake het
      Internationale Strafhof (Trb. 2000, 120) – in de [artikelen 177][ref10], [177a][ref11], [178][ref12], [179][ref13],
      [180][ref14], [189][ref15], [200][ref16], [207a][ref17], [285a][ref18] en [361][ref19];


