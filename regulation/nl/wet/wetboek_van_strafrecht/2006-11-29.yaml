  - number: 176b.2
    text: |-
      [Artikel 96, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel96
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel176b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '96'
  - number: '177.1'
    text: 'Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel177
  - number: 177.1.1°
    text: |-
      hij die een ambtenaar een gift of belofte doet dan wel een dienst verleent of aanbiedt met het oogmerk om hem te
      bewegen in zijn bediening, in strijd met zijn plicht, iets te doen of na te laten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel177
  - number: 177.1.2°
    text: |-
      hij die een ambtenaar een gift of belofte doet dan wel een dienst verleent of aanbiedt ten gevolge of naar
      aanleiding van hetgeen door deze in zijn huidige of vroegere bediening, in strijd met zijn plicht, is gedaan of
      nagelaten.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel177
  - number: '177.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die een feit als in het eerste lid, onder 1°, omschreven, begaat jegens een
      persoon in het vooruitzicht van een aanstelling als ambtenaar, indien de aanstelling als ambtenaar is gevolgd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel177
  - number: '177.3'
    text: |-
      Ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten kan worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel177
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 177a.1
    text: 'Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel177a
  - number: 177a.1.1°
    text: |-
      hij die een ambtenaar een gift of belofte doet dan wel een dienst verleent of aanbiedt met het oogmerk om hem te
      bewegen in zijn bediening, zonder daardoor in strijd met zijn plicht te handelen, iets te doen of na te laten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel177a
  - number: 177a.1.2°
    text: |-
      hij die een ambtenaar een gift of belofte doet dan wel een dienst verleent of aanbiedt ten gevolge of naar
      aanleiding van hetgeen door deze in zijn huidige of vroegere bediening, zonder daardoor in strijd met zijn plicht
      te handelen, is gedaan of nagelaten.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel177a
  - number: 177a.2
    text: |-
      Met dezelfde straf wordt gestraft hij die een feit als in het eerste lid, onder 1°, omschreven, begaat jegens een
      persoon in het vooruitzicht van een aanstelling als ambtenaar, indien de aanstelling van ambtenaar is gevolgd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel177a
  - number: 177a.3
    text: |-
      Ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten kan worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel177a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '178.1'
    text: |-
      Hij die een rechter een gift of belofte doet dan wel een dienst verleent of aanbiedt met het oogmerk invloed uit
      te oefenen op de beslissing van een aan diens oordeel onderworpen zaak, wordt gestraft met gevangenisstraf van ten
      hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel178
  - number: '178.2'
    text: |-
      Indien die gift of belofte gedaan wordt dan wel die dienst verleend of aangeboden wordt met het oogmerk om een
      veroordeling in een strafzaak te verkrijgen, wordt de schuldige gestraft met gevangenisstraf van ten hoogste negen
      jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel178
  - number: '178.3'
    text: |-
      Ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten kan worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 178a.1
    text: |-
      Met ambtenaren worden ten aanzien van [de artikelen 177][ref1] en [177a][ref2] gelijkgesteld personen in de
      openbare dienst van een vreemde staat of van een volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel177
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel177a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '177'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 177a
  - number: 178a.2
    text: |-
      Met ambtenaren worden ten aanzien van de [artikelen 177, eerste lid, onder 2°][ref1], en
      [177a, eerste lid, onder 2°][ref2], voormalige ambtenaren gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel177
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel177a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '177'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 177a
  - number: 178a.3
    text: |-
      Met rechter wordt ten aanzien van [artikel 178][ref1] gelijkgesteld de rechter van een vreemde staat of van een
      volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel178
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '178'
  - number: '179'
    text: |-
      Hij die door geweld of enige andere feitelijkheid of bedreiging met geweld of enige andere feitelijkheid een
      ambtenaar dwingt tot het volvoeren van een ambtsverrichting of het nalaten van een rechtmatige ambtsverrichting,
      wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel179
  - number: '180'
    text: |-
      Hij die zich met geweld of bedreiging met geweld verzet tegen een ambtenaar werkzaam in de rechtmatige uitoefening
      van zijn bediening, of tegen personen die hem daarbij krachtens wettelijke verplichting of op zijn verzoek
      bijstand verlenen, wordt als schuldig aan wederspannigheid gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel180
  - number: '181'
    text: |-
      De dwang en de wederspannigheid in de [artikelen 179][ref1] en [180][ref2] omschreven worden gestraft:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel180
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '180'
  - number: 181.1°
    text: |-
      met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vierde categorie, indien het misdrijf of de
      daarmede gepaard gaande feitelijkheden enig lichamelijk letsel ten gevolge hebben;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel181
  - number: 181.2°
    text: |-
      met gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van de vijfde categorie, indien zij
      zwaar lichamelijk letsel ten gevolge hebben;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel181
  - number: 181.3°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien zij de dood ten
      gevolge hebben.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel181
  - number: '182.1'
    text: |-
      De dwang en de wederspannigheid in de [artikelen 179][ref1] en [180][ref2] omschreven, door twee of meer personen
      met verenigde krachten gepleegd, worden gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel180
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '180'
  - number: '182.2'
    text: 'De schuldige wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel182
  - number: 182.2.1°
    text: |-
      met gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van de vijfde categorie, indien het
      door hem gepleegde misdrijf of de daarbij door hem gepleegde feitelijkheden enig lichamelijk letsel ten gevolge
      hebben;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel182
  - number: 182.2.2°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien zij zwaar lichamelijk
      letsel ten gevolge hebben;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel182
  - number: 182.2.3°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien zij de dood ten
      gevolge hebben.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel182
  - number: '183'
    text: |-
      Met ambtenaren worden ten aanzien van de [artikelen 179 tot en met 182][ref1] gelijkgesteld de schipper of
      gezagvoerder van een luchtvaartuig die een bevoegdheid uitoefent of een verplichting vervult welke hem als zodanig
      is toegekend of opgelegd bij een bepaling van het [Wetboek van Strafvordering][ref2]. Onder schipper wordt begrepen
      hij die het hoogste gezag uitoefent op een overeenkomstig [artikel 136][ref3] aangewezen installatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001903
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel136a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001903
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 136a
  - number: '184.1'
    text: |-
      Hij die opzettelijk niet voldoet aan een bevel of een vordering, krachtens wettelijk voorschrift gedaan door een
      ambtenaar met de uitoefening van enig toezicht belast of door een ambtenaar belast met of bevoegd verklaard tot
      het opsporen of onderzoeken van strafbare feiten, alsmede hij die opzettelijk enige handeling, door een van die
      ambtenaren ondernomen ter uitvoering van enig wettelijk voorschrift, belet, belemmert of verijdelt, wordt gestraft
      met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel184
  - number: '184.2'
    text: |-
      Met de in het eerste gedeelte van het vorige lid bedoelde ambtenaar wordt gelijkgesteld ieder die, krachtens
      wettelijk voorschrift, voortdurend of tijdelijk met enige openbare dienst is belast.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel184
  - number: '184.3'
    text: |-
      Met een vordering of handeling als bedoeld in het eerste lid wordt gelijkgesteld een vordering of handeling van
      de schipper of gezagvoerder van een luchtvaartuig die een bevoegdheid uitoefent of een verplichting vervult,
      welke hem als zodanig is toegekend of opgelegd bij een bepaling van het [Wetboek van Strafvordering][ref1]. Onder
      schipper wordt begrepen hij die het hoogste gezag uitoefent op een overeenkomstig [artikel 136][ref2] aangewezen
      installatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel136a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 136a
  - number: '184.4'
    text: |-
      Indien tijdens het plegen van het misdrijf nog geen twee jaren zijn verlopen sedert een vroegere veroordeling
      van de schuldige wegens gelijk misdrijf onherroepelijk is geworden, kan de gevangenisstraf met een derde worden
      verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel184
  - number: '185'
    text: |-
      Hij die bij een terechtzitting of ter plaatse waar een ambtenaar in het openbaar in de rechtmatige uitoefening
      van zijn bediening werkzaam is, opschudding veroorzaakt en na het door of vanwege het bevoegd gezag gegeven bevel
      zich niet verwijdert, wordt gestraft met gevangenisstraf van ten hoogste twee weken of geldboete van de tweede
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel185
  - number: 185a
    text: |-
      Met ambtenaren worden ten aanzien van de [artikelen 179 tot en met 182][ref1], [184][ref2] en [185][ref3]
      gelijkgesteld personen in de openbare dienst van een vreemde staat of van een volkenrechtelijke organisatie die in
      Nederland op door het volkenrecht toegelaten wijze hun bediening uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel184
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel185
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel185a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '184'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '185'
  - number: '186'
    text: |-
      Hij die opzettelijk bij gelegenheid van een volksoploop zich niet onmiddellijk verwijdert na het derde door
      of vanwege het bevoegd gezag gegeven bevel, wordt, als schuldig aan deelneming aan samenscholing, gestraft met
      gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel186
  - number: '187'
    text: |-
      Hij die een bekendmaking, vanwege het bevoegd gezag in het openbaar gedaan, wederrechtelijk afscheurt, onleesbaar
      maakt of beschadigt, met het oogmerk om de kennisneming daarvan te beletten of te bemoeilijken, wordt gestraft met
      gevangenisstraf van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel187
  - number: '188'
    text: |-
      Hij die aangifte of klacht doet dat een strafbaar feit gepleegd is, wetende dat het niet gepleegd is, wordt
      gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel188
  - number: '189.1'
    text: 'Met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel189
  - number: 189.1.1°
    text: |-
      hij die opzettelijk iemand die schuldig is aan of vervolgd wordt ter zake van enig misdrijf, verbergt of hem
      behulpzaam is in het ontkomen aan de nasporing van of aanhouding door de ambtenaren van de justitie of politie;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel189
  - number: 189.1.2°
    text: |-
      hij die nadat enig misdrijf is gepleegd, met het oogmerk om het te bedekken of de nasporing of vervolging te
      beletten of te bemoeilijken, voorwerpen waarop of waarmede het misdrijf gepleegd is of andere sporen van het
      misdrijf vernietigt, wegmaakt, verbergt of aan het onderzoek van de ambtenaren van de justitie of politie onttrekt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel189
  - number: 189.1.3°
    text: |-
      hij die opzettelijk voorwerpen die kunnen dienen om de waarheid aan de dag te brengen of om wederrechtelijk
      verkregen voordeel als bedoeld in [artikel 36][ref1] aan te tonen, met het oogmerk om de inbeslagneming daarvan te
      beletten, te belemmeren of te verijdelen, verbergt, vernietigt, wegmaakt of aan het onderzoek van de ambtenaren van
      de justitie of politie onttrekt, dan wel door het opzettelijk verstrekken van gegevens of inlichtingen aan derden
      die inbeslagneming belet, belemmert of verijdelt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36e
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 36e
        afdeling: Eerste
  - number: '189.2'
    text: |-
      Deze bepalingen zijn niet van toepassing op hem die de daarin vermelde handelingen verricht ten einde gevaar van
      vervolging te ontgaan of af te wenden van een van zijn bloedverwanten of aangehuwden in de rechte linie of in de
      tweede of derde graad van de zijlinie of van zijn echtgenoot of gewezen echtgenoot.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel189
  - number: '189.3'
    text: |-
      Met ambtenaren van de justitie of politie worden gelijkgesteld: personen in de openbare dienst van een
      internationaal gerecht dat zijn rechtsmacht ontleent aan een verdrag waarbij het Koninkrijk partij is, die belast
      zijn met de opsporing of vervolging van enig misdrijf.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel189
  - number: '190'
    text: |-
      Hij die opzettelijk een gerechtelijke lijkschouwing belet, belemmert of verijdelt, wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel190
  - number: '191'
    text: |-
      Hij die opzettelijk iemand, op openbaar gezag of krachtens rechterlijke uitspraak of beschikking van de vrijheid
      berooft, bevrijdt of bij zijn zelfbevrijding behulpzaam is, wordt gestraft met gevangenisstraf van ten hoogste vier
      jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel191
  - number: '192.1'
    text: |-
      Hij die, wettelijk als getuige, als deskundige of als tolk opgeroepen, opzettelijk niet voldoet aan enige
      wettelijke verplichting die hij als zodanig te vervullen heeft, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel192
  - number: 192.1.1°
    text: in strafzaken met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel192
  - number: 192.1.2°
    text: in andere zaken met gevangenisstraf van ten hoogste vier maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel192
  - number: '192.2'
    text: |-
      Hij die na de totstandkoming van een afspraak met de officier van justitie ingevolge
      [artikel 226h, derde lid][ref1], of [artikel 226k, eerste lid, van het Wetboek van Strafvordering][ref2]
      wettelijk als getuige opgeroepen, opzettelijk niet voldoet aan zijn verplichting te verklaren, wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel226h
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel226k
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 226h
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 226k
  - number: '192.3'
    text: |-
      Het bepaalde in het vorige lid van dit artikel is niet van toepassing op de partij in een burgerlijke procedure
      die, wanneer zij als getuige wordt gehoord, weigert op de haar gestelde vragen te antwoorden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel192
  - number: 192a
    text: |-
      Hij die opzettelijk niet voldoet aan de vordering van een parlementaire enquêtecommissie tot het hebben van inzage
      in of het nemen van afschrift van bescheiden wordt gestraft met gevangenisstraf van ten hoogste vier maanden of
      geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel192a
  - number: '193'
    text: |-
      Hij die opzettelijk niet voldoet aan een wettig bevel tot overlegging van een stuk hetwelk beweerd wordt vals of
      vervalst te zijn, of hetwelk dienen moet ter vergelijking met een ander waarvan de valsheid of vervalsing beweerd,
      of de echtheid ontkend of niet erkend wordt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel193
  - number: 193.1°
    text: in strafzaken met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel193
  - number: 193.2°
    text: in andere zaken met gevangenisstraf van ten hoogste vier maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel193
  - number: '194.1'
    text: |-
      Hij die, in staat van faillissement verklaard of als echtgenoot van een gefailleerde met wie hij in gemeenschap van
      goederen is gehuwd, of als bestuurder of commissaris van een rechtspersoon, wettelijk opgeroepen tot het geven van
      inlichtingen, hetzij zonder geldige reden opzettelijk wegblijft, hetzij weigert de vereiste inlichtingen te geven,
      hetzij opzettelijk verkeerde inlichtingen geeft, wordt gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel194
  - number: '194.2'
    text: |-
      Terzake van het feit, bedoeld in het eerste lid, wordt met dezelfde straf gestraft hij, ten aanzien van wie of
      ten aanzien van wiens echtgenoot met wie hij in gemeenschap van goederen is gehuwd, de schuldsaneringsregeling
      natuurlijke personen van toepassing is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel194
  - number: '195'
    text: |-
      Hij die een recht uitoefent, wetende dat hij daarvan bij rechterlijke uitspraak is ontzet, wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel195
  - number: '196'
    text: |-
      Hij die opzettelijk onderscheidingstekens draagt of een daad verricht behorende tot een ambt dat hij niet bekleedt
      of waarin hij geschorst is, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de
      tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel196
  - number: '197'
    text: |-
      Een vreemdeling die in Nederland verblijft, terwijl hij weet of ernstige reden heeft te vermoeden, dat hij op grond
      van een wettelijk voorschrift tot ongewenste vreemdeling is verklaard, wordt gestraft met een gevangenisstraf van
      ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel197
  - number: 197a.1
    text: |-
      Hij die een ander behulpzaam is bij het zich verschaffen van toegang tot of doorreis door Nederland, een andere
      lidstaat van de Europese Unie, IJsland, Noorwegen of een staat die is toegetreden tot het op 15 november 2000
      te NewYork totstandgekomen Protocol tegen de smokkel van migranten over land, over de zee en in de lucht, tot
      aanvulling van het op 15 november 2000 te NewYork totstandgekomen Verdrag tegen transnationale georganiseerde
      misdaad, of hem daartoe gelegenheid, middelen of inlichtingen verschaft, terwijl hij weet of ernstige redenen heeft
      te vermoeden dat die toegang of doorreis wederrechtelijk is, wordt als schuldig aan mensensmokkel gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel197a
  - number: 197a.2
    text: |-
      Hij die een ander uit winstbejag behulpzaam is bij het zich verschaffen van verblijf in Nederland, een andere
      lidstaat van de Europese Unie, IJsland, Noorwegen of een staat die is toegetreden tot het in het eerste lid
      genoemde protocol, of hem daartoe gelegenheid, middelen of inlichtingen verschaft, terwijl hij weet of ernstige
      redenen heeft te vermoeden dat dat verblijf wederrechtelijk is, wordt gestraft met een gevangenisstraf van ten
      hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel197a
  - number: 197a.3
    text: |-
      Indien een van de feiten, omschreven in het eerste en tweede lid, wordt begaan in de uitoefening van enig ambt
      of beroep, wordt gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie opgelegd en kan
      ontzetting worden uitgesproken van de uitoefening van het recht het ambt te bekleden of het beroep uit te oefenen
      en kan de rechter openbaarmaking van zijn uitspraak gelasten.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel197a
  - number: 197a.4
    text: |-
      Indien een van de feiten, omschreven in het eerste en tweede lid, wordt begaan door een persoon die daarvan een
      beroep of gewoonte maakt of in vereniging wordt begaan door meerdere personen, wordt gevangenisstraf van ten
      hoogste acht jaren of geldboete van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel197a
  - number: 197a.5
    text: |-
      Indien een van de feiten, omschreven in het eerste en tweede lid, zwaar lichamelijk letsel ten gevolge heeft of
      daarvan levensgevaar voor een ander te duchten is, wordt gevangenisstraf van ten hoogste twaalf jaren of geldboete
      van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel197a
  - number: 197a.6
    text: |-
      Indien een van de feiten, omschreven in het eerste en tweede lid, de dood ten gevolge heeft, wordt een
      gevangenisstraf van het hoogste vijftien jaren of geldboete van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel197a
  - number: 197b
    text: |-
      Hij die een ander, die zich wederrechtelijk toegang tot of verblijf in Nederland heeft verschaft, krachtens
      overeenkomst of aanstelling arbeid doet verrichten, terwijl hij weet of ernstige redenen heeft om te vermoeden dat
      de toegang of dat verblijf wederrechtelijk is, wordt gestraft met een gevangenisstraf van ten hoogste een jaar of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel197b
  - number: 197c
    text: |-
      Hij die van het in [artikel 197b][ref1] omschreven feit een beroep of gewoonte maakt wordt gestraft met een
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel197b
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel197c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 197b
  - number: 197d
    text: |-
      Indien de schuldige de in de [artikelen 197b][ref1] of [197c][ref2] omschreven feiten begaat in de uitoefening van
      enig ambt of beroep kan de rechter tevens de ontzetting uitspreken van de uitoefening van het recht het ambt te
      bekleden of het beroep uit te oefenen en de openbaarmaking van zijn uitspraak gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel197b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel197c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel197d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 197b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 197c
  - number: '198.1'
    text: |-
      Hij die opzettelijk enig goed aan het krachtens de wet daarop gelegd beslag of aan een gerechtelijke bewaring
      onttrekt of, wetende dat het daaraan onttrokken is, verbergt, wordt gestraft met gevangenisstraf van ten hoogste
      vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel198
  - number: '198.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die opzettelijk enig krachtens de wet in beslag genomen goed vernielt,
      beschadigt of onbruikbaar maakt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel198
  - number: '198.3'
    text: |-
      Met dezelfde straf wordt gestraft de bewaarder die opzettelijk een van deze feiten pleegt of toelaat, of de dader
      als medeplichtige ter zijde staat.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel198
  - number: '199.1'
    text: |-
      Hij die opzettelijk zegels waarmede voorwerpen door of vanwege het bevoegd openbaar gezag verzegeld zijn,
      verbreekt, opheft of beschadigt, of de door zodanig zegel bewerkte afsluiting op andere wijze verijdelt, wordt
      gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel199
  - number: '199.2'
    text: |-
      De bewaarder die opzettelijk het feit pleegt of toelaat of de dader als medeplichtige ter zijde staat wordt
      gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel199
  - number: '199.3'
    text: |-
      Indien het feit ten gevolge van onachtzaamheid van de bewaarder gepleegd is, wordt deze gestraft met hechtenis van
      ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel199
  - number: '200.1'
    text: |-
      Hij die opzettelijk zaken, bestemd om voor de bevoegde macht tot overtuiging of bewijs te dienen, akten, bescheiden
      of registers die voortdurend of tijdelijk op openbaar gezag bewaard worden, of hetzij aan een ambtenaar, hetzij aan
      een ander in het belang van de openbare dienst zijn ter hand gesteld, vernielt, beschadigt, onbruikbaar maakt of
      wegmaakt, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel200
  - number: '200.2'
    text: |-
      Onder bevoegde macht wordt mede verstaan: een internationaal gerecht dat zijn rechtsmacht ontleent aan een verdrag
      waarbij het Koninkrijk partij is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel200
  - number: '201'
    text: |-
      Hij die opzettelijk brieven of andere stukken, aan een post- of telegraafkantoor bezorgd of in een postbus
      gestoken, aan hun bestemming onttrekt, opent of beschadigt, wordt gestraft met gevangenisstraf van ten hoogste een
      jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel201
  - number: '202'
    text: |-
      Indien de schuldige aan een der in de [artikelen 198-201][ref1] omschreven misdrijven zich de toegang tot de plaats
      van het misdrijf verschaft of het goed onder zijn bereik brengt door middel van braak, verbreking of inklimming,
      van valse sleutels, van een valse order of een vals kostuum, kan de straf met ten hoogste een jaar gevangenisstraf
      worden verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel198
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '198'
  - number: '203'
    text: |-
      Hij die in tijd van vrede opzettelijk desertie van een krijgsman in dienst van het Rijk uitlokt door een der in
      [artikel 47, eerste lid, onder 2°][ref1], vermelde middelen, of bevordert op enige in [artikel 48][ref2] vermelde
      wijze, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel48
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '48'
  - number: '204'
    text: |-
      Hij die, in tijd van vrede, opzettelijk oproer of muiterij van krijgslieden, in dienst van het Rijk, uitlokt
      door een der in [artikel 47, eerste lid, onder 2°][ref1], vermelde middelen, of bevordert op enige in
      [artikel 48][ref2] vermelde wijze, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel48
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '48'
  - number: '205'
    text: |-
      Hij die, zonder toestemming van de Koning, iemand voor vreemde krijgsdienst of gewapende strijd werft, wordt
      gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel205
  - number: '206.1'
    text: 'Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel206
  - number: 206.1.1°
    text: |-
      hij die zich opzettelijk voor de dienst bij de krijgsmacht dan wel voor enige werkzaamheid uit hoofde van
      burgerdienstplicht ongeschikt maakt of laat maken;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel206
  - number: 206.1.2°
    text: hij die een ander op diens verzoek opzettelijk voor die dienst dan wel voor zodanige werkzaamheid ongeschikt maakt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel206
  - number: '206.2'
    text: |-
      Indien in het laatste geval het feit de dood ten gevolge heeft, wordt gevangenisstraf van ten hoogste zes jaren of
      geldboete van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel206
  - number: '207.1'
    text: |-
      Hij die in de gevallen waarin een wettelijk voorschrift een verklaring onder ede vordert of daaraan rechtsgevolgen
      verbindt, mondeling of schriftelijk, persoonlijk of door een bijzonder daartoe gemachtigde, opzettelijk een valse
      verklaring onder ede aflegt, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel207
  - number: '207.2'
    text: |-
      Indien de valse verklaring is afgelegd in een strafzaak ten nadele van de beklaagde of verdachte, wordt de
      schuldige gestraft met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel207
  - number: '207.3'
    text: Met de eed staat gelijk de belofte of bevestiging die krachtens de wet voor de eed in de plaats treedt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel207
  - number: '207.4'
    text: |-
      Ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten kan worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 207a.1
    text: |-
      Hij die in de gevallen waarin door of krachtens een verdrag waarbij het Koninkrijk partij is, een verklaring onder
      ede of onder een daarvoor in de plaats tredende bevestiging of belofte wordt gevorderd, voor een internationaal
      gerecht mondeling of schriftelijk, persoonlijk of door een bijzonder daartoe gemachtigde, opzettelijk een valse
      verklaring in die vorm aflegt, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel207a
  - number: 207a.2
    text: |-
      De [leden 2 en 4 van artikel 207][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel207
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel207a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '207'
  - number: 207b.1
    text: |-
      Hij die in de gevallen waarin door of krachtens een verdrag een verklaring onder ede of onder een daarvoor in de
      plaats tredende bevestiging of belofte wordt gevorderd, in Nederland, per videoconferentie, voor een rechterlijke
      autoriteit van een andere staat mondeling, persoonlijk, opzettelijk een valse verklaring aflegt, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel207b
  - number: 207b.2
    text: |-
      [Artikel 207, tweede en vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel207
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel207b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '207'
  - number: 207b.3
    text: |-
      Geen vervolging vindt plaats dan op klacht van de rechterlijke autoriteit voor wie de valse verklaring werd
      afgelegd. [Artikel 66][ref1] blijft met betrekking tot de in dit lid bedoelde klacht buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel66
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel207b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '66'
  - number: '208'
    text: |-
      Hij die muntspeciën of munt- of bankbiljetten namaakt of vervalst, met het oogmerk om die muntspeciën of munt- of
      bankbiljetten als echt en onvervalst uit te geven of te doen uitgeven, wordt gestraft met gevangenisstraf van ten
      hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel208
  - number: '209'
    text: |-
      Hij die opzettelijk als echte en onvervalste muntspeciën of munt- of bankbiljetten uitgeeft muntspeciën of munt-
      of bankbiljetten die hij zelf heeft nagemaakt of vervalst of waarvan de valsheid of vervalsing hem, toen hij
      ze ontving, bekend was, of deze, met het oogmerk om ze als echt en onvervalst uit te geven of te doen uitgeven,
      ontvangt, zich verschaft, in voorraad heeft, vervoert, invoert, doorvoert of uitvoert, wordt gestraft met
      gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel209
  - number: '210'
    text: |-
      Hij die opzettelijk en wederrechtelijk muntspeciën of munt- of bankbiljetten welke bestemd zijn om als wettig
      betaalmiddel in omloop te worden gebracht, in omloop brengt of, teneinde ze in omloop te brengen, ontvangt, zich
      verschaft, in voorraad heeft, vervoert, invoert, doorvoert of uitvoert, wordt gestraft met een gevangenisstraf van
      ten hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel210
  - number: '213'
    text: |-
      Hij die opzettelijk valse of vervalste muntspeciën of valse of vervalste munt- of bankbiljetten uitgeeft, wordt,
      behoudens [artikel 209][ref1], gestraft met gevangenisstraf van ten hoogste vier jaar of geldboete van de vierde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel209
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '209'
  - number: '214'
    text: |-
      Hij die stoffen, voorwerpen of gegevens vervaardigt, ontvangt, zich verschaft of voorhanden heeft waarvan hij weet
      dat zij bestemd zijn tot het namaken of vervalsen van muntspeciën of van munt- of bankbiljetten, wordt gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel214
  - number: 214bis
    text: 'Bij veroordeling wegens een der in deze titel omschreven misdrijven worden:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel214bis
  - number: 214bis.1°
    text: de valse of vervalste muntspeciën;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel214bis
  - number: 214bis.2°
    text: de valse of vervalste munt- of bankbiljetten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel214bis
  - number: 214bis.3°
    text: |-
      de stoffen, voorwerpen of gegevens, uit hun aard bestemd tot het namaken of vervalsen van muntspeciën of van munt-
      of bankbiljetten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel214bis
  - number: '215'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 208 tot en met 210][ref1] omschreven misdrijven, kan ontzetting
      van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref2], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel208
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '208'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '216.1'
    text: 'Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel216
  - number: 216.1.1°
    text: |-
      hij die van rijkswege uitgegeven zegels namaakt of vervalst, met het oogmerk om die zegels als echt en onvervalst
      te gebruiken of door anderen te doen gebruiken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel216
  - number: 216.1.2°
    text: hij die, met gelijk oogmerk, zodanige zegels vervaardigt door wederrechtelijk gebruik te maken van echte stempels.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel216
  - number: '216.2'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing op zegels die worden uitgegeven krachtens
      [artikel 2a, tweede lid, onder b, van de Postwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 2a
  - number: '217'
    text: 'Met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vijfde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel217
  - number: 217.1°
    text: |-
      hij die op platina, gouden of zilveren werken valse rijksmerken of door de wet vereiste meestertekens plaatst
      of echte vervalst, met het oogmerk om die werken te gebruiken of door anderen te doen gebruiken alsof de daarop
      geplaatste merken of tekens echt en onvervalst waren;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel217
  - number: 217.2°
    text: |-
      hij die, met gelijk oogmerk, op de bedoelde werken merken of tekens plaatst door wederrechtelijk gebruik te maken
      van echte stempels;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel217
  - number: 217.3°
    text: |-
      hij die echte rijksmerken of door de wet vereiste meestertekens inzet, aanvoegt of overbrengt in, aan of op andere
      platina, gouden of zilveren werken dan die waaraan zij oorspronkelijk zijn aangebracht, met het oogmerk om die
      werken te gebruiken of door anderen te doen gebruiken alsof de bedoelde merken of tekens oorspronkelijk daarop
      waren geplaatst.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel217
  - number: '218'
    text: 'Met gevangenisstraf van ten hoogste drie jaren of geldboete van de vijfde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel218
  - number: 218.1°
    text: |-
      hij die op aan een metrologische overeenstemmingsbeoordeling onderworpen voorwerpen valse metrologische merken
      plaatst of echte vervalst, met het oogmerk om die voorwerpen te gebruiken of door anderen te doen gebruiken alsof
      de daarop geplaatste merken echt en onvervalst waren;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel218
  - number: 218.2°
    text: |-
      hij die, met gelijk oogmerk, op de bedoelde voorwerpen merken plaatst door wederrechtelijk gebruik te maken van
      echte stempels.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel218
  - number: '219'
    text: 'Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vijfde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel219
  - number: 219.1°
    text: |-
      hij die andere dan de in de [artikelen 217][ref1] en [218][ref2] bedoelde merken, die krachtens wettelijk
      voorschrift op goederen of hun verpakking moeten of kunnen worden geplaatst, daarop valselijk plaatst of echte
      vervalst, met het oogmerk om die goederen te gebruiken of door anderen te doen gebruiken alsof de daarop geplaatste
      merken echt en onvervalst waren;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel217
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel218
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '217'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '218'
  - number: 219.2°
    text: |-
      hij die, met gelijk oogmerk, op de bedoelde goederen of hun verpakking merken plaatst door wederrechtelijk gebruik
      te maken van echte stempels;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel219
  - number: 219.3°
    text: |-
      hij die echte merken gebruikt voor goederen of hun verpakking waarvoor die merken niet bestemd zijn, met het
      oogmerk om die goederen te gebruiken of door anderen te doen gebruiken alsof de bedoelde merken daarvoor bestemd
      waren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel219
  - number: '220'
    text: |-
      Hij die opzettelijk valse, vervalste of wederrechtelijk vervaardigde zegels, tekens of merken, of de voorwerpen
      waaraan zij wederrechtelijk verbonden zijn, gebruikt, verkoopt, te koop aanbiedt, aflevert, ten verkoop in voorraad
      heeft of binnen het Rijk in Europa invoert, als waren die zegels, tekens of merken echt en onvervalst en niet
      wederrechtelijk vervaardigd of wederrechtelijk aan de voorwerpen verbonden, wordt gestraft met dezelfde straffen
      als in de [artikelen 216-219][ref1] zijn bepaald, naar de daar gemaakte onderscheidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel216
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '216'
  - number: '221.1'
    text: |-
      Hij die aan een metrologische overeenstemmingsbeoordeling onderworpen voorwerpen ontdoet van het daarop geplaatste
      afkeuringsmerk, met het oogmerk om die voorwerpen te gebruiken of door anderen te doen gebruiken als waren zij niet
      afgekeurd, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel221
  - number: '221.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die opzettelijk deze van het afkeuringsmerk ontdane voorwerpen gebruikt,
      verkoopt, te koop aanbiedt, aflevert of ten verkoop in voorraad heeft, als waren zij niet afgekeurd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel221
  - number: '222.1'
    text: |-
      Hij die van zegels als bedoeld in [artikel 216][ref1] welke reeds tot gebruik hebben gediend ontdoet van het merk
      bestemd om ze voor verder gebruik ongeschikt te maken, met het oogmerk om die zegels te gebruiken of door anderen
      te doen gebruiken als waren zij nog niet gebruikt, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of
      geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel216
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '216'
  - number: '222.2'
    text: |-
      Met dezelfde straffen wordt gestraft hij die opzettelijk deze van dat merk ontdane zegels gebruikt, verkoopt, te
      koop aanbiedt, aflevert, ten verkoop in voorraad heeft of binnen het Rijk in Europa invoert, als waren zij nog
      niet gebruikt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel222
  - number: 222bis
    text: |-
      De bepalingen van de [artikelen 216][ref1], [219][ref2], [220][ref3] en [222][ref4] zijn naar de daar gemaakte
      onderscheidingen mede van toepassing, indien de daarin omschreven feiten worden gepleegd met betrekking tot zegels
      of merken van de Nederlandse Antillen, Aruba, een buitenlandse mogendheid of een volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel216
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel219
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel220
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel222
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel222bis
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '216'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '219'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '220'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '222'
  - number: '223'
    text: |-
      Hij die stoffen of voorwerpen voorhanden heeft waarvan hij weet dat zij bestemd zijn tot het plegen van enig in
      [artikel 216][ref1] of in [artikel 222bis][ref2] in verband met artikel 216 omschreven misdrijf, wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel216
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel222bis
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel223
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '216'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 222bis
  - number: '224'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 216-222bis][ref1] omschreven misdrijven, kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°, 2° en 4°][ref2], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel216
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '216'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '225.1'
    text: |-
      Hij die een geschrift dat bestemd is om tot bewijs van enig feit te dienen, valselijk opmaakt of vervalst, met
      het oogmerk om het als echt en onvervalst te gebruiken of door anderen te doen gebruiken, wordt als schuldig aan
      valsheid in geschrift gestraft, met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel225
  - number: '225.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die opzettelijk gebruik maakt van het valse of vervalste geschrift als ware
      het echt en onvervalst dan wel opzettelijk zodanig geschrift aflevert of voorhanden heeft, terwijl hij weet of
      redelijkerwijs moet vermoeden dat dit geschrift bestemd is voor zodanig gebruik.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel225
  - number: '225.3'
    text: |-
      Indien een feit, omschreven in het eerste of tweede lid, wordt gepleegd met het oogmerk om een terroristisch
      misdrijf voor te bereiden of gemakkelijk te maken, wordt de op het feit gestelde gevangenisstraf met een derde
      verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel225
  - number: '226.1'
    text: |-
      De schuldige aan valsheid in geschrift wordt gestraft met gevangenisstraf van ten hoogste zeven jaren of geldboete
      van de vijfde categorie, indien zij gepleegd is:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel226
  - number: 226.1.1°
    text: in authentieke akten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel226
  - number: 226.1.2°
    text: in schuldbrieven of certificaten van schuld van enige staat, enige provincie, gemeente of openbare instelling;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel226
  - number: 226.1.3°
    text: in aandelen of schuldbrieven of certificaten van aandeel of schuld van enige vereniging, stichting of vennootschap;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel226
  - number: 226.1.4°
    text: |-
      in talons, dividend- of rentebewijzen behorende tot een der onder de beide voorgaande nummers omschreven stukken,
      of in de bewijzen in plaats van deze stukken uitgegeven;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel226
  - number: 226.1.5°
    text: in krediet- of handelspapier.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel226
  - number: '226.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die opzettelijk gebruik maakt van enig in het eerste lid vermeld vals of
      vervalst geschrift als ware het echt en onvervalst, dan wel opzettelijk zodanig geschrift aflevert, voorhanden
      heeft, ontvangt, zich verschaft, vervoert, verkoopt of overdraagt, terwijl hij weet of redelijkerwijs moet
      vermoeden dat dit geschrift bestemd is voor zodanig gebruik.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel226
  - number: '227.1'
    text: |-
      Hij die in een authentieke akte een valse opgave doet opnemen aangaande een feit van welks waarheid de akte moet
      doen blijken, met het oogmerk om die akte te gebruiken of door anderen te doen gebruiken als ware zijn opgave in
      overeenstemming met de waarheid, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel227
  - number: '227.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die opzettelijk gebruik maakt van de akte als ware de inhoud in
      overeenstemming met de waarheid dan wel opzettelijk de akte aflevert of voorhanden heeft, terwijl hij weet of
      redelijkerwijs moet vermoeden dat die akte bestemd is voor zodanig gebruik.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel227
  - number: 227a
    text: |-
      Hij die, anders dan door valsheid in geschrift, opzettelijk niet naar waarheid gegevens verstrekt aan degene
      door wie of door wiens tussenkomst enige verstrekking of tegemoetkoming wordt verleend, wordt, indien het feit
      kan strekken tot bevoordeling van zichzelf of een ander, terwijl hij weet of redelijkerwijze moet vermoeden dat
      de verstrekte gegevens van belang zijn voor de vaststelling van zijn of eens anders recht op die verstrekking of
      tegemoetkoming dan wel voor de hoogte of de duur van een dergelijke verstrekking of tegemoetkoming, gestraft met
      gevangenis straf van ten hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel227a
  - number: 227b
    text: |-
      Hij die, in strijd met een hem bij of krachtens wettelijk voorschrift opgelegde verplichting, opzettelijk nalaat
      tijdig de benodigde gegevens te verstrekken, wordt, indien het feit kan strekken tot bevoordeling van zichzelf of
      een ander, terwijl hij weet of redelijkerwijze moet vermoeden dat de gegevens van belang zijn voor de vaststelling
      van zijn of eens anders recht op een verstrekking of tegemoetkoming dan wel voor de hoogte of de duur van een
      dergelijke verstrekking of tegemoetkoming, gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van
      de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel227b
  - number: '228.1'
    text: |-
      De arts of verloskundige die opzettelijk een valse verklaring afgeeft nopens een geboorte, een oorzaak van
      overlijden dan wel nopens het al of niet bestaan of bestaan hebben van ziekten, zwakheden of gebreken, wordt
      gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel228
  - number: '228.2'
    text: |-
      Indien de verklaring wordt afgegeven met het oogmerk om iemand in een psychiatrisch ziekenhuis te doen opnemen of
      terughouden, wordt gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van de vijfde categorie
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel228
  - number: '228.3'
    text: |-
      Met dezelfde straffen wordt gestraft hij die opzettelijk van de valse verklaring gebruik maakt als ware de inhoud
      in overeenstemming met de waarheid.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel228
  - number: '229.1'
    text: |-
      Hij die een schriftelijke geneeskundige verklaring nopens een oorzaak van overlijden, dan wel nopens het al of
      niet bestaan of bestaan hebben van ziekten, zwakheden of gebreken valselijk opmaakt of vervalst, met het oogmerk om
      het openbaar gezag of verzekeraars te misleiden, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel229
  - number: '229.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die, met gelijk oogmerk, van de valse of vervalste verklaring gebruik maakt
      als ware zij echt en onvervalst.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel229
  - number: '230.1'
    text: |-
      Hij die een getuigschrift van goed gedrag, bekwaamheid, armoede, gebreken of andere omstandigheden valselijk
      opmaakt of vervalst, met het oogmerk om het te gebruiken of door anderen te doen gebruiken tot het verkrijgen van
      een indienststelling of tot het opwekken van welwillendheid en hulpbetoon, wordt gestraft met gevangenisstraf van
      ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel230
  - number: '230.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die opzettelijk gebruik maakt van enig in het eerste lid vermeld vals of
      vervalst getuigschrift als ware het echt en onvervalst.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel230
  - number: '231.1'
    text: |-
      Hij die een reisdocument valselijk opmaakt of vervalst, of een zodanig stuk op grond van valse gegevens doet
      verstrekken dan wel een aan hem of een ander verstrekt reisdocument ter beschikking stelt van een derde, met het
      oogmerk het door deze te doen gebruiken als ware het aan hem verstrekt, wordt gestraft met gevangenisstraf van ten
      hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel231
  - number: '231.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die in het bezit is van een reisdocument waarvan hij weet of redelijkerwijs
      moet vermoeden, dat het vals of vervalst is, dan wel opzettelijk gebruik maakt van een niet op zijn naam gesteld
      reisdocument.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel231
  - number: '232.1'
    text: |-
      Hij die opzettelijk een betaalpas, waardekaart, enige andere voor het publiek beschikbare kaart of een voor het
      publiek beschikbare drager van identiteitsgegevens, bestemd voor het verrichten of verkrijgen van betalingen of
      andere prestaties langs geautomatiseerde weg, valselijk opmaakt of vervalst, met het oogmerk zichzelf of een ander
      te bevoordelen, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel232
  - number: '232.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die opzettelijk gebruik maakt van de valse of vervalste pas of kaart als
      ware deze echt en onvervalst, dan wel opzettelijk zodanige pas of kaart aflevert, voorhanden heeft, ontvangt, zich
      verschaft, vervoert, verkoopt of overdraagt, terwijl hij weet of redelijkerwijs moet vermoeden dat de pas of kaart
      bestemd is voor zodanig gebruik.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel232
  - number: '234'
    text: |-
      Hij die stoffen, voorwerpen of gegevens vervaardigt, ontvangt, zich verschaft, verkoopt,
      overdraagt of voorhanden heeft waarvan hij weet dat zij bestemd zijn tot het plegen van enig
      in [artikel 226, eerste lid, onder 2°–5°][ref1], [artikel 231, eerste lid][ref2], en
      [artikel 232, eerste lid][ref3], omschreven misdrijf, wordt gestraft met gevangenisstraf van ten hoogste vier jaar
      of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel226
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel231
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel232
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel234
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '226'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '231'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '232'
  - number: '235'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 225-229][ref1] omschreven misdrijven, kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°, 2° en 4°][ref2], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '225'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '236.1'
    text: |-
      Hij die door enige handeling opzettelijk eens anders afstamming onzeker maakt, wordt, als schuldig aan
      verduistering van staat, gestraft met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vierde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel236
  - number: '236.2'
    text: |-
      Ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten kan worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '236.3'
    text: |-
      Vervolging heeft niet plaats dan nadat een verzoek tot inroeping of tot betwisting van staat is gedaan en de
      burgerlijke rechter daarop een eindbeslissing heeft gegeven. Indien het verzoek echter door het stilzitten van
      partijen onvoldoende voortgang vindt, kan vervolging ook plaats hebben nadat de burgerlijke rechter heeft beslist
      dat er een begin van bewijs is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel236
  - number: '237.1'
    text: 'Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel237
  - number: 237.1.1°
    text: hij die opzettelijk een dubbel huwelijk aangaat;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel237
  - number: 237.1.2°
    text: hij die een huwelijk aangaat, wetende dat de wederpartij daardoor een dubbel huwelijk aangaat.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel237
  - number: '237.2'
    text: |-
      Indien hij die opzettelijk een dubbel huwelijk aangaat, aan de wederpartij zijn gehuwde staat heeft verzwegen,
      wordt hij gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel237
  - number: '237.3'
    text: |-
      Ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten kan worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '238'
    text: |-
      De ongehuwde die een huwelijk aangaat, opzettelijk aan de wederpartij verzwijgende dat daartegen enig wettig
      beletsel bestaat, wordt, indien op grond van dat beletsel de nietigheid van het huwelijk is uitgesproken, gestraft
      met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel238
  - number: '239'
    text: |-
      Met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie wordt gestraft schennis van
      de eerbaarheid:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel239
  - number: 239.1°
    text: op of aan een plaats, voor het openbaar verkeer bestemd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel239
  - number: 239.2°
    text: |-
      op een andere dan onder 1° bedoelde openbare plaats, toegankelijk voor personen beneden de leeftijd van zestien
      jaar;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel239
  - number: 239.3°
    text: op een niet openbare plaats, indien een ander daarbij zijns ondanks tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel239
  - number: '240'
    text: |-
      Met gevangenisstraf van ten hoogste twee maanden of geldboete van de derde categorie wordt gestraft hij die weet
      of ernstige reden heeft om te vermoeden dat een afbeelding of voorwerp aanstotelijk voor de eerbaarheid is en die
      afbeelding of dat voorwerp:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel240
  - number: 240.1°
    text: op of aan een plaats, voor het openbaar verkeer bestemd, openlijk tentoonstelt of aanbiedt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel240
  - number: 240.2°
    text: aan iemand, anders dan op diens verzoek, toezendt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel240
  - number: 240a
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft hij die een
      afbeelding, een voorwerp of een gegevensdrager, bevattende een afbeelding waarvan de vertoning schadelijk is te
      achten voor personen beneden de leeftijd van zestien jaar, verstrekt, aanbiedt of vertoont aan een minderjarige van
      wie hij weet of redelijkerwijs moet vermoeden, dat deze jonger is dan zestien jaar.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel240a
  - number: 240b.1
    text: |-
      Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie wordt gestraft degene die
      een afbeelding - of een gegevensdrager, bevattende een afbeelding - van een seksuele gedraging, waarbij iemand
      die kennelijk de leeftijd van achttien jaar nog niet heeft bereikt, is betrokken of schijnbaar is betrokken,
      verspreidt, openlijk tentoonstelt, vervaardigt, invoert, doorvoert, uitvoert of in bezit heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel240b
  - number: 240b.2
    text: |-
      Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie wordt gestraft degene die van
      het plegen van een van de misdrijven, omschreven in het eerste lid, een beroep of een gewoonte maakt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel240b
  - number: '242'
    text: |-
      Hij die door geweld of een andere feitelijkheid of bedreiging met geweld of een andere feitelijkheid iemand dwingt
      tot het ondergaan van handelingen die bestaan uit of mede bestaan uit het seksueel binnendringen van het lichaam,
      wordt als schuldig aan verkrachting gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de
      vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel242
  - number: '243'
    text: |-
      Hij die met iemand van wie hij weet dat hij in staat van bewusteloosheid, verminderd bewustzijn of lichamelijke
      onmacht verkeert, dan wel aan een zodanige gebrekkige ontwikkeling of ziekelijke stoornis van zijn geestvermogens
      lijdt dat hij niet of onvolkomen in staat is zijn wil daaromtrent te bepalen of kenbaar te maken of daartegen
      weerstand te bieden, handelingen pleegt die bestaan uit of mede bestaan uit het seksueel binnendringen van het
      lichaam, wordt gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel243
  - number: '244'
    text: |-
      Hij die met iemand beneden de leeftijd van twaalf jaren handelingen pleegt die bestaan uit of mede bestaan uit
      het seksueel binnendringen van het lichaam, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel244
  - number: '245'
    text: |-
      Hij die met iemand, die de leeftijd van twaalf jaren maar nog niet die van zestien jaren heeft bereikt, buiten
      echt, ontuchtige handelingen pleegt die bestaan uit of mede bestaan uit het seksueel binnendringen van het lichaam,
      wordt gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel245
  - number: '246'
    text: |-
      Hij die door geweld of een andere feitelijkheid of bedreiging met geweld of een andere feitelijkheid iemand
      dwingt tot het plegen of dulden van ontuchtige handelingen, wordt, als schuldig aan feitelijke aanranding van de
      eerbaarheid, gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel246
  - number: '247'
    text: |-
      Hij die met iemand van wie hij weet dat hij in staat van bewusteloosheid, verminderd bewustzijn of lichamelijk
      onmacht verkeert, dan wel aan een zodanige gebrekkige ontwikkeling of ziekelijke stoornis van zijn geestvermogens
      lijdt dat hij niet of onvolkomen in staat is zijn wil daaromtrent te bepalen of kenbaar te maken of daartegen
      weerstand te bieden of met iemand beneden de leeftijd van zestien jaren buiten echt ontuchtige handelingen pleegt
      of laatstgemelde tot het plegen of dulden van zodanige handelingen buiten echt met een derde verleidt, wordt
      gestraft met een gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel247
  - number: '248.1'
    text: |-
      Indien een der in de [artikelen 240b][ref1], [243][ref2], [245 tot en met 247][ref3], [248a][ref4], [248b][ref5] en
      [249][ref6] omschreven misdrijven zwaar lichamelijk letsel ten gevolge heeft of daarvan levensgevaar voor een ander
      te duchten is, wordt gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel240b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel243
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel245
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel248a
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel248b
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel249
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel248
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 240b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '243'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '245'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 248a
      - id: ref5
        bwb_id: BWBR0001854
        artikel: 248b
      - id: ref6
        bwb_id: BWBR0001854
        artikel: '249'
  - number: '248.2'
    text: |-
      Indien een der in de [artikelen 240b][ref1], [242][ref2], [243 tot en met 247][ref3], [248a][ref4], [248b][ref5] en
      [249][ref6] omschreven misdrijven de dood ten gevolge heeft, wordt gevangenisstraf van ten hoogste vijftien jaren
      of geldboete van de vijfde categorie opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel240b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel242
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel243
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel248a
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel248b
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel249
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel248
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 240b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '242'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '243'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 248a
      - id: ref5
        bwb_id: BWBR0001854
        artikel: 248b
      - id: ref6
        bwb_id: BWBR0001854
        artikel: '249'
  - number: 248a
    text: |-
      Hij die door giften of beloften van geld of goed, misbruik van uit feitelijke verhoudingen voortvloeiend overwicht
      of misleiding een persoon waarvan hij weet of redelijkerwijs moet vermoeden dat deze de leeftijd van achttien jaren
      nog niet heeft bereikt, opzettelijk beweegt ontuchtige handelingen te plegen of zodanige handelingen van hem te
      dulden, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel248a
  - number: 248b
    text: |-
      Hij die ontucht pleegt met iemand die zich beschikbaar stelt tot het verrichten van seksuele handelingen met
      een derde tegen betaling en die de leeftijd van zestien jaren maar nog niet de leeftijd van achttien jaren heeft
      bereikt, wordt gestraft met een gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel248b
  - number: 248c
    text: |-
      Hij die opzettelijk aanwezig is bij het plegen van ontuchtige handelingen door een persoon waarvan hij weet of
      redelijkerwijs moet vermoeden dat deze de leeftijd van achttien jaren nog niet heeft bereikt dan wel bij het
      vertonen van afbeeldingen van dergelijke handelingen in een daarvoor bestemde gelegenheid, wordt gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel248c
  - number: '249.1'
    text: |-
      Hij die ontucht pleegt met zijn minderjarig kind, stiefkind of pleegkind, zijn pupil, een aan zijn zorg, opleiding
      of waakzaamheid toevertrouwde minderjarige of zijn minderjarige bediende of ondergeschikte, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel249
  - number: '249.2'
    text: 'Met dezelfde straf wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel249
  - number: 249.2.1°
    text: |-
      de ambtenaar die ontucht pleegt met een persoon aan zijn gezag onderworpen of aan zijn waakzaamheid toevertrouwd
      of aanbevolen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel249
  - number: 249.2.2°
    text: |-
      de bestuurder, arts, onderwijzer, beambte, opzichter of bediende in een gevangenis, rijksinrichting voor
      kinderbescherming, weeshuis, ziekenhuis, of instelling van weldadigheid, die ontucht pleegt met een persoon daarin
      opgenomen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel249
  - number: 249.2.3°
    text: |-
      degene die, werkzaam in de gezondheidszorg of maatschappelijke zorg, ontucht pleegt met iemand die zich als patiënt
      of cliënt aan zijn hulp of zorg heeft toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel249
  - number: '250.1'
    text: 'Wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel250
  - number: 250.1.1°
    text: |-
      met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie, hij die het plegen van ontucht
      door zijn minderjarig kind, stiefkind of pleegkind, zijn pupil, een aan zijn zorg, opleiding of waakzaamheid
      toevertrouwde minderjarige of zijn minderjarige bediende of ondergeschikte met een derde opzettelijk teweegbrengt
      of bevordert;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel250
  - number: 250.1.2°
    text: |-
      met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, hij die, buiten de gevallen
      genoemd onder 1°, het plegen van ontucht door een minderjarige wiens minderjarigheid hij kent of redelijkerwijs
      moet vermoeden, met een derde opzettelijk teweegbrengt of bevordert.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel250
  - number: '250.2'
    text: |-
      Indien de schuldige van het plegen van het misdrijf een gewoonte maakt, kunnen de gevangenisstraffen met een derde
      worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel250
  - number: '251.1'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 240b tot en met 247][ref1] onderscheidenlijk 248a tot en met 250
      omschreven misdrijven, kan ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref2], vermelde
      rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel240b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel251
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 240b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '251.2'
    text: |-
      Indien de schuldige aan een der misdrijven in de [artikelen 240b tot en met 247][ref1] en 248a tot en met 250
      omschreven, het misdrijf in zijn beroep begaat, kan hij van de uitoefening van dat beroep worden ontzet.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel240b
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel251
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 240b
  - number: '252.1'
    text: 'Met gevangenisstraf van ten hoogste negen maanden of geldboete van de derde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel252
  - number: 252.1.1°
    text: hij die aan iemand die in kennelijke staat van dronkenschap verkeert, bedwelmende drank verkoopt of toedient;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel252
  - number: 252.1.2°
    text: hij die een kind beneden de leeftijd van zestien jaren dronken maakt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel252
  - number: 252.1.3°
    text: hij die iemand door geweld of bedreiging met geweld dwingt tot het gebruik van bedwelmende drank.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel252
  - number: '252.2'
    text: |-
      Indien het feit zwaar lichamelijk letsel ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten
      hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel252
  - number: '252.3'
    text: |-
      Indien het feit de dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste negen jaren of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel252
  - number: '252.4'
    text: Indien de schuldige het misdrijf in zijn beroep begaat, kan hij van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel252
  - number: '253'
    text: |-
      Hij die een onder zijn wettig gezag staand kind beneden de leeftijd van twaalf jaren aan een ander afstaat of
      overlaat, wetende dat het tot of bij het uitoefenen van bedelarij, van gevaarlijke kunstverrichtingen of van
      gevaarlijke of de gezondheid ondermijnende arbeid zal worden gebruikt, wordt gestraft met gevangenisstraf van ten
      hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel253
  - number: '255'
    text: |-
      Hij die opzettelijk iemand tot wiens onderhoud, verpleging of verzorging hij krachtens wet of overeenkomst
      verplicht is, in een hulpeloze toestand brengt of laat, wordt gestraft met gevangenisstraf van ten hoogste twee
      jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel255
  - number: '256'
    text: |-
      Hij die een kind beneden de leeftijd van zeven jaren te vondeling legt of, met het oogmerk om er zich van te
      ontdoen, verlaat, wordt gestraft met gevangenisstraf van ten hoogste vier jaren en zes maanden of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel256
  - number: '257.1'
    text: |-
      Indien een der in de [artikelen 255][ref1] en [256][ref2] omschreven feiten zwaar lichamelijk letsel ten gevolge
      heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van
      de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel255
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel256
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '255'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '256'
  - number: '257.2'
    text: |-
      Indien een van deze feiten de dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste negen
      jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel257
  - number: '258'
    text: |-
      Indien de schuldige aan het in [artikel 256][ref1] omschreven misdrijf de vader of de moeder is, kunnen te zijnen
      aanzien de in de [artikelen 256][ref2] en [257][ref3] bepaalde gevangenisstraffen met een derde worden verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel256
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel256
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel257
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel258
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '256'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '256'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '257'
  - number: '259'
    text: |-
      Indien de moeder onder de werking van vrees voor de ontdekking van haar bevalling haar kind kort na de
      geboorte te vondeling legt of, met het oogmerk om er zich van te ontdoen, verlaat, wordt het maximum der in
      de [artikelen 256][ref1] en [257][ref2] vermelde gevangenisstraffen tot de helft verminderd en wordt de in
      [artikel 257][ref3] vermelde geldboete tot de vierde categorie teruggebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel256
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel257
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel257
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel259
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '256'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '257'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '257'
  - number: '260'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 255-259][ref1] omschreven misdrijven, kan ontzetting van de in
      [artikel 28, eerste lid, onder 4°][ref2], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel255
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '255'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '261.1'
    text: |-
      Hij die opzettelijk iemands eer of goede naam aanrandt, door telastlegging van een bepaald feit, met het kennelijke
      doel om daaraan ruchtbaarheid te geven, wordt, als schuldig aan smaad, gestraft met gevangenisstraf van ten hoogste
      zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel261
  - number: '261.2'
    text: |-
      Indien dit geschiedt door middel van geschriften of afbeeldingen, verspreid, openlijk tentoongesteld of
      aangeslagen, of door geschriften waarvan de inhoud openlijk ten gehore wordt gebracht, wordt de dader, als schuldig
      aan smaadschrift, gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel261
  - number: '261.3'
    text: |-
      Noch smaad, noch smaadschrift bestaat voor zover de dader heeft gehandeld tot noodzakelijke verdediging, of te
      goeder trouw heeft kunnen aannemen dat het te last gelegde waar was en dat het algemeen belang de telastlegging
      eiste.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel261
  - number: '262.1'
    text: |-
      Hij die het misdrijf van smaad of smaadschrift pleegt, wetende dat het te last gelegde feit in strijd met de
      waarheid is, wordt, als schuldig aan laster, gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete
      van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel262
  - number: '262.2'
    text: |-
      Ontzetting van de in [artikel 28, eerste lid, onder 1° en 2°][ref1], vermelde rechten kan worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel262
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '265.1'
    text: |-
      Indien de beledigde aan het te last gelegde feit bij rechterlijk gewijsde onherroepelijk is schuldig verklaard, is
      veroordeling wegens laster uitgesloten.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel265
  - number: '265.2'
    text: |-
      Indien hij van het te last gelegde feit bij rechterlijk gewijsde onherroepelijk is vrijgesproken, wordt dat
      gewijsde als volkomen bewijs van de onwaarheid van het feit aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel265
  - number: '265.3'
    text: |-
      Indien tegen de beledigde wegens het hem te last gelegde feit een strafvervolging is aangevangen, wordt de
      vervolging wegens laster geschorst totdat bij gewijsde onherroepelijk over het te last gelegde feit is beslist.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel265
  - number: '266.1'
    text: |-
      Elke opzettelijke belediging die niet het karakter van smaad of smaadschrift draagt, hetzij in het openbaar
      mondeling of bij geschrift of afbeelding, hetzij iemand, in zijn tegenwoordigheid mondeling of door feitelijkheden,
      hetzij door een toegezonden of aangeboden geschrift of afbeelding, aangedaan, wordt, als eenvoudige belediging,
      gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel266
  - number: '266.2'
    text: |-
      Niet als eenvoudige belediging strafbaar zijn gedragingen die ertoe strekken een oordeel te geven over de
      behartiging van openbare belangen, en die er niet op zijn gericht ook in ander opzicht of zwaarder te grieven dan
      uit die strekking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel266
  - number: '267'
    text: |-
      De in de voorgaande artikelen van deze titel bepaalde gevangenisstraffen kunnen met een derde worden verhoogd,
      indien de belediging wordt aangedaan aan:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel267
  - number: 267.1°
    text: het openbaar gezag, een openbaar lichaam of een openbare instelling;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel267
  - number: 267.2°
    text: een ambtenaar gedurende of ter zake van de rechtmatige uitoefening van zijn bediening;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel267
  - number: 267.3°
    text: het hoofd of een lid van de regering van een bevriende staat.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel267
  - number: '268.1'
    text: |-
      Hij die opzettelijk tegen een bepaald persoon bij de overheid een valse klacht of aangifte schriftelijk inlevert
      of in schrift doet brengen, waardoor de eer of goede naam van die persoon wordt aangerand, wordt, als schuldig
      aan lasterlijke aanklacht, gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel268
  - number: '268.2'
    text: |-
      Ontzetting van de in [artikel 28, eerste lid, onder 1° en 2°][ref1], vermelde rechten kan worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '269'
    text: |-
      Belediging, strafbaar krachtens deze titel, wordt niet vervolgd dan op klacht van hem tegen wie het misdrijf is
      gepleegd, behalve in de gevallen voorzien in [artikel 267, aanhef en onder 1° en 2°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel267
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '267'
  - number: '270.1'
    text: |-
      Hij die ten aanzien van een overledene een feit pleegt dat, ware deze nog in leven, als smaadschrift of smaad
      zou zijn gekenmerkt, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel270
  - number: '270.2'
    text: |-
      Dit misdrijf wordt niet vervolgd dan op klacht hetzij van een der bloedverwanten of aangehuwden van de overledene
      in de rechte linie of zijlinie tot de tweede graad, hetzij van zijn echtgenoot.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel270
  - number: '271.1'
    text: |-
      Hij die een geschrift of afbeelding van beledigende of voor een overledene smadelijke inhoud verspreidt, openlijk
      tentoonstelt of aanslaat of, om verspreid, openlijk tentoongesteld of aangeslagen te worden, in voorraad heeft,
      wordt, indien hij weet of ernstige reden heeft om te vermoeden dat de inhoud van het geschrift of de afbeelding van
      zodanige aard is, gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel271
  - number: '271.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die, met gelijke wetenschap of een gelijke reden tot vermoeden, de inhoud van
      een zodanig geschrift openlijk ten gehore brengt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel271
  - number: '271.3'
    text: |-
      Indien de schuldige een van de misdrijven omschreven in dit artikel in zijn beroep begaat en er tijdens het plegen
      van het misdrijf nog geen twee jaren zijn verlopen sedert een vroegere veroordeling van de schuldige wegens een van
      deze misdrijven onherroepelijk is geworden, kan hij van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel271
  - number: '271.4'
    text: |-
      De misdrijven worden niet vervolgd dan op klacht van de in [artikel 269][ref1] en het
      [tweede lid van artikel 270][ref2] aangewezen personen, behalve in de gevallen voorzien in
      [artikel 267, aanhef en onder 1° en 2°][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel269
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel270
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel267
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel271
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '269'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '270'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '267'
  - number: '272.1'
    text: |-
      Hij die enig geheim waarvan hij weet of redelijkerwijs moet vermoeden dat hij uit hoofde van ambt, beroep of
      wettelijk voorschrift dan wel van vroeger ambt of beroep verplicht is het te bewaren, opzettelijk schendt, wordt
      gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel272
  - number: '272.2'
    text: Indien dit misdrijf tegen een bepaald persoon gepleegd is, wordt het slechts vervolgd op diens klacht.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel272
  - number: '273.1'
    text: |-
      Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft hij die
      opzettelijk
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273
  - number: 273.1.1°
    text: |-
      aangaande een onderneming van handel, nijverheid of dienstverlening bij welke hij werkzaam is of is geweest,
      bijzonderheden waarvan hem geheimhouding is opgelegd, bekend gemaakt of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273
  - number: 273.1.2°
    text: |-
      gegevens die door misdrijf zijn verkregen uit een geautomatiseerd werk van een onderneming van handel, nijverheid
      of dienstverlening en die betrekking hebben op deze onderneming, bekend maakt of uit winstbejag gebruikt, indien
      deze gegevens ten tijde van de bekendmaking of het gebruik niet algemeen bekend waren en daaruit enig nadeel kan
      ontstaan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273
  - number: '273.2'
    text: Niet strafbaar is hij die te goeder trouw heeft kunnen aannemen dat het algemeen belang de bekendmaking vereiste.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273
  - number: '273.3'
    text: Geen vervolging heeft plaats dan op klacht van het bestuur van de onderneming.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273
  - number: 273a
    text: |-
      De persoon werkzaam bij enige openbare instelling van vervoer die een aan zodanige instelling toevertrouwde brief,
      gesloten stuk of pakket opzettelijk en wederrechtelijk opent, daarvan inzage neemt of de inhoud aan een ander
      bekendmaakt, wordt gestraft met gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273a
  - number: 273b.1
    text: |-
      De persoon werkzaam bij enige openbare instelling van vervoer die een aan zodanige instelling toevertrouwde brief,
      briefkaart, stuk of pakket opzettelijk aan een ander dan de rechthebbende afgeeft, vernietigt, wegmaakt, zich toe-
      eigent, of de inhoud wijzigt of enig daarin gesloten voorwerp zich toe-eigent, wordt gestraft met gevangenisstraf
      van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273b
  - number: 273b.2
    text: |-
      Indien zodanig stuk of voorwerp geldswaarde heeft, wordt de toe-eigening gestraft met gevangenisstraf van ten
      hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273b
  - number: 273c
    text: 'De persoon belast met de dienst van een ten algemenen nutte gebezigde telegraafinrichting wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273c
  - number: 273c.a
    text: |-
      met gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie, indien hij
      de inhoud van een aan zodanige inrichting toevertrouwd bericht opzettelijk en wederrechtelijk aan een ander
      bekendmaakt of een telegram opzettelijk en wederrechtelijk opent, daarvan inzage neemt of de inhoud aan een ander
      bekendmaakt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273c
  - number: 273c.b
    text: |-
      met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie, indien hij een aan zodanige
      inrichting toevertrouwd bericht of een telegram opzettelijk aan een ander dan de rechthebbende afgeeft, vernietigt,
      wegmaakt, zich toe-eigent of de inhoud wijzigt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273c
  - number: 273d.1
    text: |-
      Met gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie wordt gestraft de
      persoon werkzaam bij een aanbieder van een openbaar telecommunicatienetwerk of een openbare telecommunicatiedienst:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273d
  - number: 273d.1.a
    text: |-
      die opzettelijk en wederrechtelijk van gegevens kennisneemt die door tussenkomst van zodanig netwerk of zodanige
      dienst zijn opgeslagen, worden verwerkt of overgedragen en die niet voor hem zijn bestemd, zodanige gegevens voor
      zichzelf of een ander overneemt, aftapt of opneemt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273d
  - number: 273d.1.b
    text: |-
      die de beschikking heeft over een voorwerp waaraan, naar hij weet of redelijkerwijs moet vermoeden, een gegeven kan
      worden ontleend, dat door wederrechtelijk overnemen, aftappen of opnemen van zodanige gegevens is verkregen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273d
  - number: 273d.1.c
    text: die opzettelijk en wederrechtelijk de inhoud van zodanige gegevens aan een ander bekendmaakt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273d
  - number: 273d.1.d
    text: |-
      die opzettelijk en wederrechtelijk een voorwerp waaraan een gegeven omtrent de inhoud van zodanige gegevens kan
      worden ontleend, ter beschikking stelt van een ander.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273d
  - number: 273e
    text: |-
      Enig in de [artikelen 273a tot en met 273d][ref1] bedoeld persoon die opzettelijk toelaat dat een ander een der in
      deze artikelen vermelde feiten pleegt, of die ander daarbij als medeplichtige ter zijde staat, wordt gestraft met
      de straffen en naar de onderscheidingen in die bepalingen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel273a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273e
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 273a
  - number: 273f.1
    text: |-
      Als schuldig aan mensenhandel wordt met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde
      categorie gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.1.1°
    text: |-
      degene die een ander door dwang, geweld of een andere feitelijkheid of door dreiging met geweld of een andere
      feitelijkheid, door afpersing, fraude, misleiding dan wel door misbruik van uit feitelijke omstandigheden
      voortvloeiend overwicht, door misbruik van een kwetsbare positie of door het geven of ontvangen van betalingen of
      voordelen om de instemming van een persoon te verkrijgen die zeggenschap over die ander heeft, werft, vervoert,
      overbrengt, huisvest of opneemt, met het oogmerk van uitbuiting van die ander of de verwijdering van diens organen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.1.2°
    text: |-
      degene die een ander werft, vervoert, overbrengt, huisvest of opneemt, met het oogmerk van uitbuiting van die ander
      of de verwijdering van diens organen, terwijl die ander de leeftijd van achttien jaren nog niet heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.1.3°
    text: |-
      degene die een ander aanwerft, medeneemt of ontvoert met het oogmerk die ander in een ander land ertoe te brengen
      zich beschikbaar te stellen tot het verrichten van seksuele handelingen met of voor een derde tegen betaling;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.1.4°
    text: |-
      degene die een ander met een van de onder 1° genoemde middelen dwingt of beweegt zich beschikbaar te stellen tot
      het verrichten van arbeid of diensten of zijn organen beschikbaar te stellen dan wel onder de onder 1° genoemde
      omstandigheden enige handeling onderneemt waarvan hij weet of redelijkerwijs moet vermoeden dat die ander zich
      daardoor beschikbaar stelt tot het verrichten van arbeid of diensten of zijn organen beschikbaar stelt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.1.5°
    text: |-
      degene die een ander ertoe brengt zich beschikbaar te stellen tot het verrichten van seksuele handelingen met of
      voor een derde tegen betaling of zijn organen tegen betaling beschikbaar te stellen dan wel ten aanzien van een
      ander enige handeling onderneemt waarvan hij weet of redelijkerwijs moet vermoeden dat die ander zich daardoor
      beschikbaar stelt tot het verrichten van die handelingen of zijn organen tegen betaling beschikbaar stelt, terwijl
      die ander de leeftijd van achttien jaren nog niet heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.1.6°
    text: degene die opzettelijk voordeel trekt uit de uitbuiting van een ander;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.1.7°
    text: |-
      degene die opzettelijk voordeel trekt uit de verwijdering van organen van een ander, terwijl hij weet of
      redelijkerwijs moet vermoeden dat diens organen onder de onder 1° bedoelde omstandigheden zijn verwijderd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.1.8°
    text: |-
      degene die opzettelijk voordeel trekt uit seksuele handelingen van een ander met of voor een derde tegen betaling
      of de verwijdering van diens organen tegen betaling, terwijl die ander de leeftijd van achttien jaren nog niet
      heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.1.9°
    text: |-
      degene die een ander met een van de onder 1° genoemde middelen dwingt dan wel beweegt hem te bevoordelen uit de
      opbrengst van diens seksuele handelingen met of voor een derde of van de verwijdering van diens organen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.2
    text: |-
      Uitbuiting omvat ten minste uitbuiting van een ander in de prostitutie, andere vormen van seksuele uitbuiting,
      gedwongen of verplichte arbeid of diensten, slavernij en met slavernij of dienstbaarheid te vergelijken praktijken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.3
    text: |-
      De schuldige wordt gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie,
      indien:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.3.1°
    text: de feiten, omschreven in het eerste lid, worden gepleegd door twee of meer verenigde personen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.3.2°
    text: |-
      de persoon ten aanzien van wie de in het eerste lid omschreven feiten worden gepleegd, de leeftijd van zestien
      jaren nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.4
    text: |-
      De feiten, omschreven in het eerste lid, gepleegd door twee of meer verenigde personen onder de omstandigheid,
      bedoeld in het derde lid, onder 2°, worden gestraft met gevangenisstraf van ten hoogste tien jaren of geldboete van
      de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.5
    text: |-
      Indien een van de in het eerste lid omschreven feiten zwaar lichamelijk letsel ten gevolge heeft of daarvan
      levensgevaar voor een ander te duchten is, wordt gevangenisstraf van ten hoogste twaalf jaren of geldboete van de
      vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.6
    text: |-
      Indien een van de in het eerste lid omschreven feiten de dood ten gevolge heeft, wordt gevangenisstraf van ten
      hoogste vijftien jaren of geldboete van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
  - number: 273f.7
    text: |-
      [Artikel 251][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel251
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel273f
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '251'
  - number: '274'
    text: |-
      Hij die voor eigen of vreemde rekening slavenhandel drijft of opzettelijk daaraan middellijk of onmiddellijk
      deelneemt, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel274
  - number: '275.1'
    text: |-
      Hij die als schipper dienst neemt of dienst doet op een vaartuig, wetende dat het tot het drijven van slavenhandel
      bestemd is, of het daartoe gebruikende, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel275
  - number: '275.2'
    text: |-
      Indien het vervoer de dood van een of meer slaven ten gevolge heeft, wordt de schipper gestraft met gevangenisstraf
      van ten hoogste vijftien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel275
  - number: '276'
    text: |-
      Hij die als schepeling dienst neemt op een vaartuig, wetende dat het tot het drijven van slavenhandel bestemd is of
      gebruikt wordt, of vrijwillig in dienst blijft na die bestemming of dit gebruik te hebben vernomen, wordt gestraft
      met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel276
  - number: '277'
    text: |-
      Hij die voor eigen of vreemde rekening middellijk of onmiddellijk medewerkt tot het verhuren, vervrachten of
      verzekeren van een vaartuig, wetende dat het tot het drijven van slavenhandel bestemd is, wordt gestraft met
      gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel277
  - number: '278'
    text: |-
      Hij die iemand over de grenzen van het Rijk in Europa voert, met het oogmerk om hem wederrechtelijk onder de
      macht van een ander te brengen of om hem in hulpeloze toestand te verplaatsen, wordt, als schuldig aan mensenroof,
      gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel278
  - number: '279.1'
    text: |-
      Hij die opzettelijk een minderjarige onttrekt aan het wettig over hem gesteld gezag of aan het opzicht van degene
      die dit desbevoegd over hem uitoefent, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete
      van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel279
  - number: '279.2'
    text: |-
      Gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie wordt opgelegd indien list, geweld
      of bedreiging met geweld is gebezigd, of indien de minderjarige beneden de twaalf jaren oud is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel279
  - number: '280.1'
    text: |-
      Hij die opzettelijk een minderjarige die onttrokken is of zich onttrokken heeft aan het wettig over hem gesteld
      gezag of aan het opzicht van degene die dit desbevoegd over hem uitoefent, verbergt of aan de nasporing van de
      ambtenaren van de justitie of politie onttrekt, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of
      geldboete van de vierde categorie of, indien de minderjarige beneden de twaalf jaren oud is, met gevangenisstraf
      van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel280
  - number: '280.2'
    text: Het voorgaande is niet van toepassing op
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel280
  - number: 280.2.a
    text: hem die de raad voor de kinderbescherming onverwijld de verblijfplaats van de minderjarige meedeelt; of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel280
  - number: 280.2.b
    text: |-
      de zorgaanbieder, bedoeld in [artikel 1, onder g, van de Wet op de jeugdzorg][ref1], die op grond van
      [artikel 41 van die wet][ref2] van de provincie subsidie ontvangt en handelt overeenkomstig de krachtens
      [artikel 3, vijfde lid][ref3] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel3
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel280
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '41'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '3'
  - number: 280.2.c
    text: hem die handelt in het kader van zorgvuldige hulpverlening aan de minderjarige.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel280
  - number: '280.3'
    text: |-
      Van zorgvuldige hulpverlening vormen de onverwijlde melding dat hulp wordt verleend alsmede de onverwijlde
      bekendmaking van de identiteit van de hulpverlener en zijn plaats van verblijf of vestiging aan degene die het
      gezag over de minderjarige uitoefent, bestanddelen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel280
  - number: '281.1'
    text: 'Als schuldig aan schaking wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel281
  - number: 281.1.1°
    text: |-
      met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie, hij die een minderjarige vrouw,
      zonder de wil van haar ouders of voogden doch met haar toestemming, wegvoert, met het oogmerk om zich haar bezit in
      of buiten echt te verzekeren;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel281
  - number: 281.1.2°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, hij die een vrouw door list,
      geweld of bedreiging met geweld wegvoert, met het oogmerk om zich haar bezit in of buiten echt te verzekeren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel281
  - number: '281.2'
    text: Geen vervolging heeft plaats dan op klacht.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel281
  - number: '281.3'
    text: 'De klacht geschiedt:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel281
  - number: 281.3.a
    text: |-
      indien de vrouw tijdens de wegvoering minderjarig is, hetzij door haarzelf, hetzij door iemand wiens toestemming
      zij tot het aangaan van een huwelijk behoeft;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel281
  - number: 281.3.b
    text: indien zij tijdens de wegvoering meerderjarig is, hetzij door haarzelf, hetzij door haar echtgenoot.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel281
  - number: '281.4'
    text: |-
      Indien de schaker met de weggevoerde een huwelijk heeft gesloten, heeft geen veroordeling plaats, dan nadat de
      nietigheid van het huwelijk is uitgesproken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel281
  - number: '282.1'
    text: |-
      Hij die opzettelijk iemand wederrechtelijk van de vrijheid berooft of beroofd houdt, wordt gestraft met
      gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel282
  - number: '282.2'
    text: |-
      Indien het feit zwaar lichamelijk letsel ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten
      hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel282
  - number: '282.3'
    text: |-
      Indien het feit de dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste twaalf jaren of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel282
  - number: '282.4'
    text: |-
      De in dit artikel bepaalde straffen zijn ook van toepassing op hem die opzettelijk tot de wederrechtelijke
      vrijheidsberoving een plaats verschaft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel282
  - number: 282a.1
    text: |-
      Hij die opzettelijk iemand wederrechtelijk van de vrijheid berooft of beroofd houdt met het oogmerk een ander te
      dwingen iets te doen of niet te doen wordt als schuldig aan gijzeling gestraft met gevangenisstraf van ten hoogste
      vijftien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel282a
  - number: 282a.2
    text: |-
      Indien het feit de dood ten gevolge heeft wordt hij gestraft met levenslange gevangenisstraf of tijdelijke van ten
      hoogste dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel282a
  - number: 282a.3
    text: |-
      Het [vierde lid van artikel 282][ref1] is toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel282
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel282a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '282'
  - number: 282b.1
    text: |-
      Hij die opzettelijk iemand wederrechtelijk van de vrijheid berooft of beroofd houdt met een terroristisch oogmerk,
      wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de
      vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel282b
  - number: 282b.2
    text: |-
      [Artikel 282, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel282
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel282b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '282'
  - number: 282c.1
    text: |-
      De samenspanning tot het in [artikel 282b][ref1] omschreven misdrijf wordt gestraft met gevangenisstraf van ten
      hoogste tien jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel282b
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel282c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 282b
  - number: 282c.2
    text: |-
      [Artikel 96, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel96
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel282c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '96'
  - number: '283.1'
    text: |-
      Hij aan wiens schuld te wijten is dat iemand wederrechtelijk van de vrijheid beroofd wordt of beroofd blijft, wordt
      gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel283
  - number: '283.2'
    text: |-
      Indien het feit zwaar lichamelijk letsel ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten
      hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel283
  - number: '283.3'
    text: |-
      Indien het feit de dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel283
  - number: '284.1'
    text: 'Met gevangenisstraf van ten hoogste negen maanden of geldboete van de derde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel284
  - number: 284.1.1°
    text: |-
      hij die een ander door geweld of enige andere feitelijkheid of door bedreiging met geweld of enige andere
      feitelijkheid, gericht hetzij tegen die ander hetzij tegen derden, wederrechtelijk dwingt iets te doen, niet te
      doen of te dulden;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel284
  - number: 284.1.2°
    text: hij die een ander door bedreiging met smaad of smaadschrift dwingt iets te doen, niet te doen of te dulden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel284
  - number: '284.2'
    text: In het geval onder 2° omschreven wordt het misdrijf niet vervolgd dan op klacht van hem tegen wie het gepleegd is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel284
  - number: 284a
    text: |-
      Hij die een ander door bedreiging met diefstal of afpersing van splijtstof, als bedoeld in
      [artikel 1, eerste lid, onder ][ref1] (*Stb.* 1963, 82), gericht tegen die ander of tegen derden wederrechtelijk
      dwingt iets te doen, niet te doen of te dulden, wordt gestraft met gevangenisstraf van ten hoogste een jaar en zes
      maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel284a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '1'
  - number: '285.1'
    text: |-
      Bedreiging met openlijk in vereniging geweld plegen tegen personen of goederen, met geweld tegen een internationaal
      beschermd persoon of diens beschermde goederen, met enig misdrijf waardoor gevaar voor de algemene veiligheid van
      personen of goederen of gemeen gevaar voor de verlening van diensten ontstaat, met verkrachting, met feitelijke
      aanranding van de eerbaarheid, met enig misdrijf tegen het leven gericht, met gijzeling, met zware mishandeling
      of met brandstichting, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel285
  - number: '285.2'
    text: |-
      Indien deze bedreiging schriftelijk en onder een bepaalde voorwaarde geschiedt, wordt ze gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel285
  - number: '285.3'
    text: |-
      Bedreiging met een terroristisch misdrijf wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete
      van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel285
  - number: 285a.1
    text: |-
      Hij die opzettelijk mondeling, door gebaren, bij geschrift of afbeelding zich jegens een persoon uit, kennelijk om
      diens vrijheid om naar waarheid of geweten ten overstaan van een rechter of ambtenaar een verklaring af te leggen
      te beïnvloeden, terwijl hij weet of ernstige reden heeft te vermoeden dat die verklaring zal worden afgelegd, wordt
      gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel285a
  - number: 285a.2
    text: |-
      Met rechter of ambtenaar wordt gelijkgesteld: een rechter bij onderscheidenlijk een persoon in de openbare dienst
      van een internationaal gerecht dat zijn rechtsmacht ontleent aan een verdrag waarbij het Koninkrijk partij is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel285a
  - number: 285b.1
    text: |-
      Hij, die wederrechtelijk stelselmatig opzettelijk inbreuk maakt op eens anders persoonlijke levenssfeer met het
      oogmerk die ander te dwingen iets te doen, niet te doen of te dulden dan wel vrees aan te jagen wordt, als schuldig
      aan belaging, gestraft met een gevangenisstraf van ten hoogste drie jaren of een geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel285b
  - number: 285b.2
    text: Vervolging vindt niet plaats dan op klacht van hem tegen wie het misdrijf is begaan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel285b
  - number: '286'
    text: |-
      Bij veroordeling wegens een der in [artikelen 274-282][ref1] en in het [tweede lid van artikel 285][ref2]
      omschreven misdrijven, kan ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref3], vermelde
      rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel274
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel285
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel286
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '274'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '285'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '287'
    text: |-
      Hij die opzettelijk een ander van het leven berooft, wordt, als schuldig aan doodslag, gestraft met gevangenisstraf
      van ten hoogste vijftien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel287
  - number: '288'
    text: |-
      Doodslag gevolgd, vergezeld of voorafgegaan van een strafbaar feit en gepleegd met het oogmerk om de uitvoering
      van dat feit voor te bereiden of gemakkelijk te maken, of om, bij betrapping op heter daad, aan zichzelf of andere
      deelnemers aan dat feit hetzij straffeloosheid hetzij het bezit van het wederrechtelijk verkregene te verzekeren,
      wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de
      vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel288
  - number: 288a
    text: |-
      Doodslag, gepleegd met een terroristisch oogmerk, wordt gestraft met levenslange gevangenisstraf of tijdelijke van
      ten hoogste dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel288a
  - number: '289'
    text: |-
      Hij die opzettelijk en met voorbedachten rade een ander van het leven berooft, wordt, als schuldig aan moord,
      gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel289
  - number: 289a.1
    text: |-
      De samenspanning tot het in [artikel 289][ref1] omschreven misdrijf, te begaan met een terroristisch oogmerk,
      alsmede het in [artikel 288a][ref2] omschreven misdrijf, wordt gestraft met gevangenisstraf van ten hoogste tien
      jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel289
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel288a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel289a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '289'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 288a
  - number: 289a.2
    text: |-
      [Artikel 96, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel96
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel289a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '96'
  - number: '290'
    text: |-
      De moeder die, onder de werking van vrees voor de ontdekking van haar bevalling, haar kind bij of kort na de
      geboorte opzettelijk van het leven berooft, wordt, als schuldig aan kinderdoodslag, gestraft met gevangenisstraf
      van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel290
  - number: '291'
    text: |-
      De moeder die, ter uitvoering van een onder de werking van vrees voor de ontdekking van haar aanstaande bevalling
      genomen besluit, haar kind bij of kort na de geboorte opzettelijk van het leven berooft, wordt, als schuldig aan
      kindermoord, gestraft met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel291
  - number: '292'
    text: |-
      De in de [artikelen 290][ref1] en [291][ref2] omschreven misdrijven worden ten aanzien van anderen die er aan
      deelnemen als doodslag of als moord aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel290
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel291
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel292
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '290'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '291'
  - number: '293.1'
    text: |-
      Hij die opzettelijk het leven van een ander op diens uitdrukkelijk en ernstig verlangen beëindigt, wordt gestraft
      met een gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel293
  - number: '293.2'
    text: |-
      Het in het eerste lid bedoelde feit is niet strafbaar, indien het is begaan
      door een arts die daarbij voldoet aan de zorgvuldigheidseisen, bedoeld in
      [artikel 2 van de Wet toetsing levensbeëindiging op verzoek en hulp bij zelfdoding][ref1] en hiervan mededeling
      doet aan de gemeentelijke lijkschouwer overeenkomstig [artikel 7, tweede lid, van de Wet op de lijkbezorging][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012410#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel7
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel293
    references:
      - id: ref1
        bwb_id: BWBR0012410
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '7'
  - number: '294.1'
    text: |-
      Hij die opzettelijk een ander tot zelfdoding aanzet, wordt, indien de zelfdoding volgt, gestraft met een
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel294
  - number: '294.2'
    text: |-
      Hij die opzettelijk een ander bij zelfdoding behulpzaam is of hem de middelen daartoe verschaft, wordt, indien de
      zelfdoding volgt, gestraft met een gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.
      Artikel 293, tweede lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel294
  - number: '295.1'
    text: |-
      Bij veroordeling wegens doodslag, wegens moord of wegens een der in de [artikelen 293, eerste lid][ref1], en
      [296][ref2] omschreven misdrijven, kan ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref3],
      vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel293
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel296
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel295
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '293'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '296'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '295.2'
    text: |-
      Indien de schuldige aan een der misdrijven in de [artikelen 287 tot en met 289][ref1] omschreven, het misdrijf in
      zijn beroep begaat, kan hij van de uitoefening van dat beroep worden ontzet.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel287
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel295
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '287'
  - number: '296.1'
    text: |-
      Hij die een vrouw een behandeling geeft, terwijl hij weet of redelijkerwijs moet vermoeden dat daardoor
      zwangerschap kan worden afgebroken, wordt gestraft met gevangenisstraf van ten hoogste vier jaar en zes maanden of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel296
  - number: '296.2'
    text: |-
      Indien het feit de dood van de vrouw ten gevolge heeft, wordt gevangenisstraf van ten hoogste zes jaren opgelegd of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel296
  - number: '296.3'
    text: |-
      Indien het feit is begaan zonder toestemming van de vrouw, wordt gevangenisstraf van ten hoogste twaalf jaren
      opgelegd of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel296
  - number: '296.4'
    text: |-
      Indien het feit is begaan zonder toestemming van de vrouw en tevens haar dood ten gevolge heeft, wordt
      gevangenisstraf van ten hoogste vijftien jaren opgelegd of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel296
  - number: '296.5'
    text: |-
      Het in het eerste lid bedoelde feit is niet strafbaar, indien de behandeling is verricht door een arts in een
      ziekenhuis of kliniek waarin zodanige behandeling volgens de [Wet afbreking zwangerschap][ref1] mag worden
      verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003396
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel296
    references:
      - id: ref1
        bwb_id: BWBR0003396
  - number: '300.1'
    text: Mishandeling wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel300
  - number: '300.2'
    text: |-
      Indien het feit zwaar lichamelijk letsel ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten
      hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel300
  - number: '300.3'
    text: |-
      Indien het feit de dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste zes jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel300
  - number: '300.4'
    text: Met mishandeling wordt gelijkgesteld opzettelijke benadeling van de gezondheid.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel300
  - number: '300.5'
    text: Poging tot dit misdrijf is niet strafbaar.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel300
  - number: '301.1'
    text: |-
      Mishandeling gepleegd met voorbedachten rade wordt gestraft met gevangenisstraf van ten hoogste vier jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel301
  - number: '301.2'
    text: |-
      Indien het feit zwaar lichamelijk letsel ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten
      hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel301
  - number: '301.3'
    text: |-
      Indien het feit de dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste negen jaren of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel301
  - number: '302.1'
    text: |-
      Hij die aan een ander opzettelijk zwaar lichamelijk letsel toebrengt, wordt, als schuldig aan zware mishandeling,
      gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel302
  - number: '302.2'
    text: |-
      Indien het feit de dood ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste tien
      jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel302
  - number: '303.1'
    text: |-
      Zware mishandeling gepleegd met voorbedachten rade wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren
      of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel303
  - number: '303.2'
    text: |-
      Indien het feit de dood ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste vijftien
      jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel303
  - number: '304'
    text: |-
      De in de [artikelen 300-303][ref1] bepaalde gevangenisstraffen kunnen met een derde worden verhoogd:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel300
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel304
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '300'
  - number: 304.1°
    text: |-
      ten aanzien van de schuldige die het misdrijf begaat tegen zijn moeder, zijn vader tot wie hij in
      familierechtelijke betrekking staat, zijn echtgenoot, zijn levensgezel of zijn kind;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel304
  - number: 304.2°
    text: |-
      indien het misdrijf wordt gepleegd tegen een ambtenaar gedurende of ter zake van de rechtmatige uitoefening van
      zijn bediening;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel304
  - number: 304.3°
    text: indien het misdrijf wordt gepleegd door toediening van voor het leven of de gezondheid schadelijke stoffen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel304
  - number: 304a
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 302][ref1] of [303][ref2], is begaan met een terroristisch
      oogmerk, wordt de in dat artikel bepaalde tijdelijke gevangenisstraf met de helft verhoogd en wordt, indien op het
      misdrijf een tijdelijke gevangenisstraf van ten hoogste vijftien jaren is gesteld, levenslange gevangenisstraf of
      tijdelijke van ten hoogste dertig jaren opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel302
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel303
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel304a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '302'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '303'
  - number: 304b.1
    text: |-
      De samenspanning tot het in [artikel 303][ref1] omschreven misdrijf, te begaan met een terroristisch oogmerk, wordt
      gestraft met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel303
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel304b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '303'
  - number: 304b.2
    text: |-
      [Artikel 96, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel96
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel304b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '96'
  - number: '305'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 301][ref1] en [303][ref2] omschreven misdrijven kan ontzetting van
      de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref3], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel301
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel303
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel305
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '301'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '303'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '306'
    text: |-
      Zij die opzettelijk deelnemen aan een aanval of vechterij waarin onderscheiden personen zijn gewikkeld, worden,
      behoudens ieders verantwoordelijkheid voor de bijzondere door hem bedreven feiten, gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel306
  - number: 306.1°
    text: |-
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien de aanval of vechterij
      alleen zwaar lichamelijk letsel ten gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel306
  - number: 306.2°
    text: |-
      met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, indien de aanval of vechterij
      iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel306
  - number: '307.1'
    text: |-
      Hij aan wiens schuld de dood van een ander te wijten is, wordt gestraft met gevangenisstraf van ten hoogste twee
      jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel307
  - number: '307.2'
    text: |-
      Indien de schuld bestaat in roekeloosheid, wordt hij gestraft met gevangenisstraf van ten hoogste vier jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel307
  - number: '308.1'
    text: |-
      Hij aan wiens schuld te wijten is dat een ander zwaar lichamelijk letsel bekomt of zodanig lichamelijk letsel dat
      daaruit tijdelijke ziekte of verhindering in de uitoefening van zijn ambts- of beroepsbezigheden ontstaat, wordt
      gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel308
  - number: '308.2'
    text: |-
      Indien de schuld bestaat in roekeloosheid, wordt hij gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel308
  - number: '309'
    text: |-
      Indien de in deze titel omschreven misdrijven worden gepleegd in de uitoefening van enig ambt of beroep, kan de
      gevangenisstraf met een derde worden verhoogd, kan ontzetting worden uitgesproken van de uitoefening van het beroep
      waarin het misdrijf is gepleegd, en kan de rechter de openbaarmaking van zijn uitspraak gelasten.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel309
  - number: '310'
    text: |-
      Hij die enig goed dat geheel of ten dele aan een ander toebehoort wegneemt, met het oogmerk om het zich
      wederrechtelijk toe te eigenen, wordt, als schuldig aan diefstal, gestraft met gevangenisstraf van ten hoogste vier
      jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel310
  - number: '311.1'
    text: 'Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel311
  - number: 311.1.1°
    text: diefstal van vee uit de weide;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel311
  - number: 311.1.2°
    text: |-
      diefstal bij gelegenheid van brand, ontploffing, watersnood, schipbreuk, stranding, spoorwegongeval, oproer,
      muiterij of oorlogsnood;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel311
  - number: 311.1.3°
    text: |-
      diefstal gedurende de voor de nachtrust bestemde tijd, in een woning of op een besloten erf waarop een woning
      staat, door iemand die zich aldaar buiten weten of tegen de wil van de rechthebbende bevindt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel311
  - number: 311.1.4°
    text: diefstal door twee of meer verenigde personen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel311
  - number: 311.1.5°
    text: |-
      diefstal waarbij de schuldige zich de toegang tot de plaats van het misdrijf heeft verschaft of het weg te nemen
      goed onder zijn bereik heeft gebracht door middel van braak, verbreking of inklimming, van valse sleutels, van een
      valse order of een vals kostuum;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel311
  - number: 311.1.6°
    text: diefstal met het oogmerk om een terroristisch misdrijf voor te bereiden of gemakkelijk te maken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel311
  - number: '311.2'
    text: |-
      Indien de onder 3° omschreven diefstal vergezeld gaat van een der in onder 4° en 5° vermelde omstandigheden, wordt
      gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel311
  - number: '312.1'
    text: |-
      Met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie wordt gestraft diefstal,
      voorafgegaan, vergezeld of gevolgd van geweld of bedreiging met geweld tegen personen, gepleegd met het oogmerk om
      die diefstal voor te bereiden of gemakkelijk te maken, of om, bij betrapping op heter daad, aan zichzelf of andere
      deelnemers aan het misdrijf hetzij de vlucht mogelijk te maken, hetzij het bezit van het gestolene te verzekeren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel312
  - number: '312.2'
    text: 'Gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie wordt opgelegd:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel312
  - number: 312.2.1°
    text: |-
      indien het feit wordt gepleegd hetzij gedurende de voor de nachtrust bestemde tijd in een woning of op een besloten
      erf waarop een woning staat; hetzij op de openbare weg; hetzij in een spoortrein die in beweging is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel312
  - number: 312.2.2°
    text: indien het feit wordt gepleegd door twee of meer verenigde personen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel312
  - number: 312.2.3°
    text: |-
      indien de schuldige zich de toegang tot de plaats van het misdrijf heeft verschaft door middel van braak of
      inklimming, van valse sleutels, van een valse order of een vals kostuum;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel312
  - number: 312.2.4°
    text: indien het feit zwaar lichamelijk letsel ten gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel312
  - number: 312.2.5°
    text: |-
      indien het feit wordt gepleegd met het oogmerk om een terroristisch misdrijf voor te bereiden of gemakkelijk te
      maken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel312
  - number: '312.3'
    text: |-
      Gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie wordt opgelegd, indien het feit
      de dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel312
  - number: '313'
    text: |-
      Bij veroordeling wegens diefstal kan ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1],
      vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel313
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '314.1'
    text: |-
      Hij die, zonder geweld of bedreiging met geweld tegen personen, geheel of ten dele aan een ander toebehorende klei,
      bagger, ongesneden veen, zand, aarde, grind, puin, mestspeciën, zoden, plaggen, heide, helm, wier, riet, biezen,
      mos, onbewerkt en niet vervoerd hak- of sprokkelhout, ongeplukte of afgevallen boomvruchten of bladeren, te veld
      staand gras of te veld staande of na de oogst achtergebleven veldvruchten wegneemt, met het oogmerk om zich die
      voorwerpen wederrechtelijk toe te eigenen, wordt, als schuldig aan stroperij, gestraft met gevangenisstraf van ten
      hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel314
  - number: '314.2'
    text: |-
      Indien tijdens het plegen van het misdrijf nog geen twee jaren zijn verlopen sedert een vroegere veroordeling van
      de schuldige wegens gelijk misdrijf onherroepelijk is geworden, wordt hij gestraft met gevangenisstraf van ten
      hoogste twee maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel314
  - number: '315.1'
    text: 'Met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel315
  - number: 315.1.1°
    text: stroperij gepleegd met behulp van vaartuigen, wagens, trek- of lastdieren;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel315
  - number: 315.1.2°
    text: |-
      stroperij gepleegd onder een of meer der in [artikel 311, eerste lid, onder 2°-5°][ref1], vermelde
      omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel311
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel315
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '311'
  - number: '315.2'
    text: |-
      Ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten kan worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel315
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '316.1'
    text: |-
      Indien de dader van of medeplichtige aan een der in deze titel omschreven misdrijven de niet van tafel en bed of
      van goederen gescheiden echtgenoot is van hem tegen wie het misdrijf is gepleegd, is de strafvervolging tegen die
      dader of die medeplichtige uitgesloten.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel316
  - number: '316.2'
    text: |-
      Indien hij zijn van tafel en bed of van goederen gescheiden echtgenoot is of zijn bloed- of aanverwant, hetzij in
      de rechte linie, hetzij in de tweede graad van de zijlinie, heeft de vervolging, voor zover hem betreft, alleen
      plaats op een tegen hem gerichte klacht van degene tegen wie het misdrijf is gepleegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel316
  - number: '316.3'
    text: |-
      Indien het vorige lid van toepassing is, neemt de termijn bedoeld in [artikel 66][ref1] een aanvang op de dag nadat
      de identiteit van de verdachte aan de tot de klacht gerechtigde bekend werd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel66
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel316
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '66'
  - number: '317.1'
    text: |-
      Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen, door geweld of bedreiging met geweld
      iemand dwingt hetzij tot de afgifte van enig goed dat geheel of ten dele aan deze of aan een derde toebehoort,
      hetzij tot het aangaan van een schuld of het teniet doen van een inschuld, hetzij tot het ter beschikking stellen
      van gegevens, wordt, als schuldig aan afpersing, gestraft met gevangenisstraf van ten hoogste negen jaren of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel317
  - number: '317.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die de dwang, bedoeld in het eerste lid, uitoefent door de bedreiging dat
      gegevens die door middel van een geautomatiseerd werk zijn opgeslagen, onbruikbaar of ontoegankelijk zullen worden
      gemaakt of zullen worden gewist.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel317
  - number: '317.3'
    text: |-
      De bepalingen van het [tweede en derde lid van artikel 312][ref1] zijn op dit misdrijf van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel312
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel317
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '312'
  - number: '318.1'
    text: |-
      Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen, door bedreiging met smaad,
      smaadschrift of openbaring van een geheim iemand dwingt hetzij tot de afgifte van enig goed dat geheel of ten dele
      aan deze of aan een derde toebehoort, hetzij tot het aangaan van een schuld of het teniet doen van een inschuld,
      hetzij tot het ter beschikking stellen van gegevens met geldswaarde in het handelsverkeer, wordt als schuldig aan
      afdreiging, gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel318
  - number: '318.2'
    text: Dit misdrijf wordt niet vervolgd dan op klacht van hem tegen wie het gepleegd is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel318
  - number: '319'
    text: |-
      De bepaling van [artikel 316][ref1] is op de in deze titel omschreven misdrijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel316
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel319
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '316'
  - number: '320'
    text: |-
      Bij veroordeling wegens een der in deze titel omschreven misdrijven, kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel320
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '321'
    text: |-
      Hij die opzettelijk enig goed dat geheel of ten dele aan een ander toebehoort en dat hij anders dan door
      misdrijf onder zich heeft, wederrechtelijk zich toeëigent, wordt, als schuldig aan verduistering, gestraft met
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel321
  - number: '322'
    text: |-
      Verduistering gepleegd door hem die het goed uit hoofde van zijn persoonlijke dienstbetrekking of van zijn beroep,
      of tegen geldelijke vergoeding onder zich heeft, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel322
  - number: '323'
    text: |-
      Verduistering gepleegd door hem wie het goed uit noodzaak in bewaring is gegeven, of door voogden, curators,
      bewindvoerders, executeurs van een nalatenschap, door de rechter benoemde vereffenaars van een nalatenschap of
      gemeenschap of beheerders van instellingen van weldadigheid of van stichtingen, ten opzichte van enig goed dat zij
      als zodanig onder zich hebben, wordt gestraft met gevangenisstraf van ten hoogste vijf jaren of geldboete van de
      vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel323
  - number: 323a
    text: |-
      Hij die opzettelijk en wederrechtelijk een subsidie die met een bepaald doel door of vanwege de Europese
      Gemeenschappen is verstrekt, aanwendt voor andere doeleinden dan waarvoor zij is verstrekt, wordt gestraft met
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel323a
  - number: '324'
    text: |-
      De bepaling van [artikel 316][ref1] is op de in deze titel omschreven misdrijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel316
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel324
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '316'
  - number: '325.1'
    text: |-
      Bij veroordeling wegens een der in deze titel omschreven misdrijven, kan de rechter de openbaarmaking van zijn
      uitspraak gelasten en ontzetting uitspreken van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1],
      vermelde rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel325
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '325.2'
    text: Indien de schuldige het misdrijf in zijn beroep begaat, kan hij van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel325
  - number: '326'
    text: |-
      Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen, hetzij door het aannemen van een
      valse naam of van een valse hoedanigheid, hetzij door listige kunstgrepen, hetzij door een samenweefsel van
      verdichtsels, iemand beweegt tot de afgifte van enig goed, tot het ter beschikking stellen van gegevens met
      geldswaarde in het handelsverkeer, tot het aangaan van een schuld of tot het teniet doen van een inschuld, wordt,
      als schuldig aan oplichting, gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel326
  - number: 326a
    text: |-
      Hij die een beroep of een gewoonte maakt van het kopen van goederen met het oogmerk om zonder volledige betaling
      zich of een ander de beschikking over die goederen te verzekeren, wordt gestraft met gevangenisstraf van ten
      hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel326a
  - number: 326b
    text: 'Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vijfde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel326b
  - number: 326b.1°
    text: |-
      hij die op of in een werk van letterkunde, wetenschap, kunst of nijverheid valselijk enige naam of enig teken
      plaatst, of de echte naam of het echte teken vervalst, met het oogmerk om daardoor aannemelijk te maken, dat dat
      werk zou zijn van de hand van degene wiens naam of teken hij daarop of daarin aanbracht;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel326b
  - number: 326b.2°
    text: |-
      hij die opzettelijk een werk van letterkunde, wetenschap, kunst of nijverheid, waarop of waarin valselijk enige
      naam of enig teken is geplaatst, of de echte naam of het echte teken is vervalst, verkoopt, te koop aanbiedt,
      aflevert, ten verkoop in voorraad heeft of binnen het Rijk in Europa invoert, als ware dat werk van de hand van
      degene wiens naam of teken daarop of daarin valselijk is aangebracht.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel326b
  - number: 326c.1
    text: |-
      Hij die, met het oogmerk daarvoor niet volledig te betalen, door een technische ingreep of met behulp van valse
      signalen, gebruik maakt van een dienst die via telecommunicatie aan het publiek wordt aangeboden, wordt gestraft
      met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel326c
  - number: 326c.2
    text: |-
      Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft hij die
      opzettelijk een voorwerp dat kennelijk is bestemd, of gegevens die kennelijk zijn bestemd, tot het plegen van het
      misdrijf, bedoeld in het eerste lid,
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel326c
  - number: 326c.2.a
    text: openlijk ter verspreiding aanbiedt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel326c
  - number: 326c.2.b
    text: ter verspreiding of met het oog op de invoer in Nederland voorhanden heeft of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel326c
  - number: 326c.2.c
    text: uit winstbejag vervaardigt of bewaart.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel326c
  - number: 326c.3
    text: |-
      Hij die van het plegen van misdrijven als bedoeld in het tweede lid, zijn beroep maakt of het plegen van deze
      misdrijven als bedrijf uitoefent wordt gestraft hetzij met gevangenisstraf van ten hoogste vier jaren en geldboete
      van de vijfde categorie, hetzij met één van deze straffen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel326c
  - number: '327'
    text: |-
      Hij die door listige kunstgrepen de verzekeraar in dwaling brengt ten opzichte van omstandigheden tot de
      verzekering betrekking hebbende, zodat deze een overeenkomst sluit die hij niet of niet onder dezelfde voorwaarden
      zou hebben gesloten indien hij de ware staat van zaken gekend had, wordt gestraft met gevangenisstraf van ten
      hoogste een jaar of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel327
  - number: '328'
    text: |-
      Hij die, met het oogmerk om zich of een ander, ten nadele van de verzekeraar, wederrechtelijk te bevoordelen, brand
      sticht of een ontploffing teweegbrengt in enig tegen brandgevaar verzekerd goed, of een vaartuig of luchtvaartuig
      dat verzekerd is of waarvan de zich aan boord bevindende zaken of de te verdienen vracht zijn verzekerd, doet
      zinken, stranden of verongelukken, vernielt, onbruikbaar maakt of beschadigt, wordt gestraft met gevangenisstraf
      van ten hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel328
  - number: 328bis
    text: |-
      Hij die, om het handels- of bedrijfsdebiet van zichzelf of van een ander te vestigen, te behouden of uit te
      breiden, enige bedrieglijke handeling pleegt tot misleiding van het publiek of van een bepaald persoon, wordt,
      indien daaruit enig nadeel voor concurrenten van hem of van die ander kan ontstaan, als schuldig aan oneerlijke
      mededinging, gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel328bis
  - number: 328ter.1
    text: |-
      Hij die, anders dan als ambtenaar, werkzaam zijnde in dienstbetrekking of optredend als lasthebber, naar aanleiding
      van hetgeen hij in zijn betrekking of bij de uitvoering van zijn last heeft gedaan of nagelaten dan wel zal doen
      of nalaten, een gift of belofte aanneemt en dit aannemen in strijd met de goede trouw verzwijgt tegenover zijn
      werkgever of lastgever, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel328ter
  - number: 328ter.2
    text: |-
      Met gelijke straf wordt gestraft hij die aan iemand die, anders dan als ambtenaar, werkzaam is in dienstbetrekking
      of optreedt als lasthebber, naar aanleiding van hetgeen deze in zijn betrekking of bij de uitvoering van zijn last
      heeft gedaan of nagelaten dan wel zal doen of nalaten, een gift of belofte doet van die aard of onder zodanige
      omstandigheden, dat hij redelijkerwijs moet aannemen dat deze de gift of belofte in strijd met de goede trouw zal
      verzwijgen tegenover zijn werkgever of lastgever.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel328ter
  - number: 328quater.1
    text: |-
      Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie wordt gestraft hij die een gift
      of een belofte aanneemt naar aanleiding van hetgeen hij heeft gedaan of nagelaten dan wel zal doen of nalaten in
      verband met een op hem of op de persoon bij wie hij in dienst is, rustende wettelijke plicht tot
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel328quater
  - number: 328quater.1.a
    text: het verstrekken van inlichtingen betreffende telecommunicatie aan de ambtenaren van de justitie of politie, dan wel
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel328quater
  - number: 328quater.1.b
    text: het verlenen van medewerking aan het aftappen of opnemen van telecommunicatie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel328quater
  - number: 328quater.2
    text: |-
      Met gelijke straf wordt gestraft hij die een ander een gift of een belofte doet naar aanleiding van hetgeen deze
      heeft gedaan of nagelaten dan wel zal doen of nalaten in verband met een op hem of op de persoon bij wie hij in
      dienst is, rustende wettelijke plicht als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel328quater
  - number: '329'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie wordt gestraft de verkoper die de
      koper bedriegt:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel329
  - number: 329.1°
    text: door hem die een bepaald aangewezen voorwerp kocht, opzettelijk iets anders daarvoor in de plaats te leveren;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel329
  - number: 329.2°
    text: |-
      ten opzichte van de aard, de hoedanigheid of de hoeveelheid van het geleverde, door het aanwenden van listige
      kunstgrepen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel329
  - number: 329bis
    text: |-
      De houder van een cognossement die opzettelijk over verschillende exemplaren daarvan onder bezwarende titel
      beschikt ten behoeve van verschillende verkrijgers, wordt gestraft met gevangenisstraf van ten hoogste twee jaren
      of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel329bis
  - number: '330.1'
    text: |-
      Hij die eet- of drinkwaren of geneesmiddelen verkoopt, te koop aanbiedt of aflevert, wetende dat zij vervalst zijn
      en die vervalsing verzwijgende, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de
      vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel330
  - number: '330.2'
    text: |-
      Eet- of drinkwaren of geneesmiddelen zijn vervalst wanneer door bijmenging van vreemde bestanddelen hun waarde of
      hun bruikbaarheid verminderd is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel330
  - number: '331.1'
    text: |-
      Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie wordt gestraft de aannemer of de
      bouwmeester van enig werk of de verkoper van bouwmaterialen die bij de uitvoering van het werk of de levering van
      de materialen enige bedrieglijke handeling pleegt, ten gevolge waarvan de veiligheid van personen of goederen of de
      veiligheid van de staat in tijd van oorlog kan worden in gevaar gebracht.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel331
  - number: '331.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die, met het opzicht over het werk of over de levering van de materialen
      belast, de bedrieglijke handeling opzettelijk toelaat.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel331
  - number: '332.1'
    text: |-
      Hij die, bij levering van benodigdheden ten dienste van de vloot of het leger, enige bedrieglijke handeling pleegt,
      ten gevolge waarvan de veiligheid van de staat in tijd van oorlog kan worden in gevaar gebracht, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel332
  - number: '332.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die, met het opzicht over de levering van de goederen belast, de bedrieglijke
      handeling opzettelijk toelaat.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel332
  - number: '333'
    text: |-
      Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen, hetgeen tot afbakening van de grenzen
      van erven dient vernielt, verplaatst, verwijdert of onbruikbaar maakt, wordt gestraft met gevangenisstraf van ten
      hoogste twee jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel333
  - number: '334'
    text: |-
      Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen, door het verspreiden van een
      leugenachtig bericht de prijs van koopwaren, fondsen of geldswaardig papier doet stijgen of dalen, wordt gestraft
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel334
  - number: '336'
    text: |-
      De koopman, de bestuurder, beherende vennoot of commissaris van een rechtspersoon of vennootschap, die opzettelijk
      een onware staat of een onware balans, winst- en verliesrekening, staat van baten en lasten of toelichting op een
      van die stukken openbaar maakt of zodanige openbaarmaking opzettelijk toelaat, wordt gestraft met gevangenisstraf
      van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel336
  - number: '337.1'
    text: 'Hij die opzettelijk:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel337
  - number: 337.1.a
    text: valse, vervalste of wederrechtelijk vervaardigde merken,
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel337
  - number: 337.1.b
    text: |-
      waren, die zelf of op hun verpakking valselijk zijn voorzien van de handelsnaam van een ander of van het merk
      waarop een ander recht heeft,
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel337
  - number: 337.1.c
    text: |-
      waren, die ter aanduiding van herkomst, valselijk van de naam van een bepaalde plaats, met bijvoeging van een
      verdichte handelsnaam, zijn voorzien,
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel337
  - number: 337.1.d
    text: |-
      waren, waarop of op de verpakking waarvan een handelsnaam van een ander of een merk waarop een ander recht heeft,
      zij het dan ook met een geringe afwijking, is nagebootst of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel337
  - number: 337.1.e
    text: |-
      waren of onderdelen daarvan die valselijk hetzelfde uiterlijk vertonen als een tekening of model waarop een ander
      recht heeft, dan wel daarmede slechts ondergeschikte verschillen vertonen,
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel337
  - number: '337.2'
    text: |-
      Niet strafbaar is hij die enkele waren, onderdelen daarvan of merken als omschreven in het eerste lid in voorraad
      heeft uitsluitend voor eigen gebruik.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel337
  - number: '337.3'
    text: |-
      Indien de schuldige van het plegen van het misdrijf, genoemd in het eerste lid, zijn beroep maakt of het plegen van
      dit misdrijf als bedrijf uitoefent, wordt hij gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete
      van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel337
  - number: '337.4'
    text: |-
      Indien door het plegen van het misdrijf, genoemd in het eerste lid, gemeen gevaar voor personen of goederen te
      duchten is, wordt de schuldige gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel337
  - number: '338'
    text: |-
      De bepaling van [artikel 316][ref1] is op de in deze titel omschreven misdrijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel316
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel338
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '316'
  - number: '339.1'
    text: |-
      Bij veroordeling wegens een der in deze titel omschreven misdrijven, kan de rechter de openbaarmaking van zijn
      uitspraak gelasten en de schuldige worden ontzet van de uitoefening van het beroep waarin hij het misdrijf begaan
      heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel339
  - number: '339.2'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 326][ref1], [328][ref2], [331][ref3] en [332][ref4] omschreven
      misdrijven kan ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref5], vermelde rechten worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel326
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel328
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel331
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel332
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel339
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '326'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '328'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '331'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '332'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '340'
    text: |-
      Hij die in staat van faillissement is verklaard, wordt, als schuldig aan eenvoudige bankbreuk, gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel340
  - number: 340.1°
    text: indien zijn verteringen buitensporig zijn geweest;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel340
  - number: 340.2°
    text: |-
      indien hij, met het oogmerk om zijn faillissement uit te stellen, wetende dat het daardoor niet kon worden
      voorkomen, op bezwarende voorwaarden geldopnemingen heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel340
  - number: 340.3°
    text: |-
      indien hij de boeken, bescheiden en andere gegevensdragers waarmee hij ingevolge
      [artikel 15i van Boek 3 van het Burgerlijk Wetboek][ref1] een administratie gevoerd heeft en de boeken, bescheiden
      en andere gegevensdragers die hij ingevolge dat artikel bewaard heeft, niet in ongeschonden staat te voorschijn
      brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15i
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel340
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15i
  - number: '341'
    text: |-
      Als schuldig aan bedrieglijke bankbreuk wordt gestraft hetzij met gevangenisstraf van ten hoogste zes jaren en
      geldboete van de vijfde categorie, hetzij met één van deze straffen, hij:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel341
  - number: 341.a
    text: |-
      die in staat van faillissement is verklaard, indien hij ter bedrieglijke verkorting van de rechten van zijn
      schuldeisers:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel341
  - number: 341.a.1°
    text: |-
      hetzij lasten verdicht heeft of verdicht, hetzij baten niet verantwoord heeft of niet verantwoordt, hetzij enig
      goed aan de boedel onttrokken heeft of onttrekt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel341
  - number: 341.a.2°
    text: enig goed hetzij om niet, hetzij klaarblijkelijk beneden de waarde heeft vervreemd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel341
  - number: 341.a.3°
    text: |-
      ter gelegenheid van zijn faillissement of op een tijdstip waarop hij wist dat het faillissement niet kon worden
      voorkomen, een van zijn schuldeisers op enige wijze bevoordeeld heeft of bevoordeelt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel341
  - number: 341.a.4°
    text: |-
      niet voldaan heeft of niet voldoet aan de op hem rustende verplichtingen ten opzichte van het voeren van een
      administratie ingevolge [artikel 15i van Boek 3 van het Burgerlijk Wetboek][ref1], en het bewaren en te voorschijn
      brengen van boeken, bescheiden en gegevensdragers in [dat artikel][ref2] bedoeld;


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15i
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15i
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel341
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15i
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15i
  - number: 341.b
    text: |-
      te wiens aanzien de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, indien hij ter
      bedrieglijke verkorting van de rechten die zijn schuldeisers jegens de boedel kunnen doen gelden:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel341
  - number: 341.b.1°
    text: |-
      hetzij lasten verdicht heeft of verdicht, hetzij baten niet verantwoord heeft of niet verantwoordt, hetzij enig
      goed aan de boedel onttrokken heeft of onttrekt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel341
  - number: 341.b.2°
    text: enig goed hetzij om niet, hetzij klaarblijkelijk beneden de waarde heeft vervreemd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel341
  - number: 341.b.3°
    text: |-
      ter gelegenheid van de toepassing van de schuldsaneringsregeling natuurlijke personen of op een tijdstip waarop hij
      wist dat hij niet zou kunnen voortgaan met het betalen van zijn schulden, een van zijn schuldeisers op enige wijze
      bevoordeeld heeft of bevoordeelt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel341
  - number: 341.b.4°
    text: |-
      niet voldaan heeft of niet voldoet aan de op hem rustende verplichtingen ten opzichte van het voeren van een
      administratie ingevolge [artikel 15i van Boek 3 van het Burgerlijk Wetboek][ref1], en het bewaren en te voorschijn
      brengen van boeken, bescheiden en gegevensdragers in [dat artikel][ref2] bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15i
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15i
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel341
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15i
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15i
  - number: '342'
    text: |-
      De bestuurder of commissaris van een rechtspersoon welke in staat van faillissement is verklaard, wordt gestraft
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel342
  - number: 342.1°
    text: |-
      indien hij heeft medegewerkt of zijn toestemming gegeven tot enige handeling, in strijd met enige wettige bepaling
      van statuten of reglementen, waaraan de door de rechtspersoon geleden verliezen geheel of grotendeels zijn te
      wijten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel342
  - number: 342.2°
    text: |-
      indien hij, met het oogmerk om het faillissement van de rechtspersoon uit te stellen, wetende dat het daardoor niet
      kon worden voorkomen, heeft medegewerkt of zijn toestemming gegeven tot het doen van geldopnemingen op bezwarende
      voorwaarden;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel342
  - number: 342.3°
    text: |-
      indien aan hem te wijten is, dat aan de in [artikel 10, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1],
      [artikel 15i, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref2] of
      [artikel 5, eerste lid, van de Wet op de formeel buitenlandse vennootschappen][ref3] in samenhang met
      [artikel 10, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref4] omschreven verplichtingen niet is voldaan of
      dat de boeken, bescheiden en andere gegevensdragers, waarmee volgens die artikelen administratie gevoerd is, en de
      boeken, bescheiden en andere gegevensdragers die ingevolge die artikelen zijn bewaard, niet in ongeschonden staat
      worden te voorschijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15i
      [ref3]: https://wetten.overheid.nl/BWBR0009191#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel10
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel342
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15i
      - id: ref3
        bwb_id: BWBR0009191
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '10'
  - number: '343'
    text: |-
      De bestuurder of commissaris van een rechtspersoon welke in staat van faillissement is verklaard, wordt gestraft
      met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie, indien hij ter bedrieglijke
      verkorting van de rechten der schuldeisers van de rechtspersoon:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel343
  - number: 343.1°
    text: |-
      hetzij lasten verdicht heeft of verdicht, hetzij baten niet verantwoord heeft of niet verantwoordt, hetzij enig
      goed aan de boedel onttrokken heeft of onttrekt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel343
  - number: 343.2°
    text: enig goed hetzij om niet, hetzij klaarblijkelijk beneden de waarde heeft vervreemd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel343
  - number: 343.3°
    text: |-
      ter gelegenheid van het faillissement of op een tijdstip waarop hij wist dat het faillissement niet kon worden
      voorkomen, een van de schuldeisers op enige wijze bevoordeeld heeft of bevoordeelt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel343
  - number: 343.4°
    text: |-
      niet voldaan heeft of niet voldoet aan de op hem rustende verplichtingen ten opzichte van het voeren
      van een administratie ingevolge [artikel 10, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1],
      [artikel 15i, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref2] of
      [artikel 5, eerste lid, van de Wet op de formeel buitenlandse vennootschappen][ref3] in samenhang met
      [artikel 10, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref4], en het bewaren en te voorschijn brengen van
      boeken, bescheiden en andere gegevensdragers in die artikelen bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15i
      [ref3]: https://wetten.overheid.nl/BWBR0009191#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel10
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel343
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15i
      - id: ref3
        bwb_id: BWBR0009191
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '10'
  - number: '344'
    text: |-
      Hetzij met gevangenisstraf van ten hoogste vier jaren en zes maanden en geldboete van de vijfde categorie, hetzij
      met één van deze straffen wordt gestraft hij die:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel344
  - number: 344.1°
    text: |-
      in geval van faillissement, of in het vooruitzicht daarvan, indien het faillissement is gevolgd, ter bedrieglijke
      verkorting van de rechten der schuldeisers, enig goed aan de boedel onttrekt, of betaling aanneemt, hetzij van een
      niet opeisbare schuld, hetzij van een opeisbare schuld, in het laatste geval wetende dat het faillissement van de
      schuldenaar reeds was aangevraagd of ten gevolge van overleg met de schuldenaar;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel344
  - number: 344.2°
    text: |-
      bij verificatie van de schuldvorderingen in geval van faillissement, een niet bestaande schuldvordering voorwendt
      of een bestaande tot een verhoogd bedrag doet gelden;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel344
  - number: 344.3°
    text: |-
      in geval de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, of in het vooruitzicht
      daarvan, indien de toepassing wordt uitgesproken, ter bedrieglijke verkorting van de rechten die de schuldeisers
      jegens de boedel kunnen doen gelden, enig goed aan de boedel onttrekt, of betaling aanneemt op een vordering ten
      aanzien waarvan de schuldsaneringsregeling werkt, hetzij niet opeisbaar, hetzij opeisbaar, in het laatste geval
      wetende dat het verzoek tot het van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen reeds
      was ingediend of tengevolge van overleg met de schuldenaar;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel344
  - number: 344.4°
    text: |-
      bij de verificatie van vorderingen in de schuldsaneringsregeling natuurlijke personen, een niet bestaande
      schuldvordering voorwendt of een bestaande tot een verhoogd bedrag doet gelden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel344
  - number: '345.1'
    text: |-
      De schuldeiser die tot een aangeboden gerechtelijk akkoord toetreedt ten gevolge van een overeenkomst hetzij met de
      schuldenaar, hetzij met een derde, waarbij hij bijzondere voordelen heeft bedongen, wordt, in geval van aanneming
      van het akkoord, gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel345
  - number: '345.2'
    text: |-
      Gelijke straf wordt in hetzelfde geval toegepast op de schuldenaar of, indien deze een rechtspersoon is, op de
      bestuurder of commissaris, die zodanige overeenkomst sluit.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel345
  - number: '347'
    text: |-
      De bestuurder of commissaris van een rechtspersoon die, buiten het geval van [artikel 342][ref1], zijn medewerking
      heeft verleend of zijn toestemming gegeven tot enige handeling in strijd met enige wettige bepaling van de statuten
      of reglementen, tengevolge waarvan de rechtspersoon ernstig nadeel ondervindt, wordt gestraft met geldboete van de
      vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel342
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel347
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '342'
  - number: '348.1'
    text: |-
      Hij die opzettelijk zijn eigen goed of, ten behoeve van degene aan wie het toebehoort, een hem niet toebehorend
      goed onttrekt aan een pandrecht, een retentierecht of een recht van vruchtgebruik of gebruik van een ander, wordt
      gestraft met een gevangenisstraf van ten hoogste een jaar en zes maanden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel348
  - number: '348.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die opzettelijk een goed dat is onderworpen aan een pandrecht, een
      retentierecht of een recht van vruchtgebruik of gebruik van een ander, vernielt, beschadigt of onbruikbaar maakt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel348
  - number: '348.3'
    text: |-
      De bepaling van [artikel 316][ref1] is op deze misdrijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel316
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel348
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '316'
  - number: '349.1'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 341][ref1], [343][ref2] en [344][ref3] omschreven misdrijven, kan
      de schuldige worden ontzet van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref4], vermelde rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel341
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel343
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel344
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel349
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '341'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '343'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '344'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '349.2'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 340-345][ref1] omschreven misdrijven, kan openbaarmaking van de
      rechterlijke uitspraak worden gelast.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel340
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel349
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '340'
  - number: '350.1'
    text: |-
      Hij die opzettelijk en wederrechtelijk enig goed dat geheel of ten dele aan een ander toebehoort, vernielt,
      beschadigt, onbruikbaar maakt of wegmaakt, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel350
  - number: '350.2'
    text: |-
      Gelijke straf wordt toegepast op hem die opzettelijk en wederrechtelijk een dier dat geheel of ten dele aan een
      ander toebehoort, doodt, beschadigt, onbruikbaar maakt of wegmaakt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel350
  - number: 350a.1
    text: |-
      Hij die opzettelijk en wederrechtelijk gegevens die door middel van een geautomatiseerd werk of door middel van
      telecommunicatie zijn opgeslagen, worden verwerkt of overgedragen, verandert, wist, onbruikbaar of ontoegankelijk
      maakt, dan wel andere gegevens daaraan toevoegt, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel350a
  - number: 350a.2
    text: |-
      Hij die het feit, bedoeld in het eerste lid, pleegt na door tussenkomst van een openbaar telecommunicatienetwerk,
      wederrechtelijk in een geautomatiseerd werk te zijn binnengedrongen en daar ernstige schade met betrekking tot
      die gegevens veroorzaakt, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel350a
  - number: 350a.3
    text: |-
      Hij die opzettelijk en wederrechtelijk gegevens ter beschikking stelt of verspreidt die zijn bestemd om schade aan
      te richten in een geautomatiseerd werk, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete
      van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel350a
  - number: 350a.4
    text: |-
      Niet strafbaar is degeen die het feit, bedoeld in het derde lid, pleegt met het oogmerk om schade als gevolg van
      deze gegevens te beperken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel350a
  - number: 350b.1
    text: |-
      Hij aan wiens schuld te wijten is dat gegevens die door middel van een geautomatiseerd werk of door middel van
      telecommunicatie zijn opgeslagen, worden verwerkt of overgedragen, wederrechtelijk worden veranderd, gewist,
      onbruikbaar of ontoegankelijk gemaakt, dan wel dat andere gegevens daaraan worden toegevoegd, wordt, indien
      daardoor ernstige schade met betrekking tot die gegevens wordt veroorzaakt, gestraft met gevangenisstraf of
      hechtenis van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel350b
  - number: 350b.2
    text: |-
      Hij aan wiens schuld te wijten is dat gegevens wederrechtelijk ter beschikking gesteld of verspreid worden die zijn
      bestemd om schade aan te richten in een geautomatiseerd werk, wordt gestraft met gevangenisstraf of hechtenis van
      ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel350b
  - number: '351'
    text: |-
      Hij die spoorweg- of elektriciteitswerken, geautomatiseerde werken of werken voor telecommunicatie, werken dienend
      tot waterkering, waterlozing, gas- of waterleiding of riolering, voor zover deze werken ten algemenen nutte
      gebezigd worden, dan wel goederen of werken ten behoeve van de landsverdediging, opzettelijk en wederrechtelijk
      vernielt, beschadigt, onbruikbaar maakt, onklaar maakt of weg maakt, wordt gestraft met gevangenisstraf van ten
      hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel351
  - number: 351bis
    text: |-
      Hij aan wiens schuld te wijten is dat enig in het vorig artikel bedoeld goed of werk, vernield, beschadigd,
      onbruikbaar gemaakt, onklaar gemaakt of weggemaakt wordt, wordt gestraft met hechtenis van ten hoogste een maand of
      geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel351bis
  - number: '352'
    text: |-
      Hij die opzettelijk en wederrechtelijk enig gebouw, vaartuig of zijn lading, installatie ter zee of luchtvaartuig
      dat geheel of ten dele aan een ander toebehoort, vernielt, beschadigt, onbruikbaar maakt of onklaar maakt, wordt
      gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel352
  - number: '353'
    text: |-
      De bepaling van [artikel 316][ref1] is op de in deze titel omschreven misdrijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel316
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel353
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '316'
  - number: '354'
    text: |-
      Indien een der in deze titel omschreven misdrijven arglistig gepleegd wordt, of daarvan levensgevaar voor een ander
      is te duchten, kan de gevangenisstraf met een derde worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel354
  - number: '355'
    text: |-
      Met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, worden gestraft de hoofden van
      ministeriële departementen:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel355
  - number: 355.1°
    text: |-
      die hun medeondertekening verlenen aan koninklijke besluiten of koninklijke beschikkingen, wetende dat daardoor de
      [Grondwet][ref1] of andere wetten of algemene maatregelen van inwendig bestuur van de staat worden geschonden;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel355
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 355.2°
    text: |-
      die uitvoering geven aan koninklijke besluiten of koninklijke beschikkingen, wetende dat deze niet van de vereiste
      medeondertekening van een der hoofden van de ministeriële departementen zijn voorzien;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel355
  - number: 355.3°
    text: |-
      die beschikkingen nemen of bevelen geven of bestaande beschikkingen of bevelen handhaven, wetende dat daardoor de
      [Grondwet][ref1] of andere wetten of algemene maatregelen van inwendig bestuur van de staat worden geschonden;


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel355
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 355.4°
    text: |-
      die opzettelijk nalaten uitvoering te geven aan de bepalingen van de [Grondwet][ref1] of andere wetten of algemene
      maatregelen van inwendig bestuur van de staat, voor zover die uitvoering wegens de aard van het onderwerp tot hun
      ministeriële departementen behoort of uitdrukkelijk hun is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel355
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '356'
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie worden gestraft de hoofden van
      ministeriële departementen aan wier grove schuld te wijten is dat de in [artikel 355, onder 4°][ref1], omschreven
      uitvoering wordt nagelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel355
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel356
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '355'
  - number: '357'
    text: |-
      De bevelhebber van de gewapende macht die weigert of opzettelijk nalaat op de wettige vordering van het bevoegde
      burgerlijk gezag de onder zijn bevel staande macht aan te wenden, wordt gestraft met gevangenisstraf van ten
      hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel357
  - number: '358.1'
    text: |-
      De ambtenaar die opzettelijk de bijstand van de gewapende macht inroept tegen de uitvoering van wettelijke
      voorschriften, van wettige bevelen van het openbaar gezag of van rechterlijke uitspraken of bevelschriften, wordt
      gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel358
  - number: '358.2'
    text: |-
      Indien die uitvoering daardoor wordt verhinderd, wordt de schuldige gestraft met gevangenisstraf van ten hoogste
      negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel358
  - number: '359'
    text: |-
      De ambtenaar of een ander met enige openbare dienst voortdurend of tijdelijk belast persoon, die opzettelijk
      geld of geldswaardig papier dat hij in zijn bediening onder zich heeft, verduistert of toelaat dat het door een
      ander weggenomen of verduisterd wordt, of die ander daarbij als medeplichtige ter zijde staat, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel359
  - number: '360'
    text: |-
      De ambtenaar of een ander met enige openbare dienst voortdurend of tijdelijk belast persoon, die opzettelijk boeken
      of registers, uitsluitend bestemd tot controle van de administratie, valselijk opmaakt of vervalst, wordt gestraft
      met gevangenisstraf van ten hoogste drie jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel360
  - number: '361.1'
    text: |-
      De ambtenaar of een ander met enige openbare dienst voortdurend of tijdelijk belast persoon, die opzettelijk zaken
      bestemd om voor de bevoegde macht tot overtuiging of bewijs te dienen, akten, bescheiden of registers, welke hij
      in zijn bediening onder zich heeft verduistert, vernielt, beschadigt of onbruikbaar maakt, of toelaat dat zij door
      een ander worden weggemaakt, vernield, beschadigd of onbruikbaar gemaakt, of die ander daarbij als medeplichtige
      ter zijde staat, wordt gestraft met gevangenisstraf van ten hoogste vier jaren en zes maanden of geldboete van de
      vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel361
  - number: '361.2'
    text: |-
      Onder bevoegde macht wordt mede verstaan: een internationaal gerecht dat zijn rechtsmacht ontleent aan een verdrag
      waarbij het Koninkrijk partij is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel361
  - number: '362.1'
    text: 'Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vijfde categorie wordt gestraft de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel362
  - number: 362.1.1°
    text: |-
      die een gift, belofte of dienst aanneemt, wetende of redelijkerwijs vermoedende dat deze hem gedaan, verleend
      of aangeboden wordt teneinde hem te bewegen om, zonder daardoor in strijd met zijn plicht te handelen, in zijn
      bediening iets te doen of na te laten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel362
  - number: 362.1.2°
    text: |-
      die een gift, belofte of dienst aanneemt, wetende of redelijkerwijs vermoedende dat deze hem gedaan, verleend of
      aangeboden wordt ten gevolge of naar aanleiding van hetgeen door hem, zonder daardoor in strijd met zijn plicht te
      handelen, in zijn huidige of vroegere bediening is gedaan of nagelaten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel362
  - number: 362.1.3°
    text: |-
      die een gift, belofte of dienst vraagt teneinde hem te bewegen om, zonder daardoor in strijd met zijn plicht te
      handelen, in zijn bediening iets te doen of na te laten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel362
  - number: 362.1.4°
    text: |-
      die een gift, belofte of dienst vraagt ten gevolge of naar aanleiding van hetgeen door hem, zonder daardoor in
      strijd met zijn plicht te handelen, in zijn huidige of vroegere bediening is gedaan of nagelaten.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel362
  - number: '362.2'
    text: |-
      Met dezelfde straf wordt gestraft, hij die in het vooruitzicht van een aanstelling als ambtenaar, indien de
      aanstelling als ambtenaar is gevolgd, een feit begaat als in het eerste lid, onder 1° en 3°, omschreven.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel362
  - number: '362.3'
    text: |-
      Hij die een feit als omschreven in het eerste lid begaat in verband met zijn hoedanigheid van minister,
      staatssecretaris, commissaris van de Koning, gedeputeerde, burgemeester, wethouder of lid van een algemeen
      vertegenwoordigend orgaan, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel362
  - number: '363.1'
    text: 'Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie wordt gestraft de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel363
  - number: 363.1.1°
    text: |-
      die een gift of belofte dan wel een dienst aanneemt, wetende of redelijkerwijs vermoedende dat deze hem gedaan,
      verleend of aangeboden wordt teneinde hem te bewegen om, in strijd met zijn plicht, in zijn bediening iets te doen
      of na te laten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel363
  - number: 363.1.2°
    text: |-
      die een gift of belofte dan wel een dienst aanneemt, wetende of redelijkerwijs vermoedende dat deze hem gedaan,
      verleend of aangeboden wordt ten gevolge of naar aanleiding van hetgeen door hem, in strijd met zijn plicht, in
      zijn huidige of vroegere bediening is gedaan of nagelaten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel363
  - number: 363.1.3°
    text: |-
      die een gift of belofte dan wel een dienst vraagt teneinde hem te bewegen om, in strijd met zijn plicht, in zijn
      bediening iets te doen of na te laten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel363
  - number: 363.1.4°
    text: |-
      die een gift of belofte dan wel een dienst vraagt ten gevolge of naar aanleiding van hetgeen door hem, in strijd
      met zijn plicht, in zijn huidige of vroegere bediening is gedaan of nagelaten.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel363
  - number: '363.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die in het vooruitzicht van een aanstelling als ambtenaar, indien de
      aanstelling als ambtenaar is gevolgd, een feit begaat als in het eerste lid, onder 1° en 3°, omschreven.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel363
  - number: '363.3'
    text: |-
      Hij die een feit als omschreven in het eerste lid begaat in verband met zijn hoedanigheid van minister,
      staatssecretaris, commissaris van de Koning, gedeputeerde, burgemeester, wethouder of lid van een algemeen
      vertegenwoordigend orgaan, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel363
  - number: '364.1'
    text: |-
      De rechter die een gift, belofte of dienst aanneemt, wetende of redelijkerwijs vermoedende dat deze hem gedaan,
      verleend of aangeboden wordt teneinde invloed uit te oefenen op de beslissing van een aan zijn oordeel onderworpen
      zaak, wordt gestraft met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel364
  - number: '364.2'
    text: |-
      De rechter die een gift, belofte of dienst vraagt teneinde hem te bewegen om invloed uit te oefenen op de
      beslissing van een aan zijn oordeel onderworpen zaak, wordt gestraft met gevangenisstraf van ten hoogste negen
      jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel364
  - number: '364.3'
    text: |-
      Indien de gift, belofte of dienst wordt aangenomen, wetende of redelijkerwijs vermoedende dat deze gedaan,
      verleend of aangeboden wordt om een veroordeling in een strafzaak te verkrijgen, wordt de rechter gestraft met
      gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel364
  - number: '364.4'
    text: |-
      Indien de gift, belofte of dienst wordt gevraagd teneinde hem te bewegen om een veroordeling in een strafzaak te
      verkrijgen, wordt de rechter gestraft met een gevangenisstraf van ten hoogste twaalf jaren of geldboete van de
      vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel364
  - number: 364a.1
    text: |-
      Met ambtenaren worden ten aanzien van de [artikelen 361][ref1], [362][ref2] en [363][ref3] gelijkgesteld personen
      in de openbare dienst van een vreemde staat of van een volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel361
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel362
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel363
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel364a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '361'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '362'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '363'
  - number: 364a.2
    text: |-
      Met ambtenaren worden ten aanzien van de [artikelen 362, onder 2° en 4°][ref1], en [363, onder 2° en 4°][ref2],
      voormalige ambtenaren gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel362
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel363
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel364a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '362'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '363'
  - number: 364a.3
    text: |-
      Met rechter wordt ten aanzien van [artikel 364][ref1] gelijkgesteld de rechter van een vreemde staat of van een
      volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel364
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel364a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '364'
  - number: '365'
    text: |-
      De ambtenaar die door misbruik van gezag iemand dwingt iets te doen, niet te doen of te dulden, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel365
  - number: '366'
    text: |-
      De ambtenaar die in de uitoefening van zijn bediening, als verschuldigd aan hemzelf, aan een ander ambtenaar of aan
      enige openbare kas, vordert of ontvangt of bij een uitbetaling terughoudt hetgeen hij weet dat niet verschuldigd
      is, wordt, als schuldig aan knevelarij, gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel366
  - number: '367.1'
    text: |-
      De ambtenaar die, belast met de bewaking van iemand die op openbaar gezag of krachtens rechterlijke uitspraak
      of beschikking van de vrijheid is beroofd, hem opzettelijk laat ontsnappen of bevrijdt of bij zijn bevrijding of
      zelfbevrijding behulpzaam is, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel367
  - number: '367.2'
    text: |-
      Indien de ontsnapping, bevrijding of zelfbevrijding aan zijn schuld te wijten is, wordt hij gestraft met hechtenis
      van ten hoogste twee maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel367
  - number: '368.1'
    text: 'Met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel368
  - number: 368.1.1°
    text: |-
      de ambtenaar, met het opsporen van strafbare feiten belast, die opzettelijk niet voldoet aan de vordering om van
      een wederrechtelijke vrijheidsberoving te doen blijken of daarvan aan de hogere macht opzettelijk niet onverwijld
      kennis geeft;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel368
  - number: 368.1.2°
    text: |-
      de ambtenaar die, na in de uitoefening van zijn bediening kennis te hebben bekomen dat iemand op onwettige wijze
      van de vrijheid is beroofd, opzettelijk nalaat daarvan onverwijld kennis te geven aan een ambtenaar met het
      opsporen van strafbare feiten belast.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel368
  - number: '368.2'
    text: |-
      De ambtenaar aan wiens schuld enig in dit artikel omschreven verzuim te wijten is, wordt gestraft met hechtenis van
      ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel368
  - number: '369'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie wordt gestraft het hoofd van
      een gesticht, bestemd tot opsluiting van veroordeelden, voorlopig aangehoudenen of gegijzelden, of van een
      rijksinrichting voor kinderbescherming of een psychiatrisch ziekenhuis, die weigert te voldoen aan een wettige
      vordering om iemand die in het gesticht of psychiatrisch ziekenhuis is opgenomen te vertonen, of om inzage te geven
      van het register van inschrijving of van de akte waarvan de wet de inschrijving vordert.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel369
  - number: '370.1'
    text: |-
      De ambtenaar die, met overschrijding van zijn bevoegdheid of zonder inachtneming van de bij de wet bepaalde
      vormen, in de woning of het besloten lokaal of erf, bij een ander in gebruik, diens ondanks binnentreedt of,
      wederrechtelijk aldaar vertoevende, zich niet op de vordering van of vanwege de rechthebbende aanstonds verwijdert,
      wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel370
  - number: '370.2'
    text: |-
      Met gelijke straf wordt gestraft de ambtenaar die ter gelegenheid van het doorzoeken van plaatsen met
      overschrijding van zijn bevoegdheid of zonder inachtneming van de bij de wet bepaalde vormen, geschriften, boeken
      of andere papieren onderzoekt of in beslag neemt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel370
  - number: '371.1'
    text: |-
      De ambtenaar die, met overschrijding van zijn bevoegdheid, zich doet overleggen of in beslag neemt een aan
      enige openbare instelling van vervoer toevertrouwde brief, briefkaart, stuk of pakket, of een telegrafisch
      bericht dat zich in handen bevindt van een persoon belast met de dienst van een ten algemenen nutte gebezigde
      telegraafinrichting, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel371
  - number: '371.2'
    text: |-
      Met dezelfde straf wordt gestraft de ambtenaar die, met overschrijding van zijn bevoegdheid, zich door een persoon
      werkzaam bij een aanbieder van een openbaar telecommunicatienetwerk of een openbare telecommunicatiedienst doet
      inlichten ter zake van enig verkeer dat over dat netwerk dan wel met gebruikmaking van die dienst is geschied.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel371
  - number: '376'
    text: |-
      Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vijfde categorie wordt gestraft de ambtenaar
      die opzettelijk deelneemt, middellijk of onmiddellijk, aan aannemingen of leveranties waarover hem op het tijdstip
      van de handeling geheel of ten dele het bestuur of toezicht is opgedragen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel376
  - number: '377'
    text: |-
      De ambtenaar van het muntwezen, behalve de muntmeester, of degene, in dienst van een waarborginstelling als
      bedoeld in [artikel 7 van de Waarborgwet 1986][ref1], die handel drijft in edele metalen of daarvan vervaardigde
      voorwerpen, of opzettelijk aan zodanige handel middellijk of onmiddellijk deelneemt, wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel7
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel377
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: '7'
  - number: '378'
    text: |-
      Degene, in dienst van een waarborginstelling als bedoeld in [artikel 7 van de Waarborgwet 1986][ref1], die een te
      zijnen kantore aangeboden goud- of zilverwerk afdrukt of natrekt of daarvan een beschrijving geeft aan een ander
      dan die van ambtswege bevoegd is haar te vorderen, wordt gestraft met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel7
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel378
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: '7'
  - number: '379.1'
    text: |-
      De ambtenaar van de burgerlijke stand die meewerkt aan iemands huwelijksvoltrekking, wetende dat deze daardoor een
      dubbel huwelijk aangaat, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel379
  - number: '379.2'
    text: |-
      De ambtenaar van de burgerlijke stand die meewerkt aan iemands huwelijksvoltrekking, wetende dat daartegen enig
      ander wettig beletsel bestaat, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel379
  - number: '380.1'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 355][ref1], [357][ref2] en [358][ref3] omschreven misdrijven kan
      ontzetting van het in [artikel 28, eerste lid, onder 3°][ref4], vermelde recht worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel355
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel357
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel358
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel380
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '355'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '357'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '358'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '380.2'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 359][ref1], [362 tot en met 364][ref2], [366][ref3] en
      [379, eerste lid][ref4], omschreven misdrijven kan ontzetting van het in [artikel 28, eerste lid, onder 4°][ref5],
      vermelde recht worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel359
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel362
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel366
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel379
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel380
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '359'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '362'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '366'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '379'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '381.1'
    text: 'Als schuldig aan zeeroof wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel381
  - number: 381.1.1°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, hij die als schipper dienst
      neemt of dienst doet op een vaartuig, wetende dat het bestemd is of het gebruikende om in open zee daden van
      geweld te plegen tegen andere vaartuigen of tegen zich daarop bevindende personen of goederen, zonder door een
      oorlogvoerende mogendheid daartoe te zijn gemachtigd of tot de oorlogsmarine van een erkende mogendheid te behoren;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel381
  - number: 381.1.2°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, hij die, bekend met deze
      bestemming of dit gebruik, als schepeling dienst neemt op zodanig vaartuig of vrijwillig in dienst blijft na
      daarmede bekend te zijn geworden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel381
  - number: '381.2'
    text: |-
      Met het gemis van machtiging wordt gelijkgesteld het overschrijden van de machtiging alsmede het voorzien zijn van
      machtigingen afkomstig van tegen elkander oorlog voerende mogendheden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel381
  - number: '381.3'
    text: |-
      [Artikel 81][ref1] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel81
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel381
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '81'
  - number: '381.4'
    text: |-
      Het in de vorige leden ten aanzien van de schipper en de schepeling bepaalde is van overeenkomstige toepassing ten
      aanzien van de gezagvoerder onderscheidenlijk het lid van de bemanning van een luchtvaartuig. Onder vaartuig wordt
      in de vorige leden luchtvaartuig begrepen en onder open zee het luchtruim daarboven.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel381
  - number: '382'
    text: |-
      Indien de in [artikel 381][ref1] omschreven daden van geweld de dood van een der zich op het aangevallen vaartuig
      of luchtvaartuig bevindende personen ten gevolge hebben, wordt de schipper of de gezagvoerder van het luchtvaartuig
      en worden zij die aan de daden van geweld hebben deelgenomen, met gevangenisstraf van ten hoogste vijftien jaren of
      geldboete van de vijfde categorie gestraft.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel381
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel382
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '381'
  - number: '383'
    text: |-
      Hij die voor eigen of vreemde rekening een vaartuig of luchtvaartuig uitrust met de in [artikel 381][ref1]
      omschreven bestemming, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel381
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel383
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '381'
  - number: '384'
    text: |-
      Hij die voor eigen of vreemde rekening middellijk of onmiddellijk medewerkt tot het verhuren, vervrachten of
      verzekeren van een vaartuig of luchtvaartuig, wetende dat het de in [artikel 381][ref1] omschreven bestemming
      heeft, wordt gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel381
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel384
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '381'
  - number: '385'
    text: 'Hij die een Nederlands vaartuig opzettelijk in de macht van zeerovers brengt, wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385
  - number: 385.1°
    text: indien hij de schipper is met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385
  - number: 385.2°
    text: in alle andere gevallen met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385
  - number: 385a.1
    text: |-
      Hij die een luchtvaartuig door geweld, bedreiging met geweld of vreesaanjaging in zijn macht brengt of houdt dan
      wel van zijn route doet afwijken, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van
      de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385a
  - number: 385a.2
    text: |-
      Indien twee of meer personen gezamenlijk of ten gevolge van samenspanning het feit plegen, of indien het feit zwaar
      lichamelijk letsel ten gevolge heeft, dan wel het feit is gepleegd met het oogmerk iemand wederrechtelijk van zijn
      vrijheid te beroven of beroofd te houden, wordt gevangenisstraf van ten hoogste vijftien jaren of geldboete van de
      vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385a
  - number: 385a.3
    text: |-
      Indien het feit de dood ten gevolge heeft, wordt levenslange gevangenisstraf of tijdelijke van ten hoogste dertig
      jaren of geldboete van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385a
  - number: 385a.4
    text: |-
      De straffen in het eerste lid bepaald, zijn toepasselijk op degene die de in dit lid omschreven misdrijven pleegt
      ten aanzien van een vaartuig, een installatie ter zee, een autobus, een trein of een ander middel van openbaar
      vervoer dan wel een vrachtwagen met een gevaarlijke lading.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385a
  - number: 385b.1
    text: |-
      Hij die opzettelijk een daad van geweld begaat tegen iemand die zich aan boord van een luchtvaartuig in vlucht
      bevindt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385b
  - number: 385b.1.1°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor de
      veiligheid van het luchtvaartuig te duchten is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385b
  - number: 385b.1.2°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor
      de veiligheid van het luchtvaartuig te duchten is en het feit zwaar lichamelijk letsel voor een ander ten gevolge
      heeft;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385b
  - number: 385b.1.3°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor
      de veiligheid van het luchtvaartuig te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385b
  - number: 385b.2
    text: |-
      De straffen in het eerste lid bepaald, zijn toepasselijk op degene die de in dit lid omschreven misdrijven pleegt
      ten aanzien van een vaartuig en een installatie ter zee. Onder gevaar voor de veiligheid van het luchtvaartuig
      wordt in het eerste lid tevens begrepen gevaar voor de veilige vaart van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385b
  - number: 385c
    text: |-
      Hij die opzettelijk gegevens doorgeeft waarvan hij weet of ernstige reden heeft om te vermoeden dat zij onjuist
      zijn, wordt, indien daarvan gevaar voor een luchtvaartuig in vlucht of voor de veilige vaart van een vaartuig te
      duchten is, gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385c
  - number: 385d
    text: |-
      Hij die opzettelijk met gebruikmaking van een vuurwapen, een ontplofbare of anderszins gemeengevaarlijke stof of
      enig ander gemeengevaarlijk voorwerp, een daad van geweld begaat tegen iemand die zich in of in de onmiddellijke
      nabijheid van de vertrek- of aankomstruimten van een luchthaven bevindt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385d
  - number: 385d.1°
    text: |-
      met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daardoor levensgevaar
      voor andere gebruikers van de luchthaven te duchten valt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385d
  - number: 385d.2°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daardoor levensgevaar
      voor andere gebruikers van de luchthaven te duchten valt en het feit zwaar lichamelijk letsel voor een ander ten
      gevolge heeft;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385d
  - number: 385d.3°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daardoor
      levensgevaar voor andere gebruikers van de luchthaven te duchten valt en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel385d
  - number: '386'
    text: |-
      De opvarende van een Nederlands schip die zich wederrechtelijk van het schip meester maakt, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel386
  - number: '387'
    text: |-
      De schipper van een Nederlands schip die het schip aan de eigenaar of de rederij onttrekt en ten eigen bate
      gebruikt, wordt gestraft met gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel387
  - number: 389bis.1
    text: |-
      De schipper van een Nederlands vaartuig die een scheepsverklaring doet opmaken waarvan hij weet dat de inhoud in
      strijd is met de waarheid, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel389bis
  - number: 389bis.2
    text: |-
      De schepelingen die medewerken tot het doen opmaken van een scheepsverklaring waarvan zij weten dat de inhoud
      in strijd is met de waarheid, worden gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel389bis
  - number: 389ter
    text: |-
      Hij die ter voldoening aan het voorschrift van het [vierde lid van artikel 194][ref1], van het
      [vijfde lid van artikel 784][ref2], van het [eerste lid onder a ten derde van artikel 786][ref3] of van het
      [vierde lid van artikel 1303 van Boek 8 van het Burgerlijk Wetboek][ref4] een schriftelijke verklaring overlegt van
      welke hij weet dat de inhoud in strijd is met de waarheid, wordt gestraft met gevangenisstraf van ten hoogste vier
      jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel784
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel786
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1303
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel389ter
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '194'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '784'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '786'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '1303'
  - number: '390'
    text: |-
      De schipper van een Nederlands vaartuig die gedurende de reis zich opzettelijk aan het voeren van het vaartuig
      onttrekt, wordt, indien die gedraging de veiligheid van de opvarenden, het vaartuig of de zaken aan boord daarvan
      in gevaar brengt, gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel390
  - number: '395.1'
    text: |-
      De opvarende van een Nederlands schip of zeevissersschip die aan boord de schipper, of de schepeling die aan boord
      of in dienst een meerdere in rang feitelijk aanrandt, zich met geweld of bedreiging met geweld tegen hem verzet
      of hem opzettelijk van zijn vrijheid van handelen berooft, wordt, als schuldig aan insubordinatie, gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel395
  - number: '395.2'
    text: 'De schuldige wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel395
  - number: 395.2.1°
    text: |-
      met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, indien het misdrijf of de
      daarmede gepaard gaande feitelijkheden enig lichamelijk letsel ten gevolge hebben;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel395
  - number: 395.2.2°
    text: |-
      met gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van de vijfde categorie, indien zij
      zwaar lichamelijk letsel ten gevolge hebben;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel395
  - number: 395.2.3°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien zij de dood ten
      gevolge hebben.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel395
  - number: '396.1'
    text: |-
      Insubordinatie gepleegd door twee of meer verenigde personen, wordt, als muiterij, gestraft met gevangenisstraf van
      ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel396
  - number: '396.2'
    text: 'De schuldige wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel396
  - number: 396.2.1°
    text: |-
      met gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van de vijfde categorie, indien het
      door hem gepleegde misdrijf of de daarbij door hem gepleegde feitelijkheden enig lichamelijk letsel ten gevolge
      hebben;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel396
  - number: 396.2.2°
    text: |-
      met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien zij zwaar lichamelijk
      letsel ten gevolge hebben;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel396
  - number: 396.2.3°
    text: |-
      met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien zij de dood ten
      gevolge hebben.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel396
  - number: '397'
    text: |-
      Hij die aan boord van een Nederlands schip of zeevissersschip tot muiterij op dat schip of vaartuig opruit, wordt
      gestraft met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel397
  - number: '400.1'
    text: 'Met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel400
  - number: 400.1.1°
    text: |-
      de opvarende van een Nederlands vaartuig die opzettelijk niet gehoorzaamt aan enig bevel van de schipper in het
      belang van de veiligheid aan boord gegeven;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel400
  - number: 400.1.2°
    text: |-
      de opvarende van een Nederlands vaartuig die, wetende dat de schipper van zijn vrijheid van handelen beroofd is,
      hem niet naar vermogen te hulp komt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel400
  - number: 400.1.3°
    text: |-
      de opvarende van een Nederlands vaartuig die, kennis dragende van een voornemen tot het plegen van insubordinatie,
      opzettelijk nalaat daarvan tijdig aan de schipper kennis te geven;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel400
  - number: 400.1.4°
    text: |-
      de opvarende, niet zijnde schepeling, van een Nederlands vaartuig die opzettelijk niet gehoorzaamt aan enig bevel
      van de schipper tot handhaving van de orde en tucht aan boord gegeven.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel400
  - number: '400.2'
    text: De onder 3° vermelde bepaling is niet van toepassing indien de insubordinatie niet is gevolgd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel400
  - number: '401'
    text: |-
      De in de [artikelen 386][ref1], [389][ref2], [395-397][ref3] en [400][ref4] bepaalde gevangenisstraffen kunnen met
      een derde worden verhoogd, indien de schuldige aan een der in die artikelen omschreven misdrijven scheepsofficier
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel386
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel389
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel395
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel400
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel401
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '386'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '389'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '395'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '400'
  - number: '402'
    text: |-
      De schipper van een Nederlands schip die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen
      of zodanige bevoordeling te bedekken, hetzij het schip verkoopt, hetzij geld opneemt op het schip, het
      scheepstoebehoren of de scheepsvoorraad, hetzij zaken aan boord van het schip of zaken van de scheepsvoorraad
      verkoopt of verpandt, hetzij verdichte schaden of uitgaven in rekening brengt, hetzij niet zorgt dat aan boord
      de vereiste dagboeken overeenkomstig de wettelijke voorschriften worden gehouden, hetzij bij het verlaten van het
      schip niet zorgt voor het behoud van de scheepspapieren, wordt gestraft met gevangenisstraf van ten hoogste zes
      jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel402
  - number: '403'
    text: |-
      De schipper van een Nederlands schip die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen of
      zodanige bevoordeling te bedekken, van koers verandert, wordt gestraft met gevangenisstraf van ten hoogste drie
      jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel403
  - number: '405.1'
    text: |-
      De schipper van een Nederlands vaartuig die, buiten noodzaak en buiten voorkennis van de eigenaar of de rederij,
      handelingen pleegt of gedoogt, wetende dat deze het vaartuig of de zaken aan boord daarvan aan opbrenging,
      aanhouding of ophouding kunnen blootstellen, wordt gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel405
  - number: '405.2'
    text: |-
      De opvarende die, buiten noodzaak en buiten voorkennis van de schipper, met gelijke wetenschap gelijke handelingen
      pleegt, wordt gestraft met gevangenisstraf van ten hoogste negen maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel405
  - number: '406'
    text: |-
      De schipper van een Nederlands schip die opzettelijk buiten noodzaak aan een opvarende niet verschaft datgene wat
      hij verplicht is hem te verschaffen, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van
      de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel406
  - number: '407'
    text: |-
      De schipper van een Nederlands schip die opzettelijk buiten noodzaak of in strijd met enig wettelijk voorschrift
      goederen werpt, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel407
  - number: '408'
    text: |-
      Hij die zaken aan boord van een vaartuig, opzettelijk en wederrechtelijk vernielt, beschadigt of onbruikbaar maakt,
      wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel408
  - number: '409'
    text: |-
      De schipper die de Nederlandse vlag voert, wetende dat hij daartoe niet gerechtigd is, wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel409
  - number: '410'
    text: |-
      De schipper die opzettelijk door het voeren van enig onderscheidingsteken aan zijn vaartuig de schijn geeft alsof
      het een Nederlands oorlogsvaartuig ware, of een loodsvaartuig in Nederlandse wateren of zeegaten dienst doende,
      wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel410
  - number: '411'
    text: |-
      Hij die buiten noodzaak op een Nederlands vaartuig optreedt als schipper, stuurman of machinist, wetende dat
      hij ingevolge wettelijk voorschrift daartoe onbevoegd is, wordt gestraft met gevangenisstraf van ten hoogste zes
      maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel411
  - number: '412'
    text: |-
      De schipper van een Nederlands schip die zonder geldige reden weigert te voldoen aan een wettelijke vordering om
      een beklaagde of veroordeelde benevens de tot zijn zaak betrekkelijke stukken aan boord te nemen, wordt gestraft
      met een gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel412
  - number: '413.1'
    text: |-
      De schipper van een Nederlands schip die een beklaagde of veroordeelde die hij op een wettelijke vordering aan
      boord genomen heeft, opzettelijk laat ontsnappen of bevrijdt, of bij zijn bevrijding of zelfbevrijding behulpzaam
      is, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel413
  - number: '413.2'
    text: |-
      Indien de ontsnapping, bevrijding of zelfbevrijding aan zijn schuld is te wijten, wordt hij gestraft met hechtenis
      van ten hoogste twee maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel413
  - number: '414'
    text: |-
      De schipper die de krachtens het [eerste lid van artikel 358a][ref1] of van
      [artikel 785 van het Wetboek van Koophandel][ref2] op hem rustende verplichting tot hulpverlening, opzettelijk niet
      nakomt, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel358a
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel785
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 358a
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '785'
  - number: '415'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 381-387][ref1], [402][ref2] en [403][ref3] omschreven misdrijven
      kan ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref4], vermelde rechten worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel381
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel402
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel403
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel415
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '381'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '402'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '403'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 415a
    text: |-
      Indien een misdrijf, strafbaar gesteld in een der [artikelen 385a tot en met 385d][ref1], is begaan met een
      terroristisch oogmerk, wordt de in dat artikel bepaalde tijdelijke gevangenisstraf met de helft verhoogd en wordt,
      indien op het misdrijf een tijdelijke gevangenisstraf van ten hoogste vijftien jaren is gesteld, levenslange
      gevangenisstraf of tijdelijke van ten hoogste dertig jaren opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel385a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel415a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 385a
  - number: 415b.1
    text: |-
      De samenspanning tot de in de [artikelen 385a][ref1], [385b][ref2] en [385d][ref3] omschreven misdrijven, te begaan
      met een terroristisch oogmerk, wordt gestraft met gevangenisstraf van ten hoogste tien jaren of geldboete van de
      vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel385a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel385b
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel385d
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel415b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 385a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 385b
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 385d
  - number: 415b.2
    text: |-
      [Artikel 96, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel96
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel415b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '96'
  - number: '416.1'
    text: |-
      Als schuldig aan opzetheling wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de
      vijfde categorie:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel416
  - number: 416.1.a
    text: |-
      hij die een goed verwerft, voorhanden heeft of overdraagt, dan wel een persoonlijk recht op of een zakelijk recht
      ten aanzien van een goed vestigt of overdraagt, terwijl hij ten tijde van de verwerving of het voorhanden krijgen
      van het goed dan wel het vestigen van het recht wist dat het een door misdrijf verkregen goed betrof;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel416
  - number: 416.1.b
    text: |-
      hij die opzettelijk uit winstbejag een door misdrijf verkregen goed voorhanden heeft of overdraagt, dan wel een
      persoonlijk recht op of zakelijk recht ten aanzien van een door misdrijf verkregen goed overdraagt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel416
  - number: '416.2'
    text: |-
      Met dezelfde straf wordt gestraft hij die opzettelijk uit de opbrengst van enig door misdrijf verkregen goed
      voordeel trekt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel416
  - number: '417'
    text: |-
      Hij die van het plegen van opzetheling een gewoonte maakt, wordt gestraft met gevangenisstraf van ten hoogste zes
      jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel417
  - number: 417bis.1
    text: |-
      Als schuldig aan schuldheling wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de
      vijfde categorie:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel417bis
  - number: 417bis.1.a
    text: |-
      hij die een goed verwerft, voorhanden heeft of overdraagt, dan wel een persoonlijk recht op of zakelijk recht ten
      aanzien van een goed vestigt of overdraagt, terwijl hij ten tijde van de verwerving of het voorhanden krijgen van
      het goed dan wel het vestigen van het recht redelijkerwijs had moeten vermoeden dat het een door misdrijf verkregen
      goed betrof;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel417bis
  - number: 417bis.1.b
    text: |-
      hij die uit winstbejag een goed voorhanden heeft of overdraagt dan wel een persoonlijk recht op of zakelijk recht
      ten aanzien van een goed overdraagt, terwijl hij redelijkerwijs moet vermoeden dat het een door misdrijf verkregen
      goed betreft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel417bis
  - number: 417bis.2
    text: |-
      Met dezelfde straf wordt gestraft hij die uit de opbrengst van enig goed voordeel trekt, terwijl hij redelijkerwijs
      moet vermoeden dat het een door misdrijf verkregen goed betreft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel417bis
  - number: 417ter
    text: |-
      Bij veroordeling wegens een der in de [artikelen 416-417bis][ref1] omschreven misdrijven kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°, 2° en 4°][ref2], vermelde rechten worden uitgesproken en kan de schuldige
      worden ontzet van de uitoefening van het beroep waarin hij het misdrijf begaan heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel416
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel417ter
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '416'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '418'
    text: |-
      Hij die enig geschrift of enige afbeelding uitgeeft van strafbare aard, wordt gestraft met gevangenisstraf of
      hechtenis van ten hoogste een jaar of geldboete van de derde categorie, indien:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel418
  - number: 418.1°
    text: |-
      de dader noch bekend is, noch op de eerste aanmaning nadat tot het instellen van een gerechtelijk vooronderzoek is
      overgegaan, is bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel418
  - number: 418.2°
    text: |-
      de uitgever wist of moest verwachten dat de dader op het tijdstip van de uitgave strafrechtelijk niet vervolgbaar
      of buiten het Rijk in Europa gevestigd zou zijn.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel418
  - number: '419'
    text: |-
      Hij die enig geschrift of enige afbeelding drukt van strafbare aard, wordt gestraft met gevangenisstraf of
      hechtenis van ten hoogste een jaar of geldboete van de derde categorie, indien:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel419
  - number: 419.1°
    text: |-
      de persoon op wiens last het stuk gedrukt is noch bekend is, noch op de eerste aanmaning nadat tot het instellen
      van een gerechtelijk vooronderzoek is overgegaan, is bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel419
  - number: 419.2°
    text: |-
      de drukker wist of moest verwachten dat de persoon op wiens last het stuk gedrukt is, op het tijdstip van de
      uitgave strafrechtelijk niet vervolgbaar of buiten het Rijk in Europa gevestigd zou zijn.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel419
  - number: '420'
    text: |-
      Indien de aard van het geschrift of de afbeelding een misdrijf oplevert dat alleen op klacht vervolgbaar is, kan
      de uitgever of drukker in de gevallen der beide voorgaande artikelen alleen vervolgd worden op klacht van hem tegen
      wie dat misdrijf gepleegd is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel420
  - number: 420bis.1
    text: |-
      Als schuldig aan witwassen wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde
      categorie:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel420bis
  - number: 420bis.1.a
    text: |-
      hij die van een voorwerp de werkelijke aard, de herkomst, de vindplaats, de vervreemding of de verplaatsing
      verbergt of verhult, dan wel verbergt of verhult wie de rechthebbende op een voorwerp is of het voorhanden heeft,
      terwijl hij weet dat het voorwerp – onmiddellijk of middellijk – afkomstig is uit enig misdrijf;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel420bis
  - number: 420bis.1.b
    text: |-
      hij die een voorwerp verwerft, voorhanden heeft, overdraagt of omzet of van een voorwerp gebruik maakt, terwijl hij
      weet dat het voorwerp – onmiddellijk of middellijk – afkomstig is uit enig misdrijf.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel420bis
  - number: 420bis.2
    text: Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel420bis
  - number: 420ter
    text: |-
      Hij die van het plegen van witwassen een gewoonte maakt, wordt gestraft met gevangenisstraf van ten hoogste zes
      jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel420ter
  - number: 420quater.1
    text: |-
      Als schuldig aan schuldwitwassen wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de
      vijfde categorie:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel420quater
  - number: 420quater.1.a
    text: |-
      hij die van een voorwerp de werkelijke aard, de herkomst, de vindplaats, de vervreemding of de verplaatsing
      verbergt of verhult, dan wel verbergt of verhult wie de rechthebbende op een voorwerp is of het voorhanden heeft,
      terwijl hij redelijkerwijs moet vermoeden dat het voorwerp – onmiddellijk of middellijk – afkomstig is uit enig
      misdrijf;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel420quater
  - number: 420quater.1.b
    text: |-
      hij die een voorwerp verwerft, voorhanden heeft, overdraagt of omzet of van een voorwerp gebruik maakt, terwijl hij
      redelijkerwijs moet vermoeden dat het voorwerp – onmiddellijk of middellijk – afkomstig is uit enig misdrijf.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel420quater
  - number: 420quater.2
    text: Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel420quater
  - number: 420quinquies
    text: |-
      Bij veroordeling wegens een der in de [artikelen 420bis tot en met 420quater][ref1] omschreven misdrijven kan
      ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref2], vermelde rechten worden uitgesproken en
      kan de schuldige worden ontzet van de uitoefening van het beroep waarin hij het misdrijf heeft begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel420bis
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel420quinquies
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 420bis
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '424.1'
    text: |-
      Hij die op of aan de openbare weg of op enige voor het publiek toegankelijke plaats tegen personen of goederen
      enige baldadigheid pleegt waardoor gevaar of nadeel kan worden teweeggebracht, wordt, als schuldig aan
      straatschenderij, gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel424
  - number: '424.2'
    text: |-
      Indien tijdens het plegen van de overtreding nog geen jaar is verlopen sedert een vroegere veroordeling van de
      schuldige wegens gelijke overtreding onherroepelijk is geworden, kan hechtenis van ten hoogste drie dagen of
      geldboete van de eerste categorie worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel424
  - number: '425'
    text: 'Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel425
  - number: 425.1°
    text: |-
      hij die een dier op een mens aanhitst of een onder zijn hoede staand dier, wanneer het een mens aanvalt, niet
      terughoudt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel425
  - number: 425.2°
    text: hij die geen voldoende zorg draagt voor het onschadelijk houden van een onder zijn hoede staand gevaarlijk dier.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel425
  - number: '426.1'
    text: |-
      Hij die, terwijl hij in staat van dronkenschap verkeert, hetzij in het openbaar het verkeer belemmert of de orde
      verstoort, hetzij eens anders veiligheid bedreigt, hetzij enige handeling verricht waarbij, tot voorkoming van
      gevaar voor leven of gezondheid van derden, bijzondere omzichtigheid of voorzorgen worden vereist, wordt gestraft
      met hechtenis van ten hoogste zes dagen of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel426
  - number: '426.2'
    text: |-
      Indien tijdens het plegen van de overtreding nog geen jaar is verlopen sedert een vroegere veroordeling van de
      schuldige wegens gelijke of de in [artikel 453][ref1] omschreven overtreding onherroepelijk is geworden, wordt hij
      gestraft met hechtenis van ten hoogste twee weken of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel453
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel426
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '453'
  - number: 426bis
    text: |-
      Hij die wederrechtelijk op de openbare weg een ander in zijn vrijheid van beweging belemmert of met een of meer
      anderen zich aan een ander tegen diens uitdrukkelijk verklaarde wil blijft opdringen of hem op hinderlijke wijze
      blijft volgen, wordt gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel426bis
  - number: '427'
    text: 'Met geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel427
  - number: 427.1°
    text: |-
      de eigenaar of gebruiker die ten opzichte van toegangen tot of openingen van kluizen, kelders, onderaardse lokalen
      en ruimten, waar die op de openbare weg uitkomen, niet de nodige voorzorgsmaatregelen neemt ten behoeve van de
      veiligheid van de voorbijgangers;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel427
  - number: 427.2°
    text: |-
      hij die niet zorgt dat een door hem of op zijn last op een openbare weg gedane op- of uitgraving of een door hem of
      op zijn last op de openbare weg geplaatst voorwerp behoorlijk verlicht en van de gebruikelijke tekens voorzien is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel427
  - number: 427.3°
    text: |-
      hij die bij een verrichting op of aan de openbare weg niet de nodige maatregelen neemt om voorbijgangers tegen
      mogelijk gevaar te waarschuwen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel427
  - number: 427.4°
    text: |-
      hij die iets plaatst op of aan, of werpt of uitgiet uit een gebouw, op zodanige wijze dat door of ten gevolge
      daarvan iemand die van de openbare weg gebruik maakt, nadeel kan ondervinden;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel427
  - number: 427.5°
    text: |-
      hij die op de openbare weg een rij-, trek- of lastdier laat staan, zonder de nodige voorzorgsmaatregelen tegen het
      aanrichten van schade te hebben genomen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel427
  - number: 427.6°
    text: |-
      hij die zonder verlof van het bevoegd gezag, enige openbare land- of waterweg verspert of het verkeer daarop
      belemmert.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel427
  - number: '428'
    text: |-
      Hij die, zonder verlof van de burgemeester of van de door deze aangewezen ambtenaar, een of meer eigen onroerende
      zaken in brand steekt, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel428
  - number: '429'
    text: 'Met hechtenis van ten hoogste veertien dagen of geldboete van de tweede categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel429
  - number: 429.1°
    text: |-
      hij die een vuurwapen afschiet, een vuurwerk ontsteekt of een vuur aanlegt, voedt of onderhoudt op zo korte afstand
      van gebouwen of goederen, dat daardoor brandgevaar kan ontstaan;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel429
  - number: 429.2°
    text: |-
      hij die, anders dan in de gevallen toegelaten bij of krachtens de [Luchtvaartwet][ref1], een ballon oplaat waaraan
      brandende stoffen gehecht zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel429
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: 429.3°
    text: |-
      hij die door gebrek aan de nodige omzichtigheid of voorzorg gevaar voor bos-, heide-, helm-, gras- of veenbrand
      doet ontstaan;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel429
  - number: 429.4°
    text: |-
      hij die wederrechtelijk in oppervlaktewateren enige stof aanbrengt waardoor nadeel kan ontstaan in verband met het
      gebruik dat gewoonlijk van die wateren wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel429
  - number: 429.5°
    text: |-
      hij die een vlieger oplaat of in de lucht heeft aan een lijn die zich geheel of ten dele bevindt binnen een afstand
      van vijfhonderd meter van een bovengrondse elektrische hoogspanningsleiding.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel429
  - number: 429bis
    text: |-
      Hij die op een van de openbare weg zichtbare plaats woorden of afbeeldingen stelt of gesteld houdt, die, als
      smalende godslasteringen, voor godsdienstige gevoelens krenkend zijn, wordt gestraft met hechtenis van ten hoogste
      een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel429bis
  - number: 429quater.1
    text: |-
      Hij die in de uitoefening van een ambt, beroep of bedrijf personen discrimineert wegens hun ras, hun godsdienst,
      hun levensovertuiging, hun geslacht of hun hetero- of homoseksuele gerichtheid wordt gestraft met hechtenis van ten
      hoogste twee maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel429quater
  - number: 429quater.2
    text: |-
      Met dezelfde straf wordt gestraft hij wiens handelen of nalaten in de uitoefening van een ambt, beroep of bedrijf
      zonder redelijke grond, ten doel heeft of ten gevolge kan hebben dat ten aanzien van personen met een lichamelijke,
      psychische of verstandelijke handicap de erkenning, het genot of de uitoefening op voet van gelijkheid van de
      rechten van de mens en de fundamentele vrijheden op politiek, economisch, sociaal of cultureel terrein of op andere
      terreinen van het maatschappelijk leven, wordt teniet gedaan of aangetast.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel429quater
  - number: 429quinquies
    text: |-
      Hij die zonder daartoe gerechtigd te zijn zich op een verboden plaats bevindt, wordt gestraft met hechtenis van ten
      hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel429quinquies
  - number: 429sexies.1
    text: |-
      Hij die een door hem wederrechtelijk in gebruik genomen woning of gebouw, waarvan het gebruik door de rechthebbende
      niet meer dan twaalf maanden voorafgaande aan die wederrechtelijke ingebruikname is beëindigd, op vordering van
      of vanwege de rechthebbende niet aanstonds ontruimt, wordt gestraft met hechtenis van ten hoogste vier maanden of
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel429sexies
  - number: 429sexies.2
    text: |-
      Met dezelfde straf wordt gestraft hij die, vertoevende in een wederrechtelijk in gebruik genomen woning of gebouw,
      waarvan het gebruik door de rechthebbende niet meer dan twaalf maanden voorafgaande aan die wederrechtelijke
      ingebruikname is beëindigd, zich op de vordering van of vanwege de rechthebbende niet aanstonds verwijdert.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel429sexies
  - number: '430'
    text: |-
      Hij die zonder verlof van het bevoegd gezag een opneming doet, een tekening of beschrijving maakt van enig militair
      werk, of die openbaar maakt, wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel430
  - number: 430a
    text: |-
      Hij die zich buiten een door de gemeenteraad als geschikt voor ongeklede openbare recreatie aangewezen plaats,
      ongekleed bevindt op of aan een voor het openbaar verkeer bestemde plaats die voor ongeklede recreatie niet
      geschikt is, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel430a
  - number: '431'
    text: |-
      Met geldboete van de eerste categorie wordt gestraft hij die rumoer of burengerucht verwekt waardoor de nachtrust
      kan worden verstoord.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel431
  - number: '435'
    text: 'Met geldboete van de tweede categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel435
  - number: 435.1°
    text: hij die zonder daartoe gerechtigd te zijn een Nederlandse adellijke titel voert of een Nederlands ordeteken draagt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel435
  - number: 435.2°
    text: hij die zonder ’s Konings verlof waar dit vereist wordt, een vreemd ordeteken, titel, rang of waardigheid aanneemt;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel435
  - number: 435.3°
    text: |-
      hij die zonder daartoe gerechtigd te zijn de titel van advocaat of procureur, gerechtsdeurwaarder, dan wel een der
      in de [artikelen 7.20][ref1], [7.22, tweede lid][ref2], [7.22a, eerste lid][ref3], en 7a.5 van de Wet op het hoger
      onderwijs en wetenschappelijk onderzoek genoemde titels voert;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel435
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 435.4°
    text: |-
      hij die, door het bevoegd gezag naar zijn identiteitsgegevens gevraagd, een valse naam, voornaam, geboortedatum,
      geboorteplaats, adres waarop hij in de basisadministratie persoonsgegevens als ingezetene staat ingeschreven of
      woon- of verblijfplaats opgeeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel435
  - number: 435a
    text: |-
      Hij die in het openbaar kledingstukken of opzichtige onderscheidingstekens draagt of voert, welke uitdrukking zijn
      van een bepaald staatkundig streven, wordt gestraft met hechtenis van ten hoogste twaalf dagen of geldboete van de
      tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel435a
  - number: 435b.1
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, gebruik maakt van woorden, uitdrukkingen of kentekens, die aanduiden
      of de indruk kunnen wekken dat zijn optreden is bevorderd dan wel de steun of de erkenning geniet van rijkswege,
      vanwege de Nederlandse Antillen, Aruba of een buitenlandse mogendheid dan wel vanwege een volkenrechtelijke
      organisatie, wordt gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel435b
  - number: 435b.3
    text: |-
      Bij veroordeling wegens de in het eerste lid omschreven overtreding, kan openbaarmaking van de rechterlijke
      uitspraak worden gelast.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel435b
  - number: 435c
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, gebruik maakt van het rode-kruisteken of van de woorden "Rode Kruis" of
      "Kruis van Genève", of van daarmede door de wetten en gebruiken van de oorlog gelijkgestelde tekens of woorden, dan
      wel van tekens of woorden die daarvan een nabootsing zijn, wordt gestraft met hechtenis van ten hoogste een maand
      of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel435c
  - number: 435d
    text: |-
      Met hechtenis van ten hoogste een maand of geldboete van de tweede categorie wordt gestraft hij die het wapen van
      het Zwitserse Eedgenootschap of een teken hetwelk een nabootsing daarvan vormt, gebruikt:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel435d
  - number: 435d.1°
    text: hetzij als fabrieks- of handelsmerk of als onderdeel van zulk een merk;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel435d
  - number: 435d.2°
    text: hetzij met een doel, strijdig met de eerlijkheid in de handel;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel435d
  - number: 435d.3°
    text: hetzij onder omstandigheden die het Zwitserse nationale gevoel zouden kunnen krenken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel435d
  - number: 435e
    text: |-
      Hij die, anders dan in besloten kring, door tussenkomst van een ten algemenen nutte of mede ten algemenen nutte
      gebezigde telefooninrichting, goederen of diensten tegen betaling aanbiedt, daarbij te kennen gevend of de indruk
      wekkend dat de opbrengst geheel of ten dele voor een liefdadig of ideëel doel is bestemd, wordt gestraft met
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel435e
  - number: '436.1'
    text: |-
      Hij die, niet toegelaten tot de uitoefening van een beroep waartoe de wet een toelating vordert, buiten noodzaak
      dat beroep uitoefent, wordt gestraft met geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel436
  - number: '436.2'
    text: |-
      Hij die, toegelaten tot de uitoefening van een beroep waartoe de wet een toelating vordert, buiten noodzaak in de
      uitoefening van dat beroep de grenzen van zijn bevoegdheid overschrijdt, wordt gestraft met geldboete van de tweede
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel436
  - number: '436.3'
    text: |-
      Indien tijdens het plegen van de overtreding nog geen twee jaren zijn verlopen sedert een vroegere veroordeling van
      de schuldige wegens gelijke overtreding onherroepelijk is geworden, kan in het geval van het eerste lid hechtenis
      van ten hoogste twee maanden of geldboete van de derde categorie, in het geval van het tweede lid hechtenis van ten
      hoogste een maand of geldboete van de derde categorie worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel436
  - number: '437.1'
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft de bij algemene
      maatregel van bestuur aangewezen handelaar die in de uitoefening van zijn beroep of bedrijf:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437
  - number: 437.1.a
    text: |-
      niet met inachtneming van de bij algemene maatregel van bestuur te stellen regels aantekening houdt van alle
      gebruikte of ongeregelde goederen die hij heeft verworven dan wel voorhanden heeft,
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437
  - number: 437.1.b
    text: |-
      een gebruikt of ongeregeld goed verwerft van iemand, zonder dat diegene zijn identiteitsgegevens heeft opgegeven of
      zonder dat hij die gegevens in zijn administratie heeft aangetekend,
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437
  - number: 437.1.c
    text: |-
      nalaat zijn administratie op eerste aanvraag ter inzage te geven aan een daartoe door de burgemeester aangewezen
      ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437
  - number: 437.1.d
    text: |-
      nalaat een gebruikt of ongeregeld goed dat hij heeft verworven of voorhanden heeft, op eerste vordering van een
      ambtenaar als bedoeld in onderdeel *c*, ter bezichtiging af te staan en deze te laten zien waar dit goed in zijn
      administratie staat ingeschreven,
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437
  - number: 437.1.e
    text: |-
      een goed dat bij hem door of vanwege de politie met een duidelijke schriftelijke omschrijving als door misdrijf aan
      de rechthebbende is onttrokken of als verloren is aangegeven, verwerft of voorhanden heeft,
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437
  - number: 437.1.f
    text: |-
      aan een hem schriftelijk uitgereikt last van een ambtenaar, zoals bedoeld in onderdeel *c*, tot het gedurende een
      daarbij aangegeven tijd, veertien dagen niet te boven gaande, bewaren of in bewaring geven van een goed dat hij
      voorhanden heeft, of aan een hem bij die last gegeven aanwijzing, geen gevolg geeft, of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437
  - number: 437.1.g
    text: |-
      nalaat de van hem bij schriftelijke vordering van een ambtenaar, zoals bedoeld in onderdeel *c*, gevraagde opgaven
      betreffende door hem verworven of bij hem voorhanden zijnde goederen binnen de termijn, bij de vordering gesteld,
      naar waarheid te verschaffen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437
  - number: '437.2'
    text: |-
      Met dezelfde straf wordt gestraft de voor de handelaar uit het eerste lid optredende persoon die een feit begaat
      als in dit lid onder *a* tot en met *g* omschreven;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437
  - number: '437.3'
    text: De schuldige kan worden ontzet van de uitoefening van het beroep waarin hij de overtreding begaat.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437
  - number: '437.4'
    text: |-
      Onder ongeregelde goederen worden verstaan goederen die wegens hun aard of uitvoering, hun herkomst of de staat
      waarin zij verkeren, niet tot de algemeen gangbare goederen kunnen worden gerekend.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437
  - number: 437bis.1
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft de handelaar die op
      grond van [artikel 437][ref1] bij algemene maatregel van bestuur is aangewezen en in de oefening van zijn beroep
      of bedrijf:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel437
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437bis
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '437'
  - number: 437bis.1.a
    text: een goed van een minderjarige verwerft, of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437bis
  - number: 437bis.1.b
    text: |-
      een goed van iemand van wie hij weet of redelijkwijs moet vermoeden dat hij is opgenomen in een strafinrichting,
      rijksinrichting voor kinderbescherming of krankzinnigengesticht, verwerft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437bis
  - number: 437bis.2
    text: |-
      Met dezelfde straf wordt gestraft de voor de handelaar uit het eerste lid optredende persoon die een feit begaat
      als in dit lid onder *a* en *b* omschreven.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437bis
  - number: 437bis.3
    text: De schuldige kan worden ontzet van de uitoefening van het beroep waarin hij de overtreding heeft begaan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437bis
  - number: 437ter.1
    text: |-
      De handelaar aangewezen bij algemene maatregel van bestuur op grond van [artikel 437][ref1], die een verordening
      door de raad van een gemeente ter bestrijding van heling uitgevaardigd en afgekondigd, overtreedt, wordt gestraft
      met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel437
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437ter
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '437'
  - number: 437ter.2
    text: |-
      Met dezelfde straf wordt gestraft hij die van opkopen een beroep of gewoonte maakt, zonder daarvan te voren de
      burgemeester of een door die burgemeester aangewezen ambtenaar schriftelijk in kennis te hebben gesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437ter
  - number: 437quater
    text: |-
      Hij die enig voorschrift ter voorkoming van gevaar voor begunstiging van misdrijven, bij algemene maatregel van
      bestuur met betrekking tot het verkeer op bepaalde daarbij aan te wijzen watergebieden vastgesteld, overtreedt,
      wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel437quater
  - number: '438.1'
    text: |-
      Hij die er zijn beroep van maakt aan personen nachtverblijf te verschaffen wordt gestraft met hechtenis van ten
      hoogste een maand of geldboete van de tweede categorie indien hij:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel438
  - number: 438.1.1e
    text: |-
      nalaat zich onverwijld bij aankomst van de persoon die in de door hem gehouden inrichting de nacht zal doorbrengen
      een geldig reisdocument of identiteitsbewijs te doen overleggen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel438
  - number: 438.1.2e
    text: |-
      geen doorlopend register houdt of nalaat daarin onverwijld bij de aankomst van die persoon zijn naam, beroep of
      betrekking, woonplaats en dag van aankomst aan te tekenen of te doen aantekenen alsmede zelf daarin aantekening te
      houden of te doen houden van de aard van het overgelegde document, en, bij het vertrek, de dag van het vertrek;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel438
  - number: 438.1.3e
    text: nalaat dat register op aanvraag te vertonen aan de burgemeester dan wel aan de door deze aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel438
  - number: '438.2'
    text: |-
      Met dezelfde straf wordt de gelijke nalatigheid gestraft van degene die er zijn beroep of een gewoonte van maakt
      aan meerderjarige personen een terrein, daaronder begrepen iedere binnenhaven of elk binnenwater ingericht tot
      het afmeren van pleziervaartuigen, al of niet met daarbij behorende voorzieningen, ter beschikking te stellen voor
      het houden van nachtverblijf of voor het plaatsen dan wel geplaatst houden van kampeermiddelen of daartoe enig
      bouwwerk, niet zijnde een inrichting als bedoeld in het eerste lid, ter beschikking stelt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel438
  - number: '438.3'
    text: |-
      Op nachtverblijf, verschaft aan meereizende echtgenoten, minderjarige kinderen of aan reisgezelschappen, is het
      voorgaande niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel438
  - number: '439.1'
    text: 'Met hechtenis van ten hoogste een maand of geldboete van de tweede categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel439
  - number: 439.1.1°
    text: |-
      hij die van een krijgsman beneden de rang van officier goederen behorende tot de kleding, uitrusting of bewapening
      koopt, inruilt, als geschenk aanneemt, in pand, gebruik of bewaring neemt, of zodanige goederen voor een
      krijgsman beneden de rang van officier verkoopt, ruilt, ten geschenke, in pand, gebruik of bewaring geeft, zonder
      schriftelijke vergunning door of vanwege de bevelvoerende officier afgegeven;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel439
  - number: 439.1.2°
    text: |-
      hij die, een gewoonte makende van het kopen van zodanige goederen, de bij algemene maatregel van inwendig bestuur
      gegeven voorschriften omtrent het daarvan te houden register niet naleeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel439
  - number: '439.2'
    text: |-
      Indien tijdens het plegen van de overtreding nog geen twee jaren zijn verlopen sedert een vroegere veroordeling
      van de schuldige wegens een van deze overtredingen onherroepelijk is geworden, kan de straf van hechtenis worden
      verdubbeld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel439
  - number: '440'
    text: |-
      Hij die drukwerken of andere voorwerpen in een vorm die ze op munt- of bankbiljetten, op muntspeciën, op van
      rijksmerken voorziene platina, gouden of zilveren werken, op postzegels of op reisdocumenten doet gelijken,
      vervaardigt, ontvangt, zich verschaft, in voorraad heeft, vervoert, invoert, doorvoert of uitvoert, wordt gestraft
      met geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel440
  - number: '441'
    text: |-
      Met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie wordt gestraft hij die de inhoud of
      de strekking van hetgeen door middel van een onder zijn beheer staande of door hem gebruikt radio-ontvangapparaat
      is opgevangen en, naar hij redelijkerwijs moet vermoeden, niet voor hem of mede voor hem bestemd is, hetzij aan
      een ander meedeelt, indien hij redelijkerwijs moet vermoeden, dat dan openlijke bekendmaking van de inhoud of de
      strekking volgen zal en zodanige bekendmaking volgt, hetzij openlijk bekend maakt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel441
  - number: 441a
    text: |-
      Hij die openlijk of door verspreiding van enig geschrift ongevraagd een voorwerp als verkrijgbaar dan wel als bij
      hem voorhanden aanwijst en daarbij de aandacht vestigt op de geschiktheid daarvan als technisch hulpmiddel voor het
      heimelijk afluisteren, aftappen of opnemen van gesprekken, telecommunicatie of andere gegevensoverdracht door een
      geautomatiseerd werk of als onderdeel van zulk een hulpmiddel, wordt gestraft met hechtenis van ten hoogste twee
      maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel441a
  - number: 441b
    text: |-
      Met hechtenis van ten hoogste twee maanden of geldboete van de derde categorie wordt gestraft hij die, gebruik
      makende van een daartoe aangebracht technisch hulpmiddel waarvan de aanwezigheid niet op duidelijke wijze kenbaar
      is gemaakt, van een persoon, aanwezig op een voor het publiek toegankelijke plaats, wederrechtelijk een afbeelding
      vervaardigt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel441b
  - number: '442'
    text: 'Met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel442
  - number: 442.1°
    text: |-
      hij die, surséance van betaling verkregen hebbende, eigenmachtig daden verricht waartoe de medewerking van
      bewindvoerders door de wet wordt gevorderd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel442
  - number: 442.2°
    text: |-
      de bestuurder of commissaris van een rechtspersoon welke surséance van betaling verkregen heeft, die eigenmachtig
      daden verricht waartoe de medewerking van bewindvoerders door de wet wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel442
  - number: 442a
    text: |-
      Hij die zonder voorafgaande schriftelijke toestemming van de raad voor de kinderbescherming een kind beneden
      de leeftijd van zes maanden hetwelk niet onder voogdij van een rechtspersoon staat als pleegkind opneemt, wordt
      gestraft met hechtenis van ten hoogste drie weken of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel442a
  - number: '443'
    text: |-
      Hij die een algemeen voorschrift van politie, krachtens de [Gemeentewet][ref1] in buitengewone omstandigheden door
      de burgemeester of de commissaris van de Koning in de provincie uitgevaardigd en afgekondigd, overtreedt, wordt
      gestraft met hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel443
    references:
      - id: ref1
        bwb_id: BWBR0005416
  - number: '444'
    text: |-
      Hij die, wettelijk als getuige, als deskundige of als tolk opgeroepen, wederrechtelijk wegblijft, wordt gestraft
      met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel444
  - number: '445'
    text: |-
      Hij die in zaken van minderjarigen of van onder curatele te stellen of gestelde personen, of van hen die in een
      psychiatrisch ziekenhuis zijn opgenomen, als bloedverwant, aangehuwde, echtgenoot, voogd, curator, voor de rechter
      geroepen om te worden gehoord, noch in persoon noch, waar dit is toegelaten, door tussenkomst van een gemachtigde
      verschijnt, zonder geldige reden van verschoning, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel445
  - number: '446'
    text: |-
      Hij die, bij het bestaan van gevaar voor de algemene veiligheid van personen of goederen of bij ontdekking van een
      misdrijf op heter daad, het hulpbetoon weigert dat de openbare macht van hem vordert en waartoe hij, zonder zich
      aan dadelijk gevaar bloot te stellen, in staat is, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel446
  - number: 446a
    text: Met een hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie wordt gestraft hij die,
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel446a
  - number: 446a.1°
    text: |-
      nadat hij een bevoegdheid als bedoeld in [artikel 539][ref1] heeft uitgeoefend, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel539b
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel446a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 539b
  - number: 446a.2°
    text: |-
      nadat hem buiten het rechtsgebied van een rechtbank een aangehouden verdachte of een in beslag genomen voorwerp is
      overgeleverd, dan wel
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel446a
  - number: 446a.3°
    text: |-
      nadat hij buiten het rechtsgebied van een rechtbank op last van het openbaar ministerie een persoon heeft
      aangehouden,
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel446a
  - number: '447'
    text: |-
      Hij die een bekendmaking, vanwege het bevoegd gezag in het openbaar gedaan, wederrechtelijk afscheurt, onleesbaar
      maakt of beschadigt, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel447
  - number: 447a
    text: 'Met geldboete van de tweede categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel447a
  - number: 447a.1°
    text: |-
      hij die niet of niet behoorlijk voldoet aan enige verplichting, opgelegd in [artikel 195 van Boek 8 van het
      Burgerlijk Wetboek](onbekend) in verband met de [artikelen 192](onbekend) en [178 derde lid van Boek 8 van het
      Burgerlijk Wetboek](onbekend), of opgelegd in de [artikelen 785](onbekend) en [786 van Boek 8 van het Burgerlijk
      Wetboek](onbekend) in verband met de [artikelen 782](onbekend) en [178 derde lid](onbekend), naast [artikel 771 van
      Boek 8 van dat Wetboek](onbekend) of in de algemene maatregelen van bestuur bedoeld in de [artikelen 231](onbekend)
      en [841 van Boek 8 van het Burgerlijk Wetboek](onbekend);
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel447a
  - number: 447a.2°
    text: |-
      hij die het brandmerk, de benaming of kentekens op een teboekstaand schip, voorgeschreven in de onder 1° genoemde
      algemene maatregel van bestuur, verwijdert, verandert dan wel onduidelijk of onzichtbaar maakt op een andere wijze
      dan volgens die algemene maatregel van bestuur geoorloofd is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel447a
  - number: 447a.3°
    text: |-
      hij die niet of niet behoorlijk voldoet aan de verplichting, opgelegd in [artikel 1304, tweede lid, van Boek 8
      van het Burgerlijk Wetboek](onbekend), of aan enige verplichting, opgelegd in een algemene maatregel van bestuur,
      uitgevaardigd krachtens [artikel 1321 van Boek 8 van het Burgerlijk Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel447a
  - number: 447b
    text: |-
      Hij die een reisdocument dat in zijn bezit is, maar waarvan hij niet de houder is, of dat ingevolge een wettelijke
      bepaling moet worden ingeleverd, niet terstond wanneer hem dit mondeling door een daartoe bevoegde ambtenaar is
      bevolen, dan wel binnen veertien dagen, nadat hem dit bij aangetekend schrijven in persoon is medegedeeld inlevert,
      wordt gestraft met geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel447b
  - number: 447c
    text: |-
      Hij die, anders dan door valsheid in geschrift, aan degene door wie of door wiens tussenkomst enige verstrekking
      of tegemoetkoming wordt verleend, gegevens verstrekt die naar hij weet of redelijkerwijze moet vermoeden niet met
      de waarheid in overeenstemming zijn, wordt, indien deze gegevens van belang zijn voor de vaststelling van zijn
      of eens anders recht op die verstrekking of tegemoetkoming dan wel voor de hoogte of de duur van een dergelijke
      verstrekking of tegemoetkoming, gestraft met hechtenis van ten hoogste zes maanden of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel447c
  - number: 447d
    text: |-
      Hij die, in strijd met een hem bij of krachtens wettelijk voorschrift opgelegde verplichting, nalaat tijdig de
      benodigde gegevens te verstrekken, wordt, indien deze gegevens van belang zijn voor de vaststelling van zijn
      of eens anders recht op een verstrekking of tegemoetkoming dan wel voor de hoogte of de duur van een dergelijke
      verstrekking of tegemoetkoming, gestraft met hechtenis van ten hoogste zes maanden of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel447d
  - number: 447e
    text: |-
      Hij die niet voldoet aan de verplichting om een identiteitsbewijs ter inzage aan te bieden, hem opgelegd bij
      [artikel 2 van de Wet op de identificatieplicht][ref1], wordt gestraft met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel2
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel447e
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '2'
  - number: '448'
    text: |-
      Hij die niet voldoet aan een wettelijke verplichting tot aangifte aan de ambtenaar van de burgerlijke stand voor de
      registers van geboorte of overlijden, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel448
  - number: '449.1'
    text: |-
      De bedienaar van de godsdienst die, voordat partijen hem hebben doen blijken dat hun huwelijk ten overstaan van de
      ambtenaar van de burgerlijke stand is voltrokken, enige godsdienstige plechtigheid daartoe betrekkelijk verricht,
      wordt gestraft met geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel449
  - number: '449.2'
    text: |-
      Indien tijdens het plegen van de overtreding nog geen twee jaren zijn verlopen sedert een vroegere veroordeling van
      de schuldige wegens gelijke overtreding onherroepelijk is geworden, kan hechtenis van ten hoogste twee maanden of
      geldboete van de tweede categorie worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel449
  - number: '450'
    text: |-
      Hij die, getuige van het ogenblikkelijk levensgevaar waarin een ander verkeert, nalaat deze die hulp te verlenen
      of te verschaffen die hij hem, zonder gevaar voor zichzelf of anderen redelijkerwijs te kunnen duchten, verlenen
      of verschaffen kan, wordt, indien de dood van de hulpbehoevende volgt, gestraft met hechtenis van ten hoogste drie
      maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel450
  - number: '453'
    text: |-
      Hij die zich in kennelijke staat van dronkenschap op de openbare weg bevindt, wordt gestraft met hechtenis van ten
      hoogste twaalf dagen of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel453
  - number: '458'
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, zijn niet uitvliegend pluimgedierte laat lopen in tuinen of op enige
      grond die bezaaid, bepoot of beplant is, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel458
  - number: '459'
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, vee laat lopen in tuinen, hakbossen of rijswaarden, op enig wei- of
      hooiland of op enige grond die bezaaid, bepoot of beplant is, of die ter bezaaiing, bepoting of beplanting is
      gereedgemaakt, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel459
  - number: '460'
    text: |-
      Hij die zich, zonder daartoe gerechtigd te zijn, bevindt op enige grond die bezaaid, bepoot of beplant is, of die
      ter bezaaiing, bepoting of beplanting is gereedgemaakt, of gedurende de maanden mei tot en met oktober op enig wei-
      of hooiland, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel460
  - number: '461'
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, zich op eens anders grond waarvan de toegang op een voor hem blijkbare
      wijze door de rechthebbende is verboden, bevindt of daar vee laat lopen, wordt gestraft met geldboete van de eerste
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel461
  - number: '462'
    text: |-
      De ambtenaar, bevoegd tot de uitgifte van afschriften of uittreksels van vonnissen, die zodanig afschrift of
      uittreksel uitgeeft alvorens het vonnis behoorlijk is ondertekend, wordt gestraft met geldboete van de eerste
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel462
  - number: '463'
    text: |-
      De ambtenaar die zonder verlof van het bevoegd gezag afschrift maakt of uittreksel neemt van geheime
      regeringsbescheiden of die openbaar maakt, wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete
      van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel463
  - number: '464'
    text: |-
      Het hoofd van een gesticht, bestemd tot opsluiting van veroordeelden, voorlopig aangehoudenen of gegijzelden,
      of van een rijksinrichting voor kinderbescherming of psychiatrisch ziekenhuis, die iemand in het gesticht of
      ziekenhuis opneemt of houdt zonder zich het bevel van de bevoegde macht of de rechterlijke uitspraak te hebben
      laten vertonen, of die nalaat van deze opneming en van het bevel of de uitspraak op grond waarvan zij geschiedt,
      in zijn registers de vereiste inschrijving te doen, wordt gestraft met hechtenis van ten hoogste een maand of
      geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel464
  - number: '465'
    text: |-
      De ambtenaar van de burgerlijke stand die nalaat vóór de voltrekking van een huwelijk zich de bewijsstukken of
      verklaringen te laten geven die door enig wettelijk voorschrift worden gevorderd, wordt gestraft met geldboete van
      de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel465
  - number: '466'
    text: |-
      De ambtenaar van de burgerlijke stand die in strijd handelt met enig wettelijk voorschrift omtrent de registers
      of de akten van de burgerlijke stand of omtrent de formaliteiten vóór of de voltrekking van een huwelijk, wordt
      gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel466
  - number: '467'
    text: |-
      De ambtenaar van de burgerlijke stand die nalaat een akte in de registers op te nemen, wordt gestraft met geldboete
      van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel467
  - number: '468'
    text: 'Met geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel468
  - number: 468.1°
    text: |-
      de ambtenaar van de burgerlijke stand die nalaat aan het bevoegd gezag de opgaven te doen die enig wettelijk
      voorschrift van hem vordert;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel468
  - number: 468.2°
    text: |-
      de ambtenaar die nalaat aan de ambtenaar van de burgerlijke stand de opgaven te doen die enig wettelijk voorschrift
      van hem vordert.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel468
  - number: 468a
    text: |-
      Onder ambtenaar van de burgerlijke stand wordt ten aanzien van de [artikelen 466-468][ref1] verstaan een ieder die
      ingevolge enig wettelijk voorschrift met de bewaring van een register van de burgerlijke stand is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel466
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel468a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '466'
  - number: '469'
    text: |-
      De schipper van een Nederlands vaartuig die naar zee vertrekt alvorens hij de in
      [artikel 451 van het Wetboek van Koophandel][ref1] vereiste monsterrol heeft opgemaakt of bijgesteld, heeft
      ondertekend en heeft gezonden aan de inspecteur-generaal van de Inspectie Verkeer en Waterstaat, wordt gestraft met
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel451
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel469
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '451'
  - number: '470'
    text: |-
      De schipper die niet alle door of krachtens wettelijke bepalingen gevorderde scheepspapieren, boeken, bescheiden of
      andere gegevensdragers aan boord heeft, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel470
  - number: 470a
    text: |-
      De schipper van een Nederlands vaartuig die daarmede een reis onderneemt zonder dat voor zijn schip een, door
      [artikel 407 van het Wetboek van Koophandel][ref1] vereist, certificaat voor de verblijven is afgegeven en nog
      geldig is, wordt gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel407
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel470a
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '407'
  - number: '471.1'
    text: 'Met geldboete van de tweede categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel471
  - number: 471.1.1°
    text: |-
      de schipper van een Nederlands vaartuig die niet zorgt dat aan boord van zijn vaartuig de bij de wet vereiste
      dagboeken overeenkomstig de wettelijke voorschriften worden gehouden of die dagboeken niet vertoont wanneer de wet
      dit vordert;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel471
  - number: 471.1.2°
    text: |-
      de schipper van een Nederlands schip die het register van strafbare feiten, bedoeld in [artikel 539][ref1], niet
      overeenkomstig de wettelijke voorschriften houdt of niet vertoont wanneer de wet dit vordert;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel539u
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel471
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 539u
  - number: 471.1.4°
    text: |-
      de eigenaar, de rompbevrachter, de boekhouder of schipper van een Nederlands vaartuig die weigert aan
      belanghebbenden op hun aanvraag inzage of, tegen betaling van de kosten, afschrift te verstrekken van de aan boord
      van het vaartuig gehouden dagboeken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel471
  - number: '471.2'
    text: |-
      Indien tijdens het plegen van de overtreding nog geen twee jaren zijn verlopen sedert een vroegere veroordeling
      van de schuldige wegens een van deze overtredingen onherroepelijk is geworden, kan hechtenis van ten hoogste twee
      maanden of geldboete van de tweede categorie worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel471
  - number: 471a
    text: |-
      Hij die het bepaalde bij [artikel 539][ref1] overtreedt wordt gestraft met hechtenis van ten hoogste drie maanden
      of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel539u
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel471a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 539u
  - number: '472'
    text: |-
      De schipper van een Nederlands vaartuig die niet voldoet aan zijn wettelijke verplichting betreffende de
      inschrijving en kennisgeving van geboorten of sterfgevallen die gedurende een zeereis plaats hebben, wordt gestraft
      met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel472
  - number: '474'
    text: |-
      De schipper die niet voldoet aan de verplichtingen bedoeld in het [tweede lid van artikel 358a][ref1] of van
      [artikel 785 van het Wetboek van Koophandel][ref2], wordt gestraft met hechtenis van ten hoogste drie maanden of
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel358a
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel785
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel474
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 358a
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '785'
  - number: '475'
    text: |-
      De eigenaar zowel als de rompbevrachter, die de hem in [het derde lid van artikel 451][ref1] opgelegde
      verplichting, en de schipper die een der hem in [het eerste en derde lid van dat artikel][ref2] opgelegde
      verplichtingen niet nakomt, worden gestraft met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel451e
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel451e
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel475
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 451e
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 451e
  - number: '476'
    text: |-
      De eigenaar, de rompbevrachter en de schipper van een Nederlands vaartuig aan boord waarvan personen als
      schepelingen werkzaam zijn in strijd met het verbod van [artikel 406][ref1] of [artikel 452][ref2], worden gestraft
      met geldboete van de eerste categorie voor iedere persoon die aldus werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel406
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel452s
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel476
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '406'
      - id: ref2
        bwb_id: BWBR0001838
        artikel: 452s
  - number: '479'
    text: Het in werking treden van dit wetboek wordt nader bij de wet geregeld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel479
