  - number: 43c
    text: |-
      Bij de misdrijven omschreven in de [artikelen 208 tot en met 210][ref1], [213][ref2] en [214][ref3] wordt een
      onherroepelijke veroordeling tot gevangenisstraf door een rechter in een andere lidstaat van de Europese Unie
      uitgesproken ter zake van enig misdrijf ten opzichte van muntspeciën of munt- of bankbiljetten als een veroordeling
      wegens een soortgelijk misdrijf in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel208
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel213
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel214
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '208'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '213'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '214'
  - number: '44'
    text: |-
      Indien een ambtenaar door het begaan van een strafbaar feit een bijzondere ambtsplicht schendt of bij het begaan
      van een strafbaar feit gebruik maakt van macht, gelegenheid of middel hem door zijn ambt geschonken, kan de op het
      feit gestelde straf, met uitzondering van geldboete, met een derde worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel44
  - number: 44a.1
    text: |-
      Op vordering van de officier van justitie kan de rechter na een op grond van
      [artikel 226h, derde lid, van het Wetboek van Strafvordering][ref1] gemaakte afspraak de straf verminderen die
      hij overwoog op te leggen op de in het tweede lid bepaalde wijze. Bij de strafvermindering houdt de rechter ermee
      rekening dat door het afleggen van een getuigenverklaring een belangrijke bijdrage is of kan worden geleverd aan de
      opsporing of vervolging van misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel226h
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 226h
  - number: 44a.2
    text: 'Bij toepassing van het eerste lid kan de strafvermindering bestaan in:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel44a
  - number: 44a.2.a
    text: |-
      maximaal de helft bij een onvoorwaardelijke tijdelijke vrijheidsstraf, taakstraf, bestaande uit een werkstraf, of
      geldboete, of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel44a
  - number: 44a.2.b
    text: |-
      de omzetting van maximaal de helft van het onvoorwaardelijke gedeelte van een vrijheidsstraf, taakstraf, bestaande
      uit een werkstraf, of van een geldboete in een voorwaardelijk gedeelte, of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel44a
  - number: 44a.2.c
    text: |-
      de vervanging van maximaal een derde gedeelte van een vrijheidsstraf door taakstraf, bestaande uit een werkstraf,
      of een onvoorwaardelijke geldboete.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel44a
  - number: 44a.3
    text: |-
      Bij toepassing van het tweede lid, onder b, blijft [artikel 14a, eerste en tweede lid][ref1], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14a
  - number: '45.1'
    text: |-
      Poging tot misdrijf is strafbaar, wanneer het voornemen van de dader zich door een begin van uitvoering heeft
      geopenbaard.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel45
  - number: '45.2'
    text: Het maximum van de hoofdstraffen op het misdrijf gesteld wordt bij poging met een derde verminderd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel45
  - number: '45.3'
    text: |-
      Geldt het een misdrijf waarop levenslange gevangenisstraf is gesteld, dan wordt gevangenisstraf opgelegd van ten
      hoogste twintig jaren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel45
  - number: '45.4'
    text: De bijkomende straffen zijn voor poging dezelfde als voor het voltooide misdrijf.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel45
  - number: '46.1'
    text: |-
      Voorbereiding van een misdrijf waarop naar de wettelijke omschrijving een gevangenisstraf van acht jaren of
      meer is gesteld is strafbaar, wanneer de dader opzettelijk voorwerpen, stoffen, informatiedragers, ruimten of
      vervoermiddelen kennelijk bestemd tot het begaan van dat misdrijf verwerft, vervaardigt, invoert, doorvoert,
      uitvoert of voorhanden heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel46
  - number: '46.2'
    text: Het maximum van de hoofdstraffen op het misdrijf gesteld wordt bij voorbereiding met de helft verminderd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel46
  - number: '46.3'
    text: |-
      Geldt het een misdrijf waarop levenslange gevangenisstraf is gesteld, dan wordt gevangenisstraf opgelegd van ten
      hoogste vijftien jaren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel46
  - number: '46.4'
    text: De bijkomende straffen zijn voor voorbereiding dezelfde als voor het voltooide misdrijf.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel46
  - number: '46.5'
    text: Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel46
  - number: 46a
    text: |-
      Poging om een ander door een der in [artikel 47, eerste lid onder 2e][ref1], vermelde middelen te bewegen om een
      misdrijf te begaan, is strafbaar, met dien verstande dat geen zwaardere straf wordt uitgesproken dan ter zake van
      poging tot het misdrijf of, indien zodanige poging niet strafbaar is, terzake van het misdrijf zelf kan worden
      opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel47
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '47'
  - number: 46b
    text: |-
      Voorbereiding noch poging bestaat indien het misdrijf niet is voltooid tengevolge van omstandigheden van de wil van
      de dader afhankelijk.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel46b
  - number: '47.1'
    text: 'Als daders van een strafbaar feit worden gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel47
  - number: 47.1.1°
    text: zij die het feit plegen, doen plegen of medeplegen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel47
  - number: 47.1.2°
    text: |-
      zij die door giften, beloften, misbruik van gezag, geweld, bedreiging, of misleiding of door het verschaffen van
      gelegenheid, middelen of inlichtingen het feit opzettelijk uitlokken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel47
  - number: '47.2'
    text: |-
      Ten aanzien van de laatsten komen alleen die handelingen in aanmerking die zij opzettelijk hebben uitgelokt,
      benevens hun gevolgen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel47
  - number: '48'
    text: 'Als medeplichtigen van een misdrijf worden gestraft:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel48
  - number: 48.1°
    text: zij die opzettelijk behulpzaam zijn bij het plegen van het misdrijf;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel48
  - number: 48.2°
    text: zij die opzettelijk gelegenheid, middelen of inlichtingen verschaffen tot het plegen van het misdrijf.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel48
  - number: '49.1'
    text: Het maximum van de hoofdstraffen op het misdrijf gesteld wordt bij medeplichtigheid met een derde verminderd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel49
  - number: '49.2'
    text: |-
      Geldt het een misdrijf waarop levenslange gevangenisstraf is gesteld, dan wordt gevangenisstraf opgelegd van ten
      hoogste twintig jaren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel49
  - number: '49.3'
    text: De bijkomende straffen zijn voor medeplichtigheid dezelfde als voor het misdrijf zelf.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel49
  - number: '49.4'
    text: |-
      Bij het bepalen van de straf komen alleen die handelingen in aanmerking die de medeplichtige opzettelijk heeft
      gemakkelijk gemaakt of bevorderd, benevens hun gevolgen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel49
  - number: '50'
    text: |-
      De persoonlijke omstandigheden waardoor de strafbaarheid uitgesloten, verminderd of verhoogd wordt, komen bij de
      toepassing van de strafwet alleen in aanmerking ten aanzien van die dader of medeplichtige wie zij persoonlijk
      betreffen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel50
  - number: '51.1'
    text: Strafbare feiten kunnen worden begaan door natuurlijke personen en rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel51
  - number: '51.2'
    text: |-
      Indien een strafbaar feit wordt begaan door een rechtspersoon, kan de strafvervolging worden ingesteld en kunnen de
      in de wet voorziene straffen en maatregelen, indien zij daarvoor in aanmerking komen, worden uitgesproken:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel51
  - number: 51.2.1°
    text: tegen die rechtspersoon, dan wel
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel51
  - number: 51.2.2°
    text: |-
      tegen hen die tot het feit opdracht hebben gegeven, alsmede tegen hen die feitelijke leiding hebben gegeven aan de
      verboden gedraging, dan wel
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel51
  - number: 51.2.3°
    text: tegen de onder 1° en 2° genoemden te zamen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel51
  - number: '51.3'
    text: |-
      Voor de toepassing van de vorige leden wordt met de rechtspersoon gelijkgesteld: de vennootschap zonder
      rechtspersoonlijkheid, de maatschap, de rederij en het doelvermogen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel51
  - number: '52'
    text: Medeplichtigheid aan overtreding is niet strafbaar.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel52
  - number: '53.1'
    text: |-
      Bij misdrijven door middel van de drukpers gepleegd wordt de uitgever als zodanig niet vervolgd, indien het
      gedrukte stuk zijn naam en woonplaats vermeldt en de dader bekend is of op de eerste aanmaning nadat tot het
      instellen van een gerechtelijk vooronderzoek is overgegaan, door de uitgever is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel53
  - number: '53.2'
    text: |-
      Deze bepaling is niet toepasselijk, indien de dader op het tijdstip van de uitgave strafrechtelijk niet vervolgbaar
      of buiten het Rijk in Europa gevestigd was.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel53
  - number: '54.1'
    text: |-
      Bij misdrijven door middel van de drukpers gepleegd wordt de drukker als zodanig niet vervolgd, indien het
      gedrukte stuk zijn naam en woonplaats vermeldt en de persoon op wiens last het stuk is gedrukt, bekend is of op
      de eerste aanmaning nadat tot het instellen van een gerechtelijk vooronderzoek is overgegaan, door de drukker is
      bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel54
  - number: '54.2'
    text: |-
      Deze bepaling is niet toepasselijk, indien de persoon op wiens last het stuk is gedrukt, op het tijdstip van het
      drukken strafrechtelijk niet vervolgbaar of buiten het Rijk in Europa gevestigd was.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel54
  - number: 54a
    text: |-
      Een tussenpersoon die een telecommunicatiedienst verleent bestaande in de doorgifte of opslag van gegevens die
      van een ander afkomstig zijn, wordt als zodanig niet vervolgd indien hij voldoet aan een bevel van de officier
      van justitie, na schriftelijke machtiging op vordering van de officier van justitie te verlenen door de rechter-
      commissaris, om alle maatregelen te nemen die redelijkerwijs van hem kunnen worden gevergd om de gegevens
      ontoegankelijk te maken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel54a
  - number: '55.1'
    text: |-
      Valt een feit in meer dan één strafbepaling, dan wordt slechts één van die bepalingen toegepast, bij verschil die
      waarbij de zwaarste hoofdstraf is gesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel55
  - number: '55.2'
    text: |-
      Indien voor een feit dat in een algemene strafbepaling valt een bijzondere strafbepaling bestaat, komt deze alleen
      in aanmerking.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel55
  - number: '56.1'
    text: |-
      Staan meerdere feiten, ofschoon elk op zichzelf misdrijf of overtreding opleverende, in zodanig verband dat zij
      moeten worden beschouwd als één voortgezette handeling, dan wordt slechts één strafbepaling toegepast, bij verschil
      die waarbij de zwaarste hoofdstraf is gesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel56
  - number: '56.2'
    text: |-
      Insgelijks wordt slechts één strafbepaling toegepast bij schuldigverklaring aan valsheid of muntschennis en aan het
      gebruikmaken van het voorwerp ten opzichte waarvan de valsheid of muntschennis gepleegd is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel56
  - number: '57.1'
    text: |-
      Bij samenloop van feiten die als op zichzelf staande handelingen moeten worden beschouwd en meer dan één misdrijf
      opleveren waarop gelijksoortige hoofdstraffen zijn gesteld, wordt één straf uitgesproken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel57
  - number: '57.2'
    text: |-
      Het maximum van deze straf is het totaal van de hoogste straffen op de feiten gesteld, doch - voor zover het
      gevangenisstraf of hechtenis betreft - niet meer dan een derde boven het hoogste maximum.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel57
  - number: '58'
    text: |-
      Bij samenloop van feiten die als op zichzelf staande handelingen moeten worden beschouwd en meer dan één misdrijf
      opleveren waarop ongelijksoortige hoofdstraffen zijn gesteld, kan elk van die straffen worden uitgesproken, doch
      deze mogen - voor zover het gevangenisstraf en hechtenis betreft - te zamen in duur de langstdurende niet meer dan
      een derde overtreffen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel58
  - number: '59'
    text: |-
      Bij veroordeling tot levenslange gevangenisstraf kunnen daarnevens geen andere straffen worden opgelegd dan
      ontzetting van bepaalde rechten, verbeurdverklaring van reeds in beslag genomen voorwerpen en openbaarmaking van de
      rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel59
  - number: '60'
    text: |-
      In de gevallen van de [artikelen 57][ref1] en [58][ref2] gelden ten aanzien van bijkomende straffen de volgende
      bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel58
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '58'
  - number: 60.1°
    text: |-
      de straffen van ontzetting van dezelfde rechten worden opgelost in één straf, in duur de opgelegde hoofdstraf of
      hoofdstraffen ten minste twee en ten hoogste vijf jaren te boven gaande, of ingeval geen andere hoofdstraf dan
      geldboete is opgelegd, in één straf van ten minste twee en ten hoogste vijf jaren;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel60
  - number: 60.2°
    text: |-
      de straffen van ontzetting van verschillende rechten worden voor elk misdrijf afzonderlijk en zonder vermindering
      opgelegd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel60
  - number: 60.3°
    text: |-
      de straffen van verbeurdverklaring van bepaalde voorwerpen worden voor elk misdrijf afzonderlijk en
      zonder vermindering opgelegd; de vervangende vrijheidsstraffen mogen gezamenlijk het maximum, bepaald in
      [artikel 24][ref1], niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 24c
  - number: 60a
    text: |-
      Bij samenloop op de wijze in de [artikelen 57][ref1] en [58][ref2] bedoeld, geldt voor de maatregel
      genoemd in [artikel 36f][ref3] dat de vervangende vrijheidsstraffen gezamenlijk het maximum, bepaald in
      [artikel 24c, derde lid][ref4], niet mogen overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel36f
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel24c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '58'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 36f
        afdeling: Eerste
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 24c
  - number: '61.1'
    text: |-
      De betrekkelijke zwaarte van ongelijksoortige hoofdstraffen wordt bepaald door de volgorde van [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '9'
  - number: '61.2'
    text: |-
      Waar de rechter de keuze tussen twee hoofdstraffen is gelaten, komt bij de vergelijking alleen de zwaarste van die
      straffen in aanmerking.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel61
  - number: '61.3'
    text: De betrekkelijke zwaarte van gelijksoortige hoofdstraffen wordt bepaald door het maximum.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel61
  - number: '61.4'
    text: |-
      De betrekkelijke duur, zowel van ongelijksoortige als van gelijksoortige hoofdstraffen, wordt eveneens bepaald door
      het maximum.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel61
  - number: '62.1'
    text: |-
      Bij samenloop op de wijze in de [artikelen 57][ref1] en [58][ref2] bedoeld, hetzij van overtredingen met
      misdrijven, hetzij van overtredingen onderling, wordt voor elke overtreding zonder vermindering straf opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel58
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '58'
  - number: '62.2'
    text: |-
      De vervangende vrijheidsstraffen mogen voor de misdrijven en overtredingen of voor de overtredingen gezamenlijk het
      maximum, bepaald in [artikel 24][ref1], niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 24c
  - number: '63'
    text: |-
      Indien iemand, na veroordeling tot straf, opnieuw wordt schuldig verklaard aan misdrijf of overtreding vóór
      die veroordeling gepleegd, zijn de bepalingen van deze titel voor het geval van gelijktijdige berechting van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel63
  - number: '64'
    text: |-
      Inzake een misdrijf dat alleen op klacht wordt vervolgd, is degene tegen wie het feit is begaan, tot de klacht
      gerechtigd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel64
  - number: '65.1'
    text: |-
      Indien de in [artikel 64][ref1] aangewezen persoon de leeftijd van zestien jaren nog niet heeft bereikt of anders
      dan wegens verkwisting onder curatele is gesteld, dan wel aan een zodanige gebrekkige ontwikkeling of ziekelijke
      stoornis van zijn geestvermogens lijdt dat hij niet in staat is te beoordelen of zijn belang gediend is met de
      klacht, geschiedt de klacht door zijn wettige vertegenwoordiger in burgerlijke zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel64
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '64'
  - number: '65.2'
    text: |-
      Indien de in [artikel 64][ref1] aangewezen persoon overleden is, zijn tot de klacht gerechtigd: zijn ouders, zijn
      kinderen en zijn overlevende echtgenoot, tenzij blijkt dat hij een vervolging niet heeft gewild.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel64
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '64'
  - number: '65.3'
    text: |-
      Indien de klacht tegen de wettige vertegenwoordiger in burgerlijke zaken van de in [artikel 64][ref1] aangewezen
      persoon moet geschieden, zijn tot de klacht gerechtigd: de echtgenoot, een bloedverwant in de rechte linie of, bij
      het ontbreken van al die personen, een broer en een zuster.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel64
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '64'
  - number: '65.4'
    text: |-
      Indien een in het tweede of derde lid aangewezen persoon de leeftijd van zestien jaren nog niet heeft bereikt
      of anders dan wegens verkwisting onder curatele is gesteld, dan wel aan een zodanige gebrekkige ontwikkeling of
      ziekelijke stoornis van zijn geestvermogens lijdt dat hij niet in staat is te beoordelen of zijn belang gediend is
      met de klacht, kan vervolging plaatsvinden op klacht van diens wettige vertegenwoordiger in burgerlijke zaken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel65
  - number: '66.1'
    text: |-
      De klacht kan worden ingediend gedurende drie maanden na de dag waarop de tot klacht gerechtigde kennis heeft
      genomen van het gepleegde feit.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel66
  - number: '66.2'
    text: |-
      Indien degene tegen wie het feit is begaan, nadat de termijn een aanvang heeft genomen, is overleden, dan wel het
      recht tot het indienen van de klacht heeft verloren, verkregen of herkregen, loopt deze termijn zonder verlenging
      door.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel66
  - number: '67'
    text: Hij die de klacht indient, blijft gedurende acht dagen na de dag der indiening bevoegd deze in te trekken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel67
  - number: '68.1'
    text: |-
      Behoudens de gevallen waarin rechterlijke uitspraken voor herziening vatbaar zijn, kan niemand andermaal worden
      vervolgd wegens een feit waarover te zijnen aanzien bij gewijsde van de rechter in Nederland, de Nederlandse
      Antillen of Aruba onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel68
  - number: '68.2'
    text: |-
      Is het gewijsde afkomstig van een andere rechter, dan heeft tegen dezelfde persoon wegens hetzelfde feit geen
      vervolging plaats in geval van:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel68
  - number: 68.2.1°
    text: vrijspraak of ontslag van rechtsvervolging;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel68
  - number: 68.2.2°
    text: veroordeling, indien een straf is opgelegd, gevolgd door gehele uitvoering, gratie of verjaring der straf.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel68
  - number: '68.3'
    text: |-
      Niemand kan worden vervolgd wegens een feit dat te zijnen aanzien in een vreemde staat onherroepelijk is afgedaan
      door de voldoening aan een voorwaarde, door de bevoegde autoriteit gesteld ter voorkoming van strafvervolging.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel68
  - number: '69'
    text: Het recht tot strafvordering vervalt door de dood van de verdachte.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel69
  - number: '70.1'
    text: 'Het recht tot strafvordering vervalt door verjaring:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel70
  - number: 70.1.1°
    text: in twee jaren voor alle overtredingen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel70
  - number: 70.1.2°
    text: |-
      in zes jaren voor de misdrijven waarop geldboete, hechtenis of gevangenisstraf van niet meer dan drie jaren is
      gesteld;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel70
  - number: 70.1.3°
    text: in twaalf jaren voor de misdrijven waarop tijdelijke gevangenisstraf van meer dan drie jaren is gesteld;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel70
  - number: 70.1.4°
    text: in twintig jaren voor de misdrijven waarop gevangenisstraf van meer dan tien jaren is gesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel70
  - number: '70.2'
    text: |-
      In afwijking van het eerste lid verjaart het recht tot strafvordering niet voor misdrijven waarop levenslange
      gevangenisstraf is gesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel70
  - number: '71'
    text: 'De termijn van verjaring vangt aan op de dag na die waarop het feit is gepleegd, behoudens in de volgende gevallen:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel71
  - number: 71.1°
    text: |-
      bij de misdrijven omschreven in de [artikelen 172, eerste lid][ref1], [173, eerste lid][ref2], [173a][ref3] en
      [173b][ref4], vangt de termijn aan op de dag na die waarop het misdrijf ter kennis is gekomen van een ambtenaar
      belast met de opsporing van strafbare feiten;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel172
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel173
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel173a
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel173b
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '172'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '173'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 173a
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 173b
  - number: 71.2°
    text: |-
      bij valsheid op de dag na die waarop gebruik is gemaakt van het voorwerp ten opzichte waarvan de valsheid gepleegd
      is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel71
  - number: 71.3°
    text: |-
      bij de misdrijven omschreven in de [artikelen 240b][ref1], [242 tot en met 250][ref2] en [273a][ref3], en gepleegd
      ten aanzien van een persoon die de leeftijd van achttien jaren nog niet heeft bereikt, op de dag na die waarop die
      persoon achttien jaren is geworden;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel240b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel242
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel273a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 240b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '242'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 273a
  - number: 71.4°
    text: |-
      bij de misdrijven omschreven in de [artikelen 278][ref1], [279][ref2], [282][ref3] en [282a][ref4] op de dag na die
      van de bevrijding of de dood van hem tegen wie onmiddellijk het misdrijf gepleegd is;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel278
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel279
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel282
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel282a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '278'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '279'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '282'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 282a
  - number: 71.5°
    text: |-
      bij de overtredingen omschreven in de [artikelen 465][ref1], [466][ref2] en [467][ref3],
      op de dag na die waarop ingevolge de voorschriften gegeven in of ter uitvoering van
      [artikel 18c van Boek 1 van het Burgerlijk Wetboek][ref4], de aldaar bedoelde registers
      waaruit zodanige overtreding blijkt, naar de centrale bewaarplaats, bedoeld in
      [afdeling 8 van hoofdstuk 1 van het Besluit burgerlijke stand 1994][ref5] zijn overgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel465
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel466
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel467
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel18c
      [ref5]: https://wetten.overheid.nl/BWBR0006493#AfdelingAchtste
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel71
