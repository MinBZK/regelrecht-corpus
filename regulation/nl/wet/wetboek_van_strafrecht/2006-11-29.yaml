  - number: 15b.7
    text: |-
      De in het zesde lid genoemde artikelen vinden geen toepassing voor zover deze betrekking hebben op een getuige
      wiens identiteit niet of slechts ten dele blijkt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15b
  - number: 15c.1
    text: |-
      Indien het gerechtshof de vordering van het openbaar ministerie toewijst, verleent het machtiging de veroordeelde
      op het in de vordering aangegeven tijdstip in vrijheid te stellen. Het openbaar ministerie is bevoegd te
      vorderen dat vervroegde invrijheidstelling, waarvan uitstel is gelast, wederom wordt uitgesteld of niet plaats
      vindt, indien zich na de aanvankelijke beslissing opnieuw een omstandigheid heeft voorgedaan als bedoeld in
      [het eerste lid van artikel 15a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel15a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 15a
  - number: 15c.2
    text: |-
      Indien het gerechtshof de vordering geheel of gedeeltelijk afwijst, bepaalt het op welk tijdstip de veroordeelde
      vervroegd in vrijheid gesteld zal worden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15c
  - number: 15c.3
    text: |-
      De beslissing van het gerechtshof omtrent een vordering is met redenen omkleed en wordt in het openbaar
      uitgesproken. Vanwege de advocaat-generaal wordt zij onverwijld aan het openbaar ministerie dat de vordering
      instelde en aan de veroordeelde ter kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15c
  - number: 15c.4
    text: Tegen de beslissing van het gerechtshof staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15c
  - number: 15d
    text: |-
      In gevallen waarin het gerechtshof een vordering geheel of gedeeltelijk afwijst kan het op verzoek van
      de veroordeelde hem een vergoeding ten laste van de Staat toekennen voor de schade die hij heeft geleden
      ten gevolge van vrijheidsbeneming, ondergaan uit hoofde van [het tweede lid van artikel 15b][ref1].
      De [artikelen 89, eerste lid, tweede volzin, derde, vierde en vijfde lid][ref2], [90][ref3] en
      [93 van het Wetboek van Strafvordering][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel15b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel90
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel93
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 15b
