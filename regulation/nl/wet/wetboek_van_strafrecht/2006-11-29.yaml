  - number: 4.15°
    text: |-
      aan een terroristisch misdrijf, indien het misdrijf is gepleegd met het oogmerk de bevolking of een deel der
      bevolking van Nederland vrees aan te jagen, een Nederlandse overheid of een in Nederland gevestigde instelling
      of organisatie van de Europese Unie wederrechtelijk te dwingen iets te doen, niet te doen of te dulden, of de
      fundamentele politieke, constitutionele, economische of sociale structuren van Nederland of een in Nederland
      gevestigde instelling of organisatie van de Europese Unie ernstig te ontwrichten of te vernietigen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel4
  - number: 4.16°
    text: |-
      aan een der misdrijven omschreven in de [artikelen 225, derde lid][ref1], [311, eerste lid, onder 6°][ref2],
      [312, tweede lid, onder 5°][ref3], alsmede [317, derde lid, jo. 312, tweede lid, onder 5°][ref4], indien het
      misdrijf is gepleegd met het oogmerk een terroristisch misdrijf als in onderdeel 15° omschreven voor te bereiden of
      gemakkelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel311
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel312
