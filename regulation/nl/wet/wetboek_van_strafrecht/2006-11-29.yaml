  - number: 5.1.2°
    text: |-
      aan een feit hetwelk door de Nederlandse strafwet als misdrijf wordt beschouwd en waarop door de wet van het land
      waar het begaan is, straf is gesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel5
  - number: 5.1.3°
    text: |-
      aan een der misdrijven omschreven in de [artikelen 240b][ref1], [242 tot en met 250][ref2] en [273a][ref3], voor
      zover het feit is gepleegd ten aanzien van een persoon die de leeftijd van achttien jaren nog niet heeft bereikt
      dan wel aan een der misdrijven omschreven in de [artikelen 300 tot en met 303][ref4], voor zover het feit oplevert
      genitale verminking van een persoon van het vrouwelijke geslacht die de leeftijd van achttien jaren nog niet heeft
      bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel240b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel242
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel273a
