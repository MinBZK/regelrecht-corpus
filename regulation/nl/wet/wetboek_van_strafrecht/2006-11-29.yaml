  - number: '5.2'
    text: |-
      In de gevallen, omschreven in het eerste lid, onderdelen 2° en 3°, kan de vervolging ook plaatshebben, als de
      verdachte eerst na het feit Nederlander wordt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel5
  - number: 5a.1
    text: |-
      De Nederlandse strafwet is toepasselijk op de vreemdeling die in Nederland een vaste woon- of verblijfplaats
      heeft en zich buiten Nederland schuldig maakt aan een der misdrijven omschreven in de [artikelen 240b][ref1],
      [242 tot en met 250][ref2] en [273a][ref3], voor zover het feit is gepleegd ten aanzien van een persoon
      die de leeftijd van achttien jaren nog niet heeft bereikt dan wel aan een der misdrijven omschreven in de
      [artikelen 300 tot en met 303][ref4], voor zover het feit oplevert genitale verminking van een persoon van het
      vrouwelijke geslacht die de leeftijd van achttien jaren nog niet heeft bereikt, een terroristisch misdrijf, dan
      wel een der misdrijven omschreven in de [artikelen 225, derde lid][ref5], [311, eerste lid, onder 6°][ref6],
      [312, tweede lid, onder 5°][ref7], alsmede [317, derde lid][ref8], jo. [312, tweede lid, onder 5°][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel240b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel242
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel273a
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel300
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel225
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel311
      [ref7]: https://wetten.overheid.nl/BWBR0001854#Artikel312
      [ref8]: https://wetten.overheid.nl/BWBR0001854#Artikel317
      [ref9]: https://wetten.overheid.nl/BWBR0001854#Artikel312
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 240b
      - id: ref2
