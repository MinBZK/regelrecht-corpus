  - number: 14i.5
    text: |-
      De in het vierde lid genoemde artikelen vinden geen toepassing voor zover deze betrekking hebben op een getuige
      wiens identiteit niet of slechts ten dele blijkt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14i
  - number: 14i.6
    text: |-
      Gedurende het onderzoek kan het openbaar ministerie zijn ingediende vordering of conclusie en de veroordeelde zijn
      verzoek wijzigen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14i
  - number: 14j.1
    text: |-
      Rechterlijke beslissingen omtrent vorderingen van het openbaar ministerie of verzoeken van de veroordeelde zijn met
      redenen omkleed en worden in het openbaar uitgesproken. Zij zijn, voor zover zij geen deel uitmaken van uitspraken
      terzake van andere strafbare feiten, niet aan enig rechtsmiddel onderworpen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14j
  - number: 14j.2
    text: |-
      De inhoud van de in het eerste lid bedoelde beslissingen wordt onverwijld vanwege het openbaar ministerie
      schriftelijk medegedeeld aan de veroordeelde en aan degene die met het verlenen van hulp en steun is belast, zomede
      aan degene die bij de beslissing daarvan wordt ontheven. Indien de beslissing een wijziging van de bijzondere
      voorwaarden bevat of daarbij alsnog bijzondere voorwaarden zijn gesteld wordt de mededeling aan de veroordeelde in
      persoon betekend.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14j
  - number: 14k.1
    text: |-
      Wanneer overeenkomstig [artikel 14][ref1], een waarborgsom is gestort, wordt deze aan de veroordeelde teruggegeven,
      voor zover die som niet krachtens een rechterlijke beslissing, als bedoeld in [artikel 14][ref2], aan de Staat
      is vervallen. De teruggave geschiedt zodra vaststaat dat zodanige beslissing niet meer kan worden genomen,
      onverminderd de bevoegdheid van de rechter om, op vordering van het openbaar ministerie of op verzoek van de
      veroordeelde, te bevelen dat gehele of gedeeltelijke teruggave op een eerder tijdstip zal plaats hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14c
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel14g
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14k
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14c
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 14g
  - number: 14k.2
    text: |-
      In geval van een vordering of verzoek als bedoeld in het vorige lid vinden de [artikelen 14][ref1] overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14h
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14k
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14h
  - number: 14k.3
    text: De aanspraak op teruggave is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel14k
  - number: '15.1'
    text: |-
      De veroordeelde tot vrijheidsstraf waarvan het onvoorwaardelijk ten uitvoer te leggen gedeelte ten hoogste een jaar
      bedraagt wordt vervroegd in vrijheid gesteld wanneer de vrijheidsbeneming ten minste zes maanden heeft geduurd en
      van het alsdan nog ten uitvoer te leggen gedeelte van de straf een derde gedeelte is ondergaan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15
  - number: '15.2'
    text: |-
      De veroordeelde tot tijdelijke vrijheidsstraf waarvan het onvoorwaardelijk ten uitvoer te leggen gedeelte meer dan
      een jaar bedraagt wordt vervroegd in vrijheid gesteld wanneer hij twee derde gedeelte daarvan heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15
  - number: '15.3'
    text: |-
      Voor de toepassing van de vorige leden wordt de tijd die door de veroordeelde voor de tenuitvoerlegging van
      de uitspraak in verzekering, in voorlopige hechtenis of in detentie in het buitenland ingevolge een Nederlands
      verzoek om uitlevering is doorgebracht onder de termijn begrepen, tenzij die tijd, met toepassing van
      [artikel 68, eerste lid, laatste volzin, van het Wetboek van Strafvordering][ref1] reeds in mindering is gebracht
      op een andere straf die de veroordeelde heeft ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel68
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '68'
  - number: '15.4'
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien op grond van [artikel 14g, eerste lid][ref1], de
      tenuitvoerlegging van het geheel of een gedeelte van een vrijheidsstraf is gelast.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14g
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14g
  - number: '15.5'
    text: |-
      Indien de veroordeelde meer dan één vrijheidsstraf geheel of gedeeltelijk heeft te ondergaan, worden deze zo
      enigszins mogelijk aaneensluitend ten uitvoergelegd. In dat geval worden de tenuitvoer te leggen gedeelten
      gezamenlijk, met uitzondering van vervangende hechtenis, als één vrijheidsstraf aangemerkt, waarop dit artikel en
      [artikel 15a][ref1] toepasselijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel15a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 15a
  - number: '15.6'
    text: |-
      De [artikelen 570][ref1] en [570a van het Wetboek van Strafvordering][ref2] zijn toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel570
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel570a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '570'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 570a
  - number: 15a.1
    text: 'Vervroegde invrijheidstelling kan worden uitgesteld of achterwege blijven indien:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15a
  - number: 15a.1.a
    text: |-
      de veroordeelde op grond van de gebrekkige ontwikkeling of ziekelijke stoornis van zijn geestvermogens is geplaatst
      in een inrichting voor verpleging van ter beschikking gestelden en zijn verpleging voortzetting behoeft;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15a
  - number: 15a.1.b
    text: |-
      de veroordeelde onherroepelijk is veroordeeld terzake van een misdrijf waarvoor ingevolge
      [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref1] voorlopige hechtenis is toegelaten en dat is
      begaan na de aanvang van de tenuitvoerlegging van zijn straf;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: 15a.1.c
    text: |-
      is gebleken dat de veroordeelde zich anderszins na de aanvang van de tenuitvoerlegging van zijn straf zeer ernstig
      heeft misdragen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15a
  - number: 15a.1.d
    text: |-
      de veroordeelde na de aanvang van de tenuitvoerlegging van zijn straf zich hieraan onttrekt of hiertoe een poging
      doet.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15a
  - number: 15a.2
    text: |-
      Indien het openbaar ministerie, met de tenuitvoerlegging van de straf belast, van oordeel is dat er op een der
      gronden genoemd in het eerste lid reden is een vervroegde invrijheidstelling met een bepaalde termijn uit te
      stellen of achterwege te laten, richt het onverwijld een daartoe strekkende schriftelijke vordering tot het
      gerechtshof te Arnhem. De vordering bevat de grond waarop zij berust. Een afschrift van de vordering wordt
      toegezonden aan de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15a
  - number: 15a.3
    text: |-
      In de gevallen als bedoeld in [het vijfde lid van artikel 15][ref1] komt deze bevoegdheid toe aan het openbaar
      ministerie bij het gerecht waarvan de uitspraak het laatst in kracht van gewijsde is gegaan, dan wel aan het
      openbaar ministerie bij het gerecht, dat de langste ten uitvoer te leggen vrijheidsstraf heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel15
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '15'
  - number: 15a.4
    text: |-
      De in het tweede lid bedoelde vordering dient uiterlijk dertig dagen vóór het tijdstip waarop vervroegde
      invrijheidstelling ingevolge het vorige artikel zou moeten plaats vinden te zijn ontvangen op de griffie van het
      gerechtshof. Het openbaar ministerie is in een later ingediende vordering ontvankelijk indien het aannemelijk maakt
      dat een omstandigheid als bedoeld in het eerste lid zich eerst nadien heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15a
  - number: 15a.5
    text: |-
      Vervroegde invrijheidstelling kan tevens worden uitgesteld of achterwege blijven, indien de feiten of
      omstandigheden als genoemd in het eerste lid, onder *b, c* en *d*, zich hebben voorgedaan gedurende de periode die
      ingevolge [artikel 27, eerste lid][ref1], op de gevangenisstraf in mindering wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel27
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '27'
  - number: 15b.1
    text: |-
      Bij zijn vordering zendt het openbaar ministerie de daarop betrekking hebbende stukken aan het gerechtshof
      toe. De voorzitter van het gerechtshof bepaalt daarop onverwijld een dag voor het onderzoek van de zaak, tenzij
      hij vaststelt dat het openbaar ministerie in zijn vordering niet kan worden ontvangen. Indien zulks niet wordt
      vastgesteld, stelt de griffier een afschrift van de vordering en van de daarop betrekking hebbende stukken de
      advocaat-generaal bij het gerechtshof ter hand.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15b
  - number: 15b.2
    text: |-
      Hangende de beslissing van het gerechtshof op de vordering wordt de veroordeelde niet vervroegd in vrijheid
      gesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15b
  - number: 15b.3
    text: |-
      Indien niet blijkt dat de veroordeelde een raadsman heeft, geeft de voorzitter op verzoek van de veroordeelde
      aan het bureau rechtsbijstandvoorziening last tot toevoeging van een raadsman. De veroordeelde en zijn
      raadsman kunnen voor de aanvang van het onderzoek van de stukken kennis nemen. Het bepaalde bij en krachtens
      [artikel 34 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel34
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '34'
  - number: 15b.4
    text: |-
      Zowel de advocaat-generaal als de veroordeelde is bevoegd getuigen en deskundigen te doen dagvaarden
      of schriftelijk te doen oproepen om bij het onderzoek tegenwoordig te zijn. De [artikelen 260][ref1] en
      [263 van het Wetboek van Strafvordering][ref2] vinden overeenkomstige toepassing. Het gerechtshof kan ambtshalve
      ook andere personen horen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel260
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel263
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '260'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '263'
  - number: 15b.5
    text: |-
      Het onderzoek vindt plaats ter openbare terechtzitting. De veroordeelde wordt in de gelegenheid gesteld bij de
      behandeling van zijn zaak tegenwoordig te zijn en zich door zijn raadsman te doen bijstaan. De advocaat-generaal is
      bij het onderzoek aanwezig en wordt terzake gehoord.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel15b
  - number: 15b.6
    text: |-
      De [artikelen 268, tweede lid][ref1], [269][ref2], [270][ref3], [271, eerste lid][ref4],
      [272][ref5], [273, eerste en tweede lid][ref6], [277][ref7], [281][ref8], [284, eerste lid][ref9],
      [287, tweede en derde lid][ref10], [288, eerste, tweede en vierde lid][ref11],
      [289, eerste, tweede en derde lid][ref12], [290 tot en met 297][ref13], [315][ref14], [319][ref15],
      [320, eerste en tweede lid][ref16], [322][ref17], [324][ref18], [326 tot en met 331][ref19],
      [345, eerste en derde lid][ref20], en [346 van het Wetboek van Strafvordering][ref21] vinden overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel268
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel269
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel270
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel271
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel272
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel273
      [ref7]: https://wetten.overheid.nl/BWBR0001903#Artikel277
