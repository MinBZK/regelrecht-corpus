  - number: '72.1'
    text: Elke daad van vervolging stuit de verjaring, ook ten aanzien van anderen dan de vervolgde.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel72
  - number: '72.2'
    text: |-
      Na de stuiting vangt een nieuwe verjaringstermijn aan. Het recht tot strafvordering vervalt evenwel ten aanzien
      van overtredingen na tien jaren en ten aanzien van misdrijven indien vanaf de dag waarop de oorspronkelijke
      verjaringstermijn is aangevangen een periode is verstreken die gelijk is aan twee maal de voor het misdrijf
      geldende verjaringstermijn.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel72
  - number: '73'
    text: De schorsing van de strafvervolging ter zake van een prejudicieel geschil schorst de verjaring.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel73
  - number: '74.1'
    text: |-
      De officier van justitie kan voor de aanvang van de terechtzitting een of meer voorwaarden stellen ter voorkoming
      van de strafvervolging wegens misdrijven, met uitzondering van die waarop naar de wettelijke omschrijving
      gevangenisstraf is gesteld van meer dan zes jaar, en wegens overtreding. Door voldoening aan die voorwaarden
      vervalt het recht tot strafvordering.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74
  - number: '74.2'
    text: 'De volgende voorwaarden kunnen worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74
  - number: 74.2.a
    text: |-
      betaling aan de staat van een geldsom, te bepalen op ten minste € 3 en ten hoogste het maximum van de geldboete die
      voor het feit kan worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74
  - number: 74.2.b
    text: |-
      afstand van voorwerpen die in beslag zijn genomen en vatbaar zijn voor verbeurdverklaring of onttrekking aan het
      verkeer;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74
  - number: 74.2.c
    text: |-
      uitlevering, of voldoening aan de staat van de geschatte waarde, van voorwerpen die vatbaar zijn voor
      verbeurdverklaring;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74
  - number: 74.2.d
    text: |-
      voldoening aan de staat van een geldbedrag of overdracht van inbeslaggenomen voorwerpen ter gehele of gedeeltelijke
      ontneming van het ingevolge [artikel 36e][ref1] voor ontneming vatbare wederrechtelijk verkregen voordeel;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36e
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 36e
        afdeling: Eerste
  - number: 74.2.e
    text: gehele of gedeeltelijke vergoeding van de door het strafbare feit veroorzaakte schade;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74
  - number: 74.2.f
    text: het verrichten van onbetaalde arbeid of het volgen van een leerproject gedurende ten hoogste honderdtwintig uren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74
  - number: '74.3'
    text: |-
      De officier van justitie doet in geval van misdrijf aan de rechtstreeks belanghebbende die hem bekend is,
      onverwijld schriftelijk mededeling van de datum waarop hij die voorwaarden heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74
  - number: '74.4'
    text: |-
      Op de in het tweede lid, onder f, bedoelde voorwaarde is het bepaalde bij of krachtens de
      [artikelen 22c, eerste en vierde lid][ref1], [22e][ref2] en [22k][ref3] met betrekking tot taakstraffen, van
      overeenkomstige toepassing. De onbetaalde arbeid of het leerproject wordt binnen een termijn van zes maanden na
      instemming met de voorwaarde voltooid. Het openbaar ministerie kan deze termijn eenmaal met zes maanden verlengen.
      Het zendt hiervan zo spoedig mogelijk een kennisgeving aan de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel22c
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel22e
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel22k
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 22c
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 22e
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 22k
  - number: '74.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent de nakoming van de voorwaarde,
      bedoeld in het tweede lid, onderdeel a. Deze voorschriften hebben in ieder geval betrekking op de plaats en wijze
      van betaling van de geldsom, de termijn waarbinnen die betaling moet zijn geschied en de verantwoording van de
      ontvangen geldbedragen. Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent
      de nakoming van de overige in het tweede lid bedoelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74
  - number: 74a
    text: |-
      Is op het strafbare feit naar de wettelijke omschrijving geen andere hoofdstraf gesteld dan geldboete en biedt de
      verdachte aan, binnen een door de officier van justitie te bepalen termijn, het maximum van de geldboete te betalen
      en aan alle overige, overeenkomstig [artikel 74, tweede lid][ref1], te stellen voorwaarden te voldoen, dan mag de
      officier van justitie het stellen van voorwaarden, als bedoeld in [artikel 74][ref2], niet weigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 74b.1
    text: |-
      Een bevel als bedoeld in [artikel 12k van het Wetboek van Strafvordering][ref1] doet, na voldoening aan de
      overeenkomstig [artikel 74][ref2] gestelde voorwaarden, het recht tot strafvordering herleven als ware het niet
      vervallen geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel12k
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 12k
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 74b.2
    text: |-
      Na een bevel, als bedoeld in het vorige lid, worden bedragen, betaald in toepassing van
      [artikel 74, tweede lid, onder a, c en d][ref1], onverwijld terugbetaald aan degene die ze heeft betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 74b.3
    text: |-
      Volgt na een bevel als bedoeld in het eerste lid een veroordeling, dan houdt de rechter rekening met de afstand
      of uitlevering door de veroordeelde van voorwerpen op grond van [artikel 74, tweede lid, onder b en c][ref1], met
      de vergoeding van schade op grond van [artikel 74, tweede lid, onder e][ref2], en met de onbetaalde arbeid die is
      verricht of het leerproject dat is gevolgd op grond van [artikel 74, tweede lid, onder f][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 74b.4
    text: |-
      Eindigt, na een bevel als bedoeld in het eerste lid, de zaak waarbij een voorwaarde is gesteld als bedoeld in
      [artikel 74, tweede lid, onder f][ref1], zonder oplegging van straf of maatregel, dan kan de rechter, op verzoek
      van de gewezen verdachte, deze een vergoeding ten laste van de staat toekennen voor de schade welke hij ten gevolge
      van de verrichtte onbetaalde arbeid of het gevolgde leerproject heeft geleden. Onder schade is begrepen het nadeel
      dat niet in vermogensschade bestaat. De [artikelen 89, derde tot en met zesde lid][ref2], [90][ref3], [91][ref4] en
      [93 van het Wetboek van Strafvordering][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel90
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel91
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel93
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '89'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '90'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '91'
      - id: ref5
        bwb_id: BWBR0001903
        artikel: '93'
  - number: 74c.1
    text: |-
      Bij algemene maatregel van bestuur kan aan daartoe aan te wijzen opsporingsambtenaren in bij die algemene maatregel
      van bestuur aangewezen zaken betreffende overtredingen, begaan door personen die de leeftijd van twaalf jaren
      hebben bereikt, tot wederopzeggens de bevoegdheid worden verleend die bij [artikel 74, eerste lid][ref1], aan de
      officier van justitie is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 74c.2
    text: |-
      De te stellen voorwaarde bestaat in de betaling van een bepaalde geldsom. Bij of krachtens algemene maatregel van
      bestuur worden voorschriften gegeven omtrent de plaats en wijze van betaling en de termijn waarbinnen de betaling
      moet zijn geschied.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74c
  - number: 74c.3
    text: |-
      Het eerste en het tweede lid zijn van overeenkomstige toepassing op zaken betreffende misdrijven, als bedoeld in
      [artikel 74, eerste lid][ref1], van eenvoudige aard, welke zijn begaan door personen die de leeftijd van achttien
      jaren hebben bereikt, met dien verstande dat de te betalen geldsom ten hoogste € 350 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 74c.4
    text: |-
      De ambtenaren bekleed met de bevoegdheid, bedoeld in het eerste lid, maken hiervan gebruik volgens richtlijnen,
      vast te stellen door het College van procureurs-generaal.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74c
  - number: 74c.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot de aanwijzing
      van de in het eerste lid bedoelde opsporingsambtenaren, het toezicht op de wijze waarop zij van de hun verleende
      bevoegdheid gebruik maken en de intrekking van de aanwijzing van een opsporingsambtenaar.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74c
  - number: 74c.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven inzake de verantwoording van ingevolge
      het tweede en derde lid betaalde geldbedragen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74c
  - number: 74c.7
    text: |-
      Bij het stellen van voorwaarden door opsporingsambtenaren zijn de [artikelen 74, derde lid][ref1], en [74b][ref2]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74b
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel74c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 74b
  - number: '75'
    text: |-
      Het recht tot uitvoering van de straf of maatregel vervalt door de dood van de veroordeelde, met uitzondering van
      de maatregel tot ontneming van wederrechtelijk verkregen voordeel.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel75
  - number: '76.1'
    text: Het recht tot uitvoering van de straf of maatregel vervalt door verjaring.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel76
  - number: '76.2'
    text: |-
      De termijn van deze verjaring is een derde langer dan de termijn van verjaring van het recht tot strafvordering. In
      geen geval is de termijn korter dan de duur van de opgelegde straf.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel76
  - number: 76a.1
    text: De termijn van verjaring vangt aan op de dag na die waarop de rechterlijke uitspraak kan worden ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel76a
  - number: 76a.2
    text: |-
      Bij ongeoorloofde afwezigheid van een veroordeelde die zijn straf in een inrichting ondergaat, vangt een nieuwe
      verjaringstermijn aan op de dag na die waarop de ongeoorloofde afwezigheid aanving. Bij herroeping van een
      voorwaardelijke invrijheidstelling vangt een nieuwe verjaringstermijn aan op de dag na die van de herroeping.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel76a
  - number: 76a.3
    text: |-
      De termijn loopt niet gedurende de bij de wet bevolen schorsing van de tenuitvoerlegging, noch gedurende de tijd
      dat de veroordeelde, zij het ook ter zake van een andere veroordeling, in verzekerde bewaring is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel76a
  - number: 76a.4
    text: |-
      Wanneer een geldboete wegens een overtreding is opgelegd en de rechter heeft beslist dat het bedrag daarvan in
      gedeelten mag worden voldaan, dan wel het openbaar ministerie aan de veroordeelde op diens verzoek uitstel van
      betaling heeft verleend of betaling in termijnen heeft toegestaan, wordt de verjaringstermijn verlengd met twee
      jaren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel76a
  - number: 76a.5
    text: |-
      De termijn loopt niet gedurende de tijd dat de tenuitvoerlegging aan een vreemde Staat is overgedragen, zolang
      de Minister van Justitie van de autoriteiten van die Staat geen mededeling, houdende een beslissing omtrent de
      overname van de tenuitvoerlegging, heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel76a
  - number: 76a.6
    text: |-
      Indien, nadat de tenuitvoerlegging door een vreemde Staat is overgenomen, die Staat afstand doet van zijn recht tot
      tenuitvoerlegging ten behoeve van Nederland, vangt een nieuwe verjaringstermijn aan op de dag waarop de Minister
      van Justitie de mededeling van de autoriteiten van die Staat omtrent de afstand heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel76a
  - number: '77.1'
    text: |-
      Het recht tot strafvordering en het recht tot uitvoering van de straf vervallen door de overdracht van de
      strafvervolging aan een vreemde staat overeenkomstig de bepalingen van [de derde afdeling van titel X van het
      vierde boek van het Wetboek van Strafvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77
  - number: '77.2'
    text: |-
      In het geval, bedoeld in het vorige lid, herleven het recht tot strafvordering en het recht tot uitvoering van de
      straf, indien de autoriteiten van de staat die de strafvervolging had overgenomen op die beslissing terugkomen of
      mededelen dat geen strafvervolging wordt ingesteld dan wel een ingestelde vervolging is gestaakt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77
  - number: 77a
    text: |-
      Ten aanzien van degene die ten tijde van het begaan van een strafbaar feit de leeftijd van twaalf jaren doch nog
      niet die van achttien jaren heeft bereikt, zijn de [artikelen 9, eerste lid][ref1], [10 tot en met 22a][ref2],
      [24c][ref3], [37 tot en met 38i][ref4], [44][ref5] en [57 tot en met 62][ref6] niet van toepassing. In de plaats
      daarvan treden de bijzondere bepalingen vervat in de [artikelen 77d tot en met 77gg][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel24c
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel37
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel44
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel57
      [ref7]: https://wetten.overheid.nl/BWBR0001854#Artikel77d
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 24c
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '37'
        afdeling: Tweede
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '44'
      - id: ref6
        bwb_id: BWBR0001854
        artikel: '57'
      - id: ref7
        bwb_id: BWBR0001854
        artikel: 77d
  - number: 77b
    text: |-
      Ten aanzien van degene die ten tijde van het begaan van een strafbaar feit de leeftijd van zestien jaren doch nog
      niet die van achttien jaren heeft bereikt, kan de rechter de [artikelen 77][ref1] buiten toepassing laten en recht
      doen overeenkomstig de bepalingen in de voorgaande titels vervat, indien hij daartoe grond vindt in de ernst van
      het begane feit, de persoonlijkheid van de dader of de omstandigheden waaronder het feit is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77g
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77g
  - number: 77c
    text: |-
      Ten aanzien van degene die ten tijde van het begaan van het strafbaar feit de leeftijd van achttien jaren
      doch nog niet die van eenentwintig jaren heeft bereikt, kan de rechter, indien hij daartoe grond vindt in
      de persoonlijkheid van de dader of de omstandigheden waaronder het feit is begaan, recht doen overeenkomstig
      [de artikelen 77g tot en met 77gg][ref1]. De uitvoering van de maatregel van plaatsing in een inrichting voor
      jeugdigen vindt dan plaats overeenkomstig [artikel 37c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77g
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77g
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 37c
        afdeling: Tweede
  - number: 77d.1
    text: |-
      De verjaringstermijn van het recht tot strafvordering, genoemd in [artikel 70][ref1], wordt ten aanzien van
      misdrijven tot de helft van de daar bedoelde duur ingekort.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel70
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '70'
  - number: 77d.2
    text: |-
      Het eerste lid is niet van toepassing op misdrijven omschreven in de [artikelen 240b][ref1],
      [242 tot en met 250][ref2] en [273a][ref3], gepleegd door een persoon die ten tijde van het begaan van het
      strafbaar feit de leeftijd van zestien jaren heeft bereikt, ten aanzien van een persoon die de leeftijd van
      achttien jaren nog niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel240b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel242
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel273a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 240b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '242'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 273a
  - number: 77d.3
    text: |-
      Het recht tot strafvordering voor misdrijven waarop levenslange gevangenisstraf is gesteld, verjaart in twintig
      jaren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77d
  - number: 77e.1
    text: |-
      De opsporingsambtenaar die daartoe door de officier van justitie is aangewezen, kan na verkregen toestemming door
      de officier van justitie aan de verdachte voorstellen dat deze deelneemt aan een project. De deelneming strekt tot
      voorkoming van toezending van het opgemaakte proces-verbaal aan de officier van justitie. Bij algemene maatregel
      van bestuur worden de strafbare feiten aangewezen die op deze wijze kunnen worden afgedaan.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77e
  - number: 77e.2
    text: |-
      Bij een voorstel als bedoeld in het eerste lid, deelt de opsporingsambtenaar de verdachte mede dat hij niet
      verplicht is aan het project deel te nemen en licht hem in over de mogelijke gevolgen van niet-deelneming.
      Het voorstel, de mededeling en de inlichtingen over de mogelijke gevolgen worden daarbij de verdachte tevens
      schriftelijk ter hand gesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77e
  - number: 77e.3
    text: |-
      De officier van justitie geeft algemene aanwijzingen omtrent de wijze van afdoening ingevolge het eerste lid. Deze
      aanwijzingen betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77e
  - number: 77e.3.a
    text: |-
      de projecten en de categorieën van strafbare feiten die, gelet op de aard van deze projecten, in aanmerking komen
      voor deze wijze van afdoening;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77e
  - number: 77e.3.b
    text: de duur van de deelneming, afhankelijk van de aard van het strafbare feit en het project en
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77e
  - number: 77e.3.c
    text: de wijze waarop de toestemming van de officier van justitie kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77e
  - number: 77e.4
    text: De duur van de deelneming is ten hoogste twintig uren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77e
  - number: 77e.5
    text: |-
      Indien de opsporingsambtenaar, bedoeld in het eerste lid, van oordeel is dat de verdachte naar behoren aan
      een project heeft deelgenomen, stelt hij de officier van justitie en de verdachte hiervan schriftelijk in
      kennis. Daarmee vervalt het recht tot strafvordering, behalve indien een bevel wordt gegeven als bedoeld in
      [artikel 12i van het Wetboek van Strafvordering][ref1]. In dat geval houdt de rechter, indien hij een straf oplegt,
      rekening met de voltooide deelneming.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel12i
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77e
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 12i
  - number: 77f.1
    text: |-
      Bij toepassing van [artikel 74, eerste lid][ref1], kan de officier van justitie tevens als voorwaarde stellen dat
      de verdachte


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77f
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 77f.1.a
    text: |-
      zich zal richten naar de aanwijzingen van een stichting als bedoeld in
      [artikel 1, onder f, van de Wet op de jeugdzorg][ref1], voor een daarbij te bepalen termijn van ten hoogste zes
      maanden;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77f
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 77f.1.b
    text: |-
      onbetaalde arbeid of arbeid tot herstel van de door het strafbare feit aangerichte schade verricht dan wel een
      leerproject volgt gedurende een door hem te bepalen duur van ten hoogste veertig uren binnen een door hem te
      bepalen termijn van ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77f
  - number: 77f.2
    text: |-
      Op de in het eerste lid, onder b, bedoelde voorwaarden zijn de [artikelen 77m, eerste en negende lid][ref1],
      [77o, eerste lid][ref2], en [77ff, vierde lid][ref3], met betrekking tot taakstraffen van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77m
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77o
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77f
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77m
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77o
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '77'
  - number: 77f.3
    text: |-
      De geldsom vermeld in [artikel 74, tweede lid, onder a][ref1], bedraagt ten hoogste het maximum van een geldboete
      van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77f
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 77g.1
    text: In plaats van de op een feit gestelde straffen worden de straffen en maatregelen opgelegd, in deze Titel voorzien.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77g
  - number: 77g.2
    text: |-
      Naast de maatregel van plaatsing in een inrichting voor jeugdigen wordt voor hetzelfde feit geen geldboete of een
      taakstraf opgelegd, behoudens het bepaalde in [artikel 77x, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77x
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77g
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77x
  - number: 77g.3
    text: |-
      In geval van veroordeling tot een geldboete of jeugddetentie, vervangende jeugddetentie daaronder niet begrepen,
      waarvan het onvoorwaardelijk ten uitvoer te leggen deel ten hoogste zes maanden bedraagt, kan de rechter tevens een
      taakstraf opleggen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77g
  - number: 77h.1
    text: 'De hoofdstraffen zijn:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77h.1.a
    text: 'in geval van misdrijf: jeugddetentie, taakstraf of geldboete;'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77h.1.b
    text: 'in geval van overtreding: taakstraf of geldboete.'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77h.2
    text: 'Een taakstraf bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77h.2.a
    text: |-
      een werkstraf, zijnde het verrichten van onbetaalde arbeid of het verrichten van arbeid tot herstel van de door het
      strafbare feit aangerichte schade, of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77h.2.b
    text: een leerstraf, zijnde het volgen van een leerproject, of
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77h.2.c
    text: een combinatie van werkstraf en leerstraf.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77h.3
    text: 'De bijkomende straffen zijn:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77h.3.a
    text: verbeurdverklaring;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77h.3.b
    text: ontzegging van de bevoegdheid motorrijtuigen te besturen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77h.4
    text: 'De maatregelen zijn:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77h.4.a
    text: plaatsing in een inrichting voor jeugdigen;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77h.4.b
    text: onttrekking aan het verkeer;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77h.4.c
    text: ontneming van wederrechtelijk verkregen voordeel;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77h.4.d
    text: schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77h
  - number: 77i.1
    text: 'De duur van de jeugddetentie is:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77i
  - number: 77i.1.a
    text: |-
      voor degene die ten tijde van het begaan van het misdrijf de leeftijd van zestien jaren nog niet had bereikt: ten
      minste een dag en ten hoogste twaalf maanden, en
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77i
  - number: 77i.1.b
    text: overigens ten hoogste vierentwintig maanden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77i
  - number: 77i.2
    text: De duur van de jeugddetentie wordt in de rechterlijke uitspraak aangewezen in dagen, weken of maanden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77i
  - number: 77i.3
    text: |-
      De [artikelen 26][ref1] en [27][ref2] zijn bij veroordeling tot jeugddetentie van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel27
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77i
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '27'
  - number: 77j.1
    text: |-
      In bijzondere gevallen kan Onze Minister van Justitie bepalen dat de tenuitvoerlegging van de jeugddetentie
      gedurende een tijdvak van ten hoogste drie maanden wordt onderbroken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77j
  - number: 77j.2
    text: |-
      Onze Minister van Justitie kan nadere regels stellen aangaande het onderbreken van de tenuitvoerlegging,
      bedoeld in het eerste lid. Deze betreffen in elk geval de criteria waaraan de betrokkene moet voldoen om voor
      strafonderbreking in aanmerking te komen, de bevoegdheid tot en de wijze van verlening alsmede de voorwaarden die
      hieraan kunnen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77j
  - number: 77j.3
    text: |-
      Ten aanzien van de beslissingen omtrent de onderbreking van de tenuitvoerlegging als bedoeld in het eerste lid is
      [Hoofdstuk XV van de Beginselenwet justitiële jeugdinrichtingen][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77j
    references:
      - id: ref1
        bwb_id: BWBR0011756
        hoofdstuk: XV
  - number: 77j.4
    text: |-
      De rechter die de straf heeft opgelegd kan te allen tijde de jeugdige aan wie een jeugddetentie is opgelegd,
      voorwaardelijk in vrijheid stellen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77j
  - number: 77j.5
    text: |-
      In geval van een voorwaardelijke invrijheidstelling wordt een proeftijd bepaald van ten hoogste twee
      jaren. De duur van de proeftijd en de gestelde voorwaarden worden de veroordeelde in persoon betekend.
      De [artikelen 77y, derde lid][ref1], [77z][ref2], [77aa][ref3] en [77cc tot en met 77ee][ref4] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77y
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77z
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77aa
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel77cc
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77j
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77y
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77z
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 77aa
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 77cc
  - number: 77k
    text: |-
      De straf van jeugddetentie kan door de rechter die de straf heeft opgelegd op vordering van het openbaar ministerie
      of op verzoek van de veroordeelde geheel of gedeeltelijk worden vervangen door een van de straffen genoemd in
      [artikel 9, eerste lid][ref1], indien de tenuitvoerlegging van de opgelegde straf geheel of gedeeltelijk zou moeten
      plaatsvinden nadat de veroordeelde de leeftijd van achttien jaren heeft bereikt en deze naar het oordeel van de
      rechter niet meer voor een zodanige straf in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77k
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '9'
  - number: 77l.1
    text: |-
      Het bedrag van de geldboete is ten minste het bedrag, genoemd in [artikel 23, tweede lid][ref1], en ten hoogste het
      maximum van een geldboete van de tweede categorie. [Artikel 24a][ref2] is van overeenkomstige toepassing met dien
      verstande dat de rechter bij elke geldboete kan bepalen dat het bedrag in gedeelten kan worden voldaan. De rechter
      stelt daarbij de hoogte van elk van die gedeelten vast.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel24a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77l
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 24a
  - number: 77l.2
    text: |-
      De rechter kan bij de uitspraak waarbij geldboete wordt opgelegd, bevelen dat voor het geval volledige betaling
      noch volledig verhaal van het verschuldigde bedrag volgt, vervangende jeugddetentie zal worden toegepast.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77l
  - number: 77l.3
    text: |-
      Indien geen of geen volledige betaling van het bedrag van de geldboete heeft plaatsgevonden en geen of geen
      volledig verhaal mogelijk is, kan de rechter die de straf heeft opgelegd het nog te betalen bedrag op vordering
      van het openbaar ministerie vervangen door jeugddetentie of op verzoek van de veroordeelde vervangen door een
      taakstraf. Indien de rechter gebruik heeft gemaakt van de bevoegdheid van het tweede lid, kan hij de duur van de
      eerder opgelegde vervangende jeugddetentie ook wijzigen, tenzij deze reeds is aangevangen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77l
  - number: 77l.4
    text: |-
      De taakstraf, bedoeld in het derde lid, wordt opgelegd in evenredigheid met het nog verschuldigde bedrag. De
      [artikelen 77m tot en met 77q][ref1] en [77ff, vierde lid][ref2], zijn van overeenkomstige toepassing. De straf kan
      slechts worden opgelegd zolang de veroordeelde de leeftijd van achttien jaren niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77m
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77ff
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77l
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77m
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77ff
  - number: 77l.5
    text: |-
      Indien de veroordeelde de leeftijd van achttien jaren heeft bereikt, legt de rechter vervangende hechtenis op,
      tenzij naar zijn oordeel de veroordeelde in aanmerking komt voor vervangende jeugddetentie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77l
  - number: 77l.6
    text: |-
      De duur van de vervangende jeugddetentie of vervangende hechtenis is ten minste één dag en ten hoogste drie
      maanden. Voor elke volle € 15 van de nog te betalen geldboete wordt niet meer dan één dag opgelegd. Door betaling
      van het nog te betalen bedrag vervalt de vervangende jeugddetentie of de vervangende hechtenis.[ Artikel 24][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24c
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77l
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 24c
  - number: 77l.7
    text: |-
      [Artikel 27, derde en vierde lid][ref1], is bij veroordeling tot een geldboete van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel27
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77l
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '27'
  - number: 77m.1
    text: |-
      Het vonnis vermeldt of de taakstraf bestaat uit een werkstraf, een leerstraf of een combinatie van beide, alsmede
      het aantal uren dat de straf zal duren. Het vonnis kan de aard en inhoud van de te verrichten werkzaamheden of het
      te volgen leerproject vermelden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77m
  - number: 77m.2
    text: |-
      De duur van de onbetaalde arbeid of van de arbeid tot herstel van de door het strafbare feit aangerichte schade, is
      ten hoogste tweehonderd uren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77m
  - number: 77m.3
    text: |-
      De termijn waarbinnen de arbeid moet zijn verricht bedraagt ten hoogste zes maanden indien niet meer dan honderd
      uren is opgelegd en overigens ten hoogste een jaar. Het openbaar ministerie kan evenwel bij toepassing van
      [artikel 77][ref1], de duur verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77o
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77m
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77o
  - number: 77m.4
    text: De duur van een leerproject is ten hoogste tweehonderd uren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77m
  - number: 77m.5
    text: De termijn waarbinnen een leerproject plaatsvindt bedraagt ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77m
  - number: 77m.6
    text: Indien meer dan één taakstraf wordt opgelegd, bedraagt het totaal aantal uren niet meer dan tweehonderdenveertig.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77m
  - number: 77m.7
    text: |-
      [Artikel 27, eerste en vierde lid][ref1], is bij veroordeling tot een taakstraf van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel27
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77m
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '27'
  - number: 77m.8
    text: |-
      Het openbaar ministerie kan de termijn, genoemd in het derde en vijfde lid, ambtshalve of op verzoek van de
      veroordeelde, eenmaal met een zelfde periode verlengen. Het openbaar ministerie zendt hiervan zo spoedig mogelijk
      een kennisgeving aan de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77m
  - number: 77m.9
    text: |-
      De termijnen, genoemd in het derde en vijfde lid, worden verlengd met de tijd dat de veroordeelde uit anderen
      hoofde rechtens zijn vrijheid is ontnomen alsmede met de tijd dat hij ongeoorloofd afwezig is.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77m
  - number: 77n.1
    text: |-
      In het vonnis waarbij taakstraf wordt opgelegd, beveelt de rechter voor het geval dat de veroordeelde de taakstraf
      niet naar behoren verricht, dat vervangende jeugddetentie zal worden toegepast.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77n
  - number: 77n.2
    text: De duur van de vervangende jeugddetentie wordt in gehele dagen, weken of maanden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77n
  - number: 77n.3
    text: |-
      De vervangende jeugddetentie beloopt ten minste één dag en ten hoogste vier maanden. Voor elke twee uren van de
      taakstraf wordt niet meer dan één dag opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77n
  - number: 77n.4
    text: |-
      Wanneer een gedeelte van de te verrichten taakstraf is voldaan, vermindert de duur van de vervangende jeugddetentie
      naar evenredigheid. Heeft deze vermindering tot gevolg dat voor een gedeelte van een dag vervangende jeugddetentie
      zou moeten worden ondergaan, dan vindt afronding naar boven plaats tot het naaste aantal gehele dagen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77n
  - number: 77o.1
    text: |-
      De raad voor de kinderbescherming heeft tot taak de voorbereiding en de ondersteuning van de tenuitvoerlegging van
      taakstraffen. Over de wijze waarop de veroordeelde de taakstraf uitvoert, kan het openbaar ministerie inlichtingen
      inwinnen bij de raad voor de kinderbescherming. Het openbaar ministerie kan diens medewerking inroepen en hem
      de nodige opdrachten geven. De raad voor de kinderbescherming is bevoegd aanwijzingen te geven aan de stichting,
      bedoeld in [artikel 1, onder f, van de Wet op de jeugdzorg][ref1], wanneer het de tenuitvoerlegging van een
      taakstraf door de stichting, bedoeld in [artikel 1, onder f, van de Wet op de jeugdzorg][ref2] betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77o
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 77o.2
    text: |-
      Het openbaar ministerie kan na overleg met de raad voor de kinderbescherming en de veroordeelde, de opgelegde
      straf, behoudens voor wat betreft het aantal opgelegde uren, wijzigen indien het van oordeel is dat de veroordeelde
      de taakstraf niet geheel overeenkomstig het vonnis kan of heeft kunnen volbrengen. Hij benadert daarbij zo veel
      mogelijk de opgelegde taakstraf. Het openbaar ministerie geeft hiervan kennis aan de veroordeelde en de raad voor
      de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77o
  - number: 77o.3
    text: |-
      Het openbaar ministerie doet deze kennisgeving zo spoedig mogelijk aan de veroordeelde betekenen. De kennisgeving
      behelst het aantal uren dat naar het oordeel van het openbaar ministerie reeds naar behoren is volbracht, alsmede
      de straf zoals deze voor het overige nader is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77o
  - number: 77o.4
    text: |-
      Tegen de kennisgeving, bedoeld in het derde lid, kan de veroordeelde binnen veertien dagen na de betekening
      een bezwaarschrift indienen bij de rechter die de straf oplegde. De rechter kan de beslissing van het openbaar
      ministerie wijzigen. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77o
  - number: 77p.1
    text: |-
      Indien de tot een taakstraf veroordeelde niet aanvangt met de taakstraf of het openbaar ministerie van oordeel
      is dat de veroordeelde de opgelegde taakstraf niet naar behoren verricht of heeft verricht, kan het openbaar
      ministerie de tenuitvoerlegging van de vervangende jeugddetentie bevelen. Het openbaar ministerie geeft hiervan
      kennis aan de veroordeelde en de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77p
  - number: 77p.2
    text: |-
      Het openbaar ministerie doet deze kennisgeving zo spoedig mogelijk aan de veroordeelde betekenen. De kennisgeving
      behelst het aantal uren taakstraf dat naar het oordeel van het openbaar ministerie is verricht, alsmede het aantal
      dagen vervangende jeugddetentie.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77p
  - number: 77p.3
    text: |-
      Tegen de kennisgeving, bedoeld in het tweede lid, kan de veroordeelde binnen veertien dagen na de betekening
      daarvan een bezwaarschrift indienen bij de rechter die de straf oplegde. De rechter kan de beslissing van het
      openbaar ministerie wijzigen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77p
  - number: 77q.1
    text: |-
      Het openbaar ministerie kan slechts een beslissing nemen of een bevel geven krachtens
      [artikel 77o, tweede lid][ref1], onderscheidenlijk [artikel 77p, eerste lid][ref2], binnen drie maanden na afloop
      van de termijn waarbinnen de arbeid moet zijn verricht of waarbinnen het leerproject moet zijn gevolgd krachtens
      [artikel 77m][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77o
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77p
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77m
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77q
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77o
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77p
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 77m
  - number: 77q.2
    text: |-
      Indien naar het oordeel van het openbaar ministerie de opgelegde taakstraf naar behoren is uitgevoerd, stelt het zo
      spoedig mogelijk de veroordeelde hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77q
  - number: 77r
    text: |-
      Ontzegging van de bevoegdheid motorrijtuigen te besturen is slechts mogelijk in de gevallen
      genoemd in de [artikelen 179][ref1], [179a][ref2] en [180 van de Wegenverkeerswet 1994][ref3] en in
      [artikel 30, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref4] (*Stb.* 1963, 228). Die
      artikelen zijn dan van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel179a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel180
      [ref4]: https://wetten.overheid.nl/BWBR0002415#Artikel30
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77r
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 179a
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '180'
      - id: ref4
        bwb_id: BWBR0002415
        artikel: '30'
  - number: 77s.1
    text: De maatregel van plaatsing in een inrichting voor jeugdigen kan slechts worden opgelegd, indien
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77s
  - number: 77s.1.a
    text: het een misdrijf betreft waarvoor voorlopige hechtenis is toegelaten;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77s
  - number: 77s.1.b
    text: |-
      de veiligheid van anderen dan wel de algemene veiligheid van personen of goederen het opleggen van die maatregel
      eist, en
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77s
  - number: 77s.1.c
    text: de maatregel in het belang is van een zo gunstig mogelijke verdere ontwikkeling van de verdachte.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77s
  - number: 77s.2
    text: |-
      De rechter legt de maatregel slechts op, nadat hij zich een met redenen omkleed, gedagtekend en ondertekend advies
      heeft doen overleggen van ten minste twee gedragsdeskundigen van verschillende disciplines. Het advies wordt
      door de deskundigen gezamenlijk dan wel door ieder van hen afzonderlijk uitgebracht. Indien dit advies eerder dan
      een jaar voor de aanvang van de terechtzitting is gedagtekend kan de rechter hier slechts gebruik van maken met
      instemming van het openbaar ministerie en de verdachte.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77s
  - number: 77s.3
    text: |-
      De maatregel kan ook worden opgelegd indien de verdachte niet strafbaar is op de grond dat het feit hem wegens de
      gebrekkige ontwikkeling of ziekelijke stoornis van de geestvermogens niet kan worden toegerekend. Indien bij de
      verdachte tijdens het begaan van het feit een gebrekkige ontwikkeling of ziekelijke stoornis van de geestvermogens
      bestond, dient bij toepassing van het eerste lid één van de gedragsdeskundigen een psychiater te zijn.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77s
  - number: 77s.4
    text: |-
      Het tweede lid blijft buiten toepassing indien de betrokkene weigert medewerking te verlenen aan het onderzoek dat
      ten behoeve van het advies moet worden verricht. Voor zover mogelijk maken de gedragsdeskundigen gezamenlijk dan
      wel ieder van hen afzonderlijk over de reden van weigering rapport op. De rechter doet zich zoveel mogelijk een
      ander advies of rapport, dat hem over de wenselijkheid of noodzakelijkheid van de oplegging van de maatregel kan
      voorlichten en aan de totstandkoming waarvan de betrokkene wel bereid is om medewerking te verlenen, overleggen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77s
  - number: 77s.5
    text: |-
      Indien de maatregel is opgelegd draagt Onze Minister van Justitie de tenuitvoerlegging op aan een inrichting
      als bedoeld in [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1], of doet hij de
      veroordeelde elders opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77s
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: 77s.6
    text: |-
      De maatregel geldt voor de tijd van twee jaar. De termijn gaat in nadat de rechterlijke uitspraak onherroepelijk is
      geworden. De maatregel vervalt bij het onherroepelijk worden van een rechterlijke uitspraak waarbij de betrokkene
      wederom de maatregel wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77s
  - number: 77s.7
    text: 'De termijn van de maatregel loopt niet:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77s
  - number: 77s.7.a
    text: |-
      gedurende de tijd dat aan de veroordeelde uit anderen hoofde rechtens zijn vrijheid is ontnomen en gedurende de
      tijd dat hij uit zodanige vrijheidsontneming ongeoorloofd afwezig is;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77s
  - number: 77s.7.b
    text: |-
      wanneer de veroordeelde langer dan een week ongeoorloofd afwezig is uit de plaats die voor de tenuitvoerlegging van
      de maatregel is aangewezen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77s
  - number: 77s.8
    text: |-
      Onze Minister van Justitie kan de maatregel te allen tijde, na advies te hebben ingewonnen van de raad voor de
      kinderbescherming, voorwaardelijk of onvoorwaardelijk beëindigen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77s
  - number: 77t.1
    text: |-
      De rechter die in eerste aanleg heeft kennis genomen van het misdrijf ter zake waarvan de maatregel is opgelegd,
      kan op vordering van het openbaar ministerie de termijn, bedoeld in [artikel 77s, zesde lid][ref1], telkens met ten
      hoogste twee jaren verlengen. Niet eerder dan twee maanden en niet later dan een maand voor het tijdstip waarop de
      maatregel door tijdsverloop zal eindigen, kan het openbaar ministerie een vordering indienen tot verlenging van de
      maatregel. De [artikelen 509oa][ref2] en [509q van het Wetboek van Strafvordering][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77s
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel509oa
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel509q
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77t
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77s
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 509oa
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 509q
  - number: 77t.2
    text: |-
      Verlenging van de termijn van de maatregel is slechts mogelijk voor zover de maatregel daardoor de
      duur van vier jaar niet te boven gaat, tenzij de maatregel is opgelegd aan een verdachte als bedoeld in
      [artikel 77s, derde lid, tweede volzin][ref1]. In zodanig geval is verlenging mogelijk voor zover de maatregel de
      duur van zes jaar niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77s
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77t
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77s
  - number: 77t.3
    text: |-
      De verlenging is slechts mogelijk, indien de maatregel is opgelegd ter zake van een misdrijf dat gericht
      is tegen of gevaar veroorzaakt voor de onaantastbaarheid van het lichaam van één of meer personen.
      [Artikel 77s, eerste lid, onder b en c][ref1], is van overeenkomstige toepassing. De verlenging is niet mogelijk
      indien gebruik is gemaakt van de bevoegdheid, bedoeld in [artikel 77x][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77s
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77x
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77t
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77s
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77x
  - number: 77t.4
    text: |-
      Een vordering tot verlenging van de maatregel van plaatsing in een inrichting voor jeugdigen wordt bij de rechtbank
      behandeld door de meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77t
  - number: 77t.5
    text: 'Bij de vordering worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77t
  - number: 77t.5.a
    text: een recent opgemaakt, met redenen omkleed en ondertekend advies afkomstig van het hoofd van de inrichting, en
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77t
  - number: 77t.5.b
    text: een afschrift van de aantekeningen omtrent de lichamelijke en geestelijke gesteldheid van de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77t
  - number: 77t.6
    text: |-
      De maatregel kan zonder advies, bedoeld in het vierde lid, onder *a*, worden verlengd indien dit door gebrek aan
      medewerking van de veroordeelde niet kan worden uitgebracht.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77t
  - number: 77u
    text: |-
      Een beslissing op grond van [artikel 77t][ref1] wordt bij beschikking genomen, nadat de veroordeelde en indien
      deze minderjarig is, ook degenen die het gezag over hem uitoefenen, zijn gehoord of behoorlijk opgeroepen.
      De [artikelen 14h][ref2], [14i, tweede tot en met zesde lid][ref3], en [14j van dit wetboek][ref4] alsmede
      [artikel 495b van het Wetboek van Strafvordering][ref5] zijn van overeenkomstige toepassing, onverminderd de
      [artikelen 502][ref6] en [503 van het Wetboek van Strafvordering][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77t
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel14h
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel14i
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel14j
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel495b
      [ref6]: https://wetten.overheid.nl/BWBR0001903#Artikel502
      [ref7]: https://wetten.overheid.nl/BWBR0001903#Artikel503
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77u
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77t
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 14h
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 14i
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 14j
      - id: ref5
        bwb_id: BWBR0001903
        artikel: 495b
      - id: ref6
        bwb_id: BWBR0001903
        artikel: '502'
      - id: ref7
        bwb_id: BWBR0001903
        artikel: '503'
  - number: 77v.1
    text: |-
      Indien jeugddetentie of plaatsing in een inrichting voor jeugdigen wordt opgelegd, kan de rechter in zijn uitspraak
      een advies opnemen over de plaats waar en de wijze waarop deze straf of maatregel zal moeten worden ten uitvoer
      gelegd. De rechter kan bij een beslissing als bedoeld in [artikel 77t][ref1] zodanig advies opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77t
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77v
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77t
  - number: 77v.2
    text: |-
      Het eerste lid is niet van toepassing indien met gebruikmaking van [artikel 77x][ref1], de straf of maatregel
      geheel niet wordt ten uitvoer gelegd. Indien ingevolge [artikel 77dd][ref2] de straf of maatregel alsnog geheel of
      gedeeltelijk ten uitvoer wordt gelegd, kan de rechter een advies opnemen in de last tot tenuitvoerlegging.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77x
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77v
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77x
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '77'
  - number: 77v.3
    text: |-
      Het openbaar ministerie stelt Onze Minister van Justitie in kennis van rechterlijke uitspraken, zodra deze voor
      tenuitvoerlegging vatbaar zijn geworden. Het voegt daarbij, in voorkomende gevallen, het advies van de rechter
      omtrent de plaatsing.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77v
  - number: 77v.4
    text: |-
      Onze Minister kan het advies van de raad voor de kinderbescherming inwinnen omtrent de plaats van de
      tenuitvoerlegging.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77v
  - number: 77x.1
    text: |-
      In geval van veroordeling tot jeugddetentie, vervangende jeugddetentie daaronder niet begrepen, tot taakstraf, tot
      geldboete, tot plaatsing in een inrichting voor jeugdigen of tot ontzegging van de bevoegdheid motorrijtuigen te
      besturen, kan de rechter bepalen dat deze of een gedeelte daarvan, niet zal worden ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77x
  - number: 77x.2
    text: |-
      In geval van veroordeling tot jeugddetentie of in geval van plaatsing in een inrichting voor jeugdigen, met
      toepassing van het eerste lid, kan de rechter tevens geldboete opleggen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77x
  - number: 77x.3
    text: |-
      In geval van veroordeling tot jeugddetentie, met toepassing van het eerste lid, kan de rechter tevens een taakstraf
      opleggen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77x
  - number: 77y.1
    text: |-
      De rechter die bepaalt dat een door hem opgelegde straf of maatregel niet zal worden ten uitvoer gelegd, stelt
      daarbij een proeftijd vast van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77y
  - number: 77y.2
    text: 'De proeftijd gaat in:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77y
  - number: 77y.2.a
    text: |-
      indien een kennisgeving als bedoeld in [artikel 366a, eerste en tweede lid, van het Wetboek van Strafvordering][ref1]
      is uitgereikt of toegezonden, op de vijftiende dag nadat de einduitspraak is gedaan, tenzij door de tijdige
      aanwending van een rechtsmiddel het vonnis of arrest niet onherroepelijk is geworden;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel366a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77y
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 366a
  - number: 77y.2.b
    text: |-
      indien een kennisgeving als bedoeld in [artikel 366a, derde lid, van het Wetboek van Strafvordering][ref1] moet
      worden betekend, op de vijftiende dag na die betekening, tenzij door de tijdige aanwending van een rechtsmiddel het
      vonnis of arrest niet onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel366a
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77y
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 366a
  - number: 77y.3
    text: De proeftijd loopt niet gedurende de tijd dat de veroordeelde rechtens zijn vrijheid is ontnomen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77y
  - number: 77z.1
    text: |-
      Toepassing van [artikel 77][ref1] geschiedt onder de algemene voorwaarde dat de veroordeelde zich voor het einde
      van de proeftijd niet schuldig maakt aan een strafbaar feit. Bovendien kunnen bijzondere voorwaarden, het gedrag
      van de veroordeelde betreffende, worden gesteld. Deze mogen de vrijheid van de veroordeelde zijn godsdienst
      of levensovertuiging te belijden en de staatkundige vrijheid niet beperken. De rechter kan de werking van de
      bijzondere voorwaarden beperken tot een bij de uitspraak te bepalen tijdsduur binnen de proeftijd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77x
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77z
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77x
  - number: 77z.2
    text: |-
      Als bijzondere voorwaarde kan worden gesteld dat de veroordeelde zich zal
      laten opnemen in een inrichting, niet zijnde een inrichting als bedoeld in
      [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1], gedurende een door de rechter
      te bepalen termijn, korter dan de proeftijd.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77z
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: 77aa.1
    text: Met het toezicht op de naleving van de voorwaarden is het openbaar ministerie belast.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77aa
  - number: 77aa.2
    text: |-
      De rechter kan aan een stichting als bedoeld in [artikel 1, onder f, van de Wet op de jeugdzorg][ref1], of, in
      bijzondere gevallen en na overleg met een dergelijke rechtspersoon, aan een particulier persoon, opdragen aan de
      veroordeelde ter zake van de naleving der bijzondere voorwaarden hulp en steun te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77aa
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 77aa.3
    text: |-
      De rechter kan, indien de veroordeelde ingevolge [artikel 254 van Boek 1 van het Burgerlijk Wetboek][ref1] onder
      toezicht is gesteld, aan een stichting als bedoeld in [artikel 1, onder f, van de Wet op de jeugdzorg][ref2]
      opdragen aan de veroordeelde ter zake van de naleving der bijzondere voorwaarden hulp en steun te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77aa
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 77aa.4
    text: |-
      Is de veroordeelde meerderjarig dan is [artikel 14][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14d
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77aa
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14d
  - number: 77aa.5
    text: |-
      Bij algemene maatregel van bestuur, op de voordracht van Onze Ministers van Justitie en van Volksgezondheid,
      Welzijn en Sport, kunnen regels worden gesteld omtrent de aard en de omvang van de hulp en steun, bedoeld in het
      tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77aa
  - number: 77bb
    text: |-
      [Artikel 366a van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing op de mededeling van de
      veroordeling, waarbij [artikel 77x][ref2] en [77z][ref3] zijn toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel366a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77x
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77z
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77bb
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 366a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77x
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 77z
  - number: 77cc.1
    text: |-
      De rechter die de voorwaarde heeft gesteld, kan na ontvangst van een vordering van het openbaar ministerie of op
      verzoek van veroordeelde, de proeftijd verkorten of deze eenmaal verlengen. De verlenging geschiedt met ten hoogste
      één jaar.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77cc
  - number: 77cc.2
    text: |-
      Evenzo kan de in het eerste lid bedoelde rechter gedurende de proeftijd of gedurende de tijd dat deze is geschorst,
      in de gestelde bijzondere voorwaarden of in de termijn waartoe deze voorwaarden in haar werking binnen de proeftijd
      zijn beperkt, wijziging brengen, deze voorwaarden opheffen, alsnog bijzondere voorwaarden stellen en een opdracht
      als bedoeld in [artikel 77aa][ref1], tweede lid, geven, wijzigen of opheffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77cc
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '77'
  - number: 77dd.1
    text: |-
      Onverminderd het bepaalde in [artikel 77cc][ref1] kan de rechter, indien enige gestelde voorwaarde niet wordt
      nageleefd en hij daartoe termen vindt, na ontvangst van de vordering van het openbaar ministerie:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77dd
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '77'
  - number: 77dd.1.a
    text: gelasten dat de niet ten uitvoer gelegde straf of maatregel, alsnog zal worden ten uitvoer gelegd;
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77dd
  - number: 77dd.1.b
    text: |-
      al of niet onder instandhouding of wijziging van de voorwaarden gelasten dat een gedeelte van de niet ten uitvoer
      gelegde straf of maatregel, alsnog zal worden ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77dd
  - number: 77dd.2
    text: |-
      [Artikel 14g, tweede, derde en vijfde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat indien
      bij overeenkomstige toepassing van [artikel 14 g, derde lid, onder a][ref2], het daar bedoelde strafbaar feit wordt
      vervolgd voor de politierechter, deze tevens bevoegd is tot toepassing van het eerste lid voor zover de ten uitvoer
      te leggen straf een geldboete of een jeugddetentie van niet meer dan zes maanden betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14g
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel14g
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77dd
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14g
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 14g
  - number: 77ee.1
    text: |-
      Indien in het kader van de tenuitvoerlegging van een sanctie enige beslissing wordt genomen met gebruikmaking
      van de [artikelen 77k][ref1], [77l, derde lid][ref2], [77o, vierde lid][ref3], [77p, derde lid][ref4],
      [77][ref5]cc of 77dd, eerste lid, zijn de [artikelen 14h][ref6], [14i, tweede tot en met zesde lid][ref7], en
      [14j van dit wetboek][ref8] alsmede [artikel 495b van het Wetboek van Strafvordering][ref9] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77k
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77l
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77o
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel77p
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel77
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel14h
      [ref7]: https://wetten.overheid.nl/BWBR0001854#Artikel14i
      [ref8]: https://wetten.overheid.nl/BWBR0001854#Artikel14j
      [ref9]: https://wetten.overheid.nl/BWBR0001903#Artikel495b
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77ee
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77k
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77l
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 77o
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 77p
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '77'
      - id: ref6
        bwb_id: BWBR0001854
        artikel: 14h
      - id: ref7
        bwb_id: BWBR0001854
        artikel: 14i
      - id: ref8
        bwb_id: BWBR0001854
        artikel: 14j
      - id: ref9
        bwb_id: BWBR0001903
        artikel: 495b
  - number: 77ee.2
    text: |-
      Indien de veroordeelde op het tijdstip dat de procedure op zijn verzoek of op vordering van het openbaar
      ministerie is ingesteld, de leeftijd van achttien jaren nog niet heeft bereikt, zijn daarenboven de
      [artikelen 496 tot en met 498][ref1], [504][ref2] en [505 van het Wetboek van Strafvordering][ref3]
      van overeenkomstige toepassing. Heeft hij de leeftijd van zestien jaren nog niet bereikt, dan is tevens
      [artikel 503][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel496
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel504
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel505
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel503
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77ee
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '496'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '504'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '505'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '503'
  - number: 77ff.1
    text: De kosten van jeugddetentie en van plaatsing in een inrichting voor jeugdigen komen ten laste van de staat.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77ff
  - number: 77ff.2
    text: |-
      Bij of krachtens de wet worden regels gesteld ten aanzien van de tenuitvoerlegging van vrijheidsstraffen en
      vrijheidsbenemende maatregelen als bedoeld in [artikel 77h][ref1] en de rechtspositie van jeugdigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77ff
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77h
  - number: 77ff.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld voor de verstrekking van rijkswege van een bijdrage
      in de bekostiging van de voorbereiding en uitvoering van
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77ff
  - number: 77ff.3.a
    text: |-
      projecten als bedoeld in de [artikelen 77e][ref1] en [77f, eerste lid, onder b][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77e
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77f
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77ff
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77e
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77f
  - number: 77ff.3.b
    text: |-
      taakstraffen als bedoeld in [artikel 77h, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77ff
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77h
  - number: 77ff.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de inhoud van de taakstraf, de
      tenuitvoerlegging van de taakstraf en de rechten en plichten van de tot een taakstraf veroordeelde. Daarbij kan van
      het aantal uren dat een leerproject kan duren, genoemd in [artikel 77m, vierde lid][ref1], worden afgeweken indien
      de aard van het leerproject daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77m
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77ff
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77m
  - number: 77gg.1
    text: |-
      De straffen en maatregelen als bedoeld in deze Titel, zijn voor poging, voorbereiding, deelneming en
      medeplichtigheid dezelfde als die voor het voltooide misdrijf.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77gg
  - number: 77gg.2
    text: |-
      Bij samenloop worden meer feiten die als op zichzelf staande handelingen moeten worden beschouwd, voor de
      toepassing van straffen en maatregelen als één feit aangemerkt. [Artikel 63][ref1] is met betrekking tot straffen
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel63
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77gg
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '63'
  - number: 77hh.1
    text: |-
      De raad voor de kinderbescherming heeft tot taak toezicht te houden op de uitvoering van reclasseringswerkzaamheden
      als bedoeld in [artikel 77f, eerste lid, onder a][ref1], [artikel 77j, vierde en vijfde lid][ref2],
      [artikel 77s, achtste lid][ref3], [artikel 77aa, tweede en derde lid][ref4], van het Wetboek van Strafrecht,
      en [artikel 493 van het Wetboek van Strafvordering][ref5], en is in dat kader bevoegd de stichting, bedoeld in
      [artikel 1, onder f, van de Wet op de jeugdzorg][ref6] aanwijzingen te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77f
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77j
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77s
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel77aa
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel493
      [ref6]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77hh
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77f
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77j
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 77s
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 77aa
      - id: ref5
        bwb_id: BWBR0001903
        artikel: '493'
      - id: ref6
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 77hh.2
    text: |-
      In door Onze Minister van Justitie aan te wijzen gevallen kan de raad voor de kinderbescherming de stichting
      inschakelen voor vrijwillige begeleiding van een jeugdige.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel77hh
  - number: '78'
    text: |-
      Waar van misdrijf in het algemeen of van enig misdrijf in het bijzonder gesproken wordt, wordt daaronder
      medeplichtigheid aan, poging tot en voorbereiding van dat misdrijf begrepen, voorzover niet uit enige bepaling het
      tegendeel volgt.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel78
  - number: '79'
    text: |-
      Aanslag tot een feit bestaat, zodra het voornemen van de dader zich door een begin van uitvoering, in de zin van
      [artikel 45][ref1], heeft geopenbaard.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel45
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '45'
  - number: '80'
    text: Samenspanning bestaat zodra twee of meer personen overeengekomen zijn om het misdrijf te plegen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel80
  - number: 80bis
    text: |-
      Onder omwenteling wordt verstaan het vernietigen of op onwettige wijze veranderen van de grondwettige regeringsvorm
      of de orde van troonopvolging.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel80bis
  - number: 80ter
    text: |-
      Onder verboden plaats wordt verstaan iedere plaats die als verboden plaats is aangewezen ingevolge de
      [Wet bescherming staatsgeheimen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002074
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel80ter
    references:
      - id: ref1
        bwb_id: BWBR0002074
  - number: 80quater
    text: |-
      Onder gegeven waarvan de geheimhouding door het belang van de staat wordt geboden, wordt mede verstaan
      een gegeven, behorende tot of ontleend aan gegevens, hulpmiddelen of materialen of met behulp daarvan
      verrichte onderzoekingen of toegepaste werkmethoden, ter zake van de geheimhouding waarvan krachtens
      [artikel 68 van de Kernenergiewet][ref1] gestelde regelen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel68
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel80quater
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '68'
  - number: 80quinquies
    text: |-
      Onder gegevens wordt verstaan iedere weergave van feiten, begrippen of instructies, op een overeengekomen wijze,
      geschikt voor overdracht, interpretatie of verwerking door personen of geautomatiseerde werken.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel80quinquies
  - number: 80sexies
    text: |-
      Onder geautomatiseerd werk wordt verstaan een inrichting die bestemd is om langs elektronische weg gegevens op te
      slaan, te verwerken en over te dragen.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel80sexies
  - number: '81'
    text: Met het plegen van geweld wordt gelijkgesteld het brengen in een staat van bewusteloosheid of onmacht.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel81
  - number: '82.1'
    text: |-
      Onder zwaar lichamelijk letsel worden begrepen: ziekte die geen uitzicht op volkomen genezing overlaat,
      voortdurende ongeschiktheid tot uitoefening van zijn ambts- of beroepsbezigheden, en afdrijving of dood van de
      vrucht van een vrouw.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel82
  - number: '82.2'
    text: |-
      Onder zwaar lichamelijk letsel wordt mede begrepen storing van de verstandelijke vermogens die langer dan vier
      weken geduurd heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel82
  - number: 82a
    text: |-
      Onder een ander, of een kind bij of kort na de geboorte, van het leven beroven wordt begrepen: het doden van een
      vrucht die naar redelijkerwijs verwacht mag worden in staat is buiten het moederlichaam in leven te blijven.
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel82a
  - number: '83'
    text: 'Onder terroristisch misdrijf wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0001854/2006-11-29#Artikel83
  - number: 83.1º
    text: |-
