        bwb_id: BWBR0001854
        artikel: '28'
  - number: 178a
    text: |-
      1 Met ambtenaren worden ten aanzien van [artikel 177][ref1] gelijkgesteld personen in de openbare dienst van een
      vreemde staat of van een volkenrechtelijke organisatie.

      2 Met ambtenaren worden ten aanzien van [artikel 177, eerste lid, onder 2°][ref2], voormalige ambtenaren
      gelijkgesteld.

      3 Met rechter wordt ten aanzien van [artikel 178][ref3] gelijkgesteld de rechter van een vreemde staat of van een
      volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel177
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel177
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel178
