        artikel: '64'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '64'
  - number: '66'
    text: |-
      1 De klacht kan worden ingediend gedurende drie maanden na de dag waarop de tot klacht gerechtigde kennis heeft
      genomen van het gepleegde feit.

      2 Indien degene tegen wie het feit is begaan, nadat de termijn een aanvang heeft genomen, is overleden, dan wel het
      recht tot het indienen van de klacht heeft verloren, verkregen of herkregen, loopt deze termijn zonder verlenging
      door.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel66
  - number: '67'
    text: Hij die de klacht indient, blijft gedurende acht dagen na de dag der indiening bevoegd deze in te trekken.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel67
  - number: '68'
    text: |-
      1 Behoudens de gevallen waarin rechterlijke uitspraken voor herziening vatbaar zijn, kan niemand andermaal worden
      vervolgd wegens een feit waarover te zijnen aanzien bij gewijsde van de rechter in Nederland, Aruba, Curaçao, Sint
      Maarten of de openbare lichamen Bonaire, Sint Eustatius en Saba onherroepelijk is beslist.

      2 Is het gewijsde afkomstig van een andere rechter, dan heeft tegen dezelfde persoon wegens hetzelfde feit geen
      vervolging plaats in geval van:

      1°. vrijspraak of ontslag van rechtsvervolging;

      2°. veroordeling, indien een straf is opgelegd, gevolgd door gehele uitvoering, gratie of verjaring der straf.

      3 Niemand kan worden vervolgd wegens een feit dat te zijnen aanzien in een vreemde staat onherroepelijk is afgedaan
      door de voldoening aan een voorwaarde, door de bevoegde autoriteit gesteld ter voorkoming van strafvervolging.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel68
  - number: '69'
    text: Het recht tot strafvordering vervalt door de dood van de verdachte.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel69
  - number: '70'
    text: |-
      1 Het recht tot strafvordering vervalt door verjaring:

      1°. in drie jaren voor alle overtredingen;

      2°. in zes jaren voor de misdrijven waarop geldboete, hechtenis of gevangenisstraf van niet meer dan drie jaren
      is gesteld;

      3°. in twaalf jaren voor de misdrijven waarop tijdelijke gevangenisstraf van meer dan drie jaren is gesteld;

      4°. in twintig jaren voor de misdrijven waarop gevangenisstraf van acht jaren of meer is gesteld.

      2 In afwijking van het eerste lid verjaart het recht tot strafvordering niet:

      1°. voor de misdrijven waarop gevangenisstraf van twaalf jaren of meer is gesteld;

      2°. voor de misdrijven omschreven in de [artikelen 242][ref1], [243, eerste lid][ref2], [245][ref3],
      [246, eerste lid][ref4], [247, eerste en tweede lid][ref5], [249, eerste lid][ref6], [252][ref7], [253][ref8] en
      het misdrijf omschreven in [artikel 241, eerste en tweede lid][ref9], indien het feit is gepleegd ten aanzien van
      een persoon die de leeftijd van achttien jaren nog niet heeft bereikt.


