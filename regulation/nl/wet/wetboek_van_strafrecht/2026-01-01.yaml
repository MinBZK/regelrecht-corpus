  - number: 38z
    text: |-
      1 Ter bescherming van de veiligheid van anderen, dan wel de algemene veiligheid van personen of goederen kan
      de rechter, ambtshalve of op vordering van het openbaar ministerie, een verdachte een maatregel strekkende tot
      gedragsbeïnvloeding of vrijheidsbeperking opleggen indien die verdachte bij die rechterlijke uitspraak:

      a. ter beschikking wordt gesteld als bedoeld in de [artikelen 37a][ref1], [37b][ref2] of [38][ref3];

      b. wordt veroordeeld tot een gevangenisstraf, of een gevangenisstraf waarvan een gedeelte niet zal worden ten
      uitvoer gelegd, wegens een misdrijf dat gericht is tegen of gevaar veroorzaakt voor de onaantastbaarheid van het
      lichaam van een of meer personen en waarop naar de wettelijke omschrijving een gevangenisstraf van vier jaren of
      meer is gesteld;

      c. wordt veroordeeld tot een gevangenisstraf, of een gevangenisstraf waarvan een gedeelte niet zal worden ten
      uitvoer gelegd, wegens een terroristisch misdrijf of een misdrijf ter voorbereiding of vergemakkelijking van
      een terroristisch misdrijf dan wel een misdrijf als omschreven in de [artikelen 251 tot en met 253][ref4],
      [273f][ref5], [317, eerste lid][ref6].

      2 Bij de vordering tot oplegging van de maatregel legt de officier van justitie een recent opgemaakt, met redenen
      omkleed en ondertekend advies over van een reclasseringsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
