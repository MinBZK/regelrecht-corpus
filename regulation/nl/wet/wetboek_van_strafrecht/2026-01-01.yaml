        artikel: '28'
  - number: '131'
    text: |-
      1 Hij die in het openbaar, mondeling of bij geschrift of afbeelding, tot enig strafbaar feit of tot gewelddadig
      optreden tegen het openbaar gezag opruit, wordt gestraft met gevangenisstraf van ten hoogste vijf jaren of
      geldboete van de vierde categorie.

      2 Indien het strafbare feit waartoe wordt opgeruid een terroristisch misdrijf dan wel een misdrijf ter
      voorbereiding of vergemakkelijking van een terroristisch misdrijf inhoudt, wordt de gevangenisstraf, gesteld op het
      in het eerste lid omschreven feit, met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel131
  - number: '132'
    text: |-
      1 Hij die een geschrift of afbeelding waarin tot enig strafbaar feit of tot gewelddadig optreden tegen het openbaar
      gezag wordt opgeruid, verspreidt, openlijk tentoonstelt of aanslaat of, om verspreid, openlijk tentoongesteld of
      aangeslagen te worden, in voorraad heeft, wordt, indien hij weet of ernstige reden heeft te vermoeden dat in het
      geschrift of de afbeelding zodanige opruiing voorkomt, gestraft met gevangenisstraf van ten hoogste drie jaren of
      geldboete van de vijfde categorie.

      2 Met dezelfde straf wordt gestraft hij die, met gelijke wetenschap of een gelijke reden tot vermoeden, de inhoud
      van een zodanig geschrift openlijk ten gehore brengt.

      3 Indien het strafbare feit waartoe bij geschrift of afbeelding wordt opgeruid een terroristisch misdrijf
      dan wel een misdrijf ter voorbereiding of vergemakkelijking van een terroristisch misdrijf inhoudt, wordt de
      gevangenisstraf, gesteld op het in het eerste lid omschreven feit, met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel132
  - number: '133'
    text: |-
      Hij die in het openbaar, mondeling of bij geschrift of afbeelding, aanbiedt inlichtingen, gelegenheid of middelen
      te verschaffen om enig strafbaar feit te plegen, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel133
  - number: '134'
    text: |-
      1 Hij die een geschrift of afbeelding waarin wordt aangeboden inlichtingen, gelegenheid of middelen te verschaffen
      om enig strafbaar feit te plegen, verspreidt, openlijk tentoonstelt of aanslaat of, om verspreid, openlijk
      tentoongesteld of aangeslagen te worden, in voorraad heeft, wordt, indien hij weet of ernstige reden heeft om
      te vermoeden dat in het geschrift of de afbeelding zodanig aanbod voorkomt, gestraft met gevangenisstraf van ten
      hoogste drie maanden of geldboete van de tweede categorie.

      2 Met dezelfde straf wordt gestraft hij die, met gelijke wetenschap of een gelijke reden tot vermoeden, de inhoud
      van een zodanig geschrift openlijk ten gehore brengt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel134
  - number: 134a
    text: |-
      Hij die zich of een ander opzettelijk gelegenheid, middelen of inlichtingen verschaft of tracht te verschaffen
      tot het plegen van een terroristisch misdrijf dan wel een misdrijf ter voorbereiding of vergemakkelijking van een
      terroristisch misdrijf, dan wel zich kennis of vaardigheden daartoe verwerft of een ander bijbrengt, wordt gestraft
      met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel134a
  - number: '135'
    text: |-
      Hij die, kennis dragende van een strafbare samenspanning, op een tijdstip waarop het plegen van deze misdrijven nog
      kan worden voorkomen, opzettelijk nalaat daarvan tijdig voldoende kennis te geven, hetzij aan de ambtenaren van de
      justitie of politie, hetzij aan de bedreigde, wordt, indien het misdrijf is gevolgd, gestraft met gevangenisstraf
      van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel135
  - number: '136'
    text: |-
      1 Hij die, kennis dragende van een voornemen tot het plegen van een der in de [artikelen 92-110][ref1]
      omschreven misdrijven, tot desertie in tijd van oorlog, tot militair verraad, tot moord, mensenroof of de in
      [artikel 243, eerste en tweede lid][ref2], omschreven misdrijven of tot een der in [Titel VII van dit Boek][ref3]
      omschreven misdrijven dan wel een terroristisch misdrijf, op een tijdstip waarop het plegen van deze misdrijven nog
      kan worden voorkomen, opzettelijk nalaat daarvan tijdig voldoende kennis te geven, hetzij aan de ambtenaren van de
      justitie of politie, hetzij aan de bedreigde, wordt, indien het misdrijf is gevolgd, gestraft met gevangenisstraf
      van ten hoogste een jaar of geldboete van de vierde categorie.

      2 Dezelfde straf is toepasselijk op hem die, kennis dragende van enig in het eerste lid vermeld reeds gepleegd
      misdrijf waardoor levensgevaar is ontstaan, op een tijdstip waarop de gevolgen nog kunnen worden afgewend,
      opzettelijk nalaat daarvan gelijke kennisgeving te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel243
      [ref3]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '92'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '243'
      - id: ref3
        bwb_id: BWBR0001854
  - number: '137'
    text: |-
      De bepalingen van de [artikelen 135][ref1] en [136][ref2] zijn niet van toepassing op hem die door de kennisgeving
      gevaar voor een strafvervolging zou doen ontstaan voor zichzelf, voor een van zijn bloedverwanten of aangehuwden in
      de rechte linie of in de tweede of derde graad van de zijlinie, voor zijn echtgenoot of gewezen echtgenoot, of voor
      een ander bij wiens vervolging hij zich, uit hoofde van zijn ambt of beroep, van het afleggen van getuigenis zou
      kunnen verschonen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel135
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel136
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '135'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '136'
  - number: 137c
    text: |-
      1 Hij die zich in het openbaar, mondeling of bij geschrift of afbeelding, opzettelijk beledigend uitlaat over een
      groep mensen wegens hun ras, hun godsdienst of levensovertuiging, hun seksuele gerichtheid of hun handicap, wordt
      gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.

      2 Met dezelfde straf wordt gestraft degene die zich in het openbaar, mondeling of bij geschrift of afbeelding,
      opzettelijk beledigend uitlaat over een groep mensen als omschreven in het eerste lid:

      a. door het vergoelijken van een van de feiten als omschreven in de [artikelen 3 tot en met 6][ref1],
      [7, tweede lid][ref2], en [8 tot en met 8b van de Wet internationale misdrijven][ref3] of een van de feiten als
      omschreven in artikel 6 van het Handvest van de Internationale Militaire Rechtbank, gehecht aan het Verdrag van
      Londen van 8 augustus 1945;

      b. door het ontkennen of verregaand bagatelliseren van een van de feiten als omschreven in de onder a genoemde
      artikelen, voor zover dat feit bij onherroepelijke beslissing is vastgesteld door een internationaal gerecht dat
      zijn rechtsmacht ontleent aan een verdrag waarbij het Koninkrijk partij is of door de Nederlandse rechter.

      3 Indien het feit wordt gepleegd door een persoon die daarvan een beroep of gewoonte maakt of door twee of meer
      verenigde personen wordt gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0015252#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015252#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0015252#Artikel8
