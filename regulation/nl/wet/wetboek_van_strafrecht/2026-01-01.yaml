  - number: '381'
    text: |-
      1 Als schuldig aan zeeroof wordt gestraft:

      1°. met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, hij die als schipper
      dienst neemt of dienst doet op een vaartuig, wetende dat het bestemd is of het gebruikende om in open zee daden
      van geweld te plegen tegen andere vaartuigen of tegen zich daarop bevindende personen of goederen, zonder door een
      oorlogvoerende mogendheid daartoe te zijn gemachtigd of tot de oorlogsmarine van een erkende mogendheid te behoren;

      2°. met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, hij die, bekend met
      deze bestemming of dit gebruik, als schepeling dienst neemt op zodanig vaartuig of vrijwillig in dienst blijft na
      daarmede bekend te zijn geworden.

      2 Met het gemis van machtiging wordt gelijkgesteld het overschrijden van de machtiging alsmede het voorzien zijn
      van machtigingen afkomstig van tegen elkander oorlog voerende mogendheden.

      3 [Artikel 81][ref1] blijft buiten toepassing.

      4 Het in de vorige leden ten aanzien van de schipper en de schepeling bepaalde is van overeenkomstige toepassing
      ten aanzien van de gezagvoerder onderscheidenlijk het lid van de bemanning van een luchtvaartuig. Onder vaartuig
      wordt in de vorige leden luchtvaartuig begrepen en onder open zee het luchtruim daarboven.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel81
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel381
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '81'
  - number: '382'
    text: |-
      Indien de in [artikel 381][ref1] omschreven daden van geweld de dood van een der zich op het aangevallen vaartuig
      of luchtvaartuig bevindende personen ten gevolge hebben, wordt de schipper of de gezagvoerder van het luchtvaartuig
      en worden zij die aan de daden van geweld hebben deelgenomen, met gevangenisstraf van ten hoogste vijftien jaren of
      geldboete van de vijfde categorie gestraft.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel381
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel382
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '381'
  - number: '383'
    text: |-
      Hij die voor eigen of vreemde rekening een vaartuig of luchtvaartuig uitrust met de in [artikel 381][ref1]
      omschreven bestemming, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel381
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel383
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '381'
  - number: '384'
    text: |-
      Hij die voor eigen of vreemde rekening middellijk of onmiddellijk medewerkt tot het verhuren, vervrachten of
      verzekeren van een vaartuig of luchtvaartuig, wetende dat het de in [artikel 381][ref1] omschreven bestemming
      heeft, wordt gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel381
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel384
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '381'
  - number: '385'
    text: |-
      Hij die een Nederlands vaartuig opzettelijk in de macht van zeerovers brengt, wordt gestraft:

      1°. indien hij de schipper is met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde
      categorie;

      2°. in alle andere gevallen met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel385
  - number: 385a
    text: |-
      1 Hij die een luchtvaartuig door geweld, bedreiging met geweld of vreesaanjaging in zijn macht brengt of houdt dan
      wel van zijn route doet afwijken, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van
      de vijfde categorie.

      2 Indien twee of meer personen gezamenlijk of ten gevolge van samenspanning het feit plegen, of indien het feit
      zwaar lichamelijk letsel ten gevolge heeft, dan wel het feit is gepleegd met het oogmerk iemand wederrechtelijk van
      zijn vrijheid te beroven of beroofd te houden, wordt gevangenisstraf van ten hoogste vijftien jaren of geldboete
      van de vijfde categorie opgelegd.

      3 Indien het feit de dood ten gevolge heeft, wordt levenslange gevangenisstraf of tijdelijke van ten hoogste dertig
      jaren of geldboete van de vijfde categorie opgelegd.

      4 De straffen in het eerste lid bepaald, zijn toepasselijk op degene die de in dit lid omschreven misdrijven pleegt
      ten aanzien van een vaartuig, een installatie ter zee, een autobus, een trein of een ander middel van openbaar
      vervoer dan wel een vrachtwagen met een gevaarlijke lading.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel385a
  - number: 385b
    text: |-
      1 Hij die opzettelijk een ontplofbare of anderszins gemeengevaarlijke stof, of enig ander gemeengevaarlijk voorwerp
      aan boord van een luchtvaartuig brengt of een daad van geweld begaat tegen iemand die zich aan boord van een
      luchtvaartuig in vlucht bevindt, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daarvan gevaar
      voor de veiligheid van het luchtvaartuig te duchten is;

      2°. met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daarvan gevaar
      voor de veiligheid van het luchtvaartuig te duchten is en het feit zwaar lichamelijk letsel voor een ander ten
      gevolge heeft;

      3°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan gevaar
      voor de veiligheid van het luchtvaartuig te duchten is en het feit iemands dood ten gevolge heeft.

      2 De straffen in het eerste lid bepaald, zijn toepasselijk op degene die de in dit lid omschreven misdrijven pleegt
      ten aanzien van een vaartuig en een installatie ter zee. Onder gevaar voor de veiligheid van het luchtvaartuig
      wordt in het eerste lid tevens begrepen gevaar voor de veilige vaart van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel385b
  - number: 385c
    text: |-
      Hij die opzettelijk gegevens doorgeeft waarvan hij weet of ernstige reden heeft om te vermoeden dat zij onjuist
      zijn, wordt, indien daarvan gevaar voor een luchtvaartuig in vlucht of voor de veilige vaart van een vaartuig te
      duchten is, gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel385c
  - number: 385d
    text: |-
      Hij die opzettelijk een daad van geweld begaat tegen iemand die zich op een luchthaven bevindt, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daardoor
      levensgevaar of gevaar voor zwaar lichamelijk letsel voor anderen op de luchthaven te duchten valt;

      2°. met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daardoor
      levensgevaar of gevaar voor zwaar lichamelijk letsel voor anderen op de luchthaven te duchten valt en het feit
      zwaar lichamelijk letsel voor een ander ten gevolge heeft;

      3°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daardoor
      levensgevaar voor anderen op de luchthaven te duchten valt en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel385d
  - number: '386'
    text: |-
      De opvarende van een Nederlands schip die zich wederrechtelijk van het schip meester maakt, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel386
  - number: '387'
    text: |-
      De schipper van een Nederlands schip die het schip aan de eigenaar of de rederij onttrekt en ten eigen bate
      gebruikt, wordt gestraft met gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel387
  - number: 389bis
    text: |-
      1 De schipper van een Nederlands vaartuig die een scheepsverklaring doet opmaken waarvan hij weet dat de inhoud in
      strijd is met de waarheid, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde
      categorie.

      2 De schepelingen die medewerken tot het doen opmaken van een scheepsverklaring waarvan zij weten dat de inhoud
      in strijd is met de waarheid, worden gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel389bis
  - number: 389ter
    text: |-
      Hij die ter voldoening aan het voorschrift van het [vierde lid van artikel 194][ref1], van het
      [vijfde lid van artikel 784][ref2], van het [eerste lid onder a ten derde van artikel 786][ref3] of van het
      [vierde lid van artikel 1303 van Boek 8 van het Burgerlijk Wetboek][ref4] een schriftelijke verklaring overlegt van
      welke hij weet dat de inhoud in strijd is met de waarheid, wordt gestraft met gevangenisstraf van ten hoogste vier
      jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel784
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel786
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel1303
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel389ter
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '194'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '784'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '786'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '1303'
  - number: '390'
    text: |-
      De schipper van een Nederlands vaartuig die gedurende de reis zich opzettelijk aan het voeren van het vaartuig
      onttrekt, wordt, indien die gedraging de veiligheid van de opvarenden, het vaartuig of de zaken aan boord daarvan
      in gevaar brengt, gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel390
  - number: '395'
    text: |-
      1 De opvarende van een Nederlands schip of zeevissersschip die aan boord de schipper, of de schepeling die aan
      boord of in dienst een meerdere in rang feitelijk aanrandt, zich met geweld of bedreiging met geweld tegen hem
      verzet of hem opzettelijk van zijn vrijheid van handelen berooft, wordt, als schuldig aan insubordinatie, gestraft
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.

      2 De schuldige wordt gestraft:

      1°. met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, indien het misdrijf of de
      daarmede gepaard gaande feitelijkheden enig lichamelijk letsel ten gevolge hebben;

      2°. met gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van de vijfde categorie, indien zij
      zwaar lichamelijk letsel ten gevolge hebben;

      3°. met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien zij de dood ten
      gevolge hebben.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel395
  - number: '396'
    text: |-
      1 Insubordinatie gepleegd door twee of meer verenigde personen, wordt, als muiterij, gestraft met gevangenisstraf
      van ten hoogste zes jaren of geldboete van de vierde categorie.

      2 De schuldige wordt gestraft:

      1°. met gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van de vijfde categorie, indien
      het door hem gepleegde misdrijf of de daarbij door hem gepleegde feitelijkheden enig lichamelijk letsel ten gevolge
      hebben;

      2°. met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien zij zwaar
      lichamelijk letsel ten gevolge hebben;

      3°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien zij de dood ten
      gevolge hebben.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel396
  - number: '397'
    text: |-
      Hij die aan boord van een Nederlands schip of zeevissersschip tot muiterij op dat schip of vaartuig opruit, wordt
      gestraft met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel397
  - number: '400'
    text: |-
      1 Met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft:

      1°. de opvarende van een Nederlands vaartuig die opzettelijk niet gehoorzaamt aan enig bevel van de schipper in het
      belang van de veiligheid aan boord gegeven;

      2°. de opvarende van een Nederlands vaartuig die, wetende dat de schipper van zijn vrijheid van handelen beroofd
      is, hem niet naar vermogen te hulp komt;

      3°. de opvarende van een Nederlands vaartuig die, kennis dragende van een voornemen tot het plegen van
      insubordinatie, opzettelijk nalaat daarvan tijdig aan de schipper kennis te geven;

      4°. de opvarende, niet zijnde schepeling, van een Nederlands vaartuig die opzettelijk niet gehoorzaamt aan enig
      bevel van de schipper tot handhaving van de orde en tucht aan boord gegeven.

      2 De onder 3° vermelde bepaling is niet van toepassing indien de insubordinatie niet is gevolgd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel400
  - number: '401'
    text: |-
      De in de [artikelen 386][ref1], [395-397][ref2] en [400][ref3] bepaalde gevangenisstraffen kunnen met een derde
      worden verhoogd, indien de schuldige aan een der in die artikelen omschreven misdrijven scheepsofficier is.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel386
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel395
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel400
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel401
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '386'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '395'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '400'
  - number: '402'
    text: |-
      De schipper van een Nederlands schip die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen
      of zodanige bevoordeling te bedekken, hetzij het schip verkoopt, hetzij geld opneemt op het schip, het
      scheepstoebehoren of de scheepsvoorraad, hetzij zaken aan boord van het schip of zaken van de scheepsvoorraad
      verkoopt of verpandt, hetzij verdichte schaden of uitgaven in rekening brengt, hetzij niet zorgt dat aan boord
      de vereiste dagboeken overeenkomstig de wettelijke voorschriften worden gehouden, hetzij bij het verlaten van het
      schip niet zorgt voor het behoud van de scheepspapieren, wordt gestraft met gevangenisstraf van ten hoogste zes
      jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel402
  - number: '403'
    text: |-
      De schipper van een Nederlands schip die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen of
      zodanige bevoordeling te bedekken, van koers verandert, wordt gestraft met gevangenisstraf van ten hoogste drie
      jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel403
  - number: '405'
    text: |-
      1 De schipper van een Nederlands vaartuig die, buiten noodzaak en buiten voorkennis van de eigenaar of de rederij,
      handelingen pleegt of gedoogt, wetende dat deze het vaartuig of de zaken aan boord daarvan aan opbrenging,
      aanhouding of ophouding kunnen blootstellen, wordt gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de derde categorie.

      2 De opvarende die, buiten noodzaak en buiten voorkennis van de schipper, met gelijke wetenschap gelijke
      handelingen pleegt, wordt gestraft met gevangenisstraf van ten hoogste negen maanden of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel405
  - number: '406'
    text: |-
      De schipper van een Nederlands schip die opzettelijk buiten noodzaak aan een opvarende niet verschaft datgene wat
      hij verplicht is hem te verschaffen, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van
      de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel406
  - number: '407'
    text: |-
      De schipper van een Nederlands schip die opzettelijk buiten noodzaak of in strijd met enig wettelijk voorschrift
      goederen werpt, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel407
  - number: '408'
    text: |-
      Hij die zaken aan boord van een vaartuig, opzettelijk en wederrechtelijk vernielt, beschadigt of onbruikbaar maakt,
      wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel408
  - number: '409'
    text: |-
      De schipper die op grond van voor Nederland geldende rechtsregels de vlag van het Koninkrijk voert, wetende dat hij
      daartoe niet gerechtigd is, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel409
  - number: '410'
    text: |-
      De schipper die opzettelijk door het voeren van enig onderscheidingsteken aan zijn vaartuig de schijn geeft alsof
      het een Nederlands oorlogsvaartuig ware, of een loodsvaartuig in Nederlandse wateren of zeegaten dienst doende,
      wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel410
  - number: '411'
    text: |-
      Hij die buiten noodzaak op een Nederlands vaartuig optreedt als schipper, stuurman of machinist, wetende dat
      hij ingevolge wettelijk voorschrift daartoe onbevoegd is, wordt gestraft met gevangenisstraf van ten hoogste zes
      maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel411
  - number: '412'
    text: |-
      De schipper van een Nederlands schip die zonder geldige reden weigert te voldoen aan een wettelijke vordering om
      een beklaagde of veroordeelde benevens de tot zijn zaak betrekkelijke stukken aan boord te nemen, wordt gestraft
      met een gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel412
  - number: '413'
    text: |-
      1 De schipper van een Nederlands schip die een beklaagde of veroordeelde die hij op een wettelijke vordering aan
      boord genomen heeft, opzettelijk laat ontsnappen of bevrijdt, of bij zijn bevrijding of zelfbevrijding behulpzaam
      is, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.

      2 Indien de ontsnapping, bevrijding of zelfbevrijding aan zijn schuld is te wijten, wordt hij gestraft met
      hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel413
  - number: '414'
    text: |-
      De schipper die de krachtens het [eerste lid van artikel 358a][ref1] of van
      [artikel 785 van het Wetboek van Koophandel][ref2] op hem rustende verplichting tot hulpverlening, opzettelijk niet
      nakomt, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel358a
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel785
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 358a
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '785'
  - number: '415'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 381-387][ref1], [402][ref2] en [403][ref3] omschreven misdrijven
      kan ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref4], vermelde rechten worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel381
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel402
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel403
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel415
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '381'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '402'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '403'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 415a
    text: |-
      Indien een misdrijf, strafbaar gesteld in een der [artikelen 385a tot en met 385d][ref1], is begaan met een
      terroristisch oogmerk, wordt de in dat artikel bepaalde tijdelijke gevangenisstraf met de helft verhoogd en wordt,
      indien op het misdrijf een tijdelijke gevangenisstraf van ten hoogste vijftien jaren is gesteld, levenslange
      gevangenisstraf of tijdelijke van ten hoogste dertig jaren opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel385a
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel415a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 385a
  - number: 415b
    text: |-
      1 De samenspanning tot de in de [artikelen 385a][ref1], [385b][ref2] en [385d][ref3] omschreven misdrijven, te
      begaan met een terroristisch oogmerk, wordt gestraft met gevangenisstraf van ten hoogste tien jaren of geldboete
      van de vijfde categorie.

      2 [Artikel 96, tweede lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel385a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel385b
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel385d
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel96
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel415b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 385a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 385b
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 385d
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '96'
  - number: 415c
    text: |-
      Bij veroordeling wegens een der misdrijven omschreven in de [artikelen 385a tot en met 385d][ref1], begaan met een
      terroristisch oogmerk, alsmede bij veroordeling wegens een der misdrijven omschreven in [artikel 415b][ref2], kan
      ontzetting van het in [artikel 28, eerste lid, onder 3°][ref3], vermelde recht worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel385a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel415b
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel415c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 385a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 415b
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '416'
    text: |-
      1 Als schuldig aan opzetheling wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de
      vijfde categorie:

      a. hij die een goed verwerft, voorhanden heeft of overdraagt, dan wel een persoonlijk recht op of een zakelijk
      recht ten aanzien van een goed vestigt of overdraagt, terwijl hij ten tijde van de verwerving of het voorhanden
      krijgen van het goed dan wel het vestigen van het recht wist dat het een door misdrijf verkregen goed betrof;

      b. hij die opzettelijk uit winstbejag een door misdrijf verkregen goed voorhanden heeft of overdraagt, dan wel een
      persoonlijk recht op of zakelijk recht ten aanzien van een door misdrijf verkregen goed overdraagt.

      2 Met dezelfde straf wordt gestraft hij die opzettelijk uit de opbrengst van enig door misdrijf verkregen goed
      voordeel trekt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel416
  - number: '417'
    text: |-
      Hij die van het plegen van opzetheling een gewoonte maakt, wordt gestraft met gevangenisstraf van ten hoogste zes
      jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel417
  - number: 417bis
    text: |-
      1 Als schuldig aan schuldheling wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de
      vijfde categorie:

      a. hij die een goed verwerft, voorhanden heeft of overdraagt, dan wel een persoonlijk recht op of zakelijk recht
      ten aanzien van een goed vestigt of overdraagt, terwijl hij ten tijde van de verwerving of het voorhanden krijgen
      van het goed dan wel het vestigen van het recht redelijkerwijs had moeten vermoeden dat het een door misdrijf
      verkregen goed betrof;

      b. hij die uit winstbejag een goed voorhanden heeft of overdraagt dan wel een persoonlijk recht op of zakelijk
      recht ten aanzien van een goed overdraagt, terwijl hij redelijkerwijs moet vermoeden dat het een door misdrijf
      verkregen goed betreft.

      2 Met dezelfde straf wordt gestraft hij die uit de opbrengst van enig goed voordeel trekt, terwijl hij
      redelijkerwijs moet vermoeden dat het een door misdrijf verkregen goed betreft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel417bis
  - number: 417ter
    text: |-
      Bij veroordeling wegens een der in de [artikelen 416-417bis][ref1] omschreven misdrijven kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°, 2° en 4°][ref2], vermelde rechten worden uitgesproken en kan de schuldige
      worden ontzet van de uitoefening van het beroep waarin hij het misdrijf begaan heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel416
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel417ter
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '416'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '418'
    text: |-
      Hij die enig geschrift of enige afbeelding uitgeeft van strafbare aard, wordt gestraft met gevangenisstraf of
      hechtenis van ten hoogste een jaar of geldboete van de derde categorie, indien:

      1°. de dader noch bekend is, noch op de eerste aanmaning van de rechter-commissaris, is bekendgemaakt;

      2°. de uitgever wist of moest verwachten dat de dader op het tijdstip van de uitgave strafrechtelijk niet
      vervolgbaar of buiten het Rijk in Europa gevestigd zou zijn.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel418
  - number: '419'
    text: |-
      Hij die enig geschrift of enige afbeelding drukt van strafbare aard, wordt gestraft met gevangenisstraf of
      hechtenis van ten hoogste een jaar of geldboete van de derde categorie, indien:

      1°. de persoon op wiens last het stuk gedrukt is noch bekend is, noch op de eerste aanmaning van de rechter-
      commissaris, is bekendgemaakt;

      2°. de drukker wist of moest verwachten dat de persoon op wiens last het stuk gedrukt is, op het tijdstip van de
      uitgave strafrechtelijk niet vervolgbaar of buiten het Rijk in Europa gevestigd zou zijn.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel419
  - number: '420'
    text: |-
      Indien de aard van het geschrift of de afbeelding een misdrijf oplevert dat alleen op klacht vervolgbaar is, kan
      de uitgever of drukker in de gevallen der beide voorgaande artikelen alleen vervolgd worden op klacht van hem tegen
      wie dat misdrijf gepleegd is.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel420
  - number: 420bis
    text: |-
      1 Als schuldig aan witwassen wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vijfde categorie:

      a. hij die van een voorwerp de werkelijke aard, de herkomst, de vindplaats, de vervreemding of de verplaatsing
      verbergt of verhult, dan wel verbergt of verhult wie de rechthebbende op een voorwerp is of het voorhanden heeft,
      terwijl hij weet dat het voorwerp – onmiddellijk of middellijk – afkomstig is uit enig misdrijf;

      b. hij die een voorwerp verwerft, voorhanden heeft, overdraagt of omzet of van een voorwerp gebruik maakt, terwijl
      hij weet dat het voorwerp – onmiddellijk of middellijk – afkomstig is uit enig misdrijf.

      2 Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel420bis
  - number: 420bis.1
    text: |-
      Witwassen dat enkel bestaat uit het verwerven of voorhanden hebben van een voorwerp dat onmiddellijk afkomstig is
      uit enig eigen misdrijf wordt als eenvoudig witwassen gestraft met een gevangenisstraf van ten hoogste zes maanden
      of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel420bis.1
  - number: 420ter
    text: |-
      1 Hij die van het plegen van witwassen een gewoonte maakt, wordt gestraft met gevangenisstraf van ten hoogste acht
      jaren of geldboete van de vijfde categorie.

      2 Met dezelfde straf wordt gestraft hij die zich schuldig maakt aan witwassen in de uitoefening van zijn beroep
      of bedrijf.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel420ter
  - number: 420quater
    text: |-
      1 Als schuldig aan schuldwitwassen wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van
      de vijfde categorie:

      a. hij die van een voorwerp de werkelijke aard, de herkomst, de vindplaats, de vervreemding of de verplaatsing
      verbergt of verhult, dan wel verbergt of verhult wie de rechthebbende op een voorwerp is of het voorhanden heeft,
      terwijl hij redelijkerwijs moet vermoeden dat het voorwerp – onmiddellijk of middellijk – afkomstig is uit enig
      misdrijf;

      b. hij die een voorwerp verwerft, voorhanden heeft, overdraagt of omzet of van een voorwerp gebruik maakt, terwijl
      hij redelijkerwijs moet vermoeden dat het voorwerp – onmiddellijk of middellijk – afkomstig is uit enig misdrijf.

      2 Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel420quater
  - number: 420quater.1
    text: |-
      Schuldwitwassen dat enkel bestaat uit het verwerven of voorhanden hebben van een voorwerp dat onmiddellijk
      afkomstig is uit enig eigen misdrijf wordt als eenvoudig schuldwitwassen gestraft met een gevangenisstraf van ten
      hoogste drie maanden of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel420quater.1
  - number: 420quinquies
    text: |-
      Bij veroordeling wegens een der in de [artikelen 420bis tot en met 420quater.1][ref1] omschreven misdrijven kan
      ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref2], vermelde rechten worden uitgesproken en
      kan de schuldige worden ontzet van de uitoefening van het beroep waarin hij het misdrijf heeft begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel420bis
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel420quinquies
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 420bis
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '421'
    text: |-
      1 Als schuldig aan het financieren van terrorisme wordt gestraft met een gevangenisstraf van ten hoogste acht jaren
      of geldboete van de vijfde categorie:

      a. hij die zich of een ander opzettelijk middelen of inlichtingen verschaft dan wel opzettelijk voorwerpen
      verzamelt, verwerft, voorhanden heeft of aan een ander verschaft, die geheel of gedeeltelijk, onmiddellijk of
      middellijk, dienen om geldelijke steun te verlenen aan het plegen van een terroristisch misdrijf of een misdrijf
      ter voorbereiding of vergemakkelijking van een terroristisch misdrijf;

      b. hij die zich of een ander opzettelijk middelen of inlichtingen verschaft dan wel opzettelijk voorwerpen
      verzamelt, verwerft, voorhanden heeft of aan een ander verschaft, die geheel of gedeeltelijk, onmiddellijk of
      middellijk, dienen om geldelijke steun te verlenen aan het plegen van een van de misdrijven omschreven in:

        - de [artikelen 117 tot en met 117b][ref1] alsmede [artikel 285][ref2], indien dat misdrijf is gericht tegen een
      internationaal beschermd persoon of diens beschermde goederen;
        - de [artikelen 79][ref3] en [80 van de Kernenergiewet][ref4], de [artikelen 161quater][ref5], [173a][ref6]
      en [284a][ref7] alsmede de artikelen [140][ref8], [157][ref9], [225][ref10], [310 tot en met 312][ref11],
      [317][ref12], [318][ref13], [321][ref14], [322][ref15] en [326][ref16], indien het feit opzettelijk wederrechtelijk
      handelen betreft met betrekking tot kernmateriaal;
        - de [artikelen 162][ref17], [162a][ref18], [166][ref19], [168][ref20], [282a][ref21], [352][ref22],
      [385a tot en met 385d][ref23];
        - de [artikelen 92 tot en met 96][ref24], [108][ref25], [115][ref26], [121 tot en met 123][ref27], [140][ref28],
      [157][ref29], [161][ref30], [161bis][ref31], [161sexies][ref32], [164][ref33], [170][ref34], [172][ref35],
      [287][ref36], [288][ref37] en [289][ref38], indien het feiten betreft die worden gepleegd door middel van het
      opzettelijk wederrechtelijk tot ontlading of ontploffing brengen van een springstof of ander voorwerp, of het laten
      vrijkomen, verspreiden of inwerken van een voorwerp, waardoor levensgevaar, gevaar voor zwaar lichamelijk letsel
      voor een ander of aanzienlijke materiële schade te duchten is.

      2 Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.


