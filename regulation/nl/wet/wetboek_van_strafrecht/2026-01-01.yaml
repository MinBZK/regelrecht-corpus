  - number: 77y
    text: |-
      1 De rechter die bepaalt dat een door hem opgelegde straf of maatregel niet zal worden ten uitvoer gelegd, stelt
      daarbij een proeftijd vast van ten hoogste twee jaren.

      2 De proeftijd gaat in:

      a. indien een kennisgeving als bedoeld in
      [artikel 366a, eerste en tweede lid, van het Wetboek van Strafvordering][ref1] is uitgereikt of toegezonden, op de
      vijftiende dag nadat de einduitspraak is gedaan, tenzij door de tijdige aanwending van een rechtsmiddel het vonnis
      of arrest niet onherroepelijk is geworden;

      b. indien een kennisgeving als bedoeld in [artikel 366a, derde lid, van het Wetboek van Strafvordering][ref2] moet
      worden betekend, op de vijftiende dag na die betekening, tenzij door de tijdige aanwending van een rechtsmiddel het
      vonnis of arrest niet onherroepelijk is geworden;

      c. indien de rechter een bevel als bedoeld in [artikel 77za, eerste lid][ref3], heeft gegeven, op de dag van de
      einduitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel366a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel366a
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel77za
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel77y
