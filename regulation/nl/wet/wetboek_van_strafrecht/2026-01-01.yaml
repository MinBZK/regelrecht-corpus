  - number: 77x
    text: |-
      1 In geval van een veroordeling tot jeugddetentie, vervangende jeugddetentie daaronder niet begrepen, tot
      taakstraf, tot geldboete of tot ontzegging van de bevoegdheid motorrijtuigen te besturen, kan de rechter bepalen
      dat deze geheel of gedeeltelijk niet ten uitvoer zal worden gelegd.

      2 In geval van een veroordeling tot plaatsing in een inrichting voor jeugdigen kan de rechter bepalen dat deze niet
      ten uitvoer zal worden gelegd. [Artikel 6:6:10a van het Wetboek van Strafvordering][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6610a
