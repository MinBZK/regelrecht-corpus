        bwb_id: BWBR0001854
        artikel: 273f
  - number: '274'
    text: |-
      Hij die voor eigen of vreemde rekening slavenhandel drijft of opzettelijk daaraan middellijk of onmiddellijk
      deelneemt, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel274
  - number: '275'
    text: |-
      1 Hij die als schipper dienst neemt of dienst doet op een vaartuig, wetende dat het tot het drijven van
      slavenhandel bestemd is, of het daartoe gebruikende, wordt gestraft met gevangenisstraf van ten hoogste twaalf
      jaren of geldboete van de vijfde categorie.

      2 Indien het vervoer de dood van een of meer slaven ten gevolge heeft, wordt de schipper gestraft met
      gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel275
  - number: '276'
    text: |-
      Hij die als schepeling dienst neemt op een vaartuig, wetende dat het tot het drijven van slavenhandel bestemd is of
      gebruikt wordt, of vrijwillig in dienst blijft na die bestemming of dit gebruik te hebben vernomen, wordt gestraft
      met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel276
  - number: '277'
    text: |-
      Hij die voor eigen of vreemde rekening middellijk of onmiddellijk medewerkt tot het verhuren, vervrachten of
      verzekeren van een vaartuig, wetende dat het tot het drijven van slavenhandel bestemd is, wordt gestraft met
      gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel277
  - number: '278'
    text: |-
      Hij die iemand over de grenzen van het Rijk in Europa voert, met het oogmerk om hem wederrechtelijk onder de
      macht van een ander te brengen of om hem in hulpeloze toestand te verplaatsen, wordt, als schuldig aan mensenroof,
      gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel278
  - number: '279'
    text: |-
      1 Hij die opzettelijk een minderjarige onttrekt aan het wettig over hem gesteld gezag of aan het opzicht van degene
      die dit desbevoegd over hem uitoefent, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete
      van de vierde categorie.

      2 Gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie wordt opgelegd indien list,
      geweld of bedreiging met geweld is gebezigd, of indien de minderjarige beneden de twaalf jaren oud is.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel279
  - number: '280'
    text: |-
      1 Hij die opzettelijk een minderjarige die onttrokken is of zich onttrokken heeft aan het wettig over hem gesteld
      gezag of aan het opzicht van degene die dit desbevoegd over hem uitoefent, verbergt of aan de nasporing van de
      ambtenaren van de justitie of politie onttrekt, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of
      geldboete van de vierde categorie of, indien de minderjarige beneden de twaalf jaren oud is, met gevangenisstraf
      van ten hoogste zes jaren of geldboete van de vierde categorie.

      2 Het voorgaande is niet van toepassing op

      a. hem die de raad voor de kinderbescherming onverwijld de verblijfplaats van de minderjarige meedeelt; of

      b. de jeugdhulpaanbieder, bedoeld in [artikel 1.1 van de Jeugdwet][ref1], in zoverre hij handelt overeenkomstig
      de [Jeugdwet][ref2]

      c. hem die handelt in het kader van zorgvuldige hulpverlening aan de minderjarige.

      3 Van zorgvuldige hulpverlening vormen de onverwijlde melding dat hulp wordt verleend alsmede de onverwijlde
      bekendmaking van de identiteit van de hulpverlener en zijn plaats van verblijf of vestiging aan degene die het
      gezag over de minderjarige uitoefent, bestanddelen.

      4 Met ambtenaren van justitie en politie worden gelijkgesteld personen in de openbare dienst van een vreemde staat
      die in Nederland op door het volkenrecht toegelaten wijze hun bediening uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0034925
