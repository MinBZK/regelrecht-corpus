  - number: '44'
    text: |-
      1 Indien een ambtenaar door het begaan van een strafbaar feit een bijzondere ambtsplicht schendt of bij het begaan
      van een strafbaar feit gebruik maakt van macht, gelegenheid of middel hem door zijn ambt geschonken, kan de op het
      feit gestelde straf, met uitzondering van geldboete, met een derde worden verhoogd.

      2 Met een ambtenaar wordt gelijkgesteld een persoon in de openbare dienst van een vreemde staat die in Nederland op
      door het volkenrecht toegelaten wijze zijn bediening uitoefent.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel44
  - number: 44bis
    text: |-
      Indien een strafbaar feit wordt begaan met een discriminatoir oogmerk dan wel bestaat uit, wordt voorafgegaan door,
      vergezeld van of gevolgd door gedragingen die haat tegen of discriminatie van een groep mensen wegens hun ras, hun
      godsdienst of levensovertuiging, hun geslacht, hun seksuele gerichtheid of hun handicap tot uitdrukking brengen,
      kan de op dat feit gestelde tijdelijke gevangenisstraf of hechtenis met een derde worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel44bis
  - number: 44a
    text: |-
      1 Op vordering van de officier van justitie kan de rechter na een op grond van
      [artikel 226h, derde lid, van het Wetboek van Strafvordering][ref1] gemaakte afspraak de straf verminderen die
      hij overwoog op te leggen op de in het tweede lid bepaalde wijze. Bij de strafvermindering houdt de rechter ermee
      rekening dat door het afleggen van een getuigenverklaring een belangrijke bijdrage is of kan worden geleverd aan de
      opsporing of vervolging van misdrijven.

      2 Bij toepassing van het eerste lid kan de strafvermindering bestaan in:

      a. maximaal de helft bij een onvoorwaardelijke tijdelijke vrijheidsstraf, taakstraf of geldboete, of

      b. de omzetting van maximaal de helft van het onvoorwaardelijke gedeelte van een vrijheidsstraf, taakstraf of van
      een geldboete in een voorwaardelijk gedeelte, of

      c. de vervanging van maximaal een derde gedeelte van een vrijheidsstraf door taakstraf of een onvoorwaardelijke
      geldboete.

      3 Bij toepassing van het tweede lid, onder b, blijft [artikel 14a, eerste en tweede lid][ref2], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel226h
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel14a
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 226h
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 14a
  - number: '45'
    text: |-
      1 Poging tot misdrijf is strafbaar, wanneer het voornemen van de dader zich door een begin van uitvoering heeft
      geopenbaard.

      2 Het maximum van de hoofdstraffen op het misdrijf gesteld wordt bij poging met een derde verminderd.

      3 Geldt het een misdrijf waarop levenslange gevangenisstraf is gesteld, dan wordt gevangenisstraf opgelegd van ten
      hoogste twintig jaren.

      4 De bijkomende straffen zijn voor poging dezelfde als voor het voltooide misdrijf.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel45
  - number: '46'
    text: |-
      1 Voorbereiding van een misdrijf waarop naar de wettelijke omschrijving een gevangenisstraf van acht jaren of
      meer is gesteld is strafbaar, wanneer de dader opzettelijk voorwerpen, stoffen, informatiedragers, ruimten of
      vervoermiddelen bestemd tot het begaan van dat misdrijf verwerft, vervaardigt, invoert, doorvoert, uitvoert of
      voorhanden heeft.

      2 Het maximum van de hoofdstraffen op het misdrijf gesteld wordt bij voorbereiding met de helft verminderd.

      3 Geldt het een misdrijf waarop levenslange gevangenisstraf is gesteld, dan wordt gevangenisstraf opgelegd van ten
      hoogste vijftien jaren.

      4 De bijkomende straffen zijn voor voorbereiding dezelfde als voor het voltooide misdrijf.

      5 Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel46
  - number: 46a
    text: |-
      Poging om een ander door een der in [artikel 47, eerste lid onder 2e][ref1], vermelde middelen te bewegen om een
      misdrijf te begaan, is strafbaar, met dien verstande dat geen zwaardere straf wordt uitgesproken dan ter zake van
      poging tot het misdrijf of, indien zodanige poging niet strafbaar is, terzake van het misdrijf zelf kan worden
      opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel47
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '47'
  - number: 46b
    text: |-
      Voorbereiding noch poging bestaat indien het misdrijf niet is voltooid tengevolge van omstandigheden van de wil van
      de dader afhankelijk.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel46b
  - number: '47'
    text: |-
      1 Als daders van een strafbaar feit worden gestraft:

      1°. zij die het feit plegen, doen plegen of medeplegen;

      2°. zij die door giften, beloften, misbruik van gezag, geweld, bedreiging, of misleiding of door het verschaffen
      van gelegenheid, middelen of inlichtingen het feit opzettelijk uitlokken.

      2 Ten aanzien van de laatsten komen alleen die handelingen in aanmerking die zij opzettelijk hebben uitgelokt,
      benevens hun gevolgen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel47
  - number: '48'
    text: |-
      Als medeplichtigen van een misdrijf worden gestraft:

      1°. zij die opzettelijk behulpzaam zijn bij het plegen van het misdrijf;

      2°. zij die opzettelijk gelegenheid, middelen of inlichtingen verschaffen tot het plegen van het misdrijf.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel48
  - number: '49'
    text: |-
      1 Het maximum van de hoofdstraffen op het misdrijf gesteld wordt bij medeplichtigheid met een derde verminderd.

      2 Geldt het een misdrijf waarop levenslange gevangenisstraf is gesteld, dan wordt gevangenisstraf opgelegd van ten
      hoogste twintig jaren.

      3 De bijkomende straffen zijn voor medeplichtigheid dezelfde als voor het misdrijf zelf.

      4 Bij het bepalen van de straf komen alleen die handelingen in aanmerking die de medeplichtige opzettelijk heeft
      gemakkelijk gemaakt of bevorderd, benevens hun gevolgen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel49
  - number: '50'
    text: |-
      De persoonlijke omstandigheden waardoor de strafbaarheid uitgesloten, verminderd of verhoogd wordt, komen bij de
      toepassing van de strafwet alleen in aanmerking ten aanzien van die dader of medeplichtige wie zij persoonlijk
      betreffen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel50
  - number: '51'
    text: |-
      1 Strafbare feiten kunnen worden begaan door natuurlijke personen en rechtspersonen.

      2 Indien een strafbaar feit wordt begaan door een rechtspersoon, kan de strafvervolging worden ingesteld en kunnen
      de in de wet voorziene straffen en maatregelen, indien zij daarvoor in aanmerking komen, worden uitgesproken:

      1°. tegen die rechtspersoon, dan wel

      2°. tegen hen die tot het feit opdracht hebben gegeven, alsmede tegen hen die feitelijke leiding hebben gegeven aan
      de verboden gedraging, dan wel

      3°. tegen de onder 1° en 2° genoemden te zamen.

      3 Voor de toepassing van de vorige leden wordt met de rechtspersoon gelijkgesteld: de vennootschap zonder
      rechtspersoonlijkheid, de maatschap, de rederij en het doelvermogen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel51
  - number: '52'
    text: Medeplichtigheid aan overtreding is niet strafbaar.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel52
  - number: '53'
    text: |-
      1 Bij misdrijven door middel van de drukpers gepleegd wordt de uitgever als zodanig niet vervolgd, indien het
      gedrukte stuk zijn naam en woonplaats vermeldt en de dader bekend is of op de eerste aanmaning van de rechter-
      commissaris, door de uitgever is bekendgemaakt.

      2 Deze bepaling is niet toepasselijk, indien de dader op het tijdstip van de uitgave strafrechtelijk niet
      vervolgbaar of buiten het Rijk in Europa gevestigd was.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel53
  - number: '54'
    text: |-
      1 Bij misdrijven door middel van de drukpers gepleegd wordt de drukker als zodanig niet vervolgd, indien het
      gedrukte stuk zijn naam en woonplaats vermeldt en de persoon op wiens last het stuk is gedrukt, bekend is of op de
      eerste aanmaning van de rechter-commissaris, door de drukker is bekendgemaakt.

      2 Deze bepaling is niet toepasselijk, indien de persoon op wiens last het stuk is gedrukt, op het tijdstip van het
      drukken strafrechtelijk niet vervolgbaar of buiten het Rijk in Europa gevestigd was.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel54
  - number: 54a
    text: |-
      Een tussenpersoon die een communicatiedienst verleent bestaande in de doorgifte of opslag van
      gegevens die van een ander afkomstig zijn, wordt bij een strafbaar feit dat met gebruikmaking van
      die dienst wordt begaan als zodanig niet vervolgd indien hij voldoet aan een bevel als bedoeld in
      [artikel 125p van het Wetboek van Strafvordering][ref1] of een beslissing als bedoeld in artikel 3, eerste lid,
      van [verordening (EU) 2021/784](32684R2021) van het Europees Parlement en de Raad van 29 april 2021 inzake het
      tegengaan van de verspreiding van terroristische online-inhoud (PbEU 2021, L 172) of een bevel als bedoeld in
      [artikel 6, eerste lid, van de Wet bestuursrechtelijke aanpak online kinderpornografisch materiaal][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel125p
      [ref2]: https://wetten.overheid.nl/BWBR0049809#Artikel6
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 125p
      - id: ref2
        bwb_id: BWBR0049809
        artikel: '6'
  - number: '55'
    text: |-
      1 Valt een feit in meer dan één strafbepaling, dan wordt slechts één van die bepalingen toegepast, bij verschil die
      waarbij de zwaarste hoofdstraf is gesteld.

      2 Indien voor een feit dat in een algemene strafbepaling valt een bijzondere strafbepaling bestaat, komt deze
      alleen in aanmerking.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel55
  - number: '56'
    text: |-
      1 Staan meerdere feiten, ofschoon elk op zichzelf misdrijf of overtreding opleverende, in zodanig verband dat zij
      moeten worden beschouwd als één voortgezette handeling, dan wordt slechts één strafbepaling toegepast, bij verschil
      die waarbij de zwaarste hoofdstraf is gesteld.

      2 Insgelijks wordt slechts één strafbepaling toegepast bij schuldigverklaring aan valsheid of muntschennis en aan
      het gebruikmaken van het voorwerp ten opzichte waarvan de valsheid of muntschennis gepleegd is.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel56
  - number: '57'
    text: |-
      1 Bij samenloop van feiten die als op zichzelf staande handelingen moeten worden beschouwd en meer dan één misdrijf
      opleveren waarop gelijksoortige hoofdstraffen zijn gesteld, wordt één straf opgelegd.

      2 Het maximum van deze straf is het totaal van de hoogste straffen op de feiten gesteld, doch - voor zover het
      gevangenisstraf of hechtenis betreft - niet meer dan een derde boven het hoogste maximum.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel57
  - number: '58'
    text: |-
      Bij samenloop van feiten die als op zichzelf staande handelingen moeten worden beschouwd en meer dan één misdrijf
      opleveren waarop ongelijksoortige hoofdstraffen zijn gesteld, kan elk van die straffen worden opgelegd, doch deze
      mogen - voor zover het gevangenisstraf en hechtenis betreft - te zamen in duur de langstdurende niet meer dan een
      derde overtreffen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel58
  - number: '59'
    text: |-
      Bij veroordeling tot levenslange gevangenisstraf kunnen daarnevens geen andere straffen worden opgelegd dan
      ontzetting van bepaalde rechten, verbeurdverklaring van reeds in beslag genomen voorwerpen en openbaarmaking van de
      rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel59
  - number: '60'
    text: |-
      In de gevallen van de [artikelen 57][ref1] en [58][ref2] gelden ten aanzien van bijkomende straffen de volgende
      bepalingen:

      1°. de straffen van ontzetting van dezelfde rechten worden opgelost in één straf, in duur de opgelegde hoofdstraf
      of hoofdstraffen ten minste twee en ten hoogste vijf jaren te boven gaande, of ingeval geen andere hoofdstraf dan
      geldboete is opgelegd, in één straf van ten minste twee en ten hoogste vijf jaren;

      2°. de straffen van ontzetting van verschillende rechten worden voor elk misdrijf afzonderlijk en zonder
      vermindering opgelegd;

      3°. de straffen van verbeurdverklaring van bepaalde voorwerpen worden voor elk misdrijf afzonderlijk en
      zonder vermindering opgelegd; de vervangende vrijheidsstraffen mogen gezamenlijk het maximum, bepaald in
      [artikel 24][ref3], niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel24c
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel60
