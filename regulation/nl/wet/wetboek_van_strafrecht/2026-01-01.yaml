  - number: 77gg
    text: |-
      1 De straffen en maatregelen als bedoeld in deze Titel, zijn voor poging, voorbereiding, deelneming en
      medeplichtigheid dezelfde als die voor het voltooide misdrijf.

      2 Bij samenloop worden meer feiten die als op zichzelf staande handelingen moeten worden beschouwd, voor de
      toepassing van straffen en maatregelen als één feit aangemerkt. [Artikel 63][ref1] is met betrekking tot straffen
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel63
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel77gg
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '63'
  - number: '78'
    text: |-
      Waar van misdrijf in het algemeen of van enig misdrijf in het bijzonder gesproken wordt, wordt daaronder
      medeplichtigheid aan, poging tot en voorbereiding van dat misdrijf begrepen, voorzover niet uit enige bepaling het
      tegendeel volgt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel78
  - number: 78a
    text: |-
      1 Waar in dit wetboek de bevoegdheid wordt gegeven tot het horen, verhoren of ondervragen van personen, wordt
      daaronder, met uitzondering van bij algemene maatregel van bestuur te bepalen gevallen, mede begrepen horen,
      verhoren of ondervragen per videoconferentie, waarbij een directe beeld- en geluidsverbinding totstandkomt tussen
      de betrokken personen.

      2 De voorzitter van het college, de rechter, de rechter-commissaris of ambtenaar die met de leiding over het
      horen is belast, beslist of van videoconferentie gebruik gemaakt wordt, waarbij het belang van het onderzoek in
      aanmerking wordt genomen. Alvorens te beslissen wordt de te horen persoon of diens raadsman en in voorkomende
      gevallen de officier van justitie, in de gelegenheid gesteld hun mening kenbaar te maken over de toepassing van
      videoconferentie. Bij algemene maatregel van bestuur kunnen hierover nadere regels worden gesteld.

      3 Tegen de beslissing om van videoconferentie gebruik te maken staat geen afzonderlijk rechtsmiddel open.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:

      a. de eisen waaraan de techniek van videoconferentie dient te voldoen, onder meer met het oog op de
      onschendbaarheid van vastgelegde waarnemingen;

      b. de controle op de naleving van de eisen, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel78a
  - number: 78b
    text: |-
      Waar van veroordeling wordt gesproken wordt daaronder een strafbeschikking begrepen, voorzover niet uit enige
      bepaling het tegendeel volgt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel78b
  - number: 78c
    text: |-
      Waar van een voorafgegane of vroegere veroordeling wegens een strafbaar feit wordt gesproken, wordt daaronder mede
      verstaan een voorafgegane of vroegere onherroepelijke veroordeling door een strafrechter in een andere lidstaat van
      de Europese Unie wegens soortgelijke feiten.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel78c
  - number: '79'
    text: |-
      Aanslag tot een feit bestaat, zodra het voornemen van de dader zich door een begin van uitvoering, in de zin van
      [artikel 45][ref1], heeft geopenbaard.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel45
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '45'
  - number: '80'
    text: Samenspanning bestaat zodra twee of meer personen overeengekomen zijn om het misdrijf te plegen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel80
  - number: 80bis
    text: |-
      Onder omwenteling wordt verstaan het vernietigen of op onwettige wijze veranderen van de grondwettige regeringsvorm
      of de orde van troonopvolging.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel80bis
  - number: 80ter
    text: |-
      Onder verboden plaats wordt verstaan iedere plaats die als verboden plaats is aangewezen ingevolge de
      [Wet bescherming staatsgeheimen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002074
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel80ter
    references:
      - id: ref1
        bwb_id: BWBR0002074
  - number: 80quater
    text: |-
      Onder gegeven waarvan de geheimhouding door het belang van de staat wordt geboden, wordt mede verstaan
      een gegeven, behorende tot of ontleend aan gegevens, hulpmiddelen of materialen of met behulp daarvan
      verrichte onderzoekingen of toegepaste werkmethoden, ter zake van de geheimhouding waarvan krachtens
      [artikel 68 van de Kernenergiewet][ref1] gestelde regelen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel68
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel80quater
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '68'
  - number: 80quinquies
    text: |-
      Onder gegevens wordt verstaan iedere weergave van feiten, begrippen of instructies, op een overeengekomen wijze,
      geschikt voor overdracht, interpretatie of verwerking door personen of geautomatiseerde werken.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel80quinquies
  - number: 80sexies
    text: |-
      Onder geautomatiseerd werk wordt verstaan een apparaat of groep van onderling verbonden of samenhangende apparaten,
      waarvan er één of meer op basis van een programma automatisch computergegevens verwerken.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel80sexies
  - number: 80septies
    text: |-
      1 Onder niet-contant betaalinstrument wordt verstaan:

      a. een beveiligd voorwerp, niet zijnde muntspeciën of munt- of bankbiljetten;

      b. een beveiligde registratie of afgeschermde gegevens,

      geschikt voor het initiëren van een betaalopdracht.

      2 Onder niet-contant betaalinstrument wordt mede verstaan een beveiligd voorwerp, een beveiligde registratie of
      afgeschermde gegevens, geschikt voor het initiëren van een betaalopdracht door middel van virtuele valuta als
      bedoeld in [artikel 1, eerste lid, van de Wet ter voorkoming van witwassen en financiering van terrorisme][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel80septies
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
  - number: '81'
    text: Met het plegen van geweld wordt gelijkgesteld het brengen in een staat van bewusteloosheid of onmacht.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel81
  - number: '82'
    text: |-
      1 Onder zwaar lichamelijk letsel worden begrepen: ziekte die geen uitzicht op volkomen genezing overlaat,
      voortdurende ongeschiktheid tot uitoefening van zijn ambts- of beroepsbezigheden, en afdrijving of dood van de
      vrucht van een vrouw.

      2 Onder zwaar lichamelijk letsel wordt mede begrepen storing van de verstandelijke vermogens die langer dan vier
      weken geduurd heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel82
  - number: 82a
    text: |-
      Onder een ander, of een kind bij of kort na de geboorte, van het leven beroven wordt begrepen: het doden van een
      vrucht die naar redelijkerwijs verwacht mag worden in staat is buiten het moederlichaam in leven te blijven.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel82a
  - number: '83'
    text: |-
      Onder terroristisch misdrijf wordt verstaan:

      1º. elk van de misdrijven omschreven in de [artikelen 92 tot en met 96][ref1], [108, tweede lid][ref2],
      [115, tweede lid][ref3], [117, tweede lid][ref4], [121][ref5], [122][ref6], [157, onderdeel 3°][ref7],
      [161quater, onderdeel 2°][ref8], [164, tweede lid][ref9], [166, onderdeel 3°][ref10],
      [168, onderdeel 2°][ref11], [170, onderdeel 3°][ref12], [174, tweede lid][ref13], en [289][ref14], alsmede in
      [artikel 80, tweede lid, Kernenergiewet][ref15], indien het misdrijf is begaan met een terroristisch oogmerk;

      2º. elk van de misdrijven waarop ingevolge de [artikelen 114a][ref16], [114b][ref17], [120a][ref18],
      [120b][ref19], [130a][ref20], [138b, vijfde lid][ref21], [176a][ref22], [176b][ref23], [282c][ref24],
      [289a][ref25], [304a][ref26], [304b][ref27], [354a, tweede lid][ref28],[415a][ref29] en [415b][ref30], alsmede
      [artikel 80, derde lid, van de Kernenergiewet][ref31] gevangenisstraf is gesteld;

      3º. elk van de misdrijven omschreven in de [artikelen 140a][ref32], [282b][ref33], [285, derde lid][ref34],
      en [288a][ref35], alsmede in [artikel 55, vijfde lid, van de Wet wapens en munitie][ref36],
      [artikel 6, vierde lid, van de Wet op de economische delicten][ref37],
      [artikel 33b van de Wet explosieven voor civiel gebruik][ref38] en [artikel 79 van de Kernenergiewet][ref39].


