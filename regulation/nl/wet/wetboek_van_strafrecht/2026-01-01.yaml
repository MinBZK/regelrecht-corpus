  - number: 37a
    text: |-
      1 Indien de veiligheid van anderen, dan wel de algemene veiligheid van personen of goederen dat eist, kan de
      rechter gelasten dat een verdachte ter beschikking wordt gesteld indien hij tot het oordeel komt dat:

      1°. bij de verdachte tijdens het begaan van het feit gebrekkige ontwikkeling of ziekelijke stoornis van de
      geestvermogens bestond; en

      2°. het door hem begane feit een misdrijf is waarop naar de wettelijke omschrijving een gevangenisstraf
      van vier jaar of meer is gesteld dan wel behoort tot een van de misdrijven omschreven in de
      [artikelen 132][ref1], [285, eerste lid][ref2], [285b][ref3], en [395 van het Wetboek van Strafrecht][ref4],
      __REF004___________________________________________________________________________________________________________
      ___________, en [11, tweede lid, van de Opiumwet][ref6].

      2 Bij toepassing van het vorige lid kan de rechter afzien van het opleggen van straf, ook indien hij oordeelt dat
      het feit wel aan de verdachte kan worden toegerekend.

      3 Ten behoeve van het oordeel, bedoeld in het eerste lid, doet de rechter een met redenen omkleed, gedagtekend en
      ondertekend advies overleggen van ten minste twee gedragsdeskundigen van verschillende disciplines, waaronder een
      psychiater, die de betrokkene hebben onderzocht. Zodanig advies dient door de gedragsdeskundigen gezamenlijk dan
      wel door ieder van hen afzonderlijk te zijn uitgebracht. Indien dit advies eerder dan een jaar voor de aanvang
      van de terechtzitting is gedagtekend, kan de rechter hiervan slechts gebruik maken met instemming van het openbaar
      ministerie en de verdachte. Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld
      over dit advies.

      4 Het derde lid blijft buiten toepassing, indien de betrokkene weigert medewerking te verlenen aan het onderzoek
      dat ten behoeve van het advies moet worden verricht. Voor zover mogelijk rapporteren de gedragsdeskundigen
      gezamenlijk dan wel een ieder van hen afzonderlijk over de reden van de weigering. De rechter doet zich zoveel
      mogelijk een ander advies of rapport overleggen dat hem over de wenselijkheid of noodzakelijkheid van een last
      als bedoeld in het eerste lid kan voorlichten en aan de totstandkoming waarvan de betrokkene wel bereid is om
      medewerking te verlenen.

      5 Bij het geven van een last als bedoeld in het eerste lid neemt de rechter in aanmerking de inhoud van de overige
      adviezen en rapporten die over de persoonlijkheid van de verdachte zijn uitgebracht, alsmede de ernst van het
      begane feit of de veelvuldigheid van voorafgegane veroordelingen wegens misdrijf.

      6 Indien betrokkene verdacht wordt van een misdrijf dat gericht is tegen of gevaar veroorzaakt voor de
      onaantastbaarheid van het lichaam als bedoeld in [artikel 38e][ref7] van het Wetboek van Strafrecht en hij weigert
      medewerking te verlenen aan enig onderzoek als bedoeld in het vierde lid kan de officier van justitie de voorzitter
      van de multidisciplinaire commissie, bedoeld in het negende lid, gelasten dat die commissie aan hem een advies
      uitbrengt over de aanwezigheid en de bruikbaarheid van persoonsgegevens betreffende een mogelijke gebrekkige
      ontwikkeling of ziekelijke stoornis van de geestvermogens van betrokkene, ten aanzien waarvan de verdachte
      niet bereid is om medewerking te verlenen aan de verstrekking. De leden van de multidisciplinaire commissie
      zijn bevoegd persoonsgegevens, waaronder persoonsgegevens betreffende de gezondheid, op te vragen van artsen en
      gedragsdeskundigen en daarvan kennis te nemen. Op een verzoek van de multidisciplinaire commissie is de arts of
      gedragsdeskundige verplicht de persoonsgegevens van betrokkene aan de multidisciplinaire commissie te verstrekken.
      De multidisciplinaire commissie brengt uiterlijk 30 dagen na de last, bedoeld in de eerste volzin, gemotiveerd
      advies uit aan de officier van justitie over de aanwezigheid en bruikbaarheid van de persoonsgegevens in relatie
      tot de aanwezigheid van een gebrekkige ontwikkeling of ziekelijke stoornis van de geestvermogens tijdens het begaan
      van het feit. Van een last, bedoeld in de eerste volzin, doet de officier van justitie mededeling aan de verdachte,
      onder medezending van het advies van de multidisciplinaire commissie.

      7 De persoonsgegevens van betrokkene die aan de multidisciplinaire commissie zijn verstrekt, kunnen
      uitsluitend worden gebruikt ten behoeve van een rapport of advies als bedoeld in het vijfde lid. Voor de
      toepassing van de eerste volzin behoeft de officier van justitie een schriftelijke machtiging, op diens
      vordering te verlenen door de penitentiaire kamer. Bij deze vordering legt de officier van justitie het advies
      van de multidisciplinaire commissie over. Indien de officier van justitie, op basis van het advies van de
      multidisciplinaire commissie, afziet van het doen van een vordering, doet hij hiervan mededeling aan de verdachte
      en de commissie. In dit artikel wordt onder penitentiaire kamer verstaan: de meervoudige kamer, bedoeld in
      [artikel 67 van de Wet op de rechterlijke organisatie][ref8], in de samenstelling, bedoeld in het derde lid van
      dat artikel.

      8 Alvorens te beslissen, hoort de penitentiaire kamer de verdachte. De penitentiaire kamer kan de voorzitter
      van de multidisciplinaire commissie horen. De penitentiaire kamer doet schriftelijk mededeling van zijn
      beslissing aan de verdachte. De gegevens blijven onder de multidisciplinaire commissie, totdat de penitentiaire
      kamer een onherroepelijke beslissing heeft genomen. Indien de penitentiaire kamer machtiging verleent voor
      het gebruik van de persoonsgegevens, verstrekt de voorzitter van de multidisciplinaire commissie onverwijld
      de persoonsgegevens aan de gedragsdeskundigen, bedoeld in het vierde lid. Binnen negentig dagen na een
      onherroepelijke afwijzende beslissing van de penitentiaire kamer of een mededeling van de officier van justitie
      aan de commissie dat geen vordering wordt gedaan als bedoeld in het zesde lid, worden de persoonsgegevens
      betreffende de gezondheid van betrokkene die de commissie onder zich heeft, vernietigd. Tegen de beschikking
      van de penitentiaire kamer staat voor het openbaar ministerie of de verdachte beroep in cassatie open. De
      [artikelen 446 tot en met 448 van het Wetboek van Strafvordering][ref9] zijn van overeenkomstige toepassing.

      9 Onze Minister stelt een multidisciplinaire commissie in die tot taak heeft te adviseren over de aanwezigheid
      en de bruikbaarheid van persoonsgegevens betreffende de gezondheid. De multidisciplinaire commissie bestaat uit
      een tweetal artsen, onder wie een psychiater, een gedragsdeskundige en een tweetal juristen. De voorzitter van de
      commissie is een arts, die tevens psychiater is. Bij algemene maatregel van bestuur worden regels gesteld over de
      werkwijze, de geheimhouding, en de besluitvorming van de multidisciplinaire commissie, alsmede over de gegevens in
      het advies.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel285
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel285b
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel395
