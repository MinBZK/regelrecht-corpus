        artikel: 24c
  - number: '63'
    text: |-
      Indien iemand, nadat hem een straf is opgelegd, schuldig wordt verklaard aan een misdrijf of een overtreding voor
      die strafoplegging gepleegd, zijn de bepalingen van deze titel voor het geval gelijktijdig straf wordt opgelegd
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel63
  - number: '64'
    text: |-
      Inzake een misdrijf dat alleen op klacht wordt vervolgd, is degene tegen wie het feit is begaan, tot de klacht
      gerechtigd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel64
  - number: '65'
    text: |-
      1 Indien de in [artikel 64][ref1] aangewezen persoon de leeftijd van zestien jaren nog niet heeft bereikt of anders
      dan wegens verkwisting onder curatele is gesteld, dan wel aan een zodanige psychische stoornis, psychogeriatrische
      aandoening of verstandelijke handicap lijdt dat hij niet in staat is te beoordelen of zijn belang gediend is met de
      klacht, geschiedt de klacht door zijn wettige vertegenwoordiger in burgerlijke zaken.

      2 Indien de in [artikel 64][ref2] aangewezen persoon overleden is, zijn tot de klacht gerechtigd: zijn ouders, zijn
      kinderen en zijn overlevende echtgenoot, tenzij blijkt dat hij een vervolging niet heeft gewild.

      3 Indien de klacht tegen de wettige vertegenwoordiger in burgerlijke zaken van de in [artikel 64][ref3] aangewezen
      persoon moet geschieden, zijn tot de klacht gerechtigd: de echtgenoot, een bloedverwant in de rechte linie of, bij
      het ontbreken van al die personen, een broer en een zuster.

      4 Indien een in het tweede of derde lid aangewezen persoon de leeftijd van zestien jaren nog niet heeft bereikt
      of anders dan wegens verkwisting onder curatele is gesteld, dan wel aan een zodanige psychische stoornis,
      psychogeriatrische aandoening of verstandelijke handicap lijdt dat hij niet in staat is te beoordelen of zijn
      belang gediend is met de klacht, kan vervolging plaatsvinden op klacht van diens wettige vertegenwoordiger in
      burgerlijke zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel64
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '64'
      - id: ref2
