        artikel: '28'
  - number: '121'
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van de beide kamers der Staten-Generaal of van een
      van deze uiteenjaagt of tot het nemen of niet nemen van enig besluit dwingt, of een lid, een minister of een
      staatssecretaris uit die vergadering verwijdert of opzettelijk verhindert die bij te wonen of daarin vrij en
      onbelemmerd zijn plicht te vervullen, wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste
      dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel121
  - number: 121a
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van een commissie uit de beide kamers der Staten-
      Generaal of uit een van deze uiteenjaagt of tot het nemen of niet nemen van enig besluit dwingt of een lid, een
      minister of een staatssecretaris uit die vergadering verwijdert of opzettelijk verhindert die bij te wonen of
      daarin vrij en onbelemmerd zijn plicht te vervullen, wordt gestraft met gevangenisstraf van ten hoogste negen jaren
      of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel121a
  - number: '122'
    text: |-
      1 De samenspanning tot het in [artikel 121][ref1] omschreven misdrijf wordt gestraft met gevangenisstraf van ten
      hoogste tien jaren of geldboete van de vijfde categorie.

      2 [Artikel 96, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel96
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '121'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '96'
  - number: '123'
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van de staten van een provincie uiteenjaagt of tot
      het nemen of niet nemen van enig besluit dwingt of een lid, de voorzitter of een gedeputeerde uit die vergadering
      verwijdert of opzettelijk verhindert die bij te wonen of daarin vrij en onbelemmerd zijn plicht te vervullen, wordt
      gestraft met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel123
  - number: 123a
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van een door de staten van een provincie ingestelde
      commissie uiteenjaagt of tot het nemen of niet nemen van enig besluit dwingt of een lid, een gedeputeerde of de
      commissaris van de Koning uit die vergadering verwijdert of opzettelijk verhindert die bij te wonen of daarin vrij
      en onbelemmerd zijn plicht te vervullen, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete
      van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel123a
  - number: '124'
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van de raad van een gemeente uiteenjaagt of tot
      het nemen of niet nemen van enig besluit dwingt of een lid, de voorzitter of een wethouder uit die vergadering
      verwijdert of opzettelijk verhindert die bij te wonen of daarin vrij en onbelemmerd zijn plicht te vervullen, wordt
      gestraft met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel124
  - number: 124a
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van een door de raad van een gemeente ingestelde
      commissie uiteenjaagt of tot het nemen of niet nemen van enig besluit dwingt of een lid, een wethouder of
      de burgemeester uit die vergadering verwijdert of opzettelijk verhindert die bij te wonen of daarin vrij en
      onbelemmerd zijn plicht te vervullen, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete
      van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel124a
  - number: '125'
    text: |-
      Hij die bij gelegenheid van een krachtens wettelijk voorschrift uitgeschreven verkiezing door geweld of bedreiging
      met geweld opzettelijk iemand verhindert zijn of eens anders kiesrecht vrij en onbelemmerd uit te oefenen, wordt
      gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel125
  - number: '126'
    text: |-
      1 Hij die bij gelegenheid van een krachtens wettelijk voorschrift uitgeschreven verkiezing door gift of belofte
      iemand omkoopt om zijn of eens anders kiesrecht hetzij niet, hetzij op bepaalde wijze uit te oefenen, wordt
      gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.

      2 Dezelfde straf wordt toegepast op de kiezer of de gemachtigde van een kiezer die zich door gift of belofte tot
      een of ander laat omkopen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel126
  - number: '127'
    text: |-
      Hij die bij gelegenheid van een krachtens wettelijk voorschrift uitgeschreven verkiezing, enige bedrieglijke
      handeling pleegt waardoor een stem van onwaarde wordt of een ander dan de bij het uitbrengen van de stem bedoelde
      persoon wordt aangewezen, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel127
  - number: '128'
    text: |-
      Hij die opzettelijk zich voor een ander uitgevende, aan een krachtens wettelijk voorschrift uitgeschreven
      verkiezing deelneemt, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel128
  - number: '129'
    text: |-
      Hij die bij gelegenheid van een krachtens wettelijk voorschrift uitgeschreven verkiezing, opzettelijk een
      plaats gehad hebbende stemming verijdelt of enige bedrieglijke handeling pleegt waardoor aan de stemming een
      andere uitslag wordt gegeven dan door de wettig uitgebrachte stemmen zou zijn verkregen, wordt gestraft met
      gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel129
  - number: '130'
    text: |-
      1 Bij veroordeling wegens een der in de [artikelen 121][ref1] en [123][ref2] omschreven misdrijven, kan ontzetting
      van de in [artikel 28, eerste lid, onder 1°-3°][ref3], vermelde rechten worden uitgesproken.

      2 Bij veroordeling wegens een der in de [artikelen 122][ref4], [124][ref5] en [129][ref6] omschreven misdrijven,
      kan ontzetting van de in [artikel 28, eerste lid, onder 3°][ref7], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel123
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel122
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel124
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel129
      [ref7]: https://wetten.overheid.nl/BWBR0001854#Artikel28
