  - number: '138'
    text: |-
      1 Hij die in de woning of het besloten lokaal of erf, bij een ander in gebruik, wederrechtelijk binnendringt of,
      wederrechtelijk aldaar vertoevende, zich niet op de vordering van of vanwege de rechthebbende aanstonds verwijdert,
      wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.

      2 Hij die zich de toegang heeft verschaft door middel van braak of inklimming, van valse sleutels, van een
      valse order of een vals kostuum, of die, zonder voorkennis van de rechthebbende en anders dan ten gevolge van
      vergissing binnengekomen, aldaar wordt aangetroffen in de voor de nachtrust bestemde tijd, wordt geacht te zijn
      binnengedrongen.

      3 Indien hij bedreigingen uit of zich bedient van middelen geschikt om vrees aan te jagen, wordt hij gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.

      4 De in het eerste en derde lid bepaalde gevangenisstraffen kunnen met een derde worden verhoogd, indien twee of
      meer verenigde personen het misdrijf plegen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel138
  - number: 138a
    text: |-
      1 Hij die in een woning of gebouw, waarvan het gebruik door de rechthebbende is beëindigd, wederrechtelijk
      binnendringt of wederrechtelijk aldaar vertoeft, wordt, als schuldig aan kraken, gestraft met gevangenisstraf van
      ten hoogste een jaar of geldboete van de derde categorie.

      2 Indien hij bedreigingen uit of zich bedient van middelen geschikt om vrees aan te jagen, wordt hij gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.

      3 De in het eerste en tweede lid bepaalde gevangenisstraffen kunnen met een derde worden verhoogd, indien twee of
      meer verenigde personen het misdrijf plegen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel138a
  - number: 138aa
    text: |-
      1 Hij die wederrechtelijk verblijft op een in een haven, luchthaven of spoorwegemplacement gelegen besloten plaats
      voor distributie, opslag of overslag van goederen, wordt gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de derde categorie.

      2 De schuldige die zich de toegang tot de in het eerste lid bedoelde plaats heeft verschaft door middel van braak
      of inklimming, van valse sleutels, van een valse order of een vals kostuum, of door middel van een valse of niet
      aan betrokkene toebehorende toegangspas, een valse hoedanigheid of misleiding van een persoon, belast met de
      bewaking van die plaats, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde
      categorie.

      3 De in het eerste en tweede lid bepaalde gevangenisstraf kan met een derde worden verhoogd, indien:

      a. de schuldige zich op de besloten plaats, bedoeld in het eerste lid, de toegang heeft verschaft tot een
      gebouw, ruimte of vervoermiddel bestemd voor de distributie, opslag of overslag van goederen door middel van de
      handelingen, bedoeld in [artikel 138, tweede lid][ref1];

      b. het feit wordt gepleegd door twee of meer verenigde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel138
