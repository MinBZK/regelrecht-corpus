        artikel: '74'
  - number: 74b
    text: |-
      1 Een bevel als bedoeld in [artikel 12k van het Wetboek van Strafvordering][ref1] doet, na voldoening aan de
      overeenkomstig [artikel 74][ref2] gestelde voorwaarden, het recht tot strafvordering herleven als ware het niet
      vervallen geweest.

      2 Na een bevel, als bedoeld in het vorige lid, worden bedragen, betaald in toepassing van
      [artikel 74, tweede lid, onder a, c en d][ref3], onverwijld terugbetaald aan degene die ze heeft betaald.

      3 Volgt na een bevel als bedoeld in het eerste lid een veroordeling, dan houdt de rechter rekening met de afstand
      of uitlevering door de veroordeelde van voorwerpen op grond van [artikel 74, tweede lid, onder b en c][ref4], met
      de vergoeding van schade op grond van artikel 74, tweede lid, onder e, en met de onbetaalde arbeid die is verricht
      of het leerproject dat is gevolgd op grond van artikel 74, tweede lid, onder f.

      4 Eindigt, na een bevel als bedoeld in het eerste lid, de zaak waarbij een voorwaarde is gesteld als bedoeld in
      [artikel 74, tweede lid, onder f][ref5], zonder oplegging van straf of maatregel, dan kan de rechter, op verzoek
      van de gewezen verdachte, deze een vergoeding ten laste van de staat toekennen voor de schade welke hij ten
      gevolge van de verrichtte onbetaalde arbeid of het gevolgde leerproject heeft geleden. Onder schade is begrepen
      het nadeel dat niet in vermogensschade bestaat. De [artikelen 533, derde, vierde en zesde lid][ref6], [534][ref7],
      [535][ref8] en [536 van het Wetboek van Strafvordering][ref9] zijn van overeenkomstige toepassing.


