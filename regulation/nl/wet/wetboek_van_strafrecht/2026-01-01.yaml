  - number: '28'
    text: |-
      1 De rechten waarvan de schuldige, in de bij de wet bepaalde gevallen, bij rechterlijke uitspraak kan worden
      ontzet, zijn:

      1°. het bekleden van ambten of van bepaalde ambten;

      2°. het dienen bij de gewapende macht;

      3°. het recht de leden van algemeen vertegenwoordigende organen te verkiezen en tot lid van deze organen te worden
      verkozen;

      4°. het zijn van raadsman of gerechtelijk bewindvoerder;

      5°. de uitoefening van bepaalde beroepen.

      2 Ontzetting van leden van de rechterlijke macht die, hetzij voor hun leven, hetzij voor een bepaalde tijd, zijn
      aangesteld, of van andere voor hun leven aangestelde ambtenaren, geschiedt, ten opzichte van het ambt waartoe zij
      aldus zijn aangesteld, alleen in de gevallen en op de wijze bij de wet bepaald.

      3 Ontzetting van het recht bedoeld in het eerste lid, onder 3°, kan alleen worden uitgesproken bij veroordeling tot
      gevangenisstraf van ten minste een jaar.

      4 De rechter kan aan een krachtens algemene maatregel van bestuur aangewezen reclasseringsinstelling opdracht geven
      toezicht te houden op de naleving door de veroordeelde van de ontzetting van het recht om ambten of bepaalde ambten
      te bekleden en het recht om bepaalde beroepen uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel28
  - number: '29'
    text: |-
      Ontzetting van het recht om ambten of bepaalde ambten te bekleden en bij de gewapende macht te dienen kan, behalve
      in de gevallen in het Tweede Boek omschreven, worden uitgesproken bij veroordeling wegens enig ambtsmisdrijf of
      wegens enig misdrijf waardoor de schuldige een bijzondere ambtsplicht schond of waarbij hij gebruik maakte van
      macht, gelegenheid of middel hem door zijn ambt geschonken.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel29
  - number: '31'
    text: |-
      1 Wanneer ontzetting van rechten wordt uitgesproken, bepaalt de rechter de duur als volgt:

      1°. bij veroordeling tot levenslange gevangenisstraf, voor het leven;

      2°. bij veroordeling tot tijdelijke gevangenisstraf of tot hechtenis, voor een tijd de duur van de hoofdstraf ten
      minste twee en ten hoogste vijf jaren te boven gaande;

      3°. bij veroordeling tot taakstraf, voor een tijd van ten minste twee en ten hoogste vijf jaren;

      4°. bij veroordeling tot geldboete, voor een tijd van ten minste twee en ten hoogste vijf jaren;

      5°. bij afzonderlijke oplegging, voor een tijd van ten minste twee en ten hoogste vijf jaren.

      2 De ontzetting van het recht vermeld in [artikel 28, eerste lid, onder 3°][ref1], gaat in op de
      dag dat de veroordeling daartoe onherroepelijk is geworden. De ontzetting van een van de andere in
      [artikel 28, eerste lid][ref2], vermelde rechten gaat in op de dag waarop de rechterlijke uitspraak kan worden ten
      uitvoer gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel31
