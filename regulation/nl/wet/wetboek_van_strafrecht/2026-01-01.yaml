  - number: 231a
    text: |-
      1 Hij die biometrische kenmerken of biometrische persoonsgegevens valselijk opmaakt of vervalst met het oogmerk om
      deze als echt en onvervalst te gebruiken of te doen gebruiken in gevallen waarin die kenmerken of persoonsgegevens
      worden gebruikt voor het vaststellen van iemands identiteit, teneinde zijn identiteit te verhelen of de identiteit
      van een ander te verhelen of misbruiken, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete
      van de vijfde categorie.

      2 Met dezelfde straf wordt gestraft hij die in gevallen waarin biometrische kenmerken of biometrische
      persoonsgegevens worden gebruikt voor het vaststellen van iemands identiteit, opzettelijk gebruik maakt van valse
      of vervalste biometrische kenmerken of biometrische persoonsgegevens als waren deze echt en onvervalst met het
      oogmerk om zijn identiteit te verhelen of de identiteit van een ander te misbruiken of opzettelijk gebruik maakt
      van biometrische kenmerken of biometrische persoonsgegevens van een ander met het oogmerk om de verdenking van een
      strafbaar feit op de ander of niet op hem te doen ontstaan.

      3 [Artikel 225, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel225
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel231a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '225'
  - number: 231b
    text: |-
      Hij die opzettelijk en wederrechtelijk identificerende persoonsgegevens, niet zijnde biometrische persoonsgegevens,
      van een ander gebruikt met het oogmerk om zijn identiteit te verhelen of de identiteit van de ander te verhelen
      of misbruiken, waardoor uit dat gebruik enig nadeel kan ontstaan, wordt gestraft met een gevangenisstraf van ten
      hoogste vijf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel231b
  - number: '232'
    text: |-
      1 Hij die opzettelijk een niet-contant betaalinstrument dan wel een voor het publiek beschikbare kaart of een voor
      het publiek beschikbare drager van identificerende persoonsgegevens, bestemd voor het verrichten of verkrijgen van
      andere prestaties dan betalingen langs geautomatiseerde weg, valselijk opmaakt of vervalst, met het oogmerk zich of
      een ander te bevoordelen, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde
      categorie.

      2 Met dezelfde straf wordt gestraft hij die opzettelijk gebruikmaakt van een door misdrijf verkregen, vals of
      vervalst niet-contant betaalinstrument of van een door misdrijf verkregen, valse of vervalste kaart als waren deze
      echt of onvervalst dan wel opzettelijk een zodanig betaalinstrument of zodanige kaart aflevert, voorhanden heeft,
      ontvangt, zich verschaft, vervoert, invoert, uitvoert, verkoopt of overdraagt, terwijl hij weet of redelijkerwijs
      moet vermoeden dat het niet-contante betaalinstrument of de kaart bestemd is voor zodanig gebruik.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel232
  - number: '234'
    text: |-
      1 Hij die stoffen, voorwerpen of gegevens vervaardigt, ontvangt, zich verschaft, verkoopt, overdraagt, verwerft,
      vervoert, invoert, uitvoert, verspreidt, anderszins ter beschikking stelt of voorhanden heeft waarvan hij weet dat
      zij bestemd zijn tot het plegen van een der in de [artikelen 226, eerste lid, onderdelen 2° tot en met 5°][ref1],
      [231, eerste lid][ref2], [231a, eerste lid][ref3], [231b][ref4] en [232, eerste lid][ref5], omschreven misdrijven
      dan wel een der misdrijven omschreven in de [artikelen 310][ref6], [311][ref7], [312][ref8], [317][ref9],
      [321][ref10] en [326][ref11], voor zover deze feiten betrekking hebben op de verkrijging van een niet-contant
      betaalinstrument, wordt gestraft met gevangenisstraf van ten hoogste vier jaar of geldboete van de vierde
      categorie.

      2 [Artikel 225, derde lid][ref12], is van overeenkomstige toepassing.


