  - number: 130a
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 123][ref1] of [124][ref2], is begaan met een terroristisch
      oogmerk, wordt de in deze artikelen bepaalde tijdelijke gevangenisstraf met de helft verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel124
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel130a
