  - number: 77wb
    text: |-
      1 In het vonnis waarbij de maatregel betreffende het gedrag van de jeugdige wordt opgelegd, beveelt de rechter voor
      het geval dat de veroordeelde niet naar behoren aan de tenuitvoerlegging van de maatregel heeft meegewerkt, dat
      vervangende jeugddetentie zal worden toegepast.

      2 De duur van de vervangende jeugddetentie wordt in gehele dagen, weken of maanden vastgesteld. Voor elke maand
      waarvoor de maatregel is opgelegd beloopt de vervangende jeugddetentie maximaal een maand.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel77wb
  - number: 77we
    text: |-
      1 In het vonnis waarbij de vrijheidsbeperkende maatregel wordt opgelegd, beveelt de rechter dat vervangende
      jeugddetentie zal worden toegepast voor het geval niet aan de maatregel wordt voldaan.

      2 De [artikelen 38v][ref1], [38w, tweede tot en met het vierde lid][ref2], en
      [artikel 6:3:10, derde lid, van het Wetboek van Strafvordering][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38v
