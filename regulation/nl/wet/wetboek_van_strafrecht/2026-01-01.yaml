      1 Ten aanzien van de jongvolwassene die ten tijde van het begaan van het strafbaar feit de leeftijd van achttien
      jaren doch nog niet die van drieëntwintig jaren heeft bereikt, kan de rechter, indien hij daartoe grond vindt
