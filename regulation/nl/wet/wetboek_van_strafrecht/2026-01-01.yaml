  - number: 77g
    text: |-
      1 In plaats van de op een feit gestelde straffen worden de straffen en maatregelen opgelegd, in deze Titel
      voorzien.

      2 Een hoofdstraf kan zowel afzonderlijk als tezamen met andere hoofdstraffen of met bijkomende straffen worden
      opgelegd.

      3 Een maatregel kan zowel afzonderlijk als tezamen met hoofdstraffen, met bijkomende straffen en met andere
      maatregelen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel77g
  - number: 77h
    text: |-
      1 De hoofdstraffen zijn:

      a. in geval van misdrijf: jeugddetentie, taakstraf of geldboete;

      b. in geval van overtreding: taakstraf of geldboete.

      2 Een taakstraf bestaat uit:

      a. een werkstraf, zijnde het verrichten van onbetaalde arbeid of het verrichten van arbeid tot herstel van de door
      het strafbare feit aangerichte schade, of

      b. een leerstraf, zijnde het volgen van een leerproject, of

      c. een combinatie van werkstraf en leerstraf.

      3 De bijkomende straffen zijn:

      a. verbeurdverklaring;

      b. ontzegging van de bevoegdheid motorrijtuigen te besturen.

      4 De maatregelen zijn:

      a. plaatsing in een inrichting voor jeugdigen;

      b. maatregel betreffende het gedrag van de jeugdige;

      c. onttrekking aan het verkeer;

      d. ontneming van wederrechtelijk verkregen voordeel;

      e. schadevergoeding;

      f. vrijheidsbeperkende maatregel.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel77h
  - number: 77i
    text: |-
      1 De duur van de jeugddetentie is:

      a. voor degene die ten tijde van het begaan van het misdrijf de leeftijd van zestien jaren nog niet had bereikt:
      ten minste een dag en ten hoogste twaalf maanden, en

      b. overigens ten hoogste vierentwintig maanden.

      2 De duur van de jeugddetentie wordt in de rechterlijke uitspraak aangewezen in dagen, weken of maanden.

      3 [ Artikel 27][ref1] is bij veroordeling tot jeugddetentie van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel27
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel77i
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '27'
  - number: 77l
    text: |-
      1 Het bedrag van de geldboete is ten minste het bedrag, genoemd in [artikel 23, tweede lid][ref1], en ten hoogste
      het maximum van een geldboete van de tweede categorie. [Artikel 24a][ref2] is van overeenkomstige toepassing
      met dien verstande dat de rechter of de officier van justitie bij elke geldboete kan bepalen dat het bedrag in
      gedeelten kan worden voldaan. De rechter of de officier van justitie stelt daarbij de hoogte van elk van die
      gedeelten vast.

      2 De rechter kan bij de uitspraak waarbij geldboete wordt opgelegd, bevelen dat voor het geval volledige betaling
      noch volledig verhaal van het verschuldigde bedrag volgt, vervangende jeugddetentie zal worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel24a
