        artikel: '340'
  - number: '350'
    text: |-
      1 Hij die opzettelijk en wederrechtelijk enig goed dat geheel of ten dele aan een ander toebehoort, vernielt,
      beschadigt, onbruikbaar maakt of wegmaakt, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.

      2 Met gevangenisstraf van ten hoogste vijf jaren of een geldboete van de vijfde categorie wordt gestraft hij
      die opzettelijk en wederrechtelijk een dier dat geheel of ten dele aan een ander toebehoort, doodt, beschadigt,
      onbruikbaar maakt of wegmaakt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel350
  - number: 350a
    text: |-
      1 Hij die opzettelijk en wederrechtelijk gegevens die door middel van een geautomatiseerd werk of door middel van
      telecommunicatie zijn opgeslagen, worden verwerkt of overgedragen, verandert, wist, onbruikbaar of ontoegankelijk
      maakt, dan wel andere gegevens daaraan toevoegt, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.

      2 [Artikel 138b, tweede, derde en vierde lid][ref1], is van overeenkomstige toepassing.

      3 Hij die opzettelijk en wederrechtelijk gegevens ter beschikking stelt of verspreidt die zijn bestemd om schade
      aan te richten in een geautomatiseerd werk, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of
      geldboete van de vijfde categorie.

      4 Niet strafbaar is degeen die het feit, bedoeld in het derde lid, pleegt met het oogmerk om schade als gevolg van
      deze gegevens te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel138b
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel350a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 138b
  - number: 350b
    text: |-
      1 Hij aan wiens schuld te wijten is dat gegevens die door middel van een geautomatiseerd werk of door middel
      van telecommunicatie zijn opgeslagen, worden verwerkt of overgedragen, wederrechtelijk worden veranderd, gewist,
      onbruikbaar of ontoegankelijk gemaakt, dan wel dat andere gegevens daaraan worden toegevoegd, wordt, indien
      daardoor ernstige schade met betrekking tot die gegevens wordt veroorzaakt, gestraft met gevangenisstraf of
      hechtenis van ten hoogste een maand of geldboete van de tweede categorie.

      2 Hij aan wiens schuld te wijten is dat gegevens wederrechtelijk ter beschikking gesteld of verspreid worden die
      zijn bestemd om schade aan te richten in een geautomatiseerd werk, wordt gestraft met gevangenisstraf of hechtenis
      van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel350b
  - number: 350c
    text: |-
      1 Hij die opzettelijk enig geautomatiseerd werk of enig werk voor telecommunicatie vernielt, beschadigt of
      onbruikbaar maakt, stoornis in de gang of in de werking van zodanig werk veroorzaakt, of een ten opzichte van
      zodanig werk genomen veiligheidsmaatregel verijdelt, wordt gestraft met gevangenisstraf van ten hoogste twee jaren
      of geldboete van de vierde categorie, indien daardoor wederrechtelijk verhindering of bemoeilijking van de opslag,
      verwerking of overdracht van gegevens of stoornis in een telecommunicatienetwerk of in de uitvoering van een
      telecommunicatiedienst, ontstaat.

      2 [Artikel 138b, tweede, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel138b
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel350c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 138b
  - number: 350d
    text: |-
      Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft hij die, met het
      oogmerk dat daarmee een misdrijf als bedoeld in [artikel 350a, eerste lid][ref1], of [350c][ref2] wordt gepleegd:

      a. een technisch hulpmiddel dat hoofdzakelijk geschikt gemaakt of ontworpen is tot het plegen van een zodanig
      misdrijf, vervaardigt, ontvangt, zich verschaft, overdraagt, verkoopt, verwerft, vervoert, invoert, uitvoert,
      verspreidt of anderszins ter beschikking stelt of voorhanden heeft, of

      b. een computerwachtwoord, toegangscode of daarmee vergelijkbaar gegeven waardoor toegang kan worden verkregen tot
      een geautomatiseerd werk of een deel daarvan, vervaardigt, verkoopt, verwerft, invoert, verspreidt of anderszins
      ter beschikking stelt of voorhanden heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel350a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel350c
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel350d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 350a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 350c
  - number: '351'
    text: |-
      Hij die spoorweg- of elektriciteitswerken, geautomatiseerde werken of werken voor telecommunicatie, werken dienend
      tot waterkering, waterlozing, gas- of waterleiding of riolering, voor zover deze werken ten algemenen nutte
      gebezigd worden, dan wel goederen of werken ten behoeve van de landsverdediging, opzettelijk en wederrechtelijk
      vernielt, beschadigt, onbruikbaar maakt, onklaar maakt of weg maakt, wordt gestraft met gevangenisstraf van ten
      hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel351
  - number: 351bis
    text: |-
      Hij aan wiens schuld te wijten is dat enig in het vorig artikel bedoeld goed of werk, vernield, beschadigd,
      onbruikbaar gemaakt, onklaar gemaakt of weggemaakt wordt, wordt gestraft met hechtenis van ten hoogste een maand of
      geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel351bis
  - number: '352'
    text: |-
      Hij die opzettelijk en wederrechtelijk enig gebouw, vaartuig of zijn lading, installatie ter zee of luchtvaartuig
      dat geheel of ten dele aan een ander toebehoort, vernielt, beschadigt, onbruikbaar maakt of onklaar maakt, wordt
      gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel352
  - number: '353'
    text: |-
      De bepaling van [artikel 316][ref1] is op de in deze titel omschreven misdrijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel316
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel353
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '316'
  - number: '354'
    text: |-
      Indien een der in deze titel omschreven misdrijven arglistig gepleegd wordt, of daarvan levensgevaar voor een ander
      is te duchten, kan de gevangenisstraf met een derde worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel354
  - number: 354a
    text: |-
      1 Indien een der in de [artikelen 350][ref1], [350a][ref2], [350c][ref3], [351][ref4], [352][ref5] en [354][ref6]
      omschreven feiten wordt gepleegd met het oogmerk om een terroristisch misdrijf voor te bereiden of gemakkelijk te
      maken, wordt de op het feit gestelde gevangenisstraf met een derde verhoogd.

      2 Indien een feit strafbaar gesteld in de [artikelen 350][ref7], [350a][ref8], [350c][ref9], [351][ref10],
      [352][ref11] of [354][ref12] is begaan met een terroristisch oogmerk, wordt de op het feit gestelde gevangenisstraf
      met de helft verhoogd.


