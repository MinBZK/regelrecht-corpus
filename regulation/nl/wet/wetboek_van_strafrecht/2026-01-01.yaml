  - number: 77w
    text: |-
      1 De maatregel betreffende het gedrag van de jeugdige kan slechts worden opgelegd, indien:

      a. de ernst van het begane misdrijf of de veelvuldigheid van de begane misdrijven of voorafgegane veroordelingen
      wegens misdrijf hiertoe aanleiding geven, en

      b. de maatregel in het belang is van een zo gunstig mogelijke verdere ontwikkeling van de verdachte.

      2 De rechter legt de maatregel slechts op, nadat hij zich een met redenen omkleed, gedagtekend en ondertekend
      advies heeft doen overleggen van de raad voor de kinderbescherming, dat wordt ondersteund door ten minste een
      gedragsdeskundige. Indien dit advies eerder dan een jaar voor de aanvang van de terechtzitting is gedagtekend
      kan de rechter hier slechts gebruik van maken met instemming van het openbaar ministerie en de verdachte. Indien
      de maatregel met toepassing van [artikel 77c][ref1] wordt opgelegd aan een jongvolwassene die ten tijde van
      het misdrijf of de misdrijven die voor het opleggen van de maatregel aanleiding geeft of geven, de leeftijd van
      achttien jaren maar nog niet de leeftijd van drieëntwintig jaren heeft bereikt, kan een advies van de raad voor de
      kinderbescherming achterwege blijven en wordt met een advies van een gedragsdeskundige volstaan.

      3 De rechter geeft in zijn uitspraak aan waar de maatregel uit bestaat. De maatregel kan inhouden dat de
      veroordeelde aan een programma deelneemt in een door de rechter aan te wijzen instelling of dat de veroordeelde een
      ambulant programma zal volgen onder begeleiding van een door de rechter aan te wijzen organisatie.

      4 De rechter kan, ter ondersteuning van het programma, bedoeld in het derde lid, bevelen dat de veroordeelde
      gedurende de nacht in een inrichting als bedoeld in de Beginselenwet justitiële jeugdinrichtingen verblijft.

      5 Aan het programma kan elektronisch toezicht worden verbonden.

      6 De rechter kan bij zijn uitspraak, ambtshalve of op vordering van het openbaar ministerie, bevelen dat het
      programma dadelijk uitvoerbaar is, indien er ernstig rekening mee moet worden gehouden dat de veroordeelde opnieuw
      een strafbaar feit zal plegen of zich belastend zal gedragen en de dadelijke uitvoerbaarheid in het belang van de
      jeugdige is.

      7 Het bevel, bedoeld in het zesde lid, kan door de rechter die kennisneemt van het hoger beroep, ambtshalve, op
      verzoek van de veroordeelde of op vordering van het openbaar ministerie, worden opgeheven.

      8 De maatregel wordt opgelegd voor de tijd van ten minste zes maanden en ten hoogste een jaar.

      9 De maatregel eindigt van rechtswege bij het onherroepelijk worden van een rechterlijke uitspraak waarbij de
      verdachte opnieuw de maatregel of de maatregel plaatsing in een inrichting voor jeugdigen wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77c
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel77w
