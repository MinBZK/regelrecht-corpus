  - number: '84'
    text: |-
      1 Onder ambtenaren worden begrepen leden van algemeen vertegenwoordigende organen.

      2 Onder ambtenaren en onder rechters worden begrepen scheidsrechters; onder rechters zij die administratieve
      rechtsmacht oefenen.

      3 Allen die tot de gewapende macht behoren worden mede als ambtenaar beschouwd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel84
  - number: 84bis
    text: Onder koopman wordt verstaan ieder die een bedrijf uitoefent.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel84bis
  - number: '85'
    text: |-
      1 Onder schipper wordt verstaan elke gezagvoerder van een vaartuig of die deze vervangt.

      2 Opvarenden zijn allen die zich aan boord bevinden, met uitzondering van de schipper.

      3 Schepelingen zijn allen die zich als scheepsofficieren of scheepsgezellen aan boord bevinden.

      4 Vaartuigen in aanbouw noch schepen in aanbouw worden als vaartuigen of schepen aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel85
  - number: '86'
    text: |-
      Onder Nederlandse schepen worden alleen verstaan die vaartuigen die op grond van voor Nederland geldende
      rechtsregels gerechtigd zijn de vlag van het Koninkrijk te voeren.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel86
  - number: 86a
    text: |-
      1 Onder Nederlandse luchtvaartuigen worden verstaan:

      a. luchtvaartuigen die zijn ingeschreven in Nederlandse luchtvaartuigregisters;

      b. luchtvaartuigen die zonder bemanning zijn verhuurd aan een huurder die de hoofdzetel van zijn bedrijf, of,
      indien de huurder niet een zodanige zetel heeft, zijn vaste verblijfplaats, in Nederland heeft.

      2 Een luchtvaartuig is in vlucht van het moment af waarop alle buitendeuren, na het instappen, zijn gesloten tot
      het moment waarop een van de deuren wordt geopend voor het uitstappen. In geval van een noodlanding wordt de vlucht
      geacht voort te duren, totdat de bevoegde autoriteiten de verantwoordelijkheid voor het luchtvaartuig en voor de
      personen en goederen aan boord overnemen.

      3 Een luchtvaartuig is in bedrijf van het begin van het gereedmaken van dat luchtvaartuig voor een bepaalde
      vlucht door het grondpersoneel of door de bemanning tot het moment dat sedert de landing vierentwintig uren zijn
      verstreken. De periode tijdens welke het luchtvaartuig in bedrijf is strekt zich in elk geval uit tot de gehele
      periode tijdens welke het luchtvaartuig in vlucht is, zoals omschreven in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel86a
  - number: 86b
    text: |-
      Voor de toepassing van [Titel I van dit Boek][ref1] wordt onder het hebben van een vaste woon- of verblijfplaats
      in Nederland verstaan het rechtmatig verblijven in Nederland gedurende een onafgebroken periode van vijf jaar of
      langer.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel86b
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: '87'
    text: |-
      1 Onder vijand worden begrepen opstandelingen.

      2 Onder oorlog wordt begrepen burgeroorlog.

      3 Onder tijd van oorlog wordt begrepen de tijd waarin oorlog dreigende is. Tijd van oorlog wordt mede geacht te
      bestaan zodra dienstplichtigen buitengewoon in werkelijke dienst worden opgeroepen en zolang zij buitengewoon in
      werkelijke dienst worden gehouden.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel87
  - number: 87a
    text: |-
      Onder een bevriende staat wordt verstaan een buitenlandse mogendheid waarmede Nederland niet in een gewapend
      conflict is gewikkeld.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel87a
  - number: 87b
    text: |-
      1 Onder internationaal beschermd persoon wordt verstaan een persoon vallende onder de omschrijving van artikel
      1, eerste lid, van het Verdrag inzake de voorkoming en bestraffing van misdrijven tegen internationaal beschermde
      personen, met inbegrip van diplomaten van 14 december 1973 (*Trb.* 1981, 69).

      2 Onder internationaal beschermd persoon wordt mede verstaan een persoon vallende onder de omschrijving van artikel
      1, onderdeel a of b, van het Verdrag inzake de veiligheid van VN-personeel en geassocieerd personeel van 9 december
      1994 (Trb. 1996, 62), zoals aangevuld door het Facultatief Protocol van 8 december 2005 ( *Trb.* 2006, 211).

      3 Onder beschermde goederen worden verstaan de goederen bedoeld in artikel 2, eerste lid, onder b, van het in het
      eerste lid genoemde verdrag en artikel 9, eerste lid, onderdeel b, van het in het tweede lid genoemde verdrag.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel87b
  - number: '88'
    text: |-
      Onder maand wordt verstaan een tijd van dertig dagen, onder dag, behoudens voor de toepassing van de
      [Algemene termijnenwet][ref1], een tijd van vierentwintig uren.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '89'
    text: |-
      Onder inklimming wordt begrepen ondergraving, alsmede het overschrijden van sloten of grachten tot afsluiting
      dienende.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel89
  - number: '90'
    text: Onder valse sleutels worden begrepen alle tot opening van het slot niet bestemde werktuigen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel90
  - number: 90bis
    text: |-
      1 Onder opkoper wordt verstaan hij die van opkopen een beroep of een gewoonte maakt.

      2 Onder opkopen worden begrepen alle handelingen, hoe ook genaamd, waarmede kennelijk hetzelfde wordt beoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel90bis
  - number: 90ter
    text: |-
      1 Onder electriciteitswerken worden verstaan werken dienende tot voortbrenging, geleiding, transformatie of
      levering van electriciteit en daarmede in verband staande beveiligings-, bevestigings-, ondersteunings- en
      waarschuwingswerken.

      2 Onder electriciteitswerken worden niet begrepen telegraaf- en telefoonwerken.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel90ter
  - number: 90quater
    text: |-
      1 Onder discriminatie of discrimineren wordt verstaan elke vorm van onderscheid, elke uitsluiting, beperking of
      voorkeur, die ten doel heeft of ten gevolge kan hebben dat de erkenning, het genot of de uitoefening op voet van
      gelijkheid van de rechten van de mens en de fundamentele vrijheden op politiek, economisch, sociaal of cultureel
      terrein of op andere terreinen van het maatschappelijk leven, wordt teniet gedaan of aangetast.

      2 Onder discriminatoir oogmerk wordt verstaan het oogmerk om haat tegen of discriminatie van een groep mensen
      wegens hun ras, hun godsdienst of levensovertuiging, hun geslacht, hun seksuele gerichtheid of hun handicap tot
      uitdrukking te brengen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel90quater
  - number: 90quinquies
    text: |-
      Onder instelling voor verpleging van ter beschikking gestelden wordt verstaan een instelling bedoeld in
      [artikel 1.1, onderdeel g, van de Wet forensische zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel90quinquies
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '1.1'
  - number: 90sexies
    text: |-
      Onder psychiatrisch ziekenhuis wordt verstaan:

      1o. een accommodatie als bedoeld in
      [artikel 1:1, eerste lid, onderdeel b, van de Wet verplichte geestelijke gezondheidszorg][ref1];

      2o. een accommodatie als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____________.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel90sexies
    references:
      - id: ref1
        bwb_id: BWBR0040635
        artikel: 1:1
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '1'
  - number: 90septies
    text: Onder psychiater wordt verstaan een arts die bevoegd is de titel van psychiater of zenuwarts te voeren.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel90septies
  - number: 90octies
    text: |-
      Waar van huwelijk of echtgenoot wordt gesproken wordt, met uitzondering van [artikel 449][ref1], daaronder mede
      begrepen geregistreerd partnerschap dan wel geregistreerde partner.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel449
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel90octies
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '449'
  - number: 90novies
    text: |-
      1 Onder geweldsinstructie wordt verstaan de bij of krachtens de [Politiewet 2012][ref1] en de
      [Wet op de bijzondere opsporingsdiensten][ref2] gegeven algemeen verbindende voorschriften die tot de ambtenaar
      gerichte instructies bevatten omtrent het gebruik van geweld.

      2 Met het eerste lid worden gelijkgesteld de voorschriften die tot de ambtenaar gerichte instructies bevatten
      omtrent het gebruik van geweld die gelden in het land waarin de ambtenaar op dat moment op door het volkenrecht
      toegelaten wijze zijn bediening uitoefent.

      3 Met het eerste lid worden gelijkgesteld de algemeen verbindende voorschriften die tot de persoon in de openbare
      dienst van een vreemde staat, die in Nederland op door het volkenrecht toegelaten wijze zijn bediening uitoefent,
      gerichte instructies bevatten omtrent het gebruik van geweld.


      [ref1]: https://wetten.overheid.nl/BWBR0031788
      [ref2]: https://wetten.overheid.nl/BWBR0019919
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel90novies
    references:
      - id: ref1
        bwb_id: BWBR0031788
      - id: ref2
        bwb_id: BWBR0019919
  - number: '91'
    text: |-
      De bepalingen van de Titels I-VIII A van dit Boek zijn ook toepasselijk op feiten waarop bij andere wetten of
      verordeningen straf is gesteld, tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel91
  - number: '92'
    text: |-
      De aanslag ondernomen met het oogmerk om de Koning, de regerende Koningin of de Regent van het leven of de vrijheid
      te beroven of tot regeren ongeschikt te maken, wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten
      hoogste dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel92
  - number: '93'
    text: |-
      De aanslag ondernomen met het oogmerk om het Rijk geheel of gedeeltelijk onder vreemde heerschappij te brengen of
      om een deel daarvan af te scheiden, wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste
      dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel93
  - number: '94'
    text: |-
      De aanslag ondernomen met het oogmerk om de grondwettige regeringsvorm of de orde van troonopvolging te vernietigen
      of op onwettige wijze te veranderen, wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste
      dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel94
  - number: '95'
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van de regeringsraad uiteenjaagt, tot het nemen of
      niet nemen van enig besluit dwingt, een lid uit die vergadering verwijdert of opzettelijk een lid verhindert die
      vergadering bij te wonen of daarin vrij en onbelemmerd zijn plicht te vervullen, wordt gestraft met levenslange
      gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel95
  - number: 95a
    text: |-
      Hij die door geweld of bedreiging met geweld een vergadering van de raad van ministers uiteenjaagt, tot het nemen
      of niet nemen van enig besluit dwingt, een lid uit die vergadering verwijdert of opzettelijk een lid verhindert
      die vergadering bij te wonen of daarin vrij en onbelemmerd zijn plicht te vervullen, wordt gestraft met levenslange
      gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel95a
  - number: '96'
    text: |-
      1 De samenspanning tot een der in de [artikelen 92-95a][ref1] omschreven misdrijven wordt gestraft met
      gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie.

      2 Dezelfde straf is toepasselijk op hem die, met het oogmerk om een der in de [artikelen 92-95a][ref2] omschreven
      misdrijven voor te bereiden of te bevorderen:

      1°. een ander tracht te bewegen om het misdrijf te plegen, te doen plegen of mede te plegen, om daarbij behulpzaam
      te zijn of om daartoe gelegenheid, middelen of inlichtingen te verschaffen;

      2°. gelegenheid, middelen of inlichtingen tot het plegen van het misdrijf zich of anderen tracht te verschaffen;

      3°. voorwerpen voorhanden heeft waarvan hij weet dat zij bestemd zijn tot het plegen van het misdrijf;

      4°. plannen voor de uitvoering van het misdrijf, welke bestemd zijn om aan anderen te worden medegedeeld, in
      gereedheid brengt of onder zich heeft;

      5°. enige maatregel van regeringswege genomen om de uitvoering van het misdrijf te voorkomen of te onderdrukken,
      tracht te beletten, te belemmeren of te verijdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel92
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '92'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '92'
  - number: '97'
    text: |-
      1 Hij die met een buitenlandse mogendheid in verbinding treedt, met het oogmerk om haar tot het plegen van
      vijandelijkheden of het voeren van oorlog tegen de staat te bewegen, haar in het daartoe opgevatte voornemen
      te versterken, haar daarbij hulp toe te zeggen of bij de voorbereiding hulp te verlenen, wordt gestraft met
      levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie.

      2 Handelingen gepleegd ter voorbereiding van een misdrijf als omschreven in het voorgaande lid, worden gestraft met
      gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel97
  - number: 97a
    text: |-
      Hij die met een in het buitenland gevestigd persoon of lichaam in verbinding treedt met het oogmerk om een zodanig
      persoon of lichaam tot het verschaffen van steun aan het voorbereiden, bevorderen of teweegbrengen van omwenteling
      te bewegen, om een zodanig persoon of lichaam in het daartoe opgevatte voornemen te versterken of aan een zodanig
      persoon of lichaam daarbij hulp toe te zeggen of te verlenen, of om omwenteling voor te bereiden, te bevorderen
      of teweeg te brengen, wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel97a
  - number: 97b
    text: |-
      Met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie wordt gestraft:

      1°. hij die enig voorwerp invoert dat geschikt is tot het verschaffen van stoffelijke steun aan het voorbereiden,
      bevorderen of teweegbrengen van omwenteling, indien hij weet of ernstige reden heeft om te vermoeden dat het
      daartoe bestemd is;

      2°. hij die enig voorwerp onder zich heeft of tot onderwerp van een overeenkomst maakt dat geschikt is tot het
      verschaffen van stoffelijke steun aan het voorbereiden, bevorderen of teweegbrengen van omwenteling, indien hij
      weet of ernstige reden heeft om te vermoeden, dat het daartoe bestemd is en dat het voorwerp of enig ander voorwerp
      waarvoor het in de plaats is getreden, hetzij met die bestemming is ingevoerd, hetzij door of vanwege een in het
      buitenland gevestigd persoon of lichaam daartoe is bestemd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel97b
  - number: '98'
    text: |-
      1 Hij die een inlichting waarvan de geheimhouding door het belang van de staat of van zijn bondgenoten wordt
      geboden, een voorwerp waaraan een zodanige inlichting kan worden ontleend, of zodanige gegevens opzettelijk
      verstrekt aan of ter beschikking stelt van een tot kennisneming daarvan niet gerechtigd persoon of lichaam, wordt,
      indien hij weet of redelijkerwijs moet vermoeden dat het een zodanige inlichting, een zodanig voorwerp of zodanige
      gegevens betreft, gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.

      2 Met dezelfde straf wordt gestraft hij die een inlichting die van een verboden plaats afkomstig is en tot de
      veiligheid van de staat of van zijn bondgenoten in betrekking staat, een voorwerp waaraan een zodanige inlichting
      kan worden ontleend, of zodanige gegevens opzettelijk verstrekt aan of ter beschikking stelt van een tot
      kennisneming daarvan niet gerechtigd persoon of lichaam, indien hij weet of redelijkerwijs moet vermoeden dat het
      een zodanige inlichting, een zodanig voorwerp of zodanige gegevens betreft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel98
  - number: 98a
    text: |-
      1 Hij die een inlichting, een voorwerp of gegevens als bedoeld in [artikel 98][ref1], hetzij opzettelijk openbaar
      maakt, hetzij zonder daartoe gerechtigd te zijn opzettelijk verstrekt aan of ter beschikking stelt van een
      buitenlandse mogendheid, een in het buitenland gevestigd persoon of lichaam, dan wel een zodanig persoon of lichaam
      dat gevaar ontstaat dat de inlichting of de gegevens aan een buitenlandse mogendheid of aan een in het buitenland
      gevestigd persoon of lichaam bekend wordt, wordt, indien hij weet of redelijkerwijs moet vermoeden dat het een
      zodanige inlichting of zodanige gegevens betreft, gestraft met gevangenisstraf van ten hoogste vijftien jaren of
      geldboete van de vijfde categorie.

      2 Indien de schuldige heeft gehandeld in tijd van oorlog dan wel in dienst of in opdracht van een buitenlandse
      mogendheid of van een in het buitenland gevestigd persoon of lichaam, kan levenslange gevangenisstraf of tijdelijke
      van ten hoogste dertig jaren of geldboete van de vijfde categorie worden opgelegd.

      3 Handelingen gepleegd ter voorbereiding van een misdrijf als omschreven in de voorgaande leden worden gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel98
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel98a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '98'
  - number: 98b
    text: |-
      Hij aan wiens schuld te wijten is dat een inlichting, een voorwerp of gegevens als bedoeld in [artikel 98][ref1],
      openbaar worden gemaakt of ter beschikking komt van een tot kennisneming daarvan niet gerechtigd persoon of
      lichaam, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel98
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel98b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '98'
  - number: 98c
    text: |-
      1 Met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie wordt gestraft:

      1°. hij die opzettelijk een inlichting, een voorwerp of gegevens als bedoeld in [artikel 98][ref1], zonder daartoe
      gerechtigd te zijn, onder zich neemt of houdt;

      2°. hij die enige handeling verricht, ondernomen met het oogmerk om, zonder daartoe gerechtigd te zijn, de
      beschikking te krijgen over een inlichting, een voorwerp of gegevens als bedoeld in [artikel 98][ref2];

      3°. hij die tersluik, onder een vals voorgeven, door middel van een vermomming of langs een andere dan de gewone
      toegang op of in een verboden plaats komt of tracht te komen, aldaar in dier voege aanwezig is, of zich op een van
      die wijzen of door een van die middelen vandaar verwijdert of tracht te verwijderen.

      2 De bepaling onder 3° is niet toepasselijk, indien de rechter blijkt dat de dader niet heeft gehandeld met het
      oogmerk bedoeld onder 2°.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel98
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel98c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '98'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '98'
  - number: 98d
    text: |-
      1 Met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie wordt gestraft hij die,
      wetende dat daarvan gevaar is te duchten voor de veiligheid van de staat, van zijn bondgenoten of van een
      volkenrechtelijke organisatie, voor de vitale infrastructuur, voor de integriteit en exclusiviteit van hoogwaardige
      technologieën, of voor de veiligheid van een of meer personen, opzettelijk in heimelijke betrokkenheid met een
      buitenlandse mogendheid

      1°. schadetoebrengende handelingen verricht ten behoeve van die buitenlandse mogendheid; of

      2°. aan die buitenlandse mogendheid onmiddellijk of middellijk inlichtingen, een voorwerp of gegevens verstrekt.

      2 Met dezelfde straf wordt gestraft hij die een ander beweegt tot de in het eerste lid bedoelde handelingen.

      3 Gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie wordt opgelegd indien het feit:

      a. in tijd van oorlog is gepleegd;

      b. zwaar lichamelijk letsel of de dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel98d
  - number: '99'
    text: |-
      Hij die een hem van regeringswege opgedragen onderhandeling met een buitenlandse mogendheid opzettelijk ten nadele
      van de staat voert, wordt gestraft met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel99
  - number: '100'
    text: |-
      Met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie wordt gestraft:

      1°. hij die, in geval van een oorlog waarin Nederland niet betrokken is, opzettelijk enige handeling verricht
      waardoor het gevaar ontstaat dat de staat in een oorlog wordt betrokken, of enig van regeringswege gegeven en
      bekendgemaakt bijzonder voorschrift tot handhaving van het niet deelnemen aan de oorlog opzettelijk overtreedt;

      2°. hij die, in tijd van oorlog, enig voorschrift van regeringswege in het belang van de veiligheid van de staat
      gegeven en bekendgemaakt, opzettelijk overtreedt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel100
  - number: '101'
    text: |-
      De Nederlander die in het vooruitzicht van een oorlog met een buitenlandse mogendheid vrijwillig bij deze
      mogendheid in krijgsdienst treedt, wordt, indien de oorlog uitbreekt, gestraft met gevangenisstraf van ten hoogste
      vijftien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel101
  - number: '102'
    text: |-
      Met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie
      wordt gestraft hij die opzettelijk, in tijd van oorlog, de vijand hulp verleent of de staat tegenover de vijand
      benadeelt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel102
  - number: '103'
    text: |-
      De samenspanning tot het in [artikel 102][ref1] omschreven misdrijf wordt gestraft met gevangenisstraf van ten
      hoogste tien jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel102
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '102'
  - number: 103a
    text: |-
      Niet strafbaar is hij die een der in de [artikelen 102][ref1] en [103][ref2] omschreven misdrijven heeft begaan in
      de redelijke overtuiging het Nederlandse belang niet te schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel103
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel103a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '102'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '103'
  - number: '104'
    text: |-
      Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie wordt gestraft hij die, in tijd
      van oorlog, zonder oogmerk om de vijand hulp te verlenen of de staat tegenover de vijand te benadelen, opzettelijk:

      1°. een verspieder van de vijand opneemt, verbergt of voorthelpt;

      2°. desertie van een krijgsman, in dienst van het Rijk, teweegbrengt of bevordert.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel104
  - number: '105'
    text: |-
      1 Hij die, in tijd van oorlog, enige bedrieglijke handeling pleegt bij levering van benodigdheden ten dienste
      van de krijgsmacht, wordt gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde
      categorie.

      2 Met dezelfde straf wordt gestraft hij die, met het opzicht over de levering van de goederen belast, de
      bedrieglijke handeling opzettelijk toelaat.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel105
  - number: '106'
    text: |-
      1 Bij veroordeling wegens het in [artikel 92][ref1] omschreven misdrijf, kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°-4°][ref2], vermelde rechten worden uitgesproken.

      2 Bij veroordeling wegens een der in de [artikelen 93-103][ref3] omschreven misdrijven, kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°-3°][ref4], vermelde rechten worden uitgesproken.

      3 Bij veroordeling wegens het in [artikel 105][ref5] omschreven misdrijf, kan de schuldige
      worden ontzet van de uitoefening van het beroep waarin hij het misdrijf begaan heeft en van de in
      [artikel 28, eerste lid, onder 1°-4°][ref6], vermelde rechten, en kan openbaarmaking van de rechterlijke
      uitspraak worden gelast.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel93
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel105
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '92'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '93'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '28'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '105'
      - id: ref6
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '107'
    text: |-
      De straffen gesteld op de in de [artikelen 102-105][ref1] omschreven feiten, zijn toepasselijk indien een van die
      feiten wordt gepleegd tegen of met betrekking tot de bondgenoten van de staat in een gemeenschappelijke oorlog.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel102
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '102'
  - number: 107a
    text: |-
      De [artikelen 100, onder 2°][ref1], en [101-107][ref2] vinden overeenkomstige toepassing in geval van een gewapend
      conflict dat niet als oorlog kan worden aangemerkt en waarbij Nederland is betrokken, hetzij ter individuele of
      collectieve zelfverdediging, hetzij tot herstel van internationale vrede en veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel101
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '100'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '101'
  - number: '108'
    text: |-
      1 De aanslag op het leven of de vrijheid van de echtgenoot van de Koning, van de vermoedelijke opvolger van de
      Koning, of van diens echtgenoot, wordt gestraft met gevangenisstraf van ten hoogste vijftien jaren of geldboete van
      de vijfde categorie.

      2 Indien de aanslag op het leven de dood ten gevolge heeft of met voorbedachten rade wordt ondernomen, wordt
      levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren opgelegd of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel108
  - number: '109'
    text: |-
      Elke feitelijke aanranding van de persoon van de Koning die niet valt in een zwaardere strafbepaling wordt gestraft
      met gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel109
  - number: '110'
    text: |-
      Elke feitelijke aanranding van de persoon van de echtgenoot van de Koning, van de vermoedelijke opvolger van de
      Koning, van diens echtgenoot, of van de Regent die niet valt in een zwaardere strafbepaling wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel110
  - number: '114'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 108][ref1], [109][ref2] en [110][ref3] omschreven misdrijven kan
      ontzetting van de in [artikel 28, eerste lid, onder 1°-4°][ref4], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel109
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel110
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '108'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '109'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '110'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 114a
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 108, eerste lid][ref1], [109][ref2] of [110][ref3], is begaan
      met een terroristisch oogmerk, wordt de in dat artikel bepaalde tijdelijke gevangenisstraf met de helft verhoogd en
      wordt, indien op het misdrijf een tijdelijke gevangenisstraf van ten hoogste vijftien jaren is gesteld, levenslange
      gevangenisstraf of tijdelijke van ten hoogste dertig jaren opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel109
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel110
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel114a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '108'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '109'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '110'
  - number: 114b
    text: |-
      1 De samenspanning tot de in [artikel 108][ref1] omschreven misdrijven, te begaan met een terroristisch oogmerk,
      wordt gestraft met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie.

      2 [Artikel 96, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel96
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel114b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '108'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '96'
  - number: '115'
    text: |-
      1 De aanslag op het leven of de vrijheid van een hoofd van een bevriende staat wordt gestraft met gevangenisstraf
      van ten hoogste vijftien jaren of geldboete van de vijfde categorie.

      2 Indien de aanslag op het leven de dood ten gevolge heeft of met voorbedachten rade wordt ondernomen, wordt
      levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel115
  - number: '116'
    text: |-
      Elke feitelijke aanranding van de persoon van een hoofd van een bevriende staat, die niet valt in een zwaardere
      strafbepaling, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel116
  - number: '117'
    text: |-
      1 De aanslag op het leven of de vrijheid van een internationaal beschermd persoon wordt gestraft met
      gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.

      2 Indien de aanslag op het leven de dood ten gevolge heeft of met voorbedachte rade wordt ondernomen, wordt
      levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren opgelegd of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel117
  - number: 117a
    text: |-
      Elke feitelijke aanranding van de persoon van een internationaal beschermd persoon, die niet valt in een zwaardere
      strafbepaling, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel117a
  - number: 117b
    text: |-
      Hij die opzettelijk geweld pleegt tegen de beschermde goederen van een internationaal beschermd persoon
      wordt, indien daardoor gevaar voor de veiligheid of de vrijheid van die persoon te duchten is, gestraft met
      gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel117b
  - number: '120'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 115][ref1] en [116][ref2] omschreven misdrijven, kan ontzetting
      van de in [artikel 28, eerste lid, onder 1°-4°][ref3], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel116
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '115'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '116'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 120a
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 115, eerste lid][ref1], [116][ref2], [117, eerste lid][ref3],
      [117a][ref4] of [117b][ref5], is begaan met een terroristisch oogmerk, wordt de in dat artikel bepaalde tijdelijke
      gevangenisstraf met de helft verhoogd en wordt, indien op het misdrijf een tijdelijke gevangenisstraf van ten
      hoogste vijftien jaren is gesteld, levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel116
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel117
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel117a
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel117b
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel120a
