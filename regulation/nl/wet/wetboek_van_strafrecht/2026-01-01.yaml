    text: |-
      1 Met gevangenisstraf van ten hoogste drie maanden of geldboete van de derde categorie wordt gestraft hij die, met
      het oogmerk een gesprek dat elders dan in een woning, besloten lokaal of erf wordt gevoerd af te luisteren of op te
      nemen, dat gesprek met een technisch hulpmiddel heimelijk:

      1°. anders dan in opdracht van een deelnemer aan dat gesprek afluistert;

      2°. zonder deelnemer aan dat gesprek te zijn en anders dan in opdracht van zulk een deelnemer opneemt.

      2 [Artikel 139a, tweede lid, onder 1° en 3°][ref1], is van overeenkomstige toepassing.


