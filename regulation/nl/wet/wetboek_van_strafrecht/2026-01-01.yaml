  - number: '18'
    text: |-
      1 De duur van de hechtenis is ten minste een dag en ten hoogste een jaar.

      2 Zij kan voor ten hoogste een jaar en vier maanden worden opgelegd in de gevallen waarin wegens strafverhoging
      ter zake van samenloop, herhaling van misdrijf of het bepaalde bij [artikel 44][ref1], de tijd van een jaar wordt
      overschreden.

      3 Zij kan in geen geval de tijd van een jaar en vier maanden te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel44
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel18
