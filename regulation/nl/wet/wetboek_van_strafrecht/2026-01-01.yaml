  - number: '39'
    text: |-
      Niet strafbaar is hij die een feit begaat, dat hem wegens de psychische stoornis, psychogeriatrische aandoening of
      verstandelijke handicap niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel39
  - number: '40'
    text: Niet strafbaar is hij die een feit begaat waartoe hij door overmacht is gedrongen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel40
  - number: '41'
    text: |-
      1 Niet strafbaar is hij die een feit begaat, geboden door de noodzakelijke verdediging van eigen of eens anders
      lijf, eerbaarheid of goed tegen ogenblikkelijke, wederrechtelijke aanranding.

      2 Niet strafbaar is de overschrijding van de grenzen van noodzakelijke verdediging, indien zij het onmiddellijk
      gevolg is geweest van een hevige gemoedsbeweging, door de aanranding veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel41
  - number: '42'
    text: |-
      1 Niet strafbaar is hij die een feit begaat ter uitvoering van een wettelijk voorschrift.

      2 Niet strafbaar is de ambtenaar die in de rechtmatige uitoefening van zijn taak en in overeenstemming met zijn
      geweldsinstructie geweld gebruikt.

      3 Met een ambtenaar wordt gelijkgesteld een persoon in de openbare dienst van een vreemde staat die in Nederland op
      door het volkenrecht toegelaten wijze zijn bediening uitoefent.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel42
  - number: '43'
    text: |-
      1 Niet strafbaar is hij die een feit begaat ter uitvoering van een ambtelijk bevel, gegeven door het daartoe
      bevoegde gezag.

      2 Een onbevoegd gegeven ambtelijk bevel heft de strafbaarheid niet op, tenzij het door de ondergeschikte te goeder
      trouw als bevoegd gegeven werd beschouwd en de nakoming daarvan binnen de kring van zijn ondergeschiktheid was
      gelegen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel43
  - number: 43a
    text: |-
      De op een misdrijf gestelde tijdelijke gevangenisstraf of hechtenis kan, onverminderd [artikel 10][ref1], met
      een derde worden verhoogd indien tijdens het plegen van het misdrijf nog geen vijf jaren zijn verlopen sedert
      een vroegere veroordeling van de schuldige tot gevangenisstraf wegens een daaraan soortgelijk misdrijf in kracht
      van gewijsde is gegaan. De termijn van vijf jaren wordt verlengd met de tijd waarin de veroordeelde rechtens zijn
      vrijheid is ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel10
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '10'
  - number: 43b
    text: |-
      Als misdrijven welke soortgelijk zijn aan elkaar worden in elk geval aangemerkt:

      1°. de misdrijven omschreven in de [artikelen 105][ref1], [174][ref2], [208 tot en met 210][ref3], [213][ref4],
      [214][ref5], [216 tot en met 222bis][ref6], [225 tot en met 232][ref7], [310][ref8], [311][ref9], [312][ref10],
