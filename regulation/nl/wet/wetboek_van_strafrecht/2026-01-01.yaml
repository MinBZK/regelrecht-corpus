        bwb_id: BWBR0001854
        artikel: '27'
  - number: 77ma
    text: |-
      1 Een taakstraf wordt niet opgelegd in geval van veroordeling voor een misdrijf waarop naar de wettelijke
      omschrijving een gevangenisstraf van zes jaren of meer is gesteld en dat een ernstige inbreuk op de lichamelijke
      integriteit van het slachtoffer ten gevolge heeft gehad.

      2 Van het eerste lid kan worden afgeweken indien naast de taakstraf, jeugddetentie, de maatregel betreffende het
      gedrag of de maatregel plaatsing in een inrichting voor jeugdigen wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel77ma
  - number: 77n
    text: |-
      1 In het vonnis waarbij taakstraf wordt opgelegd, beveelt de rechter voor het geval dat de veroordeelde de
      taakstraf niet naar behoren verricht, dat vervangende jeugddetentie zal worden toegepast.

      2 De duur van de vervangende jeugddetentie wordt in gehele dagen, weken of maanden vastgesteld.

      3 De vervangende jeugddetentie beloopt ten minste één dag en ten hoogste vier maanden. Voor elke twee uren van de
      taakstraf wordt niet meer dan één dag opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel77n
  - number: 77r
    text: |-
      Ontzegging van de bevoegdheid motorrijtuigen te besturen is slechts mogelijk in de gevallen
      genoemd in de [artikelen 179][ref1], [179a][ref2] en [180 van de Wegenverkeerswet 1994][ref3] en in
      [artikel 30, zesde lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref4] (*Stb.* 1963, 228). Die
      artikelen zijn dan van overeenkomstige toepassing.


