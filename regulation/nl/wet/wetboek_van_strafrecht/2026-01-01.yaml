  - number: '424'
    text: |-
      1 Hij die op of aan de openbare weg of op enige voor het publiek toegankelijke plaats tegen personen of
      goederen enige baldadigheid pleegt waardoor gevaar of nadeel kan worden teweeggebracht, wordt, als schuldig aan
      straatschenderij, gestraft met geldboete van de eerste categorie.

      2 Indien tijdens het plegen van de overtreding nog geen jaar is verlopen sedert een vroegere veroordeling van
      de schuldige wegens gelijke overtreding onherroepelijk is geworden, kan hechtenis van ten hoogste drie dagen of
      geldboete van de eerste categorie worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel424
  - number: '425'
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft:

      1°. hij die een onder zijn hoede staand dier, wanneer het een mens of een dier aanvalt, niet terughoudt;

      2°. hij die geen voldoende zorg draagt voor het onschadelijk houden van een onder zijn hoede staand gevaarlijk
      dier.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel425
  - number: '426'
    text: |-
      1 Hij die, terwijl hij in staat van dronkenschap verkeert, hetzij in het openbaar het verkeer belemmert of de orde
      verstoort, hetzij eens anders veiligheid bedreigt, hetzij enige handeling verricht waarbij, tot voorkoming van
      gevaar voor leven of gezondheid van derden, bijzondere omzichtigheid of voorzorgen worden vereist, wordt gestraft
      met hechtenis van ten hoogste zes dagen of geldboete van de eerste categorie.

      2 Indien tijdens het plegen van de overtreding nog geen jaar is verlopen sedert een vroegere veroordeling van de
      schuldige wegens gelijke of de in [artikel 430b][ref1] omschreven overtreding onherroepelijk is geworden, wordt hij
      gestraft met hechtenis van ten hoogste twee weken of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel430b
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel426
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 430b
  - number: 426bis
    text: |-
      Hij die wederrechtelijk op de openbare weg een ander in zijn vrijheid van beweging belemmert of met een of meer
      anderen zich aan een ander tegen diens uitdrukkelijk verklaarde wil blijft opdringen of hem op hinderlijke wijze
      blijft volgen, wordt gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel426bis
  - number: 426ter
    text: |-
      Hij die wederrechtelijk een hulpverlener gedurende de uitoefening van zijn beroep in zijn vrijheid van beweging
      belemmert of met een of meer anderen zich aan hem tegen zijn uitdrukkelijk verklaarde wil blijft opdringen of hem
      op hinderlijke wijze blijft volgen wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de
      derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel426ter
  - number: '427'
    text: |-
      Met geldboete van de eerste categorie wordt gestraft:

      1°. de eigenaar of gebruiker die ten opzichte van toegangen tot of openingen van kluizen, kelders, onderaardse
      lokalen en ruimten, waar die op de openbare weg uitkomen, niet de nodige voorzorgsmaatregelen neemt ten behoeve van
      de veiligheid van de voorbijgangers;

      2°. hij die niet zorgt dat een door hem of op zijn last op een openbare weg gedane op- of uitgraving of een door
      hem of op zijn last op de openbare weg geplaatst voorwerp behoorlijk verlicht en van de gebruikelijke tekens
      voorzien is;

      3°. hij die bij een verrichting op of aan de openbare weg niet de nodige maatregelen neemt om voorbijgangers tegen
      mogelijk gevaar te waarschuwen;

      4°. hij die iets plaatst op of aan, of werpt of uitgiet uit een gebouw, op zodanige wijze dat door of ten gevolge
      daarvan iemand die van de openbare weg gebruik maakt, nadeel kan ondervinden;

      5°. hij die op de openbare weg een rij-, trek- of lastdier laat staan, zonder de nodige voorzorgsmaatregelen tegen
      het aanrichten van schade te hebben genomen;

      6°. hij die zonder verlof van het bevoegd gezag, enige openbare land- of waterweg verspert of het verkeer daarop
      belemmert.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel427
  - number: '428'
    text: |-
      Hij die, zonder verlof van de burgemeester, dan wel, in geval van een situatie als bedoeld in
      [artikel 39 van de Wet veiligheidsregio’s][ref1], de voorzitter van de veiligheidsregio of van de door deze
      aangewezen ambtenaar, een of meer eigen onroerende zaken in brand steekt, wordt gestraft met geldboete van de
      eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel39
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel428
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '39'
  - number: '429'
    text: |-
      Met hechtenis van ten hoogste veertien dagen of geldboete van de tweede categorie wordt gestraft:

      1°. hij die een vuurwapen afschiet, een vuurwerk ontsteekt of een vuur aanlegt, voedt of onderhoudt op zo korte
      afstand van gebouwen of goederen, dat daardoor brandgevaar kan ontstaan;

      2°. hij die, anders dan in de gevallen toegelaten bij of krachtens de [Wet luchtvaart][ref1], een ballon oplaat
      waaraan brandende stoffen gehecht zijn;

      3°. hij die door gebrek aan de nodige omzichtigheid of voorzorg gevaar voor bos-, heide-, helm-, gras- of veenbrand
      doet ontstaan;

      4°. hij die wederrechtelijk in oppervlaktewateren enige stof aanbrengt waardoor nadeel kan ontstaan in verband met
      het gebruik dat gewoonlijk van die wateren wordt gemaakt;

      5°. hij die een vlieger oplaat of in de lucht heeft aan een lijn die zich geheel of ten dele bevindt binnen een
      afstand van vijfhonderd meter van een bovengrondse elektrische hoogspanningsleiding;

      6°. hij die zich zodanig gedraagt dat gevaar voor het luchtverkeer wordt veroorzaakt of kan worden veroorzaakt of
      dat het verkeer in de lucht wordt gehinderd of kan worden gehinderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel429
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: 429a
    text: |-
      1 Hij die voorwerpen binnen een inrichting, een instelling of een afdeling daarvan waarop de
      [Penitentiaire beginselenwet][ref1], de [Beginselenwet verpleging ter beschikking gestelden][ref2] dan wel de
      [Beginselenwet justitiële jeugdinrichtingen][ref3] van toepassing is, brengt of tracht te brengen waarvan het
      bezit binnen die inrichting, instelling of afdeling verboden is, wordt gestraft met hechtenis van ten hoogste zes
      maanden of geldboete van de derde categorie.

      2 Met dezelfde straf wordt gestraft hij die niet overeenkomstig de daarvoor geldende regels voorwerpen binnen een
      inrichting, instelling of afdeling als bedoeld in het eerste lid brengt of tracht te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0009709
      [ref2]: https://wetten.overheid.nl/BWBR0008765
      [ref3]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel429a
    references:
      - id: ref1
        bwb_id: BWBR0009709
      - id: ref2
        bwb_id: BWBR0008765
      - id: ref3
        bwb_id: BWBR0011756
  - number: 429ter
    text: |-
      Degene die in het openbaar een ander indringend seksueel benadert door middel van opmerkingen, gebaren, geluiden
      of aanrakingen op een wijze die vreesaanjagend, vernederend, kwetsend of onterend is te achten, wordt gestraft met
      hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel429ter
  - number: 429quater
    text: |-
      1 Hij die in de uitoefening van een ambt, beroep of bedrijf personen discrimineert wegens hun ras, hun godsdienst,
      hun levensovertuiging, hun geslacht of hun seksuele gerichtheid wordt gestraft met hechtenis van ten hoogste twee
      maanden of geldboete van de derde categorie.

      2 Met dezelfde straf wordt gestraft hij wiens handelen of nalaten in de uitoefening van een ambt, beroep of bedrijf
      zonder redelijke grond, ten doel heeft of ten gevolge kan hebben dat ten aanzien van personen met een handicap
      de erkenning, het genot of de uitoefening op voet van gelijkheid van de rechten van de mens en de fundamentele
      vrijheden op politiek, economisch, sociaal of cultureel terrein of op andere terreinen van het maatschappelijk
      leven, wordt teniet gedaan of aangetast.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel429quater
  - number: 429quinquies
    text: |-
      Hij die zonder daartoe gerechtigd te zijn zich op een verboden plaats bevindt, wordt gestraft met hechtenis van ten
      hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel429quinquies
  - number: '430'
    text: |-
      Hij die zonder verlof van het bevoegd gezag een opneming doet, een tekening of beschrijving maakt van enig militair
      werk, of die openbaar maakt, wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel430
  - number: 430a
    text: |-
      Hij die zich buiten een door de gemeenteraad als geschikt voor ongeklede openbare recreatie aangewezen plaats,
      ongekleed bevindt op of aan een voor het openbaar verkeer bestemde plaats die voor ongeklede recreatie niet
      geschikt is, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel430a
  - number: 430b
    text: |-
      Hij die zich in kennelijke staat van dronkenschap op de openbare weg bevindt, wordt gestraft met hechtenis van ten
      hoogste twaalf dagen of geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel430b
  - number: '431'
    text: |-
      Met geldboete van de eerste categorie wordt gestraft hij die rumoer of burengerucht verwekt waardoor de nachtrust
      kan worden verstoord.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel431
  - number: '435'
    text: |-
      Met geldboete van de tweede categorie wordt gestraft:

      1°. hij die zonder daartoe gerechtigd te zijn een Nederlandse adellijke titel voert of een Nederlands ordeteken
      draagt;

      2°. hij die zonder ’s Konings verlof waar dit vereist wordt, een vreemd ordeteken, titel, rang of waardigheid
      aanneemt;

      3°. hij die zonder daartoe gerechtigd te zijn de titel van advocaat of gerechtsdeurwaarder voert, dan wel een titel
      of graad in de zin van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];

      4°. hij die, door het bevoegd gezag naar zijn identificerende persoonsgegevens gevraagd, een valse naam, voornaam,
      geboortedatum, geboorteplaats, adres waarop hij in de basisregistratie personen als ingezetene staat ingeschreven
      of woon- of verblijfplaats opgeeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel435
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 435a
    text: |-
      Hij die in het openbaar kledingstukken of opzichtige onderscheidingstekens draagt of voert, welke uitdrukking zijn
      van een bepaald staatkundig streven, wordt gestraft met hechtenis van ten hoogste twaalf dagen of geldboete van de
      tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel435a
  - number: 435b
    text: |-
      1 Hij die, zonder daartoe gerechtigd te zijn, gebruik maakt van woorden, uitdrukkingen of kentekens, die aanduiden
      of de indruk kunnen wekken dat zijn optreden is bevorderd dan wel de steun of de erkenning geniet van rijkswege,
      vanwege Aruba, Curaçao, Sint Maarten of een buitenlandse mogendheid dan wel vanwege een volkenrechtelijke
      organisatie, wordt gestraft met hechtenis van ten hoogste een maand of geldboete van de tweede categorie.

      2

      3 Bij veroordeling wegens de in het eerste lid omschreven overtreding, kan openbaarmaking van de rechterlijke
      uitspraak worden gelast.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel435b
  - number: 435c
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, gebruik maakt van het rode-kruisteken of van de woorden "Rode Kruis" of
      "Kruis van Genève", of van daarmede door de wetten en gebruiken van de oorlog gelijkgestelde tekens of woorden, dan
      wel van tekens of woorden die daarvan een nabootsing zijn, wordt gestraft met hechtenis van ten hoogste een maand
      of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel435c
  - number: 435d
    text: |-
      Met hechtenis van ten hoogste een maand of geldboete van de tweede categorie wordt gestraft hij die het wapen van
      het Zwitserse Eedgenootschap of een teken hetwelk een nabootsing daarvan vormt, gebruikt:

      1°. hetzij als fabrieks- of handelsmerk of als onderdeel van zulk een merk;

      2°. hetzij met een doel, strijdig met de eerlijkheid in de handel;

      3°. hetzij onder omstandigheden die het Zwitserse nationale gevoel zouden kunnen krenken.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel435d
  - number: 435e
    text: |-
      Hij die, anders dan in besloten kring, door tussenkomst van een ten algemenen nutte of mede ten algemenen nutte
      gebezigde telefooninrichting, goederen of diensten tegen betaling aanbiedt, daarbij te kennen gevend of de indruk
      wekkend dat de opbrengst geheel of ten dele voor een liefdadig of ideëel doel is bestemd, wordt gestraft met
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel435e
  - number: '436'
    text: |-
      1 Hij die, niet toegelaten tot de uitoefening van een beroep waartoe de wet een toelating vordert, buiten noodzaak
      dat beroep uitoefent, wordt gestraft met geldboete van de tweede categorie.

      2 Hij die, toegelaten tot de uitoefening van een beroep waartoe de wet een toelating vordert, buiten noodzaak in
      de uitoefening van dat beroep de grenzen van zijn bevoegdheid overschrijdt, wordt gestraft met geldboete van de
      tweede categorie.

      3 Indien tijdens het plegen van de overtreding nog geen twee jaren zijn verlopen sedert een vroegere veroordeling
      van de schuldige wegens gelijke overtreding onherroepelijk is geworden, kan in het geval van het eerste lid
      hechtenis van ten hoogste twee maanden of geldboete van de derde categorie, in het geval van het tweede lid
      hechtenis van ten hoogste een maand of geldboete van de derde categorie worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel436
  - number: '437'
    text: |-
      1 Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft de bij algemene
      maatregel van bestuur aangewezen handelaar die in de uitoefening van zijn beroep of bedrijf:

      a. niet met inachtneming van de bij algemene maatregel van bestuur te stellen regels aantekening houdt van alle
      gebruikte of ongeregelde goederen die hij heeft verworven dan wel voorhanden heeft,

      b. een gebruikt of ongeregeld goed verwerft van iemand, zonder dat diegene zijn identificerende persoonsgegevens
      heeft opgegeven of zonder dat hij die gegevens in zijn administratie heeft aangetekend,

      c. nalaat zijn administratie op eerste aanvraag ter inzage te geven aan een ambtenaar als bedoeld in
      [artikel 552 van het Wetboek van Strafvordering][ref1],

      d. nalaat een gebruikt of ongeregeld goed dat hij heeft verworven of voorhanden heeft, op eerste vordering van een
      ambtenaar als bedoeld in onderdeel *c*, ter bezichtiging af te staan en deze te laten zien waar dit goed in zijn
      administratie staat ingeschreven,

      e. een goed dat bij hem door of vanwege de politie met een duidelijke schriftelijke omschrijving als door misdrijf
      aan de rechthebbende is onttrokken of als verloren is aangegeven, verwerft of voorhanden heeft,

      f. aan een hem schriftelijk uitgereikt last van een ambtenaar, zoals bedoeld in onderdeel *c*, tot het gedurende
      een daarbij aangegeven tijd, veertien dagen niet te boven gaande, bewaren of in bewaring geven van een goed dat hij
      voorhanden heeft, of aan een hem bij die last gegeven aanwijzing, geen gevolg geeft, of

      g. nalaat de van hem bij schriftelijke vordering van een ambtenaar, zoals bedoeld in onderdeel *c*, gevraagde
      opgaven betreffende door hem verworven of bij hem voorhanden zijnde goederen binnen de termijn, bij de vordering
      gesteld, naar waarheid te verschaffen.

      2 Met dezelfde straf wordt gestraft de voor de handelaar uit het eerste lid optredende persoon die een feit begaat
      als in dit lid onder *a* tot en met *g* omschreven;

      3 De schuldige kan worden ontzet van de uitoefening van het beroep waarin hij de overtreding begaat.

      4 Onder ongeregelde goederen worden verstaan goederen die wegens hun aard of uitvoering, hun herkomst of de staat
      waarin zij verkeren, niet tot de algemeen gangbare goederen kunnen worden gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel437
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '552'
  - number: 437bis
    text: |-
      1 Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft de handelaar die op
      grond van [artikel 437][ref1] bij algemene maatregel van bestuur is aangewezen en in de oefening van zijn beroep
      of bedrijf:

      a. een goed van een minderjarige verwerft, of

      b. een goed van iemand van wie hij weet of redelijkwijs moet vermoeden dat hij is opgenomen in een strafinrichting,
      rijksinrichting voor kinderbescherming of psychiatrisch ziekenhuis, verwerft.

      2 Met dezelfde straf wordt gestraft de voor de handelaar uit het eerste lid optredende persoon die een feit begaat
      als in dit lid onder *a* en *b* omschreven.

      3 De schuldige kan worden ontzet van de uitoefening van het beroep waarin hij de overtreding heeft begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel437
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel437bis
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '437'
  - number: 437ter
    text: |-
      1 De handelaar aangewezen bij algemene maatregel van bestuur op grond van [artikel 437][ref1], die een verordening
      door de raad van een gemeente ter bestrijding van heling uitgevaardigd en afgekondigd, overtreedt, wordt gestraft
      met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.

      2 Met dezelfde straf wordt gestraft hij die van opkopen een beroep of gewoonte maakt, zonder daarvan te voren de
      burgemeester of een door die burgemeester aangewezen ambtenaar schriftelijk in kennis te hebben gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel437
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel437ter
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '437'
  - number: 437quater
    text: |-
      Hij die enig voorschrift ter voorkoming van gevaar voor begunstiging van misdrijven, bij algemene maatregel van
      bestuur met betrekking tot het verkeer op bepaalde daarbij aan te wijzen watergebieden vastgesteld, overtreedt,
      wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel437quater
  - number: '438'
    text: |-
      1 Hij die er zijn beroep van maakt aan personen nachtverblijf te verschaffen wordt gestraft met hechtenis van ten
      hoogste een maand of geldboete van de tweede categorie indien hij:

      1e. nalaat zich onverwijld bij aankomst van de persoon die in de door hem gehouden inrichting
      de nacht zal doorbrengen een geldig reisdocument of een identiteitsbewijs als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] te doen overleggen;

      2e. geen doorlopend register houdt of nalaat daarin onverwijld bij de aankomst van die persoon zijn naam,
      woonplaats en dag van aankomst aan te tekenen of te doen aantekenen alsmede zelf daarin aantekening te houden of te
      doen houden van de aard van het overgelegde document, en, bij het vertrek, de dag van het vertrek;

      3e. nalaat dat register op aanvraag te vertonen aan de burgemeester dan wel aan de door deze aangewezen ambtenaar.

      2 Met dezelfde straf wordt de gelijke nalatigheid gestraft van degene die er zijn beroep of een gewoonte van maakt
      aan meerderjarige personen een terrein, daaronder begrepen iedere binnenhaven of elk binnenwater ingericht tot
      het afmeren van pleziervaartuigen, al of niet met daarbij behorende voorzieningen, ter beschikking te stellen voor
      het houden van nachtverblijf of voor het plaatsen dan wel geplaatst houden van kampeermiddelen of daartoe enig
      bouwwerk, niet zijnde een inrichting als bedoeld in het eerste lid, ter beschikking stelt.

      3 Op nachtverblijf, verschaft aan meereizende echtgenoten, minderjarige kinderen of aan reisgezelschappen, is het
      voorgaande niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel438
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '439'
    text: |-
      1 Met hechtenis van ten hoogste een maand of geldboete van de tweede categorie wordt gestraft:

      1°. hij die van een krijgsman beneden de rang van officier goederen behorende tot de kleding, uitrusting of
      bewapening koopt, inruilt, als geschenk aanneemt, in pand, gebruik of bewaring neemt, of zodanige goederen voor een
      krijgsman beneden de rang van officier verkoopt, ruilt, ten geschenke, in pand, gebruik of bewaring geeft, zonder
      schriftelijke vergunning door of vanwege de bevelvoerende officier afgegeven;

      2°. hij die, een gewoonte makende van het kopen van zodanige goederen, de bij algemene maatregel van inwendig
      bestuur gegeven voorschriften omtrent het daarvan te houden register niet naleeft.

      2 Indien tijdens het plegen van de overtreding nog geen twee jaren zijn verlopen sedert een vroegere veroordeling
      van de schuldige wegens een van deze overtredingen onherroepelijk is geworden, kan de straf van hechtenis worden
      verdubbeld.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel439
  - number: '440'
    text: |-
      Hij die drukwerken of andere voorwerpen in een vorm die ze op munt- of bankbiljetten, op muntspeciën, op
      van wettelijke merken voorziene palladium, platina, gouden of zilveren voorwerpen, op postzegels of op
      reisdocumenten, identiteitsbewijzen als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] of andere
      identiteitsbewijzen die afgegeven zijn door een dienst of organisatie van vitaal of nationaal belang of Nederlandse
      identiteitskaarten doet gelijken, vervaardigt, ontvangt, zich verschaft, in voorraad heeft, vervoert, invoert,
      doorvoert of uitvoert, wordt gestraft met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel440
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '441'
    text: |-
      Met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie wordt gestraft hij die de inhoud of
      de strekking van hetgeen door middel van een onder zijn beheer staande of door hem gebruikt radio-ontvangapparaat
      is opgevangen en, naar hij redelijkerwijs moet vermoeden, niet voor hem of mede voor hem bestemd is, hetzij aan
      een ander meedeelt, indien hij redelijkerwijs moet vermoeden, dat dan openlijke bekendmaking van de inhoud of de
      strekking volgen zal en zodanige bekendmaking volgt, hetzij openlijk bekend maakt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel441
  - number: 441a
    text: |-
      Hij die openlijk of door verspreiding van enig geschrift ongevraagd een voorwerp als verkrijgbaar dan wel als bij
      hem voorhanden aanwijst en daarbij de aandacht vestigt op de geschiktheid daarvan als technisch hulpmiddel voor het
      heimelijk afluisteren, aftappen of opnemen van gesprekken, telecommunicatie of andere gegevensoverdracht door een
      geautomatiseerd werk of als onderdeel van zulk een hulpmiddel, wordt gestraft met hechtenis van ten hoogste twee
      maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel441a
  - number: 441b
    text: |-
      Met hechtenis van ten hoogste twee maanden of geldboete van de derde categorie wordt gestraft hij die, gebruik
      makende van een daartoe aangebracht technisch hulpmiddel waarvan de aanwezigheid niet op duidelijke wijze kenbaar
      is gemaakt, van een persoon, aanwezig op een voor het publiek toegankelijke plaats, wederrechtelijk een afbeelding
      vervaardigt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel441b
  - number: '442'
    text: |-
      Met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie wordt gestraft:

      1°. hij die, surséance van betaling verkregen hebbende, eigenmachtig daden verricht waartoe de medewerking van
      bewindvoerders door de wet wordt gevorderd;

      2°. de bestuurder of commissaris van een rechtspersoon welke surséance van betaling verkregen heeft, die
      eigenmachtig daden verricht waartoe de medewerking van bewindvoerders door de wet wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel442
  - number: 442a
    text: |-
      Hij die zonder voorafgaande schriftelijke toestemming van de raad voor de kinderbescherming een kind beneden
      de leeftijd van zes maanden hetwelk niet onder voogdij van een rechtspersoon staat als pleegkind opneemt, wordt
      gestraft met hechtenis van ten hoogste drie weken of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel442a
  - number: '443'
    text: |-
      Hij die een algemeen voorschrift van politie, krachtens de [Gemeentewet][ref1] in buitengewone omstandigheden
      door de burgemeester, de voorzitter van de veiligheidsregio of de commissaris van de Koning in de provincie
      uitgevaardigd en afgekondigd, overtreedt, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete
      van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel443
    references:
      - id: ref1
        bwb_id: BWBR0005416
  - number: '444'
    text: |-
      Hij die, wettelijk als getuige, als deskundige of als tolk opgeroepen, wederrechtelijk wegblijft, wordt gestraft
      met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel444
  - number: '445'
    text: |-
      Hij die in zaken van minderjarigen of van onder curatele te stellen of gestelde personen, of van hen die in een
      psychiatrisch ziekenhuis zijn opgenomen, als bloedverwant, aangehuwde, echtgenoot, voogd, curator, voor de rechter
      geroepen om te worden gehoord, noch in persoon noch, waar dit is toegelaten, door tussenkomst van een gemachtigde
      verschijnt, zonder geldige reden van verschoning, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel445
  - number: '446'
    text: |-
      Hij die, bij het bestaan van gevaar voor de algemene veiligheid van personen of goederen of bij ontdekking van een
      misdrijf op heter daad, het hulpbetoon weigert dat de openbare macht van hem vordert en waartoe hij, zonder zich
      aan dadelijk gevaar bloot te stellen, in staat is, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel446
  - number: 446a
    text: |-
      Met een hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie wordt gestraft hij die,

      1°. nadat hij een bevoegdheid als bedoeld in [artikel 539][ref1] heeft uitgeoefend, dan wel

      2°. nadat hem buiten het rechtsgebied van een rechtbank een aangehouden verdachte of een in beslag genomen voorwerp
      is overgeleverd, dan wel

      3°. nadat hij buiten het rechtsgebied van een rechtbank op last van het openbaar ministerie een persoon heeft
      aangehouden,

      niet onverwijld en op de snelst mogelijke wijze aan een bevoegde officier van justitie kennis geeft van de
      gegevens, bedoeld in [artikel 539][ref2], of nalaat te trachten ten spoedigste aanwijzingen van de officier van
      justitie te verkrijgen als bedoeld in het derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel539b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel539b
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel446a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 539b
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 539b
  - number: '447'
    text: |-
      Hij die een bekendmaking, vanwege het bevoegd gezag in het openbaar gedaan, wederrechtelijk afscheurt, onleesbaar
      maakt of beschadigt, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel447
  - number: 447a
    text: |-
      Met geldboete van de tweede categorie wordt gestraft:

      1°. hij die niet of niet behoorlijk voldoet aan enige verplichting, opgelegd in [artikel 195 van Boek 8 van het
      Burgerlijk Wetboek](onbekend) in verband met de [artikelen 192](onbekend) en [178 derde lid van Boek 8 van het
      Burgerlijk Wetboek](onbekend), of opgelegd in de [artikelen 785](onbekend) en [786 van Boek 8 van het Burgerlijk
      Wetboek](onbekend) in verband met de [artikelen 782](onbekend) en [178 derde lid](onbekend), naast [artikel 771 van
      Boek 8 van dat Wetboek](onbekend) of in de algemene maatregelen van bestuur bedoeld in de [artikelen 231](onbekend)
      en [841 van Boek 8 van het Burgerlijk Wetboek](onbekend);

      2°. hij die het brandmerk, de benaming of kentekens op een teboekstaand schip, voorgeschreven in de onder 1°
      genoemde algemene maatregel van bestuur, verwijdert, verandert dan wel onduidelijk of onzichtbaar maakt op een
      andere wijze dan volgens die algemene maatregel van bestuur geoorloofd is;

      3°. hij die niet of niet behoorlijk voldoet aan de verplichting, opgelegd in [artikel 1304, tweede lid, van Boek 8
      van het Burgerlijk Wetboek](onbekend), of aan enige verplichting, opgelegd in een algemene maatregel van bestuur,
      uitgevaardigd krachtens [artikel 1321 van Boek 8 van het Burgerlijk Wetboek](onbekend).
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel447a
  - number: 447b
    text: |-
      Hij die een reisdocument, een identiteitsbewijs als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] of een ander identiteitsbewijs dat afgegeven is door een
      dienst of organisatie van vitaal of nationaal belang, dat hij voorhanden heeft, waarvan hij niet de houder is,
      of dat ingevolge een wettelijke bepaling moet worden ingeleverd, niet terstond wanneer hem dit mondeling door een
      daartoe bevoegde ambtenaar is bevolen, dan wel binnen veertien dagen, nadat hem dit bij aangetekend schrijven in
      persoon is medegedeeld inlevert, wordt gestraft met geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel447b
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 447c
    text: |-
      Hij die, anders dan door valsheid in geschrift, aan degene door wie of door wiens tussenkomst enige verstrekking
      of tegemoetkoming wordt verleend, gegevens verstrekt die naar hij weet of redelijkerwijze moet vermoeden niet met
      de waarheid in overeenstemming zijn, wordt, indien deze gegevens van belang zijn voor de vaststelling van zijn
      of eens anders recht op die verstrekking of tegemoetkoming dan wel voor de hoogte of de duur van een dergelijke
      verstrekking of tegemoetkoming, gestraft met hechtenis van ten hoogste zes maanden of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel447c
  - number: 447d
    text: |-
      Hij die, in strijd met een hem bij of krachtens wettelijk voorschrift opgelegde verplichting, nalaat tijdig de
      benodigde gegevens te verstrekken, wordt, indien deze gegevens van belang zijn voor de vaststelling van zijn
      of eens anders recht op een verstrekking of tegemoetkoming dan wel voor de hoogte of de duur van een dergelijke
      verstrekking of tegemoetkoming, gestraft met hechtenis van ten hoogste zes maanden of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel447d
  - number: 447e
    text: |-
      Hij die niet voldoet aan de verplichting om een identiteitsbewijs ter inzage aan te bieden of
      medewerking te verlenen aan het nemen van een of meer vingerafdrukken, hem opgelegd krachtens de
      [Wet op de identificatieplicht][ref1], het [Wetboek van Strafvordering][ref2], het Wetboek van Strafrecht, de
      [Overleveringswet][ref3], de [Uitleveringswet][ref4], de [Wet overdracht tenuitvoerlegging strafvonnissen][ref5],
      de [Penitentiaire beginselenwet][ref6], de [Beginselenwet verpleging ter beschikking gestelden][ref7], de
      [Beginselenwet justitiële jeugdinrichtingen][ref8], de [Wet verplichte geestelijke gezondheidszorg][ref9] of de
      [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref10], wordt gestraft met geldboete
      van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006297
      [ref2]: https://wetten.overheid.nl/BWBR0001903
      [ref3]: https://wetten.overheid.nl/BWBR0016664
