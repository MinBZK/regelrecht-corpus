  - number: '157'
    text: |-
      Hij die opzettelijk brand sticht, een ontploffing teweegbrengt of een overstroming veroorzaakt, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daarvan gemeen
      gevaar voor goederen te duchten is;

      2°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar of gevaar voor zwaar lichamelijk letsel voor een ander te duchten is;

      3°. met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde
      categorie, indien daarvan levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel157
  - number: '158'
    text: |-
      Hij aan wiens schuld brand, ontploffing of overstroming te wijten is, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie, indien daardoor gemeen
      gevaar voor goederen ontstaat;

      2°. met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daardoor levensgevaar
      of gevaar voor zwaar lichamelijk letsel voor een ander ontstaat;

      3°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands
      dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel158
  - number: '159'
    text: |-
      Hij die opzettelijk bij of in het vooruitzicht van brand blusgereedschappen of blusmiddelen wederrechtelijk
      verbergt of onbruikbaar maakt, of op enige wijze de blussing van brand verhindert of belemmert, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel159
  - number: '160'
    text: |-
      Hij die opzettelijk bij of in het vooruitzicht van watersnood dijkmaterialen of gereedschappen wederrechtelijk
      verbergt of onbruikbaar maakt, enige poging tot herstel van dijken of andere waterstaatswerken verijdelt, of de
      aangewende middelen tot het voorkomen of stuiten van overstroming tegenwerkt, wordt gestraft met gevangenisstraf
      van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel160
  - number: '161'
    text: |-
      Hij die opzettelijk enig werk dienend tot waterkering, waterlozing, gas- of waterleiding of riolering vernielt,
      onbruikbaar maakt of beschadigt, wordt gestraft:

      1º. met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie, indien daarvan gevaar voor
      een overstroming of gemeen gevaar voor goederen te duchten is;

      2º. met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is;

      3º. met gevangenisstraf van ten hoogste vijften jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel161
  - number: 161bis
    text: |-
      Hij die opzettelijk enig electriciteitswerk vernielt, beschadigt of onbruikbaar maakt, stoornis in de gang of in de
      werking van zodanig werk veroorzaakt, of een ten opzichte van zodanig werk genomen veiligheidsmaatregel verijdelt,
      wordt gestraft:

      1°. met gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie, indien daardoor verhindering
      of bemoeilijking van stroomlevering ten algemenen nutte ontstaat;

      2°. met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie, indien daarvan gemeen
      gevaar voor goederen te duchten is;

      3°. met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is;

      4°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel161bis
  - number: 161ter
    text: |-
      Hij aan wiens schuld te wijten is, dat enig electriciteitswerk wordt vernield, beschadigd, of onbruikbaar gemaakt,
      dat stoornis in de gang of in de werking van zodanig werk ontstaat, of dat een ten opzichte van zodanig werk
      genomen veiligheidsmaatregel wordt verijdeld, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie, indien daardoor
      verhindering of bemoeilijking van stroomlevering ten algemenen nutte of gemeen gevaar voor goederen ontstaat;

      2°. met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daardoor levensgevaar
      voor een ander ontstaat;

      3°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands
      dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel161ter
  - number: 161quater
    text: |-
      Hij die opzettelijk mensen, dieren, planten of goederen aan ioniserende stralen blootstelt, dan wel mensen, dieren,
      planten, goederen, bodem, water of lucht met radioactieve stoffen besmet, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan gevaar
      voor de openbare gezondheid of levensgevaar voor een ander te duchten is;

      2°. met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde
      categorie, indien daarvan levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel161quater
  - number: 161quinquies
    text: |-
      Hij aan wiens schuld te wijten is dat mensen, dieren, planten of goederen aan ioniserende stralen worden
      blootgesteld, dan wel mensen, dieren, planten, goederen, bodem, water of lucht met radioactieve stoffen worden
      besmet, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daarvan gevaar voor
      de openbare gezondheid of levensgevaar voor een ander te duchten is;

      2°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel161quinquies
  - number: 161sexies
    text: |-
      Hij die opzettelijk enig geautomatiseerd werk of enig werk voor telecommunicatie vernielt, beschadigt of
      onbruikbaar maakt, stoornis in de gang of in de werking van zodanig werk veroorzaakt, of een ten opzichte van
      zodanig werk genomen veiligheidsmaatregel verijdelt, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie, indien daarvan gemeen
      gevaar voor goederen of voor de verlening van diensten te duchten is;

      2°. met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is;

      3°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel161sexies
  - number: 161septies
    text: |-
      Hij aan wiens schuld te wijten is dat enig geautomatiseerd werk of enig werk voor telecommunicatie wordt vernield,
      beschadigd of onbruikbaar gemaakt, dat stoornis in de gang of in de werking van zodanig werk ontstaat, of dat een
      ten opzichte van zodanig werk genomen veiligheidsmaatregel wordt verijdeld, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie, indien daardoor
      verhindering of bemoeilijking van de opslag, verwerking of overdracht van gegevens ten algemenen nutte, stoornis in
      een openbaar telecommunicatienetwerk of in de uitvoering van een openbare telecommunicatiedienst, of gemeen gevaar
      voor goederen of voor de verlening van diensten ontstaat;

      2°. met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daardoor levensgevaar
      voor een ander ontstaat;

      3°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands
      dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel161septies
  - number: '162'
    text: |-
      Hij die opzettelijk enig werk dienende voor het openbaar verkeer of het luchtverkeer vernielt, onbruikbaar maakt
      of beschadigt, enige openbare land- of waterweg verspert of een ten aanzien van zodanig werk of van zodanige weg
      genomen veiligheidsmaatregel verijdelt, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daarvan gevaar
      voor de veiligheid van het verkeer te duchten is;

      2°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan gevaar
      voor de veiligheid van het verkeer te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel162
  - number: 162a
    text: |-
      Hij die opzettelijk op een luchthaven een luchtvaartuig buiten bedrijf of enige voorziening vernielt, onbruikbaar
      maakt of beschadigt, dan wel de diensten op een luchthaven verstoort, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien daarvan gevaar
      voor de veiligheid van de luchtvaart of gemeen gevaar voor goederen, gebouwen of diensten op de luchthaven te
      duchten valt;

      2°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan gevaar
      voor de veiligheid van de luchtvaart of gemeen gevaar voor goederen, gebouwen of diensten op de luchthaven te
      duchten valt en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel162a
  - number: '163'
    text: |-
      Hij aan wiens schuld te wijten is dat enig werk dienende voor het openbaar verkeer of het luchtverkeer wordt
      vernield, onbruikbaar gemaakt of beschadigd, enige openbare land- of waterweg versperd of een ten aanzien van
      zodanig werk of van zodanige weg genomen veiligheidsmaatregel verijdeld wordt, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie, indien daardoor het
      verkeer onveilig wordt;

      2°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands
      dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel163
  - number: '164'
    text: |-
      1 Hij die opzettelijk gevaar veroorzaakt voor het verkeer door mechanische kracht over een spoorweg of voor
      het luchtverkeer, wordt gestraft met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde
      categorie.

      2 Indien het feit iemands dood ten gevolge heeft, wordt de schuldige gestraft met levenslange gevangenisstraf of
      tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel164
  - number: '165'
    text: |-
      1 Hij aan wiens schuld te wijten is dat gevaar ontstaat voor het verkeer door mechanische kracht over een spoorweg
      of voor het luchtverkeer, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde
      categorie.

      2 Indien het feit iemands dood ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste
      twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel165
  - number: '166'
    text: |-
      Hij die opzettelijk een voor de veiligheid van de scheepvaart of luchtvaart gesteld teken of hulpmiddel vernielt,
      beschadigt, wegneemt of verplaatst, de werking daarvan verijdelt of een verkeerd teken stelt, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daarvan gevaar
      voor de veiligheid van de scheepvaart of luchtvaart te duchten is;

      2°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan gevaar
      voor de veiligheid van de scheepvaart of luchtvaart te duchten is en het feit het zinken, stranden of verongelukken
      van een vaartuig of een luchtvaartuig ten gevolge heeft;

      3°. met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde
      categorie, indien daarvan gevaar voor de veiligheid van de scheepvaart of luchtvaart te duchten is en het feit
      iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel166
  - number: '167'
    text: |-
      Hij aan wiens schuld vernieling, beschadiging, wegneming of verplaatsing van een voor de veiligheid van de
      scheepvaart of luchtvaart gesteld teken of hulpmiddel dan wel de verijdeling van de werking daarvan of het stellen
      van een verkeerd teken te wijten is, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie, indien daardoor de
      scheepvaart of de luchtvaart onveilig wordt;

      2°. met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien het feit het zinken,
      stranden of verongelukken van een vaartuig of een luchtvaartuig ten gevolge heeft;

      3°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands
      dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel167
  - number: '168'
    text: |-
      Hij die enig vaartuig, voertuig of luchtvaartuig opzettelijk en wederrechtelijk doet zinken, stranden of
      verongelukken, vernielt, onbruikbaar maakt of beschadigt, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is;

      2°. met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde
      categorie, indien daarvan levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel168
  - number: '169'
    text: |-
      Hij aan wiens schuld te wijten is dat enig vaartuig, voertuig of luchtvaartuig zinkt, strandt of verongelukt,
      vernield, onbruikbaar gemaakt of beschadigd wordt, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daardoor levensgevaar
      voor een ander ontstaat;

      2°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands
      dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel169
  - number: '170'
    text: |-
      Hij die enig gebouw, getimmerte, installatie ter zee of voor het publiek toegankelijke plaats opzettelijk vernielt
      of beschadigt, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daarvan gemeen
      gevaar voor goederen te duchten is;

      2°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is;

      3°. met levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde
      categorie, indien daarvan levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel170
  - number: '171'
    text: |-
      Hij aan wiens schuld de vernieling of beschadiging van enig gebouw, getimmerte, installatie ter zee of voor het
      publiek toegankelijke plaats te wijten is, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie, indien daardoor gemeen
      gevaar voor goederen ontstaat;

      2°. met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daardoor levensgevaar
      voor een ander ontstaat;

      3°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands
      dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel171
  - number: '172'
    text: |-
      1 Hij die opzettelijk en wederrechtelijk een stof in een inrichting ten behoeve van de drinkwatervoorziening of in
      een tot gezamenlijk gebruik van of met anderen bestemde waterleiding brengt, dan wel de aanmaak van drinkwater in
      of de toevoer van drinkwater vanuit de openbare drinkwatervoorziening belemmert, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daarvan gevaar
      voor een ander te duchten is;

      2°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolg heeft.

      2 Hij die opzettelijk enig voor de openbare drinkwatervoorziening bestemd werk vernielt, beschadigt of onbruikbaar
      maakt, stoornis in de gang of in de werking van zodanig werk veroorzaakt, of een ten opzichte van zodanig werk
      genomen veiligheidsmaatregel verijdelt, wordt, indien daardoor verhindering of bemoeilijking van de openbare
      drinkwatervoorziening te duchten is, gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel172
  - number: '173'
    text: |-
      1 Hij aan wiens schuld te wijten is, dat wederrechtelijk een stof in een inrichting ten behoeve van de
      drinkwatervoorziening of in een tot gezamenlijk gebruik van of met anderen bestemde waterleiding, wordt gebracht,
      wordt gestraft:

      1°. met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daarvan gevaar voor
      de openbare gezondheid of levensgevaar voor een ander te duchten is;

      2°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.

      2 Hij aan wiens schuld te wijten is, dat enig voor de openbare drinkwatervoorziening bestemd werk wordt vernield,
      beschadigd, of onbruikbaar gemaakt, dat stoornis in de gang of in de werking van een zodanig werk ontstaat of dat
      een ten opzichte van zodanig werk genomen veiligheidsmaatregel wordt verijdeld, wordt, indien daardoor verhindering
      of bemoeilijking van de openbare drinkwatervoorziening te duchten is, gestraft met een gevangenisstraf van ten
      hoogste zes maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel173
  - number: 173a
    text: |-
      Hij die opzettelijk en wederrechtelijk een stof op of in de bodem, in de lucht of in het oppervlaktewater brengt,
      wordt gestraft:

      1°. met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien daarvan gevaar
      voor de openbare gezondheid of levensgevaar voor een ander te duchten is;

      2°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel173a
  - number: 173b
    text: |-
      Hij aan wiens schuld te wijten is, dat wederrechtelijk een stof op of in de bodem, in de lucht of in het
      oppervlaktewater wordt gebracht, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daarvan gevaar voor
      de openbare gezondheid of levensgevaar voor een ander te duchten is;

      2°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel173b
  - number: '174'
    text: |-
      1 Hij die waren verkoopt, te koop aanbiedt, aflevert of uitdeelt, wetende dat zij voor het leven of de gezondheid
      schadelijk zijn, en dat schadelijk karakter verzwijgende, wordt gestraft met gevangenisstraf van ten hoogste
      vijftien jaren of geldboete van de vijfde categorie.

      2 Indien het feit iemands dood ten gevolge heeft, wordt de schuldige gestraft met levenslange gevangenisstraf of
      tijdelijke van ten hoogste dertig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel174
  - number: '175'
    text: |-
      1 Hij aan wiens schuld te wijten is dat waren, schadelijk voor het leven of de gezondheid, verkocht, afgeleverd
      of uitgedeeld worden, zonder dat de koper of verkrijger met dat schadelijk karakter bekend is, wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie.

      2 Indien het feit iemands dood ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste
      twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel175
  - number: 175a
    text: |-
      Hij die in geval van oorlog opzettelijk een bekendgemaakt bevel, bedoeld in
      [artikel 7 van de Wet bescherming bevolking][ref1] (*Stb.* 1952, 404), dan wel een bij of krachtens een van de
      algemene maatregelen van bestuur, bedoeld in [artikel 29 van de Intrekkingswet BB][ref2] (*Stb.* 1986, 312),
      gegeven en bekendgemaakt voorschrift overtreedt, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vijfde categorie, indien daarvan gemeen
      gevaar voor goederen te duchten is;

      2°. met gevangenisstraf van ten hoogste drie jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is;

      3°. met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vijfde categorie, indien daarvan
      levensgevaar voor een ander te duchten is en het feit iemands dood ten gevolge heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002096#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel29
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel175a
    references:
      - id: ref1
        bwb_id: BWBR0002096
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '29'
  - number: 175b
    text: |-
      Hij aan wiens schuld in geval van oorlog overtreding te wijten is van een bekendgemaakt bevel, bedoeld in
      [artikel 7 van de Wet bescherming bevolking][ref1], dan wel van een bij of krachtens een van de algemene
      maatregelen van bestuur, bedoeld in [artikel 29 van de Intrekkingswet BB][ref2], gegeven en bekendgemaakt
      voorschrift, wordt gestraft:

      1°. met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie, indien daardoor gemeen
      gevaar voor goederen ontstaat;

      2°. met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien daardoor levensgevaar
      voor een ander ontstaat;

      3°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit iemands
      dood ten gevolge heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002096#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003986#Artikel29
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel175b
    references:
      - id: ref1
        bwb_id: BWBR0002096
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003986
        artikel: '29'
  - number: '176'
    text: |-
      1 Bij veroordeling wegens enig in deze titel omschreven misdrijf kan de schuldige worden ontzet van de uitoefening
      van het beroep waarin hij het misdrijf begaan heeft.

      2 Bij veroordeling wegens een der in de [artikelen 174][ref1] en [175][ref2] omschreven misdrijven, kan de rechter
      de openbaarmaking van zijn uitspraak gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel174
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel175
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '174'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '175'
  - number: 176a
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 157][ref1], [159][ref2], [160][ref3], [161][ref4],
      [161bis][ref5], [161quater][ref6], [161sexies][ref7], [162][ref8], [162a][ref9], [164][ref10], [166][ref11],
      [168][ref12], [170][ref13], [172][ref14], [173a][ref15] of [174][ref16], is begaan met een terroristisch oogmerk,
      wordt de in dat artikel bepaalde tijdelijke gevangenisstraf met de helft verhoogd en wordt, indien op het misdrijf
      een tijdelijke gevangenisstraf van ten hoogste vijftien jaren is gesteld, levenslange gevangenisstraf of tijdelijke
      van ten hoogste dertig jaren opgelegd.


