    text: |-
      1 Indien de maatregel voorwaardelijk eindigt op grond van
      [artikel 6:2:22, eerste lid, van het Wetboek van Strafvordering][ref1] of op grond van het tweede lid, zijn daaraan
      van rechtswege de voorwaarden verbonden dat:

      a. de veroordeelde zich ten tijde van de voorwaardelijke beëindiging niet schuldig maakt aan een strafbaar feit;

      b. de veroordeelde ten behoeve van het vaststellen van zijn identiteit medewerking verleent
      aan het nemen van een of meer vingerafdrukken of een identiteitsbewijs als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2] ter inzage aanbiedt en medewerking verleent aan het
      toezicht door de gecertificeerde instelling, bedoeld in [artikel 1.1 van de Jeugdwet][ref3] dan wel van een
      reclasseringsinstelling als bedoeld in [artikel 14c, zesde lid][ref4].

      2 Een jaar nadat de maatregel voorwaardelijk is geëindigd, eindigt de maatregel van rechtswege
      onvoorwaardelijk, tenzij de voorwaardelijke beëindiging wordt verlengd met toepassing van
      [artikel 6:6:32 van het Wetboek van Strafvordering][ref5]. In de gevallen waarin de voorwaardelijke beëindiging
      is verlengd, eindigt de maatregel onvoorwaardelijk nadat de maximale duur van de voorwaardelijke beëindiging is
      bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6222
