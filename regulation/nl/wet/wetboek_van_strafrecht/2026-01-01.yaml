  - number: '72'
    text: |-
      1 Elke daad van vervolging stuit de verjaring, ook ten aanzien van anderen dan de vervolgde.

      2 Na de stuiting vangt een nieuwe verjaringstermijn aan. Het recht tot strafvordering vervalt evenwel ten aanzien
      van overtredingen na tien jaren en ten aanzien van misdrijven indien vanaf de dag waarop de oorspronkelijke
      verjaringstermijn is aangevangen een periode is verstreken die gelijk is aan twee maal de voor het misdrijf
      geldende verjaringstermijn.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel72
  - number: '73'
    text: De schorsing van de strafvervolging ter zake van een prejudicieel geschil schorst de verjaring.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel73
  - number: '74'
    text: |-
      1 De officier van justitie kan voor de aanvang van de terechtzitting een of meer voorwaarden stellen ter voorkoming
      van de strafvervolging wegens misdrijven, met uitzondering van die waarop naar de wettelijke omschrijving
      gevangenisstraf is gesteld van meer dan zes jaar, en wegens overtreding. Door voldoening aan die voorwaarden
      vervalt het recht tot strafvordering.

      2 De volgende voorwaarden kunnen worden gesteld:

      a. betaling aan de staat van een geldsom, te bepalen op ten minste € 3 en ten hoogste het maximum van de geldboete
      die voor het feit kan worden opgelegd;

      b. afstand van voorwerpen die in beslag zijn genomen en vatbaar zijn voor verbeurdverklaring of onttrekking aan
      het verkeer;

      c. uitlevering, of voldoening aan de staat van de geschatte waarde, van voorwerpen die vatbaar zijn voor
      verbeurdverklaring;

      d. voldoening aan de staat van een geldbedrag of overdracht van inbeslaggenomen voorwerpen ter gehele of
      gedeeltelijke ontneming van het ingevolge [artikel 36e][ref1] voor ontneming vatbare wederrechtelijk verkregen
      voordeel;

      e. gehele of gedeeltelijke vergoeding van de door het strafbare feit veroorzaakte schade;

      f. het verrichten van onbetaalde arbeid of het volgen van een leerproject gedurende ten hoogste honderdtwintig
      uren.

      3 De officier van justitie doet in geval van misdrijf aan de rechtstreeks belanghebbende die hem bekend is,
      onverwijld schriftelijk mededeling van de datum waarop hij die voorwaarden heeft gesteld.

      4 [Artikel 6:1:1 van het Wetboek van Strafvordering][ref2] is van overeenkomstige toepassing op de op grond van
      het eerste lid gestelde voorwaarden.

      5 Op de in het tweede lid, onder f, bedoelde voorwaarde is het bepaalde bij of krachtens
      de [artikelen 22b][ref3], [22c, eerste lid][ref4], en de [artikelen 6:1:9][ref5],
      [6:3:1, tweede lid][ref6], en [6:3:6 van het Wetboek van Strafvordering][ref7] met betrekking
      tot taakstraffen, van overeenkomstige toepassing. Bij het verrichten van de onbetaalde arbeid
      of het leerproject wordt de identiteit van de veroordeelde vastgesteld op de wijze, bedoeld in
      [artikel 27a, eerste lid, eerste volzin, en tweede lid, van het Wetboek van Strafvordering][ref8]. De onbetaalde
      arbeid of het leerproject wordt binnen een termijn van negen maanden na instemming met de voorwaarde voltooid.

      6 Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent de nakoming van de
      voorwaarde, bedoeld in het tweede lid, onderdeel a. Deze voorschriften hebben in ieder geval betrekking op
      de plaats en wijze van betaling van de geldsom, de termijn waarbinnen die betaling moet zijn geschied en de
      verantwoording van de ontvangen geldbedragen. Bij of krachtens algemene maatregel van bestuur kunnen voorschriften
      worden gegeven omtrent de nakoming van de overige in het tweede lid bedoelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36e
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel611
