  - number: 77wa
    text: |-
      1 De rechter kan bepalen dat het in [artikel 77w, derde lid][ref1], bedoelde programma geheel of ten dele komt te
      bestaan uit een vorm van jeugdhulp als bedoeld in [artikel 1.1 van de Jeugdwet][ref2].

      2 Indien de rechter toepassing heeft gegeven aan het bepaalde in het eerste lid, doet de raad daarvan onverwijld
      mededeling aan de gecertificeerde instelling, bedoeld in [artikel 1.1 van de Jeugdwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77w
