  - number: '236'
    text: |-
      1 Hij die door enige handeling opzettelijk eens anders afstamming onzeker maakt, wordt, als schuldig aan
      verduistering van staat, gestraft met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vierde
      categorie.

      2 Ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten kan worden
      uitgesproken.

      3 Vervolging heeft niet plaats dan nadat een verzoek tot inroeping of tot betwisting van staat is gedaan en de
      burgerlijke rechter daarop een eindbeslissing heeft gegeven. Indien het verzoek echter door het stilzitten van
      partijen onvoldoende voortgang vindt, kan vervolging ook plaats hebben nadat de burgerlijke rechter heeft beslist
      dat er een begin van bewijs is.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '237'
    text: |-
      1 Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie wordt gestraft:

      1°. hij die opzettelijk een dubbel huwelijk aangaat;

      2°. hij die een huwelijk aangaat, wetende dat de wederpartij daardoor een dubbel huwelijk aangaat.

      2 Indien hij die opzettelijk een dubbel huwelijk aangaat, aan de wederpartij zijn gehuwde staat heeft verzwegen,
      wordt hij gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.

      3 Ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten kan worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel237
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '238'
    text: |-
      De ongehuwde die een huwelijk aangaat, opzettelijk aan de wederpartij verzwijgende dat daartegen enig wettig
      beletsel bestaat, wordt, indien op grond van dat beletsel de nietigheid van het huwelijk is uitgesproken, gestraft
      met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel238
  - number: '239'
    text: |-
      1 In deze titel wordt onder degene die met een persoon seksuele handelingen verricht mede verstaan: degene die een
      persoon seksuele handelingen laat verrichten met diegene, met zichzelf of met een derde, dan wel degene die een
      persoon seksuele handelingen laat ondergaan door een derde.

      2 In deze titel wordt onder degene die met een kind seksuele handelingen verricht mede verstaan: degene die een
      kind seksuele handelingen laat verrichten met diegene, met zichzelf of met een derde, dan wel degene die een kind
      seksuele handelingen laat ondergaan door een derde.

      3 In deze titel wordt onder visuele weergave mede verstaan: gegevens die geschikt zijn om een visuele weergave te
      vormen of een gegevensdrager bevattende gegevens die geschikt zijn om een visuele weergave te vormen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel239
  - number: '240'
    text: |-
      Als schuldig aan schuldaanranding wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de
      vierde categorie, degene die met een persoon seksuele handelingen verricht terwijl diegene ernstige reden heeft om
      te vermoeden dat bij die persoon daartoe de wil ontbreekt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel240
  - number: '241'
    text: |-
      1 Als schuldig aan opzetaanranding wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vierde categorie, degene die met een persoon seksuele handelingen verricht terwijl diegene weet dat bij die persoon
      daartoe de wil ontbreekt.

      2 Als schuldig aan gekwalificeerde opzetaanranding wordt gestraft met gevangenisstraf van ten hoogste acht jaren
      of geldboete van de vijfde categorie, degene die zich schuldig maakt aan het misdrijf omschreven in het eerste lid,
      voorafgegaan door, vergezeld van of gevolgd door dwang, geweld, of bedreiging.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel241
  - number: '242'
    text: |-
      Als schuldig aan schuldverkrachting wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van
      de vierde categorie, degene die met een persoon seksuele handelingen verricht, welke handelingen bestaan uit of
      mede bestaan uit het seksueel binnendringen van het lichaam, terwijl diegene ernstige reden heeft om te vermoeden
      dat bij die persoon daartoe de wil ontbreekt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel242
  - number: '243'
    text: |-
      1 Als schuldig aan opzetverkrachting wordt gestraft met gevangenisstraf van ten hoogste negen jaren of geldboete
      van de vijfde categorie, degene die met een persoon seksuele handelingen verricht, welke handelingen bestaan uit
      of mede bestaan uit het seksueel binnendringen van het lichaam, terwijl diegene weet dat bij die persoon daartoe de
      wil ontbreekt.

      2 Als schuldig aan gekwalificeerde opzetverkrachting wordt gestraft met gevangenisstraf van ten hoogste twaalf
      jaren of geldboete van de vijfde categorie, degene die zich schuldig maakt aan het misdrijf omschreven in het
      eerste lid, voorafgegaan door, vergezeld van of gevolgd door dwang, geweld of bedreiging.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel243
  - number: '244'
    text: |-
      Voor de toepassing van de misdrijven omschreven in de [artikelen 240 tot met 243][ref1] ontbreekt bij een persoon
      in ieder geval de wil tot seksuele handelingen indien diegene in een staat van bewusteloosheid, verminderd
      bewustzijn of lichamelijke onmacht verkeert of een zodanige psychische stoornis, psychogeriatrische aandoening
      of verstandelijke handicap heeft dat deze niet of onvolkomen in staat is een wil te bepalen of kenbaar te maken
      omtrent de seksuele handelingen of daartegen weerstand te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel240
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '240'
  - number: '245'
    text: |-
      1 Als schuldig aan aanranding in de leeftijdscategorie van zestien tot achttien jaren wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie, degene die met een kind in de
      leeftijd van zestien tot achttien jaren seksuele handelingen verricht:

      a. indien het feit wordt begaan jegens een kind van diegene, jegens een kind dat wordt verzorgd of opgevoed als
      behorend tot het gezin van diegene, jegens een kind waarover diegene het gezag uitoefent of jegens een anderszins
      aan de zorg, waakzaamheid of opleiding van diegene toevertrouwd kind of jegens een aan diegene ondergeschikt kind;

      b. indien het feit wordt begaan jegens een kind in een bijzonder kwetsbare positie, waaronder in ieder geval
      wordt verstaan een bijzonder kwetsbare positie ten gevolge van een psychische stoornis dan wel verstandelijke of
      lichamelijke handicap, een situatie van afhankelijkheid of een staat van lichamelijke of geestelijke onmacht;

      c. indien het feit wordt begaan met misbruik van uit feitelijke verhoudingen voortvloeiend overwicht, met
      gebruikmaking van giften of beloften van geld of goed of met misleiding; of

      d. indien dat kind zich beschikbaar stelt tot het verrichten van seksuele handelingen met een derde tegen betaling.

      2 Als schuldig aan gekwalificeerde aanranding in de leeftijdscategorie van zestien tot achttien jaren wordt
      gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie, degene die zich
      schuldig maakt aan het misdrijf omschreven in het eerste lid, voorafgegaan door, vergezeld van of gevolgd door
      dwang, geweld of bedreiging.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel245
  - number: '246'
    text: |-
      1 Als schuldig aan verkrachting in de leeftijdscategorie van zestien tot achttien jaren wordt gestraft met
      gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, degene die met een kind in
      de leeftijd van zestien tot achttien jaren seksuele handelingen verricht, welke handelingen bestaan uit of mede
      bestaan uit het seksueel binnendringen van het lichaam:

      a. indien het feit wordt begaan jegens een kind van diegene, van een kind dat wordt verzorgd of opgevoed als
      behorend tot het gezin van diegene, van een kind waarover diegene het gezag uitoefent of van een anderszins aan de
      zorg, waakzaamheid of opleiding van diegene toevertrouwd kind of van een aan diegene ondergeschikt kind;

      b. indien het feit wordt begaan jegens een kind in een bijzonder kwetsbare positie, waaronder in ieder geval
      wordt verstaan een bijzonder kwetsbare positie ten gevolge van een psychische stoornis dan wel verstandelijke of
      lichamelijke handicap, een situatie van afhankelijkheid of een staat van lichamelijke of geestelijke onmacht;

      c. indien het feit wordt begaan met misbruik van uit feitelijke verhoudingen voortvloeiend overwicht, met
      gebruikmaking van giften of beloften van geld of goed of met misleiding; of

      d. indien dat kind zich beschikbaar stelt tot het verrichten van seksuele handelingen met een derde tegen betaling.

      2 Als schuldig aan gekwalificeerde verkrachting in de leeftijdscategorie van zestien tot achttien jaren wordt
      gestraft met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, degene die zich
      schuldig maakt aan het misdrijf omschreven in het eerste lid, voorafgegaan door, vergezeld van of gevolgd door
      dwang, geweld of bedreiging.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel246
  - number: '247'
    text: |-
      1 Als schuldig aan aanranding in de leeftijdscategorie van twaalf tot zestien jaren wordt gestraft met
      gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie, degene die met een kind in de
      leeftijd van twaalf tot zestien jaren seksuele handelingen verricht.

      2 Als schuldig aan gekwalificeerde aanranding in de leeftijdscategorie van twaalf tot zestien jaren wordt gestraft
      met gevangenisstraf van ten hoogste tien jaren en acht maanden of geldboete van de vijfde categorie, degene die
      zich schuldig maakt aan het misdrijf omschreven in het eerste lid, voorafgegaan door, vergezeld van of gevolgd door
      dwang, geweld of bedreiging.

      3 Niet strafbaar is degene die als leeftijdsgenoot de in het eerste lid bedoelde gedragingen begaat in het kader
      van een gelijkwaardige situatie tussen diegene en dat kind.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel247
  - number: '248'
    text: |-
      1 Als schuldig aan verkrachting in de leeftijdscategorie van twaalf tot zestien jaren wordt gestraft met
      gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, degene die met een kind in de
      leeftijd van twaalf tot zestien jaren seksuele handelingen verricht, welke handelingen bestaan uit of mede bestaan
      uit het seksueel binnendringen van het lichaam.

      2 Als schuldig aan gekwalificeerde verkrachting in de leeftijdscategorie van twaalf tot zestien jaren wordt
      gestraft met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, degene die zich
      schuldig maakt aan het misdrijf omschreven in het eerste lid, voorafgegaan door, vergezeld van of gevolgd door
      dwang, geweld of bedreiging.

      3 Niet strafbaar is degene die als leeftijdsgenoot de in het eerste lid bedoelde gedragingen begaat in het kader
      van een gelijkwaardige situatie tussen diegene en dat kind.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel248
  - number: '249'
    text: |-
      1 Als schuldig aan aanranding in de leeftijdscategorie beneden twaalf jaren wordt gestraft met gevangenisstraf van
      ten hoogste tien jaren of geldboete van de vijfde categorie, degene die met een kind beneden de leeftijd van twaalf
      jaren seksuele handelingen verricht.

      2 Als schuldig aan gekwalificeerde aanranding in de leeftijdscategorie beneden twaalf jaren wordt gestraft met
      gevangenisstraf van ten hoogste dertien jaren en vier maanden of geldboete van de vijfde categorie, degene die
      zich schuldig maakt aan het misdrijf omschreven in het eerste lid, voorafgegaan door, vergezeld van of gevolgd door
      dwang, geweld of bedreiging.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel249
  - number: '250'
    text: |-
      1 Als schuldig aan verkrachting in de leeftijdscategorie beneden twaalf jaren wordt gestraft met gevangenisstraf
      van ten hoogste vijftien jaren of geldboete van de vijfde categorie, degene die met een kind beneden de leeftijd
      van twaalf jaren seksuele handelingen verricht, welke handelingen bestaan uit of mede bestaan uit het seksueel
      binnendringen van het lichaam.

      2 Als schuldig aan gekwalificeerde verkrachting in de leeftijdscategorie beneden twaalf jaren wordt gestraft met
      gevangenisstraf van ten hoogste achttien jaren of geldboete van de vijfde categorie, degene die zich schuldig maakt
      aan het misdrijf omschreven in het eerste lid, voorafgegaan door, vergezeld van of gevolgd door dwang, geweld of
      bedreiging.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel250
  - number: 250a
    text: |-
      Degene die zich of een ander opzettelijk gelegenheid, middelen of inlichtingen verschaft of tracht te verschaffen
      tot het plegen van een misdrijf als omschreven in de [artikelen 247 tot en met 250][ref1], dan wel zich kennis of
      vaardigheden daartoe verwerft of een ander bijbrengt, wordt gestraft met gevangenisstraf van ten hoogste vier jaren
      of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel247
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel250a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '247'
  - number: '251'
    text: |-
      1 Degene die een kind beneden de leeftijd van zestien jaren of een persoon die zich voordoet als een kind beneden
      de leeftijd van zestien jaren:

      a. indringend mondeling of schriftelijk seksueel benadert op een wijze die schadelijk te achten is voor kinderen
      beneden de leeftijd van zestien jaren;

      b. getuige doet zijn van een handeling of een visuele weergave van seksuele aard of met een onmiskenbaar seksuele
      strekking op een wijze die schadelijk te achten is voor kinderen beneden de leeftijd van zestien jaren; of

      c. een ontmoeting voorstelt voor seksuele doeleinden en enige handeling onderneemt tot het verwezenlijken van die
      ontmoeting,

      wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.

      2 Met gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie wordt gestraft
      degene die de gedragingen, bedoeld in het eerste lid, begaat ten aanzien van een kind in de leeftijd van zestien
      tot achttien jaren of een persoon die zich als zodanig voordoet onder de in [artikel 245, eerste lid][ref1],
      omschreven omstandigheden.

      3 Niet strafbaar is degene die als leeftijdsgenoot de in het eerste lid, aanhef en onder c, bedoelde gedraging
      begaat in het kader van een gelijkwaardige situatie tussen diegene en dat kind, voor zover dat kind ten minste de
      leeftijd van twaalf jaren heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel245
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel251
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '245'
  - number: '252'
    text: |-
      Degene die een visuele weergave van seksuele aard of met een onmiskenbaar seksuele strekking waarbij een persoon
      die kennelijk de leeftijd van achttien jaren nog niet heeft bereikt is betrokken of schijnbaar is betrokken,
      verspreidt, aanbiedt, openlijk tentoonstelt, vervaardigt, invoert, doorvoert, uitvoert, verwerft, in bezit heeft of
      zich de toegang daartoe verschaft, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel252
  - number: '253'
    text: |-
      Degene die opzettelijk een voorstelling bijwoont waarin een persoon beneden de leeftijd van achttien jaren is
      betrokken of schijnbaar is betrokken bij handelingen van seksuele aard of met een onmiskenbaar seksuele strekking
      dan wel waarin een visuele weergave als bedoeld in [artikel 252][ref1] wordt getoond, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel252
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel253
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '252'
  - number: 253a
    text: |-
      Degene die een voorwerp met een uiterlijke verschijningsvorm van een kind of van een lichaamsdeel van een kind dat
      de leeftijd van zestien jaren nog niet heeft bereikt, dat bestemd is om seksuele handelingen mee te verrichten,
      verspreidt, aanbiedt, openlijk tentoonstelt, vervaardigt, invoert, doorvoert, uitvoert, verwerft of in bezit heeft,
      wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel253a
  - number: '254'
    text: |-
      1 De op het misdrijf gestelde gevangenisstraf kan met drie jaren worden verhoogd in de onder a tot en met e
      omschreven gevallen:

      a. indien een in de [artikelen 240 tot en met 253][ref1] omschreven feit wordt begaan door twee of meer verenigde
      personen; of

      b. in geval van de [artikelen 240 tot en met 243][ref2]:

      1°. indien het feit wordt begaan in de hoedanigheid van ambtenaar, waarmee wordt gelijkgesteld een persoon in de
      openbare dienst van een vreemde staat die in Nederland op door het volkenrecht toegelaten wijze zijn bediening
      uitoefent, jegens een persoon die aan het gezag van de schuldige is onderworpen of aan de waakzaamheid van de
      schuldige is toevertrouwd; of

      2°. indien de schuldige werkzaam is in een penitentiaire inrichting, een instelling voor verpleging van ter
      beschikking gestelden en of een instelling voor gezondheidszorg of maatschappelijke zorg en het feit wordt begaan
      jegens een persoon die aan het gezag van de schuldige is onderworpen of aan de waakzaamheid van de schuldige is
      toevertrouwd die in die inrichting of instelling is opgenomen of wordt behandeld; of

      3°. indien de schuldige werkzaam is in de gezondheidszorg of de maatschappelijke zorg en het feit wordt begaan
      jegens een persoon die zich voor hulp of zorg tot de schuldige heeft gewend; of

      c. indien van het begaan van één in de [artikelen 245 tot en met 253a][ref3] omschreven feiten een beroep of
      gewoonte wordt gemaakt; of

      d. indien een in de [artikelen 247 tot en met 250][ref4] en [251 tot en met 253][ref5] omschreven feit wordt begaan
      onder de in [artikel 245, eerste lid, onder a of b][ref6], omschreven omstandigheden; of

      e. indien een in de [artikelen 247 tot en met 250][ref7] omschreven feit wordt begaan met een kind dat zich
      beschikbaar stelt tot het verrichten van seksuele handelingen met een derde tegen betaling.

      2 De op het misdrijf gestelde gevangenisstraf kan met drie jaren worden verhoogd indien één van de in de
      [artikelen 241][ref8], [243][ref9] en [245 tot en met 250][ref10] omschreven misdrijven zwaar lichamelijk letsel
      tot gevolg heeft of daarvan levensgevaar voor een ander te duchten is.

      3 Indien één van de in de [artikelen 241][ref11], [243][ref12] en [245 tot en met 250][ref13] omschreven misdrijven
      de dood tot gevolg heeft, wordt levenslange gevangenisstraf of tijdelijke van ten hoogste dertig jaren of geldboete
      van de vijfde categorie opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel240
