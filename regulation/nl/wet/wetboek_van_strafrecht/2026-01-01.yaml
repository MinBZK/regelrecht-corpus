  - number: 60a
    text: |-
      Bij samenloop op de wijze in de [artikelen 57][ref1] en [58][ref2] bedoeld, geldt voor de maatregel
      genoemd in [artikel 36f][ref3] dat de vervangende vrijheidsstraffen gezamenlijk het maximum, bepaald in
      [artikel 24c, derde lid][ref4], niet mogen overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel58
