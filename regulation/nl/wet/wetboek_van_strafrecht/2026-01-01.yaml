  - number: '365'
    text: |-
      De ambtenaar die door misbruik van gezag iemand dwingt iets te doen, niet te doen of te dulden, wordt gestraft met
      gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel365
  - number: '366'
    text: |-
      De ambtenaar die in de uitoefening van zijn bediening, als verschuldigd aan hemzelf, aan een ander ambtenaar of aan
      enige openbare kas, vordert of ontvangt of bij een uitbetaling terughoudt hetgeen hij weet dat niet verschuldigd
      is, wordt, als schuldig aan knevelarij, gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel366
  - number: '367'
    text: |-
      1 De ambtenaar die, belast met de bewaking van iemand die op openbaar gezag of krachtens rechterlijke uitspraak
      of beschikking van de vrijheid is beroofd, hem opzettelijk laat ontsnappen of bevrijdt of bij zijn bevrijding of
      zelfbevrijding behulpzaam is, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de
      vierde categorie.

      2 Indien de ontsnapping, bevrijding of zelfbevrijding aan zijn schuld te wijten is, wordt hij gestraft met
      hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel367
  - number: '368'
    text: |-
      1 Met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie wordt gestraft:

      1°. de ambtenaar, met het opsporen van strafbare feiten belast, die opzettelijk niet voldoet aan de vordering
      om van een wederrechtelijke vrijheidsberoving te doen blijken of daarvan aan de hogere macht opzettelijk niet
      onverwijld kennis geeft;

      2°. de ambtenaar die, na in de uitoefening van zijn bediening kennis te hebben bekomen dat iemand op onwettige
      wijze van de vrijheid is beroofd, opzettelijk nalaat daarvan onverwijld kennis te geven aan een ambtenaar met het
      opsporen van strafbare feiten belast.

      2 De ambtenaar aan wiens schuld enig in dit artikel omschreven verzuim te wijten is, wordt gestraft met hechtenis
      van ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel368
  - number: '370'
    text: |-
      1 De ambtenaar die, met overschrijding van zijn bevoegdheid of zonder inachtneming van de bij de wet bepaalde
      vormen, in de woning of het besloten lokaal of erf, bij een ander in gebruik, diens ondanks binnentreedt of,
      wederrechtelijk aldaar vertoevende, zich niet op de vordering van of vanwege de rechthebbende aanstonds verwijdert,
      wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.

      2 Met gelijke straf wordt gestraft de ambtenaar die ter gelegenheid van het doorzoeken van plaatsen met
      overschrijding van zijn bevoegdheid of zonder inachtneming van de bij de wet bepaalde vormen, geschriften, boeken
      of andere papieren onderzoekt of in beslag neemt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel370
  - number: '371'
    text: |-
      1 De ambtenaar die, met overschrijding van zijn bevoegdheid, zich doet overleggen of in beslag neemt een aan
      enige openbare instelling van vervoer toevertrouwde brief, briefkaart, stuk of pakket, of een telegrafisch
      bericht dat zich in handen bevindt van een persoon belast met de dienst van een ten algemenen nutte gebezigde
      telegraafinrichting, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde
      categorie.

      2 Met dezelfde straf wordt gestraft de ambtenaar die, met overschrijding van zijn bevoegdheid, zich door een
      persoon werkzaam bij een aanbieder van een openbaar telecommunicatienetwerk of een openbare telecommunicatiedienst
      doet inlichten ter zake van enig verkeer dat over dat netwerk dan wel met gebruikmaking van die dienst is geschied.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel371
  - number: '372'
    text: |-
      De ambtenaar aan wie bij of krachtens [artikel 7, eerste, achtste of negende lid, van de Politiewet 2012][ref1] of
      [artikel 6, eerste lid, van de Wet op de bijzondere opsporingsdiensten][ref2] de bevoegdheid geweld te gebruiken
      is toegekend en aan wiens schuld het te wijten is dat hij het in zijn geweldsinstructie bepaalde schendt, wordt
      gestraft:

      1°. met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien het feit enig
      lichamelijk letsel ten gevolge heeft;

      2°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien het feit zwaar
      lichamelijk letsel ten gevolge heeft;

      3°. met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, indien het feit de dood
      ten gevolge heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019919#Artikel6
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel372
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0019919
        artikel: '6'
  - number: '373'
    text: |-
      Ten aanzien van [artikel 372][ref1] worden met de in dat artikel bedoelde ambtenaren aan wie
      bij of krachtens [artikel 7, eerste, achtste of negende lid, van de Politiewet 2012][ref2] of
      [artikel 6, eerste lid, van de Wet op de bijzondere opsporingsdiensten][ref3] de bevoegdheid geweld te gebruiken
      is toegekend, gelijkgesteld personen in de openbare dienst van een vreemde staat die in Nederland op door het
      volkenrecht toegelaten wijze hun bediening uitoefenen en aan wie de bevoegdheid geweld te gebruiken is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel372
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0019919#Artikel6
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel373
    references:
