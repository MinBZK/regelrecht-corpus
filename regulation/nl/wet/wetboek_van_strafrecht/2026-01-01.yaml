      1 Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft hij die
      opzettelijk en wederrechtelijk met een technisch hulpmiddel gegevens aftapt of opneemt die niet voor hem bestemd
      zijn en die worden verwerkt of overgedragen door middel van telecommunicatie of door middel van een geautomatiseerd
      werk.

      2 Het eerste lid is niet van toepassing op het aftappen of opnemen:

      1°. van door middel van een radio-ontvangapparaat ontvangen gegevens, tenzij om de ontvangst mogelijk te maken een
      bijzondere inspanning is geleverd of een niet toegestane ontvanginrichting is gebruikt.

      2°. door of in opdracht van de gerechtigde tot een voor de telecommunicatie gebezigde aansluiting, behoudens in
      geval van kennelijk misbruik;

      3°. ten behoeve van de goede werking van een openbaar telecommunicatienetwerk, ten behoeve van de strafvordering,
      dan wel ter uitvoering van de [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel139c
    references:
