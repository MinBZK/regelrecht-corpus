  - number: '77'
    text: |-
      1 Het recht tot strafvordering vervalt door de overdracht van de strafvervolging aan een vreemde staat
      overeenkomstig de bepalingen van [Titel 3 van het Vijfde Boek van het Wetboek van Strafvordering](onbekend).

      2 In het geval, bedoeld in het eerste lid, herleeft het recht tot strafvordering, indien de autoriteiten van de
      staat die de strafvervolging hadden overgenomen op die beslissing terugkomen of mededelen dat geen strafvervolging
      wordt ingesteld dan wel een ingestelde vervolging is gestaakt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel77
  - number: 77a
    text: |-
      Ten aanzien van degene die ten tijde van het begaan van een strafbaar feit de leeftijd van twaalf jaren doch nog
      niet die van achttien jaren heeft bereikt, zijn de [artikelen 9, eerste tot en met vierde lid][ref1], [10][ref2],
      [14a tot en met 22d][ref3], [24b][ref4], [24c][ref5], [27 tot en met 36][ref6], [37a tot en met 38p][ref7],
      [43a tot en met 44][ref8] en [57 tot en met 62][ref9] niet van toepassing. In de plaats daarvan treden de
      bijzondere bepalingen vervat in de [artikelen 77d tot en met 77gg][ref10].


