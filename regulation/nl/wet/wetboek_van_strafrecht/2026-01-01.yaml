  - number: 176c
    text: |-
      1 Bij veroordeling wegens een der misdrijven omschreven in de [artikelen 157][ref1], [159][ref2], [160][ref3],
      [161bis][ref4], [161quater][ref5], [161sexies][ref6], [162][ref7], [162a][ref8], [164][ref9], [166][ref10],
      [168][ref11], [170][ref12], [172][ref13], [173a][ref14], [174][ref15], begaan met een terroristisch oogmerk,
      alsmede bij veroordeling wegens een der misdrijven omschreven in [artikel 176b][ref16], kan ontzetting van het in
      [artikel 28, eerste lid, onder 3°][ref17], vermelde recht worden uitgesproken.

      2 Bij veroordeling wegens het in [artikel 173a][ref18] omschreven misdrijf kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°, 2° en 4°][ref19], vermelde rechten worden uitgesproken en kan de schuldige
      worden ontzet van de uitoefening van het beroep waarin hij het misdrijf heeft gepleegd.


