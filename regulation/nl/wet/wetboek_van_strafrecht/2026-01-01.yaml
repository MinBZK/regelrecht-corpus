        artikel: 282b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '96'
  - number: '283'
    text: |-
      1 Hij aan wiens schuld te wijten is dat iemand wederrechtelijk van de vrijheid beroofd wordt of beroofd blijft,
      wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de tweede categorie.

      2 Indien het feit zwaar lichamelijk letsel ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van
      ten hoogste een jaar of geldboete van de derde categorie.

      3 Indien het feit de dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel283
  - number: '284'
    text: |-
      1 Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft:

      1°. hij die een ander door geweld of enige andere feitelijkheid of door bedreiging met geweld of enige andere
      feitelijkheid, gericht hetzij tegen die ander hetzij tegen derden, wederrechtelijk dwingt iets te doen, niet te
      doen of te dulden;

      2°. hij die een ander door bedreiging met smaad of smaadschrift dwingt iets te doen, niet te doen of te dulden.

      2 In het geval onder 2° omschreven wordt het misdrijf niet vervolgd dan op klacht van hem tegen wie het gepleegd
      is.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel284
  - number: 284a
    text: |-
      Hij die een ander door bedreiging met diefstal of afpersing van splijtstof, als bedoeld in
      [artikel 1, eerste lid, onder ][ref1] (*Stb.* 1963, 82), gericht tegen die ander of tegen derden wederrechtelijk
      dwingt iets te doen, niet te doen of te dulden, wordt gestraft met gevangenisstraf van ten hoogste een jaar en zes
      maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel284a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '1'
  - number: '285'
    text: |-
      1 Bedreiging met openlijk in vereniging geweld plegen tegen personen of goederen, met geweld tegen een
      internationaal beschermd persoon of diens beschermde goederen, met enig misdrijf waardoor gevaar voor de algemene
      veiligheid van personen of goederen of gemeen gevaar voor de verlening van diensten ontstaat, met de misdrijven
      omschreven in de [artikelen 241][ref1] en [243][ref2], met enig misdrijf tegen het leven gericht, met gijzeling,
      met zware mishandeling of met brandstichting, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of
      geldboete van de vijfde categorie.

      2 Indien deze bedreiging schriftelijk en onder een bepaalde voorwaarde geschiedt, wordt ze gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.

      3 Bedreiging met een terroristisch misdrijf wordt gestraft met gevangenisstraf van ten hoogste zes jaren of
      geldboete van de vijfde categorie.

      4 Indien het feit, omschreven in het eerste, tweede of derde lid, wordt gepleegd met het oogmerk om een
      terroristisch misdrijf voor te bereiden of gemakkelijk te maken, wordt de op het feit gestelde gevangenisstraf met
      een derde verhoogd.

      5 Indien het feit, omschreven in het eerste, tweede of derde lid wordt gepleegd tegen een persoon in diens
      hoedanigheid van Minister, Staatssecretaris, commissaris van de Koning, gedeputeerde, burgemeester, wethouder,
      lid van een algemeen vertegenwoordigend orgaan, rechterlijk ambtenaar, advocaat, journalist of publicist in het
      kader van nieuwsgaring, ambtenaar van politie of buitengewoon opsporingsambtenaar wordt de op het feit gestelde
      gevangenisstraf met een derde verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel241
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel243
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel285
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '241'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '243'
  - number: 285a
    text: |-
      1 Hij die opzettelijk mondeling, door gebaren, bij geschrift of afbeelding zich jegens een persoon uit, kennelijk
      om diens vrijheid om naar waarheid of geweten ten overstaan van een rechter of ambtenaar een verklaring af
      te leggen te beïnvloeden, terwijl hij weet of ernstige reden heeft te vermoeden dat die verklaring zal worden
      afgelegd, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.

      2 Met rechter of ambtenaar wordt gelijkgesteld: een rechter bij onderscheidenlijk een persoon in de openbare dienst
      van een internationaal gerecht dat zijn rechtsmacht ontleent aan een verdrag waarbij het Koninkrijk partij is en
      een persoon in de openbare dienst van een vreemde staat die in Nederland op door het volkenrecht toegelaten wijze
      zijn bediening uitoefent.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel285a
  - number: 285b
    text: |-
      1 Hij, die wederrechtelijk stelselmatig opzettelijk inbreuk maakt op eens anders persoonlijke levenssfeer met het
      oogmerk die ander te dwingen iets te doen, niet te doen of te dulden dan wel vrees aan te jagen wordt, als schuldig
      aan belaging, gestraft met een gevangenisstraf van ten hoogste drie jaren of een geldboete van de vierde categorie.

      2 Vervolging vindt niet plaats dan op klacht van hem tegen wie het misdrijf is begaan.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel285b
  - number: 285c
    text: |-
      Hij die opzettelijk een persoon buiten of naar Nederland lokt met het oogmerk ten aanzien van die persoon een in
      [artikel 284][ref1] omschreven misdrijf te plegen, wordt gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel284
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel285c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '284'
  - number: 285d
    text: |-
      1 Degene die zich persoonsgegevens van een ander of een derde verschaft, deze gegevens verspreidt of anderszins
      ter beschikking stelt met het oogmerk om die ander vrees aan te jagen dan wel aan te laten jagen, ernstige overlast
      aan te doen dan wel aan te laten doen of hem in de uitoefening van zijn ambt of beroep ernstig te hinderen dan wel
      ernstig te laten hinderen, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vijfde
      categorie.

      2 Indien het feit, omschreven in het eerste lid, wordt gepleegd tegen een persoon in diens hoedanigheid van
      Minister, Staatssecretaris, commissaris van de Koning, gedeputeerde, burgemeester, wethouder, lid van een algemeen
      vertegenwoordigend orgaan, rechterlijk ambtenaar, advocaat, journalist of publicist in het kader van nieuwsgaring,
      ambtenaar van politie of buitengewoon opsporingsambtenaar wordt de op het feit gestelde gevangenisstraf met een
      derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel285d
  - number: '286'
    text: |-
      Bij veroordeling wegens een der in [artikelen 274-282][ref1] en in het [eerste en tweede lid van artikel 285][ref2]
      omschreven misdrijven, kan ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref3], vermelde
      rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel274
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel285
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel286
