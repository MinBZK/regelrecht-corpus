  - number: '281'
    text: |-
      1 Als schuldig aan schaking wordt gestraft:

      1°. met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie, hij die een minderjarige
      vrouw, zonder de wil van haar ouders of voogden doch met haar toestemming, wegvoert, met het oogmerk om zich haar
      bezit in of buiten echt te verzekeren;

      2°. met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, hij die een vrouw door
      list, geweld of bedreiging met geweld wegvoert, met het oogmerk om zich haar bezit in of buiten echt te verzekeren.

      2 Geen vervolging heeft plaats dan op klacht.

      3 De klacht geschiedt:

      a. indien de vrouw tijdens de wegvoering minderjarig is, hetzij door haarzelf, hetzij door iemand wiens toestemming
      zij tot het aangaan van een huwelijk behoeft;

      b. indien zij tijdens de wegvoering meerderjarig is, hetzij door haarzelf, hetzij door haar echtgenoot.

      4 Indien de schaker met de weggevoerde een huwelijk heeft gesloten, heeft geen veroordeling plaats, dan nadat de
      nietigheid van het huwelijk is uitgesproken.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel281
  - number: '282'
    text: |-
      1 Hij die opzettelijk iemand wederrechtelijk van de vrijheid berooft of beroofd houdt, wordt gestraft met
      gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.

      2 Indien het feit zwaar lichamelijk letsel ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van
      ten hoogste negen jaren of geldboete van de vijfde categorie.

      3 Indien het feit de dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste twaalf jaren of
      geldboete van de vijfde categorie.

      4 De in dit artikel bepaalde straffen zijn ook van toepassing op hem die opzettelijk tot de wederrechtelijke
      vrijheidsberoving een plaats verschaft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel282
  - number: 282a
    text: |-
      1 Hij die opzettelijk iemand wederrechtelijk van de vrijheid berooft of beroofd houdt met het oogmerk een ander te
      dwingen iets te doen of niet te doen wordt als schuldig aan gijzeling gestraft met gevangenisstraf van ten hoogste
      vijftien jaren of geldboete van de vijfde categorie.

      2 Indien het feit de dood ten gevolge heeft wordt hij gestraft met levenslange gevangenisstraf of tijdelijke van
      ten hoogste dertig jaren of geldboete van de vijfde categorie.

      3 Het [vierde lid van artikel 282][ref1] is toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel282
