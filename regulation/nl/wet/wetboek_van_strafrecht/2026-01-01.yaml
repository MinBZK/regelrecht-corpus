  - number: 83a
    text: |-
      Onder terroristisch oogmerk wordt verstaan het oogmerk om de bevolking of een deel der bevolking van een land
      ernstige vrees aan te jagen, dan wel een overheid of internationale organisatie wederrechtelijk te dwingen iets
      te doen, niet te doen of te dulden, dan wel de fundamentele politieke, constitutionele, economische of sociale
      structuren van een land of een internationale organisatie ernstig te ontwrichten of te vernietigen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel83a
  - number: 83b
    text: |-
      Onder misdrijf ter voorbereiding of vergemakkelijking van een terroristisch misdrijf wordt verstaan elk
      van de misdrijven omschreven in de [artikelen 131, tweede lid][ref1], [132, derde lid][ref2], [134a][ref3],
      [138b, vierde lid][ref4], [197a, zevende lid][ref5], [205, derde lid][ref6], [225, derde lid][ref7],
      [285, vierde lid][ref8], [311, eerste lid, onderdeel 6°][ref9], [312, tweede lid, onderdeel 5°][ref10],
      [317, derde lid][ref11], jo. [312, tweede lid, onder 5°][ref12], [318, tweede lid][ref13], [322a][ref14],
      [326, tweede lid][ref15], [354a][ref16] en [421][ref17].


