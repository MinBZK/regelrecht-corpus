  - number: 137d
    text: |-
      1 Hij die in het openbaar, mondeling of bij geschrift of afbeelding, aanzet tot haat tegen of discriminatie
      van mensen of gewelddadig optreden tegen persoon of goed van mensen wegens hun ras, hun godsdienst of
      levensovertuiging, hun geslacht, hun seksuele gerichtheid of hun handicap, wordt gestraft met gevangenisstraf van
      ten hoogste twee jaren of geldboete van de vierde categorie.

      2 Indien het feit wordt gepleegd door een persoon die daarvan een beroep of gewoonte maakt of door twee of meer
      verenigde personen wordt gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel137d
  - number: 137e
    text: |-
      1 Hij die, anders dan ten behoeve van zakelijke berichtgeving:

      1°. een uitlating openbaar maakt die, naar hij weet of redelijkerwijs moet vermoeden, voor een groep mensen wegens
      hun ras, hun godsdienst of levensovertuiging, hun seksuele gerichtheid of hun handicap beledigend is, of aanzet tot
      haat tegen of discriminatie van mensen of gewelddadig optreden tegen persoon of goed van mensen wegens hun ras, hun
      godsdienst of levensovertuiging, hun geslacht, hun seksuele gerichtheid of hun handicap;

      2°. een voorwerp waarin, naar hij weet of redelijkerwijs moet vermoeden, zulk een uitlating is vervat, aan
      iemand, anders dan op diens verzoek, doet toekomen, dan wel verspreidt of ter openbaarmaking van die uitlating of
      verspreiding in voorraad heeft;

      wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.

      2 Indien het feit wordt gepleegd door een persoon die daarvan een beroep of gewoonte maakt of door twee of meer
      verenigde personen wordt gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel137e
  - number: 137f
    text: |-
      Hij die deelneemt of geldelijke of andere stoffelijke steun verleent aan activiteiten gericht op discriminatie
      van mensen wegens hun ras, hun godsdienst, hun levensovertuiging, hun geslacht, hun seksuele gerichtheid of hun
      handicap, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel137f
  - number: 137g
    text: |-
      1 Hij die, in de uitoefening van een ambt, beroep of bedrijf personen opzettelijk discrimineert wegens hun ras,
      wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.

      2 Indien het feit wordt gepleegd door een persoon die daarvan een gewoonte maakt of door twee of meer verenigde
      personen wordt gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel137g
  - number: 137h
    text: |-
      Indien de schuldige een van de strafbare feiten, omschreven in de [artikelen 131 tot en met 134][ref1] en
      [137c tot en met 137g][ref2], in zijn beroep begaat, kan hij van de uitoefening van dat beroep worden ontzet.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel137c
