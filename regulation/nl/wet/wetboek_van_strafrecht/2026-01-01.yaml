  - number: 38a
    text: |-
      1 De voorwaarden bedoeld in het eerste lid van [artikel 38][ref1] kunnen inhouden dat de ter beschikking gestelde
      zich in een door de rechter aangewezen instelling laat opnemen, zich onder behandeling stelt van een in de
      uitspraak aangewezen deskundige, of door de behandelend arts voorgeschreven geneesmiddelen inneemt dan wel gedoogt
      dat deze door de behandelend arts aan hem worden toegediend.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de eisen waaraan een door de
      rechter aan te wijzen instelling moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38
