  - number: '179'
    text: |-
      1 Hij die door geweld of enige andere feitelijkheid of bedreiging met geweld of enige andere feitelijkheid een
      ambtenaar dwingt tot het volvoeren van een ambtsverrichting of het nalaten van een rechtmatige ambtsverrichting,
      wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.

      2 Bij veroordeling wegens het misdrijf omschreven in het eerste lid kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten worden uitgesproken en kan de schuldige
      worden ontzet van de uitoefening van het beroep waarin hij het misdrijf heeft gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '180'
    text: |-
      Hij die zich met geweld of bedreiging met geweld verzet tegen een ambtenaar werkzaam in de rechtmatige uitoefening
      van zijn bediening, of tegen personen die hem daarbij krachtens wettelijke verplichting of op zijn verzoek
      bijstand verlenen, wordt als schuldig aan wederspannigheid gestraft met gevangenisstraf van ten hoogste een jaar of
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel180
  - number: '181'
    text: |-
      De dwang en de wederspannigheid in de [artikelen 179][ref1] en [180][ref2] omschreven worden gestraft:

      1°. met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vierde categorie, indien het misdrijf of de
      daarmede gepaard gaande feitelijkheden enig lichamelijk letsel ten gevolge hebben;

      2°. met gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van de vijfde categorie, indien zij
      zwaar lichamelijk letsel ten gevolge hebben;

      3°. met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien zij de dood ten
      gevolge hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel180
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel181
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '180'
  - number: '182'
    text: |-
      1 De dwang en de wederspannigheid in de [artikelen 179][ref1] en [180][ref2] omschreven, door twee of meer personen
      met verenigde krachten gepleegd, worden gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vierde categorie.

      2 De schuldige wordt gestraft:

      1°. met gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van de vijfde categorie, indien
      het door hem gepleegde misdrijf of de daarbij door hem gepleegde feitelijkheden enig lichamelijk letsel ten gevolge
      hebben;

      2°. met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien zij zwaar
      lichamelijk letsel ten gevolge hebben;

      3°. met gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie, indien zij de dood ten
      gevolge hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel180
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel182
    references:
