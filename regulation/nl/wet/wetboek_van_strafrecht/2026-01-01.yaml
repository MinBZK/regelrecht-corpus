  - number: 77m
    text: |-
      1 Het vonnis of de strafbeschikking vermeldt of de taakstraf bestaat uit een werkstraf, een leerstraf of een
      combinatie van beide, alsmede het aantal uren dat de straf zal duren. Het vonnis of de strafbeschikking kan de aard
      en inhoud van de te verrichten werkzaamheden of het te volgen leerproject vermelden.

      2 De duur van de door de rechter opgelegde onbetaalde arbeid of van de arbeid tot herstel van de door het strafbare
      feit aangerichte schade, is ten hoogste tweehonderd uren.

      3 De duur van een leerproject is ten hoogste tweehonderd uren.

      4 Indien meer dan één taakstraf wordt opgelegd, bedraagt het totaal aantal uren niet meer dan tweehonderdenveertig.

      5 [Artikel 27, eerste en vierde lid][ref1], is bij veroordeling tot een taakstraf door de rechter van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel27
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel77m
