preamble:
  text: |-
    Wij WILLEM III, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg,
    enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is een nieuw Wetboek van Strafrecht vast te stellen;

    Zoo is het, dat Wij, den Raad van State gehoord en met gemeen overleg der Staten-Generaal, hebben goedgevonden
    en verstaan, gelijk Wij goedvinden en verstaan bij deze, vast te stellen de navolgende bepalingen, welke zullen
    uitmaken het Wetboek van Strafrecht.
  url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Geen feit is strafbaar dan uit kracht van een daaraan voorafgegane wettelijke strafbepaling.

      2 Bij verandering in de wetgeving na het tijdstip waarop het feit begaan is, worden de voor de verdachte gunstigste
      bepalingen toegepast.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel1
  - number: '2'
    text: De Nederlandse strafwet is toepasselijk op ieder die zich in Nederland aan enig strafbaar feit schuldig maakt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel2
  - number: '3'
    text: |-
      De Nederlandse strafwet is toepasselijk op ieder die zich buiten Nederland aan boord van een Nederlands vaartuig of
      luchtvaartuig aan enig strafbaar feit schuldig maakt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel3
  - number: '4'
    text: |-
      De Nederlandse strafwet is toepasselijk op ieder die zich buiten Nederland schuldig maakt:

      a. aan een van de misdrijven omschreven in de [artikelen 92 tot en met 96][ref1], [97a][ref2],
      [98 tot en met 98d][ref3], [105][ref4] en [108 tot en met 110][ref5];

      b. aan een van de misdrijven omschreven in de [artikelen 131 tot en met 134][ref6] en [189][ref7], indien het
      strafbare feit of het misdrijf waarvan in die artikelen wordt gesproken, een misdrijf is als onder a bedoeld;

      c. aan een van de misdrijven omschreven in de [artikelen 208 tot en met 214][ref8] en [216 tot en met 223][ref9];

      d. aan een van de misdrijven omschreven in de [artikelen 225 tot en met 227b][ref10] en [232][ref11] indien het
      strafbare feit is gepleegd tegen een Nederlandse overheidsinstelling;

      e. aan een van de misdrijven omschreven in de [artikelen 381 tot en met 385b][ref12], [409][ref13] en [410][ref14]
      of aan de overtreding omschreven in [artikel 446a][ref15];

      f. aan het misdrijf omschreven in [artikel 207a][ref16].


