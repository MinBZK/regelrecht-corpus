        bwb_id: BWBR0001854
        artikel: '28'
  - number: '340'
    text: |-
      Hij die in staat van faillissement is verklaard wordt gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vijfde categorie, indien hij voor de intreding van het faillissement buitensporige uitgaven heeft
      gedaan, ten gevolge waarvan een of meer schuldeisers in hun verhaalsmogelijkheden zijn benadeeld.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel340
  - number: '341'
    text: |-
      1 Hij die in staat van faillissement is verklaard wordt gestraft met gevangenisstraf van ten hoogste zes
      jaren of geldboete van de vijfde categorie, indien hij, wetende dat hierdoor een of meer schuldeisers in hun
      verhaalsmogelijkheden worden benadeeld:

      1°. voor of tijdens het faillissement enig goed aan de boedel heeft onttrokken of onttrekt;

      2°. voor of tijdens het faillissement een van zijn schuldeisers op enige wijze wederrechtelijk heeft bevoordeeld
      of bevoordeelt.

      2 Met dezelfde straf wordt gestraft hij ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van
      toepassing is verklaard, indien hij wetende dat hierdoor een of meer schuldeisers in hun verhaalsmogelijkheden
      worden benadeeld:

      1°. voor of tijdens de toepassing van de schuldsaneringsregeling enig goed aan de boedel heeft onttrokken of
      onttrekt;

      2°. voor of tijdens de toepassing van de schuldsaneringsregeling een van zijn schuldeisers op enige wijze
      wederrechtelijk heeft bevoordeeld of bevoordeelt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel341
  - number: '342'
    text: |-
      Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vijfde categorie wordt gestraft de bestuurder of
      commissaris van een rechtspersoon die voor de intreding van het faillissement, indien dit is gevolgd, buitensporig
      middelen van de rechtspersoon heeft verbruikt, uitgegeven of vervreemd, dan wel hieraan heeft meegewerkt of
      daarvoor zijn toestemming heeft gegeven, ten gevolge waarvan een of meer schuldeisers in hun verhaalsmogelijkheden
      zijn benadeeld.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel342
  - number: '343'
    text: |-
      Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie wordt gestraft de bestuurder
      of commissaris van een rechtspersoon die wetende dat hierdoor een of meer schuldeisers van de rechtspersoon in hun
      verhaalsmogelijkheden worden benadeeld:

      1°. voor de intreding van het faillissement, indien dit is gevolgd, of tijdens het faillissement enig goed aan de
      boedel heeft onttrokken of onttrekt;

      2°. voor de intreding van het faillissement, indien dit is gevolgd, buitensporig middelen van de rechtspersoon
      heeft verbruikt, uitgegeven of vervreemd, dan wel hieraan heeft meegewerkt of daarvoor zijn toestemming heeft
      gegeven;

      3°. voor de intreding van het faillissement, indien dit is gevolgd, of tijdens het faillissement een van de
      schuldeisers van de rechtspersoon op enige wijze wederrechtelijk heeft bevoordeeld of bevoordeelt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel343
  - number: '344'
    text: |-
      1 Met gevangenisstraf van ten hoogste vier jaren en zes maanden of geldboete van de vijfde categorie wordt gestraft
      hij die in geval van een faillissement van een ander, of daaraan voorafgaand indien het faillissement is gevolgd,
      wetende dat hierdoor een of meer schuldeisers in hun verhaalsmogelijkheden worden benadeeld:

      1°. enig goed aan de boedel onttrekt of heeft onttrokken;

      2°. zich wederrechtelijk bevoordeelt of laat bevoordelen, dan wel zich wederrechtelijk heeft bevoordeeld of heeft
      laten bevoordelen.

      2 Met dezelfde straf wordt gestraft hij die in geval de schuldsaneringsregeling natuurlijke personen op een ander
      van toepassing is verklaard, of daaraan voorafgaand indien de toepassing wordt uitgesproken, wetende dat hierdoor
      een of meer schuldeisers in hun verhaalsmogelijkheden worden benadeeld:

      1°. enig goed aan de boedel onttrekt of heeft onttrokken;

      2°. zich wederrechtelijk bevoordeelt of laat bevoordelen, dan wel zich wederrechtelijk heeft bevoordeeld of zich
      heeft laten bevoordelen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel344
  - number: 344a
    text: |-
      1 Hij die in staat van faillissement is verklaard, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of
      geldboete van de vijfde categorie:

      1°. indien hij desgevraagd opzettelijk niet terstond, overeenkomstig de op hem rustende wettelijke verplichtingen
      ter zake, een ingevolge de wettelijke verplichtingen gevoerde en bewaarde administratie en de daartoe behorende
      boeken, bescheiden en andere gegevensdragers in ongeschonden vorm, zo nodig met de hulpmiddelen om de inhoud binnen
      redelijke termijn leesbaar te maken, aan de curator verstrekt;

      2°. indien hij voor of tijdens het faillissement opzettelijk niet heeft voldaan aan de wettelijke verplichtingen
      tot het voeren van een administratie en het bewaren van de daartoe behorende boeken, bescheiden en andere
      gegevensdragers, ten gevolge waarvan de afhandeling wordt bemoeilijkt.

      2 Met dezelfde straf wordt gestraft de bestuurder of commissaris van een rechtspersoon, indien:

      1°. hij tijdens het faillissement van de rechtspersoon desgevraagd opzettelijk niet terstond, overeenkomstig de op
      hem rustende wettelijke verplichtingen ter zake, een ingevolge de wettelijke verplichtingen gevoerde en bewaarde
      administratie en de daartoe behorende boeken, bescheiden en andere gegevensdragers in ongeschonden vorm, zo nodig
      met de hulpmiddelen om de inhoud binnen redelijke termijn leesbaar te maken, aan de curator verstrekt;

      2°. hij tijdens het faillissement van de rechtspersoon, of voor het faillissement indien dit is gevolgd,
      opzettelijk niet heeft voldaan aan of heeft bewerkstelligd dat werd voldaan aan de wettelijke verplichtingen
      tot het voeren van een administratie en het bewaren van de daartoe behorende boeken, bescheiden en andere
      gegevensdragers, ten gevolge waarvan de afhandeling wordt bemoeilijkt.

      3 Hij ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard wordt
      gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie, indien:

      1°. hij desgevraagd opzettelijk niet terstond, overeenkomstig de op hem rustende wettelijke verplichtingen ter
      zake, een ingevolge de wettelijke verplichtingen gevoerde en bewaarde administratie en de daartoe behorende
      boeken, bescheiden en andere gegevensdragers in ongeschonden vorm, zo nodig met de hulpmiddelen om de inhoud binnen
      redelijke termijn leesbaar te maken, aan de bewindvoerder verstrekt;

      2°. hij voor of tijdens de toepassing van de schuldsaneringsregeling opzettelijk niet heeft voldaan aan de
      wettelijke verplichtingen tot het voeren van een administratie en het bewaren van de daartoe behorende boeken,
      bescheiden en andere gegevensdragers, ten gevolge waarvan de schuldsanering wordt bemoeilijkt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel344a
  - number: 344b
    text: |-
      1 Hij die in staat van faillissement is verklaard aan wiens schuld het te wijten is dat voor of tijdens het
      faillissement niet is voldaan aan de wettelijke verplichtingen tot het voeren van een administratie en het bewaren
      van de daartoe behorende boeken, bescheiden en andere gegevensdragers, ten gevolge waarvan de afhandeling wordt
      bemoeilijkt, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie.

      2 De bestuurder of de commissaris van een rechtspersoon aan wiens schuld het te wijten is dat tijdens het
      faillissement van de rechtspersoon, of voor het faillissement indien het faillissement is gevolgd, niet is voldaan
      aan de wettelijke verplichtingen tot het voeren van een administratie en het bewaren van de daartoe behorende
      boeken, bescheiden en andere gegevensdragers, ten gevolge waarvan de afhandeling wordt bemoeilijkt, wordt gestraft
      met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie.

      3 Hij ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard wordt
      gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie, indien het aan zijn
      schuld te wijten is dat voor of tijdens de toepassing van de schuldsaneringsregeling niet is voldaan aan de
      wettelijke verplichtingen tot het voeren van een administratie en het bewaren van de daartoe behorende boeken,
      bescheiden en andere gegevensdragers, ten gevolge waarvan de schuldsanering wordt bemoeilijkt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel344b
  - number: '345'
    text: |-
      1 De schuldeiser die tot een aangeboden gerechtelijk akkoord toetreedt ten gevolge van een overeenkomst hetzij
      met de schuldenaar, hetzij met een derde, waarbij hij bijzondere voordelen heeft bedongen, wordt, in geval van
      aanneming van het akkoord, gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde
      categorie.

      2 Gelijke straf wordt in hetzelfde geval toegepast op de schuldenaar of, indien deze een rechtspersoon is, op de
      bestuurder of commissaris, die zodanige overeenkomst sluit.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel345
  - number: '347'
    text: |-
      1 De bestuurder of commissaris van een rechtspersoon die, buiten het geval van de [artikelen 342][ref1] en
      [343][ref2], buitensporig middelen van de rechtspersoon heeft verbruikt, uitgegeven of vervreemd, dan wel hieraan
      zijn medewerking heeft verleend of daarvoor zijn toestemming heeft gegeven, ten gevolge waarvan de rechtspersoon
      ernstig nadeel ondervindt en het voortbestaan in gevaar komt, wordt gestraft met gevangenisstraf van ten hoogste
      twee jaren of geldboete van de vijfde categorie.

      2 Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie wordt gestraft de
      bestuurder of commissaris van een rechtspersoon die, buiten het geval van de [artikelen 342][ref3] en [343][ref4],
      buitensporig middelen van de rechtspersoon verbruikt, uitgeeft of vervreemdt, dan wel hieraan medewerkt of daaraan
      zijn toestemming geeft, met het oogmerk zichzelf of een ander te bevoordelen, ten gevolge waarvan de rechtspersoon
      ernstig nadeel ondervindt en het voortbestaan in gevaar komt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel342
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel343
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel342
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel343
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel347
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '342'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '343'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '342'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '343'
  - number: '348'
    text: |-
      1 Hij die opzettelijk zijn eigen goed of, ten behoeve van degene aan wie het toebehoort, een hem niet toebehorend
      goed onttrekt aan een pandrecht, een retentierecht of een recht van vruchtgebruik of gebruik van een ander, wordt
      gestraft met een gevangenisstraf van ten hoogste een jaar en zes maanden.

      2 Met dezelfde straf wordt gestraft hij die opzettelijk een goed dat is onderworpen aan een pandrecht, een
      retentierecht of een recht van vruchtgebruik of gebruik van een ander, vernielt, beschadigt of onbruikbaar maakt.

      3 De bepaling van [artikel 316][ref1] is op deze misdrijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel316
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel348
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '316'
  - number: 348a
    text: |-
      1 Onder bestuurder van een rechtspersoon worden voor de toepassing van de bepalingen in deze Titel mede begrepen
      zij die feitelijk optreden als bestuurder van een rechtspersoon.

      2 Voor de toepassing van de bepalingen in deze Titel worden onder bestuurders van een rechtspersoon tevens begrepen
      de bestuurders van een vennootschap onder firma en van een commanditaire vennootschap.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel348a
  - number: '349'
    text: |-
      1 Bij veroordeling wegens een der in deze titel omschreven misdrijven, kan de schuldige worden ontzet van de
      uitoefening van het beroep waarin hij het misdrijf begaan heeft.

      2 Bij veroordeling wegens een der in de [artikelen 341][ref1], [343][ref2] en [344][ref3] omschreven misdrijven,
      kan de schuldige worden ontzet van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref4], vermelde rechten.

      3 Bij veroordeling wegens een der in de [artikelen 340-345][ref5] omschreven misdrijven, kan openbaarmaking van de
      rechterlijke uitspraak worden gelast.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel341
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel343
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel344
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel340
