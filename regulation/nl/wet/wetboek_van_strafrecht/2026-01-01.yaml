        bwb_id: BWBR0001854
        artikel: '372'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0019919
        artikel: '6'
  - number: '376'
    text: |-
      Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vijfde categorie wordt gestraft de ambtenaar
      die opzettelijk deelneemt, middellijk of onmiddellijk, aan aannemingen of leveranties waarover hem op het tijdstip
      van de handeling geheel of ten dele het bestuur of toezicht is opgedragen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel376
  - number: '377'
    text: |-
      De ambtenaar van het muntwezen, behalve de muntmeester, of degene, in dienst van een waarborginstelling als
      bedoeld in [artikel 4 van de Waarborgwet 2019][ref1], die handel drijft in edele metalen of daarvan vervaardigde
      voorwerpen, of opzettelijk aan zodanige handel middellijk of onmiddellijk deelneemt, wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel4
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel377
    references:
      - id: ref1
        bwb_id: BWBR0042284
        artikel: '4'
  - number: '378'
    text: |-
      Degene, in dienst van een waarborginstelling als bedoeld in [artikel 4 van de Waarborgwet 2019][ref1], die een aan
      die waarborginstelling aangeboden palladium, platina, gouden of zilveren voorwerp afdrukt of natrekt of daarvan een
      beschrijving geeft aan een ander dan die van ambtswege bevoegd is haar te vorderen, wordt gestraft met geldboete
      van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0042284#Artikel4
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel378
    references:
      - id: ref1
        bwb_id: BWBR0042284
        artikel: '4'
  - number: '379'
    text: |-
      1 De ambtenaar van de burgerlijke stand die meewerkt aan iemands huwelijksvoltrekking, wetende dat deze daardoor
      een dubbel huwelijk aangaat, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vierde categorie.

      2 De ambtenaar van de burgerlijke stand die meewerkt aan iemands huwelijksvoltrekking, wetende dat daartegen enig
      ander wettig beletsel bestaat, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel379
  - number: '380'
    text: |-
      1 Bij veroordeling wegens een der in de [artikelen 355][ref1], [357][ref2] en [358][ref3] omschreven misdrijven kan
      ontzetting van het in [artikel 28, eerste lid, onder 3°][ref4], vermelde recht worden uitgesproken.

      2 Bij veroordeling wegens een der in de [artikelen 359][ref5], [363][ref6], [364][ref7],
      [366][ref8] en [379, eerste lid][ref9], omschreven misdrijven kan ontzetting van het in
