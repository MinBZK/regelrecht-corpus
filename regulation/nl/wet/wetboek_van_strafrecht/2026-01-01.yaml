    text: |-
      1 Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft degene die
      opzettelijk en wederrechtelijk niet-openbare gegevens die zijn opgeslagen door middel van een geautomatiseerd werk,
      voor zichzelf of voor een ander overneemt of doorgeeft.

      2 Indien de gegevens een niet-contant betaalinstrument betreffen, wordt de schuldige gestraft met gevangenisstraf
      van ten hoogste twee jaren of geldboete van de vierde categorie.

      3 Indien het feit wordt gepleegd met het oogmerk om zich of een ander wederrechtelijk te bevoordelen, wordt de
      schuldige gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.

      4 Indien het feit is gepleegd ten behoeve van een buitenlandse mogendheid wordt de op het feit gestelde
      gevangenisstraf met een derde verhoogd.
