        artikel: '123'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '124'
  - number: 130b
    text: |-
      Bij veroordeling wegens een der misdrijven omschreven in de [artikelen 123][ref1] en [124][ref2], begaan met een
      terroristisch oogmerk, kan ontzetting van het in [artikel 28, eerste lid, onder 3°][ref3], vermelde recht worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel124
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel28
