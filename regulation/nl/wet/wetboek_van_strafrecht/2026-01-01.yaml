  - number: 22c
    text: |-
      1 Een taakstraf bestaat uit het verrichten van onbetaalde arbeid. Het vonnis dan wel de strafbeschikking vermeldt
      het aantal uren dat de straf zal duren. Het vonnis dan wel de strafbeschikking kan de aard van de te verrichten
      werkzaamheden vermelden.

      2 De taakstraf duurt ten hoogste tweehonderdenveertig uren.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel22c
  - number: 22d
    text: |-
      1 In het vonnis waarbij taakstraf wordt opgelegd, beveelt de rechter, voor het geval dat de veroordeelde de
      taakstraf niet naar behoren verricht, dat vervangende hechtenis zal worden toegepast.

      2 De duur van de vervangende hechtenis wordt in gehele dagen, weken of maanden vastgesteld.

      3 De vervangende hechtenis beloopt ten minste één dag en ten hoogste vier maanden. Voor elke twee uren van de
      taakstraf wordt niet meer dan één dag opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel22d
  - number: '23'
    text: |-
      1 Hij die tot een geldboete is veroordeeld, betaalt het vastgestelde bedrag binnen de door Onze Minister van
      Justitie en Veiligheid te stellen termijn aan de staat.

      2 Het bedrag van de geldboete is ten minste € 3.

      3 De geldboete die voor een strafbaar feit ten hoogste kan worden opgelegd, is gelijk aan het bedrag van de
      categorie die voor dat feit is bepaald.

      4 Er zijn zes categorieën:

      de eerste categorie, € 335 ;

      de tweede categorie, € 3 350 ;

      de derde categorie, € 6 700 ;

      de vierde categorie, € 16 750 ;

      de vijfde categorie, € 67 000 ;

      de zesde categorie, € 670 000 .

      5 Voor een overtreding, onderscheidenlijk een misdrijf, waarop geen geldboete is gesteld, kan een geldboete worden
      opgelegd tot ten hoogste het bedrag van de eerste, onderscheidenlijk de derde categorie.

      6 Voor een overtreding, onderscheidenlijk een misdrijf, waarop een geldboete is gesteld, maar waarvoor
      geen boetecategorie is bepaald, kan een geldboete worden opgelegd tot ten hoogste het bedrag van de eerste,
      onderscheidenlijk de derde categorie, indien dit bedrag hoger is dan het bedrag van de op het betrokken strafbare
      feit gestelde geldboete.

      7 Bij veroordeling van een rechtspersoon kan, indien de voor het feit bepaalde boetecategorie geen passende
      bestraffing toelaat, een geldboete worden opgelegd tot ten hoogste het bedrag van de naast hogere categorie.
      Indien voor het feit een geldboete van de zesde categorie kan worden opgelegd en die boetecategorie geen passende
      bestraffing toelaat, kan een geldboete worden opgelegd tot ten hoogste tien procent van de jaaromzet van de
      rechtspersoon in het boekjaar voorafgaande aan de uitspraak of strafbeschikking.

      8 Het voorgaande lid is van overeenkomstige toepassing bij veroordeling van een vennootschap zonder
      rechtspersoonlijkheid, maatschap, rederij of doelvermogen.

      9 De in het vierde lid genoemde bedragen worden elke twee jaar, met ingang van 1 januari van een jaar, bij algemene
      maatregel van bestuur aangepast aan de ontwikkeling van de consumentenprijsindex sinds de vorige aanpassing van
      deze bedragen. Bij deze aanpassing wordt het geldbedrag van de eerste categorie op een veelvoud van € 5 naar
      beneden afgerond en worden, uitgaande van het geldbedrag van deze eerste categorie en onder instandhouding van de
      onderlinge verhouding tussen de bedragen van de geldboetecategorieën, de bedragen van de tweede tot en met de zesde
      geldboetecategorie bepaald.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel23
  - number: '24'
    text: |-
      Bij de vaststelling van de geldboete wordt rekening gehouden met de draagkracht van de verdachte in de mate waarin
      dat nodig is met het oog op een passende bestraffing van de verdachte zonder dat deze in zijn inkomen en vermogen
      onevenredig wordt getroffen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel24
  - number: 24a
    text: |-
      1 Indien een of meer geldboeten worden opgelegd tot een bedrag van ten minste € 225, kan in de uitspraak dan wel
      de strafbeschikking worden bepaald dat degene aan wie de geldboete is opgelegd het bedrag in gedeelten mag voldoen.
      Elk van die gedeelten wordt daarbij op ten minste € 45 bepaald.

      2 In geval van toepassing van het eerste lid worden in de uitspraak of strafbeschikking tevens termijnen
      vastgesteld voor de betaling van het tweede en - zo de geldboete in meer gedeelten mag worden voldaan - de volgende
      gedeelten.

      3 Deze termijnen worden op ten minste één en ten hoogste drie maanden gesteld. Zij mogen in het geval van een
      uitspraak tezamen een tijdvak van twee jaar niet overschrijden; in het geval van een strafbeschikking mogen zij een
      tijdvak van een jaar niet overschrijden.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel24a
  - number: 24c
    text: |-
      1 Bij de uitspraak waarbij geldboete wordt opgelegd, beveelt de rechter voor het geval dat noch volledige betaling
      noch volledig verhaal van het verschuldigde bedrag volgt, dat vervangende hechtenis zal worden toegepast. Indien
      de veroordeelde een rechtspersoon is, blijft dit bevel achterwege. [Artikel 51, laatste lid][ref1], is van
      overeenkomstige toepassing.

      2 De duur van de vervangende hechtenis wordt in gehele dagen, weken of maanden vastgesteld.

      3 De vervangende hechtenis beloopt ten minste één dag en ten hoogste een jaar. Voor elke volle € 25 van de
      geldboete wordt niet meer dan één dag opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '51'
  - number: '27'
    text: |-
      1 Bij het opleggen van tijdelijke gevangenisstraf, hechtenis of taakstraf beveelt de rechter, dat de tijd die door
      de veroordeelde vóór de tenuitvoerlegging van de uitspraak in verzekering, in voorlopige hechtenis, in gijzeling
      ingevolge [artikel 6:6:25 van het Wetboek van Strafvordering][ref1], in een psychiatrisch ziekenhuis of een
      instelling voor klinische observatie bestemd ingevolge een bevel tot observatie of in detentie in het buitenland
      ingevolge een Nederlands verzoek om uitlevering of om overlevering is doorgebracht, bij de uitvoering van die straf
      geheel in mindering zal worden gebracht. Indien hij dit bevel geeft terzake van een taakstraf, bepaalt hij in zijn
      uitspraak volgens welke maatstaf de aftrek zal geschieden. Het vorenstaande blijft buiten toepassing voor zover die
      tijd reeds met toepassing van [artikel 68, eerste lid, laatste volzin, van het Wetboek van Strafvordering][ref2] in
      mindering is gebracht op een andere vrijheidsstraf die de veroordeelde heeft ondergaan.

      2 Bij het berekenen van de in mindering te brengen tijd geldt de eerste dag van de verzekering als een volle dag en
      blijft de dag waarop zij is geëindigd buiten beschouwing.

      3 De rechter kan een overeenkomstig bevel geven bij het opleggen van geldboete. Indien hij dit bevel geeft, bepaalt
      hij in zijn uitspraak volgens welke maatstaf de aftrek zal geschieden.

      4 De voorgaande leden van dit artikel zijn ook van toepassing in gevallen waarin, bij gelijktijdige
      vervolging wegens twee of meer feiten, de veroordeling wordt uitgesproken ter zake van een
      ander feit dan dat waarvoor de verzekering , de voorlopige hechtenis of de gijzeling ingevolge
      [artikel 6:6:25 van het Wetboek van Strafvordering][ref3] is bevolen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6625
