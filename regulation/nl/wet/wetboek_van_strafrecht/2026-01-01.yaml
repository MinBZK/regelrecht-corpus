  - number: 120b
    text: |-
      1 De samenspanning tot de in de [artikelen 115][ref1] en [117][ref2] omschreven misdrijven, te begaan met een
      terroristisch oogmerk, wordt gestraft met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde
      categorie.

      2 [Artikel 96, tweede lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel117
