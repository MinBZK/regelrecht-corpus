        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '180'
  - number: '183'
    text: |-
      Met ambtenaren worden ten aanzien van de [artikelen 179 tot en met 182][ref1] gelijkgesteld de schipper of
      gezagvoerder van een luchtvaartuig die een bevoegdheid uitoefent of een verplichting vervult welke hem als zodanig
      is toegekend of opgelegd bij een bepaling van het [Wetboek van Strafvordering][ref2]. Onder schipper wordt begrepen
      hij die het hoogste gezag uitoefent op een overeenkomstig [artikel 136][ref3] aangewezen installatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001903
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel136a
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001903
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 136a
  - number: '184'
    text: |-
      1 Hij die opzettelijk niet voldoet aan een bevel of een vordering, krachtens wettelijk voorschrift gedaan door een
      ambtenaar met de uitoefening van enig toezicht belast of door een ambtenaar belast met of bevoegd verklaard tot
      het opsporen of onderzoeken van strafbare feiten, alsmede hij die opzettelijk enige handeling, door een van die
      ambtenaren ondernomen ter uitvoering van enig wettelijk voorschrift, belet, belemmert of verijdelt, wordt gestraft
      met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.

      2 Met de in het eerste gedeelte van het vorige lid bedoelde ambtenaar wordt gelijkgesteld ieder die, krachtens
      wettelijk voorschrift, voortdurend of tijdelijk met enige openbare dienst is belast.

      3 Met een vordering of handeling als bedoeld in het eerste lid wordt gelijkgesteld een vordering of handeling
      van de schipper of gezagvoerder van een luchtvaartuig die een bevoegdheid uitoefent of een verplichting vervult,
      welke hem als zodanig is toegekend of opgelegd bij een bepaling van het [Wetboek van Strafvordering][ref1]. Onder
      schipper wordt begrepen hij die het hoogste gezag uitoefent op een overeenkomstig [artikel 136][ref2] aangewezen
      installatie.

      4 Indien tijdens het plegen van het misdrijf nog geen twee jaren zijn verlopen sedert een vroegere veroordeling
      van de schuldige wegens gelijk misdrijf onherroepelijk is geworden, kan de gevangenisstraf met een derde worden
      verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel136a
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 136a
  - number: 184a
    text: |-
      1 Hij die opzettelijk handelt in strijd met een gedragsaanwijzing, gegeven krachtens
      [artikel 509hh, eerste lid, onderdeel b, van het Wetboek van Strafvordering][ref1], wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.

      2 Hij die opzettelijk handelt in strijd met een bevel, bedoeld in
      [artikel 20, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref2], wordt gestraft met gevangenisstraf van ten
      hoogste een jaar of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel509hh
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel20
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel184a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 509hh
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '20'
  - number: '185'
    text: |-
      Hij die bij een terechtzitting of ter plaatse waar een ambtenaar in het openbaar in de rechtmatige uitoefening
      van zijn bediening werkzaam is, opschudding veroorzaakt en na het door of vanwege het bevoegd gezag gegeven bevel
      zich niet verwijdert, wordt gestraft met gevangenisstraf van ten hoogste twee weken of geldboete van de tweede
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel185
  - number: 185a
    text: |-
      Met ambtenaren worden ten aanzien van de [artikelen 179 tot en met 182][ref1], [184][ref2] en [185][ref3]
      gelijkgesteld personen in de openbare dienst van een vreemde staat of van een volkenrechtelijke organisatie die in
      Nederland op door het volkenrecht toegelaten wijze hun bediening uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel184
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel185
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel185a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '184'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '185'
  - number: '186'
    text: |-
      Hij die opzettelijk bij gelegenheid van een volksoploop zich niet onmiddellijk verwijdert na het derde door
      of vanwege het bevoegd gezag gegeven bevel, wordt, als schuldig aan deelneming aan samenscholing, gestraft met
      gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel186
  - number: '187'
    text: |-
      Hij die een bekendmaking, vanwege het bevoegd gezag in het openbaar gedaan, wederrechtelijk afscheurt, onleesbaar
      maakt of beschadigt, met het oogmerk om de kennisneming daarvan te beletten of te bemoeilijken, wordt gestraft met
      gevangenisstraf van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel187
  - number: '188'
    text: |-
      Hij die aangifte of klacht doet dat een strafbaar feit gepleegd is, wetende dat het niet gepleegd is, wordt
      gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel188
  - number: '189'
    text: |-
      1 Met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft:

      1°. hij die opzettelijk iemand die schuldig is aan of verdachte is van enig misdrijf, verbergt of hem behulpzaam is
      in het ontkomen aan de nasporing van of aanhouding door de ambtenaren van de justitie of politie;

      2°. hij die nadat enig misdrijf is gepleegd, met het oogmerk om het te bedekken of de nasporing of vervolging
      te beletten of te bemoeilijken, voorwerpen waarop of waarmede het misdrijf gepleegd is of andere sporen van het
      misdrijf vernietigt, wegmaakt, verbergt of aan het onderzoek van de ambtenaren van de justitie of politie onttrekt;

      3°. hij die opzettelijk voorwerpen die kunnen dienen om de waarheid aan de dag te brengen of om wederrechtelijk
      verkregen voordeel als bedoeld in [artikel 36e][ref1] aan te tonen, met het oogmerk om de inbeslagneming daarvan te
      beletten, te belemmeren of te verijdelen, verbergt, vernietigt, wegmaakt of aan het onderzoek van de ambtenaren van
      de justitie of politie onttrekt, dan wel door het opzettelijk verstrekken van gegevens of inlichtingen aan derden
      die inbeslagneming belet, belemmert of verijdelt.

      2 In het geval het misdrijf, bedoeld in het eerste lid, een terroristisch misdrijf betreft, kan een gevangenisstraf
      van ten hoogste vier jaren of geldboete van de vijfde categorie worden opgelegd.

      3 Deze bepalingen zijn niet van toepassing op hem die de daarin vermelde handelingen verricht ten einde gevaar van
      vervolging te ontgaan of af te wenden van een van zijn bloedverwanten of aangehuwden in de rechte linie of in de
      tweede of derde graad van de zijlinie of van zijn echtgenoot of gewezen echtgenoot.

      4 Met ambtenaren van de justitie of politie worden gelijkgesteld: personen in de openbare dienst van een
      internationaal gerecht dat zijn rechtsmacht ontleent aan een verdrag waarbij het Koninkrijk partij is, die belast
      zijn met de opsporing of vervolging van enig misdrijf, alsmede personen in de openbare dienst van een vreemde staat
      die in Nederland op door het volkenrecht toegelaten wijze hun bediening uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36e
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 36e
        afdeling: Eerste
  - number: 189a
    text: |-
      1 Degene die opzettelijk een vervoermiddel toerust of inricht met een ruimte die kennelijk is bestemd om de
      opsporing van strafbare feiten te beletten of te bemoeilijken, wordt gestraft met gevangenisstraf van ten hoogste
      twee jaar of geldboete van de derde categorie.

      2 Met dezelfde straf wordt gestraft degene die een vervoermiddel voorhanden heeft, wetende dat dit vervoermiddel is
      toegerust of ingericht met een ruimte als bedoeld in het eerste lid.

      3 Indien degene van het in het eerste lid omschreven feit een beroep of gewoonte maakt, wordt diegene gestraft met
      gevangenisstraf van ten hoogste vier jaar of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel189a
  - number: '190'
    text: |-
      Hij die opzettelijk een gerechtelijke lijkschouwing belet, belemmert of verijdelt, wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel190
  - number: '191'
    text: |-
      Hij die opzettelijk iemand, op openbaar gezag of krachtens rechterlijke uitspraak of beschikking van de vrijheid
      beroofd, bevrijdt of bij zijn zelfbevrijding behulpzaam is, wordt gestraft met gevangenisstraf van ten hoogste vier
      jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel191
  - number: '192'
    text: |-
      1 Hij die, wettelijk als getuige, als deskundige of als tolk opgeroepen, opzettelijk niet voldoet aan enige
      wettelijke verplichting die hij als zodanig te vervullen heeft, wordt gestraft:

      1°. in strafzaken met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie;

      2°. in andere zaken met gevangenisstraf van ten hoogste vier maanden of geldboete van de tweede categorie.

      2 Hij die na de totstandkoming van een afspraak met de officier van justitie ingevolge
      [artikel 226h, derde lid][ref1], of [artikel 226k, eerste lid, van het Wetboek van Strafvordering][ref2]
      wettelijk als getuige opgeroepen, opzettelijk niet voldoet aan zijn verplichting te verklaren, wordt gestraft met
      gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie.

      3 Het bepaalde in het vorige lid van dit artikel is niet van toepassing op de partij in een burgerlijke procedure
      die, wanneer zij als getuige wordt gehoord, weigert op de haar gestelde vragen te antwoorden.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel226h
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel226k
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel192
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 226h
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 226k
  - number: 192a
    text: |-
      Hij die opzettelijk niet voldoet aan de vordering van een parlementaire enquêtecommissie tot het hebben van
      inzage in of het nemen van afschrift van of het op andere wijze kennisnemen van documenten wordt gestraft met
      gevangenisstraf van ten hoogste vier maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel192a
  - number: 192b
    text: |-
      Hij die opzettelijk niet voldoet aan een vordering van een parlementaire enquêtecommissie tot het verstrekken van
      schriftelijke inlichtingen, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of een geldboete van de
      tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel192b
  - number: 192c
    text: |-
      Hij die opzettelijk een parlementaire enquêtecommissie of door haar aangewezen personen belet, belemmert of
      verhindert een plaats te betreden, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of een geldboete
      van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel192c
  - number: 192d
    text: |-
      De misdrijven genoemd in de [artikelen 192 tot en met 192c][ref1] worden niet vervolgd, indien zij zijn begaan door
      een lid van de Staten-Generaal, een minister of een staatssecretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel192
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel192d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '192'
  - number: '193'
    text: |-
      Hij die opzettelijk niet voldoet aan een wettig bevel tot overlegging van een stuk hetwelk beweerd wordt vals of
      vervalst te zijn, of hetwelk dienen moet ter vergelijking met een ander waarvan de valsheid of vervalsing beweerd,
      of de echtheid ontkend of niet erkend wordt, wordt gestraft:

      1°. in strafzaken met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie;

      2°. in andere zaken met gevangenisstraf van ten hoogste vier maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel193
  - number: '194'
    text: |-
      1 Hij die in staat van faillissement is verklaard en wettelijk verplicht is tot het geven van inlichtingen, wordt
      gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie, indien hij hetzij zonder
      geldige reden opzettelijk wegblijft, hetzij weigert de vereiste inlichtingen te geven, hetzij opzettelijk onjuiste
      of onvolledige inlichtingen geeft.

      2 Met dezelfde straf wordt gestraft hij die in het faillissement van een ander wettelijk verplicht is tot het geven
      van inlichtingen en hetzij zonder geldige reden opzettelijk wegblijft, hetzij weigert de vereiste inlichtingen te
      geven, hetzij opzettelijk onjuiste of onvolledige inlichtingen geeft.

      3 Met dezelfde straf wordt gestraft hij ten aanzien van wie de schuldsaneringsregeling natuurlijke personen
      van toepassing is verklaard en wettelijk verplicht is tot het geven van inlichtingen, of die op grond van de
      schuldsaneringsregeling natuurlijke personen ten aanzien van een ander wettelijk verplicht is tot het geven van
      inlichtingen, hetzij zonder geldige reden opzettelijk wegblijft, hetzij weigert de vereiste inlichtingen te geven,
      hetzij opzettelijk onjuiste of onvolledige inlichtingen geeft.

      4 Indien de schuldige een van de strafbare feiten, omschreven in het eerste lid, in zijn beroep begaat, kan hij van
      de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel194
  - number: '195'
    text: |-
      Hij die een recht uitoefent, wetende dat hij daarvan bij rechterlijke uitspraak is ontzet, wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel195
  - number: '196'
    text: |-
      Hij die opzettelijk onderscheidingstekens draagt of een daad verricht behorende tot een ambt dat hij niet bekleedt
      of waarin hij geschorst is, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de
      tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel196
  - number: '197'
    text: |-
      Een vreemdeling die in Nederland verblijft, terwijl hij weet of ernstige reden heeft te vermoeden, dat hij op
      grond van een wettelijk voorschrift tot ongewenste vreemdeling is verklaard of tegen hem een inreisverbod is
      uitgevaardigd met toepassing van [artikel 66a, zevende lid, van de Vreemdelingenwet 2000][ref1], wordt gestraft met
      een gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel66a
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel197
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 66a
  - number: 197a
    text: |-
      1 Hij die een ander behulpzaam is bij het zich verschaffen van toegang tot of doorreis door Nederland, een andere
      lidstaat van de Europese Unie, IJsland, Noorwegen of een staat die is toegetreden tot het op 15 november 2000
      te NewYork totstandgekomen Protocol tegen de smokkel van migranten over land, over de zee en in de lucht, tot
      aanvulling van het op 15 november 2000 te NewYork totstandgekomen Verdrag tegen transnationale georganiseerde
      misdaad, of hem daartoe gelegenheid, middelen of inlichtingen verschaft, terwijl hij weet of ernstige redenen heeft
      te vermoeden dat die toegang of doorreis wederrechtelijk is, wordt als schuldig aan mensensmokkel gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.

      2 Hij die een ander uit winstbejag behulpzaam is bij het zich verschaffen van verblijf in Nederland, een andere
      lidstaat van de Europese Unie, IJsland, Noorwegen of een staat die is toegetreden tot het in het eerste lid
      genoemde protocol, of hem daartoe gelegenheid, middelen of inlichtingen verschaft, terwijl hij weet of ernstige
      redenen heeft te vermoeden dat dat verblijf wederrechtelijk is, wordt gestraft met een gevangenisstraf van ten
      hoogste zes jaren of geldboete van de vijfde categorie.

      3 Indien een van de feiten, omschreven in het eerste en tweede lid, wordt begaan in de uitoefening van enig ambt
      of beroep, wordt gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie opgelegd en kan
      ontzetting worden uitgesproken van de uitoefening van het recht het ambt te bekleden of het beroep uit te oefenen
      en kan de rechter openbaarmaking van zijn uitspraak gelasten.

      4 Indien een van de feiten, omschreven in het eerste en tweede lid, wordt begaan door een persoon die daarvan
      een beroep of gewoonte maakt of in vereniging wordt begaan door meerdere personen, wordt gevangenisstraf van ten
      hoogste tien jaren of geldboete van de vijfde categorie opgelegd.

      5 Indien een van de feiten, omschreven in het eerste en tweede lid, zwaar lichamelijk letsel ten gevolge heeft
      of daarvan levensgevaar voor een ander te duchten is, wordt gevangenisstraf van ten hoogste vijftien jaren of
      geldboete van de vijfde categorie opgelegd.

      6 Indien een van de feiten, omschreven in het eerste en tweede lid, de dood ten gevolge heeft, wordt een
      gevangenisstraf van ten hoogste achttien jaren of geldboete van de vijfde categorie opgelegd.

      7 Indien een van de feiten, omschreven in het eerste en tweede lid, wordt gepleegd met het oogmerk om een
      terroristisch misdrijf voor te bereiden of gemakkelijk te maken, wordt de op het feit gestelde gevangenisstraf met
      een derde verhoogd.

      8 Voor de toepassing van dit artikel wordt onder Nederland mede verstaan de openbare lichamen Bonaire, Sint
      Eustatius en Saba.

      9 Bij veroordeling wegens een van de feiten, omschreven in het eerste en tweede lid, kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel197a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 197b
    text: |-
      Hij die een ander, die zich wederrechtelijk toegang tot of verblijf in Nederland heeft verschaft, krachtens
      overeenkomst of aanstelling arbeid doet verrichten, terwijl hij weet of ernstige redenen heeft om te vermoeden dat
      de toegang of dat verblijf wederrechtelijk is, wordt gestraft met een gevangenisstraf van ten hoogste een jaar of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel197b
  - number: 197c
    text: |-
      Hij die van het in [artikel 197b][ref1] omschreven feit een beroep of gewoonte maakt wordt gestraft met een
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel197b
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel197c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 197b
  - number: 197d
    text: |-
      Indien de schuldige de in de [artikelen 197b][ref1] of [197c][ref2] omschreven feiten begaat in de uitoefening van
      enig ambt of beroep kan de rechter tevens de ontzetting uitspreken van de uitoefening van het recht het ambt te
      bekleden of het beroep uit te oefenen en de openbaarmaking van zijn uitspraak gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel197b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel197c
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel197d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 197b
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 197c
  - number: '198'
    text: |-
      1 Hij die opzettelijk enig goed aan het krachtens de wet daarop gelegd beslag of aan een gerechtelijke bewaring
      onttrekt of, wetende dat het daaraan onttrokken is, verbergt, wordt gestraft met gevangenisstraf van ten hoogste
      vier jaren of geldboete van de vijfde categorie.

      2 Met dezelfde straf wordt gestraft hij die opzettelijk enig krachtens de wet in beslag genomen goed vernielt,
      beschadigt of onbruikbaar maakt.

      3 Met dezelfde straf wordt gestraft de bewaarder die opzettelijk een van deze feiten pleegt of toelaat, of de dader
      als medeplichtige ter zijde staat.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel198
  - number: '199'
    text: |-
      1 Hij die opzettelijk zegels waarmede voorwerpen door of vanwege het bevoegd openbaar gezag verzegeld zijn,
      verbreekt, opheft of beschadigt, of de door zodanig zegel bewerkte afsluiting op andere wijze verijdelt, wordt
      gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.

      2 De bewaarder die opzettelijk het feit pleegt of toelaat of de dader als medeplichtige ter zijde staat wordt
      gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.

      3 Indien het feit ten gevolge van onachtzaamheid van de bewaarder gepleegd is, wordt deze gestraft met hechtenis
      van ten hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel199
  - number: '200'
    text: |-
      1 Hij die opzettelijk zaken, bestemd om voor de bevoegde macht tot overtuiging of bewijs te dienen, akten,
      bescheiden of registers die voortdurend of tijdelijk op openbaar gezag bewaard worden, of hetzij aan een ambtenaar,
      hetzij aan een ander in het belang van de openbare dienst zijn ter hand gesteld, vernielt, beschadigt, onbruikbaar
      maakt of wegmaakt, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde
      categorie.

      2 Onder bevoegde macht wordt mede verstaan: een internationaal gerecht dat zijn rechtsmacht ontleent aan een
      verdrag waarbij het Koninkrijk partij is.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel200
  - number: '201'
    text: |-
      Hij die opzettelijk brieven of andere stukken, aan een post- of telegraafkantoor bezorgd of in een postbus
      gestoken, aan hun bestemming onttrekt, opent of beschadigt, wordt gestraft met gevangenisstraf van ten hoogste een
      jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel201
  - number: '202'
    text: |-
      Indien de schuldige aan een der in de [artikelen 198-201][ref1] omschreven misdrijven zich de toegang tot de plaats
      van het misdrijf verschaft of het goed onder zijn bereik brengt door middel van braak, verbreking of inklimming,
      van valse sleutels, van een valse order of een vals kostuum, kan de straf met ten hoogste een jaar gevangenisstraf
      worden verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel198
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '198'
  - number: '203'
    text: |-
      Hij die in tijd van vrede opzettelijk desertie van een krijgsman in dienst van het Rijk uitlokt door een der in
      [artikel 47, eerste lid, onder 2°][ref1], vermelde middelen, of bevordert op enige in [artikel 48][ref2] vermelde
      wijze, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel48
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel203
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '48'
  - number: '204'
    text: |-
      Hij die, in tijd van vrede, opzettelijk oproer of muiterij van krijgslieden, in dienst van het Rijk, uitlokt
      door een der in [artikel 47, eerste lid, onder 2°][ref1], vermelde middelen, of bevordert op enige in
      [artikel 48][ref2] vermelde wijze, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel48
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '48'
  - number: '205'
    text: |-
      1 Hij die, zonder toestemming van de Koning, iemand voor vreemde krijgsdienst of gewapende strijd werft, wordt
      gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.

      2 Indien de schuldige een van de strafbare feiten, omschreven in het eerste lid, in zijn beroep begaat, kan hij van
      de uitoefening van dat beroep worden ontzet.

      3 Indien de gewapende strijd waarvoor wordt geworven, het plegen van een terroristisch misdrijf inhoudt, wordt de
      gevangenisstraf, gesteld op het in het eerste lid omschreven feit, met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel205
  - number: '206'
    text: |-
      1 Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft:

      1°. hij die zich opzettelijk voor de dienst bij de krijgsmacht dan wel voor enige werkzaamheid uit hoofde van
      burgerdienstplicht ongeschikt maakt of laat maken;

      2°. hij die een ander op diens verzoek opzettelijk voor die dienst dan wel voor zodanige werkzaamheid ongeschikt
      maakt.

      2 Indien in het laatste geval het feit de dood ten gevolge heeft, wordt gevangenisstraf van ten hoogste zes jaren
      of geldboete van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel206
  - number: '207'
    text: |-
      1 Hij die in de gevallen waarin een wettelijk voorschrift een verklaring onder ede vordert of daaraan
      rechtsgevolgen verbindt, mondeling of schriftelijk, persoonlijk of door een bijzonder daartoe gemachtigde,
      opzettelijk een valse verklaring onder ede aflegt, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of
      geldboete van de vijfde categorie.

      2 Indien de valse verklaring is afgelegd in een strafzaak ten nadele van de beklaagde of verdachte, wordt de
      schuldige gestraft met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.

      3 Met de eed staat gelijk de belofte of bevestiging die krachtens de wet voor de eed in de plaats treedt.

      4 Ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten kan worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 207a
    text: |-
      1 Hij die in de gevallen waarin door of krachtens een verdrag waarbij het Koninkrijk partij is, een verklaring
      onder ede of onder een daarvoor in de plaats tredende bevestiging of belofte wordt gevorderd, voor een
      internationaal gerecht mondeling of schriftelijk, persoonlijk of door een bijzonder daartoe gemachtigde,
      opzettelijk een valse verklaring in die vorm aflegt, wordt gestraft met gevangenisstraf van ten hoogste zes jaren
      of geldboete van de vierde categorie.

      2 De [leden 2 en 4 van artikel 207][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel207
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel207a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '207'
  - number: 207b
    text: |-
      1 Hij die in de gevallen waarin door of krachtens een verdrag een verklaring onder ede of onder een daarvoor in de
      plaats tredende bevestiging of belofte wordt gevorderd, in Nederland, per videoconferentie, voor een rechterlijke
      autoriteit van een andere staat mondeling, persoonlijk, opzettelijk een valse verklaring aflegt, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.

      2 [Artikel 207, tweede en vierde lid][ref1], is van toepassing.

      3 Geen vervolging vindt plaats dan op klacht van de rechterlijke autoriteit voor wie de valse verklaring werd
      afgelegd. [Artikel 66][ref2] blijft met betrekking tot de in dit lid bedoelde klacht buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel207
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel66
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel207b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '207'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '66'
  - number: '208'
    text: |-
      Hij die muntspeciën of munt- of bankbiljetten namaakt of vervalst, met het oogmerk om die muntspeciën of munt- of
      bankbiljetten als echt en onvervalst uit te geven of te doen uitgeven, wordt gestraft met gevangenisstraf van ten
      hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel208
  - number: '209'
    text: |-
      Hij die opzettelijk als echte en onvervalste muntspeciën of munt- of bankbiljetten uitgeeft muntspeciën of munt-
      of bankbiljetten die hij zelf heeft nagemaakt of vervalst of waarvan de valsheid of vervalsing hem, toen hij
      ze ontving, bekend was, of deze, met het oogmerk om ze als echt en onvervalst uit te geven of te doen uitgeven,
      ontvangt, zich verschaft, in voorraad heeft, vervoert, invoert, doorvoert of uitvoert, wordt gestraft met
      gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel209
  - number: '210'
    text: |-
      Hij die opzettelijk en wederrechtelijk muntspeciën of munt- of bankbiljetten welke bestemd zijn om als wettig
      betaalmiddel in omloop te worden gebracht, in omloop brengt of, teneinde ze in omloop te brengen, ontvangt, zich
      verschaft, in voorraad heeft, vervoert, invoert, doorvoert of uitvoert, wordt gestraft met een gevangenisstraf van
      ten hoogste vijf jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel210
  - number: '213'
    text: |-
      Hij die opzettelijk valse of vervalste muntspeciën of valse of vervalste munt- of bankbiljetten uitgeeft, wordt,
      behoudens [artikel 209][ref1], gestraft met gevangenisstraf van ten hoogste vier jaar of geldboete van de vierde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel209
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '209'
  - number: '214'
    text: |-
      Hij die stoffen, voorwerpen of gegevens vervaardigt, ontvangt, zich verschaft of voorhanden heeft waarvan hij weet
      dat zij bestemd zijn tot het namaken of vervalsen van muntspeciën of van munt- of bankbiljetten, wordt gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel214
  - number: 214bis
    text: |-
      Bij veroordeling wegens een der in deze titel omschreven misdrijven worden:

      1°. de valse of vervalste muntspeciën;

      2°. de valse of vervalste munt- of bankbiljetten;

      3°. de stoffen, voorwerpen of gegevens, uit hun aard bestemd tot het namaken of vervalsen van muntspeciën of van
      munt- of bankbiljetten;

      voor zover daarmede het misdrijf is gepleegd of zij het voorwerp daarvan hebben uitgemaakt, verbeurd verklaard,
      ongeacht aan wie de voorwerpen toebehoren.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel214bis
  - number: '215'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 208 tot en met 210][ref1] omschreven misdrijven, kan ontzetting
      van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref2], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel208
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '208'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '216'
    text: |-
      1 Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie wordt gestraft:

      1°. hij die van rijkswege uitgegeven zegels namaakt of vervalst, met het oogmerk om die zegels als echt en
      onvervalst te gebruiken of door anderen te doen gebruiken.

      2°. hij die, met gelijk oogmerk, zodanige zegels vervaardigt door wederrechtelijk gebruik te maken van echte
      stempels.

      2 Het eerste lid is van overeenkomstige toepassing op zegels die worden uitgegeven door een verlener van de
      universele postdienst als bedoeld in de [Postwet 2009][ref1] met daarop de vermelding «Nederland», alsmede op
      zegels die ingevolge artikel 3.01, tweede lid, van de Uitvoeringsregeling, behorende bij het op 9 september 1996 te
      Straatsburg tot stand gekomen Verdrag inzake de verzameling, afgifte en inname van afval in de Rijn- en binnenvaart
      (Trb. 1996, 293), worden uitgegeven door het Internationaal Verevenings- en Coördinatieorgaan, genoemd in artikel
      10, tweede lid, van dat verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0025572
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0025572
  - number: '217'
    text: |-
      Met gevangenisstraf van ten hoogste vijf jaren of geldboete van de vijfde categorie wordt gestraft:

      1°. hij die op palladium, platina, gouden of zilveren voorwerpen valse wettelijke merken of tekens plaatst of
      echte vervalst, met het oogmerk om die voorwerpen te gebruiken of door anderen te doen gebruiken alsof de daarop
      geplaatste merken en tekens echt en onvervalst waren;

      2°. hij die, met gelijk oogmerk, op de bedoelde voorwerpen wettelijke merken of tekens plaatst door wederrechtelijk
      gebruik te maken van echte stempels of andere apparatuur bestemd voor het aanbrengen van wettelijke merken of
      tekens;

      3°. hij die echte wettelijke merken of tekens inzet, aanvoegt of overbrengt in, aan of op andere palladium,
      platina, gouden of zilveren voorwerpen dan die waaraan zij oorspronkelijk zijn aangebracht, met het oogmerk om die
      voorwerpen te gebruiken of door anderen te doen gebruiken alsof de bedoelde merken of tekens oorspronkelijk daarop
      waren geplaatst.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel217
  - number: '218'
    text: |-
      Met gevangenisstraf van ten hoogste drie jaren of geldboete van de vijfde categorie wordt gestraft:

      1°. hij die op aan een metrologische conformiteitsbeoordeling onderworpen voorwerpen valse metrologische merken
      plaatst of echte vervalst, met het oogmerk om die voorwerpen te gebruiken of door anderen te doen gebruiken alsof
      de daarop geplaatste merken echt en onvervalst waren;

      2°. hij die, met gelijk oogmerk, op de bedoelde voorwerpen merken plaatst door wederrechtelijk gebruik te maken van
      echte stempels.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel218
  - number: '219'
    text: |-
      Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vijfde categorie wordt gestraft:

      1°. hij die andere dan de in de [artikelen 217][ref1] en [218][ref2] bedoelde merken, die krachtens wettelijk
      voorschrift op goederen of hun verpakking moeten of kunnen worden geplaatst, daarop valselijk plaatst of echte
      vervalst, met het oogmerk om die goederen te gebruiken of door anderen te doen gebruiken alsof de daarop geplaatste
      merken echt en onvervalst waren;

      2°. hij die, met gelijk oogmerk, op de bedoelde goederen of hun verpakking merken plaatst door wederrechtelijk
      gebruik te maken van echte stempels;

      3°. hij die echte merken gebruikt voor goederen of hun verpakking waarvoor die merken niet bestemd zijn, met het
      oogmerk om die goederen te gebruiken of door anderen te doen gebruiken alsof de bedoelde merken daarvoor bestemd
      waren.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel217
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel218
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel219
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '217'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '218'
  - number: '220'
    text: |-
      Hij die opzettelijk valse, vervalste of wederrechtelijk vervaardigde zegels, tekens of merken, of de voorwerpen
      waaraan zij wederrechtelijk verbonden zijn, gebruikt, verkoopt, te koop aanbiedt, aflevert, ten verkoop in voorraad
      heeft of binnen het Rijk in Europa invoert, als waren die zegels, tekens of merken echt en onvervalst en niet
      wederrechtelijk vervaardigd of wederrechtelijk aan de voorwerpen verbonden, wordt gestraft met dezelfde straffen
      als in de [artikelen 216-219][ref1] zijn bepaald, naar de daar gemaakte onderscheidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel216
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '216'
  - number: '221'
    text: |-
      1 Hij die aan een metrologische conformiteitsbeoordeling onderworpen voorwerpen ontdoet van het daarop geplaatste
      afkeuringsmerk, met het oogmerk om die voorwerpen te gebruiken of door anderen te doen gebruiken als waren zij niet
      afgekeurd, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie.

      2 Met dezelfde straf wordt gestraft hij die opzettelijk deze van het afkeuringsmerk ontdane voorwerpen gebruikt,
      verkoopt, te koop aanbiedt, aflevert of ten verkoop in voorraad heeft, als waren zij niet afgekeurd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel221
  - number: '222'
    text: |-
      1 Hij die van zegels als bedoeld in [artikel 216][ref1] welke reeds tot gebruik hebben gediend ontdoet van het merk
      bestemd om ze voor verder gebruik ongeschikt te maken, met het oogmerk om die zegels te gebruiken of door anderen
      te doen gebruiken als waren zij nog niet gebruikt, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of
      geldboete van de vijfde categorie.

      2 Met dezelfde straffen wordt gestraft hij die opzettelijk deze van dat merk ontdane zegels gebruikt, verkoopt,
      te koop aanbiedt, aflevert, ten verkoop in voorraad heeft of binnen het Rijk in Europa invoert, als waren zij nog
      niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel216
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel222
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '216'
  - number: 222bis
    text: |-
      De bepalingen van de [artikelen 216][ref1], [219][ref2], [220][ref3] en [222][ref4] zijn naar de daar gemaakte
      onderscheidingen mede van toepassing, indien de daarin omschreven feiten worden gepleegd met betrekking tot zegels
      of merken van Aruba, Curaçao, Sint Maarten, een buitenlandse mogendheid of een volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel216
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel219
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel220
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel222
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel222bis
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '216'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '219'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '220'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '222'
  - number: '223'
    text: |-
      Hij die stoffen of voorwerpen voorhanden heeft waarvan hij weet dat zij bestemd zijn tot het plegen van enig in
      [artikel 216][ref1] of in [artikel 222bis][ref2] in verband met artikel 216 omschreven misdrijf, wordt gestraft met
      gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel216
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel222bis
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel223
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '216'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 222bis
  - number: '224'
    text: |-
      Bij veroordeling wegens een der in de [artikelen 216-222bis][ref1] omschreven misdrijven, kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°, 2° en 4°][ref2], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel216
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel224
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '216'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '225'
    text: |-
      1 Hij die een geschrift dat bestemd is om tot bewijs van enig feit te dienen, valselijk opmaakt of vervalst, met
      het oogmerk om het als echt en onvervalst te gebruiken of door anderen te doen gebruiken, wordt als schuldig aan
      valsheid in geschrift gestraft, met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.

      2 Met dezelfde straf wordt gestraft hij die opzettelijk gebruik maakt van het valse of vervalste geschrift als
      ware het echt en onvervalst dan wel opzettelijk zodanig geschrift aflevert of voorhanden heeft, terwijl hij weet of
      redelijkerwijs moet vermoeden dat dit geschrift bestemd is voor zodanig gebruik.

      3 Indien een feit, omschreven in het eerste of tweede lid, wordt gepleegd met het oogmerk om een terroristisch
      misdrijf voor te bereiden of gemakkelijk te maken, wordt de op het feit gestelde gevangenisstraf met een derde
      verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel225
  - number: '226'
    text: |-
      1 De schuldige aan valsheid in geschrift wordt gestraft met gevangenisstraf van ten hoogste zeven jaren of
      geldboete van de vijfde categorie, indien zij gepleegd is:

      1°. in authentieke akten;

      2°. in schuldbrieven of certificaten van schuld van enige staat, enige provincie, gemeente of openbare instelling;

      3°. in aandelen of schuldbrieven of certificaten van aandeel of schuld van enige vereniging, stichting of
      vennootschap;

      4°. in talons, dividend- of rentebewijzen behorende tot een der onder de beide voorgaande nummers omschreven
      stukken, of in de bewijzen in plaats van deze stukken uitgegeven;

      5°. in krediet- of handelspapier.

      2 Met dezelfde straf wordt gestraft hij die opzettelijk gebruik maakt van enig in het eerste lid vermeld vals of
      vervalst geschrift als ware het echt en onvervalst, dan wel opzettelijk zodanig geschrift aflevert, voorhanden
      heeft, ontvangt, zich verschaft, vervoert, verkoopt of overdraagt, terwijl hij weet of redelijkerwijs moet
      vermoeden dat dit geschrift bestemd is voor zodanig gebruik.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel226
  - number: '227'
    text: |-
      1 Hij die in een authentieke akte een valse opgave doet opnemen aangaande een feit van welks waarheid de akte moet
      doen blijken, met het oogmerk om die akte te gebruiken of door anderen te doen gebruiken als ware zijn opgave in
      overeenstemming met de waarheid, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de
      vijfde categorie.

      2 Met dezelfde straf wordt gestraft hij die opzettelijk gebruik maakt van de akte als ware de inhoud in
      overeenstemming met de waarheid dan wel opzettelijk de akte aflevert of voorhanden heeft, terwijl hij weet of
      redelijkerwijs moet vermoeden dat die akte bestemd is voor zodanig gebruik.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel227
  - number: 227a
    text: |-
      Hij die, anders dan door valsheid in geschrift, opzettelijk niet naar waarheid gegevens verstrekt aan degene
      door wie of door wiens tussenkomst enige verstrekking of tegemoetkoming wordt verleend, wordt, indien het feit
      kan strekken tot bevoordeling van zichzelf of een ander, terwijl hij weet of redelijkerwijze moet vermoeden dat
      de verstrekte gegevens van belang zijn voor de vaststelling van zijn of eens anders recht op die verstrekking of
      tegemoetkoming dan wel voor de hoogte of de duur van een dergelijke verstrekking of tegemoetkoming, gestraft met
      gevangenis straf van ten hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel227a
  - number: 227b
    text: |-
      Hij die, in strijd met een hem bij of krachtens wettelijk voorschrift opgelegde verplichting, opzettelijk nalaat
      tijdig de benodigde gegevens te verstrekken, wordt, indien het feit kan strekken tot bevoordeling van zichzelf of
      een ander, terwijl hij weet of redelijkerwijze moet vermoeden dat de gegevens van belang zijn voor de vaststelling
      van zijn of eens anders recht op een verstrekking of tegemoetkoming dan wel voor de hoogte of de duur van een
      dergelijke verstrekking of tegemoetkoming, gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van
      de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel227b
  - number: 227c
    text: |-
      1 Hij die, anders dan door valsheid in geschrift, opzettelijk niet naar waarheid gegevens verstrekt of in strijd
      met een op hem rustende verplichting nalaat gegevens te verstrekken, terwijl dat feit tot gevolg heeft dat middelen
      of activa afkomstig van de begroting van de Europese Unie of van een door of voor de Europese Unie beheerde
      begroting wederrechtelijk worden ontvangen of achtergehouden wordt gestraft met een gevangenisstraf van ten hoogste
      vier jaren of geldboete van de vijfde categorie.

      2 Met dezelfde straf wordt gestraft hij die, anders dan door valsheid in geschrift, opzettelijk niet naar waarheid
      gegevens verstrekt of in strijd met een op hem rustende verplichting nalaat gegevens te verstrekken, terwijl dat
      feit tot gevolg heeft dat de middelen van de begroting van de Europese Unie of van een door of voor de Europese
      Unie beheerde begroting worden verminderd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel227c
  - number: '228'
    text: |-
      1 De arts of verloskundige die opzettelijk een valse verklaring afgeeft nopens een geboorte, een oorzaak van
      overlijden dan wel nopens het al of niet bestaan of bestaan hebben van ziekten, zwakheden of gebreken, wordt
      gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.

      2 Indien de verklaring wordt afgegeven met het oogmerk om iemand in een psychiatrisch ziekenhuis te doen opnemen of
      terughouden, wordt gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van de vijfde categorie
      opgelegd.

      3 Met dezelfde straffen wordt gestraft hij die opzettelijk van de valse verklaring gebruik maakt als ware de inhoud
      in overeenstemming met de waarheid.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel228
  - number: '229'
    text: |-
      1 Hij die een schriftelijke geneeskundige verklaring nopens een oorzaak van overlijden, dan wel nopens het al of
      niet bestaan of bestaan hebben van ziekten, zwakheden of gebreken valselijk opmaakt of vervalst, met het oogmerk om
      het openbaar gezag of verzekeraars te misleiden, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of
      geldboete van de vierde categorie.

      2 Met dezelfde straf wordt gestraft hij die, met gelijk oogmerk, van de valse of vervalste verklaring gebruik maakt
      als ware zij echt en onvervalst.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel229
  - number: '230'
    text: |-
      1 Hij die een getuigschrift van goed gedrag, bekwaamheid, armoede, gebreken of andere omstandigheden valselijk
      opmaakt of vervalst, met het oogmerk om het te gebruiken of door anderen te doen gebruiken tot het verkrijgen van
      een indienststelling of tot het opwekken van welwillendheid en hulpbetoon, wordt gestraft met gevangenisstraf van
      ten hoogste een jaar of geldboete van de derde categorie.

      2 Met dezelfde straf wordt gestraft hij die opzettelijk gebruik maakt van enig in het eerste lid vermeld vals of
      vervalst getuigschrift als ware het echt en onvervalst.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel230
  - number: '231'
    text: |-
      1 Hij die een reisdocument, een identiteitsbewijs als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] of een ander identiteitsbewijs dat afgegeven is door een
      dienst of organisatie van vitaal of nationaal belang, valselijk opmaakt of vervalst, of een zodanig geschrift op
      grond van valse persoonsgegevens doet verstrekken dan wel een zodanig geschrift dat aan hem of een ander verstrekt
      is, ter beschikking stelt van een derde met het oogmerk het door deze te doen gebruiken als ware het aan hem
      verstrekt, wordt gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.

      2 Met dezelfde straf wordt gestraft hij die een reisdocument of een identiteitsbewijs als bedoeld in het eerste
      lid aflevert of voorhanden heeft waarvan hij weet of redelijkerwijs moet vermoeden dat het vals of vervalst is, dan
      wel opzettelijk gebruik maakt van een vals of vervalst reisdocument of identiteitsbewijs als bedoeld in het eerste
      lid. Met dezelfde straf wordt gestraft hij die opzettelijk en wederrechtelijk gebruik maakt van een bij het bevoegd
      gezag als vermist opgegeven of een niet op zijn naam gesteld reisdocument of identiteitsbewijs als bedoeld in het
      eerste lid.

      3 [Artikel 225, derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel225
