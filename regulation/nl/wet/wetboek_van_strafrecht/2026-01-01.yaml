  - number: 38d
    text: |-
      1 De terbeschikkingstelling geldt voor de tijd van twee jaar, te rekenen van de dag waarop de rechterlijke
      uitspraak waarbij zij is opgelegd onherroepelijk is geworden.

      2 De termijn van de terbeschikkingstelling kan, behoudens het bepaalde in [artikel 38e][ref1] of
      [artikel 38j][ref2], door de rechter, op vordering van het openbaar ministerie, telkens hetzij met een jaar hetzij
      met twee jaar worden verlengd, indien de veiligheid van anderen, dan wel de algemene veiligheid van personen of
      goederen die verlenging eist.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38e
