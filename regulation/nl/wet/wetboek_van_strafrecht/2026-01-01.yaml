  - number: '61'
    text: |-
      1 De betrekkelijke zwaarte van ongelijksoortige hoofdstraffen wordt bepaald door de volgorde van [artikel 9][ref1].

      2 Waar de rechter de keuze tussen twee hoofdstraffen is gelaten, komt bij de vergelijking alleen de zwaarste van
      die straffen in aanmerking.

      3 De betrekkelijke zwaarte van gelijksoortige hoofdstraffen wordt bepaald door het maximum.

      4 De betrekkelijke duur, zowel van ongelijksoortige als van gelijksoortige hoofdstraffen, wordt eveneens bepaald
      door het maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel61
