        artikel: 38j
        afdeling: Tweede
  - number: 38e
    text: |-
      1 De totale duur van de maatregel van terbeschikkingstelling met bevel tot verpleging van overheidswege gaat een
      periode van vier jaar niet te boven, tenzij de terbeschikkingstelling met bevel tot verpleging van overheidswege
      is opgelegd ter zake van een misdrijf dat gericht is tegen of gevaar veroorzaakt voor de onaantastbaarheid van het
      lichaam van een of meer personen.

      2 Behoudens de gevallen waarin een bevel als bedoeld in [artikel 37b][ref1], of
      [artikel 6:6:10, eerste lid, onder e, van het Wetboek van Strafvordering][ref2] is gegeven, gaat de totale duur
      van de maatregel van terbeschikkingstelling een periode van negen jaar niet te boven.

      3 Indien de totale duur van de terbeschikkingstelling niet in tijd is beperkt, kan de termijn van de
      terbeschikkingstelling telkens worden verlengd, wanneer de veiligheid van anderen, dan wel de algemene veiligheid
      van personen die verlenging eist.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6610
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37b
        afdeling: Tweede
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 6:6:10
  - number: 38j
    text: |-
      In geval van voorwaardelijke beëindiging van de verpleging van overheidswege kan de terbeschikkingstelling telkens
      met een jaar, dan wel met twee jaren, worden verlengd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel38j
  - number: 38m
    text: |-
      1 De rechter kan op vordering van het openbaar ministerie de maatregel opleggen tot plaatsing van een verdachte in
      een inrichting voor stelselmatige daders, indien:

      1°. het door de verdachte begane feit een misdrijf betreft waarvoor voorlopige hechtenis is toegelaten;

      2°. de verdachte in de vijf jaren voorafgaand aan het door hem begane feit ten minste driemaal wegens een misdrijf
      onherroepelijk tot een vrijheidsbenemende straf of maatregel, een vrijheidsbeperkende maatregel of een taakstraf
      is veroordeeld dan wel bij onherroepelijke strafbeschikking een taakstraf is opgelegd, het feit is begaan na
      tenuitvoerlegging van deze straffen of maatregelen en er voorts ernstig rekening mede moet worden gehouden dat de
      verdachte wederom een misdrijf zal begaan, en

      3°. de veiligheid van personen of goederen het opleggen van de maatregel eist.

      2 De maatregel strekt tot beveiliging van de maatschappij en de beëindiging van de recidive van de verdachte.

      3 Indien de verdachte verslaafde is dan wel ten aanzien van hem andere specifieke problematiek bestaat waarmee het
      plegen van strafbare feiten samenhangt, strekt de maatregel er mede toe een bijdrage te leveren aan de oplossing
      van zijn verslavingsproblematiek dan wel van die andere problematiek.

      4 De rechter legt de maatregel slechts op, nadat hij een met redenen omkleed, gedagtekend en ondertekend advies
      over de wenselijkheid of noodzakelijkheid van de maatregel heeft doen overleggen. Indien dit advies eerder dan
      een jaar voor de aanvang van de terechtzitting is gedagtekend, kan de rechter hiervan slechts gebruik maken met
      instemming van het openbaar ministerie en de verdachte.

      5 Het vierde lid blijft buiten toepassing indien de verdachte weigert medewerking te verlenen aan het onderzoek dat
      ten behoeve van het advies moet worden verricht. Voor zover mogelijk wordt over de reden van de weigering rapport
      opgemaakt. De rechter doet zich zo veel mogelijk een ander advies of rapport dat hem over de wenselijkheid of
      noodzakelijkheid van de maatregel kan voorlichten en aan de totstandkoming waarvan de verdachte wel bereid is om
      medewerking te verlenen, overleggen.

      6 Bij het opleggen van de maatregel neemt de rechter de inhoud van de overige adviezen en rapporten die over
      de verdachte zijn uitgebracht, alsmede de veelvuldigheid van voorafgegane veroordelingen wegens misdrijf in
      aanmerking.

      7 Onder een veroordeling als bedoeld in het eerste lid, onder 2°, wordt mede verstaan een onherroepelijke
      veroordeling door een strafrechter in een andere lidstaat van de Europese Unie wegens soortgelijke feiten.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel38m
  - number: 38n
    text: |-
      1 De maatregel geldt voor de tijd van ten hoogste twee jaren, te rekenen van de dag waarop de rechterlijke
      uitspraak waarbij hij is opgelegd, onherroepelijk is geworden.

      2 Bij het bepalen van de duur van de maatregel kan de rechter rekening houden met de tijd die door de veroordeelde
      vóór de tenuitvoerlegging van de uitspraak in verzekering, in voorlopige hechtenis, in een psychiatrisch ziekenhuis
      of een instelling voor klinische observatie bestemd ingevolge een bevel tot observatie, is doorgebracht.

      3 De rechter kan ambtshalve, op vordering van het openbaar ministerie, dan wel op verzoek van de verdachte of diens
      raadsman, bij of na het opleggen van de maatregel beslissen tot een tussentijdse beoordeling van de noodzaak van de
      voortzetting van de tenuitvoerlegging van de maatregel.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel38n
  - number: 38p
    text: |-
      1 De rechter kan bepalen dat de maatregel niet ten uitvoer zal worden gelegd.

      2 De rechter die bepaalt dat de door hem opgelegde maatregel niet ten uitvoer zal worden gelegd stelt daarbij een
      proeftijd vast van ten hoogste drie jaren.

      3 Bij de toepassing van het eerste lid geldt als algemene voorwaarde dat:

      a. de veroordeelde zich voor het einde van de proeftijd niet schuldig maakt aan een strafbaar feit;

      b. de veroordeelde bij de naleving van de voorwaarden, bedoeld in het vierde lid, ten behoeve van het vaststellen
      van zijn identiteit medewerking verleent aan het nemen van een of meer vingerafdrukken of een identiteitsbewijs als
      bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] ter inzage aanbiedt.

      4 De rechter stelt ter bescherming van de veiligheid van personen of goederen voorwaarden betreffende het gedrag
      van de veroordeelde. De rechter kan een krachtens algemene maatregel van bestuur aangewezen reclasseringsinstelling
      opdracht geven de veroordeelde bij de naleving van de voorwaarden hulp en steun te verlenen.

      5 Een voorwaarde als bedoeld in het vierde lid kan inhouden dat de veroordeelde zich ambulant of intramuraal laat
      behandelen. Opname in een inrichting vindt in dit verband plaats voor een door de rechter te bepalen duur van ten
      hoogste twee jaren. Deze voorwaarde wordt slechts gesteld, indien de veroordeelde zich bereid heeft verklaard de
      behandeling te ondergaan.

      6 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de eisen waaraan een
      inrichting en een behandeling als bedoeld in het vijfde lid moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel38p
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 38v
    text: |-
      1 Ter beveiliging van de maatschappij of ter voorkoming van strafbare feiten kan een maatregel strekkende tot
      beperking van de vrijheid worden opgelegd bij de rechterlijke uitspraak:

      1°. waarbij iemand wegens een strafbaar feit wordt veroordeeld;

      2°. waarbij overeenkomstig [artikel 9a][ref1] wordt bepaald dat geen straf zal worden opgelegd.

      2 De maatregel kan inhouden dat de verdachte wordt bevolen:

      a. zich niet op te houden in een bepaald gebied,

      b. zich te onthouden van contact met een bepaalde persoon of bepaalde personen,

      c. op bepaalde tijdstippen of gedurende een bepaalde periode op een bepaalde locatie aanwezig te zijn,

      d. zich op bepaalde tijdstippen te melden bij de daartoe aangewezen opsporingsambtenaar.

      3 De maatregel kan voor een periode van ten hoogste vijf jaren worden opgelegd.

      4 De rechter kan bij zijn uitspraak, ambtshalve of op vordering van de officier van justitie, bevelen dat de
      maatregel dadelijk uitvoerbaar is indien er ernstig rekening mee moet worden gehouden dat de verdachte opnieuw een
      strafbaar feit pleegt of zich belastend gedraagt jegens een bepaalde persoon of bepaalde personen.

      5 De maatregel kan tezamen met straffen en andere maatregelen worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9a
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel38v
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 9a
  - number: 38w
    text: |-
      1 In het vonnis waarbij de maatregel als bedoeld in [artikel 38v][ref1] wordt opgelegd, beveelt de rechter dat
      vervangende hechtenis zal worden toegepast voor het geval niet aan de maatregel wordt voldaan.

      2 De rechter bepaalt in het vonnis de duur van de vervangende hechtenis die ten hoogste ten uitvoer wordt gelegd
      voor iedere keer dat niet aan de maatregel wordt voldaan. De duur van deze vervangende hechtenis wordt in gehele
      dagen, weken of maanden vastgesteld en bedraagt ten minste drie dagen.

      3 De totale duur van de tenuitvoergelegde vervangende hechtenis bedraagt ten hoogste zes maanden.

      4 Toepassing van de vervangende hechtenis heft de verplichtingen ingevolge de maatregel, bedoeld in
      [artikel 38v][ref2], tweede lid, niet op.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38v
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel38v
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel38w
