      [343][ref17], [344][ref18], [359][ref19], [361][ref20], [366][ref21], [373, laatste lid][ref22], [402][ref23],
      [416][ref24], [417][ref25], [420bis][ref26], [420bis.1][ref27] en [420ter][ref28];

      2°. de misdrijven omschreven in de [artikelen 92][ref29], [108][ref30], [109][ref31], [110][ref32], [115][ref33],
      [116][ref34], [117 tot en met 117b][ref35], [141][ref36], [181][ref37], [182][ref38], [287 tot en met 291][ref39],
      [293, eerste lid][ref40], [296][ref41], [300 tot en met 303][ref42], [381][ref43], [382][ref44], [395][ref45] en
      [396][ref46];

      3°. de misdrijven omschreven in de [artikelen 261 tot en met 271][ref47], [418][ref48] en [419][ref49];

      4°. de misdrijven omschreven in de [Opiumwet][ref50];

      5°. de misdrijven omschreven in de [Wet wapens en munitie][ref51];

      6°. de misdrijven omschreven in de [Wegenverkeerswet 1994](onbekend).


