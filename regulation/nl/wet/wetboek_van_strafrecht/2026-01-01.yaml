  - number: '448'
    text: |-
      Hij die niet voldoet aan een wettelijke verplichting tot aangifte aan de ambtenaar van de burgerlijke stand voor de
      registers van geboorte of overlijden, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel448
  - number: '449'
    text: |-
      1 De bedienaar van de godsdienst die, voordat partijen hem hebben doen blijken dat hun huwelijk ten overstaan
      van de ambtenaar van de burgerlijke stand is voltrokken, enige godsdienstige plechtigheid daartoe betrekkelijk
      verricht, wordt gestraft met geldboete van de tweede categorie.

      2 Indien tijdens het plegen van de overtreding nog geen twee jaren zijn verlopen sedert een vroegere veroordeling
      van de schuldige wegens gelijke overtreding onherroepelijk is geworden, kan hechtenis van ten hoogste zes maanden
      of geldboete van de derde categorie worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel449
  - number: '450'
    text: |-
      Hij die, getuige van het ogenblikkelijk levensgevaar waarin een ander verkeert, nalaat deze die hulp te verlenen
      of te verschaffen die hij hem, zonder gevaar voor zichzelf of anderen redelijkerwijs te kunnen duchten, verlenen
      of verschaffen kan, wordt, indien de dood van de hulpbehoevende volgt, gestraft met hechtenis van ten hoogste drie
      maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel450
  - number: '458'
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, zijn niet uitvliegend pluimgedierte laat lopen in tuinen of op enige
      grond die bezaaid, bepoot of beplant is, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel458
  - number: '459'
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, vee laat lopen in tuinen, hakbossen of rijswaarden, op enig wei- of
      hooiland of op enige grond die bezaaid, bepoot of beplant is, of die ter bezaaiing, bepoting of beplanting is
      gereedgemaakt, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel459
  - number: '460'
    text: |-
      Hij die zich, zonder daartoe gerechtigd te zijn, bevindt op enige grond die bezaaid, bepoot of beplant is, of die
      ter bezaaiing, bepoting of beplanting is gereedgemaakt, of gedurende de maanden mei tot en met oktober op enig wei-
      of hooiland, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel460
  - number: '461'
    text: |-
      Hij die, zonder daartoe gerechtigd te zijn, zich op eens anders grond waarvan de toegang op een voor hem blijkbare
      wijze door de rechthebbende is verboden, bevindt of daar vee laat lopen, wordt gestraft met geldboete van de eerste
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel461
  - number: '462'
    text: |-
      De ambtenaar, bevoegd tot de uitgifte van afschriften of uittreksels van vonnissen, die zodanig afschrift of
      uittreksel uitgeeft alvorens het vonnis behoorlijk is ondertekend, wordt gestraft met geldboete van de eerste
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel462
  - number: '463'
    text: |-
      De ambtenaar die zonder verlof van het bevoegd gezag afschrift maakt of uittreksel neemt van geheime
      regeringsbescheiden of die openbaar maakt, wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete
      van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel463
  - number: '464'
    text: |-
      Het hoofd van een gesticht, bestemd tot opsluiting van veroordeelden, voorlopig aangehoudenen of gegijzelden,
      of van een rijksinrichting voor kinderbescherming of psychiatrisch ziekenhuis, die iemand in het gesticht of
      ziekenhuis opneemt of houdt zonder zich het bevel van de bevoegde macht of de rechterlijke uitspraak te hebben
      laten vertonen, of die nalaat van deze opneming en van het bevel of de uitspraak op grond waarvan zij geschiedt,
      in zijn registers de vereiste inschrijving te doen, wordt gestraft met hechtenis van ten hoogste een maand of
      geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel464
  - number: '465'
    text: |-
      De ambtenaar van de burgerlijke stand die nalaat vóór de voltrekking van een huwelijk zich de bewijsstukken of
      verklaringen te laten geven die door enig wettelijk voorschrift worden gevorderd, wordt gestraft met geldboete van
      de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel465
  - number: '466'
    text: |-
      De ambtenaar van de burgerlijke stand die in strijd handelt met enig wettelijk voorschrift omtrent de registers
      of de akten van de burgerlijke stand of omtrent de formaliteiten vóór of de voltrekking van een huwelijk, wordt
      gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel466
  - number: '467'
    text: |-
      De ambtenaar van de burgerlijke stand die nalaat een akte in de registers op te nemen, wordt gestraft met geldboete
      van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel467
  - number: '468'
    text: |-
      Met geldboete van de eerste categorie wordt gestraft:

      1°. de ambtenaar van de burgerlijke stand die nalaat aan het bevoegd gezag de opgaven te doen die enig wettelijk
      voorschrift van hem vordert;

      2°. de ambtenaar die nalaat aan de ambtenaar van de burgerlijke stand de opgaven te doen die enig wettelijk
      voorschrift van hem vordert.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel468
  - number: 468a
    text: |-
      Onder ambtenaar van de burgerlijke stand wordt ten aanzien van de [artikelen 466-468][ref1] verstaan een ieder die
      ingevolge enig wettelijk voorschrift met de bewaring van een register van de burgerlijke stand is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel466
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel468a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '466'
  - number: '470'
    text: |-
      De schipper die niet alle door of krachtens wettelijke bepalingen gevorderde scheepspapieren, boeken, bescheiden of
      andere gegevensdragers aan boord heeft, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel470
  - number: '471'
    text: |-
      1 Met geldboete van de tweede categorie wordt gestraft:

      1°. de schipper van een Nederlands vaartuig die niet zorgt dat aan boord van zijn vaartuig de bij de wet vereiste
      dagboeken overeenkomstig de wettelijke voorschriften worden gehouden of die dagboeken niet vertoont wanneer de wet
      dit vordert;

      2°. de schipper van een Nederlands schip die het register van strafbare feiten, bedoeld in [artikel 539][ref1],
      niet overeenkomstig de wettelijke voorschriften houdt of niet vertoont wanneer de wet dit vordert;

      3°. de reder, rompbevrachter of eigenaar van een Nederlands schip die handelt in strijd met
      [artikel 19 van de Rijkswet nationaliteit zeeschepen][ref2];

      4°. de kapitein van een Nederlands schip die handelt in strijd met
      [artikel 20 van de Rijkswet nationaliteit zeeschepen][ref3];

      5°. de eigenaar, de rompbevrachter, de boekhouder of schipper van een Nederlands vaartuig die weigert aan
      belanghebbenden op hun aanvraag inzage of, tegen betaling van de kosten, afschrift te verstrekken van de aan boord
      van het vaartuig gehouden dagboeken.

      2 Indien tijdens het plegen van de overtreding nog geen twee jaren zijn verlopen sedert een vroegere veroordeling
      van de schuldige wegens een van deze overtredingen onherroepelijk is geworden, kan hechtenis van ten hoogste twee
      maanden of geldboete van de tweede categorie worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel539u
      [ref2]: https://wetten.overheid.nl/BWBR0048148#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0048148#Artikel20
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel471
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 539u
      - id: ref2
        bwb_id: BWBR0048148
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0048148
        artikel: '20'
  - number: 471a
    text: |-
      Hij die het bepaalde bij [artikel 539][ref1] overtreedt wordt gestraft met hechtenis van ten hoogste drie maanden
      of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel539u
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel471a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 539u
  - number: '472'
    text: |-
      De schipper van een Nederlands vaartuig die niet voldoet aan zijn wettelijke verplichting betreffende de
      inschrijving en kennisgeving van geboorten of sterfgevallen die gedurende een zeereis plaats hebben, wordt gestraft
      met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel472
  - number: '474'
    text: |-
      De schipper die niet voldoet aan de verplichtingen bedoeld in het [tweede lid van artikel 358a][ref1] of van
      [artikel 785 van het Wetboek van Koophandel][ref2], wordt gestraft met hechtenis van ten hoogste drie maanden of
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel358a
      [ref2]: https://wetten.overheid.nl/BWBR0001838#Artikel785
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel474
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 358a
      - id: ref2
        bwb_id: BWBR0001838
        artikel: '785'
  - number: '479'
    text: Het in werking treden van dit wetboek wordt nader bij de wet geregeld.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel479
