  - number: 77d
    text: |-
      1 De verjaringstermijn van het recht tot strafvordering, genoemd in [artikel 70][ref1], wordt ten aanzien van
      misdrijven tot de helft van de daar bedoelde duur ingekort.

      2 Het eerste lid is niet van toepassing op het misdrijf omschreven in [artikel 251][ref2] begaan door een persoon
      die ten tijde van het begaan van het strafbaar feit de leeftijd van zestien jaren heeft bereikt ten aanzien van een
      persoon die de leeftijd van achttien jaren nog niet heeft bereikt.

      3 Het recht tot strafvordering verjaart in twintig jaren voor:

      a. misdrijven waarop gevangenisstraf van twaalf jaren of meer is gesteld; en

      b. de misdrijven omschreven in de [artikelen 242][ref3], [243, eerste lid][ref4], [245][ref5],
      [246, eerste lid][ref6], [247, eerste en tweede lid][ref7], [249, eerste lid][ref8], [252][ref9], [253][ref10] en
      het misdrijf omschreven in [artikel 241, eerste en tweede lid][ref11], indien het feit is gepleegd ten aanzien van
      een persoon die de leeftijd van achttien jaren nog niet heeft bereikt.


