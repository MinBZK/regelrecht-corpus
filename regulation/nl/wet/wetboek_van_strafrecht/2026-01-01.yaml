        artikel: 77aa
  - number: 77aa
    text: |-
      1 De rechter kan aan een gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1] of, in
      bijzondere gevallen en na overleg met een dergelijke rechtspersoon, aan een particulier persoon, opdracht geven
      toezicht te houden op de naleving van de voorwaarden en de veroordeelde ten behoeve daarvan te begeleiden.

      2 De rechter kan, indien de veroordeelde ingevolge [artikel 255 van Boek 1 van het Burgerlijk Wetboek][ref2]
      onder toezicht is gesteld, aan een gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref3]
      opdragen aan de veroordeelde ter zake van de naleving der bijzondere voorwaarden hulp en steun te verlenen.

      3 Indien de jeugdige de leeftijd van zestien jaren heeft bereikt, kan de rechter een in
      [artikel 14c, zesde lid][ref4], bedoelde reclasseringsinstelling opdracht geven toezicht te houden op de naleving
      van de voorwaarden en de veroordeelde ten behoeve daarvan te begeleiden.

      4 Bij algemene maatregel van bestuur, op de voordracht van Onze Minister van Justitie en Veiligheid en Onze
      Minister van Volksgezondheid, Welzijn en Sport, kunnen regels worden gesteld omtrent de aard en de omvang van het
      toezicht en de begeleiding, bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel255
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
