        bwb_id: BWBR0001854
        artikel: '28'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '287'
  - number: 295a
    text: |-
      Bij veroordeling wegens een der misdrijven omschreven in de [artikelen 288a][ref1] en [289a][ref2] alsmede bij
      veroordeling wegens het misdrijf omschreven in [artikel 289][ref3], begaan met een terroristisch oogmerk, kan
      ontzetting van het in [artikel 28, eerste lid, onder 3°][ref4], vermelde recht worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel288a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel289a
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel289
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel28
