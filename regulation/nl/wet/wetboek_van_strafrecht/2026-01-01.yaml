        artikel: '240'
  - number: 254b
    text: |-
      Degene die opzettelijk in het openbaar of, indien een persoon daarbij zijns ondanks tegenwoordig is, op een niet
      openbare plaats handelingen die aanstotelijk zijn voor de eerbaarheid verricht, wordt gestraft met gevangenisstraf
      van ten hoogste zes maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel254b
  - number: 254ba
    text: |-
      1 Degene die

      a. opzettelijk en wederrechtelijk van een persoon een visuele weergave van seksuele aard vervaardigt;

      b. de beschikking heeft over een visuele weergave als bedoeld onder a terwijl diegene weet of redelijkerwijs moet
      vermoeden dat deze door of als gevolg van een onder a strafbaar gestelde handeling is verkregen,

      wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie.

      2 Degene die

      a. een visuele weergave als bedoeld in het eerste lid, onder a, openbaar maakt terwijl diegene weet of
      redelijkerwijs moet vermoeden dat deze door of als gevolg van een in het eerste lid, onder a, strafbaar gestelde
      handeling is verkregen;

      b. van een persoon een visuele weergave van seksuele aard openbaar maakt, terwijl diegene weet dat die
      openbaarmaking nadelig voor die persoon kan zijn,

      wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel254ba
  - number: 254c
    text: |-
      1 Degene die een visuele weergave van een seksuele handeling waarbij een mens en een dier zijn betrokken of
      schijnbaar zijn betrokken verspreidt, openlijk tentoonstelt, vervaardigt, invoert, doorvoert, uitvoert, of in bezit
      heeft, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.

      2 Indien het in het eerste lid omschreven feit wordt gepleegd door een persoon die daarvan een beroep of gewoonte
      maakt, wordt gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel254c
  - number: 254d
    text: |-
      Degene die seksuele handelingen verricht met een dier of een dier seksuele handelingen laat verrichten met diegene
      of met zichzelf of met een derde dan wel een dier seksuele handelingen laat ondergaan door een derde, wordt
      gestraft met gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel254d
  - number: '255'
    text: |-
      Hij die opzettelijk iemand tot wiens onderhoud, verpleging of verzorging hij krachtens wet of overeenkomst
      verplicht is, in een hulpeloze toestand brengt of laat, wordt gestraft met gevangenisstraf van ten hoogste twee
      jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel255
  - number: '256'
    text: |-
      Hij die een kind beneden de leeftijd van zeven jaren te vondeling legt of, met het oogmerk om er zich van te
      ontdoen, verlaat, wordt gestraft met gevangenisstraf van ten hoogste vier jaren en zes maanden of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel256
  - number: '257'
    text: |-
      1 Indien een der in de [artikelen 255][ref1] en [256][ref2] omschreven feiten zwaar lichamelijk letsel ten gevolge
      heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste zeven jaren en zes maanden of geldboete van
      de vijfde categorie.

      2 Indien een van deze feiten de dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste
      negen jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel255
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel256
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '255'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '256'
  - number: '258'
    text: |-
      Indien de schuldige aan het in [artikel 256][ref1] omschreven misdrijf de vader of de moeder is, kunnen te zijnen
      aanzien de in de [artikelen 256][ref2] en [257][ref3] bepaalde gevangenisstraffen met een derde worden verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel256
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel256
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel257
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel258
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '256'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '256'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '257'
  - number: '259'
    text: |-
      Indien de moeder onder de werking van vrees voor de ontdekking van haar bevalling haar kind kort na de
      geboorte te vondeling legt of, met het oogmerk om er zich van te ontdoen, verlaat, wordt het maximum der in
      de [artikelen 256][ref1] en [257][ref2] vermelde gevangenisstraffen tot de helft verminderd en wordt de in
      [artikel 257][ref3] vermelde geldboete tot de vierde categorie teruggebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel256
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel257
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel257
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel259
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '256'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '257'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '257'
  - number: '260'
    text: |-
      1 Bij veroordeling wegens een der in de [artikelen 255-259][ref1] omschreven misdrijven, kan ontzetting van de in
      [artikel 28, eerste lid, onder 4°][ref2], vermelde rechten worden uitgesproken.

      2 Bij veroordeling wegens het in [artikel 255][ref3] omschreven misdrijf kan de schuldige, indien hij het misdrijf
      in zijn beroep heeft begaan, worden ontzet van de uitoefening van dat beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel255
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel255
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '255'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '255'
  - number: '261'
    text: |-
      1 Hij die opzettelijk iemands eer of goede naam aanrandt, door telastlegging van een bepaald feit, met het
      kennelijke doel om daaraan ruchtbaarheid te geven, wordt, als schuldig aan smaad, gestraft met gevangenisstraf van
      ten hoogste zes maanden of geldboete van de derde categorie.

      2 Indien dit geschiedt door middel van geschriften of afbeeldingen, verspreid, openlijk tentoongesteld of
      aangeslagen, of door geschriften waarvan de inhoud openlijk ten gehore wordt gebracht, wordt de dader, als schuldig
      aan smaadschrift, gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.

      3 Noch smaad, noch smaadschrift bestaat voor zover de dader heeft gehandeld tot noodzakelijke verdediging, of te
      goeder trouw heeft kunnen aannemen dat het te last gelegde waar was en dat het algemeen belang de telastlegging
      eiste.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel261
  - number: '262'
    text: |-
      1 Hij die het misdrijf van smaad of smaadschrift pleegt, wetende dat het te last gelegde feit in strijd met de
      waarheid is, wordt, als schuldig aan laster, gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete
      van de vierde categorie.

      2 Ontzetting van de in [artikel 28, eerste lid, onder 1° en 2°][ref1], vermelde rechten kan worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel262
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '265'
    text: |-
      1 Indien de beledigde aan het te last gelegde feit bij rechterlijk gewijsde onherroepelijk is schuldig verklaard,
      is veroordeling wegens laster uitgesloten.

      2 Indien hij van het te last gelegde feit bij rechterlijk gewijsde onherroepelijk is vrijgesproken, wordt dat
      gewijsde als volkomen bewijs van de onwaarheid van het feit aangemerkt.

      3 Indien tegen de beledigde wegens het hem te last gelegde feit een strafvervolging is aangevangen, wordt de
      vervolging wegens laster geschorst totdat bij gewijsde onherroepelijk over het te last gelegde feit is beslist.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel265
  - number: '266'
    text: |-
      1 Elke opzettelijke belediging die niet het karakter van smaad of smaadschrift draagt, hetzij in het openbaar
      mondeling of bij geschrift of afbeelding, hetzij iemand, in zijn tegenwoordigheid mondeling of door feitelijkheden,
      hetzij door een toegezonden of aangeboden geschrift of afbeelding, aangedaan, wordt, als eenvoudige belediging,
      gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.

      2 Niet als eenvoudige belediging strafbaar zijn gedragingen die ertoe strekken een oordeel te geven over de
      behartiging van openbare belangen, en die er niet op zijn gericht ook in ander opzicht of zwaarder te grieven dan
      uit die strekking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel266
  - number: '267'
    text: |-
      1 De in de voorgaande artikelen van deze titel bepaalde gevangenisstraffen kunnen met een derde worden verhoogd,
      indien de belediging wordt aangedaan aan:

      1°. de Koning, de echtgenoot van de Koning, de vermoedelijke opvolger van de Koning, diens echtgenoot, of de
      Regent;

      2°. een ambtenaar gedurende of ter zake van de rechtmatige uitoefening van zijn bediening, met uitzondering van
      leden van algemeen vertegenwoordigende lichamen;

      3°. een openbaar lichaam of een openbare instelling.

      2 Met een ambtenaar wordt gelijkgesteld een persoon in de openbare dienst van een vreemde staat die in Nederland op
      door het volkenrecht toegelaten wijze zijn bediening uitoefent.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel267
  - number: '268'
    text: |-
      1 Hij die opzettelijk tegen een bepaald persoon bij de overheid een valse klacht of aangifte schriftelijk inlevert
      of in schrift doet brengen, waardoor de eer of goede naam van die persoon wordt aangerand, wordt, als schuldig
      aan lasterlijke aanklacht, gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde
      categorie.

      2 Ontzetting van de in [artikel 28, eerste lid, onder 1° en 2°][ref1], vermelde rechten kan worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '269'
    text: |-
      1 Belediging, strafbaar krachtens deze titel, wordt niet vervolgd dan op klacht van hem tegen wie het misdrijf
      is gepleegd.

      2 Het eerste lid is niet van toepassing op de gevallen voorzien in [artikel 267][ref1].

      3 Het eerste lid is tevens niet van toepassing in geval van belediging van leden van algemeen vertegenwoordigende
      lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel267
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '267'
  - number: '270'
    text: |-
      1 Hij die ten aanzien van een overledene een feit pleegt dat, ware deze nog in leven, als smaadschrift of smaad
      zou zijn gekenmerkt, wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede
      categorie.

      2 Dit misdrijf wordt niet vervolgd dan op klacht hetzij van een der bloedverwanten of aangehuwden van de overledene
      in de rechte linie of zijlinie tot de tweede graad, hetzij van zijn echtgenoot.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel270
  - number: '271'
    text: |-
      1 Hij die een geschrift of afbeelding van beledigende of voor een overledene smadelijke inhoud verspreidt, openlijk
      tentoonstelt of aanslaat of, om verspreid, openlijk tentoongesteld of aangeslagen te worden, in voorraad heeft,
      wordt, indien hij weet of ernstige reden heeft om te vermoeden dat de inhoud van het geschrift of de afbeelding van
      zodanige aard is, gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de tweede categorie.

      2 Met dezelfde straf wordt gestraft hij die, met gelijke wetenschap of een gelijke reden tot vermoeden, de inhoud
      van een zodanig geschrift openlijk ten gehore brengt.

      3 Indien de schuldige een van de misdrijven omschreven in dit artikel in zijn beroep begaat en er tijdens het
      plegen van het misdrijf nog geen twee jaren zijn verlopen sedert een vroegere veroordeling van de schuldige wegens
      een van deze misdrijven onherroepelijk is geworden, kan hij van de uitoefening van dat beroep worden ontzet.

      4 De misdrijven worden niet vervolgd dan op klacht van de in [artikel 269][ref1] en het
      [tweede lid van artikel 270][ref2] aangewezen personen, behalve in de gevallen voorzien in [artikel 267][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel269
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel270
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel267
