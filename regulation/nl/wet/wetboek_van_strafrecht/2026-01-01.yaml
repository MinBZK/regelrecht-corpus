  - number: '177'
    text: |-
      1 Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie wordt gestraft:

      1°. hij die een ambtenaar een gift of belofte doet dan wel een dienst verleent of aanbiedt met het oogmerk om hem
      te bewegen in zijn bediening iets te doen of na te laten;

      2°. hij die een ambtenaar een gift of belofte doet dan wel een dienst verleent of aanbiedt ten gevolge of naar
      aanleiding van hetgeen door deze in zijn huidige of vroegere bediening is gedaan of nagelaten.

      2 Met dezelfde straf wordt gestraft hij die een feit als in het eerste lid, onder 1°, omschreven, begaat jegens een
      persoon in het vooruitzicht van een dienstbetrekking bij een overheidswerkgever, indien de dienstbetrekking bij een
      overheidswerkgever is gevolgd.

      3 Indien de schuldige een van de misdrijven omschreven in dit artikel in zijn beroep begaat, kan hij van de
      uitoefening van dat beroep worden ontzet.

      4 Ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten kan worden
      uitgesproken.

      5 Indien het feit is gepleegd ten behoeve van een buitenlandse mogendheid wordt de op het feit gestelde
      gevangenisstraf met een derde verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel177
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '178'
    text: |-
      1 Hij die een rechter een gift of belofte doet dan wel een dienst verleent of aanbiedt met het oogmerk invloed uit
      te oefenen op de beslissing van een aan diens oordeel onderworpen zaak, wordt gestraft met gevangenisstraf van ten
      hoogste negen jaren of geldboete van de vijfde categorie.

      2 Indien die gift of belofte gedaan wordt dan wel die dienst verleend of aangeboden wordt met het oogmerk om een
      veroordeling in een strafzaak te verkrijgen, wordt de schuldige gestraft met gevangenisstraf van ten hoogste twaalf
      jaren of geldboete van de vijfde categorie.

      3 Indien de schuldige een van de misdrijven omschreven in dit artikel in zijn beroep begaat, kan hij van de
      uitoefening van dat beroep worden ontzet.

      4 Ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten kan worden
      uitgesproken.

      5 Indien het feit is gepleegd ten behoeve van een buitenlandse mogendheid wordt de op het feit gestelde
      gevangenisstraf met een derde verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel178
    references:
