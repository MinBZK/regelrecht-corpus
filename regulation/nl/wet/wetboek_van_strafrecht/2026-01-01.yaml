  - number: 77za
    text: |-
      De rechter kan bij zijn uitspraak, ambtshalve of op vordering van het openbaar ministerie, bevelen dat de op grond
      van [artikel 77z][ref1] gestelde voorwaarden, en het op grond van [artikel 77aa][ref2] uit te oefenen toezicht,
      dadelijk uitvoerbaar zijn, indien er ernstig rekening mee moet worden gehouden dat de veroordeelde wederom een
      misdrijf zal begaan dat gericht is tegen of gevaar veroorzaakt voor de onaantastbaarheid van het lichaam van een of
      meer personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77z
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77aa
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel77za
