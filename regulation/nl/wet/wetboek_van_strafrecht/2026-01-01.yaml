  - number: 77s
    text: |-
      1 Aan de verdachte bij wie ten tijde van het begaan van het misdrijf een gebrekkige ontwikkeling of ziekelijke
      stoornis van de geestvermogens bestond, kan de maatregel van plaatsing in een inrichting voor jeugdigen worden
      opgelegd, indien

      a. het feit waarvoor de maatregel wordt opgelegd, een misdrijf is waarop naar de wettelijke omschrijving een
      gevangenisstraf van vier jaren of meer is gesteld dan wel behoort tot een der misdrijven omschreven in de
      [artikelen 132][ref1], [285, eerste lid][ref2], [285b][ref3] en [395][ref4] van het Wetboek van Strafrecht,
      __REF004___________________________________________________________________________________________________________
      ___________, en [11, tweede lid, van de Opiumwet][ref6], en

      b. de veiligheid van anderen dan wel de algemene veiligheid van personen of goederen het opleggen van die maatregel
      eist, en

      c. de maatregel in het belang is van een zo gunstig mogelijke verdere ontwikkeling van de verdachte.

      2 De rechter legt de maatregel slechts op, nadat hij zich een met redenen omkleed, gedagtekend en ondertekend
      advies heeft doen overleggen van ten minste twee gedragsdeskundigen van verschillende disciplines. Van deze
      gedragsdeskundigen dient er één een psychiater te zijn. Het advies wordt door de deskundigen gezamenlijk dan
      wel door ieder van hen afzonderlijk uitgebracht. Indien dit advies eerder dan een jaar voor de aanvang van de
      terechtzitting is gedagtekend kan de rechter hier slechts gebruik van maken met instemming van het openbaar
      ministerie en de verdachte.

      3 Bij toepassing van het eerste lid, kan de rechter afzien van het opleggen van straf, ook indien hij van oordeel
      is dat het feit wel aan de verdachte kan worden toegerekend.

      4 Bij het opleggen van de maatregel neemt de rechter de ernst van het begane feit of de veelvuldigheid van
      voorafgegane veroordelingen wegens misdrijf in aanmerking.

      5 Het tweede lid blijft buiten toepassing indien de betrokkene weigert medewerking te verlenen aan het onderzoek
      dat ten behoeve van het advies moet worden verricht. Voor zover mogelijk maken de gedragsdeskundigen gezamenlijk
      dan wel ieder van hen afzonderlijk over de reden van weigering rapport op. De rechter doet zich zoveel mogelijk een
      ander advies of rapport, dat hem over de wenselijkheid of noodzakelijkheid van de oplegging van de maatregel kan
      voorlichten en aan de totstandkoming waarvan de betrokkene wel bereid is om medewerking te verlenen, overleggen.

      6 Indien de maatregel is opgelegd draagt Onze Minister de tenuitvoerlegging op aan een inrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref7], of doet hij de veroordeelde elders
      opnemen.

      7 De maatregel geldt voor de tijd van drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel132
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel285
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel285b
