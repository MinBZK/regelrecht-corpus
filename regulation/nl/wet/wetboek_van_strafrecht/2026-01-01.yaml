        artikel: '9'
  - number: '62'
    text: |-
      1 Bij samenloop op de wijze in de [artikelen 57][ref1] en [58][ref2] bedoeld, hetzij van overtredingen met
      misdrijven, hetzij van overtredingen onderling, wordt voor elke overtreding zonder vermindering straf opgelegd.

      2 De vervangende vrijheidsstraffen mogen voor de misdrijven en overtredingen of voor de overtredingen gezamenlijk
      het maximum, bepaald in [artikel 24][ref3], niet overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel24c
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel62
