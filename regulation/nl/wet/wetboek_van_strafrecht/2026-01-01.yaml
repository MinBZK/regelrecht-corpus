    text: |-
      De rechter kan bij zijn uitspraak, ambtshalve of op vordering van het openbaar ministerie, bevelen dat de op grond
      van [artikel 14c][ref1] gestelde voorwaarden en hierop uit te oefenen toezicht, dadelijk uitvoerbaar zijn, indien
      er ernstig rekening mee moet worden gehouden dat de veroordeelde wederom een misdrijf zal begaan dat gericht is
      tegen of gevaar veroorzaakt voor de onaantastbaarheid van het lichaam van een of meer personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14c
