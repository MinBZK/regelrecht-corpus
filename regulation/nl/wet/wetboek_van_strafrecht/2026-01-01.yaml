  - number: '8'
    text: |-
      De Nederlandse strafwet is toepasselijk op de Nederlandse ambtenaar die zich buiten Nederland schuldig maakt aan
      een van de misdrijven omschreven in [Titel XXVIII van het Tweede Boek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: 8a
    text: |-
      De Nederlandse strafwet is toepasselijk op de schipper en opvarenden van een Nederlands vaartuig die
      zich buiten Nederland, ook buiten boord, schuldig maken aan een van de strafbare feiten omschreven in
      [Titel XXIX van het Tweede Boek][ref1] en [Titel IX van het Derde Boek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001854
  - number: 8b
    text: |-
      1 De Nederlandse strafwet is toepasselijk op een ieder tegen wie de strafvervolging door Nederland van een vreemde
      staat is overgenomen op grond van een verdrag waaruit de bevoegdheid tot strafvervolging voor Nederland volgt.

      2 De Nederlandse strafwet is toepasselijk op een ieder tegen wie de strafvervolging door het Nederlands openbaar
      ministerie is overgenomen op grond van een daartoe strekkend verzoek van het openbaar ministerie van Bonaire, Sint
      Eustatius en Saba.

      3 De Nederlandse strafwet is voorts toepasselijk op een ieder wiens uitlevering ter zake van een terroristisch
      misdrijf dan wel een misdrijf ter voorbereiding of vergemakkelijking van een terroristisch misdrijf ontoelaatbaar
      is verklaard, afgewezen of geweigerd.

      4 De Nederlandse strafwet is voorts toepasselijk op een ieder tegen wie de strafvervolging door Nederland is
      overgenomen op verzoek van een krachtens verdrag of besluit van een door een volkenrechtelijke organisatie
      ingesteld internationaal gerecht.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel8b
  - number: 8c
    text: |-
      De Nederlandse strafwet is toepasselijk op de vreemdeling die zich buiten Nederland schuldig maakt aan een misdrijf
      waarop naar de wettelijke omschrijving een gevangenisstraf van ten minste acht jaren is gesteld, indien deze
      vreemdeling zich in Nederland bevindt en:

      a. uitlevering ter zake van dit misdrijf is geweigerd op een grond die niet tevens inhoudt dat naar Nederlands
      recht geen vervolging kan plaatshebben, of

      b. uitlevering ter zake van dit misdrijf wegens het ontbreken van een verdragsrelatie niet mogelijk is, voor zover
      op het feit door de wet van het land waar het begaan is, straf is gesteld.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel8c
  - number: 8d
    text: |-
      De toepasselijkheid van de [artikelen 2 tot en met 8c][ref1] wordt beperkt door de uitzonderingen in het
      volkenrecht erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel2
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '2'
  - number: '9'
    text: |-
      1 De straffen zijn:

      a. hoofdstraffen:

      1°. gevangenisstraf;

      2°. hechtenis;

      3°. taakstraf;

      4°. geldboete;

      b. bijkomende straffen:

      1°. ontzetting van bepaalde rechten;

      2°. verbeurdverklaring;

      3°. openbaarmaking van de rechterlijke uitspraak.

      2 Ten aanzien van misdrijven die worden bedreigd met een vrijheidsstraf of een geldboete of ten aanzien van
      overtredingen die worden bedreigd met een vrijheidsstraf kan, behoudens in bij de wet bepaalde gevallen, in plaats
      daarvan een taakstraf worden opgelegd.

      3 In het geval gevangenisstraf, hechtenis, vervangende hechtenis daaronder niet begrepen, of een taakstraf wordt
      opgelegd, kan tevens een geldboete worden opgelegd.

      4 In geval van veroordeling tot gevangenisstraf of tot hechtenis, vervangende hechtenis daaronder niet begrepen,
      waarvan het onvoorwaardelijk ten uitvoer te leggen deel ten hoogste zes maanden bedraagt, kan de rechter tevens een
      taakstraf opleggen.

      5 Een bijkomende straf kan, in de gevallen waarin de wet haar oplegging toelaat, zowel afzonderlijk als te zamen
      met hoofdstraffen en met andere bijkomende straffen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel9
  - number: 9a
    text: |-
      Indien de rechter dit raadzaam acht in verband met de geringe ernst van het feit, de persoonlijkheid van de dader
      of de omstandigheden waaronder het feit is begaan, dan wel die zich nadien hebben voorgedaan, kan hij in het vonnis
      bepalen dat geen straf of maatregel zal worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel9a
  - number: '10'
    text: |-
      1 De gevangenisstraf is levenslang of tijdelijk.

      2 De duur van de tijdelijke gevangenisstraf is ten minste een dag en ten hoogste vijfentwintig jaren.

      3 Zij kan voor ten hoogste dertig achtereenvolgende jaren worden opgelegd in de gevallen waarin op het misdrijf
      levenslange en tijdelijke gevangenisstraf ter keuze van de rechter zijn gesteld, en in die waarin wegens
      strafverhoging ter zake van samenloop van misdrijven, terroristische misdrijven, herhaling van misdrijf of het
      bepaalde bij [artikel 44][ref1], de tijd van vijfentwintig jaren wordt overschreden.

      4 Zij kan in geen geval de tijd van dertig jaren te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel44
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '44'
  - number: 14a
    text: |-
      1 In geval van veroordeling tot gevangenisstraf van ten hoogste twee jaren, tot hechtenis, vervangende hechtenis
      daaronder niet begrepen, tot taakstraf of tot geldboete, kan de rechter bepalen dat de straf of een gedeelte
      daarvan niet zal worden tenuitvoergelegd.

      2 Ingeval van veroordeling tot gevangenisstraf van meer dan twee jaren en ten hoogste vier jaren kan de rechter
      bepalen dat een gedeelte van de straf, tot ten hoogste twee jaren, niet zal worden tenuitvoergelegd.

      3 De rechter kan voorts bepalen dat opgelegde bijkomende straffen geheel of gedeeltelijk niet zullen worden
      tenuitvoergelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel14a
  - number: 14b
    text: |-
      1 De rechter die bepaalt dat een door hem opgelegde straf geheel of gedeeltelijk niet zal worden tenuitvoergelegd,
      stelt daarbij een proeftijd vast.

      2 De proeftijd bedraagt ten hoogste drie jaren. De proeftijd kan ten hoogste tien jaren bedragen indien er ernstig
      rekening mee moet worden gehouden dat de veroordeelde wederom een misdrijf zal begaan dat gericht is tegen of
      gevaar veroorzaakt voor de onaantastbaarheid van het lichaam van een of meer personen. Onder gericht zijn tegen of
      gevaar veroorzaken voor de onaantastbaarheid van het lichaam van een of meer personen wordt voor de toepassing van
      dit artikel mede begrepen het misdrijf, bedoeld in [artikel 252][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel252
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '252'
  - number: 14c
    text: |-
      1 Toepassing van [artikel 14a][ref1] geschiedt onder de algemene voorwaarde dat de veroordeelde zich voor het einde
      van de proeftijd niet schuldig maakt aan een strafbaar feit.

      2 Bij toepassing van [artikel 14a][ref2] kunnen voorts de volgende bijzondere voorwaarden worden gesteld, waaraan
      de veroordeelde gedurende de proeftijd, of een bij de veroordeling te bepalen gedeelte daarvan, dan wel binnen een
      door de rechter te bepalen termijn, ten hoogste gelijk aan de proeftijd, heeft te voldoen:

      1°. gehele of gedeeltelijke vergoeding van de door het strafbare feit veroorzaakte schade;

      2°. geheel of gedeeltelijk herstel van de door het strafbare feit veroorzaakte schade;

      3°. storting van een door de rechter vast te stellen waarborgsom, ten hoogste gelijk aan het verschil tussen het
      maximum van de geldboete die voor het feit kan worden opgelegd en de opgelegde boete;

      4°. storting van een door de rechter vast te stellen geldbedrag in het schadefonds geweldsmisdrijven of ten gunste
      van een instelling die zich ten doel stelt belangen van slachtoffers van strafbare feiten te behartigen. Het bedrag
      kan niet hoger zijn dan de geldboete die ten hoogste voor het strafbare feit kan worden opgelegd;

      5°. een verbod contact te leggen of te laten leggen met bepaalde personen of instellingen;

      6°. een verbod zich op of in de directe omgeving van een bepaalde locatie te bevinden;

      7°. een verplichting op bepaalde tijdstippen of gedurende een bepaalde periode op een bepaalde locatie aanwezig
      te zijn;

      8°. een verplichting zich op bepaalde tijdstippen te melden bij een bepaalde instantie;

      9°. een verbod op het gebruik van verdovende middelen of alcohol en de verplichting ten behoeve van de naleving van
      dit verbod mee te werken aan bloedonderzoek of urineonderzoek;

      10°. opneming van de veroordeelde in een zorginstelling;

      11°. een verplichting zich onder behandeling te stellen van een deskundige of zorginstelling;

      12°. het verblijven in een instelling voor begeleid wonen of maatschappelijke opvang;

      13°. het deelnemen aan een gedragsinterventie;

      14°. andere voorwaarden, het gedrag van de veroordeelde betreffende.

      3 Indien bij de toepassing van [artikel 14a][ref3] een bijzondere voorwaarde is gesteld, zijn daaraan van
      rechtswege de voorwaarden verbonden dat de veroordeelde:

      a. ten behoeve van het vaststellen van zijn identiteit medewerking verleent aan het nemen van een of meer
      vingerafdrukken of een identiteitsbewijs als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref4] ter
      inzage aanbiedt; en

      b. medewerking verleent aan het reclasseringstoezicht, bedoeld in het zesde lid, daaronder begrepen de medewerking
      aan huisbezoeken en het zich melden bij de reclasseringsinstelling zo vaak en zolang als de reclasseringsinstelling
      dit noodzakelijk acht.

      4 Aan een bijzondere voorwaarde kan elektronisch toezicht worden verbonden.

      5 Bij het stellen van één van de bijzondere voorwaarden genoemd in het tweede lid, onder 3° en 4°, vinden de
      [artikelen 23, eerste en tweede lid][ref5], en [24][ref6] overeenkomstige toepassing.

      6 De rechter kan opdracht geven dat de reclassering toezicht houdt op de naleving van de voorwaarden en de
      veroordeelde ten behoeve daarvan begeleidt.

      7 Gedurende de proeftijd of gedurende de tijd dat deze is geschorst kan de rechter in de gestelde bijzondere
      voorwaarden of in de termijn waartoe deze voorwaarden in hun werking binnen de proeftijd zijn beperkt wijziging
      brengen, deze voorwaarden opheffen, alsnog bijzondere voorwaarden stellen en een opdracht als bedoeld in het zesde
      lid, geven, wijzigen of opheffen.


