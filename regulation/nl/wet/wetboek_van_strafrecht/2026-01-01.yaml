  - number: 254a
    text: |-
      1 Bij veroordeling wegens een van de in de [artikelen 240 tot en met 253][ref1] omschreven misdrijven, kan
      ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref2], vermelde rechten worden uitgesproken.

      2 Indien degene die zich schuldig maakt aan één van de misdrijven omschreven in de
      [artikelen 240 tot en met 253][ref3] het misdrijf in de uitoefening van een beroep begaat, kan diegene van de
      uitoefening van dat beroep worden ontzet.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel240
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel240
