  - number: 139a
    text: |-
      1 Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft hij die met
      een technisch hulpmiddel een gesprek dat in een woning, besloten lokaal of erf wordt gevoerd opzettelijk:

      1°. anders dan in opdracht van een deelnemer aan dat gesprek afluistert;

      2°. zonder deelnemer aan dat gesprek te zijn en anders dan in opdracht van zulk een deelnemer opneemt.

      2 Het eerste lid is niet van toepassing op het opnemen:

      1°. van gegevens die worden verwerkt of overgedragen door middel van telecommunicatie of door middel van een
      geautomatiseerd werk;

      2°. behoudens in geval van kennelijk misbruik, met een technisch hulpmiddel dat op gezag van degene bij wie de
      woning, het lokaal of het erf in gebruik is, niet heimelijk aanwezig is;

      3°. ter uitvoering van de [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039896
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel139a
    references:
