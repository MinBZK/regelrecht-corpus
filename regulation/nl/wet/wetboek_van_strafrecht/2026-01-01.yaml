      1 Bij veroordeling wegens een der in deze titel omschreven misdrijven, kan de schuldige worden ontzet van de
      uitoefening van het beroep waarin hij het misdrijf begaan heeft.

      2 Bij veroordeling wegens een der in de [artikelen 225 tot en met 232][ref1] en [artikel 234][ref2] omschreven
      misdrijven, kan ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref3], vermelde rechten worden
      uitgesproken.


