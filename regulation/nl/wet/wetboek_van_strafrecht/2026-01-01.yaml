  - number: 36f
    text: |-
      1 Aan degene die bij rechterlijke uitspraak wegens een strafbaar feit wordt veroordeeld tot een straf of aan
      wie bij rechterlijke uitspraak een maatregel wordt opgelegd dan wel ten aanzien van wie met toepassing van
      [artikel 2.3 van de Wet forensische zorg][ref1] een zorgmachtiging of rechterlijke machtiging is afgegeven
      op de gronden, genoemd in artikel 2.3, eerste lid, onderdeel 1°, 2° of 4°, van de Wet forensische zorg,
      of waarbij door de rechter bij de strafoplegging rekening is gehouden met een strafbaar feit, waarvan
      in de dagvaarding is meegedeeld dat het door de verdachte is erkend en ter kennis van de rechtbank wordt
      gebracht dan wel jegens wie een strafbeschikking wordt uitgevaardigd, kan de verplichting worden opgelegd
      tot betaling aan de staat van een som gelds ten behoeve van het slachtoffer of de personen genoemd in
      [artikel 51f, tweede lid, van het Wetboek van Strafvordering][ref2]. De staat keert een ontvangen bedrag onverwijld
      uit aan het slachtoffer of de personen genoemd in artikel 51f, tweede lid, van het Wetboek van Strafvordering.

      2 De maatregel kan worden opgelegd indien en voor zover de verdachte jegens het slachtoffer naar burgerlijk recht
      aansprakelijk is voor de schade die door het strafbare feit is toegebracht.

      3 De maatregel kan te zamen met straffen en andere maatregelen worden opgelegd.

      4 [Artikel 24a][ref3] is van overeenkomstige toepassing.

      5 De rechter bepaalt bij de oplegging van de maatregel de duur volgens welke met toepassing van
      [artikel 6:4:20 van het Wetboek van Strafvordering][ref4] gijzeling kan worden toegepast. Bij het bepalen van
      de duur wordt voor elke volle € 25 van het opgelegde bedrag niet meer dan één dag gerekend. De duur beloopt ten
      hoogste één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel2.3
