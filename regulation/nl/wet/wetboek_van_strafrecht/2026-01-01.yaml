  - number: 138ab
    text: |-
      1 Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt, als schuldig aan
      computervredebreuk, gestraft hij die opzettelijk en wederrechtelijk binnendringt in een geautomatiseerd werk of in
      een deel daarvan. Van binnendringen is in ieder geval sprake indien de toegang tot het werk wordt verworven:

      a. door het doorbreken van een beveiliging,

      b. door een technische ingreep,

      c. met behulp van valse signalen of een valse sleutel, of

      d. door het aannemen van een valse hoedanigheid.

      2 Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie wordt gestraft
      computervredebreuk, indien de dader vervolgens gegevens die zijn opgeslagen, worden verwerkt of overgedragen door
      middel van het geautomatiseerd werk waarin hij zich wederrechtelijk bevindt, voor zichzelf of een ander overneemt,
      aftapt of opneemt.

      3 Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie wordt gestraft
      computervredebreuk gepleegd door tussenkomst van een openbaar telecommunicatienetwerk, indien de dader vervolgens

      a. met het oogmerk zichzelf of een ander wederrechtelijk te bevoordelen gebruik maakt van verwerkingscapaciteit van
      een geautomatiseerd werk;

      b. door tussenkomst van het geautomatiseerd werk waarin hij is binnengedrongen de toegang verwerft tot het
      geautomatiseerd werk van een derde.

      4 Indien het feit is gepleegd ten behoeve van een buitenlandse mogendheid wordt de op het feit gestelde
      gevangenisstraf met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel138ab
  - number: 138b
    text: |-
      1 Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft hij die
      opzettelijk en wederrechtelijk de toegang tot of het gebruik van een geautomatiseerd werk belemmert door daaraan
      gegevens aan te bieden of toe te zenden.

      2 Indien het feit wordt gepleegd:

      a. met behulp van een aanzienlijk aantal geautomatiseerde werken die getroffen zijn door het gebruik van een middel
      als bedoeld in [artikel 139d, tweede lid][ref1], dat hoofdzakelijk daarvoor geschikt is gemaakt of ontworpen; of

      b. met het oogmerk om zich of een ander wederrechtelijk te bevoordelen,

      wordt de schuldige gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.

      3 Indien het feit ernstige schade veroorzaakt, of is gepleegd tegen een geautomatiseerd werk behorende tot de
      vitale infrastructuur, wordt de schuldige gestraft met een gevangenisstraf van ten hoogste vijf jaren of geldboete
      van de vierde categorie.

      4 Indien het feit is gepleegd ten behoeve van een buitenlandse mogendheid wordt de op het feit gestelde
      gevangenisstraf met een derde verhoogd.

      5 Indien het feit wordt gepleegd met het oogmerk om een terroristisch misdrijf voor te bereiden of gemakkelijk te
      maken, wordt de op het feit gestelde gevangenisstraf met een derde verhoogd.

      6 Indien een feit is begaan met een terroristisch oogmerk, wordt de op het feit gestelde gevangenisstraf met de
      helft verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel139d
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel138b
