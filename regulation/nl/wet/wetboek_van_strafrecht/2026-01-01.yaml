  - number: 37b
    text: |-
      1 De rechter kan bevelen dat de ter beschikking gestelde van overheidswege wordt verpleegd, indien de veiligheid
      van anderen dan wel de algemene veiligheid van personen of goederen de verpleging eist.

      2 Indien de rechter naast de maatregel van terbeschikkingstelling met bevel tot verpleging van overheidswege een
      gevangenisstraf heeft opgelegd kan de rechter in zijn uitspraak een advies opnemen omtrent het tijdstip waarop de
      terbeschikkingstelling met verpleging van overheidswege dient aan te vangen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel37b
  - number: '38'
    text: |-
      1 Indien de rechter niet een bevel als bedoeld in [artikel 37b][ref1] geeft, stelt hij ter bescherming van de
      veiligheid van anderen dan wel de algemene veiligheid van personen of goederen voorwaarden betreffende het gedrag
      van de ter beschikking gestelde. Als algemene voorwaarde geldt dat de ter beschikking gestelde ten behoeve van
      het vaststellen van zijn identiteit medewerking verleent aan het nemen van een of meer vingerafdrukken of een
      identiteitsbewijs als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref2] ter inzage aanbiedt.

      2 De rechter geeft tevens een in de uitspraak aangewezen instelling, die aan bepaalde bij of krachtens algemene
      maatregel van bestuur te stellen eisen voldoet, opdracht de ter beschikking gestelde bij de naleving van de
      voorwaarden hulp en steun te verlenen.

      3 Indien bij de uitspraak tevens een vrijheidsstraf wordt opgelegd, kan deze in het in het eerste lid van dit
      artikel bedoelde geval ten hoogste op vijf jaar worden bepaald.

      4 Indien bij de uitspraak tevens een vrijheidsstraf wordt opgelegd voor een langere periode dan drie jaar legt de
      rechter in de uitspraak de aard van de zorgverlening vast, die als voorwaarde is vastgesteld.

      5 Een voorwaarde kan de rechter slechts stellen, indien de ter beschikking gestelde zich bereid heeft verklaard tot
      naleving van de voorwaarde.

      6 De rechter kan op vordering van de officier van justitie of ambtshalve bevelen dat de terbeschikkingstelling met
      voorwaarden dadelijk uitvoerbaar is.

      7 Een bevel als bedoeld in het zesde lid gaat in op het ogenblik waarop de verdachte ter tenuitvoerlegging
      van dit bevel wordt aangehouden, dan wel op het tijdstip waarop de tenuitvoerlegging van een ander bevel tot
      vrijheidsbeneming, in dezelfde zaak gegeven, eindigt.

      8 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de procedure van
      terbeschikkingstelling met voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
