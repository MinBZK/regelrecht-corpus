        artikel: '96'
  - number: 120c
    text: |-
      Bij veroordeling wegens een der misdrijven omschreven in de [artikelen 117][ref1], [117a][ref2] en [117b][ref3],
      begaan met een terroristisch oogmerk, alsmede bij veroordeling wegens een der misdrijven omschreven in
      [artikel 120b][ref4], kan ontzetting van het in [artikel 28, eerste lid, onder 3°][ref5], vermelde recht worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel117
