  - number: 139e
    text: |-
      Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft:

      1°. hij die de beschikking heeft over een voorwerp waarop, naar hij weet of redelijkerwijs moet vermoeden, gegevens
      zijn vastgelegd die door wederrechtelijk afluisteren, aftappen of opnemen van een gesprek, telecommunicatie of
      andere gegevensoverdracht of andere gegevensverwerking door een geautomatiseerd werk zijn verkregen;

      2°. hij die gegevens die hij door wederrechtelijk afluisteren, aftappen of opnemen van een gesprek,
      telecommunicatie of andere gegevensoverdracht of andere gegevensverwerking door een geautomatiseerd werk heeft
      verkregen of die, naar hij weet of redelijkerwijs moet vermoeden, ten gevolge van zulk afluisteren, aftappen of
      opnemen te zijner kennis zijn gekomen, opzettelijk aan een ander bekend maakt;

      3°. hij die een voorwerp als omschreven onder 1° opzettelijk ter beschikking stelt van een ander.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel139e
  - number: 139f
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft degene die,
      gebruik makende van een technisch hulpmiddel waarvan de aanwezigheid niet op duidelijke wijze kenbaar is gemaakt,
      opzettelijk en wederrechtelijk van een persoon, aanwezig in een woning of op een andere niet voor het publiek
      toegankelijke plaats, een afbeelding vervaardigt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel139f
  - number: 139g
    text: |-
      1 Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft degene die niet-
      openbare gegevens:

      a. verwerft of voorhanden heeft, terwijl hij ten tijde van de verwerving of het voorhanden krijgen van deze
      gegevens wist of redelijkerwijs had moeten vermoeden dat deze door misdrijf zijn verkregen;

      b. ter beschikking van een ander stelt, aan een ander bekend maakt of uit winstbejag voorhanden heeft of gebruikt,
      terwijl hij weet of redelijkerwijs moet vermoeden dat het door misdrijf verkregen gegevens betreft.

      2 Niet strafbaar is degene die te goeder trouw heeft kunnen aannemen dat het algemeen belang het verwerven,
      voorhanden hebben, ter beschikkingstellen, bekendmaken of gebruik van de gegevens, bedoeld in het eerste lid,
      vereiste.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel139g
  - number: '140'
    text: |-
      1 Deelneming aan een organisatie die tot oogmerk heeft het plegen van misdrijven, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.

      2 De voortzetting van de werkzaamheid van een organisatie die bij onherroepelijke rechterlijke beslissing
      verboden is verklaard of van rechtswege is verboden of ten aanzien waarvan een onherroepelijke verklaring als
      bedoeld in [artikel 122, eerste lid, van Boek 10 Burgerlijk Wetboek][ref1] is afgegeven, wordt gestraft met een
      gevangenisstraf van ten hoogste twee jaar of geldboete van de vierde categorie.

      3 Indien een organisatie tot oogmerk heeft het plegen van misdrijven waarop naar de wettelijke omschrijving
      een gevangenisstraf van twaalf jaar of meer is gesteld, wordt het in het eerste lid bedoelde feit gestraft met
      gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie.

      4 Ten aanzien van de oprichters, leiders of bestuurders kunnen de gevangenisstraffen met een derde worden verhoogd.

      5 Onder deelneming als omschreven in het eerste lid wordt mede begrepen het verlenen van geldelijke of andere
      stoffelijke steun aan alsmede het werven van gelden of personen ten behoeve van de daar omschreven organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0030068#Artikel122
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0030068
        artikel: '122'
  - number: 140a
    text: |-
      1 Deelneming aan een organisatie die tot oogmerk heeft het plegen van terroristische misdrijven, wordt gestraft met
      gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie.

      2 Indien een organisatie tot oogmerk heeft het plegen van terroristische misdrijven waarop naar de wettelijke
      omschrijving een levenslange gevangenisstraf is gesteld, wordt het in het eerste lid bedoelde feit gestraft met
      gevangenisstraf van ten hoogste twintig jaren of geldboete van de vijfde categorie.

      3 Oprichters, leiders of bestuurders worden gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste
      dertig jaren of geldboete van de vijfde categorie.

      4 Het [vijfde lid van artikel 140][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel140
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel140a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '140'
  - number: '141'
    text: |-
      1 Zij die openlijk in vereniging geweld plegen tegen personen of goederen, worden gestraft met gevangenisstraf van
      ten hoogste vier jaren en zes maanden of geldboete van de vierde categorie.

      2 De schuldige wordt gestraft:

      1°. met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie, indien hij opzettelijk
      goederen vernielt of indien het door hem gepleegde geweld enig lichamelijk letsel ten gevolge heeft;

      2°. met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie, indien dat geweld zwaar
      lichamelijk letsel ten gevolge heeft;

      3°. met gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie, indien dat geweld de
      dood ten gevolge heeft.

      3 [Artikel 81][ref1] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel81
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '81'
  - number: 141a
    text: |-
      Hij die opzettelijk gelegenheid, middelen of inlichtingen verschaft tot het plegen van geweld tegen personen of
      goederen wordt gestraft met gevangenisstraf van ten hoogste drie jaren of een geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel141a
  - number: '142'
    text: |-
      1 Hij die opzettelijk door valse alarmkreten of signalen de rust verstoort, wordt gestraft met gevangenisstraf van
      ten hoogste een jaar of geldboete van de vierde categorie.

      2 Hij die opzettelijk, zonder dat daartoe de noodzaak aanwezig is, gebruik maakt van een alarmnummer voor publieke
      diensten wordt gestraft met gevangenisstraf van ten hoogste drie maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel142
  - number: 142a
    text: |-
      1 Hij die een voorwerp verzendt of op een al dan niet voor het publiek toegankelijke plaats achterlaat of plaatst,
      met het oogmerk een ander ten onrechte te doen geloven dat daardoor een ontploffing kan worden teweeggebracht,
      wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.

      2 Met dezelfde straf wordt gestraft hij die gegevens doorgeeft met het oogmerk een ander ten onrechte te doen
      geloven dat op een al dan niet voor het publiek toegankelijke plaats een voorwerp aanwezig is waardoor een
      ontploffing kan worden teweeggebracht.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel142a
  - number: '143'
    text: |-
      Hij die door geweld of bedreiging met geweld een geoorloofde openbare vergadering of betoging verhindert, wordt
      gestraft met gevangenisstraf van ten hoogste negen maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel143
  - number: '144'
    text: |-
      Hij die door het verwekken van wanorde of het maken van gedruis een geoorloofde openbare vergadering opzettelijk
      stoort, of door het verwekken van wanorde een geoorloofde betoging opzettelijk stoort, wordt gestraft met
      gevangenisstraf van ten hoogste twee weken of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel144
  - number: '145'
    text: |-
      Hij die door geweld of bedreiging met geweld hetzij een geoorloofde openbare samenkomst tot het belijden van
      godsdienst of levensovertuiging, hetzij een geoorloofde godsdienstige of levensbeschouwelijke plechtigheid of
      lijkplechtigheid verhindert, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel145
  - number: '146'
    text: |-
      Hij die door het verwekken van wanorde of het maken van gedruis hetzij een geoorloofde openbare samenkomst tot
      het belijden van godsdienst of levensovertuiging, hetzij een geoorloofde godsdienstige of levensbeschouwelijke
      plechtigheid of lijkplechtigheid opzettelijk stoort, wordt gestraft met gevangenisstraf van ten hoogste twee
      maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel146
  - number: '148'
    text: |-
      Hij die opzettelijk de geoorloofde toegang tot een begraafplaats of crematorium of het geoorloofd vervoer van een
      lijk naar een begraafplaats of crematorium verhindert of belemmert, wordt gestraft met gevangenisstraf van ten
      hoogste een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel148
  - number: '149'
    text: |-
      Hij die opzettelijk een graf schendt of enig op een begraafplaats opgericht gedenkteken opzettelijk en
      wederrechtelijk vernielt of beschadigt, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete
      van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel149
  - number: '150'
    text: |-
      Hij die opzettelijk en wederrechtelijk een lijk opgraaft of wegneemt of een opgegraven of weggenomen lijk
      verplaatst of vervoert, wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel150
  - number: '151'
    text: |-
      Hij die een lijk begraaft, verbrandt, vernietigt, verbergt, wegvoert of wegmaakt, met het oogmerk om het feit of de
      oorzaak van het overlijden, dan wel van het dood ter wereld komen te verhelen, wordt gestraft met gevangenisstraf
      van ten hoogste twee jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel151
  - number: 151a
    text: |-
      Hij die uit winstbejag opzettelijk bevordert dat een kind beneden de leeftijd van zes maanden hetwelk niet
      onder voogdij van een rechtspersoon staat, zonder voorafgaande schriftelijke toestemming van de raad voor de
      kinderbescherming, als pleegkind wordt opgenomen, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of
      geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel151a
  - number: 151b
    text: |-
      1 Degene die in de uitoefening van een beroep of bedrijf opzettelijk teweegbrengt of bevordert dat een draagmoeder
      of een vrouw die draagmoeder wenst te worden, rechtstreeks of middellijk met een ander onderhandelt of een afspraak
      maakt ten einde het voornemen, bedoeld in het derde lid, uit te voeren, wordt gestraft met gevangenisstraf van ten
      hoogste een jaar of geldboete van de vierde categorie.

      2 Met dezelfde straf wordt gestraft:

      a. degene die in het openbaar diensten aanbiedt, bestaande uit het teweegbrengen of bevorderen van onderhandelingen
      of een afspraak als bedoeld in het eerste lid;

      b. degene die openbaar maakt dat een vrouw draagmoeder wenst te worden of als zodanig beschikbaar is, dan wel dat
      een vrouw die draagmoeder wenst te worden of als zodanig beschikbaar is, wordt gezocht.

      3 Als draagmoeder wordt aangemerkt de vrouw die zwanger is geworden met het voornemen een kind te baren ten behoeve
      van een ander die het ouderlijk gezag over dat kind wil verwerven, dan wel anderszins duurzaam de verzorging en
      opvoeding van dat kind op zich wil nemen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel151b
  - number: 151c
    text: |-
      1 Degene die in de uitoefening van een beroep of bedrijf opzettelijk teweegbrengt of bevordert dat een vrouw
      rechtstreeks of middellijk met een ander onderhandelt of een afspraak maakt in verband met de wens van die vrouw de
      verzorging en opvoeding van haar kind duurzaam aan een ander over te laten, wordt gestraft met gevangenisstraf van
      ten hoogste zes maanden of geldboete van de derde categorie.

      2 Onverminderd het bepaalde in [artikel 151][ref1], is het eerste lid niet van toepassing

      a. indien het in dat lid bedoelde teweegbrengen of bevorderen geschiedt door de raad voor de kinderbescherming of
      een door de raad daartoe aangewezen rechtspersoon;

      b. indien het in dat lid bedoelde teweegbrengen of bevorderen een verwijzing betreft naar een organisatie als
      bedoeld onder *a*.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel151b
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel151c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 151b
  - number: 151d
    text: |-
      Degene die weet of ernstige reden heeft om te vermoeden dat een visuele weergave als bedoeld in
      [artikel 239, derde lid][ref1], of een voorwerp aanstotelijk voor de eerbaarheid is en die visuele weergave of
      dat voorwerp:

      a. op of aan een plaats, voor het openbaar verkeer bestemd, openlijk tentoonstelt of aanbiedt; of

      b. aan iemand, anders dan op verzoek van diegene, toezendt,

      wordt gestraft met gevangenisstraf van ten hoogste twee maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel239
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel151d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '239'
  - number: 151e
    text: |-
      Degene die een visuele weergave als bedoeld in [artikel 239, derde lid][ref1], of een voorwerp, waarvan de
      vertoning schadelijk is te achten voor personen beneden de leeftijd van zestien jaren, verstrekt, aanbiedt of
      vertoont aan een persoon beneden de leeftijd van zestien jaren wordt gestraft met gevangenisstraf van ten hoogste
      een jaar of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel239
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel151e
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '239'
  - number: 151f
    text: |-
      1 Degene die

      1°. aan iemand die in kennelijke staat van dronkenschap verkeert, bedwelmende drank verkoopt of toedient;

      2°. iemand beneden de leeftijd van achttien jaren dronken maakt;

      3°. iemand door geweld of bedreiging met geweld dwingt tot het gebruik van bedwelmende drank,

      wordt gestraft met gevangenisstraf van ten hoogste negen maanden of geldboete van de derde categorie.

      2 Indien het feit zwaar lichamelijk letsel ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van
      ten hoogste zes jaren of geldboete van de vierde categorie.

      3 Indien het feit de dood ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste negen
      jaren of geldboete van de vijfde categorie.

      4 Indien degene die schuldig is aan het misdrijf dit misdrijf in de uitoefening van een beroep begaat, kan diegene
      van de uitoefening van dat beroep worden ontzet.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel151f
  - number: '152'
    text: |-
      1 Bij veroordeling wegens een der misdrijven omschreven in de [artikelen 138b, vijfde lid][ref1], en [140a][ref2]
      kan ontzetting van het in [artikel 28, eerste lid, onder 3°][ref3], vermelde recht worden uitgesproken.

      2 Bij veroordeling wegens het misdrijf omschreven in [artikel 140][ref4] kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°, 2° en 4°][ref5], vermelde rechten worden uitgesproken en kan de schuldige
      worden ontzet van de uitoefening van het beroep waarin hij het misdrijf heeft gepleegd.


