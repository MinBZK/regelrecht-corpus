        artikel: 24c
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 6:4:2
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 6:4:7
  - number: '36'
    text: |-
      1 In de gevallen waarin de rechter krachtens de wet de openbaarmaking van zijn uitspraak gelast, bepaalt hij tevens
      de wijze waarop aan die last uitvoering wordt gegeven.

      2 De kosten van openbaarmaking worden in de uitspraak op een bepaald bedrag geschat.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel36
  - number: 36b
    text: |-
      1 Onttrekking aan het verkeer van in beslag genomen voorwerpen kan worden opgelegd:

      1°. bij de rechterlijke uitspraak waarbij iemand wegens een strafbaar feit wordt veroordeeld;

      2°. bij de rechterlijke uitspraak waarbij overeenkomstig [artikel 9a][ref1] wordt bepaald dat geen straf zal worden
      opgelegd;

      3°. bij de rechterlijke uitspraak waarbij, niettegenstaande vrijspraak of ontslag van alle rechtsvervolging, wordt
      vastgesteld dat een strafbaar feit is begaan;

      4°. bij een afzonderlijke rechterlijke beschikking op vordering van het openbaar ministerie;

      5°. bij een strafbeschikking.

      2 De [artikelen 33b][ref2] en [33c, tweede en derde lid][ref3], alsmede
      [artikel 446 van het Wetboek van Strafvordering][ref4], zijn van overeenkomstige toepassing.

      3 De maatregel kan te zamen met straffen en met andere maatregelen worden opgelegd.


