  - number: '21'
    text: |-
      De duur van de tijdelijke gevangenisstraf en de hechtenis wordt in de rechterlijke uitspraak aangewezen in dagen,
      weken, maanden en jaren, niet in gedeelten daarvan.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel21
  - number: 22b
    text: |-
      1 Een taakstraf wordt niet opgelegd in geval van veroordeling voor:

      a. een misdrijf waarop naar de wettelijke omschrijving een gevangenisstraf van zes jaren of meer is gesteld en dat
      een ernstige inbreuk op de lichamelijke integriteit van het slachtoffer ten gevolge heeft gehad;

      b. een van de misdrijven omschreven in de [artikelen 181][ref1], [252][ref2] en [253][ref3].

      2 Een taakstraf wordt voorts niet opgelegd in geval van veroordeling voor een misdrijf indien:

      1° aan de veroordeelde in de vijf jaren voorafgaand aan het door hem begane feit wegens een soortgelijk misdrijf
      een taakstraf is opgelegd, en

      2° de veroordeelde deze taakstraf heeft verricht dan wel op grond van
      [artikel 6:3:3 van het Wetboek van Strafvordering][ref4] de tenuitvoerlegging van de vervangende hechtenis is
      bevolen.

      3 Van het eerste en tweede lid kan worden afgeweken indien naast de taakstraf een onvoorwaardelijke vrijheidsstraf
      of vrijheidsbenemende maatregel wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel181
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel252
