  - number: 77b
    text: |-
      1 Ten aanzien van degene die ten tijde van het begaan van een strafbaar feit de leeftijd van zestien jaren doch
      nog niet die van achttien jaren heeft bereikt, kan de rechter de [artikelen 77g tot en met 77gg][ref1] buiten
      toepassing laten en recht doen overeenkomstig de bepalingen in de voorgaande titels vervat, indien hij daartoe
      grond vindt in de ernst van het begane feit, de persoonlijkheid van de dader of de omstandigheden waaronder het
      feit is begaan.

      2 Bij toepassing van het eerste lid kan levenslange gevangenisstraf niet worden opgelegd.


