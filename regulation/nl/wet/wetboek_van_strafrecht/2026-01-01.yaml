  - number: '71'
    text: |-
      De termijn van verjaring vangt aan op de dag na die waarop het feit is gepleegd, behoudens in de volgende gevallen:

      1°. bij de misdrijven omschreven in de [artikelen 173, eerste lid][ref1], en [173b][ref2], vangt de termijn aan
      op de dag na die waarop het misdrijf ter kennis is gekomen van een ambtenaar belast met de opsporing van strafbare
      feiten;

      2°. bij valsheid op de dag na die waarop gebruik is gemaakt van het voorwerp ten opzichte waarvan de valsheid
      gepleegd is;

      3°. bij de misdrijven omschreven in [artikel 251][ref3] en de [artikelen 284][ref4] en [285c][ref5],
      indien gepleegd tegen een persoon die de leeftijd van achttien jaren nog niet heeft bereikt, de artikelen
      [300 tot en met 302][ref6], voor zover het feit oplevert genitale verminking van een persoon van het vrouwelijke
      geslacht die de leeftijd van achttien jaren nog niet heeft bereikt of voor zover het feit oplevert mishandeling
      van een persoon die de leeftijd van achttien jaren nog niet heeft bereikt dan wel het misdrijf, omschreven in
      [artikel 302][ref7], voor zover het feit oplevert gedwongen abortus of gedwongen sterilisatie van een persoon van
      het vrouwelijke geslacht die de leeftijd van achttien jaren nog niet heeft bereikt, op de dag na die waarop die
      persoon achttien jaren is geworden;

      4°. bij de misdrijven omschreven in de [artikelen 279][ref8] en [282, eerste en tweede lid][ref9] op de dag na die
      van de bevrijding of de dood van hem tegen wie onmiddellijk het misdrijf gepleegd is;

      5°. bij de overtredingen omschreven in de [artikelen 465][ref10], [466][ref11] en
      [467][ref12], op de dag na die waarop ingevolge de voorschriften gegeven in of ter
      uitvoering van [artikel 18c van Boek 1 van het Burgerlijk Wetboek][ref13], de aldaar bedoelde
      registers waaruit zodanige overtreding blijkt, naar de centrale bewaarplaats, bedoeld in
      [afdeling 8 van hoofdstuk 1 van het Besluit burgerlijke stand 1994][ref14] zijn overgebracht.


