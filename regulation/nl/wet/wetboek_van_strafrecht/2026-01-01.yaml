        artikel: '28'
  - number: '296'
    text: |-
      1 Hij die een vrouw een behandeling geeft, terwijl hij weet of redelijkerwijs moet vermoeden dat daardoor
      zwangerschap kan worden afgebroken, wordt gestraft met gevangenisstraf van ten hoogste vier jaar en zes maanden of
      geldboete van de vierde categorie.

      2 Indien het feit de dood van de vrouw ten gevolge heeft, wordt gevangenisstraf van ten hoogste zes jaren opgelegd
      of geldboete van de vierde categorie.

      3 Indien het feit is begaan zonder toestemming van de vrouw, wordt gevangenisstraf van ten hoogste twaalf jaren
      opgelegd of geldboete van de vijfde categorie.

      4 Indien het feit is begaan zonder toestemming van de vrouw en tevens haar dood ten gevolge heeft, wordt
      gevangenisstraf van ten hoogste vijftien jaren opgelegd of geldboete van de vijfde categorie.

      5 Het in het eerste lid bedoelde feit is niet strafbaar, indien de behandeling is verricht door:

      a. een arts in een ziekenhuis of kliniek waarin zodanige behandeling volgens de [Wet afbreking zwangerschap][ref1]
      mag worden verricht;

      b. een huisarts die een medicamenteuze afbreking van de zwangerschap verricht volgens de
      [Wet afbreking zwangerschap][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003396
      [ref2]: https://wetten.overheid.nl/BWBR0003396
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel296
    references:
      - id: ref1
        bwb_id: BWBR0003396
      - id: ref2
        bwb_id: BWBR0003396
  - number: '300'
    text: |-
      1 Mishandeling wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie.

      2 Indien het feit zwaar lichamelijk letsel ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van
      ten hoogste vier jaren of geldboete van de vierde categorie.

      3 Indien het feit de dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste zes jaren of
      geldboete van de vierde categorie.

      4 Met mishandeling wordt gelijkgesteld opzettelijke benadeling van de gezondheid.

      5 Poging tot dit misdrijf is niet strafbaar.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel300
  - number: '301'
    text: |-
      1 Mishandeling gepleegd met voorbedachten rade wordt gestraft met gevangenisstraf van ten hoogste vier jaren of
      geldboete van de vierde categorie.

      2 Indien het feit zwaar lichamelijk letsel ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van
      ten hoogste zes jaren of geldboete van de vierde categorie.

      3 Indien het feit de dood ten gevolge heeft, wordt hij gestraft met gevangenisstraf van ten hoogste negen jaren of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel301
  - number: '302'
    text: |-
      1 Hij die aan een ander opzettelijk zwaar lichamelijk letsel toebrengt, wordt, als schuldig aan zware mishandeling,
      gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde categorie.

      2 Indien het feit de dood ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste tien
      jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel302
  - number: '303'
    text: |-
      1 Zware mishandeling gepleegd met voorbedachten rade wordt gestraft met gevangenisstraf van ten hoogste twaalf
      jaren of geldboete van de vijfde categorie.

      2 Indien het feit de dood ten gevolge heeft, wordt de schuldige gestraft met gevangenisstraf van ten hoogste
      vijftien jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel303
  - number: '304'
    text: |-
      1 De in de [artikelen 300-303][ref1] bepaalde gevangenisstraffen kunnen met een derde worden verhoogd:

      1°. ten aanzien van de schuldige die het misdrijf begaat tegen zijn moeder, zijn vader tot wie hij in
      familierechtelijke betrekking staat, zijn echtgenoot, zijn levensgezel, zijn kind, een kind over wie hij het gezag
      uitoefent of een kind dat hij verzorgt of opvoedt als behorend tot zijn gezin of een aan zijn zorg, opleiding of
      waakzaamheid toevertrouwde minderjarige;

      2°. ten aanzien van de schuldige die het misdrijf stelselmatig begaat tegen een minderjarige;

      3°. indien het misdrijf wordt gepleegd tegen een ambtenaar gedurende of ter zake van de rechtmatige uitoefening van
      zijn bediening;

      4°. indien het misdrijf wordt gepleegd door toediening van voor het leven of de gezondheid schadelijke stoffen.

      2 Met een ambtenaar wordt gelijkgesteld een persoon in de openbare dienst van een vreemde staat die in Nederland op
      door het volkenrecht toegelaten wijze zijn bediening uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel300
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel304
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '300'
  - number: 304a
    text: |-
      Indien een misdrijf, strafbaar gesteld in [artikel 302][ref1] of [303][ref2], is begaan met een terroristisch
      oogmerk, wordt de in dat artikel bepaalde tijdelijke gevangenisstraf met de helft verhoogd en wordt, indien op het
      misdrijf een tijdelijke gevangenisstraf van ten hoogste vijftien jaren is gesteld, levenslange gevangenisstraf of
      tijdelijke van ten hoogste dertig jaren opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel302
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel303
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel304a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '302'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '303'
  - number: 304b
    text: |-
      1 De samenspanning tot het in [artikel 303][ref1] omschreven misdrijf, te begaan met een terroristisch oogmerk,
      wordt gestraft met gevangenisstraf van ten hoogste tien jaren of geldboete van de vijfde categorie.

      2 [Artikel 96, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel303
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel96
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel304b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '303'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '96'
  - number: 304c
    text: |-
      Bij veroordeling wegens een der misdrijven omschreven in de [artikelen 302][ref1] en [303][ref2], begaan met
      een terroristisch oogmerk, alsmede bij veroordeling wegens het misdrijf omschreven in [artikel 304b][ref3], kan
      ontzetting van het in [artikel 28, eerste lid, onder 3°][ref4], vermelde recht worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel302
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel303
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel304b
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel304c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '302'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '303'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 304b
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '305'
    text: |-
      1 Bij veroordeling wegens een der in de [artikelen 301][ref1] en [303][ref2] omschreven misdrijven kan ontzetting
      van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref3], vermelde rechten worden uitgesproken.

      2 Bij veroordeling wegens een der in de [artikelen 301–303][ref4] omschreven misdrijven kan de schuldige, indien
      hij het misdrijf in zijn beroep heeft begaan, worden ontzet van de uitoefening van dat beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel301
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel303
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel301
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel305
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '301'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '303'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '28'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '301'
  - number: '306'
    text: |-
      Zij die opzettelijk deelnemen aan een aanval of vechterij waarin onderscheiden personen zijn gewikkeld, worden,
      behoudens ieders verantwoordelijkheid voor de bijzondere door hem bedreven feiten, gestraft:

      1°. met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie, indien de aanval of
      vechterij alleen zwaar lichamelijk letsel ten gevolge heeft;

      2°. met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, indien de aanval of
      vechterij iemands dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel306
  - number: 306a
    text: |-
      Hij die een dier op een mens of op een ander dier aanhitst, wordt gestraft met gevangenisstraf van ten hoogste een
      jaar of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel306a
  - number: '307'
    text: |-
      1 Hij aan wiens schuld de dood van een ander te wijten is, wordt gestraft met gevangenisstraf van ten hoogste twee
      jaren of geldboete van de vierde categorie.

      2 Indien de schuld bestaat in roekeloosheid, wordt hij gestraft met gevangenisstraf van ten hoogste vier jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel307
  - number: '308'
    text: |-
      1 Hij aan wiens schuld te wijten is dat een ander zwaar lichamelijk letsel bekomt of zodanig lichamelijk letsel dat
      daaruit tijdelijke ziekte of verhindering in de uitoefening van zijn ambts- of beroepsbezigheden ontstaat, wordt
      gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie.

      2 Indien de schuld bestaat in roekeloosheid, wordt hij gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel308
  - number: '309'
    text: |-
      Indien de in deze titel omschreven misdrijven worden gepleegd in de uitoefening van enig ambt of beroep, kan de
      gevangenisstraf met een derde worden verhoogd, kan ontzetting worden uitgesproken van de uitoefening van het beroep
      waarin het misdrijf is gepleegd, en kan de rechter de openbaarmaking van zijn uitspraak gelasten.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel309
  - number: '310'
    text: |-
      Hij die enig goed dat geheel of ten dele aan een ander toebehoort wegneemt, met het oogmerk om het zich
      wederrechtelijk toe te eigenen, wordt, als schuldig aan diefstal, gestraft met gevangenisstraf van ten hoogste vier
      jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel310
  - number: '311'
    text: |-
      1 Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie wordt gestraft:

      1°. diefstal van vee uit de weide;

      2°. diefstal bij gelegenheid van brand, ontploffing, watersnood, schipbreuk, stranding, spoorwegongeval, oproer,
      muiterij of oorlogsnood;

      3°. diefstal in een woning of op een besloten erf waarop een woning staat, door iemand die zich aldaar buiten weten
      of tegen de wil van de rechthebbende bevindt;

      4°. diefstal door twee of meer verenigde personen;

      5°. diefstal waarbij de schuldige zich de toegang tot de plaats van het misdrijf heeft verschaft of het weg te
      nemen goed onder zijn bereik heeft gebracht door middel van braak, verbreking of inklimming, van valse sleutels,
      van een valse order of het aannemen van een valse naam of van een valse hoedanigheid, of door listige kunstgrepen,
      of door een samenweefsel van verdichtsels;

      6°. diefstal met het oogmerk om een terroristisch misdrijf voor te bereiden of gemakkelijk te maken.

      2 Indien de onder 3° omschreven diefstal vergezeld gaat van een der in onder 4° en 5° vermelde omstandigheden,
      wordt gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie opgelegd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel311
  - number: '312'
    text: |-
      1 Met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie wordt gestraft diefstal,
      voorafgegaan, vergezeld of gevolgd van geweld of bedreiging met geweld tegen personen, gepleegd met het oogmerk om
      die diefstal voor te bereiden of gemakkelijk te maken, of om, bij betrapping op heter daad, aan zichzelf of andere
      deelnemers aan het misdrijf hetzij de vlucht mogelijk te maken, hetzij het bezit van het gestolene te verzekeren.

      2 Gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie wordt opgelegd:

      1°. indien het feit wordt gepleegd hetzij gedurende de voor de nachtrust bestemde tijd in een woning of op een
      besloten erf waarop een woning staat; hetzij op de openbare weg; hetzij in een spoortrein die in beweging is;

      2°. indien het feit wordt gepleegd door twee of meer verenigde personen;

      3°. indien de schuldige zich de toegang tot de plaats van het misdrijf heeft verschaft door middel van braak of
      inklimming, van valse sleutels, van een valse order of een vals kostuum;

      4°. indien het feit zwaar lichamelijk letsel ten gevolge heeft;

      5°. indien het feit wordt gepleegd met het oogmerk om een terroristisch misdrijf voor te bereiden of gemakkelijk
      te maken.

      3 Gevangenisstraf van ten hoogste vijftien jaren of geldboete van de vijfde categorie wordt opgelegd, indien het
      feit de dood ten gevolge heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel312
  - number: '313'
    text: |-
      Bij veroordeling wegens diefstal kan ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1],
      vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel313
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '314'
    text: |-
      1 Hij die, zonder geweld of bedreiging met geweld tegen personen, geheel of ten dele aan een ander toebehorende
      klei, bagger, ongesneden veen, zand, aarde, grind, puin, mestspeciën, zoden, plaggen, heide, helm, wier, riet,
      biezen, mos, onbewerkt en niet vervoerd hak- of sprokkelhout, ongeplukte of afgevallen boomvruchten of bladeren,
      te veld staand gras of te veld staande of na de oogst achtergebleven veldvruchten wegneemt, met het oogmerk om zich
      die voorwerpen wederrechtelijk toe te eigenen, wordt, als schuldig aan stroperij, gestraft met gevangenisstraf van
      ten hoogste een maand of geldboete van de tweede categorie.

      2 Indien tijdens het plegen van het misdrijf nog geen twee jaren zijn verlopen sedert een vroegere veroordeling
      van de schuldige wegens gelijk misdrijf onherroepelijk is geworden, wordt hij gestraft met gevangenisstraf van ten
      hoogste twee maanden of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel314
  - number: '315'
    text: |-
      1 Met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie wordt gestraft:

      1°. stroperij gepleegd met behulp van vaartuigen, wagens, trek- of lastdieren;

      2°. stroperij gepleegd onder een of meer der in [artikel 311, eerste lid, onder 2°-5°][ref1], vermelde
      omstandigheden.

      2 Ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref2], vermelde rechten kan worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel311
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel315
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '311'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '316'
    text: |-
      1 Indien de dader van of medeplichtige aan een der in deze titel omschreven misdrijven de niet van tafel en bed of
      van goederen gescheiden echtgenoot is van hem tegen wie het misdrijf is gepleegd, is de strafvervolging tegen die
      dader of die medeplichtige uitgesloten.

      2 Indien hij zijn van tafel en bed of van goederen gescheiden echtgenoot is of zijn bloed- of aanverwant, hetzij
      in de rechte linie, hetzij in de tweede graad van de zijlinie, heeft de vervolging, voor zover hem betreft, alleen
      plaats op een tegen hem gerichte klacht van degene tegen wie het misdrijf is gepleegd.

      3 Indien het vorige lid van toepassing is, neemt de termijn bedoeld in [artikel 66][ref1] een aanvang op de dag
      nadat de identiteit van de verdachte aan de tot de klacht gerechtigde bekend werd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel66
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel316
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '66'
  - number: '317'
    text: |-
      1 Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen, door geweld of bedreiging
      met geweld iemand dwingt hetzij tot de afgifte van enig goed dat geheel of ten dele aan deze of aan een derde
      toebehoort, hetzij tot het aangaan van een schuld of het teniet doen van een inschuld, hetzij tot het ter
      beschikking stellen van gegevens, wordt, als schuldig aan afpersing, gestraft met gevangenisstraf van ten hoogste
      negen jaren of geldboete van de vijfde categorie.

      2 Met dezelfde straf wordt gestraft hij die de dwang, bedoeld in het eerste lid, uitoefent door de bedreiging dat
      gegevens die door middel van een geautomatiseerd werk zijn opgeslagen, onbruikbaar of ontoegankelijk zullen worden
      gemaakt of zullen worden gewist.

      3 De bepalingen van het [tweede en derde lid van artikel 312][ref1] zijn op dit misdrijf van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel312
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel317
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '312'
  - number: '318'
    text: |-
      1 Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen, door bedreiging met smaad,
      smaadschrift of openbaring van een geheim iemand dwingt hetzij tot de afgifte van enig goed dat geheel of ten
      dele aan deze of aan een derde toebehoort, hetzij tot het aangaan van een schuld of het teniet doen van een
      inschuld, hetzij tot het ter beschikking stellen van gegevens, wordt als schuldig aan afdreiging, gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.

      2 Indien het feit wordt gepleegd met het oogmerk om een terroristisch misdrijf voor te bereiden of gemakkelijk te
      maken, wordt de op het feit gestelde gevangenisstraf met een derde verhoogd.

      3 Dit misdrijf wordt niet vervolgd dan op klacht van hem tegen wie het gepleegd is.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel318
  - number: '319'
    text: |-
      De bepaling van [artikel 316][ref1] is op de in deze titel omschreven misdrijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel316
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel319
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '316'
  - number: '320'
    text: |-
      Bij veroordeling wegens een der in deze titel omschreven misdrijven, kan ontzetting van de in
      [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1], vermelde rechten worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel320
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '321'
    text: |-
      Hij die opzettelijk enig goed dat geheel of ten dele aan een ander toebehoort en dat hij anders dan door
      misdrijf onder zich heeft, wederrechtelijk zich toeëigent, wordt, als schuldig aan verduistering, gestraft met
      gevangenisstraf van ten hoogste drie jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel321
  - number: '322'
    text: |-
      Verduistering gepleegd door hem die het goed uit hoofde van zijn persoonlijke dienstbetrekking of van zijn beroep,
      of tegen geldelijke vergoeding onder zich heeft, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel322
  - number: 322a
    text: |-
      Indien een der in de [artikelen 321][ref1] en [322][ref2] omschreven feiten wordt gepleegd met het oogmerk om een
      terroristisch misdrijf voor te bereiden of gemakkelijk te maken, wordt de op het feit gestelde gevangenisstraf met
      een derde verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel321
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel322
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel322a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '321'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '322'
  - number: '323'
    text: |-
      Verduistering gepleegd door hem wie het goed uit noodzaak in bewaring is gegeven, of door voogden, curators,
      bewindvoerders, executeurs van een nalatenschap, door de rechter benoemde vereffenaars van een nalatenschap of
      gemeenschap of beheerders van instellingen van weldadigheid of van stichtingen, ten opzichte van enig goed dat zij
      als zodanig onder zich hebben, wordt gestraft met gevangenisstraf van ten hoogste vijf jaren of geldboete van de
      vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel323
  - number: 323a
    text: |-
      Hij die opzettelijk en wederrechtelijk middelen die met een bepaald doel door of vanwege de overheid dan wel door
      of vanwege een volkenrechtelijke organisatie zijn verstrekt, aanwendt voor andere doeleinden dan waarvoor zij zijn
      verstrekt, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel323a
  - number: '324'
    text: |-
      De bepaling van [artikel 316][ref1] is op de in deze titel omschreven misdrijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel316
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel324
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '316'
  - number: '325'
    text: |-
      1 Bij veroordeling wegens een der in deze titel omschreven misdrijven, kan de rechter de openbaarmaking van zijn
      uitspraak gelasten en ontzetting uitspreken van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref1],
      vermelde rechten.

      2 Indien de schuldige het misdrijf in zijn beroep begaat, kan hij van de uitoefening van dat beroep worden ontzet.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel325
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '326'
    text: |-
      1 Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen, hetzij door het aannemen van
      een valse naam of van een valse hoedanigheid, hetzij door listige kunstgrepen, hetzij door een samenweefsel van
      verdichtsels, iemand beweegt tot de afgifte van enig goed, tot het verlenen van een dienst, tot het ter beschikking
      stellen van gegevens, tot het aangaan van een schuld of tot het teniet doen van een inschuld, wordt, als schuldig
      aan oplichting, gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.

      2 Indien het feit wordt gepleegd met het oogmerk om een terroristisch misdrijf voor te bereiden of gemakkelijk te
      maken, wordt de op het feit gestelde gevangenisstraf met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel326
  - number: 326a
    text: |-
      Hij die een beroep of een gewoonte maakt van het kopen van goederen met het oogmerk om zonder volledige betaling
      zich of een ander de beschikking over die goederen te verzekeren, wordt gestraft met gevangenisstraf van ten
      hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel326a
  - number: 326b
    text: |-
      Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vijfde categorie wordt gestraft:

      1°. hij die op of in een werk van letterkunde, wetenschap, kunst of nijverheid valselijk enige naam of enig teken
      plaatst, of de echte naam of het echte teken vervalst, met het oogmerk om daardoor aannemelijk te maken, dat dat
      werk zou zijn van de hand van degene wiens naam of teken hij daarop of daarin aanbracht;

      2°. hij die opzettelijk een werk van letterkunde, wetenschap, kunst of nijverheid, waarop of waarin valselijk
      enige naam of enig teken is geplaatst, of de echte naam of het echte teken is vervalst, verkoopt, te koop aanbiedt,
      aflevert, ten verkoop in voorraad heeft of binnen het Rijk in Europa invoert, als ware dat werk van de hand van
      degene wiens naam of teken daarop of daarin valselijk is aangebracht.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel326b
  - number: 326c
    text: |-
      1 Hij die, met het oogmerk daarvoor niet volledig te betalen, door een technische ingreep of met behulp van valse
      signalen, gebruik maakt van een dienst die via telecommunicatie aan het publiek wordt aangeboden, wordt gestraft
      met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.

      2 Met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie wordt gestraft hij die
      opzettelijk een voorwerp dat kennelijk is bestemd, of gegevens die kennelijk zijn bestemd, tot het plegen van het
      misdrijf, bedoeld in het eerste lid,

      a. openlijk ter verspreiding aanbiedt;

      b. ter verspreiding of met het oog op de invoer in Nederland voorhanden heeft of

      c. uit winstbejag vervaardigt of bewaart.

      3 Hij die van het plegen van misdrijven als bedoeld in het tweede lid, zijn beroep maakt of het plegen van deze
      misdrijven als bedrijf uitoefent wordt gestraft hetzij met gevangenisstraf van ten hoogste vier jaren en geldboete
      van de vijfde categorie, hetzij met één van deze straffen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel326c
  - number: 326d
    text: |-
      Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen, enige bedrieglijke handeling pleegt
      tot misleiding teneinde een ander die handelt in de uitoefening van een beroep, bedrijf of organisatie te bewegen
      tot het doen van een betaling, wordt gestraft met een gevangenisstraf van ten hoogste twee jaren of geldboete van
      de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel326d
  - number: 326e
    text: |-
      Hij die een beroep of een gewoonte maakt van het door middel van een geautomatiseerd werk verkopen van goederen of
      verlenen van diensten tegen betaling met het oogmerk om zonder volledige levering zich of een ander van de betaling
      van die goederen of diensten te verzekeren, wordt gestraft met gevangenisstraf van ten hoogste vier jaren of
      geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel326e
  - number: '327'
    text: |-
      Hij die door listige kunstgrepen de verzekeraar in dwaling brengt ten opzichte van omstandigheden tot de
      verzekering betrekking hebbende, zodat deze een overeenkomst sluit die hij niet of niet onder dezelfde voorwaarden
      zou hebben gesloten indien hij de ware staat van zaken gekend had, wordt gestraft met gevangenisstraf van ten
      hoogste een jaar of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel327
  - number: '328'
    text: |-
      Hij die, met het oogmerk om zich of een ander, ten nadele van de verzekeraar, wederrechtelijk te bevoordelen, brand
      sticht of een ontploffing teweegbrengt in enig tegen brandgevaar verzekerd goed, of een vaartuig of luchtvaartuig
      dat verzekerd is of waarvan de zich aan boord bevindende zaken of de te verdienen vracht zijn verzekerd, doet
      zinken, stranden of verongelukken, vernielt, onbruikbaar maakt of beschadigt, wordt gestraft met gevangenisstraf
      van ten hoogste vier jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel328
  - number: 328bis
    text: |-
      Hij die, om het handels- of bedrijfsdebiet van zichzelf of van een ander te vestigen, te behouden of uit te
      breiden, enige bedrieglijke handeling pleegt tot misleiding van het publiek of van een bepaald persoon, wordt,
      indien daaruit enig nadeel voor concurrenten van hem of van die ander kan ontstaan, als schuldig aan oneerlijke
      mededinging, gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel328bis
  - number: 328ter
    text: |-
      1 Hij die, anders dan als ambtenaar, werkzaam zijnde in dienstbetrekking of optredend als lasthebber, naar
      aanleiding van hetgeen hij in strijd met zijn plicht in zijn betrekking of bij de uitvoering van zijn last heeft
      gedaan of nagelaten dan wel zal doen of nalaten, een gift, belofte of dienst aanneemt dan wel vraagt, wordt
      gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.

      2 Met gelijke straf wordt gestraft hij die aan iemand die, anders dan als ambtenaar, werkzaam is in
      dienstbetrekking of optreedt als lasthebber, naar aanleiding van hetgeen deze in zijn betrekking of bij de
      uitvoering van zijn last heeft gedaan of nagelaten dan wel zal doen of nalaten, een gift of belofte doet dan wel
      een dienst verleent of aanbiedt van die aard of onder zodanige omstandigheden, dat hij redelijkerwijs moet aannemen
      dat deze handelt in strijd met zijn plicht.

      3 Onder handelen in strijd met zijn plicht als bedoeld in de voorgaande leden wordt in elk geval begrepen het in
      strijd met de goede trouw tegenover de werkgever of lastgever verzwijgen van het aannemen dan wel vragen van een
      gift, belofte of dienst.

      4 Met gelijke straf wordt gestraft hij die in het vooruitzicht van zijn dienstbetrekking of optreden als
      lasthebber, indien de dienstbetrekking of het optreden als lasthebber is gevolgd, een feit begaat als in het eerste
      lid omschreven alsmede hij die dit feit begaat na zijn dienstbetrekking of optreden als lasthebber.

      5 Met gelijke straf wordt gestraft hij die een feit als in het tweede lid omschreven begaat jegens een persoon
      in het vooruitzicht van een dienstbetrekking of het optreden als lasthebber, indien deze dienstbetrekking of dit
      optreden als lasthebber is gevolgd alsmede hij die dit feit begaat jegens een persoon na diens dienstbetrekking of
      optreden als lasthebber.

      6 Indien het feit is gepleegd ten behoeve van een buitenlandse mogendheid wordt de op het feit gestelde
      gevangenisstraf met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel328ter
  - number: 328quater
    text: |-
      1 Met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie wordt gestraft hij die een
      gift of een belofte aanneemt naar aanleiding van hetgeen hij heeft gedaan of nagelaten dan wel zal doen of nalaten
      in verband met een op hem of op de persoon bij wie hij in dienst is, rustende wettelijke plicht tot

      a. het verstrekken van inlichtingen betreffende telecommunicatie aan de ambtenaren van de justitie of politie,
      dan wel

      b. het verlenen van medewerking aan het aftappen of opnemen van telecommunicatie.

      2 Met gelijke straf wordt gestraft hij die een ander een gift of een belofte doet naar aanleiding van hetgeen deze
      heeft gedaan of nagelaten dan wel zal doen of nalaten in verband met een op hem of op de persoon bij wie hij in
      dienst is, rustende wettelijke plicht als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel328quater
  - number: '329'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie wordt gestraft de verkoper die de
      koper bedriegt:

      1°. door hem die een bepaald aangewezen voorwerp kocht, opzettelijk iets anders daarvoor in de plaats te leveren;

      2°. ten opzichte van de aard, de hoedanigheid of de hoeveelheid van het geleverde, door het aanwenden van listige
      kunstgrepen.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel329
  - number: 329bis
    text: |-
      De houder van een cognossement die opzettelijk over verschillende exemplaren daarvan onder bezwarende titel
      beschikt ten behoeve van verschillende verkrijgers, wordt gestraft met gevangenisstraf van ten hoogste twee jaren
      of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel329bis
  - number: '330'
    text: |-
      1 Hij die eet- of drinkwaren of geneesmiddelen verkoopt, te koop aanbiedt of aflevert, wetende dat zij vervalst
      zijn en die vervalsing verzwijgende, wordt gestraft met gevangenisstraf van ten hoogste drie jaren of geldboete van
      de vijfde categorie.

      2 Eet- of drinkwaren of geneesmiddelen zijn vervalst wanneer door bijmenging van vreemde bestanddelen hun waarde of
      hun bruikbaarheid verminderd is.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel330
  - number: '331'
    text: |-
      1 Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie wordt gestraft de aannemer of
      de bouwmeester van enig werk of de verkoper van bouwmaterialen die bij de uitvoering van het werk of de levering
      van de materialen enige bedrieglijke handeling pleegt, ten gevolge waarvan de veiligheid van personen of goederen
      of de veiligheid van de staat in tijd van oorlog kan worden in gevaar gebracht.

      2 Met dezelfde straf wordt gestraft hij die, met het opzicht over het werk of over de levering van de materialen
      belast, de bedrieglijke handeling opzettelijk toelaat.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel331
  - number: '332'
    text: |-
      1 Hij die, bij levering van benodigdheden ten dienste van de vloot of het leger, enige bedrieglijke handeling
      pleegt, ten gevolge waarvan de veiligheid van de staat in tijd van oorlog kan worden in gevaar gebracht, wordt
      gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.

      2 Met dezelfde straf wordt gestraft hij die, met het opzicht over de levering van de goederen belast, de
      bedrieglijke handeling opzettelijk toelaat.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel332
  - number: '333'
    text: |-
      Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen, hetgeen tot afbakening van de grenzen
      van erven dient vernielt, verplaatst, verwijdert of onbruikbaar maakt, wordt gestraft met gevangenisstraf van ten
      hoogste twee jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel333
  - number: '334'
    text: |-
      Hij die, met het oogmerk om zich of een ander wederrechtelijk te bevoordelen, door het verspreiden van een
      leugenachtig bericht de prijs van koopwaren, fondsen of geldswaardig papier doet stijgen of dalen, wordt gestraft
      met gevangenisstraf van ten hoogste twee jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel334
  - number: '336'
    text: |-
      De koopman, de bestuurder, beherende vennoot of commissaris van een rechtspersoon of vennootschap, die opzettelijk
      een onware staat of een onware balans, winst- en verliesrekening, staat van baten en lasten of toelichting op een
      van die stukken openbaar maakt of zodanige openbaarmaking opzettelijk toelaat, wordt gestraft met gevangenisstraf
      van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel336
  - number: '337'
    text: |-
      1 Hij die opzettelijk:

      a. valse, vervalste of wederrechtelijk vervaardigde merken,

      b. waren, die zelf of op hun verpakking valselijk zijn voorzien van de handelsnaam van een ander of van het merk
      waarop een ander recht heeft,

      c. waren, die ter aanduiding van herkomst, valselijk van de naam van een bepaalde plaats, met bijvoeging van een
      verdichte handelsnaam, zijn voorzien,

      d. waren, waarop of op de verpakking waarvan een handelsnaam van een ander of een merk waarop een ander recht
      heeft, zij het dan ook met een geringe afwijking, is nagebootst of

      e. waren of onderdelen daarvan die valselijk hetzelfde uiterlijk vertonen als een tekening of model waarop een
      ander recht heeft, dan wel daarmede slechts ondergeschikte verschillen vertonen,

      invoert, doorvoert of uitvoert, verkoopt, te koop aanbiedt, aflevert, uitdeelt of in voorraad heeft, wordt gestraft
      met gevangenisstraf van ten hoogste één jaar of geldboete van de vijfde categorie.

      2 Niet strafbaar is hij die enkele waren, onderdelen daarvan of merken als omschreven in het eerste lid in voorraad
      heeft uitsluitend voor eigen gebruik.

      3 Indien de schuldige van het plegen van het misdrijf, genoemd in het eerste lid, zijn beroep maakt of het plegen
      van dit misdrijf als bedrijf uitoefent, wordt hij gestraft met gevangenisstraf van ten hoogste vier jaren of
      geldboete van de vijfde categorie.

      4 Indien door het plegen van het misdrijf, genoemd in het eerste lid, gemeen gevaar voor personen of goederen te
      duchten is, wordt de schuldige gestraft met gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel337
  - number: '338'
    text: |-
      De bepaling van [artikel 316][ref1] is op de in deze titel omschreven misdrijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel316
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel338
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '316'
  - number: '339'
    text: |-
      1 Bij veroordeling wegens een der in deze titel omschreven misdrijven, kan de rechter de openbaarmaking van zijn
      uitspraak gelasten en de schuldige worden ontzet van de uitoefening van het beroep waarin hij het misdrijf begaan
      heeft.

      2 Bij veroordeling wegens een der in de [artikelen 326][ref1], [328][ref2], [331][ref3] en [332][ref4] omschreven
      misdrijven kan ontzetting van de in [artikel 28, eerste lid, onder 1°, 2° en 4°][ref5], vermelde rechten worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel326
