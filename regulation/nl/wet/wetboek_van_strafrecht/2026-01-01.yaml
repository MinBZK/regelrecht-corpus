  - number: 36c
    text: |-
      Vatbaar voor onttrekking aan het verkeer zijn alle voorwerpen:

      1°. die geheel of grotendeels door middel van of uit de baten van het feit zijn verkregen;

      2°. met betrekking tot welke het feit is begaan;

      3°. met behulp van welke het feit is begaan of voorbereid;

      4°. met behulp van welke de opsporing van het feit is belemmerd;

      5°. die tot het begaan van het feit zijn vervaardigd of bestemd;

      een en ander voor zover zij van zodanige aard zijn, dat het ongecontroleerde bezit daarvan in strijd is met de wet
      of met het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel36c
  - number: 36d
    text: |-
      Vatbaar voor onttrekking aan het verkeer zijn bovendien de aan de dader of verdachte toebehorende voorwerpen van
      zodanige aard dat het ongecontroleerde bezit daarvan in strijd is met de wet of met het algemeen belang, welke
      bij gelegenheid van het onderzoek naar het door hem begane feit, dan wel het feit waarvan hij wordt verdacht, zijn
      aangetroffen, doch alleen indien de voorwerpen kunnen dienen tot het begaan of de voorbereiding van soortgelijke
      feiten, dan wel tot de belemmering van de opsporing daarvan.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel36d
  - number: 36e
    text: |-
      1 Op vordering van het openbaar ministerie kan bij een afzonderlijke rechterlijke beslissing aan degene die is
      veroordeeld wegens een strafbaar feit de verplichting worden opgelegd tot betaling van een geldbedrag aan de staat
      ter ontneming van wederrechtelijk verkregen voordeel.

      2 De verplichting kan worden opgelegd aan de in het eerste lid bedoelde persoon die voordeel heeft verkregen
      door middel van of uit de baten van het daar bedoelde feit of andere strafbare feiten, waaromtrent voldoende
      aanwijzingen bestaan dat zij door de veroordeelde zijn begaan.

      3 Op vordering van het openbaar ministerie kan bij een afzonderlijke rechterlijke beslissing aan degene die
      is veroordeeld wegens een misdrijf dat naar de wettelijke omschrijving wordt bedreigd met een geldboete van de
      vijfde categorie, de verplichting worden opgelegd tot betaling van een geldbedrag aan de staat ter ontneming
      van wederrechtelijk verkregen voordeel, indien aannemelijk is dat of dat misdrijf of andere strafbare feiten op
      enigerlei wijze ertoe hebben geleid dat de veroordeelde wederrechtelijk voordeel heeft verkregen. In dat geval kan
      ook worden vermoed dat:

      a. uitgaven die de veroordeelde heeft gedaan in een periode van zes jaren voorafgaand aan het plegen van dat
      misdrijf, wederrechtelijk verkregen voordeel belichamen, tenzij aannemelijk is dat deze uitgaven zijn gedaan uit
      een legale bron van inkomsten, of;

      b. voorwerpen die in een periode van zes jaren voorafgaand aan het plegen van dat misdrijf aan de veroordeelde zijn
      gaan toebehoren voordeel belichamen als bedoeld in het eerste lid, tenzij aannemelijk is dat aan de verkrijging van
      die voorwerpen een legale bron van herkomst ten grondslag ligt.

      4 De rechter kan ambtshalve, op vordering van het openbaar ministerie of op het verzoek van de veroordeelde
      afwijken van de in het derde lid genoemde periode van zes jaren en een kortere periode in aanmerking nemen.

      5 De rechter stelt het bedrag vast waarop het wederrechtelijk verkregen voordeel wordt geschat. Onder voordeel is
      de besparing van kosten begrepen. De waarde van voorwerpen die door de rechter tot het wederrechtelijk verkregen
      voordeel worden gerekend, kan worden geschat op de marktwaarde op het tijdstip van de beslissing of door verwijzing
      naar de bij openbare verkoop te behalen opbrengst, indien verhaal moet worden genomen. De rechter kan het te
      betalen bedrag lager vaststellen dan het geschatte voordeel. Op het gemotiveerde verzoek van de verdachte of
      veroordeelde kan de rechter, indien de huidige en de redelijkerwijs te verwachten toekomstige draagkracht van de
      verdachte of veroordeelde niet toereikend zullen zijn om het te betalen bedrag te voldoen, bij de vaststelling van
      het te betalen bedrag daarmee rekening houden. Bij het ontbreken van zodanig verzoek kan de rechter ambtshalve of
      op vordering van de officier van justitie deze bevoegdheid toepassen.

      6 Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.

      7 Bij het vaststellen van het bedrag van het wederrechtelijk verkregen voordeel op grond van het eerste,
      tweede en derde lid ter zake van strafbare feiten die door twee of meer personen zijn gepleegd, kan de rechter
      bepalen dat deze hoofdelijk dan wel voor een door hem te bepalen deel aansprakelijk zijn voor de gezamenlijke
      betalingsverplichting. Bij het vaststellen van het bedrag van het wederrechtelijk verkregen voordeel op grond
      van het derde lid moet voor de toepassing van de vorige zin tevens aannemelijk zijn dat de veroordeelden een
      economische eenheid vormden die het wederrechtelijk verkregen voordeel heeft genoten.

      8 De rechter kan bij de bepaling van de hoogte van het voordeel kosten in mindering brengen die rechtstreeks
      in verband staan met het begaan van strafbare feiten, bedoeld in het eerste tot en met derde lid, en die
      redelijkerwijs voor aftrek in aanmerking komen.

      9 Bij de bepaling van de omvang van het bedrag waarop het wederrechtelijk verkregen voordeel wordt geschat, worden
      aan benadeelde derden in rechte toegekende vorderingen alsmede de verplichting tot betaling aan de staat van
      een som gelds ten behoeve van het slachtoffer als bedoeld in [artikel 36f][ref1] voor zover die zijn voldaan, in
      mindering gebracht.

      10 Bij de oplegging van de maatregel wordt rekening gehouden met uit hoofde van eerdere beslissingen opgelegde
      verplichtingen tot betaling van een geldbedrag ter ontneming van wederrechtelijk verkregen voordeel.

      11 De rechter bepaalt bij de oplegging van de maatregel de duur van de gijzeling die met toepassing van
      [artikel 6:6:25 van het Wetboek van Strafvordering][ref2] ten hoogste kan worden gevorderd. Bij het bepalen van
      de duur wordt voor elke volle € 25 van het opgelegde bedrag niet meer dan één dag gerekend. De duur beloopt ten
      hoogste drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36f
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6625
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel36e
