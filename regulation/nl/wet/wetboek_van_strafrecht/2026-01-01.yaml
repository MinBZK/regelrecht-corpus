  - number: '355'
    text: |-
      Met gevangenisstraf van ten hoogste drie jaren of geldboete van de vierde categorie, worden gestraft de ministers
      of staatssecretarissen:

      1°. die hun medeondertekening verlenen aan koninklijke besluiten, wetende dat daardoor de [Grondwet][ref1] of
      andere wetten of algemene maatregelen van bestuur worden geschonden;

      2°. die uitvoering geven aan koninklijke besluiten, wetende dat deze niet van de vereiste medeondertekening van een
      minister of staatssecretaris zijn voorzien;

      3°. die beschikkingen nemen of bevelen geven of bestaande beschikkingen of bevelen handhaven, wetende dat daardoor
      de [Grondwet][ref2] of andere wetten of algemene maatregelen van bestuur worden geschonden;

      4°. die opzettelijk nalaten uitvoering te geven aan de bepalingen van de [Grondwet][ref3] of andere wetten of
      algemene maatregelen van bestuur, voor zover die uitvoering wegens de aard van het onderwerp tot hun taak behoort
      of uitdrukkelijk hun is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0001840
      [ref3]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel355
    references:
      - id: ref1
        bwb_id: BWBR0001840
      - id: ref2
        bwb_id: BWBR0001840
      - id: ref3
        bwb_id: BWBR0001840
  - number: '356'
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie worden gestraft de ministers en
      staatssecretarissen aan wier grove schuld te wijten is dat de in [artikel 355, onder 4°][ref1], omschreven
      uitvoering wordt nagelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel355
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel356
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '355'
  - number: '357'
    text: |-
      De bevelhebber van de gewapende macht die weigert of opzettelijk nalaat op de wettige vordering van het bevoegde
      burgerlijk gezag de onder zijn bevel staande macht aan te wenden, wordt gestraft met gevangenisstraf van ten
      hoogste drie jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel357
  - number: '358'
    text: |-
      1 De ambtenaar die opzettelijk de bijstand van de gewapende macht inroept tegen de uitvoering van wettelijke
      voorschriften, van wettige bevelen van het openbaar gezag of van rechterlijke uitspraken of bevelschriften, wordt
      gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.

      2 Indien die uitvoering daardoor wordt verhinderd, wordt de schuldige gestraft met gevangenisstraf van ten hoogste
      negen jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel358
  - number: '359'
    text: |-
      De ambtenaar of een ander met enige openbare dienst voortdurend of tijdelijk belast persoon, die opzettelijk
      geld of geldswaardig papier dat hij in zijn bediening onder zich heeft, verduistert of toelaat dat het door een
      ander weggenomen of verduisterd wordt, of die ander daarbij als medeplichtige ter zijde staat, wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel359
  - number: '360'
    text: |-
      De ambtenaar of een ander met enige openbare dienst voortdurend of tijdelijk belast persoon, die opzettelijk boeken
      of registers, uitsluitend bestemd tot controle van de administratie, valselijk opmaakt of vervalst, wordt gestraft
      met gevangenisstraf van ten hoogste drie jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel360
  - number: '361'
    text: |-
      1 De ambtenaar of een ander met enige openbare dienst voortdurend of tijdelijk belast persoon, die opzettelijk
      zaken bestemd om voor de bevoegde macht tot overtuiging of bewijs te dienen, akten, bescheiden of registers,
      welke hij in zijn bediening onder zich heeft verduistert, vernielt, beschadigt of onbruikbaar maakt, of toelaat
      dat zij door een ander worden weggemaakt, vernield, beschadigd of onbruikbaar gemaakt, of die ander daarbij als
      medeplichtige ter zijde staat, wordt gestraft met gevangenisstraf van ten hoogste vier jaren en zes maanden of
      geldboete van de vijfde categorie.

      2 Onder bevoegde macht wordt mede verstaan: een internationaal gerecht dat zijn rechtsmacht ontleent aan een
      verdrag waarbij het Koninkrijk partij is.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel361
  - number: '363'
    text: |-
      1 Met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie wordt gestraft de ambtenaar:

      1°. die een gift of belofte dan wel een dienst aanneemt, wetende of redelijkerwijs vermoedende dat deze hem gedaan,
      verleend of aangeboden wordt teneinde hem te bewegen om in zijn bediening iets te doen of na te laten;

      2°. die een gift of belofte dan wel een dienst aanneemt, wetende of redelijkerwijs vermoedende dat deze hem gedaan,
      verleend of aangeboden wordt ten gevolge of naar aanleiding van hetgeen door hem in zijn huidige of vroegere
      bediening is gedaan of nagelaten;

      3°. die een gift of belofte dan wel een dienst vraagt teneinde hem te bewegen om in zijn bediening iets te doen of
      na te laten;

      4°. die een gift of belofte dan wel een dienst vraagt ten gevolge of naar aanleiding van hetgeen door hem in zijn
      huidige of vroegere bediening is gedaan of nagelaten.

      2 Met dezelfde straf wordt gestraft hij die in het vooruitzicht van een dienstbetrekking bij een
      overheidswerkgever, indien de dienstbetrekking bij een overheidswerkgever is gevolgd, een feit begaat als in het
      eerste lid, onder 1° en 3°, omschreven.

      3 Hij die een feit als omschreven in het eerste lid begaat in verband met zijn hoedanigheid van minister,
      staatssecretaris, commissaris van de Koning, gedeputeerde, burgemeester, wethouder of lid van een algemeen
      vertegenwoordigend orgaan, wordt gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde
      categorie.

      4 Indien het feit is gepleegd ten behoeve van een buitenlandse mogendheid wordt de op het feit gestelde
      gevangenisstraf met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel363
  - number: '364'
    text: |-
      1 De rechter die een gift, belofte of dienst aanneemt, wetende of redelijkerwijs vermoedende dat deze hem gedaan,
      verleend of aangeboden wordt teneinde invloed uit te oefenen op de beslissing van een aan zijn oordeel onderworpen
      zaak, wordt gestraft met gevangenisstraf van ten hoogste negen jaren of geldboete van de vijfde categorie.

      2 De rechter die een gift, belofte of dienst vraagt teneinde hem te bewegen om invloed uit te oefenen op de
      beslissing van een aan zijn oordeel onderworpen zaak, wordt gestraft met gevangenisstraf van ten hoogste negen
      jaren of geldboete van de vijfde categorie.

      3 Indien de gift, belofte of dienst wordt aangenomen, wetende of redelijkerwijs vermoedende dat deze gedaan,
      verleend of aangeboden wordt om een veroordeling in een strafzaak te verkrijgen, wordt de rechter gestraft met
      gevangenisstraf van ten hoogste twaalf jaren of geldboete van de vijfde categorie.

      4 Indien de gift, belofte of dienst wordt gevraagd teneinde hem te bewegen om een veroordeling in een strafzaak
      te verkrijgen, wordt de rechter gestraft met een gevangenisstraf van ten hoogste twaalf jaren of geldboete van de
      vijfde categorie.

      5 Indien het feit is gepleegd ten behoeve van een buitenlandse mogendheid wordt de op het feit gestelde
      gevangenisstraf met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel364
  - number: 364a
    text: |-
      1 Met ambtenaren worden ten aanzien van de [artikelen 358 tot en met 361][ref1], [363][ref2],
      [365 tot en met 371][ref3] en [376][ref4] gelijkgesteld personen in de openbare dienst van een vreemde staat of van
      een volkenrechtelijke organisatie.

      2 Met ambtenaren worden ten aanzien van [artikel 363, onder 2° en 4°][ref5], voormalige ambtenaren gelijkgesteld.

      3 Met rechter wordt ten aanzien van [artikel 364][ref6] gelijkgesteld de rechter van een vreemde staat of van een
      volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel358
