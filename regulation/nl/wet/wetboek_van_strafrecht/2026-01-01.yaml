    text: |-
      1 Verbeurdverklaring kan worden uitgesproken bij veroordeling wegens enig strafbaar feit.

      2 [Artikel 24][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '24'
  - number: 33a
    text: |-
      1 Vatbaar voor verbeurdverklaring zijn:

      a. voorwerpen die aan de veroordeelde toebehoren of die hij geheel of ten dele ten eigen bate kan aanwenden en die
      geheel of grotendeels door middel van of uit de baten van het strafbare feit zijn verkregen;

      b. voorwerpen met betrekking tot welke het feit is begaan;

      c. voorwerpen met behulp van welke het feit is begaan of voorbereid;

      d. voorwerpen met behulp van welke de opsporing van het misdrijf is belemmerd;

      e. voorwerpen die tot het begaan van het misdrijf zijn vervaardigd of bestemd;

      f. zakelijke rechten op of persoonlijke rechten ten aanzien van de onder *a* tot en met *e* bedoelde voorwerpen.

      2 Voorwerpen als bedoeld in het eerste lid onder *a* tot en met *e* die niet aan de veroordeelde toebehoren kunnen
      alleen verbeurd worden verklaard indien:

      a. degene aan wie zij toebehoren bekend was met hun verkrijging door middel van het strafbare feit of met het
      gebruik of de bestemming in verband daarmede, dan wel die verkrijging, dat gebruik of die bestemming redelijkerwijs
      had kunnen vermoeden, of

      b. niet is kunnen worden vastgesteld aan wie zij toebehoren.

      3 Rechten als bedoeld in het eerste lid, onder *f*, die niet aan de veroordeelde toebehoren kunnen alleen verbeurd
      worden verklaard indien degene aan wie zij toebehoren bekend was met de verkrijging van de voorwerpen waarop of
      ten aanzien waarvan deze rechten bestaan, door middel van het strafbare feit of met het gebruik of de bestemming in
      verband daarmede, danwel die verkrijging, dat gebruik of die bestemming redelijkerwijs had kunnen vermoeden.

      4 Onder voorwerpen worden verstaan alle zaken en alle vermogensrechten.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel33a
  - number: 33b
    text: |-
      In de verbeurdverklaring van een voorwerp is begrepen die van de verpakking waarin het zich bevindt, tenzij de
      rechter het tegendeel bepaalt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel33b
  - number: 33c
    text: |-
      1 Bij de verbeurdverklaring van voorwerpen kan de rechter voor het geval waarin de verbeurd verklaarde voorwerpen
      meer zouden opbrengen dan een in de uitspraak vastgesteld bedrag, bevelen dat het verschil wordt vergoed.

      2 De rechter kent een vergoeding, als bedoeld in het eerste lid, of een geldelijke tegemoetkoming toe wanneer
      dit nodig is om te voorkomen dat de verdachte, of een ander aan wie de verbeurd verklaarde voorwerpen toebehoren,
      onevenredig zou worden getroffen.

      3 De rechter bepaalt aan wie het bedrag van de vergoeding of tegemoetkoming wordt uitbetaald; zulks laat ieders
      recht op dit bedrag onverlet.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel33c
  - number: '34'
    text: |-
      1 Niet in beslag genomen voorwerpen worden, bij verbeurdverklaring, in de uitspraak op een bepaald geldelijk bedrag
      geschat.

      2 De voorwerpen moeten in dit geval worden uitgeleverd of de geschatte waarde moet worden betaald.

      3 De [artikelen 24c][ref1] en 25 en de [artikelen 6:4:2][ref2] en [6:4:7 van het Wetboek van Strafvordering][ref3]
      vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24c
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel642
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel647
