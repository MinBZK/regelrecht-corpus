  - number: '272'
    text: |-
      1 Hij die enig geheim waarvan hij weet of redelijkerwijs moet vermoeden dat hij uit hoofde van ambt, beroep of
      wettelijk voorschrift dan wel van vroeger ambt of beroep verplicht is het te bewaren, opzettelijk schendt, wordt
      gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie.

      2 Indien dit misdrijf tegen een bepaald persoon gepleegd is, wordt het slechts vervolgd op diens klacht.

      3 Indien het feit is gepleegd ten behoeve van een buitenlandse mogendheid wordt de op het feit gestelde
      gevangenisstraf met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel272
  - number: '273'
    text: |-
      1 Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft hij die
      opzettelijk

      1°. aangaande een onderneming van handel, nijverheid of dienstverlening bij welke hij werkzaam is of is geweest,
      bijzonderheden waarvan hem geheimhouding is opgelegd, bekend maakt of

      2°. gegevens die door misdrijf zijn verkregen uit een geautomatiseerd werk van een onderneming van handel,
      nijverheid of dienstverlening en die betrekking hebben op deze onderneming, bekend maakt of uit winstbejag
      gebruikt, indien deze gegevens ten tijde van de bekendmaking of het gebruik niet algemeen bekend waren en daaruit
      enig nadeel kan ontstaan.

      2 Niet strafbaar is hij die te goeder trouw heeft kunnen aannemen dat het algemeen belang de bekendmaking vereiste.

      3 Geen vervolging heeft plaats dan op klacht van het bestuur van de onderneming.

      4 Indien het feit is gepleegd ten behoeve van een buitenlandse mogendheid wordt de op het feit gestelde
      gevangenisstraf met een derde verhoogd.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel273
  - number: 273a
    text: |-
      De persoon werkzaam bij enige openbare instelling van vervoer die een aan zodanige instelling toevertrouwde brief,
      gesloten stuk of pakket opzettelijk en wederrechtelijk opent, daarvan inzage neemt of de inhoud aan een ander
      bekendmaakt, wordt gestraft met gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde
      categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel273a
  - number: 273b
    text: |-
      1 De persoon werkzaam bij enige openbare instelling van vervoer die een aan zodanige instelling toevertrouwde
      brief, briefkaart, stuk of pakket opzettelijk aan een ander dan de rechthebbende afgeeft, vernietigt, wegmaakt,
      zich toe-eigent, of de inhoud wijzigt of enig daarin gesloten voorwerp zich toe-eigent, wordt gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.

      2 Indien zodanig stuk of voorwerp geldswaarde heeft, wordt de toe-eigening gestraft met gevangenisstraf van ten
      hoogste zes jaren of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel273b
  - number: 273c
    text: |-
      De persoon belast met de dienst van een ten algemenen nutte gebezigde telegraafinrichting wordt gestraft:

      a. met gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie, indien
      hij de inhoud van een aan zodanige inrichting toevertrouwd bericht opzettelijk en wederrechtelijk aan een ander
      bekendmaakt of een telegram opzettelijk en wederrechtelijk opent, daarvan inzage neemt of de inhoud aan een ander
      bekendmaakt;

      b. met gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie, indien hij een aan zodanige
      inrichting toevertrouwd bericht of een telegram opzettelijk aan een ander dan de rechthebbende afgeeft, vernietigt,
      wegmaakt, zich toe-eigent of de inhoud wijzigt.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel273c
  - number: 273d
    text: |-
      1 Met gevangenisstraf van ten hoogste een jaar en zes maanden of geldboete van de vierde categorie wordt gestraft
      de persoon werkzaam bij een aanbieder van een openbaar communicatienetwerk of een openbare communicatiedienst:

      a. die opzettelijk en wederrechtelijk van gegevens kennisneemt die door tussenkomst van zodanig netwerk of zodanige
      dienst zijn opgeslagen, worden verwerkt of overgedragen en die niet voor hem zijn bestemd, zodanige gegevens voor
      zichzelf of een ander overneemt, aftapt of opneemt;

      b. die de beschikking heeft over een voorwerp waaraan, naar hij weet of redelijkerwijs moet vermoeden, een gegeven
      kan worden ontleend, dat door wederrechtelijk overnemen, aftappen of opnemen van zodanige gegevens is verkregen;

      c. die opzettelijk en wederrechtelijk de inhoud van zodanige gegevens aan een ander bekendmaakt;

      d. die opzettelijk en wederrechtelijk een voorwerp waaraan een gegeven omtrent de inhoud van zodanige gegevens kan
      worden ontleend, ter beschikking stelt van een ander.

      2 Het eerste lid is van overeenkomstige toepassing op de persoon werkzaam bij een aanbieder van een niet-openbaar
      communicatienetwerk of een niet-openbare communicatiedienst.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel273d
  - number: 273e
    text: |-
      Enig in de [artikelen 273a tot en met 273d][ref1] bedoeld persoon die opzettelijk toelaat dat een ander een der in
      deze artikelen vermelde feiten pleegt, of die ander daarbij als medeplichtige ter zijde staat, wordt gestraft met
      de straffen en naar de onderscheidingen in die bepalingen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel273a
