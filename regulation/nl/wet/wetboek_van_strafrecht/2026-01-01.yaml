      - id: ref1
        bwb_id: BWBR0001903
        artikel: 12i
  - number: 77f
    text: |-
      1 In een strafbeschikking kan de officier van justitie tevens de aanwijzing geven dat:

      a. de jeugdige zich zal richten naar de aanwijzingen van een gecertificeerde instelling, bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1] voor een daarbij te bepalen termijn van ten hoogste zes maanden;

      b. indien de jeugdige ten tijde van het begaan van het strafbaar feit de leeftijd van zestien jaren reeds heeft
      bereikt, kan de officier van justitie in plaats daarvan de aanwijzing geven dat de jeugdige zich zal richten naar
      de aanwijzingen van een reclasseringsinstelling als bedoeld in [artikel 14c, zesde lid][ref2].

      2 In afwijking van [artikel 257a, tweede lid, onderdeel a, van het Wetboek van Strafvordering][ref3] kan de
      officier van justitie in een strafbeschikking een taakstraf opleggen voor ten hoogste zestig uren.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel14c
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel257a
