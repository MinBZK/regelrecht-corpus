        artikel: '274'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '285'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 286a
    text: |-
      Bij veroordeling wegens een der misdrijven omschreven in de [artikelen 282b][ref1], [282c][ref2] en
      [285, derde lid][ref3], kan ontzetting van het in [artikel 28, eerste lid, onder 3°][ref4], vermelde recht worden
      uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel282b
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel282c
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel285
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel286a
