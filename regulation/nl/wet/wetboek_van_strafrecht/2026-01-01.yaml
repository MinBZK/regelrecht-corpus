  - number: '5'
    text: |-
      1 De Nederlandse strafwet is toepasselijk op een ieder die zich buiten Nederland schuldig maakt aan een misdrijf
      tegen een Nederlander, een Nederlandse ambtenaar, een Nederlands voertuig, vaartuig of luchtvaartuig, voor zover op
      dit feit naar de wettelijke omschrijving een gevangenisstraf van ten minste acht jaren is gesteld en daarop door de
      wet van het land waar het begaan is, straf is gesteld.

      2 Met een Nederlander wordt voor de toepassing van het eerste lid gelijkgesteld de vreemdeling die in Nederland een
      vaste woon- of verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel5
  - number: '6'
    text: |-
      1 De Nederlandse strafwet is toepasselijk op een ieder die zich buiten Nederland schuldig maakt aan een feit voor
      zover een bij algemene maatregel van bestuur aangewezen verdrag of besluit van een volkenrechtelijke organisatie
      tot het vestigen van rechtsmacht over dat feit verplicht.

      2 In de algemene maatregel van bestuur, bedoeld in het eerste lid, worden de feiten omschreven met betrekking tot
      welke de bij de maatregel aangewezen verdragen en besluiten van volkenrechtelijke organisaties tot de vestiging van
      rechtsmacht verplichten.
    url: https://wetten.overheid.nl/BWBR0001854/2026-01-01#Artikel6
  - number: '7'
    text: |-
      1 De Nederlandse strafwet is toepasselijk op de Nederlander die zich buiten Nederland schuldig maakt aan een feit
      dat door de Nederlandse strafwet als misdrijf wordt beschouwd en waarop door de wet van het land waar het begaan
      is, straf is gesteld.

      2 De Nederlandse strafwet is voorts toepasselijk op de Nederlander die zich buiten Nederland schuldig maakt:

      a. aan een van de misdrijven omschreven in de [Titels I][ref1] en [II van het Tweede Boek][ref2] en in de
      [artikelen 192a tot en met 192c][ref3], [197a tot en met 197c][ref4], [206][ref5], [237][ref6], [272][ref7] en
      [273][ref8];

      b. aan een van de misdrijven omschreven in de [artikelen 177][ref9], [178][ref10], [179][ref11], [180][ref12],
      [189][ref13], [200][ref14], [207a][ref15], [285a][ref16] en [361][ref17], voor zover het feit gericht is tegen de
      rechtspleging van het Internationaal Strafhof;

      c. aan een van de misdrijven omschreven in de [artikelen 240 tot en met 243][ref18] en [245 tot en met 253][ref19];

      d. aan een van de misdrijven omschreven in de [artikelen 300 tot en met 303][ref20], voor zover het feit oplevert
      genitale verminking van een persoon van het vrouwelijke geslacht die de leeftijd van achttien jaren nog niet heeft
      bereikt;

      e. aan het misdrijf omschreven in [artikel 284][ref21].

      3 Met een Nederlander wordt voor de toepassing van het eerste en het tweede lid, onder b tot en met e,
      gelijkgesteld de vreemdeling die na het plegen van het feit Nederlander wordt alsmede, voor de toepassing van het
      eerste en tweede lid, de vreemdeling die in Nederland een vaste woon- of verblijfplaats heeft.


