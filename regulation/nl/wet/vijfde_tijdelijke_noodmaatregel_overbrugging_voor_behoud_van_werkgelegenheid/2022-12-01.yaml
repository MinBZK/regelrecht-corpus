preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, en 8, eerste lid, van de Kaderwet SZW-subsidies en artikel 32d, tweede lid,
    van de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *extra periode salaris:* extra loon dat naast het reguliere
      loon en vakantiebijslag wordt uitbetaald naar aanleiding van afspraken in de individuele of collectieve
      arbeidsovereenkomst, en dat niet afhankelijk is van bedrijfsresultaten of kwalitatieve of kwantitatieve prestaties
      van de werknemer;
        - *loon:* het loon, bedoeld in [artikel 16 van de Wet financiering sociale verzekeringen][ref1], voor zover
      het betreft loon uit tegenwoordige dienstbetrekking, met uitzondering van uitkeringen in het kader van de
      [Ziektewet][ref2] door eigenrisicodragers;
        - *loonsom:* het loon van alle werknemers, behorende tot een loonheffingennummer;
        - *loonheffingennummer:* het nummer, genoemd in
      [artikel 1a.1, tweede lid, onderdeel b, onder 1°, van de Regeling gegevensuitvraag loonaangifte][ref3];
        - *Minister:* de Minister van Sociale Zaken en Werkgelegenheid;
        - *omzetdaling:* een daling van de omzet als bedoeld in [artikel 6, eerste lid][ref4];
        - *omzetperiode:* de maanden november 2021 en december 2021;
        - *referentie-omzet:* de referentie-omzet, bedoeld in [artikel 6][ref5];
        - *UWV:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6];
        - *werkgever:* een werkgever als bedoeld in
      [artikel 1, onderdeel q of r, van de Wet financiering sociale verzekeringen][ref7];
        - *werknemer:* een werknemer als bedoeld in
      [artikel 1, onderdeel o of p, van de Wet financiering sociale verzekeringen][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
