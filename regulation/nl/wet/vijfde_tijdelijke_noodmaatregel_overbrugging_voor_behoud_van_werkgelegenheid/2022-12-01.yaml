  - number: '1.2'
    text: |-
      Onder omzet wordt in deze regeling verstaan de netto-omzet zoals gedefinieerd in
      [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] gecorrigeerd voor de in de winst-en-
      verliesrekening verantwoorde wijziging in onderhanden projecten. De grondslagen en detailtoepassingen voor de
      bepaling van de referentie-omzet en de omzet in de omzetperiode moeten gelijk aan elkaar zijn en in overeenstemming
      met de wet- en regelgeving. Als voor de berekening van de referentie-omzet het kalenderjaar 2019 bepalend is,
      zijn de grondslagen en detailtoepassingen van de uiterlijk op 1 november 2021 en conform wet- en regelgeving
      vastgestelde jaarrekening 2019 leidend, of in geval van natuurlijke personen de laatst conform wet- en regelgeving
      vastgestelde aangifte over 2019 voor de [Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel377
      [ref2]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '377'
      - id: ref2
        bwb_id: BWBR0011353
  - number: '1.3'
    text: |-
      Alle baten die voortkomen uit de uitvoering van normale activiteiten van een organisatie, ook als deze gewoonlijk
      met een andere term dan omzet worden aangeduid, vallen onder omzet in de zin van deze regeling.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel1
  - number: '1.4'
    text: |-
      Onder omzet wordt in deze regeling niet verstaan de subsidie die de werkgever
      ontvangt op grond van de [Eerste][ref1], [Tweede][ref2], [Derde][ref3] en
      [Vierde tijdelijke noodmaatregel overbrugging voor behoud van werkgelegenheid][ref4], alsmede op grond van deze
      regeling en subsidie die de werkgever over de omzetperiode ontvangt van de Staatssecretaris van Economische Zaken
      en Klimaat ter tegemoetkoming in de vaste lasten in verband met de maatregelen ter bestrijding van de verdere
      verspreiding van COVID-19.


      [ref1]: https://wetten.overheid.nl/BWBR0043340
      [ref2]: https://wetten.overheid.nl/BWBR0043709
      [ref3]: https://wetten.overheid.nl/BWBR0044201
      [ref4]: https://wetten.overheid.nl/BWBR0045467
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0043340
      - id: ref2
        bwb_id: BWBR0043709
      - id: ref3
        bwb_id: BWBR0044201
      - id: ref4
        bwb_id: BWBR0045467
  - number: '1.5'
    text: |-
      Als aan een werkgever gedurende de omzetperiode een werkloosheidsuitkering is uitbetaald,
      in verband met verkorting van de werktijd van zijn werknemers, waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] ontheffing is verleend, wordt
      deze uitkering beschouwd als omzet, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '8'
  - number: '2.1'
    text: |-
      Op subsidies verleend op grond van deze regeling is de [Kaderregeling subsidies OCW, SZW en VWS][ref1] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037603
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0037603
  - number: '2.2'
    text: |-
      Formulieren waarnaar in deze regeling wordt verwezen, worden door de Minister beschikbaar gesteld op [www.uwv.nl]
      (onbekend).
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel2
  - number: '3'
    text: |-
      Het doel van deze regeling is om werkgevers tegemoet te komen in de betaling van de loonkosten, indien sprake
      is van een acute terugval in de omzet met ten minste 20%, gedurende de omzetperiode, vanwege een vermindering in
      bedrijvigheid door buitengewone omstandigheden die in redelijkheid niet tot het normale ondernemersrisico kunnen
      worden gerekend, voor zover geen winst of bonussen worden uitgekeerd of eigen aandelen worden aangekocht, zodat
      werkgevers zoveel mogelijk werknemers in dienst kunnen houden en werkgevers zich samen met de werknemers kunnen
      voorbereiden op en aanpassen aan de nieuwe economische situatie.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel3
  - number: '4'
    text: |-
      De Minister kan aan een werkgever, die in de omzetperiode wordt geconfronteerd met een daling van de omzet van ten
      minste 20%, per loonheffingennummer een subsidie verlenen over de loonsom in de periode van 1 november 2021 tot en
      met 31 december 2021.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel4
  - number: '5'
    text: |-
      Onverminderd [artikel 4:35, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1] wordt de
      subsidieverlening geweigerd, indien of voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 5.a
    text: niet of onvoldoende aannemelijk is dat de omzetdaling van de betreffende werkgever ten minste 20% zal zijn;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel5
  - number: 5.b
    text: |-
      het rekeningnummer dat bij de aanvraag is opgegeven niet correspondeert met het in de aanvraag opgegeven
      loonheffingennummer en de daaraan verbonden rekeninggegevens;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel5
  - number: 5.c
    text: |-
      geen loongegevens beschikbaar zijn in de polisadministratie, bedoeld in
      [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], over de aangiftetijdvakken bedoeld
      in [artikel 8, tweede en derde lid][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0045993#Artikel8
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0045993
        artikel: '8'
  - number: 5.d
    text: de aanvraag anderszins niet voldoet aan de in deze regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel5
  - number: '6.1'
    text: |-
      De omzetdaling wordt vastgesteld door het verschil tussen de referentie-omzet en de omzet in de omzetperiode te
      delen door de referentie-omzet. De uitkomst van deze berekening wordt uitgedrukt in hele procenten en naar boven
      afgerond.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel6
  - number: '6.2'
    text: De referentie-omzet, bedoeld in het eerste lid, is de omzet over het kalenderjaar 2019, gedeeld door zes.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel6
  - number: '6.3'
    text: |-
      Als de werkgever de bedrijfsuitoefening in de periode van 2 januari 2019 tot en met 1 februari 2020 is aangevangen,
      dan is de referentie-omzet, bedoeld in het eerste lid, de omzet over de periode vanaf de eerste volledige
      kalendermaand vanaf de aanvang van de bedrijfsuitoefening tot en met 29 februari 2020, gedeeld door het aantal
      maanden waarvan de omzet in aanmerking wordt genomen, vermenigvuldigd met twee.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel6
  - number: '6.4'
    text: |-
      Als de werkgever de bedrijfsuitoefening in de periode van 2 februari 2020 tot en met 1 juli 2021 is aangevangen,
      dan is de referentie-omzet, bedoeld in het eerste lid, de omzet over de maanden juli 2021 tot en met oktober 2021,
      gedeeld door twee.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel6
  - number: '6.5'
    text: |-
      Als de werkgever de bedrijfsuitoefening in de periode van 2 juli 2021 tot en met 30 september 2021 is aangevangen,
      dan is de referentie-omzet, bedoeld in het eerste lid, de omzet over de periode vanaf de eerste volledige
      kalendermaand vanaf de aanvang van de bedrijfsuitoefening tot en met 31 oktober 2021, gedeeld door het aantal
      maanden waarvan de omzet in aanmerking wordt genomen, vermenigvuldigd met twee.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel6
  - number: '6.6'
    text: |-
      Als de werkgever een economische eenheid heeft overgenomen in de zin van
      [artikel 7:662 van het Burgerlijk Wetboek][ref1], of middels een aandelentransactie zeggenschap heeft verkregen
      over een rechtspersoon of vennootschap die onderdeel is geworden van een groep als bedoeld in het negende lid, en
      daar bij de subsidieaanvraag om verzoekt, dan is de referentie-omzet, bedoeld in het eerste lid, bij een overname
      in de periode:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
  - number: 6.6.a
    text: |-
      van 2 januari 2019 tot en met 1 februari 2020, de omzet over de periode vanaf de eerste volledige kalendermaand
      vanaf de overgang tot en met 29 februari 2020, gedeeld door het aantal maanden waarvan de omzet in aanmerking wordt
      genomen, vermenigvuldigd met twee;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel6
  - number: 6.6.b
    text: |-
      van 2 februari 2020 tot en met 1 juli 2021, de omzet over de maanden juli 2021 tot en met oktober 2021, gedeeld
      door twee;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel6
  - number: 6.6.c
    text: |-
      van 2 juli 2021 tot en met 1 oktober 2021, de omzet over de periode vanaf de eerste volledige kalendermaand vanaf
      de overgang tot en met 31 oktober 2021, gedeeld door het aantal maanden waarvan de omzet in aanmerking wordt
      genomen, vermenigvuldigd met twee.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel6
  - number: '6.7'
    text: |-
      Als de werkgever een onderdeel of activiteit heeft afgestoten vanaf de periode waarover de referentie-omzet wordt
      berekend tot en met 1 november 2021, wordt de omzet van het afgestoten onderdeel of de afgestoten activiteit in
      mindering gebracht op de referentie-omzet.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel6
  - number: '6.8'
    text: Voor de omzetdaling wordt uitgegaan van de omzetdaling van de natuurlijke of rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel6
  - number: '6.9'
    text: |-
      Indien de rechtspersoon of vennootschap onderdeel is van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1], wordt, in afwijking van het achtste lid, uitgegaan van
      de omzetdaling van de groep zoals deze op 1 november 2021 bestond. Indien de rechtspersoon een dochtermaatschappij
      is van een ander als bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref2], worden de
      dochtermaatschappij en de rechtspersoon voor de werking van deze regeling behandeld als waren zij een groep. Voor
      de bepaling van de omzetdaling als bedoeld in de eerste zin worden de Nederlandse rechtspersonen en vennootschappen
      in aanmerking genomen, alsmede buitenlandse rechtspersonen en vennootschappen met loon in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 24a
  - number: '6.10'
    text: |-
      Subsidies en baten die betrekking hebben op een langere periode dan de omzetperiode en de periode, bedoeld in het
      tweede lid, worden naar rato aan de betreffende perioden toegerekend voor de bepaling van de omzetdaling, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel6
  - number: '7.1'
    text: |-
      In afwijking van [artikel 6, negende lid][ref1], kan aan de werkgever die deel uitmaakt van een groep als
      bedoeld in dat lid, en die daar bij de aanvraag tot vaststelling van de subsidie om verzoekt, subsidie worden
      verstrekt waarbij de omzetdaling wordt bepaald op basis van de omzetdaling van die rechtspersoon of vennootschap
      afzonderlijk, indien aan de volgende voorwaarden is voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel6
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '6'
  - number: 7.1.a
    text: |-
      de rechtspersoon of vennootschap heeft geen bedrijfsmatige activiteiten die voor meer dan de helft bestaan uit het
      binnen de groep ter beschikking stellen van arbeidskrachten;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel7
  - number: 7.1.b
    text: |-
      de werkgever handelt in overeenstemming met een van dagtekening voorziene overeenkomst over werkbehoud, die door hem
      voorafgaand aan de aanvraag van de vaststelling van de subsidie wordt aangegaan met ten minste één belanghebbende
      vereniging van werknemers, bedoeld in [artikel 3, derde lid, van de Wet melding collectief ontslag][ref1], en
      bij gebreke daarvan, of indien de werkmaatschappij minder dan 20 werknemers heeft, een andere vertegenwoordiging
      van werknemers, inhoudende de ondernemingsraad, de personeelsvertegenwoordiging of de vergadering als bedoeld in
      [artikel 35b, eerste lid, van de Wet op de ondernemingsraden][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel35b
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002747
        artikel: 35b
  - number: 7.1.c
    text: |-
      de andere rechtspersonen of vennootschappen binnen een groep als bedoeld in [artikel 6, negende lid][ref1],
      voeren geen opdrachten of projecten uit die ten koste kunnen gaan van de rechtspersoon of vennootschap waarvoor de
      omzetdaling met toepassing van dit artikel wordt bepaald; en


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel6
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '6'
  - number: 7.1.d
    text: |-
      de omzetdaling van de groep, bedoeld in [artikel 6, negende lid][ref1], bedraagt in de omzetperiode minder dan 20%.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel6
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '6'
  - number: '7.2'
    text: |-
      Indien en voor zover werknemers van de rechtspersoon of vennootschap, waarvan de omzet met toepassing van
      het eerste lid wordt vastgesteld, in de omzetperiode werkzaamheden verrichten bij een andere rechtspersoon of
      vennootschap, wordt de omzet van de rechtspersoon of vennootschap naar boven bijgesteld. Voor de berekening
      van de verhoging wordt de omzet over de periode die voor die rechtspersoon of vennootschap volgt uit
      [artikel 6, tweede tot en met zevende lid][ref1], afgezet tegen de loonkosten over die periode. Deze verdeling
      wordt toegepast op de loonkosten zoals deze zijn ingezet bij de andere rechtspersoon of vennootschap en toegerekend
      aan de omzet over de omzetperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel6
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '6'
  - number: '7.3'
    text: 'Bij toepassing van het eerste lid worden bij de berekening van de omzet:'
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel7
  - number: 7.3.a
    text: |-
      dezelfde verrekenprijsregels en grondslagen van waardering en resultaatbepaling gehanteerd voor de bepaling
      van de referentie-omzet en de omzet in de omzetperiode, waarbij de uiterlijk op 1 november 2021 conform wet- en
      regelgeving vastgestelde jaarrekening 2019 leidend is, voor zover voor de berekening van de referentie-omzet het
      kalenderjaar 2019 bepalend is; en
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel7
  - number: 7.3.b
    text: mutaties in de voorraden gereed product toegerekend aan de omzet.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel7
  - number: '7.4'
    text: |-
      Bij toepassing van dit artikel kan een groepsdeel als bedoeld in
      [artikel 405, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] bestaande uit een tussenholding en haar
      groepsmaatschappijen worden behandeld als waren zij één rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel405
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '405'
  - number: '7.5'
    text: |-
      Indien in strijd wordt gehandeld met het eerste lid, onderdeel c, of het tweede lid, wordt voor de toepassing van
      dit artikel de omzet bijgesteld naar de situatie waarin niet in strijd met die artikelen zou zijn gehandeld.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel7
  - number: '8.1'
    text: |-
      De hoogte van de subsidie is de uitkomst van: A x B x 2 x 1,4 x 0,85 Hierbij staat: A voor het percentage van
      de omzetdaling, met dien verstande dat A ten hoogste 0,9 bedraagt; B voor de loonsom waarbij wordt uitgegaan van
      de totale loonsom van werknemers waarvoor de werkgever het loon heeft uitbetaald in het tijdvak, bedoeld in het
      tweede, derde of vierde lid, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel8
  - number: 8.1.a
    text: |-
      de uitbetaling van vakantiebijslag in het gehanteerde aangiftetijdvak niet wordt meegenomen
      bij de vaststelling van de loonsom, met uitzondering van de uitbetaling van vakantiebijslag
      door de werkgever die geen vakantiebijslag voor de werknemer reserveert, als bedoeld in
      [artikel 5, derde lid, van het Dagloonbesluit werknemersverzekeringen][ref1] zoals dat luidde op 31 december 2021;


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel5
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '5'
  - number: 8.1.b
    text: |-
      de loonsom wordt vermenigvuldigd met 0,926, indien de werkgever geen vakantiebijslag voor de werknemer reserveert,
      als bedoeld in [artikel 5, derde lid, van het Dagloonbesluit werknemersverzekeringen][ref1] zoals dat luidde op 31
      december 2021;


      [ref1]: https://wetten.overheid.nl/BWBR0033471#Artikel5
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0033471
        artikel: '5'
  - number: 8.1.c
    text: |-
      de loonsom wordt verminderd met een extra periode salaris dat naast het reguliere loon en vakantiebijslag wordt
      uitbetaald in het tijdvak, bedoeld in het tweede of derde lid; en
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel8
  - number: 8.1.d
    text: |-
      het in aanmerking te nemen loon per werknemer niet meer bedraagt dan tweemaal het maximale dagloon, bedoeld
      in [artikel 17 van de Wet financiering sociale verzekeringen][ref1], maal 21,75, berekend na toepassing van de
      onderdelen a tot en met c.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '8.2'
    text: |-
      Voor de loonsom, bedoeld in het eerste lid, wordt uitgegaan van het loon over de maand september 2021. Indien er
      sprake is van een aangiftetijdvak van vier weken, wordt uitgegaan van het loon over het tiende aangiftetijdvak van
      het jaar 2021, waarbij de loonsom in dat aangiftetijdvak wordt verhoogd met 8,33 procent.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel8
  - number: '8.3'
    text: |-
      Indien er geen sprake is van een aangiftetijdvak van een maand of vier weken, wordt het loon per werknemer herleid
      naar een loon per aangiftetijdvak van een maand.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel8
  - number: '8.4'
    text: |-
      Indien de loonsom als bedoeld onder de letter C meer dan 15%, naar beneden afgerond, lager is dan tweemaal de
      loonsom als bedoeld in het eerste lid, onder de letter B, wordt de subsidie verlaagd met: ((0,85B x 2) – C) x 1,4
      x 0,85 Hierbij staat: B voor de loonsom, zoals berekend op grond van het eerste lid tot en met derde lid; C voor
      de loonsom over de periode 1 november 2021 tot en met 31 december 2021, met dien verstande dat het eerste en het
      derde lid van overeenkomstige toepassing zijn, waarbij de gehanteerde aangiftetijdvakken het elfde en twaalfde
      aangiftetijdvak van het jaar 2021 zijn.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel8
  - number: '8.5'
    text: |-
      Indien er sprake is van een werkgever die per vier weken aangifte doet voor de loonheffingen, wordt de loonsom,
      bedoeld in het vierde lid, onder de letter C, bepaald door het twaalfde en dertiende aangiftetijdvak van het jaar
      2021 te hanteren, waarbij de loonsom in die aangiftetijdvakken wordt verhoogd met 8,33 procent.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel8
  - number: '8.6'
    text: |-
      De in aanmerking te nemen gegevens uit de loonaangifte van de werkgever ten behoeve van de bepaling van de letter
      B, bedoeld in het eerste lid, worden beoordeeld op grond van de loonaangifte zoals die uiterlijk op 15 november
      2021 is ingediend, alsmede de aanvullingen daarop die uiterlijk op die datum hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel8
  - number: '8.7'
    text: |-
      De in aanmerking te nemen gegevens uit de loonaangifte van de werkgever ten behoeve van de bepaling van de letter
      C, bedoeld in het vierde lid, worden beoordeeld op grond van de loonaangifte zoals die uiterlijk op 15 februari
      2022 is ingediend, alsmede de aanvullingen daarop die uiterlijk op die datum hebben plaatsgevonden. Indien de
      loonaangifte na laatstgenoemde datum naar beneden wordt bijgesteld, kan de Minister besluiten de gewijzigde
      loonaangifte in aanmerking te nemen voor de vaststelling van de loonsom, bedoeld in het vierde lid, onder de letter
      C.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel8
  - number: '8.8'
    text: |-
      De subsidie wordt verlaagd met 5% indien de werkgever niet heeft voldaan aan de verplichting, bedoeld in artikel
      14, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel8
  - number: '9.1'
    text: De werkgever dient de subsidieaanvraag in door middel van een door de Minister beschikbaar gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
  - number: '9.2'
    text: Een subsidieaanvraag wordt ingediend van 13 december 2021 tot en met 31 januari 2022.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
  - number: '9.3'
    text: De werkgever kan eenmaal per loonheffingennummer een subsidieaanvraag indienen.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
  - number: '9.4'
    text: 'In de subsidieaanvraag wordt in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
  - number: 9.4.a
    text: de verwachte omzetdaling;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
  - number: 9.4.b
    text: het loonheffingennummer;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
  - number: 9.4.c
    text: |-
      het door de Kamer van Koophandel toegekende unieke nummer als bedoeld in de [Handelsregisterwet 2007][ref1], indien
      de werkgever daarover beschikt;


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 9.4.d
    text: |-
      het rekeningnummer uit een land dat valt onder de EU-Verordening/260/2012, waarop de werkgever betalingen van de
      Belastingdienst inzake loonheffingen ontvangt; en
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
  - number: 9.4.e
    text: |-
      of een verzoek als bedoeld in [artikel 6, zesde lid][ref1], wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel6
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '6'
  - number: '9.5'
    text: |-
      In de subsidieaanvraag verklaart de werkgever dat voldaan zal worden aan de verplichting, bedoeld
      in artikel 16 en dat indien [artikel 7][ref1] wordt toegepast, het groepshoofd, bedoeld in
      [artikel 406, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] en de moedermaatschappij, bedoeld in
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref3], daarmee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel406
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '406'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: 24a
  - number: '9.6'
    text: |-
      Indien de werkgever onderdeel is van een groep als bedoeld in [artikel 6, negende lid][ref1], of indien de
      werkgever meerdere loonheffingennummers heeft, wordt hetzelfde percentage, bedoeld in het vierde lid, onderdeel
      a, voor alle rechtspersonen en vennootschappen binnen de groep respectievelijk de loonheffingennummers gehanteerd.
      In afwijking van de eerste zin hoeft voor de werkgever die onderdeel is van een groep als bedoeld in artikel
      6, negende lid, niet hetzelfde percentage, bedoeld in het vierde lid, onderdeel a, te worden gehanteerd als
      het percentage dat voor de groep wordt gehanteerd, als de werkgever bij de aanvraag tot vaststelling verzoekt
      [artikel 7][ref2] toe te passen.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0045993#Artikel7
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0045993
        artikel: '7'
  - number: '9.7'
    text: |-
      De subsidieaanvraag wordt elektronisch gedaan, tenzij op [www.uwv.nl](onbekend) kenbaar wordt gemaakt dat een
      schriftelijke subsidieaanvraag ook mogelijk is.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
  - number: '9.8'
    text: |-
      Door het indienen van een aanvraag stemt de werkgever ermee in dat de volgende gegevens uit het subsidiedossier
      openbaar gemaakt kunnen worden:
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
  - number: 9.8.a
    text: de naam en de vestigingsplaats van werkgever;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
  - number: 9.8.b
    text: het verstrekte voorschot; en
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
  - number: 9.8.c
    text: de vastgestelde subsidie.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel9
  - number: '10.1'
    text: De Minister besluit binnen 13 weken na ontvangst van de volledige aanvraag.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel10
  - number: '10.2'
    text: 'De subsidiebeschikking vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel10
  - number: 10.2.a
    text: de periode waarvoor de subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel10
  - number: 10.2.b
    text: de hoogte van het bedrag van de subsidieverlening en het voorschot;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel10
  - number: 10.2.c
    text: |-
      de verplichtingen, bedoeld in [artikel 14][ref1], [15][ref2] en [16][ref3], waaraan de werkgever moet voldoen; en


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0045993#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0045993#Artikel16
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0045993
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0045993
        artikel: '16'
  - number: 10.2.d
    text: de termijn waarbinnen de vaststelling van de subsidie moet worden aangevraagd.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel10
  - number: '10.3'
    text: |-
      De beschikking tot subsidieverlening vermeldt niet het bedrag waarop de subsidie ten hoogste kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel10
  - number: '11'
    text: |-
      De hoogte van het bedrag van de subsidieverlening is de uitkomst van: A* x B x 2 x 1,4 x 0,85 Hierbij staat: A*
      voor het percentage van de door de werkgever verwachte omzetdaling, met dien verstande dat A* ten hoogste 0,8
      bedraagt; B voor de loonsom, zoals berekend op grond van [artikel 8, eerste tot en met derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel8
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '8'
  - number: '12.1'
    text: De Minister verstrekt de werkgever bij de beschikking tot subsidieverlening een voorschot.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel12
  - number: '12.2'
    text: |-
      De hoogte van het voorschot bedraagt 80% van het bedrag van de verlening, bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel11
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '11'
  - number: '13'
    text: |-
      Onverminderd [artikel 4:56 van de Algemene wet bestuursrecht][ref1], schort de Minister de betaling van een
      voorschot als bedoeld in [artikel 12][ref2] op, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0045993#Artikel12
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0045993
        artikel: '12'
  - number: 13.a
    text: |-
      sprake is van een ernstig vermoeden dat niet voldaan wordt aan de voorwaarden of de verplichtingen, bedoeld in
      [artikel 14, onderdelen a, b, en f tot en met j][ref1], [artikel 15][ref2] en [16][ref3], die zijn verbonden aan de
      subsidie; of


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0045993#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0045993#Artikel16
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0045993
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0045993
        artikel: '16'
  - number: 13.b
    text: indien een melding van de werkgever daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel13
  - number: '14'
    text: 'Aan de werkgever aan wie subsidie wordt verleend, worden de volgende verplichtingen opgelegd:'
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel14
  - number: 14.a
    text: |-
      de werkgever is verplicht de subsidie uitsluitend aan te wenden voor het doel waarvoor de subsidie is verstrekt,
      met dien verstande dat de subsidie in ieder geval wordt aangewend voor de betaling van loonkosten;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel14
  - number: 14.b
    text: |-
      de werkgever is verplicht de ondernemingsraad of personeelsvertegenwoordiging, bedoeld in de
      [Wet op de ondernemingsraden][ref1], of bij het ontbreken daarvan, de werknemers te informeren over de
      subsidieverlening;


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 14.c
    text: |-
      de werkgever is verplicht zich in te spannen om werknemers te stimuleren om deel te nemen aan een ontwikkeladvies
      of aan scholing;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel14
  - number: 14.d
    text: |-
      de werkgever is verplicht zich in te spannen om bij te dragen aan de begeleiding naar ander werk voor werknemers
      van wie de arbeidsovereenkomst eindigt of van wie hij het voornemen heeft de arbeidsovereenkomst te beëindigen of
      niet voort te zetten;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel14
  - number: 14.e
    text: |-
      indien de werkgever na 26 november 2021 en voor het einde van de subsidieperiode een verzoek om
      toestemming doet om de arbeidsovereenkomst van één of meer werknemers op te zeggen op grond van
      [artikel 669, derde lid, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref1] is hij verplicht om in
      de periode 13 december 2021 tot en met 31 januari 2022 contact op te nemen met UWV voor ondersteuning bij de
      begeleiding naar ander werk;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel669
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '669'
  - number: 14.f
    text: |-
      de werkgever voert een zodanig controleerbare administratie dat alle voor de vaststelling van de subsidie van
      belang zijnde gegevens kunnen worden nagegaan en verleent desgevraagd tot vijf jaar na de datum van vaststelling
      van de subsidie inzage in deze administratie;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel14
  - number: 14.g
    text: |-
      de werkgever doet de loonaangifte op grond van de [Wet op de loonbelasting 1964][ref1] op de voorgeschreven
      momenten;


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 14.h
    text: |-
      de werkgever meldt onverwijld en schriftelijk aan de Minister indien zich omstandigheden voordoen die van belang
      kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel14
  - number: 14.i
    text: |-
      de werkgever overlegt na afloop van de periode waarover subsidie is verleend een definitieve opgave van de
      omzetdaling in de omzetperiode; en
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel14
  - number: 14.j
    text: |-
      de werkgever werkt tot vijf jaar na de datum van vaststelling van de subsidie, onder meer door het verschaffen van
      de daartoe benodigde inlichtingen, gegevens en bescheiden, mee aan door of namens de Minister ingesteld onderzoek
      dat erop is gericht de Minister inlichtingen te verschaffen die van belang zijn voor het nemen van een besluit over
      het verstrekken van de subsidie, de vaststelling van de rechtmatigheid daarvan, of de ontwikkeling van het beleid
      van de Minister.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel14
  - number: '15.1'
    text: |-
      De werkgever aan wie subsidie wordt verleend is verplicht bij de aanvraag van de vaststelling van de subsidie
      een verklaring over de naleving van de subsidievoorwaarden, afgegeven door een accountant als bedoeld in
      [artikel 1 van de Wet op het accountantsberoep][ref1], te overleggen. Deze verklaring voldoet aan standaarden die
      door de Koninklijke Nederlandse Beroepsorganisatie van Accountants zijn vastgesteld, met inachtneming van het in de
      bijlage bij deze regeling opgenomen [Accountantsprotocol][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0045993
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0045993
  - number: '15.2'
    text: |-
      Van de verplichting om een verklaring van een accountant te overleggen is de werkgever vrijgesteld, indien
      het totale voorschot dat is verstrekt aan de natuurlijke persoon, rechtspersoon of groep als bedoeld in
      [artikel 6, negende lid][ref1], minder is dan € 125.000. In afwijking van de vorige zin geldt de vrijstelling
      van de verplichting om een verklaring van een accountant over te leggen niet indien de totale subsidie voor die
      natuurlijke persoon, rechtspersoon of groep als bedoeld in artikel 6, negende lid, wordt vastgesteld op een bedrag
      van € 125.000 of meer, of indien de werkgever heeft verzocht om toepassing van [artikel 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0045993#Artikel7
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0045993
        artikel: '7'
  - number: '15.3'
    text: |-
      De werkgever die op grond van het tweede lid is vrijgesteld van de verplichting om een verklaring van een
      accountant te overleggen, overlegt ten behoeve van de vaststelling van de subsidie het in de bijlage bij deze
      regeling opgenomen formulier met een verklaring van een deskundige derde waarmee de omzetdaling wordt bevestigd. De
      Minister wijst aan welke deskundige derden een verklaring kunnen afgeven.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel15
  - number: '15.4'
    text: |-
      Van de verplichting om een verklaring van een deskundige derde te overleggen is de werkgever vrijgesteld,
      indien het totale voorschot voor de natuurlijke persoon, rechtspersoon of groep als bedoeld in
      [artikel 6, negende lid][ref1], dat verstrekt is minder dan € 40.000 bedraagt. In afwijking van de vorige zin
      geldt de vrijstelling van de verplichting om een verklaring van een deskundige derde te overleggen niet indien de
      totale subsidie voor die natuurlijke persoon, rechtspersoon of groep als bedoeld in artikel 6, negende lid, wordt
      vastgesteld op een bedrag van € 40.000 of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel6
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '6'
  - number: '16.1'
    text: |-
      De werkgever of rechtspersoon keert over 2021 geen dividenden uit aan aandeelhouders of bonussen aan de Raad
      van Bestuur, bestuur en directie van het concern en de rechtspersoon of vennootschap, waaronder mede begrepen
      winstdelingen, en koopt geen eigen aandelen in. Met dividend worden andere winstuitkeringen aan derden
      gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel16
  - number: '16.2'
    text: |-
      De werkgever of rechtspersoon sluit voorafgaand aan de aanvraag van de vaststelling
      van de subsidie met tenminste één belanghebbende vereniging van werknemers, bedoeld in
      [artikel 3, derde lid, van de Wet melding collectief ontslag][ref1], en bij gebreke daarvan, of
      indien de werkgever minder dan 20 werknemers heeft, een andere vertegenwoordiging van werknemers,
      inhoudende de ondernemingsraad, de personeelsvertegenwoordiging of de vergadering als bedoeld in
      [artikel 35b, eerste lid, van de Wet op de ondernemingsraden][ref2], een schriftelijke overeenkomst over de wijze
      waarop invulling wordt gegeven aan het bonus en dividendbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel35b
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002747
        artikel: 35b
  - number: '16.3'
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing, indien het totale voorschot dat is verstrekt aan de
      natuurlijke persoon, rechtspersoon of groep als bedoeld in [artikel 6, negende lid][ref1], minder is dan € 125.000.
      In afwijking van de vorige zin zijn het eerste en het tweede lid wel van toepassing, indien de totale subsidie voor
      die natuurlijke persoon, rechtspersoon of groep als bedoeld in artikel 6, negende lid, wordt vastgesteld op een
      bedrag van € 125.000,- of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel6
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '6'
  - number: '16.4'
    text: |-
      Indien [artikel 7][ref1] wordt toegepast, keert de werkgever of rechtspersoon, de groep, en de moedermaatschappij,
      bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref2], over 2021 geen dividenden uit aan
      aandeelhouders of bonussen aan de Raad van Bestuur, bestuur en directie van het concern en de rechtspersoon of
      vennootschap waarop artikel 7 wordt toegepast, waaronder mede begrepen winstdelingen, en kopen de rechtspersonen
      binnen de groep geen eigen aandelen in. Met dividend worden andere winstuitkeringen aan derden gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 24a
  - number: '16.5'
    text: |-
      Indien de werkgever, rechtspersoon, natuurlijke persoon of groep verplicht is op grond van een
      vaststellingsverklaring met de Belastingdienst of een wettelijke plicht om dividend uit te keren dan blijft dit
      toegestaan voor het gedeelte waarover de plicht, bedoeld in het eerste en vierde lid, geldt.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel16
  - number: '16.6'
    text: |-
      Indien [artikel 7][ref1] wordt toegepast, beschikt de werkgever of de rechtspersoon over een voorafgaand aan de
      aanvraag van de vaststelling van de subsidie verstrekte schriftelijke verklaring van het groepshoofd, bedoeld
      in [artikel 406, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2], en de moedermaatschappij, bedoeld in
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref3], waaruit blijkt dat gehandeld zal worden overeenkomstig
      het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel406
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '406'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: 24a
  - number: '16.7'
    text: |-
      Indien de werkgever of rechtspersoon een boekjaar heeft aangewezen dat niet op een kalenderjaar is gebaseerd,
      dan geldt de verplichting in het eerste lid voor het boekjaar waarover subsidie is verleend. De vorige zin is van
      overeenkomstige toepassing op het vierde lid, met dien verstande dat dit geldt voor de groep of moedermaatschappij,
      bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
  - number: '17.1'
    text: |-
      De werkgever vraagt de vaststelling van de subsidie aan vanaf 1 juni 2022, of een eerder tijdstip, dat bekend
      gemaakt wordt via [www.uwv.nl](onbekend), tot en met 2 juni 2023. Hij dient de aanvraag in door middel van een door
      de Minister vast te stellen formulier. [Artikel 9, zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel9
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '9'
  - number: '17.2'
    text: 'Bij de aanvraag van de vaststelling wordt in ieder geval meegezonden:'
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel17
  - number: 17.2.a
    text: de definitieve gegevens over de omzetdaling in de omzetperiode, alsmede informatie waaruit dit blijkt;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel17
  - number: 17.2.b
    text: |-
      een verklaring waaruit blijkt of in de periode, bedoeld in [artikel 6, zevende lid][ref1], onderdelen of
      activiteiten zijn afgestoten;


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel6
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '6'
  - number: 17.2.c
    text: |-
      de verklaring van een accountant of een derde, bedoeld in [artikel 15, eerste en derde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel15
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '15'
  - number: 17.2.d
    text: |-
      een verklaring dat voldaan is aan [artikel 14, onderdelen a, b, en f tot en met j][ref1] en [artikel 16][ref2]
      genoemde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0045993#Artikel16
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0045993
        artikel: '16'
  - number: '17.3'
    text: |-
      De werkgever die bij de aanvraag van de vaststelling verzoekt om toepassing van [artikel 7][ref1] verklaart dat
      voldaan is aan de voorwaarden van artikel 7 en zendt een verklaring van een accountant mee waaruit dat blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel7
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '7'
  - number: '17.4'
    text: |-
      Indien een natuurlijke persoon of rechtspersoon of groep als bedoeld in [artikel 6, negende lid][ref1], verplicht
      is een verklaring van een accountant op grond van [artikel 15, eerste lid][ref2], of een verklaring van een
      deskundige derde op grond van artikel 15, derde lid, te overleggen vult de werkgever, die geen verklaring van een
      accountant, respectievelijk verklaring van een deskundige derde heeft meegezonden, op verzoek van de minister de
      aanvraag binnen 14 weken aan met de benodigde verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0045993#Artikel15
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0045993
        artikel: '15'
  - number: '17.5'
    text: |-
      De subsidie wordt vastgesteld aan de hand van de berekeningswijze, bedoeld in [artikel 8][ref1], met dien verstande
      dat de subsidie in ieder geval op nihil wordt vastgesteld, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel8
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '8'
  - number: 17.5.a
    text: de omzetdaling in de omzetperiode minder bedraagt dan 20%;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel17
  - number: 17.5.b
    text: |-
      de werkgever geen verklaring van een accountant, als bedoeld in [artikel 15, eerste lid][ref1], of een verklaring
      van een deskundige derde als bedoeld in artikel 15, derde lid, verstrekt, tenzij hij daarvan op grond van artikel
      15, tweede en vierde lid, is vrijgesteld; of


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel15
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '15'
  - number: 17.5.c
    text: |-
      de werkgever die verzocht heeft om toepassing van [artikel 7][ref1], niet voldoet aan de voorwaarden in artikel
      7; of


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel7
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '7'
  - number: 17.5.d
    text: |-
      indien in strijd is gehandeld met een verplichting, als bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel16
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '16'
  - number: '17.6'
    text: De Minister stelt de subsidie vast binnen 52 weken na ontvangst van de aanvraag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel17
  - number: '18'
    text: |-
      Onverminderd [artikel 4:95, vierde lid, van de Algemene wet bestuursrecht][ref1] kan het verstrekte voorschot
      geheel of gedeeltelijk worden teruggevorderd van de subsidieontvanger, indien dit ten onrechte of voor een te hoog
      bedrag is verstrekt of indien niet aan de verplichtingen, bedoeld in [artikel 14][ref2], [15][ref3] of [16][ref4],
      is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0045993#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0045993#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0045993#Artikel16
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0045993
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0045993
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0045993
        artikel: '16'
  - number: '19'
    text: |-
      Onverminderd [artikel 4:49 van de Algemene wet bestuursrecht][ref1] kan de Minister de subsidievaststelling
      intrekken of ten nadele van de werkgever wijzigen, indien de werkgever door zijn handelen of nalaten tijdens of
      na de periode waarover hij subsidie heeft ontvangen geacht wordt niet te hebben voldaan aan het doel van deze
      regeling, bedoeld in [artikel 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0045993#Artikel3
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0045993
        artikel: '3'
  - number: '20.1'
    text: |-
      De Minister verleent aan de Raad van Bestuur van het UWV mandaat, volmacht en machtiging om, in het kader van de
      uitvoering van deze regeling:
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel20
  - number: 20.1.a
    text: |-
      besluiten te nemen, privaatrechtelijke rechtshandelingen te verrichten en handelingen te verrichten die een
      privaatrechtelijke rechtshandeling noch een besluit zijn;
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel20
  - number: 20.1.b
    text: |-
      te beslissen op bezwaarschriften, met dien verstande dat de persoon die betrokken is bij het besluitvormingsproces
      ten aanzien van het bezwaarschrift niet ook betrokken is geweest bij het besluitvormingsproces in eerste aanleg; en
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel20
  - number: 20.1.c
    text: |-
      in rechte op te treden en tegen rechterlijke uitspraken hoger beroep of cassatie in te stellen, dan wel af te zien
      van hoger beroep of cassatie.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel20
  - number: '20.2'
    text: |-
      De Raad van Bestuur van het UWV is in het kader van de uitvoering van deze regeling bevoegd tot het verlenen
      van ondermandaat of het doorverlenen van zijn andere vertegenwoordigingsbevoegdheden aan bij het UWV werkzame
      functionarissen.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel20
  - number: '20.3'
    text: |-
      [Hoofdstuk 4 van het Organisatie-, mandaat- en volmachtbesluit SZW 2009][ref1] is van toepassing op de uitoefening
      van bevoegdheden op grond van deze regeling en tevens op de uitoefening van bevoegdheden die krachtens ondermandaat
      respectievelijk doorverlening van volmacht en machtiging worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0024956#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024956
        hoofdstuk: '4'
  - number: '20.4'
    text: |-
      Onverminderd het eerste tot en met derde lid worden door de voorzitter van de Raad van Bestuur van het UWV onder
      hem ressorterende functionarissen, werkzaam bij het UWV, aangewezen als ambtenaren, belast met het toezicht op de
      naleving van de verplichtingen, bedoeld in [artikel 14][ref1], [15][ref2] of [16][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0045993#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0045993#Artikel16
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0045993
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0045993
        artikel: '16'
  - number: '20.5'
    text: |-
      Onverminderd het eerste tot en met derde lid kunnen als ambtenaren, belast met het toezicht op de naleving van de
      verplichtingen, bedoeld in [artikel 14][ref1], [15][ref2] of [16][ref3], worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0045993#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0045993#Artikel16
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0045993
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0045993
        artikel: '16'
  - number: 20.5.a
    text: |-
      de door de inspecteur-generaal Sociale Zaken en Werkgelegenheid aangewezen onder hem ressorterende functionarissen,
      van het Ministerie van Sociale Zaken en Werkgelegenheid; en
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel20
  - number: 20.5.b
    text: |-
      de door de Directeur Dienstverlening, Samenwerkingsverbanden en Uitvoering aangewezen functionarissen werkzaam
      bij de Directie Dienstverlening, Samenwerkingsverbanden en Uitvoering van het Ministerie van Sociale Zaken en
      Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel20
  - number: '21.1'
    text: Het Rijk voorziet in de middelen tot dekking van de uitgaven verbonden aan deze regeling.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel21
  - number: '21.2'
    text: Het UWV beheert en administreert afzonderlijk de middelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel21
  - number: '21.3'
    text: |-
      In verband met het middelenbeheer wordt de rijksbijdrage, bedoeld in het eerste lid, beschouwd als middelen die
      deel uitmaken van het Algemeen Werkloosheidsfonds.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel21
  - number: '21.4'
    text: |-
      De Minister stort op de rekening-courant, bedoeld in [artikel 5.16, onder b, van de Regeling Wfsv][ref1], na
      overleg met het UWV maandelijks een periodiek voorschot op de rijksbijdrage, bedoeld in het derde lid, van:


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5'
  - number: 21.4.a
    text: |-
      de door het UWV voorafgaand aan iedere maand geraamde subsidielasten met als valutadatum de tweeëntwintigste dag
      van elke maand; en
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel21
  - number: 21.4.b
    text: |-
      de door het UWV voorafgaand aan iedere maand geraamde uitvoeringskosten met als valutadatum de vijftiende dag van
      elke maand.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel21
  - number: '21.5'
    text: |-
      De Minister kan, na overleg met het UWV, van de in het vierde lid, onder a en b, bedoelde bedragen en data
      afwijken.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel21
  - number: '22.1'
    text: |-
      Het UWV brengt aan de Minister inhoudelijk en financieel verslag uit over de uitvoering van deze regeling
      overeenkomstig [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
  - number: '22.2'
    text: |-
      In de jaarrekening, bedoeld in [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      worden de baten en lasten opgenomen, alsmede de ontvangen voorschotten, bedoeld in [artikel 21, vierde lid][ref2],
      uitgesplitst naar subsidielasten en uitvoeringskosten, met betrekking tot deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0045993#Artikel21
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0045993
        artikel: '21'
  - number: '22.3'
    text: |-
      Op de in het tweede lid bedoelde subsidielasten komen in mindering de subsidies die op grond van [artikel 18][ref1]
      zijn teruggevorderd en de bedragen die anderszins zijn terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel18
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '18'
  - number: '22.4'
    text: |-
      Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1], rekent de Minister de baten en
      lasten, alsmede de ontvangen voorschotten op grond van [artikel 21, vierde lid][ref2], met betrekking tot het
      desbetreffende kalenderjaar af, met als valutadatum 1 juni van het hierop volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0045993#Artikel21
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0045993
        artikel: '21'
  - number: '24.1'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst, met uitzondering van [artikel 23][ref1], dat in werking treedt met ingang van 1 januari 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel23
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '23'
  - number: '24.2'
    text: Deze regeling vervalt met ingang van 1 juli 2024.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel24
  - number: '24.3'
    text: |-
      In afwijking van het tweede lid blijft deze regeling, zoals die luidde op de dag voorafgaand aan de datum met
      ingang waarvan deze regeling vervalt, van toepassing op de afwikkeling van de subsidieaanvragen op grond van deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel24
  - number: '24.4'
    text: |-
      In afwijking van het tweede lid blijven de verplichtingen voor werkgevers aan wie op grond van deze regeling
      subsidie is verleend, op grond van [artikel 14, eerste lid, onderdelen f en j][ref1], gelden na 1 juli 2024
      gedurende de in die onderdelen genoemde periode.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel14
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '14'
  - number: '24.5'
    text: |-
      In afwijking van het tweede lid blijft [artikel 9, achtste lid][ref1], zoals dat luidde op de dag voorafgaand aan
      de dag waarop deze regeling vervalt, van toepassing op openbaarmakingen van het subsidiedossier na de dag waarop
      deze regeling vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0045993#Artikel9
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0045993
        artikel: '9'
  - number: '25'
    text: 'Deze regeling wordt aangehaald als: Vijfde tijdelijke noodmaatregel overbrugging voor behoud van werkgelegenheid.'
    url: https://wetten.overheid.nl/BWBR0045993/2022-12-01#Artikel25
