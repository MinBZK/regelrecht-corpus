$id: regeling_aanwijzing_nationaal_park_duinen_van_texel
regulatory_layer: WET
publication_date: '2007-08-15'
valid_from: '2002-05-01'
bwb_id: BWBR0013644
url: https://wetten.overheid.nl/BWBR0013644/2002-05-01
preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *minister:*


              Minister van Landbouw, Natuurbeheer en Visserij;



            b

              *overlegorgaan:*


              overlegorgaan als bedoeld in [artikel 3][ref1];



            c

              *nationaal park:*


              gebied zoals omschreven in het Structuurschema Groene Ruimte (Kamerstukken II 1992/93, 22880, nr. 5, blz.
      99).


      [ref1]: https://wetten.overheid.nl/BWBR0013644#Artikel3
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013644
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het gebied Duinen van Texel, zoals aangegeven op de kaart die als bijlage
      behoort bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park Duinen van Texel.
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel3
  - number: '4'
    text: |-
      Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting en het beheer van het nationaal park Duinen van
      Texel. Daartoe behoort onder meer:
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel4
  - number: 4.a
    text: het actualiseren van het beheers- en inrichtingsplan;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel4
  - number: 4.b
    text: de onderlinge afstemming van alle voor de inrichting en het beheer van belang zijnde plannen en activiteiten;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel4
  - number: 4.c
    text: |-
      het doen van voorstellen aan de minister voor de besteding van de voor het nationale park Duinen van Texel
      beschikbare middelen in het kader van een jaarlijkse voortschrijdend meerjarenprogramma met bijbehorende begroting;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel4
  - number: 4.d
    text: |-
      besteding van gelden op basis van een door de minister goed te keuren meerjarenprogramma, het opstellen van
      projectplannen, controle op de bestedingen van gelden en coördinatie van de uitvoering van projecten binnen het
      kader van beheers- en inrichtingsplan;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel4
  - number: 4.e
    text: |-
      het opstellen van een meerjarenprogramma voorlichting en educatie, ter bevordering en coördinatie van voorlichting
      en educatie met betrekking tot het nationaal park Duinen van Texel.
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel4
  - number: '5'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het beheers- en inrichtingsplan voor het nationaal park Duinen
      van Texel van 12 oktober 2000 en met inachtneming van hetgeen te dien aanzien door de minister bij brief van 14 mei
      2001, kenmerk DN 2001/1199 is gesteld.
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel5
  - number: '6'
    text: 'In het overleg hebben zitting:'
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.a
    text: één door de minister te benoemen lid, tevens voorzitter;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.b
    text: 'negen door de minister te benoemen leden, als vertegenwoordiger en op voordracht van onderscheidenlijk:'
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.b.1
    text: de provincie Noord-Holland;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.b.2
    text: de gemeente Texel;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.b.3
    text: het waterschap Hollands Kroon en het hoogheemraadschap Uitwaterende Sluizen in Hollands Noorderkwartier;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.b.4
    text: het Ministerie van Defensie;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.b.5
    text: Rijkswaterstaat;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.b.6
    text: het Staatsbosbeheer;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.b.7
    text: de Recreatiestichting Texel;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.b.8
    text: camping de Robbenjager;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.b.9
    text: Ecomare;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.c
    text: |-
      een door de minister op voordracht van de Westelijke Land- en Tuinbouw Organisatie te benoemen lid als
      vertegenwoordiger van de bij het nationaal park Duinen van Texel betrokken agrarische organisaties;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.d
    text: |-
      een door de minister te benoemen lid als vertegenwoordiger en op voordracht van de gezamenlijke dorpscommissies
      Texel;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.e
    text: |-
      een door de minister op voordracht van de Werkgroep Landschapszorg Texel te benoemen lid als vertegenwoordiger van
      de bij het nationaal park Duinen van Texel betrokken natuur- en milieuorganisaties;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.f
    text: |-
      een door de minister op voordracht van het overlegorgaan te benoemen lid als vertegenwoordiger van de bij het
      nationaal park Duinen van Texel betrokken recreatieondernemers;
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: 6.g
    text: een ambtenaar, werkzaam bij de directie Noordwest van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel6
  - number: '7.1'
    text: |-
      Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel7
  - number: '7.2'
    text: |-
      Het overlegorgaan brengt jaarlijks van zijn werkzaamheden en de daarmee samenhangende ontwikkelingen in het
      nationaal park Duinen van Texel verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel7
  - number: '8'
    text: |-
      Het secretariaat van het overlegorgaan berust bij een door de provincie Noord-Holland te benoemen ambtenaar van
      die provincie.
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel8
  - number: '9'
    text: |-
      Indien bij het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel9
  - number: '10'
    text: De regeling aanwijzing nationaal park in oprichting Duinen van Texel wordt ingetrokken.1
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel10
  - number: '11'
    text: Deze regeling treedt in werking met ingang van 1 mei 2002.
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing nationaal park Duinen van Texel.'
    url: https://wetten.overheid.nl/BWBR0013644/2002-05-01#Artikel12
