        paragraaf: '2'
        afdeling: '2'
  - number: 3.8h_bis
    text: |-
      Personen die op het tijdstip van inwerkingtreding van [artikel 2.2][ref1] werkzaam zijn bij een peuterspeelzaal,
      leggen aan de houder van een peuterspeelzaal binnen twee maanden na de inwerkingtreding van artikel 2.2 een
      verklaring over als bedoeld in [artikel 2.6, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel2
