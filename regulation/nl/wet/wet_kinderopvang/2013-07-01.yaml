  - number: 3.8i
    text: |-
      Indien er op het moment van inwerkingtreding van [afdeling 2 van hoofdstuk 2][ref1] van deze wet een oudercommissie
      is, geldt de verplichting van [artikel 2.16][ref2] voor een houder van een peuterspeelzaal die op het tijdstip
      van inwerkingtreding van afdeling 2 van hoofdstuk 2 een peuterspeelzaal in stand houdt, eerst zes maanden na dat
      tijdstip.


