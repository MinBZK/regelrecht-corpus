        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.8c.3
    text: |-
      In een geding in beroep en hoger beroep, gericht tegen een besluit als bedoeld in het tweede lid, blijft het
      Uitvoeringsinstituut werknemersverzekeringen partij en staat hoger beroep in verband met deze besluiten open.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8c
  - number: 3.8d
    text: |-
      Personen die werkzaam zijn bij een onderneming waarmee de houder een kindercentrum exploiteert en personen die
      werkzaam zijn bij een onderneming waarmee de houder een gastouderbureau exploiteert en van wie tot het tijdstip
      van inwerkingtreding van artikel I, onderdelen Ra en Rb, van de Wet tot wijziging van de Wet kinderopvang en
      kwaliteitseisen peuterspeelzalen in verband met het aanbrengen van grondslagen die hervorming van en bezuiniging
      op de kinderopvangtoeslag mogelijk maken en in verband met het incorporeren van de tegemoetkoming in de
      kosten van kinderopvang van de gemeente en het Uitvoeringsinstituut werknemersverzekeringen in verband met de
      kinderopvangtoeslag geen verklaring omtrent het gedrag, bedoeld in [artikel 1.50, derde lid][ref1], werd verlangd,
      leggen aan de houder van een kindercentrum respectievelijk van een gastouderbureau voor 1 januari 2013 een
      verklaring over als bedoeld in voornoemd artikel. De verklaring is op het moment dat zij wordt overgelegd niet
      ouder dan twee maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8d
