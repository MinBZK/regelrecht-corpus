  - number: 3.8g.3
    text: |-
      Stagiaires, vrijwilligers, uitzendkrachten en ouders als bedoeld in [artikel 1.57, eerste lid][ref1], die op de
      datum van inwerkingtreding van het onderhavige artikel werkzaam zijn bij een onderneming waarmee de houder een
      kindercentrum, een gastouderbureau of een peuterspeelzaal exploiteert, beschikken zes maanden na deze datum over
      een verklaring omtrent het gedrag die niet ouder is dan twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8g
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.8g.4
    text: |-
      Een nieuwe verklaring omtrent het gedrag, bedoeld in het derde lid, wordt door de stagiair of de uitzendkracht
      aan die houder overgelegd bij wie hij op dat moment werkzaam is. De verklaring is op het moment van overlegging
      niet ouder dan twee maanden. Bij iedere volgende houder ten behoeve waarvan de stagiair of de uitzendkracht in die
      periode van maximaal twee jaar werkzaam is, overlegt hij telkens de meest actuele verklaring omtrent het gedrag.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8g
  - number: 3.8g.5
    text: |-
      De nieuwe verklaring omtrent het gedrag, bedoeld in het derde lid, wordt door een vrijwilliger of een ouder
      als bedoeld in [artikel 1.57, eerste lid][ref1], overgelegd aan de houder. De verklaring is op het moment van
      overlegging niet ouder dan twee maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8g
    references:
      - id: ref1
