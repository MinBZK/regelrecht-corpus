      bedoeld in de [artikelen 1.50, derde lid][ref3], [1.56, derde lid][ref4], en [2.6, derde lid][ref5], en andere
      personen van 18 jaar of ouder als bedoeld in [artikel 1.56b, derde lid][ref6], die beschikken over een verklaring
