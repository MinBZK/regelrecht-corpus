      van Volksgezondheid, Welzijn en Sport een jaar na de inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      ____________________________ en vervolgens telkens als onderdeel van het verslag, bedoeld in het tweede lid, aan de
      Staten-Generaal een verslag uit over de doeltreffendheid en de effecten in de praktijk van de onderdelen van deze
