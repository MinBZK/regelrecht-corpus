preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het wenselijk is om regels te stellen met betrekking tot
    tegemoetkomingen in de kosten van kinderopvang en om de kwaliteit van kinderopvang te waarborgen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In dit hoofdstuk en de op dit hoofdstuk berustende bepalingen wordt verstaan onder: - *beroepskracht:* 1°. de
      persoon van 18 jaar of ouder die werkzaam is bij een kindercentrum, bezoldigd is en belast is met de verzorging,
      de opvoeding en het bijdragen aan de ontwikkeling van kinderen; 2°. de persoon van 18 jaar of ouder die werkzaam is
      bij een gastouderbureau, bezoldigd is en belast is met het tot stand brengen en begeleiden van gastouderopvang;
        - *beroepskracht in opleiding:* degene die de beroepsbegeleidende leerweg volgt, bedoeld in de
      [Wet educatie beroepsonderwijs][ref1], beschikt over een arbeidsovereenkomst met de houder van een kindercentrum
      of van een gastouderbureau, en ten behoeve van het praktijkdeel van de opleiding belast is met de verzorging, de
      opvoeding en het bijdragen aan de ontwikkeling van kinderen bij een kindercentrum of met het tot stand brengen en
      begeleiden van gastouderopvang bij een gastouderbureau;
        - *beroepskracht voorschoolse educatie:* degene die als beroepskracht werkzaam is en belast is met voorschoolse
      educatie en die voldoet aan de opleidingseisen en scholingseisen, bedoeld in [artikel 1.50b, onderdeel a][ref2];
        - *college:* college van burgemeester en wethouders van de gemeente waar een kindercentrum, gastouderbureau of
      voorziening voor gastouderopvang is gevestigd of zal worden gevestigd;
        - *continentaal plat:* de exclusieve economische zone van het Koninkrijk, bedoeld in
      [artikel 1 van de Rijkswet instelling exclusieve economische zone][ref3], voor zover deze grenst aan de
      territoriale zee van Nederland;
        - *gastouder:* degene van 18 jaar of ouder die gastouderopvang biedt, met uitzondering van degene: a. van wie een
      of meer kinderen onderworpen zijn aan ondertoezichtstelling of voorlopige ondertoezichtstelling als bedoeld in
      [artikel 254][ref4], onderscheidenlijk [255 van Boek 1 van het Burgerlijk Wetboek][ref5], die met betrekking tot
      een of meer van zijn kinderen is ontheven uit het ouderlijk gezag als bedoeld in artikel 266 van Boek 1 van het
      Burgerlijk Wetboek of die met betrekking tot een of meer van zijn kinderen is ontzet van het gezag als bedoeld
      in artikel 269 van Boek 1 van het Burgerlijk Wetboek, b. die op hetzelfde woonadres staat ingeschreven in de
      gemeentelijke basisadministratie persoonsgegevens als de ouder of diens partner van het kind aan wie opvang wordt
      geboden, of c. die ten behoeve van de opvang van kinderen in enigerlei vorm personeel in dienst heeft;
        - *gastouderbureau:* een organisatie die gastouderopvang tot stand brengt en begeleidt en door tussenkomst van wie
      de betaling van ouders aan gastouders geschiedt;
        - *gastouderopvang:* kinderopvang: a. die plaatsvindt door tussenkomst van een geregistreerd gastouderbureau;
      b. die plaatsvindt in een gezinssituatie door een ander dan degene die als ouder op grond van
      [artikel 1.5, eerste lid][ref6], aanspraak kan maken op een kinderopvangtoeslag of diens partner; c. waarbij de
      opvang plaatsvindt: 1°. op het woonadres van de gastouder, met dien verstande dat op dit adres niet meer dan een
      voorziening voor gastouderopvang is gevestigd, 2°. op het woonadres van een van de ouders van de kinderen voor wie
      de gastouder opvang biedt, dan wel 3°. op twee of meer van deze woonadressen; en d. bestaande uit de gelijktijdige
      opvang van ten hoogste zes kinderen, waaronder begrepen de bloedverwant of aanverwant in de neergaande lijn van
      de gastouder of zijn partner, die in belangrijke mate wordt onderhouden door de gastouder of zijn partner en op
      hetzelfde woonadres als de gastouder staat ingeschreven in de gemeentelijke basisadministratie persoonsgegevens en
      de leeftijd van tien jaar nog niet heeft bereikt. Met een bloedverwant of aanverwant in de neergaande lijn wordt
      gelijkgesteld een pleegkind dat de leeftijd van tien jaar nog niet heeft bereikt;
        - *geregistreerd gastouderbureau:* een in het register kinderopvang ingeschreven gastouderbureau als bedoeld in
      [artikel 1.46, tweede lid][ref7];
        - *geregistreerd kindercentrum:* een in het register kinderopvang ingeschreven kindercentrum als bedoeld in
      [artikel 1.46, tweede lid][ref8];
        - *geregistreerde voorziening voor gastouderopvang:* een in het register kinderopvang ingeschreven voorziening voor
      gastouderopvang als bedoeld in [artikel 1.46, tweede lid][ref9];
        - *GGD:* een gemeentelijke gezondheidsdienst als bedoeld in [artikel 14 van de Wet publieke gezondheid][ref10];
        - *houder:* a. degene aan wie een onderneming als bedoeld in de [Handelsregisterwet 2007][ref11] toebehoort en die
      met die onderneming een kindercentrum of een gastouderbureau exploiteert; b. de gastouder die een voorziening voor
      gastouderopvang exploiteert.
        - *kindercentrum:* een voorziening waar kinderopvang plaatsvindt, anders dan gastouderopvang;
        - *kinderopvang:* het bedrijfsmatig of anders dan om niet verzorgen, opvoeden en bijdragen aan de ontwikkeling van
      kinderen tot de eerste dag van de maand waarop het voortgezet onderwijs voor die kinderen begint;
        - *kinderopvangtoeslag:* een tegemoetkoming van het Rijk als bedoeld in
      [artikel 2, eerste lid, onder h, van de Algemene wet inkomensafhankelijke regelingen][ref12] in de kosten van
      kinderopvang;
        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *ouder:* de bloed- of aanverwant in opgaande lijn of de pleegouder van een kind op wie de kinderopvang betrekking
      heeft, met dien verstande dat bij de beoordeling of sprake is van pleegouderschap een subsidie op grond van de
      [Wet op de jeugdzorg][ref13] buiten beschouwing blijft;
        - *oudercommissie:* de commissie, bedoeld in [artikel 1.58][ref14];
        - *overheidswerkgever:* de werkgever, bedoeld in
      [artikel 1, onderdeel r, van de Wet financiering sociale verzekeringen][ref15];
        - *register kinderopvang:* het register kinderopvang, bedoeld in [artikel 1.47a][ref16];
        - *stagiair:* degene die een opleiding volgt, waarvan het praktijkdeel een beperkt deel van de totale studieduur
      is, belast is met werkzaamheden bij de houder ten behoeve van het praktijkdeel van de opleiding en geen
      beroepskracht in opleiding is;
        - *Uitvoeringsinstituut werknemersverzekeringen:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref17];
        - *uitvoeringskosten:* de kosten die door een gastouderbureau in rekening worden gebracht bij de ouder of de
      gastouder, niet zijnde de kosten van gastouderopvang;
        - *uitzendkracht:* degene van 18 jaar of ouder die werkzaam is voor een uitzendbureau en is uitgezonden voor
      werkzaamheden bij een kindercentrum of een gastouderbureau;
        - *verklaring omtrent het gedrag:* een verklaring omtrent het gedrag natuurlijke personen of een verklaring omtrent
      het gedrag rechtspersonen;
        - *verklaring omtrent het gedrag natuurlijke personen:* een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref18], ten behoeve van een natuurlijk persoon;
        - *verklaring omtrent het gedrag rechtspersonen:* een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref19], ten behoeve van een rechtspersoon;
        - *voorschoolse educatie:* uitvoering van een door het college gesubsidieerd programma dat gericht is op het
      verbeteren van de voorwaarden voor het met succes instromen in het basisonderwijs voor kinderen die nog niet tot
      een school kunnen worden toegelaten;
        - *voorziening voor gastouderopvang:* gastouderopvang door een specifieke gastouder op een specifiek woonadres;
        - *vrijwilliger:* de persoon van 18 jaar of ouder die structureel al dan niet tegen een vrijwilligersvergoeding op
      regelmatige, niet incidentele basis werkzaam is in de kinderopvang en is belast met de verzorging, de opvoeding of
      het bijdragen aan de ontwikkeling van kinderen en geen ouder is als bedoeld in [artikel 1.57, eerste lid][ref20].


