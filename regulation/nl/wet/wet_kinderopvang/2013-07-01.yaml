  - number: '3.8'
    text: |-
      Ten aanzien van voor het tijdstip van inwerkingtreding van de Wet kinderopvang door het Rijk en gemeenten op grond
      van de [Welzijnswet 1994][ref1] verleende subsidies en uitkeringen aan kinderopvang, voorzover dat kinderopvang
      betreft waarop deze wet van toepassing is, blijft het bepaalde bij of krachtens de [Welzijnswet 1994][ref2],
      zoals dat laatstelijk voor 1 januari 2005 luidde, van toepassing op de financiële verantwoording, vaststelling en
      uitbetaling van die subsidies en uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0006705
      [ref2]: https://wetten.overheid.nl/BWBR0006705
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0006705
      - id: ref2
        bwb_id: BWBR0006705
  - number: 3.8a
    text: |-
      Voor een berekeningsjaar dat voorafgaat aan 2013 blijft deze wet, zoals die luidde op 31 december
      van dat berekeningsjaar, van toepassing op de kinderopvangtoeslag en de tegemoetkoming, bedoeld in
      [artikel 1.5, eerste lid][ref1], zoals dat luidde op 31 december 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 3.8b.1
    text: |-
      Het college blijft bevoegd een beslissing te nemen op een aanvraag voor een tegemoetkoming als bedoeld in
      [artikel 1.22][ref1], zoals dat luidde op 31 december 2012, voor een berekeningsjaar dat voorafgaat aan 2013, voor
      zover nog niet onherroepelijk op deze aanvraag is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.8b.2
    text: |-
      Het college dat een besluit in verband met een tegemoetkoming als bedoeld in [artikel 1.22][ref1], zoals dat luidde
      op 31 december 2012, voor een berekeningsjaar dat voorafgaat aan 2013 heeft genomen waartegen een bezwaarschrift is
      ingediend dan wel nog kan worden ingediend, blijft bevoegd op het bezwaar te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.8b.3
    text: |-
      In een geding in beroep en hoger beroep, gericht tegen een besluit als bedoeld in het tweede lid, blijft het
      college partij en staat hoger beroep in verband met deze besluiten open.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8b
  - number: 3.8c.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen blijft bevoegd een beslissing te nemen op een aanvraag voor een
      tegemoetkoming als bedoeld in [artikel 1.29][ref1], zoals dat luidde op 31 december 2012, voor een berekeningsjaar
      dat voorafgaat aan 2013, voor zover nog niet onherroepelijk op deze aanvraag is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8c
    references:
