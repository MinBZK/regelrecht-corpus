  - number: '3.9'
    text: De Regeling kinderopvang en buitenschoolse opvang alleenstaande ouders wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.9
  - number: 3.10.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, het college van burgemeester en wethouders en de gemeenteraad
      verstrekken aan Onze Minister de inlichtingen die hij voor de statistiek, de informatievoorziening en de
      beleidsvorming met betrekking tot deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.10
  - number: 3.10.2
    text: |-
      Onze Minister stelt regels omtrent de aard van de inlichtingen, bedoeld in het eerste lid, en de wijze waarop deze
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.10
  - number: 3.10.3
    text: De inlichtingen, bedoeld in het eerste lid, worden kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.10
  - number: '3.11'
    text: |-
      De voordracht voor een krachtens de [artikelen 1.7, tweede tot en met vierde lid][ref1], [1.8][ref2],
      [1.50, tweede lid][ref3], [1.56, tweede lid][ref4], en [1.56b, tweede lid][ref5], [1.87][ref6], en [2.29][ref7]
      vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide
      kamers der Staten-Generaal is overgelegd.


