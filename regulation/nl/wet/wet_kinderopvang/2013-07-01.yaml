        afdeling: '3'
  - number: 3.8e
    text: |-
      Personen die werkzaam zijn bij een onderneming waarmee de houder een peuterspeelzaal exploiteert en van wie tot
      het tijdstip van inwerkingtreding van artikel I, onderdeel Ub, van de Wet tot wijziging van de Wet kinderopvang
      en kwaliteitseisen peuterspeelzalen in verband met het aanbrengen van grondslagen die hervorming van en
      bezuiniging op de kinderopvangtoeslag mogelijk maken en in verband met het incorporeren van de tegemoetkoming in
      de kosten van kinderopvang van de gemeente en het Uitvoeringsinstituut werknemersverzekeringen in verband met de
      kinderopvangtoeslag geen verklaring omtrent het gedrag, bedoeld in [artikel 2.6, derde lid][ref1], werd verlangd,
      leggen aan de houder van een kindercentrum voor 1 januari 2013 een verklaring over als bedoeld in voornoemd
      artikel. De verklaring is op het moment dat zij wordt overgelegd niet ouder dan twee maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8e
