        afdeling: '6'
  - number: 2.1.1
    text: |-
      In dit hoofdstuk en de op dit hoofdstuk berustende bepalingen wordt verstaan onder: - *beroepskracht:* de persoon
      van 18 jaar of ouder die werkzaam is bij een peuterspeelzaal, bezoldigd is en belast is met de verzorging, de
      opvoeding en het bijdragen aan de ontwikkeling van kinderen bij een peuterspeelzaal;
        - *beroepskracht in opleiding:* degene die de beroepsbegeleidende leerweg volgt, bedoeld in de
      [Wet educatie beroepsonderwijs][ref1], beschikt over een arbeidsovereenkomst met de houder en ten behoeve van het
      praktijkdeel van de opleiding belast is met de verzorging, de opvoeding en het bijdragen aan de ontwikkeling van
      kinderen;
        - *beroepskracht voorschoolse educatie:* degene die als beroepskracht werkzaam is en belast is met voorschoolse
      educatie en die voldoet aan de opleidingseisen en scholingseisen, bedoeld in [artikel 2.8, onderdeel a][ref2];
        - *college:* college van burgemeester en wethouders van de gemeente waar een peuterspeelzaal is gevestigd of zal
      worden gevestigd;
        - *GGD:* gemeentelijke gezondheidsdienst als bedoeld in [artikel 14 van de Wet publieke gezondheid][ref3];
        - *geregistreerde peuterspeelzaal:* een in het register peuterspeelzaalwerk ingeschreven peuterspeelzaal als
      bedoeld in [artikel 2.3, tweede lid][ref4];
        - *houder:* degene aan wie een onderneming als bedoeld in de [Handelsregisterwet 2007][ref5] toebehoort en die met
      die onderneming een peuterspeelzaal exploiteert;
        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *ouder:* bloed- of aanverwant in opgaande lijn of de pleegouder van een kind op wie het peuterspeelzaalwerk
      betrekking heeft, met dien verstande dat bij de beoordeling of sprake is van pleegouderschap een subsidie op grond
      van de [Wet op de jeugdzorg][ref6] buiten beschouwing blijft;
        - *oudercommissie:* commissie als bedoeld in [artikel 2.15][ref7];
        - *peuterspeelzaalwerk:* de verzorging, de opvoeding en het bijdragen aan de ontwikkeling van kinderen uitsluitend
      bestemd voor kinderen vanaf de leeftijd van twee jaar tot het tijdstip waarop die kinderen kunnen deelnemen aan
      het basisonderwijs;
        - *peuterspeelzaal:* voorziening waar peuterspeelzaalwerk plaatsvindt, anders dan gastouderopvang of kinderopvang
      in een kindercentrum;
        - *register peuterspeelzaalwerk:* het register peuterspeelzaalwerk, bedoeld in [artikel 2.3][ref8];
        - *stagiair:* degene die een opleiding volgt, waarvan het praktijkdeel een beperkt deel van de totale studieduur
      is, belast is met werkzaamheden bij de houder ten behoeve van het praktijkdeel van de opleiding en geen
      beroepskracht in opleiding is;
        - *uitzendkracht:* degene van 18 jaar of ouder die werkzaam is voor een uitzendbureau en is uitgezonden voor
      werkzaamheden bij een peuterspeelzaal;
        - *verklaring omtrent het gedrag:* een verklaring omtrent het gedrag natuurlijke personen of een verklaring omtrent
      het gedrag rechtspersonen;
        - *verklaring omtrent het gedrag natuurlijke personen:* een verklaring omtrent het gedrag, afgegeven volgens de Wet
      justitiële en strafvorderlijke gegevens, ten behoeve van een natuurlijk persoon;
        - *verklaring omtrent het gedrag rechtspersonen:* een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref9], ten behoeve van een rechtspersoon;
        - *voorschoolse educatie:* uitvoering van een door het college gesubsidieerd programma dat gericht is op het
      verbeteren van de voorwaarden voor het met succes instromen in het basisonderwijs voor kinderen die nog niet tot
      een school kunnen worden toegelaten;
        - *vrijwilliger:*de persoon van 18 jaar of ouder die structureel al dan niet tegen een vrijwilligersvergoeding
      op regelmatige, niet incidentele basis werkzaam is bij een peuterspeelzaal en is belast met de verzorging, de
      opvoeding of het bijdragen aan de ontwikkeling van kinderen.


