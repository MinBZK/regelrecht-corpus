    text: |-
      waarvan de datum van afgifte ligt voor 1 juli 2011 overleggen uiterlijk zes maanden na inwerkingtreding van het
      onderhavige artikel een nieuwe verklaring omtrent het gedrag die op het moment van overlegging niet ouder is dan
      twee maanden;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8g
  - number: 3.8g.1.b
    text: |-
      waarvan de datum van afgifte ligt in de periode die loopt van 1 juli 2011 tot en met 28 februari 2013 overleggen
      uiterlijk twee jaar na de datum van afgifte van die verklaring een nieuwe verklaring omtrent het gedrag die op het
      moment van overlegging niet ouder is dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8g
  - number: 3.8g.2
    text: 'De nieuwe verklaring omtrent het gedrag, bedoeld in het eerste lid, wordt door:'
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8g
  - number: 3.8g.2.a
    text: |-
      de houders, bedoeld in de [artikelen 1.1][ref1] en [2.1][ref2] aan het college overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8g
