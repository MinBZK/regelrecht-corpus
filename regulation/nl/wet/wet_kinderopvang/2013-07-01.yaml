      [2.6, derde lid][ref2], en andere personen van 18 jaar of ouder als bedoeld in [artikel 1.56b, derde lid][ref3],
      aan de houder overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
