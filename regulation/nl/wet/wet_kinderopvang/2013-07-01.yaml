  - number: 1.4.2
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven met betrekking tot de verstrekking.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.4
  - number: 1.5.1
    text: |-
      Een ouder heeft aanspraak op een kinderopvangtoeslag in de door hem of zijn partner te betalen kosten, indien het
      betreft:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.5
  - number: 1.5.1.a
    text: kinderopvang in een geregistreerd kindercentrum; of
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.5
  - number: 1.5.1.b
    text: |-
      gastouderopvang in een geregistreerde voorziening voor gastouderopvang die plaatsvindt door tussenkomst van een
      geregistreerd gastouderbureau.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.5
  - number: 1.5.2
    text: |-
      Een ouder en diens partner die tevens ouder is worden voor de toepassing van deze wet geacht gezamenlijk één
      aanspraak te hebben.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.5
  - number: 1.5.3
    text: |-
      Indien een gastouderbureau uit het register kinderopvang, bedoeld in [artikel 1.47a][ref1], wordt verwijderd, geldt
      de in het eerste lid, onderdeel b, bedoelde voorwaarde van registratie van het gastouderbureau niet, gedurende
      een bij algemene maatregel van bestuur te bepalen uitlooptermijn waarbinnen de voorziening voor gastouderopvang op
      grond van artikel 1.47a, tweede lid, onderdeel c, in het register kinderopvang ingeschreven blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.5
