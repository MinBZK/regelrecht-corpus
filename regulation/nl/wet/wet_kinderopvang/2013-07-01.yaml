        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.8h
    text: |-
      In afwijking van [artikel 1.1a, vijfde lid][ref1], zoals dat luidde op 31 december 2012, is voor de
      berekeningsjaren 2012 en 2013 [artikel 15, eerste lid, van de Algemene wet inkomensafhankelijke regelingen][ref2]
      van toepassing op een aanvraag om kinderopvangtoeslag als bedoeld in [artikel 1.5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8h
    references:
