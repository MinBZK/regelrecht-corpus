  - number: 3.7.2
    text: |-
      Op de financiering van kinderopvang, bedoeld in het eerste lid, blijven de
      [artikelen 74 van de Werkloosheidswet][ref1] onderscheidenlijk [22a][ref2], [34 tot en met 37][ref3],
      [45 tot en met 47][ref4] en [53 van de Wet op de (re)integratie arbeidsgehandicapten][ref5], zoals deze artikelen
      luidden tot het tijdstip van inwerkingtreding van deze wet, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel22a
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel34
