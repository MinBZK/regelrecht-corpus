  - number: 2.1.2
    text: |-
      Waar in het bepaalde bij of krachtens dit hoofdstuk wordt gesproken over verklaring omtrent het gedrag wordt een
      verklaring omtrent het gedrag natuurlijke personen bedoeld, indien de betrokkene een natuurlijk persoon is en een
      verklaring omtrent het gedrag rechtspersonen, indien de betrokkene een rechtspersoon is.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.1
  - number: 2.2.1
    text: Degene die voornemens is een peuterspeelzaal in exploitatie te nemen, doet daarvan een aanvraag bij het college.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Een peuterspeelzaal wordt niet in exploitatie genomen voordat een onderzoek als bedoeld in
      [artikel 2.20, eerste lid][ref1], heeft plaatsgevonden waaruit blijkt dat de exploitatie redelijkerwijs
      zal plaatsvinden in overeenstemming met het bepaalde bij of krachtens de [paragrafen 2][ref2] en
      [3 van deze afdeling][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2.2.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven over de gegevens die worden verstrekt
      bij de aanvraag, bedoeld in het eerste lid, en over de wijze van verstrekking van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Uiterlijk tien weken na de ontvangst van de aanvraag, bedoeld in [artikel 2.2, eerste lid][ref1], besluit het
      college op de aanvraag. Indien uit het onderzoek, bedoeld in [artikel 2.20, eerste lid][ref2], is gebleken
      dat de exploitatie redelijkerwijs zal plaatsvinden in overeenstemming met het bepaalde bij of krachtens de
      [paragrafen 2][ref3] en [3][ref4] van deze afdeling en anderszins niet is gebleken van feiten en omstandigheden
      die op het tegendeel duiden, wordt positief op de aanvraag beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2.3.2
    text: |-
      In de beschikking waarin positief op de aanvraag, bedoeld in het eerste lid, wordt beslist, bepaalt het college de
      datum van ingang van de exploitatie. Deze datum ligt niet voor de datum van de bekendmaking van de beschikking. Het
      college draagt zorg voor inschrijving van de peuterspeelzaal in het register peuterspeelzaalwerk waarbij de datum
      van ingang van de exploitatie als startdatum van de registratie wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Het college deelt de houder schriftelijk mee dat inschrijving van de peuterspeelzaal in het register
      peuterspeelzaalwerk heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Bij een inschrijving als bedoeld in het tweede lid, doet het college opgave van de gegevens die ingevolge
      [artikel 2.2, derde lid][ref1], zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 2.4.1
    text: |-
      De houder doet van een wijziging in de gegevens die daartoe bij of krachtens algemene maatregel van bestuur worden
      aangewezen onverwijld mededeling aan het college, nadat deze wijziging hem bekend is geworden. Hierbij verzoekt de
      houder de gegevens te wijzigen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Het college kan naar aanleiding van het verzoek, bedoeld in het eerste lid, besluiten tot wijziging van de gegevens
      en verwerkt dit zo nodig in het register peuterspeelzaalwerk.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4
  - number: 2.4.3
    text: |-
      De houder kan het college verzoeken de inschrijving van een peuterspeelzaal uit het register peuterspeelzaalwerk
      te verwijderen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4
  - number: 2.4.4
    text: |-
      Het college kan naar aanleiding van een verzoek als bedoeld in het derde lid besluiten tot verwijdering van de
      inschrijving en verwerkt dit in het register peuterspeelzaalwerk.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4
  - number: 2.4.5
    text: |-
      Het college heft geen recht als bedoeld in [artikel 229 van de Gemeentewet][ref1] in verband met een verzoek als
      bedoeld in het eerste en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
  - number: 2.4.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van het eerste tot en met het vierde lid
      nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4
  - number: 2.4a.1
    text: |-
      Onze Minister draagt zorg voor de inrichting van een register peuterspeelzaalwerk ten behoeve van de waarborging
      van de kwaliteit en de rechtszekerheid van het peuterspeelzaalwerk alsmede ten behoeve van het toezicht op en de
      handhaving van de bij of krachtens deze [afdeling][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        afdeling: '2'
  - number: 2.4a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent het register
      peuterspeelzaalwerk. Deze regels hebben in elk geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4a
  - number: 2.4a.2.a
    text: de vorm van het register;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4a
  - number: 2.4a.2.b
    text: de in het register op te nemen gegevens;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4a
  - number: 2.4a.2.c
    text: de vastlegging van gegevens in het register en de verwijdering van gegevens daaruit;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4a
  - number: 2.4a.2.d
    text: de wijze waarop verbetering van onjuistheden in het register plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4a
  - number: 2.4a.2.e
    text: de verstrekking van gegevens;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4a
  - number: 2.4a.2.f
    text: de openbaarheid van gegevens;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4a
  - number: 2.4a.2.g
    text: de verantwoordelijkheden van degenen die gegevens aanleveren ten behoeve van het register.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.4a
  - number: '2.5'
    text: |-
      Een houder biedt verantwoord peuterspeelzaalwerk aan waaronder wordt verstaan peuterspeelzaalwerk dat bijdraagt aan
      en stimuleert tot een goede en gezonde ontwikkeling van het kind in een veilige en gezonde omgeving.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.5
  - number: 2.6.1
    text: |-
      De houder organiseert het peuterspeelzaalwerk op zodanige wijze, voorziet de peuterspeelzaal zowel kwalitatief,
      als kwantitatief zodanig van personeel en materieel, draagt zorg voor een zodanige verantwoordelijkheidstoedeling,
      en voert een zodanig pedagogisch beleid dat een en ander redelijkerwijs leidt tot verantwoord peuterspeelzaalwerk.
      Ter uitvoering van de eerste volzin besteedt de houder in ieder geval aantoonbaar aandacht aan het aantal
      beroepskrachten en vrijwilligers in relatie tot het aantal kinderen per leeftijdscategorie, de groepsgrootte, de
      opleidingseisen van de beroepskrachten en de voorwaarden waaronder en de mate waarin beroepskrachten in opleiding
      kunnen worden belast met de opvoeding en verzorging van kinderen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de kwaliteit van het
      peuterspeelzaalwerk bij een peuterspeelzaal. Deze regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.2.a
    text: de veiligheid en de gezondheid;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.2.b
    text: de opleidingseisen waaraan de beroepskrachten voldoen;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.2.c
    text: de inzet van beroepskrachten in opleiding;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.2.d
    text: het aantal beroepskrachten en vrijwilligers in relatie tot het aantal kinderen per leeftijdscategorie;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.2.e
    text: de groepsgrootte;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.2.f
    text: het pedagogisch beleid en de pedagogische praktijk.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.3
    text: |-
      De houder van een peuterspeelzaal en de personen die werkzaam zijn bij een onderneming waarmee de houder een
      peuterspeelzaal exploiteert, zijn in het bezit van een verklaring omtrent het gedrag.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.4
    text: |-
      Een verklaring omtrent het gedrag van een persoon werkzaam bij een onderneming als bedoeld in het derde lid wordt
      aan de houder overgelegd, voordat deze persoon zijn werkzaamheden aanvangt. Een verklaring omtrent het gedrag is
      bij aanvang van de werkzaamheden niet ouder dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.5
    text: |-
      De houder overlegt bij het indienen van de aanvraag, bedoeld in [artikel 2.2, eerste lid][ref1], een verklaring
      omtrent het gedrag aan het college. De verklaring omtrent het gedrag is op het moment van de indiening van de
      aanvraag niet ouder dan twee maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 2.6.6
    text: |-
      Indien de toezichthouder redelijkerwijs mag vermoeden dat de houder niet langer voldoet aan de eisen voor het
      afgeven van een verklaring omtrent het gedrag, verlangt de toezichthouder dat deze houder opnieuw een verklaring
      omtrent het gedrag overlegt binnen een door de toezichthouder vast te stellen termijn. Een verklaring omtrent het
      gedrag is op het moment van overlegging niet ouder dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.7
    text: |-
      Indien de houder redelijkerwijs mag vermoeden dat een persoon werkzaam bij een onderneming als bedoeld in het derde
      lid niet langer voldoet aan de eisen voor het afgeven van een verklaring omtrent het gedrag, verlangt de houder
      al dan niet op verzoek van de toezichthouder, dat die persoon opnieuw een verklaring omtrent het gedrag overlegt
      binnen een door de houder dan wel de toezichthouder vast te stellen termijn. Een verklaring omtrent het gedrag is
      op het moment van overlegging niet ouder dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.8
    text: |-
      De verplichting van het vierde lid geldt voor een persoon die als stagiair of uitzendkracht werkzaam is de eerste
      maal voordat hij de werkzaamheden aanvangt en vervolgens uiterlijk iedere twee jaar, te rekenen vanaf de dag van
      de afgifte van de meest actuele verklaring omtrent het gedrag. Bij iedere volgende houder ten behoeve waarvan de
      stagiaire of de uitzendkracht in die periode van maximaal twee jaar werkzaam is, overlegt hij telkens de meest
      actuele verklaring omtrent het gedrag.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.9
    text: |-
      De verplichting van het vierde lid geldt voor een persoon die als vrijwilliger werkzaam is de eerste maal voordat
      hij de werkzaamheden aanvangt en vervolgens uiterlijk iedere twee jaar, te rekenen vanaf de dag van afgifte van de
      meest actuele verklaring omtrent het gedrag.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.10
    text: |-
      Indien de toezichthouder redelijkerwijs mag vermoeden dat een persoon van 12 jaar of ouder die ten tijde van
      het peuterspeelzaalwerk aanwezig is in de peuterspeelzaal niet zou voldoen aan de eisen voor het afgeven van een
      verklaring omtrent het gedrag, verlangt de toezichthouder dat de houder van de peuterspeelzaal een verklaring
      omtrent het gedrag overlegt met betrekking tot die persoon binnen een door de toezichthouder vast te stellen
      termijn. Binnen die termijn is die persoon in het bezit van een verklaring omtrent het gedrag en legt de houder die
      verklaring omtrent het gedrag over aan de toezichthouder. Een verklaring omtrent het gedrag is op het moment van
      overlegging niet ouder dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: 2.6.11
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten behoeve van een goede
      uitvoering van het derde tot en met het negende lid.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.6
  - number: '2.7'
    text: |-
      De houder van een peuterspeelzaal neemt deel aan het overleg tussen het college en de bevoegde gezagsorganen van
      scholen over het onderwijsachterstandenbeleid, bedoeld in [artikel 167a van de Wet op het primair onderwijs][ref1],
      en werkt mee aan de totstandkoming van de samenwerkingsafspraken en de nakoming ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel167a
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 167a
  - number: '2.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de kwaliteit van voorschoolse
      educatie, indien dit wordt gesubsidieerd door het college. Deze regels hebben in elk geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.8
  - number: 2.8.a
    text: de opleidingseisen en de scholingseisen waaraan de beroepskrachten voorschoolse educatie voldoen;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.8
  - number: 2.8.b
    text: het aantal beroepskrachten voorschoolse educatie in relatie tot het aantal kinderen;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.8
  - number: 2.8.c
    text: de groepsgrootte; en
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.8
  - number: 2.8.d
    text: de minimumomvang van de voorschoolse educatie.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.8
  - number: '2.9'
    text: |-
      De houder voert een beleid dat ertoe leidt dat de veiligheid en de gezondheid van de op te vangen kinderen in elke
      door hem in stand gehouden peuterspeelzaal zoveel mogelijk zijn gewaarborgd. De houder legt, voor zover hierin niet
      wordt voorzien bij of krachtens andere wet- en regelgeving, in een risico-inventarisatie schriftelijk vast welke
      risico’s het peuterspeelzaalwerk met zich brengt.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.9
  - number: 2.9a.1
    text: |-
      De houder van een peuterspeelzaal stelt voor het personeel een meldcode vast waarin stapsgewijs wordt aangegeven
      hoe met signalen van huiselijk geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan bijdraagt
      dat zo snel en adequaat mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.9a
  - number: 2.9a.2
    text: |-
      Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1, eerste lid, van de Wet maatschappelijke ondersteuning][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.9a
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '1'
  - number: 2.9a.3
    text: |-
      Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in
      [artikel 1 van de Wet op de jeugdzorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.9a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 2.9a.4
    text: De houder van een peuterspeelzaal bevordert de kennis en het gebruik van de meldcode.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.9a
  - number: 2.9a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.9a
  - number: 2.9b.1
    text: |-
      Indien de houder op enigerlei wijze bekend is geworden dat een bij zijn onderneming werkzaam
      persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden als
      bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] of mishandeling als bedoeld in
      [Titel XX van het Wetboek van Strafrecht][ref2] jegens een kind van een ouder die gebruik maakt van het door
      hem geboden peuterspeelzaalwerk, treedt de houder onverwijld in overleg met een door Onze Minister aan te wijzen
      deskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.9b
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001854
  - number: 2.9b.2
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat sprake is van een redelijk
      vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf als bedoeld in het eerste
      lid, doet de houder onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref1] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt de houder de deskundige, bedoeld in het eerste
      lid, hiervan onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.9b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 2.9b.3
    text: |-
      Indien een bij de onderneming van de houder werkzaam persoon op enigerlei wijze bekend is geworden dat een ander
      ten behoeve van de onderneming van die houder werkzaam persoon zich mogelijk schuldig maakt of heeft gemaakt aan
      een misdrijf als bedoeld in het eerste lid jegens een kind van een ouder die gebruik maakt van het door de houder
      geboden peuterspeelzaalwerk, stelt hij de houder daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.9b
  - number: 2.9b.4
    text: |-
      Indien toepassing van het derde lid er toe zou leiden dat degene die van het vermoeden op de hoogte moet worden
      gesteld dezelfde persoon is als degene die zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als
      bedoeld in het eerste lid, is [artikel 2.9c, eerste en tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.9b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.9b.5
    text: De houder bevordert de kennis en het gebruik van de handelwijze, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.9b
  - number: 2.9c.1
    text: |-
      Indien een bij de onderneming van de houder werkzaam persoon op enigerlei wijze bekend is geworden dat de
      natuurlijke persoon die tevens houder is zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf
      tegen de zeden als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] of mishandeling als bedoeld in
      [Titel XX van het Wetboek van Strafrecht][ref2] jegens een kind van een ouder die gebruik maakt van het door de
      houder geboden peuterspeelzaalwerk kan deze bij de onderneming van de houder werkzame persoon in overleg treden met
      een deskundige als bedoeld in [artikel 2.9b, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001854
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.9c
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001854
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.9c.2
    text: |-
      Indien moet worden geconcludeerd dat sprake is van een redelijk vermoeden dat de houder zich schuldig heeft
      gemaakt aan een misdrijf als bedoeld in het eerste lid, doet de persoon die werkzaam is bij de onderneming
      van de houder onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref1] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.9c
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 2.9c.3
    text: De houder bevordert de kennis en het gebruik van de handelwijze, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.9c
  - number: '2.10'
    text: |-
      Bij regeling van Onze Minister kunnen ten behoeve van een goede uitvoering van dit hoofdstuk regels worden
      gesteld met betrekking tot de administratie van gegevens bij peuterspeelzalen en de informatieverstrekking door
      peuterspeelzalen aan ouders.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.10
  - number: 2.11.1
    text: |-
      De houder informeert de ouders van wie de kinderen in de peuterspeelzaal worden opgevangen over het te voeren
      beleid als bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.11
  - number: 2.11.2
    text: |-
      De houder informeert de ouders wier kinderen in de peuterspeelzaal worden opgevangen over een inspectierapport als
      bedoeld in [artikel 2.21][ref1] door dit zo spoedig mogelijk na ontvangst van het rapport op een website van de
      houder te plaatsen zodanig dat het rapport voor ouders gemakkelijk vindbaar is dan wel, indien de houder geen eigen
      website heeft, ter inzage leggen op een voor ouders toegankelijke plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
  - number: 2.11.3
    text: |-
      De houder informeert het personeel over een inspectierapport als bedoeld in [artikel 2.21][ref1] door dit zo
      spoedig mogelijk na ontvangst van het rapport op een website van de houder te plaatsen zodanig dat het rapport voor
      het personeel gemakkelijk vindbaar is dan wel ter inzage te leggen op een voor het personeel toegankelijke plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
  - number: 2.12.1
    text: |-
      In een peuterspeelzaal wordt de Nederlandse taal als voertaal gebruikt. Daar waar naast de Nederlandse taal, de
      Friese taal of een streektaal in levend gebruik is, kan de Friese taal of de streektaal mede als voertaal worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.12
  - number: 2.12.2
    text: |-
      In afwijking van het eerste lid kan mede een andere taal als voertaal worden gebezigd, indien de herkomst van
      de kinderen in specifieke omstandigheden daartoe noodzaakt, overeenkomstig een door de houder vastgestelde
      gedragscode.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.12
  - number: 2.13.1
    text: |-
      Onze Minister kan beleidsregels stellen omtrent de toepassing van de [artikelen 2.5][ref1],
      [2.6, eerste lid][ref2], en [2.9][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.13.2
    text: De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.13
  - number: '2.14'
    text: Deze paragraaf is slechts van toepassing op niet-gesubsidieerde peuterspeelzalen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.14
  - number: 2.15.1
    text: |-
      Een houder van een peuterspeelzaal biedt voor elk door hem geëxploiteerde peuterspeelzaal aan degenen van wie de
      kinderen in de peuterspeelzaal worden opgevangen, de gelegenheid deel te nemen aan een oudercommissie die tot taak
      heeft hem te adviseren over de aangelegenheden, genoemd in [artikel 2.17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2.15.2
    text: |-
      De leden van de oudercommissie worden gekozen uit en door degenen van wie de kinderen in de peuterspeelzaal worden
      opgevangen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.15
  - number: 2.15.3
    text: Personen werkzaam bij een peuterspeelzaal zijn geen lid van de oudercommissie van die peuterspeelzaal.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.15
  - number: 2.15.4
    text: De oudercommissie bepaalt haar eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.15
  - number: 2.16.1
    text: |-
      De houder stelt binnen zes maanden na de aanvraag, bedoeld in [artikel 2.2, eerste lid][ref1], voor de
      oudercommissie een reglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 2.16.2
    text: 'Het reglement bevat in ieder geval regels omtrent:'
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.16
  - number: 2.16.2.a
    text: het aantal leden van de oudercommissie;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.16
  - number: 2.16.2.b
    text: de wijze waarop de leden van de oudercommissie worden gekozen;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.16
  - number: 2.16.2.c
    text: de zittingsduur van de leden van de oudercommissie.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.16
  - number: 2.16.3
    text: Het reglement bevat geen regels omtrent de werkwijze van de oudercommissie.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.16
  - number: 2.16.4
    text: De oudercommissie beslist bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.16
  - number: 2.16.5
    text: Wijziging van het reglement behoeft instemming van de oudercommissie.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.16
  - number: 2.17.1
    text: |-
      De houder stelt de oudercommissie in ieder geval in de gelegenheid advies uit te brengen over elk voorgenomen
      besluit met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.17
  - number: 2.17.1.a
    text: |-
      de wijze waarop uitvoering wordt gegeven aan [artikel 2.6, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.17.1.b
    text: |-
      voedingsaangelegenheden van algemene aard en het algemene beleid op het gebied van opvoeding, veiligheid of
      gezondheid;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.17
  - number: 2.17.1.c
    text: openingstijden;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.17
  - number: 2.17.1.d
    text: |-
      het beleid met betrekking tot spel- en ontwikkelingsactiviteiten ten behoeve van de kinderen, waaronder
      voorschoolse educatie;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.17
  - number: 2.17.1.e
    text: |-
      de vaststelling of wijziging van een regeling inzake de behandeling van klachten en het aanwijzen van personen die
      belast worden met de behandeling van klachten;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.17
  - number: 2.17.1.f
    text: wijziging van de prijs van peuterspeelzaalwerk.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.17
  - number: 2.17.2
    text: |-
      Van een advies als bedoeld in het eerste lid kan de houder slechts afwijken indien hij schriftelijk en gemotiveerd
      aangeeft dat het belang van het peuterspeelzaalwerk zich tegen het advies verzet.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.17
  - number: 2.17.3
    text: De oudercommissie is bevoegd de houder ook ongevraagd te adviseren over de onderwerpen, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.17
  - number: 2.17.4
    text: |-
      De houder verstrekt de oudercommissie tijdig en desgevraagd schriftelijk alle informatie die deze voor de
      vervulling van haar taak redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.17
  - number: '2.18'
    text: |-
      De houder treft een regeling voor de behandeling van klachten van de oudercommissie over een door hem genomen
      besluit als bedoeld in [artikel 2.17, eerste lid][ref1]. De getroffen regeling waarborgt dat aan de behandeling van
      een klacht van de oudercommissie niet wordt deelgenomen door de houder of door een persoon die werkzaam is voor of
      bij de houder op wie die klacht betrekking heeft. De houder brengt de getroffen regeling op passende wijze onder de
      aandacht van de oudercommissie. De [artikelen 2, tweede tot en met vijfde lid, zevende lid, en negende lid][ref2],
      [2a][ref3], [3c][ref4] en [4 van de Wet klachtrecht cliënten zorgsector][ref5] zijn van overeenkomstige toepassing
      voor de oudercommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007414#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007414#Artikel2a
      [ref4]: https://wetten.overheid.nl/BWBR0007414#Artikel3c
      [ref5]: https://wetten.overheid.nl/BWBR0007414#Artikel4
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0007414
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007414
        artikel: 2a
      - id: ref4
        bwb_id: BWBR0007414
        artikel: 3c
      - id: ref5
        bwb_id: BWBR0007414
        artikel: '4'
  - number: 2.19.1
    text: |-
      Het college ziet toe op de naleving van de bij of krachtens [afdeling 2][ref1] van dit hoofdstuk gestelde
      regels, onderscheidenlijk de krachtens [artikel 2.23][ref2] gegeven aanwijzingen en bevelen en de krachtens
      [artikel 2.24, eerste lid][ref3], gegeven bevelen tot sluiting dan wel de krachtens artikel 2.24, tweede
      lid, uitgevaardigde verboden, en de in de bij [artikel 2.8][ref4] vastgestelde algemene maatregel van bestuur
      vastgelegde basisvoorwaarden voor kwaliteit van voorschoolse educatie. Het college wijst de directeur van de GGD
      aan als toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.19.2
    text: |-
      Voor zover een peuterspeelzaal is gevestigd in een woning, zijn de toezichthouders ter uitvoering van de taken,
      bedoeld in het eerste lid, bevoegd zonder toestemming van de bewoners in die woning binnen te treden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.19
  - number: 2.20.1
    text: |-
      De toezichthouder onderzoekt na een aanvraag als bedoeld in [artikel 2.2, eerste lid][ref1], binnen een bij
      regeling van Onze Minister te stellen termijn of de exploitatie redelijkerwijs zal plaatsvinden in overeenstemming
      met het bepaalde bij of krachtens [afdeling 2, paragrafen 2][ref2] en [3][ref3] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2.20.2
    text: |-
      Onverminderd het eerste lid onderzoekt de toezichthouder jaarlijks of de exploitatie van elke geregistreerde
      peuterspeelzaal plaatsvindt in overeenstemming met de bij of krachtens [afdeling 2, paragrafen 2][ref1] en
      [3][ref2], van dit hoofdstuk gestelde regels, behoudens bijzondere omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '2'
  - number: 2.20.3
    text: |-
      Naast het onderzoek, bedoeld in het eerste en tweede lid, kan de toezichthouder incidenteel onderzoek verrichten
      naar de naleving door een houder van de bij of krachtens [afdeling 2, paragrafen 2][ref1] en [3][ref2], van dit
      hoofdstuk gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '2'
  - number: 2.20.4
    text: |-
      Indien tijdens een onderzoek als bedoeld in het tweede of het derde lid tekortkomingen zijn geconstateerd kan de
      toezichthouder nadien een of meer nadere onderzoeken verrichten.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.20
  - number: 2.21.1
    text: |-
      De toezichthouder legt zijn oordeel naar aanleiding van een onderzoek als bedoeld in
      [artikel 2.20, eerste tot en met vierde lid][ref1], vast in een inspectierapport.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
  - number: 2.21.2
    text: |-
      Indien de toezichthouder oordeelt dat door de houder de bij of krachtens [afdeling 2, paragrafen 2][ref1] en
      [3][ref2], van dit hoofdstuk gegeven voorschriften niet zijn of zullen worden nageleefd, vermeldt hij dat in het
      rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2.21.3
    text: |-
      Alvorens het rapport vast te stellen, stelt de toezichthouder de houder in de gelegenheid van het ontwerprapport
      kennis te nemen en daarover zijn zienswijze kenbaar te maken. De toezichthouder vermeldt de zienswijze van de
      houder in een bijlage bij het rapport. Dit lid is niet van toepassing op een inspectierapport dat wordt opgesteld
      naar aanleiding van een onderzoek als bedoeld in [artikel 2.20, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
  - number: 2.21.4
    text: De toezichthouder zendt het inspectierapport, bedoeld in het eerste lid, onverwijld aan de houder.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.21
  - number: 2.21.5
    text: De toezichthouder maakt het inspectierapport uiterlijk drie weken na de vaststelling daarvan openbaar.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.21
  - number: 2.21.6
    text: |-
      De toezichthouder zendt een afschrift van het inspectierapport naar aanleiding van een onderzoek bij een
      peuterspeelzaal waar voorschoolse educatie wordt aangeboden, aan het college en aan de Inspectie van het onderwijs,
      indien met betrekking tot een of meer van de basisvoorwaarden voor kwaliteit van voorschoolse educatie, bedoeld in
      [artikel 2.19, eerste lid][ref1], tekortkomingen zijn geconstateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
  - number: 2.22.1
    text: |-
      Onze Minister kan beleidsregels stellen omtrent de door de toezichthouder te hanteren werkwijze voor een onderzoek
      als bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.22
  - number: 2.22.2
    text: De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.22
  - number: 2.23.1
    text: |-
      Het college van de gemeente waarin zich een peuterspeelzaal bevindt die de bij of krachtens
      [afdeling 2, paragrafen 2][ref1] en [3][ref2], van dit hoofdstuk gegeven voorschriften niet of in onvoldoende mate
      naleeft, kan de houder een schriftelijke aanwijzing geven.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2.23.2
    text: |-
      In een aanwijzing als bedoeld in het eerste lid geeft het college met redenen omkleed aan op welke punten de in het
      eerste lid bedoelde voorschriften niet of in onvoldoende mate worden nageleefd, alsmede de in verband daarmee te
      nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.23
  - number: 2.23.3
    text: |-
      Indien de toezichthouder oordeelt dat de kwaliteit van het peuterspeelzaalwerk bij een peuterspeelzaal zodanig
      tekortschiet, dat het nemen van maatregelen redelijkerwijs geen uitstel kan lijden, kan de toezichthouder een
      schriftelijk bevel geven. Het bevel heeft een geldigheidsduur van zeven dagen, welke door het college kan worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.23
  - number: 2.23.4
    text: De houder neemt de maatregelen binnen de bij de aanwijzing, onderscheidenlijk het bevel, gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.23
  - number: 2.24.1
    text: |-
      Het college kan de houder verbieden de exploitatie van een peuterspeelzaal voort te zetten, zolang hij een bevel of
      aanwijzing niet opvolgt en het opleggen van een last onder bestuursdwang niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.24
  - number: 2.24.2
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 2.20][ref1] of anderszins blijkt dat de peuterspeelzaal naar
      verwachting niet dan wel niet langer aan de bij of krachtens [afdeling 2, paragraaf 2][ref2], van dit hoofdstuk
      gegeven voorschriften zal voldoen, kan het college zolang die situatie zich voordoet, de houder verbieden die
      peuterspeelzaal in exploitatie te nemen of te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.25.1
    text: |-
      Het college verstrekt desgevraagd aan Onze Minister gegevens en inlichtingen die hij voor de informatievoorziening
      en beleidsvorming en de statistiek met betrekking tot dit hoofdstuk nodig heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.25
  - number: 2.25.2
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de informatie die het college
      verstrekt over de uitvoering van zijn werkzaamheden op grond van dit hoofdstuk en de wijze waarop het college de
      gegevens en inlichtingen verstrekt en verzamelt en of en op welke wijze deze informatie openbaar wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.25
  - number: 2.25.3
    text: De gegevens en inlichtingen, bedoeld in het eerste lid, worden kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.25
  - number: '2.27'
    text: Deze afdeling is slechts van toepassing op niet-gesubsidieerde peuterspeelzalen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.27
  - number: 2.28.1
    text: |-
      Het college kan de houder die een verplichting als bedoeld bij of krachtens [afdeling 2][ref1] van dit
      hoofdstuk, een afspraak als bedoeld in [artikel 167 van de Wet op het primair onderwijs][ref2], een aanwijzing
      onderscheidenlijk een bevel als bedoeld in [artikel 2.23][ref3] of een vordering tot medewerking als bedoeld
      in [artikel 5:20 van de Algemene wet bestuursrecht][ref4] niet nakomt dan wel handelt in strijd met een verbod
      krachtens [artikel 2.24][ref5], een bestuurlijke boete opleggen van ten hoogste € 45 000.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel167
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '167'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '3'
  - number: 2.28.2
    text: |-
      In afwijking van het eerste lid kan de overtreding van de houder niet met een bestuurlijke boete worden afgedaan,
      indien de overtreding opzettelijk of roekeloos geschiedt en een direct gevaar voor de gezondheid of de veiligheid
      van personen tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.28
  - number: 2.29.1
    text: |-
      Bij algemene maatregel van bestuur kunnen voor een periode van ten hoogste vier jaar ten behoeve van experimenten,
      die ten doel hebben de totstandkoming van innovatief peuterspeelzaalwerk mogelijk te maken, vormen van
      peuterspeelzaalwerk worden aangewezen en kunnen regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.29
  - number: 2.29.1.a
    text: de kwaliteit van de aan te wijzen vormen van peuterspeelzaalwerk;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.29
  - number: 2.29.1.b
    text: het toezicht op de naleving van de regels, bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.29
  - number: 2.29.1.c
    text: de hoogte van de ouderbijdrage voor peuterspeelzaalwerk;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.29
  - number: 2.29.1.d
    text: de duur van de aan te wijzen vormen van peuterspeelzaalwerk als experiment.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.29
  - number: 2.29.2
    text: |-
      Bij algemene maatregel van bestuur kunnen experimenten als bedoeld in het eerste lid na afloop van de looptijd
      worden voortgezet tot een structurele regeling is getroffen, doch niet langer dan met een tijdsduur van ten hoogste
      twee jaar. Het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.29
  - number: 2.30.1
    text: |-
      Onze Minister zendt na overleg met de Minister van Volksgezondheid, Welzijn en Sport uiterlijk zes maanden voor
      de beëindiging van een experiment, als bedoeld in [artikel 2.29][ref1], een verslag over de doeltreffendheid en
      de effecten ervan alsmede een standpunt inzake de voortzetting van de desbetreffende regeling, anders dan als
      experiment, aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '5'
  - number: 2.30.2
    text: |-
      Indien een experiment als bedoeld in [artikel 2.29][ref1], eerder wordt beëindigd dan de bij algemene maatregel
      van bestuur, bedoeld in het eerste lid van dat artikel, daarvoor gestelde duur, zendt Onze Minister na overleg
      met de Minister van Volksgezondheid, Welzijn en Sport, in afwijking van het eerste lid, uiterlijk twee maanden na
      de beëindiging van dat experiment een verslag over de doeltreffendheid en de effecten ervan alsmede een standpunt
      inzake de voortzetting van de desbetreffende regeling, anders dan als experiment, aan de beide kamers der Staten-
      Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2'
        hoofdstuk: '2'
        afdeling: '5'
  - number: 3.6a.1
    text: |-
      In afwijking van [artikel 1.5, eerste lid, onder b][ref1], heeft een ouder voor het berekeningsjaar 2010 tevens
      aanspraak op kinderopvangtoeslag in de door hem of zijn partner te betalen kosten jegens het Rijk onderscheidenlijk
      aanspraak op een tegemoetkoming in de door hem of zijn partner te betalen kosten van kinderopvang jegens
      de gemeente of jegens het Uitvoeringsinstituut werknemersverzekeringen, indien het betreft gastouderopvang,
      die plaatsvindt door tussenkomst van een geregistreerd gastouderbureau, in een of meer voorzieningen voor
      gastouderopvang die niet in het register kinderopvang zijn opgenomen onder voorwaarde dat is voldaan aan
      [artikel 1.56b, derde, vierde en vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.6a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.6a.2
    text: |-
      Voor zover er geen uniek nummer is verstrekt als bedoeld in [artikel 1.10][ref1] zoals dat luidde op 31 december
      2012, is dat artikel niet van toepassing gedurende het berekeningsjaar 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.6a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.6a.3
    text: Dit artikel vervalt met ingang van 1 januari 2016.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.6a
  - number: 3.7.1
    text: |-
      [Afdeling 2 van hoofdstuk 1][ref1] en [artikel 1.86][ref2] zijn gedurende ten hoogste zes
      maanden na het tijdstip van hun inwerkingtreding niet van toepassing op een ouder als bedoeld
      in [artikel 1.6, eerste lid, onder h en i][ref3], die gebruik maakt van kinderopvang die door
      het Uitvoeringsinstituut werknemersverzekeringen ten behoeve van die ouder is bekostigd op grond
      een vóór het tijdstip van inwerkingtreding van deze wet gesloten schriftelijke overeenkomst
      als bedoeld in [artikel 74, eerste lid, van de Werkloosheidswet][ref4] respectievelijk
      [artikel 22a, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel74
      [ref5]: https://wetten.overheid.nl/BWBR0009565#Artikel22a
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.7
    references:
