  - number: 1.6.2
    text: |-
      Een ouder die niet in Nederland woont, heeft slechts aanspraak op een kinderopvangtoeslag indien hij in een andere
      lidstaat of Zwitserland woont en, daartoe gerechtigd, in Nederland of op het continentaal plat arbeid verricht of
      een uitkering ontvangt als bedoeld in het eerste lid, onder c, e, h of i, en gebruik maakt van een in één van die
      onderdelen bedoelde voorziening gericht op arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.6
  - number: 1.6.3
    text: |-
      Een ouder met een partner heeft slechts aanspraak op een kinderopvangtoeslag, indien de partner in Nederland, een
      andere lidstaat of Zwitserland woont, en
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.6
  - number: 1.6.3.a
    text: in Nederland of op het continentaal plat, in een andere lidstaat of in Zwitserland arbeid verricht,
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.6
  - number: 1.6.3.b
    text: |-
      een uitkering ontvangt als bedoeld in het eerste lid, onder c, e, h of i, en gebruik maakt van een in één
      van die onderdelen bedoelde voorziening gericht op arbeidsinschakeling of een daarmee vergelijkbare uitkering
      respectievelijk voorziening, vastgesteld krachtens de wetgeving van een andere lidstaat of Zwitserland,
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.6
  - number: 1.6.3.c
    text: |-
      werkloos wordt als bedoeld in het tweede lid en een uitkering ontvangt als bedoeld in het tweede lid, onder a of b,
      of een daarmee vergelijkbare uitkering, vastgesteld krachtens de wetgeving van een andere lidstaat of Zwitserland,
      of
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.6
  - number: 1.6.3.d
    text: een persoon is als bedoeld in het eerste lid, onder f, g, j, k of l.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.6
  - number: 1.6.4
    text: |-
      Voor de toepassing van deze wet wordt met inkomen uit werk en woning als bedoeld in het eerste lid, onderdeel a,
      gelijkgesteld een daarmee overeenkomend inkomen dat niet tot het verzamelinkomen van de ouder behoort omdat het
      niet behoort tot het Nederlands inkomen als bedoeld in [hoofdstuk 7 van de Wet inkomstenbelasting 2001][ref1], of
      is vrijgesteld op grond van bepalingen van internationaal recht.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '7'
  - number: 1.6.5
    text: |-
      Een ouder die in een berekeningsjaar of in het daaraan voorafgaande berekeningjaar arbeid heeft verricht
      als bedoeld in artikel 1.6, eerste lid, onderdeel a of b, behoudt gedurende drie kalendermaanden, gerekend
      vanaf de eerste dag na de dag waarop het verrichten van die arbeid is beëindigd, dezelfde aanspraak op een
      kinderopvangtoeslag als voor die beëindiging bestond.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.6
  - number: 1.6a
    text: |-
      In afwijking van de [artikelen 1.5][ref1] en [1.6][ref2], heeft een ouder als bedoeld in artikel 1.6, eerste lid,
      onderdeel a, voor zover die ouder de arbeid verricht als gastouder, geen aanspraak op een kinderopvangtoeslag
      in de door hem of zijn partner te betalen kosten van gastouderopvang in een geregistreerde voorziening voor
      gastouderopvang.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.6a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1.7.1
    text: 'De hoogte van de kinderopvangtoeslag is afhankelijk van:'
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.7
  - number: 1.7.1.a
    text: de draagkracht, en
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.7
  - number: 1.7.1.b
    text: 'de kosten van kinderopvang per kind die worden bepaald door:'
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.7
  - number: 1.7.1.b.1º
    text: het aantal uren kinderopvang per kind in het berekeningsjaar,
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.7
  - number: 1.7.1.b.2º
    text: de voor die kinderopvang te betalen prijs, met inachtneming van het bedrag, bedoeld in het tweede lid, en
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.7
  - number: 1.7.1.b.3º
    text: de soort kinderopvang.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.7
  - number: 1.7.2
    text: |-
      De uurprijs die bij de hoogte van de kinderopvangtoeslag, bedoeld in het eerste lid, in aanmerking wordt genomen
      gaat een bij algemene maatregel van bestuur vast te stellen bedrag niet te boven. Dat bedrag kan per opvangsoort
      verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.7
  - number: 1.7.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de redelijke verhouding tussen het aantal
      uren dat de ouder en zijn partner arbeid verrichten, gebruik maken van een voorziening die gericht is op
      arbeidsinschakeling, of scholing, een opleiding of een cursus volgen, alsmede de in verband daarmee benodigde
      reistijd, en het aantal uren kinderopvang waarvoor kinderopvangtoeslag kan worden aangevraagd.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.7
  - number: 1.7.4
    text: |-
      Het aantal uren kinderopvang dat in aanmerking wordt genomen bij de hoogte van de kinderopvangtoeslag, bedoeld in
      het eerste lid, gaat een bij algemene maatregel van bestuur vast te stellen maximum, dat per soort kinderopvang of
      per leeftijdsgroep verschillend kan worden vastgesteld, niet te boven.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.7
  - number: 1.8.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de hoogte en de
      berekeningswijze van de kinderopvangtoeslag, waarbij tabellen worden vastgesteld waaruit de relatie tussen de
      kosten van kinderopvang en de kinderopvangtoeslag kan worden afgelezen en waarbij tevens wordt bepaald in welke
      gevallen de ouder aanspraak heeft op een kinderopvangtoeslag die minder dan 33,3 procent bedraagt van de kosten van
      kinderopvang, bedoeld in [artikel 1.7, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1.8.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de hoogte van het bedrag dat als vaste eigen
      bijdrage van de ouder in mindering wordt gebracht op de kinderopvangtoeslag. Daarbij kunnen het toetsingsinkomen
      van de ouder en zijn partner, de aanwezigheid van een partner en het aantal kinderen in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.8
  - number: 1.9.1
    text: |-
      De bedragen, bedoeld in [artikel 1.7, tweede lid][ref1], de mate waarin het toetsingsinkomen van de ouder en,
      indien hij een partner heeft, dat van zijn partner een rol speelt bij de hoogte van de kinderopvangtoeslag, en
      het bedrag, bedoeld in [artikel 1.8, tweede lid][ref2], worden bij het begin van het kalenderjaar bij ministeriële
      regeling gewijzigd aan de hand van een bij algemene maatregel van bestuur aan te wijzen index ter zake van lonen
      of prijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1.9.2
    text: 'De overeenkomstig het eerste lid aangepaste bedragen treden in de plaats van de bedragen:'
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.9
  - number: 1.9.2.a
    text: |-
      bedoeld in de [artikelen 1.7, tweede lid][ref1], en [1.8, tweede lid][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1.9.2.b
    text: die voortvloeien uit de mate waarin het toetsingsinkomen een rol speelt bij de hoogte van de kinderopvangtoeslag.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.9
  - number: 1.10.1
    text: |-
      De financiële middelen tot dekking van de uitgaven voor de kinderopvangtoeslag kunnen mede worden verkregen
      door het heffen van een opslag op de premie, die ten gunste komt van een sectorfonds als bedoeld in
      [artikel 23, tweede lid, van de Wet financiering sociale verzekeringen][ref1] dan wel een opslag op de premie,
      bedoeld in [artikel 29 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel29
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '29'
  - number: 1.10.2
    text: |-
      De premieopslagen, bedoeld in het eerste lid, zijn verschuldigd door de werkgever onderscheidenlijk de
      overheidswerkgever.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.10
  - number: 1.10.3
    text: |-
      De premieopslagen worden vastgesteld bij ministeriële regeling. De [artikelen 26][ref1] onderscheidenlijk
      [31 van de Wet financiering sociale verzekeringen][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel31
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '31'
  - number: 1.10.4
    text: |-
      Op de heffing en invordering van de premieopslagen zijn de [artikelen 57][ref1], [59][ref2] en
      [60 van de Wet financiering sociale verzekeringen][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel60
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '59'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '60'
  - number: '1.11'
    text: |-
      De kinderopvangtoeslag blijft buiten beschouwing bij de verlening van andere op het inkomen of vermogen afgestemde
      publiekrechtelijke uitkeringen en verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.11
  - number: '1.13'
    text: |-
      Het college kan aan een ouder als bedoeld in [artikel 1.6, eerste lid, onderdelen c, e, j, k of l][ref1],
      een tegemoetkoming verstrekken in aanvulling op de kinderopvangtoeslag, zodanig dat het totaal van de
      kinderopvangtoeslag en de tegemoetkoming niet meer bedraagt dan de kosten van kinderopvang, bedoeld in
      [artikel 1.7, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1.45.1
    text: |-
      Degene die voornemens is een kindercentrum of gastouderbureau in exploitatie te nemen, doet daarvoor een aanvraag
      bij het college.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.45
  - number: 1.45.2
    text: |-
      De houder van een gastouderbureau dient een aanvraag in voor degene die door zijn tussenkomst voornemens is
      gastouderopvang te bieden. De aanvraag, bedoeld in de eerste volzin, wordt namens de gastouder gedaan bij het
      college.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.45
  - number: 1.45.3
    text: |-
      Een kindercentrum, een gastouderbureau of een voorziening voor gastouderopvang wordt niet in exploitatie genomen
      voordat een onderzoek als bedoeld in [artikel 1.62, eerste lid][ref1], heeft plaatsgevonden, waaruit blijkt
      dat de exploitatie redelijkerwijs zal plaatsvinden in overeenstemming met het bepaalde bij of krachtens de
      [paragrafen 2][ref2] en [3 van deze afdeling][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.45
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
  - number: 1.45.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven over de gegevens die worden verstrekt
      bij de aanvraag, bedoeld in het eerste en tweede lid, en over de wijze van verstrekking van deze gegevens,
      waaronder voorschriften over de verstrekking van het burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.45
  - number: 1.45.5
    text: |-
      In de gevallen waarin het burgerservicenummer dient te worden verstrekt, is degene ten behoeve van wie een aanvraag
      als bedoeld in het tweede lid wordt gedaan gehouden dat nummer te verstrekken aan degenen, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.45
  - number: 1.46.1
    text: |-
      Uiterlijk tien weken na de ontvangst van de aanvraag, bedoeld in [artikel 1.45, eerste of tweede lid][ref1],
      besluit het college op de aanvraag. Indien uit het onderzoek, bedoeld in [artikel 1.62, eerste lid][ref2], is
      gebleken dat de exploitatie redelijkerwijs zal plaatsvinden in overeenstemming met het bepaalde bij of krachtens
      de [paragrafen 2][ref3] en [3][ref4] van deze afdeling en anderszins niet is gebleken van feiten en omstandigheden
      die op het tegendeel duiden, wordt positief op de aanvraag beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.46
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
  - number: 1.46.2
    text: |-
      In de beschikking waarin positief op de aanvraag, bedoeld in het eerste lid, wordt beslist, bepaalt het college
      de datum van ingang van de exploitatie. Deze datum ligt niet voor de datum van de bekendmaking van de beschikking.
      Het college draagt zorg voor inschrijving van het kindercentrum, het gastouderbureau of de voorziening voor
      gastouderopvang in het register kinderopvang waarbij de datum van ingang van de exploitatie als startdatum van de
      registratie wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.46
  - number: 1.46.3
    text: |-
      Het college deelt de houder van het kindercentrum of gastouderbureau schriftelijk mee dat inschrijving van
      het kindercentrum, het gastouderbureau onderscheidenlijk de voorziening voor gastouderopvang in het register
      kinderopvang heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.46
  - number: 1.46.4
    text: |-
      Bij een inschrijving als bedoeld in het tweede lid, doet het college opgave van de gegevens die ingevolge
      [artikel 1.45, vierde lid][ref1], zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.46
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 1.46.5
    text: |-
      Indien in een kindercentrum voorschoolse educatie wordt aangeboden, neemt het college dit op in het register
      kinderopvang.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.46
  - number: 1.47.1
    text: |-
      De houder van een kindercentrum of van een gastouderbureau doet van een wijziging in de gegevens die daartoe bij
      of krachtens algemene maatregel van bestuur worden aangewezen onverwijld mededeling aan het college, nadat deze
      wijziging hem bekend is geworden. Hierbij verzoekt de houder de gegevens te wijzigen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47
  - number: 1.47.2
    text: |-
      Het college kan naar aanleiding van het verzoek, bedoeld in het eerste lid, besluiten tot wijziging van de gegevens
      en verwerkt dit zo nodig in het register kinderopvang.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47
  - number: 1.47.3
    text: |-
      De houder van een kindercentrum of van een gastouderbureau kan het college verzoeken de inschrijving van een
      kindercentrum, een gastouderbureau of een voorziening voor gastouderopvang uit het register kinderopvang te
      verwijderen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47
  - number: 1.47.4
    text: |-
      Het college kan naar aanleiding van een verzoek als bedoeld in het derde lid besluiten tot verwijdering van de
      inschrijving uit het register kinderopvang en verwerkt dit in het register kinderopvang.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47
  - number: 1.47.5
    text: |-
      Het college heft geen recht als bedoeld in [artikel 229 van de Gemeentewet][ref1] in verband met een verzoek als
      bedoeld in het eerste en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel229
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '229'
  - number: 1.47.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van het eerste tot en met het vierde lid
      nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47
  - number: 1.47a.1
    text: |-
      Onze Minister draagt zorg voor de inrichting van een register kinderopvang ten behoeve van de waarborging van de
      kwaliteit en de rechtszekerheid van de kinderopvang en gastouderopvang alsmede ten behoeve van het toezicht op en
      de handhaving van de bij of krachtens deze afdeling gestelde regels.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47a
  - number: 1.47a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent het register kinderopvang.
      Deze regels hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47a
  - number: 1.47a.2.a
    text: de vorm van het register;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47a
  - number: 1.47a.2.b
    text: de in het register op te nemen gegevens;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47a
  - number: 1.47a.2.c
    text: de vastlegging van gegevens in het register en de verwijdering van gegevens daaruit;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47a
  - number: 1.47a.2.d
    text: de wijze waarop verbetering van onjuistheden in het register plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47a
  - number: 1.47a.2.e
    text: de verstrekking van gegevens;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47a
  - number: 1.47a.2.f
    text: de openbaarheid van gegevens;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47a
  - number: 1.47a.2.g
    text: de verantwoordelijkheden van degenen die gegevens aanleveren ten behoeve van het register.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47a
  - number: 1.47a.3
    text: |-
      Kindercentra, gastouderbureau’s en voorzieningen voor gastouderopvang worden in het register kinderopvang
      geregistreerd onder een uniek nummer.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.47a
  - number: 1.48.1
    text: |-
      Onze Minister kan een buiten Nederland gevestigd kindercentrum, een buiten Nederland gevestigde voorziening
      voor gastouderopvang of een buiten Nederland gevestigd gastouderbureau gelijkstellen met een geregistreerd
      kindercentrum, een geregistreerde voorziening voor gastouderopvang of een geregistreerd gastouderbureau, door
      opneming ervan in een door hem bij te houden register buitenlandse kinderopvang.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48
  - number: 1.48.2
    text: |-
      Indien een ouder voornemens is gebruik te maken van een kindercentrum of een voorziening voor gastouderopvang door
      tussenkomst van een gastouderbureau buiten Nederland, doet hij bij Onze Minister een aanvraag om opneming van dat
      centrum, die voorziening voor gastouderopvang of dat bureau in het register buitenlandse kinderopvang. Opname in
      dat register vindt slechts plaats, indien aannemelijk is gemaakt dat de kwaliteit ervan naar aard en strekking
      overeenkomt met de op grond van deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48
  - number: 1.48.3
    text: |-
      Onze Minister deelt de houder en de aanvrager schriftelijk mee dat opneming van het kindercentrum, de voorziening
      voor gastouderopvang onderscheidenlijk het gastouderbureau in het register buitenlandse kinderopvang heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48
  - number: 1.48.4
    text: |-
      Onze Minister maakt de opneming in en verwijdering uit het register buitenlandse kinderopvang bekend in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48
  - number: 1.48.5
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent het register buitenlandse kinderopvang en de
      wijze waarop verbetering van onjuistheden in dat register plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48
  - number: 1.48.6
    text: |-
      De houder doet van wijzigingen in de gegevens die ten behoeve van de opneming in het register buitenlandse
      kinderopvang zijn verstrekt, onverwijld mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48
  - number: 1.48.7
    text: |-
      Onze Minister deelt de houder schriftelijk mee dat de wijzigingen in het register buitenlandse kinderopvang zijn
      aangetekend.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48
  - number: 1.48.8
    text: |-
      De [artikelen 1.45 tot en met 1.47a][ref1] en [1.49 tot en met 1.60][ref2] en de [afdelingen 4][ref3] en
      [5 van dit hoofdstuk][ref4] zijn niet van toepassing op een kindercentrum of een gastouderbureau als bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        afdeling: '5'
  - number: 1.48.9
    text: 'Bij regeling van Onze Minister kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48
  - number: 1.48.9.a
    text: |-
      de wijze waarop aannemelijk wordt gemaakt dat een kindercentrum, voorziening voor gastouderopvang of
      gastouderbureau als bedoeld in het eerste lid voldoet aan het tweede lid;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48
  - number: 1.48.9.b
    text: het toezicht op de naleving van het achtste lid;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48
  - number: 1.48.9.c
    text: |-
      het verstrekken van gegevens en inlichtingen door de ouder en de houder alsmede de wijze waarop deze gegevens en
      inlichtingen worden verstrekt ten behoeve van dat toezicht.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48
  - number: 1.48.10
    text: |-
      Indien blijkt dat de kwaliteit van het kindercentrum, de voorziening voor gastouderopvang of het gastouderbureau
      niet langer naar aard en strekking overeenkomt met de op grond van deze wet gestelde regels of dat de houder niet
      voldoet aan enige verplichting die op grond van deze wet op hem rust wordt het kindercentrum, de voorziening voor
      gastouderopvang of het gastouderbureau uit het register buitenlandse kinderopvang verwijderd.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48
  - number: 1.48a.1
    text: |-
      Bij regeling van Onze Minister kunnen categorieën van buiten Nederland gevestigde kindercentra, voorzieningen voor
      gastouderopvang of gastouderbureaus worden aangewezen die worden gelijkgesteld met geregistreerde kindercentra,
      geregistreerde voorzieningen voor gastouderopvang of geregistreerde gastouderbureaus, indien deze kindercentra,
      voorzieningen voor gastouderopvang of gastouderbureaus voldoen aan de in het land van vestiging geldende regels met
      betrekking tot de kwaliteit en deze regels naar aard en naar strekking overeenkomen met de bij of krachtens deze
      wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48a
  - number: 1.48a.2
    text: |-
      [Artikel 1.48][ref1] is niet van toepassing op kindercentra, voorzieningen voor gastouderopvang en gastouderbureaus
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.48a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 1.49.1
    text: |-
      Een houder van een kindercentrum biedt verantwoorde kinderopvang aan waaronder wordt verstaan opvang die bijdraagt
      aan een goede en gezonde ontwikkeling van het kind in een veilige en gezonde omgeving.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.49
  - number: 1.49.2
    text: |-
      Een houder van een voorziening voor gastouderopvang biedt verantwoorde gastouderopvang aan waaronder wordt verstaan
      opvang die bijdraagt aan een goede en gezonde ontwikkeling van het kind in een veilige en gezonde omgeving.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.49
  - number: 1.49.3
    text: |-
      Een houder van een gastouderbureau draagt zorg voor een verantwoorde uitvoering van de werkzaamheden van het
      bureau, waaronder wordt verstaan:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.49
  - number: 1.49.3.a
    text: |-
      het tot stand brengen en begeleiden van gastouderopvang die bijdraagt aan een goede en gezonde ontwikkeling van het
      kind in een veilige en gezonde omgeving;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.49
  - number: 1.49.3.b
    text: het doorgeleiden van de betalingen van ouders aan gastouders.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.49
  - number: 1.50.1
    text: |-
      De houder van een kindercentrum organiseert de kinderopvang op zodanige wijze, voorziet het kindercentrum
      zowel kwalitatief, als kwantitatief zodanig van personeel en materieel, draagt zorg voor een zodanige
      verantwoordelijkheidstoedeling, en voert een zodanig pedagogisch beleid dat een en ander redelijkerwijs leidt
      tot verantwoorde kinderopvang. Ter uitvoering van de eerste volzin besteedt de houder van het kindercentrum
      in ieder geval aantoonbaar aandacht aan het aantal beroepskrachten in relatie tot het aantal kinderen per
      leeftijdscategorie, de groepsgrootte, de opleidingseisen van de beroepskrachten en de voorwaarden waaronder en de
      mate waarin beroepskrachten in opleiding kunnen worden belast met de verzorging en opvang van kinderen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de kwaliteit van
      kinderopvang bij een kindercentrum. Deze regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.2.a
    text: de veiligheid en de gezondheid;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.2.b
    text: de opleidingseisen waaraan de beroepskrachten voldoen;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.2.c
    text: de inzet van beroepskrachten in opleiding;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.2.d
    text: het aantal beroepskrachten en vrijwilligers in relatie tot het aantal kinderen per leeftijdscategorie;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.2.e
    text: de groepsgrootte;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.2.f
    text: het pedagogisch beleid en de pedagogische praktijk;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.2.g
    text: de accommodatie en de inrichting van de ruimte die bestemd is voor kinderopvang;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.2.h
    text: de beschikbare ruimte voor kinderen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.3
    text: |-
      De houder van een kindercentrum en de personen werkzaam bij een onderneming waarmee de houder een kindercentrum
      exploiteert, zijn in het bezit van een verklaring omtrent het gedrag.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.4
    text: |-
      Een verklaring omtrent het gedrag van een persoon werkzaam bij een onderneming als bedoeld in het derde lid wordt
      aan de houder van een kindercentrum overgelegd, voordat deze persoon zijn werkzaamheden aanvangt. Een verklaring
      omtrent het gedrag is bij aanvang van de werkzaamheden niet ouder dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.5
    text: |-
      De houder van een kindercentrum overlegt bij het indienen van de aanvraag, bedoeld in
      [artikel 1.45, eerste lid][ref1], een verklaring omtrent het gedrag aan het college. De verklaring omtrent het
      gedrag is op het moment van de indiening van de aanvraag niet ouder dan twee maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 1.50.6
    text: |-
      Indien de toezichthouder redelijkerwijs mag vermoeden dat de houder van een kindercentrum niet langer voldoet
      aan de eisen voor het afgeven van een verklaring omtrent het gedrag, verlangt de toezichthouder dat deze houder
      opnieuw een verklaring omtrent het gedrag overlegt binnen een door de toezichthouder vast te stellen termijn. Een
      verklaring omtrent het gedrag is op het moment van overlegging niet ouder dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.7
    text: |-
      Indien de houder redelijkerwijs mag vermoeden dat een persoon werkzaam bij een onderneming als bedoeld in het derde
      lid niet langer voldoet aan de eisen voor het afgeven van een verklaring omtrent het gedrag, verlangt de houder
      al dan niet op verzoek van de toezichthouder, dat die persoon opnieuw een verklaring omtrent het gedrag overlegt
      binnen een door de houder dan wel de toezichthouder vast te stellen termijn. Een verklaring omtrent het gedrag is
      op het moment van overlegging niet ouder dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.8
    text: |-
      De verplichting van het vierde lid geldt voor een persoon die als stagiair of uitzendkracht werkzaam is de eerste
      maal voordat hij de werkzaamheden aanvangt en vervolgens uiterlijk iedere twee jaar, te rekenen vanaf de dag van
      afgifte van de meest actuele verklaring omtrent het gedrag. Bij iedere volgende houder ten behoeve waarvan de
      stagiair of de uitzendkracht in die periode van maximaal twee jaar werkzaam is, overlegt hij telkens de meest
      actuele verklaring omtrent het gedrag.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.9
    text: |-
      De verplichting van het vierde lid geldt voor een persoon die als vrijwilliger werkzaam is de eerste maal voordat
      hij de werkzaamheden aanvangt en vervolgens uiterlijk iedere twee jaar, te rekenen vanaf de dag van afgifte van de
      meest actuele verklaring omtrent het gedrag.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.10
    text: |-
      Indien de toezichthouder redelijkerwijs mag vermoeden dat een persoon van 12 jaar of ouder die ten tijde van de
      opvang aanwezig is in het kindercentrum niet zou voldoen aan de eisen voor het afgeven van een verklaring omtrent
      het gedrag, verlangt de toezichthouder dat de houder van het kindercentrum een verklaring omtrent het gedrag
      overlegt met betrekking tot die persoon binnen een door de toezichthouder vast te stellen termijn. Binnen die
      termijn is die persoon in het bezit van een verklaring omtrent het gedrag en legt de houder die verklaring omtrent
      het gedrag over aan de toezichthouder. Een verklaring omtrent het gedrag is op het moment van overlegging niet
      ouder dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50.11
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten behoeve van een goede
      uitvoering van het derde tot en met het negende lid.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50
  - number: 1.50a
    text: |-
      De houder van een kindercentrum neemt deel aan het overleg tussen het college en de bevoegde
      gezagsorganen van scholen over het onderwijsachterstandenbeleid, bedoeld in de [artikelen 167][ref1] en
      [167a van de Wet op het primair onderwijs][ref2] en werkt mee aan de totstandkoming van de afspraken en de nakoming
      ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel167
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel167a
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '167'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 167a
  - number: 1.50b
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de kwaliteit van voorschoolse
      educatie, indien dit wordt gesubsidieerd door het college. Deze regels hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50b
  - number: 1.50b.a
    text: de opleidingseisen en de scholingseisen waaraan de beroepskrachten voorschoolse educatie voldoen;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50b
  - number: 1.50b.b
    text: het aantal beroepskrachten voorschoolse educatie in relatie tot het aantal kinderen;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50b
  - number: 1.50b.c
    text: de groepsgrootte; en
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50b
  - number: 1.50b.d
    text: de minimum omvang van de voorschoolse educatie.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.50b
  - number: '1.51'
    text: |-
      De houder van een kindercentrum voert een beleid dat ertoe leidt dat de veiligheid en de gezondheid van de op
      te vangen kinderen in elk door hem geëxploiteerd kindercentrum zoveel mogelijk is gewaarborgd. De houder van het
      kindercentrum legt, voor zover hierin niet wordt voorzien bij of krachtens andere wet- en regelgeving, in een
      risico-inventarisatie schriftelijk vast welke risico's de opvang van kinderen met zich brengt.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51
  - number: 1.51a.1
    text: |-
      De houder van een kindercentrum of een gastouderbureau stelt voor het personeel of de gastouders een meldcode vast
      waarin stapsgewijs wordt aangegeven hoe met signalen van huiselijk geweld of kindermishandeling wordt omgegaan en
      die er redelijkerwijs aan bijdraagt dat zo snel en adequaat mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51a
  - number: 1.51a.2
    text: |-
      Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1, eerste lid, van de Wet maatschappelijke ondersteuning][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51a
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '1'
  - number: 1.51a.3
    text: |-
      Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in
      [artikel 1 van de Wet op de jeugdzorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 1.51a.4
    text: De houder bevordert de kennis en het gebruik van de meldcode.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51a
  - number: 1.51a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51a
  - number: 1.51b.1
    text: 'Indien de houder van een kindercentrum of van een gastouderbureau op enigerlei wijze bekend is geworden dat:'
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51b
  - number: 1.51b.1.a
    text: een bij zijn onderneming werkzaam persoon; of
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51b
  - number: 1.51b.1.b
    text: |-
      een gastouder die door tussenkomst van een gastouderbureau gastouderopvang biedt of een van de andere personen van
      18 jaar of ouder als bedoeld in [artikel 1.56b, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.51b.2
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat sprake is van een redelijk
      vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf als bedoeld in het eerste
      lid, doet de houder van een kindercentrum of gastouderbureau onverwijld aangifte bij een opsporingsambtenaar als
      bedoeld in [artikel 127][ref1] juncto [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt de houder de
      deskundige, bedoeld in het eerste lid, hiervan onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 1.51b.3
    text: |-
      Indien een bij de onderneming van de houder van een kindercentrum of gastouderbureau werkzaam persoon op enigerlei
      wijze bekend is geworden dat een ander ten behoeve van de onderneming van die houder werkzaam persoon, een
      gastouder of een persoon van 18 jaar of ouder als bedoeld in [artikel 1.56b, derde lid][ref1], zich mogelijk
      schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een kind van een ouder die
      gebruik maakt van de door de houder van een kindercentrum of gastouderbureau geboden kinderopvang, stelt hij de
      houder van dat kindercentrum of van dat gastouderbureau daarvan onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.51b.4
    text: |-
      Indien toepassing van het derde lid ertoe zou leiden dat degene die van het vermoeden op de hoogte moet worden
      gesteld dezelfde persoon is als degene die zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als
      bedoeld in het eerste lid, is [artikel 1.51c, eerste en tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.51b.5
    text: |-
      De houder van een kindercentrum of van een gastouderbureau bevordert de kennis en het gebruik van de handelwijze,
      bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51b
  - number: 1.51c.1
    text: 'Indien:'
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51c
  - number: 1.51c.1.a
    text: een bij de onderneming van de houder van een kindercentrum of gastouderbureau werkzaam persoon; of
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51c
  - number: 1.51c.1.b
    text: een gastouder die door tussenkomst van een gastouderbureau gastouderopvang biedt;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51c
  - number: 1.51c.2
    text: |-
      Indien moet worden geconcludeerd dat sprake is van een redelijk vermoeden dat de houder zich schuldig heeft gemaakt
      aan een misdrijf als bedoeld in het eerste lid, doet de persoon die werkzaam is bij de onderneming van de houder
      van een kindercentrum of van een gastouderbureau, of de gastouder onverwijld aangifte bij een opsporingsambtenaar
      als bedoeld in [artikel 127][ref1] juncto [artikel 141 van het Wetboek van Strafvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51c
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 1.51c.3
    text: |-
      De houder van een kindercentrum of van een gastouderbureau bevordert de kennis en het gebruik van de handelwijze,
      bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.51c
  - number: 1.52.1
    text: |-
      Kinderopvang geschiedt op basis van een schriftelijke overeenkomst tussen de houder van een kindercentrum of van
      een gastouderbureau en de ouder.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.52
  - number: 1.52.2
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat de ouder niet kan worden verplicht tot afname en betaling van
      meer uren per dag of dagdeel dan een in die regeling te bepalen maximum.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.52
  - number: 1.52.3
    text: Het aantal uren, bedoeld in het tweede lid, kan per soort kinderopvang verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.52
  - number: '1.53'
    text: |-
      Bij regeling van Onze Minister kunnen ten behoeve van een goede uitvoering van dit hoofdstuk regels worden gesteld
      met betrekking tot de administratie van gegevens bij kindercentra en de informatieverstrekking door kindercentra
      aan ouders.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.53
  - number: 1.54.1
    text: |-
      De houder van een kindercentrum informeert de ouders wier kinderen in het kindercentrum worden opgevangen over het
      te voeren beleid als bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.54
  - number: 1.54.2
    text: |-
      De houder van een kindercentrum informeert de ouders wier kinderen in het kindercentrum worden opgevangen over een
      inspectierapport als bedoeld in [artikel 1.63][ref1] door dit zo spoedig mogelijk na ontvangst van het rapport op
      een website van de houder te plaatsen zodanig dat het rapport voor ouders gemakkelijk vindbaar is dan wel, indien
      de houder geen eigen website heeft, ter inzage te leggen op een voor ouders toegankelijke plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.54
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
  - number: 1.54.3
    text: |-
      De houder van een kindercentrum informeert het personeel van het kindercentrum over een inspectierapport als
      bedoeld in [artikel 1.63][ref1] door dit zo spoedig mogelijk na ontvangst van het rapport op een website van de
      houder te plaatsen zodanig dat het rapport voor het personeel gemakkelijk vindbaar is dan wel, indien de houder
      geen eigen website heeft, ter inzage te leggen op een voor het personeel toegankelijke plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.54
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
  - number: 1.55.1
    text: |-
      Bij kinderopvang in een kindercentrum of in een voorziening voor gastouderopvang wordt de Nederlandse taal als
      voertaal gebruikt. Daar waar naast de Nederlandse taal, de Friese taal of een streektaal in levend gebruik is, kan
      de Friese taal of de streektaal mede als voertaal worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.55
  - number: 1.55.2
    text: |-
      In afwijking van het eerste lid kan mede een andere taal als voertaal worden gebezigd, indien de herkomst van de
      kinderen in specifieke omstandigheden daartoe noodzaakt, overeenkomstig een door de houder van het kindercentrum of
      van het gastouderbureau vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.55
  - number: 1.56.1
    text: |-
      De houder van een gastouderbureau organiseert zijn werkzaamheden op zodanige wijze, voorziet het bureau
      zowel kwalitatief als kwantitatief zodanig van personeel en materieel, draagt zorg voor een zodanige
      verantwoordelijkheidstoedeling en voert een zodanig beleid, dat een en ander leidt of redelijkerwijs moet leiden
      tot verantwoorde uitvoering van die werkzaamheden en tot naleving van [artikel 1.56b][ref1] door de gastouder.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.56.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de kwaliteit van
      gastouderbureaus, waaronder regels omtrent de opleidingseisen waaraan de beroepskrachten voldoen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56
  - number: 1.56.3
    text: |-
      Op de houder van een gastouderbureau en op de personen werkzaam bij een onderneming waarmee de houder een
      gastouderbureau exploiteert, is [artikel 1.50, derde tot en met tiende lid][ref1], van overeenkomstige toepassing.
      Op de houder van een gastouderbureau is [artikel 1.51][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.56.4
    text: |-
      Gastouderopvang geschiedt op basis van een schriftelijke overeenkomst tussen de houder van het gastouderbureau
      en de ouder. Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de inhoud van de
      overeenkomst.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56
  - number: 1.56.5
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat de uitvoeringskosten een bij die regeling vast te stellen
      maximum per nader te bepalen soort kosten niet te boven gaan.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56
  - number: 1.56.6
    text: |-
      Bij regeling van Onze Minister kunnen ten behoeve van een goede uitvoering van deze wet regels worden gesteld
      omtrent:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56
  - number: 1.56.6.a
    text: de administratie van gegevens bij gastouderbureaus;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56
  - number: 1.56.6.b
    text: het betalingsverkeer tussen gastouders, het gastouderbureau en ouders;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56
  - number: 1.56.6.c
    text: de informatieverstrekking door het gastouderbureau aan ouders.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56
  - number: 1.56.7
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over het minimum aantal uren ondersteuning dat een
      gastouderbureau jaarlijks verleent aan een gastouder.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56
  - number: 1.56a
    text: |-
      De houder van een gastouderbureau maakt ten behoeve van een goede uitvoering van de bij of krachtens deze afdeling
      gestelde regels gebruik van het burgerservicenummer van de ouder.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56a
  - number: 1.56b.1
    text: |-
      De gastouder beschikt over een zodanige deskundigheid, organiseert de gastouderopvang op zodanige wijze, voorziet
      de voorziening voor gastouderopvang zodanig van materieel en voert een zodanig pedagogisch beleid, dat een en
      ander leidt of redelijkerwijs moet leiden tot verantwoorde gastouderopvang. De gastouder houdt bij de uitvoering
      van de werkzaamheden rekening met de opgestelde risico-inventarisatie, bedoeld in [artikel 1.56, derde lid][ref1],
      juncto [artikel 1.51][ref2] en hij is verantwoordelijk voor de naleving van de meldcode, bedoeld in
      [artikel 1.51a, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.56b.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de kwaliteit van de
      gastouderopvang. Deze regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
  - number: 1.56b.2.a
    text: de veiligheid en de gezondheid;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
  - number: 1.56b.2.b
    text: de deskundigheidseisen waaraan de gastouder voldoet;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
  - number: 1.56b.2.c
    text: de groepsgrootte;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
  - number: 1.56b.2.d
    text: de accommodatie en de inrichting van de ruimte die bestemd is voor gastouderopvang;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
  - number: 1.56b.2.e
    text: de beschikbare ruimte voor kinderen;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
  - number: 1.56b.2.f
    text: het pedagogisch beleid en de pedagogische praktijk.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
  - number: 1.56b.3
    text: |-
      De gastouder en andere personen van 18 jaar of ouder die op hetzelfde woonadres als de houder van de voorziening
      voor gastouderopvang hun hoofdverblijf hebben, alsmede de daar werkzame vrijwilligers en stagiaires, zijn in het
      bezit van een verklaring omtrent het gedrag.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
  - number: 1.56b.4
    text: |-
      De houder van een gastouderbureau overlegt bij het indienen van de aanvraag, bedoeld in
      [artikel 1.45, tweede lid][ref1], de verklaringen omtrent het gedrag, bedoeld in het derde lid, aan het college,
      met uitzondering van de verklaring omtrent het gedrag van de gastouder die al een geregistreerde voorziening voor
      gastouderopvang exploiteert en met uitzondering van de verklaringen omtrent het gedrag van andere personen van 18
      jaar en ouder als bedoeld in het derde lid, indien die verklaringen omtrent het gedrag al zijn overgelegd bij een
      eerdere aanvraag tot exploitatie door de gastouder. De verklaringen omtrent het gedrag zijn op het moment van de
      indiening van de aanvraag niet ouder dan twee maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 1.56b.5
    text: |-
      Indien de houder van een gastouderbureau redelijkerwijs mag vermoeden dat een persoon als bedoeld in het derde lid
      niet langer voldoet aan de eisen voor het afgeven van een verklaring omtrent het gedrag, verlangt de houder al dan
      niet op verzoek van de toezichthouder dat die persoon opnieuw een verklaring omtrent het gedrag overlegt binnen
      een door de houder dan wel de toezichthouder vast te stellen termijn. Een verklaring omtrent het gedrag is op het
      moment van overlegging niet ouder dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
  - number: 1.56b.6
    text: |-
      De [artikelen 1.53][ref1] en [1.55][ref2] zijn van overeenkomstige toepassing op de gastouder.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.56b.7
    text: |-
      De verplichting van het vierde lid geldt voor een persoon die als stagiair werkzaam is de eerste maal voordat hij
      de werkzaamheden aanvangt en vervolgens uiterlijk iedere twee jaar, te rekenen vanaf de dag van afgifte van de
      meest actuele verklaring omtrent het gedrag. Bij iedere volgende houder ten behoeve waarvan de stagiair in die
      periode van maximaal twee jaar werkzaam is, overlegt hij telkens de meest actuele verklaring omtrent het gedrag.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
  - number: 1.56b.8
    text: |-
      De verplichting van het vierde lid geldt voor een persoon die als vrijwilliger werkzaam is de eerste maal voordat
      hij de werkzaamheden aanvangt en vervolgens uiterlijk iedere twee jaar, te rekenen vanaf de dag van de afgifte van
      de meest actuele verklaring omtrent het gedrag. Een verklaring omtrent het gedrag wordt aan het gastouderbureau
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
  - number: 1.56b.9
    text: |-
      Indien de toezichthouder redelijkerwijs mag vermoeden dat een persoon van 12 jaar of ouder die ten tijde van de
      opvang aanwezig is op het adres waar opvang door de gastouder plaatsvindt, niet zou voldoen aan de eisen voor het
      afgeven van een verklaring omtrent het gedrag, verlangt de toezichthouder dat de gastouder een verklaring omtrent
      het gedrag overlegt met betrekking tot die persoon binnen een door de toezichthouder vast te stellen termijn.
      Binnen die termijn is die persoon in het bezit van een verklaring omtrent het gedrag en legt de gastouder die
      verklaring omtrent het gedrag over aan de toezichthouder. Een verklaring omtrent het gedrag is op het moment van
      overlegging niet ouder dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
  - number: 1.56b.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten behoeve van een goede
      uitvoering van het derde tot en met het negende lid.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.56b
  - number: 1.57.1
    text: |-
      Indien de kinderopvang in een kindercentrum geschiedt uitsluitend en onbezoldigd door ten minste een van de ouders
      van de in die voorziening opgevangen kinderen worden voor de toepassing van [artikel 1.50, eerste lid][ref1],
      ouders gelijkgesteld met personeel en beroepskrachten. Op ouders, bedoeld in de eerste zin, is artikel 1.50, tweede
      lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.57
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.57.2
    text: De ouders, bedoeld in het eerste lid, zijn in het bezit van een verklaring omtrent het gedrag.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.57
  - number: 1.57.3
    text: |-
      De verklaring, bedoeld in het tweede lid, wordt aan de houder van een kindercentrum overgelegd, voordat de ouder,
      bedoeld in het eerste lid, zijn werkzaamheden aanvangt. Een verklaring omtrent het gedrag is bij aanvang van de
      werkzaamheden niet ouder dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.57
  - number: 1.57.4
    text: |-
      Indien de houder van een kindercentrum of de toezichthouder redelijkerwijs mag vermoeden dat een ouder, bedoeld in
      het eerste lid, niet langer voldoet aan de eisen voor het afgeven van een verklaring omtrent het gedrag verlangt
      de houder, al dan niet op verzoek van de toezichthouder, dat die persoon opnieuw een verklaring omtrent het gedrag
      overlegt binnen een door de houder dan wel de toezichthouder vast te stellen termijn. Een verklaring omtrent het
      gedrag is op het moment van overlegging niet ouder dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.57
  - number: 1.57.5
    text: |-
      De verplichting van het derde lid geldt voor een ouder als bedoeld in het eerste lid, de eerste maal voordat hij de
      werkzaamheden aanvangt en vervolgens uiterlijk iedere twee jaar, te rekenen vanaf de dag van afgifte van de meest
      actuele verklaring omtrent het gedrag.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.57
  - number: 1.57.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten behoeve van een goede
      uitvoering van het tweede tot en met het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.57
  - number: 1.57a.1
    text: |-
      Onze Minister kan beleidsregels stellen omtrent de toepassing van de [artikelen 1.49][ref1],
      [1.50, eerste lid][ref2], [1.51][ref3], [1.56, eerste en derde lid][ref4], en [1.56b, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.57a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.57a.2
    text: De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.57a
  - number: 1.58.1
    text: |-
      Een houder van een kindercentrum of van een gastouderbureau stelt voor elk door hem geëxploiteerd kindercentrum
      of gastouderbureau een oudercommissie in die tot taak heeft hem te adviseren over de aangelegenheden, genoemd in
      [artikel 1.60][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.58
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
  - number: 1.58.2
    text: |-
      De leden van de oudercommissie worden gekozen uit en door degenen wier kinderen in het kindercentrum of door
      tussenkomst van het gastouderbureau worden opgevangen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.58
  - number: 1.58.3
    text: |-
      Personen werkzaam bij een kindercentrum onderscheidenlijk gastouderbureau zijn geen lid van de oudercommissie van
      dat kindercentrum of gastouderbureau.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.58
  - number: 1.58.4
    text: De oudercommissie bepaalt haar eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.58
  - number: 1.59.1
    text: |-
      De houder van een kindercentrum of van een gastouderbureau stelt binnen zes maanden na de aanvraag, bedoeld in
      [artikel 1.45, eerste lid][ref1], voor de oudercommissie een reglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.59
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 1.59.2
    text: 'Het reglement bevat in ieder geval regels omtrent:'
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.59
  - number: 1.59.2.a
    text: het aantal leden van de oudercommissie;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.59
  - number: 1.59.2.b
    text: de wijze waarop de leden van de oudercommissie worden gekozen;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.59
  - number: 1.59.2.c
    text: de zittingsduur van de leden van de oudercommissie.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.59
  - number: 1.59.3
    text: Het reglement bevat geen regels omtrent de werkwijze van de oudercommissie.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.59
  - number: 1.59.4
    text: De oudercommissie beslist bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.59
  - number: 1.59.5
    text: Wijziging van het reglement behoeft instemming van de oudercommissie.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.59
  - number: 1.60.1
    text: |-
      De houder van een kindercentrum of van een gastouderbureau stelt de oudercommissie in ieder geval in de gelegenheid
      advies uit te brengen over elk voorgenomen besluit met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.60
  - number: 1.60.1.a
    text: |-
      de wijze waarop uitvoering wordt gegeven aan [artikel 1.50, eerste lid][ref1], of [artikel 1.56, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.60
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.60.1.b
    text: |-
      voedingsaangelegenheden van algemene aard en het algemene beleid op het gebied van opvoeding, veiligheid of
      gezondheid;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.60
  - number: 1.60.1.c
    text: openingstijden;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.60
  - number: 1.60.1.d
    text: |-
      het beleid met betrekking tot spel- en ontwikkelingsactiviteiten ten behoeve van de kinderen, waaronder het
      aanbieden van voorschoolse educatie;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.60
  - number: 1.60.1.e
    text: |-
      de vaststelling of wijziging van een regeling inzake de behandeling van klachten en het aanwijzen van personen die
      belast worden met de behandeling van klachten;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.60
  - number: 1.60.1.f
    text: wijziging van de prijs van kinderopvang.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.60
  - number: 1.60.2
    text: |-
      Van een advies als bedoeld in het eerste lid kan de houder van het kindercentrum of van het gastouderbureau slechts
      afwijken indien hij schriftelijk en gemotiveerd aangeeft dat het belang van de kinderopvang zich tegen het advies
      verzet.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.60
  - number: 1.60.3
    text: |-
      De oudercommissie is bevoegd de houder van een kindercentrum of van een gastouderbureau ook ongevraagd te adviseren
      over de onderwerpen, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.60
  - number: 1.60.4
    text: |-
      De houder van een kindercentrum of van een gastouderbureau verstrekt de oudercommissie tijdig en desgevraagd
      schriftelijk alle informatie die deze voor de vervulling van haar taak redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.60
  - number: 1.60a
    text: |-
      De houder van een kindercentrum of van een gastouderbureau treft een regeling voor de behandeling van klachten
      van de oudercommissie over een door hem genomen besluit als bedoeld in [artikel 1.60, eerste lid][ref1].
      De getroffen regeling waarborgt dat aan de behandeling van een klacht van de oudercommissie niet wordt
      deelgenomen door de houder van het kindercentrum of van het gastouderbureau of door een persoon die werkzaam
      is voor of bij de houder op wie die klacht betrekking heeft. De houder van het kindercentrum of van het
      gastouderbureau brengt de getroffen regeling op passende wijze onder de aandacht van de oudercommissie. De
      [artikelen 2, tweede tot en met vijfde lid, zevende lid, en negende lid][ref2], [2a][ref3], [3c][ref4] en
      [4 van de Wet klachtrecht cliënten zorgsector][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007414#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007414#Artikel2a
      [ref4]: https://wetten.overheid.nl/BWBR0007414#Artikel3c
      [ref5]: https://wetten.overheid.nl/BWBR0007414#Artikel4
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.60a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0007414
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007414
        artikel: 2a
      - id: ref4
        bwb_id: BWBR0007414
        artikel: 3c
      - id: ref5
        bwb_id: BWBR0007414
        artikel: '4'
  - number: 1.61.1
    text: |-
      Het college ziet toe op de naleving van de bij of krachtens [afdeling 3 van dit hoofdstuk][ref1] gestelde
      regels, onderscheidenlijk de krachtens [artikel 1.65][ref2] gegeven aanwijzingen en bevelen en de krachtens
      [artikel 1.66, eerste lid][ref3], gegeven bevelen tot sluiting dan wel de krachtens artikel 1.66, tweede lid,
      uitgevaardigde verboden en de in de bij [artikel 1.50b][ref4] vastgestelde algemene maatregel van bestuur
      vastgelegde basisvoorwaarden voor kwaliteit van voorschoolse educatie. Het college wijst de directeur van de GGD
      aan als toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.61
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.61.2
    text: |-
      Voor zover een kindercentrum een voorziening voor gastouderopvang of een gastouderbureau in een woning is
      gevestigd, zijn de toezichthouders ter uitvoering van de taken, bedoeld in het eerste lid, bevoegd zonder
      toestemming van de bewoners in die woning binnen te treden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.61
  - number: 1.62.1
    text: |-
      De toezichthouder onderzoekt na een aanvraag als bedoeld in [artikel 1.45, eerste of tweede lid][ref1], binnen
      een bij regeling van Onze Minister te stellen termijn of de exploitatie redelijkerwijs zal plaatsvinden in
      overeenstemming met het bepaalde bij of krachtens [afdeling 3, paragrafen 2][ref2] en [3, van dit hoofdstuk][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.62
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
  - number: 1.62.2
    text: |-
      Onverminderd het eerste lid onderzoekt de toezichthouder in redelijkheid bij ieder geregistreerd kindercentrum
      en geregistreerd gastouderbureau jaarlijks of de exploitatie in overeenstemming is met de bij of krachtens
      [afdeling 3, paragrafen 2][ref1] en [3, van dit hoofdstuk][ref2] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.62
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '4'
  - number: 1.62.3
    text: |-
      Onverminderd het eerste lid onderzoekt de toezichthouder in redelijkheid op grond van steekproeven jaarlijks of
      de exploitatie van geregistreerde voorzieningen voor gastouderopvang in overeenstemming is met de bij of krachtens
      [afdeling 3, paragrafen 2][ref1] en [3, van dit hoofdstuk][ref2] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.62
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '4'
  - number: 1.62.4
    text: |-
      Naast het onderzoek, bedoeld in het eerste, tweede en derde lid, kan de toezichthouder als daar aanleiding
      toe is incidenteel onderzoek verrichten naar de naleving door een houder van de bij of krachtens
      [afdeling 3, paragrafen 2][ref1] en [3, van dit hoofdstuk][ref2] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.62
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '4'
  - number: 1.62.5
    text: |-
      Indien tijdens een onderzoek als bedoeld in het tweede tot en met het vierde lid tekortkomingen zijn geconstateerd
      kan de toezichthouder nadien een of meer nadere onderzoeken verrichten.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.62
  - number: 1.63.1
    text: |-
      De toezichthouder legt zijn oordeel naar aanleiding van een onderzoek als bedoeld in
      [artikel 1.62, eerste tot en met vijfde lid][ref1] vast in een inspectierapport.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.63
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
  - number: 1.63.2
    text: |-
      Indien de toezichthouder oordeelt dat door de houder de bij of krachtens [afdeling 3, paragrafen 2][ref1] en
      [3][ref2], van dit hoofdstuk gegeven voorschriften niet zijn of zullen worden nageleefd, vermeldt hij dat in het
      rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.63
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '4'
  - number: 1.63.3
    text: |-
      Alvorens het rapport vast te stellen, stelt de toezichthouder de houder in de gelegenheid van het ontwerprapport
      kennis te nemen en daarover zijn zienswijze kenbaar te maken. De toezichthouder vermeldt de zienswijze van de
      houder in een bijlage bij het rapport. Dit lid is niet van toepassing op een inspectierapport dat wordt opgesteld
      naar aanleiding van een onderzoek als bedoeld in [artikel 1.62, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.63
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
  - number: 1.63.4
    text: 'De toezichthouder zendt het inspectierapport, bedoeld in het eerste lid, onverwijld aan:'
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.63
  - number: 1.63.4.a
    text: de houder van een kindercentrum,
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.63
  - number: 1.63.4.b
    text: de houder van een gastouderbureau en de gastouder indien het rapport betrekking heeft op de gastouder, of
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.63
  - number: 1.63.4.c
    text: de houder van een gastouderbureau, indien het rapport betrekking heeft op een gastouderbureau.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.63
  - number: 1.63.5
    text: De toezichthouder maakt het inspectierapport uiterlijk drie weken na de vaststelling daarvan openbaar.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.63
  - number: 1.63.6
    text: |-
      De toezichthouder zendt een afschrift van het inspectierapport naar aanleiding van een onderzoek bij een
      kindercentrum waar voorschoolse educatie wordt aangeboden aan het college en aan de Inspectie van het onderwijs,
      indien met betrekking tot een of meer van de basisvoorwaarden voor kwaliteit van voorschoolse educatie, bedoeld in
      [artikel 1.61, eerste lid][ref1], tekortkomingen zijn geconstateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.63
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
  - number: 1.64.1
    text: |-
      Onze Minister kan beleidsregels stellen omtrent de door de toezichthouder te hanteren werkwijze voor een onderzoek
      als bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.64
  - number: 1.64.2
    text: De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.64
  - number: 1.65.1
    text: |-
      Het college van de gemeente waarin zich een kindercentrum, een voorziening voor gastouderopvang of een
      gastouderbureau bevindt dat de bij of krachtens [afdeling 3, paragrafen 2][ref1] en [3][ref2], van dit hoofdstuk
      gegeven voorschriften niet of in onvoldoende mate naleeft, kan de houder een schriftelijke aanwijzing geven.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.65
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '4'
  - number: 1.65.2
    text: |-
      In een aanwijzing als bedoeld in het eerste lid geeft het college met redenen omkleed aan op welke punten de in het
      eerste lid bedoelde voorschriften niet of in onvoldoende mate worden nageleefd, alsmede de in verband daarmee te
      nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.65
  - number: 1.65.3
    text: |-
      De toezichthouder kan een schriftelijk bevel geven aan een kindercentrum, gastouderbureau of voorziening voor
      gastouderopvang indien hij oordeelt:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.65
  - number: 1.65.3.a
    text: |-
      dat de kwaliteit van de kinderopvang bij een kindercentrum of een voorziening voor gastouderopvang zodanig
      tekortschiet dat het nemen van maatregelen redelijkerwijs geen uitstel kan lijden; of
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.65
  - number: 1.65.3.b
    text: |-
      dat de kwaliteit van een gastouderbureau zodanig tekort schiet, en daardoor het risico bestaat dat ook de kwaliteit
      van de gastouderopvang in gevaar komt, dat het nemen van maatregelen redelijkerwijs geen uitstel kan lijden.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.65
  - number: 1.65.4
    text: |-
      Het bevel, bedoeld in het derde lid, heeft een geldigheidsduur van zeven dagen, welke door het college kan worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.65
  - number: 1.65.5
    text: De houder neemt de maatregelen binnen de bij de aanwijzing onderscheidenlijk het bevel gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.65
  - number: 1.66.1
    text: |-
      Het college kan de houder verbieden de exploitatie van een kindercentrum, een voorziening voor gastouderopvang of
      een gastouderbureau voort te zetten, zolang hij een bevel of aanwijzing niet opvolgt en het opleggen van een last
      onder bestuursdwang niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.66
  - number: 1.66.2
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 1.62][ref1] of anderszins blijkt dat het kindercentrum, de
      voorziening voor gastouderopvang of het gastouderbureau naar verwachting niet dan wel niet langer aan de bij of
      krachtens [afdeling 3, paragraaf 2][ref2], van dit hoofdstuk gegeven voorschriften zal voldoen, kan het college
      zolang die situatie zich voordoet, de houder verbieden dat kindercentrum, die voorziening voor gastouderopvang of
      dat gastouderbureau in exploitatie te nemen of te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.66
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.67a
    text: |-
      De Belastingdienst/Toeslagen verstrekt aan de GGD kosteloos de gegevens en inlichtingen waarvan de kennisneming van
      belang kan zijn voor het toezicht op de naleving van de bij of krachtens [hoofdstuk 1][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.67a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '1'
  - number: 1.68.1
    text: |-
      Het college verstrekt desgevraagd aan Onze Minister gegevens en inlichtingen die hij voor de informatievoorziening
      en beleidsvorming en de statistiek met betrekking tot hoofdstuk 1 van deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.68
  - number: 1.68.2
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de informatie die het college
      verstrekt over de uitvoering van zijn werkzaamheden op grond van dit hoofdstuk en de wijze waarop het college de
      gegevens en inlichtingen verstrekt en verzamelt en of en op welke wijze deze informatie openbaar wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.68
  - number: 1.68.3
    text: De gegevens en inlichtingen, bedoeld in het eerste lid, worden kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.68
  - number: 1.72.1
    text: |-
      Het college kan de houder die een verplichting als bedoeld bij of krachtens [afdeling 3 van dit hoofdstuk][ref1],
      een afspraak als bedoeld in [artikel 167 van de Wet op het primair onderwijs][ref2], een aanwijzing
      onderscheidenlijk een bevel als bedoeld in [artikel 1.65][ref3] of een vordering tot medewerking als bedoeld
      in [artikel 5:20 van de Algemene wet bestuursrecht][ref4] niet nakomt dan wel handelt in strijd met een verbod
      krachtens [artikel 1.66][ref5], een bestuurlijke boete opleggen van ten hoogste € 45 000.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel167
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.72
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '167'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
  - number: 1.72.2
    text: |-
      In afwijking van het eerste lid kan de overtreding van de houder niet met een bestuurlijke boete worden afgedaan,
      indien de overtreding opzettelijk of roekeloos geschiedt en een direct gevaar voor de gezondheid of de veiligheid
      van personen tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.72
  - number: '1.80'
    text: |-
      Indien het college voornemens is een bestuurlijke boete op te leggen, geeft hij de overtreder daarvan kennis onder
      de vermelding van de gronden waarop het voornemen berust en overlegging van het rapport.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.80
  - number: 1.87.1
    text: |-
      Bij algemene maatregel van bestuur kunnen voor een periode van ten hoogste vier jaar ten behoeve van experimenten,
      die ten doel hebben de totstandkoming van innovatieve kinderopvang mogelijk te maken, vormen van kinderopvang
      worden aangewezen en kunnen regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.87
  - number: 1.87.1.a
    text: de kwaliteit van de aan te wijzen vormen van kinderopvang;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.87
  - number: 1.87.1.b
    text: het toezicht op de naleving van de regels, bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.87
  - number: 1.87.1.c
    text: de hoogte van de kinderopvangtoeslag;
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.87
  - number: 1.87.1.d
    text: de duur van de aan te wijzen vormen van kinderopvang als experiment.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.87
  - number: 1.87.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorwaarden worden gesteld aan de deelname aan een
      experiment.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.87
  - number: 1.87.3
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid heeft een ouder als bedoeld in [artikel 1.6][ref1] aanspraak op
      een kinderopvangtoeslag in de door hem of zijn partner te betalen kosten, indien het betreft een experimentele vorm
      van kinderopvang, welke is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.87
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1.87.4
    text: |-
      Bij algemene maatregel van bestuur kunnen experimenten als bedoeld in het eerste lid na afloop van de looptijd
      worden voortgezet tot een structurele regeling is getroffen, doch niet langer dan met een tijdsduur van ten hoogste
      twee jaar. Het eerste, tweede en derde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.87
  - number: 1.88.1
    text: |-
      Onze Minister zendt na overleg met Onze Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn
      en Sport uiterlijk zes maanden voor de beëindiging van een experiment, als bedoeld in [artikel 1.87][ref1],
      een verslag over de doeltreffendheid en de effecten ervan alsmede een standpunt inzake de voortzetting van de
      desbetreffende regeling, anders dan als experiment, aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.88
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: 1.88.2
    text: |-
      Indien een experiment als bedoeld in [artikel 1.87][ref1], eerder wordt beëindigd dan de bij algemene maatregel van
      bestuur, bedoeld in het eerste lid van dat artikel, daarvoor gestelde duur, zendt Onze Minister na overleg met Onze
      Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn en Sport, in afwijking van het eerste lid,
      uiterlijk twee maanden na de beëindiging van dat experiment een verslag over de doeltreffendheid en de effecten
      ervan alsmede een standpunt inzake de voortzetting van de desbetreffende regeling, anders dan als experiment, aan
      de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel1.88
