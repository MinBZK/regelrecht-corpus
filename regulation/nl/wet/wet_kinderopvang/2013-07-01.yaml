        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.8c.2
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen dat een besluit in verband met een tegemoetkoming als bedoeld in
      [artikel 1.29][ref1], zoals dat luidde op 31 december 2012, voor een berekeningsjaar dat voorafgaat aan 2013 heeft
      genomen waartegen een bezwaarschrift is ingediend dan wel nog kan worden ingediend, blijft bevoegd op het bezwaar
      te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2013-07-01#Artikel3.8c
    references:
