        paragraaf: '2'
        afdeling: '3'
  - number: 1.60.5
    text: |-
      De houder van een kindercentrum of van een gastouderbureau verstrekt de oudercommissie tijdig en desgevraagd
      schriftelijk alle informatie die deze voor de vervulling van haar taak redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.60
  - number: 1.60.6
    text: |-
      Na vaststelling door de toezichthouder van het inspectierapport, bedoeld in [artikel 1.63, eerste lid][ref1],
      bespreekt de houder van een kindercentrum of van een gastouderbureau dit rapport met de oudercommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.60
    references:
