        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.2b
    text: |-
      [Artikel 1.6, tweede en derde lid][ref1], zoals dat luidde voor het tijdstip van inwerkingtreding van artikel
      I, onderdelen C en D, van de Wet van 2 december 2020 tot wijziging van de Wet Kinderopvang in verband met enkele
      wijzigingen met betrekking tot het recht op kinderopvangtoeslag (Stb. 2020, 518) blijft tot een jaar na dat
      tijdstip van toepassing, indien de ouder:


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel3.2b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 3.2b.a
    text: op de dag voor dat tijdstip aanspraak had op kinderopvangtoeslag, en
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel3.2b
  - number: 3.2b.b
    text: |-
      hij of zijn partner op dat tijdstip arbeid verrichtte, niet zijnde tegenwoordige arbeid waaruit inkomen uit werk en
      woning in de zin van de [Wet inkomstenbelasting 2001][ref1] wordt genoten dan wel inkomen dat hiermee gelijkgesteld
      wordt op grond van [artikel 1.6, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel3.2b
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 3.3.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, het college en de gemeenteraad verstrekken aan Onze Minister de
      gegevens en inlichtingen die hij voor de statistiek, de informatievoorziening en de beleidsvorming met betrekking
      tot deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel3.3
  - number: 3.3.2
    text: |-
      Bij regeling van Onze Minister kunnen regels gesteld worden omtrent de aard van de gegevens en inlichtingen,
      bedoeld in het eerste lid, en de wijze waarop deze worden verstrekt en verzameld en, voor zover het betreft het
      college, of en op welke wijze deze informatie openbaar wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel3.3
  - number: 3.3.3
    text: De gegevens en inlichtingen, bedoeld in het eerste lid, worden kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel3.3
  - number: '3.4'
    text: |-
      De voordracht voor een krachtens de [artikelen 1.6, zevende lid][ref1], [1.7, tweede tot en met vierde lid][ref2],
      [1.8][ref3], [1.50, tweede lid][ref4], [1.56, tweede lid][ref5], [1.56b, tweede lid][ref6], en [1.87][ref7] vast te
      stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers
      der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
