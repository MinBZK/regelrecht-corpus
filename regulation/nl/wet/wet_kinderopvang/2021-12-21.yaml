  - number: 1.72.2
    text: |-
      In afwijking van het eerste lid kan de overtreding niet met een bestuurlijke boete worden afgedaan, indien de
      overtreding opzettelijk of roekeloos geschiedt en een direct gevaar voor de gezondheid of de veiligheid van
      personen tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.72
  - number: '1.80'
    text: |-
      Indien het college voornemens is een bestuurlijke boete op te leggen, geeft hij de overtreder daarvan kennis onder
      de vermelding van de gronden waarop het voornemen berust en overlegging van het rapport.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.80
  - number: 1.81.1
    text: |-
      Indien het college de houder in het kader van het toezicht op de naleving van de verplichtingen op basis van dit
      hoofdstuk:
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.81
  - number: 1.81.1.a
    text: |-
      een sanctie als bedoeld in [hoofdstuk 5 van de Algemene wet bestuursrecht][ref1] oplegt;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.81
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '5'
  - number: 1.81.1.b
    text: |-
      een aanwijzing als bedoeld in [artikel 1.65][ref1] geeft,


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.81
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
  - number: 1.81.1.c
    text: |-
      een verbod tot exploitatie als bedoeld in [artikel 1.66][ref1] oplegt; of


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.81
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
  - number: 1.81.1.d
    text: |-
      een bestuurlijke boete als bedoeld in [artikel 1.72][ref1] oplegt;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.81
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '5'
  - number: 1.81.2
    text: |-
      De vermelding, bedoeld in het eerste lid, betreft het karakter van de sanctie of van de maatregel, alsmede een
      beschrijving van de verplichting die niet is nagekomen.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.81
  - number: 1.81.3
    text: |-
      Op verzoek verstrekt het college een afschrift van het besluit, bedoeld in het eerste lid, waarin de tot
      natuurlijke personen herleidbare gegevens, geanonimiseerd worden, met uitzondering van het woonadres van de houder
      wanneer opvang plaats vindt op dat woonadres.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.81
  - number: 1.81.4
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.81
  - number: 1.87.1
    text: |-
      Bij algemene maatregel van bestuur kunnen voor een periode van ten hoogste vier jaar ten behoeve van experimenten,
      die ten doel hebben de totstandkoming van innovatieve kinderopvang mogelijk te maken, vormen van kinderopvang
      worden aangewezen en kunnen regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.87
  - number: 1.87.1.a
    text: de kwaliteit van de aan te wijzen vormen van kinderopvang;
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.87
  - number: 1.87.1.b
    text: het toezicht op de naleving van de regels, bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.87
  - number: 1.87.1.c
    text: de hoogte van de kinderopvangtoeslag;
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.87
  - number: 1.87.1.d
    text: de duur van de aan te wijzen vormen van kinderopvang als experiment.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.87
  - number: 1.87.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorwaarden worden gesteld aan de deelname aan een
      experiment.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.87
  - number: 1.87.3
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid heeft een ouder als bedoeld in [artikel 1.6][ref1] aanspraak op
      een kinderopvangtoeslag in de door hem of zijn partner te betalen kosten, indien het betreft een experimentele vorm
      van kinderopvang, welke is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.87
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1.87.4
    text: |-
      Bij algemene maatregel van bestuur kunnen experimenten als bedoeld in het eerste lid na afloop van de looptijd
      worden voortgezet tot een structurele regeling is getroffen, doch niet langer dan met een tijdsduur van ten hoogste
      twee jaar. Het eerste, tweede en derde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.87
  - number: 1.88.1
    text: |-
      Onze Minister zendt na overleg met Onze Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn
      en Sport uiterlijk zes maanden voor de beëindiging van een experiment, als bedoeld in [artikel 1.87][ref1],
      een verslag over de doeltreffendheid en de effecten ervan alsmede een standpunt inzake de voortzetting van de
      desbetreffende regeling, anders dan als experiment, aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.88
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: 1.88.2
    text: |-
      Indien een experiment als bedoeld in [artikel 1.87][ref1], eerder wordt beëindigd dan de bij algemene maatregel van
      bestuur, bedoeld in het eerste lid van dat artikel, daarvoor gestelde duur, zendt Onze Minister na overleg met Onze
      Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn en Sport, in afwijking van het eerste lid,
      uiterlijk twee maanden na de beëindiging van dat experiment een verslag over de doeltreffendheid en de effecten
      ervan alsmede een standpunt inzake de voortzetting van de desbetreffende regeling, anders dan als experiment, aan
      de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.88
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        afdeling: '6'
  - number: '3.1'
    text: |-
      De inschrijvingen van de voorzieningen, bedoeld in [artikel 1.48, eerste en tweede lid][ref1], die op 1 januari
      2014 in het register buitenlandse kinderopvang staan opgenomen vervallen van rechtswege met ingang van 1 januari
      2018.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 3.2.1
    text: |-
      Onze Minister verwerkt de gegevens van de personen die op basis van de artikelen 9a en 9b van het Besluit landelijk
      register kinderopvang en register buitenlandse kinderopvang onder de continue screening vallen vanaf de datum
      van inwerkingtreding van [artikel 1.48d][ref1] tot een bij ministeriële regeling te bepalen tijdstip in het
      personenregister kinderopvang. Deze personen kunnen bij hun inschrijving gebruik maken van hun bestaande verklaring
      omtrent het gedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 3.2.2
    text: |-
      Bij de personen, bedoeld in het eerste lid, en bij de overige personen die op grond van de
      [artikelen 1.50, derde lid][ref1], [1.56, derde lid][ref2] en [1.56b, derde lid][ref3], in het bezit dienen te zijn
      van een verklaring omtrent het gedrag, worden in verband met de verwerking van hun gegevens in het personenregister
      kinderopvang tot een bij ministeriële regeling te bepalen tijdstip geen kosten in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
