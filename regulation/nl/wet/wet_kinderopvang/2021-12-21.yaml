        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '3'
  - number: 1.66a.1
    text: 'De geschillencommissie verricht haar werkzaamheden op basis van een reglement dat ten minste waarborgt dat:'
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66a
  - number: 1.66a.1.a
    text: 'aan de geschillencommissie een geschil kan worden voorgelegd door een ouder:'
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66a
  - number: 1.66a.1.a.1°
    text: |-
      die na de indiening van een klacht bij de houder van een kindercentrum of een gastouderbureau niet tijdig een
      oordeel heeft ontvangen als bedoeld in [artikel 1.57b, tweede lid, onderdeel e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.66a.1.a.2°
    text: die een klacht in tweede aanleg wil laten beoordelen;
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66a
  - number: 1.66a.1.a.3°
    text: |-
      voor wie behandeling van een klacht overeenkomstig een schriftelijke regeling als bedoeld in
      [artikel 1.57b, eerste lid][ref1], niet gewaarborgd is door het ontbreken van die regeling of doordat de regeling
      niet aan artikel 1.57b, tweede lid, voldoet, of


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.66a.1.a.4°
    text: |-
      van wie in redelijkheid niet kan worden verlangd dat hij onder de gegeven omstandigheden een klacht bij de houder
      van een kindercentrum of van een gastouderbureau indient;
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66a
  - number: 1.66a.1.b
    text: de geschillencommissie bevoegd is over een geschil door middel van een bindend advies een uitspraak te doen;
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66a
  - number: 1.66a.1.c
    text: de geschillencommissie uiterlijk binnen zes maanden na de voorlegging van het geschil uitspraak doet;
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66a
  - number: 1.66a.1.d
    text: |-
      de geschillencommissie in afwijking van onderdeel c op kortere termijn na voorlegging van het geschil uitspraak
      doet in gevallen waarin dat, gelet op de aard van het geschil en de daarbij betrokken belangen, is aangewezen;
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66a
  - number: 1.66a.1.e
    text: |-
      de geschillencommissie de uitspraken over de aan haar voorgelegde geschillen openbaar maakt, zodanig dat deze niet
      tot natuurlijke- of rechtspersonen herleidbaar zijn, en
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66a
  - number: 1.66a.1.f
    text: |-
      de geschillencommissie uit ten minste drie leden, waaronder een voorzitter bestaat, en deze leden niet werkzaam
      zijn voor of bij de houder op wie het geschil betrekking heeft noch anderszins in directe relatie tot de
      betreffende ouder of houder staan.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66a
  - number: 1.66a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot
      geschillenbeslechting door de geschillencommissie en het reglement, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66a
  - number: 1.66b.1
    text: |-
      Indien de oudercommissie een geschil met de houder over de toepassing en de uitvoering van [artikel 1.60][ref1]
      door de houder aan de geschillencommissie voorlegt, toetst de geschillencommissie uitsluitend of de houder bij
      afweging van de betrokken belangen in redelijkheid heeft gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
  - number: 1.66b.2
    text: 'Indien de geschillencommissie de oudercommissie in het gelijk stelt, kan zij in haar uitspraak tevens bepalen dat:'
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66b
  - number: 1.66b.2.a
    text: de houder zijn besluit geheel of ten dele intrekt;
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66b
  - number: 1.66b.2.b
    text: een of meer gevolgen van dat besluit ongedaan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66b
  - number: 1.66b.3
    text: |-
      Indien de houder gebruik maakt van de in [artikel 1.58, tweede en derde lid][ref1], geboden alternatieve vorm van
      ouderbetrokkenheid kan, indien deze vorm zich daarvoor leent, bij algemene maatregel van bestuur worden bepaald,
      dat deze vorm voor de toepassing van het eerste en tweede lid en [artikel 1.57c][ref2] gelijk wordt gesteld met een
      oudercommissie. Hieraan kunnen voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: 1.66b.4
    text: |-
      Indien gebruik is gemaakt van de in [artikel 1.58, tweede en derde lid][ref1], geboden alternatieve vorm
      van ouderbetrokkenheid, maar deze vorm zich niet leent voor de toepassing van het eerste en tweede lid en
      [artikel 1.57c][ref2], kan in plaats daarvan een ouder een geschil over de toepassing en uitvoering van
      [artikel 1.60][ref3] aan de geschillencommissie voorleggen en zijn het eerste en tweede lid en artikel 1.57c zoveel
      mogelijk van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
  - number: 1.67a
    text: |-
      De Belastingdienst/Toeslagen verstrekt aan de GGD kosteloos de gegevens en inlichtingen waarvan de kennisneming van
      belang kan zijn voor het toezicht op de naleving van de bij of krachtens [hoofdstuk 1][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.67a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '1'
  - number: 1.72.1
    text: |-
      Het college kan degene die een verplichting als bedoeld bij of krachtens de [artikelen 1.45, derde lid][ref1],
      [1.47, eerste lid][ref2], [1.48d, tweede en derde lid][ref3], [1.49 tot en met 1.59][ref4], [1.60a][ref5] en
      [1.60c][ref6], een afspraak als bedoeld in [artikel 167 van de Wet op het primair onderwijs][ref7], een aanwijzing
      onderscheidenlijk een bevel als bedoeld in [artikel 1.65][ref8] of een vordering tot medewerking als bedoeld in
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref9] niet nakomt dan wel handelt in strijd met een
      verbod krachtens [artikel 1.66][ref10], een bestuurlijke boete opleggen van ten hoogste € 45 000.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
