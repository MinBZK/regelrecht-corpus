  - number: 1.6.2
    text: |-
      Een ouder die niet in Nederland woont, heeft slechts aanspraak op een kinderopvangtoeslag indien hij in een andere
      lidstaat of Zwitserland woont en, daartoe gerechtigd, in Nederland of op het continentaal plat tegenwoordige arbeid
      verricht waaruit inkomen uit werk en woning in de zin van de [Wet inkomstenbelasting 2001][ref1] wordt genoten of
      een uitkering ontvangt als bedoeld in het eerste lid, onder c, e, h of i, en gebruik maakt van een in één van die
      onderdelen bedoelde voorziening gericht op arbeidsinschakeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 1.6.3
    text: |-
      Een ouder met een partner heeft slechts aanspraak op een kinderopvangtoeslag, indien de partner in Nederland, een
      andere lidstaat of Zwitserland woont, en
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
  - number: 1.6.3.a
    text: |-
      in Nederland of op het continentaal plat, in een andere lidstaat of in Zwitserland tegenwoordige arbeid verricht
      waaruit inkomen uit werk en woning in de zin van de [Wet inkomstenbelasting 2001][ref1] wordt genoten,


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 1.6.3.b
    text: |-
      een uitkering ontvangt als bedoeld in het eerste lid, onder c, e, h of i, en gebruik maakt van een in één
      van die onderdelen bedoelde voorziening gericht op arbeidsinschakeling of een daarmee vergelijkbare uitkering
      respectievelijk voorziening, vastgesteld krachtens de wetgeving van een andere lidstaat of Zwitserland,
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
  - number: 1.6.3.c
    text: een persoon is als bedoeld in het eerste lid, onder f, g, j, k of l,
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
  - number: 1.6.3.d
    text: een persoon is als bedoeld in het eerste lid, onder b.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
  - number: 1.6.4
    text: |-
      Voor de toepassing van deze wet wordt met inkomen uit werk en woning als bedoeld in het eerste lid, onderdeel a
      en het derde lid, onderdeel a, gelijkgesteld een daarmee overeenkomend inkomen dat niet tot het verzamelinkomen
      van de ouder of het verzamelinkomen van de partner behoort omdat het niet behoort tot het Nederlands inkomen als
      bedoeld in [hoofdstuk 7 van de Wet inkomstenbelasting 2001][ref1], of is vrijgesteld op grond van bepalingen van
      internationaal recht.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '7'
  - number: 1.6.5
    text: |-
      Een ouder of zijn partner die in een berekeningsjaar of in het daaraan voorafgaande berekeningsjaar tegenwoordige
      arbeid heeft verricht als bedoeld in het eerste lid, onderdeel a of b, of derde lid, onderdeel a of d, behoudt
      gedurende drie kalendermaanden, gerekend vanaf de eerste dag na de dag waarop het verrichten van die arbeid
      is beëindigd, dezelfde aanspraak op een kinderopvangtoeslag als voor die beëindiging. Indien de periode van
      drie maanden, bedoeld in de vorige zin, samenvalt met de periode die loopt van 28 dagen voor de datum van de
      vermoedelijke bevalling van de persoon, wiens arbeid is beëindigd, tot 42 dagen na diens bevalling, wordt de
      periode, bedoeld in de vorige zin, verlengd met de periode waarin deze perioden samenvielen.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
  - number: 1.6.6
    text: 'Het derde lid is niet van toepassing op een ouder met een partner indien de partner:'
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
  - number: 1.6.6.a
    text: in Nederland, een andere lidstaat of Zwitserland woont,
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
  - number: 1.6.6.b
    text: |-
      op grond van [artikel 1.2, eerste lid, onderdeel e, van de Wet inkomstenbelasting 2001][ref1] of
      [artikel 3, tweede lid, onderdeel e, van de Algemene wet inkomensafhankelijke regelingen][ref2] partner is van de
      ouder, en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel3
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '3'
  - number: 1.6.6.c
    text: bloed- of aanverwant is van de ouder in de rechte lijn of in de tweede graad van de zijlijn.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
  - number: 1.6.7
    text: |-
      Indien de tegenwoordige arbeid, als bedoeld in het eerste lid, onderdeel a of b, of derde lid, onderdeel a
      of d, van een ouder of zijn partner in een bij algemene maatregel van bestuur te bepalen berekeningsjaar is
      beëindigd, behoudt de ouder in afwijking van het vijfde lid, gedurende zes kalendermaanden dezelfde aanspraak
      op een kinderopvangtoeslag indien sprake van omstandigheden als bedoeld in het vijfde lid. Indien de periode
      van zes maanden, bedoeld in de vorige zin, samenvalt met de periode die loopt van 28 dagen voor de datum van
      de vermoedelijke bevalling van de persoon, wiens arbeid is beëindigd, tot 42 dagen na diens bevalling, wordt de
      periode, bedoeld in de vorige zin, verlengd met de periode waarin deze perioden samenvielen.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
  - number: 1.6.8
    text: |-
      Een ouder als bedoeld in het eerste en tweede lid, met een partner, heeft voor een berekeningsjaar aanspraak op een
      kinderopvangtoeslag, indien de partner in Nederland, een andere lidstaat of Zwitserland woont en een verzekerde is
      die recht op zorg heeft op grond van [artikel 3.2.1, eerste lid, van de Wet langdurige zorg][ref1] of op grond van
      [artikel 11.1.1, van de Wet langdurige zorg][ref2] is gelijkgesteld met een verzekerde ten aanzien van wie het CIZ
      heeft vastgesteld dat hij voldoet aan artikel 3.2.1, eerste lid, van de Wet langdurige zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel11
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0035917
        artikel: '11'
  - number: 1.6.9
    text: |-
      Een ouder die een verzekerde is die recht op zorg heeft op grond van
      [artikel 3.2.1, eerste lid, van de Wet langdurige zorg][ref1] of op grond van
      [artikel 11.1.1 van de Wet langdurige zorg ][ref2]is gelijkgesteld met een verzekerde ten aanzien van wie het
      CIZ heeft vastgesteld dat hij voldoet aan artikel 3.2.1, eerste lid, van de Wet langdurige zorg, heeft voor een
      berekeningsjaar aanspraak op een kinderopvangtoeslag, indien de ouder een partner heeft die in Nederland, een
      andere lidstaat of Zwitserland woont, en


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel11
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0035917
        artikel: '11'
  - number: 1.6.9.a
    text: |-
      in Nederland of op het continentaal plat, in een andere lidstaat of in Zwitserland, tegenwoordige arbeid verricht
      waaruit inkomen uit werk en woning in de zin van de [Wet inkomstenbelasting 2001][ref1] wordt genoten;


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 1.6.9.b
    text: |-
      een uitkering ontvangt als bedoeld in het eerste lid, onder c, e, h of i, en gebruik maakt van een in één
      van die onderdelen bedoelde voorziening gericht op arbeidsinschakeling of een daarmee vergelijkbare uitkering
      respectievelijk voorziening, vastgesteld krachtens de wetgeving van een andere lidstaat of Zwitserland; of
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
  - number: 1.6.9.c
    text: een persoon is als bedoeld in het eerste lid, onder b, f, g, j, k of l.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6
  - number: 1.6a
    text: |-
      In afwijking van de [artikelen 1.5][ref1] en [1.6][ref2], heeft een ouder als bedoeld in artikel 1.6, eerste lid,
      onderdeel a, voor zover die ouder de arbeid verricht als gastouder, geen aanspraak op een kinderopvangtoeslag
      in de door hem of zijn partner te betalen kosten van gastouderopvang in een geregistreerde voorziening voor
      gastouderopvang.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.6a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1.7.1
    text: 'De hoogte van de kinderopvangtoeslag is afhankelijk van:'
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.7
  - number: 1.7.1.a
    text: de draagkracht, en
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.7
  - number: 1.7.1.b
    text: 'de kosten van kinderopvang per kind die worden bepaald door:'
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.7
  - number: 1.7.1.b.1º
    text: het aantal uren kinderopvang per kind in het berekeningsjaar,
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.7
  - number: 1.7.1.b.2º
    text: de voor die kinderopvang te betalen prijs, met inachtneming van het bedrag, bedoeld in het tweede lid, en
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.7
  - number: 1.7.1.b.3º
    text: de soort kinderopvang.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.7
  - number: 1.7.2
    text: |-
      De uurprijs die bij de hoogte van de kinderopvangtoeslag, bedoeld in het eerste lid, in aanmerking wordt genomen
      gaat een bij algemene maatregel van bestuur vast te stellen bedrag niet te boven. Dat bedrag kan per opvangsoort
      verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.7
  - number: 1.7.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de redelijke verhouding tussen het aantal
      uren dat de ouder en zijn partner arbeid verrichten, gebruik maken van een voorziening die gericht is op
      arbeidsinschakeling, of scholing, een opleiding of een cursus volgen, alsmede de in verband daarmee benodigde
      reistijd, en het aantal uren kinderopvang waarvoor kinderopvangtoeslag kan worden aangevraagd.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.7
  - number: 1.7.4
    text: |-
      Het aantal uren kinderopvang dat in aanmerking wordt genomen bij de hoogte van de kinderopvangtoeslag, bedoeld in
      het eerste lid, gaat een bij algemene maatregel van bestuur vast te stellen maximum, dat per soort kinderopvang of
      per leeftijdsgroep verschillend kan worden vastgesteld, niet te boven.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.7
  - number: 1.8.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de hoogte en de
      berekeningswijze van de kinderopvangtoeslag, waarbij tabellen worden vastgesteld waaruit de relatie tussen de
      kosten van kinderopvang en de kinderopvangtoeslag kan worden afgelezen en waarbij tevens wordt bepaald in welke
      gevallen de ouder aanspraak heeft op een kinderopvangtoeslag die 33,3 procent of minder bedraagt van de kosten van
      kinderopvang, bedoeld in [artikel 1.7, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1.8.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de hoogte van het bedrag dat als vaste eigen
      bijdrage van de ouder in mindering wordt gebracht op de kinderopvangtoeslag. Daarbij kunnen het toetsingsinkomen
      van de ouder en zijn partner, de aanwezigheid van een partner en het aantal kinderen in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.8
  - number: 1.9.1
    text: |-
      De bedragen, bedoeld in [artikel 1.7, tweede lid][ref1], de mate waarin het toetsingsinkomen van de ouder en,
      indien hij een partner heeft, dat van zijn partner een rol speelt bij de hoogte van de kinderopvangtoeslag, en
      het bedrag, bedoeld in [artikel 1.8, tweede lid][ref2], worden bij het begin van het kalenderjaar bij of krachtens
      algemene maatregel van bestuur gewijzigd aan de hand van een bij algemene maatregel van bestuur aan te wijzen index
      ter zake van lonen of prijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1.9.2
    text: 'De overeenkomstig het eerste lid aangepaste bedragen treden in de plaats van de bedragen:'
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.9
  - number: 1.9.2.a
    text: |-
      bedoeld in de [artikelen 1.7, tweede lid][ref1], en [1.8, tweede lid][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1.9.2.b
    text: die voortvloeien uit de mate waarin het toetsingsinkomen een rol speelt bij de hoogte van de kinderopvangtoeslag.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.9
  - number: 1.10.1
    text: |-
      De financiële middelen tot dekking van de uitgaven voor de kinderopvangtoeslag kunnen mede worden verkregen door het
      heffen van een opslag op de premie, bedoeld in [artikel 36 van de Wet financiering sociale verzekeringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel36
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '36'
  - number: 1.10.2
    text: De premieopslag, bedoeld in het eerste lid, is verschuldigd door de werkgever.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.10
  - number: 1.10.3
    text: |-
      De premieopslag wordt vastgesteld bij ministeriële regeling.
      [Artikel 35 van de Wet financiering sociale verzekeringen][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel35
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '35'
  - number: 1.10.4
    text: |-
      Op de heffing en invordering van de premieopslag zijn de [artikelen 57][ref1], [59][ref2] en
      [60 van de Wet financiering sociale verzekeringen][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel60
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '59'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '60'
  - number: '1.11'
    text: |-
      De kinderopvangtoeslag blijft buiten beschouwing bij de verlening van andere op het inkomen of vermogen afgestemde
      publiekrechtelijke uitkeringen en verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.11
  - number: '1.13'
    text: |-
      Het college kan aan een ouder als bedoeld in [artikel 1.6, eerste lid, onderdelen c, e, j, k of l][ref1],
      een tegemoetkoming verstrekken in aanvulling op de kinderopvangtoeslag, zodanig dat het totaal van de
      kinderopvangtoeslag en de tegemoetkoming niet meer bedraagt dan de kosten van kinderopvang, bedoeld in
      [artikel 1.7, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1.45.1
    text: |-
      Degene die voornemens is een kindercentrum of gastouderbureau in exploitatie te nemen, doet daarvoor een aanvraag
      bij het college.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.45
  - number: 1.45.2
    text: |-
      De houder van een gastouderbureau dient een aanvraag in voor degene die door zijn tussenkomst voornemens is
      gastouderopvang te bieden. De aanvraag, bedoeld in de eerste volzin, wordt namens de gastouder of voorgenomen
      gastouder gedaan bij het college.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.45
  - number: 1.45.3
    text: |-
      Een kindercentrum, een gastouderbureau of een voorziening voor gastouderopvang wordt niet in exploitatie
      genomen voordat een onderzoek als bedoeld in [artikel 1.62, eerste lid][ref1], heeft plaatsgevonden, waaruit
      blijkt dat de exploitatie redelijkerwijs zal plaatsvinden in overeenstemming met de bij of krachtens de
      [artikelen 1.48d, tweede en derde lid][ref2], [1.49 tot en met 1.59][ref3], [1.60a][ref4] en [1.60c][ref5] gestelde
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.45
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '3'
  - number: 1.45.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven over de gegevens die worden verstrekt
      bij de aanvraag, bedoeld in het eerste en tweede lid, en over de wijze van verstrekking van deze gegevens,
      waaronder voorschriften over de verstrekking van het burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.45
  - number: 1.45.5
    text: |-
      In de gevallen waarin het burgerservicenummer dient te worden verstrekt, is degene ten behoeve van wie een aanvraag
      als bedoeld in het tweede lid wordt gedaan gehouden dat nummer te verstrekken aan degenen, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.45
  - number: 1.45.6
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag als bedoeld in het
      eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.45
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 1.46.1
    text: |-
      Uiterlijk tien weken na de ontvangst van de aanvraag, bedoeld in [artikel 1.45, eerste of tweede lid][ref1],
      besluit het college op de aanvraag. Indien uit het onderzoek, bedoeld in [artikel 1.62, eerste lid][ref2],
      is gebleken dat de exploitatie redelijkerwijs zal plaatsvinden in overeenstemming met de bij of krachtens de
      [artikelen 1.48d, tweede en derde lid][ref3], [1.49 tot en met 1.59][ref4], [1.60a][ref5] en [1.60c][ref6]
      gestelde regels en anderszins niet is gebleken van feiten en omstandigheden die op het tegendeel duiden, wordt
      positief op de aanvraag beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.46
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '3'
      - id: ref6
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '3'
  - number: 1.46.2
    text: |-
      In de beschikking waarin positief op de aanvraag, bedoeld in het eerste lid, wordt beslist, bepaalt het college
      de datum van ingang van de toestemming tot exploitatie. Deze datum ligt niet voor de datum van de bekendmaking
      van de beschikking. Vervolgens draagt het college onverwijld zorg voor inschrijving van het kindercentrum, het
      gastouderbureau of de voorziening voor gastouderopvang in het landelijk register kinderopvang waarbij de datum van
      ingang van de toestemming tot exploitatie als startdatum van de registratie wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.46
  - number: 1.46.3
    text: |-
      Bij een inschrijving als bedoeld in het tweede lid, doet het college opgave van de gegevens die ingevolge
      [artikel 1.45, vierde lid][ref1], zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.46
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
  - number: 1.46.4
    text: |-
      Indien in een kindercentrum voorschoolse educatie wordt aangeboden, neemt het college dit op in het landelijk
      register kinderopvang.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.46
  - number: 1.46.5
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 1.62, tweede tot en met vijfde lid][ref1], of
      anderszins blijkt dat de exploitatie niet langer in overeenstemming is met de bij of krachtens de
      [artikelen 1.47, eerste lid][ref2], [1.49 tot en met 1.59][ref3], [1.60a][ref4] en [1.60c][ref5] gestelde regels,
      dan wel indien blijkt dat de houder niet langer het kindercentrum, het gastouderbureau of de voorziening voor
      gastouderopvang exploiteert en er geen wijziging van de houder van dat kindercentrum, gastouderbureau of die
      voorziening voor gastouderopvang heeft plaatsgevonden, kan het college besluiten de beschikking, bedoeld in het
      tweede lid, in te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel1
