    text: |-
      Indien tijdens een onderzoek als bedoeld in het tweede tot en met het vierde lid tekortkomingen zijn geconstateerd
      kan de toezichthouder nadien een of meer nadere onderzoeken verrichten.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.62
  - number: 1.62.6
    text: |-
      De toezichthouder verricht het onderzoek, bedoeld in het tweede lid, ten minste tweemaal gedurende de
      aanloopperiode, bedoeld in [artikel 1.60b][ref1], indien het een ouderparticipatiecrèche betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.62
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '3'
  - number: 1.63.1
    text: |-
      De toezichthouder legt zijn oordeel naar aanleiding van een onderzoek als bedoeld in
      [artikel 1.62, eerste tot en met vijfde lid][ref1] vast in een inspectierapport.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.63
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
  - number: 1.63.2
    text: |-
      Indien de toezichthouder oordeelt dat door de houder de bij of krachtens de [artikelen 1.47, eerste lid][ref1],
      [1.48d, tweede en derde lid][ref2], [1.49 tot en met 1.59][ref3], [1.60a][ref4] en [1.60c][ref5] gestelde regels
      niet zijn of zullen worden nageleefd, vermeldt hij dat in het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.63
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '3'
  - number: 1.63.3
    text: |-
      Alvorens het rapport vast te stellen, stelt de toezichthouder de houder in de gelegenheid van het ontwerprapport
      kennis te nemen en daarover zijn zienswijze kenbaar te maken. De toezichthouder vermeldt de zienswijze van de
      houder in een bijlage bij het rapport. Dit lid is niet van toepassing op een inspectierapport dat wordt opgesteld
      naar aanleiding van een onderzoek als bedoeld in [artikel 1.62, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.63
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
  - number: 1.63.4
    text: 'De toezichthouder zendt het inspectierapport, bedoeld in het eerste lid, onverwijld aan:'
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.63
  - number: 1.63.4.a
    text: de houder van een kindercentrum,
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.63
  - number: 1.63.4.b
    text: de houder van een gastouderbureau en de gastouder indien het rapport betrekking heeft op de gastouder, of
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.63
  - number: 1.63.4.c
    text: de houder van een gastouderbureau, indien het rapport betrekking heeft op een gastouderbureau.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.63
  - number: 1.63.5
    text: De toezichthouder maakt het inspectierapport uiterlijk drie weken na de vaststelling daarvan openbaar.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.63
  - number: 1.63.6
    text: |-
      De toezichthouder zendt een afschrift van het inspectierapport naar aanleiding van een onderzoek bij een
      kindercentrum waar voorschoolse educatie wordt aangeboden aan het college en aan de Inspectie van het onderwijs,
      indien met betrekking tot een of meer van de basisvoorwaarden voor kwaliteit van voorschoolse educatie, bedoeld in
      [artikel 1.61, eerste lid][ref1], tekortkomingen zijn geconstateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.63
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
  - number: '1.64'
    text: |-
      Onze Minister kan beleidsregels stellen omtrent de door de toezichthouder te hanteren werkwijze voor een onderzoek
      als bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.64
  - number: 1.65.1
    text: |-
      Het college van de gemeente waarin zich een kindercentrum, een voorziening voor gastouderopvang
      of een gastouderbureau bevindt dat de bij of krachtens de [artikelen 1.47, eerste lid][ref1],
      [1.48d, tweede en derde lid][ref2], [1.49 tot en met 1.59][ref3], [1.60a][ref4] en [1.60c][ref5] gestelde regels
      niet of in onvoldoende mate naleeft, kan de houder een schriftelijke aanwijzing geven.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.65
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '3'
  - number: 1.65.2
    text: |-
      In een aanwijzing als bedoeld in het eerste lid geeft het college met redenen omkleed aan op welke punten de in het
      eerste lid bedoelde voorschriften niet of in onvoldoende mate worden nageleefd, alsmede de in verband daarmee te
      nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.65
  - number: 1.65.3
    text: |-
      De toezichthouder kan een schriftelijk bevel geven aan een kindercentrum, gastouderbureau of voorziening voor
      gastouderopvang indien hij oordeelt:
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.65
  - number: 1.65.3.a
    text: |-
      dat de kwaliteit van de kinderopvang bij een kindercentrum of een voorziening voor gastouderopvang zodanig
      tekortschiet dat het nemen van maatregelen redelijkerwijs geen uitstel kan lijden; of
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.65
  - number: 1.65.3.b
    text: |-
      dat de kwaliteit van een gastouderbureau zodanig tekort schiet, en daardoor het risico bestaat dat ook de kwaliteit
      van de gastouderopvang in gevaar komt, dat het nemen van maatregelen redelijkerwijs geen uitstel kan lijden.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.65
  - number: 1.65.4
    text: |-
      Het bevel, bedoeld in het derde lid, heeft een geldigheidsduur van zeven dagen, welke door het college kan worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.65
  - number: 1.65.5
    text: De houder neemt de maatregelen binnen de bij de aanwijzing onderscheidenlijk het bevel gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.65
  - number: 1.66.1
    text: |-
      Het college kan de houder verbieden de exploitatie van een kindercentrum, een voorziening voor gastouderopvang of
      een gastouderbureau voort te zetten, zolang hij een bevel of aanwijzing niet opvolgt en het opleggen van een last
      onder bestuursdwang niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66
  - number: 1.66.2
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 1.62][ref1] of anderszins blijkt dat het kindercentrum, de
      voorziening voor gastouderopvang of het gastouderbureau naar verwachting niet dan wel niet langer aan de bij
      of krachtens de [artikelen 1.48d, tweede en derde lid][ref2], [1.49 tot en met 1.59][ref3], [1.60a][ref4] en
      [1.60c][ref5] gegeven voorschriften zal voldoen, kan het college zolang die situatie zich voordoet, de houder
      verbieden dat kindercentrum, die voorziening voor gastouderopvang of dat gastouderbureau in exploitatie te nemen of
      te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.66
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
