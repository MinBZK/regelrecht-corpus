        bwb_id: BWBR0018472
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0034925
  - number: 1.3.2.b
    text: |-
      in afwijking van [artikel 15, eerste lid, van de Algemene wet inkomensafhankelijke regelingen][ref1], een
      ouder over de berekeningsjaren 2014 en volgende geen aanspraak heeft op kinderopvangtoeslag als bedoeld in
      [artikel 1.5][ref2] over de periode tot de eerste dag van de kalendermaand die drie kalendermaanden gelegen is voor
      de datum waarop de aanvraag om kinderopvangtoeslag is ingediend bij de Belastingdienst/Toeslagen.


