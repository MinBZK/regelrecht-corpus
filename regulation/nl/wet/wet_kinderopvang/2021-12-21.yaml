  - number: 1.4.1
    text: |-
      Met het oog op het toekennen van een kinderopvangtoeslag verstrekt de ouder, bedoeld in
      [artikel 1.5, eerste lid][ref1], aan de Belastingdienst/Toeslagen het unieke nummer, bedoeld in
      [artikel 1.47b, derde lid][ref2].


