  - number: 1.1.2
    text: 'Tot kinderopvang worden niet gerekend:'
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.1
  - number: 1.1.2.a
    text: het toezichthouden op schoolgaande kinderen dat zich beperkt tot het toezicht tijdens de middagpauze;
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.1
  - number: 1.1.2.b
    text: |-
      verzorging en opvoeding die plaatsvindt in het kader van de [Jeugdwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
  - number: 1.1.2.c
    text: |-
      de verzorging, de opvoeding en het bijdragen aan de ontwikkeling van kinderen, anders dan gastouderopvang, die
      geschiedt op een plaats waar het kind zijn hoofdverblijf heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.1
  - number: 1.1.3
    text: |-
      Waar in het bepaalde bij of krachtens dit hoofdstuk en [hoofdstuk 3][ref1] wordt gesproken over verklaring
      omtrent het gedrag wordt een verklaring omtrent het gedrag natuurlijke personen bedoeld, indien de betrokkene een
      natuurlijk persoon is en een verklaring omtrent het gedrag rechtspersonen, indien de betrokkene een rechtspersoon
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.1
    references:
