        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
  - number: 1.60.7
    text: |-
      De houder van een kindercentrum of van een gastouderbureau brengt de mogelijkheid om geschillen aan de
      geschillencommissie voor te leggen op passende wijze onder de aandacht van de oudercommissie.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.60
  - number: 1.60a
    text: 'Van ouderparticipatieopvang is sprake, indien:'
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.60a
  - number: 1.60a.a
    text: |-
      de kinderopvang uitsluitend verzorgd wordt door ten minste één ouder van elk van de kinderen die in de
      ouderparticipatiecrèche wordt opgevangen;
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.60a
  - number: 1.60a.b
    text: de kinderopvang niet verzorgd wordt op het woonadres van een ouder;
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.60a
  - number: 1.60a.c
    text: participerende ouders niet worden bezoldigd voor werkzaamheden bij een ouderparticipatiecrèche;
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.60a
  - number: 1.60a.d
    text: |-
      uitsluitend één of meer ouders van de kinderen die in de ouderparticipatiecrèche worden opgevangen de houder is van
      de ouderparticipatiecrèche; en
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.60a
  - number: 1.60a.e
    text: |-
      uit de statuten, reglement of beleidsplan en administratie van de ouderparticipatiecrèche blijkt dat de
      ouderparticipatiecrèche alle inkomsten ten bate van verantwoorde kinderopvang aanwendt.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.60a
  - number: 1.60b.1
    text: |-
      Voor de ouderparticipatiecrèche geldt een aanloopperiode van 1 jaar en 3 maanden. De aanloopperiode vangt aan op de
      datum van ingang van de toestemming tot exploitatie van een ouderparticipatiecrèche.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.60b
  - number: 1.60b.2
    text: |-
      In afwijking van het eerste lid, vangt geen nieuwe aanloopperiode aan, indien de houder van een
      ouderparticipatiecrèche opnieuw toestemming tot exploitatie krijgt, in verband met een wijziging van de locatie van
      de ouderparticipatiecrèche.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.60b
  - number: 1.60b.3
    text: |-
      In afwijking van [artikel 1.47b, derde lid][ref1], wordt het unieke nummer van een ouderparticipatiecrèche door
      het college, kenbaar gemaakt in het landelijk register kinderopvang, nadat de aanloopperiode, bedoeld in het eerste
      lid, is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.60b
