    text: het beleid met betrekking tot het aanbieden van voorschoolse educatie;
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.60
  - number: 1.60.1.e
    text: |-
      de vaststelling of wijziging van een regeling inzake de behandeling van klachten als bedoeld in
      [artikel 1.57b, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.60
