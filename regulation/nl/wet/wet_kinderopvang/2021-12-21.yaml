  - number: 1.4.2
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven met betrekking tot de verstrekking.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.4
  - number: 1.5.1
    text: |-
      Een ouder heeft aanspraak op een kinderopvangtoeslag in de door hem of zijn partner betaalde kosten, indien het
      betreft:
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.5
  - number: 1.5.1.a
    text: kinderopvang in een geregistreerd kindercentrum; of
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.5
  - number: 1.5.1.b
    text: gastouderopvang in een geregistreerde voorziening voor gastouderopvang.
