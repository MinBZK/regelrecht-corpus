  - number: 1.61.2
    text: |-
      Het college wijst de directeur publieke gezondheid van de GGD, bedoeld in artikel 14, derde lid, van de Wet
      publieke gezondheid, aan als toezichthouder.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.61
  - number: 1.61.3
    text: |-
      Voor zover een kindercentrum een voorziening voor gastouderopvang of een gastouderbureau in een woning is
      gevestigd, zijn de toezichthouders ter uitvoering van de taken, bedoeld in het eerste lid, bevoegd zonder
      toestemming van de bewoners in die woning binnen te treden.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.61
  - number: 1.61a.1
    text: |-
      Een door Onze Minister aan te wijzen instelling bevordert de kwaliteit en uniformiteit van de uitvoering van de
      taak door het college op grond van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.61a
  - number: 1.61a.2
    text: |-
      Bij beschikking van Onze Minister wordt een financiële vergoeding verstrekt aan de instelling, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.61a
  - number: 1.62.1
    text: |-
      De toezichthouder houdt toezicht op de naleving van [artikel 1.45, derde lid][ref1], en onderzoekt na een
      aanvraag als bedoeld in artikel 1.45, eerste of tweede lid, binnen een bij regeling van Onze Minister te
      stellen termijn of de exploitatie redelijkerwijs zal plaatsvinden in overeenstemming met de bij of krachtens
      de [artikelen 1.48d, tweede en derde lid][ref2], [1.49 tot en met 1.59][ref3], [1.60a][ref4] en [1.60c][ref5]
      gestelde regels.


