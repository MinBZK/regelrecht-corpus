        hoofdstuk: '3'
  - number: 1.3.1
    text: |-
      De uitvoering van het toekennen, uitbetalen en terugvorderen van de kinderopvangtoeslag is opgedragen aan de
      Belastingdienst/Toeslagen.
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.3
  - number: 1.3.2
    text: |-
      Op deze wet is de [Algemene wet inkomensafhankelijke regelingen][ref1] van toepassing met uitzondering
      van [artikel 5 van die wet][ref2] op wijzigingen in de kosten van kinderopvang per kind, bedoeld in
      [artikel 1.7, eerste lid, onderdeel b][ref3], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0018472
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0018472
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '2'
  - number: 1.3.2.a
    text: |-
      in afwijking van [artikel 4, derde lid, van de Algemene wet inkomensafhankelijke regelingen][ref1] een kind voor
      wie de pleegouder een vergoeding ontvangt op grond van de [Jeugdwet][ref2], geacht wordt door die pleegouder in
      belangrijke mate te worden onderhouden;


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel1.3
    references:
