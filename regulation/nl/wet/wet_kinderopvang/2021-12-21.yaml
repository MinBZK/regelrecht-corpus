  - number: '3.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen over de in [hoofdstuk 1][ref1] van deze wet geregelde
      onderwerpen regels worden gesteld voor de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2021-12-21#Artikel3.5
