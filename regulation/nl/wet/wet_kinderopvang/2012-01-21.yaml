  - number: '1.24'
    text: |-
      1 De tegemoetkoming van de gemeente bedraagt:

      a. voor een ouder als bedoeld in [artikel 1.22 eerste lid, onder c][ref1], voorzover de ouder een persoon
      is als bedoeld in [artikel 1.6, eerste lid, onder c, e of f][ref2], een derde deel van de kosten van
      kinderopvang, verhoogd met een bij regeling van Onze Minister zodanig vast te stellen bedrag, dat het totaal aan
      kinderopvangtoeslag en tegemoetkoming van de gemeente niet meer bedraagt dan de kosten van kinderopvang, bedoeld in
      [artikel 1.7, eerste lid][ref3];

      b. voor een ouder als bedoeld in [artikel 1.22, eerste lid, onder c][ref4], voor zover de ouder een persoon is
      als bedoeld in [artikel 1.6, eerste lid, onder g, j, k of l][ref5], een derde deel van de kosten van kinderopvang,
      bedoeld in [artikel 1.7, eerste lid][ref6].

      2 De tegemoetkoming van de gemeente bedraagt:

      a. voor een ouder als bedoeld in [artikel 1.22, eerste lid, onder a, b, d, e, f of g][ref7], voorzover de ouder
      een persoon is als bedoeld in [artikel 1.6, eerste lid, onder c, e of f][ref8], een zesde deel van de kosten van
      kinderopvang, verhoogd met een bij regeling van Onze Minister zodanig vast te stellen bedrag, dat het totaal aan
      kinderopvangtoeslag en tegemoetkoming van de gemeente niet meer bedraagt dan kosten van kinderopvang, bedoeld in
      [artikel 1.7, eerste lid][ref9];

      b. voor een ouder als bedoeld in [artikel 1.22, eerste lid, onder a, b, d, e, f of g][ref10], voorzover de ouder
      een persoon is als bedoeld in [artikel 1.6, eerste lid, onder g, j, k of l][ref11], een zesde deel van de kosten
      van kinderopvang, bedoeld in [artikel 1.7, eerste lid][ref12].

      3 De tegemoetkoming van de gemeente bedraagt voor een ouder of zijn partner als bedoeld in
      [artikel 1.22, tweede lid][ref13], een bij regeling van Onze Minister zodanig vast te stellen bedrag, dat het
      totaal aan kinderopvangtoeslag en tegemoetkoming van de gemeente niet meer bedraagt dan de kosten van kinderopvang,
      bedoeld in [artikel 1.7, eerste lid][ref14].

      4 Bij regeling van Onze Minister kunnen regels worden gesteld ter voorkoming van samenloop van tegemoetkomingen
      ingevolge dit artikel, voorzover de ouder en zijn partner personen zijn als bedoeld in het eerste lid, onder a,
      onderscheidenlijk met tegemoetkomingen ingevolge [artikel 1.30][ref15], voorzover het gevallen betreft, waarin,
      ofwel de ouder ofwel zijn partner een persoon is als bedoeld in het tweede lid, onder a, en de ander een persoon is
      als bedoeld in artikel 1.30, tweede lid.


