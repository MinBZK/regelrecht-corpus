  - number: 1.50b
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de kwaliteit van voorschoolse
      educatie, indien dit wordt gesubsidieerd door het college van burgemeester en wethouders. Deze regels hebben in
      ieder geval betrekking op:

      a. de opleidingseisen en de scholingseisen waaraan de beroepskrachten voorschoolse educatie voldoen;

      b. het aantal beroepskrachten voorschoolse educatie in relatie tot het aantal kinderen;

      c. de groepsgrootte; en

      d. de minimum omvang van de voorschoolse educatie.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.50b
  - number: '1.51'
    text: |-
      De houder van een kindercentrum voert een beleid dat ertoe leidt dat de veiligheid en de gezondheid van de op
      te vangen kinderen in elk door hem geëxploiteerd kindercentrum zoveel mogelijk is gewaarborgd. De houder van het
      kindercentrum legt, voor zover hierin niet wordt voorzien bij of krachtens andere wet- en regelgeving, in een
      risico-inventarisatie schriftelijk vast welke risico's de opvang van kinderen met zich brengt.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.51
  - number: '1.52'
    text: |-
      1 Kinderopvang geschiedt op basis van een schriftelijke overeenkomst tussen de houder en de ouder.

      2 Bij regeling van Onze Minister kan worden bepaald dat de ouder niet kan worden verplicht tot afname en betaling
      van meer uren per dag of dagdeel dan een in die regeling te bepalen maximum.

      3 Het aantal uren, bedoeld in het tweede lid, kan per soort kinderopvang verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.52
  - number: '1.53'
    text: |-
      Bij regeling van Onze Minister kunnen ten behoeve van een goede uitvoering van deze wet regels worden gesteld met
      betrekking tot de administratie van gegevens bij kindercentra.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.53
  - number: '1.54'
    text: |-
      1 De houder van een kindercentrum informeert de ouders wier kinderen in het kindercentrum worden opgevangen over
      het te voeren beleid als bedoeld in deze paragraaf.

      2 De houder van een kindercentrum informeert de ouders wier kinderen in het kindercentrum worden opgevangen over
      een inspectierapport als bedoeld in [artikel 1.63][ref1] door dit zo spoedig mogelijk na ontvangst van het rapport
      op een website van de houder te plaatsen zodanig dat het rapport voor ouders gemakkelijk vindbaar is dan wel,
      indien de houder geen eigen website heeft, ter inzage te leggen op een voor ouders toegankelijke plaats.

      3 De houder van een kindercentrum informeert het personeel van het kindercentrum over een inspectierapport als
      bedoeld in [artikel 1.63][ref2] door dit zo spoedig mogelijk na ontvangst van het rapport op een website van de
      houder te plaatsen zodanig dat het rapport voor het personeel gemakkelijk vindbaar is dan wel, indien de houder
      geen eigen website heeft, ter inzage te leggen op een voor het personeel toegankelijke plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.63
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.63
