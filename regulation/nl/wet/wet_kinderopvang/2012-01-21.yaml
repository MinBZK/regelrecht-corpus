  - number: '1.64'
    text: |-
      1 Onze Minister kan beleidsregels stellen omtrent de door de toezichthouder te hanteren werkwijze voor een
      onderzoek als bedoeld in deze paragraaf.

      2 De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.64
  - number: '1.65'
    text: |-
      1 Het college van burgemeester en wethouders van de gemeente waarin zich een kindercentrum, een voorziening
      voor gastouderopvang of een gastouderbureau bevindt dat de bij of krachtens [afdeling 3, paragrafen 2][ref1]
      en [3][ref2], van dit hoofdstuk gegeven voorschriften niet of in onvoldoende mate naleeft, kan de houder een
      schriftelijke aanwijzing geven.

      2 In een aanwijzing als bedoeld in het eerste lid geeft het college van burgemeester en wethouders met redenen
      omkleed aan op welke punten de in het eerste lid bedoelde voorschriften niet of in onvoldoende mate worden
      nageleefd, alsmede de in verband daarmee te nemen maatregelen.

      3 De toezichthouder kan een schriftelijk bevel geven aan een kindercentrum, gastouderbureau of voorziening voor
      gastouderopvang indien hij oordeelt:

      a. dat de kwaliteit van de kinderopvang bij een kindercentrum of een voorziening voor gastouderopvang zodanig
      tekortschiet dat het nemen van maatregelen redelijkerwijs geen uitstel kan lijden; of

      b. dat de kwaliteit van een gastouderbureau zodanig tekort schiet, en daardoor het risico bestaat dat ook de
      kwaliteit van de gastouderopvang in gevaar komt, dat het nemen van maatregelen redelijkerwijs geen uitstel kan
      lijden.

      4 Het bevel, bedoeld in het derde lid, heeft een geldigheidsduur van zeven dagen, welke door het college van
      burgemeester en wethouders kan worden verlengd.

      5 De houder neemt de maatregelen binnen de bij de aanwijzing onderscheidenlijk het bevel gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
