  - number: 1.6a
    text: |-
      In afwijking van de [artikelen 1.5][ref1] en [1.6][ref2], heeft een ouder als bedoeld in artikel 1.6, eerste lid,
      onderdeel a, voor zover die ouder de arbeid verricht als gastouder, geen aanspraak op een kinderopvangtoeslag in
      de door hem of zijn partner te betalen kosten van gastouderopvang in een geregistreerde voorziening als bedoeld in
      artikel 1.5, eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.6
