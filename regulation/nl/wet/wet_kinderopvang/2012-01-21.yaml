  - number: '1.70'
    text: |-
      Onze Minister stelt jaarlijks een verslag vast van de werkzaamheden die hij in het kader van dit hoofdstuk in
      het voorafgaande kalenderjaar heeft verricht. Hij zendt afschrift van het verslag aan de Tweede Kamer der Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.70
  - number: '1.72'
    text: |-
      1 Het college van burgemeester en wethouders kan:

      a. de houder die een verplichting als bedoeld bij of krachtens [afdeling 3][ref1] van dit hoofdstuk, een afspraak
      als bedoeld in [artikel 167 van de Wet op het primair onderwijs][ref2], een aanwijzing onderscheidenlijk een bevel
      als bedoeld in [artikel 1.65][ref3] of [artikel 5:20 van de Algemene wet bestuursrecht][ref4] niet nakomt dan wel
      handelt in strijd met een verbod krachtens [artikel 1.66][ref5], een bestuurlijke boete opleggen van ten hoogste €
      45 000;

      b. de houder die een verplichting als bedoeld in [artikel 1.28, vierde lid][ref6], niet nakomt een bestuurlijke
      boete opleggen van ten hoogste € 5000;

      c. de ouder die een verplichting als bedoeld in [artikel 1.28, eerste tot en met derde lid][ref7], niet nakomt een
      bestuurlijke boete opleggen van ten hoogste € 2269.

      2 In afwijking van het eerste lid kan de overtreding van de houder niet met een bestuurlijke boete worden afgedaan,
      indien de overtreding opzettelijk of roekeloos geschiedt en een direct gevaar voor de gezondheid of de veiligheid
      van personen tot gevolg heeft.


