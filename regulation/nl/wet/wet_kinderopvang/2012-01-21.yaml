        afdeling: '2'
  - number: '2.24'
    text: |-
      1 Het college van burgemeester en wethouders kan de houder verbieden de instandhouding van een peuterspeelzaal
      voort te zetten, zolang hij een bevel of aanwijzing niet opvolgt en het opleggen van een last onder bestuursdwang
      niet mogelijk is.

      2 Indien uit een onderzoek als bedoeld in [artikel 2.20][ref1] of anderszins blijkt dat de peuterspeelzaal naar
      verwachting niet dan wel niet langer aan de bij of krachtens [afdeling 2, paragraaf 2][ref2], van dit hoofdstuk
      gegeven voorschriften zal voldoen, kan het college van burgemeester en wethouders zolang die situatie zich
      voordoet, de houder verbieden die peuterspeelzaal in exploitatie te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2.20
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.24
