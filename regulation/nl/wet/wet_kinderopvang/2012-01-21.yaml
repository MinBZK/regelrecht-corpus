        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '2.17'
    text: |-
      1 De houder stelt de oudercommissie in ieder geval in de gelegenheid advies uit te brengen over elk voorgenomen
      besluit van de houder met betrekking tot:

      a. de wijze waarop uitvoering wordt gegeven aan [artikel 2.6][ref1];

      b. voedingsaangelegenheden van algemene aard en het algemene beleid op het gebied van opvoeding, veiligheid of
      gezondheid;

      c. openingstijden;

      d. het beleid met betrekking tot spel- en ontwikkelingsactiviteiten ten behoeve van de kinderen, waaronder
      voorschoolse educatie;

      e. de vaststelling of wijziging van een regeling inzake de behandeling van klachten en het aanwijzen van personen
      die belast worden met de behandeling van klachten;

      f. wijziging van de prijs van peuterspeelzaalwerk.

      2 Van een advies als bedoeld in het eerste lid kan de houder slechts afwijken indien hij schriftelijk en
      gemotiveerd aangeeft dat het belang van het peuterspeelzaalwerk zich tegen het advies verzet.

      3 De oudercommissie is bevoegd de houder ook ongevraagd te adviseren over de onderwerpen, genoemd in het eerste
      lid.

      4 De houder verstrekt de oudercommissie tijdig en desgevraagd schriftelijk alle informatie die deze voor de
      vervulling van haar taak redelijkerwijs nodig heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.17
