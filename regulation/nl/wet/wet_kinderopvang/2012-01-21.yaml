  - number: '1.68'
    text: |-
      1 Onze Minister houdt toezicht op de rechtmatigheid en de doeltreffendheid van de uitvoering van de bij of
      krachtens [afdeling 3, paragraaf 1][ref1], [afdeling 4][ref2] en [afdeling 6][ref3], van dit hoofdstuk gestelde
      regels door het college van burgemeester en wethouders, met uitzondering van de bij [artikel 1.50b][ref4] gestelde
      regels.

      2 Het toezicht, bedoeld in het eerste lid, wordt uitgeoefend door de Inspectie van het onderwijs, genoemd in
      [artikel 2, eerste lid, van de Wet op het onderwijstoezicht][ref5]. De [artikelen 3][ref6], [4, tweede lid][ref7],
      [7][ref8], [22][ref9] en [23 van de Wet op het onderwijstoezicht][ref10] zijn van overeenkomstige toepassing.

      3 Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering de bij of krachtens
      [afdeling 3, paragraaf 1][ref11], [afdeling 4][ref12] en [afdeling 6][ref13], van dit hoofdstuk gestelde regels
      ernstige tekortkomingen constateert, aan het college van burgemeester en wethouders, nadat het gedurende acht weken
      in de gelegenheid is gesteld zijn zienswijze naar voren te brengen, een aanwijzing geven. Hij treedt daarbij niet
      in de besluitvorming inzake individuele gevallen. In een aanwijzing wordt een termijn opgenomen waarbinnen het
      college van burgemeester en wethouders de uitvoering in overeenstemming heeft gebracht met de aanwijzing.


