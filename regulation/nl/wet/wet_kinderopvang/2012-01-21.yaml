  - number: '1.22'
    text: |-
      1 Een ouder heeft in een berekeningsjaar aanspraak op een tegemoetkoming van de gemeente:

      a. voor zover de ouder in dat jaar een persoon is die een uitkering ontvangt en gebruik maakt van een
      voorziening gericht op arbeidsinschakeling als bedoeld in [artikel 1.6, eerste lid, onder c of e][ref1],
      of als niet-uitkeringsgerechtigde gebruik maakt van een voorziening gericht op arbeidsinschakeling als
      bedoeld in artikel 1.6, eerste lid, onder f, voor wie het college van burgemeester en wethouders op grond
      van [artikel 7, eerste lid, aanhef en onder a, of derde lid, tweede zin, van de Wet werk en bijstand][ref2],
      __REF002___________________________________________________________________________________________________________
      __________________,
      __REF003___________________________________________________________________________________________________________
      ____________________, of
      [artikel 30a, derde lid, onder a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5],
      verantwoordelijk is voor het ondersteunen bij arbeidsinschakeling;

      b. voor zover de ouder in dat jaar een persoon is als bedoeld in
      [artikel 1.6, eerste lid, onder g, j, k of l][ref6];

      c. voor zover de ouder in dat jaar een persoon is als bedoeld onder a of b, en zijn partner in dat jaar een
      persoon die in Nederland, een andere lidstaat of Zwitserland woont en een uitkering ontvangt als bedoeld in
      [artikel 1.6, eerste lid, onder c of e][ref7], en gebruik maakt van een in één van die onderdelen bedoelde
      voorziening gericht op arbeidsinschakeling, voor wie het college van burgemeester en wethouders op grond van
      de wetten, genoemd onder a, verantwoordelijk is voor het ondersteunen bij arbeidsinschakeling, of een daarmee
      vergelijkbare uitkering respectievelijk voorziening, vastgesteld krachtens de wetgeving van een andere lidstaat of
      Zwitserland, of voor zover de partner in dat jaar een persoon is als bedoeld onder b;

      d. voor zover de ouder in dat jaar een persoon als bedoeld onder a of b, en zijn partner in dat jaar een
      persoon die in Nederland, een andere lidstaat of Zwitserland woont en een uitkering ontvangt als bedoeld in
      [artikel 1.6, eerste lid, onder h of i][ref8], en gebruik maakt van een in één van die onderdelen bedoelde
      voorziening gericht op arbeidsinschakeling, voor wie het Uitvoeringsinstituut werknemersverzekeringen
      verantwoordelijk is voor het ondersteunen bij arbeidsinschakeling of een daarmee vergelijkbare uitkering
      respectievelijk voorziening, vastgesteld krachtens de wetgeving van een andere lidstaat of Zwitserland;

      e. voor zover de ouder in dat jaar een persoon is als bedoeld in [artikel 1.29, eerste lid, onder a][ref9], en zijn
      partner in dat jaar een persoon als bedoeld onder c;

      f. voor zover de ouder in dat jaar een persoon als bedoeld onder a of b, en zijn partner in dat jaar een persoon
      die in Nederland, een andere lidstaat of Zwitserland woont en in Nederland of op het continentaal plat, in een
      andere lidstaat of in Zwitserland arbeid verricht;

      g. voor zover de ouder in dat jaar een persoon is als bedoeld in [artikel 1.6, eerste lid, onder a][ref10], en zijn
      partner in dat jaar een persoon als bedoeld onder c.

      2 Aanspraak op een tegemoetkoming van de gemeente heeft eveneens een ouder, voor zover de ouder in een
      berekeningsjaar een persoon is als bedoeld in [artikel 1.6, eerste lid, onder a][ref11], en algemene bijstand
      ontvangt op grond van de [Wet werk en bijstand][ref12] en, indien hij een partner heeft, voor zover zijn partner
      een persoon is die in Nederland, een andere lidstaat of Zwitserland woont en in Nederland of op het continentaal
      plat, in een andere lidstaat of in Zwitserland arbeid verricht en algemene bijstand ontvangt op grond van de Wet
      werk en bijstand of een daarmee vergelijkbare uitkering, vastgesteld krachtens de wetgeving van een andere lidstaat
      of Zwitserland.

      3 De aanspraak bestaat jegens de gemeente waar de ouder zijn woonplaats heeft als bedoeld in de
      [artikelen 10, eerste lid][ref13], en [11 van Boek 1 van het Burgerlijk Wetboek][ref14].

      4 Een persoon als bedoeld in het eerste lid, onder a of b, heeft slechts aanspraak op een tegemoetkoming, indien
      hij geen partner heeft.

      5 Een ouder heeft in de berekeningsjaren 2012 en volgende geen aanspraak op een tegemoetkoming van de gemeente
      over de periode tot de eerste dag van de kalendermaand voor de datum waarop de aanvraag om die tegemoetkoming is
      ingediend bij de gemeente.


