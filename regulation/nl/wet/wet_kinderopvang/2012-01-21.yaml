  - number: '1.38'
    text: |-
      1 Bedragen door een ouder of diens partner in het kader van deze wet verschuldigd aan de gemeente worden
      ingevorderd door het college van burgemeester en wethouders. Een bedrag is invorderbaar vanaf een maand na de dag
      van dagtekening van de beschikking waarbij de vordering is ontstaan.

      2 De [artikelen 58 tot en met 60 van de Wet werk en bijstand][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.38
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
  - number: '1.39'
    text: |-
      Op de invordering van bedragen door een ouder of diens partner in het kader van
      deze wet verschuldigd aan het Uitvoeringsinstituut werknemersverzekeringen zijn de
      [artikelen 57 tot en met 57b van de Wet op de arbeidsongeschiktheidsverzekering][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel57
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.39
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '57'
  - number: '1.40'
    text: |-
      De kinderopvangtoeslag, alsmede de tegemoetkomingen van de gemeente of het Uitvoeringsinstituut
      werknemersverzekeringen blijven buiten beschouwing bij de verlening van andere op het inkomen of vermogen
      afgestemde publiekrechtelijke uitkeringen en verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.40
  - number: '1.41'
    text: |-
      1 De tegemoetkomingen van de gemeente of het Uitvoeringsinstituut werknemersverzekeringen zijn niet vatbaar voor
      vervreemding, verpanding, belening of beslag, waaronder begrepen beslag ingevolge faillissement of toepassing van
      de schuldsaneringsregeling natuurlijke personen, tenzij het betreft de inning van:

      a. vorderingen van houders ter zake van verleende kinderopvang;

      b. vorderingen van de gemeente of het Uitvoeringsinstituut werknemersverzekeringen.

      2 Elk beding dat strijdt met het eerste lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.41
  - number: '1.44'
    text: |-
      De ouder en zijn partner zijn ten aanzien van schulden voortvloeiend uit vorderingen van de gemeente of het
      Uitvoeringsinstituut werknemersverzekeringen ingevolge deze wet, hoofdelijk aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.44
  - number: '1.45'
    text: |-
      1 Degene die voornemens is een kindercentrum of gastouderbureau in exploitatie te nemen, doet daarvoor een aanvraag
      bij het college van burgemeester en wethouders van de gemeente van vestiging.

      2 De houder van een gastouderbureau dient een aanvraag in voor degene die door zijn tussenkomst voornemens is
      gastouderopvang te bieden. De aanvraag, bedoeld in de eerste volzin, wordt namens de gastouder gedaan bij het
      college van burgemeester en wethouders van de gemeente van vestiging van de voorziening voor gastouderopvang.

      3 Een kindercentrum, een gastouderbureau of een voorziening voor gastouderopvang wordt niet in exploitatie genomen
      voordat een onderzoek als bedoeld in [artikel 1.62][ref1] heeft plaatsgevonden, waaruit blijkt dat de exploitatie
      redelijkerwijs zal plaatsvinden in overeenstemming met het bepaalde bij of krachtens de [paragrafen 2][ref2] en
      [3 van deze afdeling][ref3].

      4 Bij algemene maatregel van bestuur worden voorschriften gegeven over de gegevens die worden verstrekt bij de
      aanvraag, bedoeld in het eerste en tweede lid, en over de wijze van verstrekking van deze gegevens, waaronder
      voorschriften over de verstrekking van het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-
      fiscaalnummer.

      5 In de gevallen waarin het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer, dient te
      worden verstrekt, is degene ten behoeve van wie een aanvraag als bedoeld in het tweede lid wordt gedaan gehouden
      dat nummer te verstrekken aan degenen, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.62
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.45
