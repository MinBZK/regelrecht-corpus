  - number: '2.4'
    text: |-
      1 De houder doet van wijzigingen in de gegevens die bij de aanvraag, bedoeld in [artikel 2.2, eerste lid][ref1],
      zijn verstrekt, onverwijld mededeling aan het college van burgemeester en wethouders. Het college draagt er zorg
      voor dat deze wijzigingen worden doorgevoerd in het register peuterspeelzaalwerk.

      2 Het college van burgemeester en wethouders deelt de houder schriftelijk mee dat de wijziging in het register
      peuterspeelzaalwerk heeft plaatsgevonden.


