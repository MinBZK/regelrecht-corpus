  - number: '1.61'
    text: |-
      1 Het college van burgemeester en wethouders ziet toe op de naleving van de bij of krachtens
      [afdeling 3 van dit hoofdstuk][ref1] gestelde regels, onderscheidenlijk de krachtens [artikel 1.65][ref2] gegeven
      aanwijzingen en bevelen en de krachtens [artikel 1.66, eerste lid][ref3], gegeven bevelen tot sluiting dan wel
      de krachtens artikel 1.66, tweede lid, uitgevaardigde verboden en de in de bij [artikel 1.50b][ref4] vastgestelde
      algemene maatregel van bestuur vastgelegde basisvoorwaarden voor kwaliteit van voorschoolse educatie. Het college
      van burgemeester en wethouders wijst de directeur van de GGD aan als toezichthouder.

      2 Voor zover een kindercentrum een voorziening voor gastouderopvang of een gastouderbureau in een woning is
      gevestigd, zijn de toezichthouders ter uitvoering van de taken, bedoeld in het eerste lid, bevoegd zonder
      toestemming van de bewoners in die woning binnen te treden.


