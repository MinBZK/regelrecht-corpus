  - number: 2.4a
    text: |-
      1 Onze Minister draagt zorg voor de inrichting van een register peuterspeelzaalwerk ten behoeve van de waarborging
      van de kwaliteit en de rechtszekerheid van het peuterspeelzaalwerk alsmede ten behoeve van het toezicht op en de
      handhaving van de bij of krachtens deze [afdeling][ref1] gestelde regels.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent het register
      peuterspeelzaalwerk. Deze regels hebben in elk geval betrekking op:

      a. de vorm van het register;

      b. de in het register op te nemen gegevens;

      c. de vastlegging van gegevens in het register en de verwijdering van gegevens daaruit;

      d. de wijze waarop verbetering van onjuistheden in het register plaatsvindt;

      e. de verstrekking van gegevens;

      f. de openbaarheid van gegevens;

      g. de verantwoordelijkheden van degenen die gegevens aanleveren ten behoeve van het register.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '2'
        afdeling: '2'
  - number: '2.5'
    text: |-
      Een houder biedt verantwoord peuterspeelzaalwerk aan waaronder wordt verstaan peuterspeelzaalwerk dat bijdraagt aan
      en stimuleert tot een goede en gezonde ontwikkeling van het kind in een veilige en gezonde omgeving.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.5
  - number: '2.6'
    text: |-
      1 De houder organiseert het peuterspeelzaalwerk op zodanige wijze, voorziet de peuterspeelzaal zowel kwalitatief,
      als kwantitatief zodanig van personeel en materieel, draagt zorg voor een zodanige verantwoordelijkheidstoedeling,
      en voert een zodanig pedagogisch beleid dat een en ander redelijkerwijs leidt tot verantwoord peuterspeelzaalwerk.
      Ter uitvoering van de eerste volzin besteedt de houder in ieder geval aantoonbaar aandacht aan het aantal
      beroepskrachten en vrijwilligers in relatie tot het aantal kinderen per leeftijdscategorie, de groepsgrootte, de
      opleidingseisen van de beroepskrachten en de voorwaarden waaronder en de mate waarin beroepskrachten in opleiding
      kunnen worden belast met de opvoeding en verzorging van kinderen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de kwaliteit van het
      peuterspeelzaalwerk bij een peuterspeelzaal. Deze regels kunnen betrekking hebben op:

      a. de veiligheid en de gezondheid;

      b. de opleidingseisen waaraan de beroepskrachten voldoen;

      c. de inzet van beroepskrachten in opleiding;

      d. het aantal beroepskrachten en vrijwilligers in relatie tot het aantal kinderen per leeftijdscategorie;

      e. de groepsgrootte;

      f. het pedagogisch beleid en de pedagogische praktijk.

      3 Personen die op structurele basis werkzaam zijn ten behoeve van de verzorging, de opvoeding en het bijdragen
      aan de ontwikkeling van kinderen in een peuterspeelzaal zijn in het bezit van een verklaring omtrent het gedrag,
      afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1].

      4 De verklaring, bedoeld in het derde lid, wordt aan de houder overgelegd, voordat een persoon als bedoeld in het
      derde lid zijn werkzaamheden aanvangt. De verklaring is op het moment dat zij wordt overgelegd, niet ouder dan
      twee maanden.

      5 Indien de houder of de toezichthouder redelijkerwijs mag vermoeden dat een persoon als bedoeld in het derde lid
      niet langer voldoet aan de eisen voor het afgeven van een verklaring omtrent het gedrag, verlangt deze houder al
      dan niet op verzoek van de toezichthouder dat die persoon opnieuw een verklaring omtrent het gedrag overlegt die
      niet ouder is dan twee maanden. De desbetreffende persoon legt de verklaring over binnen een door deze houder of de
      toezichthouder vast te stellen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '2.7'
    text: |-
      De houder van een peuterspeelzaal neemt deel aan het overleg tussen het college van burgemeester en
      wethouders en de bevoegde gezagsorganen van scholen over het onderwijsachterstandenbeleid, bedoeld in
      [artikel 167a van de Wet op het primair onderwijs][ref1], en werkt mee aan de totstandkoming van de
      samenwerkingsafspraken en de nakoming ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel167a
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 167a
  - number: '2.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de kwaliteit van voorschoolse
      educatie, indien dit wordt gesubsidieerd door het college van burgemeester en wethouders. Deze regels hebben in elk
      geval betrekking op:

      a. de opleidingseisen en de scholingseisen waaraan de beroepskrachten voorschoolse educatie voldoen;

      b. het aantal beroepskrachten voorschoolse educatie in relatie tot het aantal kinderen;

      c. de groepsgrootte; en

      d. de minimumomvang van de voorschoolse educatie.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.8
  - number: '2.9'
    text: |-
      De houder voert een beleid dat ertoe leidt dat de veiligheid en de gezondheid van de op te vangen kinderen in elke
      door hem in stand gehouden peuterspeelzaal zoveel mogelijk zijn gewaarborgd. De houder legt, voor zover hierin niet
      wordt voorzien bij of krachtens andere wet- en regelgeving, in een risico-inventarisatie schriftelijk vast welke
      risico’s het peuterspeelzaalwerk met zich brengt.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.9
  - number: '2.10'
    text: |-
      Bij regeling van Onze Minister kunnen ten behoeve van een goede uitvoering van dit hoofdstuk regels worden gesteld
      met betrekking tot de administratie van gegevens bij peuterspeelzalen.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.10
  - number: '2.11'
    text: |-
      1 De houder informeert de ouders van wie de kinderen in de peuterspeelzaal worden opgevangen over het te voeren
      beleid als bedoeld in deze paragraaf.

      2 De houder informeert de ouders wier kinderen in de peuterspeelzaal worden opgevangen over een inspectierapport
      als bedoeld in [artikel 2.21][ref1] door dit zo spoedig mogelijk na ontvangst van het rapport op een website van de
      houder te plaatsen zodanig dat het rapport voor ouders gemakkelijk vindbaar is dan wel, indien de houder geen eigen
      website heeft, ter inzage leggen op een voor ouders toegankelijke plaats.

      3 De houder informeert het personeel over een inspectierapport als bedoeld in [artikel 2.21][ref2] door dit zo
      spoedig mogelijk na ontvangst van het rapport op een website van de houder te plaatsen zodanig dat het rapport voor
      het personeel gemakkelijk vindbaar is dan wel ter inzage te leggen op een voor het personeel toegankelijke plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2.21
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel2.21
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.11
