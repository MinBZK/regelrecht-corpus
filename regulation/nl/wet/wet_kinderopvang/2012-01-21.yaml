  - number: '1.86'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan:

      a. aan de ouder die een verplichting gesteld in [artikel 1.33][ref1] niet nakomt, een
      bestuurlijke boete opleggen met overeenkomstige toepassing van de [artikelen 29a][ref2], en
      [29g van de Wet op de arbeidsongeschiktheidsverzekering][ref3];

      b. aan de houder die een verplichting gesteld in [artikel 1.33, vierde lid][ref4], niet nakomt een bestuurlijke
      boete opleggen met overeenkomstige toepassing van de [artikelen 1.72, eerste lid, onder b][ref5], en [1.80][ref6].


