  - number: 1.56a
    text: |-
      De houder van een gastouderbureau maakt ten behoeve van een goede uitvoering van de bij of krachtens deze afdeling
      gestelde regels gebruik van het burgerservicenummer of, bij het ontbreken daarvan, van het sociaal-fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.56a
  - number: 1.56b
    text: |-
      1 De gastouder beschikt over een zodanige deskundigheid, organiseert de gastouderopvang op zodanige wijze, voorziet
      de voorziening voor gastouderopvang zodanig van materieel en voert een zodanig pedagogisch beleid, dat een en ander
      leidt of redelijkerwijs moet leiden tot verantwoorde gastouderopvang.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de kwaliteit van de
      gastouderopvang. Deze regels kunnen betrekking hebben op:

      a. de veiligheid en de gezondheid;

      b. de deskundigheidseisen waaraan de gastouder voldoet;

      c. de groepsgrootte;

      d. de accommodatie en de inrichting van de ruimte die bestemd is voor gastouderopvang;

      e. de beschikbare ruimte voor kinderen;

      f. het pedagogisch beleid en de pedagogische praktijk.

      3 De gastouder en andere personen van 18 jaar of ouder die op hetzelfde woonadres als de houder van
      de voorziening voor gastouderopvang hun hoofdverblijf hebben, alsmede de daar werkzame vrijwilligers
      en stagiaires, zijn in het bezit van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1].

      4 De verklaringen, bedoeld in het derde lid, worden door de gastouder aan de houder van het gastouderbureau
      overgelegd, voordat de gastouder zijn werkzaamheden aanvangt. De verklaringen zijn op het moment dat zij worden
      overgelegd, niet ouder dan twee maanden.

      5 Indien de houder van het gastouderbureau of de toezichthouder redelijkerwijs mag vermoeden dat een persoon als
      bedoeld in het derde lid niet langer voldoet aan de eisen voor het afgeven van een verklaring omtrent het gedrag,
      verlangt deze houder of de toezichthouder dat die persoon opnieuw een verklaring omtrent het gedrag overlegt die
      niet ouder is dan twee maanden. De desbetreffende persoon legt de verklaring over binnen een door deze houder of de
      toezichthouder vast te stellen termijn.

      6 De [artikelen 1.51][ref2], [1.53][ref3], [1.54, tweede lid][ref4] en [1.55][ref5] zijn van overeenkomstige
      toepassing op de gastouder.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.51
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1.53
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel1.54
