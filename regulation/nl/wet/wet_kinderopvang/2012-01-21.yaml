  - number: '1.49'
    text: |-
      1 Een houder van een kindercentrum biedt verantwoorde kinderopvang aan waaronder wordt verstaan opvang die
      bijdraagt aan een goede en gezonde ontwikkeling van het kind in een veilige en gezonde omgeving.

      2 Een houder van een voorziening voor gastouderopvang biedt verantwoorde gastouderopvang aan waaronder wordt
      verstaan opvang die bijdraagt aan een goede en gezonde ontwikkeling van het kind in een veilige en gezonde
      omgeving.

      3 Een houder van een gastouderbureau draagt zorg voor een verantwoorde uitvoering van de werkzaamheden van het
      bureau, waaronder wordt verstaan:

      a. het tot stand brengen en begeleiden van gastouderopvang die bijdraagt aan een goede en gezonde ontwikkeling van
      het kind in een veilige en gezonde omgeving;

      b. het doorgeleiden van de betalingen van ouders aan gastouders.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.49
  - number: '1.50'
    text: |-
      1 De houder van een kindercentrum organiseert de kinderopvang op zodanige wijze, voorziet het kindercentrum
      zowel kwalitatief, als kwantitatief zodanig van personeel en materieel, draagt zorg voor een zodanige
      verantwoordelijkheidstoedeling, en voert een zodanig pedagogisch beleid dat een en ander redelijkerwijs leidt
      tot verantwoorde kinderopvang. Ter uitvoering van de eerste volzin besteedt de houder van het kindercentrum
      in ieder geval aantoonbaar aandacht aan het aantal beroepskrachten in relatie tot het aantal kinderen per
      leeftijdscategorie, de groepsgrootte, de opleidingseisen van de beroepskrachten en de voorwaarden waaronder en de
      mate waarin beroepskrachten in opleiding kunnen worden belast met de verzorging en opvang van kinderen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de kwaliteit van
      kinderopvang bij een kindercentrum. Deze regels kunnen betrekking hebben op:

      a. de veiligheid en de gezondheid;

      b. de opleidingseisen waaraan de beroepskrachten voldoen;

      c. de inzet van beroepskrachten in opleiding;

      d. het aantal beroepskrachten en vrijwilligers in relatie tot het aantal kinderen per leeftijdscategorie;

      e. de groepsgrootte;

      f. het pedagogisch beleid en de pedagogische praktijk;

      g. de accommodatie en de inrichting van de ruimte die bestemd is voor kinderopvang;

      h. de beschikbare ruimte voor kinderen.

      3 De houder van een kindercentrum en de personen werkzaam bij een kindercentrum zijn in het bezit van een
      verklaring omtrent het gedrag, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1].

      4 De verklaring, bedoeld in het derde lid, wordt aan de houder van het kindercentrum overgelegd, voordat een
      persoon als bedoeld in het derde lid zijn werkzaamheden aanvangt. De verklaring is op het moment dat zij wordt
      overgelegd, niet ouder dan twee maanden.

      5 Indien de houder van het kindercentrum of de toezichthouder redelijkerwijs mag vermoeden dat een persoon als
      bedoeld in het derde lid niet langer voldoet aan de eisen voor het afgeven van een verklaring omtrent het gedrag,
      verlangt deze houder al dan niet op verzoek van de toezichthouder dat die persoon opnieuw een verklaring omtrent
      het gedrag overlegt die niet ouder is dan twee maanden. De desbetreffende persoon legt de verklaring over binnen
      een door deze houder of de toezichthouder vast te stellen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.50
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 1.50a
    text: |-
      De houder van een kindercentrum neemt deel aan het overleg tussen het college van burgemeester en wethouders en de
      bevoegde gezagsorganen van scholen over het onderwijsachterstandenbeleid, bedoeld in de [artikelen 167][ref1] en
      [167a van de Wet op het primair onderwijs][ref2] en werkt mee aan de totstandkoming van de afspraken en de nakoming
      ervan.


