      1 In afwijking van [artikel 1.5, eerste lid, onder b][ref1], heeft een ouder voor het berekeningsjaar 2010 tevens
      aanspraak op kinderopvangtoeslag in de door hem of zijn partner te betalen kosten jegens het Rijk onderscheidenlijk
      aanspraak op een tegemoetkoming in de door hem of zijn partner te betalen kosten van kinderopvang jegens
      de gemeente of jegens het Uitvoeringsinstituut werknemersverzekeringen, indien het betreft gastouderopvang,
      die plaatsvindt door tussenkomst van een geregistreerd gastouderbureau, in een of meer voorzieningen voor
      gastouderopvang die niet in het register kinderopvang zijn opgenomen onder voorwaarde dat is voldaan aan
      [artikel 1.56b, derde, vierde en vijfde lid][ref2].

      2 Voor zover er geen uniek nummer is verstrekt als bedoeld in [artikel 1.10][ref3], is dat artikel niet van
      toepassing gedurende het berekeningsjaar 2010.

      3 Dit artikel vervalt met ingang van 1 januari 2016.


