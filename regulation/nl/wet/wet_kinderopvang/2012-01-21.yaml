  - number: '3.10'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen, het college van burgemeester en wethouders en de gemeenteraad
      verstrekken aan Onze Minister de inlichtingen die hij voor de statistiek, de informatievoorziening en de
      beleidsvorming met betrekking tot deze wet nodig heeft.

      2 Onze Minister stelt regels omtrent de aard van de inlichtingen, bedoeld in het eerste lid, en de wijze waarop
      deze worden verstrekt.

      3 De inlichtingen, bedoeld in het eerste lid, worden kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel3.10
  - number: '3.11'
    text: |-
      De voordracht voor een krachtens de [artikelen 1.7, tweede, vierde, vijfde en zesde lid][ref1],
      [1.56, tweede lid][ref2], en [1.56b, tweede lid][ref3], vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


