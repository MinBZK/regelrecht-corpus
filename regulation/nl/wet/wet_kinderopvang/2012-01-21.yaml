      1 [Afdeling 2 van hoofdstuk 1][ref1] en [artikel 1.86][ref2] zijn gedurende ten hoogste zes
      maanden na het tijdstip van hun inwerkingtreding niet van toepassing op een ouder als bedoeld
      in [artikel 1.6, eerste lid, onder h en i][ref3], die gebruik maakt van kinderopvang die door
      het Uitvoeringsinstituut werknemersverzekeringen ten behoeve van die ouder is bekostigd op grond
      een vóór het tijdstip van inwerkingtreding van deze wet gesloten schriftelijke overeenkomst
      als bedoeld in [artikel 74, eerste lid, van de Werkloosheidswet][ref4] respectievelijk
      [artikel 22a, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref5].

      2 Op de financiering van kinderopvang, bedoeld in het eerste lid, blijven de
      [artikelen 74 van de Werkloosheidswet][ref6] onderscheidenlijk [22a][ref7], [34 tot en met 37][ref8],
      [45 tot en met 47][ref9] en [53 van de Wet op de (re)integratie arbeidsgehandicapten][ref10], zoals deze artikelen
      luidden tot het tijdstip van inwerkingtreding van deze wet, van toepassing.


