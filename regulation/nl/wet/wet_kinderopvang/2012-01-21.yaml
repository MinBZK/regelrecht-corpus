preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het wenselijk is om regels te stellen met betrekking tot
    tegemoetkomingen in de kosten van kinderopvang en om de kwaliteit van kinderopvang te waarborgen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 In dit hoofdstuk en de op dit hoofdstuk berustende bepalingen wordt verstaan onder:

        - *beroepskracht:* 1°. de persoon van 18 jaar of ouder die werkzaam is bij een kindercentrum en is belast met de
      verzorging, de opvoeding en het bijdragen aan de ontwikkeling van kinderen; 2°. de persoon van 18 jaar of ouder die
      werkzaam is bij een gastouderbureau en is belast met het tot stand brengen en begeleiden van gastouderopvang;
        - *beroepskracht in opleiding:* degene die de beroepsbegeleidende leerweg volgt, bedoeld in de
      [Wet educatie en beroepsonderwijs][ref1], en ten behoeve van beroepspraktijkvorming is belast met de verzorging,
      de opvoeding en het bijdragen aan de ontwikkeling van kinderen bij een kindercentrum of voorziening voor
      gastouderopvang;
        - *beroepskracht voorschoolse educatie:* degene die als beroepskracht werkzaam is en belast is met voorschoolse
      educatie en die voldoet aan de opleidingseisen en scholingseisen, bedoeld in [artikel 1.50b, onderdeel a][ref2];
        - *continentaal plat:* de exclusieve economische zone van het Koninkrijk, bedoeld in
      [artikel 1 van de Rijkswet instelling exclusieve economische zone][ref3], voor zover deze grenst aan de
      territoriale zee van Nederland;
        - *gastouder:* de natuurlijke persoon van 18 jaar of ouder die gastouderopvang biedt, met uitzondering van
      natuurlijke personen van wie een of meer kinderen op bij algemene maatregel van bestuur aan te wijzen gronden
      onderworpen zijn aan ondertoezichtstelling of voorlopige ondertoezichtstelling als bedoeld in [artikel 254][ref4],
      onderscheidenlijk [artikel 255, van Boek 1 van het Burgerlijk Wetboek][ref5], en met uitzondering van de persoon
      die op hetzelfde woonadres als de ouder of diens partner staat ingeschreven in de gemeentelijke basisadministratie
      persoonsgegevens;
        - *gastouderbureau:* een organisatie die gastouderopvang tot stand brengt en begeleidt en door tussenkomst van wie
      de betaling van ouders aan gastouders geschiedt;
        - *gastouderopvang:* kinderopvang: a. die plaatsvindt door tussenkomst van een geregistreerd
      gastouderbureau; b. die plaatsvindt in een gezinssituatie door een ander dan degene die als ouder op grond
      van [artikel 1.5, eerste lid][ref6], aanspraak kan maken op een kinderopvangtoeslag onderscheidenlijk een
      tegemoetkoming of diens partner; c. waarbij de opvang plaatsvindt: 1°. op het woonadres van de gastouder, met dien
      verstande dat op dit adres niet meer dan een voorziening voor gastouderopvang is gevestigd, 2°. op het woonadres
      van een van de ouders van de kinderen voor wie de gastouder opvang biedt, dan wel 3°. op twee of meer van deze
      woonadressen; en d. bestaande uit de gelijktijdige opvang van ten hoogste zes kinderen, waaronder begrepen de
      bloedverwant of aanverwant in de neergaande lijn van de gastouder of zijn partner, die in belangrijke mate wordt
      onderhouden door de gastouder of zijn partner en op hetzelfde woonadres als de gastouder staat ingeschreven in
      de gemeentelijke basisadministratie persoonsgegevens en de leeftijd van tien jaar nog niet heeft bereikt. Met een
      bloedverwant of aanverwant in de neergaande lijn wordt gelijkgesteld een pleegkind dat de leeftijd van tien jaar
      nog niet heeft bereikt;
        - *GGD:* een gemeentelijke gezondheidsdienst als bedoeld in [artikel 14 van de Wet publieke gezondheid][ref7];
        - *houder:* a. degene aan wie een onderneming als bedoeld in de [Handelsregisterwet 2007][ref8] toebehoort en die
      met die onderneming een kindercentrum of een gastouderbureau exploiteert; b. de gastouder die een voorziening voor
      gastouderopvang exploiteert.
        - *kindercentrum:* een voorziening waar kinderopvang plaatsvindt, anders dan gastouderopvang;
        - *kinderopvang:* het bedrijfsmatig of anders dan om niet verzorgen, opvoeden en bijdragen aan de ontwikkeling van
      kinderen tot de eerste dag van de maand waarop het voortgezet onderwijs voor die kinderen begint;
        - *kinderopvangtoeslag:* een tegemoetkoming van het Rijk als bedoeld in
      [artikel 2, eerste lid, onder h, van de Algemene wet inkomensafhankelijke regelingen][ref9] in de kosten van
      kinderopvang;
        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *ouder:* de bloed- of aanverwant in opgaande lijn of de pleegouder van een kind op wie de kinderopvang betrekking
      heeft, met dien verstande dat bij de beoordeling of sprake is van pleegouderschap een subsidie op grond van de
      [Wet op de jeugdzorg][ref10] buiten beschouwing blijft;
        - *oudercommissie:* de commissie, bedoeld in [artikel 1.58][ref11];
        - *overheidswerkgever:* de werkgever, bedoeld in
      [artikel 1, onderdeel r, van de Wet financiering sociale verzekeringen][ref12];
        - *overheidswerknemer:* de werknemer, bedoeld in
      [artikel 1, onderdeel p, van de Wet financiering sociale verzekeringen][ref13];
        - *register kinderopvang:* het register kinderopvang, bedoeld in [artikel 1.47a][ref14];
        - *Uitvoeringsinstituut werknemersverzekeringen:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref15];
        - *uitvoeringskosten:* de kosten die door een gastouderbureau in rekening worden gebracht bij de ouder of de
      gastouder, niet zijnde de kosten van gastouderopvang;
        - *voorschoolse educatie:* uitvoering van een door het college van burgemeester en wethouders gesubsidieerd
      programma dat gericht is op het verbeteren van de voorwaarden voor het met succes instromen in het basisonderwijs
      voor kinderen die nog niet tot een school kunnen worden toegelaten;
        - *voorziening voor gastouderopvang:* gastouderopvang door een specifieke gastouder op een specifiek woonadres;
        - *vrijwilliger:* degene die structureel al dan niet tegen een vrijwilligersvergoeding op regelmatige, niet
      incidentele, basis werkzaam is in de kinderopvang en is belast met de verzorging, de opvoeding en het bijdragen aan
      de ontwikkeling van kinderen;
        - *werkgever:* de werkgever, bedoeld in
      [artikel 1, onderdeel q, van de Wet financiering sociale verzekeringen][ref16];
        - *werknemer:* de werknemer, bedoeld in
      [artikel 1, onderdeel o, van de Wet financiering sociale verzekeringen][ref17].

      2 Tot kinderopvang worden niet gerekend:

      a. het toezichthouden op schoolgaande kinderen dat zich beperkt tot het toezicht tijdens de middagpauze;

      b. de verzorging, de opvoeding en het bijdragen aan de ontwikkeling van kinderen in een peuterspeelzaal als bedoeld
      in [artikel 2.1][ref18];

      c. verzorging en opvoeding die plaatsvindt in het kader van de [Wet op de jeugdzorg][ref19];

      d. de verzorging, de opvoeding en het bijdragen aan de ontwikkeling van kinderen, anders dan gastouderopvang, die
      geschiedt op een plaats waar het kind zijn hoofdverblijf heeft.


