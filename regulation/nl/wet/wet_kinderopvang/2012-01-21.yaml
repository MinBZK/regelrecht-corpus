  - number: '1.47'
    text: |-
      1 De houder van een kindercentrum of gastouderbureau doet van wijzigingen in de gegevens die bij de aanvraag,
      bedoeld in [artikel 1.45, eerste of tweede lid][ref1], zijn verstrekt, onverwijld mededeling aan het college van
      burgemeester en wethouders. Het college draagt er zorg voor dat deze wijzigingen worden doorgevoerd in het register
      kinderopvang.

      2 Het college van burgemeester en wethouders deelt de houder van het kindercentrum of gastouderbureau schriftelijk
      mee dat de wijziging in het register kinderopvang heeft plaatsgevonden.

      3 De houder van het gastouderbureau deelt de gastouder schriftelijk mee dat de wijziging in het register
      kinderopvang heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.45
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.47
