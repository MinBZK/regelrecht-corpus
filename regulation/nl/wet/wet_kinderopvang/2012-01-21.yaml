  - number: '1.66'
    text: |-
      1 Het college van burgemeester en wethouders kan de houder verbieden de exploitatie van een kindercentrum, een
      voorziening voor gastouderopvang of een gastouderbureau voort te zetten, zolang hij een bevel of aanwijzing niet
      opvolgt en het opleggen van een last onder bestuursdwang niet mogelijk is.

      2 Indien uit een onderzoek als bedoeld in [artikel 1.62][ref1] of anderszins blijkt dat het kindercentrum, de
      voorziening voor gastouderopvang of het gastouderbureau naar verwachting niet dan wel niet langer aan de bij of
      krachtens [afdeling 3, paragraaf 2][ref2], van dit hoofdstuk gegeven voorschriften zal voldoen, kan het college
      van burgemeester en wethouders zolang die situatie zich voordoet, de houder verbieden dat kindercentrum, die
      voorziening voor gastouderopvang of dat gastouderbureau in exploitatie te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.62
