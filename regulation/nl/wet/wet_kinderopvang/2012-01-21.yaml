  - number: '1.9'
    text: |-
      1 De financiële middelen tot dekking van de uitgaven voor de vermeerdering van de kinderopvangtoeslag, bedoeld
      in [artikel 1.8, eerste tot en met derde lid][ref1], voor zover toegekend aan ouders die als werknemer of
      overheidswerknemer tegenwoordige arbeid verrichten als bedoeld in [artikel 1.6, eerste lid, onder a][ref2],
      worden verkregen door het heffen van een opslag op de premie die ten gunste komt van het sectorfonds, bedoeld in
      [artikel 23, tweede lid, van de Wet financiering sociale verzekeringen][ref3], onderscheidenlijk de premie, bedoeld
      in [artikel 29 van die wet][ref4].

      2 De premieopslagen, bedoeld in het eerste lid, zijn verschuldigd door de werkgever onderscheidenlijk de
      overheidswerkgever.

      3 De premieopslagen worden vastgesteld bij ministeriële regeling. De [artikelen 26][ref5] onderscheidenlijk
      [31 van de Wet financiering sociale verzekeringen][ref6] zijn van overeenkomstige toepassing.

      4 Op de heffing en invordering van de premieopslagen zijn de [artikelen 57][ref7], [59][ref8] en
      [60 van de Wet financiering sociale verzekeringen][ref9] van overeenkomstige toepassing.


