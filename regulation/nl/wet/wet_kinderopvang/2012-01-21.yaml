  - number: '2.19'
    text: |-
      1 Het college van burgemeester en wethouders ziet toe op de naleving van de bij of krachtens [afdeling 2][ref1]
      van dit hoofdstuk gestelde regels, onderscheidenlijk de krachtens [artikel 2.23][ref2] gegeven aanwijzingen en
      bevelen en de krachtens [artikel 2.24, eerste lid][ref3], gegeven bevelen tot sluiting dan wel de krachtens artikel
      2.24, tweede lid, uitgevaardigde verboden, en de in de bij [artikel 2.8][ref4] vastgestelde algemene maatregel
      van bestuur vastgelegde basisvoorwaarden voor kwaliteit van voorschoolse educatie. Het college van burgemeester en
      wethouders wijst de directeur van de GGD aan als toezichthouder.

      2 Voor zover een peuterspeelzaal is gevestigd in een woning, zijn de toezichthouders ter uitvoering van de taken,
      bedoeld in het eerste lid, bevoegd zonder toestemming van de bewoners in die woning binnen te treden.


