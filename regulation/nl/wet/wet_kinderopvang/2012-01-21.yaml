  - number: '2.18'
    text: |-
      De houder treft een regeling voor de behandeling van klachten van de oudercommissie over een door hem genomen
      besluit als bedoeld in [artikel 2.17, eerste lid][ref1]. De getroffen regeling waarborgt dat aan de behandeling van
      een klacht van de oudercommissie niet wordt deelgenomen door de houder of door een persoon die werkzaam is voor of
      bij de houder op wie die klacht betrekking heeft. De houder brengt de getroffen regeling op passende wijze onder de
      aandacht van de oudercommissie. De [artikelen 2, tweede tot en met vijfde lid, zevende lid, en negende lid][ref2],
      [2a][ref3], [3c][ref4] en [4 van de Wet klachtrecht cliënten zorgsector][ref5] zijn van overeenkomstige toepassing
      voor de oudercommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2.17
