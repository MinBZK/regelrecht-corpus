  - number: '1.89'
    text: |-
      Een voordracht voor een krachtens dit hoofdstuk vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.89
  - number: '2.1'
    text: |-
      In dit hoofdstuk en de op dit hoofdstuk berustende bepalingen wordt verstaan onder:

        - *beroepskracht:* degene die werkzaam is bij een peuterspeelzaal, bezoldigd is en belast is met de verzorging, de
      opvoeding en het bijdragen aan de ontwikkeling van kinderen en die voldoet aan de opleidingseisen als bedoeld in
      [artikel 2.6, tweede lid][ref1];
        - *beroepskracht in opleiding:* degene die de beroepsbegeleidende leerweg, bedoeld in de
      [Wet educatie en beroepsonderwijs][ref2] volgt, en ten behoeve van beroepspraktijkvorming is belast met de
      verzorging, de opvoeding en het bijdragen aan de ontwikkeling van kinderen bij een peuterspeelzaal;
        - *beroepskracht voorschoolse educatie:* degene die als beroepskracht werkzaam is en belast is met voorschoolse
      educatie en die voldoet aan de opleidingseisen en scholingseisen, bedoeld in [artikel 2.8, onderdeel a][ref3];
        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *GGD:* gemeentelijke gezondheidsdienst als bedoeld in [artikel 17 van de Wet publieke gezondheid][ref4];
        - *houder:* degene die een peuterspeelzaal in stand houdt;
        - *ouder:* bloed- of aanverwant in opgaande lijn of de pleegouder van een kind op wie het peuterspeelzaalwerk
      betrekking heeft, met dien verstande dat bij de beoordeling of sprake is van pleegouderschap een subsidie op grond
      van de [Wet op de jeugdzorg][ref5] buiten beschouwing blijft;
        - *oudercommissie:* commissie als bedoeld in [artikel 2.15][ref6];
        - *peuterspeelzaalwerk:* de verzorging, de opvoeding en het bijdragen aan de ontwikkeling van kinderen uitsluitend
      bestemd voor kinderen vanaf de leeftijd van twee jaar tot het tijdstip waarop die kinderen kunnen deelnemen aan
      het basisonderwijs;
        - *peuterspeelzaal:* voorziening waar peuterspeelzaalwerk plaatsvindt, anders dan gastouderopvang of kinderopvang
      in een kindercentrum;
        - *register peuterspeelzaalwerk:* het register peuterspeelzaalwerk, bedoeld in [artikel 2.3][ref7];
        - *voorschoolse educatie:* uitvoering van een door het college van burgemeester en wethouders gesubsidieerd
      programma dat gericht is op het verbeteren van de voorwaarden voor het met succes instromen in het basisonderwijs
      voor kinderen die nog niet tot een school kunnen worden toegelaten;
        - *vrijwilliger:* degene die structureel al dan niet tegen een vrijwilligersvergoeding op regelmatige,
      niet incidentele, basis werkzaam is bij een peuterspeelzaal en is belast met de verzorging, de opvoeding
      en het bijdragen aan de ontwikkeling van kinderen en die niet voldoet aan de opleidingseisen, bedoeld in
      [artikel 2.6, tweede lid][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2.6
