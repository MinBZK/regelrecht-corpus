  - number: '1.63'
    text: |-
      1 De toezichthouder legt zijn oordeel naar aanleiding van een onderzoek bij een kindercentrum, een voorziening voor
      gastouderopvang of een gastouderbureau vast in een inspectierapport.

      2 Indien de toezichthouder oordeelt dat door de houder de bij of krachtens [afdeling 3, paragrafen 2][ref1] en
      [3][ref2], van dit hoofdstuk gegeven voorschriften niet zijn of zullen worden nageleefd, vermeldt hij dat in het
      rapport.

      3 Alvorens het rapport vast te stellen, stelt de toezichthouder de houder in de gelegenheid van het ontwerprapport
      kennis te nemen en daarover zijn zienswijze kenbaar te maken. De toezichthouder vermeldt de zienswijze van de
      houder in een bijlage bij het rapport.

      4 De toezichthouder zendt het inspectierapport na het te hebben vastgesteld onverwijld aan de houder, die de ouders
      en het personeel overeenkomstig [artikel 1.54, tweede en derde lid][ref3], daarover informeert.

      5 De toezichthouder maakt het inspectierapport uiterlijk drie weken na de vaststelling daarvan openbaar.

      6 De toezichthouder zendt een afschrift van het inspectierapport naar aanleiding van een onderzoek bij een
      kindercentrum waar voorschoolse educatie wordt aangeboden aan het college van burgemeester en wethouders en aan
      de Inspectie van het onderwijs, indien in een of meer van de basisvoorwaarden voor kwaliteit van voorschoolse
      educatie, bedoeld in [artikel 1.61][ref4], tekortkomingen zijn geconstateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1.54
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel1.61
