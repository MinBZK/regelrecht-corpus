  - number: '2.22'
    text: |-
      1 Onze Minister kan beleidsregels stellen omtrent de door de toezichthouder te hanteren werkwijze voor een
      onderzoek als bedoeld in deze paragraaf.

      2 De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.22
  - number: '2.23'
    text: |-
      1 Het college van burgemeester en wethouders van de gemeente waarin zich een peuterspeelzaal bevindt die de bij
      of krachtens [afdeling 2, paragrafen 2][ref1] en [3][ref2], van dit hoofdstuk gegeven voorschriften niet of in
      onvoldoende mate naleeft, kan de houder een schriftelijke aanwijzing geven.

      2 In een aanwijzing als bedoeld in het eerste lid geeft het college van burgemeester en wethouders met redenen
      omkleed aan op welke punten de in het eerste lid bedoelde voorschriften niet of in onvoldoende mate worden
      nageleefd, alsmede de in verband daarmee te nemen maatregelen.

      3 Indien de toezichthouder oordeelt dat de kwaliteit van het peuterspeelzaalwerk bij een peuterspeelzaal zodanig
      tekortschiet, dat het nemen van maatregelen redelijkerwijs geen uitstel kan lijden, kan de toezichthouder
      een schriftelijk bevel geven. Het bevel heeft een geldigheidsduur van zeven dagen, welke door het college van
      burgemeester en wethouders kan worden verlengd.

      4 De houder neemt de maatregelen binnen de bij de aanwijzing, onderscheidenlijk het bevel, gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.23
