  - number: '2.3'
    text: |-
      1 Uiterlijk tien weken na de aanvraag, bedoeld in [artikel 2.2, eerste lid][ref1], geeft het college van
      burgemeester en wethouders, bedoeld in artikel 2.2, eerste lid, een beschikking af aan de houder.

      2 In de beschikking die volgt op de aanvraag, bedoeld in [artikel 2.2, eerste lid][ref2], nadat uit het onderzoek,
      bedoeld in [artikel 2.20][ref3], en anderszins is gebleken dat de exploitatie redelijkerwijs zal plaatsvinden
      in overeenstemming met het bepaalde bij of krachtens de [paragrafen 2][ref4] en [3 van afdeling 2][ref5] van dit
      hoofdstuk, bepaalt het college van burgemeester en wethouders de datum van ingang van de exploitatie, waarbij deze
      datum niet voor de datum van bekendmaking van die beschikking ligt. Het college van burgemeester en wethouders
      draagt zorg voor inschrijving van de peuterspeelzaal in het register peuterspeelzaalwerk waarbij de datum van
      ingang van de exploitatie als startdatum van de registratie wordt opgenomen.

      3 Het college van burgemeester en wethouders deelt de houder schriftelijk mee dat inschrijving van de
      peuterspeelzaal in het register peuterspeelzaalwerk heeft plaatsgevonden.

      4 Bij een inschrijving als bedoeld in het tweede lid, doet het college van burgemeester en wethouders opgave van de
      gegevens die ingevolge [artikel 2.2, derde lid][ref6], zijn verstrekt.


