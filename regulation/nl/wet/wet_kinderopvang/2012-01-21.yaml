    text: |-
      1 De tegemoetkoming van het Uitvoeringsinstituut werknemersverzekeringen bedraagt voor een ouder als
      bedoeld in [artikel 1.29, eerste lid, onder b][ref1], voorzover de ouder een persoon is als bedoeld in
      [artikel 1.6, eerste lid, onder h of i][ref2], een derde deel van de kosten van kinderopvang, verhoogd met een bij
      regeling van Onze Minister zodanig vast te stellen bedrag, dat het totaal aan kinderopvangtoeslag en tegemoetkoming
      van het Uitvoeringsinstituut werknemersverzekeringen niet meer bedraagt dan de kosten van kinderopvang, bedoeld in
      [artikel 1.7, eerste lid][ref3].

      2 De tegemoetkoming van het Uitvoeringsinstituut werknemersverzekeringen bedraagt voor de overige
      ouders, bedoeld in [artikel 1.29, eerste lid][ref4], voorzover de ouder een persoon is als bedoeld in
      [artikel 1.6, eerste lid, onder h of i][ref5], een zesde deel van de kosten van kinderopvang, verhoogd met een bij
      regeling van Onze Minister zodanig vast te stellen bedrag, dat het totaal aan kinderopvangtoeslag en tegemoetkoming
      van het Uitvoeringsinstituut werknemersverzekeringen niet meer bedraagt dan de kosten van kinderopvang, bedoeld in
      [artikel 1.7, eerste lid][ref6].

      3 Bij regeling van Onze Minister kunnen regels worden gesteld ter voorkoming van samenloop van tegemoetkomingen
      ingevolge dit artikel, voorzover de ouder en zijn partner personen zijn als bedoeld in het eerste lid,
      onderscheidenlijk met tegemoetkomingen ingevolge [artikel 1.24][ref7], voorzover het gevallen betreft, waarin,
      ofwel de ouder ofwel zijn partner een persoon is als bedoeld in het tweede lid en de ander een persoon is als
      bedoeld in [artikel 1.24, tweede lid, onder a][ref8].


