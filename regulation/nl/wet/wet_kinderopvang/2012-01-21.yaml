  - number: '1.62'
    text: |-
      1 De toezichthouder onderzoekt na een aanvraag als bedoeld in [artikel 1.45, eerste of tweede lid][ref1], binnen
      een bij regeling van Onze Minister te stellen termijn of de exploitatie redelijkerwijs zal plaatsvinden in
      overeenstemming met het bepaalde bij of krachtens [afdeling 3, paragrafen 2][ref2] en [3, van dit hoofdstuk][ref3].

      2 Onverminderd het eerste lid onderzoekt de toezichthouder in redelijkheid bij ieder geregistreerd kindercentrum
      en geregistreerd gastouderbureau jaarlijks of de exploitatie in overeenstemming is met de bij of krachtens
      [afdeling 3, paragrafen 2][ref4] en [3, van dit hoofdstuk][ref5] gestelde regels.

      3 Onverminderd het eerste lid onderzoekt de toezichthouder in redelijkheid op grond van steekproeven jaarlijks of
      de exploitatie van geregistreerde voorzieningen voor gastouderopvang in overeenstemming is met de bij of krachtens
      [afdeling 3, paragrafen 2][ref6] en [3, van dit hoofdstuk][ref7] gestelde regels.

      4 Naast het onderzoek, bedoeld in het eerste, tweede en derde lid, kan de toezichthouder als daar
      aanleiding toe is incidenteel onderzoek verrichten naar de naleving door een houder van de bij of krachtens
      [afdeling 3, paragrafen 2][ref8] en [3, van dit hoofdstuk][ref9] gestelde regels. [Artikel 1.63][ref10] is van
      overeenkomstige toepassing, tenzij de aard of omvang van het onderzoek zich tegen openbare rapportage verzetten.


