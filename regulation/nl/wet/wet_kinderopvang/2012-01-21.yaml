  - number: '3.2'
    text: |-
      1 Ter uitvoering van [artikel 1.49, derde lid, onderdeel a][ref1], is het gastouderbureau gedurende het
      eerste kalenderjaar na inwerkingtreding van de wet van 18 juli 2009 tot wijziging van de Wet kinderopvang
      in verband met een herziening van het stelstel van gastouderopvang (*Stb.* 345) verantwoordelijk voor de
      beoordeling of de gastouderopvang naar verwachting voor 1 september van genoemd kalenderjaar redelijkerwijs
      zal plaatsvinden in overeenstemming met het bepaalde bij of krachtens de [paragrafen 2][ref2] en
      [3 van afdeling 3 van hoofdstuk 1][ref3].

      2 Het gastouderbureau stelt de ouders die gebruikmaken van de diensten van de gastouder in kennis van zijn in het
      eerste lid bedoelde beoordeling.

      3 Het gastouderbureau stelt de in het tweede lid bedoelde ouders voor de aanvang van het in het eerste lid bedoelde
      eerste kalenderjaar in kennis van zijn oordeel over de verwachtingen met betrekking tot het tijdig kunnen voldoen
      aan de in het eerste lid bedoelde eisen door de gastouder.

      4 Voor de toepassing van het eerste en derde lid baseert het gastouderbureau zich op geobjectiveerde redelijke
      maatstaven die aantoonbaar zijn afgeleid van de in het eerste lid bedoelde eisen.

      5 Het gastouderbureau stelt zich regelmatig op de hoogte van de inspanningen van de gastouder om voor 1
      september van het in het eerste lid bedoelde kalenderjaar overeenkomstig de in het eerste lid bedoelde
      beoordeling door het gastouderbureau te voldoen aan het bepaalde bij of krachtens de [paragrafen 2][ref4] en
      [3 van afdeling 3 van hoofdstuk 1][ref5].

      6 De gastouder verstrekt aan het gastouderbureau de benodigde informatie met het oog op toepassing van het tweede
      en derde lid.

      7 Ingeval het gastouderbureau redelijkerwijs mag vermoeden dat de in het vijfde lid bedoelde inspanningen van
      de gastouder tekortschieten, stelt het gastouderbureau de ouder daarvan onverwijld in kennis en bevordert het
      gastouderbureau dat de ouder gebruik kan maken van de diensten van een gastouder die gastouderopvang aanbiedt
      die naar het oordeel van het gastouderbureau naar verwachting voor 1 september van de in het eerste lid bedoelde
      kalenderjaar zal plaatsvinden in overeenstemming met het bepaalde bij of krachtens de [paragrafen 2][ref6] en
      [3 van afdeling 3 van hoofdstuk 1][ref7].

      8 Indien de gastouder uiterlijk op 31 december van het in het eerste lid bedoelde kalenderjaar niet is ingeschreven
      in het register kinderopvang, bedoeld in [artikel 1.47a][ref8], is de ouder aan het gastouderbureau geen
      uitvoeringskosten verschuldigd.

      9 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van dit artikel.


