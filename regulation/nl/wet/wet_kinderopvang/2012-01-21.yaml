  - number: '2.29'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen voor een periode van ten hoogste vier jaar ten behoeve van
      experimenten, die ten doel hebben de totstandkoming van innovatief peuterspeelzaalwerk mogelijk te maken, vormen
      van peuterspeelzaalwerk worden aangewezen en kunnen regels worden gesteld omtrent:

      a. de kwaliteit van de aan te wijzen vormen van peuterspeelzaalwerk;

      b. het toezicht op de naleving van de regels, bedoeld onder a;

      c. de hoogte van de ouderbijdrage voor peuterspeelzaalwerk;

      d. de duur van de aan te wijzen vormen van peuterspeelzaalwerk als experiment.

      Bij die regels kan worden afgeweken van de bepalingen in [afdeling 2][ref1] van dit hoofdstuk.

      2 Bij algemene maatregel van bestuur kunnen experimenten als bedoeld in het eerste lid na afloop van de looptijd
      worden voortgezet tot een structurele regeling is getroffen, doch niet langer dan met een tijdsduur van ten hoogste
      twee jaar. Het eerste lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
