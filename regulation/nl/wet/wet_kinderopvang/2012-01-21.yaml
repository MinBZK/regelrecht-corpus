  - number: '1.87'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen voor een periode van ten hoogste vier jaar ten behoeve van
      experimenten, die ten doel hebben de totstandkoming van innovatieve kinderopvang mogelijk te maken, vormen van
      kinderopvang worden aangewezen en kunnen regels worden gesteld omtrent:

      a. de kwaliteit van de aan te wijzen vormen van kinderopvang;

      b. het toezicht op de naleving van de regels, bedoeld onder a;

      c. de hoogte van de kinderopvangtoeslag en de hoogte van de tegemoetkomingen van de gemeente en van het
      Uitvoeringsinstituut werknemersverzekeringen;

      d. de duur van de aan te wijzen vormen van kinderopvang als experiment.

      Bij die regels kan worden afgeweken van [artikel 1.1, eerste lid][ref1], wat betreft de begrippen «gastouderbureau»
      en «gastouderopvang», artikel 1.1, tweede lid, onderdeel a, [artikel 1.7][ref2], [afdeling 3][ref3], met
      uitzondering van [artikel 1.48][ref4], alsmede van [afdeling 4, paragrafen 1][ref5] en [2][ref6], en
      [afdeling 5, paragraaf 2][ref7], van dit hoofdstuk.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voorwaarden worden gesteld aan de deelname aan een
      experiment.

      3 Indien toepassing wordt gegeven aan het eerste lid heeft een ouder als bedoeld in de [artikelen 1.6][ref8],
      [1.22][ref9], [1.29][ref10] en [1.35][ref11] aanspraak op een kinderopvangtoeslag in de door hem of zijn partner
      te betalen kosten jegens het Rijk onderscheidenlijk aanspraak op een tegemoetkoming in de door hem of zijn partner
      te betalen kosten van kinderopvang jegens de gemeente of jegens het Uitvoeringsinstituut werknemersverzekeringen,
      indien het betreft een experimentele vorm van kinderopvang, welke is geregistreerd.

      4 Bij algemene maatregel van bestuur kunnen experimenten als bedoeld in het eerste lid na afloop van de looptijd
      worden voortgezet tot een structurele regeling is getroffen, doch niet langer dan met een tijdsduur van ten hoogste
      twee jaar. Het eerste, tweede en derde lid zijn van overeenkomstige toepassing.


