  - number: '1.5'
    text: |-
      1 Een ouder heeft aanspraak op een kinderopvangtoeslag in de door hem of zijn partner te betalen kosten jegens
      het Rijk onderscheidenlijk aanspraak op een tegemoetkoming in de door hem of zijn partner te betalen kosten van
      kinderopvang jegens de gemeente of jegens het Uitvoeringsinstituut werknemersverzekeringen, indien het betreft:

      a. kinderopvang in een geregistreerd kindercentrum; of

      b. gastouderopvang in een geregistreerde voorziening voor gastouderopvang die plaatsvindt door tussenkomst van een
      geregistreerd gastouderbureau.

      2 Een ouder en diens partner die tevens ouder is worden voor de toepassing van deze wet geacht gezamenlijk één
      aanspraak te hebben.

      3 Indien een gastouderbureau uit het register kinderopvang, bedoeld in [artikel 1.47a][ref1], wordt verwijderd,
      geldt de in het eerste lid, onderdeel b, bedoelde voorwaarde van registratie van het gastouderbureau niet,
      gedurende een bij algemene maatregel van bestuur te bepalen uitlooptermijn waarbinnen de voorziening voor
      gastouderopvang op grond van [artikel 1.47a, tweede lid, onderdeel c][ref2], in het register kinderopvang
      ingeschreven blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.47a
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.47a
