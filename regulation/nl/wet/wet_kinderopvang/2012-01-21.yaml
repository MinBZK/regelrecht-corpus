  - number: '1.7'
    text: |-
      1 De hoogte van de kinderopvangtoeslag is afhankelijk van:

      a. de draagkracht, en

      b. de kosten van kinderopvang per kind die worden bepaald door:

      1º. het aantal uren kinderopvang per kind in het berekeningsjaar,

      2º. de voor die kinderopvang te betalen prijs, met inachtneming van het bedrag, bedoeld in het tweede lid, en

      3º. de soort kinderopvang.

      2 De uurprijs die bij de hoogte van de kinderopvangtoeslag, bedoeld in het eerste lid, in aanmerking wordt
      genomen gaat een bij algemene maatregel van bestuur vast te stellen bedrag niet te boven. Dat bedrag kan per soort
      kinderopvang verschillend worden vastgesteld en kan voor kinderopvang die plaatsvindt in landen die geen deel
      uitmaken van de Europese Unie dan wel geen partij zijn bij de Overeenkomst betreffende de Europese Economische
      Ruimte lager worden vastgesteld.

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de redelijke verhouding tussen het aantal,
      al dan niet in dienstverband, gewerkte uren van de ouder en zijn partner alsmede de in verband daarmee benodigde
      reistijd, en het aantal uren kinderopvang waarvoor toeslag kan worden aangevraagd. Desgevraagd toont de ouder ten
      genoegen van de Belastingdienst/Toeslagen aan dat aan de in de eerste volzin bedoelde regels is voldaan.

      4 Het aantal uren kinderopvang dat in aanmerking wordt genomen bij de hoogte van de kinderopvangtoeslag, bedoeld in
      het eerste lid, gaat een bij algemene maatregel van bestuur vast te stellen maximum, dat per soort kinderopvang of
      per leeftijdsgroep verschillend kan worden vastgesteld, niet te boven.

      5 De bedragen, bedoeld in het tweede lid, en de mate waarin het toetsingsinkomen van de ouder en, indien hij een
      partner heeft, dat van zijn partner een rol speelt bij de hoogte van de kinderopvangtoeslag, worden per 1 januari
      van ieder kalenderjaar bij regeling van Onze Minister herzien aan de hand van een bij algemene maatregel van
      bestuur aan te wijzen index ter zake van lonen of prijzen.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de hoogte en de
      berekeningswijze van de kinderopvangtoeslag, waarbij tevens tabellen worden vastgesteld, waaruit de relatie tussen
      de kosten van kinderopvang en de kinderopvangtoeslag kan worden afgelezen.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.7
  - number: '1.8'
    text: |-
      1 Indien een ouder en diens partner tegenwoordige arbeid verrichten als bedoeld in
      [artikel 1.6, eerste lid, onder a of b][ref1], wordt de kinderopvangtoeslag vermeerderd met een bedrag dat
      overeenkomt met een derde deel van de kosten van kinderopvang, bedoeld in [artikel 1.7, eerste lid][ref2].

      2 Voor een ouder die geen partner heeft en tegenwoordige arbeid verricht als bedoeld in
      [artikel 1.6, eerste lid, onder a of b][ref3], wordt de kinderopvangtoeslag vermeerderd met een bedrag dat
      overeenkomt met een zesde deel van de kosten van kinderopvang, bedoeld in [artikel 1.7, eerste lid][ref4].

      3 Het tweede lid is van overeenkomstige toepassing op een ouder met een partner die een persoon is als bedoeld in
      [artikel 1.22, eerste lid, onderdeel a][ref5], of [artikel 1.29, eerste lid, onderdeel a][ref6].

      4 Bij de toepassing van het eerste tot en met derde lid is [artikel 1.7, tweede en vierde lid][ref7], van
      overeenkomstige toepassing.


