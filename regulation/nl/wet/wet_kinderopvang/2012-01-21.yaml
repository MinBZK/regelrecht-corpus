  - number: '1.88'
    text: |-
      1 Onze Minister zendt na overleg met Onze Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn
      en Sport uiterlijk zes maanden voor de beëindiging van een experiment, als bedoeld in [artikel 1.87][ref1],
      een verslag over de doeltreffendheid en de effecten ervan alsmede een standpunt inzake de voortzetting van de
      desbetreffende regeling, anders dan als experiment, aan de beide kamers der Staten-Generaal.

      2 Indien een experiment als bedoeld in [artikel 1.87][ref2], eerder wordt beëindigd dan de bij algemene maatregel
      van bestuur, bedoeld in het eerste lid van dat artikel, daarvoor gestelde duur, zendt Onze Minister na overleg
      met Onze Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn en Sport, in afwijking van het
      eerste lid, uiterlijk twee maanden na de beëindiging van dat experiment een verslag over de doeltreffendheid en
      de effecten ervan alsmede een standpunt inzake de voortzetting van de desbetreffende regeling, anders dan als
      experiment, aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.87
