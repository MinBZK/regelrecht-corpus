  - number: '1.31'
    text: |-
      1 De tegemoetkoming wordt door de ouder aangevraagd bij het Uitvoeringsinstituut werknemersverzekeringen.

      2 De ouder doet bij de aanvraag zo mogelijk opgave van zijn zijn burgerservicenummer of, bij het ontbreken daarvan,
      zijn sociaal-fiscaalnummer en dat van zijn partner en van het kind waarop de tegemoetkoming betrekking heeft.

      3 Indien de ouder een partner heeft, wordt de aanvraag mede ondertekend door die partner.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.31
  - number: '1.32'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen maakt bij de uitvoering van deze wet gebruik van het
      burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.32
  - number: '1.33'
    text: |-
      1 De ouder verstrekt desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen alle gegevens en inlichtingen
      van hem en zijn partner die voor de aanspraak op en de hoogte van de tegemoetkoming van het Uitvoeringsinstituut
      van belang zijn.

      2 De inlichtingen en gegevens, bedoeld in het eerste lid, worden verstrekt binnen een door het Uitvoeringsinstituut
      werknemersverzekeringen te stellen redelijke termijn.

      3 Inlichtingen en gegevens die kunnen leiden tot de vaststelling van een lagere tegemoetkoming worden,
      onmiddellijk na het bekend worden daarvan, door de ouder schriftelijk verstrekt aan het Uitvoeringsinstituut
      werknemersverzekeringen.

      4 De houder verstrekt desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen alle gegevens
      en inlichtingen die voor de aanspraak van een ouder op de tegemoetkoming van het Uitvoeringsinstituut
      werknemersverzekeringen van belang zijn.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.33
  - number: '1.34'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de verlening, de voorschotverlening
      en de vaststelling van de tegemoetkoming van het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.34
  - number: '1.35'
    text: |-
      1 Het college van burgemeester en wethouders kan besluiten dat een ouder, die een persoon is als bedoeld in
      [artikel 1.6, eerste lid, onder c, e of f][ref1], voor wie het college van burgemeester en wethouders op grond
      van [artikel 7, eerste lid, aanhef en onder a, of derde lid, tweede volzin, van de Wet werk en bijstand][ref2],
      __REF002___________________________________________________________________________________________________________
      __________________,
      __REF003___________________________________________________________________________________________________________
      ____________________ of
      [artikel 30a, derde lid, onderdeel a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5],
      verantwoordelijk is voor het ondersteunen bij arbeidsinschakeling, na beëindiging van de aanspraak op grond
      van [artikel 1.22][ref6], in aansluiting daarop aanspraak heeft op een tegemoetkoming jegens de gemeente.
      [Artikel 1.24][ref7] is van toepassing.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan besluiten dat een ouder, die een persoon is als bedoeld
      in [artikel 1.6, eerste lid, onder h of i][ref8], tenzij het college van burgemeester en wethouders op grond
      van [artikel 30a, derde lid, onder a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref9] of op
      grond van [artikel 7, derde lid, tweede volzin, van de Wet werk en bijstand][ref10] verantwoordelijk is voor
      het ondersteunen bij arbeidsinschakeling, na beëindiging van de aanspraak op grond van [artikel 1.29][ref11], in
      aansluiting daarop aanspraak heeft op een tegemoetkoming jegens het Uitvoeringsinstituut werknemersverzekeringen.
      [Artikel 1.30][ref12] is van toepassing.

      3 Een besluit als bedoeld in het eerste of tweede lid wordt slechts genomen met betrekking tot een ouder
      of diens partner, die naar het oordeel van het college van burgemeesters en wethouders onderscheidenlijk
      het Uitvoeringsinstituut werknemersverzekeringen of een met het college van burgemeester en wethouders
      onderscheidenlijk Uitvoeringsinstituut werknemersverzekeringen vergelijkbaar bestuursorgaan in een andere lidstaat
      of Zwitserland, naar vermogen tracht arbeid in dienstbetrekking te verkrijgen. In een zodanig geval heeft de
      ouder eveneens aanspraak op een kinderopvangtoeslag, voor zover hij niet reeds een aanspraak heeft op grond van
      [artikel 1.6][ref13].

      4 Bij regeling van Onze Minister worden regels gesteld omtrent de maximale duur van aanspraken, verleend op grond
      van het eerste of tweede lid.


