  - number: 1.47a
    text: |-
      1 Onze Minister draagt zorg voor de inrichting van een register kinderopvang ten behoeve van de waarborging van de
      kwaliteit en de rechtszekerheid van de kinderopvang en gastouderopvang alsmede ten behoeve van het toezicht op en
      de handhaving van de bij of krachtens deze afdeling gestelde regels.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent het register kinderopvang.
      Deze regels hebben in ieder geval betrekking op:

      a. de vorm van het register;

      b. de in het register op te nemen gegevens;

      c. de vastlegging van gegevens in het register en de verwijdering van gegevens daaruit;

      d. de wijze waarop verbetering van onjuistheden in het register plaatsvindt;

      e. de verstrekking van gegevens;

      f. de openbaarheid van gegevens;

      g. de verantwoordelijkheden van degenen die gegevens aanleveren ten behoeve van het register.

      3 Kindercentra, gastouderbureau’s en voorzieningen voor gastouderopvang worden in het register kinderopvang
      geregistreerd onder een uniek nummer.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.47a
  - number: '1.48'
    text: |-
      1 Onze Minister kan een buiten Nederland gevestigd kindercentrum, een buiten Nederland gevestigde voorziening
      voor gastouderopvang of een buiten Nederland gevestigd gastouderbureau gelijkstellen met een geregistreerd
      kindercentrum, een geregistreerde voorziening voor gastouderopvang of een geregistreerd gastouderbureau, door
      opneming ervan in een door hem bij te houden register buitenlandse kinderopvang.

      2 Indien een ouder voornemens is gebruik te maken van een kindercentrum of een voorziening voor gastouderopvang
      door tussenkomst van een gastouderbureau buiten Nederland, doet hij bij Onze Minister een aanvraag om opneming van
      dat centrum, die voorziening voor gastouderopvang of dat bureau in het register buitenlandse kinderopvang. Opname
      in dat register vindt slechts plaats, indien aannemelijk is gemaakt dat de kwaliteit ervan naar aard en strekking
      overeenkomt met de op grond van deze wet gestelde regels.

      3 Onze Minister deelt de houder en de aanvrager schriftelijk mee dat opneming van het kindercentrum, de voorziening
      voor gastouderopvang onderscheidenlijk het gastouderbureau in het register buitenlandse kinderopvang heeft
      plaatsgevonden.

      4 Onze Minister maakt de opneming in en verwijdering uit het register buitenlandse kinderopvang bekend in de
      Staatscourant.

      5 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent het register buitenlandse kinderopvang en de
      wijze waarop verbetering van onjuistheden in dat register plaatsvindt.

      6 De houder doet van wijzigingen in de gegevens die ten behoeve van de opneming in het register buitenlandse
      kinderopvang zijn verstrekt, onverwijld mededeling aan Onze Minister.

      7 Onze Minister deelt de houder schriftelijk mee dat de wijzigingen in het register buitenlandse kinderopvang zijn
      aangetekend.

      8 De [artikelen 1.45 tot en met 1.47a][ref1] en [1.49 tot en met 1.60][ref2] en de [afdelingen 4][ref3] en
      [5 van dit hoofdstuk][ref4] zijn niet van toepassing op een kindercentrum of een gastouderbureau als bedoeld in het
      eerste lid.

      9 Bij regeling van Onze Minister kunnen regels worden gesteld omtrent:

      a. de wijze waarop aannemelijk wordt gemaakt dat een kindercentrum, voorziening voor gastouderopvang of
      gastouderbureau als bedoeld in het eerste lid voldoet aan het tweede lid;

      b. het toezicht op de naleving van het achtste lid;

      c. het verstrekken van gegevens en inlichtingen door de ouder en de houder alsmede de wijze waarop deze gegevens en
      inlichtingen worden verstrekt ten behoeve van dat toezicht.

      10 Indien blijkt dat de kwaliteit van het kindercentrum, de voorziening voor gastouderopvang of het gastouderbureau
      niet langer naar aard en strekking overeenkomt met de op grond van deze wet gestelde regels of dat de houder niet
      voldoet aan enige verplichting die op grond van deze wet op hem rust wordt het kindercentrum, de voorziening voor
      gastouderopvang of het gastouderbureau uit het register buitenlandse kinderopvang verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.45
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.50a
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk1
