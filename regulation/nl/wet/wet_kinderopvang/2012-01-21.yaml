  - number: '3.8'
    text: |-
      Ten aanzien van voor het tijdstip van inwerkingtreding van de Wet kinderopvang door het Rijk en gemeenten op grond
      van de [Welzijnswet 1994][ref1] verleende subsidies en uitkeringen aan kinderopvang, voorzover dat kinderopvang
      betreft waarop deze wet van toepassing is, blijft het bepaalde bij of krachtens de [Welzijnswet 1994][ref2],
      zoals dat laatstelijk voor 1 januari 2005 luidde, van toepassing op de financiële verantwoording, vaststelling en
      uitbetaling van die subsidies en uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0006705
      [ref2]: https://wetten.overheid.nl/BWBR0006705
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel3.8
