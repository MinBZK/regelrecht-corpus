  - number: 1.48a
    text: |-
      1 Bij regeling van Onze Minister kunnen categorieën van buiten Nederland gevestigde kindercentra, voorzieningen
      voor gastouderopvang of gastouderbureaus worden aangewezen die worden gelijkgesteld met geregistreerde
      kindercentra, geregistreerde voorzieningen voor gastouderopvang of geregistreerde gastouderbureaus, indien deze
      kindercentra, voorzieningen voor gastouderopvang of gastouderbureaus voldoen aan de in het land van vestiging
      geldende regels met betrekking tot de kwaliteit en deze regels naar aard en naar strekking overeenkomen met de bij
      of krachtens deze wet gestelde regels.

      2 [Artikel 1.48][ref1] is niet van toepassing op kindercentra, voorzieningen voor gastouderopvang en
      gastouderbureaus als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.48
