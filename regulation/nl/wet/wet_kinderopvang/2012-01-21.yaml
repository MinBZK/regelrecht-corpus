    text: |-
      1 Het college van burgemeester en wethouders en de gemeenteraad verstrekken Onze Minister alle gegevens en
      inlichtingen die hij voor het toezicht nodig heeft.

      2 Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de wijze waarop het college van
      burgemeester en wethouders de in het eerste lid bedoelde gegevens en inlichtingen verzamelen en verstrekken.

      3 De gegevens en inlichtingen, bedoeld in het eerste lid, worden kosteloos verstrekt.
