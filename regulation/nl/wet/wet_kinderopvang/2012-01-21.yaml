  - number: '2.2'
    text: |-
      1 Degene die voornemens is een peuterspeelzaal in exploitatie te nemen, doet daarvan een aanvraag bij het college
      van burgemeester en wethouders van de gemeente van vestiging.

      2 Een peuterspeelzaal wordt niet in exploitatie genomen voordat een onderzoek als bedoeld in [artikel 2.20][ref1]
      heeft plaatsgevonden waaruit blijkt dat de exploitatie redelijkerwijs zal plaatsvinden in overeenstemming met het
      bepaalde bij of krachtens de [paragrafen 2][ref2] en [3 van deze afdeling][ref3].

      3 Bij algemene maatregel van bestuur worden voorschriften gegeven over de gegevens die worden verstrekt bij de
      aanvraag, bedoeld in het eerste lid, en over de wijze van verstrekking van deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2.20
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
