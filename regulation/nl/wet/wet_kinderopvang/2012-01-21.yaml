  - number: '1.58'
    text: |-
      1 Een houder van een kindercentrum of van een gastouderbureau stelt voor elk door hem geëxploiteerd kindercentrum
      of gastouderbureau een oudercommissie in die tot taak heeft hem te adviseren over de aangelegenheden, genoemd in
      [artikel 1.60][ref1].

      2 De leden van de oudercommissie worden gekozen uit en door degenen wier kinderen in het kindercentrum of door
      tussenkomst van het gastouderbureau worden opgevangen.

      3 Personen werkzaam bij een kindercentrum onderscheidenlijk gastouderbureau zijn geen lid van de oudercommissie van
      dat kindercentrum of gastouderbureau.

      4 De oudercommissie bepaalt haar eigen werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.60
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.58
