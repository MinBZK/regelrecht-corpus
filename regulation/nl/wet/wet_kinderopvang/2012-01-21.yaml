    text: |-
      Een voordracht voor een krachtens deze afdeling vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.31
  - number: '3.1'
    text: |-
      1 Het college van burgemeester en wethouders van de gemeente van vestiging draagt er zorg
      voor dat kindercentra en gastouderbureaus die op het tijdstip van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      _________________________________________________________________ zijn opgenomen in het register kinderopvang,
      bedoeld in artikel 46, zoals dat luidde op de dag voor inwerkingtreding van voornoemde wijzigingswet, voor 1
      juli van het eerste kalenderjaar waarop voornoemde wijzigingswet betrekking heeft, worden ingeschreven in het
      register kinderopvang, bedoeld in [artikel 1.47a][ref2]. [Artikel 1.46, derde en vijfde lid][ref3], alsmede
      [artikel 1.47, eerste en tweede lid][ref4], zijn van toepassing.

      2 Indien de overheveling naar het register kinderopvang, bedoeld in het eerste lid, nog niet volledig heeft
      plaatsgevonden blijft [artikel 1.46][ref5], zoals dat luidde de dag voorafgaand aan de inwerkingtreding van de
      in het eerste lid genoemde wijzigingswet, tot 1 juli van het eerste kalenderjaar waarop voornoemde wijzigingswet
      betrekking heeft van toepassing op het college van burgemeester en wethouders van de desbetreffende gemeente.

      3 Een houder van een kindercentrum of gastouderbureau als bedoeld in het eerste lid, verstrekt desgevraagd aan het
      college de gegevens, bedoeld in [artikel 1.45, vierde lid][ref6].

      4 De in het eerste lid bedoelde inschrijving in het register kinderopvang van gastouderbureaus betreft een
      voorlopige inschrijving, welke voortduurt tot en met uiterlijk 31 december van het eerste kalenderjaar waarop de in
      het eerste lid genoemde wijzigingswet betrekking heeft.

      5 De in het vierde lid bedoelde inschrijving wordt definitief indien uiterlijk op de in dat lid genoemde datum
      uit het onderzoek, bedoeld in [artikel 1.62][ref7], is gebleken dat de exploitatie van het gastouderbureau
      zal plaatsvinden in overeenstemming met het bepaalde bij of krachtens de [paragrafen 2][ref8] en
      [3 van afdeling 3 van hoofdstuk 1][ref9].


