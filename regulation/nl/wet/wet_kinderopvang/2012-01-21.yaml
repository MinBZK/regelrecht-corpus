  - number: '2.25'
    text: |-
      1 Het college van burgemeester en wethouders stelt jaarlijks op een door Onze Minister te bepalen tijdstip
      een verslag vast van alle werkzaamheden die hij en de toezichthouders in het kader van deze afdeling in het
      voorafgaande kalenderjaar hebben verricht. Het college zendt het verslag aan de gemeenteraad en een afschrift
      daarvan aan Onze Minister.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de in het verslag op te nemen
      gegevens.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.25
  - number: '2.26'
    text: |-
      1 Wanneer het college van burgemeester en wethouders een krachtens deze wet gevorderde beslissing niet of niet naar
      behoren neemt dan wel een krachtens deze wet gevorderde handeling niet of niet naar behoren verricht, besluit Onze
      Minister daarin te voorzien ten laste van de gemeente.

      2 Het eerste lid vindt geen toepassing dan nadat het college van burgemeester en wethouders in de gelegenheid is
      gesteld binnen een door Onze Minister gestelde termijn alsnog de in het eerste lid bedoelde taken uit te voeren.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.26
  - number: '2.27'
    text: Deze afdeling is slechts van toepassing op niet-gesubsidieerde peuterspeelzalen.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.27
  - number: '2.28'
    text: |-
      1 Het college van burgemeester en wethouders kan de houder die een verplichting als
      bedoeld bij of krachtens [afdeling 2][ref1] van dit hoofdstuk, een afspraak als bedoeld in
      [artikel 167 van de Wet op het primair onderwijs][ref2], een aanwijzing onderscheidenlijk een bevel als bedoeld
      in [artikel 2.23][ref3] of [artikel 5:20 van de Algemene wet bestuursrecht][ref4] niet nakomt dan wel handelt in
      strijd met een verbod krachtens [artikel 2.24][ref5], een bestuurlijke boete opleggen van ten hoogste € 45 000.

      2 In afwijking van het eerste lid kan de overtreding van de houder niet met een bestuurlijke boete worden afgedaan,
      indien de overtreding opzettelijk of roekeloos geschiedt en een direct gevaar voor de gezondheid of de veiligheid
      van personen tot gevolg heeft.


