  - number: '1.60'
    text: |-
      1 De houder van een kindercentrum of van een gastouderbureau stelt de oudercommissie in ieder geval in de
      gelegenheid advies uit te brengen over elk voorgenomen besluit met betrekking tot:

      a. de wijze waarop uitvoering wordt gegeven aan [artikel 1.50][ref1] dan wel aan [artikel 1.56][ref2];

      b. voedingsaangelegenheden van algemene aard en het algemene beleid op het gebied van opvoeding, veiligheid of
      gezondheid;

      c. openingstijden;

      d. het beleid met betrekking tot spel- en ontwikkelingsactiviteiten ten behoeve van de kinderen, waaronder het
      aanbieden van voorschoolse educatie;

      e. de vaststelling of wijziging van een regeling inzake de behandeling van klachten en het aanwijzen van personen
      die belast worden met de behandeling van klachten;

      f. wijziging van de prijs van kinderopvang.

      2 Van een advies als bedoeld in het eerste lid kan de houder van het kindercentrum of van het gastouderbureau
      slechts afwijken indien hij schriftelijk en gemotiveerd aangeeft dat het belang van de kinderopvang zich tegen het
      advies verzet.

      3 De oudercommissie is bevoegd de houder van een kindercentrum of van een gastouderbureau ook ongevraagd te
      adviseren over de onderwerpen, genoemd in het eerste lid.

      4 De houder van een kindercentrum of van een gastouderbureau verstrekt de oudercommissie tijdig en desgevraagd
      schriftelijk alle informatie die deze voor de vervulling van zijn taak redelijkerwijs nodig heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.50
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.56
