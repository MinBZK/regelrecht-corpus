  - number: 1.1a
    text: |-
      1 Op deze wet is de [Algemene wet inkomensafhankelijke regelingen][ref1] van toepassing met uitzondering
      van [artikel 5 van die wet][ref2] op wijzigingen in de kosten van kinderopvang per kind als bedoeld in
      [artikel 7, eerste lid, onderdeel b][ref3].

      2 De uitvoering van het toekennen, uitbetalen en terugvorderen van de kinderopvangtoeslag is opgedragen aan de
      Belastingdienst/Toeslagen.

      3 In afwijking in zoverre van het eerste lid zijn met betrekking tot tegemoetkomingen van de
      gemeente en van het Uitvoeringsinstituut werknemersverzekeringen alleen de volgende bepalingen van de
      [Algemene wet inkomensafhankelijke regelingen][ref4] van overeenkomstige toepassing:

      a. [artikel 2, eerste lid, onderdelen b, g en p][ref5],

      b. [artikel 3][ref6],

      c. [artikel 4][ref7],

      d. [artikel 6][ref8],

      e. [artikel 9][ref9],

      f. [artikel 10][ref10],

      g. [artikel 44][ref11].

      4 In afwijking van [artikel 4, derde lid, van de Algemene wet inkomensafhankelijke regelingen][ref12] wordt een
      kind voor wie de pleegouder een subsidie ontvangt op grond van de [Wet op de jeugdzorg][ref13], geacht door die
      pleegouder in belangrijke mate te worden onderhouden.

      5 In afwijking van [artikel 15, eerste lid, van de Algemene wet inkomensafhankelijke regelingen][ref14],
      heeft een ouder over de berekeningsjaren 2012 en volgende geen aanspraak op kinderopvangtoeslag als bedoeld in
      [artikel 1.5][ref15] over de periode tot de eerste dag van de kalendermaand voor de datum waarop de aanvraag om
      kinderopvangtoeslag is ingediend bij de Belastingdienst/Toeslagen.


