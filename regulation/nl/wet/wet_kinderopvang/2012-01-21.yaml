  - number: 1.60a
    text: |-
      De houder van een kindercentrum of van een gastouderbureau treft een regeling voor de behandeling van klachten
      van de oudercommissie over een door hem genomen besluit als bedoeld in [artikel 1.60, eerste lid][ref1].
      De getroffen regeling waarborgt dat aan de behandeling van een klacht van de oudercommissie niet wordt
      deelgenomen door de houder van het kindercentrum of van het gastouderbureau of door een persoon die werkzaam
      is voor of bij de houder op wie die klacht betrekking heeft. De houder van het kindercentrum of van het
      gastouderbureau brengt de getroffen regeling op passende wijze onder de aandacht van de oudercommissie. De
      [artikelen 2, tweede tot en met vijfde lid, zevende lid, en negende lid][ref2], [2a][ref3], [3c][ref4] en
      [4 van de Wet klachtrecht cliënten zorgsector][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.60
      [ref2]: https://wetten.overheid.nl/BWBR0007414#Artikel2
