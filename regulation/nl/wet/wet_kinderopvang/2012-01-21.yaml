  - number: '1.25'
    text: |-
      De gemeenteraad stelt bij verordening regels vast omtrent de tegemoetkoming van de gemeente. Deze regels hebben
      betrekking op de verlening, de voorschotverlening en de vaststelling van de tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.25
  - number: '1.26'
    text: |-
      1 De tegemoetkoming wordt door de ouder aangevraagd bij het college van burgemeester en wethouders.

      2 De ouder doet bij de aanvraag zo mogelijk opgave van zijn burgerservicenummer, of bij het ontbreken daarvan, zijn
      sociaal-fiscaalnummer en dat van zijn partner en van het kind waarop de tegemoetkoming betrekking heeft.

      3 Indien de ouder een partner heeft, wordt de aanvraag mede ondertekend door die partner.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.26
  - number: '1.27'
    text: |-
      Het college van burgemeester en wethouders maakt bij de uitvoering van deze wet gebruik van het burgerservicenummer
      of, bij het ontbreken daarvan, het sociaal-fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.27
  - number: '1.28'
    text: |-
      1 De ouder verstrekt desgevraagd aan het college van burgemeester en wethouders alle gegevens en inlichtingen van
      hem en zijn partner die voor de aanspraak op en de hoogte van de tegemoetkoming van de gemeente van belang zijn.

      2 De inlichtingen en gegevens, bedoeld in het eerste lid, worden verstrekt binnen een door het college van
      burgemeester en wethouders te stellen redelijke termijn.

      3 Inlichtingen en gegevens die kunnen leiden tot de vaststelling van een lagere tegemoetkoming worden, onmiddellijk
      na het bekend worden daarvan, door de ouder schriftelijk verstrekt aan het college van burgemeester en wethouders.

      4 De houder verstrekt desgevraagd aan het college van burgemeester en wethouders alle gegevens en inlichtingen die
      voor de aanspraak van een ouder op de tegemoetkoming van de gemeente van belang zijn.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel1.28
  - number: '1.29'
    text: |-
      1 Een ouder heeft in een berekeningsjaar aanspraak op een tegemoetkoming van het Uitvoeringsinstituut
      werknemersverzekeringen:

      a. voor zover de ouder in dat jaar een persoon is die een uitkering ontvangt en
      gebruik maakt van een voorziening gericht op arbeidsinschakeling als bedoeld in
      [artikel 1.6, eerste lid, onder h of i][ref1], tenzij het college van burgemeester en wethouders op grond van
      [artikel 30a, derde lid, onder a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] of op grond
      van [artikel 7, derde lid, tweede zin, van de Wet werk en bijstand][ref3] verantwoordelijk is voor het ondersteunen
      van die ouder bij arbeidsinschakeling;

      b. voor zover de ouder in dat jaar een persoon is als bedoeld onder a, en zijn partner in dat jaar een
      persoon die in Nederland, een andere lidstaat of Zwitserland woont en een uitkering ontvangt als bedoeld in
      [artikel 1.6, eerste lid, onder h of i][ref4], en gebruik maakt van een in één van die onderdelen bedoelde
      voorziening gericht op arbeidsinschakeling, tenzij het college van burgemeester en wethouders op grond van de
      wetten, genoemd onder a, verantwoordelijk is voor het ondersteunen van die partner bij arbeidsinschakeling of een
      daarmee vergelijkbare uitkering respectievelijk voorziening, vastgesteld krachtens de wetgeving van een andere
      lidstaat of Zwitserland;

      c. voor zover de ouder in dat jaar een persoon is als bedoeld onder a, en zijn partner in dat jaar een persoon als
      bedoeld in [artikel 1.22, eerste lid, onder c][ref5];

      d. voor zover de ouder in dat jaar een persoon is als bedoeld in [artikel 1.22, eerste lid, onder a of b][ref6], en
      zijn partner in dat jaar een persoon als bedoeld onder b;

      e. voor zover de ouder in dat jaar een persoon is als bedoeld onder a, en zijn partner in dat jaar een persoon die
      in Nederland, een andere lidstaat of Zwitserland woont en in Nederland of op het continentaal plat, in een andere
      lidstaat of in Zwitserland arbeid verricht;

      f. voor zover de ouder in dat jaar een persoon is als bedoeld in [artikel 1.6, eerste lid, onder a][ref7], en zijn
      partner een persoon als bedoeld onder b.

      2 Een persoon als bedoeld in het eerste lid onder a heeft slechts aanspraak op een tegemoetkoming indien hij geen
      partner heeft.

      3 Een ouder heeft in de berekeningsjaren 2012 en volgende geen aanspraak op een tegemoetkoming van het
      Uitvoeringsinstituut werknemersverzekeringen over de periode tot de eerste dag van de kalendermaand voor de datum
      waarop de aanvraag om die tegemoetkoming is ingediend bij het Uitvoeringsinstituut werknemersverzekeringen.


