  - number: '2.12'
    text: |-
      1 In een peuterspeelzaal wordt de Nederlandse taal als voertaal gebruikt. Daar waar naast de Nederlandse taal, de
      Friese taal of een streektaal in levend gebruik is, kan de Friese taal of de streektaal mede als voertaal worden
      gebruikt.

      2 In afwijking van het eerste lid kan mede een andere taal als voertaal worden gebezigd, indien de herkomst
      van de kinderen in specifieke omstandigheden daartoe noodzaakt, overeenkomstig een door de houder vastgestelde
      gedragscode.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.12
  - number: '2.13'
    text: |-
      1 Onze Minister kan in overeenstemming met Onze Minister voor Jeugd en Gezin, beleidsregels stellen omtrent de
      toepassing van de [artikelen 2.5][ref1], [2.6][ref2] en [2.9][ref3].

      2 De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2.5
