  - number: 3.6b
    text: |-
      1 Voorzieningen voor gastouderopvang die niet zijn opgenomen in het register kinderopvang, worden voor de
      toepassing van [artikel 1.5, eerste lid, onder b][ref1], gelijk gesteld met een geregistreerde voorziening voor
      gastouderopvang op voorwaarde dat:

      a. van de gastouder die de opvang verzorgt in een gelijkgestelde voorziening één voorzienig voor gastouderopvang is
      opgenomen in het register kinderopvang; en

      b. de gelijkgestelde voorzieningen voor gastouderopvang voldoen aan het bepaalde bij of krachtens de
      [paragrafen 2][ref2] en [3 van afdeling 3 van hoofdstuk 1][ref3].

      2 Indien opvang plaatsvindt in meer dan een voorzienig van gastouderopvang heeft een aanvraag als bedoeld in
      [artikel 1.45, tweede lid][ref4], betrekking:

      a. op het woonadres van de gastouder, indien de gastouderopvang zal plaatsvinden op zowel het woonadres van de
      gastouder als op het woonadres van een of meer ouders; of

      b. op een van de woonadressen van de ouders, indien de gastouderopvang uitsluitend zal plaatsvinden op twee of meer
      woonadressen van ouders.

      3 Indien de gastouder van wie een voorziening voor gastouderopvang met het woonadres van een ouder is ingeschreven
      in het register kinderopvang, na die inschrijving tevens opvang gaat bieden op het eigen woonadres, wordt dit
      aangemerkt als een wijziging in de gegevens als bedoeld in [artikel 1.47, eerste lid][ref5].

      4 Op het in exploitatie nemen van een op grond van het eerste lid gelijkgestelde voorziening voor gastouderopvang
      zijn de [artikelen 1.45 tot en met 1.47a][ref6] niet van toepassing.

      5 Een ouder die gebruik maakt van een of meer voorzieningen die zijn gelijkgesteld op grond van het eerste lid,
      verstrekt het in [artikel 1.10][ref7] bedoelde unieke nummer dat is afgegeven voor de geregistreerde voorziening
      bedoeld in het eerste lid, onder a, eveneens ten aanzien van de gelijkgestelde voorzieningen.

      6 Dit artikel geldt vanaf het berekeningsjaar 2011 en vervalt met ingang van een bij koninklijk besluit te bepalen
      tijdstip waarbij de verschillende leden op verschillende tijdstippen kunnen vervallen.


