  - number: 3.6c
    text: |-
      1 De in [artikel 1.61, eerste lid][ref1], genoemde toezichthouder kan in afwijking van [artikel 1.62][ref2] tevens
      ten aanzien van een op grond van [artikel 3.6b][ref3], eerste lid, gelijkgestelde voorziening voor gastouderopvang
      onderzoeken of de exploitatie van deze voorziening redelijkerwijs plaatsvindt in overeenstemming met het bepaalde
      bij of krachtens de [paragrafen 2][ref4] en [3 van afdeling 3 van hoofdstuk 1][ref5]. De artikelen 1.61, 1.62,
      derde lid, en [1.63 tot en met 1.66][ref6] zijn met ingang van 1 januari 2011 van overeenkomstige toepassing op een
      op grond van artikel 3.6b, eerste lid, gelijkgestelde voorziening voor gastouderopvang.

      2 Dit artikel vervalt met ingang van een bij koninklijk besluit te bepalen tijdstip.


