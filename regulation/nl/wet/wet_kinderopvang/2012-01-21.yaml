      1 Onze Minister brengt na overleg met Onze Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn en
      Sport gedurende drie jaar na de inwerkingtreding van deze wet jaarlijks aan de Staten-Generaal een verslag uit over
      de werking ervan.

      2 Onze Minister brengt na overleg met Onze Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn en
      Sport drie jaar na de inwerkingtreding van deze wet, en vervolgens telkens na drie jaar, aan de Staten-Generaal een
      verslag uit over de doeltreffendheid en de effecten van deze wet in de praktijk.

