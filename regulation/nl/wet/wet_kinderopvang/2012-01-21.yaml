  - number: '1.57'
    text: |-
      Indien de kinderopvang in een kindercentrum geschiedt uitsluitend en onbezoldigd door ten minste een van de ouders
      van de in die voorziening opgevangen kinderen worden voor de toepassing van [artikel 1.50, eerste lid][ref1],
      ouders gelijkgesteld met personeel en beroepskrachten. Op ouders, bedoeld in de eerste zin, is
      [artikel 1.50, tweede tot en met vijfde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.50
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.50
