  - number: '2.20'
    text: |-
      1 De toezichthouder onderzoekt na een aanvraag als bedoeld in [artikel 2.2, eerste lid][ref1], binnen een
      bij regeling van Onze Minister te stellen termijn of de instandhouding redelijkerwijs zal plaatsvinden in
      overeenstemming met het bepaalde bij of krachtens [afdeling 2, paragrafen 2][ref2] en [3][ref3] van dit hoofdstuk.

      2 Onverminderd het eerste lid onderzoekt de toezichthouder jaarlijks of de exploitatie van elke peuterspeelzaal
      plaatsvindt in overeenstemming met de bij of krachtens [afdeling 2, paragrafen 2][ref4] en [3][ref5], van dit
      hoofdstuk gestelde regels, behoudens bijzondere omstandigheden.

      3 Naast het onderzoek, bedoeld in het eerste en tweede lid, kan de toezichthouder incidenteel onderzoek verrichten
      naar de naleving door een houder van de bij of krachtens [afdeling 2, paragrafen 2][ref6] en [3][ref7], van dit
      hoofdstuk gestelde regels. [Artikel 2.21][ref8] is van overeenkomstige toepassing, tenzij de aard of omvang van het
      onderzoek zich tegen openbare rapportage verzetten.


