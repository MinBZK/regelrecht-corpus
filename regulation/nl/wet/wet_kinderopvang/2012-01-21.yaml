  - number: '1.6'
    text: |-
      1 Een ouder heeft voor een berekeningsjaar aanspraak op een kinderopvangtoeslag, indien de ouder in dat jaar:

      a. tegenwoordige arbeid verricht waaruit inkomen uit werk en woning in de zin van de
      [Wet inkomstenbelasting 2001][ref1] wordt genoten,

      b. zonder enige vergoeding arbeid verricht in de onderneming van de partner in de zin van
      [artikel 3.78 van de Wet inkomstenbelasting 2001][ref2],

      c. algemene bijstand of een uitkering ontvangt op grond van de [Wet werk en bijstand][ref3], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5]
      of de [Algemene nabestaandenwet][ref6], en gebruik maakt van een voorziening, gericht op
      arbeidsinschakeling als bedoeld in [artikel 7, eerste lid, onder a, van de Wet werk en bijstand][ref7],
      __REF005___________________________________________________________________________________________________________
      __________________ en
      __REF006___________________________________________________________________________________________________________
      ____________________, die de noodzaak tot kinderopvang met zich brengt,

      d.

      e. de leeftijd van 18 jaar nog niet heeft bereikt, scholing of een opleiding volgt en met toepassing van
      [artikel 16][ref10] of [artikel 18, eerste en vierde lid, van de Wet werk en bijstand][ref11] algemene bijstand
      ontvangt of kan ontvangen,

      f. als niet-uitkeringsgerechtigde werkzoekende is geregistreerd bij het Uitvoeringsinstituut
      werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref12],
      en gebruik maakt van een voorziening gericht op arbeidsinschakeling als bedoeld in
      [artikel 7, eerste lid, onder a, van de Wet werk en bijstand][ref13],

      g. een inburgeringsvoorziening volgt als bedoeld in [artikel 19 van de Wet inburgering][ref14], met uitzondering
      van de ouder die op grond van de onderdelen c of h van dit artikellid een tegemoetkoming ontvangt,

      h. recht heeft op of een uitkering ontvangt op grond van [hoofdstuk II van de Werkloosheidswet][ref15], en blijkens
      de bijlage of het plan, bedoeld in [artikel 29, tweede lid, van die wet][ref16], deelneemt aan een traject gericht
      op het vergroten van de mogelijkheden tot inschakeling in het arbeidsproces of onbeloonde werkzaamheden op een
      proefplaats als bedoeld in [artikel 76a van die wet][ref17] bij een werkgever verricht,

      i. recht heeft op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref18], de [Wet werk en arbeidsondersteuning jonggehandicapten][ref19],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref20], arbeidsondersteuning op
      grond van de Wet werk en arbeidsondersteuning jonggehandicapten of een uitkering op grond van
      [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref21] of recht heeft op ziekengeld op grond van
      de [Ziektewet][ref22]:

      1°. ten behoeve van wie het Uitvoeringsinstituut werknemersverzekeringen werkzaamheden,
      gericht op de bevordering van de inschakeling in het arbeidsproces als bedoeld in
      [artikel 30a, achtste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref23] laat verrichten,

      2°. ten behoeve van wie de eigenrisicodrager, bedoeld in
      [artikel 82 van de Wet werk en inkomen naar arbeidsvermogen][ref24] werkzaamheden, gericht op de bevordering van de
      inschakeling in het arbeidsproces als bedoeld in [artikel 42 van die wet][ref25] laat verrichten, of

      3°. werkzaamheden op een proefplaats verricht als bedoeld in
      [artikel 65g van de Wet op de arbeidsongeschiktheidsverzekering][ref26], [artikel 2:24][ref27]
      of [3:69 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref28],
      [artikel 67e van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref29],
      [artikel 37 van de Wet werk en inkomen naar arbeidsvermogen][ref30] of [artikel 52e van de Ziektewet][ref31],

      j. is ingeschreven bij een school of instelling als bedoeld in [paragraaf 2.2][ref32] of
      [2.4 van de Wet tegemoetkoming onderwijsbijdragen en schoolkosten][ref33] dan wel als bedoeld in de
      [artikelen 2.8 tot en met 2.11 van de Wet studiefinanciering 2000][ref34].

      k.

      l.

      2 Een ouder die niet in Nederland woont, heeft slechts aanspraak op een kinderopvangtoeslag indien hij in een
      andere lidstaat of Zwitserland woont en, daartoe gerechtigd, in Nederland of op het continentaal plat arbeid
      verricht of een uitkering ontvangt als bedoeld in het eerste lid, onder c, e, h of i, en gebruik maakt van een in
      één van die onderdelen bedoelde voorziening gericht op arbeidsinschakeling.

      3 Een ouder met een partner heeft slechts aanspraak op een kinderopvangtoeslag, indien de partner in Nederland, een
      andere lidstaat of Zwitserland woont, en

      a. in Nederland of op het continentaal plat, in een andere lidstaat of in Zwitserland arbeid verricht,

      b. een uitkering ontvangt als bedoeld in het eerste lid, onder c, e, h of i, en gebruik maakt van een in één
      van die onderdelen bedoelde voorziening gericht op arbeidsinschakeling of een daarmee vergelijkbare uitkering
      respectievelijk voorziening, vastgesteld krachtens de wetgeving van een andere lidstaat of Zwitserland,

      c. werkloos wordt als bedoeld in het tweede lid en een uitkering ontvangt als bedoeld in het tweede lid, onder
      a of b, of een daarmee vergelijkbare uitkering, vastgesteld krachtens de wetgeving van een andere lidstaat of
      Zwitserland, of

      d. een persoon is als bedoeld in het eerste lid, onder f, g, j, k of l.

      4 Voor de toepassing van deze wet wordt met inkomen uit werk en woning als bedoeld in het eerste lid, onderdeel
      a, gelijkgesteld een daarmee overeenkomend inkomen dat niet tot het verzamelinkomen van de ouder behoort omdat het
      niet behoort tot het Nederlands inkomen als bedoeld in [hoofdstuk 7 van de Wet inkomstenbelasting 2001][ref35], of
      is vrijgesteld op grond van bepalingen van internationaal recht.

      5 Een ouder die in een berekeningsjaar of in het daaraan voorafgaande berekeningjaar arbeid heeft verricht
      als bedoeld in artikel 1.6, eerste lid, onderdeel a of b, behoudt gedurende drie kalendermaanden, gerekend
      vanaf de eerste dag na de dag waarop het verrichten van die arbeid is beëindigd, dezelfde aanspraak op een
      kinderopvangtoeslag als voor die beëindiging bestond.


