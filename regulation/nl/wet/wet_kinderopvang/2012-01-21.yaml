  - number: '1.46'
    text: |-
      1 Uiterlijk tien weken na de aanvraag, bedoeld in [artikel 1.45, eerste of tweede lid][ref1], geeft het college van
      burgemeester en wethouders, bedoeld in [artikel 1.45, eerste of tweede lid][ref2], een beschikking af aan de houder
      van een kindercentrum of gastouderbureau.

      2 In de beschikking die volgt op de aanvraag, bedoeld in [artikel 1.45, eerste of tweede lid][ref3],
      nadat uit het onderzoek, bedoeld in [artikel 1.62][ref4], en anderszins is gebleken dat de exploitatie
      redelijkerwijs zal plaatsvinden in overeenstemming met het bepaalde bij of krachtens de [paragrafen 2][ref5]
      en [3 van deze afdeling][ref6], bepaalt het college van burgemeester en wethouders de datum van ingang van
      de exploitatie, waarbij deze datum niet voor de datum van bekendmaking van die beschikking ligt. Het college
      van burgemeester en wethouders draagt zorg voor inschrijving van het kindercentrum, het gastouderbureau of de
      voorziening voor gastouderopvang in het register kinderopvang waarbij de datum van ingang van de exploitatie als
      startdatum van de registratie wordt opgenomen.

      3 Het college van burgemeester en wethouders deelt de houder van het kindercentrum of gastouderbureau
      schriftelijk mee dat inschrijving van het kindercentrum, het gastouderbureau onderscheidenlijk de voorziening voor
      gastouderopvang in het register kinderopvang heeft plaatsgevonden.

      4 De houder van het gastouderbureau deelt de gastouder schriftelijk mee dat inschrijving van de voorziening voor
      gastouderopvang in het register kinderopvang heeft plaatsgevonden.

      5 Bij een inschrijving als bedoeld in het tweede lid, doet het college van burgemeester en wethouders opgave van de
      gegevens die ingevolge [artikel 1.45, vierde lid][ref7], zijn verstrekt.

      6 Indien in een kindercentrum voorschoolse educatie wordt aangeboden, neemt het college van burgemeester en
      wethouders dit op in het register kinderopvang.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.45
