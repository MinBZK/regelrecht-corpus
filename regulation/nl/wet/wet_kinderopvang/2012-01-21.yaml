  - number: '2.14'
    text: Deze paragraaf is slechts van toepassing op niet-gesubsidieerde peuterspeelzalen.
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.14
  - number: '2.15'
    text: |-
      1 Een houder van een peuterspeelzaal biedt voor elk door hem geëxploiteerde peuterspeelzaal aan degenen van wie de
      kinderen in de peuterspeelzaal worden opgevangen, de gelegenheid deel te nemen aan een oudercommissie die tot taak
      heeft hem te adviseren over de aangelegenheden, genoemd in [artikel 2.17][ref1].

      2 De leden van de oudercommissie worden gekozen uit en door degenen van wie de kinderen in de peuterspeelzaal
      worden opgevangen.

      3 Personen werkzaam bij een peuterspeelzaal zijn geen lid van de oudercommissie van die peuterspeelzaal.

      4 De oudercommissie bepaalt haar eigen werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2.17
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '2.17'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: '2.16'
    text: |-
      1 De houder stelt binnen zes maanden na de aanvraag, bedoeld in [artikel 2.2, eerste lid][ref1], voor de
      oudercommissie een reglement vast.

      2 Het reglement bevat in ieder geval regels omtrent:

      a. het aantal leden van de oudercommissie;

      b. de wijze waarop de leden van de oudercommissie worden gekozen;

      c. de zittingsduur van de leden van de oudercommissie.

      3 Het reglement bevat geen regels omtrent de werkwijze van de oudercommissie.

      4 De oudercommissie beslist bij meerderheid van stemmen.

      5 Wijziging van het reglement behoeft instemming van de oudercommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0017017/2012-01-21#Artikel2.16
