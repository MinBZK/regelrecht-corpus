  - number: '35.3'
    text: |-
      Een besluit als bedoeld in het eerste of tweede lid wordt slechts genomen met betrekking tot een ouder
      of diens partner, die naar het oordeel van het college van burgemeesters en wethouders onderscheidenlijk
      het Uitvoeringsinstituut werknemersverzekeringen of een met het college van burgemeester en wethouders
      onderscheidenlijk Uitvoeringsinstituut werknemersverzekeringen vergelijkbaar bestuursorgaan in een andere lidstaat
      of Zwitserland, naar vermogen tracht arbeid in dienstbetrekking te verkrijgen. In een zodanig geval heeft de
      ouder eveneens aanspraak op een kinderopvangtoeslag, voor zover hij niet reeds een aanspraak heeft op grond van
      [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '35.4'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld omtrent de maximale duur van aanspraken, verleend op grond van
      het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel35
  - number: '38.1'
    text: |-
      Bedragen door een ouder of diens partner in het kader van deze wet verschuldigd aan de gemeente worden ingevorderd
      door het college van burgemeester en wethouders. Een bedrag is invorderbaar vanaf een maand na de dag van
      dagtekening van de beschikking waarbij de vordering is ontstaan.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel38
  - number: '38.2'
    text: |-
      De [artikelen 58 tot en met 60 van de Wet werk en bijstand][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
  - number: '39'
    text: |-
      Op de invordering van bedragen door een ouder of diens partner in het kader van
      deze wet verschuldigd aan het Uitvoeringsinstituut werknemersverzekeringen zijn de
      [artikelen 57 tot en met 57b van de Wet op de arbeidsongeschiktheidsverzekering][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel57
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '57'
  - number: '40'
    text: |-
      De kinderopvangtoeslag, alsmede de tegemoetkomingen van de gemeente of het Uitvoeringsinstituut
      werknemersverzekeringen blijven buiten beschouwing bij de verlening van andere op het inkomen of vermogen
      afgestemde publiekrechtelijke uitkeringen en verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel40
  - number: '41.1'
    text: |-
      De tegemoetkomingen van de gemeente of het Uitvoeringsinstituut werknemersverzekeringen zijn niet vatbaar voor
      vervreemding, verpanding, belening of beslag, waaronder begrepen beslag ingevolge faillissement of toepassing van
      de schuldsaneringsregeling natuurlijke personen, tenzij het betreft de inning van:
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel41
  - number: 41.1.a
    text: vorderingen van houders ter zake van verleende kinderopvang;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel41
  - number: 41.1.b
    text: vorderingen van de gemeente of het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel41
  - number: '41.2'
    text: Elk beding dat strijdt met het eerste lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel41
  - number: '44'
    text: |-
      De ouder en zijn partner zijn ten aanzien van schulden voortvloeiend uit vorderingen van de gemeente of het
      Uitvoeringsinstituut werknemersverzekeringen ingevolge deze wet, hoofdelijk aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel44
  - number: '45.1'
    text: |-
      Degene die voornemens is een kindercentrum of gastouderbureau in exploitatie te nemen, doet daarvoor een aanvraag
      bij het college van burgemeester en wethouders van de gemeente van vestiging.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel45
  - number: '45.2'
    text: |-
      De houder van een gastouderbureau dient een aanvraag in voor degene die door zijn tussenkomst voornemens is
      gastouderopvang te bieden. De aanvraag, bedoeld in de eerste volzin, wordt namens de gastouder gedaan bij het
      college van burgemeester en wethouders van de gemeente van vestiging van de voorziening voor gastouderopvang.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel45
  - number: '45.3'
    text: |-
      Een kindercentrum, een gastouderbureau of een voorziening voor gastouderopvang wordt niet in exploitatie genomen
      voordat een onderzoek als bedoeld in [artikel 62][ref1] heeft plaatsgevonden, waaruit blijkt dat de exploitatie
      redelijkerwijs zal plaatsvinden in overeenstemming met het bepaalde bij of krachtens de [paragrafen 2][ref2] en
      [3 van dit hoofdstuk][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '45.4'
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften gegeven over de gegevens die worden verstrekt bij de
      aanvraag, bedoeld in het eerste en tweede lid, en over de wijze van verstrekking van deze gegevens, waaronder
      voorschriften over de verstrekking van het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-
      fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel45
  - number: '45.5'
    text: |-
      In de gevallen waarin het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer, dient te
      worden verstrekt, is degene ten behoeve van wie een aanvraag als bedoeld in het tweede lid wordt gedaan gehouden
      dat nummer te verstrekken aan degenen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel45
  - number: '46.1'
    text: |-
      Uiterlijk tien weken na de aanvraag, bedoeld in [artikel 45, eerste of tweede lid][ref1], geeft het college van
      burgemeester en wethouders, bedoeld in [artikel 45, eerste of tweede lid][ref2], een beschikking af aan de houder
      van een kindercentrum of gastouderbureau.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel45
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '46.2'
    text: |-
      Indien na een aanvraag als bedoeld in [artikel 45, eerste of tweede lid][ref1], uit het onderzoek, bedoeld in
      [artikel 62][ref2], is gebleken dat de exploitatie van het kindercentrum, het gastouderbureau onderscheidenlijk
      de voorziening voor gastouderopvang redelijkerwijs zal plaatsvinden in overeenstemming met het bepaalde bij of
      krachtens de [paragrafen 2][ref3] en [3 van dit hoofdstuk][ref4], draagt het college van burgemeester en wethouders
      van de gemeente van vestiging zorg voor de onverwijlde inschrijving van het kindercentrum, het gastouderbureau of
      de voorziening voor gastouderopvang in het register kinderopvang.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '46.3'
    text: |-
      Het college van burgemeester en wethouders deelt de houder van het kindercentrum of gastouderbureau schriftelijk
      mee dat inschrijving van het kindercentrum, het gastouderbureau onderscheidenlijk de voorziening voor
      gastouderopvang in het register kinderopvang heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel46
  - number: '46.4'
    text: |-
      De houder van het gastouderbureau deelt de gastouder schriftelijk mee dat inschrijving van de voorziening voor
      gastouderopvang in het register kinderopvang heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel46
  - number: '46.5'
    text: |-
      Bij een inschrijving als bedoeld in het tweede lid, doet het college van burgemeester en wethouders opgave van de
      gegevens die ingevolge [artikel 45, vierde lid][ref1], zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel45
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '46.6'
    text: Het register kinderopvang is bij de gemeentesecretarie kosteloos te raadplegen.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel46
  - number: '47.1'
    text: |-
      De houder van een kindercentrum of gastouderbureau doet van wijzigingen in de gegevens die bij de aanvraag,
      bedoeld in [artikel 45, eerste of tweede lid][ref1], zijn verstrekt, onverwijld mededeling aan het college van
      burgemeester en wethouders. Het college draagt er zorg voor dat deze wijzigingen worden doorgevoerd in het register
      kinderopvang.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel45
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '47.2'
    text: |-
      Het college van burgemeester en wethouders deelt de houder van het kindercentrum of gastouderbureau schriftelijk
      mee dat de wijziging in het register kinderopvang heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel47
  - number: '47.3'
    text: |-
      De houder van het gastouderbureau deelt de gastouder schriftelijk mee dat de wijziging in het register kinderopvang
      heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel47
  - number: 47a.1
    text: |-
      Onze Minister draagt zorg voor de inrichting van een register kinderopvang ten behoeve van de waarborging van de
      kwaliteit en de rechtszekerheid van de kinderopvang en gastouderopvang alsmede ten behoeve van het toezicht op en
      de handhaving van de bij of krachtens [hoofdstuk 3][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
  - number: 47a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent het register kinderopvang.
      Deze regels hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel47a
  - number: 47a.2.a
    text: de vorm van het register;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel47a
  - number: 47a.2.b
    text: de in het register op te nemen gegevens;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel47a
  - number: 47a.2.c
    text: de vastlegging van gegevens in het register en de verwijdering van gegevens daaruit;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel47a
  - number: 47a.2.d
    text: de wijze waarop verbetering van onjuistheden in het register plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel47a
  - number: 47a.2.e
    text: de verstrekking van gegevens;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel47a
  - number: 47a.2.f
    text: de openbaarheid van gegevens;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel47a
  - number: 47a.2.g
    text: de verantwoordelijkheden van degenen die gegevens aanleveren ten behoeve van het register.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel47a
  - number: '48.1'
    text: |-
      Onze Minister kan een buiten Nederland gevestigd kindercentrum, een buiten Nederland gevestigde voorziening
      voor gastouderopvang of een buiten Nederland gevestigd gastouderbureau gelijkstellen met een geregistreerd
      kindercentrum, een geregistreerde voorziening voor gastouderopvang of een geregistreerd gastouderbureau, door
      opneming ervan in een door hem bij te houden register buitenlandse kinderopvang.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48
  - number: '48.2'
    text: |-
      Indien een ouder voornemens is gebruik te maken van een kindercentrum of een voorziening voor gastouderopvang door
      tussenkomst van een gastouderbureau buiten Nederland, doet hij bij Onze Minister een aanvraag om opneming van dat
      centrum, die voorziening voor gastouderopvang of dat bureau in het register buitenlandse kinderopvang. Opname in
      dat register vindt slechts plaats, indien aannemelijk is gemaakt dat de kwaliteit ervan naar aard en strekking
      overeenkomt met de op grond van deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48
  - number: '48.3'
    text: |-
      Onze Minister deelt de houder en de aanvrager schriftelijk mee dat opneming van het kindercentrum, de voorziening
      voor gastouderopvang onderscheidenlijk het gastouderbureau in het register buitenlandse kinderopvang heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48
  - number: '48.4'
    text: |-
      Onze Minister maakt de opneming in en verwijdering uit het register buitenlandse kinderopvang bekend in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48
  - number: '48.5'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent het register buitenlandse kinderopvang en de
      wijze waarop verbetering van onjuistheden in dat register plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48
  - number: '48.6'
    text: |-
      De houder doet van wijzigingen in de gegevens die ten behoeve van de opneming in het register buitenlandse
      kinderopvang zijn verstrekt, onverwijld mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48
  - number: '48.7'
    text: |-
      Onze Minister deelt de houder schriftelijk mee dat de wijzigingen in het register buitenlandse kinderopvang zijn
      aangetekend.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48
  - number: '48.8'
    text: |-
      De [artikelen 45 tot en met 47][ref1] en [49 tot en met 60][ref2] en de [hoofdstukken 4][ref3] en [5][ref4] zijn
      niet van toepassing op een kindercentrum of een gastouderbureau als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0017017
        hoofdstuk: '5'
  - number: '48.9'
    text: 'Bij regeling van Onze Minister kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48
  - number: 48.9.a
    text: |-
      de wijze waarop aannemelijk wordt gemaakt dat een kindercentrum, voorziening voor gastouderopvang of
      gastouderbureau als bedoeld in het eerste lid voldoet aan het tweede lid;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48
  - number: 48.9.b
    text: het toezicht op de naleving van het achtste lid;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48
  - number: 48.9.c
    text: |-
      het verstrekken van gegevens en inlichtingen door de ouder en de houder alsmede de wijze waarop deze gegevens en
      inlichtingen worden verstrekt ten behoeve van dat toezicht.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48
  - number: '48.10'
    text: |-
      Indien blijkt dat de kwaliteit van het kindercentrum, de voorziening voor gastouderopvang of het gastouderbureau
      niet langer naar aard en strekking overeenkomt met de op grond van deze wet gestelde regels of dat de houder niet
      voldoet aan enige verplichting die op grond van deze wet op hem rust wordt het kindercentrum, de voorziening voor
      gastouderopvang of het gastouderbureau uit het register verwijderd.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48
  - number: 48a.1
    text: |-
      Bij regeling van Onze Minister kunnen categorieën van buiten Nederland gevestigde kindercentra, voorzieningen voor
      gastouderopvang of gastouderbureaus worden aangewezen die worden gelijkgesteld met geregistreerde kindercentra,
      geregistreerde voorzieningen voor gastouderopvang of geregistreerde gastouderbureaus, indien deze kindercentra,
      voorzieningen voor gastouderopvang of gastouderbureaus voldoen aan de in het land van vestiging geldende regels met
      betrekking tot de kwaliteit en deze regels naar aard en naar strekking overeenkomen met de bij of krachtens deze
      wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48a
  - number: 48a.2
    text: |-
      [Artikel 48][ref1] is niet van toepassing op kindercentra, voorzieningen voor gastouderopvang en gastouderbureaus
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel48
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '49.1'
    text: |-
      Een houder van een kindercentrum biedt verantwoorde kinderopvang aan waaronder wordt verstaan opvang die bijdraagt
      aan een goede en gezonde ontwikkeling van het kind in een veilige en gezonde omgeving.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel49
  - number: '49.2'
    text: |-
      Een gastouder biedt verantwoorde gastouderopvang aan waaronder wordt verstaan opvang die bijdraagt aan een goede en
      gezonde ontwikkeling van het kind in een veilige en gezonde omgeving.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel49
  - number: '49.3'
    text: |-
      Een houder van een gastouderbureau draagt zorg voor een verantwoorde uitvoering van de werkzaamheden van het
      bureau, waaronder wordt verstaan:
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel49
  - number: 49.3.a
    text: |-
      het tot stand brengen en begeleiden van gastouderopvang die bijdraagt aan een goede en gezonde ontwikkeling van het
      kind in een veilige en gezonde omgeving;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel49
  - number: 49.3.b
    text: het doorgeleiden van de betalingen van ouders aan gastouders.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel49
  - number: '50.1'
    text: |-
      De houder van een kindercentrum organiseert de kinderopvang op zodanige wijze, voorziet het kindercentrum
      zowel kwalitatief, als kwantitatief zodanig van personeel en materieel, draagt zorg voor een zodanige
      verantwoordelijkheidstoedeling, en voert een zodanig pedagogisch beleid dat een en ander leidt of redelijkerwijs
      moet leiden tot verantwoorde kinderopvang. Ter uitvoering van de eerste volzin besteedt de houder in ieder geval
      aantoonbaar aandacht aan het aantal beroepskrachten in relatie tot het aantal kinderen per leeftijdscategorie,
      de groepsgrootte, de opleidingseisen van de beroepskrachten en de voorwaarden waaronder en de mate waarin
      beroepskrachten in opleiding kunnen worden belast met de verzorging en opvang van kinderen.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel50
  - number: '50.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de kwaliteit van de
      kinderopvang bij een kindercentrum. Deze regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel50
  - number: 50.2.a
    text: de veiligheid en de gezondheid;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel50
  - number: 50.2.b
    text: de opleidingseisen waaraan de beroepskrachten voldoen;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel50
  - number: 50.2.c
    text: de inzet van beroepskrachten in opleiding;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel50
  - number: 50.2.d
    text: het aantal beroepskrachten in relatie tot het aantal kinderen per leeftijdscategorie;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel50
  - number: 50.2.e
    text: de groepsgrootte;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel50
  - number: 50.2.f
    text: de accommodatie en de inrichting van de ruimte die bestemd is voor kinderopvang;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel50
  - number: 50.2.g
    text: de beschikbare ruimte voor kinderen;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel50
  - number: 50.2.h
    text: het pedagogisch beleid en de pedagogische praktijk.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel50
  - number: '50.3'
    text: |-
      De houder van een kindercentrum en de personen werkzaam bij een kindercentrum zijn in het bezit van een verklaring
      omtrent het gedrag, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '50.4'
    text: |-
      De verklaring, bedoeld in het derde lid, wordt aan de houder overgelegd, voordat een persoon als bedoeld in het
      derde lid zijn werkzaamheden aanvangt. De verklaring is op het moment dat zij wordt overgelegd, niet ouder dan
      twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel50
  - number: '50.5'
    text: |-
      Indien de houder of de toezichthouder redelijkerwijs mag vermoeden dat een persoon als bedoeld in het derde lid
      niet langer voldoet aan de eisen voor het afgeven van een verklaring omtrent het gedrag, verlangt de houder dat die
      persoon opnieuw een verklaring omtrent het gedrag overlegt die niet ouder is dan twee maanden. De desbetreffende
      persoon legt de verklaring over binnen een door de houder vast te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel50
  - number: '51'
    text: |-
      De houder voert een beleid dat ertoe leidt dat de veiligheid en de gezondheid van de op te vangen kinderen in elk
      door hem geëxploiteerd kindercentrum zoveel mogelijk is gewaarborgd. De houder legt, voor zover hierin niet wordt
      voorzien bij of krachtens andere wet- en regelgeving, in een risico-inventarisatie schriftelijk vast welke risico's
      de opvang van kinderen met zich brengt.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel51
  - number: '52.1'
    text: Kinderopvang geschiedt op basis van een schriftelijke overeenkomst tussen de houder en de ouder.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel52
  - number: '52.2'
    text: |-
      De overeenkomst bevat geen beding dat de ouder verplicht tot afname en betaling van een hoger aantal uren dan een
      bij regeling van Onze Minister vastgesteld aantal uren per dag.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel52
  - number: '52.3'
    text: Het aantal uren, bedoeld in het tweede lid, kan per soort kinderopvang verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel52
  - number: '53'
    text: |-
      Bij regeling van Onze Minister kunnen ten behoeve van een goede uitvoering van deze wet regels worden gesteld met
      betrekking tot de administratie van gegevens bij kindercentra.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel53
  - number: '54'
    text: |-
      De houder informeert de ouders wier kinderen in het kindercentrum worden opgevangen over het te voeren beleid als
      bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel54
  - number: '55.1'
    text: |-
      Bij kinderopvang in een kindercentrum of in een voorziening voor gastouderopvang wordt de Nederlandse taal als
      voertaal gebruikt. Daar waar naast de Nederlandse taal, de Friese taal of een streektaal in levend gebruik is, kan
      de Friese taal of de streektaal mede als voertaal worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel55
  - number: '55.2'
    text: |-
      In afwijking van het eerste lid kan mede een andere taal als voertaal worden gebezigd, indien de herkomst van
      de kinderen in specifieke omstandigheden daartoe noodzaakt, overeenkomstig een door de houder vastgestelde
      gedragscode.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel55
  - number: '56.1'
    text: |-
      De houder van een gastouderbureau organiseert zijn werkzaamheden op zodanige wijze, voorziet het bureau
      zowel kwalitatief als kwantitatief zodanig van personeel en materieel, draagt zorg voor een zodanige
      verantwoordelijkheidstoedeling en voert een zodanig beleid, dat een en ander leidt of redelijkerwijs moet leiden
      tot verantwoorde uitvoering van die werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56
  - number: '56.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de kwaliteit van gastouderbureaus,
      waaronder regels omtrent de opleidingseisen waaraan de beroepskrachten voldoen.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56
  - number: '56.3'
    text: |-
      Op de houder van een gastouderbureau en personen, werkzaam bij een gastouderbureau, is
      [artikel 50, derde, vierde en vijfde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel50
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '56.4'
    text: |-
      Gastouderopvang geschiedt op basis van een schriftelijke overeenkomst tussen de houder van het gastouderbureau
      en de ouder. Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de inhoud van de
      overeenkomst.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56
  - number: '56.5'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat de uitvoeringskosten een bij die regeling vast te stellen
      maximum per nader te bepalen soort kosten niet te boven gaan.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56
  - number: '56.6'
    text: |-
      Bij regeling van Onze Minister kunnen ten behoeve van een goede uitvoering van deze wet regels worden gesteld
      omtrent:
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56
  - number: 56.6.a
    text: de administratie van gegevens bij gastouderbureaus;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56
  - number: 56.6.b
    text: het betalingsverkeer tussen gastouders, het gastouderbureau en vraagouders.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56
  - number: '56.7'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de verhouding tussen het aantal beroepskrachten
      en het aantal gastouders.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56
  - number: 56a
    text: |-
      De houder van een gastouderbureau maakt ten behoeve van een goede uitvoering van de bij of krachtens dit hoofdstuk
      gestelde regels gebruik van het burgerservicenummer of, bij het ontbreken daarvan, van het sociaal-fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56a
  - number: 56b.1
    text: |-
      De gastouder beschikt over een zodanige deskundigheid, organiseert de gastouderopvang op zodanige wijze, voorziet
      de voorziening voor gastouderopvang zodanig van materieel en voert een zodanig pedagogisch beleid, dat een en ander
      leidt of redelijkerwijs moet leiden tot verantwoorde gastouderopvang.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56b
  - number: 56b.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de kwaliteit van de
      gastouderopvang. Deze regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56b
  - number: 56b.2.a
    text: de veiligheid en de gezondheid;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56b
  - number: 56b.2.b
    text: de deskundigheidseisen waaraan de houder voldoet;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56b
  - number: 56b.2.c
    text: de groepsgrootte;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56b
  - number: 56b.2.d
    text: de accommodatie en de inrichting van de ruimte die bestemd is voor gastouderopvang;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56b
  - number: 56b.2.e
    text: de beschikbare ruimte voor kinderen;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56b
  - number: 56b.2.f
    text: het pedagogisch beleid en de pedagogische praktijk.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56b
  - number: 56b.3
    text: |-
      De gastouder en andere personen van 18 jaar of ouder die op hetzelfde woonadres als de houder hun
      hoofdverblijf hebben, zijn in het bezit van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 56b.4
    text: |-
      De verklaringen, bedoeld in het derde lid, worden door de gastouder aan de houder van het gastouderbureau
      overgelegd, voordat de gastouder zijn werkzaamheden aanvangt. De verklaringen zijn op het moment dat zij worden
      overgelegd, niet ouder dan twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56b
  - number: 56b.5
    text: |-
      Indien de toezichthouder redelijkerwijs mag vermoeden dat een persoon als bedoeld in het derde lid niet langer
      voldoet aan de eisen voor het afgeven van een verklaring omtrent het gedrag, verlangt de toezichthouder dat die
      persoon opnieuw een verklaring omtrent het gedrag overlegt die niet ouder is dan twee maanden. De desbetreffende
      persoon legt de verklaring over binnen een door de toezichthouder vast te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56b
  - number: 56b.6
    text: |-
      De [artikelen 51][ref1], [53][ref2], [54][ref3] en [55][ref4] zijn van overeenkomstige toepassing op de gastouder.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel55
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '51'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
