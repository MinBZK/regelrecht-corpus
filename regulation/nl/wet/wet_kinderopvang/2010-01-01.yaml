  - number: 22.1.c
    text: |-
      voor zover de ouder in dat jaar een persoon is als bedoeld onder a of b, en zijn partner in dat jaar een
      persoon die in Nederland, een andere lidstaat of Zwitserland woont en een uitkering ontvangt als bedoeld in
      [artikel 6, eerste lid, onder c, d, of e][ref1], en gebruik maakt van een in één van die onderdelen bedoelde
      voorziening gericht op arbeidsinschakeling, voor wie het college van burgemeester en wethouders op grond van
      de wetten, genoemd onder a, verantwoordelijk is voor het ondersteunen bij arbeidsinschakeling, of een daarmee
      vergelijkbare uitkering respectievelijk voorziening, vastgesteld krachtens de wetgeving van een andere lidstaat of
      Zwitserland, of voor zover de partner in dat jaar een persoon is als bedoeld onder b;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 22.1.d
    text: |-
      voor zover de ouder in dat jaar een persoon als bedoeld onder a of b, en zijn partner in dat jaar een
      persoon die in Nederland, een andere lidstaat of Zwitserland woont en een uitkering ontvangt als bedoeld
      in [artikel 6, eerste lid, onder h of i][ref1], en gebruik maakt van een in één van die onderdelen bedoelde
      voorziening gericht op arbeidsinschakeling, voor wie het Uitvoeringsinstituut werknemersverzekeringen
      verantwoordelijk is voor het ondersteunen bij arbeidsinschakeling of een daarmee vergelijkbare uitkering
      respectievelijk voorziening, vastgesteld krachtens de wetgeving van een andere lidstaat of Zwitserland;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 22.1.e
    text: |-
      voor zover de ouder in dat jaar een persoon is als bedoeld in [artikel 29, eerste lid, onder a][ref1], en zijn
      partner in dat jaar een persoon als bedoeld onder c;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel29
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 22.1.f
    text: |-
      voor zover de ouder in dat jaar een persoon als bedoeld onder a of b, en zijn partner in dat jaar een persoon die
      in Nederland, een andere lidstaat of Zwitserland woont en in Nederland, een andere lidstaat of Zwitserland arbeid
      verricht;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel22
  - number: 22.1.g
    text: |-
      voor zover de ouder in dat jaar een persoon is als bedoeld in [artikel 6, eerste lid, onder a][ref1], en zijn
      partner in dat jaar een persoon als bedoeld onder c.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '22.2'
    text: |-
      Aanspraak op een tegemoetkoming van de gemeente heeft eveneens een ouder, voor zover de ouder in een
      berekeningsjaar een persoon is als bedoeld in [artikel 6, eerste lid, onder a][ref1], en algemene
      bijstand ontvangt op grond van de [Wet werk en bijstand][ref2], of een inkomensvoorziening op grond van de
      [Wet investeren in jongeren][ref3] en, indien hij een partner heeft, voor zover zijn partner een persoon is die
      in Nederland, een andere lidstaat of Zwitserland woont en in Nederland, een andere lidstaat of Zwitserland arbeid
      verricht en algemene bijstand ontvangt op grond van de Wet werk en bijstand of een daarmee vergelijkbare uitkering,
      vastgesteld krachtens de wetgeving van een andere lidstaat of Zwitserland.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0026054
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015703
      - id: ref3
        bwb_id: BWBR0026054
  - number: '22.3'
    text: |-
      De aanspraak bestaat jegens de gemeente waar de ouder zijn woonplaats heeft als bedoeld in de
      [artikelen 10, eerste lid][ref1], en [11 van Boek 1 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel11
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '11'
  - number: '22.4'
    text: |-
      Een persoon als bedoeld in het eerste lid, onder a of b, heeft slechts aanspraak op een tegemoetkoming, indien hij
      geen partner heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel22
  - number: '24.1'
    text: 'De tegemoetkoming van de gemeente bedraagt:'
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel24
  - number: 24.1.a
    text: |-
      voor een ouder als bedoeld in [artikel 22 eerste lid, onder c][ref1], voorzover de ouder een persoon is als
      bedoeld in [artikel 6, eerste lid, onder c, e of f][ref2], een derde deel van de kosten van kinderopvang,
      verhoogd met een bij regeling van Onze Minister zodanig vast te stellen bedrag, dat het totaal aan
      kinderopvangtoeslag en tegemoetkoming van de gemeente niet meer bedraagt dan de kosten van kinderopvang, bedoeld in
      [artikel 7, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 24.1.b
    text: |-
      voor een ouder als bedoeld in [artikel 22, eerste lid, onder c][ref1], voor zover de ouder een persoon is als
      bedoeld in [artikel 6, eerste lid, onder d, g, j, k of l][ref2], een derde deel van de kosten van kinderopvang,
      bedoeld in [artikel 7, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '24.2'
    text: 'De tegemoetkoming van de gemeente bedraagt:'
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel24
  - number: 24.2.a
    text: |-
      voor een ouder als bedoeld in [artikel 22, eerste lid, onder a, b, d, e, f of g][ref1], voorzover de ouder
      een persoon is als bedoeld in [artikel 6, eerste lid, onder c, e of f][ref2], een zesde deel van de kosten van
      kinderopvang, verhoogd met een bij regeling van Onze Minister zodanig vast te stellen bedrag, dat het totaal aan
      kinderopvangtoeslag en tegemoetkoming van de gemeente niet meer bedraagt dan kosten van kinderopvang, bedoeld in
      [artikel 7, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
