        hoofdstuk: '2'
        paragraaf: '2'
  - number: '24.3'
    text: |-
      De tegemoetkoming van de gemeente bedraagt voor een ouder of zijn partner als bedoeld in
      [artikel 22, tweede lid][ref1], een bij regeling van Onze Minister zodanig vast te stellen bedrag, dat het totaal
      aan kinderopvangtoeslag en tegemoetkoming van de gemeente niet meer bedraagt dan de kosten van kinderopvang,
      bedoeld in [artikel 7, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '24.4'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld ter voorkoming van samenloop van tegemoetkomingen
      ingevolge dit artikel, voorzover de ouder en zijn partner personen zijn als bedoeld in het eerste lid, onder a,
      onderscheidenlijk met tegemoetkomingen ingevolge [artikel 30][ref1], voorzover het gevallen betreft, waarin, ofwel
      de ouder ofwel zijn partner een persoon is als bedoeld in het tweede lid, onder a, en de ander een persoon is als
      bedoeld in [artikel 30, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel30
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '30'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '30'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '25'
    text: |-
      De gemeenteraad stelt bij verordening regels vast omtrent de tegemoetkoming van de gemeente. Deze regels hebben
      betrekking op de verlening, de voorschotverlening en de vaststelling van de tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel25
  - number: '26.1'
    text: De tegemoetkoming wordt door de ouder aangevraagd bij het college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel26
  - number: '26.2'
    text: |-
      De ouder doet bij de aanvraag zo mogelijk opgave van zijn burgerservicenummer, of bij het ontbreken daarvan, zijn
      sociaal-fiscaalnummer en dat van zijn partner en van het kind waarop de tegemoetkoming betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel26
  - number: '26.3'
    text: Indien de ouder een partner heeft, wordt de aanvraag mede ondertekend door die partner.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel26
  - number: '27'
    text: |-
      Het college van burgemeester en wethouders maakt bij de uitvoering van deze wet gebruik van het burgerservicenummer
      of, bij het ontbreken daarvan, het sociaal-fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel27
  - number: '28.1'
    text: |-
      De ouder verstrekt desgevraagd aan het college van burgemeester en wethouders alle gegevens en inlichtingen van hem
      en zijn partner die voor de aanspraak op en de hoogte van de tegemoetkoming van de gemeente van belang zijn.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel28
  - number: '28.2'
    text: |-
      De inlichtingen en gegevens, bedoeld in het eerste lid, worden verstrekt binnen een door het college van
      burgemeester en wethouders te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel28
  - number: '28.3'
    text: |-
      Inlichtingen en gegevens die kunnen leiden tot de vaststelling van een lagere tegemoetkoming worden, onmiddellijk
      na het bekend worden daarvan, door de ouder schriftelijk verstrekt aan het college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel28
  - number: '28.4'
    text: |-
      De houder verstrekt desgevraagd aan het college van burgemeester en wethouders alle gegevens en inlichtingen die
      voor de aanspraak van een ouder op de tegemoetkoming van de gemeente van belang zijn.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel28
  - number: '29.1'
    text: |-
      Een ouder heeft in een berekeningsjaar aanspraak op een tegemoetkoming van het Uitvoeringsinstituut
      werknemersverzekeringen:
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel29
  - number: 29.1.a
    text: |-
      voor zover de ouder in dat jaar een persoon is die een uitkering ontvangt en gebruik maakt van een voorziening
      gericht op arbeidsinschakeling als bedoeld in [artikel 6, eerste lid, onder h of i][ref1], tenzij het
      college van burgemeester en wethouders op grond van [artikel 72, tweede lid, van de Werkloosheidswet][ref2],
      [artikel 30a, derde lid, onder a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] of op grond
      van [artikel 7, derde lid, tweede zin, van de Wet werk en bijstand][ref4] verantwoordelijk is voor het ondersteunen
      van die ouder bij arbeidsinschakeling;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '72'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '7'
  - number: 29.1.b
    text: |-
      voor zover de ouder in dat jaar een persoon is als bedoeld onder a, en zijn partner in dat jaar een
      persoon die in Nederland, een andere lidstaat of Zwitserland woont en een uitkering ontvangt als bedoeld
      in [artikel 6, eerste lid, onder h of i][ref1], en gebruik maakt van een in één van die onderdelen bedoelde
      voorziening gericht op arbeidsinschakeling, tenzij het college van burgemeester en wethouders op grond van de
      wetten, genoemd onder a, verantwoordelijk is voor het ondersteunen van die partner bij arbeidsinschakeling of een
      daarmee vergelijkbare uitkering respectievelijk voorziening, vastgesteld krachtens de wetgeving van een andere
      lidstaat of Zwitserland;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 29.1.c
    text: |-
      voor zover de ouder in dat jaar een persoon is als bedoeld onder a, en zijn partner in dat jaar een persoon als
      bedoeld in [artikel 22, eerste lid, onder c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel22
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 29.1.d
    text: |-
      voor zover de ouder in dat jaar een persoon is als bedoeld in [artikel 22, eerste lid, onder a of b][ref1], en zijn
      partner in dat jaar een persoon als bedoeld onder b;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel22
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 29.1.e
    text: |-
      voor zover de ouder in dat jaar een persoon is als bedoeld onder a, en zijn partner in dat jaar een persoon die
      in Nederland, een andere lidstaat of Zwitserland woont en in Nederland, een andere lidstaat of Zwitserland arbeid
      verricht;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel29
  - number: 29.1.f
    text: |-
      voor zover de ouder in dat jaar een persoon is als bedoeld in [artikel 6, eerste lid, onder a][ref1], en zijn
      partner een persoon als bedoeld onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '29.2'
    text: |-
      Een persoon als bedoeld in het eerste lid onder a heeft slechts aanspraak op een tegemoetkoming indien hij geen
      partner heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel29
  - number: '30.1'
    text: |-
      De tegemoetkoming van het Uitvoeringsinstituut werknemersverzekeringen bedraagt voor een ouder als
      bedoeld in [artikel 29, eerste lid, onder b][ref1], voorzover de ouder een persoon is als bedoeld in
      [artikel 6, eerste lid, onder h of i][ref2], een derde deel van de kosten van kinderopvang, verhoogd met een bij
      regeling van Onze Minister zodanig vast te stellen bedrag, dat het totaal aan kinderopvangtoeslag en tegemoetkoming
      van het Uitvoeringsinstituut werknemersverzekeringen niet meer bedraagt dan de kosten van kinderopvang, bedoeld in
      [artikel 7, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '30.2'
    text: |-
      De tegemoetkoming van het Uitvoeringsinstituut werknemersverzekeringen bedraagt voor de overige
      ouders, bedoeld in [artikel 29, eerste lid][ref1], voorzover de ouder een persoon is als bedoeld in
      [artikel 6, eerste lid, onder h of i][ref2], een zesde deel van de kosten van kinderopvang, verhoogd met een bij
      regeling van Onze Minister zodanig vast te stellen bedrag, dat het totaal aan kinderopvangtoeslag en tegemoetkoming
      van het Uitvoeringsinstituut werknemersverzekeringen niet meer bedraagt dan de kosten van kinderopvang, bedoeld in
      [artikel 7, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
