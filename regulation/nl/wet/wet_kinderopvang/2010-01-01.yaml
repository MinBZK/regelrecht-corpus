  - number: '35.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan besluiten dat een ouder, die een
      persoon is als bedoeld in [artikel 6, eerste lid, onder h of i][ref1], tenzij het college van
      burgemeester en wethouders op grond van [artikel 72, tweede lid, van de Werkloosheidswet][ref2],
      [artikel 30a, derde lid, onder a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] of op
      grond van [artikel 7, derde lid, tweede volzin, van de Wet werk en bijstand][ref4] verantwoordelijk is voor
      het ondersteunen bij arbeidsinschakeling, na beëindiging van de aanspraak op grond van [artikel 29][ref5], in
      aansluiting daarop aanspraak heeft op een tegemoetkoming jegens het Uitvoeringsinstituut werknemersverzekeringen.
      [Artikel 30][ref6] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel29
      [ref6]: https://wetten.overheid.nl/BWBR0017017#Artikel30
