      - id: ref3
        bwb_id: BWBR0017017
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '30.3'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld ter voorkoming van samenloop van tegemoetkomingen
      ingevolge dit artikel, voorzover de ouder en zijn partner personen zijn als bedoeld in het eerste lid,
      onderscheidenlijk met tegemoetkomingen ingevolge [artikel 24][ref1], voorzover het gevallen betreft, waarin, ofwel
      de ouder ofwel zijn partner een persoon is als bedoeld in het tweede lid en de ander een persoon is als bedoeld in
      [artikel 24, tweede lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel24
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '31.1'
    text: De tegemoetkoming wordt door de ouder aangevraagd bij het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel31
  - number: '31.2'
    text: |-
      De ouder doet bij de aanvraag zo mogelijk opgave van zijn zijn burgerservicenummer of, bij het ontbreken daarvan,
      zijn sociaal-fiscaalnummer en dat van zijn partner en van het kind waarop de tegemoetkoming betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel31
  - number: '31.3'
    text: Indien de ouder een partner heeft, wordt de aanvraag mede ondertekend door die partner.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel31
  - number: '32'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen maakt bij de uitvoering van deze wet gebruik van het
      burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel32
  - number: '33.1'
    text: |-
      De ouder verstrekt desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen alle gegevens en inlichtingen
      van hem en zijn partner die voor de aanspraak op en de hoogte van de tegemoetkoming van het Uitvoeringsinstituut
      van belang zijn.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel33
  - number: '33.2'
    text: |-
      De inlichtingen en gegevens, bedoeld in het eerste lid, worden verstrekt binnen een door het Uitvoeringsinstituut
      werknemersverzekeringen te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel33
  - number: '33.3'
    text: |-
      Inlichtingen en gegevens die kunnen leiden tot de vaststelling van een lagere tegemoetkoming worden,
      onmiddellijk na het bekend worden daarvan, door de ouder schriftelijk verstrekt aan het Uitvoeringsinstituut
      werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel33
  - number: '33.4'
    text: |-
      De houder verstrekt desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen alle gegevens en inlichtingen
      die voor de aanspraak van een ouder op de tegemoetkoming van het Uitvoeringsinstituut werknemersverzekeringen van
      belang zijn.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel33
  - number: '34'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de verlening, de voorschotverlening
      en de vaststelling van de tegemoetkoming van het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel34
  - number: '35.1'
    text: |-
      Het college van burgemeester en wethouders kan besluiten dat een ouder, die een persoon is als bedoeld in
      [artikel 6, eerste lid, onder c tot en met f][ref1], voor wie het college van burgemeester en wethouders op grond
      van [artikel 7, eerste lid, aanhef en onder a, of derde lid, tweede volzin, van de Wet werk en bijstand][ref2],
      [artikel 11, eerste lid, van de Wet investeren in jongeren][ref3],
      __REF003___________________________________________________________________________________________________________
      __________________,
      __REF004___________________________________________________________________________________________________________
      ____________________,
      [artikel 30a, derde lid, onder a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6] of
      [artikel 72, tweede lid, van de Werkloosheidswet][ref7], verantwoordelijk is voor het ondersteunen bij
      arbeidsinschakeling of die gebruik maakt van een voorziening, gericht op arbeidsinschakeling in het kader van een
      gemengde beroepspraktijk als bedoeld in [artikel 21, eerste lid, van de Wet werk en inkomen kunstenaars][ref8],
      na beëindiging van de aanspraak op grond van [artikel 22][ref9], in aansluiting daarop aanspraak heeft op een
      tegemoetkoming jegens de gemeente. [Artikel 24][ref10] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0026054#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0004163#Artikel34
