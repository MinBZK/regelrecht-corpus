  - number: '91.2'
    text: |-
      Indien de inschrijving, bedoeld in het eerste lid, plaatsvindt uiterlijk op 31 december van het eerste kalenderjaar
      waarop [artikel I, onderdelen B en G][ref1], van de in het eerste lid genoemde wijzigingswet betrekking heeft,
      werkt de inschrijving, onder voorwaarde dat de aanvraag, bedoeld in [artikel 45, tweede lid][ref2], voor
      1 september van genoemd kalenderjaar plaatsvindt, terug tot en met 1 januari van dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0026299#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel45
