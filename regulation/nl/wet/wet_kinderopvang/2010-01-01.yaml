  - number: '5.1'
    text: |-
      Een ouder heeft aanspraak op een kinderopvangtoeslag in de door hem of zijn partner te betalen kosten jegens
      het Rijk onderscheidenlijk aanspraak op een tegemoetkoming in de door hem of zijn partner te betalen kosten van
      kinderopvang jegens de gemeente of jegens het Uitvoeringsinstituut werknemersverzekeringen, indien het betreft:
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel5
  - number: 5.1.a
    text: kinderopvang in een geregistreerd kindercentrum; of
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel5
  - number: 5.1.b
    text: |-
      gastouderopvang in een geregistreerde voorziening voor gastouderopvang die plaatsvindt door tussenkomst van een
      geregistreerd gastouderbureau.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel5
  - number: '5.2'
    text: |-
      Een ouder en diens partner die tevens ouder is worden voor de toepassing van deze wet geacht gezamenlijk één
      aanspraak te hebben.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel5
  - number: '5.3'
    text: |-
      Indien een gastouderbureau uit het register kinderopvang, bedoeld in [artikel 47a][ref1], wordt verwijderd, geldt
      de in het eerste lid, onderdeel b, bedoelde voorwaarde van registratie van het gastouderbureau niet, gedurende
      een bij algemene maatregel van bestuur te bepalen uitlooptermijn waarbinnen de voorziening voor gastouderopvang op
      grond van [artikel 47a, tweede lid, onderdeel c][ref2], in het register kinderopvang ingeschreven blijft.


