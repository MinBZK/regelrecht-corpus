        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 24.2.b
    text: |-
      voor een ouder als bedoeld in [artikel 22, eerste lid, onder a, b, d, e, f of g][ref1], voorzover de ouder een
      persoon is als bedoeld in [artikel 6, eerste lid, onder d, g, j, k of l][ref2], een zesde deel van de kosten van
      kinderopvang, bedoeld in [artikel 7, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017017
