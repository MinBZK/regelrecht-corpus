  - number: '97'
    text: |-
      Ten aanzien van voor het tijdstip van inwerkingtreding van de Wet kinderopvang door het Rijk en gemeenten op grond
      van de [Welzijnswet 1994][ref1] verleende subsidies en uitkeringen aan kinderopvang, voorzover dat kinderopvang
      betreft waarop deze wet van toepassing is, blijft het bepaalde bij of krachtens de [Welzijnswet 1994][ref2],
      zoals dat laatstelijk voor 1 januari 2005 luidde, van toepassing op de financiële verantwoording, vaststelling en
      uitbetaling van die subsidies en uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0006705
      [ref2]: https://wetten.overheid.nl/BWBR0006705
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0006705
      - id: ref2
        bwb_id: BWBR0006705
  - number: '113.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, het college van burgemeester en wethouders en de gemeenteraad
      verstrekken aan Onze Minister de inlichtingen die hij voor de statistiek, de informatievoorziening en de
      beleidsvorming met betrekking tot deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel113
  - number: '113.2'
    text: |-
      Onze Minister stelt regels omtrent de aard van de inlichtingen, bedoeld in het eerste lid, en de wijze waarop deze
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel113
  - number: '113.3'
    text: De inlichtingen, bedoeld in het eerste lid, worden kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel113
  - number: '114'
    text: |-
      De voordracht voor een krachtens de [artikelen 7, tweede, vierde, vijfde en zesde lid][ref1],
      [56, tweede lid][ref2], en [56b, tweede lid][ref3], vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel56b
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel114
