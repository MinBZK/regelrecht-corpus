  - number: '93.1'
    text: |-
      [Hoofdstuk 2][ref1] en [artikel 86][ref2] zijn gedurende ten hoogste zes maanden na het tijdstip van hun
      inwerkingtreding niet van toepassing op een ouder als bedoeld in [artikel 6, eerste lid, onder h en i][ref3],
      die gebruik maakt van kinderopvang die door het Uitvoeringsinstituut werknemersverzekeringen ten behoeve van
      die ouder is bekostigd op grond een vóór het tijdstip van inwerkingtreding van deze wet gesloten schriftelijke
      overeenkomst als bedoeld in [artikel 74, eerste lid, van de Werkloosheidswet][ref4] respectievelijk
      [artikel 22a, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref5].


