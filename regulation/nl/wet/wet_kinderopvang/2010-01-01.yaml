preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het wenselijk is om regels te stellen met betrekking tot
    tegemoetkomingen in de kosten van kinderopvang en om de kwaliteit van kinderopvang te waarborgen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *beroepskracht:* 1°. de persoon van 18 jaar
      of ouder die werkzaam is bij een kindercentrum en is belast met de verzorging en opvoeding van kinderen; 2°. de
      persoon van 18 jaar of ouder die werkzaam is bij een gastouderbureau en is belast met het tot stand brengen en
      begeleiden van gastouderopvang;
        - *beroepskracht in opleiding:* degene die de beroepsbegeleidende leerweg volgt, bedoeld in de
      [Wet educatie en beroepsonderwijs][ref1], en ten behoeve van beroepspraktijkvorming is belast met de verzorging en
      opvoeding van kinderen bij een kindercentrum of voorziening voor gastouderopvang;
        - *gastouder:* de natuurlijke persoon van 18 jaar of ouder die gastouderopvang biedt, met uitzondering van
      natuurlijke personen van wie een of meer kinderen op bij algemene maatregel van bestuur aan te wijzen gronden
      onderworpen zijn aan ondertoezichtstelling of voorlopige ondertoezichtstelling als bedoeld in [artikel 254][ref2],
      onderscheidenlijk [artikel 255, van Boek 1 van het Burgerlijk Wetboek][ref3], en met uitzondering van de persoon
      die op hetzelfde woonadres als de ouder of diens partner staat ingeschreven in de gemeentelijke basisadministratie
      persoonsgegevens;
        - *gastouderbureau:* een organisatie die gastouderopvang tot stand brengt en begeleidt en door tussenkomst van wie
      de betaling van ouders aan gastouders geschiedt;
        - *gastouderopvang:* kinderopvang: a. die plaatsvindt door tussenkomst van een geregistreerd gastouderbureau;
      b. die plaatsvindt in een gezinssituatie door een ander dan degene die als ouder op grond van
      [artikel 5, eerste lid][ref4], aanspraak kan maken op een kinderopvangtoeslag onderscheidenlijk een tegemoetkoming
      of diens partner; c. waarbij de houder in totaal niet meer dan één voorziening voor gastouderopvang exploiteert;
      d. waarbij de opvang plaatsvindt op het woonadres van de gastouder of op het woonadres van een van de ouders;
      en e. bestaande uit de gelijktijdige opvang van ten hoogste zes kinderen, waaronder begrepen de bloedverwant of
      aanverwant in de neergaande lijn van de gastouder of zijn partner, die in belangrijke mate wordt onderhouden door
      de gastouder of zijn partner en op hetzelfde woonadres als de gastouder staat ingeschreven in de gemeentelijke
      basisadministratie persoonsgegevens en de leeftijd van tien jaar nog niet heeft bereikt. Met een bloedverwant of
      aanverwant in de neergaande lijn wordt gelijkgesteld een pleegkind dat de leeftijd van tien jaar nog niet heeft
      bereikt;
        - *GGD:* een gemeentelijke gezondheidsdienst als bedoeld in [artikel 14 van de Wet publieke gezondheid][ref5];
        - *houder:* de rechtspersoon of natuurlijke persoon van 18 jaar of ouder die een kindercentrum, een voorziening
      voor gastouderopvang of een gastouderbureau exploiteert;
        - *kindercentrum:* een voorziening waar kinderopvang plaatsvindt, anders dan gastouderopvang;
        - *kinderopvang:* het bedrijfsmatig of anders dan om niet verzorgen en opvoeden van kinderen tot de eerste dag van
      de maand waarop het voortgezet onderwijs voor die kinderen begint;
        - *kinderopvangtoeslag:* een tegemoetkoming van het Rijk als bedoeld in
      [artikel 2, eerste lid, onder j, van de Algemene wet inkomensafhankelijke regelingen][ref6] in de kosten van
      kinderopvang;
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *ouder:* de bloed- of aanverwant in opgaande lijn of de pleegouder van een kind op wie de kinderopvang betrekking
      heeft, met dien verstande dat bij de beoordeling of sprake is van pleegouderschap een subsidie op grond van de
      [Wet op de jeugdzorg][ref7] buiten beschouwing blijft;
        - *oudercommissie:* de commissie, bedoeld in [artikel 58][ref8];
        - *overheidswerkgever:* de werkgever, bedoeld in
      [artikel 1, onderdeel r, van de Wet financiering sociale verzekeringen][ref9];
        - *overheidswerknemer:* de werknemer, bedoeld in
      [artikel 1, onderdeel p, van de Wet financiering sociale verzekeringen][ref10];
        - *register kinderopvang:* het register kinderopvang, bedoeld in [artikel 47a][ref11];
        - *Uitvoeringsinstituut werknemersverzekeringen:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref12];
        - *uitvoeringskosten:* de kosten die door een gastouderbureau in rekening worden gebracht bij de ouder of de
      gastouder, niet zijnde de kosten van gastouderopvang;
        - *werkgever:* de werkgever, bedoeld in
      [artikel 1, onderdeel q, van de Wet financiering sociale verzekeringen][ref13];
        - *werknemer:* de werknemer, bedoeld in
      [artikel 1, onderdeel o, van de Wet financiering sociale verzekeringen][ref14].


