        artikel: '54'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '55'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '57'
    text: |-
      Indien de kinderopvang in een kindercentrum geschiedt uitsluitend en onbezoldigd door ten minste een van de
      ouders van de in die voorziening opgevangen kinderen worden voor de toepassing van [artikel 50, eerste lid][ref1],
      ouders gelijkgesteld met personeel en beroepskrachten. Op ouders, bedoeld in de eerste zin, is
      [artikel 50, tweede tot en met vijfde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel50
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 57a.1
    text: |-
      Onze Minister kan beleidsregels stellen omtrent de toepassing van de [artikelen 49][ref1],
      [50, eerste, derde, vierde en vijfde lid][ref2], [51][ref3], [56, eerste en derde lid][ref4], en
      [56b, eerste, derde, vierde, vijfde en zesde lid][ref5], voor zover dat laatste lid betrekking heeft op
      [artikel 51][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel51
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel56
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel56b
      [ref6]: https://wetten.overheid.nl/BWBR0017017#Artikel51
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '51'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '56'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0017017
        artikel: 56b
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0017017
        artikel: '51'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 57a.2
    text: De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel57a
  - number: '58.1'
    text: |-
      Een houder van een kindercentrum of een gastouderbureau stelt voor elk door hem geëxploiteerd kindercentrum of
      gastouderbureau een oudercommissie in die tot taak heeft hem te adviseren over de aangelegenheden, genoemd in
      [artikel 60][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel60
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '60'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '58.2'
    text: |-
      De leden van de oudercommissie worden gekozen uit en door degenen wier kinderen in het kindercentrum of door
      tussenkomst van het gastouderbureau worden opgevangen.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel58
  - number: '58.3'
    text: |-
      Personen werkzaam bij een kindercentrum onderscheidenlijk gastouderbureau zijn geen lid van de oudercommissie van
      dat kindercentrum of gastouderbureau.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel58
  - number: '58.4'
    text: De oudercommissie bepaalt haar eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel58
  - number: '59.1'
    text: |-
      De houder van een kindercentrum of een gastouderbureau stelt binnen zes maanden na de aanvraag, bedoeld in
      [artikel 45, eerste lid][ref1], voor de oudercommissie een reglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel45
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '59.2'
    text: 'Het reglement bevat in ieder geval regels omtrent:'
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel59
  - number: 59.2.a
    text: het aantal leden van de oudercommissie;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel59
  - number: 59.2.b
    text: de wijze waarop de leden van de oudercommissie worden gekozen;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel59
  - number: 59.2.c
    text: de zittingsduur van de leden van de oudercommissie.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel59
  - number: '59.3'
    text: Het reglement bevat geen regels omtrent de werkwijze van de oudercommissie.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel59
  - number: '59.4'
    text: De oudercommissie beslist bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel59
  - number: '59.5'
    text: Wijziging van het reglement behoeft instemming van de oudercommissie.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel59
  - number: '60.1'
    text: |-
      De houder van een kindercentrum of een gastouderbureau stelt de oudercommissie in ieder geval in de gelegenheid
      advies uit te brengen over elk voorgenomen besluit met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel60
  - number: 60.1.a
    text: |-
      de wijze waarop uitvoering wordt gegeven aan [artikel 50][ref1] dan wel aan [artikel 56][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel56
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '56'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 60.1.b
    text: |-
      voedingsaangelegenheden van algemene aard en het algemene beleid op het gebied van opvoeding, veiligheid of
      gezondheid;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel60
  - number: 60.1.c
    text: openingstijden;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel60
  - number: 60.1.d
    text: het beleid met betrekking tot spel- en ontwikkelingsactiviteiten ten behoeve van de kinderen;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel60
  - number: 60.1.e
    text: |-
      de vaststelling of wijziging van een regeling inzake de behandeling van klachten en het aanwijzen van personen die
      belast worden met de behandeling van klachten;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel60
  - number: 60.1.f
    text: wijziging van de prijs van kinderopvang.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel60
  - number: '60.2'
    text: |-
      Van een advies als bedoeld in het eerste lid kan de houder slechts afwijken indien hij schriftelijk en gemotiveerd
      aangeeft dat het belang van de kinderopvang zich tegen het advies verzet.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel60
  - number: '60.3'
    text: De oudercommissie is bevoegd de houder ook ongevraagd te adviseren over de onderwerpen, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel60
  - number: '60.4'
    text: |-
      De houder verstrekt de oudercommissie tijdig en desgevraagd schriftelijk alle informatie die deze voor de
      vervulling van zijn taak redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel60
  - number: 60a
    text: |-
      De houder van een kindercentrum of een gastouderbureau treft een regeling voor de behandeling van klachten
      van de oudercommissie over een door hem genomen besluit als bedoeld in [artikel 60, eerste lid][ref1]. De
      getroffen regeling waarborgt dat aan de behandeling van een klacht van de oudercommissie niet wordt deelgenomen
      door de houder of door een persoon die werkzaam is voor of bij de houder op wie die klacht betrekking
      heeft. De houder brengt de getroffen regeling op passende wijze onder de aandacht van de oudercommissie. De
      [artikelen 2, tweede tot en met vijfde lid, zevende lid, en negende lid][ref2], [2a][ref3], [3c][ref4] en
      [4 van de Wet klachtrecht cliënten zorgsector][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0007414#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007414#Artikel2a
      [ref4]: https://wetten.overheid.nl/BWBR0007414#Artikel3c
      [ref5]: https://wetten.overheid.nl/BWBR0007414#Artikel4
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '60'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007414
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007414
        artikel: 2a
      - id: ref4
        bwb_id: BWBR0007414
        artikel: 3c
      - id: ref5
        bwb_id: BWBR0007414
        artikel: '4'
  - number: '61.1'
    text: |-
      Het college van burgemeester en wethouders ziet toe op de naleving van de bij of krachtens [hoofdstuk 3][ref1]
      gestelde regels, onderscheidenlijk de krachtens [artikel 65][ref2] gegeven aanwijzingen en bevelen en de krachtens
      [artikel 66, eerste lid][ref3], gegeven bevelen tot sluiting dan wel de krachtens [artikel 66, tweede lid][ref4],
      uitgevaardigde verboden. Het college van burgemeester en wethouders wijst de directeur van de GGD aan als
      toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel66
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel66
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '65'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '61.2'
    text: |-
      Voor zover een kindercentrum een voorziening voor gastouderopvang of een gastouderbureau in een woning is
      gevestigd, zijn de toezichthouders ter uitvoering van de taken, bedoeld in het eerste lid, bevoegd zonder
      toestemming van de bewoners in die woning binnen te treden.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel61
  - number: '62.1'
    text: |-
      De toezichthouder onderzoekt na een aanvraag als bedoeld in [artikel 45, eerste of tweede lid][ref1], binnen
      een bij regeling van Onze Minister te stellen termijn of de exploitatie redelijkerwijs zal plaatsvinden in
      overeenstemming met het bepaalde bij of krachtens [hoofdstuk 3, paragrafen 2][ref2] en [3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '62.2'
    text: |-
      Onverminderd het eerste lid onderzoekt de toezichthouder jaarlijks of de exploitatie van elk kindercentrum, elke
      voorziening voor gastouderopvang of elk gastouderbureau plaatsvindt in overeenstemming met de bij of krachtens
      [hoofdstuk 3, paragrafen 2][ref1] en [3][ref2], gestelde regels, behoudens bijzondere omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '62.3'
    text: |-
      Naast het onderzoek, bedoeld in het eerste en tweede lid, kan de toezichthouder incidenteel onderzoek verrichten
      naar de naleving door een houder van de bij of krachtens [hoofdstuk 3, paragrafen 2][ref1] en [3][ref2], gestelde
      regels. [Artikel 63][ref3] is van overeenkomstige toepassing, tenzij de aard of omvang van het onderzoek zich tegen
      openbare rapportage verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel63
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '63.1'
    text: |-
      De toezichthouder legt zijn oordeel naar aanleiding van een onderzoek bij een kindercentrum, een voorziening voor
      gastouderopvang of een gastouderbureau vast in een inspectierapport.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel63
  - number: '63.2'
    text: |-
      Indien de toezichthouder oordeelt dat door de houder de bij of krachtens [hoofdstuk 3, paragrafen 2][ref1] en
      [3][ref2], gegeven voorschriften niet zijn of zullen worden nageleefd, vermeldt hij dat in het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '63.3'
    text: |-
      Alvorens het rapport vast te stellen, stelt de toezichthouder de houder in de gelegenheid van het ontwerprapport
      kennis te nemen en daarover zijn zienswijze kenbaar te maken. De toezichthouder vermeldt de zienswijze van de
      houder in een bijlage bij het rapport.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel63
  - number: '63.4'
    text: |-
      De toezichthouder zendt het inspectierapport onverwijld aan de houder, die een afschrift daarvan zo spoedig
      mogelijk ter inzage legt op een voor ouders en personeel toegankelijke plaats.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel63
  - number: '63.5'
    text: De toezichthouder maakt het inspectierapport uiterlijk drie weken na de vaststelling daarvan openbaar.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel63
  - number: '64.1'
    text: |-
      Onze Minister kan beleidsregels stellen omtrent de door de toezichthouder te hanteren werkwijze voor een onderzoek
      als bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel64
  - number: '64.2'
    text: De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel64
  - number: '65.1'
    text: |-
      Het college van burgemeester en wethouders van de gemeente waarin zich een kindercentrum, een voorziening voor
      gastouderopvang of een gastouderbureau bevindt dat de bij of krachtens [hoofdstuk 3, paragrafen 2][ref1] en
      [3][ref2], gegeven voorschriften niet of in onvoldoende mate naleeft, kan de houder een schriftelijke aanwijzing
      geven.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '65.2'
    text: |-
      In een aanwijzing als bedoeld in het eerste lid geeft het college van burgemeester en wethouders met redenen
      omkleed aan op welke punten de in het eerste lid bedoelde voorschriften niet of in onvoldoende mate worden
      nageleefd, alsmede de in verband daarmee te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel65
  - number: '65.3'
    text: |-
      De toezichthouder kan een schriftelijk bevel geven aan een kindercentrum, gastouderbureau of voorziening voor
      gastouderopvang indien hij oordeelt:
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel65
  - number: 65.3.a
    text: |-
      dat de kwaliteit van de kinderopvang bij een kindercentrum of een voorziening voor gastouderopvang zodanig
      tekortschiet dat het nemen van maatregelen redelijkerwijs geen uitstel kan lijden; of
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel65
  - number: 65.3.b
    text: |-
      dat de kwaliteit van een gastouderbureau zodanig tekort schiet, en daardoor het risico bestaat dat ook de kwaliteit
      van de gastouderopvang in gevaar komt, dat het nemen van maatregelen redelijkerwijs geen uitstel kan lijden.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel65
  - number: '65.4'
    text: |-
      Het bevel, bedoeld in het derde lid, heeft een geldigheidsduur van zeven dagen, welke door het college van
      burgemeester en wethouders kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel65
  - number: '65.5'
    text: De houder neemt de maatregelen binnen de bij de aanwijzing onderscheidenlijk het bevel gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel65
  - number: '66.1'
    text: |-
      Het college van burgemeester en wethouders kan de houder verbieden de exploitatie van een kindercentrum, een
      voorziening voor gastouderopvang of een gastouderbureau voort te zetten, zolang hij een bevel of aanwijzing niet
      opvolgt en het opleggen van een last onder bestuursdwang niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel66
  - number: '66.2'
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 62][ref1] blijkt dat het kindercentrum, de voorziening voor
      gastouderopvang of het gastouderbureau naar verwachting niet dan wel niet langer aan de bij of krachtens
      [hoofdstuk 3, paragraaf 2][ref2], gegeven voorschriften zal voldoen, kan het college van burgemeester en
      wethouders zolang die situatie zich voordoet, de houder verbieden dat kindercentrum, die voorziening voor
      gastouderopvang of dat gastouderbureau in exploitatie te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '67.1'
    text: |-
      Het college van burgemeester en wethouders stelt jaarlijks op een door Onze Minister te bepalen tijdstip
      een verslag vast van alle werkzaamheden die hij en de toezichthouders in het kader van dit hoofdstuk in het
      voorafgaande kalenderjaar hebben verricht. Het college zendt het verslag aan de gemeenteraad en een afschrift
      daarvan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel67
  - number: '67.2'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de in het verslag op te nemen gegevens.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel67
  - number: 67a
    text: |-
      De Belastingdienst/Toeslagen verstrekt aan de GGD kosteloos de gegevens en inlichtingen waarvan de kennisneming van
      belang kan zijn voor het toezicht op de naleving van de bij of krachtens [hoofdstuk 3][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
  - number: '68.1'
    text: |-
      Onze Minister houdt toezicht op de rechtmatigheid en de doeltreffendheid van de uitvoering van de bij of krachtens
      [hoofdstuk 3, paragraaf 1][ref1], [hoofdstuk 4][ref2] en [hoofdstuk 6][ref3] gestelde regels door het college van
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '6'
  - number: '68.2'
    text: |-
      Het toezicht, bedoeld in het eerste lid, wordt uitgeoefend door de Inspectie van het onderwijs, genoemd in
      [artikel 2, eerste lid, van de Wet op het onderwijstoezicht][ref1]. De [artikelen 3][ref2], [4, tweede lid][ref3],
      [7][ref4], [22][ref5] en [23 van de Wet op het onderwijstoezicht][ref6] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0013800#Artikel22
      [ref6]: https://wetten.overheid.nl/BWBR0013800#Artikel23
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0013800
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0013800
        artikel: '22'
      - id: ref6
        bwb_id: BWBR0013800
        artikel: '23'
  - number: '68.3'
    text: |-
      Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering de bij of krachtens
      [hoofdstuk 3, paragraaf 1][ref1], [hoofdstuk 4][ref2] en [hoofdstuk 6][ref3] gestelde regels ernstige
      tekortkomingen constateert, aan het college van burgemeester en wethouders, nadat het gedurende acht weken in de
      gelegenheid is gesteld zijn zienswijze naar voren te brengen, een aanwijzing geven. Hij treedt daarbij niet in de
      besluitvorming inzake individuele gevallen. In een aanwijzing wordt een termijn opgenomen waarbinnen het college
      van burgemeester en wethouders de uitvoering in overeenstemming heeft gebracht met de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '6'
  - number: '69.1'
    text: |-
      Het college van burgemeester en wethouders en de gemeenteraad verstrekken Onze Minister alle gegevens en
      inlichtingen die hij voor het toezicht nodig heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel69
  - number: '69.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de wijze waarop het college van
      burgemeester en wethouders de in het eerste lid bedoelde gegevens en inlichtingen verzamelen en verstrekken.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel69
  - number: '69.3'
    text: De gegevens en inlichtingen, bedoeld in het eerste lid, worden kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel69
  - number: '70'
    text: |-
      Onze Minister stelt jaarlijks een verslag vast van de werkzaamheden die hij in het kader van dit hoofdstuk in
      het voorafgaande kalenderjaar heeft verricht. Hij zendt afschrift van het verslag aan de Tweede Kamer der Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel70
  - number: '72.1'
    text: 'Het college van burgemeester en wethouders kan:'
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel72
  - number: 72.1.a
    text: |-
      de houder die een verplichting als bedoeld bij of krachtens [hoofdstuk 3][ref1], een aanwijzing onderscheidenlijk
      een bevel als bedoeld in [artikel 65][ref2] of [artikel 5:20 van de Algemene wet bestuursrecht][ref3] niet nakomt
      dan wel handelt in strijd met een verbod krachtens [artikel 66][ref4], een bestuurlijke boete opleggen van ten
      hoogste € 45 000;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel66
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '65'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 72.1.b
    text: |-
      de houder die een verplichting als bedoeld in [artikel 28, vierde lid][ref1], niet nakomt een bestuurlijke boete
      opleggen van ten hoogste € 5000;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel28
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 72.1.c
    text: |-
      de ouder die een verplichting als bedoeld in [artikel 28, eerste tot en met derde lid][ref1], niet nakomt een
      bestuurlijke boete opleggen van ten hoogste € 2269.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel28
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '72.2'
    text: |-
      In afwijking van het eerste lid kan de overtreding van de houder niet met een bestuurlijke boete worden afgedaan,
      indien de overtreding opzettelijk of roekeloos geschiedt en een direct gevaar voor de gezondheid of de veiligheid
      van personen tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel72
  - number: '80'
    text: |-
      Indien het college van burgemeester en wethouders voornemens is een bestuurlijke boete op te leggen, geeft hij de
      overtreder daarvan kennis onder de vermelding van de gronden waarop het voornemen berust en overlegging van het
      rapport.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel80
  - number: '86'
    text: 'Het Uitvoeringsinstituut werknemersverzekeringen kan:'
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel86
  - number: 86.a
    text: |-
      aan de ouder die een verplichting gesteld in [artikel 33][ref1] niet nakomt, een
      bestuurlijke boete opleggen met overeenkomstige toepassing van de [artikelen 29a][ref2], en
      [29g van de Wet op de arbeidsongeschiktheidsverzekering][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel29a
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel29g
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '33'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 29a
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 29g
  - number: 86.b
    text: |-
      aan de houder die een verplichting gesteld in [artikel 33, vierde lid][ref1], niet nakomt een bestuurlijke boete
      opleggen met overeenkomstige toepassing van de [artikelen 72, eerste lid, onder b][ref2], en [80][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel80
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '33'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '72'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '80'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '87.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor een periode van ten hoogste vier jaar ten behoeve van experimenten,
      die ten doel hebben de totstandkoming van innovatieve kinderopvang mogelijk te maken, vormen van kinderopvang
      worden aangewezen en kunnen regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel87
  - number: 87.1.a
    text: de kwaliteit van de aan te wijzen vormen van kinderopvang;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel87
  - number: 87.1.b
    text: het toezicht op de naleving van de regels, bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel87
  - number: 87.1.c
    text: |-
      de hoogte van de kinderopvangtoeslag en de hoogte van de tegemoetkomingen van de gemeente en van het
      Uitvoeringsinstituut werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel87
  - number: 87.1.d
    text: de duur van de aan te wijzen vormen van kinderopvang als experiment.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel87
  - number: '87.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid heeft een ouder als bedoeld in de [artikelen 6][ref1],
      [22][ref2], [29][ref3] of [35][ref4] aanspraak op een kinderopvangtoeslag in de door hem of zijn partner te betalen
      kosten jegens het Rijk onderscheidenlijk aanspraak op een tegemoetkoming in de door hem of zijn partner te betalen
      kosten van kinderopvang jegens de gemeente of jegens het Uitvoeringsinstituut werknemersverzekeringen, indien het
      betreft een experimentele vorm van kinderopvang, welke is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel35
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '35'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '87.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen experimenten als bedoeld in het eerste lid na afloop van de looptijd
      worden voortgezet tot een structurele regeling is getroffen, doch niet langer dan met een tijdsduur van ten hoogste
      twee jaar. Het eerste en tweede lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel87
  - number: '88.1'
    text: |-
      Onze Minister zendt na overleg met Onze Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn en
      Sport uiterlijk zes maanden voor de beëindiging van een experiment, als bedoeld in [artikel 87][ref1], een verslag
      over de doeltreffendheid en de effecten ervan alsmede een standpunt inzake de voortzetting van de desbetreffende
      regeling, anders dan als experiment, aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel87
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '87'
        hoofdstuk: '6'
  - number: '88.2'
    text: |-
      Indien een experiment als bedoeld in [artikel 87][ref1], eerder wordt beëindigd dan de bij algemene maatregel van
      bestuur, bedoeld in het eerste lid van dat artikel, daarvoor gestelde duur, zendt Onze Minister na overleg met Onze
      Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn en Sport, in afwijking van het eerste lid,
      uiterlijk twee maanden na de beëindiging van dat experiment een verslag over de doeltreffendheid en de effecten
      ervan alsmede een standpunt inzake de voortzetting van de desbetreffende regeling, anders dan als experiment, aan
      de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel87
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '87'
        hoofdstuk: '6'
  - number: '89'
    text: |-
      Een voordracht voor een krachtens dit hoofdstuk vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel89
  - number: '90.1'
    text: |-
      Het college van burgemeester en wethouders van de gemeente van vestiging draagt er zorg
      voor dat kindercentra en gastouderbureaus die op het tijdstip van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________ zijn opgenomen in het register kinderopvang, bedoeld
      in [artikel 46][ref2], zoals dat luidde op de dag voor inwerkingtreding van voornoemde wijzigingswet, voor
      1 juli van het eerste kalenderjaar waarop voornoemde wijzigingswet betrekking heeft, worden ingeschreven in
      het register kinderopvang, bedoeld in [artikel 47a][ref3]. [Artikel 46, derde en vijfde lid][ref4], alsmede
      [artikel 47, eerste en tweede lid][ref5], zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026299#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel47a
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel47
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0026299
        artikel: I
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: 47a
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0017017
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '90.2'
    text: |-
      Indien de overheveling naar het register kinderopvang, bedoeld in het eerste lid, nog niet volledig heeft
      plaatsgevonden blijft [artikel 46][ref1], zoals dat luidde de dag voorafgaand aan de inwerkingtreding van de in
      het eerste lid genoemde wijzigingswet, tot 1 juli van het eerste kalenderjaar waarop voornoemde wijzigingswet
      betrekking heeft van toepassing op het college van burgemeester en wethouders van de desbetreffende gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel46
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '90.3'
    text: |-
      Een houder van een kindercentrum of gastouderbureau als bedoeld in het eerste lid, verstrekt desgevraagd aan het
      college de gegevens, bedoeld in [artikel 45, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel45
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '90.4'
    text: |-
      De in het eerste lid bedoelde inschrijving in het register kinderopvang van gastouderbureaus betreft een voorlopige
      inschrijving, welke voortduurt tot en met uiterlijk 31 december van het eerste kalenderjaar waarop de in het eerste
      lid genoemde wijzigingswet betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel90
  - number: '90.5'
    text: |-
      De in het vierde lid bedoelde inschrijving wordt definitief indien uiterlijk op de in dat lid genoemde datum
      uit het onderzoek, bedoeld in [artikel 62][ref1], is gebleken dat de exploitatie van het gastouderbureau
      zal plaatsvinden in overeenstemming met het bepaalde bij of krachtens de [paragrafen 2][ref2] en
      [3 van hoofdstuk 3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 90a.1
    text: |-
      Ter uitvoering van [artikel 49, derde lid, onderdeel a][ref1], is het gastouderbureau gedurende het eerste
      kalenderjaar na inwerkingtreding van de wet van 18 juli 2009 tot wijziging van de Wet kinderopvang in verband
      met een herziening van het stelstel van gastouderopvang (*Stb.* 345) verantwoordelijk voor de beoordeling of de
      gastouderopvang naar verwachting voor 1 september van genoemd kalenderjaar redelijkerwijs zal plaatsvinden in
      overeenstemming met het bepaalde bij of krachtens de [paragrafen 2][ref2] en [3 van hoofdstuk 3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 90a.2
    text: |-
      Het gastouderbureau stelt de ouders die gebruikmaken van de diensten van de gastouder in kennis van zijn in het
      eerste lid bedoelde beoordeling.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel90a
  - number: 90a.3
    text: |-
      Het gastouderbureau stelt de in het tweede lid bedoelde ouders voor de aanvang van het in het eerste lid bedoelde
      eerste kalenderjaar in kennis van zijn oordeel over de verwachtingen met betrekking tot het tijdig kunnen voldoen
      aan de in het eerste lid bedoelde eisen door de gastouder.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel90a
  - number: 90a.4
    text: |-
      Voor de toepassing van het eerste en derde lid baseert het gastouderbureau zich op geobjectiveerde redelijke
      maatstaven die aantoonbaar zijn afgeleid van de in het eerste lid bedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel90a
  - number: 90a.5
    text: |-
      Het gastouderbureau stelt zich regelmatig op de hoogte van de inspanningen van de gastouder om voor 1 september
      van het in het eerste lid bedoelde kalenderjaar overeenkomstig de in het eerste lid bedoelde beoordeling door het
      gastouderbureau te voldoen aan het bepaalde bij of krachtens de [paragrafen 2][ref1] en [3 van hoofdstuk 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 90a.6
    text: |-
      De gastouder verstrekt aan het gastouderbureau de benodigde informatie met het oog op toepassing van het tweede en
      derde lid.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel90a
  - number: 90a.7
    text: |-
      Ingeval het gastouderbureau redelijkerwijs mag vermoeden dat de in het vijfde lid bedoelde inspanningen van
      de gastouder tekortschieten, stelt het gastouderbureau de ouder daarvan onverwijld in kennis en bevordert het
      gastouderbureau dat de ouder gebruik kan maken van de diensten van een gastouder die gastouderopvang aanbiedt
      die naar het oordeel van het gastouderbureau naar verwachting voor 1 september van de in het eerste lid bedoelde
      kalenderjaar zal plaatsvinden in overeenstemming met het bepaalde bij of krachtens de [paragrafen 2][ref1] en
      [3 van hoofdstuk 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 90a.8
    text: |-
      Indien de gastouder uiterlijk op 31 december van het in het eerste lid bedoelde kalenderjaar niet is ingeschreven
      in het register kinderopvang, bedoeld in [artikel 47a][ref1], is de ouder aan het gastouderbureau geen
      uitvoeringskosten verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel47a
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: 47a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 90a.9
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel90a
  - number: '91.1'
    text: |-
      Personen die op de dag voorafgaand aan de inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________ werkzaam waren als gastouder als bedoeld in
      [artikel 1, onderdeel f][ref2], van deze wet, zoals dat luidde op de dag voorafgaand aan de inwerkingtreding
      van dat [artikel I, onderdelen B en G][ref3], worden door het college van burgemeester en wethouders in het
      register kinderopvang, bedoeld in [artikel 47a][ref4], ingeschreven als voorziening voor gastouderopvang indien
      op het moment van inschrijving na een aanvraag als bedoeld in [artikel 45, tweede lid][ref5], uit het onderzoek,
      bedoeld in [artikel 62, eerste lid][ref6], is gebleken dat exploitatie van de voorziening voor gastouderopvang
      redelijkerwijs zal plaatsvinden in overeenstemming met het bepaalde bij of krachtens de [paragrafen 2][ref7] en
