        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: 56b
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '115.1'
    text: |-
      Onze Minister brengt na overleg met Onze Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn en
      Sport gedurende drie jaar na de inwerkingtreding van deze wet jaarlijks aan de Staten-Generaal een verslag uit over
      de werking ervan.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel115
  - number: '115.2'
    text: |-
      Onze Minister brengt na overleg met Onze Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn en
      Sport drie jaar na de inwerkingtreding van deze wet, en vervolgens telkens na drie jaar, aan de Staten-Generaal een
      verslag uit over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel115
  - number: '115.3'
    text: |-
      Onze Minister brengt na overleg met Onze Minister van Financiën en Onze Minister
      van Volksgezondheid, Welzijn en Sport een jaar na de inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      ___________________ en vervolgens telkens als onderdeel van het verslag, bedoeld in het tweede lid, aan de Staten-
      Generaal een verslag uit over de doeltreffendheid en de effecten in de praktijk van de onderdelen van deze wet,
      zoals deze zijn gewijzigd door de [genoemde wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026299
      [ref2]: https://wetten.overheid.nl/BWBR0026299
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0026299
      - id: ref2
        bwb_id: BWBR0026299
  - number: '116.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende paragrafen,
      artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel116
  - number: '116.2'
    text: |-
      De [artikelen 1, onder b, 3°][ref1], [2, negende lid, tweede volzin][ref2], [2a, tweede lid][ref3], en 3c, van de
      [Wet klachtrecht cliënten zorgsector][ref4] vervallen op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007414#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007414#Artikel2a
      [ref4]: https://wetten.overheid.nl/BWBR0007414
