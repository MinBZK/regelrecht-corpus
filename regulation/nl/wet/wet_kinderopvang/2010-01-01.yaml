    text: |-
      Een oordeel van de toezichthouder als bedoeld in [artikel 63][ref1], inhoudende dat de exploitatie van een
      voorziening voor gastouderopvang redelijkerwijs zal plaatsvinden in overeenstemming met het bepaalde bij of
