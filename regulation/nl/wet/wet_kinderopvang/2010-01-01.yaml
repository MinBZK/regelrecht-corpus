  - number: '1.2'
    text: 'Tot kinderopvang worden niet gerekend:'
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel1
  - number: 1.2.a
    text: het toezichthouden op schoolgaande kinderen dat zich beperkt tot het toezicht tijdens de middagpauze;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel1
  - number: 1.2.b
    text: |-
      verzorging en opvoeding in een peuterspeelzaal, waaronder wordt verstaan: een voorziening waarin uitsluitend
      kinderen vanaf de leeftijd van twee jaar tot het tijdstip waarop zij kunnen deelnemen aan het basisonderwijs,
      verblijven in een speelgroep;
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel1
  - number: 1.2.c
    text: |-
      verzorging en opvoeding die plaatsvindt in het kader van de [Wet op de jeugdzorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016637
  - number: 1.2.d
    text: |-
      verzorging en opvoeding van kinderen, anders dan gastouderopvang, die geschiedt op een plaats waar het kind zijn
      hoofdverblijf heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2010-01-01#Artikel1
