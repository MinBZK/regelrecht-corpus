      de [in het eerste lid genoemde wijzigingswet][ref4], dat is gegeven ten hoogste twee maanden voorafgaande aan de
      inwerkingtreding van genoemd [artikel I, onderdelen B en G][ref5], geldt als oordeel gegeven op de eerste dag van
      laatstbedoeld tijdstip van inwerkingtreding.


