        afdeling: '4'
  - number: '1.55'
    text: |-
      1 Bij kinderopvang in een kindercentrum of in een voorziening voor gastouderopvang wordt de Nederlandse taal als
      voertaal gebruikt. Daar waar naast de Nederlandse taal, de Friese taal of een streektaal in levend gebruik is, kan
      de Friese taal of de streektaal mede als voertaal worden gebruikt.

      2 In afwijking van het eerste lid kan mede een andere taal als voertaal worden gebezigd, indien de herkomst van de
      kinderen in specifieke omstandigheden daartoe noodzaakt, overeenkomstig een door de houder van het kindercentrum of
      van het gastouderbureau vastgestelde gedragscode.

      3 In afwijking van het eerste lid kan een kindercentrum meertalige kinderopvang aanbieden waarbij voor ten hoogste
      vijftig procent van de openingstijd per dag de Duitse, Engelse of Franse taal als voertaal worden gebruikt,
      met uitzondering van de krachtens [artikel 1.50b, aanhef en onderdeel d][ref1], voorgeschreven tijd die het
      kindercentrum minimaal besteedt aan voorschoolse educatie.

      4 In afwijking van het derde lid kan een hoger percentage gehanteerd worden in geval van ziekte, vakantie of andere
      soorten verlof.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de voorwaarden voor
      afwijking van het percentage als bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.50b
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.55
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: 1.50b
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '3'
  - number: '1.56'
    text: |-
      1 De houder van een gastouderbureau organiseert zijn werkzaamheden op zodanige wijze, voorziet het bureau
      zowel kwalitatief als kwantitatief zodanig van personeel en materieel, draagt zorg voor een zodanige
      verantwoordelijkheidstoedeling en voert een zodanig beleid, dat een en ander leidt of redelijkerwijs moet leiden
      tot verantwoorde uitvoering van die werkzaamheden en tot naleving van [artikel 1.56b][ref1] door de gastouder.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de kwaliteit van
      gastouderbureaus, waaronder regels omtrent de opleidingseisen waaraan de beroepskrachten voldoen.

      3 Op de houder of voorgenomen houder van een gastouderbureau en de personen die werkzaam zijn bij
      een onderneming waarmee de houder een gastouderbureau exploiteert of daarvoor beschikbaar zijn, is
      [artikel 1.50, derde tot en met achtste lid][ref2], van overeenkomstige toepassing.

      4 Gastouderopvang geschiedt op basis van een schriftelijke overeenkomst tussen de houder van het gastouderbureau
      en de ouder. Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de inhoud van de
      overeenkomst.

      5 Bij regeling van Onze Minister kan worden bepaald dat de uitvoeringskosten een bij die regeling vast te stellen
      maximum per nader te bepalen soort kosten niet te boven gaan.

      6 Bij regeling van Onze Minister kunnen ten behoeve van een goede uitvoering van deze wet regels worden gesteld
      omtrent:

      a. de administratie van gegevens bij gastouderbureaus;

      b. het betalingsverkeer tussen gastouders, het gastouderbureau en ouders;

      c. de informatieverstrekking door het gastouderbureau aan ouders.

      7 Bij regeling van Onze Minister kunnen regels worden gesteld over het minimum aantal uren ondersteuning dat een
      gastouderbureau jaarlijks verleent aan een gastouder.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.56b
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.50
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.56
