  - number: '1.47'
    text: |-
      1 De houder van een kindercentrum of van een gastouderbureau doet van een wijziging in de gegevens die daartoe bij
      of krachtens algemene maatregel van bestuur worden aangewezen onverwijld mededeling aan het college, nadat deze
      wijziging hem bekend is geworden. Hierbij verzoekt de houder de gegevens te wijzigen.

      2 Het college kan naar aanleiding van het verzoek, bedoeld in het eerste lid, besluiten tot wijziging van de
      gegevens en verwerkt dit zo nodig in het landelijk register kinderopvang.

      3 De houder van een kindercentrum of van een gastouderbureau kan het college verzoeken de beschikking, bedoeld
      in [artikel 1.46, tweede lid][ref1], in te trekken. Indien het college besluit tot intrekking van de beschikking,
      draagt het college onverwijld zorg voor de verwijdering van het kindercentrum, het gastouderbureau of de
      voorziening voor gastouderopvang uit het landelijk register kinderopvang.

      4 Indien de aanvraag tot exploitatie van een kindercentrum, gastouderbureau of voorziening voor gastouderopvang
      heeft plaatsgevonden voor 1 januari 2010 door middel van een melding bij het college volstaat het college,
      in afwijking van het derde lid, met een beschikking waarin wordt bepaald met ingang van welke datum er geen
      toestemming meer is voor de exploitatie en verwijdering van het kindercentrum, het gastouderbureau of de
      voorziening voor gastouderopvang uit het landelijk register kinderopvang.

      5 Het college heft geen recht als bedoeld in [artikel 229 van de Gemeentewet][ref2] in verband met een verzoek als
      bedoeld in het eerste en derde lid.

      6 Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van het eerste tot en met het vierde lid
      nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.46
