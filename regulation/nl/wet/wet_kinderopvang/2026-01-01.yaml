  - number: 1.47a
    text: |-
      1 Onze Minister dan wel het college kan besluiten de gegevens van een kindercentrum, een gastouderbureau of een
      voorziening voor gastouderopvang zonder een daaraan voorafgaand verzoek van de houder in het landelijk register
      kinderopvang te wijzigen. Indien Onze Minister dan wel het college hiertoe besluit, wordt dit verwerkt in het
      landelijk register kinderopvang.

      2 Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van het eerste lid nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.47a
  - number: 1.47b
    text: |-
      1 Onze Minister draagt zorg voor de inrichting van een landelijk register kinderopvang ten behoeve van de
      waarborging van de kwaliteit en de rechtszekerheid van de kinderopvang alsmede ten behoeve van het toezicht op en
      de handhaving van de bij of krachtens deze afdeling gestelde regels.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent het landelijk register
      kinderopvang. Deze regels hebben in ieder geval betrekking op:

      a. de vorm van het register;

      b. de in het register op te nemen gegevens;

      c. de vastlegging in, de wijziging van en de verwijdering van gegevens uit het register;

      d. de verstrekking van gegevens;

      e. de openbaarheid van gegevens;

      f. de verantwoordelijkheden van degenen die gegevens aanleveren ten behoeve van het register.

      3 Een kindercentrum, een gastouderbureau en een voorziening voor gastouderopvang worden in het landelijk register
      kinderopvang geregistreerd onder een uniek nummer.

      4 Indien een gastouderbureau uit het landelijk register kinderopvang wordt verwijderd, blijft een voorziening voor
      gastouderopvang die bij dat gastouderbureau is aangesloten gedurende een bij of krachtens algemene maatregel van
      bestuur te bepalen termijn in het landelijk register kinderopvang ingeschreven.
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.47b
  - number: '1.48'
    text: |-
      1 Onze Minister kan een in een andere lidstaat dan Nederland of een in Zwitserland of het Verenigd Koninkrijk
      gevestigde voorziening waar kinderopvang plaatsvindt, gelijkstellen met een geregistreerd kindercentrum of
      een geregistreerde voorziening voor gastouderopvang door inschrijving daarvan in het register buitenlandse
      kinderopvang. Indien in een andere lidstaat dan Nederland, in Zwitserland of in het Verenigd Koninkrijk een of meer
      organisaties bestaan die naar aard en strekking gastouderopvang tot stand brengen of begeleiden, is gelijkstelling
      met een geregistreerde voorziening voor gastouderopvang uitsluitend mogelijk indien sprake is van tussenkomst van
      een dergelijke organisatie.

      2 Onze Minister kan een voorziening waar kinderopvang plaatsvindt door een in Nederland gevestigde gastouder die
      gastouderopvang biedt op het woonadres van een van de ouders van de kinderen voor wie de gastouderopvang wordt
      geboden, waarbij dat woonadres zich in een andere lidstaat dan Nederland, in Zwitserland of in het Verenigd
      Koninkrijk bevindt, gelijkstellen met een geregistreerde voorziening voor gastouderopvang door inschrijving daarvan
      in het register buitenlandse kinderopvang. Gelijkstelling is uitsluitend mogelijk indien sprake is van tussenkomst
      van een organisatie als bedoeld in het eerste lid, tweede zin, of van een geregistreerd gastouderbureau.

      3 Een ouder die ten behoeve van zijn kind voornemens is:

      a. gebruik te maken van een voorziening als bedoeld in het eerste of tweede lid die nog niet staat ingeschreven in
      het register buitenlandse kinderopvang; en

      b. aanspraak te maken op de kinderopvangtoeslag, bedoeld in [artikel 1.5, eerste lid][ref1];

      dient bij Onze Minister een aanvraag in tot inschrijving van die voorziening in het register buitenlandse
      kinderopvang.

      4 Bij de aanvraag, bedoeld in het derde lid, toont de ouder aan dat degene die een voorziening als bedoeld in het
      eerste of tweede lid exploiteert, instemt met de aanvraag en bereid is desgevraagd alle door de Dienst Toeslagen en
      de door Onze Minister benodigde inlichtingen te verstrekken en de Dienst Toeslagen en Onze Minister inzage te geven
      in alle zakelijke gegevens en bescheiden, indien dat voor de vervulling van hun taken redelijkerwijs nodig is.

      5 Uiterlijk tien weken na de ontvangst van de aanvraag, bedoeld in het derde lid, besluit Onze Minister op de
      aanvraag. Indien door de ouder aannemelijk is gemaakt dat de kwaliteit van een voorziening als bedoeld in het
      eerste of tweede lid:

      a. naar aard en strekking in overeenstemming is met het bepaalde bij of krachtens [paragraaf 2][ref2] van deze
      afdeling, en

      b. anderszins niet is gebleken van feiten en omstandigheden die op het tegendeel duiden,

      en voldaan is aan het vierde lid,

      wordt positief op de aanvraag beslist.

      6 Bij een positieve beschikking als bedoeld in het vijfde lid bepaalt Onze Minister de ingangsdatum en de einddatum
      van de inschrijving in het register buitenlandse kinderopvang. Onze Minister draagt zorg voor inschrijving van een
      voorziening als bedoeld in het eerste of tweede lid in het register buitenlandse kinderopvang.

      7 De ouder, bedoeld in het derde lid, doet gedurende de periode dat hij gebruik maakt van een voorziening als
      bedoeld in het eerste of tweede lid, van een wijziging in de gegevens die daartoe bij of krachtens algemene
      maatregel van bestuur worden aangewezen, onverwijld mededeling aan Onze Minister. Hierbij verzoekt hij de gegevens
      te wijzigen.

      8 De ouder, bedoeld in het derde lid, kan aan Onze Minister een verzoek tot verwijdering van de inschrijving van
      een voorziening als bedoeld in het eerste of tweede lid, doen.

      9 Onze Minister kan naar aanleiding van het verzoek, bedoeld in het zevende of achtste lid, besluiten tot wijziging
      van de gegevens of tot verwijdering van de inschrijving uit het register buitenlandse kinderopvang. Indien hij
      hiertoe besluit verwerkt hij dit zo nodig in het register buitenlandse kinderopvang.

      10 De de [artikelen 1.45 tot en met 1.47b][ref3] en [1.48d tot en met 1.60c][ref4] en de [afdelingen 4][ref5] en
      [5][ref6] van dit hoofdstuk zijn niet van toepassing op een voorziening als bedoeld in het eerste of tweede lid.

      11 Bij of krachtens algemene maatregel van bestuur:

      a. worden nadere regels gesteld omtrent de gegevens die worden verstrekt bij de aanvraag, bedoeld in het derde lid,
      en over de wijze van verstrekking van deze gegevens;

      b. worden nadere regels gesteld over de wijze waarop kan worden aangetoond dat een voorziening als bedoeld
      in het eerste of tweede lid naar aard en strekking in overeenstemming is met het bepaalde bij of krachtens
      [paragraaf 2][ref7] en [4][ref8] van deze afdeling;

      c. kunnen ter uitvoering van het vijfde tot en met negende lid nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel15
