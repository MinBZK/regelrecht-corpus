  - number: '1.10'
    text: |-
      1 De financiële middelen tot dekking van de uitgaven voor de kinderopvangtoeslag kunnen mede worden verkregen door
      het heffen van een opslag op de premie, bedoeld in [artikel 36 van de Wet financiering sociale verzekeringen][ref1].

      2 De premieopslag, bedoeld in het eerste lid, is verschuldigd door de werkgever.

      3 De premieopslag wordt vastgesteld bij ministeriële regeling.
      [Artikel 35 van de Wet financiering sociale verzekeringen][ref2] is van overeenkomstige toepassing.

      4 Op de heffing en invordering van de premieopslag zijn de [artikelen 57][ref3], [59][ref4] en
      [60 van de Wet financiering sociale verzekeringen][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel36
