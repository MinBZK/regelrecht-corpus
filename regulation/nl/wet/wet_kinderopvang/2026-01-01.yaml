  - number: 1.54a
    text: |-
      1 De houder van een gastouderbureau informeert de ouders van de kinderen die gebruik maken van gastouderopvang die
      door zijn tussenkomst plaats vindt en een ieder die daarom verzoekt over het te voeren beleid als bedoeld in deze
      paragraaf.

      2 De houder van een gastouderbureau informeert over een inspectierapport als bedoeld in
      [artikel 1.63, eerste lid][ref1], inzake zijn gastouderbureau of inzake een bij dat gastouderbureau aangesloten
      voorziening voor gastouderopvang:

      a. de ouders van de kinderen die door zijn tussenkomst gebruik maken van een voorziening voor gastouderopvang,

      b. de personen werkzaam bij een onderneming waarmee de houder een gastouderbureau exploiteert, en

      c. de gastouders die gastouderopvang aanbieden door zijn tussenkomst.

      3 Het informeren als bedoeld in het tweede lid vindt plaats doordat de houder het inspectierapport zo spoedig
      mogelijk na ontvangst op zijn website plaatst zodanig dat het rapport voor de ouders, de personen werkzaam bij
      de onderneming waarmee de houder het gastouderbureau exploiteert en de gastouders gemakkelijk vindbaar is, dan
      wel indien de houder geen eigen website heeft, ter inzage legt op een voor de ouders, de personen werkzaam bij de
      onderneming en de gastouders toegankelijke plaats.

      4 Bij regeling van Onze Minister kunnen ten behoeve van een goede uitvoering van dit hoofdstuk regels worden
      gesteld met betrekking tot de informatie die de houder van een gastouderbureau verplicht is beschikbaar te stellen
      aan een ouder.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.63
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.54a
