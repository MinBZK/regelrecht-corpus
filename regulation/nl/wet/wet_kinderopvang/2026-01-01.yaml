      1 In afwijking van [artikel 1.58, eerste lid][ref1], kan een houder van kindercentra of van gastouderbureaus
      een gecombineerde oudercommissie instellen indien de houder in hetzelfde of een aangrenzend gebouw meer dan een
      kindercentrum of gastouderbureau exploiteert.

      2 Op een gecombineerde oudercommissie zijn de [artikelen 1.58, tweede tot en met zesde lid][ref2], [1.59][ref3] en
      [1.60][ref4] van deze wet van overeenkomstige toepassing.

      3 Een gecombineerde oudercommissie bestaat in elk geval uit een afzonderlijke ouder per kindercentrum of
      gastouderbureau.

      4 Onverminderd [artikel 1.59, vierde lid][ref5], is voor een beslissing van een gecombineerde oudercommissie een
      meerderheid van stemmen nodig per kindercentrum of gastouderbureau.


