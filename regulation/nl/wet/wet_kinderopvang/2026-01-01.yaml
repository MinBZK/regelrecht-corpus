        artikel: '1'
  - number: '1.6'
    text: |-
      1 Een ouder heeft voor een berekeningsjaar aanspraak op een kinderopvangtoeslag, indien de ouder in dat jaar:

      a. tegenwoordige arbeid verricht waaruit inkomen uit werk en woning in de zin van de
      [Wet inkomstenbelasting 2001][ref1] wordt genoten,

      b. zonder enige vergoeding arbeid verricht in de onderneming van de partner in de zin van
      [artikel 3.78 van de Wet inkomstenbelasting 2001][ref2],

      c. algemene bijstand of een uitkering ontvangt op grond van de [Participatiewet][ref3], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5] of de
      [Algemene nabestaandenwet][ref6], en gebruik maakt van een voorziening gericht op arbeidsinschakeling als bedoeld
      in de [artikelen 7, eerste lid, onder a][ref7], of [7a, eerste lid, onder a, van de Participatiewet][ref8],
      __REF006___________________________________________________________________________________________________________
      __________________ en
      __REF007___________________________________________________________________________________________________________
      _____________________, die de noodzaak tot kinderopvang met zich brengt,

      d.

      e. de leeftijd van 18 jaar nog niet heeft bereikt, scholing of een opleiding volgt en met toepassing van
      [artikel 16][ref11] of [artikel 18, eerste en twaalfde lid, van de Participatiewet][ref12] algemene bijstand
      ontvangt of kan ontvangen,

      f. als niet-uitkeringsgerechtigde werkzoekende is geregistreerd bij het Uitvoeringsinstituut werknemersverzekeringen,
      genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref13], en gebruik maakt van
      een voorziening gericht op arbeidsinschakeling als bedoeld in de [artikelen 7, eerste lid, onder a][ref14], of
      [7a, eerste lid, onder a, van de Participatiewet][ref15],

      g. inburgeringsplichtig is op grond van de [Wet inburgering 2021][ref16] en een cursus of opleiding volgt
      waarmee hij aan de op grond van [artikel 15 van die wet][ref17] vastgestelde leerroute kan voldoen, voor zover de
      inburgeringsplichtige het taalschakeltraject, bedoeld in [artikel 8, tweede lid, van die wet][ref18], volgt, dan
      wel de cursusinstelling waar die cursus of opleiding wordt gevolgd in het bezit is van een certificaat als bedoeld
      in [artikel 28 van die wet][ref19] of een keurmerk als bedoeld in [artikel 32 van die wet][ref20], of, indien het
      een inburgeringsplichtige als bedoeld in [artikel 13, eerste lid, van die wet][ref21] betreft, de opleiding of
      cursus wordt aangeboden door het college als bedoeld in [artikel 16, eerste lid, van die wet][ref22],

      h. recht heeft op of een uitkering ontvangt op grond van de [Werkloosheidswet][ref23] en deelneemt aan scholing
      als bedoeld in [artikel 76 van die wet][ref24] of werkzaamheden verricht als bedoeld in [artikel 76a][ref25] of
      [77a van die wet][ref26] met behoud van die uitkering dan wel op andere wijze deelneemt aan een traject gericht
      op arbeidsinschakeling,

      i. recht heeft op een arbeidsongeschiktheidsuitkering op grond
      van de [Wet op de arbeidsongeschiktheidsverzekering][ref27], de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref28], de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref29], arbeidsondersteuning op grond
      van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten of een uitkering op grond van
      [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref30] of recht heeft op ziekengeld op grond van
      de [Ziektewet][ref31]:

      1°. ten behoeve van wie het Uitvoeringsinstituut werknemersverzekeringen werkzaamheden,
      gericht op de bevordering van de inschakeling in het arbeidsproces als bedoeld in
      [artikel 30a, achtste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref32] laat verrichten,

      2°. ten behoeve van wie de eigenrisicodrager, bedoeld in
      [artikel 82 van de Wet werk en inkomen naar arbeidsvermogen][ref33], onderscheidenlijk
      [artikel 63a van de Ziektewet][ref34], werkzaamheden, gericht op de bevordering van de inschakeling in het
      arbeidsproces als bedoeld in [artikel 42 van de Wet werk en inkomen naar arbeidsvermogen][ref35], onderscheidenlijk
      [artikel 63a, eerste lid, tweede volzin, van de Ziektewet][ref36], laat verrichten, of

      3°. werkzaamheden op een proefplaats verricht als bedoeld in
      [artikel 65g van de Wet op de arbeidsongeschiktheidsverzekering][ref37], [artikel 2:24][ref38]
      of [3:69 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref39],
      [artikel 67e van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref40],
      [artikel 37 van de Wet werk en inkomen naar arbeidsvermogen][ref41] of [artikel 52e van de Ziektewet][ref42],

      j. is ingeschreven bij een school of instelling, voor het volgen van:

      1°. voorbereidend wetenschappelijk onderwijs, hoger of middelbaar algemeen voortgezet
      onderwijs, voorbereidend beroepsonderwijs, praktijkonderwijs of andere vormen van voortgezet
      onderwijs als bedoeld in [artikel 2.1 van de Wet voortgezet onderwijs 2020][ref43] of
      [artikel 14, eerste lid, van de Wet op de expertisecentra][ref44];

      2°. een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref45];

      3°. een beroepsopleiding als bedoeld in [artikel 7.1.2, tweede lid, van de Wet educatie en beroepsonderwijs][ref46]
      die verzorgd wordt door een instelling als bedoeld in [artikel 1.1.1 van die wet][ref47], of door een instelling
      die op grond van [artikel 1.4.1 van de Wet educatie en beroepsonderwijs][ref48] bevoegd is een diploma uit te
      reiken voor die opleiding; of

      4°. een associate degree-opleiding, een bacheloropleiding, een masteropleiding
      of een postinitiële masteropleiding als bedoeld in de [artikelen 7.3a][ref49] of
      [7.3b van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref50], waarvoor accreditatie is verleend of
      die een toets nieuwe opleiding met positief gevolg heeft ondergaan;.

      k.

      l.

      2 Een ouder die niet in Nederland woont, heeft slechts aanspraak op een kinderopvangtoeslag indien hij in een
      andere lidstaat of Zwitserland woont en, daartoe gerechtigd, in Nederland of op het continentaal plat tegenwoordige
      arbeid verricht waaruit inkomen uit werk en woning in de zin van de [Wet inkomstenbelasting 2001][ref51] wordt
      genoten of een uitkering ontvangt als bedoeld in het eerste lid, onder c, e, h of i, en gebruik maakt van een in
      één van die onderdelen bedoelde voorziening gericht op arbeidsinschakeling.

      3 Een ouder met een partner heeft slechts aanspraak op een kinderopvangtoeslag, indien de partner

      a. tegenwoordige arbeid verricht waaruit inkomen uit werk en woning in de zin van de
      [Wet inkomstenbelasting 2001][ref52] wordt genoten,

      b. een uitkering ontvangt als bedoeld in het eerste lid, onder c, e, h of i, en gebruik maakt van een in één
      van die onderdelen bedoelde voorziening gericht op arbeidsinschakeling of een daarmee vergelijkbare uitkering
      respectievelijk voorziening, vastgesteld krachtens de wetgeving van een ander land,

      c. een persoon is als bedoeld in het eerste lid, onder f, g, j, k of l,

      d. een persoon is als bedoeld in het eerste lid, onder b.

      4 Voor de toepassing van deze wet wordt met inkomen uit werk en woning als bedoeld in het eerste lid, onderdeel
      a en het derde lid, onderdeel a, gelijkgesteld een daarmee overeenkomend inkomen dat niet tot het verzamelinkomen
      van de ouder of het verzamelinkomen van de partner behoort omdat het niet behoort tot het Nederlands inkomen als
      bedoeld in [hoofdstuk 7 van de Wet inkomstenbelasting 2001][ref53], of is vrijgesteld op grond van bepalingen van
      internationaal recht.

      5 Een ouder of zijn partner die in een berekeningsjaar of in het daaraan voorafgaande berekeningsjaar tegenwoordige
      arbeid heeft verricht als bedoeld in het eerste lid, onderdeel a of b, of derde lid, onderdeel a of d, behoudt
      gedurende drie kalendermaanden, gerekend vanaf de eerste dag na de dag waarop het verrichten van die arbeid
      is beëindigd, dezelfde aanspraak op een kinderopvangtoeslag als voor die beëindiging. Indien de periode van
      drie maanden, bedoeld in de vorige zin, samenvalt met de periode die loopt van 28 dagen voor de datum van de
      vermoedelijke bevalling van de persoon, wiens arbeid is beëindigd, tot 42 dagen na diens bevalling, wordt de
      periode, bedoeld in de vorige zin, verlengd met de periode waarin deze perioden samenvielen.

      6 Het derde lid is niet van toepassing op een ouder met een partner indien de partner:

      a. op grond van [artikel 1.2, eerste lid, onderdeel e, van de Wet inkomstenbelasting 2001][ref54] of
      [artikel 3, tweede lid, onderdeel e, van de Algemene wet inkomensafhankelijke regelingen][ref55] partner is van de
      ouder, en

      b. bloed- of aanverwant is van de ouder in de rechte lijn of in de tweede graad van de zijlijn.

      7 Indien de tegenwoordige arbeid, als bedoeld in het eerste lid, onderdeel a of b, of derde lid, onderdeel a
      of d, van een ouder of zijn partner in een bij algemene maatregel van bestuur te bepalen berekeningsjaar is
      beëindigd, behoudt de ouder in afwijking van het vijfde lid, gedurende zes kalendermaanden dezelfde aanspraak
      op een kinderopvangtoeslag indien sprake van omstandigheden als bedoeld in het vijfde lid. Indien de periode
      van zes maanden, bedoeld in de vorige zin, samenvalt met de periode die loopt van 28 dagen voor de datum van
      de vermoedelijke bevalling van de persoon, wiens arbeid is beëindigd, tot 42 dagen na diens bevalling, wordt de
      periode, bedoeld in de vorige zin, verlengd met de periode waarin deze perioden samenvielen.

      8 Een ouder als bedoeld in het eerste en tweede lid, met een partner, heeft voor een berekeningsjaar
      aanspraak op een kinderopvangtoeslag, indien de partner een verzekerde is die recht op zorg heeft op grond van
      [artikel 3.2.1, eerste lid][ref56], 3.2.1, derde lid, of [3.2.2, van de Wet langdurige zorg][ref57] of op grond van
      [artikel 11.1.1, van de Wet langdurige zorg][ref58] is gelijkgesteld met een verzekerde ten aanzien van wie het CIZ
      heeft vastgesteld dat hij voldoet aan artikel 3.2.1, eerste of derde lid, van de Wet langdurige zorg.

      9 Een ouder die een verzekerde is die recht op zorg heeft op grond van [artikel 3.2.1, eerste lid][ref59],
      3.2.1, derde lid, of [3.2.2, van de Wet langdurige zorg][ref60] of op grond van
      [artikel 11.1.1 van de Wet langdurige zorg ][ref61]is gelijkgesteld met een verzekerde ten aanzien van wie het CIZ
      heeft vastgesteld dat hij voldoet aan artikel 3.2.1, eerste of derde lid, van de Wet langdurige zorg, heeft voor
      een berekeningsjaar aanspraak op een kinderopvangtoeslag, indien de ouder een partner heeft die

      a. tegenwoordige arbeid verricht waaruit inkomen uit werk en woning in de zin van de
      [Wet inkomstenbelasting 2001][ref62] wordt genoten;

      b. een uitkering ontvangt als bedoeld in het eerste lid, onder c, e, h of i, en gebruik maakt van een in één
      van die onderdelen bedoelde voorziening gericht op arbeidsinschakeling of een daarmee vergelijkbare uitkering
      respectievelijk voorziening, vastgesteld krachtens de wetgeving van een ander land; of

      c. een persoon is als bedoeld in het eerste lid, onder b, f, g, j, k of l.

      10 Een ouder jegens wie een bevel tot gevangenneming of gevangenhouding is gegeven, of die is veroordeeld tot een
      vrijheidsbenemende straf of maatregel, heeft, gedurende de periode waarin dit bevel of die straf of maatregel ten
      uitvoer wordt gelegd voor zover die periode meer dan drie maanden bedraagt, voor een berekeningsjaar aanspraak op
      een kinderopvangtoeslag, indien de ouder een partner heeft die

      a. tegenwoordige arbeid verricht waaruit inkomen uit werk en woning in de zin van de
      [Wet inkomstenbelasting 2001][ref63] wordt genoten;

      b. een uitkering ontvangt als bedoeld in het eerste lid, onder c, e, h of i, en gebruik maakt van een in één
      van die onderdelen bedoelde voorziening gericht op arbeidsinschakeling of een daarmee vergelijkbare uitkering
      respectievelijk voorziening, vastgesteld krachtens de wetgeving van een ander land; of

      c. een persoon is als bedoeld in het eerste lid, onder b, f, g, j, k of l.


