  - number: 1.50a
    text: |-
      De houder van een kindercentrum neemt deel aan het overleg tussen het college en de bevoegde
      gezagsorganen van scholen over het onderwijsachterstandenbeleid, bedoeld in de [artikelen 160][ref1] en
      [161 van de Wet op het primair onderwijs][ref2] en werkt mee aan de totstandkoming van de afspraken en de nakoming
      ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel160
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel161
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.50a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '160'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '161'
  - number: 1.50b
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de kwaliteit van voorschoolse
      educatie, indien dit wordt gesubsidieerd door het college. Deze regels hebben in ieder geval betrekking op:

      a. de opleidingseisen en de scholingseisen waaraan de beroepskrachten voorschoolse educatie voldoen;

      b. het aantal beroepskrachten voorschoolse educatie in relatie tot het aantal kinderen;

      c. de groepsgrootte; en

      d. de minimum omvang van de voorschoolse educatie.
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.50b
  - number: '1.51'
    text: |-
      De houder van een gastouderbureau voert een beleid dat ertoe leidt dat de veiligheid en de gezondheid van de
      door de gastouder op te vangen kinderen zoveel mogelijk is gewaarborgd. De houder van het gastouderbureau legt,
      voor zover hierin niet wordt voorzien bij of krachtens andere wet- en regelgeving, in een risico-inventarisatie
      schriftelijk vast welke risico's de opvang van kinderen met zich brengt.
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.51
  - number: 1.51a
    text: |-
      1 De houder van een kindercentrum of een gastouderbureau stelt voor het personeel of de gastouders een meldcode
      vast waarin stapsgewijs wordt aangegeven hoe met signalen van huiselijk geweld of kindermishandeling wordt omgegaan
      en die er redelijkerwijs aan bijdraagt dat zo snel en adequaat mogelijk hulp kan worden geboden.

      2 Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].

      3 Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in [artikel 1.1 van de Jeugdwet][ref2].

      4 De houder bevordert de kennis en het gebruik van de meldcode.

      5 Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.51a
