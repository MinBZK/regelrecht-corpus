  - number: 1.48b
    text: |-
      1 Onze Minister draagt zorg voor de inrichting van een register buitenlandse kinderopvang ten
      behoeve van de rechtszekerheid en de waarborging van de kwaliteit van voorzieningen als bedoeld in
      [artikel 1.48, eerste of tweede lid][ref1], alsmede ten behoeve van het toezicht op en de handhaving van de bij of
      krachtens artikel 1.48 gestelde regels.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent het register buitenlandse
      kinderopvang. Deze regels hebben in ieder geval betrekking op:

      a. de vorm van het register;

      b. de in het register op te nemen gegevens en de duur van de inschrijving;

      c. de vastlegging in, de wijziging van en de verwijdering uit het register van de gegevens;

      d. de verstrekking van gegevens;

      e. de openbaarheid van gegevens;

      f. de verantwoordelijkheden van degenen die gegevens aanleveren ten behoeve van het register.

      3 Voorzieningen als bedoeld in [artikel 1.48, eerste en tweede lid][ref2], worden in het register buitenlandse
      kinderopvang ingeschreven onder een uniek nummer.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.48
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.48
