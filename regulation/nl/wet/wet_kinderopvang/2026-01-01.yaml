  - number: '1.64'
    text: |-
      Onze Minister kan beleidsregels stellen omtrent de door de toezichthouder te hanteren werkwijze voor een onderzoek
      als bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.64
  - number: '1.65'
    text: |-
      1 Het college van de gemeente waarin zich een kindercentrum, een voorziening voor gastouderopvang
      of een gastouderbureau bevindt dat de bij of krachtens de [artikelen 1.47, eerste lid][ref1],
      [1.48d, tweede en derde lid][ref2], [1.49 tot en met 1.59][ref3], [1.60a][ref4] en [1.60c][ref5] gestelde regels
      niet of in onvoldoende mate naleeft, kan de houder een schriftelijke aanwijzing geven.

      2 In een aanwijzing als bedoeld in het eerste lid geeft het college met redenen omkleed aan op welke punten de in
      het eerste lid bedoelde voorschriften niet of in onvoldoende mate worden nageleefd, alsmede de in verband daarmee
      te nemen maatregelen.

      3 De toezichthouder kan een schriftelijk bevel geven aan een kindercentrum, gastouderbureau of voorziening voor
      gastouderopvang indien hij oordeelt:

      a. dat de kwaliteit van de kinderopvang bij een kindercentrum of een voorziening voor gastouderopvang zodanig
      tekortschiet dat het nemen van maatregelen redelijkerwijs geen uitstel kan lijden; of

      b. dat de kwaliteit van een gastouderbureau zodanig tekort schiet, en daardoor het risico bestaat dat ook de
      kwaliteit van de gastouderopvang in gevaar komt, dat het nemen van maatregelen redelijkerwijs geen uitstel kan
      lijden.

      4 Het bevel, bedoeld in het derde lid, heeft een geldigheidsduur van zeven dagen, welke door het college kan worden
      verlengd.

      5 De houder neemt de maatregelen binnen de bij de aanwijzing onderscheidenlijk het bevel gestelde termijn.


