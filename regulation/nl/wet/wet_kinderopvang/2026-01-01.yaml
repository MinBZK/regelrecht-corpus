  - number: 1.60a
    text: |-
      Van ouderparticipatieopvang is sprake, indien:

      a. de kinderopvang uitsluitend verzorgd wordt door ten minste één ouder van elk van de kinderen die in de
      ouderparticipatiecrèche wordt opgevangen;

      b. de kinderopvang niet verzorgd wordt op het woonadres van een ouder;

      c. participerende ouders niet worden bezoldigd voor werkzaamheden bij een ouderparticipatiecrèche;

      d. uitsluitend één of meer ouders van de kinderen die in de ouderparticipatiecrèche worden opgevangen de houder is
      van de ouderparticipatiecrèche; en

      e. uit de statuten, reglement of beleidsplan en administratie van de ouderparticipatiecrèche blijkt dat de
      ouderparticipatiecrèche alle inkomsten ten bate van verantwoorde kinderopvang aanwendt.
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.60a
  - number: 1.60b
    text: |-
      1 Voor de ouderparticipatiecrèche geldt een aanloopperiode van 1 jaar en 3 maanden. De aanloopperiode vangt aan op
      de datum van ingang van de toestemming tot exploitatie van een ouderparticipatiecrèche.

      2 In afwijking van het eerste lid, vangt geen nieuwe aanloopperiode aan, indien de houder van een
      ouderparticipatiecrèche opnieuw toestemming tot exploitatie krijgt, in verband met een wijziging van de locatie van
      de ouderparticipatiecrèche.

      3 In afwijking van [artikel 1.47b, derde lid][ref1], wordt het unieke nummer van een ouderparticipatiecrèche door
      het college, kenbaar gemaakt in het landelijk register kinderopvang, nadat de aanloopperiode, bedoeld in het eerste
      lid, is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.47b
