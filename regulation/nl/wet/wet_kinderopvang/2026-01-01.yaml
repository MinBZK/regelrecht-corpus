  - number: '1.9'
    text: |-
      1 De bedragen, bedoeld in [artikel 1.7, tweede lid][ref1], de mate waarin het toetsingsinkomen van de ouder en,
      indien hij een partner heeft, dat van zijn partner een rol speelt bij de hoogte van de kinderopvangtoeslag, en
      het bedrag, bedoeld in [artikel 1.8, tweede lid][ref2], worden bij het begin van het kalenderjaar bij of krachtens
      algemene maatregel van bestuur gewijzigd aan de hand van een bij algemene maatregel van bestuur aan te wijzen index
      ter zake van lonen of prijzen.

      2 De overeenkomstig het eerste lid aangepaste bedragen treden in de plaats van de bedragen:

      a. bedoeld in de [artikelen 1.7, tweede lid][ref3], en [1.8, tweede lid][ref4], en

      b. die voortvloeien uit de mate waarin het toetsingsinkomen een rol speelt bij de hoogte van de
      kinderopvangtoeslag.


