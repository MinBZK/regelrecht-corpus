  - number: 1.66a
    text: |-
      1 De geschillencommissie verricht haar werkzaamheden op basis van een reglement dat ten minste waarborgt dat:

      a. aan de geschillencommissie een geschil kan worden voorgelegd door een ouder:

      1°. die na de indiening van een klacht bij de houder van een kindercentrum of een gastouderbureau niet tijdig een
      oordeel heeft ontvangen als bedoeld in [artikel 1.57b, tweede lid, onderdeel e][ref1];

      2°. die een klacht in tweede aanleg wil laten beoordelen;

      3°. voor wie behandeling van een klacht overeenkomstig een schriftelijke regeling als bedoeld in
      [artikel 1.57b, eerste lid][ref2], niet gewaarborgd is door het ontbreken van die regeling of doordat de regeling
      niet aan artikel 1.57b, tweede lid, voldoet, of

      4°. van wie in redelijkheid niet kan worden verlangd dat hij onder de gegeven omstandigheden een klacht bij de
      houder van een kindercentrum of van een gastouderbureau indient;

      b. de geschillencommissie bevoegd is over een geschil door middel van een bindend advies een uitspraak te doen;

      c. de geschillencommissie uiterlijk binnen zes maanden na de voorlegging van het geschil uitspraak doet;

      d. de geschillencommissie in afwijking van onderdeel c op kortere termijn na voorlegging van het geschil uitspraak
      doet in gevallen waarin dat, gelet op de aard van het geschil en de daarbij betrokken belangen, is aangewezen;

      e. de geschillencommissie de uitspraken over de aan haar voorgelegde geschillen openbaar maakt, zodanig dat deze
      niet tot natuurlijke- of rechtspersonen herleidbaar zijn, en

      f. de geschillencommissie uit ten minste drie leden, waaronder een voorzitter bestaat, en deze leden niet
      werkzaam zijn voor of bij de houder op wie het geschil betrekking heeft noch anderszins in directe relatie tot de
      betreffende ouder of houder staan.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot
      geschillenbeslechting door de geschillencommissie en het reglement, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.57b
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.57b
