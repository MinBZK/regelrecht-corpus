  - number: 1.61a
    text: |-
      1 Een door Onze Minister aan te wijzen instelling bevordert de kwaliteit en uniformiteit van de uitvoering van de
      taak door het college op grond van deze afdeling.

      2 Bij beschikking van Onze Minister wordt een financiële vergoeding verstrekt aan de instelling, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.61a
  - number: '1.62'
    text: |-
      1 De toezichthouder houdt toezicht op de naleving van [artikel 1.45, derde lid][ref1], en onderzoekt na
      een aanvraag als bedoeld in artikel 1.45, eerste of tweede lid, binnen een bij regeling van Onze Minister te
      stellen termijn of de exploitatie redelijkerwijs zal plaatsvinden in overeenstemming met de bij of krachtens
      de [artikelen 1.48d, tweede en derde lid][ref2], [1.49 tot en met 1.59][ref3], [1.60a][ref4] en [1.60c][ref5]
      gestelde regels.

      2 Onverminderd het eerste lid onderzoekt de toezichthouder in redelijkheid bij ieder geregistreerd kindercentrum
      en geregistreerd gastouderbureau jaarlijks of de exploitatie in overeenstemming is met de bij of krachtens
      de [artikelen 1.47, eerste lid][ref6], [1.48d, tweede en derde lid][ref7], [1.49 tot en met 1.59][ref8],
      [1.60a][ref9] en [1.60c][ref10] gestelde regels.

      3 Onverminderd het eerste lid onderzoekt de toezichthouder in redelijkheid jaarlijks bij ten minste 50% van de
      geregistreerde voorzieningen voor gastouderopvang en ten minste eens per drie jaar bij iedere geregistreerde
      voorziening voor gastouderopvang per gemeente of de exploitatie in overeenstemming is met de bij of krachtens
      de [artikelen 1.47, eerste lid][ref11], [1.48d, tweede en derde lid][ref12], en [1.49 tot en met 1.59][ref13]
      gestelde regels.

      4 Naast het onderzoek, bedoeld in het eerste, tweede en derde lid, kan de toezichthouder als daar aanleiding
      toe is incidenteel onderzoek verrichten naar de naleving door een houder van de bij of krachtens de
      [artikelen 1.47, eerste lid][ref14], [1.48d, tweede en derde lid][ref15], [1.49 tot en met 1.59][ref16],
      [1.60a][ref17], [1.60c][ref18], [1.65][ref19] en [1.66][ref20] gestelde regels.

      5 Indien tijdens een onderzoek als bedoeld in het tweede tot en met het vierde lid tekortkomingen zijn
      geconstateerd kan de toezichthouder nadien een of meer nadere onderzoeken verrichten.

      6 De toezichthouder verricht het onderzoek, bedoeld in het tweede lid, ten minste tweemaal gedurende de
      aanloopperiode, bedoeld in [artikel 1.60b][ref21], indien het een ouderparticipatiecrèche betreft.


