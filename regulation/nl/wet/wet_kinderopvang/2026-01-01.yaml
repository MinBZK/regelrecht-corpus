  - number: '1.61'
    text: |-
      1 Het college ziet toe op de naleving van:

      a. de bij of krachtens de [artikelen 1.45, derde lid][ref1], [1.47, eerste lid][ref2],
      [1.48d, tweede en derde lid][ref3], [1.49 tot en met 1.59][ref4], [1.60a][ref5] en [1.60c][ref6] gestelde regels;

      b. de krachtens [artikel 1.65][ref7] gegeven aanwijzingen en bevelen; en

      c. de krachtens [artikel 1.66, eerste lid][ref8], gegeven bevelen tot sluiting dan wel de krachtens artikel 1.66,
      tweede lid, uitgevaardigde verboden.

      2 Het college wijst de directeur publieke gezondheid van de GGD, bedoeld in artikel 14, derde lid, van de Wet
      publieke gezondheid, aan als toezichthouder.

      3 Voor zover een kindercentrum een voorziening voor gastouderopvang of een gastouderbureau in een woning is
      gevestigd, zijn de toezichthouders ter uitvoering van de taken, bedoeld in het eerste lid, bevoegd zonder
      toestemming van de bewoners in die woning binnen te treden.


