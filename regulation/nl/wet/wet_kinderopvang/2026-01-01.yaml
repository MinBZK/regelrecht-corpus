  - number: 1.66b
    text: |-
      1 Indien de oudercommissie een geschil met de houder over de toepassing en de uitvoering van [artikel 1.60][ref1]
      door de houder aan de geschillencommissie voorlegt, toetst de geschillencommissie uitsluitend of de houder bij
      afweging van de betrokken belangen in redelijkheid heeft gehandeld.

      2 Indien de geschillencommissie de oudercommissie in het gelijk stelt, kan zij in haar uitspraak tevens bepalen
      dat:

      a. de houder zijn besluit geheel of ten dele intrekt;

      b. een of meer gevolgen van dat besluit ongedaan worden gemaakt.

      3 Indien de houder gebruik maakt van de in [artikel 1.58, tweede en derde lid][ref2], geboden alternatieve vorm van
      ouderbetrokkenheid kan, indien deze vorm zich daarvoor leent, bij algemene maatregel van bestuur worden bepaald,
      dat deze vorm voor de toepassing van het eerste en tweede lid en [artikel 1.57c][ref3] gelijk wordt gesteld met een
      oudercommissie. Hieraan kunnen voorwaarden worden verbonden.

      4 Indien gebruik is gemaakt van de in [artikel 1.58, tweede en derde lid][ref4], geboden alternatieve vorm
      van ouderbetrokkenheid, maar deze vorm zich niet leent voor de toepassing van het eerste en tweede lid en
      [artikel 1.57c][ref5], kan in plaats daarvan een ouder een geschil over de toepassing en uitvoering van
      [artikel 1.60][ref6] aan de geschillencommissie voorleggen en zijn het eerste en tweede lid en artikel 1.57c zoveel
      mogelijk van overeenkomstige toepassing.


