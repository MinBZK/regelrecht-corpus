  - number: '1.45'
    text: |-
      1 Degene die voornemens is een kindercentrum of gastouderbureau in exploitatie te nemen, doet daarvoor een aanvraag
      bij het college.

      2 De houder van een gastouderbureau dient een aanvraag in voor degene die door zijn tussenkomst voornemens is
      gastouderopvang te bieden. De aanvraag, bedoeld in de eerste volzin, wordt namens de gastouder of voorgenomen
      gastouder gedaan bij het college.

      3 Een kindercentrum, een gastouderbureau of een voorziening voor gastouderopvang wordt niet in exploitatie
      genomen voordat een onderzoek als bedoeld in [artikel 1.62, eerste lid][ref1], heeft plaatsgevonden, waaruit
      blijkt dat de exploitatie redelijkerwijs zal plaatsvinden in overeenstemming met de bij of krachtens de
      [artikelen 1.48d, tweede en derde lid][ref2], [1.49 tot en met 1.59][ref3], [1.60a][ref4] en [1.60c][ref5] gestelde
      regels.

      4 Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven over de gegevens die worden
      verstrekt bij de aanvraag, bedoeld in het eerste en tweede lid, en over de wijze van verstrekking van deze
      gegevens, waaronder voorschriften over de verstrekking van het burgerservicenummer.

      5 In de gevallen waarin het burgerservicenummer dient te worden verstrekt, is degene ten behoeve van wie een
      aanvraag als bedoeld in het tweede lid wordt gedaan gehouden dat nummer te verstrekken aan degenen, bedoeld in het
      tweede lid.

      6 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref6] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref7] niet van toepassing op een aanvraag als bedoeld in het
      eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.62
