  - number: '1.66'
    text: |-
      1 Het college kan de houder verbieden de exploitatie van een kindercentrum, een voorziening voor gastouderopvang of
      een gastouderbureau voort te zetten, zolang hij een bevel of aanwijzing niet opvolgt en het opleggen van een last
      onder bestuursdwang niet mogelijk is.

      2 Indien uit een onderzoek als bedoeld in [artikel 1.62][ref1] of anderszins blijkt dat het kindercentrum, de
      voorziening voor gastouderopvang of het gastouderbureau naar verwachting niet dan wel niet langer aan de bij
      of krachtens de [artikelen 1.48d, tweede en derde lid][ref2], [1.49 tot en met 1.59][ref3], [1.60a][ref4] en
      [1.60c][ref5] gegeven voorschriften zal voldoen, kan het college zolang die situatie zich voordoet, de houder
      verbieden dat kindercentrum, die voorziening voor gastouderopvang of dat gastouderbureau in exploitatie te nemen of
      te houden.


