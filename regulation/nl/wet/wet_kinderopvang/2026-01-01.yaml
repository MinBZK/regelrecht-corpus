  - number: 1.5a
    text: |-
      Onverminderd de [artikelen 1.5][ref1] en [1.6][ref2] heeft een ouder die tijdelijk bescherming geniet als bedoeld
      in [artikel 1 van de Vreemdelingenwet 2000][ref3], omdat hij onder de reikwijdte valt van het Uitvoeringsbesluit
      (EU) 2022/382 van de Raad van 4 maart 2022 tot vaststelling van het bestaan van een massale toestroom van
      ontheemden uit Oekraïne in de zin van artikel 5 van [Richtlijn 2001/55/EG](32001L0055), en tot invoering van
      tijdelijke bescherming naar aanleiding daarvan (PbEU 2022, L 71/1) of een verlenging van dat besluit, aanspraak
      op kinderopvangtoeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.6
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.5a
