  - number: 1.48a
    text: |-
      1 Onze Minister kan besluiten de gegevens van een voorziening als bedoeld in
      [artikel 1.48, eerste of tweede lid][ref1], zonder een daaraan voorafgaand verzoek in het register buitenlandse
      kinderopvang te wijzigen. Indien hij hiertoe besluit verwerkt hij dit in het register.

      2 Onze Minister kan besluiten een voorziening als bedoeld in [artikel 1.48, eerste of tweede lid][ref2], zonder een
      daaraan voorafgaand verzoek uit het register buitenlandse kinderopvang te verwijderen. Indien hij hiertoe besluit
      verwerkt hij dit in het register.

      3 Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van het eerste en tweede lid nadere regels
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.48
