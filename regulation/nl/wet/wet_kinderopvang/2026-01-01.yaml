      onderscheidenlijk een bevel als bedoeld in [artikel 1.65][ref8] of een vordering tot medewerking als bedoeld in
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref9] niet nakomt dan wel handelt in strijd met een
      verbod krachtens [artikel 1.66][ref10], een bestuurlijke boete opleggen van ten hoogste € 45 000.

      2 In afwijking van het eerste lid kan de overtreding niet met een bestuurlijke boete worden afgedaan, indien
      de overtreding opzettelijk of roekeloos geschiedt en een direct gevaar voor de gezondheid of de veiligheid van
