  - number: '1.81'
    text: |-
      1 Indien het college de houder in het kader van het toezicht op de naleving van de verplichtingen op basis van
      dit hoofdstuk:

      a. een sanctie als bedoeld in [hoofdstuk 5 van de Algemene wet bestuursrecht][ref1] oplegt;

      b. een aanwijzing als bedoeld in [artikel 1.65][ref2] geeft,

      c. een verbod tot exploitatie als bedoeld in [artikel 1.66][ref3] oplegt; of

      d. een bestuurlijke boete als bedoeld in [artikel 1.72][ref4] oplegt;

      wordt daarover een vermelding opgenomen in het landelijk register kinderopvang zodra dit besluit onherroepelijk is.

      2 De vermelding, bedoeld in het eerste lid, betreft het karakter van de sanctie of van de maatregel, alsmede een
      beschrijving van de verplichting die niet is nagekomen.

      3 Op verzoek verstrekt het college een afschrift van het besluit, bedoeld in het eerste lid, waarin de tot
      natuurlijke personen herleidbare gegevens, geanonimiseerd worden, met uitzondering van het woonadres van de houder
      wanneer opvang plaats vindt op dat woonadres.

      4 Bij algemene maatregel van bestuur worden nadere regels gesteld ter uitvoering van dit artikel.


