  - number: 1.57d
    text: |-
      Een ieder die betrokken is bij de uitvoering van de [artikelen 1.57b][ref1] en [1.57c][ref2] en daarbij de
      beschikking krijgt over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden,
      en voor wie niet reeds uit hoofde van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een
      geheimhoudingsplicht geldt, is verplicht tot geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift
      hem tot bekendmaking verplicht of uit zijn taak bij de uitvoering van dit hoofdstuk de noodzaak tot bekendmaking
      voortvloeit.


