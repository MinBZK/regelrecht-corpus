  - number: 1.57b
    text: |-
      1 De houder van een kindercentrum of van een gastouderbureau treft ten behoeve van ouders een regeling voor de
      afhandeling van klachten over:

      a. een gedraging jegens een ouder of een kind van de houder of van voor de houder of door zijn tussenkomst werkzame
      personen, en

      b. de overeenkomst tussen de houder en de ouder.

      2 De regeling, bedoeld in het eerste lid, wordt door de houder van een kindercentrum of gastouderbureau
      schriftelijk vastgelegd en voorziet er in ieder geval in dat:

      a. de ouder zijn klacht schriftelijk bij de houder indient;

      b. de houder de klacht zorgvuldig onderzoekt;

      c. de houder de ouder zoveel mogelijk op de hoogte houdt van de voortgang van de behandeling van de klacht;

      d. de klacht, rekening houdende met de aard ervan, zo spoedig mogelijk, maar uiterlijk zes weken na indiening bij
      de houder, wordt afgehandeld;

      e. de houder de ouder een schriftelijk en met redenen omkleed oordeel op de klacht verstrekt, en

      f. er in het oordeel een concrete termijn wordt gesteld waarbinnen eventuele maatregelen naar aanleiding van de
      klacht zullen zijn gerealiseerd.

      3 De houder van een kindercentrum of van een gastouderbureau brengt de regeling, bedoeld in het eerste lid, alsmede
      wijzigingen daarvan, op passende wijze onder de aandacht van de ouders en handelt overeenkomstig deze regeling.

      4 De houder van een kindercentrum of van een gastouderbureau draagt er zorg voor dat over elk kalenderjaar in het
      eerstvolgende kalenderjaar een verslag wordt opgesteld waarin ten minste wordt opgenomen:

      a. een beknopte beschrijving van de regeling, bedoeld in het eerste lid;

      b. de wijze waarop hij die regeling onder de aandacht van de ouders heeft gebracht;

      c. het aantal en de aard van de door hem behandelde klachten per locatie;

      d. de strekking van de oordelen en de aard van de getroffen maatregelen, bedoeld in het tweede lid, onderdelen e en
      f, per locatie, en

      e. het aantal en de aard van de door de geschillencommissie, bedoeld in [artikel 1.57c, eerste lid][ref1],
      behandelde geschillen.

      5 Het verslag, bedoeld in het vierde lid, wordt in zodanige vorm opgesteld dat de oordelen niet tot natuurlijke
      personen herleidbaar zijn, tenzij het de houder betreft.

      6 In het verslag, bedoeld in het vierde lid, worden niet opgenomen:

      a. het woonadres van een gastouder, voor zover op dat adres geen voorziening voor gastouderopvang is gevestigd, en

      b. het woonadres van de houder van een kindercentrum of van een gastouderbureau, wanneer die houder een natuurlijk
      persoon is en voor zover het kindercentrum of gastouderbureau niet op dit adres gevestigd is.

      7 Bij regeling van Onze Minister wordt bepaald vanaf welk kalenderjaar het verslag, bedoeld in het vierde lid,
      wordt opgesteld.

      8 De houder van een kindercentrum of van een gastouderbureau zendt het verslag, bedoeld in het vierde lid, voor 1
      juni van het kalenderjaar volgend op het kalenderjaar waarop het verslag betrekking heeft aan de toezichthouder,
      genoemd in [artikel 1.61, eerste lid][ref2], en brengt het verslag gelijktijdig op passende wijze onder de aandacht
      van de ouders.

      9 In afwijking van het vierde lid behoeft geen verslag te worden opgesteld indien er in het betreffende
      kalenderjaar geen klachten bij de houder zijn ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.57c
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.61
