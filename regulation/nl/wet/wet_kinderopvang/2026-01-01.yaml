  - number: '1.4'
    text: |-
      1 Met het oog op het toekennen van een kinderopvangtoeslag verstrekt de ouder, bedoeld
      in [artikel 1.5, eerste lid][ref1], aan de Dienst Toeslagen het unieke nummer, bedoeld in
      [artikel 1.47b, derde lid][ref2].

      2 Bij ministeriële regeling kunnen voorschriften worden gegeven met betrekking tot de verstrekking.


