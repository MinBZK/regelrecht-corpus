  - number: '1.7'
    text: |-
      1 De hoogte van de kinderopvangtoeslag is afhankelijk van:

      a. de draagkracht, en

      b. de kosten van kinderopvang per kind die worden bepaald door:

      1º. het aantal uren kinderopvang per kind in het berekeningsjaar,

      2º. de voor die kinderopvang te betalen prijs, met inachtneming van het bedrag, bedoeld in het tweede lid, en

      3º. de soort kinderopvang.

      2 De uurprijs die bij de hoogte van de kinderopvangtoeslag, bedoeld in het eerste lid, in aanmerking wordt genomen
      gaat een bij algemene maatregel van bestuur vast te stellen bedrag niet te boven. Dat bedrag kan per opvangsoort
      verschillend worden vastgesteld.

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de redelijke verhouding tussen het
      aantal uren dat de ouder en zijn partner arbeid verrichten, gebruik maken van een voorziening die gericht is op
      arbeidsinschakeling, of scholing, een opleiding of een cursus volgen, alsmede de in verband daarmee benodigde
      reistijd, en het aantal uren kinderopvang waarvoor kinderopvangtoeslag kan worden aangevraagd.

      4 Het aantal uren kinderopvang dat in aanmerking wordt genomen bij de hoogte van de kinderopvangtoeslag, bedoeld in
      het eerste lid, gaat een bij algemene maatregel van bestuur vast te stellen maximum, dat per soort kinderopvang of
      per leeftijdsgroep verschillend kan worden vastgesteld, niet te boven.
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.7
  - number: '1.8'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de hoogte en de
      berekeningswijze van de kinderopvangtoeslag, waarbij tabellen worden vastgesteld waaruit de relatie tussen de
      kosten van kinderopvang en de kinderopvangtoeslag kan worden afgelezen en waarbij tevens wordt bepaald in welke
      gevallen de ouder aanspraak heeft op een kinderopvangtoeslag die 33,3 procent of minder bedraagt van de kosten van
      kinderopvang, bedoeld in [artikel 1.7, eerste lid][ref1].

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de hoogte van het bedrag dat als vaste eigen
      bijdrage van de ouder in mindering wordt gebracht op de kinderopvangtoeslag. Daarbij kunnen het toetsingsinkomen
      van de ouder en zijn partner, de aanwezigheid van een partner en het aantal kinderen in aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.7
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.8
