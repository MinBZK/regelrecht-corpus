  - number: '1.11'
    text: |-
      De kinderopvangtoeslag blijft buiten beschouwing bij de verlening van andere op het inkomen of vermogen afgestemde
      publiekrechtelijke uitkeringen en verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.11
  - number: '1.12'
    text: |-
      1 Het college stelt op aanvraag van de ouder vast of hij of zijn partner dan wel het kind van de ouder een
      geïndiceerde persoon is als bedoeld in [artikel 1.6, eerste lid, onderdeel k of l][ref1], en in welke mate uit dien
      hoofde, voor zover andere voorzieningen geen passender oplossing kunnen bieden, kinderopvang in de zin van deze wet
      noodzakelijk is.

      2 Een aanvraag als bedoeld in het eerste lid wordt ingediend bij het college van de gemeente
      waar de ouder zijn woonplaats heeft als bedoeld in de [artikelen 10, eerste lid][ref2], en
      [11 van Boek 1 van het Burgerlijk Wetboek][ref3].

      3 Alvorens te besluiten, wint het college ten behoeve van de vaststelling van de noodzakelijkheid van
      kinderopvang als bedoeld in het eerste lid advies in van een onafhankelijke organisatie die beschikt over adequate
      deskundigheid.

      4 Het besluit van het college vermeldt de geldigheidsduur van de indicatie.

      5 Het college kan periodiek herindicatie verrichten van personen als bedoeld in het eerste lid. De herindicatie
      vindt plaats overeenkomstig het derde lid.

      6 Bij of krachtens algemene maatregel van bestuur kunnen:

      a. nadere regels worden gesteld met betrekking tot de krachtens dit artikel aan de gemeente opgedragen taken en de
      wijze van uitoefening daarvan;

      b. organisaties als bedoeld in het derde lid worden aangewezen, waarbij tevens regels kunnen worden gesteld omtrent
      de door die organisaties te hanteren werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.6
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel11
