  - number: 1.51b
    text: |-
      1 Indien de houder van een kindercentrum of van een gastouderbureau op enigerlei wijze bekend is geworden dat:

      a. een bij zijn onderneming werkzaam persoon; of

      b. een gastouder die door tussenkomst van een gastouderbureau gastouderopvang biedt of een van de andere personen
      van 18 jaar of ouder als bedoeld in [artikel 1.56b, derde lid][ref1];

      zich mogelijk schuldig maakt of heeft gemaakt aan een seksueel misdrijf als bedoeld
      in [Titel XIV van het Wetboek van Strafrecht][ref2] of mishandeling als bedoeld in
      [Titel XX van het Wetboek van Strafrecht][ref3] jegens een kind van een ouder die gebruik maakt van de door hem
      geboden kinderopvang, treedt de houder onverwijld in overleg met een door Onze Minister aan te wijzen deskundige.

      2 Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat sprake is van een redelijk
      vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf als bedoeld in het eerste
      lid, doet de houder van een kindercentrum of gastouderbureau onverwijld aangifte bij een opsporingsambtenaar als
      bedoeld in [artikel 127][ref4] juncto [artikel 141 van het Wetboek van Strafvordering][ref5], en stelt de houder de
      deskundige, bedoeld in het eerste lid, hiervan onverwijld in kennis.

      3 Indien een bij de onderneming van de houder van een kindercentrum of gastouderbureau werkzaam persoon op
      enigerlei wijze bekend is geworden dat een ander ten behoeve van de onderneming van die houder werkzaam persoon,
      een gastouder of een persoon van 18 jaar of ouder als bedoeld in [artikel 1.56b, derde lid][ref6], zich mogelijk
      schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een kind van een ouder die
      gebruik maakt van de door de houder van een kindercentrum of gastouderbureau geboden kinderopvang, stelt hij de
      houder van dat kindercentrum of van dat gastouderbureau daarvan onverwijld in kennis.

      4 Indien toepassing van het derde lid ertoe zou leiden dat degene die van het vermoeden op de hoogte moet worden
      gesteld dezelfde persoon is als degene die zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als
      bedoeld in het eerste lid, is [artikel 1.51c, eerste en tweede lid][ref7], van overeenkomstige toepassing.

      5 De houder van een kindercentrum of van een gastouderbureau bevordert de kennis en het gebruik van de handelwijze,
      bedoeld in dit artikel.


