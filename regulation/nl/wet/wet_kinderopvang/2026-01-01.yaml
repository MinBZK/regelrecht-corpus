  - number: '1.52'
    text: |-
      1 Kinderopvang geschiedt op basis van een schriftelijke overeenkomst tussen de houder van een kindercentrum of van
      een gastouderbureau en de ouder.

      2 Bij regeling van Onze Minister kan worden bepaald dat de ouder niet kan worden verplicht tot afname en betaling
      van meer uren per dag of dagdeel dan een in die regeling te bepalen maximum.

      3 Het aantal uren, bedoeld in het tweede lid, kan per soort kinderopvang verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.52
  - number: '1.53'
    text: |-
      Bij regeling van Onze Minister kunnen ten behoeve van een goede uitvoering van dit hoofdstuk regels worden gesteld
      met betrekking tot de administratie van gegevens bij een kindercentrum en de informatieverstrekking door een
      kindercentrum aan ouders.
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.53
  - number: '1.54'
    text: |-
      1 De houder van een kindercentrum informeert de ouders wier kinderen in het kindercentrum worden opgevangen en een
      ieder die daarom verzoekt over het te voeren beleid als bedoeld in deze paragraaf.

      2 De houder van een kindercentrum informeert over een inspectierapport als bedoeld in
      [artikel 1.63, eerste lid][ref1], inzake zijn kindercentrum:

      a. de ouders van de kinderen die in dat kindercentrum worden opgevangen, en

      b. de personen werkzaam bij een onderneming waarmee de houder dat kindercentrum exploiteert.

      3 Het informeren als bedoeld in het tweede lid vindt plaats doordat de houder het inspectierapport zo spoedig
      mogelijk na ontvangst op zijn website plaatst zodanig dat het rapport voor de ouders en de personen werkzaam bij
      de onderneming waarmee de houder het kindercentrum exploiteert gemakkelijk vindbaar is dan wel, indien de houder
      geen eigen website heeft, ter inzage legt op een voor de ouders en de personen werkzaam bij de onderneming,
      toegankelijke plaats.

      4 Bij regeling van Onze Minister kunnen ten behoeve van een goede uitvoering van dit hoofdstuk regels worden
      gesteld met betrekking tot de informatie die de houder van een kindercentrum verplicht is beschikbaar te stellen
      aan een ouder.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.63
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.54
