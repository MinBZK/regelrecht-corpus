  - number: 1.60c
    text: |-
      1 In [artikel 1.50, eerste en tweede lid][ref1], [artikel 1.50b][ref2], [1.51a, eerste lid][ref3],
      [1.51b eerste en derde lid][ref4] en [1.51c, eerste lid][ref5] en de bij of krachtens die artikelen gestelde regels
      wordt voor de toepassing op een ouderparticipatiecrèche voor beroepskracht, personeel of werkzame persoon gelezen:
      participerende ouder.

      2 [Artikel 1.50, tweede lid, onderdelen b en f][ref6], en [artikel 1.58, vijfde lid][ref7], zijn niet van
      toepassing op een ouderparticipatiecrèche.


