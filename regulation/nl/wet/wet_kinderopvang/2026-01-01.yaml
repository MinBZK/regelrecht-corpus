      1 Een gastouder is per voorziening voor gastouderopvang aangesloten bij ten hoogste twee gastouderbureaus.

      2 In afwijking van het eerste lid kan een gastouder tijdelijk per voorziening voor gastouderopvang aangesloten zijn
      bij drie gastouderbureaus.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de tijdelijke uitbreiding
      naar drie gastouderbureaus.
