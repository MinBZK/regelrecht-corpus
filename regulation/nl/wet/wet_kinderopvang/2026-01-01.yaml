  - number: '1.46'
    text: |-
      1 Uiterlijk tien weken na de ontvangst van de aanvraag, bedoeld in [artikel 1.45, eerste of tweede lid][ref1],
      besluit het college op de aanvraag. Indien uit het onderzoek, bedoeld in [artikel 1.62, eerste lid][ref2],
      is gebleken dat de exploitatie redelijkerwijs zal plaatsvinden in overeenstemming met de bij of krachtens de
      [artikelen 1.48d, tweede en derde lid][ref3], [1.49 tot en met 1.59][ref4], [1.60a][ref5] en [1.60c][ref6]
      gestelde regels en anderszins niet is gebleken van feiten en omstandigheden die op het tegendeel duiden, wordt
      positief op de aanvraag beslist.

      2 In de beschikking waarin positief op de aanvraag, bedoeld in het eerste lid, wordt beslist, bepaalt het college
      de datum van ingang van de toestemming tot exploitatie. Deze datum ligt niet voor de datum van de bekendmaking
      van de beschikking. Vervolgens draagt het college onverwijld zorg voor inschrijving van het kindercentrum, het
      gastouderbureau of de voorziening voor gastouderopvang in het landelijk register kinderopvang waarbij de datum van
      ingang van de toestemming tot exploitatie als startdatum van de registratie wordt opgenomen.

      3 Bij een inschrijving als bedoeld in het tweede lid, doet het college opgave van de gegevens die ingevolge
      [artikel 1.45, vierde lid][ref7], zijn verstrekt.

      4 Indien in een kindercentrum voorschoolse educatie wordt aangeboden, neemt het college dit op in het landelijk
      register kinderopvang.

      5 Indien uit een onderzoek als bedoeld in [artikel 1.62, tweede tot en met vijfde lid][ref8], of
      anderszins blijkt dat de exploitatie niet langer in overeenstemming is met de bij of krachtens de
      [artikelen 1.47, eerste lid][ref9], [1.49 tot en met 1.59][ref10], [1.60a][ref11] en [1.60c][ref12] gestelde
      regels, dan wel indien blijkt dat de houder niet langer het kindercentrum, het gastouderbureau of de voorziening
      voor gastouderopvang exploiteert en er geen wijziging van de houder van dat kindercentrum, gastouderbureau of die
      voorziening voor gastouderopvang heeft plaatsgevonden, kan het college besluiten de beschikking, bedoeld in het
      tweede lid, in te trekken.

      6 In het besluit, waarbij een beschikking als bedoeld in het tweede lid, wordt ingetrokken, bepaalt het college
      met ingang van welke datum er geen toestemming meer is voor de exploitatie. Deze datum ligt niet voor de datum
      van de bekendmaking van de beschikking. Vervolgens draagt het college onverwijld zorg voor verwijdering van het
      kindercentrum, het gastouderbureau of de voorziening voor gastouderopvang uit het landelijk register kinderopvang,
      waarbij ook de einddatum van de toestemming tot exploitatie wordt opgenomen.

      7 Indien de aanvraag tot exploitatie van een kindercentrum, gastouderbureau of voorziening voor gastouderopvang
      heeft plaatsgevonden voor 1 januari 2010 door middel van een melding bij het college volstaat het college, in
      afwijking van het vijfde en zesde lid, met een beschikking waarin wordt bepaald met ingang van welke datum er
      geen toestemming meer is voor de exploitatie en verwijdering van het kindercentrum, het gastouderbureau of de
      voorziening voor gastouderopvang uit het landelijk register kinderopvang.

      8 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de verwijdering van het
      kindercentrum, het gastouderbureau of de voorziening voor gastouderopvang uit het landelijk register kinderopvang.


