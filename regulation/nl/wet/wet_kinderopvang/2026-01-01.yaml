  - number: 1.57c
    text: |-
      1 De houder van een kindercentrum of van een gastouderbureau is aangesloten bij een door de Minister van Veiligheid
      en Justitie erkende geschillencommissie voor het behandelen van geschillen:

      a. tussen de houder van een kindercentrum of van een gastouderbureau en een ouder over een onderwerp als bedoeld in
      [artikel 1.57b, eerste lid][ref1];

      b. tussen de houder van een kindercentrum of van een gastouderbureau en de oudercommissie over de toepassing en
      uitvoering van [artikel 1.60][ref2] door de houder.

      2 De houder van een kindercentrum of van een gastouderbureau brengt de mogelijkheid om geschillen aan de
      geschillencommissie voor te leggen op passende wijze onder de aandacht van de ouders.

      3 De geschillencommissie, bedoeld in het eerste lid, informeert het college dat een houder van een kindercentrum of
      van een gastouderbureau is aangesloten of niet meer is aangesloten bij de geschillencommissie. Het college verwerkt
      de gegevens, bedoeld in de eerste zin, in het landelijk register kinderopvang.

      4 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de voor de houder
      van een kindercentrum of van een gastouderbureau en de ouder en de oudercommissie verbonden verplichtingen aan
      de geschillenbeslechting.

      5 Bij beschikking van Onze Minister kan een financiële vergoeding worden verstrekt aan de geschillencommissie,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.57b
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.60
