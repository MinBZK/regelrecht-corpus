  - number: 3.2b
    text: |-
      [Artikel 1.6, tweede en derde lid][ref1], zoals dat luidde voor het tijdstip van inwerkingtreding van artikel
      I, onderdelen C en D, van de Wet van 2 december 2020 tot wijziging van de Wet Kinderopvang in verband met enkele
      wijzigingen met betrekking tot het recht op kinderopvangtoeslag (Stb. 2020, 518) blijft tot een jaar na dat
      tijdstip van toepassing, indien de ouder:

      a. op de dag voor dat tijdstip aanspraak had op kinderopvangtoeslag, en

      b. hij of zijn partner op dat tijdstip arbeid verrichtte, niet zijnde tegenwoordige arbeid waaruit inkomen uit
      werk en woning in de zin van de [Wet inkomstenbelasting 2001][ref2] wordt genoten dan wel inkomen dat hiermee
      gelijkgesteld wordt op grond van [artikel 1.6, vierde lid][ref3].


