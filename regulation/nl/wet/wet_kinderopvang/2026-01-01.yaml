  - number: 3.2c
    text: |-
      In afwijking van [artikel 1.3, tweede lid, aanhef en onderdeel b][ref1], heeft een ouder die als gevolg van
      de [Wet van 20 november 2024][ref2] tot wijziging van de Wet kinderopvang om aanspraak op kinderopvangtoeslag
      mogelijk te maken voor Oekraïense ontheemden gelet op het Uitvoeringsbesluit van de Raad tot vaststelling van
      het bestaan van een massale toestroom van ontheemden uit Oekraïne in de zin van artikel 5 van [Richtlijn 2001/55/
      EG](32001L0055) van de Raad van 20 juli 2001, en ouders met een partner buiten de Europese Unie, de Europese
      Economische Ruimte of Zwitserland ook aanspraak op kinderopvangtoeslag te geven (Stb. 2024, 390) aanspraak op
      kinderopvangtoeslag, over de periode van 4 maart 2022 tot en met de inwerkingtredingsdatum van die wet aanspraak op
      kinderopvangtoeslag, indien de aanvraag om kinderopvangtoeslag uiterlijk op de laatste dag van de kalendermaand die
      drie kalendermaanden is gelegen na de inwerkingtredingsdatum van die wet is ingediend.


