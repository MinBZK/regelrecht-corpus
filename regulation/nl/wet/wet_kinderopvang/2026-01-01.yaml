  - number: '1.60'
    text: |-
      1 De houder van een kindercentrum of van een gastouderbureau stelt de oudercommissie in ieder geval in de
      gelegenheid advies uit te brengen over elk voorgenomen besluit met betrekking tot:

      a. de wijze waarop uitvoering wordt gegeven aan [artikel 1.50, eerste lid][ref1], in het bijzonder het pedagogisch
      beleid dat wordt gevoerd, respectievelijk [artikel 1.56, eerste lid][ref2], in het bijzonder het beleid dat wordt
      gevoerd inzake het door de gastouder te voeren pedagogisch beleid;

      b. voedingsaangelegenheden van algemene aard en het algemene beleid op het gebied van opvoeding, veiligheid of
      gezondheid;

      c. openingstijden;

      d. het beleid met betrekking tot het aanbieden van voorschoolse educatie;

      e. de vaststelling of wijziging van een regeling inzake de behandeling van klachten als bedoeld in
      [artikel 1.57b, eerste lid][ref3];

      f. wijziging van de prijs van kinderopvang.

      2 Van een advies als bedoeld in het eerste lid kan de houder van het kindercentrum of van het gastouderbureau
      slechts afwijken indien hij schriftelijk en gemotiveerd aangeeft dat het belang van de kinderopvang zich tegen het
      advies verzet.

      3 De oudercommissie is bevoegd de houder van een kindercentrum of van een gastouderbureau ook ongevraagd te
      adviseren over de onderwerpen, genoemd in het eerste lid.

      4 De houder van een kindercentrum of van een gastouderbureau voert ten minste eenmaal per 12 maanden overleg met
      de oudercommissie over de invulling van het nog te voeren pedagogisch beleid en over het al gevoerde pedagogisch
      beleid, bedoeld in [artikel 1.50, eerste lid][ref4], respectievelijk [artikel 1.56, eerste lid][ref5], in
      verbinding met [artikel 1.56b, eerste lid][ref6].

      5 De houder van een kindercentrum of van een gastouderbureau verstrekt de oudercommissie tijdig en desgevraagd
      schriftelijk alle informatie die deze voor de vervulling van haar taak redelijkerwijs nodig heeft.

      6 Na vaststelling door de toezichthouder van het inspectierapport, bedoeld in [artikel 1.63, eerste lid][ref7],
      bespreekt de houder van een kindercentrum of van een gastouderbureau dit rapport met de oudercommissie.

      7 De houder van een kindercentrum of van een gastouderbureau brengt de mogelijkheid om geschillen aan de
      geschillencommissie voor te leggen op passende wijze onder de aandacht van de oudercommissie.


