  - number: '1.63'
    text: |-
      1 De toezichthouder legt zijn oordeel naar aanleiding van een onderzoek als bedoeld in
      [artikel 1.62, eerste tot en met vijfde lid][ref1] vast in een inspectierapport.

      2 Indien de toezichthouder oordeelt dat door de houder de bij of krachtens de [artikelen 1.47, eerste lid][ref2],
      [1.48d, tweede en derde lid][ref3], [1.49 tot en met 1.59][ref4], [1.60a][ref5] en [1.60c][ref6] gestelde regels
      niet zijn of zullen worden nageleefd, vermeldt hij dat in het rapport.

      3 Alvorens het rapport vast te stellen, stelt de toezichthouder de houder in de gelegenheid van het ontwerprapport
      kennis te nemen en daarover zijn zienswijze kenbaar te maken. De toezichthouder vermeldt de zienswijze van de
      houder in een bijlage bij het rapport. Dit lid is niet van toepassing op een inspectierapport dat wordt opgesteld
      naar aanleiding van een onderzoek als bedoeld in [artikel 1.62, vijfde lid][ref7].

      4 De toezichthouder zendt het inspectierapport, bedoeld in het eerste lid, onverwijld aan:

      a. de houder van een kindercentrum,

      b. de houder van een gastouderbureau en de gastouder indien het rapport betrekking heeft op de gastouder, of

      c. de houder van een gastouderbureau, indien het rapport betrekking heeft op een gastouderbureau.

      5 De toezichthouder maakt het inspectierapport uiterlijk drie weken na de vaststelling daarvan openbaar.

      6 De toezichthouder zendt een afschrift van het inspectierapport naar aanleiding van een onderzoek bij een
      kindercentrum waar voorschoolse educatie wordt aangeboden aan het college en aan de Inspectie van het onderwijs,
      indien met betrekking tot een of meer van de basisvoorwaarden voor kwaliteit van voorschoolse educatie, bedoeld in
      [artikel 1.61, eerste lid][ref8], tekortkomingen zijn geconstateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.62
