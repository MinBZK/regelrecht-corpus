  - number: 1.6b
    text: |-
      [Artikel 1.6, tweede lid][ref1], is van overeenkomstige toepassing op een ouder die valt binnen de personele
      werkingssfeer, bedoeld in de artikelen 30 of 32 van het Akkoord inzake de terugtrekking van het Verenigd Koninkrijk
      van Groot-Brittannië en Noord-Ierland uit de Europese Unie en de Europese Gemeenschap voor Atoomenergie, 2019/C 384
      I/01 van 12 november 2019.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.6
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.6b
