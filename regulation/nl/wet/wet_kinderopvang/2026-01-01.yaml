  - number: 1.51c
    text: |-
      1 Indien:

      a. een bij de onderneming van de houder van een kindercentrum of gastouderbureau werkzaam persoon; of

      b. een gastouder die door tussenkomst van een gastouderbureau gastouderopvang biedt;

      op enigerlei wijze bekend is geworden dat de natuurlijke persoon die tevens houder is van een
      kindercentrum of van een gastouderbureau zich mogelijk schuldig maakt of heeft gemaakt aan een seksueel
      misdrijf als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] of mishandeling als bedoeld in
      [Titel XX van het Wetboek van Strafrecht][ref2] jegens een kind van een ouder die gebruik maakt van de door die
      houder geboden kinderopvang kan degene als bedoeld in onderdeel a of b in overleg treden met een deskundige als
      bedoeld in [artikel 1.51b, eerste lid][ref3].

      2 Indien moet worden geconcludeerd dat sprake is van een redelijk vermoeden dat de houder zich
      schuldig heeft gemaakt aan een misdrijf als bedoeld in het eerste lid, doet de persoon die werkzaam
      is bij de onderneming van de houder van een kindercentrum of van een gastouderbureau, of de
      gastouder onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref4] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref5].

      3 De houder van een kindercentrum of van een gastouderbureau bevordert de kennis en het gebruik van de handelwijze,
      bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
