  - number: 1.48d
    text: |-
      1 Onze Minister verwerkt gegevens in het personenregister kinderopvang om te waarborgen dat alle personen die op
      grond van deze wet over een verklaring omtrent het gedrag moeten beschikken, continu worden gescreend waardoor
      wordt bijgedragen aan het vergroten van de veiligheid van de opgevangen kinderen.

      2 Met het oog op het in het eerste lid genoemde doeleinde schrijven de personen, bedoeld in het eerste lid, zich
      in, in het personenregister kinderopvang.

      3 De houder van een kindercentrum of van een gastouderbureau heeft toegang tot het personenregister kinderopvang
      voor het leggen van een koppeling met de in [artikel 1.50, derde lid][ref1], genoemde personen, inclusief hemzelf.
      De houder van een gastouderbureau legt tevens een koppeling met de in [artikel 1.56b, derde lid][ref2], bedoelde
      personen. Voor de koppeling gebruikt de houder het burgerservicenummer, zodat is gegarandeerd dat hij een koppeling
      legt met de personen die daadwerkelijk aan hem verbonden moeten zijn en om de persoonsgegevens van die personen in
      het personenregister kinderopvang te kunnen verifiëren.

      4 Inschrijving in het personenregister kinderopvang eindigt:

      a. uiterlijk binnen twee weken volgend op de dag waarop de ingeschrevene een verzoek tot beëindiging indient en
      zonder koppeling als bedoeld in het derde lid staat ingeschreven;

      b. uiterlijk binnen twee weken volgend op de dag waarop de ingeschrevene een verzoek tot beëindiging indient,
      zonder koppeling als bedoeld in het derde lid staat ingeschreven en het college het besluit tot verwijdering van
      alle inschrijvingen van de ingeschrevene, bedoeld in [artikel 1.47][ref3], heeft genomen;

      c. uiterlijk binnen twee weken volgend op de dag waarop de ingeschrevene een verzoek tot beëindiging indient,
      zonder koppeling als bedoeld in het derde lid staat ingeschreven en niet meer op hetzelfde woonadres als een houder
      van de voorziening voor gastouderopvang – voor zover dit tevens de opvanglocatie is – zijn hoofdverblijf heeft of
      niet meer zijn hoofdverblijf heeft op het adres waar een kindercentrum is gevestigd;

      d. uiterlijk vier maanden nadat de ingeschrevene zonder koppeling als bedoeld in het derde lid in het
      personenregister kinderopvang is opgenomen;

      e. uiterlijk vier maanden na het verzoek tot het overleggen van een nieuwe verklaring omtrent het gedrag vanwege
      de ontvangst van een melding van nieuwe gegevens in de justitiële documentatie of vanwege de omstandigheid, bedoeld
      in [artikel 1.50, vijfde tot en met zevende lid][ref4], en [artikel 1.56b, vierde en vijfde lid][ref5] en de
      ingeschrevene geen nieuwe verklaring omtrent het gedrag heeft overgelegd;

      f. uiterlijk binnen twee weken na kennisgeving van het overlijden van de ingeschrevene.

      5 Ingeval van beëindiging als bedoeld in het vierde lid, onderdeel d, kan de periode van vier maanden op verzoek
      van de ingeschrevene eenmaal worden verlengd voor de duur van negen maanden, tenzij er een nieuwe verklaring
      omtrent het gedrag is verlangd van de ingeschrevene.

      6 Bij het inschrijven in het personenregister kinderopvang kunnen kosten in rekening worden gebracht bij degene
      die verzoekt om inschrijving. De kostenvergoedingen zijn niet hoger dan een bij of krachtens algemene maatregel van
      bestuur vast te stellen bedrag.

      7 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de gegevensverwerking, bedoeld in het
      eerste en derde lid. De regels hebben in ieder geval betrekking op:

      a. de gegevens die in het personenregister kinderopvang worden opgenomen;

      b. de start van de continue screening kinderopvang;

      c. de wijze waarop de gegevens uit het personenregister kinderopvang worden verstrekt;

      d. het aanwijzen van een verwerker; en

      e. het verwijderen uit en bewaren van gegevens in het personenregister kinderopvang.


