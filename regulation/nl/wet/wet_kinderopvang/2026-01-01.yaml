  - number: '1.49'
    text: |-
      1 Een houder van een kindercentrum biedt verantwoorde kinderopvang, waaronder wordt verstaan het in een veilige
      en gezonde omgeving bieden van emotionele veiligheid aan kinderen, het bevorderen van de persoonlijke en sociale
      competentie van kinderen en de socialisatie van kinderen door overdracht van algemeen aanvaarde waarden en normen.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de in het eerste lid
      genoemde aspecten van verantwoorde kinderopvang.

      3 Een houder van een voorziening voor gastouderopvang biedt verantwoorde gastouderopvang aan waaronder wordt
      verstaan opvang die bijdraagt aan een goede en gezonde ontwikkeling van het kind in een veilige en gezonde
      omgeving.

      4 Een houder van een gastouderbureau draagt zorg voor een verantwoorde uitvoering van de werkzaamheden van het
      bureau, waaronder wordt verstaan:

      a. het tot stand brengen en begeleiden van gastouderopvang die bijdraagt aan een goede en gezonde ontwikkeling van
      het kind in een veilige en gezonde omgeving;

      b. het doorgeleiden van de betalingen van ouders aan gastouders.
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.49
  - number: '1.50'
    text: |-
      1 De houder van een kindercentrum organiseert de kinderopvang op zodanige wijze, voorziet het kindercentrum
      zowel kwalitatief, als kwantitatief zodanig van personeel en materieel, draagt zorg voor een zodanige
      verantwoordelijkheidstoedeling, en voert een zodanig pedagogisch beleid dat een en ander redelijkerwijs leidt tot
      verantwoorde kinderopvang. Ter uitvoering van de eerste zin besteedt de houder van het kindercentrum in ieder geval
      aantoonbaar aandacht aan het aantal beroepskrachten in relatie tot het aantal kinderen per leeftijdscategorie,
      de groepsgrootte, het dagritme en de herkenbaarheid van ruimtes en personen, de opleidingseisen waaraan
      beroepskrachten voldoen, de voorwaarden waaronder en de mate waarin beroepskrachten in opleiding en stagiairs
      kunnen worden belast met de verzorging, opvoeding en bijdrage aan de ontwikkeling van kinderen, de inzet van
      pedagogisch beleidsmedewerkers en de opleidingseisen waaraan pedagogisch beleidsmedewerkers voldoen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de voorwaarden voor
      verantwoorde kinderopvang bij een kindercentrum. Deze regels kunnen betrekking hebben op:

      a. de veiligheid en de gezondheid;

      b. de opleidingseisen waaraan de beroepskrachten voldoen;

      c. de inzet van beroepskrachten in opleiding en stagiairs;

      d. het aantal beroepskrachten in relatie tot het aantal kinderen per leeftijdscategorie;

      e. de groepsgrootte, het dagritme en de herkenbaarheid van ruimtes;

      f. de herkenbaarheid van personen;

      g. het pedagogisch beleid en de pedagogische praktijk;

      h. de accommodatie en de inrichting van de ruimte die bestemd is voor kinderopvang;

      i. de beschikbare ruimte voor kinderen;

      j. de inzet van pedagogisch beleidsmedewerkers;

      k. de opleidingseisen waaraan pedagogisch beleidsmedewerkers voldoen.

      3 In het bezit van een verklaring omtrent het gedrag zijn:

      a. de houder of voorgenomen houder van een kindercentrum en de bestuurder, vennoot, maat of beheerder van dat
      kindercentrum;

      b. de participerende ouder;

      c. de personen die op basis van een arbeidsovereenkomst met de houder of met een uitzendorganisatie tijdens
      opvanguren werkzaam zijn dan wel zullen zijn op de locatie van een onderneming waarmee de houder een kindercentrum
      exploiteert en waar kinderen worden opgevangen;

      d. de personen die op basis van een andere overeenkomst met de houder structureel tijdens opvanguren werkzaam zijn
      of zullen zijn op de locatie waar kinderen worden opgevangen;

      e. de personen die uit hoofde van hun functie toegang hebben of zullen hebben tot informatie over de kinderen die
      worden opgevangen; en

      f. de personen van 18 jaar en ouder die op het woonadres waar een kindercentrum is gevestigd hun hoofdverblijf
      hebben of zullen hebben dan wel die structureel tijdens opvanguren aanwezig zijn of zullen zijn op het
      kindercentrum, gevestigd op een woonadres.

      Voor zover het natuurlijke personen betreft is een ieder als bedoeld in de onderdelen a tot en met f ingeschreven
      in het personenregister kinderopvang, bedoeld in [artikel 1.48d][ref1]. De verklaring omtrent het gedrag is bij
      inschrijving in het personenregister kinderopvang niet ouder dan twee maanden.

      4 Na inschrijving van een persoon als bedoeld in het derde lid, en na de koppeling, bedoeld in
      [artikel 1.48d, derde lid][ref2], kan die persoon zijn werkzaamheden aanvangen.

      5 Een houder of voorgenomen houder kan een aanvraag als bedoeld in [artikel 1.45, eerste lid][ref3], indienen na
      zijn inschrijving en inschrijving van de in het derde lid, onderdeel f, bedoelde personen in het personenregister
      kinderopvang. De verklaring omtrent het gedrag van de houder of voorgenomen houder is op het moment van de aanvraag
      niet ouder dan 2 maanden indien het een voorgenomen houder betreft en niet ouder dan 2 jaar indien het een houder
      betreft.

      6 Indien de toezichthouder redelijkerwijs mag vermoeden dat de houder van een kindercentrum niet langer voldoet
      aan de eisen voor het afgeven van een verklaring omtrent het gedrag, verlangt de toezichthouder dat deze houder
      opnieuw een verklaring omtrent het gedrag overlegt binnen een door de toezichthouder vast te stellen termijn.
      Een verklaring omtrent het gedrag is op het moment van overlegging niet ouder dan twee maanden. Ingeval opnieuw
      een verklaring omtrent het gedrag wordt verlangd wordt de inschrijving van de houder in het personenregister
      kinderopvang, bedoeld in [artikel 1.48d][ref4], onmiddellijk door de verwerker geblokkeerd.

      7 Indien de houder redelijkerwijs mag vermoeden dat een persoon werkzaam bij een onderneming als bedoeld in het
      derde lid niet langer voldoet aan de eisen voor het afgeven van een verklaring omtrent het gedrag, verlangt de
      houder al dan niet op verzoek van de toezichthouder, dat die persoon opnieuw een verklaring omtrent het gedrag
      overlegt binnen een door de houder dan wel de toezichthouder vast te stellen termijn. Een verklaring omtrent
      het gedrag is op het moment van overlegging niet ouder dan twee maanden. Ingeval opnieuw een verklaring omtrent
      het gedrag wordt verlangd wordt de inschrijving van die persoon in het personenregister kinderopvang, bedoeld in
      [artikel 1.48d][ref5], onmiddellijk door de verwerker geblokkeerd.

      8 Indien de toezichthouder redelijkerwijs mag vermoeden dat een persoon van 12 jaar of ouder die ten tijde van de
      opvang aanwezig is in het kindercentrum niet zou voldoen aan de eisen voor het afgeven van een verklaring omtrent
      het gedrag, verlangt de toezichthouder dat de houder van het kindercentrum een verklaring omtrent het gedrag
      overlegt met betrekking tot die persoon binnen een door de toezichthouder vast te stellen termijn. Binnen die
      termijn is die persoon in het bezit van een verklaring omtrent het gedrag en legt de houder die verklaring omtrent
      het gedrag over aan de toezichthouder. Een verklaring omtrent het gedrag is op het moment van overlegging niet
      ouder dan twee maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.48d
