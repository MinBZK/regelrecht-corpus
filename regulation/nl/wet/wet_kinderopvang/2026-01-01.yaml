  - number: '1.5'
    text: |-
      1 Een ouder heeft aanspraak op een kinderopvangtoeslag in de door hem of zijn partner betaalde kosten, indien het
      betreft:

      a. kinderopvang in een geregistreerd kindercentrum; of

      b. gastouderopvang in een geregistreerde voorziening voor gastouderopvang.

      2 Indien het ouderparticipatieopvang in een ouderparticipatiecrèche betreft, heeft de ouder in de aanloopperiode,
      bedoeld in [artikel 1.60b][ref1], in afwijking van het eerste lid, geen aanspraak op kinderopvangtoeslag.

      3 Een ouder en diens partner die tevens ouder is worden voor de toepassing van deze wet geacht gezamenlijk één
      aanspraak te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.60b
