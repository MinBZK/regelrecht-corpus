  - number: 3.5a
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de Wet van 8 november 2023 tot wijziging van de
      Wet kinderopvang in verband met een structurele regeling voor meertalige dagopvang (Stb. 2023, 412), aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten van die wet in de praktijk. In het verslag wordt in
      ieder geval aandacht besteed aan:

      a. de werking in de praktijk van het maximumpercentage van 50% per dag;

      b. de effecten op het aanbod en de kwaliteit van de kinderopvang;

      c. de effecten op de werkzaamheden van de beroepskrachten meertalige kinderopvang en de pedagogische
      beleidsmedewerkers werkzaam bij de meertalige kinderopvang.

      Daarbij dient rekening te worden gehouden met alle talen, bedoeld in [artikel 1.55, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1.55
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel3.5a
