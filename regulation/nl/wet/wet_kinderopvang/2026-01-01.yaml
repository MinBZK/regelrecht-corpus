  - number: '1.3'
    text: |-
      1 De uitvoering van het toekennen, uitbetalen en terugvorderen van de kinderopvangtoeslag is opgedragen aan de
      Dienst Toeslagen.

      2 Op deze wet is de [Algemene wet inkomensafhankelijke regelingen][ref1] van toepassing met uitzondering
      van [artikel 5 van die wet][ref2] op wijzigingen in de kosten van kinderopvang per kind, bedoeld in
      [artikel 1.7, eerste lid, onderdeel b][ref3], met dien verstande dat:

      a. in afwijking van [artikel 4, derde lid, van de Algemene wet inkomensafhankelijke regelingen][ref4] een kind voor
      wie de pleegouder een vergoeding ontvangt op grond van de [Jeugdwet][ref5], geacht wordt door die pleegouder in
      belangrijke mate te worden onderhouden;

      b. in afwijking van [artikel 15, eerste lid, van de Algemene wet inkomensafhankelijke regelingen][ref6],
      een ouder over de berekeningsjaren 2014 en volgende geen aanspraak heeft op kinderopvangtoeslag als bedoeld
      in de [artikelen 1.5][ref7] en [1.5a][ref8] over de periode tot de eerste dag van de kalendermaand die drie
      kalendermaanden gelegen is voor de datum waarop de aanvraag om kinderopvangtoeslag is ingediend bij de Dienst
      Toeslagen.


