  - number: 1.57e
    text: |-
      1 Bij regeling van Onze Minister kunnen kindercentra, gastouderbureaus en voorzieningen voor gastouderopvang
      tijdelijk worden vrijgesteld van een of meer artikelen van deze paragraaf, indien naleving van die artikelen
      redelijkerwijs niet gevergd kan worden vanwege bijzondere omstandigheden die verband houden met de bestrijding
      van de epidemie van een infectieziekte behorend tot groep A1 of een directe dreiging daarvan als bedoeld in de
      [Wet publieke gezondheid][ref1]. Aan de vrijstelling kunnen voorschriften en beperkingen worden verbonden.

      2 Een vrijstelling geldt voor de duur van ten hoogste drie maanden en kan telkens voor ten hoogste drie maanden bij
      regeling van Onze Minister worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0024705
