  - number: 1.56a
    text: |-
      De houder van een gastouderbureau maakt ten behoeve van een goede uitvoering van de bij of krachtens deze afdeling
      gestelde regels gebruik van het burgerservicenummer van de ouder.
    url: https://wetten.overheid.nl/BWBR0017017/2026-01-01#Artikel1.56a
  - number: 1.56b
    text: |-
      1 De gastouder beschikt over een zodanige deskundigheid, organiseert de gastouderopvang op zodanige wijze, voorziet
      de voorziening voor gastouderopvang zodanig van materieel en voert een zodanig pedagogisch beleid, dat een en
      ander leidt of redelijkerwijs moet leiden tot verantwoorde gastouderopvang. De gastouder houdt bij de uitvoering
      van de werkzaamheden rekening met de opgestelde risico-inventarisatie, bedoeld in [artikel 1.51][ref1] en hij is
      verantwoordelijk voor de naleving van de meldcode, bedoeld in [artikel 1.51a, eerste lid][ref2].

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de kwaliteit van de
      gastouderopvang. Deze regels kunnen betrekking hebben op:

      a. de veiligheid en de gezondheid;

      b. de deskundigheidseisen waaraan de gastouder voldoet;

      c. de groepsgrootte;

      d. de accommodatie en de inrichting van de ruimte die bestemd is voor gastouderopvang;

      e. de beschikbare ruimte voor kinderen;

      f. het pedagogisch beleid en de pedagogische praktijk.

      3 De gastouder of voorgenomen gastouder en andere personen van 18 jaar of ouder die op hetzelfde woonadres als de
      gastouder, voor zover dit tevens de opvanglocatie is, hun hoofdverblijf hebben of zullen hebben alsmede de personen
      van 18 jaar en ouder die structureel tijdens opvanguren aanwezig zijn of zullen zijn op de opvanglocatie, zijn
      in het bezit van een verklaring omtrent het gedrag en staan ingeschreven in het personenregister kinderopvang,
      bedoeld in [artikel 1.48d][ref3]. De verklaring omtrent het gedrag is bij inschrijving in het personenregister
      kinderopvang niet ouder dan twee maanden.

      4 Na inschrijving van een voorgenomen gastouder en de personen, bedoeld in het derde lid, in het personenregister
      kinderopvang, bedoeld in [artikel 1.48d][ref4], dient de houder van het gastouderbureau een aanvraag als bedoeld in
      [artikel 1.45, tweede lid][ref5], in. Na toestemming tot exploitatie, bedoeld in [artikel 1.46, tweede lid][ref6],
      en na de koppeling, bedoeld in artikel 1.48d, derde lid, kan de gastouder of voorgenomen gastouder zijn
      werkzaamheden aanvangen.

      5 Indien de houder van een gastouderbureau redelijkerwijs mag vermoeden dat een persoon als bedoeld in het
      derde lid niet langer voldoet aan de eisen voor het afgeven van een verklaring omtrent het gedrag, verlangt de
      houder al dan niet op verzoek van de toezichthouder dat die persoon opnieuw een verklaring omtrent het gedrag
      overlegt binnen een door de houder dan wel de toezichthouder vast te stellen termijn. Een verklaring omtrent
      het gedrag is op het moment van overlegging niet ouder dan twee maanden. Ingeval opnieuw een verklaring omtrent
      het gedrag wordt verlangd wordt de inschrijving van de persoon in het personenregister kinderopvang, bedoeld in
      [artikel 1.48d][ref7], onmiddellijk door de verwerker geblokkeerd.

      6 [Artikel 1.53][ref8] is van overeenkomstige toepassing op de gastouder.

      7 Indien de toezichthouder redelijkerwijs mag vermoeden dat een persoon van 12 jaar of ouder die ten tijde van de
      opvang aanwezig is op het adres waar opvang door de gastouder plaatsvindt, niet zou voldoen aan de eisen voor het
      afgeven van een verklaring omtrent het gedrag, verlangt de toezichthouder dat de gastouder een verklaring omtrent
      het gedrag overlegt met betrekking tot die persoon binnen een door de toezichthouder vast te stellen termijn.
      Binnen die termijn is die persoon in het bezit van een verklaring omtrent het gedrag en legt de gastouder die
      verklaring omtrent het gedrag over aan de toezichthouder. Een verklaring omtrent het gedrag is op het moment van
      overlegging niet ouder dan twee maanden.

      8 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten behoeve van een goede
      uitvoering van het derde tot en met het zevende lid.


