  - number: '1.58'
    text: |-
      1 Een houder van een kindercentrum of van een gastouderbureau stelt binnen zes maanden na de registratie,
      bedoeld in [artikel 1.46, tweede lid][ref1], voor elk door hem geëxploiteerd kindercentrum of gastouderbureau een
      oudercommissie in die tot taak heeft hem te adviseren over de aangelegenheden, genoemd in [artikel 1.60][ref2].

      2 De verplichting tot het instellen van een oudercommissie, bedoeld in het eerste lid, geldt niet indien:

      a. de houder zich aantoonbaar voldoende heeft ingespannen om een oudercommissie in te stellen; en

      b. het een kindercentrum, waar maximaal 50 kinderen worden opgevangen, of een gastouderbureau, waarbij maximaal 50
      gastouders zijn aangesloten, betreft.

      3 In de situatie, bedoeld in het tweede lid, betrekt de houder de ouders aantoonbaar voldoende op een andere wijze
      bij de onderwerpen, bedoeld in [artikel 1.60, eerste lid][ref3], biedt de houder de ouders de gelegenheid deel
      te nemen aan een oudercommissie, stelt de houder voor die oudercommissie in dat geval een reglement vast en zijn
      [artikel 1.59, tweede tot en met vijfde lid][ref4], en artikel 1.60 van overeenkomstige toepassing.

      4 De leden van de oudercommissie worden gekozen uit en door de ouders van wie de kinderen in het kindercentrum of
      door tussenkomst van het gastouderbureau worden opgevangen.

      5 Personen werkzaam bij een kindercentrum onderscheidenlijk gastouderbureau zijn geen lid van de oudercommissie van
      dat kindercentrum of gastouderbureau.

      6 De oudercommissie bepaalt haar eigen werkwijze.


