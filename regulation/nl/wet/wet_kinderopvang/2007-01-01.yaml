preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het wenselijk is om regels te stellen met betrekking tot
    tegemoetkomingen in de kosten van kinderopvang en om de kwaliteit van kinderopvang te waarborgen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel1
  - number: 1.1.b
    text: |-
      kinderopvang: het bedrijfsmatig of anders dan om niet verzorgen en opvoeden van kinderen tot de eerste dag van de
      maand waarop het voortgezet onderwijs voor die kinderen begint;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel1
  - number: 1.1.c
    text: |-
      gastouderopvang: kinderopvang in een gezinssituatie door een ander dan degene die als ouder op grond van
      [artikel 5, eerste lid][ref1], aanspraak kan maken op een kinderopvangtoeslag onderscheidenlijk een tegemoetkoming
      of diens partner, bestaande in de gelijktijdige opvang van ten hoogste vier kinderen in de woning waar de ouder of
      de gastouder zijn hoofdverblijf heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel5
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.1.d
    text: 'kindercentrum: een voorziening waar kinderopvang plaatsvindt, anders dan gastouderopvang;'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel1
  - number: 1.1.e
    text: 'gastouderbureau: een organisatie die gastouderopvang tot stand brengt en begeleidt;'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel1
  - number: 1.1.f
    text: 'gastouder: de natuurlijke persoon die gastouderopvang biedt;'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel1
  - number: 1.1.g
    text: |-
      beroepskracht: degene die werkzaam is bij een kindercentrum en is belast met de verzorging en opvoeding van
      kinderen;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel1
  - number: 1.1.h
    text: |-
      beroepskracht in opleiding: degene die de beroepsbegeleidende leerweg volgt, bedoeld in de
      [Wet educatie en beroepsonderwijs][ref1], en ten behoeve van beroepspraktijkvorming is belast met de verzorging en
      opvoeding van kinderen bij een kindercentrum;


