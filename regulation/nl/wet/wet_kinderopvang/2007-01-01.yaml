        hoofdstuk: '2'
        paragraaf: '2'
  - number: '30.2'
    text: |-
      De tegemoetkoming van het Uitvoeringsinstituut werknemersverzekeringen bedraagt voor de overige
      ouders, bedoeld in [artikel 29, eerste lid][ref1], voorzover de ouder een persoon is als bedoeld in
      [artikel 6, eerste lid, onder h of i][ref2], een zesde deel van de kosten van kinderopvang, verhoogd met een bij
      regeling van Onze Minister zodanig vast te stellen bedrag, dat het totaal aan kinderopvangtoeslag en tegemoetkoming
      van het Uitvoeringsinstituut werknemersverzekeringen niet meer bedraagt dan de kosten van kinderopvang, bedoeld in
      [artikel 7, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel7
