  - number: '24.3'
    text: |-
      De tegemoetkoming van de gemeente bedraagt voor een ouder of zijn partner als bedoeld in
      [artikel 22, tweede lid][ref1], een bij regeling van Onze Minister zodanig vast te stellen bedrag, dat het totaal
      aan kinderopvangtoeslag en tegemoetkoming van de gemeente niet meer bedraagt dan de kosten van kinderopvang,
      bedoeld in [artikel 7, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel24
    references:
