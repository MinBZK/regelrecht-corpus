  - number: 6.1.j
    text: |-
      is ingeschreven bij een school of instelling als bedoeld in [paragraaf 2.2][ref1]
      of [2.4 van de Wet tegemoetkoming onderwijsbijdragen en schoolkosten][ref2] dan wel als bedoeld in de
      [artikelen 2.8 tot en met 2.11 van de Wet studiefinanciering 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Paragraaf2.2
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Paragraaf2.4
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel2
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel6
