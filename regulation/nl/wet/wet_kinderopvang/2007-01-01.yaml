  - number: '5.1'
    text: |-
      Een ouder heeft aanspraak op een kinderopvangtoeslag in de door hem of zijn partner te betalen kosten jegens
      het Rijk onderscheidenlijk aanspraak op een tegemoetkoming in de door hem of zijn partner te betalen kosten van
      kinderopvang jegens de gemeente of jegens het Uitvoeringsinstituut werknemersverzekeringen, indien het betreft
      kinderopvang in een geregistreerd kindercentrum of gastouderopvang die plaatsvindt door tussenkomst van een
      geregistreerd gastouderbureau.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel5
  - number: '5.2'
    text: |-
      Een ouder en diens partner die tevens ouder is worden voor de toepassing van deze wet geacht gezamenlijk één
      aanspraak te hebben.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel5
  - number: '6.1'
    text: 'Een ouder heeft voor een berekeningsjaar aanspraak op een kinderopvangtoeslag, indien de ouder in dat jaar:'
