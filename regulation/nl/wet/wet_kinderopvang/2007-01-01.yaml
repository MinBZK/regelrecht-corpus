        artikel: '2'
  - number: '6.2'
    text: |-
      Een ouder die niet in Nederland woont, heeft slechts aanspraak op een kinderopvangtoeslag indien hij in een andere
      lidstaat of Zwitserland woont en, daartoe gerechtigd, in Nederland arbeid verricht of een uitkering ontvangt als
      bedoeld in het eerste lid, onder c, d, e, h of i, en gebruik maakt van een in één van die onderdelen bedoelde
      voorziening gericht op arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel6
  - number: '6.3'
    text: |-
      Een ouder met een partner heeft slechts aanspraak op een kinderopvangtoeslag, indien de partner in Nederland, een
      andere lidstaat of Zwitserland woont, en
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel6
  - number: 6.3.a
    text: in Nederland, een andere lidstaat of Zwitserland arbeid verricht,
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel6
  - number: 6.3.b
    text: |-
      een uitkering ontvangt als bedoeld in het eerste lid, onder c, d, e, h of i, en gebruik maakt van een in één
      van die onderdelen bedoelde voorziening gericht op arbeidsinschakeling of een daarmee vergelijkbare uitkering
      respectievelijk voorziening, vastgesteld krachtens de wetgeving van een andere lidstaat of Zwitserland,
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel6
  - number: 6.3.c
    text: |-
      werkloos wordt als bedoeld in het tweede lid en een uitkering ontvangt als bedoeld in het tweede lid, onder a of b,
      of een daarmee vergelijkbare uitkering, vastgesteld krachtens de wetgeving van een andere lidstaat of Zwitserland,
      of
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel6
  - number: 6.3.d
    text: een persoon is als bedoeld in het eerste lid, onder f, g, j, k of l.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel6
  - number: '6.4'
    text: |-
      Voor de toepassing van deze wet wordt met inkomen uit werk en woning als bedoeld in het eerste lid, onderdeel a,
      gelijkgesteld een daarmee overeenkomend inkomen dat niet tot het verzamelinkomen van de ouder behoort omdat het
      niet behoort tot het Nederlands inkomen als bedoeld in [hoofdstuk 7 van de Wet inkomstenbelasting 2001][ref1], of
      is vrijgesteld op grond van bepalingen van internationaal recht.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '7'
  - number: '7.1'
    text: 'De hoogte van de kinderopvangtoeslag is afhankelijk van:'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel7
  - number: 7.1.a
    text: de draagkracht, en
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel7
  - number: 7.1.b
    text: 'de kosten van kinderopvang per kind die worden bepaald door:'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel7
  - number: 7.1.b.1º
    text: het aantal uren kinderopvang per kind in het berekeningsjaar,
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel7
  - number: 7.1.b.2º
    text: de voor die kinderopvang te betalen prijs, met inachtneming van het bedrag, bedoeld in het tweede lid, en
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel7
  - number: 7.1.b.3º
    text: de soort kinderopvang.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel7
  - number: '7.2'
    text: |-
      De uurprijs die bij de hoogte van de kinderopvangtoeslag, bedoeld in het eerste lid, in aanmerking wordt genomen
      gaat een bij algemene maatregel van bestuur vast te stellen bedrag niet te boven. Dat bedrag kan per soort
      kinderopvang verschillend worden vastgesteld en kan voor kinderopvang die plaatsvindt in landen die geen deel
      uitmaken van de Europese Unie dan wel geen partij zijn bij de Overeenkomst betreffende de Europese Economische
      Ruimte lager worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel7
  - number: '7.3'
    text: |-
      De bedragen, bedoeld in het tweede lid, en de mate waarin het toetsingsinkomen van de ouder en, indien hij een
      partner heeft, dat van zijn partner een rol speelt bij de hoogte van de kinderopvangtoeslag, worden per 1 januari
      van ieder kalenderjaar bij regeling van Onze Minister herzien aan de hand van een bij algemene maatregel van
      bestuur aan te wijzen index ter zake van lonen of prijzen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel7
  - number: '7.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de hoogte en de
      berekeningswijze van de kinderopvangtoeslag, waarbij tevens tabellen worden vastgesteld, waaruit de relatie tussen
      de kosten van kinderopvang en de kinderopvangtoeslag kan worden afgelezen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel7
  - number: '8.1'
    text: |-
      Indien een ouder en diens partner tegenwoordige arbeid verrichten als bedoeld in
      [artikel 6, eerste lid, onder a of b][ref1], wordt de kinderopvangtoeslag vermeerderd met een bedrag dat
      overeenkomt met een derde deel van de kosten van kinderopvang, bedoeld in [artikel 7, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Voor een ouder die geen partner heeft en tegenwoordige arbeid verricht als bedoeld in
      [artikel 6, eerste lid, onder a of b][ref1], wordt de kinderopvangtoeslag vermeerderd met een bedrag dat
      overeenkomt met een zesde deel van de kosten van kinderopvang, bedoeld in [artikel 7, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '8.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op een ouder met een partner die een persoon is als bedoeld in
      a[rtikel 22, eerste lid, onderdeel a][ref1], of [artikel 29, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel29
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '8.4'
    text: |-
      Bij de toepassing van het eerste tot en met derde lid is [artikel 7, tweede lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      De financiële middelen tot dekking van de uitgaven voor de vermeerdering van de kinderopvangtoeslag, bedoeld
      in [artikel 8, eerste tot en met derde lid][ref1], voor zover toegekend aan ouders die als werknemer of
      overheidswerknemer tegenwoordige arbeid verrichten als bedoeld in [artikel 6, eerste lid, onder a][ref2],
      worden verkregen door het heffen van een opslag op de premie die ten gunste komt van het sectorfonds, bedoeld in
      [artikel 23, tweede lid, van de Wet financiering sociale verzekeringen][ref3], onderscheidenlijk de premie, bedoeld
      in [artikel 29 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel29
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '23'
      - id: ref4
        bwb_id: BWBR0017745
        artikel: '29'
  - number: '9.2'
    text: |-
      De premieopslagen, bedoeld in het eerste lid, zijn verschuldigd door de werkgever onderscheidenlijk de
      overheidswerkgever.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel9
  - number: '9.3'
    text: |-
      De premieopslagen worden vastgesteld bij ministeriële regeling. De [artikelen 26][ref1] onderscheidenlijk
      [31 van de Wet financiering sociale verzekeringen][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel31
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '31'
  - number: '9.4'
    text: |-
      Op de heffing en invordering van de premieopslagen zijn de [artikelen 57][ref1], [59][ref2] en
      [60 van de Wet financiering sociale verzekeringen][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel60
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '59'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '60'
  - number: '22.1'
    text: 'Een ouder heeft in een berekeningsjaar aanspraak op een tegemoetkoming van de gemeente:'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel22
  - number: 22.1.a
    text: |-
      voor zover de ouder in dat jaar een persoon is die een uitkering ontvangt en gebruik maakt van een voorziening
      gericht op arbeidsinschakeling als bedoeld in [artikel 6, eerste lid, onder c, d, e of h][ref1], of als
      niet-uitkeringsgerechtigde gebruik maakt van een voorziening gericht op arbeidsinschakeling als bedoeld in
      [artikel 6, eerste lid, onder f][ref2], voor wie het college van burgemeester en wethouders op grond van
      [artikel 7, eerste lid, aanhef en onder a, of derde lid, tweede zin, van de Wet werk en bijstand][ref3],
      __REF003___________________________________________________________________________________________________________
      __________________,
      __REF004___________________________________________________________________________________________________________
      ____________________,
      [artikel 30, vijfde lid, onder a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6] of
      [artikel 72, tweede lid, van de Werkloosheidswet][ref7], verantwoordelijk is voor het ondersteunen bij
      arbeidsinschakeling of die gebruik maakt van een voorziening, gericht op arbeidsinschakeling in het kader van een
      gemengde beroepspraktijk als bedoeld in [artikel 21, eerste lid, van de Wet werk en inkomen kunstenaars][ref8];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0004163#Artikel34
      [ref6]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref7]: https://wetten.overheid.nl/BWBR0004045#Artikel72
      [ref8]: https://wetten.overheid.nl/BWBR0017837#Artikel21
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
