  - number: '35.3'
    text: |-
      Een besluit als bedoeld in het eerste of tweede lid wordt slechts genomen met betrekking tot een ouder of
      diens partner, die naar het oordeel van het college van burgemeesters en wethouders onderscheidenlijk het
      Uitvoeringsinstituut werknemersverzekeringen, naar vermogen tracht arbeid in dienstbetrekking te verkrijgen. In een
      zodanig geval heeft de ouder eveneens aanspraak op een kinderopvangtoeslag, voor zover hij niet reeds een aanspraak
      heeft op grond van [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '35.4'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld omtrent de maximale duur van aanspraken, verleend op grond van
      het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel35
  - number: '38.1'
    text: |-
      Bedragen door een ouder of diens partner in het kader van deze wet verschuldigd aan de gemeente worden ingevorderd
      door het college van burgemeester en wethouders. Een bedrag is invorderbaar vanaf een maand na de dag van
      dagtekening van de beschikking waarbij de vordering is ontstaan.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel38
  - number: '38.2'
    text: |-
      De [artikelen 58 tot en met 60 van de Wet werk en bijstand][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
  - number: '39'
    text: |-
      Op de invordering van bedragen door een ouder of diens partner in het kader van
      deze wet verschuldigd aan het Uitvoeringsinstituut werknemersverzekeringen zijn de
      [artikelen 57 tot en met 57b van de Wet op de arbeidsongeschiktheidsverzekering][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel57
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '57'
  - number: '40'
    text: |-
      De kinderopvangtoeslag, alsmede de tegemoetkomingen van de gemeente of het Uitvoeringsinstituut
      werknemersverzekeringen blijven buiten beschouwing bij de verlening van andere op het inkomen of vermogen
      afgestemde publiekrechtelijke uitkeringen en verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel40
  - number: '41.1'
    text: |-
      De tegemoetkomingen van de gemeente of het Uitvoeringsinstituut werknemersverzekeringen zijn niet vatbaar voor
      vervreemding, verpanding, belening of beslag, waaronder begrepen beslag ingevolge faillissement of toepassing van
      de schuldsaneringsregeling natuurlijke personen, tenzij het betreft de inning van:
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel41
  - number: 41.1.a
    text: vorderingen van houders of gastouders ter zake van verleende kinderopvang;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel41
  - number: 41.1.b
    text: vorderingen van de gemeente of het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel41
  - number: '41.2'
    text: Elk beding dat strijdt met het eerste lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel41
  - number: '44'
    text: |-
      De ouder en zijn partner zijn ten aanzien van schulden voortvloeiend uit vorderingen van de gemeente of het
      Uitvoeringsinstituut werknemersverzekeringen ingevolge deze wet, hoofdelijk aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel44
  - number: '45.1'
    text: |-
      Degene die voornemens is een kindercentrum of gastouderbureau in exploitatie te nemen doet daarvan melding aan
      het college van burgemeester en wethouders van de gemeente van vestiging. Een kindercentrum of een gastouderbureau
      wordt niet in exploitatie genomen, voordat de termijn, bedoeld in [artikel 62][ref1], is verstreken of indien uit
      het onderzoek, bedoeld in dat artikel, eerder is gebleken dat de exploitatie redelijkerwijs zal plaatsvinden in
      overeenstemming met het bepaalde bij of krachtens de [paragrafen 2][ref2] en [3 van dit hoofdstuk][ref3], vanaf
      dat moment.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '45.2'
    text: |-
      Bij regeling van Onze Minister wordt bepaald welke gegevens bij die melding worden verstrekt en op welke wijze deze
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel45
  - number: '46.1'
    text: |-
      Het college van burgemeester en wethouders houdt een register bij van gemelde kindercentra en gastouderbureaus. In
      het register worden na een melding onverwijld de gegevens opgenomen die ingevolge [artikel 45, tweede lid][ref1],
      zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel45
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '46.2'
    text: |-
      Het college van burgemeester en wethouders deelt de houder schriftelijk mee dat opneming van het kindercentrum
      onderscheidenlijk het gastouderbureau in het register heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel46
  - number: '46.3'
    text: |-
      Het college van burgemeester en wethouders maakt de opneming in het register bekend in een lokaal verspreid dag-,
      nieuws- of huis-aan-huisblad.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel46
  - number: '46.4'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent de in het register op te nemen gegevens,
      de vastlegging van gegevens in het register, de verwijdering van gegevens uit het register, de wijze waarop
      verbetering van onjuistheden in het register plaatsvindt en de verstrekking van gegevens.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel46
  - number: '46.5'
    text: Het register ligt ter gemeentesecretarie kosteloos voor een ieder ter inzage.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel46
  - number: '47.1'
    text: |-
      De houder doet van wijzigingen in de gegevens die bij de melding zijn verstrekt, onverwijld mededeling aan het
      college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel47
  - number: '47.2'
    text: |-
      Het college van burgemeester en wethouders deelt de houder schriftelijk mee dat de wijziging in het register,
      bedoeld in [artikel 46, eerste lid][ref1], is aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel46
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '48.1'
    text: |-
      Onze Minister kan een buiten Nederland gevestigd kindercentrum of gastouderbureau met een geregistreerd
      kindercentrum of geregistreerd gastouderbureau gelijkstellen, door opneming ervan in een door hem bij te houden
      centraal register.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel48
  - number: '48.2'
    text: |-
      Indien een ouder voornemens is, gebruik te maken van een kindercentrum of gastouderopvang door tussenkomst van een
      gastouderbureau buiten Nederland, doet hij bij Onze Minister een aanvraag om opneming van dat centrum of bureau
      in het centrale register. Een kindercentrum of gastouderbureau wordt slechts in dat register opgenomen, indien
      aannemelijk is gemaakt dat de kwaliteit ervan naar aard en naar strekking overeenkomt met de op grond van deze wet
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel48
  - number: '48.3'
    text: |-
      Onze Minister deelt de houder en de aanvrager schriftelijk mee dat opneming van het kindercentrum onderscheidenlijk
      het gastouderbureau in het centrale register heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel48
  - number: '48.4'
    text: Onze Minister maakt de opneming in en verwijdering uit het centrale register bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel48
  - number: '48.5'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld omtrent het centrale register en de wijze waarop
      verbetering van onjuistheden in dat register plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel48
  - number: '48.6'
    text: |-
      De houder doet van wijzigingen in de gegevens die ten behoeve van de opneming in het centrale register zijn
      verstrekt, onverwijld mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel48
  - number: '48.7'
    text: Onze Minister deelt de houder schriftelijk mee dat de wijzigingen in het centrale register zijn aangetekend.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel48
  - number: '48.8'
    text: |-
      De houder van een kindercentrum of gastouderbureau als bedoeld in het eerste lid draagt er zorg voor dat de
      kwaliteit van het centrum of het bureau naar aard en naar strekking overeenkomt met de op grond van deze wet
      gestelde regels. De [artikelen 45 tot en met 47][ref1] en [49 tot en met 60][ref2] en de [hoofdstukken 4][ref3] en
      [5][ref4] zijn niet van toepassing op een kindercentrum of een gastouderbureau als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0017017
        hoofdstuk: '5'
  - number: '48.9'
    text: 'Bij regeling van Onze Minister kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel48
  - number: 48.9.a
    text: |-
      de wijze waarop aannemelijk wordt gemaakt dat een kindercentrum of gastouderbureau als bedoeld in het eerste lid
      voldoet aan het tweede lid;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel48
  - number: 48.9.b
    text: het toezicht op de naleving van het achtste lid;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel48
  - number: 48.9.c
    text: |-
      het verstrekken van gegevens en inlichtingen door de ouder en de houder alsmede de wijze waarop deze gegevens en
      inlichtingen worden verstrekt ten behoeve van dat toezicht.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel48
  - number: '48.10'
    text: |-
      Indien blijkt dat de kwaliteit van het kindercentrum of gastouderbureau niet langer naar aard en strekking
      overeenkomt met de op grond van deze wet gestelde regels of dat de houder niet voldoet aan enige verplichting die
      op grond van deze wet op hem rust wordt het kindercentrum of gastouderbureau uit het register verwijderd.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel48
  - number: '49.1'
    text: |-
      Een houder van een kindercentrum biedt verantwoorde kinderopvang aan waaronder wordt verstaan opvang die bijdraagt
      aan een goede en gezonde ontwikkeling van het kind in een veilige en gezonde omgeving.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel49
  - number: '49.2'
    text: |-
      Een houder van een gastouderbureau draagt zorg voor een verantwoorde uitvoering van de werkzaamheden van het
      bureau, waaronder wordt verstaan het tot stand brengen en begeleiden van gastouderopvang die bijdraagt aan een
      goede en gezonde ontwikkeling van het kind in een veilige en gezonde omgeving.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel49
  - number: '50.1'
    text: |-
      De houder van een kindercentrum organiseert de kinderopvang op zodanige wijze, voorziet het kindercentrum
      zowel kwalitatief, als kwantitatief zodanig van personeel en materieel, draagt zorg voor een zodanige
      verantwoordelijkheidstoedeling, en voert een zodanig pedagogisch beleid dat een en ander leidt of redelijkerwijs
      moet leiden tot verantwoorde kinderopvang. Ter uitvoering van de eerste volzin besteedt de houder in ieder geval
      aantoonbaar aandacht aan het aantal beroepskrachten in relatie tot het aantal kinderen per leeftijdscategorie,
      de groepsgrootte, de opleidingseisen van de beroepskrachten en de voorwaarden waaronder en de mate waarin
      beroepskrachten in opleiding kunnen worden belast met de verzorging en opvang van kinderen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel50
  - number: '50.2'
    text: |-
      Personen werkzaam bij een kindercentrum zijn in het bezit van een verklaring omtrent het gedrag, afgegeven volgens
      de [Wet justitiële en strafvorderlijke gegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '50.3'
    text: |-
      De verklaring, bedoeld in het tweede lid, wordt aan de houder overgelegd, voordat een persoon als bedoeld in het
      tweede lid zijn werkzaamheden aanvangt. De verklaring is op het moment dat zij wordt overgelegd, niet ouder dan
      twee maanden.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel50
  - number: '50.4'
    text: |-
      Indien de houder of de toezichthouder redelijkerwijs mag vermoeden dat een persoon als bedoeld in het tweede lid
      niet langer voldoet aan de eisen voor het afgeven van een verklaring omtrent het gedrag, verlangt de houder dat die
      persoon opnieuw een verklaring omtrent het gedrag overlegt die niet ouder is dan twee maanden. De desbetreffende
      persoon legt de verklaring over binnen een door de houder vast te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel50
  - number: '51'
    text: |-
      De houder voert een beleid dat ertoe leidt dat de veiligheid en de gezondheid van de op te vangen kinderen in elk
      door hem geëxploiteerd kindercentrum zoveel mogelijk is gewaarborgd. De houder legt, voor zover hierin niet wordt
      voorzien bij of krachtens andere wet- en regelgeving, in een risico-inventarisatie schriftelijk vast welke risico's
      de opvang van kinderen met zich brengt.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel51
  - number: '52'
    text: Kinderopvang geschiedt op basis van een schriftelijke overeenkomst tussen de houder en de ouder.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel52
  - number: '53'
    text: |-
      Bij regeling van Onze Minister kunnen ten behoeve van een goede uitvoering van deze wet regels worden gesteld met
      betrekking tot de administratie van gegevens bij kindercentra.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel53
  - number: '54'
    text: |-
      De houder informeert de ouders wier kinderen in het kindercentrum worden opgevangen over het te voeren beleid als
      bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel54
  - number: '55.1'
    text: |-
      Bij kinderopvang in een kindercentrum wordt de Nederlandse taal als voertaal gebruikt. Daar waar naast de
      Nederlandse taal, de Friese taal of een streektaal in levend gebruik is, kan de Friese taal of de streektaal mede
      als voertaal worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel55
  - number: '55.2'
    text: |-
      In afwijking van het eerste lid kan mede een andere taal als voertaal worden gebezigd, indien de herkomst van
      de kinderen in specifieke omstandigheden daartoe noodzaakt, overeenkomstig een door de houder vastgestelde
      gedragscode.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel55
  - number: '56.1'
    text: |-
      De houder van een gastouderbureau organiseert zijn werkzaamheden op zodanige wijze, voorziet het bureau
      zowel kwalitatief als kwantitatief zodanig van personeel en materieel, draagt zorg voor een zodanige
      verantwoordelijkheidstoedeling en voert een zodanig beleid, dat een en ander leidt of redelijkerwijs moet leiden
      tot verantwoorde uitvoering van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel56
  - number: '56.2'
    text: |-
      De [artikelen 52][ref1], [53][ref2] en [54][ref3] zijn van overeenkomstige toepassing op de houder van een
      gastouderbureau.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel54
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '52'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '54'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '56.3'
    text: |-
      Op personen werkzaam bij een gastouderbureau en op gastouders is [artikel 50, tweede, derde en vierde lid][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel50
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '57'
    text: |-
      Indien de kinderopvang in een kindercentrum geschiedt uitsluitend en onbezoldigd door ten minste een van de
      ouders van de in die voorziening opgevangen kinderen worden voor de toepassing van [artikel 50, eerste lid][ref1],
      ouders gelijkgesteld met personeel en beroepskrachten. Op ouders, bedoeld in de eerste zin, is
      [artikel 50, tweede, derde en vierde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel50
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 57a.1
    text: |-
      Onze Minister kan beleidsregels stellen omtrent de toepassing van de [artikelen 49][ref1], [50][ref2], [51][ref3]
      en [56][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel51
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel56
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '51'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '56'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 57a.2
    text: De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel57a
  - number: '58.1'
    text: |-
      Een houder van een kindercentrum of een gastouderbureau stelt voor elk door hem geëxploiteerd kindercentrum of
      gastouderbureau een oudercommissie in die tot taak heeft hem te adviseren over de aangelegenheden, genoemd in
      [artikel 60][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel60
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '60'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '58.2'
    text: |-
      De leden van de oudercommissie worden gekozen uit en door degenen wier kinderen in het kindercentrum of door
      tussenkomst van het gastouderbureau worden opgevangen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel58
  - number: '58.3'
    text: |-
      Personen werkzaam bij een kindercentrum onderscheidenlijk gastouderbureau zijn geen lid van de oudercommissie van
      dat kindercentrum of gastouderbureau.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel58
  - number: '58.4'
    text: De oudercommissie bepaalt haar eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel58
  - number: '59.1'
    text: |-
      De houder stelt binnen zes maanden na de melding, bedoeld in [artikel 45, eerste lid][ref1], voor de oudercommissie
      een reglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel45
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '59.2'
    text: 'Het reglement bevat in ieder geval regels omtrent:'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel59
  - number: 59.2.a
    text: het aantal leden van de oudercommissie;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel59
  - number: 59.2.b
    text: de wijze waarop de leden van de oudercommissie worden gekozen;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel59
  - number: 59.2.c
    text: de zittingsduur van de leden van de oudercommissie.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel59
  - number: '59.3'
    text: Het reglement bevat geen regels omtrent de werkwijze van de oudercommissie.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel59
  - number: '59.4'
    text: De oudercommissie beslist bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel59
  - number: '59.5'
    text: Wijziging van het reglement behoeft instemming van de oudercommissie.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel59
  - number: '60.1'
    text: |-
      De houder stelt de oudercommissie in ieder geval in de gelegenheid advies uit te brengen over elk voorgenomen
      besluit met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel60
  - number: 60.1.a
    text: |-
      de wijze waarop uitvoering wordt gegeven aan [artikel 50][ref1] dan wel aan [artikel 56][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel56
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '56'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 60.1.b
    text: |-
      voedingsaangelegenheden van algemene aard en het algemene beleid op het gebied van opvoeding, veiligheid of
      gezondheid;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel60
  - number: 60.1.c
    text: openingstijden;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel60
  - number: 60.1.d
    text: het beleid met betrekking tot spel- en ontwikkelingsactiviteiten ten behoeve van de kinderen;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel60
  - number: 60.1.e
    text: |-
      de vaststelling of wijziging van een regeling inzake de behandeling van klachten en het aanwijzen van personen die
      belast worden met de behandeling van klachten;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel60
  - number: 60.1.f
    text: wijziging van de prijs van kinderopvang.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel60
  - number: '60.2'
    text: |-
      Van een advies als bedoeld in het eerste lid kan de houder slechts afwijken indien hij schriftelijk en gemotiveerd
      aangeeft dat het belang van de kinderopvang zich tegen het advies verzet.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel60
  - number: '60.3'
    text: De oudercommissie is bevoegd de houder ook ongevraagd te adviseren over de onderwerpen, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel60
  - number: '60.4'
    text: |-
      De houder verstrekt de oudercommissie tijdig en desgevraagd schriftelijk alle informatie die deze voor de
      vervulling van zijn taak redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel60
  - number: '61.1'
    text: |-
      Het college van burgemeester en wethouders ziet toe op de naleving van de bij of krachtens [hoofdstuk 3][ref1]
      gestelde regels, onderscheidenlijk de krachtens [artikel 65][ref2] gegeven aanwijzingen en bevelen en de krachtens
      [artikel 66, eerste lid][ref3], gegeven bevelen tot sluiting dan wel de krachtens [artikel 66, tweede lid][ref4],
      uitgevaardigde verboden. Het college van burgemeester en wethouders wijst ambtenaren van de GGD aan als
      toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel66
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel66
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '65'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '61.2'
    text: |-
      Van een aanwijzing als toezichthouder wordt mededeling gedaan in een lokaal verspreid dag-, nieuws- of huis-aan-
      huisblad.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel61
  - number: '61.3'
    text: |-
      Voor zover een kindercentrum of een gastouderbureau in een woning is gevestigd, zijn de toezichthouders ter
      uitvoering van de taken, bedoeld in het eerste lid, bevoegd zonder toestemming van de bewoners in die woning binnen
      te treden.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel61
  - number: '62.1'
    text: |-
      De toezichthouder onderzoekt na een melding als bedoeld in [artikel 45, eerste lid][ref1], binnen een bij regeling
      van Onze Minister te stellen termijn of de exploitatie redelijkerwijs zal plaatsvinden in overeenstemming met het
      bepaalde bij of krachtens [hoofdstuk 3, paragrafen 2][ref2] en [3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '62.2'
    text: |-
      Onverminderd het eerste lid onderzoekt de toezichthouder jaarlijks of de exploitatie van elk kindercentrum of
      gastouderbureau plaatsvindt in overeenstemming met de bij of krachtens [hoofdstuk 3, paragrafen 2][ref1] en
      [3][ref2], gestelde regels, behoudens bijzondere omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '62.3'
    text: |-
      Naast het onderzoek, bedoeld in het eerste en tweede lid, kan de toezichthouder incidenteel onderzoek verrichten
      naar de naleving door een houder van de bij of krachtens [hoofdstuk 3, paragrafen 2][ref1] en [3][ref2], gestelde
      regels. [Artikel 63][ref3] is van overeenkomstige toepassing, tenzij de aard of omvang van het onderzoek zich tegen
      openbare rapportage verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel63
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '63'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '63.1'
    text: |-
      De toezichthouder legt zijn oordeel naar aanleiding van een onderzoek bij een kindercentrum of een gastouderbureau
      vast in een inspectierapport.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel63
  - number: '63.2'
    text: |-
      Indien de toezichthouder oordeelt dat door de houder de bij of krachtens [hoofdstuk 3, paragrafen 2][ref1] en
      [3][ref2], gegeven voorschriften niet zijn of zullen worden nageleefd, vermeldt hij dat in het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '63.3'
    text: |-
      Alvorens het rapport vast te stellen, stelt de toezichthouder de houder in de gelegenheid van het ontwerprapport
      kennis te nemen en daarover zijn zienswijze kenbaar te maken. De toezichthouder vermeldt de zienswijze van de
      houder in een bijlage bij het rapport.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel63
  - number: '63.4'
    text: |-
      De toezichthouder zendt het inspectierapport onverwijld aan de houder, die een afschrift daarvan zo spoedig
      mogelijk ter inzage legt op een voor ouders en personeel toegankelijke plaats.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel63
  - number: '63.5'
    text: De toezichthouder maakt het inspectierapport uiterlijk drie weken na de vaststelling daarvan openbaar.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel63
  - number: '64.1'
    text: |-
      Onze Minister kan beleidsregels stellen omtrent de door de toezichthouder te hanteren werkwijze voor een onderzoek
      als bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel64
  - number: '64.2'
    text: De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel64
  - number: '65.1'
    text: |-
      Het college van burgemeester en wethouders van de gemeente waarin zich een kindercentrum of een gastouderbureau
      bevindt dat de bij of krachtens [hoofdstuk 3, paragrafen 2][ref1] en [3][ref2], gegeven voorschriften niet of in
      onvoldoende mate naleeft, kan de houder een schriftelijke aanwijzing geven.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '65.2'
    text: |-
      In een aanwijzing als bedoeld in het eerste lid geeft het college van burgemeester en wethouders met redenen
      omkleed aan op welke punten de in het eerste lid bedoelde voorschriften niet of in onvoldoende mate worden
      nageleefd, alsmede de in verband daarmee te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel65
  - number: '65.3'
    text: |-
      Indien de toezichthouder oordeelt dat de kwaliteit van de kinderopvang bij een kindercentrum zodanig tekortschiet,
      dat het nemen van maatregelen redelijkerwijs geen uitstel kan lijden, kan de toezichthouder een schriftelijk bevel
      geven. Het bevel heeft een geldigheidsduur van zeven dagen, welke door het college van burgemeester en wethouders
      kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel65
  - number: '65.4'
    text: De houder neemt de maatregelen binnen de bij de aanwijzing onderscheidenlijk het bevel gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel65
  - number: '66.1'
    text: |-
      Het college van burgemeester en wethouders kan de houder verbieden de exploitatie van een kindercentrum of
      gastouderbureau voort te zetten, zolang hij een bevel of aanwijzing niet opvolgt en het toepassen van bestuursdwang
      niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel66
  - number: '66.2'
    text: |-
      Indien uit een onderzoek als bedoeld in [artikel 62][ref1] blijkt dat het kindercentrum of het gastouderbureau
      naar verwachting niet dan wel niet langer aan de bij of krachtens [hoofdstuk 3, paragraaf 2][ref2], gegeven
      voorschriften zal voldoen, kan het college van burgemeester en wethouders zolang die situatie zich voordoet, de
      houder verbieden dat kindercentrum in exploitatie te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '67.1'
    text: |-
      Het college van burgemeester en wethouders stelt jaarlijks op een door Onze Minister te bepalen tijdstip
      een verslag vast van alle werkzaamheden die hij en de toezichthouders in het kader van dit hoofdstuk in het
      voorafgaande kalenderjaar hebben verricht. Het college zendt het verslag aan de gemeenteraad en een afschrift
      daarvan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel67
  - number: '67.2'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de in het verslag op te nemen gegevens.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel67
  - number: '68.1'
    text: 'Onze Minister houdt toezicht op:'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel68
  - number: 68.1.a
    text: |-
      de rechtmatigheid van de uitvoering van de bij of krachtens dit hoofdstuk en [hoofdstuk 6][ref1] gestelde regels
      door het college van burgemeester en wethouders;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '6'
  - number: 68.1.b
    text: |-
      de doeltreffendheid van de uitvoering van de bij of krachtens dit hoofdstuk en [hoofdstuk 6][ref1] gestelde regels
      door het college van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '6'
  - number: '68.2'
    text: |-
      Het toezicht, bedoeld in het eerste lid, wordt onder gezag van Onze Minister uitgeoefend door de Inspectie
      Werk en Inkomen, genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      onder leiding van het hoofd van die inspectie. De [artikelen 37][ref2], [38][ref3], [42][ref4] en
      [44 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel44
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '42'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '44'
  - number: '68.3'
    text: |-
      Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering de bij of krachtens dit hoofdstuk
      en [hoofdstuk 6][ref1] gestelde regels ernstige tekortkomingen constateert, aan het college van burgemeester en
      wethouders, nadat het gedurende acht weken in de gelegenheid is gesteld zijn zienswijze naar voren te brengen, een
      aanwijzing geven. Hij treedt daarbij niet in de besluitvorming inzake individuele gevallen. In een aanwijzing wordt
      een termijn opgenomen waarbinnen het college van burgemeester en wethouders de uitvoering in overeenstemming heeft
      gebracht met de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '6'
  - number: '69.1'
    text: |-
      Het college van burgemeester en wethouders en de gemeenteraad verstrekken desgevraagd binnen een door Onze Minister
      te stellen termijn alle gegevens en inlichtingen die hij voor het toezicht nodig heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel69
  - number: '69.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de wijze waarop het college van
      burgemeester en wethouders de in het eerste lid bedoelde gegevens en inlichtingen verzamelen en verstrekken.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel69
  - number: '69.3'
    text: De gegevens en inlichtingen, bedoeld in het eerste lid, worden kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel69
  - number: '70'
    text: |-
      Onze Minister stelt jaarlijks een verslag vast van de werkzaamheden die hij in het kader van dit hoofdstuk in
      het voorafgaande kalenderjaar heeft verricht. Hij zendt afschrift van het verslag aan de Tweede Kamer der Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel70
  - number: '72.1'
    text: 'Het college van burgemeester en wethouders kan:'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel72
  - number: 72.1.a
    text: |-
      de houder die een verplichting als bedoeld bij of krachtens [hoofdstuk 3][ref1], een aanwijzing onderscheidenlijk
      een bevel als bedoeld in [artikel 65][ref2] of [artikel 5:20 van de Algemene wet bestuursrecht][ref3] niet nakomt
      dan wel handelt in strijd met een verbod krachtens [artikel 66][ref4], een bestuurlijke boete opleggen van ten
      hoogste € 45 000;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel66
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '65'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 72.1.b
    text: |-
      de houder die een verplichting als bedoeld in [artikel 28, vierde lid][ref1], niet nakomt een bestuurlijke boete
      opleggen van ten hoogste € 5000;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel28
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 72.1.c
    text: |-
      de ouder die een verplichting als bedoeld in [artikel 28, eerste tot en met derde lid][ref1], niet nakomt een
      bestuurlijke boete opleggen van ten hoogste € 2269.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel28
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '72.2'
    text: |-
      De hoogte van de bestuurlijke boete wordt afgestemd op de ernst van de overtreding, de mate waarin de overtreding
      de natuurlijke persoon of rechtspersoon verweten kan worden en de omstandigheden waarin die persoon verkeert.
      Van het opleggen van een bestuurlijke boete wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid
      ontbreekt.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel72
  - number: '72.3'
    text: |-
      In afwijking van het eerste lid kan de overtreding van de houder niet met een bestuurlijke boete worden afgedaan,
      indien de overtreding opzettelijk of roekeloos geschiedt en een direct gevaar voor de gezondheid of de veiligheid
      van personen tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel72
  - number: '72.4'
    text: Het bedrag, bedoeld in het eerste lid, komt toe aan de gemeente.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel72
  - number: '73.1'
    text: Het college van burgemeester en wethouders legt geen bestuurlijke boete op, indien de overtreder is overleden.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel73
  - number: '73.2'
    text: |-
      Bij overlijden van de overtreder vervalt een opgelegde bestuurlijke boete voor zover de geldsom nog niet is
      betaald.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel73
  - number: '74'
    text: |-
      Het college van burgemeester en wethouders legt geen bestuurlijke boete op, indien aan de overtreder wegens
      dezelfde gedraging reeds eerder een bestuurlijke boete is opgelegd, dan wel een kennisgeving als bedoeld in
      [artikel 80, tweede lid][ref1], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel80
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '80'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '75.1'
    text: |-
      Het college van burgemeester en wethouders legt geen bestuurlijke boete op, indien tegen de overtreder wegens
      dezelfde gedraging:
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel75
  - number: 75.1.a
    text: een strafvervolging is ingesteld en het onderzoek ter terechtzitting is begonnen, of
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel75
  - number: 75.1.b
    text: |-
      het recht tot strafvordering is vervallen ingevolge [artikel 74][ref1]
      of [74c van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74c
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 74c
  - number: '75.2'
    text: |-
      Indien de gedraging tevens een strafbaar feit is, wordt zij aan het openbaar ministerie voorgelegd, tenzij met het
      openbaar ministerie is overeengekomen, dat daarvan kan worden afgezien.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel75
  - number: '75.3'
    text: |-
      Voor een gedraging die aan het openbaar ministerie moet worden voorgelegd, legt het college van burgemeester en
      wethouders slechts een bestuurlijke boete op indien:
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel75
  - number: 75.3.a
    text: het openbaar ministerie heeft medegedeeld van strafvervolging tegen de overtreder af te zien of,
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel75
  - number: 75.3.b
    text: |-
      sedert het voorleggen van de gedraging dertien weken zijn verstreken en geen reactie van het openbaar ministerie
      is ontvangen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel75
  - number: '76.1'
    text: |-
      De bevoegdheid van het college van burgemeester en wethouders tot het opleggen van een bestuurlijke boete vervalt
      vijf jaren, nadat de overtreding heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel76
  - number: '76.2'
    text: |-
      Indien tegen de door het college van burgemeester en wethouders opgelegde bestuurlijke boete bezwaar wordt
      gemaakt of beroep wordt ingesteld, wordt de vervaltermijn opgeschort tot onherroepelijk op het bezwaar of beroep
      is beslist.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel76
  - number: '77.1'
    text: |-
      Het college van burgemeester en wethouders en de voor de overtreding bevoegde toezichthouder kunnen van de
      overtreding een rapport opmaken.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel77
  - number: '77.2'
    text: 'Het rapport is gedagtekend en vermeldt:'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel77
  - number: 77.2.a
    text: de naam van de overtreder;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel77
  - number: 77.2.b
    text: de overtreding alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel77
  - number: 77.2.c
    text: zo nodig een aanduiding van de plaats waar en het tijdstip waarop de overtreding is geconstateerd;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel77
  - number: 77.2.d
    text: de feiten en omstandigheden op grond waarvan is vastgesteld dat een overtreding is begaan;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel77
  - number: 77.2.e
    text: |-
      de verklaring van degene, bedoeld in [artikel 78][ref1], indien afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel78
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '78'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '77.3'
    text: |-
      Een afschrift van het rapport wordt uiterlijk bij de bekendmaking van de beschikking tot oplegging van de
      bestuurlijke boete aan de overtreder toegezonden of uitgereikt.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel77
  - number: '77.4'
    text: |-
      Indien van de overtreding een proces-verbaal als bedoeld in [artikel 152 van het Wetboek van Strafvordering][ref1],
      is opgemaakt, treedt dit voor de toepassing van deze paragraaf in de plaats van het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel152
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '152'
  - number: '77.5'
    text: |-
      Aan degene die van de overtreding een rapport heeft opgemaakt, wordt geen mandaat verleend tot het opleggen van de
      bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel77
  - number: '78'
    text: |-
      Degene die aan een handeling van het college van burgemeester en wethouders of van een ingevolge [artikel 61][ref1]
      aangewezen ambtenaar redelijkerwijs de gevolgtrekking kan verbinden dat aan hem een bestuurlijke boete zal worden
      opgelegd, is niet verplicht ten behoeve van deze oplegging inlichtingen over de overtreding te verstrekken. De
      overtreder wordt hierop gewezen alvorens hem mondeling wordt gevraagd inlichtingen te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel61
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '79.1'
    text: |-
      Het college van burgemeester en wethouders stelt de overtreder desgevraagd in de gelegenheid kennis te nemen van de
      gegevens waarop het opleggen van de bestuurlijke boete, dan wel het voornemen daartoe berust en daarvan afschriften
      te vervaardigen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel79
  - number: '79.2'
    text: |-
      Indien blijkt dat de verdediging van de overtreder dit redelijkerwijs vergt, draagt het college van burgemeester
      en wethouders er zoveel mogelijk zorg voor dat deze gegevens aan de overtreder worden medegedeeld in een voor hem
      begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel79
  - number: '80.1'
    text: |-
      Indien het college van burgemeester en wethouders voornemens is een boete op te leggen, geeft hij de overtreder
      daarvan kennis onder de vermelding van de gronden waarop het voornemen berust en overlegging van het rapport.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel80
  - number: '80.2'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt het college van burgemeester en
      wethouders de overtreder in de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te
      brengen voordat de boete wordt opgelegd. Het college van burgemeester en wethouders zorgt voor bijstand door een
      tolk, indien blijkt dat de verdediging van de overtreder dit redelijkerwijs vergt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.1
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.1
  - number: '80.3'
    text: |-
      Het college van burgemeester en wethouders kan toepassing van het tweede lid achterwege laten voor zover de persoon
      reeds eerder in de gelegenheid is gesteld zijn zienswijze naar voren te brengen en zich sindsdien geen nieuwe
      feiten of omstandigheden hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel80
  - number: '80.4'
    text: |-
      Indien het college van burgemeester en wethouders, nadat de overtreder zijn zienswijze naar voren heeft gebracht,
      beslist dat voor de overtreding geen bestuurlijke boete zal worden opgelegd, of de overtreding alsnog aan het
      openbaar ministerie zal worden voorgelegd, wordt dit schriftelijk aan de overtreder medegedeeld.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel80
  - number: '81.1'
    text: |-
      Het college van burgemeester en wethouders beslist omtrent het opleggen van de bestuurlijke boete binnen dertien
      weken na de dagtekening van het rapport.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel81
  - number: '81.2'
    text: |-
      De beslistermijn wordt opgeschort met ingang van de dag waarop de gedraging aan het openbaar ministerie is
      voorgelegd, tot de dag waarop het bestuursorgaan bevoegd wordt een bestuurlijke boete op te leggen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel81
  - number: '82.1'
    text: Het college van burgemeester en wethouders legt de bestuurlijke boete op bij beschikking.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel82
  - number: '82.2'
    text: 'De beschikking vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel82
  - number: 82.2.a
    text: de naam van de overtreder;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel82
  - number: 82.2.b
    text: de te betalen geldsom;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel82
  - number: 82.2.c
    text: de overtreding ter zake waarvan zij is gegeven, onder verwijzing naar het desbetreffende wettelijke voorschrift.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel82
  - number: '82.3'
    text: |-
      Op verzoek van de overtreder die de beschikking wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende
      begrijpt, draagt het college van burgemeester en wethouders er zoveel mogelijk zorg voor dat de inhoud van de
      beschikking aan die persoon wordt medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel82
  - number: '83.1'
    text: |-
      Een bestuurlijke boete wordt betaald binnen zes weken na inwerkingtreding van de beschikking waarbij deze is
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel83
  - number: '83.2'
    text: |-
      De bestuurlijke boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de
      bekendmaking van de beschikking zes weken zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel83
  - number: '83.3'
    text: |-
      Indien niet is betaald binnen de in het eerste lid genoemde termijn, wordt degene aan wie de bestuurlijke boete
      is opgelegd, schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, verhoogd met de kosten van de
      aanmaning, te betalen. De aanmaning bevat de aanzegging dat de bestuurlijke boete, voor zover deze binnen de in de
      aanmaning gestelde termijn niet wordt voldaan, wordt ingevorderd overeenkomstig het vierde lid.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel83
  - number: '83.4'
    text: |-
      Bij gebreke van betaling binnen de in het derde lid genoemde termijn, kan het college van burgemeester en
      wethouders de verschuldigde bestuurlijke boete, verhoogd met de op de aanmaning en invordering betrekking hebbende
      kosten, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel83
  - number: '83.5'
    text: |-
      Het dwangbevel wordt op kosten van degene die de boete verschuldigd is, bij deurwaardersexploot betekend en levert
      een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '83.6'
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      gemeente.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel83
  - number: '83.7'
    text: |-
      Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevorderd anders beslist.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel83
  - number: '83.8'
    text: |-
      Het verzet kan niet worden gegrond op de stelling dat de beschikking, bedoeld in [artikel 82][ref1], niet is
      ontvangen of dat de bij die beschikking opgelegde bestuurlijke boete ten onrechte of voor een te hoge geldsom is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel82
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '82'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '83.9'
    text: De bevoegdheid tot invordering vervalt na verloop van twee jaar na de dag waarop de overtreding is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel83
  - number: '83.10'
    text: De beslissing om een bestuurlijke boete in te vorderen stuit de termijn, bedoeld in het negende lid.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel83
  - number: '84'
    text: |-
      Indien een bestuurlijke boete ten onrechte door het college van burgemeester en wethouders is opgelegd, wordt
      de betaalde geldsom, vermeerderd met de wettelijke rente, binnen zes weken nadat is vastgesteld dat de boete ten
      onrechte is vastgesteld, aan de rechthebbende terugbetaald.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel84
  - number: '86'
    text: 'Het Uitvoeringsinstituut werknemersverzekeringen kan:'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel86
  - number: 86.a
    text: |-
      aan de ouder die een verplichting gesteld in [artikel 33][ref1] niet nakomt,
      een bestuurlijke boete opleggen met overeenkomstige toepassing van de
      [artikelen 29a tot en met 29g van de Wet op de arbeidsongeschiktheidsverzekering][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel29a
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '33'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 29a
  - number: 86.b
    text: |-
      aan de houder die een verplichting gesteld in [artikel 33, vierde lid][ref1],
      niet nakomt een bestuurlijke boete opleggen met overeenkomstige toepassing van de
      [artikelen 72, eerste lid, onder b, en tweede tot en met vierde lid][ref2], en de
      [artikelen 73 tot en met 84][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel73
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '33'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '72'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '73'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '87.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor een periode van ten hoogste vier jaar ten behoeve van experimenten,
      die ten doel hebben de totstandkoming van innovatieve kinderopvang mogelijk te maken, vormen van kinderopvang
      worden aangewezen en kunnen regels worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel87
  - number: 87.1.a
    text: de kwaliteit van de aan te wijzen vormen van kinderopvang;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel87
  - number: 87.1.b
    text: het toezicht op de naleving van de regels, bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel87
  - number: 87.1.c
    text: |-
      de hoogte van de kinderopvangtoeslag en de hoogte van de tegemoetkomingen van de gemeente en van het
      Uitvoeringsinstituut werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel87
  - number: 87.1.d
    text: de duur van de aan te wijzen vormen van kinderopvang als experiment.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel87
  - number: '87.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid heeft een ouder als bedoeld in de [artikelen 6][ref1],
      [22][ref2], [29][ref3] of [35][ref4] aanspraak op een kinderopvangtoeslag in de door hem of zijn partner te betalen
      kosten jegens het Rijk onderscheidenlijk aanspraak op een tegemoetkoming in de door hem of zijn partner te betalen
      kosten van kinderopvang jegens de gemeente of jegens het Uitvoeringsinstituut werknemersverzekeringen, indien het
      betreft een experimentele vorm van kinderopvang, welke is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel35
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0017017
        artikel: '35'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '87.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen experimenten als bedoeld in het eerste lid na afloop van de looptijd
      worden voortgezet tot een structurele regeling is getroffen, doch niet langer dan met een tijdsduur van ten hoogste
      twee jaar. Het eerste en tweede lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel87
  - number: '88.1'
    text: |-
      Onze Minister zendt na overleg met Onze Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn en
      Sport uiterlijk zes maanden voor de beëindiging van een experiment, als bedoeld in [artikel 87][ref1], een verslag
      over de doeltreffendheid en de effecten ervan alsmede een standpunt inzake de voortzetting van de desbetreffende
      regeling, anders dan als experiment, aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel87
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '87'
        hoofdstuk: '6'
  - number: '88.2'
    text: |-
      Indien een experiment als bedoeld in [artikel 87][ref1], eerder wordt beëindigd dan de bij algemene maatregel van
      bestuur, bedoeld in het eerste lid van dat artikel, daarvoor gestelde duur, zendt Onze Minister na overleg met Onze
      Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn en Sport, in afwijking van het eerste lid,
      uiterlijk twee maanden na de beëindiging van dat experiment een verslag over de doeltreffendheid en de effecten
      ervan alsmede een standpunt inzake de voortzetting van de desbetreffende regeling, anders dan als experiment, aan
      de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel87
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '87'
        hoofdstuk: '6'
  - number: '89'
    text: |-
      Een voordracht voor een krachtens dit hoofdstuk vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel89
  - number: '90.1'
    text: |-
      Het college van burgemeester en wethouders neemt in het register, bedoeld in [artikel 46][ref1], de kindercentra en
      gastouderbureaus op die op het tijdstip van inwerkingtreding van de Wet kinderopvang blijkens een door de betrokken
      gemeente verstrekte verklaring of vergunning voldoen aan de krachtens de [Welzijnswet 1994][ref2] gestelde eisen
      met betrekking tot de kwaliteit, zoals deze wet luidde voor 1 januari 2005. [Artikel 46][ref3] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0006705
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel46
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006705
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '90.2'
    text: |-
      Een houder van een kindercentrum of gastouderbureau als bedoeld in het eerste lid verstrekt desgevraagd aan
      het college de gegevens, bedoeld in [artikel 45, tweede lid][ref1]. [Hoofdstuk 5][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017017
        hoofdstuk: '5'
  - number: '90.3'
    text: |-
      Personen die op het tijdstip van inwerkingtreding van de Wet kinderopvang werkzaam zijn bij een kindercentrum
      of bij een gastouderbureau dan wel gastouders die op dat tijdstip gastouderopvang bieden door tussenkomst van
      een gastouderbureau, leggen aan de houder binnen twee maanden na de inwerkingtreding een verklaring over als
      bedoeld in [artikel 50, tweede lid][ref1]. Voor de toepassing van de eerste volzin wordt met een verklaring als
      bedoeld in [artikel 50, tweede lid][ref2], gelijkgesteld een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0002195
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002195
  - number: '91'
    text: |-
      De verplichting van [artikel 70][ref1] geldt voor het eerst over het kalenderjaar volgend op het kalenderjaar
      waarop dat artikel in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel70
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '70'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '92'
    text: |-
      De verplichting van [artikel 59][ref1] geldt voor een houder die op het tijdstip van inwerkingtreding van deze wet
      een kindercentrum of een gastouderbureau exploiteert eerst zes maanden na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel59
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '59'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '93.1'
    text: |-
      [Hoofdstuk 2][ref1] en [artikel 86][ref2] zijn gedurende ten hoogste zes maanden na het tijdstip van hun
      inwerkingtreding niet van toepassing op een ouder als bedoeld in [artikel 6, eerste lid, onder h en i][ref3],
      die gebruik maakt van kinderopvang die door het Uitvoeringsinstituut werknemersverzekeringen ten behoeve van
      die ouder is bekostigd op grond een vóór het tijdstip van inwerkingtreding van deze wet gesloten schriftelijke
      overeenkomst als bedoeld in [artikel 74, eerste lid, van de Werkloosheidswet][ref4] respectievelijk
      [artikel 22a, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel74
      [ref5]: https://wetten.overheid.nl/BWBR0009565#Artikel22a
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0017017
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '86'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '74'
      - id: ref5
        bwb_id: BWBR0009565
        artikel: 22a
  - number: '93.2'
    text: |-
      Op de financiering van kinderopvang, bedoeld in het eerste lid, blijven de
      [artikelen 74 van de Werkloosheidswet][ref1] onderscheidenlijk [22a][ref2], [34 tot en met 37][ref3],
      [45 tot en met 47][ref4] en [53 van de Wet op de (re)integratie arbeidsgehandicapten][ref5], zoals deze artikelen
      luidden tot het tijdstip van inwerkingtreding van deze wet, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel22a
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0009565#Artikel45
      [ref5]: https://wetten.overheid.nl/BWBR0009565#Artikel53
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: 22a
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '34'
      - id: ref4
        bwb_id: BWBR0009565
        artikel: '45'
      - id: ref5
        bwb_id: BWBR0009565
        artikel: '53'
  - number: '97'
    text: |-
      Ten aanzien van voor het tijdstip van inwerkingtreding van de Wet kinderopvang door het Rijk en gemeenten op grond
      van de [Welzijnswet 1994][ref1] verleende subsidies en uitkeringen aan kinderopvang, voorzover dat kinderopvang
      betreft waarop deze wet van toepassing is, blijft het bepaalde bij of krachtens de [Welzijnswet 1994][ref2],
      zoals dat laatstelijk voor 1 januari 2005 luidde, van toepassing op de financiële verantwoording, vaststelling en
      uitbetaling van die subsidies en uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0006705
      [ref2]: https://wetten.overheid.nl/BWBR0006705
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0006705
      - id: ref2
        bwb_id: BWBR0006705
  - number: '113.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen, het college van burgemeester en wethouders en de gemeenteraad
      verstrekken aan Onze Minister de inlichtingen die hij voor de statistiek, de informatievoorziening en de
      beleidsvorming met betrekking tot deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel113
  - number: '113.2'
    text: |-
      Onze Minister stelt regels omtrent de aard van de inlichtingen, bedoeld in het eerste lid, en de wijze waarop deze
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel113
  - number: '113.3'
    text: De inlichtingen, bedoeld in het eerste lid, worden kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel113
  - number: '114'
    text: |-
      De voordracht voor een krachtens [artikel 7, tweede, derde en vierde lid][ref1], vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '115.1'
    text: |-
      Onze Minister brengt na overleg met Onze Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn en
      Sport gedurende drie jaar na de inwerkingtreding van deze wet jaarlijks aan de Staten-Generaal een verslag uit over
      de werking ervan.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel115
  - number: '115.2'
    text: |-
      Onze Minister brengt na overleg met Onze Minister van Financiën en Onze Minister van Volksgezondheid, Welzijn en
      Sport drie jaar na de inwerkingtreding van deze wet, en vervolgens telkens na drie jaar, aan de Staten-Generaal een
      verslag uit over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel115
  - number: '116.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende paragrafen,
      artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel116
  - number: '116.2'
    text: |-
      De [artikelen 1, onder b, 3°][ref1], [2, negende lid, tweede volzin][ref2], [2a, tweede lid][ref3], en 3c, van de
      [Wet klachtrecht cliënten zorgsector][ref4] vervallen op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007414#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007414#Artikel2a
      [ref4]: https://wetten.overheid.nl/BWBR0007414
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0007414
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007414
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007414
        artikel: 2a
      - id: ref4
        bwb_id: BWBR0007414
  - number: '117'
    text: 'Deze wet wordt aangehaald als: Wet kinderopvang.'
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel117
