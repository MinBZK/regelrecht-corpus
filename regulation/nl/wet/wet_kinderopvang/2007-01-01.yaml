  - number: '31.1'
    text: De tegemoetkoming wordt door de ouder aangevraagd bij het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel31
  - number: '31.2'
    text: |-
      De ouder doet bij de aanvraag zo mogelijk opgave van zijn sociaal-fiscaalnummer en dat van zijn partner en van het
      kind waarop de tegemoetkoming betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel31
  - number: '31.3'
    text: Indien de ouder een partner heeft, wordt de aanvraag mede ondertekend door die partner.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel31
  - number: '32'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen maakt zo mogelijk van het sociaal-fiscaalnummer gebruik bij de
      uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel32
  - number: '33.1'
    text: |-
      De ouder verstrekt desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen alle gegevens en inlichtingen
      van hem en zijn partner die voor de aanspraak op en de hoogte van de tegemoetkoming van het Uitvoeringsinstituut
      van belang zijn.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel33
  - number: '33.2'
    text: |-
      De inlichtingen en gegevens, bedoeld in het eerste lid, worden verstrekt binnen een door het Uitvoeringsinstituut
      werknemersverzekeringen te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel33
  - number: '33.3'
    text: |-
      Inlichtingen en gegevens die kunnen leiden tot de vaststelling van een lagere tegemoetkoming worden,
      onmiddellijk na het bekend worden daarvan, door de ouder schriftelijk verstrekt aan het Uitvoeringsinstituut
      werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel33
  - number: '33.4'
    text: |-
      De houder verstrekt desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen alle gegevens en inlichtingen
      die voor de aanspraak van een ouder op de tegemoetkoming van het Uitvoeringsinstituut werknemersverzekeringen van
      belang zijn.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel33
  - number: '34'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de verlening, de voorschotverlening
      en de vaststelling van de tegemoetkoming van het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel34
  - number: '35.1'
    text: |-
      Het college van burgemeester en wethouders kan besluiten dat een ouder, die een persoon is als bedoeld in
      [artikel 6, eerste lid, onder c tot en met f][ref1], voor wie het college van burgemeester en wethouders op grond
      van [artikel 7, eerste lid, aanhef en onder a, of derde lid, tweede volzin, van de Wet werk en bijstand][ref2],
      __REF002___________________________________________________________________________________________________________
      __________________,
      __REF003___________________________________________________________________________________________________________
      ____________, [artikel 30, vijfde lid, onder a, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5]
      of [artikel 72, tweede lid, van de Werkloosheidswet][ref6], verantwoordelijk is voor het ondersteunen bij
      arbeidsinschakeling of die gebruik maakt van een voorziening, gericht op arbeidsinschakeling in het kader van een
      gemengde beroepspraktijk als bedoeld in [artikel 21, eerste lid, van de Wet werk en inkomen kunstenaars][ref7],
      na beëindiging van de aanspraak op grond van [artikel 22][ref8], in aansluiting daarop aanspraak heeft op een
      tegemoetkoming jegens de gemeente. [Artikel 24][ref9] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004044#Artikel34
