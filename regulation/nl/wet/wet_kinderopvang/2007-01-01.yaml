      [artikel 82 van de Wet werk en inkomen naar arbeidsvermogen][ref1] werkzaamheden, gericht op de bevordering van de
      inschakeling in het arbeidsproces als bedoeld in [artikel 42 van die wet][ref2] laat verrichten, of


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel42
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '42'
  - number: 6.1.i.3°
    text: |-
      werkzaamheden op een proefplaats verricht als bedoeld in
      [artikel 65g van de Wet op de arbeidsongeschiktheidsverzekering][ref1],
      [artikel 59h van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2],
      [artikel 67e van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3],
      [artikel 37 van de Wet werk en inkomen naar arbeidsvermogen][ref4] of [artikel 52e van de Ziektewet][ref5],


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel65g
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel59h
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel67e
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel37
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel52e
    url: https://wetten.overheid.nl/BWBR0017017/2007-01-01#Artikel6
