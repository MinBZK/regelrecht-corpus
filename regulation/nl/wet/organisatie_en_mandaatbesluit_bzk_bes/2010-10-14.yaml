preamble:
  text: |-
    Gelet op artikel 47, derde lid, van de Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint
    Eustatius en Saba, artikel 27, vierde lid, van de Veiligheidswet BES, de Wet materieel ambtenarenrecht BES, het
    Organisatiebesluit BZK 2009, het Mandaatbesluit BZK 2009, het Besluit bewapening en overige uitrusting politie BES,
    de Regeling politielegitimatiebewijs BES;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel1
  - number: 1.a
    text: '*Minister:* Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel1
  - number: 1.b
    text: |-
      *directeur-generaal Bestuur en Koninkrijksrelaties:* directeur-generaal Bestuur en Koninkrijksrelaties van het
      Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel1
  - number: 1.c
    text: |-
      *directeur-generaal Veiligheid:* directeur-generaal Veiligheid van het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties;
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel1
  - number: 1.d
    text: |-
      *Rijkswet politie:* [Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028079
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028079
  - number: 1.e
    text: |-
      *Rijksvertegenwoordiger:* Rijksvertegenwoordiger zoals bedoeld in de
      [Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028142
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028142
  - number: '2.1'
    text: |-
      Onverminderd het bepaalde in [artikel 3.23, derde lid van het Organisatiebesluit BZK 2009][ref1] is de Rijksdienst
      Caribisch Nederland een organisatieonderdeel van het directoraat-generaal Bestuur en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0027412#Artikel3
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0027412
        artikel: '3'
  - number: '2.2'
    text: De Rijksdienst Caribisch Nederland staat onder leiding van een directeur.
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel2
  - number: '2.3'
    text: |-
      De Rijksdienst Caribisch Nederland heeft tot taak een structurele bijdrage te leveren aan de uitvoering van
      (Rijks-)taken op Bonaire, Sint Eustatius en Saba door middel van:
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel2
  - number: 2.3.a
    text: |-
      het optreden als loket voor taken die door Nederlandse instanties uitgevoerd worden of die door instanties van
      andere (ei-)landen uitgevoerd worden;
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel2
  - number: 2.3.b
    text: het uitvoeren van taken in opdracht van Nederlandse departementen en (andere) overheidsorganen;
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel2
  - number: 2.3.c
    text: |-
      het uitvoeren van taken in opdracht van Nederlandse instanties die op Bonaire, Sint Eustatius en Saba zelf taken
      gaan uitvoeren en het bieden van bedrijfsvoeringsondersteuning aan Nederlandse departementen en overheidsorganen,
      waaronder de rol van werkgever.
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel2
  - number: '3.1'
    text: |-
      Onverminderd het bepaalde in [artikel 3.34, derde lid, van het Organisatiebesluit BZK 2009][ref1] bestaat het
      directoraat-generaal Veiligheid uit:


      [ref1]: https://wetten.overheid.nl/BWBR0027412#Artikel3
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0027412
        artikel: '3'
  - number: 3.1.a
    text: het korps politie Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel3
  - number: 3.1.b
    text: het brandweerkorps Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel3
  - number: '3.2'
    text: |-
      Onverminderd het bepaalde in [artikel 3.41, tweede lid][ref1], heeft het Bureau Korpsbeheer en relatiebeheer
      agentschappen (KOBRA) van het directoraat-generaal Veiligheid de volgende taken:


      [ref1]: https://wetten.overheid.nl/BWBR0027412#Artikel3
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0027412
        artikel: '3'
  - number: 3.2.a
    text: |-
      het adviseren en ondersteunen van de directeur-generaal bij de uitvoering van diens taken als gemandateerd
      beheerder van het korps politie Bonaire, Sint Eustatius en Saba en van het brandweerkorps Bonaire, Sint Eustatius
      en Saba, alsmede van de functionarissen die op basis van ondermandaat door de directeur-generaal Veiligheid taken
      als gemandateerd beheerder van het korps politie Bonaire, Sint Eustatius en Saba en van het brandweerkorps Bonaire,
      Sint Eustatius en Saba uitvoeren;
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel3
  - number: 3.2.b
    text: |-
      het faciliteren van het korps politie Bonaire, Sint Eustatius en Saba, en het brandweerkorps Bonaire, Sint
      Eustatius en Saba, in de relatie met de beheerder;
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel3
  - number: 3.2.c
    text: |-
      het faciliteren van de beleidsbepaling en kaderstelling ten aanzien van het korps politie Bonaire, Sint Eustatius
      en Saba en het brandweerkorps Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel3
  - number: 3.2.d
    text: |-
      het faciliteren van het korps politie Bonaire, Sint Eustatius en Saba en het brandweerkorps Bonaire, Sint Eustatius
      en Saba, in de relaties met het ministerie.
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel3
  - number: '4.1'
    text: |-
      Onverminderd het bepaalde in de [artikelen 1.2][ref1], [2.1][ref2], [3.2, onderdeel h][ref3], [4.1][ref4],
      [4.11][ref5] en [4.13 van het Mandaatbesluit BZK 2009][ref6] wordt aan de directeur-generaal Bestuur en
      Koninkrijksrelaties mandaat verleend ten aanzien van personele aangelegenheden en aangelegenheden die op het
      terrein van de Rijksdienst Caribisch Nederland zijn gelegen, voor zover deze aangelegenheden naar aard en inhoud
      niet een zodanig gewicht hebben dat zij door de Minister dienen te worden afgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0027413#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027413#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0027413#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0027413#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0027413#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0027413#Artikel4
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027413
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0027413
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0027413
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0027413
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0027413
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0027413
        artikel: '4'
  - number: '4.2'
    text: |-
      Van het mandaat zijn uitgezonderd de bevoegdheden ten aanzien van personele aangelegenheden die betrekking hebben
      op de ambtenaren van politie en het personeel van het brandweerkorps Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel4
  - number: '4.3'
    text: |-
      Ten aanzien van de ondertekening van besluiten en stukken op grond van het mandaat van de directeur-generaal
      Bestuur en Koninkrijksrelaties is het [Mandaatbesluit BZK 2009][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027413
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027413
  - number: '4.4'
    text: |-
      De directeur-generaal Bestuur en Koninkrijksrelaties kan ten aanzien van de bevoegdheden, gemandateerd door het
      eerste lid, ondermandaat verlenen aan de directeur van de Rijksdienst Caribisch Nederland.
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel4
  - number: '4.5'
    text: |-
      De directeur van de Rijksdienst Caribisch Nederland is bevoegd aan de aan hem ondergeschikte functionarissen
      ondermandaat te verlenen ten aanzien van de bevoegdheden waarop het vierde lid is toegepast.
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel4
  - number: '5.1'
    text: |-
      Onverminderd het bepaalde in de [artikelen 1.2][ref1], [2.1][ref2], [3.2, onderdeel h][ref3], [4.1][ref4],
      [4.11][ref5] en [4.13 van het Mandaatbesluit BZK 2009][ref6] wordt aan de directeur-generaal Veiligheid mandaat
      verleend ten aanzien van aangelegenheden op het terrein van het beheer van het korps politie Bonaire, Sint
      Eustatius en Saba en van het brandweerkorps Bonaire, Sint Eustatius en Saba, voor zover deze aangelegenheden naar
      aard en inhoud niet een zodanig gewicht hebben dat zij door de Minister dienen te worden afgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0027413#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0027413#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0027413#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0027413#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0027413#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0027413#Artikel4
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0027413
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0027413
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0027413
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0027413
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0027413
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0027413
        artikel: '4'
  - number: '5.2'
    text: |-
      Van het mandaat van de directeur-generaal Veiligheid zijn met betrekking tot het beheer van het korps politie
      Bonaire, Sint Eustatius en Saba en van het brandweerkorps Bonaire, Sint Eustatius en Saba uitgesloten de
      bevoegdheden op grond van de [artikelen 44, tweede lid][ref1], en [48, vierde lid, van de Rijkswet politie][ref2],
      de [artikelen 22, eerste lid][ref3], [23, vierde lid][ref4], en [29, tweede lid, van de Veiligheidswet BES][ref5]
      en [artikel 8s Besluit rechtspositie korps politie BES][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0028079#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0028586#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0028586#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0028586#Artikel29
      [ref6]: https://wetten.overheid.nl/BWBR0028767#Artikel8s
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0028079
        artikel: '48'
      - id: ref3
        bwb_id: BWBR0028586
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0028586
        artikel: '23'
      - id: ref5
        bwb_id: BWBR0028586
        artikel: '29'
      - id: ref6
        bwb_id: BWBR0028767
        artikel: 8s
  - number: '6.1'
    text: 'Het mandaat van de directeur-generaal Veiligheid strekt zich in ieder geval uit tot:'
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel6
  - number: 6.1.a
    text: |-
      besluitvorming tot benoeming, bevordering, schorsing en ontslag van ambtenaren van politie van het politiekorps
      Bonaire, Sint Eustatius;
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel6
  - number: 6.1.b
    text: |-
      de beëdiging van ambtenaren van politie van het korps politie Bonaire, Sint Eustatius en Saba en van personeel van
      het brandweerkorps Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel6
  - number: 6.1.c
    text: |-
      het uitreiken, registreren en innemen van politielegitimatiebewijzen als bedoeld in de
      [Regeling politielegitimatiebewijs BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028800
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028800
  - number: 6.1.d
    text: |-
      het vertegenwoordigen van de Minister namens de Staat der Nederlanden in gerechtelijke procedures met betrekking
      tot een personele aangelegenheid van het korps politie Bonaire, Sint Eustatius en Saba en van het brandweerkorps
      Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel6
  - number: 6.1.e
    text: |-
      het verrichten van een verzoek om bijstand voor de handhaving van de openbare orde op grond van
      [artikel 38 Rijkswet politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel38
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '38'
  - number: 6.1.f
    text: |-
      het namens de korpsbeheerder voeren van het overleg als bedoeld in
      [artikel 48, vijfde lid van de Rijkswet politie][ref1] met de procureur-generaal en de korpschef over het beheer
      van de politie;


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel48
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '48'
  - number: 6.1.g
    text: |-
      besluitvorming tot het aanstellen, bevorderen, schorsen en ontslaan van het personeel van het brandweerkorps
      Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel6
  - number: 6.1.h
    text: |-
      het stellen van regels met betrekking tot het dragen, het onderhoud en het
      in een inbraakvrije ruimte bewaren van de wapens en munitie, bedoeld in de
      [artikelen 2 tot en met 11 van het Besluit bewapening en overige uitrusting politie BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028588#Artikel2
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028588
        artikel: '2'
  - number: 6.1.i
    text: |-
      het sluiten van dienstverleningsovereenkomsten met de directeur van de Rijksdienst Caribisch Nederland ten behoeve
      van het politiekorps en van het brandweerkorps.
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel6
  - number: '6.2'
    text: |-
      De directeur-generaal Veiligheid kan ten aanzien van de bevoegdheden genoemd in het eerste lid, onderdeel a tot
      en met h, en in [artikel 5][ref1], ondermandaat verlenen aan de Rijksvertegenwoordiger, de korpschef van het
      politiekorps of de algemeen commandant van het brandweerkorps.


      [ref1]: https://wetten.overheid.nl/BWBR0028832#Artikel5
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028832
        artikel: '5'
        paragraaf: '4'
  - number: '6.3'
    text: |-
      De Rijksvertegenwoordiger, de korpschef van het politiekorps en de algemeen commandant van het brandweerkorps zijn
      bevoegd aan de aan hun ondergeschikte functionarissen ondermandaat te verlenen ten aanzien van de bevoegdheden
      waarop het tweede lid is toegepast.
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel6
  - number: '6.4'
    text: |-
      Onverminderd het bepaalde in het tweede lid is de directeur van de Rijksdienst Caribisch Nederland namens de
      directeur-generaal Veiligheid in diens hoedanigheid van gemandateerd korpsbeheerder bevoegd tot de ondertekening
      van besluiten die voortvloeien uit de bevoegdheden genoemd in het eerste lid onderdelen a en g.
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel6
  - number: '7.1'
    text: |-
      In afwijking van het [Mandaatbesluit BZK 2009][ref1] vindt ondertekening van besluiten en stukken op grond van
      het mandaat van de directeur-generaal Veiligheid met betrekking tot het beheer van het korps politie Bonaire, Sint
      Eustatius en Saba plaats op de volgende wijze: De beheerder van het Korps Politie Bonaire, Sint Eustatius en Saba,
      namens deze, de directeur-generaal Veiligheid van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties,
      (handtekening) (naam)


      [ref1]: https://wetten.overheid.nl/BWBR0027413
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027413
  - number: '7.2'
    text: |-
      In afwijking van het [Mandaatbesluit BZK 2009][ref1] vindt ondertekening van besluiten en stukken op grond van het
      mandaat van de directeur-generaal Veiligheid met betrekking tot het beheer van het brandweerkorps Bonaire, Sint
      Eustatius en Saba plaats op de volgende wijze: De beheerder van het brandweerkorps Bonaire, Sint Eustatius en Saba,
      namens deze, de directeur-generaal Veiligheid van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties,
      (handtekening) (naam)


      [ref1]: https://wetten.overheid.nl/BWBR0027413
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027413
  - number: '8'
    text: |-
      Dit besluit treedt in werking met ingang van 10 oktober 2010 om 00:00 uur in Bonaire, Sint Eustatius en Saba en om
      06.00 uur in het Europese deel van Nederland. Indien de Staatscourant waarin dit besluit wordt geplaatst, daarna
      wordt uitgegeven, treedt het in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin
      het wordt geplaatst en werkt het terug tot het in de eerste volzin bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel8
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Organisatie- en mandaatbesluit BZK-BES.'
    url: https://wetten.overheid.nl/BWBR0028832/2010-10-14#Artikel9
