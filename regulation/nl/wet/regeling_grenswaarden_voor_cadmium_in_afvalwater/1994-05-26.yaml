$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.3/schema.json
$id: regeling_grenswaarden_voor_cadmium_in_afvalwater
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '1994-05-26'
bwb_id: BWBR0006648
url: https://wetten.overheid.nl/BWBR0006648/1994-05-26
preamble:
  text: |-
    Gelet op richtlijn nr. 83/513/EEG van de Raad van de Europese Gemeenschappen van 26 september 1983 betreffende
    grenswaarden en kwaliteitsdoelstellingen voor lozingen van cadmium (PbEG L 291), alsmede op artikel 1a, eerste,
    tweede en derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1992, 628);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006648/1994-05-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. cadmium: het chemisch element cadmium of het cadmium in cadmiumverbindingen;

      b. verwerken van cadmium: elk industrieel proces waarbij cadmium of cadmium bevattende stoffen worden geproduceerd,
      omgezet of gebruikt, of waarbij cadmium of cadmium bevattende stoffen vrijkomen;

      c. bestaand bedrijf: bedrijf dat cadmium verwerkt, dat op 24 oktober 1983 in werking is en waarvan de capaciteit
      voor het verwerken van cadmium na 24 oktober 1983 niet aanzienlijk is uitgebreid;

      d. nieuw bedrijf: bedrijf dat cadmium verwerkt en geen bestaand bedrijf is;

      e. bijlage I: bij deze regeling behorende bijlage I;

      f. bijlage II: bij deze regeling behorende bijlage II.
    url: https://wetten.overheid.nl/BWBR0006648/1994-05-26#Artikel1
  - number: '2'
    text: |-
      Voor een nieuw bedrijf gelden, als de hoogst toelaatbare gewichtshoeveelheid en concentratie cadmium voorkomend
      in afvalwater dat in oppervlaktewateren wordt gebracht, de grenswaarden die overeenkomen met de waarden die het
      resultaat zijn van toepassing van de beste bestaande technieken, met dien verstande dat voor een nieuw bedrijf
      behorende tot een van de in bijlage I vermelde bedrijfstakken, die gewichtshoeveelheid en concentratie in ieder
      geval niet hoger is dan de in die bijlage opgenomen grenswaarde de op de betrokken bedrijfstak van toepassing is.
    url: https://wetten.overheid.nl/BWBR0006648/1994-05-26#Artikel2
  - number: '3'
    text: |-
      Voor een bestaand bedrijf gelden als de hoogst toelaatbare gewichtshoeveelheid en concentratie cadmium voorkomend
      in afvalwater dat in oppervlaktewateren wordt gebracht:

      a. . indien dat bedrijf behoort tot een van de in bijlage I genoemde bedrijfstakken: de in die bijlage voor die
      bedrijfstak opgenomen grenswaarde;

      b. indien dat bedrijf niet behoort tot een in bijlage I genoemde bedrijfstak: de grenswaarden die overeenkomen met
      de waarden die het resultaat zijn van de toepassing van de beste bestaande technieken.
    url: https://wetten.overheid.nl/BWBR0006648/1994-05-26#Artikel3
  - number: '4'
    text: |-
      De wijze van meting van de gewichtshoeveelheid en concentratie cadmium, bedoeld in de artikelen 2 en 3, dient ten
      minste te voldoen aan de in bijlage II daaraan gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006648/1994-05-26#Artikel4
  - number: '5'
    text: |-
      De regeling van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 2 augustus 1985,
      houdende regelen met betrekking tot grenswaarden voor cadmium (Stb. 455) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006648/1994-05-26#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006648/1994-05-26#Artikel6
  - number: '7'
    text: 'Deze regeling kan worden aangehaald als: Regeling grenswaarden voor cadmium in afvalwater.'
    url: https://wetten.overheid.nl/BWBR0006648/1994-05-26#Artikel7
