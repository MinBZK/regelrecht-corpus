$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_grenswaarden_voor_cadmium_in_afvalwater
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2009-12-22'
bwb_id: BWBR0006648
url: https://wetten.overheid.nl/BWBR0006648/2009-12-22
preamble:
  text: |-
    Gelet op richtlijn nr. 83/513/EEG van de Raad van de Europese Gemeenschappen van 26 september 1983 betreffende
    grenswaarden en kwaliteitsdoelstellingen voor lozingen van cadmium (PbEG L 291), alsmede op artikel 1a, eerste,
    tweede en derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1992, 628);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel1
  - number: 1.a
    text: 'cadmium: het chemisch element cadmium of het cadmium in cadmiumverbindingen;'
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel1
  - number: 1.b
    text: |-
      verwerken van cadmium: elk industrieel proces waarbij cadmium of cadmium bevattende stoffen worden geproduceerd,
      omgezet of gebruikt, of waarbij cadmium of cadmium bevattende stoffen vrijkomen;
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel1
  - number: 1.c
    text: |-
      bestaand bedrijf: bedrijf dat cadmium verwerkt, dat op 24 oktober 1983 in werking is en waarvan de capaciteit voor
      het verwerken van cadmium na 24 oktober 1983 niet aanzienlijk is uitgebreid;
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel1
  - number: 1.d
    text: 'nieuw bedrijf: bedrijf dat cadmium verwerkt en geen bestaand bedrijf is;'
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel1
  - number: 1.e
    text: |-
      bijlage I: bij deze regeling behorende [bijlage I][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006648
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006648
  - number: 1.f
    text: |-
      bijlage II: bij deze regeling behorende [bijlage II][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006648
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006648
  - number: 1.g
    text: '*lozen:* brengen van:'
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel1
  - number: 1.g.1°
    text: stoffen in een oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel1
  - number: 1.g.2°
    text: |-
      afvalwater of andere afvalstoffen in een openbaar hemelwaterstelsel, een openbaar ontwateringstelsel, een openbaar
      vuilwaterriool of een andere voorziening voor de inzameling en het transport van afvalwater, of
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel1
  - number: 1.g.3°
    text: |-
      stoffen op een zuiveringtechnisch werk met behulp van een werk niet zijnde een voorziening voor de inzameling en
      het transport van afvalwater.
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 6.3 van het Waterbesluit][ref1] en [artikel 8.40, eerste lid][ref2], in samenhang
      met [artikel 21.6, zesde lid, van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel21
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '21'
  - number: '2'
    text: |-
      Voor een nieuw bedrijf gelden, als de hoogst toelaatbare gewichtshoeveelheid en concentratie cadmium voorkomend in
      afvalwater dat wordt geloosd, de grenswaarden die overeenkomen met de waarden die het resultaat zijn van toepassing
      van de beste bestaande technieken, met dien verstande dat voor een nieuw bedrijf behorende tot een van de in
      bijlage I vermelde bedrijfstakken, die gewichtshoeveelheid en concentratie in ieder geval niet hoger is dan de in
      die bijlage opgenomen grenswaarde de op de betrokken bedrijfstak van toepassing is.
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel2
  - number: '3'
    text: |-
      Voor een bestaand bedrijf gelden als de hoogst toelaatbare gewichtshoeveelheid en concentratie cadmium voorkomend
      in afvalwater dat wordt geloosd:
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel3
  - number: 3.a
    text: |-
      . indien dat bedrijf behoort tot een van de in bijlage I genoemde bedrijfstakken: de in die bijlage voor die
      bedrijfstak opgenomen grenswaarde;
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel3
  - number: 3.b
    text: |-
      indien dat bedrijf niet behoort tot een in bijlage I genoemde bedrijfstak: de grenswaarden die overeenkomen met de
      waarden die het resultaat zijn van de toepassing van de beste bestaande technieken.
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel3
  - number: '4'
    text: |-
      De wijze van meting van de gewichtshoeveelheid en concentratie cadmium, bedoeld in de artikelen 2 en 3, dient ten
      minste te voldoen aan de in bijlage II daaraan gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel4
  - number: '5'
    text: |-
      De regeling van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 2 augustus 1985,
      houdende regelen met betrekking tot grenswaarden voor cadmium (Stb. 455) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel6
  - number: '7'
    text: 'Deze regeling kan worden aangehaald als: Regeling grenswaarden voor cadmium in afvalwater.'
    url: https://wetten.overheid.nl/BWBR0006648/2009-12-22#Artikel7
