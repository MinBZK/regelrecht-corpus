publication_date: '2010-10-01'
valid_from: '2010-10-10'
bwb_id: BWBR0028196
url: https://wetten.overheid.nl/BWBR0028196/2010-10-10
articles:
  - number: '1'
    text: |-
      1 Personen, die niet schrijven kunnen en die verzoekschriften wensen in te dienen bij de bevoegde macht, kunnen
      zich met het verzoekschrift vervroegen bij de gezaghebber van het openbaar lichaam Bonaire, Sint Eustatius of Saba,
      waar zij verblijven,

      2 De gezaghebbers kunnen ambtenaren aanwijzen, die namens hen de in deze wet bedoelde tussenkomst zullen verlenen.
    url: https://wetten.overheid.nl/BWBR0028196/2010-10-10#Artikel1
  - number: '2'
    text: |-
      De in [artikel 1][ref1] genoemde ambtenaar zal, na voorlezing en bekendmaking aan de adressanten van de inhoud van
      het verzoekschrift, hun vragen of het hun verlangen is, het verzoekschrift zo bij de bevoegde macht, aan welke het
      gericht is, in te dienen. Bij bevestigende beantwoording stelt de ambtenaar aan de voet van het verzoekschrift een
      verklaring, luidende:

      «De ondergetekende verklaart, dat voor hem is verschenen een persoon, die volgens zijn/haar verklaring en de
      verklaring van de getuigen: (naam en voornamen) en (naam en voornamen) is genaamd: (naam en voornamen) wonende in
      het openbaar lichaam Bonaire, Sint Eustatius of Saba, die te kennen gaf niet te kunnen schrijven en mitsdien zijn
      tussenkomst tot het indienen van bovenstaand verzoekschrift verzocht.












                  ........................................................







                  (eiland)


                  (datum)





                  De gezaghebber, eventueel:







                  namens deze,


                  (functie)».


      [ref1]: https://wetten.overheid.nl/BWBR0028196#Artikel1
    url: https://wetten.overheid.nl/BWBR0028196/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028196
        artikel: '1'
  - number: '3'
    text: |-
      De ambtenaar draagt, na afgifte aan de adressant van een gedagtekend en ondertekend bewijs van ontvangst, zorg voor
      de verzending van het verzoekschrift aan de bevoegde macht, aan welke het gericht is.
    url: https://wetten.overheid.nl/BWBR0028196/2010-10-10#Artikel3
  - number: '4'
    text: |-
      De in deze wet bedoelde tussenkomst geschiedt kosteloos en de in [artikel 3][ref1] bedoelde bewijzen van ontvangst
      zijn vrij van zegel.


      [ref1]: https://wetten.overheid.nl/BWBR0028196#Artikel3
    url: https://wetten.overheid.nl/BWBR0028196/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028196
        artikel: '3'
  - number: '5'
    text: |-
      Tot gelijke tussenkomst en op de voet van de bepalingen van deze wet zijn, ingeval de belanghebbenden niet
      schrijven kunnen en hun handtekening vereist wordt, bevoegd de notarissen en griffiers bij de rechterlijke macht,
      voor zoveel betreft akten tot hun dienst behorende.
    url: https://wetten.overheid.nl/BWBR0028196/2010-10-10#Artikel5
  - number: '6'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028196/2010-10-10#Artikel6
  - number: '7'
    text: 'Deze wet wordt aangehaald als: Wet ambtelijke bijstand verzoekschriften BES.'
    url: https://wetten.overheid.nl/BWBR0028196/2010-10-10#Artikel7
