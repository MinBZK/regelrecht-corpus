$id: regeling_normen_ter_bepaling_uitslag_zeevisvaartexamens
regulatory_layer: WET
publication_date: '2025-01-17'
valid_from: '1986-10-09'
bwb_id: BWBR0004035
url: https://wetten.overheid.nl/BWBR0004035/1986-10-09
preamble:
  text: |-
    Gelet op artikel 18, eerste lid, van het Examenregelement zeevisvaart (Stb. 1986, 412);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004035/1986-10-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Ter bepaling van de uitslag van de examens, genoemd in het [Examenreglement zeevisvaart][ref1], worden de normen
      toegepast zoals die zijn vermeld in de bij deze regeling behorende bijlage.

      2 Een kandidaat is geslaagd indien hij voor alle vakken van het examen dan wel een deel daarvan, ten minste een zes
      heeft behaald, behoudens de toegestane vijven, vermeld in de voorlaatste horizontale kolom van de bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0003996
    url: https://wetten.overheid.nl/BWBR0004035/1986-10-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003996
  - number: '2'
    text: |-
      In deze regeling wordt verstaan onder ‘vakken’: de genummerde onderdelen van het betreffende examenprogramma, zoals
      die zijn vermeld in de [bijlage bij het Examenreglement zeevisvaart](onbekend).
    url: https://wetten.overheid.nl/BWBR0004035/1986-10-09#Artikel2
  - number: '3'
    text: |-
      De regeling treedt in werking met ingang van de tweede dag na verschijning van de Nederlandse Staatscourant waarin
      zij wordt geplaatst en werkt terug tot en met 1 september 1982.
    url: https://wetten.overheid.nl/BWBR0004035/1986-10-09#Artikel3
  - number: '4'
    text: |-
      De regeling kan worden aangehaald als ‘Regeling normen ter bepaling uitslag zeevisvaartexamens’.

      Deze regeling zal met de bijlage worden geplaatst in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004035/1986-10-09#Artikel4
