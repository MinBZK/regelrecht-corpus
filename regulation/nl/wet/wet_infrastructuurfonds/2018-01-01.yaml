---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_infrastructuurfonds
regulatory_layer: WET
publication_date: '2020-06-17'
valid_from: '2018-01-01'
bwb_id: BWBR0006001
url: https://wetten.overheid.nl/BWBR0006001/2018-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter bevordering van een integraal verkeer- en
    vervoerbeleid een fonds in te stellen voor investeringen in en onderhoud van infrastructuur ten behoeve van het
    verkeer en vervoer van personen en goederen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel1
  - number: 1.b
    text: |-
      fonds: Infrastructuurfonds, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006001#Artikel2
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006001
        artikel: '2'
  - number: 1.c
    text: |-
      meerjarenprogramma: het in [artikel 4][ref1] bedoelde Meerjarenprogramma Infrastructuur en Transport;


      [ref1]: https://wetten.overheid.nl/BWBR0006001#Artikel4
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006001
        artikel: '4'
  - number: 1.d
    text: |-
      infrastructuur: alle onroerende voorzieningen ten behoeve van het verkeer en vervoer van personen en goederen,
      met inbegrip van de daarbij behorende voorzieningen ten behoeve van de verkeersveiligheid en de bescherming van
      het milieu;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel1
  - number: 1.e
    text: |-
      aanleg: aanleg van infrastructuur en verbetering van bestaande infrastructuur voor zover daardoor de effectieve
      capaciteit of de verkeersveiligheid wordt vergroot of wordt bijgedragen aan de bescherming van het milieu;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel1
  - number: 1.f
    text: 'beheer en onderhoud: instandhouding van de gebruiksfunctie van de infrastructuur, met uitzondering van bediening;'
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel1
  - number: 1.g
    text: 'bediening: handelingen nodig voor het gebruik van de infrastructuur en voor het begeleiden van het verkeer;'
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel1
  - number: 1.h
    text: |-
      basisinformatie: het inwinnen, bewerken en verspreiden van gegevens nodig voor het beschrijven, van het verkeer te
      water, van het wegverkeer en van het verkeer over spoorwegen, met het oog op aanleg en gebruik van infrastructuur;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel1
  - number: 1.i
    text: |-
      regionaal openbaar lichaam: een openbaar lichaam als bedoeld in
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
  - number: 1.j
    text: |-
      intermodaal vervoer: vervoer van goederen in de aangeboden laadeenheid door middel van twee of meer
      vervoersmodaliteiten.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel1
  - number: '2.1'
    text: Er is een Infrastructuurfonds.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel2
  - number: '2.2'
    text: 'Het fonds heeft ten doel:'
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel2
  - number: 2.2.a
    text: |-
      de financiering en bekostiging van aanleg, beheer en onderhoud en bediening van infrastructuur, welke door het Rijk
      wordt of zal worden beheerd, alsmede de financiering en bekostiging van daarmee samenhangende basisinformatie en
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel2
  - number: 2.2.b
    text: |-
      de financiering en bekostiging van aanleg, beheer en onderhoud en bediening van infrastructuur, welke niet door het
      Rijk wordt of zal worden beheerd.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het fonds is een begrotingsfonds als bedoeld in [artikel 2.11, eerste lid, van de Comptabiliteitswet 2016][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
  - number: '3.2'
    text: Onze Minister beheert het fonds.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel3
  - number: '3.3'
    text: |-
      De raming van de verplichtingen, de uitgaven en de ontvangsten van het fonds wordt jaarlijks bij afzonderlijke
      begroting vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel3
  - number: '4.1'
    text: |-
      Jaarlijks biedt Onze Minister gelijktijdig met de begroting voor het nieuwe jaar een Meerjarenprogramma
      Infrastructuur en Transport aan de Staten-Generaal aan.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel4
  - number: '4.2'
    text: |-
      De verdeling van de middelen van het fonds ten behoeve van het verkeer en vervoer over afzonderlijke projecten,
      projectpakketten of beleidsterreinen wordt, zo gedetailleerd als redelijkerwijze mogelijk is, aangegeven in het
      meerjarenprogramma voor een periode van vijf jaar. Tevens wordt indicatief en geaggregeerd aangegeven welke groepen
      van projecten of beleidsterreinen in welke mate in de daaropvolgende tien jaar voor financiering en bekostiging uit
      het fonds in aanmerking komen en welke middelen daarvoor vermoedelijk beschikbaar zijn bij ongewijzigd beleid.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel4
  - number: '4.3'
    text: |-
      Het meerjarenprogramma maakt zichtbaar in welke mate in ieder geval de infrastructurele doelstellingen van het
      vigerende Structuurschema Verkeer en Vervoer naderbij worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel4
  - number: '4.4'
    text: |-
      Het meerjarenprogramma verschaft informatie over de uitgaven via de rijksbegroting die worden gedaan om de
      infrastructuur ten behoeve van het verkeer en vervoer zijn functie te kunnen laten vervullen. Het maakt tevens
      zichtbaar welk verband er ten dienste van een doelmatige benutting van infrastructuur ten behoeve van het verkeer
      en vervoer bestaat tussen de via het fonds gefinancierde en bekostigde uitgaven en de daaruit voortvloeiende
      uitgaven via andere hoofdstukken van de rijksbegroting, waaronder de exploitatiesubsidies openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel4
  - number: '4.5'
    text: |-
      Het meerjarenprogramma bevat een verslag van de werking van het fonds in het voorafgaande jaar, voor zover het
      betreft infrastructuur ten behoeve van het verkeer en vervoer.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister houdt bij de opstelling van het meerjarenprogramma rekening met het geldende Structuurschema Verkeer
      en Vervoer, de geldende Nota op de Ruimtelijke Ordening en het geldende nationale milieubeleidsplan.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister stelt de Staten-Generaal schriftelijk op de hoogte van de gevolgtrekkingen die hij aan de
      beraadslagingen in de Staten-Generaal over het meerjarenprogramma verbindt voor de uitvoering van dat
      meerjarenprogramma.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel5
  - number: '5.3'
    text: |-
      Voor de toepassing van deze wet worden gevolgtrekkingen overeenkomstig het tweede lid aangemerkt als onderdeel van
      het meerjarenprogramma.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel5
  - number: '6'
    text: 'De ontvangsten van het fonds zijn:'
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel6
  - number: 6.a
    text: bijdragen ten laste van andere begrotingen van het Rijk;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel6
  - number: 6.b
    text: gelden, verkregen uit de verkoop van onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel6
  - number: 6.c
    text: garantieprovisies;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel6
  - number: 6.d
    text: andere ontvangsten in het kader van het realiseren van de doelen van het fonds.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel6
  - number: '8.1'
    text: |-
      Ten laste van het fonds komen de uitgaven ten behoeve van aanleg, beheer en onderhoud en bediening van
      infrastructuur, welke door het Rijk wordt of zal worden beheerd alsmede de uitgaven ten behoeve van daarmee
      samenhangende basisinformatie.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: '8.2'
    text: 'Uit het fonds kunnen subsidies worden verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: 8.2.a
    text: provincies,
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: 8.2.b
    text: gemeenten,
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: 8.2.c
    text: regionale openbare lichamen,
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: 8.2.d
    text: waterschappen,
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: 8.2.e
    text: andere publiekrechtelijke rechtspersonen, of
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: 8.2.f
    text: privaatrechtelijke rechtspersonen,
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: '8.3'
    text: |-
      Ten laste van het fonds kunnen uitgaven en subsidies worden gebracht ten behoeve van aanleg en beheer en onderhoud
      van infrastructurele werken buiten Nederland doch binnen Europa.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: '8.4'
    text: |-
      Bij algemene maatregel van bestuur wordt aangegeven voor welke categorieën of onderdelen van infrastructuur in
      ieder geval een uitgave kan worden gedaan of een subsidie kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: '8.5'
    text: |-
      Uit het fonds kunnen voorts subsidies worden verstrekt op grond van bij algemene maatregel van bestuur aan te geven
      andere wetten of ministeriële regelingen.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: '8.6'
    text: Ten laste van het fonds komen voorts andere uitgaven in het kader van het bereiken van de doelen van het fonds.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: '8.8'
    text: |-
      Ten laste van het fonds kunnen subsidies in de vorm van garanties worden verstrekt ten behoeve van leningen, aan te
      gaan door in het tweede lid, onderdelen *e* en *f* bedoelde rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: '8.8'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, dat uit het fonds geen uitgaven kunnen worden gedaan
      of subsidies worden verstrekt met betrekking tot bepaalde categorieën of onderdelen van infrastructuur of met
      betrekking tot bepaalde soorten kosten van categorieën of onderdelen van infrastructuur.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: '8.9'
    text: 'Uit het fonds worden geen uitgaven gedaan of subsidies verstrekt ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: 8.9.a
    text: pijpleidingen;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: 8.9.b
    text: militaire doeleinden;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: 8.9.c
    text: |-
      culturele doeleinden, behoudens het algemene rijksbeleid om een bepaald promillage van het bedrag gemoeid met
      aanleg te besteden aan kunstwerken. Bij de algemene maatregel van bestuur, bedoeld in het negende lid, worden
      terzake nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: '8.10'
    text: 'Uit het fonds worden voorts geen uitgaven gedaan of subsidies verstrekt ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: 8.10.a
    text: aanleg en beheer en onderhoud van zeehavens en luchthavens;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: 8.10.b
    text: |-
      zeehaveninfrastructuur, anders dan met het oog op stimulering van kustvaart, binnenvaart, spoorvervoer of
      intermodaal vervoer voor zover tenminste één van de in dit onderdeel genoemde vervoersmodaliteiten is betrokken;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: 8.10.c
    text: |-
      luchthaveninfrastructuur anders dan met het oog op stimulering van intermodaal vervoer voor zover tenminste één van
      de in onderdeel *b* genoemde vervoersmodaliteiten is betrokken.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel8
  - number: '9.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent het verstrekken van subsidies als bedoeld in
      [artikel 8, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006001#Artikel8
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006001
        artikel: '8'
  - number: '9.2'
    text: 'Deze regels omvatten in elk geval bepalingen over:'
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel9
  - number: 9.2.a
    text: de gegevens, die bij een aanvraag moeten worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel9
  - number: 9.2.b
    text: de criteria op grond waarvan subsidies worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel9
  - number: 9.2.c
    text: |-
      de vaststelling van de subsidieplafonds per eventueel onderdeel van de subsidieregeling en de wijze van verdeling
      daarvan;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel9
  - number: 9.2.d
    text: aard en omvang van de activiteiten waarvoor subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel9
  - number: 9.2.e
    text: de verplichtingen van de subsidie-ontvanger;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel9
  - number: 9.2.f
    text: de wijze waarop het bedrag van de subsidie wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel9
  - number: 9.2.g
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel9
  - number: 9.2.h
    text: de betaling van de subsidie en het verlenen van voorschotten;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel9
  - number: 9.2.i
    text: de wijziging van de subsidie;
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel9
  - number: 9.2.j
    text: de tijdsduur van de geldigheid van de eventuele onderdelen van de subsidieregeling.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel9
  - number: '9.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld in het belang van een doelmatige uitvoering van dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister beslist over het doen van een uitgave of het verstrekken van een subsidie ten behoeve van het verkeer
      of vervoer onder inachtneming van het geldende meerjarenprogramma.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel10
  - number: '10.2'
    text: |-
      Verplichtingen ten laste van het fonds voor projecten ten behoeve van het verkeer en vervoer die niet
      als zodanig voor het kalenderjaar zijn voorzien in het meerjarenprogramma, niet zijnde een krachtens
      [artikel 8, tweede lid][ref1], juncto [artikel 9][ref2] verstrekte subsidie worden niet eerder aangegaan dan nadat
      de Staten-Generaal van zodanig voornemen op de hoogte zijn gebracht, voorzover het gaat om verplichtingen groter
      dan € 4 500 000, inclusief de onvermijdelijke doorwerking van die verplichting naar latere jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006001#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006001#Artikel9
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006001
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006001
        artikel: '9'
  - number: 10a
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '11.1'
    text: De Wet op het Rijkswegenfonds (*Stb.* 1965, 30) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel11
  - number: '11.2'
    text: |-
      Verzoeken om teruggaaf van op de voet van de Wet op het Rijkswegenfonds betaalde toeslag op de
      motorrijtuigenbelasting alsmede belastbare feiten, die hebben plaatsgevonden voor het in werking treden van deze
      wet, worden behandeld overeenkomstig de regelen, die tot op dat tijdstip van kracht waren.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel11
  - number: '11.3'
    text: |-
      Het Rijk treedt in de rechten en verplichtingen van het Rijkswegenfonds; de daaruit voortvloeiende vorderingen en
      verplichtingen komen ten goede aan onderscheidenlijk ten laste van het fonds; het Rijk is belast met de liquidatie
      van het Rijkswegenfonds.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel11
  - number: '11.4'
    text: |-
      Het nadelige of batige saldo van het Rijkswegenfonds wordt geboekt ten laste van de begroting van uitgaven
      onderscheidenlijk ten gunste van de begroting van ontvangsten van het fonds.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel11
  - number: '12.1'
    text: |-
      De Wet op het Mobiliteitsfonds (*Stb.* 1988, 657) wordt ingetrokken; [artikel 11, tweede lid][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006001#Artikel11
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006001
        artikel: '11'
  - number: '12.2'
    text: |-
      De vorderingen ten gunste onderscheidenlijk de verplichtingen ten laste van het Mobiliteitsfonds komen ten goede
      aan onderscheidenlijk ten laste van het fonds; [artikel 11, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006001#Artikel11
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006001
        artikel: '11'
  - number: '12.3'
    text: |-
      Op aanvragen om een bijdrage als bedoeld in artikel 5 van de Wet op het Mobiliteitsfonds, waarop bij het in werking
      treden van deze wet nog niet is beslist, wordt beslist overeenkomstig de regelen, die tot op dat tijdstip van
      kracht waren.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel12
  - number: '12.4'
    text: |-
      Beroepen tegen beslissingen op aanvragen waarop bij het in werking treden van deze wet nog niet is beslist, alsmede
      beroepen tegen beslissingen als bedoeld in het derde lid, worden behandeld overeenkomstig de regelen, die tot op
      dat tijdstip van kracht waren.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel12
  - number: '13.1'
    text: |-
      De artikelen 48 en 49 van de Wet personenvervoer (*Stb.* 1987, 175) vervallen; [artikel 12, tweede lid][ref1] is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006001#Artikel12
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006001
        artikel: '12'
  - number: '13.3'
    text: |-
      Op aanvragen om een bijdrage als bedoeld in artikel 48 van de Wet personenvervoer, waarop bij het in werking treden
      van deze wet nog niet is beslist, wordt beslist overeenkomstig de regelen, die tot op dat tijdstip van kracht
      waren.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel13
  - number: '13.4'
    text: |-
      Beroepen tegen beslissingen op aanvragen waarop bij het in werking treden van deze wet nog niet is beslist, alsmede
      beroepen tegen beslissingen als bedoeld in het tweede lid, worden behandeld overeenkomstig de regelen, die tot op
      dat tijdstip van kracht waren.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel13
  - number: '15.1'
    text: |-
      Een krachtens [artikel 8][ref1] of 9 vastgestelde algemene maatregel van bestuur treedt niet eerder in werking
      dan twee maanden na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt
      onverwijld mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006001#Artikel8
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006001
        artikel: '8'
  - number: '15.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op ministeriële regelingen vastgesteld krachtens
      [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006001#Artikel9
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006001
        artikel: '9'
  - number: '15.3'
    text: |-
      Het eerste en tweede lid vindt geen toepassing voor de algemene maatregel van bestuur en de ministeriële
      regelingen, die tegelijk met deze wet in werking treden.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel15
  - number: '16'
    text: Deze wet treedt in werking met ingang van 1 januari 1994.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel16
  - number: '17'
    text: Deze wet kan worden aangehaald als Wet Infrastructuurfonds.
    url: https://wetten.overheid.nl/BWBR0006001/2018-01-01#Artikel17
