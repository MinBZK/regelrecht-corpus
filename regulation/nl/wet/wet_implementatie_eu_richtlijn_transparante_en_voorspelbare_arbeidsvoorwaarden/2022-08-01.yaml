preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is Boek 7 van het Burgerlijk Wetboek, de Wet flexibel
    werken, de Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie en de Overgangswet nieuw Burgerlijk
    Wetboek aan te passen in verband met de implementatie van Richtlijn (EU) 2019/1152 van het Europees Parlement en de
    Raad van 20 juni 2019 betreffende transparante en voorspelbare arbeidsvoorwaarden in de Europese Unie (PbEU 2019,
    L 186);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0046903/2022-08-01#ArtikelAanhef
articles:
  - number: V
    text: Deze wet treedt in werking met ingang van 1 augustus 2022.
    url: https://wetten.overheid.nl/BWBR0046903/2022-08-01#ArtikelV
  - number: VI
    text: 'Deze wet wordt aangehaald als: Wet implementatie EU-richtlijn transparante en voorspelbare arbeidsvoorwaarden.'
    url: https://wetten.overheid.nl/BWBR0046903/2022-08-01#ArtikelVI
