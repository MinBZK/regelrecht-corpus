$id: wedervergeldingswet_zeescheepvaart
regulatory_layer: WET
publication_date: '2023-05-10'
valid_from: '2013-01-01'
bwb_id: BWBR0003104
url: https://wetten.overheid.nl/BWBR0003104/2013-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen vast te stellen in het belang van de
    verdediging van de economische belangen van de Nederlandse koopvaardij en met het oog op de uitvoering van een
    internationale afspraak of een besluit van een volkenrechtelijke organisatie betrekking hebbende op het vervoer
    ter zee;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: Onze Minister: Onze Minister
      van Verkeer en Waterstaat; College: het College van Beroep voor het bedrijfsleven; zeeschip: een zeeschip in
      de zin van artikel 2, eerste lid, van Boek 8 van het Burgerlijk Wetboek; Nederlands zeeschip: een zeeschip
      dat voldoet aan de vereisten van [artikel 311 van het Wetboek van Koophandel][ref1] of is ingeschreven in het
      rompbevrachtingsregister, genoemd in [artikel 2 van de Wet nationaliteit zeeschepen in rompbevrachting][ref2]
      (*Stb.* 1992, 541).


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311
      [ref2]: https://wetten.overheid.nl/BWBR0005681#Artikel2
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '311'
      - id: ref2
        bwb_id: BWBR0005681
        artikel: '2'
  - number: '2.1'
    text: |-
      Indien de verdediging van de economische belangen van de Nederlandse koopvaardij, dan wel een internationale
      afspraak of een besluit van een volkenrechtelijke organisatie betrekking hebbende op het vervoer ter zee
      zulks naar Ons oordeel vereist, kunnen Wij bij algemene maatregel van bestuur, in deze wet verder genoemd
      wedervergeldingsbesluit:
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel2
  - number: 2.1.a
    text: verbieden, zonder vergunning van Onze Minister
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel2
  - number: 2.1.a.1°
    text: |-
      als gezagvoerder van een zeeschip, varende onder een bij die maatregel aangewezen vlag, met dat zeeschip goederen
      te vervoeren over Nederlandse wateren;
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel2
  - number: 2.1.a.2°
    text: |-
      als eigenaar van een onderneming opzettelijk te bewerkstelligen, dat goederen worden vervoerd met een zeeschip,
      varende onder een bij die maatregel aangewezen vlag;
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel2
  - number: 2.1.a.3°
    text: |-
      een Nederlands zeeschip ter uitvoering van een overeenkomst van huur en verhuur, rompbevrachting of tijdbevrachting
      ter beschikking te stellen van een natuurlijke of rechtspersoon, gevestigd in een bij die maatregel aangewezen
      land;
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel2
  - number: 2.1.b
    text: |-
      een heffing vaststellen, door Onze Minister op te leggen volgens een bij die maatregel te bepalen tarief, op
      zeeschepen die over Nederlandse wateren varen onder een bij die maatregel aangewezen vlag.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij een wedervergeldingsbesluit kan worden bepaald, dat het besluit mede van toepassing is ten aanzien van
      zeeschepen, varende onder een andere dan de bij het besluit aangewezen vlag, welk ingevolge een overeenkomst van
      huur en verhuur, rompbevrachting of tijdbevrachting ter beschikking staan van een natuurlijke of rechtspersoon,
      gevestigd in het land van die aangewezen vlag, indien van de zijde van dat land aan die schepen dezelfde
      voorrechten worden verleend als aan schepen varende onder de vlag van dat land.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel2
  - number: '2.3'
    text: |-
      Een verbod of heffing, als bedoeld in het eerste lid, onder *a*, 1° of *b*, is niet van toepassing ten aanzien van
      een schip, dat zich in Nederlandse wateren bevindt uitsluitend
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel2
  - number: 2.3.a
    text: in doorvaart, of
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel2
  - number: 2.3.b
    text: wegens gevaar voor de veiligheid van het schip of de opvarenden, of
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel2
  - number: 2.3.c
    text: wegens gevaar voor leven of gezondheid van de opvarenden, of
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel2
  - number: 2.3.d
    text: voor het ondergaan van onderhouds- of herstelwerkzaamheden of het innemen van bunkervoorraad of proviand.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel2
  - number: '2.4'
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een wedervergeldingsbesluit wordt Ons gedaan door
      Onze Minister in overeenstemming met Onze Ministers van Buitenlandse Zaken, van Economische Zaken, van Landbouw en
      Visserij en voor Ontwikkelingssamenwerking.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      Een wedervergeldingsbesluit, zomede een besluit tot wijziging of intrekking daarvan, treedt niet eerder in werking
      dan twee maanden na de datum van uitgifte van het *Staatsblad*, waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel3
  - number: '3.2'
    text: |-
      Een wedervergeldingsbesluit vervalt, behoudens eerdere intrekking, drie jaren na het inwerkingtreden, tenzij bij
      nadere wet anders wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister kan van een bij een wedervergeldingsbesluit gesteld verbod of vastgestelde heffing vrijstelling en,
      op aanvraag, ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel4
  - number: '4.2'
    text: |-
      Een besluit tot verlening van een vrijstelling, zomede een besluit tot wijziging of intrekking daarvan, wordt door
      Onze Minister vastgesteld in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw en Visserij.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel4
  - number: '5'
    text: |-
      De vergunningen, vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend. Aan de vergunningen,
      vrijstellingen en ontheffingen kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel5
  - number: '6'
    text: |-
      Bij of krachtens een wedervergeldingsbesluit kan worden bepaald, welke gegevens bij het aanvragen van een
      vergunning of een ontheffing dienen te worden verstrekt. Onder de gegevens, waarvan de verstrekking wordt
      voorgeschreven, kunnen over te leggen bewijsstukken begrepen zijn.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister kan een vergunning of een ontheffing intrekken, indien de te harer verkrijging verstrekte gegevens
      zo onjuist of onvolledig blijken, dat op de aanvrage een andere beslissing zou zijn genomen, als bij beoordeling
      daarvan de juiste omstandigheden bekend waren geweest.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister kan de vergunningen of ontheffingen, behorende tot een door hem aangewezen groep, gezamenlijk
      intrekken, indien een gewichtige reden dit naar zijn oordeel noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel8
  - number: '8.2'
    text: |-
      Op een besluit krachtens het eerste lid is het bepaalde in [artikel 4, tweede lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003104#Artikel4
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003104
        artikel: '4'
  - number: '9.1'
    text: |-
      Van een krachtens [artikel 2, eerste lid, onder b][ref1], opgelegde heffing wordt door Onze Minister schriftelijk
      mededeling gedaan aan de gezagvoerder van het zeeschip. De mededeling bevat een opgave van de wijze waarop het
      bedrag der heffing is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003104#Artikel2
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003104
        artikel: '2'
  - number: '9.2'
    text: |-
      Met betrekking tot deze heffing is de [Invorderingswet 1990][ref1] van overeenkomstige toepassing waarbij de in het
      vorige lid bedoelde kennisgeving wordt aangemerkt als uitnodiging tot betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004770
  - number: '9.3'
    text: |-
      Het is de gezagvoerder van het zeeschip niet toegestaan naar het buitenland te vertrekken, alvorens de opgelegde
      heffing is betaald of voor de betaling daarvan zekerheid is gesteld.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister kan, wanneer hij overweegt een voordracht tot vaststelling, wijziging of intrekking van een
      wedervergeldingsbesluit te doen en naar zijn oordeel een gewichtige reden een onmiddellijke voorziening vereist, in
      overeenstemming met Onze Ministers van Buitenlandse Zaken, van Economische Zaken, van Landbouw en Visserij en voor
      Ontwikkelingssamenwerking, bij regeling, in deze wet verder genoemd wedervergeldingsregeling, overeenkomstig de in
      overweging zijnde maatregel regelen stellen en in het bestaande besluit vervatte regelen buiten werking stellen.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel10
  - number: '10.2'
    text: |-
      De [artikelen 2, derde lid][ref1], en [4][ref2] tot en met [9][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003104#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003104#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003104#Artikel9
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003104
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003104
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0003104
        artikel: '9'
  - number: '11'
    text: |-
      Een wedervergeldingsregeling blijft, behoudens eerdere intrekking, van kracht totdat een wedervergeldingsbesluit,
      dat hetzelfde onderwerp betreft, in werking treedt, doch uiterlijk tot acht maanden na het in werking treden van
      de wedervergeldingsregeling.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel11
  - number: 11a.1
    text: |-
      Onze Minister kan van een ieder die bij het vervoer op een door hem te omschrijven zeevervoermarkt is betrokken
      de inlichtingen verlangen, die hij nodig acht om te kunnen beoordelen, of aanleiding bestaat tot toepassing van
      [artikel 2][ref1] of [artikel 10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003104#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003104#Artikel10
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003104
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003104
        artikel: '10'
  - number: 11a.2
    text: |-
      Onze Minister kan, indien een internationale afspraak of een besluit van een volkenrechtelijke organisatie
      betrekking hebbende op het vervoer ter zee dit vereist, van een ieder, die bij het vervoer op een door hem te
      omschrijven zeevervoermarkt is betrokken, inlichtingen verlangen die hij nodig acht om te kunnen voldoen aan de in
      die afspraak of dat besluit neergelegde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel11a
  - number: 11b.1
    text: |-
      Onze Minister kan, indien er aanwijsbare omstandigheden zijn, op grond waarvan hij kan vermoeden, dat er aanleiding
      bestaat tot toepassing van artikel 2 of artikel 10, van de naar zijn oordeel bij het vervoer op een door hem te
      omschrijven zeevervoermarkt betrokkenen, inzage van alle boeken en bescheiden verlangen, waarvan hij raadpleging
      nodig acht om zich van het al of niet gegrond zijn van zijn vermoeden te overtuigen.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel11b
  - number: 11b.2
    text: |-
      Onze Minister kan, indien een internationale afspraak of een besluit van een volkenrechtelijke organisatie
      betrekking hebbende op het vervoer ter zee dit vereist, van de naar zijn oordeel bij het vervoer op een door hem te
      omschrijven zeevervoermarkt betrokkenen, inzage van alle boeken en bescheiden verlangen, waarvan hij de raadpleging
      nodig acht om te kunnen voldoen aan in die afspraak of dat besluit neergelegde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel11b
  - number: 11b.3
    text: |-
      Het inzien van de boeken en bescheiden kan hij opdragen aan voor ieder afzonderlijk geval schriftelijk aan te
      wijzen personen.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel11b
  - number: 11b.4
    text: |-
      De in het derde lid bedoelde personen hebben toegang tot elke plaats, voor zover dat redelijkerwijs voor de
      vervulling van hun taak nodig is. Zo nodig verschaffen zij zich toegang, alsmede inzage van boeken en bescheiden,
      met behulp van de sterke arm. Zo nodig verschaffen zij zich toegang, alsmede inzage van boeken en bescheiden met
      behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel11b
  - number: 11c.1
    text: |-
      Een ieder van wie op grond van [artikel 11][ref1] inlichtingen zijn verlangd, is verplicht de verlangde
      inlichtingen volledig en naar waarheid te verstrekken op de wijze en binnen de termijn, door Onze Minister te
      bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0003104#Artikel11a
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0003104
        artikel: 11a
  - number: 11c.2
    text: |-
      Een ieder van wie op grond van [artikel 11][ref1], inzage in boeken en bescheiden is verlangd, is verplicht deze te
      verlenen met inachtneming van de door Onze Minister te geven aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003104#Artikel11b
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0003104
        artikel: 11b
  - number: 11c.3
    text: |-
      Zij, die uit hoofde van hun stand, beroep of ambt tot geheimhouding verplicht zijn, kunnen zich verschonen van het
      geven van inlichtingen, doch uitsluitend voor zover betreft hetgeen hun in hun hoedanigheid is toevertrouwd. Zij
      kunnen voorts inzage van de in [artikel 11][ref1], bedoelde boeken en bescheiden weigeren, voor zover hun plicht
      tot geheimhouding hen daartoe noopt.


      [ref1]: https://wetten.overheid.nl/BWBR0003104#Artikel11b
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0003104
        artikel: 11b
  - number: 11d.1
    text: |-
      Onze Minister kan in de gevallen als bedoeld in [artikel 11][ref1], bij regeling bepalen dat een ieder, die bij het
      vervoer op een door hem te omschrijven zeevervoermarkt is betrokken, verplicht is een daarbij nader te omschrijven
      administratie te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003104#Artikel11b
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0003104
        artikel: 11b
  - number: 11d.2
    text: |-
      Een ieder die ingevolge een regeling op grond van het eerste lid een administratie voert of heeft gevoerd, is
      verplicht de bescheiden, waaruit die administratie bestaat, gedurende twee jaren na het kalenderjaar, waarop zij
      betrekking hebben, in Nederland te bewaren.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel11d
  - number: '15'
    text: |-
      In afwijking van [artikel 8:72, tweede lid, van de Algemene wet bestuursrecht][ref1] werkt een vernietiging vanaf
      het tijdstip, waarop zij wordt uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '16'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling behoeven
      kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel16
  - number: '17'
    text: |-
      Het is verboden terzake van een aanvrage om vergunning of ontheffing onjuiste of onvolledige gegevens te
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel17
  - number: '19'
    text: 'Deze wet kan worden aangehaald als: Wedervergeldingswet zeescheepvaart.'
    url: https://wetten.overheid.nl/BWBR0003104/2013-01-01#Artikel19
