$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_formeel_buitenlandse_vennootschappen
regulatory_layer: WET
publication_date: '2019-04-12'
valid_from: '2010-10-10'
bwb_id: BWBR0009191
url: https://wetten.overheid.nl/BWBR0009191/2010-10-10
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij de wet regels te stellen met betrekking tot naar
    buitenlands recht opgerichte, rechtspersoonlijkheid bezittende kapitaalvennootschappen die hun werkzaamheid geheel
    of nagenoeg geheel in Nederland verrichten en geen werkelijke band hebben met de staat naar welks recht zij zijn
    opgericht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet wordt onder formeel buitenlandse vennootschap verstaan een naar een ander dan Nederlands recht
      opgerichte, rechtspersoonlijkheid bezittende kapitaalvennootschap die haar werkzaamheid geheel of nagenoeg geheel
      in Nederland verricht en voorts geen werkelijke band heeft met de staat waarbinnen het recht geldt waarnaar zij is
      opgericht. In dit artikel worden de landen van het Koninkrijk der Nederlanden en de openbare lichamen Bonaire, Sint
      Eustatius en Saba als staat aangemerkt.
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel1
  - number: '1.2'
    text: |-
      De volgende artikelen van deze wet gelden met uitzondering van [artikel 6][ref1] niet voor vennootschappen waarop
      het recht van een der lidstaten van de Europese Unie of van een staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte van 2 mei 1992 toepasselijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel6
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009191
        artikel: '6'
  - number: '2.1'
    text: |-
      De bestuurders van een formeel buitenlandse vennootschap zijn verplicht ter inschrijving in het handelsregister
      opgave te doen dat de vennootschap aan de omschrijving van [artikel 1][ref1] voldoet en ten kantore van het
      handelsregister neer te leggen een in het Nederlands, Frans, Duits of Engels gesteld authentiek afschrift of
      een door een bestuurder gewaarmerkt afschrift van de akte van oprichting en van de statuten, indien deze in een
      afzonderlijke akte zijn opgenomen. Tevens zijn zij verplicht opgave ter inschrijving te doen van het register
      waarin en het nummer waaronder die vennootschap is ingeschreven en de datum van de eerste registratie. Voorts
      zijn zij verplicht opgave ter inschrijving te doen van de naam, persoonlijke gegevens, indien het een natuurlijk
      persoon betreft, en de woonplaats van de houder van alle aandelen in het kapitaal van de vennootschap of van een
      deelgenoot in een huwelijksgemeenschap of gemeenschap van een geregistreerd partnerschap waartoe alle aandelen in
      het kapitaal van de vennootschap behoren, de aandelen gehouden door de vennootschap of haar dochtermaatschappijen
      niet meegeteld. De bestuurders van een formeel buitenlandse vennootschap zijn verplicht iedere wijziging van
      hetgeen krachtens de wet in het Handelsregister is ingeschreven op te geven met vermelding van de dag waarop zij is
      ingegaan. Verrichtingen op grond van deze wet kunnen niet bij volmacht geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel1
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009191
        artikel: '1'
  - number: '2.2'
    text: |-
      Het handelsregister, bedoeld in het eerste lid, is het handelsregister dat wordt gehouden door de Kamer van
      Koophandel en Fabrieken die overeenkomstig [artikel 18, zesde en zevende lid, van de Handelsregisterwet 2007][ref1]
      bevoegd is tot inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel18
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '18'
  - number: '3.1'
    text: |-
      Alle geschriften, gedrukte stukken en aankondigingen, waarin een formeel buitenlandse vennootschap partij is of die
      van haar uitgaan, met uitzondering van telegrammen en reclames, moeten de volledige naam van de vennootschap, haar
      rechtsvorm, haar statutaire zetel en de plaats van vestiging van de aan haar toebehorende onderneming vermelden,
      alsmede, indien zij krachtens het op haar toepasselijke recht moet zijn ingeschreven in een register, het register
      waarin en het nummer waaronder de vennootschap is ingeschreven en de datum van de eerste registratie. Tevens moet
      zij vermelden onder welk nummer de vennootschap in het handelsregister is ingeschreven en dat de vennootschap een
      formeel buitenlandse vennootschap is. Het is verboden in de geschriften, stukken of aankondigingen een aanduiding
      te gebruiken die in strijd met de waarheid inhoudt dat de onderneming toebehoort aan een Nederlandse rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      Indien melding wordt gemaakt van het kapitaal van de vennootschap, moet in elk geval worden vermeld welk bedrag is
      geplaatst en hoeveel van het geplaatste bedrag is gestort.
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel3
  - number: '3.3'
    text: 'Indien de vennootschap na haar ontbinding blijft voortbestaan, moet aan haar naam worden toegevoegd: in liquidatie.'
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      Het geplaatste kapitaal van een formeel buitenlandse vennootschap en het gestorte
      deel daarvan moeten ten minste het bedrag belopen van het minimumkapitaal, bedoeld in
      [artikel 178, tweede lid, van boek 2 van het Burgerlijk Wetboek][ref1], zoals dit bedrag luidt op het eerste
      tijdstip waarop de vennootschap aan de omschrijving van [artikel 1][ref2] voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel178
      [ref2]: https://wetten.overheid.nl/BWBR0009191#Artikel1
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '178'
      - id: ref2
        bwb_id: BWBR0009191
        artikel: '1'
  - number: '4.2'
    text: |-
      Op het eerste tijdstip waarop de vennootschap aan de omschrijving van [artikel 1][ref1] voldoet, moet haar eigen
      vermogen ten minste het bedrag belopen van het minimumkapitaal als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel1
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009191
        artikel: '1'
  - number: '4.3'
    text: |-
      De bestuurders zijn verplicht tegelijk met de opgave als bedoeld in [artikel 2, eerste lid][ref1], bij het in
      dat artikel bedoelde handelsregister een afschrift neer te leggen van een verklaring van een registeraccountant
      of een accountant-administratieconsulent, inhoudende dat de vennootschap voldoet aan het eerste en tweede lid.
      De [tweede en derde zin van artikel 204a, tweede lid, van boek 2 van het Burgerlijk Wetboek][ref2] zijn van
      overeenkomstige toepassing. De verklaring heeft betrekking op een tijdstip dat niet eerder ligt dan vijf maanden
      voor het eerste tijdstip waarop de vennootschap aan de omschrijving van [artikel 1][ref3] voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel204a
      [ref3]: https://wetten.overheid.nl/BWBR0009191#Artikel1
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009191
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 204a
      - id: ref3
        bwb_id: BWBR0009191
        artikel: '1'
  - number: '4.4'
    text: |-
      De bestuurders zijn naast de vennootschap hoofdelijk aansprakelijk voor elke tijdens hun bestuur
      verrichte rechtshandeling waardoor de vennootschap wordt verbonden in het tijdvak voordat is voldaan aan
      [artikel 2, eerste lid][ref1], en aan het eerste tot en met derde lid van dit artikel, of in enig ander tijdvak
      gedurende hetwelk niet is voldaan aan het eerste lid of het eigen vermogen door uitkeringen aan aandeelhouders of
      inkoop van aandelen daalt onder het bedrag, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel2
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009191
        artikel: '2'
  - number: '5.1'
    text: |-
      Onverminderd het tweede lid is op een formeel buitenlandse vennootschap
      [artikel 10 van boek 2 van het Burgerlijk Wetboek][ref1] van overeenkomstige toepassing. De daarin bedoelde
      verplichtingen rusten op de bestuurders van de vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel10
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '10'
  - number: '5.2'
    text: |-
      De bestuurders zijn verplicht jaarlijks binnen vijf maanden na afloop van het boekjaar, behoudens verlenging van
      deze termijn met ten hoogste zes maanden krachtens een bevoegd, op grond van bijzondere omstandigheden genomen
      besluit, een jaarrekening en een jaarverslag op te maken. Op de jaarrekening, het jaarverslag en de overige
      gegevens is [titel 9 van boek 2 van het Burgerlijk Wetboek][ref1] van overeenkomstige toepassing, met dien
      verstande dat de openbaarmaking ingevolge [artikel 394 van dat boek][ref2] geschiedt door nederlegging ten kantore
      van het handelsregister, bedoeld in [artikel 2, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel394
      [ref3]: https://wetten.overheid.nl/BWBR0009191#Artikel2
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '394'
      - id: ref3
        bwb_id: BWBR0009191
        artikel: '2'
  - number: '5.3'
    text: |-
      De bestuurders zijn verplicht ieder kalenderjaar vóór 1 april van dat jaar ten kantore van het handelsregister
      neer te leggen een bewijs van inschrijving in het register waar de vennootschap krachtens het op haar toepasselijke
      recht moet zijn ingeschreven. Het bewijs mag niet eerder dan vier weken voor de datum van nederlegging zijn
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel5
  - number: '6'
    text: |-
      Ten aanzien van een formeel buitenlandse vennootschap zijn de [artikelen 249][ref1], [260][ref2] en
      [261 van boek 2 van het Burgerlijk Wetboek][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel249
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel260
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel261
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '249'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '260'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '261'
  - number: '7'
    text: |-
      Voor de toepassing van de [artikelen 2][ref1] tot en met [6][ref2] worden met de bestuurders van de vennootschap
      gelijk gesteld degenen die met de dagelijkse leiding van de aan de vennootschap toebehorende onderneming zijn
      belast.


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009191#Artikel6
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009191
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009191
        artikel: '6'
  - number: '11'
    text: |-
      Ten aanzien van vennootschappen die op het tijdstip van inwerkingtreding van deze wet voldoen aan de omschrijving
      van [artikel 1][ref1] geldt:


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel1
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009191
        artikel: '1'
  - number: 11.a
    text: |-
      de opgave ter inschrijving in het handelsregister, bedoeld in [artikel 2][ref1], vindt plaats binnen drie maanden
      na het tijdstip van inwerkingtreding van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel2
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009191
        artikel: '2'
  - number: 11.b
    text: |-
      het geplaatste kapitaal van de vennootschap en het gestorte deel daarvan moeten vanaf het tijdstip waarop de in
      onderdeel a bedoelde opgave ter inschrijving in het handelsregister plaats vindt of had behoren plaats te vinden
      ten minste het bedrag belopen van het minimumkapitaal, bedoeld in [artikel 4, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel4
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009191
        artikel: '4'
  - number: 11.c
    text: |-
      het eigen vermogen van de vennootschap moet op het tijdstip waarop de in onderdeel a. bedoelde opgave ter
      inschrijving in het handelsregister plaats vindt of had behoren plaats te vinden ten minste het bedrag belopen
      van het minimumkapitaal, bedoeld in [artikel 4, eerste lid][ref1]; de in [artikel 4, derde lid][ref2], bedoelde
      verklaring heeft betrekking op een tijdstip dat niet eerder ligt dan vijf maanden voor het hiervoor in dit
      onderdeel bedoelde tijdstip;


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009191#Artikel4
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009191
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009191
        artikel: '4'
  - number: 11.d
    text: |-
      de verplichting tot het opmaken van een jaarrekening en een jaarverslag, bedoeld in [artikel 5, tweede lid][ref1],
      en [artikel 6][ref2] zijn van toepassing ten aanzien van jaarrekeningen en jaarverslagen betreffende boekjaren die
      aanvangen op of na het tijdstip van inwerkingtreding van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009191#Artikel6
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009191
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009191
        artikel: '6'
  - number: 11.e
    text: |-
      [artikel 4, vierde lid][ref1] wordt eerst drie maanden na het tijdstip van inwerkingtreding van deze wet
      toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel4
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009191
        artikel: '4'
  - number: '13'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel13
  - number: '14'
    text: 'Deze wet wordt aangehaald als: Wet op de formeel buitenlandse vennootschappen.'
    url: https://wetten.overheid.nl/BWBR0009191/2010-10-10#Artikel14
