  - number: '5'
    text: |-
      1 Onverminderd het tweede lid is op een formeel buitenlandse vennootschap
      [artikel 10 van boek 2 van het Burgerlijk Wetboek][ref1] van overeenkomstige toepassing. De daarin bedoelde
      verplichtingen rusten op de bestuurders van de vennootschap.

      2 De bestuurders zijn verplicht jaarlijks binnen vijf maanden na afloop van het boekjaar, behoudens verlenging
      van deze termijn met ten hoogste zes maanden krachtens een bevoegd, op grond van bijzondere omstandigheden
      genomen besluit, een jaarrekening en een bestuursverslag op te maken. Op de jaarrekening, het bestuursverslag en
      de overige gegevens is [titel 9 van boek 2 van het Burgerlijk Wetboek][ref2] van overeenkomstige toepassing, met
      dien verstande dat de openbaarmaking ingevolge [artikel 394 van dat boek][ref3] geschiedt door deponering bij het
      handelsregister.

      3 De bestuurders zijn verplicht ieder kalenderjaar vóór 1 april van dat jaar ten kantore van het handelsregister
      neer te leggen een bewijs van inschrijving in het register waar de vennootschap krachtens het op haar toepasselijke
      recht moet zijn ingeschreven. Het bewijs mag niet eerder dan vier weken voor de datum van nederlegging zijn
      afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel394
