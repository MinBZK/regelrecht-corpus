  - number: 11a
    text: |-
      Ten aanzien van vennootschappen afkomstig uit het Verenigd Koninkrijk die op het tijdstip van de terugtrekking van
      het Verenigd Koninkrijk uit de Europese Unie voldoen aan de omschrijving van [artikel 1][ref1] geldt:

      a. de opgave ter inschrijving in het handelsregister, bedoeld in [artikel 2][ref2], vindt plaats binnen drie
      maanden na het tijdstip van de terugtrekking van het Verenigd Koninkrijk uit de Europese Unie;

      b. de verplichting tot het opmaken van een jaarrekening en een bestuursverslag, bedoeld in
      [artikel 5, tweede lid][ref3], en [artikel 6][ref4] zijn van toepassing ten aanzien van jaarrekeningen en
      jaarverslagen betreffende boekjaren die aanvangen op of na het tijdstip van de terugtrekking van het Verenigd
      Koninkrijk uit de Europese Unie;

      c. [artikel 4, tweede lid][ref5] wordt eerst drie maanden na het tijdstip van de terugtrekking van het Verenigd
      Koninkrijk uit de Europese Unie toepasselijk.


