        artikel: '6'
  - number: '11'
    text: |-
      Ten aanzien van vennootschappen die op het tijdstip van inwerkingtreding van deze wet voldoen aan de omschrijving
      van [artikel 1][ref1] geldt:

      a. de opgave ter inschrijving in het handelsregister, bedoeld in [artikel 2][ref2], vindt plaats binnen drie
      maanden na het tijdstip van inwerkingtreding van deze wet;

      b. de verplichting tot het opmaken van een jaarrekening en een bestuursverslag, bedoeld in
      [artikel 5, tweede lid][ref3], en [artikel 6][ref4] zijn van toepassing ten aanzien van jaarrekeningen en
      jaarverslagen betreffende boekjaren die aanvangen op of na het tijdstip van inwerkingtreding van deze wet;

      c. [artikel 4, tweede lid][ref5] wordt eerst drie maanden na het tijdstip van inwerkingtreding van deze wet
      toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel1
