preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij de wet regels te stellen met betrekking tot naar
    buitenlands recht opgerichte, rechtspersoonlijkheid bezittende kapitaalvennootschappen die hun werkzaamheid geheel
    of nagenoeg geheel in Nederland verrichten en geen werkelijke band hebben met de staat naar welks recht zij zijn
    opgericht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009191/2020-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet wordt onder formeel buitenlandse vennootschap verstaan een naar een ander dan Nederlands recht
      opgerichte, rechtspersoonlijkheid bezittende kapitaalvennootschap die haar werkzaamheid geheel of nagenoeg geheel
      in Nederland verricht en voorts geen werkelijke band heeft met de staat waarbinnen het recht geldt waarnaar zij is
      opgericht. In dit artikel worden de landen van het Koninkrijk der Nederlanden en de openbare lichamen Bonaire, Sint
      Eustatius en Saba als staat aangemerkt.

      2 De volgende artikelen van deze wet gelden met uitzondering van [artikel 6][ref1] niet voor vennootschappen waarop
      het recht van een der lidstaten van de Europese Unie of van een staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte van 2 mei 1992 toepasselijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel6
    url: https://wetten.overheid.nl/BWBR0009191/2020-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009191
        artikel: '6'
  - number: '2'
    text: |-
      De bestuurders van een formeel buitenlandse vennootschap zijn verplicht ter inschrijving in het handelsregister
      opgave te doen dat de vennootschap aan de omschrijving van [artikel 1][ref1] voldoet en ten kantore van het
      handelsregister neer te leggen een in het Nederlands, Frans, Duits of Engels gesteld authentiek afschrift of
      een door een bestuurder gewaarmerkt afschrift van de akte van oprichting en van de statuten, indien deze in een
      afzonderlijke akte zijn opgenomen. Tevens zijn zij verplicht opgave ter inschrijving te doen van het register
      waarin en het nummer waaronder die vennootschap is ingeschreven en de datum van de eerste registratie. Voorts
      zijn zij verplicht opgave ter inschrijving te doen van de naam, persoonlijke gegevens, indien het een natuurlijk
      persoon betreft, en de woonplaats van de houder van alle aandelen in het kapitaal van de vennootschap of van een
      deelgenoot in een huwelijksgemeenschap of gemeenschap van een geregistreerd partnerschap waartoe alle aandelen in
      het kapitaal van de vennootschap behoren, de aandelen gehouden door de vennootschap of haar dochtermaatschappijen
      niet meegeteld. De bestuurders van een formeel buitenlandse vennootschap zijn verplicht iedere wijziging van
      hetgeen krachtens de wet in het Handelsregister is ingeschreven op te geven met vermelding van de dag waarop zij is
      ingegaan. Verrichtingen op grond van deze wet kunnen niet bij volmacht geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0009191#Artikel1
    url: https://wetten.overheid.nl/BWBR0009191/2020-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009191
        artikel: '1'
  - number: '3'
    text: |-
      1 Alle geschriften, gedrukte stukken en aankondigingen, waarin een formeel buitenlandse vennootschap partij is of
      die van haar uitgaan, met uitzondering van telegrammen en reclames, moeten de volledige naam van de vennootschap,
      haar rechtsvorm, haar statutaire zetel en de plaats van vestiging van de aan haar toebehorende onderneming
      vermelden, alsmede, indien zij krachtens het op haar toepasselijke recht moet zijn ingeschreven in een register,
      het register waarin en het nummer waaronder de vennootschap is ingeschreven en de datum van de eerste registratie.
      Tevens moet zij vermelden onder welk nummer de vennootschap in het handelsregister is ingeschreven en dat de
      vennootschap een formeel buitenlandse vennootschap is. Het is verboden in de geschriften, stukken of aankondigingen
      een aanduiding te gebruiken die in strijd met de waarheid inhoudt dat de onderneming toebehoort aan een Nederlandse
      rechtspersoon.

      2 Indien melding wordt gemaakt van het kapitaal van de vennootschap, moet in elk geval worden vermeld welk bedrag
      is geplaatst en hoeveel van het geplaatste bedrag is gestort.

      3 Indien de vennootschap na haar ontbinding blijft voortbestaan, moet aan haar naam worden toegevoegd: in
      liquidatie.
    url: https://wetten.overheid.nl/BWBR0009191/2020-02-01#Artikel3
  - number: '4'
    text: |-
      1 Ten aanzien van een formeel buitenlandse vennootschap zijn de [artikelen 9][ref1], [216, derde lid][ref2],
      en [248 van boek 2 van het Burgerlijk Wetboek][ref3] van overeenkomstige toepassing ingeval van uitkeringen aan
      aandeelhouders, inkoop van aandelen en vermindering van het geplaatste kapitaal met terugbetaling op aandelen.

      2 De bestuurders zijn naast de vennootschap hoofdelijk aansprakelijk voor elke tijdens hun bestuur
      verrichte rechtshandeling waardoor de vennootschap wordt verbonden in het tijdvak voordat is voldaan aan
      [artikel 2, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel216
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel248
      [ref4]: https://wetten.overheid.nl/BWBR0009191#Artikel2
    url: https://wetten.overheid.nl/BWBR0009191/2020-02-01#Artikel4
