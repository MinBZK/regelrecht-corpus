preamble:
  text: |-
    Gelet op de artikel 45 van het Besluit luchtwaardigheid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012883/2008-09-11#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder liertechnicus: een persoon die bevoegd is een lier te onderhouden.'
    url: https://wetten.overheid.nl/BWBR0012883/2008-09-11#Artikel1
  - number: '2'
    text: |-
      De eigenaar of houder van een lier is verplicht ervoor te zorgen dat het onderhoud, de revisie en de herstelling
      van de lier zodanig wordt uitgevoerd dat de deugdelijkheid van de lier is gewaarborgd, met inachtneming van het
      gestelde in deze regeling.
    url: https://wetten.overheid.nl/BWBR0012883/2008-09-11#Artikel2
  - number: '3'
    text: |-
      De eigenaar of houder is verplicht:

      a. een onderhoudsprogramma op te stellen en ervoor te zorgen dat het onderhoud wordt uitgevoerd volgens het
      onderhoudsprogramma. In dit onderhoudsprogramma zijn ten minste opgenomen:

      1. de uit te voeren onderhoudswerkzaamheden, waaronder de dagelijkse inspectie;

      2. de tijds- of bedrijfsurenintervallen waarop deze werkzaamheden worden uitgevoerd;

      3. aanwijzingen betreffende revisie en herstelling van aanzienlijke schade. Het onderhoudsprogramma is opgesteld
      volgens de aanwijzingen van de fabrikant van de lier, voor zover deze beschikbaar zijn;

      b. het onderhoudsprogramma te laten uitvoeren door of onder toezicht van een liertechnicus; de dagelijkse inspectie
      kan worden uitgevoerd door een houder van een geldig RPL(G) met de bevoegdverklaring RFI(G) of een door de
      liertechnicus schriftelijk daartoe gemachtigde houder van een geldig RPL(G);

      c. ervoor te zorgen dat de verrichte werkzaamheden aan de lier en de bevindingen daarbij, schriftelijk worden
      vastgelegd en ondertekend door een liertechnicus; voor de dagelijkse inspectie kan dit de houder van een geldig
      RPL(G) met de bevoegdverklaring RFI(G) zijn, of een door de liertechnicus schriftelijk daartoe gemachtigde houder
      van een geldig RPL(G).
    url: https://wetten.overheid.nl/BWBR0012883/2008-09-11#Artikel3
  - number: '4'
    text: De liertechnicus wordt aangewezen door de eigenaar of houder van de lier.
    url: https://wetten.overheid.nl/BWBR0012883/2008-09-11#Artikel4
  - number: '5'
    text: De Minister van Verkeer en Waterstaat kan nadere aanwijzingen geven betreffende het onderhoud van lieren.
    url: https://wetten.overheid.nl/BWBR0012883/2008-09-11#Artikel5
  - number: '6'
    text: Deze regeling treedt in werking met ingang van 15 oktober 2001.
    url: https://wetten.overheid.nl/BWBR0012883/2008-09-11#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Regeling onderhoud lieren 2001.'
    url: https://wetten.overheid.nl/BWBR0012883/2008-09-11#Artikel7
