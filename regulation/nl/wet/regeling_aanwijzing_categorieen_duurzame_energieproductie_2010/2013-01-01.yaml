  - number: '8'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan producenten van hernieuwbare elektriciteit geproduceerd door een
      productie-installatie voor de productie van hernieuwbare elektriciteit uit zonlicht met behulp van fotovoltaïsche
      zonnepanelen met een vermogen:

      a. groter dan of gelijk aan 1,0 kWp en kleiner dan of gelijk aan 15 kWp;

      b. groter dan 15 kWp en kleiner dan of gelijk aan 100 kWp, welke zijn geplaatst op of tegen een gebouw als bedoeld
      in [artikel 1, onderdeel c, van de Woningwet][ref1].

      2 Productie-installaties als bedoeld in het eerste lid, worden aangewezen als productie-installaties als bedoeld in
      de [artikelen 15, vierde lid][ref2], en [56, eerste lid, tweede volzin, van het besluit][ref3].

      3 Aanvragen om subsidie als bedoeld in het eerste lid, onderdeel a, worden ontvangen in de periode van 1 maart 2010
      tot en met 1 november 2010, 17:00 uur.

      4 Aanvragen om subsidie als bedoeld in het eerste lid, onderdeel b, worden ontvangen in de periode van 31 mei 2010
      tot en met 1 november 2010, 17:00 uur. Aanvragen, ingediend via www.agentschapnl.nl/sde in de periode van 18 mei
      2010 tot en met 30 mei 2010, worden geacht te zijn ontvangen op 31 mei 2010.

      5 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat
      is opgenomen in de bij deze regeling behorende [bijlage 2][ref4].

      6 Een gebundelde aanvraag om subsidie als bedoeld in [artikel 56, eerste lid, tweede volzin, van het besluit][ref5]
      wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 3][ref6].

      7 Een aanvraag om subsidie als bedoeld in het vijfde lid en zesde lid, wordt geacht een aanvraag tot het
      verstrekken van een voorschot te zijn, tenzij de aanvrager te kennen geeft een aparte aanvraag tot het verstrekken
      van een voorschot te willen indienen of aangeeft geen voorschot te willen ontvangen.


