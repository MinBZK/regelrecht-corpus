articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *minister:* de Minister van Economische Zaken;
        - *besluit:* het [Besluit stimulering duurzame energieproductie][ref1];
        - *algemene uitvoeringsregeling:* de [Algemene uitvoeringsregeling stimulering duurzame energieproductie][ref2];
        - *gewogen maandelijks rendement:* het rendement, bedoeld in
      [artikel 1, vierde lid, van de Regeling garanties van oorsprong voor duurzame elektriciteit][ref3];
        - *NTA 8003:* 2008: de Nederlandse Technische Afspraak 8003, Classificatie van biomassa voor energietoepassing,
      uitgegeven door het Nederlands Normalisatie-instituut, zoals deze luidde op 31 december 2008;
        - *overige vergisting:* de biologische afbraakreacties van biomassa als bedoeld in de NTA 8003: 2008, met
      uitzondering van de nummers 410, 420, 430, 500, 550 tot en met 559, 587, 592, 600, 610 en 620;
        - *productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van afvalverbranding:* een
      productie-installatie waarmee hernieuwbare elektriciteit wordt geproduceerd uit de warmte die uitsluitend of in
      hoofdzaak is geproduceerd door: 1°. de verbranding van afvalstoffen, 2°. een andere thermische behandeling van
      afvalstoffen dan bedoeld onder 1° ingeval de producten daarvan vervolgens worden verbrand, of 3°. de verbranding
      van producten die voortkomen uit thermische behandeling van afvalstoffen;
        - *productie-installatie voor de productie van hernieuwbare elektriciteit met gebruik van stortgas of biogas uit
      afvalwater- of rioolwaterzuiveringsinstallaties:* een productie-installatie waarmee hernieuwbare elektriciteit
      wordt geproduceerd: 1°. uit gas dat vrijkomt tengevolge van biologische afbraakreacties uit gestorte afvalstoffen,
      of 2°. uit gas dat vrijkomt tengevolge van biologische afbraakreacties bij de zuivering van huishoudelijk
      afvalwater, bedrijfsafvalwater en afvloeiend hemelwater;
        - *productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van waterkracht:* een
      productie-installatie waarmee door hydro-mechanisch-elektrische omzetting hernieuwbare elektriciteit wordt
      geproduceerd uit potentiële dan wel kinetische energie van stromend water dat niet specifiek ten behoeve van de
      elektriciteitsproductie omhoog is gepompt;
        - *productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie op land:*
      een productie-installatie die niet is opgericht in de territoriale zee of in de Nederlandse exclusieve economische
      zone, waarmee hernieuwbare elektriciteit wordt geproduceerd met behulp van windenergie en die geen productie-
      installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie is als bedoeld in
      [artikel 1, onderdeel o, van het besluit][ref4];
        - *productie-installatie voor de productie van hernieuwbaar gas met gebruik van stortgas of biogas uit afvalwater-
      of rioolwaterzuiveringsinstallaties:* een productie-installatie waarmee hernieuwbaar gas wordt geproduceerd:
      1°. uit gas dat vrijkomt tengevolge van biologische afbraakreacties uit gestorte afvalstoffen, of 2°. uit
      gas dat vrijkomt tengevolge van biologische afbraakreacties bij de zuivering van huishoudelijk afvalwater,
      bedrijfsafvalwater en afvloeiend hemelwater;
        - *valhoogte:* het verschil in waterpeil voor en achter de installatie voor de productie van hernieuwbare
      elektriciteit met behulp van waterkracht waarbij het maximaal elektrisch ontwerpvermogen van de turbine of de
      generator wordt gerealiseerd;
        - *thermische conversie van vaste of vloeibare biomassa:* de omzetting van vaste of vloeibare biomassa als bedoeld
      in de NTA 8003: 2008, met uitzondering van biomassa als bedoeld in de nummers 500, 550 tot en met 559, 587 en 592
      van de NTA 8003: 2008, door middel van: 1°. verbranding, 2°. een andere thermische behandeling dan bedoeld onder
      1° ingeval de producten daarvan vervolgens worden verbrand, of 3°. de verbranding van producten die voortkomen uit
      thermische behandeling;
        - *vergisting en co-vergisting van dierlijke mest:* de biologische afbraakreacties van in hoofdzaak verpompbare
      vaste en vloeibare uitwerpselen van dieren, al dan niet aangevuld met een of meer producten genoemd in de
      [Uitvoeringsregeling Meststoffenwet, bijlage Aa][ref5], onderdeel IV;
        - *vergisting van groente-, fruit- en tuinafval:* de biologische afbraakreacties van biomassa als bedoeld in de
      nummers 251, 252, 253, 254, 600, 610, 620 van de NTA 8003:2008;
        - *warmtebenuttingscoëfficiënt:* de hoeveelheid gedurende een kalenderjaar door
      een productie-installatie geproduceerde en nuttig aangewende warmte als bedoeld in
      [artikel 1, eerste lid, onderdeel v, van de Regeling garanties van oorsprong voor duurzame elektriciteit][ref6],
      gedeeld door de hoeveelheid gedurende hetzelfde kalenderjaar geproduceerde en op het elektriciteitsnet ingevoede
      hernieuwbare elektriciteit;
        - *STEG:* een productie-installatie bestaande uit één of meerdere stoom- en gasturbines, waarbij de warmte uit de
      gasturbine uitsluitend of in hoofdzaak wordt aangewend voor de productie van stoom, waarmee achtereenvolgens een
      stoomturbine wordt aangedreven;
        - *industriële processen:* een proces waarbij materiële goederen worden vervaardigd, met uitzondering van de teelt
      van gewassen.


