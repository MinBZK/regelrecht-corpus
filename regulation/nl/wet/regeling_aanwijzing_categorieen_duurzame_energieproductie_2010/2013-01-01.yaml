      1 De minister verstrekt op aanvraag subsidie aan producenten die elektriciteit opwekken in een installatie voor
      hoogrenderende warmtekrachtkoppeling als bedoeld in [artikel 1, onderdeel ab, van de Elektriciteitswet 1998][ref1],
      die voldoet aan de volgende kenmerken:

      a. de installatie is van het type STEG;

      b. de installatie heeft een elektrisch vermogen groter dan 150 MWe;

      c. de installatie is in staat bij maximale productie van nuttige warmte, nuttige warmte en elektriciteit te
      produceren met een verhouding groter of gelijk aan 0,6.

      d. de installatie is in staat in vollastbedrijf bij een minimale verhouding tussen nuttige warmte en elektriciteit
      van 0,6 een besparing op primaire energie op te leveren van ten minste 10% ten opzichte van de referenties van
      gescheiden opwekking als bedoeld in [Richtlijn 2004/8/EG](32004L0008) van het Europees Parlement en de Raad van
      de Europese Unie van 11 februari 2004 inzake de bevordering van warmtekrachtkoppeling op basis van de vraag naar
      nuttige warmte binnen de interne energiemarkt en tot wijziging van [richtlijn 92/94/EEG](31992L0094) (PbEG L 52);

      e. de installatie wordt voor minimaal 90% op aardgas gestookt, en

      f. minimaal 90% van de door de installatie geproduceerde nuttige warmte wordt gebruikt in industriële processen.

      2 Aanvragen om subsidie als bedoeld in het eerste lid, worden ontvangen in de periode van 1 maart 2010 van deze
      regeling tot 31 augustus 2010, 17:00 uur.

      3 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat
      is opgenomen in de bij deze regeling behorende [bijlage 6][ref2].


