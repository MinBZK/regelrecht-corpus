  - number: '29'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan producenten van hernieuwbare elektriciteit geproduceerd door een
      productie-installatie voor de productie van hernieuwbare elektriciteit door:

      a. verbranding van het biogas uit vergisting en co-vergisting van dierlijke mest of de inzet van warmte verkregen
      uit thermische conversie van vaste of vloeibare biomassa met uitzondering van plantaardige en dierlijke restvetten
      en restoliën als bedoeld in de NTA 8003:2008 met nummers 560 tot en met 572 met een nominaal elektrisch vermogen
      kleiner dan of gelijk aan 10 MW;

      b. verbranding van het biogas uit vergisting van groente-, fruit- en tuinafval, waarbij ten hoogste 50 procent van
      de massa bestaat uit biomassastromen als bedoeld in de NTA 8003:2008, met uitzondering van de nummers 410, 420,
      430, 500, 550 tot en met 559, 587 en 592;

      c. verbranding van het biogas uit overige vergisting;

      d. inzet van warmte verkregen uit thermische conversie van vaste of vloeibare biomassa met een nominaal elektrisch
      vermogen kleiner dan of gelijk aan 10 MW;

      e. inzet van warmte verkregen uit thermische conversie van vaste of vloeibare biomassa met een nominaal elektrisch
      vermogen groter dan 10 MW en kleiner dan of gelijk aan 50 MW.

      2 Aanvragen om subsidie als bedoeld in het eerste lid, worden ontvangen in de periode van 1 maart 2010 tot en met 1
      november 2010, 17:00 uur.

      3 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat
      is opgenomen in de bij deze regeling behorende [bijlage 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027115
    url: https://wetten.overheid.nl/BWBR0027115/2013-01-01#Artikel29
