  - number: 3:25
    text: |-
      1 De Minister van Economische Zaken is bevoegd tot betaling van de restitutie, bedoeld in artikel 34, eerste lid,
      van verordening 612/2009.

      2 De aanvraag om betaling van restitutie wordt ingediend bij de Minister van Economische Zaken.

      3 In geval van levering van landbouwproducten in een andere lidstaat legt de belanghebbende tevens een bevestiging
      van het uitgaan van de goederen over.

      4 In geval van levering van landbouwproducten aan boor- en productieplatforms en marine- en hulpschepen legt de
      belanghebbende tevens het leverantiebewijs over.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel325
  - number: 3:26
    text: |-
      1 De Minister van Economische Zaken is bevoegd tot verlening van een erkenning van de houder van onder
      douanetoezicht staande bevoorradingsruimten, als bedoeld in de artikelen 37, tweede lid, en 40, tweede lid, tweede
      alinea, van verordening 612/2009.

      2 Een belanghebbende dient een aanvraag om erkenning als bedoeld in het eerste lid, in bij de Minister van
      Economische Zaken.

      3 De erkenning, bedoeld in het eerste lid, wordt verleend indien is voldaan aan de voorwaarden, bedoeld in artikel
      37, tweede lid, van verordening 612/2009.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel326
  - number: 3:27
    text: |-
      1 De Minister van Economische Zaken is bevoegd een voorschot op de restitutie te verlenen, indien is voldaan aan de
      voorwaarden, bedoeld in artikel 37 van verordening 612/2009.

      2 Een belanghebbende dient een aanvraag om het voorschot, bedoeld in het eerste lid, in bij de Minister van
      Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel327
  - number: 3:28
    text: |-
      De verlening van restitutie voor proviandering van zeeschepen, waaronder ook begrepen al dan niet zelf aangedreven
      werkschepen, kan in het kader van deze paragraaf alleen plaatsvinden indien het schip binnen tien dagen na
      proviandering de haven verlaat met een bestemming die niet dichterbij is gelegen dat het gebied, bedoeld in artikel
      41, eerste lid, onder a, van verordening 612/2009.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel328
  - number: 3:29
    text: |-
      1 De Minister van Economische Zaken is de bevoegde instantie, bedoeld in artikel 40, eerste en tweede lid, van
      verordening 612/2009.

      2 Een belanghebbende kan een aanvraag als bedoeld in artikel 40, tweede lid, van verordening 612/2009 indienen bij
      de Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel329
  - number: 3:30
    text: |-
      1 Levering aan boor- en productieplatforms geschiedt uitsluitend door een door de Minister van Economische Zaken
      erkende exploitant van een bevoorradingsschip of bevoorradingshelikopter.

      2 Een belanghebbende dient een aanvraag om erkenning als bedoeld in het eerste lid, schriftelijk in bij de Minister
      van Economische Zaken.

      3 De Minister van Economische Zaken toetst de aanvraag aan de criteria, bedoeld in artikel 41, tweede lid, onder b,
      tweede streepje, van verordening 612/2009.

      4 De Minister van Economische Zaken is bevoegd tot intrekking van een erkenning indien de belanghebbende niet
      langer voldoet aan de criteria, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel330
  - number: 3:31
    text: |-
      1 De betrokken deelnemer:

      a. bewaart de bewijsstukken, bedoeld in artikel 35, tweede lid, van verordening 612/2009 in zijn administratie ten
      behoeve van de Minister van Economische Zaken, en

      b. dient het bewijs, bedoeld in de artikelen 36, derde lid, eerste alinea, 40, vierde en vijfde lid, of 42, tweede
      lid, van verordening 612/2009 in bij de Minister van Economische Zaken.

      2 Het bewijs, bedoeld in de artikelen 38, tweede lid, eerste alinea, en 40, derde lid, eerste alinea, van
      verordening 612/2009, wordt ingediend bij de bevoegde autoriteit van de lidstaat waar de aangifte ten uitvoer is
      gedaan.

      3 Op verzoek van een belanghebbende kan de Minister van Economische Zaken ermee instemmen dat het bewijs, bedoeld
      in artikel 42, vierde lid, onder a of b, tweede streepje, van verordening 612/2009, wordt geleverd met een door
      de scheepskapitein of een andere scheepsofficier van dienst ondertekend certificaat van ontvangst dat van het
      scheepsstempel is voorzien.

      4 In voorkomend geval kan de Minister van Economische Zaken op verzoek van een belanghebbende ermee instemmen dat
      het bewijs, bedoeld in artikel 42, vierde lid, onder b, tweede streepje, van verordening 612/2009, wordt geleverd
      met een door een beambte van de luchtvaartmaatschappij ondertekend certificaat van ontvangst dat van het stempel
      van de maatschappij is voorzien.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel331
  - number: 3:33
    text: |-
      De Nederlandse Voedsel- en Warenautoriteit is de bevoegde autoriteit, bedoeld in:

      a. artikel 2, onder 8), van verordening (EG) nr. 2173/2005 van de Raad van 20 december 2005 inzake de opzet van een
      FLEGT-vergunningensysteem voor de invoer van hout in de Europese Gemeenschap (PbEU 2005, L 347), en

      b. artikel 2, onder 4, van verordening (EG) nr. 1024/2008 van de Commissie van 17 oktober 2008 tot vaststelling van
      gedetailleerde maatregelen ter uitvoering van Verordening (EG) nr. 2173/2005 van de Raad inzake de opzet van een
      FLEGT-vergunningensysteem voor de invoer van hout in de Europese Gemeenschap (PbEU 2008, L 277).
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel333
  - number: 3:34
    text: |-
      1 De vergunning, bedoeld in artikel 5, eerste lid, van de verordening, genoemd in
      [artikel 3:33, onderdeel a][ref1], wordt ingediend bij de Nederlandse Voedsel- en Warenautoriteit.

      2 Een vergunning als bedoeld in het eerste lid, wordt ingediend ten minste één werkdag voorafgaand aan het moment
      dat de aangifte voor het in het vrije verkeer brengen bij de douane wordt ingediend.


