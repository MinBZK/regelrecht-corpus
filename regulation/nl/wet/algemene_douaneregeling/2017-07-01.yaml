    text: |-
      1 De [artikelen 2:0][ref1], [2:1][ref2], [2:2][ref3] en [2:5][ref4] zijn niet van toepassing op de volgende schepen
      en luchtvaartuigen:

      a. oorlogsschepen en militaire luchtvaartuigen;

      b. pleziervaartuigen;

      c. vissersschepen welke van de visvangst komen en zijn voorzien van een aanduiding omtrent de haven waar zij
      thuishoren;

      d. sleepboten;

      e. vaartuigen voor het verrichten van loodsdiensten;

      f. reddingsboten;

      g. schepen en luchtvaartuigen van de Nederlandse Kustwacht.

      2 Het eerste lid is niet van toepassing indien:

      a. de laatste haven van vertrek van het schip dan wel luchtvaartuig gelegen is buiten het douanegebied van de Unie;

      b. voor het schip, het luchtvaartuig of voor de aan boord aanwezige goederen bij het in het vrije verkeer brengen
      rechten bij invoer, accijns of omzetbelasting is verschuldigd;

      c. op het schip, het luchtvaartuig of op de aan boord aanwezige goederen verboden of beperkingen van toepassing
      zijn of zouden zijn als bedoeld in [artikel 1:1, vijfde lid, van de wet][ref5];

      d. voor het verkrijgen van vrijstelling van rechten bij invoer of voor het plaatsen onder de desbetreffende
      douaneregeling voor het schip, het luchtvaartuig of voor de aan boord aanwezige goederen ingevolge wettelijke
      bepalingen de vervulling van bepaalde formaliteiten is vereist;

      e. het schip dan wel luchtvaartuig niet in de Unie thuishoort; of

      f. het schip dan wel luchtvaartuig niet overeenkomstig haar bestemming wordt gebezigd.

      3 De inspecteur kan toestaan dat, voor zover het de verplichting, bedoeld in [artikel 2:0][ref6], betreft, wordt
      afgeweken van het bepaalde in het tweede lid.


