  - number: 7:25
    text: |-
      Op de omzetbelasting is artikel 104 van Verordening 1186/2009 van overeenkomstige toepassing met dien verstande
      dat geen vrijstelling wordt verleend voor belastingzegels als bedoeld in artikel 104, onderdeel q, van Verordening
      1186/2009.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel725
  - number: 7:26
    text: |-
      1 Op de accijnzen, de omzetbelasting en de verbruiksbelasting van alcoholvrije dranken zijn de artikelen 203 tot
      en met 205 van het Douanewetboek van de Unie, de artikelen 158 tot en met 160 van de Gedelegeerde Verordening
      Douanewetboek van de Unie, de artikelen 253 tot en met 255 van de Uitvoeringsverordening Douanewetboek van de
      Unie alsmede [artikel 7:28][ref1] van overeenkomstige toepassing met dien verstande dat de bepalingen inzake het
      inlichtingenblad INF 3 slechts van toepassing zijn voor zover gelijktijdig aanspraak op vrijstelling van rechten
      bij invoer wordt gemaakt.

      2 Vrijstelling van omzetbelasting voor terugkerende goederen als bedoeld in het eerste lid wordt slechts verleend,
      indien wordt aangetoond dat op de terugkerende goederen omzetbelasting drukt.

      3 Vrijstelling van accijns voor terugkerende goederen als bedoeld in het eerste lid wordt slechts verleend,
      indien wordt aangetoond dat de voorafgaande uitvoer van deze goederen niet heeft plaatsgevonden uit een
      accijnsgoederenplaats dan wel met teruggaaf van accijns.

      4 Vrijstelling van verbruiksbelasting voor terugkerende goederen als bedoeld in het
      eerste lid wordt slechts verleend, indien wordt aangetoond dat de voorafgaande uitvoer
      van deze goederen niet heeft plaatsgevonden vanuit een inrichting als bedoeld in
      [artikel 2, onderdeel b, van de Wet op de verbruiksbelasting van alcoholvrije dranken][ref2] dan wel met teruggaaf
      van verbruiksbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel728
      [ref2]: https://wetten.overheid.nl/BWBR0005802#Artikel2
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel726
