      De verplichtingen die ingevolge [artikel 1:32 van de wet][ref1] bestaan jegens de inspecteur en de ontvanger,
      gelden mede jegens de directeur van de FIOD alsmede jegens de door deze directeur aangewezen ambtenaren van de
      Belastingdienst.


