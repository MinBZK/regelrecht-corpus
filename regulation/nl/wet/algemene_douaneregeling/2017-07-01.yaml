      1 De bijzondere regeling tijdelijke invoer wordt toegestaan voor vervoermiddelen die hier te lande worden
      ingeschreven en te naam gesteld in het kentekenregister en waarvoor een kenteken wordt opgegeven bevattende de
      letters CD, CDJ dan wel de letters BN of GN in combinatie met twee cijfergroepen van elk twee cijfers.

      2 De in het eerste lid bedoelde vervoermiddelen kunnen onder de regeling worden geplaatst zonder schriftelijke
      aanvraag of vergunning.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel48
  - number: 4:9
    text: |-
      1 Met inachtneming van artikel 216, eerste lid, onderdeel a, onderscheidenlijk onderdeel b, van de Gedelegeerde
      Verordening Douanewetboek van de Unie, wordt toegestaan dat vervoermiddelen welke worden betrokken uit een douane-
      entrepot of een ruimte voor tijdelijke opslag onder de regeling tijdelijke invoer worden geplaatst.

      2 Voor vervoermiddelen die in overeenstemming met het eerste lid onder de regeling zijn geplaatst, wordt een
      kenteken opgegeven bevattende de letters BN of GN in combinatie met twee cijfergroepen van elk twee cijfers.

      3 In de gevallen, bedoeld in artikel 216, eerste lid, onderdeel a, van de Gedelegeerde Verordening Douanewetboek
      van de Unie, heeft de tenaamstelling in het kentekenregister een geldigheidsduur van ten hoogste zes maanden.

      4 In de gevallen, bedoeld in artikel 216, eerste lid, onderdeel b, van de Gedelegeerde Verordening Douanewetboek
      van de Unie, heeft de tenaamstelling in het kentekenregister een geldigheidsduur van ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel49
