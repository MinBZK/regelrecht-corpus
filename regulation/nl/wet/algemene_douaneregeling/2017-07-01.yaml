  - number: 6:1a
    text: |-
      1 Het aanbrengen bij het douanekantoor van uitgang, bedoeld in artikel 331, eerste lid, van de
      Uitvoeringsverordening Douanewetboek van de Unie, vindt plaats met een aankomstmelding. In de aankomstmelding
      worden de gegevens opgenomen volgens de in [bijlage IXa][ref1] opgenomen specificaties.

      2 De inspecteur kan toestaan dat wordt afgeweken van het bepaalde in het eerste lid.


