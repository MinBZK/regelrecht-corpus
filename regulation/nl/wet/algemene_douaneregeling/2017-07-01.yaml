      1 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van goederen die bestemd
      zijn voor officieel gebruik – bouwen en herstellen daaronder begrepen – van een diplomatieke of beroepsconsulaire
      vertegenwoordiging in Nederland, genoemd in [bijlage XVII][ref1].

      2 Het bepaalde in [artikel 7:10][ref2] is van overeenkomstige toepassing, met dien verstande dat het hoofd van de
      diplomatieke of beroepsconsulaire vertegenwoordiging in de door hem ondertekende schriftelijke verklaring op de
      aangifte Douane 39 bevestigt dat de goederen voor het officiële gebruik van de vertegenwoordiging bestemd zijn.


