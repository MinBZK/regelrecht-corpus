  - number: 1:5
    text: |-
      1 De algemeen directeur Douane, bedoeld in
      [artikel 4, derde lid, van de Uitvoeringsregeling Belastingdienst 2003][ref1] en de landelijk directeuren en
      directeuren, bedoeld in [artikel 5, eerste lid, van de Uitvoeringsregeling Belastingdienst 2003][ref2], zijn
      ambtenaar als bedoeld in [artikel 11:7 van de wet][ref3].

      2 Als functionarissen als bedoeld in [artikel 10:15 van de wet][ref4] worden aangewezen de ambtenaren van de
      Belastingdienst (contactambtenaren) die door de in het eerste lid aangewezen ambtenaren zijn aangewezen om namens
      hen de bevoegdheid, bedoeld in [artikel 11:7 van de wet][ref5], uit te oefenen.

      3 De algemeen directeur Douane, bedoeld in
      [artikel 4, derde lid, van de Uitvoeringsregeling belastingdienst 2003][ref6], is op grond van
      [artikel 1:28, zesde lid, van de wet][ref7] bevoegd tot het geven van toestemming voor het vorderen van gehele
      ontkleding dan wel het onderzoek van het onderlichaam van degene die aan lijfsvisitatie wordt onderworpen.


