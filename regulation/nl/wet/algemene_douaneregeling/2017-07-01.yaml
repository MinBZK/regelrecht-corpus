      1 Het in het vrije verkeer brengen van textiel- en kledingproducten, van oorsprong uit Noord-Korea en Belarus,
      genoemd in bijlage IV bij [Verordening (EG) nr. 517/94](31994R0517) van de Raad van 7 maart 1994 betreffende
      een gemeenschappelijke regeling voor de invoer van textielproducten uit bepaalde derde landen, die niet
      vallen onder bilaterale overeenkomsten, protocollen of andere regelingen, noch onder een andere, bijzondere,
      communautaire regeling, (PbEG 1994, L 67), zonder vergunning van de Minister voor Buitenlandse Handel en
      Ontwikkelingssamenwerking is verboden.

      2 Het eerste lid geldt niet indien bij het in het vrije verkeer brengen een geldige invoervergunning wordt
      overgelegd, afgegeven door een daartoe bevoegde autoriteit van een andere lidstaat van de Europese Unie.
