  - number: 6:2
    text: |-
      1 Van een schip of luchtvaartuig dat het douanegebied van de Unie over zee of door de lucht zal verlaten, wordt
      aangifte ten uitklaring gedaan.

      2 Van alle goederen geladen in een Nederlandse haven of luchthaven aan boord van het in het eerste lid bedoelde
      schip of luchtvaartuig, wordt eveneens aangifte ten uitklaring gedaan.

      3 De aangifte ten uitklaring, bedoeld in het eerste lid, wordt gedaan door het op elektronische wijze inzenden
      van de generale verklaring (IMO / FAL 1 bij vertrek), zoals voorzien in de bijlage bij de IMO Facilitatie
      Conventie 1965 van de Internationale Maritieme Organisatie (Trb. 1966, 162), respectievelijk de generale
      verklaring luchtvaart, zoals is voorzien in bijlage 9 bij het op 7 december 1944 te Chicago tot stand gekomen
      ICAO verdrag inzake de internationale burgerluchtvaart (Stb. 1947, 165) van de Internationale organisatie voor
      de burgerluchtvaart.

      4 De aangifte ten uitklaring, bedoeld in het tweede lid, wordt gedaan door het op elektronische wijze inzenden
      van het douanemanifest bij uitgang. In het douanemanifest bij uitgang worden de gegevens opgenomen volgens de in
      bijlage IXa opgenomen specificaties.

      5 De aangifte ten uitklaring, bedoeld in het eerste lid, wordt gedaan voor vertrek van het schip of luchtvaartuig.
      De aangifte ten uitklaring, bedoeld in het tweede lid, wordt gedaan binnen 3 kalenderdagen na vertrek van het schip
      of luchtvaartuig.

      6 De inspecteur kan toestaan dat wordt afgeweken van het bepaalde in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel62
  - number: 6:3
    text: |-
      1 Als vaarwaters waarlangs schepen en de daarin of daarop aanwezige goederen het douanegebied van de Unie
      rechtstreeks verlaten, worden aangewezen de vaarwaters, opgenomen in [bijlage II][ref1].

      2 In afwijking van het eerste lid wordt toegestaan dat goederen die over zee het douanegebied van de Unie zullen
      verlaten, worden overgeladen in een schip dat het douanegebied van de Unie zal verlaten.

      3 De toestemming, bedoeld in het tweede lid, wordt slechts verleend voor het overladen van:

      a. provisie of scheepsbehoeften ten behoeve van de bemanning van het schip;

      b. brandstoffen of smeermiddelen bestemd voor de aandrijving of smering van het schip;

      c. goederen welke nodig zijn voor reparatie of vervanging van onderdelen van het schip, mits deze reparatie of
      vervanging noodzakelijk is om het schip zijn reis te kunnen laten voortzetten.

      4 Voor het overladen, bedoeld in het tweede lid, is een vergunning van de inspecteur vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0024291
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel63
