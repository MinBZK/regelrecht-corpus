  - number: 8:1a
    text: |-
      De aanvulling of vervanging van een zekerheid, bedoeld in artikel 97 van het Douanewetboek van de Unie, wordt
      binnen een maand na de mededeling door de ontvanger, dat aanvulling of vervanging van de zekerheid wordt geëist,
      gesteld.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel81a
  - number: 8:2
    text: |-
      Het aanslagbiljet bevat in ieder geval de volgende gegevens:

        - naam, adres en woonplaats van de schuldenaar of belanghebbende;
        - kenmerk en datum van de beschikking;
        - bedrag aan rechten, rente op achterstallen, kosten of bestuurlijke boete;
        - bezwaarclausule.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel82
  - number: 8:3
    text: |-
      1 Voor de berekening van het bedrag aan rechten, andere belastingen, heffingen en retributies wordt een bedrag dat
      dient als grondslag voor die berekening rekenkundig afgerond op centen.

      2 Voor de berekening van het bedrag aan rechten, andere belastingen, heffingen en retributies wordt een hoeveelheid
      die dient als grondslag voor die berekening, zodanig afgerond dat een gedeelte van een kilogram, van een liter of
      van een meter in aanmerking wordt genomen als een heel kilogram, een hele liter of een hele meter.

      3 Indien de eenheid waarover het bedrag aan rechten, andere belastingen, heffingen en retributies moet worden
      berekend minder is dan een kilogram, een liter of een meter, wordt, in afwijking van het tweede lid, een
      hoeveelheid die dient als grondslag voor de berekening, bedoeld in het tweede lid, zodanig afgerond dat een
      gedeelte van 100 gram, van een deciliter of van een decimeter in aanmerking wordt genomen als 100 gram, een hele
      deciliter of een hele decimeter.

      4 Voor de berekening van het bedrag aan rechten, andere belastingen, heffingen en retributies wordt een
      volumepercentage ethylalcohol die dient als grondslag voor die berekening, naar beneden afgerond op tiende percent
      absolute ethylalcohol.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel83
  - number: 8:4
    text: |-
      Indien de hoeveelheid van de goederen kleiner is dan de hoeveelheid waarin het douanetarief is uitgedrukt, wordt
      het bedrag aan rechten naar evenredigheid berekend.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel84
  - number: 8:5
    text: |-
      1 Het bedrag aan rechten, andere belastingen, heffingen, retributies, renten, interesten of kosten van ambtelijke
      werkzaamheden wordt rekenkundig afgerond op centen.

      2 Indien de berekening van het bedrag, bedoeld in het eerste lid, geschiedt aan de hand van een aangifte, wordt elk
      onderdeel van de aangifte overeenkomstig het eerste lid afgerond.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel85
  - number: 8:7
    text: |-
