  - number: 1:8
    text: |-
      1 De inspecteur-generaal van de Nederlandse Voedsel- en Warenautoriteit is inspecteur als bedoeld in
      [artikel 1:3, eerste lid, onderdeel c, van de wet][ref1].

      2 De aanwijzing, bedoeld in het eerste lid, geldt alleen voor de bij of krachtens in het derde lid bedoelde
      wettelijke voorschriften vastgestelde taken. Hierbij kunnen de bevoegdheden, bedoeld in de [artikelen 1:23][ref2],
      [1:24][ref3], [1:25][ref4], [1:27][ref5], [1:31 tot en met 1:34 van de wet][ref6], worden toegepast.

      3 De in het tweede lid bedoelde wettelijke voorschriften zijn de in de [bijlage bij de artikelen 1:1 en 1:3 van
      de wet, onder A](onbekend), bedoelde voorschriften voor zover het voorschriften aangaande onderwerpen betreft die
      vallen onder de reikwijdte van de volgende wettelijke voorschriften en deze wettelijke voorschriften zelf, voor
      zover deze betrekking hebben op goederen en goederenverkeer:

        - [Wet op de gewasbeschermingsmiddelen en biociden][ref7];
        - [Landbouwwet][ref8];
        - [Warenwet][ref9];
        - [Wet grensoverschrijdend vervoer van aan bederf onderhevige levensmiddelen][ref10];
        - [hoofdstuk 3 van het besluit][ref11].


