  - number: 3:16m
    text: |-
      1 Een verwerker die A-producten of B-producten levert aan bedrijfseenheden en die geheel of gedeeltelijk eigenaar,
      vertegenwoordiger, of op enige wijze daarmee vennootschappelijk gelieerd is, stelt de Minister van Economische
      Zaken in de gelegenheid om de productie per week in de bedrijfseenheden te controleren.

      2 Indien het eerste lid van toepassing is:

      a. heeft iedere relevante bedrijfseenheid een boekhouding en een voorraadadministratie die het mogelijk maakt:

      1°. om de wekelijkse productie per week te controleren, en

      2°. om de identiteit en het gebruik van het relevante rundvlees vast te stellen,

      b. meldt iedere relevante bedrijfseenheid uiterlijk binnen de in [artikel 3:16h, eerste lid][ref1], bedoelde
      termijn op welke dagen er A-producten of er B-producten worden verwerkt aan de Nederlandse Voedsel- en
      Warenautoriteit;

      c. houdt iedere relevante bedrijfseenheid op verzoek van de Minister van Economische Zaken de verwerkte A-producten
      of de verwerkte B-producten beschikbaar voor onderzoek, en

      d. zorgt iedere relevante bedrijfseenheid voor identificatie van de desbetreffende productieverpakkingen door
      daarop een gebruikelijke productiecode aan te brengen die niet zonder beschadiging van de verpakking van het
      eindproduct kan worden verwijderd.


