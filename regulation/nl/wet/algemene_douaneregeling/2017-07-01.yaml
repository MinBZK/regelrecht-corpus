      1 De in [artikel 2:3][ref1] bedoelde schepen en luchtvaartuigen, alsmede schepen die over zee van de ene in
      Nederland gelegen haven naar de andere gaan, hoeven bij het verlaten van het douanegebied van de Unie niet te
      worden aangebracht bij een douanekantoor van uitgang.

      2 Het eerste lid is niet van toepassing op schepen en luchtvaartuigen als bedoeld in [artikel 2:3][ref2] indien ter
      zake van de uitvoer, wederuitvoer, dan wel met het oog op de verkrijging van kwijtschelding of terugbetaling van
      rechten bij invoer aan het douanekantoor van uitgang formaliteiten moeten worden vervuld.


