  - number: 2:12
    text: |-
      1 In de gevallen waarin op grond van wettelijke bepalingen in een aangifte de goederencode van de desbetreffende
      goederen moet worden vermeld, is dat de code die voor die goederen is vastgesteld in het gebruikstarief.

      2 Het in het eerste lid bedoelde gebruikstarief is de lijst van goederenomschrijvingen met bijbehorende codes en
      aanduiding van de voor de desbetreffende goederen van toepassing zijnde maatregelen bij in- of uitvoer, zoals die
      geldt ingevolge verordeningen van de Raad van de Europese Unie of de Europese Commissie.

      3 Het in het eerste lid bedoelde gebruikstarief is beschikbaar via internetadres www.douane.nl.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel212
  - number: 2:13
    text: |-
      Indien door de inspecteur een vergunning wordt afgegeven voor het gebruik van de bijzondere regeling douane-
      entrepots wordt in de vergunning bepaald dat, afhankelijk van de aard van de goederen die onder de bijzondere
      regeling douane-entrepots worden geplaatst, de vergunninghouder en het Centraal Bureau voor de Statistiek
      overeenstemming bereiken over de afzonderlijke aanlevering van gegevens ten behoeve van de entrepotstatistiek.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel213
  - number: 2:14
    text: |-
      1 Monsterneming vindt in tweevoud plaats, tenzij de wijze en/of aard van het onderzoek ertoe noopt meerdere
      monsters te nemen, en de monsters worden ter plaatse verpakt en verzegeld.

      2 Indien mogelijk wordt op verzoek van belanghebbende een extra monster genomen, dat ter plaatse wordt verpakt en
      verzegeld en in het bezit van belanghebbende blijft.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel214
  - number: 2:15
    text: |-
      1 De speling, bedoeld in [artikel 1:35 van de wet][ref1], is, indien het een verschil betreft tussen de waarde
      of de hoeveelheid zoals in de aangifte is aangegeven, en de waarde of de hoeveelheid van hetgeen aanwezig is: een
      percent van de waarde of de hoeveelheid van hetgeen aanwezig is.

      2 De speling, bedoeld in het eerste lid, is niet van toepassing:

      a. indien het bevonden verschil niet is ontstaan ten gevolge van dwaling, onwillekeurig verzuim of natuurlijke
      verliezen;

      b. indien het bevonden verschil van invloed is op de berekening van de douaneschuld;

      c. op aantallen colli of losse voorwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel135
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel215
    references:
