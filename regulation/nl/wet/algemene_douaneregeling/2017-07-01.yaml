  - number: 3:16q
    text: |-
      1 Indien de Minister van Economische Zaken op grond van een onderzoek of een tegenonderzoek besluit dat het
      monster niet voldoet aan de voorschriften komt alle bereide hoeveelheid van dat eindproduct dat door of namens een
      verwerker is geproduceerd in de week van monstername niet in aanmerking voor toepassing van verordening 412/2008.

      2 De Minister van Economische Zaken kan besluiten dat een betrokken eindproduct niet in aanmerking komt voor
      toepassing van verordening 412/2008 als een tegenonderzoek van een monster herhaaldelijk andere resultaten oplevert
      dan het onderzoek van een eerder genomen monster.

      3 De kosten die samenhangen met het nemen van monsters, het onderzoeken van monsters, waaronder het verrichten van
      tegenonderzoek, komen voor rekening van de verwerker.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel316q
  - number: 3:17
    text: |-
      Het is verboden te handelen in strijd met de voorschriften, genoemd in de artikelen 16, 19, eerste lid, en 49,
      eerste lid, van verordening 612/2009.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel317
  - number: 3:18
    text: |-
      1 De Minister van Economische Zaken wordt aangewezen als:

      a. de bevoegde instantie, bedoeld in de artikelen 7, vierde lid, 39, eerste lid, en 46, eerste lid, onder b, van
      verordening 612/2009;

      b. de bevoegde autoriteit, bedoeld in de artikelen 27, vierde lid, en 32, eerste en tweede lid, van verordening
      612/2009.

      2 Als bevoegde autoriteit, bedoeld in artikel 5, zevende lid, onder b, en 7, derde lid, tweede alinea, van
      verordening 612/2009 wordt aangewezen het douanekantoor, waar de aangifte ten uitvoer wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel318
  - number: 3:19
    text: |-
      1 Informatie als bedoeld in de artikelen 10, eerste lid, onder b, tweede aandachtsstreepje, 27, eerste lid, derde
      alinea, of 28, eerste lid, vierde alinea, van verordening 612/2009 wordt verstrekt aan de Minister van Economische
      Zaken.

      2 In de gevallen waarin het stellen van zekerheid op grond van een EU-verplichting een voorwaarde is voor de
      toekenning van restitutie, wordt de zekerheid gesteld bij de Minister van Economische Zaken.

      3 Het opleggen van administratieve sancties als bedoeld in artikel 48 van verordening 612/2009, vindt plaats door
      de Minister van Economische Zaken.

      4 Het opleggen van maatregelen als bedoeld in artikel 3, eerste lid, van [Verordening (EG) nr. 1469/95](31995R1469)
      van de Raad van 22 juni 1995 betreffende de maatregelen die moeten worden genomen ten aanzien van bepaalde
      begunstigden van uit het EOFGL, afdeling Garantie, gefinancierde verrichtingen (PbEG 1995, L 145) vindt plaats door
      de Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel319
  - number: 3:20
    text: |-
      De Minister van Economische Zaken is bevoegd te beslissen op een verzoek als bedoeld in artikel 24, eerste lid, van
      verordening 612/2009.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel320
  - number: 3:21
    text: |-
      1 De Minister van Economische Zaken is bevoegd het ontslag te verlenen, bedoeld in artikel 24 van verordening
      612/2009.

      2 Een verzoek als bedoeld in artikel 24, derde lid, van verordening 612/2009 wordt ingediend bij de Minister van
      Economische Zaken.

      3 De Minister van Economische Zaken is bevoegd de beslissingen, bedoeld in artikel 24, vierde lid, van verordening
      612/2009 te nemen.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel321
  - number: 3:22
    text: |-
      1 De Minister van Economische Zaken verleent de erkenning, bedoeld in artikel 18, eerste lid, van verordening
      612/2009.

      2 De Minister van Economische Zaken kan een erkenning als bedoeld in het eerste lid schorsen of intrekken in de
      gevallen, bedoeld in de artikelen 19, eerste lid, en 21, eerste en derde lid, van verordening 612/2009.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel322
  - number: 3:23
    text: |-
      1 De Minister van Economische Zaken is bevoegd tot verlening van de toestemming als bedoeld in artikel 34, eerste
      lid, van verordening 612/2009.

      2 Een belanghebbende dient een schriftelijke aanvraag om de toestemming, bedoeld in het eerste lid, in bij de
      Minister van Economische Zaken.

      3 De in het eerste lid bedoelde toestemming wordt verleend indien de belanghebbende:

      a. gespecialiseerd is in scheepsproviandering;

      b. een administratie voert die inzichtelijk maakt dat de landbouwproducten de bestemming hebben bereikt, en

      c. een controleregister bijhoudt als bedoeld in artikel 34, vierde lid, eerste en tweede alinea, van verordening
      612/2009, of de bij iedere leverantie gebruikte documenten overlegt waarop de douaneautoriteiten de datum hebben
      vermeld waarop de producten aan boord zijn gebracht.

      4 De Minister van Economische Zaken is bevoegd tot intrekking van de toestemming indien de belanghebbende niet
      langer voldoet aan de in het derde lid bedoelde eisen of aan de eisen, bedoeld in artikel 34 van verordening
      612/2009.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel323
  - number: 3:24
    text: |-
      1 Een belanghebbende aan wie de toestemming, bedoeld in [artikel 3:23, eerste lid][ref1], is verleend, geeft
      overeenkomstig een bij de Minister van Economische Zaken op te vragen maandstaat, uiterlijk vóór het eind van de
      kalendermaand volgend op de maand waarin de landbouwproducten ten uitvoer zijn aangegeven, alle in laatstbedoelde
      maand aangegeven landbouwproducten op bij de Minister van Economische Zaken.

      2 De in het eerste lid bedoelde opgave van landbouwproducten zijn gespecificeerd naar GN-code en, indien van
      toepassing, de restitutiecode.


