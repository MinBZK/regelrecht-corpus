    text: |-
      Deze regeling geeft uitvoering aan de [artikelen 1:3, eerste lid, onderdeel c][ref1],
      [1:19, tweede lid][ref2], [1:28, zesde lid][ref3], [1:35][ref4], [1:37, derde lid][ref5],
      [2:1, aanhef en onder a tot en met h, j, k, m en n][ref6], [6:1, eerste lid][ref7], [6:2][ref8], [6:3][ref9],
      [7:1, aanhef en onder b][ref10], [7:6, vierde lid][ref11], [7:9, aanhef en onder a tot en met c][ref12],
      [9:5][ref13], [10:11][ref14], [11:13, eerste lid][ref15], en [11:14, eerste lid van de Algemene douanewet][ref16],
      de [artikelen 1:5, vijfde lid][ref17], [2:1, eerste lid][ref18],
      [2:2, eerste en tweede lid][ref19], [3:2, derde lid][ref20], [3:3, aanhef en onder c][ref21], en
      [3:4, eerste lid, van het Algemeen douanebesluit][ref22], de [artikelen 2, eerste lid, onderdeel i][ref23],
      [3, vierde lid][ref24], en [artikel 5, tweede lid, van de Invorderingswet 1990][ref25],
      [artikel 21 van de Wet op de omzetbelasting 1968][ref26], de [artikelen 63, eerste lid][ref27],
      en [69 van de Wet op de accijns][ref28] en aan de [artikelen 27, eerste lid][ref29], en
      [31 van de Wet op de verbruiksbelasting van alcoholvrije dranken][ref30].


