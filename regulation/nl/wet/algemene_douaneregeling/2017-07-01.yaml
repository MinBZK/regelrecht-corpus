  - number: 1:20
    text: |-
      1 Ingeval de gegevens voor de vaststelling van de douanewaarde zijn uitgedrukt in een munteenheid waarvoor de
      Europese Centrale Bank geen referentiekoersen publiceert, wordt voor de vaststelling van de douanewaarde gebruik
      gemaakt van de wisselkoers van die munteenheid ten opzichte van de euro zoals die wordt gepubliceerd op de
      voorlaatste woensdag van de maand in de Financial Times Guide to World Currencies.

      2 De wisselkoers, bedoeld in het eerste lid, geldt gedurende de kalendermaand die volgt op de in het eerste lid
      bedoelde publicatie in de Financial Times Guide to World Currencies.

      3 Indien geen publicatie plaatsvindt op het tijdstip, bedoeld in het eerste lid, wordt de voor de betrokken
      munteenheid laatst in de Financial Times Guide to World Currencies gepubliceerde wisselkoers van die munteenheid
      ten opzichte van de euro geacht de op de voorlaatste woensdag van de maand gepubliceerde wisselkoers te zijn.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel120
  - number: 1:21
    text: |-
      1 De aangifte van gegevens inzake de douanewaarde, bedoeld in artikel 6, eerste lid, van de Gedelegeerde
      Verordening overgangsregels Douanewetboek van de Unie, kan achterwege blijven indien de douanewaarde van de
      ingevoerde goederen wordt vastgesteld op een andere wijze dan met toepassing van artikel 70 van het Douanewetboek
      van de Unie.

      2 Ingeval de in het eerste lid bedoelde aangifte achterwege blijft, verstrekt de aangever afzonderlijk de gegevens
      met behulp waarvan de aangegeven douanewaarde is berekend. Deze gegevens omvatten ten minste:

        - de methode van de vaststelling van de douanewaarde, aan te duiden door vermelding van het desbetreffende artikel
      van het Douanewetboek van de Unie;
        - een verwijzing naar een door de douane genomen beslissing voor zover de douanewaarde overeenkomstig een
      dergelijke beslissing is aangegeven; en
        - een gedetailleerde opgave van de wijze van berekening.

      3 Het tweede lid is niet van toepassing indien de aangegeven douanewaarde rechtstreeks uit de factuur is afgeleid.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel121
  - number: 1:22
    text: |-
      De aangifte van gegevens inzake de douanewaarde, die in een formulier D.V.1 als bedoeld in bijlage 8 van de
      Gedelegeerde Verordening overgangsregels Douanewetboek van de Unie zijn opgenomen, wordt afzonderlijk opgenomen in
      de elektronische aangifte tot plaatsing van goederen onder de douaneregeling in het vrije verkeer brengen.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel122
  - number: 2:0
    text: |-
      1 Van binnenkomende schepen en binnenkomende luchtvaartuigen wordt, minimaal 2 uur voor de verwachte aankomsttijd
      bij de haven ressorterend onder het douanekantoor waar ze zullen worden aangebracht, het desbetreffende
      douanekantoor elektronisch kennis gegeven van de verwachte aankomsttijd.

      2 Bij luchtvaartuigen kan de inspecteur toestaan dat wordt afgeweken van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel20
  - number: 2:1
    text: |-
      1 Binnenkomende schepen en de daarmee vervoerde goederen worden langs in [bijlage II][ref1] opgenomen vaarwaters
      overgebracht naar een haven ressorterende onder een in [bijlage III][ref2] opgenomen douanekantoor alwaar zij
      worden aangebracht.

      2 Binnenkomende luchtvaartuigen en de daarmee vervoerde goederen worden zonder tussenlanding overgebracht naar een
      internationale luchthaven ressorterende onder een in [bijlage IV][ref3] opgenomen douanekantoor alwaar zij worden
      aangebracht.

      3 Een binnengekomen schip dan wel een binnengekomen luchtvaartuig vertrekt van de haven onderscheidenlijk de
      internationale luchthaven, bedoeld in het eerste, onderscheidenlijk tweede lid, niet zonder toestemming van de
      inspecteur.

      4 In [bijlage V][ref4] zijn plaatsen opgenomen waar binnenkomende schepen en de daarmee vervoerde goederen eveneens
      kunnen worden aangebracht.

      5 Op plaatsen, bedoeld in het vierde lid, vinden geen andere activiteiten plaats dan:

      a. het innemen van provisie en scheepsbehoeften ten behoeve van de bemanning van het schip; of

      b. het innemen van brandstoffen of smeermiddelen bestemd voor de aandrijving of smering van het schip; of

      c. het aan boord nemen van goederen voor reparatie of vervanging van onderdelen van het schip, mits deze reparatie
      of vervanging noodzakelijk is om het schip zijn reis voort te kunnen laten zetten alsmede de daadwerkelijke
      reparatie of vervanging van deze onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0024291
