    text: |-
      Op de accijnzen, de omzetbelasting en de verbruiksbelasting van alcoholvrije dranken zijn de artikelen 25 tot en
      met 27 van Verordening 1186/2009 van overeenkomstige toepassing met dien verstande dat:

      a. de vrijstelling voor alcoholhoudende dranken als bedoeld in artikel 27, onderdeel b, eerste en tweede
      gedachtestreepje, van Verordening 1186/2009, is beperkt tot één fles van het gebruikelijke type met een maximum van
      1 liter;

      b. de vrijstelling voor de hierna genoemde goederen is beperkt tot de volgende hoeveelheden:

      1°. koffie: 500 gram;

      2°. koffie-extracten en koffie-essences: 200 gram;

      3°. thee: 100 gram;

      4°. thee-extracten en thee-essences: 40 gram.
