    text: |-
      1 De Minister van Economische Zaken geeft de invoercertificaten, bedoeld in
      [artikel 3:1, onder d, van het besluit][ref1], of uittreksels daarvan voor ruwe hennep van post 53 02 10 00
      van de gecombineerde nomenclatuur slechts af indien deze voldoet aan de voorwaarden van artikel 32, zesde lid,
      van Verordening (EU) nr. 1307/2013 van het Europees Parlement en de Raad van 17 december 2013 tot vaststelling
      van voorschriften voor rechtstreekse betalingen aan landbouwers in het kader van de steunregelingen van het
      gemeenschappelijk landbouwbeleid en tot intrekking van Verordening (EG) nr. 637/2008 van de Raad en Verordening
      (EG) nr. 73/2009 van de Raad (PbEU 2013, L 347);

      2 De Minister van Economische Zaken geeft de invoercertificaten, bedoeld in
      [artikel 3:1, onder d, van het besluit][ref2], of uittreksels daarvan voor zaaizaad bestemd voor de inzaai van
      henneprassen van post 1207 99 15 van de gecombineerde nomenclatuur slechts af indien deze vergezeld gaat van
