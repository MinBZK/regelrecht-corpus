  - number: 1:7
    text: |-
      1 De algemeen directeur Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische Zaken is
      inspecteur als bedoeld in [artikel 1:3, eerste lid, onderdeel c, van de wet][ref1].

      2 De aanwijzing, bedoeld in het eerste lid, geldt alleen voor de toepassing van artikel 48 van het Douanewetboek
      van de Unie.

      3 De algemeen directeur, bedoeld in het eerste lid, kan bij het uitoefenen van de hem bij dat lid opgedragen
      taken alleen de bevoegdheden, bedoeld in de [artikelen 1:23][ref2], [1:24][ref3], [1:25][ref4], [1:27][ref5],
      [1:31 tot en met 1:34 van de wet][ref6], toepassen.


