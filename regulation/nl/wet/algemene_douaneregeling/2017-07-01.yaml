    text: |-
      Voor de toepassing van de gecombineerde nomenclatuur, zoals vastgesteld bij [Verordening (EEG) nr. 2658/87]
      (31987R2658) van de Raad van 23 juli 1987 met betrekking tot de tarief- en statistieknomenclatuur en het
      gemeenschappelijk douanetarief (PbEG 1987, L 256), worden verstaan onder:

      a. fokpaarden van zuiver ras: de geregistreerde paarden, zoals gedefinieerd in artikel 2, onder b en c, van
      [Richtlijn 90/427/EEG](31990L0427) van de Raad van 26 juni 1990 tot vaststelling van zoötechnische en genealogische
      voorschriften voor het intracommunautaire handelsverkeer in paardachtigen (PbEG 1990, L 224), met uitzondering
      van ruinen;

      b. fokvarkens van zuiver ras: de ingeschreven of geregistreerde varkens, zoals gedefinieerd in artikel 1 van
      [Richtlijn 88/661/EEG](31988L0661) van de Raad van 19 december 1988 betreffende de zoötechnische normen die gelden
      voor fokvarkens (PbEG 1988, L 382).
    url: https://wetten.overheid.nl/BWBR0024291/2017-07-01#Artikel41
  - number: 4:2
    text: |-
      De in [artikel 4:1, aanhef en onder a][ref1], bedoelde dieren mogen alleen als fokpaarden van zuiver ras in het
      vrije verkeer worden gebracht indien:

      a. zij vergezeld gaan van een stamboek- en fokkerijcertificaat zoals vastgesteld bij Uitvoeringsverordening (EU)
      2015/262 van de Commissie van 17 februari 2015 tot vaststelling van voorschriften overeenkomstig de Richtlijnen
      90/427/EEG en 2009/156/EG van de Raad met betrekking tot de methoden voor de identificatie van paardachtigen
      (verordening paardenpaspoort) (PbEU 2015, L 59);

      b. zij vergezeld gaan van een document volgens het in [bijlage VIII][ref2] opgenomen model, waaruit blijkt dat zij
      in een stamboek of register van de Unie zullen worden ingeschreven of geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0024291
