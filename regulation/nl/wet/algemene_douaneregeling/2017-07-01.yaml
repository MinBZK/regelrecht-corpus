  - number: 1:2
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder:

      a. wet: [Algemene douanewet][ref1];

      b. besluit: [Algemeen douanebesluit][ref2];

      c. binnenkomend schip: schip waarvoor de in artikel 139 van het Douanewetboek van de Unie bedoelde formaliteiten
      moeten worden vervuld;

      d. binnenkomend luchtvaartuig: luchtvaartuig waarvoor de in artikel 139 van het Douanewetboek van de Unie bedoelde
      formaliteiten moeten worden vervuld;

      e. *Nederlandse Voedsel- en Warenautoriteit:* Nederlandse Voedsel- en Warenautoriteit van het Ministerie van
      Economische Zaken;

      f. *verordening 1301/2006:* Verordening (EG) nr. 1301/2006 van de Commissie van 31 augustus 2006 houdende
      gemeenschappelijke voorschriften voor het beheer van door middel van een stelsel van invoercertificaten beheerde
      invoertariefcontingenten voor landbouwproducten (PbEU 2006, L 238);

      g. Verordening 1186/2009: Verordening (EG) nr. 1186/2009 van de Raad van 16 november 2009 betreffende de instelling
      van een communautaire regeling inzake douanevrijstellingen (PbEU 2009, L 324);

      h. Gedelegeerde Verordening (EU) 2016/1237: Gedelegeerde Verordening (EU) 2016/1237 van de Commissie van 18 mei
      2016 tot aanvulling van Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad wat betreft de
      uitvoeringsbepalingen voor het stelsel van invoer- en uitvoercertificaten en tot aanvulling van Verordening
      (EU) nr. 1306/2013 van het Europees Parlement en de Raad wat betreft de voorschriften inzake de vrijgave en de
      verbeurdverklaring van voor dergelijke certificaten gestelde zekerheden, tot wijziging van [Verordeningen (EG) nr.
      2535/2001](32001R2535), [(EG) nr. 1342/2003](32003R1342), [(EG) nr. 2336/2003](32003R2336), [(EG) nr. 951/2006]
      (32006R0951), [(EG) nr. 341/2007](32007R0341) en [(EG) nr. 382/2008](32008R0382) van de Commissie en tot intrekking
      van Verordeningen [(EG) nr. 2390/98](31998R2390), [(EG) nr. 1345/2005](32005R1345), [(EG) nr. 376/2008](32008R0376)
      en [(EG) nr. 507/2008](32008R0507) van de Commissie (PbEU 2016, L 206);

      i. Verordening 612/2009: Verordening (EG) nr. 612/2009 van de Commissie van 7 juli 2009 houdende gemeenschappelijke
      uitvoeringsbepalingen van het stelsel van restituties bij uitvoer voor landbouwproducten (PbEU 2009, L 186);

      j. Gedelegeerde Verordening overgangsregels Douanewetboek van de Unie: Gedelegeerde Verordening (EU) 2016/341 van
      de Commissie van 17 december 2015 tot aanvulling van Verordening (EU) nr. 952/2013 van het Europees Parlement en
      van de Raad met overgangsregels voor enkele bepalingen van het douanewetboek van de Unie voor de gevallen waarin
      de relevante elektronische systemen nog niet operationeel zijn, en tot wijziging van Gedelegeerde Verordening (EU)
      2015/2446 (PbEU 2016, L 69);

      k.

      l. bier: bier als bedoeld in [artikel 6 van de Wet op de accijns][ref3];

      m. minerale oliën: minerale oliën als bedoeld in de [artikelen 25][ref4] en [26 van de Wet op de accijns][ref5];

      n. tabaksproducten: tabaksproducten als bedoeld in [artikel 29 van de Wet op de accijns][ref6];

      o. sigaretten: sigaretten als bedoeld in [artikel 31 van de Wet op de accijns][ref7];

      p. sigaren: sigaren als bedoeld in [artikel 30 van de Wet op de accijns][ref8];

      q. cigarillo’s: sigaren met een maximumgewicht van 3 gram per stuk;

      r. rooktabak: rooktabak als bedoeld in [artikel 32 van de Wet op de accijns][ref9];

      s. kanselarijbenodigdheden: officiële emblemen en documenten alsmede kantoormeubilair en kantoorbenodigdheden
      bestemd voor een kanselarij;

      t. verordening 412/2008: Verordening (EG) nr. 412/2008 van de Commissie van 8 mei 2008 betreffende de opening en de
      wijze van beheer van een tariefcontingent voor de invoer van voor verwerking bestemd bevroren rundvlees (PbEU 2008,
      L 125);

      u. Uitvoeringsverordening (EU) 2016/1239: Uitvoeringsverordening (EU) 2016/1239 van de Commissie van 18 mei 2016
      tot vaststelling van uitvoeringsbepalingen van Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad
      wat betreft het stelsel van invoer- en uitvoercertificaten (Pb 2016, L 206);

      v. Verordening 1308/2013: Verordening (EU) nr. 1308/2013 van het Europees Parlement en de Raad van 17 december 2013
      tot vaststelling van een gemeenschappelijke ordening van de markten voor landbouwproducten en tot intrekking van
      de Verordeningen (EEG) nr. 922/72, (EEG) nr. 234/79, (EG) nr. 1037/2001 en (EG) nr. 1234/2007 van de Raad (PbEU
      2013, L 347);

      w. kentekenregister: het kentekenregister, genoemd in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref10].


