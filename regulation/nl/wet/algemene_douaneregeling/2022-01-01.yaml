        bwb_id: BWBR0024235
        artikel: 3:2
      - id: ref2
        bwb_id: BWBR0024235
        artikel: 3:2
  - number: 3:15
    text: |-
      Voor de toepassing van deze afdeling wordt verstaan onder:

        - *inrichting:* verwerkende inrichting, erkend overeenkomstig artikel 4 van Verordening (EG) nr. 853/2004 van het
      Europees Parlement en de Raad van 29 april 2004 houdende vaststelling van specifieke hygiënevoorschriften voor
      levensmiddelen van dierlijke oorsprong (PbEG 2004, L 226);
        - *productiecode:* gebruikelijke code waaruit de productiedatum blijkt van een A-product als bedoeld in artikel 2,
      eerste lid, van verordening 412/2008, respectievelijk van een B-product als bedoeld in artikel 2, tweede lid, van
      verordening 412/2008;
        - *rendement:* resultaat van de berekening van het aantal in bewerking genomen kilo’s rundvlees, verminderd
      met dripverliezen en afsnijdsels, onder aftrek van de kilo's uitval of bijproduct, gedeeld door de hoeveelheid
      eindproduct in kilo's;
        - *verwerker:* natuurlijke of rechtspersoon die bevroren rundvlees verwerkt tot A-producten of B-producten of die
      voornemens is hiertoe over te gaan.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel315
  - number: 3:16
    text: |-
      Een verwerker die bevroren rundvlees invoert in het kader van een tariefcontingent als bedoeld in verordening
      412/2008 verwerkt het ingevoerde rundvlees binnen 3 maanden na de dag van invoer tot A-producten of tot B-
      producten.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel316
  - number: 3:16a
    text: |-
      1 De Minister van Landbouw, Natuur en Voedselkwaliteit kent een recht tot invoer toe overeenkomstig verordening
      412/2008.

      2 Een aanvraag voor de afgifte een recht tot invoer wordt ingediend door een verwerker bij de Minister van
      Landbouw, Natuur en Voedselkwaliteit op een daartoe door de Minister van Landbouw, Natuur en Voedselkwaliteit
      vastgesteld formulier dat beschikbaar is op internetadres mijn.rvo.nl.

      3 Een verwerker toont bij een aanvraag als bedoeld in het eerste lid aan dat hij voldoet aan de voorschriften,
      bedoeld in verordening 412/2008 en de voorschriften van deze afdeling.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel316a
  - number: 3:16b
    text: |-
      1 Een aanvraag voor een invoercertificaat wordt ingediend bij de Minister van Landbouw, Natuur en Voedselkwaliteit.

      2 De Minister van Landbouw, Natuur en Voedselkwaliteit neemt een aanvraag als bedoeld in het eerste lid alleen in
      behandeling als de aanvrager beschikt over een ingevolge [artikel 3:16a, eerste lid][ref1], toegekend recht tot
      invoer.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel316a
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel316b
    references:
      - id: ref1
        bwb_id: BWBR0024291
        artikel: 3:16a
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: 3.2.1
  - number: 3:16c
    text: |-
      1 De Minister van Landbouw, Natuur en Voedselkwaliteit geeft een invoercertificaat af als door de verwerker een
      zekerheid is gesteld als bedoeld in artikel 4 van Gedelegeerde Verordening (EU) 2016/1237.

      2 Bij de invoer van grondstoffen stelt een verwerker voor de Minister van Landbouw, Natuur en Voedselkwaliteit
      een zekerheid onder gebruikmaking van een door de Minister van Landbouw, Natuur en Voedselkwaliteit vastgesteld
      formulier dat beschikbaar is op internetadres mijn.rvo.nl.

      3 De Minister van Landbouw, Natuur en Voedselkwaliteit geeft een zekerheidstelling vrij:

      a. als bedoeld in het eerste lid wanneer is voldaan aan de voorwaarden, bedoeld in deze afdeling en Gedelegeerde
      Verordening (EU) 2016/1237, of

      b. als bedoeld in het tweede lid wanneer is voldaan aan de voorwaarden, bedoeld in deze afdeling en verordening
      412/2008.

      4 Met inachtneming van verordening 412/2008 verbeurt een verwerker de zekerheid ten gunste van de Minister van
      Landbouw, Natuur en Voedselkwaliteit bij niet naleving van de relevante voorschriften, bedoeld in die verordening
      en in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel316c
  - number: 3:16d
    text: |-
      1 Een verwerker die voor de eerste keer bevroren rundvlees wil invoeren in het kader van een tariefcontingent
      als bedoeld in verordening 412/2008 dient daartoe tenminste twee weken voor de eerste daadwerkelijke invoer een
      aanvraag in bij de Minister van Landbouw, Natuur en Voedselkwaliteit.

      2 Een aanvraag die betrekking heeft op een A-product gaat vergezeld van:

      a. een op een A-product betrekking hebbend recept;

      b. de benaming en de voorgestelde productiecode van het eindproduct;

      c. alle verwerkte grond- en hulpstoffen in een percentage van de totale hoeveelheid verwerkte grondstoffen en het
      eiwitgehalte van de grond- en hulpstoffen;

      d. het rendement;

      e. de kerntemperatuur en de tijdsduur waarop de kerntemperatuur blijft gehandhaafd tijdens be- of verwerking van
      het product;

      f. de verpakkingswijze;

      g. het mager rundvleesgehalte;

      h. het totaal vleespercentage;

      i. de verhouding tussen het collageen en het eiwit;

      j. de GN-code van de grondstof en de GN-code van het eindproduct, en

      k. indien het recept betrekking heeft op de bereiding van verkleind vlees of vlees met saus: het vetvrije droge
      stofgehalte van de overige bestanddelen die niet bestaan uit vlees, vet, of slachtafval.

      3 Een aanvraag die betrekking heeft op een B-product gaat vergezeld van:

      a. een op een op een B-product betrekking hebbend recept;

      b. de in onderdeel 2, sub-onderdelen b, d, e, f, en j bedoelde informatie;

      c. alle verwerkte grond- en hulpstoffen in een percentage van de totale hoeveelheid verwerkte grondstoffen, en

      d. indien het recept betrekking heeft op de bereiding van eindproducten met de GN-code 0210 2090 in de
      gecombineerde nomenclatuur: de verhouding tussen het water en het eiwit.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel316d
  - number: 3:16e
    text: |-
      De Minister van Landbouw, Natuur en Voedselkwaliteit beslist op een aanvraag als bedoeld in
      [artikel 3:16d, eerste lid][ref1], en kan daarbij vaststellen vanaf welke datum de verwerker het recept mag
      toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel316d
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel316e
    references:
      - id: ref1
        bwb_id: BWBR0024291
        artikel: 3:16d
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: 3.2.1
  - number: 3:16f
    text: |-
      Een verwerker die een nog niet eerder aan de Minister van Landbouw, Natuur en Voedselkwaliteit verstrekt recept
      wil toepassen, of een eerder aan de Minister van Landbouw, Natuur en Voedselkwaliteit verstrekt recept wil wijzigen
      dient daartoe een nieuwe aanvraag in overeenkomstig [artikel 3:16d, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel316d
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel316f
    references:
      - id: ref1
        bwb_id: BWBR0024291
        artikel: 3:16d
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: 3.2.1
  - number: 3:16g
    text: |-
      De Minister van Landbouw, Natuur en Voedselkwaliteit kan bij een verwerker of bij een derde onderzoek verrichten
      naar:

      a. de technische mogelijkheden om de grondstoffen te verwerken tot het in het recept omschreven eindproduct,
      bedoeld in artikel 16d, tweede of derde lid, of

      b. de inrichting van de administratie van een verwerker ten aanzien van de vraag of deze altijd op eenvoudige wijze
      inzicht geeft in de aankoop en de verkoop van de grondstoffen en de verkoop en de aflevering van de eindproducten.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel316g
  - number: 3:16h
    text: |-
      1 Een verwerker meldt de invoer van bevroren rundvlees tenminste 2 werkdagen voor het tijdstip van invoer
      schriftelijk aan de Minister van Landbouw, Natuur en Voedselkwaliteit.

      2 Een verwerker die het voornemen heeft om bevroren rundvlees te verwerken overeenkomstig verordening 412/2008
      meldt dit tenminste 2 werkdagen voor het tijdstip van aanvang van de productie schriftelijk aan de Minister van
      Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel316h
  - number: 3:16i
    text: |-
      1 Alvorens de op het invoercertificaat vermelde hoeveelheid bevroren rundvlees te verwerken doet een verwerker een
      proefbereiding van de voorgenomen verwerking en stelt de Minister van Landbouw, Natuur en Voedselkwaliteit in de
      gelegenheid om aanwezig te zijn bij die proefbereiding.

      2 De Minister van Landbouw, Natuur en Voedselkwaliteit berekent het rendement bij een proefbereiding.

      3 De Minister van Landbouw, Natuur en Voedselkwaliteit kan een nieuwe proefbereiding verplicht stellen om het
      rendement te berekenen.

      4 De Minister van Landbouw, Natuur en Voedselkwaliteit trekt een op grond van [artikel 3:16e][ref1] verleende
      toestemming in als uit de proefbereiding blijkt dat het bereide product naar zijn oordeel niet is aan te merken als
      een A-product of als een B-product.

      5 Een verwerker informeert de Minister van Landbouw, Natuur en Voedselkwaliteit voorafgaand aan de verwerking van
      grondstoffen tot A-producten of tot B-producten als de grondstoffen naar hun aard of kwaliteit duidelijk afwijken
      van de bij een proefbereiding verwerkte grondstoffen. In dat geval verricht een verwerker altijd een of meerdere
      nieuwe proefbereidingen als bedoeld in het eerste lid om het rendement alsnog te berekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel316e
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel316i
