    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het in het vrije verkeer brengen van gronduitrusting door
      buiten de Benelux gevestigde luchtvaartondernemingen om op een douaneluchtvaartterrein te worden gebruikt voor de
      inrichting of exploitatie van een internationale luchtdienst door die onderneming.

      2 Voor het brengen in het vrije verkeer met vrijstelling van rechten bij invoer is een vergunning van de inspecteur
      vereist.

      3 Indien de luchtvaartonderneming tegelijkertijd goederen van twee of meer soorten in het vrije verkeer brengt, mag
      worden volstaan met één aangifte voor het brengen in het vrije verkeer, mits de aangifte is aangevuld met een lijst
      waarop de gegevens van de goederen zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel715
  - number: 7:16
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van:

      a. scheepsvoorraden aan boord van binnenkomende schepen, geen woonschepen zijnde;

      b. provisie aanwezig in luchtvaartuigen in internationaal verkeer;

      c. brandstoffen en smeermiddelen aanwezig in binnenkomende schepen en luchtvaartuigen en bestemd voor de
      aandrijving of smering daarvan.

      2 De vrijstelling voor de goederen, bedoeld in het eerste lid, wordt slechts verleend voor de hoeveelheden, welke
      redelijkerwijs noodzakelijk worden geacht voor het verbruik of gebruik aan boord.

      3 Het is verboden de goederen uit de vervoermiddelen te verwijderen.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel716
  - number: 7:16a
    text: |-
      Voor de toepassing van deze afdeling wordt verstaan onder:

      a. *NAVO-Statusverdrag:* het op 19 juni 1951 te Londen tot stand gekomen Verdrag tussen de Staten die partij zijn
      bij het Noord-Atlantisch Verdrag, nopens de rechtspositie van hun krijgsmachten (Trb. 1951, 114);

      b. *Hoofdkwartierenprotocol:* het op 28 augustus 1952 te Parijs tot stand gekomen Protocol bij het op 19 juni
      1951 te Londen gesloten Verdrag tussen de Staten die partij zijn bij het Noord-Atlantische Verdrag – nopens
      de rechtspositie van hun krijgsmachten – nopens de rechtspositie van internationale militaire hoofdkwartieren,
      ingesteld uit hoofde van het Noord-Atlantisch Verdrag (Trb. 1953, 11);

      c. *buitenlandse NAVO-strijdkrachten:*

      1°. in Nederland gelegerde buitenlandse land-, zee- of luchtstrijdkrachten van de Staten die partij zijn bij het op
      4 april 1949 te Washington tot stand gekomen Noord-Atlantisch Verdrag (Stb. 1949, J 355), het NAVO-Statusverdrag of
      het Hoofdkwartierenprotocol;

      2°. het Geallieerd Hoofdkwartier, bedoeld in artikel 1, aanhef en onderdeel c, van het Hoofdkwartierenprotocol, of
      bedoeld in artikel I, aanhef en onderdeel 3, van de op 25 mei 1964 te Parijs tot stand gekomen Overeenkomst tussen
      het Koninkrijk der Nederlanden en het Algemeen Hoofdkwartier van de Geallieerde Mogendheden in Europa ondertekende
      Overeenkomst inzake de bijzondere voorwaarden die toepasselijk zijn op de vestiging en het functioneren van
      internationale militaire hoofdkwartieren binnen het Europese grondgebied van het Koninkrijk der Nederlanden
      (Trb. 1964, 131);

      3°. andere buitenlandse NAVO-onderdelen, voor zover het NAVO-Statusverdrag of het Hoofdkwartierenprotocol daarop
      van toepassing is;

      d. *personeel van buitenlandse NAVO-strijdkrachten:*

      1°. een lid van de krijgsmacht als bedoeld in artikel I, eerste lid, aanhef en onderdeel a, van het NAVO-
      Statusverdrag of als bedoeld in artikel 3, eerste lid, onderdeel a, van het Hoofdkwartierenprotocol;

      2°. een lid van de civiele dienst als bedoeld in artikel I, eerste lid, aanhef en onderdeel b, van het NAVO-
      Statusverdrag of als bedoeld in artikel 3, eerste lid, aanhef en onderdeel b, van het Hoofdkwartierenprotocol;

      e. *gezinslid:* een persoon als bedoeld in artikel I, eerste lid, aanhef en onderdeel c, van het NAVO-
      Statusverdrag of als bedoeld in artikel 3, eerste lid, aanhef en onderdeel c, van het Hoofdkwartierenprotocol,
      een persoon voor wie een NAVO-strijdkracht (Delegatieleider) verklaart, dat deze de status heeft van
      ‘afgeleide NAVO-statusgerechtigde ’of ‘afgeleide Paris Protocol-gerechtigde’, of een partner als bedoeld in
      [artikel 5a van de Algemene wet inzake rijksbelastingen][ref1];

      f. *commandant:* de bevoegde autoriteit van een buitenlandse NAVO-strijdkracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5a
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel716a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5a
  - number: 7:16aa
    text: |-
      Deze afdeling is van overeenkomstige toepassing op buitenlandse strijdkrachten, het personeel daarvan en hun
      gezinsleden die behoren tot een staat die deelneemt aan het op 19 juni 1995 te Brussel tot stand gekomen Verdrag
      tussen de Staten Partij bij het Noord-Atlantisch Verdrag en de overige aan het Partnerschap voor de Vrede
      deelnemende Staten nopens de rechtspositie van hun krijgsmachten en Aanvullend protocol (Trb. 1996, 74) en het op
      19 december te Brussel tot stand gekomen Nader Aanvullend Protocol (Trb. 1998, 188), maar geen partij is van het
      NAVO-Statusverdrag.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel716aa
  - number: 7:16b
    text: |-
      De [artikelen 7:16e tot en met 7:16h][ref1] zijn niet van toepassing op:

      a. militair personeel dat de Nederlandse nationaliteit heeft en behoort tot het personeel van de buitenlandse NAVO-
      strijdkrachten, maar in dienst is van de Nederlandse strijdkrachten alsmede op de gezinsleden van dat personeel;

      b. leden van de civiele dienst die de Nederlandse nationaliteit hebben en behoren tot het personeel van
      buitenlandse NAVO-strijdkrachten alsmede op de gezinsleden van die leden.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel716e
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel716b
