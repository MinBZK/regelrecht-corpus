  - number: 3:13a
    text: |-
      1 Een aanvraag tot erkenning van een importeur van niet voor inzaai bestemd hennepzaad als bedoeld in artikel 9,
      derde lid, van Gedelegeerde Verordening (EU) 2016/1237 wordt ingediend bij de Minister van Landbouw, Natuur en
      Voedselkwaliteit.

      2 De Minister van Landbouw, Natuur en Voedselkwaliteit erkent een importeur als deze een redelijke activiteit
      gedurende 12 maanden voorafgaand aan de aanvraag tot erkenning kan aantonen in de handel in granen, zaden of
      peulvruchten.

      3 In afwijking van het tweede lid kan de Minister van Landbouw, Natuur en Voedselkwaliteit ook een importeur
      erkennen:

      a. die aan de hand van bewijsstukken, waaronder een bedrijfsplan, kan aantonen dat de in het tweede lid genoemde
      activiteiten op korte termijn zullen worden gestart, of

      b. die is aan te merken als een in Nederland gevestigde organisatie die kan aantonen hennepzaad te gebruiken voor
      wetenschappelijk onderzoek en in dat kader in aanmerking wil komen voor een erkenning als importeur.

      4 De aanvraag, bedoeld in het eerste lid, wordt ingediend met behulp van een door de Minister van Landbouw, Natuur
      en Voedselkwaliteit ter beschikking gesteld middel.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel313a
  - number: 3:13b
    text: |-
      Een erkende importeur:

      a. voert een voorraadboekhouding waaruit de aangevoerde partijen, de be- of verwerkte partijen en de afgeleverde
      partijen blijken;

      b. overhandigt binnen 3 maanden na de termijn van 12 maanden, bedoeld in artikel 9, vierde lid, van Gedelegeerde
      Verordening (EU) 2016/1237, verklaringen waaruit blijkt dat de ingevoerde partijen waarvoor een certificaat
      als bedoeld in artikel 9, eerste lid, van Gedelegeerde Verordening (EU) 2016/1237 is afgegeven, voldoen aan de
      voorwaarden, bedoeld in artikel 189, eerste en tweede lid, van Verordening (EU) 1308/2013 en artikel 9, vierde lid,
      van Gedelegeerde Verordening (EU) 2016/1237, en

      c. overhandigt de in onderdeel a bedoelde voorraadboekhouding en overige bewijsstukken op verzoek aan de Minister
      van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel313b
  - number: 3:13c
    text: |-
      Overeenkomstig artikel 9, vierde lid, van Gedelegeerde Verordening (EU) 2016/1237 kan de Minister van
      Landbouw, Natuur en Voedselkwaliteit op verzoek van de erkende importeur overgaan tot verlenging van de in
      [artikel 3:13b, onderdeel b][ref1], genoemde termijn van 12 maanden met één of twee periodes van 6 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel313b
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel313c
    references:
      - id: ref1
        bwb_id: BWBR0024291
        artikel: 3:13b
        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3:13d
    text: |-
      Indien niet wordt voldaan aan een of meer voorwaarden, genoemd in [artikel 3:13b][ref1] stelt de Minister van
      Landbouw, Natuur en Voedselkwaliteit, in geval het een in een andere lidstaat gevestigde importeur betreft, de
      bevoegde autoriteit van die lidstaat hiervan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel313b
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel313d
    references:
