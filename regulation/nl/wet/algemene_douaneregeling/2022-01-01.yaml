  - number: 7:14
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van goederen die bestemd
      zijn voor het persoonlijk gebruik – gebruik door inwonende gezinsleden daaronder begrepen – van functionarissen
      in dienst van een internationale organisatie, genoemd in [bijlage XIX][ref1], indien met die organisaties is
      overeengekomen dat aan die functionarissen het recht op deze vrijstelling wordt verleend.

      2 De vrijstelling, bedoeld in het eerste lid, is niet van toepassing indien de desbetreffende functionaris
      Nederlander is of duurzaam in Nederland verblijft.

      3 De vrijstelling, bedoeld in het eerste lid, is, voor zover het personenvoertuigen betreft, beperkt tot maximaal
      twee personenvoertuigen per functionaris, tenzij met de internationale organisatie is overeengekomen dat deze
      vrijstelling beperkt is tot één personenvoertuig per functionaris.

      4 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van goederen die bestemd
      zijn voor het persoonlijk gebruik – gebruik door inwonende gezinsleden daaronder begrepen – van administratief,
      technisch en bedienend personeel in dienst van een internationale organisatie genoemd in [bijlage XIX][ref2],
      indien met die organisatie is overeengekomen dat aan dat personeel het recht op deze vrijstelling wordt verleend.

      5 De vrijstelling, bedoeld in het vierde lid, is niet van toepassing indien het personeelslid Nederlander is,
      duurzaam in Nederland verblijft, dan wel als er op het moment van het in het vrije verkeer brengen sinds de aanvang
      van de tewerkstelling in Nederland meer dan 10 jaren zijn verstreken.

      6 De vrijstelling, bedoeld in het vierde lid, is, voor zover het personenvoertuigen betreft, beperkt tot maximaal
      één personenvoertuig per persoon, tenzij met de organisatie is overeengekomen dat geen vrijstelling voor een
      personenvoertuig wordt verleend.

      7 [Artikel 7:10, eerste, tweede en derde lid][ref3], is van overeenkomstige toepassing, met dien verstande dat
      het hoofd van de internationale organisatie in een door hem ondertekende schriftelijke verklaring op de aangifte
      Douane 39 verklaart dat de functionaris onderscheidenlijk de persoon die gebruik wenst te maken van de in het
      eerste of vierde lid bedoelde vrijstelling in dienst is bij die internationale organisatie, geen Nederlander is,
      niet duurzaam in Nederland verblijft, dan wel dat er op het moment van het in het vrije verkeer brengen sinds de
      aanvang van de tewerkstelling in Nederland minder dan 10 jaren zijn verstreken. Voorts vermeldt de verklaring de
      normale verblijfplaats van de functionaris onderscheidenlijk de persoon op het moment van aanwerving en de datum
      van tewerkstelling in Nederland.

      8 Het is verboden om de met vrijstelling in het vrije verkeer gebrachte goederen:

        - uit te lenen, te verpanden, te verhuren, onder bezwarende titel of om niet over te dragen, zonder dat daartoe
      toestemming is verkregen van de inspecteur die de vrijstelling heeft verleend; en
        - te gebruiken op een wijze of voor doeleinden waarvoor de vrijstelling niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0024291
      [ref2]: https://wetten.overheid.nl/BWBR0024291
      [ref3]: https://wetten.overheid.nl/BWBR0024291#Artikel710
