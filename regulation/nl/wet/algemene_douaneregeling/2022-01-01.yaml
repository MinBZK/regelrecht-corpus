    text: |-
      1 Het aanbrengen bij het douanekantoor van uitgang, bedoeld in artikel 331, eerste lid, van de
      Uitvoeringsverordening Douanewetboek van de Unie, geschiedt op elektronische wijze met een aankomstmelding waarin
      de gegevenselementen, genoemd in [bijlage IXa][ref1], titel I, zijn opgenomen.

      2 De inspecteur kan toestaan dat wordt afgeweken van het bepaalde in het eerste lid.


