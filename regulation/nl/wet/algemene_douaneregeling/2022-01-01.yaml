      1 De Minister van Landbouw, Natuur en Voedselkwaliteit geeft de invoercertificaten, bedoeld in
      [artikel 3:1, onder d, van het besluit][ref1], of uittreksels daarvan voor ruwe hennep van post 53 02 10 00
