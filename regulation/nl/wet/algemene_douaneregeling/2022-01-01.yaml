  - number: 7:16i
    text: |-
      1 Het is verboden om de met vrijstelling van rechten bij invoer tijdelijk ingevoerde goederen of in het vrije
      verkeer gebrachte goederen:

      a. uit te lenen, te verpanden, te verhuren, onder bezwarende titel of om niet over te dragen, behalve als daartoe
      toestemming is verkregen van de inspecteur; of

      b. anders dan voor persoonlijk gebruik aan te wenden.

      2 Indien een douaneschuld is ontstaan door niet-naleving van de voorwaarden voor de toekenning van vrijstelling van
      rechten bij invoer, wordt het met die schuld overeenkomende bedrag aan rechten bij invoer vastgesteld op het bedrag
      waarvoor vrijstelling werd verleend.

      3 De inspecteur kan toestemming verlenen om af te zien van de vrijstelling. Alsdan worden de verschuldigde rechten
      bij invoer voor:

      a. motorrijtuigen vastgesteld op basis van het tarief en de dagwaarde op het tijdstip dat van de vrijstelling wordt
      afgezien;

      b. gebruiksgoederen, met uitzondering van motorrijtuigen, vastgesteld op basis van het tarief en de restwaarde van
      het gebruiksgoed op het tijdstip dat van de vrijstelling wordt afgezien waarbij een afschrijvingsperiode van drie
      jaren wordt gehanteerd.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel716i
  - number: 7:16j
    text: |-
      1 Bij een controle van de vervoermiddelen en het begeleidend personeel beperkt de inspecteur zich ten aanzien van
      de goederen tot een globaal onderzoek, dat omvat het vergelijken van het aantal, de soort, het gewicht en de merken
      van de colli met de op het formulier 302 vermelde gegevens. De verpakking wordt niet geopend. Van meer of minder
      bevinding stellen de ambtenaren aantekening op het formulier 302.

      2 Geclassificeerde zendingen, die als zodanig duidelijk van merken en aanduidingen zijn voorzien, worden niet
      onderzocht.

      3 Officiële documenten in officieel verzegelde omslagen en documenten in van officieel cachet voorziene pakketten,
      worden niet onderzocht.

      4 De inspecteur is op de plaats van bestemming bevoegd de goederen te controleren alleen in tegenwoordigheid van de
      door de commandant aangewezen persoon van de betreffende buitenlandse NAVO-strijdkracht.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel716j
  - number: 7:16k
    text: |-
      Indien de inspecteur controle wenst uit te oefenen op lokaliteiten binnen vestigingen van een buitenlandse NAVO-
      strijdkracht, vindt deze controle slechts plaats na voorafgaande kennisgeving aan de commandant.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel716k
