    text: |-
      Deze regeling geeft uitvoering aan de [artikelen 1:3, eerste lid, onderdeel c][ref1],
      [1:19, tweede lid][ref2], [1:28, zesde lid][ref3], [1:35][ref4], [1:37, derde lid][ref5],
      [2:1][ref6], [3:2, derde lid, aanhef en onderdelen a en b][ref7], [3:5, tweede lid][ref8],
      [6:1, eerste lid][ref9], [6:2][ref10], [6:3][ref11], [7:1, aanhef en onder b][ref12],
      [7:6, vierde lid][ref13], [7:9, aanhef en onder a tot en met c][ref14], [9:5][ref15], [10:11][ref16],
      [11:13, eerste lid][ref17], en [11:14, eerste lid van de Algemene douanewet][ref18], de
      [artikelen 1:5, vijfde lid][ref19], [2:1, eerste lid][ref20], [2:2, eerste en tweede lid][ref21],
      [3:2, derde lid][ref22], en [3:3, aanhef en onder c, van het Algemeen douanebesluit][ref23], de
      [artikelen 2, eerste lid, onderdeel i][ref24], en [artikel 5, tweede lid, van de Invorderingswet 1990][ref25],
      [artikel 21 van de Wet op de omzetbelasting 1968][ref26], de [artikelen 63, eerste lid][ref27],
      en [69 van de Wet op de accijns][ref28] en aan de [artikelen 27, eerste lid][ref29], en
      [31 van de Wet op de verbruiksbelasting van alcoholvrije dranken][ref30].


