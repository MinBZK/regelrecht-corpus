  - number: 11:1
    text: |-
      Degene die onjuiste of onvolledige gegevens verstrekt, of handelingen verricht, welke leiden of kunnen leiden tot
      een onjuiste terugbetaling van rechten bij invoer, of kwijtschelding van rechten bij invoer, maakt zich schuldig
      aan het plegen van een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel111
  - number: 11:2
    text: |-
      Degene die onjuiste of onvolledige gegevens verstrekt, waardoor ten onrechte een vrijstelling wordt genoten of zou
      kunnen worden genoten, maakt zich schuldig aan het plegen van een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel112
  - number: 11:3
    text: |-
      Degene die een der in deze regeling omschreven verboden overtreedt, maakt zich schuldig aan het plegen van een
      strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel113
  - number: 11:4
    text: |-
      Hij die geen bijstand verleent of niet alle nodige bescheiden en inlichtingen verstrekt binnen de eventueel
      vastgestelde termijn zoals bedoeld in artikel 15, eerste lid, van het Douanewetboek van de Unie maakt zich schuldig
      aan het plegen van een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel114
  - number: 11:5
    text: |-
      Hij die zonder de ingevolge wettelijke bepalingen vereiste toestemming:

      a. goederen lost, laadt, overlaadt, inslaat of uitslaat;

      b. goederen als bedoeld in [artikel 2:4][ref1] verder landinwaarts brengt dan tot de eerste plaats waar zij tegen
      beschadiging door het zeewater zijn beveiligd;

      c. een binnengekomen schip dan wel een binnengekomen luchtvaartuig laat vertrekken van de haven of de
      internationale luchthaven, bedoeld in [artikel 2:1, eerste lid][ref2], onderscheidenlijk tweede lid; of

      d. een schip of luchtvaartuig dat het douanegebied van de Unie zal doen verlaten, doet vertrekken uit de haven,
      onderscheidenlijk van de internationale luchthaven, bedoeld in [artikel 2:1, eerste lid][ref3], onderscheidenlijk
      tweede lid;

      maakt zich schuldig aan het plegen van een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0024291#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0024291#Artikel21
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel115
