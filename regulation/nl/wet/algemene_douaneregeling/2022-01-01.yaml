  - number: 3:14
    text: |-
      1 Van het verbod op het invoeren van landbouwproducten, bedoeld in [artikel 3:2 van het besluit][ref1], wordt
      vrijstelling verleend voor pootaardappelen van post 0701 1000 van de gecombineerde nomenclatuur.

      2 Van het verbod op het uitvoeren van landbouwproducten, bedoeld in [artikel 3:2 van het besluit][ref2], wordt
      vrijstelling verleend voor pootaardappelen van post 0701 1000 van de gecombineerde nomenclatuur.

      3 Aan de vrijstelling, bedoeld in het tweede lid, is de voorwaarde verbonden dat de betrokken partij is voorzien
      van een etiket en een bewijsstuk als bedoeld in artikel 13 van Richtlijn 2002/56/EG van de Raad van 13 juni 2002
      betreffende het in de handel brengen van pootaardappelen (PbEG 2002, L 193).

      4 Het etiket en het bewijsstuk, bedoeld in het derde lid, worden afgegeven door de Stichting Nederlandse Algemene
      Keuringsdienst voor zaaizaad en pootgoed van landbouwgewassen.


      [ref1]: https://wetten.overheid.nl/BWBR0024235#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0024235#Artikel32
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel314
    references:
