  - number: 2:5
    text: |-
      1 De aangifte tot tijdelijke opslag bevat de in bijlage 9, aanhangsel A, onderdeel 2, van de Gedelegeerde
      Verordening overgangsregels Douanewetboek van de Unie genoemde vereiste gegevens.

      2 Indien de aangifte tot tijdelijke opslag betrekking heeft op een of meerdere goederen, genoemd in bijlage V,
      deel B, van Richtlijn 2000/29/EG van de Raad van 8 mei 2000 betreffende de beschermende maatregelen tegen het
      binnenbrengen en de verspreiding in de Gemeenschap van voor planten en voor plantaardige producten schadelijke
      organismen (PbEG 2000, L 169), wordt dit, gelijktijdig met het indienen van de aangifte tot tijdelijke opslag en
      door de indiener van die aangifte, expliciet medegedeeld aan de douane.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel25
  - number: 2:8a
    text: |-
      In voorkomend geval kan de inspecteur, rekening houdend met de aard van de goederen, in het geval van de toepassing
      van een douaneregeling of wederuitvoer, andere plaatsen dan douanekantoren aanmerken als plaatsen waar goederen
      kunnen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel28a
  - number: 2:11
    text: |-
      1 De formulieren enig document worden ingevuld overeenkomstig het bepaalde in de Toelichting enig document, zoals
      opgenomen in [bijlage VI][ref1].

      2 De bij de invulling van de formulieren enig document te gebruiken codes zijn de codes opgenomen in het codeboek
      Douane en beschikbaar via internetadres [www.douane.nl](http://www.douane.nl).


      [ref1]: https://wetten.overheid.nl/BWBR0024291
