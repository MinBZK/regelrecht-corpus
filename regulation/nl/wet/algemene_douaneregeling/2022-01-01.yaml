    text: |-
      Op de omzetbelasting zijn de artikelen 67 en 68 van Verordening 1186/2009, alsmede de [artikelen 7:2][ref1] en
      [7:4][ref2] van overeenkomstige toepassing met dien verstande dat:

      a. de vrijstelling kan worden verleend voor alle goederen die speciaal zijn ontworpen voor onderwijs aan en
      tewerkstelling of verbetering van de maatschappelijke positie van geestelijk gehandicapten, blinden en andere
      lichamelijk gehandicapten;

      b. geen vrijstelling wordt verleend indien de goederen door geestelijk gehandicapten, blinden en andere lichamelijk
      gehandicapten voor hun eigen gebruik worden ingevoerd;

      c. geen vrijstelling wordt verleend indien de goederen met enige commerciële bijbedoeling van de gever of niet om
      niet aan een in [bijlage XV][ref3] aangewezen instelling of organisatie worden gezonden.


