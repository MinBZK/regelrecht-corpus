    text: |-
      De algemeen directeur Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische Zaken
      en Klimaat is ontvanger in de zin van [artikel 1:3, eerste lid, onderdeel c, van de wet][ref1] en
      [artikel 3, eerste lid, van de Invorderingswet 1990][ref2], voor zover het betreft restituties, subsidies dan wel
      waarborgsommen als bedoeld in [hoofdstuk 3 van het besluit][ref3].


