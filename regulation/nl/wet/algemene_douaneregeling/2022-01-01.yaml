      1 De directeur-generaal Douane, de algemeen directeuren en de directeur, bedoeld in
      [artikel 5, eerste lid, van de Uitvoeringsregeling Belastingdienst 2003][ref1], zijn inspecteur en ontvanger als
      bedoeld in [artikel 1:3, eerste lid, onderdeel c, van de wet][ref2].

      2 De directeur-generaal Douane is inspecteur en ontvanger als bedoeld in
      [artikel 1:3, eerste lid, onderdeel c, van de wet][ref3], voor zover het de belastingaangelegenheden betreft die
      verband houden met het Koninklijk Huis.


