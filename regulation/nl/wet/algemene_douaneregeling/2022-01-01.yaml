  - number: 7:28
    text: |-
      1 De informatie, bedoeld in artikel 253, eerste lid, van de Uitvoeringsverordening Douanewetboek van de Unie, is,
      behoudens in de gevallen waarin de goederen in het kader van de regeling passieve veredeling zijn uitgevoerd, niet
      vereist indien het de volgende goederen betreft:

      a. motorrijtuigen alsmede kleine aanhangwagens die zijn bestemd voor het vervoer van reisbenodigdheden, duidelijk
      sporen van gebruik vertonen en samen met de motorrijtuigen worden ingevoerd, indien bij de motorrijtuigen een
      geldig kentekenbewijs aanwezig is en zij, alsmede de aanhangwagens, het in dat bewijs vermelde kenteken voeren,
      voor zover daaruit blijkt dat zij in het vrije verkeer zijn;

      b. aanhangwagens, andere dan die zijn bedoeld in onderdeel a en opleggers, voor zover uit de overgelegde bescheiden
      dan wel op andere wijze blijkt dat zij in het vrije verkeer zijn;

      c. luchtvaartuigen die in één der lidstaten van de Europese Unie zijn ingeschreven;

      d. locomotieven en ander rollend spoorwegmaterieel, die zijn ingeschreven in het wagenpark van een in één der
      lidstaten gevestigde spoorweg- of andere onderneming, indien wordt aangetoond dat zij tevoren uit het vrije verkeer
      van het douanegebied van de Unie zijn uitgevoerd;

      e. andere vervoermiddelen, indien wordt aangetoond dat zij tevoren uit het vrije verkeer van het douanegebied van
      de Unie zijn uitgevoerd;

      f. containers, met inbegrip van het normale toebehoren en de normale uitrusting daarvan, verpakkingsmiddelen en
      andere voorwerpen, vervaardigd en ingericht voor het vervoer van goederen, alsmede dekkleden en stuwmateriaal ten
      aanzien waarvan bij wederinvoer, gelet op de aard, de bijzondere kenmerken en de gebruiksvoorwaarden, aannemelijk
      is dat zij tevoren uit het vrije verkeer van het douanegebied van de Unie zijn uitgevoerd;

      g. goederen die deel uitmaken van de persoonlijke bagage van reizigers en die tevoren uit het vrije verkeer van het
      douanegebied van de Unie zijn uitgevoerd; de inspecteur kan vorderen dat de herkomst uit het vrije verkeer van het
      douanegebied van de Unie wordt aangetoond door middel van een schriftelijk bewijsstuk.

      2 Wanneer de inspecteur twijfelt of vervoermiddelen voldoen aan de voorwaarden voor de vrijstelling van rechten
      bij invoer, kunnen de vervoermiddelen worden ingevoerd nadat zekerheid is gesteld voor de rechten bij invoer die
      voor die vervoermiddelen verschuldigd zijn. De belanghebbende kan binnen drie maanden bij de inspecteur een verzoek
      indienen om voor de goederen alsnog vrijstelling van rechten bij invoer te verlenen, mits hij daarbij aantoont dat
      aan de voorwaarden voor de vrijstelling van rechten bij invoer is voldaan.

      3 Er bestaat geen recht op vrijstelling van rechten bij invoer voor een motorrijtuig waarvan het chassis- of
      framenummer is gewijzigd of verwijderd tenzij daartoe door de inspecteur toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel728
  - number: 8:1
    text: |-
      Een hypotheek wordt als zekerheidstelling aanvaard indien:

      a. de waarde van de desbetreffende onroerende zaak voldoende is om als onderpand dienst te kunnen doen;

      b. de onroerende zaak verzekerd is tegen brand en de Staat der Nederlanden in de verzekeringspolis is aangewezen
      als begunstigde van de uitkering;

      c. de hypotheekgever een zogenoemde hypothecair-belangverzekering heeft afgesloten dan wel de hypotheekakte een
      zogenoemde Kramer-verklaring bevat;

      d. in de akte een huurbeding als bedoeld in [artikel 264 van Boek 3 van het Burgerlijk Wetboek][ref1] is opgenomen;

      e. in de hypotheekakte een beding als bedoeld in [artikel 265 van Boek 3 van het Burgerlijk Wetboek][ref2] is
      opgenomen;

      f. in de hypotheekakte de bedingen, bedoeld in [artikel 267 van Boek 3 van het Burgerlijk Wetboek][ref3], zijn
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel264
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel265
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel267
