  - number: 1:13
    text: |-
      In deze afdeling wordt verstaan onder:

      a. certificaat van oorsprong: bewijsstuk inzake de niet-preferentiële oorsprong van goederen;

      b. certificaat inzake goederenverkeer: certificaat EUR.1 of EUR-MED ten bewijze van de preferentiële oorsprong
      van goederen;

      c. handelsregister: handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 2007][ref1];

      d. Kamer: Kamer van Koophandel, bedoeld in [artikel 2 van de Wet op de Kamer van Koophandel][ref2];

      e. leveranciersverklaring: verklaring als bedoeld in artikel 61, eerste lid, van de Uitvoeringsverordening
      Douanewetboek van de Unie;

      f. oorsprongsverklaring: verklaring inzake de preferentiële oorsprong van goederen, in gevallen dat de
      toepasselijke autonome preferentiële regeling of een handels- of associatieovereenkomst daarin voorziet;

      g. commissie: adviescommissie voor de oorsprong;

      h. NAK: Stichting Nederlandse Algemene Keuringsdienst voor zaaizaad en pootgoed van landbouwgewassen;

      i. Naktuinbouw: Stichting Nederlandse Algemene Kwaliteitsdienst Tuinbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel2
