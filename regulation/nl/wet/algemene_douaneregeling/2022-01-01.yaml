  - number: 11:6
    text: |-
      Hij die in strijd met wettelijke bepalingen verandering brengt in de staat waarin goederen als bedoeld in artikel
      134 of artikel 158, derde lid, van het Douanewetboek van de Unie maakt zich schuldig aan het plegen van een
      strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel116
  - number: 11:7
    text: |-
      Hij die in strijd met de wettelijke bepalingen een aanvullende aangifte zoals bedoeld in artikel 167, eerste lid,
      van het Douanewetboek van de Unie achterwege laat of niet tijdig doet, pleegt een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel117
  - number: 11:8
    text: |-
      Hij die in strijd met de wettelijke bepalingen geen mededeling doet van de aankomst of van het vertrek van een
      schip als bedoeld in [artikel 2:1, vierde lid][ref1], maakt zich schuldig aan het plegen van een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel21
