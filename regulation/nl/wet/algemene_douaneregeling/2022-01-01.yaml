  - number: 7:16c
    text: |-
      Een op grond van deze afdeling te verlenen vrijstelling van rechten bij invoer wordt:

      a. voorwaardelijk verleend;

      b. voor goederen verleend voor redelijke hoeveelheden.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel716c
  - number: 7:16ca
    text: |-
      De commandant verleent desgevraagd met alle hem ten dienste staande middelen aan de inspecteur de benodigde
      medewerking:

      a. om te verzekeren dat goederen die in aanmerking komen voor inbeslagneming of beslaglegging aan de inspecteur
      respectievelijk de ontvanger worden overgedragen;

      b. opdat de door het personeel van de betreffende buitenlandse NAVO-strijdkrachten en de gezinsleden daarvan
      verschuldigde rechten bij invoer, alsmede andere belastingen, rente, kosten van ambtelijke werkzaamheden,
      bestuurlijke boeten en strafbeschikkingen als bedoeld in [artikel 2 van de Invorderingswet 1990][ref1] worden
      betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel716ca
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
  - number: 7:16d
    text: |-
      Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van uitrusting, proviand,
      materiaal en andere goederen door of ten behoeve van buitenlandse NAVO-strijdkrachten, die bestemd zijn:

      a. voor uitsluitend gebruik door die strijdkrachten, het personeel van die strijdkrachten of de gezinsleden van dat
      personeel; of

      b. te worden verkocht of om niet te worden overgedragen in militaire winkels, kantines, restaurants, clubs of
      messes voor persoonlijk gebruik aan personeel van die strijdkrachten of aan de gezinsleden van dat personeel.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel716d
  - number: 7:16da
    text: |-
      Voor toepassing van de vrijstelling van rechten bij invoer, bedoeld in [artikel 7:16d][ref1], ter zake van
      goederen die in het vrije verkeer zijn gebracht ten behoeve van de AFNORTH International School, is ook sprake
      van uitsluitend gebruik door de strijdkrachten, in de zin van artikel 7:16d, indien de school een verwaarloosbaar
      aantal kinderen toelaat dat niet tot het gezin behoort van personeel van buitenlandse NAVO-strijdkrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel716d
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel716da
