      b. de kennisgeving, bedoeld in [artikel 2:4, eerste lid][ref2];

      c. het tijdig indienen van de aangifte, bedoeld in [artikel 2:2a, eerste lid][ref3];

      d. het onverwijld ter beschikking stellen van het overzicht, bedoeld in [artikel 2:2a, tweede lid][ref4];

      e. de mededeling, bedoeld in [artikel 2:5, tweede lid][ref5]; of

