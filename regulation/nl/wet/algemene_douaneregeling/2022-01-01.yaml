  - number: 1:14
    text: |-
      1 Een aanvraag tot afgifte van een certificaat van oorsprong wordt ingediend bij de Kamer.

      2 De aanvraag bevat gegevens en bewijsstukken op basis waarvan de oorsprong van de in de aanvraag vermelde goederen
      kan worden vastgesteld.

      3 De Kamer beslist op de aanvraag, bedoeld in het eerste lid. Wanneer de aanvraag wordt ingewilligd, wordt het
      certificaat van oorsprong door de Kamer bekrachtigd.

      4 Het is verboden onjuiste of onvolledige gegevens te verstrekken:

      a. bij de aanvraag, bedoeld in het eerste lid; of

      b. aan een ander ten behoeve van een aanvraag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel114
  - number: 1:15
    text: |-
      1 Indien de aanvraag, bedoeld in [artikel 1:14, eerste lid][ref1], betrekking heeft op teeltmateriaal als bedoeld
      in [artikel 1, aanhef, onderdeel f, van de Zaaizaad- en plantgoedwet 2005][ref2], wordt bij de aanvraag als
      bewijsstuk als bedoeld in [artikel 1:14, tweede lid][ref3], overlegd:

      a. een officiële verklaring van de NAK, voor wat betreft teeltmateriaal van landbouwgewassen als bedoeld in
      [artikel 1, eerste lid, aanhef, onderdeel p, van het Besluit verhandeling teeltmateriaal][ref4];

      b. een officiële verklaring van de Naktuinbouw, voor wat betreft
      teeltmateriaal van bosbouwgewassen en tuinbouwgewassen als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __, of

      c. enig ander bewijsstuk dat kan dienen om de oorsprong van de in de aanvraag vermelde producten vast te stellen,
      dat door de Minister van Landbouw, Natuur en Voedselkwaliteit voor het desbetreffende teeltmateriaal is afgegeven.

      2 Een bewijsstuk als bedoeld in [artikel 1:14, tweede lid][ref6], is voor een aanvraag als bedoeld
      in artikel 1:14, eerste lid, die betrekking heeft op groente en fruit als bedoeld in deel IX, van
      bijlage I, bij Verordening 1308/2013 het gewaarmerkt afschrift van het controlebewijs, bedoeld in
      [artikel 14, eerste lid, onderdeel b, van het Landbouwkwaliteitsbesluit 2007][ref7].

      3 Indien de producten, vermeld in de aanvraag, tegelijkertijd kunnen worden aangemerkt als teeltmateriaal als
      bedoeld in het eerste lid, en als groente en fruit als bedoeld in het tweede lid, wordt het eerste of het tweede
      lid toegepast afhankelijk van de bestemming die aan die producten wordt gegeven.


