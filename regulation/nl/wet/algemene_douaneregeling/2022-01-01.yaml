  - number: 2:4
    text: |-
      1 Degene die aan de kust goederen heeft opgevist of gered, dan wel aldaar aangespoelde of gestrande
      goederen heeft geborgen, geeft daarvan onverwijld kennis aan de inspecteur. Voor de toepassing van
      de vorige volzin wordt onder kust mede verstaan de wateren, stranden en oevers welke op grond van
      [artikel 21 van de Wet op de strandvonderij][ref1] worden beschouwd te behoren tot de zee en het zeestrand.

      2 De goederen worden zonder toestemming van de inspecteur niet verder landinwaarts gebracht dan tot de eerste
      plaats waar zij tegen beschadiging door het zeewater zijn beveiligd.

      3 Na de kennisgeving worden de goederen aangemerkt als binnengebrachte goederen in de zin van artikel 134, eerste
      lid, van het Douanewetboek van de Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0001951#Artikel21
