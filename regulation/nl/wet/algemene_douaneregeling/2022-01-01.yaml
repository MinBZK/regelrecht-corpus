  - number: 6:2
    text: |-
      1 Van een schip of een luchtvaartuig dat het douanegebied van de Unie over zee, onderscheidenlijk door de lucht,
      zal verlaten, wordt voor vertrek op elektronische wijze een aangifte ten uitklaring gedaan door het inzenden van
      de generale verklaring (IMO/FAL 1), onderscheidenlijk door het inzenden van de generale verklaring luchtvaart,
      bedoeld in bijlage 9 bij het op 7 december 1944 te Chicago tot stand gekomen Verdrag inzake de internationale
      burgerluchtvaart (Stb. 1947, 165), waarin de gegevenselementen, genoemd in [bijlage IXa][ref1], titel III, zijn
      opgenomen

      2 Van alle goederen geladen in een Nederlandse haven of luchthaven aan boord van het schip of luchtvaartuig,
      bedoeld in het eerste lid, wordt uiterlijk op de werkdag volgend op de dag van vertrek uit de haven,
      onderscheidenlijk de luchthaven, een aangifte ten uitklaring gedaan bij het douanekantoor van uitgang door
      het op elektronische wijze inzenden van het douanemanifest bij uitgang waarin de gegevenselementen, genoemd in
      [bijlage IXa][ref2], titel II, zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024291
      [ref2]: https://wetten.overheid.nl/BWBR0024291
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0024291
      - id: ref2
        bwb_id: BWBR0024291
  - number: 6:3
    text: |-
      1 Als vaarwaters waarlangs schepen en de daarin of daarop aanwezige goederen het douanegebied van de Unie
      rechtstreeks verlaten, worden aangewezen de vaarwaters, opgenomen in [bijlage II][ref1].

      2 In afwijking van het eerste lid wordt toegestaan dat goederen die over zee het douanegebied van de Unie zullen
      verlaten, worden overgeladen in een schip dat het douanegebied van de Unie zal verlaten.

      3 De toestemming, bedoeld in het tweede lid, wordt slechts verleend voor het overladen van:

      a. scheepsvoorraden ten behoeve van de bemanning van het schip;

      b. brandstoffen of smeermiddelen bestemd voor de aandrijving of smering van het schip;

      c. goederen welke nodig zijn voor reparatie of vervanging van onderdelen van het schip, mits deze reparatie of
      vervanging noodzakelijk is om het schip zijn reis te kunnen laten voortzetten.

      4 Voor het overladen, bedoeld in het tweede lid, is een vergunning van de inspecteur vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0024291
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0024291
  - number: 6:4
    text: |-
      Schepen en luchtvaartuigen hoeven niet te worden aangebracht bij een douanekantoor van uitgang indien:

      a. de eerste haven of luchthaven van bestemming is gelegen binnen het douanegebied van de Unie;

      b. geen goederen aan boord zijn waarvoor bij de uitvoer, wederuitvoer, dan wel met het oog op de verkrijging van
      kwijtschelding of terugbetaling van rechten bij invoer of andere belastingen aan het douanekantoor van uitgang
      formaliteiten moeten worden vervuld;

      c. op de aan boord aanwezige goederen geen verboden of beperkingen als bedoeld in
      [artikel 1:1, vijfde lid, van de wet][ref1] bij het verlaten van het douanegebied van de Unie van toepassing zijn
      of zouden zijn; en

      d. het schip of luchtvaartuig in de Unie thuishoort.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel11
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: 1:1
