      1 Het in het vrije verkeer brengen van textielproducten van oorsprong uit de Democratische Volksrepubliek Korea,
      genoemd in bijlage III bij Verordening (EU) 2015/936 van het Europees Parlement en de Raad van 9 juni 2015
      betreffende een gemeenschappelijke regeling voor de invoer van textielproducten uit bepaalde derde landen, die
      niet vallen onder bilaterale overeenkomsten, protocollen of andere regelingen, noch onder een andere, bijzondere
      invoerregeling van de Unie (Pb EU 2015, L 160), zonder vergunning van de Minister voor Buitenlandse Handel en
      Ontwikkelingssamenwerking is verboden.

      2 Het eerste lid geldt niet indien bij het in het vrije verkeer brengen een geldige invoervergunning wordt
      overgelegd, afgegeven door een daartoe bevoegde autoriteit van een andere lidstaat van de Europese Unie.
