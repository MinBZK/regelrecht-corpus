  - number: 2:2a
    text: |-
      1 Van de in een schip aanwezige scheepsvoorraden wordt bij binnenkomst en uiterlijk 2 uur na het daadwerkelijke
      tijdstip van aankomst langs elektronische weg een scheepsvoorradenaangifte (IMO/FAL 3) ingediend bij de inspecteur.

      2 De gezagvoerder moet desgevraagd onverwijld een overzicht van de in het schip aanwezige persoonlijke bezittingen
      van de bemanningsleden (IMO/FAL 4) ter beschikking stellen van de inspecteur.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel22a
  - number: 2:3
    text: |-
      De [artikelen 2:0][ref1], [2:1][ref2], [2:2a][ref3] en [2:5][ref4] zijn niet van toepassing op schepen en
      luchtvaartuigen indien:

      a. de laatste haven, onderscheidenlijk luchthaven, van vertrek voor aankomst in Nederland is gelegen in het
      douanegebied van de Unie;

      b. geen goederen aan boord zijn waarvoor bij het in het vrije verkeer brengen rechten bij invoer of andere
      belastingen zijn verschuldigd of waarvoor ingevolge een wettelijk voorschrift de vervulling van bepaalde
      formaliteiten is vereist;

      c. op de aan boord aanwezige goederen bij het binnenbrengen in het douanegebied van de Unie geen verboden of
      beperkingen van toepassing zijn of zouden zijn als bedoeld in [artikel 1:1, vijfde lid, van de wet][ref5]; en

      d. het schip of luchtvaartuig in de Unie thuishoort.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0024291#Artikel21
