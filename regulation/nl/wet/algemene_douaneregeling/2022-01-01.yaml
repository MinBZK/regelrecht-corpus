      1 De directeur-generaal Douane, bedoeld in
      [artikel 4, tweede lid, van de Uitvoeringsregeling Belastingdienst 2003][ref1], is de bevoegde douaneadministratie,
      bedoeld in artikel 10 van de Overeenkomst opgesteld op grond van artikel K3 van het Verdrag betreffende de Europese
      Unie inzake het gebruik van informatica op douanegebied (Trb. 1995, 287).

      2 De in het eerste lid bedoelde douaneadministratie is gehouden uitvoering te geven aan onherroepelijke
      beslissingen van een rechtbank of een andere bevoegde autoriteit met betrekking tot kennisneming, verwijdering of
      verbetering van persoonsgegevens, als bedoeld in artikel 15, vierde lid, onder I, II en III, van de in het eerste
      lid genoemde overeenkomst.


