  - number: 7:6
    text: |-
      Voor de beoordeling van de vraag of monsters en stalen als bedoeld in artikel 86 van Verordening 1186/2009 een
      onbeduidende waarde hebben, wordt de gezamenlijke waarde van alle monsters en stalen die van eenzelfde zending
      deel uitmaken, in aanmerking genomen. De waarden van de zendingen die door dezelfde afzender aan verschillende
      geadresseerden zijn verzonden, worden niet samengeteld.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel76
  - number: 7:7
    text: |-
      De vrijstelling van rechten bij invoer, bedoeld in artikel 113 van Verordening 1186/2009, voor zover deze
      betrekking heeft op lijkkisten of urnen, wordt slechts verleend indien een laissez passer voor lijken, een
      lijkenpas of een overeenkomstige verklaring wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel77
  - number: 7:8
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van goederen die bestemd
      zijn voor het persoonlijk gebruik – gebruik door inwonende gezinsleden daaronder begrepen – van diplomatieke en
      consulaire ambtenaren, met uitzondering van honoraire consuls, van in [bijlage XVII][ref1] genoemde diplomatieke en
      consulaire vertegenwoordigingen voor zover deze ambtenaren zijn geaccrediteerd of aangemeld bij Nederland.

      2 De vrijstelling, bedoeld in het eerste lid, is niet van toepassing indien de desbetreffende ambtenaar Nederlander
      is of duurzaam in Nederland verblijft dan wel indien deze vrijstelling is of zal worden verleend door een andere
      lidstaat van de Europese Unie.

      3 De vrijstelling, bedoeld in het eerste lid:

      a. is voor zover het motorrijtuigen betreft, beperkt tot twee personenvoertuigen per ambtenaar;

      b. wordt voor alcoholhoudende producten en tabaksproducten slechts verleend onder voorwaarde van wederkerigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0024291
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0024291
  - number: 7:9
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van goederen die bestemd
      zijn voor het persoonlijk gebruik – gebruik door inwonende gezinsleden daaronder begrepen – van leden van het
      administratief, technisch en bedienend personeel van in [bijlage XVII][ref1] genoemde diplomatieke en consulaire
      vertegenwoordigingen voor zover die personeelsleden zijn aangemeld bij Nederland.

      2 De vrijstelling, bedoeld in het eerste lid, is niet van toepassing indien het desbetreffende personeelslid
      Nederlander is, duurzaam in Nederland verblijft, of indien er op het moment van het in het vrije verkeer brengen
      sinds de aanvang van de tewerkstelling in Nederland meer dan 10 jaren zijn verstreken. Voorts is de vrijstelling
      niet van toepassing indien deze vrijstelling is of zal worden verleend door een andere lidstaat van de Europese
      Unie.

      3 De vrijstelling, bedoeld in het eerste lid:

      a. is voor zover het motorrijtuigen betreft, beperkt tot twee personenvoertuigen per personeelslid, tenzij met
      de diplomatieke of consulaire vertegenwoordiging is overeengekomen dat deze vrijstelling beperkt is tot één
      personenvoertuig per personeelslid;

      b. wordt voor alcoholhoudende producten en tabaksproducten slechts verleend onder voorwaarde van wederkerigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0024291
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0024291
  - number: 7:10
    text: |-
      1 Het verzoek tot het verlenen van een vrijstelling, bedoeld in [artikel 7:8][ref1] en [artikel 7:9][ref2], wordt
      gedaan door het overleggen van de aangifte voor het brengen in het vrije verkeer. Deze aangifte wordt gedaan bij
      de inspecteur door het overleggen van een door het hoofd van de diplomatieke of consulaire vertegenwoordiging
      ondertekende aangifte Douane 39.

      2 De vrijstelling wordt slechts verleend indien alle douane-exemplaren van eerder gedane aangiften ten
      behoeve van eenzelfde belanghebbende, voorzien van een door hem en het hoofd van de diplomatieke of consulaire
      vertegenwoordiging voor gezien getekende ontvangstbevestiging, binnen drie dagen na het verstrijken van de
      geldigheidsduur van de volgens het eerste lid gedane aangifte door de inspecteur zijn terugontvangen.

      3 Voor een motorrijtuig waarvoor vrijstelling van rechten bij invoer is verleend, wordt in het kentekenregister de
      aantekening opgenomen ‘vrijstelling van rechten bij invoer en/of omzetbelasting en/of belasting van personenauto’s
      en motorrijwielen; vervalt bij vervreemding; vrijstelling niet overdraagbaar’. De motorrijtuigen mogen zonder een
      dergelijke aantekening niet worden gebruikt.

      4 Het is verboden om de overeenkomstig de [artikelen 7:8][ref3] en [7:9][ref4] met vrijstelling in het vrije
      verkeer gebrachte goederen:

        - uit te lenen, te verpanden, te verhuren, onder bezwarende titel of om niet over te dragen, zonder dat daartoe
      toestemming is verkregen van de inspecteur die de vrijstelling heeft verleend; en
        - te gebruiken op een wijze of voor doeleinden waarvoor de vrijstelling niet geldt.


