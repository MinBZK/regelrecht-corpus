  - number: 3:16n
    text: |-
      1 De Minister van Landbouw, Natuur en Voedselkwaliteit kan een monster nemen op een bedrijf van een verwerker
      of op een andere plaats in de distributieketen van een verwerkt product van de voorraden van de in het kader van
      verordening 412/2008 verwerkte producten.

      2 Een monster van een verwerkt product zonder saus bedraagt tenminste 500 gram en bestaat waar mogelijk uit 3
      verpakkingseenheden.

      3 Een monster van overige producten bedraagt tenminste 3 van de kleinste verpakkingseenheden.

      4 Op verzoek van een verwerker neemt de Minister van Landbouw, Natuur en Voedselkwaliteit tegelijk met het nemen
      van een monster als bedoeld in het eerste lid een alternatief monster van gelijke grootte uit dezelfde partij
      verwerkte producten met dezelfde productiecode.

      5 Een verwerker bewaart het in het vierde lid bedoelde alternatieve monster op zijn bedrijf.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel316n
  - number: 3:16o
    text: |-
      1 De Minister van Landbouw, Natuur en Voedselkwaliteit laat een monster onderzoeken als bedoeld in
      [artikel 3:16n, eerste lid][ref1].

      2 De Minister van Landbouw, Natuur en Voedselkwaliteit besluit in ieder geval dat een product niet voldoet aan de
      voorwaarden van deze afdeling indien een monster van een A-product:

      a. ander vlees dan rundvlees bevat;

      b. toevoegingen aan een eindproduct, met uitzondering van water, meer bedragen dan 15% van het netto gewicht van
      een eindproduct;

      c. de verhouding tussen het collageen en het eiwit groter is dan 0,45 in het eindproduct;

      d. minder dan 20% van het netto gewicht van een eindproduct bestaat uit mager vlees, of

      e. bij doorsnijding van het dikste gedeelte van een eindproduct sporen van een roséachtige vloeistof zijn waar
      te nemen.

      3 De Minister van Landbouw, Natuur en Voedselkwaliteit concludeert in het advies in ieder geval dat een product
      niet voldoet aan de voorwaarden van deze afdeling indien een monster van een B-product:

      a. geen rundvlees bevat;

      b. de kleur en consistentie van vers vlees van een verwerkt product met GN-code 0210 20 90 van de gecombineerde
      nomenclatuur niet volledig is verdwenen, of

      c. de verhouding in het eindproduct tussen het water en het eiwit groter is dan 3,2.


