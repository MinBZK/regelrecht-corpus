      1 Een douaneaangifte, een aangifte tot tijdelijke opslag, een summiere aangifte bij binnenbrengen, een summiere
      aangifte bij uitgaan, een aangifte tot wederuitvoer of een kennisgeving van wederuitvoer wordt gesteld in de
      Nederlandse of de Engelse taal.

      2 De inspecteur stelt de technische specificaties vast van de aangiften en de kennisgeving, genoemd in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel111
  - number: 1:12
    text: |-
      Het tarief van de kosten die op grond van [artikel 1:19, eerste lid, van de wet][ref1], door de belanghebbende aan
      het Rijk verschuldigd zijn, is:

      a. indien het ambtelijke verrichtingen betreft: € 24 per half uur;

      b. het bedrag, dat door derden aan de inspecteur in rekening is gebracht.


