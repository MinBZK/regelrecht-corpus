  - number: 7:16ga
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor de invoer van geschenkzendingen en goederen die strekken
      tot vervanging van reeds eerder met vrijstelling van rechten bij invoer ingevoerde goederen door personeel van
      buitenlandse NAVO-strijdkrachten en civiele diensten en de gezinsleden daarvan.

      2 Het eerste lid is van toepassing indien door het personeelslid van buitenlandse NAVO-strijdkrachten of civiele
      diensten of door het gezinslid, dat de goederen invoert, een verklaring van zijn commandant wordt overgelegd waarin
      wordt bevestigd, dat de in te voeren goederen deel uitmaken van een geschenkzending of persoonlijke goederen of
      vervangingsgoederen zijn en dat zij bestemd zijn voor persoonlijk huishoudelijk gebruik van het personeelslid of
      het gezinslid dat de goederen invoert.

      3 Indien bij invoer de goederen, bedoeld in het eerste en tweede lid, door de leden van buitenlandse NAVO-
      strijdkrachten of civiele diensten of hun gezinsleden zelf worden meegebracht, kunnen zij volstaan met overlegging
      van een soortgelijke door henzelf opgemaakte verklaring als bedoeld in het tweede lid.

      In dat geval zijn die leden verplicht een kopie daarvan alsnog door hun commandant te laten certificeren en deze
      kopie in te leveren bij de inspecteur.

      4 Indien een kopie als bedoeld in het derde lid, niet tijdig door de inspecteur wordt ontvangen, neemt de
      inspecteur contact op met de commandant van de betreffende buitenlandse NAVO-strijdkracht.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel716ga
  - number: 7:16h
    text: |-
      1 Voor de toepassing van de [artikelen 7:16d tot en met 7:16g][ref1] kan het formulier 302 worden gebruikt als
      douaneaangifte voor zover de invoer van goederen geschiedt door, namens of ten behoeve van de buitenlandse NAVO-
      strijdkrachten.

      2 De commandant legt bij de inspecteur een lijst over met de namen, rang, functie en handtekening van de personen
      die, na de aankomst van de goederen op de plaats van bestemming, bevoegd zijn tot het ondertekenen van de
      verklaring van ontvangst op het formulier 302.

      3 De persoon, bedoeld in het tweede lid, stelt de inspecteur in kennis van de aankomst van de goederen op de
      plaats van bestemming of van een vertraging of onderbreking van het vervoer. De inspecteur bepaalt op welke wijze
      die kennisgeving geschiedt. Indien het tijdstip van aankomst van de goederen vaststaat mag de kennisgeving ook
      geschieden vóór de aankomst van de goederen.

      4 De persoon, bedoeld in het tweede lid, licht de inspecteur onverwijld in indien enige onregelmatigheid is
      geconstateerd of wordt vermoed met een zending goederen.

      5 De persoon, bedoeld in het tweede lid, verschaft aan de inspecteur desgevraagd inzage van alle boeken, bescheiden
      en andere gegevensdragers of de inhoud daarvan – zulks ter keuze van de inspecteur – die op een zending goederen
      betrekking hebben.

      6 Een aangebrachte douaneverzegeling mag niet worden verbroken en de goederen mogen niet eerder worden gelost dan
      na de bevestiging door de inspecteur van de ontvangst van de kennisgeving, bedoeld in het derde lid, waarbij de
      inspecteur meedeelt of tot het verbreken van de eventuele douaneverzegeling en tot lossing van de goederen mag
      worden overgegaan.

      7 Na de lossing en opneming in de administratie wordt op alle exemplaren van het formulier 302 de daarop
      voorkomende verklaring van ontvangst door de persoon, bedoeld in het tweede lid, namens de commandant ingevuld en
      ondertekend op de volgende wijze:

      For The Commander (onderdeel)

      (Naam van de commandant of door hem aangewezen persoon)

      (Rang en registratienummer)

      (Functie)

      (Datum)

      8 Na de ondertekening van de verklaring van ontvangst, bedoeld in het zevende lid, worden de exemplaren van het
      formulier 302 en de bijbehorende bescheiden door de persoon, bedoeld in het vijfde lid, namens de commandant aan de
      inspecteur toegezonden of overhandigd.

      9 De commandant verleent desgevraagd met alle hem ten dienste staande middelen medewerking indien de inspecteur tot
      controle van goederen als bedoeld in het zesde lid wenst over te gaan en wijst een persoon aan die namens hem bij
      de controle aanwezig zal zijn. Het formulier 302 en de bescheiden die de goederen begeleiden worden op de plaats
      van bestemming door of namens de commandant onverwijld na de lossing van de goederen toegezonden aan of overhandigd
      aan de inspecteur.

      10 Bij niet-zuivering of bij gedeeltelijke zuivering van het formulier 302, zijn door de titularis van dat
      formulier de rechten bij invoer en andere belastingen verschuldigd aan welke de goederen, of dat gedeelte van de
      goederen waarvoor het formulier niet is gezuiverd, bij invoer zijn onderworpen.

      11 Het eerste tot en met tiende lid zijn van overeenkomstige toepassing op de tijdelijke invoer van persoonlijke
      goederen van personeel van buitenlandse NAVO-strijdkrachten en hun gezinsleden door of namens die strijdkrachten,
      met dien verstande dat op de plaats van bestemming bij het formulier 302 een inventarislijst wordt overgelegd.

      12 Goederen die met vrijstelling van rechten bij invoer en andere belastingen zijn ingevoerd, mogen vrij worden
      wederuitgevoerd. Bij de uitvoer wordt slechts één exemplaar van het formulier 302 bij het douanekantoor van vertrek
      ingeleverd.

      13 De wederuitvoer van persoonlijke goederen van personeel van buitenlandse NAVO-strijdkrachten en gezinsleden
      daarvan geschiedt overeenkomstig het bepaalde in het twaalfde lid, met dien verstande dat reeds op de plaats van
      vertrek het formulier 302 alsmede een inventarislijst door de desbetreffende buitenlandse NAVO-strijdkracht worden
      overhandigd aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel716d
