  - number: 3:1
    text: |-
      Het is verboden te handelen in strijd met de artikelen 5, eerste en derde lid, 6, eerste, tweede en vierde lid, van
      Gedelegeerde Verordening (EU) 2016/1237 en de artikelen 6, zevende lid, 9, eerste en derde lid, 12, vierde lid, 13,
      eerste en zesde lid, 14, vijfde lid, onderdeel a, en zesde lid, en 15 eerste, vierde en zesde lid, onderdeel c, van
      Uitvoeringsverordening (EU) 2016/1239.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel31
  - number: 3:2
    text: |-
      De Minister van Landbouw, Natuur en Voedselkwaliteit is:

      a. de met afgifte van certificaten belaste autoriteit, bedoeld in de artikelen 4, tweede lid, 6, derde, vierde
      en vijfde lid, 7, tweede, derde en vierde lid, 10, tweede lid, van Gedelegeerde Verordening (EU) 2016/1237 en
      de artikelen 2, zesde lid, 3, eerste en tweede lid, 4, eerste lid, 6, eerste, derde, vierde en zevende lid, 7,
      tweede lid, 9, tweede lid, 10, eerste en tweede lid, 11, 12, eerste en tweede lid, 13, tweede tot en met zesde
      lid, 14, vijfde, zesde en zevende lid, 15, eerste, vierde, vijfde en zesde lid, 16, tweede en derde lid, van
      Uitvoeringsverordening (EU) 2016/1239;

      b. de autoriteit, bedoeld in de artikelen 8, onderdelen c en g, en 9, vierde lid, van Gedelegeerde Verordening (EU)
      2016/1237 en de artikelen 2, tweede, derde en vierde lid, 13, zevende lid, 16, eerste en tweede lid, 17, 20, eerste
      tot en met vierde lid, en 21, eerste lid, van Uitvoeringsverordening (EU) 2016/1239;

      c. de bevoegde autoriteit, bedoeld in de artikelen 4, tweede lid, 6, derde, vierde en vijfde lid, 7, tweede, derde
      en vierde lid, 8, onderdelen c en g, 9, vierde lid, 10, tweede lid, van Gedelegeerde Verordening (EU) 2016/1237;

      d. de bevoegde autoriteit, bedoeld in de artikelen 3, eerste lid, en 5 van verordening 1301/2006;

      e. de bevoegde autoriteit, bedoeld in de artikelen 5, tweede lid, 10 en 11, eerste en tweede lid, van verordening
      412/2008.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel32
  - number: 3:3
    text: |-
      De Minister van Landbouw, Natuur en Voedselkwaliteit is de bevoegde autoriteit, bedoeld in artikel 7 van
      [Verordening (EG) nr. 2535/2001](32001R2535) van de Commissie van 14 december 2001 houdende uitvoeringsbepalingen
      van [Verordening (EG) nr. 1255/1999](31999R1255) van de Raad voor de invoerregeling voor melk en zuivelproducten en
      houdende opening van tariefcontingenten (PbEG 2001, L 341).
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel33
