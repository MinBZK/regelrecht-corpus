      1 Als douanekantoor van uitgang voor goederen die over zee het douanegebied van de Unie verlaten, worden aangewezen
      de douanekantoren, opgenomen in [bijlage III][ref1].

      2 Als douanekantoor van uitgang voor goederen die door de lucht het douanegebied van de Unie verlaten, worden
      aangewezen de douanekantoren, opgenomen in [bijlage IV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024291
