        hoofdstuk: '3'
        afdeling: '3.2'
  - number: 3:13e
    text: |-
      1 Het certificaat, bedoeld in artikel 9, eerste lid, van Gedelegeerde Verordening (EU) 2016/1237 wordt door de
      importeur aangevraagd bij de Minister van Landbouw, Natuur en Voedselkwaliteit.

      2 Het certificaat is geldig tot en met het einde van de zesde maand na de maand van afgifte.

      3 Het certificaat moet door de erkende importeur bij invoer aan de douane worden overhandigt ter afschrijving en
      moet door de erkende importeur worden teruggezonden aan de Minister van Landbouw, Natuur en Voedselkwaliteit binnen
      twee maanden na afloop van de maand waarin de geldigheidsduur van het certificaat is verstreken.

      4 Indien de ingevoerde hoeveelheid ten hoogste 5% hoger is dan de op het certificaat genoemde hoeveelheid wordt zij
      beschouwd als op grond van dat certificaat te zijn ingevoerd.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel313e
  - number: 3:13f
    text: |-
      Een erkende importeur treft zodanige maatregelen dat ook zijn afnemers voldoen aan het bepaalde in artikel 9 van
      Gedelegeerde Verordening (EU) 2016/1237 en de [artikelen 3:13a tot en met 3:13e][ref1].


