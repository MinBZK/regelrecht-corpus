    text: |-
      1 Op de accijnzen zijn de artikelen 3 tot en met 20, 23, 24, 59, 74 tot en met 80, 85, 86, 95 tot en met 101 en
      107 tot en met 112 van Verordening 1186/2009 alsmede de [artikelen 7:2 tot en met 7:16k][ref1] van overeenkomstige
      toepassing.

      2 Op de omzetbelasting zijn de artikelen 3 tot en met 20, 21, 24, 54 tot en met 56, 59 tot en met 65, 74 tot en
      met 103 en 105 tot en met 113 van Verordening 1186/2009, alsmede de [artikelen 7:2 tot en met 7:16k][ref2] van
      overeenkomstige toepassing.

      3 Op de verbruiksbelasting van alcoholvrije dranken zijn de artikelen 3 tot en met 20, 23, 24, 59, 74
      tot en met 80, 85, 86, 90 tot en met 101 en 107 tot en met 112 van Verordening 1186/2009 alsmede de
      [artikelen 7:2 tot en met 7:16k][ref3] van overeenkomstige toepassing.

      4 Op de omzetbelasting is de gehele of gedeeltelijke vrijstelling van rechten bij invoer bij het in het vrije
      verkeer brengen van goederen, die overeenkomstig de douaneregeling passieve veredeling tijdelijk zijn uitgevoerd,
      van overeenkomstige toepassing.

      5 Vrijstelling van omzetbelasting bij invoer van goederen wordt verleend voor in het vrije verkeer brengen van
      goederen door de Europese Commissie of door een krachtens het Unierecht opgericht agentschap of orgaan wanneer de
      Europese Commissie of door een dergelijk agentschap of orgaan deze goederen invoert in het kader van de uitvoering
      van de aan hen bij het Unierecht toevertrouwde taken ter bestrijding van de COVID-19-pandemie, tenzij de ingevoerde
      goederen onmiddellijk dan wel op een later tijdstip worden gebruikt voor latere leveringen onder bezwarende titel
      door de Europese Commissie of door een dergelijk agentschap of orgaan. De vrijstelling wordt verleend indien bij de
      aangifte voor het vrije verkeer een geldige verklaring wordt overgelegd waaruit blijkt dat ter zake van het in het
      vrije verkeer brengen deze vrijstelling kan worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0024291#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0024291#Artikel72
