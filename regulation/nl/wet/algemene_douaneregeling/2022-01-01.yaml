        afdeling: 7.2a
  - number: 7:16e
    text: |-
      Vrijstelling van rechten bij invoer wordt verleend voor de tijdelijke invoer van nieuwe en gebruikte persoonlijke
      goederen, niet zijnde motorrijtuigen, caravans en aanhangwagens, door personeel van buitenlandse NAVO-
      strijdkrachten bij eerste aankomst in Nederland om aldaar dienst te gaan doen of bij eerste aankomst van een
      gezinslid, dat zich bij hem komt voegen, voor de duur van de dienstuitoefening van dat personeel. De persoonlijke
      goederen dienen voor de vestiging in Nederland reeds deel uitgemaakt te hebben van de inboedel van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel716e
  - number: 7:16f
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor de tijdelijke invoer van motorrijtuigen, caravans en
      aanhangwagens door personeel van buitenlandse NAVO-strijdkrachten of zijn gezinsleden voor persoonlijk gebruik.

      2 Aan personeel van buitenlandse NAVO-strijdkrachten dat zijn motorrijtuigen, caravans en aanhangwagens tijdelijk
      wenst in te voeren met vrijstelling van rechten bij invoer, wordt door de inspecteur aan de belanghebbende een
      ‘verklaring vrijstelling van belastingen’ voor het desbetreffend motorrijtuig, de caravan of de aanhangwagen
      afgegeven. De inspecteur kan zekerheidstelling eisen bij de afgifte van bedoelde verklaring.

      3 Een ‘verklaring vrijstelling van belastingen’ als bedoeld in het tweede lid heeft een geldigheidsduur van één
      jaar. Deze verklaring kan op verzoek door de inspecteur telkens met één jaar worden verlengd.

      4 In de verklaring, bedoeld in het tweede lid, wordt het personeel van buitenlandse NAVO-strijdkrachten minimaal
      omschreven met de volgende gegevens:

      a. naam en voornamen;

      b. militair- of burgeradres.

      5 De gegevens, bedoeld in het vierde lid, worden gecontroleerd aan de hand van ten minste:

      a. een persoonlijk identiteitsbewijs, afgegeven door de commandant, dat is voorzien van naam, datum en plaats van
      geboorte, nationaliteit, rang, eventueel nummer, status, foto en geldigheidsduur; en

      b. voor zover niet in Nederland gestationeerd, een collectieve of individuele reiswijzer, afgegeven door de
      commandant of door de daartoe bevoegde autoriteit van de Organisatie van het Noord-Atlantisch Verdrag, bedoeld in
      artikel 1, onderdeel a, van het op 20 september 1951 te Ottawa tot stand gekomen Verdrag nopens de rechtspositie
      van de Noord-Atlantische Verdragsorganisatie, van de nationale vertegenwoordigers bij haar organen en van haar
      internationale staf (Trb. 1951, 139).

      6 Na overleg draagt de commandant op verzoek van Nederland zorg voor de registratie van de motorrijtuigen en in
      voorkomend geval caravans of aanhangwagens die op de voet van dit artikel worden ingevoerd.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel716f
  - number: 7:16g
    text: |-
      1 De [artikelen 7:16e][ref1] en [7:16f][ref2] zijn van overeenkomstige toepassing op het personeel van buitenlandse
      NAVO-strijdkrachten en gezinsleden daarvan voor zover die in het Koninkrijk België of in de Bondsrepubliek
      Duitsland voor de dienstuitoefening zijn gestationeerd, maar in Nederland wonen of verblijven.

      2 Het eerste lid is niet van toepassing op personeelsleden van buitenlandse NAVO-strijdkrachten en van hun
      civiele diensten met de Belgische of Duitse nationaliteit die in Nederland wonen, maar die in hun eigen land zijn
      gestationeerd.

      3 Voor de toepassing van het eerste lid verstrekt de commandant van de zich in het Koninkrijk België of in de
      Bondsrepubliek Duitsland voor de dienstuitoefening bevindende buitenlandse NAVO-strijdkrachten aan de inspecteur
      een opgave van de namen, de nationaliteiten en de adressen in Nederland van de personeelsleden, bedoeld in
      het eerste lid, en van de gezinsleden van dat personeel, van het tijdstip van hun komst naar Nederland, van de
      registratienummers en -letters van de door hen gebezigde motorrijtuigen, alsmede van de mutaties in voormelde
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel716e
      [ref2]: https://wetten.overheid.nl/BWBR0024291#Artikel716f
