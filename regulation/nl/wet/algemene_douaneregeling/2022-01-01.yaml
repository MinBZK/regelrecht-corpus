  - number: 12:1
    text: |-
      1 Van de inbeslagneming van goederen, ter zake van het begaan van bij wettelijke bepalingen strafbaar gesteld
      feiten door onbekende personen, wordt mededeling gedaan in één of meer door de inspecteur aan te wijzen dag- of
      nieuwsbladen, met vermelding van een omschrijving van de goederen en van de voor de goederen gebezigde verpakking.

      2 Indien de goederen een spoedige, aanmerkelijke waardevermindering onderhevig zijn of indien de bewaring of het
      onderhoud ervan een gevaar oplevert dan wel hoge kosten met zich meebrengt, wordt, in afwijking van het eerste lid,
      van de inbeslagneming op door inspecteur te bepalen wijze, naar plaatselijk gebruik, in het openbaar mededeling
      gedaan.

      3 De vorige leden vinden overeenkomstige toepassing bij de inbeslagneming op onbekende personen van vervoermiddelen
      en voorwerpen, bedoeld in [artikel 1:37, eerste lid, van de wet][ref1], met dien verstande dat tevens de gronden
      tot die inbeslagneming worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel137
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: 1:37
  - number: 12:2
    text: |-
      Onder de voorwaarden voor het vrijgeven van goederen welke ter zake van het begaan van bij wettelijke bepalingen
      strafbaar gestelde feiten in beslag zijn genomen, wordt ten minste gesteld dat ten kantore van een door de
      inspecteur aangewezen ontvanger zekerheid wordt gesteld tot verzekering van de uitlevering van de goederen of de
      voldoening van de waarde daarvan.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel122
  - number: 12:3
    text: |-
      1 Bij de inbewaringneming van goederen is, indien de belanghebbende bij die goederen niet bekend is,
      [Artikel 12:1, eerste en tweede lid][ref1], van overeenkomstige toepassing.

      2 De verkoop van de in bewaring genomen goederen vindt niet eerder plaats dan nadat aan het voornemen daartoe in de
      een of meerdere, door de inspecteur aan te wijzen, dag- of nieuwsbladen bekendheid is gegeven.

      3 Indien de goederen een spoedige, aanmerkelijke waardevermindering onderhevig zijn of indien de bewaring of het
      onderhoud ervan een gevaar oplevert dan wel hoge kosten met zich meebrengt, vindt, in afwijking van het tweede
      lid, de verkoop plaats nadat van het voornemen op door de inspecteur te bepalen wijze in het openbaar kenbaarheid
      is gegeven.

      4 De verkoop van de in bewaring genomen goederen geschiedt in het openbaar en volgens plaatselijke gebruiken.

      5 In afwijking van het bepaalde in de vorige leden, kan de verkoop met volmacht van de inspecteur onderhands
      geschieden indien het vermoeden bestaat dat uit de opbrengst van de goederen de aan een openbare verkoop verbonden
      kosten niet kunnen worden bestreden of indien het de verkoop van in het derde lid bedoelde goederen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel121
