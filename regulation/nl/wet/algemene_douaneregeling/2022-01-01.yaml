  - number: '5.1'
    text: |-
      1 Met betrekking tot de in aanmerking te nemen wisselkoers, bedoeld in
      [artikel 3:2, derde lid, onderdeel a, van de wet][ref1], is [artikel 1:20][ref2] van overeenkomstige toepassing.

      2 De in aanmerking te nemen waarde van verhandelbare instrumenten aan toonder, bedoeld in artikel 2, eerste lid,
      onderdeel a, onder ii, van de Verordening liquide middelen, is de waarde die het desbetreffende instrument heeft op
      de meest gerede financiële markt waarop het verhandeld wordt of bij het ontbreken daarvan, de intrinsieke waarde.

      3 De in aanmerking te nemen waarde van de goederen, bedoeld in artikel 2, eerste lid, onderdeel a, onder iii, van
      de Verordening liquide middelen, of van de waardevolle goederen, bedoeld in [artikel 3:4 van de wet][ref3], is de
      douanewaarde, vastgesteld overeenkomstig het gestelde bij of krachtens de bepalingen van titel II, hoofdstuk 3, van
      het Douanewetboek van de Unie.

      4 De kennisgeving, bedoeld in [artikel 3:5, eerste lid, van de wet][ref4], wordt stellig en zonder voorbehoud
      schriftelijk gedaan voorzien van dagtekening en ondertekening.


