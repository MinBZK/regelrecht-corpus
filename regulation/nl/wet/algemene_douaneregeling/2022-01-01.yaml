  - number: 7:1
    text: |-
      In afwijking van het forfaitair douanerecht dat wordt toegepast op grond van bijlage I, Eerste Deel, Titel II, punt
      D.1 bij [Verordening (EEG) nr. 2658/87](31987R2658) van de Raad van 23 juli 1987 met betrekking tot de tarief- en
      statistieknomenclatuur en het gemeenschappelijk douanetarief (PbEG 1987, L 256) (de gecombineerde nomenclatuur)
      worden zonder heffing van rechten bij invoer toegelaten goederen, die in kleine zendingen of door reizigers als
      bagage worden vervoerd, van oorsprong uit:

        - Andorra, voor zover de goederen vallen onder de hoofdstukken 1 tot en met 24 van de gecombineerde nomenclatuur;
        - De ACS-staten die vallen onder Verordening (EU) 2016/1076 van het Europees Parlement en de Raad van 8 juni 2016
      tot toepassing van de regelingen voor goederen van oorsprong uit bepaalde staten behorende tot de groep van staten
      in Afrika, het Caribisch gebied en de Stille Oceaan (ACS), die zijn opgenomen in overeenkomsten tot instelling van,
      of leidende tot instelling van, een economische partnerschapsovereenkomst (PbEU 2016, L 185);
        - Albanië, Algerije, Gebieden onder Palestijnse autoriteit, de begunstigde landen in het kader van het Algemeen
      Preferentieel Systeem (APS), Bosnië-Herzegovina, Ceuta, Chili, de Europese Economische Ruimte, Egypte, Faeröer,
      Israël, Jordanië, Kosovo, Kroatië, de Landen en Gebieden Overzee, Libanon, de voormalige Joegoslavische Republiek
      Macedonië, Marokko, Melilla, Mexico, Moldavië, Montenegro, Peru, Servië, Syrië, Tunesië, Zuid-Afrika, Zuid-Korea
      of Zwitserland;
        - Turkije, voor zover de goederen vallen onder Protocol nr. 1 bij het Besluit van de Commissie over de sluiting van
      een overeenkomst tussen de Europese Gemeenschap voor Kolen en Staal en Turkije betreffende de handel in producten
      waarop het Verdrag tot oprichting van de Europese Gemeenschap voor Kolen en Staal van toepassing is van 29 februari
      1996 (PbEG 1996, L 227) en Protocol nr. 3 bij het Besluit 1/98 van de Associatieraad EG-Turkije betreffende de
      handelsregeling voor landbouwproducten van 25 februari 1998 (PbEG 1998, L 86).
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel71
  - number: 7:2
    text: |-
      1 Voor het brengen in het vrije verkeer met vrijstelling van rechten bij invoer als bedoeld in de artikelen 28,
      34, 43, 44, 45, 51, 53, 57, 59, 61, 67, 68, 74 en 95 van Verordening 1186/2009, is een vergunning van de inspecteur
      vereist met dien verstande dat voor de vrijstellingen, bedoeld in de artikelen 67 en 68 van Verordening 1186/2009,
      een vergunning slechts is vereist indien de goederen in het vrije verkeer worden gebracht door een instelling of
      organisatie.

      2 Het eerste lid is niet van toepassing indien de goederen in het vrije verkeer worden gebracht door
      een openbare instelling of een instelling of organisatie, genoemd in [artikel 7:4][ref1] of in de
      [bijlagen X tot en met XVI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0024291
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0024291
        artikel: 7:4
        hoofdstuk: '7'
        afdeling: '7.2'
      - id: ref2
        bwb_id: BWBR0024291
  - number: 7:2a
    text: |-
      1 Een instelling of organisatie kan op aanvraag worden aangewezen als instelling of organisatie die een beroep mag
      doen op een vrijstelling, genoemd in deze afdeling.

      2 De aanvraag, bedoeld in het eerste lid, wordt ingediend bij de inspecteur. Op voordracht van de inspecteur kan de
      instelling of organisatie worden opgenomen in een van de bijlagen bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel72a
  - number: 7:3
    text: |-
      1 Een vrijstelling van rechten bij invoer als bedoeld in de artikelen 3, 12, 17, 20, 21, 28 en 34 van Verordening
      1186/2009 wordt slechts verleend indien een door belanghebbende ondertekende lijst wordt overgelegd met een
      beschrijving van alle goederen waarvoor aanspraak op vrijstelling wordt gemaakt.

      2 De vrijstelling van rechten bij invoer, bedoeld in artikel 12 van Verordening 1186/2009, wordt voorts slechts
      verleend indien belanghebbende aantoont dat zijn huwelijk heeft plaatsgehad of dat de eerste officiële stappen met
      het oog op zijn huwelijk zijn gezet.

      3 Een vrijstelling van rechten bij invoer als bedoeld in de artikelen 17 en 20 van Verordening 1186/2009 wordt
      voorts slechts verleend indien een door een notaris of vergelijkbare functionaris in het land van uitvoer afgegeven
      verklaring wordt overgelegd waaruit blijkt dat de goederen door vererving zijn verkregen.

      4 De termijn van twaalf maanden, bedoeld in artikel 33, eerste lid, van Verordening 1186/2009, wordt niet verlengd.

      5 Voor het verlenen van een vrijstelling van rechten bij invoer als bedoeld in de artikelen 67 en 68 van
      Verordening 1186/2009 kan de inspecteur een medische verklaring vragen aan een natuurlijke persoon die de goederen
      voor zijn eigen gebruik in het vrije verkeer brengt.
    url: https://wetten.overheid.nl/BWBR0024291/2022-01-01#Artikel73
  - number: 7:4
    text: |-
      1 Als instellingen en organisaties als bedoeld in artikel 43, aanhef en onder b, van Verordening 1186/2009 worden
      aangewezen de instellingen en organisaties, genoemd in [bijlage X][ref1].

      2 Als instellingen als bedoeld in artikel 44, tweede lid, onderdeel b, van Verordening 1186/2009 worden aangewezen
      de instellingen, genoemd in [bijlage XI][ref2].

      3 Als instellingen met zetel in de Unie als bedoeld in artikel 51, tweede lid, onderdeel a, van Verordening
      1186/2009 worden aangewezen de instellingen, genoemd in [bijlage XII][ref3].

      4 Als instellingen als bedoeld in artikel 53, tweede lid, onderdeel b, van Verordening 1186/2009 worden aangewezen
      de instellingen, genoemd in [bijlage XIII][ref4].

      5 Als instelling als bedoeld in artikel 55, aanhef en onder a, van Verordening 1186/2009 wordt aangewezen:
      Stichting Sanquin Bloedvoorziening.

      6 Als instellingen als bedoeld in artikel 57 van Verordening 1186/2009 worden aangewezen de ziekenhuizen,
      gezondheidsinstellingen en dergelijke instellingen welke zich uitsluitend of nagenoeg uitsluitend bezighouden met
      medisch onderzoek, medische diagnose of medische behandeling.

      7 Als geadresseerden als bedoeld in artikel 59 van Verordening 1186/2009 worden aangewezen de geadresseerden,
      genoemd in [bijlage XIV][ref5].

      8 Als instellingen met een liefdadig en filantropisch karakter als bedoeld in de artikelen 61, eerste lid,
      onderdeel a, en 74, eerste lid, van Verordening 1186/2009 worden aangewezen:

        - Vereniging het Nederlandse Rode Kruis;
        - Stichting Leger des Heils Dienstverlening;
        - Vereniging van Nederlandse Voedselbanken.

      9 Als instellingen en organisaties als bedoeld in de artikelen 67 en 68, eerste lid, van Verordening 1186/2009
      worden aangewezen de instellingen en organisaties, genoemd in [bijlage XV][ref6].

      10 Als organisaties als bedoeld in artikel 112 van Verordening 1186/2009 worden aangewezen de organisaties, genoemd
      in [bijlage XVI][ref7].


