      1 Indien [artikel 3:16o, tweede of derde lid][ref1], van toepassing is, kan een verwerker het alternatieve monster,
      bedoeld in [artikel 3:16n, vierde lid][ref2], bij wijze van een tegenonderzoek door de Minister van Landbouw,
      Natuur en Voedselkwaliteit laten onderzoeken.

      2 Bij toepassing van het eerste lid laat de Minister van Landbouw, Natuur en Voedselkwaliteit de
      onderzoeksresultaten van een op grond van [artikel 3:16n, eerste lid][ref3], genomen monster buiten beschouwing en
      baseert hij een besluit als bedoeld in [artikel 3:16o, tweede of derde lid][ref4], uitsluitend op de resultaten van
      het onderzoek van het alternatieve monster, bedoeld in artikel 3:16n, vierde lid.


