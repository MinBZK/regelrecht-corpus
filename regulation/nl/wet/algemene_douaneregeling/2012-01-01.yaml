    text: |-
      1 Indien de aanvraag, bedoeld in [artikel 1:14, eerste lid][ref1], betrekking heeft op teeltmateriaal als bedoeld
      in [artikel 1, aanhef, onderdeel f, van de Zaaizaad- en plantgoedwet 2005][ref2], wordt bij de aanvraag als
      bewijsstuk als bedoeld in [artikel 1:14, tweede lid][ref3], overlegd:

      a. een officiële verklaring van de NAK, voor wat betreft teeltmateriaal van landbouwgewassen als bedoeld in
      [artikel 1, eerste lid, aanhef, onderdeel p, van het Besluit verhandeling teeltmateriaal][ref4];

      b. een officiële verklaring van de Naktuinbouw, voor wat betreft
      teeltmateriaal van bosbouwgewassen en tuinbouwgewassen als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __, of

      c. enig ander bewijsstuk dat kan dienen om de oorsprong van de in de aanvraag vermelde producten vast te stellen,
      dat door de Plantenziektekundige Dienst van het Ministerie van Economische Zaken, Landbouw en Innovatie voor het
      desbetreffende teeltmateriaal is afgegeven.

      2 Indien de aanvraag, bedoeld in [artikel 1:14, eerste lid][ref6], betrekking heeft op groente en fruit als
      bedoeld in [artikel 1 van het Landbouwkwaliteitsbesluit 2007][ref7], wordt bij de aanvraag overlegd als bewijsstuk
      als bedoeld in [artikel 13, tweede lid][ref8], een gewaarmerkt afschrift van het controlebewijs, bedoeld in
      [artikel 13, onderdeel b, van het Landbouwkwaliteitsbesluit 2007][ref9].

      3 Indien de producten, vermeld in de aanvraag, tegelijkertijd kunnen worden aangemerkt als teeltmateriaal als
      bedoeld in het eerste lid, en als groente en fruit als bedoeld in het tweede lid, wordt het eerste of het tweede
      lid toegepast afhankelijk van de bestemming die aan die producten wordt gegeven.


