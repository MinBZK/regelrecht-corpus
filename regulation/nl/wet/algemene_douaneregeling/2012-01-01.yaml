  - number: 3:15
    text: |-
      Het bewijs, bedoeld in artikel 4, tweede lid, van [Verordening (EEG) nr. 2342/92](31992R2342) van de Commissie
      van 7 augustus 1992 betreffende de invoer van raszuivere fokrunderen uit derde landen en de toekenning van
      uitvoerrestituties voor deze dieren en tot intrekking van [Verordening (EEG) nr. 1544/79](31979R1544) (PbEG 1992, L
      227) wordt geleverd door middel van een verklaring van het productschap.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel315
  - number: 3:16
    text: |-
      1 Indien ingevolge het bepaalde bij of krachtens [Verordening (EG) nr. 1234/2007](32007R1234) van de Raad van
      22 oktober 2007 houdende een gemeenschappelijke ordening van de landbouwmarkten en specifieke bepalingen voor
      een aantal landbouwproducten (PbEU 2007, L 299) het bedrag van de aldaar bedoelde heffing voor jonge mannelijke
      runderen met een levend gewicht van ten hoogste 300 kg en voor landbouwproducten, vallend onder de posten 0202
      2030 of 0202 30 van de gecombineerde nomenclatuur, afhankelijk is van de vervulling of nakoming van voorwaarden of
      bepalingen die ten aanzien van het betreffende goed in genoemde verordening of haar uitvoeringsvoorschriften zijn
      voorgeschreven, is de importeur van dat goed gehouden tot het naleven van de door het productschap met inachtneming
      van het bepaalde in die verordening en haar uitvoeringsvoorschriften, ter verzekering van die heffing gestelde
      regelen.

      2 De in het vorige lid bedoelde regelen kunnen betrekking hebben op het trekken van monsters, het voeren van een
      administratie en het verstrekken van gegevens, nodig voor de oplegging van de heffing.

      3 Het productschap stelt regelen volgens welke het vrijstelling verleent aan landbouwheffingen bij invoer, ten
      belopen van het jaarlijks door de Raad toegekende en aan Nederland toevallende aandeel in het in het kader van de
      Wereldhandelsorganisatie geopende tariefcontingent voor de invoer uit landen of gebieden die geen deel uitmaken van
      de Gemeenschap van bevroren rundvlees van post 0202 van de gecombineerde nomenclatuur.

      4 Het productschap kan regels stellen op grond waarvan het vrijstelling verleent van de landbouwheffingen bij
      invoer in het kader van [Verordening (EG) nr. 659/2007](32007R0659) van de Commissie van 14 juni 2007 betreffende
      de opening en de wijze van beheer van invoertariefcontingenten voor stieren, koeien en vaarzen, niet bestemd voor
      de slacht, van bepaalde bergrassen.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel316
  - number: 3:17
    text: |-
      Het is verboden te handelen in strijd met de voorschriften, genoemd in de artikelen 16, 19, eerste lid, en 49,
      eerste lid, van verordening 612/2009.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel317
  - number: 3:18
    text: |-
      1 De bevoegdheden, bedoeld in [artikel 3:3 van het besluit][ref1] worden overgedragen aan het productschap.

      2 Het productschap wordt aangewezen als:

      a. de bevoegde instantie, bedoeld in de artikelen 7, vierde lid, 39, eerste lid, en 46, eerste lid, onder b, van
      verordening 612/2009;

      b. de bevoegde autoriteit, bedoeld in de artikelen 27, vierde lid, en 32, eerste en tweede lid, van verordening
      612/2009.

      3 Als bevoegde autoriteit, bedoeld in artikel 5, zevende lid, onder b, en 7, derde lid, tweede alinea, van
      verordening 612/2009 wordt aangewezen het douanekantoor, waar de aangifte ten uitvoer wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0024235#Artikel33
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel318
    references:
