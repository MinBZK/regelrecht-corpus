  - number: 7:2a
    text: |-
      1 Een instelling of organisatie kan op aanvraag worden aangewezen als instelling of organisatie die een beroep mag
      doen op een vrijstelling, genoemd in deze afdeling.

      2 De aanvraag, bedoeld in het eerste lid, wordt ingediend bij de inspecteur. Op voordracht van de inspecteur kan de
      instelling of organisatie worden opgenomen in een van de bijlagen bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel72a
  - number: 7:3
    text: |-
      1 Een vrijstelling van rechten bij invoer als bedoeld in de artikelen 3, 12, 17, 20, 21, 28 en 34 van Verordening
      1186/2009 wordt slechts verleend indien een door belanghebbende ondertekende lijst wordt overgelegd met een
      beschrijving van alle goederen waarvoor aanspraak op vrijstelling wordt gemaakt.

      2 De vrijstelling van rechten bij invoer, bedoeld in artikel 12 van Verordening 1186/2009, wordt voorts slechts
      verleend indien belanghebbende aantoont dat zijn huwelijk heeft plaatsgehad of dat de eerste officiële stappen met
      het oog op zijn huwelijk zijn gezet.

      3 Een vrijstelling van rechten bij invoer als bedoeld in de artikelen 17 en 20 van Verordening 1186/2009 wordt
      voorts slechts verleend indien een door een notaris of vergelijkbare functionaris in het land van uitvoer afgegeven
      verklaring wordt overgelegd waaruit blijkt dat de goederen door vererving zijn verkregen.

      4 De termijn van twaalf maanden, bedoeld in artikel 33, eerste lid, van Verordening 1186/2009, wordt niet verlengd.

      5 Voor het verlenen van een vrijstelling van rechten bij invoer als bedoeld in de artikelen 67 en 68 van
      Verordening 1186/2009 kan de inspecteur een medische verklaring vragen aan een natuurlijke persoon die de goederen
      voor zijn eigen gebruik in het vrije verkeer brengt.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel73
  - number: 7:4
    text: |-
      1 Als instellingen en organisaties als bedoeld in artikel 43, aanhef en onder b, van Verordening 1186/2009 worden
      aangewezen de instellingen en organisaties, genoemd in [bijlage X][ref1].

      2 Als instellingen als bedoeld in artikel 44, tweede lid, onderdeel b, van Verordening 1186/2009 worden aangewezen
      de instellingen, genoemd in [bijlage XI][ref2].

      3 Als instellingen met zetel in de Gemeenschap als bedoeld in artikel 51, tweede lid, onderdeel a, van Verordening
      1186/2009 worden aangewezen de instellingen, genoemd in [bijlage XII][ref3].

      4 Als instellingen als bedoeld in artikel 53, tweede lid, onderdeel b, van Verordening 1186/2009 worden aangewezen
      de instellingen, genoemd in [bijlage XIII][ref4].

      5 Als instelling als bedoeld in artikel 55, aanhef en onder a, van Verordening 1186/2009 wordt aangewezen:
      Stichting Sanquin Bloedvoorziening.

      6 Als instellingen als bedoeld in artikel 57 van Verordening 1186/2009 worden aangewezen de ziekenhuizen,
      gezondheidsinstellingen en dergelijke instellingen welke zich uitsluitend of nagenoeg uitsluitend bezighouden met
      medisch onderzoek, medische diagnose of medische behandeling.

      7 Als geadresseerden als bedoeld in artikel 59 van Verordening 1186/2009 worden aangewezen de geadresseerden,
      genoemd in [bijlage XIV][ref5].

      8 Als instellingen met een liefdadig en filantropisch karakter als bedoeld in de artikelen 61, eerste lid,
      onderdeel a, en 74, eerste lid, van Verordening 1186/2009 worden aangewezen:

        - Vereniging het Nederlandse Rode Kruis;
        - Stichting Leger des Heils Dienstverlening.

      9 Als instellingen en organisaties als bedoeld in de artikelen 67 en 68, eerste lid, van Verordening 1186/2009
      worden aangewezen de instellingen en organisaties, genoemd in [bijlage XV][ref6].

      10 Als organisaties als bedoeld in artikel 112 van Verordening 1186/2009 worden aangewezen de organisaties, genoemd
      in [bijlage XVI][ref7].


