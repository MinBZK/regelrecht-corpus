      In afwijking van het forfaitair douanerecht dat wordt toegepast op grond van bijlage I, Eerste Deel, Titel II, punt
      D.1 bij [Verordening (EEG) nr. 2658/87](31987R2658) van de Raad van 23 juli 1987 met betrekking tot de tarief- en
      statistieknomenclatuur en het gemeenschappelijk douanetarief (PbEG L 256) (de gecombineerde nomenclatuur) worden
      zonder heffing van rechten bij invoer toegelaten goederen, die in kleine zendingen of door reizigers als bagage
      worden vervoerd, van oorsprong uit:

        - Andorra, voor zover de goederen vallen onder de hoofdstukken 1 tot en met 24 van de gecombineerde nomenclatuur;
        - de ACS-staten, die vallen onder [Verordening (EG) Nr. 1528/2007](32007R1528) van de Raad tot toepassing van
      de regelingen voor goederen van oorsprong uit bepaalde staten behorende tot de groep van staten in Afrika, het
      Caribisch gebied en de Stille Oceaan (ACS), die zijn opgenomen in overeenkomsten tot instelling van, of leidende
      tot instelling van, een economische partnerschapsovereenkomst van 20 december 2007 (PbEU 2007, L 348);
        - Albanië, Algerije, Gebieden onder Palestijnse autoriteit, de begunstigde landen in het kader van het Algemeen
      Preferentieel Systeem (APS), Bosnië-Herzegovina, Ceuta, Chili, de Europese Economische Ruimte, Egypte, Faeröer,
      Israël, Jordanië, Kosovo, Kroatië, de Landen en Gebieden Overzee, Libanon, de voormalige Joegoslavische Republiek
      Macedonië, Marokko, Melilla, Mexico, Moldavië, Montenegro, Servië, Syrië, Tunesië, Zuid-Afrika of Zwitserland;
        - Turkije, voor zover de goederen vallen onder Protocol nr. 1 bij het Besluit van de Commissie over de sluiting van
      een overeenkomst tussen de Europese Gemeenschap voor Kolen en Staal en Turkije betreffende de handel in producten
      waarop het Verdrag tot oprichting van de Europese Gemeenschap voor Kolen en Staal van toepassing is van 29 februari
      1996 (PbEG 1996, L 227) en Protocol nr. 3 bij het Besluit 1/98 van de Associatieraad EG-Turkije betreffende de
      handelsregeling voor landbouwproducten van 25 februari 1998 (PbEG van 20 maart 1998, L 86).
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel71
  - number: 7:2
    text: |-
      1 Voor het brengen in het vrije verkeer met vrijstelling van rechten bij invoer als bedoeld in de artikelen 3,
      12, eerste lid, 17, 20, 21, 28, 34, 43, 44, 45, 51, 53, 57, 59, 61, 67, 68, 74 en 95 van Verordening 1186/2009, is
      een vergunning van de inspecteur vereist met dien verstande dat voor de vrijstellingen, bedoeld in de artikelen 67
      en 68 van Verordening 1186/2009, een vergunning slechts is vereist indien de goederen in het vrije verkeer worden
      gebracht door een instelling of organisatie.

      2 Het eerste lid is niet van toepassing indien de goederen in het vrije verkeer worden gebracht door
      een openbare instelling of een instelling of organisatie, genoemd in [artikel 7:4][ref1] of in de
      [bijlagen X tot en met XVI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0024291
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel72
    references:
