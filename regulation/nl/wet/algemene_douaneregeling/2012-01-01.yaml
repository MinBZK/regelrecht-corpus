  - number: 3:1
    text: |-
      Het is verboden te handelen in strijd met de voorschriften, genoemd in de artikelen 7, eerste tot en met derde
      lid, 8, eerste en tweede lid, 21, derde lid, 24, vierde lid, 25, eerste lid, 26, eerste lid, 34, tweede lid,
