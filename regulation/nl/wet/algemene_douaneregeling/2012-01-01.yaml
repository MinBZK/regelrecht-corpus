  - number: 4:16
    text: |-
      Aan accijns onderworpen goederen kunnen slechts in een vrij entrepot worden opgeslagen, voor zover de
      [Wet op de accijns][ref1] in deze opslag voorziet en onder de daarbij gestelde voorwaarden en beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel416
    references:
      - id: ref1
        bwb_id: BWBR0005251
  - number: 4:17
    text: |-
      1 Voor de plaatsing in een vrij entrepot worden per goederensoort de volgende minimumhoeveelheden vastgesteld:

      a. bier op fust: 5 hectoliter;

      b. bier in flessen of in andere verpakkingen: 3 hectoliter;

      c. de minerale oliën lichte olie en gasolie: 250 liter;

      d. de minerale olie halfzware olie: 500 liter;

      e. de minerale olie zware stookolie en andere minerale oliën: 2000 kilogram.

      2 Voor de uitslag uit een vrij entrepot worden per goederensoort de volgende minimumhoeveelheden vastgesteld:

      a. aan accijns onderworpen goederen: 500 kilogram nettogewicht;

      b. voor tabaksproducten: 4 kilogram nettogewicht;

      c. de minerale oliën lichte olie en gasolie: 250 liter;

      d. de minerale olie halfzware olie: 500 liter;

      e. de minerale olie zware stookolie en andere minerale oliën: 2000 kilogram.

      3 In afwijking van het tweede lid geldt geen minimumhoeveelheid bij de uitslag van tabaksproducten uit een vrij
      entrepot bij het brengen in het vrije verkeer met betaling van de verschuldigde rechten bij invoer.

      4 In afwijking van het tweede lid worden voor de uitslag uit een vrij entrepot per goederensoort in de volgende
      situaties de volgende minimumhoeveelheden vastgesteld:

      a. voor alcoholhoudende extracten, essences, tincturen, parfumerieën, toiletartikelen en cosmetische producten,
      welke ten uitvoer worden uitgeslagen, indien het betreft:

      1°. vloeistoffen: 5 liter;

      2°. andere producten: 5 kilogram nettogewicht;

      b. voor overige alcoholhoudende producten ter aflevering als provisie aan boord van uitgaande schepen en
      luchtvaartuigen of aan diplomaten, indien het betreft:

      1°. vloeistoffen: 5 liter;

      2°. andere producten: 5 kilogram nettogewicht;

      c. voor tabaksproducten ter aflevering als provisie aan boord van uitgaande schepen en luchtvaartuigen of aan
      diplomaten: 1 kilogram nettogewicht.

      5 De inspecteur is bevoegd toe te staan dat kleinere hoeveelheden dan de minimumhoeveelheden genoemd in de
      voorgaande leden in een vrij entrepot worden geplaatst of worden uitgeslagen.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel417
