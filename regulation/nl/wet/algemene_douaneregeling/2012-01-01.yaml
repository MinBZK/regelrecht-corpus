  - number: 3:25
    text: |-
      1 Het productschap is bevoegd tot betaling van de restitutie, bedoeld in artikel 34, eerste lid, van verordening
      612/2009.

      2 De aanvraag om betaling van restitutie wordt ingediend bij het productschap.

      3 In geval van levering van landbouwproducten in een andere lidstaat legt de belanghebbende tevens het
      terugontvangen controle-exemplaar T5 over.

      4 In geval van levering van landbouwproducten aan boor- en productieplatforms en marine- en hulpschepen legt de
      belanghebbende tevens het leverantiebewijs over.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel325
  - number: 3:26
    text: |-
      1 Het Hoofdproductschap Akkerbouw is bevoegd tot verlening van een erkenning van de houder van onder douanetoezicht
      staande bevoorradingsruimten, als bedoeld in de artikelen 37, tweede lid, en 40, tweede lid, tweede alinea, van
      verordening 612/2009.

      2 Een belanghebbende dient een aanvraag om erkenning als bedoeld in het eerste lid, in bij het Hoofdproductschap
      Akkerbouw.

      3 De erkenning, bedoeld in het eerste lid, wordt verleend indien is voldaan aan de voorwaarden, bedoeld in artikel
      37, tweede lid, van verordening 612/2009.

      4 Het Hoofdproductschap Akkerbouw is bevoegd tot intrekking van de erkenning indien uit onderzoek van de Algemene
      Inspectiedienst is gebleken dat de erkenninghouder niet langer voldoet aan de voorwaarden, bedoeld in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel326
  - number: 3:27
    text: |-
      1 Het productschap is bevoegd een voorschot op de restitutie te verlenen, indien is voldaan aan de voorwaarden,
      bedoeld in artikel 37 van verordening 612/2009.

      2 Een belanghebbende dient een aanvraag om het voorschot, bedoeld in het eerste lid, in bij het productschap.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel327
  - number: 3:28
    text: |-
      De verlening van restitutie voor proviandering van zeeschepen, waaronder ook begrepen al dan niet zelf aangedreven
      werkschepen, kan in het kader van deze paragraaf alleen plaatsvinden indien het schip binnen tien dagen na
      proviandering de haven verlaat met een bestemming die niet dichterbij is gelegen dat het gebied, bedoeld in artikel
      41, eerste lid, onder a, van verordening 612/2009.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel328
  - number: 3:29
    text: |-
      1 Als bevoegde instantie, bedoeld in artikel 40, eerste lid, van verordening 612/2009, wordt aangewezen de Algemene
      Inspectiedienst.

      2 Als bevoegde instantie, bedoeld in artikel 40, tweede lid, van verordening 612/2009, wordt aangewezen het
      Productschap Zuivel. Een belanghebbende kan een aanvraag om landbouwproducten over te brengen naar een tweede
      bevoorradingsdepot indienen bij dat productschap.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel329
  - number: 3:30
    text: |-
      1 Levering aan boor- en productieplatforms geschiedt uitsluitend door een door het Hoofdproductschap Akkerbouw
      erkende exploitant van een bevoorradingsschip of bevoorradingshelikopter.

      2 Een belanghebbende dient een aanvraag om erkenning als bedoeld in het eerste lid, schriftelijk in bij het
      Hoofdproductschap Akkerbouw.

      3 De Algemene Inspectiedienst toetst de aanvraag aan de criteria, bedoeld in artikel 41, tweede lid, onder b,
      tweede streepje, van verordening 612/2009, en doet hiervan verslag aan het Hoofdproductschap Akkerbouw.

      4 Het Hoofdproductschap Akkerbouw is bevoegd tot intrekking van een erkenning indien de belanghebbende niet langer
      voldoet aan de criteria, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel330
  - number: 3:31
    text: |-
      1 De bewijsstukken als bedoeld in artikel 35, tweede lid, van verordening 612/2009 worden door de betrokken
      deelnemer in zijn administratie bewaard ten behoeve van de Algemene Inspectiedienst. Het bewijs als bedoeld in
      artikel 36, derde lid, eerste alinea, van verordening 612/2009 wordt ingediend bij de productschappen. Het bewijs
      als bedoeld in de artikelen 40, vierde en vijfde lid, en 42, tweede lid, van verordening 612/2009 wordt ingediend
      bij het Productschap Zuivel.

      2 Het bewijs, bedoeld in de artikelen 38, tweede lid, eerste alinea, en 40, derde lid, eerste alinea, van
      verordening 612/2009, wordt ingediend bij de bevoegde autoriteit van de lidstaat waar de aangifte ten uitvoer is
      gedaan.

      3 Op verzoek van een belanghebbende kan het productschap ermee instemmen dat het bewijs, bedoeld in artikel 42,
      derde lid, onder a of b, tweede streepje, van verordening 612/2009, wordt geleverd met een door de scheepskapitein
      of een andere scheepsofficier van dienst ondertekend certificaat van ontvangst dat van het scheepsstempel is
      voorzien.

      4 In voorkomend geval kan het productschap op verzoek van een belanghebbende ermee instemmen dat het bewijs,
      bedoeld in artikel 42, derde lid, onder b, tweede streepje, van verordening 612/2009, wordt geleverd met een
      door een beambte van de luchtvaartmaatschappij ondertekend certificaat van ontvangst dat van het stempel van de
      maatschappij is voorzien.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel331
  - number: 3:32
    text: |-
      1 Het productschap is bevoegd een toestemming als bedoeld in artikel 76 van het Communautair douanewetboek in
      samenhang met artikel 282 van de toepassingsverordening Communautair douanewetboek te verlenen.

      2 De toestemming, bedoeld in het eerste lid, kan slechts betrekking hebben op het achterwege laten bij de aangifte
      ten uitvoer van de vermelding van gehalte, samenstelling of hoedanigheid van uit te voeren landbouwproducten.

      3 Het productschap kan de toestemming, bedoeld in het eerste lid, onder voorwaarden en beperkingen verlenen.

      4 Het productschap verleent een toestemming in overeenstemming met de Algemene Inspectiedienst.

      5 Het productschap kan een toestemming intrekken, wanneer blijkt dat de voorwaarden en de beperkingen waaronder de
      toestemming is verleend, niet zijn nageleefd.

      6 De Algemene Inspectiedienst houdt toezicht op de naleving van de voorwaarden en beperkingen, bedoeld in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel332
  - number: 3:33
    text: |-
      De Nederlandse Voedsel- en Warenautoriteit is de bevoegde autoriteit, bedoeld in:

      a. artikel 2, onder 8), van verordening (EG) nr. 2173/2005 van de Raad van 20 december 2005 inzake de opzet van een
      FLEGT-vergunningensysteem voor de invoer van hout in de Europese Gemeenschap (PbEU 2005, L 347), en

      b. artikel 2, onder 4, van verordening (EG) nr. 1024/2008 van de Commissie van 17 oktober 2008 tot vaststelling van
      gedetailleerde maatregelen ter uitvoering van Verordening (EG) nr. 2173/2005 van de Raad inzake de opzet van een
      FLEGT-vergunningensysteem voor de invoer van hout in de Europese Gemeenschap (PbEU 2008, L 277).
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel333
