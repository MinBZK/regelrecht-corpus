      1 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van goederen die bestemd
      zijn voor het verrichten van de officiële werkzaamheden door een internationale organisatie in Nederland, genoemd
      in [bijlage XVIII][ref1].

      2 Het bepaalde in [artikel 7:10][ref2] is van overeenkomstige toepassing, met dien verstande dat het hoofd van de
      internationale organisatie in een schriftelijke verklaring bevestigt dat de goederen voor het officiële gebruik van
      de internationale organisatie bestemd zijn.


