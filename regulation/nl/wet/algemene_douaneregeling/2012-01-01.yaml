    text: |-
      Het productschap is bevoegd een aanvullende termijn als bedoeld in artikel 34, negende lid, van [verordening
      376/2008](32008R0376) te verlenen.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel311
  - number: 3:12
    text: |-
      Het productschap wordt aangewezen als bevoegde autoriteit, bedoeld in artikel 3 van [Verordening (EG) nr.
      1301/2006](32006R1301) van de Commissie van 31 augustus 2006 houdende gemeenschappelijke voorschriften voor
      het beheer van door middel van een stelsel van invoercertificaten beheerde invoertariefcontingenten voor
      landbouwproducten (PbEU 2006, L 238).
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel312
  - number: 3:13
    text: |-
      1 Het productschap geeft de invoercertificaten, bedoeld in [artikel 3:1, onder d, van het besluit][ref1], of
      uittreksels daarvan voor ruwe hennep van post 53 02 10 00 van de gecombineerde nomenclatuur slechts af indien
      deze voldoet aan de voorwaarden van artikel 39 van Verordening (EG) nr. 73/2009 van de Raad van 19 januari 2009
      tot vaststelling van gemeenschappelijke voorschriften voor regelingen inzake rechtstreekse steunverlening aan
      landbouwers in het kader van het gemeenschappelijk landbouwbeleid en tot vaststelling van bepaalde steunregelingen
      voor landbouwers, tot wijziging van Verordeningen (EG) nr. 1290/2005, (EG) nr. 247/2006, (EG) nr. 378/2007 en tot
      intrekking van Verordening (EG) nr. 1782/2003 (PbEG 2009, L 30);

      2 Het productschap geeft de invoercertificaten, bedoeld in [artikel 3:1, onder d, van het besluit][ref2], of
      uittreksels daarvan voor zaaizaad bestemd voor de inzaai van henneprassen van post 1207 99 15 van de gecombineerde
      nomenclatuur slechts af indien deze vergezeld gaat van het bewijs dat het gehalte aan tetrahydrocannabinol
      niet hoger is dan het gehalte, bedoeld in artikel 39, eerste lid, van Verordening (EG) nr. 73/2009 van de Raad
      van 19 januari 2009 tot vaststelling van gemeenschappelijke voorschriften voor regelingen inzake rechtstreekse
      steunverlening aan landbouwers in het kader van het gemeenschappelijk landbouwbeleid en tot vaststelling van
      bepaalde steunregelingen voor landbouwers, tot wijziging van Verordeningen (EG) nr. 1290/2005, (EG) nr. 247/2006,
      (EG) nr. 378/2007 en tot intrekking van Verordening (EG) nr. 1782/2003 (PbEG 2009, L 30);

      3 Het productschap geeft de invoercertificaten, bedoeld in [artikel 3:1, onder d, van het besluit][ref3],
      en uittreksels daarvan voor niet voor inzaai bestemd hennepzaad van de post 1207 99 91 van de gecombineerde
      nomenclatuur slechts af indien:

      a. de importeur door het productschap is erkend;

      b. de importeur zich ertoe verbindt zorg te dragen voor de verstrekking aan het productschap van de verklaringen,
      bedoeld in artikel 17 van [Verordening (EG) nr. 507/2008](32008R0507) van de Commissie van 6 juni 2008 tot
      vaststelling van uitvoeringsbepalingen voor [Verordening (EG) nr. 1673/2000](32000R1673) van de Raad houdende een
      gemeenschappelijke ordening der markten in de sector vezelvlas en –hennep (PbEU 2008, L 149), binnen de aldaar
      gestelde termijn en onder de door het productschap gestelde voorwaarden;

      c. de administratie van de importeur voldoet aan de door het productschap gestelde eisen;

      d. de importeur toelaat dat wordt overgegaan tot controle op de naleving van hetgeen is bepaald bij of krachtens
      [Verordening 1234/2007](32007R1234) van de Raad van 22 oktober 2007 houdende een gemeenschappelijke ordening van de
      landbouwmarkten en specifieke bepalingen voor een aantal landbouwproducten (PbEU 2007, L 299), en

      e. de importeur zodanige maatregelen treft dat ook zijn afnemers aan het onder c en d gestelde voldoen.


