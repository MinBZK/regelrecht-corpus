    text: |-
      Het opstellen van een leveranciersverklaring of een verklaring omtrent de preferentiële oorsprong op de factuur of
      op een ander handelsbescheid op basis van onvolledige of onjuiste gegevens of zonder dat het bewijs daarvoor in de
      administratie aanwezig is vormt een verzuim ter zake waarvan door de inspecteur een bestuurlijke boete kan worden
      opgelegd van ten hoogste € 150.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel102
  - number: 10:3
    text: |-
      Indien wijziging in de inrichting van een ruimte voor tijdelijke opslag wordt aangebracht zonder goedkeuring van
      de inspecteur, vormt dit een verzuim ter zake waarvan door de inspecteur een bestuurlijke boete kan worden opgelegd
      van ten hoogste € 150.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel103
  - number: 10:4
    text: |-
      Het achterwege laten van:

      a. de kennisgeving, bedoeld in [artikel 2:0, eerste lid][ref1];

      b. de kennisgeving, bedoeld in [artikel 2:4, eerste lid][ref2]; of

      c. de mededeling, bedoeld in [artikel 2:5, vijfde lid][ref3];

      vormt een verzuim ter zake waarvan door de inspecteur een bestuurlijke boete kan worden opgelegd van ten hoogste
      € 150.


