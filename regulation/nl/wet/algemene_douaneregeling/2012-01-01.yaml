  - number: 10:5
    text: |-
      De in de [artikelen 10:1][ref1], [10:2][ref2], [10:3][ref3], en [10:4][ref4] genoemde bedragen worden elke vijf
      jaar, met ingang van 1 januari 2015, overeenkomstig [artikel 9:6a van de wet][ref5], bij ministeriële regeling
      gewijzigd.


