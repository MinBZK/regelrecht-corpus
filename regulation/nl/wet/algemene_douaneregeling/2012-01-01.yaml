    text: |-
      Deze regeling geeft uitvoering aan de [artikelen 1:3, eerste lid, onderdeel c][ref1],
      [1:19, tweede lid][ref2], [1:28, zesde lid][ref3], [1:35][ref4], [1:37, derde lid][ref5],
      [2:1, aanhef en onder a tot en met h, j, k en m][ref6], [6:1, eerste lid][ref7], [6:2][ref8], [6:3][ref9],
      [7:1, aanhef en onder b][ref10], [7:6, vierde lid][ref11], [7:9, aanhef en onder a tot en met c][ref12],
      [9:5][ref13], [10:11][ref14], [11:13, eerste lid][ref15], [artikel 11:14, eerste lid][ref16], en artikel
      11:15 van de Algemene douanewet, de [artikelen 1:5, vijfde lid][ref17], [2:1, eerste lid][ref18],
      [2:2, eerste en tweede lid][ref19], [3:2, derde lid][ref20], [3:3, aanhef en onder c][ref21],
      [3:4, eerste lid][ref22], en [5:1, tweede en vierde lid, van het Algemeen douanebesluit][ref23],
      de [artikelen 2, eerste lid, onderdeel i][ref24], [3, vierde lid][ref25],
      en [artikel 5, tweede lid, van de Invorderingswet 1990][ref26],
      [artikel 21 van de Wet op de omzetbelasting 1968][ref27], de [artikelen 63, eerste lid][ref28],
      en [69 van de Wet op de accijns][ref29] en aan de [artikelen 27, eerste lid][ref30], en
      [31 van de Wet op de verbruiksbelastingen van alcoholvrije dranken en van enkele andere produkten][ref31].


