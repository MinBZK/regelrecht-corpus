  - number: 1:14
    text: |-
      1 Een aanvraag tot afgifte van een certificaat van oorsprong wordt ingediend:

      a. bij de kamer waarbij de onderneming of rechtspersoon met toepassing van
      [artikel 6 van de Handelsregisterwet 2007][ref1] in het handelsregister is ingeschreven; of

      b. bij de kamer in het gebied waar de aanvrager woont, dan wel is gevestigd indien onderdeel a niet van toepassing
      is; of

      c. bij de kamer in het gebied in Nederland waar de goederen zich bevinden in geval van een onderneming die in een
      andere lidstaat van de Europese Unie is gevestigd en waarvan de goederen via Nederland uitgaan.

      2 De aanvraag bevat gegevens en bewijsstukken op basis waarvan de oorsprong van de in de aanvraag vermelde goederen
      kan worden vastgesteld.

      3 Op de aanvraag, bedoeld in het eerste lid, wordt beslist door de kamer waarbij de aanvraag is ingediend. Het
      certificaat van oorsprong wordt door deze kamer voorzien van haar stempel en van de handtekening van de secretaris
      van de kamer.

      4 Het is verboden onjuiste of onvolledige gegevens te verstrekken:

      a. aan de kamer, bedoeld in het eerste lid, bij een aanvraag tot afgifte van een certificaat van oorsprong; of

      b. aan een ander ten behoeve van een aanvraag tot afgifte van een certificaat van oorsprong door de kamer, als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel6
