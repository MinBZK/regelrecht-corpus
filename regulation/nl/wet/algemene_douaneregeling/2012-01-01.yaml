  - number: 4:7
    text: |-
      Als waarborg voor de betaling van de douaneschuld die kan ontstaan ten aanzien van goederen die onder het stelsel
      van douane-entrepots zijn geplaatst, wordt zekerheid gesteld als bedoeld in artikel 88 van het Communautair
      douanewetboek.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel47
  - number: 4:8
    text: |-
      1 De regeling tijdelijke invoer wordt toegestaan voor vervoermiddelen waarvoor hier te lande een kentekenbewijs
      wordt afgegeven dat is voorzien van de letters CD, CDJ dan wel de letters BN of GN in combinatie met twee
      cijfergroepen van elk twee cijfers.

      2 De in het eerste lid bedoelde vervoermiddelen kunnen onder de regeling worden geplaatst zonder schriftelijke
      aanvraag of vergunning.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel48
  - number: 4:9
    text: |-
      1 Met inachtneming van artikel van 561, eerste lid, onderdeel a, onderscheidenlijk onderdeel b, van de
      toepassingsverordening Communautair douanewetboek, wordt toegestaan dat vervoermiddelen welke worden betrokken uit
      een douane-entrepot of een ruimte voor tijdelijke opslag onder de regeling tijdelijke invoer worden geplaatst.

      2 Voor vervoermiddelen die in overeenstemming met het eerste lid onder de regeling zijn geplaatst, wordt een
      kentekenbewijs afgegeven dat is voorzien van de letters BN of GN in combinatie met twee cijfergroepen van elk twee
      cijfers en een verticale rode balk met daarin de vermelding van het jaar waarin de vrijstelling eindigt en waarop
      voorkomt de aanduiding: ’Vrijstelling van rechten bij invoer en/of omzetbelasting en belasting van personenauto’s
      en motorrijwielen onder voorwaarde van wederuitvoer’.

      3 Het kentekenbewijs heeft een geldigheidsduur van ten hoogste zes maanden in de gevallen als bedoeld in artikel
      van 561, eerste lid, onderdeel a, van de toepassingsverordening Communautair douanewetboek.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel49
  - number: 4:10
    text: |-
      Als vrije zones controletype II is aangewezen het volgende geografische gebied:

      Schiphol, waartoe wordt aangewezen het gebied dat beginnend aan de zuidzijde en gaande via de oost- en noordzijde
      naar de westzijde als volgt wordt begrensd: door de N207-Leimuiderweg vandaar in noordelijke richting naar Van
      Heuven Goedhartlaan, aan oostelijke zijde begrensd door het spoor en Spoorlaan en in westelijke zijde begrensd
      door de Hoofdweg. Vanaf Van Heuven Goedhartlaan in oostelijk richting naar de N201, Weg om Noord die overgaat
      in de Kruisweg (N201) tot aan de A4, vandaar in zuidelijke richting tot aan de Geniedijk. Vanaf de Geniedijk in
      oostelijke richting naar de Aalsmeerderdijk. Van de Aalsmeerderdijk in noordelijke richting die ter hoogte van de
      gemeente Oude Meer overgaat in de Schipholdijk tot aan de kruising met de A-9, vandaar in westelijke richting het
      gedeelte van de A-9 tot aan de A-4, vandaar in zuidelijke richting het gedeelte van de A-4 tot aan de kruising met
      de Schipholweg, vandaar in westelijke richting de Schipholweg tot aan de kruising met de Amsterdamse Baan, vandaar
      in noordelijke richting de Amsterdamse Baan overgaand in de Ookmeerweg tot aan de Etnastraat. Via de Etnastraat
      (noordzijde) in westelijke richting kruisend met de Maroastraat, de Fogostraat, de Lutkemeerweg, de Colimastraat
      en de Bromostraat terug in oostelijke richting via de Etnastraat (zuidzijde) richting de Ookmeerweg. Vandaar in
      zuidelijke richting naar de Amsterdamse Baan tot aan de kruising bij de Hoofdweg bij gemaal Lijnden, vandaar in
      zuidelijke richting de Hoofdweg Oostzijde tot aan de Weg om de Noord, vandaar oostwaarts de Weg om de Noord die
      overgaat in de Kruisweg (N-201).
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel410
  - number: 4:11
    text: |-
      1 Als plaatsen waar een vrij entrepot kan worden gevestigd, worden aangewezen de plaatsen, genoemd in
      [bijlage I][ref1].

      2 De inspecteur kan, rekening houdend met de economische behoefte aan de mogelijkheid een vrij entrepot te
      vestigen, andere plaatsen dan de plaatsen, bedoeld in het eerste lid, aanmerken als plaatsen waar een vrij entrepot
      kan worden gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0024291
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel411
    references:
