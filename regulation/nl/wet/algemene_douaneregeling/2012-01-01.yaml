  - number: 7:14
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van personenvoertuigen
      die bestemd zijn voor het persoonlijk gebruik – gebruik door inwonende gezinsleden daaronder begrepen – van
      personen in dienst bij een internationale organisatie genoemd in [bijlage XIX][ref1].

      2 De vrijstelling, bedoeld in het eerste lid, is niet van toepassing indien het desbetreffende personeelslid
      Nederlander is, duurzaam in Nederland verblijft, dan wel dat er op het moment van het in het vrije verkeer brengen
      sinds de aanvang van de tewerkstelling in Nederland meer dan 10 jaren zijn verstreken.

      3 De vrijstelling, bedoeld in het eerste lid, is beperkt tot één personenvoertuig per persoon in dienst bij de
      aldaar bedoelde internationale organisatie.

      4 Het bepaalde in [artikel 7:10][ref2] is van overeenkomstige toepassing, met dien verstande dat het hoofd van de
      internationale organisatie in een schriftelijke verklaring bevestigt dat de persoon die gebruik wenst te maken van
      de in het eerste lid bedoelde vrijstelling in dienst is bij die internationale organisatie, geen Nederlander is en
      niet duurzaam in Nederland verblijft. Voorts vermeldt de verklaring de normale verblijfplaats van de persoon op het
      moment van aanwerving en de datum van tewerkstelling in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0024291
      [ref2]: https://wetten.overheid.nl/BWBR0024291#Artikel710
