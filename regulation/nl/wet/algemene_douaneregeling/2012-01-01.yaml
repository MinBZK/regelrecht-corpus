  - number: 2:4
    text: |-
      1 Degene die aan de kust goederen heeft opgevist of gered, dan wel aldaar aangespoelde of gestrande
      goederen heeft geborgen, geeft daarvan onverwijld kennis aan de inspecteur. Voor de toepassing van
      de vorige volzin wordt onder kust mede verstaan de wateren, stranden en oevers welke op grond van
      [artikel 21 van de Wet op de strandvonderij][ref1] worden beschouwd te behoren tot de zee en het zeestrand.

      2 De goederen worden zonder toestemming van de inspecteur niet verder landinwaarts gebracht dan tot de eerste
      plaats waar zij tegen beschadiging door het zeewater zijn beveiligd.

      3 Na de kennisgeving worden de goederen aangemerkt als binnengebrachte goederen in de zin van artikel 37, eerste
      lid, van het Communautair douanewetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0001951#Artikel21
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001951
        artikel: '21'
  - number: 2:5
    text: |-
      1 De summiere aangifte voor tijdelijke opslag, bedoeld in artikel 186 van de toepassingsverordening Communautair
      douanewetboek, wordt op elektronische wijze ingediend.

      2 De summiere aangifte voor tijdelijke opslag wordt gesteld in de Nederlandse, Franse, Duitse of Engelse taal.

      3 De summiere aangifte voor tijdelijke opslag bevat de in bijlage 30bis van de toepassingsverordening Communautair
      douanewetboek genoemde vereiste gegevens.

      4 In afwijking van het derde lid bevat de summiere aangifte voor tijdelijke opslag, voor de in een schip aanwezige
      provisie, de gegevens, bedoeld in de scheepsvoorradenaangifte (IMO/FAL 3). Het overzicht van in een schip aanwezige
      persoonlijke bezittingen van bemanningsleden wordt desgevraagd door de gezagvoerder van het schip onverwijld ter
      beschikking gesteld aan de inspecteur.

      5 Indien de summiere aangifte voor tijdelijke opslag betrekking heeft op een of meerdere goederen, genoemd in
      bijlage V, deel B, van richtlijn nr. 2000/29/EG van de Raad van 8 mei 2000 betreffende de beschermende maatregelen
      tegen het binnenbrengen en de verspreiding in de Gemeenschap van voor planten en voor plantaardige producten
      schadelijke organismen (PbEG L 1169), wordt dit, gelijktijdig met het indienen van de summiere aangifte voor
      tijdelijke opslag en door de indiener van die aangifte, expliciet medegedeeld aan de douane.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel25
  - number: 2:6
    text: |-
      De goedkeuring van een ruimte voor tijdelijke opslag, bedoeld in artikel 185, eerste lid, van de
      toepassingsverordening Communautair douanewetboek, is gebonden aan een vergunning tot beheer van de desbetreffende
      ruimte.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel26
  - number: 2:7
    text: |-
      1 Een wijziging in de inrichting van een ruimte voor tijdelijke opslag wordt niet aangebracht dan na goedkeuring
      van de inspecteur.

      2 De inspecteur kan de vergunning tot beheer van een ruimte voor tijdelijke opslag in ieder geval intrekken of
      wijzigen:

      a. op verzoek van de houder van de desbetreffende vergunning;

      b. indien de ruimte niet of niet meer in die mate gebruikt wordt dat handhaving van de vergunning gerechtvaardigd
      is.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel27
  - number: 2:8a
    text: |-
      In voorkomend geval kan de inspecteur, rekening houdend met de aard van de goederen of met de douanebestemming die
      de goederen hebben gekregen dan wel zullen krijgen, andere plaatsen dan douanekantoren aanmerken als plaatsen waar
      goederen kunnen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel28a
  - number: 2:9
    text: |-
      De termijn, bedoeld in artikel 201, tweede lid, van de toepassingsverordening Communautair douanewetboek, is zeven
      dagen na indiening van de aangifte. De plaats waar de goederen worden aangebracht wordt aan het douanekantoor
      schriftelijk of elektronisch gemeld.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel29
  - number: 2:10
    text: |-
      1 Een aangifte tot plaatsing van goederen onder een douaneregeling wordt gedaan in de Nederlandse taal.

      2 In afwijking van het eerste lid kunnen de volgende aangiften eveneens worden gedaan in de Franse, Duitse of
      Engelse taal:

      a. een aangifte tot plaatsing onder de douaneregeling douanevervoer;

      b. een aangifte tot plaatsing onder een douaneregeling met gebruikmaking van een handels- of administratief
      bescheid;

      c. een aangifte tot plaatsing onder de douaneregeling uitvoer.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel210
  - number: 2:11
    text: |-
      1 De formulieren enig document worden ingevuld overeenkomstig het bepaalde in de Toelichting enig document, zoals
      opgenomen in [bijlage VI][ref1].

      2 De bij de invulling van de formulieren enig document te gebruiken codes zijn de codes opgenomen in het codeboek
      Sagitta en beschikbaar via internetadres [www.douane.nl](http://www.douane.nl).


      [ref1]: https://wetten.overheid.nl/BWBR0024291
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0024291
  - number: 2:12
    text: |-
      1 In de gevallen waarin op grond van wettelijke bepalingen in een aangifte de goederencode van de desbetreffende
      goederen moet worden vermeld, is dat de code die voor die goederen is vastgesteld in het gebruikstarief.

      2 Het in het eerste lid bedoelde gebruikstarief is de lijst van goederenomschrijvingen met bijbehorende codes en
      aanduiding van de voor de desbetreffende goederen van toepassing zijnde maatregelen bij in- of uitvoer, zoals die
      geldt ingevolge Verordeningen van de Raad van de Europese Unie of de Commissie van de Europese Gemeenschappen.

      3 Het in het eerste lid bedoelde gebruikstarief is beschikbaar via internetadres www.douane.nl.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel212
  - number: 2:13
    text: |-
      Indien door de inspecteur een vergunning wordt afgegeven voor het gebruik van de regeling douane-entrepots wordt
      in de vergunning bepaald dat, afhankelijk van de aard van de goederen die onder de regeling douane-entrepots
      worden geplaatst, de vergunninghouder en het Centraal Bureau voor de Statistiek overeenstemming bereiken over de
      afzonderlijke aanlevering van gegevens ten behoeve van de entrepotstatistiek.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel213
  - number: 2:14
    text: |-
      1 Monsterneming vindt in tweevoud plaats, tenzij de wijze en/of aard van het onderzoek ertoe noopt meerdere
      monsters te nemen, en de monsters worden ter plaatse verpakt en verzegeld.

      2 Indien mogelijk wordt op verzoek van belanghebbende een extra monster genomen, dat ter plaatse wordt verpakt en
      verzegeld en in het bezit van belanghebbende blijft.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel214
  - number: 2:15
    text: |-
      1 De speling, bedoeld in [artikel 1:35 van de wet][ref1], is, indien het een verschil betreft tussen de waarde
      of de hoeveelheid zoals in de aangifte is aangegeven, en de waarde of de hoeveelheid van hetgeen aanwezig is: een
      percent van de waarde of de hoeveelheid van hetgeen aanwezig is.

      2 De speling, bedoeld in het eerste lid, is niet van toepassing:

      a. indien het bevonden verschil niet is ontstaan ten gevolge van dwaling, onwillekeurig verzuim of natuurlijke
      verliezen;

      b. indien het bevonden verschil van invloed is op de berekening van de douaneschuld;

      c. op aantallen colli of losse voorwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel135
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel215
