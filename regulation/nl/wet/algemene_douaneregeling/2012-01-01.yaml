    text: |-
      Wanneer goederen tussen twee in de Benelux gevestigde vergunninghouders worden overgedragen, kunnen de bevoegde
      autoriteiten in de lidstaat van de overdragende vergunninghouder toestaan dat dit geschiedt zonder dat van het
      controle-exemplaar T5 gebruik wordt gemaakt. In dat geval zijn het vijfde en het zesde lid van artikel 296 van de
      toepassingsverordening Communautair douanewetboek van toepassing.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel44
  - number: 4:5
    text: |-
      Het is verboden:

      a. onjuiste of onvolledige gegevens te verstrekken of te doen verstrekken waarvan het gevolg zou kunnen zijn dat
      ten onrechte een gunstige tariefregeling wordt toegepast;

      b. een handeling te verrichten of medewerking te weigeren in strijd met de verplichtingen die voortvloeien uit de
      verordeningen van de Raad of van de Commissie van de Europese Gemeenschappen inzake de toepassing van een gunstige
      tariefregeling in verband met de bijzondere bestemming, aard of eigenschappen van in het vrije verkeer te brengen
      goederen.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel45
  - number: 4:6
    text: |-
      Aan accijns onderworpen communautaire goederen kunnen slechts in de ruimten van een douane-entrepot worden
      opgeslagen voor zover de [Wet op de accijns][ref1] in deze opslag voorziet en onder de bij of krachtens de
      [Wet op de accijns][ref2] gestelde voorwaarden en beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251
      [ref2]: https://wetten.overheid.nl/BWBR0005251
