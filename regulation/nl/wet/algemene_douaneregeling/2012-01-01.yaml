  - number: 1:7
    text: |-
      1 De voorzitter van het productschap is inspecteur als bedoeld in
      [artikel 1:3, eerste lid, onderdeel c, van de wet][ref1].

      2 De aanwijzing, bedoeld in het eerste lid, geldt alleen voor de toepassing van artikel 78, tweede lid, van het
      Communautair douanewetboek.

      3 De voorzitter, bedoeld in het eerste lid, kan bij het uitoefenen van de hem bij dat lid opgedragen taken
      alleen de bevoegdheden, bedoeld in de [artikelen 1:23][ref2], [1:24][ref3], [1:25][ref4], [1:27][ref5],
      [1:31 tot en met 1:34 van de wet][ref6], toepassen.


