      1 Op de accijnzen zijn de artikelen 3 tot en met 20, 23, 24, 59, 74 tot en met 80, 85, 86, 95 tot en met 101 en
      107 tot en met 112 van Verordening 1186/2009 alsmede de [artikelen 7:2 tot en met 7:13][ref1], [7:15][ref2] en
      [7:16][ref3] van overeenkomstige toepassing.

      2 Op de omzetbelasting zijn de artikelen 3 tot en met 20, 21, 24, 54 tot en met 56, 59 tot en met 65, 74 tot en
      met 103 en 105 tot en met 113 van Verordening 1186/2009, alsmede de [artikelen 7:2 tot en met 7:16][ref4] van
      overeenkomstige toepassing.

      3 Op de omzetbelasting is artikel 23 van Verordening 1186/2009 van overeenkomstige toepassing met dien verstande
      dat onder ‘goederen met een te verwaarlozen waarde’ wordt verstaan goederen waarvan de intrinsieke waarde niet meer
      dan € 22 per zending bedraagt.

      4 Op de verbruiksbelastingen van alcoholvrije dranken en van enkele andere produkten zijn de artikelen 3 tot en met
      20, 23, 24, 59, 74 tot en met 80, 85, 86, 90 tot en met 101 en 107 tot en met 112 van Verordening 1186/2009 alsmede
      de [artikelen 7:2 tot en met 7:13][ref5], [7:15][ref6] en [7:16][ref7] van overeenkomstige toepassing.

      5 Op de omzetbelasting is de gehele of gedeeltelijke vrijstelling van rechten bij invoer bij het in het vrije
      verkeer brengen van goederen, die overeenkomstig de douaneregeling passieve veredeling tijdelijk zijn uitgevoerd,
      van overeenkomstige toepassing.


