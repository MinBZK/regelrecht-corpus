  - number: 8:1a
    text: |-
      De aanvulling of vervanging van een zekerheid, bedoeld in artikel 198 van het Communautair douanewetboek, wordt
      binnen een maand na de mededeling door de ontvanger, dat aanvulling of vervanging van de zekerheid wordt geëist,
      gesteld.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel81a
  - number: 8:2
    text: |-
      Het aanslagbiljet bevat in ieder geval de volgende gegevens:

        - naam, adres en woonplaats van de schuldenaar of belanghebbende;
        - kenmerk en datum van de beschikking;
        - bedrag aan rechten, compensatierente dan wel compenserende rente, kosten of bestuurlijke boete;
        - bezwaarclausule.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel82
  - number: 8:3
    text: |-
      1 Voor de berekening van het bedrag aan rechten, andere belastingen, heffingen en retributies wordt een bedrag dat
      dient als grondslag voor die berekening zodanig afgerond dat een gedeelte van een euro rekenkundig wordt afgerond
      op hele euro’s.

      2 Voor de berekening van het bedrag aan rechten, andere belastingen, heffingen en retributies wordt een hoeveelheid
      die dient als grondslag voor die berekening, zodanig afgerond dat een gedeelte van een kilogram, van een liter of
      van een meter in aanmerking wordt genomen als een heel kilogram, een hele liter of een hele meter.

      3 Indien de eenheid waarover het bedrag aan rechten, andere belastingen, heffingen en retributies moet worden
      berekend minder is dan een kilogram, een liter of een meter, wordt, in afwijking van het tweede lid, een
      hoeveelheid die dient als grondslag voor de berekening, bedoeld in het tweede lid, zodanig afgerond dat een
      gedeelte van 100 gram, van een deciliter of van een decimeter in aanmerking wordt genomen als 100 gram, een hele
      deciliter of een hele decimeter.

      4 Voor de berekening van het bedrag aan rechten, andere belastingen, heffingen en retributies wordt een
      volumepercentage ethylalcohol die dient als grondslag voor die berekening, naar beneden afgerond op tiende percent
      absolute ethylalcohol.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel83
  - number: 8:4
    text: |-
      Indien de hoeveelheid van de goederen kleiner is dan de hoeveelheid waarin het douanetarief is uitgedrukt, wordt
      het bedrag aan rechten naar evenredigheid berekend.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel84
  - number: 8:5
    text: |-
      1 Het bedrag aan rechten, andere belastingen, heffingen, retributies, renten, interesten of kosten van ambtelijke
      werkzaamheden wordt rekenkundig afgerond op eurocenten.

      2 Indien de berekening van het bedrag, bedoeld in het eerste lid, geschiedt aan de hand van een aangifte, wordt elk
      onderdeel van de aangifte overeenkomstig het eerste lid afgerond.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel85
  - number: 8:6
    text: |-
      1 De boeking van bedragen aan rechten blijft achterwege indien het totaal verschuldigde bedrag lager is dan € 10.

      2 Indien een aanvullende aangifte als bedoeld in artikel 76, tweede lid, van het Communautair douanewetboek wordt
      gedaan, wordt voor de toepassing van het eerste lid onder totaal verschuldigd bedrag verstaan het op grond van de
      aanvullende aangifte getotaliseerde verschuldigde bedrag.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel86
  - number: 9:1
    text: |-
      1 Terugbetaling of kwijtschelding van accijnzen, omzetbelasting en de verbruiksbelastingen van alcoholvrije dranken
      en enkele andere producten wordt verleend in de gevallen waarin bij of krachtens het Communautair douanewetboek
      aanspraak op terugbetaling of kwijtschelding van rechten bij invoer bestaat of zou bestaan.

      2 De door het Comité genomen beschikking, bedoeld in artikel 239, lid 1, tweede gedachtestreepje, van het
      Communautair douanewetboek en de ter uitvoering van dat artikel vastgestelde bepalingen zijn van overeenkomstige
      toepassing op het verzoek om terugbetaling of kwijtschelding voor zover het tevens betrekking heeft op accijnzen,
      omzetbelasting en de verbruiksbelastingen van alcoholvrije dranken en van enkele andere producten.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel91
  - number: 10:1
    text: |-
      1 Het drukken van formulieren van certificaten inzake goederenverkeer zonder een vergunning van de Minister van
      Financiën en het drukken van certificaten van oorsprong zonder vergunning van de Minister van Economische Zaken,
      Landbouw en Innovatie vormen verzuimen ter zake waarvan door de inspecteur een bestuurlijke boete kan worden
      opgelegd van ten hoogste € 150.

      2 Overtreding van het verbod:

      a. bedoeld in [artikel 1:14, vierde lid][ref1]; of

      b. bedoeld in [artikel 1:16, vierde lid][ref2];

      vormt een verzuim ter zake waarvan door de inspecteur een bestuurlijke boete kan worden opgelegd van ten hoogste
      € 150.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel114
