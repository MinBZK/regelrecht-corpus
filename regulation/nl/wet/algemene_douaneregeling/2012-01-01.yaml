        bwb_id: BWBR0024291
  - number: 4:13
    text: |-
      1 Bij zijn aanvraag tot verlening van een vergunning voor gebruik van een vrije zone of een vrij entrepot vraagt
      de belanghebbende, bedoeld in bedoeld in artikel 799, onderdeel c, van de toepassingsverordening Communautair
      douanewetboek, goedkeuring aan de inspecteur voor:

      a. de door hem gevoerde administratie;

      b. de inrichting van het gebouw dat voor werkzaamheden gebruikt gaat worden.

      2 De in het eerste lid bedoelde belanghebbende onderwerpt een voorgenomen wijziging in de door hem gevoerde
      administratie, of de inrichting van het gebouw dat voor werkzaamheden gebruikt gaat worden, aan de goedkeuring van
      de inspecteur, indien door deze wijziging de wijze waarop toezicht kan worden uitgeoefend, wordt beïnvloed.

      3 Een wijziging als bedoeld in het tweede lid, wordt niet aangebracht dan nadat van de inspecteur goedkeuring is
      verkregen en de beheerder van die goedkeuring op de hoogte is.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel413
  - number: 4:14
    text: |-
      1 De beheerder van een vrije zone controletype II, bedoeld in
      [artikel 5:1, derde lid, van het Algemeen douanebesluit][ref1], zorgt ervoor dat:

      a. goederen tijdens hun verblijf in de vrije zone controletype II niet aan het douanetoezicht worden onttrokken;

      b. wordt voldaan aan de bijzondere voorwaarden die in de vergunning zijn vastgesteld.

      2 De belanghebbende, bedoeld in artikel 799, onderdeel c, van de toepassingsverordening Communautair douanewetboek,
      die werkzaam is in de vrije zone controletype II, is verantwoordelijk voor het nakomen van de verplichtingen die
      voortvloeien uit de plaatsing van de goederen in de vrije zone controletype II.

      3 In afwijking van het eerste lid kan in de vergunning tot beheer van een vrije zone controletype II worden bepaald
      dat de verplichtingen, bedoeld in onderdeel a van dat lid, uitsluitend berusten bij de belanghebbende, bedoeld in
      artikel 799, onderdeel c, van de toepassingsverordening Communautair douanewetboek, die werkzaam is in de vrije
      zone controletype II.

      4 De inspecteur kan van de beheerder of van de belanghebbende, bedoeld in artikel 799, onderdeel c, van de
      toepassingsverordening Communautair douanewetboek, die werkzaam is in de vrije zone controletype II, verlangen dat
      zekerheid wordt gesteld met betrekking tot de door hen na te komen verplichtingen.


