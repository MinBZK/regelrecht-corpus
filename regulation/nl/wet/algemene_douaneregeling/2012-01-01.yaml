  - number: 3:19
    text: |-
      1 De toekenning van restitutie, bedoeld in verordening 612/2009, vindt plaats door het productschap.

      2 Ten behoeve van de uitvoering van het eerste lid, is het productschap bevoegd:

      a. bewijzen als bedoeld in artikel 10, eerste lid, onder b, tweede gedachtestreepje, van verordening 612/2009,
      te ontvangen;

      b. aanvullende bewijzen als bedoeld in artikel 27, eerste lid, derde alinea, van verordening 612/2009, te vorderen;

      c. verzoeken als bedoeld in artikel 28, eerste lid, vierde alinea, van verordening 612/2009 te doen.

      3 In de gevallen waarin het stellen van zekerheid op grond van een communautaire verplichting een voorwaarde is
      voor de toekenning van restitutie, wordt de zekerheid gesteld bij het productschap.

      4 Het opleggen van administratieve sancties als bedoeld in artikel 48 van verordening 612/2009, vindt plaats door
      het productschap.

      5 Het opleggen van maatregelen als bedoeld in artikel 3, eerste lid, van [Verordening (EG) nr. 1469/95](31995R1469)
      van de Raad van de Europese Unie van 22 juni 1995 betreffende de maatregelen die moeten worden genomen ten aanzien
      van bepaalde begunstigden van uit het EOFGL, afdeling Garantie, gefinancierde verrichtingen (PbEU 1995, L 145)
      vindt plaats door het productschap.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel319
  - number: 3:20
    text: |-
      Het productschap is bevoegd te beslissen op een verzoek als bedoeld in artikel 24, eerste lid, van verordening
      612/2009.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel320
  - number: 3:21
    text: |-
      1 Het productschap is bevoegd het ontslag te verlenen, bedoeld in artikel 24 van verordening 612/2009.

      2 Een verzoek als bedoeld in artikel 24, derde lid, van verordening 612/2009 wordt ingediend bij het productschap.

      3 Het productschap is bevoegd de beslissingen, bedoeld in artikel 24, vierde lid, van verordening 612/2009 te
      nemen.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel321
  - number: 3:22
    text: |-
      1 De voorzitter van het Hoofdproductschap Akkerbouw verleent de erkenning, bedoeld in artikel 18, eerste lid, van
      verordening 612/2009.

      2 De voorzitter van het Hoofdproductschap Akkerbouw kan een erkenning als bedoeld in het eerste lid schorsen of
      intrekken in de gevallen, bedoeld in de artikelen 19, eerste lid, en 21, eerste en derde lid, van verordening
      612/2009.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel322
  - number: 3:23
    text: |-
      1 Het Hoofdproductschap Akkerbouw is bevoegd tot verlening van de toestemming als bedoeld in artikel 34, eerste
      lid, van verordening 612/2009.

      2 Een belanghebbende dient een schriftelijke aanvraag om de toestemming, bedoeld in het eerste lid, in bij het
      Hoofdproductschap Akkerbouw.

      3 De in het eerste lid bedoelde toestemming wordt verleend indien de belanghebbende:

      a. gespecialiseerd is in scheepsproviandering;

      b. een administratie voert die inzichtelijk maakt dat de landbouwproducten de bestemming hebben bereikt, en

      c. een controleregister bijhoudt als bedoeld in artikel 34, vierde lid, eerste en tweede alinea, van verordening
      612/2009, of de bij iedere leverantie gebruikte documenten overlegt waarop de douaneautoriteiten de datum hebben
      vermeld waarop de producten aan boord zijn gebracht.

      4 Het Hoofdproductschap Akkerbouw is bevoegd tot intrekking van de toestemming indien de belanghebbende niet langer
      voldoet aan de in het derde lid bedoelde eisen of aan de eisen, bedoeld in artikel 34 van verordening 612/2009.

      5 De Algemene Inspectiedienst gaat, voorafgaand aan de verlening van de toestemming, bedoeld in het eerste
      lid, na of aan de in het derde lid bedoelde vereisten is voldaan en doet van zijn bevindingen verslag aan het
      Hoofdproductschap Akkerbouw.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel323
  - number: 3:24
    text: |-
      1 Een belanghebbende aan wie de toestemming, bedoeld in [artikel 3:23, eerste lid][ref1], is verleend, geeft
      overeenkomstig een bij het productschap op te vragen maandstaat, uiterlijk vóór het eind van de kalendermaand
      volgend op de maand waarin de landbouwproducten ten uitvoer zijn aangegeven, alle in laatstbedoelde maand
      aangegeven landbouwproducten op bij het productschap.

      2 De in het eerste lid bedoelde opgave van landbouwproducten zijn gespecificeerd naar GN-code en, indien van
      toepassing, de restitutiecode.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel323
