  - number: 3:3
    text: |-
      Het Productschap Zuivel wordt aangewezen als de bevoegde autoriteit, bedoeld in artikel 7 van [Verordening (EG) nr.
      2535/2001](32001R2535) van de Commissie van 14 december 2001 houdende uitvoeringsbepalingen van [Verordening (EG)
      nr. 1255/1999](31999R1255) van de Raad voor de invoerregeling voor melk en zuivelproducten en houdende opening van
      tariefcontingenten (PbEU 2001, L341).
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel33
  - number: 3:4
    text: |-
      Het productschap is bevoegd de voorschriften, bedoeld in artikel 17, tweede lid, tweede alinea, [verordening
      376/2008](32008R0376), vast te stellen.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel34
  - number: 3:5
    text: |-
      1 Het productschap is bevoegd een ontheffing te verlenen als bedoeld in artikel 4, derde lid, van [verordening
      376/2008](32008R0376).

      2 Indien het productschap gebruik maakt van de bevoegdheid, bedoeld in het eerste lid, is het productschap tevens
      de bevoegde autoriteit, bedoeld in artikel 4, derde lid, onder c, van [verordening 376/2008](32008R0376).
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel35
  - number: 3:6
    text: |-
      Het productschap is bevoegd de toestemming te verlenen, bedoeld in artikel 40, vijfde lid, van [verordening
      376/2008](32008R0376).
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel36
  - number: 3:7
    text: |-
      De zekerheid, bedoeld in artikel 14, tweede lid, van [verordening 376/2008](32008R0376) wordt gesteld bij het
      productschap.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel37
  - number: 3:8
    text: |-
      1 Het productschap is bevoegd op verzoek van belanghebbende certificaten onder zich te houden, onderscheidenlijk
      in bewaring te nemen ten behoeve van de toepassing van artikel 24 van [verordening 376/2008](32008R0376) op dat
      certificaat.

      2 Indien het productschap gebruik maakt van de bevoegdheid, bedoeld in het eerste lid, wordt het productschap
      aangemerkt als de bevoegde autoriteit, bedoeld in artikel 24, tweede lid, van [verordening 376/2008](32008R0376).
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel38
  - number: 3:9
    text: |-
      De certificaten, bedoeld in [artikel 3:2, tweede lid, van het besluit][ref1], zijn in het Nederlands gesteld.


