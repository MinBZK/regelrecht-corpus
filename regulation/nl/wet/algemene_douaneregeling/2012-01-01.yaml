  - number: 7:26
    text: |-
      1 Op de accijnzen, de omzetbelasting en de verbruiksbelastingen van alcoholvrije dranken en van enkele andere
      producten zijn de artikelen 185 tot en met 187 van het Communautair douanewetboek, de artikelen 844 tot en met
      856 van de toepassingsverordening Communautair douanewetboek alsmede [artikel 7:28][ref1] van overeenkomstige
      toepassing met dien verstande dat de bepalingen inzake het inlichtingenblad INF 3 slechts van toepassing zijn voor
      zover gelijktijdig aanspraak op vrijstelling van rechten bij invoer wordt gemaakt.

      2 Vrijstelling van omzetbelasting voor terugkerende goederen als bedoeld in het eerste lid wordt slechts verleend,
      indien wordt aangetoond dat op de terugkerende goederen omzetbelasting drukt.

      3 Vrijstelling van accijns voor terugkerende goederen als bedoeld in het eerste lid wordt slechts verleend,
      indien wordt aangetoond dat de voorafgaande uitvoer van deze goederen niet heeft plaatsgevonden uit een
      accijnsgoederenplaats dan wel met teruggaaf van accijns.

      4 Vrijstelling van verbruiksbelasting voor terugkerende goederen als bedoeld in het
      eerste lid wordt slechts verleend, indien wordt aangetoond dat de voorafgaande uitvoer
      van deze goederen niet heeft plaatsgevonden vanuit een inrichting als bedoeld in
      [artikel 2, onderdeel b, van de Wet op de verbruiksbelastingen van alcoholvrije dranken][ref2] en van enkele andere
      produkten dan wel met teruggaaf van verbruiksbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel728
      [ref2]: https://wetten.overheid.nl/BWBR0005802#Artikel2
