  - number: 1:2
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder:

      a. wet: [Algemene douanewet][ref1];

      b. besluit: [Algemeen douanebesluit][ref2];

      c. binnenkomend schip: schip waarvoor de in artikel 40 van het Communautair douanewetboek bedoelde formaliteiten
      moeten worden vervuld;

      d. binnenkomend luchtvaartuig: luchtvaartuig waarvoor de in artikel 40 van het Communautair douanewetboek bedoelde
      formaliteiten moeten worden vervuld;

      e. Algemene Inspectiedienst: Algemene Inspectiedienst van het Ministerie van Economische Zaken, Landbouw en
      Innovatie;

      f. productschap: productschap of hoofdproductschap dat in [kolom 2 van bijlage VII][ref3] is genoemd als bevoegd
      productschap ten aanzien van het goed, genoemd in [kolom 1 van bijlage VII][ref4];

      g. Verordening 1186/2009: Verordening (EG) nr. 1186/2009 van de Raad van de Europese Unie van 16 november 2009
      betreffende de instelling van een communautaire regeling inzake douanevrijstellingen (PbEG L 324);

      h. [verordening 376/2008](32008R0376): [Verordening (EG) nr. 376/2008](32008R0376) van de Commissie van 23
      april 2008 houdende gemeenschappelijke uitvoeringsbepalingen inzake het stelsel van invoer-, uitvoer- en
      voorfixatiecertificaten voor landbouwproducten (PbEU 2008, L 114);

      i. verordening 612/2009: Verordening (EG) nr. 612/2009 van de Commissie van 7 juli 2009 houdende gemeenschappelijke
      uitvoeringsbepalingen van het stelsel van restituties bij uitvoer voor landbouwproducten (PbEU L 186);

      j. de Post: het postvervoersbedrijf dat belast is met de universele postdienst als bedoeld in
      [artikel 15, eerste lid, van de Postwet 2009][ref5];

      k. brieven en postzendingen: brieven en poststukken als bedoeld in
      [artikel 2, eerste lid, onderdelen a en b, van de Postwet 2009][ref6], voor zover zij vallen onder de verplichting,
      bedoeld in [artikel 18 van die wet][ref7];

      l. bier: bier als bedoeld in [artikel 6 van de Wet op de accijns][ref8];

      m. minerale oliën: minerale oliën als bedoeld in de [artikelen 25][ref9] en [26 van de Wet op de accijns][ref10];

      n. tabaksproducten: tabaksproducten als bedoeld in [artikel 29 van de Wet op de accijns][ref11];

      o. sigaretten: sigaretten als bedoeld in [artikel 31 van de Wet op de accijns][ref12];

      p. sigaren: sigaren als bedoeld in [artikel 30 van de Wet op de accijns][ref13];

      q. cigarillo’s: sigaren met een maximumgewicht van 3 gram per stuk;

      r. rooktabak: rooktabak als bedoeld in [artikel 32 van de Wet op de accijns][ref14];

      s. kanselarijbenodigdheden: officiële emblemen en documenten alsmede kantoormeubilair en kantoorbenodigdheden
      bestemd voor een kanselarij.


