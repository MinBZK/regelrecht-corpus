  - number: 7:22
    text: |-
      Op de omzetbelasting is artikel 43 van Verordening 1186/2009 alsmede de [artikelen 7:2][ref1] en [7:4][ref2], van
      overeenkomstige toepassing voor zover het betreft goederen, genoemd in bijlage II, onderdeel B, van Verordening
      1186/2009, mits de aan de aangifte voor het vrije verkeer ten grondslag liggende levering om niet geschiedt, of,
      indien zij onder bezwarende titel plaatsheeft, de goederen worden geleverd door een ander dan een ondernemer in de
      zin van de [Wet op de omzetbelasting 1968][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0024291#Artikel74
