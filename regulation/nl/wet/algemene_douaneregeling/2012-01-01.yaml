  - number: 7:18
    text: |-
      Op de accijnzen, de omzetbelasting en de verbruiksbelastingen van alcoholvrije dranken en van enkele andere
      producten zijn de artikelen 25 tot en met 27 van Verordening 1186/2009 van overeenkomstige toepassing met dien
      verstande dat:

      a. de vrijstelling voor alcoholhoudende dranken als bedoeld in artikel 27, onderdeel b, eerste en tweede
      gedachtestreepje, van Verordening 1186/2009, is beperkt tot één fles van het gebruikelijke type met een maximum van
      1 liter;

      b. de vrijstelling voor de hierna genoemde goederen is beperkt tot de volgende hoeveelheden:

      1°. koffie: 500 gram;

      2°. koffie-extracten en koffie-essences: 200 gram;

      3°. thee: 100 gram;

      4°. thee-extracten en thee-essences: 40 gram.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel718
  - number: 7:19
    text: |-
      Op de omzetbelasting zijn de artikelen 28 tot en met 34 van Verordening 1186/2009, alsmede de
      [artikelen 7:2][ref1] en [7:3][ref2] van overeenkomstige toepassing voor zover de voor het vrije
      verkeer aangegeven goederen niet zijn bestemd voor de uitoefening van een activiteit die op grond van
      [artikel 11 van de Wet op de omzetbelasting 1968][ref3] is vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024291#Artikel72
