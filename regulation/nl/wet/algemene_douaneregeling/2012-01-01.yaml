  - number: 3:2
    text: |-
      1 De bevoegdheid, bedoeld in [art 3:2, tweede lid, van het besluit][ref1] wordt overgedragen aan het productschap.

      2 Het productschap wordt aangewezen als:

      a. de instantie van afgifte, bedoeld in de artikelen 8, tweede lid, tweede alinea, en derde lid, 20, 21, 32, derde
      lid, 34, derde lid, 38, eerste lid, 40, vierde lid, 45, derde lid, 47, derde lid, tweede alinea, vijfde, achtste en
