      1 Voor het elektronisch verzenden van aangiften en berichten is een vergunning van de inspecteur vereist. De
      technische specificaties van de aangiften en berichten worden vastgesteld door de inspecteur.

      2 Aan de verplichting een bescheid te overleggen wordt voldaan door in een elektronische aangifte voor plaatsing
      van goederen onder een douaneregeling te vermelden dat deze in het bezit zijn van het subject van de regeling. De
      inspecteur kan nadere bepalingen vaststellen voor de wijze van toezending van de bescheiden of voor de wijze van
      archivering daarvan.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel111
  - number: 1:12
    text: |-
      Het tarief van de kosten die op grond van [artikel 1:19, eerste lid, van de wet][ref1], door de belanghebbende aan
      het Rijk verschuldigd zijn, is:

      a. indien het ambtelijke verrichtingen betreft: € 24 per half uur;

      b. het bedrag, dat door derden aan de inspecteur in rekening is gebracht.


