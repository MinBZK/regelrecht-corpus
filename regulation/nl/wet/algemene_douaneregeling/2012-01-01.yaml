      1 Vrije zones controletype I en vrije entrepots worden, wanneer daar niet wordt gewerkt, ambtelijk gesloten.

      2 Buiten de kantooruren van de inspecteur mag in de vrije zones controletype I en vrije entrepots alleen worden
      gewerkt met toestemming van de inspecteur.
