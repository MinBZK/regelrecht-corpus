  - number: 7:15
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het in het vrije verkeer brengen van gronduitrusting door
      buiten de Benelux gevestigde luchtvaartondernemingen om op een douaneluchtvaartterrein te worden gebruikt voor de
      inrichting of exploitatie van een internationale luchtdienst door die onderneming.

      2 Voor het brengen in het vrije verkeer met vrijstelling van rechten bij invoer is een vergunning van de inspecteur
      vereist.

      3 Indien de luchtvaartonderneming tegelijkertijd goederen van twee of meer soorten in het vrije verkeer brengt, mag
      worden volstaan met één aangifte voor het brengen in het vrije verkeer, mits de aangifte is aangevuld met een lijst
      waarop de gegevens van de goederen zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel715
  - number: 7:16
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van:

      a. provisie en scheepsbehoeften aan boord van binnenkomende schepen, geen woonschepen zijnde;

      b. provisie aanwezig in luchtvaartuigen in internationaal verkeer;

      c. brandstoffen en smeermiddelen aanwezig in binnenkomende schepen en luchtvaartuigen en bestemd voor de
      aandrijving of smering daarvan.

      2 De vrijstelling voor de goederen, bedoeld in het eerste lid, wordt slechts verleend voor de hoeveelheden, welke
      redelijkerwijs noodzakelijk worden geacht voor het verbruik of gebruik aan boord.

      3 Het is verboden de goederen uit de vervoermiddelen te verwijderen.
    url: https://wetten.overheid.nl/BWBR0024291/2012-01-01#Artikel716
