  - number: XXXVI
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld, waarbij de [artikelen I, onderdeel A][ref1],
      [VII, onderdeel C, onder 2, onderdelen c en d][ref2], [XIIA][ref3], [XVII, onderdeel A][ref4], en
      [XXX, onderdelen aA en Aa][ref5], kunnen terugwerken tot en met een in dat besluit te bepalen tijdstip.


