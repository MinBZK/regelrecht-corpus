preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om enige wijzigingen aan te brengen in de wetgeving van
    het Ministerie van Sociale Zaken en Werkgelegenheid, en enkele andere ministeries;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0041571/2020-01-01#ArtikelAanhef
articles:
  - number: XXXV
    text: |-
      Het recht op de remigratievoorzieningen van de remigrant die op grond van
      [artikel 5, eerste lid, van de Remigratiewet][ref1] een recht op de remigratievoorzieningen heeft verkregen als
      ware hij een alleenstaande remigrant, wordt op de dag van inwerkingtreding van deze wet omgezet in een recht op de
      remigratievoorzieningen als ware hij een remigrant met een partner, indien:

      a. het recht van de partner op de voorzieningen, bedoeld in [artikel 5, eerste lid, van de Remigratiewet][ref2], op
      grond van [artikel 6, tweede lid, van de Remigratiewet][ref3] is beëindigd; en

      b. de remigrant en de partner op de datum van inwerkingtreding van deze wet niet duurzaam gescheiden leven.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel6
