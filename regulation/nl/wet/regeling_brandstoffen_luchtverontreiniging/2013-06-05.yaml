$id: regeling_brandstoffen_luchtverontreiniging
regulatory_layer: WET
publication_date: '2020-07-16'
valid_from: '2013-06-05'
bwb_id: BWBR0029916
url: https://wetten.overheid.nl/BWBR0029916/2013-06-05
preamble:
  text: |-
    Gelet op de artikelen 2.2, derde lid, 2.3, tweede lid, 2.4, tweede lid, 2.5, tweede lid, 2.6, derde lid, 2.9,
    vijfde lid, 4.2, tweede lid, en 5.1, vierde lid, van het Besluit brandstoffen luchtverontreiniging;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *ASTM:* American Society for Testing and Materials;
        - *besluit:* [Besluit brandstoffen luchtverontreiniging][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029909
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029909
  - number: '2.1'
    text: |-
      De testmethode, bedoeld in [artikel 2.2, derde lid, van het besluit][ref1] is de methode prEN 16135 of de methode
      prEN 16136.


      [ref1]: https://wetten.overheid.nl/BWBR0029909#Artikel2
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029909
        artikel: '2'
  - number: '2.2'
    text: |-
      De testmethode, bedoeld in [artikel 2.3, tweede lid, van het besluit][ref1] is de methode EN 228:2008.


      [ref1]: https://wetten.overheid.nl/BWBR0029909#Artikel2
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029909
        artikel: '2'
  - number: '2.3'
    text: |-
      De testmethode, bedoeld in de [artikelen 2.5, tweede lid][ref1], en [2.6, derde lid, van het besluit][ref2] is de
      methode EN 590:2009.


      [ref1]: https://wetten.overheid.nl/BWBR0029909#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029909#Artikel2
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029909
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0029909
        artikel: '2'
  - number: '3'
    text: |-
      Het tijdstip, bedoeld in [artikel 2.4, tweede lid, van het besluit][ref1] is, voor tankstations die in de maand
      april van een jaar per benzinekwaliteit minder dan driemaal zijn bevoorraad, de datum waarop het tankstation na
      15 april van dat jaar voor de tweede maal met zomerbenzine is bevoorraad, indien die datum is gelegen na 1 mei van
      dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0029909#Artikel2
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029909
        artikel: '2'
  - number: '4.1'
    text: |-
      Voor het nakomen van de verplichting, bedoeld in [artikel 2.9, eerste lid, van het besluit][ref1],
      tellen biotickets als bedoeld in [artikel 1 van het Besluit hernieuwbare energie vervoer][ref2]
      van andere rapportageplichtigen en van leveranciers van elektriciteit of biogas als bedoeld in
      [artikel 6 van dat besluit][ref3] mee.


      [ref1]: https://wetten.overheid.nl/BWBR0029909#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029926#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0029926#Artikel6
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029909
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0029926
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0029926
        artikel: '6'
  - number: '4.2'
    text: |-
      Biobrandstoffen die met toepassing van
      [artikel 3, zesde lid, onderdeel b, van het Besluit hernieuwbare energie vervoer][ref1], in enig jaar meetellen
      voor het nakomen van de verplichting, bedoeld in artikel 3, eerste lid, van dat besluit, tellen in dat jaar tevens
      mee voor het nakomen van de verplichting, bedoeld in [artikel 2.9, eerste lid, van het besluit][ref2]. Artikel 18
      van de Regeling hernieuwbare energie vervoer is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029926#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029909#Artikel2
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029926
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0029909
        artikel: '2'
  - number: '4.3'
    text: |-
      Voor zover een hoeveelheid elektriciteit is geleverd ten behoeve van wegvoertuigen wordt die hoeveelheid geleverde
      elektriciteit voor het nakomen van de verplichting, bedoeld in [artikel 2.9, eerste lid, van het besluit][ref1],
      vermenigvuldigd met tweeënhalf.


      [ref1]: https://wetten.overheid.nl/BWBR0029909#Artikel2
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029909
        artikel: '2'
  - number: '4.4'
    text: |-
      De rapportage, bedoeld in [artikel 2.9, derde lid, van het besluit][ref1], wordt ingediend door middel van een door
      de Minister van Infrastructuur en Milieu vastgesteld en door het bestuur van de emissieautoriteit op elektronische
      wijze ter beschikking gesteld model.


      [ref1]: https://wetten.overheid.nl/BWBR0029909#Artikel2
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029909
        artikel: '2'
  - number: 4a
    text: |-
      De hoeveelheid, bedoeld in [artikel 2.9a, van het besluit][ref1], is voor:


      [ref1]: https://wetten.overheid.nl/BWBR0029909#Artikel2
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0029909
        artikel: '2'
  - number: 4a.a
    text: 'benzine, diesel, LPG, en gasolie voor mobiele machines: 50.000 liter;'
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel4a
  - number: 4a.b
    text: 'CNG en LNG, bestemd voor wegvoertuigen: 50.000 Nm3.'
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel4a
  - number: '5'
    text: |-
      De testmethode, bedoeld in [artikel 4.2, tweede lid, van het besluit][ref1] is:


      [ref1]: https://wetten.overheid.nl/BWBR0029909#Artikel4
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0029909
        artikel: '4'
  - number: 5.a
    text: 'voor bemonstering van brandstof die:'
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel5
  - number: 5.a.1°
    text: 'een vaste stof is: de Nederlandse norm NEN 3010,'
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel5
  - number: 5.a.2°
    text: 'een vloeistof is: de methode ASTM D 4057,'
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel5
  - number: 5.a.3°
    text: 'een gas is: de methode ASTM D 1145,'
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel5
  - number: 5.a.4°
    text: 'een vloeibaar gemaakt gas is: de methode ASTM D 1265;'
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel5
  - number: 5.b
    text: 'voor het bepalen van het zwavelgehalte van een brandstof die:'
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel5
  - number: 5.b.1°
    text: 'een vaste stof is: de norm NEN/ISO 351,'
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel5
  - number: 5.b.2°
    text: 'een vloeistof is: de methode EN ISO 14596,'
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel5
  - number: 5.b.3°
    text: 'een gas of een vloeibaar gemaakt gas is: de methode ASTM D 2784;'
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel5
  - number: 5.c
    text: |-
      voor de interpretatie van de waarde, welke is gevonden volgens een in onderdeel b genoemde methode: de norm ISO
      4259 (1992).
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Regeling brandstoffen luchtverontreiniging.'
    url: https://wetten.overheid.nl/BWBR0029916/2013-06-05#Artikel7
