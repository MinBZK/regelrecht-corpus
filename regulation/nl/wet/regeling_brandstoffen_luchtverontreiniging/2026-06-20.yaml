        artikel: '2.6'
  - number: '3'
    text: |-
      Het tijdstip, bedoeld in [artikel 2.4, tweede lid, van het besluit][ref1] is, voor tankstations die in de maand
      april van een jaar per benzinekwaliteit minder dan driemaal zijn bevoorraad, de datum waarop het tankstation na
      15 april van dat jaar voor de tweede maal met zomerbenzine is bevoorraad, indien die datum is gelegen na 1 mei van
      dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0029909#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0029916/2026-06-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029909
        artikel: '2.4'
  - number: '5'
    text: |-
      De testmethode, bedoeld in [artikel 4.2, tweede lid, van het besluit][ref1] is:

      a. voor bemonstering van brandstof die:

      1°. een vaste stof is: de Nederlandse norm NEN 3010,

      2°. een vloeistof is: de methode ASTM D 4057,

      3°. een gas is: de methode ASTM D 1145,

      4°. een vloeibaar gemaakt gas is: de methode ASTM D 1265;

      b. voor het bepalen van het zwavelgehalte van een brandstof die:

      1°. een vaste stof is: de norm NEN/ISO 351,

      2°. een vloeistof is: de methode EN ISO 14596,

      3°. een gas of een vloeibaar gemaakt gas is: de methode ASTM D 2784;

      c. voor de interpretatie van de waarde, welke is gevonden volgens een in onderdeel b genoemde methode: de norm ISO
      4259 (1992).


      [ref1]: https://wetten.overheid.nl/BWBR0029909#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0029916/2026-06-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0029909
        artikel: '4.2'
  - number: 5a
    text: |-
      1 Een brandstofleverancier als bedoeld in [artikel 3.3, eerste lid, van het besluit][ref1], registreert bij de
      Inspectie Leefomgeving en Transport de volgende gegevens:

      a. bedrijfsnaam zoals vermeld in het Handelsregister;

      b. naam/namen, waaronder wordt geleverd en die wordt vermeld op de brandstofleveringsnota;

      c. inschrijving in het Handelsregister;

      d. vestigingsadres;

      e. telefoonnummer.

      2 Een nieuwe brandstofleverancier registreert zich voor aanvang van zijn eerste levering van scheepsbrandstoffen
      bij de Inspectie Leefomgeving en Transport.

      3 Een brandstofleverancier waarvan een van de in het eerste lid genoemde gegevens wijzigt of bij het staken van
      leveringen van scheepsbrandstoffen, meldt dit onverwijld bij de Inspectie Leefomgeving en Transport.


      [ref1]: https://wetten.overheid.nl/BWBR0029909#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0029916/2026-06-20#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0029909
        artikel: '3.3'
  - number: 5b
    text: |-
      1 Binnen een maand na de afsluiting van elk kwartaal stuurt de leverancier, bedoeld in
      [artikel 3.3, eerste lid, van het besluit][ref1], een afschrift van de brandstofleveringsnota’s met bijlagen van
      alle leveringen aan de zeevaart in Nederland in het voorgaande kwartaal aan de Inspectie Leefomgeving en Transport.

      2 De afschriften van de brandstofleveringsnota’s zijn vergezeld van een overzicht, waarin voor elke
      brandstoflevering, onder het unieke nummer van de brandstofleveringsnota, de informatie wordt vermeld die is
      opgenomen in Aanhangsel V van Bijlage VI bij het Verdrag, aangevuld met de informatie overeenkomstig bijlage I
      van [Verordening (EU) 2023/1805](32023R1805), inclusief de samenstelling van de brandstoflevering en de ISO 8217-
      brandstofklassen.


      [ref1]: https://wetten.overheid.nl/BWBR0029909#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0029916/2026-06-20#Artikel5b
    references:
