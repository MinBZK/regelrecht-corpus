  - number: '15'
    text: |-
      1 Deze regeling treedt in werking met ingang van 1 maart 2003 en vervalt met ingang van 1 juli 2006.

      2 De regeling blijft van toepassing op de financiële afwikkeling van de op basis van deze regeling verstrekte
      subsidies.
    url: https://wetten.overheid.nl/BWBR0014717/2005-02-02#Artikel15
