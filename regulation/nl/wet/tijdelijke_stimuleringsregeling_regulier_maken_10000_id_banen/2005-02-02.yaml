  - number: '7'
    text: |-
      1 De subsidie bedraagt maximaal € 17.000 voor een reguliere dienstbetrekking met een arbeidsduur van 32 uren of
      meer per week en wordt verleend voor een tijdvak van twee jaren.

      2 De subsidie wordt naar rato van 32 uren verminderd wanneer de arbeidsduur minder dan 32 uren per week bedraagt.

      3 De subsidie wordt bij wijze van voorschot betaalbaar gesteld.

      4 Het eerste voorschot van maximaal € 10.500 wordt betaalbaar gesteld binnen 6 weken na ontvangst van de in
      [artikel 6][ref1] genoemde documenten.

      5 Het tweede voorschot van maximaal € 6.500 wordt betaalbaar gesteld binnen 6 weken na ontvangst van de in
      [artikel 9][ref2] genoemde rapportage.


      [ref1]: https://wetten.overheid.nl/BWBR0014717#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0014717#Artikel9
    url: https://wetten.overheid.nl/BWBR0014717/2005-02-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014717
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0014717
        artikel: '9'
  - number: '8'
    text: |-
      1 Indien gedurende het tijdvak van twee jaren waarin de in [artikel 2, eerste lid][ref1], bedoelde subsidie wordt
      verstrekt de reguliere dienstbetrekking wordt beëindigd, doet de werkgever hiervan zo spoedig mogelijk mededeling
      aan de minister door middel van het overleggen van een document waaruit blijkt dat de reguliere dienstbetrekking
      is beëindigd.

      2 De subsidieverlening wordt in de situatie, bedoeld in het eerste lid, verlaagd in evenredigheid met het aantal
      dagen van het subsidieverleningstijdvak waarin de dienstbetrekking niet meer wordt vervuld, tenzij de werkgever
      binnen 12 weken na de beëindiging van de reguliere dienstbetrekking ter invulling van de vrijgevallen functie in
      overleg met de gemeente een nieuwe dienstbetrekking aangaat met:

      a. een persoon aan wie een voorziening is aangeboden als bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref2], dan wel

      b. een werkloze werkzoekende.

      3 De werkgever overlegt, indien hij ter invulling van de vrijgevallen functie een nieuwe dienstbetrekking aangaat,
      aan de minister:

      a. een kopie van de voor de reguliere dienstbetrekking gesloten schriftelijke arbeidsovereenkomst
      of het op de reguliere dienstbetrekking betrekking hebbende aanstellingsbesluit, als bedoeld
      in [artikel 4, derde lid, onderdeel a][ref3], welke overeenkomst of besluit voldoet aan de in
      [artikel 6, eerste lid, onderdeel a][ref4], genoemde criteria;

      b. een verklaring van burgemeester en wethouders, door middel van een formulier dat is ingericht overeenkomstig
      het model van bijlage 4 bij deze regeling, waarin wordt bevestigd dat de werknemer voldoet aan de in het tweede lid
      gestelde criteria.

      4 Wanneer de invulling van de vrijgevallen functie, bedoeld in het tweede lid, plaatsvindt in het eerste jaar
      van het subsidieverleningstijdvak worden de in het derde lid genoemde documenten door de minister uiterlijk
      tegelijkertijd met de rapportage, bedoeld in [artikel 9][ref5], ontvangen. Wanneer de invulling van de vrijgevallen
      functie, bedoeld in het tweede lid, plaatsvindt in het tweede jaar van het subsidieverleningstijdvak worden de in
      het derde lid genoemde documenten door de minister uiterlijk tegelijkertijd met de aanvraag tot vaststelling van de
      subsidie, bedoeld in [artikel 12][ref6], ontvangen.


