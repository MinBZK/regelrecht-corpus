  - number: '9'
    text: |-
      De minister ontvangt binnen 8 weken na afloop van één jaar na de datum van de beschikking tot subsidieverlening
      een rapportage over dat tijdvak. De werkgever maakt bij deze rapportage gebruik van het formulier dat is ingericht
      overeenkomstig het als bijlage 5 bij deze regeling opgenomen model.
    url: https://wetten.overheid.nl/BWBR0014717/2005-02-02#Artikel9
  - number: '10'
    text: |-
      1 De werkgever ontvangt voor de betreffende werknemer of de reguliere dienstbetrekking
      gedurende het subsidieverleningstijdvak geen voorzieningen als bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref1].

      2 In afwijking van het eerste lid en [artikel 1, eerste lid, onderdeel c][ref2], mag de werkgever een eenmalige
      gemeentelijke subsidie ontvangen wanneer deze subsidie is verleend in aanvulling op de op basis van deze regeling
      verstrekte subsidie. Bij toepassing van dit lid door de gemeente wordt hiervan mededeling gedaan in de in bijlage 2
      genoemde verklaring van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014717#Artikel1
    url: https://wetten.overheid.nl/BWBR0014717/2005-02-02#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0014717
        artikel: '1'
  - number: '11'
    text: |-
      1 De werkgever doet gedurende het subsidieverleningstijdvak onverwijld mededeling aan de minister van wijzigingen
      in de bij de subsidieaanvraag verstrekte gegevens en overlegt op verzoek van de minister de daarop betrekking
      hebbende bescheiden. De verplichting van de eerste volzin geldt niet voor loonsverhogingen.

      2 De werkgever verstrekt desgevraagd aan de minister kosteloos alle inlichtingen die hij voor het toezicht,
      de evaluatie, informatievoorziening en beleidsvorming met betrekking tot deze regeling nodig heeft en verleent
      kosteloos inzage in de administratie inzake van belang zijnde bescheiden.

      3 De werkgever richt de administratie voor de uitvoering van deze regeling zodanig in dat alle van belang zijnde
      vastleggingen en bewijsstukken ten behoeve van het controle-, besluitvormings- en verantwoordingsproces zichtbaar,
      ordelijk en controleerbaar zijn vastgelegd. De werkgever bewaart de op de subsidieverstrekking betrekking hebbende
      administratie tot twee jaren na de datum van de beschikking tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0014717/2005-02-02#Artikel11
  - number: '12'
    text: |-
      1 De aanvraag tot vaststelling van de subsidie wordt binnen 8 weken na afloop van het tijdvak waarover de subsidie
      is verleend ontvangen door de minister. De werkgever maakt bij de aanvraag tot vaststelling van de subsidie gebruik
      van het formulier dat is ingericht overeenkomstig het model van bijlage 7 van deze regeling.

      2 De minister stelt de subsidie vast binnen 1 jaar na ontvangst van de aanvraag tot vaststelling van de subsidie.

      3 Indien de aanvraag tot vaststelling van de subsidie niet of niet tijdig is ontvangen stelt de minister de
      subsidie ambtshalve vast.
    url: https://wetten.overheid.nl/BWBR0014717/2005-02-02#Artikel12
  - number: '13'
    text: |-
      1 Met het toezicht op de naleving van deze regeling zijn belast de daartoe bij besluit van de minister aangewezen
      ambtenaren van het Agentschap SZW en de Accountantsdienst, beide onderdeel van het Ministerie van Sociale Zaken
      en Werkgelegenheid.

      2 De werkgever verleent aan de toezichthouders alle medewerking die dezen redelijkerwijs kunnen vorderen bij de
      uitoefening van hun bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0014717/2005-02-02#Artikel13
  - number: '14'
    text: |-
      De [Algemene Regeling SZW-subsidies][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009211
    url: https://wetten.overheid.nl/BWBR0014717/2005-02-02#Artikel14
