  - number: '2'
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een werkgever die een werknemer, die vóór 21 februari
      2003 werkzaam was in een ID-dienstbetrekking, in dienst neemt op basis van een reguliere dienstbetrekking voor
      onbepaalde tijd, tenzij de ingangsdatum van de reguliere dienstbetrekking ligt vóór 1 januari 2003.

      2 Geen subsidie wordt verstrekt wanneer de werkgever een natuurlijke persoon of rechtspersoon is die in het kader
      van de uitoefening van beroep of bedrijf de inschakeling van personen in het arbeidsproces bevordert.

      3 Voorts wordt met ingang van 1 januari 2004 geen subsidie verstrekt aan een werkgever die vóór 1 januari 2004
      een ID-dienstbetrekking heeft omgezet in een reguliere dienstbetrekking, tenzij het een reguliere dienstbetrekking
      betreft met de eigen werknemer die vóór 21 februari 2003 werkzaam was in een ID-dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0014717/2005-02-02#Artikel2
  - number: '3'
    text: |-
      1 Voor de verstrekking van de subsidies bedoeld in [artikel 2, eerste lid][ref1], is in totaal € 170.000.000
      beschikbaar.

      2 Voor de bepaling van het bereiken van het subsidieplafond, bedoeld in het eerste lid, worden de subsidieaanvragen
      behandeld in volgorde van ontvangst van de aanvragen. Indien de aanvrager in de gelegenheid wordt gesteld de
      onvolledige aanvraag aan te vullen, geldt voor de bepaling van het bereiken van het subsidieplafond, als datum van
      ontvangst de datum waarop de aanvraag volledig is aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0014717#Artikel2
    url: https://wetten.overheid.nl/BWBR0014717/2005-02-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014717
        artikel: '2'
  - number: '4'
    text: |-
      1 De minister ontvangt uiterlijk 30 juni 2004 de subsidieaanvraag. De werkgever maakt bij de aanvraag gebruik van
      het formulier dat is ingericht overeenkomstig het model van bijlage 1 van deze regeling.

      2 In de subsidieaanvraag vermeldt de werkgever in ieder geval:

      a. tot welke sector, zorg, jeugdhulpverlening, welzijn, onderwijs, kinderopvang, openbare veiligheid, beheer
      openbare ruimte, cultuur, sport of overige, de werkgever die de aanvraag indient gerekend wordt, dan wel indien de
      werkgever een gemeente is, de sector waartoe de in een reguliere dienstbetrekking voor onbepaalde tijd om te zetten
      ID-dienstbetrekking gerekend wordt, en

      b. de naam en de geboortedatum van de werknemer, het loon en de arbeidsduur per week van de ID-dienstbetrekking en
      het loon en de arbeidsduur per week van de overeen te komen of gekomen reguliere dienstbetrekking.

      3 In de subsidieaanvraag verklaart de werkgever in ieder geval:

      a. dat hij met een werknemer die werkzaam is in een ID-dienstbetrekking een reguliere dienstbetrekking
      voor onbepaalde tijd is aangegaan of zal aangaan, zonder daarbij een proeftijd te bedingen, welke reguliere
      dienstbetrekking uiterlijk 20 weken na de datum van de beschikking tot subsidieverlening en niet later dan op 1
      december 2004 is ingegaan of ingaat;

      b. dat van de ingangsdatum van de reguliere dienstbetrekking mededeling wordt gedaan aan de gemeente indien die, op
      grond van [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref1], een voorziening verstrekt voor
      de ID-dienstbetrekking waarin de werknemer werkzaam is opdat die voorziening door de betreffende gemeente wordt
      beëindigd uiterlijk de datum waarop de reguliere dienstbetrekking ingaat;

      c. dat het loon van de werknemer door de omzetting van de ID-dienstbetrekking in een reguliere dienstbetrekking
      niet vermindert;

      d. dat hij geen natuurlijke persoon of rechtspersoon is die in het kader van de uitoefening van beroep of bedrijf
      de inschakeling van personen in het arbeidsproces bevordert;

      e. dat aan alle in deze regeling opgenomen en in de beschikking tot subsidieverlening op te nemen voorwaarden en
      verplichtingen zal worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
