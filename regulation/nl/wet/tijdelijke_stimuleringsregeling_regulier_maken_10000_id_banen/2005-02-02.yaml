  - number: '5'
    text: Op de aanvraag voor subsidieverlening wordt binnen 8 weken na ontvangst van de aanvraag beslist.
    url: https://wetten.overheid.nl/BWBR0014717/2005-02-02#Artikel5
  - number: '6'
    text: |-
      1 De subsidie wordt verleend onder de voorwaarde dat de minister van de werkgever binnen 20 weken na de datum van
      de beschikking tot subsidieverlening, doch uiterlijk 31 januari 2005, de volgende documenten heeft ontvangen:

      a. een kopie van de voor de reguliere dienstbetrekking gesloten schriftelijke arbeidsovereenkomst
      of het op de reguliere dienstbetrekking betrekking hebbende aanstellingsbesluit, als bedoeld in
      [artikel 4, derde lid, onderdeel a][ref1], in welke documenten in ieder geval zijn opgenomen de arbeidsduur per
      week, de ingangsdatum van de dienstbetrekking, het loon, de naam van de werkgever en de naam en geboortedatum van
      de werknemer;

      b. indien de arbeidsduur per week van de om te zetten ID-dienstbetrekking hoger is dan de arbeidsduur per
      week van de reguliere dienstbetrekking: een kopie van de voor de ID-dienstbetrekking gesloten schriftelijke
      arbeidsovereenkomst of het op de ID- dienstbetrekking betrekking hebbende aanstellingsbesluit, waarin het loon
      is vermeld;

      c. een door middel van het formulier, dat is ingericht overeenkomstig het model van [bijlage 2][ref2]
      van deze regeling, opgestelde verklaring van burgemeester en wethouders dat indien op
      grond van [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref3] aan de in
      [artikel 1, eerste lid, onderdeel d, ten eerste][ref4], bedoelde werkgever een voorziening wordt
      verleend, deze is beëindigd met ingang van de datum waarop de reguliere dienstbetrekking voor onbepaalde
      tijd tussen de werkgever en de werknemer is ingegaan of zal ingaan, onder vermelding van de naam en de
      geboortedatum van de werknemer, de sector waartoe de werkgever dan wel de ID-dienstbetrekking overeenkomstig
      [artikel 4, tweede lid, onderdeel a][ref5], gerekend wordt en de arbeidsduur per week van de ID-dienstbetrekking;

      d. een begeleidingsformulier dat is ingericht overeenkomstig het model van [bijlage 3][ref6] van deze regeling.

      2 Indien de beschikking tot subsidieverlening is gedateerd na 12 november 2004 geldt, in afwijking van het eerste
      lid, dat de minister van de werkgever de in het eerste lid genoemde documenten uiterlijk 31 januari 2005 heeft
      ontvangen. Bij toepassing van de vorige volzin gaat de reguliere dienstbetrekking uiterlijk 4 weken na de datum van
      de beschikking tot subsidieverlening in.


