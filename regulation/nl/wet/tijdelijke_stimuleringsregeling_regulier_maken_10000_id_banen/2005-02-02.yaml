preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, 5 en 8, eerste lid, van de Kaderwet SZW-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014717/2005-02-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a

                *minister:*


                de Minister van Sociale Zaken en Werkgelegenheid;



              b

                *ID-dienstbetrekking:*


                een dienstbetrekking als bedoeld in [artikel 3, eerste lid, van het Besluit in- en doorstroombanen][ref1],
      zoals dit besluit luidde op 31 december 2003;



              c

                *reguliere dienstbetrekking:*


                een privaatrechtelijke of publiekrechtelijke dienstbetrekking waarvoor de werkgever geen voorziening
      ontvangt als bedoeld in [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref2];



              d

                *werkgever:*


                een publiekrechtelijk lichaam of een instelling als bedoeld in
      [artikel 1, vierde of vijfde lid van het Besluit in- en doorstroombanen][ref3],
      zoals dat besluit luidde op 31 december 2003, die ondernemer is als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Wet op de ondernemingsraden][ref4], dan wel
      een rechtspersoon waarvoor de werknemer, die een ID-dienstbetrekking heeft met de in onderdeel d, ten eerste,
      genoemde werkgever, gewoonlijk arbeid verricht.




      2 Onder een ID-dienstbetrekking wordt mede verstaan het, op grond van een ID-dienstbetrekking met een werkgever als
      bedoeld in het eerste lid, onderdeel d, ten eerste, gewoonlijk verrichten van arbeid bij een werkgever als bedoeld
      in het eerste lid, onderdeel d, ten tweede.

      3 In deze regeling wordt verstaan onder loon, hetgeen daaronder wordt verstaan in
      [artikel 9 van het Besluit in- en doorstroombanen][ref5], zoals dat luidde op 31 december 2003.


