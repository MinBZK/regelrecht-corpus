preamble:
  text: |-
    Verordening op grond van artikel 24, eerste lid, artikel 6 en artikel 86, eerste lid, van de Wet op de Accountants-
    Administratieconsulenten
  url: https://wetten.overheid.nl/BWBR0006183/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De leden van het bestuur ontvangen jaarlijks een vaste vergoeding.

      2 De vergoeding, bedoeld in het eerste lid bedraagt op jaarbasis voor:

        - de voorzitter van het bestuur € 30.815,–;
        - de plaatsvervangend voorzitter van het bestuur € 12.820,–; bij vervanging van de voorzitter voor een langere
      termijn dan één maand ontvangt de plaatsvervangend voorzitter voor de volledige vervangingsperiode naar rato de
      vergoeding toekomende aan de voorzitter in plaats van de vergoeding voor de plaatsvervangend voorzitter;
        - de overige leden van het bestuur € 4.045.

      3 Aan de voorzitters, de plaatsvervangend voorzitters of de leden van commissies of overige gremia kan het bestuur
      een jaarlijkse vaste vergoeding toekennen.
    url: https://wetten.overheid.nl/BWBR0006183/2013-01-01#Artikel1
  - number: 1a
    text: |-
      1 De leden van het bestuur hebben voor het bijwonen van hun vergaderingen of bijeenkomsten recht op presentiegeld,
      een vergoeding van reis- en verblijfkosten en een vergoeding van reistijdkosten.

      2 Het bestuur kan aan de voorzitters, de plaatsvervangend voorzitters of de leden van commissies of overige gremia
      voor het bijwonen van hun vergaderingen of bijeenkomsten het recht op presentiegeld, een vergoeding van reis- en
      verblijfkosten en een vergoeding van reistijdkosten toekennen.

      3 Het presentiegeld bedraagt € 235,– per dagdeel en ten hoogste € 470,– per dag.

      4 Een dagdeel omvat een tijdsperiode van vier uur.

      5 De reiskostenvergoeding bedraagt € 0,28 per kilometer.

      6 De reistijdkostenvergoeding bedraagt € 0,75 per kilometer boven een totale reisafstand van honderd kilometer.

      7 Parkeer-, tol- en veergelden worden geacht te zijn begrepen in de reiskostenvergoeding bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0006183/2013-01-01#Artikel1a
  - number: '2'
    text: |-
      1 Als reiskosten en reistijdkosten worden ten hoogste vergoed de kosten voor de reiziger om langs de kortste weg
      van zijn woon- of verblijfplaats te komen naar zijn plaats van bestemming en terug, voor zover zij werkelijk zijn
      gemaakt.

      2 Voor buitenlandse reizen met vervoermiddelen anders dan de personenauto, worden de vervoerbewijzen verzorgd door
      het bureau van de NOvAA.

      3 Het bestuur stelt vast met welk vervoermiddel buitenlandse reizen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0006183/2013-01-01#Artikel2
  - number: '3'
    text: |-
      Als verblijfkosten worden vergoed de werkelijk gemaakte kosten voor consumpties, maaltijden en overnachting,
      voorzover deze kosten binnen de grenzen van de redelijkheid zijn gebleven en naar het oordeel van het bestuur
      noodzakelijk waren.
    url: https://wetten.overheid.nl/BWBR0006183/2013-01-01#Artikel3
  - number: '4'
    text: |-
      1 Declaraties voor vergoedingen als bedoeld in [artikel 1a][ref1] en [artikel 3][ref2] moeten uiterlijk binnen één
      maand na afloop van het kwartaal waarin deze kosten zijn gemaakt bij het bureau van de NOvAA worden ingediend.

      2 Het bestuur kan verlangen dat aan hem bewijsstukken worden overgelegd waaruit de juistheid van de ingediende
      declaratie blijkt.

      3 Door anderen voor hetzelfde doel of dezelfde activiteit uitgekeerde vergoedingen, worden in mindering gebracht op
      de vergoeding die de NOvAA toekent.


      [ref1]: https://wetten.overheid.nl/BWBR0006183#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0006183#Artikel3
    url: https://wetten.overheid.nl/BWBR0006183/2013-01-01#Artikel4
