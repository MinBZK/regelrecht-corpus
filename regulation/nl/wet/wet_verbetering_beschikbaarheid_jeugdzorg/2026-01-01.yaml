  - number: VIII
    text: |-
      [Artikel 2.19, eerste lid, onderdeel a][ref1], heeft geen gevolgen voor contracten, nog niet overeengekomen
      verlenging van die contracten daaronder niet begrepen, die zijn afgesloten of subsidies die zijn verleend
      voorafgaand aan de datum waarop het in [artikel I, onderdeel G][ref2], voorziene artikel 2.19 van de Jeugdwet in
      werking treedt.


