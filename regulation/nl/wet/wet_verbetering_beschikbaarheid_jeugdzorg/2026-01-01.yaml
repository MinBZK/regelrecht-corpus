preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo, Wij in overweging genomen hebben, dat het wenselijk is de Jeugdwet, de Wet marktordening gezondheidszorg
    en enige andere wetten te wijzigen teneinde te bevorderen dat jeugdhulp en gecertificeerde instellingen voor de
    uitvoering van kinderbeschermingsmaatregelen en jeugdreclassering steeds voldoende beschikbaar zijn en om in het
    kader daarvan onder meer de zorgautoriteit te belasten met het verrichten van onderzoek naar de beschikbaarheid
    van jeugdzorg, met het vroegtijdig signaleren van risico’s voor die beschikbaarheid, alsmede met het houden van
    toezicht op de nakoming van de artikelen 4.5.1 en 4.5.2 van de Jeugdwet;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0051641/2026-01-01#ArtikelAanhef
articles:
  - number: VII
    text: |-
      1 Onze Ministers zenden binnen vijf jaar een verslag over de doeltreffendheid en de effecten in de praktijk van het
      bij of krachtens deze wet bepaalde en rapporteren hier vervolgens elke twee jaar over.

      2 Het verslag, bedoeld in het eerste lid, wordt uitgevoerd door een onafhankelijke commissie bestaande
      uit deskundigen op het gebied van jeugdzorg, bestuurskunde en jeugdrecht, alsmede vertegenwoordigers van
      cliëntenorganisaties en gemeenten.

      3 In het verslag en de rapportages, bedoeld in het eerste lid, wordt beoordeeld of:

      a. De mate waarin deze wet daadwerkelijk bijdraagt aan het bevorderen van een toereikend aanbod van de vormen van
      jeugdhulp als bedoeld in [artikel 2.19, eerste lid, onderdeel a, onder 1°][ref1], en gecertificeerde instellingen
      voor de uitvoering van kinderbeschermingsmaatregelen en jeugdreclassering;

      b. De impact van deze wet op wachttijden, de toegankelijkheid en de kwaliteit van de vormen van jeugdhulp als
      bedoeld in [artikel 2.19, eerste lid, onderdeel a, onder 1°][ref2] en gecertificeerde instellingen;

      c. De administratieve lasten voor gemeenten, jeugdhulpaanbieders en gecertificeerde instellingen;

      d. De financiële gevolgen van deze wet, en

      e. De ervaringen van jeugdigen en gezinnen met de beschikbaarheid en kwaliteit van de vormen van jeugdhulp als
      bedoeld in [artikel 2.19, eerste lid, onderdeel a, onder 1°][ref3] en gecertificeerde instellingen.

      4 Indien uit twee opeenvolgende rapportages blijkt dat de beoogde doelen van deze wet niet worden behaald en
      er geen significant positieve impact wordt vastgesteld, informeren Onze Ministers, in overeenstemming met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties beide Kamers der Staten-Generaal zo spoedig mogelijk over de
      mogelijk benodigde maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2.19
