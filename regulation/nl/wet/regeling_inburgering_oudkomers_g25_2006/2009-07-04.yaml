  - number: '7'
    text: |-
      1 Het college aan wie voorschotten als bedoeld in artikel 3 zijn verleend, verstrekt de Minister de informatie
      over de gegevens die in de monitor worden gevraagd, uiterlijk 1 april 2007 over de periode 1 januari tot en met 31
      december 2006, en 1 april 2008 over de periode 1 januari tot en met 31 december 2007.

      2 In de monitor worden ten minste de volgende prestatiegegevens gevraagd:

      a. het aantal oudkomers met wie in 2006 een overeenkomst als bedoeld in [artikel 5][ref1] is gesloten;

      b. het aantal oudkomers dat een inburgeringsprogramma heeft afgerond;

      c. het aantal oudkomers dat een inburgeringsprogramma voortijdig heeft beëindigd;

      d. het niveau Nederlands als tweede taal van de oudkomers, bedoeld in onderdeel b, bij afronding van
      het inburgeringsprogramma ten opzichte van het niveau Nederlands als tweede taal bij de aanvang van het
      inburgeringsprogramma.

      3 De verstrekte informatie, bedoeld in het eerste lid, heeft alleen betrekking op inburgeringsprogramma’s die
      geheel of gedeeltelijk zijn bekostigd door de bijdrage.

      4 De verstrekte informatie, bedoeld in het eerste lid, is voorzien van een verklaring omtrent de getrouwheid,
      afgegeven door een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].

      5 Ten behoeve van de verklaring omtrent de getrouwheid, bedoeld in het vierde lid, stelt de Minister een
      controleprotocol vast.

      6 Het college draagt er zorg voor dat de door hem ingeschakelde accountant meewerkt aan de door of namens de
      auditdienst van het Ministerie van Justitie in te stellen onderzoeken naar de verrichte controlewerkzaamheden door
      die accountant. De daaraan verbonden kosten zijn inbegrepen in de bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0019119#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
