  - number: '2'
    text: |-
      1 De Minister kan aan een gemeente, onder de in deze regeling genoemde voorwaarden, een financiële bijdrage
      verlenen teneinde de gemeente in staat te stellen oudkomers die in een maatschappelijke achterstandssituatie
      verkeren, waaronder in het bijzonder diegenen die behoren tot de groep werklozen, opvoeders of geestelijk
      bedienaren, deel te laten nemen aan een inburgeringsprogramma en dit inburgeringsprogramma te laten afronden.

      2 De bijdrage wordt beschikbaar gesteld onder voorbehoud van autorisatie door de begrotingswetgever.
    url: https://wetten.overheid.nl/BWBR0019119/2009-07-04#Artikel2
  - number: '3'
    text: |-
      1 Indien een gemeente in aanmerking wenst te komen voor verlening van een bijdrage, dient het college binnen zes
      weken na inwerkingtreding van deze regeling een aanvraag in. De aanvraag gaat vergezeld van de prognose.

      2 De Minister beoordeelt alle ingediende aanvragen gezamenlijk en verleent per aanvraag voorschotten op de
      bijdrage. Het voorschot met betrekking tot de periode van 1 januari tot en met 30 juni 2006 wordt vastgesteld aan
      de hand van de in het derde lid genoemde verdeelsleutel. Het voorschot met betrekking tot de periode van 1 juli tot
      en met 31 december 2006 wordt ambtshalve vastgesteld.

      3 Het voorschot met betrekking tot de periode van 1 januari tot en met 30 juni 2006 wordt per gemeente met
      inachtneming van de prognose en de in [bijlage 1][ref1] bij die gemeente genoemde indicatieve bijdrage als volgt
      vastgesteld:

      a. indien de prognose overeenkomt met het in [bijlage 1][ref2] bij die gemeente genoemde aantal oudkomers, is het
      voorschot met betrekking tot de periode van 1 januari tot en met 30 juni 2006 gelijk aan de in [bijlage 1][ref3]
      bij die gemeente genoemde indicatieve bijdrage;

      b. indien de prognose lager is dan het in [bijlage 1 ][ref4]bij die gemeente genoemde aantal oudkomers, is het
      voorschot met betrekking tot de periode van 1 januari tot en met 30 juni 2006 gelijk aan de naar evenredigheid
      verlaagde in bijlage 1 bij die gemeente genoemde indicatieve bijdrage;

      c. indien de prognose hoger is dan het in de [bijlage][ref5] bij die gemeente genoemde aantal oudkomers, is het
      voorschot met betrekking tot de periode van 1 januari tot en met 30 juni 2006 gelijk aan:

      1°. de naar evenredigheid verhoogde in [bijlage 1][ref6] bij die gemeente genoemde indicatieve bijdrage indien het
      budget toereikend is;

      2°. de in [bijlage 1][ref7] genoemde indicatieve bijdrage, vermeerderd met een aanvullend bedrag indien het budget
      niet toereikend is; de hoogte van dit aanvullende bedrag is afhankelijk van de verdeling van de nog uit het budget
      resterende middelen naar evenredigheid van het totaal aantal oudkomers, genoemd in [bijlage 1][ref8].

      4 De beschikking tot verlening van het voorschot met betrekking tot de periode van 1 januari tot en met 30 juni
      2006 wordt binnen tien weken na inwerkingtreding van deze regeling aan het college bekendgemaakt.

      5 De beschikking tot verlening van het voorschot met betrekking tot de periode van 1 juli tot en met 31 december
      2006 wordt voor 1 juli 2006 aan het college bekendgemaakt.


