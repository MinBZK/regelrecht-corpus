  - number: '8'
    text: |-
      1 De Minister stelt de bijdrage vast aan de hand van de in [artikel 7, eerste lid][ref1], bedoelde informatie en de
      in [artikel 7, vierde lid][ref2], bedoelde verklaring omtrent de getrouwheid.

      2 De bijdrage voor een gemeente bedraagt:

      a. € 2.667 voor iedere oudkomer met wie in 2006 een overeenkomst als bedoeld in [artikel 5][ref3] is gesloten; en

      b. € 5.333 voor iedere oudkomer die, evenals het college, aan de verplichtingen, genoemd in de overeenkomst,
      bedoeld in [artikel 5][ref4], heeft voldaan en die een begintoets en uiterlijk 31 december 2007 een eindtoets als
      bedoeld in [artikel 6][ref5] is afgenomen.

      3 Het aantal oudkomers dat de Minister bij het vaststellen van de bijdrage betrekt, kan het in de voorschotten
      genoemde aantal oudkomers niet overtreffen.


