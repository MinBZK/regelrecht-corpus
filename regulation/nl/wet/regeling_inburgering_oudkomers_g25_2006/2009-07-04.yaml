  - number: '9'
    text: |-
      1 De Minister stelt de bijdrage uiterlijk 1 juli 2008 vast.

      2 De overeenkomstig [artikel 8, tweede lid][ref1], vastgestelde bijdrage voor een gemeente wordt binnen 12 maanden
      na de vaststelling ervan betaald.

      3 Indien de verleende voorschotten hoger zijn dan de vastgestelde bijdrage, is de Minister bevoegd het verschil
      terug te vorderen.


