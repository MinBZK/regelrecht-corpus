  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister voor Vreemdelingenzaken en Integratie;

      b. gemeente: een gemeente welke is genoemd in [bijlage 1][ref1] van deze regeling;

      c. college: het college van burgemeesters en wethouders van een gemeente;

      d. oudkomer:

      1°. een persoon die 18 jaar of ouder is, die buiten Nederland is geboren en behoort tot een etnische
      minderheidsgroep, die rechtmatig in Nederland verblijft anders dan voor een tijdelijk doel als bepaald
      bij of krachtens de [Wet inburgering nieuwkomers][ref2], en die niet verplicht is om op grond van de
      [Wet inburgering nieuwkomers][ref3] een inburgeringsprogramma te volgen;

      2°. een geestelijk bedienaar als bedoeld in de
      [Regeling aanwijzing bijzondere categorieën vreemdelingen ten behoeve van inburgering][ref4], die niet verplicht
      is om op grond van de[ Wet inburgering nieuwkomers][ref5] een inburgeringsprogramma te volgen;

      e. inburgeringsprogramma: een programma dat de oudkomer volgt waarbij het onderdeel Nederlands als tweede taal
      wordt gekoppeld aan onderdelen voor het bereiken van werk, toegang tot beroepsonderwijs, opvoedingsondersteuning of
      sociale activering;

      f. bijdrage: de financiële bijdrage, bedoeld in [artikel 2][ref6];

      g. prognose: het aantal oudkomers dat naar de verwachting van het college in de periode van 1 januari tot en met 30
      juni 2006 zal aanvangen met een inburgeringsprogramma;

      h. budget: het door de Minister vastgestelde budget dat beschikbaar is voor de bevoorschotting van gemeenten ten
      behoeve van de periode van 1 januari tot en met 30 juni 2006;

      i. monitor: het door de Minister vastgestelde model-document aan de hand waarvan het college de Minister informatie
      verschaft over de wijze waarop de gemeente invulling heeft gegeven aan de inburgering van oudkomers en de
      resultaten ervan en aan de hand waarvan de hoogte van de bijdrage wordt vastgesteld.


