  - number: '4'
    text: |-
      1 Het college stelt het inburgeringsprogramma vast, waarbij zoveel mogelijk wordt aangesloten bij de persoonlijke
      situatie van de desbetreffende oudkomer.

      2 Het inburgeringsprogramma vangt aan in 2006 en is op uiterlijk 31 december 2007 afgerond.

      3 Het college draagt er zorg voor dat een inburgeringsprogramma ten minste 300 contacturen omvat.

      4 Als normbedrag voor een inburgeringsprogramma geldt een bedrag van € 6.400.
    url: https://wetten.overheid.nl/BWBR0019119/2009-07-04#Artikel4
  - number: '5'
    text: |-
      1 Het college sluit een overeenkomst met de oudkomer die een inburgeringsprogramma gaat volgen. De datum van
      ondertekening van de overeenkomst geldt als aanvangsdatum van het inburgeringsprogramma.

      2 De overeenkomst bevat ten minste bepalingen met betrekking tot:

      a. het doel van het inburgeringsprogramma;

      b. de onderdelen van het inburgeringsprogramma;

      c. het aantal contacturen van het inburgeringsprogramma;

      d. de aard en de omvang van de individuele begeleiding;

      e. de verplichtingen van het college;

      f. de verplichtingen van de oudkomer;

      g. de informatieoverdracht tussen het college, de bij het aanbieden van het inburgeringsprogramma betrokken
      instellingen en de oudkomer met betrekking tot de voortgang van het inburgeringsprogramma;

      h. de gevolgen welke zijn verbonden aan niet-nakoming van de overeenkomst door de oudkomer.

      3 Het college sluit op grond van deze regeling met een oudkomer slechts één overeenkomst.
    url: https://wetten.overheid.nl/BWBR0019119/2009-07-04#Artikel5
  - number: '6'
    text: |-
      1 Het college draagt er zorg voor dat de oudkomer met wie een overeenkomst als bedoeld in [artikel 5][ref1] is
      gesloten een begintoets en een eindtoets aflegt aan de hand waarvan het niveau Nederlands als tweede taal van de
      oudkomer wordt vastgesteld.

      2 Voor de begintoets en de eindtoets wordt uitsluitend gebruik gemaakt van de hierna volgende combinaties van
      toetsen:

      a. de Intaketoets NT2 als begintoets met de NT2-Profieltoets als eindtoets; of

      b. de Intaketoets Alfabetisering NT2 als begintoets met de NT2-Profieltoets Alfabetisering als eindtoets.


      [ref1]: https://wetten.overheid.nl/BWBR0019119#Artikel5
