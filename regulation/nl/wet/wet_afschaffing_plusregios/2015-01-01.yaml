preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de verplichte samenwerking in plusregio’s te
    beëindigen, de bevoegdheden van deze regio’s te verdelen over provincies en gemeenten en daartoe de Wet
    gemeenschappelijke regelingen en enkele andere wetten te wijzigen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      De [Wijzigingswet Wgr-plus][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0019114
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0019114
  - number: XXII.1
    text: |-
      De gemeenten die deelnemen aan een gemeenschappelijke regeling waarbij een plusregio is ingesteld,
      dragen er zorg voor dat de desbetreffende gemeenschappelijke regeling binnen een jaar na de datum
      van inwerkingtreding van deze wet wordt opgeheven met toepassing van de bepalingen die ingevolge
      [artikel 9, eerste en tweede lid, van de Wet gemeenschappelijke regelingen][ref1] in de regeling zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel9
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXII
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '9'
  - number: XXII.2
    text: |-
      In afwijking van het eerste lid kunnen de gemeenten de gemeenschappelijke regeling voortzetten. Zij
      brengen de regeling binnen een jaar na de datum van inwerkingtreding van deze wet in overeenstemming met de
      [Wet gemeenschappelijke regelingen][ref1], zoals deze komt te luiden na inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXII
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: XXII.3
    text: |-
      [Paragraaf 3][ref1] en [5 van Hoofdstuk XI van de Wet gemeenschappelijke regelingen][ref2], zoals deze luidden op
      de dag voorafgaand aan de datum van inwerkingtreding van deze wet, blijven van toepassing op een gemeenschappelijke
      regeling waarbij een plusregio is ingesteld, zolang de regeling niet overeenkomstig het eerste of tweede lid is
      beëindigd of gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXII
    references:
      - id: ref1
        bwb_id: BWBR0003740
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003740
        paragraaf: '5'
  - number: XXIII.1
    text: |-
      De huisvestingsverordeningen, bedoeld in [artikel 2, derde lid, van de Huisvestingswet][ref1], die
      op het tijdstip van inwerkingtreding van deze wet van kracht zijn in plusregio’s als bedoeld in
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref2], blijven in de dienovereenkomstige gebieden
      van kracht tot het moment waarop de gemeenschappelijke regeling waarbij de plusregio is ingesteld, krachtens
      [artikel XVII, eerste lid][ref3], is beëindigd met dien verstande dat de verordeningen uiterlijk een jaar na
      inwerkingtreding van deze wet vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel104
      [ref3]: https://wetten.overheid.nl/BWBR0036043#ArtikelXVII
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXIII
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '104'
      - id: ref3
        bwb_id: BWBR0036043
        artikel: XVII
        hoofdstuk: '2'
  - number: XXIII.2
    text: |-
      De vervaltermijn, bedoeld in het eerste lid, treedt in voorkomende gevallen in de plaats van de termijnen waarop de
      verordeningen zouden zijn vervallen, indien de plusregio zou hebben voortbestaan.
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXIII
  - number: XXIII.3
    text: |-
      Gedurende de periode dat de huisvestingsverordeningen van kracht zijn, kan het algemeen bestuur van een voormalige
      plusregio deze wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXIII
  - number: XXIV.1
    text: |-
      De besluiten die op grond van [artikel 107, eerste lid, van de Provinciewet][ref1], zoals dat luidde op de
      dag voorafgaand aan de datum van inwerkingtreding van deze wet, zijn genomen in verband met de overdracht van
      bevoegdheden inzake de uitvoering van de provinciale taken in het kader van de jeugdzorg blijven van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel107
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXIV
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '107'
  - number: XXIV.2
    text: |-
      De termijn genoemd in [artikel XXII, eerste en tweede lid][ref1], vangt voor de plusregio waarvan de gemeente
      Amsterdam, Rotterdam onderscheidenlijk ’s-Gravenhage deel uitmaakt aan op een bij koninklijk besluit te bepalen
      tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0036043#ArtikelXXII
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXIV
    references:
      - id: ref1
        bwb_id: BWBR0036043
        artikel: XXII
        hoofdstuk: '4'
  - number: XXV.1
    text: 'Bijdragen, subsidies en uitkeringen die zijn verleend of verstrekt aan een plusregio op grond van:'
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXV
  - number: XXV.1.a
    text: |-
      [artikel 28 van de Wet bereikbaarheid en mobiliteit][ref1];


