  - number: XXV.2
    text: |-
      De gemeenten, bedoeld in [artikel XXII, eerste lid][ref1], verstrekken, desgevraagd aan
      gedeputeerde staten en de dagelijkse besturen van een openbaar lichaam als bedoeld in
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref2], alle voor de uitoefening van de rechten en
      verplichtingen, bedoeld in het eerste lid, benodigde inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0036043#ArtikelXXII
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXV
    references:
      - id: ref1
        bwb_id: BWBR0036043
        artikel: XXII
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '20'
  - number: XXV.3
    text: |-
      De gemeenten, bedoeld in [artikel XXII, eerste lid][ref1], verstrekken een overzicht van de
      verplichtingen en de bestuurlijke afspraken die met het oog op de gereserveerde bedragen, bedoeld in
      [artikel 9 van de Wet BDU verkeer en vervoer][ref2], zijn aangegaan en dragen zorg voor de overdracht van deze
      gereserveerde bedragen aan gedeputeerde staten of, indien van toepassing, aan de dagelijkse besturen van een
      openbaar lichaam als bedoeld in [artikel 20, derde lid, Wet personenvervoer 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0036043#ArtikelXXII
      [ref2]: https://wetten.overheid.nl/BWBR0017828#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXV
    references:
      - id: ref1
        bwb_id: BWBR0036043
        artikel: XXII
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0017828
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '20'
  - number: XXV.4
    text: |-
      De [artikelen 9 tot en met 14 van de Wet BDU verkeer en vervoer][ref1] zoals deze luidden op de dag voorafgaand
      aan de datum van inwerkintreding van deze wet, blijven van toepassing op de voor inwerkingtreding van deze
      wet verstrekte uitkeringen, met dien verstande dat in [artikel 11][ref2] telkens voor «plusregio» moet worden
      gelezen: provincie waarin de plusregio is gelegen of, indien van toepassing, openbaar lichaam als bedoeld in
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0017828#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXV
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0017828
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0011470
        artikel: '20'
  - number: XXV.5
    text: |-
      In afwijking van [artikel 3, eerste lid, van de Wet BDU verkeer en vervoer][ref1] kan de verstrekking van de
      brede doeluitkering voor het uitkeringsjaar waarin deze wet in werking treedt, plaatsvinden in het jaar waarop de
      uitkering betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel3
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXV
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '3'
  - number: XXVI
    text: |-
      Concessies die door de dagelijkse besturen van de plusregio’s zijn verleend op grond van
      [artikel 20, tweede of derde lid, van de Wet personenvervoer 2000][ref1], zoals dit luidde op de dag voorafgaand
      aan de datum van inwerkingtreding van deze wet, worden met ingang van de datum van inwerkingtreding van deze wet
      geacht te zijn verleend door de krachtens artikel 20, tweede, derde of vierde lid, van de Wet personenvervoer 2000
      bevoegde concessieverleners.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXVI
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
  - number: XXVII
    text: |-
      Regionale verkeer- en vervoerplannen die door de plusregio’s zijn vastgesteld op grond van
      [artikel 16 van de Planwet verkeer en vervoer][ref1], zoals dit artikel luidde op de dag voorafgaand
      aan de datum van inwerkingtreding van deze wet worden geacht te zijn vastgesteld door gedeputeerde
      staten of, indien van toepassing, door het dagelijks bestuur van een openbaar lichaam als bedoeld in
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXVII
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0011470
        artikel: '20'
  - number: XXVIII
    text: 'Na de inwerkingtreding van deze wet:'
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXVIII
  - number: XXVIII.a
    text: |-
      berust het [Besluit aanwijzing bevoegdgezaggemeenten Wet bodembescherming][ref1] op
      [artikel 88, vijfde lid, van de Wet bodembescherming][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011935
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel88
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXVIII
    references:
