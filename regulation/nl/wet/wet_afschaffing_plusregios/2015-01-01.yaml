      zoals dat luidde op de dag voorafgaand aan de datum van inwerkingtreding van deze wet op artikel 20, vierde lid,
      van de Wet personenvervoer 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0036043/2015-01-01#ArtikelXXVIII
