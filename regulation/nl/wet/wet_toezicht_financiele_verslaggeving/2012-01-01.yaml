  - number: '5'
    text: |-
      1 De Autoriteit Financiële Markten houdt een register waarin worden opgenomen:

      a. de ingevolge [artikel 3, tweede lid][ref1], bij de Autoriteit Financiële Markten gedeponeerde berichten;

      b. het ingevolge [artikel 4, vierde lid][ref2], ter openbare kennis gebrachte feit dat een verzoek is gedaan; en

      c. afschriften van de beschikkingen, bedoeld in [artikel 453][ref3]
      of [455 van Boek 2 van het Burgerlijk Wetboek][ref4], alsmede afschriften van uitspraken van beroep in cassatie
      tegen de eerstgenoemde beschikkingen.

      2 De Autoriteit Financiële Markten draagt zorg voor het goed functioneren van het register.

      3 De Autoriteit Financiële Markten houdt de gegevens in het register voor een ieder kosteloos ter inzage.

      4 Binnen vijf werkdagen volgend op de werkdag waarop de Autoriteit Financiële Markten de stukken, berichten
      of afschriften heeft ontvangen of het feit, bedoeld in onderdeel c van het eerste lid, ter openbare kennis is
      gebracht, neemt zij deze op in het register.

      5 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:

      a. de inrichting en werking van het register en de wijze waarop wijzigingen in het register kunnen worden
      aangebracht, en

      b. de wijze waarop de in het register op te nemen stukken of berichten aan de Autoriteit Financiële Markten worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel453
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel455
