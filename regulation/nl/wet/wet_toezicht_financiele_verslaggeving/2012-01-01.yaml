  - number: '8'
    text: |-
      De Autoriteit Financiële Markten werkt, wat betreft het toezicht ingevolge deze wet op de
      financiële verslaggeving van banken, verzekeraars of beleggingsondernemingen als bedoeld in
      [artikel 1:1 van Wet op het financieel toezicht][ref1], samen met de Nederlandsche Bank N.V., voorzover dit voor de
      uitoefening van het toezicht noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
    url: https://wetten.overheid.nl/BWBR0020369/2012-01-01#Artikel8
