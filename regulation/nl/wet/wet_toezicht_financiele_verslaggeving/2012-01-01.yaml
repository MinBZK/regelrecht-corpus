  - number: 1a
    text: |-
      1 Deze wet is niet van toepassing op effectenuitgevende instellingen die uitsluitend obligaties of effecten zonder
      aandelenkarakter als bedoeld in [artikel 5:1, onderdeel e, van de Wet op het financieel toezicht][ref1] uitgeven
      met een nominale waarde per eenheid van ten minste € 50 000.

      2 Deze wet is niet van toepassing op effectenuitgevende instellingen met zetel in een door Onze Minster aangewezen
      staat die geen lidstaat is en die op grond van [artikel 5:25v van de Wet op het financieel toezicht][ref2]
      hun financiële verslaggeving opmaken overeenkomstig de in die staat geldende wettelijke voorschriften met
      betrekking tot financiële verslaggeving. Onze Minister kan een staat uitsluitend aanwijzen indien het in die
      staat uitgeoefende toezicht op de naleving van de in de vorige volzin bedoelde wettelijke voorschriften voldoende
      waarborgen biedt ter bescherming van de belangen die deze wet beoogt te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel51
