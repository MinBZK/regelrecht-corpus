      Gegevens en inlichtingen die aan de Autoriteit Financiële Markten zijn verstrekt op grond van
      [artikel 2, eerste lid][ref1], of [artikel 452, eerste of vierde lid, van Boek 2 van het Burgerlijk Wetboek][ref2],
      worden door de Autoriteit Financiële Markten alleen gebruikt voor de uitoefening van bevoegdheden uit hoofde van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel452
