        artikel: '18'
        hoofdstuk: '5'
  - number: '14'
    text: |-
      1 De Autoriteit Financiële Markten stelt jaarlijks een jaarverslag op. Het jaarverslag beschrijft de
      taakuitoefening en het daartoe gevoerde beleid uit hoofde van deze wet in het voorafgaande jaar. Het jaarverslag
      beschrijft voorts het gevoerde beleid met betrekking tot de kwaliteitszorg.

      2 De Autoriteit Financiële Markten zendt het jaarverslag voor 1 mei aan Onze Minister. Onze Minister zendt een
      afschrift van het jaarverslag aan de Tweede Kamer der Staten-Generaal.

      3 De Autoriteit Financiële Markten houdt het jaarverslag op elektronische wijze ter inzage.
    url: https://wetten.overheid.nl/BWBR0020369/2012-01-01#Artikel14
  - number: '15'
    text: |-
      1 De Autoriteit Financiële Markten legt een voorgenomen statutenwijziging ter voorafgaande instemming voor aan Onze
      Minister. De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige
      toepassing.

      2 De instemming, bedoeld in het eerste lid, kan worden geweigerd:

      a. indien de statuten na wijziging onvoldoende zijn afgestemd op het in deze wet bepaalde;

      b. indien de statuten onvoldoende waarborgen bieden voor een onafhankelijke taakvervulling door de Autoriteit
      Financiële Markten;

      c. wegens strijd met het recht of het algemeen belang.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
    url: https://wetten.overheid.nl/BWBR0020369/2012-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:28
  - number: '16'
    text: |-
      1 De Autoriteit Financiële Markten draagt met betrekking tot de uitoefening van haar taak op grond van deze wet
      zorg voor:

      a. een tijdige voorbereiding en uitvoering;

      b. de kwaliteit van de daarbij gebruikte procedures;

      c. de zorgvuldige behandeling van een ieder die met haar in aanraking komt;

      d. de zorgvuldige behandeling van klachten die worden ontvangen.

      2 De Autoriteit Financiële Markten treft voorzieningen, waardoor ieder die met haar in aanraking komt in de
      gelegenheid is voorstellen tot verbetering van werkwijzen en procedures te doen.

      3 In het jaarverslag, bedoeld in [artikel 14][ref1], doet de Autoriteit Financiële Markten verslag van hetgeen tot
      uitvoering van het eerste en het tweede lid is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel14
    url: https://wetten.overheid.nl/BWBR0020369/2012-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '14'
        hoofdstuk: '5'
  - number: '17'
    text: |-
      1 De Autoriteit Financiële Markten stelt een orgaan in voor overleg over:

      a. de door de Autoriteit Financiële Markten op te stellen begroting;

      b. de door de Autoriteit Financiële Markten gerealiseerde baten en lasten alsmede inkomsten en uitgaven, en
      verrichte werkzaamheden;

      c. de kosten voor effectenuitgevende instellingen die verband houden met de uitoefening van haar taak op grond van
      deze wet en daaruit voortvloeiende werkzaamheden.

      2 Het overleg wordt gevoerd door de Autoriteit Financiële Markten en een representatieve vertegenwoordiging
      van effectenuitgevende instellingen. De Autoriteit Financiële Markten kan tevens daarvoor in aanmerking komende
      organisaties van belanghebbenden toelaten tot het overleg. Onze Minister wijst ambtenaren aan die namens hem het
      overleg bijwonen.

      3 Het overleg vindt tweemaal per jaar plaats.

      4 De Autoriteit Financiële Markten maakt het verslag van het overleg binnen een redelijke termijn na het overleg
      openbaar.
    url: https://wetten.overheid.nl/BWBR0020369/2012-01-01#Artikel17
  - number: '18'
    text: |-
      1 De Autoriteit Financiële Markten brengt de kosten van de werkzaamheden die zij verricht in verband met de
      uitoefening van haar taak op grond van deze wet in rekening bij de effectenuitgevende instellingen voor zover
      deze kosten niet ten laste komen van de Rijksbegroting. Tot de kosten behoren onder meer de kosten die zij ter
      voorbereiding op de uitvoering van nieuwe onderdelen van haar taak heeft gemaakt, voordat deze taak aan haar werd
      opgedragen.

      2 De kosten worden gebaseerd op de begroting waarmee Onze Minister heeft ingestemd en op het
      exploitatiesaldo, indien Onze Minister heeft ingestemd met de jaarrekening waarin een voorstel als bedoeld in
      [artikel 13, tweede lid][ref1], is opgenomen.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid. Daarbij kan onderscheid worden gemaakt tussen incidenteel en jaarlijks in rekening te brengen kosten
      en kan tevens worden voorzien in een bevoegdheid voor de Autoriteit Financiële Markten om in bepaalde gevallen
      kosten niet of niet geheel in rekening te brengen indien het volledig in rekening brengen van de kosten zou
      leiden tot een onbillijkheid van overwegende aard. Deze regels hebben onder meer betrekking op de toerekening van
      toezichthandelingen aan ondernemingen.

      4 Bij ministeriële regeling worden de tarieven vastgesteld op basis waarvan de kosten, bedoeld in het eerste tot en
      met het derde lid, worden doorberekend.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel13
    url: https://wetten.overheid.nl/BWBR0020369/2012-01-01#Artikel18
