  - number: '2'
    text: |-
      1 Indien de Autoriteit Financiële Markten op grond van openbare feiten of omstandigheden redenen heeft voor twijfel
      of de financiële verslaggeving, of een onderdeel daarvan, van een effectenuitgevende instelling voldoet aan de
      daaraan ingevolge artikel 3 van de IAS-verordening , [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1], of de
      [artikelen 5:25c, tweede, vierde of vijfde lid][ref2], [5:25d, tweede of vierde tot en met tiende lid][ref3], of
      [artikel 5:25v, eerste lid, van de Wet op het financieel toezicht][ref4] gestelde voorschriften, kan zij van deze
      instelling ter aanvulling van de financiële verslaggeving om een nadere toelichting omtrent de toepassing van die
      voorschriften verzoeken. Deze nadere toelichting wordt verstrekt binnen een door de Autoriteit Financiële Markten
      te stellen redelijke termijn.

      2 De Autoriteit Financiële Markten is verplicht tot geheimhouding van het in het eerste lid bedoelde verzoek en de
      naar aanleiding daarvan verstrekte nadere toelichting.

      3 Het eerste lid is niet van toepassing ten aanzien van de accountantsverklaring, bedoeld in
      [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref5] dan wel de verklaring van de accountant,
      bedoeld in [artikel 5:25c, vierde lid, van de Wet op het financieel toezicht][ref6] of de verklaring of beoordeling
      van de accountant, bedoeld in [artikel 5:25d, derde lid, van die wet][ref7].

      4 Het eerste lid en de [artikelen 3][ref8] en [4][ref9] zijn niet van toepassing op belegginginstellingen als
      bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref10] waarvan de rechten van deelneming op verzoek
      van de deelnemers ten laste van de activa direct of indirect worden ingekocht of terugbetaald.

      5 Het bepaalde ingevolge dit artikel en de [artikelen 3][ref11] en [4][ref12] is van overeenkomstige toepassing
      op jaarrekeningen, jaarverslagen en de daaraan toe te voegen gegevens van een effectenuitgevende instelling die
      ingevolge [artikel 394, tweede lid, van Boek 2 van het Burgerlijk Wetboek][ref13] openbaar zijn gemaakt.


