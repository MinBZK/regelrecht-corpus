  - number: '30'
    text: |-
      1 Binnen zes weken na het tijdstip van inwerkingtreding van deze wet zendt de Autoriteit Financiële Markten ter
      instemming aan Onze Minister een begroting van de in het resterende deel van het kalenderjaar te verwachten baten
      en lasten, investeringsuitgaven alsmede inkomsten en uitgaven met betrekking tot de uitvoering van de bij en
      krachtens deze wet opgedragen taak en daaruit voortvloeiende werkzaamheden.

      2 [Artikel 9, tweede, vijfde en zesde lid][ref1], en [artikel 11][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel9
