  - number: 30a
    text: |-
      1 Deze wet heeft geen betrekking op jaarrekeningen, jaarverslagen en de daaraan toe te voegen gegevens van een
      rechtspersoon, vennootschap, effectenuitgevende instelling of beleggingsinstelling die betrekking hebben op
      boekjaren die vóór 1 januari 2006 zijn aangevangen.

      2 Met betrekking tot financiële verslaggeving als bedoeld in het eerste lid blijft het recht zoals dat gold voor
      het tijdstip van inwerkingtreding van deze wet van toepassing.
