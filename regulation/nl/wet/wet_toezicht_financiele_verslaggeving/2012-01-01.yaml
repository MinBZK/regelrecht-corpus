      1 In afwijking van de [artikelen 2, tweede lid][ref1], en [3, derde lid][ref2], en
      [artikel 2:5 van de Algemene wet bestuursrecht][ref3] kan de Autoriteit Financiële Markten gegevens of
      inlichtingen, verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, verstrekken aan een
      instantie die in een andere lidstaat met het toezicht op financiële verslaggeving is belast of een bij algemene
      maatregel van bestuur aan te wijzen instantie die tot taak heeft een eenvormige toepassing van de standaarden
      voor de jaarrekening binnen de Europese Unie te bevorderen en een gemeenschappelijke aanpak op het vlak van de
      handhaving daarvan te ontwikkelen, tenzij:

      a. het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende is bepaald;

      b. het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op de financiële
      verslaggeving van effectenuitgevende instellingen;

      c. de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare
      orde;

      d. de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;

      e. de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen
      die deze wet beoogt te beschermen; of

      f. onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.

      2 In afwijking van de [artikelen 2, tweede lid][ref4], en [3, derde lid][ref5], en
      [artikel 2:5 van de Algemene wet bestuursrecht][ref6] kan de Autoriteit Financiële Markten gegevens of
      inlichtingen, verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, verstrekken aan een
      instantie die in een staat die geen lidstaat is met het toezicht op financiële verslaggeving is belast, indien
      met betrekking tot de gegevens en inlichtingen krachtens de wet in die staat ten minste gelijkwaardige waarborgen
      gelden ten aanzien van geheimhouding als op grond van het eerste lid, en voor zover de uitwisseling ten behoeve van
      de uitoefening van het toezicht door de desbetreffende instantie geschiedt.

      3 De Autoriteit Financiële Markten zendt onverwijld nadat met inachtneming van het tweede lid met een instantie
      van een staat die geen lidstaat is een overeenkomst is gesloten ten einde gegevens of inlichtingen te kunnen
      uitwisselen, een afschrift van de overeenkomst aan Onze Minister.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze waarop en de
      voorwaarden waaronder door de Autoriteit Financiële Markten gegevens of inlichtingen kunnen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel25
