  - number: '21'
    text: |-
      1 Indien naar het oordeel van Onze Minister de Autoriteit Financiële Markten haar taak ernstig verwaarloost, kan
      Onze Minister de noodzakelijke voorzieningen treffen.

      2 Ter uitvoering van het eerste lid kan Onze Minister besluiten een of meer onderdelen van de taak van de
      Autoriteit Financiële Markten zelf uit te voeren of door een ander bestuursorgaan te laten uitvoeren. Alsdan komen
      de desbetreffende bevoegdheden van de Autoriteit Financiële Markten toe aan Onze Minister onderscheidenlijk het
      andere bestuursorgaan.

      3 De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat de Autoriteit
      Financiële Markten in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog haar
      taak naar behoren uit te voeren.

      4 Onze Minister stelt de Tweede Kamer der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020369/2012-01-01#Artikel21
  - number: '22'
    text: |-
      1 Onze Minister zendt drie jaar na het tijdstip van inwerkingtreding van deze wet en vervolgens elke vijf jaar een
      verslag aan beide kamers der Staten-Generaal over de doeltreffendheid en doelmatigheid van het functioneren van de
      Autoriteit Financiële Markten in het kader van de uitvoering van deze wet.

      2 De Autoriteit Financiële Markten verstrekt desgevraagd aan Onze Minister gegevens en inlichtingen ten behoeve van
      het verslag.
    url: https://wetten.overheid.nl/BWBR0020369/2012-01-01#Artikel22
