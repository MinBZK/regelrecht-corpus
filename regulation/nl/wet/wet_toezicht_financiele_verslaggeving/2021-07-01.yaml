preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat een verbetering van het toezicht op de naleving en de handhaving van de
    voorschriften voor de financiële verslaggeving van effectenuitgevende instellingen gewenst is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt – voor zover niet anders is bepaald – verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel1
  - number: 1.a
    text: 'Autoriteit Financiële Markten: de Stichting Autoriteit Financiële Markten;'
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel1
  - number: 1.b
    text: |-
      effectenuitgevende instelling: uitgevende instelling als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] waarvan Nederland de lidstaat van herkomst is als bedoeld
      in [artikel 5:25a, eerste lid, onderdeel c, van die wet][ref2]:


