  - number: 1.e
    text: 'Onze Minister: Onze Minister van Financiën.'
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel1
  - number: 1a.1
    text: |-
      Deze wet is niet van toepassing op effectenuitgevende instellingen die uitsluitend obligaties of effecten zonder
      aandelenkarakter als bedoeld in [artikel 5:1, onderdeel e, van de Wet op het financieel toezicht][ref1] uitgeven
      en waarvan de nominale waarde per eenheid ten minste € 100.000 bedraagt of de tegenwaarde daarvan, op de datum van
      uitgifte, in een andere munteenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 1a.2
    text: |-
      Deze wet is niet van toepassing op effectenuitgevende instellingen met zetel in een door Onze Minster aangewezen
      staat die geen lidstaat is en die op grond van [artikel 5:25v van de Wet op het financieel toezicht][ref1]
      hun financiële verslaggeving opmaken overeenkomstig de in die staat geldende wettelijke voorschriften met
      betrekking tot financiële verslaggeving. Onze Minister kan een staat uitsluitend aanwijzen indien het in die
      staat uitgeoefende toezicht op de naleving van de in de vorige volzin bedoelde wettelijke voorschriften voldoende
      waarborgen biedt ter bescherming van de belangen die deze wet beoogt te beschermen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 1a.3
    text: |-
      In afwijking van het eerste lid is deze wet niet van toepassing op effectenuitgevende instellingen die uitsluitend
      obligaties of effecten zonder aandelenkarakter uitgeven die tot de handel op een gereglementeerde markt in
      de Europese Unie zijn toegelaten en waarvan de nominale waarde per eenheid ten minste € 50 000 bedraagt of de
      tegenwaarde daarvan, op de datum van uitgifte, in een andere munteenheid, en die al voor 31 december 2010 tot
      de handel op een gereglementeerde markt in de Europese Unie zijn toegelaten, zulks voor de looptijd van deze
      obligaties of effecten zonder aandelenkarakter.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel1a
  - number: '2.1'
    text: |-
      De Autoriteit Financiële Markten kan ten behoeve van het toezicht op de financiële verslaggeving aan een
      effectenuitgevende instelling om een nadere toelichting verzoeken omtrent de toepassing van voorschriften
      ingevolge artikel 3 van de IAS-verordening , [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1], of de
      [artikelen 5:25c, tweede, vierde of vijfde lid][ref2], [5:25d, tweede of vierde tot en met tiende lid][ref3],
      [5:25e][ref4], [5:25v, eerste lid][ref5], of [5:25w van de Wet op het financieel toezicht][ref6]. Deze nadere
      toelichting wordt verstrekt binnen een door de Autoriteit Financiële Markten te stellen redelijke termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '2.2'
    text: |-
      De Autoriteit Financiële Markten is verplicht tot geheimhouding van het in het eerste lid bedoelde verzoek en de
      naar aanleiding daarvan verstrekte nadere toelichting.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel2
  - number: 2.2a
    text: |-
      Het tweede lid is niet van toepassing ten aanzien van andere organisatieonderdelen van de Autoriteit Financiële
      Markten die belast zijn met toezicht uit hoofde van andere wetten.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel2
  - number: '2.3'
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van de accountantsverklaring, bedoeld in
      [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] dan wel de verklaring van de accountant,
      bedoeld in [artikel 5:25c, vierde lid, van de Wet op het financieel toezicht][ref2] of de verklaring of beoordeling
      van de accountant, bedoeld in [artikel 5:25d, derde lid, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '2.4'
    text: |-
      Het eerste lid en de [artikelen 3][ref1] en [4][ref2] zijn niet van toepassing op belegginginstellingen als
      bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref3] waarvan de rechten van deelneming op verzoek
      van de deelnemers ten laste van de activa direct of indirect worden ingekocht of terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '2.5'
    text: |-
      Het bepaalde ingevolge dit artikel en de [artikelen 3][ref1] en [4][ref2] is van overeenkomstige toepassing op
      jaarrekeningen, bestuursverslagen en de daaraan toe te voegen gegevens van een effectenuitgevende instelling die
      ingevolge [artikel 394, tweede lid, van Boek 2 van het Burgerlijk Wetboek][ref3] openbaar zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel394
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '394'
  - number: '2.6'
    text: |-
      De [artikelen 5:13][ref1] en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing op het bepaalde in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '2.7'
    text: |-
      De Autoriteit Financiële Markten is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten aanzien van de in het eerste lid bedoelde
      nadere toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '3.1'
    text: |-
      De Autoriteit Financiële Markten kan, nadat de in [artikel 2, eerste lid][ref1], bedoelde nadere toelichting is
      verkregen, aan de effectenuitgevende instelling schriftelijk mededelen dat de financiële verslaggeving, of een
      onderdeel daarvan, niet voldoet aan de in artikel 2, eerste lid, genoemde voorschriften. De Autoriteit Financiële
      Markten kan de in de eerste volzin bedoelde mededeling voorts doen indien de in de eerste volzin bedoelde nadere
      toelichting niet binnen de door de Autoriteit Financiële Markten gestelde termijn is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel2
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      De in het eerste lid bedoelde mededeling kan vergezeld gaan van een aanbeveling aan de effectenuitgevende
      instelling om binnen een door de Autoriteit Financiële Markten te bepalen redelijke termijn een bericht algemeen
      verkrijgbaar te stellen en bij de Autoriteit Financiële Markten te deponeren waarin de effectenuitgevende
      instelling:
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel3
  - number: 3.2.a
    text: |-
      uitlegt op welke wijze de in het eerste lid bedoelde voorschriften in de toekomst zullen worden toegepast en de
      gevolgen daarvan voor de financiële verslaggeving beschrijft; of
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel3
  - number: 3.2.b
    text: |-
      uitlegt op welke onderdelen de financiële verslaggeving niet voldoet aan de ingevolge artikel
      3 van de IAS-verordening, [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1], of de
      [artikelen 5:25c, tweede, vierde of vijfde lid][ref2], [5:25d, tweede lid of vierde tot en met tiende lid][ref3],
      [5:25e][ref4], [5:25v, eerste lid][ref5], of [5:25w van de Wet op het financieel toezicht][ref6] gestelde
      voorschriften en de gevolgen daarvan voor de financiële verslaggeving beschrijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '3.3'
    text: |-
      De Autoriteit Financiële Markten is verplicht tot geheimhouding van de in het eerste lid bedoelde mededeling en de
      in het tweede lid bedoelde aanbeveling. De Autoriteit Financiële Markten kan in afwijking van de eerste volzin de
      gegevens verkregen bij uitvoering van zijn taak op grond van deze wet verstrekken aan de met verschillende taken
      belaste organisatie onderdelen van de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel3
  - number: '3.4'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel3
  - number: 3.4.a
    text: aan het in het tweede lid bedoelde bericht toe te voegen stukken, en
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel3
  - number: 3.4.b
    text: |-
      de wijze waarop en de termijn waarbinnen het bericht, bedoeld in het tweede lid, algemeen verkrijgbaar wordt
      gesteld en bij de Autoriteit Financiële Markten wordt gedeponeerd.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel3
  - number: '4.1'
    text: |-
      De Autoriteit Financiële Markten kan een verzoek als bedoeld in
      [artikel 452 van Boek 2 van het Burgerlijk Wetboek][ref1] doen, indien een effectenuitgevende
      instelling onvoldoende gevolg heeft gegeven aan [artikel 2, eerste lid][ref2] bedoelde verzoek of
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel452
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '452'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '4.2'
    text: |-
      De Autoriteit Financiële Markten kan, nadat zij een mededeling als bedoeld in [artikel 3, eerste lid][ref1],
      aan de effectenuitgevende instelling heeft gedaan zonder dat zij daarbij een aanbeveling als bedoeld
      in [artikel 3, tweede lid][ref2], heeft gedaan, in het belang van een adequate functionering van de
      effectenmarkten of de positie van de belegger op die markten, een verzoek als bedoeld in [artikel 447][ref3]
      of [454 van Boek 2 van het Burgerlijk Wetboek][ref4] doen.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel447
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel454
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '447'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '454'
  - number: '4.3'
    text: |-
      De Autoriteit Financiële Markten kan een verzoek als bedoeld in [artikel 447][ref1]
      of [454 van Boek 2 van het Burgerlijk Wetboek][ref2] doen, indien de effectenuitgevende instelling onvoldoende
      gevolg heeft gegeven aan een aanbeveling als bedoeld in [artikel 3, tweede lid][ref3], of aan het ingevolge
      [artikel 3, vierde lid][ref4], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel447
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel454
      [ref3]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020369#Artikel3
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '447'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '454'
      - id: ref3
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.4'
    text: |-
      De Autoriteit Financiële Markten brengt het feit dat zij een verzoek als bedoeld in [artikel 447][ref1],
      [452][ref2] of [454 van Boek 2 van het Burgerlijk Wetboek][ref3] heeft gedaan ter openbare kennis, nadat zij de
      effectenuitgevende instelling in de gelegenheid heeft gesteld binnen een redelijke termijn ter openbare kennis
      te brengen dat de Autoriteit Financiële Markten een verzoek als bedoeld in [artikel 447][ref4], [452][ref5]
      of [454 van Boek 2 van het Burgerlijk Wetboek][ref6] heeft gedaan en de effectenuitgevende instelling daarvan geen
      gebruik heeft gemaakt. Indien de Autoriteit Financiële Markten het feit dat een verzoek is ingediend ter openbare
      kennis brengt, vermeldt zij daarbij de naam van de effectenuitgevende instelling, de datum van indiening van het
      verzoek, de wettelijke grondslag voor het verzoek en, indien het een verzoek als bedoeld in het tweede of derde lid
      betreft, in welk opzicht de financiële verslaggeving volgens het verzoek herziening behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel447
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel452
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel454
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel447
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel452
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel454
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '447'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '452'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '454'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '447'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '452'
      - id: ref6
        bwb_id: BWBR0003045
        artikel: '454'
  - number: '4.5'
    text: |-
      [Artikel 2, lid 2 en 2a][ref1], zijn van overeenkomstige toepassing op uit een nadere toelichting afkomstige
      gegevens en inlichtingen die aan de Autoriteit Financiële Markten is verstrekt op grond van een bevel ingevolge
      [artikel 452, vierde lid, van Boek 2 van het Burgerlijk Wetboek][ref2] en op verzoeken als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel452
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '452'
  - number: '4.6'
    text: |-
      De Autoriteit Financiële Markten kan in verzoeken als bedoeld in dit artikel uit een nadere toelichting afkomstige
      gegevens of inlichtingen opnemen die aan haar zijn verstrekt op grond van [artikel 2, eerste lid][ref1], of op
      grond van een bevel ingevolge [artikel 452, vierde lid, van Boek 2 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel452
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '452'
  - number: '5.1'
    text: 'De Autoriteit Financiële Markten houdt een register waarin worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel5
  - number: 5.1.a
    text: |-
      de ingevolge [artikel 3, tweede lid][ref1], bij de Autoriteit Financiële Markten gedeponeerde berichten;


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel3
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
  - number: 5.1.b
    text: |-
      het ingevolge [artikel 4, vierde lid][ref1], ter openbare kennis gebrachte feit dat een verzoek is gedaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel4
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '4'
        hoofdstuk: '2'
  - number: 5.1.c
    text: |-
      afschriften van de beschikkingen, bedoeld in [artikel 453][ref1]
      of [455 van Boek 2 van het Burgerlijk Wetboek][ref2], alsmede afschriften van uitspraken van beroep in cassatie
      tegen de eerstgenoemde beschikkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel453
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel455
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '453'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '455'
  - number: '5.2'
    text: De Autoriteit Financiële Markten draagt zorg voor het goed functioneren van het register.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel5
  - number: '5.3'
    text: De Autoriteit Financiële Markten houdt de gegevens in het register voor een ieder kosteloos ter inzage.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel5
  - number: '5.4'
    text: |-
      Binnen vijf werkdagen volgend op de werkdag waarop de Autoriteit Financiële Markten de stukken, berichten of
      afschriften heeft ontvangen of het feit, bedoeld in onderdeel c van het eerste lid, ter openbare kennis is
      gebracht, neemt zij deze op in het register.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel5
  - number: '5.5'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel5
  - number: 5.5.a
    text: |-
      de inrichting en werking van het register en de wijze waarop wijzigingen in het register kunnen worden aangebracht,
      en
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel5
  - number: 5.5.b
    text: |-
      de wijze waarop de in het register op te nemen stukken of berichten aan de Autoriteit Financiële Markten worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel5
  - number: '6.1'
    text: |-
      In afwijking van de [artikelen 2, tweede lid][ref1], en [3, derde lid][ref2], en
      [artikel 2:5 van de Algemene wet bestuursrecht][ref3] kan de Autoriteit Financiële Markten gegevens of
      inlichtingen, verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, verstrekken aan de
      Nederlandsche Bank, aan een instantie die in een andere lidstaat met het toezicht op financiële verslaggeving is
      belast, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 6.1.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende is bepaald;
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel6
  - number: 6.1.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op de financiële
      verslaggeving van effectenuitgevende instellingen;
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel6
  - number: 6.1.c
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel6
  - number: 6.1.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel6
  - number: 6.1.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel6
  - number: 6.1.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel6
  - number: '6.2'
    text: |-
      In afwijking van de [artikelen 2, tweede lid][ref1], en [3, derde lid][ref2], en
      [artikel 2:5 van de Algemene wet bestuursrecht][ref3] kan de Autoriteit Financiële Markten gegevens of
      inlichtingen, verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, verstrekken aan een
      instantie die in een staat die geen lidstaat is met het toezicht op financiële verslaggeving is belast, indien
      met betrekking tot de gegevens en inlichtingen krachtens de wet in die staat ten minste gelijkwaardige waarborgen
      gelden ten aanzien van geheimhouding als op grond van het eerste lid, en voor zover de uitwisseling ten behoeve van
      de uitoefening van het toezicht door de desbetreffende instantie geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '6.3'
    text: |-
      In afwijking van de [artikelen 2, tweede lid][ref1], en [3, derde lid][ref2], en
      [artikel 2:5 van de Algemene wet bestuursrecht][ref3] kan de Autoriteit Financiële Markten gegevens of
      inlichtingen, verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, verstrekken aan een
      bij algemene maatregel van bestuur aan te wijzen instantie die tot taak heeft een eenvormige toepassing van
      de standaarden voor de jaarrekening binnen de Europese Unie of in internationaal verband te bevorderen en een
      gemeenschappelijke aanpak op het vlak van de handhaving daarvan te ontwikkelen. De in het eerste lid gestelde
      waarborgen zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '6.4'
    text: |-
      De Autoriteit Financiële Markten zendt onverwijld nadat met inachtneming van het tweede lid met een instantie
      van een staat die geen lidstaat is een overeenkomst is gesloten ten einde gegevens of inlichtingen te kunnen
      uitwisselen, een afschrift van de overeenkomst aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel6
  - number: '6.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze waarop en de
      voorwaarden waaronder door de Autoriteit Financiële Markten gegevens of inlichtingen kunnen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel6
  - number: '15.1'
    text: |-
      De Autoriteit Financiële Markten legt een voorgenomen statutenwijziging ter voorafgaande instemming voor aan Onze
      Minister. De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '15.2'
    text: 'De instemming, bedoeld in het eerste lid, kan worden geweigerd:'
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel15
  - number: 15.2.a
    text: indien de statuten na wijziging onvoldoende zijn afgestemd op het in deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel15
  - number: 15.2.b
    text: |-
      indien de statuten onvoldoende waarborgen bieden voor een onafhankelijke taakvervulling door de Autoriteit
      Financiële Markten;
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel15
  - number: 15.2.c
    text: wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel15
  - number: '20.1'
    text: |-
      Onze Minister kan aan de Autoriteit Financiële Markten de gegevens of inlichtingen vragen die nodig zijn voor een
      onderzoek naar de toereikendheid van deze wet of de wijze waarop de Autoriteit Financiële Markten deze wet uitvoert
      of heeft uitgevoerd, indien dat ter wille van het toezicht nodig blijkt.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel20
  - number: '20.2'
    text: |-
      De Autoriteit Financiële Markten verstrekt aan Onze Minister de in het eerste lid bedoelde
      gegevens of inlichtingen, tenzij het vertrouwelijke gegevens of inlichtingen betreft in de zin van
      [artikel 2:5 van de Algemene wet bestuursrecht][ref1] die betrekking hebben op of herleidbaar zijn tot een
      afzonderlijke rechtspersoon of vennootschap. In afwijking van de vorige volzin verstrekt de Autoriteit Financiële
      Markten aan Onze Minister wel gegevens of inlichtingen die betrekking hebben of herleidbaar zijn tot een
      afzonderlijke effectenuitgevende instelling ten aanzien waarvan surséance van betaling is verleend, of die in staat
      van faillissement is verklaard of op grond van een rechterlijke uitspraak is ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '20.3'
    text: |-
      Onze Minister kan een derde opdragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn verstrekt
      te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze Minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel20
  - number: '20.4'
    text: |-
      Onze Minister gebruikt de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen
      uitsluitend voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de Autoriteit
      Financiële Markten deze wet uitvoert of heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel20
  - number: '20.5'
    text: |-
      Onze Minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede en derde lid ontvangen gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel20
  - number: '20.6'
    text: |-
      Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de beide kamers der Staten-Generaal mededelen en de conclusies
      in algemene zin uit het onderzoek openbaar maken.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel20
  - number: '20.7'
    text: |-
      De [Wet openbaarheid van bestuur][ref1], de [Wet Nationale Ombudsman][ref2] en
      [Titel 9.2 van de Algemene wet bestuursrecht][ref3] zijn niet van toepassing met betrekking tot de in dit artikel
      bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht werkende derde onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0003372
      [ref3]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0003372
      - id: ref3
        bwb_id: BWBR0005537
  - number: '30.1'
    text: |-
      Binnen zes weken na het tijdstip van inwerkingtreding van deze wet zendt de Autoriteit Financiële Markten ter
      instemming aan Onze Minister een begroting van de in het resterende deel van het kalenderjaar te verwachten baten
      en lasten, investeringsuitgaven alsmede inkomsten en uitgaven met betrekking tot de uitvoering van de bij en
      krachtens deze wet opgedragen taak en daaruit voortvloeiende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel30
  - number: '30.2'
    text: |-
      [Artikel 9, tweede, vijfde en zesde lid][ref1], en [artikel 11][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel11
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '9'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '11'
        hoofdstuk: '5'
  - number: 30a.1
    text: |-
      Deze wet heeft geen betrekking op jaarrekeningen, bestuursverslagen en de daaraan toe te voegen gegevens van
      een rechtspersoon, vennootschap, effectenuitgevende instelling of beleggingsinstelling die betrekking hebben op
      boekjaren die vóór 1 januari 2006 zijn aangevangen.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel30a
  - number: 30a.2
    text: |-
      Met betrekking tot financiële verslaggeving als bedoeld in het eerste lid blijft het recht zoals dat gold voor het
      tijdstip van inwerkingtreding van deze wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel30a
  - number: '31'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel31
  - number: '32'
    text: 'Deze wet wordt aangehaald als: Wet toezicht financiële verslaggeving.'
    url: https://wetten.overheid.nl/BWBR0020369/2021-07-01#Artikel32
