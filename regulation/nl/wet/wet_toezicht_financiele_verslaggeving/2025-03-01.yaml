  - number: '3'
    text: |-
      1 De Autoriteit Financiële Markten kan, nadat de in [artikel 2, eerste lid][ref1], bedoelde nadere toelichting
      is verkregen, aan de effectenuitgevende instelling schriftelijk mededelen dat de financiële verslaggeving, of een
      onderdeel daarvan, niet voldoet aan de in artikel 2, eerste lid, genoemde voorschriften. De Autoriteit Financiële
      Markten kan de in de eerste volzin bedoelde mededeling voorts doen indien de in de eerste volzin bedoelde nadere
      toelichting niet binnen de door de Autoriteit Financiële Markten gestelde termijn is verkregen.

      2 De in het eerste lid bedoelde mededeling kan vergezeld gaan van een aanbeveling aan de effectenuitgevende
      instelling om binnen een door de Autoriteit Financiële Markten te bepalen redelijke termijn een bericht algemeen
      verkrijgbaar te stellen en bij de Autoriteit Financiële Markten te deponeren waarin de effectenuitgevende
      instelling:

      a. uitlegt op welke wijze de in het eerste lid bedoelde voorschriften in de toekomst zullen worden toegepast en de
      gevolgen daarvan voor de financiële verslaggeving beschrijft; of

      b. uitlegt op welke onderdelen de financiële verslaggeving
      niet voldoet aan de ingevolge artikel 3 van de IAS-Verordening,
      [artikel 135b, eerste lid, tweede lid, tweede volzin, of derde lid, van Boek 2 van het Burgerlijk Wetboek][ref2],
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref3], of de [artikelen 5:25c, tweede, vierde of vijfde lid][ref4],
      [5:25d, tweede lid of vierde tot en met tiende lid][ref5], [5:25e][ref6], [5:25v, eerste lid][ref7], of
      [5:25w van de Wet op het financieel toezicht][ref8] gestelde voorschriften en de gevolgen daarvan voor de
      financiële verslaggeving beschrijft.

      3 De Autoriteit Financiële Markten is verplicht tot geheimhouding van de in het eerste lid bedoelde mededeling en
      de in het tweede lid bedoelde aanbeveling. De Autoriteit Financiële Markten kan in afwijking van de eerste volzin
      de gegevens verkregen bij uitvoering van zijn taak op grond van deze wet verstrekken aan de met verschillende taken
      belaste organisatie onderdelen van de Autoriteit Financiële Markten.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:

      a. aan het in het tweede lid bedoelde bericht toe te voegen stukken, en

      b. de wijze waarop en de termijn waarbinnen het bericht, bedoeld in het tweede lid, algemeen verkrijgbaar wordt
      gesteld en bij de Autoriteit Financiële Markten wordt gedeponeerd.


