  - number: 30a
    text: |-
      1 Deze wet heeft geen betrekking op jaarrekeningen, bestuursverslagen en de daaraan toe te voegen gegevens van
      een rechtspersoon, vennootschap, effectenuitgevende instelling of beleggingsinstelling die betrekking hebben op
      boekjaren die vóór 1 januari 2006 zijn aangevangen.

      2 Met betrekking tot financiële verslaggeving als bedoeld in het eerste lid blijft het recht zoals dat gold voor
      het tijdstip van inwerkingtreding van deze wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0020369/2025-03-01#Artikel30a
  - number: '31'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020369/2025-03-01#Artikel31
  - number: '32'
    text: 'Deze wet wordt aangehaald als: Wet toezicht financiële verslaggeving.'
    url: https://wetten.overheid.nl/BWBR0020369/2025-03-01#Artikel32
