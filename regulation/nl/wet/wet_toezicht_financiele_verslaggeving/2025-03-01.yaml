  - number: '4'
    text: |-
      1 De Autoriteit Financiële Markten kan een verzoek als bedoeld in
      [artikel 452 van Boek 2 van het Burgerlijk Wetboek][ref1] doen, indien een effectenuitgevende
      instelling onvoldoende gevolg heeft gegeven aan [artikel 2, eerste lid][ref2] bedoelde verzoek of
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref3].

      2 De Autoriteit Financiële Markten kan, nadat zij een mededeling als bedoeld in [artikel 3, eerste lid][ref4],
      aan de effectenuitgevende instelling heeft gedaan zonder dat zij daarbij een aanbeveling als bedoeld
      in [artikel 3, tweede lid][ref5], heeft gedaan, in het belang van een adequate functionering van de
      effectenmarkten of de positie van de belegger op die markten, een verzoek als bedoeld in [artikel 447][ref6]
      of [454 van Boek 2 van het Burgerlijk Wetboek][ref7] doen.

      3 De Autoriteit Financiële Markten kan een verzoek als bedoeld in [artikel 447][ref8]
      of [454 van Boek 2 van het Burgerlijk Wetboek][ref9] doen, indien de effectenuitgevende instelling onvoldoende
      gevolg heeft gegeven aan een aanbeveling als bedoeld in [artikel 3, tweede lid][ref10], of aan het ingevolge
      [artikel 3, vierde lid][ref11], bepaalde.

      4 De Autoriteit Financiële Markten brengt het feit dat zij een verzoek als bedoeld in [artikel 447][ref12],
      [452][ref13] of [454 van Boek 2 van het Burgerlijk Wetboek][ref14] heeft gedaan ter openbare kennis, nadat zij
      de effectenuitgevende instelling in de gelegenheid heeft gesteld binnen een redelijke termijn ter openbare kennis
      te brengen dat de Autoriteit Financiële Markten een verzoek als bedoeld in [artikel 447][ref15], [452][ref16]
      of [454 van Boek 2 van het Burgerlijk Wetboek][ref17] heeft gedaan en de effectenuitgevende instelling daarvan geen
      gebruik heeft gemaakt. Indien de Autoriteit Financiële Markten het feit dat een verzoek is ingediend ter openbare
      kennis brengt, vermeldt zij daarbij de naam van de effectenuitgevende instelling, de datum van indiening van het
      verzoek, de wettelijke grondslag voor het verzoek en, indien het een verzoek als bedoeld in het tweede of derde lid
      betreft, in welk opzicht de financiële verslaggeving volgens het verzoek herziening behoeft.

      5 [Artikel 2, lid 2 en 2a][ref18], zijn van overeenkomstige toepassing op uit een nadere toelichting afkomstige
      gegevens en inlichtingen die aan de Autoriteit Financiële Markten is verstrekt op grond van een bevel ingevolge
      [artikel 452, vierde lid, van Boek 2 van het Burgerlijk Wetboek][ref19] en op verzoeken als bedoeld in dit artikel.

      6 De Autoriteit Financiële Markten kan in verzoeken als bedoeld in dit artikel uit een nadere toelichting afkomstige
      gegevens of inlichtingen opnemen die aan haar zijn verstrekt op grond van [artikel 2, eerste lid][ref20], of op
      grond van een bevel ingevolge [artikel 452, vierde lid, van Boek 2 van het Burgerlijk Wetboek][ref21].


