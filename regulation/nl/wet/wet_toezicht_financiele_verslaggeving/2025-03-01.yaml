  - number: '2'
    text: |-
      1 De Autoriteit Financiële Markten kan ten behoeve van het toezicht op de financiële
      verslaggeving aan een effectenuitgevende instelling om een nadere toelichting verzoeken
      omtrent de toepassing van voorschriften ingevolge artikel 3 van de IAS-Verordening,
      [artikel 135b, eerste lid, tweede lid, tweede volzin, of derde lid, van Boek 2 van het Burgerlijk Wetboek][ref1],
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref2], of de [artikelen 5:25c, tweede, vierde of vijfde lid][ref3],
      [5:25d, tweede of vierde tot en met tiende lid][ref4], [5:25e][ref5], [5:25v, eerste lid][ref6], of
      [5:25w van de Wet op het financieel toezicht][ref7]. Deze nadere toelichting wordt verstrekt binnen een door de
      Autoriteit Financiële Markten te stellen redelijke termijn.

      2 De Autoriteit Financiële Markten is verplicht tot geheimhouding van het in het eerste lid bedoelde verzoek en de
      naar aanleiding daarvan verstrekte nadere toelichting.

      2a Het tweede lid is niet van toepassing ten aanzien van andere organisatieonderdelen van de Autoriteit Financiële
      Markten die belast zijn met toezicht uit hoofde van andere wetten.

      3 Het eerste lid is niet van toepassing ten aanzien van de accountantsverklaring, bedoeld in
      [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref8] dan wel de verklaring van de accountant,
      bedoeld in [artikel 5:25c, vierde lid, van de Wet op het financieel toezicht][ref9] of de verklaring of beoordeling
      van de accountant, bedoeld in [artikel 5:25d, derde lid, van die wet][ref10].

      4 Het eerste lid en de [artikelen 3][ref11] en [4][ref12] zijn niet van toepassing op belegginginstellingen als
      bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref13] waarvan de rechten van deelneming op verzoek
      van de deelnemers ten laste van de activa direct of indirect worden ingekocht of terugbetaald.

      5 Het bepaalde ingevolge dit artikel en de [artikelen 3][ref14] en [4][ref15] is van overeenkomstige toepassing op
      jaarrekeningen, bestuursverslagen en de daaraan toe te voegen gegevens van een effectenuitgevende instelling die
      ingevolge [artikel 394, tweede lid, van Boek 2 van het Burgerlijk Wetboek][ref16] openbaar zijn gemaakt.

      6 De [artikelen 5:13][ref17] en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref18] zijn van
      overeenkomstige toepassing op het bepaalde in dit artikel.

      7 De Autoriteit Financiële Markten is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref19] ten aanzien van de in het eerste lid bedoelde
      nadere toelichting.


