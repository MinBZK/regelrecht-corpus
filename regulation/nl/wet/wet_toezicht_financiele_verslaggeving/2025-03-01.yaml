preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat een verbetering van het toezicht op de naleving en de handhaving van de
    voorschriften voor de financiële verslaggeving van effectenuitgevende instellingen gewenst is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020369/2025-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt – voor zover niet anders is bepaald – verstaan onder:

      a. Autoriteit Financiële Markten: de Stichting Autoriteit Financiële Markten;

      b. effectenuitgevende instelling: uitgevende instelling als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] waarvan Nederland de lidstaat van herkomst is als bedoeld
      in [artikel 5:25a, eerste lid, onderdeel c, van die wet][ref2]:

      1°. met statutaire zetel in Nederland waarvan effecten zijn toegelaten tot de handel op een gereglementeerde
      markt, als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref3], of de handel op een
      met een gereglementeerde markt vergelijkbaar systeem uit een staat die geen lidstaat is, als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref4], die gelegen is of functioneert in een staat die niet een
      lidstaat is van de Europese Unie;

      2°. Met statutaire zetel in een andere lidstaat of een staat die geen lidstaat is waarvan
      effecten zijn toegelaten tot de handel op een gereglementeerde markt als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref5];

      c. IAS-verordening: [verordening (EG) nr. 1606/2002](32002R1606) van het Europees Parlement en de Raad van de
      Europese Unie van 19 juli 2002 betreffende de toepassing van internationale standaarden voor jaarrekeningen (PbEG
      L 243);

      d. financiële verslaggeving:

      1°. de vastgestelde jaarrekening, bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref6];

      2°. het bestuursverslag, bedoeld in [artikel 391 van Boek 2 van het Burgerlijk Wetboek][ref7];

      3°. de gegevens die op grond van [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref8] aan de jaarrekening en
      het bestuursverslag worden toegevoegd;

      4°. indien de effectenuitgevende instelling zetel heeft in een andere lidstaat, de
      overeenkomstig [artikel 5:25c, eerste en vierde lid, van de Wet op het financieel toezicht][ref9]
      algemeen verkrijgbaar gestelde en opgestelde jaarrekening en het overeenkomstig
      [artikel 5:25c, eerste en vierde lid, van de Wet op het financieel toezicht][ref10] algemeen verkrijgbaar gestelde
      en opgestelde bestuursverslag;

      5°. indien de effectenuitgevende instelling zetel heeft in een staat die geen lidstaat is, de overeenkomstig
      [artikel 5:25c, eerste en vijfde lid, van de Wet op het financieel toezicht][ref11] algemeen verkrijgbaar
      gestelde jaarrekening en bestuursverslag dan wel de op grond van [artikel 5:25c, eerste lid][ref12], jo.
      [artikel 5:25v, eerste lid][ref13], algemeen verkrijgbaar gestelde jaarlijkse financiële verslaggeving;

      6°. de algemeen verkrijgbaar gestelde verklaringen inzake de jaarrekening en het bestuursverslag, bedoeld in
      [artikel 5:25c, tweede lid, onderdeel c, van de Wet op het financieel toezicht][ref14]; en

      7°. de algemeen verkrijgbaar gestelde halfjaarrekening, het algemeen verkrijgbaar gestelde
      halfjaarlijks bestuursverslag en de algemeen verkrijgbaar gestelde verklaringen, bedoeld
      in [artikel 5:25d van de Wet op het financieel toezicht][ref15] dan wel de op grond van
      [artikel 5:25d, eerste lid][ref16] jo. [artikel 5:25v, eerste lid][ref17] algemeen verkrijgbaar gestelde
      halfjaarlijkse financiële verslaggeving;

      8°. het opgemaakte jaarlijkse verslag over betalingen aan overheden, bedoeld in
      [artikel 5:25e van de Wet op het financieel toezicht][ref18] of genoemd in de desbetreffende algemene maatregel van
      bestuur krachtens [artikel 391a, tweede lid, van het Burgerlijk Wetboek](onbekend);

      9°. het door een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref19],
      gecontroleerde jaarlijkse bezoldigingsverslag, bedoeld in
      [artikel 135b van Boek 2 van het Burgerlijk Wetboek][ref20].

      e. Onze Minister: Onze Minister van Financiën.


