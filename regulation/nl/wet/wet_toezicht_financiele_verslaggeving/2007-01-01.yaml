---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_toezicht_financiele_verslaggeving
regulatory_layer: WET
publication_date: '2024-06-28'
valid_from: '2007-01-01'
bwb_id: BWBR0020369
url: https://wetten.overheid.nl/BWBR0020369/2007-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat een verbetering van het toezicht op de naleving en de handhaving van de
    voorschriften voor de financiële verslaggeving van effectenuitgevende instellingen gewenst is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt – voor zover niet anders is bepaald – verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel1
  - number: 1.a
    text: 'Autoriteit Financiële Markten: de Stichting Autoriteit Financiële Markten;'
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel1
  - number: 1.b
    text: |-
      effectenuitgevende instelling: een statutair in Nederland gevestigde rechtspersoon of vennootschap waarop
      [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] van toepassing is en waarvan aandelen, schuldbrieven of
      certificaten van aandelen of schuldbrieven zijn toegelaten:


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 1.b.1°
    text: |-
      tot de handel op een gereglementeerde markt als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1.b.2°
    text: |-
      tot de handel op een markt in financiële instrumenten als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] die gelegen of werkzaam is in een staat die niet een
      lidstaat is van de Europese Unie;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1.c
    text: |-
      IAS-verordening: [verordening (EG) nr. 1606/2002](32002R1606) van het Europees Parlement en de Raad van de Europese
      Unie van 19 juli 2002 betreffende de toepassing van internationale standaarden voor jaarrekeningen (PbEG L 243);
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel1
  - number: 1.d
    text: 'financiële verslaggeving:'
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel1
  - number: 1.d.1°
    text: |-
      de vastgestelde jaarrekening, bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: 1.d.2°
    text: |-
      het jaarverslag, bedoeld in [artikel 391 van Boek 2 van het Burgerlijk Wetboek][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel391
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '391'
  - number: 1.d.3°
    text: |-
      de gegevens die op grond van [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref1] aan de jaarrekening en het
      jaarverslag worden toegevoegd;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
  - number: 1.e
    text: 'Onze Minister: Onze Minister van Financiën.'
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel1
  - number: '2.1'
    text: |-
      Indien de Autoriteit Financiële Markten op grond van openbare feiten of omstandigheden redenen heeft voor twijfel
      of de financiële verslaggeving, of een onderdeel daarvan, van een effectenuitgevende instelling voldoet aan
      de daaraan ingevolge artikel 3 van de IAS-verordening of [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1]
      gestelde voorschriften, kan zij van deze instelling ter aanvulling van de financiële verslaggeving om een nadere
      toelichting omtrent de toepassing van die voorschriften verzoeken. Deze nadere toelichting wordt verstrekt binnen
      een door de Autoriteit Financiële Markten te stellen redelijke termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '2.2'
    text: |-
      De Autoriteit Financiële Markten is verplicht tot geheimhouding van het in het eerste lid bedoelde verzoek en de
      naar aanleiding daarvan verstrekte nadere toelichting.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van de accountantsverklaring, bedoeld in
      [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '2.4'
    text: |-
      Het eerste lid en de [artikelen 3][ref1] en [4][ref2] zijn niet van toepassing op effectenuitgevende instellingen
      die beleggingsinstelling als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref3] zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '2.5'
    text: |-
      Het bepaalde ingevolge dit artikel en de [artikelen 3][ref1] en [4][ref2] is van overeenkomstige toepassing
      op jaarrekeningen, jaarverslagen en de daaraan toe te voegen gegevens van een effectenuitgevende instelling die
      ingevolge [artikel 394, tweede lid, van Boek 2 van het Burgerlijk Wetboek][ref3] openbaar zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel394
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '394'
  - number: '3.1'
    text: |-
      De Autoriteit Financiële Markten kan, nadat de in [artikel 2, eerste lid][ref1], bedoelde nadere toelichting is
      verkregen, aan de effectenuitgevende instelling schriftelijk mededelen dat de in dat lid bedoelde twijfel niet
      is weggenomen. De Autoriteit Financiële Markten kan de in de eerste volzin bedoelde mededeling voorts doen indien
      de in de eerste volzin bedoelde nadere toelichting niet binnen de door de Autoriteit Financiële Markten gestelde
      termijn is verkregen en de Autoriteit Financiële Markten twijfelt of de financiële verslaggeving, of een onderdeel
      daarvan, voldoet aan de in [artikel 2, eerste lid][ref2], bedoelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel2
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      De in het eerste lid bedoelde mededeling kan vergezeld gaan van een aanbeveling aan de effectenuitgevende
      instelling om binnen een door de Autoriteit Financiële Markten te bepalen redelijke termijn een bericht algemeen
      verkrijgbaar te stellen en bij de Autoriteit Financiële Markten te deponeren waarin de effectenuitgevende
      instelling:
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel3
  - number: 3.2.a
    text: |-
      uitlegt op welke wijze de in het eerste lid bedoelde voorschriften in de toekomst zullen worden toegepast en de
      gevolgen daarvan voor de financiële verslaggeving beschrijft; of
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel3
  - number: 3.2.b
    text: |-
      uitlegt op welke onderdelen de financiële verslaggeving niet voldoet aan de ingevolge artikel 3 van de IAS-
      verordening of [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] gestelde voorschriften en de gevolgen daarvan
      voor de financiële verslaggeving beschrijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '3.3'
    text: |-
      De Autoriteit Financiële Markten is verplicht tot geheimhouding van de in het eerste lid bedoelde mededeling en de
      in het tweede lid bedoelde aanbeveling.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel3
  - number: '3.4'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel3
  - number: 3.4.a
    text: aan het in het tweede lid bedoelde bericht toe te voegen stukken, en
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel3
  - number: 3.4.b
    text: |-
      de wijze waarop en de termijn waarbinnen het bericht, bedoeld in het tweede lid, algemeen verkrijgbaar wordt
      gesteld en bij de Autoriteit Financiële Markten wordt gedeponeerd.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel3
  - number: '4.1'
    text: |-
      De Autoriteit Financiële Markten kan een verzoek als bedoeld in
      [artikel 452 van Boek 2 van het Burgerlijk Wetboek][ref1] doen, indien een effectenuitgevende instelling
      onvoldoende gevolg heeft gegeven aan het in [artikel 2, eerste lid][ref2], bedoelde verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel452
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel2
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '452'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.2'
    text: |-
      De Autoriteit Financiële Markten kan, nadat zij een mededeling als bedoeld in [artikel 3, eerste lid][ref1],
      aan de effectenuitgevende instelling heeft gedaan zonder dat zij daarbij een aanbeveling als
      bedoeld in [artikel 3, tweede lid][ref2], heeft gedaan, in het belang van een adequate functionering
      van de effectenmarkten of de positie van de belegger op die markten, een verzoek als bedoeld in
      [artikel 447 van Boek 2 van Burgerlijk Wetboek][ref3] doen.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel447
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '447'
  - number: '4.3'
    text: |-
      De Autoriteit Financiële Markten kan een verzoek als bedoeld in
      [artikel 447 van Boek 2 van het Burgerlijk Wetboek][ref1] doen, indien de effectenuitgevende instelling onvoldoende
      gevolg heeft gegeven aan een aanbeveling als bedoeld in [artikel 3, tweede lid][ref2], of aan het ingevolge
      [artikel 3, vierde lid][ref3], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel447
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020369#Artikel3
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '447'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.4'
    text: |-
      De Autoriteit Financiële Markten brengt het feit dat zij een verzoek als bedoeld in [artikel 452][ref1]
      of [447 van Boek 2 van het Burgerlijk Wetboek][ref2] heeft gedaan ter openbare kennis, nadat zij de
      effectenuitgevende instelling in de gelegenheid heeft gesteld binnen een redelijke termijn ter openbare
      kennis te brengen dat de Autoriteit Financiële Markten een verzoek als bedoeld in [artikel 452][ref3] of
      [447 van Boek 2 van het Burgerlijk Wetboek][ref4] heeft gedaan en de effectenuitgevende instelling daarvan geen
      gebruik heeft gemaakt. Indien de Autoriteit Financiële Markten het feit dat een verzoek is ingediend ter openbare
      kennis brengt, vermeldt zij daarbij de naam van de effectenuitgevende instelling, de datum van indiening van het
      verzoek, de wettelijke grondslag voor het verzoek en, indien het een verzoek als bedoeld in het tweede of derde lid
      betreft, in welk opzicht de financiële verslaggeving volgens het verzoek herziening behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel452
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel447
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel452
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel447
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '452'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '447'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '452'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '447'
  - number: '4.5'
    text: |-
      [Artikel 2, tweede lid][ref1], is van overeenkomstige toepassing op uit een nadere toelichting afkomstige
      gegevens en inlichtingen die aan de Autoriteit Financiële Markten is verstrekt op grond van een bevel ingevolge
      [artikel 452, vierde lid, van Boek 2 van het Burgerlijk Wetboek][ref2] en op verzoeken als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel452
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '452'
  - number: '4.6'
    text: |-
      De Autoriteit Financiële Markten kan in verzoeken als bedoeld in dit artikel uit een nadere toelichting afkomstige
      gegevens of inlichtingen opnemen die aan haar zijn verstrekt op grond van [artikel 2, eerste lid][ref1], of op
      grond van een bevel ingevolge [artikel 452, vierde lid, van Boek 2 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel452
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '452'
  - number: '5.1'
    text: 'De Autoriteit Financiële Markten houdt een register waarin worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel5
  - number: 5.1.a
    text: |-
      de ingevolge [artikel 5:24 van de Wet op het financieel toezicht][ref1] en
      [5a van de Wet toezicht effectenverkeer 1995][ref2] bij de Autoriteit Financiële Markten gedeponeerde financiële
      verslaggeving van effectenuitgevende instellingen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel5a
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: 5a
  - number: 5.1.b
    text: |-
      de ingevolge [artikel 3, tweede lid][ref1], bij de Autoriteit Financiële Markten gedeponeerde berichten;


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel3
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
  - number: 5.1.c
    text: |-
      het ingevolge [artikel 4, vierde lid][ref1], ter openbare kennis gebrachte feit dat een verzoek is gedaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel4
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '4'
        hoofdstuk: '2'
  - number: 5.1.d
    text: |-
      afschriften van de beschikkingen, bedoeld in [artikel 453 van Boek 2 van het Burgerlijk Wetboek][ref1], alsmede
      afschriften van uitspraken van beroep in cassatie tegen de eerstgenoemde beschikkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel453
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '453'
  - number: '5.2'
    text: De Autoriteit Financiële Markten draagt zorg voor het goed functioneren van het register.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel5
  - number: '5.3'
    text: De Autoriteit Financiële Markten houdt de gegevens in het register voor een ieder kosteloos ter inzage.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel5
  - number: '5.4'
    text: |-
      Binnen vijf werkdagen volgend op de werkdag waarop de Autoriteit Financiële Markten de stukken, berichten of
      afschriften heeft ontvangen of het feit, bedoeld in onderdeel c van het eerste lid, ter openbare kennis is
      gebracht, neemt zij deze op in het register.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel5
  - number: '5.5'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel5
  - number: 5.5.a
    text: |-
      de inrichting en werking van het register en de wijze waarop wijzigingen in het register kunnen worden aangebracht,
      en
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel5
  - number: 5.5.b
    text: |-
      de wijze waarop de in het register op te nemen stukken of berichten aan de Autoriteit Financiële Markten worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel5
  - number: '6.1'
    text: |-
      In afwijking van de [artikelen 2, tweede lid][ref1], [3, derde lid][ref2], en
      [2:5 van de Algemene wet bestuursrecht][ref3] kan de Autoriteit Financiële Markten gegevens of inlichtingen,
      verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak, verstrekken aan bij algemene maatregel
      van bestuur aan te wijzen instanties die tot taak hebben een eenvormige toepassing van de standaarden voor de
      jaarrekening te bevorderen en een gemeenschappelijke aanpak op het vlak van de handhaving daarvan te ontwikkelen,
      tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 6.1.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende is bepaald;
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel6
  - number: 6.1.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op de financiële
      verslaggeving van effectenuitgevende instellingen;
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel6
  - number: 6.1.c
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel6
  - number: 6.1.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel6
  - number: 6.1.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel6
  - number: 6.1.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel6
  - number: '6.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze waarop en de
      voorwaarden waaronder door de Autoriteit Financiële Markten gegevens of inlichtingen kunnen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel6
  - number: '7'
    text: |-
      Gegevens en inlichtingen die aan de Autoriteit Financiële Markten zijn verstrekt op grond van
      [artikel 2, eerste lid][ref1], of [artikel 452, eerste of vierde lid, van Boek 2 van het Burgerlijk Wetboek][ref2],
      worden door de Autoriteit Financiële Markten alleen gebruikt voor de uitoefening van bevoegdheden uit hoofde van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel452
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '452'
  - number: '8'
    text: |-
      De Autoriteit Financiële Markten werkt, wat betreft het toezicht ingevolge deze wet op de financiële
      verslaggeving van kredietinstellingen, verzekeraars of beleggingsondernemingen als bedoeld in
      [artikel 1:1 van Wet op het financieel toezicht][ref1], samen met de Nederlandsche Bank N.V., voorzover dit voor de
      uitoefening van het toezicht noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '9.1'
    text: |-
      De Autoriteit Financiële Markten stelt jaarlijks een begroting op van de in het daaropvolgende jaar te verwachten
      baten en lasten, investeringsuitgaven alsmede inkomsten en uitgaven met betrekking tot de uitvoering van de bij en
      krachtens deze wet opgedragen taak en de daaruit voortvloeiende werkzaamheden. De begroting wordt op een zodanige
      wijze opgesteld dat de lasten en de uitgaven structureel worden gedekt door de baten en de inkomsten.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel9
  - number: '9.2'
    text: De begrotingsposten worden van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel9
  - number: '9.3'
    text: |-
      Tenzij de werkzaamheden waarop de begroting betrekking heeft nog niet eerder werden verricht, bevat de begroting
      een vergelijking met de begroting van het lopende jaar en de laatst goedgekeurde jaarrekening waarmee Onze Minister
      heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel9
  - number: '9.4'
    text: |-
      De Autoriteit Financiële Markten zendt de begroting voor 1 december van het aan het begrotingsjaar voorafgaande
      jaar ter instemming aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel9
  - number: '9.5'
    text: |-
      De instemming kan worden onthouden wegens strijd met het recht of het algemeen belang. In geval van gebleken
      strijdigheid wordt instemming niet onthouden dan nadat de Autoriteit Financiële Markten in de gelegenheid is
      gesteld de begroting aan te passen, binnen een door Onze Minister te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel9
  - number: '9.6'
    text: |-
      De Autoriteit Financiële Markten doet onverwijld na instemming mededeling van de begroting in de Staatscourant en
      houdt de begroting gedurende een jaar na instemming op elektronische wijze ter inzage.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel9
  - number: '9.7'
    text: |-
      Wanneer Onze Minister niet met de begroting heeft ingestemd vóór 1 januari van het jaar waarop deze betrekking
      heeft, kan de Autoriteit Financiële Markten, in het belang van een juiste uitvoering van haar taak, voor het
      aangaan van verplichtingen en het verrichten van uitgaven beschikken over ten hoogste vier twaalfde gedeelten van
      de bedragen die bij de overeenkomstige onderdelen in de begroting van het voorafgaande jaar waren toegestaan.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel9
  - number: '10'
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en begrote
      baten en lasten dan wel inkomsten en uitgaven, doet de Autoriteit Financiële Markten daarvan onverwijld mededeling
      aan Onze Minister onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel10
  - number: '11'
    text: Bij ministeriële regeling kunnen regels worden gesteld voor de inrichting van de begroting.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel11
  - number: '12.1'
    text: |-
      De Autoriteit Financiële Markten stelt jaarlijks een jaarrekening op van de bij deze wet opgedragen taak en de
      daaruit voortvloeiende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel12
  - number: '12.2'
    text: |-
      De jaarrekening van de Autoriteit Financiële Markten, waarin rekening en verantwoording wordt afgelegd van het
      financieel beheer en van de geleverde prestaties over het verstreken boekjaar, wordt ingericht zoveel mogelijk met
      overeenkomstige toepassing van [Titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '12.3'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door
      de Autoriteit Financiële Markten aangewezen registeraccountant of Accountant-Administratieconsulent
      ten aanzien van wie in het accountantsregister een aantekening is geplaatst als bedoeld in
      [artikel 36, derde lid, van de Wet op de Accountants-Administratieconsulenten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
  - number: '12.4'
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het tweede lid, een verslag van zijn bevindingen omtrent de
      rechtmatige inning en besteding van de middelen door de Autoriteit Financiële Markten uit hoofde van deze wet.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel12
  - number: '12.5'
    text: |-
      De accountant voegt bij de verklaring, bedoeld in het derde lid, tevens een verslag van zijn bevindingen over de
      vraag of het beheer en de organisatie van de Autoriteit Financiële Markten uit hoofde van deze wet voldoen aan
      eisen van doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel12
  - number: '12.6'
    text: |-
      De Autoriteit Financiële Markten zendt de jaarrekening voor 1 mei van het op het boekjaar volgende jaar ter
      instemming aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel12
  - number: '12.7'
    text: De instemming kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel12
  - number: '12.8'
    text: |-
      De Autoriteit Financiële Markten doet onverwijld na instemming mededeling van de jaarrekening in de Staatscourant
      en houdt de jaarrekening gedurende een jaar na instemming op elektronische wijze ter inzage.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel12
  - number: '13.1'
    text: |-
      Het verschil tussen de aan het eind van een begrotingsjaar gerealiseerde baten van de Autoriteit Financiële Markten
      en de gerealiseerde lasten van de Autoriteit Financiële Markten vormt het exploitatiesaldo.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel13
  - number: '13.2'
    text: |-
      Indien in enig boekjaar een exploitatiesaldo ontstaat en de Autoriteit Financiële Markten dit exploitatiesaldo
      wil betrekken bij de in rekening te brengen kosten als bedoeld in [artikel 18][ref1] doet de Autoriteit Financiële
      Markten daaromtrent een voorstel in de jaarrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel18
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '18'
        hoofdstuk: '5'
  - number: '14.1'
    text: |-
      De Autoriteit Financiële Markten stelt jaarlijks een jaarverslag op. Het jaarverslag beschrijft de taakuitoefening
      en het daartoe gevoerde beleid uit hoofde van deze wet in het voorafgaande jaar. Het jaarverslag beschrijft voorts
      het gevoerde beleid met betrekking tot de kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel14
  - number: '14.2'
    text: |-
      De Autoriteit Financiële Markten zendt het jaarverslag voor 1 mei aan Onze Minister. Onze Minister zendt een
      afschrift van het jaarverslag aan de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel14
  - number: '14.3'
    text: De Autoriteit Financiële Markten houdt het jaarverslag op elektronische wijze ter inzage.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel14
  - number: '15.1'
    text: |-
      De Autoriteit Financiële Markten legt een voorgenomen statutenwijziging ter voorafgaande instemming voor aan Onze
      Minister. De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '15.2'
    text: 'De instemming, bedoeld in het eerste lid, kan worden geweigerd:'
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel15
  - number: 15.2.a
    text: indien de statuten na wijziging onvoldoende zijn afgestemd op het in deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel15
  - number: 15.2.b
    text: |-
      indien de statuten onvoldoende waarborgen bieden voor een onafhankelijke taakvervulling door de Autoriteit
      Financiële Markten;
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel15
  - number: 15.2.c
    text: wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel15
  - number: '16.1'
    text: |-
      De Autoriteit Financiële Markten draagt met betrekking tot de uitoefening van haar taak op grond van deze wet zorg
      voor:
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel16
  - number: 16.1.a
    text: een tijdige voorbereiding en uitvoering;
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel16
  - number: 16.1.b
    text: de kwaliteit van de daarbij gebruikte procedures;
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel16
  - number: 16.1.c
    text: de zorgvuldige behandeling van een ieder die met haar in aanraking komt;
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel16
  - number: 16.1.d
    text: de zorgvuldige behandeling van klachten die worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel16
  - number: '16.2'
    text: |-
      De Autoriteit Financiële Markten treft voorzieningen, waardoor ieder die met haar in aanraking komt in de
      gelegenheid is voorstellen tot verbetering van werkwijzen en procedures te doen.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel16
  - number: '16.3'
    text: |-
      In het jaarverslag, bedoeld in [artikel 14][ref1], doet de Autoriteit Financiële Markten verslag van hetgeen tot
      uitvoering van het eerste en het tweede lid is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel14
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '14'
        hoofdstuk: '5'
  - number: '17.1'
    text: 'De Autoriteit Financiële Markten stelt een orgaan in voor overleg over:'
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel17
  - number: 17.1.a
    text: de door de Autoriteit Financiële Markten op te stellen begroting;
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel17
  - number: 17.1.b
    text: |-
      de door de Autoriteit Financiële Markten gerealiseerde baten en lasten alsmede inkomsten en uitgaven, en verrichte
      werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel17
  - number: 17.1.c
    text: |-
      de kosten voor effectenuitgevende instellingen die verband houden met de uitoefening van haar taak op grond van
      deze wet en daaruit voortvloeiende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel17
  - number: '17.2'
    text: |-
      Het overleg wordt gevoerd door de Autoriteit Financiële Markten en een representatieve vertegenwoordiging van
      effectenuitgevende instellingen. De Autoriteit Financiële Markten kan tevens daarvoor in aanmerking komende
      organisaties van belanghebbenden toelaten tot het overleg. Onze Minister wijst ambtenaren aan die namens hem het
      overleg bijwonen.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel17
  - number: '17.3'
    text: Het overleg vindt tweemaal per jaar plaats.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel17
  - number: '17.4'
    text: |-
      De Autoriteit Financiële Markten maakt het verslag van het overleg binnen een redelijke termijn na het overleg
      openbaar.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel17
  - number: '18.1'
    text: |-
      De Autoriteit Financiële Markten brengt de kosten van de werkzaamheden die zij verricht in verband met de
      uitoefening van haar taak op grond van deze wet in rekening bij de effectenuitgevende instellingen voor zover
      deze kosten niet ten laste komen van de Rijksbegroting. Tot de kosten behoren onder meer de kosten die zij ter
      voorbereiding op de uitvoering van nieuwe onderdelen van haar taak heeft gemaakt, voordat deze taak aan haar werd
      opgedragen.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel18
  - number: '18.2'
    text: |-
      De kosten worden gebaseerd op de begroting waarmee Onze Minister heeft ingestemd en op het exploitatiesaldo,
      indien Onze Minister heeft ingestemd met de jaarrekening waarin een voorstel als bedoeld in
      [artikel 13, tweede lid][ref1], is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel13
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '13'
        hoofdstuk: '5'
  - number: '18.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid. Daarbij kan onderscheid worden gemaakt tussen incidenteel en jaarlijks in rekening te brengen kosten
      en kan tevens worden voorzien in een bevoegdheid voor de Autoriteit Financiële Markten om in bepaalde gevallen
      kosten niet of niet geheel in rekening te brengen indien het volledig in rekening brengen van de kosten zou
      leiden tot een onbillijkheid van overwegende aard. Deze regels hebben onder meer betrekking op de toerekening van
      toezichthandelingen aan ondernemingen.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel18
  - number: '18.4'
    text: |-
      Bij ministeriële regeling worden de tarieven vastgesteld op basis waarvan de kosten, bedoeld in het eerste tot en
      met het derde lid, worden doorberekend.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel18
  - number: '19'
    text: |-
      De Autoriteit Financiële Markten verstrekt Onze Minister desgevraagd inlichtingen die nodig zijn voor de
      beoordeling van de uitvoerbaarheid van algemene beleidsvoornemens en voorgenomen wettelijke voorschriften, voor
      zover deze betrekking hebben op het door de Autoriteit Financiële Markten uit te oefenen toezicht ingevolge deze
      wet.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel19
  - number: '20.1'
    text: |-
      Onze Minister kan aan de Autoriteit Financiële Markten de gegevens of inlichtingen vragen die nodig zijn voor een
      onderzoek naar de toereikendheid van deze wet of de wijze waarop de Autoriteit Financiële Markten deze wet uitvoert
      of heeft uitgevoerd, indien dat ter wille van het toezicht nodig blijkt.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel20
  - number: '20.2'
    text: |-
      De Autoriteit Financiële Markten verstrekt aan Onze Minister de in het eerste lid bedoelde
      gegevens of inlichtingen, tenzij het vertrouwelijke gegevens of inlichtingen betreft in de zin van
      [artikel 2:5 van de Algemene wet bestuursrecht][ref1] die betrekking hebben op of herleidbaar zijn tot een
      afzonderlijke rechtspersoon of vennootschap. In afwijking van de vorige volzin verstrekt de Autoriteit Financiële
      Markten aan Onze Minister wel gegevens of inlichtingen die betrekking hebben of herleidbaar zijn tot een
      afzonderlijke effectenuitgevende instelling ten aanzien waarvan surséance van betaling is verleend, of die in staat
      van faillissement is verklaard of op grond van een rechterlijke uitspraak is ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '20.3'
    text: |-
      Onze Minister kan een derde opdragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn verstrekt
      te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze Minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel20
  - number: '20.4'
    text: |-
      Onze Minister gebruikt de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen
      uitsluitend voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de Autoriteit
      Financiële Markten deze wet uitvoert of heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel20
  - number: '20.5'
    text: |-
      Onze Minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede en derde lid ontvangen gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel20
  - number: '20.6'
    text: |-
      Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de beide kamers der Staten-Generaal mededelen en de conclusies
      in algemene zin uit het onderzoek openbaar maken.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel20
  - number: '20.7'
    text: |-
      De [Wet openbaarheid van bestuur][ref1], de [Wet Nationale Ombudsman][ref2] en
      [Titel 9.2 van de Algemene wet bestuursrecht][ref3] zijn niet van toepassing met betrekking tot de in dit artikel
      bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht werkende derde onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0003372
      [ref3]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0003372
      - id: ref3
        bwb_id: BWBR0005537
  - number: '21.1'
    text: |-
      Indien naar het oordeel van Onze Minister de Autoriteit Financiële Markten haar taak ernstig verwaarloost, kan Onze
      Minister de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel21
  - number: '21.2'
    text: |-
      Ter uitvoering van het eerste lid kan Onze Minister besluiten een of meer onderdelen van de taak van de Autoriteit
      Financiële Markten zelf uit te voeren of door een ander bestuursorgaan te laten uitvoeren. Alsdan komen de
      desbetreffende bevoegdheden van de Autoriteit Financiële Markten toe aan Onze Minister onderscheidenlijk het andere
      bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel21
  - number: '21.3'
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat de Autoriteit
      Financiële Markten in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog haar
      taak naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel21
  - number: '21.4'
    text: |-
      Onze Minister stelt de Tweede Kamer der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel21
  - number: '22.1'
    text: |-
      Onze Minister zendt drie jaar na het tijdstip van inwerkingtreding van deze wet en vervolgens elke vijf jaar een
      verslag aan beide kamers der Staten-Generaal over de doeltreffendheid en doelmatigheid van het functioneren van de
      Autoriteit Financiële Markten in het kader van de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel22
  - number: '22.2'
    text: |-
      De Autoriteit Financiële Markten verstrekt desgevraagd aan Onze Minister gegevens en inlichtingen ten behoeve van
      het verslag.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel22
  - number: '23'
    text: |-
      In afwijking van de [Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond van de
      [Hoofdstukken 4][ref2] en [5][ref3] van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0020369#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0020369
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0020369
        hoofdstuk: '5'
  - number: '30.1'
    text: |-
      Binnen zes weken na het tijdstip van inwerkingtreding van deze wet zendt de Autoriteit Financiële Markten ter
      instemming aan Onze Minister een begroting van de in het resterende deel van het kalenderjaar te verwachten baten
      en lasten, investeringsuitgaven alsmede inkomsten en uitgaven met betrekking tot de uitvoering van de bij en
      krachtens deze wet opgedragen taak en daaruit voortvloeiende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel30
  - number: '30.2'
    text: |-
      [Artikel 9, tweede, vijfde en zesde lid][ref1], en [artikel 11][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020369#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020369#Artikel11
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020369
        artikel: '9'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020369
        artikel: '11'
        hoofdstuk: '5'
  - number: 30a.1
    text: |-
      Deze wet heeft geen betrekking op jaarrekeningen, jaarverslagen en de daaraan toe te voegen gegevens van een
      rechtspersoon, vennootschap, effectenuitgevende instelling of beleggingsinstelling die betrekking hebben op
      boekjaren die vóór 1 januari 2006 zijn aangevangen.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel30a
  - number: 30a.2
    text: |-
      Met betrekking tot financiële verslaggeving als bedoeld in het eerste lid blijft het recht zoals dat gold voor het
      tijdstip van inwerkingtreding van deze wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel30a
  - number: '31'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel31
  - number: '32'
    text: 'Deze wet wordt aangehaald als: Wet toezicht financiële verslaggeving.'
    url: https://wetten.overheid.nl/BWBR0020369/2007-01-01#Artikel32
