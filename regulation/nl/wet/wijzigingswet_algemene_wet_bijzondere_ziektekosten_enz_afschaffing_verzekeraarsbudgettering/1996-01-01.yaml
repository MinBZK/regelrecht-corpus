preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Algemene Wet Bijzondere Ziektekosten en enige
    andere wetten te wijzigen in verband met de afschaffing van de budgettering van de kosten van verstrekkingen en
    uitkeringen en de afschaffing van de nominale premie;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007769/1996-01-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      1 Ten aanzien van de verschuldigdheid van nominale premie over periodes voorafgaande aan het tijdstip waarop
      deze wet in werking is getreden, blijft [artikel 17 van de Algemene Wet Bijzondere Ziektekosten][ref1], zoals
      dat artikel voor dat tijdstip luidde, van toepassing met dien verstande dat, in afwijking van het derde lid
      van dat artikel, door een verzekerde wiens verzekering is aangevangen voor, doch wiens inschrijving ingevolge
      [artikel 9 van de Algemene Wet Bijzondere Ziektekosten][ref2] heeft plaatsgevonden na het bedoelde tijdstip en door
      wie ingevolge deze wet niet langer nominale premie is verschuldigd, de nominale premie slechts is verschuldigd over
      een periode van ten hoogste zestig dagen voor het bedoelde tijdstip.

      2 Indien de inschrijving van een verzekerde als bedoeld in het eerste lid heeft plaatsgevonden later dan zestig
      dagen na de aanvang van de verzekering, kan het ziekenfonds, de ziektekostenverzekeraar of het uitvoerend orgaan
      de nominale premie over de in het eerste lid bedoelde periode van ten hoogste zestig dagen verhogen. De verhoging
      bedraagt ten hoogste de nominale premie die bij het ziekenfonds, de ziektekostenverzekeraar of het uitvoerend
      orgaan op de dag voorafgaande aan het tijdstip van inwerkingtreding van deze wet gold, op jaarbasis.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel9
