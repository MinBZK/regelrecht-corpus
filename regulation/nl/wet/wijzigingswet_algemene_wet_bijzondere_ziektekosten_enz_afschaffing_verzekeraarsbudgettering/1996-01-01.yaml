  - number: VII
    text: |-
      De premie, bedoeld in [artikel 17 van de Algemene Wet Bijzondere Ziektekosten][ref1], zoals die bepaling door
      deze wet is komen te luiden, is niet verschuldigd over perioden als verzekerde, voorafgaand aan de datum van
      inwerkingtreding van de in dat artikel bedoelde algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel17
