  - number: V
    text: |-
      Ten aanzien van de financiering van de kosten ingevolge de [Algemene Wet Bijzondere Ziektekosten][ref1] over
      periodes voorafgaand aan het tijdstip van de inwerkingtreding van deze wet blijft het bepaalde bij en krachtens
      [artikel 40 van de Wet financiering volksverzekeringen][ref2], zoals dat voor de inwerkingtreding van deze wet
      luidde, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel40
    url: https://wetten.overheid.nl/BWBR0007769/1996-01-01#ArtikelV
    references:
