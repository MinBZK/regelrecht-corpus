        bwb_id: BWBR0004538
        artikel: '40'
  - number: VI
    text: |-
      1 De reserves die bij het ziekenfonds, de ziektekostenverzekeraar en het uitvoerend orgaan na vaststelling van
      de uitkeringen krachtens [artikel 40 van de Wet financiering volksverzekeringen][ref1] uit het Algemeen Fonds
      Bijzondere Ziektekosten over de jaren 1992 tot en met 1995 aanwezig zijn en die uit die uitkeringen of uit de
      nominale premie, bedoeld in [artikel 17 van de Algemene Wet Bijzondere Ziektekosten][ref2] zijn gevormd, komen ten
      gunste van dat Fonds. Onder de reserves worden mede begrepen de met de genoemde uitkeringen, premie en reserves
      verkregen opbrengsten. Negatieve reserves komen niet ten laste van het Fonds.

      2 Het College voor zorgverzekeringen, genoemd in [artikel 1a van de Ziekenfondswet][ref3] stelt voor ieder
      ziekenfonds, ziektekostenverzekeraar en uitvoerend orgaan het bedrag van de reserve vast.

      3 Bij de vaststelling van het bedrag, bedoeld in het tweede lid, houdt het College voor zorgverzekeringen,
      genoemd in [artikel 1a van de Ziekenfondswet][ref4] geen rekening met de financiële gevolgen die voortvloeien
      uit een verlaging van het ingevolge [artikel 17, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref5]
      vastgestelde bedrag van de nominale premie, die heeft plaatsgevonden na 31 mei 1995 ten opzichte van het voor dat
      tijdstip door het ziekenfonds, de ziektekostenverzekeraar of het uitvoerend orgaan aan verzekerden in rekening
      gebrachte bedrag van de nominale premie.

      4 Het ingevolge het tweede lid vastgestelde bedrag wordt door het ziekenfonds, de ziektekostenverzekeraar
      en het uitvoerend orgaan binnen een door het College voor zorgverzekeringen, genoemd in
      [artikel 1a van de Ziekenfondswet][ref6] vast te stellen termijn in het Algemeen Fonds Bijzondere Ziektekosten
      gestort.

      5 Het College voor zorgverzekeringen, genoemd in [artikel 1a van de Ziekenfondswet][ref7] kan het in het tweede
      lid bedoelde bedrag verrekenen met uitkeringen en voorschotten op die uitkeringen uit het Algemeen Fonds Bijzondere
      Ziektekosten aan het ziekenfonds, de ziektekostenverzekeraar en het uitvoerend orgaan.


