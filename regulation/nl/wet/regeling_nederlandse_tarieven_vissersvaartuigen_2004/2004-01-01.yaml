articles:
  - number: '1'
    text: |-
      De in deze regeling genoemde tarieven zijn verschuldigd voor het verrichten van werkzaamheden of diensten door
      ambtenaren van Nederland.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel1
  - number: '2'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            vissersvaartuig:

              elk vaartuig dat gebezigd wordt voor het vangen van vis, walvissen, zeehonden, walrussen of andere levende
      rijkdommen van de zee;



            b
            certificaat van overeenstemming:

              het certificaat als bedoeld in [artikel 1.8 van het Vissersvaartuigenbesluit 2002][ref1];



            c
            certificaat van vrijstelling:

              het certificaat, bedoeld in [artikel 1.9 van het Vissersvaartuigenbesluit 2002][ref2];



            d
            certificaat van deugdelijkheid:

              het certificaat, bedoeld in [artikel 22 van het Vissersvaartuigenbesluit;](onbekend)



            e
            certificaat van veiligheid:

              het certificaat, bedoeld in [artikel 23 van het Vissersvaartuigenbesluit](onbekend);



            f
            certificaat van ontheffing:

              het certificaat, bedoeld in [artikel 24 van het Vissersvaartuigenbesluit](onbekend);



            g
            certificaten:

              de onder b tot en met f genoemde certificaten;



            h
            eerste onderzoek:

              het onderzoek, bedoeld in [artikel 1.12, eerste lid van het Vissersvaartuigenbesluit 2002][ref3] en in
      [artikel 12, eerste lid, onder 1°, van het Vissersvaartuigenbesluit](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1.8
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel1.9
      [ref3]: https://wetten.overheid.nl/BWBR0013342#Artikel1.12
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel2
