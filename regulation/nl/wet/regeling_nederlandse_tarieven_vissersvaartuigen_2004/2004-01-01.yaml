  - number: '3.1'
    text: |-
      Voor het onderzoek van vissersvaartuigen en de verdere werkzaamheden nodig voor de eerste afgifte van certificaten,
      is het tarief verschuldigd, genoemd in onderstaande tabel:







                    Lengte


                    geklasseerde
                    vaartuigen


                    niet-geklasseerde
                    vaartuigen






                    tot 24 meter



                    € 6.047




                    vanaf 24 meter


                    € 7.489


                    € 13.683
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel3
  - number: '3.2'
    text: |-
      Voor het onderzoek van niet-geklasseerde mosselvaartuigen met een lengte van 24 meter of meer en de verdere
      werkzaamheden nodig voor de eerste afgifte van certificaten is, in afwijking van het eerste lid, een tarief
      verschuldigd van € 11.781.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel3
  - number: '3.3'
    text: |-
      Voor het onderzoek en de verdere werkzaamheden nodig voor de afgifte van certificaten voor een vissersvaartuig dat
      reeds onderworpen is geweest aan een eerste onderzoek is, in afwijking van het eerste lid, het tarief verschuldigd,
      genoemd in onderstaande tabel:







                    Lengte


                    geklasseerde
                    vaartuigen


                    niet-geklasseerde
                    vaartuigen






                    tot 24 meter



                    € 2.364




                    vanaf 24 meter


                    € 2.539


                    € 2.913
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel3
  - number: '3.4'
    text: |-
      Voor het onderzoek nieuwbouw radio-installatie, het eerste onderzoek radio-installatie als bedoeld in
      [artikel 1.12, eerste lid, van het Visservaartuigenbesluit 2002][ref1], en een herinspectie radio-installatie aan
      boord van de schepen als bedoeld in het laatstgenoemde artikel zijn de volgende tarieven verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '1'
  - number: 3.4.a
    text: nieuwbouw radio-installatie € 1.036;
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel3
  - number: 3.4.b
    text: herinspectie radio-installatie € 130.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel3
  - number: '4.1'
    text: |-
      Voor het onderzoek van vissersvaartuigen en de verdere werkzaamheden nodig voor de vernieuwing of handhaving van
      certificaten, is jaarlijks het tarief verschuldigd, genoemd in onderstaande tabel:







                    Lengte


                    geklasseerde
                    vaartuigen


                    niet-geklasseerde
                    vaartuigen






                    tot 24 meter



                    € 1.181




                    vanaf 24 meter


                    € 1.268


                    € 1.456
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel4
  - number: '4.2'
    text: |-
      Voor het onderzoek van niet-geklasseerde sportvissers- of recreatievaartuigen en de verdere werkzaamheden nodig
      voor de vernieuwing of handhaving van certificaten is, in afwijking van het eerste lid, jaarlijks het volgende
      tarief verschuldigd:
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel4
  - number: 4.2.a
    text: voor vaartuigen met een lengte tot 24 meter € 1.515;
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel4
  - number: 4.2.b
    text: voor vaartuigen met een lengte vanaf 24 meter € 1.823.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel4
  - number: '4.3'
    text: Bij tussentijdse verkoop van het vaartuig vindt geen verrekening van het tarief met de koper of verkoper plaats.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel4
  - number: '4.4'
    text: |-
      Voor een jaarlijkse inspectie radio-installatie, het periodieke onderzoek als bedoeld in
      [artikel 1.12, tweede lid, onderdeel c, van het Visservaartuigenbesluit 2002][ref1] en een herinspectie radio-
      installatie aan boord van de schepen als bedoeld in het laatstgenoemde artikel zijn de volgende tarieven
      verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013342
        artikel: '1'
  - number: 4.4.a
    text: jaarlijkse inspectie radio-installatie € 255;
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel4
  - number: 4.4.b
    text: herinspectie radio-installatie € 130.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel4
  - number: '5.1'
    text: |-
      Voor het onderzoek van vissersvaartuigen en de verdere werkzaamheden nodig voor de afgifte van een vergunning
      krachtens [artikel 2bis van de Schepenwet][ref1], is het volgende tarief verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel2bis
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: 2bis
  - number: 5.1.a
    text: voor vaartuigen met een lengte tot 24 meter € 342;
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel5
  - number: 5.1.b
    text: voor vaartuigen met een lengte vanaf 24 meter € 373.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het tarief, bedoeld in het eerste lid, is niet verschuldigd indien het een vergunning betreft uitsluitend bestemd
      voor het maken van een proefvaart dan wel het ondernemen van een reis uit een haven in Nederland, met de bedoeling
      het vaartuig gereed te maken voor het verkrijgen van een certificaat van deugdelijkheid, een certificaat van
      overeenstemming of een certificaat van vrijstelling.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel5
  - number: '6.1'
    text: |-
      Voor het onderzoek aan boord en de verdere werkzaamheden nodig voor het verstrekken van een certificaat van
      ontheffing of een certificaat van vrijstelling, voor het verstrekken van een extra exemplaar of een tussentijdse
      vervanging van een certificaat, alsmede voor de afgifte van een certificaat zonder dat hiervoor een onderzoek aan
      boord plaatsvindt, is een tarief verschuldigd van € 174.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel6
  - number: '6.2'
    text: |-
      Voor de vervanging van de in deze regeling genoemde certificaten die door een scheepsongeval verloren zijn gegaan,
      is geen vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel6
  - number: '7'
    text: |-
      Voor werkzaamheden voortvloeiende uit het bepaalde bij of krachtens het [Vissersvaartuigenbesluit][ref1], die niet
      op grond van een van de overige artikelen van deze regeling in rekening worden gebracht, is een tarief verschuldigd
      van € 76 per uur per ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004607
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004607
  - number: '8.1'
    text: |-
      Indien een onderzoek als bedoeld in deze regeling geheel of gedeeltelijk in het buitenland wordt uitgevoerd en de
      voor het betreffende onderzoek vastgestelde termijn, opgenomen in de onderstaande tabel, wordt overschreden, is
      per termijnoverschrijdende dag een aanvullend tarief verschuldigd van € 612. Onderzoekstermijnen: deze termijnen
      beginnen op de dag van vertrek uit Nederland en eindigen op de dag van terugkomst in Nederland.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel8
  - number: '8.2'
    text: |-
      De eventuele reis- en verblijfskosten van de ambtenaar ten behoeve van de in deze regeling genoemde onderzoeken
      in het buitenland komen voor rekening van de aanvrager van het certificaat. Deze kosten worden afzonderlijk in
      rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien de in deze regeling genoemde onderzoeken geheel of gedeeltelijk worden uitgevoerd op werkdagen tussen 18.00
      uur en 08.00 uur, op een zaterdag, op een zondag of op een in het [Algemeen Rijksambtenarenreglement][ref1] daaraan
      gelijkgestelde dag, is een aanvullend tarief verschuldigd van € 37 per uur per ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '9.2'
    text: |-
      Het tarief, genoemd in het eerste lid, is eveneens verschuldigd voor uitgevoerde onderzoeken in het buitenland
      buiten de daar ter plaatse geldende werktijden.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel9
  - number: '10'
    text: |-
      De [Regeling Nederlandse tarieven vissersvaartuigen 2003][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0014423
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014423
  - number: '11'
    text: Deze regeling treedt in werking met ingang van 1 januari 2004.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Regeling Nederlandse tarieven vissersvaartuigen 2004.'
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel12
