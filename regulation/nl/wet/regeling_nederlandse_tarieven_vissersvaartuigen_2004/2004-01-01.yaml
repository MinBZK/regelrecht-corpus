        artikel: '1.12'
  - number: '4'
    text: |-
      1 Voor het onderzoek van vissersvaartuigen en de verdere werkzaamheden nodig voor de vernieuwing of handhaving van
      certificaten, is jaarlijks het tarief verschuldigd, genoemd in onderstaande tabel:









                    Lengte


                    geklasseerde
                    vaartuigen


                    niet-geklasseerde
                    vaartuigen






                    tot 24 meter



                    € 1.181




                    vanaf 24 meter


                    € 1.268


                    € 1.456






      2 Voor het onderzoek van niet-geklasseerde sportvissers- of recreatievaartuigen en de verdere werkzaamheden nodig
      voor de vernieuwing of handhaving van certificaten is, in afwijking van het eerste lid, jaarlijks het volgende
      tarief verschuldigd:

      a. voor vaartuigen met een lengte tot 24 meter € 1.515;

      b. voor vaartuigen met een lengte vanaf 24 meter € 1.823.

      3 Bij tussentijdse verkoop van het vaartuig vindt geen verrekening van het tarief met de koper of verkoper plaats.

      4 Voor een jaarlijkse inspectie radio-installatie, het periodieke onderzoek als bedoeld in
      [artikel 1.12, tweede lid, onderdeel c, van het Visservaartuigenbesluit 2002][ref1] en een herinspectie radio-
      installatie aan boord van de schepen als bedoeld in het laatstgenoemde artikel zijn de volgende tarieven
      verschuldigd:

      a. jaarlijkse inspectie radio-installatie € 255;

      b. herinspectie radio-installatie € 130.

      Indien het onderzoek van een radio-installatie aan boord van een in Nederland thuis behorend schip geheel of
      gedeeltelijk in het buitenland plaatsvindt is een toeslag verschuldigd van 25% van het desbetreffende tarief
      genoemd onder a of b.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1.12
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel4
