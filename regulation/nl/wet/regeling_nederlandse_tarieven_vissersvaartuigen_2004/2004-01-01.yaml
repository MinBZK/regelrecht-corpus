        artikel: '1.12'
  - number: '5'
    text: |-
      1 Voor het onderzoek van vissersvaartuigen en de verdere werkzaamheden nodig voor de afgifte van een vergunning
      krachtens [artikel 2bis van de Schepenwet][ref1], is het volgende tarief verschuldigd:

      a. voor vaartuigen met een lengte tot 24 meter € 342;

      b. voor vaartuigen met een lengte vanaf 24 meter € 373.

      2 Het tarief, bedoeld in het eerste lid, is niet verschuldigd indien het een vergunning betreft uitsluitend bestemd
      voor het maken van een proefvaart dan wel het ondernemen van een reis uit een haven in Nederland, met de bedoeling
      het vaartuig gereed te maken voor het verkrijgen van een certificaat van deugdelijkheid, een certificaat van
      overeenstemming of een certificaat van vrijstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel2bis
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: 2bis
  - number: '6'
    text: |-
      1 Voor het onderzoek aan boord en de verdere werkzaamheden nodig voor het verstrekken van een certificaat van
      ontheffing of een certificaat van vrijstelling, voor het verstrekken van een extra exemplaar of een tussentijdse
      vervanging van een certificaat, alsmede voor de afgifte van een certificaat zonder dat hiervoor een onderzoek aan
      boord plaatsvindt, is een tarief verschuldigd van € 174.

      2 Voor de vervanging van de in deze regeling genoemde certificaten die door een scheepsongeval verloren zijn
      gegaan, is geen vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel6
  - number: '7'
    text: |-
      Voor werkzaamheden voortvloeiende uit het bepaalde bij of krachtens het [Vissersvaartuigenbesluit][ref1], die niet
      op grond van een van de overige artikelen van deze regeling in rekening worden gebracht, is een tarief verschuldigd
      van € 76 per uur per ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004607
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004607
  - number: '8'
    text: |-
      1 Indien een onderzoek als bedoeld in deze regeling geheel of gedeeltelijk in het buitenland wordt uitgevoerd en de
      voor het betreffende onderzoek vastgestelde termijn, opgenomen in de onderstaande tabel, wordt overschreden, is per
      termijnoverschrijdende dag een aanvullend tarief verschuldigd van € 612.

      Onderzoekstermijnen: deze termijnen beginnen op de dag van vertrek uit Nederland en eindigen op de dag van
      terugkomst in Nederland.









                  Nieuwbouw


                  Lengte


                  Aantal dagen






                  a. niet geklasseerde vissersvaartuigen


                  < 24 meter


                  14




                  b. niet geklasseerde vissersvaartuigen


                  > 24 meter


                  22




                  c. niet geklasseerde mosselvaartuigen


                  > 24 meter


                  12




                  d. geklasseerde vissersvaartuigen


                  > 24 meter


                  18






      2 De eventuele reis- en verblijfskosten van de ambtenaar ten behoeve van de in deze regeling genoemde onderzoeken
      in het buitenland komen voor rekening van de aanvrager van het certificaat. Deze kosten worden afzonderlijk in
      rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel8
  - number: '9'
    text: |-
      1 Indien de in deze regeling genoemde onderzoeken geheel of gedeeltelijk worden uitgevoerd op werkdagen tussen
      18.00 uur en 08.00 uur, op een zaterdag, op een zondag of op een in het [Algemeen Rijksambtenarenreglement][ref1]
      daaraan gelijkgestelde dag, is een aanvullend tarief verschuldigd van € 37 per uur per ambtenaar.

      2 Het tarief, genoemd in het eerste lid, is eveneens verschuldigd voor uitgevoerde onderzoeken in het buitenland
      buiten de daar ter plaatse geldende werktijden.


