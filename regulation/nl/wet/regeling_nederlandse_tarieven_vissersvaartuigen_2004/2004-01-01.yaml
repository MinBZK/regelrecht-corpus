  - number: '3'
    text: |-
      1 Voor het onderzoek van vissersvaartuigen en de verdere werkzaamheden nodig voor de eerste afgifte van
      certificaten, is het tarief verschuldigd, genoemd in onderstaande tabel:









                    Lengte


                    geklasseerde
                    vaartuigen


                    niet-geklasseerde
                    vaartuigen






                    tot 24 meter



                    € 6.047




                    vanaf 24 meter


                    € 7.489


                    € 13.683






      2 Voor het onderzoek van niet-geklasseerde mosselvaartuigen met een lengte van 24 meter of meer en de verdere
      werkzaamheden nodig voor de eerste afgifte van certificaten is, in afwijking van het eerste lid, een tarief
      verschuldigd van € 11.781.

      3 Voor het onderzoek en de verdere werkzaamheden nodig voor de afgifte van certificaten voor een vissersvaartuig
      dat reeds onderworpen is geweest aan een eerste onderzoek is, in afwijking van het eerste lid, het tarief
      verschuldigd, genoemd in onderstaande tabel:









                    Lengte


                    geklasseerde
                    vaartuigen


                    niet-geklasseerde
                    vaartuigen






                    tot 24 meter



                    € 2.364




                    vanaf 24 meter


                    € 2.539


                    € 2.913






      4 Voor het onderzoek nieuwbouw radio-installatie, het eerste onderzoek radio-installatie als bedoeld in
      [artikel 1.12, eerste lid, van het Visservaartuigenbesluit 2002][ref1], en een herinspectie radio-installatie aan
      boord van de schepen als bedoeld in het laatstgenoemde artikel zijn de volgende tarieven verschuldigd:

      a. nieuwbouw radio-installatie € 1.036;

      b. herinspectie radio-installatie € 130.

      Indien het onderzoek van een radio-installatie aan boord van een in Nederland thuis behorend schip geheel of
      gedeeltelijk in het buitenland plaatsvindt is een toeslag verschuldigd van 25% van het desbetreffende tarief
      genoemd onder a of b.


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1.12
    url: https://wetten.overheid.nl/BWBR0016075/2004-01-01#Artikel3
    references:
      - id: ref1
