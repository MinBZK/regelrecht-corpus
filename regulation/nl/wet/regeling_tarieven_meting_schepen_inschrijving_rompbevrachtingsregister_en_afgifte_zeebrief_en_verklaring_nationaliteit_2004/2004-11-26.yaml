        bwb_id: BWBR0016080
        hoofdstuk: '2'
  - number: '16'
    text: |-
      1 Indien de in de [hoofdstukken 1][ref1] en [2 van deze regeling][ref2] genoemde onderzoeken geheel of gedeeltelijk
      buiten Nederland worden uitgevoerd, is een aanvullend tarief verschuldigd van € 59 per uur per ambtenaar voor de
      reistijd buiten Nederland en voor de eventuele wachttijd tijdens het verblijf buiten Nederland. Bij de berekening
      van de reistijd buiten Nederland en eventuele wachttijd geldt een maximum van acht uren per etmaal.

      2 De reis- en verblijfkosten van de ambtenaar, ten behoeve van de in de [hoofdstukken 1][ref3] en
      [2 van deze regeling][ref4] genoemde onderzoeken buiten Nederland, komen voor rekening van de aanvrager. Deze
      kosten worden afzonderlijk in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0016080#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0016080#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0016080#Hoofdstuk1
      [ref4]: https://wetten.overheid.nl/BWBR0016080#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0016080/2004-11-26#Artikel16
