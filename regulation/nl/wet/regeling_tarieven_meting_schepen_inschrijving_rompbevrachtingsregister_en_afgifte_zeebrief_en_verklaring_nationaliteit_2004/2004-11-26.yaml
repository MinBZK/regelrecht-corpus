  - number: '12'
    text: |-
      1 Voor de werkzaamheden ten behoeve van de inschrijving van een zeeschip in het rompbevrachtingsregister, bedoeld
      in [artikel 2, eerste lid, van de Wet nationaliteit zeeschepen in rompbevrachting][ref1], is de rompbevrachter een
      tarief verschuldigd van € 921.

      2 Voor het aanbrengen van een wijziging in de inschrijving, genoemd in het eerste lid, is de rompbevrachter een
      tarief verschuldigd van € 108.

      3 In afwijking van het tweede lid is de rompbevrachter voor het aanbrengen van een wijziging die betrekking heeft
      op de dagtekening of de tijdsduur van de rompbevrachtingsovereenkomst een tarief verschuldigd van € 308.

      4 Voor de werkzaamheden ten behoeve van de afgifte van een gewaarmerkt uittreksel uit het rompbevrachtingsregister,
      bedoeld in het eerste lid, is de rompbevrachter een tarief verschuldigd van € 66.


      [ref1]: https://wetten.overheid.nl/BWBR0005681#Artikel2
    url: https://wetten.overheid.nl/BWBR0016080/2004-11-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005681
        artikel: '2'
  - number: '13'
    text: |-
      Voor de werkzaamheden ten behoeve van de afgifte van een verklaring als
      bedoeld in [artikel 311a, eerste lid, van het Wetboek van Koophandel][ref1] of
      [artikel 37, eerste lid, van de Maatregel teboekgestelde schepen 1992][ref2], is de aanvrager het volgende tarief
      verschuldigd:

      a. indien de aanvraag betrekking heeft op een schip dat uitsluitend of mede in de uitoefening van een beroep of
      bedrijf wordt gebruikt € 118;

      b. indien de aanvraag betrekking heeft op een schip dat uitsluitend anders dan in de uitoefening van een beroep of
      bedrijf wordt gebruikt € 74.


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311a
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel37
    url: https://wetten.overheid.nl/BWBR0016080/2004-11-26#Artikel13
