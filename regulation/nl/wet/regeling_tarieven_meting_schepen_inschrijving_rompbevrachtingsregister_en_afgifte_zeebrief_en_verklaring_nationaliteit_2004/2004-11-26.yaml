  - number: '17'
    text: |-
      Indien de in deze regeling genoemde werkzaamheden geheel of gedeeltelijk worden uitgevoerd op werkdagen tussen
      18.00 en 08.00 uur, op een zaterdag, op een zondag of op een in het [Algemeen Rijksambtenarenreglement][ref1]
      daaraan gelijkgestelde dag, is een aanvullend tarief verschuldigd van € 29 per uur per ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0016080/2004-11-26#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '18'
    text: |-
      Indien werkzaamheden ten behoeve van de afgifte van documenten als bedoeld in deze regeling, buiten toedoen van
      de ambtenaren van de divisie Scheepvaart van de Inspectie Verkeer en Waterstaat, niet leiden tot afgifte van dat
      document, is het volgende tarief verschuldigd:

      a. indien de werkzaamheden niet volledig zijn uitgevoerd € 59 per uur per ambtenaar;

      b. indien de werkzaamheden volledig zijn uitgevoerd, het tarief dat is vastgesteld voor de afgifte van het
      document.
    url: https://wetten.overheid.nl/BWBR0016080/2004-11-26#Artikel18
  - number: '19'
    text: |-
      Voor werkzaamheden voortvloeiende uit het bepaalde bij of krachtens de [Meetbrievenwet 1981][ref1], de
      [Binnenschepenwet][ref2], de [Wet nationaliteit zeeschepen in rompbevrachting][ref3], de [Zeebrievenwet][ref4]
      of de [Maatregel teboekgestelde schepen 1992][ref5], die niet op grond van een ander artikel van deze regeling in
      rekening worden gebracht, is een tarief verschuldigd van € 59 per uur per ambtenaar.


