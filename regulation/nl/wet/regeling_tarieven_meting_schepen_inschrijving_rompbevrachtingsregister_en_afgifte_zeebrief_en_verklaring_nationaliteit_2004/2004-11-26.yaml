  - number: '15'
    text: |-
      Indien de eigenaar een verzoek indient voor de meting of hermeting van twee of meer van zijn schepen en deze
      metingen gelijktijdig op één locatie kunnen worden uitgevoerd voor één rekening, is voor het eerste schip een
      tarief als bedoeld in de [hoofdstukken 1][ref1] en [2][ref2] en voor de volgende schepen een tarief van € 59 per
      uur per ambtenaar verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0016080#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0016080#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0016080/2004-11-26#Artikel15
