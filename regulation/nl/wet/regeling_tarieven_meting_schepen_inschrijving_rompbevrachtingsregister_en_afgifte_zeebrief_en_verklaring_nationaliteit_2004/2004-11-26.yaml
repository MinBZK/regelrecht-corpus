  - number: '7'
    text: |-
      1 In dit hoofdstuk zijn de begripsomschrijvingen, genoemd in
      [artikel 1 van het Metingsbesluit Binnenvaartuigen 1978][ref1], van toepassing.

      2 In dit hoofdstuk wordt voorts verstaan onder:



            a
            meting:

              werkzaamheden ten behoeve van de afgifte van een meetbrief voor een schip, waarvoor niet eerder een
      Nederlandse meetbrief is afgegeven;



            b
            hermeting:

              werkzaamheden ten behoeve van de afgifte van een meetbrief voor een schip dat een verbouwing heeft
      ondergaan die van invloed is geweest op de ledige diepgang van het schip, en waarvoor eerder een Nederlandse
      meetbrief is afgegeven;



            c
            controlemeting:

              werkzaamheden ten behoeve van de verlenging van de geldigheidsduur van een meetbrief voor een schip,
      dat sedert de afgifte van die meetbrief geen verbouwing heeft ondergaan die van invloed is geweest op de ledige
      diepgang van het schip;



            d
            ponton:

              blokvormig schip zonder mogelijkheid om benedendeks lading te vervoeren;



            e
            zusterschip:

              een identiek schip dat volgens dezelfde bouwtekening is gebouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel1
    url: https://wetten.overheid.nl/BWBR0016080/2004-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '1'
