      1 In dit hoofdstuk zijn de begripsomschrijvingen, genoemd in [artikel 1 van de Meetbrievenwet 1981][ref1], en
      [artikel 1 van de Regeling metingsvoorschriften][ref2], van toepassing.

      2 In dit hoofdstuk wordt voorts verstaan onder:



            a
            meting:

              werkzaamheden ten behoeve van de afgifte van:
              een Internationale Meetbrief (1969);
      een bijzondere meetbrief voor een schip, waarvoor niet eerder een Internationale Meetbrief (1969) of bijzondere
      meetbrief is afgegeven;



            b
            hermeting:

              werkzaamheden ten behoeve van de afgifte van:
              een Internationale Meetbrief (1969) voor een schip, waarvoor reeds eerder een Internationale Meetbrief
      (1969), bijzondere meetbrief of een meetbrief, bedoeld in het Verdrag van Oslo 1947, is afgegeven;
      een bijzondere meetbrief voor een schip, waarvoor reeds eerder een Internationale Meetbrief (1969), bijzondere
      meetbrief of een meetbrief, bedoeld in het Verdrag van Oslo 1947, is afgegeven;



            c
            ponton:

              blokvormig schip zonder mogelijkheid om benedendeks lading te vervoeren;



            d
            zusterschip:

              een identiek schip dat volgens dezelfde bouwtekening is gebouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006017#Artikel1
