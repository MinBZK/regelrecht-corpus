preamble:
  text: |-
    Gelet op de artikelen 4, tweede lid, 17, eerste lid, en 21, eerste lid, van de Meetbrievenwet 1981, artikel
    12c, derde lid, van de Binnenschepenwet, de artikelen 2, derde lid, en 10 van de Wet nationaliteit zeeschepen in
    rompbevrachting, de artikelen 6, derde lid, en6a, derde lid, van de Zeebrievenwet, artikel 311a, vierde lid, van
    het Wetboek van Koophandel en artikel 37, derde lid, van de Maatregel teboekgestelde schepen 1992;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit hoofdstuk zijn de begripsomschrijvingen, genoemd in [artikel 1 van de Meetbrievenwet 1981][ref1], en
      [artikel 1 van de Regeling metingsvoorschriften][ref2], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006017#Artikel1
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006017
        artikel: '1'
  - number: '1.2'
    text: 'In dit hoofdstuk wordt voorts verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel1
  - number: '2.1'
    text: |-
      Voor de meting of de hermeting van een ponton of een ander schip ten behoeve van de afgifte van een Internationale
      Meetbrief (1969) is het tarief verschuldigd, genoemd in de onderstaande tabel:










