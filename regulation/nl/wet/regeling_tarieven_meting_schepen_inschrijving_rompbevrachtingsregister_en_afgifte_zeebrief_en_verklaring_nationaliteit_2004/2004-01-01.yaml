  - number: '21'
    text: Deze regeling treedt in werking met ingang van 1 januari 2004.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel21
  - number: '22'
    text: |-
      Deze regeling wordt aangehaald als: Regeling tarieven meting schepen, inschrijving rompbevrachtingsregister en
      afgifte zeebrief en verklaring nationaliteit 2004.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel22
