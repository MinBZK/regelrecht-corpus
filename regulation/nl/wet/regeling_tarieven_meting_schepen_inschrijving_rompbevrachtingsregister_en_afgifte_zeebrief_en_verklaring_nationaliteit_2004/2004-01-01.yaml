                    € 3.585


                    € 715


                    € 1.735
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel2
  - number: '2.2'
    text: 'In afwijking van het eerste lid is voor de meting of de hermeting van:'
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel2
  - number: 2.2.a
    text: een vissersvaartuig met een lengte over alles van minder dan 15 meter een tarief verschuldigd van € 244;
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel2
  - number: 2.2.b
    text: een pleziervaartuig met een lengte van minder dan 24 meter een tarief verschuldigd van € 229.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel2
  - number: '2.3'
    text: |-
      Bij de meting van zusterschepen is voor het eerste schip het tarief, genoemd in het eerste lid, verschuldigd. Voor
      de meting van de volgende schepen is een tarief verschuldigd van € 624 per schip.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel2
  - number: '3.1'
    text: |-
      Voor de meting of de hermeting van een ponton of een ander schip, ten behoeve van de afgifte van een bijzondere
      meetbrief, speciaal ingericht voor gebruik bij de vaart door het Suezkanaal, is het tarief verschuldigd, genoemd in
      de onderstaande tabel:
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel3
  - number: '3.2'
    text: |-
      Bij de meting van zusterschepen is voor het eerste schip het tarief, genoemd in het eerste lid, verschuldigd. Voor
      de meting van de volgende schepen is een tarief verschuldigd van € 1.316 per schip.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel3
  - number: '3.3'
    text: Het tweede lid is niet van toepassing op pontons met een lengte van minder dan 24 meter.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel3
  - number: '3.4'
    text: |-
      In afwijking van het eerste lid is, indien bij het omvlaggen van een schip de buitenlandse meetgegevens worden
      overgenomen, voor de controlewerkzaamheden een tarief verschuldigd van € 988.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel3
  - number: '4'
    text: |-
      Voor de werkzaamheden ten behoeve van de afgifte van een inhoudsverklaring voor gebruik bij de vaart door het
      Panamakanaal (PC/UMS Documentation of Total Volume) is een tarief verschuldigd van € 295.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel4
  - number: '5'
    text: |-
      Voor de controlewerkzaamheden ten behoeve van de afgifte van een Internationale Meetbrief (1969) of een bijzondere
      meetbrief is, indien bij het omvlaggen van een schip de buitenlandse meetgegevens worden overgenomen of indien een
      schip door een daartoe bevoegde buitenlandse autoriteit ingevolge [artikel 8 van de Meetbrievenwet 1981][ref1] en
      de [Regeling metingsvoorschriften][ref2] is gemeten of hermeten, een tarief verschuldigd van € 624.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006017
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006017
  - number: '6.1'
    text: |-
      Voor de werkzaamheden ten behoeve van de afgifte van documenten, zonder dat hiervoor een meting of hermeting
      plaatsvindt, is het tarief verschuldigd, genoemd in de onderstaande tabel:
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel6
  - number: '6.2'
    text: |-
      Voor het aanbrengen van een wijziging in een Internationale Meetbrief (1969), een bijzondere meetbrief of een
      bijzondere meetbrief als bedoeld in [artikel 3][ref1], zonder dat hiervoor een meting of hermeting plaatsvindt, is
      een tarief verschuldigd van € 29.


      [ref1]: https://wetten.overheid.nl/BWBR0016080#Artikel3
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016080
        artikel: '3'
        hoofdstuk: '1'
  - number: '7.1'
    text: |-
      In dit hoofdstuk zijn de begripsomschrijvingen, genoemd in
      [artikel 1 van het Metingsbesluit Binnenvaartuigen 1978][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003246#Artikel1
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003246
        artikel: '1'
  - number: '7.2'
    text: 'In dit hoofdstuk wordt voorts verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel7
  - number: '8.1'
    text: |-
      Voor de meting of de hermeting van een ponton of een ander schip ten behoeve van de afgifte van een meetbrief,
      hieronder begrepen het aanbrengen van ijkmerken of ijkplaten, is het tarief verschuldigd, genoemd in de
      onderstaande tabel:
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid is voor de meting of de hermeting van een schip dat niet bestemd is voor het
      vervoer van goederen een tarief verschuldigd van € 554.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel8
  - number: '8.3'
    text: |-
      In afwijking van het eerste lid is voor de hermeting van een schip waarbij de inzinking niet meer dan 2 cm afwijkt
      van de voorgaande meting het tarief verschuldigd, genoemd in de onderstaande tabel:
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel8
  - number: '8.4'
    text: |-
      Bij de meting van zusterschepen is voor het eerste schip het tarief, genoemd in het eerste lid, verschuldigd. Voor
      de meting van de volgende schepen is het tarief verschuldigd, genoemd in de onderstaande tabel:
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel8
  - number: '8.5'
    text: Voor de werkzaamheden ten behoeve van een controlemeting is een tarief verschuldigd van € 272.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel8
  - number: '9'
    text: |-
      Voor het bepalen van de verplaatsing zonder aftrek van het niet-waterdichte gedeelte van het laadruim van een schip
      voorzien van bodemkleppen onder het laadruim is naast het tarief, genoemd in [artikel 8][ref1], een aanvullend
      tarief verschuldigd van € 112.


      [ref1]: https://wetten.overheid.nl/BWBR0016080#Artikel8
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016080
        artikel: '8'
        hoofdstuk: '2'
  - number: '10'
    text: |-
      Voor het aanbrengen van een extra ijkmerk, ijkplaat of ijkschaal, of het opnieuw aanbrengen van een ijkmerk,
      ijkplaat of ijkschaal is, naast het tarief, genoemd in [artikel 8][ref1], het volgende tarief verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0016080#Artikel8
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016080
        artikel: '8'
        hoofdstuk: '2'
  - number: 10.a
    text: indien de werkzaamheden gelijktijdig met de meting, de hermeting of de controlemeting plaatsvinden, € 59 per schip;
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel10
  - number: 10.b
    text: |-
      indien de werkzaamheden niet gelijktijdig met de meting, de hermeting of de controlemeting plaatsvinden, € 225
      per schip.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel10
  - number: '11.1'
    text: |-
      Voor de werkzaamheden ten behoeve van de afgifte van documenten, zonder dat hiervoor een meting of hermeting
      plaatsvindt, is het tarief verschuldigd, genoemd in de onderstaande tabel:
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel11
  - number: '11.2'
    text: |-
      Voor het aanbrengen van een wijziging in een meetbrief, zonder dat hiervoor een meting of hermeting plaatsvindt, is
      een tarief verschuldigd van € 29.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel11
  - number: '12.1'
    text: |-
      Voor de werkzaamheden ten behoeve van de inschrijving van een zeeschip in het rompbevrachtingsregister, bedoeld
      in [artikel 2, eerste lid, van de Wet nationaliteit zeeschepen in rompbevrachting][ref1], is de rompbevrachter een
      tarief verschuldigd van € 921.


      [ref1]: https://wetten.overheid.nl/BWBR0005681#Artikel2
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005681
        artikel: '2'
  - number: '12.2'
    text: |-
      Voor het aanbrengen van een wijziging in de inschrijving, genoemd in het eerste lid, is de rompbevrachter een
      tarief verschuldigd van € 108.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel12
  - number: '12.3'
    text: |-
      In afwijking van het tweede lid is de rompbevrachter voor het aanbrengen van een wijziging die betrekking heeft op
      de dagtekening of de tijdsduur van de rompbevrachtingsovereenkomst een tarief verschuldigd van € 308.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel12
  - number: '12.4'
    text: |-
      Voor de werkzaamheden ten behoeve van de afgifte van een gewaarmerkt uittreksel uit het rompbevrachtingsregister,
      bedoeld in het eerste lid, is de rompbevrachter een tarief verschuldigd van € 66.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel12
  - number: '13'
    text: |-
      Voor de werkzaamheden ten behoeve van de afgifte van een verklaring als
      bedoeld in [artikel 311a, eerste lid, van het Wetboek van Koophandel][ref1] of
      [artikel 37, eerste lid, van de Maatregel teboekgestelde schepen 1992][ref2], is de aanvrager het volgende tarief
      verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel311a
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel37
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: 311a
      - id: ref2
        bwb_id: BWBR0005260
        artikel: '37'
  - number: 13.a
    text: |-
      indien de aanvraag betrekking heeft op een schip dat uitsluitend of mede in de uitoefening van een beroep of
      bedrijf wordt gebruikt € 118;
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel13
  - number: 13.b
    text: |-
      indien de aanvraag betrekking heeft op een schip dat uitsluitend anders dan in de uitoefening van een beroep of
      bedrijf wordt gebruikt € 74.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel13
  - number: '14'
    text: |-
      Voor de werkzaamheden ten behoeve van de afgifte van een zeebrief als bedoeld in [artikel 6, derde lid][ref1],
      en[ 6a, derde lid, van de Zeebrievenwet][ref2], of een voorlopige zeebrief als bedoeld in de [artikelen 4][ref3] en
      [4a van de Zeebrievenwet][ref4], is een tarief verschuldigd van € 82.


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001933#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0001933#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0001933#Artikel4a
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001933
        artikel: 6a
      - id: ref3
        bwb_id: BWBR0001933
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0001933
        artikel: 4a
  - number: '15'
    text: |-
      Indien de eigenaar een verzoek indient voor de meting of hermeting van twee of meer van zijn schepen en deze
      metingen gelijktijdig op één locatie kunnen worden uitgevoerd voor één rekening, is voor het eerste schip een
      tarief als bedoeld in de [hoofdstukken 1][ref1] en [2][ref2] en voor de volgende schepen een tarief van € 59 per
      uur per ambtenaar verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0016080#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0016080#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0016080
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0016080
        hoofdstuk: '2'
  - number: '16.1'
    text: |-
      Indien de in de [hoofdstukken 1][ref1] en [2 van deze regeling][ref2] genoemde onderzoeken geheel of gedeeltelijk
      buiten Nederland worden uitgevoerd, is een aanvullend tarief verschuldigd van € 59 per uur per ambtenaar voor de
      reistijd buiten Nederland en voor de eventuele wachttijd tijdens het verblijf buiten Nederland. Bij de berekening
      van de reistijd buiten Nederland en eventuele wachttijd geldt een maximum van acht uren per etmaal.


      [ref1]: https://wetten.overheid.nl/BWBR0016080#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0016080#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016080
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0016080
        hoofdstuk: '2'
  - number: '16.2'
    text: |-
      De reis- en verblijfkosten van de ambtenaar, ten behoeve van de in de [hoofdstukken 1][ref1] en
      [2 van deze regeling][ref2] genoemde onderzoeken buiten Nederland, komen voor rekening van de aanvrager. Deze
      kosten worden afzonderlijk in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0016080#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0016080#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016080
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0016080
        hoofdstuk: '2'
  - number: '17'
    text: |-
      Indien de in deze regeling genoemde werkzaamheden geheel of gedeeltelijk worden uitgevoerd op werkdagen tussen
      18.00 en 08.00 uur, op een zaterdag, op een zondag of op een in het [Algemeen Rijksambtenarenreglement][ref1]
      daaraan gelijkgestelde dag, is een aanvullend tarief verschuldigd van € 29 per uur per ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '18'
    text: |-
      Indien werkzaamheden ten behoeve van de afgifte van documenten als bedoeld in deze regeling, buiten toedoen
      van de ambtenaren van de scheepvaartinspectie, niet leiden tot afgifte van dat document, is het volgende tarief
      verschuldigd:
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel18
  - number: 18.a
    text: indien de werkzaamheden niet volledig zijn uitgevoerd € 59 per uur per ambtenaar;
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel18
  - number: 18.b
    text: indien de werkzaamheden volledig zijn uitgevoerd, het tarief dat is vastgesteld voor de afgifte van het document.
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel18
  - number: '19'
    text: |-
      Voor werkzaamheden voortvloeiende uit het bepaalde bij of krachtens de [Meetbrievenwet 1981][ref1], de
      [Binnenschepenwet][ref2], de [Wet nationaliteit zeeschepen in rompbevrachting][ref3], de [Zeebrievenwet][ref4]
      of de [Maatregel teboekgestelde schepen 1992][ref5], die niet op grond van een ander artikel van deze regeling in
      rekening worden gebracht, is een tarief verschuldigd van € 59 per uur per ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003378
      [ref2]: https://wetten.overheid.nl/BWBR0003443
      [ref3]: https://wetten.overheid.nl/BWBR0005681
      [ref4]: https://wetten.overheid.nl/BWBR0001933
      [ref5]: https://wetten.overheid.nl/BWBR0005260
    url: https://wetten.overheid.nl/BWBR0016080/2004-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003378
      - id: ref2
        bwb_id: BWBR0003443
      - id: ref3
        bwb_id: BWBR0005681
      - id: ref4
        bwb_id: BWBR0001933
      - id: ref5
        bwb_id: BWBR0005260
  - number: '20'
    text: |-
      De __REF000___________________________________________________________________________________________________________
      _________________ wordt ingetrokken.


