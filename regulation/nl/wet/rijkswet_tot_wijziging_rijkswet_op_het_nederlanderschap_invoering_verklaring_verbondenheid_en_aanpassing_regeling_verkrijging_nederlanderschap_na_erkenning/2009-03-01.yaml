  - number: IIb
    text: |-
      Indien het op 14 december 2004 door de leden Wolfsen en Luchtenveld ingediende voorstel van wet tot aanvulling
      van de Algemene wet bestuursrecht met de mogelijkheid van een dwangsom bij niet tijdig beslissen door een
      bestuursorgaan (Wet dwangsom bij niet tijdig beslissen) (Kamerstukken II 2004/05, 29 934, nr. 2) tot wet is
      verheven en in werking is getreden, vinden de [artikelen 4:16 tot en met 4:20 Algemene wet bestuursrecht][ref1]
      geen toepassing ten aanzien van beschikkingen op verzoeken tot naturalisatie als bedoeld in
      [artikel 7 van de Rijkswet op het Nederlanderschap][ref2], ingediend op de Nederlandse Antillen of Aruba, en ten
      aanzien van beslissingen op bezwaar tegen zodanige beschikkingen, totdat bij Koninklijk Besluit daartoe een datum
      is vastgesteld, die voor elk land afzonderlijk kan worden bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel416
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel7
    url: https://wetten.overheid.nl/BWBR0024168/2009-03-01#ArtikelIIb
