  - number: III
    text: |-
      De in [artikel I, onderdelen A en C tot en met J][ref1], genoemde wijzigingen zijn niet van toepassing op
      verklaringen tot verkrijging en verzoeken om verlening van het Nederlanderschap ingediend vóór de datum van
      inwerkingtreding van deze Rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0024168#ArtikelI
    url: https://wetten.overheid.nl/BWBR0024168/2009-03-01#ArtikelIII
