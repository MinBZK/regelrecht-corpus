preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Rijkswet op het Nederlanderschap te wijzigen
    teneinde een verklaring van verbondenheid onderdeel te laten zijn van de verkrijging van het Nederlanderschap
    anders dan van rechtswege en tot aanpassing van de regeling van de verkrijging van het Nederlanderschap na
    erkenning;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024168/2009-03-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Na het afleggen van een daartoe strekkende schriftelijke verklaring verkrijgt het Nederlanderschap door een
      bevestiging als bedoeld in [artikel 6, tweede lid, van de Rijkswet op het Nederlanderschap][ref1]

      a. de vreemdeling die vóór de inwerkingtreding van deze Rijkswet maar op of na 1 april 2003, vóór de leeftijd van
      zeven jaar is erkend door een Nederlander,

      b. de vreemdeling die als minderjarige vóór de inwerkingtreding van deze Rijkswet maar op of na 1 april 2003, op
      de leeftijd van zeven jaar of ouder door een Nederlander is erkend, indien hij bij het afleggen van de verklaring
      aantoont dat de erkenner zijn biologische vader is,

      c. de vreemdeling die als minderjarige vóór de inwerkingtreding van deze Rijkswet maar op of na 1 april 2003 door
      wettiging het kind is geworden van een Nederlander.

      2 [Artikel 6, derde tot en met negende lid, van de Rijkswet op het Nederlanderschap][ref2] is van overeenkomstige
      toepassing op de in het eerste lid genoemde erkende of gewettigde personen, met dien verstande, dat op de in het
      achtste lid bedoelde minderjarige niet het vereiste van toelating en hoofdverblijf in Nederland, de Nederlandse
      Antillen of Aruba van toepassing is en hij niet gehouden is de bereidverklaring en de verklaring van verbondenheid
      af te leggen.

      3 Bij of krachtens algemene maatregel van rijksbestuur kunnen nadere regelen worden gesteld met betrekking tot het
      in het eerste lid onder b bedoelde bewijs.

      4 Voor de toepassing van [artikel 14, tweede lid, van de Rijkswet op het Nederlanderschap][ref3] wordt onder
      familierechtelijke betrekking mede gerekend de erkenning en wettiging als bedoeld in het eerste lid.


