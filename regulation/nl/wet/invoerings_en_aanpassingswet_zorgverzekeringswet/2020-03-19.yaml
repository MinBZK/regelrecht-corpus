  - number: 2.1.7a
    text: |-
      1 In afwijking van [artikel 2.1.7, tweede lid][ref1], verricht het Zorginstituut binnen een half jaar na
      inwerkingtreding van dit artikel met betrekking tot het jaar 2005 een nieuwe nadere vaststelling als bedoeld in
      [artikel 19, vijfde lid, van de Ziekenfondswet][ref2].

      2 De gegevens die gebruikt worden voor de nieuwe nadere vaststelling, bedoeld in het eerste lid, zijn gelijk aan
      de gegevens die zijn gebruikt voor de nadere vaststelling, bedoeld in [artikel 2.1.7, tweede lid][ref3], met dien
      verstande dat voor de nieuwe nadere vaststelling rekening wordt gehouden met na 1 juli 2009 over de jaren 2002
      tot en met 2005 door de zorgautoriteit per ziekenfonds berekende verschillen tussen opbrengsten en budgetten van
      ziekenhuizen.

      3 De nieuwe nadere vaststelling, bedoeld in het eerste lid, geschiedt op basis van de regelgeving zoals deze
      met betrekking tot het jaar 2005 gold, met dien verstande dat uit de nieuwe nadere vaststelling voortvloeiende
      financiële verplichtingen direct met 's Rijks schatkist worden verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0018830#Artikel2.1.7
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0018830#Artikel2.1.7
