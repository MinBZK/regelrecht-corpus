  - number: 2.1.11
    text: Het saldo van de Algemene Kas naar de situatie op 1 januari 2010 komt ten bate of ten laste van ’s Rijks schatkist.
    url: https://wetten.overheid.nl/BWBR0018830/2020-03-19#Artikel2.1.11
  - number: 2.1.12
    text: |-
      1 Baten en lasten die het Zorginstituut na 1 januari 2006 heeft in verband met de uitvoering van de
      [Ziekenfondswet][ref1], komen ten goede aan of ten laste van de Algemene Kas.

      2 De vorderingen en verplichtingen in verband met de uitvoering van de [Ziekenfondswet][ref2] die na verwerking
      van de tot en met 31 december 2016 gedane uitgaven en binnengekomen ontvangsten resteren, komen ten bate
      onderscheidenlijk ten laste van het Zorgverzekeringsfonds.

      3 De baten en lasten in verband met de uitvoering van de [Ziekenfondswet][ref3] na 31 december 2016 komen ten goede
      onderscheidenlijk ten laste van het Zorgverzekeringsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
