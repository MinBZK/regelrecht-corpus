preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de invoering van de Zorgverzekeringswet en enkele
    daarmee samenhangende onderwerpen te regelen, zulks onder intrekking van de Ziekenfondswet, de Wet op de toegang
    tot ziektekostenverzekeringen 1998 en de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden
    en onder aanpassing van diverse andere wetten;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018830/2020-03-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. Zorginstituut: het Zorginstituut Nederland, genoemd in
      [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1];

      c.

      d.

      e.

      f.

      g. verzekeraar: een verzekeraar als bedoeld in [artikel 1, onderdeel a, van de Zorgverzekeringswet][ref2];

      h. zorgverzekeraar: een zorgverzekeraar als bedoeld in [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref3];

      i. zorgverzekering: de verzekering, bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref4];

      j. verzekeringsplichtige: de verzekeringsplichtige, bedoeld in
      [artikel 1, onderdeel e, van de Zorgverzekeringswet][ref5];

      k. inhoudingsplichtige: de inhoudingsplichtige, bedoeld in
      [artikel 1, onderdeel k, van de Zorgverzekeringswet][ref6];

      l. [Ziekenfondswet][ref7]: de [Ziekenfondswet][ref8] zoals die luidde onmiddellijk voor de inwerkingtreding van
      deze wet;

      m. Algemene Kas: de Algemene Kas, bedoeld in [artikel 1q van de Ziekenfondswet][ref9];

      n. ziekenfonds: de rechtspersoon die onmiddellijk voor de inwerkingtreding van deze wet krachtens
      [artikel 34 van de Ziekenfondswet][ref10] was toegelaten om als ziekenfonds werkzaam te zijn;

      o. zorgautoriteit: de Nederlandse Zorgautoriteit, bedoeld in
      [artikel 3 van de Wet marktordening gezondheidszorg][ref11].


