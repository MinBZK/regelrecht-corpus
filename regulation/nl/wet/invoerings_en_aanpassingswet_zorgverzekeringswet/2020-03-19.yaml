  - number: 2.2.2a
    text: |-
      1 In dit artikel wordt onder «de [Wet op de toegang tot ziektekostenverzekeringen 1998][ref1]» verstaan: de Wet op
      de toegang tot ziektekostenverzekeringen 1998 zoals deze op 31 december 2005 luidde.

      2 In aanvulling op en zonodig in afwijking van eerdere beschikkingen dienaangaande, stelt het Zorginstituut binnen
      een half jaar na inwerkingtreding van dit artikel met betrekking tot het jaar 2005 nieuwe verrekeningsbeschikkingen
      als bedoeld in [artikel 8 van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref2] vast.

      3 De gegevens die gebruikt worden voor de nieuwe beschikkingen, bedoeld in het tweede lid, zijn gelijk aan de
      gegevens die zijn gebruikt voor de eerdere verrekeningsbeschikkingen met betrekking tot het jaar 2005, met dien
      verstande dat voor de nieuwe verrekeningsbeschikkingen rekening wordt gehouden met na 1 juli 2009 over de jaren
      2002 tot en met 2005 door de zorgautoriteit berekende verschillen tussen opbrengsten en budgetten van ziekenhuizen.

      4 De nieuwe verrekeningsbeschikkingen, bedoeld in het tweede lid, worden opgesteld op basis van de regelgeving
      zoals deze met betrekking tot het jaar 2005 gold, met dien verstande dat uit de nieuwe nadere vaststelling
      voortvloeiende financiële verplichtingen direct met 's Rijks schatkist worden verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0009750
      [ref2]: https://wetten.overheid.nl/BWBR0009750#Artikel8
