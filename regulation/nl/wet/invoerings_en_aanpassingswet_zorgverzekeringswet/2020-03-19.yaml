  - number: 2.3.2
    text: |-
      1 Ten aanzien van aanspraken, rechten en verplichtingen welke bij of krachtens de
      [Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1] zijn ontstaan voor het
      tijdstip van intrekking van [die wet][ref2], dan wel na dat tijdstip zijn ontstaan terzake van de afwikkeling van
      [die wet][ref3], blijft het recht van toepassing zoals dat gold voorafgaand aan dat tijdstip. De afwikkeling van
      zaken met betrekking tot de in het eerste lid genoemde wet, geschiedt voor 1 januari 2007 door de rechtspersoon,
      aangewezen ingevolge [artikel 17 van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref4].

      2 Het resultaat van de financiële afwikkeling van de wet, bedoeld in [artikel 2.3.1][ref5], over het jaar 2004
      wordt ten bate of ten laste van de Algemene Kas gebracht.

      3 Bij ministeriële regeling van Onze Minister kunnen zonodig regels worden gesteld die voor een goede afwikkeling
      van de [Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref6] noodzakelijk zijn.


