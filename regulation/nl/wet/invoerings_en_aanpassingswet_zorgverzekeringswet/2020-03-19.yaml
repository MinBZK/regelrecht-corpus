  - number: '5.1'
    text: |-
      1 Bij ministeriële regeling kunnen, voor zover dit noodzakelijk is voor de invoering van de
      [Zorgverzekeringswet][ref1] of voor deze wet en zo nodig in afwijking van deze wet, tijdelijke voorzieningen worden
      getroffen.

      2 Na de plaatsing in de Staatscourant van een krachtens het eerste lid vastgestelde ministeriële regeling wordt
      een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Staten-Generaal ingediend.
      Indien het voorstel wordt ingetrokken of indien een van de beide kamers der Staten-Generaal besluit het voorstel
      niet aan te nemen, wordt de ministeriële regeling onverwijld ingetrokken. Wordt het voorstel tot wet verheven, dan
      wordt de ministeriële regeling ingetrokken op het tijdstip van inwerkingtreding van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018830/2020-03-19#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: '5.2'
    text: >-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018830/2020-03-19#Artikel5.2
