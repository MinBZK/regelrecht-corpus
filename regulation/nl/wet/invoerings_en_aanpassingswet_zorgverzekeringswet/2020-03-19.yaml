  - number: 3.1.4
    text: |-
      1 De aanspraak op een vergoeding als bedoeld in [artikel 3.1.2][ref1], bestaat slechts indien de rechthebbende
      zich, binnen een termijn van vier maanden nadat deze wet in werking is getreden, dan wel binnen een termijn van
      vier maanden nadat hij in redelijkheid van de inwerkingtreding van deze wet heeft kunnen kennisnemen, als zodanig
      heeft aangemeld bij het CAK, genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref2],. Het CAK
      verleent de vergoedingen, bedoeld in [artikel 3.1.2][ref3].

      2 Het CAK kan een rechtspersoon, aangewezen ingevolge
      [artikel 4.2.4, tweede lid, van de Wet langdurige zorg][ref4], mandaat en volmacht verlenen om namens hem
      besluiten te nemen of werkzaamheden te verrichten die verband houden met het verlenen van vergoedingen als bedoeld
      in [artikel 3.1.2][ref5].

      3 Het CAK is bevoegd tot het verwerken van persoonsgegevens van de persoon, bedoeld in [artikel 3.1.2][ref6],
      waaronder persoonsgegevens betreffende de gezondheid, die noodzakelijk zijn voor de uitvoering van dit artikel.

      4 Het CAK is de verantwoordelijke, bedoeld in
      [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref7], voor de verwerking, bedoeld in het derde
      lid.


