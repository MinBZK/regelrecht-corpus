  - number: 3.1.3
    text: |-
      1 De vergoeding, bedoeld in [artikel 3.1.2][ref1], is gelijk aan het bedrag dat ingevolge de wettelijke regeling
      van de staat van wonen of verblijf voor rekening van de rechthebbende blijft, in geval in die staat op de
      desbetreffende zorg recht bestaat met toepassing van enig door Nederland gesloten verdrag inzake sociale zekerheid
      of van een verordening van de Raad van Europese Gemeenschappen.

      2 De vergoeding, bedoeld in [artikel 3.1.2][ref2], is gelijk aan de in rekening gebrachte kosten tot het in het
      land van wonen of verblijf voor de verleende zorg geldende tarief, en bij het ontbreken van een zodanig tarief tot
      het bedrag dat daar voor de desbetreffende zorg in rekening pleegt te worden gebracht, indien op die zorg in het
      woonland geen aanspraak bestaat op grond van de in het eerste lid bedoelde verdragen of verordeningen.

      3 Indien voor de zorg geen tarief geldt of er geen tarief bestaat dat daarvoor in rekening pleegt te worden
      gebracht, is de vergoeding gelijk aan de in rekening gebrachte kosten, voor zover die gelet op het kostenniveau van
      de gezondheidszorg in het land van wonen of verblijf in redelijkheid aanvaardbaar zijn.

      4 Op de vergoeding worden in mindering gebracht bijdragen die de persoon, bedoeld in [artikel 3.1.2][ref3],
      verschuldigd zou zijn geweest indien hij verzekerd zou zijn geweest op grond van de [Wet langdurige zorg][ref4] dan
      wel een zorgverzekering zou hebben gehad op grond waarvan hij recht op prestaties zou hebben gehad als bedoeld in
      [artikel 11, eerste lid, onderdeel b, van de Zorgverzekeringswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0018830#Artikel3.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0018830#Artikel3.1.2
