  - number: 3.6.7
    text: |-
      1 Een ziekenfonds is geen verzekeraar als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1],
      voorzover het werkzaamheden ter afwikkeling van de Ziekenfondswet verricht.

      2 De [Wet op het financieel toezicht][ref2] is niet van toepassing op instellingen die een publiekrechtelijke
      ziektekostenregeling uitvoeren, voor zover zij:

      a. bij algemene maatregel van bestuur, bedoeld in [artikel 20, van de Wet toezicht verzekeringsbedrijf 1993][ref3]
      zoals dat artikel luidde op de dag voorafgaande aan de dag waarop [artikel 3.6.6, onderdeel D][ref4], in werking
      trad, waren aangewezen;

      b. blijven voldoen aan de voorwaarden van de algemene maatregel van bestuur, bedoeld in onderdeel a; en

      c. hun werkzaamheden beperken tot het afwikkelen van deze publiekrechtelijke regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020368
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0018830#Artikel3.6.6
