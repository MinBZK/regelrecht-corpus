  - number: 2.5.1
    text: |-
      1 In afwijking van [artikel 217 van Boek 6 van het Burgerlijk Wetboek][ref1] en van
      [artikel 41, eerste lid, van de Wet financiële dienstverlening][ref2], is een verzekeringsplichtige die voor
      16 december 2005 van zijn ziekenfonds of zijn ziektekostenverzekeraar een aanbod heeft ontvangen tot het sluiten
      van een zorgverzekering met een in dat aanbod aangewezen zorgverzekeraar, met ingang van 1 januari 2006 volgens de
      in dat aanbod aangeduide variant van de zorgverzekering bij die zorgverzekeraar verzekerd, tenzij hij degene die
      het aanbod deed voor die datum heeft laten weten het aanbod te verwerpen.

      2 In afwijking van [artikel 217 van Boek 6 van het Burgerlijk Wetboek][ref3] en van
      [artikel 41, eerste lid, van de Wet financiële dienstverlening][ref4], is een verzekeringsplichtige die
      voor 16 december 2005 van het orgaan dat een publiekrechtelijke ziektekostenregeling voor ambtenaren voor hem
      uitvoert, een aanbod heeft ontvangen tot het sluiten van een zorgverzekering met een in dat aanbod aangewezen
      zorgverzekeraar, met ingang van 1 januari 2006 volgens de in dat aanbod aangeduide variant van de zorgverzekering
      bij die zorgverzekeraar verzekerd, tenzij hij degene die het aanbod deed voor die datum heeft laten weten van het
      aanbod geen gebruik te willen maken.

      3 Een verzekeringnemer kan een zorgverzekering volgens het aanbod, bedoeld in het eerste of tweede lid, zonder
      opgave van redenen en zonder dat een boete verschuldigd is tot 1 maart 2006 schriftelijk ontbinden, indien deze tot
      stand gekomen is:

      a. ten gevolge van toepassing van het eerste of tweede lid;

      b. ten gevolge van aanvaarding van het aanbod anders dan door middel van een expliciete wilsverklaring.

      4 Een ontbinding als bedoeld in het derde lid werkt terug tot en met 1 januari 2006.

      5 Een zorgverzekeraar waarbij een zorgverzekering onder toepassing van het derde lid is ontbonden, treedt, indien
      ten behoeve van een zelfde verzekerde voor 1 mei 2006 een zorgverzekering bij een andere zorgverzekeraar wordt
      gesloten, in de rechten die de verzekerde jegens deze andere zorgverzekeraar heeft, tot ten hoogste het bedrag van
      de waarde van de prestaties die hij op grond van de ontbonden zorgverzekering heeft geleverd.

      6 Een zorgverzekeraar die ten gevolge van het vijfde lid een vordering op de nieuwe zorgverzekeraar heeft, meldt
      deze welk deel van het gevorderde bedrag in mindering dient te worden gebracht op de no claimteruggave en welk
      bedrag eerstbedoelde verzekeraar ten gevolge van een eigen risico voor rekening van de verzekerde heeft gelaten.

      7 Onverminderd de uit de [Wet financiële dienstverlening][ref5] voortvloeiende informatieverplichtingen, komt een
      zorgverzekering slechts op grond van het eerste of tweede lid tot stand indien bij het aanbod:

      a. de modelovereenkomst wordt gevoegd waarin de desbetreffende variant van de zorgverzekering is opgenomen;

      b. wordt aangegeven welke bepalingen van de modelovereenkomst van toepassing zijn, indien de modelovereenkomst
      meerdere varianten van de zorgverzekering bevat;

      c. wordt aangegeven hoe hoog de premie voor de desbetreffende variant is; en

      d. wordt aangegeven dat een zorgverzekering, tot stand gekomen anders dan door middel van een expliciete
      wilsverklaring van de verzekeringnemer, tot 1 maart 2006 met terugwerkende kracht tot en met 1 januari 2006 kan
      worden ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel217
      [ref2]: https://wetten.overheid.nl/BWBR0018329#Artikel41
