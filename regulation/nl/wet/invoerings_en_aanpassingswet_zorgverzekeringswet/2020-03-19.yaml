  - number: 2.1.1
    text: |-
      De [Ziekenfondswet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0018830/2020-03-19#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: 2.1.2
    text: |-
      1 Ten aanzien van aanspraken, rechten en verplichtingen welke bij of krachtens de [Ziekenfondswet][ref1] zijn
      ontstaan voor het tijdstip van intrekking van [die wet][ref2], dan wel na dat tijdstip zijn ontstaan terzake van
      de afwikkeling van [die wet][ref3], blijft het recht van toepassing zoals dat gold voorafgaand aan dat tijdstip,
      behoudens voor zover terzake in deze wet afwijkende regels zijn gesteld.

      2 Ten aanzien van bezwaar en beroep tegen een besluit op grond van het bepaalde bij of krachtens deze paragraaf, is
      het recht zoals dat gold voorafgaand aan het tijdstip van intrekking van de [Ziekenfondswet][ref4] van toepassing.

      3 Een rechtspersoon welke voorafgaand aan het tijdstip van intrekking van de [Ziekenfondswet][ref5] werkzaam was
      als ziekenfonds, dan wel zijn rechtsopvolger onder algemene titel, heeft de hoedanigheid van ziekenfonds terzake
      van de afwikkeling van [die wet][ref6].

      4 De bestuursorganen die op grond van het bepaalde bij of krachtens de [Ziekenfondswet][ref7] een taak hebben
      bij de uitvoering van [die wet][ref8], dragen overeenkomstig de bepalingen van deze wet zorg voor een zorgvuldige
      afwikkeling van die taak.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
