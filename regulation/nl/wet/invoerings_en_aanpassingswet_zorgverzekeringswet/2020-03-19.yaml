      1 Indien een rechthebbende zich heeft aangemeld voor de toepassing van [artikel 2.2.5][ref1], heeft hij op de voet
      van dat artikel eveneens aanspraak op vergoeding van de kosten van zorg die hem na 31 december 2005 doch voor het
      tijdstip van de aanmelding is verleend.

      2 De rechthebbende, bedoeld in het eerste lid, is de bijdrage, bedoeld in het vierde lid van [artikel 2.2.5][ref2]
      eveneens verschuldigd over de periode die is verstreken na 31 december 2005.


