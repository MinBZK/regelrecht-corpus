  - number: 2.1.9
    text: |-
      1 Onverminderd [artikel 43d, eerste lid, van de Ziekenfondswet][ref1], heeft het Zorginstituut ten behoeve van
      de Algemene Kas op 1 juli 2009 een onmiddellijk opeisbare vordering op het ziekenfonds ten belope van de som
      van de reserve [Ziekenfondswet][ref2] en de middelen waarover het ziekenfonds ten behoeve van de uitvoering van
      de verzekering ingevolge die wet de beschikking heeft gekregen, voor zover deze door het ziekenfonds niet zijn
      aangewend ter dekking van zijn ten behoeve van de uitvoering van de verzekering ingevolge die wet noodzakelijke
      uitgaven. Uitgaven waarvan de zorgautoriteit heeft vastgesteld dat deze niet verantwoord zijn, blijven daarbij
      buiten beschouwing, tenzij de zorgautoriteit anders heeft besloten.

      2 Het eerste lid is niet van toepassing ten aanzien van een ziekenfonds dat of
      zijn rechtsopvolger onder algemene titel die voor 1 januari 2008 heeft voldaan aan
      [artikel 25, eerste en tweede lid, van de Zorgverzekeringswet][ref3].

      3 In afwijking van het tweede lid heeft het Zorginstituut een onmiddellijk opeisbare vordering ten behoeve van ’s
      Rijks schatkist op een ziekenfonds dat of zijn rechtsopvolger onder algemene titel die niet in zijn statuten heeft
      vastgelegd dat hij ten doel heeft te werken als zorgverzekeraar zonder winstoogmerk, dan wel zodanige statutaire
      bepaling uit zijn statuten heeft geschrapt voordat twaalf jaren zijn verstreken na de inwerkingtreding van deze
      wet, dan wel gedurende minder dan twaalf jaren na de inwerkingtreding van deze wet als zorgverzekeraar werkzaam is.

      4 In geval van bedrijfsbeëindiging van de zorgverzekeraar wordt de vordering van het Zorginstituut, bedoeld in het
      derde lid, voldaan, nadat de vorderingen van alle andere schuldeisers van de zorgverzekeraar in overeenstemming met
      hun wettelijke rangorde zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel43d
      [ref2]: https://wetten.overheid.nl/BWBR0002460
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel25
