    text: |-
      Ten aanzien van bezwaar en beroep tegen een besluit op grond van het bepaalde bij of krachtens
      deze paragraaf, is het recht zoals dat gold voorafgaand aan het tijdstip van intrekking van de
      [Wet op de toegang tot ziektekostenverzekeringen 1998][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009750
