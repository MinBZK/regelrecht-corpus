  - number: 2.1.7b
    text: |-
      1 Het Zorginstituut merkt na 1 juli 2009 bekend geworden, over de jaren 2002 tot en met 2005 door zorgautoriteit
      berekende verschillen tussen opbrengsten en budgetten van dialysecentra, van radiotherapeutische centra, van
      centra voor erfelijkheidsonderzoek en van epilepsiecentra aan als kosten van het macro-deelbedrag vaste kosten van
      ziekenhuisverpleging, waarna het instituut deze bedragen uiterlijk 1 januari 2013 verrekent.

      2 Indien de in [artikel 2.1.9, derde lid][ref1], bedoelde situatie optreedt, ziet de in dat lid geregelde,
      onmiddellijk opeisbare vordering jegens het ziekenfonds of zijn rechtsopvolger onder algemene titel, mede op de op
      grond van het eerste lid verrekende bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0018830#Artikel2.1.9
    url: https://wetten.overheid.nl/BWBR0018830/2020-03-19#Artikel2.1.7b
