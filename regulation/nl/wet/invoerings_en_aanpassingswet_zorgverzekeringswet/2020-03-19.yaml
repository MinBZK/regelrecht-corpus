  - number: 2.2.5
    text: |-
      1 Een in het buitenland wonende persoon, niet zijnde of geweest zijnde een verzekeringsplichtige
      als bedoeld in [artikel 1, onderdeel e, van de Zorgverzekeringswet][ref1] of een persoon op wie
      [artikel 69 van die wet][ref2] van toepassing is of is geweest, die onmiddellijk voor de inwerkingtreding van de
      [Zorgverzekeringswet][ref3] verzekerd was op grond van een overeenkomst van standaardverzekering in de zin van de
      [Wet op de toegang tot ziektekostenverzekeringen 1998][ref4], heeft tijdens zijn verblijf in Nederland aanspraak
      op een vergoeding ter zake van de kosten van zorg waarop aanspraak zou bestaan indien betrokkene ingevolge een
      zorgverzekering als bedoeld [1, onderdeel d, van de Zorgverzekeringswet][ref5] verzekerd zou zijn.

      2 Aanspraak op de in het eerste lid bedoelde vergoeding bestaat slechts indien de rechthebbende zich
      binnen vier maanden nadat deze wet in werking is getreden of hij in redelijkheid van de inwerkingtreding
      van deze wet heeft kunnen kennisnemen, als zodanig heeft aangemeld bij het CAK, genoemd in
      [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref6],. Het CAK verleent de vergoedingen, bedoeld in het
      eerste lid.

      3 De vergoeding, bedoeld in het eerste lid, is gelijk aan de in rekening gebrachte kosten onder aftrek van het deel
      daarvan dat voor verzekerden in de zin van de [Zorgverzekeringswet][ref7] voor rekening van de verzekerde blijft.

      4 De belanghebbende die zich heeft aangemeld, is aan het CAK per maand een bijdrage verschuldigd die gelijk
      is aan eentwaalfde van het bedrag van de standaardpremie als bedoeld in de [Wet op de zorgtoeslag][ref8],
      nadat die is verminderd met het bedrag dat de zorgtoeslag ten hoogste bedraagt, voor een in Nederland wonende
      verzekeringsplichtige zonder partner.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld die noodzakelijk zijn voor een goede uitvoering van
      de aanspraak op de vergoeding, bedoeld in het eerste lid.

      6 De kosten van de vergoedingen, verleend ingevolge dit artikel, onderscheidenlijk de baten van de bijdrage,
      betaald op grond van dit artikel, komen ten laste onderscheidenlijk ten gunste van het Zorgverzekeringsfonds.

      7 Ten aanzien van bezwaar en beroep tegen een besluit inzake een vergoeding als bedoeld in het eerste lid, is het
      recht zoals dat geldt ten aanzien van besluiten inzake een recht op zorg ingevolge de [Wet langdurige zorg][ref9],
      met uitzondering van [artikel 10.3.1 van die wet][ref10], van toepassing.

      8 Het CAK is bevoegd tot het verwerken van persoonsgegevens van de persoon, bedoeld in het eerste lid, waaronder
      persoonsgegevens betreffende de gezondheid, die noodzakelijk zijn voor de uitvoering van dit artikel.

      9 Het CAK is de verantwoordelijke, bedoeld in
      [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref11], voor de verwerking, bedoeld in het
      achtste lid.


