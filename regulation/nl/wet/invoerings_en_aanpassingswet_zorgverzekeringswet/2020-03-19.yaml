  - number: 2.1.5
    text: >-
      1 Personen en instellingen die terzake van verleende zorg een vordering hebben op een verzekerde die aanspraak
      heeft op gehele of gedeeltelijke vergoeding van de kosten van die zorg door een ziekenfonds, zenden, op straffe van
      verval van hun vorderingsrecht, voor 1 januari 2008 een nota aan de verzekerde.


      2 De aanspraak van een verzekerde jegens een ziekenfonds op vergoeding van de kosten van zorg, bedoeld in het
      eerste lid, vervalt, indien het verzoek om vergoeding niet is gedaan voor 1 april 2008.
    url: https://wetten.overheid.nl/BWBR0018830/2020-03-19#Artikel2.1.5
  - number: 2.1.6
    text: |-
      1 In afwijking van hetgeen is overeengekomen, kunnen overeenkomsten als bedoeld in
      [artikel 44 van de Ziekenfondswet][ref1] door beide partijen met inachtneming van een opzegtermijn van ten minste
      twee maanden worden opgezegd.

      2 Personen en instellingen die uit hoofde van een overeenkomst als bedoeld in het eerste lid jegens een ziekenfonds
      vorderingen hebben, zenden op straffe van verval van hun vorderingsrecht voor 1 januari 2008 aan het ziekenfonds
      een nota met de voor het verlenen van zorg aan de verzekerden van het ziekenfonds in rekening te brengen bedragen,
      met inachtneming van de terzake overeengekomen voorwaarden van administratieve aard.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel44
    url: https://wetten.overheid.nl/BWBR0018830/2020-03-19#Artikel2.1.6
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '44'
  - number: 2.1.7
    text: |-
      1 Onverminderd de [artikelen 43e][ref1] en [43f van de Ziekenfondswet][ref2], zenden de ziekenfondsen voor
      1 november 2008 aan het College zorgverzekeringen:

      a. een eindverslag over de afwikkeling van de uitvoering van de [Ziekenfondswet][ref3] en

      b. een financieel verslag over de afwikkeling van de uitvoering van de [Ziekenfondswet][ref4], dat
      vergezeld gaat van een verklaring van een accountant omtrent de getrouwheid en rechtmatigheid als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref5], alsmede van een rapport van de accountant over de
      ordelijkheid en controleerbaarheid van het gevoerde financiële beheer, waarbij onderscheid wordt gemaakt tussen de
      beheerskosten en de kosten van verstrekkingen en vergoedingen.

      2 Voor 1 juli 2009 verricht het College zorgverzekeringen de nadere vaststelling, bedoeld in
      [artikel 19, vijfde lid, van de Ziekenfondswet][ref6] met betrekking tot de jaren voor de intrekking van de
      [Ziekenfondswet][ref7] waarvoor zulks nog niet is geschied.

      3 Voor zover na het tijdstip, bedoeld in het eerste lid, onherroepelijk wordt vastgesteld dat een ziekenfonds
      als uitvoerder van de [Ziekenfondswet][ref8] gehouden is tot betaling van een voor 1 januari 2008 tegen het
      ziekenfonds ingestelde vordering, dan wel na het tijdstip, bedoeld in het eerste lid, betaling ontvangt terzake van
      een door het ziekenfonds ingestelde vordering, komt het betaalde, onderscheidenlijk ontvangen, bedrag ten laste,
      onderscheidenlijk ten gunste, van het ziekenfonds of zijn rechtsopvolger onder algemene titel.


