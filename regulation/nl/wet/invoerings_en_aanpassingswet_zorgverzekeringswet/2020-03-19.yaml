  - number: 2.2.1
    text: |-
      De [Wet op de toegang tot ziektekostenverzekeringen 1998][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009750
    url: https://wetten.overheid.nl/BWBR0018830/2020-03-19#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0009750
  - number: 2.2.2
    text: |-
      1 Ten aanzien van aanspraken, rechten en verplichtingen welke bij of krachtens de
      [Wet op de toegang tot ziektekostenverzekeringen 1998][ref1] zijn ontstaan voor het tijdstip van intrekking van
      [die wet][ref2], dan wel na dat tijdstip zijn ontstaan terzake van de afwikkeling van [die wet][ref3], blijft
      het recht van toepassing zoals dat gold voorafgaand aan dat tijdstip, met dien verstande dat toepassing van
      [artikel 8 van die wet][ref4] slechts plaatsvindt voor zover de ziektekostenverzekeraar voor 1 juli 2008 daarom
      heeft verzocht. De afwikkeling van zaken met betrekking tot de in het eerste lid genoemde wet, geschiedt tot
      1 januari 2009 door de rechtspersoon, aangewezen ingevolge [artikel 17 van die wet][ref5].

      2 Het vermogen van de in het eerste lid bedoelde rechtspersoon, voor zover dit is gevormd als gevolg van de
      uitvoering van de taken die haar bij of krachtens [die wet][ref6] zijn opgedragen, met uitsluiting van de
      voorziening die is opgebouwd ten behoeve van de wachtgeldregeling van het personeel, komt met ingang van 1 januari
      2009 ten laste of ten gunste van de Algemene Kas.

      3 Het Zorginstituut draagt met ingang van 1 januari 2009 zorg voor de afwikkeling van zaken met betrekking tot
      de [Wet op de toegang tot ziektekostenverzekeringen 1998][ref7] als bedoeld in het eerste lid. Het Zorginstituut
      treedt van rechtswege in de rechten en verplichtingen van de rechtspersoon, bedoeld in het eerste lid, met
      betrekking tot die afwikkeling.

      4 Baten en lasten met betrekking tot de afwikkeling van zaken met betrekking tot de
      [Wet op de toegang tot ziektekostenverzekeringen 1998][ref8] komen ten goede aan of ten laste van de Algemene Kas,
      dan wel ’s Rijks schatkist.

      5 Indien op enig tijdstip niet langer uitkeringen worden en zullen worden gedaan ten laste van de in het tweede
      lid bedoelde voorziening die is opgebouwd ten behoeve van de wachtgeldregeling van het personeel, geeft de met
      de uitvoering van de wachtgeldregeling belaste rechtspersoon Onze Minister daarvan kennis. Die rechtspersoon
      verstrekt, ook zonder dat de in de vorige zin bedoelde kennisgeving is gedaan, Onze Minister op een daartoe
      strekkend verzoek de gegevens met betrekking tot de voorziening, die in verband met het bepaalde in het zesde lid
      van belang zijn.

      6 Op vordering van Onze Minister stort de in het vijfde lid bedoelde rechtspersoon het resterende deel van de in
      het tweede en vijfde lid bedoelde voorziening in ’s Rijks schatkist.

      7 Bij ministeriële regeling van Onze Minister kunnen zonodig regels worden gesteld die voor een goede afwikkeling
      van de [Wet op de toegang tot ziektekostenverzekeringen 1998][ref9] noodzakelijk zijn.


