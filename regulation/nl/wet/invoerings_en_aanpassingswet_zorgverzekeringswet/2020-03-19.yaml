        artikel: '69'
  - number: 2.5.3
    text: >-
      Voor zover een verzekerde ingevolge de zorgverzekering toestemming behoeft van de zorgverzekeraar dan wel een
      verwijzing of recept van een deskundige is vereist voor het verkrijgen van de verzekerde prestaties, en de
      verzekerde in het bezit is van een voor de inwerkingtreding van deze wet door een ziekenfonds, een uitvoerder van
      een publiekrechtelijke ziektekostenregeling of een ziektekostenverzekeraar verleende toestemming en een voor de
      inwerkingtreding van deze wet afgegeven verwijzing of recept voor de desbetreffende zorg, geldt die toestemming,
      die verwijzing of dat recept als titel voor het verkrijgen van de verzekerde prestaties gedurende de periode
      waarvoor de toestemming is verleend of de verwijzing of het recept geldig is, en verlangt de zorgverzekeraar van de
      verzekerde niet nogmaals dat toestemming wordt gevraagd of dat een verwijzing of recept wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0018830/2020-03-19#Artikel2.5.3
  - number: 2.5.4
    text: >-
      Indien een verzekerde ingevolge de zorgverzekering recht heeft op levering van zorg en overige diensten door zijn
      zorgverzekeraar en op het tijdstip van inwerkingtreding van deze wet zorg ontvangt van een aanbieder van zorg met
      welke de zorgverzekeraar daartoe geen overeenkomst heeft gesloten, heeft de verzekerde desalniettemin recht op
      zorgverlening door die aanbieder van zorg voor rekening van de zorgverzekeraar, behoudens voor zover betrokkene
      voor dat tijdstip niet verzekerd was voor die zorg of de kosten daarvan, dan wel voor zover die kosten voor
      rekening van de tot dat tijdstip bestaande verzekering komen.
    url: https://wetten.overheid.nl/BWBR0018830/2020-03-19#Artikel2.5.4
  - number: 2.5.6
    text: |-
      Indien een verzekeraar zijn portefeuille met ziektekostenverzekeringen met ingang van de datum van inwerkingtreding
      van de [Zorgverzekeringswet][ref1] overdraagt aan een zorgverzekeraar in de zin van [die wet][ref2] of
      indien hij zich met ingang van die datum omzet in een andere rechtsvorm, in welke rechtsvorm hij als
      zorgverzekeraar in de zin van [die wet][ref3] werkzaam zal zijn, zijn de [artikelen 123, vierde lid][ref4],
      [125, vierde lid, tweede volzin][ref5], en [128, vierde lid, van de Wet toezicht verzekeringsbedrijf 1993][ref6]
      niet van toepassing op de zorgverzekering of een aanvullende verzekering die met ingang van die datum bij de
      zorgverzekeraar gaat lopen, mits de verzekerde voor die datum in de gelegenheid is gesteld af te zien van een
      zorgverzekering of een aanvullende verzekering bij die zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450
