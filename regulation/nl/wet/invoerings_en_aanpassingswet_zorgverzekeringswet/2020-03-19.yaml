  - number: 2.5.1a
    text: |-
      Indien een persoon als bedoeld in [artikel 69, eerste lid, van de Zorgverzekeringswet][ref1] reeds bij het
      Zorginstituut geregistreerd is als een persoon die op grond van de in dat lid genoemde verordening, overeenkomst
      of verdrag ingeval van behoefte aan zorg recht heeft op zorg of vergoeding van de kosten daarvan, zoals voorzien
      in de wetgeving over de verzekering voor zorg van zijn woonland, geldt deze registratie als de melding, bedoeld in
      [artikel 69, eerste lid, van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel69
    url: https://wetten.overheid.nl/BWBR0018830/2020-03-19#Artikel2.5.1a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '69'
  - number: 2.5.2
    text: |-
      1 Een overeenkomst met betrekking tot de verzekering van geneeskundige zorg of de kosten daarvan, gesloten voor of
      met een verzekerde als bedoeld in [artikel 1, onderdeel f, van de Zorgverzekeringswet][ref1], met of ten behoeve
      van wie een zorgverzekering is gesloten welke ingaat op of terugwerkt tot 1 januari 2006, vervalt met ingang van
      dat tijdstip, voor zover aan de overeenkomst rechten kunnen worden ontleend, gelijkwaardig aan die welke vanaf dat
      tijdstip uit de zorgverzekering voortvloeien.

      2 Een overeenkomst met betrekking tot de verzekering van geneeskundige zorg of de kosten daarvan, gesloten voor
      of met een in het buitenland wonende verzekerde die met toepassing van een verordening van de Raad van de Europese
      Gemeenschappen dan wel toepassing van zodanige verordening krachtens de overeenkomst betreffende de Europese
      Economische Ruimte of een verdrag inzake sociale zekerheid recht heeft op zorg of vergoeding van de kosten
      daarvan, zoals voorzien in de wetgeving over de verzekering voor zorg van het woonland, vervalt met ingang van
      1 januari 2006, voor zover aan de overeenkomst rechten kunnen worden ontleend, gelijkwaardig aan die, welke vanaf
      dat tijdstip met toepassing van zodanige verordening of verdrag aan de betrokkene toekomen, mits de verzekerde
      voor 1 mei 2006 heeft voldaan aan de verplichting tot aanmelding bij het College zorgverzekeringen ingevolge
      [artikel 69 van de Zorgverzekeringswet][ref2].

      3 De premie die voor de op grond van het eerste of tweede lid geheel of gedeeltelijk vervallen overeenkomst is
      vooruitbetaald, wordt door de verzekeraar al naar gelang van het vervallen gedeelte der overeenkomst terugbetaald,
      onder aftrek van ten hoogste 25% van het terug te betalen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel69
    url: https://wetten.overheid.nl/BWBR0018830/2020-03-19#Artikel2.5.2
