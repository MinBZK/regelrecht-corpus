  - number: 3.6.5
    text: |-
      Voor lichamen die op de dag voorafgaande aan de dag waarop deze wet
      in werking treedt, optreden als algemene ziekenfondsen als bedoeld in
      [artikel 5, eerste lid, onderdeel f, van de Wet op de vennootschapsbelasting 1969][ref1], zoals dit
      artikelonderdeel luidde op die dag, blijft dit artikelonderdeel, zoals dit luidde op de dag voorafgaande aan de dag
      waarop deze wet in werking treedt, van toepassing voor zover hun werkzaamheden betrekking hebben op de afwikkeling
      van de [Ziekenfondswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002460
