  - number: 2.5.7
    text: |-
      1 Een ziekenfonds, dat heeft voldaan aan de verplichting tot melding ingevolge
      [artikel 25, eerste lid, van de Zorgverzekeringswet][ref1], verkrijgt op het moment
      van inwerkingtreding van deze wet van rechtswege een vergunning als bedoeld in
      [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref2] voor uitoefening van de branches
      Ongevallen en Ziekte.

      2 Het ziekenfonds, bedoeld in het eerste lid, legt binnen een maand na inwerkingtreding van deze wet gegevens
      aan De Nederlandsche Bank N.V. over om aan te tonen dat het voldoet aan de [artikelen 28 tot en met 30][ref3] en
      [32 van de Wet toezicht verzekeringsbedrijf 1993][ref4], onverminderd het derde en vierde lid.

      3 Indien het ziekenfonds, bedoeld in het eerste lid, niet voldoet aan
      [artikel 28, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref5], beschikt het over een
      termijn van drie maanden na inwerkingtreding van deze wet om te voldoen aan genoemd artikellid. Het
      ziekenfonds dient daartoe binnen een maand na inwerkingtreding van deze wet bij De Nederlandsche
      Bank N.V. een voorstel in, dat aangeeft op welke wijze voor het verstrijken van de termijn aan
      [artikel 28, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref6] zal worden voldaan.

      4 Indien het ziekenfonds, bedoeld in het eerste lid, niet voldoet aan
      [artikel 32, aanhef en onderdeel a, van de Wet toezicht verzekeringsbedrijf 1993][ref7], beschikt
      het over een termijn van een jaar na inwerkingtreding van deze wet om te voldoen aan genoemd artikel.
      Het ziekenfonds dient daartoe binnen een maand na inwerkingtreding van deze wet bij De Nederlandsche
      Bank N.V. een voorstel in, dat aangeeft op welke wijze voor het verstrijken van de termijn aan
      [artikel 32, aanhef en onderdeel a, van de Wet toezicht verzekeringsbedrijf 1993][ref8] zal worden voldaan.

      5 Gedurende de termijn van een jaar, bedoeld in het vierde lid, eerste volzin, kan De Nederlandsche Bank N.V. op
      grond van de [Wet toezicht verzekeringsbedrijf 1993][ref9] alle in die wet voorziene maatregelen treffen jegens het
      ziekenfonds, bedoeld in het eerste lid, met uitzondering van:

      a. het intrekken van de vergunning uitsluitend vanwege het feit dat het ziekenfonds niet voldoet aan
      [artikel 32, aanhef en onderdeel a, van die wet][ref10];

      b. het geven van een aanwijzing als bedoeld in [artikel 54 van die wet][ref11] tot overdracht
      van de gehele portefeuille uitsluitend vanwege het feit dat het ziekenfonds niet voldoet aan
      [artikel 32, aanhef en onderdeel a, van die wet][ref12].

      6 Zolang het ziekenfonds, bedoeld in het eerste lid, niet voldoet aan
      [artikel 32, aanhef en onderdeel a, van de Wet toezicht verzekeringsbedrijf 1993][ref13] beperkt het zijn
      werkzaamheden tot uitvoering van de in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref14] bedoelde
      zorgverzekeringen.

      7 Ten aanzien van besluiten, genomen op grond van dit artikel, is de [Wet toezicht verzekeringsbedrijf 1993][ref15]
      van overeenkomstige toepassing.


