  - number: 3.1.2
    text: |-
      1 De persoon die op de dag voorafgaande aan de inwerkingtreding van [artikel 3.1.1][ref1] vrijwillig
      verzekerd was ingevolge [artikel 32a van de Algemene Wet Bijzondere Ziektekosten][ref2], heeft aanspraak
      op een vergoeding ter zake van de kosten van zorg waarop op die dag aanspraak bestond op grond van
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref3], voor zover:

      a. de verlening van de zorg op of voor die dag is begonnen of

      b. het zorg betreft waarop hij aansluitend aan en in plaats van de onder a bedoelde zorg in redelijkheid is
      aangewezen.

      2 Het eerste lid geldt vanaf 1 januari 2015 niet voor zorg als bedoeld in
      [artikel 8.1 van de Wet maatschappelijke ondersteuning 2015][ref4].


