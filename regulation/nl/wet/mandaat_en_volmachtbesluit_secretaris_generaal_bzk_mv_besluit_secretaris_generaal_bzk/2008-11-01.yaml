        artikel: '2'
  - number: '4.4'
    text: |-
      Het mandaat van de secretaris-generaal is niet van toepassing op het nemen van besluiten
      en het afdoen en ondertekenen van stukken met betrekking tot beslissingen ten aanzien
      van de directeur-generaal voor de Algemene Bestuursdienst, voor zover deze samenhangen
      met de taken, genoemd in [artikel 3.55, tweede lid, onder a tot en met d][ref1],
      [artikel 3.56, tweede lid, onder a tot en met f][ref2], [artikel 3.57, tweede lid, onder a en b][ref3] en
      [artikel 3.48, tweede lid, onder a tot en met c, van het Organisatiebesluit BZK 2006][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020525#Artikel3.55
      [ref2]: https://wetten.overheid.nl/BWBR0020525#Artikel3.56
      [ref3]: https://wetten.overheid.nl/BWBR0020525#Artikel3.57
      [ref4]: https://wetten.overheid.nl/BWBR0020525#Artikel3.48
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel4.4
