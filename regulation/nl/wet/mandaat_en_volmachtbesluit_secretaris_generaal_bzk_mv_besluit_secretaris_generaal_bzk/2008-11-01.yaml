preamble:
  text: |-
    Gelet op de Algemene wet bestuursrecht;

    Gelet op de Comptabiliteitswet en het Besluit privaatrechtelijke rechtshandelingen 1996;

    Gelet op het koninklijk besluit van 18 oktober 1988, houdende regeling van de functie en verantwoordelijkheid van
    de secretaris-generaal

    Besluit:
  url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - Ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - Minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - stuk: een schriftelijk stuk dat een besluit inhoudt of een ander schriftelijk stuk dat wordt toegerekend aan
      de Minister;
        - diensthoofd: de plaatsvervangend secretaris-generaal, een directeur-generaal, het hoofd van de Algemene
      Inlichtingen- en Veiligheidsdienst of het hoofd van de Inspectie Openbare Orde en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel1
  - number: '2.1'
    text: |-
      1 De secretaris-generaal is bevoegd om namens de Minister besluiten te nemen en stukken af te doen en te
      ondertekenen.

      2 De secretaris-generaal is bevoegd om namens de Minister voor de Staat privaatrechtelijke rechtshandelingen te
      verrichten.

      3 De bevoegdheden, bedoeld in het eerste lid, worden aangeduid als het mandaat, en de bevoegdheid, bedoeld in het
      tweede lid, wordt aangeduid als de volmacht van de secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel2.1
  - number: '2.2'
    text: |-
      Het mandaat en de volmacht van de secretaris-generaal wordt
      uitgeoefend ten aanzien van aangelegenheden die, gelet op het
      __REF000___________________________________________________________________________________________________________
      _________________, behoren tot het werkterrein van de secretaris-generaal overeenkomstig het
      [Organisatiebesluit BZK 2006][ref2] en die onverminderd het bepaalde in dit besluit, redelijkerwijs niet behoren te
      worden voorgelegd aan de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004419
      [ref2]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel2.2
    references:
