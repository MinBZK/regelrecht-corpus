        artikel: '8.1'
        paragraaf: '8'
  - number: '8.4'
    text: |-
      Wijziging van dit besluit geschiedt op initiatief van de directeur Personeel en Organisatie na advies van de
      directeur Financieel-economische Zaken en de directeur Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel8.4
  - number: '9.1'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin dit wordt
      geplaatst en werkt terug tot en met 1 oktober 2007.
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel9.1
  - number: '9.2'
    text: |-
      Dit besluit wordt aangehaald als: Mandaat- en volmachtbesluit secretaris-generaal BZK (MV-besluit secretaris-
      generaal BZK).
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel9.2
  - number: '9.3'
    text: |-
      Het [Mandaat- en volmachtbesluit secretaris-generaal BZK (MV-besluit secretaris-generaal BZK)][ref1] van
