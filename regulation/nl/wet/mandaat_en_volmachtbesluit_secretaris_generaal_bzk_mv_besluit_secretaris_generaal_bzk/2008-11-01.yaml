  - number: '7.2'
    text: |-
      De secretaris-generaal legt op verzoek van de Minister mondeling of schriftelijk verantwoording af over de
      uitoefening van zijn mandaat en volmacht.
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel7.2
  - number: '7.3'
    text: |-
      In gevallen waarin dit besluit niet voorziet, beslist de Minister die het aangaat over het verlenen van mandaat of
      een volmacht.
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel7.3
  - number: '8.1'
    text: |-
      1 De directeur Personeel en Organisatie is belast met het beheer van dit besluit.

      2 De secretaris-generaal en de diensthoofden, ieder voor zover het hem aangaat, zijn verantwoordelijk voor een
      juiste, volledige en tijdige aanlevering aan de directeur Personeel en Organisatie van de gegevens die een goed
      beheer van dit besluit onderscheidenlijk het mandaat- en volmachtregister mogelijk maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.

      4 De directeur Personeel en Organisatie rapporteert aan de Ministers en de secretaris-generaal over het beheer van
      dit besluit en het centrale mandaat- en volmachtregister.
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel8.1
  - number: '8.2'
    text: |-
      1 De directeur Personeel en Organisatie draagt zorg voor de inrichting en het beheer van een centraal mandaat-
      en volmachtregister.

      2 Het register biedt inzicht in:

      a. de functies en namen van functionarissen aan wie door of namens de Minister (onder)mandaat of een volmacht is
      (door)verleend, met aanduiding van de verleende bevoegdheid;

      b. de functies en namen van functionarissen die de Minister vertegenwoordigen in een (bestuurs)orgaan van een
      rechtspersoon anders dan de Staat, met aanduiding van het (bestuurs)orgaan en de rechtspersoon.

      3 Het register is openbaar.

      4 De directeur Personeel en Organisatie draagt zorg voor de gegevensverstrekking uit het register. Bij de
      uitvoering van deze werkzaamheden pleegt hij zo nodig overleg met de directeur Constitutionele Zaken en Wetgeving
      en de directeur Communicatie en Informatie.
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel8.2
  - number: '8.3'
    text: |-
      1 In afwijking van [artikel 8.1, tweede lid][ref1], worden gegevens met betrekking tot de verlening van
      ondermandaat en de doorverlening van volmachten aan functionarissen in de rang van directeur en daaronder
      ressorterende functionarissen bij de Algemene Inlichtingen- en Veiligheidsdienst opgenomen in een door het hoofd
      van de Algemene Inlichtingen- en Veiligheidsdienst bijgehouden mandaat- en volmachtregister.

      2 Het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst kan in overeenstemming met de secretaris-generaal
      nadere regels stellen ten aanzien van het register, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0023270#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel8.3
