  - number: '5'
    text: |-
      1 Bij tijdelijke afwezigheid of verhindering van de secretaris-generaal wordt diens mandaat en volmacht volledig
      uitgeoefend door de plaatsvervangend secretaris-generaal.

      2 Bij gelijktijdige tijdelijke afwezigheid of verhindering van de secretaris-generaal en de plaatsvervangend
      secretaris-generaal wordt het mandaat en de volmacht van de secretaris-generaal bij wijze van waarneming
      volledig uitgeoefend door de directeur-generaal die daartoe bij schriftelijk besluit van de secretaris-generaal
      in overeenstemming met de Minister is aangewezen. Bij gebreke van voornoemd besluit of bij afwezigheid van de
      aangewezen directeur-generaal is een van de directeuren-generaal, met uitzondering van de directeur-generaal
      voor de Algemene Bestuursdienst, naar anciënniteit van de benoeming in de functie van directeur-generaal, met de
      waarneming belast.

      3 Ondertekening van besluiten en stukken ingevolge dit artikel vindt plaats overeenkomstig [artikel 3][ref1], met
      dien verstande dat de handtekening voorafgegaan wordt door: b/a.


      [ref1]: https://wetten.overheid.nl/BWBR0023270#Artikel3
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0023270
        artikel: '3'
        paragraaf: '3'
  - number: '6.1'
    text: |-
      1 De secretaris-generaal is bevoegd tot het verlenen van ondermandaat en het doorverlenen van zijn volmacht
      aan een diensthoofd, ten aanzien van aangelegenheden op het werkterrein van het diensthoofd overeenkomstig het
      [Organisatiebesluit BZK 2006][ref1], respectievelijk tot het beperken of het intrekken daarvan.

      2 Het eerste lid is van overeenkomstige toepassing op onder de secretaris-generaal ressorterende functionarissen,
      niet zijnde diensthoofden.

      3 De secretaris-generaal kan met betrekking tot de bevoegdheid om te beslissen op bezwaarschriften ondermandaat
      verlenen aan de diensthoofden, met dien verstande dat ten aanzien van personele aangelegenheden alleen ondermandaat
      kan worden verleend aan de plaatsvervangend secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0020525
  - number: '6.2'
    text: |-
      De secretaris-generaal kan bij de uitoefening van de bevoegdheid, bedoeld in [artikel 6.1][ref1], tevens de
      bevoegdheid toekennen tot het verlenen van ondermandaat en het doorverlenen van de volmacht aan een rechtstreeks
      onder het desbetreffende diensthoofd of de desbetreffende functionaris ressorterende functionaris of in bijzondere
      gevallen aan een andere functionaris, ten aanzien van aangelegenheden op het werkterrein van de functionaris
      overeenkomstig het [Organisatiebesluit BZK 2006][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023270#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0023270
        artikel: '6.1'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0020525
  - number: '6.3'
    text: |-
      De secretaris-generaal is bevoegd om de plaatsvervangend secretaris-generaal, ten aanzien van door de
      secretaris-generaal met inachtneming van dit besluit en het [Organisatiebesluit BZK 2006][ref1] vast te stellen
      aangelegenheden, in de bevoegdheden en verantwoordelijkheden van de secretaris-generaal te laten treden.


      [ref1]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0020525
  - number: '6.4'
    text: |-
      De secretaris-generaal is bevoegd om de directeur-generaal Veiligheid, ten aanzien van aangelegenheden met
      betrekking tot het Korps Landelijke Politiediensten in de bevoegdheden en verantwoordelijkheden van de secretaris-
      generaal te laten treden.
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel6.4
  - number: '6.5'
    text: |-
      De uitoefening door de secretaris-generaal van de bevoegdheden, bedoeld in de [artikelen 6.1 tot en met 6.4][ref1],
      geschiedt bij schriftelijk besluit, na advies van de directeur Constitutionele Zaken en Wetgeving, de directeur
      Financieel-economische Zaken en de directeur Personeel en Organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0023270#Artikel6.1
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0023270
        artikel: '6.1'
        paragraaf: '6'
  - number: '6.6'
    text: |-
      De secretaris-generaal is bevoegd om in bijzondere gevallen, naast of in plaats van het bepaalde in
      deze paragraaf, mondeling of schriftelijk ondermandaat te verlenen onderscheidenlijk zijn volmacht door
      te verlenen aan een onder hem ressorterende functionaris voor een bepaald geval, met inachtneming van
      [artikel 1, derde lid, van het Besluit privaatrechtelijke rechtshandelingen 1996][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007804#Artikel1
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0007804
        artikel: '1'
  - number: '7.1'
    text: |-
      De uitoefening door de secretaris-generaal van zijn mandaat, onderscheidenlijk de uitoefening door een op grond van
      of krachtens dit besluit gemandateerde en gevolmachtigde van diens mandaat en volmacht, geschiedt met inachtneming
      van:

      a. algemene en bijzondere aanwijzingen van hiërarchisch hoger geplaatsten ten aanzien van de uitoefening van het
      mandaat en de volmacht;

      b. departementale richtlijnen met betrekking tot paraaf en medeparaaf en het voorleggen en afdoen van stukken;

      c. de van toepassing zijnde wet- en regelgeving en overige departementale richtlijnen, in
      het bijzonder de [Comptabiliteitswet][ref1], de [Wet op de ondernemingsraden][ref2], het
      [Besluit privaatrechtelijke rechtshandelingen 1996][ref3], het [Besluit taak FEZ][ref4], het
      [Organisatiebesluit BZK 2006][ref5] en (de richtlijnen inzake) administratieve organisatiebeschrijvingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891
      [ref2]: https://wetten.overheid.nl/BWBR0002747
      [ref3]: https://wetten.overheid.nl/BWBR0007804
      [ref4]: https://wetten.overheid.nl/BWBR0005333
      [ref5]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023270/2008-11-01#Artikel7.1
    references:
      - id: ref1
