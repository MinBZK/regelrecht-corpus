preamble:
  text: |-
    Na overleg met de representatieve organisaties;

    Gelet op de artikelen 4, tweede lid, 8, vierde lid en 22, vierde lid, van het Besluit toezicht
    beleggingsinstellingen 2005;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018620/2005-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Besluit: [Besluit toezicht beleggingsinstellingen 2005][ref1];

      b. DNB: De Nederlandsche Bank N.V.;

      c. instelling: de beheerder, de bewaarder of de beleggingsmaatschappij die niet wordt beheerd door een
      afzonderlijke beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0018622
    url: https://wetten.overheid.nl/BWBR0018620/2005-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018622
  - number: '2'
    text: |-
      1 Onder kernkapitaal wordt verstaan:

      a. voor een naamloze of besloten vennootschap: het geplaatste en volgestorte aandelenkapitaal, met uitsluiting van
      de cumulatief preferente aandelen voor zover deel uitmakend van het gestorte kapitaal;

      b. voor een coöperatie: het door de leden gestorte of ingelegde kapitaal, daaronder begrepen de
      aansprakelijkheidsverplichtingen van leden van coöperatieve instellingen, te weten het niet gestorte kapitaal
      en de statutaire verplichting van de leden van deze coöperatieve instellingen tot het doen van aanvullende niet
      terugbetaalbare stortingen bij verlies, mits die stortingen in dat geval onmiddellijk gevorderd kunnen worden;

      c. voor andere rechtsvormen: het voordelige verschil tussen bezittingen en schulden.

      2 Een naamloze vennootschap, besloten vennootschap of coöperatie voegt voor de berekening van de omvang van het
      kernkapitaal aan de in het desbetreffende onderdeel genoemde vermogensbestanddelen toe:

      a. de in de jaarrekening als zodanig gepresenteerde reserves, exclusief de herwaarderingsreserve;

      b. tussentijdse en door een accountant geverifieerde positieve resultaten, onder aftrek van uit te keren dividenden
      en te betalen belastingen. Tussentijdse negatieve resultaten worden direct in mindering gebracht van de in het
      desbetreffende onderdeel genoemde vermogensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0018620/2005-09-01#Artikel2
  - number: '3'
    text: |-
      1 Het aanvullend kapitaal wordt onderscheiden in hoger en lager aanvullend kapitaal.

      2 Onder hoger aanvullend kapitaal wordt verstaan:

      a. herwaarderingsreserves;

      b. cumulatief preferente aandelen met een onbepaalde looptijd, voor zover deel uitmakend van het gestorte kapitaal.

      3 Onder lager aanvullend kapitaal wordt verstaan:

      a. aansprakelijkheidsverplichtingen van leden van coöperatieve instellingen, te weten het niet gestorte kapitaal
      en de statutaire verplichting van de leden van deze coöperatieve instellingen tot het doen van aanvullende niet
      terugbetaalbare stortingen bij verlies, mits die stortingen in dat geval onmiddellijk gevorderd kunnen worden;

      b. cumulatief preferente aandelen met een vaste looptijd voor zover deel uitmakend van het gestorte kapitaal;

      c. achtergestelde leningen met een minimale oorspronkelijke looptijd van vijf jaren dan wel, indien de
      looptijd onbepaald is, leningen waarbij in de schuldovereenkomst een opzegtermijn van ten minste vijf jaren is
      overeengekomen, die voldoen aan de volgende voorwaarden:

      1°. vorderingen van de leninggever op de leningnemende instelling, voor zover het de terugbetaling van het
      leningsbedrag betreft, moeten volledig achtergesteld zijn bij die van alle niet-achtergestelde crediteuren;

      2°. gehele of gedeeltelijke aflossing van de achtergestelde lening is slechts mogelijk nadat DNB de opheffing
      van de achterstelling schriftelijk heeft goedgekeurd. Toestemming wordt verleend indien het verzoek uitgaat van
      de instelling, zijnde de leningnemer, en diens solvabiliteit niet zodanig wordt aangetast dat niet langer wordt
      voldaan aan de kapitaaleisen;

      3°. alleen de daadwerkelijk gestorte bedragen worden in aanmerking genomen;

      4°. de hoogte tot welke de achtergestelde lening kan worden gerekend tot het lager aanvullend kapitaal, zal lineair
      worden verlaagd gedurende ten minste de vijf jaar die voorafgaan aan de datum van de terugbetaling, inhoudende dat,
      rekening houdend met het aflossingsschema, bedragen met een resterende looptijd van 0 tot 1 jaar, van 1 tot 2 jaar,
      van 2 tot 3 jaar, van 3 tot 4 jaar en van 4 tot 5 jaar, voor 0%, 20%, 40%, 60%, respectievelijk voor 80% worden
      meegeteld voor het beschikbare lager aanvullend kapitaal; en

      5°. de leningovereenkomst bevat geen bepalingen krachtens welke de achtergestelde lening in bepaalde
      omstandigheden, anders dan na liquidatie van de beheerder, de bewaarder of de beleggingsmaatschappij die niet wordt
      beheerd door een afzonderlijke beheerder, voor de overeengekomen datum moet worden terugbetaald.
    url: https://wetten.overheid.nl/BWBR0018620/2005-09-01#Artikel3
  - number: '4'
    text: |-
      1 Het eigen vermogen van de instelling bestaat uit aanwezig kernkapitaal en aanvullend kapitaal.

      2 Het als eigen vermogen aan te merken aanvullend kapitaal is kleiner dan of gelijk aan het als kernkapitaal aan te
      merken eigen vermogen.

      3 Het als eigen vermogen aan te merken lager aanvullend kapitaal is kleiner dan of gelijk aan de helft van het als
      kernkapitaal aan te merken eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0018620/2005-09-01#Artikel4
  - number: '5'
    text: |-
      In afwijking van het bepaalde in [artikel 4][ref1] bestaat het eigen vermogen van de instellingen, bedoeld in
      [artikel 16, eerste lid, van het Besluit][ref2] uitsluitend uit het aanwezige kernkapitaal.


      [ref1]: https://wetten.overheid.nl/BWBR0018620#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018622#Artikel16
    url: https://wetten.overheid.nl/BWBR0018620/2005-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018620
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018622
        artikel: '16'
  - number: '6'
    text: |-
      Bij de berekening van de omvang van het kernkapitaal wordt buiten beschouwing gelaten:

      a. de geldwaarde van de eigen aandelen in portefeuille gewaardeerd tegen boekwaarde;

      b. immateriële activa;

      c. niet liquide activa, te weten:

      1°. materiële vaste activa minus het gedeelte waarop een hypothecaire zekerheid rust;

      2°. tekorten bij dochterondernemingen;

      3°. deposito’s, met uitzondering van die welke binnen 90 dagen opvraagbaar zijn, en tevens met uitzondering van
      margebetalingen in verband met futures en optiecontracten;

      4°. leningen en andere verschuldigde bedragen, met uitzondering van die welke binnen 90 dagen moeten worden
      terugbetaald;

      5°. ongedekte vorderingen op directie, personeel of gelieerde partijen;

      6°. materiële voorraden.
    url: https://wetten.overheid.nl/BWBR0018620/2005-09-01#Artikel6
  - number: '7'
    text: |-
      De waarde van door de instelling gehouden deelnemingen in, alsmede achtergestelde leningen en andere financiële
      instrumenten uitgegeven door een entiteit die onderhevig is aan eigen vermogenseisen ingevolge het prudentiële
      toezicht op de financiële sector, wordt in aftrek genomen op de desbetreffende elementen van het eigen vermogen van
      de instelling, voorzover die waarde tot het eigen vermogen van de uitgevende entiteit wordt gerekend.
    url: https://wetten.overheid.nl/BWBR0018620/2005-09-01#Artikel7
  - number: '8'
    text: |-
      Met het oog op de bewaking en beheersing van de solvabiliteitsrisico’s voorzien de beschrijving van de
      administratieve organisatie en het systeem van interne controle van de instelling tenminste in de bewaking en
      beheersing van:

      a. de aard en omvang van activa en passiva;

      b. de niet uit de balans blijkende verplichtingen;

      c. de resultaatontwikkeling, uitgesplitst naar de onderscheiden bedrijfsactiviteiten; en

      d. de resultaatontwikkeling, uitgesplitst naar de onderscheiden bedrijfsonderdelen.
    url: https://wetten.overheid.nl/BWBR0018620/2005-09-01#Artikel8
  - number: '9'
    text: |-
      Met het oog op de bewaking en beheersing van de liquiditeitsrisico’s van de beleggingsinstellingen als genoemd
      in [artikel 22, eerste lid, van het Besluit][ref1] voorzien de beschrijving van de administratieve organisatie
      en het systeem van interne controle van de beheerder van deze beleggingsinstellingen in autorisatieprocedures,
      limietstellingen, limietbewaking en procedures en maatregelen voor noodsituaties met betrekking tot de
      liquiditeitspositie van de door haar beheerde beleggingsinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018622#Artikel22
    url: https://wetten.overheid.nl/BWBR0018620/2005-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018622
        artikel: '22'
  - number: '10'
    text: |-
      Goederen die als liquiditeitswaarborgen kunnen worden aangemerkt, zijn:

      a. kasmiddelen, daggeld en direct opvraagbare tegoeden bij onder adequaat toezicht staande kredietinstellingen;

      b. commercial paper en certificates of deposit;

      c. effecten die genoteerd zijn aan van overheidswege erkende effectenbeurzen in de EU en G-10 landen of
      geregistreerd zijn bij Securities and Exchange Commission in de Verenigde Staten of aan andere door DNB
      geaccepteerde voldoende gereguleerde effectenbeurzen;

      d. stand-by faciliteiten afgegeven door onder adequaat toezicht staande kredietinstellingen; en

      e. onvoorwaardelijke garanties van onder adequaat toezicht staande kredietinstellingen en verzekeraars.
    url: https://wetten.overheid.nl/BWBR0018620/2005-09-01#Artikel10
  - number: '11'
    text: |-
      Ingetrokken worden:

      a. de ‘Vaststelling per 1 september 2002 door De Nederlandsche Bank N.V. van circulaires en beleidsregels op grond
      van de Wet toezicht beleggingsinstellingen’ (Stcrt. 2002, 169); en

      b. de volgende, als Bijlage bij deze regeling behorende, circulaires en beleidsregels:

      1°. Door (semi-)open end instellingen aan te houden waarborgen d.d. 14 mei 1992;

      2°. Jaarrekening/halfjaarcijfers d.d. 30 september 1993;

      3°. Het gebruik van technieken en instrumenten met betrekking tot beleggingen in effecten door instellingen voor
      collectieve belegging in effecten (icbe’s) d.d. 19 juni 1995;

      4°. Beleidsregels met betrekking tot de administratieve organisatie van beleggingsinstellingen d.d. 12 december
      1996;

      5°. Bestuurlijke boete en dwangsom d.d. 5 januari 2000;

      6°. Beleidsregel betrouwbaarheidtoetsing d.d. 14 augustus 2000;

      7°. Beleidsregel uitbesteding d.d. 11 januari 2002;

      8°. Mededeling in de Wtb-actueel nr VII, april 2000: eigen vermogen beleggingsinstelling en bewaarder.
    url: https://wetten.overheid.nl/BWBR0018620/2005-09-01#Artikel11
  - number: '12'
    text: Deze regeling treedt in werking met ingang van 1 september 2005.
    url: https://wetten.overheid.nl/BWBR0018620/2005-09-01#Artikel12
  - number: '13'
    text: 'Deze regeling wordt aangehaald als: Regeling prudentieel toezicht beleggingsinstellingen.'
    url: https://wetten.overheid.nl/BWBR0018620/2005-09-01#Artikel13
