---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_tegemoetkoming_werknemers_met_cse
regulatory_layer: WET
publication_date: '2024-12-03'
valid_from: '2023-01-01'
bwb_id: BWBR0043193
url: https://wetten.overheid.nl/BWBR0043193/2023-01-01
preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, en 9 van de Kaderwet SZW-subsidies, en artikel 34a van de Wet structuur
    uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−
    text: |-
      *CSE:* chronic solvent-induced encephalopathy, een aandoening van het centrale zenuwstelsel als gevolg van de
      langdurige blootstelling aan oplosmiddelen;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−
    text: |-
      *CSE-panel:* multidisciplinair team van experts dat gespecialiseerd is in de aandoening CSE en beoordeelt of een
      afgegeven diagnose voldoet aan de criteria uit deze regeling;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−
    text: '*Instituut Asbestslachtoffers:* Stichting Instituut Asbestslachtoffers te ’s-Gravenhage;'
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−
    text: '*lasten:*'
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−.a
    text: voorschot;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−.b
    text: |-
      vergoedingen die door de SVB aan het Instituut Asbestslachtoffers worden verstrekt voor de advisering ten behoeve
      van deze regeling;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−
    text: '*minister:* Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−
    text: '*nabestaanden:*'
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−.a
    text: de langstlevende van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−.b
    text: |-
      bij ontstentenis van de onder a bedoelde persoon, de minderjarige kinderen, tot wie de overledene in
      familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−.c
    text: bij ontstentenis van de onder a en b bedoelde personen, degenen met wie hij in gezinsverband leefde;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−.d
    text: |-
      bij ontstentenis van de onder a, b en c bedoelde personen, erfgenamen als bedoeld in
      [Boek 4 van het Burgerlijk Wetboek][ref1], mits een verklaring van erfrecht wordt overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0002761
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002761
  - number: 1.1.−
    text: |-
      *oplosmiddelen:* vluchtige organische stoffen als bedoeld in
      [artikel 4.62a van het Arbeidsomstandighedenbesluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 1.1.−
    text: |-
      *Solvent Team:* multidisciplinair team van experts, gevestigd in het Academisch Medisch Centrum te Amsterdam, dat
      gespecialiseerd is in het vaststellen of uitsluiten van de aandoening CSE en daarover een diagnose stelt;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−
    text: |-
      *SVB:* Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: 1.1.−
    text: |-
      *voorschot:* tegemoetkoming als voorschot op de eventuele vordering van immateriële schade op de werkgever op wie
      deze schade kan worden verhaald;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−
    text: |-
      *werkgever:* natuurlijke of rechtspersoon voor wie de werknemer arbeid in Nederland verricht of heeft verricht
      krachtens een Nederlandse publiekrechtelijke aanstelling of krachtens een arbeidsovereenkomst waarop Nederlands
      recht van toepassing is of was;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: 1.1.−
    text: |-
      *werknemer:* degene die voor een natuurlijke of rechtspersoon arbeid in Nederland verricht of heeft verricht
      krachtens een Nederlandse publiekrechtelijke aanstelling of krachtens een arbeidsovereenkomst waarop Nederlands
      recht van toepassing is of was.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: '1.2'
    text: |-
      In deze regeling wordt met de echtgenoot gelijkgesteld de geregistreerde partner en de persoon die op grond van
      [artikel 1, derde lid, onderdeel a, en vierde tot en met zevende lid, van de Algemene Ouderdomswet][ref1] en de
      daarop berustende bepalingen mede als zodanig wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel1
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '1'
  - number: '1.3'
    text: |-
      In deze regeling wordt niet als echtgenoot aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie
      hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel1
  - number: '2'
    text: |-
      Arbeid die wordt verricht aan boord van schepen en luchtvaartuigen die in Nederland hun thuishaven hebben, wordt
      ten opzichte van de bemanning aangemerkt als in Nederland verrichte arbeid.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel2
  - number: '3.1'
    text: 'De werknemer bij wie de aandoening CSE is vastgesteld heeft recht op een voorschot, indien:'
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel3
  - number: 3.1.a
    text: de aandoening CSE voor 1 maart 2020 is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel3
  - number: 3.1.b
    text: |-
      het CSE-panel heeft geconcludeerd dat de diagnose CSE voldoet aan de richtlijnen uit het artikel 'Chronic solvent-
      induced encephalopathy: European consensus of neuropsychological characteristics, assessment, and guidelines for
      diagnostics' zoals gepubliceerd in het tijdschrift NeuroToxicology 33 (2012), p. 710–726;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel3
  - number: 3.1.c
    text: |-
      hij aannemelijk heeft gemaakt dat de aandoening CSE is veroorzaakt door de blootstelling aan oplosmiddelen tijdens
      het verrichten van arbeid als werknemer;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel3
  - number: 3.1.d
    text: |-
      hij geen betaling in verband met de aandoening CSE van een of meer werkgevers heeft ontvangen, dan wel in verband
      daarmee een bedrag heeft ontvangen dat lager is dan € 22.839,-, ongeacht de vorm waarin de betaling is gedaan en de
      aard van de kosten waarin de betaling voorziet;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel3
  - number: 3.1.e
    text: |-
      hij zich verplicht tot medewerking aan bemiddeling door het Instituut Asbestslachtoffers tussen hem en zijn
      werkgever om de schade vergoed te krijgen en, met inachtneming van onderdeel f, tot medewerking om de schade zo
      nodig langs gerechtelijke weg vergoed te krijgen;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel3
  - number: 3.1.f
    text: |-
      hij de SVB een onherroepelijke volmacht als bedoeld in [artikel 74 van Boek 3 van het Burgerlijk Wetboek][ref1]
      heeft verleend om:


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel74
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '74'
  - number: 3.1.f.1°
    text: zo nodig de immateriële schade langs gerechtelijke weg te verhalen;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel3
  - number: 3.1.f.2°
    text: |-
      de immateriële schadevergoeding namens hem van de werkgever te innen, teneinde dit te verrekenen met het verleende
      voorschot;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel3
  - number: 3.1.g
    text: |-
      hij, indien hij een betaling van de werkgever ontvangt in verband met de aandoening CSE na uitbetaling van
      het voorschot, het voorschot voor het geheel of, wanneer de betaling lager is dan het verleende voorschot, het
      voorschot voor dat deel aan de SVB terugbetaalt; en
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel3
  - number: 3.1.h
    text: hij aan de SVB onverwijld mededeling doet van ontvangst van de betaling, bedoeld in onderdeel g.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel3
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid, onderdeel a, kan een werknemer tevens recht hebben op een voorschot, indien ten
      behoeve van de werknemer uiterlijk op 1 september 2020 een verzoek voor een diagnose is ingediend bij het Solvent
      Team en dit later leidt tot de diagnose CSE door het Solvent Team.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel3
  - number: '4'
    text: |-
      De nabestaanden hebben in plaats van de werknemer recht op het voorschot indien de werknemer is overleden nadat
      hij de aanvraag heeft ingediend, doch voordat op de aanvraag is beslist, en de werknemer recht op het voorschot zou
      hebben gehad.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel4
  - number: '5'
    text: |-
      Indien de werknemer bij wie de aandoening CSE is vastgesteld tevens tijdens het verrichten van arbeid buiten
      Nederland is blootgesteld aan oplosmiddelen en in verband daarmee een betaling van een werkgever of buitenlandse
      werkgever heeft ontvangen, bestaat het recht op een voorschot in afwijking van [artikel 3][ref1] uitsluitend voor
      zover die betaling lager is dan € 22.839,-, ongeacht de vorm waarin de betaling is gedaan en de aard van de kosten
      waarin de betaling voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0043193#Artikel3
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0043193
        artikel: '3'
        hoofdstuk: '2'
  - number: '6.1'
    text: Het voorschot bedraagt € 22.839,-.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien een of meer werkgevers een bedrag hebben betaald aan de werknemer in verband met de aandoening CSE dat in
      totaal lager is dan € 22.839,- of indien de werknemer betalingen heeft ontvangen als bedoeld in [artikel 5][ref1]
      wordt de hoogte van het voorschot vastgesteld op het verschil tussen de ontvangen bedragen en € 22.839,-.


      [ref1]: https://wetten.overheid.nl/BWBR0043193#Artikel5
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0043193
        artikel: '5'
        hoofdstuk: '2'
  - number: '6.3'
    text: |-
      Voor de toepassing van het tweede lid wordt als maatstaf genomen de hoogte van de betalingen nadat daarop de
      verschuldigde belasting op grond van de [Wet inkomstenbelasting 2001][ref1] en premies voor de volksverzekeringen
      op grond van de [Wet financiering sociale verzekeringen][ref2] in mindering zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0017745
  - number: '7.1'
    text: De SVB stelt op aanvraag van de werknemer vast of recht op het voorschot bestaat.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel7
  - number: '7.2'
    text: Een aanvraag voor het voorschot wordt bij de SVB ingediend.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel7
  - number: '8.1'
    text: |-
      De behandeling van de aanvraag wordt in de situatie dat de werknemer is overleden nadat hij de aanvraag heeft
      ingediend, doch voordat op de aanvraag is beslist, ten behoeve van de nabestaanden voortgezet, tenzij deze
      schriftelijk te kennen geven daarop geen prijs te stellen.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien er meer dan één nabestaande is, dragen de nabestaanden er zorg voor dat aan één van hen een volmacht wordt
      verleend tot vertegenwoordiging ten behoeve van de uitvoering van deze regeling, het in ontvangst nemen van het
      voorschot daarbij inbegrepen.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel8
  - number: '9.1'
    text: |-
      De werknemer verstrekt de SVB of de door haar aangewezen personen of instellingen bij de indiening van de aanvraag
      om een voorschot in ieder geval de bewijsstukken die noodzakelijk zijn om vast te stellen dat:
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel9
  - number: 9.1.a
    text: hij voorafgaand aan de inwerkingtreding van de regeling is gediagnosticeerd met de aandoening CSE; of
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel9
  - number: 9.1.b
    text: |-
      uiterlijk op 1 september 2020 voor hem een verzoek voor een diagnose is ingediend bij het Solvent Team en dit later
      heeft geleid tot de diagnose CSE door het Solvent Team.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel9
  - number: '9.2'
    text: |-
      In verband met de voorwaarde dat aannemelijk wordt gemaakt dat de aandoening CSE is veroorzaakt door blootstelling
      aan oplosmiddelen tijdens het verrichten van arbeid als werknemer verstrekt de werknemer de SVB of de door haar
      aangewezen personen of instellingen bij de indiening van de aanvraag om een voorschot de inlichtingen en zo
      mogelijk bewijsstukken omtrent:
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel9
  - number: 9.2.a
    text: de blootstelling aan oplosmiddelen gedurende het verrichten van arbeid als werknemer;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel9
  - number: 9.2.b
    text: de periode gedurende welke die blootstelling aan oplosmiddelen heeft plaatsgevonden; en
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel9
  - number: 9.2.c
    text: |-
      degenen die in verband met de arbeid waarbij die blootstelling aan oplosmiddelen heeft plaatsgevonden als werkgever
      worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel9
  - number: '9.3'
    text: |-
      De werknemer verstrekt de SVB of de door haar aangewezen personen of instellingen op verzoek of uit eigen beweging
      de overige inlichtingen en bewijsstukken die nodig zijn voor de uitvoering van deze regeling en verleent ook
      overigens de medewerking die redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel9
  - number: '9.4'
    text: |-
      Indien de aanvraag om het voorschot van een werknemer na diens overlijden wordt voortgezet ten behoeve van de
      nabestaanden, is dit artikel op hen van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel9
  - number: '10'
    text: |-
      De SVB betaalt het voorschot zo spoedig mogelijk uit aan de werknemer of de nabestaande, bedoeld in
      [artikel 8, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043193#Artikel8
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0043193
        artikel: '8'
        hoofdstuk: '3'
  - number: '11.1'
    text: |-
      De SVB herziet een besluit tot toekenning van het voorschot of trekt dat in indien degene aan wie het voorschot is
      toegekend of de nabestaande hiervan:
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel11
  - number: 11.1.a
    text: |-
      nadien alsnog een betaling heeft ontvangen waarmee rekening zou zijn gehouden bij de vaststelling van het recht op
      het voorschot; of
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel11
  - number: 11.1.b
    text: |-
      een verplichting als bedoeld in de [artikelen 3, eerste lid, onder e, g of h][ref1], of [9][ref2] niet of niet
      behoorlijk is nagekomen en dit heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van het
      voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0043193#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0043193#Artikel9
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0043193
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0043193
        artikel: '9'
        hoofdstuk: '3'
  - number: '11.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de SVB besluiten geheel of gedeeltelijk van herziening of
      intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel11
  - number: '11.3'
    text: |-
      Het voorschot dat als gevolg van een besluit als bedoeld in het eerste lid ten onrechte of tot een te hoog bedrag
      is verleend, alsmede hetgeen anderszins onverschuldigd is betaald, wordt van degene aan wie het voorschot is
      toegekend, of de nabestaande hiervan, teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel11
  - number: '12'
    text: |-
      De in deze regeling genoemde bedragen worden jaarlijks herzien op 1 januari. De bedragen worden herzien in de mate
      waarin het bedrag genoemd in [artikel 8, eerste lid, onder a, van de Wet minimumloon en minimumvakantiebijslag][ref1]
      in het voorgaande kalenderjaar is herzien op grond van [artikel 14, eerste en tweede lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '13'
    text: Deze regeling wordt uitgevoerd door de SVB.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel13
  - number: '14.1'
    text: De SVB kan over het recht op het voorschot advies vragen aan het Instituut Asbestslachtoffers.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel14
  - number: '14.2'
    text: De SVB stelt de eisen vast waaraan het advies voldoet en stelt een termijn binnen welke het advies wordt verwacht.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel14
  - number: '15.1'
    text: |-
      De SVB en het Instituut Asbestslachtoffers stellen een overeenkomst op betreffende de samenwerking en werkwijze in
      het kader van de uitvoering van deze regeling.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel15
  - number: '15.2'
    text: 'In de in het eerste lid bedoelde overeenkomst wordt ten minste vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel15
  - number: 15.2.a
    text: op welke wijze de behandeling van aanvragen om een voorschot plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel15
  - number: 15.2.b
    text: op welke wijze de juistheid en de volledigheid van de verkregen inlichtingen wordt onderzocht;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel15
  - number: 15.2.c
    text: op welke wijze de informatievoorziening aan belanghebbenden wordt ingericht;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel15
  - number: 15.2.d
    text: welke vergoeding door de SVB aan het Instituut Asbestslachtoffers zal worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel15
  - number: 15.2.e
    text: op welke wijze de verstrekking van de vergoedingen, bedoeld onder d, zal worden ingericht;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel15
  - number: 15.2.f
    text: |-
      dat periodiek overleg zal worden gevoerd betreffende de uitvoering van deze regeling, alsmede de frequentie
      daarvan;
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel15
  - number: 15.2.g
    text: |-
      welke informatie door het Instituut Asbestslachtoffers aan de SVB wordt verstrekt ten behoeve van de
      informatieverplichting van de SVB aan de minister; en
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel15
  - number: 15.2.h
    text: hoe uit de overeenkomst voortvloeiende geschillen zullen worden beslecht.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel15
  - number: '16.1'
    text: |-
      Voor 1 oktober van elk jaar verstrekt de SVB aan de minister in het jaarplan met begroting een opgave van het
      totaalbedrag aan de voor het komende jaar geraamde baten en lasten met betrekking tot deze regeling, uitgesplitst
      naar uitkeringslasten per maand en uitvoeringskosten per jaar.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel16
  - number: '16.2'
    text: |-
      In de opgave van de uitkeringslasten, bedoeld in het eerste lid, wordt rekening gehouden met de posten genoemd in
      [artikel 18, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043193#Artikel18
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0043193
        artikel: '18'
        hoofdstuk: '5'
  - number: '17.1'
    text: |-
      De uitkeringslasten en uitvoeringskosten van deze regeling worden gefinancierd uit een rijksbijdrage ten laste van
      de begroting van de minister.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel17
  - number: '17.2'
    text: |-
      De minister stort op de rekening-courant, bedoeld in [artikel 5.16, onderdeel a, van de Regeling Wfsv][ref1], een
      periodiek voorschot op het bedrag, bedoeld in [artikel 16, eerste lid][ref2], van:


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0043193#Artikel16
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0043193
        artikel: '16'
        hoofdstuk: '5'
  - number: 17.2.a
    text: geraamde uitkeringslasten met als valutadatum de tweeëntwintigste dag van elke maand; en
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel17
  - number: 17.2.b
    text: 1/12de deel van de geraamde uitvoeringskosten met als valutadatum de vijftiende dag van elke maand.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel17
  - number: '17.3'
    text: De minister kan, na overleg met de SVB, van de in het tweede lid, onderdeel a en b, bedoelde bedragen afwijken.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel17
  - number: '18.1'
    text: |-
      In de jaarrekening, bedoeld in [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      worden de baten en lasten, alsmede de ontvangen voorschotten, bedoeld in [artikel 17, tweede lid][ref2],
      uitgesplitst naar uitkeringslasten en uitvoeringskosten, met betrekking tot deze regeling opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0043193#Artikel17
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0043193
        artikel: '17'
        hoofdstuk: '5'
  - number: '18.2'
    text: 'Op de in het eerste lid bedoelde uitkeringslasten komen in mindering:'
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel18
  - number: 18.2.a
    text: |-
      de bedragen die op grond van [artikelen 3, eerste lid, onder f en g][ref1], zijn terugbetaald;


      [ref1]: https://wetten.overheid.nl/BWBR0043193#Artikel3
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0043193
        artikel: '3'
        hoofdstuk: '2'
  - number: 18.2.b
    text: |-
      de voorschotten die op grond van [artikel 11][ref1] zijn teruggevorderd en zijn terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0043193#Artikel11
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0043193
        artikel: '11'
        hoofdstuk: '4'
  - number: '18.3'
    text: |-
      Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1], rekent de minister de baten
      en lasten, alsmede de ontvangen voorschotten, met betrekking tot het desbetreffende kalenderjaar af, met als
      valutadatum 1 juni van het hierop volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
  - number: '20'
    text: Deze regeling treedt in werking met ingang van 1 maart 2020.
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel20
  - number: '21'
    text: 'Deze regeling wordt aangehaald als: Regeling tegemoetkoming werknemers met CSE.'
    url: https://wetten.overheid.nl/BWBR0043193/2023-01-01#Artikel21
