preamble:
  text: |-
    Gelet op artikel 3, vierde lid, artikel 4, vierde lid, artikel 11 en artikel 13, eerste lid, van het
    Huisvestingsbesluit WVO/WCBO, artikel 29 van het Bekostigingsbesluit WVO, artikel D.7 van het Uitvoeringsbesluit
    WCBO en artikel 57, twaalfde en dertiende lid, van het Besluit vormingswerk voor jeugdigen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt onder school verstaan:

      a. een school voor voortgezet onderwijs als bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref1] met
      uitzondering van een school voor landbouwonderwijs;

      b. een school voor beroepsbegeleidend onderwijs als bedoeld in artikel 1.1 van de Wet op het cursorisch
      beroepsonderwijs;

      c. een landelijk orgaan als bedoeld in artikel 2.38 van de Wet op het cursorisch beroepsonderwijs met uitzondering
      van een landelijk orgaan werkzaam op het gebied van de landbouw, tenzij het tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
    url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '1'
  - number: '2'
    text: |-
      Onder voorzieningen in de inventaris wordt verstaan de eerste aanschaf van de schoolmeubelen en de eerste aanschaf
      van de leer- en hulpmiddelen, opgenomen in het voor het desbetreffende jaar geldende programma van eisen voor de
      inventariskosten, voor zover de noodzaak van deze aanschaf voortvloeit uit de toename van het aantal leerlingen in
      relatie tot het door de school aangeboden en door het Rijk bekostigde onderwijs.
    url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#Artikel2
  - number: '3'
    text: |-
      Tot de voorzieningen in de huisvesting behoren uitsluitend de voorzieningen opgenomen in de programma's van
      eisen huisvestings- en inventariskosten als geldend voor het desbetreffende bekostigingsjaar, voor zover deze
      voorzieningen direct voortvloeien uit het door de school aangeboden en door het Rijk bekostigde onderwijs.
    url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#Artikel3
  - number: '4'
    text: |-
      Onverminderd het bepaalde in de [artikelen 2][ref1] en [3][ref2] zijn voorzieningen in de huisvesting en in de
      inventaris ten behoeve van scholen voor voortgezet algemeen volwassenenonderwijs die niet overeenkomen met het
      onderwijs dat vóór 31 juli 1993 werd verzorgd en de plaatsen waar dat onderwijs werd aangeboden, geen voorzieningen
      in de huisvesting en in de inventaris.


      [ref1]: https://wetten.overheid.nl/BWBR0006130#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006130#Artikel3
    url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006130
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006130
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: |-
      1 Het model voor aanvragen voor voorzieningen in de huisvesting wordt vastgesteld overeenkomstig bijlage I bij
      deze regeling.

      2 De aanvraag omvat mede een opgave van de huisvestings voorzieningen waarover de school per 15 september
      voorafgaand aan de datum van het indienen van de aanvraag beschikt. In plaats van deze opgave kan het bevoegd gezag
      volstaan met een verwijzing naar de gegevens die de minister van onderwijs en wetenschappen bekend zijn geworden op
      basis van de meldingen, bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006130#Artikel6
    url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006130
        artikel: '6'
        paragraaf: '3'
  - number: '6'
    text: |-
      1 Het model voor de opgave van wijzigingen in het huisvestingsbestand van een school wordt vastgesteld
      overeenkomstig bijlage II bij deze regeling.

      2 Een mededeling als bedoeld in het eerste lid kan slechts betrekking hebben op een wijziging die zich ten hoogste
      vier weken voor inzending heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#Artikel6
  - number: '7'
    text: |-
      1 Het voornemen tot het geheel of gedeeltelijk onttrekken aan de bestemming van gebouwen, terreinen of roerende
      zaken, ten behoeve waarvan vergoeding is genoten, wordt aan de minister van onderwijs en wetenschappen medegedeeld
      ten minste zes maanden voorafgaand aan de voorgenomen datum van onttrekking.

      2 Het model voor de melding, bedoeld in het eerste lid, wordt ingesteld overeenkomstig bijlage III bij deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#Artikel7
  - number: '8'
    text: |-
      De methodiek voor het opstellen van leerlingenprognoses wordt vastgesteld overeenkomstig bijlage IV bij deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#Artikel8
  - number: '9'
    text: |-
      De berekeningsmethodiek voor de genormeerde ruimtebehoefte wordt vastgesteld overeenkomstig bijlage V bij deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#Artikel9
  - number: '10'
    text: |-
      De prioriteit van de aangevraagde voorzieningen in de huisvesting en in de inventaris wordt vastgesteld met
      toepassing van de criteria als vastgesteld in de bijlagen VI, VII en VIII bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#Artikel10
  - number: '11'
    text: |-
      De tarieven ingebruikgeving en verhuur van terreinen en lokalen worden vastgesteld overeenkomstig bijlage IX bij
      deze regeling.
    url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#Artikel11
  - number: '12'
    text: |-
      De bepalingen, bij of krachtens het Huisvestingsbesluit WVO/WCBO gegeven, zijn van overeenkomstige toepassing op de
      vormingsinstuten voor jeugdigen.
    url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#Artikel12
  - number: '13'
    text: |-
      De Regeling vaststelling aanvraagformulier kleine huisvestingsvoorzieningen (KHV) (Uitleg OenW-Regelingen 1993,
      18c) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#Artikel13
  - number: '14'
    text: |-
      Deze regeling wordt bekendgemaakt in het officiële publikatieblad van het Ministerie van Onderwijs en
      Wetenschappen.
    url: https://wetten.overheid.nl/BWBR0006130/1995-10-28#Artikel14
  - number: '15'
    text: |-
      1 Deze regeling treedt met uitzondering van [artikel 13][ref1] in werking met ingang van de derde dag na de datum
      van uitgifte van het officiële publikatieblad van het Ministerie van onderwijs en Wetenschappen, en werkt terug tot
      en met 1 augustus 1993.

      2 [Artikel 13][ref2] treedt in werking met ingang van 1 oktober 1993.


      [ref1]: https://wetten.overheid.nl/BWBR0006130#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006130#Artikel13
