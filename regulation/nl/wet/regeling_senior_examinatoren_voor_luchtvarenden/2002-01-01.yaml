        artikel: '2.5'
  - number: '8'
    text: |-
      1 Om in aanmerking te kunnen komen voor een benoeming tot senior-examinator met betrekking tot een bepaalde
      autorisatie tot examinator:

      a. is een persoon binnen de vijf jaar voorafgaand aan de eventuele benoeming tenminste drie jaar werkzaam geweest
      als examinator binnen de betreffende autorisatie, en

      b. heeft een persoon minimaal 1000 uur instructie gegeven binnen de instructeursbevoegdverklaring, benodigd voor de
      afgifte van de betreffende autorisatie.

      2 Onverminderd het eerste lid, heeft een persoon om in aanmerking te kunnen komen voor een benoeming tot senior-
      examinator met betrekking tot de autorisatie tot FE, CRE, IRE of FIE tenminste 1500 uur vliegervaring als houder
      van een CPL of ATPL binnen de categorie luchtvaartuigen, waarvoor de benoeming tot senior-examinator zal gaan
      gelden.

      3 Onverminderd het eerste lid, heeft een persoon om in aanmerking te kunnen komen voor een benoeming tot senior-
      examinator met betrekking tot de autorisatie tot TRE tenminste 1500 uur vliegervaring als eerste bestuurder
      als houder van een ATPL, respectievelijk als boordwerktuigkundige als houder van een CFEL, binnen de categorie
      luchtvaartuigen waarvoor de benoeming tot senior-examinator zal gaan gelden.
    url: https://wetten.overheid.nl/BWBR0012780/2002-01-01#Artikel8
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
