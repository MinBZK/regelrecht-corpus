preamble:
  text: |-
    Gelet op artikel 15, tweede lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012780/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



             acceptatietest:

              examinatorenvaardigheidstest, als bedoeld in artikel 9, eerste lid, van de Regeling examinatoren voor
      luchtvarenden 2001, alsmede JAR-FCL 1.425 (a)(3), JAR-FCL 2.425 (a)(3), of JAR-FCL 4.425(a)(3);



             examenkandidaat:

              persoon die om aan te tonen dat hij voldoet aan de bedrevenheidseisen voor afgifte of verlenging van een
      bewijs van bevoegdheid of bevoegdverklaring een praktijkexamen of proeve van bekwaamheid aflegt, op de wijze als
      bedoeld in het Examenreglement voor luchtvarenden 2001;






            examinator:

              geautoriseerd examinator als bedoeld in de Regeling examinatoren voor luchtvarenden 2001;






            minister:

              Minister van Verkeer en Waterstaat;






            wet:

              [Wet luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0012780/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: '2'
    text: |-
      De minister kan per categorie luchtvaartuigen senior-examinatoren benoemen met betrekking tot de volgende
      autorisaties tot examinator als bedoeld in de Regeling examinatoren voor luchtvarenden:

      a. FE;

      b. FIE;

      c. CRE;

      d. TRE;

      e. IRE;

      f. RFE;

      g. RFIE.
    url: https://wetten.overheid.nl/BWBR0012780/2002-01-01#Artikel2
  - number: '3'
    text: |-
      1 Een senior-examinator heeft de volgende taken die worden uitgeoefend op verzoek van de minister:

      a. het uitoefenen van supervisie met betrekking tot acceptatietesten, zoals uitgevoerd door een kandidaat-
      examinator ter verkrijging van een autorisatie tot examinator, als bedoeld in de Regeling examinatoren voor
      luchtvarenden 2001;

      b. tijdens het uitoefenen van supervisie met betrekking tot acceptatietesten als bedoeld in onderdeel a, uitoefenen
      van de bevoegdheden van een examinator ten opzichte van de examenkandidaat;

      c. het beoordelen van het afnemen van praktijkexamens en proeven van bekwaamheid door een examinator, in het kader
      van een verlenging van een autorisatie tot examinator, als bedoeld in de Regeling examinatoren voor luchtvarenden
      2001;

      d. het leveren van een bijdrage aan de standaardisatie van praktijkexamens en proeven van bekwaamheid;

      e. het leveren van een bijdrage aan de waarborging van de kwaliteit van praktijkexamens, proeven van bekwaamheid
      en praktijkexaminatoren;

      f. het leveren van ondersteuning aan werkzaamheden ten behoeve van praktijkexamens en proeven van bekwaamheid.

      2 De taken, bedoeld in het eerste lid, worden slechts uitgeoefend ten aanzien van de autorisatie tot examinator met
      betrekking waartoe de senior-examinator is benoemd.

      3 De taken, bedoeld in het eerste lid, worden slechts uitgeoefend met betrekking tot de categorie luchtvaartuigen
      waarvoor de senior-examinator is benoemd.
    url: https://wetten.overheid.nl/BWBR0012780/2002-01-01#Artikel3
  - number: '4'
    text: |-
      1 Een senior-examinator die hetzij niet meer in het bezit is van de autorisatie tot examinator met betrekking
      waartoe deze als senior-examinator is benoemd, hetzij niet gerechtigd is de bij deze autorisatie behorende
      bevoegdheden uit te oefenen, oefent geen supervisie uit met betrekking tot acceptatietesten ter verkrijging van een
      autorisatie tot examinator.

      2 Onverminderd het eerste lid zal een senior-examinator in ieder geval geen supervisie uitoefenen met betrekking
      tot acceptatietesten of het afnemen van examens of proeven van bekwaamheid beoordelen als deze een examen of
      proeve van bekwaamheid voor een type- of klassebevoegdheid inhouden en de senior-examinator binnen de relevante
      autorisatie niet de bevoegdheid heeft tot het examineren voor tenminste één type- of klassebevoegdverklaring.
    url: https://wetten.overheid.nl/BWBR0012780/2002-01-01#Artikel4
  - number: '5'
    text: |-
      1 Een senior-examinator, die in dienst is van een luchtvaartmaatschappij of opleidingsinstelling, oefent geen
      supervisie uit met betrekking tot een acceptatietest als deze wordt uitgevoerd door een kandidaat-examinator die in
      dienst is van dezelfde luchtvaartmaatschappij of opleidingsinstelling.

      2 De minister kan van het gestelde in het eerste lid ontheffing verlenen indien dit in redelijkheid geen toepassing
      kan vinden.
    url: https://wetten.overheid.nl/BWBR0012780/2002-01-01#Artikel5
  - number: '6'
    text: |-
      1 Een senior-examinator, niet zijnde een senior-examinator met betrekking tot de autorisatie tot RFE of RFIE,
      kan indien deze een taak uitoefent als bedoeld in [artikel 3][ref1], hiervoor een vergoeding declareren bij de
      minister.

      2 De vergoeding, bedoeld in het eerste lid, bestaat uit:

      a. een honorarium dat €189 per dag bedraagt, en

      b. de ten behoeve van het uitoefenen van de taak gemaakte reis- en verblijfkosten die volgens het
      [Reisbesluit binnenland][ref2] worden vergoed.

      3 Reis- en verblijfkosten die een senior-examinator in het buitenland maakt worden niet vergoed door de minister.

      4 Een senior-examinator, die in dienst is van een luchtvaartmaatschappij of opleidingsinstelling, declareert geen
      vergoeding bij de minister:

      a. in gevallen waarin [artikel 5, tweede lid][ref3], toepassing vindt, hij supervisie uitoefent met betrekking tot
      een acceptatietest zoals uitgevoerd door een kandidaat-examinator in dienst van dezelfde luchtvaartmaatschappij of
      opleidingsinstelling, of

      b. in het kader van een verlenging van een autorisatie tot examinator, hij het afnemen van een praktijkexamen of
      proeve van bekwaamheid door een examinator in dienst van dezelfde luchtvaartmaatschappij of opleidingsinstelling
      beoordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0012780#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005889
      [ref3]: https://wetten.overheid.nl/BWBR0012780#Artikel5
    url: https://wetten.overheid.nl/BWBR0012780/2002-01-01#Artikel6
