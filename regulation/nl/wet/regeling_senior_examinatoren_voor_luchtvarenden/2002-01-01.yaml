  - number: '7'
    text: |-
      1 Senior-examinatoren worden voor onbepaalde tijd benoemd.

      2 Een benoeming tot senior-examinator vervalt van rechtswege:

      a. als de autorisatie tot examinator met betrekking waartoe de senior-examinator is benoemd op grond van
      [artikel 2.6, derde lid van de wet][ref1] is ingetrokken;

      b. op de eerste dag van de maand nadat de senior-examinator drie jaar hetzij niet meer in het bezit is van de
      autorisatie tot examinator met betrekking waartoe deze is benoemd, hetzij niet meer gerechtigd is de bij deze
      autorisatie behorende bevoegdheden uit te oefenen;

      c. op de eerste dag van de maand nadat de senior-examinator de leeftijd van vijfenzestig jaar heeft bereikt.

      3 Een benoeming tot senior-examinator vervalt op schriftelijk verzoek van de senior-examinator.

      4 Een benoeming tot senior-examinator is geschorst gedurende de periode waarin de autorisatie tot examinator met
      betrekking waartoe de senior-examinator is benoemd op grond van [artikel 2.5, zesde lid, van de wet][ref2] is
      geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0012780/2002-01-01#Artikel7
    references:
