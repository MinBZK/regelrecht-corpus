preamble:
  text: |-
    Gelet op artikel 15.13, eerste tot en met derde lid, van de Wet milieubeheer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *aanschaf:*


              eigendomsverkrijging door levering krachtens in het kalenderjaar 2003 met een leverancier gesloten
      koopovereenkomst;



            b

              *aanvraag:*


              schriftelijk verzoek aan een energiebedrijf om uitkering van een energiepremie;



            c

              *aanvrager:*


              eigenaar, huurder of verhuurder van een als woning gebruikte onroerende zaak waaraan energie wordt
      geleverd, die een aanvraag heeft ingediend;



            d

              *apparaat:*


              in het kalenderjaar 2003 aangeschaft, in een woning geïnstalleerd en in werking zijnd nieuw energiezuinig
      apparaat als genoemd in [bijlage 1][ref1];



            e

              *energie:*


              gas, electriciteit, warmte of koude;



            f

              *energiebedrijf:*


              vergunninghouder als bedoeld in [artikel 54 van de Electriciteitswet 1998][ref2] of
      [artikel 23 van de Gaswet][ref3], dan wel de Federatie van Energiebedrijven in Nederland, EnergieNed, waaraan
      subsidie als bedoeld in [artikel 2, eerste of tweede lid][ref4], wordt verstrekt;



            g

              *energiepremie:*


              in [bijlage 1][ref5] genoemde premie, uit te keren vanwege de aanschaf van een daarin genoemd apparaat of
      een daarin genoemde voorziening;



            h

              *minister:*


              Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;



            i

              *uitvoeringsovereenkomst:*


              tussen de Staat en een energiebedrijf gesloten overeenkomst tot uitvoering van deze regeling;



            j

              *voorziening:*


              in het kalenderjaar 2003 aangeschafte, in of aan een woning aangebrachte en in werking zijnde nieuwe
      energiebesparende voorziening of maatregel als genoemd in [bijlage 1][ref6];
      EnergiePrestatieAdvies waarvoor in het kalenderjaar 2003 opdracht is gegeven, dat voldoet aan het in
      [bijlage 2][ref7] opgenomen programma van eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0014481
