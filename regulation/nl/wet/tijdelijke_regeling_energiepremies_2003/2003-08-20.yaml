  - number: '2.1'
    text: |-
      Ter bevordering van energiebesparing door huishoudens wordt overeenkomstig deze regeling en de
      uitvoeringsovereenkomst aan energiebedrijven subsidie verstrekt ten behoeve van het uitkeren van energiepremies.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel2
  - number: '2.2'
    text: |-
      Voorzover subsidie als bedoeld in het eerste lid wordt verstrekt, wordt overeenkomstig deze regeling en de
      uitvoeringsovereenkomst aan de desbetreffende energiebedrijven tevens subsidie verstrekt tot vergoeding van de door
      deze bij het uitkeren van energiepremies werkelijk gemaakte uitvoeringskosten.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel2
  - number: '3.1'
    text: |-
      Voor het kalenderjaar 2003 geldt voor de subsidie, bedoeld in [artikel 2, eerste lid][ref1], een subsidieplafond
      van € 54 miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0014481#Artikel2
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014481
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      Bij de verlening van subsidie als bedoeld in het eerste lid wordt beslist in de volgorde van de
      ontvangst van de aanvragen om subsidie, met dien verstande dat wanneer een energiebedrijf krachtens
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag om subsidie aan te
      vullen, de dag waarop die aanvraag is aangevuld voor die beslissing als datum van ontvangst van die aanvraag geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '4.1'
    text: |-
      Subsidiabele kosten die in aanmerking komen voor subsidie als bedoeld in [artikel 2, eerste lid][ref1], zijn de
      door een energiebedrijf uitgekeerde energiepremies.


      [ref1]: https://wetten.overheid.nl/BWBR0014481#Artikel2
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014481
        artikel: '2'
        paragraaf: '2'
  - number: '4.2'
    text: |-
      Subsidiabele kosten die in aanmerking komen voor subsidie als bedoeld in [artikel 2, tweede lid][ref1], zijn de
      door een energiebedrijf bij het uitkeren van energiepremies werkelijk gemaakte uitvoeringskosten, voorzover deze
      kosten in overeenstemming zijn met het daaromtrent bepaalde in de uitvoeringsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0014481#Artikel2
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014481
        artikel: '2'
        paragraaf: '2'
  - number: '5.1'
    text: |-
      Subsidie als bedoeld in [artikel 2, eerste lid][ref1], wordt slechts verstrekt voorzover een energiebedrijf
      energiepremies heeft uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014481#Artikel2
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014481
        artikel: '2'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      Subsidie als bedoeld in [artikel 2, tweede lid][ref1], wordt slechts verstrekt voorzover een energiebedrijf bij
      het uitkeren van energiepremies, bedoeld in het eerste lid, werkelijke uitvoeringskosten in overeenstemming met het
      daaromtrent bepaalde in de uitvoeringsovereenkomst heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0014481#Artikel2
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014481
        artikel: '2'
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Subsidie als bedoeld in [artikel 2, tweede lid][ref1], kan worden verstrekt door middel van een vaste vergoeding
      per door een energiebedrijf in behandeling genomen aanvraag of veelvoud daarvan, die voor verschillende categorieën
      aanvragen verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014481#Artikel2
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014481
        artikel: '2'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Subsidie als bedoeld in [artikel 2, tweede lid][ref1], kan voorts worden verstrekt door middel van een vergoeding
      voor de bij het uitkeren van energiepremies door een of meer energiebedrijven werkelijk gemaakte kosten van
      automatisering, communicatie en accountantscontrole.


      [ref1]: https://wetten.overheid.nl/BWBR0014481#Artikel2
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014481
        artikel: '2'
        paragraaf: '2'
  - number: '6.3'
    text: De hoogte van vergoedingen als bedoeld in het eerste en tweede lid wordt vastgesteld in de uitvoeringsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel6
  - number: '6.4'
    text: |-
      Bij het afleggen van rekening en verantwoording als bedoeld in
      [artikel 4:45, tweede lid, van de Algemene wet bestuursrecht][ref1], worden de aan het uitkeren van
      energiepremies verbonden werkelijke kosten als bedoeld in [artikel 6, eerste en tweede lid][ref2],
      aangetoond met behulp van een goedkeurende verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014481#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0014481
        artikel: '6'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '7.1'
    text: |-
      Subsidie als bedoeld in [artikel 2, eerste en tweede lid][ref1], wordt verleend onder de voorwaarde dat het
      energiebedrijf meewerkt aan de totstandkoming of wijziging van een uitvoeringsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0014481#Artikel2
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014481
        artikel: '2'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      De energiebedrijven kunnen gezamenlijk nadere regels van administratieve en procedurele aard stellen ter uitvoering
      van deze regeling en de uitvoeringsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel7
  - number: '8.1'
    text: |-
      Een aanvraag wordt binnen dertien weken na de aanschaf van een apparaat of voorziening ingediend bij het
      energiebedrijf dat energie levert aan de als woning gebruikte onroerende zaak van de aanvrager, met gebruikmaking
      van een daartoe door de leverancier of het energiebedrijf ter beschikking gesteld aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel8
  - number: '8.2'
    text: |-
      Binnen zes weken na ontvangst van een volledige aanvraag beslist het energiebedrijf op de aanvraag. Deze termijn
      kan éénmaal onder opgaaf van redenen met vier weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel8
  - number: '8.3'
    text: |-
      Voorzover de beslissing op de aanvraag strekt tot het geheel of gedeeltelijk afwijzen van de aanvraag, wordt deze
      gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel8
  - number: '9.1'
    text: |-
      Voorzover een aanvraag geheel of gedeeltelijk wordt afgewezen dan wel een aanvrager niet, of niet tijdig, een
      beslissing op de aanvraag heeft ontvangen kan deze binnen zes weken na de afwijzing, respectievelijk na de dag
      waarop de beslissing had moeten zijn ontvangen, de minister verzoeken een besluit te nemen omtrent de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel9
  - number: '9.2'
    text: |-
      Bij een verzoek als bedoeld in het eerste lid wordt gebruikgemaakt van een daartoe door de minister vastgesteld
      formulier dat wordt verstrekt bij de beslissing op de aanvraag dan wel, indien geen beslissing op de aanvraag is
      ontvangen, desgevraagd wordt verstrekt door het energiebedrijf.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel9
  - number: '9.3'
    text: |-
      Voorzover het besluit van de minister strekt tot het in afwijking van de afwijzing of het niet of niet tijdig
      beslissen door het energiebedrijf geheel of gedeeltelijk toewijzen van de aanvraag, is het desbetreffende
      energiebedrijf gehouden binnen zes weken na dagtekening van het besluit daaraan gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel9
  - number: '10.1'
    text: |-
      Een energiebedrijf kan, teneinde te controleren of aan de voorwaarden voor uitkering van een energiepremie wordt
      voldaan, een aanvrager verzoeken om:
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel10
  - number: 10.1.a
    text: |-
      aan een of meer door het energiebedrijf daartoe aangewezen persoon of personen toegang te verlenen tot de plaats of
      de plaatsen in de woning, waar het apparaat of de voorziening is geïnstalleerd, respectievelijk is aangebracht, en
      in werking is,
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel10
  - number: 10.1.b
    text: |-
      inzage te verlenen in boeken en bescheiden waar gegevens met betrekking tot de aanschaf, de installatie of het
      aanbrengen en in werking zijn van het apparaat of de voorziening zijn opgenomen, en gelegenheid te bieden daarvan
      afschrift te nemen,
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel10
  - number: 10.1.c
    text: medewerking te verlenen aan het verstrekken van gegevens door derden.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel10
  - number: '10.2'
    text: |-
      Indien een aanvrager nalaat medewerking te verlenen aan een verzoek als bedoeld in het eerste lid kan de aanvraag
      worden afgewezen.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel10
  - number: '11'
    text: |-
      In gevallen waarin een aanvraag terzake van een in 2002 aangeschaft apparaat of aangeschafte voorziening eerst
      op of na 1 april 2003 kan worden ingediend omdat het installeren of aanbrengen en in werking brengen van het
      apparaat, respectievelijk de voorziening, niet vóór die datum heeft plaatsgehad en om die reden geen uitkering
      van een energiepremie uit hoofde van de Uitvoeringsregeling energiepremies plaatsvindt, kan de minister de
      aanvraag toewijzen en een energiepremie uitkeren overeenkomstig de in die regeling opgenomen Energiepremie-Lijst
      2002 voorzover het niet toewijzen van de aanvraag in het betreffende geval zal leiden tot een onbillijkheid van
      overwegende aard.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel11
  - number: '12.1'
    text: De Regeling EnergiePrestatieAdvies 2002 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel12
  - number: '12.2'
    text: |-
      Ten aanzien van een voor het tijdstip van inwerkingtreding van deze regeling uitgebracht EnergiePrestatieAdvies
      blijft de Regeling EnergiePrestatieAdvies 2002 van toepassing.
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel12
  - number: '13'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2003 en vervalt met ingang van 1 januari 2004, met dien
      verstande dat zij daarna van toepassing blijft op:
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel13
  - number: 13.a
    text: |-
      een vóór 1 januari 2004 ingediende aanvraag, voorzover eerst op of na die datum een beslissing op die aanvraag
      onherroepelijk wordt;
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel13
  - number: 13.b
    text: |-
      een aanvraag terzake van de aanschaf van een apparaat of voorziening, die met inachtneming van de in
      [artikel 8, eerste lid][ref1], genoemde termijn eerst op of na 1 januari 2004 wordt ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0014481#Artikel8
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014481
        artikel: '8'
        paragraaf: '6'
  - number: 13.c
    text: |-
      een aanvraag terzake van de aanschaf van een apparaat of voorziening die eerst op of na 1 januari 2004 kan worden
      ingediend omdat de levering ervan aan de aanvrager niet vóór die datum heeft plaatsgehad, met dien verstande dat in
      een dergelijk geval de aanvraag met inachtneming van de in [artikel 8, eerste lid][ref1], genoemde termijn doch in
      elk geval vóór 1 juli 2004 wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0014481#Artikel8
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014481
        artikel: '8'
        paragraaf: '6'
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling energiepremies 2003.'
    url: https://wetten.overheid.nl/BWBR0014481/2003-08-20#Artikel14
