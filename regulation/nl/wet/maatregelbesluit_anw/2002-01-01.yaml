---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: maatregelbesluit_anw
regulatory_layer: WET
publication_date: '2008-05-07'
valid_from: '2002-01-01'
bwb_id: BWBR0008018
url: https://wetten.overheid.nl/BWBR0008018/2002-01-01
preamble:
  text: |-
    Gelet op artikel 38, vijfde lid, van de Algemene nabestaandenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel1
  - number: 1.a
    text: |-
      de Anw: de [Algemene nabestaandenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 1.b
    text: 'de Bank: de Sociale Verzekeringsbank;'
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel1
  - number: 1.c
    text: |-
      uitkering: een nabestaandenuitkering, halfwezenuitkering of wezenuitkering als bedoeld in
      [Hoofdstuk 3, Afdeling I, van de Anw][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007795#AfdelingI
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007795
        afdeling: I
  - number: 1.d
    text: |-
      nabestaande: degene die een nabestaandenuitkering of een halfwezenuitkering ontvangt dan wel voor een zodanige
      uitkering in aanmerking wenst te komen;
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel1
  - number: 1.e
    text: |-
      wees: degene aan wie een wezenuitkering is toegekend, die een zodanige uitkering heeft aangevraagd dan wel voor wie
      een zodanige uitkering is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel1
  - number: '2.1'
    text: 'Dit besluit is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel2
  - number: 2.1.a
    text: de nabestaande;
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel2
  - number: 2.1.b
    text: de wees;
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel2
  - number: 2.1.c
    text: de wettelijke vertegenwoordiger van de nabestaande of de wees.
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel2
  - number: '2.2'
    text: Dit besluit is ook van toepassing als de in het eerste lid bedoelde personen in het buitenland wonen.
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      Indien degene op wie dit besluit van toepassing is de verplichting om op verzoek informatie te verstrekken als
      bedoeld in [artikel 35 Anw][ref1], niet binnen de door de Sociale Verzekeringsbank daarvoor vastgestelde termijn is
      nagekomen, of een verplichting, genoemd in de [artikelen 3 tot en met 11 van de Controlevoorschriften Anw][ref2],
      niet of niet behoorlijk is nagekomen, wordt de uitkering tijdelijk gedeeltelijk geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008019#Artikel3
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0008019
        artikel: '3'
  - number: '3.2'
    text: |-
      De weigering, bedoeld in het eerste lid, vindt plaats door een bedrag, dat met inachtneming van [artikel 4][ref1]
      is vastgesteld, in mindering te brengen op de eerstvolgende uit te betalen termijn of termijnen van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008018#Artikel4
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008018
        artikel: '4'
        hoofdstuk: '2'
  - number: '3.3'
    text: |-
      In afwijking van het eerste lid vindt geen weigering plaats maar wordt een schriftelijke waarschuwing gegeven
      indien het niet tijdig nakomen van de verplichting om op verzoek informatie te verstrekken als bedoeld in
      [artikel 35 Anw][ref1], niet heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering,
      tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel35
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '35'
  - number: 3.3.a
    text: door de Bank ter zake van het niet tijdig nakomen van de verplichting reeds een schorsingsbeslissing is genomen; of
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel3
  - number: 3.3.b
    text: |-
      het niet nakomen van de verplichting plaatsvindt binnen een periode van twee jaar, te rekenen vanaf de datum waarop
      aan de mededelingsplichtige reeds eerder een zodanige waarschuwing is gegeven.
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      Bij het na een schriftelijk rappel of een schriftelijke waarschuwing niet binnen twee weken, dan wel op een door
      de Bank nader vast te stellen tijdstip, nakomen van een verplichting als bedoeld in [artikel 37 Anw][ref1] of in
      de [artikelen 3][ref2] en [5 tot en met 11 van de Controlevoorschriften Anw][ref3], wordt eenmalig een bedrag van €
      22,– in mindering gebracht op de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0008019#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008019#Artikel5
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0008019
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0008019
        artikel: '5'
  - number: '4.2'
    text: |-
      Bij het niet nakomen van een verplichting als bedoeld in [artikel 4 van de Controlevoorschriften Anw][ref1] wordt
      eenmalig een bedrag van € 22,– in mindering gebracht op de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008019#Artikel4
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008019
        artikel: '4'
  - number: '4.3'
    text: |-
      Indien binnen een kalendermaand twee of meer verplichtingen, genoemd in de
      [artikelen 3 tot en met 11 van de Controlevoorschriften Anw][ref1], niet worden nagekomen, wordt eenmaal het in het
      eerste lid genoemde bedrag op de uitkering in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008019#Artikel3
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008019
        artikel: '3'
  - number: '4.4'
    text: |-
      Indien binnen twee jaren na de dag waarop een weigering als gevolg van het niet nakomen van één of meer
      verplichtingen is bekendgemaakt, opnieuw één of meer verplichtingen niet worden nagekomen, wordt eenmalig een
      bedrag van € 34,– in mindering gebracht op de uitkering.
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel4
  - number: '5'
    text: |-
      Indien ten genoegen van de Bank aannemelijk wordt gemaakt dat het niet nakomen van een verplichting zoals opgelegd
      in de [Controlevoorschriften Anw][ref1] niet kan worden verweten aan degene aan wie de verplichting is opgelegd,
      worden de [artikelen 3][ref2] en [4][ref3] niet toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0008019
      [ref2]: https://wetten.overheid.nl/BWBR0008018#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008018#Artikel4
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008019
      - id: ref2
        bwb_id: BWBR0008018
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0008018
        artikel: '4'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      Indien ten genoegen van de Bank aannemelijk wordt gemaakt dat het niet nakomen van een verplichting zoals opgelegd
      in de [Controlevoorschriften Anw][ref1] aan degene aan wie de verplichting is opgelegd in verminderde mate kan
      worden verweten, wordt het bedrag dat is vastgesteld met toepassing van [artikel 4][ref2] gehalveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008019
      [ref2]: https://wetten.overheid.nl/BWBR0008018#Artikel4
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008019
      - id: ref2
        bwb_id: BWBR0008018
        artikel: '4'
        hoofdstuk: '2'
  - number: '7'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel7
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: Maatregelbesluit Anw.'
    url: https://wetten.overheid.nl/BWBR0008018/2002-01-01#Artikel8
