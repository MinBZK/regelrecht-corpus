preamble:
  text: >-
    Gelet op artikel 2, tweede lid, aanhef en onderdeel b en g, en achtste lid van de Wet College voor examens;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0033826/2014-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      De dagen waarop in 2015 de centrale examens beginnen zijn:


      a. het eerste tijdvak begint op 11 mei in het v.w.o., h.a.v.o. en v.m.b.o.;


      b. het tweede tijdvak begint op 3 juni in de basisberoepsgerichte, de kaderberoepsgerichte leerweg en de gemengde
      leerweg, en op 16 juni in de andere vormen van onderwijs;


      c. het derde tijdvak vindt plaats in augustus.
    url: https://wetten.overheid.nl/BWBR0033826/2014-08-01#Artikel1
  - number: '2'
    text: |-
      1 De dagen en uren waarop de toetsen van het centraal examen in het eerste tijdvak worden afgenomen zijn
      vastgesteld zoals vermeld in [bijlage 1A][ref1] bij deze regeling.

      2 De dagen waarop de toetsen van het centraal examen in het tweede tijdvak worden afgenomen zijn vastgesteld zoals
      vermeld in [bijlage 1B][ref2] bij deze regeling, met dien verstande dat in maart 2015 een nadere indeling van de
      vakken bekend gemaakt wordt.

      3 De dagen en uren waarop de toetsen van het centraal examen in het derde tijdvak worden afgenomen worden na
      aanmelding meegedeeld door het College voor examens.


      [ref1]: https://wetten.overheid.nl/BWBR0033826
      [ref2]: https://wetten.overheid.nl/BWBR0033826
    url: https://wetten.overheid.nl/BWBR0033826/2014-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033826
      - id: ref2
        bwb_id: BWBR0033826
  - number: '3'
    text: |-
      In afwijking van [artikel 1, onderdeel a][ref1], valt van de volgende toetsen het begin van de periode waarbinnen
      de afname dient plaats te vinden, voor aanvang van het eerste tijdvak:

      a. Voor zover het bevoegd gezag het moment van afname van deze toetsen, of delen daarvan, voor aanvang van het
      eerste tijdvak vaststelt:

      1. In de basisberoepsgerichte, kaderberoepsgerichte en gemengde leerweg: het centraal schriftelijk en praktisch
      examen (c.s.p.e.).

      2. In de basisberoepsgerichte leerweg en indien van toepassing de kaderberoepsgerichte leerweg: de digitale afname
      van de algemene vakken.

      3. In de gemengde en theoretische leerweg het centraal praktisch examen van kunstvakken 2, beeldende vakken.

      b. In het v.w.o.: het centraal praktische examen van tekenen, handvaardigheid, textiele vormgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0033826#Artikel1
    url: https://wetten.overheid.nl/BWBR0033826/2014-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0033826
        artikel: '1'
  - number: '4'
    text: |-
      Bij de centrale examens 2015 zijn de algemene hulpmiddelen toegestaan, zoals vermeld in [bijlage 2A][ref1] voor het
      vmbo en [bijlage 2B][ref2] voor havo en vwo.


      [ref1]: https://wetten.overheid.nl/BWBR0033826
      [ref2]: https://wetten.overheid.nl/BWBR0033826
    url: https://wetten.overheid.nl/BWBR0033826/2014-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033826
      - id: ref2
        bwb_id: BWBR0033826
  - number: '5'
    text: |-
      Bij de centrale examens 2015 zijn met betrekking tot kandidaten met een beperking, bij toepassing van *artikel 55
      Eindexamenbesluit*, *Afwijking wijze van examineren*, hulpmiddelen toegestaan, zoals vermeld in [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033826
    url: https://wetten.overheid.nl/BWBR0033826/2014-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033826
  - number: '6'
    text: >-
      De regeling zal met de bijlagen en toelichting in de Staatscourant worden geplaatst. De bijlagen kunnen ook
      geraadpleegd worden op Examenblad.nl.
    url: https://wetten.overheid.nl/BWBR0033826/2014-08-01#Artikel6
  - number: '7'
    text: Deze regeling treedt in werking op 1 augustus 2014
    url: https://wetten.overheid.nl/BWBR0033826/2014-08-01#Artikel7
  - number: '8'
    text: >-
      Deze regeling kan worden aangehaald als Regeling rooster en toegestane hulpmiddelen voor de centrale examens van de
      eindexamens en de staatsexamens vwo, havo en vmbo in 2015.
    url: https://wetten.overheid.nl/BWBR0033826/2014-08-01#Artikel8
