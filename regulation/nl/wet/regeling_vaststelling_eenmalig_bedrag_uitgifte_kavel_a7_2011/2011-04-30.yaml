  - number: '4'
    text: |-
      [Artikel 4 van de Regeling vaststelling eenmalig bedrag landelijke commerciële radio-omroep 2011][ref1] is van
      overeenkomstige toepassing op degene die houder is van een vergunning voor digitale radio-omroep welke verleend is
      met toepassing van de [Regeling aanvraag][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029752#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0029915
    url: https://wetten.overheid.nl/BWBR0029920/2011-04-30#Artikel4
    references:
