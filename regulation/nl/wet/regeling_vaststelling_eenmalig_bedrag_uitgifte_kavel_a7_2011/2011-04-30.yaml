      a. *minister:* Minister van Economische Zaken, Landbouw en Innovatie;

      b. *Regeling aanvraag:*
      __REF000___________________________________________________________________________________________________________
      ___________________________________;

      c. *kavel A7:* kavel A7 zoals bepaald in [artikel 1 van de Regeling aanvraag][ref2];

      d. *vergunning voor digitale radio-omroep:* vergunning voor digitale radio-omroep zoals bepaald in
      [artikel 1 van de Regeling aanvraag][ref3].


