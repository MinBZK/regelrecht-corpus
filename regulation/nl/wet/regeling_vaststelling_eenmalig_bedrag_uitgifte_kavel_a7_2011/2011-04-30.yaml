  - number: '2'
    text: |-
      1 De verkrijger of houder van een vergunning voor kavel A7 en van een vergunning voor digitale radio-omroep
      welke verleend is met toepassing van de [Regeling aanvraag][ref1], is voor het gebruik van de desbetreffende
      frequentieruimte gedurende de periode van 1 september 2011 tot en met 31 augustus 2017 een eenmalig bedrag
      verschuldigd, waarvan de hoogte is: € 17.563.200,–.

      2 Indien de verlening van de vergunningen met toepassing van de [Regeling aanvraag][ref2] plaats vindt na 1
      september 2011, is voor de resterende periode tot en met 31 augustus 2017 een eenmalig bedrag verschuldigd waarvan
      de hoogte wordt bepaald door het desbetreffende eenmalig bedrag, genoemd in het eerste lid, te vermenigvuldigen met
      een breuk waarvan de teller wordt gevormd door het aantal hele maanden dat na het tijdstip van vergunningverlening
      resteert tot en met 31 augustus 2017 en de noemer door het getal 72.


      [ref1]: https://wetten.overheid.nl/BWBR0029915
      [ref2]: https://wetten.overheid.nl/BWBR0029915
    url: https://wetten.overheid.nl/BWBR0029920/2011-04-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029915
      - id: ref2
        bwb_id: BWBR0029915
  - number: '3'
    text: |-
      1 De verkrijger of de houder van de vergunningen betaalt het op grond van [artikel 2][ref1] verschuldigde bedrag
      uiterlijk op 1 september 2011 of, indien het tijdstip van vergunningverlening later ligt dan 21 juli 2011,
      uiterlijk zes weken na dat tijdstip.

      2 Indien op verzoek van de verkrijger of de houder van de vergunningen in afwijking van het eerste lid uitstel
      van betaling wordt verleend, worden aan de beschikking tot uitstel van betaling de voorschriften verbonden dat het
      verschuldigde bedrag wordt betaald in zes gelijke termijnen die steeds jaarlijks vervallen op 1 september, voor
      het eerst op 1 september 2011, en dat de verkrijger respectievelijk de houder van de vergunningen een waarborgsom
      verstrekt of een bankgarantie volgens het model, opgenomen in de bijlage, overlegt ter hoogte van een zesde deel
      van het verschuldigde bedrag. Indien het tijdstip van vergunningverlening later ligt dan 21 juli 2011, vervalt de
      eerste termijn uiterlijk zes weken na dat tijdstip.

      3 Voor de betaling door de verkrijger of de houder van het door hem op grond van [artikel 2][ref2] verschuldigde
      bedrag wordt mede:

      a. de waarborgsom aangewend die op grond van [artikel 6 van de Regeling aanvraag][ref3] is verstrekt, of

      b. in het geval de verkrijger niet tijdig of niet volledig heeft betaald, de bankgarantie aangewend die op grond
      van [artikel 6 van de Regeling aanvraag][ref4] is verstrekt.

      4 De betalingen worden verricht door overmaking op het bankrekeningnummer 56.99.94.039, ten name van Ministerie van
      Economische Zaken, Landbouw en Innovatie; Agentschap Telecom, onder vermelding van ‘kavel A7’ en van ‘vergunning
      voor digitale radio-omroep’.

      5 De minister kan een geldschuld jegens de vergunninghouder die verband houdt met een bij of krachtens
      [hoofdstuk 3 van de Telecommunicatiewet][ref5] genomen besluit, verrekenen met een vordering op grond van
      [artikel 2][ref6].


