        bwb_id: BWBR0029752
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0029915
  - number: '5'
    text: |-
      1 Indien op grond van de [Regeling aanvraag][ref1] aan een aanvrager geen vergunningen
      worden verleend voor kavel A7 en voor digitale radio-omroep, wordt de door hem op grond van
      [artikel 6, eerste lid, van de Regeling aanvraag][ref2] verstrekte waarborgsom of bankgarantie door de Minister van
      Economische Zaken, Landbouw en Innovatie teruggestort, respectievelijk teruggegeven.

      2 Bij toepassing van het eerste lid vergoedt de minister de rente over de gestorte waarborgsom vanaf de dag waarop
      hij de waarborgsom heeft ontvangen op het bankrekeningnummer, genoemd in [artikel 3, vierde lid][ref3], met dien
      verstande dat de rente wordt vergoed tot en met de dagvoorafgaand aan de dag waarop de waarborgsom door de minister
      wordt teruggestort.

      3 Bij toepassing van [artikel 3, derde lid, onderdeel a][ref4], vergoedt de minister de rente over de op grond van
      [artikel 6, eerste lid, van de Regeling aanvraag][ref5] verstrekte gestorte waarborgsom vanaf de dag waarop het
      besluit tot vaststelling van dit bedrag aan hem bekend is gemaakt tot en met 31 augustus 2011.

      4 De rente wordt berekend volgens actual/360 op basis van de door de Europese Centrale Bank vastgestelde Euro
      Overnight Index Average, minus 4 basispunten.


