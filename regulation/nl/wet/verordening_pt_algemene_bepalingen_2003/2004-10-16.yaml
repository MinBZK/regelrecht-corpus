        artikel: 3:3
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:7
    text: |-
      1 De betaling geschiedt binnen 30 dagen na dagtekening van de nota.

      2 In afwijking van het eerste lid is de nota is terstond invorderbaar zodra:

      a. het faillissement van de heffingsplichtige is aangevraagd;

      b. degene die de onderneming drijft de onderneming beëindigt, of van het voornemen daartoe blijkt, of

      c. degene die de onderneming drijft zich metterwoon in het buitenland heeft gevestigd of van het voornemen daartoe
      blijkt.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel37
  - number: 3:8
    text: |-
      De heffingsplichtige, die niet of niet geheel binnen de in [artikel 3:7][ref1] bedoelde termijn heeft betaald,
      worden de daaruit voortvloeiende extra kosten van € 22,50 in rekening gebracht, alsmede de wettelijke interest
      over het niet betaalde bedrag, te berekenen vanaf de dag waarop de betaling diende te zijn verricht, ingevolge de
      aanmaning als bedoeld in [artikel 127, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016684#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel127
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0016684
        artikel: 3:7
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '127'
  - number: 3:9
    text: |-
      De invorderingskosten voortvloeiend uit het niet betalen binnen de termijn als bedoeld in [artikel 3:7][ref1] en
      [3:8][ref2]. zijn voor rekening en risico van de ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0016684#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0016684#Artikel38
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0016684
        artikel: 3:7
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016684
        artikel: 3:8
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:10
    text: |-
      De voorzitter is belast met de oplegging en inning van de heffing en de daarmee samenhangende kosten als bedoeld in
      de [artikelen 3:7 tot en met 3:9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016684#Artikel37
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel310
    references:
      - id: ref1
        bwb_id: BWBR0016684
        artikel: 3:7
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 4:1
    text: |-
      Iedere ondernemer is verplicht de voor de afnemer bestemde facturen op de dag van uitvoer, onderscheidenlijk het
      brengen buiten het verzendgebied, aan het productschap toe te zenden.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel41
  - number: 4:2
    text: |-
      In afwijking van het bepaalde in [artikel 4:1][ref1] zendt iedere ondernemer die bloemkwekerijproducten verhandelt
      de facturen aan het Hoofdbedrijfschap Agrarische Groothandel/bloemen en planten.


      [ref1]: https://wetten.overheid.nl/BWBR0016684#Artikel41
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0016684
        artikel: 4:1
        hoofdstuk: '4'
  - number: 4:3
    text: |-
      De ondernemer die bloemkwekerijproducten uitvoert of buiten het verzendgebied brengt, is verplicht om, zodra
      de buitenlandse afnemer een zending bloemkwekerijproducten heeft betaald, het Hoofdbedrijfschap Agrarische
      Groothandel/Bloem en Planten van deze betaling in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel43
  - number: 4:4
    text: |-
      Het bestuur van het productschap en kan omtrent de uitvoering van het bepaalde in dit hoofdstuk nadere
      voorschriften stellen.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel44
  - number: 5:1
    text: |-
      De [artikelen 26][ref1] en [27 van de wet][ref2] zijn van overeenkomstige toepassing op het (dagelijks) bestuur, de
      (sector)commissies, overige commissies en werkverbanden, behoudens het bepaalde in [artikel 90 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002058#Artikel90
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0002058
        artikel: '90'
  - number: 5:2
    text: |-
      De [artikelen 10][ref1] en [77 van de wet][ref2] zijn ten aanzien van (dagelijks)bestuur, (sector)commissies,
      overige commissies en werkverbanden van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel77
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '77'
  - number: 6:1
    text: |-
      1 De voorzitter heeft in het bijzonder de taak leiding te geven aan de werkzaamheden van het productschap. Hij
      beslist in alle huishoudelijke aangelegenheden, voor zover deze niet tot de bevoegdheid van een ander orgaan
      behoren. Hij houdt toezicht op het secretariaat.

      2 Hij is bestuurder in de zin van de [Wet op de ondernemingsraden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 6:2
    text: |-
      De voorzitter is belast met de uitvoering van verordeningen en besluiten van het (dagelijks) bestuur en oefent
      de daarmee verband houdende bevoegdheden uit, tenzij deze bevoegdheden uitdrukkelijk aan het (dagelijks) bestuur
      zijn voorbehouden en met dien verstande, dat het (dagelijks) bestuur, ingeval het zulks nodig oordeelt, een andere
      voorziening kan treffen.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel62
  - number: 6:3
    text: |-
      De voorzitter is bevoegd de tekst van ontwerp-verordeningen als bedoeld in [artikel 100 van de wet][ref1], vast te
      stellen. Het bestuur kan, ingeval het zulks nodig oordeelt, een andere voorziening treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel100
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '100'
  - number: 6:4
    text: |-
      De voorzitter is bevoegd tot het nemen van beslissingen, welke betrekking hebben op, voortvloeien uit of verband
      houden met het dagelijks beheer als bedoeld in [artikel 123, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel123
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '123'
  - number: 6:5
    text: |-
      1 De voorzitter kan personeelsleden van het secretariaat machtigen, de hem krachtens:

      a. [artikel 127 van de wet][ref1], en

      b. [artikel 49 van de Landbouwwet][ref2],

      toekomende bevoegdheden uit te oefenen.

      2 De voorzitter is bevoegd de afdoening en ondertekening van namens hem en onder zijn verantwoordelijkheid
      uitgaande stukken, alsmede verrichten van bepaalde rechtshandelingen bij een door hem ondertekende akte van
      procuratie over te laten aan één of meer functionarissen van het productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel49
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '49'
  - number: 6:6
    text: |-
      De voorzitter oefent de krachtens [artikel 11, van de In- en Uitvoerwet][ref1], en
      [artikel 23, van de Landbouwwet][ref2] aan het bestuur overgedragen bevoegdheden - andere dan verordenende - uit.
      Het bestuur kan ingeval het zulks nodig acht, een andere voorziening treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel23
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '23'
  - number: 6:7
    text: |-
      1 De voorzitter is bevoegd te beslissen over het voeren van verweer door het productschap voor het College van
      Beroep voor het bedrijfsleven, alsmede te beslissen op bij het productschap ingediende bezwaarschriften.

      2 De voorzitter kan functionarissen van het secretariaat machtigen, de in het eerste lid bedoelde bevoegdheden uit
      te oefenen.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel67
  - number: 7:1
    text: |-
      1 De voorzitter geniet een maandelijkse vergoeding, welke gelijk is aan het hoogste bedrag van schaal 16, opgenomen
      in de bijlage III behorende bij de collectieve arbeidsovereenkomst voor de Publiekrechtelijke Bedrijfsorganisatie
      (CAO-PBO), verhoogd met 16,5% en afgerond op hele euro's.

      2 Over de in het eerste lid bedoelde vergoeding, wordt aan de voorzitter jaarlijks in de maand mei een
      vakantietoeslag verleend, overeenkomstig de bepalingen welke ten aanzien van de vakantietoeslag gelden voor de
      werknemer van het productschap ingevolge de kaderverordening arbeidsvoorwaarden PT.

      3 Ter tegemoetkoming in de premie van een ziektekostenverzekering wordt aan de voorzitter een toeslag verleend
      welke gelijk is aan het bedrag hetwelk bij toepassing van de bepalingen welke te dien aanzien gelden voor de
      werknemer van het productschap ingevolge de kaderverordening arbeidsvoorwaarden PT, uit dien hoofde zou ontvangen.

      4 Indien de voorzitter overlijdt, is artikel 66 van de kaderverordening arbeidsvoorwaarden PT van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel71
  - number: 7:2
    text: |-
      1 Aan de voorzitter, die één of meer ambtsperioden, als bedoeld in [artikel 78, tweede lid, van de wet][ref1]
      vervuld hebbende, niet wordt herbenoemd anders dan op eigen verzoek, wordt een wachtgeld toegekend.

      2 De voorzitter, die wordt ontslagen, ingevolge het bepaalde in [artikel 78, eerste lid, van de wet][ref2], wordt
      een wachtgeld toegekend, tenzij naar het oordeel van het dagelijks bestuur van het productschap ernstige redenen
      zich daartegen verzetten.

      3 Een wachtgeld als bedoeld in het eerste lid, onderscheidenlijk het tweede lid, zal worden berekend op basis van
      de som van de in [artikel 4:1, eerste en tweede lid][ref3] bedoelde bedragen, en overeenkomstig het bepaalde in
      bijlage XIV van de CAO-PBO.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0016684#Artikel41
