  - number: 7:3
    text: Voor het overige zijn op hem van toepassing de bepalingen zoals opgenomen in de CAO-PBO
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel73
  - number: 8:1
    text: |-
      In dit hoofdstuk wordt verstaan onder:








                  a. commissies:


                  commissies als bedoeld in [artikel 88][ref1] en [88a van de wet][ref2];




                  b. overige commissies:


                  andere door het bestuur van het productschap ingestelde permanente commissies;




                  c. werkverbanden:


                  door het productschap ingestelde tijdelijke commissies, stuurgroepen, werkgroepen,
      begeleidingscommissies, dan wel anderszins genoemd;


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel88a
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '88'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: 88a
  - number: 8:2
    text: |-
      1 De leden van het (dagelijks) bestuur en van de commissies als bedoeld in [artikel 88][ref1] en
      [88a, van de wet][ref2], genieten voor elke door hen bijgewoonde vergadering een vergoedingbestaande uit:









                    a


