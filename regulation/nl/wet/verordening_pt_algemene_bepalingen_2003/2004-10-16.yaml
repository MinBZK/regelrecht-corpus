  text: |-
    gelet op de artikelen 93,95,104, eerste en derde lid,.en 106 van de Wet op de bedrijfsorganisatie; gelet op de
    artikelen 2, 13 tot en met 18 van de Instellingsverordening Productschap Tuinbouw 1998;

    gehoord:

    de Sectorcommissie voor bollen, knollen en wortelstokken van bolgewassen, d.d. 9 september 2003,

    de Sectorcommissie voor energie, d.d. 10 september 2003, en

    de Sectorcommissie voor groenten en fruit, d.d. 11 september 2003,

    de Sectorcommissie voor bloemkwekerijproducten, d.d. 15 september 2003,

    de Sectorcommissie voor hovenierswerkzaamheden, d.d. 8 oktober 2003,

    de Sectorcommissie voor boomkwekerijproducten, d.d. 22 oktober 2003,

    BESLUIT:
  url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      1 In deze verordening worden de begripsbepalingen van de Instellingsverordening Productschap Tuinbouw 1998
      overgenomen.

      2 In de verordeningen van het Productschap Tuinbouw wordt verstaan onder :








                    a. bestuur:


                    het bestuur van het productschap;




                    b. dagelijks bestuur:


                    uit het midden van het bestuur samengesteld bestuur als bedoeld in
      [artikel 84 van de Wet op de bedrijfsorganisatie][ref1];




                    c. de voorzitter:


                    de voorzitter van het productschap;




                    d. secretaris:


                    de secretaris van het productschap;




                    e. functionaris:


                    eenieder werkzaam bij het productschap




                    f. onderneming:


                    onderneming waarvoor het productschap is ingesteld;




                    g. de ondernemer:


                    de natuurlijke of rechtspersoon die een onderneming drijft waarvoor het productschap is ingesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel84
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '84'
  - number: 2:1
    text: |-
      De ondernemer als bedoeld in [artikel 1:1, tweede lid, onder g][ref1], is verplicht binnen 30 dagen na de aanvang
      van de onderneming als [bedoeld in artikel 1, tweede lid, onder f][ref2], hiervan schriftelijke mededeling te doen
      bij het productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0016684#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0016684#Artikel11
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0016684
        artikel: 1:1
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0016684
        artikel: 1:1
        hoofdstuk: '1'
  - number: 2:2
    text: |-
      1 Het productschap stuurt de ondernemer een bericht van registratie en een registratienummer.

      2 Het in het eerste lid bedoelde kan worden vergezeld van een aantal nog nader te beantwoorden vragen.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel22
  - number: 2:3
    text: |-
      De ondernemer is verplicht een wijziging in de gegevens als bedoeld in het voorgaande artikel schriftelijk en
      binnen 30 dagen aan het productschap te melden.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel23
  - number: 2:4
    text: Het productschap houdt in beheer een register van ondernemingen.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel24
  - number: 2:5
    text: |-
      Het bestuur van het productschap is bevoegd bij besluit nadere voorschriften vast te stellen ter uitvoering van het
      in dit hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel25
  - number: 3:1
    text: |-
      In dit hoofdstuk wordt verstaan onder:








                  a. ambtshalve schatting:


                  nota op basis van door het productschap geraamde omvang van de grondslag die voor de onderneming
      ingevolge heffingsverordeningen van toepassing is; met een minimum van'€ 900,-.




                  b. aangifteformulier:


                  door het productschap opgesteld formulier voor het verkrijgen van gegevens die nodig zijn om de omvang
      van de grondslag voor de verschillende heffingsverordeningen te bepalen;




                  c. boekencontrole:


                  controle van de in de onderneming of bij diens accountant aanwezige boeken en/of bescheiden, zomede dat
      zij de in de onderneming aanwezige voorraden, alsmede bedrijfsmiddelen, bezichtigen en opnemen en zij daartoe de
      vrije gelegenheid geven, noodzakelijk voor de vaststelling van een juiste en volledige omvang van die grondslagen
      die leiden tot, de over de te controleren periode, op te leggen heffingen.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel31
  - number: 3:2
    text: De ondernemer is jaarlijks aan het productschap een heffing verschuldigd,
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel32
  - number: 3:3
    text: |-
      1 Aan de onderneming wordt een aangifteformulier toegezonden

      2 Het aangifteformulier dient binnen 30 dagen ingevuld met de juiste gegevens en ondertekend aan het productschap
      te worden geretourneerd.

      3 De verstrekte gegevens worden door het productschap gecontroleerd op correcte invulling.

      4 De gegevens worden vervolgens verwerkt in het heffingenbestand.

      5 Hierna wordt de berekening van de heffing opgestart.

      6 Het opmaken van de nota vindt vervolgens plaats.

      7 Indien niet is voldaan aan het gestelde onder het tweede lid, wordt een herinneringsbrief toegezonden.

      8 Binnen 14 dagen dienen dan alsnog de gevraagde gegevens te zijn verstrekt.

      9 Indien de gegevens als bedoeld in het tweede lid dan wel het achtste lid, niet, niet tijdig, of niet volledig
      zijn verstrekt, dan:

      a. wordt de heffing berekend over de dan door de voorzitter te ramen omvang van de grondslag die op de
      heffingsplichtige van toepassing is (de zogenaamde Ambtshalve Schatting), en

      b. wordt de heffing verhoogd met € 40,- administratiekosten.

      10 Wordt de ambtshalve schatting, met medewerking van de heffingsplichtige, alsnog omgezet in een normale aangifte,
      dan blijft de € 40,- administratiekosten verschuldigd.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel33
  - number: 3:4
    text: |-
      In afwijking van het bepaalde in het voorgaande artikel kan de voorzitter de heffingsplichtige een voorlopige
      heffing opleggen tot het bedrag waarop de heffing vermoedelijk zal worden vastgesteld. De voorlopige heffing wordt
      verrekend met de krachtens de van toepassing zijnde heffingsverordening verschuldigde heffing.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel34
  - number: 3:5
    text: |-
      De heffingsnota bevat ten minste:

      a. de naam van de onderneming;

      b. het adres van de onderneming

      c. een specificatie of toelichting omtrent de wijze waarop de heffing is berekend;

      d. het totaal van de heffing, en

      e. een dagtekening.
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel35
  - number: 3:6
    text: |-
      1 Het productschap is gerechtigd ten behoeve van een richtige heffing een boekencontrole uit te voeren.

      2 Deze boekencontrole wordt uitgevoerd door een medewerker van het productschap, die in het bezit is van een
      schriftelijke machtiging van de voorzitter

      3 Indien bij de boekencontrole blijkt dat een onjuiste opgave is gedaan als bedoeld in
      [artikel 7:3, tweede lid][ref1], wordt ingeval een navordering verhoogd met maximaal 10% .

      4 Indien er bij een boekencontrole sprake is van een opgelegde ambtshalve schatting als bedoeld in
      [artikel 3:3, negende lid][ref2], wordt de na de boekencontrole opgestelde nota met 10% verhoogd.

      5 De termijn waarover de boekencontrole zich uitstrekt is maximaal acht jaar, waarbij niet meer dan de vijf meest
      recente aangiftejaren worden gecontroleerd


      [ref1]: https://wetten.overheid.nl/BWBR0016684#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0016684#Artikel33
    url: https://wetten.overheid.nl/BWBR0016684/2004-10-16#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0016684
        artikel: 7:3
        hoofdstuk: '7'
      - id: ref2
