$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_eisen_eigenaar_of_houder_van_destructiemateriaal
regulatory_layer: WET
publication_date: '2003-09-05'
valid_from: '2002-04-14'
bwb_id: BWBR0007341
url: https://wetten.overheid.nl/BWBR0007341/2002-04-14
preamble:
  text: |-
    Gelet op artikel 12, eerste en derde lid, van de Destructiewet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
             wet:

              [Destructiewet][ref1];



            b
            aangifteplichtige:

              eigenaar of houder van hoog- of gespecificeerd hoog-risico-materiaal;



            c
             bedrijf:

              verwerkingsbedrijf voor hoog- of gespecificeerd hoog-risico-materiaal of verwerkingsbedrijf waarin laag-
      risico-materiaal tot ingrediënten van diervoeder of vismeel wordt verwerkt;



            d
             inrichting:

              inrichting waarin laag-risico-materiaal wordt gebruikt voor de bereiding van voeder voor gezelschapsdieren
      of technische of farmaceutische produkten.


      [ref1]: https://wetten.overheid.nl/BWBR0002244
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002244
  - number: '2.1'
    text: |-
      De aangifteplichtige doet van hoog-risico-materiaal zo spoedig mogelijk doch uiterlijk op de eerste werkdag,
      volgende op de dag waarop dit materiaal als zodanig is ontstaan, aangifte bij het verwerkingbedrijf voor hoog-
      risico-materiaal in wiens gebied het materiaal zich bevindt.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel2
  - number: '2.2'
    text: |-
      De aangifteplichtige doet van gespecificeerd hoog-risico-materiaal zo spoedig mogelijk doch uiterlijk op de eerste
      werkdag, volgende op de dag waarop dit materiaal als zodanig is ontstaan, aangifte bij:
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel2
  - number: 2.2.a
    text: |-
      Rendac Bergum B.V. te Bergum(Fr.), indien hij woonplaats heeft in de provincie Groningen, Friesland, Drenthe,
      Overijssel, Gelderland, Flevoland of Noord-Holland;
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel2
  - number: 2.2.b
    text: |-
      Rendac Son B.V. te Son, indien hij woonplaats heeft in de provincie Utrecht, Zuid-Holland, Zeeland, Noord-Brabant
      of Limburg.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel2
  - number: '2.3'
    text: |-
      De aangifte geschiedt telefonisch onder opgave van de soort en de hoeveelheid van het materiaal alsmede van de
      plaats waar het zich bevindt.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel2
  - number: '2.4'
    text: |-
      De in het eerste, onderscheidenlijk het tweede lid, bedoelde termijn is niet van toepassing indien het hoog- of
      gespecificeerd hoog-risico-materiaal betreft dat op een vaste dag door het verwerkingsbedrijf, bedoeld in het
      eerste, onderscheidenlijk het tweede lid, bedoelde termijn, wordt opgehaald.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel2
  - number: '3.1'
    text: |-
      De aangifteplichtige deponeert het hoog- of gespecificeerd hoog-risico-materiaal op de dag dat het door het
      verwerkingsbedrijf, bedoeld in [artikel 2, eerste lid][ref1] wordt opgehaald op een zodanige plaats dat het
      vanaf de openbare verharde weg binnen het vrij bereik ligt van de laadkraan van het vervoermiddel van het
      verwerkingsbedrijf, bedoeld in [artikel 2, eerste lid][ref2]. Indien door plaatselijke omstandigheden de
      fysieke mogelijkheid hiertoe ontbreekt, wordt tussen de aangifteplichtige en het verwerkingsbedrijf, bedoeld
      in [artikel 2, eerste lid][ref3] een andere plaats van deponering afgesproken, waarbij uitgangspunt is dat het
      vervoermiddel van het verwerkingsbedrijf, bedoeld in [artikel 2, eerste lid][ref4] niet verder dan één wagenlengte
      op het erf behoeft te komen. Bij geschillen tussen de aangifteplichtige en het verwerkingsbedrijf, bedoeld in
      [artikel 2, eerste lid][ref5] over de plaats van deponering, zal met inachtneming van hetgeen hiervoor is gesteld,
      de plaats worden bepaald door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007341#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007341#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007341#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007341#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0007341#Artikel2
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007341
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007341
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007341
        artikel: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0007341
        artikel: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0007341
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      Het eerste lid is niet van toepassing indien tussen de aangifteplichtige en het verwerkingsbedrijf, bedoeld
      in [artikel 2, eerste lid][ref1] een overeenkomst is gesloten, strekkende tot het deponeren van hoog- of
      gespecificeerd hoog-risico-materiaal op een andere plaats. Het materiaal wordt dan telkens op die plaats
      gedeponeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007341#Artikel2
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007341
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      De aangifteplichtige draagt ervoor zorg dat kadavers van slachtdieren en van voor de landbouwproduktie gehouden
      dieren tot het moment waarop zij worden opgehaald, op een zodanige manier zijn afgedekt dat het materiaal wordt
      onttrokken aan het oog van passanten en niet vrij toegankelijk is voor vogels, honden en katten. De afdekking dient
      door de ondernemer gemakkelijk verwijderbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel4
  - number: '4.2'
    text: |-
      De aangifteplichtige draagt ervoor zorg dat het hoog- of gespecificeerd hoog-risico-materiaal dat is ontstaan
      in slachterijen, bedrijven of inrichtingen, tot het moment waarop het wordt opgehaald op een zodanige manier
      wordt bewaard dat het materiaal niet vrij toegankelijk is voor anderen dan de aangifteplichtige en het
      verwerkingsbedrijf, bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007341#Artikel2
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007341
        artikel: '2'
        paragraaf: '2'
  - number: '4.3'
    text: |-
      In gevallen als bedoeld in [artikel 2, vierde lid][ref1], wordt het materiaal in vaten passend in de laadinrichting
      van het verwerkingsbedrijf aangeboden. De aangifteplichtige draagt ervoor zorg dat op de vaten duidelijk is
      aangegeven welk type destructiemateriaal zij bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0007341#Artikel2
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007341
        artikel: '2'
        paragraaf: '2'
  - number: '4.4'
    text: |-
      De aangifteplichtige draagt ervoor zorg dat het gespecificeerd hoog-risico-materiaal op een zodanige plaats wordt
      aangeboden dat:
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel4
  - number: 4.4.a
    text: het duidelijk gescheiden en herkenbaar is van ander destructiemateriaal; en
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel4
  - number: 4.4.b
    text: |-
      het materiaal door het verwerkingsbedrijf, bedoeld in [artikel 2, eerste lid][ref1], apart kan worden geladen.


      [ref1]: https://wetten.overheid.nl/BWBR0007341#Artikel2
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007341
        artikel: '2'
        paragraaf: '2'
  - number: 4a.1
    text: 'De aangifteplichtige draagt ervoor zorg dat:'
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel4a
  - number: 4a.1.a
    text: |-
      kadavers van slachtdieren, met uitzondering van kalveren, en van voor de landbouwproductie gehouden dieren,
      beide tot een gewicht van 40 kg, tot het moment waarop dit materiaal wordt opgehaald, worden bewaard bij een
      omgevingstemperatuur van ten hoogste 10°C;
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel4a
  - number: 4a.1.b
    text: |-
      hoog-risico-materiaal als bedoeld in [artikel 2, eerste lid, onderdelen c, d en e van de wet][ref1],
      met uitzondering van bloed, tot het moment waarop dit materiaal wordt opgehaald, wordt bewaard bij een
      omgevingstemperatuur van ten hoogste 10°C of een inwendige temperatuur van ten hoogste 15°C;


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel2
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '2'
  - number: 4a.1.c
    text: |-
      hoog-risico-materiaal als bedoeld in onderdeel b, voor zover het betreft bloed, tot het moment waarop dit materiaal
      wordt opgehaald, wordt bewaard bij een inwendige temperatuur van ten hoogste 15°C;
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel4a
  - number: 4a.1.d
    text: |-
      gespecificeerd hoog-risico-materiaal als bedoeld in [artikel 2, eerste lid, onderdelen c][ref1] en k, van de
      [Regeling aanwijzing gespecificeerd hoog-risico-materiaal 2000][ref2], tot het moment waarop dit materiaal wordt
      opgehaald, wordt bewaard bij een omgevingstemperatuur van ten hoogste 10°C of een inwendige temperatuur van ten
      hoogste 15°C.


      [ref1]: https://wetten.overheid.nl/BWBR0007341#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011443
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0007341
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011443
  - number: 4a.2
    text: |-
      Het eerste lid is niet van toepassing op hoog-risico-materiaal of gespecificeerd hoog-risico-materiaal dat ontstaat
      op slachterijen, mits dit materiaal op dezelfde dag waarop het als zodanig is ontstaan, wordt opgehaald.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel4a
  - number: 4b
    text: Het is verboden gespecificeerd hoog-risico-materiaal te vermengen met laag-risico-materiaal.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel4b
  - number: '5'
    text: |-
      De overdracht van hoog- of gespecificeerd hoog-risico-materiaal geschiedt door inlading in een daarvoor bestemd
      vervoermiddel van het verwerkingsbedrijf, bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007341#Artikel2
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007341
        artikel: '2'
        paragraaf: '2'
  - number: '6'
    text: |-
      Omtrent de aangifte, het vervoer, de bewaring en de overdacht van dode honden en katten kan krachtens artikel 17
      van de wet een afwijkende voorziening worden getroffen.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel6
  - number: 6a.1
    text: |-
      De aangifteplichtige draagt ervoor zorg dat gespecificeerd hoog-risico-materiaal dat ontstaat in zijn slachterij of
      uitsnijderij wordt geadministreerd.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel6a
  - number: 6a.2
    text: 'De administratie, bedoeld in het eerste lid, bestaat uit een register waarin ten minste wordt vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel6a
  - number: 6a.2.a
    text: de aard en de hoeveelheid gewogen gespecificeerd hoog-risico-materiaal;
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel6a
  - number: 6a.2.b
    text: de afleverdatum;
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel6a
  - number: 6a.2.c
    text: de naam en het adres van de ontvanger.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel6a
  - number: '7'
    text: Laag-risico-materiaal wordt bewaard in gesloten lekvrije corrosiebestendige recipiëten.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel7
  - number: 7a.1
    text: |-
      De eigenaar of houder van gevulde, ongereinigde maagdarmpakketten, alsmede delen daarvan of mengsels daarvan met
      ander laag-risico-materiaal draagt ervoor zorg dat dit materiaal wordt bewaard bij een omgevingstemperatuur van ten
      hoogste 10°C of bij een inwendige temperatuur van ten hoogste 15°C, tenzij het betreft materiaal dat binnen twaalf
      uren na ontstaan wordt vervoerd naar nertsvoederkeukens dan wel binnen twaalf uren na ontstaan wordt vervoerd naar
      een inrichting waar dit materiaal wordt gebruikt voor de bereiding van voeder voor gezelschapsdieren.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel7a
  - number: 7a.2
    text: |-
      De eigenaar of houder van ander laag-risico-materiaal dan bedoeld in het eerste lid draagt ervoor zorg dit
      materiaal wordt bewaard bij een omgevingstemperatuur van ten hoogste 10°C, tenzij het betreft materiaal dat binnen
      twaalf uren na ontstaan wordt vervoerd naar een bedrijf of inrichting waar het materiaal wordt gekoeld, ingevroren,
      verwerkt, voorbewerkt of vervoederd.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel7a
  - number: 7a.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op laag-risico-materiaal dat op dezelfde dag waarop dit materiaal
      als zodanig is ontstaan door de ondernemer wordt opgehaald.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel7a
  - number: '8'
    text: |-
      Laag-risico-materiaal wordt alvorens het materiaal naar een bedrijf of inrichting wordt vervoerd, voorzien van
      een etiket waarop de gegevens terzake van de herkomst, de aard en de datum waarop het is verkregen zijn vermeld,
      alsmede in letters van ten minste 2 cm hoog de woorden ’uitsluitend voor de vervaardiging van diervoeder’ of
      ’uitsluitend voor de vervaardiging van voeder voor gezelschaps- dieren’ dan wel ’uitsluitend voor de vervaardiging
      van farmaceutische of technische produkten’.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel8
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Regeling eisen eigenaar of houder van destructiemateriaal.'
    url: https://wetten.overheid.nl/BWBR0007341/2002-04-14#Artikel10
