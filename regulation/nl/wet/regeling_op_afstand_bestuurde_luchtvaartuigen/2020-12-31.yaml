  - number: '4'
    text: |-
      1 De geldigheidsduur van de algemene bevoegdverklaring FI (RPA) kan worden verlengd, indien de aanvrager:

      a. houder is van een RPA-L, met daarop weergegeven de algemene bevoegdverklaring(en) en de bijzondere
      bevoegdverklaring(en) waarvoor onderricht wordt gegeven; en

      b. ten minste twaalf uren ervaring heeft als gezagvoerder in de periode van twee jaar onmiddellijk voorafgaande aan
      de aanvraag.

      2 De geldigheidsduur van de bijzondere bevoegdverklaring, bedoeld in [artikel 2, onderdeel a][ref1], bedraagt ten
      hoogste twee jaren en kan vervolgens steeds met twee jaren worden verlengd, indien de aanvrager heeft aangetoond
      dat hij

      in de twee jaren onmiddellijk voorafgaande aan de datum van de aanvraag om verlenging ten minste twee uren per jaar
      ervaring heeft verkregen met de werkzaamheden waarvoor de bijzondere bevoegdverklaring vereist is.

      3 De geldigheidsduur van de bijzondere bevoegdverklaringen, bedoeld in[ artikel 2, onderdelen b en c][ref2],
      bedraagt ten hoogste twee jaren en kan vervolgens steeds met twee jaren worden verlengd, indien de aanvrager heeft
      aangetoond dat hij in de twee jaren onmiddellijk voorafgaande aan de datum van de aanvraag om verlenging ten minste
      twee uren per jaar ervaring heeft verkregen met operaties met een RPA in de betreffende klasse.

      4 De ervaring, bedoeld in het tweede en derde lid, moet zijn verkregen tijdens ten minste zes vluchten, die op
      zes verschillende dagen zijn uitgevoerd, waarvan de laatste drie vluchten hebben plaatsgevonden in de periode van
      negentig dagen onmiddellijk voorafgaande aan de datum van aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0036568#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0036568#Artikel2
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel4
