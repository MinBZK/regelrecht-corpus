    text: |-
      [Artikel 2.2. van de Vrijstellingsregeling Besluit luchtverkeer 2014][ref1] is van overeenkomstige toepassing
      op het uitvoeren van een vlucht door de brandweer buiten de daglichtperiode ten behoeve van de taken, bedoeld in
      [artikel 25, eerste lid, aanhef en onderdelen a tot en met d, en tweede lid, van de Wet veiligheidsregio’s][ref2]
      , en de opleiding en training die nodig zijn voor de veilige uitvoering van een dergelijke vlucht, met dien
      verstande dat wordt voldaan aan het voorschrift dat voor en tijdens het uitvoeren van de vlucht contact wordt
      onderhouden met de gemeenschappelijke meldkamer, bedoeld in [artikel 35 van de Wet veiligheidsregio’s][ref3]
      in plaats van aan het voorschrift, bedoeld in artikel 2.2, eerste lid, onderdeel b, van de Vrijstellingsregeling
      Besluit luchtverkeer 2014,


