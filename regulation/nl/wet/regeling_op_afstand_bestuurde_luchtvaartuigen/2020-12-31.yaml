  - number: '11'
    text: |-
      1 Een ROC wordt afgegeven indien de aanvrager beschikt over de in [artikel 10, eerste lid][ref1], bedoelde
      documenten, met dien verstande dat het handboek door de minister is goedgekeurd.

      2 In afwijking van het eerste lid wordt een ROC voor de uitvoering van vluchten met een RPA als bedoeld in
      [artikel 10a, eerste lid][ref2], onder de in dat lid bedoelde beperkingen afgegeven, indien de aanvrager beschikt
