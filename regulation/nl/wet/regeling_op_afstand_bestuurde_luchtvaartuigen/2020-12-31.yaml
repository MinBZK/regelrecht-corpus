  - number: '16'
    text: |-
      1 De uitoefening van het luchtverkeer met een RPA is verboden:

      a. in Maastricht CTR, Lelystad CTR 1 en Lelystad CTR 2, Eelde CTR, Rotterdam CTR en het boven Nederlands grondgebied
      gelegen deel van de Niederrhein CTR, bedoeld in [artikel 5 van de Regeling luchtverkeersdienstverlening][ref1],
      binnen een afstand van 5.600 meter van het luchthaven referentiepunt

      b. in Schiphol CTR, bedoeld in [artikel 5 van de Regeling luchtverkeersdienstverlening][ref2], met uitzondering
      van het gebied gelegen binnen een afstand van 3.700 meter van de laterale begrenzing van Schiphol CTR 1 die is
      opgenomen in de luchtvaartgids, hoofdstuk AD 2.

      2 In afwijking van [artikel 14][ref3] en onverminderd het eerste lid, is het verboden een VFR-vlucht
      met een RPA uit te voeren hoger dan 45 meter (150 ft) boven de grond of het water binnen de plaatselijke
      luchtverkeersleidingsgebieden, bedoeld in het eerste lid, onderdelen a en b.

      3 Het verbod, bedoeld in het eerste en tweede lid, geldt niet voor vluchten in Eelde CTR die worden uitgevoerd ten
      behoeve van experimenten met betrekking tot de integratie van op afstand bestuurde luchtvaartuigen in gecontroleerd
      luchtruim.

      4 Onverminderd het eerste lid, geldt het verbod, bedoeld in het tweede lid, niet voor vluchten die worden
      uitgevoerd voor het verrichten van luchtwerk met betrekking tot obstakels gelegen in Maastricht CTR, Lelystad CTR 1
      en Lelystad CTR 2, Eelde CTR en Rotterdam CTR binnen een straal van 25 meter rond deze obstakels en tot maximaal 5
      meter boven het hoogste punt van deze obstakels.


