  - number: '13'
    text: |-
      1 Het is verboden een VFR-vlucht uit te voeren met een RPA buiten zichtafstand van de bestuurder of een waarnemer.

      2 Onverminderd het eerste lid, is het verboden een VFR-vlucht uit te voeren op een afstand van meer dan 500 meter
      van de bestuurder of een waarnemer.
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel13
  - number: '14'
    text: |-
      1 Het is verboden een VFR-vlucht uit te voeren met een RPA hoger dan 120 meter (400 ft) boven de grond of het
      water.

      2 De Minister van Infrastructuur en Milieu verleent ontheffing van het verbod, bedoeld in het eerste lid, indien
      de vlucht wordt uitgevoerd voor het verrichten van luchtwerk met betrekking tot een vaartuig, voertuig, gebouw of
      kunstwerk en deze vlucht op grond van het ROC mag worden uitgevoerd.

      3 De minimumvlieghoogtes voor VFR-verkeer, bedoeld in paragraaf SERA.5005 van verordening (EU) nr. 923/2012 zijn
      niet van toepassing op vluchten met een RPA.
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel14
  - number: '15'
    text: |-
      1 Het is verboden een VFR-vlucht uit te voeren met een RPA waarvan de totale massa meer dan 25 kg bedraagt, binnen
      150 meter horizontaal van mensenmenigten, aaneengesloten bebouwing, in gebruik zijnde autosnelwegen, in gebruik
      zijnde autowegen, of in gebruik zijnde wegen waar een maximale snelheid van 80 kilometer per uur geldt.

      2 Het is verboden een VFR-vlucht uit te voeren met een RPA waarvan de totale massa ten hoogste 25 kg bedraagt,
      binnen een afstand horizontaal van mensenmenigten, aaneengesloten bebouwing of kunstwerken, in gebruik zijnde
      autosnelwegen en autowegen, in gebruik zijnde wegen waar een maximale snelheid van 80 kilometer per uur geldt,
      spoorlijnen, voertuigen en vaartuigen:

      1° van 25 meter, indien het een RPA in de categorie helikopters (H) betreft; en

      2° van 50 meter, indien het een RPA in de categorie vliegtuigen (A) of een andere categorie dan helikopters of
      vliegtuigen (OA) betreft.

      3 In afwijking van het eerste lid, is het toegestaan een VFR-vlucht uit te voeren met een RPA waarvan de totale
      massa meer dan 25 kg bedraagt tot 50 meter horizontaal van industrie- en havengebieden.

      4 Onverminderd het eerste lid, is het verboden een VFR-vlucht uit te voeren met een RPA waarvan de totale massa
      meer dan 25 kg bedraagt binnen 50 meter horizontaal van vaartuigen, voertuigen, kunstwerken en spoorlijnen.

      5 De Minister van Infrastructuur en Milieu verleent ontheffing van het verbod, bedoeld in het eerste, tweede en
      vierde lid, indien de vlucht wordt uitgevoerd voor het verrichten van luchtwerk met betrekking tot een vaartuig,
      voertuig, gebouw, kunstwerk, spoorlijn of weg en deze vlucht op grond van het ROC mag worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel15
  - number: 15aa
    text: |-
      1 Indien de organisatie die VFR-vluchten uitvoert met een RPA waarvan de totale massa niet meer dan 4 kg
      bedraagt, in plaats van over de in [artikel 10, eerste lid][ref1], bedoelde documenten, beschikt over de
      in [artikel 10a, tweede lid][ref2], bedoelde documenten, is het in afwijking van de [artikelen 13][ref3],
      [14, eerste lid][ref4], en [15, eerste en derde lid][ref5], verboden de vlucht uit te voeren:

      a. buiten een afstand van 100 meter horizontaal van de bestuurder;

      b. hoger dan 40 meter (131 ft) boven de grond of het water binnen het deel van het luchtruim als bedoeld in
      [artikel 10a, eerste lid, onderdeel b][ref6];

      c. hoger dan 50 meter (165 ft) boven de grond of het water in ander dan het in onderdeel b bedoelde deel van het
      luchtruim;

      d. binnen een afstand van 50 meter horizontaal van mensenmenigten, aaneengesloten bebouwing of kunstwerken,
      industrie- en havengebieden daaronder begrepen, in gebruik zijnde autosnelwegen en autowegen, in gebruik zijnde
      wegen waar een maximale snelheid van 80 kilometer per uur geldt, spoorlijnen, vaartuigen en voertuigen; en

      e. in ander luchtruim dan luchtruim met klasse G.

      2 Indien de organisatie die VFR-vluchten uitvoert met een RPA als bedoeld in het eerste lid, in plaats van over
      de in [artikel 10, eerste lid][ref7], bedoelde documenten, beschikt over de in [artikel 10a, tweede lid][ref8],
      bedoelde documenten, is [artikel 2, onderdeel h, van de Regeling modelvliegen][ref9] van overeenkomstige toepassing
      op deze vluchten, met dien verstande dat de vluchten plaatsvinden met inachtneming van artikel 15aa, eerste lid,
      aanhef en onderdelen b en c.


