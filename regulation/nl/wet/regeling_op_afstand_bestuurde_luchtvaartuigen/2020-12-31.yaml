  - number: '5'
    text: |-
      Voor wederafgifte van de bijzondere bevoegdverklaringen, bedoeld in [artikel 2][ref1], is vereist dat de aanvrager
      heeft aangetoond dat hij:

      a. in de twee jaren onmiddellijk voorafgaande aan de datum van aanvraag om wederafgifte ten minste twee uren
      ervaring per jaar heeft verkregen met de werkzaamheden waarvoor de bijzondere bevoegdverklaring is vereist tijdens
      ten minste zes vluchten, die op zes verschillende dagen zijn uitgevoerd; en

      b. de aanvrager een praktijkexamen heeft afgelegd dat de uitvoering bevat van de werkzaamheden waarvoor de
      bijzondere bevoegdverklaring is gewenst en dat is uitgevoerd met een luchtvaartuig in de klasse waarvoor de
      klassebevoegdverklaring is gewenst.


      [ref1]: https://wetten.overheid.nl/BWBR0036568#Artikel2
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0036568
        artikel: '2'
        paragraaf: '2'
  - number: '6'
    text: |-
      De houder van een RPA-L en de leerling-vlieger houden de gegevens van door hem uitgevoerde vluchten bij in een
      logboek waarvan het model gelijk is aan het in [bijlage 2][ref1] bij deze regeling opgenomen model.


      [ref1]: https://wetten.overheid.nl/BWBR0036568
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036568
  - number: '7'
    text: |-
      1 Een speciaal-BvL wordt aangevraagd door indiening bij de minister van een volledig ingevuld en ondertekend
      formulier, waarvan exemplaren kosteloos bij de minister zijn te verkrijgen.

      2 Aan de houder van een RPA, waarvan de startmassa niet meer dan 150 kg bedraagt, kan een speciaal-BvL worden
      afgegeven indien bij de aanvraag een, door een daartoe erkend bedrijf afgegeven, acceptatierapport betreffende de
      BvL-acceptatiekeuring is overgelegd, waaruit blijkt dat het luchtvaartuig voldoet aan de in [bijlage 3][ref1] van
      deze regeling opgenomen luchtwaardigheidseisen.

      3 Het model van het speciaal-BvL is opgenomen in de bij deze regeling behorende [bijlage 4][ref2].

      4 Het eerste lid is van overeenkomstige toepassing op de geluidverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0036568
      [ref2]: https://wetten.overheid.nl/BWBR0036568
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036568
      - id: ref2
        bwb_id: BWBR0036568
  - number: '8'
    text: |-
      1 Voor het verlengen van de termijn van geldigheid van het speciaal-BvL wordt door de houder een aanvraag ingediend
      bij de minister door middel van een volledig en ondertekend formulier, waarvan exemplaren kosteloos bij de minister
      verkrijgbaar zijn.

      2 De aanvraag wordt vergezeld van een verklaring van de houder waaruit blijkt dat het luchtvaartuig nog steeds
      voldoet aan de in [artikel 7, tweede lid][ref1], bedoelde eisen en is onderhouden overeenkomstig de in artikel 9
      bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0036568#Artikel7
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0036568
        artikel: '7'
        paragraaf: '3'
  - number: '9'
    text: |-
      Onderhoud van een Nederlands RPAS geschiedt overeenkomstig de in [bijlage 5][ref1] neergelegde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0036568
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0036568
  - number: 9a
    text: |-
      1 Dit artikel is van toepassing op RPA’s die geregistreerd zijn in een andere lidstaat van de Europese Unie of een
      staat die partij is bij de Overeenkomst inzake de Europese Economische Ruimte.

      2 De Minister verleent op grond van [artikel 3.21 van de Wet luchtvaart][ref1] ontheffing van het verbod een vlucht
      uit te voeren met een RPA die niet is voorzien van een geldig bewijs van luchtwaardigheid, indien de RPA voldoet
      aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de in deze
      paragraaf gestelde eisen wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.21
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3.21'
  - number: '10'
    text: |-
      1 De organisatie die vluchten uitvoert met een RPA waarvan de totale massa niet meer dan 150 kg bedraagt beschikt
      over:

      a. een handboek, dat voldoet aan de in [bijlage 6][ref1] opgenomen eisen;

      b. een speciaal-BvL met betrekking tot de RPA’s waarmee de vlucht wordt uitgevoerd;

      c. een bewijs van bevoegdheid voor de bestuurders die de in onderdeel b bedoelde RPA’s besturen; en

      d. een verzekering tegen de burgerrechtelijke aansprakelijkheid voor dood of letsel van derden of andere schade
      toegebracht aan derden.

      2 De organisatie, bedoeld in het eerste lid, draagt er zorg voor dat de Inspectie Leefomgeving en Transport
      beschikt over de actuele versie van het handboek, bedoeld in het eerste lid.

      3 Vluchten met een RPA waarvan de totale massa niet meer dan 150 kg bedraagt worden uitgevoerd met inachtneming van
      het handboek, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0036568
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0036568
  - number: 10a
    text: |-
      1 Dit artikel is van toepassing op VFR-vluchten met een RPA waarvan de totale massa niet meer dan 4 kg bedraagt,
      die onder de volgende operationele beperkingen worden uitgevoerd:

      a. de vlucht wordt uitgevoerd tot een afstand van maximaal 100 meter horizontaal van de bestuurder;

      b. de vlucht wordt uitgevoerd tot een hoogte van maximaal 40 meter (131 ft) boven de grond of het water binnen het
      deel van het luchtruim waarin laag mag worden gevlogen door civiele of militaire luchtvaartuigen;

      c. de vlucht wordt uitgevoerd tot een hoogte van maximaal 50 meter (165 ft) boven de grond of het water in ander
      dan het in onderdeel b bedoelde deel van het luchtruim;

      d. de vlucht wordt uitgevoerd tot een afstand van minimaal 50 meter horizontaal van mensenmenigten, aaneengesloten
      bebouwing of kunstwerken, industrie- en havengebieden daaronder begrepen, in gebruik zijnde autosnelwegen en
      autowegen, in gebruik zijnde wegen waar een maximale snelheid van 80 kilometer per uur geldt, spoorlijnen,
      vaartuigen en voertuigen; en

      e. de vlucht wordt uitgevoerd in luchtruim met klasse G onder de geldende luchtverkeersregels.

      2 De uitvoering van VFR-vluchten met een RPA als bedoeld in het eerste lid, onder de in dat lid bedoelde
      beperkingen is ook toegestaan, indien de organisatie die deze vluchten uitvoert, in plaats van over de in
      [artikel 10, eerste lid][ref1], bedoelde documenten, beschikt over:

      a. een geldig bewijs van inschrijving als bedoeld in [artikel 3.5 van de wet][ref2];

      b. een speciaal-BvL dan wel een ontheffing van de verplichting te beschikken over een speciaal-BvL met betrekking
      tot de RPA’s waarmee de vlucht wordt uitgevoerd;

      c. een door de minister afgegeven bewijs van bevoegdheid dan wel een ontheffing van de verplichting te beschikken
      over een bewijs van bevoegdheid voor de bestuurders die de in onderdeel b bedoelde RPA’s besturen; en

      d. een verzekering tegen de burgerrechtelijke aansprakelijkheid voor dood of letsel van derden of andere schade
      toegebracht aan derden.

      3 [Artikel 10, tweede en derde lid][ref3], is niet van toepassing op de uitvoering van vluchten met een RPA als
      bedoeld in het eerste lid, onder de in dat lid bedoelde beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0036568#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3.5
      [ref3]: https://wetten.overheid.nl/BWBR0036568#Artikel10
