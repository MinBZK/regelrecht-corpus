  - number: '12'
    text: |-
      De door de gezagvoerder mee te voeren documenten, bedoeld in [artikel 4.8 van de wet][ref1], zijn:

      a. het bewijs van inschrijving, bedoeld in [artikel 3.5 van de wet][ref2];

      b. het bewijs van bevoegdheid of bewijs van gelijkstelling, bedoeld in [artikel 2.1 van de wet][ref3], dan wel de
      ontheffing van de verplichting om over deze documenten te beschikken;

      c. het bewijs van luchtwaardigheid, bedoeld in [artikel 3.8 van de wet][ref4], dan wel de ontheffing van de
      verplichting om over dit document te beschikken;

      d. de geluidverklaring, bedoeld in [artikel 3.19c van de wet][ref5], dan wel de ontheffing van de verplichting om
      over dit document te beschikken; en

      e. het ROC, bedoeld in [artikel 2 van het Besluit vluchtuitvoering][ref6].


