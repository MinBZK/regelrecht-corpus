articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *Minister:* Minister van Infrastructuur en Waterstaat
        - *modelluchtvaartuig:* luchtvaartuig, niet in staat een mens te dragen, en uitsluitend gebruikt voor
      luchtvaartvertoning, recreatie of sport
        - *RPA:* op afstand bestuurd luchtvaartuig (remotely piloted aircraft), onbemand, niet zijnde een
      modelluchtvaartuig
        - *Wet:* [Wet luchtvaart][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: 1a
    text: |-
      Deze regeling berust mede op [artikel 5.7, derde lid, van de Wet luchtvaart][ref1] en
      [artikel 7, eerste lid, van het Besluit vluchtuitvoering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.7
      [ref2]: https://wetten.overheid.nl/BWBR0020111#Artikel7
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5.7'
      - id: ref2
        bwb_id: BWBR0020111
        artikel: '7'
  - number: 1b
    text: |-
      Deze regeling is van toepassing op activiteiten als bedoeld in artikel 2, derde lid, van de basisverordening en op
      vluchten met een RPAS die worden uitgevoerd op Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel1b
  - number: '2'
    text: |-
      De Minister kan op aanvraag de volgende bijzondere bevoegdverklaringen afgeven voor de besturing van een RPA
      waarvan de totale startmassa niet meer dan 150kg bedraagt:

      a. bevoegdverklaring voor werkzaamheden met een RPA anders dan boven mensenmenigten, aaneengesloten bebouwing
      of kunstwerken, industrie- en havengebieden daaronder begrepen, spoorlijnen, in gebruik zijnde autosnelwegen en
      autowegen, of wegen waar een maximale snelheid van 80 kilometer per uur geldt *(unpopulated area)*;

      b. klassebevoegdverklaring voor vliegtuigen (A), helikopters (H) of andere categorieën (OA) waarvan de totale
      startmassa 25 kg of minder bedraagt;

      c. klassebevoegdverklaring voor vliegtuigen (A), helikopters (H) of andere categorieën (OA) waarvan de totale
      startmassa meer dan 25 kg maar niet meer dan 150 kg bedraagt;
    url: https://wetten.overheid.nl/BWBR0036568/2020-12-31#Artikel2
  - number: '3'
    text: |-
      1 Een RPA-L met daarop weergegeven de algemene bevoegdverklaring VLOS of EVLOS wordt afgegeven indien de aanvrager
      heeft aangetoond te voldoen aan de voor het betreffende type operatie benodigde eisen inzake kennis, bedrevenheid
      en ervaring opgenomen in [bijlage 1][ref1] bij deze regeling.

      2 De algemene bevoegdverklaring FI (RPA), bedoeld in
      [artikel 3, zesde lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref2], wordt afgegeven indien
      de aanvrager:

      a. houder is van een RPA-L, met daarop weergegeven de algemene bevoegdverklaring(en) en de bijzondere
      bevoegdverklaring(en) waarvoor onderricht wordt gegeven; en

      b. ten minste acht uren ervaring heeft als gezagvoerder in de periode van twee jaar onmiddellijk voorafgaande aan
      de aanvraag.

      3 De bijzondere bevoegdverklaring, bedoeld in [artikel 2, onderdeel a][ref3], wordt afgegeven indien de aanvrager
      heeft aangetoond te voldoen aan de voor de in dit artikelonderdeel bedoelde werkzaamheden benodigde eisen inzake
      kennis, bedrevenheid en ervaring opgenomen in [bijlage 1][ref4] bij deze regeling.

      4 De klassebevoegdverklaringen, bedoeld in [artikel 2, onderdelen b en c][ref5], worden afgegeven indien de
      aanvrager heeft aangetoond te voldoen aan de voor operaties met RPA’s in de betreffende klasse benodigde eisen
      inzake kennis, bedrevenheid en ervaring opgenomen in [bijlage 1][ref6] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0036568
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel3
