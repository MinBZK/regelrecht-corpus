preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter vervanging van de Vestigingswet Kleinbedrijf 1937
    (Stb. 619) nieuwe regelen te stellen ter bevordering van een goede bedrijfsuitoefening;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: *inrichting:* een krachtens
      [artikel 4][ref1] of 16 aangewezen besloten ruimte of ander ondernemingsonderdeel; *beheerder:* degene
      die onmiddellijke leiding geeft aan de uitoefening van een krachtens [artikel 4][ref2] aangewezen bedrijf;
      *bedrijfsleider:* degene die algemene leiding geeft aan een onderneming, waarin een krachtens [artikel 4][ref3]
      aangewezen bedrijf wordt uitgeoefend; *produktschap, hoofdbedrijfschap, bedrijfschap:* een produkt-, een
      hoofdbedrijf- of een bedrijfschap, als bedoeld in [artikel 66 van de Wet op de Bedrijfsorganisatie][ref4] (*Stb.*
      1950, K 22), ingesteld voor ondernemingen, waarin het betrokken bedrijf wordt uitgeoefend; *bedrijfslichaam:* een
      produktschap, hoofdbedrijfschap of een bedrijfschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel4b
      [ref2]: https://wetten.overheid.nl/BWBR0002130#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002130#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0002058#Artikel66
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: 4b
      - id: ref2
        bwb_id: BWBR0002130
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0002130
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0002058
        artikel: '66'
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder *onderneming* mede verstaan een bedrijf,
      waarmede niet wordt beoogd het maken van winst.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel1
  - number: '2.1'
    text: |-
      Deze wet is niet van toepassing op de landbouw, de visserij, het bankbedrijf, het verzekeringsbedrijf en het
      vervoerbedrijf.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel2
  - number: '2.2'
    text: |-
      Zij verstaat onder: *landbouw:* de akkerbouw, weidebouw, veehouderij, pluimveehouderij, fruitteelt,
      tuinbouw - daaronder begrepen het kweken van bomen, bloemen en bloembollen -, de teelt van griendhout
      en elke andere vorm van bodemcultuur; *bankbedrijf:* het bedrijf van kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1], borg- en garantie-
      instelling, kerkelijke kredietinstelling, bouwkas, spaarkas, administratie- of trustkantoor op effectengebied,
      instelling tot financiering van de handel in onroerende goederen en commissionnair of makelaar in effecten, het
      bedrijf van het verlenen van bemiddeling bij het verstrekken van onderhandse leningen of kasgeldleningen, zomede de
      valutahandel, discontohandel en geldwisselhandel; *vervoerbedrijf:*


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
  - number: 2.2.a
    text: het bedrijf van het vervoeren van personen of goederen ter zee of door de lucht;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel2
  - number: 2.2.b
    text: |-
      het bedrijf van het vervoeren van personen of goederen met binnenschepen voor zover dit vervoer slechts mag
      geschieden krachtens een vergunning ingevolge de [Wet vervoer binnenvaart][ref1] (*Stb.* 1991, 711), daaronder niet
      begrepen het meubeltransportbedrijf;


      [ref1]: https://wetten.overheid.nl/BWBR0005319
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005319
  - number: 2.2.c
    text: |-
      het bedrijf van het vervoeren van goederen met vrachtauto’s voor zover dit vervoer slechts mag geschieden krachtens
      een vergunning ingevolge de [Wet goederenvervoer over de weg][ref1] (*Stb.* 1992, 145), daaronder niet begrepen
      het meubeltransportbedrijf;


      [ref1]: https://wetten.overheid.nl/BWBR0005443
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005443
  - number: 2.2.d
    text: |-
      het bedrijf van het vervoeren van personen krachtens een ingevolge de [Wet personenvervoer 2000][ref1] geldige
      vergunning wordt verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011470
  - number: 2.2.e
    text: |-
      het bedrijf van het vervoeren van goederen of personen krachtens een bedrijfsvergunning ingevolge de
      [Spoorwegwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015007
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015007
  - number: '2.3'
    text: |-
      Zij verstaat mede onder: *visserij:* de oester- en de mosselteelt; *verzekeringsbedrijf:* het bedrijf van het
      verlenen van bemiddeling bij het sluiten van verzekeringen tegen het genot van een beloning.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel2
  - number: '3'
    text: |-
      Wanneer ter uitvoering van deze wet de medewerking van een bedrijfslichaam wordt gevorderd, wordt, onverminderd het
      bepaalde in [artikel 98 van de Wet op de Bedrijfsorganisatie][ref1], die medewerking verleend door het bestuur van
      dat lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel98
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '98'
  - number: '4.1'
    text: |-
      Bij algemene maatregel van bestuur, in deze wet verder genoemd *vestigingsbesluit,* kan worden verboden het
      uitoefenen van een daarbij aangewezen bedrijf zonder vergunning van de Kamer van Koophandel en Fabrieken. In plaats
      van de Kamer kan een bedrijfslichaam worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel4
  - number: '4.2'
    text: |-
      Een vestigingsbesluit wordt niet vastgesteld dan op verzoek van een bedrijfschap of, bij ontstentenis hiervan,
      van een produkt- of een hoofdbedrijfschap, dan wel op verzoek van een of meer naar Ons oordeel representatieve
      verenigingen van de betrokken ondernemers.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel4
  - number: '4.3'
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een vestigingsbesluit wordt Ons gedaan door Onze
      Minister van Economische Zaken en Onze Minister, wie het mede aangaat, tezamen.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel4
  - number: 4a.1
    text: |-
      Bij ieder vestigingsbesluit wordt bepaald, welke handelingen als uitoefening van het aangewezen bedrijf worden
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel4a
  - number: 4a.2
    text: |-
      Daarbij kan ten aanzien van een of meer van die handelingen worden bepaald, dat zij slechts als uitoefening van
      het aangewezen bedrijf worden aangemerkt, voor zover zij in samenhang met andere van die handelingen onder daarbij
      aangegeven omstandigheden worden verricht. Het aldus verrichten van eerstbedoelde handelingen wordt niet aangemerkt
      als uitoefening van enig ander krachtens deze wet aangewezen bedrijf.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel4a
  - number: 4a.3
    text: |-
      Daarbij kan voorts worden bepaald, dat als uitoefening van het aangewezen bedrijf mede wordt aangemerkt het
      openlijk aanduiden of doen aanduiden van de bereidheid een of meer van de krachtens het eerste lid aangewezen
      handelingen te verrichten, onverminderd het in het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel4a
  - number: 4b
    text: |-
      Bij ieder vestigingsbesluit kan worden bepaald, dat daarbij aangewezen besloten ruimten of andere
      ondernemingsonderdelen, waarin het daarbij aangewezen bedrijf wordt uitgeoefend, voor de toepassing van het bij of
      krachtens deze wet bepaalde als inrichting worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel4b
  - number: '5.1'
    text: |-
      Een vergunning is vereist voor iedere inrichting, waarin het aangewezen bedrijf wordt uitgeoefend, zomede voor
      een onderneming, voor zover dat bedrijf daarin anders dan in een inrichting of in rechtstreeks verband met de
      uitoefening van dat bedrijf in een inrichting wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel5
  - number: '5.2'
    text: |-
      Bij overgang van de onderneming op rechtverkrijgenden onder algemene titel van de vergunninghouder gaat tevens de
      vergunning op hen over, tenzij de daarin vermelde bedrijfsleider of beheerder deze hoedanigheid heeft verloren.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel5
  - number: '6.1'
    text: |-
      Een vergunning wordt uitsluitend verleend, indien wordt voldaan aan bij het vestigingsbesluit te stellen eisen;
      deze kunnen slechts betrekking hebben op handelskennis en vakbekwaamheid. Zij kunnen niet hoger worden gesteld dan
      naar Ons oordeel strikt noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel6
  - number: '6.2'
    text: |-
      Aan de eisen van handelskennis moet worden voldaan door een bedrijfsleider en aan die van vakbekwaamheid door een
      beheerder. Indien bij het vestigingsbesluit afzonderlijke eisen van handelskennis voor beheerders zijn gesteld,
      moet hieraan worden voldaan door een beheerder.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel6
  - number: '7.1'
    text: |-
      Bij of krachtens ieder vestigingsbesluit worden de bewijsstukken aangewezen, waaruit het voldoen aan de daarbij
      gestelde eisen van handelskennis en van vakbekwaamheid moet blijken. Voor wat betreft bewijsstukken, die worden
      afgegeven op grond van het met gunstig gevolg afleggen van een examen, kan bij de aanwijzing worden bepaald,
      dat deze slechts geldt, voor zover met betrekking tot dat examen een door Onze Minister van Economische Zaken
      goedgekeurd examenreglement is in acht genomen.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel7
  - number: '7.2'
    text: |-
      Bij ieder vestigingsbesluit worden als bewijsstukken als in het eerste lid bedoeld aangewezen verklaringen van
      handelskennis en verklaringen van vakbekwaamheid, tot het afgeven waarvan daarbij aan de Sociaal-Economische Raad
      dan wel aan een produkt-, of een hoofdbedrijfschap of het Bedrijfschap voor het Hotel-, het Restaurant-, het Café-,
      en het Pension- en Kamerverhuurbedrijf en Aanverwante bedrijven de bevoegdheid wordt verleend.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel7
  - number: '8.1'
    text: Bij een vestigingsbesluit kan worden bepaald, welke gegevens de aanvrage om een vergunning dient te bevatten.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel8
  - number: '8.2'
    text: |-
      Zij gaat vergezeld van de nodige krachtens [artikel 7][ref1] aangewezen bewijsstukken en verdere bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel7
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '7'
  - number: '8.3'
    text: Op de aanvrage wordt binnen twee maanden beslist.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel8
  - number: '9'
    text: 'Indien de Kamer van Koophandel en Fabrieken tot het verlenen van de vergunning is aangewezen, is bevoegd:'
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel9
  - number: 9.a
    text: |-
      ingeval de vergunning wordt gevraagd voor een inrichting, die niet gebezigd wordt voor het rondtrekkend uitoefenen
      van het bedrijf, de Kamer, binnen welker gebied de inrichting is of zal worden gevestigd;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel9
  - number: 9.b
    text: |-
      in andere gevallen de Kamer, binnen welker gebied de onderneming is of zal worden gevestigd, of, indien de
      onderneming buiten Nederland is of zal worden gevestigd, de Kamer van Koophandel en Fabrieken voor Rotterdam.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel9
  - number: '10.1'
    text: 'De vergunning wordt geweigerd:'
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel10
  - number: 10.1.a
    text: |-
      indien niet is aangetoond, dat door de daarin te vermelden bedrijfsleider en beheerder aan de gestelde eisen wordt
      voldaan;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel10
  - number: 10.1.b
    text: |-
      indien redelijkerwijs moet worden aangenomen, dat een daarin te vermelden bedrijfsleider of beheerder, anders dan
      overeenkomstig een voorlopige vergunning of een ontheffing krachtens deze wet, tevens bedrijfsleider of beheerder
      in de zin van deze wet buiten de betrokken onderneming, of, voor zoveel de beheerder van een onderdeel ener
      onderneming betreft, tevens beheerder buiten dat onderdeel zal zijn;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel10
  - number: 10.1.c
    text: |-
      indien redelijkerwijs moet worden aangenomen, dat de feitelijke toestand niet met het in de aanvrage vermelde in
      overeenstemming zal zijn.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel10
  - number: '10.2'
    text: |-
      Het vorige lid, onder *a*, is niet van toepassing ingeval de vergunning is gevraagd door de weduwe, weduwnaar of
      de achtergebleven geregistreerde partner van een vergunninghouder, die in zijn vergunning tevens als bedrijfsleider
      of beheerder was vermeld, dan wel door kinderen - die de leeftijd van 21 jaar niet hebben bereikt - die tot hen
      of een van hen in familierechtelijke betrekking staan of stonden, uitsluitend met het oog op zijn vervanging
      als bedrijfsleider of beheerder door zijn weduwe, weduwnaar of de achtergebleven geregistreerde partner of een
      dergelijk kind. Bij een vestigingsbesluit kan worden bepaald, dat de vorige volzin niet geldt.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel10
  - number: '10.3'
    text: |-
      Het eerste lid, onder *a*, is eveneens niet van toepassing, ingeval de vergunning is gevraagd door een
      vergunninghouder uitsluitend met het oog op de verplaatsing van de uitoefening van een bedrijf naar een andere
      inrichting.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel10
  - number: '10.4'
    text: |-
      Bij een vestigingsbesluit kan worden bepaald, dat het eerste lid, onder *b*, niet van toepassing is in bij dat
      besluit aan te wijzen gevallen.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel10
  - number: '10.5'
    text: Indien geen der in het eerste lid bedoelde weigeringsgronden aanwezig is, wordt de vergunning verleend.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel10
  - number: '10.6'
    text: |-
      Een met toepassing van het tweede lid verleende vergunning geldt van het tijdstip van het overlijden van de daar
      bedoelde vergunninghouder af. Indien zij is verleend met het oog op het optreden van een kind als bedrijfsleider
      of beheerder, geldt zij gedurende vijf jaar of, indien het kind op dat tijdstip de leeftijd van achttien jaar
      nog niet had bereikt, tot vijf jaar na het bereiken van die leeftijd. Bij een vestigingsbesluit kan een kortere
      termijn worden vastgesteld. Ten aanzien van vergunningen, verleend uitsluitend met het oog op het optreden van
      de weduwe, weduwnaar of de achtergebleven geregistreerde partner als bedrijfsleider of beheerder, kan bij een
      vestigingsbesluit worden bepaald, dat zij gelden gedurende een bij dat besluit vast te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel10
  - number: '11.1'
    text: 'De vergunning vervalt:'
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel11
  - number: 11.1.a
    text: |-
      wanneer na haar dagtekening zes maanden zijn verlopen, zonder dat met de bedrijfsuitoefening een aanvang is
      gemaakt;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel11
  - number: 11.1.b
    text: |-
      wanneer de bedrijfsuitoefening gedurende een bij het vestigingsbesluit te bepalen termijn, anders dan wegens
      overmacht, ononderbroken gestaakt is geweest;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel11
  - number: 11.1.c
    text: wanneer een daarin vermelde bedrijfsleider of beheerder deze hoedanigheid verliest;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel11
  - number: 11.1.d
    text: |-
      wanneer een daarin vermelde bedrijfsleider of beheerder, anders dan overeenkomstig een voorlopige vergunning of
      een ontheffing krachtens deze wet, tevens bedrijfsleider of beheerder in de zin van deze wet buiten de betrokken
      onderneming, of, voor zoveel de beheerder van een onderdeel ener onderneming betreft, tevens beheerder buiten dat
      onderdeel wordt;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel11
  - number: 11.1.e
    text: |-
      wanneer een verklaring van handelskennis of vakbekwaamheid, op grond waarvan de vergunning is verleend, is
      ingetrokken en tegen de intrekking geen beroep meer openstaat;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel11
  - number: 11.1.f
    text: |-
      wanneer een daarin vermelde bedrijfsleider of beheerder deze hoedanigheid op het tijdstip, waarop met de
      bedrijfsuitoefening een aanvang wordt gemaakt, niet bezit, onmiddellijk na dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel11
  - number: '11.2'
    text: |-
      Het eerste lid, onder *c-e,* is niet van toepassing gedurende een faillissement of toepassing van de
      schuldsaneringsregeling natuurlijke personen. Bij het eindigen hiervan vervalt de vergunning echter, indien een der
      in die bepalingen bedoelde omstandigheden is ingetreden.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel11
  - number: '11.3'
    text: |-
      Bij een vestigingsbesluit kan worden bepaald, dat het eerste lid, onder *d*, zomede het tweede lid, tweede volzin,
        - voor zover deze op de in eerstgenoemde bepaling bedoelde omstandigheid betrekking heeft - niet van toepassing
      zijn in bij dat besluit aan te wijzen gevallen.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel11
  - number: '12.1'
    text: |-
      Indien een vergunning vervalt, kan voor de betrokken onderneming of inrichting een voorlopige vergunning worden
      verleend. Op de aanvrage wordt binnen twee weken beslist. De [artikelen 6][ref1], [8, tweede en derde lid][ref2],
      [10][ref3] en [11][ref4] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002130#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002130#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002130#Artikel11
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002130
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002130
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0002130
        artikel: '11'
  - number: '12.2'
    text: |-
      De voorlopige vergunning geldt gedurende zes maanden, gerekend van het tijdstip van het vervallen van de vergunning
      af. Indien de houder inmiddels een aanvrage om een nieuwe vergunning of een ontheffing als in [artikel 15][ref1]
      bedoeld ten aanzien van het betrokken bedrijf heeft ingediend, geldt zij verder, totdat deze is verleend, dan wel,
      indien deze is geweigerd, totdat sedert het tijdstip, na hetwelk tegen de weigering geen beroep meer openstaat,
      twee maanden zijn verlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel15
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '15'
  - number: '13.1'
    text: |-
      Een vergunning wordt ingetrokken, indien de te harer verkrijging verstrekte gegevens zodanig onjuist of onvolledig
      blijken, dat op de aanvrage een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste
      omstandigheden volledig bekend waren geweest.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel13
  - number: '13.2'
    text: |-
      De werking van de beschikking waarbij de vergunning wordt ingetrokken, wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel13
  - number: '14.1'
    text: |-
      Een verklaring van handelskennis of vakbekwaamheid wordt uitsluitend afgegeven aan personen, die aan de gestelde
      eisen voldoen, doch van wie redelijkerwijs niet kan worden verlangd, dat zij zich van andere bewijsstukken
      voorzien.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister van Economische Zaken stelt in overeenstemming met Onze Minister, wie het mede aangaat, regelen voor
      de beslissing op de aanvragen om een verklaring.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel14
  - number: '14.3'
    text: Op een aanvrage wordt binnen vier maanden beslist.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel14
  - number: '14.4'
    text: |-
      De [artikelen 8, eerste lid][ref1], en [13][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002130#Artikel13
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002130
        artikel: '13'
  - number: '15.1'
    text: |-
      Onze Minister van Economische Zaken verleent van een bij een vestigingsbesluit gegeven verbod tot uitoefening van
      een daarbij aangewezen bedrijf op aanvrage ontheffing:
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel15
  - number: 15.1.a
    text: |-
      indien reeds een vergunning is verleend voor de uitoefening van een ander bedrijf in dezelfde onderneming of
      inrichting onder de onmiddellijke leiding van dezelfde beheerder, en naar het oordeel van Onze genoemde Minister
      deze laatste uitoefening een hoofdbestanddeel van de bedrijfsuitoefening in die onderneming of inrichting uitmaakt
      en de aard der onderneming dan wel plaatselijke of regionale omstandigheden tot gezamenlijke uitoefening van deze
      bedrijven aanleiding geven;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel15
  - number: 15.1.b
    text: |-
      indien naar zijn oordeel sprake is van een bijzonder geval en gewichtige belangen tot het verlenen van een
      ontheffing aanleiding geven;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel15
  - number: 15.1.c
    text: |-
      indien het bepaalde in een richtlijn van de Raad van de Europese Gemeenschappen met betrekking tot de vestiging
      van of het verrichten van diensten door natuurlijke personen en vennootschappen op het grondgebied van een van
      de Lid-Staten van de Europese Gemeenschappen, dan wel, met toepassing van de Overeenkomst betreffende de Europese
      Economische Ruimte of de op 21 juni 1999 te Luxemburg totstandgekomen Overeenkomst tussen de Europese Gemeenschap
      en haar lidstaten, enerzijds, en de Zwitserse Bondsstaat, anderzijds, over het vrije verkeer van personen (Trb.
      2000, 16 en 86), op het grondgebied van een andere Staat die partij is bij een van de genoemde Overeenkomsten, tot
      het verlenen van een ontheffing aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel15
  - number: '15.2'
    text: De ontheffing kan onder beperkingen worden verleend; aan de ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel15
  - number: '15.3'
    text: Op een aanvrage om een ontheffing wordt binnen vier maanden beslist.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel15
  - number: '15.4'
    text: |-
      Onze minister van Economische Zaken kan de hem in het eerste lid verleende bevoegdheid in een door hem bepaalde
      omvang en onder het stellen van regelen delegeren aan de Sociaal-Economische Raad dan wel aan een produkt-
      of een hoofdbedrijfschap of het Bedrijfschap voor het Hotel-, het Restaurant-, het Café- en het Pension- en
      Kamerverhuurbedrijf en Aanverwante bedrijven. Deze regelen kunnen voorwaarden inhouden, waaraan voor het verkrijgen
      van een ontheffing moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel15
  - number: '15.5'
    text: |-
      Hij oefent de hem in dit artikel toegekende bevoegdheden niet uit dan in overeenstemming met Onze Minister, wie het
      mede aangaat.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel15
  - number: '15.6'
    text: |-
      Een krachtens het eerste lid, onder *a*, verleende ontheffing vervalt, wanneer de daar bedoelde vergunning vervalt
      of wordt ingetrokken, alsmede wanneer de daar bedoelde beheerder deze hoedanigheid verliest met betrekking tot de
      gezamenlijke uitoefening van de betrokken bedrijven.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel15
  - number: '15.7'
    text: |-
      De [artikelen 5, tweede lid][ref1], [8, eerste lid][ref2], [11, eerste lid, onder ][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002130#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002130#Artikel11
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002130
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002130
        artikel: '11'
  - number: '16.1'
    text: |-
      Onze Minister van Economische Zaken en Onze Minister, wie het mede aangaat, kunnen op verzoek van het lichaam,
      dat vaststelling van een vestigingsbesluit heeft verzocht, bij gemeenschappelijke regeling, in deze wet verder
      genoemd *vestigingsregeling,* verbieden het uitoefenen van het betrokken bedrijf zonder vergunning van de Sociaal-
      Economische Raad. In plaats van de Raad kan een produkt- of een hoofdbedrijfschap worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel16
  - number: '16.2'
    text: |-
      Het in een vestigingsregeling vervatte verbod geldt niet ten aanzien van de uitoefening van het aangewezen
      bedrijf in de ondernemingen en inrichtingen, waarin dat bedrijf bij het in werking treden van die regeling wordt
      uitgeoefend, echter voor wat die inrichtingen betreft slechts zolang zij blijven behoren tot de onderneming,
      waartoe zij bij het in werking treden van de regeling behoorden.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel16
  - number: '16.3'
    text: |-
      De [artikelen 4][ref1] en [4][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0002130#Artikel4b
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0002130
        artikel: 4b
  - number: '17.1'
    text: |-
      Een vestigingsregeling is gedurende een jaar van kracht; deze termijn kan eenmaal met ten hoogste zes maanden
      worden verlengd.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel17
  - number: '17.2'
    text: Zij houdt op van kracht te zijn, wanneer voor het betrokken bedrijf een vestigingsbesluit in werking treedt.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister van Economische Zaken stelt, in overeenstemming met Onze Minister, wie het mede aangaat, de
      voorwaarden vast, waaraan voor het verkrijgen van een vergunning op grond van een vestigingsregeling moet worden
      voldaan.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel18
  - number: '18.2'
    text: |-
      De vergunning kan onder beperkingen worden verleend; aan de vergunning kunnen voorschriften worden verbonden. In
      de vergunning kan worden verklaard, dat op grond van de omstandigheden, uit hoofde waarvan zij wordt verleend,
      [artikel 27, eerste lid][ref1], te dezen niet van toepassing dient te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel27
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '27'
  - number: '18.3'
    text: Op een aanvrage om een dergelijke vergunning wordt binnen vier maanden beslist.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel18
  - number: '18.4'
    text: |-
      De [artikelen 5][ref1], [8, eerste lid][ref2], en [13][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002130#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002130#Artikel13
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002130
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002130
        artikel: '13'
  - number: '19'
    text: |-
      Bij het indienen van een aanvraag om een vergunning, een verklaring van handelskennis of van vakbekwaamheid of een
      ontheffing moet een bij algemene maatregel van bestuur vast te stellen bedrag worden betaald.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel19
  - number: 20a
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel20a
  - number: '22'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven ter bevordering van een goede
      uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel22
  - number: 22a.1
    text: |-
      Er is een openbaar register, waarin gegevens betreffende de ingevolge deze wet verleende vergunningen en
      ontheffingen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel22a
  - number: 22a.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent het register, de wijze waarop van de gegevens
      daarin kan worden kennis genomen en de daarvoor verschuldigde vergoeding.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel22a
  - number: '23'
    text: |-
      Het is verboden ter zake van een aanvrage om een vergunning, verklaring of ontheffing onjuiste of onvolledige
      gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel23
  - number: '25.1'
    text: |-
      Aan hen, die bij het in werking treden van een vestigingsbesluit bedrijfsleider of beheerder zijn van een
      onderneming of inrichting, waarin het aangewezen bedrijf wordt uitgeoefend, en die voldoen aan door Onze
      Minister van Economische Zaken in overeenstemming met Onze Minister, wie het mede aangaat, voor bedrijfsleiders
      of beheerders te stellen voorwaarden, wordt op hun binnen vijf jaren ingediende aanvrage een verklaring van
      handelskennis of vakbekwaamheid voor dat bedrijf afgegeven.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel25
  - number: '25.2'
    text: |-
      Het eerste lid is niet van toepassing, indien de uitoefening van het aangewezen bedrijf bij het in werking treden
      van het vestigingsbesluit plaats had onder een der in [artikel 27, tweede lid][ref1], genoemde omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel27
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '27'
  - number: '25.3'
    text: |-
      Voor zoveel betreft aanvragen van bedrijfsleiders of van beheerders, die van dezelfde onderneming tevens
      bedrijfsleider of die in eigen onderneming werkzaam zijn, is het eerste lid niet van toepassing, indien het feit,
      dat in de onderneming of inrichting bij het in werking treden van het vestigingsbesluit het aangewezen bedrijf werd
      uitgeoefend, uitsluitend kan worden gestaafd met een beroep op handelingen, verricht in strijd met het bepaalde
      krachtens deze wet, de Vestigingswet detailhandel of de [Drank- en Horecawet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002458
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002458
  - number: '26.1'
    text: |-
      Het in een vestigingsbesluit vervatte verbod geldt gedurende drie maanden na het in werking treden van het besluit
      niet ten aanzien van de uitoefening van het aangewezen bedrijf in de ondernemingen en inrichtingen, waarin dat
      bedrijf bij het in werking treden wordt uitgeoefend, echter voor wat die inrichtingen betreft slechts zolang zij
      blijven behoren tot de onderneming, waartoe zij bij het in werking treden behoorden.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel26
  - number: '26.2'
    text: |-
      Indien voor zodanige onderneming of inrichting binnen die termijn een vergunning of ontheffing is gevraagd, geldt
      het verbod ook na afloop van die termijn niet, totdat de vergunning of ontheffing is verleend, dan wel, indien deze
      is geweigerd, totdat sedert het tijdstip, na hetwelk tegen de weigering geen beroep meer openstaat, twee maanden
      zijn verlopen. Echter geldt het in de vorige volzin bepaalde voor een inrichting slechts, zolang zij blijft behoren
      tot de onderneming, waartoe zij bij het in werking treden van het vestigingsbesluit behoorde.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel26
  - number: '26.3'
    text: |-
      [Artikel 27, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel27
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '27'
  - number: '27.1'
    text: |-
      Aan hen, die bij het in werking treden van een vestigingsbesluit het aangewezen bedrijf al gedurende een
      aaneengesloten termijn van tenminste 18 maanden uitoefenen, wordt op hun aanvrage de vereiste vergunning verleend,
      indien de in de aanvrage als bedrijfsleider van de betrokken onderneming en als beheerder van de betrokken
      onderneming vermelde personen die hoedanigheid bij het in werking treden van dat besluit al gedurende een
      aaneengesloten termijn van tenminste 18 maanden bezaten en haar tot het tijdstip van de aanvrage hebben behouden.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel27
  - number: '27.2'
    text: |-
      Het eerste lid is niet van toepassing, indien ten aanzien van de uitoefening van het aangewezen bedrijf bij het in
      werking treden van het vestigingsbesluit gold:
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel27
  - number: 27.2.a
    text: een voorlopige vergunning of een ontheffing;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel27
  - number: 27.2.b
    text: |-
      een op grond van een vestigingsregeling verleende vergunning, welke een verklaring bevat als bedoeld in de tweede
      volzin van [artikel 18, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel18
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '18'
  - number: 27.2.c
    text: |-
      een op grond van een vestigingsregeling verleende vergunning, waarin een persoon is vermeld als belast met de
      algemene leiding van de onderneming of met de onmiddellijke leiding van de uitoefening van het aangewezen bedrijf
      in de betrokken inrichting of onderneming, doch die persoon bedoelde hoedanigheid bij het in werking treden van het
      vestigingsbesluit niet langer bezit.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel27
  - number: '27.3'
    text: |-
      Het eerste lid is niet van toepassing, indien het feit, dat bij het in werking treden van het vestigingsbesluit
      het aangewezen bedrijf werd uitgeoefend, uitsluitend kan worden gestaafd met een beroep op handelingen, verricht in
      strijd met het bepaalde krachtens deze wet, de Vestigingswet detailhandel of de [Drank- en Horecawet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002458
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002458
  - number: '27.4'
    text: |-
      Het eerste lid is niet meer van toepassing, indien de uitoefening van het aangewezen bedrijf na het in werking
      treden van het vestigingsbesluit gedurende een bij dat besluit te bepalen termijn, anders dan wegens overmacht,
      ononderbroken gestaakt is geweest.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel27
  - number: '27.5'
    text: |-
      De vergunning wordt niet verleend dan nadat de naam van de aanvrager gedurende een maand vermeld is geweest op een
      lijst, die ten kantore van de betrokken Kamer van Koophandel en Fabrieken en, in voorkomend geval, mede ten kantore
      van het in haar plaats aangewezen lichaam ter inzage van een ieder is nedergelegd.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel27
  - number: '27.6'
    text: |-
      De [artikelen 8, tweede en derde lid][ref1], en [10, eerste lid, onder ][ref2], zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002130#Artikel10
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002130
        artikel: '10'
  - number: 27a.1
    text: |-
      [Artikel 25][ref1] is van overeenkomstige toepassing ten aanzien van hen, die eerst bij en als gevolg van het in
      werking treden van een wijziging van een vestigingsbesluit zijn aan te merken als bedrijfsleider of beheerder van
      een onderneming of inrichting, waarin het aangewezen bedrijf wordt uitgeoefend, behoudens ingeval dat artikel reeds
      te hunnen aanzien van toepassing is of is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel25
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '25'
  - number: 27a.2
    text: |-
      [Artikel 26][ref1] is van overeenkomstige toepassing in de gevallen, waarin een onderneming of inrichting eerst
      bij en als gevolg van het in werking treden van een wijziging van een vestigingsbesluit is aan te merken als
      onderneming of inrichting, waarin het aangewezen bedrijf wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel26
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '26'
  - number: 27a.3
    text: |-
      [Artikel 27][ref1] is van overeenkomstige toepassing ten aanzien van hen, wier onderneming of inrichting eerst
      bij en als gevolg van het in werking treden van een wijziging van een vestigingsbesluit is aan te merken als
      onderneming of inrichting, waarin het aangewezen bedrijf wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel27
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '27'
  - number: '28.1'
    text: |-
      De [artikelen 25, eerste lid][ref1], en [27, eerste lid][ref2], zijn niet van toepassing, indien ten aanzien van de
      uitoefening van het aangewezen bedrijf bij het in werking treden van het vestigingsbesluit:


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002130#Artikel27
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002130
        artikel: '27'
  - number: 28.1.a
    text: |-
      een voorlopige vergunning of een ontheffing gold, verleend krachtens de Vestigingswet Kleinbedrijf 1937 (*Stb.*
      619) of een ontheffing, verleend krachtens een op grond van artikel 7 van het Organisatiebesluit Voedselvoorziening
      1941 (*Verordeningenblad* 69) vastgestelde regeling;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel28
  - number: 28.1.b
    text: |-
      beperkingen of voorwaarden golden, welke zijn verbonden aan een vergunning of erkenning, verleend krachtens een op
      grond van het onder *a* genoemde besluit vastgestelde regeling of krachtens het in [artikel 32, vierde lid][ref1],
      genoemde besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel32
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '32'
  - number: '28.2'
    text: |-
      De [artikelen 16, derde lid][ref1], [25, eerste lid][ref2], - voor zoveel betreft aanvragen van bedrijfsleiders of
      van beheerders, die van dezelfde onderneming tevens bedrijfsleider of die in eigen onderneming werkzaam zijn - 26,
      eerste lid, en 27, eerste lid, zijn niet van toepassing, indien het feit, dat in de onderneming of inrichting bij
      het in werking treden van de vestigingsregeling of het vestigingsbesluit het aangewezen bedrijf werd uitgeoefend,
      uitsluitend kan worden gestaafd met een beroep op handelingen, verricht in strijd met een voorschrift, gegeven bij
      of krachtens een regeling als in het eerste lid bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002130#Artikel25
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0002130
        artikel: '25'
  - number: '28.3'
    text: |-
      De [artikelen 25, eerste lid][ref1], [26, eerste lid][ref2], [27, eerste lid][ref3], en [27][ref4] zijn
      niet van toepassing, indien het feit, dat in de onderneming of inrichting bij het in werking treden van het
      vestigingsbesluit of een wijziging daarvan het aangewezen bedrijf werd uitgeoefend, uitsluitend kan worden gestaafd
      met een beroep op handelingen als bedoeld in [artikel 4][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002130#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002130#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0002130#Artikel27a
      [ref5]: https://wetten.overheid.nl/BWBR0002130#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002130
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0002130
        artikel: '27'
      - id: ref4
        bwb_id: BWBR0002130
        artikel: 27a
      - id: ref5
        bwb_id: BWBR0002130
        artikel: 4a
  - number: '29'
    text: |-
      Ten aanzien van de vaststelling van een vestigingsbesluit voor een bedrijf, waarvoor een krachtens de Vestigingswet
      Kleinbedrijf 1937 gegeven verbod van kracht is, blijft [artikel 4, tweede lid][ref1], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel4
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '4'
  - number: '30'
    text: |-
      Zolang het Organisatiebesluit Voedselvoorziening 1941 van kracht is, kan bij de vaststelling van een
      vestigingsbesluit in plaats van de Kamer van Koophandel en Fabrieken worden aangewezen een hoofdbedrijfschap of
      een bedrijfschap, als bedoeld in artikel 2, tweede lid, van dat Organisatiebesluit, ingesteld voor ondernemingen,
      waarin het betrokken bedrijf wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel30
  - number: '32.1'
    text: 'De navolgende regelingen worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel32
  - number: 32.1.a
    text: de Vestigingswet Kleinbedrijf 1937;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel32
  - number: 32.1.b
    text: het Besluit Reëvacuatie-vestiging Kleinbedrijf 1945 (*Stb.* F 257).
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel32
  - number: '32.2'
    text: |-
      De navolgende regelingen van de Secretarissen-Generaal van de Departementen van Handel, Nijverheid en Scheepvaart
      en van Landbouw en Visserij vervallen:
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel32
  - number: 32.2.a
    text: het Besluit Algemeen Vestigingsverbod Kleinbedrijf 1941 (*Stct.* 234);
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel32
  - number: 32.2.b
    text: |-
      de besluiten van 1 Juni 1942 (*Stct.* 103), van 20 December 1943 (*Stct.* 248), voor zover het bepaalde onder V
      betreft, en van 27 Maart 1944 (*Stct.* 61), tot wijziging van het Besluit Algemeen Vestigingsverbod Kleinbedrijf
      1941;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel32
  - number: 32.2.c
    text: |-
      het besluit van 1 December 1943 (*Stct.* 235), tot wijziging van het Besluit Algemeen Vestigingsverbod Kleinbedrijf
      1941 en tot afwijking van de Vestigingswet Kleinbedrijf 1937;
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel32
  - number: 32.2.d
    text: |-
      de beschikkingen van 6 Februari 1942 (*Stct.* 26) en van 1 December 1943 (*Stct.* 235), tot uitvoering van het
      Besluit Algemeen Vestigingsverbod Kleinbedrijf 1941.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel32
  - number: '32.3'
    text: |-
      Het besluit van de Secretaris-Generaal van het Departement van Handel, Nijverheid en Scheepvaart van 3 September
      1942 (*Stct.* 171), betreffende vestiging als makelaar, vervalt.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel32
  - number: '32.4'
    text: |-
      Het besluit van de Secretarissen-Generaal van de Departementen van Handel, Nijverheid en Scheepvaart en van
      Financiën van 16 Februari 1944 (*Stct.* 44), betreffende het uitoefenen van het bedrijf van tussenpersoon in
      onroerende goederen en dat van veilinghouder, alsmede betreffende het houden van veilingen, vervalt.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel32
  - number: '33.1'
    text: |-
      Ten aanzien van een bedrijf, waarvoor bij het in werking treden van deze wet een krachtens de Vestigingswet
      Kleinbedrijf 1937 vastgestelde regeling geldt, blijft het bij en krachtens die wet bepaalde zomede artikel
      II, eerste en tweede lid, van het in [artikel 32, tweede lid, onder ][ref1], genoemde besluit en de
      [Wet op de economische delicten][ref2], met uitzondering van de daarin bij [artikel 31][ref3] aangebrachte
      wijzigingen, van toepassing, totdat vorenbedoelde regeling wordt ingetrokken. Voor de toepassing van de tweede
      volzin van [artikel 4][ref4], wordt zodanig bedrijf met een krachtens de onderhavige wet aangewezen bedrijf
      gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002063
      [ref3]: https://wetten.overheid.nl/BWBR0002130#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0002130#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0002063
      - id: ref3
        bwb_id: BWBR0002130
        artikel: '31'
      - id: ref4
        bwb_id: BWBR0002130
        artikel: 4a
  - number: '33.2'
    text: |-
      Ten aanzien van een bedrijf, waarvoor bij het in werking treden van deze wet een der in
      [artikel 32, derde en vierde lid][ref1], genoemde besluiten geldt, blijft dit besluit van toepassing tot een door
      Ons te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel32
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '32'
  - number: '34.1'
    text: |-
      De bevoegdheid van de organisaties, bedoeld in artikel 2, tweede lid, van het Organisatiebesluit Voedselvoorziening
      1941, tot het vaststellen, op de voet van [artikel 7][ref1] van genoemd besluit, van verordeningen, waarbij
      de vestiging of uitbreiding van ondernemingen afhankelijk wordt gesteld van het voldoen aan eisen van
      kredietwaardigheid, handelskennis of vakbekwaamheid, vervalt, behoudens ten aanzien van ondernemingen van landbouw
      en visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0002130#Artikel7
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002130
        artikel: '7'
  - number: '34.2'
    text: |-
      Zodanige, bij het in werking treden van deze wet geldende, verordening kan evenwel op de voet van het bepaalde bij
      of krachtens het Organisatiebesluit Voedselvoorziening 1941 worden gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel34
  - number: '34.3'
    text: |-
      Een verordening, als bedoeld in het tweede lid, vervalt, behoudens ten aanzien van de begane strafbare feiten, bij
      het in werking treden van een vestigingsbesluit, voor zover zij betrekking heeft op het bij dat besluit aangewezen
      bedrijf.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel34
  - number: '35'
    text: |-
      Wanneer ten aanzien van een bedrijf een vestigingsbesluit of een vestigingsregeling van kracht is geworden, zijn
      de Provinciale Staten en de gemeenteraad niet bevoegd regelen te stellen, waarbij de uitoefening van dat bedrijf
      afhankelijk wordt gesteld van het voldoen aan eisen van kredietwaardigheid, handelskennis of vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel35
  - number: '36'
    text: Deze wet kan worden aangehaald als "Vestigingswet Bedrijven", met vermelding van het jaar harer totstandkoming.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel36
  - number: '37'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002130/2005-01-01#Artikel37
