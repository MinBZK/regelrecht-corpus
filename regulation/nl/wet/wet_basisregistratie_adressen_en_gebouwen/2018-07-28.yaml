---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_basisregistratie_adressen_en_gebouwen
regulatory_layer: WET
publication_date: '2009-03-12'
valid_from: '2018-07-28'
bwb_id: BWBR0023466
url: https://wetten.overheid.nl/BWBR0023466/2018-07-28
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van een goede vervulling van publiekrechtelijke
    taken wenselijk is om een basisregistratie adressen en een basisregistratie gebouwen tot stand te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
  - number: 1.a
    text: |-
      adres: door het bevoegde gemeentelijke orgaan aan een verblijfsobject, een standplaats of een ligplaats toegekende
      benaming, bestaande uit een combinatie van de naam van een openbare ruimte, een nummeraanduiding en de naam van
      een woonplaats;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
  - number: 1.b
    text: |-
      authentiek gegeven: in een basisregistratie opgenomen gegeven dat bij of krachtens de wet als authentiek is
      aangemerkt;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
  - number: 1.e
    text: |-
      basisregistratie: basisregistratie adressen en gebouwen als bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '2'
        hoofdstuk: '1'
  - number: 1.d
    text: |-
      brondocument: document in welke vorm dan ook waarin rechtsfeiten en andere voor de registraties relevante feiten
      zijn neergelegd;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
  - number: 1.e
    text: |-
      Dienst: Dienst voor het kadaster en de openbare registers, genoemd in
      [artikel 2 van de Organisatiewet Kadaster][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '2'
  - number: 1.f
    text: |-
      landelijke voorziening: landelijke voorziening als bedoeld in [artikel 26][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel26
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 1.g
    text: |-
      ligplaats: door het bevoegde gemeentelijke orgaan als zodanig aangewezen plaats in het water al dan niet aangevuld
      met een op de oever aanwezig terrein of een gedeelte daarvan, die bestemd is voor het permanent afmeren van een
      voor woon-, bedrijfsmatige of recreatieve doeleinden geschikt drijvend object;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
  - number: 1.h
    text: |-
      nummeraanduiding: door het bevoegde gemeentelijke orgaan als zodanig toegekende aanduiding van een verblijfsobject,
      een standplaats of een ligplaats;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
  - number: 1.i
    text: 'Onze Minister: Onze Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
  - number: 1.j
    text: |-
      openbare ruimte: door het bevoegde gemeentelijke orgaan als zodanig aangewezen en van een naam voorziene
      buitenruimte die binnen één woonplaats is gelegen;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
  - number: 1.k
    text: |-
      pand: kleinste bij de totstandkoming functioneel en bouwkundig-constructief zelfstandige eenheid die direct en
      duurzaam met de aarde is verbonden en betreedbaar en afsluitbaar is;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
  - number: 1.l
    text: |-
      standplaats: door het bevoegde gemeentelijke orgaan als zodanig aangewezen terrein of gedeelte daarvan dat
      bestemd is voor het permanent plaatsen van een niet direct en niet duurzaam met de aarde verbonden en voor woon-,
      bedrijfsmatige, of recreatieve doeleinden geschikte ruimte;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
  - number: 1.m
    text: |-
      verblijfsobject: kleinste binnen één of meer panden gelegen en voor woon-, bedrijfsmatige, of recreatieve
      doeleinden geschikte eenheid van gebruik die ontsloten wordt via een eigen afsluitbare toegang vanaf de openbare
      weg, een erf of een gedeelde verkeersruimte, onderwerp kan zijn van goederenrechtelijke rechtshandelingen en in
      functioneel opzicht zelfstandig is;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
  - number: 1.n
    text: |-
      woonplaats: door het bevoegde gemeentelijke orgaan als zodanig aangewezen en van een naam voorzien gedeelte van het
      grondgebied van de gemeente.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel1
  - number: '2.1'
    text: Burgemeester en wethouders houden een geautomatiseerde basisregistratie adressen en gebouwen.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel2
  - number: '2.2'
    text: 'De basisregistratie adressen en gebouwen is een registratie van gegevens over de in de gemeente bestaande:'
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel2
  - number: 2.2.a
    text: panden, verblijfsobjecten, standplaatsen, ligplaatsen, woonplaatsen, openbare ruimten en nummeraanduidingen, en
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel2
  - number: 2.2.b
    text: 'situaties van feitelijk gebruik van:'
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel2
  - number: 2.2.b.1°
    text: |-
      een terrein of gedeelte daarvan voor het permanent plaatsen van een niet direct en niet duurzaam met de aarde
      verbonden en voor woon-, bedrijfsmatige, of recreatieve doeleinden geschikte ruimte, niet zijnde een standplaats;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel2
  - number: 2.2.b.2°
    text: |-
      een plaats in het water, al dan niet aangevuld met een op de oever aanwezig terrein of gedeelte daarvan, voor het
      permanent afmeren van een drijvend object, niet zijnde een ligplaats;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel2
  - number: 2.2.b.3°
    text: een benaming van een gedeelte van het grondgebied van de gemeente, niet zijnde een woonplaats;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel2
  - number: 2.2.b.4°
    text: |-
      een benaming van een buitenruimte die binnen één woonplaats of situatie als bedoeld in de aanhef en onder 3° is
      gelegen, niet zijnde een openbare ruimte;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel2
  - number: 2.2.b.5°
    text: |-
      een aanduiding van een verblijfsobject, een standplaats, een ligplaats of een situatie als bedoeld in de aanhef en
      onder 1° of 2°, niet zijnde een nummeraanduiding.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel2
  - number: '3'
    text: |-
      De basisregistratie wordt gehouden met als doel het aan eenieder beschikbaar stellen van de bij of krachtens deze
      wet in de basisregistratie opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel3
  - number: '4.1'
    text: |-
      Ten aanzien van de verwerking van persoonsgegevens ter uitvoering van deze wet zijn burgemeester en wethouders
      respectievelijk is het bestuur van de Dienst, ieder voor zover die verwerking onder hun respectievelijk zijn
      verantwoordelijkheid plaatsvindt, verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel4
  - number: '4.2'
    text: Artikel 15 van de Algemene verordening gegevensbescherming is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel4
  - number: '4.3'
    text: |-
      Gegevens uit de basisregistratie die kunnen worden herleid tot een geïdentificeerde of identificeerbare natuurlijk
      persoon worden niet verstrekt, indien de afnemer die gegevens verwerkt op de grond, genoemd in artikel 6, eerste
      lid, onderdeel b, van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel4
  - number: '5'
    text: |-
      In de basisregistratie gebouwen worden geen gegevens opgenomen met betrekking tot panden, verblijfsobjecten,
      standplaatsen of ligplaatsen die in gebruik zijn bij de krijgsmacht of bij een krijgsmacht van een
      bondgenootschappelijke mogendheid, voor zover tegen het opnemen van die gegevens naar het oordeel van Onze Minister
      van Defensie bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel5
  - number: '6.1'
    text: |-
      De gemeenteraad deelt het grondgebied van de gemeente in een of meer woonplaatsen in, stelt de openbare ruimten
      vast en kent nummeraanduidingen toe aan de op het grondgebied van de gemeente gelegen verblijfsobjecten,
      standplaatsen en ligplaatsen.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel6
  - number: '6.2'
    text: De gemeenteraad stelt de standplaatsen en de ligplaatsen vast.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel6
  - number: '6.3'
    text: De gemeenteraad stelt de afbakening van panden, verblijfsobjecten, standplaatsen en ligplaatsen vast.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel6
  - number: '6.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven ten aanzien van de indeling, de vaststelling en de
      toekenning, bedoeld in het eerste en tweede lid, en kunnen regels worden gegeven ten aanzien van de afbakening,
      bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel6
  - number: '8.1'
    text: |-
      De door burgemeester en wethouders aangewezen ambtenaren die zijn belast met de vaststelling van geometrische
      gegevens van panden en verblijfsobjecten zijn bevoegd, met medeneming van de benodigde apparatuur en andere
      hulpmiddelen, elke plaats te betreden, onverminderd [artikel 2 van de Algemene wet op het binnentreden][ref1],
      en daar waarnemingen of metingen te verrichten, voor zover dat redelijkerwijs nodig is voor de vervulling van hun
      taak.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
  - number: '8.2'
    text: |-
      De eigenaar, de beperkt gerechtigde en de gebruiker van een pand of een verblijfsobject zijn verplicht aan de
      ambtenaren, bedoeld in het eerste lid, binnen de door dezen gestelde redelijke termijn alle medewerking te verlenen
      die dezen redelijkerwijs kunnen vorderen bij de uitoefening van de bevoegdheden, genoemd in het eerste lid, met
      dien verstande dat toegang slechts wordt verleend tussen acht uur ’s morgens en zes uur ’s avonds en dat die niet
      behoeft te worden verleend op zaterdagen, zondagen en algemeen erkende feestdagen.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel8
  - number: '8.3'
    text: |-
      Indien de toegang wordt geweigerd, verschaffen de ambtenaren, bedoeld in het eerste lid, zich zo nodig toegang
      met behulp van de sterke arm. Indien het verrichten van de handelingen, bedoeld in het eerste lid, niet wordt
      toegestaan zijn de ambtenaren, bedoeld in het eerste lid, bevoegd het verrichten van die handelingen zo nodig met
      behulp van de sterke arm mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel8
  - number: '8.4'
    text: |-
      De schade die uit de toepassing van het eerste lid voortvloeit, wordt door burgemeester en wethouders op verzoek
      vergoed. De vordering tot schadevergoeding staat ter kennisneming van de kantonrechter bij de rechtbank van het
      arrondissement waarin de gemeente is gelegen. Tegen de uitspraak staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel8
  - number: '10'
    text: 'Het bijhouden van de basisregistratie vindt plaats op basis van brondocumenten. Als brondocumenten worden gebruikt:'
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel10
  - number: 10.a
    text: bij algemene maatregel van bestuur aangewezen documenten, of
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel10
  - number: 10.b
    text: |-
      door een daartoe aangewezen ambtenaar opgemaakte documenten, in welke vorm dan ook, waarin de constatering is
      vastgelegd van:
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel10
  - number: 10.b.1°
    text: een pand of verblijfsobject, ten aanzien waarvan een krachtens onderdeel a aangewezen brondocument ontbreekt,
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel10
  - number: 10.b.2°
    text: |-
      een situatie als bedoeld in [artikel 2, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '2'
        hoofdstuk: '1'
  - number: '11'
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van het goed functioneren van de basisregistratie nadere
      regels worden gegeven ten aanzien van brondocumenten als bedoeld in [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: '13'
    text: |-
      Een brondocument waaraan een in de basisregistratie opgenomen gegeven is ontleend, wordt door burgemeester en
      wethouders blijvend bewaard.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel13
  - number: '14.1'
    text: |-
      Burgemeester en wethouders dragen zorg voor een goede beschikbaarheid, werking en beveiliging van de
      basisregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel14
  - number: '14.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven omtrent de technische en administratieve inrichting van
      de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel14
  - number: '17.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot het bijhouden van de
      basisregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel17
  - number: '17.2'
    text: |-
      Bij ministeriële regeling wordt voor de basisregistratie een systeembeschrijving vastgelegd, die in ieder geval
      omvat:
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel17
  - number: 17.2.a
    text: |-
      de gegevensdefinities van de in [paragraaf 2][ref1] van dit hoofdstuk bedoelde gegevens en de voor die gegevens
      geldende kwaliteitseisen, en


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0023466
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 17.2.b
    text: |-
      de beschrijving van het koppelvlak met de landelijke voorziening ten behoeve van het elektronisch berichtenverkeer
      met die voorziening.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel17
  - number: '19.1'
    text: |-
      In de basisregistratie worden een identificerend objectnummer, beschrijvende gegevens, temporele gegevens en meta-
      gegevens opgenomen over de in de gemeente bestaande:
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel19
  - number: 19.1.a
    text: panden;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel19
  - number: 19.1.b
    text: verblijfsobjecten;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel19
  - number: 19.1.c
    text: |-
      standplaatsen, alsmede situaties als bedoeld in [artikel 2, tweede lid, onderdeel b, aanhef en onder 1°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '2'
        hoofdstuk: '1'
  - number: 19.1.d
    text: |-
      ligplaatsen, alsmede situaties als bedoeld in [artikel 2, tweede lid, onderdeel b, aanhef en onder 2°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '2'
        hoofdstuk: '1'
  - number: 19.1.e
    text: |-
      woonplaatsen, alsmede situaties als bedoeld in [artikel 2, tweede lid, onderdeel b, aanhef en onder 3°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '2'
        hoofdstuk: '1'
  - number: 19.1.f
    text: |-
      openbare ruimten, alsmede situaties als bedoeld in [artikel 2, tweede lid, onderdeel b, aanhef en onder 4°][ref1],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '2'
        hoofdstuk: '1'
  - number: 19.1.g
    text: |-
      nummeraanduidingen, alsmede situaties als bedoeld in
      [artikel 2, tweede lid, onderdeel b, aanhef en onder 5°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '2'
        hoofdstuk: '1'
  - number: '19.2'
    text: |-
      Met betrekking tot de in het eerste lid bedoelde gegevens en de bepaling daarvan worden bij algemene maatregel van
      bestuur nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel19
  - number: '19.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke van de gegevens, bedoeld in het eerste lid, als authentieke
      gegevens worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel19
  - number: '19.4'
    text: 'Tot de in de aanhef van het eerste lid bedoelde meta-gegevens behoren in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel19
  - number: 19.4.a
    text: |-
      de aanduiding dat opneming in de basisregistratie uitsluitend is gebaseerd op een brondocument als bedoeld in
      [artikel 10, onderdeel b][ref1], indien dat het geval is;


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: 19.4.b
    text: |-
      de aantekening «in onderzoek», indien toepassing is gegeven aan [artikel 39, tweede lid][ref1], of
      [artikel 41, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel41
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '39'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0023466
        artikel: '41'
        hoofdstuk: '6'
  - number: '26'
    text: |-
      De Dienst houdt een geautomatiseerde landelijke voorziening waarin de gegevens uit de in de gemeenten gehouden
      basisregistratie zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel26
  - number: '27'
    text: |-
      Het bestuur van de Dienst draagt er zorg voor dat de weergave van een in de landelijke voorziening opgenomen
      gegeven overeenstemt met het overeenkomstig [artikel 31][ref1] door burgemeester en wethouders verstrekte gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel31
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '28'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gegeven omtrent het beheer, de vorm en de inrichting van de
      landelijke voorziening.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel28
  - number: '29.1'
    text: |-
      De Dienst beheert de landelijke voorziening in overleg met een representatieve vertegenwoordiging van burgemeester
      en wethouders van de gemeenten.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel29
  - number: '29.2'
    text: |-
      Omtrent alle aangelegenheden betreffende het beheer van de basisregistratie voert een representatieve
      vertegenwoordiging van burgemeester en wethouders van de gemeenten overleg met de Dienst.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel29
  - number: '29.3'
    text: De uitkomsten van het overleg, bedoeld in het eerste en tweede lid, worden medegedeeld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel29
  - number: '30.1'
    text: |-
      Omtrent de werking van de landelijke voorziening en andere aangelegenheden betreffende het gebruik van de
      basisregistratie, voeren de Dienst en een representatieve vertegenwoordiging van burgemeester en wethouders van de
      gemeenten overleg met een representatieve vertegenwoordiging van de afnemers.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel30
  - number: '30.2'
    text: De uitkomsten van het overleg, bedoeld in het eerste lid, worden medegedeeld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel30
  - number: '31.1'
    text: |-
      Burgemeester en wethouders verstrekken de in de door hen gehouden basisregistratie opgenomen gegevens dan wel
      een wijziging van die gegevens binnen een werkdag na de verwerking van die gegevens respectievelijk de wijziging
      van die gegevens langs elektronische weg aan de Dienst ten behoeve van opneming van die gegevens in de landelijke
      voorziening.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel31
  - number: '31.2'
    text: |-
      Bij het verstrekken van de gegevens, bedoeld in het eerste lid, nemen burgemeester en wethouders de beschrijving
      van het koppelvlak met de landelijke voorziening, bedoeld in [artikel 17, tweede lid, onderdeel b][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel17
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '32.1'
    text: 'Op verzoek:'
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel32
  - number: 32.1.a
    text: |-
      verlenen burgemeester en wethouders eenieder inzage in de basisregistratie, alsmede verstrekken zij aan eenieder de
      in de basisregistratie opgenomen gegevens;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel32
  - number: 32.1.b
    text: |-
      verleent de Dienst eenieder inzage in de landelijke voorziening en verstrekt de Dienst aan eenieder de daarin
      opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel32
  - number: '32.2'
    text: |-
      [Artikel 10 van de Wet openbaarheid van bestuur][ref1] is van overeenkomstige toepassing op de inzage in en het
      verstrekken van gegevens, bedoeld in het eerste lid, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 32.2.a
    text: |-
      voor zover aan een bestuursorgaan of andere afnemer inzage in de basisregistratie dan wel in de
      landelijke voorziening wordt verleend met behulp van zoekdiensten, uitsluitend de gronden, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________ van overeenkomstige toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 32.2.b
    text: |-
      voor zover aan een bestuursorgaan met het oog op het vervullen van een publiekrechtelijke taak
      die van invloed kan zijn op het milieu inzage in de basisregistratie dan wel in de landelijke
      voorziening wordt verleend met behulp van raadpleegdiensten, of aan dat bestuursorgaan met het
      oog op het vervullen van die taak uit de adressenregistratie of de gebouwenregistratie dan wel
      uit de landelijke voorziening gegevens worden verstrekt, uitsluitend de gronden, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________________________ van overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '32.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter bescherming van de persoonlijke levenssfeer van personen tot wie de
      gegevens die zijn opgenomen in de basisregistratie herleidbaar zijn voor daarbij aangewezen gegevens of categorieën
      van gegevens beperkingen worden vastgesteld ten aanzien van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel32
  - number: '32.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven omtrent de inzage in en het verstrekken van gegevens als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel32
  - number: '34.1'
    text: |-
      Bij ministeriële regeling kunnen tarieven worden vastgesteld voor het verlenen van inzage in de landelijke
      voorziening en het verstrekken van de in de landelijke voorziening opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel34
  - number: '34.2'
    text: 'De tarieven, bedoeld in het eerste lid, kunnen verschillend worden vastgesteld voor:'
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel34
  - number: 34.2.a
    text: verschillende gegevens, en
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel34
  - number: 34.2.b
    text: niet-commercieel en commercieel gebruik van die gegevens.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel34
  - number: '35.1'
    text: |-
      Indien een bestuursorgaan bij het vervullen van zijn publiekrechtelijke taak een gegeven nodig heeft dat krachtens
      deze wet als authentiek gegeven in de basisregistratie beschikbaar is, gebruikt het dat authentieke gegeven.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel35
  - number: '35.2'
    text: |-
      Een bestuursorgaan kan een ander gegeven gebruiken dan een krachtens deze wet beschikbaar authentiek gegeven,
      ingeval:
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel35
  - number: 35.2.a
    text: |-
      bij het desbetreffende authentieke gegeven de aanduiding als bedoeld in [artikel 19, vierde lid, onderdeel a][ref1]
      is geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel19
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 35.2.b
    text: bij het desbetreffende authentieke gegeven de aantekening «in onderzoek» is geplaatst;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel35
  - number: 35.2.c
    text: |-
      het met betrekking tot het desbetreffende authentieke gegeven een melding heeft gedaan als bedoeld in
      [artikel 37][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel37
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '37'
        hoofdstuk: '6'
  - number: 35.2.d
    text: het door toepassing van het eerste lid zijn publiekrechtelijke taak niet naar behoren zou kunnen vervullen, of
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel35
  - number: 35.2.e
    text: bij wettelijk voorschrift anders is bepaald dan in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel35
  - number: '36'
    text: |-
      Degene aan wie door een bestuursorgaan gevraagd wordt om een gegeven te verstrekken dat krachtens deze wet als
      authentiek gegeven in de basisregistratie beschikbaar is, behoeft dat gegeven niet te verstrekken behoudens:
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel36
  - number: 36.a
    text: |-
      ingeval bij het desbetreffende authentieke gegeven de aanduiding als bedoeld in
      [artikel 19, vierde lid, onderdeel a][ref1] is geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel19
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 36.b
    text: ingeval bij het desbetreffende authentieke gegeven de aantekening «in onderzoek» is geplaatst;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel36
  - number: 36.c
    text: |-
      in geval van opsporing of onderzoek naar overtreding van een wettelijk voorschrift of van controle op de naleving
      van een wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel36
  - number: 36.d
    text: |-
      in geval van dreiging van, of het zich voordoen van, een oproerige beweging, wanordelijkheden, verstoring van de
      openbare orde, rampen of zware ongevallen;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel36
  - number: 36.e
    text: ingeval bij wettelijk voorschrift anders is bepaald, of
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel36
  - number: 36.f
    text: ingeval het desbetreffende authentieke gegeven noodzakelijk is voor de identificatie van een object.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel36
  - number: '37.1'
    text: |-
      Een bestuursorgaan dat gegevens uit de basisregistratie van burgemeester en wethouders of uit de landelijke
      voorziening heeft verkregen en gerede twijfel heeft over de juistheid of volledigheid van een in de
      basisregistratie opgenomen authentiek gegeven, doet van de onjuistheid of het ontbreken van een authentiek gegeven
      onder opgaaf van redenen melding aan de Dienst of aan burgemeester en wethouders die de betrokken basisregistratie
      houden. De Dienst stuurt een ontvangen melding binnen één werkdag door aan burgemeester en wethouders die de
      betrokken basisregistratie houden.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel37
  - number: '37.2'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel37
  - number: 37.2.a
    text: de gevallen waarin een melding als bedoeld in het eerste lid niet hoeft te worden gedaan, en
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel37
  - number: 37.2.b
    text: een beperking van de kring van bestuursorganen die verplicht zijn toepassing te geven aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel37
  - number: '38'
    text: |-
      De belanghebbende die gerede twijfel heeft over de juistheid van een in de basisregistratie opgenomen authentiek
      gegeven of het ontbreken van een authentiek gegeven in de basisregistratie kan burgemeester en wethouders onder
      opgaaf van redenen verzoeken dat gegeven te wijzigen respectievelijk op te nemen in de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel38
  - number: '39.1'
    text: |-
      Na ontvangst van een melding als bedoeld in [artikel 37][ref1] of een verzoek als bedoeld in [artikel 38][ref2]
      besluiten burgemeester en wethouders over de wijziging respectievelijk opneming van het desbetreffende authentieke
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel38
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '37'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0023466
        artikel: '38'
        hoofdstuk: '6'
  - number: '39.2'
    text: |-
      Indien burgemeester en wethouders niet binnen een bij algemene maatregel van bestuur te bepalen termijn na
      de melding, bedoeld in [artikel 37][ref1], respectievelijk het verzoek, bedoeld in [artikel 38][ref2], hebben
      besloten over de wijziging respectievelijk opneming van het desbetreffende authentieke gegeven plaatsen zij in de
      basisregistratie bij dat gegeven de aantekening «in onderzoek».


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel38
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '37'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0023466
        artikel: '38'
        hoofdstuk: '6'
  - number: '39.3'
    text: |-
      Burgemeester en wethouders beslissen zo spoedig mogelijk doch niet later dan een bij algemene maatregel van bestuur
      te bepalen termijn na ontvangst van de melding, bedoeld in [artikel 37][ref1], respectievelijk het verzoek, bedoeld
      in [artikel 38][ref2], omtrent wijziging respectievelijk opneming van het desbetreffende authentieke gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel38
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '37'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0023466
        artikel: '38'
        hoofdstuk: '6'
  - number: '40.1'
    text: |-
      Op het moment dat burgemeester en wethouders hebben beslist over de wijziging respectievelijk opneming van het
      desbetreffende authentieke gegeven verwijderen zij de aantekening «in onderzoek» uit de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel40
  - number: '40.2'
    text: |-
      Burgemeester en wethouders maken hun beslissing over wijziging respectievelijk opneming van het desbetreffende
      authentieke gegeven onverwijld bekend aan het bestuursorgaan dat de melding, bedoeld in [artikel 37][ref1], heeft
      gedaan respectievelijk de belanghebbende die het verzoek, bedoeld in [artikel 38][ref2], heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel38
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '37'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0023466
        artikel: '38'
        hoofdstuk: '6'
  - number: '41.1'
    text: |-
      De beslissing van burgemeester en wethouders over wijziging respectievelijk opneming van een gegeven naar
      aanleiding van een verzoek als bedoeld in [artikel 38][ref1] is een besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel38
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '38'
        hoofdstuk: '6'
  - number: '41.2'
    text: |-
      Indien tegen een besluit als bedoeld in het eerste lid bezwaar wordt aangetekend of beroep wordt ingesteld plaatsen
      burgemeester en wethouders in de basisregistratie bij dat gegeven de aantekening «in onderzoek».
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel41
  - number: '41.3'
    text: |-
      Zodra op het bezwaar respectievelijk het beroep onherroepelijk is beslist, wijzigen burgemeester en wethouders
      indien nodig het gegeven respectievelijk nemen zij dat gegeven op en verwijderen zij de aantekening «in onderzoek»
      bij dat gegeven.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel41
  - number: '42.1'
    text: |-
      Burgemeester en wethouders controleren één maal per jaar de inrichting en de werking van de basisregistratie,
      alsmede de verwerking van gegevens in de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel42
  - number: '42.2'
    text: |-
      Burgemeester en wethouders zenden aan Onze Minister een afschrift van de controleresultaten. Onze Minister maakt
      deze controleresultaten openbaar door terinzagelegging daarvan bij het Ministerie van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel42
  - number: '42.3'
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel42
  - number: 42.3.a
    text: worden regels gegeven omtrent de elementen en de wijze van uitvoering van de controle, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel42
  - number: 42.3.b
    text: |-
      kunnen nadere regels worden gegeven omtrent de uitvoering van de verplichting, bedoeld in het tweede lid, eerste
      volzin.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel42
  - number: '46'
    text: |-
      Onze Minister zendt vier jaar na inwerkingtreding van de Wet van 10 februari 2017 tot wijziging van de Wet
      basisregistraties adressen en gebouwen en enige andere wetten in verband met modernisering en vereenvoudiging van
      de registratie en het toezicht (Stb. 2017, 60) aan de Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel46
  - number: '47'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel47
  - number: '48'
    text: 'Deze wet wordt aangehaald als: Wet basisregistratie adressen en gebouwen.'
    url: https://wetten.overheid.nl/BWBR0023466/2018-07-28#Artikel48
