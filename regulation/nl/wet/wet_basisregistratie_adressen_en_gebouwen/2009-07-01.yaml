  - number: 45a.2
    text: |-
      In afwijking van [artikel 16][ref1] vindt verwerking in de adressenregistratie respectievelijk de
      gebouwenregistratie van een gegeven als bedoeld in het eerste lid plaats binnen vier werkdagen na het tijdstip van
      de inwerkingtreding van de [hoofdstukken 2][ref2] en [3][ref3].


