    text: 'De gebouwenregistratie bevat de volgende authentieke gegevens met betrekking tot standplaatsen:'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel24
  - number: 24.1.a
    text: de identificatiecode van de standplaats;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel24
  - number: 24.1.b
    text: |-
      de identificatiecode of de identificatiecodes van de nummeraanduiding respectievelijk de nummeraanduidingen die
      onderdeel is respectievelijk zijn van het aan de standplaats toegekende hoofdadres en de aanwezige nevenadressen;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel24
  - number: 24.1.c
    text: de geometrie van de standplaats, en
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel24
  - number: 24.1.d
    text: een aanduiding waaruit de actuele dan wel de historische status van de standplaats blijkt.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel24
  - number: '24.2'
    text: 'De gebouwenregistratie bevat de volgende niet-authentieke gegevens met betrekking tot standplaatsen:'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel24
  - number: 24.2.a
    text: |-
      de aanduiding dat de opneming in de gebouwenregistratie is gebaseerd op een proces-verbaal als bedoeld in
      [artikel 10, eerste lid, onderdeel b][ref1], indien dit het geval is;


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: 24.2.b
    text: |-
      de aantekening «in onderzoek», indien toepassing is gegeven aan [artikel 39, tweede lid][ref1],
      of [41, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel41
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '39'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0023466
        artikel: '41'
        hoofdstuk: '6'
  - number: 24.2.c
    text: |-
      de ingangsdatum en in voorkomende gevallen de einddatum van de geldigheid van een bepaalde combinatie van gegevens
      over de standplaats, en
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel24
  - number: 24.2.d
    text: |-
      de dagtekening en het inschrijfnummer van het brondocument dat ten grondslag ligt aan de opneming, een wijziging of
      het niet langer geldig zijn van gegevens ten aanzien van de standplaats.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel24
  - number: '25.1'
    text: 'De gebouwenregistratie bevat de volgende authentieke gegevens met betrekking tot ligplaatsen:'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel25
  - number: 25.1.a
    text: de identificatiecode van de ligplaats;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel25
  - number: 25.1.b
    text: |-
      de identificatiecode of de identificatiecodes van de nummeraanduiding respectievelijk de nummeraanduidingen die
      onderdeel is respectievelijk zijn van het aan de ligplaats toegekende hoofdadres en de aanwezige nevenadressen;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel25
  - number: 25.1.c
    text: de geometrie van de ligplaats, en
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel25
  - number: 25.1.d
    text: een aanduiding waaruit de actuele dan wel de historische status van de ligplaats blijkt.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel25
  - number: '25.2'
    text: 'De gebouwenregistratie bevat de volgende niet-authentieke gegevens met betrekking tot ligplaatsen:'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel25
  - number: 25.2.a
    text: |-
      de aanduiding dat de opneming in de gebouwenregistratie is gebaseerd op een proces-verbaal als bedoeld in
      [artikel 10, eerste lid, onderdeel b][ref1], indien dit het geval is;


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: 25.2.b
    text: |-
      de aantekening «in onderzoek», indien toepassing is gegeven aan [artikel 39, tweede lid][ref1],
      of [41, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel41
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '39'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0023466
        artikel: '41'
        hoofdstuk: '6'
  - number: 25.2.c
    text: |-
      de ingangsdatum en in voorkomende gevallen de einddatum van de geldigheid van een bepaalde combinatie van gegevens
      over de ligplaats, en
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel25
  - number: 25.2.d
    text: |-
      de dagtekening en het inschrijfnummer van het brondocument dat ten grondslag ligt aan de opneming, een wijziging of
      het niet langer geldig zijn van gegevens ten aanzien van de ligplaats.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel25
  - number: '26'
    text: |-
      De Dienst houdt een geautomatiseerde landelijke voorziening waarin de gegevens uit de in de gemeenten gehouden
      adressenregistraties en de gebouwenregistraties zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel26
  - number: '27'
    text: |-
      Het bestuur van de Dienst draagt er zorg voor dat de weergave van een in de landelijke voorziening opgenomen
      gegeven overeenstemt met het overeenkomstig [artikel 31][ref1] door burgemeester en wethouders verstrekte gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel31
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '28'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gegeven omtrent het beheer, de vorm en de inrichting van de
      landelijke voorziening.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel28
  - number: '29.1'
    text: |-
      De Dienst beheert de landelijke voorziening in overleg met een representatieve vertegenwoordiging van burgemeester
      en wethouders van de gemeenten.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel29
  - number: '29.2'
    text: |-
      Omtrent alle aangelegenheden betreffende het beheer van de basisregistraties adressen en gebouwen voert een
      representatieve vertegenwoordiging van burgemeester en wethouders van de gemeenten overleg met de Dienst.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel29
  - number: '29.3'
    text: De uitkomsten van het overleg, bedoeld in het eerste en tweede lid, worden medegedeeld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel29
  - number: '30.1'
    text: |-
      Omtrent de werking van de landelijke voorziening en andere aangelegenheden betreffende het gebruik van de
      adressenregistratie en de gebouwenregistratie, voeren de Dienst en een representatieve vertegenwoordiging van
      burgemeester en wethouders van de gemeenten overleg met een representatieve vertegenwoordiging van de afnemers.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel30
  - number: '30.2'
    text: De uitkomsten van het overleg, bedoeld in het eerste lid, worden medegedeeld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel30
  - number: '31.1'
    text: |-
      Burgemeester en wethouders verstrekken in de door hen gehouden adressenregistratie en gebouwenregistratie
      opgenomen gegevens dan wel een wijziging van die gegevens binnen een werkdag na de verwerking van die gegevens
      respectievelijk de wijziging van die gegevens langs elektronische weg aan de Dienst ten behoeve van opneming van
      die gegevens in de landelijke voorziening.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel31
  - number: '31.2'
    text: |-
      Bij het verstrekken van de gegevens, bedoeld in het eerste lid, nemen burgemeester en
      wethouders in acht de beschrijving van het koppelvlak met de landelijke voorziening, bedoeld in
      [artikel 17, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel17
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '32.1'
    text: 'Op verzoek:'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel32
  - number: 32.1.a
    text: |-
      verlenen burgemeester en wethouders eenieder inzage in het adressenregister, het gebouwenregister, de
      adressenregistratie en de gebouwenregistratie, alsmede verstrekken zij aan eenieder de in de adressenregistratie
      respectievelijk de gebouwenregistratie opgenomen gegevens;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel32
  - number: 32.1.b
    text: |-
      verleent de Dienst eenieder inzage in de landelijke voorziening en verstrekt de Dienst aan eenieder de daarin
      opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel32
  - number: '32.2'
    text: |-
      [Artikel 10, eerste en tweede lid, van de Wet openbaarheid van bestuur][ref1] is van overeenkomstige toepassing op
      de inzage in en het verstrekken van gegevens, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '32.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter bescherming van de persoonlijke levenssfeer van personen tot wie de
      gegevens die zijn opgenomen in de basisregistraties, bedoeld in [artikel 2][ref1], herleidbaar zijn voor daarbij
      aangewezen gegevens of categorieën van gegevens beperkingen worden vastgesteld ten aanzien van het bepaalde in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '2'
        hoofdstuk: '1'
  - number: '32.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven omtrent de inzage in en het verstrekken van gegevens als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel32
  - number: '33'
    text: |-
      Bij verstrekking van gegevens als bedoeld in [artikel 32, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel32
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '32'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 33.a
    text: is het auteursrecht voorbehouden, en
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel33
  - number: 33.b
    text: |-
      zijn de rechten, bedoeld in [artikel 2 van de Databankenwet](onbekend), voorbehouden aan burgemeester en wethouders
      onderscheidenlijk de Dienst.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel33
  - number: '34.1'
    text: |-
      Bij ministeriële regeling kunnen tarieven worden vastgesteld voor het verlenen van inzage in de landelijke
      voorziening en het verstrekken van de in de landelijke voorziening opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel34
  - number: '34.2'
    text: 'De tarieven, bedoeld in het eerste lid, kunnen verschillend worden vastgesteld voor:'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel34
  - number: 34.2.a
    text: verschillende gegevens, en
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel34
  - number: 34.2.b
    text: niet-commercieel en commercieel gebruik van die gegevens.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel34
  - number: '37.1'
    text: |-
      Een bestuursorgaan dat gegevens heeft verkregen uit de landelijke voorziening en gerede twijfel heeft over de
      juistheid van een in een adressenregistratie respectievelijk een gebouwenregistratie opgenomen authentiek gegeven
      of het ontbreken van een authentiek gegeven in een adressenregistratie respectievelijk een gebouwenregistratie doet
      daarvan onder opgaaf van redenen melding aan de Dienst. De Dienst stuurt de melding binnen een werkdag door aan
      burgemeester en wethouders die de betrokken registratie houden.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel37
  - number: '37.2'
    text: |-
      Een bestuursorgaan dat gegevens heeft verkregen van burgemeester en wethouders en gerede twijfel heeft over de
      juistheid van een in een adressenregistratie respectievelijk een gebouwenregistratie opgenomen authentiek gegeven,
      of het ontbreken van een authentiek gegeven in een adressenregistratie respectievelijk een gebouwenregistratie,
      doet daarvan onder opgaaf van redenen melding aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel37
  - number: '37.3'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel37
  - number: 37.3.a
    text: de gevallen waarin een melding als bedoeld in het eerste of tweede lid niet hoeft te worden gedaan, en
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel37
  - number: 37.3.b
    text: een beperking van de kring van bestuursorganen die verplicht zijn toepassing te geven aan het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel37
  - number: '38'
    text: |-
      De belanghebbende die gerede twijfel heeft over de juistheid van een in een adressenregistratie respectievelijk
      een gebouwenregistratie opgenomen authentiek gegeven of het ontbreken van een authentiek gegeven in een
      adressenregistratie respectievelijk een gebouwenregistratie kan burgemeester en wethouders onder opgaaf van
      redenen verzoeken dat gegeven te wijzigen respectievelijk op te nemen in de adressenregistratie respectievelijk
      de gebouwenregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel38
  - number: '39.1'
    text: |-
      Na ontvangst van een melding als bedoeld in [artikel 37][ref1] of een verzoek als bedoeld in [artikel 38][ref2]
      besluiten burgemeester en wethouders over de wijziging respectievelijk opneming van het desbetreffende authentieke
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel38
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '37'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0023466
        artikel: '38'
        hoofdstuk: '6'
  - number: '39.2'
    text: |-
      Indien burgemeester en wethouders niet binnen twee werkdagen na de melding, bedoeld in [artikel 37][ref1],
      respectievelijk het verzoek, bedoeld in [artikel 38][ref2], hebben besloten over de wijziging respectievelijk
      opneming van het desbetreffende authentieke gegeven plaatsen zij in de adressenregistratie respectievelijk de
      gebouwenregistratie bij dat gegeven de aantekening «in onderzoek».


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel38
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '37'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0023466
        artikel: '38'
        hoofdstuk: '6'
  - number: '39.3'
    text: |-
      Burgemeester en wethouders onderzoeken het desbetreffende authentieke gegeven en nemen zo spoedig mogelijk doch
      niet later dan zes maanden na ontvangst van de melding, bedoeld in [artikel 37][ref1], respectievelijk het verzoek,
      bedoeld in [artikel 38][ref2], een beslissing omtrent wijziging respectievelijk opneming van het desbetreffende
      authentieke gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel38
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '37'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0023466
        artikel: '38'
        hoofdstuk: '6'
  - number: '40.1'
    text: |-
      Op het moment dat burgemeester en wethouders hebben beslist over de wijziging respectievelijk opneming van het
      desbetreffende authentieke gegeven verwijderen zij de aantekening «in onderzoek» uit de adressenregistratie
      respectievelijk de gebouwenregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel40
  - number: '40.2'
    text: |-
      Burgemeester en wethouders maken hun beslissing over wijziging respectievelijk opneming van het desbetreffende
      authentieke gegeven onverwijld bekend aan het bestuursorgaan dat de melding, bedoeld in [artikel 37][ref1], heeft
      gedaan respectievelijk de belanghebbende die het verzoek, bedoeld in [artikel 38][ref2], heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel38
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '37'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0023466
        artikel: '38'
        hoofdstuk: '6'
  - number: '41.1'
    text: |-
      De beslissing van burgemeester en wethouders over wijziging respectievelijk opneming van een gegeven naar
      aanleiding van een verzoek als bedoeld in [artikel 38][ref1] is een besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel38
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '38'
        hoofdstuk: '6'
  - number: '41.2'
    text: |-
      Indien tegen een besluit als bedoeld in het eerste lid bezwaar wordt aangetekend of beroep wordt ingesteld plaatsen
      burgemeester en wethouders in de adressenregistratie respectievelijk de gebouwenregistratie bij dat gegeven de
      aantekening «in onderzoek».
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel41
  - number: '41.3'
    text: |-
      Zodra op het bezwaar respectievelijk het beroep onherroepelijk is beslist, wijzigen burgemeester en wethouders
      indien nodig het gegeven respectievelijk nemen zij dat gegeven op en verwijderen zij de aantekening «in onderzoek»
      bij dat gegeven.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel41
  - number: '45.1'
    text: |-
      Indien burgemeester en wethouders naar het oordeel van Onze Minister een of meer van hun taken krachtens deze wet
      ernstig verwaarlozen kan Onze Minister de noodzakelijke voorzieningen treffen namens burgemeester en wethouders en
      ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel45
  - number: '45.2'
    text: |-
      De in het eerste lid bedoelde voorzieningen worden, spoedeisende gevallen uitgezonderd, niet getroffen dan nadat
      burgemeester en wethouders in de gelegenheid zijn gesteld om binnen een door Onze Minister te stellen termijn
      alsnog hun taak naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel45
  - number: '45.3'
    text: |-
      Onze Minister stelt beide Kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel45
  - number: 45a.1
    text: |-
      In afwijking van [artikel 12][ref1] vindt inschrijving in het adressenregister respectievelijk het gebouwenregister
      van een krachtens [artikel 10, eerste lid][ref2], aangewezen brondocument, dat dateert van vóór het tijdstip van
      de inwerkingtreding van de [hoofdstukken 2][ref3] en [3][ref4] en de grondslag vormt voor een op dat tijdstip
      geldend gegeven als bedoeld in de [artikelen 19 tot en met 25][ref5], plaats binnen vier werkdagen na dat tijdstip.
      [Artikel 11, eerste lid][ref6], blijft buiten toepassing ten aanzien van een brondocument als in de eerste volzin
      bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel10
