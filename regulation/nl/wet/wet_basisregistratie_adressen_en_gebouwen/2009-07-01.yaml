---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_basisregistratie_adressen_en_gebouwen
regulatory_layer: WET
publication_date: '2009-03-12'
valid_from: '2009-07-01'
bwb_id: BWBR0023466
url: https://wetten.overheid.nl/BWBR0023466/2009-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van een goede vervulling van publiekrechtelijke
    taken wenselijk is om een basisregistratie adressen en een basisregistratie gebouwen tot stand te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
  - number: 1.a
    text: |-
      adres: door het bevoegde gemeentelijke orgaan aan een verblijfsobject, een standplaats of een ligplaats toegekende
      benaming, bestaande uit een combinatie van de naam van een openbare ruimte, een nummeraanduiding en de naam van
      een woonplaats;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
  - number: 1.b
    text: |-
      adressenregister: gemeentelijk register dat brondocumenten met betrekking tot woonplaatsen, openbare
      ruimten, nummeraanduidingen en feitelijk gebruik van een benaming of aanduiding als bedoeld in
      [artikel 10, eerste lid, onderdeel b, onder 1°][ref1], bevat;


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: 1.c
    text: |-
      adressenregistratie: gemeentelijke registratie van alle woonplaatsen, openbare ruimten,
      nummeraanduidingen en feitelijk gebruik van een benaming of aanduiding als bedoeld in
      [artikel 10, eerste lid, onderdeel b, onder 1°][ref1], op het grondgebied van de gemeente;


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: 1.d
    text: |-
      authentiek gegeven: in een basisregistratie opgenomen gegeven dat bij of krachtens de wet als authentiek is
      aangemerkt;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
  - number: 1.e
    text: 'basisregistratie: verzameling gegevens waarvan bij wet is bepaald dat deze een basisregistratie vormt;'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
  - number: 1.f
    text: 'brondocument: document waarin rechtsfeiten en andere voor de registraties relevante feiten zijn neergelegd;'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
  - number: 1.g
    text: |-
      Dienst: Dienst voor het kadaster en de openbare registers, genoemd in
      [artikel 2 van de Organisatiewet Kadaster][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '2'
  - number: 1.h
    text: |-
      gebouwenregister: gemeentelijk register dat brondocumenten met betrekking tot panden, verblijfsobjecten,
      standplaatsen, ligplaatsen en feitelijk gebruik van een terrein of plaats in het water als bedoeld in
      [artikel 10, eerste lid, onderdeel b, onder 2° respectievelijk 3°][ref1], bevat;


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: 1.i
    text: |-
      gebouwenregistratie: gemeentelijke registratie van alle panden, verblijfsobjecten, standplaatsen,
      ligplaatsen en feitelijk gebruik van een terrein of plaats in het water als bedoeld in
      [artikel 10, eerste lid, onderdeel b, onder 2° respectievelijk 3°][ref1], op het grondgebied van de gemeente;


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: 1.j
    text: |-
      landelijke voorziening: landelijke voorziening als bedoeld in [artikel 26][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel26
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 1.k
    text: |-
      ligplaats: door het bevoegde gemeentelijke orgaan als zodanig aangewezen plaats in het water al dan niet aangevuld
      met een op de oever aanwezig terrein of een gedeelte daarvan, die bestemd is voor het permanent afmeren van een
      voor woon-, bedrijfsmatige of recreatieve doeleinden geschikt vaartuig;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
  - number: 1.l
    text: |-
      nummeraanduiding: door het bevoegde gemeentelijke orgaan als zodanig toegekende aanduiding van een verblijfsobject,
      een standplaats of een ligplaats;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
  - number: 1.m
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
  - number: 1.n
    text: |-
      openbare ruimte: door het bevoegde gemeentelijke orgaan als zodanig aangewezen en van een naam voorziene
      buitenruimte die binnen één woonplaats is gelegen;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
  - number: 1.o
    text: |-
      pand: kleinste bij de totstandkoming functioneel en bouwkundig-constructief zelfstandige eenheid die direct en
      duurzaam met de aarde is verbonden en betreedbaar en afsluitbaar is;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
  - number: 1.p
    text: |-
      standplaats: door het bevoegde gemeentelijke orgaan als zodanig aangewezen terrein of gedeelte daarvan dat
      bestemd is voor het permanent plaatsen van een niet direct en niet duurzaam met de aarde verbonden en voor woon-,
      bedrijfsmatige, of recreatieve doeleinden geschikte ruimte;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
  - number: 1.q
    text: |-
      verblijfsobject: kleinste binnen één of meer panden gelegen en voor woon-, bedrijfsmatige, of recreatieve
      doeleinden geschikte eenheid van gebruik die ontsloten wordt via een eigen afsluitbare toegang vanaf de openbare
      weg, een erf of een gedeelde verkeersruimte, onderwerp kan zijn van goederenrechtelijke rechtshandelingen en in
      functioneel opzicht zelfstandig is;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
  - number: 1.r
    text: |-
      woonplaats: door het bevoegde gemeentelijke orgaan als zodanig aangewezen en van een naam voorzien gedeelte van het
      grondgebied van de gemeente.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel1
  - number: '2'
    text: 'Burgemeester en wethouders houden:'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel2
  - number: 2.a
    text: een basisregistratie adressen, bestaande uit een adressenregister en een geautomatiseerde adressenregistratie, en
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel2
  - number: 2.b
    text: een basisregistratie gebouwen, bestaande uit een gebouwenregister en een geautomatiseerde gebouwenregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel2
  - number: '3'
    text: |-
      De basisregistraties, bedoeld in [artikel 2][ref1], worden gehouden met als doel het aan eenieder beschikbaar
      stellen van de bij of krachtens deze wet in die basisregistraties opgenomen gegevens over adressen en gebouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '2'
        hoofdstuk: '1'
  - number: '4.1'
    text: |-
      Ten aanzien van de verwerking van persoonsgegevens ter uitvoering van deze wet zijn burgemeester
      en wethouders respectievelijk is het bestuur van de Dienst, ieder voor zover die verwerking
      onder hun respectievelijk zijn verantwoordelijkheid plaatsvindt, verantwoordelijke in de zin van
      [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: '4.2'
    text: |-
      [Artikel 35 van de Wet bescherming persoonsgegevens][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel35
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '35'
  - number: '4.3'
    text: |-
      Gegevens uit de basisregistraties, bedoeld in [artikel 2][ref1], die kunnen worden herleid tot een geïdentificeerde
      of identificeerbare natuurlijk persoon worden slechts verstrekt indien dit voortvloeit uit het doel, genoemd
      in [artikel 3][ref2], en de afnemer bevoegd is die gegevens te verwerken op één van de gronden, genoemd in
      [artikel 8, onderdelen a en c tot en met f, van de Wet bescherming persoonsgegevens][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel8
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0023466
        artikel: '3'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '8'
  - number: '5'
    text: |-
      In de basisregistratie gebouwen worden geen gegevens opgenomen met betrekking tot panden, verblijfsobjecten,
      standplaatsen of ligplaatsen die in gebruik zijn bij de krijgsmacht of bij een krijgsmacht van een
      bondgenootschappelijke mogendheid, voor zover tegen het opnemen van die gegevens naar het oordeel van Onze Minister
      van Defensie bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel5
  - number: '6.1'
    text: |-
      De gemeenteraad deelt het grondgebied van de gemeente in een of meer woonplaatsen in, stelt de openbare ruimten
      vast en kent nummeraanduidingen toe aan de op het grondgebied van de gemeente gelegen verblijfsobjecten,
      standplaatsen en ligplaatsen.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel6
  - number: '6.2'
    text: De gemeenteraad stelt de standplaatsen en de ligplaatsen vast.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel6
  - number: '6.3'
    text: De gemeenteraad stelt de afbakening van panden, verblijfsobjecten, standplaatsen en ligplaatsen vast.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel6
  - number: '6.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven ten aanzien van de indeling, de vaststelling en de
      toekenning, bedoeld in het eerste en tweede lid, en kunnen regels worden gegeven ten aanzien van de afbakening,
      bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel6
  - number: 6a
    text: |-
      Burgemeester en wethouders dragen er in het belang van een goede registratie zorg voor dat van elke feitelijke
      situatie waarvan een krachtens [artikel 10][ref1] aangewezen brondocument kan worden opgemaakt dat een constatering
      of verklaring van een daartoe aangewezen ambtenaar behelst, een zodanig brondocument wordt opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: '7'
    text: |-
      Burgemeester en wethouders dragen er zorg voor dat de definitieve geometrie van panden en verblijfsobjecten binnen
      zes maanden nadat het pand respectievelijk het verblijfsobject gereed is gekomen dan wel een wijziging daarvan is
      gerealiseerd beschikbaar is en in de gebouwenregistratie is opgenomen.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel7
  - number: '8.1'
    text: |-
      De door burgemeester en wethouders aangewezen ambtenaren die zijn belast met de vaststelling van de geometrie,
      bedoeld in [artikel 7][ref1], zijn bevoegd, met medeneming van de benodigde apparatuur en andere hulpmiddelen, elke
      plaats te betreden, onverminderd [artikel 2 van de Algemene wet op het binnentreden][ref2], en daar waarnemingen of
      metingen te verrichten, voor zover dat redelijkerwijs nodig is voor de vervulling van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '7'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '2'
  - number: '8.2'
    text: |-
      De eigenaar, de beperkt gerechtigde en de gebruiker van een pand of een verblijfsobject zijn verplicht aan de
      ambtenaren, bedoeld in het eerste lid, binnen de door dezen gestelde redelijke termijn alle medewerking te verlenen
      die dezen redelijkerwijs kunnen vorderen bij de uitoefening van de bevoegdheden, genoemd in het eerste lid, met
      dien verstande dat toegang slechts wordt verleend tussen acht uur ’s morgens en zes uur ’s avonds en dat die niet
      behoeft te worden verleend op zaterdagen, zondagen en algemeen erkende feestdagen.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel8
  - number: '8.3'
    text: |-
      Indien de toegang wordt geweigerd, verschaffen de ambtenaren, bedoeld in het eerste lid, zich zo nodig toegang
      met behulp van de sterke arm. Indien het verrichten van de handelingen, bedoeld in het eerste lid, niet wordt
      toegestaan zijn de ambtenaren, bedoeld in het eerste lid, bevoegd het verrichten van die handelingen zo nodig met
      behulp van de sterke arm mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel8
  - number: '8.4'
    text: |-
      De schade die uit de toepassing van het eerste lid voortvloeit, wordt door burgemeester en wethouders op verzoek
      vergoed. De vordering tot schadevergoeding staat ter kennisneming van de kantonrechter bij de rechtbank van het
      arrondissement waarin de gemeente is gelegen. Tegen de uitspraak staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel8
  - number: '9.1'
    text: |-
      Burgemeester en wethouders dragen er zorg voor dat het adressenregister en het gebouwenregister zodanig worden
      opgezet dat de inhoud daarvan duurzaam kan worden bewaard en te allen tijde binnen een redelijke termijn
      raadpleegbaar en beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel9
  - number: '9.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven omtrent de administratieve inrichting van het
      adressenregister en het gebouwenregister.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel9
  - number: '10.1'
    text: 'In het adressenregister respectievelijk het gebouwenregister worden als brondocument ingeschreven:'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel10
  - number: 10.1.a
    text: bij algemene maatregel van bestuur aan te wijzen documenten;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel10
  - number: 10.1.b
    text: 'een door een daartoe aangewezen ambtenaar opgemaakt proces-verbaal van constatering van:'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel10
  - number: 10.1.b.1°
    text: |-
      een feitelijk gebruik van een benaming of aanduiding van een woonplaats, openbare ruimte of verblijfsobject, niet
      zijnde een adres of deel van een adres in de zin van deze wet;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel10
  - number: 10.1.b.2°
    text: |-
      een feitelijk gebruik van een terrein of gedeelte daarvan voor het permanent plaatsen van een niet direct en niet
      duurzaam met de aarde verbonden en voor woon-, bedrijfsmatige, of recreatieve doeleinden geschikte ruimte, niet
      zijnde een standplaats in de zin van deze wet;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel10
  - number: 10.1.b.3°
    text: |-
      een feitelijk gebruik van een plaats in het water, al dan niet aangevuld met een op de oever aanwezig terrein of
      gedeelte daarvan, voor het permanent afmeren van een vaartuig, niet zijnde een ligplaats in de zin van deze wet;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel10
  - number: 10.1.b.4°
    text: een pand, ten aanzien waarvan een krachtens onderdeel a aangewezen brondocument ontbreekt;
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel10
  - number: 10.1.b.5°
    text: |-
      een verblijfsobject, of zodanig gebruik van een ruimte dat deze feitelijk met een verblijfsobject kan worden
      gelijkgesteld, ten aanzien waarvan een krachtens onderdeel a aangewezen brondocument ontbreekt.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel10
  - number: '10.2'
    text: |-
      Burgemeester en wethouders dragen zorg voor de inschrijving in het adressenregister respectievelijk het
      gebouwenregister van de in het eerste lid genoemde brondocumenten.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel10
  - number: '11.1'
    text: |-
      Een krachtens [artikel 10][ref1] aangewezen brondocument dat in het adressenregister respectievelijk het
      gebouwenregister wordt ingeschreven vermeldt in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: 11.1.a
    text: een aanduiding van de rechtsgrond waarop het is gebaseerd, en
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel11
  - number: 11.1.b
    text: |-
      de data, bedoeld in [artikel 12, onderdeel a of c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel12
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '12'
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van het goed functioneren van de adressenregistratie
      respectievelijk de gebouwenregistratie nadere regels worden gegeven ten aanzien van krachtens [artikel 10][ref1]
      aangewezen brondocumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: '12'
    text: |-
      Inschrijving van een krachtens [artikel 10][ref1] aangewezen brondocument in het adressenregister respectievelijk
      het gebouwenregister vindt plaats binnen vier werkdagen na:


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: 12.a
    text: de dagtekening van het in dat brondocument opgenomen besluit,
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel12
  - number: 12.b
    text: de dag waarop de in dat brondocument opgenomen uitspraak onherroepelijk is geworden, of
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel12
  - number: 12.c
    text: de dagtekening van het brondocument indien dat brondocument geen besluit of uitspraak bevat.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel12
  - number: '13'
    text: |-
      Een krachtens [artikel 10][ref1] aangewezen brondocument dat is ingeschreven, wordt niet uit het adressenregister
      respectievelijk het gebouwenregister verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: '14.1'
    text: |-
      Burgemeester en wethouders dragen zorg voor een goede beschikbaarheid, werking en beveiliging van de
      adressenregistratie respectievelijk de gebouwenregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel14
  - number: '14.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven omtrent de technische en administratieve inrichting van de
      adressenregistratie en de gebouwenregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel14
  - number: 14a
    text: |-
      Burgemeester en wethouders dragen zorg voor de verwerking van de gegevens opgenomen in een in het adressenregister
      of het gebouwenregister ingeschreven brondocument in de adressenregistratie respectievelijk de gebouwenregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel14a
  - number: '15'
    text: |-
      Burgemeester en wethouders dragen er zorg voor dat de weergave van een krachtens deze wet in de adressenregistratie
      respectievelijk de gebouwenregistratie opgenomen authentiek gegeven overeenstemt met dat gegeven als opgenomen in
      het desbetreffende in het adressenregister respectievelijk het gebouwenregister ingeschreven brondocument.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel15
  - number: '16'
    text: |-
      Verwerking van de gegevens opgenomen in een in het adressenregister respectievelijk het gebouwenregister
      ingeschreven brondocument in de adressenregistratie respectievelijk de gebouwenregistratie vindt plaats binnen vier
      werkdagen na:
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel16
  - number: 16.a
    text: de dagtekening van het in dat brondocument opgenomen besluit,
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel16
  - number: 16.b
    text: de dag waarop de in dat brondocument opgenomen uitspraak onherroepelijk is geworden, of
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel16
  - number: 16.c
    text: de dagtekening van het brondocument indien dat brondocument geen besluit of uitspraak bevat.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel16
  - number: '17.1'
    text: 'Bij algemene maatregel van bestuur kunnen:'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel17
  - number: 17.1.a
    text: |-
      andere dan de in deze wet genoemde niet-authentieke gegevens worden aangewezen die in de adressenregistratie
      respectievelijk de gebouwenregistratie worden opgenomen, en
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel17
  - number: 17.1.b
    text: regels worden gegeven met betrekking tot de bijhouding van de adressenregistratie en de gebouwenregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel17
  - number: '17.2'
    text: |-
      Bij ministeriële regeling wordt voor de adressenregistratie en de gebouwenregistratie een systeembeschrijving
      vastgelegd, die in ieder geval omvat:
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel17
  - number: 17.2.a
    text: |-
      de gegevensdefinities van de in [paragraaf 2][ref1] en [3][ref2] van dit hoofdstuk genoemde gegevens, en


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0023466
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0023466
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 17.2.b
    text: |-
      de beschrijving van het koppelvlak met de landelijke voorziening ten behoeve van het elektronisch berichtenverkeer
      met die voorziening.
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel17
  - number: '19.1'
    text: 'De adressenregistratie bevat de volgende authentieke gegevens met betrekking tot woonplaatsen:'
    url: https://wetten.overheid.nl/BWBR0023466/2009-07-01#Artikel19
