  - number: '46'
    text: |-
      Onze Minister zendt steeds na vier jaar aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten
      van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel46
  - number: '47'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel47
