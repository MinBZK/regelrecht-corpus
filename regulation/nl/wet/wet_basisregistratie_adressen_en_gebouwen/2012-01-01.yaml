        artikel: '38'
        hoofdstuk: '6'
  - number: '42'
    text: |-
      1 Burgemeester en wethouders laten eens per drie jaar de uitvoering van het bij of krachtens deze wet bepaalde
      controleren door een bedrijf dat voldoet aan de eisen, bedoeld in het vierde lid, onderdeel c.

      2 Burgemeester en wethouders zenden aan Onze Minister een afschrift van de controleresultaten. Onze Minister maakt
      deze controleresultaten openbaar door terinzagelegging daarvan bij het Ministerie van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer.

      3 Bij algemene maatregel van bestuur worden regels gegeven omtrent de elementen van de controle, bedoeld in het
      eerste lid.

      4 Bij ministeriële regeling:

      a. worden regels gegeven omtrent de wijze van uitvoering van de controle, bedoeld in het eerste lid;

      b. wordt bepaald welke kosten van die controle aan de betrokken gemeente worden vergoed;

      c. worden eisen gesteld aan de bedrijven die in aanmerking komen om die controle te verrichten, en

      d. kunnen eisen worden gesteld omtrent de uitvoering van de verplichting, bedoeld in het tweede lid, eerste volzin.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel42
  - number: '43'
    text: |-
      1 Indien uit de controle, bedoeld in [artikel 42, eerste lid][ref1], blijkt dat niet wordt voldaan aan het bij of
      krachtens deze wet bepaalde, dragen burgemeester en wethouders er zorg voor om daaraan alsnog te voldoen en laten
      zij binnen een jaar een hernieuwde controle uitvoeren op die onderdelen die bij de eerste controle niet voldeden.
      Artikel 42, tweede lid, is van overeenkomstige toepassing.

      2 De kosten van een hernieuwde controle als bedoeld in het eerste lid worden niet vergoed aan de betrokken
      gemeente.

      3 Bij ministeriële regeling worden regels gegeven omtrent de wijze van uitvoering van de hernieuwde controle,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel42
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '42'
        hoofdstuk: '7'
  - number: '44'
    text: |-
      De bedrijven die voldoen aan de eisen, bedoeld in [artikel 42, vierde lid, onderdeel c][ref1], hebben ten behoeve
      van een controle als bedoeld in artikel 42, eerste lid, respectievelijk [artikel 43, eerste lid][ref2], toegang
      tot de registers en de registraties, bedoeld in [artikel 2][ref3]. Burgemeester en wethouders verlenen hiertoe de
      nodige medewerking.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0023466#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel44
