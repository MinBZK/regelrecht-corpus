      - id: ref2
        bwb_id: BWBR0023466
        artikel: '38'
        hoofdstuk: '6'
  - number: '41'
    text: |-
      1 De beslissing van burgemeester en wethouders over wijziging respectievelijk opneming van een gegeven naar
      aanleiding van een verzoek als bedoeld in [artikel 38][ref1] is een besluit.

      2 Indien tegen een besluit als bedoeld in het eerste lid bezwaar wordt aangetekend of beroep wordt ingesteld
      plaatsen burgemeester en wethouders in de adressenregistratie respectievelijk de gebouwenregistratie bij dat
      gegeven de aantekening «in onderzoek».

      3 Zodra op het bezwaar respectievelijk het beroep onherroepelijk is beslist, wijzigen burgemeester en wethouders
      indien nodig het gegeven respectievelijk nemen zij dat gegeven op en verwijderen zij de aantekening «in onderzoek»
      bij dat gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel38
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel41
