  - number: '9'
    text: |-
      1 Burgemeester en wethouders dragen er zorg voor dat het adressenregister en het gebouwenregister zodanig
      worden opgezet dat de inhoud daarvan duurzaam kan worden bewaard en te allen tijde binnen een redelijke termijn
      raadpleegbaar en beschikbaar is.

      2 Bij ministeriële regeling kunnen regels worden gegeven omtrent de administratieve inrichting van het
      adressenregister en het gebouwenregister.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel9
  - number: '10'
    text: |-
      1 In het adressenregister respectievelijk het gebouwenregister worden als brondocument ingeschreven:

      a. bij algemene maatregel van bestuur aan te wijzen documenten;

      b. een door een daartoe aangewezen ambtenaar opgemaakt proces-verbaal van constatering van:

      1°. een feitelijk gebruik van een benaming of aanduiding van een woonplaats, openbare ruimte of verblijfsobject,
      niet zijnde een adres of deel van een adres in de zin van deze wet;

      2°. een feitelijk gebruik van een terrein of gedeelte daarvan voor het permanent plaatsen van een niet direct en
      niet duurzaam met de aarde verbonden en voor woon-, bedrijfsmatige, of recreatieve doeleinden geschikte ruimte,
      niet zijnde een standplaats in de zin van deze wet;

      3°. een feitelijk gebruik van een plaats in het water, al dan niet aangevuld met een op de oever aanwezig terrein
      of gedeelte daarvan, voor het permanent afmeren van een vaartuig, niet zijnde een ligplaats in de zin van deze wet;

      4°. een pand, ten aanzien waarvan een krachtens onderdeel a aangewezen brondocument ontbreekt;

      5°. een verblijfsobject, of zodanig gebruik van een ruimte dat deze feitelijk met een verblijfsobject kan worden
      gelijkgesteld, ten aanzien waarvan een krachtens onderdeel a aangewezen brondocument ontbreekt.

      2 Burgemeester en wethouders dragen zorg voor de inschrijving in het adressenregister respectievelijk het
      gebouwenregister van de in het eerste lid genoemde brondocumenten.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel10
  - number: '11'
    text: |-
      1 Een krachtens [artikel 10][ref1] aangewezen brondocument dat in het adressenregister respectievelijk het
      gebouwenregister wordt ingeschreven vermeldt in ieder geval:

      a. een aanduiding van de rechtsgrond waarop het is gebaseerd, en

      b. de data, bedoeld in [artikel 12, onderdeel a of c][ref2].

      2 Bij algemene maatregel van bestuur kunnen in het belang van het goed functioneren van de adressenregistratie
      respectievelijk de gebouwenregistratie nadere regels worden gegeven ten aanzien van krachtens [artikel 10][ref3]
      aangewezen brondocumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel11
