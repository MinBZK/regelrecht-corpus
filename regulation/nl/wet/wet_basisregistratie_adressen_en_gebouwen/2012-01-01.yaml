        artikel: '2'
        hoofdstuk: '1'
  - number: '45'
    text: |-
      1 Indien burgemeester en wethouders naar het oordeel van Onze Minister een of meer van hun taken krachtens deze wet
      ernstig verwaarlozen kan Onze Minister de noodzakelijke voorzieningen treffen namens burgemeester en wethouders en
      ten laste van de gemeente.

      2 De in het eerste lid bedoelde voorzieningen worden, spoedeisende gevallen uitgezonderd, niet getroffen dan nadat
      burgemeester en wethouders in de gelegenheid zijn gesteld om binnen een door Onze Minister te stellen termijn
      alsnog hun taak naar behoren uit te voeren.

      3 Onze Minister stelt beide Kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel45
  - number: 45a
    text: |-
      1 In afwijking van [artikel 12][ref1] vindt inschrijving in het adressenregister respectievelijk het
      gebouwenregister van een krachtens [artikel 10, eerste lid][ref2], aangewezen brondocument, dat dateert van vóór
      het tijdstip van de inwerkingtreding van de [hoofdstukken 2][ref3] en [3][ref4] en de grondslag vormt voor een op
      dat tijdstip geldend gegeven als bedoeld in de [artikelen 19 tot en met 25][ref5], plaats binnen vier werkdagen na
      dat tijdstip. [Artikel 11, eerste lid][ref6], blijft buiten toepassing ten aanzien van een brondocument als in de
      eerste volzin bedoeld.

      2 In afwijking van [artikel 16][ref7] vindt verwerking in de adressenregistratie respectievelijk de
      gebouwenregistratie van een gegeven als bedoeld in het eerste lid plaats binnen vier werkdagen na het tijdstip van
      de inwerkingtreding van de [hoofdstukken 2][ref8] en [3][ref9].


