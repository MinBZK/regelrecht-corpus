  - number: 45b
    text: |-
      Indien voor een op het tijdstip van de inwerkingtreding van de [hoofdstukken 2][ref1] en [3][ref2] geldend
      gegeven als bedoeld in de [artikelen 19 tot en met 25][ref3] geen krachtens [artikel 10, eerste lid][ref4],
      aangewezen brondocument beschikbaar is, dan wel een dergelijk brondocument slechts met een onevenredige
      inspanning beschikbaar kan worden gesteld, schrijven burgemeester en wethouders in plaats daarvan binnen de in
      [artikel 45a, eerste lid, eerste volzin][ref5], gestelde termijn in het adressenregister respectievelijk het
      gebouwenregister als brondocument in een schriftelijke verklaring van burgemeester en wethouders waarin het
      desbetreffende gegeven wordt vermeld. [Artikel 13][ref6] is op dit brondocument van overeenkomstige toepassing.


