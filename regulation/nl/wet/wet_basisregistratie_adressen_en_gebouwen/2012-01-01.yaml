  - number: '19'
    text: |-
      1 De adressenregistratie bevat de volgende authentieke gegevens met betrekking tot woonplaatsen:

      a. de identificatiecode van de woonplaats, zoals opgenomen in de landelijke woonplaatsentabel;

      b. de naam van de woonplaats zoals opgenomen in het desbetreffende brondocument;

      c. de geometrie van de woonplaats, en

      d. een aanduiding waaruit de actuele dan wel de historische status van de woonplaats blijkt.

      2 De adressenregistratie bevat de volgende niet-authentieke gegevens met betrekking tot woonplaatsen:

      a. de aanduiding dat de opneming in de adressenregistratie is gebaseerd op een proces-verbaal als bedoeld in
      [artikel 10, eerste lid, onderdeel b][ref1], indien dit het geval is;

      b. de aantekening «in onderzoek», indien toepassing is gegeven aan [artikel 39, tweede lid][ref2],
      of [41, tweede lid][ref3];

      c. de ingangsdatum en in voorkomende gevallen de einddatum van de geldigheid van een bepaalde combinatie van
      gegevens over de woonplaats, en

      d. de dagtekening en het inschrijfnummer van het brondocument dat ten grondslag ligt aan de opneming, een wijziging
      of het niet langer geldig zijn van gegevens ten aanzien van de woonplaats.

      3 Bij algemene maatregel van bestuur worden regels gegeven met betrekking tot de landelijke woonplaatsentabel,
      bedoeld in het eerste lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
