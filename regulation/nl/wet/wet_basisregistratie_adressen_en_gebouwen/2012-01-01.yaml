  - number: '26'
    text: |-
      De Dienst houdt een geautomatiseerde landelijke voorziening waarin de gegevens uit de in de gemeenten gehouden
      adressenregistraties en de gebouwenregistraties zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel26
  - number: '27'
    text: |-
      Het bestuur van de Dienst draagt er zorg voor dat de weergave van een in de landelijke voorziening opgenomen
      gegeven overeenstemt met het overeenkomstig [artikel 31][ref1] door burgemeester en wethouders verstrekte gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel31
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '28'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gegeven omtrent het beheer, de vorm en de inrichting van de
      landelijke voorziening.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel28
  - number: '29'
    text: |-
      1 De Dienst beheert de landelijke voorziening in overleg met een representatieve vertegenwoordiging van
      burgemeester en wethouders van de gemeenten.

      2 Omtrent alle aangelegenheden betreffende het beheer van de basisregistraties adressen en gebouwen voert een
      representatieve vertegenwoordiging van burgemeester en wethouders van de gemeenten overleg met de Dienst.

      3 De uitkomsten van het overleg, bedoeld in het eerste en tweede lid, worden medegedeeld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel29
  - number: '30'
    text: |-
      1 Omtrent de werking van de landelijke voorziening en andere aangelegenheden betreffende het gebruik van de
      adressenregistratie en de gebouwenregistratie, voeren de Dienst en een representatieve vertegenwoordiging van
      burgemeester en wethouders van de gemeenten overleg met een representatieve vertegenwoordiging van de afnemers.

      2 De uitkomsten van het overleg, bedoeld in het eerste lid, worden medegedeeld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel30
  - number: '31'
    text: |-
      1 Burgemeester en wethouders verstrekken in de door hen gehouden adressenregistratie en gebouwenregistratie
      opgenomen gegevens dan wel een wijziging van die gegevens binnen een werkdag na de verwerking van die gegevens
      respectievelijk de wijziging van die gegevens langs elektronische weg aan de Dienst ten behoeve van opneming van
      die gegevens in de landelijke voorziening.

      2 Bij het verstrekken van de gegevens, bedoeld in het eerste lid, nemen burgemeester en
      wethouders in acht de beschrijving van het koppelvlak met de landelijke voorziening, bedoeld in
      [artikel 17, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel17
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '32'
    text: |-
      1 Op verzoek:

      a. verlenen burgemeester en wethouders eenieder inzage in het adressenregister, het gebouwenregister, de
      adressenregistratie en de gebouwenregistratie, alsmede verstrekken zij aan eenieder de in de adressenregistratie
      respectievelijk de gebouwenregistratie opgenomen gegevens;

      b. verleent de Dienst eenieder inzage in de landelijke voorziening en verstrekt de Dienst aan eenieder de daarin
      opgenomen gegevens.

      2 [Artikel 10 van de Wet openbaarheid van bestuur][ref1] is van overeenkomstige toepassing op de inzage in en het
      verstrekken van gegevens, bedoeld in het eerste lid, met dien verstande dat:

      a. voor zover aan een bestuursorgaan of andere afnemer inzage in de adressenregistratie of de gebouwenregistratie
      dan wel in de landelijke voorziening wordt verleend met behulp van zoekdiensten, uitsluitend de gronden, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________ van overeenkomstige toepassing zijn;

      b. voor zover aan een bestuursorgaan met het oog op het vervullen van een publiekrechtelijke taak die
      van invloed kan zijn op het milieu inzage in de adressenregistratie of de gebouwenregistratie dan wel
      in de landelijke voorziening wordt verleend met behulp van raadpleegdiensten, of aan dat bestuursorgaan
      met het oog op het vervullen van die taak uit de adressenregistratie of de gebouwenregistratie dan
      wel uit de landelijke voorziening gegevens worden verstrekt, uitsluitend de gronden, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________________________ van overeenkomstige toepassing zijn.

      3 Bij algemene maatregel van bestuur kunnen ter bescherming van de persoonlijke levenssfeer van personen tot wie
      de gegevens die zijn opgenomen in de basisregistraties, bedoeld in [artikel 2][ref4], herleidbaar zijn voor daarbij
      aangewezen gegevens of categorieën van gegevens beperkingen worden vastgesteld ten aanzien van het bepaalde in het
      eerste lid.

      4 Bij ministeriële regeling kunnen regels worden gegeven omtrent de inzage in en het verstrekken van gegevens als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0023466#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0023466
        artikel: '2'
        hoofdstuk: '1'
  - number: '33'
    text: |-
      Bij verstrekking van gegevens als bedoeld in [artikel 32, eerste lid][ref1]:

      a. is het auteursrecht voorbehouden, en

      b. zijn de rechten, bedoeld in [artikel 2 van de Databankenwet](onbekend), voorbehouden aan burgemeester en
      wethouders onderscheidenlijk de Dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel32
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '32'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '34'
    text: |-
      1 Bij ministeriële regeling kunnen tarieven worden vastgesteld voor het verlenen van inzage in de landelijke
      voorziening en het verstrekken van de in de landelijke voorziening opgenomen gegevens.

      2 De tarieven, bedoeld in het eerste lid, kunnen verschillend worden vastgesteld voor:

      a. verschillende gegevens, en

      b. niet-commercieel en commercieel gebruik van die gegevens.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel34
  - number: '35'
    text: |-
      1 Indien een bestuursorgaan bij het vervullen van zijn publiekrechtelijke taak een gegeven nodig heeft dat
      krachtens deze wet als authentiek gegeven in de adressenregistratie respectievelijk de gebouwenregistratie
      beschikbaar is, gebruikt het dat authentieke gegeven.

      2 Een bestuursorgaan kan een ander gegeven gebruiken dan een krachtens deze wet beschikbaar authentiek gegeven,
      ingeval:

      a. bij het desbetreffende authentieke gegeven de aanduiding is geplaatst dat de opneming is gebaseerd op een
      proces-verbaal als bedoeld in [artikel 10, eerste lid, onderdeel b][ref1];

      b. bij het desbetreffende authentieke gegeven de aantekening «in onderzoek» is geplaatst;

      c. het met betrekking tot het desbetreffende authentieke gegeven een melding heeft gedaan als bedoeld in
      [artikel 37][ref2];

      d. het door toepassing van het eerste lid zijn publiekrechtelijke taak niet naar behoren zou kunnen vervullen, of

      e. bij wettelijk voorschrift anders is bepaald dan in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel37
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023466
        artikel: '37'
        hoofdstuk: '6'
  - number: '36'
    text: |-
      Degene aan wie door een bestuursorgaan gevraagd wordt om een gegeven te verstrekken dat krachtens deze wet als
      authentiek gegeven in de adressenregistratie respectievelijk de gebouwenregistratie beschikbaar is, behoeft dat
      gegeven niet te verstrekken behoudens:

      a. ingeval bij het desbetreffende authentieke gegeven de aanduiding is geplaatst dat de opneming is gebaseerd op
      een proces-verbaal als bedoeld in [artikel 10, eerste lid, onderdeel b][ref1];

      b. ingeval bij het desbetreffende authentieke gegeven de aantekening «in onderzoek» is geplaatst;

      c. in geval van opsporing of onderzoek naar overtreding van een wettelijk voorschrift of van controle op de
      naleving van een wettelijk voorschrift;

      d. in geval van dreiging van, of het zich voordoen van, een oproerige beweging, wanordelijkheden, verstoring van de
      openbare orde, rampen of zware ongevallen;

      e. ingeval bij wettelijk voorschrift anders is bepaald, of

      f. ingeval het desbetreffende authentieke gegeven noodzakelijk is voor de identificatie van een object.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: '37'
    text: |-
      1 Een bestuursorgaan dat gegevens heeft verkregen uit de landelijke voorziening en gerede twijfel heeft over de
      juistheid van een in een adressenregistratie respectievelijk een gebouwenregistratie opgenomen authentiek gegeven
      of het ontbreken van een authentiek gegeven in een adressenregistratie respectievelijk een gebouwenregistratie doet
      daarvan onder opgaaf van redenen melding aan de Dienst. De Dienst stuurt de melding binnen een werkdag door aan
      burgemeester en wethouders die de betrokken registratie houden.

      2 Een bestuursorgaan dat gegevens heeft verkregen van burgemeester en wethouders en gerede twijfel heeft over de
      juistheid van een in een adressenregistratie respectievelijk een gebouwenregistratie opgenomen authentiek gegeven,
      of het ontbreken van een authentiek gegeven in een adressenregistratie respectievelijk een gebouwenregistratie,
      doet daarvan onder opgaaf van redenen melding aan burgemeester en wethouders.

      3 Bij algemene maatregel van bestuur kunnen regels worden gegeven omtrent:

      a. de gevallen waarin een melding als bedoeld in het eerste of tweede lid niet hoeft te worden gedaan, en

      b. een beperking van de kring van bestuursorganen die verplicht zijn toepassing te geven aan het eerste of tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel37
  - number: '38'
    text: |-
      De belanghebbende die gerede twijfel heeft over de juistheid van een in een adressenregistratie respectievelijk
      een gebouwenregistratie opgenomen authentiek gegeven of het ontbreken van een authentiek gegeven in een
      adressenregistratie respectievelijk een gebouwenregistratie kan burgemeester en wethouders onder opgaaf van
      redenen verzoeken dat gegeven te wijzigen respectievelijk op te nemen in de adressenregistratie respectievelijk
      de gebouwenregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel38
  - number: '39'
    text: |-
      1 Na ontvangst van een melding als bedoeld in [artikel 37][ref1] of een verzoek als bedoeld in [artikel 38][ref2]
      besluiten burgemeester en wethouders over de wijziging respectievelijk opneming van het desbetreffende authentieke
      gegeven.

      2 Indien burgemeester en wethouders niet binnen twee werkdagen na de melding, bedoeld in [artikel 37][ref3],
      respectievelijk het verzoek, bedoeld in [artikel 38][ref4], hebben besloten over de wijziging respectievelijk
      opneming van het desbetreffende authentieke gegeven plaatsen zij in de adressenregistratie respectievelijk de
      gebouwenregistratie bij dat gegeven de aantekening «in onderzoek».

      3 Burgemeester en wethouders onderzoeken het desbetreffende authentieke gegeven en nemen zo spoedig mogelijk doch
      niet later dan zes maanden na ontvangst van de melding, bedoeld in [artikel 37][ref5], respectievelijk het verzoek,
      bedoeld in [artikel 38][ref6], een beslissing omtrent wijziging respectievelijk opneming van het desbetreffende
      authentieke gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel38
