      1 De adressenregistratie bevat de volgende authentieke gegevens met betrekking tot nummeraanduidingen:

      a. de identificatiecode van de nummeraanduiding;

      b. de identificatiecode van de openbare ruimte waaraan de nummeraanduiding is gerelateerd;

      c. de identificatiecode van de woonplaats, zoals opgenomen in de landelijke woonplaatsentabel, waarbinnen het
      object waaraan de nummeraanduiding is toegekend gelegen is indien die woonplaats afwijkt van de woonplaats
      waarbinnen de openbare ruimte waaraan de nummeraanduiding is gerelateerd gelegen is;

      d. het huisnummer;

      e. de huisletter;

      f. de huisnummertoevoeging;

      g. het type object waaraan een nummeraanduiding is toegekend, en

      h. een aanduiding waaruit de actuele dan wel de historische status van de nummeraanduiding blijkt.

      2 De adressenregistratie bevat de volgende niet-authentieke gegevens met betrekking tot nummeraanduidingen:

      a. de postcode;

      b. de aanduiding dat de opneming in de adressenregistratie is gebaseerd op een proces-verbaal als bedoeld in
      [artikel 10, eerste lid, onderdeel b][ref1], indien dit het geval is;

      c. de aantekening «in onderzoek», indien toepassing is gegeven aan [artikel 39, tweede lid][ref2],
      of [41, tweede lid][ref3];

      d. de ingangsdatum en in voorkomende gevallen de einddatum van de geldigheid van een bepaalde combinatie van
      gegevens over de nummeraanduiding, en

      e. de dagtekening en het inschrijfnummer van het brondocument dat ten grondslag ligt aan de opneming, een wijziging
      of het niet langer geldig zijn van gegevens ten aanzien van de nummeraanduiding.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel39
