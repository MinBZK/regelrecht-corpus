preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van een goede vervulling van publiekrechtelijke
    taken wenselijk is om een basisregistratie adressen en een basisregistratie gebouwen tot stand te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. adres: door het bevoegde gemeentelijke orgaan aan een verblijfsobject, een standplaats of een ligplaats
      toegekende benaming, bestaande uit een combinatie van de naam van een openbare ruimte, een nummeraanduiding en de
      naam van een woonplaats;

      b. adressenregister: gemeentelijk register dat brondocumenten met betrekking tot woonplaatsen,
      openbare ruimten, nummeraanduidingen en feitelijk gebruik van een benaming of aanduiding als bedoeld in
      [artikel 10, eerste lid, onderdeel b, onder 1°][ref1], bevat;

      c. adressenregistratie: gemeentelijke registratie van alle woonplaatsen, openbare ruimten,
      nummeraanduidingen en feitelijk gebruik van een benaming of aanduiding als bedoeld in
      [artikel 10, eerste lid, onderdeel b, onder 1°][ref2], op het grondgebied van de gemeente;

      d. authentiek gegeven: in een basisregistratie opgenomen gegeven dat bij of krachtens de wet als authentiek is
      aangemerkt;

      e. basisregistratie: verzameling gegevens waarvan bij wet is bepaald dat deze een basisregistratie vormt;

      f. brondocument: document waarin rechtsfeiten en andere voor de registraties relevante feiten zijn neergelegd;

      g. Dienst: Dienst voor het kadaster en de openbare registers, genoemd in
      [artikel 2 van de Organisatiewet Kadaster][ref3];

      h. gebouwenregister: gemeentelijk register dat brondocumenten met betrekking tot panden, verblijfsobjecten,
      standplaatsen, ligplaatsen en feitelijk gebruik van een terrein of plaats in het water als bedoeld in
      [artikel 10, eerste lid, onderdeel b, onder 2° respectievelijk 3°][ref4], bevat;

      i. gebouwenregistratie: gemeentelijke registratie van alle panden, verblijfsobjecten, standplaatsen,
      ligplaatsen en feitelijk gebruik van een terrein of plaats in het water als bedoeld in
      [artikel 10, eerste lid, onderdeel b, onder 2° respectievelijk 3°][ref5], op het grondgebied van de gemeente;

      j. landelijke voorziening: landelijke voorziening als bedoeld in [artikel 26][ref6];

      k. ligplaats: door het bevoegde gemeentelijke orgaan als zodanig aangewezen plaats in het water al dan niet
      aangevuld met een op de oever aanwezig terrein of een gedeelte daarvan, die bestemd is voor het permanent afmeren
      van een voor woon-, bedrijfsmatige of recreatieve doeleinden geschikt vaartuig;

      l. nummeraanduiding: door het bevoegde gemeentelijke orgaan als zodanig toegekende aanduiding van een
      verblijfsobject, een standplaats of een ligplaats;

      m. Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      n. openbare ruimte: door het bevoegde gemeentelijke orgaan als zodanig aangewezen en van een naam voorziene
      buitenruimte die binnen één woonplaats is gelegen;

      o. pand: kleinste bij de totstandkoming functioneel en bouwkundig-constructief zelfstandige eenheid die direct en
      duurzaam met de aarde is verbonden en betreedbaar en afsluitbaar is;

      p. standplaats: door het bevoegde gemeentelijke orgaan als zodanig aangewezen terrein of gedeelte daarvan dat
      bestemd is voor het permanent plaatsen van een niet direct en niet duurzaam met de aarde verbonden en voor woon-,
      bedrijfsmatige, of recreatieve doeleinden geschikte ruimte;

      q. verblijfsobject: kleinste binnen één of meer panden gelegen en voor woon-, bedrijfsmatige, of recreatieve
      doeleinden geschikte eenheid van gebruik die ontsloten wordt via een eigen afsluitbare toegang vanaf de openbare
      weg, een erf of een gedeelde verkeersruimte, onderwerp kan zijn van goederenrechtelijke rechtshandelingen en in
      functioneel opzicht zelfstandig is;

      r. woonplaats: door het bevoegde gemeentelijke orgaan als zodanig aangewezen en van een naam voorzien gedeelte van
      het grondgebied van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
