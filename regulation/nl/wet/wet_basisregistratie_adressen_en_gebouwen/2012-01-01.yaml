  - number: '5'
    text: |-
      In de basisregistratie gebouwen worden geen gegevens opgenomen met betrekking tot panden, verblijfsobjecten,
      standplaatsen of ligplaatsen die in gebruik zijn bij de krijgsmacht of bij een krijgsmacht van een
      bondgenootschappelijke mogendheid, voor zover tegen het opnemen van die gegevens naar het oordeel van Onze Minister
      van Defensie bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel5
  - number: '6'
    text: |-
      1 De gemeenteraad deelt het grondgebied van de gemeente in een of meer woonplaatsen in, stelt de openbare
      ruimten vast en kent nummeraanduidingen toe aan de op het grondgebied van de gemeente gelegen verblijfsobjecten,
      standplaatsen en ligplaatsen.

      2 De gemeenteraad stelt de standplaatsen en de ligplaatsen vast.

      3 De gemeenteraad stelt de afbakening van panden, verblijfsobjecten, standplaatsen en ligplaatsen vast.

      4 Bij algemene maatregel van bestuur worden regels gegeven ten aanzien van de indeling, de vaststelling en de
      toekenning, bedoeld in het eerste en tweede lid, en kunnen regels worden gegeven ten aanzien van de afbakening,
      bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel6
  - number: 6a
    text: |-
      Burgemeester en wethouders dragen er in het belang van een goede registratie zorg voor dat van elke feitelijke
      situatie waarvan een krachtens [artikel 10][ref1] aangewezen brondocument kan worden opgemaakt dat een constatering
      of verklaring van een daartoe aangewezen ambtenaar behelst, een zodanig brondocument wordt opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: '7'
    text: |-
      Burgemeester en wethouders dragen er zorg voor dat de definitieve geometrie van panden en verblijfsobjecten binnen
      zes maanden nadat het pand respectievelijk het verblijfsobject gereed is gekomen dan wel een wijziging daarvan is
      gerealiseerd beschikbaar is en in de gebouwenregistratie is opgenomen.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel7
  - number: '8'
    text: |-
      1 De door burgemeester en wethouders aangewezen ambtenaren die zijn belast met de vaststelling van de geometrie,
      bedoeld in [artikel 7][ref1], zijn bevoegd, met medeneming van de benodigde apparatuur en andere hulpmiddelen, elke
      plaats te betreden, onverminderd [artikel 2 van de Algemene wet op het binnentreden][ref2], en daar waarnemingen of
      metingen te verrichten, voor zover dat redelijkerwijs nodig is voor de vervulling van hun taak.

      2 De eigenaar, de beperkt gerechtigde en de gebruiker van een pand of een verblijfsobject zijn verplicht aan de
      ambtenaren, bedoeld in het eerste lid, binnen de door dezen gestelde redelijke termijn alle medewerking te verlenen
      die dezen redelijkerwijs kunnen vorderen bij de uitoefening van de bevoegdheden, genoemd in het eerste lid, met
      dien verstande dat toegang slechts wordt verleend tussen acht uur ’s morgens en zes uur ’s avonds en dat die niet
      behoeft te worden verleend op zaterdagen, zondagen en algemeen erkende feestdagen.

      3 Indien de toegang wordt geweigerd, verschaffen de ambtenaren, bedoeld in het eerste lid, zich zo nodig toegang
      met behulp van de sterke arm. Indien het verrichten van de handelingen, bedoeld in het eerste lid, niet wordt
      toegestaan zijn de ambtenaren, bedoeld in het eerste lid, bevoegd het verrichten van die handelingen zo nodig met
      behulp van de sterke arm mogelijk te maken.

      4 De schade die uit de toepassing van het eerste lid voortvloeit, wordt door burgemeester en wethouders op verzoek
      vergoed. De vordering tot schadevergoeding staat ter kennisneming van de kantonrechter bij de rechtbank van het
      arrondissement waarin de gemeente is gelegen. Tegen de uitspraak staat geen rechtsmiddel open.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel8
    references:
