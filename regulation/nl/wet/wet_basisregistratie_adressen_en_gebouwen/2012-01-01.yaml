  - number: '40'
    text: |-
      1 Op het moment dat burgemeester en wethouders hebben beslist over de wijziging respectievelijk opneming van
      het desbetreffende authentieke gegeven verwijderen zij de aantekening «in onderzoek» uit de adressenregistratie
      respectievelijk de gebouwenregistratie.

      2 Burgemeester en wethouders maken hun beslissing over wijziging respectievelijk opneming van het desbetreffende
      authentieke gegeven onverwijld bekend aan het bestuursorgaan dat de melding, bedoeld in [artikel 37][ref1], heeft
      gedaan respectievelijk de belanghebbende die het verzoek, bedoeld in [artikel 38][ref2], heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Artikel38
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel40
