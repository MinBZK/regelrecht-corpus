  - number: '12'
    text: |-
      Inschrijving van een krachtens [artikel 10][ref1] aangewezen brondocument in het adressenregister respectievelijk
      het gebouwenregister vindt plaats binnen vier werkdagen na:

      a. de dagtekening van het in dat brondocument opgenomen besluit,

      b. de dag waarop de in dat brondocument opgenomen uitspraak onherroepelijk is geworden, of

      c. de dagtekening van het brondocument indien dat brondocument geen besluit of uitspraak bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: '13'
    text: |-
      Een krachtens [artikel 10][ref1] aangewezen brondocument dat is ingeschreven, wordt niet uit het adressenregister
      respectievelijk het gebouwenregister verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel10
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '10'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      1 Burgemeester en wethouders dragen zorg voor een goede beschikbaarheid, werking en beveiliging van de
      adressenregistratie respectievelijk de gebouwenregistratie.

      2 Bij ministeriële regeling kunnen regels worden gegeven omtrent de technische en administratieve inrichting van de
      adressenregistratie en de gebouwenregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel14
  - number: 14a
    text: |-
      Burgemeester en wethouders dragen zorg voor de verwerking van de gegevens opgenomen in een in het adressenregister
      of het gebouwenregister ingeschreven brondocument in de adressenregistratie respectievelijk de gebouwenregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel14a
  - number: '15'
    text: |-
      Burgemeester en wethouders dragen er zorg voor dat de weergave van een krachtens deze wet in de adressenregistratie
      respectievelijk de gebouwenregistratie opgenomen authentiek gegeven overeenstemt met dat gegeven als opgenomen in
      het desbetreffende in het adressenregister respectievelijk het gebouwenregister ingeschreven brondocument.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel15
  - number: '16'
    text: |-
      Verwerking van de gegevens opgenomen in een in het adressenregister respectievelijk het gebouwenregister
      ingeschreven brondocument in de adressenregistratie respectievelijk de gebouwenregistratie vindt plaats binnen vier
      werkdagen na:

      a. de dagtekening van het in dat brondocument opgenomen besluit,

      b. de dag waarop de in dat brondocument opgenomen uitspraak onherroepelijk is geworden, of

      c. de dagtekening van het brondocument indien dat brondocument geen besluit of uitspraak bevat.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel16
  - number: '17'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen:

      a. andere dan de in deze wet genoemde niet-authentieke gegevens worden aangewezen die in de adressenregistratie
      respectievelijk de gebouwenregistratie worden opgenomen, en

      b. regels worden gegeven met betrekking tot de bijhouding van de adressenregistratie en de gebouwenregistratie.

      2 Bij ministeriële regeling wordt voor de adressenregistratie en de gebouwenregistratie een systeembeschrijving
      vastgelegd, die in ieder geval omvat:

      a. de gegevensdefinities van de in [paragraaf 2][ref1] en [3][ref2] van dit hoofdstuk genoemde gegevens, en

      b. de beschrijving van het koppelvlak met de landelijke voorziening ten behoeve van het elektronisch
      berichtenverkeer met die voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0023466#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel17
