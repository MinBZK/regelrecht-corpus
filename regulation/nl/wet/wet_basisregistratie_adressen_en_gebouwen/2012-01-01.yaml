  - number: '2'
    text: |-
      Burgemeester en wethouders houden:

      a. een basisregistratie adressen, bestaande uit een adressenregister en een geautomatiseerde adressenregistratie,
      en

      b. een basisregistratie gebouwen, bestaande uit een gebouwenregister en een geautomatiseerde gebouwenregistratie.
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel2
  - number: '3'
    text: |-
      De basisregistraties, bedoeld in [artikel 2][ref1], worden gehouden met als doel het aan eenieder beschikbaar
      stellen van de bij of krachtens deze wet in die basisregistraties opgenomen gegevens over adressen en gebouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel2
    url: https://wetten.overheid.nl/BWBR0023466/2012-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '2'
        hoofdstuk: '1'
  - number: '4'
    text: |-
      1 Ten aanzien van de verwerking van persoonsgegevens ter uitvoering van deze wet zijn burgemeester
      en wethouders respectievelijk is het bestuur van de Dienst, ieder voor zover die verwerking
      onder hun respectievelijk zijn verantwoordelijkheid plaatsvindt, verantwoordelijke in de zin van
      [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1].

      2 [Artikel 35 van de Wet bescherming persoonsgegevens][ref2] is niet van toepassing.

      3 Gegevens uit de basisregistraties, bedoeld in [artikel 2][ref3], die kunnen worden herleid tot een
      geïdentificeerde of identificeerbare natuurlijk persoon worden slechts verstrekt indien dit voortvloeit uit het
      doel, genoemd in [artikel 3][ref4], en de afnemer bevoegd is die gegevens te verwerken op één van de gronden,
      genoemd in [artikel 8, onderdelen a en c tot en met f, van de Wet bescherming persoonsgegevens][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
