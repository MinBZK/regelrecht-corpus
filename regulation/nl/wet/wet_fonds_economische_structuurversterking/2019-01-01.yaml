---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_fonds_economische_structuurversterking
regulatory_layer: WET
publication_date: '2017-04-07'
valid_from: '2019-01-01'
bwb_id: BWBR0007788
url: https://wetten.overheid.nl/BWBR0007788/2019-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter financiering van investeringsprojecten van
    nationaal belang waarmee beoogd wordt de economische structuur te versterken, een begrotingsfonds in te stellen,
    waarin een deel van de aardgasbaten afzonderlijk zal worden beheerd, en dat op grond van artikel 2 van de
    Comptabiliteitswet (Stb. 1992, 351) de instelling van een begrotingsfonds bij de wet dient te geschieden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Er is een Fonds economische structuurversterking, hierna te noemen: het fonds.'
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel1
  - number: '1.2'
    text: |-
      Het fonds is een begrotingsfonds als bedoeld in [artikel 2.11, eerste lid, van de Comptabiliteitswet 2016][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
  - number: '1.3'
    text: Onze Ministers van Economische Zaken en Klimaat en van Financiën beheren de begroting van het fonds.
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel1
  - number: '2.1'
    text: 'De ontvangsten van het fonds worden gevormd door:'
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.1.a
    text: 41,5 procent van de niet-belastingontvangsten van de staat, verkregen uit de winning van koolwaterstoffen;
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.1.b
    text: |-
      het bedrag dat overeenkomt met de rentelasten die bespaard worden als gevolg van het in mindering brengen op de
      staatsschuld van de in het derde lid omschreven opbrengsten;
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.1.c
    text: |-
      inkomsten van de staat voortvloeiend uit of verbandhoudend met de aanleg of de exploitatie van de Betuweroute en de
      HSL-Zuid, tot ten hoogste het nominale bedrag uit het Fes dat is besteed voor de voorfinanciering van de geraamde
      private bijdragen in de aanleg;
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.1.d
    text: |-
      andere door Onze Minister van Economische Zaken en Klimaat in overeenstemming met Onze Minister van Financiën voor
      het fonds te bestemmen inkomsten van de staat voortvloeiend uit of verbandhoudend met de aanleg of de exploitatie
      van de Betuweroute en de HSL-Zuid;
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.1.e
    text: andere voor het fonds te bestemmen ontvangsten uit de winning van koolwaterstoffen;
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.1.f
    text: |-
      het bedrag dat overeenkomt met de annuïteiten op basis van de opbrengsten van de hierna te noemen geveilde rechten,
      met een looptijd die overeenkomt met de voorziene looptijd van die rechten:
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.1.f.1°
    text: |-
      de verlening van het recht om bepaalde etherfrequenties te gebruiken, alsmede de verlening van het recht op het
      gebruik van analoge en digitale radio- en televisiefrequenties;
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.1.f.2°
    text: de verlening in het jaar 2000 van het recht om UMTS-frequenties te gebruiken.
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: '2.2'
    text: |-
      Onder ontvangsten als bedoeld in het eerste lid, onder a, worden niet verstaan de ontvangsten van Energie Beheer
      Nederland B.V., meerjarige stand Miljoenennota 2002, voortkomend uit de verwerving van de certificaten Energie
      Beheer Nederland B.V.
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: '2.3'
    text: 'Opbrengsten als bedoeld in het eerste lid, onder b, zijn:'
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.3.a
    text: |-
      ontvangsten van de staat, verkregen in verband met de overbelevering van aardgas door de Nederlandse Aardolie
      Maatschappij b.v. aan Brigitta Erdgas und Erdöl GmbH uit aardgaswinning in de Eemsmonding,
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.3.b
    text: de opbrengsten van vervreemding van staatsdeelnemingen,
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.3.c
    text: |-
      andere nader aan te wijzen ontvangsten uit het vervreemden van materiële en immateriële activa en rechten van de
      staat.
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: '2.4'
    text: 'Onder ontvangsten als bedoeld in het derde lid worden niet verstaan:'
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.4.a
    text: de opbrengst van de verkoop van het Nederlands Omroepproduktiebedrijf n.v.;
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.4.b
    text: de opbrengst van de verkoop van de aandelen in Netherlands Car b.v.;
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.4.c
    text: |-
      de opbrengst van de verkoop van Roccade Informatica Groep n.v. voor zover deze het bedrag van € 181 512 086,44
      niet overstijgt;
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: 2.4.d
    text: de opbrengst van de verkoop van aandelen die zijn verkregen bij wijze van dividend.
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: '2.5'
    text: |-
      Bij de berekening van de te besparen rentelasten, bedoeld in het eerste lid, onder b, wordt uitgegaan van het
      rendement op langlopende staatsobligaties op de dag waarop de opbrengst wordt bijgeschreven op een rekening van
      het Rijk.
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: '2.6'
    text: |-
      Bij de berekening van de te besparen rentelasten ten gevolge van het in mindering brengen op de staatsschuld van
      een opbrengst als bedoeld in het derde lid, onder b, worden afgetrokken de dividendinkomsten die genoten zouden
      worden indien de vervreemding of ontvangst niet zou hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: '2.7'
    text: |-
      Indien opbrengsten als bedoeld in het eerste lid, onder e, als tijdelijke voorziening in het fonds zijn gestort in
      verband met vertraging in de in het eerste lid, onder b, bedoelde ontvangsten, kunnen deze bedragen op de in het
      eerste lid, onder b, bedoelde ontvangsten door Onze Minister van Economische Zaken en Klimaat in overeenstemming
      met Onze Minister van Financiën in mindering worden gebracht.
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel2
  - number: '3.1'
    text: |-
      Ten laste van het fonds kunnen bijdragen worden toegekend aan andere begrotingen van het Rijk als bedoeld in
      [artikel 2.1, eerste lid, van de Comptabiliteitswet 2016][ref1] ten behoeve van de financiering van:


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
  - number: 3.1.a
    text: |-
      investeringsprojecten van nationaal belang waarmee beoogd wordt de economische structuur te versterken, voorzover
      betrekking hebbend op:
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel3
  - number: 3.1.a.1°
    text: de verkeers- en vervoersinfrastructuur met inbegrip van kosten die samenhangen met milieumaatregelen;
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel3
  - number: 3.1.a.2°
    text: de technologie-, telecommunicatie- en kennisinfrastructuur;
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel3
  - number: 3.1.a.3°
    text: |-
      bodemsanering, voor zover verband houdend met de projecten genoemd onder 1° of met bouwprojecten in de
      binnensteden;
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel3
  - number: 3.1.a.4°
    text: |-
      de stedelijke hoofdstructuur, voor zover die samenhangt met en functioneel een relatie heeft met de projecten
      genoemd onder 1°;
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel3
  - number: 3.1.a.5°
    text: de ecologische hoofdstructuur, voor zover een functionele relatie bestaat met projecten genoemd onder 1°;
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel3
  - number: 3.1.b
    text: |-
      de projecten in het kader van de investeringsimpuls, zoals bedoeld in de Voorjaarsnota 1993 (Kamerstukken II
      1992/93, 23 100, nr. 1).
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel3
  - number: '3.2'
    text: Aan de toekenning van een bijdrage kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel3
  - number: '4.1'
    text: |-
      Ten laste van het fonds kunnen in de begroting niet meer uitgaven worden geraamd dan het totaal van de
      geraamde ontvangsten, inclusief het gerealiseerde batig saldo van het fonds van het voorafgaande jaar,
      verminderd met 10 procent van de bij de ontwerp-begroting voor dat jaar geraamde ontvangsten als bedoeld in
      [artikel 2, eerste lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007788#Artikel2
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007788
        artikel: '2'
  - number: '4.2'
    text: |-
      In afwijking van [artikel 2.13, eerste lid, van de Comptabiliteitswet 2016][ref1] worden de begroting en de
      financiële verantwoording van het fonds op basis van het kasstelsel, bedoeld in [artikel 1.1 van die wet][ref2],
      gepresenteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel1
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '1'
  - number: 4a.1
    text: Voor het fonds kan worden afgezien van het indienen van een voorstel van wet tot vaststelling van de begroting.
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel4a
  - number: 4a.2
    text: |-
      Indien in enig begrotingsjaar geen voorstel als bedoeld in het eerste lid wordt ingediend, worden, in afwijking
      van de [artikelen 2][ref1] en [3][ref2] de ontvangsten, respectievelijk de uitgaven, van het fonds voor dat
      begrotingsjaar op nihil gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007788#Artikel3
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0007788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007788
        artikel: '3'
  - number: 4a.3
    text: Dit artikel vervalt op het moment dat een voorstel als bedoeld in het eerste lid wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel4a
  - number: '5'
    text: |-
      Onze Minister van Economische Zaken en Klimaat kan in overeenstemming met Onze Minister van Financiën regels
      stellen met betrekking tot de voorwaarden waaronder de bijdragen betaalbaar worden gesteld, alsmede met betrekking
      tot de informatieverstrekking over de besteding van de verkregen bijdragen.
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel5
  - number: 5a.1
    text: |-
      In afwijking van [artikel 2, eerste lid, onderdeel a][ref1], wordt met betrekking tot het jaar 2007 een percentage
      van 40,9 toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007788#Artikel2
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0007788
        artikel: '2'
  - number: 5a.2
    text: |-
      In afwijking van [artikel 2, tweede lid][ref1], worden met betrekking tot het jaar 2007 de ontvangsten van Energie
      Beheer Nederland B.V. onder de ontvangsten als bedoeld in [artikel 2, eerste lid, onderdeel a][ref2], verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007788#Artikel2
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0007788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007788
        artikel: '2'
  - number: 5a.3
    text: |-
      Met betrekking tot het jaar 2007 worden de ontvangsten van het fonds, bedoeld in
      [artikel 2, eerste lid, aanhef][ref1], verminderd met € 1 000 000 000.


      [ref1]: https://wetten.overheid.nl/BWBR0007788#Artikel2
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0007788
        artikel: '2'
  - number: 5a.4
    text: |-
      Met betrekking tot het jaar 2009 worden de ontvangsten van het fonds, bedoeld in
      [artikel 2, eerste lid, aanhef][ref1], vermeerderd met € 1 000 000 000 vermeerderd met rente.


      [ref1]: https://wetten.overheid.nl/BWBR0007788#Artikel2
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0007788
        artikel: '2'
  - number: '6'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag na de datum van uitgifte van het *Staatsblad* waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 1993.
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel6
  - number: '7'
    text: 'Deze wet kan worden aangehaald als: Wet Fonds economische structuurversterking.'
    url: https://wetten.overheid.nl/BWBR0007788/2019-01-01#Artikel7
