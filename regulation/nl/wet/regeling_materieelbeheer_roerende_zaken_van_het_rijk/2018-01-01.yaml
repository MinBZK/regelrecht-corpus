regulatory_layer: WET
publication_date: '2017-12-04'
valid_from: '2018-01-01'
bwb_id: BWBR0040285
url: https://wetten.overheid.nl/BWBR0040285/2018-01-01
preamble:
  text: |-
    Gelet op artikel 4.20, tweede lid, aanhef en onder c en d, van de Comptabiliteitswet 2016;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *Domeinen Roerende Zaken:* het dienstonderdeel van het Ministerie van
      Financiën dat belast is met het beheren van overtollige roerende zaken van het Rijk en van derde partijen in beslag
      genomen roerende zaken;
        - *Minister:* de Minister die het aangaat;
        - *overtollige roerende zaken:* roerende zaken die niet voor de bedrijfsvoering nodig zijn;
        - *roerende zaken:* stoffelijke zaken die niet aard- en nagelvast zijn verbonden aan een onroerende zaak als
      bedoeld in [artikel 3 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel3
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '3'
  - number: '1.2'
    text: |-
      De begrippen van [artikel 1.1 van de Comptabiliteitswet 2016][ref1] zijn van overeenkomstige toepassing op deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel1
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '1'
  - number: '1.3'
    text: 'Deze regeling is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel1
  - number: 1.3.a
    text: de archieven van het Rijk;
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel1
  - number: 1.3.b
    text: |-
      het beheer van rijkscollectie, bedoeld in
      [hoofdstuk 2, van de Regeling beheer rijkscollectie en subsidiering museale instellingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037533#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0037533
        hoofdstuk: '2'
  - number: '2.1'
    text: De Minister of het college draagt zorg voor een deugdelijk beheer en gebruik van de roerende zaken.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel2
  - number: '2.2'
    text: |-
      De Minister of het college stelt voor het materieelbeheer van roerende zaken die hij beheert of gebruikt een
      risicoanalyse op en neemt indien noodzakelijk maatregelen ter voorkoming of beperking van de geschatte risico’s.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel2
  - number: '3.1'
    text: |-
      De Minister of het college houdt een adequate administratie bij van het gevoerde materieelbeheer van de roerende
      zaken.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel3
  - number: '3.2'
    text: |-
      De Minister of het college draagt zorg voor een administratieve organisatie waarin is voorzien in voldoende
      functiescheiding voor het materieelbeheer van de roerende zaken.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel3
  - number: '4.1'
    text: |-
      De Minister of het college neemt over roerende zaken die niet nodig zijn voor het beleid en bedrijfsvoering van het
      ministerie, respectievelijk de bedrijfsvoering van het college zo spoedig mogelijk een besluit tot het overtollig
      stellen.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel4
  - number: '4.2'
    text: |-
      De Minister of het college informeert Domeinen Roerende Zaken binnen één maand over een besluit tot het
      overtolligstellen van de roerende zaak.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel4
  - number: '4.3'
    text: |-
      Indien een besluit van de Minister of het college, als bedoeld in het eerste lid, en het informeren van Domeinen
      Roerende Zaken, als bedoeld in het tweede lid, na één maand uitblijft, kan Domeinen Roerende Zaken de roerende zaak
      in beheer nemen.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel4
  - number: '4.4'
    text: |-
      Roerende zaken die door een rechterlijke uitspraak aan de Staat zijn toegevallen, behoeven geen overtolligstelling.
      Deze roerende zaken komen zonder overtolligstelling in beheer bij Domeinen Roerende Zaken.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel4
  - number: '5.1'
    text: |-
      De Minister of het college draagt het beheer van de roerende zaken die overtollig zijn gesteld over aan Domeinen
      Roerende Zaken op een door Domeinen Roerende Zaken aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel5
  - number: '5.2'
    text: De overdracht van het beheer aan Domeinen Roerende Zaken geschiedt na acceptatie door Domeinen Roerende Zaken.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel5
  - number: '5.3'
    text: |-
      De Minister of het college maakt bij de overdracht afspraken met Domeinen Roerende Zaken over een verrekening van
      de middelen of bijdrage.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel5
  - number: '6.1'
    text: |-
      Domeinen Roerende Zaken draagt met betrekking tot de overgedragen overtollige en de aan de Staat toegevallen
      roerende zaken zorg voor:
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel6
  - number: 6.1.a
    text: het verkopen of verhuren aan een derde;
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel6
  - number: 6.1.b
    text: het in beheer geven aan een minister of een college;
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel6
  - number: 6.1.c
    text: het vernietigen.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel6
  - number: '6.2'
    text: |-
      In afwijking van het eerste lid kan Domeinen Roerende Zaken toestemming verlenen dat de verhuur of verkoop door
      de Minister of het college zelf of namens de Minister of het college door derden plaatsvindt. Aan die toestemming
      kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel6
  - number: '6.3'
    text: |-
      De verkoop, verhuur aan derden geschiedt tegen marktconforme prijzen, tenzij in overeenstemming met Domeinen
      Roerende Zaken anders wordt overeengekomen.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel6
  - number: '6.4'
    text: |-
      Domeinen Roerende Zaken kan de kosten van de verkoop of, verhuur geheel of gedeeltelijk aan de Minister of het
      college in rekening brengen, indien Domeinen Roerende Zaken die kosten niet kan dekken uit de opbrengst van de
      verkoop of verhuur. Domeinen Roerende Zaken deelt dit zo spoedig mogelijk mee aan de Minister of het college.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel6
  - number: '6.5'
    text: |-
      Domeinen Roerende Zaken vernietigt namens de Minister of het college de roerende zaken die niet zijn verkocht,
      verhuurd, of in beheer zijn gegeven aan een minister of een college.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel6
  - number: '6.6'
    text: |-
      In afwijking van het vijfde lid kan Domeinen Roerende Zaken toestemming verlenen dat de roerende zaken die niet
      zijn verkocht, verhuurd of in beheer zijn gegeven, door de Minister of het college zelf worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel6
  - number: '7.1'
    text: |-
      De Minister of het college kan de overtollig gestelde roerende zaken inruilen of schenken met toestemming van
      Domeinen Roerende Zaken.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel7
  - number: '7.2'
    text: |-
      Domeinen Roerende Zaken beoordeelt bij het inruilen de vergelijkbaarheid en de marktconformiteit van de waarde
      van de overtollige roerende zaak. Bij schenking beoordeelt Domeinen Roerende Zaken de waarde van de overtollige
      roerende zaak.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het inruilen geschiedt tegen marktconforme prijzen, tenzij in overeenstemming met Domeinen Roerende Zaken anders
      wordt overeengekomen.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel7
  - number: '7.4'
    text: |-
      Domeinen Roerende Zaken vernietigt namens de Minister of het college de roerende zaken die niet ingeruild of
      geschonken zijn.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel7
  - number: '7.5'
    text: |-
      In afwijking van het vierde lid kan Domeinen Roerende Zaken toestemming verlenen dat de roerende zaken die niet
      ingeruild of geschonken zijn door de Minister of het college zelf worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel7
  - number: '7.6'
    text: |-
      De schenking van een roerende zaak en een overtollige roerende zaak met een waarde van ten minste € 1.000.000
      inclusief btw geschiedt in overeenstemming met de Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel7
  - number: '8'
    text: Deze regeling treedt in werking met ingang van 1 januari 2018.
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel8
  - number: '9'
    text: 'Deze regeling wordt aangehaald als: Regeling materieelbeheer roerende zaken van het Rijk.'
    url: https://wetten.overheid.nl/BWBR0040285/2018-01-01#Artikel9
