  - number: '3'
    text: |-
      De artikelen in deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen en onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel3
  - number: '4'
    text: 'Deze wet wordt aangehaald als: Aanpassingswet vierde tranche Awb.'
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel4
