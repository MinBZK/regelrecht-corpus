preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is de bijzondere wetten aan te passen aan de vierde tranche
    van de Algemene wet bestuursrecht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#ArtikelAanhef
articles:
  - number: '17'
    text: '[Vervallen].'
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel17
  - number: 1b
    text: '[Vervallen].'
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel1b
  - number: '16'
    text: (Vervallen).
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel16
  - number: '5'
    text: (Vervallen).
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel5
  - number: '1.1'
    text: 'Indien ingevolge enig wettelijk voorschrift:'
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel1
  - number: 1.1.a
    text: |-
      over het ontwerp van een regeling of het voornemen tot het treffen van een regeling advies moet worden gevraagd of
      extern overleg moet worden gevoerd,
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel1
  - number: 1.1.b
    text: van het ontwerp van een regeling kennis moet worden gegeven,
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel1
  - number: 1.1.c
    text: |-
      een regeling niet eerder in werking kan treden dan nadat sedert haar vaststelling of bekendmaking een bepaalde
      termijn is verstreken,
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel1
  - number: 1.1.d
    text: een regeling bij de wet moet worden goedgekeurd,
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel1
  - number: 1.1.e
    text: |-
      door of namens een van de Kamers van de Staten-Generaal of een aantal leden daarvan kan worden verlangd dat het
      onderwerp of de inwerkingtreding van de regeling bij de wet wordt geregeld, of
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel1
  - number: 1.1.f
    text: |-
      de voordracht voor een algemene maatregel van bestuur moet worden gedaan door een andere minister dan Onze Minister
      van Justitie, geldt dat voorschrift niet ten aanzien van het [Aanpassingsbesluit vierde tranche Awb][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026027
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0026027
  - number: '1.2'
    text: Het eerste lid, onderdeel a, is niet van toepassing op het horen van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel1
  - number: '2'
    text: |-
      Voor de plaatsing in het Staatsblad brengt Onze Minister van Justitie de in deze wet
      voorkomende aanhalingen van artikelen van de [titels 4.4][ref1], [5.1][ref2] en [5.4][ref3] en
      [afdeling 10.1.3 van de Algemene wet bestuursrecht][ref4] in overeenstemming met de op grond van
      [artikel V van de Vierde tranche Algemene wet bestuursrecht][ref5] vastgestelde nummering.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005537
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.1.3
      [ref5]: https://wetten.overheid.nl/BWBR0026016#ArtikelV
    url: https://wetten.overheid.nl/BWBR0026055/2009-07-01#Artikel2
