  - number: '2'
    text: |-
      Voor de plaatsing in het Staatsblad brengt Onze Minister van Justitie de in deze wet
      voorkomende aanhalingen van artikelen van de [titels 4.4][ref1], [5.1][ref2] en [5.4][ref3] en
      [afdeling 10.1.3 van de Algemene wet bestuursrecht][ref4] in overeenstemming met de op grond van
      [artikel V van de Vierde tranche Algemene wet bestuursrecht][ref5] vastgestelde nummering.


