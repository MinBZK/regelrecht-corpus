  - number: '15'
    text: |-
      Eene vereeniging, welke eene collectieve arbeidsovereenkomst heeft aangegaan, kan, indien eene der andere partijen
      bij die overeenkomst of een der leden van dezen handelt in strijd met eene harer of zijner verplichtingen,
      vergoeding vorderen niet alleen voor de schade, welke zij zelve dientengevolge lijdt, doch ook voor die, welke hare
      leden lijden.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel15
  - number: '16'
    text: |-
      Voor zover de schade in ander nadeel dan vermogensschade bestaat, zal als vergoeding een naar billijkheid te
      bepalen bedrag verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel16
  - number: '17'
    text: |-
      Bij de collectieve arbeidsovereenkomst kan met betrekking tot de schadevergoeding eene voorziening worden
      getroffen, welke afwijkt van het bepaalde bij de twee voorgaande artikelen.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel17
  - number: '18'
    text: |-
      Eene collectieve arbeidsovereenkomst kan niet voor langeren tijd dan vijf jaren worden aangegaan; behoudens
      verlenging, zoodanig dat de partijen nimmer langer verbonden zijn dan vijf achtereenvolgende jaren, te rekenen van
      het tijdstip waarop de verlenging wordt overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel18
  - number: '19'
    text: |-
      1 Wanneer eene collectieve arbeidsovereenkomst voor een bepaalden tijd is aangegaan, wordt zij, zoo niet bij
      de overeenkomst anders is bepaald, geacht telkens voor gelijken tijd, doch ten hoogste voor een jaar, te zijn
      verlengd, behoudens opzegging; de termijn van opzegging is, tenzij bij de overeenkomst anders is bepaald, een
      twaalfde gedeelte van den tijd, waarvoor zij oorspronkelijk is aangegaan.

      2 Wanneer de tijd, waarvoor eene collectieve arbeidsovereenkomst wordt aangegaan, niet bij de overeenkomst is
      bepaald, wordt zij geacht te zijn aangegaan voor een jaar met verlenging telkens voor gelijken tijd, behoudens
      opzegging tenminste eene maand vóór het einde van het jaar.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel19
  - number: '20'
    text: |-
      De opzegging van eene collectieve arbeidsovereenkomst moet worden gedaan aan alle partijen bij die overeenkomst.
      Zij kan slechts geschieden bij aangeteekenden brief of bij deurwaardersexploit.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel20
  - number: '21'
    text: |-
      Wanneer bij de collectieve arbeidsovereenkomst niet anders is bepaald, heeft eene opzegging door eene der partijen
      ten gevolge dat de overeenkomst voor alle partijen eindigt.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel21
  - number: '25'
    text: |-
      De gevolgen van eene collectieve arbeidsovereenkomst, van kracht bij de inwerkingtreding van deze wet, worden
      beoordeeld naar het voordien geldende recht, totdat na die inwerkingtreding de overeenkomst wordt gewijzigd of haar
      duur uitdrukkelijk wordt verlengd, in welk geval voor het vervolg de bepalingen van deze wet toepassing vinden.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel25
  - number: '26'
    text: |-
      Ten aanzien van vereenigingen, welke op het tijdstip van de inwerkingtreding dezer wet partij zijn of in de twee
      daaraan voorafgaande jaren partij geweest zijn bij eene collectieve arbeidsovereenkomst, vindt [artikel 2][ref1]
      eerst twee jaren na die inwerkingtreding toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001937#Artikel2
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001937
        artikel: '2'
  - number: '27'
    text: |-
      1 Deze wet treedt in werking op een door Ons te bepalen tijdstip.

      2 Zij kan worden aangehaald onder den titel: "Wet op de collectieve arbeidsovereenkomst".
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel27
