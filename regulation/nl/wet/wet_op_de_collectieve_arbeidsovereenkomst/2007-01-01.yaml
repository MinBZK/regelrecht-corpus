      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel663
      [ref7]: https://wetten.overheid.nl/BWBR0005290#Artikel664
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel14a
