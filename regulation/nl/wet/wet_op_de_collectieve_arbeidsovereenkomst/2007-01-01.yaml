preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is nadere regelen te stellen betreffende de collectieve
    arbeidsovereenkomst;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onder collectieve arbeidsovereenkomst wordt verstaan de overeenkomst, aangegaan door een of meer werkgevers of
      een of meer verenigingen met volledige rechtsbevoegdheid van werkgevers en een of meer verenigingen met volledige
      rechtsbevoegdheid van werknemers, waarbij voornamelijk of uitsluitend worden geregeld arbeidsvoorwaarden, bij
      arbeidsovereenkomsten in acht te nemen.

      2 Zij kan ook betreffen aannemingen van werk en overeenkomsten van opdracht. Hetgeen in deze wet omtrent
      arbeidsovereenkomsten, werkgevers en werknemers is bepaald, vindt dan overeenkomstige toepassing.

      3 Nietig is het beding, waarbij een werkgever verplicht wordt arbeiders van een bepaald ras of met een bepaalde
      godsdienst, levensbeschouwelijke of politieke overtuiging of leden van een bepaalde vereniging in dienst te nemen
      of waarbij hij zich verplicht, te weigeren hen in dienst te nemen.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel1
  - number: '2'
    text: |-
      Eene vereeniging van werkgevers of van werknemers is slechts bevoegd tot het aangaan van collectieve
      arbeidsovereenkomsten, indien de statuten der vereeniging deze bevoegdheid met name noemen.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel2
  - number: '3'
    text: Eene collectieve arbeidsovereenkomst kan slechts worden aangegaan bij eene authentieke of onderhandsche akte.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel3
  - number: '4'
    text: |-
      Eene vereeniging, welke eene collectieve arbeidsovereenkomst heeft aangegaan, draagt zorg dat ieder harer leden,
      die bij de overeenkomst betrokken is, zoo spoedig mogelijk den woordelijken inhoud der overeenkomst in zijn bezit
      heeft. Indien door de partijen eene toelichting op de collectieve arbeidsovereenkomst is opgesteld, geldt deze
      verplichting ook ten aanzien van de toelichting.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel4
  - number: '5'
    text: |-
      In geval van wijziging van de collectieve arbeidsovereenkomst en van uitdrukkelijke verlenging van haren duur
      vinden de bepalingen van de twee voorgaande artikelen overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel5
  - number: '6'
    text: |-
      Eene wijziging van bepalingen in de statuten eener vereeniging, welke het nakomen, het wijzigen, het verlengen
      of het opzeggen van collectieve arbeidsovereenkomsten betreffen, werkt niet ten aanzien van eene vóór de
      statutenwijziging door de vereeniging aangegane collectieve arbeidsovereenkomst, tenzij de andere partijen bij die
      overeenkomst daarin toestemmen.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel6
  - number: '7'
    text: |-
      1 Wanneer het tijdstip, waarop de werking der collectieve arbeidsovereenkomst aanvangt, niet bij de overeenkomst
      zelve is bepaald, vangt die werking aan met ingang van den vijftienden dag, volgende op dien, waarop de
      overeenkomst is aangegaan.

      2 Wanneer bij de collectieve arbeidsovereenkomst niet anders is bepaald, strekt hare werking zich, van het tijdstip
      waarop deze aanvangt, mede uit over op dat tijdstip reeds aangegane arbeidsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel7
  - number: '8'
    text: |-
      1 Eene vereeniging, welke eene collectieve arbeidsovereenkomst heeft aangegaan, is gehouden te bevorderen, in de
      mate als de goede trouw medebrengt, dat hare leden de daarbij te hunnen aanzien gestelde bepalingen nakomen.

      2 De vereeniging staat voor hare leden slechts in, voor zooverre zulks in de overeenkomst is bepaald.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel8
  - number: '9'
    text: |-
      1 Allen, die tijdens den duur der collectieve arbeidsovereenkomst, te rekenen van het tijdstip waarop zij is
      aangegaan, lid zijn of worden eener vereeniging, welke de overeenkomst heeft aangegaan, en bij de overeenkomst zijn
      betrokken, zijn door die overeenkomst gebonden.

      2 Zij zijn tegenover elk der partijen bij de collectieve arbeidsovereenkomst gehouden al datgene, wat te hunnen
      aanzien bij die overeenkomst is bepaald, te goeder trouw ten uitvoer te brengen, als hadden zij zelve zich daartoe
      verbonden.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel9
  - number: '10'
    text: |-
      1 De leden eener vereeniging, die door eene collectieve arbeidsovereenkomst gebonden zijn, blijven ook na het
      verlies van het lidmaatschap door die overeenkomst gebonden.

      2 Die gebondenheid eindigt, wanneer de overeenkomst na het verlies van het lidmaatschap wordt gewijzigd. In
      geval van verlenging van de overeenkomst na het verlies van het lidmaatschap duurt de gebondenheid voort tot het
      tijdstip, waarop de overeenkomst zonder deze verlenging zou zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel10
  - number: '11'
    text: |-
      Ontbinding eener vereeniging, welke eene collectieve arbeidsovereenkomst heeft aangegaan, heeft geen invloed op de
      rechten en verplichtingen, welke uit die overeenkomst voortvloeien.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel11
  - number: '12'
    text: |-
      1 Elk beding tusschen een werkgever en een werknemer, strijdig met eene collectieve arbeidsovereenkomst door
      welke zij beiden gebonden zijn, is nietig; in plaats van zoodanig beding gelden de bepalingen der collectieve
      arbeidsovereenkomst.

      2 De nietigheid kan steeds worden ingeroepen door elk der partijen bij de collectieve arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel12
  - number: '13'
    text: |-
      Bij gebreke van bepalingen in eene arbeidsovereenkomst omtrent aangelegenheden, geregeld in eene collectieve
      arbeidsovereenkomst door welke zoowel de werkgever als de werknemer gebonden zijn, gelden de bepalingen der
      collectieve arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel13
  - number: '14'
    text: |-
      Wanneer bij de collectieve arbeidsovereenkomst niet anders is bepaald, is de werkgever, die door die overeenkomst
      gebonden is, verplicht, tijdens den duur dier overeenkomst hare bepalingen omtrent arbeidsvoorwaarden ook na
      te komen bij de arbeidsovereenkomsten, als in de collectieve arbeidsovereenkomst bedoeld, welke hij aangaat met
      werknemers, die door de collectieve arbeidsovereenkomst niet gebonden zijn.
    url: https://wetten.overheid.nl/BWBR0001937/2007-01-01#Artikel14
  - number: 14a
    text: |-
      1 Door de overgang van een onderneming, als bedoeld in [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1],
      gaan de rechten en verplichtingen welke op dat tijdstip voor de werkgever in die onderneming ten aanzien van daar
      werkzame werknemers voortvloeien uit bepalingen omtrent arbeidsvoorwaarden van een collectieve arbeidsovereenkomst
      waaraan hij gebonden is, van rechtswege over op de verkrijger van de onderneming.

      2 De rechten en verplichtingen die ingevolge het eerste lid overgaan, eindigen op het tijdstip
      waarop de verkrijger ten aanzien van de arbeid, verricht door de in het eerste lid bedoelde
      werknemers, gebonden wordt aan een na de overgang van de onderneming tot stand gekomen
      collectieve arbeidsovereenkomst dan wel op het tijdstip waarop de verkrijger ten aanzien van
      die arbeid krachtens een na de overgang genomen besluit tot verbindendverklaring op grond van
      __REF000___________________________________________________________________________________________________________
      _______________________ verplicht wordt bepalingen na te komen van een collectieve arbeidsovereenkomst. De rechten
      en verplichtingen eindigen voorts zodra de op het tijdstip van de overgang lopende geldingsduur van de collectieve
      arbeidsovereenkomst verstrijkt.

      3 In afwijking van het eerste en het tweede lid zijn op de rechten en verplichtingen van de werkgever
      die voortvloeien uit een bepaling in een collectieve arbeidsovereenkomst, die betrekking heeft op
      een pensioenregeling als bedoeld in [artikel 1 van de Pensioenwet][ref3], dan wel een spaarregeling
      als bedoeld in [artikel 3 van de Pensioen- en spaarfondsenwet][ref4] zoals dat artikel luidde op
      de dag voorafgaand aan de inwerkingtreding van de [Pensioenwet][ref5], de [artikelen 663][ref6] en
      [664 van Boek 7 van het Burgerlijk Wetboek][ref7] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
