  - number: '11'
    text: |-
      De subsidie bedraagt per project 50% van de subsidiabele kosten met dien verstande dat niet meer subsidie wordt
      verstrekt dan het bedrag waarop de subsidie, blijkens de voor het project op grond van [artikel 15][ref1] afgegeven
      subsidieverlening, ten hoogste kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009462#Artikel15
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009462
        artikel: '15'
        paragraaf: '4'
  - number: '12'
    text: De aanvraag voor subsidie kan worden ingediend tot 1 juli 2005.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel12
  - number: '13'
    text: |-
      De aanvraag voor subsidie wordt gericht aan de minister en wordt ingediend bij de Directeur van de Dienst Landelijk
      Gebied.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel13
  - number: '14'
    text: |-
      De aanvraag voor subsidie gaat vergezeld van een projectplan waarin zo nauwkeurig mogelijk is opgenomen:

      a. de aard en omvang van de aanleg of verbetering van de infrastructurele voorziening en de daarmee verband
      houdende landschappelijke of recreatieve voorzieningen en de in verband daarmee te verrichten werkzaamheden;

      b. de relatie van het project met het plan;

      c. de gehanteerde uitgangspunten en daarbij uitgevoerde berekeningen;

      d. de financiële planning van de uitvoering;

      e. de oppervlakte grond die is, onderscheidenlijk zal worden verworven ten behoeve van de aan te leggen of te
      verbeteren infrastructurele, of daarmee samenhangende landschappelijke of recreatieve, voorziening, alsmede het
      huidig gebruik en de huidige bestemming van de desbetreffende grond;

      f. de wijze waarop de grond is, onderscheidenlijk zal worden verworven;

      g. een gespecificeerde begroting;

      h. een opgave van de financieringswijze van het project, alsmede

      i. een verklaring of de ten behoeve van de infrastructurele voorziening verschuldigde omzetbelasting al dan niet
      verrekenbaar is.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel14
  - number: '15'
    text: |-
      1 De beschikking tot subsidieverlening vermeldt:

      a. de geraamde kosten van de, voor de aanleg of verbetering van de infrastructurele voorziening noodzakelijke,
      grondverwerving en de subsidiabele kosten daarvan;

      b. de geraamde som waartegen de aanleg of verbetering van de infrastructurele voorziening wordt aanbesteed en de
      subsidiabele kosten daarvan;

      c. de geraamde kosten van de, voor de aanleg of verbetering van de landschappelijke of recreatieve voorziening
      noodzakelijke, grondverwerving en de subsidiabele kosten daarvan;

      d. de geraamde som waartegen de aanleg of verbetering van landschappelijke of recreatieve voorzieningen wordt
      aanbesteed en de subsidiabele kosten daarvan;

      e. de geraamde kosten van de voorbereiding en de directievoering van het project en de subsidiabele kosten daarvan;

      f. het bedrag waarop de subsidie voor het project ten hoogste kan worden vastgesteld.

      2 De raming van de kosten van de grondverwerving, bedoeld in het eerste lid, onderdeel a, geschiedt op basis van
      taxatie door het Bureau Beheer Landbouwgronden, bedoeld in [artikel 28 van de Wet agrarisch grondverkeer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel28
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003386
        artikel: '28'
  - number: '16'
    text: |-
      De subsidieverlening kan worden geweigerd indien een gegronde reden bestaat om aan te nemen dat de financiering van
      het project niet toereikend zal zijn.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel16
  - number: '17'
    text: |-
      De minister geeft de beschikking tot subsidieverlening binnen vier maanden nadat de aanvraag is ingediend. Indien
      deze termijn niet kan worden gehaald, stelt de minister de aanvrager daarvan in kennis en noemt hij daarbij een
      redelijke termijn waarop de beschikking tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel17
  - number: '18'
    text: |-
      1 De subsidieontvanger is verplicht:

      a. de activiteiten ten behoeve waarvan subsidie is verleend binnen drie jaar na de datum van subsidieverlening te
      hebben uitgevoerd overeenkomstig de subsidieverlening;

      b. binnen één maand nadat de opdracht tot aanleg of verbetering van de desbetreffende infrastructurele
      voorziening en de daarbij verband houdende landschappelijke of recreatieve voorzieningen, met inachtneming van
      [artikel 9, onderdeel a][ref1], is verstrekt aan de directeur van de Dienst Landelijk Gebied melding te doen van de
      desbetreffende aanbestedingssom, en

      c. de infrastructurele voorziening ten behoeve waarvan subsidie is verleend naar behoren te beheren en onderhouden.

      2 De minister kan de in het eerste lid, onderdeel a, bedoelde termijn ten hoogste met één jaar verlengen indien de
      subsidieontvanger uiterlijk 3 maanden voor afloop van die termijn schriftelijk aan de minister om verlenging heeft
      verzocht. Indien de minister de termijn heeft verlengd is de subsidieontvanger, in afwijking van het eerste lid,
      verplicht de activiteiten binnen de verlengde termijn uitgevoerd te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0009462#Artikel9
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009462
        artikel: '9'
        paragraaf: '2'
  - number: '19'
    text: |-
      1 De aanvraag voor de vaststelling van de subsidie wordt ingediend bij de directeur van de Dienst Landelijk Gebied
      binnen twee maanden nadat de activiteiten ten behoeve waarvan subsidie is verleend zijn uitgevoerd.

      2 De aanvraag, bedoeld in het eerste lid, gaat vergezeld van:

      a. een verklaring van de subsidieontvanger dat de activiteiten waarvoor subsidie is verleend zijn uitgevoerd
      overeenkomstig de subsidieverlening, en

      b. een financiële verantwoording van het project en een verklaring van een registeraccountant of een Accountant-
      Administratieconsulent als bedoeld in [artikel 2:393, eerste lid, van het Burgerlijk Wetboek][ref1], waaruit blijkt
      dat is voldaan aan de bij of krachtens deze regeling gestelde voorwaarden en verplichtingen.

      3 De registeraccountant of Accountant-Administratieconsulent, bedoeld in het tweede lid, controleert met
      inachtneming van het in [bijlage 3][ref2] opgenomen controleprotocol. De goedkeurende accountantsverklaring wordt
      opgesteld overeenkomstig de in [bijlage 4][ref3] opgenomen model-accountantsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0009462
      [ref3]: https://wetten.overheid.nl/BWBR0009462
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0009462
      - id: ref3
        bwb_id: BWBR0009462
  - number: '20'
    text: |-
      De minister stelt na ontvangst van de in [artikel 19][ref1] bedoelde bescheiden binnen vier maanden de subsidie
      vast.


      [ref1]: https://wetten.overheid.nl/BWBR0009462#Artikel19
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009462
        artikel: '19'
        paragraaf: '6'
  - number: '21'
    text: |-
      Zolang de subsidie niet is vastgesteld kan de minister de subsidieverlening intrekken of ten nadele van
      de subsidieontvanger wijzigen indien de som waartegen de activiteiten voor de aanleg of verbetering van de
      infrastructurele voorziening en daarmee samenhangende landschappelijke of recreatieve voorzieningen is aanbesteed
      lager is dan de bij de subsidieverlening geraamde aanbestedingssom.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel21
  - number: '22'
    text: |-
      1 De minister kan de subsidieontvanger op diens verzoek voorschotten verlenen.

      2 Het totaal van de verleende voorschotten kan nooit meer bedragen dan 80% van het bedrag waarop de subsidie ten
      hoogste kan worden vastgesteld.

      3 De aanvraag tot voorschotverlening gaat vergezeld van een overzicht van de liquiditeitsbehoefte.

      4 De beschikking tot voorschotverlening vermeldt het bedrag van het voorschot.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel22
  - number: '23'
    text: |-
      Twee jaar na inwerkingtreding wordt een verslag gepubliceerd over de doeltreffendheid en de effecten van deze
      regeling in de praktijk.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel23
  - number: '24'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel24
  - number: '25'
    text: 'Deze regeling wordt aangehaald als: Infrastructuurregeling glastuinbouwgebieden.'
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel25
