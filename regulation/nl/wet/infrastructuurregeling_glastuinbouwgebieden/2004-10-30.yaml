preamble:
  text: |-
    Gelet op de artikelen 2 en 4 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b
             infrastructurele voorziening:

              openbare weg waarvan de rechthebbende een openbaar lichaam is en die niet in onderhoud is bij de provincie
      of het Rijk, of waterbeheersingswerk waarvan de beheerder een openbaar lichaam is;



            c
            glastuinbouwgebied:

              gebied waarin hoofdzakelijk of in overwegende mate de teelt van groenten, klein fruit en siergewassen onder
      staand glas, met inbegrip van de teelt van uitgangsmateriaal, plaatsvindt;



            d
             plan:

              infrastructuurplan Aalsmeer en omstreken, zoals vastgesteld door gedeputeerde staten van Noord-Holland bij
      besluit van 24 december 1997, kenmerk 97-715312;
      infrastructuurplan glastuinbouwgebieden Westland, zoals vastgesteld door gedeputeerde staten van Zuid-Holland bij
      besluit van 28 juli 1998, kenmerk DRGG154075;’



            e
            Dienst Landelijk Gebied:

              Dienst Landelijk Gebied van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel1
  - number: '2'
    text: |-
      De minister kan, ter verbetering van de infrastructuur in een glastuinbouwgebied dat is weergegeven en begrensd
      in een plan, aan gemeenten en waterschappen op aanvraag subsidie verstrekken voor de uitvoering van projecten
      gericht op de aanleg of verbetering van infrastructurele voorzieningen en daarmee samenhangende landschappelijke en
      recreatieve voorzieningen.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel2
  - number: '3'
    text: |-
      1 De minister stelt ieder begrotingsjaar een subsidieplafond vast voor op grond van deze regeling te verstrekken
      subsidies. Hij geeft hiervan kennis in de Staatscourant.

      2 De minister verdeelt het beschikbare bedrag in de volgorde van ontvangst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel3
  - number: '4'
    text: |-
      De subsidie wordt uitsluitend verstrekt indien het project bijdraagt aan de verwezenlijking van de in een plan
      opgenomen toekomstige infrastructuur in het betrokken glastuinbouwgebied.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel4
  - number: '5'
    text: |-
      Geen subsidie wordt verstrekt indien het project geheel of gedeeltelijk:

      a. bestaat uit de aanleg of verbetering van voorzieningen die uitsluitend of nagenoeg uitsluitend ten goede komen
      aan individuele bedrijven en waarvan de kosten gewoonlijk niet ten laste komen van een publiekrechtelijk lichaam,
      of

      b. betrekking heeft op het regulier onderhoud of het opheffen van achterstallig onderhoud van bestaande
      infrastructurele of daarmee samenhangende landschappelijke of recreatieve voorzieningen.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel5
  - number: '6'
    text: |-
      1 Geen subsidie wordt verstrekt indien met de uitvoering van het project een aanvang is gemaakt alvorens een
      beslissing op de aanvraag om subsidie is genomen. Onder het maken van een aanvang met de uitvoering van het project
      wordt in elk geval verstaan het aangaan van verplichtingen.

      2 Het eerste lid is niet van toepassing op de uitvoering van het project, voorzover bestaande uit de verwerving
      van grond ten aanzien waarvan de directeur van de Dienst Landelijk Gebied schriftelijk en voorafgaande aan het
      aangaan van enige verplichting ter zake van die verwerving, heeft verklaard dat die verwerving noodzakelijk is
      met het oog op de aanleg of verbetering van een in een plan opgenomen infrastructurele, of daarmee samenhangende
      landschappelijke of recreatieve, voorziening.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel6
  - number: '7'
    text: |-
      Geen subsidie wordt verstrekt indien het project betrekking heeft op de aanleg of verbetering van een infra-
      structurele voorziening:

      a. in gebieden waarop een in uitvoering of voorbereiding zijnd reconstructieplan als bedoeld in de Regeling
      reconstructie oude glastuinbouwgebieden van toepassing is;

      b. in gebieden waarin landinrichting uit kracht van de [Landinrichtingswet][ref1] plaatsvindt, of

      c. in gebieden waarin een reconstructie als bedoeld in de Regeling reconstructie oude glastuinbouwgebieden,
      onderscheidenlijk landinrichting uit kracht van de [Landinrichtingswet][ref2], is afgerond in de periode van vijf
      jaar, voorafgaande aan de datum waarop voor het project uit hoofde van deze regeling subsidie wordt aangevraagd
      en ten behoeve van die infrastructurele voorziening uit hoofde van die reconstructie, onderscheidenlijk die
      landinrichting, subsidie is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003793
      [ref2]: https://wetten.overheid.nl/BWBR0003793
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003793
      - id: ref2
        bwb_id: BWBR0003793
  - number: '8'
    text: |-
      Geen subsidie wordt verstrekt voorzover daardoor in de financiering van het project van Rijkswege voor meer dan 50%
      wordt bijgedragen.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel8
  - number: '9'
    text: |-
      De subsidie wordt verstrekt onder de voorwaarde dat:

      a. de aanleg of verbetering van de infrastructurele voorziening en de daarmee samenhangende landschappelijke
      of recreatieve voorzieningen wordt uitgevoerd op basis van openbare aanbesteding, overeenkomstig het Uniform
      Aanbestedingsreglement 1986, dan wel, indien de kosten van het project de drempelwaarde als bedoeld in artikel 3,
      eerste lid, van [Richtlijn 93/37/EEG](31993L0037) overschrijden, overeenkomstig het Uniform Aanbestedingsreglement
      EEG 1991, en

      b. de subsidieaanvrager uit eigen middelen tenminste voor 25% bijdraagt in de financiering van het project.
    url: https://wetten.overheid.nl/BWBR0009462/2004-10-30#Artikel9
  - number: '10'
    text: |-
      1 Onverminderd het tweede lid worden als subsidiabele kosten van een project uitsluitend aangemerkt:

      a. de kosten van de in [bijlage 1][ref1] opgenomen activiteiten, voorzover bestaande uit de som waartegen die
      activiteiten overeenkomstig [artikel 9][ref2] zijn aanbesteed, exclusief verrekenbare omzetbelasting;

      b. de kosten van de, ten behoeve van de aanleg of verbetering van de infrastructurele voorziening noodzakelijke,
      verwerving van grond, voorzover bestaande uit de aankoopprijs en de met de aankoop verband houdende notariële
      kosten, exclusief verrekenbare omzetbelasting, dan wel, indien de verwerving geschiedt bij wege van onteigening,
      voorzover bestaande uit de betaalde schadeloosstelling, de in verband met de onteigening gemaakte proceskosten
      tot vergoeding waarvan de onteigenende partij is veroordeeld, alsmede de noodzakelijke kosten van bekendmaking van
      de onteigening;

      c. de kosten van de, ten behoeve van de aanleg van landschappelijke of recreatieve voorzieningen noodzakelijke,
      verwerving van grond, voorzover bestaande uit de aankoopprijs en de met de aankoop verband houdende notariële
      kosten, exclusief verrekenbare omzetbelasting, dan wel, indien de verwerving geschiedt bij wege van onteigening,
      voorzover bestaande uit de betaalde schadeloosstelling, de in verband met de onteigening gemaakte proceskosten
      tot vergoeding waarvan de onteigenende partij is veroordeeld, en de noodzakelijke kosten van bekendmaking van de
      onteigening, en de kosten van de in [bijlage 2][ref3] opgenomen activiteiten, bestaande uit de som waartegen die
      activiteiten overeenkomstig [artikel 9][ref4] zijn aanbesteed, in totaal tot ten hoogste 2% van de som van de in
      onderdeel a en b bedoelde subsidiabele kosten, en

      d. de kosten van de voorbereiding en directievoering door derden, niet zijnde bestuursorganen, exclusief
      verrekenbare omzetbelasting.

      2 Niet als subsidiabele kosten worden aangemerkt de kosten die, gelet op de aard, functie of ligging van de
      desbetreffende infrastructurele voorziening, in redelijkheid niet als noodzakelijk kunnen worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0009462
      [ref2]: https://wetten.overheid.nl/BWBR0009462#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009462
      [ref4]: https://wetten.overheid.nl/BWBR0009462#Artikel9
