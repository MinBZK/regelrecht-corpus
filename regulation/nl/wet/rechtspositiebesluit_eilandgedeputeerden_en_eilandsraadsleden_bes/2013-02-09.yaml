  - number: 1a
    text: |-
      [Artikel 1][ref1] is van overeenkomstige toepassing op het lid van de eilandsraad aan wie ingevolge
      [artikel Ya 13][ref2] juncto [artikel X 10, eerste en tweede lid van de Kieswet][ref3] tijdelijk ontslag is
      verleend wegens zwangerschap en bevalling of ziekte, met dien verstande dat de tegemoetkoming in de kosten, die
      dit lid ontvangt op grond van eerste, tweede of derde lid, de helft bedraagt van het bedrag dat op grond van die
      bepalingen van toepassing is.


