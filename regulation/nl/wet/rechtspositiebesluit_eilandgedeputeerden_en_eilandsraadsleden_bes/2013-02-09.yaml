  - number: '4'
    text: |-
      Ten aanzien van een lid van een commissie als bedoeld in de [artikelen 117][ref1] en
      [118 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2]:

      a. die op grond van zijn bijzondere beroepsmatige deskundigheid op het taakgebied van de commissie voor deelneming
      aan haar werkzaamheden is aangetrokken, en

      b. ten aanzien waarvan de vergoeding niet geacht kan worden in een redelijke verhouding te staan tot de zwaarte van
      zijn taak en de omvang van de door hem te verrichten arbeid, kan de eilandsraad bij eilandverordening bepalen dat
      de vergoeding voor het bijwonen van de vergaderingen van de commissie naar boven afwijkt van de bedragen, genoemd
      in [artikel 3, eerste lid, onderdeel a en b][ref3].


