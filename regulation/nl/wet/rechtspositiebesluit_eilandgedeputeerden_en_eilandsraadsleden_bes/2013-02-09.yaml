      1 De eilandgedeputeerden van het openbaar lichaam Bonaire genieten per jaar een bezoldiging van USD 65.660.

      2 De eilandgedeputeerden van de openbare lichamen Sint Eustatius en Saba genieten per jaar een bezoldiging van
      USD 51.266.

      3 Als de bezoldiging van de ambtenaren, bedoeld in [artikel 1, eerste lid, van de Ambtenarenwet BES][ref1],
      wijziging ondergaat, wordt met ingang van de datum waarop die wijziging ingaat bij ministeriële regeling de
      bezoldiging van de eilandgedeputeerden dienovereenkomstig gewijzigd, onder nadere vaststelling voor zoveel nodig,
      van de bedragen, genoemd in het eerste en tweede lid.

      4 De maandelijkse uitbetaling van de bezoldiging wordt naar boven afgerond in hele dollars.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel1
