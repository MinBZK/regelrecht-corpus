      1 De eilandsraad kan bij eilandverordening bepalen dat aan een lid van een commissie als bedoeld in de
      [artikelen 117][ref1] en [118 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2], een vergoeding
      voor het bijwonen van de vergaderingen van de commissie wordt toegekend tot het maximumbedrag van:

      a. USD 55, voor een lid van een commissie in Sint Eustatius en Saba;

      b. USD 62 voor een lid van een commissie in Bonaire.

      2 Geen vergoeding wordt verstrekt aan een lid van een commissie dat tevens lid is van de eilandsraad of aan een
      ambtenaar die als zodanig tot lid van een commissie is benoemd.

      3 [Artikel 1, vierde lid][ref3], is van overeenkomstige toepassing op de vergoeding voor de leden van een
      commissie.


