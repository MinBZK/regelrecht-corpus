  - number: 2e
    text: |-
      1 Voor 1 april van elk jaar of binnen twee maanden na zijn beëdiging verstrekt de eilandgedeputeerde aan Onze
      Minister, dan wel een door hem aangewezen instantie, een opgave van de neveninkomsten welke hij verwacht over het
      desbetreffende kalenderjaar of gedeelte daarvan te zullen genieten, dan wel een verklaring, dat hij verwacht niet
      meer dan 14% van de bezoldiging op jaarbasis aan neveninkomsten over dat jaar of een evenredig deel daarvan over
      het desbetreffende gedeelte van dat jaar te zullen genieten.

      2 Onze Minister, dan wel de door hem aangewezen instantie, deelt bestuurscollege het bedrag van de voorlopige
      aftrek op de bezoldiging mede en verstrekt een afschrift daarvan aan de eilandgedeputeerde.

      3 De eilandgedeputeerde kan een verklaring inzenden dat een opgave van neveninkomsten achterwege zal blijven. In
      dit geval, alsmede indien binnen de in het eerste lid bedoelde termijn geen opgave of verklaring is ingezonden,
      bedraagt de bezoldiging over dat kalenderjaar 65% van de bezoldiging op jaarbasis.

      4 Zo spoedig mogelijk na afloop van het kalenderjaar zendt de eilandgedeputeerde of zenden zijn nabestaanden
      aan Onze Minister, dan wel de door hem aangewezen instantie, een opgave van de neveninkomsten welke over dat
      kalenderjaar zijn genoten, dan wel een verklaring dat over dat jaar niet meer dan 14% van de bezoldiging op
      jaarbasis of, indien de eilandgedeputeerde een gedeelte van het kalenderjaar lid van het bestuurscollege is
      geweest, een evenredig deel van dit bedrag, is genoten.

      5 Onze Minister, dan wel de door hem aangewezen instantie, deelt aan het bestuurscollege zo spoedig mogelijk
      na ontvangst van de in het vierde lid bedoelde opgave of verklaring het bedrag van de definitieve aftrek op de
      bezoldiging mede en verstrekt een afschrift daarvan aan de eilandgedeputeerde.

      6 Indien een opgave of verklaring als in het vierde lid bedoeld, niet binnen zes maanden na afloop van het
      kalenderjaar is ontvangen, bedraagt de bezoldiging over dat kalenderjaar 65% van de bezoldiging op jaarbasis.

      7 De eilandgedeputeerde zendt Onze Minister, dan wel de door hem aangewezen instantie, zo spoedig mogelijk na
      afloop van het kalenderjaar tevens een afschrift van de aanslag voor de inkomstenbelasting over het betreffende
      kalenderjaar. Het bedrag van de uitbetaalde bezoldiging kan, al dan niet op verzoek van de eilandgedeputeerde,
      worden herzien, indien op grond van de onherroepelijk geworden aanslag in de inkomstenbelasting daartoe aanleiding
      blijkt te bestaan.

      8 Bij de toepassing van het vijfde, zesde en zevende lid vindt zo nodig terugbetaling of verrekening plaats.

      9 Dit artikel is niet van toepassing op de eilandgedeputeerde op wie
      [artikel 234, derde lid, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] van toepassing is.


