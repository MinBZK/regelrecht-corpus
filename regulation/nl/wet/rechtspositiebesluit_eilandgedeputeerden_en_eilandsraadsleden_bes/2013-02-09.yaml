    text: |-
      1 De eilandsraadsleden van het openbaar lichaam Bonaire genieten per jaar een vergoeding voor hun werkzaamheden van
      ten hoogste USD 7020 en een tegemoetkoming in de kosten daarvan van ten hoogste USD 1188.

      2 De eilandsraadsleden van de openbare lichamen Sint Eustatius en Saba genieten per jaar een vergoeding voor hun
      werkzaamheden van ten hoogste USD 5593 en een tegemoetkoming in de kosten daarvan van ten hoogste USD 1050.

      3 Als de bezoldiging van de ambtenaren, bedoeld in [artikel 1, eerste lid, van de Ambtenarenwet BES][ref1],
      wijziging ondergaat, wordt met ingang van de datum waarop die wijziging ingaat bij ministeriële regeling de
      vergoeding voor de werkzaamheden van de eilandsraadsleden en de tegemoetkoming in de kosten dienovereenkomstig
      gewijzigd, onder nadere vaststelling voor zoveel nodig, van de bedragen, genoemd in het eerste en tweede lid.

      4 De maandelijkse uitbetaling van de vergoeding voor de werkzaamheden en de tegemoetkoming in de kosten worden naar
      boven afgerond in hele dollars.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel1
    url: https://wetten.overheid.nl/BWBR0028423/2013-02-09#Artikel1
