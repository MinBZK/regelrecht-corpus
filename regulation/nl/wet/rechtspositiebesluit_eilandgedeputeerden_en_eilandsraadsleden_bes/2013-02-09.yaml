    text: |-
      Indien aan de ambtenaren, bedoeld in [artikel 1, eerste lid, van de Ambtenarenwet BES][ref1], een eenmalige
      uitkering wordt toegekend, ontvangt de eilandgedeputeerde een uitkering op gelijke voet.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel1
