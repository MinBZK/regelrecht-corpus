  - number: '5'
    text: |-
      1 Een bijzondere bevoegdverklaring AML wordt afgegeven, nadat de aanvrager heeft aangetoond te voldoen aan de
      eisen inzake basiskennis, typekennis en ervaring voor afgifte van de bijzondere bevoegdverklaring. Deze eisen zijn
      opgenomen in het onderstaande schema:

        - basiskennis: de aanvrager toont aan voor de bijzondere bevoegdverklaring AB1Z, AB1T, AB2Z, AB2T, AB3Z, AB3T,
      CF, CEF, DG, A, B of C, dat het examen voor de bijzondere bevoegdverklaring niet langer dan drie jaar geleden met
      voldoende resultaat is afgelegd.
        - typekennis: de aanvrager toont aan voor de bijzondere bevoegdverklaring AB2Z, AB2T, AB3Z of AB3T, dat
      een door de Minister geaccepteerde cursus met betrekking tot het type luchtvaartuig met inbegrip van de
      voortstuwingsinstallatie, waarvoor de aanvraag wordt ingediend, met voldoende resultaat is gevolgd. Wanneer een
      cursus niet meer bestaat of reeds een aantal typecursussen met voldoende resultaat is gevolgd, kan de aanvrager
      voldoende kennis met betrekking tot het type vliegtuig, inclusief de motor, aantonen door met voldoende resultaat
      een examen af te leggen;
        - ervaring: 'de aanvrager toont aan: a. voor de bijzondere bevoegdverklaring AB1Z, AB1T, AB2Z, AB2T, AB3Z, AB3T, CF,'
      CEF, DG, A, B of C, dat in de drie jaren, onmiddellijk voorafgaande aan de datum van aanvraag, tenminste twee jaren
      ervaring is verkregen met betrekking tot de werkzaamheden waarvoor de bijzondere bevoegdverklaring is vereist; b.
      voor de bijzondere bevoegdverklaring AB2Z, AB2T, AB3Z of AB3T, dat in het jaar, onmiddellijk voorafgaande aan de
      datum van aanvraag tenminste zes maanden ervaring is verkregen met betrekking tot het type luchtvaartuig waarvoor
      de aanvraag wordt ingediend; c. voor de bijzondere bevoegdverklaring AB1Z, AB1T, AB2Z, AB2T, AB3Z, AB3T, CF, CEF,
      DG, A, B of C, de werkzaamheden, bedoeld onder a en b, zijn verricht onder toezicht van een bevoegde persoon of
      erkende onderhoudsorganisatie.

