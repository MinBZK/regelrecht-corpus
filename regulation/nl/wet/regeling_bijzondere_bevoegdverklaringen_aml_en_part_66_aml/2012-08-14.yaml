  - number: '7'
    text: |-
      Een bijzondere bevoegdverklaring waarvan de geldigheidsduur langer dan twee maanden is verstreken, wordt
      op aanvraag wederafgegeven, nadat is aangetoond dat de aanvrager in de twee jaren onmiddellijk voorafgaande
      aan de datum van aanvraag, ten minste zes maanden ervaring heeft verkregen met het onderhoud waarvoor de
      bijzondere bevoegdverklaring vereist is onder de voorwaarde dat de ervaring na de vervaldatum van de bijzondere
      bevoegdverklaring is verkregen onder toezicht van een bevoegde persoon of erkende onderhoudsorganisatie.
    url: https://wetten.overheid.nl/BWBR0024644/2012-08-14#Artikel7
  - number: '8'
    text: |-
      1 De Minister zet op verzoek van de aanvrager de reeds afgegeven nog geldige bijzondere bevoegdverklaringen om naar
      een Part-66-AML voor vliegtuigen en helikopters met een maximum startmassa van 5700 kg of minder.

      2 Op de in het eerste lid bedoelde Part-66-AML worden de bijzondere bevoegdverklaringen en bijbehorende beperkingen
      zodanig vermeld dat deze overeenkomen met de eerder afgegeven bevoegdheden als genoemd in [artikel 2][ref1] en
      [5][ref2] en de machtiging om namens een volgens Part-145 of JAR-145 erkende onderhoudsorganisatie werkzaamheden
      te mogen vrijgeven.


      [ref1]: https://wetten.overheid.nl/BWBR0024644#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024644#Artikel5
    url: https://wetten.overheid.nl/BWBR0024644/2012-08-14#Artikel8
