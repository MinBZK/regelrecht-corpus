  - number: '9'
    text: |-
      1 De houder van een Part-66-AML met de bijzondere bevoegdverklaring B1.2 of B3, is tevens bevoegd werkzaamheden te
      verrichten waarvoor de bijzondere bevoegdverklaring B volgens [artikel 3, eerste lid][ref1], vereist is.

      2 De houder van een Part-66 AML met de bijzondere bevoegdverklaring in een categorie of subcategorie voor
      werkzaamheden aan luchtvaartuigen met een maximum startmassa van 5.700 kg of minder, is bevoegd dezelfde
      werkzaamheden, als waartoe de desbetreffende Part-66 AML strekt, te verrichten en vrij te geven aan:

      a. luchtvaartuigen van dezelfde categorie of subcategorie met een maximum startmassa van 5.700 kg of minder als
      genoemd in onderdeel a van Bijlage II bij verordening (EG) nr. 216/2008 (PbEU L 79);

      b. amateurbouwluchtvaartuigen;

      c. MLA’s; en

      d. MLH’s.

      3 De houder van een Part-66-AML met de bijzondere bevoegdverklaring B1 voor werkzaamheden aan luchtvaartuigen met
      een maximum startmassa van 5700 kg of minder, is bevoegd tot het mede ondertekenen van de verklaring als bedoeld in
      [artikel 4, derde lid, van de Regeling MLA’s][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024644#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015237#Artikel4
    url: https://wetten.overheid.nl/BWBR0024644/2012-08-14#Artikel9
