  - number: 9a
    text: |-
      De minister kan op aanvraag van een houder van een Part-66 AML de bevoegdheid verlenen tot het uitvoeren van een
      AR voor ELA 1-luchtvaartuigen die vallen binnen zijn bevoegdheden zoals vermeld op de Part-66 AML indien aan de
      voorwaarden van Part-M van verordening (EG) nr. 2042/2003 wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0024644/2012-08-14#Artikel9a
  - number: '10'
    text: |-
      1 Vanaf het tijdstip van schorsing mag de houder die bevoegdheden, waarop de schorsing van de AML of de Part-66-AML
      betrekking heeft, niet uitoefenen.

      2 Om een schorsing op te heffen toont de houder aan, dat de redenen, die tot schorsing hebben geleid, zijn
      vervallen.
    url: https://wetten.overheid.nl/BWBR0024644/2012-08-14#Artikel10
  - number: '11'
    text: |-
      1 Vanaf het tijdstip van intrekking mag de houder die bevoegdheden, waarop de intrekking van de AML of de Part-66-
      AML betrekking heeft, niet uitoefenen.

      2 De Minister neemt het bewijs van bevoegdheid in en geeft, in geval van gedeeltelijke intrekking, een nieuw bewijs
      van bevoegdheid af.
    url: https://wetten.overheid.nl/BWBR0024644/2012-08-14#Artikel11
  - number: '12'
    text: |-
      De [Regeling bijzondere bevoegdverklaringen AML][ref1] en de
      [Regeling bijzondere bevoegdverklaringen JAR-66-AML][ref2] worden ingetrokken.


