preamble:
  text: |-
    Gelet op verordening (EG) nr. 216/2008 van het Europees Parlement en de Raad van 20 februari 2008 tot vaststelling
    van gemeenschappelijke regels op het gebied van burgerluchtvaart en tot oprichting van een Europees Agentschap voor
    de veiligheid van de luchtvaart, houdende intrekking van Richtlijn 91/670/EEG, Verordening (EG) nr. 1592/2002 en
    Richtlijn 2004/36/EG (PbEU L 79) en de artikelen 2.5, negende lid, 2.6, vijfde lid, en 3.30, van de Wet luchtvaart
    en 5, 8, eerste lid en 9, van het Besluit bewijzen van bevoegdheid voor de luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024644/2012-08-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *AR:* Airworthiness Review, beoordeling van de luchtwaardigheid van een luchtvaartuig conform Part M, subpart I,
      van verordening (EG) nr. 2042/2003;
        - *ELA 1-luchtvaartuig:* European Light Aircraft, luchtvaartuig als bedoeld in artikel 2 van verordening (EG) nr.
      2042/2003;
        - *Minister:* Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0024644/2012-08-14#Artikel1
  - number: '2'
    text: |-
      1 De Minister kan op aanvraag de volgende bijzondere bevoegdverklaringen afgeven voor onderhoud aan vliegtuigen met
      een maximum startmassa tot 5700 kg en helikopters met een maximum startmassa tot 2730 kg:

        - AB voor werkzaamheden aan vliegtuigen en helikopters en de voortstuwingsinstallatie hiervan, van een klasse
      volgens het tweede lid, met uitzondering van de werkzaamheden waarvoor een bijzondere bevoegdverklaring CF, CEF, of
      DG vereist is, maar inclusief de werkzaamheden die op de AML zijn vermeld;
        - CF voor werkzaamheden aan instrumenten zonder elektronische hulpapparatuur en elektrische installaties;
        - CEF voor werkzaamheden aan instrumenten zonder elektronische hulpapparatuur, klimaatregeling en elektrische
      installaties;
        - DG voor werkzaamheden aan automatische vluchtgeleidingssystemen en communicatie-, navigatie- en identificatie-
      installaties.

      2 De klassen, bij de bijzondere bevoegdverklaring AB zijn:

        - 1Z vliegtuigen zonder drukcabine met één zuigermotor;
        - 1T vliegtuigen zonder drukcabine met één turbinemotor;
        - 2Z vliegtuigen met drukcabine of meerdere zuigermotoren, van een type dat op de AML is vermeld;
        - 2T vliegtuigen met drukcabine of meerdere turbinemotoren, van een type dat op de AML is vermeld;
        - 3Z helikopters met zuigermotoren, van een type dat op de AML is vermeld;
        - 3T helikopters met turbinemotoren, van een type dat op de AML is vermeld.

      3 De werkzaamheden, die bij de bijzondere bevoegdverklaring AB op de AML kunnen worden vermeld zijn het controleren
      en compenseren van direct afleesbare magnetische kompassen.
    url: https://wetten.overheid.nl/BWBR0024644/2012-08-14#Artikel2
  - number: '3'
    text: |-
      1 De Minister kan op aanvraag de volgende bijzondere bevoegdverklaringen afgeven voor onderhoud aan
      zweefvliegtuigen en motorzweefvliegtuigen:

        - A voor werkzaamheden aan zweefvliegtuigen en motorzweefvliegtuigen, met uitzondering van de werkzaamheden
      waarvoor een bijzondere bevoegdverklaring B of C vereist is, maar inclusief de werkzaamheden die op de AML zijn
      vermeld;
        - B voor werkzaamheden aan de voortstuwingsinstallatie;
        - C voor werkzaamheden aan elektrische en elektronische installaties.

      2 De werkzaamheden, die bij de bijzondere bevoegdverklaring A op de AML kunnen worden vermeld zijn het controleren
      en compenseren van direct afleesbare magnetische kompassen.
    url: https://wetten.overheid.nl/BWBR0024644/2012-08-14#Artikel3
  - number: '4'
    text: |-
      1 De houder van een AML met de bijzondere bevoegdverklaring AB1Z, is tevens bevoegd werkzaamheden te verrichten
      waarvoor de bijzondere bevoegdverklaring B vereist is.

      2 De houder van een AML met de bijzondere bevoegdverklaring AB2Z, is tevens bevoegd werkzaamheden te verrichten
      waarvoor de bijzondere bevoegdverklaring AB1Z en B vereist is.

      3 De houder van een AML met de bijzondere bevoegdverklaring AB2T, is tevens bevoegd werkzaamheden te verrichten
      waarvoor de bijzondere bevoegdverklaring AB1T vereist is.

      4 De houder van een AML met de bijzondere bevoegdverklaring AB2Z voor een type vliegtuig zonder drukcabine met een
      niet intrekbaar onderstel, is bevoegd werkzaamheden waarvoor de bijzondere bevoegdverklaring AB2Z vereist is, te
      verrichten aan alle vliegtuigen van de klasse 2Z zonder drukcabine met een niet intrekbaar onderstel.

      5 De houder van een AML met de bijzondere bevoegdverklaring AB2Z voor een type vliegtuig zonder drukcabine met
      een intrekbaar onderstel, is bevoegd werkzaamheden waarvoor de bijzondere bevoegdverklaring AB2Z vereist is, te
      verrichten aan alle vliegtuigen van de klasse 2Z zonder drukcabine.

      6 De houder van een AML met de bijzondere bevoegdverklaring AB2Z voor een meermotorig vliegtuig met drukcabine, is
      bevoegd werkzaamheden waarvoor een bijzondere bevoegdverklaring AB2Z vereist is, te verrichten aan alle vliegtuigen
      van de klasse 2Z en alle overige vliegtuigen van de klasse 2Z zonder drukcabine.

      7 De houder van een AML met de bijzondere bevoegdverklaring als bedoeld in [artikel 2][ref1] of
      [3, eerste lid][ref2], mits voorzien van een bijzondere bevoegdverklaring A en B dan wel C, is bevoegd dezelfde
      werkzaamheden, als waartoe de desbetreffende bijzondere bevoegdverklaring strekt, te verrichten aan een MLA, een
      MLH of een amateurbouwluchtvaartuig.

      8 De houder van een AML met bijzondere bevoegdverklaring AB als bedoeld in [artikel 2][ref3] of met de bijzondere
      bevoegdverklaringen A en B, bedoeld in [artikel 3, eerste lid][ref4], is bevoegd tot het mede ondertekenen van de
      verklaring als bedoeld in [artikel 4, derde lid, van de Regeling MLA’s][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0024644#Artikel2
