  - number: '6'
    text: |-
      1 De geldigheidsduur van een bijzondere bevoegdverklaring, bedoeld in [artikel 2][ref1] en [3][ref2], bedraagt ten
      hoogste twee jaren en kan vervolgens steeds met twee jaren worden verlengd.

      2 De geldigheidsduur van een bijzondere bevoegdverklaring wordt op aanvraag van de houder verlengd, nadat is
      aangetoond dat de aanvrager in de twee jaren onmiddellijk voorafgaande aan de datum van aanvraag, ten minste zes
      maanden ervaring heeft verkregen met het onderhoud waarvoor de bijzondere bevoegdverklaring vereist is.

      3 Een aanvraag voor verlenging wordt niet eerder dan twee maanden voor de vervaldatum van de bijzondere bevoegdheid
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0024644#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024644#Artikel3
    url: https://wetten.overheid.nl/BWBR0024644/2012-08-14#Artikel6
    references:
      - id: ref1
