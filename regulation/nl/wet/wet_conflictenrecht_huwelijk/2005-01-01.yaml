preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het mede in verband met de bekrachtiging van het op 14 maart 1978 te
    ’s-Gravenhage tot stand gekomen Verdrag inzake de voltrekking en de erkenning van de geldigheid van huwelijken,
    wenselijk is regelen te geven met betrekking tot het conflictenrecht inzake het huwelijk;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004619/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet is van toepassing op de huwelijksvoltrekking in Nederland indien, in verband met de nationaliteit of de
      woonplaats van de aanstaande echtgenoten, met betrekking tot de vraag welk recht de vereisten tot het aangaan van
      het huwelijk beheerst een keuze moet worden gedaan, alsmede op de erkenning in Nederland van in het buitenland
      voltrokken huwelijken. Deze wet is niet van toepassing op de bevoegdheid van de ambtenaar van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0004619/2005-01-01#Artikel1
  - number: '2'
    text: |-
      Het huwelijk wordt voltrokken

      a. indien ieder der aanstaande echtgenoten voldoet aan de vereisten tot het aangaan van een huwelijk van het
      Nederlandse recht en een van hen de Nederlandse nationaliteit bezit of in Nederland zijn gewone verblijfplaats
      heeft; of

      b. indien ieder der aanstaande echtgenoten voldoet aan de vereisten tot het aangaan van een huwelijk van de Staat
      waarvan hij de nationaliteit bezit. Bij het bezit van meer dan een nationaliteit geldt het recht van de Staat
      waarvan de betrokkene de nationaliteit bezit, waarmee hij alle omstandigheden in aanmerking genomen, de sterkste
      band heeft.
    url: https://wetten.overheid.nl/BWBR0004619/2005-01-01#Artikel2
  - number: '3'
    text: |-
      1 Ongeacht [artikel 2][ref1] kan geen huwelijk worden voltrokken indien die voltrekking onverenigbaar zou zijn met
      de openbare orde en in ieder geval indien:

      a. de aanstaande echtgenoten de leeftijd van vijftien jaren niet hebben bereikt;

      b. de aanstaande echtgenoten elkaar van nature of door adoptie bestaan in de rechte lijn of, van nature, als
      broeder en zuster;

      c. de vrije toestemming van een der aanstaande echtgenoten ontbreekt of de geestvermogens van een van hen zodanig
      is gestoord, dat hij niet in staat is zijn wil te bepalen of de betekenis van zijn verklaring te begrijpen;

      d. in strijd zou worden gehandeld met het voorschrift dat een persoon tegelijkertijd slechts met één andere persoon
      door het huwelijk verbonden kan zijn;

      e. in strijd zou worden gehandeld met het voorschrift dat zij die een huwelijk willen aangaan, niet tegelijkertijd
      door een geregistreerd partnerschap mogen zijn verbonden.

      2 De voltrekking van een huwelijk kan niet worden geweigerd op de grond dat volgens het recht van een Staat waarvan
      een van de aanstaande echtgenoten de nationaliteit bezit aan die voltrekking een beletsel in de weg staat dat in
      strijd is met de Nederlandse openbare orde.


      [ref1]: https://wetten.overheid.nl/BWBR0004619#Artikel2
    url: https://wetten.overheid.nl/BWBR0004619/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004619
        artikel: '2'
  - number: '4'
    text: |-
      Wat de vorm betreft kan een huwelijk in Nederland slechts rechtsgeldig worden voltrokken ten overstaan van de
      ambtenaar van de burgerlijke stand met inachtneming van het Nederlandse recht, behoudens de bevoegdheid van
      buitenlandse diplomatieke en consulaire ambtenaren om, in overeenstemming met de voorschriften van het recht van
      de door hen vertegenwoordigde staat, aan de voltrekking van huwelijken mede te werken indien geen der partijen
      uitsluitend of mede de Nederlandse nationaliteit bezit.
    url: https://wetten.overheid.nl/BWBR0004619/2005-01-01#Artikel4
  - number: '5'
    text: |-
      1 Een buiten Nederland gesloten huwelijk dat ingevolge het recht van de Staat waar van de huwelijksvoltrekking
      plaatsvond rechtsgeldig is of nadien rechtsgeldig is geworden, wordt als zodanig erkend.

      2 Een buiten Nederland ten overstaan van een diplomatieke of consulaire ambtenaar voltrokken huwelijk dat voldoet
      aan de vereisten van het recht van de Staat die die ambtenaar vertegenwoordigt, wordt als rechtsgeldig erkend
      tenzij die voltrekking in de Staat waar zij plaatsvond niet was toegestaan.

      3 Voor de toepassing van het eerste en tweede lid wordt onder recht mede begrepen de regels van internationaal
      privaatrecht.

      4 Een huwelijk wordt vermoed rechtsgeldig te zijn, indien een huwelijksverklaring is afgegeven door een bevoegde
      autoriteit.
    url: https://wetten.overheid.nl/BWBR0004619/2005-01-01#Artikel5
  - number: '6'
    text: |-
      Ongeacht [artikel 5][ref1] wordt aan een buiten Nederland gesloten huwelijk erkenning onthouden, indien deze
      erkenning onverenigbaar zou zijn met de openbare orde.


      [ref1]: https://wetten.overheid.nl/BWBR0004619#Artikel5
    url: https://wetten.overheid.nl/BWBR0004619/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004619
        artikel: '5'
  - number: '7'
    text: |-
      De [artikelen 5][ref1] en [6][ref2] zijn van toepassing, ongeacht of over de erkenning van de rechtsgeldigheid van
      een huwelijk als hoofdvraag, dan wel als voorvraag in verband met een andere vraag wordt beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0004619#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004619#Artikel6
    url: https://wetten.overheid.nl/BWBR0004619/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004619
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0004619
        artikel: '6'
  - number: '8'
    text: |-
      Deze wet is niet van toepassing op de erkenning van de geldigheid van huwelijken die zijn voltrokken voor de dag
      van haar inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0004619/2005-01-01#Artikel8
  - number: '9'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004619/2005-01-01#Artikel9
  - number: '10'
    text: Deze wet kan worden aangehaald als Wet conflictenrecht huwelijk.
    url: https://wetten.overheid.nl/BWBR0004619/2005-01-01#Artikel10
