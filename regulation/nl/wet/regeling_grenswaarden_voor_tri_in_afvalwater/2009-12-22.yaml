---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.4/schema/v0.5.4/schema.json
$id: regeling_grenswaarden_voor_tri_in_afvalwater
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2009-12-22'
valid_to: '2023-12-31'
bwb_id: BWBR0005377
url: https://wetten.overheid.nl/BWBR0005377/2009-12-22
preamble:
  text: |-
    Overwegende, dat het noodzakelijk is grenswaarden vast te stellen voor het brengen van TRI in oppervlaktewateren
    ter uitvoering van de richtlijn van de Raad van de Europese Gemeenschappen van 27 juli 1990, 90/415/EEG ( PbEG L
    219/49), tot wijziging van bijlage II bij Richtlijn 86/280/EEG betreffende grenswaarden en kwaliteitsdoelstellingen
    voor lozingen van bepaalde onder lijst I van de bijlage bij Richtlijn 76/464/EEG vallende gevaarlijke stoffen;
    Gelet op artikel 1a, derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005377/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. TRI: trichloorethyleen;

      b. PER: perchloorethyleen;

      c. verwerken van TRI: elk industrieel proces waarbij TRI of TRI bevattende stoffen worden geproduceerd, omgezet of
      gebruikt, of waarbij TRI of TRI bevattende stoffen vrijkomen;

      d. . bestaand bedrijf: bedrijf dat TRI verwerkt, dat op 31 juli 1991 in werking is en waarvan de capaciteit voor
      het verwerken van TRI na 31 juli 1991 niet aanzienlijk is uitgebreid;

      e. nieuw bedrijf: bedrijf dat TRI verwerkt en geen bestaand bedrijf is;

      f. bijlage I: bij deze regeling behorende [bijlage I][ref1];

      g. bijlage II: bij deze regeling behorende [bijlage II][ref2];

      h. *lozen:* brengen van:

      1°. stoffen in een oppervlaktewaterlichaam;

      2°. afvalwater of andere afvalstoffen in een openbaar hemelwaterstelsel, een openbaar ontwateringstelsel, een
      openbaar vuilwaterriool of een andere voorziening voor de inzameling en het transport van afvalwater, of

      3°. stoffen op een zuiveringtechnisch werk met behulp van een werk niet zijnde een voorziening voor de inzameling
      en het transport van afvalwater.


      [ref1]: https://wetten.overheid.nl/BWBR0005377
      [ref2]: https://wetten.overheid.nl/BWBR0005377
    url: https://wetten.overheid.nl/BWBR0005377/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005377
      - id: ref2
        bwb_id: BWBR0005377
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 6.3 van het Waterbesluit][ref1] en [artikel 8.40, eerste lid][ref2], in samenhang
      met [artikel 21.6, zesde lid, van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.40
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel21.6
    url: https://wetten.overheid.nl/BWBR0005377/2009-12-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '6.3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8.40'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '21.6'
  - number: '2'
    text: |-
      1 Voor een nieuw bedrijf gelden, als de hoogst toelaatbare gewichtshoeveelheid en concentratie TRI voorkomend in
      afvalwater dat wordt geloosd, de grenswaarden die overeenkomen met de waarden die het resultaat zijn van toepassing
      van de beste bestaande technieken, met dien verstande dat voor een nieuw bedrijf behorende tot een van de in
      [bijlage I][ref1] genoemde bedrijfstakken, die gewichtshoeveelheid en concentratie in ieder geval niet hoger is dan
      de in die bijlage opgenomen grenswaarde die op de betrokken bedrijfstak van toepassing is.

      2 De in het eerste lid laatstgenoemde grenswaarde geldt met ingang van de in [bijlage I][ref2] opgenomen datum die
      op de betrokken bedrijfstak en die grenswaarde van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005377
      [ref2]: https://wetten.overheid.nl/BWBR0005377
    url: https://wetten.overheid.nl/BWBR0005377/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005377
      - id: ref2
        bwb_id: BWBR0005377
    machine_readable:
      parameters:
        - name: bedrijfstype
          type: string
          description: Type van bedrijf (moet "nieuw bedrijf" zijn voor deze regeling).
        - name: sector_in_bijlage_I
          type: boolean
          description: Geeft aan of het bedrijf behoort tot een in bijlage I genoemde bedrijfstak.
        - name: datum_lozing
          type: date
          description: Datum waarop het lozen plaatsvindt.
      inputs:
        - name: grenswaarde_bijlage_I
          type: number
          description: TRI-grenswaarde voor de bedrijfstak uit bijlage I.
          open_terms:
            - name: bijlage_I_grenswaarde
              implements: De TRI-grenswaarde voor de bedrijfstak uit bijlage I.
              delegation_type: BIJLAGE
              delegated_to: bijlage I
        - name: datum_ingang_grenswaarde_bijlage_I
          type: date
          description: Datum waarop de grenswaarde uit bijlage I voor de bedrijfstak in werking treedt.
          open_terms:
            - name: bijlage_I_ingangsdatum
              implements: De ingangsdatum voor de grenswaarde uit bijlage I.
              delegation_type: BIJLAGE
              delegated_to: bijlage I
        - name: grenswaarde_beste_bestaande_technieken
          type: number
          description: TRI-grenswaarde gebaseerd op beste bestaande technieken.
          open_terms:
            - name: beste_bestaande_technieken_grenswaarde
              implements: De TRI-grenswaarde gebaseerd op beste bestaande technieken.
              delegation_type: ALGEMEEN_BESLUIT
      outputs:
        - name: max_toegestane_tri_gewichtshoeveelheid
          type: number
          description: Maximale toegestane gewichtshoeveelheid TRI in afvalwater.
        - name: max_toegestane_tri_concentratie
          type: number
          description: Maximale toegestane concentratie TRI in afvalwater.
      logic:
        - operation: IF
          cases:
            - condition:
                operation: AND
                conditions:
                  - operation: EQUALS
                    subject: $bedrijfstype
                    value: "nieuw bedrijf"
                  - operation: EQUALS
                    subject: $sector_in_bijlage_I
                    value: true
                  - operation: GREATER_THAN_OR_EQUAL
                    subject: $datum_lozing
                    value: $datum_ingang_grenswaarde_bijlage_I
              output:
                max_toegestane_tri_gewichtshoeveelheid: $grenswaarde_bijlage_I
                max_toegestane_tri_concentratie: $grenswaarde_bijlage_I
            - condition:
                operation: AND
                conditions:
                  - operation: EQUALS
                    subject: $bedrijfstype
                    value: "nieuw bedrijf"
                  - operation: EQUALS
                    subject: $sector_in_bijlage_I
                    value: false
              output:
                max_toegestane_tri_gewichtshoeveelheid: $grenswaarde_beste_bestaande_technieken
                max_toegestane_tri_concentratie: $grenswaarde_beste_bestaande_technieken
          default:
            max_toegestane_tri_gewichtshoeveelheid: null
            max_toegestane_tri_concentratie: null
  - number: '3'
    text: |-
      Voor een bestaand bedrijf gelden als de hoogst toelaatbare gewichtshoeveelheid en concentratie TRI voorkomend in
      afvalwater dat wordt geloosd:

      a. indien dat bedrijf behoort tot een van de in [bijlage I][ref1] genoemde bedrijfstakken: de in die bijlage voor
      die bedrijfstak opgenomen grenswaarde, met ingang van de in die bijlage opgenomen datum die daarop van toepassing
      is;

      b. indien dat bedrijf niet behoort tot een in [bijlage I][ref2] genoemde bedrijfstak: de grenswaarden die op
      31 januari 1992 overeenkomen met de waarden die het resultaat zijn van de toepassing van de beste bestaande
      technieken.


      [ref1]: https://wetten.overheid.nl/BWBR0005377
      [ref2]: https://wetten.overheid.nl/BWBR0005377
    url: https://wetten.overheid.nl/BWBR0005377/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005377
      - id: ref2
        bwb_id: BWBR0005377
    machine_readable:
      parameters:
        - name: bedrijfstype
          type: string
          description: Type van bedrijf (moet "bestaand bedrijf" zijn voor deze regeling).
        - name: sector_in_bijlage_I
          type: boolean
          description: Geeft aan of het bedrijf behoort tot een in bijlage I genoemde bedrijfstak.
        - name: datum_lozing
          type: date
          description: Datum waarop het lozen plaatsvindt.
      inputs:
        - name: grenswaarde_bijlage_I
          type: number
          description: TRI-grenswaarde voor de bedrijfstak uit bijlage I.
          open_terms:
            - name: bijlage_I_grenswaarde
              implements: De TRI-grenswaarde voor de bedrijfstak uit bijlage I.
              delegation_type: BIJLAGE
              delegated_to: bijlage I
        - name: datum_ingang_grenswaarde_bijlage_I
          type: date
          description: Datum waarop de grenswaarde uit bijlage I voor de bedrijfstak in werking treedt.
          open_terms:
            - name: bijlage_I_ingangsdatum
              implements: De ingangsdatum voor de grenswaarde uit bijlage I.
              delegation_type: BIJLAGE
              delegated_to: bijlage I
        - name: grenswaarde_beste_bestaande_technieken_1992
          type: number
          description: TRI-grenswaarde gebaseerd op beste bestaande technieken per 31 januari 1992.
          open_terms:
            - name: beste_bestaande_technieken_1992_grenswaarde
              implements: De TRI-grenswaarde gebaseerd op beste bestaande technieken per 31 januari 1992.
              delegation_type: ALGEMEEN_BESLUIT
      outputs:
        - name: max_toegestane_tri_gewichtshoeveelheid
          type: number
          description: Maximale toegestane gewichtshoeveelheid TRI in afvalwater.
        - name: max_toegestane_tri_concentratie
          type: number
          description: Maximale toegestane concentratie TRI in afvalwater.
      logic:
        - operation: IF
          cases:
            - condition:
                operation: AND
                conditions:
                  - operation: EQUALS
                    subject: $bedrijfstype
                    value: "bestaand bedrijf"
                  - operation: EQUALS
                    subject: $sector_in_bijlage_I
                    value: true
                  - operation: GREATER_THAN_OR_EQUAL
                    subject: $datum_lozing
                    value: $datum_ingang_grenswaarde_bijlage_I
              output:
                max_toegestane_tri_gewichtshoeveelheid: $grenswaarde_bijlage_I
                max_toegestane_tri_concentratie: $grenswaarde_bijlage_I
            - condition:
                operation: AND
                conditions:
                  - operation: EQUALS
                    subject: $bedrijfstype
                    value: "bestaand bedrijf"
                  - operation: EQUALS
                    subject: $sector_in_bijlage_I
                    value: false
              output:
                max_toegestane_tri_gewichtshoeveelheid: $grenswaarde_beste_bestaande_technieken_1992
                max_toegestane_tri_concentratie: $grenswaarde_beste_bestaande_technieken_1992
          default:
            max_toegestane_tri_gewichtshoeveelheid: null
            max_toegestane_tri_concentratie: null
  - number: '4'
    text: |-
      De wijze van meting van de gewichtshoeveelheid en concentratie TRI, bedoeld in de artikelen 2 en 3, dient ten
      minste te voldoen aan de in bijlage II daaraan gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005377/2009-12-22#Artikel4
    untranslatables:
      - description: De wijze van meting van TRI is proceduraal en niet machine-leesbaar ofensizeerbaar.
        legal_reference: Artikel 4
  - number: '5'
    text: Deze regeling treedt in werking met ingang van 31 januari 1992.
    url: https://wetten.overheid.nl/BWBR0005377/2009-12-22#Artikel5
  - number: '6'
    text: 'Deze regeling kan worden aangehaald als: Regeling grenswaarden voor TRI in afvalwater.'
    url: https://wetten.overheid.nl/BWBR0005377/2009-12-22#Artikel6
