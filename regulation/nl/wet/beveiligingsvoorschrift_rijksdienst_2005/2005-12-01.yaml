---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: beveiligingsvoorschrift_rijksdienst_2005
regulatory_layer: WET
publication_date: '2013-06-12'
valid_from: '2005-12-01'
bwb_id: BWBR0019196
url: https://wetten.overheid.nl/BWBR0019196/2005-12-01
preamble:
  text: |-
    Handelende in overeenstemming met het gevoelen van de ministerraad;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel1
  - number: 1.a
    text: |-
      minister: elke minister voor wat betreft het onder zijn leiding staande ministerie en de onder zijn
      verantwoordelijkheid werkzame instellingen, diensten of bedrijven;
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel1
  - number: 1.b
    text: |-
      secretaris-generaal: de ambtenaar genoemd in het
      [Besluit regeling functie en verantwoordelijkheid van de secretaris-generaal][ref1], dan wel diens plaatsvervanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004419
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004419
  - number: '2.1'
    text: |-
      Deze regeling geldt voor de ministeries, de onder verantwoordelijkheid van de minister werkzame instellingen,
      diensten en bedrijven.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel2
  - number: '2.2'
    text: |-
      Deze regeling is van toepassing op de beveiliging van de organisatie, medewerkers, materieel, informatiesystemen,
      gebouwen en overige objecten.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel2
  - number: '2.3'
    text: |-
      De secretaris-generaal kan bepalen dat deze regeling op dienstonderdelen met een bijzondere taak of delen van die
      dienstonderdelen niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel2
  - number: '3.1'
    text: |-
      De secretaris-generaal is verantwoordelijk voor de integrale beveiliging van de organisatie, medewerkers,
      materieel, informatiesystemen, gebouwen en overige objecten, en de inrichting en werking van de
      beveiligingsorganisatie.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel3
  - number: '3.2'
    text: |-
      Binnen de kaders te stellen door de secretaris-generaal is elk diensthoofd verantwoordelijk voor de integrale
      beveiliging van zijn dienstonderdeel, de inrichting en werking van de beveiligingsorganisatie evenals de zorg voor
      en de beveiliging van de informatie die aan zijn dienstonderdeel is toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel3
  - number: '4.1'
    text: |-
      De secretaris-generaal wijst een beveiligingsambtenaar aan die belast is met de integrale beveiliging van
      organisatie, medewerkers, materieel, informatiesystemen, gebouwen en overige objecten, alsmede het toezicht op de
      werking van de beveiligingsorganisatie en de informatiebeveiliging.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel4
  - number: '4.2'
    text: Er kan voor twee of meer ministeries één beveiligingsambtenaar wordt aangesteld.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel4
  - number: '4.3'
    text: |-
      De secretaris-generaal stelt de instructie voor de beveiligingsambtenaar vast, die tenminste de elementen van de
      voorbeeldinstructie in de bijlage van deze regeling bevat.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel4
  - number: '4.4'
    text: De aanstelling van de beveiligingsambtenaar wordt bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel4
  - number: '5.1'
    text: |-
      De beveiligingsambtenaar draagt, onverminderd het bepaalde in het
      [Voorschrift informatiebeveiliging rijksdienst-bijzondere informatie][ref1] 2004 (VIR-BI), zorg voor:


      [ref1]: https://wetten.overheid.nl/BWBR0016435
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016435
  - number: 5.1.a
    text: opstelling van het departementale integrale beveiligingsbeleid;
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel5
  - number: 5.1.b
    text: totstandkoming van de departementale risicoanalyse en het departementale integrale beveiligingsplan;
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel5
  - number: 5.1.c
    text: coördinatie van en toezicht op de beveiligingstaken van de hoofden van dienst;
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel5
  - number: 5.1.d
    text: initiëring van periodieke inspecties van de integrale beveiliging;
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel5
  - number: 5.1.e
    text: periodieke rapportage over de stand van de integrale beveiliging.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel5
  - number: '5.2'
    text: |-
      De beveiligingsambtenaar kan door de secretaris-generaal worden belast met aanvullende taken of bijzondere
      opdrachten.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel5
  - number: '5.3'
    text: |-
      De beveiligingsambtenaar kan namens de secretaris-generaal aanwijzingen geven aan iedere ambtenaar voor
      zover dat noodzakelijk is voor de uitvoering van het integrale beveiligingsbeleid en de naleving van de
      beveiligingsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel5
  - number: '6.1'
    text: De secretaris-generaal kan op voordracht van de beveiligingsambtenaar beveiligingscoördinatoren aanstellen.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel6
  - number: '6.2'
    text: |-
      De beveiligingscoördinator draagt namens zijn diensthoofd en binnen de door de beveiligingsambtenaar gestelde
      beleidskaders, voor zijn dienstonderdeel of dienstonderdelen zorg voor:
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel6
  - number: 6.2.a
    text: opstelling van uitvoeringsrichtlijnen voor het integrale beveiligingsbeleid;
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel6
  - number: 6.2.b
    text: totstandkoming van de risicoanalyse en het integrale beveiligingsplan;
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel6
  - number: 6.2.c
    text: coördinatie van en toezicht op de implementatie van beveiligingseisen en voorschriften bij het dienstonderdeel;
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel6
  - number: 6.2.d
    text: initiëring van periodieke inspecties van de integrale beveiliging;
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel6
  - number: 6.2.e
    text: |-
      periodieke rapportage over de stand van de integrale beveiliging aan het diensthoofd, de beveiligingsambtenaar en
      aan overige instanties belast met toezicht en controle op de beveiliging.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel6
  - number: '6.3'
    text: |-
      De beveiligingscoördinator kan namens zijn diensthoofd aanwijzingen geven aan ambtenaren in verband met de
      uitvoering van het integrale beveiligingsbeleid en de naleving van de beveiligingsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel6
  - number: '7.1'
    text: |-
      De beveiligingsambtenaren vormen het Coördinerend Beraad Integrale Beveiliging, dat tot taak heeft het SG-beraad te
      adviseren over:
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel7
  - number: 7.1.a
    text: inrichting en werking van de voorbeeldinstructie;
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel7
  - number: 7.1.b
    text: inhoud en werking van de beveiligingsorganisatie;
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel7
  - number: 7.1.c
    text: ontwikkeling van definities, normen en criteria voor integrale beveiliging;
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel7
  - number: 7.1.d
    text: afstemming van beveiligingsmaatregelen die het ministerie overstijgen.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel7
  - number: '7.2'
    text: De leden kiezen om de drie jaar uit hun midden een voorzitter.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel7
  - number: '8'
    text: |-
      In het geval van een inbreuk op de beveiliging of een vermoeden daarvan neemt de beveiligingsambtenaar, een
      beveiligingscoördinator dan wel een functionaris belast met beveiliging onverwijld maatregelen om de beveiliging te
      herstellen en herhaling te voorkomen.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel8
  - number: '9.1'
    text: Het Beveiligingsvoorschrift 1949 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel9
  - number: '9.2'
    text: Dit besluit treedt in werking met ingang van 1 december 2005 en werkt terug tot en met 1 mei 2005.
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel9
  - number: '9.3'
    text: 'Dit besluit wordt aangehaald als: Beveiligingsvoorschrift rijksdienst 2005.'
    url: https://wetten.overheid.nl/BWBR0019196/2005-12-01#Artikel9
