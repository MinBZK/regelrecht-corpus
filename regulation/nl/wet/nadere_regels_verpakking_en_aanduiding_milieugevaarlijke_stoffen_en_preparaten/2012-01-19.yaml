  - number: 15c
    text: |-
      1 Onverminderd het bepaalde in de [artikelen 14][ref1], [15a][ref2] en [15b][ref3] worden op het etiket voor
      bestrijdingsmiddelen duidelijk leesbaar en onuitwisbaar vermeld:

      a. het door het College voor de toelating van gewasbeschermingsmiddelen en biociden als bedoeld in
      [artikel 3 van de Wet gewasbeschermingsmiddelen en biociden][ref4] aan het bestrijdingsmiddel toegekende
      toelatings- of registratienummer;

      b. de aard van het preparaat, zoals bijvoorbeeld vloeibaar concentraat, korrels, poeder, vaste stof, spuitpoeder of
      emulgeerbaar concentraat;

      c. de toepassingen waarvoor het bestrijdingsmiddel is toegelaten, zoals bijvoorbeeld houtconservering, desinfectie,
      oppervlaktebiocide, aangroeibestrijding, insecticide, groeiregulator of herbicide;

      d. voor ieder in de toelatingsvoorwaarden vermeld gebruik, de gebruiksaanwijzing en de in metrieke eenheden
      uitgedrukte dosering;

      e. aanwijzingen voor het verlenen van eerste hulp;

      f. de zin ‘Voor gebruik de bijgevoegde gebruiksaanwijzing lezen’, indien een bijsluiter wordt bijgevoegd;

      g. aanwijzingen voor een veilige verwijdering van het bestijdingsmiddel en de verpakking ervan;

      h. het partijnummer van het preparaat; en waar van toepassing:

      i. de categorieën gebruikers die het bestrijdingsmiddel mogen gebruiken;

      j. het in [bijlage III][ref5] bij deze regeling opgenomen kca-logo, dat strekt tot aanduiding van het gescheiden
      houden en gescheiden afgeven van producten die in het afvalstadium klein chemisch afval zijn, voor zover het
      betreft een bestrijdingsmiddel bestemd voor huishoudelijk gebruik.

      2 Het eerste lid, onderdeel j, is niet van toepassing:

      a. op bestrijdingsmiddelen die uitsluitend uit micro-organismen of virussen bestaan;

      b. op bestrijdingsmiddelen die in de [Regeling Europese afvalstoffenlijst][ref6] niet zijn aangewezen als
      gevaarlijke afvalstof;

      c. Indien de verpakking is voorzien van een aanduiding die in een lidstaat van de Europese Unie van overheidswege
      is vastgesteld ter zake van het gescheiden houden en gescheiden afgeven van gewasbeschermingsmiddelen die in het
      afvalstadium klein chemisch afval zijn.

      3 Onverminderd overige informatieverplichtingen worden monsters, modellen of ontwerpen van de verpakking, de
      etiketten en de bijsluiters verstrekt aan het College voor de toelating van gewasbeschermingsmiddelen en biociden
      als bedoeld in [artikel 3 van de Wet gewasbeschermingsmiddelen en biociden][ref7] in het kader van de toelating
      of registratie.

      4 De verpakking van een bestrijdingsmiddel is zodanig verzegeld dat deze niet zonder beschadiging van de
      verzegeling geopend kan worden. Dit geldt niet voor die middelen welke in afwijking van het verbod, gesteld
      in [artikel 2, eerste lid, van het Bestrijdingsmiddelenbesluit][ref8], voorhanden of in voorraad gehouden of
      afgeleverd mogen worden in een andere verpakking dan die waarin zij hier te lande voor de eerste maal in het
      verkeer zijn gebracht.

      5 Het verbod, gesteld in [artikel 2, eerste lid, van het Bestrijdingsmiddelenbesluit][ref9] geldt niet voor zover
      zulks bij de toelating of registratie van het biocide is bepaald.


