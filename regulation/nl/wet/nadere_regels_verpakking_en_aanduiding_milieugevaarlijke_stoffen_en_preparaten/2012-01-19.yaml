  - number: '13'
    text: |-
      1 De gevaren van een preparaat voor het milieu worden beoordeeld volgens een of meer van de volgende procedures:

      a. via de in bijlage III bij de preparatenrichtlijn beschreven conventionele methode,

      b. door de bepaling van de milieugevaarlijke eigenschappen van het preparaat op grond waarvan dit naar behoren
      kan worden ingedeeld overeenkomstig de criteria van bijlage VI bij de stoffenrichtlijn. Deze eigenschappen
      worden bepaald met de in bijlage V, deel C, bij de stoffenrichtlijn omschreven methoden tenzij, in het geval van
      gewasbeschermingsmiddelen, andere internationaal erkende methoden aanvaardbaar zijn overeenkomstig de bepalingen
      van de bijlagen II en III bij de gewasbeschermingsmiddelenrichtlijn. Onverminderd de testvoorschriften van
      de gewasbeschermingsmiddelenrichtlijn wordt voldaan aan de voorwaarden voor de toepassing van de testmethoden
      beschreven in bijlage III, deel C, bij de preparatenrichtlijn.

      2 Wanneer een ecotoxologische eigenschap door middel van een van de in het eerste lid, onderdeel b, genoemde
      methoden is vastgesteld, worden nieuwe gegevens verzameld met behulp van proeven die worden verricht overeenkomstig
      de goede laboratoriumpraktijken van [richtlijn nr. 2004/10/EEG](32004L0010) van het Europees Parlement en de Raad
      van 11 februari 2004 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen
      inzake de toepassing van de beginselen van goede laboratoriumpraktijken en het toezicht op de toepassing ervan
      voor tests op chemische stoffen (PbEG L 50), en de bepalingen van [richtlijn nr. 86/609/EEG](31986L0609) van de
      Raad van 24 november 1986 inzake de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen van
      de Lidstaten betreffende de bescherming van dieren die voor experimentele en andere wetenschappelijke doeleinden
      worden gebruikt (PbEG L 358).

      3 Het resultaat van de in het eerste lid, onderdeel b, bedoelde methode is bepalend voor de indeling van het
      preparaat wanneer de gevaren voor het milieu door middel van beide methoden, bedoeld in het eerste lid, zijn
      vastgesteld.

      4 Met de in het eerste lid 1, onderdelen a of b, bedoelde methoden vindt een nieuwe beoordeling plaats van de
      gevaren voor het milieu van preparaten waarvan de samenstelling bekend is, indien:

      a. de fabrikant de in gewichts- of volumeprocent uitgedrukte oorspronkelijke concentratie van een of meer voor het
      milieu gevaarlijke bestanddelen van het preparaat met een groter percentage wijzigt dan het percentage opgenomen in
      [bijlage II][ref1] bij deze regeling;

      b. de fabrikant de samenstelling van het preparaat wijzigt door vervanging of toevoeging van een of meer
      bestanddelen die al dan niet gevaarlijk zijn in de zin van [artikel 9.2.3.1, tweede lid, van de wet][ref2].

      5 Het vierde lid is niet van toepassing indien:

      a. er sprake is van onder de gewasbeschermingsmiddelenrichtlijn vallende preparaten, die aan de hand van de in het
      eerste lid, onderdeel b, genoemde methode zijn ingedeeld;

      b. er goede wetenschappelijke aanwijzingen zijn dat een nieuwe beoordeling van de gevaren niet tot een andere
      indeling zal leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0004284
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9.2.3.1
