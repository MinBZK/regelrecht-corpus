  - number: '14'
    text: |-
      1 Onverminderd het bepaalde in [artikel 1a, eerste lid, van het besluit][ref1], worden op elke verpakking van een
      preparaat de volgende aanduidingen duidelijk leesbaar en onuitwisbaar aangebracht:

      a. de benaming of handelsnaam van het preparaat;

      b. de naam en het volledig adres, inclusief telefoonnummer, van degene die verantwoordelijk is voor het in de
      handel brengen van het preparaat en gevestigd is in de Gemeenschap, ongeacht of deze de fabrikant, de importeur of
      de distributeur is;

      c. de chemische benaming van de in het preparaat aanwezige stof(fen), en wel als volgt:

      1°. voor preparaten die overeenkomstig artikel 12 als T+, T of X zijn ingedeeld, wordt alleen rekening gehouden met
      de T+-, T- of X-stoffen die aanwezig zijn in een concentratie welke gelijk is aan of groter is dan hun respectieve
      laagste grenswaarde (de X-grens) zoals vastgesteld in deel 3 van bijlage VI bij verordening (EG) nr. 1272/2008 of,
      bij gebreke daarvan in bijlage II, deel B bij de preparatenrichtlijn;

      2°. voor preparaten die overeenkomstig artikel 12 als C zijn ingedeeld, wordt alleen rekening gehouden met de C-
      stoffen die aanwezig zijn in een concentratie welke gelijk is aan of groter is dan hun laagste grenswaarde de (de
      X-grens) zoals vastgesteld in deel 3 van bijlage VI bij verordening (EG) nr. 1272/2008 of, bij gebreke daarvan, in
      bijlage II, deel B, bij de preparatenrichtlijn;

      3°. op het etiket wordt de benaming vermeld van de stof of stoffen op grond waarvan het preparaat is ingedeeld in
      een of meer van de volgende gevarencategorieën:

        - kankerverwekkend, categorie 1, 2 of 3;
        - mutageen, categorie 1, 2 of 3;
        - voor de voortplanting vergiftig, categorie 1, 2 of 3;
        - zeer vergiftig, vergiftig of schadelijk op grond van niet-letale effecten na één blootstelling;
        - vergiftig of schadelijk op grond van ernstige effecten na herhaalde of langdurige blootstelling;
        - sensibiliserend;

      4°. in de vorm van een van de in deel 3 van bijlage VI bij verordening (EG) nr. 1272/2008 of, als de stof nog niet
      in die bijlage is opgenomen, in een internationaal erkende chemische nomenclatuur opgenomen, benamingen.

      d. de nominale massa of het nominale volume wanneer het preparaten betreft die aan het grote publiek worden
      aangeboden.

      2 In afwijking van het eerste lid, onderdeel c, ten eerste tot en met ten derde, behoeft niet op het etiket of op
      de verpakking te worden vermeld de naam van de stof op grond waarvan het preparaat is ingedeeld in een categorie
      als bedoeld in [artikel 9.2.3.1, tweede lid, onder a tot en met e, j en o, van de wet][ref2].

      3 In afwijking van het eerste lid, onderdeel c, eerste tot en met derde subonderdeel, kan worden volstaan met het
      op de verpakking vermelden van maximaal vier scheikundige benamingen voor de identificatie van de stoffen die in
      hoofdzaak verantwoordelijk zijn voor de grote gevaren voor de gezondheid welke hebben geleid tot de indeling en
      de keuze van de bijbehorende standaardzinnen ter aanduiding van de bijzondere gevaren. In bepaalde gevallen kunnen
      meer dan vier scheikundige benamingen noodzakelijk zijn.

      4 De gevaarsymbolen, voorzover die in de preparatenrichtlijn zijn vastgesteld, en de aanduidingen van de aan het
      gebruik van het preparaat verbonden gevaren die op de verpakking moeten worden vermeld, zijn in overeenstemming
      met de aanwijzingen van bijlage II en bijlage VI bij de stoffenrichtlijn en worden aangebracht overeenkomstig de
      resultaten van de in de bijlagen I, II en III bij de preparatenrichtlijn beschreven beoordeling van de gevaren.

      5 In afwijking van het vierde lid is, wanneer aan een preparaat meer dan een gevaarsymbool wordt toegekend:

      a. het aanbrengen op de verpakking van de symbolen C en X niet verplicht indien de verplichting bestaat het symbool
      T op de verpakking aan te brengen;

      b. het aanbrengen van het symbool X op de verpakking niet verplicht indien de verplichting bestaat het symbool C
      op de verpakking aan te brengen, behoudens andersluidende bepalingen van deel 3 van bijlage VI bij verordening (EG)
      nr. 1272/2008;

      c. het aanbrengen van de symbolen F en O op de verpakking niet verplicht indien de verplichting bestaat het symbool
      E op de verpakking aan te brengen;

      d. het aanbrengen van het symbool X op de verpakking niet verplicht indien de verplichting bestaat het symbool X op
      de verpakking aan te brengen.

      6 De symbolen worden in zwart op oranjegele achtergrond gedrukt.

      7 De waarschuwingszinnen ter aanduiding van de bijzondere gevaren zijn in overeenstemming met de aanwijzingen van
      bijlage III en bijlage VI bij de stoffenrichtlijn en worden aangebracht overeenkomstig de resultaten van de in
      de bijlagen I, II en III bij de preparatenrichtlijn beschreven beoordeling van het gevaar. Op de verpakking kan
      worden volstaan met het vermelden van ten hoogste zes waarschuwingszinnen ter aanduiding van de gevaren, voor zover
      die waarschuwingszinnen niet gerelateerd zijn aan bestrijdingsmiddelen. De in bijlage III bij de stoffenrichtlijn
      opgenomen combinatiezinnen worden telkens als één zin geteld.

      8 Indien een preparaat tegelijk tot meer dan een gevarencategorie behoort, omvatten de standaardzinnen op de
      verpakking alle belangrijke gevaren, die aan het preparaat zijn verbonden. In dat geval geldt de beperking tot ten
      hoogste zes waarschuwingszinnen, als bedoeld in het zevende lid ter aanduiding van de gevaren, niet.

      9 De vermelding op de verpakking van de waarschuwingszinnen ‘zeer licht ontvlambaar’ of ‘licht ontvlambaar’ kan
      achterwege blijven bij een gevaaraanduiding die wordt aangebracht in overeenstemming met het vierde en vijfde lid.

      10 De veiligheidsaanbevelingen op de verpakking zijn in overeenstemming met de aanwijzingen van bijlage IV en met
      bijlage VI bij de stoffenrichtlijn en worden aangebracht naar gelang van de resultaten van de in bijlagen I, II
      en III bij de preparatenrichtlijn beschreven beoordeling van het gevaar. Op de verpakking kan volstaan worden met
      het vermelden van ten hoogste zes zinnen voor het formuleren van de meest aangewezen veiligheidsaanbeveilingen,
      voor zover die veiligheidsaanbevelingen niet gerelateerd zijn aan bestrijdingsmiddelen. De in bijlage IV bij de
      stoffenrichtlijn opgenomen combinatiezinnen worden telkens als één zin geteld.

      11 Wanneer het praktisch gezien niet mogelijk is de veiligheidsaanbevelingen voor het gebruik van het preparaat op
      het etiket of op de verpakking zelf aan te brengen, worden zij bij de verpakking gevoegd.

      12 Wanneer een verpakking niet meer dan 125 ml kan bevatten, behoeven:

      a. bij preparaten die zijn ingedeeld als licht ontvlambaar, oxiderend, irriterend, met uitzondering van de
      preparaten waaraan waarschuwingszin R41 is toegekend, of als milieugevaarlijk en waaraan het N-symbool is
      toegekend, de waarschuwingszinnen en de veiligheidsaanbevelingen niet te worden vermeld;

      b. bij preparaten die zijn ingedeeld als ontvlambaar of milieugevaarlijk en waaraan het N-symbool niet is
      toegekend, de veiligheidsaanbevelingen niet te worden vermeld.

      13 Onverminderd het eerste tot en met twaalfde lid worden preparaten die zijn ingedeeld in een categorie als
      bedoeld in [artikel 9.2.3.1, tweede lid, van de wet][ref3], slechts in de handel gebracht indien de kenmerking op
      de verpakking voldoet aan de op het desbetreffende preparaat betrekking hebbende bepalingen van bijlage V, deel A
      en B bij de preparatenrichtlijn.

      14 Onverminderd het eerste lid, onderdelen a en b, worden preparaten die niet zijn ingedeeld in een categorie als
      bedoeld in [artikel 9.2.3.1, tweede lid, van de wet][ref4] maar die desondanks specifiek gevaar kunnen opleveren,
      slechts in de handel gebracht indien de kenmerking op de verpakking voldoet aan de op het desbetreffende preparaat
      betrekking hebbende bepalingen van bijlage V, deel B en C bij de preparatenrichtlijn.


