preamble:
  text: |-
    Gelet op artikel 36, derde en vierde lid, van de Wet milieugevaarlijke stoffen (Stb. 1985, 639) en 6, eerste lid,
    onder b, en tweede lid, van het Besluit verpakking en aanduiding milieugevaarlijke stoffen (Stb. 1987, 516);

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *wet:*


              [Wet milieubeheer][ref1];



            b

              *besluit:*


              [Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref2];



            c

              *stoffenrichtlijn:*


              [richtlijn nr. 67/548/EEG](31967L0548) van de Raad van de Europese Gemeenschappen van 27 juni 1967
      betreffende de aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake de indeling, de verpakking en
      het kenmerken van gevaarlijke stoffen (PbEG L 196);



            d

              *preparatenrichtlijn:*


              [richtlijn nr. 1999/45/EG](31999L0045) van het Europees Parlement en de Raad van de Europese Unie van 31
      mei 1999 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen van de Lidstaten
      inzake de indeling, de verpakking en het kenmerken van gevaarlijke preparaten (PbEG L 200);



            e
            gewasbeschermingsmiddelenrichtlijn:

              [richtlijn nr. 91/414/EEG](31991L0414) van de Raad van de Europese Gemeenschappen van 15 juli 1991
      betreffende het op de markt brengen van gewasbeschermingsmiddelen (PbEG L 230);



            f
            verordening (EG) nr. 1272/2008:

              verordening (EG) nr. 1272/2008 van het Europees Parlement en de Raad van 16 december 2008 betreffende de
      indeling, etikettering en verpakking van stoffen en mengsels tot wijziging en intrekking van Richtlijnen 67/548/EEG
      en 1999/45/EG en tot wijziging van Verordening (EG) nr. 1907/2006 (PbEU L 353).


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0004220
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0004220
  - number: '2'
    text: |-
      Onder de aan het gebruik van de stof verbonden gevaren als bedoeld in
      [artikel 1, eerste lid, onderdeel ag, van het Oplosmiddelenbesluit omzetting EG-VOS-richtlijn milieubeheer][ref1]
      worden verstaan de gevaren, bedoeld in bijlage I, delen 2 tot en met 5, van verordening (EG) nr. 1272/2008.


      [ref1]: https://wetten.overheid.nl/BWBR0012337#Artikel1
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012337
        artikel: '1'
  - number: '10.1'
    text: |-
      Voor de indeling van een preparaat in een categorie als bedoeld in [artikel 9.2.3.1, tweede lid, van de wet][ref1]
      wordt rekening gehouden met alle in het preparaat aanwezige stoffen, die zijn ingedeeld in een categorie als
      bedoeld in [artikel 9.2.3.1, tweede lid, van de wet][ref2], ongeacht of het onzuiverheden dan wel additieven
      betreft, wanneer hun concentratie gelijk is aan of groter dan de grenswaarden in [bijlage I][ref3] bij deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004284
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0004284
  - number: '10.2'
    text: |-
      De in het eerste lid bedoelde grenswaarden zijn niet van toepassing indien er lagere grenswaarden zijn vastgesteld
      in deel 3 van bijlage VI bij verordening (EG) nr. 1272/2008 dan wel in bijlage II, deel B, of in bijlage III, deel
      B bij de preparatenrichtlijn, tenzij anders gespecificeerd in bijlage V bij de preparatenrichtlijn.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel10
  - number: '11.1'
    text: |-
      De gevaren van een preparaat die voortvloeien uit de fysisch-chemische eigenschappen ervan worden beoordeeld door
      met de in bijlage V, deel A, bij de stoffenrichtlijn aangegeven methode deze eigenschappen van het preparaat te
      bepalen op grond waarvan het naar behoren kan worden ingedeeld en gekenmerkt overeenkomstig de criteria van bijlage
      VI bij de stoffenrichtlijn.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel11
  - number: '11.2'
    text: 'De in het eerste lid genoemde beoordeling kan achterwege blijven indien:'
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel11
  - number: 11.2.a
    text: |-
      geen enkel bestanddeel van dat preparaat is ingedeeld in een categorie als bedoeld in
      [artikel 9.2.3.1, tweede lid, onderdelen a tot en met e, van de wet][ref1] en het volgens de gegevens waarover de
      fabrikant beschikt weinig waarschijnlijk is dat bij het preparaat een dergelijk gevaar aanwezig is;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 11.2.b
    text: |-
      in het geval van wijziging van de samenstelling van een preparaat met bekende samenstelling, er wetenschappelijke
      aanwijzingen zijn dat een nieuwe beoordeling van de gevaren niet tot een wijziging van de indeling zal leiden;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel11
  - number: 11.2.c
    text: |-
      het preparaten betreft die in de vorm van aërosolen in de handel zijn gebracht en die voldoen aan de bepalingen
      van artikel 9 bis van [richtlijn nr. 75/324/EEG](31975L0324) van de Raad van 20 mei 1975 inzake de onderlinge
      aanpassing van de wetgevingen van de Lidstaten betreffende aërosols (PbEG L 147).
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel11
  - number: '11.3'
    text: |-
      In gevallen waarin de methoden van bijlage V, deel A, bij de stoffenrichtlijn niet geschikt zijn, worden de in
      bijlage I, deel B, bij de preparatenrichtlijn beschreven alternatieve berekeningsmethoden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel11
  - number: '11.4'
    text: |-
      Op de vrijstelling van de toepassing van de methoden van bijlage V, deel A van de stoffenrichtlijn is bijlage I,
      deel A, bij de preparatenrichtlijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel11
  - number: '11.5'
    text: |-
      De gevaren die voortvloeien uit de fysisch-chemische eigenschappen van een onder de
      gewasbeschermingsmiddelenrichtlijn vallend preparaat worden beoordeeld door de fysisch-chemische eigenschappen
      ervan te bepalen op grond waarvan het naar behoren kan worden ingedeeld overeenkomstig de criteria van bijlage
      VI bij de stoffenrichtlijn. Deze fysisch-chemische eigenschappen worden bepaald met de in bijlage V, deel A,
      bij de stoffenrichtlijn omschreven methoden, tenzij andere internationaal erkende methoden aanvaardbaar zijn in
      overeenstemming met de bepalingen van de bijlagen II en III bij gewasbeschermingsmiddelenrichtlijn
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel11
  - number: '12.1'
    text: 'De gevaren van een preparaat voor de gezondheid worden beoordeeld volgens een of meer van de volgende procedures:'
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: 12.1.a
    text: via een in bijlage II bij de preparatenrichtlijn beschreven conventionele methode,
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: 12.1.b
    text: |-
      door de bepaling van de toxicologische eigenschappen van het preparaat zodat het op passende wijze kan
      worden ingedeeld overeenkomstig de criteria van bijlage VI bij de stoffenrichtlijn. Deze eigenschappen worden
      bepaald met de methoden van bijlage V, deel B, bij de stoffenrichtlijn, tenzij, in het geval van een onder de
      gewasbeschermingsmiddelenrichtlijn vallend preparaat, andere internationaal erkende methoden aanvaardbaar zijn in
      overeenstemming met de bepalingen van de bijlagen II en III bij de gewasbeschermingsmiddelenrichtlijn.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: '12.2'
    text: 'De methoden, bedoeld in het eerste lid, onderdeel b, worden uitsluitend gebruikt, in het geval:'
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: 12.2.a
    text: |-
      zij overeenkomstig artikel 12 van [richtlijn nr. 86/609/EEG](31986L0609) van de Raad van 24 november 1986 inzake
      de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen van de Lidstaten betreffende de
      bescherming van dieren die voor experimentele en andere wetenschappelijke doeleinden worden gebruikt (PbEG L 358)
      gerechtvaardigd of specifiek toegestaan zijn, onverminderd de bepalingen van de gewasbeschermingsmiddelenrichtlijn,
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: 12.2.b
    text: |-
      wanneer degene die verantwoordelijk is voor het in de handel brengen van het preparaat, wetenschappelijk kan
      aantonen dat de toxicologische eigenschappen van het preparaat niet correct kunnen worden bepaald met de in het
      eerste lid, onderdeel a, bedoelde methode, of aan de hand van bestaande resultaten van proeven met dieren.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: '12.3'
    text: |-
      Wanneer een toxicologische eigenschap wordt vastgesteld met de in het eerste lid, onderdeel b, beschreven
      methoden voor het verkrijgen van nieuwe gegevens, wordt de proef uitgevoerd overeenkomstig de beginselen van goede
      laboratoriumpraktijken zoals vastgesteld bij [richtlijn nr. 2004/10/EG](32004L0010) van het Europees Parlement
      en de Raad van 11 februari 2004 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke
      bepalingen inzake de toepassing van de beginselen van goede laboratoriumpraktijken en het toezicht op de toepassing
      ervan voor tests op chemische stoffen (PbEG L 50), zoals vastgesteld bij [richtlijn nr. 86/609/EEG](31986L0609) van
      de Raad van 24 november 1986 inzake de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen
      van de Lidstaten betreffende de bescherming van dieren die voor experimentele en andere wetenschappelijke
      doeleinden worden gebruikt (PbEG L 358), en met name de artikelen 7 en 12 van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: '12.4'
    text: |-
      Wanneer een toxicologische eigenschap is vastgesteld met zowel een methode als bedoeld in het eerste lid, onderdeel
      a, als met een methode als bedoeld in het eerste lid, onderdeel b, worden de resultaten van de in het eerste lid,
      onderdeel b, beschreven methoden gebruikt voor het indelen van het preparaat.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: '12.5'
    text: |-
      In afwijking van het vierde lid is, onder voorbehoud van het zesde en zevende lid, in het geval van carcinogene,
      mutagene of voor de voortplanting vergiftige effecten uitsluitend het eerste lid, onderdeel a, van toepassing.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: '12.6'
    text: |-
      Een preparaat wordt ingedeeld op basis van de effecten op de mens wanneer, door epidemiologische studies, door
      wetenschappelijk gefundeerde casestudies zoals omschreven in bijlage VI bij de stoffenrichtlijn of door statistisch
      onderbouwde ervaring, zoals de beoordeling van gegevens van gifcentra of over beroepsziekten, wordt aangetoond, dat
      de toxicologische effecten op de mens anders zijn dan op grond van toepassing van de methoden van het eerste lid te
      verwachten is.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: '12.7'
    text: |-
      Bij de indeling van het preparaat wordt rekening gehouden met verschijnselen als potentiëring of antagonisme,
      wanneer wordt aangetoond dat het toxicologische gevaar bij een conventionele beoordeling ten gevolge van deze
      verschijnselen wordt onderschat onderscheidenlijk overschat.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: '12.8'
    text: |-
      Met de in het eerste lid, onderdelen a of b, genoemde methoden vindt een nieuwe beoordeling plaats van de gevaren
      voor de gezondheid van preparaten waarvan de samenstelling bekend is, indien:
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: 12.8.a
    text: |-
      de fabrikant de in gewichts- of volumeprocent uitgedrukte oorspronkelijke concentratie van een of meer voor
      de gezondheid gevaarlijke bestanddelen van het preparaat met een groter percentage wijzigt dan het percentage
      opgenomen in [bijlage II][ref1] bij deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0004284
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004284
  - number: 12.8.b
    text: |-
      de fabrikant de samenstelling van het preparaat wijzigt door vervanging of toevoeging van een of meer bestanddelen
      die al dan niet gevaarlijk zijn in de zin van [artikel 9.2.3.1, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '12.9'
    text: 'Het achtste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: 12.9.a
    text: |-
      er sprake is van onder de gewasbeschermingsmiddelenrichtlijn vallende preparaten, die aan de hand van de in het
      eerste lid, onderdeel b, genoemde methode zijn ingedeeld;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: 12.9.b
    text: |-
      er goede wetenschappelijke aanwijzingen zijn dat een nieuwe beoordeling van de gevaren niet tot een andere indeling
      zal leiden.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel12
  - number: '13.1'
    text: 'De gevaren van een preparaat voor het milieu worden beoordeeld volgens een of meer van de volgende procedures:'
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel13
  - number: 13.1.a
    text: via de in bijlage III bij de preparatenrichtlijn beschreven conventionele methode,
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel13
  - number: 13.1.b
    text: |-
      door de bepaling van de milieugevaarlijke eigenschappen van het preparaat op grond waarvan dit naar behoren kan
      worden ingedeeld overeenkomstig de criteria van bijlage VI bij de stoffenrichtlijn. Deze eigenschappen worden
      bepaald met de in bijlage V, deel C, bij de stoffenrichtlijn omschreven methoden tenzij, in het geval van
      gewasbeschermingsmiddelen, andere internationaal erkende methoden aanvaardbaar zijn overeenkomstig de bepalingen
      van de bijlagen II en III bij de gewasbeschermingsmiddelenrichtlijn. Onverminderd de testvoorschriften van
      de gewasbeschermingsmiddelenrichtlijn wordt voldaan aan de voorwaarden voor de toepassing van de testmethoden
      beschreven in bijlage III, deel C, bij de preparatenrichtlijn.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel13
  - number: '13.2'
    text: |-
      Wanneer een ecotoxologische eigenschap door middel van een van de in het eerste lid, onderdeel b, genoemde methoden
      is vastgesteld, worden nieuwe gegevens verzameld met behulp van proeven die worden verricht overeenkomstig de goede
      laboratoriumpraktijken van [richtlijn nr. 2004/10/EEG](32004L0010) van het Europees Parlement en de Raad van 11
      februari 2004 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake de
      toepassing van de beginselen van goede laboratoriumpraktijken en het toezicht op de toepassing ervan voor tests
      op chemische stoffen (PbEG L 50), en de bepalingen van [richtlijn nr. 86/609/EEG](31986L0609) van de Raad van 24
      november 1986 inzake de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen van de Lidstaten
      betreffende de bescherming van dieren die voor experimentele en andere wetenschappelijke doeleinden worden gebruikt
      (PbEG L 358).
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel13
  - number: '13.3'
    text: |-
      Het resultaat van de in het eerste lid, onderdeel b, bedoelde methode is bepalend voor de indeling van het
      preparaat wanneer de gevaren voor het milieu door middel van beide methoden, bedoeld in het eerste lid, zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel13
  - number: '13.4'
    text: |-
      Met de in het eerste lid 1, onderdelen a of b, bedoelde methoden vindt een nieuwe beoordeling plaats van de gevaren
      voor het milieu van preparaten waarvan de samenstelling bekend is, indien:
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel13
  - number: 13.4.a
    text: |-
      de fabrikant de in gewichts- of volumeprocent uitgedrukte oorspronkelijke concentratie van een of meer voor het
      milieu gevaarlijke bestanddelen van het preparaat met een groter percentage wijzigt dan het percentage opgenomen in
      [bijlage II][ref1] bij deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0004284
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004284
  - number: 13.4.b
    text: |-
      de fabrikant de samenstelling van het preparaat wijzigt door vervanging of toevoeging van een of meer bestanddelen
      die al dan niet gevaarlijk zijn in de zin van [artikel 9.2.3.1, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '13.5'
    text: 'Het vierde lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel13
  - number: 13.5.a
    text: |-
      er sprake is van onder de gewasbeschermingsmiddelenrichtlijn vallende preparaten, die aan de hand van de in het
      eerste lid, onderdeel b, genoemde methode zijn ingedeeld;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel13
  - number: 13.5.b
    text: |-
      er goede wetenschappelijke aanwijzingen zijn dat een nieuwe beoordeling van de gevaren niet tot een andere indeling
      zal leiden.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel13
  - number: '14.1'
    text: |-
      Onverminderd het bepaalde in [artikel 1a, eerste lid, van het besluit][ref1], worden op elke verpakking van een
      preparaat de volgende aanduidingen duidelijk leesbaar en onuitwisbaar aangebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0004220#Artikel1a
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004220
        artikel: 1a
  - number: 14.1.a
    text: de benaming of handelsnaam van het preparaat;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: 14.1.b
    text: |-
      de naam en het volledig adres, inclusief telefoonnummer, van degene die verantwoordelijk is voor het in de handel
      brengen van het preparaat en gevestigd is in de Gemeenschap, ongeacht of deze de fabrikant, de importeur of de
      distributeur is;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: 14.1.c
    text: 'de chemische benaming van de in het preparaat aanwezige stof(fen), en wel als volgt:'
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: 14.1.c.1°
    text: |-
      voor preparaten die overeenkomstig artikel 12 als T+, T of X zijn ingedeeld, wordt alleen rekening gehouden met
      de T+-, T- of X-stoffen die aanwezig zijn in een concentratie welke gelijk is aan of groter is dan hun respectieve
      laagste grenswaarde (de X-grens) zoals vastgesteld in deel 3 van bijlage VI bij verordening (EG) nr. 1272/2008 of,
      bij gebreke daarvan in bijlage II, deel B bij de preparatenrichtlijn;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: 14.1.c.2°
    text: |-
      voor preparaten die overeenkomstig artikel 12 als C zijn ingedeeld, wordt alleen rekening gehouden met de C-stoffen
      die aanwezig zijn in een concentratie welke gelijk is aan of groter is dan hun laagste grenswaarde de (de X-grens)
      zoals vastgesteld in deel 3 van bijlage VI bij verordening (EG) nr. 1272/2008 of, bij gebreke daarvan, in bijlage
      II, deel B, bij de preparatenrichtlijn;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: 14.1.c.3°
    text: |-
      op het etiket wordt de benaming vermeld van de stof of stoffen op grond waarvan het preparaat is ingedeeld in een
      of meer van de volgende gevarencategorieën: - kankerverwekkend, categorie 1, 2 of 3;
        - mutageen, categorie 1, 2 of 3;
        - voor de voortplanting vergiftig, categorie 1, 2 of 3;
        - zeer vergiftig, vergiftig of schadelijk op grond van niet-letale effecten na één blootstelling;
        - vergiftig of schadelijk op grond van ernstige effecten na herhaalde of langdurige blootstelling;
        - sensibiliserend;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: 14.1.c.4°
    text: |-
      in de vorm van een van de in deel 3 van bijlage VI bij verordening (EG) nr. 1272/2008 of, als de stof nog niet in
      die bijlage is opgenomen, in een internationaal erkende chemische nomenclatuur opgenomen, benamingen.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: 14.1.d
    text: |-
      de nominale massa of het nominale volume wanneer het preparaten betreft die aan het grote publiek worden
      aangeboden.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: '14.2'
    text: |-
      In afwijking van het eerste lid, onderdeel c, ten eerste tot en met ten derde, behoeft niet op het etiket of op de
      verpakking te worden vermeld de naam van de stof op grond waarvan het preparaat is ingedeeld in een categorie als
      bedoeld in [artikel 9.2.3.1, tweede lid, onder a tot en met e, j en o, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '14.3'
    text: |-
      In afwijking van het eerste lid, onderdeel c, eerste tot en met derde subonderdeel, kan worden volstaan met het
      op de verpakking vermelden van maximaal vier scheikundige benamingen voor de identificatie van de stoffen die in
      hoofdzaak verantwoordelijk zijn voor de grote gevaren voor de gezondheid welke hebben geleid tot de indeling en
      de keuze van de bijbehorende standaardzinnen ter aanduiding van de bijzondere gevaren. In bepaalde gevallen kunnen
      meer dan vier scheikundige benamingen noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: '14.4'
    text: |-
      De gevaarsymbolen, voorzover die in de preparatenrichtlijn zijn vastgesteld, en de aanduidingen van de aan het
      gebruik van het preparaat verbonden gevaren die op de verpakking moeten worden vermeld, zijn in overeenstemming
      met de aanwijzingen van bijlage II en bijlage VI bij de stoffenrichtlijn en worden aangebracht overeenkomstig de
      resultaten van de in de bijlagen I, II en III bij de preparatenrichtlijn beschreven beoordeling van de gevaren.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: '14.5'
    text: 'In afwijking van het vierde lid is, wanneer aan een preparaat meer dan een gevaarsymbool wordt toegekend:'
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: 14.5.a
    text: |-
      het aanbrengen op de verpakking van de symbolen C en X niet verplicht indien de verplichting bestaat het symbool T
      op de verpakking aan te brengen;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: 14.5.b
    text: |-
      het aanbrengen van het symbool X op de verpakking niet verplicht indien de verplichting bestaat het symbool C op
      de verpakking aan te brengen, behoudens andersluidende bepalingen van deel 3 van bijlage VI bij verordening (EG)
      nr. 1272/2008;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: 14.5.c
    text: |-
      het aanbrengen van de symbolen F en O op de verpakking niet verplicht indien de verplichting bestaat het symbool E
      op de verpakking aan te brengen;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: 14.5.d
    text: |-
      het aanbrengen van het symbool X op de verpakking niet verplicht indien de verplichting bestaat het symbool X op de
      verpakking aan te brengen.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: '14.6'
    text: De symbolen worden in zwart op oranjegele achtergrond gedrukt.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: '14.7'
    text: |-
      De waarschuwingszinnen ter aanduiding van de bijzondere gevaren zijn in overeenstemming met de aanwijzingen van
      bijlage III en bijlage VI bij de stoffenrichtlijn en worden aangebracht overeenkomstig de resultaten van de in
      de bijlagen I, II en III bij de preparatenrichtlijn beschreven beoordeling van het gevaar. Op de verpakking kan
      worden volstaan met het vermelden van ten hoogste zes waarschuwingszinnen ter aanduiding van de gevaren, voor zover
      die waarschuwingszinnen niet gerelateerd zijn aan bestrijdingsmiddelen. De in bijlage III bij de stoffenrichtlijn
      opgenomen combinatiezinnen worden telkens als één zin geteld.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: '14.8'
    text: |-
      Indien een preparaat tegelijk tot meer dan een gevarencategorie behoort, omvatten de standaardzinnen op de
      verpakking alle belangrijke gevaren, die aan het preparaat zijn verbonden. In dat geval geldt de beperking tot ten
      hoogste zes waarschuwingszinnen, als bedoeld in het zevende lid ter aanduiding van de gevaren, niet.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: '14.9'
    text: |-
      De vermelding op de verpakking van de waarschuwingszinnen ‘zeer licht ontvlambaar’ of ‘licht ontvlambaar’ kan
      achterwege blijven bij een gevaaraanduiding die wordt aangebracht in overeenstemming met het vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: '14.10'
    text: |-
      De veiligheidsaanbevelingen op de verpakking zijn in overeenstemming met de aanwijzingen van bijlage IV en met
      bijlage VI bij de stoffenrichtlijn en worden aangebracht naar gelang van de resultaten van de in bijlagen I, II
      en III bij de preparatenrichtlijn beschreven beoordeling van het gevaar. Op de verpakking kan volstaan worden met
      het vermelden van ten hoogste zes zinnen voor het formuleren van de meest aangewezen veiligheidsaanbeveilingen,
      voor zover die veiligheidsaanbevelingen niet gerelateerd zijn aan bestrijdingsmiddelen. De in bijlage IV bij de
      stoffenrichtlijn opgenomen combinatiezinnen worden telkens als één zin geteld.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: '14.11'
    text: |-
      Wanneer het praktisch gezien niet mogelijk is de veiligheidsaanbevelingen voor het gebruik van het preparaat op het
      etiket of op de verpakking zelf aan te brengen, worden zij bij de verpakking gevoegd.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: '14.12'
    text: 'Wanneer een verpakking niet meer dan 125 ml kan bevatten, behoeven:'
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: 14.12.a
    text: |-
      bij preparaten die zijn ingedeeld als licht ontvlambaar, oxiderend, irriterend, met uitzondering van de preparaten
      waaraan waarschuwingszin R41 is toegekend, of als milieugevaarlijk en waaraan het N-symbool is toegekend, de
      waarschuwingszinnen en de veiligheidsaanbevelingen niet te worden vermeld;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: 14.12.b
    text: |-
      bij preparaten die zijn ingedeeld als ontvlambaar of milieugevaarlijk en waaraan het N-symbool niet is toegekend,
      de veiligheidsaanbevelingen niet te worden vermeld.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
  - number: '14.13'
    text: |-
      Onverminderd het eerste tot en met twaalfde lid worden preparaten die zijn ingedeeld in een categorie als bedoeld
      in [artikel 9.2.3.1, tweede lid, van de wet][ref1], slechts in de handel gebracht indien de kenmerking op de
      verpakking voldoet aan de op het desbetreffende preparaat betrekking hebbende bepalingen van bijlage V, deel A en B
      bij de preparatenrichtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '14.14'
    text: |-
      Onverminderd het eerste lid, onderdelen a en b, worden preparaten die niet zijn ingedeeld in een categorie als
      bedoeld in [artikel 9.2.3.1, tweede lid, van de wet][ref1] maar die desondanks specifiek gevaar kunnen opleveren,
      slechts in de handel gebracht indien de kenmerking op de verpakking voldoet aan de op het desbetreffende preparaat
      betrekking hebbende bepalingen van bijlage V, deel B en C bij de preparatenrichtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '15.1'
    text: |-
      Indien degene die voor het in de handel brengen van een preparaat verantwoordelijk is, kan aantonen dat
      bekendmaking op het etiket of het veiligheidsinformatieblad van de chemische identiteit van een in dat preparaat
      aanwezige stof, die uitsluitend is ingedeeld als:
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15
  - number: 15.1.a
    text: |-
      irriterend, met uitzondering van stoffen waaraan waarschuwingszin R41 is
      toegekend, of als irriterend in combinatie met de categorieën als bedoeld in
      [artikel 9.2.3.1, tweede lid, onderdelen a tot en met e, j en o, van de wet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 15.1.b
    text: |-
      schadelijk, dan wel als schadelijk in combinatie met een of meer van de categorieën als bedoeld in
      [artikel 9.2.3.1, tweede lid, onderdelen a tot en met e, j en o, van de wet][ref1] en op zichzelf acute letale
      effecten heeft, de vertrouwelijkheid van zijn intellectuele eigendom in gevaar brengt, kan hij overeenkomstig
      bijlage VI, onderdeel B bij de preparatenrichtlijn, die stof aanduiden met hetzij een naam die de belangrijkste
      functionele chemische groepen aangeeft, hetzij een andere naam.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '15.2'
    text: |-
      Het eerste lid is niet van toepassing op preparaten die stoffen bevatten waarvoor een blootstellingsgrens is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15
  - number: '15.3'
    text: |-
      Indien een geval als bedoeld in het eerste lid zich voordoet en het preparaat voor de eerste keer in een lidstaat
      van de Europese Unie of een Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte in
      de handel wordt gebracht, richt degene die voor het in de handel brengen van een preparaat verantwoordelijk is,
      het verzoek overeenkomstig bijlage VI bij de preparatenrichtlijn, aan de Minister van Volksgezondheid, Welzijn en
      Sport. Het verzoek wordt ingediend bij de Nederlandse Voedsel- en Warenautoriteit.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15
  - number: 15a.1
    text: |-
      Op het etiket of op de verpakking worden uitsluitend de uit hoofde van de preparatenrichtlijn vereiste gegevens en
      eventuele aanvullende gezondheids- of veiligheidsaanbevelingen aangebracht.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15a
  - number: 15a.2
    text: |-
      Indien de in [artikel 14][ref1] voorgeschreven aanduidingen op een etiket zijn aangebracht, wordt dit stevig op
      één of meer zijden van de verpakking gehecht, zodat deze aanduidingen horizontaal kunnen worden gelezen wanneer de
      verpakking op de gebruikelijke wijze is neergezet.


      [ref1]: https://wetten.overheid.nl/BWBR0004284#Artikel14
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004284
        artikel: '14'
        paragraaf: '3'
  - number: 15a.3
    text: |-
      De afmetingen van het etiket en de presentatie en het formaat van de overeenkomstig [artikel 14][ref1] op het
      etiket vereiste gegevens, dienen te voldoen aan bijlage VI bij de stoffenrichtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004284#Artikel14
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004284
        artikel: '14'
        paragraaf: '3'
  - number: 15a.4
    text: |-
      Kleur en uiterlijk van het etiket en van de verpakking worden zodanig gekozen dat het gevaarsymbool en de
      achtergrond ervan duidelijk afsteken.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15a
  - number: 15a.5
    text: |-
      Indien op een enkelvoudige verpakking reeds ingevolge een wettelijke regeling inzake het vervoer
      en [artikel 14, eerste tot en met derde en zevende tot en met elfde lid][ref1], voor de volgens
      [artikel 13][ref2] ingedeelde preparaten, aanduidingen zijn aangebracht, worden op die verpakking tevens de in
      [artikel 14, vierde tot en met zesde lid][ref3], voorgeschreven aanduidingen aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004284#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004284#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0004284#Artikel14
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004284
        artikel: '14'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004284
        artikel: '13'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004284
        artikel: '14'
        paragraaf: '3'
  - number: 15a.6
    text: |-
      Op een verpakking als bedoeld in het vijfde lid, worden behalve de in dat lid bedoelde aanduidingen tevens
      aanduidingen aangebracht overeenkomstig de bepalingen van bijlage VI bij de stoffenrichtlijn, indien de bijzondere
      aard van de verpakking dit noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15a
  - number: 15a.7
    text: |-
      In geval van een meervoudige verpakking zijn ten aanzien van elke verpakking die een verpakking of verpakkingen als
      bedoeld in [artikel 9.2.3.3, eerste lid, van de wet][ref1] omsluit en die niet de verpakking is waarop ingevolge
      een wettelijke regeling inzake het vervoer van gevaarlijke preparaten aanduidingen moeten zijn aangebracht,
      [artikel 1a, eerste lid][ref2], en [artikel 5, eerste lid, van het besluit][ref3], en [artikel 14][ref4] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004220#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0004220#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0004284#Artikel14
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0004220
        artikel: 1a
      - id: ref3
        bwb_id: BWBR0004220
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0004284
        artikel: '14'
        paragraaf: '3'
  - number: 15a.8
    text: |-
      [Artikel 35, eerste en tweede lid, van de wet][ref1], is niet van toepassing op verpakkingen van preparaten die
      voldoen aan de eisen voor vervoer van gevaarlijke goederen via de spoorwegen, de weg of de binnenvaart dan wel het
      zee- of luchtvervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel35
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '35'
  - number: 15b.1
    text: |-
      De [artikelen 9.2.3.1 tot en met 9.2.3.4 van de wet][ref1] en de [artikelen 1a][ref2] en [5 van het besluit][ref3]
      zijn van overeenkomstige toepassing ten aanzien van preparaten die zijn bestemd voor uitvoer naar een ander land
      dan een Lid-Staat van de Europese Unie of een Staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte, onverminderd de door het land waarvoor de desbetreffende preparaten zijn bestemd, ten aanzien
      van de verpakking en aanduiding bij aflevering gestelde specifieke en ter zake geldende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004220#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0004220#Artikel5
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0004220
        artikel: 1a
      - id: ref3
        bwb_id: BWBR0004220
        artikel: '5'
  - number: 15b.2
    text: |-
      In afwijking van het eerste lid zijn de door het land van invoer gestelde eisen ten aanzien van het aanduiden
      van het preparaat van toepassing, indien deze dezelfde waarborg bieden ten aanzien van de bescherming
      van gezondheid, veiligheid en milieu als de eisen die daaromtrent zijn gesteld bij of krachtens de
      [artikelen 9.2.3.1 tot en met 9.2.3.4 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 15b.3
    text: |-
      De aanduidingen die ingevolge het eerste lid op de verpakking worden aangebracht, zijn, indien dit uitvoerbaar
      is, gesteld in de taal of in een of meer van de hoofdtalen van het land of het gebied waarvoor het preparaat is
      bestemd.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15b
  - number: 15c.1
    text: |-
      Onverminderd het bepaalde in de [artikelen 14][ref1], [15a][ref2] en [15b][ref3] worden op het etiket voor
      bestrijdingsmiddelen duidelijk leesbaar en onuitwisbaar vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0004284#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004284#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0004284#Artikel15b
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0004284
        artikel: '14'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004284
        artikel: 15a
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004284
        artikel: 15b
        paragraaf: '3'
  - number: 15c.1.a
    text: |-
      het door het College voor de toelating van gewasbeschermingsmiddelen en biociden als bedoeld in
      [artikel 3 van de Wet gewasbeschermingsmiddelen en biociden][ref1] aan het bestrijdingsmiddel toegekende
      toelatings- of registratienummer;


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel3
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '3'
  - number: 15c.1.b
    text: |-
      de aard van het preparaat, zoals bijvoorbeeld vloeibaar concentraat, korrels, poeder, vaste stof, spuitpoeder of
      emulgeerbaar concentraat;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
  - number: 15c.1.c
    text: |-
      de toepassingen waarvoor het bestrijdingsmiddel is toegelaten, zoals bijvoorbeeld houtconservering, desinfectie,
      oppervlaktebiocide, aangroeibestrijding, insecticide, groeiregulator of herbicide;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
  - number: 15c.1.d
    text: |-
      voor ieder in de toelatingsvoorwaarden vermeld gebruik, de gebruiksaanwijzing en de in metrieke eenheden
      uitgedrukte dosering;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
  - number: 15c.1.e
    text: aanwijzingen voor het verlenen van eerste hulp;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
  - number: 15c.1.f
    text: de zin ‘Voor gebruik de bijgevoegde gebruiksaanwijzing lezen’, indien een bijsluiter wordt bijgevoegd;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
  - number: 15c.1.g
    text: aanwijzingen voor een veilige verwijdering van het bestijdingsmiddel en de verpakking ervan;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
  - number: 15c.1.h
    text: 'het partijnummer van het preparaat; en waar van toepassing:'
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
  - number: 15c.1.i
    text: de categorieën gebruikers die het bestrijdingsmiddel mogen gebruiken;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
  - number: 15c.1.j
    text: |-
      het in [bijlage III][ref1] bij deze regeling opgenomen kca-logo, dat strekt tot aanduiding van het gescheiden
      houden en gescheiden afgeven van producten die in het afvalstadium klein chemisch afval zijn, voor zover het
      betreft een bestrijdingsmiddel bestemd voor huishoudelijk gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0004284
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0004284
  - number: 15c.2
    text: 'Het eerste lid, onderdeel j, is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
  - number: 15c.2.a
    text: op bestrijdingsmiddelen die uitsluitend uit micro-organismen of virussen bestaan;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
  - number: 15c.2.b
    text: |-
      op bestrijdingsmiddelen die in de [Regeling Europese afvalstoffenlijst][ref1] niet zijn aangewezen als gevaarlijke
      afvalstof;


      [ref1]: https://wetten.overheid.nl/BWBR0013546
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0013546
  - number: 15c.2.c
    text: |-
      Indien de verpakking is voorzien van een aanduiding die in een lidstaat van de Europese Unie van overheidswege
      is vastgesteld ter zake van het gescheiden houden en gescheiden afgeven van gewasbeschermingsmiddelen die in het
      afvalstadium klein chemisch afval zijn.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
  - number: 15c.3
    text: |-
      Onverminderd overige informatieverplichtingen worden monsters, modellen of ontwerpen van de verpakking, de
      etiketten en de bijsluiters verstrekt aan het College voor de toelating van gewasbeschermingsmiddelen en biociden
      als bedoeld in [artikel 3 van de Wet gewasbeschermingsmiddelen en biociden][ref1] in het kader van de toelating
      of registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel3
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '3'
  - number: 15c.4
    text: |-
      De verpakking van een bestrijdingsmiddel is zodanig verzegeld dat deze niet zonder beschadiging van de
      verzegeling geopend kan worden. Dit geldt niet voor die middelen welke in afwijking van het verbod, gesteld
      in [artikel 2, eerste lid, van het Bestrijdingsmiddelenbesluit][ref1], voorhanden of in voorraad gehouden of
      afgeleverd mogen worden in een andere verpakking dan die waarin zij hier te lande voor de eerste maal in het
      verkeer zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002450#Artikel2
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0002450
        artikel: '2'
  - number: 15c.5
    text: |-
      Het verbod, gesteld in [artikel 2, eerste lid, van het Bestrijdingsmiddelenbesluit][ref1] geldt niet voor zover
      zulks bij de toelating of registratie van het biocide is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002450#Artikel2
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0002450
        artikel: '2'
  - number: 15d.1
    text: |-
      Onverminderd het bepaalde in de [artikelen 14][ref1], [15a][ref2], [15b][ref3] en [15c][ref4] worden:


      [ref1]: https://wetten.overheid.nl/BWBR0004284#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004284#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0004284#Artikel15b
      [ref4]: https://wetten.overheid.nl/BWBR0004284#Artikel15c
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0004284
        artikel: '14'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004284
        artikel: 15a
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004284
        artikel: 15b
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0004284
        artikel: 15c
        paragraaf: '3'
  - number: 15d.1.a
    text: 'op het etiket voor biociden duidelijk leesbaar en onuitwisbaar vermeld:'
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15d
  - number: 15d.1.a.1°
    text: de aard van elke werkzame stof en de concentratie ervan in metrieke eenheden;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15d
  - number: 15d.1.a.2°
    text: bijzonderheden betreffende mogelijke directe of indirecte nadelige bijwerkingen;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15d
  - number: 15d.1.a.3°
    text: waar van toepassing, een verbod op hergebruik van de verpakking;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15d
  - number: 15d.1.a.4°
    text: de partijaanduiding en de vervaldatum onder normale opslagomstandigheden;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15d
  - number: 15d.1.a.5°
    text: |-
      de tijd die verstrijkt voordat de werking van het biocide intreedt, de in acht te nemen periode tussen twee
      opeenvolgende behandelingen met het biocide of tussen een behandeling en het eerstvolgende gebruik van het
      behandelde product of de eerstvolgende betreding door mens of dier van de ruimte waar het biocide is gebruikt,
      met inbegrip van bijzonderheden betreffende decontaminatiemiddelen en -maatregelen en hoelang de betrokken ruimten
      moeten worden geventileerd; bijzonderheden over het naar behoren schoonmaken van de uitrusting; bijzonderheden over
      voorzorgsmaatregelen tijdens gebruik, opslag en vervoer, zoals beschermende, individuele kleding en uitrusting,
      brandveiligheidsmaatregelen, afdekken van meubilair, verwijdering van levensmiddelen en diervoeder en aanwijzingen
      om blootstelling van dieren tegen te gaan; en waar van toepassing:
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15d
  - number: 15d.1.a.6°
    text: |-
      informatie betreffende de gevaren voor het milieu, in het bijzonder waar zulks de bescherming van niet-
      doelorganismen en het voorkomen van waterverontreiniging betreft;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15d
  - number: 15d.1.b
    text: |-
      worden microbiologische biociden geëtiketteerd overeenkomstig de regelgeving bij of krachtens de
      [Arbeidsomstandighedenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: 15d.2
    text: |-
      In afwijking van het eerste lid mogen de in [artikel 15c, eerste lid, onderdelen b, d, e, g en h][ref1], en de
      in het eerste lid, onder a, ten tweede tot ten zesde, vermelde gegevens elders op de verpakking of op een bij de
      verpakking behorende bijsluiter duidelijk leesbaar en onuitwisbaar worden vermeld


      [ref1]: https://wetten.overheid.nl/BWBR0004284#Artikel15c
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0004284
        artikel: 15c
        paragraaf: '3'
  - number: 15d.3
    text: |-
      Biociden die met voedsel, drank of diervoeder kunnen worden verward, worden zodanig verpakt dat de mogelijkheid van
      verwarring zo gering mogelijk is.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15d
  - number: 15d.4
    text: |-
      Aan biociden die voor het grote publiek beschikbaar zijn en met voedsel, drank of diervoeder kunnen worden verward,
      worden bestanddelen toegevoegd die consumptie ervan tegengaan.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15d
  - number: 15e.a
    text: |-
      wordt op het etiket voor gewasbeschermingsmiddelen duidelijk leesbaar en onuitwisbaar vermeld ‘volg de
      gebruiksaanwijzing om gevaar voor mens en milieu te voorkomen’;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15e.b
    text: 'wordt op de verpakking voor gewasbeschermingsmiddelen duidelijk leesbaar en onuitwisbaar vermeld:'
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15e.b.1°
    text: het gehalte van iedere werkzame stof;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15e.b.2°
    text: de nettohoeveelheid van het gewasbeschermingsmiddel, uitgedrukt in wettelijke meeteenheden;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15e.b.3°
    text: waar van toepassing, een gegeven aan de hand waarvan het preparaat kan worden geïdentificeerd;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15e.b.4°
    text: |-
      de aard van eventuele bijzondere gevaren voor mens, dier of milieu in de vorm van standaardformuleringen, voor
      welke formulering een passende keuze wordt gemaakt uit de in bijlage IV bij de gewasbeschermingsmiddelenrichtlijn
      opgenomen standaardformuleringen;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15e.b.5°
    text: |-
      de veiligheidsadviezen voor de bescherming van mens, dier of milieu in de vorm van standaardformuleringen, voor
      welke formulering een passende keuze wordt gemaakt uit de in bijlage V bij de gewasbeschermingsmiddelenrichtlijn
      opgenomen standaardformuleringen;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15e.b.6°
    text: |-
      het gebruik waarvoor het gewasbeschermingsmiddel is toegelaten en de eventuele landbouwtechnische, fytosanitaire en
      milieutechnische voorwaarden waaronder het product mag worden gebruikt of niet mag worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15e.b.7°
    text: |-
      zo nodig, voor ieder gebruik de voor de veiligheid aan te houden termijn tussen een toepassing en zaaien of planten
      van het te beschermen gewas, zaaien of planten van volgende gewassen, toegang voor mens en dier, oogsten, gebruik
      of consumptie;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15e.b.8°
    text: |-
      de bijzonderheden betreffende mogelijke fytotoxiciteit, gevoeligheid van bepaalde rassen en alle andere directe
      of indirecte schadelijke neveneffecten op planten of plantaardige producten, alsmede de in acht te nemen termijnen
      tussen een toepassing en het zaaien of planten van het desbetreffende gewas, of een volgend gewas; en
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15e.b.9°
    text: |-
      de uiterste gebruiksdatum onder normale omstandigheden van bewaring indien het middel minder dan twee jaar houdbaar
      is.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15e.c
    text: |-
      mag, indien de verpakking zo klein is dat redelijkerwijs niet alle voorgeschreven aanduidingen en vermeldingen
      daarop kunnen worden gesteld, gebruik worden gemaakt hetzij van een op deugdelijke wijze aan de verpakking
      bevestigde label hetzij van een afzonderlijk bij de verpakking ingesloten bijsluiter, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15e.c.1°
    text: |-
      op de verpakking ten minste zijn vermeld: de naam van het gewasbeschermingsmiddel, het toelatingsnummer en het
      partijnummer, het gevaarsymbool indien voorgeschreven en, indien noodzakelijk, het kca-logo alsmede een verwijzing
      naar de bijsluiter of de label;
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15e.c.2°
    text: |-
      op de bijsluiter of de label alle voorgeschreven aanduidingen en vermeldingen, met uitzondering van het
      chargenummer, worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15e.d
    text: |-
      mag op het etiket worden vermeld dat het gewasbeschermingsmiddel mag worden gebruikt wanneer bijen of andere niet-
      doelsoorten actief zijn of gewassen of onkruid in bloei staan, of soortgelijke vermeldingen om bijen of andere
      niet-doelsoorten te beschermen, indien de toelating uitdrukkelijk betrekking heeft op gebruik gedurende de periodes
      dat bijen of andere genoemde organismen aanwezig zijn en het middel een minimum aan gevaar voor deze organismen
      inhoudt.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15f
    text: |-
      Op de in bijlage VII bij de preparatenrichtlijn genoemde gevaarlijke preparaten die zijn ingedeeld in
      een categorie als bedoeld in [artikel 9.2.3.1, tweede lid, van de wet][ref1], die in de vorm waarin zij
      in de handel worden gebracht geen gevaren opleveren uit fysisch-chemische eigenschappen, noch gevaren
      voor de gezondheid of het milieu, zijn de [artikelen 9.2.3.3][ref2] en [9.2.3.4 van de wet][ref3],
      [artikel 1a van het Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref4], de
      [artikelen 3][ref5], [4][ref6] en [5 van het Warenwetbesluit veilige verpakking huishoudchemicaliën][ref7] en de
      [artikelen 14][ref8], [15a][ref9], [15c][ref10] en [15e][ref11], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0004220#Artikel1a
      [ref5]: https://wetten.overheid.nl/BWBR0006448#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0006448#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0006448#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0004284#Artikel14
      [ref9]: https://wetten.overheid.nl/BWBR0004284#Artikel15a
      [ref10]: https://wetten.overheid.nl/BWBR0004284#Artikel15c
      [ref11]: https://wetten.overheid.nl/BWBR0004284#Artikel15e
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0004220
        artikel: 1a
      - id: ref5
        bwb_id: BWBR0006448
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0006448
        artikel: '4'
      - id: ref7
        bwb_id: BWBR0006448
        artikel: '5'
      - id: ref8
        bwb_id: BWBR0004284
        artikel: '14'
        paragraaf: '3'
      - id: ref9
        bwb_id: BWBR0004284
        artikel: 15a
        paragraaf: '3'
      - id: ref10
        bwb_id: BWBR0004284
        artikel: 15c
        paragraaf: '3'
      - id: ref11
        bwb_id: BWBR0004284
        artikel: 15e
        paragraaf: '3'
  - number: 15g
    text: |-
      Degene die verantwoordelijk is voor het in de handel brengen van een stof of preparaat houdt de gegevens, bedoeld
      in [artikel 6d, eerste lid, van het besluit][ref1] ter beschikking van de Nederlandse Voedsel- en Warenautoriteit,
      de Arbeidsinspectie en de Inspectie Milieuhygiëne.


      [ref1]: https://wetten.overheid.nl/BWBR0004220#Artikel6d
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0004220
        artikel: 6d
  - number: 15h
    text: |-
      Het Nationaal Vergiftigingen Informatie Centrum is belast met de uitvoering van de taak, bedoeld in artikel 45,
      eerste lid, van verordening (EG) nr. 1272/2008.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15h
  - number: '16'
    text: |-
      Deze regeling berust op [artikel 1a, tweede en derde lid][ref1], [6, tweede lid, van het besluit][ref2] en
      [artikel 9.3a.1 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004220#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0004220#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004220
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0004220
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '17'
    text: Het Afleveringsbesluit Gevaarlijke Stoffen (Stcrt. 1980, 64) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel17
  - number: '18'
    text: Het Afleveringsbesluit Gevaarlijke Preparaten (Stcrt. 1980, 64) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel18
  - number: '19.1'
    text: |-
      Deze regeling wordt bekendgemaakt in de Nederlandse Staatscourant en treedt in werking op het tijdstip waarop het
      [Besluit verpakking en aanduiding milieugevaarlijke stoffen][ref1] (Stb. 1987, 516) in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004220
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004220
  - number: '19.2'
    text: |-
      Een wijziging van bijlage II, III, IV, V of VI bij de stoffenrichtlijn treedt voor de toepassing van de hierop
      betrekking hebbende artikelen in werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn
      uiterlijk uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel19
  - number: '19.3'
    text: |-
      Een wijziging van bijlage I, II, III, IV, V, VI of VII bij de preparatenrichtlijn treedt voor de toepassing van
      deze regeling in werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn
      gegeven, tenzij bij ministeriële regeling die in de Staatscourant bekend wordt gemaakt, een ander tijdstip wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel19
  - number: '19.4'
    text: |-
      Bij ministeriële regeling kunnen onderdelen van een in werking getreden wijziging als bedoeld in het derde lid,
      voor bij die regeling aan te wijzen categorieën preparaten tot een nader te bepalen tijdstip buiten toepassing
      gelaten worden.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel19
  - number: '19.5'
    text: Zij kan worden aangehaald als ‘Nadere regels verpakking en aanduiding milieugevaarlijke stoffen en preparaten’.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel19
