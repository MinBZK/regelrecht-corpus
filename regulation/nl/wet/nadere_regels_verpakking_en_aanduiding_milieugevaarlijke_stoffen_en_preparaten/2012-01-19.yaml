  - number: '12'
    text: |-
      1 De gevaren van een preparaat voor de gezondheid worden beoordeeld volgens een of meer van de volgende procedures:

      a. via een in bijlage II bij de preparatenrichtlijn beschreven conventionele methode,

      b. door de bepaling van de toxicologische eigenschappen van het preparaat zodat het op passende wijze kan
      worden ingedeeld overeenkomstig de criteria van bijlage VI bij de stoffenrichtlijn. Deze eigenschappen worden
      bepaald met de methoden van bijlage V, deel B, bij de stoffenrichtlijn, tenzij, in het geval van een onder de
      gewasbeschermingsmiddelenrichtlijn vallend preparaat, andere internationaal erkende methoden aanvaardbaar zijn in
      overeenstemming met de bepalingen van de bijlagen II en III bij de gewasbeschermingsmiddelenrichtlijn.

      2 De methoden, bedoeld in het eerste lid, onderdeel b, worden uitsluitend gebruikt, in het geval:

      a. zij overeenkomstig artikel 12 van [richtlijn nr. 86/609/EEG](31986L0609) van de Raad van 24 november 1986
      inzake de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen van de Lidstaten betreffende de
      bescherming van dieren die voor experimentele en andere wetenschappelijke doeleinden worden gebruikt (PbEG L 358)
      gerechtvaardigd of specifiek toegestaan zijn, onverminderd de bepalingen van de gewasbeschermingsmiddelenrichtlijn,

      b. wanneer degene die verantwoordelijk is voor het in de handel brengen van het preparaat, wetenschappelijk kan
      aantonen dat de toxicologische eigenschappen van het preparaat niet correct kunnen worden bepaald met de in het
      eerste lid, onderdeel a, bedoelde methode, of aan de hand van bestaande resultaten van proeven met dieren.

      3 Wanneer een toxicologische eigenschap wordt vastgesteld met de in het eerste lid, onderdeel b, beschreven
      methoden voor het verkrijgen van nieuwe gegevens, wordt de proef uitgevoerd overeenkomstig de beginselen van goede
      laboratoriumpraktijken zoals vastgesteld bij [richtlijn nr. 2004/10/EG](32004L0010) van het Europees Parlement
      en de Raad van 11 februari 2004 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke
      bepalingen inzake de toepassing van de beginselen van goede laboratoriumpraktijken en het toezicht op de toepassing
      ervan voor tests op chemische stoffen (PbEG L 50), zoals vastgesteld bij [richtlijn nr. 86/609/EEG](31986L0609) van
      de Raad van 24 november 1986 inzake de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen
      van de Lidstaten betreffende de bescherming van dieren die voor experimentele en andere wetenschappelijke
      doeleinden worden gebruikt (PbEG L 358), en met name de artikelen 7 en 12 van die richtlijn.

      4 Wanneer een toxicologische eigenschap is vastgesteld met zowel een methode als bedoeld in het eerste lid,
      onderdeel a, als met een methode als bedoeld in het eerste lid, onderdeel b, worden de resultaten van de in het
      eerste lid, onderdeel b, beschreven methoden gebruikt voor het indelen van het preparaat.

      5 In afwijking van het vierde lid is, onder voorbehoud van het zesde en zevende lid, in het geval van carcinogene,
      mutagene of voor de voortplanting vergiftige effecten uitsluitend het eerste lid, onderdeel a, van toepassing.

      6 Een preparaat wordt ingedeeld op basis van de effecten op de mens wanneer, door epidemiologische studies, door
      wetenschappelijk gefundeerde casestudies zoals omschreven in bijlage VI bij de stoffenrichtlijn of door statistisch
      onderbouwde ervaring, zoals de beoordeling van gegevens van gifcentra of over beroepsziekten, wordt aangetoond, dat
      de toxicologische effecten op de mens anders zijn dan op grond van toepassing van de methoden van het eerste lid te
      verwachten is.

      7 Bij de indeling van het preparaat wordt rekening gehouden met verschijnselen als potentiëring of antagonisme,
      wanneer wordt aangetoond dat het toxicologische gevaar bij een conventionele beoordeling ten gevolge van deze
      verschijnselen wordt onderschat onderscheidenlijk overschat.

      8 Met de in het eerste lid, onderdelen a of b, genoemde methoden vindt een nieuwe beoordeling plaats van de gevaren
      voor de gezondheid van preparaten waarvan de samenstelling bekend is, indien:

      a. de fabrikant de in gewichts- of volumeprocent uitgedrukte oorspronkelijke concentratie van een of meer voor
      de gezondheid gevaarlijke bestanddelen van het preparaat met een groter percentage wijzigt dan het percentage
      opgenomen in [bijlage II][ref1] bij deze regeling;

      b. de fabrikant de samenstelling van het preparaat wijzigt door vervanging of toevoeging van een of meer
      bestanddelen die al dan niet gevaarlijk zijn in de zin van [artikel 9.2.3.1, tweede lid, van de wet][ref2].

      9 Het achtste lid is niet van toepassing indien:

      a. er sprake is van onder de gewasbeschermingsmiddelenrichtlijn vallende preparaten, die aan de hand van de in het
      eerste lid, onderdeel b, genoemde methode zijn ingedeeld;

      b. er goede wetenschappelijke aanwijzingen zijn dat een nieuwe beoordeling van de gevaren niet tot een andere
      indeling zal leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0004284
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9.2.3.1
