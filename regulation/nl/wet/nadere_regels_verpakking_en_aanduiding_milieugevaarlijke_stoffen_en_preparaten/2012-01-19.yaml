      1 Onverminderd het bepaalde in de [artikelen 14][ref1], [15a][ref2], [15b][ref3] en [15c][ref4] worden:

      a. op het etiket voor biociden duidelijk leesbaar en onuitwisbaar vermeld:

      1°. de aard van elke werkzame stof en de concentratie ervan in metrieke eenheden;

      2°. bijzonderheden betreffende mogelijke directe of indirecte nadelige bijwerkingen;

      3°. waar van toepassing, een verbod op hergebruik van de verpakking;

      4°. de partijaanduiding en de vervaldatum onder normale opslagomstandigheden;

      5°. de tijd die verstrijkt voordat de werking van het biocide intreedt, de in acht te nemen periode tussen
      twee opeenvolgende behandelingen met het biocide of tussen een behandeling en het eerstvolgende gebruik van het
      behandelde product of de eerstvolgende betreding door mens of dier van de ruimte waar het biocide is gebruikt,
      met inbegrip van bijzonderheden betreffende decontaminatiemiddelen en -maatregelen en hoelang de betrokken ruimten
      moeten worden geventileerd; bijzonderheden over het naar behoren schoonmaken van de uitrusting; bijzonderheden over
      voorzorgsmaatregelen tijdens gebruik, opslag en vervoer, zoals beschermende, individuele kleding en uitrusting,
      brandveiligheidsmaatregelen, afdekken van meubilair, verwijdering van levensmiddelen en diervoeder en aanwijzingen
      om blootstelling van dieren tegen te gaan; en waar van toepassing:

      6°. informatie betreffende de gevaren voor het milieu, in het bijzonder waar zulks de bescherming van niet-
      doelorganismen en het voorkomen van waterverontreiniging betreft;

      b. worden microbiologische biociden geëtiketteerd overeenkomstig de regelgeving bij of krachtens de
      [Arbeidsomstandighedenwet][ref5].

      2 In afwijking van het eerste lid mogen de in [artikel 15c, eerste lid, onderdelen b, d, e, g en h][ref6], en de
      in het eerste lid, onder a, ten tweede tot ten zesde, vermelde gegevens elders op de verpakking of op een bij de
      verpakking behorende bijsluiter duidelijk leesbaar en onuitwisbaar worden vermeld

      3 Biociden die met voedsel, drank of diervoeder kunnen worden verward, worden zodanig verpakt dat de mogelijkheid
      van verwarring zo gering mogelijk is.

      4 Aan biociden die voor het grote publiek beschikbaar zijn en met voedsel, drank of diervoeder kunnen worden
      verward, worden bestanddelen toegevoegd die consumptie ervan tegengaan.


