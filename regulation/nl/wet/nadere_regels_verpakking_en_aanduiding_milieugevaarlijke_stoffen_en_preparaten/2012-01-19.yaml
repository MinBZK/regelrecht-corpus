  - number: 15e
    text: |-
      a. wordt op het etiket voor gewasbeschermingsmiddelen duidelijk leesbaar en onuitwisbaar vermeld ‘volg de
      gebruiksaanwijzing om gevaar voor mens en milieu te voorkomen’;

      b. wordt op de verpakking voor gewasbeschermingsmiddelen duidelijk leesbaar en onuitwisbaar vermeld:

      1°. het gehalte van iedere werkzame stof;

      2°. de nettohoeveelheid van het gewasbeschermingsmiddel, uitgedrukt in wettelijke meeteenheden;

      3°. waar van toepassing, een gegeven aan de hand waarvan het preparaat kan worden geïdentificeerd;

      4°. de aard van eventuele bijzondere gevaren voor mens, dier of milieu in de vorm van standaardformuleringen, voor
      welke formulering een passende keuze wordt gemaakt uit de in bijlage IV bij de gewasbeschermingsmiddelenrichtlijn
      opgenomen standaardformuleringen;

      5°. de veiligheidsadviezen voor de bescherming van mens, dier of milieu in de vorm van standaardformuleringen, voor
      welke formulering een passende keuze wordt gemaakt uit de in bijlage V bij de gewasbeschermingsmiddelenrichtlijn
      opgenomen standaardformuleringen;

      6°. het gebruik waarvoor het gewasbeschermingsmiddel is toegelaten en de eventuele landbouwtechnische,
      fytosanitaire en milieutechnische voorwaarden waaronder het product mag worden gebruikt of niet mag worden
      gebruikt;

      7°. zo nodig, voor ieder gebruik de voor de veiligheid aan te houden termijn tussen een toepassing en zaaien of
      planten van het te beschermen gewas, zaaien of planten van volgende gewassen, toegang voor mens en dier, oogsten,
      gebruik of consumptie;

      8°. de bijzonderheden betreffende mogelijke fytotoxiciteit, gevoeligheid van bepaalde rassen en alle andere directe
      of indirecte schadelijke neveneffecten op planten of plantaardige producten, alsmede de in acht te nemen termijnen
      tussen een toepassing en het zaaien of planten van het desbetreffende gewas, of een volgend gewas; en

      9°. de uiterste gebruiksdatum onder normale omstandigheden van bewaring indien het middel minder dan twee jaar
      houdbaar is.

      c. mag, indien de verpakking zo klein is dat redelijkerwijs niet alle voorgeschreven aanduidingen en vermeldingen
      daarop kunnen worden gesteld, gebruik worden gemaakt hetzij van een op deugdelijke wijze aan de verpakking
      bevestigde label hetzij van een afzonderlijk bij de verpakking ingesloten bijsluiter, met dien verstande dat:

      1°. op de verpakking ten minste zijn vermeld: de naam van het gewasbeschermingsmiddel, het toelatingsnummer en het
      partijnummer, het gevaarsymbool indien voorgeschreven en, indien noodzakelijk, het kca-logo alsmede een verwijzing
      naar de bijsluiter of de label;

      2°. op de bijsluiter of de label alle voorgeschreven aanduidingen en vermeldingen, met uitzondering van het
      chargenummer, worden gesteld.

      d. mag op het etiket worden vermeld dat het gewasbeschermingsmiddel mag worden gebruikt wanneer bijen of andere
      niet-doelsoorten actief zijn of gewassen of onkruid in bloei staan, of soortgelijke vermeldingen om bijen of andere
      niet-doelsoorten te beschermen, indien de toelating uitdrukkelijk betrekking heeft op gebruik gedurende de periodes
      dat bijen of andere genoemde organismen aanwezig zijn en het middel een minimum aan gevaar voor deze organismen
      inhoudt.
    url: https://wetten.overheid.nl/BWBR0004284/2012-01-19#Artikel15e
  - number: 15f
    text: |-
      Op de in bijlage VII bij de preparatenrichtlijn genoemde gevaarlijke preparaten die zijn ingedeeld in
      een categorie als bedoeld in [artikel 9.2.3.1, tweede lid, van de wet][ref1], die in de vorm waarin zij
      in de handel worden gebracht geen gevaren opleveren uit fysisch-chemische eigenschappen, noch gevaren
      voor de gezondheid of het milieu, zijn de [artikelen 9.2.3.3][ref2] en [9.2.3.4 van de wet][ref3],
      [artikel 1a van het Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref4], de
      [artikelen 3][ref5], [4][ref6] en [5 van het Warenwetbesluit veilige verpakking huishoudchemicaliën][ref7] en de
      [artikelen 14][ref8], [15a][ref9], [15c][ref10] en [15e][ref11], niet van toepassing.


