  - number: 15a
    text: |-
      1 Op het etiket of op de verpakking worden uitsluitend de uit hoofde van de preparatenrichtlijn vereiste gegevens
      en eventuele aanvullende gezondheids- of veiligheidsaanbevelingen aangebracht.

      2 Indien de in [artikel 14][ref1] voorgeschreven aanduidingen op een etiket zijn aangebracht, wordt dit stevig op
      één of meer zijden van de verpakking gehecht, zodat deze aanduidingen horizontaal kunnen worden gelezen wanneer de
      verpakking op de gebruikelijke wijze is neergezet.

      3 De afmetingen van het etiket en de presentatie en het formaat van de overeenkomstig [artikel 14][ref2] op het
      etiket vereiste gegevens, dienen te voldoen aan bijlage VI bij de stoffenrichtlijn.

      4 Kleur en uiterlijk van het etiket en van de verpakking worden zodanig gekozen dat het gevaarsymbool en de
      achtergrond ervan duidelijk afsteken.

      5 Indien op een enkelvoudige verpakking reeds ingevolge een wettelijke regeling inzake het vervoer
      en [artikel 14, eerste tot en met derde en zevende tot en met elfde lid][ref3], voor de volgens
      [artikel 13][ref4] ingedeelde preparaten, aanduidingen zijn aangebracht, worden op die verpakking tevens de in
      [artikel 14, vierde tot en met zesde lid][ref5], voorgeschreven aanduidingen aangebracht.

      6 Op een verpakking als bedoeld in het vijfde lid, worden behalve de in dat lid bedoelde aanduidingen tevens
      aanduidingen aangebracht overeenkomstig de bepalingen van bijlage VI bij de stoffenrichtlijn, indien de bijzondere
      aard van de verpakking dit noodzakelijk maakt.

      7 In geval van een meervoudige verpakking zijn ten aanzien van elke verpakking die een verpakking of
      verpakkingen als bedoeld in [artikel 9.2.3.3, eerste lid, van de wet][ref6] omsluit en die niet de verpakking
      is waarop ingevolge een wettelijke regeling inzake het vervoer van gevaarlijke preparaten aanduidingen moeten
      zijn aangebracht, [artikel 1a, eerste lid][ref7], en [artikel 5, eerste lid, van het besluit][ref8], en
      [artikel 14][ref9] van overeenkomstige toepassing.

      8 [Artikel 35, eerste en tweede lid, van de wet][ref10], is niet van toepassing op verpakkingen van preparaten die
      voldoen aan de eisen voor vervoer van gevaarlijke goederen via de spoorwegen, de weg of de binnenvaart dan wel het
      zee- of luchtvervoer.


