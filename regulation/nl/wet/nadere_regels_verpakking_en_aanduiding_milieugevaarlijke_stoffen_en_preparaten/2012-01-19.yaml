  - number: 15g
    text: |-
      Degene die verantwoordelijk is voor het in de handel brengen van een stof of preparaat houdt de gegevens, bedoeld
      in [artikel 6d, eerste lid, van het besluit][ref1] ter beschikking van de Nederlandse Voedsel- en Warenautoriteit,
      de Arbeidsinspectie en de Inspectie Milieuhygiëne.


      [ref1]: https://wetten.overheid.nl/BWBR0004220#Artikel6d
