    text: |-
      1 Voor de indeling van een preparaat in een categorie als bedoeld in
      [artikel 9.2.3.1, tweede lid, van de wet][ref1] wordt rekening gehouden met alle in het preparaat aanwezige
      stoffen, die zijn ingedeeld in een categorie als bedoeld in [artikel 9.2.3.1, tweede lid, van de wet][ref2],
      ongeacht of het onzuiverheden dan wel additieven betreft, wanneer hun concentratie gelijk is aan of groter dan de
      grenswaarden in [bijlage I][ref3] bij deze regeling.

      2 De in het eerste lid bedoelde grenswaarden zijn niet van toepassing indien er lagere grenswaarden zijn
      vastgesteld in deel 3 van bijlage VI bij verordening (EG) nr. 1272/2008 dan wel in bijlage II, deel B,
      of in bijlage III, deel B bij de preparatenrichtlijn, tenzij anders gespecificeerd in bijlage V bij de
      preparatenrichtlijn.


