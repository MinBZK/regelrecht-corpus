  - number: 15b
    text: |-
      1 De [artikelen 9.2.3.1 tot en met 9.2.3.4 van de wet][ref1] en de [artikelen 1a][ref2] en
      [5 van het besluit][ref3] zijn van overeenkomstige toepassing ten aanzien van preparaten die zijn bestemd voor
      uitvoer naar een ander land dan een Lid-Staat van de Europese Unie of een Staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, onverminderd de door het land waarvoor de desbetreffende preparaten
      zijn bestemd, ten aanzien van de verpakking en aanduiding bij aflevering gestelde specifieke en ter zake geldende
      voorschriften.

      2 In afwijking van het eerste lid zijn de door het land van invoer gestelde eisen ten aanzien van het
      aanduiden van het preparaat van toepassing, indien deze dezelfde waarborg bieden ten aanzien van de
      bescherming van gezondheid, veiligheid en milieu als de eisen die daaromtrent zijn gesteld bij of krachtens de
      [artikelen 9.2.3.1 tot en met 9.2.3.4 van de wet][ref4].

      3 De aanduidingen die ingevolge het eerste lid op de verpakking worden aangebracht, zijn, indien dit uitvoerbaar
      is, gesteld in de taal of in een of meer van de hoofdtalen van het land of het gebied waarvoor het preparaat is
      bestemd.


