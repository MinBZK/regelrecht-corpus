preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 13 juli 2010, nr.
    2010-0000483371, Directie Constitutionele Zaken en Wetgeving, gedaan in overeenstemming met de regering van de
    Nederlandse Antillen en de bestuurscolleges van de eilandgebieden Curaçao en Sint Maarten;

    Overwegende dat het met het oog op de opheffing van het land de Nederlandse Antillen wenselijk is om regels te
    stellen betreffende de overgang onder algemene titel van alle op het land de Nederlandse Antillen rustende rechten
    en verplichtingen naar burgerlijk recht op de nieuwe landen Curaçao, Sint Maarten en, met betrekking tot de
    openbare lichamen Bonaire, Sint Eustatius en Saba, de Staat der Nederlanden;

    Gelet op artikel 38, tweede lid, van het Statuut voor het Koninkrijk der Nederlanden;

    De Raad van State van het Koninkrijk gehoord (advies van 12 augustus 2010, nr. W04.10.0348/I/K);

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 14 september
    2010, nr. 2010-0000597264, Directie Constitutionele Zaken en Wetgeving, uitgebracht in overeenstemming met de
    regering van de Nederlandse Antillen en de bestuurscolleges van de eilandgebieden Curaçao en Sint Maarten;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0028594/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *land:* Curaçao, Sint Maarten of, met betrekking tot Bonaire, Sint Eustatius en Saba, Nederland, dan wel de met
      die landen corresponderende rechtspersonen land Curaçao, land Sint Maarten of Staat der Nederlanden;
        - *land Nederlandse Antillen:* de rechtspersoon land Nederlandse Antillen;
        - *tijdstip van transitie:* het tijdstip, genoemd in [artikel 11, eerste lid][ref1];
        - *verkrijgende land:* het land waarop een recht of verplichting naar burgerlijk recht overgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028594#Artikel11
    url: https://wetten.overheid.nl/BWBR0028594/2010-10-10#Artikel1
    references:
      - id: ref1
