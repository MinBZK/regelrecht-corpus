        artikel: '7'
  - number: '9'
    text: |-
      1 De landen Curaçao en Sint Maarten en de Staat der Nederlanden hebben elk recht op een aandeel in het vermogen
      van het Algemeen Pensioenfonds van de Nederlandse Antillen, naar de waarde van dat vermogen op de dag voorafgaand
      aan het tijdstip van transitie. De vaststelling van de omvang en de verdeling van dat vermogen geschieden
      overeenkomstig de daartoe in de Onderlinge regeling opvolging en boedelscheiding Algemeen Pensioenfonds Nederlandse
      Antillen en opvolging van enkele andere aanverwante regelingen vastgelegde afspraken.

      2 Het Algemeen Pensioenfonds van de Nederlandse Antillen en, vanaf het tijdstip van transitie, zijn rechtsopvolger
      reserveren, bij wijze van voorschot op de in het eerste lid bedoelde verdeling, een bedrag van ANG 291.594.000 ten
      behoeve van het Pensioenfonds Sint Maarten. Het gereserveerde bedrag wordt op daartoe strekkend verzoek uitbetaald
      aan het land Sint Maarten.

      3 Het Algemeen Pensioenfonds van de Nederlandse Antillen betaalt zo spoedig mogelijk na het tijdstip, bedoeld in
      [artikel 11, tweede lid][ref1], doch uiterlijk op de dag voorafgaand aan het tijdstip van transitie, de Staat der
      Nederlanden ten behoeve van het Pensioenfonds BES een bedrag van ANG 241.607.000 als voorschot op de in het eerste
      lid bedoelde verdeling.

      4 Na betaling van het in het derde lid bedoelde bedrag heeft het Algemeen Pensioenfonds van de Nederlandse Antillen
      een vordering van gelijke omvang op de Staat der Nederlanden. Bedoelde vordering vervalt op het tijdstip van
      transitie.

      5 De in het tweede lid bedoelde verplichtingen rusten, indien voor het Algemeen Pensioenfonds van de Nederlandse
      Antillen geen rechtsopvolger is aangewezen, vanaf het tijdstip van transitie op het land Curaçao.


      [ref1]: https://wetten.overheid.nl/BWBR0028594#Artikel11
    url: https://wetten.overheid.nl/BWBR0028594/2010-10-10#Artikel9
