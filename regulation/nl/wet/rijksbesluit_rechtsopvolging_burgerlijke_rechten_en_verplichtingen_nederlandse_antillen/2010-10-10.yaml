        artikel: '11'
  - number: '2'
    text: |-
      1 Overeenkomstig de [artikelen 3 tot en met 6][ref1] gaan op het tijdstip van transitie alle rechten en
      verplichtingen van het land Nederlandse Antillen naar burgerlijk recht over op de landen, zonder dat daarvoor een
      nadere akte wordt gevorderd.

      2 De [artikelen 3 tot en met 5][ref2] zijn niet van toepassing op aandelen en deelnemingen als bedoeld in
      [artikel 6][ref3] en de daaruit voortvloeiende rechten en verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028594#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028594#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028594#Artikel6
    url: https://wetten.overheid.nl/BWBR0028594/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028594
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028594
        artikel: '3'
