        artikel: '6'
  - number: '8'
    text: |-
      1 Alle rechten en verplichtingen naar burgerlijk recht van de in het tweede lid genoemde, bij landsverordening van
      de Nederlandse Antillen ingestelde, rechtspersonen gaan op het tijdstip van transitie over op de door Curaçao in te
      stellen of aan te wijzen rechtsopvolgers van de desbetreffende rechtspersonen, zonder dat daarvoor een nadere akte
      wordt gevorderd.

      2 De in het eerste lid bedoelde rechtspersonen zijn:

      a. de Postspaarbank;

      b. de Universiteit van de Nederlandse Antillen;

      c. het Bureau Telecommunicatie en Post;

      d. het Algemeen Pensioenfonds van de Nederlandse Antillen

      e. het werkliedenpensioenfonds.

      3 Voor zover op het tijdstip van transitie nog geen rechtsopvolgers zijn aangewezen voor een of meer van de in het
      tweede lid genoemde rechtspersonen gaan alle rechten en verplichtingen naar burgerlijk recht van de desbetreffende
      rechtspersonen op het tijdstip van transitie over op het land Curaçao.

      4 Alle rechten en verplichtingen naar burgerlijk recht van de Bank van de Nederlandse Antillen gaan op het tijdstip
      van transitie over op de Centrale Bank van Curaçao en Sint Maarten, zonder dat daarvoor een nadere akte wordt
      gevorderd.

      5 [Artikel 7, eerste en tweede lid][ref1], is van overeenkomstige toepassing.

      6 Indien op het tijdstip van transitie een in het tweede of vierde lid genoemde rechtspersoon als partij betrokken
      is bij een geschil of rechtsgeding ter zake van rechten of verplichtingen als bedoeld in het eerste lid, treedt met
      ingang van het tijdstip van transitie de rechtsopvolger van die rechtspersoon in zijn plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0028594#Artikel7
    url: https://wetten.overheid.nl/BWBR0028594/2010-10-10#Artikel8
    references:
      - id: ref1
