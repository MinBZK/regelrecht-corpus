        artikel: '6'
  - number: '3'
    text: |-
      1 De eigendom van aan het land Nederlandse Antillen toebehorende zaken gaat over op:

      a. indien het onroerende zaken betreft: het land waar de zaak is gelegen;

      b. indien het roerende zaken betreft: het land waar de zaak zich op het tijdstip van transitie bevindt.

      2 Indien een aan het land Nederlandse Antillen toebehorende zaak buiten het grondgebied van de Nederlandse Antillen
      is gelegen of zich op het tijdstip van transitie buiten dat grondgebied bevindt, gaat de eigendom van de zaak over
      op het land Curaçao.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op aan het land Nederlandse Antillen toebehorende
      beperkte rechten waaraan zaken zijn onderworpen.

      4 Tezamen met de eigendom van een zaak of het beperkte recht waaraan een zaak is onderworpen, gaan op het
      verkrijgende land alle met betrekking tot die zaak of dat beperkte recht op het land Nederlandse Antillen rustende
      rechten en verplichtingen over.
    url: https://wetten.overheid.nl/BWBR0028594/2010-10-10#Artikel3
  - number: '4'
    text: |-
      1 Rechten en verplichtingen van het land Nederlandse Antillen, voortvloeiend uit een door of namens dat land
      gesloten overeenkomst, gaan over op:

      a. indien is overeengekomen dat de kenmerkende prestatie in een bepaald land moet worden geleverd: het land waar
      die prestatie moet worden geleverd;

      b. indien uit de overeenkomst anderszins voortvloeit dat de kenmerkende prestatie naar haar aard uitsluitend in
      of door een bepaald land kan worden geleverd: het land waarin of waardoor die prestatie uitsluitend kan worden
      geleverd;

      c. in alle overige gevallen: het land Curaçao.

      2 Het eerste lid is niet van toepassing op rechten en verplichtingen als bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028594#Artikel3
    url: https://wetten.overheid.nl/BWBR0028594/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028594
        artikel: '3'
  - number: '5'
    text: |-
      Overige rechten en verplichtingen van het land Nederlandse Antillen naar burgerlijk recht gaan over op het land
      Curacao, tenzij uit de aard van het recht of de verplichting voortvloeit dat het recht uitsluitend kan worden
      uitgeoefend, dan wel de verplichting uitsluitend kan worden nagekomen, in of door een ander land. Alsdan gaat het
      recht of de verplichting over op dat andere land.
    url: https://wetten.overheid.nl/BWBR0028594/2010-10-10#Artikel5
  - number: '6'
    text: |-
      1 De aan het land Nederlandse Antillen toebehorende aandelen in de naamloze vennootschappen, genoemd in de bijlage
      bij dit besluit, gaan over op de in die bijlage genoemde rechtsopvolger of rechtsopvolgers.

      2 Tezamen met de in het eerste lid bedoelde aandelen gaan op het verkrijgende land over alle met betrekking tot die
      aandelen op het land Nederlandse Antillen rustende rechten en verplichtingen naar burgerlijk recht.

      3 Voor de toepassing van het eerste lid worden met aandelen gelijkgesteld certificaten van aandelen, alsmede opties
      ter verwerving van aandelen of certificaten van aandelen.

      4 De uit de deelneming van het land Nederlandse Antillen in de commanditaire vennootschap Antilliaanse
      Luchtvaartmaatschappij CV voortvloeiende rechten en verplichtingen gaan over op het land Curaçao.
    url: https://wetten.overheid.nl/BWBR0028594/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 Op de in de [artikelen 3 tot en met 5][ref1] bedoelde rechten en verplichtingen is, tenzij door partijen anders
      is overeengekomen of uit internationaal privaatrecht anders voortvloeit, na het tijdstip van transitie het recht
      van het verkrijgende land van toepassing. Op de in [artikel 6][ref2] bedoelde rechten en verplichtingen is het
      recht van toepassing van het land van de statutaire zetel van de desbetreffende vennootschap.

      2 Voor de toepassing van het eerste lid wordt, indien het rechten en verplichtingen betreft die overgaan op de
      Staat der Nederlanden, onder recht van het verkrijgende land verstaan: het in de openbare lichamen Bonaire, Sint
      Eustatius en Saba geldende recht. Indien een vennootschap haar statutaire zetel heeft in de openbare lichamen
      Bonaire, Sint Eustatius of Saba, wordt onder het recht van het land van de statutaire zetel verstaan: het recht van
      genoemde openbare lichamen.

      3 Indien op het tijdstip van transitie het land Nederlandse Antillen als partij betrokken is bij een geschil
      of rechtsgeding ter zake van rechten of verplichtingen als bedoeld in het eerste lid, treedt met ingang van het
      tijdstip van transitie het verkrijgende land in de plaats van het land Nederlandse Antillen.


      [ref1]: https://wetten.overheid.nl/BWBR0028594#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028594#Artikel6
    url: https://wetten.overheid.nl/BWBR0028594/2010-10-10#Artikel7
