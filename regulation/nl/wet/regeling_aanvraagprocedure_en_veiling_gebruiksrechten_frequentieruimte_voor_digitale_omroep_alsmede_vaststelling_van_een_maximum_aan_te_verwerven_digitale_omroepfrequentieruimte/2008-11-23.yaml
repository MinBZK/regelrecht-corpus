  - number: '7'
    text: |-
      Bij een procedure van veiling of vergelijkende toets, bedoeld in
      [artikel 6a, eerste lid, van het Frequentiebesluit][ref1], kan een aanvrager als bedoeld in
      [artikel 3.3, eerste lid, van de wet][ref2] binnen de categorie digitale omroep niet meer frequentieruimte
      verwerven dan vier multiplexen die elkaar alle over en weer op ten minste één dezelfde locatie in Nederland
      overlappen.


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel7
