  - number: '2'
    text: |-
      Ingevolge het [besluit van de Minister van 5 november 2008][ref1] (Stcrt. 2008, 227) zijn de volgende vergunningen
      beschikbaar om door middel van een veiling te worden verleend:

      a. vergunning A: een vergunning met een regionale indeling en een frequentiebereik van 174,160 MHz–175,696 MHz
      (frequentieblok 5A), 175,872 MHz–177,408 MHz (frequentieblok 5B), 177,584 MHz–179,120 MHz (frequentieblok 5C),
      179,296 MHz–180,832 MHz (frequentieblok 5D), 191,584 MHz–193,120 MHz (frequentieblok 7C), 198,592 MHz–200,128 MHz
      (frequentieblok 8C), 216,160 MHz–217,696 MHz (frequentieblok 11A), 217,872 MHz–219,408 MHz (frequentieblok 11B),
      224,880 MHz–226,416 MHz (frequentieblok 12B);

      b. vergunning B: een vergunning met een lokale indeling en een frequentiebereik van 1452,192 MHz–1479,408 MHz,
      verdeeld in zestien afzonderlijke frequentieblokken, LA tot en met LP.


      [ref1]: https://wetten.overheid.nl/BWBR0024729
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel2
