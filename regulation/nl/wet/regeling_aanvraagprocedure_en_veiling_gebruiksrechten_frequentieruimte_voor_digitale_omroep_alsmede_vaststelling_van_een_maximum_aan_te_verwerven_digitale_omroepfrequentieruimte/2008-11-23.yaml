  - number: '4'
    text: |-
      1 Elke aanvrager dient slechts één aanvraag in. Per groep is er maar één aanvrager.

      2 De aanvraag wordt uiterlijk op 9 januari 2009 om 14.00 uur per post ontvangen op dan wel door middel van
      persoonlijke overhandiging ingediend bij het volgende adres:

      De Minister van Economische Zaken

      p/a werkgroep Digitale Omroep

      Agentschap Telecom

      Emmasingel 1

      9726 AH Groningen

      3 Indien de aanvrager niet heeft voldaan aan de in het tweede lid gestelde eisen, wordt de aanvraag geweigerd.
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel4
  - number: '5'
    text: |-
      1 De aanvrager informeert de Minister onmiddellijk, per brief geadresseerd aan het adres, vermeld in
      [artikel 4, tweede lid][ref1], over wijzigingen met betrekking tot de in [artikel 3, derde en vierde lid][ref2],
      bedoelde gegevens en bescheiden.

      2 Na het tijdstip, bedoeld in [artikel 4, tweede lid][ref3], wordt de aanvraag niet gewijzigd.

      3 Indien de aanvrager niet heeft voldaan aan de in [artikel 3, tweede tot en met zesde lid][ref4], of
      [artikel 4, eerste lid][ref5], gestelde eisen, deelt de Minister dit de aanvrager mee en stelt de Minister
      de aanvrager overeenkomstig [artikel 4:5 Algemene wet bestuursrecht][ref6] in de gelegenheid het verzuim te
      herstellen.

      4 De aanvrager heeft gedurende vijf werkdagen, te rekenen vanaf de dag nadat de mededeling, bedoeld in het derde
      lid, is verstuurd, de gelegenheid het verzuim te herstellen.

      5 De gegevens ten behoeve van het verzuimherstel, bedoeld in het derde lid, worden per post ontvangen op dan wel
      door middel van persoonlijke overhandiging ingediend bij het adres, vermeld in [artikel 4, tweede lid][ref7].

      6 Indien het verzuim, bedoeld in het derde lid, binnen de termijn, vermeld in het vierde lid, niet is
      hersteld of de aanvraag na herstel niet voldoet aan de in [artikel 3, tweede tot en met zesde lid][ref8],
      of [artikel 4, eerste lid][ref9], gestelde eisen, wordt de aanvraag overeenkomstig
      [artikel 4:5 Algemene wet bestuursrecht][ref10] niet in behandeling genomen.


