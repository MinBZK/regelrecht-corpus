  - number: '3'
    text: |-
      1 Degene die voor één of beide vergunningen in aanmerking wil komen, dient een aanvraag in.

      2 In de aanvraag wordt aangegeven welke vergunning of vergunningen, bedoeld in [artikel 2][ref1], wordt of worden
      aangevraagd.

      3 In de aanvraag worden de namen vermeld van ten minste één en ten hoogste vier natuurlijke personen, die
      beschikken over een rechtsgeldige en toereikende volmacht om namens de aanvrager handelingen te verrichten
      gedurende de veiling.

      4 De aanvraag bevat verder de gegevens en bescheiden, bedoeld in de bij deze regeling behorende [bijlage I][ref2],
      en wordt overeenkomstig het model in [die bijlage][ref3] ingedeeld.

      5 De aanvraag is in de Nederlandse taal gesteld.

      6 Met de gegevens en bescheiden, bedoeld in het vierde lid, worden gelijkgesteld zodanige gegevens en bescheiden
      krachtens het recht van een van de andere lidstaten van de Europese Unie of een van de andere staten die partij
      zijn bij de Overeenkomst betreffende de Europese Economische Ruimte.

      7 De gegevens en bescheiden, bedoeld in het zesde lid, mogen in afwijking van het vijfde lid, in een van de
      officiële talen van de Europese Unie of de Europese Economische Ruimte worden gesteld. In dat geval worden die
      gegevens en bescheiden vergezeld van een Nederlandse vertaling van die gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0024730#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024730
      [ref3]: https://wetten.overheid.nl/BWBR0024730
