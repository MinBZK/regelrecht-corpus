        artikel: '9'
        paragraaf: '6'
  - number: '19'
    text: |-
      1 De Minister stelt voorafgaand aan de eerste ronde met betrekking tot die ronde vast:

      1°. vanaf welk tijdstip de biedkaarten kunnen worden ingeleverd; en

      2°. op welk tijdstip de biedkaarten uiterlijk moeten zijn ingeleverd.

      2 De Minister stelt voorafgaand aan elke volgende ronde vast:

      a. met betrekking tot de voorgaande ronde:

      1°. het rondenummer;

      2°. het aantal keren dat op de onderscheidenlijke vergunningen een geldig bod is uitgebracht;

      3°. het door middel van een geldig bod hoogste geboden bedrag per vergunning alsmede het aantal keren dat dit
      hoogste bedrag is geboden; en

      4°. de deelnemer die, na eventuele loting als bedoeld in [artikel 25, tweede lid][ref1], wordt aangemerkt als
      degene die de hoogste geldige bieding heeft uitgebracht.

      b. met betrekking tot de volgende ronde:

      1°. het rondenummer;

      2°. het aantal deelnemers dat gerechtigd is een bod uit te brengen op de onderscheidenlijke vergunningen;

      3°. het minimaal te bieden bedrag per vergunning;

      4°. vanaf welk tijdstip de biedkaarten kunnen worden ingeleverd; en

      5°. op welk tijdstip de biedkaarten uiterlijk moeten zijn ingeleverd.

      3 Onverminderd [artikel 24, tweede lid][ref2], eindigt een ronde op het tijdstip, bedoeld in het eerste lid, sub 2,
      onderscheidenlijk het tweede lid, aanhef en onder b, sub 5, of zoveel eerder als alle biedkaarten zijn ingeleverd
      met inachtneming van [artikel 21, eerste lid][ref3].

      4 De Minister deelt hetgeen hij heeft vastgesteld op grond van het eerste lid, het tweede lid, aanhef en onder a,
      sub 1 tot en met 3, en het tweede lid, aanhef en onder b, aan alle deelnemers mee, met dien verstande dat hij per
      vergunning het op grond van het tweede lid, aanhef en onder a, sub 3 vastgestelde hoogste geboden bedrag naar boven
      afrondt op eenheden van € 1.000.

      5 De Minister deelt hetgeen hij heeft vastgesteld op grond van het tweede lid, aanhef en onder a, sub 4, mee aan de
      betreffende deelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0024730#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0024730#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0024730#Artikel21
