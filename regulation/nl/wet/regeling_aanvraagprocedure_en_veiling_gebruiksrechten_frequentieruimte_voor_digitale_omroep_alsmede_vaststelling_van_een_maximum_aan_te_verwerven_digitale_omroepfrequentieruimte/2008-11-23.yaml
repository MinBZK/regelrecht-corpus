        artikel: '3.3'
  - number: '8'
    text: |-
      Indien na het tijdstip, bedoeld in [artikel 4, tweede lid][ref1], en voor de datum van vergunningverlening als
      bedoeld in [artikel 28, eerste lid][ref2], de aanvrager frequentieruimte verkrijgt binnen de categorie digitale
      omroep als gevolg van een overdracht of een overgang, dan wel als gevolg van het feit dat een andere rechtspersoon
      of vennootschap die houder is van een vergunning binnen de categorie digitale omroep is gaan behoren tot de groep
      van de aanvrager, kan de Minister, voor zover noodzakelijk in afwijking van de [artikelen 9 tot en met 28][ref3],
      de besluiten nemen die nodig zijn om te bereiken dat de aanvrager niet meer frequentieruimte kan verkrijgen dan
      de frequentieruimte, bedoeld in [artikel 7][ref4], daaronder begrepen frequentieruimte die niet op basis van deze
      regeling wordt verdeeld. Hiertoe kan hij onder meer besluiten dat:

      a. bij het vaststellen van schaarste de aanvraag van de aanvrager voor één of beide vergunningen niet wordt
      meegerekend;

      b. de uitkomst van een of meer biedronden of een of meer biedingen ongeldig is;

      c. een of meer biedronden opnieuw moeten worden gehouden, of

      d. een aanvraag van de aanvrager voor één of beide vergunningen wordt geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024730#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0024730#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0024730#Artikel9
