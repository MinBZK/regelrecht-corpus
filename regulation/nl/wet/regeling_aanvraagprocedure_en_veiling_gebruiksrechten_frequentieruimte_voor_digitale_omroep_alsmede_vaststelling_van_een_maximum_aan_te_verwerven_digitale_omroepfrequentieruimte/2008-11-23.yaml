  - number: '20'
    text: |-
      1 De Minister verstrekt voorafgaand aan elke ronde een biedkaart aan iedere deelnemer die gerechtigd is een bod uit
      te brengen. Het model van de biedkaart is als [bijlage III][ref1] bij deze regeling gevoegd.

      2 Een bod wordt uitgebracht door middel van de in het eerste lid bedoelde biedkaart.

      3 De biedkaart wordt in de Nederlandse taal ingevuld en op de plaats van de veiling bij de Minister ingeleverd.

      4 Het bedrag van een bieding of een bod wordt zowel in cijfers als letters geschreven en wordt vermeld in hele
      euro’s.


      [ref1]: https://wetten.overheid.nl/BWBR0024730
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024730
  - number: '21'
    text: |-
      1 Een bod wordt uitgebracht door middel van een biedkaart die:

      a. niet eerder dan het in
      [artikel 19, eerste lid, aanhef en sub 1, onderscheidenlijk tweede lid, aanhef en onder b, sub 4][ref1],
      bedoelde tijdstip, en niet later dan het in
      [artikel 19, eerste lid, aanhef en sub 2, onderscheidenlijk tweede lid, aanhef en onder b, sub 5][ref2], bedoelde
      tijdstip bij de Minister wordt ingeleverd;

      b. wordt ingeleverd door een deelnemer die gerechtigd is in de betreffende ronde een bod uit te brengen op de
      betreffende vergunning dan wel op de betreffende vergunningen; en

      c. volledig en op de juiste wijze is ingevuld en ondertekend.

      2 De Minister stelt vast of degene die de biedkaart inlevert, gerechtigd is namens de deelnemer handelingen te
      verrichten in de veilingprocedure.

      3 De Minister neemt een biedkaart niet in ontvangst:

      a. indien niet is voldaan aan het bepaalde in het eerste lid, onder a;

      b. indien de biedkaart wordt ingeleverd door een deelnemer die niet gerechtigd is een bod uit te brengen; of

      c. van degene die niet gerechtigd is namens de deelnemer handelingen te verrichten in de veilingprocedure.


      [ref1]: https://wetten.overheid.nl/BWBR0024730#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0024730#Artikel19
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel21
