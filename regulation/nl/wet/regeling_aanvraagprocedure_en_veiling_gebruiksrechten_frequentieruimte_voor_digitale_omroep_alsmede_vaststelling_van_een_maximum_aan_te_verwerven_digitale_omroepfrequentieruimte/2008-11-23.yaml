  - number: '6'
    text: |-
      1 De aanvrager is een privaatrechtelijke rechtspersoon naar Nederlands recht of het equivalent daarvan naar het
      recht van een van de overige lidstaten van de Europese Unie of een van de overige staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte, en heeft zijn statutaire zetel, zijn hoofdbestuur of zijn
      hoofdvestiging binnen de Europese Economische Ruimte.

      2 De aanvrager voldoet voorts aan de volgende eisen:

      1°. de aanvrager verkeert niet in staat van faillissement of liquidatie;

      2°. de aanvrager is geen surseance van betaling verleend, noch is door de aanvrager surseance van betaling
      aangevraagd; en

      3°. er is geen beslag gelegd op het vermogen dan wel een of meer bedrijfsmiddelen van de aanvrager, die een
      aanmerkelijk deel van het vermogen van de aanvrager vormen.

      3 Met de eisen van het tweede lid, onder 1, 2 en 3, worden gelijkgesteld zodanige eisen volgens het recht van
      een van de andere lidstaten van de Europese Unie of een van de andere staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte.

      4 Binnen vier weken na het tijdstip, bedoeld in [artikel 4, tweede lid][ref1]:

      a. stelt de Minister vast of de aanvrager wiens aanvraag in behandeling is genomen, voldoet aan de eisen, bedoeld
      in het eerste en tweede lid, en

      b. geeft de Minister toepassing aan [artikel 6a, tweede lid, van het Frequentiebesluit][ref2].

      5 Indien uit de aanvraag niet blijkt dat aan de eisen, bedoeld in het eerste en tweede lid, is voldaan dan wel de
      Minister krachtens [artikel 6a, tweede lid, van het Frequentiebesluit][ref3] een aanvrager volledig uitsluit van
      deelname aan de veiling, wijst de Minister de aanvraag af.


      [ref1]: https://wetten.overheid.nl/BWBR0024730#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009997#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0009997#Artikel6a
