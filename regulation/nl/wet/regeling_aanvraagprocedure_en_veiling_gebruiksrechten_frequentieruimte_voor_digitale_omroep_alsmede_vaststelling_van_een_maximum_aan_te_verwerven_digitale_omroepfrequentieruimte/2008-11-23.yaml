        bwb_id: BWBR0024730
        artikel: '24'
        paragraaf: '9'
  - number: '28'
    text: |-
      1 Na toepassing van [artikel 27][ref1] wordt een vergunning verleend aan de deelnemer met de hoogste geldige
      bieding op die vergunning. Het door de betreffende deelnemer voor die vergunning verschuldigde bedrag is gelijk
      aan het door hem geboden hoogste bedrag op de betreffende vergunning. De Minister deelt alle deelnemers mee welke
      vergunningen aan wie zullen worden verleend.

      2 De Minister wijst de overige aanvragen af.

      3 Uiterlijk twee weken nadat de mededeling, bedoeld in het eerste lid, is gedaan:

      a. stort de Minister de waarborgsom van de deelnemer aan wie geen vergunningen worden verleend, terug;

      b. stuurt de Minister aan de bank van iedere deelnemer aan wie geen vergunning wordt verleend en die
      ter zekerheidstelling een bankgarantie heeft overgelegd, een schriftelijke verklaring als bedoeld in
      [artikel II, onder 4, van bijlage II][ref2]. Een kopie van voornoemde verklaring stuurt de Minister aan de
      deelnemer;

      c. betaalt de deelnemer aan wie een vergunning wordt verleend en die een bankgarantie had gesteld, het door hem
      verschuldigde bedrag voor die vergunning, door overmaking van dat bedrag op het bankrekeningnummer, genoemd in
      [artikel 11, eerste lid][ref3], onder vermelding van ‘Ministerie van Economische Zaken, Digitale omroepveiling’.
      Zodra het verschuldigde bedrag is ontvangen, stuurt de Minister een schriftelijke verklaring als bedoeld in
      [artikel II, onder 4, van bijlage II][ref4], aan de Bank van die deelnemer. Een kopie van voornoemde verklaring
      stuurt de Minister aan de deelnemer.

      d. wordt de waarborgsom van de deelnemer aan wie een vergunning wordt verleend aangewend voor de betaling van het
      voor die vergunning verschuldigde bedrag, bedoeld in het eerste lid, met dien verstande dat:

      1°. indien de waarborgsom van een deelnemer minder dan het voor die vergunning verschuldigde bedrag bedraagt,
      die deelnemer het restant van het verschuldigde bedrag betaalt door overmaking van dat restant op het
      bankrekeningnummer, genoemd in [artikel 11, eerste lid][ref5], onder vermelding van ‘Ministerie van Economische
      Zaken, Digitale omroepveiling’, uiterlijk twee weken nadat de mededeling, bedoeld in het eerste lid, is gedaan, en

      2°. indien de waarborgsom van een deelnemer meer dan het voor die vergunning verschuldigde bedrag bedraagt,
      het bedrag van de waarborgsom dat resteert, aan die deelnemer wordt teruggestort uiterlijk twee weken nadat de
      mededeling, bedoeld in het eerste lid, is gedaan.

      4 De Minister vergoedt de rente over de gestorte waarborgsom vanaf de dag waarop hij de waarborgsom heeft ontvangen
      op het bankrekeningnummer, genoemd in [artikel 11, eerste lid][ref6], met dien verstande dat de rente wordt vergoed
      tot en met de dag:

      a. voorafgaand aan de dag waarop de waarborgsom door de Minister wordt teruggestort: voor de deelnemer aan wie geen
      vergunningen worden verleend, of

      b. waarop de mededeling, bedoeld in het eerste lid, is gedaan: voor de deelnemer aan wie een vergunning wordt
      verleend, met dien verstande dat er alleen rente wordt betaald over het door de deelnemer gestorte bedrag.

      5 De Minister vergoedt voorts aan een deelnemer van wie de waarborgsom meer bedraagt dan het voor die vergunning
      verschuldigde bedrag, rente over het restant, bedoeld in het derde lid, onderdeel d, sub 2°, over de periode vanaf
      de dag na de dag dat de mededeling, bedoeld in het eerste lid, is gedaan tot en met de dag voorafgaand aan de dag
      waarop de waarborgsom door de Minister wordt teruggestort, met dien verstande dat alleen rente wordt betaald over
      dat restant.

      6 De Minister stort de rente, bedoeld in het vierde en vijfde lid, op dezelfde dag waarop hij de waarborgsom of het
      bedrag dat resteert van de waarborgsom, terugstort.


      [ref1]: https://wetten.overheid.nl/BWBR0024730#Artikel27
