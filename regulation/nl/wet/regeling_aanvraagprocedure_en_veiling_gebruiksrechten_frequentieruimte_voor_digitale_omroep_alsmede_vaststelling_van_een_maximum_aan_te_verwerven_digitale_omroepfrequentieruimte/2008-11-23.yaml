  - number: '23'
    text: |-
      1 De eerste ronde uitgezonderd brengt een deelnemer in een ronde een bod uit op ten hoogste het aantal vergunningen
      waarop zijn geldige bod in de daaraan voorafgaande ronde betrekking had.

      2 In afwijking van [artikel 22, tweede tot en met vijfde lid][ref1], wordt een deelnemer die in een ronde op
      een vergunning de hoogste geldige bieding uitbracht, geacht in de daarop volgende ronde dezelfde bieding op die
      vergunning te hebben uitgebracht.

      3 Het tweede lid is niet van toepassing op de eindronde, bedoeld in [artikel 26, eerste lid, onder b][ref2], en een
      extra ronde als bedoeld in [artikel 26, derde lid][ref3].


