  - number: '9'
    text: |-
      1 Indien de Minister voor een vergunning als bedoeld in [artikel 2][ref1] op grond van
      [artikel 6, vierde lid, onderdeel a][ref2], vaststelt dat, uitgezonderd de aanvragers waarvan de aanvraag is
      geweigerd op grond van [artikel 6, vijfde lid][ref3], slechts één aanvrager voldoet aan de eisen, gesteld in
      [artikel 6][ref4], vindt veiling van die vergunning niet plaats en wordt die vergunning aan de betreffende
      aanvrager verleend.

      2 Indien de Minister voor een vergunning als bedoeld in [artikel 2][ref5] op grond van
      [artikel 6, vierde lid, onderdeel a][ref6], vaststelt dat, uitgezonderd de aanvragers waarvan de aanvraag is
      geweigerd op grond van [artikel 6, vijfde lid][ref7], meerdere aanvragers voldoen aan de eisen, gesteld in
      [artikel 6][ref8], wordt die vergunning geveild.

      3 Indien een aanvrager op grond van een krachtens [artikel 6a, tweede lid, van het Frequentiebesluit][ref9]
      genomen besluit slechts één vergunning mag verwerven, wordt hij voor de toepassing van het eerste en tweede lid
      uitsluitend aangemerkt als een aanvrager voor die vergunning waarvoor hij een voorkeur heeft aangegeven als bedoeld
      in [bijlage I, onderdeel A.3][ref10].


