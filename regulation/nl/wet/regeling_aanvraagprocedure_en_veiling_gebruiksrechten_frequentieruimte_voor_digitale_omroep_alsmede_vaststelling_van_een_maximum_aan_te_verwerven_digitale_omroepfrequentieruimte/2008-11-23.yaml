  - number: '25'
    text: |-
      Indien in een ronde twee of meer deelnemers door middel van geldige biedingen hetzelfde hoogste bedrag voor
      eenzelfde vergunning hebben geboden, stelt de Minister op grond van een loting vast wie van hen wordt aangemerkt
      als degene die in die ronde voor die vergunning het hoogste bedrag heeft geboden.
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel25
  - number: '26'
    text: |-
      1 De veiling eindigt indien:

      a. de hoogste geldige bieding voor elke vergunning hetzelfde bedrag oplevert als in de voorafgaande ronde; of

      b. de laatste ronde die door de Minister als eindronde is aangemerkt, heeft plaatsgevonden.

      2 De eindronde, bedoeld in het eerste lid, onder b, wordt ten minste vier ronden van te voren aangekondigd aan
      de deelnemers.

      3 In afwijking van het eerste lid vinden na de laatste ronde nog een of meerdere extra ronden plaats, indien twee
      of meer deelnemers in die laatste ronde hetzelfde hoogste bedrag voor eenzelfde vergunning hebben geboden of hebben
      staan.

      4 In de extra ronden, bedoeld in het derde lid, zijn uitsluitend de deelnemers, bedoeld in het derde lid,
      gerechtigd een bod uit te brengen voor die vergunning waarvoor zij hetzelfde bedrag hebben geboden.

      5 De extra ronden, bedoeld in het derde lid, eindigen zodra er niet hetzelfde hoogste bedrag voor eenzelfde
      vergunning meer wordt geboden door twee of meer deelnemers.
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel26
  - number: '27'
    text: |-
      De Minister stelt na het einde van de veiling voor elk van de vergunningen vast:

      a. welke deelnemer de hoogste geldige bieding heeft uitgebracht; of

      b. dat er, na toepassing van [artikel 24][ref1], geen geldig bod is uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0024730#Artikel24
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel27
    references:
