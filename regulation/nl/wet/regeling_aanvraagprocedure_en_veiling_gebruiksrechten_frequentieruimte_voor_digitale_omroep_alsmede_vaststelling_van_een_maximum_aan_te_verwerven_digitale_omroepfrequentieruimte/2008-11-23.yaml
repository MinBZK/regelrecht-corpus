  - number: '12'
    text: |-
      1 De Minister bepaalt de plaats van de veiling alsmede het tijdstip waarop de veiling een aanvang neemt. De plaats
      en het tijdstip van de veiling worden schriftelijk aan de deelnemers medegedeeld.

      2 De veiling wordt uitsluitend op werkdagen gehouden.
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel12
  - number: '13'
    text: De Minister leidt de veiling en draagt zorg voor een goed verloop van de veiling.
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel13
  - number: '14'
    text: Gedurende de veiling geschiedt alle communicatie tussen een deelnemer en de Minister uitsluitend schriftelijk.
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel14
  - number: '15'
    text: |-
      1 Een deelnemer onthoudt zich voorafgaand aan en gedurende de veilingprocedure van afspraken of gedragingen die
      afbreuk doen of kunnen doen aan een goed verloop van de veiling, de mededinging in de veilingprocedure daaronder
      begrepen.

      2 De Minister kan een deelnemer die handelt in strijd met het eerste lid van deelname of van verdere deelname aan
      de veiling uitsluiten.
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel15
  - number: '16'
    text: |-
      1 De Minister kan de veiling stopzetten of opschorten.

      2 De Minister kan onder meer tot stopzetten of opschorting van de veiling overgaan indien naar zijn oordeel sprake
      is van afspraken of gedragingen in strijd met [artikel 15, eerste lid][ref1].

      3 Indien een deelnemer in strijd heeft gehandeld met [artikel 15, eerste lid][ref2], kan de Minister:

      a. de uitkomst van een of meer biedronden ongeldig verklaren; en

      b. besluiten dat een of meer biedronden opnieuw moeten worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0024730#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0024730#Artikel15
