  - number: '22'
    text: |-
      1 Het minimaal te bieden bedrag per vergunning in de eerste ronde is één euro.

      2 De onderscheidenlijke minimaal te bieden bedragen per vergunning in elke volgende ronde, bedoeld
      in [artikel 19, tweede lid, aanhef en onder b, sub 3][ref1], zijn gelijk aan het op grond van
      [artikel 19, tweede lid, onder 3][ref2], hoogste geldig geboden bedrag voor de betreffende vergunning, vermeerderd
      met een bedrag waarvan de hoogte wordt bepaald op basis van het derde tot en met vijfde lid. De Minister rondt de
      minimaal te bieden bedragen naar boven af op eenheden van € 1.000.

      3 Het bedrag waarmee het hoogst geldig geboden bedrag wordt vermeerderd, is:

      a. € 10.000 zolang het hoogst geldig geboden bedrag voor die vergunning nog geen € 100.000 bedraagt; of

      b. 10% van het hoogst geldig geboden bedrag voor die vergunning indien het hoogst geldig geboden bedrag € 100.000
      of meer bedraagt.

      4 In afwijking van het derde lid, onder b, bedraagt het bedrag waarmee het hoogst geldig geboden bedrag wordt
      vermeerderd, 5% van het hoogst geldig geboden bedrag voor die vergunning, indien het hoogst geldig geboden bedrag
      € 100.000 of meer bedraagt en het aantal deelnemers dat in de laatst gehouden ronde geldige biedingen heeft
      uitgebracht op een vergunning kleiner is dan of gelijk is aan drie.

      5 In afwijking van het tweede, derde en vierde lid stelt de Minister niet een nieuw minimaal te bieden bedrag voor
      een vergunning vast, indien

      a. er in de voorafgaande ronde geen geldig bod op die vergunning is uitgebracht;

      b. de volgende ronde de laatste ronde is, als bedoeld in [artikel 26, eerste lid, aanhef en onder b][ref3]; of

      c. de volgende ronde een extra ronde is, als bedoeld in [artikel 26, derde lid][ref4].

      6 De Minister kan afwijken van het tweede tot en met vijfde lid.

      7 Het aantal vergunningen waarop door een deelnemer in de eerste ronde een bod wordt gedaan, is niet hoger dan
      de hoeveelheid vergunningen waarvan hem ingevolge [artikel 10][ref5] is meegedeeld dat hij die op basis van een
      krachtens [artikel 6a, tweede lid, van het Frequentiebesluit][ref6] genomen besluit ten hoogste mag verwerven.
      Een deelnemer biedt uitsluitend op de vergunningen waarvoor hij is toegelaten tot de veiling op grond van
      [artikel 10][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0024730#Artikel19
