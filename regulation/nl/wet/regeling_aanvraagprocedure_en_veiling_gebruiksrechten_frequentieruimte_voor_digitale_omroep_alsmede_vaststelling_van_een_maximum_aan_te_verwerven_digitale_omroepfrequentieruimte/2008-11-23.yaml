  - number: '17'
    text: Een deelnemer is onvoorwaardelijk en onherroepelijk aan zijn bod gebonden.
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel17
  - number: '18'
    text: |-
      De vergunningen, waarvan is komen vast te staan dat die op grond van [artikel 9, tweede lid][ref1], worden geveild,
      worden gelijktijdig bij opbod geveild. De veiling vindt in ronden plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0024730#Artikel9
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel18
