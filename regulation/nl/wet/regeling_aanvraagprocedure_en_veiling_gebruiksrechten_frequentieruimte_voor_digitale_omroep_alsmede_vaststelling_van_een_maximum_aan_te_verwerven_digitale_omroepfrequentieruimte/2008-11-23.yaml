  - number: '29'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel29
  - number: '30'
    text: |-
      Deze regeling wordt aangehaald als: Regeling aanvraagprocedure en veiling gebruiksrechten frequentieruimte voor
      digitale omroep alsmede vaststelling van een maximum aan te verwerven digitale omroepfrequentieruimte.
    url: https://wetten.overheid.nl/BWBR0024730/2008-11-23#Artikel30
