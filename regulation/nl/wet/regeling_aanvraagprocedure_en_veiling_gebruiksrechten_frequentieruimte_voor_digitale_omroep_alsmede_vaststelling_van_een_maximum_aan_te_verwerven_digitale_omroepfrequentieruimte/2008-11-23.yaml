  - number: '10'
    text: |-
      1 Indien na toepassing van [artikel 9][ref1] de noodzaak van veilen is komen vast te staan, deelt de Minister de
      desbetreffende aanvragers dit schriftelijk mede. De Minister deelt iedere aanvrager hierbij tevens mede of en voor
      welke vergunning of vergunningen hij als deelnemer wordt toegelaten tot de veiling alsmede hoeveel vergunningen hij
      op basis van een krachtens [artikel 6a, tweede lid, van het Frequentiebesluit][ref2] genomen besluit ten hoogste
      mag verwerven tijdens de veiling.

      2 Bij de mededeling, bedoeld in het eerste lid, wordt aan de deelnemers tevens bekendgemaakt hoeveel deelnemers er
      per vergunning zijn en hoeveel deelnemers aan de veiling er in totaal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0024730#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009997#Artikel6a
