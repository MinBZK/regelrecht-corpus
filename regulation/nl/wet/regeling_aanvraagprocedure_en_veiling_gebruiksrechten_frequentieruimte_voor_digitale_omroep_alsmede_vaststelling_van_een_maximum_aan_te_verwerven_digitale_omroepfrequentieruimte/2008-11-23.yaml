  - number: '11'
    text: |-
      1 Iedere deelnemer voldoet een bedrag tot zekerheid van de gestanddoening van zijn bod. Het bedrag is gelijk aan
      € 300.000 per vergunning. Uiterlijk 48 uur voor het in [artikel 12, eerste lid][ref1], bedoelde tijdstip, is het
      bedrag ontvangen op bankrekeningnummer 19.23.23.806, ten name van de Staat der Nederlanden onder vermelding van
      ‘Ministerie van Economische Zaken/Agentschap Telecom’, of is voor het bedoelde bedrag ter zekerheidstelling een
      bankgarantie volgens het model dat als [bijlage II][ref2] bij deze regeling is gevoegd, per post ontvangen op dan
      wel door persoonlijke overhandiging ingediend bij het in [artikel 4, tweede lid][ref3], vermelde adres.

      2 De deelnemer die heeft voldaan aan de verplichting, bedoeld in het eerste lid, is gerechtigd om een bod uit te
      brengen tijdens de eerste ronde van de veiling.

      3 De deelnemer die niet heeft voldaan aan de verplichting, bedoeld in het eerste lid, is niet gerechtigd om een bod
      uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0024730#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024730
      [ref3]: https://wetten.overheid.nl/BWBR0024730#Artikel4
