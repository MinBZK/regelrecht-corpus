articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *Minister:* Minister van Economische Zaken;

      b. *aanvrager:* degene die een aanvraag doet als bedoeld in [artikel 3][ref1];

      c. *deelnemer:* aanvrager die toegelaten is tot de veiling;

      d. *bod:* een of meer biedingen, uitgebracht door middel van een biedkaart;

      e. *groep:* groep in de zin van [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2];

      f. *rente:* de volgens actual/360 berekende rente op basis van de door de Europese Centrale Bank vastgestelde Euro
      Overnight Index Average, minus 4 basispunten;

      g. *categorie digitale omroep:* de frequentieruimte binnen het bereik van 174–230 MHz (Band III), de
      frequentieruimte binnen het bereik van 470–582 MHz (Band IV), de frequentieruimte binnen het bereik van 582–862 MHz
      (Band V) en de frequentieruimte binnen het bereik van 1452–1479,5 MHz (L-band), die in het frequentieplan, bedoeld
      in [artikel 3.1 van de wet][ref3], bestemd is voor ‘Omroep, TV (analoog en DVB-T).’, ‘Omroep. DVB-T.’ of ‘Digitale
      omroep als bedoeld in de ITU Radiodienst ‘verkort’, HOL002.’;

      h. *multiplex:* ten minste eenderde deel van de netto-capaciteit van een aaneengesloten blok frequentieruimte
      waarmee in één afgebakend gebied (allotment) meerdere programma’s kunnen worden uitgezonden.


