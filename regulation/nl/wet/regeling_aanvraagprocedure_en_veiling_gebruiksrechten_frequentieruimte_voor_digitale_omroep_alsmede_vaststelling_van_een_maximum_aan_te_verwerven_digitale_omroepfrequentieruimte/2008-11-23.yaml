  - number: '24'
    text: |-
      1 De Minister beslist over de geldigheid van een bod.

      2 Indien een biedkaart niet voldoet aan de [artikelen 21, eerste lid, aanhef en onder c][ref1], [22][ref2] of
      [23][ref3], wordt de deelnemer in totaal ten hoogste vijf keer gedurende de veiling in de gelegenheid gesteld
      hieraan alsnog te voldoen binnen een door de Minister te stellen termijn.

      3 Een bod is ongeldig indien:

      a. de biedkaart niet voldoet aan de [artikelen 21, eerste lid, aanhef en onder c][ref4], [22][ref5] of [23][ref6];
      en

      b. na toepassing van het tweede lid niet tijdig is voldaan aan de daarin genoemde bepalingen.

      4 De deelnemer die een ongeldig bod, bedoeld in het derde lid, heeft gedaan, wordt hiervan door de Minister op de
      hoogte gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024730#Artikel21
