        artikel: '29'
  - number: '71.2'
    text: |-
      De [Natuurbeschermingswet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002611
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002611
  - number: 73a.1
    text: |-
      De [Wet deelneming Grevelingen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003806
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0003806
  - number: 73a.2
    text: |-
      Het Natuur- en Recreatieschap De Grevelingen ontvangt ter zake van de uittreding van het Rijk uit de
      gemeenschappelijke regeling Natuur- en Recreatiegebied De Grevelingen een vergoeding van het Rijk van 9,75
      miljoen euro, onder de voorwaarde dat de vergoeding door het Natuur- en Recreatieschap De Grevelingen of diens
      rechtsopvolger wordt besteed aan de behartiging van de belangen van natuur, landschap en openluchtrecreatie in
      De Grevelingen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel73a
  - number: 73a.3
    text: |-
      Het Natuur- en Recreatieschap De Grevelingen of diens rechtsopvolger legt aan Onze Minister van Landbouw, Natuur
      en Voedselkwaliteit verantwoording af over de besteding van de afkoopsom en overlegt daartoe jaarlijks aan Onze
      Minister van Landbouw, Natuur en Voedselkwaliteit een jaarrekening tezamen met een accountantsverklaring. De eerste
      volzin is van toepassing tot 1 januari 2030 of, als dit eerder is, tot 1 januari van het jaar volgend op het jaar
      waarin het Natuur- en Recreatieschap De Grevelingen of diens rechtsopvolger is opgehouden te bestaan.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel73a
  - number: 73a.4
    text: |-
      Ingeval niet is voldaan aan de voorwaarde, bedoeld in het tweede lid, of aan de verplichtingen, bedoeld in het
      derde lid, eerste volzin, kan Onze Minister van Landbouw, Natuur en Voedselkwaliteit de vergoeding geheel of
      gedeeltelijk terugvorderen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel73a
  - number: '74'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel74
  - number: '75'
    text: |-
      Deze wet wordt aangehaald als: Natuurbeschermingswet, met vermelding van het jaartal van het Staatsblad waarin zij
      zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel75
