  - number: '66'
    text: |-
      De eigenaar en gebruiker zijn verplicht de kentekenen die op grond van
      [artikel 15 van de Natuurbeschermingswet][ref1] in een beschermd natuurmonument zijn aangebracht na intrekking van
      die wet te gedogen.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel15
