  - number: '60.2'
    text: |-
      Besluiten die zijn genomen op grond van [artikel 16, tweede lid, onderdeel c, van de Natuurbeschermingswet][ref1],
      gelden als besluiten die zijn genomen op grond van [artikel 16][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel16
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
  - number: 60a.1
    text: |-
      Besluiten, die zijn genomen op grond van [artikel 12 van de Natuurbeschermingswet][ref1] voor projecten
      of andere handelingen als bedoeld in [artikel 19d, eerste lid][ref2], gelden terzake van een op grond
      van [artikel 10a, eerste lid][ref3], aangewezen gebied of een gebied waarvan de aanwijzing als zodanig in
      overweging is genomen als bedoeld in [artikel 12, derde lid][ref4], als besluiten die zijn genomen op grond van
      [artikel 19d][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref4]: https://wetten.overheid.nl/BWBR0009641#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
  - number: 60a.2
    text: |-
      Ten aanzien van het nemen van besluiten, waarbij artikel 6 van de [richtlijn (EEG) nr. 92/43](31992L0043) aan
      de orde is, op voor de datum van inwerkingtreding van deze wet ingediende aanvragen om vergunning of ontheffing
      en ingediende verzoeken om toestemming anderszins blijft deze wet buiten toepassing totdat de bezwaar- of
      beroepstermijn is verstreken dan wel, indien beroep is ingesteld, onherroepelijk op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel60a
  - number: 60a.3
    text: |-
      Een beheersplan, dat is vastgesteld op grond van [artikel 14 van de Natuurbeschermingswet][ref1] behoudt zijn
      gelding gedurende de periode waarvoor het plan is aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel14
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '14'
  - number: '61'
    text: |-
      Gebieden die voor de inwerkingtreding van deze wet door Onze Minister zijn aangewezen ter uitvoering van verdragen
      of andere internationale verplichtingen met betrekking tot natuur- en landschapsbehoud, gelden als aangewezen
      gebieden op grond van [artikel 27][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel27
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '27'
        hoofdstuk: V
  - number: '62.1'
    text: |-
      Besluiten, die voor de datum van inwerkingtreding van deze wet zijn genomen op grond van
      [artikel 8, eerste lid, van de Natuurbeschermingswet][ref1] worden afgehandeld overeenkomstig
      [artikel 9 van genoemde wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel9
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002611
        artikel: '9'
  - number: '62.2'
    text: |-
      Besluiten die voor de datum van inwerkingtreding van deze wet zijn genomen op grond van
      [artikel 8, tweede lid, van de Natuurbeschermingswet][ref1] gelden als besluiten die zijn genomen op grond
      van [artikel 12, eerste lid][ref2], van deze wet, met dien verstande dat zodanige besluiten worden afgehandeld
      overeenkomstig [artikel 9 van de Natuurbeschermingswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002611#Artikel9
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002611
        artikel: '9'
  - number: '62.3'
    text: |-
      Besluiten als bedoeld in [artikel 10][ref1], die met inachtneming van het eerste lid worden genomen vermelden de in
      [artikel 16, vierde lid][ref2], van deze wet bedoelde handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel16
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
  - number: '63.1'
    text: |-
      Ten aanzien van het nemen van besluiten omtrent voor de datum van inwerkingtreding van deze wet
      ingediende verzoeken om vergunning of ontheffing als bedoeld in [artikel 12][ref1] onderscheidenlijk
      [16, tweede lid, onderdeel c, van de Natuurbeschermingswet][ref2], blijft genoemde wet van toepassing totdat de
      bezwaar- of beroepstermijn is verstreken dan wel, indien beroep is ingesteld, onherroepelijk op het beroep is
      beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel16
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0002611
        artikel: '16'
  - number: '63.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op voor de datum van inwerkingtreding van deze wet ingediende
      verzoeken om vergunning voor het verrichten van handelingen in een staatsnatuurmonument als bedoeld in
      [artikel 21, eerste lid, van de Natuurbeschermingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel21
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '21'
  - number: '64'
    text: |-
      Ten aanzien van de mogelijkheid om bezwaar te maken of beroep in te stellen tegen een besluit dat voor de
      datum van inwerkingtreding van deze wet is bekendgemaakt, alsmede ten aanzien van de behandeling van bezwaar of
      beroep dat voor de datum van inwerkingtreding van deze wet is gemaakt onderscheidenlijk is ingesteld, blijft de
      [Natuurbeschermingswet][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002611
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002611
  - number: '65'
    text: |-
      Ten aanzien van beschermde natuurmonumenten en staatsnatuurmonumenten, als bedoeld in
      [artikel 7, eerste lid][ref1], respectievelijk [artikel 21, eerste lid, van de Natuurbeschermingswet][ref2],
      die voor de datum van inwerkingtreding van deze wet als zodanig zijn aangewezen op grond van de
      [Natuurbeschermingswet][ref3], geldt in afwijking van [artikel 16, vierde lid][ref4], van deze wet het verbod van
      [artikel 16, eerste lid][ref5], van deze wet voor in dat artikellid bedoelde schadelijke handelingen die buiten het
      beschermde natuurmonument of staatsnatuurmonument worden verricht zonder dat deze handelingen vermeld zijn in het
      besluit tot aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002611
      [ref4]: https://wetten.overheid.nl/BWBR0009641#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0009641#Artikel16
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel65
