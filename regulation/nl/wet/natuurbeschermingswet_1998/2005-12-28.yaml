preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen te stellen inzake de bescherming
    van natuur en landschap en dat het voorts wenselijk is een wettelijke grondslag te geven aan het verlenen van
    bijdragen ter bevordering en ondersteuning van het beleid inzake natuur en landschap alsmede aan het verlenen
    van vergoedingen terzake van het op vrijwillige basis richten of mede richten van de bedrijfsvoering van
    landbouwbedrijven, binnen daartoe aangewezen gebieden, op het beheer van natuur en landschap;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
  - number: 1.b
    text: |-
      structuurschema: structuurschema, bedoeld in [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel9
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '9'
        hoofdstuk: II
  - number: 1.c
    text: |-
      natuurmonument: terrein of water, dan wel samenstel van terreinen of wateren, dat van algemeen belang is om zijn
      natuurwetenschappelijke betekenis of zijn natuurschoon;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
  - number: 1.d
    text: |-
      eigenaar: degene, die in de kadastrale registratie als eigenaar staat vermeld, met dien verstande dat indien op een
      onroerende zaak een eeuwig durend recht van erfpacht of een recht van beklemming rust, daaronder wordt verstaan de
      erfpachter of de beklemde meier, en dat bij onroerende zaken die aan een niet eeuwig durend recht van erfpacht, een
      recht van vruchtgebruik of een recht van opstal zijn onderworpen, daaronder mede zijn begrepen degenen, die in de
      kadastrale registratie als erfpachter, vruchtgebruiker of opstalhouder staan vermeld, een en ander voorzover niet
      de rechtstoestand is gebleken een andere te zijn dan de kadastrale registratie aangeeft;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
  - number: 1.e
    text: |-
      gebruiker: degene, die uit hoofde van een andere rechtsverhouding dan onder d genoemd een onroerende zaak in
      gebruik heeft;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
  - number: 1.f
    text: |-
      landschapsgezicht: samenstel van onbebouwde terreinen of van bebouwde en onbebouwde terreinen dat vanwege zijn
      structuren, patronen of elementen danwel anderszins vanwege zijn uiterlijke verschijningsvorm, historisch-
      landschappelijk van algemeen belang is;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
  - number: 1.g
    text: |-
      [richtlijn (EEG) nr. 79/409](31979L0409): [richtlijn (EEG) nr. 79/409](31979L0409) van de Raad van de Europese
      Gemeenschappen van 2 april 1979 inzake het behoud van de vogelstand (PbEG L 103);
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
  - number: 1.h
    text: |-
      [richtlijn (EEG) nr. 92/43](31992L0043): [richtlijn (EEG) nr. 92/43](31992L0043) van de Raad van Europese
      Gemeenschappen van 21 mei 1992 inzake de instandhouding van de natuurlijke habitats en de wilde flora en fauna
      (PbEG L 206);
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
  - number: 1.i
    text: 'prioritaire soort: als prioritair aangeduide soort in bijlage II van de [richtlijn (EEG) nr. 92/43](31992L0043);'
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
  - number: 1.j
    text: |-
      prioritaire type natuurlijke habitat: als prioritair type aangeduide natuurlijke habitat in bijlage I van de
      [richtlijn (EEG) nr. 92/43](31992L0043);
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
  - number: 1.k
    text: |-
      initiatiefnemer: degene die het initiatief neemt tot een plan, project of andere handeling als bedoeld in
      [artikel 19d, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
  - number: 1.l
    text: |-
      instandhoudingsdoelstelling: doelstelling of doelstellingen als bedoeld in [artikel 10a, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
  - number: 1.m
    text: |-
      Natura 2000: Europees ecologische netwerk dat bestaat uit de speciale beschermingszones als bedoeld in de
      [richtlijn (EEG) nr. 79/409](31979L0409) en [richtlijn (EEG) nr. 92/43](31992L0043);
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
  - number: 1.n
    text: |-
      bestaande gebruik: een activiteit, die al dan niet jaarlijks vergunning behoeft, en op het moment van aanwijzing
      van een gebied als beschermd natuurmonument of ter uitvoering van [richtlijn (EEG) nr. 79/409](31979L0409) en
      [richtlijn (EEG) nr. 92/43](31992L0043) bestond en sedertdien onafgebroken heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel1
  - number: '2.1'
    text: |-
      Voorzover niet anders bepaald, wordt onder gedeputeerde staten verstaan gedeputeerde staten van de provincie waarin
      gebieden als bedoeld in [artikel 10a][ref1] of natuurmonumenten of landschapsgezichten onderscheidenlijk beschermde
      natuurmonumenten of beschermde landschapsgezichten geheel of grotendeels zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
  - number: '2.2'
    text: |-
      Gedeputeerde staten wijzen landschapsgezichten, die mede zijn gelegen in een andere provincie, niet aan als
      beschermd landschapsgezicht dan in overeenstemming met gedeputeerde staten van die andere provincies.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel2
  - number: '2.3'
    text: |-
      Gedeputeerde staten beslissen niet over een aanvraag van een vergunning als bedoeld in [artikel 16][ref1] of over
      de afgifte van een verklaring als bedoeld in [artikel 8.39b, eerste lid, van de Wet milieubeheer][ref2], dan wel
      stellen een beheersplan als bedoeld in [artikel 17][ref3] niet vast, dan in overeenstemming met gedeputeerde staten
      van de andere provincies waarin het beschermd natuurmonument mede is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel17
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
  - number: '2.4'
    text: |-
      Gedeputeerde staten stellen een beheersplan als bedoeld in [artikel 19a][ref1] niet vast dan in overeenstemming
      met gedeputeerde staten van de andere provincies waarin het op grond van [artikel 10a, eerste lid][ref2],
      aangewezen gebied of een gebied waarvan de aanwijzing als zodanig in overweging is genomen als bedoeld in
      [artikel 12, derde lid][ref3], mede is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: '2.5'
    text: |-
      Gedeputeerde staten beslissen niet op een aanvraag voor een vergunning als bedoeld in
      [artikel 19d, eerste lid][ref1], dan in overeenstemming met gedeputeerde staten van de andere provincies waarin
      het op grond van [artikel 10a, eerste lid][ref2], aangewezen gebied of een gebied waarvan de aanwijzing als zodanig
      in overweging is genomen als bedoeld in [artikel 12, derde lid][ref3], mede is gelegen voorzover die vergunning
      betrekking heeft op delen van het gebied, gelegen in die andere provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: '3'
    text: |-
      In [dit hoofdstuk][ref1] wordt verstaan onder Onze Ministers: Onze Minister tezamen met Onze Ministers van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Verkeer en Waterstaat voorzover het aangelegenheden
      betreft die tot hun verantwoordelijkheid behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009641
        hoofdstuk: II
  - number: '4'
    text: |-
      Onze Ministers stellen ten minste eenmaal in de acht jaar een natuurbeleidsplan vast, dat met het oog op een
      duurzame instandhouding, herstel en ontwikkeling van de natuurlijke en landschappelijke waarden voor de korte,
      middellange en lange termijn richting geeft aan van rijkswege te nemen beslissingen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel4
  - number: '5.1'
    text: 'Het natuurbeleidsplan bevat tenminste de hoofdlijnen van het beleid terzake van:'
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel5
  - number: 5.1.a
    text: de algemene natuur- en landschapswaarden;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel5
  - number: 5.1.b
    text: |-
      bescherming van de in het plan aangeduide gebieden en gebiedscategorieën waar sprake is van bijzondere natuur-
      en landschapswaarden;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel5
  - number: 5.1.c
    text: de in het plan aangegeven soorten dieren en planten waaraan bijzondere aandacht zal worden gegeven;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel5
  - number: 5.1.d
    text: voorlichting en onderzoek op het terrein van natuur en landschap;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel5
  - number: 5.1.e
    text: de internationale ontwikkelingen van het natuurbeleid.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel5
  - number: '5.2'
    text: 'Het natuurbeleidsplan bevat een aanduiding van:'
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel5
  - number: 5.2.a
    text: |-
      de wijze waarop en de maatregelen waarmede voor de eerstvolgende periode van acht jaar uitvoering zal worden
      gegeven aan de hoofdlijnen van het beleid;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel5
  - number: 5.2.b
    text: de redelijkerwijze te verwachten financiële en economische gevolgen van het te voeren beleid.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel5
  - number: '6.1'
    text: |-
      In het plan geven Onze Ministers voorts aan in hoeverre het voorgenomen beleid inzake natuur en
      landschap is afgestemd op, dan wel leidt tot aanpassing van het nationale milieubeleid en het nationale
      waterhuishoudingsbeleid en in hoeverre en binnen welke termijn zij voornemens zijn het nationaal milieubeleidsplan,
      bedoeld in [artikel 4.3 van de Wet milieubeheer][ref1] en de nota voor de waterhuishouding, bedoeld in
      [artikel 3, eerste lid, van de Wet op de waterhuishouding][ref2], te herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel3
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '3'
  - number: '6.2'
    text: |-
      Met het geldende natuurbeleidsplan wordt tevens rekening gehouden bij de vaststelling van rijksbeleid op andere
      terreinen van beleid dan bedoeld in het eerste lid, voorzover daarbij het belang van duurzame instandhouding,
      herstel en ontwikkeling van natuurlijke en landschappelijke waarden wordt geraakt.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel6
  - number: '7.1'
    text: |-
      Onze Ministers betrekken bij de voorbereiding van het natuurbeleidsplan de naar hun oordeel bij de te behandelen
      onderwerpen meest belanghebbende bestuursorganen, instellingen en organisaties. Daartoe behoren in elk geval
      gedeputeerde staten van de provincies.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel7
  - number: '7.2'
    text: |-
      Op de voorbereiding van het nationale natuurbeleidsplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      van toepassing. Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '8.1'
    text: |-
      Het plan geldt voor een tijdvak van acht jaar nadat het is vastgesteld, behoudens ingeval in dat tijdvak een nieuw
      plan is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel8
  - number: '8.2'
    text: |-
      Na het verstrijken van de eerste vier jaar van de geldingsduur kan naar aanleiding van een beoordeling van
      de in die periode opgedane ervaringen het plan door Onze Ministers worden aangepast met inachtneming van
      [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel7
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '7'
        hoofdstuk: II
  - number: '8.3'
    text: |-
      Onze Ministers doen het plan alsmede een eventueel besluit tot aanpassing van dat plan toekomen aan de Staten-
      Generaal en aan gedeputeerde staten van de provincies.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel8
  - number: '8.4'
    text: |-
      Onze Minister maakt de vaststelling van het plan en van aanpassingen daarvan bekend in de Staatscourant. Hierbij
      geeft hij aan op welke wijze kennis kan worden gekregen van de inhoud van het plan of de aanpassingen daarvan.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel8
  - number: '9'
    text: |-
      Er is een structuurschema dat in ieder geval inzicht geeft in de ruimtelijke aspecten van
      het rijksbeleid inzake natuur en landschap. Het structuurschema is een plan als bedoeld in
      [artikel 2a van de Wet op de Ruimtelijke Ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 2a
  - number: 9a.1
    text: |-
      Het Rijksinstituut voor volksgezondheid en milieu, hierna aan te duiden als RIVM, brengt eenmaal in de vier jaar
      aan Onze Minister een wetenschappelijk rapport uit, waarin de toestand van natuur, bos en landschap, alsmede de ten
      aanzien daarvan meest waarschijnlijke en mogelijke andere toekomstige ontwikkelingen voor een door Onze Minister
      aan te geven periode worden beschreven.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel9a
  - number: 9a.2
    text: |-
      Het RIVM brengt jaarlijks aan Onze Minister een wetenschappelijk rapport uit, waarin, mede in het licht van in
      eerdere rapporten beschreven ontwikkelingen, de stand van zaken in de beleidsuitvoering, de voortgang en nieuwe
      ontwikkelingen worden beschreven. Indien zich onvoorzien een omstandigheid voordoet die belangrijke gevolgen kan
      hebben voor de ontwikkeling van natuur, bos en landschap op langere termijn, neemt het RIVM, indien Onze Minister
      daarom verzoekt, in een rapport tevens een beschrijving op van die mogelijke ontwikkeling.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel9a
  - number: 9b.1
    text: |-
      Onze Minister wijst, tezamen met – ieder voorzover het hem aangaat – Onze Ministers van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, van Verkeer en Waterstaat en van Economische Zaken, overheidsinstellingen
      aan, die door het RIVM in ieder geval worden betrokken bij het opstellen van de in [artikel 9a][ref1] bedoelde
      rapporten.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel9a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 9a
        hoofdstuk: II
  - number: 9b.2
    text: |-
      Onze Minister kan, tezamen met – ieder voorzover het hem aangaat – Onze Ministers van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer, van Verkeer en Waterstaat en van Economische Zaken, regels stellen ten aanzien van de
      wijze waarop de krachtens het eerste lid aangewezen overheidsinstellingen bij het opstellen van de rapporten worden
      betrokken.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel9b
  - number: 9b.3
    text: |-
      Het RIVM en de op grond van het eerste lid aangewezen instellingen verschaffen elkaar desgevraagd alle inlichtingen
      en gegevens waarover zij kunnen beschikken voorzover dat voor het opstellen van de rapporten, bedoeld in
      [artikel 9a, eerste en tweede lid][ref1], redelijkerwijs noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel9a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 9a
        hoofdstuk: II
  - number: 9c.1
    text: |-
      Onze Minister kan aanwijzingen geven omtrent veronderstelde ontwikkelingen die in ieder geval als grondslag voor
      beschrijvingen als bedoeld in [artikel 9a, eerste lid][ref1], moeten worden aangenomen, alsmede omtrent onderwerpen
      die in ieder geval in een rapport als bedoeld in dat artikellid, moeten worden beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel9a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 9a
        hoofdstuk: II
  - number: 9c.2
    text: |-
      Behoudens [artikel 9a, tweede lid, en het eerste lid][ref1], geven Onze betrokken Ministers het RIVM en de
      krachtens [artikel 9b, eerste lid][ref2], aangewezen instellingen geen aanwijzingen met betrekking tot de inhoud
      van de rapporten.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel9b
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 9a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 9b
        hoofdstuk: II
  - number: 9d.1
    text: |-
      Onze Minister doet een rapport als bedoeld in [artikel 9a, eerste lid][ref1], toekomen aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel9a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 9a
        hoofdstuk: II
  - number: 9d.2
    text: |-
      Onze Minister doet een rapport als bedoeld in [artikel 9a, tweede lid][ref1], eveneens toekomen aan de Staten-
      Generaal, en wel gelijktijdig met de begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel9a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 9a
        hoofdstuk: II
  - number: 9d.3
    text: Het RIVM draagt er zorg voor dat de rapporten algemeen verkrijgbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel9d
  - number: '10.1'
    text: |-
      Onze Minister kan, mede op grondslag van het structuurschema, bij besluit een natuurmonument aanwijzen als
      beschermd natuurmonument. Het besluit gaat vergezeld van een kaart waarop het beschermd natuurmonument is
      aangegeven en een toelichting.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel10
  - number: '10.2'
    text: |-
      Indien het beheer over een natuurmonument of een gedeelte daarvan berust bij een van Onze andere Ministers, dan
      neemt Onze Minister een besluit als bedoeld in het eerste lid niet, dan in overeenstemming met die andere Minister.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel10
  - number: '10.3'
    text: |-
      Indien in andere gevallen dan bedoeld in het tweede lid, een van Onze andere Ministers op grond van enig wettelijk
      voorschrift bevoegd is besluiten te nemen met betrekking tot het natuurmonument, vindt voorafgaand aan een besluit
      als bedoeld in het eerste lid overleg plaats met die andere Minister.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel10
  - number: 10a.1
    text: |-
      Onze Minister wijst gebieden aan ter uitvoering van [richtlijn (EEG) nr. 79/409](31979L0409) en [richtlijn (EEG)
      nr. 92/43](31992L0043).
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel10a
  - number: 10a.2
    text: |-
      Een besluit als bedoeld in het eerste lid, bevat de instandhoudingsdoelstelling voor het gebied. Tot de
      instandhoudingsdoelstelling behoren in ieder geval:
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel10a
  - number: 10a.2.a
    text: |-
      de doelstellingen ten aanzien van de instandhouding van de leefgebieden, voorzover vereist ingevolge [richtlijn
      (EEG) nr. 79/409](31979L0409) of
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel10a
  - number: 10a.2.b
    text: |-
      de doelstellingen ten aanzien van de instandhouding van de natuurlijke habitats of populaties in het wild levende
      dier- en plantensoorten voorzover vereist ingevolge [richtlijn (EEG) nr. 92/43](31992L0043).
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel10a
  - number: 10a.3
    text: |-
      De instandhoudingsdoelstelling, bedoeld in het tweede lid, kan mede betrekking hebben op doelstellingen ten aanzien
      van het behoud, het herstel en de ontwikkeling van het natuurschoon of de natuurwetenschappelijke betekenis van het
      gebied, anders dan vereist ingevolge de richtlijnen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel10a
  - number: 10a.4
    text: |-
      Een besluit als bedoeld in het eerste lid, gaat vergezeld van een kaart, waarop de begrenzing van het gebied
      nauwkeurig wordt aangegeven alsmede van een toelichting.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel10a
  - number: 10a.5
    text: |-
      [Artikel 10, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
        hoofdstuk: III
  - number: '11.1'
    text: |-
      Op de voorbereiding van een besluit als bedoeld in [de artikelen 10, eerste lid][ref1] en [10a, eerste lid][ref2],
      is [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing, met dien verstande dat daaraan toepassing
      wordt gegeven door gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '11.2'
    text: Zienswijzen kunnen naar voren worden gebracht door een ieder.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel11
  - number: '11.3'
    text: |-
      Binnen vier maanden na afloop van de in [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref1]
      bedoelde termijn zenden gedeputeerde staten de naar voren gebrachte zienswijzen, vergezeld van hun beschouwingen,
      aan Onze Minister. Op verzoek van gedeputeerde staten kan Onze Minister de in de eerste volzin bedoelde termijn met
      acht weken verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '12.1'
    text: |-
      In geval van dringende noodzaak kan Onze Minister bij besluit een natuurmonument ten aanzien waarvan overeenkomstig
      [artikel 11][ref1] een besluit tot aanwijzing als beschermd natuurmonument wordt voorbereid reeds voorlopig als
      zodanig aanwijzen voordat de procedure, bedoeld in de [artikelen 11][ref2] en [13][ref3] is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel13
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '11'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '11'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '13'
        hoofdstuk: III
  - number: '12.2'
    text: |-
      Een besluit tot voorlopige aanwijzing vervalt zodra met inachtneming van de [artikelen 11][ref1] en [13][ref2] een
      definitief besluit over aanwijzing als beschermd natuurmonument is genomen, doch in ieder geval een jaar nadat het
      ontwerp-besluit overeenkomstig [artikel 11][ref3] ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel11
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '11'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '11'
        hoofdstuk: III
  - number: '12.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op gebieden als bedoeld in
      [artikel 10a, eerste lid][ref1], met dien verstande dat in het tweede lid de zinsnede beginnend met «doch in ieder
      geval» en eindigend met «ter inzage is gelegd» niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
  - number: '13'
    text: |-
      Binnen een jaar nadat het ontwerp-besluit tot aanwijzing als beschermd natuurmonument overeenkomstig
      [artikel 11][ref1] ter inzage is gelegd, beslist Onze Minister over de aanwijzing als beschermd natuurmonument,
      doch niet alvorens hij de beschouwingen, bedoeld in [artikel 11, tweede lid][ref2], heeft ontvangen dan wel de
      krachtens dat artikellid geldende termijnen zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel11
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '11'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '11'
        hoofdstuk: III
  - number: '14.1'
    text: |-
      Van een besluit tot voorlopige aanwijzing als bedoeld in [artikel 12][ref1] wordt mededeling gedaan aan de
      eigenaren en hypothecaire schuldeisers.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: '14.2'
    text: |-
      Onze Minister maakt een besluit tot voorlopige aanwijzing als bedoeld in [artikel 12][ref1], bekend in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: '14.3'
    text: |-
      Indien Onze Minister niet tot aanwijzing als beschermd natuurmonument overgaat, maakt hij dit bekend
      en doet daarvan mededeling overeenkomstig het eerste en tweede lid en de [artikelen 3:42][ref1] en
      [3:43 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '14.4'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op besluiten als bedoeld in
      [artikel 10a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
  - number: '15.1'
    text: |-
      Onze Minister kan bij besluit een aanwijzing als beschermd natuurmonument geheel of gedeeltelijk intrekken of
      wijzigen. Het besluit gaat vergezeld van een toelichting alsmede in geval van gedeeltelijke intrekking of wijziging
      van een kaart waarop het gedeelte van het natuurmonument, waarop de intrekking of de wijziging betrekking heeft,
      is aangegeven.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel15
  - number: '15.2'
    text: |-
      [Artikel 10, tweede en derde lid][ref1], en de [artikelen 11 tot en met 14][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel11
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '11'
        hoofdstuk: III
  - number: '15.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op besluiten als bedoeld in
      [artikel 10a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
  - number: 15a.1
    text: |-
      Een gebied dat is aangewezen als gebied als bedoeld in [artikel 10a, eerste lid][ref1], dan wel een gebied waarvan
      de aanwijzing als zodanig in overweging is genomen als bedoeld in [artikel 12, derde lid][ref2], kan niet worden
      aangewezen als beschermd natuurmonument als bedoeld in [artikel 10, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel10
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '10'
        hoofdstuk: III
  - number: 15a.2
    text: |-
      Een besluit houdende de aanwijzing van een natuurmonument als beschermd natuurmonument als bedoeld in
      [artikel 10, eerste lid][ref1], vervalt met ingang van het tijdstip waarop doch slechts voorzover dat beschermd
      natuurmonument deel uitmaakt van een aangewezen gebied als bedoeld in [artikel 10a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
  - number: 15a.3
    text: |-
      Indien met toepassing van het tweede lid een besluit houdende de aanwijzing van een natuurmonument als beschermd
      natuurmonument geheel of gedeeltelijk is vervallen, heeft de instandhoudingsdoelstelling voor het op grond van
      [artikel 10a, eerste lid][ref1], aangewezen gebied mede betrekking op de doelstellingen ten aanzien van het behoud,
      herstel en de ontwikkeling van het natuurschoon of de natuurwetenschappelijke betekenis van het gebied zoals
      bepaald in het vervallen besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
  - number: '16.1'
    text: |-
      Het is verboden zonder vergunning van gedeputeerde staten of, ten aanzien van handelingen als bedoeld in het
      zesde lid, van Onze Minister, in een beschermd natuurmonument handelingen te verrichten, te doen verrichten
      of te gedogen, die schadelijk kunnen zijn voor het natuurschoon, voor de natuurwetenschappelijke betekenis van
      het beschermd natuurmonument of voor dieren of planten in het beschermd natuurmonument of die het beschermd
      natuurmonument ontsieren, dan wel in strijd met de bij een vergunning gestelde voorschriften of beperkingen
      handelingen te verrichten, te doen verrichten of te gedogen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel16
  - number: '16.2'
    text: |-
      Als schadelijke handelingen worden in elk geval aangemerkt handelingen die de in het besluit tot aanwijzing als
      beschermd natuurmonument vermelde wezenlijke kenmerken van het beschermde natuurmonument aantasten.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel16
  - number: '16.3'
    text: |-
      Voorzover een vergunning als bedoeld in het eerste lid betrekking heeft op het verrichten, doen verrichten of
      gedogen van handelingen die significante gevolgen kunnen hebben voor het natuurschoon, de natuurwetenschappelijke
      betekenis of voor dieren of planten in een beschermd natuurmonument, wordt deze slechts verleend indien met
      zekerheid vaststaat dat die handelingen de natuurlijke kenmerken van het beschermde natuurmonument niet aantasten,
      tenzij dwingende redenen van groot openbaar belang tot het verlenen van een vergunning noodzaken.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel16
  - number: '16.4'
    text: |-
      Het in het eerste lid bedoelde verbod is tevens van toepassing op handelingen als bedoeld in dat lid, die
      buiten het beschermd natuurmonument kunnen worden verricht en die zijn vermeld in het besluit tot aanwijzing als
      beschermd natuurmonument, bedoeld in [artikel 10][ref1], of een besluit tot voorlopige aanwijzing, bedoeld in
      [artikel 12][ref2]. Bij de vermelding van handelingen kunnen beperkingen worden gesteld en uitzonderingen worden
      opgenomen met betrekking tot het tijdvak waarin, de omstandigheden waaronder, de doeleinden waarvoor en met
      betrekking tot de personen door wie zij worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: '16.5'
    text: |-
      Dit artikel is niet van toepassing op handelingen die worden verricht overeenkomstig een beheersplan als bedoeld
      in [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel17
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
  - number: '16.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen terzake van bij die maatregel genoemde beschermde natuurmonumenten
      handelingen worden aangewezen waarvoor een vergunning als bedoeld in het eerste lid wordt verleend door Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel16
  - number: '16.7'
    text: |-
      Een krachtens het zesde lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel16
  - number: '17.1'
    text: |-
      Gedeputeerde staten kunnen in overeenstemming met de eigenaar en de gebruiker voor een beschermd natuurmonument
      of een gedeelte daarvan een beheersplan vaststellen, dat het behoud, het herstel of de ontwikkeling van het
      natuurschoon of van de natuurwetenschappelijke betekenis van het natuurmonument ten doel heeft.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel17
  - number: '17.2'
    text: |-
      Voorzover de kosten en lasten die voor de eigenaar en de gebruiker aan de uitvoering van het beheersplan zijn
      verbonden redelijkerwijze niet of niet geheel te hunnen laste behoren te komen, wordt in het beheersplan een door
      gedeputeerde staten te betalen subsidie vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel17
  - number: '17.3'
    text: |-
      Gedeputeerde staten brengen het plan ter kennis van Onze Minister en van burgemeester en wethouders van de
      gemeenten waarin het beschermd natuurmonument of het gedeelte daarvan waarop het beheersplan betrekking heeft,
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel17
  - number: '17.4'
    text: |-
      De eigenaar en de gebruiker zijn verplicht zorg te dragen voor de naleving van het beheersplan, ieder voorzover dat
      uit de aard van zijn recht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel17
  - number: '18.1'
    text: |-
      Het beheersplan, bedoeld in [artikel 17][ref1], wordt vastgesteld voor een tijdvak van ten hoogste zes jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel17
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
  - number: '18.2'
    text: |-
      Het beheersplan wordt van rechtswege verlengd met een tijdvak gelijk aan het laatst verstreken tijdvak waarvoor het
      beheersplan werd vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel18
  - number: '18.3'
    text: |-
      Verlenging vindt niet van rechtswege plaats wanneer gedeputeerde staten, de eigenaar of de gebruiker uiterlijk vier
      weken voor het einde van het geldend beheersplan schriftelijk te kennen heeft gegeven dat verlenging niet wordt
      verlangd.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel18
  - number: '18.4'
    text: 'Gedeputeerde staten kunnen de kennisgeving slechts doen indien:'
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel18
  - number: 18.4.a
    text: |-
      de eigenaar of de gebruiker de uit het beheersplan voortvloeiende verplichtingen in het afgelopen tijdvak niet of
      niet op de juiste wijze is nagekomen;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel18
  - number: 18.4.b
    text: |-
      ongewijzigde verlenging van het beheersplan zou leiden tot een beheer dat naar hun oordeel het behoud, het
      herstel of de ontwikkeling van het natuurschoon of van de natuurwetenschappelijke betekenis van het natuurmonument
      onvoldoende waarborgt;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel18
  - number: 18.4.c
    text: een andere zwaarwichtige reden bestaat om niet tot verlenging van het beheersplan over te gaan.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel18
  - number: '19.1'
    text: Gedeputeerde staten kunnen een vastgesteld beheersplan in overeenstemming met de eigenaar en de gebruiker wijzigen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19
  - number: '19.2'
    text: |-
      [Artikel 17, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel17
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
  - number: 19a.1
    text: |-
      Gedeputeerde staten stellen na overleg met de eigenaar, gebruiker en andere belanghebbenden, voor het op grond van
      [artikel 10a, eerste lid][ref1], aangewezen gebied of een gebied waarvan de aanwijzing als zodanig in overweging
      is genomen als bedoeld in [artikel 12, derde lid][ref2], een beheersplan vast waarin met inachtneming van de
      instandhoudingsdoelstelling wordt beschreven welke instandhoudingsmaatregelen getroffen dienen te worden en op
      welke wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: 19a.2
    text: |-
      Een beheersplan als bedoeld in het eerste lid wordt vastgesteld voor een tijdvak van ten hoogste zes jaren. Een
      beheersplan kan telkenmale voor een gelijk tijdvak worden verlengd.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19a
  - number: 19a.3
    text: 'Tot de inhoud van een beheersplan behoren ten minste:'
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19a
  - number: 19a.3.a
    text: |-
      een beschrijving van de beoogde resultaten met het oog op het behoud of herstel van natuurlijke habitats en
      populaties van wilde dier- en plantensoorten in een gunstige staat van instandhouding in het aangewezen gebied mede
      in samenhang met het bestaande gebruik in dat gebied;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19a
  - number: 19a.3.b
    text: |-
      een overzicht op hoofdlijnen van de in de door het plan bestreken periode noodzakelijke maatregelen met het oog op
      de onder a bedoelde resultaten.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19a
  - number: 19a.4
    text: |-
      Op de voorbereiding van een beheersplan als bedoeld in het eerste lid is de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 19a.5
    text: |-
      Beheersplannen worden niet vastgesteld dan na overleg met de besturen van gemeenten en waterschappen op het
      grondgebied waarvan die beheersplannen betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19a
  - number: 19a.6
    text: |-
      Een beheersplan als bedoeld in het eerste lid wordt uiterlijk drie jaar na dagtekening van het in
      [artikel 10a, eerste lid][ref1], genoemde besluit voor het eerst vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
  - number: 19b.1
    text: |-
      In afwijking van het bepaalde in [artikel 19a][ref1] wordt een beheersplan, als bedoeld in dat artikel, voor
      een op grond van [artikel 10a, eerste lid][ref2], aangewezen gebied of een gebied waarvan de aanwijzing als
      zodanig in overweging is genomen als bedoeld in [artikel 12, derde lid][ref3], dat geheel of ten dele wordt
      beheerd door of onder verantwoordelijkheid valt van Onze Minister of één van Onze andere Ministers, voor het
      geheel onderscheidenlijk het betreffende gedeelte vastgesteld door Onze Minister of door Onze andere Minister in
      overeenstemming met Onze Minister, en voor zover nodig na overleg met betrokken eigenaren, gebruikers en andere
      belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: 19b.2
    text: |-
      Een beheersplan als bedoeld in het eerste lid kan in voorkomende gevallen deel uit maken van een plan gericht
      op het beheer van een gebied als bedoeld in het eerste lid, dat al dan niet op grond van enig ander wettelijk
      voorschrift is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19b
  - number: 19b.3
    text: |-
      Beheersplannen worden niet vastgesteld dan na overleg met de besturen van provincies, gemeenten en waterschappen op
      het grondgebied waarvan die beheersplannen betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19b
  - number: 19b.4
    text: |-
      [Artikel 19a, tweede, derde, vierde en zesde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
  - number: 19c
    text: Vervallen
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19c
  - number: 19d.1
    text: |-
      Het is verboden zonder vergunning, of in strijd met aan die vergunning verbonden voorschriften of beperkingen,
      van gedeputeerde staten of, ten aanzien van projecten of andere handelingen als bedoeld in het derde lid, van
      Onze Minister, projecten of andere handelingen te realiseren onderscheidenlijk te verrichten die gelet op de
      instandhoudingsdoelstelling de kwaliteit van de natuurlijke habitats en de habitats van soorten in een op grond van
      [artikel 10a, eerste lid][ref1], aangewezen gebied of een gebied waarvan de aanwijzing als zodanig in overweging is
      genomen als bedoeld in [artikel 12, derde lid][ref2], kunnen verslechteren of een verstorend effect kunnen hebben
      op de soorten waarvoor het gebied is aangewezen. Zodanige projecten of andere handelingen zijn in ieder geval
      projecten of handelingen die de natuurlijke kenmerken van het desbetreffende gebied kunnen aantasten.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: 19d.2
    text: |-
      Het verbod bedoeld in het eerste lid, is niet van toepassing op het realiseren van projecten of het verrichten van
      andere handelingen overeenkomstig een beheersplan als bedoeld in de [artikelen 19a][ref1] of [19b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19b
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19d
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19b
        hoofdstuk: III
        paragraaf: '2'
  - number: 19d.3
    text: |-
      Bij algemene maatregel van bestuur kunnen projecten of andere handelingen of categorieën van gebieden worden
      aangewezen waarvoor een vergunning als bedoeld in het eerste lid wordt verleend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19d
  - number: 19d.4
    text: |-
      De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19d
  - number: 19e
    text: |-
      Gedeputeerde staten houden bij het verlenen van een vergunning als bedoeld in [artikel 19d, eerste lid][ref1],
      rekening


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19e
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
  - number: 19e.a
    text: |-
      met de gevolgen die een project of andere handeling, waarop de vergunningaanvraag betrekking heeft, gelet op de
      instandhoudingsdoelstelling kan hebben voor een op grond van [artikel 10a, eerste lid][ref1], aangewezen gebied of
      het gebied waarvan de aanwijzing als zodanig in overweging is genomen als bedoeld in [artikel 12, derde lid][ref2],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19e
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: 19e.b
    text: |-
      met een op grond van [artikel 19a][ref1] of [artikel 19b][ref2] vastgesteld beheersplan.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19b
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19e
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19b
        hoofdstuk: III
        paragraaf: '2'
  - number: 19f.1
    text: |-
      Voor nieuwe projecten of andere handelingen waarover gedeputeerde staten een besluit op een aanvraag voor een
      vergunning als bedoeld in [artikel 19d, eerste lid][ref1], nemen, en die niet direct verband houden met of nodig
      zijn voor het beheer van een op grond van [artikel 10a, eerste lid][ref2], of het gebied waarvan de aanwijzing
      als zodanig in overweging is genomen als bedoeld in [artikel 12, derde lid][ref3], maar die afzonderlijk of in
      combinatie met andere projecten of handelingen significante gevolgen kunnen hebben voor het desbetreffende gebied,
      maakt de initiatiefnemer alvorens gedeputeerde staten een besluit nemen, een passende beoordeling van de gevolgen
      voor het gebied waarbij rekening wordt gehouden met de instandhoudingsdoelstelling van dat gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19f
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: 19f.2
    text: |-
      De passende beoordeling terzake van een besluit op een aanvraag voor een vergunning als bedoeld in
      [artikel 19d, eerste lid][ref1], kan onderdeel uitmaken van een voor dat project of die handeling voorgeschreven
      milieu-effectrapportage.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19f
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
  - number: 19f.3
    text: |-
      De verplichting tot het maken van een passende beoordeling bij de voorbereiding van een besluit als bedoeld in het
      eerste lid, geldt niet in gevallen waarin degene die een project of een handeling waarop dat besluit betrekking
      heeft, onderneemt, daarmee een project of handeling ten aanzien waarvan reeds eerder een passende beoordeling is
      gemaakt, herhaalt of voortzet, voorzover de passende beoordeling redelijkerwijs geen nieuwe gegevens en inzichten
      kan opleveren omtrent de significante gevolgen van dat project of die handeling.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19f
  - number: 19g.1
    text: |-
      Een vergunning als bedoeld in [artikel 19d, eerste lid][ref1], kan slechts worden verleend indien gedeputeerde
      staten uit de passende beoordeling, bedoeld in [artikel 19f, eerste lid][ref2], zich ervan hebben verzekerd dat de
      natuurlijke kenmerken van het desbetreffende gebied niet zullen worden aangetast.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19f
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19g
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19f
        hoofdstuk: III
        paragraaf: '2'
  - number: 19g.2
    text: |-
      In afwijking van het eerste lid kunnen bij ontstentenis van alternatieve oplossingen voor een project of
      handeling gedeputeerde staten ten aanzien van aangewezen gebieden, bedoeld in [artikel 10a, eerste lid][ref1], en
      gebieden waarvan de aanwijzing als zodanig in overweging is genomen als bedoeld in [artikel 12, derde lid][ref2],
      waar geen prioritair type natuurlijke habitat of prioritaire soort voorkomt, een vergunning als bedoeld
      in [artikel 19d, eerste lid][ref3], voor het realiseren of verrichten van het desbetreffende project of de
      desbetreffende handeling, slechts verlenen om dwingende redenen van groot openbaar belang met inbegrip van redenen
      van sociale of economische aard.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19g
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
  - number: 19g.3
    text: |-
      Ten aanzien van aangewezen gebieden, bedoeld in [artikel 10a, eerste lid][ref1], en gebieden waarvan de aanwijzing
      als zodanig in overweging is genomen als bedoeld in [artikel 12, derde lid][ref2], waar een prioritair type
      natuurlijke habitat of een prioritaire soort voorkomt, kunnen gedeputeerde staten bij ontstentenis van alternatieve
      oplossingen voor een project of andere handeling, in afwijking van het eerste lid, een vergunning als bedoeld
      in [artikel 19d, eerste lid][ref3], voor het realiseren of verrichten van het desbetreffende project of de
      desbetreffende handeling, slechts verlenen:


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19g
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
  - number: 19g.3.a
    text: |-
      op argumenten die verband houden met de menselijke gezondheid, de openbare veiligheid of voor het milieu wezenlijke
      gunstige effecten of
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19g
  - number: 19g.3.b
    text: na advies van de Commissie van de Europese Gemeenschappen om andere dwingende redenen van groot openbaar belang.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19g
  - number: 19g.4
    text: Een advies als bedoeld in het derde lid, onderdeel b, wordt door Onze Minister gevraagd.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19g
  - number: 19h.1
    text: |-
      Indien een vergunning als bedoeld in [artikel 19d, eerste lid][ref1], om dwingende redenen van groot
      openbaar belang wordt verleend voor het realiseren of verrichten van projecten of handelingen, waarvan
      niet met zekerheid vaststaat dat die projecten of handelingen de natuurlijke kenmerken van het op grond van
      [artikel 10a, eerste lid][ref2], aangewezen gebied of een gebied waarvan de aanwijzing als zodanig in overweging
      is genomen als bedoeld in [artikel 12, derde lid][ref3], niet aantasten, verbinden gedeputeerde staten aan die
      vergunning in ieder geval het voorschrift inhoudende de verplichting compenserende maatregelen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: 19h.2
    text: |-
      De initiatiefnemer wordt door gedeputeerde staten tijdig tevoren in de gelegenheid gesteld om voorstellen voor
      compenserende maatregelen te doen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19h
  - number: 19h.3
    text: |-
      In de voorstellen voor compenserende maatregelen, bedoeld in het tweede lid, wordt in ieder geval opgenomen op
      welke wijze en in welk tijdsbestek de compenserende maatregelen zullen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19h
  - number: 19h.4
    text: |-
      Voor zover compenserende maatregelen worden voorgeschreven met het oog op de doelstellingen als bedoeld in
      [artikel 10a, tweede lid, onderdeel a of onderdeel b][ref1], dient het met deze maatregelen beoogde resultaat
      als bedoeld in het tweede lid, te zijn bereikt op het tijdstip waarop significante gevolgen als bedoeld in
      [artikel 19f, eerste lid][ref2], zich voordoen, tenzij kan worden aangetoond dat deze gelijktijdigheid niet
      noodzakelijk is om de bijdrage van het betrokken gebied aan Natura 2000 veilig te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19f
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19f
        hoofdstuk: III
        paragraaf: '2'
  - number: 19h.5
    text: |-
      Bij ministeriële regeling kan Onze Minister in overeenstemming met Onze andere Ministers, wie het mede aangaat
      nadere eisen stellen ten aanzien van compenserende maatregelen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19h
  - number: 19i
    text: |-
      In de gevallen waarin Onze Minister bevoegd is te besluiten op een aanvraag voor een vergunning als bedoeld
      in [artikel 19d, eerste lid][ref1], zijn de [artikelen 19e][ref2], [19f][ref3], [19g][ref4] en [19h][ref5] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19e
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19f
      [ref4]: https://wetten.overheid.nl/BWBR0009641#Artikel19g
      [ref5]: https://wetten.overheid.nl/BWBR0009641#Artikel19h
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19i
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19e
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009641
        artikel: 19f
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009641
        artikel: 19g
        hoofdstuk: III
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0009641
        artikel: 19h
        hoofdstuk: III
        paragraaf: '2'
  - number: 19j.1
    text: |-
      Een besluit tot het vaststellen van een plan, dat gelet op de instandhoudingsdoelstelling voor een op grond van
      [artikel 10a, eerste lid][ref1], aangewezen gebied of een gebied waarvan de aanwijzing als zodanig in overweging is
      genomen als bedoeld in [artikel 12, derde lid][ref2], de kwaliteit van de natuurlijke habitats en de habitats van
      soorten in het aangewezen gebied kunnen verslechteren of een verstorend effect kunnen hebben op de soorten waarvoor
      het gebied is aangewezen, behoeft de goedkeuring van Onze Minister. Voor zover dat plan door één van Onze andere
      Ministers wordt voorbereid geschiedt de vaststelling van dat plan in overeenstemming met Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19j
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: 19j.2
    text: |-
      In afwijking van het eerste lid worden besluiten tot het vaststellen van plannen als bedoeld in het eerste lid, van
      bestuursorganen van gemeenten en waterschappen goedgekeurd door gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19j
  - number: 19j.3
    text: |-
      Bij het nemen van een besluit tot het vaststellen van een plan als bedoeld in het eerste lid, zijn, ongeacht
      de beperkingen in het wettelijke voorschrift waarop dat besluit berust, de [artikelen 19e][ref1], [19f][ref2],
      [19g][ref3] en [19h][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19e
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19f
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19g
      [ref4]: https://wetten.overheid.nl/BWBR0009641#Artikel19h
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19j
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19e
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19f
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009641
        artikel: 19g
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009641
        artikel: 19h
        hoofdstuk: III
        paragraaf: '2'
  - number: 19j.4
    text: |-
      In afwijking van het eerste lid behoeven plannen als bedoeld in [artikel 19a][ref1] geen goedkeuring van Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19j
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
  - number: 19k.1
    text: |-
      Gedeputeerde staten stellen Onze Minister in kennis van projecten en andere handelingen als bedoeld in
      [artikel 19f, eerste lid][ref1], en van plannen als bedoeld in [artikel 19j, tweede lid][ref2], en zenden een
      afschrift van vergunningen als bedoeld in [artikel 19d, eerste lid][ref3], en besluiten tot goedkeuring als bedoeld
      in [artikel 19j, tweede lid][ref4], die met toepassing van [artikel 19g][ref5] zijn genomen naar Onze Minister en
      brengen Onze Minister op de hoogte van de genomen compenserende maatregelen als bedoeld in [artikel 19h][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19f
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19j
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref4]: https://wetten.overheid.nl/BWBR0009641#Artikel19j
      [ref5]: https://wetten.overheid.nl/BWBR0009641#Artikel19g
      [ref6]: https://wetten.overheid.nl/BWBR0009641#Artikel19h
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19k
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19f
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19j
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009641
        artikel: 19j
        hoofdstuk: III
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0009641
        artikel: 19g
        hoofdstuk: III
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0009641
        artikel: 19h
        hoofdstuk: III
        paragraaf: '2'
  - number: 19k.2
    text: |-
      Door Onze Minister wordt de Commissie van de Europese Gemeenschappen op de hoogte gesteld van de genomen
      compenserende maatregelen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19k
  - number: 19ka.1
    text: |-
      Indien voor het realiseren of verrichten van een project of andere handeling naast de vergunning als bedoeld
      in [artikel 19d, eerste lid][ref1], andere besluiten vereist zijn, bevordert het bestuursorgaan waarbij de
      initiatiefnemer met betrekking tot dat project of die handeling een aanvraag heeft ingediend dat hij in kennis
      wordt gesteld van die andere besluiten, waarvan het bestuursorgaan redelijkerwijs kan aannemen dat deze nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19ka
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
  - number: 19ka.2
    text: |-
      De initiatiefnemer kan bij één van de betrokken bestuursorganen schriftelijk om coördinatie van besluitvorming
      verzoeken.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19ka
  - number: 19ka.3
    text: |-
      Tot coördinatie van besluitvorming kan ook ambtshalve door de betrokken bestuursorganen in onderling overleg worden
      besloten. De initiatiefnemer wordt hiervan in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19ka
  - number: 19ka.4
    text: |-
      Indien een verzoek als bedoeld in het tweede lid is ingediend of indien ambtshalve tot coördinatie is besloten,
      wijzen de betrokken bestuursorganen uit hun midden een coördinerend bestuursorgaan aan. Indien, nadat er een
      verzoek is gedaan als bedoeld in het tweede lid, geen coördinerend bestuursorgaan is aangewezen wordt als zodanig
      aangemerkt het bestuursorgaan dat als hogere gezag kan worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19ka
  - number: 19ka.5
    text: |-
      Het coördinerend bestuursorgaan bevordert een doelmatige en samenhangende besluitvorming. De andere betrokken
      bestuursorganen verlenen medewerking die voor het welslagen van een doelmatige en samenhangende besluitvorming
      nodig is.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19ka
  - number: 19l.1
    text: |-
      Een ieder neemt voldoende zorg in acht voor de instandhouding van een gebied aangewezen op grond van
      [artikel 10, eerste lid][ref1], [artikel 10a, eerste lid][ref2] of waarvan de aanwijzing als zodanig in overweging
      is genomen als bedoeld in [artikel 12][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19l
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: 19l.2
    text: |-
      De zorg, bedoeld in het eerste lid, houdt in ieder geval in dat een ieder die weet of redelijkerwijs kan vermoeden
      dat door zijn handelen of nalaten, gelet op de instandhoudingsdoelstelling, voor zover het een gebied betreft,
      aangewezen op grond van [artikel 10a, eerste lid][ref1], dan wel gelet op de wezenlijke kenmerken van een gebied,
      aangewezen op grond van [artikel 10, eerste lid][ref2], nadelige gevolgen voor het gebied, bedoeld in het eerste
      lid, kunnen worden veroorzaakt, verplicht is dergelijke handelingen achterwege te laten, dan wel, indien dat
      achterwege laten redelijkerwijs niet kan worden gevergd, alle maatregelen te nemen die redelijkerwijs van hem
      kunnen worden gevergd teneinde die gevolgen te voorkomen of, voorzover die gevolgen niet kunnen worden voorkomen,
      deze zoveel mogelijk te beperken of ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel19l
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '10'
        hoofdstuk: III
  - number: '20.1'
    text: |-
      Gedeputeerde staten kunnen de toegang tot een beschermd natuurmonument als bedoeld in
      [artikel 10, eerste lid][ref1], een aangewezen gebied als bedoeld in [artikel 10a, eerste lid][ref2], of een gebied
      waarvan de aanwijzing als zodanig in overweging is genomen als bedoeld in [artikel 12][ref3] of delen van bedoelde
      gebieden, voorzover dit noodzakelijk is voor de bescherming van natuurwaarden, beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: '20.2'
    text: |-
      Indien een gebied als bedoeld in het eerste lid geheel of ten dele wordt beheerd door of onder verantwoordelijkheid
      van Onze Minister of een van Onze andere Ministers, wordt de in het eerste lid bedoelde bevoegdheid uitgeoefend
      door Onze Minister in overeenstemming met Onze andere Minister.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel20
  - number: '20.3'
    text: |-
      Het is verboden in strijd met de beperkingen die ingevolge het eerste en tweede lid zijn opgelegd, zich te bevinden
      in een beschermd natuurmonument als bedoeld in [artikel 10, eerste lid][ref1], een aangewezen gebied als bedoeld
      in [artikel 10a, eerste lid][ref2], of een gebied waarvan de aanwijzing als zodanig in overweging is genomen als
      bedoeld in [artikel 12][ref3] of gedeelten daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: '20.4'
    text: |-
      Het verbod in het derde lid geldt niet voor de eigenaar en de gebruiker van een beschermd natuurmonument als
      bedoeld in [artikel 10, eerste lid][ref1], een aangewezen gebied als bedoeld in [artikel 10a, eerste lid][ref2],
      of een gebied waarvan de aanwijzing als zodanig in overweging is genomen als bedoeld gebruiksrecht zich daarover
      uitstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
  - number: '21.1'
    text: |-
      Indien ten gevolge van het achterwege blijven van maatregelen het natuurschoon of de natuurwetenschappelijke
      betekenis van het beschermd natuurmonument in ernstige mate vermindert of dreigt te verminderen, kunnen vanwege
      gedeputeerde staten in het beschermd natuurmonument maatregelen worden getroffen die noodzakelijk zijn om het
      natuurschoon of de natuurwetenschappelijke betekenis te herstellen of te behouden.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel21
  - number: '21.2'
    text: De eigenaar en de gebruiker zijn verplicht het treffen van de maatregelen te gedogen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel21
  - number: '21.3'
    text: |-
      Gedeputeerde staten gaan niet over tot het treffen van de maatregelen dan nadat zij de eigenaar en gebruiker het
      voornemen daartoe schriftelijk hebben medegedeeld en, behoudens onverwijlde noodzaak, na de mededeling ten minste
      vier weken zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel21
  - number: '21.4'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op een aangewezen gebied als bedoeld in
      [artikel 10a, eerste lid][ref1], en een gebied waarvan de aanwijzing als zodanig in overweging is genomen als
      bedoeld in [artikel 12, derde lid][ref2], met dien verstande dat de noodzakelijke maatregelen worden getroffen,
      indien gelet op de instandhoudingsdoelstelling de kwaliteit van de natuurlijke habitats en de habitats van soorten
      in het aangewezen gebied verslechtert of indien er verstorende factoren optreden die een significant effect
      hebben op de soorten waarvoor het gebied is aangewezen. In het geval het gebied wordt beheerd door of onder
      verantwoordelijkheid van Onze Minister of een van Onze andere Ministers, worden zodanige maatregelen getroffen door
      Onze Minister onderscheidenlijk Onze andere Minister in overeenstemming met Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: '22.1'
    text: |-
      Na overleg met de eigenaren en de gebruikers kunnen in een beschermd natuurmonument vanwege gedeputeerde staten de
      nodige kentekenen worden aangebracht om de aanwijzing als beschermd natuurmonument alsmede de rechtsgevolgen van de
      aanwijzing kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel22
  - number: '22.2'
    text: De eigenaar en gebruiker zijn verplicht het aanbrengen van de kentekenen te gedogen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel22
  - number: '22.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op een aangewezen gebied als bedoeld in
      [artikel 10a, eerste lid][ref1], en een gebied waarvan de aanwijzing als zodanig in overweging is genomen als
      bedoeld in [artikel 12, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '12'
        hoofdstuk: III
  - number: '23.1'
    text: Gedeputeerde staten kunnen een landschapsgezicht bij besluit aanwijzen als beschermd landschapsgezicht.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel23
  - number: '23.2'
    text: |-
      Indien het betreffende gebied reeds is aangewezen als beschermd natuurmonument, houden gedeputeerde staten bij hun
      besluit rekening met die aanwijzing.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel23
  - number: '23.3'
    text: |-
      Gedeputeerde staten kunnen bij besluit een aanwijzing als beschermd landschapsgezicht geheel of gedeeltelijk
      wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel23
  - number: '23.4'
    text: |-
      Op een besluit als bedoeld in het derde lid zijn het tweede lid en de [artikelen 24 tot en met 26][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel24
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '24'
        hoofdstuk: IV
  - number: '24.1'
    text: |-
      Het besluit, bedoeld in [artikel 23][ref1], bevat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel23
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '23'
        hoofdstuk: IV
  - number: 24.1.a
    text: een beschrijving van de kenmerken van het landschapsgezicht voorzover deze kenmerken uiterlijk waarneembaar zijn;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel24
  - number: 24.1.b
    text: een aanduiding van handelingen die de kenmerken, bedoeld in onderdeel a, kunnen aantasten.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel24
  - number: '24.2'
    text: |-
      Het besluit gaat vergezeld van een kaart waarop de begrenzing van het gebied dat als beschermd landschapsgezicht is
      aangewezen, is aangegeven.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel24
  - number: '25.1'
    text: |-
      Alvorens tot een aanwijzing als beschermd landschapsgezicht over te gaan, zenden gedeputeerde staten het ontwerp-
      besluit aan de gemeenteraad van de gemeenten waarin het landschapsgezicht is gelegen alsmede aan de provinciale
      planologische commissie. De gemeenteraad brengt binnen zes maanden en de provinciale planologische commissie brengt
      binnen negen maanden na ontvangst van het ontwerp-besluit advies uit.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel25
  - number: '25.2'
    text: |-
      Binnen een jaar na toezending van het ontwerp-besluit, bedoeld in het eerste lid, beslissen gedeputeerde staten
      over aanwijzing van het landschapsgezicht als beschermd landschapsgezicht, doch niet alvorens zij de adviezen
      bedoeld in het eerste lid, hebben ontvangen dan wel de krachtens dat artikellid geldende termijnen zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel25
  - number: '25.3'
    text: |-
      Gedeputeerde staten maken een besluit over aanwijzing van een landschapsgezicht als beschermd landschapsgezicht
      bekend in de Staatscourant en in één of meer in het betrokken gebied verspreide dag-, nieuws- of huis-aan-
      huisbladen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel25
  - number: '25.4'
    text: |-
      Gedeputeerde staten zenden afschrift van een besluit over aanwijzing van een landschapsgezicht als beschermd
      landschapsgezicht aan Onze Minister en de gemeenteraad van de gemeenten waarin het beschermd landschapsgezicht
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel25
  - number: '26.1'
    text: |-
      De gemeenteraad van de gemeenten waarin het beschermd landschapsgezicht is gelegen, stelt ter bescherming van een
      beschermd landschapsgezicht een bestemmingsplan vast als bedoeld in de [Wet op de Ruimtelijke Ordening][ref1]. Bij
      het besluit tot aanwijzing van een beschermd landschapsgezicht kan hiertoe door gedeputeerde staten een termijn
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002375
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002375
  - number: '26.2'
    text: |-
      Bij het besluit tot aanwijzing van een beschermd landschapsgezicht wordt bepaald of en zo ja in hoeverre geldende
      bestemmingsplannen als beschermend plan in de zin van het eerste lid kunnen worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel26
  - number: '27.1'
    text: |-
      Onze Minister wijst gebieden aan ter uitvoering van verdragen of andere internationale verplichtingen met
      betrekking tot natuur- en landschapsbehoud met uitzondering van de [richtlijn (EEG) nr. 79/409](31979L0409) en de
      [richtlijn (EEG) nr. 92/43](31992L0043), voorzover die verdragen of verplichtingen zulks met zich brengen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel27
  - number: '27.2'
    text: |-
      Een besluit als bedoeld in het eerste lid, gaat vergezeld van een kaart, waarop de begrenzing van het gebied
      nauwkeurig wordt aangegeven alsmede van een toelichting. In de toelichting wordt in ieder geval vermeld op
      welke wijze de instandhouding van het gebied, overeenkomstig het bepaalde in de bedoelde verplichtingen, wordt
      verwezenlijkt.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel27
  - number: '27.3'
    text: |-
      Een besluit als bedoeld in het eerste lid, wordt bekendgemaakt in de Staatscourant en in één of meer in het
      betrokken gebied verspreide dag-, nieuws- of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel27
  - number: '28'
    text: |-
      Alvorens tot een aanwijzing als bedoeld in [artikel 27, eerste lid][ref1], over te gaan, hoort Onze Minister de
      besturen van de provincies en gemeenten waarin het gebied gelegen is.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel27
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '27'
        hoofdstuk: V
  - number: '29.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden, voorzover dit noodzakelijk is ter uitvoering van verdragen
      of andere internationale verplichtingen met betrekking tot natuur- en landschapsbehoud, nadere regels gesteld ten
      aanzien van de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel29
  - number: '29.2'
    text: |-
      Tot de regels, bedoeld in het eerste lid, kunnen behoren de criteria voor de beoordeling van op grond van
      [artikel 27][ref1] aan te wijzen gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel27
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '27'
        hoofdstuk: V
  - number: '29.3'
    text: |-
      Tot de regels, bedoeld in het eerste lid, kan daarnaast behoren de mogelijkheid om door middel van een
      voorbereidingsbesluit te komen tot een voorlopige aanwijzing van een gebied, voordat de procedure, bedoeld in
      [artikel 28][ref1], is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel28
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '28'
        hoofdstuk: V
  - number: 29a.1
    text: |-
      Onverminderd het elders bij deze wet of bij een algemene maatregel van bestuur krachtens deze wet bepaalde, kunnen
      bij ministeriële regeling regels worden gesteld inzake onderwerpen waarop deze wet van toepassing is, mits deze
      regels uitsluitend strekken ter uitvoering van een voor Nederland verbindend verdrag of ander besluit van een
      volkenrechtelijke organisatie.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel29a
  - number: 29a.2
    text: |-
      Bij de regeling, bedoeld in het eerste lid, kan het bij deze wet of bij algemene maatregel van bestuur krachtens
      deze wet bepaalde buiten werking worden gesteld, voorzover dat noodzakelijk is voor een juiste en tijdige
      uitvoering van een verdrag of besluit bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel29a
  - number: 29a.3
    text: |-
      Voorzover bij de regeling het bij deze wet of bij algemene maatregel van bestuur krachtens deze wet bepaalde buiten
      werking worden gesteld, zorgt Onze Minister voor vervanging van de regeling. Indien voor de vervanging een wet
      nodig is, wordt binnen twee jaren na inwerkingtreding van de regeling een voorstel van wet ingediend bij de Staten-
      Generaal. Indien voor de vervanging een algemene maatregel van bestuur nodig is, wordt de voordracht aan Ons gedaan
      binnen een jaar na inwerkingtreding van de regeling.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel29a
  - number: '30'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder het bevoegd gezag: het orgaan dat het besluit, bedoeld in
      [artikel 31][ref1], heeft genomen of geacht wordt te hebben genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel31
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '31'
        hoofdstuk: VI
  - number: '31.1'
    text: |-
      Voorzover blijkt dat een belanghebbende ten gevolge van een besluit, genomen krachtens [hoofdstuk III][ref1] van
      deze wet, schade lijdt of zal lijden, die redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven
      en waarvan de vergoeding niet of niet voldoende door aankoop, onteigening of anderszins is verzekerd, kent het
      orgaan dat dat besluit heeft genomen of geacht wordt te hebben genomen, hem op zijn verzoek een naar billijkheid te
      bepalen schadevergoeding toe.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009641
        hoofdstuk: III
  - number: '31.2'
    text: |-
      Het bevoegd gezag kan omtrent het verzoek om schadevergoeding het advies van de schadebeoordelingscommissie,
      bedoeld in [artikel 32][ref1] inwinnen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel32
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '32'
        hoofdstuk: VI
  - number: '32.1'
    text: Een schadebeoordelingscommissie wordt door het bevoegde gezag ingesteld.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel32
  - number: '32.2'
    text: De schadebeoordelingscommissie bestaat uit één of meer leden.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel32
  - number: '32.3'
    text: |-
      Een lid van een door Onze Minister ingestelde schadebeoordelingscommissie mag niet de betrekking bekleden van
      ambtenaar in dienst van het ministerie of van een dienst, bedrijf of instelling werkzaam onder verantwoordelijkheid
      van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel32
  - number: '32.4'
    text: |-
      Met ambtenaar als bedoeld in het derde lid, worden voor de toepassing van dit hoofdstuk gelijkgesteld zij die op
      arbeidsovereenkomst naar burgerlijk recht werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel32
  - number: '32.5'
    text: |-
      Een lid van een door gedeputeerde staten ingestelde schadebeoordelingscommissie mag niet de betrekking bekleden
      van:
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel32
  - number: 32.5.a
    text: commissaris van de Koning;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel32
  - number: 32.5.b
    text: lid van gedeputeerde staten;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel32
  - number: 32.5.c
    text: ambtenaar, door of vanwege het provinciaal bestuur aangesteld of daaraan ondergeschikt.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel32
  - number: '32.6'
    text: |-
      Met ambtenaar als bedoeld in het vijfde lid, onderdeel c, worden voor de toepassing van dit hoofdstuk gelijkgesteld
      zij die in dienst van de provincie op arbeidsovereenkomst naar burgerlijk recht werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel32
  - number: '33.1'
    text: |-
      Indien het bevoegd gezag besluit het advies van de schadebeoordelingscommissie in te winnen, zendt het binnen
      twee weken na de dag waarop het verzoek om schadevergoeding is ingediend, het verzoekschrift voor advies aan
      de schadebeoordelingscommissie, vergezeld van alle op de zaak betrekking hebbende stukken, onder gelijktijdige
      mededeling hiervan aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel33
  - number: '33.2'
    text: Het bevoegd gezag verleent aan de schadebeoordelingscommissie de gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel33
  - number: '34.1'
    text: |-
      De schadebeoordelingscommissie stelt de verzoeker of zijn gemachtigde in de gelegenheid zijn verzoek om
      schadevergoeding in een openbare vergadering tegenover haar nader toe te lichten.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel34
  - number: '34.2'
    text: |-
      Een door Onze Minister ingestelde schadebeoordelingscommissie kan ambtenaren in dienst van het ministerie of van
      een dienst, bedrijf of instelling, werkzaam onder verantwoordelijkheid van Onze Minister oproepen om in de openbare
      vergadering te verschijnen tot het geven van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel34
  - number: '34.3'
    text: |-
      Een door gedeputeerde staten ingestelde schadebeoordelingscommissie kan één of meer leden van gedeputeerde staten,
      met inbegrip van de voorzitter, en ambtenaren door of vanwege het provinciaal bestuur aangesteld of daaraan
      ondergeschikt, oproepen om in de openbare vergadering te verschijnen tot het geven van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel34
  - number: '34.4'
    text: |-
      Indien de schadebeoordelingscommissie een plaatsopneming wil houden, deelt zij het tijdstip van de plaatsopneming
      vooraf mede aan de verzoeker en aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel34
  - number: '35'
    text: |-
      De schadebeoordelingscommissie brengt binnen dertien weken na de dag waarop het verzoek om schadevergoeding is
      ingediend, een met redenen omkleed advies uit aan het bevoegd gezag. Zij zendt gelijktijdig een exemplaar daarvan
      aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel35
  - number: '36.1'
    text: |-
      Het bevoegd gezag stelt de verzoeker in de gelegenheid schriftelijk of mondeling in tegenwoordigheid van de
      schadebeoordelingscommissie, zijn zienswijze omtrent het advies naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel36
  - number: '36.2'
    text: |-
      Het mondeling naar voren brengen van een zienswijze als bedoeld in het eerste lid, geschiedt indien de
      schadebeoordelingscommissie is ingesteld door gedeputeerde staten, ten overstaan van één of meer leden van
      gedeputeerde staten met inbegrip van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel36
  - number: '36.3'
    text: |-
      De schadebeoordelingscommissie verstrekt het bevoegd gezag desgevraagd nadere toelichting op het advies en geeft
      desgevraagd haar mening omtrent de zienswijze daarover van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel36
  - number: '37'
    text: De kosten van de schadebeoordelingscommissie worden de verzoeker niet in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel37
  - number: '38'
    text: |-
      Het bevoegd gezag geeft een beschikking binnen negen weken na ontvangst van het advies van de
      schadebeoordelingscommissie, of indien omtrent een verzoek om schadevergoeding geen advies krachtens
      [artikel 31, tweede lid][ref1], is ingewonnen, binnen dertien weken na de dag waarop het verzoek om
      schadevergoeding is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel31
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '31'
        hoofdstuk: VI
  - number: '39.1'
    text: |-
      Tegen een besluit op grond van deze wet kan een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak
      van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel39
  - number: '39.2'
    text: |-
      De werking van een besluit als bedoeld in [artikel 15, eerste lid][ref1], wordt geschorst totdat de beroepstermijn
      is verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel15
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '15'
        hoofdstuk: III
  - number: '40'
    text: |-
      Onze Minister doet de besluiten als bedoeld in de [artikelen 10, eerste lid][ref1], [10a, eerste lid][ref2]
      en [15, eerste lid][ref3], onverwijld inschrijven in de openbare registers, bedoeld in
      [artikel 16 van Boek 3 van het Burgerlijk Wetboek][ref4], indien binnen de daarvoor geldende termijnen
      geen bezwaar of beroep is ingesteld of, indien beroep is ingesteld, op het beroep is beslist.
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref5] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '15'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '16'
      - id: ref5
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '41.1'
    text: |-
      In de aanvrage van de vergunningen als bedoeld in de [artikelen 16][ref1] en [19d][ref2] wordt het belang van de
      aanvrager bij het verlenen van de vergunning gemotiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
  - number: '41.2'
    text: De ontvangst van de aanvrage wordt schriftelijk bevestigd.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel41
  - number: '42.1'
    text: Op de vergunningaanvrage wordt binnen dertien weken na de datum van ontvangst beslist.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel42
  - number: '42.2'
    text: |-
      Het orgaan dat tot verlening van de vergunning bevoegd is, kan de termijn eenmaal met dertien weken verlengen.
      Van zodanige verlenging wordt mededeling gedaan aan de aanvrager en aan burgemeester en wethouders, bedoeld in
      [artikel 44][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel44
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '44'
        hoofdstuk: VIII
  - number: '42.3'
    text: |-
      Van een besluit tot verlening, wijziging of intrekking van de vergunningen als bedoeld in de [artikelen 16][ref1]
      en [19d][ref2] wordt door het orgaan dat tot verlening van de vergunning bevoegd is kennis gegeven in een of meer
      dag-, nieuws-, of huis-aan-huisbladen of op andere geschikte wijze. Volstaan kan worden met vermelding van de
      zakelijke inhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
  - number: '43.1'
    text: |-
      Aan een vergunning kunnen voorschriften worden verbonden. Een vergunning kan onder beperkingen worden verleend.
      Bij algemene maatregel van bestuur kunnen met betrekking tot deze voorschriften en beperkingen nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel43
  - number: '43.2'
    text: 'Een vergunning kan worden ingetrokken of gewijzigd indien:'
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel43
  - number: 43.2.a
    text: de houder van de vergunning handelt in strijd met de daaraan verbonden voorschriften of beperkingen;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel43
  - number: 43.2.b
    text: |-
      de gegevens op grond waarvan de vergunning is verleend zodanig onjuist of onvolledig blijken te zijn dat, waren de
      juiste gegevens bekend geweest, een andere beslissing zou zijn genomen;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel43
  - number: 43.2.c
    text: de vergunning in strijd met de wettelijke voorschriften is gegeven, of
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel43
  - number: 43.2.d
    text: |-
      de omstandigheden sedert het tijdstip waarop de vergunning is verleend zodanig zijn gewijzigd, dat deze niet, niet
      zonder beperkingen of voorwaarden of slechts onder andere beperkingen of voorwaarden zou zijn verleend indien deze
      omstandigheden op het tijdstip waarop de vergunning is verleend zouden hebben bestaan.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel43
  - number: '44.1'
    text: |-
      Indien Onze Minister bevoegd is tot verlening van een vergunning zendt hij een afschrift van het verzoek om een
      vergunning en van de ontvangstbevestiging aan gedeputeerde staten van de provincies en burgemeester en wethouders
      van de gemeenten, waarin de handeling, waarvoor de vergunning wordt verlangd, zal geschieden.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel44
  - number: '44.2'
    text: |-
      Indien gedeputeerde staten bevoegd zijn tot verlening van een vergunning zenden zij een afschrift van de stukken,
      bedoeld in het eerste lid, aan burgemeester en wethouders van de gemeenten, bedoeld in het eerste lid, alsmede aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel44
  - number: '44.3'
    text: |-
      Gedeputeerde staten en burgemeester en wethouders, onderscheidenlijk burgemeester en wethouders, kunnen binnen acht
      weken na de op de ontvangstbevestiging vermelde datum bij het tot verlening van de vergunning bevoegd orgaan hun
      zienswijze naar voren brengen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel44
  - number: '45.1'
    text: |-
      Onze Minister kan, indien dat in het algemeen belang geboden is, gedeputeerde staten een aanwijzing geven ter zake
      van het nemen van een besluit ten aanzien van een aanvraag om een vergunning als bedoeld in de [artikelen 16][ref1]
      en [19d][ref2], een reeds verleende vergunning als bedoeld in de [artikelen 16][ref3] en [19d][ref4] en een
      beheersplan als bedoeld in de [artikelen 17][ref5] en [19a][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref5]: https://wetten.overheid.nl/BWBR0009641#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0009641#Artikel19a
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0009641
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0009641
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
  - number: '45.2'
    text: |-
      Onze Minister pleegt over het voornemen tot het geven van een aanwijzing overleg met de betrokken gedeputeerde
      staten.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel45
  - number: '45.3'
    text: De aanwijzing wordt door gedeputeerde staten vermeld in de beschikking terzake waarvan zij is gegeven.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel45
  - number: '45.4'
    text: |-
      Indien gedeputeerde staten niet binnen de door Onze Minister bij de in het eerste lid bedoelde aanwijzing gestelde
      termijn aan de aanwijzing gevolg geven, dan wel daaraan niet naar behoren gevolg geven, neemt Onze Minister het
      besluit waarop de aanwijzing betrekking had.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel45
  - number: 45a.1
    text: |-
      Onze Minister kan, indien dat in het algemeen belang geboden is, het bevoegde bestuursorgaan een aanwijzing geven
      ter zake van een besluit als bedoeld in [artikel 19j, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19j
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19j
        hoofdstuk: III
        paragraaf: '2'
  - number: 45a.2
    text: De in het eerste lid genoemde bevoegdheid geldt niet ten aanzien van bestuursorganen die behoren tot de Staat.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel45a
  - number: 45a.3
    text: Onze Minister pleegt over het voornemen tot het geven van een aanwijzing overleg met de betrokken bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel45a
  - number: 45a.4
    text: |-
      De betrokken bestuursorganen zijn verplicht een besluit als bedoeld in het eerste lid binnen zes maanden in
      overeenstemming te brengen met de aanwijzingen van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel45a
  - number: '49.1'
    text: 'Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:'
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel49
  - number: 49.1.a
    text: de bij besluit van Onze Minister aangewezen ambtenaren;
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel49
  - number: 49.1.b
    text: |-
      de door Onze Minister van Justitie op grond van [artikel 17 van de Wet op de economische delicten][ref1] met de
      opsporing van de bij of krachtens deze wet strafbaar gestelde feiten belaste ambtenaren, en


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel17
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '17'
  - number: 49.1.c
    text: de bij besluit van gedeputeerde staten aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel49
  - number: '49.2'
    text: |-
      Van een besluit als bedoeld in het eerste lid, onderdeel a, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel49
  - number: '57.1'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van het bij of krachtens deze wet
      bepaalde, ter zake van projecten en andere handelingen waarvoor hij ingevolge de [artikelen 16][ref1] en
      [19d][ref2] bevoegd is vergunning te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
  - number: '57.2'
    text: |-
      Gedeputeerde staten geven op verzoek van Onze Minister een beschikking tot toepassing van bestuursdwang indien de
      bij of krachtens deze wet gestelde verplichtingen niet worden nageleefd. Bij het verzoek kan Onze Minister bepalen
      waarbinnen aan zijn verzoek wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel57
  - number: '57.3'
    text: Gedeputeerde staten zenden aan Onze Minister een exemplaar van de in het tweede lid bedoelde beschikking.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel57
  - number: '58.1'
    text: |-
      Bij het bestaan van een voornemen tot onteigening in het belang der natuurbescherming krachtens
      [titel VIII der onteigeningswet][ref1] kan Onze Minister met name genoemde handelingen verbieden, die schadelijk
      zijn voor het natuurschoon of voor de natuurwetenschappelijke betekenis van de bij de voorgenomen onteigening
      betrokken onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0001842
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0001842
  - number: '58.2'
    text: |-
      Het verbod vervalt door de overgang van de eigendom van de zaak op de onteigenende partij alsmede indien het niet
      binnen twee jaar is gevolgd door een zodanige eigendomsovergang, tenzij alsdan een geding aanhangig is als bedoeld
      in [hoofdstuk III van titel I der onteigeningswet][ref1]. De termijn kan bij een in de Staatscourant te plaatsen
      koninklijk besluit met ten hoogste een jaar verlengd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0001842
        hoofdstuk: III
  - number: '58.3'
    text: |-
      Onze Minister is te allen tijde bevoegd het verbod geheel of gedeeltelijk in te trekken dan wel daarvan ontheffing
      te verlenen.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel58
  - number: '58.4'
    text: Onze Minister maakt het verbod bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel58
  - number: '59'
    text: |-
      Onze Minister, alsmede gedeputeerde staten, kan onderscheidenlijk kunnen ambtenaren aanwijzen die toegang hebben
      tot alle natuurmonumenten voorzover dat voor de uitvoering van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel59
  - number: '60.1'
    text: |-
      Besluiten die zijn genomen op grond van de [artikelen 7][ref1], [11][ref2], [12][ref3], [14][ref4], [18][ref5],
      [21, eerste lid][ref6], [28][ref7], [29, eerste lid][ref8], [30][ref9] en [31 van de Natuurbeschermingswet][ref10]
      gelden als besluiten die zijn genomen op grond van onderscheidenlijk [de artikelen 10][ref11], [15][ref12],
      [16][ref13], [17][ref14], [31][ref15], [10][ref16], [49, eerste lid][ref17], [59][ref18] en [58][ref19] van deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002611#Artikel12
