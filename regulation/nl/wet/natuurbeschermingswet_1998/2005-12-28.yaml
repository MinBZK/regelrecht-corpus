  - number: '67'
    text: |-
      Ten aanzien van voor de datum van inwerkingtreding van deze wet genomen besluiten tot
      toepassing van bestuursdwang en de daaruit voortvloeiende uitvoering van werken als bedoeld in
      [artikel 29, eerste en tweede lid, van de Natuurbeschermingswet][ref1], blijft genoemde wet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel29
    url: https://wetten.overheid.nl/BWBR0009641/2005-12-28#Artikel67
