        artikel: 19c
        hoofdstuk: III
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0009641
        artikel: 19ke
        hoofdstuk: III
        paragraaf: 2a
  - number: '57.2'
    text: |-
      Gedeputeerde staten geven op verzoek van Onze Minister een beschikking tot oplegging van een last onder
      bestuursdwang indien de bij of krachtens deze wet gestelde verplichtingen niet worden nageleefd. Bij het verzoek
      kan Onze Minister bepalen waarbinnen aan zijn verzoek wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel57
  - number: '57.3'
    text: Gedeputeerde staten zenden aan Onze Minister een exemplaar van de in het tweede lid bedoelde beschikking.
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel57
  - number: '57.4'
    text: |-
      Gedeputeerde staten zijn bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het
      bij of krachtens deze wet bepaalde, ter zake van projecten en andere handelingen waarvoor zij ingevolge de
      [artikelen 16][ref1], [19d][ref2], en [19ia][ref3] in samenhang met 16 bevoegd zijn vergunning te verlenen,
      en waarvoor zij ingevolge de [artikelen 19c][ref4], 19ia in samenhang met 19c, en [19ke][ref5], bevoegd zijn
      verplichtingen op te leggen en instructies te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19ia
      [ref4]: https://wetten.overheid.nl/BWBR0009641#Artikel19c
      [ref5]: https://wetten.overheid.nl/BWBR0009641#Artikel19ke
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel57
