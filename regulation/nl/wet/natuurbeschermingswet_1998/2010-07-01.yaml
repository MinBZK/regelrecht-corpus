  - number: '58.1'
    text: |-
      Bij het bestaan van een voornemen tot onteigening in het belang der natuurbescherming krachtens
      [titel VIII der onteigeningswet][ref1] kan Onze Minister met name genoemde handelingen verbieden, die schadelijk
      zijn voor het natuurschoon of voor de natuurwetenschappelijke betekenis van de bij de voorgenomen onteigening
      betrokken onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0001842
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0001842
  - number: '58.2'
    text: |-
      Het verbod vervalt door de overgang van de eigendom van de zaak op de onteigenende partij alsmede indien het niet
      binnen twee jaar is gevolgd door een zodanige eigendomsovergang, tenzij alsdan een geding aanhangig is als bedoeld
      in [hoofdstuk III van titel I der onteigeningswet][ref1]. De termijn kan bij een in de Staatscourant te plaatsen
      koninklijk besluit met ten hoogste een jaar verlengd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0001842
        hoofdstuk: III
  - number: '58.3'
    text: |-
      Onze Minister is te allen tijde bevoegd het verbod geheel of gedeeltelijk in te trekken dan wel daarvan ontheffing
      te verlenen.
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel58
  - number: '58.4'
    text: Onze Minister maakt het verbod bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel58
  - number: '60'
    text: |-
