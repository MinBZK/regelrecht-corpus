  - number: '45.2'
    text: |-
      Onze Minister pleegt over het voornemen tot het geven van een aanwijzing overleg met de betrokken gedeputeerde
      staten.
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel45
  - number: '45.3'
    text: De aanwijzing wordt door gedeputeerde staten vermeld in de beschikking terzake waarvan zij is gegeven.
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel45
  - number: '45.4'
    text: |-
      Indien gedeputeerde staten niet binnen de door Onze Minister bij de in het eerste lid bedoelde aanwijzing gestelde
      termijn aan de aanwijzing gevolg geven, dan wel daaraan niet naar behoren gevolg geven, neemt Onze Minister het
      besluit waarop de aanwijzing betrekking had.
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel45
  - number: 45a.1
    text: |-
      Onze Minister kan, indien dat in het algemeen belang geboden is, het bevoegde bestuursorgaan een aanwijzing geven
      ter zake van een besluit als bedoeld in [artikel 19j, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19j
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19j
        hoofdstuk: III
        paragraaf: '2'
  - number: 45a.2
    text: De bevoegdheid, bedoeld in het eerste lid, geldt niet ten aanzien van bestuursorganen die behoren tot de Staat.
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel45a
  - number: 45a.3
    text: Onze Minister pleegt over het voornemen tot het geven van een aanwijzing overleg met de betrokken bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel45a
  - number: 45a.4
    text: |-
      De betrokken bestuursorganen zijn verplicht een besluit als bedoeld in het eerste lid binnen zes maanden in
      overeenstemming te brengen met de aanwijzingen van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel45a
  - number: '49.1'
    text: 'Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:'
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel49
  - number: 49.1.a
    text: de bij besluit van Onze Minister aangewezen ambtenaren;
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel49
  - number: 49.1.b
    text: |-
      de door Onze Minister van Justitie op grond van [artikel 17 van de Wet op de economische delicten][ref1] met de
      opsporing van de bij of krachtens deze wet strafbaar gestelde feiten belaste ambtenaren, en


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel17
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '17'
  - number: 49.1.c
    text: de bij besluit van gedeputeerde staten aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel49
  - number: '49.2'
    text: |-
      Van een besluit als bedoeld in het eerste lid, onderdeel a, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel49
  - number: '57.1'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bij of krachtens
      deze wet bepaalde, ter zake van projecten en andere handelingen waarvoor hij ingevolge de [artikelen 16][ref1],
      [19d][ref2], en [19ia][ref3] in samenhang met 16 bevoegd is vergunning te verlenen, alsmede ter zake van de
      verplichtingen en instructies die hij krachtens de artikelen 16, 19ia in samenhang met [19c][ref4], en [19ke][ref5]
      bevoegd is op te leggen onderscheidenlijk te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19ia
      [ref4]: https://wetten.overheid.nl/BWBR0009641#Artikel19c
      [ref5]: https://wetten.overheid.nl/BWBR0009641#Artikel19ke
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009641
