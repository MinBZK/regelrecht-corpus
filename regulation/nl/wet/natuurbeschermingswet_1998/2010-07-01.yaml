  - number: 60a.1
    text: |-
      Besluiten die zijn genomen op grond van [artikel 12 van de Natuurbeschermingswet][ref1] voor projecten of andere
      handelingen als bedoeld in [artikel 19d, eerste lid][ref2], gelden ter zake van een Natura 2000-gebied als
      besluiten die zijn genomen op grond van [artikel 19d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
  - number: 60a.2
    text: |-
      Besluiten die zijn genomen op grond van [artikel 16, tweede lid, onderdeel c, van de Natuurbeschermingswet][ref1]
      gelden als besluiten die zijn genomen op grond van [artikel 16][ref2] of [artikel 19d][ref3] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
  - number: 60a.3
    text: |-
      Het eerste en het tweede lid gelden niet met betrekking tot de toepassing van [artikel 31][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel31
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '31'
        hoofdstuk: VI
  - number: 60a.4
    text: |-
      De besluiten van Onze Minister van Landbouw, Natuur en Voedselkwaliteit houdende de aanwijzing van gebieden ter
      uitvoering van richtlijn 79/409/EEG gelden als besluiten als bedoeld in [artikel 10a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
        hoofdstuk: III
  - number: 60a.5
    text: |-
      Voor zover een beschermd natuurmonument als bedoeld in [artikel 10][ref1] geheel of gedeeltelijk deel uitmaakt van
      een gebied als bedoeld in het vierde lid, vervalt in afwijking van [artikel 15a, tweede lid][ref2], een besluit
      houdende de aanwijzing van dat beschermde natuurmonument geheel of gedeeltelijk met ingang van 1 oktober 2005.
      [Artikel 15a, derde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel15a
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 15a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0009641
        artikel: 15a
        hoofdstuk: III
  - number: 60a.6
    text: |-
      Op besluiten, waarbij artikel 6 van de richtlijn 92/43/EEG aan de orde is, op voor 1 oktober 2005 ingediende
      aanvragen om vergunning of ontheffing en ingediende verzoeken om toestemming anderszins blijft deze wet buiten
      toepassing, totdat de bezwaar- of beroepstermijn is verstreken dan wel, indien beroep is ingesteld, onherroepelijk
      op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel60a
  - number: 60a.7
    text: |-
      Een beheerplan dat is vastgesteld op grond van [artikel 14 van de Natuurbeschermingswet][ref1], behoudt zijn
      gelding gedurende de periode waarvoor het plan is aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel14
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '14'
  - number: 60a.8
    text: |-
      Een beheerplan als bedoeld in [artikel 19a][ref1] voor een gebied dat ter uitvoering van richtlijn 79/409/EEG voor
      1 oktober 2005 is aangewezen, wordt uiterlijk drie jaar na het vaststellen van de instandhoudingsdoelstelling voor
      het gebied voor het eerst vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19a
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
  - number: 60a.9
    text: |-
      Besluiten die zijn genomen op basis van [artikel 19d, derde lid][ref1], (oud) gelden als besluiten die zijn genomen
      op basis van [artikel 19d, vierde lid][ref2] (nieuw).


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 19d
        hoofdstuk: III
        paragraaf: '2'
  - number: '61'
    text: |-
      Gebieden die voor de inwerkingtreding van deze wet door Onze Minister zijn aangewezen ter uitvoering van verdragen
      of andere internationale verplichtingen met betrekking tot natuur- en landschapsbehoud, gelden als aangewezen
      gebieden op grond van [artikel 27][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel27
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '27'
        hoofdstuk: V
  - number: '62.1'
    text: |-
      Besluiten, die voor de datum van inwerkingtreding van deze wet zijn genomen op grond van
      [artikel 8, eerste lid, van de Natuurbeschermingswet][ref1] worden afgehandeld overeenkomstig
      [artikel 9 van genoemde wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel9
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002611
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002611
        artikel: '9'
  - number: '62.2'
    text: |-
      Besluiten die voor de datum van inwerkingtreding van deze wet zijn genomen op grond van
      [artikel 8, tweede lid, van de Natuurbeschermingswet][ref1] gelden als besluiten die zijn genomen op grond
      van [artikel 12, eerste lid][ref2], van deze wet, met dien verstande dat zodanige besluiten worden afgehandeld
      overeenkomstig [artikel 9 van de Natuurbeschermingswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002611#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002611#Artikel9
    url: https://wetten.overheid.nl/BWBR0009641/2010-07-01#Artikel62
