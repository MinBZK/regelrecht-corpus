  - number: 19h
    text: |-
      1 Indien een vergunning als bedoeld in [artikel 19d, eerste lid][ref1], om dwingende redenen van groot openbaar
      belang wordt verleend voor het realiseren van projecten, waarvan niet met zekerheid vaststaat dat die projecten de
      natuurlijke kenmerken van het Natura 2000-gebied niet aantasten, verbinden gedeputeerde staten aan die vergunning
      in ieder geval het voorschrift inhoudende de verplichting compenserende maatregelen te treffen.

      2 De initiatiefnemer wordt door gedeputeerde staten tijdig tevoren in de gelegenheid gesteld om voorstellen voor
      compenserende maatregelen te doen.

      3 In de voorstellen voor compenserende maatregelen, bedoeld in het tweede lid, wordt in ieder geval opgenomen op
      welke wijze en in welk tijdsbestek de compenserende maatregelen zullen worden getroffen.

      4 Voor zover compenserende maatregelen worden voorgeschreven met het oog op de doelstellingen, bedoeld in
      [artikel 10a, tweede lid, onderdeel a of onderdeel b][ref2], dient het met deze maatregelen beoogde resultaat te
      zijn bereikt op het tijdstip waarop significante gevolgen als bedoeld in [artikel 19f, eerste lid][ref3], zich
      voordoen, tenzij kan worden aangetoond dat deze gelijktijdigheid niet noodzakelijk is om de bijdrage van het
      betrokken gebied aan Natura 2000 veilig te stellen.

      5 Bij ministeriële regeling kan Onze Minister in overeenstemming met Onze andere Ministers, wie het mede aangaat
      nadere eisen stellen ten aanzien van compenserende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
