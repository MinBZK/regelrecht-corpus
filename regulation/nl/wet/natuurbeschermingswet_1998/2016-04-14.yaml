  - number: 19kr
    text: |-
      1 In dit artikel en de daarop berustende bepalingen wordt verstaan onder:

      a. *referentiedatum:*

      1°. voor gebieden ter uitvoering van richtlijn 92/43/EEG:

        - 7 december 2004, of
        - de datum waarop het desbetreffende gebied door de Europese Commissie tot een gebied van communautair belang is
      verklaard ter uitvoering van artikel 4, tweede lid, van richtlijn 92/43/EEG, voor zover die verklaring plaatsvindt
      na 7 december 2004;

      2°. voor gebieden ter uitvoering van richtlijn 2009/147/EG: 10 juni 1994 of de datum waarop het desbetreffende
      gebied is aangewezen ter uitvoering van richtlijn 2009/147/EG, voor zover die aanwijzing plaatsvindt na 10 juni
      1994.

      b. *voor stikstof gevoelige habitats in een Natura 2000-gebied:* voor stikstof gevoelige natuurlijke habitats
      en habitats van soorten in een Natura 2000-gebied ten aanzien waarvan op grond van artikel 6, tweede lid, van
      richtlijn 92/43/EEG een verplichting geldt tot het treffen van instandhoudingsmaatregelen.

      2 Dit artikel is uitsluitend van toepassing op projecten en andere handelingen:

      a. die stikstofdepositie veroorzaken op voor stikstofgevoelige habitats in een Natura 2000-gebied dat niet is
      opgenomen in het programma, of

      b. ten aanzien waarvan het bestuursorgaan dat met betrekking tot dat project of die andere handeling bevoegd is tot
      het nemen van een besluit, genoemd in [artikel 19km, eerste lid][ref1], in overeenstemming met het bestuursorgaan
      dat voor de Natura 2000-gebieden waar het project of de andere handeling stikstofdepositie veroorzaakt, het
      beheerplan, bedoeld in [artikel 19a][ref2] of [19b][ref3], vaststelt en de ingevolge [artikel 2, vierde lid][ref4],
      medebetrokken bestuursorganen, het besluit heeft genomen dat artikel 19km, derde lid, niet van toepassing is.

      3 Onder significante gevolgen als bedoeld in [artikel 19f, eerste lid][ref5], worden niet verstaan de gevolgen
      van een project door het veroorzaken van stikstofdepositie op voor stikstofgevoelige habitats in een Natura 2000-
      gebied, wanneer het project een activiteit is die na de referentiedatum is begonnen, of een gebruik dat na de
      referentiedatum in betekenende mate is gewijzigd, waarbij is verzekerd dat, in samenhang met voor die activiteit
      getroffen maatregelen, de stikstofdepositie op de voor stikstof gevoelige habitats in een Natura 2000-gebied als
      gevolg van die activiteit of dat gebruik per saldo niet is toegenomen of zal toenemen.

      4 Gedeputeerde staten kunnen ter vermindering van de stikstofdepositie in het Natura 2000-gebied, in elk geval
      aan het verlenen van een vergunning als bedoeld in [artikel 19d, eerste lid][ref6], de voorwaarde verbinden dat
      de stikstofdepositie op de voor stikstof gevoelige habitats in een Natura 2000-gebied die wordt veroorzaakt door
      het project of de andere handeling waarop de aanvraag van de vergunning betrekking heeft, niet groter is dan de
      door gedeputeerde staten geregistreerde en voor dat project of die andere handeling beschikbaar gestelde afname
      van stikstofdepositie op deze habitats als gevolg van de beëindiging van een of meer bepaalde andere projecten of
      andere handelingen.

      5 Gedeputeerde staten, onderscheidenlijk provinciale staten, kunnen bij het toepassen van
      [artikel 19kp, tweede lid][ref7], in elk geval de verplichting opleggen dat de stikstofdepositie op de voor
      stikstof gevoelige habitats in het Natura 2000-gebied geheel dan wel voor een bepaald deel, niet groter is dan
      de door gedeputeerde staten geregistreerde en voor het project of de andere handeling beschikbaar gestelde afname
      van stikstofdepositie op deze habitats als gevolg van de beëindiging van een of meer bepaalde andere projecten of
      andere handelingen.

      6 Met betrekking tot de bepaling van de door projecten, andere handelingen en maatregelen als bedoeld in het
      tweede of derde lid veroorzaakte of te veroorzaken stikstofdepositie kunnen bij ministeriële regeling regels worden
      gesteld. Daarbij kan onder meer worden geregeld dat hiervoor bij of krachtens andere wetten bijgehouden of aan een
      bevoegd gezag overgelegde gegevens kunnen worden gebruikt.

      7 De bestuursorganen die beheerplannen als bedoeld in [artikel 19a][ref8] of [19b][ref9] vaststellen voor Natura
      2000-gebieden waar projecten of andere handelingen stikstofdepositie veroorzaken op voor stikstofgevoelige
      habitats, hebben een actueel overzicht van de gevolgen van deze projecten en andere handelingen voor de
      stikstofdepositie, en rapporteren hierover. De beschrijving in het programma van de wijze waarop en de
      frequentie waarmee rapportage plaatsvindt als bedoeld in [artikel 19kh, eerste lid, onderdeel f][ref10], is van
      overeenkomstige toepassing. De gevolgen worden betrokken bij toepassing van artikel 19kh, eerste lid, onderdeel b.

      8 Een besluit als bedoeld in het tweede lid, onderdeel b, kan alleen genomen worden als na toepassing van het
      zevende lid ontwikkelruimte beschikbaar blijft.

      9 Maatregelen als bedoeld in [artikel 19kh, eerste lid, onderdelen c en g][ref11], worden onverkort uitgevoerd.


