  - number: '9'
    text: |-
      1 Er is een Structuurvisie Natuur en Landschap.

      2 De structuurvisie geeft inzicht in de ruimtelijke aspecten van het rijksbeleid inzake natuur en landschap.

      3 De structuurvisie is een structuurvisie als bedoeld in
      [artikel 2.3, tweede lid, van de Wet ruimtelijke ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2.3'
  - number: 9a
    text: |-
      1 Het Planbureau voor de Leefomgeving brengt eenmaal in de vier jaar aan Onze Minister een wetenschappelijk rapport
      uit, waarin de toestand van natuur, bos en landschap, alsmede de ten aanzien daarvan meest waarschijnlijke en
      mogelijke andere toekomstige ontwikkelingen voor een door Onze Minister aan te geven periode worden beschreven.

      2 Het Planbureau voor de Leefomgeving brengt eenmaal in de twee jaar aan Onze Minister een wetenschappelijk
      rapport uit, waarin, mede in het licht van in eerdere rapporten beschreven ontwikkelingen, de stand van zaken
      in de beleidsuitvoering, de voortgang en nieuwe ontwikkelingen worden beschreven. Indien zich onvoorzien een
      omstandigheid voordoet die belangrijke gevolgen kan hebben voor de ontwikkeling van natuur, bos en landschap op
      langere termijn, neemt het Planbureau voor de Leefomgeving, indien Onze Minister daarom verzoekt, in een rapport
      tevens een beschrijving op van die mogelijke ontwikkeling.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel9a
  - number: 9b
    text: |-
      1 Onze Minister wijst, tezamen met – voor zover het hem aangaat – Onze Minister van Infrastructuur en Milieu,
      overheidsinstellingen aan, die door het Planbureau voor de Leefomgeving in ieder geval worden betrokken bij het
      opstellen van de in [artikel 9a][ref1] bedoelde rapporten.

      2 Onze Minister kan, tezamen met – voor zover het hem aangaat – Onze Minister van Infrastructuur en Milieu, regels
      stellen ten aanzien van de wijze waarop de krachtens het eerste lid aangewezen overheidsinstellingen bij het
      opstellen van de rapporten worden betrokken.

      3 Het Planbureau voor de Leefomgeving en de op grond van het eerste lid aangewezen instellingen verschaffen elkaar
      desgevraagd alle inlichtingen en gegevens waarover zij kunnen beschikken voorzover dat voor het opstellen van de
      rapporten, bedoeld in [artikel 9a, eerste en tweede lid][ref2], redelijkerwijs noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel9a
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel9b
