preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regelen te stellen inzake de bescherming
    van natuur en landschap en dat het voorts wenselijk is een wettelijke grondslag te geven aan het verlenen van
    bijdragen ter bevordering en ondersteuning van het beleid inzake natuur en landschap alsmede aan het verlenen
    van vergoedingen terzake van het op vrijwillige basis richten of mede richten van de bedrijfsvoering van
    landbouwbedrijven, binnen daartoe aangewezen gebieden, op het beheer van natuur en landschap;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken;

      b. natuurmonument: terrein of water, dan wel samenstel van terreinen of wateren, dat van algemeen belang is om zijn
      natuurwetenschappelijke betekenis of zijn natuurschoon;

      c. eigenaar: degene, die in de basisregistratie kadaster als eigenaar staat vermeld, met dien verstande dat indien
      op een onroerende zaak een eeuwig durend recht van erfpacht of een recht van beklemming rust, daaronder wordt
      verstaan de erfpachter of de beklemde meier, en dat bij onroerende zaken die aan een niet eeuwig durend recht
      van erfpacht, een recht van vruchtgebruik of een recht van opstal zijn onderworpen, daaronder mede zijn begrepen
      degenen, die in de basisregistratie kadaster als erfpachter, vruchtgebruiker of opstalhouder staan vermeld, een en
      ander voorzover niet de rechtstoestand is gebleken een andere te zijn dan de basisregistratie kadaster aangeeft;

      d. gebruiker: degene, die uit hoofde van een andere rechtsverhouding dan onder c genoemd een onroerende zaak in
      gebruik heeft;

      e. landschapsgezicht: samenstel van onbebouwde terreinen of van bebouwde en onbebouwde terreinen dat vanwege
      zijn structuren, patronen of elementen danwel anderszins vanwege zijn uiterlijke verschijningsvorm, historisch-
      landschappelijk van algemeen belang is;

      f. richtlijn 2009/147/EG: richtlijn nr. 2009/147/EG van het Europees Parlement en de Raad van de Europese Unie van
      30 november 2009 inzake het behoud van de vogelstand (PbEU 2010, L 20);

      g. [richtlijn 92/43/EEG](31992L0043): [richtlijn 92/43/EEG](31992L0043) van de Raad van de Europese Gemeenschappen
      van 21 mei 1992 inzake de instandhouding van de natuurlijke habitats en de wilde flora en fauna (PbEG L 206);

      h. prioritaire soort: als prioritair aangeduide soort in bijlage II van de [richtlijn 92/43/EEG](31992L0043);

      i. prioritaire type natuurlijke habitat: als prioritair type aangeduide natuurlijke habitat in bijlage I van de
      [richtlijn 92/43/EEG](31992L0043);

      j. initiatiefnemer: degene die het initiatief neemt tot een plan als bedoeld in [artikel 19j][ref1] of tot een
      project of andere handeling als bedoeld in [artikel 19d, eerste lid][ref2];

      k. instandhoudingsdoelstelling: doelstelling of doelstellingen als bedoeld in [artikel 10a, tweede lid][ref3];

      l. Natura 2000: Europees ecologische netwerk dat bestaat uit de speciale beschermingszones, bedoeld in de richtlijn
      2009/147/EG en [richtlijn 92/43/EEG](31992L0043);

      m. bestaand gebruik: gebruik dat op 31 maart 2010 bekend is, of redelijkerwijs bekend had kunnen zijn bij het
      bevoegd gezag;

      n. Natura 2000-gebied:

      1°. gebied dat door de bevoegde autoriteit van het land waarin het gebied is gelegen is aangewezen als speciale
      beschermingszone, ter uitvoering van de artikelen 3, tweede lid, onderdeel a, en 4, eerste en tweede lid, van
      richtlijn 2009/147/EG of de artikelen 3, tweede lid, en 4, vierde lid, van richtlijn 92/43/EEG,

      2°. gebied dat voorlopig is aangewezen als bedoeld in [artikel 12, derde lid][ref4], of

      3°. gebied dat voorkomt op de lijst van gebieden van communautair belang, bedoeld in artikel 4, tweede lid, van
      richtlijn 92/43/EEG;

      o. omgevingsvergunning: omgevingsvergunning als bedoeld in
      [artikel 1.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref5];

      p. exclusieve economische zone: exclusieve economische zone van Nederland als bedoeld in de
      [Rijkswet instelling exclusieve economische zone][ref6];

      q. programma: programma als bedoeld in artikel 19kg, eerste lid;

      r. ontwikkelingsruimte: stikstofdepositie die in het kader van het programma met betrekking tot een daarin
      opgenomen Natura 2000-gebied kan worden toegedeeld in of gereserveerd voor besluiten als bedoeld in artikel 19km,
      eerste lid;

      s. voor stikstof gevoelige habitats in een Natura 2000-gebied: voor stikstof gevoelige natuurlijke habitats of
      habitats van voor stikstof gevoelige soorten in een Natura 2000-gebied waarvoor een instandhoudingsdoelstelling
      geldt.


