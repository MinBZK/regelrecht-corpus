  - number: '10'
    text: |-
      1 Onze Minister kan, mede op grondslag van de structuurvisie, bedoeld in [artikel 9][ref1], bij besluit een
      natuurmonument aanwijzen als beschermd natuurmonument. Het besluit gaat vergezeld van een kaart waarop het
      beschermd natuurmonument is aangegeven en een toelichting.

      2 Indien het beheer over een natuurmonument of een gedeelte daarvan berust bij een van Onze andere Ministers, dan
      neemt Onze Minister een besluit als bedoeld in het eerste lid niet dan in overeenstemming met die andere Minister.

      3 Indien in andere gevallen dan bedoeld in het tweede lid, een van Onze andere Ministers op grond van enig
      wettelijk voorschrift bevoegd is besluiten te nemen met betrekking tot het natuurmonument, vindt voorafgaand aan
      het nemen van een besluit als bedoeld in het eerste lid overleg plaats met die andere Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel9
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '9'
        hoofdstuk: II
  - number: 10a
    text: |-
      1 Onze Minister wijst gebieden aan ter uitvoering van richtlijn 2009/147/EG en [richtlijn 92/43/EEG](31992L0043).

      2 Een besluit als bedoeld in het eerste lid bevat de instandhoudingsdoelstelling voor het gebied. Tot de
      instandhoudingsdoelstelling behoren in ieder geval:

      a. de doelstellingen ten aanzien van de instandhouding van de leefgebieden, voorzover vereist ingevolge richtlijn
      2009/147/EG of

      b. de doelstellingen ten aanzien van de instandhouding van de natuurlijke habitats of populaties in het wild
      levende dier- en plantensoorten voorzover vereist ingevolge [richtlijn 92/43/EEG](31992L0043).

      3 De instandhoudingsdoelstelling, bedoeld in het tweede lid, kan mede betrekking hebben op doelstellingen ten
      aanzien van het behoud, het herstel en de ontwikkeling van het natuurschoon of de natuurwetenschappelijke betekenis
      van het gebied, anders dan vereist ingevolge de richtlijnen, bedoeld in het tweede lid.

      4 Een besluit als bedoeld in het eerste lid gaat vergezeld van een kaart, waarop de begrenzing van het gebied
      nauwkeurig wordt aangegeven alsmede van een toelichting.

      5 [Artikel 10, tweede en derde lid][ref1], is van overeenkomstige toepassing.

      6 Een besluit als bedoeld in het eerste lid met betrekking tot de aanwijzing van een gebied dat geheel of
      gedeeltelijk is gelegen in de exclusieve economische zone, wordt niet eerder genomen dan vier weken nadat het
      ontwerp van dat besluit aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel10a
