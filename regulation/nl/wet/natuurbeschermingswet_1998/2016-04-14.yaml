        artikel: '27'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '28'
        hoofdstuk: V
  - number: 29a
    text: |-
      1 Onverminderd het elders bij deze wet of bij een algemene maatregel van bestuur krachtens deze wet bepaalde,
      kunnen bij ministeriële regeling regels worden gesteld inzake onderwerpen waarop deze wet van toepassing is, mits
      deze regels uitsluitend strekken ter uitvoering van een voor Nederland verbindend verdrag of ander besluit van een
      volkenrechtelijke organisatie.

      2 Bij de regeling, bedoeld in het eerste lid, kan het bij deze wet of bij algemene maatregel van bestuur krachtens
      deze wet bepaalde buiten werking worden gesteld, voorzover dat noodzakelijk is voor een juiste en tijdige
      uitvoering van een verdrag of besluit bedoeld in het eerste lid.

      3 Voorzover bij de regeling het bij deze wet of bij algemene maatregel van bestuur krachtens deze wet bepaalde
      buiten werking worden gesteld, zorgt Onze Minister voor vervanging van de regeling. Indien voor de vervanging een
      wet nodig is, wordt binnen twee jaren na inwerkingtreding van de regeling een voorstel van wet ingediend bij de
      Staten-Generaal. Indien voor de vervanging een algemene maatregel van bestuur nodig is, wordt de voordracht aan Ons
      gedaan binnen een jaar na inwerkingtreding van de regeling.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel29a
  - number: '30'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder het bevoegd gezag: het orgaan dat het besluit, bedoeld in
      [artikel 31][ref1], heeft genomen of geacht wordt te hebben genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel31
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '31'
        hoofdstuk: VI
  - number: '31'
    text: |-
      1 Voorzover blijkt dat een belanghebbende ten gevolge van een besluit, genomen krachtens [hoofdstuk III][ref1] van
      deze wet, schade lijdt of zal lijden, die redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven
      en waarvan de vergoeding niet of niet voldoende door aankoop, onteigening of anderszins is verzekerd, kent het
      orgaan dat dat besluit heeft genomen of geacht wordt te hebben genomen, hem op zijn verzoek een naar billijkheid te
      bepalen schadevergoeding toe.

      2 Het bevoegd gezag kan omtrent het verzoek om schadevergoeding het advies van de schadebeoordelingscommissie,
      bedoeld in [artikel 32][ref2], inwinnen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel32
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009641
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009641
        artikel: '32'
        hoofdstuk: VI
  - number: '32'
    text: |-
      1 Een schadebeoordelingscommissie wordt door het bevoegde gezag ingesteld.

      2 De schadebeoordelingscommissie bestaat uit één of meer leden.

      3 Een lid van een door Onze Minister ingestelde schadebeoordelingscommissie mag niet de betrekking bekleden van
      ambtenaar in dienst van het ministerie of van een dienst, bedrijf of instelling werkzaam onder verantwoordelijkheid
      van Onze Minister.

      4 Met ambtenaar als bedoeld in het derde lid worden voor de toepassing van dit hoofdstuk gelijkgesteld zij die op
      grond van een arbeidsovereenkomst naar burgerlijk recht werkzaam zijn.

      5 Een lid van een door gedeputeerde staten ingestelde schadebeoordelingscommissie mag niet de betrekking bekleden
      van:

      a. commissaris van de Koning;

      b. lid van gedeputeerde staten;

      c. ambtenaar, door of vanwege het provinciaal bestuur aangesteld of daaraan ondergeschikt.

      6 Met ambtenaar als bedoeld in het vijfde lid, onderdeel c, worden voor de toepassing van dit hoofdstuk
      gelijkgesteld zij die in dienst van de provincie op grond van een arbeidsovereenkomst naar burgerlijk recht
      werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel32
  - number: '33'
    text: |-
      1 Indien het bevoegd gezag besluit het advies van de schadebeoordelingscommissie in te winnen, zendt het het
      verzoekschrift voor advies aan de schadebeoordelingscommissie, vergezeld van alle op de zaak betrekking hebbende
      stukken, onder gelijktijdige mededeling hiervan aan de verzoeker.

      2 Het bevoegd gezag verleent aan de schadebeoordelingscommissie de gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel33
  - number: '34'
    text: |-
      1 De schadebeoordelingscommissie stelt de verzoeker of zijn gemachtigde in de gelegenheid zijn verzoek om
      schadevergoeding in een openbare vergadering tegenover haar nader toe te lichten.

      2 Een door Onze Minister ingestelde schadebeoordelingscommissie kan ambtenaren in dienst van het ministerie of van
      een dienst, bedrijf of instelling, werkzaam onder verantwoordelijkheid van Onze Minister oproepen om in de openbare
      vergadering te verschijnen tot het geven van inlichtingen.

      3 Een door gedeputeerde staten ingestelde schadebeoordelingscommissie kan één of meer leden van gedeputeerde
      staten, met inbegrip van de voorzitter, en ambtenaren door of vanwege het provinciaal bestuur aangesteld of daaraan
      ondergeschikt, oproepen om in de openbare vergadering te verschijnen tot het geven van inlichtingen.

      4 Indien de schadebeoordelingscommissie een plaatsopneming wil houden, deelt zij het tijdstip van de plaatsopneming
      vooraf mede aan de verzoeker en aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel34
  - number: '35'
    text: |-
      De schadebeoordelingscommissie brengt een met redenen omkleed advies uit aan het bevoegd gezag. Zij zendt
      gelijktijdig een exemplaar daarvan aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel35
  - number: '36'
    text: |-
      1 Het bevoegd gezag stelt de verzoeker in de gelegenheid schriftelijk of mondeling in tegenwoordigheid van de
      schadebeoordelingscommissie, zijn zienswijze omtrent het advies naar voren te brengen.

      2 Het mondeling naar voren brengen van een zienswijze als bedoeld in het eerste lid geschiedt, indien de
      schadebeoordelingscommissie is ingesteld door gedeputeerde staten, ten overstaan van één of meer leden van
      gedeputeerde staten met inbegrip van de voorzitter.

      3 De schadebeoordelingscommissie verstrekt het bevoegd gezag desgevraagd nadere toelichting op het advies en geeft
      desgevraagd haar mening omtrent de zienswijze daarover van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel36
  - number: '37'
    text: De kosten van de schadebeoordelingscommissie worden de verzoeker niet in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel37
  - number: '38'
    text: |-
      1 Het bestuursorgaan beslist binnen acht weken of, indien een schadebeoordelingscommissie als bedoeld in
      [artikel 32, eerste lid][ref1], is ingeschakeld, binnen zesentwintig weken na de ontvangst van het verzoek om
      schadevergoeding.

      2 Het bestuursorgaan kan de beslissing eenmaal voor ten hoogste acht weken of, indien een
      schadebeoordelingscommissie als bedoeld in [artikel 32, eerste lid][ref2], is ingeschakeld, zesentwintig weken
      verdagen. Van de verdaging wordt schriftelijk mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel32
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel38
