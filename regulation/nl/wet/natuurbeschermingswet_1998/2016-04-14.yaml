  - number: 19kb
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop wordt vastgesteld of projecten,
      andere handelingen of plannen een verslechterend of significant verstorend effect kunnen hebben als bedoeld in
      [artikel 19d, eerste lid][ref1], of [artikel 19j, eerste lid][ref2], alsmede over de wijze waarop wordt bepaald
      of projecten of plannen significante gevolgen kunnen hebben als bedoeld in [artikel 19a, tiende lid][ref3],
      [artikel 19f, eerste lid][ref4], of artikel 19j, tweede lid.

      2 De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op rekenmodellen, onderzoeksmethoden of
      meetmethoden waarmee effecten of gevolgen als bedoeld in het eerste lid kunnen worden bepaald.


