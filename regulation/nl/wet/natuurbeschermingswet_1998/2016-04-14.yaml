  - number: '15'
    text: |-
      1 Onze Minister kan bij besluit een aanwijzing als bedoeld in [artikel 10][ref1] of [10a][ref2] geheel of
      gedeeltelijk intrekken of wijzigen. Het besluit gaat vergezeld van een toelichting alsmede in geval van
      gedeeltelijke intrekking of wijziging van een kaart waarop het gedeelte van het natuurmonument, waarop de
      intrekking of de wijziging betrekking heeft, is aangegeven.

      2 Onze Minister kan bij besluit de instandhoudingsdoelstellingen onderscheidenlijk de doelstellingen ten aanzien
      van het behoud, herstel en de ontwikkeling van het natuurschoon of de natuurwetenschappelijke betekenis, bedoeld in
      [artikel 15a, derde lid][ref3], wijzigen.

      3 [Artikel 10, tweede en derde lid][ref4], en de [artikelen 11 tot en met 14][ref5] zijn van toepassing.


