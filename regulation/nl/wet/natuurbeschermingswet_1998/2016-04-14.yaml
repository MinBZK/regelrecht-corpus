  - number: 15a
    text: |-
      1 Een Natura 2000-gebied kan niet worden aangewezen als beschermd natuurmonument als bedoeld in
      [artikel 10, eerste lid][ref1].

      2 Een besluit houdende de aanwijzing van een natuurmonument als beschermd natuurmonument als bedoeld in
      [artikel 10, eerste lid][ref2], vervalt met ingang van het tijdstip waarop doch slechts voorzover dat beschermd
      natuurmonument deel uitmaakt van een aangewezen gebied als bedoeld in [artikel 10a, eerste lid][ref3].

      3 Indien met toepassing van het tweede lid een besluit houdende de aanwijzing van een natuurmonument als beschermd
      natuurmonument geheel of gedeeltelijk is vervallen, heeft de instandhoudingsdoelstelling voor het op grond van
      [artikel 10a, eerste lid][ref4], aangewezen gebied, voor het gedeelte van het gebied waarop de aanwijzing als
      beschermd natuurmonument betrekking had, mede betrekking op de doelstellingen ten aanzien van het behoud, herstel
      en de ontwikkeling van het natuurschoon of de natuurwetenschappelijke betekenis van het gebied zoals bepaald in het
      vervallen besluit.


