  - number: 19kn
    text: |-
      1 Bij ministeriële regeling kan ter uitvoering van het programma voor daarbij aangegeven Natura 2000-gebieden
      gedurende het tijdvak van het programma ontwikkelingsruimte worden gereserveerd voor de toedeling daarvan in
      besluiten als bedoeld in [artikel 19km, eerste lid][ref1], die betrekking hebben op bij die regeling afzonderlijk
      of per categorie genoemde of beschreven projecten of andere handelingen, waarbij een voorkeursvolgorde voor de
      toedeling kan worden aangegeven.

      2 Een reservering vervalt voor zover het bevoegd gezag voor het nemen van een besluit waarvoor de
      ontwikkelingsruimte is gereserveerd, aan Onze Minister heeft verklaard dat het de reservering of een deel daarvan
      gedurende het tijdvak van het programma niet zal toedelen. Nadat de eerste helft van het tijdvak van het programma
      is verstreken, gaan de bevoegde gezagen, bedoeld in de eerste volzin, na of er reserveringen zijn ten aanzien
      waarvan de eerste volzin wordt toegepast.

      3 Onze Minister en Onze Minister van Infrastructuur en Milieu stellen in overeenstemming met de bestuursorganen
      die de beheerplannen voor de in het programma opgenomen Natura 2000-gebieden vaststellen, vast welk deel van
      de ontwikkelingsruimte in de eerste helft en welk deel in de tweede helft van het tijdvak van het programma
      wordt toegedeeld en gereserveerd. Deze verdeling is zodanig dat een evenwichtige toedeling en reservering van de
      ontwikkelingsruimte gedurende het tijdvak van het programma is verzekerd.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van het derde lid.

      5 Als projecten of andere handelingen als bedoeld in het eerste lid kunnen worden genoemd of beschreven projecten
      of andere handelingen die voldoen aan elk van de volgende voorwaarden:

      a. het project of de andere handeling is aantoonbaar van nationaal of provinciaal maatschappelijk belang;

      b. het is aannemelijk dat voor het project of de andere handeling in het tijdvak, bedoeld in
      [artikel 19kg, vijfde lid][ref2], ontwikkelingsruimte wordt toegedeeld in een besluit als bedoeld in
      [artikel 19km, eerste lid][ref3].

      6 De omvang van de ontwikkelingsruimte die voor projecten en andere handelingen als bedoeld in het eerste lid
      wordt gereserveerd, is zodanig dat er niet onnodig inbreuk wordt gedaan op de omvang van de ontwikkelingsruimte die
      resteert voor toedeling aan andere projecten of handelingen dan die bedoeld in het eerste lid.


