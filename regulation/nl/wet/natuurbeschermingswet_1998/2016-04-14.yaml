  - number: 19kp
    text: |-
      1 Het bevoegd gezag draagt er zorg voor dat passende maatregelen worden genomen om verslechtering van de kwaliteit
      van de voor stikstof gevoelige habitats in een Natura 2000-gebied te voorkomen, en om de in het beheerplan
      voor het desbetreffende Natura 2000-gebied ten aanzien van die habitats beschreven resultaten, bedoeld in
      [artikel 19a, derde lid, onderdeel a][ref1], te verwezenlijken.

      2 Ter uitvoering van het eerste lid kan het bevoegd gezag aan degene wiens handelen stikstofdepositie veroorzaakt
      op voor stikstofgevoelige habitats in een Natura 2000-gebied de verplichting opleggen om binnen een door het
      bevoegd gezag te stellen termijn:

      a. de nodige preventieve of herstelmaatregelen te treffen, met inachtneming van door het bevoegd gezag gegeven
      instructies;

      b. de handeling te staken of te beperken, of

      c. informatie over de handeling te verstrekken.

      3 Een verplichting als bedoeld in het tweede lid kan worden voorgeschreven voor:

        - afzonderlijke gevallen bij beschikking, dan wel
        - categorieën van gevallen bij algemeen verbindend voorschrift, voor zover de verplichting betrekking heeft op
      inrichtingen als bedoeld in [artikel 1.1, derde lid, van de Wet milieubeheer][ref2], of het drijven daarvan, en zij
      geen betrekking heeft op handelingen waarvoor Onze Minister het bevoegd gezag is.

      4 Het bevoegd gezag stelt belanghebbenden in de gelegenheid hun zienswijze uit te brengen over een voornemen tot
      het opleggen van een verplichting als bedoeld in het tweede lid, tenzij de verslechtering het opleggen van een
      verplichting terstond noodzakelijk maakt.

      5 Het is verboden in strijd te handelen met een verplichting als bedoeld in het tweede lid.

      6 Onder «bevoegd gezag» als bedoeld in het eerste lid wordt verstaan:

      a. Onze Minister, indien de handeling een krachtens [artikel 19d, vijfde lid][ref3], aangewezen project of andere
      handeling is, of de handeling plaatsvindt in of gevolgen heeft voor categorieën van gebieden die krachtens dat
      vijfde lid zijn aangewezen;

      b. in andere gevallen dan die, bedoeld in onderdeel a:

        - gedeputeerde staten, ingeval de verplichting voor één of meer afzonderlijke gevallen wordt voorgeschreven;
        - provinciale staten, ingeval de verplichting voor categorieën van gevallen wordt voorgeschreven. De
      [artikelen 2, vijfde en zesde lid][ref4], en [2a, tweede en derde lid][ref5], zijn van overeenkomstige toepassing,
      met dien verstande dat voor «gedeputeerde staten» wordt gelezen: provinciale staten.


