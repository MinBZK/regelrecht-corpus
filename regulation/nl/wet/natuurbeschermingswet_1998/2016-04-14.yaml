  - number: '11'
    text: |-
      1 Op de voorbereiding van een besluit als bedoeld in de [artikelen 10, eerste lid][ref1], en
      [10a, eerste lid][ref2], is [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing.

      2 Zienswijzen met betrekking tot de voorbereiding van een besluit als bedoeld in [artikel 10, eerste lid][ref4],
      worden naar voren gebracht bij gedeputeerde staten.

      3 Binnen vier maanden na afloop van de in [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref5]
      bedoelde termijn zenden gedeputeerde staten de naar voren gebrachte zienswijzen, vergezeld van hun beschouwingen,
      aan Onze Minister. Op verzoek van gedeputeerde staten kan Onze Minister de in de eerste volzin bedoelde termijn met
      acht weken verlengen.


