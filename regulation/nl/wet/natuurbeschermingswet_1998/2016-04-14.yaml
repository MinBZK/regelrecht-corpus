  - number: '23'
    text: |-
      1 Gedeputeerde staten kunnen een landschapsgezicht bij besluit aanwijzen als beschermd landschapsgezicht.

      2 Indien het betreffende gebied reeds is aangewezen als beschermd natuurmonument, houden gedeputeerde staten bij
      hun besluit rekening met die aanwijzing.

      3 Gedeputeerde staten kunnen bij besluit een aanwijzing als beschermd landschapsgezicht geheel of gedeeltelijk
      wijzigen of intrekken.

      4 Op een besluit als bedoeld in het derde lid zijn het tweede lid en de [artikelen 24 tot en met 26][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel24
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '24'
        hoofdstuk: IV
  - number: '24'
    text: |-
      1 Het besluit, bedoeld in [artikel 23][ref1], bevat in ieder geval:

      a. een beschrijving van de kenmerken van het landschapsgezicht voorzover deze kenmerken uiterlijk waarneembaar
      zijn;

      b. een aanduiding van handelingen die de kenmerken, bedoeld in onderdeel a, kunnen aantasten.

      2 Het besluit gaat vergezeld van een kaart waarop de begrenzing van het gebied dat als beschermd landschapsgezicht
      is aangewezen, is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel23
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '23'
        hoofdstuk: IV
  - number: '25'
    text: |-
      1 Alvorens tot een aanwijzing als beschermd landschapsgezicht over te gaan, zenden gedeputeerde staten het ontwerp-
      besluit aan de gemeenteraad van de gemeenten waarin het landschapsgezicht is gelegen alsmede aan de provinciale
      planologische commissie. De gemeenteraad brengt binnen zes maanden en de provinciale planologische commissie brengt
      binnen negen maanden na ontvangst van het ontwerp-besluit advies uit.

      2 Binnen een jaar na toezending van het ontwerp-besluit, bedoeld in het eerste lid, beslissen gedeputeerde staten
      over aanwijzing van het landschapsgezicht als beschermd landschapsgezicht, doch niet alvorens zij de adviezen
      bedoeld in het eerste lid, hebben ontvangen dan wel de krachtens dat artikellid geldende termijnen zijn verstreken.

      3 Gedeputeerde staten maken een besluit over aanwijzing van een landschapsgezicht als beschermd landschapsgezicht
      bekend in de Staatscourant en in één of meer in het betrokken gebied verspreide dag-, nieuws- of huis-aan-
      huisbladen.

      4 Gedeputeerde staten zenden afschrift van een besluit over aanwijzing van een landschapsgezicht als beschermd
      landschapsgezicht aan Onze Minister en de gemeenteraad van de gemeenten waarin het beschermd landschapsgezicht
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel25
  - number: '26'
    text: |-
      1 De gemeenteraad van de gemeenten waarin het beschermd landschapsgezicht is gelegen, stelt ter bescherming van een
      beschermd landschapsgezicht een bestemmingsplan vast als bedoeld in de [Wet ruimtelijke ordening][ref1]. Bij het
      besluit tot aanwijzing van een beschermd landschapsgezicht kan hiertoe door gedeputeerde staten een termijn worden
      gesteld.

      2 Bij het besluit tot aanwijzing van een beschermd landschapsgezicht wordt bepaald of en zo ja in hoeverre geldende
      bestemmingsplannen als beschermend plan in de zin van het eerste lid kunnen worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: '27'
    text: |-
      1 Onze Minister wijst gebieden aan ter uitvoering van verdragen of andere internationale verplichtingen met
      betrekking tot natuur- en landschapsbehoud met uitzondering van de richtlijn 2009/147/EG en de [richtlijn 92/43/
      EEG](31992L0043), voorzover die verdragen of verplichtingen zulks met zich brengen.

      2 Een besluit als bedoeld in het eerste lid, gaat vergezeld van een kaart, waarop de begrenzing van het gebied
      nauwkeurig wordt aangegeven alsmede van een toelichting. In de toelichting wordt in ieder geval vermeld op
      welke wijze de instandhouding van het gebied, overeenkomstig het bepaalde in de bedoelde verplichtingen, wordt
      verwezenlijkt.

      3 Een besluit als bedoeld in het eerste lid, wordt bekendgemaakt in de Staatscourant en in één of meer in het
      betrokken gebied verspreide dag-, nieuws- of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel27
  - number: '28'
    text: |-
      Alvorens tot een aanwijzing als bedoeld in [artikel 27, eerste lid][ref1], over te gaan, hoort Onze Minister de
      besturen van de provincies en gemeenten waarin het gebied gelegen is.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel27
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '27'
        hoofdstuk: V
  - number: '29'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden, voorzover dit noodzakelijk is ter uitvoering van
      verdragen of andere internationale verplichtingen met betrekking tot natuur- en landschapsbehoud, nadere regels
      gesteld ten aanzien van de in deze wet geregelde onderwerpen.

      2 Tot de regels, bedoeld in het eerste lid, kunnen behoren de criteria voor de beoordeling van op grond van
      [artikel 27][ref1] aan te wijzen gebieden.

      3 Tot de regels, bedoeld in het eerste lid, kan daarnaast behoren de mogelijkheid om door middel van een
      voorbereidingsbesluit te komen tot een voorlopige aanwijzing van een gebied, voordat de procedure, bedoeld in
      [artikel 28][ref2], is voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel28
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel29
    references:
      - id: ref1
