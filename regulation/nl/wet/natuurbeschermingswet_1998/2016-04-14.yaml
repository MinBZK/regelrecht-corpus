  - number: 19km
    text: |-
      1 De ontwikkelingsruimte voor een in het programma opgenomen Natura 2000-gebied, kan, met uitzondering van
      de ruimte die is toegedeeld aan projecten als bedoeld in [artikel 19kh, zesde lid][ref1], overeenkomstig de
      uitgangspunten, bedoeld in artikel 19kh, vierde lid, door het bestuursorgaan dat bevoegd is tot het nemen van het
      desbetreffende besluit, worden toegedeeld in:

      a. een beheerplan als bedoeld in [artikel 19a][ref2], voor zover daarin een project of andere handeling is
      opgenomen als bedoeld in [artikel 19d, tweede lid][ref3];

      b. een vergunning als bedoeld in [artikel 19d, eerste lid][ref4];

      c. een bestemmingsplan als bedoeld in [artikel 19db, eerste lid][ref5];

      d. een omgevingsvergunning waarop [hoofdstuk IX][ref6] van toepassing is;

      e. een tracébesluit waarop [artikel 13, zevende lid, van de Tracéwet][ref7] van toepassing is;

      f. een wegaanpassingsbesluit waarop [artikel 9, vierde lid, van de Spoedwet wegverbreding][ref8] van toepassing
      is, of

      g. een ander besluit dat bij ministeriële regeling is aangewezen.

      2 Bij het nemen van een besluit als bedoeld in het eerste lid neemt het bevoegd gezag de reserveringen in acht,
      die krachtens [artikel 19kn, eerste lid][ref9], zijn gedaan. Daarbij draagt het bevoegd gezag er zorg voor dat
      in de eerste helft van het tijdvak van het programma voldoende ontwikkelingsruimte beschikbaar blijft om, met
      inachtneming van artikel 19kn, derde lid, en het bepaalde krachtens artikel 19kn, vierde lid, te worden toegedeeld
      in besluiten waarvoor krachtens artikel 19kn, eerste lid, ontwikkelingsruimte is gereserveerd.

      3 Voor een project dat of een andere handeling die betrekking heeft op een inrichting als bedoeld in
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref10] en stikstofdepositie veroorzaakt op een in het programma
      opgenomen Natura 2000-gebied wordt een vergunning als bedoeld in [artikel 19d, eerste lid][ref11], niet verleend
      op grond van het feit dat onmiddellijk in verband met dit project of deze andere handeling een afname van
      de stikstofdepositie plaatsvindt als gevolg van de beëindiging of beperking van een of meer bepaalde andere
      handelingen buiten die inrichting.

      4 Het derde lid is niet van toepassing op een besluit op een aanvraag om een vergunning als bedoeld in
      [artikel 19d, eerste lid][ref12], die is ingediend vóór het tijdstip van inwerkingtreding van het derde lid.

      5 Het bestuursorgaan dat bevoegd is tot het nemen van een besluit als bedoeld in het eerste lid waarin
      ontwikkelingsruime is toegedeeld kan dit besluit intrekken of wijzigen indien het project of de andere handeling
      waarop dit besluit betrekking heeft, nadat het besluit onherroepelijk is geworden, niet is gerealiseerd,
      onderscheidenlijk is verricht.


