  - number: 19ki
    text: |-
      1 Onze Minister en Onze Minister van Infrastructuur en Milieu kunnen in het programma maatregelen als bedoeld
      in [artikel 19kh, eerste lid, onderdeel c of g][ref1], wijzigen of door andere maatregelen vervangen, dan wel
      maatregelen toevoegen. Zij stellen voor de Natura 2000-gebieden waarop de maatregelen betrekking hebben in
      het programma vast wat daarvan de gevolgen zijn voor de ontwikkelingsruimte en voor de beoordeling, bedoeld in
      artikel 19kh, eerste lid, onderdeel h. Ingeval het wijzigen, vervangen of toevoegen van maatregelen leidt tot
      minder ontwikkelingsruimte met betrekking tot een Natura 2000-gebied, geschiedt dit in overeenstemming met de
      bestuursorganen die het beheerplan, bedoeld in [artikel 19a][ref2] of [19b][ref3], voor dat gebied vaststellen.

      2 De Minister van Defensie of bestuursorganen van provincies, gemeenten of waterschappen kunnen in het programma
      opgenomen maatregelen als bedoeld in [artikel 19kh, eerste lid, onderdeel c of g][ref4], voor de uitvoering waarvan
      zij zorg dragen, gewijzigd uitvoeren of vervangen door andere maatregelen, indien de bestuursorganen die voor
      het desbetreffende gebied het beheerplan, bedoeld in [artikel 19a][ref5] of [19b][ref6], vaststellen, daarmee
      instemmen, en dit niet leidt tot minder ontwikkelingsruimte met betrekking tot enig Natura 2000-gebied.


