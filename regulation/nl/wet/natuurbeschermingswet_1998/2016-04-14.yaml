  - number: 19d
    text: |-
      1 Het is verboden zonder vergunning, of in strijd met aan die vergunning verbonden voorschriften of beperkingen,
      van gedeputeerde staten of, ten aanzien van projecten of andere handelingen als bedoeld in het vijfde lid, van
      Onze Minister, projecten of andere handelingen te realiseren onderscheidenlijk te verrichten die gelet op de
      instandhoudingsdoelstelling, met uitzondering van de doelstellingen, bedoeld in [artikel 10a, derde lid][ref1],
      de kwaliteit van de natuurlijke habitats en de habitats van soorten in een Natura 2000-gebied kunnen verslechteren
      of een significant verstorend effect kunnen hebben op de soorten waarvoor het gebied is aangewezen. Zodanige
      projecten of andere handelingen zijn in ieder geval projecten of handelingen die de natuurlijke kenmerken van het
      desbetreffende gebied kunnen aantasten.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op het realiseren van projecten of het verrichten
      van andere handelingen, waaronder bestaand gebruik, alsmede de wijzigingen daarvan, overeenkomstig een beheerplan
      als bedoeld in de [artikelen 19a][ref2] of [19b][ref3].

      3 Het verbod, bedoeld in het eerste lid, is niet van toepassing op bestaand gebruik, behoudens indien dat gebruik
      een project is dat niet direct verband houdt met of nodig is voor het beheer van een Natura 2000-gebied maar
      dat afzonderlijk of in combinatie met andere projecten of plannen significante gevolgen kan hebben voor het
      desbetreffende Natura 2000-gebied.

      4 Het verbod, bedoeld in het eerste lid, is niet van toepassing op het realiseren van projecten of het
      verrichten van andere handelingen die zijn toegestaan krachtens een omgevingsvergunning die met toepassing van
      [hoofdstuk IX][ref4] is verleend.

      5 Bij algemene maatregel van bestuur kunnen projecten of andere handelingen of categorieën van gebieden worden
      aangewezen waarvoor een vergunning als bedoeld in het eerste lid wordt verleend door Onze Minister.

      6 De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19b
      [ref4]: https://wetten.overheid.nl/BWBR0009641#HoofdstukIX
