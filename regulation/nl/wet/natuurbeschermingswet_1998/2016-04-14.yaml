  - number: 19da
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat het verbod, bedoeld in [artikel 19d, eerste lid][ref1],
      niet van toepassing is op bepaalde categorieën van projecten of andere handelingen.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat Onze Minister met betrekking tot projecten en andere
      handelingen behorende tot een categorie als bedoeld in het eerste lid beperkingen of verplichtingen kan opleggen.

      3 Een krachtens het eerste of tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking
      dan zes weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van plaatsing wordt onverwijld
      mededeling gedaan aan de beide Kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
