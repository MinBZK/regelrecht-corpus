  - number: '57'
    text: |-
      1 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bij of krachtens
      deze wet bepaalde, ter zake van projecten en andere handelingen waarvoor hij ingevolge de [artikelen 16][ref1],
      [19d][ref2], en [19ia][ref3] in samenhang met 16 bevoegd is vergunning te verlenen, alsmede ter zake van
      de verplichtingen en instructies die hij krachtens de [artikelen 19c][ref4], [19ia][ref5] in samenhang met
      [19c][ref6], en [19ke][ref7] bevoegd is op te leggen onderscheidenlijk te geven.

      2 Dit artikel is niet van toepassing met betrekking tot de handhaving van het bij of krachtens [hoofdstuk IX][ref8]
      bepaalde.


