  - number: 73a
    text: |-
      1 De [Wet deelneming Grevelingen][ref1] wordt ingetrokken.

      2 Het Natuur- en Recreatieschap De Grevelingen ontvangt ter zake van de uittreding van het Rijk uit de
      gemeenschappelijke regeling Natuur- en Recreatiegebied De Grevelingen een vergoeding van het Rijk van 9,75
      miljoen euro, onder de voorwaarde dat de vergoeding door het Natuur- en Recreatieschap De Grevelingen of diens
      rechtsopvolger wordt besteed aan de behartiging van de belangen van natuur, landschap en openluchtrecreatie in
      De Grevelingen.

      3 Het Natuur- en Recreatieschap De Grevelingen of diens rechtsopvolger legt aan Onze Minister verantwoording af
      over de besteding van de afkoopsom en overlegt daartoe jaarlijks aan Onze Minister een jaarrekening tezamen met een
      accountantsverklaring. De eerste volzin is van toepassing tot 1 januari 2030 of, als dit eerder is, tot 1 januari
      van het jaar volgend op het jaar waarin het Natuur- en Recreatieschap De Grevelingen of diens rechtsopvolger is
      opgehouden te bestaan.

      4 Ingeval niet is voldaan aan de voorwaarde, bedoeld in het tweede lid, of aan de verplichtingen, bedoeld in het
      derde lid, eerste volzin, kan Onze Minister de vergoeding geheel of gedeeltelijk terugvorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0003806
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0003806
