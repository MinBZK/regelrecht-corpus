  - number: '41'
    text: |-
      1 In de aanvraag van de vergunningen, bedoeld in de [artikelen 16][ref1] en [19d][ref2], wordt het belang van de
      aanvrager bij het verlenen van de vergunning gemotiveerd.

      2 De ontvangst van de aanvraag wordt schriftelijk bevestigd.


