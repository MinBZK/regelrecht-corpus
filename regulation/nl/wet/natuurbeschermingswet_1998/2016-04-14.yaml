  - number: '12'
    text: |-
      1 In geval van dringende noodzaak kan Onze Minister bij besluit een natuurmonument ten aanzien waarvan
      overeenkomstig [artikel 11][ref1] een besluit tot aanwijzing als beschermd natuurmonument wordt voorbereid reeds
      voorlopig als zodanig aanwijzen voordat de procedure, bedoeld in de [artikelen 11][ref2] en [13][ref3] is voltooid.

      2 Een besluit tot voorlopige aanwijzing vervalt zodra met inachtneming van de [artikelen 11][ref4] en [13][ref5]
      een definitief besluit over aanwijzing als beschermd natuurmonument is genomen, doch in ieder geval een jaar nadat
      het ontwerp-besluit overeenkomstig [artikel 11][ref6] ter inzage is gelegd.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op gebieden als bedoeld in
      [artikel 10a, eerste lid][ref7], met dien verstande dat in het tweede lid de zinsnede beginnend met «doch in ieder
      geval» en eindigend met «ter inzage is gelegd» niet van toepassing is.


