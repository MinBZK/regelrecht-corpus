  - number: 9c
    text: |-
      1 Onze Minister kan aanwijzingen geven omtrent veronderstelde ontwikkelingen die in ieder geval als grondslag voor
      beschrijvingen als bedoeld in [artikel 9a, eerste lid][ref1], moeten worden aangenomen, alsmede omtrent onderwerpen
      die in ieder geval in een rapport als bedoeld in dat artikellid, moeten worden beschreven.

      2 Behoudens [artikel 9a, tweede lid, en het eerste lid][ref2], geven Onze betrokken Ministers het Planbureau voor
      de Leefomgeving en de krachtens [artikel 9b, eerste lid][ref3], aangewezen instellingen geen aanwijzingen met
      betrekking tot de inhoud van de rapporten.


