  - number: '58'
    text: |-
      1 Bij het bestaan van een voornemen tot onteigening in het belang der natuurbescherming krachtens
      [titel VIII der onteigeningswet][ref1] kan Onze Minister met name genoemde handelingen verbieden, die schadelijk
      zijn voor het natuurschoon of voor de natuurwetenschappelijke betekenis van de bij de voorgenomen onteigening
      betrokken onroerende zaak.

      2 Het verbod vervalt door de overgang van de eigendom van de zaak op de onteigenende partij alsmede indien het niet
      binnen twee jaar is gevolgd door een zodanige eigendomsovergang, tenzij alsdan een geding aanhangig is als bedoeld
      in [hoofdstuk III van titel I der onteigeningswet][ref2]. De termijn kan bij een in de Staatscourant te plaatsen
      koninklijk besluit met ten hoogste een jaar verlengd worden.

      3 Onze Minister is te allen tijde bevoegd het verbod geheel of gedeeltelijk in te trekken dan wel daarvan
      ontheffing te verlenen.

      4 Onze Minister maakt het verbod bekend in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0001842
      [ref2]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIII
