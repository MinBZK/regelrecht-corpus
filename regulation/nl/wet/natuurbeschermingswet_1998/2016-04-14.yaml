  - number: 19ko
    text: |-
      1 Een bestuursorgaan dat ontwikkelingsruimte toedeelt in een besluit als bedoeld in
      [artikel 19km, eerste lid, onderdeel a, b, c, e, f of g][ref1], draagt tijdig zorg voor een nauwkeurige en
      volledige registratie van de afschrijving van de toegedeelde ontwikkelingsruimte van de ontwikkelingsruimte die
      beschikbaar is voor projecten en andere handelingen die stikstofdepositie veroorzaken in de Natura 2000-gebieden
      waarop het besluit betrekking heeft. Ingeval ontwikkelingsruimte wordt toegedeeld in een besluit als bedoeld in
      artikel 19km, eerste lid, onderdeel d, draagt het bestuursorgaan, bedoeld in artikel 47b, eerste lid, zorg voor de
      nauwkeurige en volledige registratie van de afschrijving van de toegedeelde ontwikkelingsruimte.

      2 Het bestuursorgaan, bedoeld in het eerste lid, draagt tevens tijdig zorg voor een nauwkeurige en volledige
      registratie van de bijschrijving van ontwikkelingsruimte die na het intrekken of vervallen van een besluit
      als bedoeld in [artikel 19km, eerste lid][ref2], beschikbaar komt voor projecten en andere handelingen die
      stikstofdepositie veroorzaken in de Natura 2000-gebieden waarop het besluit betrekking had.

      3 Het eerste lid is van overeenkomstige toepassing op een reservering van ontwikkelingsruimte op grond van
      [artikel 19kn, eerste lid][ref3], met dien verstande dat Onze Minister zorg draagt voor de registratie van een
      reservering.

      4 Indien in een besluit als bedoeld in [artikel 19km, eerste lid][ref4], ontwikkelingsruimte wordt toegedeeld die
      is gereserveerd krachtens [artikel 19kn, eerste lid][ref5], vervalt de reservering en draagt het bestuursorgaan dat
      zorg draagt voor de registratie, bedoeld in het eerste lid, tevens zorg voor de registratie van het vervallen van
      de reservering.

      5 Bij ministeriële regeling worden regels gesteld ten aanzien van de registratie van afschrijvingen,
      bijschrijvingen of reserveringen van ontwikkelingsruimte en ten aanzien van het vervallen van reserveringen van
      ontwikkelingsruimte.


