  - number: '16'
    text: |-
      1 Het is verboden zonder vergunning van gedeputeerde staten of, ten aanzien van handelingen als bedoeld in het
      zesde lid, van Onze Minister, in een beschermd natuurmonument handelingen te verrichten, te doen verrichten
      of te gedogen, die schadelijk kunnen zijn voor het natuurschoon, voor de natuurwetenschappelijke betekenis van
      het beschermd natuurmonument of voor dieren of planten in het beschermd natuurmonument of die het beschermd
      natuurmonument ontsieren, dan wel in strijd met de bij een vergunning gestelde voorschriften of beperkingen
      handelingen te verrichten, te doen verrichten of te gedogen.

      2 Als schadelijke handelingen worden in elk geval aangemerkt handelingen die de in het besluit tot aanwijzing als
      beschermd natuurmonument vermelde wezenlijke kenmerken van het beschermde natuurmonument aantasten.

      3

      4 Het in het eerste lid bedoelde verbod is tevens van toepassing op handelingen als bedoeld in dat lid die
      buiten het beschermd natuurmonument kunnen worden verricht en die zijn vermeld in het besluit tot aanwijzing als
      beschermd natuurmonument, bedoeld in [artikel 10][ref1], of een besluit tot voorlopige aanwijzing als bedoeld in
      [artikel 12][ref2]. Bij de vermelding van handelingen kunnen beperkingen worden gesteld en uitzonderingen worden
      opgenomen met betrekking tot het tijdvak waarin, de omstandigheden waaronder, de doeleinden waarvoor en met
      betrekking tot de personen door wie zij worden verricht.

      5 Dit artikel is niet van toepassing op handelingen die worden verricht overeenkomstig een beheerplan als bedoeld
      in [artikel 17][ref3].

      6 Bij algemene maatregel van bestuur kunnen terzake van bij die maatregel genoemde beschermde natuurmonumenten
      handelingen worden aangewezen waarvoor een vergunning als bedoeld in het eerste lid wordt verleend door Onze
      Minister.

      7 Een krachtens het zesde lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.

      8 Dit artikel is niet van toepassing op handelingen die zijn toegestaan krachtens een omgevingsvergunning die met
      toepassing van [hoofdstuk IX][ref4] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
