  - number: '43'
    text: |-
      1 Aan een vergunning kunnen voorschriften worden verbonden.

      Een vergunning kan onder beperkingen worden verleend. Bij algemene maatregel van bestuur kunnen met betrekking tot
      deze voorschriften en beperkingen nadere regels worden gesteld.

      2 Een vergunning kan worden ingetrokken of gewijzigd indien:

      a. de houder van de vergunning handelt in strijd met de daaraan verbonden voorschriften of beperkingen;

      b. de gegevens op grond waarvan de vergunning is verleend zodanig onjuist of onvolledig blijken te zijn dat, waren
      de juiste gegevens bekend geweest, een andere beslissing zou zijn genomen;

      c. de vergunning in strijd met de wettelijke voorschriften is gegeven, of

      d. de omstandigheden sedert het tijdstip waarop de vergunning is verleend zodanig zijn gewijzigd, dat deze niet,
      niet zonder beperkingen of voorwaarden of slechts onder andere beperkingen of voorwaarden zou zijn verleend indien
      deze omstandigheden op het tijdstip waarop de vergunning is verleend zouden hebben bestaan.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel43
  - number: '44'
    text: |-
      1 Indien Onze Minister bevoegd is tot verlening van een vergunning zendt hij een afschrift van het verzoek om een
      vergunning en van de ontvangstbevestiging aan gedeputeerde staten van de provincies en burgemeester en wethouders
      van de gemeenten, waarin de handeling, waarvoor de vergunning wordt verlangd, zal geschieden.

      2 Indien gedeputeerde staten bevoegd zijn tot verlening van een vergunning, zenden zij een afschrift van de
      stukken, bedoeld in het eerste lid, aan burgemeester en wethouders van de gemeenten, bedoeld in het eerste lid,
      alsmede aan Onze Minister.

      3 Gedeputeerde staten en burgemeester en wethouders, onderscheidenlijk burgemeester en wethouders, kunnen binnen
      acht weken na de op de ontvangstbevestiging vermelde datum bij het tot verlening van de vergunning bevoegd orgaan
      hun zienswijze naar voren brengen.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel44
  - number: '46'
    text: |-
      1 Deze titel is van toepassing op handelingen:

      a. waarvoor een omgevingsvergunning is vereist en

      b. die tevens zijn aan te merken als handelingen waarvoor het verbod, bedoeld in [artikel 16, eerste lid][ref1]
      geldt.

      2 Deze titel is niet van toepassing op handelingen die zijn toegestaan krachtens een vergunning als bedoeld in
      [artikel 16, eerste lid][ref2], of waarvoor een zodanige vergunning is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel16
