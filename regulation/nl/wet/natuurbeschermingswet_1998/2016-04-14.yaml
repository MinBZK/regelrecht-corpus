    text: |-
      1 Gedeputeerde staten kunnen de toegang tot een beschermd natuurmonument als bedoeld in
      [artikel 10, eerste lid][ref1], een Natura 2000-gebied of delen van bedoelde gebieden, voorzover dit noodzakelijk
      is voor de bescherming van natuurwaarden, beperken.

      2 Indien een gebied als bedoeld in het eerste lid geheel of ten dele wordt beheerd door of onder
      verantwoordelijkheid van Onze Minister of een van Onze andere Ministers, wordt de in het eerste lid bedoelde
      bevoegdheid uitgeoefend door Onze Minister in overeenstemming met Onze andere Minister.

      3 Het is verboden in strijd met de beperkingen die ingevolge het eerste en tweede lid zijn opgelegd, zich te
      bevinden in een beschermd natuurmonument als bedoeld in [artikel 10, eerste lid][ref2], een Natura 2000-gebied of
      gedeelten daarvan.

      4 Het verbod in het derde lid geldt niet voor de eigenaar en de gebruiker van een beschermd natuurmonument als
      bedoeld in [artikel 10, eerste lid][ref3] of een Natura 2000-gebied, indien bedoeld gebruiksrecht zich daarover
      uitstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel10
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel20
