    text: |-
      1 Het bestuursorgaan, bedoeld in [artikel 46b, eerste lid][ref1], kan een verzoek als bedoeld in
      [artikel 2.29, eerste lid, tweede volzin, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref2]
      slechts doen indien de omstandigheden sinds het tijdstip waarop de in artikel 46b, eerste lid, bedoelde verklaring
      is gegeven zodanig zijn gewijzigd, dat deze niet zou zijn gegeven of niet zonder daarbij te bepalen dat aan de
      omgevingsvergunning daarbij aangegeven voorschriften worden verbonden, indien deze omstandigheden op het bedoelde
      tijdstip zouden hebben bestaan.

      2 Onverminderd de [artikelen 2.31][ref3] en [2.33 van de Wet algemene bepalingen omgevingsrecht][ref4], kunnen
      gedeputeerde staten in een geval als bedoeld in [artikel 46b, tweede lid][ref5], de omgevingsvergunning intrekken
      of de voorschriften die aan de omgevingsvergunning zijn verbonden wijzigen, aanvullen of intrekken dan wel alsnog
      aan de omgevingsvergunning verbinden indien de omstandigheden sinds het tijdstip waarop de omgevingsvergunning is
      verleend, zodanig zijn gewijzigd dat deze niet zou zijn verleend of niet zonder daaraan te verbinden voorschriften,
      indien deze omstandigheden op het genoemde tijdstip zouden hebben bestaan.


