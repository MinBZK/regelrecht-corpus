  - number: 46b
    text: |-
      1 Een omgevingsvergunning die betrekking heeft op handelingen als bedoeld in [artikel 46, eerste lid][ref1], wordt
      niet verleend dan nadat het bestuursorgaan dat ten aanzien van de betrokken handelingen bevoegd is te beslissen op
      een aanvraag om een vergunning als bedoeld in [artikel 16, eerste lid][ref2], heeft verklaard dat het daartegen geen
      bedenkingen heeft als bedoeld in [artikel 2.27, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref3].

      2 Het eerste lid is niet van toepassing indien gedeputeerde staten zowel bevoegd gezag zijn
      om te beslissen op een aanvraag om een omgevingsvergunning als ten aanzien van de betrokken
      handelingen bevoegd zijn te beslissen op een aanvraag om een vergunning als bedoeld in
      [artikel 16, eerste lid][ref4]. In dit geval zijn [afdeling 3.4 van de Algemene wet bestuursrecht][ref5] en
      [paragraaf 3.3 van de Wet algemene bepalingen omgevingsrecht][ref6] van toepassing op de voorbereiding van de
      beschikking op een aanvraag om een omgevingsvergunning.

      3 De verklaring onderscheidenlijk, in het in het tweede lid bedoelde geval, de omgevingsvergunning kan slechts
      worden geweigerd indien de betrokken handelingen schade kunnen toebrengen aan de belangen, omschreven in
      [artikel 16, eerste lid][ref7]. Artikel 16, tweede lid, is van overeenkomstige toepassing met betrekking tot de
      verklaring onderscheidenlijk de omgevingsvergunning.


