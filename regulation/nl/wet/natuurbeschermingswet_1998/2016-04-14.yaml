  - number: 46a
    text: |-
      1 De aanvrager van een omgevingsvergunning draagt er zorg voor dat de aanvraag tevens betrekking heeft op de
      handelingen die voldoen aan de criteria, bedoeld in [artikel 46, eerste lid][ref1].

      2 Op een beschikking op een aanvraag om een omgevingsvergunning als bedoeld in het eerste lid zijn de
      [artikelen 4.2][ref2] en [4.3 van de Wet algemene bepalingen omgevingsrecht][ref3] van toepassing.

      3 Indien toepassing wordt gegeven aan [artikel 2.5 van de Wet algemene bepalingen omgevingsrecht][ref4], zijn
      het tweede lid en de [artikelen 46b][ref5] en [46c][ref6] van overeenkomstige toepassing op de beschikking met
      betrekking tot de eerste en tweede fase.


