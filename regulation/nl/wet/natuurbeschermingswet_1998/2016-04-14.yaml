  - number: 2a
    text: |-
      1 Indien een aanvraag van een vergunning als bedoeld in [artikel 16, eerste lid][ref1], betrekking heeft op een
      handeling die hoofdzakelijk gevolgen kan hebben voor een deel van een beschermd natuurmonument dat is gelegen
      binnen de grenzen van één provincie, beslissen gedeputeerde staten van de provincie waarin dat deel van het
      beschermd natuurmonument is gelegen over de aanvraag.

      2 Indien een aanvraag van een vergunning als bedoeld in [artikel 19d, eerste lid][ref2], betrekking heeft op een
      project dat of andere handeling die hoofdzakelijk gevolgen kan hebben voor een Natura 2000-gebied of gedeelte
      daarvan in één van de provincies, beslissen gedeputeerde staten van die provincie over de aanvraag. Artikel 2,
      zesde lid, is van overeenkomstige toepassing.

      3 Indien op het moment van het indienen van een aanvraag als bedoeld in [artikel 16, eerste lid][ref3], of
      [artikel 19d, eerste lid][ref4], redelijkerwijs niet of nog niet kan worden vastgesteld in welke provincie
      hoofdzakelijk de gevolgen zullen plaatsvinden van een handeling, onderscheidenlijk een project of andere handeling,
      nemen gedeputeerde staten van de provincie waarin het beschermd natuurmonument of het Natura 2000-gebied geheel of
      grotendeels is gelegen de aanvraag in behandeling en beslissen die gedeputeerde staten op de aanvraag.

      4 [Artikel 2, derde onderscheidenlijk vijfde lid][ref5], is van overeenkomstige toepassing op de besluiten, bedoeld
      in het eerste, tweede en derde lid.

      5 Indien een aanvraag van een vergunning als bedoeld in [artikel 19d, eerste lid][ref6], betrekking heeft op
      een project dat of andere handeling die uitsluitend gevolgen kan hebben voor een Natura 2000-gebied dat buiten
      Nederland is gelegen, beslissen gedeputeerde staten van de provincie waarin het project of de andere handeling
      wordt gerealiseerd, onderscheidenlijk verricht, op de aanvraag.


