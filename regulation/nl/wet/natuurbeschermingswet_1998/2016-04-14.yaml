  - number: 19b
    text: |-
      1 In afwijking van het bepaalde in [artikel 19a][ref1] wordt een beheerplan als bedoeld in dat artikel, voor een
      op grond van [artikel 10a, eerste lid][ref2], aangewezen gebied of een gebied dat voorlopig is aangewezen als
      bedoeld in [artikel 12, derde lid][ref3], dat geheel of ten dele wordt beheerd door of onder verantwoordelijkheid
      valt van Onze Minister of één van Onze andere Ministers, voor het geheel onderscheidenlijk het betreffende gedeelte
      vastgesteld door Onze Minister of door Onze andere Minister in overeenstemming met Onze Minister, en voor zover
      nodig na overleg met betrokken eigenaren, gebruikers en andere belanghebbenden.

      2 Een beheerplan als bedoeld in het eerste lid kan in voorkomende gevallen deel uit maken van een plan gericht
      op het beheer van een gebied als bedoeld in het eerste lid, dat al dan niet op grond van enig ander wettelijk
      voorschrift is vastgesteld.

      3 Beheerplannen worden niet vastgesteld dan na overleg met de besturen van provincies, gemeenten en waterschappen
      op het grondgebied waarvan die beheerplannen betrekking hebben.

      4 __REF000___________________________________________________________________________________________________________
      ___, zijn van overeenkomstige toepassing.


