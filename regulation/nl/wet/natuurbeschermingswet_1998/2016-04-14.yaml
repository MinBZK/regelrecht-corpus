      - id: ref1
        bwb_id: BWBR0002611
        artikel: '29'
  - number: 67a
    text: |-
      De [artikelen 19km][ref1], [19kn][ref2] en [19ko][ref3] zijn niet van toepassing op projecten, plannen en andere
      handelingen die stikstofdepositie op voor stikstof gevoelige habitats in een Natura 2000-gebied veroorzaken indien:

        - voor het project, plan of de andere handeling voor het tijdstip van inwerkingtreding van het programma een
      besluit als bedoeld in [artikel 19km, eerste lid][ref4], in voorbereiding is bij het desbetreffende bestuursorgaan;
        - de voor het nemen van het desbetreffende besluit beschikbare gegevens en bescheiden naar het oordeel van het
      desbetreffende bestuursorgaan voldoende zijn voor de beoordeling van de aanvraag of voor de voorbereiding van
      het desbetreffende besluit en bovendien, ingeval het besluit betrekking heeft op een project als bedoeld in
      [artikel 19f, eerste lid][ref5], een volledige passende beoordeling als bedoeld in dat artikellid is gemaakt, en
        - degene die het desbetreffende project zal realiseren, onderscheidenlijk de andere handeling zal verrichten,
      heeft een tijdige uitvoering verzekerd van de maatregelen die in het kader van de realisering van het project,
      onderscheidenlijk het verrichten van de andere handeling worden getroffen om te verzekeren dat de natuurlijke
      kenmerken van Natura 2000-gebied niet zullen worden aangetast als gevolg van het project, onderscheidenlijk om
      verslechteringen of significant verstorende effecten als gevolg van de andere handeling te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19km
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19kn
