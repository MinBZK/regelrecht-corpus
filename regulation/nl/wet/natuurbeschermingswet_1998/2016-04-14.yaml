  - number: '3'
    text: |-
      In dit hoofdstuk wordt verstaan onder Onze Ministers: Onze Minister tezamen met Onze Minister van Infrastructuur en
      Milieu voorzover het aangelegenheden betreft die tot zijn verantwoordelijkheid behoren.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel3
  - number: '4'
    text: |-
      Onze Ministers stellen ten minste eenmaal in de acht jaar een natuurbeleidsplan vast, dat met het oog op een
      duurzame instandhouding, herstel en ontwikkeling van de natuurlijke en landschappelijke waarden voor de korte,
      middellange en lange termijn richting geeft aan van rijkswege te nemen beslissingen.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel4
  - number: '5'
    text: |-
      1 Het natuurbeleidsplan bevat ten minste de hoofdlijnen van het beleid terzake van:

      a. de algemene natuur- en landschapswaarden;

      b. bescherming van de in het plan aangeduide gebieden en gebiedscategorieën waar sprake is van bijzondere natuur-
      en landschapswaarden;

      c. de in het plan aangegeven soorten dieren en planten waaraan bijzondere aandacht zal worden gegeven;

      d. voorlichting en onderzoek op het terrein van natuur en landschap;

      e. de internationale ontwikkelingen van het natuurbeleid.

      2 Het natuurbeleidsplan bevat een aanduiding van:

      a. de wijze waarop en de maatregelen waarmede voor de eerstvolgende periode van acht jaar uitvoering zal worden
      gegeven aan de hoofdlijnen van het beleid;

      b. de redelijkerwijze te verwachten financiële en economische gevolgen van het te voeren beleid.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel5
  - number: '6'
    text: |-
      1 In het plan geven Onze Ministers voorts aan in hoeverre het voorgenomen beleid inzake natuur en
      landschap is afgestemd op, dan wel leidt tot aanpassing van het nationale milieubeleid en het nationale
      waterbeleid en in hoeverre en binnen welke termijn zij voornemens zijn het nationaal milieubeleidsplan,
      bedoeld in [artikel 4.3 van de Wet milieubeheer][ref1], en het nationale waterplan, bedoeld in
      [artikel 4.1 van de Waterwet][ref2], te herzien.

      2 Met het geldende natuurbeleidsplan wordt tevens rekening gehouden bij de vaststelling van rijksbeleid op andere
      terreinen van beleid dan bedoeld in het eerste lid, voorzover daarbij het belang van duurzame instandhouding,
      herstel en ontwikkeling van natuurlijke en landschappelijke waarden wordt geraakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4.3'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '4.1'
  - number: '7'
    text: |-
      1 Onze Ministers betrekken bij de voorbereiding van het natuurbeleidsplan de naar hun oordeel bij de te behandelen
      onderwerpen meest belanghebbende bestuursorganen, instellingen en organisaties. Daartoe behoren in elk geval
      gedeputeerde staten van de provincies.

      2 Op de voorbereiding van het nationale natuurbeleidsplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      van toepassing. Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '8'
    text: |-
      1 Het plan geldt voor een tijdvak van acht jaar, nadat het is vastgesteld, behoudens ingeval in dat tijdvak een
      nieuw plan is vastgesteld.

      2 Na het verstrijken van de eerste vier jaar van de geldingsduur kan naar aanleiding van een beoordeling
      van de in die periode opgedane ervaringen het plan door Onze Ministers worden aangepast met inachtneming van
      [artikel 7][ref1].

      3 Onze Ministers doen het plan alsmede een eventueel besluit tot aanpassing van dat plan toekomen aan de Staten-
      Generaal en aan gedeputeerde staten van de provincies.

      4 Onze Minister maakt de vaststelling van het plan en van aanpassingen daarvan bekend in de Staatscourant. Hierbij
      geeft hij aan op welke wijze kennis kan worden gekregen van de inhoud van het plan of de aanpassingen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel7
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel8
