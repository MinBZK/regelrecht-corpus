  - number: 19kh
    text: |-
      1 In een programma als bedoeld in [artikel 19kg][ref1] worden voor de betrokken Natura 2000-gebieden in elk geval
      beschreven of genoemd:

      a. de omvang van de stikstofdepositie aan het begin van het tijdvak van het programma, onderscheiden naar:

      1°. depositie, veroorzaakt door factoren in de gebieden;

      2°. depositie, veroorzaakt door factoren buiten de gebieden;

      b. de verwachte autonome ontwikkelingen ten aanzien van de stikstofemissie door de factoren, bedoeld in onderdeel
      a, en de effecten daarvan op de omvang van stikstofdepositie in de gebieden;

      c. de getroffen of te treffen maatregelen die bijdragen aan een vermindering van de stikstofdepositie, of die op
      een andere wijze bijdragen aan het bereiken van een goede staat van instandhouding van de voor stikstof gevoelige
      habitats, en de verwachte effecten van die maatregelen op de omvang van de depositie, onderscheidenlijk het
      bereiken van een goede staat van instandhouding in de gebieden;

      d. de sociaal-economische evaluatie en weging van haalbaarheid en betaalbaarheid van maatregelen als bedoeld in de
      onderdelen c en g;

      e. de doelstellingen ten aanzien van de omvang van de stikstofdepositie, al dan niet met tussendoelstellingen, of
      de indicatoren waaruit kan worden afgeleid of een doelstelling al dan niet is behaald welke noodzakelijk zijn met
      het oog op het bereiken van een gunstige staat van instandhouding;

      f. de wijze waarop en frequentie waarmee de rapportage plaatsvindt over de voortgang en uitvoering van de getroffen
      of te treffen in het programma beschreven en genoemde maatregelen en de effecten daarvan op de depositie;

      g. de getroffen of te treffen maatregelen ter verwezenlijking van de instandhoudingsdoelstellingen voor de voor
      stikstof gevoelige habitats in de Natura 2000-gebieden die in het programma zijn opgenomen;

      h. de resultaten van een beoordeling voor elk Natura 2000-gebied dat in het programma is opgenomen, in hoeverre
      de maatregelen, bedoeld in de onderdelen c en g, rekening houdend met de verwachte algemene ontwikkeling van de
      stikstofdepositie, in het bijzonder het totaal van de stikstofdeposities, bedoeld in het zevende en negende lid, en
      de ontwikkelingsruimte:

      1°. bijdragen aan de verwezenlijking van de instandhoudingsdoelstellingen voor de voor stikstof gevoelige habitats
      in het gebied;

      2°. voorkomen dat verslechtering optreedt van de kwaliteit van de natuurlijke habitats en de habitats van soorten
      in het gebied;

      3°. voorkomen dat storende factoren optreden voor de soorten waarvoor het gebied is aangewezen voor zover die
      factoren, gelet op de instandhoudingsdoelstellingen van het gebied, een significant effect kunnen hebben, en

      4°. de verwezenlijking van de instandhoudingsdoelstellingen van het gebied die geen betrekking hebben op voor
      stikstof gevoelige habitats, niet in gevaar brengen.

      2 In het programma kan onderscheid worden gemaakt tussen de depositie van ammoniak en andere stikstofverbindingen.

      3 Tot de maatregelen, bedoeld in het eerste lid, onderdelen c en g, behoren in elk geval:

      a. maatregelen van bestuursorganen van het Rijk;

      b. maatregelen voorzien in bindende besluiten van de Raad van de Europese Unie, van het Europees Parlement en de
      Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen;

      c. gebiedsgerichte of effectgerichte maatregelen van bestuursorganen van het Rijk, provincies, gemeenten, of
      waterschappen.

      4 In het programma worden de uitgangspunten opgenomen voor de bepaling van de ontwikkelingsruimte en voor de
      toedeling en reservering van ontwikkelingsruimte. In het programma wordt de op het tijdstip van vaststelling van
      het programma beschikbare ontwikkelingsruimte vermeld.

      5 Bij ministeriële regeling kan, overeenkomstig de uitgangspunten die in het programma zijn opgenomen op grond van
      het vierde lid, worden bepaald op welke wijze voor de Natura 2000-gebieden die in het programma zijn opgenomen de
      ontwikkelingsruimte wordt bepaald en ontwikkelingsruimte wordt toegedeeld en gereserveerd.

      6 In het programma kunnen projecten worden beschreven of genoemd waarvan op grond van een passende beoordeling
      de zekerheid is verkregen dat, mede in het licht van de ontwikkelingsruimte die ontstaat als gevolg van de
      maatregelen, bedoeld in het eerste lid, onderdelen c en g, en de autonome ontwikkelingen, bedoeld in het eerste
      lid, onderdeel b, de natuurlijke kenmerken van Natura 2000-gebieden niet zullen worden aangetast. Het verbod,
      bedoeld in [artikel 19d, eerste lid][ref2], is niet van toepassing op projecten als bedoeld in de eerste volzin.

      7 Het verbod, bedoeld in [artikel 19d, eerste lid][ref3], is met betrekking tot een Natura 2000-gebied niet van
      toepassing op een project of andere handeling dat voldoet aan elk van de volgende voorwaarden:

      a. het project of de handeling:

      1°. veroorzaakt een stikstofdepositie op voor stikstof gevoelige habitats in het Natura 2000-gebied die
      afzonderlijk en, ingeval het project of de handeling betrekking heeft op een inrichting als bedoeld in
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref4], in cumulatie met andere projecten of handelingen met
      betrekking tot dezelfde inrichting in de periode waarvoor het programma geldt, niet een waarde die is vastgesteld
      bij algemene maatregel van bestuur overschrijdt, of,

      2°. behoort tot een bij algemene maatregel van bestuur aangewezen categorie van projecten of handelingen en wordt
      gerealiseerd, onderscheidenlijk verricht op een grotere afstand gerekend tot het Natura 2000-gebied dan voor de
      desbetreffende categorie van projecten of handelingen bij die maatregel is vastgesteld;

      b. het project of de handeling kan voor het desbetreffende Natura 2000-gebied geen andere gevolgen veroorzaken dan
      stikstofdepositie die, gelet op de instandhoudingsdoelstellingen, de kwaliteit van de natuurlijke habitats en de
      habitats van soorten in een Natura 2000-gebied kunnen verslechteren of een significant verstorend effect kunnen
      hebben op de soorten waarvoor het gebied is aangewezen.

      8 De waarde, onderscheidenlijk de afstand, bedoeld in het zevende lid, onderdeel a, kan voor de onderscheiden
      Natura 2000-gebieden verschillend worden vastgesteld. De waarde, onderscheidenlijk de afstand wordt zodanig
      vastgesteld dat:

      1°. geen afbreuk wordt gedaan aan het oogmerk, bedoeld in [artikel 19kg, tweede lid][ref5], en

      2°. op voorhand op grond van objectieve gegevens kan worden uitgesloten dat projecten of andere handelingen als
      bedoeld in het zevende lid afzonderlijk of in combinatie met andere plannen of projecten de natuurlijke kenmerken
      van een Natura 2000-gebied zullen aantasten.

      9 Bij het nemen van een besluit als bedoeld in [artikel 19km, eerste lid][ref6], betrekt het bevoegd gezag niet
      de stikstofdepositie die het project of de andere handeling veroorzaakt op voor stikstof gevoelige habitats in
      een Natura 2000-gebied, indien de stikstofdepositie de in het zevende lid, onderdeel a, bedoelde waarde niet
      overschrijdt, onderscheidenlijk indien het project of de handeling wordt gerealiseerd, onderscheidenlijk verricht
      op een grotere afstand dan de op grond van het zevende lid, onderdeel a, vastgestelde afstand.

      10 De voordracht voor een krachtens het zevende lid, onderdeel a, vast te stellen algemene maatregel van bestuur
      wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


