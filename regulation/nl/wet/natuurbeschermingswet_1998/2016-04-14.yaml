  - number: 19db
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op een ontwikkelingsgebied als bedoeld in
      [artikel 2.3 van de Crisis- en herstelwet][ref1], kan de voorwaarden, voorschriften en beperkingen bevatten
      waaronder een vergunning als bedoeld in [artikel 19d, eerste lid][ref2], wordt verleend, indien op grond van een
      voor dat plan opgestelde passende beoordeling de zekerheid is verkregen dat projecten die aan deze voorwaarden,
      voorschriften en beperkingen voldoen de natuurlijke kenmerken van Natura 2000-gebieden niet kunnen aantasten, dan
      wel is voldaan aan de [artikelen 19g, tweede, derde en vierde lid][ref3], en [19h][ref4], onderscheidenlijk op
      grond van [artikel 19e][ref5] een beoordeling is uitgevoerd van andere handelingen.

      2 Het bestuursorgaan dat bevoegd is voor de verlening van vergunningen als bedoeld in
      [artikel 19d, eerste lid][ref6], voor projecten of andere handelingen in een ontwikkelingsgebied, kan voorafgaand
      aan de vaststelling van een daarop betrekking hebbend bestemmingsplan instemming verlenen aan de in het eerste lid
      genoemde voorwaarden, voorschriften en beperkingen.

      3 Een vergunning als bedoeld in [artikel 19d, eerste lid][ref7], wordt verleend indien:

      a. het project of de andere handeling voldoet aan de voorwaarden, opgenomen in een plan als bedoeld in het eerste
      lid, en

      b. de beoordelingen, genoemd in het eerste lid, op het moment van de verlening van de vergunning actueel zijn, en

      c. het bestuursorgaan dat bevoegd is voor de verlening van de vergunning instemt, of voorafgaand aan de
      vaststelling van het in het eerste lid genoemde plan heeft ingestemd met de in het eerste lid genoemde voorwaarden,
      voorschriften en beperkingen.

      4 Aan een vergunning als bedoeld in het derde lid worden de in het bestemmingsplan op grond van het eerste lid
      opgenomen voorschriften verbonden. Zij wordt onder de in het bestemmingsplan op grond van het eerste lid opgenomen
      beperkingen verleend.


