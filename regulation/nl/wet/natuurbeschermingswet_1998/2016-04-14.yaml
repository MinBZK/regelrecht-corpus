  - number: 47b
    text: |-
      1 Een omgevingsvergunning die betrekking heeft op handelingen als bedoeld in
      [artikel 47, eerste lid][ref1], wordt niet verleend dan nadat het bestuursorgaan dat ten aanzien van
      de betrokken handelingen bevoegd is te beslissen op een aanvraag om een vergunning als bedoeld in
      [artikel 19d, eerste lid][ref2], heeft verklaard dat het daartegen geen bedenkingen heeft als bedoeld in
      [artikel 2.27, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref3].

      2 Het eerste lid is niet van toepassing indien gedeputeerde staten zowel bevoegd gezag zijn
      om te beslissen op een aanvraag om een omgevingsvergunning als ten aanzien van de betrokken
      handelingen bevoegd zijn te beslissen op een aanvraag om een vergunning als bedoeld in
      [artikel 19d, eerste lid][ref4]. In dit geval zijn [afdeling 3.4 van de Algemene wet bestuursrecht][ref5] en
      [paragraaf 3.3 van de Wet algemene bepalingen omgevingsrecht][ref6] van toepassing op de voorbereiding van de
      beschikking op een aanvraag om een omgevingsvergunning.

      3 Met betrekking tot de verklaring onderscheidenlijk, in het in het tweede lid bedoelde geval, de beschikking op
      de aanvraag voor zover deze betrekking heeft op handelingen als bedoeld in [artikel 47a, eerste lid][ref7], zijn de
      [artikelen 19e tot en met 19g][ref8], [19ia][ref9], [19k, eerste en derde lid][ref10], [19kh, negende lid][ref11],
      en [19km, derde en vierde lid][ref12] en het bepaalde krachtens [artikel 19kb][ref13], van overeenkomstige
      toepassing. De verklaring geeft in voorkomend geval aan welke ontwikkelingsruimte overeenkomstig artikel 19km bij
      de omgevingsvergunning wordt toegedeeld.

      4 Indien een omgevingsvergunning om dwingende redenen van groot openbaar belang wordt verleend voor het realiseren
      van projecten als bedoeld in [artikel 19h, eerste lid][ref14], bepaalt het bestuursorgaan dat de verklaring
      geeft, dat aan de omgevingsvergunning in ieder geval het voorschrift wordt verbonden inhoudende de verplichting
      compenserende maatregelen te treffen. In het in het tweede lid bedoelde geval verbindt het bevoegd gezag dit
      voorschrift aan de omgevingsvergunning.

      5 Met betrekking tot de compenserende maatregelen is [artikel 19h, tweede tot en met vijfde lid][ref15],
      van toepassing, met dien verstande dat in het in het eerste lid bedoelde geval de krachtens
      [artikel 19h, tweede lid][ref16], gestelde verplichting geldt voor het bestuursorgaan dat de verklaring geeft.

      6 [Artikel 19k, eerste lid][ref17], is voor zover het betreft de in dat lid gestelde verplichting met betrekking
      tot het in kennis stellen van Onze Minister en de in dat lid gestelde verplichting met betrekking tot het zenden
      van een afschrift van vergunningen van overeenkomstige toepassing, met dien verstande dat deze verplichtingen
      in het in het eerste lid bedoelde geval gelden voor het bestuursorgaan dat de verklaring geeft en niet gelden in
      gevallen dat Onze Minister de verklaring geeft.


