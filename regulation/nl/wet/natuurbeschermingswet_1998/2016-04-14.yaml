  - number: '39'
    text: |-
      1 De werking van een besluit als bedoeld in [artikel 15, eerste lid][ref1], wordt geschorst totdat de
      beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.

      2 Een beroep tegen de vaststelling van een beheerplan als bedoeld in [artikel 19a][ref2] heeft uitsluitend
      betrekking op de beschrijvingen van handelingen die het bereiken van de instandhoudingsdoelstelling niet in gevaar
      brengen, en de daarbij in voorkomend geval aangegeven voorwaarden en beperkingen.

      3 Een beroep tegen de vaststelling van een programma als bedoeld in [artikel 19kg, eerste lid][ref3],
      heeft uitsluitend betrekking op de beschrijving of vermelding van projecten als bedoeld in
      [artikel 19kh, zesde lid][ref4].


