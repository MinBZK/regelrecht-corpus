  - number: 19kl
    text: |-
      1 Onze Minister en Onze Minister van Infrastructuur en Milieu stellen uiterlijk vier maanden na inwerkingtreding
      van de [Crisis- en herstelwet][ref1] een voorlopig programma vast ter vermindering van de stikstofdepositie.

      2 In het voorlopige programma, bedoeld in het eerste lid, worden in elk geval beschreven of genoemd de maatregelen
      en effecten, bedoeld in [artikel 19kh, eerste lid, onderdeel c][ref2], in samenhang met het derde lid, onderdeel a.

      3 Het voorlopige programma vervalt op het moment dat een eerste programma als bedoeld in
      [artikel 19kg, eerste lid][ref3], wordt vastgesteld.

      4 De [artikelen 19kh, eerste lid, onderdeel f][ref4], [19ki][ref5] en [19kj][ref6] zijn van overeenkomstige
      toepassing.


