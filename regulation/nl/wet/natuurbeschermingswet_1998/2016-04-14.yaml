  - number: 19a
    text: |-
      1 Gedeputeerde staten stellen, na overleg met de eigenaars, gebruikers en andere belanghebbenden, voor een op grond
      van [artikel 10a, eerste lid][ref1], aangewezen gebied of een op grond van [artikel 12, derde lid][ref2], voorlopig
      aangewezen gebied een beheerplan vast waarin met inachtneming van de instandhoudingsdoelstelling, met uitzondering
      van de doelstellingen, bedoeld in artikel 10a, derde lid, wordt beschreven welke instandhoudingsmaatregelen
      getroffen dienen te worden en op welke wijze. Tevens kan het beheerplan beschrijven welke handelingen en
      ontwikkelingen in het gebied en daarbuiten, in voorkomend geval onder nader in het beheerplan aangegeven
      voorwaarden en beperkingen, het bereiken van de instandhoudingsdoelstelling niet in gevaar brengen, mede gelet
      op de instandhoudingsmaatregelen die worden getroffen. Het beheerplan kan zulks ook doen ten aanzien van bij of
      krachtens algemene maatregel van bestuur aangewezen categorieën projecten en andere handelingen van nationaal
      belang in het gebied en daarbuiten.

      2 Een beheerplan als bedoeld in het eerste lid wordt vastgesteld voor een tijdvak van ten hoogste zes jaren. Een
      beheerplan kan telkenmale voor een gelijk tijdvak worden verlengd.

      3 Tot de inhoud van een beheerplan behoren ten minste:

      a. een beschrijving van de beoogde resultaten met het oog op het behoud of herstel van natuurlijke habitats en
      populaties van wilde dier- en plantensoorten overeenkomstig de instandhoudingsdoelstelling voor het aangewezen
      gebied mede in samenhang met het bestaande gebruik in dat gebied en, voor zover relevant voor het bereiken van de
      instandhoudingsdoelstelling, daarbuiten;

      b. een overzicht op hoofdlijnen van de in de door het plan bestreken periode noodzakelijke maatregelen met het oog
      op de onder a bedoelde resultaten.

      4 Bij de noodzakelijke maatregelen, bedoeld in het derde lid, onderdeel b, wordt rekening gehouden met vereisten op
      economisch, sociaal en cultureel gebied, alsmede met regionale en lokale bijzonderheden.

      5 Op de voorbereiding van een beheerplan als bedoeld in het eerste lid is de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] geregelde procedure van toepassing.

      6 Beheerplannen worden niet vastgesteld dan na overleg met de besturen van gemeenten en waterschappen op het
      grondgebied waarvan die beheerplannen betrekking hebben.

      7 Een beheerplan als bedoeld in het eerste lid wordt uiterlijk drie jaar na dagtekening van het in
      [artikel 10a, eerste lid][ref4], genoemde besluit voor het eerst vastgesteld.

      8 Indien een gebied voorlopig is aangewezen op grond van [artikel 12, derde lid][ref5], wordt in afwijking van het
      zevende lid, een beheerplan als bedoeld in het eerste lid uiterlijk drie jaar na dagtekening van het besluit tot
      voorlopige aanwijzing voor het eerst vastgesteld.

      9 Gedeputeerde staten kunnen in het beheerplan beschrijvingen als bedoeld in het eerste lid opnemen die betrekking
      hebben op de doelstellingen, bedoeld in [artikel 10a, derde lid][ref6].

      10 Voor zover er in een beheerplan projecten worden opgenomen die niet direct verband houden met of nodig zijn
      voor het beheer van een Natura 2000-gebied maar die afzonderlijk of in combinatie met andere plannen of projecten
      significante gevolgen kunnen hebben voor het desbetreffende gebied, wordt het beheerplan eerst vastgesteld nadat
      gedeputeerde staten een passende beoordeling hebben gemaakt van de gevolgen voor het gebied, waarbij rekening
      wordt gehouden met de instandhoudingsdoelstelling van dat gebied, en is voldaan aan de voorwaarden, genoemd in de
      [artikelen 19g][ref7] en [19h][ref8].


