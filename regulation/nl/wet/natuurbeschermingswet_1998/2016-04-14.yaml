      aan de omgevingsvergunning verbinden indien de omstandigheden sinds het tijdstip waarop de omgevingsvergunning is
      verleend, zodanig zijn gewijzigd dat deze niet zou zijn verleend of niet zonder daaraan te verbinden voorschriften,
      indien deze omstandigheden op het genoemde tijdstip zouden hebben bestaan.


