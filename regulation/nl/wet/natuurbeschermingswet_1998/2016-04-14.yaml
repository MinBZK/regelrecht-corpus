  - number: 19c
    text: |-
      1 Het bevoegd gezag draagt ervoor zorg dat passende maatregelen worden genomen om te voorkomen dat bestaand gebruik
      de kwaliteit van de natuurlijke habitats en de habitats van soorten in een Natura 2000-gebied verslechtert en dat
      er door bestaand gebruik storende factoren optreden die gelet op de instandhoudingsdoelstellingen een significant
      effect kunnen hebben op de soorten waarvoor het gebied is aangewezen.

      2 Ter uitvoering van het eerste lid kan het bevoegd gezag degene die bestaand gebruik uitoefent waardoor de
      kwaliteit van de natuurlijke habitats en de habitats van soorten in een Natura 2000-gebied kan verslechteren of
      waardoor er storende factoren optreden die gelet op de instandhoudingsdoelstellingen een significant effect kunnen
      hebben op de soorten waarvoor het gebied is aangewezen:

      a. verplichten binnen een door het bevoegd gezag te stellen termijn informatie te verstrekken over het gebruik;

      b. verplichten binnen een door het bevoegd gezag te stellen termijn en met inachtneming van door het bevoegd gezag
      te geven instructies de nodige preventieve of herstelmaatregelen te treffen; of

      c. verplichten dat gebruik binnen een door het bevoegd gezag te stellen termijn te staken of te beperken.

      3 Het bevoegd gezag stelt belanghebbenden in de gelegenheid hun zienswijze uit te brengen over een voornemen
      tot het opleggen van een verplichting als bedoeld in het tweede lid, tenzij de verslechtering of verstoring het
      opleggen van een verplichting terstond noodzakelijk maakt.

      4 Het is verboden te handelen in strijd met een verplichting als bedoeld in het tweede lid.

      5 Onder «bevoegd gezag» als bedoeld in het eerste, tweede en derde lid, wordt verstaan:

      a. Onze Minister, indien:

      1°. voor het desbetreffende Natura 2000-gebied geen onherroepelijk geworden beheerplan als bedoeld in de
      [artikelen 19a][ref1] of [19b][ref2] is vastgesteld, of

      2°. het gebruik een krachtens [artikel 19d, vijfde lid][ref3], aangewezen project of andere handeling is, of het
      gebruik plaatsvindt in of gevolgen heeft voor categorieën van gebieden die krachtens dat lid zijn aangewezen;

      b. gedeputeerde staten, in andere gevallen dan die, bedoeld in onderdeel a.

      6 Het eerste tot en met het vijfde lid zijn niet van toepassing op bestaand gebruik dat overeenkomstig een
      beheerplan als bedoeld in de [artikelen 19a][ref4] of [19b][ref5] wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19a
