  - number: '2'
    text: |-
      1 Voorzover niet anders bepaald, wordt onder gedeputeerde staten verstaan gedeputeerde staten van de
      provincie waarin Natura 2000-gebieden of natuurmonumenten of landschapsgezichten onderscheidenlijk beschermde
      natuurmonumenten of beschermde landschapsgezichten geheel of grotendeels zijn gelegen.

      2 Gedeputeerde staten wijzen landschapsgezichten, die mede zijn gelegen in een andere provincie, niet aan als
      beschermd landschapsgezicht dan in overeenstemming met gedeputeerde staten van die andere provincies.

      3 Gedeputeerde staten beslissen niet op een aanvraag van een vergunning als bedoeld in [artikel 16][ref1] dan wel
      stellen een beheerplan als bedoeld in [artikel 17][ref2] niet vast, dan in overeenstemming met gedeputeerde staten
      van de andere provincies waarin het beschermd natuurmonument mede is gelegen.

      4 Gedeputeerde staten stellen een beheerplan als bedoeld in [artikel 19a][ref3] niet vast dan in overeenstemming
      met gedeputeerde staten van de andere provincies waarin het Natura 2000-gebied mede is gelegen.

      5 Gedeputeerde staten beslissen niet op een aanvraag voor een vergunning als bedoeld in
      [artikel 19d, eerste lid][ref4], dan in overeenstemming met gedeputeerde staten van de andere provincies waarin
      Natura 2000-gebieden, of delen daarvan, zijn gelegen waarvoor het project of de andere handeling waarvoor
      vergunning wordt verleend gevolgen kan hebben.

      6 Bij een besluit op een aanvraag voor een vergunning als bedoeld in [artikel 19d, eerste lid][ref5], betrekken
      gedeputeerde staten tevens de gevolgen die het project of de andere handeling kan hebben voor een in een andere
      provincie of een buiten Nederland gelegen Natura 2000-gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel16
