  - number: 60a
    text: |-
      1 Besluiten die zijn genomen op grond van [artikel 12 van de Natuurbeschermingswet][ref1] voor projecten of
      andere handelingen als bedoeld in [artikel 19d, eerste lid][ref2], gelden ter zake van een Natura 2000-gebied als
      besluiten die zijn genomen op grond van artikel 19d.

      2 Besluiten die zijn genomen op grond van [artikel 16, tweede lid, onderdeel c, van de Natuurbeschermingswet][ref3]
      gelden als besluiten die zijn genomen op grond van [artikel 16][ref4] of [artikel 19d][ref5] van deze wet.

      3 Het eerste en het tweede lid gelden niet met betrekking tot de toepassing van [artikel 31][ref6] van deze wet.

      4 De besluiten van Onze Minister houdende de aanwijzing van gebieden ter uitvoering van richtlijn 2009/147/EG
      gelden als besluiten als bedoeld in [artikel 10a][ref7].

      5 Voor zover een beschermd natuurmonument als bedoeld in [artikel 10][ref8] geheel of gedeeltelijk deel uitmaakt
      van een gebied als bedoeld in het vierde lid, vervalt in afwijking van [artikel 15a, tweede lid][ref9], een besluit
      houdende de aanwijzing van dat beschermde natuurmonument geheel of gedeeltelijk met ingang van 1 oktober 2005.
      Artikel 15a, derde lid, is van overeenkomstige toepassing.

      6 Op besluiten, waarbij artikel 6 van de richtlijn 92/43/EEG aan de orde is, op voor 1 oktober 2005 ingediende
      aanvragen om vergunning of ontheffing en ingediende verzoeken om toestemming anderszins blijft deze wet buiten
      toepassing, totdat de bezwaar- of beroepstermijn is verstreken dan wel, indien beroep is ingesteld, onherroepelijk
      op het beroep is beslist.

      7 Een beheerplan dat is vastgesteld op grond van [artikel 14 van de Natuurbeschermingswet][ref10], behoudt zijn
      gelding gedurende de periode waarvoor het plan is aangegaan.

      8 Een beheerplan als bedoeld in [artikel 19a][ref11] voor een gebied dat ter uitvoering van richtlijn 2009/147/EG
      voor 1 oktober 2005 is aangewezen, wordt uiterlijk drie jaar na het vaststellen van de instandhoudingsdoelstelling
      voor het gebied voor het eerst vastgesteld.

      9 Besluiten die zijn genomen op basis van [artikel 19d, derde lid][ref12], (oud) gelden als besluiten die zijn
      genomen op basis van artikel 19d, vierde lid (nieuw).

      10 [Artikel 19d][ref13] is niet van toepassing op handelingen in de exclusieve economische zone waarvoor op grond
      van andere wetten en met inachtneming van artikel 6, derde en vierde lid, van richtlijn 92/43/EEG, een vergunning
      is of zal worden verleend.

      11 [Artikel 19d][ref14] is niet van toepassing op handelingen waarvoor een aanvraag tot wijziging van de in het
      tiende lid bedoelde vergunning is of wordt aangevraagd en deze vergunning met inachtneming van artikel 6, derde
      en vierde lid, van richtlijn 92/42/EEG, zal worden gewijzigd, dan wel ambtshalve een besluit tot wijziging van die
      vergunning met inachtneming van de voornoemde richtlijnbepaling is of zal worden vastgesteld.

      12 De vergunning, bedoeld in het tiende en elfde lid, kan door het bevoegde gezag dat de vergunning heeft verleend,
      worden gewijzigd of ingetrokken in de gevallen, bedoeld in [artikel 43, tweede lid][ref15], in het bijzonder indien
      dit noodzakelijk is om de instandhoudingsdoelstelling voor het desbetreffende Natura 2000-gebied te realiseren.


