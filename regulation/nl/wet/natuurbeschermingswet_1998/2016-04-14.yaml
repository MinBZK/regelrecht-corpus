  - number: '19'
    text: |-
      1 Gedeputeerde staten kunnen een vastgesteld beheerplan in overeenstemming met de eigenaar en de gebruiker
      wijzigen.

      2 [Artikel 17, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel17
