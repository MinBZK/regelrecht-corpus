      1 Van een besluit tot voorlopige aanwijzing als bedoeld in [artikel 12][ref1] wordt mededeling gedaan aan de
      eigenaren en hypothecaire schuldeisers.

      2 Onze Minister maakt een besluit tot voorlopige aanwijzing als bedoeld in [artikel 12][ref2], bekend in de
      Staatscourant.

      3 Indien Onze Minister niet tot aanwijzing als beschermd natuurmonument of als gebied als bedoeld in
      [artikel 10a, eerste lid][ref3], overgaat, maakt hij dit bekend en doet daarvan mededeling overeenkomstig het
      eerste en tweede lid en de [artikelen 3:42][ref4] en [3:43 van de Algemene wet bestuursrecht][ref5].


