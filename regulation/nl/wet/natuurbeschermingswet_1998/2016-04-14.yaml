  - number: 19kq
    text: |-
      1 Een ministeriële regeling als bedoeld in [artikel 19kh, vijfde of zevende lid][ref1], [19kk][ref2],
      [19kn, eerste of vierde lid][ref3], [19ko, vijfde lid][ref4], of [19koa, eerste lid][ref5], wordt vastgesteld door
      de Minister van Economische Zaken en de Minister van Infrastructuur en Milieu.

      2 Een ministeriële regeling als bedoeld in [artikel 19kh, vijfde of zevende lid][ref6], [19kk][ref7],
      [19kn, vierde lid][ref8], [19ko, vijfde lid][ref9], of [19koa, eerste lid][ref10], wordt vastgesteld na overleg met
      de bestuursorganen, bedoeld in [artikel 19kg, derde lid][ref11].

      3 Een ministeriële regeling als bedoeld in artikel [19kn, eerste lid][ref12], wordt vastgesteld in overeenstemming
      met de bestuursorganen die het beheerplan, bedoeld in [artikel 19a][ref13] of [19b][ref14], vaststellen voor de
      in het programma opgenomen Natura 2000-gebieden waarin de stikstofdepositie die de in artikel 19kn, eerste lid,
      bedoelde projecten of andere handelingen veroorzaken hoofdzakelijk plaatsvindt.


