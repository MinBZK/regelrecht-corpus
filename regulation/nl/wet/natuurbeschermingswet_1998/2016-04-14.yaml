  - number: 19kha
    text: |-
      In het programma wordt, ter uitvoering van [artikel 19kh, eerste lid, onderdeel f][ref1], in elk geval beschreven
      dat drie jaar nadat het programma is vastgesteld, Onze Minister en Onze Minister van Infrastructuur en Milieu, na
      overleg met de bestuursorganen, bedoeld in [artikel 19kg, derde lid][ref2], de ontwikkelingsruimte inzichtelijk
      maken die:

      a. de tweede helft van het programma beschikbaar zal zijn;

      b. naar verwachting in het daarop volgende programma beschikbaar zal zijn, in het bijzonder in de eerste helft van
      het tijdvak van dat programma.


