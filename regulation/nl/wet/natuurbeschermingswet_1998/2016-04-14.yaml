  - number: 19kc
    text: |-
      1 Bij ministeriële regeling kan aan degenen die bepaalde handelingen met, gelet op de instandhoudingsdoelstelling,
      mogelijk nadelige gevolgen voor een bij die regeling aangewezen Natura 2000-gebied of onderdeel daarvan,
      verrichten, laten verrichten, of daartoe het voornemen hebben, een verplichting worden opgelegd tot het melden van
      die handeling.

      2 In de ministeriële regeling, bedoeld in het eerste lid, wordt geregeld aan welk bestuursorgaan de melding wordt
      gericht, en kunnen verder regels worden gesteld over onder meer:

      a. de termijn waarbinnen de melding wordt gedaan;

      b. de gegevens die bij de melding worden verstrekt;

      c. de wijze waarop de gegevens worden verstrekt.

      3 Het eerste lid is niet van toepassing op handelingen waarop [artikel 19d, eerste of tweede lid][ref1], van
      toepassing is, en op handelingen in de exclusieve economische zone en op handelingen met betrekking tot wegen,
      vaarwegen, spoorwegen, waterkeringen, havens, luchthavens en luchtvaart, inclusief het gebruik daarvan.

      4 Het is verboden in strijd te handelen met een verplichting als het bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel19kc
