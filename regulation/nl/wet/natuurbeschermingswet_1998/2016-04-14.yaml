  - number: '42'
    text: |-
      1 Op de vergunningaanvraag wordt binnen dertien weken na de datum van ontvangst beslist.

      2 Het orgaan dat tot verlening van de vergunning bevoegd is, kan de termijn eenmaal met dertien weken verlengen.
      Van zodanige verlenging wordt mededeling gedaan aan de aanvrager en aan burgemeester en wethouders als bedoeld
      in [artikel 44][ref1].

      3 Van een besluit tot verlening, wijziging of intrekking van de vergunningen als bedoeld in de [artikelen 16][ref2]
      en [19d][ref3] wordt door het orgaan dat tot verlening van de vergunning bevoegd is kennis gegeven in een of meer
      dag-, nieuws-, of huis-aan-huisbladen of op andere geschikte wijze. Volstaan kan worden met vermelding van de
      zakelijke inhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
