  - number: 19e
    text: |-
      Gedeputeerde staten houden bij het verlenen van een vergunning als bedoeld in [artikel 19d, eerste lid][ref1],
      rekening

      a. met de gevolgen die een project of andere handeling, waarop de vergunningaanvraag betrekking heeft, gelet op de
      instandhoudingsdoelstelling, met uitzondering van de doelstellingen, bedoeld in [artikel 10a, derde lid][ref2], kan
      hebben voor een Natura 2000-gebied;

      b. met een op grond van [artikel 19a][ref3] of [artikel 19b][ref4] vastgesteld beheerplan, en

      c. vereisten op economisch, sociaal en cultureel gebied, alsmede regionale en lokale bijzonderheden.


