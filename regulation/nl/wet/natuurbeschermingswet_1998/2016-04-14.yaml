  - number: '17'
    text: |-
      1 Gedeputeerde staten kunnen in overeenstemming met de eigenaar en de gebruiker voor een beschermd natuurmonument
      of een gedeelte daarvan een beheerplan vaststellen, dat het behoud, het herstel of de ontwikkeling van het
      natuurschoon of van de natuurwetenschappelijke betekenis van het natuurmonument ten doel heeft.

      2 Voorzover de kosten en lasten die voor de eigenaar en de gebruiker aan de uitvoering van het beheerplan zijn
      verbonden redelijkerwijze niet of niet geheel te hunnen laste behoren te komen, wordt in het beheerplan een door
      gedeputeerde staten te betalen subsidie vastgesteld.

      3 Gedeputeerde staten brengen het plan ter kennis van Onze Minister en van burgemeester en wethouders van de
      gemeenten waarin het beschermd natuurmonument of het gedeelte daarvan waarop het beheerplan betrekking heeft, is
      gelegen.

      4 De eigenaar en de gebruiker zijn verplicht zorg te dragen voor de naleving van het beheerplan, ieder voorzover
      dat uit de aard van zijn recht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel17
  - number: '18'
    text: |-
      1 Het beheerplan, bedoeld in [artikel 17][ref1], wordt vastgesteld voor een tijdvak van ten hoogste zes jaren.

      2 Het beheerplan wordt van rechtswege verlengd met een tijdvak gelijk aan het laatst verstreken tijdvak waarvoor
      het beheerplan werd vastgesteld.

      3 Verlenging vindt niet van rechtswege plaats wanneer gedeputeerde staten, de eigenaar of de gebruiker uiterlijk
      vier weken voor het einde van het geldend beheerplan schriftelijk te kennen heeft gegeven dat verlenging niet wordt
      verlangd.

      4 Gedeputeerde staten kunnen de kennisgeving slechts doen indien:

      a. de eigenaar of de gebruiker de uit het beheerplan voortvloeiende verplichtingen in het afgelopen tijdvak niet of
      niet op de juiste wijze is nagekomen;

      b. ongewijzigde verlenging van het beheerplan zou leiden tot een beheer dat naar hun oordeel het behoud, het
      herstel of de ontwikkeling van het natuurschoon of van de natuurwetenschappelijke betekenis van het natuurmonument
      onvoldoende waarborgt;

      c. een andere zwaarwichtige reden bestaat om niet tot verlenging van het beheerplan over te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel17
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel18
