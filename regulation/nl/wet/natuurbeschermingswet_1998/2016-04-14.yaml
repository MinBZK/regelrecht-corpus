  - number: '21'
    text: |-
      1 Indien ten gevolge van het achterwege blijven van maatregelen het natuurschoon of de natuurwetenschappelijke
      betekenis van het beschermd natuurmonument in ernstige mate vermindert of dreigt te verminderen, kunnen vanwege
      gedeputeerde staten in het beschermd natuurmonument maatregelen worden getroffen die noodzakelijk zijn om het
      natuurschoon of de natuurwetenschappelijke betekenis te herstellen of te behouden.

      2 De eigenaar en de gebruiker zijn verplicht het treffen van de maatregelen te gedogen.

      3 Gedeputeerde staten gaan niet over tot het treffen van de maatregelen dan nadat zij de eigenaar en gebruiker het
      voornemen daartoe schriftelijk hebben medegedeeld en, behoudens onverwijlde noodzaak, na de mededeling ten minste
      vier weken zijn verstreken.

      4 Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op een Natura 2000-gebied met dien verstande
      dat de noodzakelijke maatregelen worden getroffen, indien gelet op de instandhoudingsdoelstelling de kwaliteit van
      de natuurlijke habitats en de habitats van soorten in het aangewezen gebied verslechtert of indien er verstorende
      factoren optreden die een significant effect hebben op de soorten waarvoor het gebied is aangewezen, dan wel
      indien het beheerplan, bedoeld in [artikel19a][ref1], voorziet in het treffen van de maatregelen met het oog op de
      realisatie van de instandhoudingsdoelstelling voor het desbetreffende gebied. In het geval het gebied wordt beheerd
      door of onder verantwoordelijkheid van Onze Minister of een van Onze andere Ministers, worden zodanige maatregelen
      getroffen door Onze Minister onderscheidenlijk Onze andere Minister in overeenstemming met Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19a
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 19a
        hoofdstuk: III
        paragraaf: '2'
  - number: '22'
    text: |-
      1 Na overleg met de eigenaren en de gebruikers kunnen in een beschermd natuurmonument vanwege gedeputeerde staten
      de nodige kentekenen worden aangebracht om de aanwijzing als beschermd natuurmonument alsmede de rechtsgevolgen van
      de aanwijzing kenbaar te maken.

      2 De eigenaar en gebruiker zijn verplicht het aanbrengen van de kentekenen te gedogen.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op een Natura 2000-gebied.
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel22
  - number: 22a
    text: |-
      De [paragrafen 2][ref1] en [3][ref2] zijn niet van toepassing op activiteiten die onderwerp zijn van het
      gemeenschappelijk visserijbeleid, bedoeld in artikel 38 van het Verdrag betreffende de werking van de Europese
      Unie, voor zover zij plaatsvinden in de exclusieve economische zone.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0009641#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0009641/2016-04-14#Artikel22a
