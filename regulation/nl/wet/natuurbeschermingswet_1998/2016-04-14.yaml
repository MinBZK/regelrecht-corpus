  - number: 9d
    text: |-
      1 Onze Minister doet een rapport als bedoeld in [artikel 9a, eerste lid][ref1], toekomen aan de Staten-Generaal.

      2 Onze Minister doet een rapport als bedoeld in [artikel 9a, tweede lid][ref2], eveneens toekomen aan de Staten-
      Generaal, en wel gelijktijdig met de begroting.

      3 Het Planbureau voor de Leefomgeving draagt er zorg voor dat de rapporten algemeen verkrijgbaar worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel9a
