  - number: 19f
    text: |-
      1 Voor projecten waarover gedeputeerde staten een besluit op een aanvraag voor een vergunning als bedoeld in
      [artikel 19d, eerste lid][ref1], nemen, en die niet direct verband houden met of nodig zijn voor het beheer
      van een Natura 2000-gebied maar die afzonderlijk of in combinatie met andere projecten of plannen significante
      gevolgen kunnen hebben voor het desbetreffende gebied, maakt de initiatiefnemer alvorens gedeputeerde staten een
      besluit nemen, een passende beoordeling van de gevolgen voor het gebied waarbij rekening wordt gehouden met de
      instandhoudingsdoelstelling, met uitzondering van de doelstellingen, bedoeld in [artikel 10a, derde lid][ref2], van
      dat gebied.

      2 De passende beoordeling terzake van een besluit op een aanvraag voor een vergunning als bedoeld
      in [artikel 19d, eerste lid][ref3], kan onderdeel uitmaken van een voor dat project voorgeschreven
      milieueffectrapportage.

      3 De verplichting tot het maken van een passende beoordeling bij de voorbereiding van een besluit als bedoeld
      in het eerste lid, geldt niet in gevallen waarin degene die een project waarop dat besluit betrekking heeft,
      onderneemt, daarmee een project ten aanzien waarvan reeds eerder een passende beoordeling is gemaakt, herhaalt of
      voortzet, voorzover de passende beoordeling redelijkerwijs geen nieuwe gegevens en inzichten kan opleveren omtrent
      de significante gevolgen van dat project.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19d
