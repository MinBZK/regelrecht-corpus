  - number: 19ia
    text: |-
      1 Ingeval de instandhoudingsdoelstelling voor een Natura 2000-gebied mede betrekking heeft op doelstellingen als
      bedoeld in [artikel 10a, derde lid][ref1], is [artikel 16, eerste tot en met zesde lid][ref2], van overeenkomstige
      toepassing op handelingen die schadelijk kunnen zijn voor het natuurschoon, voor de natuurwetenschappelijke
      betekenis van het Natura 2000-gebied anders dan vereist ingevolge de richtlijnen, bedoeld in artikel 10a, tweede
      lid, of voor dieren en planten in dat gebied, of die het gebied ontsieren, met dien verstande dat:

      a. in het vierde lid in plaats van «het besluit tot aanwijzing als beschermd natuurmonument, bedoeld in
      [artikel 10][ref3]» wordt gelezen: het besluit tot aanwijzing, bedoeld in [artikel 10a][ref4];

      b. in het vijfde lid in plaats van «een beheerplan als bedoeld in [artikel 17][ref5]» wordt gelezen: de
      beschrijvingen in het desbetreffende beheerplan, bedoeld in [artikel 19a, negende lid][ref6];

      c. de krachtens het zesde lid aangewezen handelingen de krachtens [artikel 19d, vierde lid][ref7], aangewezen
      handelingen zijn.

      2 Ingeval het eerste lid van toepassing is, geldt een aanvraag van een vergunning als bedoeld in
      [artikel 19d, eerste lid][ref8], tevens als een aanvraag van een vergunning als bedoeld in het
      [artikel 16, eerste lid][ref9], in samenhang met het eerste lid.

      3 Ingeval een handeling als bedoeld in het eerste lid bestaand gebruik is waarop [artikel 19d, derde lid][ref10],
      van toepassing is, is in plaats van het verbod, bedoeld in [artikel 16, eerste lid][ref11], [artikel 19c][ref12]
      van overeenkomstige toepassing, met dien verstande dat de maatregelen, bedoeld in artikel 19c, eerste en tweede
      lid, tot doel hebben te voorkomen dat bestaand gebruik mogelijk nadelige gevolgen heeft voor het Natura 2000-
      gebied, gelet op de doelstellingen, bedoeld in [artikel 10a, derde lid][ref13].

      4 [Artikel 65][ref14] is niet van overeenkomstige toepassing op handelingen als bedoeld in het eerste lid.


