$id: zuivelverordening_2011_nemen_transporteren_en_bewaren_van_monsters_boerderijmelk
regulatory_layer: WET
publication_date: '2014-12-24'
valid_from: '2011-12-31'
bwb_id: BWBR0031241
url: https://wetten.overheid.nl/BWBR0031241/2011-12-31
preamble:
  text: |-
    Gelet op artikel 93 van de Wet op de bedrijfsorganisatie, artikel 5 van het Instellingsbesluit Productschap Zuivel,
    alsmede op artikel 6 van Zuivelverordening 2005, Grondslag uitbetaling boerderijmelk en van Zuivelverordening 2010,
    Grondslag uitbetaling geitenmelk;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt gebezigd de terminologie van de
      [Zuivelverordening 2005, Grondslag uitbetaling boerderijmelk][ref1] en
      [Zuivelverordening 2010, Grondslag uitbetaling geitenmelk][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018024
      [ref2]: https://wetten.overheid.nl/BWBR0029878
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018024
      - id: ref2
        bwb_id: BWBR0029878
  - number: '2'
    text: |-
      De ontvanger van boerderijmelk neemt ten aanzien van het nemen, transporteren en bewaren van monsters boerderijmelk
      de navolgende bepalingen in acht.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel2
  - number: '3.1'
    text: |-
      Elke door een melkveehouder aan een ontvanger van boerderijmelk te leveren hoeveelheid tankmelk wordt bemonsterd,
      en wel op een zodanige wijze, dat het daardoor verkregen monster kan worden bestemd voor het verrichten van het
      kwaliteitsonderzoek. De voorzitter kan, gehoord het COKZ, in bijzondere omstandigheden ontheffing van deze bepaling
      verlenen onder nader te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel3
  - number: '3.2'
    text: De monsterneming heeft plaats uit de tank waarin de boerderijmelk wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel3
  - number: '3.3'
    text: De monsters boerderijmelk zijn duidelijk gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel3
  - number: '3.4'
    text: |-
      De chauffeur-monsternemer draagt er zorg voor dat de op de monsters betrekking hebbende bijzonderheden omtrent de
      naam van de chauffeur-monsternemer, herkomst van de monsters, datum en tijdstip van de bemonstering, het tijdstip
      van het plaatsen van de monsters in de gekoelde ruimte van de ontvanger van boerderijmelk e.d., tezamen met de
      nummers van de monsters ordelijk worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel3
  - number: '4.1'
    text: |-
      De monsters boerderijmelk hebben de gemiddelde samenstelling van de leverantie waarvan ze zijn genomen. De
      melkkoeltank is hiertoe voorzien van een intermitterend roerwerk, dat telkens, met een onderbreking van ten hoogste
      een half uur, de inhoud van de tank ten minste twee minuten roert en dat tevens voldoet aan de eisen neergelegd in
      NEN-ISO 5708 Melkkoeltanks voor boerderijen. De borging van het op een adequate wijze functioneren van het roerwerk
      vindt plaats door middel van een tankwacht voorzien van een visueel waarneembare alarmfunctie.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel4
  - number: '4.2'
    text: |-
      De chauffeur-monsternemer verifieert voorafgaand aan de monsterneming de tankwacht op het adequaat functioneren van
      het roerwerk.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel4
  - number: '4.3'
    text: |-
      Wanneer het roerwerk niet aantoonbaar goed heeft gefunctioneerd, zal de melk voorafgaand aan de monsterneming twee
      minuten worden geroerd.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel4
  - number: '4.4'
    text: Tankmelk welke de ontvanger van boerderijmelk weigert te ontvangen, behoeft niet te worden bemonsterd.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel4
  - number: '5.1'
    text: |-
      Het nemen van de tankmelkmonsters en het transport van die monsters naar de plaats van de ontvanger van
      boerderijmelk waar de tankmelk wordt gelost, wordt verzorgd door de chauffeur van de betreffende rijdende
      melkontvangst.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel5
  - number: '5.2'
    text: De chauffeur-monsternemer is ter zake kundig en beschikt hiertoe over een verklaring van het COKZ.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel5
  - number: '5.3'
    text: |-
      De chauffeur-monsternemer draagt kennis van een door of namens de ontvanger van boerderijmelk, in wiens opdracht de
      tankmelk wordt opgehaald, afgegeven schriftelijke instructie omtrent de uitvoering van zijn taak. Deze instructie
      bevat ten minste de in deze verordening vastgelegde bepalingen voor het nemen, transporteren en bewaren van
      monsters boerderijmelk.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel5
  - number: '5.4'
    text: |-
      Indien de chauffeur-monsternemer in de praktijk de betreffende voorschriften niet met zorg blijkt na te komen, kan
      het COKZ hem voor verdere monsterneming ongeschikt verklaren.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel5
  - number: '6.1'
    text: |-
      De ontvanger van boerderijmelk gebruikt alleen monsterflessen die door het melkcontrolestation ter beschikking
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel6
  - number: '6.2'
    text: |-
      De ontvanger van boerderijmelk draagt er zorg voor dat elke monsterfles en de sluiting daarvan die gebruikt wordt
      voor de monsterneming uit de melkkoeltank schoon, droog en inwendig nagenoeg vrij van kweekbare kiemen is. Na
      spoelen van de monsterfles met 5 ml gesteriliseerde melk mag het kiemgetal van deze melk 10 kiemen per ml niet
      overschrijden.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel6
  - number: '6.3'
    text: |-
      De ontvanger van boerderijmelk bewaart de lege monsterflessen na ontvangst ordelijk in een speciaal daarvoor
      bestemde, niet voor onbevoegden toegankelijke, koele, droge en schone ruimte.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel6
  - number: '7'
    text: |-
      Indien de monsters boerderijmelk handmatig worden genomen, worden de bepalingen in de [artikelen 8][ref1] en
      [9][ref2] in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0031241#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0031241#Artikel9
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0031241
        artikel: '8'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0031241
        artikel: '9'
        paragraaf: '4'
  - number: '8.1'
    text: |-
      Het handmatig nemen van de monsters tankmelk geschiedt onmiddellijk voorafgaande aan het moment van aflevering van
      de tankmelk aan de rijdende melkontvangst.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel8
  - number: '8.2'
    text: |-
      De ontvanger van boerderijmelk gebruikt uitsluitend een monsterlepel van roestvast staal, die naadloos is, een
      ronde bodem heeft of een bodem met afgeronde hoeken, een steel van voldoende lengte en een voor het onderzoek
      geschikte inhoud.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel8
  - number: '8.3'
    text: |-
      De monsterlepel is goed gereinigd, en wordt tijdens het vervoer bewaard in een houder met water waaraan een
      desinfectiemiddel is toegevoegd. Het bestuur kan bij besluit nadere regels stellen aan het desinfectiemiddel en het
      gebruik ervan. Het desinfectiemiddel wordt permanent op de in het besluit voorgeschreven concentratie gehouden en
      wordt dagelijks ververst.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel8
  - number: '8.4'
    text: De monsterneming geschiedt voordat de kraan van de melkkoeltank wordt geopend.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel8
  - number: '8.5'
    text: De monsterlepel wordt alleen aan de handgreep aangevat.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel8
  - number: '8.6'
    text: |-
      De monsterlepel wordt eerst tweemaal met de melk die wordt bemonsterd, omgespoeld en weer leeggegoten, alvorens
      65 ± 5 ml. melk in de monsterfles wordt geschept, die daarna direct wordt afgesloten met de bij de monsterfles
      behorende dop.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel8
  - number: '8.7'
    text: |-
      De monsterlepel wordt vervolgens met water van drinkwaterkwaliteit goed schoongespoeld, en daarna in de in lid 3,
      bedoelde houder geplaatst.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel8
  - number: '8.8'
    text: Tijdens het gebruik wordt de monsterlepel zodanig behandeld, dat hij niet kan worden verontreinigd.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel8
  - number: '9.1'
    text: |-
      Indien door de grootte van de melkkoeltank niet door middel van een monsterlepel een representatief monster
      kan worden genomen, wordt het monster genomen door middel van een daarvoor op de melkkoeltank gemonteerde
      monsternemingskraan.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel9
  - number: '9.2'
    text: |-
      De op de melkkoeltank geplaatste monsternemingskraan moet zodanig zijn gemonteerd dat de monsterneming op een
      deugdelijke en hygiënische wijze kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel9
  - number: '9.3'
    text: |-
      Voordat monsterneming door middel van monsternemingskraan plaatsvindt, wordt een hoeveelheid van circa 0,5 liter
      melk via de monsternemingskraan afgetapt ten behoeve van het voorspoelen van de kraan.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel9
  - number: '9.4'
    text: |-
      De monsterfles wordt onder de uitloop van de monsternemingskraan gehouden, waarbij de uitloop van de kraan niet in
      de monsterfles steekt.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel9
  - number: '10'
    text: |-
      Indien voor het nemen van monsters boerderijmelk gebruik wordt gemaakt van automatische monsternemingsapparatuur
      worden de bepalingen in de [artikelen 11][ref1] en [12][ref2] in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0031241#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031241#Artikel12
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031241
        artikel: '11'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0031241
        artikel: '12'
        paragraaf: '5'
  - number: '11.1'
    text: |-
      De door de ontvanger van boerderijmelk te gebruiken automatische monsternemingsapparaten hebben een bedrijfskeuring
      ondergaan, waarbij een toetsing heeft plaatsgevonden overeenkomstig het bepaalde in [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031241#Artikel12
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0031241
        artikel: '12'
        paragraaf: '5'
  - number: '11.2'
    text: |-
      De in lid 1 bedoelde bedrijfskeuring wordt uitgevoerd door of namens de ontvanger van boerderijmelk. Het
      keuringsrapport wordt ter beschikking gehouden van de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel11
  - number: '12.1'
    text: |-
      Het automatische monsternemingsapparaat, inclusief het innametraject van de rijdende melkontvangst vóór het
      apparaat, veroorzaakt geen verandering in de bemonsterde melk die de resultaten van het onderzoek beïnvloeden. Het
      apparaat is zodanig vervaardigd dat het herhaalde reiniging en desinfectie kan weerstaan.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel12
  - number: '12.2'
    text: |-
      Alle oppervlakken van het automatische monsternemingsappaat die in contact komen met de bemonsterde melk zijn
      schoon en glad en zijn vrij van krassen, naden, scheuren en deuken. Alle hoeken zijn afgerond.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel12
  - number: '12.3'
    text: |-
      Het automatische monsternemingsapparaat is zodanig vervaardigd dat geen restmelk achterblijft. Hierbij mag de
      hoeveelheid melk van een leverantie die terechtkomt in de bemonsterde melk van een volgende leverantie maximaal
      0,1% zijn.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel12
  - number: '12.4'
    text: |-
      Het automatische monsternemingsapparaat is vóór de luchtafscheider in het innametraject van de rijdende
      melkontvangst opgesteld.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel12
  - number: '12.5'
    text: |-
      Het automatische monsternemingsapparaat is in- en uitwendig reinigbaar en goed demonteerbaar. In geval van een
      gesloten systeem is dit goed reinigbaar.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel12
  - number: '12.6'
    text: |-
      Het automatische monsternemingsapparaat is zodanig gesitueerd in de ontvangstcabine van de rijdende melkontvangst
      dat geen bevuiling van buiten of bevriezing mogelijk is.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel12
  - number: '12.7'
    text: |-
      Op of bij het automatische monsternemingsapparaat is de minimum in te nemen hoeveelheid melk weergegeven. Indien
      een leverantie kleiner is dan de minimum in te nemen hoeveelheid, wordt het monster handmatig genomen.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel12
  - number: '13.1'
    text: |-
      De ontvanger van boerderijmelk zorgt ervoor dat de monsters boerderijmelk, nadat ze zijn genomen, direct worden
      gekoeld en uiterlijk binnen één uur een temperatuur hebben bereikt van ten minste 0,0°C en ten hoogste 4,0°C.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel13
  - number: '13.2'
    text: |-
      De monsters boerderijmelk worden bewaard bij een temperatuur van ten minste 0,0°C en ten hoogste 4,0°C, tot het
      moment waarop zij in onderzoek worden genomen. Onder 'het in onderzoek nemen' wordt in deze verordening verstaan:
      het moment van registratie van ontvangst van de monsters boerderijmelk door een melkcontrolestation.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel13
  - number: '13.3'
    text: |-
      Monsters boerderijmelk die bestemd zijn voor het onderzoek op kiemgetal, worden bewaard bij ten minste 0,0°C en ten
      hoogste 4,0°C en binnen 36 uur na monsterneming op kiemgetal in onderzoek genomen.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel13
  - number: '13.4'
    text: |-
      Monsters boerderijmelk die bestemd zijn voor onderzoek op melkvreemde bacteriegroeiremmende stoffen worden, in
      afwijking van lid 1 en 2, bewaard bij ten hoogste 8,0°C en moeten binnen 96 uur na monsterneming in onderzoek zijn
      genomen. Voornoemde temperatuurgrens van 8,0°C mag gedurende een periode van maximaal 24 uur tot ten hoogste 20°C
      worden overschreden.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel13
  - number: '13.5'
    text: |-
      Monsters boerderijmelk die bestemd zijn voor onderzoeken in het kader van de bepaling van de kwaliteit, anders dan
      genoemd onder lid 3 en 4, worden, in afwijking van lid 1 en 2:
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel13
  - number: 13.5.a
    text: bewaard bij ten minste 0,0°C en ten hoogste 8,0°C en binnen 36 uur na monsterneming in onderzoek genomen of;
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel13
  - number: 13.5.b
    text: bewaard bij ten minste 0,0°C en ten hoogste 4,0°C en binnen 96 uur na monsterneming in onderzoek genomen.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel13
  - number: '13.6'
    text: |-
      Monsters boerderijmelk die bestemd zijn voor de bepaling van de samenstelling worden, in afwijking van lid 1 en 2,
      bewaard bij ten minste 0,0°C en ten hoogste 8,0°C en binnen 96 uur in onderzoek genomen.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel13
  - number: '13.7'
    text: |-
      De monsters worden zo snel mogelijk nadat zij zijn genomen geplaatst in een speciaal daarvoor bestemde, niet voor
      onbevoegden toegankelijke, schone en gekoelde ruimte.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel13
  - number: '13.8'
    text: |-
      Indien voor de temperatuurcontrole een adequaat systeem met automatische meting en registratie wordt toegepast,
      worden de in de leden 1 tot en met 6 bedoelde bepalingen betreffende de bewaartemperaturen geacht te zijn
      nageleefd, indien het voortschrijdend gemiddelde over elke aaneengesloten periode van twee uur, met ten minste vier
      metingen en registraties per uur, aan de temperatuurcriteria voldoet.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel13
  - number: '13.9'
    text: |-
      Teneinde de bovengenoemde bewaarcondities van de monsters in acht te nemen, bepalen het melkcontrolestation
      en de ontvanger van boerderijmelk in onderling overleg de tijdstippen waarop de genomen monsters door het
      melkcontrolestation worden opgehaald respectievelijk in onderzoek worden genomen, met dien verstande dat de
      monsters zo spoedig mogelijk na aankomst bij de ontvanger van boerderijmelk naar het melkcontrolestation worden
      vervoerd.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel13
  - number: '14'
    text: |-
      De [Zuivelverordening 2000, Handmatig nemen, transporteren en bewaren van monsters boerderijmelk][ref1] wordt
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010869
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010869
  - number: '15'
    text: |-
      Deze verordening treedt in werking met ingang van de dag na publicatie in het Verordeningenblad
      Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel15
  - number: '16'
    text: |-
      Deze verordening wordt aangehaald als Zuivelverordening 2011, Nemen, transporteren en bewaren van monsters
      boerderijmelk.
    url: https://wetten.overheid.nl/BWBR0031241/2011-12-31#Artikel16
