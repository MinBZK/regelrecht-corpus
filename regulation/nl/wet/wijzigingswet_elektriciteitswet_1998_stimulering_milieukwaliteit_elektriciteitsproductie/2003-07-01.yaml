        artikel: 72n
      - id: ref2
        bwb_id: BWBR0015175
        artikel: I
      - id: ref3
        bwb_id: BWBR0015175
        artikel: I
  - number: III.3
    text: |-
      In afwijking van [artikel 72n, vierde lid, onderdeel a, van de Elektriciteitswet 1998][ref1], wordt voor het
      eerste kalenderjaar waarbinnen het tijdstip valt waarop dit artikel in werking treedt, het maximale aantal
      te subsidiëren GWh berekend naar rato van de maanden van dat kalenderjaar die resteren na afschaffing van
      [artikel 36o van de Wet belastingen op milieugrondslag][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72n
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel36o
    url: https://wetten.overheid.nl/BWBR0015175/2003-07-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 72n
      - id: ref2
        bwb_id: BWBR0007168
        artikel: 36o
  - number: III.4
    text: |-
      [Artikel 72p, derde lid][ref1], en [artikel 72ab, derde lid][ref2], gelden niet ten behoeve van het jaar waarin
      [artikel I, onderdeel M][ref3], in werking zal treden.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72p
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel72ab
      [ref3]: https://wetten.overheid.nl/BWBR0015175#ArtikelI
    url: https://wetten.overheid.nl/BWBR0015175/2003-07-01#ArtikelIII
    references:
      - id: ref1
