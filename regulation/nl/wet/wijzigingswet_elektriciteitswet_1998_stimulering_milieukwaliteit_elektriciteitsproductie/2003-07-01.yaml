        bwb_id: BWBR0015175
        artikel: I
  - number: III.2
    text: |-
      In afwijking van [artikel 72n, derde lid, van de Elektriciteitswet 1998][ref1], vangt de voor subsidie in
      aanmerking komende periode aan op het tijdstip van inwerkingtreding van [artikel I, onderdeel M][ref2], of zoveel
      later als in de aanvraag is aangegeven, mits de aanvraag is ontvangen binnen zes maanden na inwerkingtreding van
      [artikel I, onderdeel M][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72n
      [ref2]: https://wetten.overheid.nl/BWBR0015175#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0015175#ArtikelI
    url: https://wetten.overheid.nl/BWBR0015175/2003-07-01#ArtikelIII
    references:
      - id: ref1
