preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de doelstelling van een duurzame en milieuhygiënisch
    verantwoorde elektriciteitsvoorziening in de Elektriciteitswet 1998 vorm te geven door aan de netbeheerder van
    het landelijk hoogspanningsnet de taak te geven te bevorderen dat in Nederland geïnvesteerd wordt in productie-
    installaties voor duurzame elektriciteit en klimaatneutrale elektriciteit alsmede te bevorderen dat installaties
    voor warmtekrachtkoppeling op rendabele wijze kunnen worden geëxploiteerd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015175/2003-07-01#ArtikelAanhef
articles:
  - number: II.1
    text: |-
      Tot en met 31 december 2003 is de vergunninghouder, bedoeld in
      [artikel 1, eerste lid, onderdeel l, van de Elektriciteitswet 1998][ref1] verplicht een aanbod
      tot het leveren van elektriciteit te aanvaarden, indien een beschermde afnemer als bedoeld in
      [artikel 1, eerste lid, onderdeel d, onder 2°, van de Elektriciteitswet 1998][ref2] dit aanbod doet en deze
      afnemer elektriciteit opwekt met een installatie voor warmtekrachtkoppeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0015175/2003-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '1'
  - number: II.2
    text: |-
      De vergoeding die de vergunninghouder in 2003 aan de beschermde afnemer, bedoeld in het eerste lid, verschuldigd
      is voor het leveren van elektriciteit opgewekt met een installatie voor warmtekrachtkoppeling, wordt vastgesteld
      overeenkomstig het bepaalde in [artikel 71 van de Elektriciteitswet 1998][ref1] zoals dit luidde voor de
      inwerkingtreding van [artikel I, onderdeel M, van dit wetsvoorstel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0015175#ArtikelI
    url: https://wetten.overheid.nl/BWBR0015175/2003-07-01#ArtikelII
    references:
