        artikel: 72o
      - id: ref2
        bwb_id: BWBR0015175
        artikel: I
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 72w
  - number: III.7
    text: |-
      In afwijking van [artikel 72ab, tweede lid, van de Elektriciteitswet 1998][ref1], wordt voor het kalenderjaar
      waarbinnen het tijdstip valt waarop dit artikel in werking treedt, het tarief berekend naar rato van de maanden van
      dat kalenderjaar die resteren na inwerkingtreding van dat artikel. Bij ministeriële regeling kan voor het jaar 2003
      het tarief lager worden vastgesteld indien blijkt dat het in [artikel 72ab, tweede lid][ref2], genoemde tarief te
      hoog is in relatie tot de verwachte uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72ab
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel72ab
    url: https://wetten.overheid.nl/BWBR0015175/2003-07-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 72ab
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 72ab
  - number: III.8
    text: |-
      Voor productie-installaties die gebruik maken van kleinschalige waterkracht, niet zijnde
      golfenergie of getijde-energie of biomassa, niet zijnde zuivere biomassa, als energiebron
      wordt [artikel 72n, tweede lid, onderdeel a, onder ten eerste][ref1], gelezen als: zowel
      [artikel 36o van de Wet belastingen op milieugrondslag][ref2] van toepassing was op kleinschalige waterkracht, niet
      zijnde golfenergie of getijde-energie of biomassa, niet zijnde zuivere biomassa.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72n
      [ref2]: https://wetten.overheid.nl/BWBR0007168#Artikel36o
    url: https://wetten.overheid.nl/BWBR0015175/2003-07-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 72n
      - id: ref2
        bwb_id: BWBR0007168
        artikel: 36o
  - number: III.9
    text: |-
      In afwijking van [artikel 72o, derde lid, eerste volzin, van de Elektriciteitswet 1998][ref1], blijft,
      in het geval van opwekking van elektriciteit met behulp van zuivere biomassa in een productie-installatie
      met ten minste 50 MW nominaal elektrisch vermogen, het vaste bedrag per kWh ter stimulering van de
      milieukwaliteit van de elektriciteitsproductie gehandhaafd totdat drie jaren zijn verstreken na de
      inwerkingtreding van [artikel I, onderdeel M][ref2]. Met ingang van dat tijdstip ligt, in afwijking van
      [artikel 72o, derde lid, eerste volzin, van de Elektriciteitswet 1998][ref3], het vaste bedrag per kWh op het
      niveau dat op dat moment geldt voor de desbetreffende producent en desbetreffende productie-installatie, met dien
      verstande dat Onze Minister tot een tijdelijke verlaging besluit voor zover dit noodzakelijk is om te voldoen
      aan ingevolge een verdrag voor de staat geldende verplichtingen. Onze Minister bepaalt bij ministeriële regeling
      wat wordt verstaan onder «zuivere biomassa», alsmede de wijze waarop de in de tweede volzin bedoelde verlaging
      toepassing vindt en de criteria die kunnen leiden tot toepassing van deze verlaging.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72o
      [ref2]: https://wetten.overheid.nl/BWBR0015175#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel72o
    url: https://wetten.overheid.nl/BWBR0015175/2003-07-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 72o
      - id: ref2
        bwb_id: BWBR0015175
        artikel: I
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 72o
  - number: III.10
    text: |-
      Het negende lid is niet van toepassing indien de voor subsidie in aanmerking komende periode aanvangt op of na
      de inwerkingtreding van een ministeriële regeling waarin onderscheid wordt gemaakt tussen de diverse categorieën
      zuivere biomassa en/of de diverse categorieën productieprocessen waarin zuivere biomassa wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0015175/2003-07-01#ArtikelIII
  - number: V
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld. In dat besluit kan worden
      bepaald dat aan de verschillende artikelen of onderdelen daarvan terugwerkende kracht wordt verleend. In dat
      besluit wordt zo nodig toepassing gegeven aan [artikel 16 van de Tijdelijke referendumwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel16
    url: https://wetten.overheid.nl/BWBR0015175/2003-07-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '16'
