        artikel: I
  - number: III.1
    text: |-
      [Artikel 72e, tweede lid, van de Elektriciteitswet 1998][ref1] geldt niet voor de begroting van het jaar waarin
      [artikel I, onderdeel M][ref2], in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72e
      [ref2]: https://wetten.overheid.nl/BWBR0015175#ArtikelI
    url: https://wetten.overheid.nl/BWBR0015175/2003-07-01#ArtikelIII
