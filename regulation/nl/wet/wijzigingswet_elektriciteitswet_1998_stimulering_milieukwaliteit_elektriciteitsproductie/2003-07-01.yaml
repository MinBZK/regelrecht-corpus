        artikel: 72ab
      - id: ref3
        bwb_id: BWBR0015175
        artikel: I
  - number: III.5
    text: |-
      Onze Minister kan bij ministeriële regeling nadere regels stellen ten behoeve van de
      goede invoering van dit wetsvoorstel, waarin kan worden bepaald dat de taak, bedoeld in
      [artikel 16, eerste lid, onderdeel h, van de Elektriciteitswet 1998][ref1] met betrekking tot de vaststelling of
      sprake is van een installatie voor warmtekrachtkoppeling met een daarbij vast te stellen mate van reductie van de
      uitstoot van kooldioxide, tijdelijk door Onze Minister in plaats van door de netbeheerder wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0015175/2003-07-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
  - number: III.6
    text: |-
      In afwijking van [artikel 72o, derde lid, van de Elektriciteitswet 1998][ref1] worden in het kalenderjaar waarin
      [artikel I, onderdeel M][ref2], in werking treedt, het vaste bedrag per kWh en het voorschot gewijzigd, voor zover
      dit voortvloeit uit de regeling die wordt vastgesteld op grond van [artikel 72w, derde lid, van die wet][ref3]
      en die ertoe strekt de CO-index te introduceren. Deze wijziging van die bedragen gaat in met ingang van de
      inwerkingtreding van de regeling, genoemd in de eerste volzin, en loopt tot het eind van de voor subsidie in
      aanmerking komende periode.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72o
      [ref2]: https://wetten.overheid.nl/BWBR0015175#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel72w
    url: https://wetten.overheid.nl/BWBR0015175/2003-07-01#ArtikelIII
    references:
      - id: ref1
