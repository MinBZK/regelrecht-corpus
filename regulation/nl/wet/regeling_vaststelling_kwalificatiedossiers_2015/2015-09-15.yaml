        artikel: 2.2.3
  - number: '2'
    text: |-
      1 In [bijlage 1][ref1] behorende bij deze regeling wordt voor ieder kwalificatiedossier vastgesteld:

      a) tot welk van de opleidingsdomeinen, bedoeld in
      [artikel 2, eerste lid, van de Regeling vaststelling kwalificatiedossiers en opleidingsdomeinen 2012][ref2], het
      kwalificatiedossier behoort, met uitzondering van de kwalificatiedossiers Entree;

      b) welke kwalificaties deel uitmaken van de kwalificatiedossiers.

      2 In [bijlage 1][ref3] wordt tevens per kwalificatie vastgesteld:

      a) de soort beroepsopleiding, bedoeld in [artikel 7.2.2, eerste lid, van de wet][ref4], waarop de kwalificatie
      is gericht,

      b) de leerweg of leerwegen, bedoeld in [artikel 7.2.2, tweede lid, van de wet][ref5], waarin die beroepsopleiding
      kan worden verzorgd,

      c) of toepassing is gegeven aan [artikel 7.2.6, eerste lid, van de wet][ref6], en

      d) de prijsfactor, bedoeld in [artikel 2.2.2, vijfde lid][ref7], en
      [artikel 2.2.3, vierde lid, van het Uitvoeringsbesluit WEB][ref8].


