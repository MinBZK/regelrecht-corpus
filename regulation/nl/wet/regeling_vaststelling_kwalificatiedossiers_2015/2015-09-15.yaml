  - number: '3'
    text: |-
      De kwalificatiedossiers en de daarbij behorende kwalificaties worden vastgesteld overeenkomstig [bijlage 2][ref1]
      behorende bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0036352
    url: https://wetten.overheid.nl/BWBR0036352/2015-09-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036352
  - number: '4'
    text: |-
      De kwalificatiedossiers en de daarbij behorende kwalificaties voor zover het betreft beroepsonderwijs op het gebied
      van landbouw, natuurlijke omgeving en voedsel, worden vastgesteld overeenkomstig [bijlage 3][ref1] behorende bij
      deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0036352
    url: https://wetten.overheid.nl/BWBR0036352/2015-09-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0036352
  - number: '5'
    text: |-
      Voor de middenkaderopleidingen opgenomen in [bijlage 4][ref1] bij deze regeling, kan door het bevoegde gezag een
      studieduur worden vastgesteld van vier studiejaren.


      [ref1]: https://wetten.overheid.nl/BWBR0036352
    url: https://wetten.overheid.nl/BWBR0036352/2015-09-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0036352
  - number: 5a
    text: |-
      1 Onverminderd het bepaalde in [artikel 6.1.3, tweede lid, van de wet][ref1] mag een instelling als bedoeld in
      [artikel 1.3.2a][ref2] of [artikel 1.3.3 van de wet][ref3], de beroepsopleidingen verzorgen die zijn gericht op de
      kwalificaties die op 31 juli 2015 behoorden tot het werkgebied van het kenniscentrum beroepsonderwijs bedrijfsleven
      dat op die datum werkzaam was voor de specifieke bedrijfstak of groep van bedrijfstakken waarvoor de instelling
      opleidingen verzorgt en waarvoor door dat kenniscentrum al dan niet gezamenlijk met een ander kenniscentrum,
      kwalificatiedossiers zijn ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.2a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.3
