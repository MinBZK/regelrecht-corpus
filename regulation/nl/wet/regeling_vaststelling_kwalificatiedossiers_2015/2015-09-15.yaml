  text: |-
    Gelet op de artikelen 7.2.4, tweede lid, en 7.2.4a, vierde lid van de Wet educatie en beroepsonderwijs en de
    artikelen 2.2.2, vijfde lid, en 2.2.3, vierde lid, van het Uitvoeringsbesluit WEB;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0036352/2015-09-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *wet:* [Wet educatie en beroepsonderwijs][ref1];

      b. *kwalificatiedossier:* een document waarin een of meer kwalificaties zijn beschreven;

      c. *prijsfactor:* de prijsfactor, bedoeld in [artikel 2.2.2, vijfde lid][ref2], en
      [artikel 2.2.3, vierde lid, van het Uitvoeringsbesluit WEB][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel2.2.3
    url: https://wetten.overheid.nl/BWBR0036352/2015-09-15#Artikel1
