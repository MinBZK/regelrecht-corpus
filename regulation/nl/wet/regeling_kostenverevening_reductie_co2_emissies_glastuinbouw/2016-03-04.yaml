        artikel: 2:1
      - id: ref2
        bwb_id: BWBR0036075
        artikel: '2'
  - number: '6'
    text: |-
      Archiefbescheiden van het Productschap Tuinbouw betreffende zaken die op basis van deze regeling worden
      behartigd door de minister, worden overgedragen aan de minister, voor zover zij niet overeenkomstig de
      [Archiefwet 1955][ref1] zijn overgebracht naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0036075/2016-03-04#Artikel6
