preamble:
  text: |-
    Gelet op artikel 4 van het Besluit kostenverevening reductie CO2-emissies glastuinbouw;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0036075/2016-03-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *CO-jaarvracht:* totale CO-emissie van de inrichting in een kalenderjaar;
        - *emissieaangifte:* aangifte van de CO-jaarvracht van de inrichting;
        - *inrichting:* inrichting als bedoeld in [artikel 15.51 van de wet][ref1];
        - *inrichting regime A:* inrichting die in een kalenderjaar 305 ton CO of meer emitteert;
        - *inrichting regime B:* inrichting die in een kalenderjaar minder dan 305 ton CO emitteert.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15.51
    url: https://wetten.overheid.nl/BWBR0036075/2016-03-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15.51'
  - number: '2'
    text: |-
      1 De minister houdt een register bij van inrichtingen.

      2 Degene die een inrichting drijft meldt zich voor registratie aan bij de minister.

      3 Bij beëindiging laat degene die de inrichting dreef zich uit het register uitschrijven.

      4 Het tweede lid is niet van toepassing op inrichtingen die zijn ingeschreven op grond van
      [artikel 2:1 van Verordening PT CO2 sectorsysteem glastuinbouw 2011][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031205#Artikel21
    url: https://wetten.overheid.nl/BWBR0036075/2016-03-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031205
        artikel: 2:1
  - number: '3'
    text: |-
      1 Degene die een inrichting regime A drijft dient over het voorafgaande kalenderjaar bij de minister een
      emissieaangifte in.

      2 Degene die een inrichting regime B drijft dient eenmalig op het moment dat de inrichting een kalenderjaar in
      werking is een emissieaangifte in over dat kalenderjaar.

      3 Degene die een inrichting drijft bepaalt de CO-jaarvracht over 2014 overeenkomstig de in [bijlage 1][ref1]
      opgenomen berekeningsmethode en over 2015 en volgende jaren overeenkomstig de in [bijlage 2][ref2] opgenomen
      berekeningsmethode.

      4 Bij niet tijdige indiening van de emissieaangifte stelt de minister de CO-jaarvracht ambtshalve vast.

      5 Degene die een inrichting drijft bewaart gedurende tenminste vijf jaren na indiening de gegevens en
      uitgevoerde berekeningen die ten grondslag liggen aan de CO-jaarvracht en de facturen en andere schriftelijke
      afleveringsbewijzen van gas, elektriciteit en warmte.


      [ref1]: https://wetten.overheid.nl/BWBR0036075
      [ref2]: https://wetten.overheid.nl/BWBR0036075
    url: https://wetten.overheid.nl/BWBR0036075/2016-03-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036075
      - id: ref2
        bwb_id: BWBR0036075
  - number: '4'
    text: |-
      1 De minister stelt op basis van de jaarlijkse emissieaangiften van inrichtingen regime A en de eenmalig door
      inrichtingen regime B ingediende emissieaangiften de door de inrichtingen gezamenlijk in een kalenderjaar
      geëmitteerde hoeveelheid CO vast.

      2 De afrekening van de verschuldigde vergoeding vindt plaats op basis van de formule, bedoeld in
      [artikel 3 van het Besluit kostenverevening reductie CO2-emissies glastuinbouw][ref1], waarbij voor het jaar 2014
      de formule zoals deze luidde op 31 december 2014, van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0030463#Artikel3
    url: https://wetten.overheid.nl/BWBR0036075/2016-03-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0030463
        artikel: '3'
  - number: '5'
    text: |-
      1 Het register van inrichtingen van het Productschap Tuinbouw, bedoeld in
      [artikel 2.1 van Verordening PT CO2 sectorsysteem glastuinbouw 2011][ref1], wordt overgedragen aan de minister en
      in het register, bedoeld in [artikel 2, eerste lid][ref2], opgenomen.

      2 De in 2012, 2013 en 2014 bij het Productschap Tuinbouw ingediende emissieaangiften worden overgedragen aan de
      minister.


      [ref1]: https://wetten.overheid.nl/BWBR0031205#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0036075#Artikel2
    url: https://wetten.overheid.nl/BWBR0036075/2016-03-04#Artikel5
    references:
      - id: ref1
