preamble:
  text: |-
    Gelet op artikel 4 van het Besluit kostenverevening reductie CO2-emissies glastuinbouw;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0036075/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:








                  *CO-jaarvracht:*


                  totale CO-emissie van de activiteit in een kalenderjaar;




                  *Emissieaangifte:*


                  aangifte van de CO-jaarvracht van de activiteit;




                  *Activiteit:*


                  activiteit als bedoeld in [artikel 15.51 van de Wet milieubeheer][ref1];




                  *Activiteit regime A:*


                  activiteit die in een kalenderjaar 305 ton CO of meer emitteert;




                  *Activiteit regime B:*


                  activiteit die in een kalenderjaar minder dan 305 ton CO emitteert.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15.51
    url: https://wetten.overheid.nl/BWBR0036075/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '15.51'
  - number: '2'
    text: |-
      1 De minister houdt een register bij van activiteiten.

      2 Degene die een activiteit verricht meldt zich voor registratie aan bij de minister.

      3 Bij beëindiging laat degene die een activiteit heeft verricht zich uit het register uitschrijven.

      4 Het tweede lid is niet van toepassing op inrichtingen die zijn ingeschreven op grond van
      [artikel 2:1 van Verordening PT CO2 sectorsysteem glastuinbouw 2011][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031205#Artikel21
    url: https://wetten.overheid.nl/BWBR0036075/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031205
        artikel: 2:1
  - number: '3'
    text: |-
      1 Degene die een activiteit regime A verricht dient over het voorafgaande kalenderjaar bij de minister een
      emissieaangifte in.

      2 Degene die een activiteit regime B verricht dient eenmalig op het moment dat de activiteit een kalenderjaar in
      werking is een emissieaangifte in over dat kalenderjaar.

      3 Degene die een activiteit verricht, bepaalt de CO-jaarvracht over 2022 en volgende jaren overeenkomstig de in de
      bijlage opgenomen berekeningsmethode.

      4 Bij niet tijdige indiening van de emissieaangifte stelt de minister de CO-jaarvracht ambtshalve vast.

      5 Degene die een activiteit verricht bewaart gedurende tenminste vijf jaren na indiening de gegevens en
      uitgevoerde berekeningen die ten grondslag liggen aan de CO-jaarvracht en de facturen en andere schriftelijke
      afleveringsbewijzen van gas, elektriciteit en warmte.
    url: https://wetten.overheid.nl/BWBR0036075/2024-01-01#Artikel3
  - number: '4'
    text: |-
      1 De minister stelt op basis van de jaarlijkse emissieaangiften van activiteiten regime A en de eenmalig door
      activiteiten regime B ingediende emissieaangiften de door de activiteiten gezamenlijk in een kalenderjaar
      geëmitteerde hoeveelheid CO vast.

      2 Het bedrag (P) per ton geëmitteerde COals bedoeld in [artikel 3 van het besluit][ref1] is: het gewone gemiddelde
      van de laatste prijs in euro, zoals waargenomen op alle handelsdagen van 1 januari tot en met 31 december van het
      voorafgaande jaar, van de termijncontracten van broeikasgasemissierechten voor levering in december van dat jaar,
      op de koolstofbeurs in de Europese Unie met het hoogste handelsvolume van die contracten in die maanden.

      3 De formule wordt toegepast bij de afrekening van de verschuldigde vergoeding vanaf het jaar 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0030463#Artikel3
    url: https://wetten.overheid.nl/BWBR0036075/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0030463
        artikel: '3'
  - number: '5'
    text: |-
      1 Het register van activiteiten van het Productschap Tuinbouw, bedoeld in
      [artikel 2.1 van Verordening PT CO2 sectorsysteem glastuinbouw 2011][ref1], wordt overgedragen aan de minister en
      in het register, bedoeld in [artikel 2, eerste lid][ref2], opgenomen.

      2 De in 2012, 2013 en 2014 bij het Productschap Tuinbouw ingediende emissieaangiften worden overgedragen aan de
      minister.


      [ref1]: https://wetten.overheid.nl/BWBR0031205#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0036075#Artikel2
    url: https://wetten.overheid.nl/BWBR0036075/2024-01-01#Artikel5
