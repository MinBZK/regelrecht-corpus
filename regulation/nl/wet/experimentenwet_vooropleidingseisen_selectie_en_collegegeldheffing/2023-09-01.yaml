  - number: '4'
    text: |-
      1 Deze wet heeft betrekking op het studiejaar 2005–2006 en de volgende studiejaren.

      2 Deze wet heeft geen betrekking op:

      a. opleidingen die niet zijn opgenomen in de Registratie instellingen en opleidingen, bedoeld in
      [artikel 6.13 van de wet][ref1]; en

      b. opleidingen die wat betreft de doelstelling en de inhoud van de opleiding de enige in den lande zijn, voor zover
      het betreft experimenten op het terrein van de selectie van studenten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6.13
    url: https://wetten.overheid.nl/BWBR0018259/2023-09-01#Artikel4
