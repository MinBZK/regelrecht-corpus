  - number: '19'
    text: |-
      Op aanvragen als bedoeld in [artikel 7.49a van de wet][ref1], zoals dat artikel luidde voor het tijdstip van
      intrekking van deze wet, en de afhandeling daarvan, alsmede op beroepen tegen een beslissing op een zodanige
      aanvraag, blijven de op de dag voor het tijdstip van intrekking van deze wet geldende voorschriften van deze wet en
      van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] van toepassing.


