  - number: '7'
    text: |-
      1 Onverminderd [artikel 7.37, eerste lid, van de wet][ref1] kan Onze Minister op aanvraag van het
      instellingsbestuur besluiten dat ten aanzien van een door hem aangewezen bacheloropleiding of een door hem
      aangewezen experimenteel programma binnen die opleiding selectie of aanvullende selectie plaatsvindt van de
      gegadigden voor die opleiding.

      2 Een aanwijzing als bedoeld in het eerste lid vindt uitsluitend plaats, indien het instellingsbestuur heeft
      aangetoond dat het een opleiding met evidente meerwaarde betreft of het experiment kan bijdragen aan de verdere
      ontwikkeling van de evidente meerwaarde van die opleiding.

      3 Het instellingsbestuur stelt de selectiecriteria vast.

      4 Het instellingsbestuur voert de selectie uit. De selectie vindt plaats voorafgaand aan de aanvang van het
      studiejaar. Het instellingsbestuur beslist over de selectie.

      5 De selectiecriteria en de selectieprocedure worden opgenomen in de onderwijs- en examenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.37
    url: https://wetten.overheid.nl/BWBR0018259/2023-09-01#Artikel7
