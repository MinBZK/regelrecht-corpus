    text: |-
      De bepalingen van deze wet regelen het openbaar onderwijs en zijn voorwaarden voor bekostiging voor het bijzonder
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0018259/2023-09-01#Artikel2
  - number: '3'
    text: |-
      Met het oog op het verkrijgen van een duidelijker inzicht in de effecten van selectie van aanstaande studenten
      en extraneï, van differentiatie van collegegeld en van het stellen van vervangende vooropleidingseisen
      aan aanstaande studenten kunnen binnen de instellingen voor hoger onderwijs die op grond van de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] worden bekostigd dan wel op grond van
      [die wet][ref2] zijn aangewezen, experimenten plaatsvinden met betrekking tot die terreinen, waarbij kan worden
      afgeweken van voorschriften gesteld bij [die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005682
      [ref3]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0018259/2023-09-01#Artikel3
