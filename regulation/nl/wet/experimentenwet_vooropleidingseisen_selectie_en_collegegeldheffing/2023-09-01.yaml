    text: |-
      1 Onze Minister kan op aanvraag van het instellingsbestuur in afwijking van
      [artikel 7.45, eerste lid van de wet][ref1] besluiten dat ten aanzien van een door hem aangewezen voltijdse
      opleiding of een door hem aangewezen experimenteel programma binnen die opleiding het instellingsbestuur een
      collegegeld vaststelt van ten hoogste vijf keer het volledige wettelijke collegegeld, bedoeld in artikel 7.45,
      eerste lid, van de wet.

      2 [Artikel 7, tweede lid][ref2], is van toepassing.


