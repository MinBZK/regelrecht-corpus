  - number: '8'
    text: |-
      1 Onze Minister kan op aanvraag van het instellingsbestuur in afwijking van
      [artikel 7.30b, eerste lid, vierde volzin, van de wet][ref1] besluiten dat ten aanzien van een door hem
      aangewezen masteropleiding, bedoeld in [artikel 7.30b, eerste lid, van de wet][ref2] de toelatingseisen voor die
      masteropleiding tevens betrekking kunnen hebben op andere aspecten.

      2 [Artikel 7, tweede lid][ref3], is van toepassing.

      3 Het instellingsbestuur stelt de aanvullende toelatingseisen vast.

      4 [Artikel 6, vierde lid][ref4], is van overeenkomstige toepassing.

      5 De aanvullende toelatingseisen worden opgenomen in de onderwijs- en examenregeling.


