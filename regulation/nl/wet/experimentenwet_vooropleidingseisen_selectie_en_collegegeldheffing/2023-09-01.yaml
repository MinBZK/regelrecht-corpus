  - number: '5'
    text: |-
      1 Ten behoeve van experimenten op het gebied van selectie van studenten en collegegelddifferentiatie kan het
      instellingsbestuur binnen een bacheloropleiding een experimenteel programma instellen.

      2 De studielast van een experimenteel programma binnen een bacheloropleiding in het wetenschappelijk onderwijs
      bedraagt 180 studiepunten. De studielast van een experimenteel programma binnen een bacheloropleiding in het hoger
      beroepsonderwijs bedraagt 240 studiepunten. [Artikel 7.3, tweede lid, eerste volzin, van de wet][ref1] is van
      overeenkomstige toepassing. De kwaliteiten, bedoeld in [artikel 7.13, tweede lid, onder a, van de wet][ref2], van
      een experimenteel programma komen overeen met die van de bacheloropleiding waarbinnen het programma is ingesteld.

      3 Het afsluitend examen van een experimenteel programma wordt aangemerkt als het afsluitend examen
      van de bacheloropleiding waarbinnen het programma is ingesteld. Op het getuigschrift, bedoeld in
      [artikel 7.11 van de wet][ref3], wordt vermeld welk experimenteel programma het betreft.

      4 De bepalingen van [hoofdstuk 7][ref4], voorzover die betrekking hebben op bacheloropleidingen, zijn van
      overeenkomstige toepassing op een experimenteel programma, tenzij het tegendeel blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.3
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.13
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.11
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Hoofdstuk7
