  - number: '10'
    text: |-
      1 Bij ministeriële regeling worden voorschriften vastgesteld over de beschikbaarstelling van een lening van
      rijkswege aan studenten in de kosten van het collegegeld, verschuldigd voor de inschrijving voor een opleiding als
      bedoeld in [artikel 9][ref1], in voorkomende gevallen in verband met het deelnemen aan een experimenteel programma.
      In de lening is het bedrag van het collegegeld, bedoeld in [artikel 7.45, eerste lid, van de wet][ref2], niet
      begrepen.

      2 De lening is rentedragend. Met betrekking tot het rentepercentage is
      [artikel 6.3, eerste lid, van de Wet studiefinanciering 2000][ref3] van overeenkomstige toepassing.

      3 In de regeling kan worden bepaald dat een instellingsbestuur wordt belast met de uitvoering daarvan.

      4 De voorschriften, bedoeld in het eerste lid, hebben in elk geval betrekking op:

      a. het bedrag van de lening dat ten hoogste kan worden toegekend,

      b. de voorwaarden waaronder de lening kan worden toegekend,

      c. de aanvraagprocedure en de toekenning van de lening, en

      d. de wijze van terugbetaling van de lening.

      5 Dit artikel is niet van toepassing op opleidingen, verbonden aan instellingen, bedoeld in
      [artikel 6.9 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018259#Artikel9
