  - number: '18'
    text: |-
      1 Studenten die op 31 augustus 2005 of op 31 augustus 2006 zijn ingeschreven voor een bacheloropleiding ten aanzien
      waarvan met ingang van 1 september 2005 onderscheidenlijk met ingang van 1 september 2006 een experiment op het
      terrein van selectie aanvangt, kunnen die opleiding binnen een redelijke termijn aan dezelfde instelling voltooien
      volgens de voorschriften die op het tijdstip van hun eerste inschrijving van toepassing waren.

      2 Studenten die op 31 augustus 2005 of op 31 augustus 2006 zijn ingeschreven voor een voltijdse opleiding
      ten aanzien waarvan met ingang van 1 september 2005 onderscheidenlijk met ingang van 1 september 2006
      een experiment op het terrein van collegegeldverhoging aanvangt, zijn het collegegeld, bedoeld in
      [artikel 7.45, eerste lid, van de wet][ref1], verschuldigd.

      3 Het eerste lid is van overeenkomstige toepassing op studenten die op 31 augustus 2007 of op 31 augustus van een
      van de volgende kalenderjaren zijn ingeschreven voor een opleiding als bedoeld in het eerste of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.45
