  - number: '6'
    text: |-
      1 Onze Minister kan op aanvraag van het instellingsbestuur in afwijking van
      [artikel 7.24, eerste en tweede lid, van de wet][ref1] besluiten dat ten aanzien van een door hem aangewezen
      bacheloropleiding aanstaande studenten en extraneï kunnen voldoen aan eisen die in de plaats komen van de
      vooropleidingseisen, gesteld in [artikel 7.24, eerste onderscheidenlijk tweede lid, van de wet][ref2].

      2 Een aanwijzing als bedoeld in het eerste lid vindt uitsluitend plaats, indien het instellingsbestuur heeft
      aangetoond dat de vervangende vooropleidingseisen ten minste gelijkwaardig zijn aan de vooropleidingseisen, gesteld
      in [artikel 7.24, eerste onderscheidenlijk tweede lid, van de wet][ref3].

      3 Het instellingsbestuur stelt de vervangende vooropleidingseisen vast.

      4 Het instellingsbestuur voert het onderzoek of de betrokkene voldoet aan de vervangende vooropleidingseisen uit.
      Dat onderzoek vindt plaats voorafgaand aan de aanvang van het studiejaar. Het instellingsbestuur beslist of de
      betrokkene voldoet aan de vervangende vooropleidingseisen.

      5 De vervangende vooropleidingseisen worden opgenomen in de onderwijs- en examenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.24
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.24
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.24
