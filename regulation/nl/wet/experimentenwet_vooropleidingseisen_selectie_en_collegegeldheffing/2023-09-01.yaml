preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ervaring op te doen met selectie van aanstaande
    studenten en extraneï en met differentiatie van collegegeld bij opleidingen in het hoger onderwijs met erkende
    evidente meerwaarde, zonder dat afbreuk wordt gedaan aan de toegankelijkheid van het hoger onderwijs;

    dat het voorts wenselijk is ervaring op te doen met het stellen van vervangende vooropleidingseisen aan aanstaande
    studenten en extraneï bij opleidingen in het hoger onderwijs met het oog op het vergroten van de instroom in het
    hoger onderwijs, zonder dat afbreuk wordt gedaan aan het niveau van die instroom;

    dat in verband hiermee een tijdelijke regeling wordt getroffen om experimenten op bovenvermelde terreinen mogelijk
    te maken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018259/2023-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. wet: de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];

      b. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;

      c. instelling: een instelling voor hoger onderwijs als bedoeld in
      [artikel 1.2, onderdelen a en b, van de wet][ref2];

      d. instellingsbestuur: het instellingsbestuur, bedoeld in [artikel 1.1, onderdeel j, van de wet][ref3];

      e. opleiding: een bachelor- of masteropleiding als bedoeld in [artikel 7.3 van de wet][ref4];

      f. voltijdse, duale of deeltijdse opleiding: een opleiding die onderscheidenlijk voltijds, duaal of deeltijds is
      ingericht;

      g. experimenteel programma: een programma binnen een bacheloropleiding als bedoeld in [artikel 5][ref5];

      h. studiejaar: het tijdvak dat aanvangt op 1 september en eindigt op 31 augustus van het daaropvolgende jaar;

      i. onderwijs- en examenregeling: de onderwijs- en examenregeling, bedoeld in [artikel 7.13 van de wet][ref6].


