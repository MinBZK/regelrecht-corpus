    text: |-
      1 Het instellingsbestuur dient een aanvraag voor een experiment als bedoeld in de [artikelen 6 tot en met 9][ref1]
      bij Onze Minister in voor een bij ministeriële regeling vast te stellen tijdstip. Een aanvraag kan op de
      studiejaren 2005–2006 en 2006–2007 betrekking hebben.

      2 Voor zover het betreft een experiment als bedoeld in [artikel 6][ref2], toont het instellingsbestuur in de
      aanvraag aan dat de vervangende vooropleidingseisen ten minste gelijkwaardig zijn aan de vooropleidingseisen,
      gesteld in [artikel 7.24, eerste en tweede lid, van de wet][ref3].

      3 Voor zover het betreft een experiment als bedoeld in de [artikelen 7 tot en met 9][ref4], toont het
      instellingsbestuur in de aanvraag aan dat het een opleiding of een experimenteel programma met evidente meerwaarde
      betreft of het experiment kan bijdragen aan de verdere ontwikkeling van evidente meerwaarde binnen die opleiding of
      een experimenteel programma.


