  - number: '38'
    text: De bevoegdheid tot het opleggen van een boete vervalt vijf jaar nadat de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel38
  - number: '39'
    text: |-
      1 Met de opsporing van de bij wettelijke regelingen op het gebied van de volksgezondheid strafbaar gestelde
      feiten zijn, naast de in [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde personen en naast
      de krachtens die wettelijke regeling aangewezen personen, belast de daartoe bij ministeriële regeling aangewezen
      personen werkzaam bij de Inspectie. Een zodanige aanwijzing wordt bekend gemaakt in de Staatscourant.

      2 Bij algemene maatregel van bestuur, kunnen regels worden gesteld omtrent de vereisten waaraan de ingevolge het
      eerste lid aangewezen personen dienen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '40'
    text: |-
      1 Handelen in strijd met de in de [artikelen 11, vijfde lid][ref1], en [13, tweede lid][ref2], vervatte
      verplichting wordt gestraft met hetzij hechtenis van ten hoogste een jaar, hetzij geldboete van ten hoogste een
      geldboete van de vijfde categorie, hetzij met beide straffen.

      2 Het in het eerste lid strafbaar gestelde feit is een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028563#Artikel13
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel40
