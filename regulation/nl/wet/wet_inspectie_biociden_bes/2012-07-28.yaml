        artikel: '9'
        hoofdstuk: '3'
  - number: '11'
    text: |-
      1 Met het toezicht op de naleving van wettelijke regelingen op het gebied van de volksgezondheid zijn, naast de
      krachtens die wettelijke regeling aangewezen personen, belast de bij ministeriële regeling aangewezen medewerkers
      van de Inspectie. Een zodanige aanwijzing wordt bekendgemaakt in de Staatscourant.

      2 Toezichthouders zijn, uitsluitend voor zover dat voor de vervulling van hun taak redelijkerwijze noodzakelijk
      is, bevoegd:

      a. alle inlichtingen te vragen;

      b. inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of
      deze daartoe tijdelijk mee te nemen;

      c. goederen aan opneming en onderzoek te onderwerpen, deze daartoe tijdelijk mee te nemen en daarvan monsters te
      nemen;

      d. alle plaatsen met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner te betreden,
      eventueel vergezeld van door hen aangewezen personen;

      e. woningen of tot woning bestemde gedeelten van vaartuigen zonder de uitdrukkelijke toestemming van de bewoner
      binnen te treden.

      3 Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.

      4 Op het binnentreden van woningen of van tot woning bestemde gedeelten van vaartuigen als bedoeld in het
      tweede lid, onderdeel e, is [Titel 4 van het Derde Boek van het Wetboek van Strafvordering BES][ref1] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 155, vierde lid][ref2], [156, tweede lid][ref3],
      [157, tweede en derde lid][ref4], [158, eerste lid, laatste zinsnede][ref5], en [160, eerste lid][ref6], en met
      dien verstande dat de machtiging wordt verleend door de procureurgeneraal.

      5 Een ieder is verplicht aan de toezichthouder alle medewerking te verlenen die op grond van het tweede lid wordt
      gevorderd.

      6 Zij die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het
      verlenen van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
