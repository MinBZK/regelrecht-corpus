  - number: '2'
    text: |-
      Er is een Inspectie voor de Volksgezondheid. Zij is gevestigd in een door Onze Minister aangewezen plaats.

      2. De Inspectie heeft tot taak:

      a. het toezicht op de naleving van de wettelijke regelingen op het gebied van bestrijdingsmiddelen,
      gewasbeschermingsmiddelen, biociden en milieuaangelegenheden;

      b. het uitbrengen, op verzoek of uit eigen beweging, van adviezen en het verstrekken van inlichtingen;

      c. de behandeling van klachten;

      d. het verrichten van andere bij of krachtens wet opgedragen taken.

      3. Ter zake van de het tweede lid bedoelde taken kunnen bij algemene maatregel van bestuur, regels worden gesteld.

      4. Onze Minister kan de Inspectie ter zake van het verrichten van de in het tweede lid bedoelde taken aanwijzingen
      geven.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel2
  - number: '3'
    text: |-
      1 Aan het hoofd van de Inspectie staat de Inspecteurgeneraal voor de volksgezondheid.

      2 Tot Inspecteurgeneraal voor de volksgezondheid kan slechts worden aangesteld degene die in het bezit is van:

      a. het Nederlands artsdiploma of van een daarmee, op grond van de op grond van het [Besluit geneeskunde BES][ref1]
      gelijkgesteld diploma; dan wel

      b. het Nederlands apothekersdiploma of van een daarmee, op grond van het [Besluit][ref2] bevoegdheid apothekers en
      apothekersassistenten, gelijkgesteld diploma.

      3 Bij algemene maatregel van bestuur wordt een plaatsvervangend Inspecteurgeneraal benoemd, deze vervangt
      de Inspecteurgeneraal bij diens afwezigheid wegens ziekte, verlof of ontstentenis. Het tweede lid is van
      overeenkomstige toepassing.

      4 De Inspecteurgeneraal neemt bij de vervulling van zijn taak de in [artikel 2, vierde lid][ref3], bedoelde
      aanwijzingen van Onze Minister in acht.


