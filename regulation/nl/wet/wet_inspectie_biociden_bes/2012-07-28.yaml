  - number: '12'
    text: |-
      1 Bij de uitoefening van hun taak dragen de toezichthouders een door Onze Minister te verstrekken legitimatiebewijs
      bij zich.

      2 Desgevraagd tonen zij hun legitimatiebewijs aanstonds.

      3 Het legitimatiebewijs bevat een foto van de toezichthouder en vermeldt in ieder geval diens naam en hoedanigheid.

      4 Bij algemene maatregel van bestuur, kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening
      van de toezichthouders.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel12
  - number: '13'
    text: |-
      1 Toezichthouders zijn bevoegd, uitsluitend voor zover dat voor de vervulling van hun taak redelijkerwijze
      noodzakelijk is, inzage te nemen in patiëntendossiers.

      2 Beheerders van de in het eerste lid bedoelde dossiers zijn verplicht aan de toezichthouder alle medewerking te
      verlenen die op grond van het eerste lid wordt gevorderd. [Artikel 11, zesde lid][ref1] is in een zodanig geval
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel11
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028563
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '14'
    text: |-
      De Inspectie is bevoegd tot het geven van aanwijzingen ten einde de naleving van de wettelijke voorschriften op het
      gebied waarvan aan de Inspectie toezichthoudende bevoegdheden zijn toegekend te garanderen.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel14
  - number: '15'
    text: |-
      De Inspectie is bevoegd tot het doen wegnemen, ontruimen, beletten, in de vorige toestand herstellen of verrichten
      van hetgeen in strijd met de in de onderscheiden wetten de volksgezondheid betreffende en de daarop berustende
      bepalingen is of wordt gedaan, gehouden of nagelaten.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel15
  - number: '16'
    text: |-
      1 Een beslissing tot toepassing van bestuursdwang wordt op schrift gesteld en geldt als een beschikking. De
      beschikking vermeldt welk voorschrift is overtreden.

      2 De bekendmaking ervan geschiedt aan de overtreder en andere rechthebbenden.

      3 In de beschikking wordt een termijn gesteld waarbinnen de overtreder en eventuele andere rechthebbenden de
      tenuitvoerlegging kunnen voorkomen door zelf de in de beschikking vermelde maatregelen te treffen. Geen termijn
      behoeft te worden gegund, indien de vereiste spoed zich daartegen verzet.

      4 Indien de situatie dermate spoedeisend is dat de Inspectie de beslissing tot toepassing van bestuursdwang niet
      tevoren op schrift kan stellen, zorgt de Inspectie alsnog zo spoedig mogelijk voor de opschriftstelling en de
      bekendmaking.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel16
  - number: '17'
    text: |-
      1 De overtreder is de kosten verbonden aan de toepassing van bestuursdwang verschuldigd, tenzij de kosten
      redelijkerwijze niet of niet geheel te zijnen laste behoren te komen.

      2 De beschikking vermeldt dat de toepassing van bestuursdwang op kosten van de overtreder plaatsvindt.

      3 Indien echter de kosten geheel of gedeeltelijk niet ten laste van de overtreder zullen worden gebracht, wordt dat
      in de beschikking vermeld.

      4 Onder de kosten worden begrepen de kosten verbonden aan de voorbereiding van bestuursdwang, voor zover deze
      kosten zijn gemaakt na het tijdstip waarop de termijn bedoeld in [artikel 16, derde lid][ref1], is verstreken.

      5 De kosten zijn ook verschuldigd indien de bestuursdwang door opheffing van de onrechtmatige situatie niet of niet
      volledig is uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel16
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028563
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '18'
    text: |-
      1 De Inspectie kan van de overtreder bij dwangbevel de verschuldigde kosten, verhoogd met de op de invordering
      vallende kosten, invorderen.

      2 Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale
      titel op in de zin van het [Wetboek van Burgerlijke Rechtsvordering BES][ref1].

      3 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      openbare lichamen Bonaire, Sint Eustatius en Saba zijn.

      4 Het verzet schorst de tenuitvoerlegging. Op verzoek van de openbare lichamen Bonaire, Sint Eustatius en Saba zijn
      kan het gerecht in eerste aanleg de schorsing van de tenuitvoerlegging opheffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: '19'
    text: |-
      De kosten verbonden aan de toepassing van bestuursdwang zijn bevoorrecht op de zaak ten aanzien waarvan zij zijn
      besteed en worden na de kosten, bedoeld in [artikel 284 van het Burgerlijk Wetboek BES][ref1], uit de opbrengst van
      de zaak betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel284
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '284'
  - number: '20'
    text: |-
      Om aan een beslissing van bestuursdwang uitvoering te geven, komen de personen die daartoe door de Inspectie zijn
      aangewezen, de bevoegdheden toe, genoemd in [artikel 11, tweede en derde lid][ref1]. Artikel 11, vierde lid, is
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel11
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel20
