  - number: '26'
    text: |-
      1 De Inspectie kan op verzoek van de overtreder de last opheffen, de looptijd ervan opschorten voor een bepaalde
      termijn of de dwangsom verminderen ingeval van blijvende of tijdelijke gehele of gedeeltelijke onmogelijkheid voor
      de overtreder om aan zijn verplichtingen te voldoen.

      2 De Inspectie kan op verzoek van de overtreder de last opheffen indien de beschikking een jaar van kracht is
      geweest zonder dat de dwangsom is verbeurd.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel26
  - number: '27'
    text: |-
      1 De bevoegdheid tot invordering van verbeurde bedragen verjaart door verloop van een jaar na de dag waarop zij
      zijn verbeurd.

      2 De verjaring wordt gestuit door faillissement en ieder wettelijk beletsel voor invordering van de dwangsom.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel27
  - number: '28'
    text: |-
      1 Ingeval van overtreding van de bij of krachtens de onderscheiden wetten de volksgezondheid betreffende gegeven
      voorschriften alsmede van de [artikelen 11, vijfde lid][ref1], en [13, tweede lid][ref2], van deze wet kan de
      Inspectie aan de overtreder een boete opleggen van ten hoogste een geldboete van de zesde categorie.

      2 De hoogte van de boete wordt in ieder geval afgestemd op de ernst en de duur van de overtreding, alsmede op de
      mate waarin de overtreder daarvan een verwijt kan worden gemaakt.

      3 De bevoegdheid tot het opleggen van een boete vervalt indien ter zake van de overtreding op grond waarvan
      de boete kan worden opgelegd, tegen de overtreder een strafvervolging is ingesteld en het onderzoek ter
      terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvervolging is vervallen ingevolge
      [artikel 76 van het Wetboek van Strafrecht BES][ref3].

      4 Het recht tot strafvervolging vervalt indien de Inspecteurgeneraal aan de betrokkene ter zake van hetzelfde feit
      reeds een boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028563#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel76
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel28
    references:
