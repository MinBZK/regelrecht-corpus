        hoofdstuk: '4'
        paragraaf: '1'
  - number: '21'
    text: |-
      Tot de bevoegdheid tot toepassing van bestuursdwang behoort het verzegelen van gebouwen, terreinen en hetgeen zich
      daarin of daarop bevindt.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel21
  - number: '22'
    text: |-
      1 Tot de bevoegdheid tot toepassing van bestuursdwang behoort het meevoeren en opslaan van daarvoor vatbare zaken
      voor zover de toepassing van bestuursdwang dit vereist.

      2 Indien zaken zijn meegevoerd en opgeslagen, doet de Inspectie daarvan procesverbaal opmaken, waarvan afschrift
      wordt verstrekt aan de rechthebbende.

      3 De Inspectie draagt zorg voor de bewaring van de opgeslagen zaken en geeft deze zaken terug aan de rechthebbende,
      zodra dat redelijkerwijze nodig is.

      4 De Inspectie is bevoegd de afgifte op te schorten totdat de verschuldigde kosten zijn voldaan.

      5 Indien de rechthebbende niet tevens de overtreder is, is de Inspectie bevoegd de afgifte op te schorten totdat de
      kosten van bewaring zijn voldaan.

      6 De openbare lichamen Bonaire, Sint Eustatius en Saba zijn niet aansprakelijk voor afgifte van het opgeslagene aan
      een onbevoegde.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel22
  - number: '23'
    text: |-
      1 De Inspectie is bevoegd indien een opgeslagen zaak niet binnen dertien weken na de opslag kan worden teruggegeven
      aan de rechthebbende, deze te doen verkopen of, indien verkoop naar zijn oordeel niet mogelijk is, de zaak om niet
      aan een derde in eigendom over te dragen of te laten vernietigen.

      2 Gelijke bevoegdheid heeft de Inspectie ook binnen die termijn zodra de aan de toepassing van bestuursdwang
      verbonden kosten vermeerderd met de voor de verkoop, de eigendomsoverdracht om niet of de vernietiging geraamde
      kosten, in verhouding tot de waarde van de zaak onevenredig hoog worden.

      3 Verkoop, eigendomsoverdracht of vernietiging vindt niet plaats binnen twee weken na de verstrekking van het
      afschrift van het procesverbaal betreffende het meevoeren en opslaan, tenzij het gevaarlijke stoffen of eerder aan
      bederf onderhevige stoffen betreft.

      4 Gedurende drie jaren na het tijdstip van verkoop heeft degene die op dat tijdstip rechthebbende was, recht op de
      opbrengst van het goed onder aftrek van de aan de toepassing van bestuursdwang verbonden kosten en de kosten van de
      verkoop. Indien de rechthebbende niet tevens de overtreder is, wordt van de opbrengst de kosten van bestuursdwang
      niet in mindering gebracht.

      5 De openbare lichamen Bonaire, Sint Eustatius en Saba zijn niet aansprakelijk voor afgifte van de opbrengst uit de
      verkoop aan een onbevoegde.

      6 Bij algemene maatregel van bestuur, kunnen regels worden gesteld ter zake van het in het eerste lid bedoelde in
      eigendom overdragen aan een derde.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel23
  - number: '24'
    text: |-
      1 De Inspectie kan in plaats van het uitoefenen van bestuursdwang aan de overtreder een last onder dwangsom
      opleggen, die ertoe strekt de overtreding ongedaan te maken dan wel een herhaling van de overtreding te voorkomen.

      2 Een last onder dwangsom wordt niet opgelegd indien het belang dat het betrokken voorschrift beoogt te beschermen
      zich daartegen verzet.

      3 De Inspectie stelt de dwangsom vast hetzij op een bedrag ineens hetzij op een bedrag per tijdseenheid waarin de
      last niet is uitgevoerd of op een bedrag per overtreding van de last. De Inspectie stelt tevens een bedrag vast
      waarboven geen dwangsom meer wordt verbeurd. Het vastgestelde bedrag van de dwangsom dient in redelijke verhouding
      te staan tot de zwaarte van het geschonden belang en de beoogde werking van de dwangsomoplegging.

      4 In de beschikking tot oplegging van een last onder dwangsom die strekt tot het ongedaan maken of het beëindigen
      wordt een termijn gesteld gedurende welke de overtreder de last kan uitvoeren zonder dat een dwangsom wordt
      verbeurd.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel24
  - number: '25'
    text: |-
      1 Verbeurde dwangsommen komen toe aan de openbare lichamen Bonaire, Sint Eustatius en Saba zijn. De Inspectie kan
      bij dwangbevel het verschuldigde bedrag invorderen.

      2 [Artikel 18, tweede, derde en vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel18
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel25
