      1 Bij algemene maatregel van bestuur, wordt de Inspectie in onderdelen verdeeld. Ieder onderdeel wordt belast met
      een of meer delen van de taak, genoemd in [artikel 2][ref1].

      2 Aan het hoofd van elk onderdeel staat een inspecteur.

      3 Bij algemene maatregel van bestuur, worden regels gegeven over de opleidingseisen waaraan een inspecteur moet
      voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel2
