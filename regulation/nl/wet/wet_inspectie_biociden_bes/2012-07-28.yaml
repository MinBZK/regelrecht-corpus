      - id: ref3
        bwb_id: BWBR0028570
        artikel: '76'
  - number: '29'
    text: |-
      1 Met het onderzoek zijn belast de personen bedoeld in [artikel 11, eerste lid][ref1].

      2 Ten dienste van het onderzoek beschikken zij over de bevoegdheden die hun in deze paragraaf worden toegekend,
      alsmede, met inachtneming van de daaraan in deze paragraaf gestelde beperkingen, over de bevoegdheden die hun zijn
      toegekend ter uitoefening van het toezicht, bedoeld in [artikel 11, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028563#Artikel11
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028563
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028563
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '30'
    text: |-
      Indien de personen, bedoeld in [artikel 11, eerste lid][ref1], een redelijk vermoeden hebben dat een bepaalde
      natuurlijke persoon of rechtspersoon een overtreding heeft begaan, is er geen verplichting aan de zijde van die
      natuurlijke persoon of rechtspersoon ter zake een verklaring af te leggen. De betrokkenen worden hiervan in kennis
      gesteld voordat hun mondeling ter zake om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel11
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028563
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '31'
    text: |-
      1 Een persoon als bedoeld in [artikel 11, eerste lid][ref1], die vaststelt dat een overtreding is begaan, maakt
      daarvan een rapport op.

      2 In het rapport worden in ieder geval vermeld:

      a. de feiten en omstandigheden op grond waarvan is vastgesteld dat een overtreding is begaan;

      b. waar en wanneer de feiten, bedoeld onder a, zich hebben voorgedaan;

      c. het overtreden wettelijk voorschrift.

      3 Een kopie van het rapport wordt gezonden aan degene die de overtreding heeft begaan.

      4 Op verzoek van de belanghebbende die het rapport wegens zijn gebrekkige kennis van de Nederlandse taal
      onvoldoende begrijpt, draagt de Inspecteurgeneraal er zoveel mogelijk zorg voor dat de inhoud van het rapport aan
      de betrokkene wordt meegedeeld in een voor hem begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel11
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0028563
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '32'
    text: |-
      1 De belanghebbende wordt schriftelijk opgeroepen om naar keuze schriftelijk of mondeling zijn zienswijze naar
      voren te brengen omtrent het in [artikel 31, eerste lid][ref1], bedoelde rapport.

      2 Indien de belanghebbende zijn zienswijze mondeling naar voren brengt, draagt de Inspectie er op verzoek van
      de belanghebbende die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die de
      belanghebbende bij het horen kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel31
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028563
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '33'
    text: |-
      1 Een boete wordt opgelegd bij beschikking van de Inspectie.

      2 In de beschikking worden in ieder geval vermeld:

      a. de te betalen geldsom, alsmede een toelichting op de hoogte daarvan;

      b. de overtreding terzake waarvan zij is gegeven, alsmede het overtreden voorschrift.

      3 Op verzoek van de belanghebbende die de beschikking wegens zijn gebrekkige kennis van de Nederlandse taal
      onvoldoende begrijpt, draagt de Inspectie er zoveel mogelijk zorg voor dat de inhoud van de beschikking aan de
      betrokkene wordt meegedeeld in een voor hem begrijpelijke taal

      4 De beschikking dient te worden gegeven binnen twaalf weken nadat het rapport, bedoeld in
      [artikel 31, eerste lid][ref1], is opgemaakt, tenzij binnen deze termijn het rapport aan het openbaar Ministerie
      is gezonden. In dat geval kan een boete worden opgelegd binnen twaalf weken nadat het openbaar Ministerie aan de
      Inspectie heeft meegedeeld dat geen strafvervolging wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel31
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028563
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '34'
    text: |-
      De werkzaamheden die verband houden met de uitvoering van de [artikelen 32][ref1] en [33][ref2] worden verricht
      door personen die niet betrokken zijn geweest bij de opstelling van het in [artikel 31][ref3] bedoelde rapport en
      het daaraan voorafgaande onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0028563#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0028563#Artikel31
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel34
