  - number: '8'
    text: |-
      Het bestuurscollege verstrekt de Inspecteurgeneraal alle het bestuurscollege bekend zijnde gegevens inzake de
      volksgezondheid bedreigende situaties in het desbetreffende openbaar lichaam Bonaire, Sint Eustatius en Saba
      alsmede inzake situaties waarbij de gezondheid van een of meer personen in dat openbaar lichaam Bonaire, Sint
      Eustatius en Saba op bijzondere wijze in het geding is.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel8
  - number: '9'
    text: |-
      Het bestuurscollege verstrekt de Inspecteurgeneraal alle door deze verlangde inlichtingen met betrekking tot de
      naleving van de wettelijke regelingen op het gebied voor de volksgezondheid, waarvan de uitvoering is opgedragen
      aan organen en diensten van het desbetreffende openbaar lichaam Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel9
  - number: '10'
    text: |-
      1 Indien de Inspecteurgeneraal van mening is dat de uitvoering van een wettelijke regeling als bedoeld in
      [artikel 9][ref1] onvoldoende is, geeft hij het bestuurscollege daarvan kennis onder vermelding van de maatregelen
      die getroffen dienen te worden.

      2 Indien de in het eerste lid bedoelde maatregelen niet worden getroffen, dan stelt de inspecteur de gezaghebber
      daarvan in kennis met het verzoek alsnog op grond van artikel 68, tweede lid, van de Eilandenregeling Nederlandse
      Antillen, daarin te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel9
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel10
    references:
