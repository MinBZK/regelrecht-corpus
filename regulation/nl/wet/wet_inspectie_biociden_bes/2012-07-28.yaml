  - number: '5'
    text: |-
      1 Bij elk onderdeel kunnen een of meer adjunct inspecteurs worden benoemd.

      2 Bij algemene maatregel van bestuur, worden regels gegeven over de opleidingseisen waaraan een adjunct inspecteur
      moet voldoen.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel5
  - number: '6'
    text: |-
      Bij algemene maatregel van bestuur, kunnen nadere voorschriften worden gegeven omtrent de taak, de bevoegdheid en
      de werkzaamheden van de Inspecteurgeneraal, de inspecteurs, de adjunct inspecteurs en het overige personeel van
      de Inspectie.
    url: https://wetten.overheid.nl/BWBR0028563/2012-07-28#Artikel6
  - number: '7'
    text: |-
      1 Op verzoek van de Inspecteurgeneraal kan Onze Minister het bestuurscollege van het openbaar lichaam Bonaire,
      Sint Eustatius of Saba verzoeken personeel ter beschikking te stellen aan de Inspectie, ter uitoefening van
      nader omschreven inspectiewerkzaamheden op dit openbaar lichaam, onder leiding en verantwoordelijkheid van
      de Inspecteurgeneraal dan wel, indien een inspecteur is aangesteld, van die inspecteur. Het desbetreffende
      bestuurscollege verleent zoveel mogelijk de gevraagde medewerking.

      2 In geval het eerste lid toepassing vindt, zijn de [artikelen 12][ref1] en [13][ref2] op de ter beschikking
      gestelde personen van overeenkomstige toepassing.

      3 Het bestuurscollege van een openbaar lichaam Bonaire, Sint Eustatius en Saba kan Onze Minister benaderen met het
      verzoek de Inspecteurgeneraal te verzoeken een nader omschreven inspectieonderzoek te verrichten in dit openbaar
      lichaam Bonaire, Sint Eustatius en Saba. Onze Minister verleent zoveel mogelijk de gevraagde medewerking.


      [ref1]: https://wetten.overheid.nl/BWBR0028563#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028563#Artikel13
