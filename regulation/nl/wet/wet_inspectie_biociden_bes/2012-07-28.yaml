      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister, bedoeld in [artikel 1 van de Wet gewasbeschermingsmiddelen en biociden][ref1];
        - *Inspectie:* de Inspectie voor de Volksgezondheid, bedoeld in [artikel 2, eerste lid][ref2];
        - *Inspecteurgeneraal:* de Inspecteurgeneraal voor de volksgezondheid, bedoeld in [artikel 3, eerste lid][ref3];
        - *inspecteur:* de inspecteur voor de volksgezondheid, bedoeld in [artikel 4, tweede lid][ref4];


