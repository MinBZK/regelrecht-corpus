  - number: '15'
    text: |-
      De bekostiging van een onderwijsvoorziening als bedoeld in
      [artikel 72, derde lid, onderdelen c tot en met f, van de wet][ref1], vangt aan op 1 augustus van het kalenderjaar
      volgend op de aanvraag of op 1 augustus van een later kalenderjaar indien het bevoegd gezag daarom heeft verzocht,
      met dien verstande dat de bekostiging niet later aanvangt dan op 1 augustus volgend op het verstrijken van de
      looptijd van het desbetreffende regionaal plan onderwijsvoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0024261/2016-08-01#Artikel15
