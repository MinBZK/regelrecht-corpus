        artikel: '72'
  - number: '16'
    text: |-
      1 De Minister kan aanvullende bekostiging verstrekken aan bevoegde gezagsorganen die een regionaal plan
      onderwijsvoorzieningen als bedoeld in [artikel 72, tweede lid, van de wet][ref1], voorbereiden.

      2 De aanvullende bekostiging, bedoeld in het eerste lid, kan door één van de betrokken bevoegde gezagsorganen
      worden aangevraagd. De aanvraag wordt ingediend voor 1 augustus 2010.

      3 De aanvraag gaat vergezeld van een door betrokken bevoegde gezagsorganen ondertekende intentieverklaring om tot
      een regionaal plan onderwijsvoorzieningen te komen.

      4 De aanvullende bekostiging geldt slechts voor de vestigingen van scholen of scholengemeenschappen van betrokken
      bevoegde gezagsorganen die gelegen zijn binnen de beoogde regio. Een vestiging van een school of scholengemeenschap
      kan slechts éénmaal voor de aanvullende bekostiging in aanmerking komen.

      5 De aanvullende bekostiging bedraagt per regionaal plan onderwijsvoorzieningen € 6000,–, per school of
      scholengemeenschap € 1000,– en per leerling van een vestiging als bedoeld in het vierde lid € 1,–.

      6 Verrekening van eventueel niet bestede middelen of overschotten vindt niet plaats.

      7 De verklaring van de accountant bij de jaarrekening van de school of scholengemeenschap waarvan het bevoegd
      gezag de aanvullende bekostiging heeft aangevraagd omvat tevens een oordeel over de rechtmatige besteding van de
      aanvullende bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel72
    url: https://wetten.overheid.nl/BWBR0024261/2016-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '72'
  - number: '17'
    text: |-
      Indien het bij koninklijke boodschap van 14 december 2007 ingediende voorstel van wet tot wijziging van onder meer
      de Wet op het voortgezet onderwijs ter modernisering, vereenvoudiging en beperking van de wettelijke regels over
      de voorzieningenplanning bij scholen (Kamerstukken II 2007/08, 31 310, nr. 2) nadat het tot wet is verheven, in
      werking treedt, treedt deze regeling op hetzelfde tijdstip in werking.
    url: https://wetten.overheid.nl/BWBR0024261/2016-08-01#Artikel17
  - number: '18'
    text: 'Deze regeling wordt aangehaald als: Regeling voorzieningenplanning VO.'
    url: https://wetten.overheid.nl/BWBR0024261/2016-08-01#Artikel18
