  - number: '5'
    text: |-
      1 Het bevoegd gezag dat gerechtigd is tot het verzorgen van leerwegondersteunend onderwijs, kan bij de Minister een
      aanvraag indienen om dit onderwijs in meer leerwegen of op meer vestigingen te kunnen verzorgen.

      2 Het bevoegd gezag maakt bij de aanvraag gebruik van het aanvraagformulier dat is opgenomen in [bijlage 5][ref1].

      3 De aanvraag gaat vergezeld van een document waaruit blijkt dat de meerderheid van de bevoegde gezagsorganen van
      de overige scholen en scholengemeenschappen in het desbetreffende samenwerkingsverband instemt met de aanvraag.

      4 Indien het samenwerkingsverband op grond van [artikel 17a.1, tweede lid, van de wet][ref2] een bevoegd gezag
      dat gerechtigd is tot het verzorgen van leerwegondersteunend onderwijs voordraagt om in aanmerking te komen om
      dit onderwijs in meer leerwegen of op meer vestigingen te kunnen verzorgen, geldt in plaats van het eerste tot
      en met het derde lid dat het samenwerkingsverband gebruik maakt van het aanvraagformulier dat is opgenomen in
      [bijlage 8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024261
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0024261
