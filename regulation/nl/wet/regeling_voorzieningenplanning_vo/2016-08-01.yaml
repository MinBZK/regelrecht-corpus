      1 De methodiek voor het opstellen van de leerlingprognose die voor stichting van een school,
      scholengemeenschap of profiel vereist is op grond van de [artikelen 65, eerste en tweede lid][ref1], en
      [68, eerste lid, van de wet][ref2], wordt vastgesteld overeenkomstig [bijlage 1][ref3].

      2 Het bevoegd gezag maakt bij de aanvraag gebruik van het aanvraagformulier dat is opgenomen in [bijlage 2][ref4].

      3 Indien het de stichting van een nieuwe school, scholengemeenschap of profiel gebaseerd op de methodiek van een
      directe meting betreft, stuurt het bevoegd gezag de directe meting mee met de aanvraag.


