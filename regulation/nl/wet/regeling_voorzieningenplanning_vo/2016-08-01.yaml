      Het bevoegd gezag dat een vestiging van een school of scholengemeenschap verplaatst over een hemelsbreed gemeten
      afstand van minder dan drie kilometer van de vorige vestigingsplaats, doet hiervan schriftelijk melding aan de
      Dienst Uitvoering Onderwijs uiterlijk vier maanden voorafgaande aan de daadwerkelijke verplaatsing.
    url: https://wetten.overheid.nl/BWBR0024261/2016-08-01#Artikel10
