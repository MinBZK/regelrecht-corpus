  - number: '4'
    text: |-
      1 De Minister kan op aanvraag van het bevoegd gezag leerwegondersteunend onderwijs als bedoeld in
      [artikel 69 van de wet][ref1] voor bekostiging in aanmerking brengen, indien redelijkerwijs kan worden
      aangenomen dat dit onderwijs zal worden gevolgd door ten minste 40 leerlingen. Indien het betreft een school of
      scholengemeenschap op de Waddeneilanden, kan de Minister ten gunste van het bevoegd gezag afwijken van het vereiste
      aantal leerlingen, genoemd in de eerste volzin.

      2 De methodiek voor het opstellen van de prognose, vereist op grond van het eerste lid, wordt vastgesteld
      overeenkomstig [bijlage 4][ref2].

      3 Het bevoegd gezag maakt bij de aanvraag gebruik van het aanvraagformulier dat is opgenomen in [bijlage 5][ref3].

      4 De aanvraag gaat vergezeld van een document waaruit blijkt dat de meerderheid van de bevoegde gezagsorganen van
      de overige scholen en scholengemeenschappen in het desbetreffende samenwerkingsverband instemt met de aanvraag.

      5 Indien het samenwerkingsverband op grond van [artikel 17a.1, tweede lid, van de wet][ref4] een school voordraagt
      om in aanmerking te brengen voor bekostiging van leerwegondersteunend onderwijs geldt in plaats van het eerste
      tot en met het vierde lid dat het samenwerkingsverband gebruik maakt van het aanvraagformulier dat is opgenomen
      in [bijlage 8][ref5].


