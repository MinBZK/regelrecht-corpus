    Handelende in overeenstemming met de Minister van Landbouw, Natuur en Voedselkwaliteit,

    Gelet op de artikelen 71, tweede lid, 72, derde lid, 76 en 85a van de Wet op het voortgezet onderwijs;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024261/2016-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      agrarisch opleidingscentrum: agrarisch opleidingscentrum als bedoeld in
      [artikel 1.3.3 van de Wet educatie en beroepsonderwijs][ref1];

      bevoegd gezag: het bevoegd gezag bedoeld in [artikel 1 van de wet][ref2] en wat betreft het
      voorbereidend beroepsonderwijs in een agrarisch opleidingscentrum het bevoegd gezag bedoeld in
      [artikel 1.1.1, onderdeel w, van de Wet educatie en beroepsonderwijs][ref3];

      Minister: de Minister van Onderwijs, Cultuur en Wetenschap of, voor zover het betreft het onderwijs op het gebied
      van landbouw, natuurlijke omgeving en voedsel, de Minister van Economische Zaken;

      profiel: profiel als bedoeld in [artikel 10b, derde lid][ref4], of [10d, derde lid, van de wet][ref5];

      samenwerkingsverband: een samenwerkingsverband als bedoeld in [artikel 1 van de wet][ref6];

      school: een school als bedoeld in [artikel 1 van de wet][ref7];

      scholengemeenschap: een scholengemeenschap als bedoeld in [artikel 16, eerste lid, van de wet][ref8];

      tijdelijke nevenvestiging: een tijdelijke nevenvestiging als bedoeld in [artikel 16, tweede lid, van de wet][ref9];

      wet: de [Wet op het voortgezet onderwijs][ref10].


