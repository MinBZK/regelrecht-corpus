  - number: '6'
    text: |-
      1 Het bevoegd gezag kan een aanvraag voor een omzetting als bedoeld in [artikel 70, eerste lid, van de wet][ref1],
      indienen voor 1 november van enig kalenderjaar.

      2 De Minister besluit voor 1 mei volgend op de aanvraag. Indien het besluit niet voor 1 mei genomen kan worden,
      stelt de Minister het bevoegd gezag daarvan in kennis en noemt hij daarbij een termijn waarbinnen het besluit wel
      tegemoet kan worden gezien.

      3 De aanvraag gaat vergezeld van een advies van gedeputeerde staten over de voorgenomen omzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel70
    url: https://wetten.overheid.nl/BWBR0024261/2016-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '70'
  - number: '7'
    text: |-
      Het bevoegd gezag meldt voor 1 april van enig kalenderjaar schriftelijk aan de Dienst Uitvoering Onderwijs het
      voornemen van de omzetting van een bijzondere school in een school van een andere richting per 1 augustus van dat
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0024261/2016-08-01#Artikel7
  - number: 7a
    text: |-
      Het bevoegd gezag meldt voor 1 april van enig kalenderjaar schriftelijk aan de Minister het voornemen van de
      omzetting van een bijzondere school in een openbare school per 1 augustus van dat kalenderjaar. Bij de melding
      toont het bevoegd gezag aan dat het overleg heeft gevoerd met burgemeester en wethouders van de betreffende
      gemeente.
    url: https://wetten.overheid.nl/BWBR0024261/2016-08-01#Artikel7a
  - number: '8'
    text: |-
      Het percentage, bedoeld in [artikel 71, tweede lid, onderdelen a en b, van de wet][ref1], bedraagt twintig.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel71
