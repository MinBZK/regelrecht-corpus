  - number: '9'
    text: |-
      1 Het bevoegd gezag meldt het voornemen tot ingebruikname van een tijdelijke nevenvestiging schriftelijk
      aan de Dienst Uitvoering Onderwijs uiterlijk vier maanden voorafgaande aan de datum van de feitelijke
      ingebruikname. Bij die melding wordt aangegeven voor welke hoofdvestiging of nevenvestiging, bedoeld in
      [artikel 16, tweede lid, van de wet][ref1], de tijdelijke nevenvestiging in de tijdelijke huisvestingsbehoefte
      voorziet.

      2 De melding gaat vergezeld van een document waaruit blijkt dat burgemeester en wethouders van de desbetreffende
      gemeente met ingang van de datum van de feitelijke ingebruikname als bedoeld in het eerste lid de benodigde
      huisvesting ter beschikking zullen stellen.

      3 In afwijking van het tweede lid doet het bevoegd gezag van een school waarvoor jaarlijks een bedrag voor
      huisvestingskosten wordt betaald op grond van [artikel 76v van de wet][ref2] of van een scholengemeenschap als
      bedoeld in [artikel 2.6, eerste lid, van de Wet educatie en beroepsonderwijs][ref3], de melding vergezeld gaan van
      een document waaruit blijkt:

      a. dat er bij de desbetreffende hoofdvestiging of nevenvestiging sprake is van tijdelijke huisvestingsbehoefte
      voor een periode van korter dan vijftien jaar, gelet op de prognose van het aantal leerlingen van de desbetreffende
      hoofdvestiging of nevenvestiging voor vijftien jaar en de normen voor de huisvesting zoals opgenomen in het
      [Uitvoeringsbesluit voorzieningen in de huisvesting PO/VO][ref4], en

      b. dat er met ingang van de datum van de feitelijke ingebruikname huisvesting voor de desbetreffende tijdelijke
      nevenvestiging beschikbaar is.

      4 Bij de prognose, bedoeld in het derde lid, wordt uitgegaan van de gegevens, vermeld onder punten A tot en met D,
      van [bijlage 1][ref5].


