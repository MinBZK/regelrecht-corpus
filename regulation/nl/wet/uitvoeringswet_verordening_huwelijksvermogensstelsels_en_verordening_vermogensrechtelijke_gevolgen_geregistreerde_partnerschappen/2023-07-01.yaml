  - number: '4'
    text: |-
      1 Op de verklaring van uitvoerbaarheid van een authentieke akte als bedoeld in artikel 59
      van de verordening zijn de [artikelen 2][ref1] en [3][ref2] van overeenkomstige toepassing.
      [Artikel 993 van het Wetboek van Burgerlijke Rechtsvordering][ref3] is niet van toepassing.

      2 De instantie, bedoeld in artikel 58, eerste lid, tweede volzin, en in artikel 59, tweede lid, van de verordening,
      is de notaris die de authentieke akte heeft verleden of de notaris die zijn protocol heeft overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0041407#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0041407#Artikel3
