preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat wetgeving nodig is ter uitvoering van de Verordening (EU)
    nr. 2016/1103 van de Raad van 24 juni 2016 tot uitvoering van de nauwere samenwerking op het gebied van de
    bevoegdheid, het toepasselijke recht en de erkenning en tenuitvoerlegging van beslissingen op het gebied van
    huwelijksvermogensstelsels (PbEU 2016, L 183) en de Verordening (EU) nr. 2016/1104 van de Raad van 24 juni 2016 tot
    uitvoering van de nauwere samenwerking op het gebied van de bevoegdheid, het toepasselijke recht en de erkenning
    en tenuitvoerlegging van beslissingen op het gebied van de vermogensrechtelijke gevolgen van geregistreerde
    partnerschappen (PbEU 2016, L 183);

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0041407/2023-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder «de verordening»:

      a. de Verordening (EU) nr. 2016/1103 van de Raad van 24 juni 2016 tot uitvoering van de nauwere samenwerking op
      het gebied van de bevoegdheid, het toepasselijke recht en de erkenning en tenuitvoerlegging van beslissingen op het
      gebied van huwelijksvermogensstelsels (PbEU 2016, L 183), of

      b. de Verordening (EU) nr. 2016/1104 van de Raad van 24 juni 2016 tot uitvoering van de nauwere samenwerking op
      het gebied van de bevoegdheid, het toepasselijke recht en de erkenning en tenuitvoerlegging van beslissingen op het
      gebied van de vermogensrechtelijke gevolgen van geregistreerde partnerschappen (PbEU 2016, L 183).
    url: https://wetten.overheid.nl/BWBR0041407/2023-07-01#Artikel1
  - number: '2'
    text: |-
      1 De verklaring van uitvoerbaarheid, bedoeld in artikel 42 van de verordening, wordt bij verzoek gevraagd aan de
      voorzieningenrechter. De [artikelen 985 tot en met 990 van het Wetboek van Burgerlijke Rechtsvordering][ref1] zijn
      niet van toepassing.

      2 Voor de indiening van het verzoek is de bijstand van een advocaat niet vereist.

      3 Het verzoek wordt in de Nederlandse taal gesteld, onverminderd [artikel 15 van de Wet gebruik Friese taal][ref2].

      4 Onverminderd het bepaalde in artikel 46 van de verordening wordt bij ongenoegzaamheid van de bij het verzoek
      overgelegde documenten, aan de verzoeker de gelegenheid tot aanvulling gegeven.

      5 Inwilliging van het verzoek geschiedt in de vorm van een eenvoudig verlof, dat op het overgelegde afschrift van
      de beslissing wordt gesteld.

      6 Voor de toepassing van de [Wet griffierechten burgerlijke zaken][ref3] wordt het verzoek geacht een verzoek van
      onbepaalde waarde te zijn.

      7 Op het verzoek tot erkenning, bedoeld in hoofdstuk IV van de verordening, zijn de voorgaande leden van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel985
      [ref2]: https://wetten.overheid.nl/BWBR0034047#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0041407/2023-07-01#Artikel2
