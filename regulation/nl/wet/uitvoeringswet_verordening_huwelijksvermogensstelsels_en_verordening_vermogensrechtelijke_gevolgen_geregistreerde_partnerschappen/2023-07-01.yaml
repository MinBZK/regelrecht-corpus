  - number: '3'
    text: |-
      1 De rechtbank waarvan de voorzieningenrechter op het verzoek om erkenning of de verklaring van
      uitvoerbaarheid heeft beslist, neemt kennis van het rechtsmiddel, bedoeld in artikel 49 van de verordening.
      [Artikel 93 van het Wetboek van Burgerlijke Rechtsvordering][ref1] is niet van toepassing.

      2 Het rechtsmiddel, bedoeld in artikel 49 van de verordening, wordt, indien het wordt ingesteld door de verzoeker,
      ingesteld binnen 30 dagen na de dagtekening van de beschikking waarbij het verlof is geweigerd.

      3 Het rechtsmiddel bedoeld in artikel 50 van de verordening is: beroep in cassatie.

      4 Het rechtsmiddel bedoeld in artikel 49 van de verordening en het rechtsmiddel bedoeld in artikel 50 van de
      verordening, worden ingesteld en behandeld met toepassing van de regels voor de verzoekprocedure in eerste aanleg
      onderscheidenlijk in cassatie.

      5 Voor de toepassing van de [Wet griffierechten in burgerlijke zaken][ref2] wordt het bij een rechtsmiddel
      ingestelde verzoek geacht een verzoek van onbepaalde waarde te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0028899
