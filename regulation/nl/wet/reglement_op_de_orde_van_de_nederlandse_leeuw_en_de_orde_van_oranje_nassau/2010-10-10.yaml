      1 Een voorstel tot verlening van een onderscheiding aan een in Nederland verblijvende buitenlandse diplomaat
      of buitenlandse militair of een in het buitenland verblijvende persoon, wordt gericht aan Onze Minister van
      Buitenlandse Zaken. Deze zendt het voorstel voor advies aan het Kapittel. [Artikel 9][ref1], vierde tot en met
      zevende lid, is van toepassing, met dien verstande dat in het geval van een buitenlandse militair de voordracht
      geschiedt door Onze Minister van Buitenlandse Zaken in overeenstemming met Onze Minister van Defensie.


