  - number: '14'
    text: |-
      1 De volgende personen worden geacht aan een of meer van de in [artikel 2][ref1] genoemde criteria te voldoen:

      a. de leden van de Staten-Generaal en van de Staten van Aruba, Curaçao of Sint Maarten die ten minste tweemaal zijn
      herkozen en ten minste tien jaren zitting hebben gehad;

      b. de Nederlandse leden van het Europees Parlement die ten minste een maal zijn herkozen en ten minste tien jaren
      zitting hebben gehad;

      c. de leden van provinciale staten, van gemeenteraden en de leden van een commissie als bedoeld in
      [artikel 87, eerste lid, van de Gemeentewet][ref2] en de leden van de eilandsraden die ten minste twaalf jaren
      zitting hebben gehad;

      d. de ministers en staatssecretarissen van de landen van het Koninkrijk die hun ambt ten minste een jaar hebben
      bekleed.

      2 Indien personen als bedoeld in het eerste lid, onderdelen a, b en c, niet voldoen aan de daarin gestelde
      vereisten, worden zij geacht aan een of meer van de in [artikel 2][ref3] genoemde criteria te voldoen, indien
      zij ten minste twaalf jaren zitting hebben gehad in twee of meer verschillende van de in de onderdelen a, b of c
      genoemde organen.

      3 Een voordracht tot verlening van een onderscheiding aan een persoon die ingevolge het eerste lid, onderdeel
      a, b of c, dan wel het tweede lid, geacht wordt aan een of meer van de in [artikel 2][ref4] genoemde criteria te
      voldoen, wordt niet eerder gedaan dan nadat de te onderscheiden persoon is afgetreden.

      4 Een voordracht tot verlening van een onderscheiding aan een minister of staatssecretaris die ingevolge het eerste
      lid, onderdeel d, geacht wordt aan een of meer van de in [artikel 2][ref5] genoemde criteria te voldoen, wordt
      gedaan door Onze Minister-President. De voordracht wordt niet eerder gedaan dan nadat de te onderscheiden persoon
      zijn ambt heeft neergelegd.

      [Artikel 9, zevende lid][ref6], is van toepassing.

      5 Een voordracht tot verlening van een onderscheiding aan een minister of staatssecretaris van Aruba, Curaçao of
      Sint Maarten die ingevolge het eerste lid, onderdeel d, geacht wordt aan een of meer van de in [artikel 2][ref7]
      genoemde criteria te voldoen, wordt gedaan door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties na
      overleg met Onze Minister-President van Aruba, Curaçao respectievelijk Sint Maarten. De voordracht wordt niet
      eerder gedaan dan nadat de te onderscheiden persoon zijn ambt heeft neergelegd. [Artikel 9, zevende lid][ref8], is
      van toepassing.


