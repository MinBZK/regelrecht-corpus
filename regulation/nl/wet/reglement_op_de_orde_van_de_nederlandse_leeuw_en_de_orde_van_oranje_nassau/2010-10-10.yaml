  - number: '19'
    text: |-
      1 De [hoofdstukken I][ref1] en [III][ref2] zijn niet van toepassing op de behandeling van een voorstel tot
      verlening van een onderscheiding indien daarmee wordt beoogd een onderscheiding uit te doen reiken op een tijdstip
      gelegen voor de uitreiking ter gelegenheid van de dag waarop de verjaardag van de Koning wordt gevierd in 1996.

      2 Indien omtrent een voorstel als bedoeld in het eerste lid besloten wordt dat de datum van uitreiking zal zijn
      gelegen op of na de uitreiking ter gelegenheid van de dag waarop de verjaardag van de Koning wordt gevierd in 1996,
      wordt het voorstel overeenkomstig de [hoofdstukken I][ref3] en [III][ref4] behandeld.


