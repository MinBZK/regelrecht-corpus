  - number: '7'
    text: |-
      De uit te reiken onderscheidingstekens zijn voor de onderscheiden graden van:

      a. Ridder Grootkruis:

      1°. het versiersel waarvan het kruis een diameter heeft van 60 millimeter, hangende aan het lint, opgemaakt in
      de vorm van een sjerp, die wordt gedragen van de rechterschouder naar de linkerheup. Het lint voor mannen is 101
      millimeter en voor vrouwen 68 millimeter breed;

      2°. de ster, bestaande uit een blauw geëmailleerd rond schild, omgeven door een wit geëmailleerde rand, beide
      met goud omlijst met een diameter van 48 millimeter, bevestigd op een achtpuntige, uit achtenveertig stralen
      bestaande zilveren ster met een diameter van 85 millimeter. Op het schild staan afgebeeld de Leeuw en de omschrift,
      zoals omschreven in artikel 7, eerste lid, van de wet. Op de witte rand is aan de onderzijde een laurierkrans
      aangebracht. Voor militairen bevinden zich achter het schild twee schuin gekruiste zwaarden, zoals omschreven in
      artikel 7, tweede lid, van de wet. De ster wordt direct boven het middel gedragen op de linkerzijde van de kleding.
      De ster en het onder 1° bedoelde onderscheidingsteken worden uitsluitend tezamen gedragen;

      3°. het draagteken, zijnde het in rozetvorm opgemaakte lint waarachter een balk van goudgalon is bevestigd.
      Het geheel is bevestigd op een strik. Het draagteken wordt gedragen in plaats van de onder 1° en 2° genoemde
      onderscheidingstekens.

      b. Grootofficier:

      1°. het versiersel waarvan het kruis een diameter heeft van 60 millimeter, hangende aan het lint, dat door mannen
      om de hals en door vrouwen opgemaakt in de vorm van een strik op borsthoogte op de linkerzijde van de kleding wordt
      gedragen. Het lint voor mannen is 55 millimeter en voor vrouwen 37 millimeter breed;

      2°. de ster, bestaande uit het schild, zoals omschreven in onderdeel *a*, onder 2°, bevestigd op een vierpuntige,
      uit achtenveertig stralen bestaande zilveren ster met een diameter van 85 millimeter. De ster wordt direct boven
      het middel gedragen op de linkerzijde van de kleding. De ster en het onder 1° bedoelde onderscheidingsteken worden
      uitsluitend tezamen gedragen;

      3°. het draagteken, zijnde het in rozetvorm opgemaakte lint, waarachter een balk van goudgalon aan de ene zijde
      en een balk van zilvergalon aan de andere zijde is bevestigd. Het geheel is bevestigd op een strik. Het draagteken
      wordt gedragen in plaats van de onder 1° en 2° genoemde onderscheidingstekens.

      c. Commandeur:

      1°. het onderscheidingsteken, zoals omschreven in onderdeel *b*, onder 1°;

      2°. het draagteken, zijnde het in rozetvorm opgemaakte lint, waarachter een balk van zilvergalon is bevestigd.
      Het geheel is bevestigd op een strik. Het draagteken wordt gedragen in plaats van het onder 1° genoemde
      onderscheidingsteken.

      d. Officier:

      1°. het versiersel waarvan het kruis een diameter heeft van 46 millimeter, hangende aan het lint, voorzien van
      een rozet in de kleuren van het lint, dat op borsthoogte op de linkerzijde van de kleding wordt gedragen. Het lint
      voor mannen is 37 millimeter en voor vrouwen 27 millimeter breed. Vrouwen dragen het lint opgemaakt in de vorm van
      een strik;

      2°. het draagteken, zijnde het in rozetvorm opgemaakte lint. Het geheel is bevestigd op een strik. Het draagteken
      wordt gedragen in plaats van het onder 1° genoemde onderscheidingsteken.

      e. Ridder:

      1°. het versiersel waarvan het kruis een diameter heeft van 46 millimeter, hangende aan het lint, dat op
      borsthoogte op de linkerzijde van de kleding wordt gedragen. Het lint voor mannen is 37 millimeter en voor vrouwen
      27 millimeter. Vrouwen dragen het lint opgemaakt in de vorm van een strik;

      2°. het draagteken, zijnde het lint, opgemaakt in de vorm van een strik, waaraan is toegevoegd een kleine zilveren
      kroon. Het draagteken wordt gedragen in plaats van het onder 1° genoemde onderscheidingsteken.

      f. Lid:

      1°. het versiersel waarvan het kruis een diameter heeft van 35 millimeter, hangende aan het lint met een breedte
      van 27 millimeter, dat op borsthoogte op de linkerzijde van de kleding wordt gedragen. Vrouwen dragen het lint
      opgemaakt in de vorm van een strik;

      2°. het draagteken, zijnde het lint, opgemaakt in de vorm van een strik. Het draagteken wordt gedragen in plaats
      van het onder 1° genoemde onderscheidingsteken.
    url: https://wetten.overheid.nl/BWBR0007391/2010-10-10#Artikel7
