      1 Een voorstel tot verlening van een onderscheiding aan een burgemeester wordt gericht aan de commissaris van de
      Koning van de provincie waarin de burgemeester woont. De commissaris zendt het voorstel met zijn advies aan het
      Kapittel. [Artikel 9][ref1], vierde tot en met zevende lid, is van toepassing.

      2 Een voorstel tot verlening van een onderscheiding aan een commissaris van de Koning wordt gericht aan de
      burgemeester van de woonplaats van de commissaris. De burgemeester zendt het voorstel met zijn advies aan het
      Kapittel. [Artikel 9][ref2], vierde tot en met zevende lid, is van toepassing.


