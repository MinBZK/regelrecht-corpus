  - number: '9'
    text: |-
      1 Een voorstel tot verlening van een onderscheiding wordt gericht aan de burgemeester of de gezaghebber van de
      woonplaats van de te onderscheiden persoon.

      2 De burgemeester of de gezaghebber zendt het voorstel met zijn advies aan de commissaris van de Koning
      onderscheidenlijk de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba.

      3 De commissaris van de Koning of de Rijksvertegenwoordiger voor de openbare lichamen Bonaire,
      Sint Eustatius en Saba zendt het voorstel met zijn advies en het advies van de burgemeester
      onderscheidenlijk de gezaghebber aan het Kapittel voor de civiele orden, genoemd in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________________________________________________________________ (*Stb.* 1994, 350).

      4 Het Kapittel zendt het voorstel met zijn advies aan Onze Minister wie het aangaat. Het Kapittel houdt de stukken
      die betrekking hebben op de voorbereiding van zijn adviezen ter beschikking van Onze Minister wie het aangaat.

      5 Onze Minister wie het aangaat doet de voordracht voor het koninklijk besluit tot verlening van de onderscheiding.
      Indien de voordracht meer dan een minister aangaat, wordt het koninklijk besluit tot verlening van de
      onderscheiding gezamenlijk voorgedragen.

      6 Indien Onze Minister wie het aangaat het advies van het Kapittel niet overneemt, legt deze het voorstel met het
      advies van het Kapittel voor aan de ministerraad, die over de voordracht besluit.

      7 Van elk besluit omtrent een voorstel tot verlening van een onderscheiding wordt door Onze Minister wie het
      aangaat opgave gedaan aan het Kapittel.


