  - number: '15'
    text: |-
      Ten aanzien van de verlening van een onderscheiding bij koninklijk besluit aan een lid van het koninklijk huis,
      alsmede aan buitenlandse staatshoofden, is [artikel 9][ref1], zevende lid, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007391#Artikel9
    url: https://wetten.overheid.nl/BWBR0007391/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007391
        artikel: '9'
        hoofdstuk: III
  - number: '16'
    text: |-
      1 De uitreiking van de onderscheiding geschiedt door de burgemeester, de gezaghebber, de commissaris van de
      Koning, de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba of Onze Minister wie
      het aangaat.

      2 Indien de onderscheiding namens de burgemeester, de gezaghebber, de commissaris van de Koning, de
      Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba of Onze Minister wie het aangaat,
      wordt uitgereikt, geschiedt dit door een daartoe aangewezen ambtenaar of door een ander bestuursorgaan, mits het
      bestuursorgaan daarmee instemt.

      3 De uitreiking van de onderscheiding geschiedt in Aruba, Curaçao en Sint Maarten door of namens de Gouverneur.
    url: https://wetten.overheid.nl/BWBR0007391/2010-10-10#Artikel16
  - number: '17'
    text: De verlening van een onderscheiding wordt binnen een maand na verlening gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007391/2010-10-10#Artikel17
  - number: '18'
    text: |-
      1 Bij de onderscheiding behoort een oorkonde die wordt ondertekend door de Kanselier van de Orde van de Nederlandse
      Leeuw.

      2 Modellen van de in de [artikelen 4][ref1], [5][ref2], [7][ref3] en [8][ref4] beschreven onderscheidingstekens
      worden gedeponeerd bij de Kanselier van de Orde van de Nederlandse Leeuw.


