      van de in [artikel 7][ref2] genoemde onderscheidingstekens.

      2 Leden van de Orde die een uniform dragen kunnen het draagteken in de vorm van een bâton van 27 bij 11 millimeter
      dragen. Indien de graad van Ridder Grootkruis, Grootofficier of Commandeur is verleend, wordt op de bâton een rozet
      met daarachter een balk als bedoeld in [artikel 7][ref3], respectievelijk onderdeel *a*, onder 3°, onderdeel *b*,
      onder 3°, en onderdeel *c*, onder 2°, bevestigd. Indien de graad van Officier, dan wel Ridder is verleend, wordt op
      de bâton een rozet respectievelijk een kleine zilveren kroon bevestigd.


