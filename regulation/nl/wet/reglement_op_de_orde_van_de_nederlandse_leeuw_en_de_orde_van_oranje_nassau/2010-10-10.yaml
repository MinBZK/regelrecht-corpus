  - number: '20'
    text: |-
      De richtlijnen voor het verlenen van koninklijke onderscheidingen, zoals vastgesteld door de ministerraad op 27
      september 1948, worden ingetrokken, met dien verstande dat deze van toepassing blijven op voorstellen als bedoeld
      in artikel 19, eerste lid.
    url: https://wetten.overheid.nl/BWBR0007391/2010-10-10#Artikel20
  - number: '21'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de derde kalendermaand na de datum van uitgifte van
      het *Staatsblad* waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0007391/2010-10-10#Artikel21
  - number: '22'
    text: 'Dit besluit wordt aangehaald als: Reglement op de Orde van de Nederlandse Leeuw en de Orde van Oranje-Nassau.'
    url: https://wetten.overheid.nl/BWBR0007391/2010-10-10#Artikel22
