preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 10 maart 1994, Directoraat-Generaal Openbaar Bestuur;

    Gelet op artikel 14 van de wet van 29 september 1815, houdende instelling van de Orde van de Nederlandse Leeuw
    (Stb. 1994, 352) en op artikel 13 van de wet van 4 april 1892, houdende instelling van de Orde van Oranje-Nassau
    (Stb. 1994, 351);

    Gezien het advies van het Kapittel voor de civiele orden;

    De Raad van State van het Koninkrijk gehoord (advies van 13 april 1995, No. W04.95.0151/K);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 8 mei 1995, Stafafdeling Constitutionele
    Zaken en Wetgeving;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007391/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De Orde van de Nederlandse Leeuw strekt tot onderscheiding van personen wegens bijzondere verdiensten van zeer
      exceptionele aard jegens de samenleving.

      2 Van verdiensten als bedoeld in het eerste lid is sprake, indien:

      a. iemand een verantwoordelijkheid heeft gedragen of een bekwaamheid heeft getoond die aanmerkelijk groter is dan
      de samenleving van hem mocht verwachten;

      b. iemand op uitstekende wijze werkzaamheden heeft verricht waarbij de samenleving in zeer belangrijke mate is
      gebaat, en in het bijzonder indien de maatschappelijke waardering daarvoor niet op andere wijze tot uitdrukking is
      gekomen of

      c. iemand alleen of samen met anderen, al dan niet in opdracht, een zeer uitzonderlijke prestatie heeft verricht.
    url: https://wetten.overheid.nl/BWBR0007391/2010-10-10#Artikel1
  - number: '2'
    text: |-
      1 De Orde van Oranje-Nassau strekt tot onderscheiding van personen wegens bijzondere verdiensten jegens de
      samenleving.

      2 Van verdiensten als bedoeld in het eerste lid is sprake, indien:

      a. iemand zich geruime tijd ten bate van de samenleving heeft ingespannen of anderen heeft gestimuleerd;

      b. iemand een of meer opvallende prestaties heeft geleverd of werkzaamheden heeft verricht die voor de samenleving
      een bijzondere waarde hebben.

      3 Bij de vaststelling van de bijzondere verdiensten, bedoeld in het tweede lid, kan in aanmerking worden genomen
      dat iemand geruime tijd werkzaamheden heeft verricht op een wijze die betrokkene onderscheidt van anderen en die
      getuigt van een karaktervolle en voorbeeldige plichtsvervulling.
    url: https://wetten.overheid.nl/BWBR0007391/2010-10-10#Artikel2
  - number: '3'
    text: |-
      In de artikelen 4 en 5 worden onder versiersel en lint verstaan het versiersel en het lint, zoals omschreven in
      artikel 7 van de wet van 29 september 1815, houdende instelling van de Orde van de Nederlandse Leeuw (*Stb.* 1994,
      352).
    url: https://wetten.overheid.nl/BWBR0007391/2010-10-10#Artikel3
  - number: '4'
    text: |-
      De uit te reiken onderscheidingstekens zijn voor de onderscheiden graden van:

      a. Ridder Grootkruis:

      1°. het versiersel waarvan het kruis een diameter heeft van 60 millimeter, hangende aan het lint, opgemaakt in
      de vorm van een sjerp, die wordt gedragen van de rechterschouder naar de linkerheup. Het lint voor mannen is 101
      millimeter en voor vrouwen 68 millimeter breed;

      2°. de ster, bestaande uit het versiersel zonder kroon met een diameter van 73 millimeter, bevestigd op een
      achtpuntige, uit achtenveertig stralen bestaande, licht bolvormige gouden ster met een diameter van 85 millimeter.
      De stralen van de ster zijn om en om geschubd en alle aan de uiteinden geknopt. De ster wordt direct boven het
      middel gedragen op de linkerzijde van de kleding. De ster en het onder 1° bedoelde onderscheidingsteken worden
      uitsluitend tezamen gedragen;

      3°. het draagteken, zijnde het in rozetvorm opgemaakte lint waarachter een balk van goudgalon is bevestigd.
      Het geheel is bevestigd op een strik. Het draagteken wordt gedragen in plaats van de onder 1° en 2° genoemde
      onderscheidingstekens.

      b. Commandeur:

      1°. het versiersel waarvan het kruis een diameter heeft van 60 millimeter, hangende aan het lint, dat door mannen
      om de hals en door vrouwen opgemaakt in de vorm van een strik op borsthoogte op de linkerzijde van de kleding wordt
      gedragen. Het lint is voor mannen 55 millimeter en voor vrouwen 37 millimeter breed;

      2°. de ster, bestaande uit het versiersel waarvan het kruis een diameter heeft van 79 millimeter, dat direct boven
      het middel wordt gedragen op de linkerzijde van de kleding. De ster en het onder 1° bedoelde onderscheidingsteken
      worden uitsluitend tezamen gedragen;

      3°. het draagteken, zijnde het in rozetvorm opgemaakte lint, waarachter een balk van zilvergalon is bevestigd.
      Het geheel is bevestigd op een strik. Het draagteken wordt gedragen in plaats van de onder 1° en 2° genoemde
      onderscheidingstekens.

      c. Ridder:

      1°. het versiersel waarvan het kruis een diameter heeft van 46 millimeter, hangende aan het lint, dat op
      borsthoogte wordt gedragen op de linkerzijde van de kleding. Het lint voor mannen is 37 millimeter breed. Het lint
      voor vrouwen is 27 millimeter breed en is opgemaakt in de vorm van een strik;

      2°. het draagteken, opgemaakt in de vorm van een strik. Het wordt gedragen in plaats van het onder 1° genoemde
      onderscheidingsteken.
    url: https://wetten.overheid.nl/BWBR0007391/2010-10-10#Artikel4
  - number: '5'
    text: |-
      1 De in [artikel 4][ref1] genoemde versierselen met lint kunnen in een verkleinde vorm worden gedragen in plaats
      van de in [artikel 4][ref2] genoemde onderscheidingstekens.

      2 Leden van de Orde die een uniform dragen kunnen het draagteken in de vorm van een bâton van 27 bij 11 millimeter
      dragen. Indien de graad van Ridder Grootkruis of Commandeur is verleend, wordt op de bâton een rozet met daarachter
      een balk als bedoeld in [artikel 4][ref3], respectievelijk onderdeel *a*, onder 3°, en onderdeel *b*, onder 3°,
      bevestigd.


