---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: tijdelijke_regeling_tegemoetkoming_aow_ers
regulatory_layer: WET
publication_date: '2008-09-23'
valid_from: '2006-01-01'
bwb_id: BWBR0017706
url: https://wetten.overheid.nl/BWBR0017706/2006-01-01
preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, en 9 van de Kaderwet SZW-subsidies en artikel 34, eerste lid, onderdeel e, van
    de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel1
  - number: 1.a
    text: 'minister: de Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel1
  - number: 1.b
    text: |-
      SVB: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: 1.c
    text: |-
      AOW: [Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 1.d
    text: |-
      pensioengerechtigde: degene die recht heeft op ouderdomspensioen in de zin van de [AOW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '2'
    text: |-
      Met de rijksbijdrage, bedoeld in [artikel 6][ref1], worden de aanspraken op tegemoetkomingen van
      pensioengerechtigden bekostigd, die worden verstrekt in aanvulling op het ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0017706#Artikel6
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017706
        artikel: '6'
  - number: '3.1'
    text: |-
      De pensioengerechtigde, bedoeld in [artikel 7 van de AOW][ref1], heeft voor elke maand van het jaar 2005 waarin
      recht op ouderdomspensioen bestaat recht op een bruto-tegemoetkoming van € 5,– per kalendermaand.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '7'
  - number: '3.2'
    text: |-
      Indien het ouderdomspensioen is toegekend in het jaar 2005 bestaat recht op de tegemoetkoming met ingang van de
      datum van toekenning.
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel3
  - number: '3.3'
    text: |-
      De betaling van de tegemoetkoming geschiedt maandelijks tezamen met de betaling van het ouderdomspensioen met
      toepassing van [paragraaf 2 van hoofdstuk III van de AOW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002221
        paragraaf: '2'
  - number: '4'
    text: |-
      Voor de toepassing van [artikel 11 van het Besluit voorzieningen Remigratiewet][ref1] wordt in het bruto-bedrag van
      de uitkering ingevolge de [AOW][ref2] niet begrepen de tegemoetkoming op grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010773#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010773
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002221
  - number: '5'
    text: Deze regeling wordt uitgevoerd door de SVB.
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel5
  - number: '6.1'
    text: |-
      In de middelen tot dekking van de uitgaven verbonden aan deze regeling wordt voorzien door een rijksbijdrage aan
      de SVB.
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel6
  - number: '6.2'
    text: |-
      De middelen worden op basis van een raming van de minister in 12 gelijke termijnen ter beschikking
      gesteld aan de SVB via de rekening-courant bij de Minister van Financiën, die de SVB op grond van
      [artikel 51, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] aanhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel51
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '51'
  - number: '6.3'
    text: |-
      De [artikelen 49][ref1] en [51, derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] zijn
      van overeenkomstige toepassing bij de uitvoering van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel51
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '51'
  - number: '6.4'
    text: |-
      De SVB zendt uiterlijk vóór 1 juni 2006 op basis van de jaarrekening over 2005 een overzicht van de uitgaven op
      grond van deze regeling ten laste van de rijksbijdrage.
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel6
  - number: '6.5'
    text: De minister stelt vóór 31 oktober 2006 de rijksbijdrage vast.
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel6
  - number: '6.6'
    text: |-
      [Artikel 16, eerste lid, van de Algemene Regeling SZW-subsidies][ref1] is niet van toepassing op verstrekking van
      tegemoetkomingen krachtens deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009211#Artikel16
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009211
        artikel: '16'
  - number: '7'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2005 en vervalt op een door de minister te bepalen
      tijdstip.
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel7
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling tegemoetkoming AOW-ers.'
    url: https://wetten.overheid.nl/BWBR0017706/2006-01-01#Artikel8
