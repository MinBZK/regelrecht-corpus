preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, en 9 van de Kaderwet SZW-subsidies en artikel 34, eerste lid, onderdeel e, van
    de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017706/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder:

      a. minister: de Minister van Sociale Zaken en Werkgelegenheid;

      b. SVB: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      c. AOW: [Algemene Ouderdomswet][ref2];

      d. pensioengerechtigde: degene die recht heeft op ouderdomspensioen in de zin van de [AOW][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0017706/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0002221
      - id: ref3
        bwb_id: BWBR0002221
  - number: '2'
    text: |-
      Met de rijksbijdrage, bedoeld in [artikel 6][ref1], worden de aanspraken op tegemoetkomingen van
      pensioengerechtigden bekostigd, die worden verstrekt in aanvulling op het ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0017706#Artikel6
    url: https://wetten.overheid.nl/BWBR0017706/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017706
        artikel: '6'
  - number: '3'
    text: |-
      1 De pensioengerechtigde, bedoeld in [artikel 7 van de AOW][ref1], heeft voor elke maand van het jaar 2005 waarin
      recht op ouderdomspensioen bestaat recht op een bruto-tegemoetkoming van € 5,– per kalendermaand.

      2 Indien het ouderdomspensioen is toegekend in het jaar 2005 bestaat recht op de tegemoetkoming met ingang van de
      datum van toekenning.

      3 De betaling van de tegemoetkoming geschiedt maandelijks tezamen met de betaling van het ouderdomspensioen met
      toepassing van [paragraaf 2 van hoofdstuk III van de AOW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0017706/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002221
        paragraaf: '2'
  - number: '4'
    text: |-
      Voor de toepassing van [artikel 11 van het Besluit voorzieningen Remigratiewet][ref1] wordt in het bruto-bedrag van
      de uitkering ingevolge de [AOW][ref2] niet begrepen de tegemoetkoming op grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010773#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0017706/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010773
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002221
  - number: '5'
    text: Deze regeling wordt uitgevoerd door de SVB.
    url: https://wetten.overheid.nl/BWBR0017706/2005-01-01#Artikel5
  - number: '6'
    text: |-
      1 In de middelen tot dekking van de uitgaven verbonden aan deze regeling wordt voorzien door een rijksbijdrage aan
      de SVB.

      2 De middelen worden op basis van een raming van de minister in 12 gelijke termijnen ter beschikking
      gesteld aan de SVB via de rekening-courant bij de Minister van Financiën, die de SVB op grond van
      [artikel 51, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] aanhoudt.

      3 De [artikelen 49][ref2] en [51, derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3]
      zijn van overeenkomstige toepassing bij de uitvoering van deze regeling.

      4 De SVB zendt uiterlijk vóór 1 juni 2006 op basis van de jaarrekening over 2005 een overzicht van de uitgaven op
      grond van deze regeling ten laste van de rijksbijdrage.

      5 De minister stelt vóór 31 oktober 2006 de rijksbijdrage vast.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel51
    url: https://wetten.overheid.nl/BWBR0017706/2005-01-01#Artikel6
    references:
