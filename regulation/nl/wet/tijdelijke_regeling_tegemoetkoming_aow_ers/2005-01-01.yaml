  - number: '7'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2005 en vervalt op een door de minister te bepalen
      tijdstip.
    url: https://wetten.overheid.nl/BWBR0017706/2005-01-01#Artikel7
