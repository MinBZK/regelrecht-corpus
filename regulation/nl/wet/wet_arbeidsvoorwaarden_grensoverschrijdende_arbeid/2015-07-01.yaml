  - number: '2'
    text: >-
      Een werknemer die tijdelijk buiten Nederland arbeid verricht of heeft verricht in een lidstaat van de Europese Unie
      of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte kan, ongeacht
      het recht dat de arbeidsovereenkomst beheerst, met betrekking tot die arbeid aanspraken ontlenen aan het recht
      dat eerderbedoelde staat heeft vastgesteld ter uitvoering van de [Richtlijn 96/71/EG](31996L0071) van het Europees
      parlement en van de Raad van de Europese Unie van 16 december 1996 betreffende de terbeschikkingstelling van
      werknemers met het oog op het verrichten van diensten (PbEG 1997, L18).
    url: https://wetten.overheid.nl/BWBR0010925/2015-07-01#Artikel2
  - number: '5'
    text: |-
      Een wijziging van de [Richtlijn 96/71/EG](31996L0071) van het Europees parlement en van de Raad van de Europese
      Unie van 16 december 1996 betreffende de terbeschikkingstelling van werknemers met het oog op het verrichten van
      diensten (PbEG 1997, L 18) inclusief de bijlage gaat voor de toepassing van [artikel 2][ref1] van deze wet en
      __REF001___________________________________________________________________________________________________________
      _____________________________________ gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn
      uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0010925#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001987#Artikel2
    url: https://wetten.overheid.nl/BWBR0010925/2015-07-01#Artikel5
