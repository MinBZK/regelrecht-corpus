preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat de Richtlijn 96/71/EG van het Europees parlement en van de Raad van
    de Europese Unie van 16 december 1996 betreffende de terbeschikkingstelling van werknemers met het oog op het
    verrichten van diensten (PbEG 1997, L 18) moet worden uitgevoerd;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010925/2015-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De [artikelen 634 tot en met 642][ref1], [645][ref2], [646][ref3], [648][ref4], [658][ref5] en
      [670, lid 2 van Boek 7 van het Burgerlijk Wetboek][ref6] zijn van toepassing op werknemers, die tijdelijk in
      Nederland arbeid verrichten en wier arbeidsovereenkomst wordt beheerst door ander recht dan het Nederlandse recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel645
