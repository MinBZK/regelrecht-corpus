  - number: '4'
    text: |-
      1 De bloedmonsters, bedoeld in [artikel 3, eerste tot en met vierde lid][ref1], worden genomen op het
      pluimveebedrijf waar het betreffende pluimvee is gehuisvest.

      2 Het afnemen van bloed als bedoeld in [artikel 3, eerste tot en met vierde lid][ref2], geschiedt door een
      dierenarts dan wel door een op aanwijzing van en onder controle van een dierenarts handelende dierenartsassistent
      als bedoeld in [artikel 9 van het Besluit paraveterinairen][ref3] (Stb. 526).


      [ref1]: https://wetten.overheid.nl/BWBR0018201#Artikel3
