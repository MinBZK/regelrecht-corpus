  - number: '2'
    text: |-
      1 De ondernemer zorgt ervoor dat overeenkomstig de [artikelen 3][ref1] en [4][ref2], op zijn kosten bloedmonsters
      worden genomen van het op zijn pluimveebedrijf aanwezige pluimvee en zorgt ervoor dat deze bloedmonsters op zijn
      kosten worden onderzocht op de aanwezigheid van antistoffen tegen Aviaire influenza.

      2 Het in het eerste lid bedoelde onderzoek van bloedmonsters wordt uitgevoerd door een laboratorium dat is erkend
      door de voorzitter.

      3 Het bestuur stelt bij besluit voorwaarden vast op grond waarvan een erkenning als bedoeld in het tweede lid wordt
      verleend.

      4 De voorzitter kan de in het tweede lid bedoelde erkenning intrekken indien het laboratorium niet of niet meer
      voldoet aan de erkenningsvoorwaarden.

      5 Het in het derde lid bedoelde besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0018201#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018201#Artikel4
    url: https://wetten.overheid.nl/BWBR0018201/2014-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018201
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018201
        artikel: '4'
        paragraaf: '3'
  - number: '3'
    text: |-
      1 Ter uitvoering van het in [artikel 2, eerste lid][ref1], bedoelde onderzoek, zorgt de ondernemer ervoor dat,
      indien de ondernemer :

      a. vleeskuikens, parelhoenders, loopvogels of kwartels houdt, jaarlijks bloed wordt afgenomen van 30 vleeskuikens,
      parelhoenders, loopvogels of kwartels met een leeftijd van tenminste 4 weken;

      b. vleeseenden of ganzen houdt, jaarlijks bloed wordt afgenomen van 40 vleeseenden of ganzen met een leeftijd van
      tenminste 4 weken;

      c. vleeskalkoenen houdt, bij elke productieronde bloed wordt afgenomen van 30 hanen met een leeftijd van tenminste
      18 weken;

      d. geen andere vleeskalkoenen dan hennen houdt, bij elke productieronde bloed wordt afgenomen van 30 hennen met een
      leeftijd van tenminste 13 weken;

      e. opfokvermeerderingsdieren houdt, jaarlijks bloed wordt afgenomen van tenminste 30 opfokvermeerderingsdieren met
      een leeftijd van tenminste 15 weken;

      f. vermeerderingsdieren houdt, jaarlijks bloed wordt afgenomen van tenminste 30 vermeerderingsdieren met een
      leeftijd van tenminste 45 weken;

      g. opfokleghennen houdt, jaarlijks bloed wordt afgenomen van tenminste 30 opfokleghennen met een leeftijd van
      tenminste 8 weken; en

      h. leghennen houdt, jaarlijks bloed wordt afgenomen van tenminste 30 leghennen met een leeftijd van tenminste 45
      weken.

      2 Indien de ondernemer conform
      __REF000___________________________________________________________________________________________________________
      _______________ geregistreerd is met een houderijsysteem met vrije uitloop, zorgt de ondernemer er voor dat de in
      het eerste lid, onder a. tot en met h. bedoelde monstername, in afwijking van het bepaalde in het eerste lid, onder
      a. tot en met h., per kalenderkwartaal wordt uitgevoerd, ongeacht de leeftijd van het pluimvee.

      3 Indien van het pluimvee, bedoeld in het eerste lid, onder a tot en met h, koppels worden verplaatst naar
      een ander pluimveebedrijf, zorgt de ondernemer ervoor dat de in het eerste lid, onder a tot en met h bedoelde
      monsterneming, in afwijking van het eerste lid, onder a tot en met h, vóór elke verplaatsing wordt uitgevoerd
      bij het betreffende koppel, ongeacht de leeftijd van het pluimvee, en dat de uitslag van het onderzoek bekend is
      voordat de verplaatsing van het pluimvee plaatsvindt.

      4 Onverminderd het eerste, tweede en derde lid, zorgt de ondernemer ervoor dat, indien het pluimvee, bedoeld
      in het eerste lid onder a tot en met h, in meerdere stallen op het pluimveebedrijf is gehuisvest, uit elke stal
      naar evenredigheid van het aantal dat in die stallen wordt gehouden, bloedmonsters worden genomen van het aldaar
      gehouden pluimvee, met een minimum van 5 bloedmonsters per stal.

      5 De voorzitter kan bepalen in welke periode de in het eerste, tweede en vierde lid bedoelde bloedmonsters moeten
      worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018201#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019280#Artikel2
