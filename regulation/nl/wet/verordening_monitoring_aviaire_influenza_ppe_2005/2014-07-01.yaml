  - number: '5'
    text: |-
      1 De ondernemer levert de in [artikel 3, eerste tot en met vierde lid][ref1] bedoelde bloedmonsters, overeenkomstig
      de door het bestuur bij besluit vastgestelde voorschriften, aan bij een erkend laboratorium als bedoeld in
      [artikel 2, tweede lid][ref2].

      2 Het in het eerste lid bedoelde besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0018201#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018201#Artikel2
    url: https://wetten.overheid.nl/BWBR0018201/2014-07-01#Artikel5
