  - number: '6'
    text: |-
      De ondernemer bewaart de resultaten van het in [artikel 2, eerste lid][ref1] bedoelde onderzoek, gedurende een
      periode van tenminste twee jaren in zijn bedrijfsadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0018201#Artikel2
    url: https://wetten.overheid.nl/BWBR0018201/2014-07-01#Artikel6
    references:
