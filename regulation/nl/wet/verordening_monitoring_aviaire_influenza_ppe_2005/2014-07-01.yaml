preamble:
  text: |-
    Gelet op beschikking (EG) nr. 2004/111 van de Commissie van de Europese Gemeenschappen van 29 januari 2004
    betreffende het in 2004 uit te voeren onderzoek naar aviaire influenza bij pluimvee en bij in het wild levende
    vogels in de lidstaten (PbEU L 32) en beschikking (EG) nr. 2004/615 van de Commissie van de Europese Gemeenschappen
    van 23 juli 2004 (PbEU L 278) tot wijziging van beschikking nr. 2004/111/EG betreffende het in 2004 uit te voeren
    onderzoek naar aviaire influenza bij pluimvee en bij in het wild levende vogels in de lidstaten, alsmede artikel
    3a, eerste en tweede lid, van de Regeling monitoring Aviaire Influenza 2003 en de artikelen 96, 97, en 100, derde
    lid, van de Wet op de bedrijfsorganisatie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018201/2014-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze verordening wordt verstaan onder:










                  a.


                  productschap


                  :


                  Productschap Pluimvee en Eieren;




                  b.


                  bestuur


                  :


                  bestuur van het productschap;




                  c.


                  voorzitter


                  :


                  voorzitter van het productschap;




                  d.


                  Aviaire influenza


                  :


                  Aviaire influenza voor zover het de subtypen H5 en H7 betreft;




                  e.


                  vleeskuikens


                  :


                  kippen, waarvan de punt van het borstbeen nog niet is verbeend, die worden gehouden voor de
      vleesproductie;




                  f.


                  vleeseenden


                  :


                  eenden die worden gehouden voor de vleesproductie;




                  g.


                  vleeskalkoenen


                  :


                  kalkoenen die worden gehouden voor de vleesproductie;




                  h.


                  hanen


                  :


                  vleeskalkoenen van het mannelijke geslacht;




                  i.


                  hennen


                  :


                  vleeskalkoenen van het vrouwelijke geslacht;




                  j.


                  ganzen


                  :


                  ganzen (anas domestica) die worden gehouden voor de productie van vlees of broedeieren;




                  k.


                  kwartels


                  :


                  kwartels (cortunix) die worden gehouden voor de productie van vlees of broedeieren;




                  i.


                  parelhoenders


                  :


                  parelhoenders (numida) die worden gehouden voor de productie van vlees of broedeieren;




                  m.


                  loopvogels


                  :


                  loopvogels (ratites) die worden gehouden voor de productie van vlees of broedeieren;




                  n.


                  vermeerderingsdieren


                  :


                  kippen, eenden of kalkoenen die worden gehouden voor de productie van broedeieren;




                  o.


                  opfokvermeerderingsdieren


                  :


                  kippen, eenden of kalkoenen die tot vermeerderingsdieren worden opgefokt;




                  P.


                  leghennen


                  :


                  kippen die worden gehouden voor de productie van andere eieren dan broedeieren;




                  q.


                  opfokleghennen


                  :


                  kippen die tot leghennen worden opgefokt;




                  r.


                  pluimvee


                  :


                  vleeskuikens, vleeseenden, vleeskalkoenen, ganzen, kwartels, parelhoenders, loopvogels,
      vermeerderingsdieren of leghennen die in gevangenschap worden opgefokt of gehouden voor de fokkerij, voor de
      productie van vlees of voor de productie van eieren;




                  s.


                  pluimveebedrijf


                  :


                  voorziening - die een inrichting kan omvatten - die wordt gebruikt voor het op een locatie (op)fokken
      of houden van pluimvee en die als zodanig bij het productschap is geregistreerd, dan wel geregistreerd had moeten
      zijn;




                  t.


                  koppel


                  :


                  groep pluimvee met dezelfde gezondheidsstatus en van dezelfde leeftijd, die een epidemiologische
      eenheid vormt;




                  u.


                  productieronde


                  :


                  periode waarbinnen vleeskalkoenen vanaf de geboorte worden opgefokt totdat zij slachtrijp zijn;




                  v.


                  ondernemer


                  :


                  een natuurlijk persoon of rechtspersoon die een pluimveebedrijf uitoefent;




                  w.


                  Elisa-test


                  :


                  Enzym gekoppelde immuun absorberende test voor Aviaire influenza;




                  x.



                  Agp-test


                  :


                  Agargelprecipitatietest voor Aviaire influenza;




                  y.


                  dierenarts


                  :


                  diegene die is ingeschreven in het register van praktiserende dierenartsen, bedoeld in
      [artikel 10, eerste lid, van de Wet op de uitoefening van de diergeneeskunde 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel10
