        paragraaf: '2'
  - number: '7'
    text: |-
      1 De voorzitter kan de in [artikel 2, eerste lid][ref1] bedoelde ondernemer(s), namens het bestuur, in
      uitzonderlijke gevallen en voor zover het belang van de bestrijding van dierziekten zich daartegen niet verzet,
      vrijstelling of op aanvraag ontheffing verlenen van de verplichtingen bedoeld in [artikel 2, eerste lid][ref2],
      [artikel 3, eerste, tweede, derde en vierde lid][ref3] en [artikel 5, eerste lid][ref4].

      2 Aan een vrijstelling of ontheffing als bedoeld in het eerste lid, kunnen voorschriften of voorwaarden worden
      verbonden.

      3 Een verleende ontheffing als bedoeld in het eerste lid, kan te allen tijde worden ingetrokken.


