  - number: 68c
    text: |-
      1 Bij zijn besluit tot intrekking van het Nederlanderschap op grond van
      [artikel 14, vierde lid, van de Rijkswet][ref1] houdt Onze Minister onder meer rekening met:

      a. de proportionaliteit van de maatregel, mede gelet op de rol die betrokkene vervult bij de in
      [artikel 14, vierde lid, van de Rijkswet][ref2] bedoelde organisatie en de daarmee samenhangende mate van dreiging
      voor de nationale veiligheid die van betrokkene uitgaat;

      b. het eventuele belang van opsporing, vervolging en berechting van betrokkene en de mogelijkheid van
      tenuitvoerlegging van een vrijheidsstraf;

      c. de gevolgen van het verlies van Unieburgerschap, indien dit ten gevolge van de intrekking van het
      Nederlanderschap optreedt; en

      d. de eventuele minderjarigheid van betrokkene en zeer bijzondere persoonlijke omstandigheden van betrokkene, voor
      zover deze relevant zijn voor het besluit tot intrekking van het Nederlanderschap.

      2 Intrekking van het Nederlanderschap vindt niet plaats indien de met de intrekking verband houdende
      ongewenstverklaring in strijd zou zijn met artikel 8 van het Verdrag tot bescherming van de rechten van de mens en
      de fundamentele vrijheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel14
