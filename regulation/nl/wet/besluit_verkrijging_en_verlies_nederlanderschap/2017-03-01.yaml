  - number: '58'
    text: |-
      1 Indien een verzoeker verplicht is om na de totstandkoming van de naturalisatie het mogelijke te zullen doen om
      zijn andere nationaliteit of nationaliteiten te verliezen, wordt hem na de naturalisatie door Onze Minister bericht
      dat hij binnen een termijn van drie maanden een verzoek moet doen tot afstand van die andere nationaliteit of
      nationaliteiten. Van dit bericht wordt een afschrift gezonden aan de autoriteit, die het naturalisatieverzoek in
      ontvangst genomen heeft.

      2 Heeft de verzoeker het verzoek tot afstand dan wel een verklaring van afstand bij de autoriteiten van het land
      of de landen van zijn andere nationaliteit of nationaliteiten ingediend of aangeboden en is daarover door deze nog
      geen beslissing genomen, dan verzoekt Onze Minister na zes maanden de betrokkene hem te informeren over de stand
      van zaken met betrekking tot het verlies van de andere nationaliteit of nationaliteiten.

      3 Verlenen de autoriteiten van het land van de andere nationaliteit geen of onvoldoende medewerking aan het verzoek
      of de verklaring van afstand, dan beslist Onze Minister over de gevolgen daarvan voor de afstandsverplichting.
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel58
  - number: '59'
    text: |-
      1 Wordt Onze Minister het bewijs overgelegd dat de andere nationaliteit of een der andere nationaliteiten is
      verloren, dan zendt hij een gewaarmerkt afschrift daarvan aan de autoriteit die het naturalisatieverzoek in
      ontvangst genomen heeft.

      2 De autoriteit, bedoeld in [artikel 2][ref1], aan wie het bewijs van het verlies van een andere nationaliteit
      wordt overgelegd, zendt een gewaarmerkt afschrift daarvan aan Onze Minister.

      3 Onze Minister dan wel de in het tweede lid bedoelde autoriteit zendt tevens een gewaarmerkt afschrift aan de
      autoriteit die verantwoordelijk is voor het bijhouden in de basisadministratie van de gegevens over de persoon
      wiens verlies van die andere nationaliteit het betreft.

      4 De in het derde lid bedoelde autoriteit bevordert, voor zover van toepassing, dat het verlies van de andere
      nationaliteit of nationaliteiten in de desbetreffende basisadministratie wordt verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#Artikel2
