  - number: '48'
    text: |-
      1 De Gouverneur onderzoekt de verblijfsrechtelijke status van de verzoeker en de personen om wier
      medeverlening wordt verzocht, alsmede laat hij het bestaan onderzoeken van ernstige vermoedens als bedoeld in
      [artikel 9, eerste lid, aanhef en onder a, van de Rijkswet][ref1] jegens de verzoeker of de personen die tot
      medeverkrijging van het Nederlanderschap in het naturalisatieverzoek zijn genoemd, indien zij ouder zijn dan
      zestien jaar. Zo nodig verwijst hij de verzoeker voor een bewijs van toelating naar de daartoe bevoegde instanties.

      2 Hij onderzoekt eveneens of deze personen aan de overige voor hun naturalisatie gestelde voorwaarden voldoen.

      3 In de gevallen bedoeld in [artikel 12 van de Rijkswet][ref2] overlegt de Gouverneur met de verzoeker over de
      vaststelling en de spelling van geslachtsnaam en voornaam of voornamen van de verzoeker alsmede van de personen
      om wier medeverlening is verzocht, en over de in het Koninkrijk gebruikelijke lettertekens waarin de namen van
      de verzoeker en van de personen om wier medeverlening wordt verzocht, zullen worden overgebracht. Hij vraagt, zo
      nodig, de toestemming van de verzoeker tot wijziging van de naam.

      4 De Gouverneur stelt de andere in het verzoek genoemde personen, die de leeftijd van twaalf jaar hebben bereikt,
      alsook de wettelijke vertegenwoordiger en de in het vierde lid van [artikel 2 van de Rijkswet][ref3] bedoelde
      andere ouder van deze personen op hun verzoek in de gelegenheid hun zienswijze inzake de naturalisatie alsook
      inzake de naamswijziging en naamsvaststelling kenbaar te maken.

      5 Nadat de Gouverneur de handelingen bedoeld in de voorgaande artikelen van deze paragraaf heeft verricht, brengt
      hij over het naturalisatieverzoek en de eventuele naamsvaststelling en naamswijziging advies uit aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel2
