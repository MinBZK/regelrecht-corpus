        artikel: 6a
  - number: 30b
    text: |-
      1 Indien een optant verplicht is om na de totstandkoming van de optie het mogelijke te zullen doen om zijn andere
      nationaliteit of nationaliteiten te verliezen, wordt hem na de optie door Onze Minister bericht dat hij binnen een
      termijn van drie maanden een verzoek moet doen tot afstand van die andere nationaliteit of nationaliteiten. Van dit
      bericht wordt een afschrift gezonden aan de autoriteit die de optieverklaring in ontvangst heeft genomen.

      2 Heeft de optant het verzoek tot afstand dan wel een verklaring van afstand bij de autoriteiten van het land of de
      landen van zijn andere nationaliteit of nationaliteiten ingediend of aangeboden en is daarover door deze nog geen
      beslissing genomen, dan verzoekt Onze Minister na zes maanden de betrokkene hem te informeren over de stand van
      zaken met betrekking tot het verlies van de andere nationaliteit of nationaliteiten.

      3 Verlenen de autoriteiten van het land van de andere nationaliteit geen of onvoldoende medewerking aan het verzoek
      of de verklaring van afstand, dan beslist Onze Minister over de gevolgen daarvan voor de afstandsverplichting.
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel30b
  - number: 30c
    text: |-
      1 Wordt Onze Minister het bewijs overgelegd dat de andere nationaliteit of een der andere nationaliteiten is
      verloren, dan zendt hij een gewaarmerkt afschrift daarvan aan de autoriteit die de optieverklaring in ontvangst
      heeft genomen.

      2 De autoriteit die de optieverklaring in ontvangst heeft genomen, aan wie het bewijs van het verlies van een
      andere nationaliteit wordt overgelegd, zendt een gewaarmerkt afschrift daarvan aan Onze Minister.

      3 Onze Minister dan wel de in het tweede lid bedoelde autoriteit zendt tevens een gewaarmerkt afschrift aan de
      autoriteit die verantwoordelijk is voor het bijhouden in de basisadministratie van de gegevens over de persoon
      wiens verlies van die andere nationaliteit het betreft.

      4 De in het derde lid bedoelde autoriteit bevordert, voor zover van toepassing, dat het verlies van de andere
      nationaliteit of nationaliteiten in de desbetreffende basisadministratie wordt verwerkt.
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel30c
  - number: 30d
    text: |-
      Tenzij hij wegens de omstandigheden van het geval anders beslist, gaat Onze Minister na verloop van de in
      het eerste lid van [artikel 30b][ref1] bepaalde termijn over tot de intrekking van het besluit waarbij het
      Nederlanderschap is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#Artikel30b
