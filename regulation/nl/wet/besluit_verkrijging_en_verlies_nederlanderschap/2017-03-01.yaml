    text: |-
      Bij ministeriële regeling kan na overleg met de Ministers van Algemene Zaken van Aruba, Curaçao en Sint Maarten
      worden bepaald in welke gevallen het doen van afstand, als bedoeld in [artikel 6a, eerste lid][ref1], niet zal
      worden verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6a
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel30a
