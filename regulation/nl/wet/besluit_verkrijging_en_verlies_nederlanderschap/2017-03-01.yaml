  - number: '73'
    text: |-
      1 Dit besluit is niet van toepassing op optieverklaringen en verzoeken om naturalisatie, alsmede op verklaringen
      van afstand ingediend vóór de datum van inwerkingtreding van dit besluit.

      2 Verklaringen bedoeld als bewijs van het bezit van het Nederlanderschap te dienen, die zijn afgegeven voor
      de datum van inwerkingtreding van dit besluit, worden als zodanig aanvaard, indien zij zijn verstrekt door een
      Nederlandse, Nederlands-Antilliaanse of Arubaanse autoriteit.
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel73
  - number: '74'
    text: |-
      1 Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 Dit besluit wordt aangehaald als: Besluit verkrijging en verlies Nederlanderschap.
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel74
