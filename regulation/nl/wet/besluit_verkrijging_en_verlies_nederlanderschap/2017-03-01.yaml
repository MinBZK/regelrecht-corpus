    text: |-
      1 Onze Minister neemt een besluit tot intrekking op grond van
      [artikel 14, eerste, tweede of derde lid, van de Rijkswet][ref1] uiterlijk binnen zestien weken nadat hij de in het
      [eerste lid van artikel 66][ref2] bedoelde mededeling gedaan heeft.

      2 Het besluit tot intrekking als bedoeld in [artikel 14, eerste tot en met vierde lid, van de Rijkswet][ref3]
      vermeldt de personen wier Nederlanderschap is ingetrokken.


