  - number: '70'
    text: |-
      1 Nadat Onze Minister op grond van artikel 14, eerste tot en met vierde lid, of
      [artikel 15, eerste lid, aanhef en onder d of e, van de Rijkswet][ref1] een besluit tot intrekking heeft genomen,
      zendt hij een afschrift van het besluit aan de persoon wiens Nederlanderschap is ingetrokken, aan de autoriteit
      die verantwoordelijk is voor het bijhouden in de basisadministratie van de gegevens over de desbetreffende persoon
      of aan Onze Minister van Buitenlandse Zaken. Indien de intrekking is gebaseerd op artikel 14, eerste lid, of
      artikel 15, eerste lid, aanhef en onder d of e, wordt tevens een afschrift gezonden aan de autoriteit die de
      optieverklaring of het naturalisatieverzoek in ontvangst heeft genomen. Hij zendt, zo nodig, een afschrift aan
      andere betrokken instanties. Het [tweede, derde en vierde lid van artikel 66][ref2] zijn van overeenkomstige
      toepassing.

      2 Voorzoveel van toepassing, bevordert de autoriteit die dit afschrift heeft ontvangen, dat

      a. het besluit tot intrekking van het Nederlanderschap in de basisadministratie wordt verwerkt;

      b. de Nederlandse reisdocumenten die waren uitgereikt aan de personen die het Nederlanderschap hebben verloren,
      overeenkomstig de [Paspoortwet][ref3] worden ingenomen;

      c. de betrokkenen worden verwezen naar de Vreemdelingendienst van de politie;

      d. de daarvoor in aanmerking komende akten van de burgerlijke stand worden gewijzigd.

      3 Nadat Onze Minister van Buitenlandse Zaken in kennis is gesteld van het besluit tot intrekking bevordert hij dat
      de handelingen genoemd in het tweede lid, onder b en d, worden verricht.

      4 Nadat Onze Minister op grond van [artikel 14, vierde lid, van de Rijkswet][ref4] een besluit tot intrekking heeft
      genomen, draagt hij er zorg voor dat betrokkene onderscheidenlijk zijn reisdocument wordt geregistreerd in het
      Schengen informatiesysteem II en de Stolen and Lost Travel Documents database.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0013605#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0005212
      [ref4]: https://wetten.overheid.nl/BWBR0003738#Artikel14
