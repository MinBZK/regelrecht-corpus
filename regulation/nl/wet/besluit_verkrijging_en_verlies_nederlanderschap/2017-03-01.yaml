        paragraaf: '6'
  - number: 60a
    text: |-
      1 Tenzij anders bepaald, treedt de bevestiging van de verkrijging van het Nederlanderschap als bedoeld in de
      [artikelen 11][ref1], [17][ref2], [23][ref3] en [29][ref4], in werking door de uitreiking ervan aan de optant door
      of namens de tot bevestiging bevoegde autoriteit. De bevestiging werkt terug tot de dag van de dagtekening.

      2 De in het eerste lid genoemde autoriteit roept de optant tezamen met de personen die in de verkrijging zullen
      delen en die ten tijde van het afleggen van de optieverklaring zestien jaar of ouder waren, tijdig voor de
      uitreiking op te verschijnen. Was de optant ten tijde van het afleggen van de optieverklaring jonger dan zestien
      jaar dan wordt zijn wettelijke vertegenwoordiger opgeroepen te verschijnen.

      3 Indien de optant en de personen die in de verkrijging delen, verplicht zijn voorafgaand aan de uitreiking van
      de bevestiging een verklaring af te leggen, vindt de uitreiking niet plaats dan nadat deze verklaring is afgelegd.
      Indien niet alle in de bevestiging genoemde personen die een verklaring dienen af te leggen, daartoe bereid of in
      staat zijn, wordt de uitreiking aangehouden.

      4 Degene aan wie de bevestiging van de verkrijging van het Nederlanderschap in persoon
      wordt uitgereikt en de minderjarige vreemdeling die de bereidverklaring als bedoeld in
      [artikel 6, tweede lid, van de Rijkswet op het Nederlanderschap][ref5] heeft afgelegd, legt de verklaring van
      verbondenheid mondeling af op een door de in het eerste lid genoemde autoriteit te bepalen wijze.

      5 De in het eerste lid genoemde autoriteit kan bepalen dat de betrokkene de verklaring van verbondenheid
      schriftelijk aflegt, indien van hem redelijkerwijs niet kan worden verlangd dat hij deze mondeling aflegt.

      6 Indien betrokkene vanwege zijn fysieke of psychische toestand niet in staat is om de verklaring van verbondenheid
      op de in het vierde of vijfde lid bedoelde wijze af te leggen, wordt de bevestiging bekendgemaakt zonder dat de
      verklaring van verbondenheid is afgelegd.

      7 De uitreiking vindt plaats binnen negen weken nadat is vastgesteld dat de optant heeft voldaan aan de vereisten,
      die aan de optie zijn gesteld. Wegens bijzondere omstandigheden kan deze termijn met een redelijke periode worden
      verlengd.

      8 De bevestiging wordt aan de optant in persoon of, indien hij ten tijde van het afleggen van de optieverklaring
      jonger dan zestien jaar is, aan zijn wettelijke vertegenwoordiger uitgereikt.

      9 Indien om zwaarwegende redenen van een op grond van het tweede lid opgeroepen persoon niet kan worden verlangd
      dat hij de bevestiging in persoon in ontvangst neemt, kan hij zich laten vertegenwoordigen door een daartoe
      schriftelijk gemachtigde meerderjarige persoon. Onder zwaarwegende redenen wordt in ieder geval gerekend de fysieke
      of psychische onmogelijkheid te verschijnen. Om dezelfde redenen kan de in het eerste lid genoemde autoriteit tot
      een andere wijze van bekendmaking of verklaring besluiten.

      10 Indien de op grond van het tweede lid opgeroepen personen bij de uitreiking niet aanwezig zijn, worden zij
      opnieuw opgeroepen. Zo nodig wordt de oproeping vervolgens eenmaal bij aangetekende brief herhaald.

      11 De bevestiging die niet binnen een jaar na de dag waarop zij is gedagtekend aan de optant is bekendgemaakt,
      vervalt ten aanzien van de erin genoemde personen. Indien tegen het besluit omtrent de wijze van afleggen van
      de verklaring van verbondenheid of de wijze van bekendmaking van de bevestiging bezwaar wordt gemaakt of beroep
      wordt ingesteld, wordt deze termijn opgeschort totdat op het bezwaar onderscheidenlijk het beroep onherroepelijk
      is beslist.

      12 De autoriteit die de bevestiging heeft bekendgemaakt, zendt daarvan onverwijld bericht aan Onze Minister en
      deelt daarin mede of en op welke wijze de verklaring van verbondenheid is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013605#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0013605#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0013605#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0003738#Artikel6
