  - number: '32'
    text: |-
      Heeft de verzoeker een of meer nationaliteiten waarvan hij verplicht is afstand te doen, dan legt hij een
      verklaring over houdende dat hij bereid is het mogelijke te zullen doen om bij of na de totstandkoming van de
      naturalisatie zijn andere nationaliteit of nationaliteiten te verliezen.
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel32
  - number: '33'
    text: |-
      1 De burgemeester neemt naturalisatieverzoeken in ontvangst van personen die als ingezetenen van zijn gemeente zijn
      ingeschreven in de basisregistratie personen.

      2 Hij neemt tevens in ontvangst naturalisatieverzoeken van verzoekers die ingevolge wettelijke voorschriften niet
      voor inschrijving als ingezetene in de basisregistratie personen in aanmerking komen, indien zij hoofdverblijf
      hebben in zijn gemeente.

      3 Hij neemt bovendien in ontvangst naturalisatieverzoeken van personen die in zijn gemeente verblijf hebben en
      nergens ter wereld hun hoofdverblijf.

      4 De in het eerste, tweede en derde lid genoemde personen ontvangen een afschrift van hun naturalisatieverzoek.

      5 Naturalisatieverzoeken van andere personen dan die genoemd in het eerste, tweede en derde lid worden door hem
      niet in ontvangst genomen.

      6 Naturalisatieverzoeken worden bij ontvangst voorzien van een datum en een dienststempel.
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel33
  - number: '34'
    text: |-
      1 De verzoeker legt bij zijn verzoek het in [artikel 5, eerste lid, van het Besluit naturalisatietoets][ref1],
      bedoelde inburgeringsdiploma of certificaat over, tenzij [artikel 3][ref2] of
      [4 van het Besluit naturalisatietoets][ref3] van toepassing is.

      2 Alvorens het naturalisatieverzoek in behandeling genomen wordt, onderzoekt de burgemeester de
      betalingsverplichting van de verzoeker overeenkomstig het [Besluit optie- en naturalisatiegelden 2002][ref4].
      Tenzij de verzoeker voor vrijstelling of gehele ontheffing in aanmerking komt, betaalt hij bij de indiening van
      zijn verzoek het volgens het [Besluit optie- en naturalisatiegelden 2002][ref5] verschuldigde naturalisatiegeld.


