      1 De burgemeester zendt zijn advies met het verzoek en de daarop betrekking hebbende gegevens, documenten en
      verklaringen aan Onze Minister.

      2 Onze Minister bevestigt de ontvangst daarvan zonder uitstel aan de burgemeester.
