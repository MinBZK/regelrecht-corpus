  - number: '17'
    text: |-
      1 Nadat Onze Minister heeft vastgesteld dat voldaan is aan de vereisten, die aan de optie zijn gesteld, bericht hij
      de optant schriftelijk de wijze waarop de bevestiging van de verkrijging van het Nederlanderschap bekendgemaakt zal
      worden onder vermelding van de namen van de personen die in deze bekendmaking betrokken zullen zijn. Hij bericht
      gelijktijdig ten aanzien van welke personen hij de bevestiging weigert onder vermelding van de termijn waarbinnen
      tegen zijn besluit bezwaar gemaakt kan worden.

      2 De bevestiging vermeldt de naam, woonplaats en geboortedatum van de optant en van de personen die in de
      verkrijging delen.

      3 De bekendmaking van de bevestiging geschiedt overeenkomstig [hoofdstuk IIIA][ref1].

      4 Bij regeling van Onze Minister kunnen, de gezaghebber gehoord, nadere regels worden gesteld betreffende de
      wijze waarop de bevestiging van de verkrijging van het Nederlanderschap aan de optant wordt bekendgemaakt, alsook
      betreffende de inname van de door de bevoegde autoriteiten in het Koninkrijk afgegeven verblijfsdocumenten van de
      optant en van de personen die in de verkrijging delen.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#HoofdstukIIIA
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013605
        hoofdstuk: IIIA
  - number: '19'
    text: |-
      1 De Gouverneur neemt de optieverklaringen in ontvangst van optanten die als ingezetenen zijn ingeschreven in de
      basisadministratie van Aruba, Curaçao onderscheidenlijk Sint Maarten.

      2 Hij neemt tevens in ontvangst de optieverklaringen van optanten die ingevolge de ter plaatse geldende
      voorschriften omtrent de basisadministratie niet voor inschrijving als ingezetene in de basisadministratie in
      aanmerking komen, indien zij hoofdverblijf hebben in Aruba, Curaçao onderscheidenlijk Sint Maarten.

      3 Hij neemt bovendien in ontvangst de optieverklaringen van optanten die in Aruba, Curaçao onderscheidenlijk Sint
      Maarten verblijf hebben en nergens ter wereld hoofdverblijf.

      4 De in de in het eerste, tweede en derde lid bedoelde optanten ontvangen een afschrift van hun optieverklaring.

      5 De Gouverneur neemt geen optieverklaringen in behandeling van anderen dan die genoemd in het eerste, tweede en
      derde lid.

      6 Optieverklaringen worden bij ontvangst voorzien van een datum en een dienststempel.
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel19
  - number: '20'
    text: |-
      1 Alvorens de optieverklaring in behandeling te nemen onderzoekt de Gouverneur de betalingsverplichting van de
      optant overeenkomstig het [Besluit optie- en naturalisatiegelden 2002][ref1]. Tenzij de optant voor vrijstelling
      of gehele ontheffing in aanmerking komt, betaalt hij bij het afleggen van zijn optieverklaring het volgens het
      [Besluit optie- en naturalisatiegelden 2002][ref2] verschuldigde optiegeld.

      2 Na de betaling van het verschuldigde optiegeld, of na de beslissing tot ontheffing van die betaling, neemt de
      Gouverneur de optieverklaring in behandeling en beoordeelt hij deze op haar volledigheid. Zo nodig verzoekt hij om
      aanvulling van de gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013782
      [ref2]: https://wetten.overheid.nl/BWBR0013782
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel20
