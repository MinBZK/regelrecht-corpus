      1 Nadat hij het verzoek tot naturalisatie in behandeling genomen heeft, toetst Onze Minister van Buitenlandse Zaken
      de door de verzoeker verstrekte gegevens aan de gegevens die in de administratie zijn opgenomen.

      2 Met betrekking tot personen die in het naturalisatieverzoek zijn genoemd en die hoofdverblijf hebben binnen het
      Koninkrijk verzoekt hij zo nodig, al naar gelang de plaats waar zij volgens de basisadministratie als ingezetene
      zijn ingeschreven, aan de burgemeester van de betreffende gemeente, aan de gezaghebber van het betrokken openbaar
      lichaam of aan Onze Minister van Algemene Zaken van Aruba, Curaçao onderscheidenlijk Sint Maarten de hem verstrekte
      gegevens binnen tien weken te toetsen.

      3 Hij onderzoekt, voor zover mogelijk, de juistheid van de gegevens welke niet op de in het eerste of tweede lid
      van dit artikel aangegeven wijze kunnen worden getoetst.
