  - number: '50'
    text: |-
      1 Onze Minister zendt de uittreksels van het besluit tot verlening van het Nederlanderschap onverwijld ter
      bekendmaking toe aan de autoriteit van de woonplaats van de verzoeker. Hij zendt het besluit tot gehele of
      gedeeltelijke afwijzing van het verzoek toe aan de verzoeker onder vermelding van de termijn waarbinnen tegen het
      besluit bezwaar gemaakt kan worden. Hij bericht een en ander gelijktijdig aan de Gouverneur en aan de Minister van
      Justitie van Aruba, Curaçao onderscheidenlijk Sint Maarten.

      2 De bekendmaking van het besluit tot verlening van het Nederlanderschap geschiedt overeenkomstig het bepaalde
      in [hoofdstuk IIIA][ref1].

      3 Bij regeling van Onze Minister kunnen nadere regels worden gesteld betreffende de wijze van bekendmaking van de
      verlenging van het Nederlanderschap alsook, na overleg met de Ministers van Justitie van Aruba, Curaçao en Sint
      Maarten, betreffende de inname van de door de bevoegde autoriteiten in het Koninkrijk afgegeven verblijfsdocumenten
      van de verzoeker en van de personen die in de naturalisatie delen.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#HoofdstukIIIA
