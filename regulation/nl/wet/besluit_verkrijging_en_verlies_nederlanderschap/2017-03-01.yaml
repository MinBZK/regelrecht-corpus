      1 Bij de indiening van een naturalisatieverzoek verstrekt de verzoeker betreffende zichzelf, voorzoveel mogelijk,
      gegevens met betrekking tot:

      a. geslachtsnaam en voornaam of voornamen, onderscheidenlijk naam of namen;

      b. geboortedatum, geboorteplaats en geboorteland;

      c. adres, postcode en woonplaats;

      d. geslacht;

      e. nationaliteit of nationaliteiten;

      f. tegenwoordige en, voorzoveel nodig, eerdere verblijfsrechtelijke status;

      g. duur van huidige toegelaten verblijf in het Koninkrijk en, indien van toepassing, duur van eerder toegelaten
      verblijf in het Koninkrijk;

      h. indien van toepassing, bestaan en duur van het huwelijk of geregistreerd partnerschap, dan wel ontbinding
      daarvan, alsmede ten aanzien van de echtgenoot of partner de gegevens bedoeld onder a tot en met e;

      i. geslachtsnaam en voornamen, plaats en datum van geboorte en van huwelijk van de ouders van de verzoeker;

      j. indien van toepassing, de kinderen tot wie hij in familierechtelijke betrekking staat;

      k. indien van toepassing, bestaan, duur en plaats van samenleving met een Nederlander;

      l. de overige gegevens die naar het oordeel van Onze Minister nodig zijn voor de beoordeling van het geval.

      2 In zijn verzoek vermeldt de verzoeker de minderjarige kinderen en kindskinderen die hij in zijn naturalisatie
      wenst te betrekken. Hij verstrekt over hen, voorzoveel mogelijk, de gegevens genoemd in het eerste lid.

      3 Betrekt de verzoeker in zijn verzoek mede een kind dat de leeftijd van zestien jaar heeft bereikt, dan is vereist
      dat het kind op de wijze bepaald in [artikel 3][ref1] verklaart in te stemmen met de naturalisatie.

      4 De verzoeker en ieder minderjarig kind dat de leeftijd van zestien jaar heeft bereikt legt een schriftelijke
      en ondertekende verklaring over dat de gevraagde gegevens naar waarheid zijn verstrekt en dat geen relevante
      gegevens zijn verzwegen. Behoudens in de gevallen waarin toelating niet is vereist, verklaart hij op dezelfde
      wijze dat in het kader van de verkrijging en het behoud van de verblijfsvergunning van hemzelf en de overige in het
      naturalisatieverzoek genoemde personen van 15 jaar of jonger de gevraagde gegevens naar waarheid zijn verstrekt en
      dat geen relevante gegevens zijn verzwegen.

      5 De autoriteit die het naturalisatieverzoek in ontvangst neemt, alsook Onze Minister, kan verlangen dat de
      verzoeker de juistheid van de verstrekte gegevens bewijst door middel van zo nodig gelegaliseerde en eventueel
      inhoudelijk geverifieerde documenten. Hij kan tevens verlangen dat die aanvullende gegevens worden verstrekt indien
      dit naar zijn oordeel nodig is voor de beoordeling van het geval.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#Artikel3
