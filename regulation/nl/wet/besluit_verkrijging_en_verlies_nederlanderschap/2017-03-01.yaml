  - number: '63'
    text: |-
      1 Een verklaring van afstand van het Nederlanderschap wordt afgelegd:

      a. in het Europese deel van Nederland: voor de burgemeester;

      b. in een openbaar lichaam: voor Onze Minister;

      c. in Aruba, Curaçao en Sint Maarten: voor de Gouverneur;

      d. in het buitenland: voor Onze Minister van Buitenlandse Zaken.

      2 Alvorens de verklaring in ontvangst te nemen stelt de autoriteit ten overstaan van wie deze wordt afgelegd de
      identiteit vast van de persoon die de verklaring aflegt. Hij bepaalt tevens, voor zover mogelijk, welke andere
      personen door deze afstand hun Nederlanderschap zullen verliezen.

      3 De persoon die in overeenstemming met [artikel 3][ref1] een verklaring van afstand heeft afgelegd, ontvangt
      daarvan onverwijld een bevestiging, die tevens, voor zoveel mogelijk, de namen vermeldt van de personen die door
      deze afstand hun Nederlanderschap hebben verloren.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#Artikel3
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel63
    references:
