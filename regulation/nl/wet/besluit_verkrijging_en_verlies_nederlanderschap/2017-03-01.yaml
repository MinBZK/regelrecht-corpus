  - number: '7'
    text: |-
      1 De burgemeester neemt de optieverklaringen in ontvangst van optanten die als ingezetenen van zijn gemeente zijn
      ingeschreven in de basisregistratie personen.

      2 Hij neemt tevens in ontvangst de optieverklaringen van optanten die ingevolge wettelijke voorschriften niet voor
      inschrijving als ingezetene in de basisregistratie personen in aanmerking komen, indien zij hoofdverblijf hebben in
      zijn gemeente.

      3 Hij neemt bovendien in ontvangst de optieverklaringen van optanten die in zijn gemeente verblijf hebben en
      nergens ter wereld hun hoofdverblijf.

      4 De in het eerste tot en met het derde lid bedoelde optanten ontvangen een afschrift van hun optieverklaring.

      5 De burgemeester neemt geen optieverklaringen in behandeling van anderen dan die genoemd in het eerste, tweede en
      derde lid.

      6 Optieverklaringen worden bij ontvangst voorzien van een datum en een dienststempel.
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel7
  - number: '8'
    text: |-
      1 Alvorens de optieverklaring in behandeling te nemen onderzoekt de burgemeester de betalingsverplichting van de
      optant overeenkomstig het [Besluit optie- en naturalisatiegelden 2002][ref1]. Tenzij de optant voor vrijstelling
      of gehele ontheffing in aanmerking komt, betaalt hij bij het afleggen van zijn optieverklaring het volgens het
      [Besluit optie- en naturalisatiegelden 2002][ref2] verschuldigde optiegeld.

      2 Na de betaling van het verschuldigde optiegeld, of na de beslissing tot ontheffing van die betaling neemt de
      burgemeester de optieverklaring in behandeling en beoordeelt hij deze op haar volledigheid. Zo nodig verzoekt hij
      om aanvulling van de gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013782
      [ref2]: https://wetten.overheid.nl/BWBR0013782
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013782
      - id: ref2
        bwb_id: BWBR0013782
  - number: '9'
    text: |-
      1 Nadat hij de optieverklaring in behandeling heeft genomen, toetst de burgemeester de door de optant verstrekte
      gegevens aan de gegevens die in de basisregistratie personen zijn opgenomen.

      2 Met betrekking tot personen die in de optieverklaring zijn genoemd en die geen ingezetenen zijn van zijn
      gemeente verzoekt hij zo nodig, al naar gelang de plaats waar zij volgens de basisadministratie als ingezetene zijn
      ingeschreven, aan de burgemeester van de betreffende gemeente om binnen vier weken, of aan de gezaghebber van het
      betreffende openbaar lichaam, dan wel aan Onze Minister van Algemene Zaken van Aruba, Curaçao of Sint Maarten om
      binnen tien weken de hem verstrekte gegevens te toetsen.

      3 Met betrekking tot personen die in de optieverklaring zijn genoemd en die geen hoofdverblijf hebben in het
      Koninkrijk, verzoekt hij, zo nodig, Onze Minister van Buitenlandse Zaken de hem verstrekte gegevens zo mogelijk
      binnen tien weken te toetsen.

      4 Hij verzoekt Onze Minister van Buitenlandse Zaken de gegevens van personen, bedoeld in
      [artikel 7, tweede lid][ref1], binnen vier weken te toetsen aan de gegevens die zijn opgenomen in het door deze
      gehouden register.

      5 Hij onderzoekt, voor zover mogelijk, de juistheid van de gegevens die niet op de in het eerste tot en met het
      vierde lid aangegeven wijze kunnen worden getoetst.

      6 De in het tweede tot en met het vierde lid genoemde autoriteiten zijn verplicht de genoemde medewerking te
      verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#Artikel7
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel9
