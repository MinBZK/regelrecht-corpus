      1 De Gouverneur zendt zijn advies met het verzoek en de daarop betrekking hebbende gegevens, documenten en
      verklaringen door tussenkomst van de Minister van Justitie van Aruba, Curaçao onderscheidenlijk Sint Maarten aan
