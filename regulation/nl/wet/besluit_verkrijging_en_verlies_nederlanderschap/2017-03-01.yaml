  - number: '68'
    text: |-
      Bij zijn besluit tot intrekking van het Nederlanderschap op grond van
      [artikel 14, eerste lid, van de Rijkswet][ref1] houdt Onze Minister onder meer rekening met de aard en ernst van
      de valse verklaring, het bedrog of de verzwijging, de mogelijke staatloosheid van betrokkene na de intrekking,
      alsook met de tijdsduur die sinds de verkrijging of verlening verlopen is, de gevolgen van het verlies van
      Unieburgerschap, indien dit ten gevolge van de intrekking van het Nederlanderschap optreedt en de overige relevante
      factoren.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel68
