  - number: '65'
    text: |-
      De autoriteiten en ambtenaren bevoegd tot het in ontvangst nemen van optieverklaringen en naturalisatieverzoeken
      die in de uitoefening van hun ambt kennis krijgen van valse verklaringen of bedrog, dan wel van de verzwijging van
      enig relevant feit dat geleid heeft tot de verkrijging of verlening van het Nederlanderschap, melden dit onverwijld
      aan Onze Minister, zo nodig onder medezending van afschriften van op de zaak betrekkelijke stukken.
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel65
  - number: '66'
    text: |-
      1 Indien Onze Minister het voornemen heeft een besluit te nemen tot intrekking van het besluit waarbij het
      Nederlanderschap is verkregen of verleend, als bedoeld in [artikel 14, eerste lid, van de Rijkswet][ref1], doet hij
      daarvan schriftelijk mededeling aan de bij de intrekking rechtstreeks betrokken persoon of personen alsmede aan de
      autoriteit die de optieverklaring of het naturalisatieverzoek in ontvangst genomen heeft. Indien Onze Minister het
      voornemen heeft een besluit te nemen tot intrekking van het Nederlanderschap, als bedoeld in artikel 14, tweede
      of derde lid, van de Rijkswet, doet hij daarvan schriftelijk mededeling aan de bij de intrekking rechtstreeks
      betrokken persoon of personen.

      2 Heeft de betrokken persoon een bekende woon- of verblijfplaats, dan wordt de mededeling aan dat adres gezonden;
      heeft hij geen bekende woon- of verblijfplaats, dan wordt de mededeling gezonden aan zijn laatst bekende adres
      in het Europese deel van Nederland, Aruba, Curaçao of Sint Maarten dan wel de openbare lichamen Bonaire, Sint
      Eustatius of Saba of door tussenkomst van het Ministerie van Buitenlandse Zaken aan zijn laatst bekende adres in
      het buitenland.

      3 Indien Onze Minister zulks noodzakelijk acht, geeft hij van zijn voornemen kennis door uitreiking van de in het
      eerste lid bedoelde mededeling.

      4 Indien Onze Minister zulks noodzakelijk acht, geeft hij van zijn voornemen tevens kennis in een of meer
      van de lokale bladen van de vermoedelijke verblijfplaats van betrokkenen of in de daarvoor bestemde officiële
      publicatiebladen, al naar gelang die verblijfplaats.

      5 Onder rechtstreeks betrokken persoon wordt in dit artikel verstaan de Nederlander op wie het in het eerste lid
      bedoelde voornemen betrekking heeft, alsmede, voor zover zij bij het voornemen een rechtstreeks belang hebben, zijn
      kinderen en adoptiefkinderen, alsmede zijn echtgenoot of geregistreerde partner. Bij ministeriële regeling kunnen
      andere personen als betrokken worden aangemerkt.

      6 In de in het eerste lid bedoelde mededelingen vermeldt Onze Minister ten minste

      a. de zakelijke inhoud en korte redengeving van zijn voorgenomen besluit,

      b. de mogelijkheid voor betrokkenen of de genoemde autoriteiten om hun bedenkingen tegen dit voornemen in te
      brengen, en op welke wijze en binnen welke termijn dit kan geschieden,

      c. dat degene die schriftelijke bedenkingen inbrengt, kan verzoeken dat zijn persoonlijke gegevens niet worden
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
