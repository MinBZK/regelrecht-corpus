      [artikel 45, tweede lid][ref1], binnen vier weken te toetsen aan de gegevens die zijn opgenomen in het door deze
      gehouden register.

      5 Hij onderzoekt, voor zover mogelijk, de juistheid van de gegevens die niet op de in het eerste tot en met het
      vierde lid aangegeven wijze kunnen worden getoetst.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#Artikel45
