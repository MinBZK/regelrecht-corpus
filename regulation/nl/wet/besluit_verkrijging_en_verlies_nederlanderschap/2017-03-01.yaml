      Tenzij hij wegens de omstandigheden van het geval anders beslist, gaat Onze Minister na verloop van de in
      het eerste lid van [artikel 58][ref1] bepaalde termijn over tot de intrekking van het besluit waarbij het
      Nederlanderschap is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#Artikel58
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel60
