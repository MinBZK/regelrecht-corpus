  - number: 68a
    text: |-
      Bij zijn besluit tot intrekking van het Nederlanderschap op grond van
      [artikel 14, tweede lid, van de Rijkswet][ref1] houdt Onze Minister onder meer rekening met:

      a. de gevolgen van het verlies van Unieburgerschap, indien dit ten gevolge van de intrekking van het
      Nederlanderschap optreedt;

      b. zeer bijzondere persoonlijke omstandigheden van de betrokkene, voor zover deze relevant zijn voor het besluit
      tot intrekking van het Nederlanderschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel68a
