        artikel: '3'
        hoofdstuk: I
  - number: '64'
    text: |-
      1 De in het [tweede lid van artikel 63][ref1] genoemde autoriteit, niet zijnde Onze Minister, zendt de verklaring
      van afstand alsmede een afschrift van de bevestiging toe aan Onze Minister; hij behoudt een afschrift daarvan.

      2 Hij zendt bovendien een afschrift van de bevestiging aan de autoriteit die verantwoordelijk is voor het bijhouden
      in de basisadministratie van de gegevens over de persoon die de afstand betreft. Met betrekking tot personen die in
      hun land woonachtig zijn, zendt hij tevens een afschrift van de verklaring van afstand en van de bevestiging aan de
      Minister van Justitie van Aruba, Curaçao en Sint Maarten.

      3 Voorzoveel van toepassing bevordert de autoriteit ten overstaan van wie een verklaring van afstand is afgelegd,
      alsmede de in het voorgaande lid bedoelde autoriteit die een afschrift van de bevestiging bedoeld in het
      [derde lid van artikel 63][ref2] heeft ontvangen, dat

      a. de verklaring van afstand van het Nederlanderschap in de basisadministratie wordt verwerkt;

      b. de Nederlandse reisdocumenten die waren uitgereikt aan de personen die door of als gevolg van de afstand het
      Nederlanderschap hebben verloren, overeenkomstig de [Paspoortwet][ref3] worden ingenomen;

      c. indien van toepassing: de betrokkenen worden verwezen naar de Vreemdelingendienst van de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0013605#Artikel63
