  - number: '36'
    text: |-
      1 De burgemeester onderzoekt de verblijfsrechtelijke status van de verzoeker en de personen om wier medeverlening
      wordt verzocht. Zo nodig verwijst hij de verzoeker voor een bewijs van toelating naar de daartoe bevoegde
      instanties.

      2 Hij informeert de verzoeker over de wijze waarop Onze Minister toetst of ernstige vermoedens bestaan als bedoeld
      in [artikel 9, eerste lid, aanhef en onder a, van de Rijkswet][ref1] jegens de verzoeker of de minderjarige
      personen die tot medeverlening van het Nederlanderschap in het naturalisatieverzoek zijn genoemd, indien zij ouder
      zijn dan zestien jaar.

      3 Hij onderzoekt eveneens of deze personen aan de overige voor hun naturalisatie gestelde voorwaarden voldoen.

      4 In de gevallen bedoeld in [artikel 12 van de Rijkswet][ref2] overlegt de burgemeester met de verzoeker over de
      vaststelling en de spelling van de geslachtsnaam en voornaam of voornamen van de verzoeker alsmede van de personen
      om wier medeverlening is verzocht, en over de in het Koninkrijk gebruikelijke lettertekens waarin de namen van
      de verzoeker en van de personen om wier medeverlening wordt verzocht, zullen worden overgebracht. Hij vraagt, zo
      nodig, de toestemming van de verzoeker tot wijziging van de naam.

      5 De burgemeester stelt de andere in het verzoek genoemde personen, die de leeftijd van twaalf jaar hebben bereikt,
      alsook de wettelijke vertegenwoordiger en de in [het vierde lid van artikel 2 van de Rijkswet][ref3] bedoelde
      andere ouder van deze personen op hun verzoek in de gelegenheid hun zienswijze inzake de naturalisatie alsook
      inzake de naamswijziging en naamsvaststelling kenbaar te maken.

      6 Nadat de burgemeester de handelingen bedoeld in de voorgaande artikelen van deze paragraaf heeft verricht, brengt
      hij over het naturalisatieverzoek en de eventuele naamsvaststelling en naamswijziging advies uit aan Onze Minister.


