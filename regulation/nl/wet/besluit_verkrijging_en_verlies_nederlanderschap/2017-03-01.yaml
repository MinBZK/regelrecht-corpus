  - number: '10'
    text: |-
      1 Behoudens in de gevallen waarin toelating niet vereist is, onderzoekt de burgemeester de verblijfsrechtelijke
      status van de optant en van de personen die tot medeverkrijging in de optieverklaring zijn genoemd. Zo nodig
      verwijst hij de optant voor een bewijs van toelating naar de daartoe bevoegde instanties.

      2 Behoudens in de gevallen, bedoeld in [artikel 6, eerste lid, aanhef en onder b en c van de Rijkswet][ref1] en
      waar dit overigens is bepaald, onderzoekt de burgemeester of er ernstige vermoedens bestaan als bedoeld in artikel
      6, vierde lid, van de Rijkswet, jegens de optant of de personen die tot medeverkrijging in de optieverklaring zijn
      genoemd, indien zij ouder zijn dan zestien jaar.

      3 In de gevallen, bedoeld in het [zesde lid van artikel 6 van de Rijkswet][ref2], treedt hij met de optant in
      overleg over de vaststelling en de spelling van geslachtsnaam en voornaam of voornamen van de personen die in de
      optieverklaring zijn genoemd, en over de in het Koninkrijk gebruikelijke lettertekens waarin de namen van de optant
      en van de personen die hij in zijn optie wenst te betrekken, zullen worden overgebracht.

      4 Hij stelt de andere in de optieverklaring genoemde personen, die de leeftijd van twaalf jaar hebben bereikt,
      alsook de wettelijke vertegenwoordiger en de in het [vierde lid van artikel 2 van de Rijkswet][ref3] bedoelde
      andere ouder van deze personen op hun verzoek in de gelegenheid hun zienswijze inzake de optie alsook inzake de
      naamsvaststelling kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel2
