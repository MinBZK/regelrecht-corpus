  - number: 70a
    text: |-
      Het bevoegd orgaan, bedoeld in [artikel 22B, vijfde lid, van de Rijkswet][ref1] is:

        - *in het Europese deel van Nederland:* het bestuur van de raad voor rechtsbijstand;
        - *in een openbaar lichaam:* de Minister van Veiligheid en Justitie van Nederland;
        - *in Aruba:* de Minister van Sociale zaken, Jeugd en Arbeid;
        - *in Curaçao:* de Minister van Sociale Ontwikkeling, Arbeid en Welzijn;
        - *in Sint Maarten:* de Minister van Volksgezondheid, Sociale Ontwikkeling en Arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel22b
