  - number: 60b
    text: |-
      1 Tenzij anders bepaald, treedt het besluit tot verlening van het Nederlanderschap voor een daarin genoemde persoon
      in werking door de uitreiking aan hem van het hem betreffend uittreksel van het besluit. Het besluit werkt terug
      tot de dag van de dagtekening.

      2 Binnen zes weken na de dag van dagtekening van het naturalisatiebesluit en tijdig voor de uitreiking roept
      de autoriteit van de woonplaats van de betrokken persoon die ten tijde van de indiening van het verzoek tot
      naturalisatie zestien jaar of ouder was, deze op te verschijnen. Was de betrokkene ten tijde van de indiening van
      het verzoek tot naturalisatie jonger dan zestien jaar dan wordt zijn wettelijke vertegenwoordiger opgeroepen te
      verschijnen. Wegens bijzondere omstandigheden kan deze termijn met een redelijke periode worden verlengd.

      3 Indien de opgeroepen persoon verplicht is voorafgaand aan de uitreiking een verklaring af te leggen, vindt de
      uitreiking van het uittreksel van het besluit niet plaats dan nadat deze verklaring is afgelegd.

      4 Degene aan wie het uittreksel van het besluit tot verlening van het Nederlanderschap in persoon wordt uitgereikt,
      legt de verklaring van verbondenheid mondeling af op een door de bevoegde autoriteit te bepalen wijze.

      5 De bevoegde autoriteit kan bepalen dat de betrokkene de verklaring van verbondenheid schriftelijk aflegt, indien
      van hem redelijkerwijs niet kan worden verlangd dat hij deze mondeling aflegt.

      6 Indien betrokkene vanwege zijn fysieke of psychische toestand niet in staat is om de verklaring van verbondenheid
      op de in het vierde of vijfde lid bedoelde wijze af te leggen, wordt het uittreksel van het besluit tot verlening
      van het Nederlanderschap bekendgemaakt zonder dat de verklaring is afgelegd.

      7 De uitreiking vindt door of namens de autoriteit, die de betrokkene heeft opgeroepen, plaats binnen zes weken na
      de verzending van de oproeping.

      8 Het hem betreffend uittreksel van het besluit wordt aan de betrokkene in persoon of, indien hij ten tijde van
      de indiening van het verzoek tot naturalisatie jonger dan zestien jaar is, aan zijn wettelijke vertegenwoordiger
      uitgereikt.

      9 Indien om zwaarwegende redenen van een op grond van het tweede lid opgeroepen persoon niet kan worden verlangd
      dat hij het hem betreffende uittreksel van het besluit in persoon in ontvangst neemt, kan hij zich laten
      vertegenwoordigen door een daartoe schriftelijk gemachtigde meerderjarige persoon. Onder zwaarwegende redenen wordt
      in ieder geval gerekend de fysieke of psychische onmogelijkheid te verschijnen. Om dezelfde redenen kan de in het
      tweede lid genoemde autoriteit tot een andere wijze van bekendmaking of verklaring besluiten.

      10 Indien de betrokkene bij de in het zevende lid bedoelde uitreiking niet aanwezig is, wordt hij opnieuw
      opgeroepen. Zo nodig wordt de oproeping vervolgens eenmaal bij aangetekende brief herhaald.

      11 Het besluit tot verlening van het Nederlanderschap vervalt ten aanzien van een erin genoemd persoon indien het
      hem betreffend uittreksel van dit besluit niet binnen een jaar na de dag waarop het besluit is gedagtekend aan hem
      is bekendgemaakt. Indien tegen het besluit omtrent de wijze van afleggen van de verklaring van verbondenheid of
      de wijze van bekendmaking van het uittreksel van het besluit tot verlening van het Nederlanderschap bezwaar wordt
      gemaakt of beroep wordt ingesteld, wordt deze termijn opgeschort totdat op het bezwaar onderscheidenlijk het beroep
      onherroepelijk is beslist.

      12 De autoriteit die het uittreksel van het besluit tot verlening van het Nederlanderschap heeft bekendgemaakt,
      zendt daarvan onverwijld een bericht aan Onze Minister. Hij bericht ook of en op welke wijze de verklaring van
      verbondenheid is afgelegd en welke uittreksels hij na herhaalde oproepingen niet heeft kunnen uitreiken. Hij zendt
      de uittreksels betreffende de personen voor wie een besluit is vervallen, terug aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel60b
  - number: '61'
    text: |-
      1 Als verklaring omtrent het bezit van het Nederlanderschap,
      bedoeld in [artikel 15, vierde lid van de Rijkswet][ref1] en in
      __REF001___________________________________________________________________________________________________________
      ________________ met betrekking tot de verkrijging, de verlening en het verlies van het Nederlanderschap, geldt:

      a. de onherroepelijke rechterlijke beschikking waarbij het Nederlanderschap is vastgesteld;

      b. een uittreksel uit de basisadministratie, waaruit blijkt dat de betrokkene als Nederlander is aangemerkt; of

      c. een verklaring afgegeven door Onze Minister van Buitenlandse Zaken, waaruit blijkt dat de betrokkene Nederlander
      is.

      2 Een verklaring omtrent het bezit van het Nederlanderschap wordt alleen op aanvraag van de betrokken persoon
      verstrekt.

      3 De documenten genoemd onder b en c van het eerste lid dienen de woorden te bevatten: Verklaring omtrent het bezit
      van het Nederlanderschap, en van een datum van verstrekking en een dienststempel te zijn voorzien.

      4 Bij ministeriële regeling kan worden bepaald welke andere documenten als verklaring omtrent het bezit van het
      Nederlanderschap kunnen dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0012089#ArtikelV
