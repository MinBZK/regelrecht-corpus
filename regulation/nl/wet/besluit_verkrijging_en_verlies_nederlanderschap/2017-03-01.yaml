articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Justitie in zijn hoedanigheid van minister van het Koninkrijk;

      b. Rijkswet: de [Rijkswet op het Nederlanderschap][ref1];

      c. optie: verkrijging van het Nederlanderschap, als bedoeld in hoofdstuk 3
      en in [artikel 28 van de Rijkswet op het Nederlanderschap][ref2], alsmede in
      __REF001___________________________________________________________________________________________________________
      ________________;

      d. naturalisatie: verlening van het Nederlanderschap, als bedoeld in
      [hoofdstuk 4 van de Rijkswet op het Nederlanderschap][ref4];

      e. intrekking: intrekking van het Nederlanderschap, als bedoeld in
      [hoofdstuk 5 van de Rijkswet op het Nederlanderschap][ref5];

      f. basisadministratie:

      1° de basisregistratie personen, bedoeld in de [Wet basisregistratie personen][ref6],

      2° de bij Wet basisadministratie persoonsgegevens BES ingestelde basisadministratie persoonsgegevens, of

      3° de bij landsverordening in Aruba, Curaçao of Sint Maarten ingestelde basisadministratie persoonsgegevens;

      g. ingezetene: hij die als zodanig is ingeschreven in de basisadministratie;

      h. openbaar lichaam: de openbare lichamen Bonaire, Sint Eustatius en Saba.


