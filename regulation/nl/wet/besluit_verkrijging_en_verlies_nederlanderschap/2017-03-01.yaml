      - id: ref1
        bwb_id: BWBR0013782
      - id: ref2
        bwb_id: BWBR0013782
  - number: '21'
    text: |-
      1 Nadat hij de optieverklaring in behandeling heeft genomen, verzoekt de Gouverneur Onze Minister van Algemene
      Zaken die het aangaat de door de optant verstrekte gegevens te toetsen aan de gegevens die in de basisadministratie
      zijn opgenomen.

      2 Met betrekking tot personen die in de optieverklaring zijn genoemd en die geen hoofdverblijf hebben in
      Aruba, Curaçao onderscheidenlijk Sint Maarten verzoekt hij zo nodig, al naar gelang de plaats waar zij volgens de
      basisadministratie als ingezetene zijn ingeschreven, aan de burgemeester van de gemeente of de gezaghebber van het
      betrokken openbaar lichaam om binnen tien weken de hem verstrekte gegevens te toetsen.

      3 Met betrekking tot personen die in de optieverklaring zijn genoemd en die geen hoofdverblijf hebben in het
      Koninkrijk, verzoekt hij, zo nodig, Onze Minister van Buitenlandse Zaken de hem verstrekte gegevens zo mogelijk
      binnen tien weken te toetsen.

      4 Hij verzoekt in het voorkomende geval Onze Minister van Buitenlandse Zaken de gegevens van personen, bedoeld in
      [artikel 19, tweede lid][ref1], binnen vier weken te toetsen aan de gegevens die zijn opgenomen in het door deze
      gehouden register.

      5 Hij onderzoekt, voor zover mogelijk, de juistheid van de gegevens die niet op de in het eerste tot en met het
      vierde lid aangegeven wijze kunnen worden getoetst.

      6 De in het tweede tot en met het vierde lid genoemde autoriteiten zijn verplicht de genoemde medewerking te
      verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#Artikel19
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel21
