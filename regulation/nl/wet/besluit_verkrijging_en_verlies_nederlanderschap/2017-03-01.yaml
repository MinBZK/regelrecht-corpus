  - number: '35'
    text: |-
      1 Nadat hij het verzoek tot naturalisatie in behandeling genomen heeft, toetst de burgemeester de door de verzoeker
      verstrekte gegevens aan de gegevens die in de basisregistratie personen zijn opgenomen.

      2 Met betrekking tot personen die in het naturalisatieverzoek zijn genoemd en die geen ingezetenen zijn van zijn
      gemeente verzoekt hij zo nodig, al naar gelang de plaats waar zij volgens de basisadministratie als ingezetene zijn
      ingeschreven, aan de burgemeester van de betreffende gemeente om binnen vier weken, en aan de gezaghebber van het
      betrokken openbaar lichaam dan wel aan Onze Minister van Algemene Zaken van Aruba, Curaçao onderscheidenlijk Sint
      Maarten om binnen tien weken de hem verstrekte gegevens te toetsen.

      3 Met betrekking tot personen die in het naturalisatieverzoek zijn genoemd en die geen hoofdverblijf hebben in
      het Koninkrijk verzoekt hij, zo nodig, Onze Minister van Buitenlandse Zaken de hem verstrekte gegevens zo mogelijk
      binnen tien weken te toetsen.

      4 Hij verzoekt Onze Minister van Buitenlandse Zaken de gegevens van personen, bedoeld in
      [artikel 33, tweede lid][ref1], binnen vier weken te toetsen aan de gegevens die zijn opgenomen in het door deze
      gehouden register.

      5 Hij onderzoekt, voor zover mogelijk, de juistheid van de gegevens die niet op de in het eerste tot en met het
      vierde lid aangegeven wijze kunnen worden getoetst.


