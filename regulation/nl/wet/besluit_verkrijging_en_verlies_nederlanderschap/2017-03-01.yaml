  - number: '67'
    text: |-
      Onze Minister zendt van de ingebrachte bedenkingen een afschrift aan de in het [eerste lid van artikel 66][ref1]
      genoemde personen en indien van toepassing autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#Artikel66
