  - number: '2'
    text: |-
      Tot het in ontvangst nemen van optieverklaringen en naturalisatieverzoeken en tot het uitreiken van uittreksels van
      naturalisatiebesluiten zijn bevoegd

      a. in het Europese deel van Nederland: de burgemeesters;

      b. in de openbare lichamen: Onze Minister en, tot het uitreiken van uittreksels van naturalisatiebesluiten en
      van de bevestiging van de verkrijging van het Nederlanderschap als bedoeld in [artikel 60a, eerste lid][ref1],de
      gezaghebbers;

      c. in Aruba, Curaçao en Sint Maarten: de Gouverneur van Aruba, van Curaçao onderscheidenlijk van Sint Maarten;

      d. in het buitenland: de Minister van Buitenlandse Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#Artikel60a
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel2
