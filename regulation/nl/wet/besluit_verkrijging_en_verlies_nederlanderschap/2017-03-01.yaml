  - number: '11'
    text: |-
      1 Nadat de burgemeester heeft vastgesteld dat is voldaan aan de vereisten, die aan de optie zijn gesteld, bericht
      hij de optant schriftelijk de wijze waarop de bevestiging van de verkrijging van het Nederlanderschap bekendgemaakt
      zal worden onder vermelding van de namen van de personen die in deze bekendmaking betrokken zullen zijn. Hij
      bericht gelijktijdig ten aanzien van welke personen hij de bevestiging weigert onder vermelding van de termijn
      waarbinnen tegen zijn besluit bezwaar gemaakt kan worden.

      2 De bevestiging vermeldt de naam, woonplaats en geboortedatum van de optant en van de personen die in de
      verkrijging delen.

      3 De bekendmaking van de bevestiging geschiedt overeenkomstig [hoofdstuk IIIA][ref1].

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld betreffende de wijze waarop de bevestiging van
      de verkrijging van het Nederlanderschap aan de optant wordt bekendgemaakt alsook betreffende de inname van de door
      de bevoegde autoriteiten in het Koninkrijk afgegeven verblijfsdocumenten van de optant en van de personen die in de
      verkrijging delen.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#HoofdstukIIIA
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013605
        hoofdstuk: IIIA
  - number: '12'
    text: |-
      1 De burgemeester zendt de optieverklaring, de afgelegde waarheidsverklaringen, bedoeld in
      [artikel 6, vierde lid][ref1], de verklaring, bedoeld in artikel 6, zesde lid, de gegevens betreffende de toelating
      en de bevestiging van de verkrijging van het Nederlanderschap in afschrift aan Onze Minister.

      2 Hij archiveert de optieverklaringen en de daarbij behorende documenten, alsmede afschriften van de bevestigingen
      gedurende tenminste twaalf jaar na de bekendmaking.


