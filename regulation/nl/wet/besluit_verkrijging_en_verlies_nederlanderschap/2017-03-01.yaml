      Bij ministeriële regeling kan na overleg met Onze Ministers van Algemene Zaken van Aruba,
      Curaçao en Sint Maarten worden bepaald in welke gevallen het doen van afstand, als bedoeld in
      [artikel 9, eerste lid, aanhef en onder b][ref1], niet zal worden verlangd.


