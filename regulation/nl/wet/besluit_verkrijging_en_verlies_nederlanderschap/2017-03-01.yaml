  - number: '62'
    text: |-
      1 Een verklaring van afstand van het Nederlanderschap als bedoeld in
      [artikel 15, eerste lid, aanhef en onder b][ref1], of als bedoeld in
      [artikel 16, eerste lid, aanhef en onder b, van de Rijkswet][ref2] wordt schriftelijk
      afgelegd. De verklaring vermeldt dat de persoon die de verklaring aflegt, bekend is met
      [artikel 16, eerste lid, aanhef en onder d, en tweede lid van de Rijkswet][ref3].

      2 Aan de verklaring van afstand wordt zo nodig een bewijs toegevoegd dat de verklarende persoon en, in voorkomend
      geval, de minderjarige personen die in zijn afstand delen een andere nationaliteit bezitten.

      3 Indien de verklaring een minderjarige betreft, wordt zo nodig tevens een bewijs van de nationaliteit van de vader
      en moeder of adoptiefouder toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel16
