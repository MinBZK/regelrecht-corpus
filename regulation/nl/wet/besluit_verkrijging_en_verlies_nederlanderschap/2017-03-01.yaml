      1 Onze Minister van Buitenlandse Zaken neemt naturalisatieverzoeken in ontvangst op de diplomatieke of consulaire
      post in het ressort waar de verzoeker om naturalisatie zijn hoofdverblijf heeft.

      2 Hij neemt eveneens de naturalisatieverzoeken in behandeling van personen die verblijf hebben in het buitenland en
      nergens ter wereld hun hoofdverblijf hebben.

      3 De in het eerste en tweede lid bedoelde personen ontvangen een afschrift van hun naturalisatieverzoek.

      4 Naturalisatieverzoeken van andere personen dan die genoemd in het eerste en tweede lid worden door hem niet in
      behandeling genomen.

      5 Naturalisatieverzoeken worden bij ontvangst voorzien van een datum en een dienststempel.
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel51
  - number: '52'
    text: |-
      1 De verzoeker legt bij zijn verzoek het in [artikel 5, eerste lid, van het Besluit naturalisatietoets][ref1],
      bedoelde inburgeringsdiploma of certificaat over, tenzij [artikel 3][ref2] of
      [4 van het Besluit naturalisatietoets][ref3] van toepassing is.

      2 Alvorens het verzoek in behandeling genomen wordt, onderzoekt de Minister van Buitenlandse Zaken de
      betalingsverplichting van de verzoeker overeenkomstig het [Besluit optie- en naturalisatiegelden 2002][ref4].
      Tenzij de verzoeker voor vrijstelling of gehele ontheffing in aanmerking komt, betaalt hij bij de indiening van
      zijn verzoek het volgens het [Besluit optie- en naturalisatiegelden 2002][ref5] verschuldigde naturalisatiegeld.


