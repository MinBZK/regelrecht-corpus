  - number: '3'
    text: |-
      1 Optieverklaringen, naturalisatieverzoeken en verklaringen van afstand van het Nederlanderschap worden in persoon
      afgelegd of ingediend.

      2 Indien om zwaarwegende redenen van de optant of de verzoeker, dan wel van de persoon die afstand van het
      Nederlanderschap wil doen, niet kan worden verlangd dat hij de verklaring of het verzoek in persoon aflegt of
      indient, kan hij deze of dit laten afleggen of indienen door een daartoe schriftelijk gemachtigde meerderjarige
      persoon, mits voldoende zekerheid kan worden verkregen over de identiteit van de optant of de verzoeker dan wel
      de persoon die afstand doet, en van de gemachtigde. Onder zwaarwegende redenen worden in ieder geval gerekend de
      fysieke of psychische onmogelijkheid in persoon te verschijnen voor het afleggen van de verklaring of het indienen
      van het verzoek.

      3 De verklaring of het verzoek wordt op schrift gesteld en door de betrokkene of, in voorkomend geval, door zijn
      wettelijke vertegenwoordiger of gemachtigde ondertekend.
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel3
  - number: '4'
    text: |-
      1 Het bedrag van de voor de behandeling van de optie of naturalisatie verschuldigde leges wordt bepaald
      overeenkomstig het [Besluit optie- en naturalisatiegelden 2002][ref1].

      2 Indien de optieverklaring of het naturalisatieverzoek wegens niet- of niet tijdige betaling van het verschuldigde
      bedrag buiten behandeling wordt gesteld, wordt daarvan aan de betrokkene schriftelijk kennis gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013782
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013782
  - number: '5'
    text: |-
      De in [artikel 2][ref1] genoemde autoriteiten verstrekken op de bij ministeriële regeling te bepalen wijze en
      tijdstippen inlichtingen omtrent de behandeling van de optieverklaringen die voor hen zijn afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0013605#Artikel2
    url: https://wetten.overheid.nl/BWBR0013605/2017-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013605
        artikel: '2'
        hoofdstuk: I
  - number: '6'
    text: |-
      1 Bij het afleggen van een optieverklaring verstrekt de optant betreffende zichzelf, voorzoveel mogelijk, gegevens
      met betrekking tot:

      a. geslachtsnaam en voornaam of voornamen, onderscheidenlijk naam of namen;

      b. geboortedatum, geboorteplaats en geboorteland;

      c. adres, postcode en woonplaats;

      d. geslacht;

      e. nationaliteit of nationaliteiten;

      f. tegenwoordige en, voor zoveel nodig, eerdere verblijfsrechtelijke status;

      g. duur van huidige toegelaten verblijf in het Koninkrijk en, indien van toepassing, duur van eerder toegelaten
      verblijf in het Koninkrijk;

      h. indien van toepassing, bestaan en duur van het huwelijk of geregistreerd partnerschap, dan wel de ontbinding
      daarvan, alsmede ten aanzien van de echtgenoot of partner de gegevens hierboven bedoeld onder a tot en met e;

      i. indien van toepassing, betreffende de minderjarige kinderen van de optant, de gegevens hierboven bedoeld onder a
      tot en met e, en onder g;

      j. indien van toepassing, betreffende de ouders of grootouders van de optant, de gegevens bedoeld in de onderdelen
      a tot en met g. Voor de toepassing van [artikel 6, eerste lid, onder i tot en met o, van de Rijkswet][ref1] kunnen
      onder de gegevens bedoeld in onderdeel e mede worden begrepen de historische gegevens betreffende de nationaliteit
      van de ouders of grootouders van de optant;

      k. indien het een minderjarige betreft over wie gezag wordt uitgeoefend, de gegevens bedoeld in de onderdelen a tot
      en met e van degene of degenen die dit gezag uitoefenen;

      l. de overige gegevens die naar het oordeel van de tot het in ontvangst nemen van de verklaring bevoegde autoriteit
      nodig zijn voor de beoordeling van het geval.

      2 In de optieverklaring vermeldt de optant de minderjarige kinderen en kindskinderen die hij in zijn optie wenst te
      betrekken. Hij verstrekt over hen, voorzoveel mogelijk, de gegevens bedoeld in het eerste lid.

      3 Betrekt de optant in zijn optieverklaring mede een kind dat de leeftijd van zestien jaar heeft bereikt, dan is
      vereist dat het kind op de wijze bepaald in [artikel 3][ref2] verklaart in te stemmen met de optie.

      4 De optant legt een schriftelijke en ondertekende verklaring over dat de gevraagde gegevens naar waarheid zijn
      verstrekt en dat geen relevante gegevens zijn verzwegen. Behoudens in de gevallen waarin toelating niet is vereist,
      verklaart hij op dezelfde wijze dat in het kader van de verkrijging en het behoud van de verblijfsvergunning van
      hemzelf en de overige in de optieverklaring genoemde personen de gevraagde gegevens naar waarheid zijn verstrekt en
      dat geen relevante gegevens zijn verzwegen.

      5 De autoriteit die de optieverklaring in ontvangst neemt, kan verlangen dat de optant de juistheid van de
      verstrekte gegevens bewijst door middel van zo nodig gelegaliseerde en eventueel inhoudelijk geverifieerde
      documenten. Hij kan tevens verlangen dat die aanvullende gegevens worden verstrekt indien dit naar zijn oordeel
      nodig is voor de beoordeling van het geval.

      6 Heeft de optant een of meer nationaliteiten waarvan hij verplicht is afstand te doen, dan legt hij een verklaring
      over houdende dat hij bereid is het mogelijke te zullen doen om bij of na de verkrijging van het Nederlanderschap
      zijn andere nationaliteit of nationaliteiten te verliezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013605#Artikel3
