preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Defensie;

    Gelet op artikel 59, tweede lid onder d en e, van het Luchtverkeersreglement,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007094/2014-12-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      *kabelvlieger:* een toestel, zwaarder dan lucht en niet voorzien van een voortstuwingsinrichting, dat door middel
      van (een) ankerkabel(s) of lijn(en) is verbonden met het aardoppervlak;

      *kleine ballon:* een kleine kabelballon of een kleine vrije ballon;

      *kleine kabelballon:* een ballon, die door middel van (een) ankerkabel(s) of lijn(en) is verbonden met het
      aardoppervlak en die op zeeniveau in de internationale standaardatmosfeer in geheel gevulde toestand een diameter
      van ten hoogste 2 m of een inhoud van ten hoogste 4 m³ heeft, dan wel een samenstel van ballons waarvan de
      gezamenlijke diameter of inhoud deze waarde niet te boven gaan;

      *kleine vrije ballon:* een ballon die niet is verbonden met het aardoppervlak en die op zeeniveau in de
      internationale standaard-atmosfeer in geheel gevulde toestand een diameter van ten hoogste 2 m of een inhoud van
      ten hoogste 4 m³ heeft, dan wel een samenstel van ballons waarvan de gezamenlijke diameter of inhoud deze waarden
      niet te boven gaan;

      *sfeerballon:* kleine vrije ballon, of samenstel van kleine vrije ballons, waarvan de hoogte of de breedte niet
      meer dan 75 cm bedraagt.
    url: https://wetten.overheid.nl/BWBR0007094/2014-12-12#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 4 van het Besluit luchtverkeer 2014][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035899#Artikel4
    url: https://wetten.overheid.nl/BWBR0007094/2014-12-12#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0035899
        artikel: '4'
  - number: 1b
    text: |-
      1 De kabelvlieger, kleine kabelballon en onbemande vrije ballon verlenen voorrang aan vliegtuigen, helikopters,
      zweeftoestellen, vrije ballonen en luchtschepen.

      2 In alle overige gevallen dat twee luchtvaartuigen kruisen op of omstreeks hetzelfde niveau, verleent het
      luchtvaartuig dat het andere aan zijn rechterzijde heeft voorrang.
    url: https://wetten.overheid.nl/BWBR0007094/2014-12-12#Artikel1b
  - number: '2'
    text: |-
      Een kabelvlieger of kleine kabelballon wordt niet gebruikt:

      a. boven een hoogte van 100 meter boven grond of water;

      b. binnen een afstand van 3 km van de grens van luchthavens en zweefvliegterreinen;

      c. binnen een afstand van 5 km van de grens van gecontroleerde luchthavens;

      d. binnen burger laagvlieggebieden, militaire laagvlieggebieden en binnen een afstand van 5 km van militaire
      laagvliegroutes.
    url: https://wetten.overheid.nl/BWBR0007094/2014-12-12#Artikel2
  - number: '3'
    text: |-
      1 Voorwerpen die door kleine ballons worden meegevoerd worden voorzien van een valscherm dat de daalsnelheid
      beperkt tot ten hoogste 5 m/sec, indien deze voorwerpen ieder afzonderlijk of gezamenlijk:

      a. een massa van 30 gram of meer hebben, of

      b. een oppervlaktedichtheid van 5 gr/cm2 of meer hebben.

      2 Voor het oplaten van een kleine vrije ballon binnen een afstand van 8 km van de grens van een gecontroleerde
      luchthaven is de toestemming vereist van de betrokken plaatselijke luchtverkeersleidingsdienst; deze toestemming
      kan worden geweigerd als de vaart van de ballon – gezien de heersende windrichting – zal voeren over het
      landingsterrein of over gebieden in de omgeving daarvan, waarover luchtvaartuigen naderen of vertrekken en waardoor
      de orde en regelmaat van het luchtverkeer wordt verstoord.

      3 Het voornemen tot het oplaten van een kleine vrije ballon binnen een afstand van 3 km van de grens van de niet-
      gecontroleerde burgerluchthavens wordt tijdig, doch uiterlijk twee uur vóór de voorgenomen oplating ter kennis
      gebracht aan de betrokken havenmeester. Indien de vaart van de ballon – gezien de heersende windrichting – zal
      voeren over het landingsterrein of onmiddellijke omgeving daarvan kan de havenmeester aanwijzingen geven om te
      voorkomen dat het luchthavenverkeer wordt verstoord of in gevaar gebracht.

      4 Degene die een kleine vrije ballon wil oplaten binnen een afstand van 3 km van een zweefvliegterrein stelt al het
      mogelijke in het werk om vooraf overleg met de gebruiker van dat zweefvliegterrein te voeren.
    url: https://wetten.overheid.nl/BWBR0007094/2014-12-12#Artikel3
  - number: '4'
    text: |-
      1 Indien 1000 sfeerballons, of meer, nagenoeg gelijktijdig worden opgelaten is daarop
      [artikel 3, tweede, derde en vierde lid][ref1] van toepassing.

      2 Voorwerpen die door sfeerballons worden meegevoerd worden voorzien van een valscherm dat de daalsnelheid beperkt
      tot maximaal 5 m/sec indien deze voorwerpen ieder afzonderlijk of gezamenlijk:

      a. een massa van 30 gram of meer hebben, of

      b. een oppervlakte-dichtheid van 5 gr/cm2 of meer hebben.

      3 Sfeerballons bevatten geen metalen voorwerpen of onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007094#Artikel3
    url: https://wetten.overheid.nl/BWBR0007094/2014-12-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007094
        artikel: '3'
