preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de afdelingen 3.4 en 3.5 van de Algemene wet
    bestuursrecht samen te voegen tot één uniforme openbare voorbereidingsprocedure, waarbij de bezwaarschriftprocedure
    uit die wet buiten toepassing blijft, en in verband daarmee de inspraakbepalingen in de Provinciewet en de
    Gemeentewet te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013374/2006-07-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      1 Het recht zoals het gold vóór het tijdstip van inwerkingtreding van deze wet blijft van toepassing ten aanzien
      van:

      a. besluiten die zijn aangevraagd vóór dat tijdstip;

      b. ambtshalve te nemen besluiten waarvan het ontwerp ingevolge wettelijk voorschrift vóór dat tijdstip ter inzage
      is gelegd;

      c. overige ambtshalve te nemen besluiten die binnen dertien weken na dat tijdstip zijn bekendgemaakt;

      d. besluiten omtrent goedkeuring van een besluit als bedoeld onder a, b of c;

      e. besluiten op grond van de Herinrichtingswet Oost-Groningen en Gronings-Drentse Veenkoloniën en de
      Reconstructiewet Midden-Delfland.

      2 [Afdeling 7.1 van de Algemene wet bestuursrecht][ref1] vindt geen toepassing ten aanzien van geschillen die
      betrekking hebben op besluiten die zijn voorbereid met toepassing van [afdeling 3.5 van die wet][ref2], zoals die
      afdeling luidde vóór het tijdstip van inwerkingtreding van deze wet, en zijn bekendgemaakt op of na het tijdstip
      van inwerkingtreding van deze wet.

      3 [Afdeling 7.1 van de Algemene wet bestuursrecht][ref3], zoals die afdeling luidde vóór het tijdstip van
      inwerkingtreding van deze wet, blijft van toepassing ten aanzien van geschillen die betrekking hebben op besluiten
      die zijn voorbereid met toepassing van [afdeling 3.4 van die wet][ref4], zoals die afdeling luidde vóór het
      tijdstip van inwerkingtreding van deze wet, en zijn bekendgemaakt op of na het tijdstip van inwerkingtreding van
      deze wet.

      4 [Afdeling 7.1 van de Algemene wet bestuursrecht][ref5] blijft eveneens van toepassing ten aanzien van geschillen
      die betrekking hebben op andere dan de in het tweede of derde lid bedoelde besluiten waarop na de inwerkingtreding
      van deze wet [afdeling 3.4 van de Algemene wet bestuursrecht][ref6] van toepassing is, indien deze besluiten zijn
      bekendgemaakt vóór het tijdstip van inwerkingtreding van deze wet.


