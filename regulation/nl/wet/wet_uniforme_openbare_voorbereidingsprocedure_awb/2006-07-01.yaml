  - number: V
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, met uitzondering van de
      [artikelen II][ref1] en [III][ref2], die in werking treden met ingang van een jaar na het in dit koninklijk besluit
      bepaalde tijdstip.


