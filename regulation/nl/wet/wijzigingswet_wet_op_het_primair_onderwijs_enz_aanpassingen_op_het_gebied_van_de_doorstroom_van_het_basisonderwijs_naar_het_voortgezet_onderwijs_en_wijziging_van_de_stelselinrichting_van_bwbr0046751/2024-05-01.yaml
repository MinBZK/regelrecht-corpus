preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om in de doorstroom van het basisonderwijs naar het
    voortgezet onderwijs regels te stellen over het schooladvies, de doorstroomtoets, het definitieve schooladvies
    en de aanmelding voor het voortgezet onderwijs, alsmede een gelijk speelveld te creëren door nieuwe regels te
    stellen over de stelselinrichting voor aanbieders van doorstroomtoetsen en toetsen verbonden aan leerling- en
    onderwijsvolgsystemen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0046751/2024-05-01#ArtikelAanhef
articles:
  - number: XIII
    text: |-
      1 [Artikel 2, zesde lid, van de Wet college voor toetsen en examens][ref1] en
      __REF001___________________________________________________________________________________________________________
      ______, zoals deze artikelen luidden op de dag voor inwerkingtreding van [artikelen VIII][ref3] en [IX][ref4]
      van deze wet, blijven voor zover het betreft het aanbieden van de centrale eindtoets, bedoeld in de
      [artikelen 9b van de Wet op het primair onderwijs][ref5] en [18b van de Wet op de expertisecentra][ref6], van
      toepassing in het schooljaar waarin de artikelen VIII en IX van deze wet in werking zijn getreden.

      2 Andere eindtoetsen die op grond van [artikel 9b, zevende lid, van de Wet op het primair onderwijs][ref7]
      en [artikel 18b, achtste lid, van de Wet op de expertisecentra][ref8], zoals deze artikelen
      luidden op de dag voor inwerkingtreding van de [artikelen I][ref9] en [III][ref10] van deze
      wet, door Onze Minister zijn toegelaten en waarvan de periode van toelating loopt tot na de
      inwerkingtreding van de artikelen I en III van deze wet, worden geacht erkend te zijn op grond van
      [artikel 3a, eerste lid, onderdeel a, van de Wet College voor toetsen en examens][ref11].

      3 Toetsen die voldoen aan het kwaliteitsoordeel van een door Onze Minister aangewezen onafhankelijke
      commissie, bedoeld in [artikel 8, zevende lid, van de Wet op het primair onderwijs][ref12] en
      [artikel 11, achtste lid, van de Wet op de expertisecentra][ref13], zoals deze artikelen luidden
      op de dag voor inwerkingtreding van de [artikelen I][ref14] en [III][ref15] van deze wet,
      worden tot tien jaar na afgifte van het kwaliteitsoordeel geacht erkend te zijn op grond van
      [artikel 3a, eerste lid, onderdeel c, van de Wet College voor toetsen en examens][ref16].


