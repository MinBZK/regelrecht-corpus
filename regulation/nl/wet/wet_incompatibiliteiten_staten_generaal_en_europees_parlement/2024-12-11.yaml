preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gelet op artikel 57, vierde lid, van de Grondwet (Stb. 1987, 458)
    wenselijk is te bepalen welke andere openbare betrekkingen dan de in de Grondwet vermelde niet gelijktijdig met
    het lidmaatschap van de Staten-Generaal kunnen worden uitgeoefend, alsmede ter uitvoering van artikel 6, tweede
    lid, van de Akte betreffende de rechtstreekse verkiezing van de leden van het Europees Parlement (Trb. 1976, 175)
    nadere bepalingen op te nemen over het verenigen van openbare betrekkingen met het lidmaatschap van het Europees
    Parlement en voorts rechtspositionele voorzieningen te treffen voor gevallen waarin bepaalde openbare betrekkingen
    niet gelijktijdig met het lidmaatschap van de Staten-Generaal of met dat van het Europees Parlement kunnen worden
    uitgeoefend;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#ArtikelAanhef
