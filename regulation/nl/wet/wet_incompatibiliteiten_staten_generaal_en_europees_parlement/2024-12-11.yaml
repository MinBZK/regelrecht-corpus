  - number: '2.4'
    text: |-
      Een lid van het Europees Parlement kan niet tevens zijn dienstplichtige in werkelijke dienst of tewerkgestelde
      erkend gewetensbezwaarde.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel2
  - number: '3.1'
    text: |-
      De militair behorende tot het beroepspersoneel van de krijgsmacht die tot het lidmaatschap van de Eerste Kamer der
      Staten-Generaal is toegelaten, is van rechtswege op non-activiteit gesteld.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel3
  - number: '3.2'
    text: |-
      Degene die een in [artikel 1, tweede en derde lid][ref1], of [artikel 2, tweede en derde lid][ref2], bedoeld ambt
      bekleedt en tot het lidmaatschap van de Eerste Kamer der Staten-Generaal is toegelaten, is van rechtswege op non-
      activiteit gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006612#Artikel2
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006612
        artikel: '2'
  - number: '3.3'
    text: |-
      Degene die op non-activiteit is gesteld, is van het ogenblik af dat hij is toegelaten, ontheven van de waarneming
      van het ambt, zulks, voor zover de ambtsbetrekking niet eerder eindigt, tot op het ogenblik, waarop hij, nadat hij
      heeft opgehouden lid te zijn, in actieve dienst wordt hersteld.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel3
  - number: '3.4'
    text: Gedurende de non-activiteit wordt het loon of de bezoldiging met inbegrip van toelagen ingehouden.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel3
  - number: '3.5'
    text: |-
      De militair behorende tot het reserve-personeel van de krijgsmacht, de dienstplichtige militair en de
      tewerkgestelde erkend gewetensbezwaarde is van het ogenblik dat hij tot het lidmaatschap van de Eerste Kamer der
      Staten-Generaal is toegelaten en voorzolang hij dat lidmaatschap uitoefent, van rechtswege met groot verlof.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel3
  - number: '3.6'
    text: |-
      Degene die een in [artikel 1, derde lid][ref1], bedoeld ambt bekleedt en die tot het lidmaatschap van de Tweede
      Kamer der Staten-Generaal of het Europees Parlement is toegelaten, wordt in verband daarmee eervol ontslag verleend
      met ingang van de dag van zijn toelating, dan wel op zijn verzoek met ingang van die dag tijdelijk ontheven van de
      waarneming van zijn ambt.


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel1
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '1'
  - number: '3.7'
    text: |-
      De arbeidsovereenkomst van degene die een in [artikel 1, tweede lid][ref1], bedoeld ambt bekleedt en die tot het
      lidmaatschap van de Tweede Kamer der Staten-Generaal of het Europees Parlement is toegelaten, eindigt in verband
      daarmee van rechtswege met ingang van de dag van die toelating, tenzij betrokkene voor die dag verzoekt om met
      ingang van die dag tijdelijk te worden ontheven van de waarneming van zijn ambt.


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel1
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '1'
  - number: '4.1'
    text: |-
      Tijdens de non-activiteit wordt, onverminderd het bepaalde in de volgende artikelen, door de betrokkene een
      non-activiteitswedde genoten ten bedrage van de helft der laatstelijk door hem in zijn ambt genoten loon of
      bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel4
  - number: '4.2'
    text: |-
      Onder laatstelijk in zijn ambt genoten loon wordt verstaan het loon als bedoeld in
      [artikel 6, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1] en, in afwijking van
      onderdeel a van dat lid, de vakantiebijslag als bedoeld in [artikel 15, eerste lid, van die wet][ref2].
      Onder laatstelijk in zijn ambt genoten bezoldiging wordt verstaan de bezoldiging,
      bedoeld in [artikel 44a, eerste lid, van de Politiewet][ref3], de bezoldiging, bedoeld in
      [artikel 10, eerste lid, van de Wet ambtenaren defensie][ref4], of de bezoldiging, bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Wet rechtspositie rechterlijke ambtenaren][ref5], vermeerderd met de
      vakantie-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel44a
      [ref4]: https://wetten.overheid.nl/BWBR0001952#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel1
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: 44a
      - id: ref4
        bwb_id: BWBR0001952
        artikel: '10'
      - id: ref5
        bwb_id: BWBR0008365
        artikel: '1'
  - number: '4.3'
    text: |-
      Indien in het laatstgenoten loon of de laatstelijk genoten bezoldiging, als omschreven in het tweede lid, uit
      anderen hoofde dan wegens het toekennen van een periodieke verhoging van het salaris, wijziging zou zijn gekomen,
      wanneer de betrokkene op dat loon of die bezoldiging in actieve dienst zou zijn gebleven, geldt vanaf de datum,
      waarop die wijziging in werking zou zijn getreden, het aldus gewijzigde bedrag als laatstelijk in zijn ambt genoten
      loon of bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel4
  - number: '4.4'
    text: |-
      Onze betrokken Minister kan, in overeenstemming met Onze betrokken Minister van Binnenlandse Zaken en
      Koninkrijksrelaties, voor betrekkingen die geleidelijk worden opgegeven, ten aanzien van het bedrag dat door
      toepassing van deze wet wordt aangenomen als het laatstelijk in het ambt genoten loon of als de laatstelijk in
      het ambt genoten bezoldiging, het tweede lid van dit artikel buiten toepassing laten of daarvan afwijken, voor
      zover toepassing gelet op het belang van de regeling tot betaling van de non-activiteitswedde, zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel4
  - number: '4.5'
    text: |-
      Over de betaling van de non-activiteitswedde en met betrekking tot de berekening van het in het tweede lid vermelde
      loon of de in het tweede lid vermelde bezoldiging worden bij algemene maatregel van bestuur regels gesteld.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel4
  - number: '5.1'
    text: |-
      De inkomsten die betrokkene geniet of gaat genieten uit of in verband met arbeid of bedrijf, ter hand genomen nadat
      hij op non-activiteit is gesteld, worden met de non-activiteitswedde als volgt verrekend: de non-activiteitswedde
      wordt verminderd met het bedrag waarmee de non-activiteitswedde, vermeerderd met die inkomsten, het laatstelijk in
      zijn ambt genoten loon of de laatstelijk in zijn ambt genoten bezoldiging overschrijdt.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel5
  - number: '5.2'
    text: In verband met de uitvoering van het eerste lid worden bij algemene maatregel van bestuur regels gesteld.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel5
  - number: '6'
    text: |-
      Indien de op non-activiteit gestelde uit het ambt een ontslag, dat aanspraak geeft op wachtgeld, wordt verleend,
      worden voor de toepassing van de desbetreffende bepalingen inkomsten als bedoeld in [artikel 5][ref1] beschouwd als
      inkomsten, genoten uit of in verband met arbeid of bedrijf na het ontslag ter hand genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel5
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '5'
  - number: '7.1'
    text: |-
      Bij het einde van het lidmaatschap wordt degene die op non-activiteit was gesteld, voor zoveel zulks naar het
      oordeel van de overheidswerkgever of het bevoegd gezag mogelijk is, in actieve dienst hersteld.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel7
  - number: '7.2'
    text: |-
      Is herstel in actieve dienst niet mogelijk, dan wordt aan de ambtenaar, bedoeld in [artikel 2, derde lid][ref1],
      eervol ontslag verleend. Als gevolg van het eervol ontslag, is geen sprake van verwijtbare werkloosheid in de zin
      van [artikel 24 van de Werkloosheidswet][ref2]. Inkomsten, als bedoeld in [artikel 6][ref3], worden beschouwd als
      inkomsten genoten uit of in verband met arbeid of bedrijf na het ontslag ter hand genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0006612#Artikel6
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0006612
        artikel: '6'
  - number: '9.1'
    text: |-
      Degenen die ingevolge de wet van 17 juli 1923 (*Stb.* 364), additioneel artikel XVII van de [Grondwet][ref1] of
      artikel 3 van de Wet Incompatibiliteiten Europees Parlement (*Stb.* 1978, 653) op non-activiteit zijn gesteld,
      blijven gedurende hun lidmaatschap van de kamer der Staten-Generaal waarin zij zijn gekozen, onderscheidenlijk van
      het Europees Parlement, op non-activiteit, doch uiterlijk tot het einde van de zittingsduur van de kamer waarin zij
      zijn gekozen, onderscheidenlijk van het Europees Parlement.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '9.2'
    text: |-
      Zij behouden gedurende die periode de aanspraken, omschreven in de artikelen 4 en 6 van de wet van 17 juli
      1923. Gedurende die periode blijft artikel 5 van de wet van 17 juli 1923 voor de leden van de Tweede Kamer,
      onderscheidenlijk van het Europees Parlement van toepassing.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel9
  - number: '9.3'
    text: |-
      Degenen die uiterlijk op het in het eerste lid bedoelde tijdstip hun lidmaatschap beëindigen behouden de
      aanspraken, omschreven in artikel 7 van de wet van 17 juli 1923.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel9
  - number: '9.4'
    text: |-
      Degenen die bij inwerkingtreding van deze wet reeds aanspraken hebben als omschreven in artikel 7 van de wet van 17
      juli 1923 behouden die aanspraken.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel9
  - number: '10'
    text: De wet van 17 juli 1923 en het koninklijk besluit van 1 mei 1925 (*Stb.* 175), worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel10
  - number: '11'
    text: De Wet Incompatibiliteiten Europees Parlement (*Stb.* 1978, 653) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel11
  - number: '12.1'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel12
  - number: '12.2'
    text: 'Deze wet kan worden aangehaald als: Wet Incompatibiliteiten Staten-Generaal en Europees Parlement.'
    url: https://wetten.overheid.nl/BWBR0006612/2024-12-11#Artikel12
