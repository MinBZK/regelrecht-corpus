preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in de Algemene Wet Bijzondere Ziektekosten, de
    Zorgverzekeringswet en de Invoerings- en aanpassingwet beperkte wijzigingen met betrekking tot de verantwoording en
    de financiering van zorgverzekeraars aan te brengen, alsmede dat het wenselijk is in diverse wetten wetstechnische
    reparaties aan te brengen en een tweetal uitgewerkte wetten in te trekken;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034659/2016-08-01#ArtikelAanhef
articles:
  - number: IIIa.1
    text: |-
      In aanvulling op [artikel 39 van de Zorgverzekeringswet][ref1] kunnen tevens ten gunste of ten laste van het
      Zorgverzekeringsfonds worden gebracht door het Zorginstituut vast te stellen, met zorgverzekeraars als bedoeld in
      de [Zorgverzekeringswet][ref2] te verrekenen bedragen met betrekking tot in een kalenderjaar aangevangen, bij of
      krachtens [artikel 11 van de Zorgverzekeringswet][ref3] bedoelde zorg van bij ministeriële regeling aan te wijzen
      categorieën zorgaanbieders, die in de twee daaropvolgende kalenderjaren bij de zorgverzekeraars in rekening is
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0018450
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0034659/2016-08-01#ArtikelIIIa
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0018450
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '11'
  - number: IIIa.2
    text: |-
      Het eerste lid geldt slechts voor zorg die is aangevangen in het kalenderjaar onmiddellijk voorafgaande aan het
      jaar waarin voor de aangewezen categorie zorgaanbieders een nieuw bekostigingssysteem is gaan gelden.
    url: https://wetten.overheid.nl/BWBR0034659/2016-08-01#ArtikelIIIa
  - number: IIIa.3
    text: |-
      Bij ministeriële regeling wordt bepaald welke zorg het Zorginstituut bij toepassing van het eerste lid in
      aanmerking neemt, hoe het Zorginstituut de bedragen, bedoeld in dat lid, berekent en wanneer de in dat lid bedoelde
      verrekening dient te hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0034659/2016-08-01#ArtikelIIIa
  - number: Xb
    text: |-
      Een algemene maatregel van bestuur die berust op
      [artikel 18.1 van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1]
      berust na inwerkingtreding van deze wet op
      [artikel 18.4.7a van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2].


