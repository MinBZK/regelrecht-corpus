articles:
   - number: '1'
     text: |-
       1 Onverminderd het bepaalde in het tweede en derde lid, wordt van het verbod, gesteld in artikel 3, eerste lid
       van de Regeling keuringsdienst 1984 (Stcrt. 125) vrijstelling verleend ter zake van het slachten of doen slachten
       van een slachtdier voor huishoudelijk gebruik van de bewoners van het pand, waar het slachtdier wordt geslacht
       gedurende de maanden oktober, november, december, januari, februari en maart van elk jaar.

       2 De vrijstelling als bedoeld in het eerste lid geldt in:

       a. kring 2: alle gemeenten met uitzondering van de gemeenten: Adorp, Appingedam, Assen, Baflo, Bedum, Bierum,
          Ten Boer, Delfzijl, Diever, Dwingeloo, Eelde, Eenrum, Ezinge, Groningen, Haren, Hefshuizen, Hoogezand-Sappemeer,
          Kantens, Kloosterburen, Leens, Loppersum, Meppel, Middelstum, Muntendam, Nieuweschans, Nieuwwolda, Norg, Nijeveen,
          Peize, Smilde, Stedum, Termunten, Ulrum, Usquert, Vledder, Warffum, Winschoten, Winsum, 't Zandt.

       b. kring 3: alle gemeenten met uitzondering van: Goor, Rijssen en Wierden;

       c. kring 4: Avereest, Bathmen, Brederwiede, Dalfsen, Diepenveen, Genemuiden, Gramsbergen, Hardenberg, Hasselt,
          Heino, Hellendoorn, Kampen, Nieuwleusen, Ommen, Staphorst, Steenwijk, IJsselham, IJsselmuiden, Zwartsluis, Zwolle;

       d. kring 5: alle gemeenten met uitzondering van Hattem;

       e. kring 6: alle gemeenten met uitzondering van: Arnhem;

       f. kring 7: alle gemeenten met uitzondering van: Winterswijk, Groenlo, Zutphen;

       g. kring 8: alle gemeenten met uitzondering van: Bussum, Hilversum, Utrecht;

       h. kring 11: alle gemeenten van de provincie Zeeland met uitzondering van Tholen en in de volgende gemeenten in
          Zuid-Holland: Hardinxveld-Giessendam, Zederik, Giessenlanden, Graafstroom, Leerdam, Sliedrecht, Vianen, Lekkerkerk,
          Liesveld, Ammerstol, Bergambacht, Berkenwouden, Krimpen aan de Lek, Krimpen aan de IJssel, Ouderkerk aan de IJssel,
          Schoonhoven, Stolwijk, Vlist;

       i. kring 12: in alle gemeenten;

       j. kring 13: in alle gemeenten;

       k. kring 14: alle gemeenten met uitzondering van: Beers, Grave, Haps, Sint Anthonis en Ledeacker, Budel, Geldrop,
          Hapert en Casteren, Maarheeze, Gerwen en Nederwetten, Wintelre en Knegsel;

       l. kring 15: in alle gemeenten.

       3 De kringdirecteur kan de hoeveelheid en de soort dieren bepalen die op een adres mogen wordt geslacht voor het
          huishoudelijk gebruik gedurende de periode genoemd in het eerste lid.
