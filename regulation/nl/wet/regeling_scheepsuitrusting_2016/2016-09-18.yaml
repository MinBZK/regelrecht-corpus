preamble:
  text: |-
    Gelet op richtlijn 2014/90/EU van het Europees Parlement en de Raad van de Europese Unie van 23 juli 2014 inzake
    uitrusting van zeeschepen en tot intrekking van richtlijn 96/98/EG van de Raad (PbEU L 257), en op de artikelen 5,
    vijfde lid, 6, vijfde en zesde lid, 8, tweede lid, 9, vijfde lid, 10, tweede lid, 11, derde lid, 13, derde lid, 14,
    tweede lid, 16 en 21, eerste lid, van de Wet scheepsuitrusting 2016 en artikel 48, eerste lid, Schepenbesluit 2004

    Besluit:
  url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *accreditatie:* accreditatie als bedoeld in artikel 2, tiende lid, van de verordening;
        - *Besluit 768/2008:* Besluit nr. 768/2008/EG van het Europees Parlement en de Raad van 9 juli 2008 betreffende een
      gemeenschappelijk kader voor het verhandelen van producten en tot intrekking van Besluit 93/465/EEG van de Raad;
        - *minister:* minister van Infrastructuur en Milieu;
        - *nationale accreditatie-instantie:* nationale accreditatie-instantie als bedoeld in artikel 2, elfde lid, van
      de verordening;
        - *wet:* [Wet scheepsuitrusting 2016](onbekend).
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel1
  - number: '2'
    text: |-
      1 De fabrikant brengt de stuurwielmarkering zichtbaar, leesbaar en onuitwisbaar aan op het product of op het
      gegevensplaatje op het product. Indien het product gebruik maakt van software, integreert de fabrikant de
      stuurwielmarkering tevens in de software van het product.

      2 Wanneer het gelet op de aard van het product niet mogelijk of niet gerechtvaardigd is om de stuurwielmarkering op
      het product of op het gegevensplaatje aan te brengen, wordt de stuurwielmarkering aangebracht op de verpakking van
      het product en in de begeleidende documenten.

      3 De stuurwielmarkering wordt aan het einde van het productieproces aangebracht.

      4 De stuurwielmarkering wordt gevolgd door:

      a. het identificatienummer van de aangemelde instantie, indien een aangemelde instantie betrokken is bij de
      productiecontrolefase, en

      b. het jaar dat de stuurwielmarkering is aangebracht.

      5 Het identificatienummer, bedoeld in het vierde lid, onderdeel a, wordt aangebracht door de aangemelde instantie
      zelf, dan wel overeenkomstig haar instructies door de fabrikant of diens vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel2
  - number: '3'
    text: |-
      1 De stuurwielmarkering kan drie jaar na de datum van vaststelling van passende technische criteria voor de
      betreffende scheepsuitrusting worden aangevuld met een passend en betrouwbaar elektronisch label.

      2 De stuurwielmarkering kan vijf jaar na de datum van vaststelling van passende technische criteria voor de
      betreffende scheepsuitrusting worden vervangen door een passend en betrouwbaar elektronisch label.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel3
  - number: '4'
    text: |-
      1 De fabrikant stelt de vereiste technische documentatie, bedoeld in bijlage II bij de richtlijn, op alvorens een
      conformiteitsbeoordeling te laten uitvoeren.

      2 De fabrikant bewaart de technische documentatie, bedoeld in het eerste lid, en de EU-conformiteitsverklaring
      gedurende ten minste tien jaar nadat de stuurwielmarkering is aangebracht, en in geen geval voor een periode korter
      dan de verwachte levensduur van de desbetreffende scheepsuitrusting.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel4
  - number: '5'
    text: |-
      1 De fabrikant zorgt ervoor dat op zijn producten een type-, partij- of serienummer, dan wel een ander
      identificatiemiddel is aangebracht en hij vermeldt zijn naam, zijn geregistreerde handelsnaam of geregistreerde
      handelsmerk en het contactadres op de producten.

      2 Wanneer het gelet op de omvang of aard van het product niet mogelijk is om de in het eerste lid genoemde
      informatie op het product aan te brengen, wordt de informatie vermeld op de verpakking of in de begeleidende
      documenten, dan wel, indien mogelijk, op beide wijzen.

      3 De fabrikant zorgt ervoor dat bij zijn product instructies en alle benodigde informatie voor het veilig aan boord
      installeren en het veilige gebruik van het product worden geleverd, alsmede alle andere documentatie die op grond
      van de internationale instrumenten is vereist. Indien van toepassing bevat de informatie tevens beperkingen ten
      aanzien van het gebruik.

      4 De bijgeleverde instructies, informatie en documentatie, bedoeld in het derde lid, worden zodanig opgesteld dat
      deze voor gebruikers gemakkelijk te begrijpen zijn.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel5
  - number: '6'
    text: |-
      1 De fabrikant zorgt ervoor dat hij beschikt over procedures om de conformiteit van zijn serieproductie voortdurend
      te waarborgen. Er wordt daarbij terdege rekening gehouden met veranderingen in het ontwerp of in de kenmerken van
      scheepsuitrusting en met veranderingen in de vereisten, bedoeld in [artikel 3, eerste lid, van de wet](onbekend),
      op basis waarvan de overeenstemming van scheepsuitrusting wordt bevestigd.

      2 De fabrikant laat een nieuwe conformiteitsbeoordeling uitvoeren, indien de aangemelde instantie ingevolge de
      voorschriften opgenomen in bijlage II bij de richtlijn bij een verandering als bedoeld in het eerste lid van
      oordeel is dat een nieuwe beoordeling nodig is.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel6
  - number: '7'
    text: |-
      1 Indien door een fabrikant die niet op het grondgebied van ten minste één lidstaat van de Europese Unie is
      gevestigd, op grond van artikel 13, eerste lid, van de richtlijn door middel van een schriftelijke overeenkomst een
      vertegenwoordiger voor de Europese Unie wordt aangewezen, wordt in die overeenkomst in ieder geval de naam en het
      contactadres van de vertegenwoordiger vermeldt.

      2 De naleving van de bij of krachtens [artikelen 6](onbekend) en [7 van de wet](onbekend) neergelegde
      verplichtingen en het opstellen van technische documentatie, bedoeld in [artikel 4, eerste lid][ref1], maken geen
      deel uit van de overeenkomst, bedoeld in het eerste lid.

      3 Een vertegenwoordiger voert de taken uit die gespecificeerd zijn in de overeenkomst, bedoeld in het eerste lid.
      Op basis van de overeenkomst is de vertegenwoordiger in staat ten minste de volgende taken te verrichten:

      a. het ter beschikking houden van de technische documentatie en de EU-conformiteitsverklaring voor de
      markttoezichtautoriteit gedurende ten minste tien jaar nadat de stuurwielmarkering is aangebracht, en in geen geval
      voor een periode korter dan de verwachte levensduur van de desbetreffende scheepsuitrusting;

      b. het verstrekken van alle benodigde informatie en documentatie om de conformiteit van het product aan te tonen op
      een met redenen omkleed verzoek van de minister, en

      c. op verzoek van de minister medewerking verlenen aan alle maatregelen om de risico’s van producten die onder de
      overeenkomst, bedoeld in het eerste lid, vallen weg te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0038499#Artikel4
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel7
    references:
      - id: ref1
