  - number: '20'
    text: |-
      1 Met het toezicht, bedoeld in [artikel 16 van de wet](onbekend), zijn belast de door de minister aangewezen
      ambtenaren van de Inspectie Leefomgeving en Transport.

      2 Het toezicht, bedoeld in het eerste lid, omvat mede de activiteiten en maatregelen in het kader van het
      markttoezicht.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel20
