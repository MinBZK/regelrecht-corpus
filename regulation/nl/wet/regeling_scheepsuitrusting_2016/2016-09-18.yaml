        bwb_id: BWBR0038499
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0038499
        artikel: '10'
        paragraaf: '3'
  - number: '13'
    text: |-
      1 Een aangemelde instantie mag activiteiten uitsluitend met instemming van diens klant uitbesteden of door een
      dochteronderneming laten uitvoeren.

      2 Indien een aangemelde instantie specifieke taken in verband met de conformiteitsbeoordeling uitbesteedt of door
      een dochteronderneming laat uitvoeren:

      a. waarborgt zij dat de onderaannemer of dochteronderneming voldoet aan het bepaalde in bijlage III bij de
      richtlijn;

      b. brengt zij de minister op de hoogte van de uitbesteding of uitvoering door de dochteronderneming;

      c. neemt zij de volledige verantwoordelijkheid op zich voor de taken die de onderaannemer of dochteronderneming
      verricht, ongeacht waar deze gevestigd is, en

      d. houdt zij ter beschikking van de minister relevante documenten over de beoordeling van de kwalificaties van
      de onderaannemer of dochteronderneming en over de werkzaamheden die bij of krachtens de [wet](onbekend) worden
      uitgevoerd door de onderaannemer of dochteronderneming.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel13
  - number: '14'
    text: |-
      1 De aangemelde instantie neemt deel aan de werkzaamheden van de sectorale groep van aangemelde instanties van de
      Europese Commissie.

      2 Indien de aangemelde instantie niet rechtstreeks deelneemt aan de werkzaamheden, laat zij zich daarbij
      vertegenwoordigen door een door haar daartoe aangewezen partij.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel14
  - number: '15'
    text: |-
      Wanneer een aangemelde instantie vaststelt dat een fabrikant niet heeft voldaan aan de eisen gesteld bij
      of krachtens de [artikelen 6](onbekend) en [7 van de wet](onbekend), verlangt de aangemelde instantie dat
      die fabrikant passende corrigerende maatregelen neemt. De aangemelde instantie verleent in dat geval geen
      conformiteitscertificaat aan die fabrikant.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel15
  - number: '16'
    text: |-
      1 Een aangemelde instantie stelt de minister onverwijld in kennis van:

      a. wijzigingen van het ter zake van de aangemelde instantie in het handelsregister ingeschrevene, met betrekking
      tot haar naam en adresgegevens;

      b. elke wijziging, schorsing of beëindiging van haar accreditatie, en

      c. klachten die zijn ingediend door belanghebbenden die van de diensten van de aangemelde instantie gebruik maken.

      2 Onverminderd het eerste lid, stelt een aangemelde instantie de minister tevens in kennis van:

      a. overige omstandigheden die van invloed zijn op de werkingssfeer van en de voorwaarden voor haar aanmelding;

      b. elke weigering, beperking, opschorting of intrekking van conformiteitscertificaten, bedoeld in [artikel 17,
      eerste lid, van de wet](onbekend), en

      c. informatieverzoeken over conformiteitsbeoordelingsactiviteiten die zij van markttoezichtautoriteiten ontvangen.

      3 Een aangemelde instantie brengt desgevraagd de minister op de hoogte van de binnen de werkingssfeer van haar
      aanmelding verrichte conformiteitsbeoordelingsactiviteiten en andere activiteiten, waaronder grensoverschrijdende
      activiteiten en uitbesteding.

      4 Een aangemelde instantie verstrekt relevante informatie:

      a. over negatieve en positieve conformiteitsbeoordelingsresultaten aan de Europese Commissie en de overige
      lidstaten van de Europese Unie op diens verzoek;

      b. over negatieve conformiteitsbeoordelingsresultaten en op verzoek over positieve
      conformiteitsbeoordelingsresultaten aan de andere aangemelde instanties die bij de Europese Commissie zijn
      aangemeld en soortgelijke conformiteitsbeoordelingsactiviteiten voor dezelfde producten verrichten.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel16
  - number: '17'
    text: |-
      1 Indien een aangemelde instantie voornemens is om werkzaamheden waarvoor zij is aangewezen, te beëindigen, deelt
      zij dit ten minste drie maanden voor de voorgenomen datum van beëindiging mede aan de minister.

      2 Wanneer de aanwijzing van een aangemelde instantie overeenkomstig [artikel 14 van de wet](onbekend) wordt
      beperkt, geschorst, of ingetrokken, of een aangemelde instantie haar activiteiten heeft gestaakt, worden de
      dossiers door de betreffende aangemelde instantie:

      a. overgedragen aan een andere aangemelde instantie, of

      b. op een verzoek daartoe ter beschikking gesteld aan de minister.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel17
  - number: '18'
    text: |-
      1 In afwijking van [artikelen 3, eerste lid](onbekend), en [6, eerste lid, van de wet](onbekend) kan de minister,
      in uitzonderlijke gevallen van technische innovatie, ten aanzien van scheepsuitrusting die is bestemd voor
      plaatsing aan boord van een Nederlands schip en die niet aan de conformiteitsbeoordelingsprocedure voldoet, een
      certificaat van gelijkwaardigheid ten behoeve van technische innovatie afgeven, indien die scheepsuitrusting
      naar zijn oordeel ten minste gelijkwaardig is aan de scheepsuitrusting die wordt vervangen en die voldoet aan de
      vereisten gesteld bij of krachtens de [wet](onbekend).

      2 Aan het gebruik van scheepsuitrusting waarvoor het certificaat is afgegeven, kunnen beperkingen of voorschriften
      worden verbonden. Deze beperkingen en voorschriften worden in het certificaat vermeld.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel18
  - number: '19'
    text: |-
      1 In afwijking van [artikelen 3, eerste lid](onbekend), en [6, eerste lid, van de wet](onbekend), kan de minister,
      ten behoeve van beproeving of ter beoordeling, ten aanzien van scheepsuitrusting die is bestemd voor plaatsing
      aan boord van een Nederlands schip en waarvoor geen conformiteitsbeoordelingsprocedure is doorlopen of niet zijnde
      scheepsuitrusting als bedoeld in [artikel 18][ref1], een certificaat ten behoeve van beproeving afgeven.

      2 Aan het gebruik van scheepsuitrusting waarvoor het certificaat is afgegeven, kunnen beperkingen en voorschriften
      worden verbonden. Deze beperkingen en voorschriften worden in het certificaat vermeld.

      3 De minister bepaalt de geldigheidsduur van het certificaat ten behoeve van beproeving. De geldigheidsduur is niet
      langer dan voor een goede beproeving van de scheepsuitrusting redelijkerwijs nodig is en is zo kort mogelijk.

      4 Het certificaat wordt alleen afgegeven onder voorwaarde dat de scheepsuitrusting die voldoet aan de vereisten
      gesteld bij of krachtens de [wet](onbekend), niet wordt vervangen door de scheepsuitrusting, bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0038499#Artikel18
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel19
