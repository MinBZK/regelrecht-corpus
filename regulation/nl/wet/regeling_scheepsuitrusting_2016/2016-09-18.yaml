        artikel: '4'
        paragraaf: '2'
  - number: '8'
    text: |-
      1 De importeur vermeldt zijn naam, zijn geregistreerde handelsnaam of geregistreerde handelsmerk en het
      contactadres op het product.

      2 Wanneer het gelet op de omvang of aard van het product niet mogelijk is om de in het eerste lid genoemde
      informatie op het product aan te brengen, wordt de informatie vermeld op de verpakking of in de begeleidende
      documenten, dan wel, indien mogelijk, op beide wijzen.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel8
  - number: '9'
    text: |-
      Gedurende ten minste tien jaar nadat de stuurwielmarkering is aangebracht, en in geen geval voor een periode van
      korter dan de verwachte levensduur van de desbetreffende scheepsuitrusting deelt een marktdeelnemer, op verzoek,
      aan de markttoezichtautoriteit mede:

      a. welke marktdeelnemer een product aan hem heeft geleverd;

      b. aan welke marktdeelnemer hij een product heeft geleverd.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel9
  - number: '10'
    text: |-
      1 Scheepsuitrusting wordt voorafgaand aan het in de handel brengen beoordeeld met behulp van module B: EG-
      typeonderzoek, bedoeld in bijlage II bij de richtlijn. De fabrikant of diens vertegenwoordiger kiest daarnaast
      voor de conformiteitsbeoordeling van de betreffende scheepsuitrusting voor één van de volgende aanvullende modules,
      bedoeld in bijlage II bij de richtlijn:

      a. module D: productiekwaliteitsborging;

      b. module E: productkwaliteitsborging, of

      c. module F: productkeuring.

      2 In afwijking van het eerste lid kan voor scheepsuitrusting die per stuk of in kleine hoeveelheden wordt
      vervaardigd, worden gekozen voor module G: EG-eenheidskeuring.

      3 Indien een procedure als bedoeld in het eerste lid wordt gevolgd, kan voor de aanvullende module een andere
      aangemelde instantie worden gekozen dan voor module B: EG-typeonderzoek.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel10
  - number: '11'
    text: |-
      1 De EU-conformiteitsverklaring:

      a. komt qua structuur overeen met het model opgenomen in bijlage III bij Besluit nr. 768/2008/EG;

      b. bevat de elementen die zijn vastgelegd in de desbetreffende modules opgenomen in bijlage II bij de richtlijn;

      c. wordt actueel gehouden, en

      d. wordt opgesteld of vertaald in de taal of talen die worden vereist door de Europese lidstaat die vlaggenstaat
      is, waaronder ten minste in het Engels.

      2 De EU-conformiteitsverklaring die betrekking heeft op scheepsuitrusting bestemd voor plaatsing aan boord van een
      Nederlands schip, dan wel die op het grondgebied van Nederland in de handel wordt gebracht of op de markt wordt
      aangeboden, is opgesteld in ten minste de Engelse taal.

      3 Een afschrift van de EU-conformiteitsverklaring wordt verstrekt aan de aangemelde instantie of instanties die de
      desbetreffende conformiteitsbeoordelingsprocedure heeft, respectievelijk hebben verricht.
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel11
  - number: '12'
    text: |-
      1 Een conformiteitsbeoordelingsinstantie wordt slechts aangewezen indien zij voldoet aan het bepaalde in bijlage
      III bij de richtlijn.

      2 Een door de conformiteitsbeoordelingsinstantie in te dienen verzoek tot aanwijzing als bedoeld in [artikel 11,
      tweede lid, van de wet](onbekend) omvat in ieder geval:

      a. een beschrijving van de conformiteitsbeoordelingsactiviteiten;

      b. een beschrijving van de module of modules, genoemd in [artikel 10][ref1], waarvoor de instantie verklaart
      bekwaam te zijn;

      c. een beschrijving van het product of de producten waarvoor de instantie verklaart bekwaam te zijn;

      d. een accreditatiecertificaat dat is afgegeven door de nationale accreditatie-instantie, en

      e. een schriftelijke verklaring waarin de aanvrager de nationale accreditatie-instantie machtigt om alle door de
      minister gewenste gegevens en inlichtingen met betrekking tot zijn accreditatie te verstrekken.

      3 Een conformiteitsbeoordelingsinstantie kan uitsluitend voor een gehele module, genoemd in [artikel 10][ref2],
      worden aangewezen.

      4 De aanwijzing geldt steeds voor ten hoogste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0038499#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0038499#Artikel10
    url: https://wetten.overheid.nl/BWBR0038499/2016-09-18#Artikel12
    references:
