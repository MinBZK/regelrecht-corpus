---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_tegemoetkoming_ziektekosten_overheidsgepensioneerden_bes
regulatory_layer: WET
publication_date: '2011-08-29'
valid_from: '2011-01-01'
bwb_id: BWBR0028583
url: https://wetten.overheid.nl/BWBR0028583/2011-01-01
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder werknemer:'
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel1
  - number: 1.1.a
    text: de ambtenaar in de zin van de Wet materieel ambtenarenrecht BES;
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel1
  - number: 1.1.b
    text: de werkman in de zin van de Werkliedenwet 1944 BES;
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel1
  - number: 1.1.c
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel1
  - number: 1.1.d
    text: de verplichte leerkracht bij het gesubsidieerd bijzonder onderwijs;
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel1
  - number: 1.1.e
    text: |-
      de werknemer in dienst van een rechtspersoon, die op Bonaire, Sint Eustatius of Saba is gevestigd en bindingen
      heeft met de overheid, voor zover bij algemene maatregel van bestuur, of bij eilandsbesluit, houdende algemene
      maatregelen, is bepaald, dat deze wet overeenkomstige toepassing op hem vindt.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel1
  - number: '1.2'
    text: |-
      Tevens wordt als werknemer in de zin van deze wet aangemerkt de werknemer in overheidsdienst, die niet behoort tot
      de categorie bedoeld in lid 1, onder a, b of c, doch op wie deze wet van overeenkomstige toepassing is verklaard
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties of het desbetreffende bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel1
  - number: '1.3'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel1
  - number: '1.4'
    text: |-
      Deze wet is niet van toepassing op de werknemer die een betrekking of functie vervult waarvoor niet geregeld een
      volle dagtaak is vereist en die deswege niet in pensioengerechtigde dienst zou kunnen komen.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel1
  - number: '2'
    text: |-
      Als inkomen van de in [artikel 1, lid 1, letters a tot en met c][ref1] bedoelde categorieën van werknemers geldt
      het inkomen in de zin van het Besluit vakantie en vrijstelling van dienst ambtenaren BES, of het inkomen in de
      zin van het Besluit vakantie en vrijstelling van dienst werknemers BES, met uitzondering van de compensatietoeslag
      krachtens de Wet algemene ouderdomsverzekering BES en de Wet algemene weduwen- en wezenverzekering BES. Het
      vorenstaande vindt overeenkomstige toepassing voor wat betreft het inkomen en de overige categorieën van werknemers
      bedoeld in artikel 1, leden 1 en 2.


      [ref1]: https://wetten.overheid.nl/BWBR0028583#Artikel1
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028583
        artikel: '1'
  - number: '3'
    text: 'In deze wet wordt verstaan onder pensioeninkomen:'
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel3
  - number: 3.a
    text: pensioen ten laste van het BES ambtenarenpensioenfonds, vermeerderd met de toegekende duurtetoeslag;
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel3
  - number: 3.b
    text: |-
      uitkering bij wijze van pensioen ingevolge de Wet leeftijdsgrens ambtenaren BES, vermeerderd met de toegekende
      duurtetoeslag;
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel3
  - number: 3.c
    text: pensioen ten laste van het BES werkliedenpensioenfonds, vermeerderd met de eventueel toegekende duurtetoeslag;
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel3
  - number: 3.d
    text: onderstand bij wijze van pensioen, vermeerderd met de eventueel toegekende duurtetoeslag.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel3
  - number: '4'
    text: |-
      Voor de toepassing van deze wet geldt als woonplaats, de woonplaats overeenkomstig de derde titel van het eerste
      boek van het Burgerlijk Wetboek BES, met dien verstande, dat de woonplaats geacht wordt buiten de openbare lichamen
      Bonaire, Sint Eustatius en Saba te zijn bij een onafgebroken verblijf buiten de openbare lichamen Bonaire, Sint
      Eustatius en Saba van langer dan een jaar van de gewezen werknemer of van de weduwe die pensioeninkomen geniet.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel4
  - number: '5'
    text: |-
      Bij elke uitbetaling van het inkomen van de werknemer wordt daarop een premie ten bedrage van 1% van dit inkomen
      ingehouden.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel5
  - number: '6.1'
    text: 'Op het pensioeninkomen van:'
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel6
  - number: 6.1.a
    text: |-
      de werknemer die de dienst verlaat na vervulling van een diensttijd van tenminste 20 jaren en in aanmerking komt
      voor direct ingaand pensioeninkomen;
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel6
  - number: 6.1.b
    text: |-
      de werknemer die de dienst verlaat op grond van medische ongeschiktheid voor de verdere uitoefening van zijn dienst
      en in aanmerking komt voor direct ingaand pensioeninkomen;
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel6
  - number: 6.1.c
    text: |-
      de werknemer, aan wie op grond van het bereiken van een bij wettelijke regeling gestelde leeftijdsgrens eervol
      ontslag is verleend, tenminste een diensttijd van 10 jaren heeft volbracht en in aanmerking komt voor direct
      ingaand pensioeninkomen;
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel6
  - number: 6.1.d
    text: |-
      de gewezen werknemer die vóór het tijdstip van inwerkingtreding van deze wet de dienst heeft verlaten en daarbij in
      aanmerking is gekomen voor direct ingaand pensioeninkomen;
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel6
  - number: 6.1.e
    text: |-
      de weduwe en/of wezen die pensioeninkomen genieten indien het betreft de weduwe en/of wezen van de in
      [artikel 1][ref1] bedoelde werknemer of van de onder a, b of c bedoelde gewezen werknemer, wordt maandelijks de in
      het tweede lid bedoelde premie ingehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0028583#Artikel1
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028583
        artikel: '1'
  - number: '6.2'
    text: 'De in het voorgaande lid bedoelde premie bedraagt:'
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel6
  - number: 6.2.a
    text: bij een pensioeninkomen van USD 279 per maand of minder 2½% van het pensioeninkomen;
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel6
  - number: 6.2.b
    text: |-
      bij een pensioeninkomen van meer dan USD 279 per maand 2½% van de eerste USD 279, en 5% van het resterende gedeelte
      van het pensioeninkomen.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel6
  - number: '6.3'
    text: |-
      Het in het voorgaande lid vermelde geldsbedrag kan bij algemene maatregel van bestuur, worden gewijzigd ingeval van
      een algemene aanpassing van het pensioeninkomen.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel6
  - number: '6.4'
    text: |-
      Het eerste lid is niet van toepassing op de gewezen werknemer, die voor zich en zijn na te laten betrekkingen en
      evenmin op de weduwe van een werknemer, die voor zich en de uit haar geboren wezen binnen een maand na ingang van
      het pensioen schriftelijk verklaart afstand te doen van de rechten voortvloeiende uit deze wet.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel6
  - number: '6.5'
    text: |-
      Het eerste lid is niet van toepassing op de daarin vermelde gewezen werknemers en weduwen en wezen zolang zij hun
      woonplaats niet in de openbare lichamen Bonaire, Sint Eustatius en Saba hebben.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel6
  - number: '6.6'
    text: |-
      Het eerste lid is niet van toepassing op de daarin vermelde gewezen werknemer of weduwe zolang zij werknemer zijn
      in de zijn van [artikel 1][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028583#Artikel1
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028583
        artikel: '1'
  - number: '7.1'
    text: |-
      Er is een BES fonds ziektekosten overheidsgepensioneerden, dat door het BES ambtenarenpensioenfonds wordt beheerd.
      Dit fonds is rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel7
  - number: '7.2'
    text: |-
      De ingevolge de [artikelen 5][ref1] en [6][ref2] ingehouden premie worden in dit fonds gestort.


      [ref1]: https://wetten.overheid.nl/BWBR0028583#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028583#Artikel6
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028583
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0028583
        artikel: '6'
  - number: '7.3'
    text: Voorschriften betreffende het beheer van dit fonds worden vastgesteld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel7
  - number: '8.1'
    text: |-
      De Wet vergoeding behandeling- en verplegingskosten ambtenaren BES, is van overeenkomstige toepassing op de gewezen
      werknemer en op de weduwe en/of wezen bedoeld [sub a tot en met d van artikel 6, lid 1][ref1], indien de ziekte-
      uitgaven gemaakt zijn op een tijdstip dat de belanghebbende premie heeft betaald op het pensioeninkomen en zijn
      woonplaats had in de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028583#Artikel6
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028583
        artikel: '6'
  - number: '8.2'
    text: |-
      De tegemoetkoming in de blijkens overgelegde bewijsstukken gedane onvermijdelijke uitgaven wordt verleend terzake
      van geneeskundige behandeling en/of verpleging betreffende:
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel8
  - number: 8.2.a
    text: |-
      de gewezen werknemer bedoeld [sub a tot en met c van artikel 6, lid 1][ref1], zijn echtgenote en zijn kinderen als
      bedoeld in [artikel 2 ][ref2]van de wet, bedoeld in het eerste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0028583#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028583#Artikel2
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028583
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0028583
        artikel: '2'
  - number: 8.2.b
    text: |-
      de weduwe en/of wezen bedoeld [sub d van artikel 6, lid 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028583#Artikel6
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028583
        artikel: '6'
  - number: '8.3'
    text: 'Voor de vaststelling van de tegemoetkoming in de uitgaven van verpleging in een ziekeninrichting geldt:'
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel8
  - number: 8.3.a
    text: |-
      indien de werknemer op het tijdstip van eindiging van zijn dienstverband bij toepassing van
      [artikel 5, lid 3][ref1] van de wet, bedoeld in het eerste lid, voor verpleging in de eerste of tweede klasse in
      aanmerking zou zijn gekomen, wordt de tweede klasse als maatstaf genomen in de overige gevallen de derde klasse;


      [ref1]: https://wetten.overheid.nl/BWBR0028583#Artikel5
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028583
        artikel: '5'
  - number: 8.3.b
    text: |-
      voor de nagelaten betrekkingen van de gewezen werknemer geldt de klasse welke voor de gewezen werknemer ingevolge
      sub a zou hebben gegolden.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel8
  - number: '9'
    text: |-
      De gewezen werknemer, de weduwe of wees die ingevolge [artikel 8][ref1] aanspraak heeft op tegemoetkoming in
      ziektekosten is gehouden het BES ambtenarenpensioenfonds vóór zijn/haar vertrek naar het buitenland mededeling
      te doen van de vermoedelijke duur van hun verblijf in het buitenland. Het BES ambtenarenpensioenfonds geeft een
      bewijsstuk af waaruit blijkt dat deze mededeling is gedaan. Het niet tijdig voldoen aan de mededelingsplicht
      heeft, behoudens ingeval van overmacht, tot gevolg dat geen aanspraak kan worden gemaakt op tegemoetkoming in de
      ziektekosten gemaakt tijdens dat verblijf buiten de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028583#Artikel8
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028583
        artikel: '8'
  - number: '10.1'
    text: |-
      Deze wet vindt overeenkomstige toepassing op de werknemer, die de dienst verlaat na een diensttijd van 20 jaar met
      uitzicht op uitgesteld pensioen mits het BES ambtenarenpensioenfonds binnen een maand na de ingangsdatum van zijn
      ontslag zijn schriftelijk verzoek ontvangt om onder de werking van deze wet te blijven vallen en hij op zich neemt
      de verschuldigde premie ten bedrage van tweemaal de laatstelijk door hem als werknemer betaalde premie maandelijks
      te voldoen tot de dag, dat zijn uitgesteld pensioen ingaat, tenzij hij eerder als werknemer zou worden herplaatst
      of zou komen te overlijden.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel10
  - number: '10.2'
    text: |-
      Ingeval de in lid 1 bedoelde werknemer een echtgenote en/of kinderen heeft, die bij zijn overlijden in
      aanmerking komen voor weduwen- en onderscheidenlijk wezenpensioen indien hij ten behoeve van hen het vrijwillig
      deelgenootschap overeenkomstig de Pensioenverordening Burgerlijke Landsdienaren 1938 (P.B. 1949, no. 125)
      verzoekt, kan deze wet slechts overeenkomstige toepassing op hem vinden, indien hij het verzoek tot vrijwillig
      deelgenootschap als voormeld heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel10
  - number: '10.3'
    text: |-
      Deze wet houdt op voor de in lid 1 bedoelde werknemer alsmede zijn weduwe en wezen te gelden, indien de premie een
      jaar na het einde van de maand waarover zij is verschuldigd nog niet is voldaan.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel10
  - number: '10.4'
    text: |-
      Door het indienen van het verzoek bedoeld in lid 1 wordt de betrokkenen geacht afstand te hebben gedaan van het
      recht tot restitutie van de helft van betaalde premies als bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028583#Artikel11
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028583
        artikel: '11'
  - number: '10.5'
    text: |-
      Indien de in lid 1 bedoelde werknemer de dienst reeds heeft verlaten op het tijdstip waarop deze wet in werking
      treedt wordt het tijdstip van een maand als bedoeld in dat lid geacht aan te vangen op het tijdstip waarop deze wet
      in werking treedt en bedraagt de premie 2% van het inkomen dat hij genoot op het tijdstip dat hij de dienst heeft
      verlaten.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel10
  - number: '10.6'
    text: |-
      Met ingang van de dag waarop het uitgesteld pensioen van de in lid 1 bedoelde werknemer of het weduwen-
      en/of wezenpensioen van zijn nagelaten betrekkingen ingaat, wordt met overeenkomstige toepassing van
      [artikel 6 ][ref1]een aanvang gemaakt met inhouding van de premie op het pensioeninkomen en kunnen in de ziekte-
      uitgaven vanaf dat tijdstip gemaakt overeenkomstig [artikel 8][ref2] tegemoetkomingen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028583#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028583#Artikel8
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028583
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0028583
        artikel: '8'
  - number: '11'
    text: 'De gewezen werknemer of zijn weduwe kan slechts restitutie verkrijgen van de helft van de betaalde premies:'
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel11
  - number: 11.a
    text: |-
      indien op het tijdstip van eindiging van zijn dienstverband vaststaat dat hij, als gewezen werknemer, nimmer
      rechten aan deze wet zal kunnen ontlenen;
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel11
  - number: 11.b
    text: |-
      indien overeenkomstig [artikel 6, lid 4][ref1] afstand is gedaan van de rechten voortvloeiende uit deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028583#Artikel6
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028583
        artikel: '6'
  - number: '12.1'
    text: |-
      De in deze wet bedoelde tegemoetkoming in ziektekosten wordt door of namens de Stichting BES pensioenfonds
      vastgesteld en betaalbaar gesteld ten last van het BES fonds ziektekosten overheidsgepensioneerden.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel12
  - number: '12.2'
    text: Restitutie van ingehouden premies wordt verleend en uitbetaald door voornoemd fonds.
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel12
  - number: '13'
    text: |-
      Deze landsverordening treedt in werking met ingang van de eerste dag van de maand volgende op die waarin zij is
      afgekondigd, met uitzondering van [artikel 12][ref1], dat in werking treedt met ingang van de eerste dag van de
      derde maand volgende op de maand, waarin zij is afgekondigd.


      [ref1]: https://wetten.overheid.nl/BWBR0028583#Artikel12
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028583
        artikel: '12'
  - number: '14'
    text: 'Deze wet wordt aangehaald als: Wet tegemoetkoming ziektekosten overheidsgepensioneerden BES.'
    url: https://wetten.overheid.nl/BWBR0028583/2011-01-01#Artikel14
