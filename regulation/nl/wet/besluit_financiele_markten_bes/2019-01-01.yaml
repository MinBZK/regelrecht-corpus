  - number: 1:5.a
    text: de consument niet adviseert over het goederenkrediet; en
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel15
  - number: 1:5.b
    text: een andere hoofdberoepswerkzaamheid heeft dan bemiddeling in goederenkrediet.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel15
  - number: 1:6
    text: |-
      De [wet][ref1] is niet van toepassing op de uitgifte van elektronisch geld dat uitsluitend kan worden gebruikt:


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 1:6.a
    text: |-
      hetzij in door de onderneming of instelling door of namens wie het elektronisch geld is uitgegeven gebruikte
      bedrijfsgebouwen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel16
  - number: 1:6.b
    text: |-
      hetzij op grond van een handelsovereenkomst met de in onderdeel a genoemde onderneming of instelling binnen een
      beperkt netwerk van dienstverleners;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel16
  - number: 1:6.c
    text: hetzij voor een beperkte reeks goederen dan wel diensten.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel16
  - number: 1:7.1
    text: |-
      De [wet][ref1] is met betrekking tot het optreden als adviseur niet van toepassing op adviseurs, voor zover zij
      adviseren over andere financiële producten dan krediet aan consumenten die bij hen werkzaam zijn of anderszins
      onder hun verantwoordelijkheid vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 1:7.2
    text: |-
      De [wet][ref1] is met betrekking tot het optreden als bemiddelaar niet van toepassing op bemiddelaars, voor zover
      zij bemiddelen over andere financiële producten dan krediet ten behoeve van consumenten die bij hen werkzaam zijn
      of anderszins onder hun verantwoordelijkheid vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 1:7.3
    text: |-
      De [wet][ref1] is met betrekking tot het optreden als gevolmachtigd of ondergevolmachtigd agent niet van toepassing
      op gevolmachtigd of ondergevolmachtigd agenten, voor zover zij verzekeringen sluiten met consumenten die bij hen in
      dienst zijn of anderszins onder hun verantwoordelijkheid vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 1:8
    text: |-
      De [wet][ref1], met uitzondering van [hoofdstuk 1][ref2], [hoofdstuk 5, paragrafen 4][ref3] en [5][ref4], en de
      [hoofdstukken 6][ref5] en [7][ref6], is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0030883
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0030883#Paragraaf4
