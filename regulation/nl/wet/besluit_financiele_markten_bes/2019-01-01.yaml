  - number: 2:4.2
    text: |-
      [Artikel 2:3, tweede en derde lid][ref1], is van overeenkomstige toepassing op een bemiddelaar onderscheidenlijk
      een gevolmachtigd agent of ondergevolmachtigd agent met zetel in het buitenland.


