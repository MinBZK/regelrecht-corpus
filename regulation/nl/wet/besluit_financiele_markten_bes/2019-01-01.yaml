        hoofdstuk: '7'
  - number: 1:8.a
    text: |-
      het verlenen van financiële diensten of het aanbieden van financiële producten, niet zijnde rechten van deelneming
      in beleggingsinstellingen, door pensioenfondsen voor zover zij die financiële diensten verlenen of die financiële
      producten aanbieden aan de bedrijfstak of onderneming waarmee zij zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel18
  - number: 1:8.b
    text: |-
      het optreden als vermogensbeheerder ten behoeve van pensioenfondsen of daaraan gelieerde fondsen door personen die
      zijn verbonden aan het fonds waaraan deze financiële dienst wordt verleend.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel18
  - number: 1:9.1
    text: |-
      De [wet][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 1:9.1.a
    text: |-
      het door een werkgever als nevenactiviteit aanbieden van krediet aan uitsluitend zijn werknemers of het verlenen
      van een financiële dienst met betrekking tot dat krediet:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel19
  - number: 1:9.1.a.1°
    text: rentevrij of tegen een lagere dan de op de markt gebruikelijke rentevoet;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel19
  - number: 1:9.1.a.2°
    text: |-
      tegen een rentevoet die niet hoger is dan de op de markt gebruikelijke rentevoet en onder voorwaarden die voor de
      consument gunstiger zijn dan de op de markt gebruikelijke voorwaarden;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel19
  - number: 1:9.1.b
    text: |-
      het aanbieden van krediet, of het verlenen van een financiële dienst met betrekking tot zodanig krediet, dat binnen
      drie maanden dient te worden afgelost en ter zake waarvan slechts onbetekenende kosten aan de consument in rekening
      worden gebracht.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel19
  - number: 1:9.2
    text: |-
      De [wet][ref1], met uitzondering van de [artikelen 5:3][ref2], [5:4][ref3] en [5:15][ref4], is niet van toepassing
      op het aanbieden van, of het verlenen van financiële diensten met betrekking tot, een geoorloofde debetstand
      waarbij de consument is gehouden binnen een maand af te lossen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0030883#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel19
