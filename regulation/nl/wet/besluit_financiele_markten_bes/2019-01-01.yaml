articles:
  - number: 1:1
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt, tenzij anders bepaald, verstaan onder: - *bewaarder:* een
      aan een beleggingsinstelling verbonden bewaarder als bedoeld in [artikel 4:4, eerste lid, van de wet][ref1];
        - *kredietvereniging:* een kredietinstelling met de rechtsvorm van een coöperatie die ten doel heeft zijn leden
      behulpzaam te zijn bij het sparen en verlenen van kredieten;
        - *wet:* [Wet financiële markten BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0030883
  - number: 1:2
    text: |-
      Bij regeling van Onze Minister kunnen personen die voldoen aan in die regeling vast te stellen criteria met
      betrekking tot aard en omvang van hun activiteiten, worden aangewezen als professionele marktpartij.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel12
  - number: 1:3
    text: |-
      De [wet][ref1] is met betrekking tot het optreden als adviseur niet van toepassing op adviseurs die een andere
      hoofdberoepswerkzaamheid hebben dan het verlenen van financiële diensten of het aanbieden van financiële producten
      en uit hoofde van die hoofdberoepswerkzaamheid inzicht hebben in de financiële situatie van een consument of
      cliënt, voor zover zij, zonder daarvoor van de aanbieder provisie te ontvangen, het aanbevolen product aan te
      bieden of andere financiële diensten te verlenen met betrekking tot het aanbevolen product, die consument of cliënt
      adviseren en de door hen verstrekte adviezen in het verlengde liggen van hun hoofdberoepswerkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 1:4.1
    text: |-
      De [hoofdstukken 2 tot en met 5 van de wet][ref1], met uitzondering van de [artikelen 2:21][ref2] en [2:22][ref3]
      en de [paragrafen 4][ref4] en [5 van hoofdstuk 5][ref5], zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0030883#Artikel2
