        bwb_id: BWBR0031636
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:6.b
    text: een opgave van de aard van de risico’s die de verzekeraar voornemens is te dekken;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel26
  - number: 2:6.c
    text: |-
      een raming voor de eerste drie boekjaren van de andere dan de in [artikel 2:5, onderdeel g][ref1], bedoelde kosten
      van beheer, met name van de algemene kosten en provisies;


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel2
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:6.d
    text: |-
      een raming voor de eerste drie boekjaren van de premies en van de schaden met betrekking tot de directe
      verzekeringen, de geaccepteerde herverzekeringen en de uitgaande herverzekeringen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel26
