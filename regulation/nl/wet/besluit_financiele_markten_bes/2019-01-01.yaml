    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:7.1.a
    text: een opgave van de aard van de overeenkomsten die de verzekeraar voornemens is aan te gaan in de openbare lichamen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel27
  - number: 2:7.1.b
    text: de polisvoorwaarden die de verzekeraar voornemens is te gebruiken in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel27
  - number: 2:7.2
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 2:2, onderdeel f][ref1], van een schadeverzekeraar met zetel
      in het buitenland bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel2
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:7.2.a
    text: een opgave van de aarde van de risico’s die de verzekeraar voornemens is te dekken in de openbare lichamen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel27
  - number: 2:7.2.b
    text: de polisvoorwaarden die de verzekeraar voornemens is te gebruiken in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel27
  - number: 2:7.3
    text: |-
      Een levensverzekeraar of schadeverzekeraar met zetel in het buitenland voegt bij het programma van werkzaamheden
      zijn jaarrekeningen van de laatste drie boekjaren.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel27
  - number: 2:8.1
    text: |-
      Een financiële onderneming waaraan op grond van [deze wet][ref1] een vergunning is verleend, meldt aan de
      toezichtautoriteit een wijziging in de gegevens die eerder door haarzelf aan de toezichtautoriteit zijn verstrekt
      met betrekking tot de betrouwbaarheid van de in [artikel 3:4, eerste lid, van de wet][ref2] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0030883
      - id: ref2
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 2:8.2
    text: |-
      De financiële onderneming meldt de wijziging schriftelijk en onverwijld nadat zij daarvan in het kader van de
      normale bedrijfsvoering kennis heeft genomen
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel28
  - number: 2:9.1
    text: |-
      Een financiële onderneming waaraan op grond van [deze wet][ref1] een vergunning is verleend, geeft de
      toezichtautoriteit kennis van het voornemen tot wijziging van:


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 2:9.1.a
    text: |-
      de personen die het dagelijks beleid van de financiële onderneming bepalen of het beleid van de financiële
      onderneming bepalen of mede bepalen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel29
  - number: 2:9.1.b
    text: |-
      indien van toepassing, de personen die onderdeel zijn van een orgaan dat belast is met het toezicht op het beleid
      en de algemene gang van zaken van de financiële onderneming.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel29
  - number: 2:9.2
    text: |-
      Met betrekking tot het voornemen, bedoeld in het eerste lid, verstrekt de financiële onderneming gegevens en
      bescheiden op basis waarvan de toezichtautoriteit kan beoordelen of de financiële onderneming met betrekking tot
      de betrokken persoon voldoet aan de bij of krachtens de [artikelen 3:4][ref1] en [3:5 van de wet][ref2] gestelde
      regels met betrekking tot de betrouwbaarheid en de geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 2:9.3
    text: |-
      De financiële onderneming geeft geen uitvoering aan de voornemens, bedoeld in het eerste lid, voordat de
      toezichtautoriteit heeft ingestemd met de wijziging. De toezichtautoriteit neemt een besluit omtrent instemming
      binnen acht weken na ontvangst van de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel29
  - number: 2:10
    text: |-
      Een financiële onderneming waaraan op grond van deze [wet][ref1] een vergunning is verleend, meldt binnen twee
      weken schriftelijk aan de toezichtautoriteit een wijziging in de gegevens en bescheiden met betrekking tot de
      financiële onderneming die zij ingevolge [artikel 2:2][ref2] aan de toezichtautoriteit heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel2
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0030883
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:11.1
    text: |-
      Een financiële onderneming met zetel in de openbare lichamen meldt aan de toezichtautoriteit schriftelijk haar
      voornemen om:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel211
  - number: 2:11.1.a
    text: een bijkantoor in het buitenland op te richten;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel211
  - number: 2:11.1.b
    text: de uitoefening van haar bedrijf vanuit een bijkantoor in het buitenland te staken.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel211
  - number: 2:11.2
    text: |-
      Een financiële onderneming met zetel in het buitenland meldt aan de toezichtautoriteit schriftelijk het voornemen
      om de uitoefening van haar bedrijf vanuit een bijkantoor in de openbare lichamen te staken.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel211
  - number: 2:11.3
    text: |-
      De financiële onderneming geeft geen uitvoering aan het voornemen, bedoeld in het eerste en tweede lid, voordat
      vier weken zijn verstreken na de melding.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel211
  - number: 2:12.1
    text: |-
      De toezichtautoriteit draagt zorg voor een zodanige indeling en inrichting van het register financiële markten,
      bedoeld in [artikel 2:19, eerste lid, van de wet][ref1], dat uit het register is op te maken vanaf welk tijdstip,
      welke activiteiten de ingeschreven financiële ondernemingen mogen verrichten, met inbegrip van de eventueel
      gestelde beperkingen, alsmede de staat van zetel. Het register wordt zo ingericht dat het raadpleegbaar is op een
      website van de toezichtautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel2
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '2'
  - number: 2:12.2
    text: 'Het register vermeldt ten aanzien van een ingeschreven financiële onderneming:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel212
  - number: 2:12.2.a
    text: |-
      in bij regeling van Onze Minister te bepalen gevallen de op de financiële onderneming van toepassing zijnde
      vrijstellingen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel212
  - number: 2:12.2.b
    text: |-
      op grond van [artikel 1:27 van de wet][ref1] verleende ontheffingen;


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel1
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '1'
  - number: 2:12.2.c
    text: |-
      in voorkomend geval, dat zij haar bedrijf afwikkelt overeenkomstig [artikel 2:17 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel2
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '2'
  - number: 2:12.2.d
    text: |-
      ingevolge [artikel 7:20 van de wet][ref1] opgelegde verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '7'
  - number: 2:12.3
    text: 'Het register vermeldt voorts:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel212
  - number: 2:12.3.a
    text: |-
      de in voorkomend geval aan een ingeschreven beleggingsinstelling verbonden beheerder en bewaarder, welke beheerder
      en bewaarder in het register worden opgenomen bij de betrokken beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel212
  - number: 2:12.3.b
    text: |-
      de naam van de verzekeraar voor wie de volmacht van een ingeschreven gevolmachtigde agent of ondergevolmachtigde
      agent geldt, welke naam van de verzekeraar in het register wordt opgenomen bij de betrokken gevolmachtigde of
      ondergevolmachtigde agent;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel212
  - number: 2:12.3.c
    text: of een ingeschreven bemiddelaar afhankelijk dan wel onafhankelijk is van een of meer verzekeraars.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel212
  - number: 2:13
    text: |-
      De inschrijving in het register van een financiële onderneming waarvan de vergunning is ingetrokken, wordt
      doorgehaald zodra de beslissing tot intrekking in werking is getreden. Zolang deze beslissing nog niet
      onherroepelijk is wordt dit bij de doorhaling vermeld.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel213
  - number: 2:14.1
    text: |-
      De toezichtautoriteit draagt er zorg voor dat de in [artikel 2:12][ref1] bedoelde gegevens tot ten minste vijf jaar
      terug geraadpleegd kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel2
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2:14.2
    text: |-
      De toezichtautoriteit verstrekt aan een ieder desgevraagd, tegen betaling van de kostprijs, afschriften uit het
      register.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel214
  - number: 2:15
    text: |-
      Het is een verzekeraar als bedoeld in [artikel 2:23, eerste lid, van de wet][ref1], niet zijnde een verzekeraar
      met zetel in Curaçao of Sint Maarten, slechts toegestaan vanuit het buitenland verzekeringen aan te bieden in
      de openbare lichamen indien het naar de aard en de waarde van het te verzekeren belang risico’s betreft die niet
      binnen de openbare lichamen verzekerbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel2
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel215
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '2'
  - number: 2:16.1
    text: |-
      Een verzekeraar als bedoeld in [artikel 2:23, eerste lid, van de wet][ref1] maakt voor de ingevolge dat lid
      voorgeschreven kennisgeving gebruik van een door de Nederlandsche Bank vastgesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel2
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '2'
  - number: 2:16.2
    text: |-
      Indien een verzekeraar als bedoeld in het eerste lid voornemens is verzekeringen aan te bieden tot dekking van
      wettelijke aansprakelijkheid, voortvloeiend uit het gebruik van motorrijtuigen, toont hij aan te voldoen aan
      [artikel 4:32 van de wet][ref1] en aan [artikel 6:8][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel6
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 2:16.3
    text: |-
      Indien een verzekeraar als bedoeld in het eerste lid voornemens is verzekeringen aan te bieden als bedoeld in
      [artikel 6:7, tweede lid][ref1], toont hij aan te voldoen aan de bij of krachtens dat artikel gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel6
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 2:17.1
    text: |-
      Het is een kredietinstelling met zetel in het buitenland slechts toegestaan door middel van een bijkantoor in de
      openbare lichamen het bedrijf van kredietinstelling uit te oefenen, indien:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel217
  - number: 2:17.1.a
    text: |-
      de som van de bij het bijkantoor aangehouden betaalrekeningen, spaartegoeden en deposito’s per ultimo van het
      laatst afgesloten boekjaar niet meer bedraagt dan een bij regeling van Onze Minister vast te stellen bedrag; en
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel217
  - number: 2:17.1.b
    text: |-
      de kredietinstelling zich vanuit het bijkantoor uitsluitend of hoofdzakelijk richt op ingezetenen van de openbare
      lichamen, Curaçao of Sint Maarten dan wel aldaar gevestigde bedrijven.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel217
  - number: 2:17.2
    text: |-
      Het is een verzekeraar met zetel in het buitenland slechts toegestaan door middel van een bijkantoor in de openbare
      lichamen het verzekeringsbedrijf uit te oefenen, indien:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel217
  - number: 2:17.2.a
    text: |-
      de door het bijkantoor ontvangen bruto premies over het laatst afgesloten boekjaar niet meer bedragen dan een bij
      regeling van Onze Minister vast te stellen bedrag; en
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel217
  - number: 2:17.2.b
    text: |-
      de verzekeraar zich vanuit het bijkantoor uitsluitend of hoofdzakelijk richt op ingezetenen van de openbare
      lichamen, Curaçao of Sint Maarten dan wel aldaar gevestigde bedrijven.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel217
  - number: 2:17.3
    text: |-
      Een kredietinstelling als bedoeld in het eerste lid of een verzekeraar als bedoeld in het tweede lid die niet
      meer voldoet aan de in het eerste onderscheidenlijk tweede lid gestelde voorwaarden, meldt dit terstond aan de
      Nederlandsche Bank. De Nederlandsche Bank stelt de kredietinstelling of verzekeraar in de gelegenheid binnen een
      door haar vast te stellen redelijke termijn alsnog aan de voorwaarden te voldoen dan wel haar onderscheidenlijk
      zijn activiteiten onder te brengen in een in de openbare lichamen gevestigde of te vestigen rechtspersoon of deze
      af te wikkelen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel217
  - number: 2:17.4
    text: De Nederlandsche Bank kan nadere regels stellen met betrekking tot het eerste lid tot en met het derde lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel217
  - number: 3:1.1
    text: |-
      De toezichtautoriteit beoordeelt de betrouwbaarheid van een persoon als bedoeld in
      [artikel 3:4, eerste lid, van de wet][ref1] op basis van diens voornemens, handelingen en antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 3:1.2
    text: |-
      De toezichtautoriteit neemt bij de beoordeling, bedoeld in het eerste lid, in ieder geval de in [bijlage 1][ref1]
      genoemde antecedenten in aanmerking, alsmede:


      [ref1]: https://wetten.overheid.nl/BWBR0031636
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0031636
  - number: 3:1.2.a
    text: |-
      het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging of gedragingen en de overige
      omstandigheden van het geval;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel31
  - number: 3:1.2.b
    text: de belangen die de wet beoogt te beschermen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel31
  - number: 3:1.2.c
    text: de overige belangen van de financiële onderneming en de betrokkene.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel31
  - number: 3:1.3
    text: |-
      Telkens na verloop van drie jaren vindt een nieuwe beoordeling plaats van de betrouwbaarheid van de in het eerste
      lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel31
  - number: 3:2
    text: |-
      De betrouwbaarheid van een persoon als bedoeld in [artikel 3:1, eerste lid][ref1], staat niet buiten twijfel als
      deze veroordeeld is ter zake van een misdrijf, genoemd in onderdeel 1 van [bijlage 1][ref2], tenzij er sinds het
      onherroepelijk worden van de uitspraak acht jaren of meer zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031636
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0031636
  - number: 3:3.1
    text: |-
      De toezichtautoriteit verkrijgt inzicht in de in [artikel 3:1, eerste lid][ref1], bedoelde voornemens, handelingen
      en antecedenten op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:3.1.a
    text: door betrokkene verstrekte gegevens en inlichtingen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
  - number: 3:3.1.b
    text: door de procureur-generaal uit inlichtingen van de justitiële documentatiedienst verstrekte gegevens;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
  - number: 3:3.1.c
    text: gegevens en inlichtingen, verkregen van de rijksbelastingdienst;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
  - number: 3:3.1.d
    text: |-
      gegevens en inlichtingen, verkregen van Nederlandse of buitenlandse overheidsinstanties dan wel van Nederlandse of
      buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële markten of op
      personen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
  - number: 3:3.1.e
    text: ambtsberichten van het Openbaar Ministerie;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
  - number: 3:3.1.f
    text: inlichtingen, verkregen van door betrokkene opgegeven referenties;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
  - number: 3:3.1.g
    text: gegevens uit openbare bronnen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
  - number: 3:3.1.h
    text: |-
      inlichtingen, verkregen van curatoren of bewindvoerders met betrekking tot faillissementen, surseances,
      schuldsaneringen, bewindvoeringen of noodregelingen waarbij de in [artikel 3:1, eerste lid][ref1], bedoelde persoon
      betrokken is geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:3.1.i
    text: inlichtingen, verkregen van organisaties van huidige of voormalige beroepsgenoten van betrokkene;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
  - number: 3:3.1.j
    text: gegevens en inlichtingen, verkregen uit andere bij regeling van Onze Minister aan te wijzen bronnen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
  - number: 3:3.2
    text: |-
      Indien de gegevens of inlichtingen, verkregen overeenkomstig het eerste lid, de toezichtautoriteit aanleiding geven
      tot nader onderzoek, kan de toezichtautoriteit ook inlichtingen inwinnen en gegevens opvragen bij andere personen
      of instanties dan genoemd in dat lid. De toezichtautoriteit stelt de betrokkene in dat geval vooraf schriftelijk in
      kennis van:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
  - number: 3:3.2.a
    text: de reden van het nadere onderzoek;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
  - number: 3:3.2.b
    text: de personen of instanties bij wie nadere gegevens of inlichtingen zullen worden ingewonnen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
  - number: 3:3.2.c
    text: de aard van de nadere gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel33
  - number: 3:4
    text: |-
      Geschiktheid in verband met de uitoefening van het bedrijf van bemiddelaar in schadeverzekeringen of
      levensverzekeringen, gevolmachtigd agent of ondergevolmachtigd agent wordt aangetoond door een bij regeling van
      Onze Minister, zo nodig onder voorwaarden, erkend diploma.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel34
  - number: 3:5.1
    text: |-
      Het dagelijks beleid van een beleggingsinstelling, bewaarder, kredietinstelling, trustkantoor of verzekeraar wordt
      bepaald door ten minste twee natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel35
  - number: 3:5.2
    text: |-
      Een kredietinstelling of verzekeraar met zetel in de openbare lichamen heeft een uit ten minste drie leden
      bestaande raad van commissarissen dan wel gelijksoortig orgaan, belast met toezicht op het beleid en de algemene
      gang van zaken binnen de financiële onderneming.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel35
  - number: 3:5.3
    text: |-
      Indien een beleggingsinstelling met zetel in de openbare lichamen een raad van commissarissen heeft, bestaat deze
      uit ten minste drie leden.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel35
  - number: 3:5.4
    text: |-
      Ten minste een van de personen die het dagelijks beleid bepalen van een trustkantoor verricht zijn werkzaamheden in
      verband daarmee vanuit de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel35
  - number: 3:6.1
    text: |-
      Deze paragraaf is niet van toepassing op adviseurs, bemiddelaars, gevolmachtigde agenten of ondergevolmachtigde
      agenten, indien deze in het voorafgaande boekjaar een omzet hadden van minder dan USD 0,5 miljoen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel36
  - number: 3:6.2
    text: |-
      Voor de toepassing van deze paragraaf wordt onder cliënt mede verstaan de persoon die kwalificeert als
      professionele marktpartij, en wordt met een financiële onderneming gelijkgesteld de aan een beleggingsinstelling
      verbonden bewaarder.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel36
  - number: 3:7.1
    text: |-
      Een financiële onderneming draagt zorg voor een integriteitsbewuste bedrijfscultuur, door procedures en maatregelen
      geïntegreerd in de bedrijfsvoering en gebaseerd op een systematische analyse van risico’s die kunnen leiden tot
      aantasting van de reputatie of een bestaande of toekomstige bedreiging kunnen vormen van het vermogen of het
      resultaat van een financiële onderneming als gevolg van een ontoereikende naleving van hetgeen bij of krachtens
      enig wettelijk voorschrift is voorgeschreven of handelen in strijd met de maatschappelijke betamelijkheid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel37
  - number: 3:7.2
    text: |-
      Een financiële onderneming legt schriftelijk haar beleid vast met betrekking tot het bepaalde in het eerste lid
      en stelt alle bedrijfsonderdelen in kennis van dit beleid en de procedures en de maatregelen bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel37
  - number: 3:8.1
    text: |-
      Een financiële onderneming wijst ten minste één functionaris op managementniveau aan die op onafhankelijke en
      effectieve wijze de naleving controleert van de wettelijke voorschriften en interne regels met betrekking tot de
      integere uitoefening van het bedrijf en de regels bedoeld in [artikel 3:15, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3:8.2
    text: |-
      De financiële onderneming draagt er zorg voor dat de functionaris, bedoeld in het eerste lid, binnen korte tijd kan
      beschikken over transactiegegevens, alsmede over gegevens die de financiële onderneming heeft vastgelegd ingevolge
      dit hoofdstuk of de [Wet ter voorkoming van witwassen en financieren van terrorisme BES][ref1], en andere voor zijn
      taak relevante gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0030824
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0030824
  - number: 3:8.3
    text: |-
      Een financiële onderneming beschikt over procedures die erin voorzien dat gesignaleerde tekortkomingen of gebreken
      worden gerapporteerd aan de functionaris.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel38
  - number: 3:8.4
    text: |-
      Een financiële onderneming beoordeelt periodiek de interne controlesystemen op hun effectiviteit en
      actualiteitswaarde en stelt deze zo nodig bij.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel38
  - number: 3:8.5
    text: |-
      Een financiële onderneming waarborgt dat kennis die wordt opgedaan bij de uitvoering van het eerste tot en met
      derde lid, en de resultaten van maatregelen genomen naar aanleiding van de controle, bedoeld in het eerste lid,
      binnen haar organisatie beschikbaar blijven.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel38
  - number: 3:9.1
    text: |-
      Een financiële onderneming beschikt met het oog op een integere uitoefening van het bedrijf over procedures en
      maatregelen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel39
  - number: 3:9.1.a
    text: de acceptatie van cliënten;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel39
  - number: 3:9.1.b
    text: risicoclassificaties ten aanzien van cliënten, producten en diensten;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel39
  - number: 3:9.1.c
    text: |-
      de analyse van gegevens van cliënten, mede in relatie tot de door die cliënten afgenomen producten of diensten, en
      de detectie van afwijkende transactiepatronen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel39
  - number: 3:9.2
    text: |-
      Aan de hand van de procedures en maatregelen, bedoeld in het eerste lid, bepaalt de financiële onderneming tevens
      de risico’s van bepaalde cliënten, producten of diensten voor de integere uitoefening van haar bedrijf.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel39
  - number: 3:9.3
    text: |-
      Een financiële onderneming draagt zorg voor de documentatie en vastlegging met betrekking tot de acceptatie en
      indeling naar risico van cliënten en de bewaking van het handelen van cliënten. Dergelijke gegevens worden bewaard
      tot vijf jaar na de dienstverlening dan wel het beëindigen van de relatie met de desbetreffende cliënt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel39
  - number: 3:10.1
    text: |-
      De Nederlandsche Bank kan regels stellen met het oog op het door financiële ondernemingen voorkomen van misbruik
      van technische toepassingen voor witwassen of financiering van terrorisme.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel310
  - number: 3:10.2
    text: |-
      De Nederlandsche Bank kan voorts met het oog op een integere uitoefening van het bedrijf regels stellen met
      betrekking tot het door kredietinstellingen te voeren beleid inzake afgeschermde rekeningen en rekeningen waarop
      waarden worden aangehouden ten behoeve van derden.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel310
  - number: 3:11
    text: |-
      De Nederlandsche Bank kan regels stellen met betrekking tot kredietinstrumenten waarbij de kredietnemer geld of
      financiële instrumenten ter beschikking krijgt, waartegenover de kredietverstrekker een zekerheid ontvangt, direct
      of indirect, uit eigen liquide middelen van de kredietnemer.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel311
  - number: 3:12.1
    text: |-
      Een kredietinstelling, verzekeraar of geldtransactiekantoor onderzoekt op verzoek van de Nederlandsche Bank,
      nadat deze door Onze Minister is geïnformeerd over bepaalde personen of instellingen die naar het oordeel van
      Onze Minister in verband met vermoede terroristische activiteiten of daarmee verband houdende activiteiten de
      integriteit van de financiële sector kunnen schaden, of zulke personen of instellingen in haar onderscheidenlijk
      zijn administratie voorkomen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel312
  - number: 3:12.2
    text: |-
      De financiële onderneming verstrekt de uitkomst van het in het eerste lid bedoelde onderzoek, binnen een door de
      Nederlandsche Bank te stellen termijn, aan de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel312
  - number: 3:13.1
    text: 'Een financiële onderneming beschikt over procedures en maatregelen ter naleving van:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel313
  - number: 3:13.1.a
    text: |-
      de bij of krachtens de [Sanctiewet 1977][ref1] met betrekking tot het financieel verkeer gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0003296
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel313
    references:
      - id: ref1
        bwb_id: BWBR0003296
  - number: 3:13.1.b
    text: |-
      de bij of krachtens de [Wet ter voorkoming van witwassen en financieren van terrorisme BES][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0030824
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel313
    references:
      - id: ref1
        bwb_id: BWBR0030824
  - number: 3:13.2
    text: |-
      De maatregelen, bedoeld in het eerste lid, onderdeel a, hebben ten minste betrekking op een adequate controle
      van de administratie van de financiële onderneming op het overeenkomen van de identiteit van een relatie met
      een persoon of entiteit, als bedoeld in de bij of krachtens de [Sanctiewet 1977][ref1] met betrekking tot het
      financieel verkeer gestelde regels, met het oog op het bevriezen van de financiële middelen van die relatie of het
      voorkomen van het ter beschikking stellen van financiële middelen of diensten aan die relatie.


      [ref1]: https://wetten.overheid.nl/BWBR0003296
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel313
    references:
      - id: ref1
        bwb_id: BWBR0003296
  - number: 3:13.3
    text: |-
      Voor de toepassing van het tweede lid wordt verstaan onder relatie: een ieder die betrokken is bij een financiële
      dienst of een financiële transactie.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel313
  - number: 3:14.1
    text: |-
      Een financiële onderneming beschikt over procedures en maatregelen met betrekking tot de omgang met en de
      vastlegging van incidenten. Die procedures en maatregelen voorzien in elk geval in een degelijke administratieve
      vastlegging van:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel314
  - number: 3:14.1.a
    text: de kenmerken van het incident;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel314
  - number: 3:14.1.b
    text: gegevens over de personen die het incident hebben bewerkstelligd;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel314
  - number: 3:14.1.c
    text: de naar aanleiding van het incident genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel314
  - number: 3:14.2
    text: |-
      De financiële onderneming neemt naar aanleiding van een incident maatregelen die zijn gericht op het beheersen van
      de opgetreden risico’s en het voorkomen van herhaling.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel314
  - number: 3:14.3
    text: De financiële onderneming informeert de toezichtautoriteit onverwijld schriftelijk omtrent incidenten.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel314
  - number: 3:14.4
    text: |-
      Voor de toepassing van dit artikel wordt verstaand onder incident: gedraging of gebeurtenis die een ernstig gevaar
      vormt voor de integere uitoefening van het bedrijf van de desbetreffende financiële onderneming.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel314
  - number: 3:15.1
    text: |-
      Een financiële onderneming beschikt over procedures en maatregelen met betrekking tot het tegengaan van
      verstrengeling van haar belangen of die van haar cliënten met privé-belangen van:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel315
  - number: 3:15.1.a
    text: personen die het beleid van de financiële onderneming bepalen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel315
  - number: 3:15.1.b
    text: personen die het beleid bepalen van de groep waartoe de financiële onderneming behoort;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel315
  - number: 3:15.1.c
    text: |-
      leden van het orgaan dat is belast met het toezicht op het beleid en de algemene gang van zaken van de financiële
      onderneming;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel315
  - number: 3:15.1.d
    text: andere werknemers of andere personen die in haar opdracht op structurele basis werkzaamheden voor haar verrichten.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel315
  - number: 3:15.2
    text: |-
      De toezichtautoriteit kan ter voorkoming van belangenverstrengeling regels stellen met betrekking tot het verlenen
      van financiële diensten op basis van personeelscondities aan personen die het beleid van de financiële onderneming
      bepalen en groepsbestuurders.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel315
  - number: 3:16.1
    text: |-
      Een financiële onderneming houdt een overzicht bij van de integriteitsgevoelige functies in haar onderneming en van
      de taken, bevoegdheden en verantwoordelijkheden behorende bij elk van die functies.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel316
  - number: 3:16.2
    text: |-
      Een financiële onderneming beschikt over procedures en maatregelen die waarborgen dat integriteitsgevoelige
      functies slechts worden bekleed door personen waarvan zij een onderbouwde beoordeling van de betrouwbaarheid heeft
      gemaakt en voortdurend blijft maken.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel316
  - number: 3:16.3
    text: |-
      De werkzaamheden die zijn verricht ten behoeve van de naleving van het eerste en tweede lid en de uitkomsten van
      die werkzaamheden worden door de financiële onderneming schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel316
  - number: 3:16.4
    text: |-
      De toezichtautoriteit kan categorieën functies aanwijzen die voor de toepassing van dit artikel in ieder geval
      kwalificeren als integriteitsgevoelig, en nadere regels stellen met betrekking tot de wijze waarop een financiële
      onderneming de betrouwbaarheid beoordeelt van personen als bedoeld in het tweede lid en de vastlegging van gegevens
      ingevolge het derde lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel316
  - number: 3:17.1
    text: |-
      Omtrent een persoon van wie zij de betrouwbaarheid heeft beoordeeld ingevolge [artikel 3:16][ref1], verstrekt een
      financiële onderneming desgevraagd schriftelijk inlichtingen aan een andere financiële onderneming ten behoeve van
      de beoordeling door die andere financiële onderneming van die persoon ingevolge artikel 3:16, voor zover nodig om
      over de betrouwbaarheid een juist en zo volledig mogelijk beeld te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel317
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3:17.2
    text: |-
      Een financiële onderneming onthoudt zich van handelingen waarvan zij weet of redelijkerwijs moet vermoeden dat deze
      een onjuist beeld kunnen doen ontstaan van een persoon als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel317
  - number: 3:17.3
    text: |-
      De toezichtautoriteit kan regels stellen met betrekking tot de wijze waarop een financiële onderneming voldoet aan
      het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel317
  - number: 3:18.1
    text: |-
      Een trustkantoor houdt op een overzichtelijke wijze ten minste de bij regeling van Onze Minister aan te wijzen
      bescheiden en gegevens voor de toezichtautoriteit beschikbaar.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel318
  - number: 3:18.2
    text: |-
      De bescheiden en gegevens, bedoeld in het eerste lid, staan onmiddellijk ter beschikking van de toezichtautoriteit,
      indien deze daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel318
  - number: 3:19.1
    text: 'De bedrijfsvoering van een financiële onderneming of een bewaarder omvat:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel319
  - number: 3:19.1.a
    text: een duidelijke en adequate organisatiestructuur;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel319
  - number: 3:19.1.b
    text: een duidelijke en adequate verdeling van taken, bevoegdheden en verantwoordelijkheden;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel319
  - number: 3:19.1.c
    text: eenduidige rapportagelijnen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel319
  - number: 3:19.1.d
    text: een adequaat systeem van informatievoorziening en communicatie;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel319
  - number: 3:19.1.e
    text: een adequaat systeem van interne controle.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel319
  - number: 3:19.2
    text: |-
      De bedrijfsvoering, bedoeld in het eerste lid, is afgestemd op de aard, omvang, risico’s en complexiteit van de
      werkzaamheden van de financiële onderneming of de bewaarder en wordt op inzichtelijke wijze vastgelegd.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel319
  - number: 3:19.3
    text: |-
      Een beheerder richt voor iedere beleggingsinstelling die hij beheert afzonderlijk een bedrijfsvoering als bedoeld
      in het eerste lid in.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel319
  - number: 3:20.1
    text: |-
      Een bemiddelaar in effecten of vermogensbeheerder beschikt over procedures en maatregelen voor het voorkomen van en
      omgaan met belangenconflicten tussen zijn onderneming en zijn cliënten of tussen zijn cliënten onderling.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel320
  - number: 3:20.2
    text: De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel320
  - number: 3:21.1
    text: |-
      Een bemiddelaar in effecten, elektronischgeldinstelling, kredietinstelling, vermogensbeheerder of verzekeraar voert
      beleid gericht op het beheersen van relevante financiële risico’s.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel321
  - number: 3:21.2
    text: |-
      Het beleid, bedoeld in het eerste lid, wordt vastgelegd in procedures en maatregelen ter beheersing van relevante
      financiële risico’s en geïntegreerd in de bedrijfsprocessen. Een financiële onderneming als bedoeld in het eerste
      lid ziet er op systematische wijze op toe dat de procedures en maatregelen uit de eerste volzin worden nageleefd en
      zorgt ervoor dat gesignaleerde tekortkomingen of gebreken worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel321
  - number: 3:21.3
    text: |-
      Een kredietinstelling of verzekeraar heeft een onafhankelijke risicobeheerfunctie die op systematische wijze een
      onafhankelijke risicobeheer uitvoert dat gericht is op het identificeren, meten en evalueren van de financiële
      risico’s waaraan de kredietinstelling of verzekeraar kan worden blootgesteld.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel321
  - number: 3:21.4
    text: |-
      Een financiële onderneming met zetel in het buitenland, die in de staat van zetel onder prudentieel toezicht staat,
      wordt vermoed te voldoen aan de in het eerste tot en met derde lid gestelde eisen, zolang zij in de staat van zetel
      is toegelaten tot de uitoefening van haar bedrijf.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel321
  - number: 3:22
    text: |-
      Een beheerder of bewaarder met zetel in een openbaar lichaam, beschikt over procedures en maatregelen die
      waarborgen dat de omvang en samenstelling van en mutaties in de aan te houden financiële waarborgen getrouw en
      volledig kunnen worden vastgesteld. [Artikel 3:21, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel322
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3:23.1
    text: |-
      Een financiëledienstverlener als bedoeld in [artikel 5:1 van de wet][ref1] bewaart, indien hij een consument of
      cliënt adviseert, de informatie die hij overeenkomstig [artikel 5:7 van de wet][ref2] heeft ingewonnen, alsmede de
      gegevens betreffende het financiële product, de financiële dienst of de effecten, gedurende ten minste één jaar,
      gerekend vanaf het moment van advisering.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel323
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 3:23.2
    text: |-
      Ten aanzien van financiëledienstverleners, niet zijnde adviseurs, is het eerste lid niet van toepassing, indien de
      advisering niet leidt tot het aangaan van verplichtingen door de consument onderscheidenlijk de cliënt inzake het
      aanbevolen financieel product, de aanbevolen financiële dienst of de aanbevolen effecten.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel323
  - number: 3:23.3
    text: |-
      Indien een consument of cliënt met of door bemiddeling van een financiëledienstverlener een overeenkomst aangaat
      waarvan de inhoud afwijkt van het advies van die financiëledienstverlener, is die financiëledienstverlener
      gedurende ten minste één jaar nadien in staat aan de Autoriteit Financiële Markten aan te tonen dat de
      consument, onderscheidenlijk de cliënt, in weerwil van het advies de keuze heeft gemaakt voor het aangaan van die
      overeenkomst.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel323
  - number: 3:24
    text: |-
      Een kredietaanbieder bewaart de informatie die hij ingevolge [artikel 5:14, tweede lid, van de wet][ref1]
      heeft ingewonnen, alsmede de op schrift gestelde door hem aangeboden overeenkomst inzake krediet, indien die
      overeenkomst tot stand is gekomen, gedurende ten minste vijf jaren, gerekend vanaf de dag waarop die overeenkomst
      is afgewikkeld.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel324
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 3:25.1
    text: |-
      Een bemiddelaar in effecten of een vermogensbeheerder bewaart de overeenkomsten met cliënten alsmede door de
      toezichtautoriteit aangewezen gegevens over alle door hem verleende diensten. Hij bewaart die overeenkomsten en
      gegevens gedurende ten minste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel325
  - number: 3:25.2
    text: |-
      Een vermogensbeheerder bewaart de ingevolge [artikel 5:8 van de wet][ref1] ingewonnen informatie gedurende ten
      minste vijf jaren na de beëindiging van het beheer van het vermogen van de cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel325
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 3:26
    text: |-
      De toezichtautoriteit kan nadere regels stellen met betrekking tot de [artikelen 3:19 tot en met 3:25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel326
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3:27.1
    text: |-
      Werknemers en andere natuurlijke personen die zich onder verantwoordelijkheid van een financiële onderneming
      rechtstreeks bezighouden met het aanbieden van financiële producten of het verlenen van financiële diensten,
      beschikken over voldoende door een financiële onderneming of derde verzorgde relevante opleiding of daaraan gelijk
      te stellen ervaring.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel327
  - number: 3:27.2
    text: |-
      De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot de vereiste opleiding of ervaring,
      en op welke wijzen die ervaring kan worden aangetoond. Daarbij kan onderscheid worden gemaakt naar de mate van
      zelfstandigheid van het optreden van categorieën personen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel327
  - number: 3:28
    text: |-
      Onze Minister kan exameninstituten erkennen die bevoegd zijn tot het afgeven van diploma’s waarmee de
      vakbekwaamheid, bedoeld in [artikel 3:27, eerste lid][ref1], wordt aangetoond. Daarbij kan onderscheid worden
      gemaakt tussen categorieën financiële ondernemingen. Een aanwijzing wordt gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel328
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3:29
    text: |-
      Een bemiddelaar in schadeverzekeringen of levensverzekeringen draagt er zorg voor dat degenen die de
      feitelijke leiding hebben over een vestiging van zijn bedrijf, allen beschikken over een diploma dat ingevolge
      [artikel 3:4][ref1] is aangewezen voor de bemiddeling in schadeverzekeringen onderscheidenlijk levensverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:30.1
    text: |-
      Een financiële onderneming die financiële producten aanbiedt of financiële diensten verleent beschikt met het
      oog op een adequate behandeling van klachten van cliënten of consumenten over die producten of diensten over een
      behoorlijke administratie van die klachten, waarin ten minste worden vastgelegd:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel330
  - number: 3:30.1.a
    text: de naam en het adres van de klager;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel330
  - number: 3:30.1.b
    text: de klacht, met de daarbij behorende dagtekening van ontvangst;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel330
  - number: 3:30.1.c
    text: een omschrijving van de klacht;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel330
  - number: 3:30.1.d
    text: een beschrijving van de wijze waarop de financiële onderneming de klacht heeft behandeld.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel330
  - number: 3:30.2
    text: |-
      Een financiële onderneming bewaart de in het eerste lid bedoelde gegevens gedurende ten minste een jaar nadat de
      klacht door haar is afgehandeld.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel330
  - number: 3:31
    text: |-
      In deze paragraaf wordt onder uitbesteden verstaan: het door een financiële onderneming verlenen van een opdracht
      aan een derde tot het ten behoeve van die financiële onderneming verrichten van werkzaamheden:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel331
  - number: 3:31.a
    text: |-
      die deel uitmaken van of voortvloeien uit het uitoefenen van haar bedrijf of het aanbieden van financiële producten
      dan wel verlenen van financiële diensten;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel331
  - number: 3:31.b
    text: die deel uitmaken van de wezenlijke bedrijfsprocessen ter ondersteuning daarvan.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel331
  - number: 3:32.1
    text: |-
      Een financiële onderneming gaat niet over tot het uitbesteden van werkzaamheden indien dat een belemmering vormt
      voor een adequaat toezicht op de naleving van de bij of krachtens de wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel332
  - number: 3:32.2
    text: |-
      Een financiële onderneming besteedt de taken en werkzaamheden van personen die het dagelijks beleid bepalen,
      daaronder mede verstaan het vaststellen van het beleid en het afleggen van verantwoording over het gevoerde beleid,
      niet uit.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel332
  - number: 3:33.1
    text: |-
      Een financiële onderneming die werkzaamheden uitbesteedt aan een derde, draagt er zorg voor dat de derde de
      uitbestede werkzaamheden op adequate wijze uitvoert, de uitvoering afdoende controleert en de daaraan verbonden
      risico’s op adequate wijze beheerst. Zij legt de overeenkomst met de derde waaraan de werkzaamheden op structurele
      basis worden uitbesteed schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel333
  - number: 3:33.2
    text: De toezichtautoriteit kan nadere regels stellen met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel333
  - number: 3:34.1
    text: Een beheerder besteedt het bepalen van het beleggingsbeleid van een beleggingsinstelling niet uit.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel334
  - number: 3:34.2
    text: |-
      De [artikelen 3:32][ref1] en [3:33][ref2] zijn van overeenkomstige toepassing op een beheerder of bewaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel334
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 4:1.1
    text: |-
      Dit [paragrafen 2 tot en met 5][ref1] zijn niet van toepassing op financiële ondernemingen, beheerders en
      bewaarders met zetel in het buitenland die in de staat van zetel onder prudentieel toezicht staan.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0031636
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:1.2
    text: |-
      Een financiële onderneming, beheerder of bewaarder als bedoeld in het eerste lid voldoet aan de in de staat
      van zetel op haar van toepassing zijnde eisen met betrekking tot eigen vermogen, solvabiliteit, liquiditeit en
      technische voorzieningen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel41
  - number: 4:2.1
    text: 'Het minimumbedrag aan eigen vermogen bedraagt:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel42
  - number: 4:2.1.a
    text: |-
      voor een kredietinstelling, niet zijnde een kredietinstelling als bedoeld in de onderdelen b tot en met d: USD
      2.750.000;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel42
  - number: 4:2.1.b
    text: 'voor een kredietinstelling die voornamelijk is gespecialiseerd in het verstrekken van hypotheken: USD 1.650.000;'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel42
  - number: 4:2.1.c
    text: 'voor een kredietinstelling die voornamelijk zijn fondsen aantrekt bij wijze van spaardeposito’s: USD 558.000;'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel42
  - number: 4:2.1.d
    text: 'voor een kredietvereniging: USD 25.000.'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel42
  - number: 4:2.2
    text: |-
      Het minimumbedrag aan eigen vermogen van een kredietinstelling wordt gevormd door de waarde van de
      vermogensbestanddelen, bedoeld in [artikel 4:5, tweede lid][ref1]. Deze vermogensbestanddelen, alsmede de waarden
      die tegenover die vermogensbestanddelen staan, staan onmiddellijk en zonder beperkingen ter beschikking van de
      kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:3.1
    text: |-
      De solvabiliteit, bedoeld in [artikel 3:17, eerste lid, van de wet][ref1], is voldoende, indien het in aanmerking
      te nemen toetsingsvermogen, bedoeld in [artikel 4:4, eerste lid][ref2], ten minste gelijk is aan de minimumomvang
      van het toetsingsvermogen berekend overeenkomstig de [artikelen 4:8 tot en met 4:18][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:3.2
    text: |-
      De solvabiliteit van een kredietvereniging is voldoende, indien het in aanmerking te nemen toetsingsvermogen,
      bedoeld in [artikel 4:4, tweede lid][ref1], ten minste gelijk is aan vijf procent van de totale activa, met
      uitzondering van de liquide middelen en de vaste activa, van de kredietvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:3.3
    text: |-
      Onverminderd het eerste en tweede lid is de solvabiliteit van een kredietinstelling ten minste gelijk aan het in
      [artikel 4:2, eerste lid][ref1], voorgeschreven minimumbedrag aan eigen vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:4.1
    text: |-
      Het toetsingsvermogen van een kredietinstelling, niet zijnde een kredietvereniging, wordt gevormd door de som van
      het in aanmerking te nemen kernkapitaal en aanvullend kapitaal, met inachtneming van [artikel 4:7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:4.2
    text: |-
      Het toetsingsvermogen van een kredietvereniging wordt gevormd door de som van de ingehouden winsten, overige
      reserves en algemene voorzieningen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel44
  - number: 4:4.3
    text: De Nederlandsche Bank kan nadere regels stellen met betrekking tot het tweede lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel44
  - number: 4:5.1
    text: |-
      Het kernkapitaal wordt gevormd door de waarde van de vermogensbestanddelen, bedoeld in het tweede lid, verminderd
      met de waarde van de posten bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.2
    text: 'De voor de bepaling van het kernkapitaal in aanmerking te nemen vermogensbestanddelen zijn:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.2.a
    text: het geplaatste en volgestorte aandelenkapitaal;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.2.b
    text: agioreserve;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.2.c
    text: overige reserves;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.2.d
    text: ingehouden winst;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.2.e
    text: minderheidsbelangen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.2.f
    text: voorzieningen ter dekking van algemene risico’s;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.2.g
    text: andere door de Nederlandsche Bank toegestane vermogensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.3
    text: 'De voor de bepaling van het kernkapitaal in aanmerking te nemen posten zijn:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.3.a
    text: immateriële activa;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.3.b
    text: goodwill;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.3.c
    text: niet erkende latente belastingvorderingen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.3.d
    text: 'vijftig procent van de waarde van de volgende deelnemingen:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.3.d.1°
    text: |-
      significante minderheidsdeelnemingen in kredietinstellingen en andere financiële ondernemingen, niet zijnde
      verzekeraars;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.3.d.2°
    text: |-
      wederzijdse deelnemingen in andere kredietinstellingen die een geflatteerd beeld beogen te geven van de
      vermogenspositie;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.3.d.3°
    text: deelnemingen in verzekeraars;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.3.d.4°
    text: deelnemingen in overige ondernemingen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:5.4
    text: |-
      De Nederlandsche Bank kan nadere regels stellen met betrekking tot de berekening van de in het tweede en derde lid
      genoemde vermogensbestanddelen en posten.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel45
  - number: 4:6.1
    text: 'Het aanvullend kapitaal wordt gevormd door de waarde van:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel46
  - number: 4:6.1.a
    text: herwaarderingsreserves;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel46
  - number: 4:6.1.b
    text: wettelijke reserves;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel46
  - number: 4:6.1.c
    text: achtergestelde schuldinstrumenten en preferente aandelen met vaste looptijd.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel46
  - number: 4:6.2
    text: |-
      Het in aanmerking te nemen aanvullend kapitaal bedraagt de som van de in het eerste lid
      bedoelde vermogensbestanddelen, verminderd met vijftig procent van de waarde van de in
      [artikel 4:5, derde lid, onderdeel d][ref1], bedoelde deelnemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:6.3
    text: |-
      De Nederlandsche Bank kan nadere regels stellen met betrekking tot de berekening van de in het eerste lid genoemde
      waarden.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel46
  - number: 4:7
    text: |-
      Voor de toepassing van de [artikelen 4:5][ref1] en [4:6][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:7.a
    text: wordt het kernkapitaal volledig in aanmerking genomen voor de berekening van het toetsingsvermogen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel47
  - number: 4:7.b
    text: |-
      wordt het aanvullend kapitaal voor de berekening van het toetsingsvermogen slechts in aanmerking genomen, voor
      zover het niet meer bedraagt dan het kernkapitaal;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel47
  - number: 4:7.c
    text: |-
      worden de achtergestelde schuldinstrumenten en preferente aandelen met vaste looptijd tot een maximum van vijftig
      procent van het kernkapitaal in aanmerking genomen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel47
  - number: 4:7.d
    text: wordt per post rekening gehouden met het voorzienbare bedrag van de daarover verschuldigde belastingen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel47
  - number: 4:8
    text: 'De minimumomvang van het toetsingsvermogen van een kredietinstelling is gelijk aan de som van:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel48
  - number: 4:8.a
    text: |-
      acht procent van de som van de ingevolge [artikel 4:9][ref1] of [4:11][ref2] te berekenen bedragen van de naar
      risico gewogen activa en posten buiten de balanstelling voor de kredietrisico’s;


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:8.b
    text: |-
      het ingevolge [artikel 4:14][ref1] te berekenen bedrag voor het marktrisico;


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:8.c
    text: |-
      het ingevolge de [artikelen 4:15 tot en met 4:18][ref1] te berekenen bedrag voor het operationeel risico.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:9.1
    text: |-
      Het bedrag van een naar risico gewogen actief of post als bedoeld in [artikel 4:8, onderdeel a][ref1], is gelijk
      aan zijn vorderingswaarde, vermenigvuldigd met het ingevolge het tweede lid, onderdeel a, aan het actief of de post
      buiten de balanstelling toegekende risicogewicht.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:9.2
    text: 'De Nederlandsche Bank stelt regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel49
  - number: 4:9.2.a
    text: |-
      de indeling van de activa en posten buiten de balansteling in categorieën naar gelang de wederpartij en de aan die
      categorieën toe te kennen risicogewichten met inachtneming van [artikel 4:10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:9.2.b
    text: de berekening van de vorderingswaarde van een actief of post buiten de balansteling.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel49
  - number: 4:10.1
    text: |-
      Bij de toekenning van een risicogewicht aan een categorie activa of posten buiten de balanstelling kan een
      kredietinstelling een kredietbeoordeling van een ingevolge [artikel 4:13][ref1] door de Nederlandsche Bank erkend
      kredietbeoordelingbureau op een consistente wijze gebruiken. Onder een kredietbeoordeling wordt verstaan de taxatie
      van de kans op wanbetaling en de mate van wanbetaling door een bepaalde debiteur op al zijn verplichtingen of een
      deel van zijn verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel410
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:10.2
    text: |-
      De Nederlandsche Bank stelt nadere regels met betrekking tot het gebruik van een kredietbeoordeling als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel410
  - number: 4:10.3
    text: Een kredietinstelling gebruikt slechts gevraagde kredietbeoordelingen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel410
  - number: 4:10.4
    text: |-
      De Nederlandsche Bank kan, in afwijking van het derde lid, op verzoek van de kredietinstelling toestemming verlenen
      om ongevraagde kredietbeoordelingen te gebruiken.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel410
  - number: 4:11.1
    text: |-
      De Nederlandsche Bank kan een kredietinstelling op verzoek toestemming verlenen om de bedragen van haar naar
      risico gewogen activa of posten buiten de balanstelling in afwijking van [artikel 4:9][ref1] te berekenen volgens
      een interne modellenmethode, waarbij gebruik wordt gemaakt van eigen ramingen van de kans dat een wederpartij
      over een periode van een jaar in gebreke blijft, en van de verhouding tussen het verwachte economisch verlies op
      een vordering als gevolg van wanbetaling, met inachtneming van de tijdwaarde van geld, en het naar verwachting
      uitstaande bedrag bij wanbetaling.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel411
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:11.2
    text: |-
      De gehanteerde interne modellen voor het beheer en de beoordeling van kredietrisico’s worden zorgvuldig toegepast.
      De Nederlandsche Bank kan regels stellen met betrekking tot deze interne modellen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel411
  - number: 4:12.1
    text: |-
      Een kredietinstelling kan kredietrisicovermindering in aanmerking nemen, mits zij gebruik maakt van een door de
      Nederlandsche Bank toegestane techniek ter beperking van het kredietrisico dat verbonden is aan de activa en posten
      buiten de balanstelling, en zij voldoet aan de in voorkomend geval ingevolge het tweede lid gestelde regels.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel412
  - number: 4:12.2
    text: |-
      De Nederlandsche Bank kan nadere regels stellen met betrekking tot de voorwaarden waaronder onder het
      eerste lid genoemde technieken van kredietrisicovermindering toelaatbaar zijn, en de beperking van de aan
      kredietrisicovermindering verbonden risico’s.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel412
  - number: 4:13.1
    text: |-
      De Nederlandsche Bank erkent op aanvraag, al dan niet voor bepaalde tijd, een kredietbeoordelingbureau, indien het
      voldoet aan door de Nederlandsche Bank gestelde criteria.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel413
  - number: 4:13.2
    text: |-
      De Nederlandsche Bank kan een procedure vaststellen voor de erkenning, bedoeld in het eerste lid, en maakt deze
      bekend.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel413
  - number: 4:13.3
    text: |-
      Indien een kredietbeoordelingbureau niet meer voldoet aan de criteria, bedoeld in het eerste lid, kan de
      Nederlandsche Bank de erkenning intrekken.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel413
  - number: 4:14.1
    text: |-
      Een kredietinstelling berekent het bedrag van de vereiste solvabiliteit voor het marktrisico, bedoeld in
      [artikel 4:8, onderdeel b][ref1], conform de door de Nederlandsche Bank gestelde regels. De Nederlandsche Bank
      stelt regels met betrekking tot de berekening van de omvang van het marktrisico ten opzichte van het totale bedrijf
      en de grondslagen van die berekening.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:14.2
    text: |-
      Het is een kredietinstelling toegestaan het bedrag van de vereiste solvabiliteit voor het marktrisico te berekenen
      overeenkomstig de in [artikel 4:9][ref1] gestelde regels, indien het totale solvabiliteitsvereiste voor het
      marktrisico niet meer bedraagt dan vijf procent van het laatst berekende toetsingsvermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:14.3
    text: |-
      Een kredietinstelling die het tweede lid toepast, geeft hiervan kennis aan de Nederlandsche Bank met een door deze
      na overleg met de kredietinstelling te bepalen frequentie. Een overschrijding van de limiet, bedoeld in het tweede
      lid, meldt de kredietinstelling onverwijld aan de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel414
  - number: 4:15.1
    text: |-
      Een kredietinstelling maakt gebruik van de basisindicatorbenadering voor de berekening van het bedrag van de
      met betrekking tot het totale bedrijf vereiste solvabiliteit ter dekking van het operationeel risico, bedoeld in
      [artikel 4:8, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel415
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:15.2
    text: |-
      De Nederlandsche Bank stelt regels met betrekking tot de basisindicatorbenadering en de berekening van de vereiste
      solvabiliteit ter dekking van het operationeel risico volgens die benadering.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel415
  - number: 4:16.1
    text: |-
      In afwijking van [artikel 4:15][ref1] kan een kredietinstelling gebruik maken van de standaardbenadering voor
      de berekening van het bedrag van de vereiste solvabiliteit ter dekking van het operationeel risico, bedoeld in
      [artikel 4:8, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel416
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:16.2
    text: |-
      De Nederlandsche Bank kan nadere regels stellen met betrekking tot de voorwaarden waaronder toepassing van de
      standaardbenadering is toegestaan en met betrekking tot de berekening van de vereiste solvabiliteit ter dekking van
      het operationeel risico volgens die benadering.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel416
  - number: 4:17.1
    text: |-
      De Nederlandsche Bank kan een kredietinstelling op verzoek toestemming verlenen om gebruik te maken van een
      alternatieve standaardbenadering voor de berekening van de vereiste solvabiliteit ter dekking van het operationeel
      risico.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel417
  - number: 4:17.2
    text: |-
      De Nederlandsche Bank kan nadere regels stellen met betrekking tot de voorwaarden waaronder toepassing van de
      alternatieve standaardbenadering is toegestaan en met betrekking tot de berekening van de vereiste solvabiliteit
      ter dekking van het operationeel risico volgens die benadering.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel417
  - number: 4:18.1
    text: |-
      Het is een kredietinstelling die eenmaal de standaardbenadering, bedoeld in [artikel 4:16][ref1] gebruikt, niet
      toegestaan daarna alsnog de basisindicatorbenadering te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel418
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:18.2
    text: |-
      De Nederlandsche Bank kan een kredietinstelling op verzoek toestemming verlenen om de standaardbenadering in
      combinatie met de basisindicatorbenadering toe te passen, indien de kredietinstelling de standaardbenadering
      implementeert overeenkomstig een met de Nederlandsche Bank overeengekomen tijdschema.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel418
  - number: 4:19.1
    text: |-
      De waarde van de balansposten en posten buiten de balanstelling, bedoeld in
      [artikel 3:17, vijfde lid, van de wet][ref1] bedraagt voor een kredietinstelling ten aanzien van een wederpartij of
      groep van verbonden wederpartijen niet meer dan vijfentwintig procent van haar toetsingsvermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel419
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 4:19.2
    text: |-
      De totale waarde van de grote posities van een kredietinstelling bedraagt niet meer dan zeshonderd procent van
      haar toetsingsvermogen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel419
  - number: 4:19.3
    text: |-
      Het eerste lid is niet van toepassing op actiefposten in de vorm van schatkistpapier van de federale overheid van
      de Verenigde Staten van Amerika met een looptijd van minder dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel419
  - number: 4:19.4
    text: |-
      De Nederlandsche Bank kan, op verzoek, besluiten dat het een kredietinstelling voor een beperkte duur is toegestaan
      het in het eerste of tweede lid bedoelde percentage te overschrijden. De Nederlandsche Bank stelt regels met
      betrekking tot de voorwaarden waaronder zij een overschrijding toestaat.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel419
  - number: 4:20.1
    text: |-
      Het minimumbedrag aan eigen vermogen, bedoeld in [artikel 3:16, eerste lid, van de wet][ref1], bedraagt voor een
      beleggingsmaatschappij USD 279.000.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel420
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 4:20.2
    text: |-
      Het minimumbedrag aan eigen vermogen van een beleggingsmaatschappij wordt gevormd door de waarde van de
      vermogensbestanddelen, bedoeld in [artikel 4:5, tweede lid][ref1]. Deze vermogensbestanddelen, alsmede de waarden
      die tegenover die vermogensbestanddelen staan, staan onmiddellijk en zonder beperkingen ter beschikking van de
      beleggingsmaatschappij. Artikel 4:5, vierde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel420
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:21.1
    text: Het minimumbedrag aan eigen vermogen bedraagt voor een bemiddelaar in effecten of vermogensbeheerder USD 25.000.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel421
  - number: 4:21.2
    text: |-
      Het eerste lid is niet van toepassing op een bemiddelaar in effecten die uitsluitend orders van cliënten
      ontvangt en doorgeeft, mits die bemiddelaar beschikt over een beroepsaansprakelijkheidsverzekering die zijn
      aansprakelijkheid dekt wegens fouten, verzuimen of nalatigheden begaan in de uitoefening van zijn bedrijf.
      [Artikel 4:47, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel421
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '7'
  - number: 4:21.3
    text: |-
      Het minimumbedrag aan eigen vermogen van een bemiddelaar in effecten of een vermogensbeheerder wordt gevormd door
      de waarde van de volgende vermogensbestanddelen:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel421
  - number: 4:21.3.a
    text: |-
      voor een naamloze of besloten vennootschap: het geplaatste en volgestorte aandelenkapitaal, met uitsluiting van
      cumulatief preferente aandelen en van preferente aandelen met een vaste looptijd;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel421
  - number: 4:21.3.b
    text: 'voor een vennootschap onder firma: de afgezonderde gestorte vermogensbestanddelen van de beherende vennoten;'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel421
  - number: 4:21.3.c
    text: |-
      voor een commanditaire vennootschap: de afgezonderde gestorte vermogensbestanddelen van de beherende vennoten
      alsmede het gestorte commanditaire kapitaal;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel421
  - number: 4:21.3.d
    text: 'voor een coöperatie: het door de leden gestorte of ingelegde kapitaal;'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel421
  - number: 4:21.3.e
    text: |-
      voor een onderneming die een andere rechtsvorm heeft dan de hierboven genoemde: het voordelige verschil tussen
      bezittingen en schulden;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel421
  - number: 4:21.3.f
    text: andere door de Nederlandsche Bank toegestane vermogensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel421
  - number: 4:21.4
    text: |-
      De in het derde lid genoemde vermogensbestanddelen, alsmede de waarden die tegenover die vermogensbestanddelen
      staan, staan onmiddellijk en zonder beperkingen ter beschikking van de bemiddelaar in effecten of
      vermogensbeheerder. Per afzonderlijke post wordt rekening gehouden met het voorzienbare bedrag van de daarover
      verschuldigde belastingen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel421
  - number: 4:21.5
    text: |-
      De Nederlandsche Bank kan nadere regels stellen met betrekking tot de berekening van de in het derde lid genoemde
      vermogensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel421
  - number: 4:22.1
    text: |-
      Een bemiddelaar in effecten of vermogensbeheerder beschikt over een toetsingsvermogen dat ten minste gelijk is aan
      vijfentwintig procent van de door de Nederlandsche Bank vastgestelde vaste kosten in het afgelopen boekjaar. Indien
      de vermogensbeheerder of bemiddelaar in effecten haar werkzaamheden niet gedurende een volledig boekjaar heeft
      uitgeoefend, bedraagt de minimumomvang van het toetsingsvermogen vijfentwintig procent van de in haar programma van
      werkzaamheden begrote vaste kosten. De Nederlandsche Bank kan besluiten dat een hogere minimumomvang geldt, indien
      aannemelijk is dat de vaste kosten te laag zijn.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel422
  - number: 4:22.2
    text: |-
      Het eerste lid is niet van toepassing op bemiddelaars in effecten als bedoeld in [artikel 4:21, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel422
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4:22.3
    text: |-
      Het in aanmerking te nemen toetsingsvermogen van een bemiddelaar in effecten of een vermogensbeheerder wordt
      gevormd door de waarde van de in [artikel 4:21, derde lid][ref1], genoemde vermogensbestanddelen. Artikel 4:21,
      vierde lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel422
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4:22.4
    text: |-
      Onverminderd het eerste lid, is het toetsingsvermogen ten minste gelijk aan het ingevolge
      [artikel 4:21, eerste lid][ref1], voorgeschreven minimumbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel422
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4:23.1
    text: Het minimumbedrag aan eigen vermogen bedraagt voor een elektronischgeldinstelling USD 50.000.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel423
  - number: 4:23.2
    text: |-
      Het minimumbedrag aan eigen vermogen van een elektronischgeldinstelling wordt gevormd door de waarde van de
      vermogensbestanddelen, bedoeld in [artikel 4:5, tweede lid][ref1]. Deze vermogensbestanddelen alsmede de waarden
      die tegenover die vermogensbestanddelen staan, staan onmiddellijk en zonder beperkingen ter beschikking van de
      kredietinstelling. Per afzonderlijke post wordt rekening gehouden met het voorzienbare bedrag van de daarover
      verschuldigde belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel423
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:24.1
    text: |-
      Een elektronischgeldinstelling beschikt over een toetsingsvermogen dat ten minste gelijk is aan twee procent
      van het lopende bedrag of het gemiddelde bedrag over de laatste zes maanden van haar totale financiële
      verplichtingen die met uitstaand elektronisch geld verband houden, naar gelang welk bedrag het hoogste is.
      Indien de elektronischgeldinstelling haar werkzaamheden niet gedurende zes maanden heeft uitgeoefend, bedraagt
      de minimumomvang van het toetsingsvermogen twee procent van het lopende bedrag of het blijkens haar programma
      van werkzaamheden op zes maanden nagestreefde bedrag van haar totale financiële verplichtingen die met uitstaand
      elektronisch geld verband houden, naar gelang welk bedrag het hoogste is. De Nederlandsche Bank kan, indien de
      vorige volzin van toepassing is en aannemelijk is dat het nagestreefde bedrag te laag is geschat, besluiten dat
      voor de elektronischgeldinstelling een hogere minimumomvang van het toetsingsvermogen geldt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel424
  - number: 4:24.2
    text: |-
      Het in aanmerking te nemen toetsingsvermogen wordt gevormd door de waarde van de vermogensbestanddelen, bedoeld in
      [artikel 4:5, tweede lid][ref1]. Artikel 4:5, vierde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel424
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:24.3
    text: |-
      Onverminderd het eerste lid, is het toetsingsvermogen ten minste gelijk aan het in
      [artikel 4:23, eerste lid][ref1], voorgeschreven minimumbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel424
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4:25
    text: |-
      Het minimumbedrag van het garantiefonds, bedoeld in [artikel 3:16, vierde lid, van de wet][ref1] bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel425
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 4:25.a
    text: 'voor een levensverzekeraar: USD 223.000;'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel425
  - number: 4:25.b
    text: 'voor een natura-uitvaartverzekeraar: USD 25.000;'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel425
  - number: 4:25.c
    text: 'voor een schadeverzekeraar: USD 167.000.'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel425
  - number: 4:26.1
    text: |-
      Een levensverzekeraar of een natura-uitvaartverzekeraar beschikt over een solvabiliteitsmarge die ten minste gelijk
      is aan vier procent van de technische voorzieningen, bedoeld in [artikel 4:30][ref1], zonder rekening te houden met
      de herverzekering van deze verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel426
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:26.2
    text: |-
      Een schadeverzekeraar beschikt over een solvabiliteitsmarge die ten minste gelijk is aan vijftien procent van de in
      het voorgaande boekjaar geboekte bruto premies.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel426
  - number: 4:26.3
    text: |-
      De berekening van het minimumbedrag van de solvabiliteitsmarge, bedoeld in het eerste en tweede lid, geschiedt aan
      de hand van een door de Nederlandsche Bank vastgesteld model.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel426
  - number: 4:27.1
    text: |-
      Het minimumbedrag van het garantiefonds en de solvabiliteitsmarge van een verzekeraar worden gevormd door de
      volgende vermogensbestanddelen:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel427
  - number: 4:27.1.a
    text: het gestorte kapitaal of waarborgkapitaal vermeerderd met ledenrekeningen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel427
  - number: 4:27.1.b
    text: de wettelijke, statutaire en overige reserves;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel427
  - number: 4:27.1.c
    text: de onverdeelde winst dan wel het verlies;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel427
  - number: 4:27.1.d
    text: achtergestelde leningen en achtergestelde schuldinstrumenten;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel427
  - number: 4:27.1.e
    text: andere door de Nederlandsche Bank toegestane vermogensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel427
  - number: 4:27.2
    text: |-
      De Nederlandsche Bank kan nadere regels stellen met betrekking tot de mate waarin en de voorwaarden waaronder de in
      het eerste lid genoemde vermogensbestanddelen worden meegerekend bij het bepalen van de solvabiliteitsmarge.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel427
  - number: 4:28.1
    text: |-
      Een beleggingsinstelling met zetel in een openbaar lichaam, waarvan in de openbare lichamen de rechten
      van deelneming op verzoek van de deelnemers ten laste van de activa direct of indirect worden ingekocht of
      terugbetaald, beschikt over voldoende liquiditeit.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel428
  - number: 4:28.2
    text: |-
      De liquiditeit van een beleggingsinstelling is voldoende, indien de aanwezige liquiditeit, bedoeld in het vierde
      lid, ten minste gelijk is aan de vereiste liquiditeit, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel428
  - number: 4:28.3
    text: |-
      De vereiste liquiditeit van een beleggingsinstelling bedraagt tien procent van het beheerde vermogen. In afwijking
      van de eerste volzin kan, indien uit een overeengekomen ontbindings- of beëindigingsregeling vooraf bekend is voor
      welk bedrag op een bepaalde datum wordt ingekocht, worden volstaan met dat bedrag.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel428
  - number: 4:28.4
    text: |-
      De aanwezige liquiditeit van een beleggingsinstelling wordt berekend op basis van door de Nederlandsche Bank te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel428
  - number: 4:29.1
    text: |-
      De liquiditeit van een kredietinstelling is voldoende indien de aanwezige liquiditeit, bedoeld in het derde lid,
      ten minste gelijk is aan de vereiste liquiditeit, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel429
  - number: 4:29.2
    text: |-
      De vereiste liquiditeit van een kredietinstelling bestaat uit de som van de gewogen uitstaande kasstromen op
      basis van de kalenderposten, vermeerderd met de niet in de vervalkalender opgenomen toevertrouwde middelen en
      overige posten die tot een betalingsverplichting kunnen leiden, gedurende de maandperiode. Onder kalenderposten
      wordt verstaan een actiefpost of passiefpost waarvan de kasinstromen respectievelijk kasuitstromen als gevolg van
      aflossing of rentebetalingen in de vervalkalender worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel429
  - number: 4:29.3
    text: |-
      De aanwezige liquiditeit van een kredietinstelling wordt gevormd door de gewogen voorraadposten en de gewogen
      kasinstroom van de kalenderposten gedurende de maandperiode, alsmede de officiële standby-faciliteiten. Onder
      voorraadpost wordt verstaan de liquide activa die niet in de vervalkalender zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel429
  - number: 4:29.4
    text: De Nederlandsche Bank stelt nadere regels met betrekking tot het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel429
  - number: 4:30.1
    text: 'De technische voorzieningen van een verzekeraar bestaan, telkens voor zover van toepassing, uit:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel430
  - number: 4:30.1.a
    text: |-
      de voorziening voor niet-verdiende premies en de voorziening voor lopende risico’s, waaronder de
      catastrofevoorziening indien deze is getroffen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel430
  - number: 4:30.1.b
    text: de voorziening voor levensverzekering;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel430
  - number: 4:30.1.c
    text: de voorziening voor te betalen schaden of voor te betalen uitkeringen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel430
  - number: 4:30.1.d
    text: de voorziening voor winstdeling en kortingen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel430
  - number: 4:30.1.e
    text: de voorziening voor latente winstdelingsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel430
  - number: 4:30.1.f
    text: de egalisatievoorziening, voor zover egalisatie van winsten en verliezen bij of krachtens de wet is toegestaan;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel430
  - number: 4:30.1.g
    text: de overige technische voorzieningen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel430
  - number: 4:30.2
    text: |-
      De Nederlandsche Bank kan nadere regels stellen met betrekking tot de mate waarin technische voorzieningen moeten
      worden gevormd met betrekking tot verplichtingen en kosten en omtrent de indeling van de technische voorzieningen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel430
  - number: 4:31.1
    text: |-
      De technische voorzieningen worden gewaardeerd op voor het verzekeringsbedrijf aanvaarde grondslagen. Bij
      de waardering van de technische voorzieningen wordt ervan uitgegaan dat de verzekeringsmaatschappij in staat
      moet zijn te voldoen aan haar naar maatstaven van redelijkheid en billijkheid voorzienbare verplichtingen uit
      verzekeringsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel431
  - number: 4:31.2
    text: |-
      De Nederlandsche Bank kan nadere regels stellen met betrekking tot de voor de berekening van de technische
      voorzieningen te hanteren grondslagen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel431
  - number: 4:32
    text: |-
      De voorzieningen, bedoeld in [artikel 4:30, onderdelen a tot en met c][ref1], worden zoveel mogelijk voor
      elke overeenkomst onderscheidenlijk elke schade afzonderlijk en op voorzichtige wijze bepaald. Het gebruik van
      statistische of wiskundige methoden is toegestaan, indien de aard van de overeenkomst dat toelaat, en deze methoden
      naar verwachting dezelfde resultaten opleveren als de afzonderlijke berekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel432
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:33
    text: |-
      De voorziening voor niet-verdiende premies en lopende risico’s, bedoeld in [artikel 4:30, onderdeel a][ref1], omvat
      onder meer:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel433
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:33.a
    text: |-
      de in het boekjaar ontvangen premies ter zake van risico’s die op het daarop volgende boekjaar of boekjaren
      betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel433
  - number: 4:33.b
    text: |-
      de schaden en kosten uit lopende overeenkomsten van verzekering die na afloop van het boekjaar kunnen ontstaan en
      die niet gedekt kunnen worden door de voorziening die betrekking heeft op de niet-verdiende premies tezamen met de
      in het daarop volgende boekjaar of boekjaren nog te ontvangen premies.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel433
  - number: 4:34.1
    text: |-
      De voorziening voor levensverzekering, bedoeld in [artikel 4:30, onderdeel b][ref1], wordt berekend op basis van
      een voldoende voorzichtige prospectieve actuariële methode, rekening houdend met de in de toekomst te ontvangen
      premies en met alle toekomstige verplichtingen volgens de voor iedere lopende overeenkomst van verzekering gestelde
      voorwaarden, met inbegrip van:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel434
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:34.1.a
    text: alle gegarandeerde uitkeringen en gegarandeerde afkoopwaarden;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel434
  - number: 4:34.1.b
    text: |-
      de winstdelingen waarop de verzekeringnemer, verzekerde of gerechtigde op uitkering collectief dan wel individueel
      recht heeft;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel434
  - number: 4:34.1.c
    text: |-
      alle keuzemogelijkheden waarover de verzekeringnemer, verzekerde of gerechtigde op uitkering volgens de voorwaarden
      van de overeenkomst beschikt;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel434
  - number: 4:34.1.d
    text: de bedrijfskosten, met inbegrip van provisies.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel434
  - number: 4:34.2
    text: |-
      In afwijking van het eerste lid kan een retrospectieve methode worden toegepast indien de op grond van die methode
      berekende voorzieningen niet lager zijn dan de voorzieningen bij toepassing van een prospectieve methode, of indien
      het gebruik van een prospectieve methode vanwege de aard van het betrokken type overeenkomst niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel434
  - number: 4:34.3
    text: |-
      De voorziening voor levensverzekering vermeldt afzonderlijk de technische voorzieningen voor verzekeringen waarbij
      de tot uitkering gerechtigde het beleggingsrisico draagt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel434
  - number: 4:35.1
    text: |-
      De voorziening voor te betalen schaden of voor te betalen uitkeringen, bedoeld in
      [artikel 4:30, onderdeel c][ref1], omvat het bedrag van de te verwachten schaden of uitkeringen, in aanmerking
      nemende:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel435
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:35.1.a
    text: |-
      de voor de balansdatum ontstane schaden of uitkeringen die zijn gemeld en nog niet zijn afgewikkeld, en de schaden
      of uitkeringen die nog niet zijn gemeld;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel435
  - number: 4:35.1.b
    text: de kosten verband houdende met de afwikkeling van schaden of uitkeringen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel435
  - number: 4:35.1.c
    text: |-
      de in verband met schaden of uitkeringen te verwachten baten uit subrogatie en de verkrijging van de eigendom van
      verzekerde zaken.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel435
  - number: 4:35.2
    text: |-
      Discontering van de voorziening voor te betalen schaden of voor te betalen uitkeringen, anders dan periodiek
      te betalen schaden, is slechts toegestaan in door de Nederlandsche Bank te bepalen gevallen en onder door de
      Nederlandsche Bank te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel435
  - number: 4:35.3
    text: |-
      Indien de verplichtingen uit overeenkomsten van verzekering op het tijdstip van het opmaken van de jaarrekening
      redelijkerwijs niet te schatten zijn wegens het ontbreken van voldoende nauwkeurige gegevens met betrekking tot
      de over het tekenjaar te ontvangen premies of te betalen schaden en kosten van afwikkeling van de schade, kan
      de Nederlandsche Bank, onder door haar te stellen voorwaarden, een andere berekening van de voorziening voor te
      betalen schade of voor te betalen uitkeringen toestaan.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel435
  - number: 4:36
    text: |-
      De voorziening voor winstdeling en kortingen, bedoeld in [artikel 4:30, onderdeel d][ref1], omvat de bedragen die
      in de vorm van winstdeling bestemd zijn voor de verzekeringnemers, verzekerden of gerechtigden op uitkeringen, voor
      zover deze niet hebben geleid tot verhoging van de voorziening voor levensverzekering, alsmede de bedragen die een
      gedeeltelijke terugbetaling van premies op grond van het resultaat van de overeenkomsten vertegenwoordigen, voor
      zover deze niet tot verhoging van de ledenrekening hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel436
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:37.1
    text: |-
      Een schadeverzekeraar die overeenkomsten van verzekering sluit ter dekking van schaden die het gevolg zijn van
      algemene insolventie, verleend exportkrediet, hypothecair krediet, landbouwkrediet en verkoop op afbetaling, houdt
      ter dekking van een tijdens het boekjaar ter zake geleden technisch verlies een egalisatievoorziening aan die wordt
      berekend overeenkomstig het tweede lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel437
  - number: 4:37.2
    text: |-
      Het minimumbedrag van de egalisatievoorziening bedraagt 134 procent van het gemiddelde van de tijdens de vijf
      voorgaande boekjaren jaarlijks geboekte premies na aftrek van de overdrachten uit hoofde van herverzekering. Aan
      deze voorziening wordt in elk boekjaar waarin ter zake een technisch overschot werd geboekt, vijfenzeventig procent
      van dit technisch overschot toegevoegd, totdat de voorziening ten minste gelijk is aan het in de vorige volzin
      genoemde minimum.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel437
  - number: 4:37.3
    text: |-
      Het eerste lid is niet van toepassing als de ter zake jaarlijks geboekte premies minder dan vier procent van het
      totale bedrag aan jaarlijks geboekte premies belopen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel437
  - number: 4:38
    text: |-
      De waarden die dienen ter dekking van de technische voorzieningen, worden door de verzekeraar als zodanig
      geadministreerd. De Nederlandsche Bank kan tegen de aard en waardering van deze waarden bezwaar maken, aan welk
      bezwaar de verzekeraar dient tegemoet te komen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel438
  - number: 4:39.1
    text: |-
      De waarden die dienen ter dekking van de technische voorzieningen, moeten in toereikende mate in dezelfde muntsoort
      kunnen worden geïnd of te gelde gemaakt als die waarin de verplichtingen luiden.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel439
  - number: 4:39.2
    text: |-
      De waarden die dienen ter dekking van de technische voorzieningen voor de vanuit de vestigingen in de openbare
      lichamen aangegane verplichtingen, zijn in de openbare lichamen, Curaçao of Sint Maarten aanwezig. Waarden die
      bestaan uit schuldvorderingen, zijn in de openbare lichamen, Curaçao of Sint Maarten aanwezig, indien zij aldaar
      kunnen worden geïnd.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel439
  - number: 4:40
    text: |-
      De verzekeraar draagt er zorg voor dat de aard en waardering van de waarden die dienen ter dekking van de
      technische voorzieningen, in overeenstemming zijn met de aard onderscheidenlijk de waardering van de aangegane
      verplichtingen. Deze waarden worden adequaat gediversificeerd en gespreid. Waarden met een hoog risico worden tot
      een voorzichtig niveau beperkt en voorzichtig gewaardeerd.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel440
  - number: 4:41
    text: |-
      De technische voorzieningen met betrekking tot uitkeringen die volgens de overeenkomst rechtstreeks gekoppeld zijn
      aan de waarde van een deelneming in een beleggingsinstelling, onderscheidenlijk aan een andere referentiewaarde,
      worden gedekt door deze rechten van deelneming, onderscheidenlijk door de eenheden die de referentiewaarde
      vertegenwoordigen, dan wel door activa die zo nauw mogelijk aansluiten bij die waarop de referentiewaarde is
      gebaseerd. [Artikel 4:40][ref1] is niet van toepassing op de in de vorige volzin bedoelde technische voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel441
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:42.1
    text: |-
      Een vordering op een herverzekeraar uit hoofde van een door een verzekeraar als verzekeringnemer gesloten
      overeenkomst van herverzekering komt in aanmerking als waarde ter dekking van de technische voorzieningen voor
      zover het naar het oordeel van de Nederlandsche Bank aannemelijk is dat de vordering in de openbare lichamen
      zal worden voldaan of dat de verzekeraar in het buitenland zijn uitkeringen aan verzekerden of gerechtigden op
      uitkeringen zal moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel442
  - number: 4:42.2
    text: |-
      Het eerste lid is eveneens van toepassing op een toekomstige vordering op een herverzekeraar, mits de vordering
      betrekking heeft op een reeds bekende, maar nog niet afgewikkelde schade. Bij de berekening van de hoogte van de
      vordering worden de bedragen die de verzekeraar aan de herverzekeraar verschuldigd is, in mindering gebracht op het
      totale bedrag van de vordering.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel442
  - number: 4:42.3
    text: |-
      Ten aanzien van de in het eerste en tweede lid bedoelde waarden is [artikel 4:39, tweede lid][ref1], niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:43
    text: |-
      De Nederlandsche Bank kan nadere regels stellen ter uitvoering van de [artikelen 4:39 tot en met 4:42][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel443
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:44
    text: 'De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel444
  - number: 4:44.a
    text: |-
      de maatregelen ter bescherming van de rechten van de cliënt en ter voorkoming van het gebruik van effecten of
      gelden van de cliënt, bedoeld in [artikel 3:23, eerste lid van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel444
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 4:44.b
    text: |-
      de wijze waarop de instemming, bedoeld in [artikel 3:23, vierde lid, van de wet][ref1], van de cliënt kan
      worden verkregen voor gebruik van diens effecten voor eigen rekening door de bemiddelaar in effecten of
      vermogensbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel444
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 4:45
    text: |-
      De Nederlandsche Bank kan nadere regels stellen met betrekking tot de door elektronischgeldinstellingen te treffen
      maatregelen, bedoeld in [artikel 3:23, derde lid, van de wet][ref1], teneinde de voor de uitgifte van elektronisch
      geld ontvangen middelen veilig te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel445
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 4:46
    text: |-
      Een trustkantoor draagt zorg voor een deugdelijke administratie, en heeft maatregelen getroffen om de rechten,
      met betrekking tot gelden of geldswaarden, van ondernemingen waaraan door het trustkantoor beheersdiensten zullen
      worden verleend, en van derden te beschermen. De maatregelen strekken in ieder geval tot een volledige scheiding
      tussen de vermogensbestanddelen van elk van die ondernemingen, iedere derde en van het trustkantoor.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel446
  - number: 4:47.1
    text: |-
      De beroepsaansprakelijkheidsverzekering, bedoeld in [artikel 3:24 van de wet][ref1], dekt de aansprakelijkheid van
      de adviseur, bemiddelaar, niet zijnde een bemiddelaar in effecten, of gevolmachtigde agent wegens fouten, verzuimen
      of nalatigheden, begaan in de uitoefening van diens beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel447
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 4:47.2
    text: |-
      De beroepsaansprakelijkheidsverzekering wordt gesloten bij een verzekeraar die in de staat van zetel bevoegd is tot
      uitoefening van het desbetreffende verzekeringsbedrijf.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel447
  - number: 4:47.3
    text: De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot de hoogte van het verzekerd bedrag.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel447
  - number: 4:48.1
    text: |-
      Een kredietinstelling met zetel in de openbare lichamen die deel uitmaakt van een groep, dient de ingevolge
      [artikel 3:45, vierde lid, van de wet][ref1] vereiste rapportage eenmaal per jaar bij de Nederlandsche Bank in,
      tenzij de Nederlandsche Bank, indien de solvabiliteit door ontwikkelingen bij de kredietinstelling in gedrang is of
      zou kunnen komen, besluit dat er gerapporteerd wordt met een hogere frequentie.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel448
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 4:48.2
    text: |-
      Onder significante intragroepsovereenkomsten en -posities worden verstaan overeenkomsten en posities die een
      door de Nederlandsche Bank vast te stellen drempel te boven gaan. De drempel is gerelateerd aan de vereiste
      solvabiliteit van de kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel448
  - number: 4:48.3
    text: |-
      De Nederlandsche Bank stelt regels met betrekking tot de categorieën overeenkomsten en posities die in de
      rapportage worden betrokken en de rapportage.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel448
  - number: 4:49.1
    text: |-
      Een kredietinstelling als bedoeld in [artikel 4:48, eerste lid][ref1], berekent onverminderd de
      [artikelen 3:16][ref2] en [3:17 van de wet][ref3] eenmaal per jaar haar solvabiliteit op basis van haar
      geconsolideerde financiële positie.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel449
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0030883
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 4:49.2
    text: |-
      De Nederlandsche Bank kan nadere regels stellen met betrekking tot de berekening van de geconsolideerde financiële
      positie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel449
  - number: 4:50.1
    text: |-
      Een verzekeraar met zetel in de openbare lichamen die deel uitmaakt van een groep, dient de ingevolge
      [artikel 3:46, vierde lid, van de wet][ref1] vereiste rapportage eenmaal per jaar in, tenzij de Nederlandsche Bank,
      indien de solvabiliteit door ontwikkelingen bij de verzekeraar in gedrang is of zou kunnen komen, besluit dat er
      gerapporteerd wordt met een hogere frequentie.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel450
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 4:50.2
    text: |-
      Onder significante intragroepovereenkomsten en -posities worden verstaan overeenkomsten en posities die een door de
      Nederlandsche Bank vast te stellen drempel te boven gaan. De drempel is gerelateerd aan de vereiste solvabiliteit
      van de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel450
  - number: 4:50.3
    text: |-
      De Nederlandsche Bank stelt regels met betrekking tot de categorieën overeenkomsten en posities die in de
      rapportages worden betrokken en met betrekking tot de rapportage.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel450
  - number: 4:51.1
    text: |-
      Een verzekeraar die deelnemingen heeft in een of meer andere verzekeraars, berekent zijn aangepaste solvabiliteit
      op geconsolideerde basis. De aangepaste solvabiliteit is gelijk aan het verschil tussen de vermogensbestanddelen
      die in aanmerking komen voor de solvabiliteitsmarge, berekend op basis van de geconsolideerde gegevens, en het
      minimumbedrag aan solvabiliteitsmarge, berekend op basis van de geconsolideerde gegevens.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel451
  - number: 4:51.2
    text: |-
      Indien een verzekeraar een deelneming heeft in een elektronischgeldinstelling, kredietinstelling of
      vermogensbeheerder, wordt de waarde van die deelneming in mindering gebracht op de voor zijn solvabiliteitsmarge in
      aanmerking te nemen vermogensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel451
  - number: 4:51.3
    text: |-
      De Nederlandsche Bank kan nadere regels stellen met betrekking tot het eerste en tweede lid. Deze regels kunnen
      mede inhouden dat de verzekeraar zijn aangepaste solvabiliteit mag berekenen volgens een andere methode dan is
      voorgeschreven in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel451
  - number: 5:1.1
    text: |-
      Een financiële onderneming met zetel in het buitenland voert met betrekking tot haar activiteiten in de openbare
      lichamen een afzonderlijke boekhouding, waaruit de aard en omvang van die activiteiten blijkt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel51
  - number: 5:1.2
    text: |-
      De afzonderlijke boekhouding, bedoeld in het eerste lid, staat onmiddellijk ter beschikking van de
      toezichtautoriteit, indien deze daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel51
  - number: 5:2.1
    text: |-
      Een beleggingsinstelling, bemiddelaar in effecten, elektronischgeldinstelling, kredietinstelling,
      vermogensbeheerder of verzekeraar dient een jaarrekening en jaarverslag in bij de vergunningverlenende
      toezichtautoriteit.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel52
  - number: 5:2.2
    text: |-
      De termijn, bedoeld in [artikel 3:35, eerste lid, van de wet][ref1] bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 5:2.2.a
    text: 'voor beleggingsinstellingen: vier maanden na afloop van het boekjaar;'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel52
  - number: 5:2.2.b
    text: 'voor de overige in het eerste lid genoemde financiële ondernemingen: zes maanden na afloop van het boekjaar.'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel52
  - number: 5:2.3
    text: |-
      De jaarrekening en jaarverslag voldoen wat betreft inhoud en vorm aan de eisen aan een jaarrekening ingevolge
      [artikel 120, derde en vijfde lid, van boek 2 van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel120
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '120'
  - number: 5:2.4
    text: |-
      Een financiële onderneming als bedoeld in het eerste lid dient tezamen met de jaarrekening en het jaarverslag ook
      de volgende gegevens bij de vergunningverlenende toezichtautoriteit in:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel52
  - number: 5:2.4.a
    text: |-
      de gegevens bedoeld in [artikel 120, tweede lid, van boek 2 van het Burgerlijk Wetboek BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel120
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '120'
  - number: 5:2.4.b
    text: een afschrift van het rapport van de deskundige, bedoeld in het vijfde lid;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel52
  - number: 5:2.4.c
    text: de directiebrieven.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel52
  - number: 5:2.5
    text: |-
      De jaarrekening van een financiële onderneming, bedoeld in het eerste lid, wordt goedgekeurd door een externe
      deskundige als bedoeld in [artikel 121 van boek 2 van het Burgerlijk Wetboek BES][ref1]. Indien de financiële
      onderneming niet voldoet aan de in [artikel 119, tweede lid, van Boek 2 van het Burgerlijk Wetboek BES][ref2]
      omschreven criteria, kan de jaarrekening worden goedgekeurd door een andere dan de in de eerste volzin bedoelde
      deskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel119
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0028744
        artikel: '121'
      - id: ref2
        bwb_id: BWBR0028744
        artikel: '119'
  - number: 5:2.6
    text: De toezichtautoriteit kan nadere regels stellen met betrekking tot het eerste tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel52
  - number: 5:3.1
    text: |-
      Een beheerder of bewaarder van een beleggingsinstelling dient binnen vier maanden na afloop
      van het boekjaar een jaarrekening en jaarverslag in bij de Autoriteit Financiële Markten.
      [Artikel 5:2, derde tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 5:3.2
    text: De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel53
  - number: 5:4.1
    text: |-
      Uit de jaarrekening van een kredietinstelling met zetel in het buitenland die door middel van een bijkantoor actief
      is in de openbare lichamen, blijkt de omvang van de bij het bijkantoor aangehouden betaalrekeningen, spaartegoeden
      en deposito’s per ultimo van het afgesloten boekjaar.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel54
  - number: 5:4.2
    text: |-
      Uit de jaarrekening van een verzekeraar met zetel in het buitenland die door middel van een bijkantoor actief is
      in de openbare lichamen, blijkt de omvang van de door het bijkantoor ontvangen bruto premies over het afgesloten
      boekjaar.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel54
  - number: 5:5.1
    text: |-
      De staten, bedoeld in [artikel 3:36, eerste lid, van de wet][ref1], die door een kredietinstelling worden
      verstrekt, omvatten:


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 5:5.1.a
    text: |-
      balans- en resultaatgegevens, alsmede aanvullende financiële gegevens ten behoeve van het ingevolge
      [artikel 1:5 van de wet][ref1] door de Nederlandsche Bank uitgeoefende prudentieel toezicht;


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel1
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '1'
  - number: 5:5.1.b
    text: 'andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
  - number: 5:5.1.b.1°
    text: |-
      de solvabiliteit ingevolge [artikel 3:17, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 5:5.1.b.2°
    text: |-
      het aanhouden van balansposten en posten buiten de balansteling ingevolge
      [artikel 3:17, vierde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 5:5.1.b.3°
    text: |-
      de liquiditeit ingevolge [artikel 3:18, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 5:5.2
    text: |-
      De Nederlandsche Bank stelt nadere regels met betrekking tot de in het eerste lid genoemde staten. Deze regels
      hebben betrekking op:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
  - number: 5:5.2.a
    text: de modellen van de staten;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
  - number: 5:5.2.b
    text: |-
      de reikwijdte van toepassing van de staten en de mate van detaillering van de in te vullen gegevens, met dien
      verstande dat deze geen uitbreiding of nadere rubricering van de staten omvatten;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
  - number: 5:5.2.c
    text: |-
      de reikwijdte van de consolidatie overeenkomstig de regels met betrekking tot consolidatie die de kredietinstelling
      in haar jaarrekening toepast, voor zover uit de [wet][ref1] niet anders voortvloeit;


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 5:5.2.d
    text: |-
      de waardering van de posten overeenkomstig de waarderingsmethoden die de kredietinstelling in haar jaarrekening
      toepast;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
  - number: 5:5.2.e
    text: de te hanteren valuta en rekeneenheid;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
  - number: 5:5.2.f
    text: de afronding;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
  - number: 5:5.2.g
    text: |-
      de termijn waarbinnen de staten worden verstrekt, met dien verstande dat deze niet korter is dan noodzakelijk voor
      de uitoefening van het prudentieel toezicht;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
  - number: 5:5.2.h
    text: de frequentie waarmee de staten worden verstrekt, met dien verstande dat deze ten minste een maal per jaar is.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
  - number: 5:5.3
    text: |-
      De regels, bedoeld in het tweede lid, onderdelen b, f, g en h, zijn afgestemd op de aard en de omvang van de
      kredietinstelling, alsmede op de omvang van de solvabiliteit van de kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
  - number: 5:5.4
    text: |-
      De Nederlandsche Bank kan in individuele gevallen besluiten dat een kredietinstelling periodiek moet melden of haar
      solvabiliteit of liquiditeit zich boven een door de Nederlandsche Bank vastgestelde signaleringswaarde bevindt.
      De frequentie van de melding is niet hoger dan eenmaal per maand en is afgestemd op de aard en de omvang van de
      kredietinstelling, alsmede op de omvang van de solvabiliteit van de kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
  - number: 5:5.5
    text: De Nederlandsche Bank besluit welke staten openbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel55
  - number: 5:6.1
    text: |-
      De staten, bedoeld in [artikel 3:36, eerste lid, van de wet][ref1], die door een verzekeraar worden verstrekt
      omvatten:


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 5:6.1.a
    text: |-
      een jaarrekening, alsmede aanvullende financiële gegevens ten behoeve van het door de Nederlandsche Bank ingevolge
      [artikel 1:5 van de wet][ref1] uitgeoefende prudentieel toezicht;


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel1
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '1'
  - number: 5:6.1.b
    text: 'andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel56
  - number: 5:6.1.b.1°
    text: |-
      de solvabiliteit ingevolge [artikel 3:17 van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 5:6.1.b.2°
    text: |-
      de technische voorzieningen ingevolge [artikel 3:19 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 5:6.2
    text: |-
      De Nederlandsche Bank stelt nadere regels met betrekking tot de in het eerste lid bedoelde staten.
      [Artikel 5:5, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 6:1
    text: |-
      De ingevolge [artikel 4:4, eerste lid van de wet][ref1] tussen een beleggingsinstelling en een bewaarder te sluiten
      overeenkomst bepaalt in ieder geval dat:


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '4'
  - number: 6:1.a
    text: de bewaarder bij het bewaren uitsluitend in het belang van de deelnemers in de beleggingsinstelling optreedt;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel61
  - number: 6:1.b
    text: |-
      de bewaring ten name van de beleggingsinstelling op een zodanige wijze geschiedt, dat over de in bewaring gegeven
      activa slechts kan worden beschikt door de beleggingsinstelling en de bewaarder tezamen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel61
  - number: 6:1.c
    text: |-
      de bewaarder de in bewaring gegeven activa slechts afgeeft tegen ontvangst van een verklaring van de
      beleggingsinstelling, waaruit blijkt dat afgifte wordt verlangd in verband met de regelmatige uitoefening van de
      beheerfunctie;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel61
  - number: 6:1.d
    text: |-
      de bewaarder volgens het recht van de staat waar de beheerder zijn zetel heeft, jegens de beleggingsinstelling en
      de deelnemers aansprakelijk is voor door hen geleden schade, voor zover de schade het gevolg is van verwijtbare
      niet-nakoming of gebrekkige nakoming van zijn verplichtingen, ook indien de bewaarder de bij hem in bewaring
      gegeven activa geheel of gedeeltelijk aan een derde heeft toevertrouwd;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel61
  - number: 6:1.e
    text: |-
      indien bewijzen van rechten van deelneming worden afgegeven, deze bewijzen ook door de bewaarder worden
      ondertekend;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel61
  - number: 6:1.f
    text: |-
      een voorstel door de beheerder van een beleggingsinstelling tot wijziging van de tussen de beleggingsinstelling en
      de deelnemers geldende voorwaarden tezamen met de bewaarder wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel61
  - number: 6:1.g
    text: |-
      indien de bewaarder van een beleggingsfonds te kennen geeft voornemens te zijn zijn functie neer te leggen,
      binnen een termijn van vier weken een vergadering van deelnemers wordt gehouden om in de benoeming van een nieuwe
      bewaarder te voorzien.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel61
  - number: 6:2.1
    text: |-
      Het minimumbedrag aan eigen vermogen, bedoeld in [artikel 4:5, eerste lid, van de wet][ref1], bedraagt voor de
      beheerder van een beleggingsinstelling USD 279.000 en voor de bewaarder van een beleggingsinstelling USD 139.000.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '4'
  - number: 6:2.2
    text: |-
      Het minimumbedrag aan eigen vermogen van een beheerder of bewaarder wordt gevormd door de waarde van
      de vermogensbestanddelen, bedoeld in [artikel 4:5, tweede lid, onderdelen a tot en met g][ref1]. Deze
      vermogensbestanddelen, alsmede de waarden die tegenover die vermogensbestanddelen staan, staan onmiddellijk en
      zonder beperkingen ter beschikking van de beleggingsinstelling. Artikel 4:5, vierde lid, is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 6:2.3
    text: |-
      Een bewaarder van een beleggingsinstelling stelt voldoende zekerheid met het oog op de aansprakelijkheid voor
      schade die voor de bewaarder kan voortvloeien uit brand, vervoer van geld en waardepapieren, fraude en beroving.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel62
  - number: 6:3.1
    text: |-
      Het prospectus, bedoeld in [artikel 4:10, eerste lid, van de wet][ref1], bevat ten minste de bij regeling van
      Onze Minister bepaalde gegevens, die onder meer betrekking hebben op de beheerder en de bewaarder, alsmede op de
      voorwaarden, de beleggingsdoelstellingen en de beleggingsactiviteiten van de beleggingsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '4'
  - number: 6:3.2
    text: |-
      De Autoriteit Financiële Markten kan verlangen dat het prospectus in een of meer door haar te bepalen talen
      beschikbaar wordt gesteld, indien dit, gelet op de voorgenomen verspreiding van het prospectus, noodzakelijk is
      voor een adequate informatieverschaffing aan het publiek.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel63
  - number: 6:3.3
    text: |-
      Bij aanbod van haar rechten van deelneming buiten een besloten kring dan wel bij de schriftelijke aankondiging
      dat een aanbod buiten een besloten kring zal worden gedaan, stelt de beleggingsinstelling uiterlijk op de dag van
      uitgifte, van openstelling van deelneming of van de schriftelijke aankondiging van openstelling, een prospectus
      kosteloos algemeen verkrijgbaar. In iedere bekendmaking waarin deelnemingsrechten worden aangeboden, wordt vermeld
      waar het prospectus voor het publiek verkrijgbaar is.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel63
  - number: 6:4.1
    text: |-
      Tegelijkertijd met het prospectus, bedoeld in [artikel 6:3][ref1], stelt een beleggingsinstelling de informatie,
      bedoeld in [artikel 7:5][ref2], alsmede de volgende informatie algemeen verkrijgbaar:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 6:4.1.a
    text: |-
      de mededeling dat de waarde van de rechten van deelneming zowel kan stijgen als dalen en dat de deelnemers mogelijk
      minder terugkrijgen dan zij hebben ingelegd;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel64
  - number: 6:4.1.b
    text: 'indien de beleggingsinstelling belegt met namens of voor rekening en risico van de deelnemers geleend geld:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel64
  - number: 6:4.1.b.1°
    text: de risico’s die hieraan verbonden zijn;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel64
  - number: 6:4.1.b.2°
    text: |-
      vermelding van een eventuele verplichting voor de deelnemers in de beleggingsinstelling om mogelijke tekorten van
      de beleggingsinstelling aan te zuiveren wanneer de verliezen de inleg overstijgen; en
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel64
  - number: 6:4.1.b.3°
    text: |-
      vermelding van de maximale omvang van de beleggingen die met geleend geld kunnen worden aangekocht in absolute
      waarde of als percentage van het beheerde vermogen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel64
  - number: 6:4.1.c
    text: |-
      indien de bestaansduur van de beleggingsinstelling dat mogelijk maakt: het in het verleden behaalde rendement van
      de beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel64
  - number: 6:4.1.d
    text: |-
      een beschrijving van de wijze waarop en de voorwaarden waaronder de opheffing en vereffening van de
      beleggingsinstelling plaatsvindt, in het bijzonder ten aanzien van de rechten van de deelnemers in de
      beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel64
  - number: 6:4.2
    text: |-
      Voorts stelt de beleggingsinstelling de voorwaarden van de beleggingsinstelling algemeen verkrijgbaar voorafgaand
      aan het aanbieden van rechten van deelneming. Deze voorwaarden bevatten ten minste de gegevens genoemd in
      [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031636
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0031636
  - number: 6:5.1
    text: |-
      Voor de toepassing van [artikel 4:23, eerste lid, aanhef en onderdeel b, van de wet][ref1] wordt als significante
      deelneming aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '4'
  - number: 6:5.1.a
    text: |-
      een deelneming in een financiële onderneming waarvan het balanstotaal ten tijde van de verwerving,
      onderscheidenlijk de vergroting, meer bedraagt dan een procent van het geconsolideerde balanstotaal van de
      kredietinstelling;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel65
  - number: 6:5.1.b
    text: |-
      een deelneming in een onderneming, niet zijnde een financiële onderneming, indien het bedrag dat wordt betaald voor
      de verwerving van die deelneming, onderscheidenlijk voor de vergroting van die deelneming, tezamen met de bedragen
      die voor die verwerving en voor eerdere vergrotingen van die deelnemingen zijn betaald, meer bedraagt dan een
      procent van het geconsolideerde aanwezige eigen vermogen van de kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel65
  - number: 6:5.2
    text: |-
      Van het geheel of voor een belangrijk deel al dan niet middellijk overnemen van de activa en passiva van een andere
      onderneming of instelling in de zin van [artikel 4:23, eerste lid, aanhef en onderdeel c, van de wet][ref1] is
      sprake, indien het totaalbedrag van de over te nemen activa of over te nemen passiva meer bedraagt dan een procent
      van het geconsolideerde balanstotaal van de kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '4'
  - number: 6:6
    text: |-
      Het is een schadeverzekeraar met zetel in de openbare lichamen toegestaan in de uitoefening van zijn bedrijf,
      naast de risico’s die behoren tot de branche waarvoor de vergunning is verleend, tevens risico’s te verzekeren
      die behoren tot andere branches, indien deze risico’s naar het oordeel van de Nederlandsche Bank als bijkomende
      risico’s kunnen worden beschouwd, omdat zij:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel66
  - number: 6:6.a
    text: samenhangen met het hoofdrisico dat behoort tot de branche waarvoor de vergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel66
  - number: 6:6.b
    text: betrekking hebben op het belang of gevaarsobject dat is verzekerd tegen het hoofdrisico; en
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel66
  - number: 6:6.c
    text: worden verzekerd bij dezelfde overeenkomst als het hoofdrisico.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel66
  - number: 6:7.1
    text: |-
      Een rechtsbijstandverzekeraar vertrouwt de werkzaamheden met betrekking tot de rechtsbijstandschaderegeling
      toe aan een juridisch zelfstandig schaderegelingkantoor en vermeldt dit kantoor in de overeenkomst inzake de
      rechtsbijstanddekking, of neemt in die overeenkomst op dat de verzekerde, zodra hij uit hoofde van de verzekering
      recht heeft op rechtsbijstand, de behartiging van zijn belangen mag toevertrouwen aan een advocaat of een andere
      rechtens bevoegde deskundige van zijn keuze.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel67
  - number: 6:7.2
    text: |-
      Onder rechtsbijstandverzekeraar wordt verstaan: een schadeverzekeraar die verzekeringen aanbiedt tot dekking van
      verleende diensten en gemaakte kosten in het bijzonder met het oog op verhaal van door een verzekerde geleden
      schade en diens verdediging of vertegenwoordiging, in of buiten rechte.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel67
  - number: 6:7.3
    text: |-
      De Autoriteit Financiële Markten kan, onder door haar te stellen voorwaarden, toestaan dat een
      rechtsbijstandverzekeraar, in afwijking van het eerste lid, de werkzaamheden met betrekking tot de
      rechtsbijstandschaderegeling toevertrouwt aan eigen personeelsleden, mits zijn bedrijfsvoering zo is ingericht dat
      belangenconflicten worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel67
  - number: 6:7.4
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de inhoud van de overeenkomst
      inzake rechtsbijstanddekking.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel67
  - number: 6:8.1
    text: |-
      Een verzekeraar met zetel in het buitenland die door middel van het verrichten van diensten vanuit een
      vestiging in het buitenland in de openbare lichamen verzekeringen aanbiedt tot dekking van wettelijke
      aansprakelijkheid, voortvloeiend uit het gebruik van motorrijtuigen, stelt een schade-afhandelaar
      aan die belast is met het namens hem afwikkelen van vorderingen van benadeelden als bedoeld in
      [artikel 1 van de Wet aansprakelijkheidsverzekering motorrijtuigen BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028254#Artikel1
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028254
        artikel: '1'
  - number: 6:8.2
    text: |-
      De schade-afhandelaar verricht zijn werkzaamheden vanuit een vestiging in de openbare lichamen en beschikt over
      voldoende bevoegdheden om de schadeverzekeraar zowel in als buiten rechte te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel68
  - number: 6:8.3
    text: |-
      Een verzekeraar als bedoeld in het eerste lid meldt een wijziging in de akte van aanstelling van de in dat lid
      bedoelde schade-afhandelaar binnen twee weken schriftelijk aan de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel68
  - number: 6:9.1
    text: |-
      Een bemiddelaar in verzekeringen heeft jegens de verzekeraar aanspraak op provisie over alle tot zijn portefeuille
      behorende verzekeringen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel69
  - number: 6:9.2
    text: |-
      Intrekking van de vergunning van een bemiddelaar in verzekeringen laat onverlet zijn aanspraken op provisie
      ter zake van verzekeringen die op het tijdstip van de intrekking tot zijn portefeuille behoren of waarop op dat
      tijdstip [artikel 4:43, tweede lid, van de wet][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '4'
  - number: 6:9.3
    text: |-
      Na een overboeking als bedoeld in [artikel 4:43, tweede en derde lid, van de wet][ref1], blijft, in afwijking
      van het eerste lid, de aanspraak op provisies bestaan tot het einde van het lopende verzekeringsjaar, indien
      het een levensverzekering betreft. Indien het een schadeverzekering betreft, blijft de aanspraak bestaan tot de
      eerstvolgende vervaldatum van de verzekeringsovereenkomst of tot een eerder tijdstip waarop de verzekering door
      opzegging door de verzekeringnemer kan worden beëindigd, tenzij anders wordt overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '4'
  - number: 6:10.1
    text: |-
      Overname van het premie-incasso door een verzekeraar van een bemiddelaar in verzekeringen als bedoeld in
      [artikel 4:45, derde lid, van de wet][ref1], laat onverlet de aanspraak op provisie van die bemiddelaar, bedoeld in
      [artikel 6:9, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel6
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel610
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 6:10.2
    text: |-
      Onverminderd het eerste lid, is de verzekeraar na overname van het premie-incasso bevoegd om aan de bemiddelaar een
      billijke en objectief gegronde vergoeding voor het premie-incasso in rekening te brengen of om de aanspraak van de
      bemiddelaar op provisie af te kopen. Bij regeling van Onze Minister kunnen nadere regels worden gesteld over die
      vergoeding of afkoopsom.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel610
  - number: 7:1
    text: 'De door een financiëledienstverlener te verstrekken informatie:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel71
  - number: 7:1.a
    text: |-
      is accuraat en wijst niet op de mogelijke voordelen van een financieel product, zonder dat ook een correcte en
      duidelijke indicatie van de mogelijke risico’s wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel71
  - number: 7:1.b
    text: |-
      is toereikend en door de presentatie ervan te begrijpen voor het gemiddelde lid van de groep tot wie zij is
      gericht;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel71
  - number: 7:1.c
    text: geeft belangrijke zaken, vermeldingen of waarschuwingen niet verhuld of afgezwakt weer.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel71
  - number: 7:2
    text: |-
      Een financiëledienstverlener verstrekt de ingevolge de [artikelen 5:4 tot en met 5:6 van de wet][ref1]
      en de [artikelen 7:5 tot en met 7:14][ref2] van dit besluit te verstrekken informatie schriftelijk. De
      financiëledienstverlener kan de informatie via een andere duurzame drager verstrekken, indien de consument of
      cliënt daarmee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7:3.1
    text: 'Een financiëledienstverlener:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel73
  - number: 7:3.1.a
    text: |-
      neemt in een reclame-uiting over krediet geen mededelingen op die gericht zijn op het gemak of de snelheid waarmee
      het krediet wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel73
  - number: 7:3.1.b
    text: |-
      brengt in een reclame-uiting over krediet niet tot uiting dat lopende overeenkomsten inzake krediet bij de
      beoordeling van een kredietaanvraag geen of een ondergeschikte rol spelen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel73
  - number: 7:3.2
    text: |-
      Bij regeling van Onze minister kan worden bepaald dat financiëledienstverleners in reclame-uitingen over krediet
      een waarschuwing opnemen met betrekking tot de gevolgen die aan het krediet zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel73
  - number: 7:4.1
    text: |-
      Indien een financiëledienstverlener in een reclame-uiting over krediet melding maakt van enige gegevens betreffende
      de kosten van een krediet, verstrekt hij daarbij tevens informatie over:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel74
  - number: 7:4.1.a
    text: het kredietbedrag;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel74
  - number: 7:4.1.b
    text: de duur van de kredietovereenkomst;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel74
  - number: 7:4.1.c
    text: de totale kosten van het krediet;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel74
  - number: 7:4.1.d
    text: het totale door de consument te betalen bedrag;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel74
  - number: 7:4.1.e
    text: het effectieve rentepercentage op jaarbasis;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel74
  - number: 7:4.1.f
    text: |-
      indien het aangaan van een andere verplichting vereist is om het krediet op de in de reclame-uiting genoemde
      voorwaarden te verkrijgen: de verplichting daartoe en de kosten daarvan, of voor zover deze niet vooraf kunnen
      worden bepaald, een indicatie van die kosten;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel74
  - number: 7:4.1.g
    text: andere kosten die deel uitmaken van de totale kosten van het krediet;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel74
  - number: 7:4.1.h
    text: de maandlast.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel74
  - number: 7:4.2
    text: |-
      Een financiëledienstverlener geeft de informatie, bedoeld in het eerste lid, indien deze wordt verstrekt in een
      reclame-uiting over krediet, anders dan via de televisie of radio, gecombineerd weer in een tabel waarin geen
      andere informatie wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel74
  - number: 7:4.3
    text: |-
      Indien een financiëledienstverlener in een reclame-uiting over krediet reclame maakt voor met krediet aan te
      schaffen goederen of diensten, vermeldt zij daarbij het effectieve rentepercentage op jaarbasis en andere kosten
      die deel uitmaken van de totale kosten van het krediet.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel74
  - number: 7:4.4
    text: |-
      Indien een reclame-uiting betrekking heeft op een krediet met een effectief rentepercentage dat voor een beperkte
      duur geldt, wordt in die reclame-uiting tevens melding gemaakt van de periode gedurende welke het aangeboden
      effectieve rentepercentage geldt, alsmede van het hoogste effectieve rentepercentage gedurende de looptijd van
      de kredietovereenkomst.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel74
  - number: 7:4.5
    text: |-
      Indien een reclame-uiting een termijnlast bevat, wordt in de reclame-uiting de gewogen gemiddelde termijnlast die
      op het krediet van toepassing is, genoemd.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel74
  - number: 7:4.6
    text: |-
      De informatie, bedoeld in het eerste, derde, vierde en vijfde lid, heeft alleen betrekking op kredieten die
      representatief zijn voor de kredieten die feitelijk door de financiëledienstverlener worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel74
  - number: 7:5
    text: |-
      Voordat een consument of cliënt een verplichting aangaat met betrekking tot een financieel product of een
      financiële dienst, verstrekt de financiëledienstverlener de consument of cliënt ten minste de informatie met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel75
  - number: 7:5.a
    text: zijn rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel75
  - number: 7:5.b
    text: |-
      zijn naam, adres en contactgegevens en, indien de financiëledienstverlener een rechtspersoon is, de statutaire naam
      en handelsnaam of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel75
  - number: 7:5.c
    text: de aard van de financiële dienstverlening;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel75
  - number: 7:5.d
    text: zijn inschrijving in het door de toezichthouder gehouden register;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel75
  - number: 7:5.e
    text: |-
      zijn interne klachtenprocedure als bedoeld in [artikel 3:12, eerste lid, van de wet][ref1], en voor zover van
      toepassing, de erkende geschilleninstantie waarbij hij is aangesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 7:5.f
    text: het recht dat op de verplichting van toepassing is of de door de financiëledienstverlener voorgestelde rechtskeuze;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel75
  - number: 7:5.g
    text: |-
      de wijze waarop de verplichting kan worden beëindigd, de termijn die daarbij in acht moet worden genomen, de aan de
      beëindiging verbonden kosten en de overige gevolgen van beëindiging van de verplichting.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel75
  - number: 7:6.1
    text: |-
      Voorafgaande aan de totstandkoming van een overeenkomst inzake krediet verstrekt de kredietaanbieder een consument,
      onverminderd [artikel 7:5][ref1], ten minste de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7:6.1.a
    text: |-
      een globale omschrijving van de wijze waarop de kredietaanbieder invulling geeft aan de kredietwaardigheidstoets,
      bedoeld in [artikel 5:14 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 7:6.1.b
    text: het soort krediet;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
  - number: 7:6.1.c
    text: het kredietbedrag;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
  - number: 7:6.1.d
    text: de duur van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
  - number: 7:6.1.e
    text: de totale kosten van het krediet;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
  - number: 7:6.1.f
    text: het totale door de consument te betalen bedrag;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
  - number: 7:6.1.g
    text: het effectieve rentepercentage op jaarbasis;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
  - number: 7:6.1.h
    text: |-
      indien het aangaan van een andere verplichting vereist is om het krediet te verkrijgen: de aard en de kosten, of
      voor zover dit niet vooraf kan worden bepaald, een indicatie daarvan;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
  - number: 7:6.1.i
    text: andere kosten die deel uitmaken van de totale kosten van het krediet;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
  - number: 7:6.1.j
    text: |-
      de maandlast en, indien de afbetalingstermijnen niet maandelijks zijn, de termijnlast en het bijbehorende aantal
      termijnen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
  - number: 7:6.1.k
    text: |-
      indien de verplichting, bedoeld in onderdeel h, betrekking heeft op een financieel product of financiële dienst,
      niet zijnde een betaalrekening als bedoeld in [artikel 5:16, eerste lid, onderdeel a, van de wet][ref1]: de
      vermelding dat de consument het recht heeft te bepalen met welke wederpartij die andere verplichting zal worden
      aangegaan;


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 7:6.1.l
    text: |-
      indien het effectieve rentepercentage voor beperkte duur geldt of indien een variabel effectief rentepercentage
      geldt: de periode gedurende welke dat rentepercentage geldt, alsmede de hoogte van de verschillende effectieve
      rentepercentages die van toepassing zijn op de overeenkomst, of indien dat nog niet kan worden vastgesteld, de
      wijze waarop de hoogte van het rentepercentage wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
  - number: 7:6.1.m
    text: |-
      het kredietvergoedingspercentage met een beschrijving van de hierin opgenomen kosten, het hoogst toegestane
      kredietvergoedingspercentage, bedoeld in [artikel 5:15, eerste lid, van de wet][ref1], en de vermelding van de
      vernietigingsgrond, bedoeld in artikel 5:15, derde lid, van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 7:6.1.n
    text: de voorwaarden inzake de bevoegdheid van de consument tot volledige of gedeeltelijke vervroegde aflossing;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
  - number: 7:6.1.o
    text: |-
      het percentage dat wordt toegepast ter berekening van de vertragingsvergoeding die verschuldigd wordt, indien
      de consument, na ingebrekestelling, nalatig blijft in zijn verplichting tot betaling, onder vermelding van de
      hoogst toegestane vertragingsvergoeding op grond van [artikel 5:15, eerste lid, van de wet][ref1], alsmede de in
      voorkomend geval in rekening te brengen buitengerechtelijke incassokosten;


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 7:6.1.p
    text: |-
      de wijze waarop de consument gebruik kan maken van zijn recht, bedoeld in [artikel 5:17 van de wet][ref1], om de
      overeenkomst te ontbinden;


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 7:6.1.q
    text: voor zover van toepassing de voorwaarden inzake ten behoeve van de kredietaanbieder te vestigen zekerheidsrechten.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
  - number: 7:6.2
    text: |-
      De informatie, bedoeld in het eerste lid, onderdelen b tot en met l, wordt op overzichtelijke wijze weergegeven in
      één document.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
  - number: 7:6.3
    text: |-
      De informatie, bedoeld in het eerste lid, wordt gebaseerd op de door de consument met betrekking tot het krediet
      kenbaar gemaakte voorkeur.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
  - number: 7:6.4
    text: |-
      De aanbieder verstrekt de consument, teneinde deze in staat te stellen te beoordelen of de voorgestelde
      overeenkomst inzake krediet aan zijn behoeften en financiële situatie beantwoordt, een passende toelichting op
      de informatie op de voornaamste kenmerken van het voorgestelde krediet, met inbegrip van de gevolgen indien de
      consument niet betaalt. In afwijking van [artikel 7:2][ref1] kan deze toelichting mondeling worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7:7
    text: |-
      Voorafgaande aan de totstandkoming van een overeenkomst inzake een levensverzekering verstrekt een
      levensverzekeraar een cliënt, onverminderd [artikel 7:5][ref1], ten minste de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7:7.a
    text: |-
      het bedrag van de uitkering of uitkeringen waartoe hij zich verplicht of, voorzover dit bedrag niet op voorhand
      nauwkeurig kan worden bepaald, een nauwkeurige omschrijving van die uitkering of uitkeringen, alsmede van de
      factoren waarvan de hoogte van de uitkering of uitkeringen afhankelijk is;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.b
    text: |-
      een omschrijving van de keuzemogelijkheden die de cliënt of de gerechtigde op een uitkering heeft ingevolge de
      overeenkomst;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.c
    text: |-
      een nauwkeurige omschrijving van de valuta waarin de premie of de uitkering is uitgedrukt, indien dat een andere
      valuta is dan de dollar, of van de units, eenheden of datgene waarin de premie of de uitkering anderszins is
      uitgedrukt, of, indien de uitkering strekt tot het verrichten van andere dan geldelijke prestaties, van die
      prestaties;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.d
    text: |-
      indien bij een uitkering omzetting plaatsvindt in dollars of een andere valuta: een nauwkeurige omschrijving van
      de omzettingsmethode;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.e
    text: |-
      indien de uitkering in waarden wordt uitgedrukt: de vermelding van de aard van de waarden, waaronder aandelen of
      andersoortige rechten van deelneming in een beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.f
    text: 'indien de overeenkomst een recht op winstdeling omvat: de wijze van berekening en toewijzing van de winstdeling;'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.g
    text: de looptijd van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.h
    text: |-
      de premie, verschuldigd voor de hoofddekking, en, indien de overeenkomst voorziet in een of meer nevenuitkeringen,
      de premies die voor elk van de nevenuitkeringen zijn verschuldigd, alsmede, indien deze premies gedurende de
      looptijd fluctueren, een zo nauwkeurig mogelijke beschrijving van de wijze waarop ze worden berekend en van de
      factoren waardoor het beloop ervan wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.i
    text: een opgave of de premie eenmalig is verschuldigd dan wel periodiek;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.j
    text: de periode gedurende welke premie verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.k
    text: de kosten die naast de brutopremie in rekening worden gebracht;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.l
    text: 'indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.l.1°
    text: |-
      de kosten die worden ingehouden op de premie, bedoeld in onderdeel h, onderverdeeld naar eerste kosten, doorlopende
      kosten en aan- en verkoopkosten;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.l.2°
    text: |-
      de kosten die worden ingehouden op de waarde van de rechten van deelneming, onderverdeeld naar eerste kosten,
      doorlopende kosten en aan- en verkoopkosten;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.l.3°
    text: |-
      de kosten die de beheerder van de beleggingsinstelling jaarlijks in rekening brengt voor het beheer van de rechten
      van deelneming in die beleggingsinstelling;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.l.4°
    text: |-
      de invloed van het gemiddelde jaarlijkse percentage van de kosten, bedoeld onder 1°, 2° en 3°, op het rendement en
      de uitkering, verbonden aan de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.l.5°
    text: |-
      de wijze waarop kosten als bedoeld onder 1°, 2° en 3°, worden verdeeld over de looptijd van de overeenkomst met
      de cliënt;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.m
    text: |-
      een omschrijving van de gevolgen van een verhoging of verlaging van de premie, met inbegrip van premievrijmaken,
      en, indien de overeenkomst in die mogelijkheid voorziet, van afkoop, en een opgave van de afkoopwaarde gedurende
      ten minste de eerste vijf jaren van de looptijd, onder vermelding van het voor de berekening gehanteerde
      rendementspercentage;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:7.n
    text: |-
      de wijze waarop de cliënt gebruik kan maken van zijn recht, bedoeld in [artikel 5:18 van de wet][ref1], om de
      overeenkomst te ontbinden;


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 7:7.o
    text: het aan de overeenkomst verbonden financiële risico en de mate waarin dit risico voor rekening is van de cliënt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel77
  - number: 7:8.1
    text: |-
      Voorafgaande aan de totstandkoming van een overeenkomst inzake een natura-uitvaartverzekeringverstrekt een natura-
      uitvaartverzekeraar een cliënt, onverminderd [artikel 7:5][ref1], de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7:8.1.a
    text: een omschrijving van de prestatie waartoe de natura-uitvaartverzekeraar zich verplicht;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel78
  - number: 7:8.1.b
    text: een omschrijving van de keuzemogelijkheden die de cliënt of de verzekerde ingevolge de overeenkomst heeft;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel78
  - number: 7:8.1.c
    text: een opgave of de premie eenmalig is verschuldigd dan wel periodiek;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel78
  - number: 7:8.1.d
    text: de periode gedurende welke premie verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel78
  - number: 7:8.1.e
    text: een opgave van de indexering die wordt toegepast op de verzekerde prestatie of op de premie;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel78
  - number: 7:8.1.f
    text: de overige mogelijkheden die de aanbieder heeft om de verzekerde prestatie of de premie aan te passen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel78
  - number: 7:8.1.g
    text: |-
      een opgave of indicatie van de afkoop- of premievrije waarde of een opgave van de wijze waarop deze waarden worden
      berekend;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel78
  - number: 7:8.1.h
    text: |-
      de wijze waarop de cliënt gebruik kan maken van zijn recht, bedoeld in [artikel 5:18 van de wet][ref1], om de
      overeenkomst te ontbinden;


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 7:8.1.i
    text: |-
      een opgave van de uitvaartonderneming die de uitvaart zal verzorgen, dan wel van de wijze waarop wordt bepaald
      welke uitvaartonderneming de uitvaart zal verzorgen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel78
  - number: 7:8.2
    text: |-
      Indien de termijn van beëindiging, bedoeld in [artikel 7:5, eerste lid, onderdeel g][ref1], langer is dan een jaar,
      maakt de natura-uitvaartverzekeraar dit op een opvallende wijze uitdrukkelijk kenbaar aan de cliënt, bij gebreke
      waarvan een opzegtermijn van een jaar geldt ongeacht het in de overeenkomst bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7:9
    text: |-
      Voorafgaande aan de totstandkoming van een verzekeringsovereenkomst tot dekking van wettelijke aansprakelijkheid,
      voortvloeiend uit het gebruik van motorrijtuigen, verstrekt een schadeverzekeraar met zetel in het buitenland die
      door middel van het verrichten van diensten vanuit een vestiging in het buitenland in de openbare lichamen zodanige
      verzekeringen aanbiedt, een cliënt, onverminderd [artikel 7:5][ref1], de naam en het adres van de ingevolge
      [artikel 6:8, eerste lid][ref2], door hem aangestelde schade-afhandelaar.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel6
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 7:10
    text: |-
      Indien een overeenkomst inzake een levensverzekering, niet zijnde een overlijdensrisicoverzekering, tot stand
      komt door tussenkomst van een bemiddelaar, informeert die bemiddelaar de cliënt tijdig voorafgaande aan de
      totstandkoming van de desbetreffende overeenkomst over de hoogte van de provisie die hij in verband met deze
      bemiddeling ontvangt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel710
  - number: 7:11.1
    text: |-
      In afwijking van de [artikelen 7:7, eerste lid][ref1], en [7:8, eerste lid][ref2], mag de in die artikelen
      bedoelde informatie ook onmiddellijk na de totstandkoming van de overeenkomst inzake een levensverzekering,
      onderscheidenlijk natura-uitvaartverzekering, worden verstrekt, of uiterlijk tegelijkertijd met het afgeven van
      de polis, indien de cliënt het recht heeft zonder een boete verschuldigd te zijn en zonder opgave van redenen de
      overeenkomst inzake binnen dertig kalenderdagen na de dag waarop hij de informatie heeft ontvangen, terugwerkend
      tot de datum van de totstandkoming van de overeenkomst, te ontbinden en de cliënt is geïnformeerd over de wijze
      waarop hij gebruik kan maken van dat recht.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel711
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7:11.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de ingevolge [artikel 7:5][ref1] voorafgaand aan een
      overeenkomst inzake een schadeverzekering te verstrekken informatie, met dien verstande dat de termijn van
      ontbinding in dat geval veertien kalenderdagen bedraagt en de ontbinding geen terugwerkende kracht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel711
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7:12.1
    text: |-
      Gedurende de looptijd van een overeenkomst inzake krediet met een variabel effectieve rentepercentage informeert
      de kredietaanbieder de consument over elke wijziging van de effectieve rentevoet, waarbij hij, voor zover van
      toepassing, de consument tevens informeert over gevolgen hiervan voor de termijnlast.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel712
  - number: 7:12.2
    text: |-
      Gedurende de looptijd van een overeenkomst inzake krediet verstrekt de kredietaanbieder de consument op diens
      verzoek een gespecificeerd overzicht van het uitstaand saldo. Hij kan daarbij een vergoeding in rekening brengen
      van ten hoogste het bedrag van de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel712
  - number: 7:12.3
    text: |-
      Tot een jaar na de afwikkeling van een overeenkomst inzake krediet verstrekt de kredietaanbieder aan de consument
      op diens verzoek kosteloos een gespecificeerde afrekening.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel712
  - number: 7:13.1
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een levensverzekering verstrekt een levensverzekeraar de cliënten
      minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel713
  - number: 7:13.1.a
    text: een wijziging van de polisvoorwaarden, voor zover redelijkerwijs relevant;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel713
  - number: 7:13.1.b
    text: |-
      voor zover zulks niet blijkt uit de wijziging van de polisvoorwaarden, bedoeld in onderdeel a: iedere wijziging
      van de overeenkomst met betrekking tot de in de [artikelen 7:5, eerste lid, onderdelen b en d][ref1], en
      [7:7, eerste lid, met uitzondering van onderdeel n][ref2], bedoelde onderwerpen of van de op die onderdelen van
      toepassing zijnde regelgeving;


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel713
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7:13.1.c
    text: de jaarlijkse winstdeling;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel713
  - number: 7:13.1.d
    text: |-
      indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling: een jaarlijkse opgave
      over het voorafgaande jaar van:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel713
  - number: 7:13.1.d.1°
    text: de waarde-ontwikkeling van het opgebouwde kapitaal;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel713
  - number: 7:13.1.d.2°
    text: |-
      de door de cliënt betaalde premies als bedoeld in [artikel 7:7, eerste lid, onderdeel h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel713
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7:13.1.d.3°
    text: |-
      met de cliënt verrekende kosten als bedoeld in [artikel 7:7, eerste lid, onderdeel l, onder 1°, 2° en 3°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel713
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7:13.1.d.4°
    text: het op het opgebouwde kapitaal behaalde rendement;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel713
  - number: 7:13.1.e
    text: |-
      indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling: een jaarlijkse prognose
      van de hoogte van het eindkapitaal op basis van een pessimistische voorspelling of het historisch rendement;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel713
  - number: 7:13.1.f
    text: |-
      indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling: het gevoerde beheer van
      de beleggingsinstelling; en
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel713
  - number: 7:13.1.g
    text: |-
      indien de cliënt daarom verzoekt: een opgave van de premievrije waarde op de einddatum van de verzekering,
      onder vermelding van het voor de berekening gehanteerde rendementspercentage, of een opgave van de wegens afkoop
      verschuldigde kosten en de actuele afkoopwaarde.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel713
  - number: 7:13.2
    text: |-
      Indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling verstrekt de
      levensverzekeraar, onverminderd het eerste lid, aanhef en onderdeel g, aan de cliënt die verzoekt zijn premie
      te verhogen of te verlagen of zijn polis premievrij te maken, een aan de nieuwe premie aangepaste opgave
      overeenkomstig [artikel 7:7, eerste lid, onderdeel l, onder 1°, 2° en 3°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel713
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7:14
    text: |-
      Gedurende de looptijd van een overeenkomst inzake een natura-uitvaartverzekering verstrekt een natura-
      uitvaartverzekeraar de cliënt, ten minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel714
  - number: 7:14.a
    text: een wijziging van de polisvoorwaarden, voor zover redelijkerwijs relevant;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel714
  - number: 7:14.b
    text: |-
      voorzover zulks niet blijkt uit de wijziging van de polisvoorwaarden, bedoeld in onderdeel a: iedere wijziging van
      de overeenkomst ten aanzien van de in de [artikel 7:5, eerste lid, onderdelen b en d][ref1], en [7:8][ref2], met
      uitzondering van onderdeel h, bedoelde onderwerpen of van de op die onderdelen van toepassing zijnde regelgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel714
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7:15
    text: |-
      Een schadeverzekeraar met zetel in het buitenland die door middel van het verrichten van diensten vanuit
      een vestiging in het buitenland in de openbare lichamen verzekeringen aanbiedt tot dekking van wettelijke
      aansprakelijkheid, voortvloeiend uit het gebruik van motorrijtuigen, stelt de cliënt binnen twee weken in kennis
      van een wijziging in de naam of het adres van de ingevolge [artikel 6:8, eerste lid][ref1], door hem aangestelde
      schade-afhandelaar.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel6
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel715
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 7:16.1
    text: |-
      Een gevolmachtigde of ondergevolmachtigde agent die voor rekening van een verzekeraar een verzekering heeft
      gesloten, vermeldt in de polis dan wel in een daaraan toegevoegd aanhangsel de naam van de verzekeraar en, in geval
      van co-assurantie, het aandeel dat hij namens de verzekeraar heeft geaccepteerd. In geval van een schadeverzekering
      vermeldt hij tevens elke wijziging in het door hem namens de verzekeraar geaccepteerde aandeel in een aanhangsel.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel716
  - number: 7:16.2
    text: |-
      Wordt, nadat de gevolmachtigde of ondergevolmachtigde agent de verzekering heeft gesloten of, in geval van
      een schadeverzekering, het door de gevolmachtigde of ondergevolmachtigde agent geaccepteerde aandeel in de
      verzekering is gewijzigd, niet of niet onverwijld aan de cliënt een polis of aanhangsel gegeven, dan verstrekt de
      gevolmachtigde of ondergevolmachtigde agent de in het eerste lid bedoelde gegevens aan de cliënt binnen vier weken
      na het sluiten van de verzekering of na het aanbrengen van de wijziging. Behoort de verzekering tot de portefeuille
      van een bemiddelaar, dan verstrekt de gevolmachtigde of ondergevolmachtigde agent deze gegevens binnen twee weken
      aan deze bemiddelaar.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel716
  - number: 7:16.3
    text: |-
      Wordt, nadat een verzekering is gesloten of, in geval van een schadeverzekering, het door de verzekeraar
      geaccepteerde aandeel in de overeenkomst is gewijzigd, niet of niet onverwijld aan de cliënt een polis of
      aanhangsel afgegeven waarin de naam van de verzekeraar en, in geval van co-assurantie, diens aandeel of daarin
      aangebrachte wijziging is vermeld, dan verstrekt de bemiddelaar tot wiens portefeuille de verzekering behoort, deze
      gegevens binnen vier weken na het sluiten van de overeenkomst of na het aanbrengen van de wijziging aan de cliënt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel716
  - number: 7:16.4
    text: |-
      Het tweede en derde lid zijn niet van toepassing, indien binnen de desbetreffende termijn de verzekering is
      tenietgegaan en daaraan door de cliënt of andere belanghebbenden geen rechten meer kunnen worden ontleend.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel716
  - number: 7:16.5
    text: |-
      De gevolmachtigde agent onderscheidenlijk ondergevolmachtigde agent of de betrokken bemiddelaar stelt de cliënt
      desgevraagd onverwijld in kennis van de naam van de verzekeraar en, in geval van co-assurantie, van de aandelen die
      de verzekeraars hebben geaccepteerd of van wijzigingen die daarin zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel716
  - number: 7:17.1
    text: |-
      Ter voorkoming van overkreditering houdt een kredietaanbieder bij het bepalen van het ten hoogste aan een consument
      te verstrekken kredietbedrag rekening met diens huidige vaste en bestendige netto-inkomsten enerzijds en diens
      vaste uitgaven en, in voorkomend geval, aan andere kredietovereenkomsten verbonden financieringslasten anderzijds.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel717
  - number: 7:17.2
    text: |-
      Een kredietaanbieder verstrekt aan een consument geen krediet, voor zover de aan dat krediet verbonden maandelijkse
      financieringlasten de maandelijkse financieringsruimte van de consument overschrijden.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel717
  - number: 7:17.3
    text: 'De maandelijkse financieringsruimte, bedoeld in het tweede lid, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel717
  - number: 7:17.3.a
    text: |-
      indien de netto-inkomsten van de consument niet meer bedragen dan diens leefbedrag: 6% van het op hem van
      toepassing zijnde normbedrag;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel717
  - number: 7:17.3.b
    text: |-
      indien de netto-inkomsten van de consument meer bedragen dan diens leefbedrag: de som van 6% van het op hem van
      toepassing zijnde normbedrag en een bedrag dat gelijk is aan [(netto-inkomsten – leefbedrag)2 / netto-inkomsten].
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel717
  - number: 7:17.4
    text: |-
      Indien de consument reeds andere kredietovereenkomsten is aangegaan, worden de op maandbasis aan die andere
      overeenkomsten verbonden financieringslasten in mindering gebracht op zijn ingevolge het derde lid berekende
      financieringsruimte.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel717
  - number: 7:17.5
    text: |-
      Het leefbedrag, bedoeld in het derde lid, wordt bepaald door het op de consument van toepassing zijnde normbedrag
      te verminderen met het bijbehorende bedrag aan forfaitaire woonlasten en te vermeerderen met de werkelijke
      woonlasten van de consument.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel717
  - number: 7:17.6
    text: |-
      Het normbedrag, bedoeld in het derde lid, wordt vastgesteld bij regeling van Onze minister en bestaat uit een
      forfaitair bedrag aan woonlasten en een forfaitair bedrag aan overige vaste lasten. Dit normbedrag kan verschillend
      worden vastgesteld voor de verschillende huishoudensamenstellingen, alsmede voor de verschillende openbare
      lichamen, en kan periodiek worden herzien.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel717
  - number: 7:17.7
    text: |-
      Een aanbieder kan in plaats van het leefbedrag de werkelijke vaste uitgaven van de consument en, indien van
      toepassing, van andere personen met wie de consument een duurzame gezamenlijke huishouding voert, gebruiken bij de
      berekening in het derde lid, voor zover de aanbieder voldoet aan [artikel 7:19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel717
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: 7:17.8
    text: |-
      De aanbieder verstrekt geen consumptief krediet met een looptijd van meer dan vijf jaren, tenzij de economische
      levensduur van het met het krediet aan te schaffen goed langer is dan vijf jaren.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel717
  - number: 7:18.1
    text: |-
      Bij de berekening van de netto-inkomsten van de aanvrager van een krediet mag rekening gehouden worden met de
      inkomsten van andere personen met wie de aanvrager een duurzame gezamenlijke huishouding voert.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel718
  - number: 7:18.2
    text: |-
      Bij de berekening van de financieringslasten van de aanvrager worden de financieringslasten van andere personen met
      wie de aanvrager een duurzame gezamenlijke huishouding voert, meegerekend.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel718
  - number: 7:19.1
    text: |-
      Een kredietaanbieder legt de criteria vast die hij, met inachtneming van [artikel 7:17][ref1], ten grondslag legt
      aan de beoordeling van kredietaanvragen van consumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel719
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: 7:19.2
    text: |-
      Een kredietaanbieder mag in individuele gevallen afwijken van de [artikelen 7:17][ref1] en [7:18][ref2], mits
      aantoonbaar aan de volgende voorwaarden wordt voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel719
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: 7:19.2.a
    text: de overeenkomst inzake krediet is gelet op het risico van overkreditering verantwoord;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel719
  - number: 7:19.2.b
    text: de aanbieder heeft de juistheid gecontroleerd van de feiten en omstandigheden waarop de afwijking is gebaseerd;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel719
  - number: 7:19.2.c
    text: |-
      de aanbieder heeft vastgesteld dat het aannemelijk is dat aanleiding voor de afwijking een aanhoudende situatie
      betreft;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel719
  - number: 7:19.2.d
    text: |-
      de afwijking wordt gemotiveerd en vastgelegd en met documenten onderbouwd, en het bevat een duidelijke berekening
      waaruit blijkt dat de afwijkende situatie getoetst is op het voorkomen van overkreditering.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel719
  - number: 7:20.1
    text: |-
      De hoogst toegelaten kredietvergoeding wordt uitgedrukt in een effectief percentage op jaarbasis aan totale kosten
      ten opzichte van het kredietbedrag. Dit percentage wordt bij regeling van Onze minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel720
  - number: 7:20.2
    text: |-
      Het kredietvergoedingspercentage dat van toepassing is op een overeenkomst inzake krediet wordt berekend als volgt:
      waarin: '*KVP* = kredietvergoedingspercentage per jaar; *k* = nominale kredietvergoedingspercentage per jaar.'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel720
  - number: 7:20.3
    text: |-
      Het nominale kredietvergoedingspercentage per jaar wordt berekend door het nominale kredietvergoedingspercentage
      per maand te vermenigvuldigen met twaalf.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel720
  - number: 7:20.4
    text: |-
      Het nominale kredietvergoedingspercentage per maand wordt berekend als volgt: waarin: *PMT* =
      maandelijkse annuïteit; *KB* = kredietbedrag; *n* = het aantal maandelijkse termijnen; *k* = nominale
      kredietvergoedingspercentage per maand.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel720
  - number: 7:20.5
    text: |-
      De maandelijkse annuïteit wordt berekend als volgt: waarin: *TB* = totaalbedrag, zijnde het kredietbedrag plus alle
      kosten, niet zijnde rente, uitgedrukt in contante waarde op het moment van het aangaan van de overeenkomst inzake
      krediet; *i* = nominale rentepercentage per maand, gedeeld door honderd.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel720
  - number: 7:20.6
    text: |-
      Indien het totale door de consument te betalen bedrag wordt afgelost in andere termijnen dan maandelijkse
      termijnen, gaat de kredietaanbieder bij de berekening van het kredietvergoedingspercentage, bedoeld in het tweede
      lid, uit van de op het krediet van toepassing zijnde aflossingstermijnen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel720
  - number: 7:20.7
    text: |-
      Indien de kosten, bedoeld in het eerste lid, enkel bestaat uit rente, is het kredietvergoedingspercentage gelijk
      aan het effectieve rentepercentage dat wordt berekend als volgt: waarin: *r* = effectieve rentepercentage per jaar;
      *i* = nominale rentepercentage per jaar, gedeeld door honderd; *n* = aantal termijnen per jaar.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel720
  - number: 7:20.8
    text: |-
      Indien het nominale rentepercentage niet constant is gedurende de looptijd van de kredietovereenkomst, gebruikt
      de kredietaanbieder het gewogen gemiddelde rentepercentage, of ingeval dat nog niet kan worden vastgesteld, het
      hoogste rentepercentage gedurende de looptijd van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel720
  - number: 7:21
    text: De ten hoogste toegelaten vertragingsvergoeding wordt bij regeling van Onze minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel721
  - number: 7:22.1
    text: |-
      De beloning van een assurantiebemiddelaar bestaat, behoudens [artikel 7:23, tweede lid][ref1], uitsluitend uit
      provisie ter zake van het bemiddelen bij het afsluiten van verzekeringen, het bemiddelen bij het verlengen van
      verzekeringen of het incasseren van premies.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel722
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '6'
  - number: 7:22.2
    text: |-
      De in het eerste lid bedoelde provisie staat in een redelijke verhouding tot de werkzaamheden die noodzakelijk zijn
      voor een adequate dienstverlening of die bijdragen aan de kwaliteit van de dienstverlening.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel722
  - number: 7:22.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing op de provisie die een aanbieder van een financieel product, niet
      zijnde een verzekering, voor het bemiddelen of adviseren inzake dat financiële product verschaft.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel722
  - number: 7:23.1
    text: |-
      Het is een assurantiebemiddelaar verboden aan een verzekeringnemer dan wel aan hen te wier behoeve een verzekering
      is gesloten in geval van schade een afmakingscourtage in rekening te brengen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel723
  - number: 7:23.2
    text: |-
      Van het verbod, bedoeld in het eerste lid, kan de Autoriteit Financiële Markten voor bij regeling van Onze
      Minister te bepalen vormen van verzekering ontheffing verlenen aan de assurantiebemiddelaar die ten genoegen van de
      Autoriteit Financiële Markten aantoont dat hij daartoe over het geschikte bedrijfsapparaat en expertise beschikt en
      de redelijkerwijs van hem te eisen inspanningen bij de schadeafwikkeling kan verrichten.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel723
  - number: 7:23.3
    text: |-
      De Autoriteit Financiële Markten kan de beoordeling van de kwaliteit van het bedrijfsapparaat, de expertise en de
      procedures voor de afwikkeling van schaden ten laste van de betreffende assurantiebemiddelaar door een deskundige
      derde laten doen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel723
  - number: 7:23.4
    text: |-
      De afmakingscourtage die in rekening mag worden gebracht, bedraagt ten hoogste één procent van het aan de
      verzekerde uit te keren schadebedrag.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel723
  - number: 7:23.5
    text: |-
      De in het tweede lid bedoelde ontheffing geldt voor een periode van drie jaren en kan telkenmale met drie jaren
      worden verlengd.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel723
  - number: 7:24.1
    text: |-
      Het is verboden ter zake van een verzekering direct of indirect provisie, retourprovisie of enig ander op geld
      waardeerbaar voordeel toe te kennen, af te staan of te beloven aan anderen dan de assurantiebemiddelaar tot wiens
      portefeuille de verzekering behoort, onverminderd [artikel 6:9, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel6
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel724
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 7:24.2
    text: |-
      De Autoriteit Financiële Markten kan, in aanvulling op [artikel 1:12, eerste lid][ref1], ontheffing verlenen van
      het verbod, bedoeld in het eerste lid, indien het verbod strijdig is met algemeen erkende gebruiken of het algemeen
      belang van het verzekeringsbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel1
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel724
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '1'
        hoofdstuk: '1'
  - number: 8:1.1
    text: |-
      Het prospectus, bedoeld in [artikel 5:19, eerste lid, van de wet][ref1], bevat ten minste de bij regeling van Onze
      Minister te bepalen gegevens, waarbij onderscheid wordt gemaakt tussen de volgende categorieën effecten:


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 8:1.1.a
    text: |-
      aandeelbewijzen, optiebewijzen, warrants, inschrijvingen in aandelenregisters, winst- en oprichtersbewijzen,
      rechten van deelgenootschap, en soortgelijke waardepapieren dan wel rechten;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel81
  - number: 8:1.1.b
    text: schuldbrieven, inschrijvingen in schuldregisters, en soortgelijke waardepapieren dan wel rechten;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel81
  - number: 8:1.1.c
    text: certificaten van aandelen en soortgelijke waardepapieren;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel81
  - number: 8:1.1.d
    text: opties en soortgelijke rechten;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel81
  - number: 8:1.1.e
    text: rechten op overdracht op termijn van goederen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel81
  - number: 8:1.1.f
    text: recepissen van waarden als hiervoor bedoeld.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel81
  - number: 8:1.2
    text: De Autoriteit Financiële Markten kan regels stellen met betrekking tot de indeling van het prospectus.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel81
  - number: 8:2
    text: |-
      De Autoriteit Financiële Markten kan verlangen dat een prospectus als bedoeld in
      [artikel 5:19, eerste lid, van de wet][ref1] in een of meer door haar te bepalen talen wordt gesteld, indien dit,
      gelet op de voorgenomen of mogelijke verspreiding van het prospectus, naar haar oordeel noodzakelijk is voor een
      adequate informatieverschaffing aan de beleggers. Zij kan aanwijzingen geven ten aanzien van de wijze waarop het
      prospectus algemeen verkrijgbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 8:3.1
    text: |-
      Alle belangrijke nieuwe feiten die zich voordoen of worden geconstateerd tussen het tijdstip van goedkeuring van
      een prospectus als bedoeld in [artikel 5:19, eerste lid, van de wet][ref1] en het tijdstip waarop de aanbieding
      van de effecten eindigt of de handel in de effecten aanvangt, en die van belang kunnen zijn voor de beoordeling
      van het vermogen, de financiële positie, het resultaat en de vooruitzichten van de uitgevende instelling en van de
      rechten en verplichtingen die aan de effecten zijn verbonden, alsmede materiële onvolledigheden, onnauwkeurigheden
      of onjuistheden in het prospectus, worden vermeld of gecorrigeerd in een document dat ter aanvulling van het
      prospectus algemeen verkrijgbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 8:3.2
    text: |-
      Het in het eerste lid bedoelde document behoeft de goedkeuring van de Autoriteit Financiële Markten en wordt
      algemeen verkrijgbaar gesteld. [Artikel 8:2][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel8
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 8:4
    text: |-
      [Artikel 5:25, eerste lid, van de wet][ref1] is niet van toepassing op de volgende categorieën transacties:


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 8:4.a
    text: transacties in het kader van het monetaire beleid, het valutabeleid of het beheer van de overheidsschuld;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel84
  - number: 8:4.b
    text: |-
      het in het kader van een personeelsregeling aan personen als bedoeld in [artikel 3:5, eerste lid, van de wet][ref1]
      of aan werknemers toekennen van effecten, indien daarbij een bestendige gedragslijn wordt gehanteerd met betrekking
      tot de voorwaarden en de periodiciteit van de regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 8:4.c
    text: |-
      het in het kader van een personeelsregeling als bedoeld in onderdeel b uitoefenen van toegekende opties dan
      wel soortgelijke rechten, op de expiratiedatum van het desbetreffende recht of binnen een periode van vijf
      werkdagen voorafgaande aan die datum, alsmede het verkopen van de met de uitoefening van deze rechten verworven
      effecten binnen deze periode, indien de rechthebbende in dit laatste geval ten minste vier maanden voor de
      expiratiedatum schriftelijk aan de uitgevende instelling kenbaar heeft gemaakt tot verkoop te zullen overgaan of
      een onherroepelijke volmacht tot verkoop aan de uitgevende instelling heeft verleend;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel84
  - number: 8:4.d
    text: |-
      een transactie waarvan het verrichten of bewerkstelligen noodzakelijk is om te kunnen voldoen aan een verplichting
      tot levering van aandelen of certificaten van aandelen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel84
  - number: 8:4.e
    text: |-
      het bij wijze van dividenduitkering uitgeven of, anders dan in de vorm van keuzedividend, verkrijgen van aandelen
      of certificaten van aandelen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel84
  - number: 8:4.f
    text: |-
      het verkopen van in het kader van een personeelsregeling als bedoeld in onderdeel b toegekende effecten
      onmiddellijk nadat verkoop volgens de voorwaarden van de toekenning voor het eerst mogelijk wordt, waarbij
      de betrokkene de opbrengst van de verkoop onmiddellijk aanwendt ter voldoening van een uit de toekenning
      voortvloeiende belastingplicht.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel84
  - number: 8:5.1
    text: |-
      [Artikel 5:27, eerste lid, van de wet][ref1] is niet van toepassing op het verrichten of bewerkstelligen van
      transacties in het kader van het monetaire beleid, het valutabeleid of het beheer van de overheidsschuld. Op advies
      van de Autoriteit Financiële Markten kunnen bij regeling van Onze Minister andere transacties of handelsorders
      worden aangewezen waarop het verbod van artikel 5:27, eerste lid, van de wet niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 8:5.2
    text: |-
      [Artikel 5:27, tweede lid][ref1], is niet van toepassing op het verspreiden van informatie in het kader van het
      monetaire beleid, het valutabeleid of het beheer van de overheidsschuld.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel5
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '5'
  - number: 8:6
    text: |-
      [Hoofdstuk 6, paragrafen 2][ref1] en [3][ref2], is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0031636
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031636
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 8:6.a
    text: |-
      vennootschappen waarvan op de erkende effectenbeurzen geen aandelen worden verhandeld die zonder toepassing van
      [artikel 6:2 van de wet][ref1] als stemgerechtigde aandelen zouden worden aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel6
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '6'
  - number: 8:6.b
    text: |-
      vennootschappen waarvan de statuten bepalen dat de aandeelhouder het recht heeft om, onder bij of krachtens de
      statuten vastgestelde voorwaarden, zijn aandelen in het kapitaal van de vennootschap te doen inkopen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel86
  - number: 8:6.c
    text: |-
      vennootschappen waarvan de belegging en het beheer van het vermogen contractueel is opgedragen aan een derde, mits
      zulks blijkt uit de statuten of bij de laatste emissie van aandelen aan de aandeelhouders en aan de inschrijvers op
      de emissie duidelijk kenbaar is gemaakt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel86
  - number: 9:1
    text: |-
      Voor de toepassing van dit hoofdstuk worden de hieronder opgenomen categorieën bestuurlijke boeten met daarbij
      behorende basisbedragen, minimumbedragen en maximumbedragen onderscheiden.








                  Boetecategorie


                  Basisbedrag


                  Minimumbedrag


                  Maximumbedrag






                  Eerste categorie


                  USD 500


                  USD 0


                  USD 2.000




                  Tweede categorie


                  USD 5.000


                  USD 0


                  USD 10.000




                  Derde categorie


                  USD 25.000


                  USD 0


                  USD 50.000
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel91
  - number: 9:2.1
    text: |-
      Overtreding van een in [bijlage 3][ref1] bij dit besluit genoemd voorschrift is beboetbaar met een bestuurlijke
      boete van de volgens die bijlage op overtreding van dat voorschrift van toepassing zijnde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0031636
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0031636
  - number: 9:2.2
    text: |-
      Het geen gevolg geven dan wel niet tijdig of onvolledig gevolg geven aan een krachtens
      [artikel 7:12, eerste lid, van de wet][ref1] gegeven aanwijzing is, indien de aanwijzing gegeven is ter zake
      van het niet voldoen aan een in [bijlage 3][ref2] genoemd voorschrift, beboetbaar met een bestuurlijke boete van
      dezelfde categorie als waarmee dat voorschrift beboetbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0031636
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0031636
  - number: 9:2.3
    text: |-
      Indien een aanwijzing als bedoeld in het tweede lid is gegeven ter zake van een voorschrift, niet zijnde een in
      [bijlage 3][ref1] genoemd voorschrift, is het geen gevolg dan wel niet tijdig of onvolledig gevolg geven aan die
      aanwijzing beboetbaar met een bestuurlijke boete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0031636
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0031636
  - number: 9:2.4
    text: |-
      Het geen gevolg geven dan wel niet tijdig of onvolledig gevolg geven aan een krachtens
      [artikel 7:12, tweede lid][ref1], of [7:13 van de wet][ref2] gegeven aanwijzing is beboetbaar met een bestuurlijke
      boete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel7
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0030883
        artikel: '7'
  - number: 9:3.1
    text: |-
      De toezichtautoriteit stelt een bestuurlijke boete vast op het basisbedrag, behorend bij de van toepassing zijnde
      categorie.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel93
  - number: 9:3.2
    text: |-
      De toezichtautoriteit verhoogt het basisbedrag van een in de eerste categorie op te leggen boete met ten hoogste
      300 procent van dat bedrag, indien de ernst of de duur van de overtreding een dergelijke verhoging rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel93
  - number: 9:3.3
    text: |-
      De toezichtautoriteit verlaagt of verhoogt het basisbedrag van een in de tweede of derde categorie op te leggen
      boete:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel93
  - number: 9:3.3.a
    text: |-
      met ten hoogste 50 procent van het basisbedrag, indien de ernst of de duur van de overtreding een dergelijke
      verlaging of verhoging rechtvaardigt;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel93
  - number: 9:3.3.b
    text: |-
      met ten hoogste 50 procent van het basisbedrag, indien de mate van verwijtbaarheid van de overtreding een
      dergelijke verlaging of verhoging rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel93
  - number: 9:4
    text: |-
      Het door de toezichtautoriteit met toepassing van [artikel 9:3][ref1] vast te stellen boetebedrag wordt verdubbeld,
      indien tijdens het plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een
      bestuurlijke boete aan de overtreder ter zake van eenzelfde overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel9
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '9'
        hoofdstuk: '9'
  - number: 9:5.1
    text: |-
      De toezichtautoriteit houdt bij het vaststellen van een bestuurlijke boete rekening met de draagkracht van de
      overtreder.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel95
  - number: 9:5.2
    text: |-
      De toezichtautoriteit kan op grond van het eerste lid de op te leggen boete verlagen met ten hoogste 100 procent
      van het op grond van de [artikelen 9:3][ref1] en [9:4][ref2] vastgestelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel9
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '9'
        hoofdstuk: '9'
  - number: 10:1.1
    text: |-
      Een herstelplan als bedoeld in [artikel 8:3, eerste lid, van de wet][ref1] vermeldt op welke wijze en binnen welke
      termijn een einde wordt gemaakt aan de omstandigheden die aanleiding gaven tot het verlangen van het herstelplan.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel8
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '8'
  - number: 10:1.2
    text: 'Het herstelplan bevat voor de eerstvolgende drie boekjaren ten minste gegevens betreffende:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel101
  - number: 10:1.2.a
    text: een raming van de kosten van beheer, met name van de algemene lopende kosten en de provisies;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel101
  - number: 10:1.2.b
    text: |-
      een gedetailleerde prognose van de vermoedelijke ontvangsten en uitgaven betreffende directe verzekeringen, de
      geaccepteerde herverzekeringen en overdrachten uit hoofde van herverzekering;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel101
  - number: 10:1.2.c
    text: de te verwachten balanspositie;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel101
  - number: 10:1.2.d
    text: een raming van de financiële middelen ter dekking van de verplichtingen en van de vereiste solvabiliteitsmarge;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel101
  - number: 10:1.2.e
    text: het algemene herverzekeringsbeleid.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel101
  - number: 10:1.3
    text: |-
      De Nederlandsche Bank kan aanvullende gegevens verlangen, indien dit nodig is voor een goede beoordeling van het
      herstelplan.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel101
  - number: 10:2.1
    text: |-
      Een saneringsplan als bedoeld in [artikel 8:5, eerste lid, van de wet][ref1] vermeldt op welke wijze en
      binnen welke termijn de solvabiliteitsmarge weer op de vereiste omvang zal worden gebracht. Indien ingevolge
      [artikel 8:3, eerste lid, van de wet][ref2] een herstelplan is vastgesteld waaraan instemming is verleend, vermeldt
      het saneringsplan tevens hoe het herstelplan daarin wordt verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel8
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0030883
        artikel: '8'
  - number: 10:2.2
    text: |-
      Een financieringsplan als bedoeld in [artikel 8:5, tweede lid, van de wet][ref1] vermeldt op welke wijze en
      binnen welke termijn de solvabiliteitsmarge weer op de vereiste omvang zal worden gebracht. Indien ingevolge
      [artikel 8:3, eerste lid, van de wet][ref2] een saneringsplan is vastgesteld waaraan instemming is verleend,
      vermeldt het financieringsplan tevens hoe het saneringsplan daarin wordt verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel8
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0030883
        artikel: '8'
  - number: 10a:1
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *deposito:* een tegoed dat wordt gevormd door op een rekening
      staande gelden of dat tijdelijk uit normale banktransacties voortvloeit, en dat een kredietinstelling onder de
      toepasselijke wettelijke en contractuele voorwaarden dient terug te betalen, met inbegrip van een termijndeposito
      en een spaardeposito, met uitzondering van een tegoed waarvan: a. het bestaan alleen kan worden aangetoond met
      behulp van een ander financieel product als bedoeld in [artikel 1, onderdeel c tot en met h, van de wet][ref1],
      tenzij het een betaal- of spaarrekening betreft die wordt belichaamd in een certificaat van deposito dat op naam
      luidt; b. de hoofdsom niet a pari terugbetaalbaar is; c. de hoofdsom alleen a pari terugbetaalbaar is uit hoofde
      van een door de kredietinstelling of door een derde verstrekte garantie of overeenkomst;
        - *depositogarantiestelsel:* het depositogarantiestelsel, bedoeld in [artikel 4:17 van de wet][ref2];
        - *gegarandeerd deposito:* een deposito voor zover dat gegarandeerd wordt uit hoofde van het
      depositogarantiestelsel.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a1
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0030883
        artikel: '4'
  - number: 10a:2.1
    text: |-
      De Nederlandsche Bank besluit onverwijld tot inwerkingstelling van het depositogarantiestelsel ten aanzien van
      een kredietinstelling waaraan op grond van de [Wet financiële markten BES][ref1] vergunning is verleend tot
      uitoefening van het bedrijf van kredietinstelling, met uitzondering van kredietverenigingen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a2
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 10a:2.1.a
    text: |-
      de kredietinstelling, om redenen die rechtstreeks verband houden met haar financiële positie, niet in staat is
      deposito's van depositohouders terug te betalen en zij daartoe ook op afzienbare termijn niet in staat kan worden
      geacht;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a2
  - number: 10a:2.1.b
    text: |-
      een rechterlijke beslissing die rechtstreeks verband houdt met de financiële positie van de betrokken
      kredietinstelling, leidt tot onmogelijkheid voor depositohouders om hun vorderingen op de kredietinstelling te
      verhalen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a2
  - number: 10a:2.2
    text: |-
      De Nederlandsche Bank geeft toepassing aan het eerste lid, aanhef en onder a, uiterlijk 21 dagen nadat zij voor het
      eerst heeft geconstateerd dat een kredietinstelling heeft nagelaten verschuldigde en betaalbare deposito’s onder de
      toepasselijke wettelijke en contractuele voorwaarden terug te betalen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a2
  - number: 10a:3.1
    text: |-
      Ingevolge het depositogarantiestelsel zijn deposito’s gegarandeerd tot een bedrag van USD 10.000 per persoon per
      kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a3
  - number: 10a:3.2
    text: |-
      Het depositogarantiestelsel garandeert deposito's, met uitzondering van deposito’s als bedoeld in
      [bijlage 2A][ref1], van personen:


      [ref1]: https://wetten.overheid.nl/BWBR0031636
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a3
    references:
      - id: ref1
        bwb_id: BWBR0031636
  - number: 10a:3.2.a
    text: die deposito's op eigen naam en voor eigen rekening bij de betalingsonmachtige kredietinstelling aanhouden;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a3
  - number: 10a:3.2.b
    text: die tezamen met een ander op eigen naam deposito's bij de betalingsonmachtige kredietinstelling aanhouden;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a3
  - number: 10a:3.2.c
    text: |-
      te wier behoeve door een derde, op naam van die derde, deposito's worden aangehouden bij de betalingsonmachtige
      kredietinstelling, mits:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a3
  - number: 10a:3.2.c.1°
    text: |-
      die deposito's worden aangehouden op grond van reeds voor de inwerkingstelling van het depositogarantiestelsel
      tussen de rekeninghouder en bedoelde personen geldende wettelijke of contractuele bepalingen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a3
  - number: 10a:3.2.c.2°
    text: |-
      de identiteit van bedoelde personen bij de kredietinstelling bekend is of aan de hand van een door de
      rekeninghouder gevoerde professionele administratie kan worden vastgesteld; en
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a3
  - number: 10a:3.2.c.3°
    text: |-
      de hoogte van de deposito’s aan de hand van reeds voor de inwerkingstelling van het depositogarantiestelsel
      vastgelegde gegevens kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a3
  - number: 10a:3.3
    text: |-
      Indien op gegarandeerde deposito’s rente is aangegroeid die nog niet is gecrediteerd op het tijdstip waarop op
      grond van [artikel 10A.2][ref1] besloten is tot inwerkingstelling van het depositogarantiestelsel, wordt het
      aangegroeide rentebedrag gerekend tot de deposito’s.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel10a
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a3
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a:4.1
    text: |-
      De Nederlandsche Bank doet van een besluit tot inwerkingstelling van het depositogarantiestelsel zo spoedig
      mogelijk mededeling in de Staatscourant, alsmede in andere media in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a4
  - number: 10a:4.2
    text: |-
      De Nederlandsche Bank verzoekt de bewindvoerders of curatoren van de betalingsonmachtige kredietinstelling om in
      hun correspondentie met depositohouders te wijzen op de inwerkingstelling van het depositogarantiestelsel en op de
      in [artikel 10A:5][ref1] bedoelde termijn voor indiening van een aanvraag tot vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel10a
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a4
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a:5.1
    text: |-
      Depositohouders kunnen uiterlijk een jaar na de datum van inwerkingstelling van het depositogarantiestelsel met
      gebruikmaking van een daartoe door de Nederlandsche Bank verkrijgbaar te stellen formulier een aanvraag indienen
      tot toekenning van een vergoeding van gegarandeerde deposito’s.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a5
  - number: 10a:5.2
    text: |-
      Aanvragen, ingediend na het verstrijken van de termijn, genoemd in het eerste lid, worden niet in behandeling
      genomen, tenzij de termijnoverschrijding redelijkerwijs niet aan de aanvrager kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a5
  - number: 10a:6.1
    text: |-
      De Nederlandsche Bank stelt aan de hand van de op het deposito toepasselijke wettelijke bepalingen en contractuele
      voorwaarden en de boekhouding van de betalingsonmachtige kredietinstelling vast of een deposito ingevolge het
      depositogarantiestelsel is gegarandeerd.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a6
  - number: 10a:6.2
    text: |-
      Indien de Nederlandsche Bank aan de hand van de gegevens, bedoeld in het eerste lid, niet kan vaststellen of
      een deposito ingevolge het depositogarantiestelsel is gegarandeerd, komt een deposito slechts voor vergoeding in
      aanmerking voor zover de depositohouder het bestaan en de hoogte ervan genoegzaam bewijst.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a6
  - number: 10a:6.3
    text: |-
      Bij de vaststelling, bedoeld in het eerste lid en tweede lid, ten aanzien van deposito’s in andere valuta dan de US
      dollar, gelden de referentiekoersen van de Centrale Bank van Curaçao en Sint Maarten, zoals deze golden op de dag
      waarop ten aanzien van de betrokken kredietinstelling het depositogarantiestelsel in werking werd gesteld.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a6
  - number: 10a:7.1
    text: |-
      Tenzij contractueel is bepaald dat personen als bedoeld in [artikel 10A:3, tweede lid, onderdeel b][ref1], in
      een andere verhouding gerechtigd zijn tot de deposito’s, ontvangen zij ieder een vergoeding ter grootte van een
      evenredig deel van het totaal van de gegarandeerde deposito’s.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel10a
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a7
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a:7.2
    text: |-
      De Nederlandsche Bank stelt de vergoeding zo spoedig mogelijk beschikbaar, doch in elk geval binnen drie maanden na
      het tijdstip waarop de aanvraag tot vergoeding is ingediend. De vergoeding wordt beschikbaar gesteld in US dollar.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a7
  - number: 10a:7.3
    text: Uitkering vindt plaats op een door De Nederlandsche Bank te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a7
  - number: 10a:7.4
    text: |-
      Toegekende vergoedingen worden beschikbaar gesteld mits depositohouders geen gebruik hebben gemaakt en verklaren af
      te zien van het gebruik van hun bevoegdheden om hun vorderingen, voor zover deze voor vergoeding uit hoofde van het
      depositogarantiestelsel in aanmerking komen, te verrekenen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a7
  - number: 10a:7.5
    text: |-
      De Nederlandsche Bank kan in gevallen waarin toepassing van de [artikelen 10A:5][ref1], [10A:6][ref2] of
      [10A:7][ref3] leidt tot een onbillijkheid van overwegende aard, zo spoedig mogelijk na indiening van een
      aanvraag als bedoeld in artikel 10A:5 een voorschot van ten hoogste USD 500 verstrekken aan een depositohouder
      die aannemelijk maakt een gegarandeerd deposito van ten minste het als voorschot gevraagde bedrag bij de
      betalingsonmachtige kredietinstelling te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0031636#Artikel10a
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a7
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: 10a
        hoofdstuk: 10a
      - id: ref2
        bwb_id: BWBR0031636
        artikel: 10a
        hoofdstuk: 10a
      - id: ref3
        bwb_id: BWBR0031636
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a:8.1
    text: |-
      De Nederlandsche Bank kan de termijn, bedoeld in [artikel 10A:7, tweede lid][ref1], opschorten indien:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel10a
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a8
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a:8.1.a
    text: |-
      een aanvrager strafrechtelijk wordt vervolgd ter zake van een misdrijf dat voortvloeit uit of verband houdt met het
      witwassen van geld; of,
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a8
  - number: 10a:8.1.b
    text: |-
      het deposito onderwerp is van beperkende maatregelen die zijn opgelegd door nationale regeringen of internationale
      organen, of
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a8
  - number: 10a:8.1.c
    text: |-
      het onzeker is of een persoon gerechtigd is een terugbetaling te ontvangen, of het deposito onderwerp is van een
      rechtsgeschil.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a8
  - number: 10a:8.2
    text: |-
      De opschorting bedoeld in het eerste lid, onderdeel a, eindigt zodra de vervolging is beëindigd of de beslissing
      van de strafrechter onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a8
  - number: 10a:9.1
    text: |-
      Uitkeringen uit het depositogarantiestelsel komen ten laste van de kredietinstellingen, bedoeld in
      [artikel 4:17 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a9
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '4'
  - number: 10a:9.2
    text: |-
      Per kredietinstelling wordt per kalenderjaar geen grotere bijdrage in rekening gebracht dan 0,5% van de op 31
      december van het voorafgaande jaar door die kredietinstelling aangehouden deposito’s voor zover zij voor vergoeding
      uit het depositogarantiestelsel in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a9
  - number: 10a:9.3
    text: |-
      De Nederlandsche Bank kan een voorschot vaststellen. Betaalde voorschotten worden met de definitieve bijdragen
      verrekend.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a9
  - number: 10a:10.1
    text: |-
      De Nederlandsche Bank kan de bijdrage van een kredietinstelling aan het depositogarantiestelsel, bedoeld in
      [artikel 10A:9][ref1], opschorten indien de solvabiliteits- of liquiditeitspositie van de kredietinstelling
      daartoe aanleiding geeft. Indien toepassing wordt gegeven aan de eerste volzin, wordt voor de financiering van het
      depositogarantiestelsel een voorschot gegeven ten laste van ’s Rijks schatkist.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel10a
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a10
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: 10a
        hoofdstuk: 10a
  - number: 10a:10.2
    text: |-
      De Nederlandsche Bank verhaalt het voorschot, bedoeld in het eerste lid, ten behoeve van ’s Rijks schatkist in
      jaarlijkse termijnen op de aan het depositogarantiestelsel deelnemende kredietinstellingen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a10
  - number: 10a:10.3
    text: |-
      De Nederlandsche Bank stelt met inachtneming van de draagkracht van de gezamenlijke kredietinstellingen de hoogte
      van de door de aan het depositogarantiestelsel deelnemende kredietinstellingen verschuldigde aflossing vast. De
      aflossing per kredietinstelling is in een jaar niet groter dan 0,5% van de op 31 december van het voorafgaande jaar
      door die kredietinstelling aangehouden deposito’s voor zover zij voor vergoeding uit het depositogarantiestelsel in
      aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a10
  - number: 10a:10.4
    text: |-
      Indien de betalingsonmachtige kredietinstelling een vordering voldoet aan de Nederlandsche Bank nadat de
      Nederlandsche Bank ingevolge [artikel 8:29 van de wet][ref1] in de rechten van een depositohouder is getreden,
      draagt de Nederlandsche Bank die middelen af:


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel8
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a10
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '8'
  - number: 10a:10.4.a
    text: aan ’s Rijks schatkist, of
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a10
  - number: 10a:10.4.b
    text: |-
      indien het door ’s Rijks schatkist verstrekte voorschot volledig is afgelost, aan de kredietinstellingen naar rato
      van de bijdragen die door deze kredietinstellingen zijn betaald ter financiering van het depositogarantiestelsel en
      ter aflossing van het door ’s Rijks schatkist verstrekte voorschot.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a10
  - number: 10a:11.1
    text: |-
      Een aan het depositogarantiestelsel deelnemende kredietinstelling draagt er zorg voor dat voor de uitvoering van
      het depositogarantiestelsel noodzakelijke gegevens voortdurend worden bijgehouden en vastgelegd
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a11
  - number: 10a:11.2
    text: |-
      De kredietinstelling verstrekt de gegevens, bedoeld in het eerste lid, op verzoek van de Nederlandsche Bank binnen
      een door de Nederlandsche Bank te bepalen termijn en op een op de Nederlandsche Bank te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel10a11
  - number: 11:1
    text: |-
      Een kredietinstelling met zetel in de openbare lichamen beschikt in afwijking van de bij of krachtens
      [artikel 4:3][ref1] of [4:29][ref2] gestelde regels, tot 1 januari 2014 over voldoende solvabiliteit en liquiditeit,
      indien zij voldoet aan de [artikelen 2.2 tot en met 2.5 van de Regeling financiële markten BES 2010][ref3], zoals
      deze regeling luidde onmiddellijk voorafgaand aan de inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0028592#Artikel2
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031636
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0028592
        artikel: '2'
  - number: 11:5
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen en onderdelen daarvan en voor de verschillende op grond van dit besluit te onderscheiden categorieën
      financiële ondernemingen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel115
  - number: 11:6
    text: 'Dit besluit wordt aangehaald als: Besluit financiële markten BES.'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel116
