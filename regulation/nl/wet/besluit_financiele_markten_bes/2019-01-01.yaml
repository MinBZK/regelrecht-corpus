  - number: 2:3.2
    text: |-
      Een bemiddelaar met zetel in de openbare lichamen verstrekt aan de toezichtautoriteit voorts gegevens en bescheiden
      met betrekking tot eventuele zakelijke relaties met verzekeraars waaruit blijkt of hij afhankelijk dan wel
      onafhankelijk is.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel23
  - number: 2:3.3
    text: |-
      Een gevolmachtigde agent of ondergevolmachtigde agent met zetel in de openbare lichamen verstrekt aan de
      toezichtautoriteit voorts de naam van de verzekeraar voor wie de volmacht geldt.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel23
  - number: 2:4.1
