  - number: 2:5
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 2:2, onderdelen f en g, onder 2°][ref1], van een
      levensverzekeraar met zetel in een openbaar lichaam bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel2
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:5.a
    text: een opgave van de aard van de overeenkomsten die de verzekeraar voornemens is aan te gaan;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel25
  - number: 2:5.b
    text: de polisvoorwaarden die de verzekeraar voornemens is te gebruiken;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel25
  - number: 2:5.c
    text: de tarieven die de verzekeraar voornemens is toe te passen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel25
  - number: 2:5.d
    text: |-
      de technische grondslagen die de verzekeraar voornemens is toe te passen, met name de gegevens die nodig zijn voor
      de berekening van de tarieven en de technische voorzieningen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel25
  - number: 2:5.e
    text: een uiteenzetting omtrent de leidende beginselen op het gebied van de herverzekering;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel25
  - number: 2:5.f
    text: |-
      een raming van de kosten voor de inrichting van de administratie en van het productienet, alsmede bewijsstukken
      waaruit blijkt dat de verzekeraar beschikt over de financiële middelen tot dekking daarvan;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel25
  - number: 2:5.g
    text: een raming voor de eerste drie boekjaren van de liquiditeitspositie;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel25
  - number: 2:5.h
    text: |-
      een raming voor de eerste drie boekjaren van de vermoedelijke inkomsten en uitgaven met betrekking tot de directe
      verzekeringen, de geaccepteerde herverzekeringen en de uitgaande herverzekeringen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel25
  - number: 2:5.i
    text: een raming voor de eerste drie boekjaren van de financiële middelen tot dekking van de verzekeringsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel25
  - number: 2:5.j
    text: een raming voor de eerste drie boekjaren van de financiële middelen tot dekking van de solvabiliteitsmarge.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel25
  - number: 2:6
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 2:2, onderdelen f en onderdeel g, onder 2°][ref1], van een
      schadeverzekeraar met zetel in een openbaar lichaam bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel2
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel26
    references:
