        paragraaf: '5'
  - number: 1:4.1.a
    text: |-
      beleggingsinstellingen die uitsluitend rechten van deelneming aanbieden in een besloten kring dan wel aan
      professionele marktpartijen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel14
  - number: 1:4.1.b
    text: |-
      beheerders en bewaarders voor zover zij de in onderdeel a bedoelde beleggingsinstellingen beheren of belast zijn
      met de bewaring van de activa van deze beleggingsinstellingen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel14
  - number: 1:4.1.c
    text: 'beleggingsinstellingen die aan de volgende vereisten voldoen:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel14
  - number: 1:4.1.c.1°
    text: in de beleggingsinstelling kunnen ten hoogste 25 natuurlijke personen deelnemen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel14
  - number: 1:4.1.c.2°
    text: per deelnemer wordt niet meer dan USD 10.000 ingelegd;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel14
  - number: 1:4.1.c.3°
    text: |-
      de beleggingsinstelling gaat geen verplichtingen aan waardoor voor de deelnemers een verplichting kan ontstaan
      tot bijbetaling;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel14
  - number: 1:4.1.c.4°
    text: |-
      de gelden of andere goederen worden niet gevraagd, dan wel de rechten van deelneming worden niet aangeboden door
      natuurlijke of rechtspersonen die beroeps- of bedrijfsmatig handelen of beleggen in effecten of andere beleggingen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel14
  - number: 1:4.1.d
    text: |-
      beleggingsinstellingen waarvan het balanstotaal voor minder dan 50% uit beleggingen bestaat en waarvan de totale
      gerealiseerde opbrengsten voor minder dan 50% worden gegenereerd uit beleggingen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel14
  - number: 1:4.2
    text: |-
      Een beleggingsinstelling als bedoeld in het eerste lid, onderdeel d, die een prospectus verkrijgbaar stelt,
      vermeldt daarin dat zij niet onder toezicht staat van de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel14
  - number: 1:5
    text: |-
      De [hoofdstukken 2 tot en met 5 van de wet][ref1], met uitzondering van de [artikelen 2:21][ref2],
      [2:22][ref3], [4:40, derde lid][ref4], [5:2][ref5], [5:3][ref6] en [5:4][ref7] en de [paragrafen 4][ref8] en
      [5 van hoofdstuk 5][ref9], zijn niet van toepassing op bemiddelaars in goederenkrediet dat dient ter verschaffing
      van het genot van een roerende zaak dan wel het verlenen van een dienst, indien de looptijd van het goederenkrediet
      niet langer is dan de verwachte economische levensduur van de verschafte roerende zaak of dan de periode van
      dienstverlening, en de bemiddelaar in goederenkrediet:


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel2
