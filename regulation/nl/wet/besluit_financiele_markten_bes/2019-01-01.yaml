  - number: 1:11.1
    text: |-
      De toezichtautoriteit brengt de ingevolge [artikel 1:5, derde lid][ref1], of [1:6, derde lid, van de wet][ref2]
      onder haar toezicht staande financiële ondernemingen jaarlijks een bedrag in rekening ter gedeeltelijke vergoeding
      van de kosten, bedoeld in [artikel 1:10, tweede lid, van de wet][ref3], overeenkomstig de daartoe ingevolge artikel
      1:10, derde lid, van de wet vastgestelde tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0030883#Artikel1
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0030883
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0030883
        artikel: '1'
  - number: 1:11.2
    text: |-
      De hoogte van de in het eerste lid bedoelde tarieven wordt voor de naar aard en omvang van hun activiteiten
      te onderscheiden categorieën financiële ondernemingen verschillend vastgesteld. Tevens kan bij de vaststelling
      onderscheid worden gemaakt tussen financiële ondernemingen met zetel in een openbaar lichaam en financiële
      ondernemingen met zetel in het buitenland.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel111
  - number: 1:11.3
    text: |-
      Betaling van het ingevolge het eerste lid verschuldigde bedrag geschiedt op door de toezichtautoriteit te bepalen
      wijze en binnen een door haar te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel111
  - number: 1:12.1
    text: |-
      De toezichtautoriteit kan op aanvraag geheel of gedeeltelijk, al dan niet voor bepaalde tijd, ontheffing
      verlenen van de [artikelen 3:4][ref1], [3:23 tot en met 3:25][ref2], [3:29][ref3], [4:2][ref4], [4:3][ref5],
      [4:8][ref6], [4:20 tot en met 4:26][ref7], [4:28][ref8], [4:29][ref9], [4:37 tot en met 4:41][ref10],
      [4:47 tot en met 4:51][ref11], [5:2 tot en met 5:6][ref12], [6:2 tot en met 6:4][ref13],
      [7:2][ref14], [7:4][ref15], [7:6 tot en met 7:17, tweede tot en met achtste lid][ref16],
      [7:20, tweede tot en met achtste lid][ref17], en [8:1][ref18].


