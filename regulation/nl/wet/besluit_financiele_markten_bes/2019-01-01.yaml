  - number: 1:12.2
    text: |-
      De Autoriteit Financiële Markten kan slechts ontheffing verlenen van [artikel 4:14, tweede lid, van de wet][ref1],
      indien de werkzaamheden worden voortgezet in een besloten kring.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel4
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '4'
  - number: 2:1.1
    text: |-
      De aanvraag van een vergunning op grond van de [wet][ref1] wordt gedaan met gebruikmaking van het daartoe door de
      toezichtautoriteit vast te stellen formulier dat op verzoek aan de aanvrager ter beschikking wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 2:1.2
    text: |-
      Het aanvraagformulier en de daarbij ingevolge deze paragraaf te verstrekken gegevens en bescheiden worden in
      enkelvoud ingediend, waarbij bedoelde gegevens en bescheiden in zodanige vorm worden verstrekt dat een goede
      beoordeling door de toezichtautoriteit mogelijk is.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel21
  - number: 2:2
    text: |-
      Een financiële onderneming verstrekt, voor zover van toepassing, aan de toezichtautoriteit bij de aanvraag van een
      vergunning de navolgende gegevens en bescheiden met betrekking tot de financiële onderneming:
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel22
  - number: 2:2.a
    text: naam, adres en telefoon- en faxnummer;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel22
  - number: 2:2.b
    text: rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel22
  - number: 2:2.c
    text: statutaire zetel, statutaire naam en handelsnaam of handelsnamen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel22
  - number: 2:2.d
    text: uittreksel uit het handelsregister;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel22
  - number: 2:2.e
    text: gewaarmerkt afschrift van de statuten;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel22
  - number: 2:2.f
    text: |-
      programma van werkzaamheden die de financiële onderneming voornemens is te verrichten in of vanuit de openbare
      lichamen;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel22
  - number: 2:2.g
    text: 'indien de financiële onderneming haar zetel in de openbare lichamen heeft:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel22
  - number: 2:2.g.1°
    text: naam, adres en telefoon- en faxnummer van eventuele bijkantoren in het buitenland;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel22
  - number: 2:2.g.2°
    text: |-
      programma van werkzaamheden die de financiële onderneming voornemens is te verrichten vanuit eventuele bijkantoren
      in het buitenland;
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel22
  - number: 2:2.h
    text: 'indien de financiële onderneming haar zetel in het buitenland heeft:'
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel22
  - number: 2:2.h.1°
    text: |-
      een verklaring van de toezichthoudende instantie van de staat van zetel waaruit blijkt dat de financiële
      onderneming in haar staat van zetel bevoegd is tot de uitoefening van de vergunningplichtige activiteiten, bedoeld
      in [artikel 3:2 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel3
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: '3'
  - number: 2:2.h.2°
    text: naam, adres en telefoon- en faxnummer van eventuele bijkantoren in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0031636/2019-01-01#Artikel22
  - number: 2:3.1
