  - number: 4:5
    text: |-
      1 Het kernkapitaal wordt gevormd door de waarde van de vermogensbestanddelen, bedoeld in het tweede lid, verminderd
      met de waarde van de posten bedoeld in het derde lid.

      2 De voor de bepaling van het kernkapitaal in aanmerking te nemen vermogensbestanddelen zijn:

      a. het geplaatste en volgestorte aandelenkapitaal;

      b. agioreserve;

      c. overige reserves;

      d. ingehouden winst;

      e. minderheidsbelangen;

      f. voorzieningen ter dekking van algemene risico’s;

      g. andere door de Nederlandsche Bank toegestane vermogensbestanddelen.

      3 De voor de bepaling van het kernkapitaal in aanmerking te nemen posten zijn:

      a. immateriële activa;

      b. goodwill;

      c. niet erkende latente belastingvorderingen;

      d. vijftig procent van de waarde van de volgende deelnemingen:

      1°. significante minderheidsdeelnemingen in kredietinstellingen en andere financiële ondernemingen, niet zijnde
      verzekeraars;

      2°. wederzijdse deelnemingen in andere kredietinstellingen die een geflatteerd beeld beogen te geven van de
      vermogenspositie;

      3°. deelnemingen in verzekeraars;

      4°. deelnemingen in overige ondernemingen.

      4 De Nederlandsche Bank kan nadere regels stellen met betrekking tot de berekening van de in het tweede en derde
      lid genoemde vermogensbestanddelen en posten.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel45
  - number: 4:6
    text: |-
      1 Het aanvullend kapitaal wordt gevormd door de waarde van:

      a. herwaarderingsreserves;

      b. wettelijke reserves;

      c. achtergestelde schuldinstrumenten en preferente aandelen met vaste looptijd.

      2 Het in aanmerking te nemen aanvullend kapitaal bedraagt de som van de in het eerste lid
      bedoelde vermogensbestanddelen, verminderd met vijftig procent van de waarde van de in
      [artikel 4:5, derde lid, onderdeel d][ref1], bedoelde deelnemingen.

      3 De Nederlandsche Bank kan nadere regels stellen met betrekking tot de berekening van de in het eerste lid
      genoemde waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel45
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel46
