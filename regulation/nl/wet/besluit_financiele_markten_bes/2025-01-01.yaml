  - number: 4:10
    text: |-
      1 Bij de toekenning van een risicogewicht aan een categorie activa of posten buiten de balanstelling kan een
      kredietinstelling een kredietbeoordeling van een ingevolge [artikel 4:13][ref1] door de Nederlandsche Bank erkend
      kredietbeoordelingbureau op een consistente wijze gebruiken. Onder een kredietbeoordeling wordt verstaan de taxatie
      van de kans op wanbetaling en de mate van wanbetaling door een bepaalde debiteur op al zijn verplichtingen of een
      deel van zijn verplichtingen.

      2 De Nederlandsche Bank stelt nadere regels met betrekking tot het gebruik van een kredietbeoordeling als bedoeld
      in het eerste lid.

      3 Een kredietinstelling gebruikt slechts gevraagde kredietbeoordelingen.

      4 De Nederlandsche Bank kan, in afwijking van het derde lid, op verzoek van de kredietinstelling toestemming
      verlenen om ongevraagde kredietbeoordelingen te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel413
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel410
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: 4:13
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:11
    text: |-
      1 De Nederlandsche Bank kan een kredietinstelling op verzoek toestemming verlenen om de bedragen van haar naar
      risico gewogen activa of posten buiten de balanstelling in afwijking van [artikel 4:9][ref1] te berekenen volgens
      een interne modellenmethode, waarbij gebruik wordt gemaakt van eigen ramingen van de kans dat een wederpartij
      over een periode van een jaar in gebreke blijft, en van de verhouding tussen het verwachte economisch verlies op
      een vordering als gevolg van wanbetaling, met inachtneming van de tijdwaarde van geld, en het naar verwachting
      uitstaande bedrag bij wanbetaling.

      2 De gehanteerde interne modellen voor het beheer en de beoordeling van kredietrisico’s worden zorgvuldig
      toegepast. De Nederlandsche Bank kan regels stellen met betrekking tot deze interne modellen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel49
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel411
    references:
