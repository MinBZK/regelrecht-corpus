      1 De beloning van een assurantiebemiddelaar bestaat, behoudens [artikel 7:23, tweede lid][ref1], uitsluitend uit
      provisie ter zake van het bemiddelen bij het afsluiten van verzekeringen, het bemiddelen bij het verlengen van
      verzekeringen of het incasseren van premies.

      2 De in het eerste lid bedoelde provisie staat in een redelijke verhouding tot de werkzaamheden die noodzakelijk
      zijn voor een adequate dienstverlening of die bijdragen aan de kwaliteit van de dienstverlening.

      3 Het tweede lid is van overeenkomstige toepassing op de provisie die een aanbieder van een financieel product,
      niet zijnde een verzekering, voor het bemiddelen of adviseren inzake dat financiële product verschaft.


