  - number: 2:13
    text: |-
      De inschrijving in het register van een financiële onderneming waarvan de vergunning is ingetrokken, wordt
      doorgehaald zodra de beslissing tot intrekking in werking is getreden. Zolang deze beslissing nog niet
      onherroepelijk is wordt dit bij de doorhaling vermeld.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel213
  - number: 2:14
    text: |-
      1 De toezichtautoriteit draagt er zorg voor dat de in [artikel 2:12][ref1] bedoelde gegevens tot ten minste vijf
      jaar terug geraadpleegd kunnen worden.

      2 De toezichtautoriteit verstrekt aan een ieder desgevraagd, tegen betaling van de kostprijs, afschriften uit het
      register.


