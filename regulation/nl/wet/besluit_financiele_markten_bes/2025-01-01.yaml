  - number: 7:12
    text: |-
      1 Gedurende de looptijd van een overeenkomst inzake krediet met een variabel effectieve rentepercentage informeert
      de kredietaanbieder de consument over elke wijziging van de effectieve rentevoet, waarbij hij, voor zover van
      toepassing, de consument tevens informeert over gevolgen hiervan voor de termijnlast.

      2 Gedurende de looptijd van een overeenkomst inzake krediet verstrekt de kredietaanbieder de consument op diens
      verzoek een gespecificeerd overzicht van het uitstaand saldo. Hij kan daarbij een vergoeding in rekening brengen
      van ten hoogste het bedrag van de werkelijke kosten.

      3 Tot een jaar na de afwikkeling van een overeenkomst inzake krediet verstrekt de kredietaanbieder aan de consument
      op diens verzoek kosteloos een gespecificeerde afrekening.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel712
  - number: 7:13
    text: |-
      1 Gedurende de looptijd van een overeenkomst inzake een levensverzekering verstrekt een levensverzekeraar de
      cliënten minste de volgende informatie:

      a. een wijziging van de polisvoorwaarden, voor zover redelijkerwijs relevant;

      b. voor zover zulks niet blijkt uit de wijziging van de polisvoorwaarden, bedoeld in onderdeel a: iedere
      wijziging van de overeenkomst met betrekking tot de in de [artikelen 7:5, eerste lid, onderdelen b en d][ref1],
      en [7:7, eerste lid, met uitzondering van onderdeel n][ref2], bedoelde onderwerpen of van de op die onderdelen van
      toepassing zijnde regelgeving;

      c. de jaarlijkse winstdeling;

      d. indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling: een jaarlijkse
      opgave over het voorafgaande jaar van:

      1°. de waarde-ontwikkeling van het opgebouwde kapitaal;

      2°. de door de cliënt betaalde premies als bedoeld in [artikel 7:7, eerste lid, onderdeel h][ref3];

      3°. met de cliënt verrekende kosten als bedoeld in
      [artikel 7:7, eerste lid, onderdeel l, onder 1°, 2° en 3°][ref4];

      4°. het op het opgebouwde kapitaal behaalde rendement;

      e. indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling: een jaarlijkse
      prognose van de hoogte van het eindkapitaal op basis van een pessimistische voorspelling of het historisch
      rendement;

      f. indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling: het gevoerde beheer
      van de beleggingsinstelling; en

      g. indien de cliënt daarom verzoekt: een opgave van de premievrije waarde op de einddatum van de verzekering,
      onder vermelding van het voor de berekening gehanteerde rendementspercentage, of een opgave van de wegens afkoop
      verschuldigde kosten en de actuele afkoopwaarde.

      2 Indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling verstrekt de
      levensverzekeraar, onverminderd het eerste lid, aanhef en onderdeel g, aan de cliënt die verzoekt zijn premie
      te verhogen of te verlagen of zijn polis premievrij te maken, een aan de nieuwe premie aangepaste opgave
      overeenkomstig [artikel 7:7, eerste lid, onderdeel l, onder 1°, 2° en 3°][ref5].


