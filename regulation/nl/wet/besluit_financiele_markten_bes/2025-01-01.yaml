  - number: 4:21
    text: |-
      1 Het minimumbedrag aan eigen vermogen bedraagt voor een bemiddelaar in effecten of vermogensbeheerder USD 25.000.

      2 Het eerste lid is niet van toepassing op een bemiddelaar in effecten die uitsluitend orders van cliënten
      ontvangt en doorgeeft, mits die bemiddelaar beschikt over een beroepsaansprakelijkheidsverzekering die zijn
      aansprakelijkheid dekt wegens fouten, verzuimen of nalatigheden begaan in de uitoefening van zijn bedrijf.
      [Artikel 4:47, tweede en derde lid][ref1], is van overeenkomstige toepassing.

      3 Het minimumbedrag aan eigen vermogen van een bemiddelaar in effecten of een vermogensbeheerder wordt gevormd door
      de waarde van de volgende vermogensbestanddelen:

      a. voor een naamloze of besloten vennootschap: het geplaatste en volgestorte aandelenkapitaal, met uitsluiting van
      cumulatief preferente aandelen en van preferente aandelen met een vaste looptijd;

      b. voor een vennootschap onder firma: de afgezonderde gestorte vermogensbestanddelen van de beherende vennoten;

      c. voor een commanditaire vennootschap: de afgezonderde gestorte vermogensbestanddelen van de beherende vennoten
      alsmede het gestorte commanditaire kapitaal;

      d. voor een coöperatie: het door de leden gestorte of ingelegde kapitaal;

      e. voor een onderneming die een andere rechtsvorm heeft dan de hierboven genoemde: het voordelige verschil tussen
      bezittingen en schulden;

      f. andere door de Nederlandsche Bank toegestane vermogensbestanddelen.

      4 De in het derde lid genoemde vermogensbestanddelen, alsmede de waarden die tegenover die vermogensbestanddelen
      staan, staan onmiddellijk en zonder beperkingen ter beschikking van de bemiddelaar in effecten of
      vermogensbeheerder. Per afzonderlijke post wordt rekening gehouden met het voorzienbare bedrag van de daarover
      verschuldigde belastingen.

      5 De Nederlandsche Bank kan nadere regels stellen met betrekking tot de berekening van de in het derde lid genoemde
      vermogensbestanddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel447
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel421
