      1 Het prospectus, bedoeld in [artikel 5:19, eerste lid, van de wet][ref1], bevat ten minste de bij regeling van
      Onze Minister te bepalen gegevens, waarbij onderscheid wordt gemaakt tussen de volgende categorieën effecten:

      a. aandeelbewijzen, optiebewijzen, warrants, inschrijvingen in aandelenregisters, winst- en oprichtersbewijzen,
      rechten van deelgenootschap, en soortgelijke waardepapieren dan wel rechten;

      b. schuldbrieven, inschrijvingen in schuldregisters, en soortgelijke waardepapieren dan wel rechten;

      c. certificaten van aandelen en soortgelijke waardepapieren;

      d. opties en soortgelijke rechten;

      e. rechten op overdracht op termijn van goederen;

      f. recepissen van waarden als hiervoor bedoeld.

      2 De Autoriteit Financiële Markten kan regels stellen met betrekking tot de indeling van het prospectus.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel519
