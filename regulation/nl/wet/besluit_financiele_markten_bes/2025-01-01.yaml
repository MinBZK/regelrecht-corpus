  - number: 10a:3
    text: |-
      1 De Stichting heeft tot taak het beheer van de middelen ter financiering van het depositogarantiestelsel. De
      Nederlandsche Bank besluit over de aanwending van de financiële middelen van de Stichting.

      2 De Nederlandsche Bank ondersteunt de Stichting bij de uitoefening van haar taak en verschaft de voor die
      taakuitoefening benodigde financiële middelen.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel10a3
  - number: 10a:4
    text: |-
      1 Het bestuur van de Stichting bestaat uit ten minste drie leden, waaronder een voorzitter. De Nederlandsche Bank
      benoemt, schorst en ontslaat de leden van het bestuur.

      2 Op de taakuitoefening van de Stichting zijn de [artikelen 20][ref1], [23, eerste en tweede lid][ref2], en
      [41, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref3] van overeenkomstige toepassing, met dien
      verstande dat voor «Onze Minister» wordt gelezen: de Nederlandsche Bank. De Nederlandsche Bank stelt Onze Minister
      onverwijld in kennis van door haar getroffen voorzieningen als bedoeld in artikel 23, eerste lid, van de Kaderwet
      zelfstandige bestuursorganen.

      3 De Stichting legt verantwoording af over haar taakuitoefening met overeenkomstige toepassing van de
      [artikelen 18, eerste lid, met uitzondering van de laatste volzin, en tweede lid][ref4], enkel voor zover
      dat lid ziet op het verzenden van het jaarverslag aan «Onze Minister», [26][ref5], [34, eerste lid][ref6], en
      [35, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref7], met dien verstande dat voor «Onze Minister»
      wordt gelezen: de Nederlandsche Bank.


