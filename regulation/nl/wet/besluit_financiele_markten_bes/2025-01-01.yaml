  - number: 7:23
    text: |-
      1 Het is een assurantiebemiddelaar verboden aan een verzekeringnemer dan wel aan hen te wier behoeve een
      verzekering is gesloten in geval van schade een afmakingscourtage in rekening te brengen.

      2 Van het verbod, bedoeld in het eerste lid, kan de Autoriteit Financiële Markten voor bij regeling van Onze
      Minister te bepalen vormen van verzekering ontheffing verlenen aan de assurantiebemiddelaar die ten genoegen van de
      Autoriteit Financiële Markten aantoont dat hij daartoe over het geschikte bedrijfsapparaat en expertise beschikt en
      de redelijkerwijs van hem te eisen inspanningen bij de schadeafwikkeling kan verrichten.

      3 De Autoriteit Financiële Markten kan de beoordeling van de kwaliteit van het bedrijfsapparaat, de expertise en de
      procedures voor de afwikkeling van schaden ten laste van de betreffende assurantiebemiddelaar door een deskundige
      derde laten doen.

      4 De afmakingscourtage die in rekening mag worden gebracht, bedraagt ten hoogste één procent van het aan de
      verzekerde uit te keren schadebedrag.

      5 De in het tweede lid bedoelde ontheffing geldt voor een periode van drie jaren en kan telkenmale met drie jaren
      worden verlengd.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel723
  - number: 7:24
    text: |-
      1 Het is verboden ter zake van een verzekering direct of indirect provisie, retourprovisie of enig ander op geld
      waardeerbaar voordeel toe te kennen, af te staan of te beloven aan anderen dan de assurantiebemiddelaar tot wiens
      portefeuille de verzekering behoort, onverminderd [artikel 6:9, derde lid][ref1].

      2 De Autoriteit Financiële Markten kan, in aanvulling op [artikel 1:12, eerste lid][ref2], ontheffing verlenen van
      het verbod, bedoeld in het eerste lid, indien het verbod strijdig is met algemeen erkende gebruiken of het algemeen
