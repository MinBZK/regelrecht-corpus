    text: |-
      Indien een overeenkomst inzake een levensverzekering, niet zijnde een overlijdensrisicoverzekering, tot stand
      komt door tussenkomst van een bemiddelaar, informeert die bemiddelaar de cliënt tijdig voorafgaande aan de
      totstandkoming van de desbetreffende overeenkomst over de hoogte van de provisie die hij in verband met deze
      bemiddeling ontvangt.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel710
  - number: 7:11
    text: |-
      1 In afwijking van de [artikelen 7:7, eerste lid][ref1], en [7:8, eerste lid][ref2], mag de in die artikelen
      bedoelde informatie ook onmiddellijk na de totstandkoming van de overeenkomst inzake een levensverzekering,
      onderscheidenlijk natura-uitvaartverzekering, worden verstrekt, of uiterlijk tegelijkertijd met het afgeven van
      de polis, indien de cliënt het recht heeft zonder een boete verschuldigd te zijn en zonder opgave van redenen de
      overeenkomst inzake binnen dertig kalenderdagen na de dag waarop hij de informatie heeft ontvangen, terugwerkend
      tot de datum van de totstandkoming van de overeenkomst, te ontbinden en de cliënt is geïnformeerd over de wijze
      waarop hij gebruik kan maken van dat recht.

      2 Het eerste lid is van overeenkomstige toepassing op de ingevolge [artikel 7:5][ref3] voorafgaand aan een
      overeenkomst inzake een schadeverzekering te verstrekken informatie, met dien verstande dat de termijn van
      ontbinding in dat geval veertien kalenderdagen bedraagt en de ontbinding geen terugwerkende kracht heeft.


