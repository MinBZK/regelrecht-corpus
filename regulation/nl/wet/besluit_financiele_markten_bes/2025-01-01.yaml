  - number: 4:51
    text: |-
      1 Een verzekeraar die deelnemingen heeft in een of meer andere verzekeraars, berekent zijn aangepaste solvabiliteit
      op geconsolideerde basis. De aangepaste solvabiliteit is gelijk aan het verschil tussen de vermogensbestanddelen
      die in aanmerking komen voor de solvabiliteitsmarge, berekend op basis van de geconsolideerde gegevens, en het
      minimumbedrag aan solvabiliteitsmarge, berekend op basis van de geconsolideerde gegevens.

      2 Indien een verzekeraar een deelneming heeft in een elektronischgeldinstelling, kredietinstelling of
      vermogensbeheerder, wordt de waarde van die deelneming in mindering gebracht op de voor zijn solvabiliteitsmarge in
      aanmerking te nemen vermogensbestanddelen.

      3 De Nederlandsche Bank kan nadere regels stellen met betrekking tot het eerste en tweede lid. Deze regels kunnen
      mede inhouden dat de verzekeraar zijn aangepaste solvabiliteit mag berekenen volgens een andere methode dan is
      voorgeschreven in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel451
  - number: 5:1
    text: |-
      1 Een financiële onderneming met zetel in het buitenland voert met betrekking tot haar activiteiten in de openbare
      lichamen een afzonderlijke boekhouding, waaruit de aard en omvang van die activiteiten blijkt.

      2 De afzonderlijke boekhouding, bedoeld in het eerste lid, staat onmiddellijk ter beschikking van de
      toezichtautoriteit, indien deze daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel51
  - number: 5:2
    text: |-
      1 Een beleggingsinstelling, bemiddelaar in effecten, elektronischgeldinstelling, kredietinstelling,
      vermogensbeheerder of verzekeraar dient een jaarrekening en jaarverslag in bij de vergunningverlenende
      toezichtautoriteit.

      2 De termijn, bedoeld in [artikel 3:35, eerste lid, van de wet][ref1] bedraagt:

      a. voor beleggingsinstellingen: vier maanden na afloop van het boekjaar;

      b. voor de overige in het eerste lid genoemde financiële ondernemingen: zes maanden na afloop van het boekjaar.

      3 De jaarrekening en jaarverslag voldoen wat betreft inhoud en vorm aan de eisen aan een jaarrekening ingevolge
      [artikel 120, derde en vijfde lid, van boek 2 van het Burgerlijk Wetboek BES][ref2].

      4 Een financiële onderneming als bedoeld in het eerste lid dient tezamen met de jaarrekening en het jaarverslag ook
      de volgende gegevens bij de vergunningverlenende toezichtautoriteit in:

      a. de gegevens bedoeld in [artikel 120, tweede lid, van boek 2 van het Burgerlijk Wetboek BES][ref3];

      b. een afschrift van het rapport van de deskundige, bedoeld in het vijfde lid;

      c. de directiebrieven.

      5 De jaarrekening van een financiële onderneming, bedoeld in het eerste lid, wordt goedgekeurd door een externe
      deskundige als bedoeld in [artikel 121 van boek 2 van het Burgerlijk Wetboek BES][ref4]. Indien de financiële
      onderneming niet voldoet aan de in [artikel 119, tweede lid, van Boek 2 van het Burgerlijk Wetboek BES][ref5]
      omschreven criteria, kan de jaarrekening worden goedgekeurd door een andere dan de in de eerste volzin bedoelde
      deskundige.

      6 De toezichtautoriteit kan nadere regels stellen met betrekking tot het eerste tot en met vierde lid.


