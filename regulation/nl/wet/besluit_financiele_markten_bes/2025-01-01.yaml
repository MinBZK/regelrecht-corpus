  - number: 1:9
    text: |-
      1 De [wet][ref1] is niet van toepassing op:

      a. het door een werkgever als nevenactiviteit aanbieden van krediet aan uitsluitend zijn werknemers of het verlenen
      van een financiële dienst met betrekking tot dat krediet:

      1°. rentevrij of tegen een lagere dan de op de markt gebruikelijke rentevoet;

      2°. tegen een rentevoet die niet hoger is dan de op de markt gebruikelijke rentevoet en onder voorwaarden die voor
      de consument gunstiger zijn dan de op de markt gebruikelijke voorwaarden;

      b. het aanbieden van krediet, of het verlenen van een financiële dienst met betrekking tot zodanig krediet, dat
      binnen drie maanden dient te worden afgelost en ter zake waarvan slechts onbetekenende kosten aan de consument in
      rekening worden gebracht.

      2 De [wet][ref2], met uitzondering van de [artikelen 5:3][ref3], [5:4][ref4] en [5:15][ref5], is niet van
      toepassing op het aanbieden van, of het verlenen van financiële diensten met betrekking tot, een geoorloofde
      debetstand waarbij de consument is gehouden binnen een maand af te lossen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
