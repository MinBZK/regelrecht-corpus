        artikel: 4:5
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:24
    text: |-
      1 Een elektronischgeldinstelling beschikt over een toetsingsvermogen dat ten minste gelijk is aan twee
      procent van het lopende bedrag of het gemiddelde bedrag over de laatste zes maanden van haar totale financiële
      verplichtingen die met uitstaand elektronisch geld verband houden, naar gelang welk bedrag het hoogste is.
      Indien de elektronischgeldinstelling haar werkzaamheden niet gedurende zes maanden heeft uitgeoefend, bedraagt
      de minimumomvang van het toetsingsvermogen twee procent van het lopende bedrag of het blijkens haar programma
      van werkzaamheden op zes maanden nagestreefde bedrag van haar totale financiële verplichtingen die met uitstaand
      elektronisch geld verband houden, naar gelang welk bedrag het hoogste is. De Nederlandsche Bank kan, indien de
      vorige volzin van toepassing is en aannemelijk is dat het nagestreefde bedrag te laag is geschat, besluiten dat
      voor de elektronischgeldinstelling een hogere minimumomvang van het toetsingsvermogen geldt.

      2 Het in aanmerking te nemen toetsingsvermogen wordt gevormd door de waarde van de vermogensbestanddelen, bedoeld
      in [artikel 4:5, tweede lid][ref1]. Artikel 4:5, vierde lid, is van overeenkomstige toepassing.

      3 Onverminderd het eerste lid, is het toetsingsvermogen ten minste gelijk aan het in
      [artikel 4:23, eerste lid][ref2], voorgeschreven minimumbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel423
