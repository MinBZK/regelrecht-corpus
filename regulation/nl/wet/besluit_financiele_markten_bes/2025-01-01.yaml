      De door een financiëledienstverlener te verstrekken informatie:

      a. is accuraat en wijst niet op de mogelijke voordelen van een financieel product, zonder dat ook een correcte en
      duidelijke indicatie van de mogelijke risico’s wordt gegeven;

      b. is toereikend en door de presentatie ervan te begrijpen voor het gemiddelde lid van de groep tot wie zij is
      gericht;

      c. geeft belangrijke zaken, vermeldingen of waarschuwingen niet verhuld of afgezwakt weer.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel71
  - number: 7:2
    text: |-
      Een financiëledienstverlener verstrekt de ingevolge de [artikelen 5:4 tot en met 5:6 van de wet][ref1]
      en de [artikelen 7:5 tot en met 7:14][ref2] van dit besluit te verstrekken informatie schriftelijk. De
      financiëledienstverlener kan de informatie via een andere duurzame drager verstrekken, indien de consument of
      cliënt daarmee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel75
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: 5:4
      - id: ref2
        bwb_id: BWBR0031636
        artikel: 7:5
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7:3
    text: |-
      1 Een financiëledienstverlener:

      a. neemt in een reclame-uiting over krediet geen mededelingen op die gericht zijn op het gemak of de snelheid
      waarmee het krediet wordt verstrekt;

      b. brengt in een reclame-uiting over krediet niet tot uiting dat lopende overeenkomsten inzake krediet bij de
      beoordeling van een kredietaanvraag geen of een ondergeschikte rol spelen.

      2 Bij regeling van Onze minister kan worden bepaald dat financiëledienstverleners in reclame-uitingen over krediet
      een waarschuwing opnemen met betrekking tot de gevolgen die aan het krediet zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel73
  - number: 7:4
    text: |-
      1 Indien een financiëledienstverlener in een reclame-uiting over krediet melding maakt van enige gegevens
      betreffende de kosten van een krediet, verstrekt hij daarbij tevens informatie over:

      a. het kredietbedrag;

      b. de duur van de kredietovereenkomst;

      c. de totale kosten van het krediet;

      d. het totale door de consument te betalen bedrag;

      e. het effectieve rentepercentage op jaarbasis;

      f. indien het aangaan van een andere verplichting vereist is om het krediet op de in de reclame-uiting genoemde
      voorwaarden te verkrijgen: de verplichting daartoe en de kosten daarvan, of voor zover deze niet vooraf kunnen
      worden bepaald, een indicatie van die kosten;

      g. andere kosten die deel uitmaken van de totale kosten van het krediet;

      h. de maandlast.

      2 Een financiëledienstverlener geeft de informatie, bedoeld in het eerste lid, indien deze wordt verstrekt in
      een reclame-uiting over krediet, anders dan via de televisie of radio, gecombineerd weer in een tabel waarin geen
      andere informatie wordt opgenomen.

      3 Indien een financiëledienstverlener in een reclame-uiting over krediet reclame maakt voor met krediet aan te
      schaffen goederen of diensten, vermeldt zij daarbij het effectieve rentepercentage op jaarbasis en andere kosten
      die deel uitmaken van de totale kosten van het krediet.

      4 Indien een reclame-uiting betrekking heeft op een krediet met een effectief rentepercentage dat voor een beperkte
      duur geldt, wordt in die reclame-uiting tevens melding gemaakt van de periode gedurende welke het aangeboden
      effectieve rentepercentage geldt, alsmede van het hoogste effectieve rentepercentage gedurende de looptijd van
      de kredietovereenkomst.

      5 Indien een reclame-uiting een termijnlast bevat, wordt in de reclame-uiting de gewogen gemiddelde termijnlast die
      op het krediet van toepassing is, genoemd.

      6 De informatie, bedoeld in het eerste, derde, vierde en vijfde lid, heeft alleen betrekking op kredieten die
      representatief zijn voor de kredieten die feitelijk door de financiëledienstverlener worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel74
  - number: 7:5
    text: |-
      Voordat een consument of cliënt een verplichting aangaat met betrekking tot een financieel product of een
      financiële dienst, verstrekt de financiëledienstverlener de consument of cliënt ten minste de informatie met
      betrekking tot:

      a. zijn rechtsvorm;

      b. zijn naam, adres en contactgegevens en, indien de financiëledienstverlener een rechtspersoon is, de statutaire
      naam en handelsnaam of handelsnamen;

      c. de aard van de financiële dienstverlening;

      d. zijn inschrijving in het door de toezichthouder gehouden register;

      e. zijn interne klachtenprocedure als bedoeld in [artikel 3:12, eerste lid, van de wet][ref1], en voor zover van
      toepassing, de erkende geschilleninstantie waarbij hij is aangesloten;

      f. het recht dat op de verplichting van toepassing is of de door de financiëledienstverlener voorgestelde
      rechtskeuze;

      g. de wijze waarop de verplichting kan worden beëindigd, de termijn die daarbij in acht moet worden genomen, de aan
      de beëindiging verbonden kosten en de overige gevolgen van beëindiging van de verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel312
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: 3:12
  - number: 7:6
    text: |-
      1 Voorafgaande aan de totstandkoming van een overeenkomst inzake krediet verstrekt de kredietaanbieder een
      consument, onverminderd [artikel 7:5][ref1], ten minste de volgende gegevens:

      a. een globale omschrijving van de wijze waarop de kredietaanbieder invulling geeft aan de
      kredietwaardigheidstoets, bedoeld in [artikel 5:14 van de wet][ref2];

      b. het soort krediet;

      c. het kredietbedrag;

      d. de duur van de overeenkomst;

      e. de totale kosten van het krediet;

      f. het totale door de consument te betalen bedrag;

      g. het effectieve rentepercentage op jaarbasis;

      h. indien het aangaan van een andere verplichting vereist is om het krediet te verkrijgen: de aard en de kosten, of
      voor zover dit niet vooraf kan worden bepaald, een indicatie daarvan;

      i. andere kosten die deel uitmaken van de totale kosten van het krediet;

      j. de maandlast en, indien de afbetalingstermijnen niet maandelijks zijn, de termijnlast en het bijbehorende aantal
      termijnen;

      k. indien de verplichting, bedoeld in onderdeel h, betrekking heeft op een financieel product of financiële
      dienst, niet zijnde een betaalrekening als bedoeld in [artikel 5:16, eerste lid, onderdeel a, van de wet][ref3]:
      de vermelding dat de consument het recht heeft te bepalen met welke wederpartij die andere verplichting zal worden
      aangegaan;

      l. indien het effectieve rentepercentage voor beperkte duur geldt of indien een variabel effectief rentepercentage
      geldt: de periode gedurende welke dat rentepercentage geldt, alsmede de hoogte van de verschillende effectieve
      rentepercentages die van toepassing zijn op de overeenkomst, of indien dat nog niet kan worden vastgesteld, de
      wijze waarop de hoogte van het rentepercentage wordt bepaald;

      m. het kredietvergoedingspercentage met een beschrijving van de hierin opgenomen kosten, het hoogst toegestane
      kredietvergoedingspercentage, bedoeld in [artikel 5:15, eerste lid, van de wet][ref4], en de vermelding van de
      vernietigingsgrond, bedoeld in artikel 5:15, derde lid, van de wet;

      n. de voorwaarden inzake de bevoegdheid van de consument tot volledige of gedeeltelijke vervroegde aflossing;

      o. het percentage dat wordt toegepast ter berekening van de vertragingsvergoeding die verschuldigd wordt, indien
      de consument, na ingebrekestelling, nalatig blijft in zijn verplichting tot betaling, onder vermelding van de
      hoogst toegestane vertragingsvergoeding op grond van [artikel 5:15, eerste lid, van de wet][ref5], alsmede de in
      voorkomend geval in rekening te brengen buitengerechtelijke incassokosten;

      p. de wijze waarop de consument gebruik kan maken van zijn recht, bedoeld in [artikel 5:17 van de wet][ref6], om de
      overeenkomst te ontbinden;

      q. voor zover van toepassing de voorwaarden inzake ten behoeve van de kredietaanbieder te vestigen
      zekerheidsrechten.

      2 De informatie, bedoeld in het eerste lid, onderdelen b tot en met l, wordt op overzichtelijke wijze weergegeven
      in één document.

      3 De informatie, bedoeld in het eerste lid, wordt gebaseerd op de door de consument met betrekking tot het krediet
      kenbaar gemaakte voorkeur.

      4 De aanbieder verstrekt de consument, teneinde deze in staat te stellen te beoordelen of de voorgestelde
      overeenkomst inzake krediet aan zijn behoeften en financiële situatie beantwoordt, een passende toelichting op
      de informatie op de voornaamste kenmerken van het voorgestelde krediet, met inbegrip van de gevolgen indien de
      consument niet betaalt. In afwijking van [artikel 7:2][ref7] kan deze toelichting mondeling worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel514
      [ref3]: https://wetten.overheid.nl/BWBR0030883#Artikel516
