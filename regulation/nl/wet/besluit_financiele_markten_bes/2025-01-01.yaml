  - number: 2:16
    text: |-
      1 Een verzekeraar als bedoeld in [artikel 2:23, eerste lid, van de wet][ref1] maakt voor de ingevolge dat lid
      voorgeschreven kennisgeving gebruik van een door de Nederlandsche Bank vastgesteld formulier.

      2 Indien een verzekeraar als bedoeld in het eerste lid voornemens is verzekeringen aan te bieden tot dekking
      van wettelijke aansprakelijkheid, voortvloeiend uit het gebruik van motorrijtuigen, toont hij aan te voldoen aan
      [artikel 4:32 van de wet][ref2] en aan [artikel 6:8][ref3] van dit besluit.

      3 Indien een verzekeraar als bedoeld in het eerste lid voornemens is verzekeringen aan te bieden als bedoeld in
      [artikel 6:7, tweede lid][ref4], toont hij aan te voldoen aan de bij of krachtens dat artikel gestelde eisen.


