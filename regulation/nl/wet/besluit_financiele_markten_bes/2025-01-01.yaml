  - number: 3:9
    text: |-
      1 Een financiële onderneming beschikt met het oog op een integere uitoefening van het bedrijf over procedures en
      maatregelen met betrekking tot:

      a. de acceptatie van cliënten;

      b. risicoclassificaties ten aanzien van cliënten, producten en diensten;

      c. de analyse van gegevens van cliënten, mede in relatie tot de door die cliënten afgenomen producten of diensten,
      en de detectie van afwijkende transactiepatronen.

      2 Aan de hand van de procedures en maatregelen, bedoeld in het eerste lid, bepaalt de financiële onderneming tevens
      de risico’s van bepaalde cliënten, producten of diensten voor de integere uitoefening van haar bedrijf.

      3 Een financiële onderneming draagt zorg voor de documentatie en vastlegging met betrekking tot de acceptatie en
      indeling naar risico van cliënten en de bewaking van het handelen van cliënten. Dergelijke gegevens worden bewaard
      tot vijf jaar na de dienstverlening dan wel het beëindigen van de relatie met de desbetreffende cliënt.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel39
  - number: 3:10
    text: |-
      1 De Nederlandsche Bank kan regels stellen met het oog op het door financiële ondernemingen voorkomen van misbruik
      van technische toepassingen voor witwassen of financiering van terrorisme.

      2 De Nederlandsche Bank kan voorts met het oog op een integere uitoefening van het bedrijf regels stellen met
      betrekking tot het door kredietinstellingen te voeren beleid inzake afgeschermde rekeningen en rekeningen waarop
      waarden worden aangehouden ten behoeve van derden.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel310
  - number: 3:11
    text: |-
      De Nederlandsche Bank kan regels stellen met betrekking tot kredietinstrumenten waarbij de kredietnemer geld of
      financiële instrumenten ter beschikking krijgt, waartegenover de kredietverstrekker een zekerheid ontvangt, direct
      of indirect, uit eigen liquide middelen van de kredietnemer.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel311
  - number: 3:12
    text: |-
      1 Een kredietinstelling, verzekeraar of geldtransactiekantoor onderzoekt op verzoek van de Nederlandsche Bank,
      nadat deze door Onze Minister is geïnformeerd over bepaalde personen of instellingen die naar het oordeel van
      Onze Minister in verband met vermoede terroristische activiteiten of daarmee verband houdende activiteiten de
      integriteit van de financiële sector kunnen schaden, of zulke personen of instellingen in haar onderscheidenlijk
      zijn administratie voorkomen.

      2 De financiële onderneming verstrekt de uitkomst van het in het eerste lid bedoelde onderzoek, binnen een door de
      Nederlandsche Bank te stellen termijn, aan de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel312
  - number: 3:13
    text: |-
      1 Een financiële onderneming beschikt over procedures en maatregelen ter naleving van:

      a. de bij of krachtens de [Sanctiewet 1977][ref1] met betrekking tot het financieel verkeer gestelde regels;

      b. de bij of krachtens de [Wet ter voorkoming van witwassen en financieren van terrorisme BES][ref2] gestelde
      regels.

      2 De maatregelen, bedoeld in het eerste lid, onderdeel a, hebben ten minste betrekking op een adequate controle
      van de administratie van de financiële onderneming op het overeenkomen van de identiteit van een relatie met
      een persoon of entiteit, als bedoeld in de bij of krachtens de [Sanctiewet 1977][ref3] met betrekking tot het
      financieel verkeer gestelde regels, met het oog op het bevriezen van de financiële middelen van die relatie of het
      voorkomen van het ter beschikking stellen van financiële middelen of diensten aan die relatie.

      3 Voor de toepassing van het tweede lid wordt verstaan onder relatie: een ieder die betrokken is bij een financiële
      dienst of een financiële transactie.


      [ref1]: https://wetten.overheid.nl/BWBR0003296
      [ref2]: https://wetten.overheid.nl/BWBR0030824
      [ref3]: https://wetten.overheid.nl/BWBR0003296
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel313
    references:
      - id: ref1
        bwb_id: BWBR0003296
      - id: ref2
        bwb_id: BWBR0030824
      - id: ref3
        bwb_id: BWBR0003296
  - number: 3:14
    text: |-
      1 Een financiële onderneming beschikt over procedures en maatregelen met betrekking tot de omgang met en de
      vastlegging van incidenten. Die procedures en maatregelen voorzien in elk geval in een degelijke administratieve
      vastlegging van:

      a. de kenmerken van het incident;

      b. gegevens over de personen die het incident hebben bewerkstelligd;

      c. de naar aanleiding van het incident genomen maatregelen.

      2 De financiële onderneming neemt naar aanleiding van een incident maatregelen die zijn gericht op het beheersen
      van de opgetreden risico’s en het voorkomen van herhaling.

      3 De financiële onderneming informeert de toezichtautoriteit onverwijld schriftelijk omtrent incidenten.

      4 Voor de toepassing van dit artikel wordt verstaand onder incident: gedraging of gebeurtenis die een ernstig
      gevaar vormt voor de integere uitoefening van het bedrijf van de desbetreffende financiële onderneming.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel314
  - number: 3:15
    text: |-
      1 Een financiële onderneming beschikt over procedures en maatregelen met betrekking tot het tegengaan van
      verstrengeling van haar belangen of die van haar cliënten met privé-belangen van:

      a. personen die het beleid van de financiële onderneming bepalen;

      b. personen die het beleid bepalen van de groep waartoe de financiële onderneming behoort;

      c. leden van het orgaan dat is belast met het toezicht op het beleid en de algemene gang van zaken van de
      financiële onderneming;

      d. andere werknemers of andere personen die in haar opdracht op structurele basis werkzaamheden voor haar
      verrichten.

      2 De toezichtautoriteit kan ter voorkoming van belangenverstrengeling regels stellen met betrekking tot het
      verlenen van financiële diensten op basis van personeelscondities aan personen die het beleid van de financiële
      onderneming bepalen en groepsbestuurders.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel315
  - number: 3:16
    text: |-
      1 Een financiële onderneming houdt een overzicht bij van de integriteitsgevoelige functies in haar onderneming en
      van de taken, bevoegdheden en verantwoordelijkheden behorende bij elk van die functies.

      2 Een financiële onderneming beschikt over procedures en maatregelen die waarborgen dat integriteitsgevoelige
      functies slechts worden bekleed door personen waarvan zij een onderbouwde beoordeling van de betrouwbaarheid heeft
      gemaakt en voortdurend blijft maken.

      3 De werkzaamheden die zijn verricht ten behoeve van de naleving van het eerste en tweede lid en de uitkomsten van
      die werkzaamheden worden door de financiële onderneming schriftelijk vastgelegd.

      4 De toezichtautoriteit kan categorieën functies aanwijzen die voor de toepassing van dit artikel in ieder geval
      kwalificeren als integriteitsgevoelig, en nadere regels stellen met betrekking tot de wijze waarop een financiële
      onderneming de betrouwbaarheid beoordeelt van personen als bedoeld in het tweede lid en de vastlegging van gegevens
      ingevolge het derde lid.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel316
  - number: 3:17
    text: |-
      1 Omtrent een persoon van wie zij de betrouwbaarheid heeft beoordeeld ingevolge [artikel 3:16][ref1], verstrekt een
      financiële onderneming desgevraagd schriftelijk inlichtingen aan een andere financiële onderneming ten behoeve van
      de beoordeling door die andere financiële onderneming van die persoon ingevolge artikel 3:16, voor zover nodig om
      over de betrouwbaarheid een juist en zo volledig mogelijk beeld te geven.

      2 Een financiële onderneming onthoudt zich van handelingen waarvan zij weet of redelijkerwijs moet vermoeden dat
      deze een onjuist beeld kunnen doen ontstaan van een persoon als bedoeld in het eerste lid.

      3 De toezichtautoriteit kan regels stellen met betrekking tot de wijze waarop een financiële onderneming voldoet
      aan het eerste en het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel316
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel317
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: 3:16
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3:18
    text: |-
      1 Een trustkantoor houdt op een overzichtelijke wijze ten minste de bij regeling van Onze Minister aan te wijzen
      bescheiden en gegevens voor de toezichtautoriteit beschikbaar.

      2 De bescheiden en gegevens, bedoeld in het eerste lid, staan onmiddellijk ter beschikking van de
      toezichtautoriteit, indien deze daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel318
  - number: 3:19
    text: |-
      1 De bedrijfsvoering van een financiële onderneming of een bewaarder omvat:

      a. een duidelijke en adequate organisatiestructuur;

      b. een duidelijke en adequate verdeling van taken, bevoegdheden en verantwoordelijkheden;

      c. eenduidige rapportagelijnen;

      d. een adequaat systeem van informatievoorziening en communicatie;

      e. een adequaat systeem van interne controle.

      2 De bedrijfsvoering, bedoeld in het eerste lid, is afgestemd op de aard, omvang, risico’s en complexiteit van de
      werkzaamheden van de financiële onderneming of de bewaarder en wordt op inzichtelijke wijze vastgelegd.

      3 Een beheerder richt voor iedere beleggingsinstelling die hij beheert afzonderlijk een bedrijfsvoering als bedoeld
      in het eerste lid in.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel319
  - number: 3:20
    text: |-
      1 Een bemiddelaar in effecten of vermogensbeheerder beschikt over procedures en maatregelen voor het voorkomen van
      en omgaan met belangenconflicten tussen zijn onderneming en zijn cliënten of tussen zijn cliënten onderling.

      2 De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel320
  - number: 3:21
    text: |-
      1 Een bemiddelaar in effecten, elektronischgeldinstelling, kredietinstelling, vermogensbeheerder of verzekeraar
      voert beleid gericht op het beheersen van relevante financiële risico’s.

      2 Het beleid, bedoeld in het eerste lid, wordt vastgelegd in procedures en maatregelen ter beheersing van relevante
      financiële risico’s en geïntegreerd in de bedrijfsprocessen. Een financiële onderneming als bedoeld in het eerste
      lid ziet er op systematische wijze op toe dat de procedures en maatregelen uit de eerste volzin worden nageleefd en
      zorgt ervoor dat gesignaleerde tekortkomingen of gebreken worden opgeheven.

      3 Een kredietinstelling of verzekeraar heeft een onafhankelijke risicobeheerfunctie die op systematische wijze
      een onafhankelijke risicobeheer uitvoert dat gericht is op het identificeren, meten en evalueren van de financiële
      risico’s waaraan de kredietinstelling of verzekeraar kan worden blootgesteld.

      4 Een financiële onderneming met zetel in het buitenland, die in de staat van zetel onder prudentieel toezicht
      staat, wordt vermoed te voldoen aan de in het eerste tot en met derde lid gestelde eisen, zolang zij in de staat
      van zetel is toegelaten tot de uitoefening van haar bedrijf.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel321
  - number: 3:22
    text: |-
      Een beheerder of bewaarder met zetel in een openbaar lichaam, beschikt over procedures en maatregelen die
      waarborgen dat de omvang en samenstelling van en mutaties in de aan te houden financiële waarborgen getrouw en
      volledig kunnen worden vastgesteld. [Artikel 3:21, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel321
