  - number: 2:9
    text: |-
      1 Een financiële onderneming waaraan op grond van [deze wet][ref1] een vergunning is verleend, geeft de
      toezichtautoriteit kennis van het voornemen tot wijziging van:

      a. de personen die het dagelijks beleid van de financiële onderneming bepalen of het beleid van de financiële
      onderneming bepalen of mede bepalen;

      b. indien van toepassing, de personen die onderdeel zijn van een orgaan dat belast is met het toezicht op het
      beleid en de algemene gang van zaken van de financiële onderneming.

      2 Met betrekking tot het voornemen, bedoeld in het eerste lid, verstrekt de financiële onderneming gegevens en
      bescheiden op basis waarvan de toezichtautoriteit kan beoordelen of de financiële onderneming met betrekking tot
      de betrokken persoon voldoet aan de bij of krachtens de [artikelen 3:4][ref2] en [3:5 van de wet][ref3] gestelde
      regels met betrekking tot de betrouwbaarheid en de geschiktheid.

      3 De financiële onderneming geeft geen uitvoering aan de voornemens, bedoeld in het eerste lid, voordat de
      toezichtautoriteit heeft ingestemd met de wijziging. De toezichtautoriteit neemt een besluit omtrent instemming
      binnen acht weken na ontvangst van de kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0030883#Artikel35
