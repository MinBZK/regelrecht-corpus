      1 Uit de jaarrekening van een kredietinstelling met zetel in het buitenland die door middel van een bijkantoor
      actief is in de openbare lichamen, blijkt de omvang van de bij het bijkantoor aangehouden betaalrekeningen,
      spaartegoeden en deposito’s per ultimo van het afgesloten boekjaar.

      2 Uit de jaarrekening van een verzekeraar met zetel in het buitenland die door middel van een bijkantoor actief is
      in de openbare lichamen, blijkt de omvang van de door het bijkantoor ontvangen bruto premies over het afgesloten
      boekjaar.
