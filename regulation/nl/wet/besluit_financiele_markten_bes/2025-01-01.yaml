      1 Voor de toepassing van [artikel 4:23, eerste lid, aanhef en onderdeel b, van de wet][ref1] wordt als significante
      deelneming aangemerkt:

      a. een deelneming in een financiële onderneming waarvan het balanstotaal ten tijde van de verwerving,
      onderscheidenlijk de vergroting, meer bedraagt dan een procent van het geconsolideerde balanstotaal van de
      kredietinstelling;

      b. een deelneming in een onderneming, niet zijnde een financiële onderneming, indien het bedrag dat wordt betaald
      voor de verwerving van die deelneming, onderscheidenlijk voor de vergroting van die deelneming, tezamen met de
      bedragen die voor die verwerving en voor eerdere vergrotingen van die deelnemingen zijn betaald, meer bedraagt dan
      een procent van het geconsolideerde aanwezige eigen vermogen van de kredietinstelling.

      2 Van het geheel of voor een belangrijk deel al dan niet middellijk overnemen van de activa en passiva van een
      andere onderneming of instelling in de zin van [artikel 4:23, eerste lid, aanhef en onderdeel c, van de wet][ref2]
      is sprake, indien het totaalbedrag van de over te nemen activa of over te nemen passiva meer bedraagt dan een
      procent van het geconsolideerde balanstotaal van de kredietinstelling.


