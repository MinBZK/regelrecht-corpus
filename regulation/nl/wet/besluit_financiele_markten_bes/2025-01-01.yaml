  - number: 11:5
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen en onderdelen daarvan en voor de verschillende op grond van dit besluit te onderscheiden categorieën
      financiële ondernemingen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel115
  - number: 11:6
    text: 'Dit besluit wordt aangehaald als: Besluit financiële markten BES.'
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel116
