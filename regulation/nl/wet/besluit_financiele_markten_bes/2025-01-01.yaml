      [ref5]: https://wetten.overheid.nl/BWBR0030883#Artikel515
      [ref6]: https://wetten.overheid.nl/BWBR0030883#Artikel517
      [ref7]: https://wetten.overheid.nl/BWBR0031636#Artikel72
