        bwb_id: BWBR0030883
        artikel: 3:4
      - id: ref2
        bwb_id: BWBR0031636
  - number: 3:2
    text: |-
      De betrouwbaarheid van een persoon als bedoeld in [artikel 3:1, eerste lid][ref1], staat niet buiten twijfel als
      deze veroordeeld is ter zake van een misdrijf, genoemd in onderdeel 1 van [bijlage 1][ref2], tenzij er sinds het
      onherroepelijk worden van de uitspraak acht jaren of meer zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0031636
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel32
