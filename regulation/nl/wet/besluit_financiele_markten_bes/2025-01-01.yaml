        paragraaf: '7'
  - number: 4:22
    text: |-
      1 Een bemiddelaar in effecten of vermogensbeheerder beschikt over een toetsingsvermogen dat ten minste gelijk is
      aan vijfentwintig procent van de door de Nederlandsche Bank vastgestelde vaste kosten in het afgelopen boekjaar.
      Indien de vermogensbeheerder of bemiddelaar in effecten haar werkzaamheden niet gedurende een volledig boekjaar
      heeft uitgeoefend, bedraagt de minimumomvang van het toetsingsvermogen vijfentwintig procent van de in haar
      programma van werkzaamheden begrote vaste kosten. De Nederlandsche Bank kan besluiten dat een hogere minimumomvang
      geldt, indien aannemelijk is dat de vaste kosten te laag zijn.

      2 Het eerste lid is niet van toepassing op bemiddelaars in effecten als bedoeld in
      [artikel 4:21, tweede lid][ref1].

      3 Het in aanmerking te nemen toetsingsvermogen van een bemiddelaar in effecten of een vermogensbeheerder wordt
      gevormd door de waarde van de in [artikel 4:21, derde lid][ref2], genoemde vermogensbestanddelen. Artikel 4:21,
      vierde lid is van overeenkomstige toepassing.

      4 Onverminderd het eerste lid, is het toetsingsvermogen ten minste gelijk aan het ingevolge
      [artikel 4:21, eerste lid][ref3], voorgeschreven minimumbedrag.


