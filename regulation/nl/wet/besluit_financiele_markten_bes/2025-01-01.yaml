    text: |-
      Het is een verzekeraar als bedoeld in [artikel 2:23, eerste lid, van de wet][ref1], niet zijnde een verzekeraar
      met zetel in Curaçao of Sint Maarten, slechts toegestaan vanuit het buitenland verzekeringen aan te bieden in
      de openbare lichamen indien het naar de aard en de waarde van het te verzekeren belang risico’s betreft die niet
      binnen de openbare lichamen verzekerbaar zijn.


