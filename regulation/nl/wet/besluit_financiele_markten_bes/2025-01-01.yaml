  - number: 7:7
    text: |-
      Voorafgaande aan de totstandkoming van een overeenkomst inzake een levensverzekering verstrekt een
      levensverzekeraar een cliënt, onverminderd [artikel 7:5][ref1], ten minste de volgende informatie:

      a. het bedrag van de uitkering of uitkeringen waartoe hij zich verplicht of, voorzover dit bedrag niet op voorhand
      nauwkeurig kan worden bepaald, een nauwkeurige omschrijving van die uitkering of uitkeringen, alsmede van de
      factoren waarvan de hoogte van de uitkering of uitkeringen afhankelijk is;

      b. een omschrijving van de keuzemogelijkheden die de cliënt of de gerechtigde op een uitkering heeft ingevolge
      de overeenkomst;

      c. een nauwkeurige omschrijving van de valuta waarin de premie of de uitkering is uitgedrukt, indien dat een
      andere valuta is dan de dollar, of van de units, eenheden of datgene waarin de premie of de uitkering anderszins
      is uitgedrukt, of, indien de uitkering strekt tot het verrichten van andere dan geldelijke prestaties, van die
      prestaties;

      d. indien bij een uitkering omzetting plaatsvindt in dollars of een andere valuta: een nauwkeurige omschrijving van
      de omzettingsmethode;

      e. indien de uitkering in waarden wordt uitgedrukt: de vermelding van de aard van de waarden, waaronder aandelen of
      andersoortige rechten van deelneming in een beleggingsinstelling;

      f. indien de overeenkomst een recht op winstdeling omvat: de wijze van berekening en toewijzing van de winstdeling;

      g. de looptijd van de overeenkomst;

      h. de premie, verschuldigd voor de hoofddekking, en, indien de overeenkomst voorziet in een of meer
      nevenuitkeringen, de premies die voor elk van de nevenuitkeringen zijn verschuldigd, alsmede, indien deze premies
      gedurende de looptijd fluctueren, een zo nauwkeurig mogelijke beschrijving van de wijze waarop ze worden berekend
      en van de factoren waardoor het beloop ervan wordt bepaald;

      i. een opgave of de premie eenmalig is verschuldigd dan wel periodiek;

      j. de periode gedurende welke premie verschuldigd is;

      k. de kosten die naast de brutopremie in rekening worden gebracht;

      l. indien de uitkering wordt uitgedrukt in rechten van deelneming in een beleggingsinstelling:

      1°. de kosten die worden ingehouden op de premie, bedoeld in onderdeel h, onderverdeeld naar eerste kosten,
      doorlopende kosten en aan- en verkoopkosten;

      2°. de kosten die worden ingehouden op de waarde van de rechten van deelneming, onderverdeeld naar eerste kosten,
      doorlopende kosten en aan- en verkoopkosten;

      3°. de kosten die de beheerder van de beleggingsinstelling jaarlijks in rekening brengt voor het beheer van de
      rechten van deelneming in die beleggingsinstelling;

      4°. de invloed van het gemiddelde jaarlijkse percentage van de kosten, bedoeld onder 1°, 2° en 3°, op het rendement
      en de uitkering, verbonden aan de overeenkomst;

      5°. de wijze waarop kosten als bedoeld onder 1°, 2° en 3°, worden verdeeld over de looptijd van de overeenkomst met
      de cliënt;

      m. een omschrijving van de gevolgen van een verhoging of verlaging van de premie, met inbegrip van premievrijmaken,
      en, indien de overeenkomst in die mogelijkheid voorziet, van afkoop, en een opgave van de afkoopwaarde gedurende
      ten minste de eerste vijf jaren van de looptijd, onder vermelding van het voor de berekening gehanteerde
      rendementspercentage;

      n. de wijze waarop de cliënt gebruik kan maken van zijn recht, bedoeld in [artikel 5:18 van de wet][ref2], om de
      overeenkomst te ontbinden;

      o. het aan de overeenkomst verbonden financiële risico en de mate waarin dit risico voor rekening is van de cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel518
