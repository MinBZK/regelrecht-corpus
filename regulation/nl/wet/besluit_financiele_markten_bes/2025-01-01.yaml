      Een trustkantoor draagt zorg voor een deugdelijke administratie, en heeft maatregelen getroffen om de rechten,
      met betrekking tot gelden of geldswaarden, van ondernemingen waaraan door het trustkantoor beheersdiensten zullen
      worden verleend, en van derden te beschermen. De maatregelen strekken in ieder geval tot een volledige scheiding
      tussen de vermogensbestanddelen van elk van die ondernemingen, iedere derde en van het trustkantoor.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel446
  - number: 4:47
    text: |-
      1 De beroepsaansprakelijkheidsverzekering, bedoeld in [artikel 3:24 van de wet][ref1], dekt de aansprakelijkheid
      van de adviseur, bemiddelaar, niet zijnde een bemiddelaar in effecten, of gevolmachtigde agent wegens fouten,
      verzuimen of nalatigheden, begaan in de uitoefening van diens beroep.

      2 De beroepsaansprakelijkheidsverzekering wordt gesloten bij een verzekeraar die in de staat van zetel bevoegd is
      tot uitoefening van het desbetreffende verzekeringsbedrijf.

      3 De Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot de hoogte van het verzekerd bedrag.


