        artikel: 4:30
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:27
    text: |-
      1 Het minimumbedrag van het garantiefonds en de solvabiliteitsmarge van een verzekeraar worden gevormd door de
      volgende vermogensbestanddelen:

      a. het gestorte kapitaal of waarborgkapitaal vermeerderd met ledenrekeningen;

      b. de wettelijke, statutaire en overige reserves;

      c. de onverdeelde winst dan wel het verlies;

      d. achtergestelde leningen en achtergestelde schuldinstrumenten;

      e. andere door de Nederlandsche Bank toegestane vermogensbestanddelen.

      2 De Nederlandsche Bank kan nadere regels stellen met betrekking tot de mate waarin en de voorwaarden waaronder de
      in het eerste lid genoemde vermogensbestanddelen worden meegerekend bij het bepalen van de solvabiliteitsmarge.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel427
  - number: 4:28
    text: |-
      1 Een beleggingsinstelling met zetel in een openbaar lichaam, waarvan in de openbare lichamen de rechten
      van deelneming op verzoek van de deelnemers ten laste van de activa direct of indirect worden ingekocht of
      terugbetaald, beschikt over voldoende liquiditeit.

      2 De liquiditeit van een beleggingsinstelling is voldoende, indien de aanwezige liquiditeit, bedoeld in het vierde
      lid, ten minste gelijk is aan de vereiste liquiditeit, bedoeld in het derde lid.

      3 De vereiste liquiditeit van een beleggingsinstelling bedraagt tien procent van het beheerde vermogen. In
      afwijking van de eerste volzin kan, indien uit een overeengekomen ontbindings- of beëindigingsregeling vooraf
      bekend is voor welk bedrag op een bepaalde datum wordt ingekocht, worden volstaan met dat bedrag.

      4 De aanwezige liquiditeit van een beleggingsinstelling wordt berekend op basis van door de Nederlandsche Bank te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel428
  - number: 4:29
    text: |-
      1 De liquiditeit van een kredietinstelling is voldoende indien de aanwezige liquiditeit, bedoeld in het derde lid,
      ten minste gelijk is aan de vereiste liquiditeit, bedoeld in het tweede lid.

      2 De vereiste liquiditeit van een kredietinstelling bestaat uit de som van de gewogen uitstaande kasstromen op
      basis van de kalenderposten, vermeerderd met de niet in de vervalkalender opgenomen toevertrouwde middelen en
      overige posten die tot een betalingsverplichting kunnen leiden, gedurende de maandperiode. Onder kalenderposten
      wordt verstaan een actiefpost of passiefpost waarvan de kasinstromen respectievelijk kasuitstromen als gevolg van
      aflossing of rentebetalingen in de vervalkalender worden opgenomen.

      3 De aanwezige liquiditeit van een kredietinstelling wordt gevormd door de gewogen voorraadposten en de gewogen
      kasinstroom van de kalenderposten gedurende de maandperiode, alsmede de officiële standby-faciliteiten. Onder
      voorraadpost wordt verstaan de liquide activa die niet in de vervalkalender zijn opgenomen.

      4 De Nederlandsche Bank stelt nadere regels met betrekking tot het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel429
  - number: 4:30
    text: |-
      1 De technische voorzieningen van een verzekeraar bestaan, telkens voor zover van toepassing, uit:

      a. de voorziening voor niet-verdiende premies en de voorziening voor lopende risico’s, waaronder de
      catastrofevoorziening indien deze is getroffen;

      b. de voorziening voor levensverzekering;

      c. de voorziening voor te betalen schaden of voor te betalen uitkeringen;

      d. de voorziening voor winstdeling en kortingen;

      e. de voorziening voor latente winstdelingsverplichtingen;

      f. de egalisatievoorziening, voor zover egalisatie van winsten en verliezen bij of krachtens de wet is toegestaan;

      g. de overige technische voorzieningen.

      2 De Nederlandsche Bank kan nadere regels stellen met betrekking tot de mate waarin technische voorzieningen moeten
      worden gevormd met betrekking tot verplichtingen en kosten en omtrent de indeling van de technische voorzieningen.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel430
  - number: 4:31
    text: |-
      1 De technische voorzieningen worden gewaardeerd op voor het verzekeringsbedrijf aanvaarde grondslagen. Bij
      de waardering van de technische voorzieningen wordt ervan uitgegaan dat de verzekeringsmaatschappij in staat
      moet zijn te voldoen aan haar naar maatstaven van redelijkheid en billijkheid voorzienbare verplichtingen uit
      verzekeringsovereenkomsten.

      2 De Nederlandsche Bank kan nadere regels stellen met betrekking tot de voor de berekening van de technische
      voorzieningen te hanteren grondslagen.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel431
  - number: 4:32
    text: |-
      De voorzieningen, bedoeld in [artikel 4:30, onderdelen a tot en met c][ref1], worden zoveel mogelijk voor
      elke overeenkomst onderscheidenlijk elke schade afzonderlijk en op voorzichtige wijze bepaald. Het gebruik van
      statistische of wiskundige methoden is toegestaan, indien de aard van de overeenkomst dat toelaat, en deze methoden
      naar verwachting dezelfde resultaten opleveren als de afzonderlijke berekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel430
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel432
    references:
