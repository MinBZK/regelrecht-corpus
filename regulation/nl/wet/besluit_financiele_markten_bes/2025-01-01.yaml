      1 De hoogst toegelaten kredietvergoeding wordt uitgedrukt in een effectief percentage op jaarbasis aan totale
      kosten ten opzichte van het kredietbedrag. Dit percentage wordt bij regeling van Onze minister vastgesteld.

      2 Het kredietvergoedingspercentage dat van toepassing is op een overeenkomst inzake krediet wordt berekend als
      volgt:

      waarin:

      *KVP* = kredietvergoedingspercentage per jaar;

      *k* = nominale kredietvergoedingspercentage per jaar.

      3 Het nominale kredietvergoedingspercentage per jaar wordt berekend door het nominale kredietvergoedingspercentage
      per maand te vermenigvuldigen met twaalf.

      4 Het nominale kredietvergoedingspercentage per maand wordt berekend als volgt:

      waarin:

      *PMT* = maandelijkse annuïteit;

      *KB* = kredietbedrag;

      *n* = het aantal maandelijkse termijnen;

      *k* = nominale kredietvergoedingspercentage per maand.

      5 De maandelijkse annuïteit wordt berekend als volgt:

      waarin:

      *TB* = totaalbedrag, zijnde het kredietbedrag plus alle kosten, niet zijnde rente, uitgedrukt in contante waarde op
      het moment van het aangaan van de overeenkomst inzake krediet;

      *i* = nominale rentepercentage per maand, gedeeld door honderd.

      6 Indien het totale door de consument te betalen bedrag wordt afgelost in andere termijnen dan maandelijkse
      termijnen, gaat de kredietaanbieder bij de berekening van het kredietvergoedingspercentage, bedoeld in het tweede
      lid, uit van de op het krediet van toepassing zijnde aflossingstermijnen.

      7 Indien de kosten, bedoeld in het eerste lid, enkel bestaat uit rente, is het kredietvergoedingspercentage gelijk
      aan het effectieve rentepercentage dat wordt berekend als volgt:

      waarin:

      *r* = effectieve rentepercentage per jaar;

      *i* = nominale rentepercentage per jaar, gedeeld door honderd;

      *n* = aantal termijnen per jaar.

      8 Indien het nominale rentepercentage niet constant is gedurende de looptijd van de kredietovereenkomst, gebruikt
      de kredietaanbieder het gewogen gemiddelde rentepercentage, of ingeval dat nog niet kan worden vastgesteld, het
      hoogste rentepercentage gedurende de looptijd van de overeenkomst.
