  - number: 2:7
    text: |-
      1 Het programma van werkzaamheden, bedoeld in [artikel 2:2, onderdeel f][ref1], van een levensverzekeraar met zetel
      in het buitenland bevat:

      a. een opgave van de aard van de overeenkomsten die de verzekeraar voornemens is aan te gaan in de openbare
      lichamen;

      b. de polisvoorwaarden die de verzekeraar voornemens is te gebruiken in de openbare lichamen.

      2 Het programma van werkzaamheden, bedoeld in [artikel 2:2, onderdeel f][ref2], van een schadeverzekeraar met zetel
      in het buitenland bevat:

      a. een opgave van de aarde van de risico’s die de verzekeraar voornemens is te dekken in de openbare lichamen;

      b. de polisvoorwaarden die de verzekeraar voornemens is te gebruiken in de openbare lichamen.

      3 Een levensverzekeraar of schadeverzekeraar met zetel in het buitenland voegt bij het programma van werkzaamheden
      zijn jaarrekeningen van de laatste drie boekjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel22
