  - number: 7:19
    text: |-
      1 Een kredietaanbieder legt de criteria vast die hij, met inachtneming van [artikel 7:17][ref1], ten grondslag legt
      aan de beoordeling van kredietaanvragen van consumenten.

      2 Een kredietaanbieder mag in individuele gevallen afwijken van de [artikelen 7:17][ref2] en [7:18][ref3], mits
      aantoonbaar aan de volgende voorwaarden wordt voldaan:

      a. de overeenkomst inzake krediet is gelet op het risico van overkreditering verantwoord;

      b. de aanbieder heeft de juistheid gecontroleerd van de feiten en omstandigheden waarop de afwijking is gebaseerd;

      c. de aanbieder heeft vastgesteld dat het aannemelijk is dat aanleiding voor de afwijking een aanhoudende situatie
      betreft;

      d. de afwijking wordt gemotiveerd en vastgelegd en met documenten onderbouwd, en het bevat een duidelijke
      berekening waaruit blijkt dat de afwijkende situatie getoetst is op het voorkomen van overkreditering.


