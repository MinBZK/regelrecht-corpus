  - number: 10a:8
    text: |-
      1 De Nederlandsche Bank stelt jaarlijks voor 1 mei de hoogte van de door een kredietinstelling met inachtneming van
      [artikel 10A:7][ref1] verschuldigde bijdrage vast overeenkomstig [bijlage 2b][ref2] van dit besluit.

      2 De vaststelling van de hoogte van de bijdrage geschiedt op basis van de gegevens, bedoeld in
      [artikel 10A:6][ref3].

      3 Indien een kredietinstelling de gegevens niet tijdig of niet volledig heeft ingediend, schat de Nederlandsche
      Bank de omvang van de depositobasis van die instelling en stelt op basis van die schatting de hoogte van de
      verschuldigde bijdrage vast.

      4 Een kredietinstelling voldoet het bedrag van de door haar verschuldigde bijdrage aan de Stichting, binnen 6 weken
      nadat het vastgestelde bedrag door de Nederlandsche Bank aan haar is medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel10a7
