      Een bemiddelaar in schadeverzekeringen of levensverzekeringen draagt er zorg voor dat degenen die de feitelijke
      leiding hebben over een vestiging van zijn bedrijf, allen beschikken over een door een bij regeling van Onze
      Minister, zo nodig onder voorwaarden, erkend diploma voor de bemiddeling in schadeverzekeringen onderscheidenlijk
      levensverzekeringen.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel329
  - number: 3:30
    text: |-
      1 Een financiële onderneming die financiële producten aanbiedt of financiële diensten verleent beschikt met het
      oog op een adequate behandeling van klachten van cliënten of consumenten over die producten of diensten over een
      behoorlijke administratie van die klachten, waarin ten minste worden vastgelegd:

      a. de naam en het adres van de klager;

      b. de klacht, met de daarbij behorende dagtekening van ontvangst;

      c. een omschrijving van de klacht;

      d. een beschrijving van de wijze waarop de financiële onderneming de klacht heeft behandeld.

      2 Een financiële onderneming bewaart de in het eerste lid bedoelde gegevens gedurende ten minste een jaar nadat de
      klacht door haar is afgehandeld.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel330
  - number: 3:31
    text: |-
      In deze paragraaf wordt onder uitbesteden verstaan: het door een financiële onderneming verlenen van een opdracht
      aan een derde tot het ten behoeve van die financiële onderneming verrichten van werkzaamheden:

      a. die deel uitmaken van of voortvloeien uit het uitoefenen van haar bedrijf of het aanbieden van financiële
      producten dan wel verlenen van financiële diensten;

      b. die deel uitmaken van de wezenlijke bedrijfsprocessen ter ondersteuning daarvan.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel331
  - number: 3:32
    text: |-
      1 Een financiële onderneming gaat niet over tot het uitbesteden van werkzaamheden indien dat een belemmering vormt
      voor een adequaat toezicht op de naleving van de bij of krachtens de wet gestelde regels.

      2 Een financiële onderneming besteedt de taken en werkzaamheden van personen die het dagelijks beleid bepalen,
      daaronder mede verstaan het vaststellen van het beleid en het afleggen van verantwoording over het gevoerde beleid,
      niet uit.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel332
  - number: 3:33
    text: |-
      1 Een financiële onderneming die werkzaamheden uitbesteedt aan een derde, draagt er zorg voor dat de derde de
      uitbestede werkzaamheden op adequate wijze uitvoert, de uitvoering afdoende controleert en de daaraan verbonden
      risico’s op adequate wijze beheerst. Zij legt de overeenkomst met de derde waaraan de werkzaamheden op structurele
      basis worden uitbesteed schriftelijk vast.

      2 De toezichtautoriteit kan nadere regels stellen met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel333
  - number: 3:34
    text: |-
      1 Een beheerder besteedt het bepalen van het beleggingsbeleid van een beleggingsinstelling niet uit.

      2 De [artikelen 3:32][ref1] en [3:33][ref2] zijn van overeenkomstige toepassing op een beheerder of bewaarder.


