      1 Overname van het premie-incasso door een verzekeraar van een bemiddelaar in verzekeringen als bedoeld in
      [artikel 4:45, derde lid, van de wet][ref1], laat onverlet de aanspraak op provisie van die bemiddelaar, bedoeld in
      [artikel 6:9, eerste lid][ref2].

      2 Onverminderd het eerste lid, is de verzekeraar na overname van het premie-incasso bevoegd om aan de bemiddelaar
