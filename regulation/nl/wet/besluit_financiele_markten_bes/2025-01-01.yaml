  - number: 10a:2
    text: |-
      1 Ingevolge het depositogarantiestelsel zijn deposito’s gegarandeerd tot een bedrag van USD 25.000 per persoon
      per kredietinstelling.

      2 Het depositogarantiestelsel garandeert deposito's, met uitzondering van deposito’s als bedoeld in
      [bijlage 2A][ref1], van personen:

      a. die deposito's op eigen naam en voor eigen rekening bij de betalingsonmachtige kredietinstelling aanhouden;

      b. die tezamen met een ander op eigen naam deposito's bij de betalingsonmachtige kredietinstelling aanhouden;

      c. te wier behoeve door een derde, op naam van die derde, deposito's worden aangehouden bij de betalingsonmachtige
      kredietinstelling, mits:

      1°. die deposito's worden aangehouden op grond van of ter uitvoering van reeds voor de inwerkingstelling van
      het depositogarantiestelsel tussen de rekeninghouder en bedoelde personen geldende wettelijke of contractuele
      bepalingen;

      2°. de identiteit van bedoelde personen bij de kredietinstelling bekend is of aan de hand van een door de
      rekeninghouder gevoerde professionele administratie kan worden vastgesteld; en

      3°. de hoogte van de deposito’s aan de hand van reeds voor de inwerkingstelling van het depositogarantiestelsel
      vastgelegde gegevens kan worden vastgesteld.

      3 Indien op gegarandeerde deposito’s rente is aangegroeid die nog niet is gecrediteerd op het tijdstip waarop
      op grond van [artikel 10A.14][ref2] besloten is tot inwerkingstelling van het depositogarantiestelsel, wordt het
      aangegroeide rentebedrag gerekend tot de deposito’s.


      [ref1]: https://wetten.overheid.nl/BWBR0031636
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel10a14
