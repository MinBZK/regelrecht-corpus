  - number: 1:8
    text: |-
      De [wet][ref1], met uitzondering van [hoofdstuk 1][ref2], [hoofdstuk 5, paragrafen 4][ref3] en [5][ref4], en de
      [hoofdstukken 6][ref5] en [7][ref6], is niet van toepassing op:

      a. het verlenen van financiële diensten of het aanbieden van financiële producten, niet zijnde rechten van
      deelneming in beleggingsinstellingen, door pensioenfondsen voor zover zij die financiële diensten verlenen of die
      financiële producten aanbieden aan de bedrijfstak of onderneming waarmee zij zijn verbonden;

      b. het optreden als vermogensbeheerder ten behoeve van pensioenfondsen of daaraan gelieerde fondsen door personen
      die zijn verbonden aan het fonds waaraan deze financiële dienst wordt verleend.


