        bwb_id: BWBR0031636
        artikel: 4:30
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:35
    text: |-
      1 De voorziening voor te betalen schaden of voor te betalen uitkeringen, bedoeld in
      [artikel 4:30, onderdeel c][ref1], omvat het bedrag van de te verwachten schaden of uitkeringen, in aanmerking
      nemende:

      a. de voor de balansdatum ontstane schaden of uitkeringen die zijn gemeld en nog niet zijn afgewikkeld, en de
      schaden of uitkeringen die nog niet zijn gemeld;

      b. de kosten verband houdende met de afwikkeling van schaden of uitkeringen;

      c. de in verband met schaden of uitkeringen te verwachten baten uit subrogatie en de verkrijging van de eigendom
      van verzekerde zaken.

      2 Discontering van de voorziening voor te betalen schaden of voor te betalen uitkeringen, anders dan periodiek
      te betalen schaden, is slechts toegestaan in door de Nederlandsche Bank te bepalen gevallen en onder door de
      Nederlandsche Bank te stellen voorwaarden.

      3 Indien de verplichtingen uit overeenkomsten van verzekering op het tijdstip van het opmaken van de jaarrekening
      redelijkerwijs niet te schatten zijn wegens het ontbreken van voldoende nauwkeurige gegevens met betrekking tot
      de over het tekenjaar te ontvangen premies of te betalen schaden en kosten van afwikkeling van de schade, kan
      de Nederlandsche Bank, onder door haar te stellen voorwaarden, een andere berekening van de voorziening voor te
      betalen schade of voor te betalen uitkeringen toestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel430
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel435
    references:
