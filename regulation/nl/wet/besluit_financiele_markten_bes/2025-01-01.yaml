  - number: 4:26
    text: |-
      1 Een levensverzekeraar of een natura-uitvaartverzekeraar beschikt over een solvabiliteitsmarge die ten minste
      gelijk is aan vier procent van de technische voorzieningen, bedoeld in [artikel 4:30][ref1], zonder rekening te
      houden met de herverzekering van deze verplichtingen.

      2 Een schadeverzekeraar beschikt over een solvabiliteitsmarge die ten minste gelijk is aan vijftien procent van de
      in het voorgaande boekjaar geboekte bruto premies.

      3 De berekening van het minimumbedrag van de solvabiliteitsmarge, bedoeld in het eerste en tweede lid, geschiedt
      aan de hand van een door de Nederlandsche Bank vastgesteld model.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel430
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel426
