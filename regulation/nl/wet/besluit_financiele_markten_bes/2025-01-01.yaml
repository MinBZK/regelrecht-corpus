  - number: 8:4
    text: |-
      [Artikel 5:25, eerste lid, van de wet][ref1] is niet van toepassing op de volgende categorieën transacties:

      a. transacties in het kader van het monetaire beleid, het valutabeleid of het beheer van de overheidsschuld;

      b. het in het kader van een personeelsregeling aan personen als bedoeld in
      [artikel 3:5, eerste lid, van de wet][ref2] of aan werknemers toekennen van effecten, indien daarbij een bestendige
      gedragslijn wordt gehanteerd met betrekking tot de voorwaarden en de periodiciteit van de regeling;

      c. het in het kader van een personeelsregeling als bedoeld in onderdeel b uitoefenen van toegekende opties
      dan wel soortgelijke rechten, op de expiratiedatum van het desbetreffende recht of binnen een periode van vijf
      werkdagen voorafgaande aan die datum, alsmede het verkopen van de met de uitoefening van deze rechten verworven
      effecten binnen deze periode, indien de rechthebbende in dit laatste geval ten minste vier maanden voor de
      expiratiedatum schriftelijk aan de uitgevende instelling kenbaar heeft gemaakt tot verkoop te zullen overgaan of
      een onherroepelijke volmacht tot verkoop aan de uitgevende instelling heeft verleend;

      d. een transactie waarvan het verrichten of bewerkstelligen noodzakelijk is om te kunnen voldoen aan een
      verplichting tot levering van aandelen of certificaten van aandelen;

      e. het bij wijze van dividenduitkering uitgeven of, anders dan in de vorm van keuzedividend, verkrijgen van
      aandelen of certificaten van aandelen;

      f. het verkopen van in het kader van een personeelsregeling als bedoeld in onderdeel b toegekende effecten
      onmiddellijk nadat verkoop volgens de voorwaarden van de toekenning voor het eerst mogelijk wordt, waarbij
      de betrokkene de opbrengst van de verkoop onmiddellijk aanwendt ter voldoening van een uit de toekenning
      voortvloeiende belastingplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel525
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel35
