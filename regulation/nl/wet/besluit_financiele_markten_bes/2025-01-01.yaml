  - number: 3:5
    text: |-
      1 Het dagelijks beleid van een beleggingsinstelling, bewaarder, kredietinstelling, trustkantoor of verzekeraar
      wordt bepaald door ten minste twee natuurlijke personen.

      2 Een kredietinstelling of verzekeraar met zetel in de openbare lichamen heeft een uit ten minste drie leden
      bestaande raad van commissarissen dan wel gelijksoortig orgaan, belast met toezicht op het beleid en de algemene
      gang van zaken binnen de financiële onderneming.

      3 Indien een beleggingsinstelling met zetel in de openbare lichamen een raad van commissarissen heeft, bestaat deze
      uit ten minste drie leden.

      4 Ten minste een van de personen die het dagelijks beleid bepalen van een trustkantoor verricht zijn werkzaamheden
      in verband daarmee vanuit de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel35
  - number: 3:6
    text: |-
      1 Deze paragraaf is niet van toepassing op adviseurs, bemiddelaars, gevolmachtigde agenten of ondergevolmachtigde
      agenten, indien deze in het voorafgaande boekjaar een omzet hadden van minder dan USD 0,5 miljoen.

      2 Voor de toepassing van deze paragraaf wordt onder cliënt mede verstaan de persoon die kwalificeert als
      professionele marktpartij, en wordt met een financiële onderneming gelijkgesteld de aan een beleggingsinstelling
      verbonden bewaarder.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel36
  - number: 3:7
    text: |-
      1 Een financiële onderneming draagt zorg voor een integriteitsbewuste bedrijfscultuur, door procedures en
      maatregelen geïntegreerd in de bedrijfsvoering en gebaseerd op een systematische analyse van risico’s die kunnen
      leiden tot aantasting van de reputatie of een bestaande of toekomstige bedreiging kunnen vormen van het vermogen of
      het resultaat van een financiële onderneming als gevolg van een ontoereikende naleving van hetgeen bij of krachtens
      enig wettelijk voorschrift is voorgeschreven of handelen in strijd met de maatschappelijke betamelijkheid.

      2 Een financiële onderneming legt schriftelijk haar beleid vast met betrekking tot het bepaalde in het eerste lid
      en stelt alle bedrijfsonderdelen in kennis van dit beleid en de procedures en de maatregelen bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel37
  - number: 3:8
    text: |-
      1 Een financiële onderneming wijst ten minste één functionaris op managementniveau aan die op onafhankelijke en
      effectieve wijze de naleving controleert van de wettelijke voorschriften en interne regels met betrekking tot de
      integere uitoefening van het bedrijf en de regels bedoeld in [artikel 3:15, eerste lid][ref1].

      2 De financiële onderneming draagt er zorg voor dat de functionaris, bedoeld in het eerste lid, binnen korte
      tijd kan beschikken over transactiegegevens, alsmede over gegevens die de financiële onderneming heeft vastgelegd
      ingevolge dit hoofdstuk of de [Wet ter voorkoming van witwassen en financieren van terrorisme BES][ref2], en andere
      voor zijn taak relevante gegevens.

      3 Een financiële onderneming beschikt over procedures die erin voorzien dat gesignaleerde tekortkomingen of
      gebreken worden gerapporteerd aan de functionaris.

      4 Een financiële onderneming beoordeelt periodiek de interne controlesystemen op hun effectiviteit en
      actualiteitswaarde en stelt deze zo nodig bij.

      5 Een financiële onderneming waarborgt dat kennis die wordt opgedaan bij de uitvoering van het eerste tot en met
      derde lid, en de resultaten van maatregelen genomen naar aanleiding van de controle, bedoeld in het eerste lid,
      binnen haar organisatie beschikbaar blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel315
      [ref2]: https://wetten.overheid.nl/BWBR0030824
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel38
    references:
