  - number: 10a:19
    text: |-
      1 De Nederlandsche Bank kan de termijn, bedoeld in [artikel 10A:18, tweede lid][ref1], opschorten indien:

      a. een aanvrager strafrechtelijk wordt vervolgd ter zake van een misdrijf dat voortvloeit uit of verband houdt met
      het witwassen van geld;

      b. het deposito onderwerp is van beperkende maatregelen die zijn opgelegd door nationale regeringen of
      internationale organen;

      c. het onzeker is of een persoon gerechtigd is een terugbetaling te ontvangen, of het deposito onderwerp is van
      een rechtsgeschil.

      2 De opschorting bedoeld in het eerste lid, onderdeel a, eindigt zodra de vervolging is beëindigd of de beslissing
      van de strafrechter onherroepelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel10a18
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel10a19
