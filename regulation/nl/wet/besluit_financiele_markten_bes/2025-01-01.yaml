        bwb_id: BWBR0031636
        artikel: 4:30
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:33
    text: |-
      De voorziening voor niet-verdiende premies en lopende risico’s, bedoeld in [artikel 4:30, onderdeel a][ref1], omvat
      onder meer:

      a. de in het boekjaar ontvangen premies ter zake van risico’s die op het daarop volgende boekjaar of boekjaren
      betrekking hebben;

      b. de schaden en kosten uit lopende overeenkomsten van verzekering die na afloop van het boekjaar kunnen ontstaan
      en die niet gedekt kunnen worden door de voorziening die betrekking heeft op de niet-verdiende premies tezamen met
      de in het daarop volgende boekjaar of boekjaren nog te ontvangen premies.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel430
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel433
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: 4:30
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4:34
    text: |-
      1 De voorziening voor levensverzekering, bedoeld in [artikel 4:30, onderdeel b][ref1], wordt berekend op basis van
      een voldoende voorzichtige prospectieve actuariële methode, rekening houdend met de in de toekomst te ontvangen
      premies en met alle toekomstige verplichtingen volgens de voor iedere lopende overeenkomst van verzekering gestelde
      voorwaarden, met inbegrip van:

      a. alle gegarandeerde uitkeringen en gegarandeerde afkoopwaarden;

      b. de winstdelingen waarop de verzekeringnemer, verzekerde of gerechtigde op uitkering collectief dan wel
      individueel recht heeft;

      c. alle keuzemogelijkheden waarover de verzekeringnemer, verzekerde of gerechtigde op uitkering volgens de
      voorwaarden van de overeenkomst beschikt;

      d. de bedrijfskosten, met inbegrip van provisies.

      2 In afwijking van het eerste lid kan een retrospectieve methode worden toegepast indien de op grond van die
      methode berekende voorzieningen niet lager zijn dan de voorzieningen bij toepassing van een prospectieve methode,
      of indien het gebruik van een prospectieve methode vanwege de aard van het betrokken type overeenkomst niet
      mogelijk is.

      3 De voorziening voor levensverzekering vermeldt afzonderlijk de technische voorzieningen voor verzekeringen
      waarbij de tot uitkering gerechtigde het beleggingsrisico draagt.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel430
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel434
    references:
