  - number: 7:17
    text: |-
      1 Ter voorkoming van overkreditering houdt een kredietaanbieder bij het bepalen van het ten hoogste aan een
      consument te verstrekken kredietbedrag rekening met diens huidige vaste en bestendige netto-inkomsten enerzijds
      en diens vaste uitgaven en, in voorkomend geval, aan andere kredietovereenkomsten verbonden financieringslasten
      anderzijds.

      2 Een kredietaanbieder verstrekt aan een consument geen krediet, voor zover de aan dat krediet verbonden
      maandelijkse financieringlasten de maandelijkse financieringsruimte van de consument overschrijden.

      3 De maandelijkse financieringsruimte, bedoeld in het tweede lid, bedraagt:

      a. indien de netto-inkomsten van de consument niet meer bedragen dan diens leefbedrag: 6% van het op hem van
      toepassing zijnde normbedrag;

      b. indien de netto-inkomsten van de consument meer bedragen dan diens leefbedrag: de som van 6% van het op hem van
      toepassing zijnde normbedrag en een bedrag dat gelijk is aan [(netto-inkomsten – leefbedrag)2 / netto-inkomsten].

      4 Indien de consument reeds andere kredietovereenkomsten is aangegaan, worden de op maandbasis aan die andere
      overeenkomsten verbonden financieringslasten in mindering gebracht op zijn ingevolge het derde lid berekende
      financieringsruimte.

      5 Het leefbedrag, bedoeld in het derde lid, wordt bepaald door het op de consument van toepassing zijnde normbedrag
      te verminderen met het bijbehorende bedrag aan forfaitaire woonlasten en te vermeerderen met de werkelijke
      woonlasten van de consument.

      6 Het normbedrag, bedoeld in het derde lid, wordt vastgesteld bij regeling van Onze minister en bestaat uit een
      forfaitair bedrag aan woonlasten en een forfaitair bedrag aan overige vaste lasten. Dit normbedrag kan verschillend
      worden vastgesteld voor de verschillende huishoudensamenstellingen, alsmede voor de verschillende openbare
      lichamen, en kan periodiek worden herzien.

      7 Een aanbieder kan in plaats van het leefbedrag de werkelijke vaste uitgaven van de consument en, indien van
      toepassing, van andere personen met wie de consument een duurzame gezamenlijke huishouding voert, gebruiken bij de
      berekening in het derde lid, voor zover de aanbieder voldoet aan [artikel 7:19, tweede lid][ref1].

      8 De aanbieder verstrekt geen consumptief krediet met een looptijd van meer dan vijf jaren, tenzij de economische
      levensduur van het met het krediet aan te schaffen goed langer is dan vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel719
