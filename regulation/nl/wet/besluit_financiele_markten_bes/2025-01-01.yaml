  - number: 2:17
    text: |-
      1 Het is een kredietinstelling met zetel in het buitenland slechts toegestaan door middel van een bijkantoor in de
      openbare lichamen het bedrijf van kredietinstelling uit te oefenen, indien:

      a. de som van de bij het bijkantoor aangehouden betaalrekeningen, spaartegoeden en deposito’s per ultimo van het
      laatst afgesloten boekjaar niet meer bedraagt dan een bij regeling van Onze Minister vast te stellen bedrag; en

      b. de kredietinstelling zich vanuit het bijkantoor uitsluitend of hoofdzakelijk richt op ingezetenen van de
      openbare lichamen, Curaçao of Sint Maarten dan wel aldaar gevestigde bedrijven.

      2 Het is een verzekeraar met zetel in het buitenland slechts toegestaan door middel van een bijkantoor in de
      openbare lichamen het verzekeringsbedrijf uit te oefenen, indien:

      a. de door het bijkantoor ontvangen bruto premies over het laatst afgesloten boekjaar niet meer bedragen dan een
      bij regeling van Onze Minister vast te stellen bedrag; en

      b. de verzekeraar zich vanuit het bijkantoor uitsluitend of hoofdzakelijk richt op ingezetenen van de openbare
      lichamen, Curaçao of Sint Maarten dan wel aldaar gevestigde bedrijven.

      3 Een kredietinstelling als bedoeld in het eerste lid of een verzekeraar als bedoeld in het tweede lid die niet
      meer voldoet aan de in het eerste onderscheidenlijk tweede lid gestelde voorwaarden, meldt dit terstond aan de
      Nederlandsche Bank. De Nederlandsche Bank stelt de kredietinstelling of verzekeraar in de gelegenheid binnen een
      door haar vast te stellen redelijke termijn alsnog aan de voorwaarden te voldoen dan wel haar onderscheidenlijk
      zijn activiteiten onder te brengen in een in de openbare lichamen gevestigde of te vestigen rechtspersoon of deze
      af te wikkelen.

      4 De Nederlandsche Bank kan nadere regels stellen met betrekking tot het eerste lid tot en met het derde lid.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel217
  - number: 3:1
    text: |-
      1 De toezichtautoriteit beoordeelt de betrouwbaarheid van een persoon als bedoeld in
      [artikel 3:4, eerste lid, van de wet][ref1] op basis van diens voornemens, handelingen en antecedenten.

      2 De toezichtautoriteit neemt bij de beoordeling, bedoeld in het eerste lid, in ieder geval de in [bijlage 1][ref2]
      genoemde antecedenten in aanmerking, alsmede:

      a. het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging of gedragingen en de
      overige omstandigheden van het geval;

      b. de belangen die de wet beoogt te beschermen;

      c. de overige belangen van de financiële onderneming en de betrokkene.

      3 Telkens na verloop van drie jaren vindt een nieuwe beoordeling plaats van de betrouwbaarheid van de in het eerste
      lid bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0031636
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel31
    references:
