articles:
  - number: 1:1
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt, tenzij anders bepaald, verstaan onder:

        - *bewaarder:* een aan een beleggingsinstelling verbonden bewaarder als bedoeld in
      [artikel 4:4, eerste lid, van de wet][ref1];
        - *kredietvereniging:* een kredietinstelling met de rechtsvorm van een coöperatie die ten doel heeft zijn leden
      behulpzaam te zijn bij het sparen en verlenen van kredieten;
        - *wet:* [Wet financiële markten BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel11
