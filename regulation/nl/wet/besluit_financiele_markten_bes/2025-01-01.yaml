  - number: 4:9
    text: |-
      1 Het bedrag van een naar risico gewogen actief of post als bedoeld in [artikel 4:8, onderdeel a][ref1], is gelijk
      aan zijn vorderingswaarde, vermenigvuldigd met het ingevolge het tweede lid, onderdeel a, aan het actief of de post
      buiten de balanstelling toegekende risicogewicht.

      2 De Nederlandsche Bank stelt regels met betrekking tot:

      a. de indeling van de activa en posten buiten de balansteling in categorieën naar gelang de wederpartij en de aan
      die categorieën toe te kennen risicogewichten met inachtneming van [artikel 4:10][ref2];

      b. de berekening van de vorderingswaarde van een actief of post buiten de balansteling.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel410
