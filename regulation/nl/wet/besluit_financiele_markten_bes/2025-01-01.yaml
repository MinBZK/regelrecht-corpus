  - number: 2:6
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 2:2, onderdelen f en onderdeel g, onder 2°][ref1], van een
      schadeverzekeraar met zetel in een openbaar lichaam bevat:

      a. de gegevens en bescheiden, bedoeld in [artikel 2:5, onderdelen b, c, e tot en met h, j en k][ref2];

      b. een opgave van de aard van de risico’s die de verzekeraar voornemens is te dekken;

      c. een raming voor de eerste drie boekjaren van de andere dan de in [artikel 2:5, onderdeel g][ref3], bedoelde
      kosten van beheer, met name van de algemene kosten en provisies;

      d. een raming voor de eerste drie boekjaren van de premies en van de schaden met betrekking tot de directe
      verzekeringen, de geaccepteerde herverzekeringen en de uitgaande herverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel22
