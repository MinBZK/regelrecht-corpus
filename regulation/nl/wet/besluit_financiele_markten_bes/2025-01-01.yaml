    text: |-
      1 Een gevolmachtigde of ondergevolmachtigde agent die voor rekening van een verzekeraar een verzekering heeft
      gesloten, vermeldt in de polis dan wel in een daaraan toegevoegd aanhangsel de naam van de verzekeraar en, in geval
      van co-assurantie, het aandeel dat hij namens de verzekeraar heeft geaccepteerd. In geval van een schadeverzekering
      vermeldt hij tevens elke wijziging in het door hem namens de verzekeraar geaccepteerde aandeel in een aanhangsel.

      2 Wordt, nadat de gevolmachtigde of ondergevolmachtigde agent de verzekering heeft gesloten of, in geval van
      een schadeverzekering, het door de gevolmachtigde of ondergevolmachtigde agent geaccepteerde aandeel in de
      verzekering is gewijzigd, niet of niet onverwijld aan de cliënt een polis of aanhangsel gegeven, dan verstrekt de
      gevolmachtigde of ondergevolmachtigde agent de in het eerste lid bedoelde gegevens aan de cliënt binnen vier weken
      na het sluiten van de verzekering of na het aanbrengen van de wijziging. Behoort de verzekering tot de portefeuille
      van een bemiddelaar, dan verstrekt de gevolmachtigde of ondergevolmachtigde agent deze gegevens binnen twee weken
      aan deze bemiddelaar.

      3 Wordt, nadat een verzekering is gesloten of, in geval van een schadeverzekering, het door de verzekeraar
      geaccepteerde aandeel in de overeenkomst is gewijzigd, niet of niet onverwijld aan de cliënt een polis of
      aanhangsel afgegeven waarin de naam van de verzekeraar en, in geval van co-assurantie, diens aandeel of daarin
      aangebrachte wijziging is vermeld, dan verstrekt de bemiddelaar tot wiens portefeuille de verzekering behoort, deze
      gegevens binnen vier weken na het sluiten van de overeenkomst of na het aanbrengen van de wijziging aan de cliënt.

      4 Het tweede en derde lid zijn niet van toepassing, indien binnen de desbetreffende termijn de verzekering is
      tenietgegaan en daaraan door de cliënt of andere belanghebbenden geen rechten meer kunnen worden ontleend.

      5 De gevolmachtigde agent onderscheidenlijk ondergevolmachtigde agent of de betrokken bemiddelaar stelt de cliënt
      desgevraagd onverwijld in kennis van de naam van de verzekeraar en, in geval van co-assurantie, van de aandelen die
      de verzekeraars hebben geaccepteerd of van wijzigingen die daarin zijn aangebracht.
