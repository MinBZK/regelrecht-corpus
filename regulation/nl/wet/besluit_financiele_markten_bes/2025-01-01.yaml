      1 Het minimumbedrag aan eigen vermogen bedraagt voor een elektronischgeldinstelling USD 50.000.

      2 Het minimumbedrag aan eigen vermogen van een elektronischgeldinstelling wordt gevormd door de waarde van de
      vermogensbestanddelen, bedoeld in [artikel 4:5, tweede lid][ref1]. Deze vermogensbestanddelen alsmede de waarden
      die tegenover die vermogensbestanddelen staan, staan onmiddellijk en zonder beperkingen ter beschikking van de
      kredietinstelling. Per afzonderlijke post wordt rekening gehouden met het voorzienbare bedrag van de daarover
      verschuldigde belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel45
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel423
