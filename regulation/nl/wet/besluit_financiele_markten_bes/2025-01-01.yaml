      1 Het toetsingsvermogen van een kredietinstelling, niet zijnde een kredietvereniging, wordt gevormd door de som van
      het in aanmerking te nemen kernkapitaal en aanvullend kapitaal, met inachtneming van [artikel 4:7][ref1].

      2 Het toetsingsvermogen van een kredietvereniging wordt gevormd door de som van de ingehouden winsten, overige
      reserves en algemene voorzieningen.

      3 De Nederlandsche Bank kan nadere regels stellen met betrekking tot het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel47
