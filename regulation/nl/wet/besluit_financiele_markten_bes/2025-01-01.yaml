  - number: 6:4
    text: |-
      1 Tegelijkertijd met het prospectus, bedoeld in [artikel 6:3][ref1], stelt een beleggingsinstelling de informatie,
      bedoeld in [artikel 7:5][ref2], alsmede de volgende informatie algemeen verkrijgbaar:

      a. de mededeling dat de waarde van de rechten van deelneming zowel kan stijgen als dalen en dat de deelnemers
      mogelijk minder terugkrijgen dan zij hebben ingelegd;

      b. indien de beleggingsinstelling belegt met namens of voor rekening en risico van de deelnemers geleend geld:

      1°. de risico’s die hieraan verbonden zijn;

      2°. vermelding van een eventuele verplichting voor de deelnemers in de beleggingsinstelling om mogelijke tekorten
      van de beleggingsinstelling aan te zuiveren wanneer de verliezen de inleg overstijgen; en

      3°. vermelding van de maximale omvang van de beleggingen die met geleend geld kunnen worden aangekocht in absolute
      waarde of als percentage van het beheerde vermogen.

      c. indien de bestaansduur van de beleggingsinstelling dat mogelijk maakt: het in het verleden behaalde rendement
      van de beleggingsinstelling;

      d. een beschrijving van de wijze waarop en de voorwaarden waaronder de opheffing en vereffening van de
      beleggingsinstelling plaatsvindt, in het bijzonder ten aanzien van de rechten van de deelnemers in de
      beleggingsinstelling.

      2 Voorts stelt de beleggingsinstelling de voorwaarden van de beleggingsinstelling algemeen verkrijgbaar voorafgaand
      aan het aanbieden van rechten van deelneming. Deze voorwaarden bevatten ten minste de gegevens genoemd in
      [bijlage 2][ref3].


