  - number: 1:10a
    text: |-
      De wet is met betrekking tot het aanbieden van eurobetaal- of eurospaarrekeningen en daaraan verbonden
      betaal- of spaarfaciliteiten niet van toepassing op kredietinstellingen, elektronischgeldinstellingen
      of geldtransactiekantoren met zetel in het Europese deel van Nederland die op grond van
      [artikel 2:3a, eerste of tweede lid, van de Wet op het financieel toezicht][ref1] in het Europese deel van
      Nederland zijn toegelaten tot de uitoefening van het bedrijf van betaaldienstverlener.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel23a
