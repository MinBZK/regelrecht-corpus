  - number: 6:6
    text: |-
      Het is een schadeverzekeraar met zetel in de openbare lichamen toegestaan in de uitoefening van zijn bedrijf,
      naast de risico’s die behoren tot de branche waarvoor de vergunning is verleend, tevens risico’s te verzekeren
      die behoren tot andere branches, indien deze risico’s naar het oordeel van de Nederlandsche Bank als bijkomende
      risico’s kunnen worden beschouwd, omdat zij:

      a. samenhangen met het hoofdrisico dat behoort tot de branche waarvoor de vergunning is verleend;

      b. betrekking hebben op het belang of gevaarsobject dat is verzekerd tegen het hoofdrisico; en

      c. worden verzekerd bij dezelfde overeenkomst als het hoofdrisico.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel66
  - number: 6:7
    text: |-
      1 Een rechtsbijstandverzekeraar vertrouwt de werkzaamheden met betrekking tot de rechtsbijstandschaderegeling
      toe aan een juridisch zelfstandig schaderegelingkantoor en vermeldt dit kantoor in de overeenkomst inzake de
      rechtsbijstanddekking, of neemt in die overeenkomst op dat de verzekerde, zodra hij uit hoofde van de verzekering
      recht heeft op rechtsbijstand, de behartiging van zijn belangen mag toevertrouwen aan een advocaat of een andere
      rechtens bevoegde deskundige van zijn keuze.

      2 Onder rechtsbijstandverzekeraar wordt verstaan: een schadeverzekeraar die verzekeringen aanbiedt tot dekking
      van verleende diensten en gemaakte kosten in het bijzonder met het oog op verhaal van door een verzekerde geleden
      schade en diens verdediging of vertegenwoordiging, in of buiten rechte.

      3 De Autoriteit Financiële Markten kan, onder door haar te stellen voorwaarden, toestaan dat een
      rechtsbijstandverzekeraar, in afwijking van het eerste lid, de werkzaamheden met betrekking tot de
      rechtsbijstandschaderegeling toevertrouwt aan eigen personeelsleden, mits zijn bedrijfsvoering zo is ingericht dat
      belangenconflicten worden voorkomen.

      4 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de inhoud van de
      overeenkomst inzake rechtsbijstanddekking.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel67
  - number: 6:8
    text: |-
      1 Een verzekeraar met zetel in het buitenland die door middel van het verrichten van diensten vanuit
      een vestiging in het buitenland in de openbare lichamen verzekeringen aanbiedt tot dekking van
      wettelijke aansprakelijkheid, voortvloeiend uit het gebruik van motorrijtuigen, stelt een schade-
      afhandelaar aan die belast is met het namens hem afwikkelen van vorderingen van benadeelden als bedoeld in
      [artikel 1 van de Wet aansprakelijkheidsverzekering motorrijtuigen BES][ref1].

      2 De schade-afhandelaar verricht zijn werkzaamheden vanuit een vestiging in de openbare lichamen en beschikt over
      voldoende bevoegdheden om de schadeverzekeraar zowel in als buiten rechte te vertegenwoordigen.

      3 Een verzekeraar als bedoeld in het eerste lid meldt een wijziging in de akte van aanstelling van de in dat lid
      bedoelde schade-afhandelaar binnen twee weken schriftelijk aan de Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0028254#Artikel1
