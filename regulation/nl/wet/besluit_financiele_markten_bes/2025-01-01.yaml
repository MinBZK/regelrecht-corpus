    text: |-
      1 Het minimumbedrag aan eigen vermogen, bedoeld in [artikel 3:16, eerste lid, van de wet][ref1], bedraagt voor een
      beleggingsmaatschappij USD 279.000.

      2 Het minimumbedrag aan eigen vermogen van een beleggingsmaatschappij wordt gevormd door de waarde van de
      vermogensbestanddelen, bedoeld in [artikel 4:5, tweede lid][ref2]. Deze vermogensbestanddelen, alsmede de waarden
      die tegenover die vermogensbestanddelen staan, staan onmiddellijk en zonder beperkingen ter beschikking van de
      beleggingsmaatschappij. Artikel 4:5, vierde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel316
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel45
