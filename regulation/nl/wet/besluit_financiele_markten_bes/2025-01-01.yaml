  - number: 10a:1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *basisbijdrage:* door een kredietinstelling op grond van [artikel 10A:7][ref1] verschuldigde bijdrage aan het
      depositogarantiefonds;
        - *buitengewone bijdrage:* door een kredietinstelling op grond van [artikel 10A:11][ref2] verschuldigde
      buitengewone bijdrage aan het depositogarantiefonds;
        - *deposito:* tegoed dat wordt gevormd door op een rekening staande gelden of dat tijdelijk uit normale
      banktransacties voortvloeit, en dat een kredietinstelling onder de toepasselijke wettelijke en contractuele
      voorwaarden dient terug te betalen, met inbegrip van een termijndeposito en een spaardeposito, met uitzondering
      van een tegoed waarvan: a. het bestaan alleen kan worden aangetoond met behulp van een ander financieel product als
      bedoeld in [artikel 1, onderdeel c tot en met h, van de wet][ref3], tenzij het een betaal- of spaarrekening betreft
      die wordt belichaamd in een certificaat van deposito dat op naam luidt; b. de hoofdsom niet a pari terugbetaalbaar
      is; c. de hoofdsom alleen a pari terugbetaalbaar is uit hoofde van een door de kredietinstelling of door een derde
      verstrekte garantie of overeenkomst;
        - *depositobasis:* totaal van de bij een kredietinstelling aangehouden gegarandeerde deposito’s;
        - *depositogarantiefonds:* door de Stichting aangehouden financiële middelen, uitsluitend voor zover deze
      betrekking hebben op het depositogarantiestelsel;
        - *depositogarantiestelsel:* depositogarantiestelsel, bedoeld in [artikel 4:17 van de wet][ref4];
        - *gegarandeerd deposito:* deposito voor zover dat gegarandeerd wordt uit hoofde van het depositogarantiestelsel;
        - *Stichting:* Stichting Depositogarantiefonds Caribisch Nederland, gevestigd te Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel10a7
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel10a11
      [ref3]: https://wetten.overheid.nl/BWBR0030883#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0030883#Artikel417
