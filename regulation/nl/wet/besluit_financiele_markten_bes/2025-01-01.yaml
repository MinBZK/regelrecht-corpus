  - number: 2:1
    text: |-
      1 De aanvraag van een vergunning op grond van de [wet][ref1] wordt gedaan met gebruikmaking van het daartoe door de
      toezichtautoriteit vast te stellen formulier dat op verzoek aan de aanvrager ter beschikking wordt gesteld.

      2 Het aanvraagformulier en de daarbij ingevolge deze paragraaf te verstrekken gegevens en bescheiden worden in
      enkelvoud ingediend, waarbij bedoelde gegevens en bescheiden in zodanige vorm worden verstrekt dat een goede
      beoordeling door de toezichtautoriteit mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 2:2
    text: |-
      Een financiële onderneming verstrekt, voor zover van toepassing, aan de toezichtautoriteit bij de aanvraag van een
      vergunning de navolgende gegevens en bescheiden met betrekking tot de financiële onderneming:

      a. naam, adres en telefoon- en faxnummer;

      b. rechtsvorm;

      c. statutaire zetel, statutaire naam en handelsnaam of handelsnamen;

      d. uittreksel uit het handelsregister;

      e. gewaarmerkt afschrift van de statuten;

      f. programma van werkzaamheden die de financiële onderneming voornemens is te verrichten in of vanuit de openbare
      lichamen;

      g. indien de financiële onderneming haar zetel in de openbare lichamen heeft:

      1°. naam, adres en telefoon- en faxnummer van eventuele bijkantoren in het buitenland;

      2°. programma van werkzaamheden die de financiële onderneming voornemens is te verrichten vanuit eventuele
      bijkantoren in het buitenland;

      h. indien de financiële onderneming haar zetel in het buitenland heeft:

      1°. een verklaring van de toezichthoudende instantie van de staat van zetel waaruit blijkt dat de financiële
      onderneming in haar staat van zetel bevoegd is tot de uitoefening van de vergunningplichtige activiteiten, bedoeld
      in [artikel 3:2 van de wet][ref1];

      2°. naam, adres en telefoon- en faxnummer van eventuele bijkantoren in de openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel32
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0030883
        artikel: 3:2
  - number: 2:3
    text: |-
      1 Een financiële onderneming met zetel in de openbare lichamen verstrekt bij de aanvraag van een vergunning
      gegevens en bescheiden op basis waarvan de toezichtautoriteit kan beoordelen of zal worden voldaan aan, voor zover
      op de betrokken financiële onderneming van toepassing, de bij of krachtens de [artikelen 3:4 tot en met 3:6][ref1],
      [3:8 tot en met 3:13][ref2], [3:16 tot en met 3:19][ref3], [3:22 tot en met 3:24][ref4], [3:33][ref5], [3:45][ref6]
      en [3:46 van de wet][ref7] gestelde regels, alsmede:

      a. voor beleggingsinstellingen: de bij of krachtens de [artikelen 4:1 tot en met 4:5][ref8] en
      [4:10 van de wet][ref9] gestelde regels;

      b. voor houders van een effectenbeurs: de bij of krachtens de [artikelen 4:15][ref10] en [4:16 van de wet][ref11]
      gestelde regels;

      c. voor kredietinstellingen: de bij of krachtens de [artikelen 4:18][ref12] en [4:21 van de wet][ref13] gestelde
      regels;

      d. voor verzekeraars: de bij of krachtens de [artikelen 4:25][ref14] en [4:28 tot en met 4:34 van de wet][ref15]
      gestelde regels.

      2 Een bemiddelaar met zetel in de openbare lichamen verstrekt aan de toezichtautoriteit voorts gegevens en
      bescheiden met betrekking tot eventuele zakelijke relaties met verzekeraars waaruit blijkt of hij afhankelijk dan
      wel onafhankelijk is.

      3 Een gevolmachtigde agent of ondergevolmachtigde agent met zetel in de openbare lichamen verstrekt aan de
      toezichtautoriteit voorts de naam van de verzekeraar voor wie de volmacht geldt.


