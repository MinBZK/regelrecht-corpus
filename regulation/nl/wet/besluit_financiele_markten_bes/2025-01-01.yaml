  - number: 7:8
    text: |-
      1 Voorafgaande aan de totstandkoming van een overeenkomst inzake een natura-uitvaartverzekeringverstrekt een
      natura-uitvaartverzekeraar een cliënt, onverminderd [artikel 7:5][ref1], de volgende informatie:

      a. een omschrijving van de prestatie waartoe de natura-uitvaartverzekeraar zich verplicht;

      b. een omschrijving van de keuzemogelijkheden die de cliënt of de verzekerde ingevolge de overeenkomst heeft;

      c. een opgave of de premie eenmalig is verschuldigd dan wel periodiek;

      d. de periode gedurende welke premie verschuldigd is;

      e. een opgave van de indexering die wordt toegepast op de verzekerde prestatie of op de premie;

      f. de overige mogelijkheden die de aanbieder heeft om de verzekerde prestatie of de premie aan te passen;

      g. een opgave of indicatie van de afkoop- of premievrije waarde of een opgave van de wijze waarop deze waarden
      worden berekend;

      h. de wijze waarop de cliënt gebruik kan maken van zijn recht, bedoeld in [artikel 5:18 van de wet][ref2], om de
      overeenkomst te ontbinden;

      i. een opgave van de uitvaartonderneming die de uitvaart zal verzorgen, dan wel van de wijze waarop wordt bepaald
      welke uitvaartonderneming de uitvaart zal verzorgen.

      2 Indien de termijn van beëindiging, bedoeld in [artikel 7:5, eerste lid, onderdeel g][ref3], langer is dan een
      jaar, maakt de natura-uitvaartverzekeraar dit op een opvallende wijze uitdrukkelijk kenbaar aan de cliënt, bij
      gebreke waarvan een opzegtermijn van een jaar geldt ongeacht het in de overeenkomst bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel75
