    text: |-
      1 Alle belangrijke nieuwe feiten die zich voordoen of worden geconstateerd tussen het tijdstip van goedkeuring van
      een prospectus als bedoeld in [artikel 5:19, eerste lid, van de wet][ref1] en het tijdstip waarop de aanbieding
      van de effecten eindigt of de handel in de effecten aanvangt, en die van belang kunnen zijn voor de beoordeling
      van het vermogen, de financiële positie, het resultaat en de vooruitzichten van de uitgevende instelling en van de
      rechten en verplichtingen die aan de effecten zijn verbonden, alsmede materiële onvolledigheden, onnauwkeurigheden
      of onjuistheden in het prospectus, worden vermeld of gecorrigeerd in een document dat ter aanvulling van het
      prospectus algemeen verkrijgbaar wordt gesteld.

      2 Het in het eerste lid bedoelde document behoeft de goedkeuring van de Autoriteit Financiële Markten en wordt
      algemeen verkrijgbaar gesteld. [Artikel 8:2][ref2] is van overeenkomstige toepassing.


