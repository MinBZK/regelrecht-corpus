        bwb_id: BWBR0031636
        artikel: 10a:18
        hoofdstuk: 10a
        paragraaf: '3'
  - number: 10a:20
    text: |-
      1 Indien een overdracht door de Nederlandsche Bank met toepassing van een machtiging als bedoeld in
      [artikel 8:10, eerste lid, van de wet][ref1], van de verbintenissen van een kredietinstelling welke zij in de
      uitoefening van haar bedrijf als kredietinstelling tot het ter beschikking verkrijgen van gelden heeft aangegaan
      of van een deel daarvan, ertoe strekt dat depositohouders toegang houden tot hun deposito’s, kan ten laste van de
      Stichting een bedrag beschikbaar worden gesteld ten behoeve van die overdracht.

      2 Het beschikbaar te stellen bedrag bedraagt het bedrag van het deposito of ten hoogste het bedrag van de ingevolge
      het depositogarantiestelsel gegarandeerde deposito’s die worden aangehouden bij de kredietinstelling.

      3 Indien toepassing wordt gegeven aan het eerste lid, verkrijgt de Stichting een vordering op de kredietinstelling
      in kwestie ter grootte van het beschikbaar gestelde bedrag.

      4 Ingeval deposito’s met toepassing van een machtiging als bedoeld in [artikel 8:10, eerste lid, van de wet][ref2]
      worden overgedragen, hebben de depositohouders geen aanspraak op het depositogarantiestelsel met betrekking tot
      enigerlei deel van hun deposito’s bij de kredietinstelling in kwestie die niet zijn overgedragen, mits het bedrag
      van de overgedragen middelen gelijk is aan of groter is dan het totale dekkingsniveau waarin is voorzien in
      [artikel 10A:2, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel810
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel810
      [ref3]: https://wetten.overheid.nl/BWBR0031636#Artikel10a2
