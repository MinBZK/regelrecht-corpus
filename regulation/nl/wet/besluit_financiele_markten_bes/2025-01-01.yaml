    text: |-
      1 Overtreding van een in [bijlage 3][ref1] bij dit besluit genoemd voorschrift is beboetbaar met een bestuurlijke
      boete van de volgens die bijlage op overtreding van dat voorschrift van toepassing zijnde categorie.

      2 Het geen gevolg geven dan wel niet tijdig of onvolledig gevolg geven aan een krachtens
      [artikel 7:12, eerste lid, van de wet][ref2] gegeven aanwijzing is, indien de aanwijzing gegeven is ter zake
      van het niet voldoen aan een in [bijlage 3][ref3] genoemd voorschrift, beboetbaar met een bestuurlijke boete van
      dezelfde categorie als waarmee dat voorschrift beboetbaar is.

      3 Indien een aanwijzing als bedoeld in het tweede lid is gegeven ter zake van een voorschrift, niet zijnde een in
      [bijlage 3][ref4] genoemd voorschrift, is het geen gevolg dan wel niet tijdig of onvolledig gevolg geven aan die
      aanwijzing beboetbaar met een bestuurlijke boete van de eerste categorie.

      4 Het geen gevolg geven dan wel niet tijdig of onvolledig gevolg geven aan een krachtens
      [artikel 7:12, tweede lid][ref5], of [7:13 van de wet][ref6] gegeven aanwijzing is beboetbaar met een bestuurlijke
      boete van de tweede categorie.


