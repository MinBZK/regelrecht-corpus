  - number: 10a:9
    text: |-
      1 De Nederlandsche Bank doet de Stichting jaarlijks voor 15 mei schriftelijk mededeling van de hoogte van de door
      individuele kredietinstellingen voor dat jaar verschuldigde bijdragen ten behoeve van de financiële middelen die in
      het depositogarantiefonds worden aangehouden in het kader van het depositogarantiestelsel.

      2 De Stichting deelt de Nederlandsche Bank jaarlijks voor 1 augustus schriftelijk mede, welke bijdragen zij in dat
      jaar van individuele kredietinstellingen heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel10a9
  - number: 10a:10
    text: |-
      De Stichting stelt de Nederlandsche Bank ervan in kennis, indien de in het depositogarantiefonds aanwezige
      middelen aangehouden ten behoeve van het depositogarantiestelsel, niet toereikend zijn om de op grond van het
      depositogarantiestelsel aan depositohouders uit te keren bedragen beschikbaar te stellen of een bedrag beschikbaar
      te stellen ten behoeve van een overdracht als bedoeld in [artikel 10A:20, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel10a20
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel10a10
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: 10a:20
        hoofdstuk: 10a
        paragraaf: '3'
  - number: 10a:11
    text: |-
      1 Indien de Stichting een kennisgeving als bedoeld in [artikel 10A:10][ref1] heeft gedaan, kunnen ter verkrijging
      van de benodigde financiële middelen buitengewone bijdragen worden geheven. De Nederlandsche Bank bepaalt de
      hoogte van de buitengewone bijdragen die jaarlijks worden geheven zolang de in het depositogarantiefonds aanwezige
      middelen niet toereikend zijn.

      2 De buitengewone bijdrage is gebaseerd op de depositobasis en wordt jaarlijks geheven bij alle kredietinstellingen
      waarop het depositogarantiestelsel van toepassing is.

      3 De Nederlandsche Bank stelt de hoogte van de door een kredietinstelling op grond van het tweede lid verschuldigde
      buitengewone bijdrage vast overeenkomstig [bijlage 2b][ref2] bij dit besluit.

      4 Het in enig kalenderjaar door een kredietinstelling op grond van het tweede lid te betalen bedrag, is
      niet groter dan 0,5% van de gegarandeerde deposito’s van die kredietinstelling. Indien de solvabiliteits- of
      liquiditeitspositie van een kredietinstelling daartoe aanleiding geeft, kan de Nederlandsche Bank een lager
      percentage vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel10a10
      [ref2]: https://wetten.overheid.nl/BWBR0031636
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel10a11
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: 10a:10
        hoofdstuk: 10a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031636
  - number: 10a:12
    text: |-
      1 Indien van een kredietinstelling een buitengewone bijdrage zal worden geheven, kan de Nederlandsche Bank bepalen
      dat de kredietinstelling hierop een voorschot voldoet.

      2 Het betaalde voorschot wordt verrekend met de verschuldigde buitengewone bijdragen.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel10a12
  - number: 10a:13
    text: |-
      1 De Stichting kan ten behoeve van het depositogarantiestelsel, voor het geval dat de buitengewone bijdragen niet
      onmiddellijk beschikbaar of ontoereikend zijn, overeenkomsten aangaan tot het verkrijgen van financiering van
      derden. De overeenkomsten behoeven de voorafgaande instemming van Onze Minister.

      2 Het bestuur van de Stichting stelt een financieringsplan vast voor het verkrijgen van kortetermijnfinanciering
      voor het geval dat de buitengewone bijdragen niet onmiddellijk beschikbaar of toereikend zijn.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel10a13
  - number: 10a:14
    text: |-
      1 De Nederlandsche Bank besluit onverwijld tot inwerkingstelling van het depositogarantiestelsel ten aanzien
      van een kredietinstelling waaraan op grond van de wet vergunning is verleend tot uitoefening van het bedrijf van
      kredietinstelling, met uitzondering van kredietverenigingen, indien:

      a. de kredietinstelling, om redenen die rechtstreeks verband houden met haar financiële positie, niet in staat is
      deposito's van depositohouders terug te betalen en zij daartoe ook op afzienbare termijn niet in staat kan worden
      geacht;

      b. een rechterlijke beslissing die rechtstreeks verband houdt met de financiële positie van de betrokken
      kredietinstelling, leidt tot onmogelijkheid voor depositohouders om hun vorderingen op de kredietinstelling te
      verhalen.

      2 De Nederlandsche Bank geeft toepassing aan het eerste lid, aanhef en onder a, uiterlijk 21 dagen nadat zij voor
      het eerst heeft geconstateerd dat een kredietinstelling heeft nagelaten verschuldigde en betaalbare deposito’s
      onder de toepasselijke wettelijke en contractuele voorwaarden terug te betalen.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel10a14
  - number: 10a:15
    text: |-
      1 De Nederlandsche Bank doet van een besluit tot inwerkingstelling van het depositogarantiestelsel zo spoedig
      mogelijk mededeling in de Staatscourant, alsmede in andere media in de openbare lichamen.

      2 De Nederlandsche Bank verzoekt de bewindvoerders of curatoren van de betalingsonmachtige kredietinstelling om in
      hun correspondentie met depositohouders te wijzen op de inwerkingstelling van het depositogarantiestelsel en op de
      in [artikel 10A:16][ref1] bedoelde termijn voor indiening van een aanvraag tot vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel10a16
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel10a15
    references:
      - id: ref1
        bwb_id: BWBR0031636
        artikel: 10a:16
        hoofdstuk: 10a
        paragraaf: '3'
  - number: 10a:16
    text: |-
      1 Depositohouders kunnen uiterlijk een jaar na de datum van inwerkingstelling van het depositogarantiestelsel met
      gebruikmaking van een daartoe door de Nederlandsche Bank verkrijgbaar te stellen formulier een aanvraag indienen
      tot toekenning van een vergoeding van gegarandeerde deposito’s.

      2 Aanvragen, ingediend na het verstrijken van de termijn, genoemd in het eerste lid, worden niet in behandeling
      genomen, tenzij de termijnoverschrijding redelijkerwijs niet aan de aanvrager kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel10a16
  - number: 10a:17
    text: |-
      1 De Nederlandsche Bank stelt aan de hand van de op het deposito toepasselijke wettelijke bepalingen en
      contractuele voorwaarden en de boekhouding van de betalingsonmachtige kredietinstelling vast of een deposito
      ingevolge het depositogarantiestelsel is gegarandeerd.

      2 Indien de Nederlandsche Bank aan de hand van de gegevens, bedoeld in het eerste lid, niet kan vaststellen of
      een deposito ingevolge het depositogarantiestelsel is gegarandeerd, komt een deposito slechts voor vergoeding in
      aanmerking voor zover de depositohouder het bestaan en de hoogte ervan genoegzaam bewijst.

      3 Bij de vaststelling, bedoeld in het eerste lid en tweede lid, ten aanzien van deposito’s in andere valuta dan de
      US dollar, gelden de referentiekoersen van de Centrale Bank van Curaçao en Sint Maarten, zoals deze golden op de
      dag waarop ten aanzien van de betrokken kredietinstelling het depositogarantiestelsel in werking werd gesteld.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel10a17
  - number: 10a:18
    text: |-
      1 Tenzij contractueel is bepaald dat personen als bedoeld in [artikel 10A:2, tweede lid, onderdeel b][ref1], in
      een andere verhouding gerechtigd zijn tot de deposito’s, ontvangen zij ieder een vergoeding ter grootte van een
      evenredig deel van het totaal van de gegarandeerde deposito’s.

      2 De Nederlandsche Bank besluit zo spoedig mogelijk over het beschikbaar stellen van een vergoeding, doch in elk
      geval binnen 20 werkdagen na het tijdstip waarop de aanvraag tot vergoeding is ingediend. De vergoeding wordt
      beschikbaar gesteld in US dollar.

      3 De Nederlandsche Bank kent de vergoedingen toe ten laste van de Stichting.

      4 De Stichting maakt de toegekende vergoedingen onverwijld beschikbaar voor uitkering.

      5 Uitkering vindt plaats op een door de Nederlandsche Bank te bepalen wijze.

      6 Toegekende vergoedingen worden beschikbaar gesteld mits depositohouders geen gebruik hebben gemaakt en verklaren
      af te zien van het gebruik van hun bevoegdheden om hun vorderingen, voor zover deze voor vergoeding uit hoofde van
      het depositogarantiestelsel in aanmerking komen, te verrekenen.

      7 De Nederlandsche Bank kan in gevallen waarin toepassing van de [artikelen 10A:16][ref2], [10A:17][ref3] of 10A:18
      leidt tot een onbillijkheid van overwegende aard, zo spoedig mogelijk na indiening van een aanvraag als bedoeld
      in artikel 10A:16 ten laste van het depositogarantiefonds besluiten tot het toekennen van een voorschot van ten
      hoogste USD 1000 aan een depositohouder die aannemelijk maakt een gegarandeerd deposito van ten minste het als
      voorschot gevraagde bedrag bij de betalingsonmachtige kredietinstelling te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel10a2
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel10a16
      [ref3]: https://wetten.overheid.nl/BWBR0031636#Artikel10a17
