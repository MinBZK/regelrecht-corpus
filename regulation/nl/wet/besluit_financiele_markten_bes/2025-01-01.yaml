  - number: 4:19
    text: |-
      1 De waarde van de balansposten en posten buiten de balanstelling, bedoeld in
      [artikel 3:17, vijfde lid, van de wet][ref1] bedraagt voor een kredietinstelling ten aanzien van een wederpartij of
      groep van verbonden wederpartijen niet meer dan vijfentwintig procent van haar toetsingsvermogen.

      2 De totale waarde van de grote posities van een kredietinstelling bedraagt niet meer dan zeshonderd procent van
      haar toetsingsvermogen.

      3 Het eerste lid is niet van toepassing op actiefposten in de vorm van schatkistpapier van de federale overheid van
      de Verenigde Staten van Amerika met een looptijd van minder dan drie maanden.

      4 De Nederlandsche Bank kan, op verzoek, besluiten dat het een kredietinstelling voor een beperkte duur is
      toegestaan het in het eerste of tweede lid bedoelde percentage te overschrijden. De Nederlandsche Bank stelt regels
      met betrekking tot de voorwaarden waaronder zij een overschrijding toestaat.


