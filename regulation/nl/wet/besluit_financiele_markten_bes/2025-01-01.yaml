  - number: 2:11
    text: |-
      1 Een financiële onderneming met zetel in de openbare lichamen meldt aan de toezichtautoriteit schriftelijk haar
      voornemen om:

      a. een bijkantoor in het buitenland op te richten;

      b. de uitoefening van haar bedrijf vanuit een bijkantoor in het buitenland te staken.

      2 Een financiële onderneming met zetel in het buitenland meldt aan de toezichtautoriteit schriftelijk het voornemen
      om de uitoefening van haar bedrijf vanuit een bijkantoor in de openbare lichamen te staken.

      3 De financiële onderneming geeft geen uitvoering aan het voornemen, bedoeld in het eerste en tweede lid, voordat
      vier weken zijn verstreken na de melding.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel211
  - number: 2:12
    text: |-
      1 De toezichtautoriteit draagt zorg voor een zodanige indeling en inrichting van het register financiële markten,
      bedoeld in [artikel 2:19, eerste lid, van de wet][ref1], dat uit het register is op te maken vanaf welk tijdstip,
      welke activiteiten de ingeschreven financiële ondernemingen mogen verrichten, met inbegrip van de eventueel
      gestelde beperkingen, alsmede de staat van zetel. Het register wordt zo ingericht dat het raadpleegbaar is op een
      website van de toezichtautoriteit.

      2 Het register vermeldt ten aanzien van een ingeschreven financiële onderneming:

      a. in bij regeling van Onze Minister te bepalen gevallen de op de financiële onderneming van toepassing zijnde
      vrijstellingen;

      b. op grond van [artikel 1:27 van de wet][ref2] verleende ontheffingen;

      c. in voorkomend geval, dat zij haar bedrijf afwikkelt overeenkomstig [artikel 2:17 van de wet][ref3];

      d. ingevolge [artikel 7:20 van de wet][ref4] opgelegde verboden.

      3 Het register vermeldt voorts:

      a. de in voorkomend geval aan een ingeschreven beleggingsinstelling verbonden beheerder en bewaarder, welke
      beheerder en bewaarder in het register worden opgenomen bij de betrokken beleggingsinstelling;

      b. de naam van de verzekeraar voor wie de volmacht van een ingeschreven gevolmachtigde agent of ondergevolmachtigde
      agent geldt, welke naam van de verzekeraar in het register wordt opgenomen bij de betrokken gevolmachtigde of
      ondergevolmachtigde agent;

      c. of een ingeschreven bemiddelaar afhankelijk dan wel onafhankelijk is van een of meer verzekeraars.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel219
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel127
      [ref3]: https://wetten.overheid.nl/BWBR0030883#Artikel217
      [ref4]: https://wetten.overheid.nl/BWBR0030883#Artikel720
