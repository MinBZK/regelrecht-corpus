  - number: 10a:5
    text: |-
      1 De financiële middelen van de Stichting worden aangehouden in contant geld, deposito’s en activa met een laag
      risico en kunnen worden geliquideerd binnen de termijn van zeven werkdagen.

      2 Activa met een laag risico zijn activa die door de Nederlandsche Bank veilig en liquide worden geacht.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel10a5
  - number: 10a:6
    text: |-
      1 Een aan het depositogarantiestelsel deelnemende kredietinstelling draagt er zorg voor dat voor de uitvoering van
      het depositogarantiestelsel noodzakelijke gegevens voortdurend worden bijgehouden en vastgelegd.

      2 De kredietinstelling verstrekt de gegevens, bedoeld in het eerste lid, op verzoek van de Nederlandsche Bank
      binnen een door de Nederlandsche Bank te bepalen termijn en op een op de Nederlandsche Bank te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel10a6
  - number: 10a:7
    text: |-
      1 De kredietinstellingen dragen de kosten van de financiering van het depositogarantiestelsel.

      2 Een kredietinstelling waarop het depositogarantiestelsel van toepassing is, is een jaarlijkse bijdrage aan de
      Stichting verschuldigd gebaseerd op de depositobasis.

      3 De doelomvang van de financiële middelen die in het depositogarantiefonds worden aangehouden ten behoeve van het
      depositogarantiestelsel, is 5% van de gegarandeerde deposito’s waarop het depositogarantiestelsel van toepassing
      is gezamenlijk.

      4 De Nederlandsche Bank stelt de hoogte van de jaarlijkse bijdrage vast overeenkomstig [bijlage 2b][ref1] bij dit
      besluit, zodanig dat het depositogarantiefonds de doelomvang bereikt binnen tien jaar na inwerkingtreding van het
      depositogarantiestelsel.

      5 In afwijking van het vierde lid wordt, nadat een uitkering, bedoeld in [artikel 10A:18][ref2], of de
      beschikbaarstelling van een bedrag, bedoeld in [artikel 10A:20][ref3], in het kader van het depositogarantiestelsel
      ten laste van de Stichting heeft plaatsgevonden, de hoogte van de verschuldigde jaarlijkse bijdragen zodanig
      vastgesteld dat het depositogarantiefonds de doelomvang bereikt binnen tien jaar na toepassing van het
      depositogarantiestelsel.

      6 Indien het depositogarantiefonds het doelvermogen overschrijdt, kan de Nederlandsche Bank ten laste van de
      Stichting het meerdere naar rato van de depositobases laten uitkeren aan de kredietinstellingen waarop het
      depositogarantiestelsel van toepassing is.

      7 De door de kredietinstellingen verschuldigde bijdragen komen ten goede aan het individuele saldi van de
      kredietinstellingen in het depositogarantiefonds.

      8 Indien het depositogarantiefonds vergoedingen uitkeert, keert het deze uit ten laste van achtereenvolgens:

      a. het individuele saldo van de kredietinstelling waarvoor het depositogarantiefonds wordt aangewend;

      b. de individuele saldi van de overige kredietinstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0031636
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel10a18
      [ref3]: https://wetten.overheid.nl/BWBR0031636#Artikel10a20
