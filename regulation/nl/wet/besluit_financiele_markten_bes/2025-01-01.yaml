  - number: 1:2
    text: |-
      Bij regeling van Onze Minister kunnen personen die voldoen aan in die regeling vast te stellen criteria met
      betrekking tot aard en omvang van hun activiteiten, worden aangewezen als professionele marktpartij.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel12
  - number: 1:3
    text: |-
      De [wet][ref1] is met betrekking tot het optreden als adviseur niet van toepassing op adviseurs die een andere
      hoofdberoepswerkzaamheid hebben dan het verlenen van financiële diensten of het aanbieden van financiële producten
      en uit hoofde van die hoofdberoepswerkzaamheid inzicht hebben in de financiële situatie van een consument of
      cliënt, voor zover zij, zonder daarvoor van de aanbieder provisie te ontvangen, het aanbevolen product aan te
      bieden of andere financiële diensten te verlenen met betrekking tot het aanbevolen product, die consument of cliënt
      adviseren en de door hen verstrekte adviezen in het verlengde liggen van hun hoofdberoepswerkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0030883
  - number: 1:4
    text: |-
      1 De [hoofdstukken 2 tot en met 5 van de wet][ref1], met uitzondering van de [artikelen 2:21][ref2] en [2:22][ref3]
      en de [paragrafen 4][ref4] en [5 van hoofdstuk 5][ref5], zijn niet van toepassing op:

      a. beleggingsinstellingen die uitsluitend rechten van deelneming aanbieden in een besloten kring dan wel aan
      professionele marktpartijen;

      b. beheerders en bewaarders voor zover zij de in onderdeel a bedoelde beleggingsinstellingen beheren of belast zijn
      met de bewaring van de activa van deze beleggingsinstellingen;

      c. beleggingsinstellingen die aan de volgende vereisten voldoen:

      1°. in de beleggingsinstelling kunnen ten hoogste 25 natuurlijke personen deelnemen;

      2°. per deelnemer wordt niet meer dan USD 10.000 ingelegd;

      3°. de beleggingsinstelling gaat geen verplichtingen aan waardoor voor de deelnemers een verplichting kan ontstaan
      tot bijbetaling;

      4°. de gelden of andere goederen worden niet gevraagd, dan wel de rechten van deelneming worden niet aangeboden
      door natuurlijke of rechtspersonen die beroeps- of bedrijfsmatig handelen of beleggen in effecten of andere
      beleggingen;

      d. beleggingsinstellingen waarvan het balanstotaal voor minder dan 50% uit beleggingen bestaat en waarvan de totale
      gerealiseerde opbrengsten voor minder dan 50% worden gegenereerd uit beleggingen.

      2 Een beleggingsinstelling als bedoeld in het eerste lid, onderdeel d, die een prospectus verkrijgbaar stelt,
      vermeldt daarin dat zij niet onder toezicht staat van de Autoriteit Financiële Markten.


