    text: |-
      [Hoofdstuk 6, paragrafen 2][ref1] en [3][ref2], is niet van toepassing op:

      a. vennootschappen waarvan op de erkende effectenbeurzen geen aandelen worden verhandeld die zonder toepassing van
      [artikel 6:2 van de wet][ref3] als stemgerechtigde aandelen zouden worden aangemerkt;

      b. vennootschappen waarvan de statuten bepalen dat de aandeelhouder het recht heeft om, onder bij of krachtens de
      statuten vastgestelde voorwaarden, zijn aandelen in het kapitaal van de vennootschap te doen inkopen;

      c. vennootschappen waarvan de belegging en het beheer van het vermogen contractueel is opgedragen aan een
      derde, mits zulks blijkt uit de statuten of bij de laatste emissie van aandelen aan de aandeelhouders en aan de
      inschrijvers op de emissie duidelijk kenbaar is gemaakt.


