  - number: 2:5
    text: |-
      Het programma van werkzaamheden, bedoeld in [artikel 2:2, onderdelen f en g, onder 2°][ref1], van een
      levensverzekeraar met zetel in een openbaar lichaam bevat:

      a. een opgave van de aard van de overeenkomsten die de verzekeraar voornemens is aan te gaan;

      b. de polisvoorwaarden die de verzekeraar voornemens is te gebruiken;

      c. de tarieven die de verzekeraar voornemens is toe te passen;

      d. de technische grondslagen die de verzekeraar voornemens is toe te passen, met name de gegevens die nodig zijn
      voor de berekening van de tarieven en de technische voorzieningen;

      e. een uiteenzetting omtrent de leidende beginselen op het gebied van de herverzekering;

      f. een raming van de kosten voor de inrichting van de administratie en van het productienet, alsmede bewijsstukken
      waaruit blijkt dat de verzekeraar beschikt over de financiële middelen tot dekking daarvan;

      g. een raming voor de eerste drie boekjaren van de liquiditeitspositie;

      h. een raming voor de eerste drie boekjaren van de vermoedelijke inkomsten en uitgaven met betrekking tot de
      directe verzekeringen, de geaccepteerde herverzekeringen en de uitgaande herverzekeringen;

      i. een raming voor de eerste drie boekjaren van de financiële middelen tot dekking van de
      verzekeringsverplichtingen;

      j. een raming voor de eerste drie boekjaren van de financiële middelen tot dekking van de solvabiliteitsmarge.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel22
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel25
