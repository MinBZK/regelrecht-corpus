  - number: 6:1
    text: |-
      De ingevolge [artikel 4:4, eerste lid van de wet][ref1] tussen een beleggingsinstelling en een bewaarder te sluiten
      overeenkomst bepaalt in ieder geval dat:

      a. de bewaarder bij het bewaren uitsluitend in het belang van de deelnemers in de beleggingsinstelling optreedt;

      b. de bewaring ten name van de beleggingsinstelling op een zodanige wijze geschiedt, dat over de in bewaring
      gegeven activa slechts kan worden beschikt door de beleggingsinstelling en de bewaarder tezamen;

      c. de bewaarder de in bewaring gegeven activa slechts afgeeft tegen ontvangst van een verklaring van de
      beleggingsinstelling, waaruit blijkt dat afgifte wordt verlangd in verband met de regelmatige uitoefening van de
      beheerfunctie;

      d. de bewaarder volgens het recht van de staat waar de beheerder zijn zetel heeft, jegens de beleggingsinstelling
      en de deelnemers aansprakelijk is voor door hen geleden schade, voor zover de schade het gevolg is van verwijtbare
      niet-nakoming of gebrekkige nakoming van zijn verplichtingen, ook indien de bewaarder de bij hem in bewaring
      gegeven activa geheel of gedeeltelijk aan een derde heeft toevertrouwd;

      e. indien bewijzen van rechten van deelneming worden afgegeven, deze bewijzen ook door de bewaarder worden
      ondertekend;

      f. een voorstel door de beheerder van een beleggingsinstelling tot wijziging van de tussen de beleggingsinstelling
      en de deelnemers geldende voorwaarden tezamen met de bewaarder wordt gedaan;

      g. indien de bewaarder van een beleggingsfonds te kennen geeft voornemens te zijn zijn functie neer te leggen,
      binnen een termijn van vier weken een vergadering van deelnemers wordt gehouden om in de benoeming van een nieuwe
      bewaarder te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel44
