      1 Het minimumbedrag aan eigen vermogen bedraagt:

      a. voor een kredietinstelling, niet zijnde een kredietinstelling als bedoeld in de onderdelen b tot en met d:
      USD 2.750.000;

      b. voor een kredietinstelling die voornamelijk is gespecialiseerd in het verstrekken van hypotheken: USD 1.650.000;

      c. voor een kredietinstelling die voornamelijk zijn fondsen aantrekt bij wijze van spaardeposito’s: USD 558.000;

      d. voor een kredietvereniging: USD 25.000.

      2 Het minimumbedrag aan eigen vermogen van een kredietinstelling wordt gevormd door de waarde van de
      vermogensbestanddelen, bedoeld in [artikel 4:5, tweede lid][ref1]. Deze vermogensbestanddelen, alsmede de waarden
      die tegenover die vermogensbestanddelen staan, staan onmiddellijk en zonder beperkingen ter beschikking van de
      kredietinstelling.


