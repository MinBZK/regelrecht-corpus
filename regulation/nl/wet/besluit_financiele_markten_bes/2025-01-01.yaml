  - number: 1:7
    text: |-
      1 De [wet][ref1] is met betrekking tot het optreden als adviseur niet van toepassing op adviseurs, voor zover zij
      adviseren over andere financiële producten dan krediet aan consumenten die bij hen werkzaam zijn of anderszins
      onder hun verantwoordelijkheid vallen.

      2 De [wet][ref2] is met betrekking tot het optreden als bemiddelaar niet van toepassing op bemiddelaars, voor zover
      zij bemiddelen over andere financiële producten dan krediet ten behoeve van consumenten die bij hen werkzaam zijn
      of anderszins onder hun verantwoordelijkheid vallen.

      3 De [wet][ref3] is met betrekking tot het optreden als gevolmachtigd of ondergevolmachtigd agent niet van
      toepassing op gevolmachtigd of ondergevolmachtigd agenten, voor zover zij verzekeringen sluiten met consumenten die
      bij hen in dienst zijn of anderszins onder hun verantwoordelijkheid vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
      [ref2]: https://wetten.overheid.nl/BWBR0030883
      [ref3]: https://wetten.overheid.nl/BWBR0030883
