    text: |-
      1 Een herstelplan als bedoeld in [artikel 8:3, eerste lid, van de wet][ref1] vermeldt op welke wijze en binnen
      welke termijn een einde wordt gemaakt aan de omstandigheden die aanleiding gaven tot het verlangen van het
      herstelplan.

      2 Het herstelplan bevat voor de eerstvolgende drie boekjaren ten minste gegevens betreffende:

      a. een raming van de kosten van beheer, met name van de algemene lopende kosten en de provisies;

      b. een gedetailleerde prognose van de vermoedelijke ontvangsten en uitgaven betreffende directe verzekeringen, de
      geaccepteerde herverzekeringen en overdrachten uit hoofde van herverzekering;

      c. de te verwachten balanspositie;

      d. een raming van de financiële middelen ter dekking van de verplichtingen en van de vereiste solvabiliteitsmarge;

      e. het algemene herverzekeringsbeleid.

      3 De Nederlandsche Bank kan aanvullende gegevens verlangen, indien dit nodig is voor een goede beoordeling van
      het herstelplan.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel83
