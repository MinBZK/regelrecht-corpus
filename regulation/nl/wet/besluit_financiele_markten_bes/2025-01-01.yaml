        bwb_id: BWBR0031636
        artikel: 4:9
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4:12
    text: |-
      1 Een kredietinstelling kan kredietrisicovermindering in aanmerking nemen, mits zij gebruik maakt van een door de
      Nederlandsche Bank toegestane techniek ter beperking van het kredietrisico dat verbonden is aan de activa en posten
      buiten de balanstelling, en zij voldoet aan de in voorkomend geval ingevolge het tweede lid gestelde regels.

      2 De Nederlandsche Bank kan nadere regels stellen met betrekking tot de voorwaarden waaronder onder het
      eerste lid genoemde technieken van kredietrisicovermindering toelaatbaar zijn, en de beperking van de aan
      kredietrisicovermindering verbonden risico’s.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel412
  - number: 4:13
    text: |-
      1 De Nederlandsche Bank erkent op aanvraag, al dan niet voor bepaalde tijd, een kredietbeoordelingbureau, indien
      het voldoet aan door de Nederlandsche Bank gestelde criteria.

      2 De Nederlandsche Bank kan een procedure vaststellen voor de erkenning, bedoeld in het eerste lid, en maakt deze
      bekend.

      3 Indien een kredietbeoordelingbureau niet meer voldoet aan de criteria, bedoeld in het eerste lid, kan de
      Nederlandsche Bank de erkenning intrekken.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel413
  - number: 4:14
    text: |-
      1 Een kredietinstelling berekent het bedrag van de vereiste solvabiliteit voor het marktrisico, bedoeld in
      [artikel 4:8, onderdeel b][ref1], conform de door de Nederlandsche Bank gestelde regels. De Nederlandsche Bank
      stelt regels met betrekking tot de berekening van de omvang van het marktrisico ten opzichte van het totale bedrijf
      en de grondslagen van die berekening.

      2 Het is een kredietinstelling toegestaan het bedrag van de vereiste solvabiliteit voor het marktrisico te
      berekenen overeenkomstig de in [artikel 4:9][ref2] gestelde regels, indien het totale solvabiliteitsvereiste voor
      het marktrisico niet meer bedraagt dan vijf procent van het laatst berekende toetsingsvermogen.

      3 Een kredietinstelling die het tweede lid toepast, geeft hiervan kennis aan de Nederlandsche Bank met een door
      deze na overleg met de kredietinstelling te bepalen frequentie. Een overschrijding van de limiet, bedoeld in het
      tweede lid, meldt de kredietinstelling onverwijld aan de Nederlandsche Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0031636#Artikel49
