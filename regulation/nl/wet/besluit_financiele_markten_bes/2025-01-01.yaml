    text: |-
      De Autoriteit Financiële Markten kan verlangen dat een prospectus als bedoeld in
      [artikel 5:19, eerste lid, van de wet][ref1] in een of meer door haar te bepalen talen wordt gesteld, indien dit,
      gelet op de voorgenomen of mogelijke verspreiding van het prospectus, naar haar oordeel noodzakelijk is voor een
      adequate informatieverschaffing aan de beleggers. Zij kan aanwijzingen geven ten aanzien van de wijze waarop het
      prospectus algemeen verkrijgbaar wordt gesteld.


