      1 De solvabiliteit, bedoeld in [artikel 3:17, eerste lid, van de wet][ref1], is voldoende, indien het in aanmerking
      te nemen toetsingsvermogen, bedoeld in [artikel 4:4, eerste lid][ref2], ten minste gelijk is aan de minimumomvang
      van het toetsingsvermogen berekend overeenkomstig de [artikelen 4:8 tot en met 4:18][ref3].

      2 De solvabiliteit van een kredietvereniging is voldoende, indien het in aanmerking te nemen toetsingsvermogen,
      bedoeld in [artikel 4:4, tweede lid][ref4], ten minste gelijk is aan vijf procent van de totale activa, met
      uitzondering van de liquide middelen en de vaste activa, van de kredietvereniging.

      3 Onverminderd het eerste en tweede lid is de solvabiliteit van een kredietinstelling ten minste gelijk aan het in
      [artikel 4:2, eerste lid][ref5], voorgeschreven minimumbedrag aan eigen vermogen.


