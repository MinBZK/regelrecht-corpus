  - number: 4:15
    text: |-
      1 Een kredietinstelling maakt gebruik van de basisindicatorbenadering voor de berekening van het bedrag van de
      met betrekking tot het totale bedrijf vereiste solvabiliteit ter dekking van het operationeel risico, bedoeld in
      [artikel 4:8, onderdeel c][ref1].

      2 De Nederlandsche Bank stelt regels met betrekking tot de basisindicatorbenadering en de berekening van de
      vereiste solvabiliteit ter dekking van het operationeel risico volgens die benadering.


