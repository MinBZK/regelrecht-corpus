  - number: 1:6
    text: |-
      De [wet][ref1] is niet van toepassing op de uitgifte van elektronisch geld dat uitsluitend kan worden gebruikt:

      a. hetzij in door de onderneming of instelling door of namens wie het elektronisch geld is uitgegeven gebruikte
      bedrijfsgebouwen;

      b. hetzij op grond van een handelsovereenkomst met de in onderdeel a genoemde onderneming of instelling binnen een
      beperkt netwerk van dienstverleners;

      c. hetzij voor een beperkte reeks goederen dan wel diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0030883
