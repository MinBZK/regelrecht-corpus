  - number: 3:23
    text: |-
      1 Een financiëledienstverlener als bedoeld in [artikel 5:1 van de wet][ref1] bewaart, indien hij een consument of
      cliënt adviseert, de informatie die hij overeenkomstig [artikel 5:7 van de wet][ref2] heeft ingewonnen, alsmede de
      gegevens betreffende het financiële product, de financiële dienst of de effecten, gedurende ten minste één jaar,
      gerekend vanaf het moment van advisering.

      2 Ten aanzien van financiëledienstverleners, niet zijnde adviseurs, is het eerste lid niet van toepassing, indien
      de advisering niet leidt tot het aangaan van verplichtingen door de consument onderscheidenlijk de cliënt inzake
      het aanbevolen financieel product, de aanbevolen financiële dienst of de aanbevolen effecten.

      3 Indien een consument of cliënt met of door bemiddeling van een financiëledienstverlener een overeenkomst
      aangaat waarvan de inhoud afwijkt van het advies van die financiëledienstverlener, is die financiëledienstverlener
      gedurende ten minste één jaar nadien in staat aan de Autoriteit Financiële Markten aan te tonen dat de
      consument, onderscheidenlijk de cliënt, in weerwil van het advies de keuze heeft gemaakt voor het aangaan van die
      overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0030883#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0030883#Artikel57
