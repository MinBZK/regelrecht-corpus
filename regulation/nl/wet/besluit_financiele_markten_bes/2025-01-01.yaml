        paragraaf: '5'
  - number: 4:36
    text: |-
      De voorziening voor winstdeling en kortingen, bedoeld in [artikel 4:30, onderdeel d][ref1], omvat de bedragen die
      in de vorm van winstdeling bestemd zijn voor de verzekeringnemers, verzekerden of gerechtigden op uitkeringen, voor
      zover deze niet hebben geleid tot verhoging van de voorziening voor levensverzekering, alsmede de bedragen die een
      gedeeltelijke terugbetaling van premies op grond van het resultaat van de overeenkomsten vertegenwoordigen, voor
      zover deze niet tot verhoging van de ledenrekening hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0031636#Artikel430
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel436
