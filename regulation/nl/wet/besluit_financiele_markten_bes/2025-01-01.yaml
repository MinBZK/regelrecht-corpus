  - number: 9:3
    text: |-
      1 De toezichtautoriteit stelt een bestuurlijke boete vast op het basisbedrag, behorend bij de van toepassing zijnde
      categorie.

      2 De toezichtautoriteit verhoogt het basisbedrag van een in de eerste categorie op te leggen boete met ten hoogste
      300 procent van dat bedrag, indien de ernst of de duur van de overtreding een dergelijke verhoging rechtvaardigt.

      3 De toezichtautoriteit verlaagt of verhoogt het basisbedrag van een in de tweede of derde categorie op te leggen
      boete:

      a. met ten hoogste 50 procent van het basisbedrag, indien de ernst of de duur van de overtreding een dergelijke
      verlaging of verhoging rechtvaardigt;

      b. met ten hoogste 50 procent van het basisbedrag, indien de mate van verwijtbaarheid van de overtreding een
      dergelijke verlaging of verhoging rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0031636/2025-01-01#Artikel93
