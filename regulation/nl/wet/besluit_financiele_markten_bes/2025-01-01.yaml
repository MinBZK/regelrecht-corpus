  - number: 4:7
    text: |-
      Voor de toepassing van de [artikelen 4:5][ref1] en [4:6][ref2]:

      a. wordt het kernkapitaal volledig in aanmerking genomen voor de berekening van het toetsingsvermogen;

      b. wordt het aanvullend kapitaal voor de berekening van het toetsingsvermogen slechts in aanmerking genomen, voor
      zover het niet meer bedraagt dan het kernkapitaal;

      c. worden de achtergestelde schuldinstrumenten en preferente aandelen met vaste looptijd tot een maximum van
      vijftig procent van het kernkapitaal in aanmerking genomen;

      d. wordt per post rekening gehouden met het voorzienbare bedrag van de daarover verschuldigde belastingen.


