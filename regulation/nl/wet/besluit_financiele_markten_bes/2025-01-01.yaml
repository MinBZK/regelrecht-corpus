  - number: 5:5
    text: |-
      1 De staten, bedoeld in [artikel 3:36, eerste lid, van de wet][ref1], die door een kredietinstelling worden
      verstrekt, omvatten:

      a. balans- en resultaatgegevens, alsmede aanvullende financiële gegevens ten behoeve van het ingevolge
      [artikel 1:5 van de wet][ref2] door de Nederlandsche Bank uitgeoefende prudentieel toezicht;

      b. andere gegevens ten behoeve van het toezicht op de naleving van de regels met betrekking tot:

      1°. de solvabiliteit ingevolge [artikel 3:17, eerste lid, van de wet][ref3];

      2°. het aanhouden van balansposten en posten buiten de balansteling ingevolge
      [artikel 3:17, vierde lid, van de wet][ref4];

      3°. de liquiditeit ingevolge [artikel 3:18, tweede lid, van de wet][ref5].

      2 De Nederlandsche Bank stelt nadere regels met betrekking tot de in het eerste lid genoemde staten. Deze regels
      hebben betrekking op:

      a. de modellen van de staten;

      b. de reikwijdte van toepassing van de staten en de mate van detaillering van de in te vullen gegevens, met dien
      verstande dat deze geen uitbreiding of nadere rubricering van de staten omvatten;

      c. de reikwijdte van de consolidatie overeenkomstig de regels met betrekking tot consolidatie die de
      kredietinstelling in haar jaarrekening toepast, voor zover uit de [wet][ref6] niet anders voortvloeit;

      d. de waardering van de posten overeenkomstig de waarderingsmethoden die de kredietinstelling in haar jaarrekening
      toepast;

      e. de te hanteren valuta en rekeneenheid;

      f. de afronding;

      g. de termijn waarbinnen de staten worden verstrekt, met dien verstande dat deze niet korter is dan noodzakelijk
      voor de uitoefening van het prudentieel toezicht;

      h. de frequentie waarmee de staten worden verstrekt, met dien verstande dat deze ten minste een maal per jaar is.

      3 De regels, bedoeld in het tweede lid, onderdelen b, f, g en h, zijn afgestemd op de aard en de omvang van de
      kredietinstelling, alsmede op de omvang van de solvabiliteit van de kredietinstelling.

      4 De Nederlandsche Bank kan in individuele gevallen besluiten dat een kredietinstelling periodiek moet melden
      of haar solvabiliteit of liquiditeit zich boven een door de Nederlandsche Bank vastgestelde signaleringswaarde
      bevindt. De frequentie van de melding is niet hoger dan eenmaal per maand en is afgestemd op de aard en de omvang
      van de kredietinstelling, alsmede op de omvang van de solvabiliteit van de kredietinstelling.

      5 De Nederlandsche Bank besluit welke staten openbaar worden gemaakt.


