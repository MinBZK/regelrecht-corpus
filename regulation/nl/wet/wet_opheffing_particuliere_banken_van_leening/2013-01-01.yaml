$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_opheffing_particuliere_banken_van_leening
regulatory_layer: WET
publication_date: '2013-09-26'
valid_from: '2013-01-01'
bwb_id: BWBR0002021
url: https://wetten.overheid.nl/BWBR0002021/2013-01-01
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is regelingen te treffen betreffende de opheffing van
    de particuliere banken van leening;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002021/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Toelatingen, als bedoeld in [artikel 13 der Pandhuiswet 1910][ref1], *Staatsblad* no. 321, worden niet meer
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001880#Artikel13
    url: https://wetten.overheid.nl/BWBR0002021/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001880
        artikel: '13'
  - number: '2'
    text: |-
      De vóór de inwerkingtreding van deze wet verleende toelatingen worden geacht te zijn ingetrokken op den eersten dag
      van de zevende maand na de inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0002021/2013-01-01#Artikel2
  - number: '3'
    text: |-
      De houder van de Bank bevestigt binnen acht dagen na de inwerkingtreding van deze wet een voor het publiek
      duidelijk zichtbare kennisgeving aan het pandhuis, vermeldende den datum, waarop ingevolge deze wet geen panden
      meer in beleening mogen worden aangenomen.
    url: https://wetten.overheid.nl/BWBR0002021/2013-01-01#Artikel3
  - number: '4'
    text: |-
      Indien de houder van de Bank niet voldoet aan het bij [artikel 3][ref1] bepaalde, wordt de toelating geacht te zijn
      ingetrokken op den negenden dag na de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002021#Artikel3
    url: https://wetten.overheid.nl/BWBR0002021/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002021
        artikel: '3'
  - number: '5'
    text: |-
      Het besluit van de Secretarissen-Generaal van de Departementen van Binnenlandsche Zaken en van Justitie betreffende
      de beëindiging van de werkzaamheden der particuliere banken van leening van 24/27 November 1942 ( *Nederlandsche
      Staatscourant* 14 Januari 1943, no. 9) vervalt.
    url: https://wetten.overheid.nl/BWBR0002021/2013-01-01#Artikel5
  - number: '6'
    text: Deze wet treedt in werking met ingang van den dag volgende op dien harer afkondiging.
    url: https://wetten.overheid.nl/BWBR0002021/2013-01-01#Artikel6
