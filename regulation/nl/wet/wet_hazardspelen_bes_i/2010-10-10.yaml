$id: wet_hazardspelen_bes_i
regulatory_layer: WET
publication_date: '2010-10-01'
valid_from: '2010-10-10'
bwb_id: BWBR0028450
url: https://wetten.overheid.nl/BWBR0028450/2010-10-10
articles:
  - number: '1'
    text: >-
      Het Bestuurscollege is bevoegd om, onder door hem te stellen voorwaarden en waarborgen, vergunning te verlenen
      tot het exploiteren van hazardspelen, in daartoe met name aan te wijzen en speciaal daarvoor ingerichte hotels. De
      vergunning is persoonlijk en niet voor overdracht vatbaar.
    url: https://wetten.overheid.nl/BWBR0028450/2010-10-10#Artikel1
  - number: 1a
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028450/2010-10-10#Artikel1a
  - number: '2'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028450/2010-10-10#Artikel2
  - number: '3'
    text: |-
      De vergunninghouder die de in de [artikel 1][ref1] bedoelde voorwaarden of waarborgen niet nakomt, wordt geacht
      zonder vergunning te hebben gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028450#Artikel1
    url: https://wetten.overheid.nl/BWBR0028450/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028450
        artikel: '1'
  - number: '4'
    text: >-
      Het Bestuurcollege is te allen tijde bevoegd, de vergunning vervallen te verklaren, indien hij acht, dat de
      gestelde voorwaarden of waarborgen niet worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0028450/2010-10-10#Artikel4
  - number: '5'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028450/2010-10-10#Artikel5
  - number: 5a
    text: |-
      [Artikel 1807 van Boek 7a van het Burgerlijk Wetboek BES][ref1] is niet van toepassing op prijzen en premies
      behaald in gelegenheden, gegeven met vergunning ingevolge deze wet verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1807
    url: https://wetten.overheid.nl/BWBR0028450/2010-10-10#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: '1807'
  - number: '6'
    text: 'Deze wet wordt aangehaald als: Wet hazardspelen BES I.'
    url: https://wetten.overheid.nl/BWBR0028450/2010-10-10#Artikel6
