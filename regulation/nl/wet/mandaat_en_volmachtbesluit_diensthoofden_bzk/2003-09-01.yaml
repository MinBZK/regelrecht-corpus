        artikel: 8:3
        paragraaf: '8'
  - number: '4'
    text: |-
      1 Ondertekening van besluiten en stukken op grond van het mandaat van het diensthoofd vindt plaats op de volgende
      wijze:

        - (aanduiding bewindspersoon),
        - voor deze,
        - (aanduiding diensthoofd),
        - (handtekening)
        - (naam)

      2 Bij ondertekening van besluiten en stukken op grond van de volmacht van het diensthoofd wordt de aanduiding van
      de bewindspersoon voorafgegaan door: Namens de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel4
  - number: 5:1
    text: |-
      Het mandaat en de volmacht van het diensthoofd is niet van toepassing:

      a) indien bij wettelijk voorschrift anders is bepaald;

      b) indien de aard van de bevoegdheid of het stuk zich daartegen verzet;

      c) indien het een stuk betreft dat bij de ontvanger de indruk kan wekken dat de ondertekenaar persoonlijk een
      beslissing neemt die door een bewindspersoon behoort te worden genomen;

      d) op besluiten en stukken met betrekking tot politieke of maatschappelijke aangelegenheden van principiële aard;

      e) indien het een bezwaarschrift betreft dat gericht is tegen een besluit dat door het diensthoofd is genomen.
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel51
  - number: 5:2
    text: |-
      Artikel 4:2, eerste en tweede lid, en artikel 4:3 van het MV-besluit secretaris-generaal BZK, inzake aan de
      bewindspersonen voorbehouden aangelegenheden, zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel52
  - number: 5:3
    text: |-
      Aan de secretaris-generaal is, voor zover in of krachtens dit besluit niet anders is bepaald, voorbehouden het
      nemen van besluiten en het afdoen en ondertekenen van stukken met betrekking tot:

      a) de onderdeelsoverstijgende kaders van het beleid en beheer inzake alle aspecten van de bedrijfsvoering van
      het ministerie met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en materieel gebied en
      aangelegenheden met betrekking tot het verrichten van privaatrechtelijke rechtshandelingen;

      b) het nader vaststellen van de inrichting van de onder de diensthoofden ressorterende dienstonderdelen op basis
      van het [Organisatiebesluit BZK][ref1];

      c) aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;

      d) het beslissen op bezwaarschriften tegen besluiten van of namens een bewindspersoon met betrekking tot een
      personele aangelegenheid;

      e) het vertegenwoordigen van de minister namens de Staat bij de toepassing van de
      [Wet op de ondernemingsraden][ref2] bij het ministerie en het optreden als bestuurder in de zin van voornoemde wet
      in het overleg met de Groepsondernemingsraad van het ministerie;

      f) het vertegenwoordigen van de minister in het overleg met het departementaal georganiseerd overleg;

      g) personele beheersbeslissingen op grond van het Beheersbesluit KABGNA/KABGA 1998 ten aanzien van de directeuren
      van de Kabinetten van de Gouverneurs van de Nederlandse Antillen en Aruba;

      h) het optreden als gemachtigd ambtenaar in de zin van de departementale regelgeving met betrekking tot de
      uitvoering van de [Wet openbaarheid van bestuur][ref3];

      i) het optreden als bevoegd gezag als bedoeld in de Regeling procedure inzake het omgaan met een vermoeden van
      een misstand;

      j) het verlenen van ontslag aan een ambtenaar op grond van [artikel 125e van de Ambtenarenwet][ref4];

      k) het vaststellen en ondertekenen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld
      in dit artikel;

      l) het toekennen van vergoeding van representatiekosten op grond van het Besluit representatiekosten
      rijkspersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0013308
      [ref2]: https://wetten.overheid.nl/BWBR0002747
      [ref3]: https://wetten.overheid.nl/BWBR0005252
      [ref4]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
