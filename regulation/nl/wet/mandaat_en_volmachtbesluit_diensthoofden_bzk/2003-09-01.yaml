  - number: 7:3
    text: |-
      1 De uitoefening door het diensthoofd van de bevoegdheden, bedoeld in [artikel 7:1][ref1], geschiedt bij
      schriftelijk besluit, in overeenstemming met de secretaris-generaal en na advies van de directeur Financieel-
      Economische Zaken en de directeur Personeel en Organisatie.

      2 Voor het besluit, bedoeld in het eerste lid, wordt gebruik gemaakt van het door de directeur Personeel en
      Organisatie vastgestelde model. In overeenstemming met de directeur Personeel en Organisatie kan daarvan worden
      afgeweken indien daartoe bijzondere aanleiding bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0013169#Artikel71
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel73
    references:
