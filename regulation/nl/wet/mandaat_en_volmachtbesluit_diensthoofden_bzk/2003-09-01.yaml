  - number: 8:2
    text: |-
      1 De uitoefening door het diensthoofd onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en
      gevolmachtigde van diens mandaat en volmacht, geschiedt binnen de door de secretaris-generaal vastgestelde kaders
      met betrekking tot het beleid en beheer inzake de bedrijfsvoering van het ministerie.

      2 Afwijking van het eerste lid ten aanzien van een onder het diensthoofd ressorterend dienstonderdeel is slechts
      mogelijk in overeenstemming met de secretaris-generaal, de directeur Financieel-Economische Zaken en de directeur
      van de Centrale Stafdiensten die het aangaat en wordt schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel82
  - number: 8:3
    text: |-
      De uitoefening door het diensthoofd onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde
      en gevolmachtigde van diens mandaat en volmacht, geschiedt met inachtneming van de departementale procedures en
      richtlijnen met betrekking tot onder meer:

        - administratieve organisatiebeschrijvingen;
        - documentaire informatievoorziening;
        - financiële verplichtingen, informatie en administratie;
        - totstandbrenging van wet- en regelgeving;
        - personele besluiten;
        - behandeling van topstukken;
        - behandeling van en het beslissen op verzoeken op grond van de [Wet openbaarheid van bestuur][ref1], met inbegrip
      van bezwaarschriften dienaangaande;
        - ontslagverlening op grond van [artikel 99 van het Algemeen Rijksambtenarenreglement][ref2] onderscheidenlijk
      [artikel 95 van het Besluit algemene rechtspositie politie][ref3];
        - aanleg en bijhouding van persoonsregistraties;
        - inkoop, verwerving en Europese aanbesteding;
        - het aangaan en het gebruik van (mantel)contracten;
        - werving, selectie, aanstelling en herplaatsing in het kader van reorganisatie;
        - aanpassing van de organisatie of formatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel95
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '99'
      - id: ref3
        bwb_id: BWBR0006516
        artikel: '95'
  - number: 8:4
    text: |-
      Het diensthoofd, onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en gevolmachtigde, legt
      op verzoek van een bewindspersoon of de secretaris-generaal mondeling of schriftelijk verantwoording af over de
      uitoefening van zijn mandaat en volmacht.
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel84
  - number: 8:5
    text: |-
      1 Het diensthoofd onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en gevolmachtigde, is
      verantwoordelijk voor het bijhouden van een of meer doelmatig ingerichte administraties die inzicht bieden in het
      door en namens het diensthoofd gevoerde financiële beheer en beheer van niet-geldelijke zaken op grond van diens
      mandaat en volmacht.

      2 De directeur Financieel-Economische Zaken en de directeur Accountantsdienst zijn bevoegd om de administraties,
      bedoeld in het eerste lid, te onderzoeken ten behoeve van de uitvoering van hun taken overeenkomstig het
      [Organisatiebesluit BZK][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013308
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0013308
  - number: 8:6
    text: |-
      In gevallen waarin dit besluit niet voorziet, beslist de bewindspersoon die het aangaat of de secretaris-generaal
      over de verlening van mandaat of een volmacht.
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel86
  - number: 9:1
    text: |-
      Verlening en doorverlening van (onder)mandaat en volmacht op grond van of krachtens dit besluit wordt geregistreerd
      overeenkomstig de [artikelen 8:1][ref1] en [8:2][ref2] van het MV-besluit secretaris-generaal BZK.


      [ref1]: https://wetten.overheid.nl/BWBR0013169#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0013169#Artikel82
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0013169
        artikel: 8:1
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0013169
        artikel: 8:2
        paragraaf: '8'
  - number: 9:2
    text: |-
      1 De directeur Personeel en Organisatie is belast met het beheer van dit besluit.

      2 De secretaris-generaal en de diensthoofden, ieder voor zover het hem aangaat, zijn verantwoordelijk voor een
      juiste, volledige en tijdige aanlevering aan de directeur Personeel en Organisatie van de gegevens die een goed
      beheer van dit besluit onderscheidenlijk het mandaat- en volmachtregister mogelijk maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.

      4 De directeur Personeel en Organisatie rapporteert jaarlijks aan de secretaris-generaal en de diensthoofden over
      het beheer van dit besluit.
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel92
  - number: 9:3
    text: |-
      1 Wijziging van dit besluit is voorbehouden aan de secretaris-generaal in overeenstemming met de bewindspersonen.

      2 Wijziging van dit besluit geschiedt op voordracht van de directeur Personeel en Organisatie na advies van de
      directeur Financieel-Economische Zaken en de directeur Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel93
  - number: 10:1
    text: Dit besluit treedt in werking met ingang van 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel101
  - number: 10:2
    text: 'Dit besluit wordt aangehaald als: Mandaat- en volmachtbesluit diensthoofden BZK (MV-besluit diensthoofden BZK).'
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel102
