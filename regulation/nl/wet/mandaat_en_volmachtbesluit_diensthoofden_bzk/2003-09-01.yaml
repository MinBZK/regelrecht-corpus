  - number: 3:1
    text: |-
      Het mandaat om te beslissen op bezwaarschriften tegen besluiten met betrekking tot een personele aangelegenheid
      wordt uitgeoefend door de plaatsvervangend secretaris-generaal, voor zover ten aanzien van het Korps Landelijke
      politiediensten en de Informatie- en communicatietechnologie Organisatie niet anders is bepaald, onverminderd het
      bepaalde in artikel 4:3, onder b, van het MV-besluit secretaris-generaal BZK.
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel31
  - number: 3:2
    text: |-
      1 Het mandaat van het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst
      omvat tevens de bevoegdheid om te besluiten op aanvragen als bedoeld in
      [hoofdstuk 4 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1], onverminderd het bepaalde in
      [artikel 2:2][ref2] van dit besluit.

      2 Het eerste lid is niet van toepassing op bezwaarschriften dienaangaande.


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0013169#Artikel22
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0013409
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0013169
        artikel: 2:2
        paragraaf: '2'
  - number: 3:3
    text: |-
      Het mandaat van de directeur-generaal Management en Personeelsbeleid omvat tevens:

      a) de leiding van het overleg met de centrales van overheidspersoneel en de overheidswerkgevers of verenigingen van
      overheidswerkgevers, bedoeld in de [Regeling overleg Raad voor het Overheidspersoneelsbeleid][ref1];

      b) de leiding van het overleg met de Sectorcommissie overleg rijkspersoneel, genoemd in het
      [Algemeen Rijksambtenarenreglement][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008494
      [ref2]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008494
      - id: ref2
        bwb_id: BWBR0001950
  - number: 3:4
    text: |-
      Het mandaat van de directeur-generaal Openbare Orde en Veiligheid omvat tevens:

      a) de leiding van het overleg met de Commissie voor georganiseerd overleg in politie-ambtenarenzaken, genoemd in
      het [Besluit overleg en medezeggenschap politie 1994][ref1];

      b) de leiding van het overleg met de Commissie Korps landelijke politiediensten, genoemd in het
      [Besluit overleg en medezeggenschap politie 1994][ref2], in de hoedanigheid van gemandateerd korpsbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0006518
      [ref2]: https://wetten.overheid.nl/BWBR0006518
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006518
      - id: ref2
        bwb_id: BWBR0006518
  - number: 3:5
    text: |-
      Ten aanzien van het mandaat en de volmacht van de directeur-generaal Openbare Orde en Veiligheid met betrekking
      tot het beheer van het Korps Landelijke Politiediensten onderscheidenlijk de Informatie- en communicatietechnologie
      Organisatie, geldt het volgende:

      a) [artikel 5:3][ref1] van dit besluit is niet van toepassing;

      b) [artikel 8:2, eerste lid][ref2] en [artikel 8:3][ref3] zijn slechts van toepassing op voornoemde
      dienstonderdelen voor zover dit door de directeur-generaal Openbare Orde en Veiligheid, de korpschef van het Korps
      Landelijke Politiediensten of de directeur Informatie- en communicatietechnologie Organisatie is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0013169#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0013169#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0013169#Artikel83
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel35
    references:
      - id: ref1
