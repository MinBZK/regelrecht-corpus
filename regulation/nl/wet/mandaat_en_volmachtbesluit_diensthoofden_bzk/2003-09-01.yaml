      - id: ref2
        bwb_id: BWBR0013308
  - number: 7:2
    text: |-
      [Artikel 7:1][ref1] is niet van toepassing op:

      a) het nemen van besluiten met betrekking tot personele aangelegenheden ten aanzien van rechtstreeks onder het
      diensthoofd ressorterende functionarissen;

      b) het aanstellen van een ambtenaar in tijdelijke dienst met toepassing van
      [artikel 6a van het Algemeen Rijksambtenarenreglement][ref2];

      c) het aanwijzen van een rijksambtenaar als herplaatsingskandidaat;

      d) het verlenen van ontslag op grond van [artikel 99 van het Algemeen Rijksambtenarenreglement][ref3]
      onderscheidenlijk [artikel 95 van het Besluit algemene rechtspositie politie][ref4];

      e) het vaststellen van beleidsregels en circulaires ten aanzien van aangelegenheden op het werkterrein van het
      diensthoofd overeenkomstig het [Organisatiebesluit BZK][ref5], tenzij deze bevoegdheid in hogere regelgeving aan de
      desbetreffende functionaris is toegekend;

      f) het besluiten tot een reorganisatie;

      g) het toekennen van materiële schadevergoeding vanaf € 2.500,- dan wel van immateriële schadevergoeding;

      h) het vaststellen van de formatie van onder het diensthoofd ressorterende dienstonderdelen;

      j) het beslissen op bezwaarschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0013169#Artikel71
