      - id: ref2
        bwb_id: BWBR0013169
        artikel: '4'
  - number: 7:1
    text: |-
      1 Het diensthoofd is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat en
      het doorverlenen van zijn volmacht, respectievelijk tot het beperken of het intrekken daarvan, aan onder
      hem ressorterende functionarissen ten aanzien van aangelegenheden op hun werkterrein overeenkomstig het
      [Organisatiebesluit BZK][ref1], met inachtneming van het MV-besluit directeuren BZK.

      2 Het diensthoofd kan bij toepassing van de bevoegdheid, bedoeld in het eerste lid, afwijken van het MV-besluit
      directeuren BZK.

      3 Het diensthoofd kan, voor zover niet anders is bepaald, bij toepassing van de bevoegdheid, bedoeld in het eerste
      lid, tevens de bevoegdheid toekennen tot het verlenen van ondermandaat en het doorverlenen van de volmacht aan
      een rechtstreeks onder de gemandateerde of gevolmachtigde ressorterende functionaris of in bijzondere gevallen aan
      een andere functionaris, ten aanzien van aangelegenheden op het werkterrein van de functionaris overeenkomstig het
      [Organisatiebesluit BZK][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013308
      [ref2]: https://wetten.overheid.nl/BWBR0013308
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel71
    references:
      - id: ref1
