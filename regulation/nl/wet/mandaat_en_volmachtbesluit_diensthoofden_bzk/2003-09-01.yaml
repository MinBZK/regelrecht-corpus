  - number: 5:4
    text: |-
      1 Het mandaat en de volmacht van het diensthoofd met betrekking tot het aangaan van financiële verplichtingen en
      het doen van uitgaven is beperkt tot het budget dat aan het diensthoofd ter beschikking is gesteld op basis van een
      door de secretaris-generaal en de directeur Financieel-Economische Zaken goedgekeurd bestedingsplan.

      2 Het diensthoofd is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven
      te doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door een bewindspersoon of de
      secretaris-generaal, met medeparaaf van de directeur Financieel-Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel54
  - number: 5:5
    text: |-
      Het buiteninvorderingstellen of kwijtschelden van een privaatrechtelijke vordering geschiedt met medeparaaf van of
      namens de directeur Financieel-Economische Zaken bij een bedrag van tenminste € 5.000,- en met inachtneming van de
      door de Minister van Financiën gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel55
  - number: '6'
    text: |-
      1 Bij tijdelijke afwezigheid of verhindering van het diensthoofd wordt diens mandaat en volmacht volledig
      uitgeoefend door het plaatsvervangend diensthoofd.

      2 De aanwijzing van een plaatsvervangend diensthoofd geschiedt door het diensthoofd met inachtneming van het
      [Organisatiebesluit BZK][ref1] en in overeenstemming met de secretaris-generaal.

      3 Bij gelijktijdige tijdelijke afwezigheid of verhindering van het diensthoofd en het plaatsvervangend diensthoofd
      wordt het mandaat en de volmacht van het diensthoofd bij wijze van waarneming volledig uitgeoefend door de
      functionaris die daartoe door het diensthoofd in overeenstemming met de secretaris-generaal is aangewezen.

      4 Ondertekening van besluiten en stukken ingevolge dit artikel vindt plaats overeenkomstig [artikel 4][ref2], met
      dien verstande dat de handtekening voorafgegaan wordt door: b/a.


      [ref1]: https://wetten.overheid.nl/BWBR0013308
      [ref2]: https://wetten.overheid.nl/BWBR0013169#Artikel4
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel6
    references:
      - id: ref1
