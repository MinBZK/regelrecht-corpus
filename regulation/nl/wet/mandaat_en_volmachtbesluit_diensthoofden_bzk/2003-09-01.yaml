preamble:
  text: |-
    Gelet op het Mandaat- en volmachtbesluit secretaris-generaal BZK;

    Gezien het advies van de Groepsondernemingsraad;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:



             ministerie:

              het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;



            minister:

              de Minister van Binnenlandse Zaken en Koninkrijksrelaties;



            bewindspersoon:

              de Minister van Binnenlandse Zaken en Koninkrijksrelaties onderscheidenlijk de Staatssecretaris van
      Binnenlandse Zaken en Koninkrijksrelaties;









            stuk:

              een stuk dat een besluit inhoudt of een ander stuk dat wordt toegerekend aan een bewindspersoon;



            diensthoofd:

              de plaatsvervangend secretaris-generaal, een directeur-generaal, het hoofd van de Algemene Inlichtingen- en
      Veiligheidsdienst of het hoofd van de Inspectie Openbare Orde en Veiligheid van het ministerie.
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel1
  - number: 2:1
    text: |-
      1 Het diensthoofd is bevoegd om namens een bewindspersoon besluiten te nemen en stukken af te doen en te
      ondertekenen.

      2 Het diensthoofd is bevoegd om namens een bewindspersoon voor de Staat privaatrechtelijke rechtshandelingen te
      verrichten.

      3 De bevoegdheden, bedoeld in het eerste en tweede lid, worden aangeduid als: het mandaat en de volmacht van het
      diensthoofd.
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel21
  - number: 2:2
    text: |-
      Het mandaat en de volmacht van het diensthoofd wordt uitgeoefend ten aanzien van aangelegenheden die naar
      het oordeel van het diensthoofd en te zijner verantwoording behoren tot zijn werkterrein overeenkomstig het
      [Organisatiebesluit BZK][ref1] en die, onverminderd het bepaalde in het MV-besluit secretaris-generaal BZK
      onderscheidenlijk dit besluit, redelijkerwijs niet behoren te worden voorgelegd aan een bewindspersoon of de
      secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0013308
    url: https://wetten.overheid.nl/BWBR0013169/2003-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013308
  - number: 2:3
    text: |-
      Onverminderd het bepaalde in het MV-besluit secretaris-generaal BZK onderscheidenlijk dit besluit, heeft het
      mandaat en de volmacht van het diensthoofd in ieder geval betrekking op:

      a) de taken van het diensthoofd en de onder het diensthoofd ressorterende functionarissen en dienstonderdelen,
      genoemd in het [Organisatiebesluit BZK][ref1], en het uitoefenen van integraal management dienaangaande met
      inbegrip van aangelegenheden op organisatorisch, personeel, financieel en materieel gebied en aangelegenheden met
      betrekking tot het verrichten van privaatrechtelijke rechtshandelingen;

      b) het vaststellen van de formatie van de onder het diensthoofd ressorterende dienstonderdelen;

      c) het leiding geven aan de rechtstreeks onder het diensthoofd ressorterende functionarissen;

      d) het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref2] in het overleg met de
      ondernemingsraad van de onder het diensthoofd ressorterende dienstonderdelen, voor zover niet een onder het
      diensthoofd ressorterende functionaris als zodanig optreedt;

      e) het vertegenwoordigen van een bewindspersoon namens de Staat in gerechtelijke procedures waarbij het
      dienstonderdeel is betrokken;

      f) het vaststellen van beleidsregels en circulaires met betrekking tot aangelegenheden op het werkterrein van het
      diensthoofd overeenkomstig het [Organisatiebesluit BZK][ref3];

      g) het beheer van de archiefbescheiden van de onder het diensthoofd ressorterende dienstonderdelen op grond van de
      desbetreffende departementale regelgeving;

      h) het afnemen van de eed of de belofte van ambtenaren die worden aangesteld bij een onder het diensthoofd
      ressorterend dienstonderdeel;

      i) het beslissen op bezwaarschriften gericht tegen besluiten inzake aangelegenheden die behoren tot zijn
      werkterrein overeenkomstig het [Organisatiebesluit BZK][ref4] voor zover in wet- en regelgeving niet anders is
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0013308
      [ref2]: https://wetten.overheid.nl/BWBR0002747
      [ref3]: https://wetten.overheid.nl/BWBR0013308
      [ref4]: https://wetten.overheid.nl/BWBR0013308
