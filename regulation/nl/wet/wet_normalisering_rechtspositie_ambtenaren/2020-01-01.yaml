    text: |-
      1 [Artikel X][ref1] treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin deze
      wet wordt geplaatst.

      2 De overige artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor
