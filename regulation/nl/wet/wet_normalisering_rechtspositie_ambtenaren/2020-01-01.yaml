preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de rechtspositie van ambtenaren zo veel mogelijk
    in overeenstemming te brengen met die van werknemers met wie een arbeidsovereenkomst naar burgerlijk recht is
    gesloten;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039393/2020-01-01#ArtikelAanhef
articles:
  - number: IIc T/M IId
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0039393/2020-01-01#ArtikelIIc_TM_IId
  - number: VIIIb en IX
    text: '*[Vervallen]*'
    url: https://wetten.overheid.nl/BWBR0039393/2020-01-01#ArtikelVIIIb_en_IX
  - number: X
    text: |-
      De krachtens [artikel 125, eerste lid, onderdeel m, van de Ambtenarenwet][ref1] vastgestelde regels, alsmede de
      krachtens artikel 50, eerste lid, van de Politiewet 1993 of [artikel 47, eerste lid, van de Politiewet 2012][ref2]
      vastgestelde regels betreffende het in artikel 125, eerste lid, onderdeel m, van de Ambtenarenwet genoemde
      onderwerp, zoals deze golden voorafgaand aan inwerkingtreding van deze wet, blijven buiten toepassing bij de
      totstandkoming en inwerkingtreding van deze wet en de wetten, algemene maatregelen van bestuur, ministeriële
      regelingen, gemeentelijke en provinciale verordeningen en andere algemeen verbindende voorschriften waarmee wetten
      en andere algemeen verbindende voorschriften met deze wet in overeenstemming worden gebracht, dan wel waarmee
      voorzieningen worden getroffen ter uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel47
