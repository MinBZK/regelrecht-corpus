        bwb_id: BWBR0002357
        artikel: '1'
  - number: '28'
    text: |-
      1 Beheerssubsidie wordt niet verstrekt ten behoeve van een terrein dat is gelegen in een beheersgebied voor de
      ontwikkeling of instandhouding van een beheerspakket op een beheerseenheid:

      a. waarvan de oppervlakte niet ten minste overeenkomt met het aantal hectares dat is opgenomen als
      minimumoppervlakte in de bijlage waarin het desbetreffende beheerspakket is opgenomen;

      b. waarvan de breedte kleiner, onderscheidenlijk groter, is dan de minimumbreedte, onderscheidenlijk
      maximumbreedte, en de lengte kleiner is dan de minimumlengte die is opgenomen in de bijlage waarin het
      desbetreffende beheerspakket is opgenomen.

      2 Indien beheerssubsidie wordt verstrekt voor de ontwikkeling of instandhouding van meerdere beheerspakketten op
      een terrein, zijn de in het eerste lid, onderdelen a en b, genoemde voorwaarden van overeenkomstige toepassing voor
      elk afzonderlijk beheerspakket waarvoor beheerssubsidie wordt verleend op het desbetreffende terrein.

      3 De minister kan beleidsregels vaststellen met betrekking tot het aantal van een planten- of diersoort bedoeld
      in de onderscheiden beheers- en landschapspakketten per oppervlaktemaat en de spreiding van de betreffende soort
      binnen de beheerseenheid, onderscheidenlijk de oppervlaktemaat.

      4 Beleidsregels als bedoeld in het derde lid worden als [bijlage][ref1] bij deze regeling opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: '29'
    text: |-
      Beheerssubsidie wordt niet verstrekt:

      a. aan Staatsbosbeheer;

      b. ten behoeve van de terreinen die niet zijn gelegen in een beheersgebied, tenzij de aangevraagde beheerssubsidie
      betrekking heeft op beheerspakketten genoemd in de [bijlagen 28b tot en met 30][ref1].

      c. ten behoeve van een in een beheersgebied gelegen terrein voorzover daardoor het quotum wordt overschreden, of

      d. ten behoeve van terreinen waarop nog verplichtingen van toepassing zijn op grond van:

      1°. de [Subsidieregeling natuurbeheer 2000][ref2];

      2°. de Beschikking beheersovereenkomsten 1983;

      3°. de Regeling beheersovereenkomsten 1988;

      4°. de Regeling beheersovereenkomsten 1993;

      5°. de Regeling beheersovereenkomsten en natuurontwikkeling;

      6°. de Regeling stimulering bosuitbreiding op landbouwgronden;

      7°. de [Beschikking ter zake van het uit produktie nemen van bouwland][ref3];

      8°. de Beschikking bijdragen probleemgebieden,

      9°. de Regeling functiebeloning bos en natuurterreinen, of

      10°. [hoofdstuk 4, paragraaf 2, van de Regeling GLB-inkomenssteun][ref4] of
      [hoofdstuk 2, paragraaf 5.2 van de Regeling GLB-inkomenssteun 2006][ref5], behalve ingeval de beheerssubsidie
      betrekking heeft op een beheerseenheid als bedoeld in [onderdeel 4 van de bijlagen 19 tot en met 22][ref6], of
      in [bijlage 28b][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0010999
      [ref3]: https://wetten.overheid.nl/BWBR0004375
      [ref4]: https://wetten.overheid.nl/BWBR0017558#Paragraaf2
      [ref5]: https://wetten.overheid.nl/BWBR0019131#Paragraaf5.2
      [ref6]: https://wetten.overheid.nl/BWBR0011000
      [ref7]: https://wetten.overheid.nl/BWBR0011000
