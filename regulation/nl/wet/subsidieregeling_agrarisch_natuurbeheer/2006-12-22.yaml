      - id: ref2
        bwb_id: BWBR0011017
  - number: 101a
    text: |-
      1 Beheerders die vóór 25 oktober 2003 een beschikking tot subsidieverlening hebben ontvangen met betrekking
      tot een landschapspakket als bedoeld in de [bijlagen 32 tot en met 36][ref1] of [39][ref2], zoals die luidden
      tot 25 oktober 2003, waarin een bedekking van minder dan 90% was opgenomen, zijn in zoverre in afwijking van
      [artikel 64, onderdeel a][ref3], slechts verplicht tot het in stand houden van het landschapspakket, genoemd in
      [bijlage 32][ref4], met het in de subsidieverlening vastgestelde lagere bedekkingspercentage tegen de daarbij
      behorende lagere vergoeding.

      2 Bij de berekening op grond van het eerste lid wordt voor beheerders die een beheersbijdrage ontvangen voor een
      landschapspakket opgenomen in [bijlage 39][ref5], zoals die luidde tot 25 oktober 2003 een omrekenfactor van 2528
      gehanteerd.


