  - number: '77'
    text: |-
      1 Subsidie als bedoeld in artikel 2a wordt eenmalig verstrekt voor een tijdvak.

      2 De subsidie kan enkel worden verstrekt indien deze vóór 1 mei 2009 is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel77
  - number: '78'
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in artikel 2a wordt ingediend uiterlijk op 30 april van het eerste
      kalenderjaar van het tijdvak waarop de aanvraag betrekking heeft.

      2 In afwijking van het eerste lid wordt een aanvraag die betrekking heeft op het tijdvak 2004–2009 ingediend in een
      nader door de minister vast te stellen periode.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel78
  - number: '79'
    text: |-
      1 De subsidie bedraagt 100% van de noodzakelijke kosten die samenhangen met de activiteiten, genoemd in het
      projectplan, bedoeld in [artikel 19a][ref1], met een maximum per hectare per jaar van:

      a. € 74,40 ingeval het een pakket als bedoeld in [bijlage 32][ref2], dan wel [bijlage 37][ref3] betreft;

      b. € 37,20 ingeval het een pakket als bedoeld in [bijlage 12][ref4], [bijlage 13][ref5], [bijlage 14][ref6],
      [bijlage 23][ref7] dan wel [bijlage 28][ref8] betreft;

      c. € 18,88 ingeval het een pakket als bedoeld in [bijlage 16][ref9], [bijlage 17][ref10], [bijlage 18][ref11],
      [bijlage 19][ref12], [bijlage 20][ref13], [bijlage 21][ref14], dan wel [bijlage 22][ref15] betreft, indien en
      voor zover monitoring in het derde en in het zesde jaar plaatsvindt overeenkomstig de Handleiding Nationaal
      Weidevogelmeetnet, uitgave 2001, van SOVON Vogelonderzoek Nederland en het Centraal Bureau voor de Statistiek;

      d. € 10,20 ingeval het een pakket als bedoeld in [bijlage 28c][ref16], [bijlage 28d][ref17], [bijlage 28e][ref18],
      dan wel [bijlage 28f][ref19] betreft, indien voor het perceel op grond van deze regeling geen andere subsidie wordt
      verstrekt;

      e. € 5,– ingeval het een pakket als bedoeld in [bijlage 28c][ref20], [bijlage 28d][ref21], [bijlage 28e][ref22],
      dan wel [bijlage 28f][ref23] betreft, indien voor het perceel reeds subsidie wordt verleend voor een pakket als
      bedoeld in [bijlage 15][ref24], [16][ref25], [19][ref26], [20][ref27], [21][ref28] of [22][ref29];

      f. € 14,88 ingeval het een pakket als bedoeld in een van de overige bijlagen betreft.

      2 De kosten, bedoeld in het eerste lid, betreffen de activiteiten die betrekking hebben op de doelstellingen,
      bedoeld in [artikel 2a][ref30], waarbij de kosten in een jaar ten minste 5% en ten hoogste 50% van de totale kosten
      in het desbetreffende tijdvak bedragen, de kosten voor activiteiten met betrekking tot de doelstelling, bedoeld in
      [artikel 2a, onderdeel c][ref31], ten hoogste 50% van de totale kosten in dat tijdvak bedragen en de kosten voor
      activiteiten met betrekking tot de doelstelling, bedoeld in [artikel 2a, onderdeel a][ref32], ten minste 20% van de
      totale kosten in dat tijdvak bedragen.

      3 Indien gedurende het tijdvak het aantal hectares waarvoor op grond van [artikel 2][ref33] subsidie wordt
      verstrekt met meer dan 100% wordt uitgebreid, kunnen de kosten, bedoeld in het eerste lid, van activiteiten die
      betrekking hebben op de doelstellingen, bedoeld in [artikel 2a][ref34], voorafgaand aan bedoelde uitbreiding
      per jaar minder dan 5% van de totale kosten van het gehele tijdvak bedragen, mits de totale kosten gedurende het
      resterende tijdvak in elk jaar ten minste 5% en ten hoogste 50% van de totale kosten bedragen in het tijdvak van
      het aantal hectares na uitbreiding.

      4 Voor de toepassing van dit artikel en de [artikelen 80][ref35], [81][ref36] en [81a][ref37] worden gelijk gesteld
      met één hectare:

      a. 400 strekkende meter lijnvormige landschapselementen;

      b. 5 poelen;

      c. 150 hoogstambomen of knotbomen.


