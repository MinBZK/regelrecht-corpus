      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
  - number: '27'
    text: |-
      Beheerssubsidie ten behoeve van de ontwikkeling of instandhouding van een beheerspakket opgenomen in de
      [bijlagen 29][ref1] en [30][ref2] wordt uitsluitend verstrekt indien:

      a. voorafgaand aan de desbetreffende subsidieaanvraag ten behoeve van het betrokken terrein een vrijstelling is
      verleend op grond van de [Regeling meldings- en herplantplicht][ref3], en

      b. de beplanting geschiedt buiten de bebouwde kom, bedoeld in [artikel 1, vijfde lid, van de Boswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0003518
      [ref4]: https://wetten.overheid.nl/BWBR0002357#Artikel1
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel27
    references:
      - id: ref1
