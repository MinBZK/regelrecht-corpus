  - number: 81c
    text: |-
      1 Met betrekking tot het tijdvak, bedoeld in [artikel 77, eerste lid][ref1], verstrekt de subsidieontvanger
      steeds na afloop van een kalenderjaar, met uitzondering van het laatste jaar van dat tijdvak, vóór 1 april van het
      daarop volgende jaar, de volgende gegevens over de in het desbetreffende afgelopen jaar gemaakte kosten, bedoeld
      in [artikel 79][ref2]:

      a. gegevens waaruit blijkt ten behoeve van welke activiteiten de kosten zijn gemaakt;

      b. gegevens waaruit blijkt ten behoeve van wie de kosten zijn gemaakt;

      c. gegevens waaruit blijkt door wie de kosten zijn gemaakt;

      d. gegevens waaruit blijkt wanneer de kosten zijn gemaakt; en

      e. gegevens waaruit blijkt tot welk resultaat de uitgevoerde activiteiten hebben geleid.

      2 De verstrekking van gegevens, bedoeld in het eerste lid, geschiedt aan de directeur van de Dienst Regelingen met
      gebruikmaking van een daartoe bestemd formulier dat verkrijgbaar is bij die directeur.

      3 Ingeval de kosten ten minste € 25.000,– bedragen overlegt de subsidieontvanger bij de verstrekking
      van gegevens, bedoeld in het eerste lid, een verklaring, overeenkomstig een door de minister vast
      te stellen model, van een accountant-administratieconsulent of registeraccountant als bedoeld in
      [artikel 2:393, eerste lid, van het Burgerlijk Wetboek][ref3] waaruit blijkt dat de kosten in overeenstemming zijn
      met [artikel 79][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref4]: https://wetten.overheid.nl/BWBR0011000#Artikel79
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81c
