  - number: 81d
    text: |-
      1 Vóór 1 april van het jaar, volgend op het laatste jaar van het tijdvak waarop de subsidieverlening betrekking
      heeft, dient de subsidieontvanger een aanvraag tot subsidievaststelling over dat tijdvak in bij de directeur
      van de Dienst Regelingen met gebruikmaking van een daartoe bestemd aanvraagformulier dat verkrijgbaar is bij die
      directeur.

      2 Artikel 81c is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81d
  - number: '82'
    text: |-
      Telkens wanneer met betrekking tot één of meer gronden, die in een gebied dat als beheersgebied overeenkomstig de
      Regeling beheersovereenkomsten en natuurontwikkeling is begrensd, onderscheidenlijk beheersgebied, zijn gelegen
      en ten aanzien waarvan beheerssubsidie is verleend voor de pakketten opgenomen in bijlage 1a van de Regeling
      beheersovereenkomsten en natuurontwikkeling, met uitzondering van de pakketten G1, B1 en G9, onderscheidenlijk de
      beheerspakketten opgenomen in de [bijlagen 6 tot en met 11][ref1], [15][ref2], en [24 tot en met 27][ref3] van de
      onderhavige regeling, aan het bureau beheer landbouwgronden een recht van eigendom of een daarvan afgeleid beperkt
      recht wordt aangeboden, is het bureau beheer landbouwgronden gehouden het hem aangeboden recht te verwerven, indien
      de minister aannemelijk acht dat met betrekking tot zodanige grond:

      a. vervreemding of in gebruik afstaan, of

      b. vestiging van een ander beperkt recht ten gunste van één of meer personen niet kan plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel82
