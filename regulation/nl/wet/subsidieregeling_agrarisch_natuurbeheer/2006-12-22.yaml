  - number: 50a
    text: |-
      1 Inrichtingssubsidie voor de in de [bijlagen 29][ref1] en [30][ref2] genoemde beheerspakketten worden, in
      afwijking van [artikel 2][ref3] juncto [artikel 1, eerste lid, onderdelen d en e][ref4], slechts verstrekt
      aan beheerders die berekend over de laatste drie kalenderjaren voorafgaand aan het jaar van de aanvraag
      tot subsidieverlening tenminste 25% van hun onzuiver inkomen, als bedoeld in artikel 4 van de Wet op de
      inkomstenbelasting, verkrijgen uit het landbouwbedrijf waarvoor de subsidie is aangevraagd.

      2 Indien de beheerder minder dan drie jaar voorafgaand aan het tijdstip van indienen van de aanvraag tot
      subsidieverlening werkt op het landbouwbedrijf waarvoor de subsidieaanvraag wordt ingediend, wordt in afwijking
      van het eerste lid, het onzuiver inkomen berekend op basis van de voorhanden zijnde gegevens. Indien er nog
      geen gegevens voorhanden zijn, wordt het onzuiver inkomen berekend op basis van de gegevens van het volledige
      kalenderjaar van de aanvraag.

      3 Indien de beheerder een rechtspersoon is, wordt de inrichtingssubsidie voor de in de
      [bijlagen 29][ref5] en [30][ref6] genoemde beheerspakketten, in afwijking van [artikel 2][ref7]
      juncto [artikel 1, eerste lid, onderdelen d en e][ref8], slechts verstrekt indien de in
      [artikel 7, derde lid, van de Wet op de Vennootschapsbelasting 1969][ref9] bedoelde winst, vermeerderd met het
      bedrag dat voor de bedrijfsleiding van de rechtspersoon ten titel van beloning voor verrichte arbeid in mindering
      is gebracht, gemiddeld over de drie kalenderjaren voorafgaand aan het tijdstip van de subsidieverlening voor ten
      minste de helft afkomstig is uit het landbouwbedrijf waarvoor de subsidie is aangevraagd.

      4 Indien op het landbouwbedrijf waarvoor de aanvraag wordt ingediend minder dan drie jaren voorafgaand aan het
      tijdstip van het indienen van de aanvraag tot subsidieverlening landbouwactiviteiten zijn verricht, wordt in
      afwijking van het derde lid, de winst van de rechtspersoon berekend op basis van de voorhanden zijnde gegevens.
      Indien er geen gegevens voorhanden zijn, wordt de winst berekend op basis van de gegevens van het volledige
      kalenderjaar van de aanvraag.


