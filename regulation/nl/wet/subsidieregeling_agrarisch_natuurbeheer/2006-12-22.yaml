  - number: '41'
    text: |-
      1 Telkens binnen 8 weken na afloop van een tijdvak of zoveel eerder indien noodzakelijk dient de ontvanger van
      beheerssubsidie voor het desbetreffende terrein een aanvraag tot subsidievaststelling over dat tijdvak in bij de
      directeur van de Dienst Regelingen met gebruikmaking van een daartoe bestemd aanvraagformulier dat verkrijgbaar is
      bij de directeur van de Dienst Regelingen.

      2 Een subsidieontvanger als bedoeld in [artikel 5][ref1], doet bij de aanvraag bedoeld in het eerste lid een opgave
      van:

      a. de ondernemers aan wie door hem bijdragen zijn toegekend;

      b. de activiteiten van die ondernemers waarvoor de bijdragen zijn toegekend en

      c. de bedragen, per ondernemer, die zijn toegekend.

      3 De ontvanger van beheerssubsidie geeft in de aanvraag aan in hoeverre het doel, bedoeld in
      [artikel 38, eerste lid, onderdeel a, onderscheidenlijk onderdeel b][ref2], is gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel38
