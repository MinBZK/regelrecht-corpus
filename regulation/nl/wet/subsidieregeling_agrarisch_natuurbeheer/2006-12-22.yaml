preamble:
  text: |-
    Gelet op de Verordening nr. 1257/99 van 17 mei 1999 van de Raad van de Europese Gemeenschappen inzake steun voor
    plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en
    instelling van een aantal verordeningen;

    Gelet op artikel 29, eerste lid, van de Wet agrarisch grondverkeer;

    Gelet op de artikelen 2 en 4 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. ondernemer: ondernemer van een bedrijf waarop de landbouw wordt uitgeoefend;

      c. terrein: gebied, niet zijnde een erf of tuin, dat niet wordt doorsneden door:

      i. wegen breder dan 5 meter,

      ii. waterlopen die op enig punt breder zijn dan 25 meter,

      iii. een dubbelsporige spoorlijn, of

      iv. een geëlektrificeerde spoorlijn,

      en ten hoogste tot een oppervlakte van 1% van het gebied bestaat uit bebouwing;

      d. plan van toedeling: plan van toedeling als bedoeld in [artikel 201 van de Landinrichtingswet][ref1],
      als bedoeld in [artikel 81 van de Reconstructiewet Midden-Delfland][ref2], als bedoeld in
      [artikel 85 van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref3] of als bedoeld in
      [artikel 62 van de Reconstructiewet concentratiegebieden][ref4];

      e. beheerder: ondernemer, dan wel enige andere natuurlijke persoon of rechtspersoon die krachtens
      zakelijk of duurzaam persoonlijk recht beschikt over het recht tot gebruik en beheer van een terrein of
      krachtens een plan van tijdelijk gebruik als bedoeld in [artikel 189 van de Landinrichtingswet][ref5]
      beschikt over het recht tot gebruik en beheer van een terrein welk gebruik blijkens een overeenkomst met
      de landinrichtingscommissie, bedoeld in [hoofdstuk III, titel 2 van de Landinrichtingswet][ref6], een
      duurzaam karakter heeft, met uitzondering van een publiekrechtelijk lichaam of een instelling als bedoeld in
      __REF002___________________________________________________________________________________________________________
      ____________, doch voor zover het een vereniging betreft, slechts een vereniging met volledige rechtsbevoegdheid;

      f. landbouwgrond: grond waarop ten minste vanaf 31 juli 1992 enige vorm van akkerbouw, weidebouw, veehouderij,
      pluimveehouderij, tuinbouw – daaronder begrepen fruitteelt en het kweken van bomen, bloemen en bloembollen – en
      elke andere vorm van bodemcultuur hier te lande, met uitzondering van bosbouw, wordt bedreven, of gronden die uit
      productie zijn genomen in het kader van de [Beschikking ter zake van het uit productie nemen van bouwland][ref8] of
      de [Regeling GLB-inkomenssteun 2006][ref9];

      g. beheerspakket: in één van de [bijlagen 6 tot en met 30][ref10] beschreven samenstel van in een terrein
      voorkomende flora, fauna, boomsoorten, beheersvoorschriften of gebiedskenmerken;

      h. landschapspakket: in één van de [bijlagen 32 tot en met 46][ref11] beschreven samenstel van in een terrein
      voorkomende en karakteristiek voor het landschap zijnde landschappelijke elementen met de daarbij behorende
      bepalingen;

      i. beheerssubsidie: subsidie als bedoeld in [artikel 2, aanhef en onderdeel a][ref12];

      j. landschapssubsidie: subsidie als bedoeld in [artikel 2, aanhef en onderdeel b][ref13];

      k. inrichtingssubsidie: subsidie als bedoeld in [artikel 2, aanhef en onderdeel c][ref14];

      l. beheersbijdrage: bedrag als opgenomen in de [bijlagen 6 tot en met 46][ref15];

      m. bureau beheer landbouwgronden: bureau als bedoeld in [artikel 28 van de Wet agrarisch grondverkeer][ref16];

      n. beheersgebied: gebied dat als beheersgebied overeenkomstig [hoofdstuk 2][ref17] van deze regeling is begrensd;

      o. beheersgebiedplan: plan als bedoeld in [artikel 10][ref18];

      p. quotum: bij een in een beheersgebiedsplan opgenomen beheerspakket of groep van beheerspakketten,
      onderscheidenlijk landschapspakket of groep van landschapspakketten, behorend aantal hectares, meters,
      onderscheidenlijk stuks, waarvoor in het desbetreffende beheersgebied ten hoogste beheerssubsidie,
      onderscheidenlijk landschapssubsidie kan worden verstrekt;

      q. probleemgebied: gebied als bedoeld in [hoofdstuk 2a][ref19];

      r. Dienst Regelingen: Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      s. natuurgebied: gebied dat als zodanig is begrensd in een natuurgebiedsplan als bedoeld in
      [artikel 13 van de Subsidieregeling natuurbeheer 2000][ref20];

      t. tijdvak: ononderbroken periode van zes jaar;

      u. beheerseenheid: oppervlakte-eenheid binnen een terrein waarop een beheers- of landschapspakket ontwikkeld of in
      stand gehouden wordt;

      v. GVE: grootvee-eenheden, berekend door omrekening aan de hand van de tabel van Verordening (EEG) nr. 2078/92,
      betreffende landbouwproductiemethoden die verenigbaar zijn met de eisen inzake milieubescherming, en betreffende
      natuurbeheer (Pb EG 1992, L 215);

      w. verdunningsfactor: quotiënt van de oppervlakte van de grond verkregen door hemelsbreed een lijn te trekken om de
      buitenste hoeken van de buitenste terreinen waarvoor subsidie wordt aangevraagd en de totale oppervlakte van de in
      dat gebied gelegen terreinen waarvoor subsidie wordt aangevraagd.

      2 Voor de toepassing van deze regeling wordt onder ‘terrein’ mede verstaan: samenstel van terreinen dat door een
      beheerder als een geheel wordt beheerd.


