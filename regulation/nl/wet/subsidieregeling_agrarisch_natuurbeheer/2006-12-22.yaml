  - number: 33a
    text: |-
      1 De beheerssubsidie voor de in de [bijlagen 6 tot en met 28b][ref1] genoemde beheerspakketten wordt, gedeeltelijk,
      voor de duur van één jaar, ingetrokken indien op het bedrijf van de subsidieontvanger op grond van het Besluit
      verboden stoffen diergeneesmiddelen verboden hormonen of residuen daarvan, worden aangetroffen.

      2 De beheerssubsidie voor de in de [bijlagen 6 tot en met 28b][ref2] genoemde beheerspakketten wordt, gedeeltelijk,
      voor de duur van twee jaren, ingetrokken indien op het bedrijf van de subsidieontvanger nogmaals op grond van het
      Besluit verboden stoffen diergeneesmiddelen verboden hormonen of residuen daarvan, worden aangetroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
  - number: '34'
    text: |-
      Indien beheerssubsidie wordt verstrekt voor de instandhouding of ontwikkeling van meerdere beheerspakketten op een
      terrein, vermeldt de beschikking tot subsidieverlening in ieder geval:

      a. de ligging en de grootte van het terrein;

      b. de doelen van de beheerssubsidie, bestaande uit het gedurende het tijdvak op het terrein ontwikkelen of in stand
      houden van de desbetreffende beheerspakketten;

      c. het aantal hectares per beheerspakket waarvoor beheerssubsidie wordt verleend;

      d. de beheersbijdrage op basis waarvan de beheerssubsidie zal worden vastgesteld, waarbij onderscheid wordt gemaakt
      naar ligging;

      e. het aantal hectares waar ruige mest op wordt uitgereden en het bedrag, bedoeld in [artikel 33][ref1], en

      f. de datum waarop het tijdvak waarover beheerssubsidie wordt verleend, aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel33
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '35'
    text: |-
      Indien beheerssubsidie wordt verstrekt voor de instandhouding of ontwikkeling van een beheerspakket, vermeldt de
      beschikking tot subsidieverlening in ieder geval:

      a. de ligging en de grootte van het terrein;

      b. het doel van beheerssubsidie, bestaande uit het gedurende het tijdvak op het terrein ontwikkelen,
      onderscheidenlijk in stand houden, van het desbetreffende beheerspakket;

      c. de beheersbijdrage op basis waarvan de beheerssubsidie zal worden vastgesteld, waarbij onderscheid wordt gemaakt
      naar ligging;

      d. het aantal hectares waar ruige mest op wordt uitgereden en de daarmee samenhangende verhoging, bedoeld in
      [artikel 33, eerste lid][ref1], en

      e. de datum waarop het tijdvak waarover beheerssubsidie wordt verleend, aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel33
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel35
    references:
