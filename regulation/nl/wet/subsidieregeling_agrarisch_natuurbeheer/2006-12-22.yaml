  - number: '7'
    text: |-
      1 De beheersbijdragen van de beheerspakketten en landschapspakketten opgenomen in de
      [bijlagen 6 tot en met 46][ref1] en het maximumbedrag aan inrichtingssubsidie worden jaarlijks voor 1 maart van het
      jaar waarop de bijdragen betrekking hebben in voorkomend geval met terugwerkende kracht tot 1 januari van dat jaar
      door de minister gecorrigeerd voor de werkelijke loon- en prijsontwikkeling, gebaseerd op de grondslagen, bedoeld
      in [artikel 8][ref2], naar de situatie in het voorafgaande jaar.

      2 Van de vaststelling van de overeenkomstig het eerste lid gecorrigeerde beheersbijdragen en maximumbedrag aan
      inrichtingssubsidie geeft de minister kennis in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel8
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '8'
        hoofdstuk: '1'
  - number: '8'
    text: |-
      Bij het vaststellen van de beheersbijdragen van een beheerspakket als bedoeld in [artikel 7][ref1] wordt rekening
      gehouden met de volgende grondslagen:

      a. de productiederving uitgedrukt in kilogram voedereenheden melk;

      b. de toename van de arbeidsaanspraken, en

      c. de wijziging van de exploitatie-aanspraken, als gevolg van de uitvoering van agrarisch natuurbeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel7
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '7'
        hoofdstuk: '1'
  - number: '9'
    text: |-
      1 Subsidie wordt niet verstrekt aan beheerders ter voldoening aan verplichtingen die op grond van enig wettelijk
      voorschrift zijn voorgeschreven.

      2 Subsidie wordt niet verstrekt indien de subsidie minder dan € 170,– per jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel9
  - number: 9a
    text: |-
      Voorzover de regeling bemesting toestaat, geschiedt de aanwending van kunstmest op grond van een bemestingsadvies
      of bemestingsplan.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel9a
  - number: 9b
    text: |-
      De subsidie wordt voor de duur van een jaar niet verstrekt, indien de subsidieaanvrager door ernstige nalatigheid
      of opzettelijk een onjuiste aanvraag heeft ingediend of anderszins onjuiste gegevens heeft verstrekt ter
      verkrijging van een subsidie op grond van een andere regeling die gebaseerd is op hoofdstuk IX van titel II van de
      [verordening (EG) nr. 1257/99](31999R1257) van de Raad van de Europese Unie van 17 mei 1999 betreffende steun voor
      plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot wijziging
      en instelling van een aantal verordeningen (PbEG L 160), of indien een verleende subsidie geheel of gedeeltelijk
      is ingetrokken ingevolge [artikel 90a][ref1] of een vastgestelde subsidie geheel of gedeeltelijk is ingetrokken
      ingevolge [artikel 90b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel90a
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel90b
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: 90a
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: 90b
        hoofdstuk: '10'
  - number: 9c
    text: |-
      Indien de aanvrager opzettelijk een onjuiste aanvraag tot subsidieverlening of vaststelling heeft ingediend of
      anderszins onjuiste gegevens heeft verstrekt ter verkrijging van een subsidie op grond van een andere regeling
      die gebaseerd is op hoofdstuk IX van titel II van de [verordening (EG) nr. 1257/99](31999R1257) van de Raad van
      de Europese Unie van 17 mei 1999 betreffende steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en
      Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en instelling van een aantal verordeningen (PbEG L 160), of
      indien ingeval van opzet een verleende of vastgestelde subsidie geheel of gedeeltelijk is ingetrokken op grond van
      [artikel 90a][ref1] of [90b][ref2], wordt tevens geen subsidie verleend in het daarop volgend jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel90a
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel90b
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel9c
