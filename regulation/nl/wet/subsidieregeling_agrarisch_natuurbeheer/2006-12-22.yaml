  text: |-
    Gelet op de Verordening nr. 1257/99 van 17 mei 1999 van de Raad van de Europese Gemeenschappen inzake steun voor
    plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en
    instelling van een aantal verordeningen;

    Gelet op artikel 29, eerste lid, van de Wet agrarisch grondverkeer;

    Gelet op de artikelen 2 en 4 van de Kaderwet LNV-subsidies;

    Besluit:
