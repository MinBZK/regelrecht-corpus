  - number: '101'
    text: |-
      Op een aanvraag voor subsidie op grond van hoofdstuk 8, zoals dat luidde tot 25 oktober 2003, die is ingediend vóór
      die datum, blijft dat hoofdstuk van toepassing.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel101
  - number: '102.1'
    text: |-
      Subsidies of voorschotten daarop worden verleend onder voorbehoud van goedkeuring van de Commissie van de Europese
      Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel102
  - number: '102.2'
    text: |-
      De beslissing tot verlening van een subsidie of een voorschot daarop kan worden ingetrokken of gewijzigd ter
      verkrijging van de goedkeuring van de Commissie van de Europese Gemeenschappen voor deze regeling, of wegens het
      uitblijven daarvan.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel102
  - number: '103'
    text: Deze regeling treedt in werking met ingang van 1 januari 2000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel103
  - number: '104'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling agrarisch natuurbeheer.'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel104
