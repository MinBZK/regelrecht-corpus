        bwb_id: BWBR0011000
        artikel: 90b
        hoofdstuk: '10'
  - number: 9d
    text: |-
      Indien de aanvrager in een jaar opzettelijk een onjuiste aanvraag tot subsidieverlening op grond van deze regeling
      heeft ingediend, wordt geen subsidie verstrekt voor het daaropvolgend jaar.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel9d
  - number: '10'
    text: |-
      1 Ten behoeve van de uitvoering van deze regeling worden beheersgebieden begrensd met de vaststelling van
      beheersgebiedsplannen, die in ieder geval bestaan uit:

      a. een kaart met een topografische ondergrond op een schaal 1 : 25.000, waarin de grenzen van het beheersgebied
      zijn opgenomen;

      b. een omschrijving van de in het beheersgebied nagestreefde doelstellingen op het gebied van agrarisch
      natuurbeheer;

      c. de in het betrokken beheersgebied te ontwikkelen of in stand te houden beheerspakketten;

      d. een vaststelling van een totaal van de quota voor de onderscheiden beheerspakketten indien het totaal aantal
      hectares van de te ontwikkelen of in stand te houden beheerspakketten kleiner is dan de oppervlakte van het
      begrensde beheersgebied;

      e. de in het betrokken beheersgebied aan te leggen, te herstellen of in stand te houden landschapspakketten;

      f. een aanduiding of het beheersgebied bestaat uit veen-, klei- of zandgebied.

      2 Voor toepassing van het eerste lid, onderdeel f, wordt onder veengebied verstaan: dat gebied dat voor ten
      minste 50% bestaat uit grond waar in de bovenste 80 centimeter meer dan de helft van de dikte bestaat uit moerig
      materiaal.

      3 Voor toepassing van het eerste lid, onderdeel f, wordt onder zandgebied verstaan: gebied dat voor ten minste
      50% bestaat uit minerale grond waarvan het niet-moerige gedeelte tussen 0 en 80 centimeter diepte voor meer dan de
      helft van de dikte uit zand (minder dan 8% lutum) bestaat.

      4 Voor toepassing van het eerste lid, onderdeel f, wordt onder kleigebied verstaan: gebied dat niet is een veen-
      of zandgebied.

      5 Indien bij de vaststelling van de beheersgebiedsplannen niet met zekerheid kan worden bepaald dat de
      toepassing van de beheerspakketten opgenomen in [bijlagen 16][ref1], [17][ref2], [18][ref3], of [23][ref4]
      of de landschapspakketten opgenomen in [bijlagen 32 tot en met 46][ref5] op alle locaties van het betreffende
      beheersgebied daadwerkelijk bijdraagt aan het bereiken van de in het eerste lid, onderdeel b, bedoelde
      doelstellingen, wordt in het beheersgebiedsplan tevens opgenomen dat de minister bij de besluitvorming omtrent
      subsidieverlening kan toetsen of het verlenen van subsidie voor een beheerspakket op de desbetreffende locatie
      doelmatig is.

      6 Voor zover in gebiedsplannen andere quota zijn opgenomen dan die bedoeld in het eerste lid, onderdeel d, wordt
      met deze quota geen rekening gehouden bij de beoordeling van subsidieaanvragen.

      7 Voor zover beheersgebiedsplannen voorzien in het aanleggen, herstellen of in stand houden van het
      landschapspakket dat is opgenomen in [bijlage 32][ref6] kan in het desbetreffende beheersgebied tevens het
      landschapspakket dat is opgenomen in [bijlage 33][ref7] worden aangelegd, hersteld of in stand gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
      [ref4]: https://wetten.overheid.nl/BWBR0011000
      [ref5]: https://wetten.overheid.nl/BWBR0011000
      [ref6]: https://wetten.overheid.nl/BWBR0011000
      [ref7]: https://wetten.overheid.nl/BWBR0011000
