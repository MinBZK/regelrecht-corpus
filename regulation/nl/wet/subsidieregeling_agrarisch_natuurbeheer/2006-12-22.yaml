        artikel: 17b
        hoofdstuk: 2a
  - number: '31'
    text: |-
      Beheerssubsidie wordt niet verstrekt indien voor de desbetreffende beheerseenheid voor de instandhouding of
      ontwikkeling van een beheerspakket bijdragen worden genoten van een rechtspersoon als bedoeld in [artikel 5][ref1]
      of door tussenkomst van een subsidieaanvrager als bedoeld in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel4
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel31
