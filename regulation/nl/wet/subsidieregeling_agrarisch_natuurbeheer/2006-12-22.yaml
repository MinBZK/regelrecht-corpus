  - number: '80'
    text: |-
      1 Het aantal hectares waarvoor subsidie als bedoeld in [artikel 2a][ref1] wordt verleend is niet groter dan het
      aantal hectares waarvoor subsidie is verleend op grond van [artikel 2][ref2] in samenhang met [artikel 4][ref3].

      2 Ingeval het aantal hectares waarvoor subsidie als bedoeld in [artikel 2a][ref4] is verleend in enig jaar
      afwijkt van het aantal hectares waarvoor subsidie is verleend op grond van [artikel 2][ref5] in samenhang met
      [artikel 4][ref6], dient de subsidieontvanger uiterlijk op 31 maart van het daaropvolgende kalenderjaar een
      projectplan in dat is gebaseerd op het gewijzigde aantal hectares, tenzij de afwijking minder dan 25% is.

      3 De subsidieverlening op grond van [artikel 2a][ref7] wordt in voorkomend geval één keer per jaar in
      overeenstemming gebracht met het gewijzigde aantal hectares, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel2a
