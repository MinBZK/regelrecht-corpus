  - number: 85b
    text: |-
      1 Ingeval subsidie is verleend ten behoeve van een terrein waarop het beheerspakket, opgenomen in de
      [bijlagen 19 tot en met 22, onderdeel 4][ref1], in stand wordt gehouden kan de subsidieverlening op verzoek van de
      subsidieontvanger voor een gedeelte van het terrein:

      a. worden gewijzigd in een subsidieverlening voor het instandhouden van het beheerspakket, opgenomen
      in de [bijlagen 19 tot en met 22][ref2], waarbij het terrein wordt beheerd op een wijze als bedoeld in
      [bijlage 16][ref3], of

      b. worden aangevuld met een subsidieverlening voor het instandhouden van het beheerspakket, opgenomen in
      [bijlage 17][ref4].

      2 De oppervlakte waarop de aanvulling, bedoeld in het eerste lid, onderdeel b, betrekking heeft is ten hoogste:

      a. één vijfde van het totaal van

      1°. de oppervlakte waarop de wijziging, bedoeld in het eerste lid, aanhef en onderdeel a, betrekking heeft, en

      2°. de oppervlakte waarvoor subsidie is verleend voor het instandhouden van het beheerspakket, opgenomen in
      [bijlage 16][ref5] of het beheerspakket, opgenomen in de [bijlagen 19 tot en met 22][ref6], waarbij het terrein
      wordt beheerd op een wijze als bedoeld in [bijlage 16][ref7], verminderd met

      b. de oppervlakte waarvoor subsidie is verleend voor het instandhouden van het beheerspakket, opgenomen in
      [bijlage 17][ref8].

      3 [Artikel 85, derde tot en met zesde lid][ref9], zijn van overeenkomstige toepassing.


