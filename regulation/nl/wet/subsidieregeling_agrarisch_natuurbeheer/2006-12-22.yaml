        paragraaf: '1'
  - number: '50'
    text: |-
      Geen inrichtingssubsidie wordt verstrekt:

      a. voor kosten die zijn gemaakt, alvorens een beslissing op de aanvraag voor inrichtingssubsidie is genomen,
      behoudens de kosten, bedoeld in [artikel 48, onderdeel a][ref1];

      b. ten behoeve van maatregelen waarmee een aanvang is gemaakt, onderscheidenlijk die reeds zijn uitgevoerd,
      alvorens een beslissing op de aanvraag voor inrichtingssubsidie is genomen, of

      c. indien de aanvraag tot inrichtingssubsidie niet wordt ingediend tegelijk met de aanvraag tot beheerssubsidie,
      onderscheidenlijk landschapssubsidie, voor het desbetreffende terrein.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel48
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel50
