  - number: 20a
    text: |-
      1 Voor de toepassing van dit hoofdstuk wordt onder beheersgebied eveneens verstaan: natuurgebied als bedoeld
      in [artikel 13 van de Subsidieregeling natuurbeheer 2000][ref1], indien en voor zover de instandhouding van
      een beheerspakket volgens de in [bijlage 3][ref2] van deze regeling opgenomen tabel, in overeenstemming is
      met de doelstellingen en basis- of pluspakketten van het desbetreffende natuurgebiedsplan als bedoeld in de
      [Subsidieregeling natuurbeheer 2000][ref3].

      2 In afwijking van het eerste lid kunnen beheerders, die vóór 25 oktober 2003 subsidie ontvingen op grond van één
      van de regelingen, genoemd in [artikel 29, onderdeel d, subonderdelen 2° tot en met 5°][ref4], tot 1 januari
      2007 voor een terrein gelegen in een natuurgebied subsidie aanvragen voor de beheerspakketten opgenomen in de
      [bijlagen 6 tot en met 28a][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel13
