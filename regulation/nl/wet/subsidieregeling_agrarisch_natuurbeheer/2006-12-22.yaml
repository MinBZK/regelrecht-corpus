  - number: '83'
    text: |-
      1 In gevallen als bedoeld in [artikel 82][ref1] wordt de door het bureau beheer landbouwgronden te betalen
      grondprijs bepaald op basis van de daartoe in opdracht van het bureau beheer landbouwgronden getaxeerde waarde van
      de betrokken grond in het economische verkeer bij agrarische bestemming.

      2 Bij de taxatie wordt in voorkomende gevallen geen rekening gehouden met de omstandigheid dat:

      a. op de betrokken grond een aangepaste agrarische bedrijfsvoering uit hoofde van de subsidieverlening plaatsvindt;

      b. dat de betrokken grond is gelegen in een beheersgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel82
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '82'
        hoofdstuk: '9'
  - number: '84'
    text: |-
      1 Indien de uitkomst van de in opdracht van het bureau beheer landbouwgronden verrichte taxatie voor de andere bij
      de subsidieverlening betrokken zijnde partij niet aanvaardbaar is, vindt in opdracht van die partij nadere taxatie
      van de betrokken grond plaats door een driemanschap waarvan:

      a. een lid wordt aangewezen door die partij;

      b. een lid wordt aangewezen door het bureau beheer landbouwgronden;

      c. een lid wordt aangewezen door de onder a en b bedoelde personen gezamenlijk.

      2 Het driemanschap verricht de nadere taxatie met inachtneming van het bepaalde in [artikel 83, tweede lid][ref1].

      3 Het driemanschap beslist met meerderheid van stemmen. De beslissing van het driemanschap heeft kracht van bindend
      advies ten aanzien van de te betalen grondprijs.

      4 De kosten van de nadere taxatie, bedoeld in het eerste lid, worden gelijkelijk verdeeld tussen betrokken
      partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel83
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '83'
        hoofdstuk: '9'
  - number: 84a
    text: |-
      De minister kan bij een in de Staatscourant bekend te maken besluit bepalen dat vanaf een door hem vast te stellen
      tijdstip de gehoudenheid van het bureau beheer landbouwgronden, bedoeld in [artikel 82][ref1], wordt opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel82
