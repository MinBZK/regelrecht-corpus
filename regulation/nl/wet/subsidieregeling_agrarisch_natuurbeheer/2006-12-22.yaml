  - number: 79.1.f
    text: € 14,88 ingeval het een pakket als bedoeld in een van de overige bijlagen betreft.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel79
  - number: '79.2'
    text: |-
      De kosten, bedoeld in het eerste lid, betreffen de activiteiten die betrekking hebben op de doelstellingen, bedoeld
      in [artikel 2a][ref1], waarbij de kosten in een jaar ten minste 5% en ten hoogste 50% van de totale kosten in
      het desbetreffende tijdvak bedragen, de kosten voor activiteiten met betrekking tot de doelstelling, bedoeld in
      [artikel 2a, onderdeel c][ref2], ten hoogste 50% van de totale kosten in dat tijdvak bedragen en de kosten voor
      activiteiten met betrekking tot de doelstelling, bedoeld in [artikel 2a, onderdeel a][ref3], ten minste 20% van de
      totale kosten in dat tijdvak bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: 2a
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: 2a
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0011000
        artikel: 2a
        hoofdstuk: '1'
  - number: '79.3'
    text: |-
      Indien gedurende het tijdvak het aantal hectares waarvoor op grond van [artikel 2][ref1] subsidie wordt verstrekt
      met meer dan 100% wordt uitgebreid, kunnen de kosten, bedoeld in het eerste lid, van activiteiten die betrekking
      hebben op de doelstellingen, bedoeld in [artikel 2a][ref2], voorafgaand aan bedoelde uitbreiding per jaar minder
      dan 5% van de totale kosten van het gehele tijdvak bedragen, mits de totale kosten gedurende het resterende tijdvak
      in elk jaar ten minste 5% en ten hoogste 50% van de totale kosten bedragen in het tijdvak van het aantal hectares
      na uitbreiding.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: 2a
        hoofdstuk: '1'
  - number: '79.4'
    text: |-
      Voor de toepassing van dit artikel en de [artikelen 80][ref1], [81][ref2] en [81a][ref3] worden gelijk gesteld met
      één hectare:


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel81a
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '80'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '81'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0011000
        artikel: 81a
        hoofdstuk: '8'
  - number: 79.4.a
    text: 400 strekkende meter lijnvormige landschapselementen;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel79
  - number: 79.4.b
    text: 5 poelen;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel79
  - number: 79.4.c
    text: 150 hoogstambomen of knotbomen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel79
  - number: '80.1'
    text: |-
      Het aantal hectares waarvoor subsidie als bedoeld in [artikel 2a][ref1] wordt verleend is niet groter dan het
      aantal hectares waarvoor subsidie is verleend op grond van [artikel 2][ref2] in samenhang met [artikel 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel4
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: 2a
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '2'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0011000
        artikel: '4'
        hoofdstuk: '1'
  - number: '80.2'
    text: |-
      Ingeval het aantal hectares waarvoor subsidie als bedoeld in [artikel 2a][ref1] is verleend in enig jaar
      afwijkt van het aantal hectares waarvoor subsidie is verleend op grond van [artikel 2][ref2] in samenhang met
      [artikel 4][ref3], dient de subsidieontvanger uiterlijk op 31 maart van het daaropvolgende kalenderjaar een
      projectplan in dat is gebaseerd op het gewijzigde aantal hectares, tenzij de afwijking minder dan 25% is.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel4
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: 2a
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '2'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0011000
        artikel: '4'
        hoofdstuk: '1'
  - number: '80.3'
    text: |-
      De subsidieverlening op grond van [artikel 2a][ref1] wordt in voorkomend geval één keer per jaar in overeenstemming
      gebracht met het gewijzigde aantal hectares, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel2a
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: 2a
        hoofdstuk: '1'
  - number: '81'
    text: 'De beschikking tot subsidieverlening vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81
  - number: 81.a
    text: het aantal hectares waarop de subsidieverlening betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81
  - number: 81.b
    text: het bedrag waarop de subsidie ten hoogste kan worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81
  - number: 81.c
    text: het jaar met ingang waarvan de subsidie wordt verleend; en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81
  - number: 81.d
    text: de periode waarop de subsidiabele kosten betrekking kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81
  - number: 81a.1
    text: |-
      De subsidieontvanger dient uiterlijk op 31 maart van het tweede en volgende jaar van het tijdvak waarop de
      subsidieverlening betrekking heeft een overzicht in van de subsidiabele kosten van de met betrekking tot dat jaar
      geplande activiteiten.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81a
  - number: 81a.2
    text: |-
      Ingeval de met betrekking tot een jaar geplande activiteiten niet of anders zijn opgenomen in het projectplan
      komen de met die activiteiten samenhangende kosten enkel voor subsidie in aanmerking als de afwijking van het
      projectplan naar het oordeel van de minister voldoende is gemotiveerd. In dat geval wijzigt de minister op aanvraag
      de beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81a
  - number: 81a.3
    text: |-
      Voor het eerste jaar van het tijdvak waarop de subsidieaanvraag betrekking heeft dient de aanvrager tegelijk
      met de subsidieaanvraag een overzicht in van de subsidiabele kosten van de met betrekking tot dat jaar geplande
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81a
  - number: 81b.1
    text: |-
      Voor het eerste jaar van het tijdvak waarop de subsidieverlening betrekking heeft wordt binnen 8 weken na de
      beschikking tot subsidieverlening een voorschot verleend, gebaseerd op 70% van de subsidiabele kosten die zijn
      opgenomen in het overzicht, bedoeld in [artikel 81a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel81a
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81b
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: 81a
        hoofdstuk: '8'
  - number: 81b.2
    text: |-
      Voor elk van de volgende jaren van het tijdvak waarop de subsidieverlening betrekking heeft wordt binnen 17 weken
      na aanvang van het kalenderjaar een voorschot verleend, gebaseerd op 80% van de subsidiabele kosten die zijn
      opgenomen in het overzicht, bedoeld in [artikel 81a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel81a
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81b
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: 81a
        hoofdstuk: '8'
  - number: 81b.3
    text: |-
      Het voorschot, bedoeld in het tweede lid, kan in voorkomend geval worden verhoogd of verlaagd met het verschil
      tussen de daadwerkelijke subsidiabele kosten in het voorafgaande jaar en het verleende voorschot voor dat jaar.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81b
  - number: 81c.1
    text: |-
      Met betrekking tot het tijdvak, bedoeld in [artikel 77, eerste lid][ref1], verstrekt de subsidieontvanger steeds
      na afloop van een kalenderjaar, met uitzondering van het laatste jaar van dat tijdvak, vóór 1 april van het
      daarop volgende jaar, de volgende gegevens over de in het desbetreffende afgelopen jaar gemaakte kosten, bedoeld
      in [artikel 79][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel79
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81c
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '77'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '79'
        hoofdstuk: '8'
  - number: 81c.1.a
    text: gegevens waaruit blijkt ten behoeve van welke activiteiten de kosten zijn gemaakt;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81c
  - number: 81c.1.b
    text: gegevens waaruit blijkt ten behoeve van wie de kosten zijn gemaakt;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81c
  - number: 81c.1.c
    text: gegevens waaruit blijkt door wie de kosten zijn gemaakt;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81c
  - number: 81c.1.d
    text: gegevens waaruit blijkt wanneer de kosten zijn gemaakt; en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81c
  - number: 81c.1.e
    text: gegevens waaruit blijkt tot welk resultaat de uitgevoerde activiteiten hebben geleid.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81c
  - number: 81c.2
    text: |-
      De verstrekking van gegevens, bedoeld in het eerste lid, geschiedt aan de directeur van de Dienst Regelingen met
      gebruikmaking van een daartoe bestemd formulier dat verkrijgbaar is bij die directeur.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81c
  - number: 81c.3
    text: |-
      Ingeval de kosten ten minste € 25.000,– bedragen overlegt de subsidieontvanger bij de verstrekking
      van gegevens, bedoeld in het eerste lid, een verklaring, overeenkomstig een door de minister vast
      te stellen model, van een accountant-administratieconsulent of registeraccountant als bedoeld in
      [artikel 2:393, eerste lid, van het Burgerlijk Wetboek][ref1] waaruit blijkt dat de kosten in overeenstemming zijn
      met [artikel 79][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel79
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81c
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '79'
        hoofdstuk: '8'
  - number: 81d.1
    text: |-
      Vóór 1 april van het jaar, volgend op het laatste jaar van het tijdvak waarop de subsidieverlening betrekking
      heeft, dient de subsidieontvanger een aanvraag tot subsidievaststelling over dat tijdvak in bij de directeur
      van de Dienst Regelingen met gebruikmaking van een daartoe bestemd aanvraagformulier dat verkrijgbaar is bij die
      directeur.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81d
  - number: 81d.2
    text: Artikel 81c is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81d
  - number: '82'
    text: |-
      Telkens wanneer met betrekking tot één of meer gronden, die in een gebied dat als beheersgebied overeenkomstig de
      Regeling beheersovereenkomsten en natuurontwikkeling is begrensd, onderscheidenlijk beheersgebied, zijn gelegen
      en ten aanzien waarvan beheerssubsidie is verleend voor de pakketten opgenomen in bijlage 1a van de Regeling
      beheersovereenkomsten en natuurontwikkeling, met uitzondering van de pakketten G1, B1 en G9, onderscheidenlijk de
      beheerspakketten opgenomen in de [bijlagen 6 tot en met 11][ref1], [15][ref2], en [24 tot en met 27][ref3] van de
      onderhavige regeling, aan het bureau beheer landbouwgronden een recht van eigendom of een daarvan afgeleid beperkt
      recht wordt aangeboden, is het bureau beheer landbouwgronden gehouden het hem aangeboden recht te verwerven, indien
      de minister aannemelijk acht dat met betrekking tot zodanige grond:


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
  - number: 82.a
    text: vervreemding of in gebruik afstaan, of
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel82
  - number: 82.b
    text: vestiging van een ander beperkt recht ten gunste van één of meer personen niet kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel82
  - number: '83.1'
    text: |-
      In gevallen als bedoeld in [artikel 82][ref1] wordt de door het bureau beheer landbouwgronden te betalen grondprijs
      bepaald op basis van de daartoe in opdracht van het bureau beheer landbouwgronden getaxeerde waarde van de
      betrokken grond in het economische verkeer bij agrarische bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel82
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '82'
        hoofdstuk: '9'
  - number: '83.2'
    text: 'Bij de taxatie wordt in voorkomende gevallen geen rekening gehouden met de omstandigheid dat:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel83
  - number: 83.2.a
    text: op de betrokken grond een aangepaste agrarische bedrijfsvoering uit hoofde van de subsidieverlening plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel83
  - number: 83.2.b
    text: dat de betrokken grond is gelegen in een beheersgebied.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel83
  - number: '84.1'
    text: |-
      Indien de uitkomst van de in opdracht van het bureau beheer landbouwgronden verrichte taxatie voor de andere bij de
      subsidieverlening betrokken zijnde partij niet aanvaardbaar is, vindt in opdracht van die partij nadere taxatie van
      de betrokken grond plaats door een driemanschap waarvan:
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel84
  - number: 84.1.a
    text: een lid wordt aangewezen door die partij;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel84
  - number: 84.1.b
    text: een lid wordt aangewezen door het bureau beheer landbouwgronden;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel84
  - number: 84.1.c
    text: een lid wordt aangewezen door de onder a en b bedoelde personen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel84
  - number: '84.2'
    text: |-
      Het driemanschap verricht de nadere taxatie met inachtneming van het bepaalde in [artikel 83, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel83
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '83'
        hoofdstuk: '9'
  - number: '84.3'
    text: |-
      Het driemanschap beslist met meerderheid van stemmen. De beslissing van het driemanschap heeft kracht van bindend
      advies ten aanzien van de te betalen grondprijs.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel84
  - number: '84.4'
    text: De kosten van de nadere taxatie, bedoeld in het eerste lid, worden gelijkelijk verdeeld tussen betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel84
  - number: 84a
    text: |-
      De minister kan bij een in de Staatscourant bekend te maken besluit bepalen dat vanaf een door hem vast te stellen
      tijdstip de gehoudenheid van het bureau beheer landbouwgronden, bedoeld in [artikel 82][ref1], wordt opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel82
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '82'
        hoofdstuk: '9'
  - number: '85.1'
    text: |-
      Een aanvraag tot wijziging van een beschikking tot subsidieverlening die leidt tot vergroting van het areaal van
      de aanvrager ten behoeve waarvan subsidie wordt verstrekt wordt slechts gehonoreerd indien de extra oppervlakte
      aanmerkelijk kleiner is dan de oorspronkelijke oppervlakte of niet meer dan 2 hectare bedraagt.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85
  - number: '85.2'
    text: |-
      Een aanvraag tot wijziging van een beschikking tot subsidieverlening die leidt tot verkleining van het areaal
      van de aanvrager ten behoeve waarvan subsidie wordt verstrekt wordt slechts gehonoreerd indien de verkleining het
      gevolg is van de uitvoering van een werk van algemene nutte.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85
  - number: '85.3'
    text: Een aanvraag als bedoeld in het eerste lid kan slechts eenmaal per jaar worden gedaan.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85
  - number: '85.4'
    text: |-
      In geval van een wijziging uit hoofde van het eerste of tweede lid wordt de subsidie naar evenredigheid
      verleend en vastgesteld voor het resterende gedeelte van het tijdvak of aaneengesloten tijdvakken, bedoeld in
      [artikel 26][ref1], waarvoor subsidie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel26
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '85.5'
    text: |-
      De [artikelen 1 tot en met 9, eerste lid][ref1], [9a tot en met 9d][ref2] en [18 tot en met 20][ref3] zijn ten
      aanzien van een aanvraag als bedoeld in het eerste of tweede lid van overeenkomstige toepassing, met dien verstande
      dat op een aanvraag als bedoeld in het tweede lid het bepaalde in [artikel 6, vierde en vijfde lid][ref4], niet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0011000#Artikel6
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: 9a
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0011000
        artikel: '18'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0011000
        artikel: '6'
        hoofdstuk: '1'
  - number: '85.6'
    text: |-
      Een aanvraag als bedoeld in het eerste lid wordt afgewezen indin de subsidie door toewijzing van dat verzoek met
      minder dan € 50,– per jaar zou toenemen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85
  - number: 85a.1
    text: |-
      Een aanvraag als bedoeld in [artikel 85, eerste lid][ref1], die wordt ingediend door een aanvrager als bedoeld in
      [artikel 4][ref2] of [5][ref3], tezamen met een verzoek van een beheerder tot intrekking van een aan hem verleende
      subsidie voor het terrein waarop die aanvraag betrekking heeft, wordt niet gehonoreerd indien die aanvraag ertoe
      zou leiden dat minder dan vijf jaren subsidie voor het desbetreffende terrein kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel5
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '85'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '4'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0011000
        artikel: '5'
        hoofdstuk: '1'
  - number: 85a.2
    text: |-
      Ingeval van intrekking uit hoofde van het eerste lid wordt de subsidie naar evenredigheid verleend en vastgesteld
      voor het verstreken gedeelte van het tijdvak of aaneengesloten tijdvakken, bedoeld in [artikel 26][ref1], waarvoor
      subsidie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel26
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 85b.1
    text: |-
      Ingeval subsidie is verleend ten behoeve van een terrein waarop het beheerspakket, opgenomen in de
      [bijlagen 19 tot en met 22, onderdeel 4][ref1], in stand wordt gehouden kan de subsidieverlening op verzoek van de
      subsidieontvanger voor een gedeelte van het terrein:


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 85b.1.a
    text: |-
      worden gewijzigd in een subsidieverlening voor het instandhouden van het beheerspakket, opgenomen in
      de [bijlagen 19 tot en met 22][ref1], waarbij het terrein wordt beheerd op een wijze als bedoeld in
      [bijlage 16][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
  - number: 85b.1.b
    text: |-
      worden aangevuld met een subsidieverlening voor het instandhouden van het beheerspakket, opgenomen in
      [bijlage 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 85b.2
    text: 'De oppervlakte waarop de aanvulling, bedoeld in het eerste lid, onderdeel b, betrekking heeft is ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85b
  - number: 85b.2.a
    text: één vijfde van het totaal van
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85b
  - number: 85b.2.a.1°
    text: de oppervlakte waarop de wijziging, bedoeld in het eerste lid, aanhef en onderdeel a, betrekking heeft, en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85b
  - number: 85b.2.a.2°
    text: |-
      de oppervlakte waarvoor subsidie is verleend voor het instandhouden van het beheerspakket, opgenomen in
      [bijlage 16][ref1] of het beheerspakket, opgenomen in de [bijlagen 19 tot en met 22][ref2], waarbij het terrein
      wordt beheerd op een wijze als bedoeld in [bijlage 16][ref3], verminderd met


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
  - number: 85b.2.b
    text: |-
      de oppervlakte waarvoor subsidie is verleend voor het instandhouden van het beheerspakket, opgenomen in
      [bijlage 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 85b.3
    text: |-
      [Artikel 85, derde tot en met zesde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel85
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '85'
        hoofdstuk: '10'
  - number: '86'
    text: |-
      In geval subsidie is verleend ten behoeve van een terrein waarvan het recht tot gebruik en beheer berust bij de
      subsidieontvanger, en dat recht gaat over op een derde gedurende de periode waarover de desbetreffende subsidie is
      verleend, kan de desbetreffende subsidieverlening worden gewijzigd in een subsidieverlening aan die derde indien
      deze, uiterlijk drie maanden na de datum waarop het recht tot gebruik en beheer is overgegaan, bij wege van een aan
      de directeur de Dienst Regelingen gericht schriftelijk stuk:
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel86
  - number: 86.a
    text: |-
      verklaart te treden in de aan de subsidieverlening verbonden rechten en plichten, vanaf de datum met ingang waarvan
      de wijziging uit hoofde van dit lid van kracht zal zijn, en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel86
  - number: 86.b
    text: aangeeft of hij als ondernemer moet worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel86
  - number: '87.1'
    text: |-
      Wanneer een terrein waarvoor beheerssubsidie inclusief bijdrage voor probleemgebieden wordt verleend op enig
      moment geen deel meer uitmaakt van een probleemgebied wordt de subsidieverlening verlaagd met de toeslag
      voor probleemgebieden met ingang van de dag volgend op de laatste dag dat het terrein deel uitmaakte van het
      probleemgebied.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel87
  - number: '87.2'
    text: |-
      Ingeval van verlaging uit hoofde van het eerste lid, wordt de subsidie over het tijdvak waarin het terrein geen
      deel meer uitmaakt van het probleemgebied vastgesteld op het bedrag naar evenredigheid ten opzichte van de subsidie
      zoals die op grond van de subsidieverlening zou kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel87
  - number: '88.1'
    text: |-
      In geval subsidie is verleend met betrekking tot een terrein waarvan het gebruiksrecht berust bij een natuurlijk
      persoon die overlijdt tijdens de periode waarover subsidie is verleend, wordt de desbetreffende subsidieverlening
      voor dat terrein ingetrokken met ingang van de dag, volgend op de dag van overlijden, op voorwaarde dat de
      erfgenamen uiterlijk 30 dagen na het overlijden om deze intrekking verzoeken bij wege van een aan de directeur van
      de Dienst Regelingen gericht schriftelijk verzoek.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel88
  - number: '88.2'
    text: |-
      Ingeval van intrekking uit hoofde van het eerste lid, wordt de subsidie over het tijdvak waarin het overlijden
      plaatsvond ambtshalve vastgesteld op het bedrag naar evenredigheid ten opzichte van de subsidie zoals die op grond
      van de subsidieverlening ten hoogste zou kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel88
  - number: '89.1'
    text: |-
      In geval subsidie is verleend met betrekking tot een terrein dat deel uitmaakt van een gebied waar landinrichting
      uit kracht van de [Landinrichtingswet][ref1] geschiedt en het voldoen aan de desbetreffende subsidieverlening
      verbonden verplichtingen na vaststelling van het landinrichtingsplan niet meer mogelijk is, wordt de
      desbetreffende subsidieverlening ingetrokken met ingang van de dag, waarop in zodanig gebied de kavelovergang
      plaatsvindt ingevolge de in het plan van toedeling opgenomen bepalingen omtrent de inbezitneming, bedoeld in
      [artikel 196, tweede lid, onderdeel e, van de Landinrichtingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003793
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel196
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003793
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '196'
  - number: '89.2'
    text: |-
      [Artikel 88, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel88
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '88'
        hoofdstuk: '10'
  - number: 89a.1
    text: |-
      Indien subsidie is verleend met betrekking tot een terrein dat is verworven door Staatsbosbeheer, het bureau
      beheer landbouwgronden of een instelling als bedoeld in artikel 3, eerste en tweede lid, van de Regeling subsidies
      particuliere terreinbeherende natuurbeschermingsorganisaties en het de subsidieontvanger als gevolg van de
      overdracht aan een van de bedoelde organisaties niet meer mogelijk is te voldoen aan de verplichtingen verbonden
      aan de subsidieverlening, wordt de subsidieverlening ingetrokken met ingang van de dag, waarop de overdracht van
      het terrein heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel89a
  - number: 89a.2
    text: |-
      In geval van intrekking op grond van het eerste lid, wordt de subsidie over het tijdvak waarin de verwerving
      plaatsvond ambtshalve vastgesteld op een bedrag evenredig met het deel van het tijdvak dat voor de overdracht is
      verstreken.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel89a
  - number: '90.1'
    text: |-
      In geval subsidie is verleend met betrekking tot een terrein dat wordt onteigend tijdens de periode waarover
      subsidie is verleend, wordt de desbetreffende subsidieverlening ingetrokken met ingang van de dag waarop het
      besluit tot onteigening van de betrokken grond onherroepelijk vaststaat.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel90
  - number: '90.2'
    text: |-
      In geval van intrekking uit hoofde van het eerste lid, wordt de subsidie over het tijdvak waarin het besluit
      tot onteigening onherroepelijk werd ambtshalve vastgesteld op het bedrag naar evenredigheid ten opzichte van de
      beheerssubsidie, landschapssubsidie of subsidie natuurlijke handicaps zoals die op grond van de subsidieverlening
      ten hoogste zou kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel90
  - number: '90.3'
    text: |-
      [Artikel 88, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel88
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '88'
        hoofdstuk: '10'
  - number: 90a
    text: |-
      Een verleende subsidie wordt voor de duur van één jaar, ingetrokken indien de subsidieaanvrager door ernstige
      nalatigheid of opzettelijk een onjuiste aanvraag tot subsidieverlening of -vaststelling heeft ingediend of
      anderszins onjuiste gegevens heeft verstrekt ter verkrijging van een subsidie op grond van een andere regeling
      die gebaseerd is op hoofdstuk IX van titel II van de [verordening (EG) nr. 1257/99](31999R1257) van de Raad van
      de Europese Unie van 17 mei 1999 betreffende steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en
      Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en instelling van een aantal verordeningen (PbEG L 160).
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel90a
  - number: 90b
    text: |-
      De vastgestelde subsidie wordt geheel of gedeeltelijk ingetrokken indien de subsidieontvanger door ernstige
      nalatigheid of opzettelijk een onjuiste aanvraag tot subsidieverlening of -vaststelling heeft ingediend of
      anderszins foute gegevens heeft verstrekt ter verkrijging van een subsidie op grond van een andere regeling die
      gebaseerd is op hoofdstuk IX van titel II van de [verordening (EG) nr. 1257/99](31999R1257) van de Raad van de
      Europese Unie van 17 mei 1999 betreffende steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en
      Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en instelling van een aantal verordeningen (PbEG L 160).
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel90b
  - number: '91'
    text: |-
      Onverschuldigd betaalde subsidies en voorschotten worden teruggevorderd, vermeerderd met de wettelijke rente tot de
      datum van ontvangst van de teruggevorderde bedragen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel91
  - number: '92'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze regeling bepaalde zijn belast de ambtenaren van de
      Dienst landelijk gebied van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel92
  - number: 92a
    text: |-
      De subsidieaanvrager is verplicht alle op de subsidie betrekking hebbende documenten, als bedoeld in artikel 1,
      van [verordening (EG) nr. 4045/89](31989R4045) van de Raad van 21 december 1989 inzake de door de lidstaten uit
      te voeren controles op de verrichtingen in het kader van de financieringsregeling van de afdeling Garantie van
      het Europese Oriëntatie- en Garantiefonds voor de landbouw en houdende intrekking van de [richtlijn 77/435/EEG]
      (31977L0435) (Pb L388/18), voorzover deze documenten voor de subsidievaststelling van belang zijn, te bewaren
      gedurende ten minste 3 jaren na de subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel92a
  - number: '93.1'
    text: De Regeling beheersovereenkomsten en natuurontwikkeling wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel93
  - number: '93.2'
    text: |-
      Op beheersovereenkomsten als bedoeld in artikel 18 van de Regeling beheersovereenkomsten en natuurontwikkeling,
      blijft eerstbedoelde regeling van toepassing.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel93
  - number: '93.3'
    text: 'Op beheersovereenkomsten die zijn gesloten op basis van de beheersplannen die zijn vastgesteld op grond van:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel93
  - number: 93.3.a
    text: de Beschikking beheersovereenkomsten 1983;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel93
  - number: 93.3.b
    text: de Regeling beheersovereenkomsten 1988, en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel93
  - number: 93.3.c
    text: de Regeling beheersovereenkomsten 1993,
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel93
  - number: 100a.1
    text: |-
      De [Regeling organisatiekosten samenwerkingsverbanden][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011017
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0011017
  - number: 100a.2
    text: |-
      Op beschikkingen tot subsidieverlening die zijn afgegeven op basis van de
      [Regeling organisatiekosten samenwerkingsverbanden][ref1] blijft die regeling van toepassing tot het tijdstip
      waarop deze van rechtswege eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0011017
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0011017
  - number: 101a.1
    text: |-
      Beheerders die vóór 25 oktober 2003 een beschikking tot subsidieverlening hebben ontvangen met betrekking
      tot een landschapspakket als bedoeld in de [bijlagen 32 tot en met 36][ref1] of [39][ref2], zoals die luidden
      tot 25 oktober 2003, waarin een bedekking van minder dan 90% was opgenomen, zijn in zoverre in afwijking van
      [artikel 64, onderdeel a][ref3], slechts verplicht tot het in stand houden van het landschapspakket, genoemd in
      [bijlage 32][ref4], met het in de subsidieverlening vastgestelde lagere bedekkingspercentage tegen de daarbij
      behorende lagere vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel64
      [ref4]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel101a
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
        artikel: '64'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0011000
  - number: 101a.2
    text: |-
      Bij de berekening op grond van het eerste lid wordt voor beheerders die een beheersbijdrage ontvangen voor een
      landschapspakket opgenomen in [bijlage 39][ref1], zoals die luidde tot 25 oktober 2003 een omrekenfactor van 2528
      gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel101a
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 101b
    text: |-
      Het beheerspakket: Faunarand opgenomen in bijlage 23, zoals die luidde tot 25 oktober 2003, blijft voor subsidies
      die zijn aangevraagd vóór 25 oktober 2003 onverminderd van kracht tot het eind van het tijdvak waarvoor de
      desbetreffende subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel101b
  - number: 101c
    text: |-
      Op een aanvraag voor subsidie op grond van hoofdstuk 7, zoals dat luidde tot 1 oktober 2004, die is ingediend vóór
      die datum, blijven dat hoofdstuk en bijlage 31, zoals die luidde tot 1 oktober 2004, van toepassing, indien en voor
      zover het terrein ten behoeve waarvan de subsidie is aangevraagd is gelegen in een probleemgebied.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel101c
  - number: 101d.1
    text: |-
      Op een aanvraag voor subsidie op grond van [artikel 33][ref1] zoals dat luidt tot 1 januari 2005 die is ingediend
      vóór 1 oktober 2004 blijft [dat artikel][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel33
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel101d
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 101d.2
    text: |-
      Op een aanvraag voor subsidie op grond van [artikel 33][ref1] die is ingediend vóór 1 november 2005 blijft
      [dat artikel][ref2] zoals dat luidt tot 1 november 2005 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel33
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel101d
