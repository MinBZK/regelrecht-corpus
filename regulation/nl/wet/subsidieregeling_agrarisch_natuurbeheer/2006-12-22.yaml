  - number: '46'
    text: |-
      1 Inrichtingssubsidie wordt uitsluitend verstrekt, voorzover deze betrekking heeft op het, door middel van
      eenmalige maatregelen, rechtstreeks en direct wijzigen van de fysieke condities of kenmerken van terreinen,
      zonder welke wijziging ontwikkeling, onderscheidenlijk instandhouding, van het beheerspakket, onderscheidenlijk
      landschapspakket, ten behoeve waarvan beheerssubsidie, onderscheidenlijk landschapssubsidie, is verleend niet
      mogelijk is.

      2 Onverminderd het eerste lid wordt inrichtingssubsidie verstrekt overeenkomstig een inrichtingsplan waarin in
      ieder geval zijn opgenomen:

      a. de te treffen inrichtingsmaatregelen;

      b. de oppervlakte waarop of de lengte waarin die maatregelen zullen worden uitgevoerd;

      c. de met de maatregelen beoogde situatie van het terrein;

      d. een gespecificeerde begroting;

      e. een topografische kaart met ten hoogste een schaal van 1 : 10.000 waarop is aangegeven waar de onderscheiden
      maatregelen zullen worden getroffen;

      f. een beschrijving van de uitgangssituatie;

      g. de motivering voor het treffen van de maatregelen en

      h. een tijdsplanning voor de uit te voeren werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel46
  - number: '48'
    text: |-
      Tot de subsidiabele kosten behoren de kosten, inclusief BTW, voorzover verrekening niet mogelijk is, verband
      houdende met:

      a. het opstellen door derden van een inrichtingsplan;

      b. bebossing van een terrein, voorzover ten behoeve van dat terrein beheerssubsidie is verleend, gericht
      op de ontwikkeling en daaropvolgende instandhouding van een beheerspakket dat is vermeld in een van de
      [bijlagen 29][ref1] en [30][ref2];

      c. maatregelen voor herstel of aanleg van landschappelijke elementen;

      d. maatregelen, gericht op wijziging van de waterhuishouding;

      e. grondverzet;

      f. het plaatsen van een raster;

      g. afvoer van grond, of

      h. overige maatregelen voorzover noodzakelijk in verband met de desbetreffende inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
  - number: '49'
    text: |-
      Niet tot de subsidiabele kosten behoren in ieder geval de kosten, verband houdende met:

      a. de verwijdering van bodemverontreiniging of afval;

      b. de bouw van opstallen;

      c. achterstallig onderhoud aan landschappelijke elementen;

      d. de aanschaf van machines, of

      e. de aanschaf van materialen, anders dan ten behoeve van het treffen van maatregelen als bedoeld in
      [artikel 48][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel48
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel49
