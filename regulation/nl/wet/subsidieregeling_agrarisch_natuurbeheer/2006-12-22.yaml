  - number: 20b
    text: |-
      Beheerssubsidie wordt niet verstrekt ten aanzien van terreinen, gelegen in een
      natuurgebiedsplan als bedoeld in de [Subsidieregeling natuurbeheer 2000][ref1], die
      Staatsbosbeheer, een particuliere terreinbeherende natuurbeschermingsorganisatie als bedoeld in
      [artikel 3 van de Regeling subsidies particuliere terreinbeherende natuurbeschermingsorganisaties][ref2],
      een ontvanger van subsidie functieverandering als bedoeld in
      [artikel 40 van de Subsidieregeling natuurbeheer 2000][ref3] danwel een rechtsopvolger daarvan of een ontvanger
      van beheerssubsidie als bedoeld in artikel 9 van de Tijdelijke regeling particulier natuurbeheer danwel een
      rechtsopvolger daarvan in de hoedanigheid van eigenaar, dan wel zakelijk gerechtigde, na 1 december 1977 in gebruik
      heeft afgestaan aan een ondernemer, tenzij dit afstaan in gebruik heeft geleid tot de ononderbroken voortzetting
      van het op 1 december 1977 bestaand gebruik door:

        - de ondernemer;
        - zijn echtgenoot;
        - een pleegkind of
        - één of meer bloed- en aanverwanten in de rechte lijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0006085#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010999#Artikel40
