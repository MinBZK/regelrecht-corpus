  - number: 1.1.u
    text: |-
      beheerseenheid: oppervlakte-eenheid binnen een terrein waarop een beheers- of landschapspakket ontwikkeld of in
      stand gehouden wordt;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel1
  - number: 1.1.v
    text: |-
      GVE: grootvee-eenheden, berekend door omrekening aan de hand van de tabel van Verordening (EEG) nr. 2078/92,
      betreffende landbouwproductiemethoden die verenigbaar zijn met de eisen inzake milieubescherming, en betreffende
      natuurbeheer (Pb EG 1992, L 215);
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel1
  - number: 1.1.w
    text: |-
      verdunningsfactor: quotiënt van de oppervlakte van de grond verkregen door hemelsbreed een lijn te trekken om de
      buitenste hoeken van de buitenste terreinen waarvoor subsidie wordt aangevraagd en de totale oppervlakte van de in
      dat gebied gelegen terreinen waarvoor subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van deze regeling wordt onder ‘terrein’ mede verstaan: samenstel van terreinen dat door een
      beheerder als een geheel wordt beheerd.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel1
  - number: '2'
    text: |-
      De minister kan aan beheerders en aan anderen dan beheerders als bedoeld in [artikel 4][ref1] en [5][ref2] op
      landbouwgronden ter bevordering van de toepassing van landbouwproductiemethoden die verenigbaar zijn met de eisen
      inzake milieubescherming en natuurbeheer, ter bevordering van de duurzame instandhouding van landschappelijke
      elementen, alsmede ter bevordering van de bebossing van landbouwgronden, op aanvraag subsidie verstrekken ten
      behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel5
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '5'
        hoofdstuk: '1'
  - number: 2.a
    text: |-
      de instandhouding en ontwikkeling van de beheerspakketten, opgenomen in de [bijlagen 6 tot en met 30][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 2.b
    text: |-
      de instandhouding van de landschapspakketten, opgenomen in de [bijlagen 32 tot en met 46][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 2.c
    text: |-
      het door middel van maatregelen met een eenmalig karakter rechtstreeks en direct wijzigen van de fysieke
      condities of kenmerken van gronden, zonder welke wijziging de daarop volgende instandhouding van beheerspakketten,
      onderscheidenlijk landschappelijke elementen, niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel2
  - number: 2a
    text: |-
      De minister kan aan de in artikel 4 bedoelde anderen dan beheerders ter bevordering van collectief natuurbeheer
      en bekwaamheid in natuurbeheer op aanvraag subsidie verstrekken ten behoeve van de organisatie van activiteiten
      gericht op:
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel2a
  - number: 2a.a
    text: kennisbevordering, professionalisering en ecologische sturing;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel2a
  - number: 2a.b
    text: draagvlak, promotie en samenwerking;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel2a
  - number: 2a.c
    text: werving, aanvraagbegeleiding en administratie;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel2a
  - number: 2a.d
    text: kwaliteitsborging, monitoring en rapportage.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel2a
  - number: '3'
    text: |-
      Indien er naast een beheersbijdrage of inrichtingssubsidie op grond van deze regeling uit andere hoofde van
      overheidswege een subsidie is of wordt verstrekt voor de in het kader van deze regeling gemaakte kosten, waaronder
      mede wordt begrepen vergoeding van inkomstenderving, en hierdoor het totaal van de overheidsbijdragen meer bedraagt
      dan de desbetreffende beheersbijdrage, dan wel, voorzover het inrichtingssubsidie betreft, meer bedraagt dan 95%
      van de werkelijke kosten, wordt de subsidie op grond van deze regeling zoveel lager vastgesteld dat het totaal van
      de overheidsbijdragen die beheersbijdrage, onderscheidenlijk die 95%, niet overstijgt.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel3
  - number: '4.1'
    text: |-
      Subsidie aan anderen dan beheerders kan worden verstrekt indien op het tijdstip van indiening van de
      subsidieaanvraag:
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel4
  - number: 4.1.a
    text: |-
      tussen de beheerder en de subsidieaanvrager een schriftelijke overeenkomst tot stand is gekomen, bij welke
      overeenkomst:
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel4
  - number: 4.1.a.1
    text: |-
      de subsidieaanvrager het recht op uitbetaling van subsidies en voorschotten uit hoofde van deze regeling,
      betrekking hebbend op het desbetreffende terrein of water, bij voorbaat aan de beheerder overdraagt, en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel4
  - number: 4.1.a.2
    text: |-
      de beheerder zich bij voorbaat verbindt tot de nakoming van de verplichtingen waartoe de subsidieaanvrager uit
      hoofde van deze regeling met betrekking tot het desbetreffende terrein gehouden is, zolang de beheerder beschikt
      over het recht tot gebruik en beheer van het desbetreffende terrein, alsmede zich verbindt, bij overdracht van
      het desbetreffende gebruiksrecht aan een ander dan het bureau beheer landbouwgronden, van de verkrijger daarvan te
      bedingen dat deze, vanaf het moment van verkrijging, de in deze volzin bedoelde verplichtingen zal nakomen en zulks
      ook van zijn rechtsopvolger zal bedingen, en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel4
  - number: 4.1.b
    text: |-
      de beheerder jegens de Staat der Nederlanden schriftelijk heeft verklaard borg te staan voor de terugbetaling van
      onverschuldigd betaalde subsidies en voorschotten.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel4
  - number: '4.2'
    text: |-
      Bij het aangaan van een overeenkomst als bedoeld in het eerste lid, onderdeel a, en een afgifte van een
      schriftelijke verklaring als bedoeld in het eerste lid, onderdeel b, wordt gebruik gemaakt van het model, opgenomen
      in [bijlage 49][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: '5.1'
    text: |-
      Subsidie aan anderen dan beheerders kan worden verstrekt indien: - die subsidieaanvrager een rechtspersoon met
      volledige rechtsbevoegdheid is;
        - die rechtspersoon hoofdzakelijk of mede ten doel heeft haar leden of aangeslotenen te ondersteunen bij een
      bedrijfsvoering die bevorderlijk is voor natuur en milieu en
        - de leden of aangeslotenen, bedoeld in onderdeel b, beheerder zijn, voorzover zij worden ondersteund.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel5
  - number: '5.2'
    text: |-
      Subsidie aan aanvragers als bedoeld in het eerste lid, kan voorts slechts worden verstrekt indien bij de
      subsidieaanvraag door de rechtspersoon wordt overgelegd:
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel5
  - number: 5.2.a
    text: 'een plan waaruit blijkt:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel5
  - number: 5.2.a.i
    text: op welke wijze de subsidie door de rechtspersoon zal worden besteed;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel5
  - number: 5.2.a.ii
    text: |-
      op welke wijze de besteding van de subsidie ter beschikking komt van de in het eerste lid, onderdeel b, bedoelde
      leden of aangeslotenen;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel5
  - number: 5.2.a.iii
    text: in hoeverre de besteding van de subsidie ter beschikking komt van ondernemers;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel5
  - number: 5.2.a.iv
    text: op welke wijze de nakoming van de subsidieverplichtingen door de rechtspersoon wordt gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel5
  - number: 5.2.b
    text: |-
      een reglement waaruit blijkt dat de rechtspersoon jegens leden of aangeslotenen de nakoming van verplichtingen uit
      hoofde van ter beschikking gestelde gelden kan afdwingen onderscheidenlijk niet-nakoming daarvan kan sanctioneren.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel5
  - number: '5.3'
    text: |-
      Om voor subsidie in aanmerking te kunnen komen, behoeven de statuten van de subsidieaanvrager, bedoeld in het
      eerste lid, alsmede het plan, bedoeld in het tweede lid, onderdeel a, en het reglement, bedoeld in het tweede lid,
      onderdeel b, de goedkeuring van de minister.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel5
  - number: '6.1'
    text: |-
      De minister stelt voor ieder begrotingsjaar een subsidieplafond vast voor de te verstrekken subsidies, bedoeld
      in de [artikelen 2][ref1] en [2a][ref2]. Hij kan voor de in die artikelen onderscheiden subsidies, per provincie,
      alsmede voor het Groene Hart en Waterland, voor door hem op grond van [artikel 17a][ref3] begrensde gebieden, voor
      de verschillende beheers- of landschapspakketten of voor verschillende categorieën subsidieaanvragers verschillende
      subsidieplafonds vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel17a
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: 2a
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0011000
        artikel: 17a
        hoofdstuk: '2'
  - number: '6.2'
    text: Van de vaststelling van subsidieplafonds geeft de minister kennis in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel6
  - number: '6.3'
    text: |-
      De minister verdeelt de beschikbare bedragen, naar de datum van ontvangst van de subsidieaanvragen. Bij
      gelijktijdige datum van ontvangst van de subsidieaanvragen wordt de volgorde van behandeling bepaald door loting.
      Als datum van ontvangst wordt aangemerkt de datum waarop de aanvraag volledig is ontvangen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel6
  - number: '6.4'
    text: |-
      De minister kan voor de verschillende subsidies en voor de verschillende beheers- of landschapspakketten of voor
      verschillende categorieën subsidieaanvragers verschillende aanvraagperioden instellen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel6
  - number: '6.5'
    text: |-
      Aanvragen worden alleen voor die subsidies en beheers- of landschapspakketten of categorieën subsidieaanvragers in
      behandeling genomen, waarvoor een aanvraagperiode als bedoeld in het vierde lid is ingesteld.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel6
  - number: '6.6'
    text: Voor aanvragen wordt gebruik gemaakt van een daartoe vastgesteld aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel6
  - number: '6.7'
    text: |-
      Aanvragen tot subsidieverlening worden beoordeeld aan de hand van beheersgebiedsplannen zoals deze door
      gedeputeerde staten van een provincie zijn vastgesteld en van kracht zijn uiterlijk 25 dagen voor openstelling van
      de desbetreffende aanvraagperiode.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel6
  - number: '7.1'
    text: |-
      De beheersbijdragen van de beheerspakketten en landschapspakketten opgenomen in de [bijlagen 6 tot en met 46][ref1]
      en het maximumbedrag aan inrichtingssubsidie worden jaarlijks voor 1 maart van het jaar waarop de bijdragen
      betrekking hebben in voorkomend geval met terugwerkende kracht tot 1 januari van dat jaar door de minister
      gecorrigeerd voor de werkelijke loon- en prijsontwikkeling, gebaseerd op de grondslagen, bedoeld in
      [artikel 8][ref2], naar de situatie in het voorafgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel8
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '8'
        hoofdstuk: '1'
  - number: '7.2'
    text: |-
      Van de vaststelling van de overeenkomstig het eerste lid gecorrigeerde beheersbijdragen en maximumbedrag aan
      inrichtingssubsidie geeft de minister kennis in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel7
  - number: '8'
    text: |-
      Bij het vaststellen van de beheersbijdragen van een beheerspakket als bedoeld in [artikel 7][ref1] wordt rekening
      gehouden met de volgende grondslagen:


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel7
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '7'
        hoofdstuk: '1'
  - number: 8.a
    text: de productiederving uitgedrukt in kilogram voedereenheden melk;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel8
  - number: 8.b
    text: de toename van de arbeidsaanspraken, en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel8
  - number: 8.c
    text: de wijziging van de exploitatie-aanspraken, als gevolg van de uitvoering van agrarisch natuurbeheer.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel8
  - number: '9.1'
    text: |-
      Subsidie wordt niet verstrekt aan beheerders ter voldoening aan verplichtingen die op grond van enig wettelijk
      voorschrift zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel9
  - number: '9.2'
    text: Subsidie wordt niet verstrekt indien de subsidie minder dan € 170,– per jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel9
  - number: 9a
    text: |-
      Voorzover de regeling bemesting toestaat, geschiedt de aanwending van kunstmest op grond van een bemestingsadvies
      of bemestingsplan.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel9a
  - number: 9b
    text: |-
      De subsidie wordt voor de duur van een jaar niet verstrekt, indien de subsidieaanvrager door ernstige nalatigheid
      of opzettelijk een onjuiste aanvraag heeft ingediend of anderszins onjuiste gegevens heeft verstrekt ter
      verkrijging van een subsidie op grond van een andere regeling die gebaseerd is op hoofdstuk IX van titel II van de
      [verordening (EG) nr. 1257/99](31999R1257) van de Raad van de Europese Unie van 17 mei 1999 betreffende steun voor
      plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot wijziging
      en instelling van een aantal verordeningen (PbEG L 160), of indien een verleende subsidie geheel of gedeeltelijk
      is ingetrokken ingevolge [artikel 90a][ref1] of een vastgestelde subsidie geheel of gedeeltelijk is ingetrokken
      ingevolge [artikel 90b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel90a
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel90b
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: 90a
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: 90b
        hoofdstuk: '10'
  - number: 9c
    text: |-
      Indien de aanvrager opzettelijk een onjuiste aanvraag tot subsidieverlening of vaststelling heeft ingediend of
      anderszins onjuiste gegevens heeft verstrekt ter verkrijging van een subsidie op grond van een andere regeling
      die gebaseerd is op hoofdstuk IX van titel II van de [verordening (EG) nr. 1257/99](31999R1257) van de Raad van
      de Europese Unie van 17 mei 1999 betreffende steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en
      Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en instelling van een aantal verordeningen (PbEG L 160), of
      indien ingeval van opzet een verleende of vastgestelde subsidie geheel of gedeeltelijk is ingetrokken op grond van
      [artikel 90a][ref1] of [90b][ref2], wordt tevens geen subsidie verleend in het daarop volgend jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel90a
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel90b
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: 90a
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: 90b
        hoofdstuk: '10'
  - number: 9d
    text: |-
      Indien de aanvrager in een jaar opzettelijk een onjuiste aanvraag tot subsidieverlening op grond van deze regeling
      heeft ingediend, wordt geen subsidie verstrekt voor het daaropvolgend jaar.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel9d
  - number: '10.1'
    text: |-
      Ten behoeve van de uitvoering van deze regeling worden beheersgebieden begrensd met de vaststelling van
      beheersgebiedsplannen, die in ieder geval bestaan uit:
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel10
  - number: 10.1.a
    text: |-
      een kaart met een topografische ondergrond op een schaal 1 : 25.000, waarin de grenzen van het beheersgebied zijn
      opgenomen;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel10
  - number: 10.1.b
    text: een omschrijving van de in het beheersgebied nagestreefde doelstellingen op het gebied van agrarisch natuurbeheer;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel10
  - number: 10.1.c
    text: de in het betrokken beheersgebied te ontwikkelen of in stand te houden beheerspakketten;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel10
  - number: 10.1.d
    text: |-
      een vaststelling van een totaal van de quota voor de onderscheiden beheerspakketten indien het totaal aantal
      hectares van de te ontwikkelen of in stand te houden beheerspakketten kleiner is dan de oppervlakte van het
      begrensde beheersgebied;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel10
  - number: 10.1.e
    text: de in het betrokken beheersgebied aan te leggen, te herstellen of in stand te houden landschapspakketten;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel10
  - number: 10.1.f
    text: een aanduiding of het beheersgebied bestaat uit veen-, klei- of zandgebied.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel10
  - number: '10.2'
    text: |-
      Voor toepassing van het eerste lid, onderdeel f, wordt onder veengebied verstaan: dat gebied dat voor ten
      minste 50% bestaat uit grond waar in de bovenste 80 centimeter meer dan de helft van de dikte bestaat uit moerig
      materiaal.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel10
  - number: '10.3'
    text: |-
      Voor toepassing van het eerste lid, onderdeel f, wordt onder zandgebied verstaan: gebied dat voor ten minste 50%
      bestaat uit minerale grond waarvan het niet-moerige gedeelte tussen 0 en 80 centimeter diepte voor meer dan de
      helft van de dikte uit zand (minder dan 8% lutum) bestaat.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel10
  - number: '10.4'
    text: |-
      Voor toepassing van het eerste lid, onderdeel f, wordt onder kleigebied verstaan: gebied dat niet is een veen-
      of zandgebied.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel10
  - number: '10.5'
    text: |-
      Indien bij de vaststelling van de beheersgebiedsplannen niet met zekerheid kan worden bepaald dat de
      toepassing van de beheerspakketten opgenomen in [bijlagen 16][ref1], [17][ref2], [18][ref3], of [23][ref4]
      of de landschapspakketten opgenomen in [bijlagen 32 tot en met 46][ref5] op alle locaties van het betreffende
      beheersgebied daadwerkelijk bijdraagt aan het bereiken van de in het eerste lid, onderdeel b, bedoelde
      doelstellingen, wordt in het beheersgebiedsplan tevens opgenomen dat de minister bij de besluitvorming omtrent
      subsidieverlening kan toetsen of het verlenen van subsidie voor een beheerspakket op de desbetreffende locatie
      doelmatig is.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
      [ref4]: https://wetten.overheid.nl/BWBR0011000
      [ref5]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
      - id: ref4
        bwb_id: BWBR0011000
      - id: ref5
        bwb_id: BWBR0011000
  - number: '10.6'
    text: |-
      Voor zover in gebiedsplannen andere quota zijn opgenomen dan die bedoeld in het eerste lid, onderdeel d, wordt met
      deze quota geen rekening gehouden bij de beoordeling van subsidieaanvragen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel10
  - number: '10.7'
    text: |-
      Voor zover beheersgebiedsplannen voorzien in het aanleggen, herstellen of in stand houden van het landschapspakket
      dat is opgenomen in [bijlage 32][ref1] kan in het desbetreffende beheersgebied tevens het landschapspakket dat is
      opgenomen in [bijlage 33][ref2] worden aangelegd, hersteld of in stand gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
  - number: '13.1'
    text: |-
      Beheersgebiedsplannen worden vastgesteld en gewijzigd bij besluit van gedeputeerde staten van de provincie waarin
      het desbetreffende gebied is gelegen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel13
  - number: '13.2'
    text: |-
      Indien een beheersgebied is gelegen op het grondgebied van twee of meer provincies, wordt het desbetreffende plan
      vastgesteld en gewijzigd door gedeputeerde staten van die provincies.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel13
  - number: '15'
    text: |-
      De minister kan aan gedeputeerde staten per beheerspakket onderscheidenlijk landschapspakket of groep van
      beheerspakketten onderscheidenlijk groep van landschapspakketten, richtlijnen en aanwijzingen geven ten aanzien van
      het aantal hectares waarop het totaal van de beheersgebiedsplannen in een provincie betrekking kan hebben.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel15
  - number: '16'
    text: |-
      Vaststelling en wijziging van beheersgebiedsplannen geschiedt met inachtneming van het Structuurschema groene
      ruimte, het natuurbeleidsplan, bedoeld in [hoofdstuk II van de Natuurbeschermingswet 1998][ref1] en door de
      minister overeenkomstig [artikel 15][ref2] gegeven richtlijnen en aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel15
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009641
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '15'
        hoofdstuk: '2'
  - number: '17'
    text: |-
      Op de voorbereiding van een besluit tot vaststelling of wijziging van een beheersgebiedsplan is de in
      [afdeling 3.5 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.5
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.5'
  - number: 17a.1
    text: |-
      De minister kan ten behoeve van de uitvoering van deze regeling beheersgebieden begrenzen op een door hem te
      bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17a
  - number: 17a.2
    text: |-
      De [artikelen 10 tot en met 17][ref1],
      [artikel 23, onderdeel a, laatste zinsnede, en onderdeel b, laatste zinsnede][ref2], alsmede
      [artikel 60, eerste lid, laatste zinsnede][ref3], zijn ten aanzien van de in het eerste lid bedoelde gebieden niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel60
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011000
        artikel: '60'
        hoofdstuk: '6'
  - number: 17b.1
    text: |-
      Probleemgebieden worden begrensd met inachtneming van de voorwaarden bedoeld de artikelen 17 tot en met 21 van
      de [Verordening nr. 1257/99](31999R1257) van 17 mei 1999 van de Raad van de Europese Unie inzake steun voor
      plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en
      instelling van een aantal verordeningen (PbEG L 160).
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17b
  - number: 17b.2
    text: 'Als probleemgebied kunnen worden begrensd:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17b
  - number: 17b.2.a
    text: diepe veenweidegebieden;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17b
  - number: 17b.2.b
    text: uiterwaarden;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17b
  - number: 17b.2.c
    text: beekdalen;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17b
  - number: 17b.2.d
    text: hellingen, en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17b
  - number: 17b.2.e
    text: |-
      gebieden, die door de minister zijn aangewezen als onderdeel van een speciale beschermingszone als bedoeld in
      de Richtlijnen (EEG) nr. 79/409 van de Raad van de Europese Gemeenschappen van 2 april 1979 inzake het behoud
      van de vogelstand (PbEG L 103) en nr. 92/43 van de Raad van Europese Gemeenschappen van 21 mei 1992 inzake de
      instandhouding van de natuurlijke habitats en de wilde flora en fauna (PbEG L 206).
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17b
  - number: 17c.1
    text: 'Probleemgebieden kunnen worden begrensd door:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17c
  - number: 17c.1.a
    text: gedeputeerde staten van de provincie waarin het desbetreffende probleemgebied zich bevindt;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17c
  - number: 17c.1.b
    text: de minister.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17c
  - number: 17c.2
    text: 'Een probleemgebied wordt begrensd op een kaart met een topografische ondergrond op ten hoogste schaal 1 : 25 000.'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17c
  - number: 17c.3
    text: |-
      Op de kaart, bedoeld in het tweede lid, wordt tevens aangegeven waar veen-, klei, en zandgebieden zijn gelegen
      binnen het probleemgebied.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17c
  - number: 17c.4
    text: |-
      Van begrenzing als bedoeld in het eerste lid, onderdeel a, wordt door gedeputeerde staten mededeling gedaan aan
      de minister.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17c
  - number: 17c.5
    text: De minister kan per provincie het totaal aantal hectares dat als probleemgebied kan worden begrensd vaststellen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17c
  - number: '18.1'
    text: |-
      Aanvragen tot subsidieverlening uit hoofde van deze regeling worden ingediend bij de directeur van de Dienst
      Regelingen met gebruikmaking van een daartoe bestemd aanvraagformulier dat verkrijgbaar is bij de directeur van de
      Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel18
  - number: '18.2'
    text: 'In de aanvraag tot subsidieverlening wordt in ieder geval aangegeven:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel18
  - number: 18.2.a
    text: welk beheerspakket, onderscheidenlijk welke beheerspakketten, de aanvraag betreft;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel18
  - number: 18.2.b
    text: welk landschapspakket, onderscheidenlijk welke landschapspakketten, de aanvraag betreft;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel18
  - number: 18.2.c
    text: |-
      of de aanvraag mede betrekking heeft op de maatregel, bedoeld in [artikel 33][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel33
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 18.2.d
    text: of er sprake is van inrichtingssubsidie;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel18
  - number: 18.2.e
    text: of de aanvraag wordt ingediend door een ondernemer en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel18
  - number: 18.2.f
    text: of de subsidieaanvrager beheerder is.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel18
  - number: '18.3'
    text: |-
      Indien de subsidieaanvrager niet krachtens zakelijk of duurzaam persoonlijk recht beschikt over een recht tot
      gebruik en beheer van het terrein waarop de subsidieaanvraag betrekking heeft, wordt in de aanvraag tevens vermeld
      of het gebruiksrecht van het desbetreffende terrein berust bij een ondernemer, behoudens in het geval de aanvrager
      een rechtspersoon is als bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel5
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '5'
        hoofdstuk: '1'
  - number: '18.4'
    text: |-
      Aanvragen worden onderscheiden naar provincies waarin het desbetreffende terrein of het grootste deel daarvan is
      gelegen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel18
  - number: '19.1'
    text: |-
      De aanvraag tot subsidieverlening gaat in ieder geval vergezeld van één of meer topografische kaarten met een
      schaal van 1 : 10.000 waarop de grenzen van het desbetreffende terrein zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel19
  - number: '19.2'
    text: |-
      Indien de aanvraag betrekking heeft op meerdere beheers- of landschapspakketten op een terrein worden op de
      topografische kaart, bedoeld in het eerste lid, tevens de grenzen aangegeven waar de verschillende beheers- of
      landschapspakketten waarvoor subsidie wordt aangevraagd, zullen worden in stand gehouden of ontwikkeld.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel19
  - number: '19.3'
    text: |-
      Indien de aanvraag betrekking heeft op een beheerspakket opgenomen in de [bijlagen 19 tot en met 22][ref1], wordt
      op de topografische kaart, bedoeld in het eerste lid, tevens aangegeven waar het beheer omschreven in de onderdelen
      3 en 4 van de desbetreffende beheerspakketten plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: '19.4'
    text: |-
      Indien de subsidie wordt aangevraagd door een aanvrager als bedoeld in [artikel 18, derde lid][ref1], gaat
      de aanvraag tot subsidieverlening tevens vergezeld van de met betrekking tot het desbetreffende terrein tot
      stand gekomen overeenkomst, bedoeld in [artikel 4, onderdeel a][ref2], alsmede van de met betrekking tot het
      desbetreffende terrein opgestelde verklaring, [bedoeld in artikel 4, onderdeel b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel4
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '18'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '4'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0011000
        artikel: '4'
        hoofdstuk: '1'
  - number: '19.5'
    text: |-
      Indien de subsidie wordt aangevraagd door een aanvrager als bedoeld in [artikel 5][ref1], gaat de aanvraag
      vergezeld van de documenten, bedoeld in [artikel 5, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel5
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '5'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '5'
        hoofdstuk: '1'
  - number: 19a
    text: |-
      In afwijking van de artikelen 18, tweede tot en met vierde lid, en 19, gaat een aanvraag tot subsidieverlening uit
      hoofde van artikel 2a van deze regeling vergezeld van een projectplan dat is opgesteld aan de hand van de volgende
      criteria:
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel19a
  - number: 19a.a
    text: doelstelling van het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel19a
  - number: 19a.b
    text: doelstelling van het desbetreffende project;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel19a
  - number: 19a.c
    text: aard en omvang van de activiteiten ter realisatie van de doelstellingen, bedoeld in artikel 2a;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel19a
  - number: 19a.d
    text: aantal leden van het samenwerkingsverband;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel19a
  - number: '20'
    text: |-
      Indien er met betrekking tot een terrein meer beheerders zijn, kan door hen gezamenlijk een aanvraag worden
      ingediend, welke aanvraag, onverminderd de [artikelen 18][ref1] en [19][ref2], vergezeld gaat van een tussen hen
      gesloten overeenkomst waaruit blijkt dat zij genoegzaam en duurzaam samenwerken inzake het beheer van dat terrein.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel19
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '18'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '19'
        hoofdstuk: '3'
  - number: 20a.1
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder beheersgebied eveneens verstaan: natuurgebied als bedoeld
      in [artikel 13 van de Subsidieregeling natuurbeheer 2000][ref1], indien en voor zover de instandhouding van
      een beheerspakket volgens de in [bijlage 3][ref2] van deze regeling opgenomen tabel, in overeenstemming is
      met de doelstellingen en basis- of pluspakketten van het desbetreffende natuurgebiedsplan als bedoeld in de
      [Subsidieregeling natuurbeheer 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010999#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0010999
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0010999
  - number: 20a.2
    text: |-
      In afwijking van het eerste lid kunnen beheerders, die vóór 25 oktober 2003 subsidie ontvingen op grond van één
      van de regelingen, genoemd in [artikel 29, onderdeel d, subonderdelen 2° tot en met 5°][ref1], tot 1 januari
      2007 voor een terrein gelegen in een natuurgebied subsidie aanvragen voor de beheerspakketten opgenomen in de
      [bijlagen 6 tot en met 28a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011000
  - number: 20b
    text: |-
      Beheerssubsidie wordt niet verstrekt ten aanzien van terreinen, gelegen in een
      natuurgebiedsplan als bedoeld in de [Subsidieregeling natuurbeheer 2000][ref1], die
      Staatsbosbeheer, een particuliere terreinbeherende natuurbeschermingsorganisatie als bedoeld in
      [artikel 3 van de Regeling subsidies particuliere terreinbeherende natuurbeschermingsorganisaties][ref2],
      een ontvanger van subsidie functieverandering als bedoeld in
      [artikel 40 van de Subsidieregeling natuurbeheer 2000][ref3] danwel een rechtsopvolger daarvan of een ontvanger
      van beheerssubsidie als bedoeld in artikel 9 van de Tijdelijke regeling particulier natuurbeheer danwel een
      rechtsopvolger daarvan in de hoedanigheid van eigenaar, dan wel zakelijk gerechtigde, na 1 december 1977 in gebruik
      heeft afgestaan aan een ondernemer, tenzij dit afstaan in gebruik heeft geleid tot de ononderbroken voortzetting
      van het op 1 december 1977 bestaand gebruik door: - de ondernemer;
        - zijn echtgenoot;
        - een pleegkind of
        - één of meer bloed- en aanverwanten in de rechte lijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010999
      [ref2]: https://wetten.overheid.nl/BWBR0006085#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0010999#Artikel40
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0010999
      - id: ref2
        bwb_id: BWBR0006085
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0010999
        artikel: '40'
  - number: '21.1'
    text: |-
      Per terrein kan voor één of meerdere beheerspakketten beheerssubsidie worden verstrekt, met dien verstande dat in
      het terrein niet meerdere beheerspakketten op dezelfde oppervlakte kunnen worden ontwikkeld of in stand gehouden.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel21
  - number: '21.2'
    text: |-
      In afwijking van het eerste lid kunnen de beheerspakketten, opgenomen in
      [onderdeel 4 van de bijlagen 19 tot en met 22][ref1] en in [bijlage 28b][ref2] dan wel in de
      [bijlagen 28c tot en met 28f][ref3], op dezelfde oppervlakte worden ontwikkeld of in stand gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
  - number: '21.3'
    text: |-
      In afwijking van het eerste lid kan het beheerspakket, opgenomen in [bijlage 28c][ref1], op dezelfde
      oppervlakte worden ontwikkeld of in stand gehouden als de beheerspakketten, opgenomen in de [bijlagen 15][ref2],
      [16][ref3], [17][ref4] en [19 tot en met 22][ref5], tenzij de beheerseenheden overeenkomstig onderdeel 3 van de
      beheerspakketten, opgenomen in de [bijlagen 19 tot en met 22][ref6], worden beheerd op een wijze als bedoeld in de
      [bijlagen 12][ref7], [13][ref8], [14][ref9] en [18][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
      [ref4]: https://wetten.overheid.nl/BWBR0011000
      [ref5]: https://wetten.overheid.nl/BWBR0011000
      [ref6]: https://wetten.overheid.nl/BWBR0011000
      [ref7]: https://wetten.overheid.nl/BWBR0011000
      [ref8]: https://wetten.overheid.nl/BWBR0011000
      [ref9]: https://wetten.overheid.nl/BWBR0011000
      [ref10]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
      - id: ref4
        bwb_id: BWBR0011000
      - id: ref5
        bwb_id: BWBR0011000
      - id: ref6
        bwb_id: BWBR0011000
      - id: ref7
        bwb_id: BWBR0011000
      - id: ref8
        bwb_id: BWBR0011000
      - id: ref9
        bwb_id: BWBR0011000
      - id: ref10
        bwb_id: BWBR0011000
  - number: '21.4'
    text: |-
      Onverminderd het eerste lid, kunnen de landschapspakketten opgenomen in de [bijlagen 36][ref1], [38][ref2],
      [40][ref3] en [46][ref4] op dezelfde oppervlakte in stand worden gehouden als de beheerspakketten opgenomen in de
      [bijlagen 6 tot en met 30][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
      [ref4]: https://wetten.overheid.nl/BWBR0011000
      [ref5]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
      - id: ref4
        bwb_id: BWBR0011000
      - id: ref5
        bwb_id: BWBR0011000
  - number: '23'
    text: 'Beheerssubsidie ten behoeve van een terrein dat is gelegen in een beheersgebied wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel23
  - number: 23.a
    text: |-
      met het oog op de ontwikkeling van een of meerdere beheerspakketten opgenomen in de [bijlagen 6][ref1], [10][ref2],
      [12 tot en met 15][ref3] en [24 tot en met 28][ref4], voorzover die ontwikkeling in overeenstemming is met het
      desbetreffende beheersgebiedsplan;


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
      [ref4]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
      - id: ref4
        bwb_id: BWBR0011000
  - number: 23.b
    text: |-
      met het oog op de instandhouding van een of meerdere beheerspakketten opgenomen in de
      [bijlagen 7 tot en met 9][ref1], en [11 tot en met 30][ref2] die op het tijdstip van indiening van de aanvraag
      voor beheerssubsidie op het terrein zijn ontwikkeld, voorzover die instandhouding in overeenstemming is met het
      desbetreffende beheersgebiedsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
  - number: '24'
    text: |-
      Beheerssubsidie wordt verstrekt ten behoeve van een terrein met het oog op de ontwikkeling of instandhouding van
      een beheerspakket opgenomen in de [bijlagen 28b tot en met 30][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: '26'
    text: 'Beheerssubsidie wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel26
  - number: 26.a
    text: |-
      voor één tijdvak, indien de subsidie betrekking heeft op de ontwikkeling of instandhouding van een of meerdere
      beheerspakketten, opgenomen in de [bijlagen 6 tot en met 28b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 26.b
    text: |-
      voor drie aaneengesloten tijdvakken, indien de subsidie betrekking heeft op de ontwikkeling of instandhouding van
      een beheerspakket, opgenomen in een van de [bijlagen 29][ref1] en [30][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
  - number: '27'
    text: |-
      Beheerssubsidie ten behoeve van de ontwikkeling of instandhouding van een beheerspakket opgenomen in de
      [bijlagen 29][ref1] en [30][ref2] wordt uitsluitend verstrekt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
  - number: 27.a
    text: |-
      voorafgaand aan de desbetreffende subsidieaanvraag ten behoeve van het betrokken terrein een vrijstelling is
      verleend op grond van de [Regeling meldings- en herplantplicht][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003518
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003518
  - number: 27.b
    text: |-
      de beplanting geschiedt buiten de bebouwde kom, bedoeld in [artikel 1, vijfde lid, van de Boswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002357#Artikel1
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002357
        artikel: '1'
  - number: '28.1'
    text: |-
      Beheerssubsidie wordt niet verstrekt ten behoeve van een terrein dat is gelegen in een beheersgebied voor de
      ontwikkeling of instandhouding van een beheerspakket op een beheerseenheid:
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel28
  - number: 28.1.a
    text: |-
      waarvan de oppervlakte niet ten minste overeenkomt met het aantal hectares dat is opgenomen als minimumoppervlakte
      in de bijlage waarin het desbetreffende beheerspakket is opgenomen;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel28
  - number: 28.1.b
    text: |-
      waarvan de breedte kleiner, onderscheidenlijk groter, is dan de minimumbreedte, onderscheidenlijk maximumbreedte,
      en de lengte kleiner is dan de minimumlengte die is opgenomen in de bijlage waarin het desbetreffende beheerspakket
      is opgenomen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel28
  - number: '28.2'
    text: |-
      Indien beheerssubsidie wordt verstrekt voor de ontwikkeling of instandhouding van meerdere beheerspakketten op een
      terrein, zijn de in het eerste lid, onderdelen a en b, genoemde voorwaarden van overeenkomstige toepassing voor elk
      afzonderlijk beheerspakket waarvoor beheerssubsidie wordt verleend op het desbetreffende terrein.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel28
  - number: '28.3'
    text: |-
      De minister kan beleidsregels vaststellen met betrekking tot het aantal van een planten- of diersoort bedoeld in de
      onderscheiden beheers- en landschapspakketten per oppervlaktemaat en de spreiding van de betreffende soort binnen
      de beheerseenheid, onderscheidenlijk de oppervlaktemaat.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel28
  - number: '28.4'
    text: |-
      Beleidsregels als bedoeld in het derde lid worden als [bijlage][ref1] bij deze regeling opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: '29'
    text: 'Beheerssubsidie wordt niet verstrekt:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
  - number: 29.a
    text: aan Staatsbosbeheer;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
  - number: 29.b
    text: |-
      ten behoeve van de terreinen die niet zijn gelegen in een beheersgebied, tenzij de aangevraagde beheerssubsidie
      betrekking heeft op beheerspakketten genoemd in de [bijlagen 28b tot en met 30][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 29.c
    text: ten behoeve van een in een beheersgebied gelegen terrein voorzover daardoor het quotum wordt overschreden, of
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
  - number: 29.d
    text: 'ten behoeve van terreinen waarop nog verplichtingen van toepassing zijn op grond van:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
  - number: 29.d.1°
    text: |-
      de [Subsidieregeling natuurbeheer 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: 29.d.2°
    text: de Beschikking beheersovereenkomsten 1983;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
  - number: 29.d.3°
    text: de Regeling beheersovereenkomsten 1988;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
  - number: 29.d.4°
    text: de Regeling beheersovereenkomsten 1993;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
  - number: 29.d.5°
    text: de Regeling beheersovereenkomsten en natuurontwikkeling;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
  - number: 29.d.6°
    text: de Regeling stimulering bosuitbreiding op landbouwgronden;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
  - number: 29.d.7°
    text: |-
      de [Beschikking ter zake van het uit produktie nemen van bouwland][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004375
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004375
  - number: 29.d.8°
    text: de Beschikking bijdragen probleemgebieden,
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
  - number: 29.d.9°
    text: de Regeling functiebeloning bos en natuurterreinen, of
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
  - number: 29.d.10°
    text: |-
      [hoofdstuk 4, paragraaf 2, van de Regeling GLB-inkomenssteun][ref1] of
      [hoofdstuk 2, paragraaf 5.2 van de Regeling GLB-inkomenssteun 2006][ref2], behalve ingeval de beheerssubsidie
      betrekking heeft op een beheerseenheid als bedoeld in [onderdeel 4 van de bijlagen 19 tot en met 22][ref3], of
      in [bijlage 28b][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Paragraaf5.2
      [ref3]: https://wetten.overheid.nl/BWBR0011000
      [ref4]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017558
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019131
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0011000
      - id: ref4
        bwb_id: BWBR0011000
  - number: '30.1'
    text: |-
      Subsidie wordt niet verstrekt aan een beheerder indien in de twee jaar voorafgaande aan de aanvraag voor
      subsidieverlening een verzoek tot intrekking van een subsidieverlening voor de desbetreffende beheerseenheid door
      de beheerder is ingediend en dit verzoek is gehonoreerd.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel30
  - number: '30.2'
    text: |-
      In afwijking van het eerste lid kan in 2005 of 2006 een subsidie worden verstrekt indien in 2004 een
      subsidieverlening voor de desbetreffende beheerseenheid op verzoek van de beheerder is ingetrokken in verband met
      het feit dat hem in 2004 is gebleken dat hij ten onrechte een beheersbijdrage voor een probleemgebied als bedoeld
      in [artikel 17b][ref1] heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel17b
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: 17b
        hoofdstuk: 2a
  - number: '31'
    text: |-
      Beheerssubsidie wordt niet verstrekt indien voor de desbetreffende beheerseenheid voor de instandhouding of
      ontwikkeling van een beheerspakket bijdragen worden genoten van een rechtspersoon als bedoeld in [artikel 5][ref1]
      of door tussenkomst van een subsidieaanvrager als bedoeld in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel4
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '5'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '4'
        hoofdstuk: '1'
  - number: '32.1'
    text: |-
      Bij het verlenen van beheerssubsidie wordt de beheersbijdrage verhoogd met € 94,– per hectare voor zover het
      terrein is gelegen in een probleemgebied als bedoeld in [artikel 17b][ref1] indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel17b
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: 17b
        hoofdstuk: 2a
  - number: 32.1.a
    text: |-
      op het terrein een beheerspakket als bedoeld in de [bijlagen 6 tot en 18][ref1],
      [19 tot en met 22, onderdelen 5 i, ii en iii][ref2], [23 tot en met 28f][ref3] wordt ontwikkeld of in stand
      gehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
  - number: 32.1.b
    text: |-
      op het terrein een beheerspakket als bedoeld in de [bijlagen 19 tot en met 22, onderdeel 4][ref1], wordt ontwikkeld
      of in stand gehouden en de beheerder zich bereid heeft verklaard te voldoen aan de verplichtingen, bedoeld in
      [artikel 38, eerste lid, onderdelen d en e][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel38
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 32.1.c
    text: |-
      op het terrein een beheerspakket als bedoeld in [bijlage 28b][ref1] wordt ontwikkeld of in stand
      gehouden en de beheerder zich, ingeval op het terrein tevens een beheerspakket als bedoeld in de
      [bijlagen 19 tot en met 22, onderdeel 4][ref2], wordt ontwikkeld of in stand gehouden, bereid heeft verklaard te
      voldoen aan de verplichtingen, bedoeld in [artikel 38, eerste lid, onderdelen d en e][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel38
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '32.2'
    text: |-
      Indien op het terrein een beheerspakket wordt ontwikkeld of in stand gehouden, bedraagt de beheerssubsidie
      per tijdvak het bedrag dat wordt gevormd door de vermenigvuldiging van het getal zes met de desbetreffende
      beheersbijdrage opgenomen in de bijlage van het desbetreffende beheerspakket en het aantal hectares waarvoor
      beheerssubsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel32
  - number: '32.3'
    text: |-
      Indien op het terrein meerdere beheerspakketten worden ontwikkeld of in stand gehouden, bedraagt de beheerssubsidie
      per tijdvak de som van de bedragen die worden gevormd door de vermenigvuldiging van het getal zes met de
      desbetreffende beheersbijdragen opgenomen in de bijlage van elk van de onderscheiden beheerspakketten en het aantal
      hectares per beheerspakket waarvoor beheerssubsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel32
  - number: '32.4'
    text: |-
      Indien subsidie wordt verstrekt voor drie aaneengesloten tijdvakken wordt het bedrag van de subsidie voor elk van
      die tijdvakken bepaald met overeenkomstige toepassing van het tweede, onderscheidenlijk het derde lid.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel32
  - number: '33.1'
    text: |-
      Indien ruige stalmest wordt uitgereden op een terrein waarvoor beheerssubsidie wordt verstrekt ten behoeve van
      de ontwikkeling of instandhouding van een beheerspakket, opgenomen in [bijlage 16][ref1], of een beheerseenheid
      als bedoeld in de [bijlagen 19 tot en met 22][ref2], waarbij het terrein wordt beheerd op een wijze als bedoeld
      in [bijlage 16][ref3], dan kan op verzoek van de beheerder de overeenkomstig [artikel 32][ref4] bepaalde
      beheerssubsidie worden verhoogd voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
      [ref4]: https://wetten.overheid.nl/BWBR0011000#Artikel32
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
      - id: ref4
        bwb_id: BWBR0011000
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 33.1.a
    text: de ruige stalmest wordt uitgereden op de oppervlakte van de desbetreffende beheerspakketten;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel33
  - number: 33.1.b
    text: |-
      de ruige stalmest wordt uitgereden gedurende het desbetreffende tijdvak jaarlijks in de periode tussen 1 februari
      en 1 april;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel33
  - number: 33.1.c
    text: per hectare ten minste 10 ton en ten hoogste 20 ton ruige stalmest wordt uitgereden, en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel33
  - number: 33.1.d
    text: |-
      de beheerder binnen twee weken na het uitrijden van de ruige stalmest hiervan melding doet aan de directeur van
      de Dienst Regelingen met gebruikmaking van een daartoe door de directeur van de Dienst Regelingen ter beschikking
      gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel33
  - number: '33.2'
    text: 'De verhoging, bedoeld in het eerste lid, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel33
  - number: 33.2.a
    text: |-
      € 149,75 voor zover de ruige mest wordt uitgereden op land dat vanaf bedrijfsgebouwen alleen bereikbaar is via
      water;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel33
  - number: 33.2.b
    text: € 77,14 voor zover de ruige mest wordt uitgereden op andere grond dan bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel33
  - number: '33.3'
    text: |-
      In afwijking van het eerste lid kan een beheerder die in 2004 een aanvraag heeft ingediend voor beheerssubsidie als
      bedoeld in het eerste lid en daarbij niet in aanmerking is gekomen voor de verhoging, bedoeld in het eerste lid, in
      2005 om die verhoging verzoeken.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel33
  - number: 33a.1
    text: |-
      De beheerssubsidie voor de in de [bijlagen 6 tot en met 28b][ref1] genoemde beheerspakketten wordt, gedeeltelijk,
      voor de duur van één jaar, ingetrokken indien op het bedrijf van de subsidieontvanger op grond van het Besluit
      verboden stoffen diergeneesmiddelen verboden hormonen of residuen daarvan, worden aangetroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 33a.2
    text: |-
      De beheerssubsidie voor de in de [bijlagen 6 tot en met 28b][ref1] genoemde beheerspakketten wordt, gedeeltelijk,
      voor de duur van twee jaren, ingetrokken indien op het bedrijf van de subsidieontvanger nogmaals op grond van het
      Besluit verboden stoffen diergeneesmiddelen verboden hormonen of residuen daarvan, worden aangetroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: '34'
    text: |-
      Indien beheerssubsidie wordt verstrekt voor de instandhouding of ontwikkeling van meerdere beheerspakketten op een
      terrein, vermeldt de beschikking tot subsidieverlening in ieder geval:
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel34
  - number: 34.a
    text: de ligging en de grootte van het terrein;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel34
  - number: 34.b
    text: |-
      de doelen van de beheerssubsidie, bestaande uit het gedurende het tijdvak op het terrein ontwikkelen of in stand
      houden van de desbetreffende beheerspakketten;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel34
  - number: 34.c
    text: het aantal hectares per beheerspakket waarvoor beheerssubsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel34
  - number: 34.d
    text: |-
      de beheersbijdrage op basis waarvan de beheerssubsidie zal worden vastgesteld, waarbij onderscheid wordt gemaakt
      naar ligging;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel34
  - number: 34.e
    text: |-
      het aantal hectares waar ruige mest op wordt uitgereden en het bedrag, bedoeld in [artikel 33][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel33
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 34.f
    text: de datum waarop het tijdvak waarover beheerssubsidie wordt verleend, aanvangt.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel34
  - number: '35'
    text: |-
      Indien beheerssubsidie wordt verstrekt voor de instandhouding of ontwikkeling van een beheerspakket, vermeldt de
      beschikking tot subsidieverlening in ieder geval:
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel35
  - number: 35.a
    text: de ligging en de grootte van het terrein;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel35
  - number: 35.b
    text: |-
      het doel van beheerssubsidie, bestaande uit het gedurende het tijdvak op het terrein ontwikkelen, onderscheidenlijk
      in stand houden, van het desbetreffende beheerspakket;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel35
  - number: 35.c
    text: |-
      de beheersbijdrage op basis waarvan de beheerssubsidie zal worden vastgesteld, waarbij onderscheid wordt gemaakt
      naar ligging;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel35
  - number: 35.d
    text: |-
      het aantal hectares waar ruige mest op wordt uitgereden en de daarmee samenhangende verhoging, bedoeld in
      [artikel 33, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel33
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 35.e
    text: de datum waarop het tijdvak waarover beheerssubsidie wordt verleend, aanvangt.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel35
  - number: '36'
    text: |-
      De datum, bedoeld in de [artikelen 34, onderdeel f][ref1], onderscheidenlijk [artikel 35, onderdeel e][ref2],
      waarop het tijdvak waarover beheerssubsidie wordt verleend aanvangt, kan uitsluitend de eerste dag van de
      onderscheiden maanden van een jaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel35
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '37.1'
    text: |-
      Indien beheerssubsidie is verleend ten behoeve van de ontwikkeling of instandhouding van een beheerspakket
      opgenomen in de [bijlagen 29][ref1] en [30][ref2] in drie tijdvakken, worden in de beschikking, in afwijking
      van de [artikelen 34][ref3] en [35][ref4], tevens de te realiseren doelen in het eerste en tweede tijdvak in de
      beschikking opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0011000#Artikel35
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0011000
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '37.2'
    text: |-
      Als doelen in de zin van het eerste lid worden vastgesteld het doel, bedoeld in [artikel 34, onderdeel b][ref1],
      of [35, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel35
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '38.1'
    text: 'De subsidieontvanger is verplicht:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel38
  - number: 38.1.a
    text: |-
      de in de beschikking tot subsidieverlening vermelde doelen, bedoeld in [artikel 35, onderdeel b][ref1],
      onderscheidenlijk [artikel 37, eerste lid][ref2], te realiseren;


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel37
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 38.1.b
    text: |-
      indien op het terrein voor meerdere beheerspakketten beheerssubsidie wordt verleend, de in de beschikking
      tot subsidieverlening vermelde doelen, bedoeld in [artikel 34, onderdeel b][ref1], onderscheidenlijk
      [artikel 37, eerste lid][ref2], te realiseren;


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel37
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 38.1.c
    text: |-
      de in het beheerspakket, onderscheidenlijk de beheerspakketten, opgenomen beheersvoorschriften te treffen die zijn
      vermeld in de bijlage waarin het beheerspakket is, onderscheidenlijk de beheerspakketten zijn, opgenomen;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel38
  - number: 38.1.d
    text: het reliëf van het terrein te handhaven;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel38
  - number: 38.1.e
    text: de bestaande waterhuishouding van het terrein te handhaven;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel38
  - number: 38.1.f
    text: |-
      van omstandigheden als gevolg waarvan het redelijkerwijs niet mogelijk is te voldoen aan de verplichting, bedoeld
      in onderdeel a, onderdeel b, onderscheidenlijk onderdeel c, binnen twee weken nadat de subsidieontvanger daarvan
      redelijkerwijs op de hoogte kan zijn aan de directeur van de Dienst Regelingen schriftelijk melding te doen;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel38
  - number: 38.1.g
    text: |-
      uiterlijk drie maanden nadat gehele of gedeeltelijke overdracht van de bevoegdheid tot gebruik en beheer van het
      betrokken terrein plaatsvindt, dit schriftelijk te melden aan de directeur van de Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel38
  - number: 38.1.h
    text: |-
      aan de geldende nationale en Europese minimumnormen op het gebied van milieu, dierenwelzijn en hygiëne te voldoen,
      hetgeen betekent dat hij op het tijdstip zijn bedrijf uitoefent met inachtneming van de bij of krachtens de
      [Wet milieubeheer][ref1], de [Wet verontreiniging oppervlaktewater][ref2], de [Wet bodembescherming][ref3], de
      [Meststoffenwet][ref4], de [Bestrijdingsmiddelenwet 1962][ref5], de [Gezondheid- en welzijnswet voor dieren][ref6],
      de[ Diergeneesmiddelenwet][ref7] en de [Plantenziektewet][ref8] geldende normen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0002682
      [ref3]: https://wetten.overheid.nl/BWBR0003994
      [ref4]: https://wetten.overheid.nl/BWBR0004054
      [ref5]: https://wetten.overheid.nl/BWBR0002380
      [ref6]: https://wetten.overheid.nl/BWBR0005662
      [ref7]: https://wetten.overheid.nl/BWBR0003818
      [ref8]: https://wetten.overheid.nl/BWBR0002075
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0002682
      - id: ref3
        bwb_id: BWBR0003994
      - id: ref4
        bwb_id: BWBR0004054
      - id: ref5
        bwb_id: BWBR0002380
      - id: ref6
        bwb_id: BWBR0005662
      - id: ref7
        bwb_id: BWBR0003818
      - id: ref8
        bwb_id: BWBR0002075
  - number: '38.2'
    text: |-
      De verplichtingen, bedoeld in het eerste lid, onderdelen d en e, gelden voor de periode waarover beheerssubsidie is
      verleend, met dien verstande dat zij niet gelden voorzover dit in de beschikking tot verlening van beheerssubsidie,
      dan wel in de beheerspakketten, anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel38
  - number: '38.3'
    text: |-
      Indien subsidie is verleend voor de beheerspakketten opgenomen in de [bijlagen 19 tot en met 22][ref1], gelden
      de verplichtingen, bedoeld in het eerste lid, onderdelen d en e al dan niet in combinatie met een beheerspakket,
      opgenomen in de [bijlagen 28b tot en met 28f][ref2], uitsluitend voor die oppervlakten waarop onderdeel 4, van de
      beheerspakketten, opgenomen in de [bijlagen 19 tot en met 22][ref3] van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
  - number: '39.1'
    text: |-
      De minister verstrekt binnen acht weken na afloop van het eerste jaar van het tijdvak een voorschot en vervolgens
      telkens ten minste een jaar later. De hoogte van het voorschot komt overeen met de beheersbijdrage van elk van
      de beheerspakketten waarvoor ten behoeve van het desbetreffende terrein voor dat tijdvak subsidie wordt verleend,
      alsmede, voor zover van toepassing, het bedrag, bedoeld in [artikel 33][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel33
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '39.2'
    text: |-
      In afwijking van het eerste lid wordt in een jaar het voorschot verminderd met 100% als de beheerder in de twee
      jaar voorafgaande aan de verstrekking van het voorschot op enig moment niet heeft voldaan aan de verplichtingen,
      bedoeld in [artikel 38, eerste lid, onderdelen c tot en met g][ref1], of enig ander voorschrift in de beschikking
      tot subsidieverlening niet heeft nageleefd, tenzij de aard en de ernst van het niet-nakomen van de genoemde
      verplichtingen aanleiding geven tot vermindering met een lager percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel38
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '39.3'
    text: Per terrein kunnen per tijdvak ten hoogste vijf voorschotten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel39
  - number: '41.1'
    text: |-
      Telkens binnen 8 weken na afloop van een tijdvak of zoveel eerder indien noodzakelijk dient de ontvanger van
      beheerssubsidie voor het desbetreffende terrein een aanvraag tot subsidievaststelling over dat tijdvak in bij de
      directeur van de Dienst Regelingen met gebruikmaking van een daartoe bestemd aanvraagformulier dat verkrijgbaar is
      bij de directeur van de Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel41
  - number: '41.2'
    text: |-
      Een subsidieontvanger als bedoeld in [artikel 5][ref1], doet bij de aanvraag bedoeld in het eerste lid een opgave
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel5
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '5'
        hoofdstuk: '1'
  - number: 41.2.a
    text: de ondernemers aan wie door hem bijdragen zijn toegekend;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel41
  - number: 41.2.b
    text: de activiteiten van die ondernemers waarvoor de bijdragen zijn toegekend en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel41
  - number: 41.2.c
    text: de bedragen, per ondernemer, die zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel41
  - number: '41.3'
    text: |-
      De ontvanger van beheerssubsidie geeft in de aanvraag aan in hoeverre het doel, bedoeld in
      [artikel 38, eerste lid, onderdeel a, onderscheidenlijk onderdeel b][ref1], is gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel38
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '42.1'
    text: |-
      De minister stelt na ontvangst van de in [artikel 41][ref1] bedoelde aanvraag de beheerssubsidie telkens vast
      binnen 8 weken, tenzij voor de beoordeling van de aanvraag een langere termijn dan 8 weken noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel41
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: '42.2'
    text: |-
      De beheerssubsidie wordt vastgesteld overeenkomstig het bedrag dat bij de beschikking tot subsidieverlening is
      bepaald, zoals dat op grond van [artikel 7, eerste lid][ref1], door de minister is gecorrigeerd in verband met de
      werkelijke loon- en prijsontwikkeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel7
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '7'
        hoofdstuk: '1'
  - number: '43.1'
    text: |-
      De subsidie per beheerspakket opgenomen in de [bijlagen 6 tot en met 30][ref1] wordt vastgesteld op het bedrag dat
      uit de subsidieverlening voor het desbetreffende terrein voortvloeit, verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 43.1.a
    text: |-
      15%, indien niet is voldaan aan de verplichting, bedoeld in
      [artikel 38, eerste lid, onderdeel a, onderscheidenlijk onderdeel b][ref1], maar wel is voldaan aan de
      verplichting, bedoeld in [artikel 38, eerste lid, onderdeel c][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel38
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 43.1.b
    text: |-
      100%, indien niet is voldaan aan de verplichting, bedoeld in [artikel 38, eerste lid, onderdeel c][ref1], tenzij
      de aard en de ernst van het niet-nakomen van de genoemde verplichtingen aanleiding geven tot vermindering met een
      lager percentage;


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel38
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 43.1.c
    text: |-
      100%, indien, voorzover van toepassing, niet is voldaan aan de verplichting, bedoeld in
      [artikel 38, eerste lid, onderdelen d en e][ref1], tenzij de aard en de ernst van het niet nakomen van de genoemde
      verplichtingen aanleiding geven tot vermindering met een lager percentage;


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel38
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 43.1.d
    text: |-
      5%, indien niet is voldaan aan de verplichting, bedoeld in
      [artikel 38, eerste lid, onderdeel f, onderscheidenlijk g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel38
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '43.2'
    text: |-
      In zoverre in afwijking van het eerste lid, onderdelen a en b, wordt de subsidie per beheerspakket opgenomen in
      de [bijlagen 19 tot en met 22][ref1], zoals die luidden tot 25 oktober 2003 vastgesteld op het bedrag dat uit de
      subsidieverlening voor het desbetreffende terrein voortvloeit, verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 43.2.a
    text: |-
      15%, indien niet is voldaan aan de verplichting, bedoeld in
      [artikel 38, eerste lid, onderdeel a, onderscheidenlijk onderdeel b][ref1], maar wel:


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel38
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 43.2.a.i
    text: |-
      van de beheersverplichtingen, vermeld in de onderdelen 3 en 4 van het desbetreffende beheerspakket, ten minste
      50% van de percentages vermeld bij de onderscheiden beheerspakketten op de totale oppervlakte van het terrein is
      gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
  - number: 43.2.a.ii
    text: |-
      het deel van de beheersbijdrage voor de onderdelen 3 en 4 van de onderscheiden beheerspakketten dat niet is besteed
      aan de laatstgenoemde onderdelen, is besteed aan onderdeel 5 van de onderscheiden beheerspakketten en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
  - number: 43.2.a.iii
    text: aan de rapportageverplichting, bedoeld in onderdeel 6 van de onderscheiden beheerspakketten, is voldaan.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
  - number: 43.2.b
    text: |-
      100%, indien niet is voldaan aan de eisen geformuleerd in onderdeel a, sub 1 tot en met 3, tenzij de aard en
      de ernst van het niet nakomen van de genoemde verplichtingen aanleiding geven tot vermindering met een lager
      percentage.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
  - number: '43.3'
    text: |-
      De subsidie voor het beheerspakket opgenomen in [bijlage 31][ref1], zoals die luidde tot 1 oktober 2004, wordt
      overeenkomstig het eerste lid, aanhef, en onderdelen b en c, vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: '43.4'
    text: |-
      De verminderingen, bedoeld in het eerste lid, onderdelen a en b, en tweede lid, worden niet toegepast voor zover
      niet is voldaan aan de verplichting, bedoeld in [artikel 38, eerste lid, onderdeel a][ref1], onderscheidenlijk
      onderdeel b of c, ten gevolge van overmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel38
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '43.5'
    text: |-
      De verminderingen, bedoeld in het eerste lid, worden niet toegepast op de beheerssubsidie, voor zover het bedrag
      daarvan bestaat uit een verhoging op grond van [artikel 33][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel33
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '33'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '43.6'
    text: |-
      De verminderingen, bedoeld in het eerste en tweede lid, worden niet toegepast ten aanzien van dat deel van die
      verminderingen dat het bedrag van de beheerssubsidie te boven gaat.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
  - number: '43.6'
    text: |-
      De verminderingen, bedoeld in het eerste en tweede lid, worden voorts niet toegepast ten aanzien van dat deel van
      die verminderingen dat het bedrag van de beheerssubsidie te boven gaat.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel43
  - number: '45.1'
    text: |-
      Inrichtingssubsidie wordt verstrekt met betrekking tot terreinen ten aanzien waarvan beheerssubsidie is verleend
      ten behoeve van de ontwikkeling van de beheerspakketten, opgenomen in de [bijlagen 12 tot en met 14][ref1],
      [18][ref2], [29][ref3] en [30][ref4], voor zover dat in overeenstemming is met het desbetreffende gebiedsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
      [ref4]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
      - id: ref4
        bwb_id: BWBR0011000
  - number: '45.2'
    text: |-
      Inrichtingssubsidie wordt ten behoeve van de aanleg of het herstel van een landschapspakket verstrekt met
      betrekking tot terreinen ten aanzien waarvan landschapssubsidie is verleend, voor zover dat in overeenstemming is
      met het desbetreffende gebiedsplan.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel45
  - number: '46.1'
    text: |-
      Inrichtingssubsidie wordt uitsluitend verstrekt, voorzover deze betrekking heeft op het, door middel van
      eenmalige maatregelen, rechtstreeks en direct wijzigen van de fysieke condities of kenmerken van terreinen,
      zonder welke wijziging ontwikkeling, onderscheidenlijk instandhouding, van het beheerspakket, onderscheidenlijk
      landschapspakket, ten behoeve waarvan beheerssubsidie, onderscheidenlijk landschapssubsidie, is verleend niet
      mogelijk is.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel46
  - number: '46.2'
    text: |-
      Onverminderd het eerste lid wordt inrichtingssubsidie verstrekt overeenkomstig een inrichtingsplan waarin in ieder
      geval zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel46
  - number: 46.2.a
    text: de te treffen inrichtingsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel46
  - number: 46.2.b
    text: de oppervlakte waarop of de lengte waarin die maatregelen zullen worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel46
  - number: 46.2.c
    text: de met de maatregelen beoogde situatie van het terrein;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel46
  - number: 46.2.d
    text: een gespecificeerde begroting;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel46
  - number: 46.2.e
    text: |-
      een topografische kaart met ten hoogste een schaal van 1 : 10.000 waarop is aangegeven waar de onderscheiden
      maatregelen zullen worden getroffen;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel46
  - number: 46.2.f
    text: een beschrijving van de uitgangssituatie;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel46
  - number: 46.2.g
    text: de motivering voor het treffen van de maatregelen en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel46
  - number: 46.2.h
    text: een tijdsplanning voor de uit te voeren werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel46
  - number: '48'
    text: |-
      Tot de subsidiabele kosten behoren de kosten, inclusief BTW, voorzover verrekening niet mogelijk is, verband
      houdende met:
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel48
  - number: 48.a
    text: het opstellen door derden van een inrichtingsplan;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel48
  - number: 48.b
    text: |-
      bebossing van een terrein, voorzover ten behoeve van dat terrein beheerssubsidie is verleend, gericht
      op de ontwikkeling en daaropvolgende instandhouding van een beheerspakket dat is vermeld in een van de
      [bijlagen 29][ref1] en [30][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
  - number: 48.c
    text: maatregelen voor herstel of aanleg van landschappelijke elementen;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel48
  - number: 48.d
    text: maatregelen, gericht op wijziging van de waterhuishouding;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel48
  - number: 48.e
    text: grondverzet;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel48
  - number: 48.f
    text: het plaatsen van een raster;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel48
  - number: 48.g
    text: afvoer van grond, of
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel48
  - number: 48.h
    text: overige maatregelen voorzover noodzakelijk in verband met de desbetreffende inrichting.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel48
  - number: '49'
    text: 'Niet tot de subsidiabele kosten behoren in ieder geval de kosten, verband houdende met:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel49
  - number: 49.a
    text: de verwijdering van bodemverontreiniging of afval;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel49
  - number: 49.b
    text: de bouw van opstallen;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel49
  - number: 49.c
    text: achterstallig onderhoud aan landschappelijke elementen;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel49
  - number: 49.d
    text: de aanschaf van machines, of
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel49
  - number: 49.e
    text: |-
      de aanschaf van materialen, anders dan ten behoeve van het treffen van maatregelen als bedoeld in
      [artikel 48][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel48
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '48'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '50'
    text: 'Geen inrichtingssubsidie wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel50
  - number: 50.a
    text: |-
      voor kosten die zijn gemaakt, alvorens een beslissing op de aanvraag voor inrichtingssubsidie is genomen, behoudens
      de kosten, bedoeld in [artikel 48, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel48
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '48'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 50.b
    text: |-
      ten behoeve van maatregelen waarmee een aanvang is gemaakt, onderscheidenlijk die reeds zijn uitgevoerd, alvorens
      een beslissing op de aanvraag voor inrichtingssubsidie is genomen, of
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel50
  - number: 50.c
    text: |-
      indien de aanvraag tot inrichtingssubsidie niet wordt ingediend tegelijk met de aanvraag tot beheerssubsidie,
      onderscheidenlijk landschapssubsidie, voor het desbetreffende terrein.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel50
  - number: 50a.1
    text: |-
      Inrichtingssubsidie voor de in de [bijlagen 29][ref1] en [30][ref2] genoemde beheerspakketten worden, in afwijking
      van [artikel 2][ref3] juncto [artikel 1, eerste lid, onderdelen d en e][ref4], slechts verstrekt aan beheerders
      die berekend over de laatste drie kalenderjaren voorafgaand aan het jaar van de aanvraag tot subsidieverlening
      tenminste 25% van hun onzuiver inkomen, als bedoeld in artikel 4 van de Wet op de inkomstenbelasting, verkrijgen
      uit het landbouwbedrijf waarvoor de subsidie is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0011000#Artikel1
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
        artikel: '2'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0011000
        artikel: '1'
        hoofdstuk: '1'
  - number: 50a.2
    text: |-
      Indien de beheerder minder dan drie jaar voorafgaand aan het tijdstip van indienen van de aanvraag tot
      subsidieverlening werkt op het landbouwbedrijf waarvoor de subsidieaanvraag wordt ingediend, wordt in afwijking
      van het eerste lid, het onzuiver inkomen berekend op basis van de voorhanden zijnde gegevens. Indien er nog
      geen gegevens voorhanden zijn, wordt het onzuiver inkomen berekend op basis van de gegevens van het volledige
      kalenderjaar van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel50a
  - number: 50a.3
    text: |-
      Indien de beheerder een rechtspersoon is, wordt de inrichtingssubsidie voor de in de
      [bijlagen 29][ref1] en [30][ref2] genoemde beheerspakketten, in afwijking van [artikel 2][ref3]
      juncto [artikel 1, eerste lid, onderdelen d en e][ref4], slechts verstrekt indien de in
      [artikel 7, derde lid, van de Wet op de Vennootschapsbelasting 1969][ref5] bedoelde winst, vermeerderd met het
      bedrag dat voor de bedrijfsleiding van de rechtspersoon ten titel van beloning voor verrichte arbeid in mindering
      is gebracht, gemiddeld over de drie kalenderjaren voorafgaand aan het tijdstip van de subsidieverlening voor ten
      minste de helft afkomstig is uit het landbouwbedrijf waarvoor de subsidie is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0011000#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0002672#Artikel7
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
        artikel: '2'
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0011000
        artikel: '1'
        hoofdstuk: '1'
      - id: ref5
        bwb_id: BWBR0002672
        artikel: '7'
  - number: 50a.4
    text: |-
      Indien op het landbouwbedrijf waarvoor de aanvraag wordt ingediend minder dan drie jaren voorafgaand aan het
      tijdstip van het indienen van de aanvraag tot subsidieverlening landbouwactiviteiten zijn verricht, wordt in
      afwijking van het derde lid, de winst van de rechtspersoon berekend op basis van de voorhanden zijnde gegevens.
      Indien er geen gegevens voorhanden zijn, wordt de winst berekend op basis van de gegevens van het volledige
      kalenderjaar van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel50a
  - number: '51.1'
    text: |-
      Inrichtingssubsidie bedraagt 95% van de werkelijk gemaakte noodzakelijke subsidiabele kosten, met dien verstande
      dat geen vergoeding wordt verstrekt voor zover deze kosten meer bedragen dan een door de minister bij de
      subsidieverlening te bepalen maximumbedrag.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel51
  - number: '51.2'
    text: |-
      Het bedrag aan inrichtingssubsidie dat ten hoogste kan worden verstrekt is opgenomen in [bijlage 50][ref1] bij
      deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: '52'
    text: |-
      De minister kan beleidsregels vaststellen met het oog op de toepassing van de [artikelen 46][ref1], [48][ref2]
      en [51][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel51
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '46'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '48'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011000
        artikel: '51'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '53'
    text: 'De subsidieverlening vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel53
  - number: 53.a
    text: |-
      in hoeverre het plan, bedoeld in [artikel 46, tweede lid][ref1], in uitvoering kan worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel46
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '46'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 53.b
    text: de aard van de benodigde wijzigingen van de fysieke condities of kenmerken van het betrokken terrein;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel53
  - number: 53.c
    text: het aantal hectares ten behoeve waarvan inrichtingssubsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel53
  - number: 53.d
    text: de datum waarop de periode waarover inrichtingssubsidie wordt verleend, aanvangt, en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel53
  - number: 53.e
    text: het bedrag waarop de inrichtingssubsidie ten hoogste kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel53
  - number: '54'
    text: |-
      De subsidieontvanger is verplicht de maatregelen overeenkomstig het door de minister goedgekeurde inrichtingsplan
      uit te voeren binnen een jaar na de datum van subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel54
  - number: '55.1'
    text: |-
      Op de inrichtingssubsidie kan de minister ten hoogste tweemaal per jaar op aanvraag tot ten hoogste 95%
      voorschotten verstrekken, met een minimum van € 2.500,–.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel55
  - number: '55.2'
    text: De aanvraag tot voorschotverlening gaat vergezeld van een overzicht van de liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel55
  - number: '56'
    text: |-
      De aanvraag tot voorschotverlening wordt ingediend bij de directeur van de Dienst Regelingen met gebruikmaking van
      een daartoe bestemd aanvraagformulier dat verkrijgbaar is bij de directeur van de Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel56
  - number: '57'
    text: |-
      De minister neemt binnen 8 weken na ontvangst van de in [artikel 56][ref1] bedoelde aanvraag een besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel56
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '58.1'
    text: |-
      De aanvraag tot subsidievaststelling wordt ingediend binnen 8 weken na afloop van de maatregelen bij de directeur
      van de Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel58
  - number: '58.2'
    text: 'De aanvraag, bedoeld in het eerste lid, gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel58
  - number: 58.2.a
    text: een verklaring dat de maatregelen overeenkomstig de subsidieverlening zijn uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel58
  - number: 58.2.b
    text: |-
      een financiële verantwoording met betrekking tot de getroffen maatregelen, bestaande uit een rekening alsmede,
      indien de subsidieverlening een bedrag van € 25.000,– te boven gaat, een verklaring, overeenkomstig een door de
      minister vast te stellen model, van een accountant-administratieconsulent of registeraccountant als bedoeld in
      [artikel 2:393, eerste lid, van het Burgerlijk Wetboek][ref1] waaruit blijkt dat de maatregelen zijn uitgevoerd
      overeenkomstig de beschikking tot subsidieverlening van inrichtingssubsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '59'
    text: |-
      De minister stelt na ontvangst van de in [artikel 58][ref1] bedoelde bescheiden de inrichtingssubsidie binnen 8
      weken vast op grond van de werkelijk gemaakte kosten zoals bepaald bij de subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel58
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '58'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: '60.1'
    text: |-
      Landschapssubsidie wordt verstrekt in beheersgebieden ten behoeve van de instandhouding van een of meerdere
      landschapspakketten opgenomen in de [bijlagen 32 tot en met 46][ref1], voorzover dit in overeenstemming is met het
      desbetreffende beheersgebiedsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: '60.2'
    text: |-
      Landschapssubsidie ten behoeve van de instandhouding van het landschapspakket, bedoeld in [bijlage 46][ref1], wordt
      alleen verstrekt tezamen met een landschapssubsidie voor instandhouding van een landschapspakket, bedoeld in één of
      meer van de [bijlagen 32 tot en met 45][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
  - number: '61'
    text: Landschapssubsidie wordt verstrekt voor een tijdvak.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel61
  - number: '62.1'
    text: |-
      Indien op het terrein een landschapspakket in stand wordt gehouden, bedraagt de landschapssubsidie het bedrag
      per tijdvak dat wordt gevormd door de vermenigvuldiging van het getal zes met de beheersbijdrage opgenomen in de
      bijlagen van het desbetreffende landschapspakket en het aantal hectares waarvoor landschapssubsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel62
  - number: '62.2'
    text: |-
      Indien op het terrein meerdere landschapspakketten in stand worden gehouden, bedraagt de landschapssubsidie het
      bedrag per tijdvak de som van de beheersbijdragen die worden gevormd door de vermenigvuldiging van het getal zes
      met de beheersbijdragen opgenomen in de bijlagen van de desbetreffende landschapspakketten en het aantal hectares
      per landschapspakket waarvoor landschapssubsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel62
  - number: '63'
    text: |-
      Indien landschapssubsidie wordt verstrekt voor de instandhouding van een of meerdere landschapspakketten binnen een
      terrein, vermeldt de beschikking tot subsidieverlening in ieder geval:
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel63
  - number: 63.a
    text: de ligging en grootte van het terrein;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel63
  - number: 63.b
    text: |-
      het doel van de landschapssubsidie, bestaande uit het gedurende het tijdvak op het terrein in stand houden van een
      of meerdere landschapspakketten;
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel63
  - number: 63.c
    text: het bedrag, onderscheidenlijk de bedragen, op basis waarvan de landschapssubsidie zal worden vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel63
  - number: 63.d
    text: de datum waarop het tijdvak waarover landschapssubsidie wordt verleend, aanvangt.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel63
  - number: '64'
    text: 'De subsidieontvanger is verplicht:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel64
  - number: 64.a
    text: |-
      het in de beschikking tot subsidieverlening vermelde doel, bedoeld in [artikel 63, onderdeel b][ref1], vermelde
      doel te realiseren;


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel63
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '63'
        hoofdstuk: '6'
  - number: 64.b
    text: |-
      van omstandigheden als gevolg waarvan het redelijkerwijs niet mogelijk is te voldoen aan de verplichting, bedoeld
      in onderdeel a, binnen twee weken nadat de subsidieontvanger daarvan redelijkerwijs op de hoogte kan zijn aan de
      directeur van de Dienst Regelingen schriftelijk melding te doen, en
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel64
  - number: 64.c
    text: |-
      uiterlijk drie maanden nadat gehele of gedeeltelijke overdracht van de bevoegdheid tot gebruik en beheer van het
      betrokken terrein plaatsvindt, dit schriftelijk te melden aan de directeur van de Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel64
  - number: '65'
    text: |-
      De [artikelen 21, eerste lid][ref1], [28][ref2], [29, onderdelen a, b en d][ref3],
      [30 tot en met 32, derde en vierde lid][ref4], [36][ref5], [38, eerste lid, onderdeel h][ref6], [39][ref7],
      [41][ref8] en [42][ref9] en [artikel 38, eerste lid, van de Subsidieregeling natuurbeheer 2000][ref10], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0011000#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0011000#Artikel36
      [ref6]: https://wetten.overheid.nl/BWBR0011000#Artikel38
      [ref7]: https://wetten.overheid.nl/BWBR0011000#Artikel39
      [ref8]: https://wetten.overheid.nl/BWBR0011000#Artikel41
      [ref9]: https://wetten.overheid.nl/BWBR0011000#Artikel42
      [ref10]: https://wetten.overheid.nl/BWBR0010999#Artikel38
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011000
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011000
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0011000
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0011000
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0011000
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0011000
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref8
        bwb_id: BWBR0011000
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref9
        bwb_id: BWBR0011000
