  - number: 1.1.a
    text: 'minister: Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel1
  - number: 1.1.b
    text: 'ondernemer: ondernemer van een bedrijf waarop de landbouw wordt uitgeoefend;'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel1
  - number: 1.1.c
    text: 'terrein: gebied, niet zijnde een erf of tuin, dat niet wordt doorsneden door:'
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel1
