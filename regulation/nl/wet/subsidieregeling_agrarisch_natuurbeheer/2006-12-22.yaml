        artikel: '5'
        hoofdstuk: '1'
  - number: '19'
    text: |-
      1 De aanvraag tot subsidieverlening gaat in ieder geval vergezeld van één of meer topografische kaarten met een
      schaal van 1 : 10.000 waarop de grenzen van het desbetreffende terrein zijn aangegeven.

      2 Indien de aanvraag betrekking heeft op meerdere beheers- of landschapspakketten op een terrein worden op de
      topografische kaart, bedoeld in het eerste lid, tevens de grenzen aangegeven waar de verschillende beheers- of
      landschapspakketten waarvoor subsidie wordt aangevraagd, zullen worden in stand gehouden of ontwikkeld.

      3 Indien de aanvraag betrekking heeft op een beheerspakket opgenomen in de [bijlagen 19 tot en met 22][ref1], wordt
      op de topografische kaart, bedoeld in het eerste lid, tevens aangegeven waar het beheer omschreven in de onderdelen
      3 en 4 van de desbetreffende beheerspakketten plaatsvindt.

      4 Indien de subsidie wordt aangevraagd door een aanvrager als bedoeld in [artikel 18, derde lid][ref2], gaat
      de aanvraag tot subsidieverlening tevens vergezeld van de met betrekking tot het desbetreffende terrein tot
      stand gekomen overeenkomst, bedoeld in [artikel 4, onderdeel a][ref3], alsmede van de met betrekking tot het
      desbetreffende terrein opgestelde verklaring, [bedoeld in artikel 4, onderdeel b][ref4].

      5 Indien de subsidie wordt aangevraagd door een aanvrager als bedoeld in [artikel 5][ref5], gaat de aanvraag
      vergezeld van de documenten, bedoeld in [artikel 5, derde lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0011000
