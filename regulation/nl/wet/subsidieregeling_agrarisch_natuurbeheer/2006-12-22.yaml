  - number: 17b
    text: |-
      1 Probleemgebieden worden begrensd met inachtneming van de voorwaarden bedoeld de artikelen 17 tot en met 21
      van de [Verordening nr. 1257/99](31999R1257) van 17 mei 1999 van de Raad van de Europese Unie inzake steun voor
      plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en
      instelling van een aantal verordeningen (PbEG L 160).

      2 Als probleemgebied kunnen worden begrensd:

      a. diepe veenweidegebieden;

      b. uiterwaarden;

      c. beekdalen;

      d. hellingen, en

      e. gebieden, die door de minister zijn aangewezen als onderdeel van een speciale beschermingszone als bedoeld
      in de Richtlijnen (EEG) nr. 79/409 van de Raad van de Europese Gemeenschappen van 2 april 1979 inzake het behoud
      van de vogelstand (PbEG L 103) en nr. 92/43 van de Raad van Europese Gemeenschappen van 21 mei 1992 inzake de
      instandhouding van de natuurlijke habitats en de wilde flora en fauna (PbEG L 206).
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17b
  - number: 17c
    text: |-
      1 Probleemgebieden kunnen worden begrensd door:

      a. gedeputeerde staten van de provincie waarin het desbetreffende probleemgebied zich bevindt;

      b. de minister.

      2 Een probleemgebied wordt begrensd op een kaart met een topografische ondergrond op ten hoogste schaal 1 : 25 000.

      3 Op de kaart, bedoeld in het tweede lid, wordt tevens aangegeven waar veen-, klei, en zandgebieden zijn gelegen
      binnen het probleemgebied.

      4 Van begrenzing als bedoeld in het eerste lid, onderdeel a, wordt door gedeputeerde staten mededeling gedaan aan
      de minister.

      5 De minister kan per provincie het totaal aantal hectares dat als probleemgebied kan worden begrensd vaststellen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel17c
  - number: '18'
    text: |-
      1 Aanvragen tot subsidieverlening uit hoofde van deze regeling worden ingediend bij de directeur van de Dienst
      Regelingen met gebruikmaking van een daartoe bestemd aanvraagformulier dat verkrijgbaar is bij de directeur van de
      Dienst Regelingen.

      2 In de aanvraag tot subsidieverlening wordt in ieder geval aangegeven:

      a. welk beheerspakket, onderscheidenlijk welke beheerspakketten, de aanvraag betreft;

      b. welk landschapspakket, onderscheidenlijk welke landschapspakketten, de aanvraag betreft;

      c. of de aanvraag mede betrekking heeft op de maatregel, bedoeld in [artikel 33][ref1];

      d. of er sprake is van inrichtingssubsidie;

      e. of de aanvraag wordt ingediend door een ondernemer en

      f. of de subsidieaanvrager beheerder is.

      3 Indien de subsidieaanvrager niet krachtens zakelijk of duurzaam persoonlijk recht beschikt over een recht tot
      gebruik en beheer van het terrein waarop de subsidieaanvraag betrekking heeft, wordt in de aanvraag tevens vermeld
      of het gebruiksrecht van het desbetreffende terrein berust bij een ondernemer, behoudens in het geval de aanvrager
      een rechtspersoon is als bedoeld in [artikel 5][ref2].

      4 Aanvragen worden onderscheiden naar provincies waarin het desbetreffende terrein of het grootste deel daarvan
      is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel5
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel18
