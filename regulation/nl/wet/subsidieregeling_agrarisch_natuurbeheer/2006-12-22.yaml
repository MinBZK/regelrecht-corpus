  - number: '102'
    text: |-
      1 Subsidies of voorschotten daarop worden verleend onder voorbehoud van goedkeuring van de Commissie van de
      Europese Gemeenschappen.

      2 De beslissing tot verlening van een subsidie of een voorschot daarop kan worden ingetrokken of gewijzigd ter
      verkrijging van de goedkeuring van de Commissie van de Europese Gemeenschappen voor deze regeling, of wegens het
      uitblijven daarvan.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel102
