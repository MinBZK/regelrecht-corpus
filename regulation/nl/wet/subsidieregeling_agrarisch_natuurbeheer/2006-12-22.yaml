        paragraaf: '5'
      - id: ref10
        bwb_id: BWBR0010999
        artikel: '38'
  - number: '77.1'
    text: Subsidie als bedoeld in artikel 2a wordt eenmalig verstrekt voor een tijdvak.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel77
  - number: '77.2'
    text: De subsidie kan enkel worden verstrekt indien deze vóór 1 mei 2009 is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel77
  - number: '78.1'
    text: |-
      Een aanvraag voor subsidie als bedoeld in artikel 2a wordt ingediend uiterlijk op 30 april van het eerste
      kalenderjaar van het tijdvak waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel78
  - number: '78.2'
    text: |-
      In afwijking van het eerste lid wordt een aanvraag die betrekking heeft op het tijdvak 2004–2009 ingediend in een
      nader door de minister vast te stellen periode.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel78
  - number: '79.1'
    text: |-
      De subsidie bedraagt 100% van de noodzakelijke kosten die samenhangen met de activiteiten, genoemd in het
      projectplan, bedoeld in [artikel 19a][ref1], met een maximum per hectare per jaar van:


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel19a
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: 19a
        hoofdstuk: '3'
  - number: 79.1.a
    text: |-
      € 74,40 ingeval het een pakket als bedoeld in [bijlage 32][ref1], dan wel [bijlage 37][ref2] betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
  - number: 79.1.b
    text: |-
      € 37,20 ingeval het een pakket als bedoeld in [bijlage 12][ref1], [bijlage 13][ref2], [bijlage 14][ref3],
      [bijlage 23][ref4] dan wel [bijlage 28][ref5] betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
      [ref4]: https://wetten.overheid.nl/BWBR0011000
      [ref5]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0011000
      - id: ref2
        bwb_id: BWBR0011000
      - id: ref3
        bwb_id: BWBR0011000
      - id: ref4
        bwb_id: BWBR0011000
      - id: ref5
        bwb_id: BWBR0011000
  - number: 79.1.c
    text: |-
      € 18,88 ingeval het een pakket als bedoeld in [bijlage 16][ref1], [bijlage 17][ref2], [bijlage 18][ref3],
      [bijlage 19][ref4], [bijlage 20][ref5], [bijlage 21][ref6], dan wel [bijlage 22][ref7] betreft, indien en
      voor zover monitoring in het derde en in het zesde jaar plaatsvindt overeenkomstig de Handleiding Nationaal
      Weidevogelmeetnet, uitgave 2001, van SOVON Vogelonderzoek Nederland en het Centraal Bureau voor de Statistiek;


      [ref1]: https://wetten.overheid.nl/BWBR0011000
