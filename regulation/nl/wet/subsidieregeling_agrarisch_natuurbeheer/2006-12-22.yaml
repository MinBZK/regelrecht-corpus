  - number: '38'
    text: |-
      1 De subsidieontvanger is verplicht:

      a. de in de beschikking tot subsidieverlening vermelde doelen, bedoeld in [artikel 35, onderdeel b][ref1],
      onderscheidenlijk [artikel 37, eerste lid][ref2], te realiseren;

      b. indien op het terrein voor meerdere beheerspakketten beheerssubsidie wordt verleend, de in de beschikking
      tot subsidieverlening vermelde doelen, bedoeld in [artikel 34, onderdeel b][ref3], onderscheidenlijk
      [artikel 37, eerste lid][ref4], te realiseren;

      c. de in het beheerspakket, onderscheidenlijk de beheerspakketten, opgenomen beheersvoorschriften te treffen die
      zijn vermeld in de bijlage waarin het beheerspakket is, onderscheidenlijk de beheerspakketten zijn, opgenomen;

      d. het reliëf van het terrein te handhaven;

      e. de bestaande waterhuishouding van het terrein te handhaven;

      f. van omstandigheden als gevolg waarvan het redelijkerwijs niet mogelijk is te voldoen aan de verplichting,
      bedoeld in onderdeel a, onderdeel b, onderscheidenlijk onderdeel c, binnen twee weken nadat de subsidieontvanger
      daarvan redelijkerwijs op de hoogte kan zijn aan de directeur van de Dienst Regelingen schriftelijk melding te
      doen;

      g. uiterlijk drie maanden nadat gehele of gedeeltelijke overdracht van de bevoegdheid tot gebruik en beheer van het
      betrokken terrein plaatsvindt, dit schriftelijk te melden aan de directeur van de Dienst Regelingen.

      h. aan de geldende nationale en Europese minimumnormen op het gebied van milieu, dierenwelzijn en
      hygiëne te voldoen, hetgeen betekent dat hij op het tijdstip zijn bedrijf uitoefent met inachtneming
      van de bij of krachtens de [Wet milieubeheer][ref5], de [Wet verontreiniging oppervlaktewater][ref6],
      de [Wet bodembescherming][ref7], de [Meststoffenwet][ref8], de [Bestrijdingsmiddelenwet 1962][ref9], de
      [Gezondheid- en welzijnswet voor dieren][ref10], de[ Diergeneesmiddelenwet][ref11] en de [Plantenziektewet][ref12]
      geldende normen.

      2 De verplichtingen, bedoeld in het eerste lid, onderdelen d en e, gelden voor de periode waarover beheerssubsidie
      is verleend, met dien verstande dat zij niet gelden voorzover dit in de beschikking tot verlening van
      beheerssubsidie, dan wel in de beheerspakketten, anders is bepaald.

      3 Indien subsidie is verleend voor de beheerspakketten opgenomen in de [bijlagen 19 tot en met 22][ref13], gelden
      de verplichtingen, bedoeld in het eerste lid, onderdelen d en e al dan niet in combinatie met een beheerspakket,
      opgenomen in de [bijlagen 28b tot en met 28f][ref14], uitsluitend voor die oppervlakten waarop onderdeel 4, van de
      beheerspakketten, opgenomen in de [bijlagen 19 tot en met 22][ref15] van toepassing zijn.


