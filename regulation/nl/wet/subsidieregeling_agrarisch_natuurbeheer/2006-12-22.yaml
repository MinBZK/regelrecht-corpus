        paragraaf: '1'
  - number: 101e
    text: |-
      Op aanvragen die zijn ingediend vóór 1 november 2005 blijft [bijlage 17][ref1] zoals die luidt tot 1 november 2005
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel101e
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 101f
    text: |-
      Op aanvragen die zijn ingediend vóór 1 november 2005 blijft [bijlage 12][ref1], onderscheidenlijk [13][ref2] zoals
      die luidt tot 1 november 2005 van toepassing voor zover de subsidieontvanger wel voldoet aan alle voorwaarden van
      die bijlage en niet aan alle voorwaarden van [bijlage 12][ref3], onderscheidenlijk [13][ref4] zoals die luidt met
      ingang van 1 november 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
