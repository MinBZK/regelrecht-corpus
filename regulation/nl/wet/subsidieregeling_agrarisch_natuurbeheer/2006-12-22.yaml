  - number: '81'
    text: |-
      De beschikking tot subsidieverlening vermeldt in ieder geval:

      a. het aantal hectares waarop de subsidieverlening betrekking heeft;

      b. het bedrag waarop de subsidie ten hoogste kan worden vastgesteld;

      c. het jaar met ingang waarvan de subsidie wordt verleend; en

      d. de periode waarop de subsidiabele kosten betrekking kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81
  - number: 81a
    text: |-
      1 De subsidieontvanger dient uiterlijk op 31 maart van het tweede en volgende jaar van het tijdvak waarop de
      subsidieverlening betrekking heeft een overzicht in van de subsidiabele kosten van de met betrekking tot dat jaar
      geplande activiteiten.

      2 Ingeval de met betrekking tot een jaar geplande activiteiten niet of anders zijn opgenomen in het projectplan
      komen de met die activiteiten samenhangende kosten enkel voor subsidie in aanmerking als de afwijking van het
      projectplan naar het oordeel van de minister voldoende is gemotiveerd. In dat geval wijzigt de minister op aanvraag
      de beschikking tot subsidieverlening.

      3 Voor het eerste jaar van het tijdvak waarop de subsidieaanvraag betrekking heeft dient de aanvrager tegelijk
      met de subsidieaanvraag een overzicht in van de subsidiabele kosten van de met betrekking tot dat jaar geplande
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81a
  - number: 81b
    text: |-
      1 Voor het eerste jaar van het tijdvak waarop de subsidieverlening betrekking heeft wordt binnen 8 weken na de
      beschikking tot subsidieverlening een voorschot verleend, gebaseerd op 70% van de subsidiabele kosten die zijn
      opgenomen in het overzicht, bedoeld in [artikel 81a, derde lid][ref1].

      2 Voor elk van de volgende jaren van het tijdvak waarop de subsidieverlening betrekking heeft wordt binnen 17
      weken na aanvang van het kalenderjaar een voorschot verleend, gebaseerd op 80% van de subsidiabele kosten die zijn
      opgenomen in het overzicht, bedoeld in [artikel 81a, eerste lid][ref2].

      3 Het voorschot, bedoeld in het tweede lid, kan in voorkomend geval worden verhoogd of verlaagd met het verschil
      tussen de daadwerkelijke subsidiabele kosten in het voorafgaande jaar en het verleende voorschot voor dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel81a
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel81a
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel81b
