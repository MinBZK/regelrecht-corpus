  - number: '51'
    text: |-
      1 Inrichtingssubsidie bedraagt 95% van de werkelijk gemaakte noodzakelijke subsidiabele kosten, met dien
      verstande dat geen vergoeding wordt verstrekt voor zover deze kosten meer bedragen dan een door de minister bij de
      subsidieverlening te bepalen maximumbedrag.

      2 Het bedrag aan inrichtingssubsidie dat ten hoogste kan worden verstrekt is opgenomen in [bijlage 50][ref1] bij
      deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: '52'
    text: |-
      De minister kan beleidsregels vaststellen met het oog op de toepassing van de [artikelen 46][ref1], [48][ref2]
      en [51][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0011000#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel51
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '46'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
