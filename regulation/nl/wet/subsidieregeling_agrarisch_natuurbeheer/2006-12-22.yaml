    text: wegen breder dan 5 meter,
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel1
  - number: 1.1.c.ii
    text: waterlopen die op enig punt breder zijn dan 25 meter,
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel1
