  - number: '23'
    text: |-
      Beheerssubsidie ten behoeve van een terrein dat is gelegen in een beheersgebied wordt verstrekt:

      a. met het oog op de ontwikkeling van een of meerdere beheerspakketten opgenomen in de [bijlagen 6][ref1],
      [10][ref2], [12 tot en met 15][ref3] en [24 tot en met 28][ref4], voorzover die ontwikkeling in overeenstemming is
      met het desbetreffende beheersgebiedsplan;

      b. met het oog op de instandhouding van een of meerdere beheerspakketten opgenomen in de
      [bijlagen 7 tot en met 9][ref5], en [11 tot en met 30][ref6] die op het tijdstip van indiening van de aanvraag
      voor beheerssubsidie op het terrein zijn ontwikkeld, voorzover die instandhouding in overeenstemming is met het
      desbetreffende beheersgebiedsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
