  - number: '86'
    text: |-
      In geval subsidie is verleend ten behoeve van een terrein waarvan het recht tot gebruik en beheer berust bij de
      subsidieontvanger, en dat recht gaat over op een derde gedurende de periode waarover de desbetreffende subsidie is
      verleend, kan de desbetreffende subsidieverlening worden gewijzigd in een subsidieverlening aan die derde indien
      deze, uiterlijk drie maanden na de datum waarop het recht tot gebruik en beheer is overgegaan, bij wege van een aan
      de directeur de Dienst Regelingen gericht schriftelijk stuk:

      a. verklaart te treden in de aan de subsidieverlening verbonden rechten en plichten, vanaf de datum met ingang
      waarvan de wijziging uit hoofde van dit lid van kracht zal zijn, en

      b. aangeeft of hij als ondernemer moet worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel86
  - number: '87'
    text: |-
      1 Wanneer een terrein waarvoor beheerssubsidie inclusief bijdrage voor probleemgebieden wordt verleend op
      enig moment geen deel meer uitmaakt van een probleemgebied wordt de subsidieverlening verlaagd met de toeslag
      voor probleemgebieden met ingang van de dag volgend op de laatste dag dat het terrein deel uitmaakte van het
      probleemgebied.

      2 Ingeval van verlaging uit hoofde van het eerste lid, wordt de subsidie over het tijdvak waarin het terrein geen
      deel meer uitmaakt van het probleemgebied vastgesteld op het bedrag naar evenredigheid ten opzichte van de subsidie
      zoals die op grond van de subsidieverlening zou kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel87
  - number: '88'
    text: |-
      1 In geval subsidie is verleend met betrekking tot een terrein waarvan het gebruiksrecht berust bij een natuurlijk
      persoon die overlijdt tijdens de periode waarover subsidie is verleend, wordt de desbetreffende subsidieverlening
      voor dat terrein ingetrokken met ingang van de dag, volgend op de dag van overlijden, op voorwaarde dat de
      erfgenamen uiterlijk 30 dagen na het overlijden om deze intrekking verzoeken bij wege van een aan de directeur van
      de Dienst Regelingen gericht schriftelijk verzoek.

      2 Ingeval van intrekking uit hoofde van het eerste lid, wordt de subsidie over het tijdvak waarin het overlijden
      plaatsvond ambtshalve vastgesteld op het bedrag naar evenredigheid ten opzichte van de subsidie zoals die op grond
      van de subsidieverlening ten hoogste zou kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel88
  - number: '89'
    text: |-
      1 In geval subsidie is verleend met betrekking tot een terrein dat deel uitmaakt van een gebied waar landinrichting
      uit kracht van de [Landinrichtingswet][ref1] geschiedt en het voldoen aan de desbetreffende subsidieverlening
      verbonden verplichtingen na vaststelling van het landinrichtingsplan niet meer mogelijk is, wordt de
      desbetreffende subsidieverlening ingetrokken met ingang van de dag, waarop in zodanig gebied de kavelovergang
      plaatsvindt ingevolge de in het plan van toedeling opgenomen bepalingen omtrent de inbezitneming, bedoeld in
      [artikel 196, tweede lid, onderdeel e, van de Landinrichtingswet][ref2].

      2 [Artikel 88, tweede lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003793
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel196
      [ref3]: https://wetten.overheid.nl/BWBR0011000#Artikel88
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003793
      - id: ref2
        bwb_id: BWBR0003793
        artikel: '196'
      - id: ref3
        bwb_id: BWBR0011000
        artikel: '88'
        hoofdstuk: '10'
  - number: 89a
    text: |-
      1 Indien subsidie is verleend met betrekking tot een terrein dat is verworven door Staatsbosbeheer, het bureau
      beheer landbouwgronden of een instelling als bedoeld in artikel 3, eerste en tweede lid, van de Regeling subsidies
      particuliere terreinbeherende natuurbeschermingsorganisaties en het de subsidieontvanger als gevolg van de
      overdracht aan een van de bedoelde organisaties niet meer mogelijk is te voldoen aan de verplichtingen verbonden
      aan de subsidieverlening, wordt de subsidieverlening ingetrokken met ingang van de dag, waarop de overdracht van
      het terrein heeft plaatsgevonden.

      2 In geval van intrekking op grond van het eerste lid, wordt de subsidie over het tijdvak waarin de verwerving
      plaatsvond ambtshalve vastgesteld op een bedrag evenredig met het deel van het tijdvak dat voor de overdracht is
      verstreken.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel89a
  - number: '90'
    text: |-
      1 In geval subsidie is verleend met betrekking tot een terrein dat wordt onteigend tijdens de periode waarover
      subsidie is verleend, wordt de desbetreffende subsidieverlening ingetrokken met ingang van de dag waarop het
      besluit tot onteigening van de betrokken grond onherroepelijk vaststaat.

      2 In geval van intrekking uit hoofde van het eerste lid, wordt de subsidie over het tijdvak waarin het besluit
      tot onteigening onherroepelijk werd ambtshalve vastgesteld op het bedrag naar evenredigheid ten opzichte van de
      beheerssubsidie, landschapssubsidie of subsidie natuurlijke handicaps zoals die op grond van de subsidieverlening
      ten hoogste zou kunnen worden vastgesteld.

      3 [Artikel 88, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel88
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0011000
        artikel: '88'
        hoofdstuk: '10'
  - number: 90a
    text: |-
      Een verleende subsidie wordt voor de duur van één jaar, ingetrokken indien de subsidieaanvrager door ernstige
      nalatigheid of opzettelijk een onjuiste aanvraag tot subsidieverlening of -vaststelling heeft ingediend of
      anderszins onjuiste gegevens heeft verstrekt ter verkrijging van een subsidie op grond van een andere regeling
      die gebaseerd is op hoofdstuk IX van titel II van de [verordening (EG) nr. 1257/99](31999R1257) van de Raad van
      de Europese Unie van 17 mei 1999 betreffende steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en
      Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en instelling van een aantal verordeningen (PbEG L 160).
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel90a
  - number: 90b
    text: |-
      De vastgestelde subsidie wordt geheel of gedeeltelijk ingetrokken indien de subsidieontvanger door ernstige
      nalatigheid of opzettelijk een onjuiste aanvraag tot subsidieverlening of -vaststelling heeft ingediend of
      anderszins foute gegevens heeft verstrekt ter verkrijging van een subsidie op grond van een andere regeling die
      gebaseerd is op hoofdstuk IX van titel II van de [verordening (EG) nr. 1257/99](31999R1257) van de Raad van de
      Europese Unie van 17 mei 1999 betreffende steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en
      Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en instelling van een aantal verordeningen (PbEG L 160).
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel90b
  - number: '91'
    text: |-
      Onverschuldigd betaalde subsidies en voorschotten worden teruggevorderd, vermeerderd met de wettelijke rente tot de
      datum van ontvangst van de teruggevorderde bedragen.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel91
  - number: '92'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze regeling bepaalde zijn belast de ambtenaren van de
      Dienst landelijk gebied van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel92
  - number: 92a
    text: |-
      De subsidieaanvrager is verplicht alle op de subsidie betrekking hebbende documenten, als bedoeld in artikel 1,
      van [verordening (EG) nr. 4045/89](31989R4045) van de Raad van 21 december 1989 inzake de door de lidstaten uit
      te voeren controles op de verrichtingen in het kader van de financieringsregeling van de afdeling Garantie van
      het Europese Oriëntatie- en Garantiefonds voor de landbouw en houdende intrekking van de [richtlijn 77/435/EEG]
      (31977L0435) (Pb L388/18), voorzover deze documenten voor de subsidievaststelling van belang zijn, te bewaren
      gedurende ten minste 3 jaren na de subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel92a
  - number: '93'
    text: |-
      1 De Regeling beheersovereenkomsten en natuurontwikkeling wordt ingetrokken.

      2 Op beheersovereenkomsten als bedoeld in artikel 18 van de Regeling beheersovereenkomsten en natuurontwikkeling,
      blijft eerstbedoelde regeling van toepassing.

      3 Op beheersovereenkomsten die zijn gesloten op basis van de beheersplannen die zijn vastgesteld op grond van:

      a. de Beschikking beheersovereenkomsten 1983;

      b. de Regeling beheersovereenkomsten 1988, en

      c. de Regeling beheersovereenkomsten 1993,

      blijven de desbetreffende regelingen van toepassing tot het tijdstip waarop deze van rechtswege eindigen dan wel
      subsidie wordt verleend op grond van de onderhavige regeling of de [Subsidieregeling natuurbeheer 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: 100a
    text: |-
      1 De [Regeling organisatiekosten samenwerkingsverbanden][ref1] wordt ingetrokken.

      2 Op beschikkingen tot subsidieverlening die zijn afgegeven op basis van de
      [Regeling organisatiekosten samenwerkingsverbanden][ref2] blijft die regeling van toepassing tot het tijdstip
      waarop deze van rechtswege eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0011017
      [ref2]: https://wetten.overheid.nl/BWBR0011017
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel100a
