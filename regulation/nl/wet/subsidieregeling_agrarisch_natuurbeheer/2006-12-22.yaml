  - number: '85'
    text: |-
      1 Een aanvraag tot wijziging van een beschikking tot subsidieverlening die leidt tot vergroting van het areaal van
      de aanvrager ten behoeve waarvan subsidie wordt verstrekt wordt slechts gehonoreerd indien de extra oppervlakte
      aanmerkelijk kleiner is dan de oorspronkelijke oppervlakte of niet meer dan 2 hectare bedraagt.

      2 Een aanvraag tot wijziging van een beschikking tot subsidieverlening die leidt tot verkleining van het areaal
      van de aanvrager ten behoeve waarvan subsidie wordt verstrekt wordt slechts gehonoreerd indien de verkleining het
      gevolg is van de uitvoering van een werk van algemene nutte.

      3 Een aanvraag als bedoeld in het eerste lid kan slechts eenmaal per jaar worden gedaan.

      4 In geval van een wijziging uit hoofde van het eerste of tweede lid wordt de subsidie naar evenredigheid
      verleend en vastgesteld voor het resterende gedeelte van het tijdvak of aaneengesloten tijdvakken, bedoeld in
      [artikel 26][ref1], waarvoor subsidie is verleend.

      5 De [artikelen 1 tot en met 9, eerste lid][ref2], [9a tot en met 9d][ref3] en [18 tot en met 20][ref4] zijn ten
      aanzien van een aanvraag als bedoeld in het eerste of tweede lid van overeenkomstige toepassing, met dien verstande
      dat op een aanvraag als bedoeld in het tweede lid het bepaalde in [artikel 6, vierde en vijfde lid][ref5], niet van
      toepassing is.

      6 Een aanvraag als bedoeld in het eerste lid wordt afgewezen indin de subsidie door toewijzing van dat verzoek met
      minder dan € 50,– per jaar zou toenemen.


