  - number: '42'
    text: |-
      1 De minister stelt na ontvangst van de in [artikel 41][ref1] bedoelde aanvraag de beheerssubsidie telkens vast
      binnen 8 weken, tenzij voor de beoordeling van de aanvraag een langere termijn dan 8 weken noodzakelijk is.

      2 De beheerssubsidie wordt vastgesteld overeenkomstig het bedrag dat bij de beschikking tot subsidieverlening is
      bepaald, zoals dat op grond van [artikel 7, eerste lid][ref2], door de minister is gecorrigeerd in verband met de
      werkelijke loon- en prijsontwikkeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel41
