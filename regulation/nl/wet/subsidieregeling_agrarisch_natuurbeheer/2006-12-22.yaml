  - number: '43'
    text: |-
      1 De subsidie per beheerspakket opgenomen in de [bijlagen 6 tot en met 30][ref1] wordt vastgesteld op het bedrag
      dat uit de subsidieverlening voor het desbetreffende terrein voortvloeit, verminderd met:

      a. 15%, indien niet is voldaan aan de verplichting, bedoeld in
      [artikel 38, eerste lid, onderdeel a, onderscheidenlijk onderdeel b][ref2], maar wel is voldaan aan de
      verplichting, bedoeld in [artikel 38, eerste lid, onderdeel c][ref3];

      b. 100%, indien niet is voldaan aan de verplichting, bedoeld in [artikel 38, eerste lid, onderdeel c][ref4], tenzij
      de aard en de ernst van het niet-nakomen van de genoemde verplichtingen aanleiding geven tot vermindering met een
      lager percentage;

      c. 100%, indien, voorzover van toepassing, niet is voldaan aan de verplichting, bedoeld in
      [artikel 38, eerste lid, onderdelen d en e][ref5], tenzij de aard en de ernst van het niet nakomen van de genoemde
      verplichtingen aanleiding geven tot vermindering met een lager percentage;

      d. 5%, indien niet is voldaan aan de verplichting, bedoeld in
      [artikel 38, eerste lid, onderdeel f, onderscheidenlijk g][ref6].

      2 In zoverre in afwijking van het eerste lid, onderdelen a en b, wordt de subsidie per beheerspakket opgenomen in
      de [bijlagen 19 tot en met 22][ref7], zoals die luidden tot 25 oktober 2003 vastgesteld op het bedrag dat uit de
      subsidieverlening voor het desbetreffende terrein voortvloeit, verminderd met:

      a. 15%, indien niet is voldaan aan de verplichting, bedoeld in
      [artikel 38, eerste lid, onderdeel a, onderscheidenlijk onderdeel b][ref8], maar wel:

      i. van de beheersverplichtingen, vermeld in de onderdelen 3 en 4 van het desbetreffende beheerspakket, ten minste
      50% van de percentages vermeld bij de onderscheiden beheerspakketten op de totale oppervlakte van het terrein is
      gerealiseerd;

      ii. het deel van de beheersbijdrage voor de onderdelen 3 en 4 van de onderscheiden beheerspakketten dat niet is
      besteed aan de laatstgenoemde onderdelen, is besteed aan onderdeel 5 van de onderscheiden beheerspakketten en

      iii aan de rapportageverplichting, bedoeld in onderdeel 6 van de onderscheiden beheerspakketten, is voldaan.

      b. 100%, indien niet is voldaan aan de eisen geformuleerd in onderdeel a, sub 1 tot en met 3, tenzij de aard
      en de ernst van het niet nakomen van de genoemde verplichtingen aanleiding geven tot vermindering met een lager
      percentage.

      3 De subsidie voor het beheerspakket opgenomen in [bijlage 31][ref9], zoals die luidde tot 1 oktober 2004, wordt
      overeenkomstig het eerste lid, aanhef, en onderdelen b en c, vastgesteld.

      4 De verminderingen, bedoeld in het eerste lid, onderdelen a en b, en tweede lid, worden niet toegepast voor zover
      niet is voldaan aan de verplichting, bedoeld in [artikel 38, eerste lid, onderdeel a][ref10], onderscheidenlijk
      onderdeel b of c, ten gevolge van overmacht.

      5 De verminderingen, bedoeld in het eerste lid, worden niet toegepast op de beheerssubsidie, voor zover het bedrag
      daarvan bestaat uit een verhoging op grond van [artikel 33][ref11].

      6 De verminderingen, bedoeld in het eerste en tweede lid, worden niet toegepast ten aanzien van dat deel van die
      verminderingen dat het bedrag van de beheerssubsidie te boven gaat.

      6 De verminderingen, bedoeld in het eerste en tweede lid, worden voorts niet toegepast ten aanzien van dat deel van
      die verminderingen dat het bedrag van de beheerssubsidie te boven gaat.


