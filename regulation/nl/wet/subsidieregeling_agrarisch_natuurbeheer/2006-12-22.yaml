  - number: '33'
    text: |-
      1 Indien ruige stalmest wordt uitgereden op een terrein waarvoor beheerssubsidie wordt verstrekt ten behoeve van
      de ontwikkeling of instandhouding van een beheerspakket, opgenomen in [bijlage 16][ref1], of een beheerseenheid
      als bedoeld in de [bijlagen 19 tot en met 22][ref2], waarbij het terrein wordt beheerd op een wijze als bedoeld
      in [bijlage 16][ref3], dan kan op verzoek van de beheerder de overeenkomstig [artikel 32][ref4] bepaalde
      beheerssubsidie worden verhoogd voor zover:

      a. de ruige stalmest wordt uitgereden op de oppervlakte van de desbetreffende beheerspakketten;

      b. de ruige stalmest wordt uitgereden gedurende het desbetreffende tijdvak jaarlijks in de periode tussen 1
      februari en 1 april;

      c. per hectare ten minste 10 ton en ten hoogste 20 ton ruige stalmest wordt uitgereden, en

      d. de beheerder binnen twee weken na het uitrijden van de ruige stalmest hiervan melding doet aan de directeur van
      de Dienst Regelingen met gebruikmaking van een daartoe door de directeur van de Dienst Regelingen ter beschikking
      gesteld formulier.

      2 De verhoging, bedoeld in het eerste lid, bedraagt:

      a. € 149,75 voor zover de ruige mest wordt uitgereden op land dat vanaf bedrijfsgebouwen alleen bereikbaar is via
      water;

      b. € 77,14 voor zover de ruige mest wordt uitgereden op andere grond dan bedoeld in onderdeel a.

      3 In afwijking van het eerste lid kan een beheerder die in 2004 een aanvraag heeft ingediend voor beheerssubsidie
      als bedoeld in het eerste lid en daarbij niet in aanmerking is gekomen voor de verhoging, bedoeld in het eerste
      lid, in 2005 om die verhoging verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
      [ref2]: https://wetten.overheid.nl/BWBR0011000
      [ref3]: https://wetten.overheid.nl/BWBR0011000
      [ref4]: https://wetten.overheid.nl/BWBR0011000#Artikel32
