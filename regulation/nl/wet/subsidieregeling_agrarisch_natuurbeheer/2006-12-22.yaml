        hoofdstuk: '1'
  - number: '32'
    text: |-
      1 Bij het verlenen van beheerssubsidie wordt de beheersbijdrage verhoogd met € 94,– per hectare voor zover het
      terrein is gelegen in een probleemgebied als bedoeld in [artikel 17b][ref1] indien:

      a. op het terrein een beheerspakket als bedoeld in de [bijlagen 6 tot en 18][ref2],
      [19 tot en met 22, onderdelen 5 i, ii en iii][ref3], [23 tot en met 28f][ref4] wordt ontwikkeld of in stand
      gehouden;

      b. op het terrein een beheerspakket als bedoeld in de [bijlagen 19 tot en met 22, onderdeel 4][ref5], wordt
      ontwikkeld of in stand gehouden en de beheerder zich bereid heeft verklaard te voldoen aan de verplichtingen,
      bedoeld in [artikel 38, eerste lid, onderdelen d en e][ref6];

      c. op het terrein een beheerspakket als bedoeld in [bijlage 28b][ref7] wordt ontwikkeld of in stand
      gehouden en de beheerder zich, ingeval op het terrein tevens een beheerspakket als bedoeld in de
      [bijlagen 19 tot en met 22, onderdeel 4][ref8], wordt ontwikkeld of in stand gehouden, bereid heeft verklaard te
      voldoen aan de verplichtingen, bedoeld in [artikel 38, eerste lid, onderdelen d en e][ref9].

      2 Indien op het terrein een beheerspakket wordt ontwikkeld of in stand gehouden, bedraagt de beheerssubsidie
      per tijdvak het bedrag dat wordt gevormd door de vermenigvuldiging van het getal zes met de desbetreffende
      beheersbijdrage opgenomen in de bijlage van het desbetreffende beheerspakket en het aantal hectares waarvoor
      beheerssubsidie wordt verleend.

      3 Indien op het terrein meerdere beheerspakketten worden ontwikkeld of in stand gehouden, bedraagt de
      beheerssubsidie per tijdvak de som van de bedragen die worden gevormd door de vermenigvuldiging van het getal zes
      met de desbetreffende beheersbijdragen opgenomen in de bijlage van elk van de onderscheiden beheerspakketten en het
      aantal hectares per beheerspakket waarvoor beheerssubsidie wordt verleend.

      4 Indien subsidie wordt verstrekt voor drie aaneengesloten tijdvakken wordt het bedrag van de subsidie voor elk van
      die tijdvakken bepaald met overeenkomstige toepassing van het tweede, onderscheidenlijk het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011000#Artikel17b
