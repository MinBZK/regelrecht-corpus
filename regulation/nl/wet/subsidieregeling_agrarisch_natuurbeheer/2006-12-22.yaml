  - number: 101b
    text: |-
      Het beheerspakket: Faunarand opgenomen in bijlage 23, zoals die luidde tot 25 oktober 2003, blijft voor subsidies
      die zijn aangevraagd vóór 25 oktober 2003 onverminderd van kracht tot het eind van het tijdvak waarvoor de
      desbetreffende subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel101b
  - number: 101c
    text: |-
      Op een aanvraag voor subsidie op grond van hoofdstuk 7, zoals dat luidde tot 1 oktober 2004, die is ingediend vóór
      die datum, blijven dat hoofdstuk en bijlage 31, zoals die luidde tot 1 oktober 2004, van toepassing, indien en voor
      zover het terrein ten behoeve waarvan de subsidie is aangevraagd is gelegen in een probleemgebied.
    url: https://wetten.overheid.nl/BWBR0011000/2006-12-22#Artikel101c
  - number: 101d
    text: |-
      1 Op een aanvraag voor subsidie op grond van [artikel 33][ref1] zoals dat luidt tot 1 januari 2005 die is ingediend
      vóór 1 oktober 2004 blijft [dat artikel][ref2] van toepassing.

      2 Op een aanvraag voor subsidie op grond van [artikel 33][ref3] die is ingediend vóór 1 november 2005 blijft
      [dat artikel][ref4] zoals dat luidt tot 1 november 2005 van toepassing.


