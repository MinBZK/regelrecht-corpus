  - number: '21'
    text: |-
      1 Per terrein kan voor één of meerdere beheerspakketten beheerssubsidie worden verstrekt, met dien verstande dat in
      het terrein niet meerdere beheerspakketten op dezelfde oppervlakte kunnen worden ontwikkeld of in stand gehouden.

      2 In afwijking van het eerste lid kunnen de beheerspakketten, opgenomen in
      [onderdeel 4 van de bijlagen 19 tot en met 22][ref1] en in [bijlage 28b][ref2] dan wel in de
      [bijlagen 28c tot en met 28f][ref3], op dezelfde oppervlakte worden ontwikkeld of in stand gehouden.

      3 In afwijking van het eerste lid kan het beheerspakket, opgenomen in [bijlage 28c][ref4], op dezelfde
      oppervlakte worden ontwikkeld of in stand gehouden als de beheerspakketten, opgenomen in de [bijlagen 15][ref5],
      [16][ref6], [17][ref7] en [19 tot en met 22][ref8], tenzij de beheerseenheden overeenkomstig onderdeel 3 van de
      beheerspakketten, opgenomen in de [bijlagen 19 tot en met 22][ref9], worden beheerd op een wijze als bedoeld in de
      [bijlagen 12][ref10], [13][ref11], [14][ref12] en [18][ref13].

      4 Onverminderd het eerste lid, kunnen de landschapspakketten opgenomen in de [bijlagen 36][ref14], [38][ref15],
      [40][ref16] en [46][ref17] op dezelfde oppervlakte in stand worden gehouden als de beheerspakketten opgenomen in de
      [bijlagen 6 tot en met 30][ref18].


