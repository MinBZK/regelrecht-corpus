  - number: '2'
    text: |-
      1 De hoofden van de in [bijlage C][ref1] genoemde consulaire posten zijn bevoegd tot het verstrekken van:

      a. nationale paspoorten;

      b. reisdocumenten voor vluchtelingen;

      c. reisdocumenten voor vreemdelingen;

      d. faciliteitenpaspoorten;

      e. tweede paspoorten;

      f. laissez-passers; en

      g. noodpaspoorten.

      2 De hoofden van de in [bijlage D][ref2] genoemde consulaire posten zijn bovendien bevoegd tot het verstrekken van
      Nederlandse identiteitskaarten.


      [ref1]: https://wetten.overheid.nl/BWBR0030830
      [ref2]: https://wetten.overheid.nl/BWBR0030830
    url: https://wetten.overheid.nl/BWBR0030830/2012-01-01#Artikel2
