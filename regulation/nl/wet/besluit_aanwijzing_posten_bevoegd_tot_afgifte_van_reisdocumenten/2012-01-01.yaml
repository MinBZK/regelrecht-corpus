  - number: '3'
    text: |-
      Het [besluit van de Minister van Buitenlandse Zaken van 15 juli 2009][ref1], nr. DCZ 108/09, tot aanwijzing
      van posten bevoegd tot afgifte van paspoorten of identiteitskaarten, alsmede het besluit van de Minister van
      Buitenlandse Zaken van 9 december 2009, nr. DJZ/BR/0873-2009, tot aanwijzing van posten bevoegd tot verstrekking
      van reisdocumenten en identiteitskaarten worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0026166
    url: https://wetten.overheid.nl/BWBR0030830/2012-01-01#Artikel3
