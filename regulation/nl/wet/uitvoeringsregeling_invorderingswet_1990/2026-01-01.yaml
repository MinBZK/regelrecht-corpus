  - number: 1ca
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. *betalingsvordering:* vordering van de ontvanger als bedoeld in [artikel 19, eerste lid, van de wet][ref1]
      jegens een betaaldienstverlener op wie de belastingschuldige een vordering heeft of uit een reeds bestaande
      rechtsverhouding zal verkrijgen;

      b. *overheidsvordering:* vordering als bedoeld in [artikel 19, vierde lid, van de wet][ref2];

      c. *Onze Minister:* Onze Minister van Financiën;

      d. *betaaldienstverlener:* betaaldienstverlener als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref3];

      e. *betaalrekening:* rekening bestemd voor het betalingsverkeer en ten aanzien waarvan opdrachten tot automatische
      afschrijving kunnen worden gedaan;

      f. *deelvordering:* vordering als bedoeld in [artikel 1ce, derde lid][ref4];

      g. *uitvoeringsdatum:* datum, waarop de overheidsvordering wordt uitgevoerd door de betaaldienstverlener,
      waar de belastingschuldige een rekening houdt. Deze datum wordt bepaald door de ontvanger bij het doen van de
      overheidsvordering;

      h. *bestedingsruimte:* saldo op een rekening vermeerderd met het maximale debetsaldo op die rekening dat is
      toegestaan op grond van een overeenkomst inzake krediet die tussen de betaaldienstverlener en de belastingschuldige
      is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004766#Artikel1ce
