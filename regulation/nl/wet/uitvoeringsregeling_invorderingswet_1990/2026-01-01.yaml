  - number: '29'
    text: De in rekening te brengen invorderingsrente wordt berekend over iedere betaling afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel29
  - number: '30'
    text: |-
      1 Voor de berekening van de in rekening te brengen invorderingsrente over een betaald bedrag wordt gebruik gemaakt
      van de volgende formule:

      = invorderingsrente

      2 Indien het bedrag van de betaling moet worden gesplitst in hoofdsom en invorderingsrente, wordt gebruik gemaakt
      van de volgende formules:

      = hoofdsom

      betaling - hoofdsom = invorderingsrente.

      3 In de formules wordt met A het aantal dagen aangegeven waarover invorderingsrente is verschuldigd en met P de
      onderscheiden rentepercentages welke over de verschillende periodes zijn verschuldigd.

      4 Het bedrag van de betaling wordt naar beneden afgerond op gehele euro’s.
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel30
  - number: '31'
    text: |-
      Bij de bepaling van het aantal dagen waarover invorderingsrente wordt berekend, wordt:

      a. de maand waarin de enige of laatste betalingstermijn van de aanslag vervalt, tot het werkelijke aantal dagen in
      aanmerking genomen met dien verstande dat de maand februari altijd op 28 dagen wordt gesteld;

      b. een volle maand gesteld op 30 dagen en een jaar op 360 dagen.
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel31
  - number: '32'
    text: |-
      1 Het bedrag van de in rekening te brengen invorderingsrente wordt naar beneden afgerond op gehele euro’s.

      2 Het bedrag van de te vergoeden invorderingsrente wordt naar boven afgerond op gehele euro’s.
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel32
  - number: '33'
    text: |-
      1 Bij de enige of laatste betaling wordt een bedrag aan invorderingsrente van € 49 of minder niet in rekening
      gebracht.

      2 Het bedrag, genoemd in het eerste lid, wordt elke vijf jaar bij het begin van het kalenderjaar,
      voor het eerst per 1 januari 2026, aangepast overeenkomstig de tabelcorrectiefactor, bedoeld in
      [artikel 10.2 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10.2
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10.2'
  - number: '34'
    text: |-
      Bij uitstel van betaling voor een periode van drie jaren of langer kan de ontvanger bedingen dat de in rekening te
      brengen invorderingsrente in afwijking van [artikel 29][ref1] jaarlijks wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel29
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel34
    references:
