  - number: '2'
    text: |-
      1 De ontvanger verleent de belastingschuldige op diens schriftelijk verzoek uitstel van
      betaling van de door hem verschuldigde inkomstenbelasting in gevallen als bedoeld in
      [artikel 25, achtste lid, eerste volzin, van de wet][ref1], mits voldoende zekerheid is gesteld. Het schriftelijk
      verzoek en de zekerheidstelling blijven achterwege:

      a. in geval van emigratie van de belastingschuldige naar een andere lidstaat van de Europese Unie;

      b. in geval van geconserveerd inkomen als bedoeld in
      [artikel 2.8, vierde, vijfde, zesde of zevende lid, van de Wet inkomstenbelasting 2001][ref2], waarbij de
      verkrijger van de aandelen of winstbewijzen een natuurlijk persoon is die woont in een andere lidstaat van de
      Europese Unie;

      c. ingeval de belastingschuldige woont in een andere lidstaat van de
      Europese Unie en de inkomstenbelasting is verschuldigd door de toepassing van
      [artikel 7.5, vierde, vijfde, onderscheidenlijk zevende lid, van de Wet inkomstenbelasting 2001][ref3]
      waarbij de verwervende of verkrijgende vennootschap in een andere lidstaat van de Europese Unie is gevestigd,
      onderscheidenlijk de verplaatsing van de werkelijke leiding geschiedt naar een andere lidstaat van de Europese
      Unie.

      2 In afwijking in zoverre van het eerste lid wordt voor belastingaanslagen opgelegd met toepassing van
      [artikel 2.8, zevende lid, van de Wet inkomstenbelasting 2001][ref4] uitstel van betaling verleend op schriftelijk
      verzoek van de belastingschuldige en de verkrijger gezamenlijk.

      3 De ontvanger kan voorwaarden stellen aan het verlenen van uitstel van betaling of aan het voortzetten daarvan in
      situaties als bedoeld in het zevende tot en met tiende lid, waaronder begrepen voorwaarden die betrekking hebben op
      het door de belastingschuldige:

      a. gedurende de looptijd van het uitstel jaarlijks aan de hand van schriftelijke bescheiden aannemelijk maken dat
      hij recht heeft op gehele of gedeeltelijke voortzetting van het uitstel;

      b. jaarlijks aan de ontvanger verstrekken van informatie over zijn actuele adres en werkelijke verblijfplaats.

      4 Op schriftelijk verzoek van de belastingschuldige stemt de ontvanger in met aanpassing van de gestelde zekerheid
      voor zover het bedrag van de verschuldigde inkomstenbelasting waarvoor uitstel van betaling is verleend, is
      verminderd. Indien de belastingschuldige zijn woonplaats verplaatst van een staat buiten de Europese Unie naar een
      lidstaat van de Europese Unie, stemt de ontvanger in met intrekking van de gestelde zekerheid.

      5 Het uitstel wordt verleend voor onbepaalde tijd.

      6 De ontvanger beëindigt het uitstel:

      a. ingeval aandelen of winstbewijzen die aan het uitstel ten grondslag
      liggen worden vervreemd in de zin van de [artikelen 4.12][ref5] of
      __REF001___________________________________________________________________________________________________________
      ____________________: voor zover het uitstel aan deze aandelen of winstbewijzen kan worden toegerekend;

      b. ingeval de vennootschap op de aandelen of winstbewijzen die aan het uitstel ten grondslag liggen, reserves heeft
      uitgedeeld: voor het bedrag, bedoeld in [artikel 25, achtste lid, onderdeel b, van de wet][ref7];

      c. in geval van een teruggaaf van wat op aandelen of bewijzen van deelgerechtigdheid in een fonds voor gemene
      rekening is gestort dan wel van wat door houders van winstbewijzen is gestort of ingelegd: voor zover het uitstel
      aan deze teruggaaf kan worden toegerekend.

      7 Op schriftelijk verzoek van de belastingschuldige kan in geval van een vervreemding in het kader van een
      aandelenfusie als bedoeld in [artikel 3.55 van de Wet inkomstenbelasting 2001][ref8], een splitsing als bedoeld
      in [artikel 3.56 van die wet][ref9] of een fusie als bedoeld in [artikel 3.57 van die wet][ref10], het uitstel
      worden voortgezet, in welk geval de aandelen in of de winstbewijzen van de verkrijgende vennootschap voortaan
      worden geacht aan het verleende uitstel ten grondslag te liggen.

      8 Op schriftelijk verzoek van de belanghebbende kan in geval van een vervreemding in de zin van
      [artikel 4.16, eerste lid, onderdelen e of f, van de Wet inkomstenbelasting 2001][ref11] of wegens een
      verdeling van een nalatenschap of een huwelijksgemeenschap binnen twee jaren na het overlijden van de erflater
      onderscheidenlijk na de ontbinding van de huwelijksgemeenschap het uitstel worden voortgezet. Ingeval de
      belastingaanslag inkomstenbelasting betreft ter zake van geconserveerd inkomen door de toepassing van artikel
      4.16, eerste lid, onderdeel h, van de Wet inkomstenbelasting 2001 kan het uitstel van betaling echter niet
      worden voortgezet voor zover het uitstel kan worden toegerekend aan het vervreemdingsvoordeel dat ingevolge
      [artikel 4.17a van de Wet inkomstenbelasting 2001][ref12] in aanmerking zou zijn genomen wanneer zowel de
      belastingschuldige als de verkrijger in Nederland zouden hebben gewoond ten tijde van de overgang.

      9 Op schriftelijk verzoek van de belastingschuldige kan in geval van een vervreemding in de zin van
      [artikel 4.16, eerste lid, onderdeel g, van de Wet inkomstenbelasting 2001][ref13] het uitstel worden voortgezet
      voor het gedeelte dat betrekking heeft op de nog tot het vermogen van de belastingschuldige behorende aandelen
      of winstbewijzen.

      10 Ingeval aandelen of winstbewijzen die aan het uitstel ten grondslag liggen worden geschonken kan op gezamenlijk
      schriftelijk verzoek van de belastingschuldige en de verkrijger van die aandelen of winstbewijzen, het uitstel
      van betaling worden voortgezet voor het gedeelte dat betrekking heeft op die aandelen of winstbewijzen. Ingeval
      de belastingaanslag inkomstenbelasting betreft ter zake van geconserveerd inkomen door de toepassing van
      [artikel 4.16, eerste lid, onderdeel h, van de Wet inkomstenbelasting 2001][ref14] kan het uitstel van betaling
      echter niet worden voortgezet voor zover het uitstel kan worden toegerekend aan het vervreemdingsvoordeel dat
      ingevolge [artikel 4.17c van de Wet inkomstenbelasting 2001][ref15] in aanmerking zou zijn genomen wanneer zowel de
      belastingschuldige als de verkrijger in Nederland zou hebben gewoond ten tijde van de schenking.

      11 Ingeval zich een omstandigheid voordoet als bedoeld in
      [artikel 25, achtste lid, onderdelen a, b of c, van de wet][ref16] stelt de belastingschuldige de ontvanger daarvan
      onverwijld schriftelijk in kennis.

      12 Indien de belastingschuldige niet voldoet aan de voorwaarden die de ontvanger aan het verlenen of voortzetten
      van het uitstel van betaling heeft gesteld, of aan de overige verplichtingen van dit artikel, kan de ontvanger het
      uitstel van betaling intrekken.

      13 Voor de toepassing van dit artikel wordt onder een lidstaat van de Europese Unie mede verstaan: Noorwegen,
      IJsland en Liechtenstein.

      14 Voor de toepassing van dit artikel worden onder aandelen of winstbewijzen die aan het uitstel ten grondslag
      liggen mede verstaan: aandelen of winstbewijzen waarop rechten zijn overgegaan die besloten lagen in de aandelen of
