        artikel: '29'
        hoofdstuk: III
  - number: 34a
    text: |-
      De [artikelen 30][ref1], [31][ref2] en [32][ref3] zijn van overeenkomstige toepassing met betrekking tot de
      kredietrente en de vertragingsrente.


