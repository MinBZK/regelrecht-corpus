  - number: '8'
    text: |-
      1 Geen kwijtschelding wordt verleend:

      a. voor zover het feit dat een belastingaanslag niet kan worden voldaan aan de belastingschuldige is toe te
      rekenen;

      b. indien de belastingschuldige heeft nagelaten de vereiste aangifte in te dienen;

      c. indien de belastingschuldige in surseance van betaling of in staat van faillissement verkeert, tenzij sprake is
      van een akkoord als bedoeld in de [artikelen 138][ref1], en [252 van de Faillissementswet][ref2];

      d. indien ten aanzien van de belastingschuldige de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, tenzij sprake is van een akkoord als bedoeld in [artikel 329 van de Faillissementswet][ref3], dan wel
      van een belastingaanslag voor zover die materieel verschuldigd is geworden op een tijdstip of over een tijdvak
      dat is gelegen na de uitspraak waarbij de schuldsaneringsregeling van toepassing is verklaard en niet kan worden
      aangemerkt als boedelschuld;

      e. indien de belastingschuldige een bedrijf of zelfstandig een beroep uitoefent en ook na totstandkoming van een
      akkoord, bedoeld in [artikel 21][ref4], geen reële vooruitzichten zouden bestaan voor de voortzetting van het
      bedrijf of beroep;

      f. voor een voorlopige aanslag die nog niet is gevolgd door de aanslag;

      g. indien niet aan eventueel door de ontvanger gestelde voorwaarden is voldaan;

      h. voor een belastingaanslag motorrijtuigenbelasting of belasting zware motorrijtuigen die is opgelegd binnen een
      periode van drie jaar nadat kwijtschelding van een of meer andere belastingaanslagen motorrijtuigenbelasting of
      zware motorrijtuigen is verleend.

      2 Geen kwijtschelding wordt verleend voor belastingaanslagen belasting van personenauto’s en motorrijwielen,
      voor belastingaanslagen welke zijn opgelegd wegens verschuldigde rente ingevolge de Ruilverkavelingswet
      1954, alsmede voor belastingaanslagen welke zijn opgelegd wegens verschuldigde kosten ingevolge de
      [Wet inrichting landelijk gebied][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel138
