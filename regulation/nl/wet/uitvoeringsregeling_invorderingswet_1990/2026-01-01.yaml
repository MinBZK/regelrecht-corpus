  - number: '9'
    text: |-
      1 Gedurende de behandeling van het verzoek om kwijtschelding worden voor de belastingaanslag ten aanzien waarvan
      kwijtschelding is verzocht geen conservatoire maatregelen genomen of voortgezet. Eveneens wordt gedurende die tijd
      voor die belastingaanslag de dwanginvordering niet aangevangen of voortgezet.

      2 Indien de ontvanger aannemelijk maakt dat gegronde vrees bestaat dat toepassing van het eerste lid ertoe
      zal leiden dat goederen, waarop de belastingschuld waarvan kwijtschelding is verzocht kan worden verhaald,
      zullen worden verduisterd, kan hij ondanks het verzoek om kwijtschelding conservatoire en zo nodig executoriale
      maatregelen nemen. Voor zover deze maatregelen een onherroepelijk karakter dragen is toestemming nodig van de
      directeur.
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel9
  - number: '10'
    text: |-
      Deze afdeling heeft betrekking op kwijtschelding van inkomstenbelasting verschuldigd door natuurlijke personen
      die geen bedrijf of niet zelfstandig een beroep uitoefenen, van loonbelasting verschuldigd door werknemers alsmede
      van motorrijtuigenbelasting, belasting zware motorrijtuigen, erfbelasting, schenkbelasting, recht van overgang en
      belastingen van rechtsverkeer verschuldigd door natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel10
  - number: '11'
    text: |-
      Kwijtschelding wordt verleend voor:

      a. het gehele op de belastingaanslag openstaande bedrag indien geen vermogen en geen betalingscapaciteit aanwezig
      is;

      b. het openstaande bedrag van de belastingaanslag dat resteert nadat:

      1°. het aanwezige vermogen is aangewend ter voldoening van de belastingaanslag;

      2°. ten minste 80 percent van de betalingscapaciteit is aangewend;

      een en ander onverminderd het bepaalde in [artikel 8][ref1] en [artikel 18][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004766#Artikel18
