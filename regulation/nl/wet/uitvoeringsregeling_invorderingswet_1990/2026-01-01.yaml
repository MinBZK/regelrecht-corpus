  - number: '23'
    text: |-
      Indien een natuurlijk persoon zijn bedrijf of zelfstandige beroepsuitoefening heeft gestaakt en aannemelijk is
      dat die belastingschuldige in de toekomst geen bedrijf of niet zelfstandig een beroep meer zal uitoefenen, wordt
      kwijtschelding van de belastingen, bedoeld in [artikel 20][ref1], verleend overeenkomstig het bepaalde in afdeling
      2.


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel20
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004766
        artikel: '20'
        hoofdstuk: II
        afdeling: '3'
  - number: '24'
    text: |-
      Indien de belastingschuldige zich niet kan verenigen met de beschikking, bedoeld in [artikel 7, eerste lid][ref1],
      kan hij binnen tien dagen na dagtekening van de kennisgeving waarmee de beschikking is bekendgemaakt, een
      beroepschrift richten tot de directeur onder vermelding van de gronden van het beroep. Het beroepschrift wordt
      ingediend bij de ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel7
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004766
        artikel: '7'
        hoofdstuk: II
        afdeling: '1'
  - number: '25'
    text: |-
      1 De directeur beslist op het beroep bij uitspraak.

      2 Indien de directeur geheel of gedeeltelijk aan het beroep van de belastingschuldige tegemoetkomt, stelt hij bij
      die uitspraak het bedrag van de kwijtschelding vast.

      3 De directeur maakt de uitspraak aan de belastingschuldige bekend door uitreiking of toezending van een
      gedagtekende kennisgeving terzake.
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel25
  - number: '26'
    text: |-
      1 De ontvanger verleent op schriftelijk verzoek van de aansprakelijk gestelde ontslag van de verplichting tot
      betaling van rijksbelastingen op de voet van deze afdeling.

      2 Ontslag van de verplichting tot betaling van een belastingaanslag doet niet de belastingschuld zelve teniet gaan.
      Het ontslag werkt uitsluitend ten aanzien van de aansprakelijk gestelde aan wie dat ontslag is verleend.

      3 De bepalingen van de afdelingen 1 tot en met 5 van dit hoofdstuk zijn van overeenkomstige toepassing, met dien
      verstande dat een verzoek om ontslag van betalingsverplichting van een natuurlijk persoon die geen bedrijf of
      niet zelfstandig een beroep uitoefent wordt beoordeeld met overeenkomstige toepassing van afdeling 2 ongeacht de
      belasting waarop het verzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel26
  - number: '27'
    text: |-
      Deze afdeling heeft betrekking op:

      a. provinciale belastingen als bedoeld in [hoofdstuk XV, paragraaf 2, van de Provinciewet][ref1] alsmede
      belastingen waarvan de heffing krachtens andere wetten door de provincie geschiedt;

      b. gemeentelijke belastingen als bedoeld in [hoofdstuk XV, paragraaf 2][ref2] en [3, van de Gemeentewet][ref3]
      alsmede belastingen waarvan de heffing krachtens andere wetten door de gemeente geschiedt;

      c. waterschapsbelastingen als bedoeld in [hoofdstuk XVI van de Waterschapswet][ref4] alsmede belastingen waarvan de
      heffing krachtens bijzondere wetten door het waterschap geschiedt;

      d. de geluidsheffing burgerluchtvaart ingevolge [artikel 8a.38 van de Wet luchtvaart][ref5];

      e. de verontreinigingsheffing ingevolge [artikel 7.2, eerste lid, van de Waterwet][ref6];

      alsmede op de daarmee samenhangende bestuurlijke boeten.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Paragraaf2
