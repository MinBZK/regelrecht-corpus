  - number: 40i
    text: |-
      De ontvanger kan een op grond van [artikel 70ca van de wet][ref1] gegeven kwijtscheldingsbeschikking intrekken
      indien de gegevens die op grond van [artikel 12c van het Uitvoeringsbesluit loonbelasting 1965][ref2] zoals dat
      artikel luidde op 31 december 2019 aan de Belastingdienst zijn verstrekt, onjuist of onvolledig blijken te zijn.


