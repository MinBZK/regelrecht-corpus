  - number: 40a
    text: |-
      Als goederen als bedoeld in [artikel 42c van de wet][ref1] worden de volgende goederen aangewezen, de toebehoren en
      onderdelen van die goederen daaronder begrepen:

      a. telecommunicatie- en computerapparatuur en -programmatuur;

      b. foto-, film-, video- en geluidsapparatuur alsmede beeld- en geluiddragers zoals video- en muziekcassettes en
      compactdiscs en digitale videodiscs;

      c. landvoertuigen die zijn uitgerust met een motor van meer dan 48 cc cilinderinhoud of met een vermogen van meer
      dan 7,2 kW.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel42c
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel40a
