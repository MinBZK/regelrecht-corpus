  - number: 6e
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder belastingschuld verstaan het gezamenlijke bedrag van:

      a. belastingaanslagen inkomstenbelasting en motorrijtuigenbelasting verschuldigd door natuurlijke personen die geen
      bedrijf of zelfstandig beroep uitoefenen;

      b. terugvorderingen in de zin van de [Algemene wet inkomensafhankelijke regelingen][ref1] verschuldigd door
      natuurlijke personen.


      [ref1]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel6e
    references:
      - id: ref1
        bwb_id: BWBR0018472
  - number: 6f
    text: |-
      1 Op verzoek van de belastingschuldige stelt de ontvanger hem in de gelegenheid om zijn belastingschuld te betalen
      in maximaal 12 maandelijkse gelijke termijnen van minimaal € 50.

      2 Indien de betalingscapaciteit van de belastingschuldige ontoereikend is om zijn belastingschuld binnen 12
      maanden te voldoen, kan de ontvanger op verzoek van de belastingschuldige, in afwijking in zoverre van het eerste
      lid, een betalingsregeling toestaan van maximaal 24 maanden, gebaseerd op de betalingscapaciteit, bedoeld in
      [artikel 13][ref1].

      3 De betalingsregeling, bedoeld in het eerste en tweede lid, wordt verleend onder de voorwaarde dat de
      belastingschuldige de ontvanger, binnen een door de ontvanger te stellen termijn, machtigt tot automatische
      incasso van de maandelijkse termijnen en vangt aan op het moment waarop de machtiging tot automatische incasso
      is ontvangen.

      4 Indien in de betalingsregeling, bedoeld in het eerste en tweede lid, een motorrijtuigenbelastingschuld is
      begrepen, stelt de ontvanger tevens de voorwaarde dat de belastingschuldige een machtiging tot automatische incasso
      verleent voor toekomstige verplichtingen tot betaling van motorrijtuigenbelasting ter zake van alle kentekens die
      op zijn naam zijn gesteld ten tijde van het aangaan van de betalingsregeling.

      5 Een betalingsregeling als bedoeld in het tweede lid wordt niet toegestaan indien de belastingschuldige of diens
      echtgenoot, bedoeld in artikel 3 van de Participatiewet, over voldoende vermogen als bedoeld in [artikel 12][ref2]
      beschikt voor de voldoening van de schuld, voor zover dit vermogen op eenvoudige wijze liquide is te maken.

      6 De ontvanger kan een verzoek om een betalingsregeling als bedoeld in het tweede lid afwijzen of een op grond van
      het tweede lid verleend uitstel van betaling intrekken, indien het ontstaan van de schuld, of een deel daarvan, is
      te wijten aan opzet of grove schuld van de belastingschuldige.

      7 De ontvanger kan een verzoek om een betalingsregeling als bedoeld in het eerste en tweede lid afwijzen of een op
      grond van het eerste of tweede lid verleend uitstel van betaling intrekken, indien:

      a. de belastingschuldige in staat van surseance van betaling verkeert;

      b. de belastingschuldige in staat van faillissement verkeert;

      c. ten aanzien van de belastingschuldige de schuldsaneringsregeling natuurlijke personen van toepassing is;

      d. er ter zake van de belastingschuld waarvoor uitstel van betaling wordt verzocht reeds een vordering als bedoeld
      in [artikel 19 van de wet][ref3] is gedaan of beslag is gelegd.

      8 Indien de belastingschuldige gedurende de looptijd van een betalingsregeling als bedoeld in het eerste en tweede
      lid om een betalingsregeling verzoekt voor een belastingschuld die niet reeds in de lopende betalingsregeling
      is opgenomen, verleent de ontvanger voor het saldo van de op dat moment openstaande belastingschulden een nieuwe
      betalingsregeling onder de voorwaarden, genoemd in de vorige leden.

      9 De ontvanger beëindigt het uitstel van betaling indien een maandelijkse termijnbetaling niet tijdig of niet
      volledig wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004766#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel19
