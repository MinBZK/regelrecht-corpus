        bwb_id: BWBR0004770
        artikel: 42c
  - number: 40b
    text: |-
      1 Ingeval een lijfrenteverplichting in een situatie als bedoeld in
      [artikel 3.133, tweede lid, onderdeel h, van de Wet inkomstenbelasting 2001][ref1] overgaat of, beoordeeld aan
      het einde van het kalenderjaar, is overgegaan op een niet in Nederland gevestigd pensioenfonds of lichaam dat het
      verzekeringsbedrijf uitoefent, kan de ontvanger onder door hem te stellen voorwaarden aan de verzekeraar die op
      grond van [artikel 44a, eerste lid, van de wet][ref2] aansprakelijk is een schriftelijke verklaring doen toekomen
      inhoudende een onherroepelijke mededeling dat de aansprakelijkheid niet langer geldt voor de in dat artikel
      bedoelde inkomstenbelasting en revisierente.

      2 Indien de lijfrenteverplichting is overgegaan op een niet in een van de lidstaten van de Europese Unie,
      in Noorwegen, in IJsland, in Liechtenstein of in Zwitserland gevestigd pensioenfonds of lichaam geeft de
      ontvanger de in het eerste lid bedoelde verklaring af op schriftelijk verzoek van de verzekeraar die op
      grond van [artikel 44a, eerste lid, van de wet][ref3] aansprakelijk is, mits het pensioenfonds of lichaam
      zich bij overeenkomst garant stelt voor de voldoening van de in artikel 44a, eerste lid, van de wet bedoelde
      inkomstenbelasting en revisierente.

      3 Het tweede lid is van overeenkomstige toepassing indien de verzekeringnemer of de gerechtigde voldoende zekerheid
      heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.133
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel44a
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel44a
