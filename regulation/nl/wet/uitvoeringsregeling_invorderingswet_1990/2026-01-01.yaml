  - number: 1cbis.1
    text: |-
      1 De betaaldienstverlener op wie de belastingschuldige een vordering heeft uit hoofde van een tegoed op een betaal-
      of spaarrekening is gehouden aan een met inachtneming van de [artikelen 1cbis.2 tot en met 1cbis.4][ref1] gedane
      betalingsvordering te voldoen door betaling van de belastingaanslagen uit dat tegoed, indien op het tijdstip van de
      bekendmaking van de beschikking, bedoeld in [artikel 1cbis.3][ref2]:

      a. het tegoed direct opeisbaar is; of

      b. de ontvanger het tegoed door opzegging opeisbaar kan maken.

      2 [Artikel 477, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref3] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel1cbis.2
      [ref2]: https://wetten.overheid.nl/BWBR0004766#Artikel1cbis.3
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel477
