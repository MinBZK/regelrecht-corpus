  - number: 1cbis.2
    text: |-
      1 Een betalingsvordering vanwege belastingaanslagen van een belastingschuldige, zijnde een natuurlijk persoon,
      strekt zich niet uit tot:

      a. het bedrag, genoemd in
      [artikel 475da, eerste lid, onderdeel a, van het Wetboek van Burgerlijke Rechtsvordering][ref1], voor een
      alleenstaande als bedoeld in [artikel 4, eerste lid, onderdeel a, van de Participatiewet][ref2];

      b. het bedrag, genoemd in
      [artikel 475da, eerste lid, onderdeel b, van het Wetboek van Burgerlijke Rechtsvordering][ref3], voor een
      alleenstaande ouder als bedoeld in [artikel 4, eerste lid, onderdeel b, van de Participatiewet][ref4];

      c. het bedrag, genoemd in
      [artikel 475da, eerste lid, onderdeel c, van het Wetboek van Burgerlijke Rechtsvordering][ref5], voor
      een gehuwde als bedoeld in [artikel 3 van de Participatiewet][ref6] zonder kinderen als bedoeld in
      [artikel 4, eerste lid, onderdeel e, van die wet][ref7];

      d. het bedrag, genoemd in
      [artikel 475da, eerste lid, onderdeel d, van het Wetboek van Burgerlijke Rechtsvordering][ref8], voor een
      gehuwde als bedoeld in [artikel 3 van de Participatiewet][ref9] met een of meer kinderen als bedoeld in
      [artikel 4, eerste lid, onderdeel e, van die wet][ref10].

      2 De betalingsvordering vanwege belastingaanslagen van een belastingschuldige, zijnde een natuurlijk persoon,
      die op grond van de basisregistratie personen geen adres in Nederland heeft en geen vaste woon- of verblijfplaats
      buiten Nederland heeft, strekt zich niet uit tot de helft van het bedrag, genoemd in het eerste lid, onderdeel c.
      Indien de belastingschuldige, bedoeld in de eerste zin, buiten Nederland een vaste woon- of verblijfplaats heeft,
      vindt het eerste lid geen toepassing. Op verzoek van de belastingschuldige, bedoeld in de eerste en tweede zin,
      kan de ontvanger het eerste lid overeenkomstig toepassen op basis van de door de belastingschuldige bij het verzoek
      over zijn leefsituatie verstrekte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475da
