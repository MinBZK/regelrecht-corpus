      1 De ontvanger verleent de belastingschuldige op diens schriftelijk verzoek uitstel van
      betaling voor belastingaanslagen betreffende de inkomstenbelasting in de gevallen bedoeld in
      [artikel 25, achttiende lid, van de wet][ref1], mits wordt ingestemd met door de ontvanger nader te stellen
      voorwaarden en een afschrift is overgelegd van de overeenkomst waarbij de onderneming of een gedeelte van de
      onderneming is overgedragen aan de natuurlijk persoon die de overdrachtsprijs geheel of gedeeltelijk schuldig is
      gebleven. Uit deze overeenkomst moet blijken welk deel van de overdrachtsprijs schuldig is gebleven, wat de duur
      van de overeengekomen aflossingsperiode is en in welke termijnen de overdrachtsprijs wordt voldaan.

      2 Ingeval zich een omstandigheid voordoet als bedoeld in
      [artikel 25, negentiende lid, tweede volzin, onderdelen a of b, of derde volzin, van de wet][ref2] stelt de
      belastingschuldige de ontvanger daarvan onverwijld schriftelijk in kennis.

      3 Ingeval de overdrachtsprijs geheel of gedeeltelijk versneld wordt afgelost, stelt de belastingschuldige
      de ontvanger daarvan onverwijld schriftelijk in kennis alsmede van het nog niet ontvangen deel van de
      overdrachtsprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
