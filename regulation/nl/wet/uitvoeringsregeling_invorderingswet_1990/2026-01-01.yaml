  - number: '13'
    text: |-
      1 Onder betalingscapaciteit, bedoeld in [artikel 11][ref1], wordt verstaan het positieve verschil in de periode
      van 12 maanden vanaf de datum waarop het verzoek om kwijtschelding is ingediend van het gemiddeld per maand
      te verwachten netto-besteedbare inkomen van de belastingschuldige in die periode en de gemiddeld per maand te
      verwachten kosten van bestaan in die periode.

      2 Het netto-besteedbare inkomen van de belastingschuldige, bedoeld in het eerste lid, wordt vermeerderd
      met het gemiddeld per maand te verwachten netto-besteedbare inkomen in de periode van twaalf maanden
      vanaf de datum waarop het verzoek om kwijtschelding is ingediend van zijn echtgenoot, bedoeld in
      [artikel 3 van de Participatiewet][ref2].


