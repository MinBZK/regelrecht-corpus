  - number: '18'
    text: |-
      Geen kwijtschelding wordt verleend ten belope van het bedrag van de te betalen belasting waarop het verzoek
      betrekking heeft waarvan aannemelijk is dat dit bedrag kan worden voldaan omdat:

      a. binnen twee jaren na het verzoek als gevolg van sterk wisselende inkomens een hoger inkomen is te verwachten; of

      b. binnen een jaar na het verzoek een verbetering in de financiële omstandigheden is te verwachten; of

      c. binnen een jaar na het verzoek een belastingteruggaaf, anders dan de voorlopige teruggaaf, bedoeld in
      [artikel 14, tweede lid][ref1], kan worden verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel14
