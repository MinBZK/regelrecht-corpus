  - number: 1cbis.4
    text: |-
      1 Zodra 14 dagen zijn verstreken na de bekendmaking van de beschikking, bedoeld in
      [artikel 1cbis.3, tweede lid][ref1], doet de betaaldienstverlener opgave aan de ontvanger
      door het afleggen van een verklaring in een door de ontvanger bij de beschikking verstrekt
      verklaringsformulier, dan wel in een formulier van gelijke strekking van de betaaldienstverlener.
      [Artikel 476a, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] is van overeenkomstige
      toepassing.

      2 Binnen 14 dagen na ontvangst van het ingevulde verklaringsformulier, bedoeld in het eerste lid, zendt
      de ontvanger aan de betaaldienstverlener een bericht over de hoogte van het te betalen bedrag en de
      in verband daarmee te gebruiken betalingsgegevens, een bericht over het opeisbaar maken, bedoeld in
      [artikel 1cbis.1, eerste lid, onderdeel b][ref3], of een bericht over het intrekken van de beschikking. Een
      betaling door de betaaldienstverlener geschiedt binnen 14 dagen na de dagtekening van het bericht over het te
      betalen bedrag of, ingeval dat bedrag nog door opzegging opeisbaar moet worden gemaakt, binnen 14 dagen nadat dat
      bedrag feitelijk beschikbaar is om door de betaaldienstverlener te worden betaald. De verzending van een bericht
      aan de betaaldienstverlener door de ontvanger blijft achterwege als uit het ingevulde verklaringsformulier, bedoeld
      in het eerste lid, blijkt dat de belastingschuldige geen vordering heeft op de betaaldienstverlener uit hoofde
      van een tegoed op een betaal- of spaarrekening of als het bedrag van die vordering niet meer beloopt dan het ten
      aanzien van de belastingschuldige van toepassing zijnde bedrag, bedoeld in [artikel 1cbis.2, eerste lid][ref4],
      tenzij de betaaldienstverlener of de ontvanger verzending van een bericht wenselijk acht.

      3 De verzending van het verklaringsformulier en de verzending van de berichten die hiermee samenhangen geschieden
      op dezelfde wijze als de wijze waarop de beschikking, bedoeld in [artikel 1cbis.3, eerste lid][ref5], is verzonden.

      4 De ontvanger informeert de belastingschuldige zo spoedig mogelijk schriftelijk over een wijziging van zijn
      belastingschuld als gevolg van een betaling door de betaaldienstverlener of over het intrekken van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel1cbis.3
