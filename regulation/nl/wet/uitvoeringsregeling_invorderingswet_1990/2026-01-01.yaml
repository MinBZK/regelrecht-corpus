  - number: '7'
    text: |-
      1 De ontvanger verleent de belastingschuldige op diens schriftelijk verzoek bij voor administratief
      beroep vatbare beschikking kwijtschelding van de door hem verschuldigde rijksbelastingen in andere
      gevallen dan die, bedoeld in de [hoofdstukken IB][ref1] en [IC][ref2], op de voet van deze afdeling en de
      [afdelingen 2 tot en met 5 van dit hoofdstuk][ref3].

      2 Voor de toepassing van dit hoofdstuk worden de belastingrente, de revisierente en de bestuurlijke boeten die
      de belastingschuldige heeft belopen in verband met de in dit hoofdstuk bedoelde belastingen, gelijkgesteld met de
      belastingen waarmee zij samenhangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004766#HoofdstukIB
