  - number: 40c
    text: |-
      1 Ingeval een verplichting ingevolge een pensioenregeling in een situatie als bedoeld in
      [artikel 19b, zesde lid, van de Wet op de loonbelasting 1964][ref1] overgaat op een niet in Nederland gevestigd
      pensioenfonds of lichaam dat het verzekeringsbedrijf uitoefent, kan de ontvanger onder door hem te stellen
      voorwaarden aan de verzekeraar die op grond van [artikel 44b, eerste lid, van de wet][ref2] aansprakelijk is een
      schriftelijke verklaring doen toekomen inhoudende een onherroepelijke mededeling dat de aansprakelijkheid niet
      langer geldt voor de in [dat artikel][ref3] bedoelde loon- en inkomstenbelasting alsmede revisierente.

      2 Indien de pensioenverplichting is overgegaan op een niet in een van de lidstaten van de Europese Unie,
      in Noorwegen, in IJsland, in Liechtenstein of in Zwitserland gevestigd pensioenfonds of lichaam geeft de
      ontvanger de in het eerste lid bedoelde verklaring af op schriftelijk verzoek van de verzekeraar die op grond
      van [artikel 44b, eerste lid, van de wet][ref4] aansprakelijk is, mits het pensioenfonds of lichaam zich bij
      overeenkomst garant stelt voor de voldoening van de in artikel 44b, eerste lid, van de wet bedoelde loon- en
      inkomstenbelasting alsmede revisierente.

      3 Het tweede lid is van overeenkomstige toepassing indien de verzekeringnemer of de gerechtigde voldoende zekerheid
      heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
