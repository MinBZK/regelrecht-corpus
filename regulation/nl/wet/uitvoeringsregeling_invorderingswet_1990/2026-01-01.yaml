  - number: 1cb
    text: |-
      Onze Minister sluit een overeenkomst inzake de overheidsvordering met de bank waar de rekening wordt gehouden
      waarop de bedragen ingevorderd op grond van [artikel 19, vierde lid, van de wet][ref1] worden overgemaakt. De
      overeenkomst bevat in ieder geval de bepalingen die zijn opgenomen in de bijlage bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel1cb
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
  - number: 1cc
    text: |-
      De overheidsvordering wordt gedaan op een betaalrekening die op naam of mede op naam staat van de
      belastingschuldige.
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel1cc
  - number: 1cd
    text: |-
      De beschikking, bedoeld in [artikel 19, vijfde lid, van de wet][ref1], wordt elektronisch bekend gemaakt aan de
      betaaldienstverlener, waar de belastingschuldige een betaalrekening houdt. De overheidsvordering wordt uitsluitend
      uitgevoerd volgens de Europese systematiek van automatische afschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel1cd
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
  - number: 1ce
    text: |-
      1 De overheidsvordering bedraagt ten hoogste € 500 en wordt gedaan bij een belastingaanslag met een openstaand
      bedrag van ten hoogste € 1.500, voor ten hoogste tweemaal in een kalendermaand per belastingaanslag.

      2 De overheidsvordering wordt bij dezelfde belastingaanslag gedurende een aaneengesloten periode van ten hoogste
      drie kalendermaanden gedaan.

      3 De overheidsvordering kan worden gesplitst in verschillende deelvorderingen. Deze deelvorderingen worden op
      hetzelfde tijdstip bekend gemaakt aan de bank, bedoeld in [artikel 1cb][ref1].

      4 De overheidsvordering of, indien deze is gesplitst, de deelvordering wordt uitgevoerd indien de bestedingsruimte
      op de betaalrekening op de uitvoeringsdatum toereikend is.


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel1cb
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel1ce
    references:
      - id: ref1
        bwb_id: BWBR0004766
        artikel: 1cb
        hoofdstuk: IA
        afdeling: '2'
  - number: 1cf
    text: |-
      1 De betaaldienstverlener, waar de belastingschuldige een betaalrekening houdt, is bevoegd tot terugboeking
      van het bedrag van de overheidsvordering of, indien deze is gesplitst, de deelvordering, indien blijkt dat de
      bestedingsruimte op de betaalrekening van de belastingschuldige op de uitvoeringsdatum ontoereikend is. Deze
      bevoegdheid vervalt na vijf werkdagen volgend op de uitvoeringsdatum.

      2 Werkdagen, in de zin van het eerste lid, zijn alle kalenderdagen, met uitzondering van de zaterdag en zondag, de
      Nieuwjaarsdag, de Goede Vrijdag, de tweede Paasdag, 1 mei en de beide Kerstdagen.
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel1cf
  - number: 1cg
    text: |-
      De betaaldienstverlener, waar de belastingschuldige een betaalrekening houdt, vermeldt op het papieren of
      elektronische afschrift van de af- of terugboeking op de betaalrekening van de belastingschuldige, de door de
      ontvanger bij het doen van de overheidsvordering geleverde gegevens.
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel1cg
  - number: 1ch
    text: |-
      De ontvanger informeert de belastingschuldige schriftelijk over de op zijn betaalrekening uitgevoerde
      overheidsvordering of, indien deze is gesplitst, deelvordering binnen zeven dagen nadat de termijn, genoemd in
      [artikel 1cf, eerste lid, tweede volzin][ref1], is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel1cf
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel1ch
    references:
      - id: ref1
        bwb_id: BWBR0004766
        artikel: 1cf
        hoofdstuk: IA
        afdeling: '3'
  - number: 1ci
    text: |-
      De mededeling, bedoeld in [artikel 22bis, tweede en derde lid, van de wet][ref1], geschiedt door het invullen
      van het daartoe langs elektronische weg ter beschikking gestelde modelformulier en het per post aan de ontvanger
      toezenden van het ingevulde modelformulier.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel22bis
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel1ci
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: 22bis
  - number: 1cj
    text: |-
      De drempel, bedoeld in [artikel 22bis, negentiende lid, van de wet][ref1], bedraagt € 10 000.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel22bis
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel1cj
