  - number: '20'
    text: |-
      Deze afdeling heeft betrekking op kwijtschelding van inkomstenbelasting verschuldigd door natuurlijke
      personen die een bedrijf of zelfstandig een beroep uitoefenen, van vennootschapsbelasting, van loonbelasting
      verschuldigd door werkgevers, van omzetbelasting, dividendbelasting, kansspelbelasting, motorrijtuigenbelasting,
      belasting zware motorrijtuigen, accijnzen, verbruiksbelastingen van alcoholvrije dranken, van de in
      [artikel 1 van de Wet belastingen op milieugrondslag][ref1] genoemde belastingen en van erfbelasting,
      schenkbelasting, recht van overgang en belastingen van rechtsverkeer verschuldigd door rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0007168#Artikel1
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007168
        artikel: '1'
  - number: '21'
    text: |-
      Kwijtschelding wordt uitsluitend verleend indien dit geschiedt in het kader van een akkoord met alle schuldeisers
      en er geen redelijke mogelijkheid aanwezig is om een derde aansprakelijk te stellen.
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel21
  - number: '22'
    text: |-
      Medewerking van de ontvanger aan een akkoord geschiedt slechts indien:

      a. het te ontvangen deel van de belastingschuld:

      1°. ten minste het dubbele percentage bedraagt van hetgeen aan concurrente schuldeisers op hun vorderingen zal
      worden uitgekeerd;

      2°. een substantiële omvang heeft, zowel absoluut als in relatie tot de totale belastingschuld;

      3°. van ten minste dezelfde omvang is als kan worden verkregen door middel van executiemaatregelen;

      b. de ontvanger noch in uitkeringspercentage noch in tempo van betaling wordt achtergesteld bij gelijkbevoorrechte
      schuldeisers;

      c. fiscale verplichtingen die opkomen tijdens de behandeling van het verzoek om kwijtschelding tijdig en volledig
      worden nagekomen;

      d. bij voortzetting van het bedrijf of zelfstandig beroep van de belastingschuldige na de totstandkoming van het
      akkoord reële vooruitzichten aanwezig zijn voor de voortzetting van de onderneming.
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel22
  - number: 22a
    text: |-
      [Artikel 19a][ref1] is van overeenkomstige toepassing met dien verstande dat in plaats van ,,de
      [artikelen 10 tot en met 19][ref2]” wordt gelezen: de [artikelen 20 tot en met 22][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel19a
