        bwb_id: BWBR0015703
        artikel: '3'
  - number: 19a
    text: |-
      1 Indien ten aanzien van de belastingschuldige de schuldsaneringsregeling natuurlijke personen van toepassing
      is verklaard en deze overeenkomstig [artikel 329 van de Faillissementswet][ref1] een akkoord aanbiedt,
      verleent de ontvanger, de [artikelen 8, eerste lid, onderdelen a, b, e, f, g en h, en tweede lid][ref2], en
      [10 tot en met 19][ref3] buiten toepassing latend, zijn medewerking aan de totstandkoming van dat akkoord, mits:

      1°. het te ontvangen deel van de belastingschuld of belastingschulden ten minste het dubbele percentage bedraagt
      van hetgeen aan concurrente schuldeisers op hun vorderingen zal worden uitgekeerd en van ten minste dezelfde omvang
      is als kan worden verkregen indien de schuldsaneringsregeling zou worden voortgezet;

      2°. reële vooruitzichten aanwezig zijn dat de belastingschuldige in staat is de fiscale verplichtingen die opkomen
      na het tijdstip waarop de schuldsaneringsregeling natuurlijke personen ten aanzien van hem van toepassing is
      verklaard, tijdig en volledig na te komen;

      3°. de ontvanger noch in uitkeringspercentage noch in tempo van betaling wordt achtergesteld bij gelijkbevoorrechte
      schuldeisers, een en ander onder de voorwaarde dat het vonnis van homologatie van het akkoord in kracht van
      gewijsde zal gaan.

      2 Het eerste lid is, uitgezonderd hetgeen daarin met betrekking tot homologatie is vermeld, van overeenkomstige
      toepassing op een buitengerechtelijk akkoord dat wordt aangeboden in gevallen waarin, naar redelijkerwijs mag
      worden aangenomen, de belastingschuldige, afgezien van de daarvoor te vervullen formaliteiten, in aanmerking zou
      komen voor de toepassing van een schuldregeling als bedoeld in [artikel 287a van de Faillissementswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel329
      [ref2]: https://wetten.overheid.nl/BWBR0004766#Artikel8
