      1 De ontvanger verleent de belastingschuldige op diens schriftelijk verzoek kwijtschelding
      van de door hem verschuldigde inkomstenbelasting in de gevallen als bedoeld in
      [artikel 26, tweede, vierde of vijfde lid, van de wet][ref1] en tot een omvang als in die leden bedoeld, met dien
      verstande dat het bedrag van de kwijtschelding in totaal niet meer kan bedragen dan het bedrag van de belasting
      waarvoor ter zake van het aandeel of winstbewijs uitstel van betaling is verleend.

      2 In afwijking van het eerste lid is voor kwijtschelding als bedoeld in
      [artikel 26, vijfde lid, eerste volzin, onderdeel c, van de wet][ref2] geen schriftelijk verzoek
      nodig indien de belastingschuldige op het moment dat zich een omstandigheid voordoet als bedoeld in
      [artikel 25, achtste lid, onderdeel a, van de wet][ref3], in een andere lidstaat van de Europese Unie of in
      Noorwegen, IJsland of Liechtenstein woont.


