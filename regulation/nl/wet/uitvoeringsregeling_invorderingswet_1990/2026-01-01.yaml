        artikel: 22bis
  - number: 1d
    text: |-
      1 De ontvanger verleent de belastingschuldige op diens schriftelijk verzoek uitstel
      van betaling voor belastingaanslagen betreffende de inkomstenbelasting, bedoeld in
      [artikel 25, vierde lid, eerste volzin, van de wet][ref1], mits wordt ingestemd met door de ontvanger nader te
      stellen voorwaarden.

      2 Het uitstel eindigt uiterlijk op de dag waarop sedert de vervaldag van de voor de belastingaanslag geldende
      enige of laatste betalingstermijn 12 maanden zijn verstreken, dan wel, ingeval de uitsteltermijn is verlengd, die
      verlengde termijn is verstreken.

      3 Ingeval zich een omstandigheid voordoet als bedoeld in [artikel 25, vierde lid, tweede volzin, van de wet][ref2]
      stelt de belastingschuldige de ontvanger daarvan onverwijld schriftelijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
