    text: |-
      1 De ontvanger verleent de belastingschuldige op diens schriftelijk verzoek uitstel van betaling van de door hem
      verschuldigde inkomstenbelasting in gevallen als bedoeld in [artikel 25, negende lid, van de wet][ref1] en tot
      een omvang als bij [dat artikel][ref2] alsmede krachtens dat artikel in de navolgende leden is bepaald, mits wordt
      ingestemd met door de ontvanger nader te stellen voorwaarden.

      2 Het uitstel wordt verleend voor het bedrag aan belasting dat kan worden toegerekend aan het voordeel wegens de
      vervreemding, bedoeld in [artikel 25, negende lid, van de wet][ref3], mits dat bedrag € 3.350 te boven gaat.

      3 Het uitstel houdt in dat de verschuldigde belasting kan worden voldaan in tien gelijke jaarlijkse termijnen,
      waarvan de eerste termijn zes weken na de dagtekening van het aanslagbiljet vervalt en elk van de volgende
      termijnen telkens een jaar later.

      4 De ontvanger vermindert het bedrag waarvoor uitstel van betaling is verleend:

      a. ingeval in een kalenderjaar aflossingen op de schuldig gebleven tegenprestatie plaatsvinden welke gezamenlijk
      uitgaan boven het dubbele van de belasting die in dat jaar op de voet van het derde lid moet worden voldaan: voor
      de helft van hetgeen er boven uitgaat;

      b. ingeval aandelen of winstbewijzen welke aan het uitstel ten grondslag liggen worden vervreemd in de zin van
      [artikel 25, tiende lid, van de wet][ref4]: voor zover het uitstel aan deze aandelen of winstbewijzen kan worden
      toegerekend;

      c. ingeval in een kalenderjaar uit de aandelen of winstbewijzen welke aan het uitstel ten grondslag liggen
      reguliere voordelen - als bedoeld in de [Wet inkomstenbelasting 2001][ref5] - worden genoten welke uitgaan boven
      het dubbele van de belasting die in dat jaar op de voet van het derde lid moet worden voldaan: voor de helft van
      hetgeen er boven uitgaat.

      5 Voor zover een vervreemdingsvoordeel of een regulier voordeel binnen zes maanden wordt aangewend voor een
      aflossing op de schuldig gebleven tegenprestatie, wordt alleen de aflossing in aanmerking genomen voor de
      toepassing van het vierde lid.

      6 Ingeval zich een omstandigheid voordoet als bedoeld in het vierde lid stelt de belastingschuldige de ontvanger
      daarvan onverwijld schriftelijk in kennis.

      7 Voor de toepassing van [artikel 25, negende lid, van de wet][ref6] worden van de staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte aangewezen: IJsland, Noorwegen en Liechtenstein.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
