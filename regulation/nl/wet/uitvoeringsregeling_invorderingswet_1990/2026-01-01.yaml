  - number: 1e
    text: |-
      1 De ontvanger verleent de belastingschuldige op diens schriftelijk verzoek uitstel
      van betaling voor belastingaanslagen betreffende de inkomstenbelasting, bedoeld in
      [artikel 25, vijfde lid, eerste volzin, van de wet][ref1], mits voldoende zekerheid is gesteld en wordt ingestemd
      met de door de ontvanger nader te stellen voorwaarden.

      2 Voor het verlenen van uitstel van betaling als bedoeld in het eerste lid is geen schriftelijk verzoek nodig en
      blijft zekerheidstelling achterwege voorzover de verschuldigde belasting betrekking heeft op:

      a. aanspraken uit een overeenkomst van levensverzekering of een pensioenregeling als bedoeld in
      [artikel 1.7 van de Wet inkomstenbelasting 2001][ref2] die zijn ondergebracht bij een in Nederland gevestigde
      verzekeraar die bevoegd is het directe verzekeringsbedrijf, bedoeld in de [Wet op het financieel toezicht][ref3],
      uit te oefenen en die de lijfrente of pensioenverplichting rekent tot het binnenlandse
      ondernemingsvermogen, dan wel zijn ondergebracht bij een in Nederland gevestigd lichaam dat ingevolge
      [artikel 5, eerste lid, onderdeel b, van de Wet op de vennootschapsbelasting 1969][ref4] is vrijgesteld van de
      vennootschapsbelasting;

      b. aanspraken uit een overeenkomst van levensverzekering of een pensioenregeling als bedoeld in
      [artikel 1.7 van de Wet inkomstenbelasting 2001][ref5] die zijn ondergebracht bij een verzekeraar die is gevestigd
      in een andere lidstaat van de Europese Unie, in Noorwegen, in IJsland, in Liechtenstein of in Zwitserland en die in
      die staat bevoegd is tot het uitoefenen van het directe verzekeringsbedrijf;

      c. aanspraken ingevolge een pensioenregeling als bedoeld in
      [artikel 38n van de Wet op de loonbelasting 1964][ref6] of een oudedagsverplichting als bedoeld in
      [artikel 38p van de Wet op de loonbelasting 1964][ref7] die zijn ondergebracht bij een lichaam als bedoeld in
      [artikel 19a, eerste lid, onderdeel d, onderscheidenlijk onderdeel e, van die wet][ref8] zoals dat artikel
      luidde op 31 december 2016, waarbij dit lichaam als verzekeraar optreedt en is gevestigd in Nederland, een andere
      lidstaat van de Europese Unie, in Noorwegen, in IJsland, in Liechtenstein of in Zwitserland.

      3 Het uitstel eindigt uiterlijk op de eerste dag van het tiende jaar na afloop van het kalenderjaar waarop de
      belastingaanslag betrekking heeft.

      4 Ingeval zich een omstandigheid voordoet als bedoeld in [artikel 25, vijfde lid, vierde volzin, van de wet][ref9]
      stelt de belastingschuldige de ontvanger daarvan onverwijld schriftelijk in kennis.

      5 De ontvanger beëindigt het uitstel voorzover zich met betrekking tot aanspraken uit een overeenkomst van
      levensverzekering of een pensioenregeling als bedoeld in [artikel 1.7 van de Wet inkomstenbelasting 2001][ref10]
      waarop de verschuldigde belasting, bedoeld in [artikel 25, vijfde lid, eerste volzin, van de wet][ref11] betrekking
      heeft, een omstandigheid voordoet als bedoeld in [artikel 25, vijfde lid, vierde volzin, van de wet][ref12]. De
      eerste zin is van overeenkomstige toepassing op aanspraken bedoeld in het tweede lid, onderdeel c.


