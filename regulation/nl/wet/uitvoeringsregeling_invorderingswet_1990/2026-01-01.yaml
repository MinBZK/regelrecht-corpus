  - number: 28a
    text: |-
      Met betrekking tot een verzoek om ontslag van de verplichting tot betaling van de in [artikel 27][ref1] genoemde
      belastingen en heffingen zijn afdeling 6 en artikel 28, tweede lid, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004766#Artikel27
