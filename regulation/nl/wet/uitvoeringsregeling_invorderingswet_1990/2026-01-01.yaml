  - number: 1f
    text: |-
      1 Indien de ontvanger het op de voet van [artikel 1e][ref1] verleende uitstel van betaling beëindigt omdat zich een
      in [artikel 26, derde lid, van de wet][ref2] bedoelde omstandigheid voordoet, verleent hij op schriftelijk verzoek
      van de belastingschuldige kwijtschelding van inkomstenbelasting tot een omvang als in genoemd derde lid bedoeld.

      2 In de gevallen waarin op de voet van [artikel 1e, derde lid][ref3], het uitstel van betaling is geëindigd,
      verleent de ontvanger de belastingschuldige op diens schriftelijk verzoek kwijtschelding van belasting tot een
      bedrag gelijk aan het dan nog openstaande bedrag.

      3 In afwijking van het eerste lid is voor kwijtschelding als bedoeld in
      [artikel 26, derde lid, eerste volzin, onderdeel a, van de wet][ref4] geen schriftelijk verzoek
      nodig indien de belastingschuldige op het moment dat zich een omstandigheid voordoet als bedoeld in
      [artikel 25, vijfde lid, vierde volzin, van de wet][ref5], in een andere lidstaat van de Europese Unie of in
      Noorwegen, in IJsland, in Liechtenstein of in Zwitserland woont.


