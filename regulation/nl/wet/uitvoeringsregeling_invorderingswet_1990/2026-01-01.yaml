  - number: '19'
    text: |-
      Het vermogen en de betalingscapaciteit van zijn echtgenoot, bedoeld in [artikel 3 van de Participatiewet][ref1],
      wordt buiten beschouwing gelaten voor zover een door de belastingschuldige gedaan verzoek om kwijtschelding
      betrekking heeft op belastingschulden die zijn ontstaan voor de aanvang van de gezamenlijke huishouding.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel3
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel19
