  - number: '28'
    text: |-
      1 Met betrekking tot een verzoek om kwijtschelding van de in [artikel 27][ref1] genoemde belastingen en heffingen
      verschuldigd door:

      a. een natuurlijk persoon die geen bedrijf of niet zelfstandig een beroep uitoefent, zijn de [afdelingen 1][ref2],
      [2][ref3] en [5][ref4] van overeenkomstige toepassing;

      b. een natuurlijk persoon die een bedrijf of zelfstandig een beroep uitoefent, zijn de
      [afdelingen 1][ref5], [3][ref6], [4][ref7] en [5][ref8] van overeenkomstige toepassing, met
      dien verstande dat indien door de provinciale staten, de gemeenteraad of het algemeen bestuur van
      het waterschap daartoe is besloten, met betrekking tot een verzoek om kwijtschelding van de in
      [artikel 27, onderdeel a, onderdeel b, onderscheidenlijk onderdeel c][ref9], bedoelde belastingen en heffingen
      die geen verband houden met de uitoefening van dat bedrijf of beroep, de [afdelingen 1][ref10], [2][ref11] en
      [5][ref12] van overeenkomstige toepassing zijn;

      c. een rechtspersoon zijn de [afdelingen 1][ref13], [3][ref14] en [5][ref15] van overeenkomstige toepassing.

      2 Waar in [artikel 9, tweede lid][ref16], en in [afdeling 5][ref17] sprake is van directeur wordt voor:

      a. provinciale belastingen gelezen: gedeputeerde staten;

      b. gemeentelijke belastingen gelezen: het college van burgemeester en wethouders;

      c. waterschapsbelastingen gelezen: het dagelijks bestuur;

      d. de geluidsheffing burgerluchtvaart gelezen: de inspecteur-generaal van de Inspectie Verkeer en Waterstaat.

      3 Indien door de provinciale staten, de gemeenteraad of het algemeen bestuur van het
      waterschap daartoe is besloten, worden met betrekking tot een verzoek om kwijtschelding van
      de in [artikel 27, onderdeel a, onderdeel b, onderscheidenlijk onderdeel c][ref18], bedoelde
      belastingen en heffingen in afwijking van het eerste lid, onderdelen a en b, als uitgaven
      als bedoeld in [artikel 15, eerste lid][ref19], mede in aanmerking genomen de overeenkomstig
      [artikel 1.7, eerste en tweede lid, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref20]
      bepaalde kosten van kinderopvang verminderd met de kinderopvangtoeslag of met de tegemoetkoming van de gemeente
      of het Uitvoeringsinstituut werknemersverzekeringen in de te betalen kosten van kinderopvang, bedoeld in
      [hoofdstuk 1, afdeling 2, van die wet][ref21].


