  - number: '14'
    text: |-
      1 Onder het netto-besteedbare inkomen, bedoeld in [artikel 13][ref1], wordt verstaan het met de in
      [artikel 15, eerste lid][ref2], vermelde uitgaven verminderde gezamenlijke bedrag van:

      a. de aan inhouding van loonbelasting/premie voor de volksverzekeringen onderworpen inkomsten verminderd
      met de wettelijke inhoudingen, zonder rekening te houden met de daarbij eventueel in mindering gebrachte
      jonggehandicaptenkorting, bedoeld in [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref3], en de ingehouden
      pensioenpremies, bijdragen ingevolge een levensloopregeling en premies ziektekostenverzekering;

      b. uitkeringen voor levensonderhoud ingevolge de [artikelen 157][ref4], [158][ref5] of
      [404 van Boek 1 van het Burgerlijk Wetboek][ref6];

      c. overige inkomsten met uitzondering van:

      1°. de uitkeringen ingevolge de [Algemene Kinderbijslagwet][ref7];

      2°.

      3°. de kinderopvangtoeslag, bedoeld in
      [hoofdstuk 1, afdeling 2, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref8], en de
      tegemoetkomingen ingevolge de [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref9];

      4°. de premie, bedoeld in [artikel 31, tweede lid, onderdeel j, van de Participatiewet][ref10], alsmede een
      daarmee naar aard, strekking en omvang overeenkomende premie;

      5°. de individuele inkomenstoeslag, bedoeld in [artikel 36 van de Participatiewet][ref11];

      6°. de vergoeding voor de verzorging en opvoeding van een pleegkind in het kader van de [Jeugdwet][ref12];

      7°. het kindgebonden budget, bedoeld in de [Wet op het kindgebonden budget][ref13];

      8°. de huurtoeslag, bedoeld in [artikel 1, onderdeel e, van de Wet op de huurtoeslag][ref14], de
      krachtens de [Participatiewet][ref15] ontvangen woonkostentoeslag en de zorgtoeslag, bedoeld in
      [artikel 1, onderdeel e, van de Wet op de zorgtoeslag][ref16];

      9°. de inkomsten uit arbeid, bedoeld in
      [artikel 31, tweede lid, onderdelen n, r, y, z en aa, van de Participatiewet][ref17],
      en inkomen uit arbeid dat ingevolge
      __REF001___________________________________________________________________________________________________________
      _____________________________________________ en
      __REF002___________________________________________________________________________________________________________
      ___________________________________________________ niet als inkomen uit arbeid wordt beschouwd;

      10°. een kostenvergoeding voor het verrichten van vrijwilligerswerk tot ten hoogste de bedragen, genoemd in
      [artikel 2, zesde lid, van de Wet op de loonbelasting 1964][ref20].

      2 Tot de inkomsten, bedoeld in het eerste lid, onderdeel c, wordt ook gerekend de voorlopige teruggaaf, bedoeld in
      [artikel 13, tweede lid, van de Algemene wet inzake rijksbelastingen][ref21], daaronder begrepen de aanspraak op
      een zodanige teruggaaf.


