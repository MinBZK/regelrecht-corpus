  - number: '12'
    text: |-
      1 Onder vermogen als bedoeld in [artikel 11][ref1] wordt verstaan de waarde in het economische verkeer van de
      bezittingen van de belastingschuldige en van zijn echtgenoot, bedoeld in [artikel 3 van de Participatiewet][ref2],
      verminderd met de schulden van de belastingschuldige en deze persoon die hoger bevoorrecht zijn dan de
      rijksbelastingen.

      2 Onder bezittingen wordt niet begrepen:

      a. de inboedel voor zover deze niet bovenmatig is;

      b. rechten op kapitaalsuitkeringen of prestaties uit levensverzekering, uitsluitend bestaande uit een
      kapitaaluitkering bij overlijden van de belastingschuldige of zijn echtgenoot, mits deze kapitaaluitkering is
      bestemd voor de verzorging van de uitvaart van de belastingschuldige of zijn echtgenoot, dan wel op prestaties in
      natura ter zake van de verzorging van een uitvaart van de belastingschuldige of zijn echtgenoot;

      c. een auto die op het moment van het verzoek een waarde heeft van € 3.350 of minder; een auto met een waarde van
      meer dan € 3.350 wordt niet als vermogen beschouwd indien jegens de ontvanger aannemelijk kan worden gemaakt dat
      die auto absoluut onmisbaar is voor de uitoefening van een beroep dan wel absoluut onmisbaar is in verband met
      invaliditeit;

      d. het totale bedrag aan financiële middelen, andere dan de onder f bedoelde, voor zover dat bedrag de ingevolge
      [artikel 16][ref3] in aanmerking te nemen kosten van bestaan vermeerderd met een bedrag ter grootte van het per
      maand gemiddelde bedrag van de uitgaven bedoeld in [artikel 15, eerste lid, onderdelen b, c en g][ref4], niet te
      boven gaat, met dien verstande dat geen rekening wordt gehouden met de in die onderdelen bedoelde vermindering met
      ontvangen huurtoeslag of woonkostentoeslag, zorgtoeslag, onderscheidenlijk kindgebonden budget;

      e. het bedrag op een bankrekening dat in het kader van de [Wet studiefinanciering 2000][ref5] of de
      [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref6] is verkregen in de vorm van leningen;

      f. een bedrag van € 3.350 aan financiële middelen per persoon voor personen die op 31 december 1999 de leeftijd van
      65 jaar hebben bereikt;

      g. de ingevolge een levensloopregeling opgebouwde voorziening;

      h. een oudedagsvoorziening in de vorm van een levens- of spaarverzekering of lijfrente voor zover deze niet
      bovenmatig is.

      3 Onder waarde, bedoeld in het tweede lid, onderdeel c, wordt verstaan de prijs die de autohandel bereid is te
      betalen bij inkoop zonder gelijktijdige verkoop van een andere auto.

      4 Indien de uitgaven, bedoeld in [artikel 15, eerste lid, onderdelen b en c][ref7], verschuldigd zijn over een
      termijn van langer dan een maand wordt in plaats van het per maand gemiddelde bedrag in aanmerking genomen het deel
      van het termijnbedrag voor zover dat, gelet op de vervaldatum van de termijnbetaling, op het moment van het verzoek
      om kwijtschelding redelijkerwijs kan worden aangemerkt als reservering voor die termijnbetaling.

      5 Een bezitting van de belastingschuldige en zijn echtgenoot, bedoeld in [artikel 3 van de Participatiewet][ref8],
      wordt buiten beschouwing gelaten indien het onredelijk bezwarend is deze terstond liquide te maken, mits een bedrag
      gelijk aan de waarde in het economische verkeer van de betreffende bezitting, verminderd met de op die bezitting
      betrekking hebbende schulden van de belastingschuldige en zijn echtgenoot die hoger bevoorrecht zijn dan de
      rijksbelastingen, is of wordt voldaan binnen een door de ontvanger gestelde termijn en volgens de door de ontvanger
      gestelde voorwaarden.


