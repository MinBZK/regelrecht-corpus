  - number: '15'
    text: |-
      1 Als uitgaven als bedoeld in [artikel 14, eerste lid][ref1], worden in aanmerking genomen:

      a. betalingen op belastingschulden, met uitzondering van die genoemd in
      [artikel 8, tweede lid][ref2], en betalingen op terugvorderingen van tegemoetkomingen als bedoeld in
      [artikel 2, eerste lid, aanhef en onderdeel h, van de Algemene wet inkomensafhankelijke regelingen][ref3];

      b. het bedrag van de voor rekening van de belastingschuldige komende nettowoonlasten tot maximaal het bedrag,
      genoemd in [artikel 13, eerste lid, onderdeel a, van de Wet op de huurtoeslag][ref4], voorzover dit meer is dan
      het bedrag dat gelijk is aan de basishuur, genoemd in [artikel 16 van die wet][ref5], waarbij deze basishuur
      is gebaseerd op het bedrag, genoemd in [artikel 17, tweede lid, van die wet][ref6], met in achtneming van een
      correctie op de basishuur als bedoeld in [artikel 1 van de Wet verlaging eigen bijdrage huurtoeslag][ref7];

      c. de niet door de werkgever ingehouden premies ziektekostenverzekering, de premie voor een
      zorgverzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref8] en de premie
      voor verzekering ingevolge de [Wet langdurige zorg][ref9], verminderd met de normpremie, bedoeld in
      [artikel 2 van de Wet op de zorgtoeslag][ref10], voor zover reeds begrepen in de bijstandsnorm zoals die voor
      de belastingschuldige geldt ingevolge [artikel 16][ref11], en met de krachtens de [Wet op de zorgtoeslag][ref12]
      ontvangen zorgtoeslag;

      d. betaalde uitkeringen voor levensonderhoud ingevolge de [artikelen 157][ref13], [158][ref14] of
      [404 van Boek 1 van het Burgerlijk Wetboek][ref15];

      e. aflossingen op leningen voor zover die zijn aangewend voor de betaling van belastingschulden, met uitzondering
      van die genoemd in [artikel 8, tweede lid][ref16];

      f. de met het houden van kostgangers verbonden kosten tot een totaal van € 16,20 per dag, met dien verstande dat
      bij de bepaling van het aantal dagen een volle maand op 30 dagen wordt gesteld;

      g. uitgaven voor het levensonderhoud van kinderen, vastgesteld op het verschil tussen het maximale
      bedrag waarop de belastingschuldige, zijn toetsingsinkomen buiten beschouwing latend, op grond van
      [artikel 2 van de Wet op het kindgebonden budget][ref17] aanspraak zou kunnen maken en het bedrag van de krachtens
      die [wet][ref18] te ontvangen kindgebonden budget;

      h. andere uitgaven van de belastingschuldige dan genoemd in dit lid, die naar het oordeel van de ontvanger
      redelijkerwijs niet buiten beschouwing kunnen worden gelaten bij het vaststellen van het netto-besteedbare inkomen,
      omdat deze uitgaven door de ontvanger noodzakelijk worden geacht.

      2 Onder betalingen op belastingschulden wordt mede begrepen een betaling ter zake van premie
      voor de volksverzekeringen en ter zake van de inkomensafhankelijke bijdrage, bedoeld in
      [artikel 41 van de Zorgverzekeringswet][ref19].

      3 Onder nettowoonlasten wordt verstaan: de op de belastingschuldige drukkende huurprijs, bedoeld in
      [artikel 5, eerste lid, van de Wet op de huurtoeslag][ref20], dan wel hypotheekrente en erfpachtcanon ter zake van
      een door hem bewoonde woning voor zover deze hem voor gebruik ter beschikking staat, verminderd met de te ontvangen
      huurtoeslag, bedoeld in [artikel 1, onderdeel e, van die wet][ref21], of met de te ontvangen woonkostentoeslag.

      4 Indien de belastingschuldige zijn woning deelt met een of meer personen op wie de norm, bedoeld in
      [artikel 22a van de Participatiewet][ref22], van toepassing is, worden de nettowoonlasten, bedoeld in het eerste
      lid, onderdeel b, geacht gelijkelijk over ieder van deze personen te zijn verdeeld.


