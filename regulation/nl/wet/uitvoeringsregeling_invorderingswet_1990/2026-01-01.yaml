  - number: 1c
    text: |-
      De ontvanger maakt een ingevolge deze regeling ten aanzien van een belastingschuldige genomen beschikking aan deze
      bekend door uitreiking of toezending van een gedagtekende kennisgeving terzake.
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel1c
  - number: 1cbis
    text: |-
      Het bedrag, bedoeld in [artikel 18, vijfde lid, van de wet][ref1], wordt gesteld op € 2.000.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel18
