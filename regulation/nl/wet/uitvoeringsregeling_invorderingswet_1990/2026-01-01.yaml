  - number: 1cbis.3
    text: |-
      1 De beschikking, bedoeld in [artikel 19, vijfde lid, van de wet][ref1], vermeldt welke van de bedragen, genoemd
      in [artikel 1cbis.2][ref2], ten aanzien van de belastingschuldige van toepassing is en wordt verzonden aan de
      betaaldienstverlener waar de belastingschuldige volgens de administratie van de Belastingdienst een betaal- of
      spaarrekening aanhoudt.

      2 Verzending van de beschikking geschiedt per post tenzij de betaaldienstverlener en de Belastingdienst zijn
      overeengekomen dat de beschikking uitsluitend elektronisch wordt verzonden. Bij elektronische verzending van de
      beschikking geldt het tijdstip van ontvangst van de gegevens die de betaaldienstverlener in staat stellen kennis
      te nemen van de inhoud van de beschikking als het tijdstip van bekendmaking van de beschikking. Bij verzending van
      de beschikking per post geldt het tijdstip van aanvang van de verwerking tot uitvoering van de beschikking door de
      betaaldienstverlener als het tijdstip van bekendmaking van de beschikking.

      3 Binnen 8 dagen na de verzending van de beschikking aan de betaaldienstverlener informeert de ontvanger de
      belastingschuldige schriftelijk over het feit dat een betalingsvordering is gedaan en over het ten aanzien van hem
      van toepassing zijnde bedrag, bedoeld in [artikel 1cbis.2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004766#Artikel1cbis.2
      [ref3]: https://wetten.overheid.nl/BWBR0004766#Artikel1cbis.2
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel1cbis.3
