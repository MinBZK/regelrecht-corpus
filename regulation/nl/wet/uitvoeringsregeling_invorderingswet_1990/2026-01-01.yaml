  - number: '16'
    text: |-
      1 De kosten van bestaan, bedoeld in [artikel 13, eerste lid][ref1], bedragen voor een belastingschuldige die wordt
      aangemerkt als:

      a. een echtgenoot als bedoeld in [artikel 3 van de Participatiewet][ref2]: 90 percent van de bijstandsnorm, bedoeld
      in [artikel 21, onderdeel b, van die wet][ref3];

      b. een alleenstaande of een alleenstaande ouder als bedoeld in
      [artikel 4, eerste lid, onderdeel a, onderscheidenlijk onderdeel b, van de Participatiewet][ref4]: 90 percent van
      de bijstandsnorm, bedoeld in [artikel 21, onderdeel a, van die wet][ref5].

      2 De kosten van bestaan, bedoeld in [artikel 13, eerste lid][ref6], bedragen, in afwijking van het eerste lid, voor
      een belastingschuldige die wordt aangemerkt als:

      a. een echtgenoot als bedoeld in [artikel 3 van de Participatiewet][ref7], die, afgezien van zijn echtgenoot,
      niet met een of meer andere personen op wie de kostendelersnorm, bedoeld in [artikel 22a van die wet][ref8], van
      toepassing is, in dezelfde woning zijn hoofdverblijf heeft en:

      1°. die tezamen met zijn echtgenoot de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref9], heeft bereikt: 90 percent van de norm, bedoeld in
      [artikel 22, onderdeel b, van de Participatiewet][ref10];

      2°. die alleen of waarvan de echtgenoot de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref11], heeft bereikt: 90 percent van de norm, bedoeld in
      [artikel 22, onderdeel c, van de Participatiewet][ref12];

      b. een echtgenoot als bedoeld in [artikel 3 van de Participatiewet][ref13], die zijn woning deelt met zijn
      echtgenoot en met een of meer andere personen op wie de norm, bedoeld in [artikel 22a van die wet][ref14], van
      toepassing is: 90 percent van de som van de norm, bedoeld in artikel 22a, eerste lid, van die wet, die voor ieder
      van de echtgenoten afzonderlijk geldt;

      c. een alleenstaande of een alleenstaande ouder als bedoeld in
      [artikel 4, eerste lid, onderdeel a, onderscheidenlijk onderdeel b, van de Participatiewet][ref15], die
      niet met een of meer personen op wie de norm, bedoeld in [artikel 22a van die wet][ref16], van toepassing
      is, in dezelfde woning zijn hoofdverblijf heeft en die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref17], heeft bereikt: 90 percent van de norm, bedoeld in
      [artikel 22, onderdeel a, van de Participatiewet][ref18];

      d. een alleenstaande of een alleenstaande ouder als bedoeld in
      [artikel 4, eerste lid, onderdeel a, onderscheidenlijk onderdeel b, van de Participatiewet][ref19], die zijn woning
      deelt met een of meer personen op wie de norm, bedoeld in [artikel 22a van die wet][ref20], van toepassing is: 90
      percent van de norm, bedoeld in artikel 22a, eerste lid, van die wet.

      3 De kosten van bestaan, bedoeld in [artikel 13, eerste lid][ref21], bedragen, in afwijking van de vorige leden,
      voor de belastingschuldige die ter verzorging of verpleging in een daartoe bestemde inrichting is opgenomen: de
      prijs die is verschuldigd voor verzorging dan wel verpleging, verhoogd met twee derden van de op hem van toepassing
      zijnde bijstandsnorm, genoemd in [artikel 23 van de Participatiewet][ref22].

      4 De kosten van bestaan, bedoeld in [artikel 13, eerste lid][ref23], worden voor
      de belastingschuldige die buiten Nederland woont aangepast met het percentage dat in
      [artikel 1 van de Regeling woonlandbeginsel in de sociale zekerheid 2012][ref24] en de bijlage bij die regeling is
      opgenomen voor het woonland van de belastingschuldige.


