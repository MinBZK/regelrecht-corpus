  - number: 1a
    text: |-
      Op het bezwaar, beroep, hoger beroep en beroep in cassatie inzake een in deze regeling als voor bezwaar vatbaar
      aangeduide beschikking is [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige
      toepassing, met dien verstande dat voor ‘inspecteur’ wordt gelezen ‘ontvanger’.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004766/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 1b
    text: |-
      1 Verzoeken tot uitstel van betaling, tot kwijtschelding of tot ontslag van betalingsverplichting ingevolge deze
      regeling worden afgewezen door de ontvanger indien de voor de beoordeling van het daartoe strekkende verzoek
      benodigde gegevens niet, onjuist of onvolledig dan wel niet op de door de ontvanger aangegeven wijze zijn
      verstrekt.

      2 Een ingevolge de [hoofdstukken 1B][ref1], [1C][ref2], [1D][ref3] en [1F][ref4] te nemen besluit tot afwijzing,
      verlening of herziening van uitstel van betaling of van kwijtschelding of een ingevolge die hoofdstukken of het
      derde lid te nemen besluit tot gehele of gedeeltelijke beëindiging van uitstel van betaling, geschiedt bij voor
      bezwaar vatbare beschikking.

      3 Indien bij vermindering van een belastingaanslag het bedrag waarvoor op de voet van het
      [eerste lid van de artikelen 1d][ref5], [1e][ref6], [2][ref7], [3][ref8], [3a][ref9], [4a][ref10], [5][ref11],
      [5a][ref12], [6a][ref13], [6b][ref14], [6c][ref15], [6d][ref16], [6da][ref17] en [40g][ref18] uitstel van betaling
      is verleend, wijziging ondergaat, beëindigt de ontvanger, met inachtneming van het bepaalde in de genoemde
      artikelen, het uitstel dienovereenkomstig.


