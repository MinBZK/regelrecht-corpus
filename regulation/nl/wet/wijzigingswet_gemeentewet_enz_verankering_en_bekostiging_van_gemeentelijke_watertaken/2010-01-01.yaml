  - number: V
    text: |-
      1 De [onderdelen A tot en met D van artikel II][ref1] treden in werking met ingang van 22 december 2006. Indien
      het Staatsblad waarin deze wet wordt geplaatst, wordt uitgegeven na 21 december 2006, treden genoemde onderdelen in
      werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin de wet wordt geplaatst.

      2 De overige bepalingen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor
      de verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.


