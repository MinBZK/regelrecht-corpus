preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot de zorg voor het
    afvloeiend hemelwater en het grondwater in stedelijk gebied, alsmede nadere regels te stellen met betrekking tot de
    zorg voor het afvalwater, en dat wordt voorzien in een bijbehorend bekostigingsinstrument;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022391/2010-01-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      1 Uiterlijk binnen vijf jaar na het tijdstip van inwerkingtreding van [artikel III, onderdeel B][ref1],
      van deze wet stelt de gemeenteraad een gemeentelijk rioleringsplan vast dat voldoet aan
      [artikel 4.22, tweede lid, van de Wet milieubeheer][ref2] zoals gewijzigd door deze wet.

      2 [Artikel 4.22, tweede lid, onderdeel a, van de Wet milieubeheer][ref3], zoals dat luidde
      voor het tijdstip, bedoeld in het eerste lid, blijft, zolang de in het eerste lid genoemde
      termijn niet is verstreken, van toepassing op een gemeentelijk rioleringsplan, als bedoeld in
      [artikel 4.22, eerste lid, van de Wet milieubeheer][ref4], dat uiterlijk binnen die termijn is vastgesteld en niet
      voldoet aan [artikel 4.22, tweede lid, van de Wet milieubeheer][ref5], zoals gewijzigd door deze wet.


