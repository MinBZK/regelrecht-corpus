---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_grondafhandeling_luchtvaartterreinen
regulatory_layer: WET
publication_date: '2024-12-17'
valid_from: '2009-10-31'
bwb_id: BWBR0009365
url: https://wetten.overheid.nl/BWBR0009365/2009-10-31
preamble:
  text: |-
    Gelet op Richtlijn nr. 96/67/EG van de Raad van de Europese Unie van 15 oktober 1996 betreffende de toegang tot
    de grondafhandelingsmarkt op de luchthavens van de Gemeenschap (PbEG L 272/36), en op artikel 132a van de Regeling
    Toezicht Luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
             gebruiker:

              iedere natuurlijke persoon of rechtspersoon die van of naar een luchthaven door de lucht passagiers, post
      of vracht vervoert;



            b
            grondafhandelingsdiensten:

              de in de bijlage bij [Richtlijn nr. 96/67](31996L0067)/-EG van de Raad van de Europese Unie van 15 oktober
      1996 betreffende de toegang tot de grondafhandelingsmarkt op de luchthavens van de Gemeenschap (PbEG L 272/36)
      genoemde diensten die op een luchthaven aan een gebruiker worden verleend;



            c
            zelfafhandelingsdiensten:

              grondafhandelingsdiensten welke een gebruiker voor zichzelf verricht, zonder dat hij enige overeenkomst tot
      het aan hem verlenen van zodanige diensten is aangegaan, behoudens in gevallen dat hij een overeenkomst tot het aan
      hem verlenen van grondafhandelingsdiensten is aangegaan met een andere gebruiker waarin hij een meerderheidsbelang
      heeft of waarin een natuurlijke persoon of rechtspersoon die in de eerstgenoemde gebruiker een meerderheidsbelang
      heeft, een meerderheidsbelang heeft;



            d
            verlener van grondafhandelingsdiensten:

              iedere natuurlijke persoon of rechtspersoon die een of meer categorieën grondafhandelingsdiensten verleent;



            e
             de Minister:

              de Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 8a.1, vierde lid, van de Wet luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
  - number: '3.1'
    text: |-
      Op elke luchthaven in Nederland die voor burgerluchtvaart is opengesteld met een jaarlijkse verkeersomvang van
      tenminste 2 miljoen passagiersbewegingen of 50000 ton vracht kunnen de gebruikers met ingang van 1 januari 2001
      zelfafhandelingsdiensten verrichten.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel3
  - number: '3.2'
    text: 'In afwijking van het eerste lid kan de Minister voor de categorieën afhandelingsdiensten:'
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel3
  - number: 3.2.a
    text: bagageafhandeling;
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel3
  - number: 3.2.b
    text: platformafhandeling;
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel3
  - number: 3.2.c
    text: brandstof- en olielevering, of
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel3
  - number: 3.2.d
    text: |-
      vracht- en postafhandeling, voor wat betreft de fysieke afhandeling van vracht en post tussen gebouwen op de
      luchthaven en het vliegtuig, zowel bij aankomst en vertrek als bij doorgaande vluchten,
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel3
  - number: '5.1'
    text: |-
      Op elke luchthaven in Nederland die voor burgerluchtvaart is opengesteld met een jaarlijkse verkeersomvang van
      tenminste 2 miljoen passagiersbewegingen of 50000 ton vracht kunnen verleners van grondafhandelingsdiensten met
      ingang van 1 januari 2001 grondafhandelingsdiensten verlenen.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel5
  - number: '5.2'
    text: 'In afwijking van het eerste lid kan de Minister voor de categorieën afhandelingsdiensten:'
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel5
  - number: 5.2.a
    text: bagageafhandeling;
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel5
  - number: 5.2.b
    text: platformafhandeling;
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel5
  - number: 5.2.c
    text: brandstof- en olielevering, of
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel5
  - number: 5.2.d
    text: |-
      vracht- en postafhandeling, voor wat betreft de fysieke afhandeling van vracht en post tussen gebouwen op de
      luchthaven en het vliegtuig, zowel bij aankomst en vertrek als bij doorgaande vluchten,
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel5
  - number: '5.3'
    text: |-
      Bij toepassing van het tweede lid beperkt de Minister het aantal verleners van grondafhandelingsdiensten zodanig
      dat:
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel5
  - number: 5.3.a
    text: 'tenminste een van hen niet rechtstreeks of onrechtstreeks onder de zeggenschap valt van:'
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel5
  - number: 5.3.a.1
    text: de exploitant van de luchthaven;
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel5
  - number: 5.3.a.2
    text: |-
      een gebruiker die in de loop van het jaar voorafgaande aan dat waarin tot de in het tweede lid bedoelde beperking
      is overgegaan, meer dan 25 procent van de op de luchthaven geregistreerde passagiers of vracht heeft vervoerd, of
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel5
  - number: 5.3.a.3
    text: |-
      een lichaam dat rechtstreeks of onrechtstreeks zeggenschap uitoefent over of onder zeggenschap valt van de
      exploitant van de luchthaven of van een gebruiker als onder 2 bedoeld, en
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel5
  - number: 5.3.b
    text: |-
      elke gebruiker ongeacht het deel van de luchthaven dat aan hem is toegewezen, voor elke categorie
      grondafhandelingsdiensten waarvoor een beperking geldt, de keuze heeft tussen niet minder dan twee verleners van
      grondafhandelingsdiensten.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel5
  - number: '6'
    text: |-
      Indien op een luchthaven als bedoeld in [artikel 5, eerste lid][ref1], de in [dat artikel][ref2] genoemde minima
      aan verkeersomvang voor vracht worden bereikt zonder dat de in [dat artikel][ref3] genoemde minima voor het
      passagiersvervoer worden bereikt, is [dat artikel][ref4] niet van toepassing voor grondafhandelingsdiensten die
      uitsluitend voor passagiers zijn bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0009365#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009365#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009365#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0009365#Artikel5
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009365
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009365
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0009365
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0009365
        artikel: '5'
  - number: '7.1'
    text: |-
      Indien de exploitant van de luchthaven, de gebruiker of de verlener van grondafhandelingsdiensten op een
      luchthaven grondafhandelingsdiensten verleent is deze verplicht ten aanzien van het verlenen van deze diensten een
      afzonderlijke boekhouding te voeren.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel7
  - number: '7.2'
    text: |-
      De Minister houdt toezicht op de naleving van de in het eerste lid bedoelde verplichting. Hij ziet er in het
      bijzonder op toe dat er in het beheer der gelden een scheiding bestaat tussen de exploitatie van de luchthaven en
      de aldaar door de exploitant van die luchthaven verleende grondafhandelingsdiensten.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel7
  - number: '8.1'
    text: |-
      Voor elke luchthaven in Nederland die voor burgerluchtvaart is opengesteld wordt door de exploitant van de
      luchthaven een overlegorgaan van gebruikers ingesteld.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel8
  - number: '8.2'
    text: |-
      Iedere gebruiker kan van het overlegorgaan deel uitmaken of zich in dat orgaan door een representatieve
      gebruikersorganisatie doen vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel8
  - number: '9.1'
    text: |-
      De exploitant van de luchthaven overlegt tenminste een maal per jaar met het in [artikel 8][ref1] genoemde
      overlegorgaan van gebruikers en met de verleners van grondafhandelingsdiensten op de luchthaven en voorts telkens
      als daarom door dat overlegorgaan of door de meerderheid van de verleners van grondafhandelingsdiensten wordt
      verzocht, over de toepassing van deze regeling en in het bijzonder over de prijzen van de grondafhandelingsdiensten
      welke met toepassing van [artikel 11, eerste lid, onderdeel b][ref2], door slechts een enkele verlener van zodanige
      diensten worden verricht en over de organisatie van de verlening van die diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0009365#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009365#Artikel11
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009365
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0009365
        artikel: '11'
  - number: '9.2'
    text: |-
      De exploitant van de luchthaven stelt het overlegorgaan van gebruikers zo spoedig mogelijk in kennis van besluiten
      als in [artikel 12, derde en vierde lid][ref1], en [artikel 13][ref2] bedoeld, alsmede van andere besluiten inzake
      de grondafhandelingsmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009365#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009365#Artikel13
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009365
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0009365
        artikel: '13'
  - number: '10.1'
    text: |-
      De Minister kan, na overleg met de exploitant van de luchthaven, de gebruikers en de verleners van
      grondafhandelingsdiensten, besluiten dat op een luchthaven in Nederland dat voor burgerluchtvaart is opengesteld
      de exploitant van de luchthaven of een ander door de Minister aangewezen lichaam een of meer centrale voorzieningen
      beheert die bestemd zijn voor het verlenen van grondafhandelingsdiensten, die wegens hun complexiteit, kosten,
      gevolgen voor het milieu of om redenen van orde en veiligheid niet kunnen worden verdeeld of opgesplitst.
      Gebruikers die zelfafhandelingsdiensten verrichtten en verleners van grondafhandelingsdiensten zijn verplicht van
      deze voorzieningen gebruik te maken.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel10
  - number: '10.2'
    text: |-
      De Minister ziet er op toe dat het beheer van de in het eerste lid bedoelde centrale voorzieningen op
      transparante, objectieve en niet-discriminerende wijze geschiedt en geen belemmering vormt voor gebruikers die
      zelfafhandelingsdiensten verrichten of voor verleners van grondafhandelingsdiensten.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel10
  - number: '11.1'
    text: |-
      Indien op een luchthaven specifieke belemmeringen met betrekking tot de beschikbare ruimte of capaciteit toepassing
      van de [artikelen 3][ref1] of [5][ref2] onmogelijk maken, kan de Minister op verzoek van de exploitant van de
      luchthaven:


      [ref1]: https://wetten.overheid.nl/BWBR0009365#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009365#Artikel5
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009365
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009365
        artikel: '5'
  - number: 11.1.a
    text: |-
      het aantal verleners van grondafhandelingsdiensten voor een of meer andere categorieën grondafhandelingsdiensten
      dan die bedoeld in [artikel 5, tweede lid][ref1], op de luchthaven in zijn geheel of op een deel daarvan tot niet
      minder dan twee beperken; [artikel 5, derde lid][ref2], is van toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0009365#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009365#Artikel5
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009365
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009365
        artikel: '5'
  - number: 11.1.b
    text: |-
      een of meer van de in [artikel 5, tweede lid][ref1], bedoelde categorieën grondafhandelingsdiensten voor een enkele
      verlener van zodanige diensten reserveren;


      [ref1]: https://wetten.overheid.nl/BWBR0009365#Artikel5
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009365
        artikel: '5'
  - number: 11.1.c
    text: |-
      het verrichten van andere categorieën zelfafhandelingsdiensten dan die bedoeld in [artikel 3, tweede lid][ref1],
      voor een beperkt aantal gebruikers reserveren, mits deze beperking is gebaseerd op relevante, objectieve,
      transparante en niet-discriminerende criteria, of


      [ref1]: https://wetten.overheid.nl/BWBR0009365#Artikel3
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009365
        artikel: '3'
  - number: 11.1.d
    text: |-
      het verrichten van de in [artikel 3, tweede lid][ref1], bedoelde zelfafhandelingsdiensten verbieden of tot een
      enkele gebruiker beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0009365#Artikel3
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009365
        artikel: '3'
  - number: '11.2'
    text: 'Een besluit als in het eerste lid bedoeld:'
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel11
  - number: 11.2.a
    text: |-
      vermeldt de categorieën grondafhandelingsdiensten waarvoor een beperking, reservering of verbod als in dat lid
      bedoeld van toepassing is en de specifieke belemmeringen met betrekking tot de beschikbare ruimte of capaciteit die
      de beperking, reservering of het verbod rechtvaardigen;
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel11
  - number: 11.2.b
    text: gaat vergezeld van een plan van passende maatregelen dat er op gericht is deze belemmeringen weg te nemen;
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel11
  - number: 11.2.c
    text: mag niet onnodig afbreuk doen aan het beginsel van de vrije toegang tot de grondafhandelingsmarkt;
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel11
  - number: 11.2.d
    text: |-
      mag niet leiden tot concurrentieverstoringen tussen verleners van grondafhandelingsdiensten en gebruikers die
      zelfafhandelingsdiensten verrichten, en
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel11
  - number: 11.2.e
    text: mag geen grotere omvang hebben dan gelet op de beschikbare ruimte of capaciteit noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel11
  - number: '11.3'
    text: |-
      De Minister stelt de Commissie van de Europese Gemeenschappen ten minste drie maanden voordat een besluit als in
      het eerste lid bedoeld, in werking treedt, van dat besluit in kennis met vermelding van de gronden daarvoor.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel11
  - number: '11.4'
    text: |-
      Een besluit als in het eerste lid, onderdelen a, c of d, bedoeld, vervalt na drie jaar. De Minister kan op verzoek
      van de exploitant uiterlijk drie maanden voor het tijdstip waarop het genoemde besluit vervalt opnieuw besluiten
      tot een beperking of een verbod. Het tweede en derde lid zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel11
  - number: '11.5'
    text: |-
      Een besluit als in het eerste lid, onderdeel b, bedoeld, vervalt na twee jaar. De Minister kan dit tijdvak na
      daartoe verkregen toestemming van de Commissie van de Europese gemeenschappen eenmaal met twee jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel11
  - number: '12.1'
    text: |-
      Indien met toepassing van de [artikelen 5, tweede lid][ref1], of [11, eerste lid, onderdelen a of b][ref2],
      het aantal verleners van grondafhandelingsdiensten wordt beperkt, worden de grondafhandelingsdiensten waarop de
      beperking betrekking heeft aanbesteed. De aanbesteding wordt bekendgemaakt in het Publikatieblad van de Europese
      Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0009365#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009365#Artikel11
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009365
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009365
        artikel: '11'
  - number: '12.2'
    text: Iedere verlener van grondafhandelingsdiensten kan inschrijven op aanbestede grondafhandelingsdiensten.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel12
  - number: '12.3'
    text: |-
      Na overleg met het overlegorgaan van gebruikers worden de verleners van grondafhandelingsdiensten voor een tijdvak
      van ten hoogste zeven jaar gekozen uit degenen die op de aanbesteding hebben ingeschreven:
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel12
  - number: 12.3.a
    text: |-
      door de exploitant van de luchthaven indien deze geen soortgelijke grondafhandelingsdiensten verleent, rechtstreeks
      noch onrechtstreeks zeggenschap heeft over een onderneming die dergelijke diensten verleent en geen enkel belang
      heeft in een dergelijke onderneming, en in andere gevallen;
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel12
  - number: 12.3.b
    text: door de Minister na overleg met de exploitant van de luchthaven indien onderdeel a niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel12
  - number: '12.4'
    text: |-
      Indien de verlener van grondafhandelingsdiensten voor het verstrijken van het tijdvak waarvoor hij is gekozen zijn
      werkzaamheden staakt wordt hij vervangen met toepassing van het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel12
  - number: '13'
    text: |-
      Indien met toepassing van de [artikelen 5, tweede lid][ref1], of [11, eerste lid][ref2], het aantal verleners van
      grondafhandelingsdiensten wordt beperkt, kan in afwijking van [artikel 12][ref3] de exploitant van de luchthaven,
      na overleg met het in [artikel 8][ref4] genoemde overlegorgaan van gebruikers:


      [ref1]: https://wetten.overheid.nl/BWBR0009365#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009365#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009365#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0009365#Artikel8
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009365
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009365
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0009365
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0009365
        artikel: '8'
  - number: 13.a
    text: zelf grondafhandelingsdiensten verlenen, of
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel13
  - number: 13.b
    text: |-
      een verlener van grondafhandelingsdiensten aanwijzen om zodanige diensten te verrichten, indien hij rechtstreeks of
      indirect zeggenschap heeft over deze verlener van grondafhandelingsdiensten of indien deze laatste rechtstreeks of
      indirect zeggenschap heeft over de exploitant van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel13
  - number: '14.1'
    text: |-
      De Minister kan, na overleg met de exploitant van de luchthaven en de gebruikers, een taakomschrijving of
      technische specificaties vaststellen waaraan de verleners van grondafhandelingsdiensten of de gebruikers die
      zelfafhandelingsdiensten verrichten, moeten voldoen. De in de taakomschrijving of technische specificaties
      opgenomen selectiecriteria dienen relevant, objectief, transparant en niet-discriminerend te zijn.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel14
  - number: '14.2'
    text: |-
      De Minister kan besluiten dat een verlener van grondafhandelingsdiensten of een gebruiker die
      zelfafhandelingsdiensten verricht, tot het verrichten van diensten op de luchthaven slechts wordt toegelaten
      indien:
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel14
  - number: 14.2.a
    text: de aanvrager een gezonde financiële positie en voldoende verzekeringsdekking heeft;
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel14
  - number: 14.2.b
    text: |-
      op de luchthaven de orde en veiligheid of de beveiliging van de installaties, luchtvaartuigen, uitrusting of
      personen wordt gewaarborgd,
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel14
  - number: 14.2.c
    text: de bescherming van het milieu wordt gewaarborgd, en
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel14
  - number: 14.2.d
    text: de van toepassing zijnde arbeidswetgeving en socialezekerheidswetgeving wordt nageleefd.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel14
  - number: '14.3'
    text: 'De in het tweede lid bedoelde criteria:'
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel14
  - number: 14.3.a
    text: worden toegepast op niet-discriminerende wijze;
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel14
  - number: 14.3.b
    text: dienen verband te houden met het nagestreefde doel, en
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel14
  - number: 14.3.c
    text: |-
      mogen niet leiden tot feitelijke vermindering van de toegang tot de markt voor grondafhandelingsdiensten of tot
      zelfafhandeling tot een lager niveau dan in deze regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel14
  - number: '14.4'
    text: |-
      Indien het tweede lid van toepassing is wordt de verlener van grondafhandelingsdiensten of de gebruiker die
      zelfafhandelingsdiensten verricht in kennis gesteld van de procedure voor het verkrijgen van de in dat lid bedoelde
      toelating.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel14
  - number: '14.5'
    text: |-
      De in het tweede lid bedoelde toelating wordt slechts onthouden of ingetrokken indien de verlener van
      grondafhandelingsdiensten of de gebruiker die zelfafhandelingsdiensten verricht om hem toe te rekenen redenen niet
      voldoet aan de in dat lid bedoelde criteria.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel14
  - number: '14.6'
    text: |-
      De redenen voor het onthouden of intrekken van de toelating worden medegedeeld aan de verlener van
      grondafhandelingsdiensten of de gebruiker die zelfafhandelingsdiensten verricht, alsmede aan de exploitant van
      de luchthaven.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel14
  - number: '15.1'
    text: |-
      De Minister kan op voorstel van de exploitant van de luchthaven aan een verlener van grondafhande-lingsdiensten of
      een gebruiker die zelfafhandelingsdiensten verricht, verbieden zijn diensten te verrichten, indien deze handelt in
      strijd met regels welke hem voor het goed functioneren van de luchthaven door de Minister kunnen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel15
  - number: '15.2'
    text: 'De in het eerste lid bedoelde regels dienen:'
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel15
  - number: 15.2.a
    text: op niet-discriminerende wijze te worden toegepast;
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel15
  - number: 15.2.b
    text: verband te houden met het nagestreefde doel, en
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel15
  - number: 15.2.c
    text: |-
      niet te leiden tot feitelijke vermindering van de toegang tot de markt voor grondafhandelingsdiensten of tot
      zelfafhandeling tot een lager niveau dan in deze regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel15
  - number: '15.3'
    text: |-
      De Minister kan op voorstel van de exploitant van de luchthaven een verlener van grondafhandelingsdiensten
      verplichten om op billijke en niet-discriminerende wijze deel te nemen aan de vervulling van wettelijke
      verplichtingen tot het verlenen van openbare diensten met name waar het de waarborging van de continuïteit van die
      diensten betreft.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel15
  - number: '16.1'
    text: |-
      Verleners van grondafhandelingsdiensten en gebruikers die zelfafhandelingsdiensten verrichten, hebben vrij toegang
      tot de voorzieningen van de luchthaven voor zover deze toegang voor het verrichten van hun diensten noodzakelijk
      is. Indien de exploitant van de luchthaven ten aanzien van deze toegang voorwaarden stelt, dienen deze relevant,
      objectief, transparant en niet-discriminerend te zijn.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel16
  - number: '16.2'
    text: |-
      Voor zover het voor het bevorderen van daadwerkelijke en eerlijke concurrentie noodzakelijk is, verdeelt
      de exploitant van de luchthaven de voor grondafhandelingsdiensten beschikbare ruimte over de verschillende
      op de luchthaven reeds aanwezige en nieuwe verleners van grondafhandelingsdiensten en gebruikers die
      zelfafhandelingsdiensten verrichten. De verdeling geschiedt op basis van relevante, objectieve, transparante en
      niet-discriminerende regels en criteria.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel16
  - number: '16.3'
    text: |-
      Voor de toegang tot de luchthaven en het gebruik van de voorzieningen daarop kan de exploitant van de luchthaven
      bepalen dat de verleners van grondafhandelingsdiensten en de gebruikers die zelfafhandelingsdiensten verrichten,
      een vergoeding verschuldigd zijn. De hoogte van de vergoeding wordt vastgesteld op basis van relevante, objectieve,
      transparante en niet-discriminerende criteria.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel16
  - number: '17.1'
    text: |-
      Onverminderd het in deze regeling bepaalde is iedere verlener van grondafhandelingsdiensten en gebruiker die
      zelfafhandelingsdiensten verricht gehouden tot naleving van alle in Nederland voor natuurlijke personen en
      rechtspersonen van toepassing zijnde wettelijke regelingen en voorschriften.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel17
  - number: '17.2'
    text: |-
      Onverminderd het in deze regeling bepaalde kan de Minister na overleg met de exploitant van de luchthaven, de
      gebruikers en de verleners van grondafhandelingsdiensten de voor de bescherming van de rechten van werknemers en de
      bescherming van het milieu noodzakelijke maatregelen nemen.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel17
  - number: '18.1'
    text: |-
      Ten aanzien van verleners van grondafhandelingsdiensten en gebruikers die zelfafhandelingsdiensten verrichten die
      niet afkomstig zijn uit een lidstaat van de Europese Unie kan de Minister deze regeling geheel of gedeeltelijk niet
      van toepassing verklaren, indien het land waaruit die verlener of gebruiker afkomstig is:
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel18
  - number: 18.1.a
    text: |-
      verleners van grondafhandelingsdiensten of gebruikers die zelfafhandelingsdiensten verrichten uit een land
      behorende tot de Europese Unie niet rechtens of in feite op vergelijkbare wijze behandelt als de Lid-Staten van de
      Europese Unie verleners van grondafhandelingsdiensten of gebruikers die zelfafhandelingsdiensten verrichten uit dat
      land behandelen;
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel18
  - number: 18.1.b
    text: |-
      verleners van grondafhandelingsdiensten of gebruikers die zelfafhandelingsdiensten verrichten uit een land
      behorende tot de Europese Unie niet rechtens of in feite behandelt overeenkomstig de in dat land van toepassing
      zijnde wetten en voorschriften, of
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel18
  - number: 18.1.c
    text: |-
      verleners van grondafhandelingsdiensten of gebruikers die zelfafhandelingsdiensten verrichten uit een ander
      land dan een land behorende tot de Europese Unie rechtens of in feite gunstiger behandelt dan verleners van
      grondafhandelingsdiensten of gebruikers die zelfafhandelingsdiensten verrichten uit een land behorende tot de
      Europese Unie.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel18
  - number: '18.2'
    text: |-
      De Minister stelt de Commissie van de Europese Gemeenschappen in kennis van elke niet van toepassing verklaring van
      deze regeling als in het eerste lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel18
  - number: '20'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 1998.
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel20
  - number: '21'
    text: 'Deze regeling wordt aangehaald als: Regeling grondafhandeling luchtvaartterreinen.'
    url: https://wetten.overheid.nl/BWBR0009365/2009-10-31#Artikel21
