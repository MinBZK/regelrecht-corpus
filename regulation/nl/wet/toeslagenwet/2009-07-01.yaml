  - number: '2'
    text: |-
      1 Recht op toeslag heeft een gehuwde, die:

      a. recht heeft op loondervingsuitkering, en

      b. per dag een inkomen heeft dat lager is dan € 59,80.

      2 Recht op toeslag heeft een ongehuwde, die:

      a. recht heeft op loondervingsuitkering;

      b. een kind heeft jonger dan 18 jaar, dat niet als eigen kind, aangehuwd kind of pleegkind tot het huishouden van
      een ander behoort en voor wie hij op grond van de [Algemene Kinderbijslagwet][ref1] kinderbijslag ontvangt dan wel
      zal ontvangen, en

      c. per dag een inkomen heeft dat lager is dan € 54,61.

      3 Behoudens het vierde lid heeft voorts recht op toeslag een ongehuwde, die:

      a. recht heeft op loondervingsuitkering, en

      b. per dag een inkomen heeft dat lager is dan:

      1°. indien hij 23 jaar of ouder is: € 46,12;

      2°. indien hij 22 jaar is: € 35,29;

      3°. indien hij 21 jaar is: € 29,64;

      4°. indien hij 20 jaar is: € 24,76;

      5°. indien hij 19 jaar is: € 21,14;

      6°. indien hij 18 jaar is: € 19,06.

      4 Geen recht op toeslag heeft de in het derde lid bedoelde ongehuwde, die de leeftijd van 21 jaar nog niet heeft
      bereikt en behoort tot het huishouden van zijn ouders of pleegouders.

      5 Zolang een gehuwde of ongehuwde geen recht heeft op een loondervingsuitkering omdat hem rechtens zijn vrijheid is
      ontnomen, heeft hij geen recht op toeslag.

      6 Zolang een gehuwde of ongehuwde de leeftijd van 18 jaar nog niet heeft bereikt, heeft hij geen recht op toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel2
