  - number: 11a
    text: |-
      1 Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van toeslag en terzake van weigering van toeslag, herziet het Uitvoeringsinstituut werknemersverzekeringen een
      dergelijk besluit of trekt zij dat in:

      a. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 12][ref1] of 13 heeft
      geleid tot het ten onrechte of tot een te hoog bedrag verlenen van toeslag;

      b. indien anderszins de toeslag ten onrechte of tot een te hoog bedrag is verleend;

      c. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 12][ref2] of 13 ertoe
      leidt dat niet kan worden vastgesteld of nog recht op toeslag bestaat.

      2 Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van herziening of intrekking af te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel12
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel11a
