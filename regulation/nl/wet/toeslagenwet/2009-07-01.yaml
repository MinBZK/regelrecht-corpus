  - number: 14a
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op van ten
      hoogste € 2 269 ter zake van het niet of niet behoorlijk nakomen door degene die aanspraak
      maakt op een toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger van een
      verplichting als bedoeld in [artikel 12][ref1] of in [artikel 28, tweede lid][ref2], of
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3].

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een bestuurlijke boete als
      bedoeld in het eerste lid en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet of
      niet behoorlijk nakomen van een verplichting als bedoeld in [artikel 12][ref4] indien dit niet heeft geleid tot
      het ten onrechte of tot een te hoog bedrag verlenen van toeslag, tenzij het niet of niet behoorlijk nakomen van
      de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan degene
      die aanspraak maakt op toeslag, zijn echtgenoot, of zijn wettelijk vertegenwoordiger, een zodanige waarschuwing
      is gegeven.

      3 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een bestuurlijke boete indien
      daarvoor dringende redenen aanwezig zijn.

      4 Degene aan wie een bestuurlijke boete is opgelegd is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0004043#Artikel12
