    text: |-
      1 De in de [artikelen 2][ref1] en [8][ref2] genoemde bedragen worden gewijzigd overeenkomstig de wijze en met
      ingang van de dag waarop de bedragen, genoemd in [hoofdstuk 3 van de Wet werk en bijstand][ref3], worden gewijzigd.
      De herziene bedragen treden voor de in de [artikelen 2][ref4] en [8][ref5] genoemde bedragen in de plaats.

      2 Van de herziene bedragen, bedoeld in het eerste lid, wordt door Onze Minister mededeling gedaan in de
      Staatscourant.


