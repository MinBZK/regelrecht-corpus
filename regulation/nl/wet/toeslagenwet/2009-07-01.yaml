  - number: 44a
    text: |-
      1 De [artikelen 24][ref1], [48][ref2] en [64a van de Invoeringswet stelselherziening sociale zekerheid][ref3] en
      de daarop rustende bepalingen zoals deze luidden op 31 december 2007 blijven tot 1 maart 2008 van toepassing op de
      persoon die:

      a. op 31 december 2007 recht had op een verhoging van zijn uitkering op grond van de [artikelen 24][ref4],
      [48][ref5] of [64a van de Invoeringswet stelselherziening sociale zekerheid][ref6], en

      b. op 1 januari 2008 geen recht heeft op een toeslag.

      2 [Artikel 64a van de Invoeringswet stelselherziening sociale zekerheid][ref7] en deze wet en de op
      [dat artikel][ref8] en deze wet rustende bepalingen zoals deze luidden op 31 december 2007 blijven van toepassing
      tot de dag waarop het recht op ziekengeld is geëindigd, maar uiterlijk tot 1 maart 2008 op de persoon die:

      a. op 31 december 2007 recht had op een verhoging van zijn uitkering op grond van
      [artikel 64a van de Invoeringswet stelselherziening sociale zekerheid][ref9];

      b. op 31 december 2007 geen recht had op een toeslag, en

      c. op 1 januari 2008 recht zou hebben op een toeslag.


