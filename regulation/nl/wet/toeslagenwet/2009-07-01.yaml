  - number: '8'
    text: |-
      1 Voor de persoon, bedoeld in [artikel 2, eerste lid][ref1], is de toeslag gelijk aan het verschil tussen € 59,80
      en het inkomen per dag.

      2 Voor de persoon, bedoeld in [artikel 2, tweede lid][ref2], is de toeslag gelijk aan het verschil tussen € 54,61
      en het inkomen per dag.

      3 Voor de persoon, bedoeld in [artikel 2, derde lid][ref3], is de toeslag gelijk aan het verschil tussen het in
      [artikel 2, derde lid, onderdeel b][ref4], bij de leeftijd van die persoon genoemd bedrag en het inkomen per dag.


