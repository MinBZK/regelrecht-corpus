  - number: 23a
    text: |-
      Na het overlijden van de echtgenoot van een toeslaggerechtigde wordt de toeslaggerechtigde voor de toepassing van
      deze wet en de daarop rustende bepalingen tot en met één maand na de dag van overlijden van de echtgenoot, als
      gehuwd aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel23a
  - number: '25'
    text: |-
      1 De toeslag is onvervreemdbaar en niet vatbaar voor verpanding of belening.

      2 Een machtiging tot het in ontvangst nemen van de toeslag, onder welke vorm of benaming ook verleend, is steeds
      herroepelijk.

      3 Elk beding, strijdig met het eerste of tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel25
  - number: '26'
    text: |-
      In de middelen tot dekking van de uitgaven ten laste van het Toeslagenfonds wordt voorzien door het Rijk, alsmede
      door de met toepassing van [artikel 14a][ref1] verkregen bestuurlijke boeten.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel14a
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 14a
        hoofdstuk: II
        paragraaf: '4'
  - number: '27'
    text: |-
      1 De op grond van deze wet te betalen toeslagen en de aan de uitvoering van deze wet verbonden kosten komen ten
      laste van het Toeslagenfonds.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan regels stellen met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel27
  - number: '29'
    text: |-
      1 In de uitvoering van deze wet wordt voorzien door het Uitvoeringsinstituut werknemersverzekeringen.

      2 Het recht op toeslag ingevolge deze wet bestaat tegenover het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel29
  - number: '30'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd controlevoorschriften vast te stellen. Deze
      voorschriften mogen niet verder gaan dan strikt noodzakelijk is voor de juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel30
  - number: '31'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de middelen tot dekking
      van de uitgaven, bedoeld in artikel 27, eerste lid, in de vorm van een Toeslagenfonds dat deel uitmaakt van het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel31
  - number: '32'
    text: |-
      [Artikel 120 van de Wet financiering sociale verzekeringen][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel120
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '120'
  - number: '36'
    text: |-
      1 Indien de aanvraag om een toeslag tezamen met een aanvraag om een loondervingsuitkering wordt ingediend, wordt
      de beschikking over de toeslag gegeven binnen de termijn die geldt voor het geven van een beschikking inzake de
      loondervingsuitkering.

      2 Indien een beschikking als bedoeld in het eerste lid niet binnen de toepasselijke termijn kan worden gegeven,
      wordt dit schriftelijk aan de aanvrager medegedeeld onder vermelding van een zo kort mogelijke termijn waarbinnen
      de beschikking wel tegemoet kan worden gezien.

      3 Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen de toepasselijke termijn gegeven
      kan worden, wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging
      schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel36
  - number: '37'
    text: |-
      1 Onverminderd [artikel 36][ref1], worden de beschikkingen op grond van deze wet en de daarop berustende bepalingen
      gegeven binnen een redelijke termijn na ontvangst van de aanvraag.

      2 De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.

      3 Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.

      4 Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen acht weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel36
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '36'
        hoofdstuk: V
  - number: 37a
    text: |-
      In afwijking van [artikel 7:3 van de Algemene wet bestuursrecht][ref1] kan van het horen van een belanghebbende
      worden afgezien indien de belanghebbende niet binnen een door het Uitvoeringsinstituut werknemersverzekeringen
      gestelde redelijke termijn, verklaart dat hij gebruik wil maken van het recht te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel73
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:3
  - number: '38'
    text: |-
      1 In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken na ontvangst van het bezwaarschrift.

      2 Indien het bezwaarschrift, bedoeld in het eerste lid, verband houdt met een bezwaar tegen een besluit
      waaraan een medische of arbeidskundige beoordeling ten grondslag ligt, zijn de artikelen 79, tweede lid, van
      de Algemene Arbeidsongeschiktheidswet, [artikel 112 van de Wet werk en inkomen naar arbeidsvermogen][ref2],
      [artikel 96, tweede lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3],
      [artikel 70, tweede lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4],
      [87d van de Wet op de arbeidsongeschiktheidsverzekering][ref5] en
      [XXVIIa, tweede lid, van de Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref6] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel710
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel112
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel96
