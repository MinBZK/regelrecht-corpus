  - number: '22'
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen op grond van een wettelijke bepaling
      de loondervingsuitkering geheel of gedeeltelijk in plaats van aan de toeslaggerechtigde
      zonder diens machtiging uitbetaalt aan het College voor zorgverzekeringen, genoemd in
      [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1], een inrichting ter verpleging van geesteszieken
      of van zwakzinnigen of aan een gemeente die de opnamekosten in een dergelijke inrichting betaalt, betaalt het
      Uitvoeringsinstituut werknemersverzekeringen tevens de toeslag aan die raad, inrichting of gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '23'
    text: |-
      1 Na het overlijden van de toeslaggerechtigde wordt met ingang van de dag na het overlijden, de toeslag in de vorm
      van een overlijdensuitkering uitbetaald:

      a. aan de langstlevende van de echtgenoten;

      b. bij ontstentenis van de in onderdeel *a* bedoelde persoon, aan de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;

      c. bij ontstentenis van de in de onderdelen *a* en [][ref1] bedoelde personen, aan degene ten aanzien van wie de
      overledene grotendeels in de kosten van het bestaan voorzag en met wie hij in gezinsverband leefde.

      2 Met de toeslaggerechtigde, wordt voor de toepassing van dit artikel gelijkgesteld, degene wiens overlijden
      heeft plaats gevonden in de maand waarin hij de leeftijd van 65 jaar zou hebben bereikt doch voor het bereiken
      van deze leeftijd is overleden, en die recht op een toeslag zou hebben gehad indien artikel 29, negende lid,
      van de [Ziektewet][ref2], [artikel 43, onderdeel f, van de Wet werk en inkomen naar arbeidsvermogen][ref3],
      [artikel 49, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref4],
      [artikel 19, eerste lid, onderdeel a, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5] of
      [artikel 17, eerste lid, onderdeel a, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6] over de
      dag van zijn overlijden niet van toepassing zou zijn geweest.

      3 De overlijdensuitkering is gelijk aan het bedrag van de toeslag over één maand, doch niet over de zaterdagen
      en zondagen, berekend naar de hoogte van die toeslag op de dag of laatstelijk voor de dag van overlijden van de
      toeslaggerechtigde.

      4 Voor de toepassing van het tweede lid, wordt ervan uitgegaan dat aan de verzekerde een toeslag was toegekend.

      5 De overlijdensuitkering wordt op verzoek aan de rechthebbende of rechthebbenden genoemd in het eerste lid, door
      het Uitvoeringsinstituut werknemersverzekeringen uitbetaald.

      6 De overlijdensuitkering wordt in een bedrag ineens uitbetaald.

      7 Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan toeslag dat, over na het overlijden
      gelegen dagen, reeds is uitbetaald.

      8 De overlijdensuitkering is niet vatbaar voor beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel43
