  - number: 8a
    text: |-
      1 De toeslag bedraagt niet meer dan het verschil tussen het dagloon, vervolgdagloon of de grondslag waarnaar de
      loondervingsuitkering is berekend, en de loondervingsuitkering, voor:

      a. de persoon, bedoeld in [artikel 2, eerste lid][ref1], indien het dagloon, vervolgdagloon of de grondslag
      waarnaar de loondervingsuitkering is berekend, lager is dan het minimumloon;

      b. de persoon, bedoeld in [artikel 2, tweede lid][ref2], indien het dagloon, vervolgdagloon of de grondslag
      waarnaar de loondervingsuitkering is berekend, lager is dan 90% van het minimumloon;

      c. de persoon, bedoeld in [artikel 2, derde lid][ref3], indien het dagloon, vervolgdagloon of de grondslag waarnaar
      de loondervingsuitkering is berekend, lager is dan 70% van het minimumloon.

      2 Voor de toepassing van het eerste lid wordt de in het dagloon, vervolgdagloon of grondslag waarnaar de
      loondervingsuitkering is berekend, begrepen vakantiebijslag niet in aanmerking genomen.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat voor de toepassing van het eerste lid ander inkomen
      dan de loondervingsuitkering wordt gelijkgesteld met de op het dagloon, vervolgdagloon of de grondslag waarnaar de
      loondervingsuitkering is berekend, in mindering te brengen loondervingsuitkering.


