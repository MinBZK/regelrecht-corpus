  - number: '10'
    text: |-
      1 Degene die recht heeft op een toeslag heeft tevens recht op een vakantie-uitkering ter hoogte van 8% van die
      toeslag.

      2 Het eerste lid is niet van toepassing indien in het dagloon waarnaar de loondervingsuitkering is berekend, geen
      vakantietoeslag is begrepen.

      3 Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1] wordt gewijzigd, wordt dit
      gewijzigde percentage in aanmerking genomen over het bedrag van de toeslag waarop recht bestaat over de periode
      aanvangende met de dag waarop die wijziging ingaat. Het gewijzigde percentage treedt in de plaats van het in het
      eerste lid genoemde percentage.

      4 Het bepaalde bij of krachtens [de artikelen 12][ref2], [13][ref3], [14][ref4], [15, vierde lid][ref5],
      [18][ref6], [20][ref7], [21][ref8], [22][ref9], [23][ref10], [23a][ref11], [25][ref12], [27][ref13] en [29][ref14]
      vindt overeenkomstige toepassing ten aanzien van de vakantie-uitkering.


