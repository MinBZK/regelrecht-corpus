  - number: '40'
    text: |-
      Een gedraging die in strijd is met een krachtens deze wet uitgevaardigde algemene maatregel van bestuur, voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel40
  - number: '43'
    text: |-
      De in [artikel 40][ref1] bedoelde strafbare feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel40
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '40'
        hoofdstuk: VI
  - number: '44'
    text: |-
      Op de persoon die op de dag voorafgaand aan de inwerkingtreding van
      [artikel 1.10, onderdeel C, van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref1]
      recht had op een toeslag op grond van deze wet blijft tenzij het recht op de uitkering eindigt,
      [artikel 8, vierde lid][ref2], zoals dat luidde op die dag van toepassing tot een bij ministeriële regeling bepaald
      tijdstip dat voor verschillende groepen personen verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel1.10
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel8
    url: https://wetten.overheid.nl/BWBR0004043/2009-07-01#Artikel44
