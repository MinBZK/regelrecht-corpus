  - number: '21'
    text: |-
      1 In afwijking van [artikel 20, eerste lid][ref1], kan het Uitvoeringsinstituut werknemersverzekeringen, op
      verzoek van degene die aanspraak maakt op de toeslag, zijn echtgenoot of zijn wettelijke vertegenwoordiger,
      alsmede de instelling aan welke ingevolge [artikel 22][ref2] toeslag wordt uitbetaald, besluiten gedeeltelijk
      van terugvordering of gedeeltelijk van verdere terugvordering af te zien bij medewerking aan een schuldregeling,
      indien:

      a. redelijkerwijs te voorzien is dat degene die aanspraak maakt op de toeslag, zijn echtgenoot of zijn wettelijke
      vertegenwoordiger, alsmede de instelling aan welke ingevolge [artikel 22][ref3] toeslag wordt uitbetaald, niet zal
      kunnen voortgaan met het betalen van zijn schulden of indien hij in de toestand verkeert dat hij heeft opgehouden
      te betalen;

      b. redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;

      c. de vordering van het Uitvoeringinstituut werknemersverzekeringen wegens onverschuldigde betaling ten minste zal
      worden voldaan naar evenredigheid met de vorderingen van de schuldeisers van gelijke rang;

      d. een naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen betrouwbare
      schuldregeling tot stand is gekomen door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref4];

      e. aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en

      f. uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref5].

      2 Het eerste lid is niet van toepassing indien een vordering is ontstaan door het niet nakomen door degene die
      aanspraak maakt op de toeslag, zijn echtgenoot of zijn wettelijke vertegenwoordiger, alsmede de instelling aan
      welke ingevolge [artikel 22][ref6] toeslag wordt uitbetaald, van de verplichting, bedoeld in [artikel 12][ref7], en
      hiervoor een boete als bedoeld in [artikel 14a][ref8] is opgelegd, dan wel met betrekking tot het niet naleven van
      die verplichting aangifte is gedaan op grond van het [Wetboek van Strafrecht][ref9].

      3 Het besluit tot het afzien van terugvordering of van verdere terugvordering wordt ingetrokken of ten nadele
      van degene die aanspraak maakt op de toeslag, zijn echtgenoot of zijn wettelijke vertegenwoordiger, alsmede de
      instelling aan welke ingevolge [artikel 22][ref10] toeslag wordt uitbetaald, degene van wie wordt teruggevorderd
      gewijzigd indien:

      a. niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling tot stand is gekomen die
      voldoet aan de eisen, bedoeld in het eerste lid;

      b. degene die aanspraak maakt op de toeslag, zijn echtgenoot of zijn wettelijke vertegenwoordiger, alsmede
      de instelling aan welke ingevolge [artikel 22][ref11] toeslag wordt uitbetaald, zijn schuld aan het
      Uitvoeringsinstituut werknemersverzekeringen niet overeenkomstig de schuldregeling voldoet; of

      c. onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een
      ander besluit zou hebben geleid.

      4 Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      bevoegdheid om mee te werken aan schuldregelingen.


