  - number: '8'
    text: |-
      1 Voor de persoon bedoeld in [artikel 2, eerste lid][ref1], is de toeslag gelijk aan het verschil tussen het
      minimumloon en het inkomen.

      2 Voor de persoon bedoeld in [artikel 2, tweede lid][ref2], is de toeslag gelijk aan het verschil tussen 90% van
      het minimumloon en het inkomen.

      3 Voor de persoon bedoeld in [artikel 2, derde lid][ref3], is de toeslag gelijk aan het verschil tussen 70% van het
      minimumloon en het inkomen.

      4 De toeslag bedraagt niet meer dan het verschil tussen het dagloon of de grondslag waarnaar de
      loondervingsuitkering is berekend en de loondervingsuitkering, doch ten hoogste:

      a. voor de persoon bedoeld in [artikel 2, eerste lid][ref4]: 30% van het minimumloon;

      b. voor de persoon bedoeld in [artikel 2, tweede lid][ref5]: 27% van het minimumloon;

      c. voor de persoon bedoeld in [artikel 2, derde lid][ref6]: 21% van het minimumloon.

      5 Voor de toepassing van het vierde lid wordt de in het dagloon begrepen vakantie-uitkering niet in aanmerking
      genomen.

      6 Onze Minister kan bepalen dat voor de toepassing van het vierde lid ander inkomen dan de loondervingsuitkering
      wordt gelijkgesteld met de op het dagloon of de grondslag in mindering te brengen loondervingsuitkering.


