  - number: '13'
    text: |-
      Degene die aanspraak maakt op toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger, alsmede de instelling
      aan welke ingevolge [artikel 22][ref1] toeslag wordt uitbetaald, zijn verplicht de voorschriften op te volgen, die
      het Uitvoeringsinstituut werknemersverzekeringen ten behoeve van een doelmatige controle stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel22
