  - number: 14b
    text: |-
      1 Indien het Uitvoeringsinstituut werknemersverzekeringen jegens degene die aanspraak maakt op een toeslag,
      zijn echtgenoot, of zijn wettelijke vertegenwoordiger een handeling verricht waaraan deze in redelijkheid de
      gevolgtrekking kan verbinden dat aan hem wegens een bepaalde gedraging een boete zal worden opgelegd, is de
      toeslaggerechtigde, dan wel de betrokken persoon niet langer verplicht terzake van die gedraging enige verklaring
      af te leggen, voor zover het betreft de boeteoplegging. De toeslaggerechtigde, dan wel de betrokken persoon wordt
      hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.

      2 Indien het Uitvoeringsinstituut werknemersverzekeringen voornemens is om aan de toeslaggerechtigde, dan wel
      de betrokken persoon een boete op te leggen, wordt hiervan kennis gegeven aan de toeslaggerechtigde, dan wel de
      betrokken persoon onder vermelding van de gronden waarop het voornemen berust. De kennisgeving is een handeling als
      bedoeld in het eerste lid.

      3 Op verzoek van de toeslaggerechtigde, dan wel de betrokken persoon die de in het vorige lid bedoelde kennisgeving
      wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt het Uitvoeringsinstituut
      werknemersverzekeringen er zoveel mogelijk zorg voor dat de in die kennisgeving vermelde gronden aan de
      toeslaggerechtigde, dan wel de betrokken persoon worden medegedeeld in een voor hem begrijpelijke taal.

      4 In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt het Uitvoeringsinstituut
      werknemersverzekeringen de toeslaggerechtigde, dan wel de betrokken persoon in de gelegenheid om naar keuze
      schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt opgelegd.

      5 Indien de toeslaggerechtigde, dan wel de betrokken persoon zijn zienswijze mondeling naar voren brengt, draagt
      het Uitvoeringsinstituut werknemersverzekeringen er op verzoek van de toeslaggerechtigde, dan wel de betrokken
      persoon die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die hem kan bijstaan,
      tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0004043/2005-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 14c
    text: |-
      1 Het besluit waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop het besluit bij gebreke van tijdige betaling, overeenkomstig [artikel 14g][ref1]
      zal worden tenuitvoergelegd.

      2 Op verzoek van degene die aanspraak maakt op een toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger,
      die het in het eerste lid bedoelde besluit wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende
      begrijpt, draagt het Uitvoeringsinstituut werknemersverzekeringen er zoveel mogelijk zorg voor dat de in dat
      besluit vermelde informatie aan de toeslaggerechtigde, dan wel de betrokken persoon, wordt meegedeeld in een voor
      hem begrijpelijke taal.

      3 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel14g
    url: https://wetten.overheid.nl/BWBR0004043/2005-01-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 14g
        hoofdstuk: II
        paragraaf: '4'
  - number: 14d
    text: |-
      1 Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.

      2 De oplegging van een boete blijft definitief achterwege indien ter zake van de gedraging tegen degene die
      aanspraak maakt op een toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger een strafvervolging is
      ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is
      vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].

      3 Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0004043/2005-01-01#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 14e
    text: |-
      1 Een boete wordt opgelegd binnen een jaar nadat het Uitvoeringsinstituut werknemersverzekeringen degene die
      aanspraak maakt op een toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger overeenkomstig het bepaalde
      in artikel 14*b*, vierde lid, in de gelegenheid heeft gesteld zijn zienswijze naar voren te brengen. Indien terzake
      aangifte is gedaan of proces-verbaal is opgemaakt en ingezonden vangt de termijn van een jaar aan op de dag na
      die waarop het openbaar ministerie aan het Uitvoeringsinstituut werknemersverzekeringen heeft medegedeeld dat geen
      strafvervolging wordt ingesteld.

      2 Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004043/2005-01-01#Artikel14e
  - number: 14f
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de boete is vastgesteld ook ten nadele van de toeslaggerechtigde wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel869
    url: https://wetten.overheid.nl/BWBR0004043/2005-01-01#Artikel14f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:69
  - number: 14g
    text: |-
      1 Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het zesde lid.

      2 Indien degene aan wie een boete is opgelegd toeslag ontvangt op grond van deze wet of
      een uitkering ontvangt op grond van de [Werkloosheidswet][ref2], de [Ziektewet][ref3], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref4], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref7] of de [Wet arbeid en zorg][ref8], wordt het besluit
      waarbij de boete is opgelegd tenuitvoergelegd door verrekening met die toeslag of uitkering.

      3 Indien degene aan wie een boete is opgelegd een uitkering ontvangt op grond van de
      [Algemene Ouderdomswet][ref9], de [Algemene nabestaandenwet][ref10], de [Wet werk en bijstand][ref11],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref12], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref13] of de
      [Wet werk en inkomen kunstenaars][ref14], betaalt de Sociale verzekeringsbank, onderscheidenlijk de betrokken
      gemeente het bedrag van die boete, zonder dat daarvoor een machtiging nodig is van de belanghebbende, op haar
      verzoek aan het Uitvoeringsinstituut werknemersverzekeringen.

      4 Indien degene aan wie een boete is opgelegd geen uitkering of toeslag als bedoeld in het tweede of derde lid
      ontvangt of meer ontvangt, dan wel ten aanzien van zodanige uitkering of toeslag toepassing van het tweede of
      derde lid niet mogelijk is, wordt het besluit waarbij de boete is opgelegd bij gebreke van tijdige betaling met
      toepassing van het Wetboek van Rechtsvordering op zijn kosten betekend en tenuitvoergelegd.

      5 De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede of
      derde lid, dan wel van het vierde lid, dan wel van het tweede of derde lid in combinatie met het vierde lid.

      6 Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.

      7 Op het executoriaal beslag ingevolge [dit artikel][ref15] door het Uitvoeringsinstituut werknemersverzekeringen
      op loon, sociale uitkeringen of andere periodieke betalingen, welke derden verschuldigd zijn of worden aan
      degene aan wie een boete is opgelegd, zijn de [artikelen 479b][ref16] tot en met [479g][ref17], behoudens
      [artikel 479e, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref18] van overeenkomstige toepassing.
      De in artikel 479*g* aan de raad voor de kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan het
      Uitvoeringsinstituut werknemersverzekeringen.

      8 De tenuitvoerlegging van een besluit met toepassing van [dit artikel][ref19] geschiedt zodanig dat
      degene die aanspraak maakt op een toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger blijft
      beschikken over een inkomen gelijk aan de beslagvrije voet bedoeld in de [artikelen 475c][ref20] tot en met
      [475e van het Wetboek van Burgerlijke Rechtsvordering][ref21].

      9 Het achtste lid geldt niet, zolang degene die aanspraak maakt op een toeslag, zijn echtgenoot, of zijn wettelijke
      vertegenwoordiger zijn verplichting bedoeld in [artikel 14a, vijfde lid][ref22], niet of niet behoorlijk nakomt.


