  - number: 14a
    text: |-
      1 Indien degene die aanspraak maakt op een toeslag, zijn echtgenoot, of zijn wettelijke
      vertegenwoordiger de verplichting bedoeld in [artikel 12][ref1] of in [artikel 28, tweede lid][ref2],
      of [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] niet of niet behoorlijk is
      nagekomen, legt het Uitvoeringsinstituut werknemersverzekeringen hem een boete op van ten hoogste € 2 269.

      2 De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin degene die aanspraak maakt
      op een toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger de gedraging verweten kan worden en de
      omstandigheden waarin hij verkeert. Van het opleggen van een boete wordt in elk geval afgezien, indien elke vorm
      van verwijtbaarheid ontbreekt.

      3 Indien het niet nakomen van de verplichting bedoeld in [artikel 28, tweede lid][ref4],
      of [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5], of het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in [artikel 12][ref6], niet heeft geleid tot het ten onrechte of
      tot een te hoog bedrag verlenen van toeslag, kan het Uitvoeringsinstituut werknemersverzekeringen afzien van het
      opleggen van een boete en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet of niet
      behoorlijk nakomen van de verplichting, tenzij het niet of niet behoorlijk nakomen van de verplichting plaatsvindt
      binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan degene die aanspraak maakt op toeslag,
      zijn echtgenoot, of zijn wettelijke vertegenwoordiger, een zodanige waarschuwing is gegeven.

      4 Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      van het opleggen van een boete af te zien.

      5 Degene aan wie boete is opgelegd is verplicht desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen de
      inlichtingen te verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.

      6 Voor zover de boete nog niet is geïnd vervalt zij door het overlijden van degene aan wie zij is opgelegd.

      7 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en het
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
