  - number: '15'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen betaalt de toeslag, zo spoedig mogelijk, doch uiterlijk binnen
      een maand nadat het recht op die toeslag is vastgesteld.

      2 De bepalingen die gelden voor de loondervingsuitkering ter zake van het verschuldigd zijn van premie,
      van de vaststelling en de invordering van premie, zoals deze zijn opgenomen in de [Werkloosheidswet][ref1],
      de [Wet op de arbeidsongeschiktheidsverzekering][ref2], de [Ziekenfondswet][ref3] en de
      [Coördinatiewet Sociale Verzekering][ref4], zijn op de toeslag die op de loondervingsuitkering op grond van die
      wetten wordt verleend, van overeenkomstige toepassing.

      3 De betaling van de toeslag geschiedt, voor zoveel mogelijk, in dezelfde termijnen als die waarin de betaling van
      de loondervingsuitkering geschiedt.

      4 Zoveel mogelijk wordt de toeslag betaald samen met de loondervingsuitkering in
      één bedrag dan wel wordt de toeslag betaald aan de werkgever met toepassing van
      [artikel 10, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref5],
      [artikel 11, derde lid, van de Ziektewet][ref6] of [artikel 11, tweede lid, van de Werkloosheidswet][ref7].

      5 Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van de toeslag op of schorst de betaling,
      indien het op grond van duidelijke aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:

      a. het recht op toeslag niet of niet meer bestaat;

      b. recht op een lagere toeslag bestaat, of

      c. degene die aanspraak maakt op toeslag, zijn echtgenoot dan wel de persoon aan wie of de instelling aan welke
      ingevolge [artikel 22][ref8] toeslag wordt uitbetaald, een verplichting als bedoeld in [de artikelen 12][ref9] en
      [13][ref10] niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
