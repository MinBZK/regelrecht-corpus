        bwb_id: BWBR0002368
  - number: '3'
    text: |-
      Vanaf 1990 heeft een gehuwde wiens echtgenoot is geboren na 31 december 1971 geen recht op toeslag, tenzij tot zijn
      huishouden een eigen kind, aangehuwd kind of pleegkind behoort dat jonger is dan 12 jaar.
    url: https://wetten.overheid.nl/BWBR0004043/2005-01-01#Artikel3
  - number: '4'
    text: |-
      Geen recht op toeslag heeft de persoon die onbetaald verlof geniet als bedoeld in
      [artikel 1, onderdeel g, van de Werkloosheidswet][ref1] of die met die persoon gehuwd is, ter hoogte van het bedrag
      van het verlies van inkomen uit arbeid als gevolg van het genieten van dat verlof.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
    url: https://wetten.overheid.nl/BWBR0004043/2005-01-01#Artikel4
