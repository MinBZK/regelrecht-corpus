  - number: '14'
    text: |-
      1 Indien degene die aanspraak maakt op toeslag, zijn echtgenoot, of zijn wettelijke
      vertegenwoordiger een verplichting, hem op grond van [artikel 13][ref1] of
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2]
      opgelegd, niet of niet behoorlijk is nagekomen, dan wel de verplichting,
      bedoeld in [artikel 12][ref3], of in de [artikelen 28, tweede lid][ref4], en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] niet binnen de door het
      Uitvoeringsinstituut werknemersverzekeringen, onderscheidenlijk de Centrale organisatie werk en inkomen daarvoor
      vastgestelde termijn is nagekomen, weigert het Uitvoeringsinstituut werknemersverzekeringen de toeslag tijdelijk of
      blijvend, geheel of gedeeltelijk.

      2 Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      belanghebbende de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in elk geval afgezien,
      indien elke vorm van verwijtbaarheid ontbreekt.

      3 Indien het niet tijdig nakomen van de verplichting, bedoeld in
      [artikel 12][ref6], of de [artikelen 28, tweede lid][ref7], en
      [29, eerste lid van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref8] niet heeft geleid tot het ten
      onrechte of tot een te hoog bedrag verlenen van toeslag, kan het Uitvoeringsinstituut werknemersverzekeringen
      afzien van het opleggen van een maatregel en volstaan met het geven van een schriftelijke waarschuwing ter zake van
      het niet tijdig nakomen van de verplichting, tenzij het niet tijdig nakomen van de verplichting plaatsvindt binnen
      een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de belanghebbende een zodanige waarschuwing
      is gegeven.

      4 Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      van het opleggen van een maatregel af te zien.

      5 Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een boete als bedoeld in
      [artikel 14a][ref9] wordt opgelegd.

      6 Het Uitvoeringsinstituut werknemersverzekeringen stelt nadere regels met betrekking tot het eerste en tweede lid.


