  - number: '5'
    text: |-
      1 Indien de loondervingsuitkering gedeeltelijk wordt geweigerd op grond van enig handelen of
      nalaten van betrokkene dat hem redelijkerwijs kan worden verweten, of het recht op loon, bedoeld in
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1], dan wel de bezoldiging of hetgeen daarmee overeenkomt,
      bedoeld in [artikel XV van de Wet terugdringing ziekteverzuim][ref2], gedeeltelijk ontbreekt dan wel de
      betaling daarvan is opgeschort door toepassing van het [derde of zesde lid van genoemd artikel 629][ref3] of het
      [achtste tot en met elfde lid van genoemd artikel XV][ref4] wordt voor de toepassing van deze wet en de daarop
      berustende bepalingen de loondervingsuitkering in aanmerking genomen alsof die weigering niet heeft plaatsgevonden
      en het loon, de bezoldiging of hetgeen daarmee overeenkomt alsof die artikelleden niet zijn toegepast.

      2 Geen recht op toeslag bestaat, indien de loondervingsuitkering, het loon, de bezoldiging of hetgeen daarmee
      overeenkomt, bedoeld in het eerste lid, niet tot uitbetaling komt op grond van enig handelen of nalaten van
      betrokkene dat hem redelijkerwijs kan worden verweten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0006355#ArtikelXV
