  - number: '12'
    text: |-
      Degene die aanspraak maakt op toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger, alsmede de instelling
      aan welke ingevolge [artikel 22][ref1] toeslag wordt uitbetaald, zijn verplicht aan het Uitvoeringsinstituut
      werknemersverzekeringen op zijn verzoek of onverwijld uit eigen beweging alle feiten en omstandigheden mee te delen
      waarvan hem of haar redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op toeslag,
      de hoogte van de toeslag, het geldend maken van het recht op toeslag of op het bedrag van de toeslag dat wordt
      betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel22
