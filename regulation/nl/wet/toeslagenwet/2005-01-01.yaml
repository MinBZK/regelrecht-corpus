  - number: '11'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen stelt op aanvraag vast of recht op toeslag bestaat. De aanvraag
      wordt ingediend bij het Uitvoeringsinstituut werknemersverzekeringen.

      2 Een aanvraag van een toeslag in aanvulling op een uitkering op grond van de [Werkloosheidswet][ref1]
      is gericht tot het Uitvoeringsinstituut werknemersverzekeringen en wordt overeenkomstig
      [artikel 28 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] ingediend bij
      de Centrale organisatie werk en inkomen. Na de overdracht van de aanvraag door de Centrale
      organisatie werk en inkomen aan het Uitvoeringsinstituut werknemersverzekeringen ingevolge
      [artikel 28, derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] wordt de aanvraag verder
      behandeld door het Uitvoeringsinstituut werknemersverzekeringen.

      3 Op de toekenning en de beëindiging van een toeslag op een loondervingsuitkering zijn de [artikelen 3:40][ref4] en
      [3:45 van de Algemene wet bestuursrecht][ref5] niet van toepassing, indien:

      a. redelijkerwijs mag worden aangenomen dat aan de bekendmaking van de beschikking geen behoefte bestaat en

      b. de toepasselijkheid van deze artikelen ook is uitgesloten voor de toekenning en de beëindiging van de
      loondervingsuitkering waarop de toeslag wordt of werd betaald.

      4 Verzoekt de belanghebbende binnen een redelijke termijn echter om bekendmaking van de in het derde lid bedoelde
      beschikking, dan wordt deze zo spoedig mogelijk verstrekt.

      5 Op de herziening van de toeslag als gevolg van een wijziging van het minimumloon of als gevolg van een indexering
      van het dagloon of de grondslag waarnaar de loondervingsuitkering is berekend, zijn de [artikelen 3:41][ref6] en
      [3:45 van de Algemene wet bestuursrecht][ref7] niet van toepassing.

      6 Op de toekenning van de vakantie-uitkering zijn de [artikelen 3:41][ref8] en
      [3:45 van de Algemene wet bestuursrecht][ref9] niet van toepassing.

      7 Het recht op toeslag kan niet worden vastgesteld over perioden gelegen voor één jaar voorafgaande aan de dag
      waarop de aanvraag om toeslag werd ingediend. Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd in
      bijzondere gevallen af te wijken van het bepaalde in de vorige volzin.

      8 In afwijking van het tweede lid wordt de aanvraag van een toeslag in aanvulling op een uitkering op grond
      van de [Werkloosheidswet][ref10] ingediend bij het Uitvoeringsinstituut werknemersverzekeringen indien het een
      aanvraag betreft tot toekenning van een toeslag in aanvulling op een uitkering waarvan de aanvraag op grond van
      [artikel 22 van de Werkloosheidswet][ref11] wordt ingediend bij het Uitvoeringsinstituut werknemersverzekeringen
      of in aanvulling op een uitkering op grond van die wet waarvan de aanvraag is of wordt behandeld door het
      Uitvoeringsinstituut werknemersverzekeringen.

      9 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat categorieën van aanvragen tot toekenning
      van een toeslag in aanvulling op een uitkering op grond van de [Werkloosheidswet][ref12], in afwijking van het
      tweede lid, bij het Uitvoeringsinstituut werknemersverzekeringen in plaats van de Centrale organisatie werk en
      inkomen worden ingediend.


