  - number: '15'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen betaalt de toeslag waarop op grond van deze wet recht bestaat.

      2 De bepalingen die gelden voor de loondervingsuitkering ter zake van het verschuldigd zijn van premie, van de
      heffing en invordering van premie, zoals deze zijn opgenomen in de [Wet financiering sociale verzekeringen][ref1],
      zijn op de toeslag die op de loondervingsuitkering wordt verleend, van overeenkomstige toepassing.

      3 De betaling van de toeslag geschiedt, voor zoveel mogelijk, in dezelfde termijnen als die waarin de betaling van
      de loondervingsuitkering geschiedt.

      4 Zoveel mogelijk wordt de toeslag betaald samen met de loondervingsuitkering in
      één bedrag dan wel wordt de toeslag betaald aan de werkgever met toepassing van
      [artikel 10, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2],
      [artikel 11, derde lid, van de Ziektewet][ref3] of [artikel 11, tweede lid, van de Werkloosheidswet][ref4].

      5 Onverminderd het eerste tot en met vierde lid vindt betaling plaats:

      a. binnen zes weken na indiening van de aanvraag indien [artikel 11, derde lid][ref5], van toepassing is;

      b. bij de eerstvolgende betaling van de toeslag nadat wijziging van het minimumloon heeft plaatsgevonden of
      tegelijk met de eerstvolgende gewijzigde loondervingsuitkering indien [artikel 11, vijfde lid][ref6], van
      toepassing is;

      c. tegelijk met de betaling van de vakantie-uitkering op de loondervingsuitkering indien
      [artikel 11, zesde lid][ref7], van toepassing is.

      6 Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van de toeslag op of schorst de betaling,
      indien het op grond van duidelijke aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:

      a. het recht op toeslag niet of niet meer bestaat;

      b. recht op een lagere toeslag bestaat, of

      c. degene die aanspraak maakt op toeslag, zijn echtgenoot dan wel de persoon aan wie of de instelling aan welke
      ingevolge [artikel 22][ref8] toeslag wordt uitbetaald, een verplichting als bedoeld in [artikel 12][ref9],
      [12a][ref10] of [13][ref11] niet is nagekomen.


