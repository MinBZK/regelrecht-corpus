  - number: '22'
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen op grond van een wettelijke bepaling de
      loondervingsuitkering geheel of gedeeltelijk in plaats van aan de toeslaggerechtigde zonder diens machtiging
      uitbetaalt aan het Zorginstituut Nederland, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1],
      een inrichting ter verpleging van geesteszieken of van zwakzinnigen of aan een gemeente die de opnamekosten in een
      dergelijke inrichting betaalt, betaalt het Uitvoeringsinstituut werknemersverzekeringen tevens de toeslag aan die
      raad, inrichting of gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '23'
    text: |-
      1 Na het overlijden van de toeslaggerechtigde wordt met ingang van de dag na het overlijden, de toeslag in de vorm
      van een overlijdensuitkering uitbetaald:

      a. aan de langstlevende van de echtgenoten;

      b. bij ontstentenis van de in onderdeel a bedoelde persoon, aan de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;

      c. bij ontstentenis van de in de onderdelen a en b bedoelde personen, aan degene met wie de overledene in
      gezinsverband leefde.

      2 De overlijdensuitkering is gelijk aan het bedrag van de toeslag over één maand, doch niet over de zaterdagen
      en zondagen, berekend naar de hoogte van die toeslag op de dag of laatstelijk voor de dag van overlijden van de
      toeslaggerechtigde.

      3 De overlijdensuitkering wordt ambtshalve of op verzoek aan de rechthebbende of rechthebbenden genoemd in het
      eerste lid, door het Uitvoeringsinstituut werknemersverzekeringen uitbetaald.

      4 De overlijdensuitkering wordt in een bedrag ineens uitbetaald.

      5 Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan toeslag dat, over na het overlijden
      gelegen dagen, reeds is uitbetaald.

      6 De overlijdensuitkering is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#Artikel23
  - number: 23a
    text: |-
      Na het overlijden van de echtgenoot van een toeslaggerechtigde wordt de toeslaggerechtigde voor de toepassing van
      deze wet en de daarop rustende bepalingen tot en met één maand na de dag van overlijden van de echtgenoot, als
      gehuwd aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#Artikel23a
  - number: '25'
    text: |-
      1 De toeslag is onvervreemdbaar en niet vatbaar voor verpanding of belening.

      2 Een machtiging tot het in ontvangst nemen van de toeslag, onder welke vorm of benaming ook verleend, is steeds
      herroepelijk.

      3 Elk beding, strijdig met het eerste of tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#Artikel25
  - number: '26'
    text: |-
      In de middelen tot dekking van de uitgaven ten laste van het Toeslagenfonds wordt voorzien door het Rijk, alsmede
      door de met toepassing van [artikel 14a][ref1] verkregen bestuurlijke boeten.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel14a
    url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#Artikel26
