      1 Voor de persoon, bedoeld in [artikel 2, eerste lid][ref1], is de toeslag gelijk aan het verschil tussen € 71,34
      en het inkomen per dag.

      2 Voor de persoon, bedoeld in [artikel 2, tweede lid][ref2], is de toeslag gelijk aan het verschil tussen het in
      artikel 2, tweede lid, onderdeel b, bij de leeftijd van die persoon genoemd bedrag en het inkomen per dag.

      3 Voor de persoon, bedoeld in [artikel 2, zevende lid][ref3], is de toeslag gelijk aan het verschil tussen het in
      artikel 2, zevende lid, onderdeel b, bij de leeftijd van die persoon genoemde bedrag en het inkomen per dag.


