  - number: 44g
    text: |-
      In afwijking van [artikel 8a, eerste lid, onderdeel c][ref1], bedraagt voor de persoon, bedoeld in
      [artikel 2, zevende lid][ref2], de toeslag niet meer dan het verschil tussen het dagloon, vervolgdagloon of de
      grondslag waarnaar de loondervingsuitkering is berekend, en de loondervingsuitkering, indien:

      a. van 1 juli 2016 tot en met 31 december 2016 het dagloon, vervolgdagloon of de grondslag waarnaar de
      loondervingsuitkering is berekend lager is dan 65% van het minimumloon;

      b. in 2017 het dagloon, vervolgdagloon of de grondslag waarnaar de loondervingsuitkering is berekend lager is dan
      60% van het minimumloon;

      c. in 2018 het dagloon, vervolgdagloon of de grondslag waarnaar de loondervingsuitkering is berekend lager is dan
      55% van het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel8a
