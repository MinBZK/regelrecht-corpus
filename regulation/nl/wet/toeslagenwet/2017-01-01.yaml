preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen inzake het verlenen van
    toeslagen tot het relevante sociaal minimum aan uitkeringsgerechtigden op grond van de Ziektewet, de
    Werkloosheidswet, de Algemene Arbeidsongeschiktheidswet, de Wet op de arbeidsongeschiktheidsverzekering en de Wet
    arbeidsongeschiktheidsvoorziening militairen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      c. Toeslagenfonds: het fonds, bedoeld in [artikel 31][ref2];

      d. loondervingsuitkering: een uitkering krachtens de verplichte verzekering
      op grond van de [Werkloosheidswet][ref3], de [Ziektewet][ref4], de
      [Wet werk en inkomen naar arbeidsvermogen][ref5], de [Wet op de arbeidsongeschiktheidsverzekering][ref6]
      en de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7], alsmede een uitkering of
      inkomensvoorziening op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8],
      op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref9] aan de
      werknemer of de gelijkgestelde, bedoeld in [artikel 3:6, eerste lid, van die wet][ref10], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref11] en de [Wet inkomensvoorziening oudere werklozen][ref12];

      e. toeslag: een op een loondervingsuitkering of naast het recht op loon, bedoeld in
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref13], dan wel de bezoldiging of hetgeen daarmee overeenkomt,
      bedoeld in [artikel 76a van de Ziektewet][ref14], te verlenen toeslag ingevolge deze wet;

      f. minimumloon:

      1°. voor de persoon, bedoeld in [artikel 2, eerste lid][ref15], het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref16] (Stb. 1968, 657),
      gedeeld door 21,75, en

      2°. voor de persoon, bedoeld in [artikel 2, tweede en zevende lid][ref17],
      het voor zijn leeftijd geldende minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref18] in verbinding met
      [artikel 8, derde lid, van die wet][ref19], gedeeld door 21,75;

      g. vervolgdagloon: het vervolgdagloon, bedoeld in
      [artikel 21b van de Wet op de arbeidsongeschiktheidsverzekering][ref20];

      h. vrijheidsstraf of vrijheidsbenemende maatregel: een bij onherroepelijk geworden vonnis opgelegde vrijheidsstraf
      of vrijheidsbenemende maatregel als bedoeld in het [Wetboek van Strafrecht][ref21].

      2 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:

      a. echtgenoot: geregistreerde partner;

      b. echtgenoten: geregistreerde partners;

      c. gehuwd: als partner geregistreerd;

      d. gehuwde: als partner geregistreerde.

      3 In deze wet en de daarop berustende bepalingen wordt:

      a. als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde
      meerderjarige een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;

      b. als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.

      4 Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben
      en zij blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de
      huishouding dan wel anderszins.

      5 Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben
      in dezelfde woning en:

      a. zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;

      b. uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;

      c. zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of

      d. zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.

      6 Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.

      7 Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.

      8 Onder bloedverwant in de eerste graad als bedoeld in het derde lid, onderdeel a, wordt mede verstaan een
      meerderjarig aangehuwd kind of een meerderjarig voormalig pleegkind van de ongehuwde meerderjarige.

      9 Onder voormalig pleegkind als bedoeld in het achtste lid wordt verstaan een pleegkind voor wie de ongehuwde
      meerderjarige een pleegvergoeding ontving of ontvangt op grond van de [Wet op de jeugdzorg][ref22] of de
      [Jeugdwet][ref23], of kinderbijslag ontving op grond van de [Algemene Kinderbijslagwet][ref24].


