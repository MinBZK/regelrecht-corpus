  - number: '11'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen stelt op aanvraag vast of recht op toeslag bestaat. De aanvraag
      wordt ingediend bij het Uitvoeringsinstituut werknemersverzekeringen.

      2 Op de toekenning en de beëindiging van een toeslag op een loondervingsuitkering zijn de [artikelen 3:40][ref1] en
      [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing, indien:

      a. redelijkerwijs mag worden aangenomen dat aan de bekendmaking van de beschikking geen behoefte bestaat en

      b. de toepasselijkheid van deze artikelen ook is uitgesloten voor de toekenning en de beëindiging van de
      loondervingsuitkering waarop de toeslag wordt of werd betaald.

      3 De toeslag op een loondervingsuitkering wordt betaald zonder dat dit bij beschikking is vastgesteld indien
      de loondervingsuitkering waarop de toeslag wordt of werd betaald ook op die wijze wordt betaald en indien
      redelijkerwijs mag worden aangenomen dat aan een beschikking geen behoefte bestaat.

      4 Een toeslag als bedoeld in het derde lid wordt beëindigd zonder dat dit bij beschikking is vastgesteld, indien
      redelijkerwijs mag worden aangenomen dat aan een beschikking geen behoefte bestaat. Indien de belanghebbende binnen
      een redelijke termijn om een beschikking verzoekt, wordt deze zo spoedig mogelijk alsnog verstrekt.

      5 Een herziening van de toeslag als gevolg van een wijziging van de in de [artikelen 2][ref3] en [8][ref4]
      genoemde bedragen als bedoeld in [artikel 9][ref5] of als gevolg van een indexering van het dagloon of de grondslag
      waarnaar de loondervingsuitkering is berekend vindt plaats zonder dat dit bij beschikking is vastgesteld.

      6 De vakantie-uitkering wordt betaald zonder dat dit bij beschikking is vastgesteld.

      7 Het recht op toeslag kan niet worden vastgesteld over perioden gelegen voor één jaar voorafgaande aan de dag
      waarop de aanvraag om toeslag werd ingediend. Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd in
      bijzondere gevallen af te wijken van de vorige zin.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel340
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel345
