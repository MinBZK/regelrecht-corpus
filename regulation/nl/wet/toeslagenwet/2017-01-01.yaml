  - number: '14'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen weigert de toeslag tijdelijk of blijvend, geheel of
      gedeeltelijk ter zake van het niet of niet behoorlijk nakomen door degene die aanspraak maakt op een toeslag,
      zijn echtgenoot, of zijn wettelijke vertegenwoordiger van een verplichting als bedoeld in [artikel 13][ref1] of
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], dan wel ter zake van
      het niet binnen de door het Uitvoeringsinstituut werknemersverzekeringen daarvoor vastgestelde termijn nakomen door
      genoemde personen van een verplichting als bedoeld in [artikel 12][ref3].

      2 Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      belanghebbende de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in elk geval afgezien,
      indien elke vorm van verwijtbaarheid ontbreekt.

      3 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een maatregel als bedoeld in
      het eerste lid en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet of niet tijdig
      nakomen van een verplichting als bedoeld in [artikel 12][ref4], indien dit niet heeft geleid tot het ten onrechte
      of tot een te hoog bedrag verlenen van toeslag, tenzij het niet tijdig nakomen van de verplichting plaatsvindt
      binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan degene die aanspraak maakt op toeslag,
      zijn echtgenoot of zijn wettelijk vertegenwoordiger een zodanige waarschuwing is gegeven.

      4 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een maatregel indien daarvoor
      dringende redenen aanwezig zijn.

      5 Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als
      bedoeld in [artikel 14a][ref5] wordt opgelegd.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.


