  - number: '5'
    text: |-
      1 Indien de loondervingsuitkering gedeeltelijk wordt geweigerd op grond van enig handelen of
      nalaten van betrokkene dat hem redelijkerwijs kan worden verweten, of het recht op loon, bedoeld in
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1], dan wel de bezoldiging of hetgeen daarmee
      overeenkomt, bedoeld in [artikel 76a van de Ziektewet][ref2], gedeeltelijk ontbreekt dan wel de betaling
      daarvan is opgeschort door toepassing van het [derde of zesde lid van genoemd artikel 629][ref3], het
      [eerste tot en met derde lid van artikel 76b van de Ziektewet][ref4] of [artikel 76c van de Ziektewet][ref5] wordt
      voor de toepassing van deze wet en de daarop berustende bepalingen de loondervingsuitkering in aanmerking genomen
      alsof die weigering niet heeft plaatsgevonden en het loon, de bezoldiging of hetgeen daarmee overeenkomt alsof die
      artikelleden niet zijn toegepast.

      2 Geen recht op toeslag bestaat, indien de loondervingsuitkering, het loon, de bezoldiging of hetgeen daarmee
      overeenkomt, bedoeld in het eerste lid, niet tot uitbetaling komt op grond van enig handelen of nalaten van
      betrokkene dat hem redelijkerwijs kan worden verweten.

      3 Indien bij samenloop van loondervingsuitkeringen op grond van enig handelen of nalaten van betrokkene dat hem
      redelijkerwijs kan worden verweten een of meer van de loondervingsuitkeringen gedeeltelijk worden geweigerd of
      niet tot uitbetaling komen, wordt voor de toepassing van deze wet en de daarop berustende bepalingen het inkomen
      in aanmerking genomen alsof die weigering niet heeft plaatsgevonden respectievelijk alsof die uitbetaling heeft
      plaatsgevonden.

      4 Indien de uitkering op grond van de [Werkloosheidswet][ref6] is verminderd omdat de betrokkene in een
      kalenderweek minder beschikbaar voor arbeid is dan zijn gemiddeld aantal arbeidsuren per kalenderweek, en er
      een inkomen als bedoeld in [artikel 1b, vijfde lid, van de Werkloosheidswet][ref7], is berekend, wordt voor
      de toepassing van deze wet en de daarop berustende bepalingen de uitkering op grond van de Werkloosheidswet in
      aanmerking genomen alsof die vermindering niet heeft plaatsgevonden.

      5 Indien de uitkering op grond van [artikel 47b van de Werkloosheidswet][ref8] is verminderd, wordt voor
      de toepassing van deze wet en de daarop berustende bepalingen de uitkering in aanmerking genomen alsof die
      vermindering niet heeft plaatsgevonden.


