  - number: 4a
    text: |-
      1 Geen recht op toeslag heeft de persoon, bedoeld in [artikel 2][ref1], gedurende de periode dat hij niet in
      Nederland woont.

      2 De persoon, bedoeld in [artikel 2][ref2], die op grond van het eerste lid geen recht heeft op toeslag, heeft
      vanaf de dag dat hij in Nederland woont recht op toeslag, indien hij aan de voorwaarden, bedoeld in artikel 2,
      eerste, tweede of zevende lid, voldoet.


