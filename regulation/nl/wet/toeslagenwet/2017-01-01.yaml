  - number: 15b
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van de toeslag op, indien blijkt dat het
      door de toeslaggerechtigde verstrekte adres van hemzelf, van zijn echtgenoot of van een kind afwijkt van het adres
      waaronder de betrokkene in de basisregistratie personen staat ingeschreven.

      2 Geen opschorting vindt plaats:

      a. indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de uitkering;

      b. indien de toeslaggerechtigde van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.

      3 Het Uitvoeringsinstituut werknemersverzekeringen doet schriftelijk mededeling van de opschorting aan de
      toeslaggerechtigde.

      4 De opschorting wordt beëindigd zodra het aan het Uitvoeringsinstituut werknemersverzekeringen gebleken is dat de
      afwijking niet meer bestaat.
    url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#Artikel15b
  - number: 15c
    text: |-
      1 Is van de aanvrager of ontvanger van een toeslag bij het Uitvoeringsinstituut werknemersverzekeringen een adres
      in Nederland bekend, terwijl in de basisregistratie personen ambtshalve is opgenomen dat hij is vertrokken naar
      een onbekend land van verblijf, dan verzoekt het Uitvoeringsinstituut werknemersverzekeringen hem de afwijkende
      registratie in de basisregistratie personen binnen een redelijke termijn ongedaan te laten maken.

      2 Wanneer na afloop van deze termijn de afwijkende registratie niet is beëindigd of als uit de basisregistratie
      personen niet blijkt dat het college van burgemeester en wethouders van de desbetreffende gemeente de gegevens over
      het adres in onderzoek heeft genomen, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de
      toeslag aan de persoon, aan wie de toeslag is toegekend, op.

      3 De opschorting wordt beëindigd zodra is vastgesteld dat de persoon, bedoeld in het tweede lid, in het buitenland
      woont of verblijft of dat een adres in Nederland in de basisregistratie personen is opgenomen.

      4 Indien het onderzoek van het college van burgemeester en wethouders is afgerond en de persoon, bedoeld in
      het tweede lid, in de basisregistratie personen ambtshalve opgenomen blijft met gegevens over het vertrek uit
      Nederland, schort het Uitvoeringsinstituut werknemersverzekeringen de betaling van de toeslag op tot verblijf in
      het buitenland kan worden vastgesteld of een adres in Nederland in de basisregistratie personen is opgenomen.
    url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#Artikel15c
  - number: '16'
    text: Onze Minister kan regels stellen met betrekking tot samenloop van toeslagen.
    url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#Artikel16
  - number: '17'
    text: |-
      Voor zover bij of krachtens deze wet niet anders is bepaald, wordt een voorschot op een nog niet vastgestelde
      toeslag beschouwd als een toeslag op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#Artikel17
  - number: '18'
    text: |-
      De toeslag die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de dag van betaalbaarstelling,
      wordt niet meer betaald.

      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd in bijzondere gevallen ten gunste van de
      toeslaggerechtigde af te wijken van de in [de eerste volzin][ref1] genoemde drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel18
    url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#Artikel18
