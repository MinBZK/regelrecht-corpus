  - number: 14g
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen verrekent de bestuurlijke boete en een eerdere
      bestuurlijke boete wegens eenzelfde gedraging als bedoeld in [artikel 14a, vijfde lid][ref1], met een toeslag
      op grond van deze wet, een uitkering op grond van de [Werkloosheidswet][ref2], de [Ziektewet][ref3], de
      [Wet werk en inkomen naar arbeidsvermogen][ref4], de [Wet op de arbeidsongeschiktheidsverzekering][ref5],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6], de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref8], de [Wet inkomensvoorziening oudere werklozen][ref9] of de
      [Wet arbeid en zorg][ref10], die degene aan wie de bestuurlijke boete is opgelegd ontvangt.

      2 Onverminderd het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen de bestuurlijke boete verrekenen
      met een vordering die degene aan wie de bestuurlijke boete is opgelegd op hem heeft.

      3 De Sociale verzekeringsbank onderscheidenlijk de gemeente betaalt het bedrag van de bestuurlijke
      boete, zonder dat daarvoor een machtiging nodig is, op zijn verzoek aan het Uitvoeringsinstituut
      werknemersverzekeringen indien degene aan wie een bestuurlijke boete is opgelegd een uitkering ontvangt op
      grond van de [Algemene Ouderdomswet][ref11], de [Algemene nabestaandenwet][ref12], de [Participatiewet][ref13],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref14] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref15].

      4 De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref16] aan de raad voor de kinderbescherming
      toegekende bevoegdheid komt gelijkelijk toe aan het Uitvoeringsinstituut werknemersverzekeringen. Indien het
      Uitvoeringsinstituut werknemersverzekeringen gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het
      dwangbevel, in afwijking van [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref17], door middel van
      toezending per post aan degene aan wie de boete is opgelegd.

      5 Zolang degene die aanspraak maakt op een toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger zijn
      verplichting, bedoeld in [artikel 14a, negende lid][ref18], niet of niet behoorlijk nakomt:

      a. is het Uitvoeringsinstituut werknemersverzekeringen in afwijking van
      [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref19] bevoegd tot verrekening van de bestuurlijke
      boete voor zover beslag op de vordering van de schuldeiser nietig zou zijn;

      b. geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref20], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref21], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


