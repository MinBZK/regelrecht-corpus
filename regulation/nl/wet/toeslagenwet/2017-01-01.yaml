  - number: '2'
    text: |-
      1 Recht op toeslag heeft een gehuwde, die:

      a. recht heeft op loondervingsuitkering, en

      b. per dag een inkomen heeft dat lager is dan € 71,34.

      2 Behoudens het derde lid hebben voorts recht op toeslag een ongehuwde die de leeftijd van 21 jaar nog niet heeft
      bereikt en een ongehuwde, die niet met een of meer meerderjarige personen in dezelfde woning zijn hoofdverblijf
      heeft en die:

      a. recht heeft op loondervingsuitkering, en

      b. per dag een inkomen heeft dat lager is dan:

      1°. indien hij 23 jaar of ouder is: € 53,28;

      2°. indien hij 22 jaar is: € 42,32;

      3°. indien hij 21 jaar is: € 35,68;

      4°. indien hij 20 jaar is: € 29,70;

      5°. indien hij 19 jaar is: € 24,93

      6°. indien hij 18 jaar is: € 21,47.

      3 Geen recht op toeslag heeft de in het tweede lid bedoelde ongehuwde, die de leeftijd van 21 jaar nog niet heeft
      bereikt en behoort tot het huishouden van zijn ouders of pleegouders.

      4 Zolang een gehuwde of ongehuwde geen recht heeft op een loondervingsuitkering omdat hem rechtens zijn vrijheid
      is ontnomen of omdat hij zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel, heeft hij geen recht op toeslag.

      5 Zolang een gehuwde of ongehuwde de leeftijd van 18 jaar nog niet heeft bereikt, heeft hij geen recht op toeslag.

      6 Geen recht op toeslag heeft de gehuwde of ongehuwde die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt.

      7 Recht op toeslag heeft een ongehuwde die met een of meer meerderjarige personen in dezelfde woning zijn
      hoofdverblijf heeft en die:

      a. recht heeft op loondervingsuitkering, en

      b. per dag een inkomen heeft dat lager is dan:

      1°. indien hij 23 jaar of ouder is: € 34,45

      2°. indien hij 22 jaar is: € 27,65

      3°. indien hij 21 jaar is: € 23,12.

      8 Het zevende lid is niet van toepassing op ongehuwden die de leeftijd van 21 jaar nog niet hebben bereikt.

      9 Tot de personen, bedoeld in het zevende lid, worden niet gerekend:

      a. de persoon die de leeftijd 21 jaar nog niet heeft bereikt,

      b. de persoon, niet zijnde een bloed- of aanverwant in de eerste of tweede graad van de toeslaggerechtigde,
      die op basis van een schriftelijke overeenkomst met de toeslaggerechtigde, waarbij een commerciële prijs is
      overeengekomen, als verhuurder, huurder, onderverhuurder, onderhuurder, kostgever of kostganger in dezelfde woning
      als de toeslaggerechtigde zijn hoofdverblijf heeft,

      c. de persoon die op basis van een schriftelijke overeenkomst met een derde, waarbij een commerciële prijs
      is overeengekomen, als huurder, onderhuurder of kostganger in dezelfde woning als de toeslaggerechtigde zijn
      hoofdverblijf heeft, mits hij de overeenkomst heeft met dezelfde persoon als met wie de toeslaggerechtigde een
      schriftelijke overeenkomst heeft, waarbij een commerciële prijs is overeengekomen, als huurder, onderhuurder of
      kostganger, en

      d. de persoon:

      1°. die onderwijs volgt waarvoor aanspraak op studiefinanciering als bedoeld in
      [artikel 3.1, eerste of tweede lid, van de Wet studiefinanciering 2000][ref2] kan bestaan en op enig moment
      tijdens dat onderwijs gelet op zijn leeftijd in aanmerking kan komen voor die studiefinanciering;

      2°. die onderwijs volgt waarvoor aanspraak kan bestaan op een tegemoetkoming op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref3] en op enig moment tijdens dat
      onderwijs gelet op zijn leeftijd in aanmerking kan komen voor die tegemoetkoming;

      3°. die een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a tot en met e, van de Wet educatie en beroepsonderwijs][ref4] in de
      beroepsbegeleidende leerweg volgt;

      4°. die een vergelijkbaar soort onderwijs of beroepsopleiding als bedoeld onder 1° tot en met 3° volgt buiten
      Nederland, waarbij voor onder 1° en 2° geldt dat hij op enig moment tijdens dat onderwijs jonger dan 30 jaar is of
      in de maand van aanvang de leeftijd van 30 jaren heeft bereikt.

      10 Op verzoek van het Uitvoeringsinstituut werknemersverzekeringen legt de toeslaggerechtigde de schriftelijke
      overeenkomst, bedoeld in het negende lid, onderdeel b of onderdeel c, over en toont hij de betaling van de
      commerciële prijs aan door het overleggen van de bewijzen van betaling.


