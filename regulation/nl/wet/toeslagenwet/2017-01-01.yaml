  - number: '6'
    text: |-
      1 Als inkomen wordt aangemerkt:

      a. voor een gehuwde: de som van het inkomen uit arbeid of overig inkomen van hemzelf en van zijn echtgenoot;

      b. voor een ongehuwde: zijn inkomen uit arbeid of overig inkomen.

      2 Bij algemene maatregel van bestuur wordt bepaald wat onder inkomen uit arbeid of overig inkomen als bedoeld in
      het eerste lid wordt verstaan. Daarbij kan tevens worden bepaald dat nader te bepalen inkomen dat gedeeltelijk,
      niet, of niet langer wordt genoten als gevolg van gewijzigde omstandigheden of enig handelen of nalaten van
      betrokkene in aanmerking wordt genomen alsof het wel volledig wordt genoten.
    url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#Artikel6
  - number: '7'
    text: |-
      1 In afwijking van [artikel 6][ref1] wordt gedurende een periode van ten hoogste twee jaren van het inkomen uit
      arbeid buiten aanmerking gelaten:

      a. een bedrag gelijk aan 5% van het minimumloon; alsmede

      b. indien en voor zover het inkomen uit arbeid meer bedraagt dan het in onderdeel a bedoelde bedrag, 30% van dat
      inkomen.

      2 Het niet in aanmerking te nemen inkomen, bedoeld in het eerste lid, bedraagt ten hoogste 15% van het minimumloon.

      3 Voor de vaststelling van de in het eerste lid bedoelde periode wordt een periode waarover een uitkering op grond
      van de [Ziektewet][ref2] is ontvangen, buiten beschouwing gelaten.

      4 De beperking tot een periode van twee jaren, als bedoeld in het eerste lid, is niet van toepassing ten aanzien
      van de persoon die recht heeft op een uitkering op grond van de [Werkloosheidswet][ref3] terzake van werkloosheid
      ontstaan na het bereiken van de leeftijd van 57,5 jaar.


