  - number: 15a
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van de toeslag op indien degene aan wie een
      toeslag is toegekend een vreemdeling als bedoeld in de [Vreemdelingenwet 2000][ref1] is die niet rechtmatig in
      Nederland verblijf houdt als bedoeld in [artikel 8 van die wet][ref2].


