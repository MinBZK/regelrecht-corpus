  - number: 14a
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op van ten hoogste het
      benadelingsbedrag wegens het niet of niet behoorlijk nakomen door degene die aanspraak maakt op een toeslag, zijn
      echtgenoot, of zijn wettelijke vertegenwoordiger van de verplichting, bedoeld in [artikel 12][ref1]. Indien de
      feiten en omstandigheden, bedoeld in artikel 12, niet of niet behoorlijk zijn medegedeeld en deze overtreding
      opzettelijk is begaan, bedraagt de bestuurlijke boete ten hoogste het bedrag van de vijfde categorie, bedoeld
      in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2]. Indien de feiten en omstandigheden, bedoeld
      in artikel 12, niet of niet behoorlijk zijn medegedeeld en deze overtreding niet opzettelijk is begaan, bedraagt
      de bestuurlijke boete ten hoogste het bedrag van de derde categorie, bedoeld in artikel 23, vierde lid, van het
      Wetboek van Strafrecht.

      2 In dit artikel wordt onder benadelingsbedrag verstaan het brutobedrag dat als gevolg van het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in [artikel 12][ref3], ten onrechte of tot een te hoog bedrag aan
      toeslag is ontvangen.

      3 Indien het niet of niet behoorlijk nakomen door degene die aanspraak maakt op een toeslag, zijn echtgenoot, of
      zijn wettelijke vertegenwoordiger van de verplichting, bedoeld in [artikel 12][ref4], niet heeft geleid tot een
      benadelingsbedrag, legt het Uitvoeringsinstituut werknemersverzekeringen een bestuurlijke boete op van ten hoogste
      het bedrag van de tweede categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref5].

      4 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een bestuurlijke boete en
      volstaan met het geven van een schriftelijke waarschuwing wegens het niet of niet behoorlijk nakomen van de
      verplichting, bedoeld in [artikel 12][ref6], in situaties die bij algemene maatregel van bestuur worden bepaald,
      tenzij het niet of niet behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van twee jaar te
      rekenen vanaf de datum waarop eerder aan degene die aanspraak maakt op een toeslag, zijn echtgenoot, of zijn
      wettelijke vertegenwoordiger een zodanige waarschuwing is gegeven.

      5 Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op wegens het niet of niet
      behoorlijk nakomen door degene die aanspraak maakt op een toeslag, zijn echtgenoot, of zijn wettelijke
      vertegenwoordiger van de verplichting, bedoeld in [artikel 12][ref7], als gevolg waarvan ten onrechte of tot een
      te hoog bedrag aan toeslag is ontvangen, van ten hoogste 150 procent van het benadelingsbedrag, met overeenkomstige
      toepassing van het eerste lid, indien binnen een tijdvak van vijf jaar voorafgaand aan de dag van het begaan van de
      overtreding een eerdere bestuurlijke boete of strafrechtelijke sanctie is opgelegd wegens een eerdere overtreding,
      bestaande uit eenzelfde gedraging, die onherroepelijk is geworden.

      6 Onder eenzelfde gedraging als bedoeld in het vijfde lid wordt verstaan het niet of niet behoorlijk nakomen
      van de verplichting, bedoeld in de [artikelen 12][ref8] van deze wet, [25 van de Werkloosheidswet][ref9],
      [70, eerste en tweede lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref10],
      [12, eerste lid, van de Wet inkomensvoorziening oudere werklozen][ref11],
      [80 van de Wet op de arbeidsongeschiktheidsverzekering][ref12], [2:7, eerste lid][ref13],
      of [3:74 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref14],
      [27, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref15], [31, eerste lid][ref16], of
      [49 van de Ziektewet][ref17], als gevolg waarvan ten onrechte of tot een te hoog bedrag aan uitkering,
      inkomensvoorziening, ziekengeld of toeslag is verleend.

      7 In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens de
      eerdere overtreding, bedoeld in het vijfde lid, degene die aanspraak maakt op een toeslag, zijn echtgenoot, of zijn
      wettelijke vertegenwoordiger is gestraft met een onvoorwaardelijke gevangenisstraf.

      8 Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een bestuurlijke boete indien
      daarvoor dringende redenen aanwezig zijn.

      9 Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van
      belang zijn.

      10 Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.

      11 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij de bestuurlijke boete is opgelegd.

      12 In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref18] kan de rechter in beroep of hoger
      beroep het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de degene die aanspraak maakt op
      een toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger wijzigen.

      13 Indien ten aanzien van een overtreding waarvoor een bestuurlijke boete is opgelegd geen sprake is geweest
      van opzet of grove schuld, en voorts is gebleken dat binnen een jaar nadat de bestuurlijke boete is opgelegd
      niet nogmaals een overtreding wegens eenzelfde gedraging als bedoeld in het zesde lid is begaan, is het
      Uitvoeringsinstituut werknemersverzekeringen bevoegd op verzoek van degene aan wie de bestuurlijke boete is
      opgelegd, de bestuurlijke boete geheel of gedeeltelijk kwijt te schelden bij medewerking aan een schuldregeling.
      [Artikel 21, eerste, derde en vierde lid][ref19], is van overeenkomstige toepassing.

      14 Het besluit tot kwijtschelding, bedoeld in het dertiende lid, wordt ingetrokken of ten nadele van degene aan
      wie de bestuurlijke boete is opgelegd herzien indien binnen vijf jaar na het besluit tot kwijtschelding wederom een
      overtreding is begaan wegens eenzelfde gedraging als bedoeld in het zesde lid.


