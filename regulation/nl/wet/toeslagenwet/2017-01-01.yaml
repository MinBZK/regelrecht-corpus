  - number: 44b
    text: |-
      1 Voor de toepassing van dit artikel wordt onder verordening verstaan: Verordening (EG) nr. 647/2005 van het
      Europees Parlement en de Raad van 13 april 2005 tot wijziging van Verordening (EEG) nr. 1408/71 van de Raad
      betreffende de toepassing van de socialezekerheidsregelingen op werknemers en zelfstandigen, alsmede op hun
      gezinsleden, die zich binnen de Gemeenschap verplaatsen, en van Verordening (EEG) nr. 574/72 van de Raad tot
      vaststelling van de wijze van toepassing van Verordening (EEG) nr. 1408/71 (PbEU (L 117).

      2 Aan de persoon, bedoeld in [artikel 2, eerste of tweede lid][ref1], die:

      a. op de dag voor de inwerkingtreding van de verordening recht op toeslag heeft op grond van artikel 10, eerste
      lid, van Verordening (EEG) nr. 1408/71 van de Raad van de Europese gemeenschappen van 14 juni 1971 betreffende de
      toepassing van de socialezekerheidsregelingen op werknemers en zelfstandigen, alsmede op hun gezinsleden, die zich
      binnen de gemeenschap verplaatsen (PbEG L 149); en

      b. niet in Nederland woont maar wel in een andere lidstaat van de Europese Unie, in een land aangesloten bij de
      Europese Economische Ruimte dan wel in Zwitserland, wordt in afwijking van [artikel 4a][ref2]:

      1°. vanaf de datum van inwerkingtreding van de verordening tot en met een jaar na het tijdstip van inwerkingtreding
      van de wet waarbij dit artikel in deze wet is ingevoegd het bedrag uitbetaald waarop recht zou bestaan indien
      betrokkene in Nederland zou wonen;

      2°. gedurende het tweede jaar na het tijdstip van inwerkingtreding van de wet waarbij dit artikel in deze wet is
      ingevoegd twee derden van het bedrag uitbetaald waarop recht zou bestaan indien betrokkene in Nederland zou wonen;
      en

      3°. gedurende het derde jaar na het tijdstip van inwerkingtreding van de wet waarbij dit artikel in deze wet is
      ingevoegd een derde van het bedrag uitbetaald waarop recht zou bestaan indien betrokkene in Nederland zou wonen.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel4a
    url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#Artikel44b
