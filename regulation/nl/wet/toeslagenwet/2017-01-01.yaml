  - number: '12'
    text: |-
      1 Degene die aanspraak maakt op toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger, alsmede
      de instelling aan welke ingevolge [artikel 22][ref1] toeslag wordt uitbetaald, zijn verplicht aan het
      Uitvoeringsinstituut werknemersverzekeringen op zijn verzoek of onverwijld uit eigen beweging alle feiten en
      omstandigheden mee te delen waarvan hem of haar redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen
      zijn op het recht op toeslag, de hoogte van de toeslag, het geldend maken van het recht op toeslag of op het
      bedrag van de toeslag dat wordt betaald. Deze verplichting geldt niet indien die feiten en omstandigheden door
      het Uitvoeringsinstituut werknemersverzekeringen kunnen worden vastgesteld op grond van bij wettelijk voorschrift
      als authentiek aangemerkte gegevens of kunnen worden verkregen uit bij ministeriële regeling aan te wijzen
      administraties. Bij ministeriële regeling wordt bepaald voor welke gegevens de tweede zin van toepassing is.

      2 Op verzoek van het Uitvoeringsinstituut werknemersverzekeringen legt de meerderjarige persoon die in dezelfde
      woning als de toeslaggerechtigde zijn hoofdverblijf heeft, als bedoeld in [artikel 2, zevende lid][ref2],
      desgevraagd alle gegevens en inlichtingen over die voor de beoordeling van de aanspraak op toeslag van belang
      kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel2
