  - number: '44'
    text: |-
      Op de persoon die op de dag voorafgaand aan de inwerkingtreding van
      [artikel 1.10, onderdeel C, van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref1]
      recht had op een toeslag op grond van deze wet blijft tenzij het recht op de uitkering eindigt,
      [artikel 8, vierde lid][ref2], zoals dat luidde op die dag van toepassing tot een bij ministeriële regeling bepaald
      tijdstip dat voor verschillende groepen personen verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel1.10
