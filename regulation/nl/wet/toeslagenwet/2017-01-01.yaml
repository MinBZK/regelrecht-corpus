        bwb_id: BWBR0017745
        artikel: '120'
  - number: '36'
    text: |-
      1 Indien de aanvraag om een toeslag tezamen met een aanvraag om een loondervingsuitkering wordt ingediend, wordt
      de beschikking over de toeslag gegeven binnen de termijn die geldt voor het geven van een beschikking inzake de
      loondervingsuitkering.

      2 Indien een beschikking als bedoeld in het eerste lid niet binnen de toepasselijke termijn kan worden gegeven,
      wordt dit schriftelijk aan de aanvrager medegedeeld onder vermelding van een zo kort mogelijke termijn waarbinnen
      de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#Artikel36
  - number: '37'
    text: |-
      1 Onverminderd [artikel 36][ref1], worden de beschikkingen op grond van deze wet en de daarop berustende bepalingen
      gegeven binnen een redelijke termijn na ontvangst van de aanvraag.

      2 De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.

      3 Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel36
    url: https://wetten.overheid.nl/BWBR0004043/2017-01-01#Artikel37
