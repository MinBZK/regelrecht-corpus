  - number: 12a
    text: |-
      1 In aanvulling op [artikel 12][ref1] kan het Uitvoeringsinstituut werknemersverzekeringen degene die aanspraak
      maakt op toeslag of zijn wettelijke vertegenwoordiger verzoeken aan te tonen dat:

      a. degene die aanspraak maakt op toeslag een ongehuwde is als bedoeld in
      [artikel 2, tweede lid, onderdeel a en onderdeel b, onder 1°, 2° of 3°][ref2];

      b. de feitelijke woonsituatie van degene die aanspraak maakt op toeslag, van zijn echtgenoot of van een kind in
      overeenstemming is met het verstrekte adres van hemzelf, zijn echtgenoot of van zijn kind.

      Teneinde hem daartoe in de gelegenheid te stellen kan het Uitvoeringsinstituut werknemersverzekeringen bij
      die verzoeken aanbieden met de toestemming van degene die aanspraak maakt op toeslag dan wel zijn wettelijke
      vertegenwoordiger de woning van degene die aanspraak maakt op toeslag binnen te treden.

      2 Indien degene die aanspraak maakt op toeslag dan wel zijn wettelijke vertegenwoordiger niet
      desgevraagd aantoont dat degene die aanspraak maakt op toeslag een ongehuwde is als bedoeld in
      [artikel 2, tweede lid, onderdeel a en onderdeel b, onder 1°, 2° of 3°][ref3], wordt de toeslag toegekend
      respectievelijk herzien naar een hoogte gelijk aan het verschil tussen de helft van het bedrag, bedoeld in
      [artikel 8, eerste lid][ref4], en het inkomen per dag.


