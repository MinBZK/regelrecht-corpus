    text: |-
      1 Degene die aanspraak maakt op toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger, alsmede de
      instelling aan welke ingevolge [artikel 22][ref1] toeslag wordt uitbetaald, zijn verplicht de voorschriften,
      bedoeld in [artikel 30][ref2], op te volgen en anderszins aan het Uitvoeringsinstituut werknemersverzekeringen
      desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor de uitvoering van deze wet.

      2 Degene die aanspraak maakt op toeslag of zijn echtgenoot onthouden zich van zeer ernstige misdragingen jegens de
      met de uitvoering van deze wet belaste personen en instanties tijdens het verrichten van hun werkzaamheden.


