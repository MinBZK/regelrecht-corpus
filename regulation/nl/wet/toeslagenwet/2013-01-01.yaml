        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0004043
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '9.2'
    text: |-
      Van de herziene bedragen, bedoeld in het eerste lid, wordt door Onze Minister mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel9
  - number: '10.1'
    text: |-
      Degene die recht heeft op een toeslag heeft tevens recht op een vakantie-uitkering ter hoogte van 8% van die
      toeslag.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel10
  - number: '10.2'
    text: |-
      Het eerste lid is niet van toepassing indien in het dagloon waarnaar de loondervingsuitkering is berekend, geen
      vakantietoeslag is begrepen.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel10
  - number: '10.3'
    text: |-
      Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1] wordt gewijzigd, wordt dit
      gewijzigde percentage in aanmerking genomen over het bedrag van de toeslag waarop recht bestaat over de periode
      aanvangende met de dag waarop die wijziging ingaat. Het gewijzigde percentage treedt in de plaats van het in het
      eerste lid genoemde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '10.4'
    text: |-
      Het bepaalde bij of krachtens [de artikelen 12][ref1], [13][ref2], [14][ref3], [15, vierde lid][ref4], [18][ref5],
      [20][ref6], [21][ref7], [22][ref8], [23][ref9], [23a][ref10], [25][ref11], [27][ref12] en [29][ref13] vindt
      overeenkomstige toepassing ten aanzien van de vakantie-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0004043#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0004043#Artikel15
