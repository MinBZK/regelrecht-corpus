        artikel: 64a
      - id: ref2
        bwb_id: BWBR0004046
        artikel: 64a
  - number: 44a.2.a
    text: |-
      op 31 december 2007 recht had op een verhoging van zijn uitkering op grond van
      [artikel 64a van de Invoeringswet stelselherziening sociale zekerheid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel64a
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44a
    references:
      - id: ref1
