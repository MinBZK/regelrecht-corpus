        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: 44a.1
    text: |-
      De [artikelen 24][ref1], [48][ref2] en [64a van de Invoeringswet stelselherziening sociale zekerheid][ref3] en de
      daarop rustende bepalingen zoals deze luidden op 31 december 2007 blijven tot 1 maart 2008 van toepassing op de
      persoon die:


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0004046#Artikel64a
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44a
    references:
