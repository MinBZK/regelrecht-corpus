  - number: '1.2'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: 1.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: 1.2.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: 1.2.c
    text: 'gehuwd: als partner geregistreerd;'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: 1.2.d
    text: 'gehuwde: als partner geregistreerde.'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: '1.3'
    text: 'In deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: 1.3.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: 1.3.b
    text: als ongehuwd mede aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: '1.4'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: '1.5'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: 1.5.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: 1.5.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: 1.5.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: 1.5.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: '1.6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vijfde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: '1.7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: '1.8'
    text: |-
      Onder bloedverwant in de eerste graad als bedoeld in het derde lid, onderdeel a, wordt mede verstaan een
      meerderjarig aangehuwd kind of een meerderjarig voormalig pleegkind van de ongehuwde meerderjarige.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
  - number: '1.9'
    text: |-
      Onder voormalig pleegkind als bedoeld in het achtste lid wordt verstaan een pleegkind waarvoor de ongehuwde
      meerderjarige een pleegvergoeding ontving of ontvangt op grond van de [Wet op de jeugdzorg][ref1] of kinderbijslag
      ontving op grond van de [Algemene Kinderbijslagwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016637
      - id: ref2
        bwb_id: BWBR0002368
  - number: '2.1'
    text: 'Recht op toeslag heeft een gehuwde, die:'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: 2.1.a
    text: recht heeft op loondervingsuitkering, en
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: 2.1.b
    text: per dag een inkomen heeft dat lager is dan € 59,80.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: '2.2'
    text: 'Recht op toeslag heeft een ongehuwde, die:'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: 2.2.a
    text: recht heeft op loondervingsuitkering;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: 2.2.b
    text: |-
      een kind heeft jonger dan 18 jaar, dat niet als eigen kind, aangehuwd kind of pleegkind tot het huishouden van een
      ander behoort en voor wie aan hem op grond van [artikel 18 van de Algemene Kinderbijslagwet][ref1] kinderbijslag
      wordt betaald, zal worden betaald of zou worden betaald indien [artikel 7, tweede lid, van die wet][ref2] niet van
      toepassing zou zijn, en


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '7'
  - number: 2.2.c
    text: per dag een inkomen heeft dat lager is dan € 54,61.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: '2.3'
    text: 'Behoudens het vierde lid heeft voorts recht op toeslag een ongehuwde, die:'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: 2.3.a
    text: recht heeft op loondervingsuitkering, en
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: 2.3.b
    text: 'per dag een inkomen heeft dat lager is dan:'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: 2.3.b.1°
    text: 'indien hij 23 jaar of ouder is: € 46,12;'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: 2.3.b.2°
    text: 'indien hij 22 jaar is: € 35,29;'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: 2.3.b.3°
    text: 'indien hij 21 jaar is: € 29,64;'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: 2.3.b.4°
    text: 'indien hij 20 jaar is: € 24,76;'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: 2.3.b.5°
    text: 'indien hij 19 jaar is: € 21,14;'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: 2.3.b.6°
    text: 'indien hij 18 jaar is: € 19,06.'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: '2.4'
    text: |-
      Geen recht op toeslag heeft de in het derde lid bedoelde ongehuwde, die de leeftijd van 21 jaar nog niet heeft
      bereikt en behoort tot het huishouden van zijn ouders of pleegouders.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: '2.5'
    text: |-
      Zolang een gehuwde of ongehuwde geen recht heeft op een loondervingsuitkering omdat hem rechtens zijn vrijheid
      is ontnomen of omdat hij zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel, heeft hij geen recht op toeslag.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: '2.6'
    text: Zolang een gehuwde of ongehuwde de leeftijd van 18 jaar nog niet heeft bereikt, heeft hij geen recht op toeslag.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel2
  - number: '3'
    text: |-
      Vanaf 1990 heeft een gehuwde wiens echtgenoot is geboren na 31 december 1971 geen recht op toeslag, tenzij tot zijn
      huishouden een eigen kind, aangehuwd kind of pleegkind behoort dat jonger is dan 12 jaar.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel3
  - number: '4'
    text: |-
      Geen recht op toeslag heeft de persoon die onbetaald verlof geniet als bedoeld in
      [artikel 1, onderdeel g, van de Werkloosheidswet][ref1] of die met die persoon gehuwd is, ter hoogte van het bedrag
      van het verlies van inkomen uit arbeid als gevolg van het genieten van dat verlof.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
  - number: 4a.1
    text: |-
      Geen recht op toeslag heeft de persoon, bedoeld in [artikel 2][ref1], gedurende de periode dat hij niet in
      Nederland woont.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 4a.2
    text: |-
      De persoon, bedoeld in [artikel 2][ref1], die op grond van het eerste lid geen recht heeft op toeslag,
      heeft vanaf de dag dat hij in Nederland woont recht op toeslag, indien hij aan de voorwaarden, bedoeld in
      [artikel 2, eerste, tweede of derde lid][ref2], voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel2
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 4b
    text: |-
      Geen recht op toeslag heeft de persoon die inkomensondersteuning als bedoeld in
      [artikel 2:43 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref1] ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel2
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '2'
  - number: '5.1'
    text: |-
      Indien de loondervingsuitkering gedeeltelijk wordt geweigerd op grond van enig handelen of nalaten
      van betrokkene dat hem redelijkerwijs kan worden verweten, of het recht op loon, bedoeld in
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1], dan wel de bezoldiging of hetgeen daarmee
      overeenkomt, bedoeld in [artikel 76a van de Ziektewet][ref2], gedeeltelijk ontbreekt dan wel de betaling
      daarvan is opgeschort door toepassing van het [derde of zesde lid van genoemd artikel 629][ref3], het
      [eerste tot en met derde lid van artikel 76b van de Ziektewet][ref4] of [artikel 76c van de Ziektewet][ref5] wordt
      voor de toepassing van deze wet en de daarop berustende bepalingen de loondervingsuitkering in aanmerking genomen
      alsof die weigering niet heeft plaatsgevonden en het loon, de bezoldiging of hetgeen daarmee overeenkomt alsof die
      artikelleden niet zijn toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel76b
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel76c
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 76a
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: 76b
      - id: ref5
        bwb_id: BWBR0001888
        artikel: 76c
  - number: '5.2'
    text: |-
      Geen recht op toeslag bestaat, indien de loondervingsuitkering, het loon, de bezoldiging of hetgeen daarmee
      overeenkomt, bedoeld in het eerste lid, niet tot uitbetaling komt op grond van enig handelen of nalaten van
      betrokkene dat hem redelijkerwijs kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel5
  - number: '5.3'
    text: |-
      Indien bij samenloop van loondervingsuitkeringen op grond van enig handelen of nalaten van betrokkene dat hem
      redelijkerwijs kan worden verweten een of meer van de loondervingsuitkeringen gedeeltelijk worden geweigerd of
      niet tot uitbetaling komen, wordt voor de toepassing van deze wet en de daarop berustende bepalingen het inkomen
      in aanmerking genomen alsof die weigering niet heeft plaatsgevonden respectievelijk alsof die uitbetaling heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel5
  - number: '5.4'
    text: |-
      Indien de uitkering op grond van de [Werkloosheidswet][ref1] gedeeltelijk is geëindigd omdat de betrokkene
      minder beschikbaar is voor arbeid dan het aantal arbeidsuren dat hij heeft verloren wordt voor de toepassing van
      deze wet en de daarop berustende bepalingen die uitkering in aanmerking genomen alsof die eindiging niet heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '5.5'
    text: |-
      Indien de uitkering op grond van [artikel 35ab van de Werkloosheidswet][ref1] is verminderd, wordt voor
      de toepassing van deze wet en de daarop berustende bepalingen de uitkering in aanmerking genomen alsof die
      vermindering niet heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel35ab
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 35ab
  - number: '6.1'
    text: 'Als inkomen wordt aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel6
  - number: 6.1.a
    text: 'voor een gehuwde: de som van het inkomen uit arbeid of overig inkomen van hemzelf en van zijn echtgenoot;'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel6
  - number: 6.1.b
    text: 'voor een ongehuwde: zijn inkomen uit arbeid of overig inkomen.'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel6
  - number: '6.2'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald wat onder inkomen uit arbeid of overig inkomen als bedoeld in het
      eerste lid wordt verstaan. Daarbij kan tevens worden bepaald dat nader te bepalen inkomen dat gedeeltelijk, niet,
      of niet langer wordt genoten als gevolg van gewijzigde omstandigheden of enig handelen of nalaten van betrokkene in
      aanmerking wordt genomen alsof het wel volledig wordt genoten.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel6
  - number: '7.1'
    text: |-
      In afwijking van [artikel 6][ref1] wordt gedurende een periode van ten hoogste twee jaren van het inkomen uit
      arbeid buiten aanmerking gelaten:


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel6
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: 7.1.a
    text: een bedrag gelijk aan 5% van het minimumloon; alsmede
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel7
  - number: 7.1.b
    text: |-
      indien en voor zover het inkomen uit arbeid meer bedraagt dan het in onderdeel a bedoelde bedrag, 30% van dat
      inkomen.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel7
  - number: '7.2'
    text: Het niet in aanmerking te nemen inkomen, bedoeld in het eerste lid, bedraagt ten hoogste 15% van het minimumloon.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      Voor de vaststelling van de in het eerste lid bedoelde periode wordt een periode waarover een uitkering op grond
      van de [Ziektewet][ref1] is ontvangen, buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '7.4'
    text: |-
      De beperking tot een periode van twee jaren, als bedoeld in het eerste lid, is niet van toepassing ten aanzien
      van de persoon die recht heeft op een uitkering op grond van de [Werkloosheidswet][ref1] terzake van werkloosheid
      ontstaan na het bereiken van de leeftijd van 57,5 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '8.1'
    text: |-
      Voor de persoon, bedoeld in [artikel 2, eerste lid][ref1], is de toeslag gelijk aan het verschil tussen € 59,80 en
      het inkomen per dag.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Voor de persoon, bedoeld in [artikel 2, tweede lid][ref1], is de toeslag gelijk aan het verschil tussen € 54,61 en
      het inkomen per dag.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.3'
    text: |-
      Voor de persoon, bedoeld in [artikel 2, derde lid][ref1], is de toeslag gelijk aan het verschil tussen het in
      [artikel 2, derde lid, onderdeel b][ref2], bij de leeftijd van die persoon genoemd bedrag en het inkomen per dag.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel2
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 8a.1
    text: |-
      De toeslag bedraagt niet meer dan het verschil tussen het dagloon, vervolgdagloon of de grondslag waarnaar de
      loondervingsuitkering is berekend, en de loondervingsuitkering, voor:
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel8a
  - number: 8a.1.a
    text: |-
      de persoon, bedoeld in [artikel 2, eerste lid][ref1], indien het dagloon, vervolgdagloon of de grondslag waarnaar
      de loondervingsuitkering is berekend, lager is dan het minimumloon;


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 8a.1.b
    text: |-
      de persoon, bedoeld in [artikel 2, tweede lid][ref1], indien het dagloon, vervolgdagloon of de grondslag waarnaar
      de loondervingsuitkering is berekend, lager is dan 90% van het minimumloon;


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 8a.1.c
    text: |-
      de persoon, bedoeld in [artikel 2, derde lid][ref1], indien het dagloon, vervolgdagloon of de grondslag waarnaar de
      loondervingsuitkering is berekend, lager is dan 70% van het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 8a.2
    text: |-
      Voor de toepassing van het eerste lid wordt de in het dagloon, vervolgdagloon of grondslag waarnaar de
      loondervingsuitkering is berekend, begrepen vakantiebijslag niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel8a
  - number: 8a.3
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat voor de toepassing van het eerste lid ander inkomen dan
      de loondervingsuitkering wordt gelijkgesteld met de op het dagloon, vervolgdagloon of de grondslag waarnaar de
      loondervingsuitkering is berekend, in mindering te brengen loondervingsuitkering.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel8a
  - number: 8a.4
    text: |-
      Voor de toepassing van dit artikel wordt tevens onder grondslag verstaan de factor A, bedoeld in
      [artikel 10, eerste lid, van de Wet inkomensvoorziening oudere werklozen][ref1], gedeeld door 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel10
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '10'
  - number: '9.1'
    text: |-
      De in de [artikelen 2][ref1] en [8][ref2] genoemde bedragen worden gewijzigd overeenkomstig de wijze en met ingang
      van de dag waarop de bedragen, genoemd in [hoofdstuk 3 van de Wet werk en bijstand][ref3], worden gewijzigd. De
      herziene bedragen treden voor de in de [artikelen 2][ref4] en [8][ref5] genoemde bedragen in de plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0004043#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0004043#Artikel8
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015703
        hoofdstuk: '3'
