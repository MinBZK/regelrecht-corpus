    text: op 31 december 2007 geen recht had op een toeslag, en
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44a
  - number: 44a.2.c
    text: op 1 januari 2008 recht zou hebben op een toeslag.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44a
  - number: 44b.1
    text: |-
      Voor de toepassing van dit artikel wordt onder verordening verstaan: Verordening (EG) nr. 647/2005 van het Europees
      Parlement en de Raad van 13 april 2005 tot wijziging van Verordening (EEG) nr. 1408/71 van de Raad betreffende de
      toepassing van de socialezekerheidsregelingen op werknemers en zelfstandigen, alsmede op hun gezinsleden, die zich
      binnen de Gemeenschap verplaatsen, en van Verordening (EEG) nr. 574/72 van de Raad tot vaststelling van de wijze
      van toepassing van Verordening (EEG) nr. 1408/71 (PbEU (L 117).
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44b
  - number: 44b.2
    text: |-
      Aan de persoon, bedoeld in [artikel 2, eerste, tweede of derde lid][ref1], die:


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 44b.2.a
    text: |-
      op de dag voor de inwerkingtreding van de verordening recht op toeslag heeft op grond van artikel 10, eerste
      lid, van Verordening (EEG) nr. 1408/71 van de Raad van de Europese gemeenschappen van 14 juni 1971 betreffende de
      toepassing van de socialezekerheidsregelingen op werknemers en zelfstandigen, alsmede op hun gezinsleden, die zich
      binnen de gemeenschap verplaatsen (PbEG L 149); en
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44b
  - number: 44b.2.b
    text: |-
      niet in Nederland woont maar wel in een andere lidstaat van de Europese Unie, in een land aangesloten bij de
      Europese Economische Ruimte dan wel in Zwitserland, wordt in afwijking van [artikel 4a][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel4a
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 4a
        hoofdstuk: II
        paragraaf: '1'
  - number: 44b.2.b.1°
    text: |-
      vanaf de datum van inwerkingtreding van de verordening tot en met een jaar na het tijdstip van inwerkingtreding
      van de wet waarbij dit artikel in deze wet is ingevoegd het bedrag uitbetaald waarop recht zou bestaan indien
      betrokkene in Nederland zou wonen;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44b
  - number: 44b.2.b.2°
    text: |-
      gedurende het tweede jaar na het tijdstip van inwerkingtreding van de wet waarbij dit artikel in deze wet is
      ingevoegd twee derden van het bedrag uitbetaald waarop recht zou bestaan indien betrokkene in Nederland zou wonen;
      en
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44b
  - number: 44b.2.b.3°
    text: |-
      gedurende het derde jaar na het tijdstip van inwerkingtreding van de wet waarbij dit artikel in deze wet is
      ingevoegd een derde van het bedrag uitbetaald waarop recht zou bestaan indien betrokkene in Nederland zou wonen.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44b
  - number: 44c
    text: |-
      [Artikel 1, achtste en negende lid][ref1], is niet van toepassing indien voor de inwerkingtreding van deze
      artikelleden op grond van [artikel 2][ref2] recht bestaat op toeslag omdat de ongehuwde toeslaggerechtigde wegens
      een gezamenlijke huishouding met een meerderjarig aangehuwd kind of een meerderjarig voormalig pleegkind is
      aangemerkt als gehuwd, voor zolang dit recht op toeslag bestaat, tenzij toepassing van de genoemde artikelleden
      leidt tot een hogere toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel2
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44c
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
