        artikel: '24'
      - id: ref2
        bwb_id: BWBR0004046
        artikel: '48'
      - id: ref3
        bwb_id: BWBR0004046
        artikel: 64a
  - number: 44a.1.b
    text: op 1 januari 2008 geen recht heeft op een toeslag.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44a
  - number: 44a.2
    text: |-
      [Artikel 64a van de Invoeringswet stelselherziening sociale zekerheid][ref1] en deze wet en de op
      [dat artikel][ref2] en deze wet rustende bepalingen zoals deze luidden op 31 december 2007 blijven van toepassing
      tot de dag waarop het recht op ziekengeld is geëindigd, maar uiterlijk tot 1 maart 2008 op de persoon die:


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel64a
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel64a
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44a
    references:
