  - number: '11.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt op aanvraag vast of recht op toeslag bestaat. De aanvraag
      wordt ingediend bij het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel11
  - number: '11.2'
    text: |-
      Op de toekenning en de beëindiging van een toeslag op een loondervingsuitkering zijn de [artikelen 3:40][ref1] en
      [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 11.2.a
    text: redelijkerwijs mag worden aangenomen dat aan de bekendmaking van de beschikking geen behoefte bestaat en
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel11
  - number: 11.2.b
    text: |-
      de toepasselijkheid van deze artikelen ook is uitgesloten voor de toekenning en de beëindiging van de
      loondervingsuitkering waarop de toeslag wordt of werd betaald.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel11
  - number: '11.3'
    text: |-
      De toeslag op een loondervingsuitkering wordt betaald zonder dat dit bij beschikking is vastgesteld indien
      de loondervingsuitkering waarop de toeslag wordt of werd betaald ook op die wijze wordt betaald en indien
      redelijkerwijs mag worden aangenomen dat aan een beschikking geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel11
  - number: '11.4'
    text: |-
      Een toeslag als bedoeld in het derde lid wordt beëindigd zonder dat dit bij beschikking is vastgesteld, indien
      redelijkerwijs mag worden aangenomen dat aan een beschikking geen behoefte bestaat. Indien de belanghebbende binnen
      een redelijke termijn om een beschikking verzoekt, wordt deze zo spoedig mogelijk alsnog verstrekt.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel11
  - number: '11.5'
    text: |-
      Een herziening van de toeslag als gevolg van een wijziging van de in de [artikelen 2][ref1] en [8][ref2] genoemde
      bedragen als bedoeld in [artikel 9][ref3] of als gevolg van een indexering van het dagloon of de grondslag waarnaar
      de loondervingsuitkering is berekend vindt plaats zonder dat dit bij beschikking is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004043#Artikel9
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004043
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: '11.6'
    text: De vakantie-uitkering wordt betaald zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel11
  - number: '11.7'
    text: |-
      Het recht op toeslag kan niet worden vastgesteld over perioden gelegen voor één jaar voorafgaande aan de dag waarop
      de aanvraag om toeslag werd ingediend. Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd in bijzondere
      gevallen af te wijken van de vorige zin.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel11
  - number: 11a.1
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van toeslag en terzake van weigering van toeslag, herziet het Uitvoeringsinstituut werknemersverzekeringen een
      dergelijk besluit of trekt zij dat in:
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel11a
  - number: 11a.1.a
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 12][ref1],
      [12a, eerste lid, aanhef en onderdeel b][ref2], of [13][ref3] heeft geleid tot het ten onrechte of tot een te hoog
      bedrag verlenen van toeslag;


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0004043#Artikel13
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: 12a
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004043
        artikel: '13'
        hoofdstuk: II
        paragraaf: '4'
  - number: 11a.1.b
    text: indien anderszins de toeslag ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel11a
  - number: 11a.1.c
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 12][ref1],
      [12a, eerste lid, aanhef en onderdeel b][ref2], of [13][ref3] ertoe leidt dat niet kan worden vastgesteld of nog
      recht op toeslag bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0004043#Artikel13
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: 12a
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004043
        artikel: '13'
        hoofdstuk: II
        paragraaf: '4'
  - number: 11a.2
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van herziening of intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel11a
  - number: '12'
    text: |-
      Degene die aanspraak maakt op toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger, alsmede de instelling
      aan welke ingevolge [artikel 22][ref1] toeslag wordt uitbetaald, zijn verplicht aan het Uitvoeringsinstituut
      werknemersverzekeringen op zijn verzoek of onverwijld uit eigen beweging alle feiten en omstandigheden mee te
      delen waarvan hem of haar redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op
      toeslag, de hoogte van de toeslag, het geldend maken van het recht op toeslag of op het bedrag van de toeslag
      dat wordt betaald. Deze verplichting geldt niet indien die feiten en omstandigheden door het Uitvoeringsinstituut
      werknemersverzekeringen kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte
      gegevens of kunnen worden verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële
      regeling wordt bepaald voor welke gegevens de tweede zin van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel22
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '22'
        hoofdstuk: II
        paragraaf: '5'
  - number: 12a.1
    text: |-
      In aanvulling op [artikel 12][ref1] kan het Uitvoeringsinstituut werknemersverzekeringen degene die aanspraak maakt
      op toeslag of zijn wettelijke vertegenwoordiger verzoeken aan te tonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
  - number: 12a.1.a
    text: |-
      degene die aanspraak maakt op toeslag een ongehuwde is als bedoeld in
      [artikel 2, tweede of derde lid, onderdeel a en onderdeel b, onder 1°, 2° of 3°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 12a.1.b
    text: |-
      de feitelijke woonsituatie van degene die aanspraak maakt op toeslag, van zijn echtgenoot of van een kind in
      overeenstemming is met het verstrekte adres van hemzelf, zijn echtgenoot of van zijn kind.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel12a
  - number: 12a.2
    text: |-
      Indien degene die aanspraak maakt op toeslag dan wel zijn wettelijke vertegenwoordiger niet
      desgevraagd aantoont dat degene die aanspraak maakt op toeslag een ongehuwde is als bedoeld in
      [artikel 2, tweede lid, of derde lid, onderdeel a en onderdeel b, onder 1°, 2° of 3°][ref1], wordt de toeslag
      toegekend respectievelijk herzien naar een hoogte gelijk aan het verschil tussen de helft van het bedrag, bedoeld
      in [artikel 8, eerste lid][ref2], en het inkomen per dag.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel8
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '13'
    text: |-
      Degene die aanspraak maakt op toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger, alsmede de instelling
      aan welke ingevolge [artikel 22][ref1] toeslag wordt uitbetaald, zijn verplicht de voorschriften, bedoeld in
      [artikel 30][ref2], op te volgen en anderszins aan het Uitvoeringsinstituut werknemersverzekeringen desgevraagd de
      medewerking te verlenen die redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel30
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '22'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '30'
        hoofdstuk: IV
  - number: '14.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen weigert de toeslag tijdelijk of blijvend, geheel of
      gedeeltelijk ter zake van het niet of niet behoorlijk nakomen door degene die aanspraak maakt op een toeslag,
      zijn echtgenoot, of zijn wettelijke vertegenwoordiger van een verplichting als bedoeld in [artikel 13][ref1] of
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], dan wel ter zake van
      het niet binnen de door het Uitvoeringsinstituut werknemersverzekeringen daarvoor vastgestelde termijn nakomen door
      genoemde personen van een verplichting als bedoeld in [artikel 12][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0004043#Artikel12
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '13'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref3
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
  - number: '14.2'
    text: |-
      Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      belanghebbende de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in elk geval afgezien,
      indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14
  - number: '14.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een maatregel als bedoeld in
      het eerste lid en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet of niet tijdig
      nakomen van een verplichting als bedoeld in [artikel 12][ref1], indien dit niet heeft geleid tot het ten onrechte
      of tot een te hoog bedrag verlenen van toeslag, tenzij het niet tijdig nakomen van de verplichting plaatsvindt
      binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan degene die aanspraak maakt op toeslag,
      zijn echtgenoot of zijn wettelijk vertegenwoordiger een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
  - number: '14.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een maatregel indien daarvoor
      dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14
  - number: '14.5'
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als bedoeld
      in [artikel 14a][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel14a
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 14a
        hoofdstuk: II
        paragraaf: '4'
  - number: '14.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14
  - number: 14a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op van ten hoogste het
      benadelingsbedrag wegens het niet of niet behoorlijk nakomen door degene die aanspraak maakt op een toeslag,
      zijn echtgenoot, of zijn wettelijke vertegenwoordiger van de verplichting, bedoeld in [artikel 12][ref1]. De
      bestuurlijke boete is niet lager dan de boete die op grond van het derde lid zou worden opgelegd indien er geen
      sprake was van een benadelingsbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
  - number: 14a.2
    text: |-
      In dit artikel wordt onder benadelingsbedrag verstaan het brutobedrag dat als gevolg van het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in [artikel 12][ref1], ten onrechte of tot een te hoog bedrag aan
      toeslag is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
  - number: 14a.3
    text: |-
      Indien het niet of niet behoorlijk nakomen door degene die aanspraak maakt op een toeslag, zijn echtgenoot, of
      zijn wettelijke vertegenwoordiger van de verplichting, bedoeld in [artikel 12][ref1], niet heeft geleid tot een
      benadelingsbedrag, legt het Uitvoeringsinstituut werknemersverzekeringen een bestuurlijke boete op van ten hoogste
      het bedrag van de tweede categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 14a.4
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan afzien van het opleggen van een bestuurlijke boete als bedoeld
      in het derde lid en volstaan met het geven van een schriftelijke waarschuwing wegens het niet of niet behoorlijk
      nakomen van de verplichting, bedoeld in [artikel 12][ref1], tenzij het niet of niet behoorlijk nakomen van de
      verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan degene die
      aanspraak maakt op een toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger een zodanige waarschuwing
      is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
  - number: 14a.5
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen legt een bestuurlijke boete op wegens het niet of niet behoorlijk
      nakomen door degene die aanspraak maakt op een toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger van
      de verplichting, bedoeld in [artikel 12][ref1], als gevolg waarvan ten onrechte of tot een te hoog bedrag aan
      toeslag is ontvangen, van ten hoogste 150 procent van het benadelingsbedrag indien binnen een tijdvak van vijf jaar
      voorafgaand aan de dag van het begaan van de overtreding een eerdere bestuurlijke boete of strafrechtelijke sanctie
      is opgelegd wegens een eerdere overtreding, bestaande uit eenzelfde gedraging, die onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
  - number: 14a.6
    text: |-
      Onder eenzelfde gedraging als bedoeld in het vijfde lid wordt verstaan het niet of niet behoorlijk nakomen
      van de verplichting, bedoeld in de [artikelen 12][ref1] van deze wet, [25 van de Werkloosheidswet][ref2],
      [70, eerste en tweede lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3],
      [12, eerste lid, van de Wet inkomensvoorziening oudere werklozen][ref4],
      [80 van de Wet op de arbeidsongeschiktheidsverzekering][ref5], [2:7, eerste lid][ref6],
      of [3:74 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref7],
      [27, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref8], [31, eerste lid][ref9], of
      [49 van de Ziektewet][ref10], als gevolg waarvan ten onrechte of tot een te hoog bedrag aan uitkering,
      inkomensvoorziening, ziekengeld of toeslag is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel70
      [ref4]: https://wetten.overheid.nl/BWBR0024394#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel80
      [ref6]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0008657#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0019057#Artikel27
      [ref9]: https://wetten.overheid.nl/BWBR0001888#Artikel31
      [ref10]: https://wetten.overheid.nl/BWBR0001888#Artikel49
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '70'
      - id: ref4
        bwb_id: BWBR0024394
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: '80'
      - id: ref6
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref7
        bwb_id: BWBR0008657
        artikel: '3'
      - id: ref8
        bwb_id: BWBR0019057
        artikel: '27'
      - id: ref9
        bwb_id: BWBR0001888
        artikel: '31'
      - id: ref10
        bwb_id: BWBR0001888
        artikel: '49'
  - number: 14a.7
    text: |-
      In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens de
      eerdere overtreding, bedoeld in het vijfde lid, degene die aanspraak maakt op een toeslag, zijn echtgenoot, of zijn
      wettelijke vertegenwoordiger is gestraft met een onvoorwaardelijke gevangenisstraf.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14a
  - number: 14a.8
    text: 'Het Uitvoeringsinstituut werknemersverzekeringen kan:'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14a
  - number: 14a.8.a
    text: de bestuurlijke boete verlagen indien sprake is van verminderde verwijtbaarheid;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14a
  - number: 14a.8.b
    text: afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14a
  - number: 14a.9
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan het Uitvoeringsinstituut
      werknemersverzekeringen de inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van
      belang zijn.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14a
  - number: 14a.10
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14a
  - number: 14a.11
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij de bestuurlijke boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14a
  - number: 14a.12
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de degene die aanspraak maakt op een
      toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 14g.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verrekent de bestuurlijke boete met een toeslag op
      grond van deze wet, een uitkering op grond van de [Werkloosheidswet][ref1], de [Ziektewet][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5],
      de [Wet werk en arbeidsondersteuning jonggehandicapten][ref6], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref7], de [Wet inkomensvoorziening oudere werklozen][ref8] of de
      [Wet arbeid en zorg][ref9], die degene aan wie de bestuurlijke boete is opgelegd ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0008656
      [ref6]: https://wetten.overheid.nl/BWBR0008657
      [ref7]: https://wetten.overheid.nl/BWBR0002822
      [ref8]: https://wetten.overheid.nl/BWBR0024394
      [ref9]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14g
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0008656
      - id: ref6
        bwb_id: BWBR0008657
      - id: ref7
        bwb_id: BWBR0002822
      - id: ref8
        bwb_id: BWBR0024394
      - id: ref9
        bwb_id: BWBR0013008
  - number: 14g.2
    text: |-
      De Sociale verzekeringsbank onderscheidenlijk de gemeente betaalt het bedrag van de bestuurlijke boete, zonder
      dat daarvoor een machtiging nodig is, op zijn verzoek aan het Uitvoeringsinstituut werknemersverzekeringen
      indien degene aan wie een bestuurlijke boete is opgelegd een uitkering ontvangt op grond van de
      [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2], de [Wet werk en bijstand][ref3],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14g
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0015703
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
  - number: 14g.3
    text: |-
      De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] aan de raad voor de kinderbescherming
      toegekende bevoegdheid komt gelijkelijk toe aan het Uitvoeringsinstituut werknemersverzekeringen. Indien het
      Uitvoeringsinstituut werknemersverzekeringen gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het
      dwangbevel, in afwijking van [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref2], door middel van
      toezending per post aan degene aan wie de boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 14g.4
    text: |-
      Zolang degene die aanspraak maakt op een toeslag, zijn echtgenoot, of zijn wettelijke vertegenwoordiger zijn
      verplichting, bedoeld in [artikel 14a, negende lid][ref1], niet of niet behoorlijk nakomt:


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel14a
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14g
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 14a
        hoofdstuk: II
        paragraaf: '4'
  - number: 14g.4.a
    text: |-
      is het Uitvoeringsinstituut werknemersverzekeringen in afwijking van
      [artikel 4.93, vierde lid, van de Algemene wet bestuursrecht][ref1] bevoegd tot verrekening van de bestuurlijke
      boete voor zover beslag op de vordering van de schuldeiser nietig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 14g.4.b
    text: |-
      geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref2], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 14h.1
    text: |-
      Bij de verrekening, bedoeld in [artikel 14g, eerste lid][ref1], wordt de bestuurlijke boete, bedoeld in
      [artikel 14a, vijfde lid][ref2], door het Uitvoeringsinstituut werknemersverzekeringen, in afwijking van
      [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref3], verrekend gedurende een tijdvak van ten
      hoogste vijf jaar vanaf het moment van de dagtekening waarop de bestuurlijke boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel14g
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14h
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 14g
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: 14a
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 14h.2
    text: |-
      [Artikel 14g, eerste lid][ref1], en het eerste lid zijn van overeenkomstige toepassing op de verrekening van de
      bestuurlijke boete wegens eenzelfde gedraging als bedoeld in [artikel 14a, zesde lid][ref2], indien en voor zover
      op het moment van verrekening, bedoeld in het eerste lid, de bestuurlijke boete door de overtreder niet is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel14g
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel14a
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14h
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 14g
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: 14a
        hoofdstuk: II
        paragraaf: '4'
  - number: 14h.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan op verzoek van de overtreder besluiten het eerste lid en
      tweede lid niet of niet meer toe te passen indien, gelet op bijzondere omstandigheden, dringende redenen daartoe
      noodzaken.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14h
  - number: 14h.4
    text: |-
      De voorgaande leden laten de verrekening van de bestuurlijke boete op grond van [artikel 14g, eerste lid][ref1],
      na het tijdvak, bedoeld in het eerste lid, onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel14g
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14h
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 14g
        hoofdstuk: II
        paragraaf: '4'
  - number: 14h.5
    text: |-
      Indien als gevolg van de verrekening, bedoeld in het eerste en tweede lid, algemene bijstand op grond van de
      Wet werk en bijstand wordt toegekend, wordt bij de verrekening een bij ministeriële regeling bepaald deel van de
      toeslag op grond van deze wet vrijgelaten in verband met zorgkosten, woonkosten en de kosten van kinderen. Het vrij
      te laten deel van de toeslag kan afhankelijk worden gesteld van de leefsituatie.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel14h
  - number: '15.1'
    text: Het Uitvoeringsinstituut werknemersverzekeringen betaalt de toeslag waarop op grond van deze wet recht bestaat.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15
  - number: '15.2'
    text: |-
      De bepalingen die gelden voor de loondervingsuitkering ter zake van het verschuldigd zijn van premie, van de
      heffing en invordering van premie, zoals deze zijn opgenomen in de [Wet financiering sociale verzekeringen][ref1],
      zijn op de toeslag die op de loondervingsuitkering wordt verleend, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: '15.3'
    text: |-
      De betaling van de toeslag geschiedt, voor zoveel mogelijk, in dezelfde termijnen als die waarin de betaling van de
      loondervingsuitkering geschiedt.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15
  - number: '15.4'
    text: |-
      Zoveel mogelijk wordt de toeslag betaald samen met de loondervingsuitkering in
      één bedrag dan wel wordt de toeslag betaald aan de werkgever met toepassing van
      [artikel 10, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1],
      [artikel 11, derde lid, van de Ziektewet][ref2] of [artikel 11, tweede lid, van de Werkloosheidswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel11
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '11'
  - number: '15.5'
    text: 'Onverminderd het eerste tot en met vierde lid vindt betaling plaats:'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15
  - number: 15.5.a
    text: |-
      binnen zes weken na indiening van de aanvraag indien [artikel 11, derde lid][ref1], van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel11
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '11'
        hoofdstuk: II
        paragraaf: '4'
  - number: 15.5.b
    text: |-
      bij de eerstvolgende betaling van de toeslag nadat wijziging van het minimumloon heeft plaatsgevonden of tegelijk
      met de eerstvolgende gewijzigde loondervingsuitkering indien [artikel 11, vijfde lid][ref1], van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel11
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '11'
        hoofdstuk: II
        paragraaf: '4'
  - number: 15.5.c
    text: |-
      tegelijk met de betaling van de vakantie-uitkering op de loondervingsuitkering indien
      [artikel 11, zesde lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel11
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '11'
        hoofdstuk: II
        paragraaf: '4'
  - number: '15.6'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van de toeslag op of schorst de betaling,
      indien het op grond van duidelijke aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15
  - number: 15.6.a
    text: het recht op toeslag niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15
  - number: 15.6.b
    text: recht op een lagere toeslag bestaat, of
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15
  - number: 15.6.c
    text: |-
      degene die aanspraak maakt op toeslag, zijn echtgenoot dan wel de persoon aan wie of de instelling aan welke
      ingevolge [artikel 22][ref1] toeslag wordt uitbetaald, een verplichting als bedoeld in [artikel 12][ref2],
      [12a][ref3] of [13][ref4] niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004043#Artikel12a
      [ref4]: https://wetten.overheid.nl/BWBR0004043#Artikel13
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '22'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004043
        artikel: 12a
        hoofdstuk: II
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0004043
        artikel: '13'
        hoofdstuk: II
        paragraaf: '4'
  - number: 15a
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van de toeslag op indien degene aan wie een
      toeslag is toegekend een vreemdeling als bedoeld in de [Vreemdelingenwet 2000][ref1] is die niet rechtmatig in
      Nederland verblijf houdt als bedoeld in [artikel 8 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 15b.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van de toeslag op, indien blijkt dat het door
      de toeslaggerechtigde verstrekte adres van hemzelf, van zijn echtgenoot of van een kind afwijkt van het adres
      waaronder de betrokkene in de gemeentelijke basisadministratie persoonsgegevens staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15b
  - number: 15b.2
    text: 'Geen opschorting vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15b
  - number: 15b.2.a
    text: indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de uitkering;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15b
  - number: 15b.2.b
    text: indien de toeslaggerechtigde van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15b
  - number: 15b.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen doet schriftelijk mededeling van de opschorting aan de
      toeslaggerechtigde.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15b
  - number: 15b.4
    text: |-
      De opschorting wordt beëindigd zodra het aan het Uitvoeringsinstituut werknemersverzekeringen gebleken is dat de
      afwijking niet meer bestaat.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel15b
  - number: '16'
    text: Onze Minister kan regels stellen met betrekking tot samenloop van toeslagen.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel16
  - number: '17'
    text: |-
      Voor zover bij of krachtens deze wet niet anders is bepaald, wordt een voorschot op een nog niet vastgestelde
      toeslag beschouwd als een toeslag op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel17
  - number: '18'
    text: |-
      De toeslag die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de dag van betaalbaarstelling,
      wordt niet meer betaald. Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd in bijzondere gevallen ten
      gunste van de toeslaggerechtigde af te wijken van de in [de eerste volzin][ref1] genoemde drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel18
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '18'
        hoofdstuk: II
        paragraaf: '5'
  - number: '19.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen betaalt de vakantie-uitkering, voor zover niet reeds eerder
      betaald, jaarlijks in de maand mei over de aan die maand voorafgaande maanden.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel19
  - number: '19.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen betaalt de vakantie-uitkering, voor zoveel mogelijk, samen met de
      vakantie-uitkering over de loondervingsuitkering in één bedrag.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel19
  - number: '19.3'
    text: |-
      Indien niet langer recht op loondervingsuitkering bestaat, wordt de nog niet betaalde vakantie-uitkering, voor
      zoveel mogelijk samen met de vakantie-uitkering over de loondervingsuitkering, in één bedrag betaald.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel19
  - number: '20.1'
    text: |-
      De toeslag die als gevolg van een besluit als bedoeld in [artikel 11a][ref1] of [14][ref2] onverschuldigd
      is betaald, alsmede hetgeen anderszins onverschuldigd is betaald, wordt door het Uitvoeringsinstituut
      werknemersverzekeringen teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel14
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 11a
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '14'
        hoofdstuk: II
        paragraaf: '4'
  - number: '20.2'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van terugvordering
      of van verdere terugvordering af te zien, indien degene van wie wordt teruggevorderd:
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20
  - number: 20.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20
  - number: 20.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20
  - number: 20.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20
  - number: 20.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20
  - number: '20.3'
    text: |-
      De in het tweede lid, onderdelen a, b en c, genoemde termijn is tien jaar indien de terugvordering het gevolg is
      van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
  - number: '20.4'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20
  - number: 20.4.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de artikelen [475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 20.4.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel12
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
  - number: '20.5'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20
  - number: '20.6'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen
      de inlichtingen te verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20
  - number: '20.7'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen, onder voorwaarden die Onze
      Minister kan stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze
      Minister vast te stellen bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20
  - number: 20a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de onverschuldigd betaalde toeslag, bedoeld in
      [artikel 20, eerste lid][ref1], invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel20
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '20'
        hoofdstuk: II
        paragraaf: '5'
  - number: 20a.2
    text: |-
      [Artikel 14g][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de [artikelen 475c][ref2] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, het Uitvoeringsinstituut
      werknemersverzekeringen de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel14g
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 14g
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 20b.1
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot [artikel 20, tweede en derde lid][ref1], nadere regels worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel20
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '20'
        hoofdstuk: II
        paragraaf: '5'
  - number: 20b.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij is vastgesteld dat onverschuldigd is betaald.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel20b
  - number: '21.1'
    text: |-
      In afwijking van [artikel 20, eerste lid][ref1], kan het Uitvoeringsinstituut werknemersverzekeringen, op
      verzoek van degene die aanspraak maakt op de toeslag, zijn echtgenoot of zijn wettelijke vertegenwoordiger,
      alsmede de instelling aan welke ingevolge [artikel 22][ref2] toeslag wordt uitbetaald, besluiten gedeeltelijk
      van terugvordering of gedeeltelijk van verdere terugvordering af te zien bij medewerking aan een schuldregeling,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel22
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '20'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '22'
        hoofdstuk: II
        paragraaf: '5'
  - number: 21.1.a
    text: |-
      redelijkerwijs te voorzien is dat degene die aanspraak maakt op de toeslag, zijn echtgenoot of zijn wettelijke
      vertegenwoordiger, alsmede de instelling aan welke ingevolge [artikel 22][ref1] toeslag wordt uitbetaald, niet zal
      kunnen voortgaan met het betalen van zijn schulden of indien hij in de toestand verkeert dat hij heeft opgehouden
      te betalen;


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel22
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '22'
        hoofdstuk: II
        paragraaf: '5'
  - number: 21.1.b
    text: |-
      redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel21
  - number: 21.1.c
    text: |-
      de vordering van het Uitvoeringinstituut werknemersverzekeringen wegens onverschuldigde betaling ten minste zal
      worden voldaan naar evenredigheid met de vorderingen van de schuldeisers van gelijke rang;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel21
  - number: 21.1.d
    text: |-
      een naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen betrouwbaar voorstel voor
      een schuldregeling tot stand is gekomen door tussenkomst van een schuldhulpverlener als bedoeld in
      [artikel 48 van de Wet op het consumentenkrediet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel48
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '48'
  - number: 21.1.e
    text: aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel21
  - number: 21.1.f
    text: |-
      uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel349
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '349'
  - number: '21.2'
    text: |-
      Het eerste lid is niet van toepassing indien een vordering is ontstaan door het niet nakomen door degene die
      aanspraak maakt op de toeslag, zijn echtgenoot of zijn wettelijke vertegenwoordiger, alsmede de instelling aan
      welke ingevolge [artikel 22][ref1] toeslag wordt uitbetaald, van de verplichting, bedoeld in [artikel 12][ref2], en
      hiervoor een boete als bedoeld in [artikel 14a][ref3] is opgelegd, dan wel met betrekking tot het niet naleven van
      die verplichting aangifte is gedaan op grond van het [Wetboek van Strafrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004043#Artikel14a
      [ref4]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '22'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004043
        artikel: 14a
        hoofdstuk: II
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0001854
  - number: '21.3'
    text: |-
      Het besluit tot het afzien van terugvordering of van verdere terugvordering wordt ingetrokken of ten nadele
      van degene die aanspraak maakt op de toeslag, zijn echtgenoot of zijn wettelijke vertegenwoordiger, alsmede de
      instelling aan welke ingevolge [artikel 22][ref1] toeslag wordt uitbetaald, degene van wie wordt teruggevorderd
      gewijzigd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel22
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '22'
        hoofdstuk: II
        paragraaf: '5'
  - number: 21.3.a
    text: |-
      niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling tot stand is gekomen die voldoet
      aan de eisen, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel21
  - number: 21.3.b
    text: |-
      degene die aanspraak maakt op de toeslag, zijn echtgenoot of zijn wettelijke vertegenwoordiger, alsmede
      de instelling aan welke ingevolge [artikel 22][ref1] toeslag wordt uitbetaald, zijn schuld aan het
      Uitvoeringsinstituut werknemersverzekeringen niet overeenkomstig de schuldregeling voldoet; of


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel22
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '22'
        hoofdstuk: II
        paragraaf: '5'
  - number: 21.3.c
    text: |-
      onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een ander
      besluit zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel21
  - number: '21.4'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      bevoegdheid om mee te werken aan schuldregelingen.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel21
  - number: 21a
    text: |-
      Een vordering van het Uitvoeringsinstituut werknemersverzekeringen als bedoeld in
      [artikel 20][ref1] en [21][ref2] is bevoorrecht en volgt onmiddellijk na de vorderingen, bedoeld in
      [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '20'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '21'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '288'
  - number: '22'
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen op grond van een wettelijke bepaling
      de loondervingsuitkering geheel of gedeeltelijk in plaats van aan de toeslaggerechtigde
      zonder diens machtiging uitbetaalt aan het College voor zorgverzekeringen, genoemd in
      [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1], een inrichting ter verpleging van geesteszieken
      of van zwakzinnigen of aan een gemeente die de opnamekosten in een dergelijke inrichting betaalt, betaalt het
      Uitvoeringsinstituut werknemersverzekeringen tevens de toeslag aan die raad, inrichting of gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '23.1'
    text: |-
      Na het overlijden van de toeslaggerechtigde wordt met ingang van de dag na het overlijden, de toeslag in de vorm
      van een overlijdensuitkering uitbetaald:
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel23
  - number: 23.1.a
    text: aan de langstlevende van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel23
  - number: 23.1.b
    text: |-
      bij ontstentenis van de in onderdeel a bedoelde persoon, aan de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel23
  - number: 23.1.c
    text: |-
      bij ontstentenis van de in de onderdelen a en b bedoelde personen, aan degene met wie de overledene in
      gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel23
  - number: '23.2'
    text: |-
      De overlijdensuitkering is gelijk aan het bedrag van de toeslag over één maand, doch niet over de zaterdagen
      en zondagen, berekend naar de hoogte van die toeslag op de dag of laatstelijk voor de dag van overlijden van de
      toeslaggerechtigde.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel23
  - number: '23.3'
    text: |-
      De overlijdensuitkering wordt ambtshalve of op verzoek aan de rechthebbende of rechthebbenden genoemd in het eerste
      lid, door het Uitvoeringsinstituut werknemersverzekeringen uitbetaald.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel23
  - number: '23.4'
    text: De overlijdensuitkering wordt in een bedrag ineens uitbetaald.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel23
  - number: '23.5'
    text: |-
      Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan toeslag dat, over na het overlijden
      gelegen dagen, reeds is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel23
  - number: '23.6'
    text: De overlijdensuitkering is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel23
  - number: 23a
    text: |-
      Na het overlijden van de echtgenoot van een toeslaggerechtigde wordt de toeslaggerechtigde voor de toepassing van
      deze wet en de daarop rustende bepalingen tot en met één maand na de dag van overlijden van de echtgenoot, als
      gehuwd aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel23a
  - number: '25.1'
    text: De toeslag is onvervreemdbaar en niet vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel25
  - number: '25.2'
    text: |-
      Een machtiging tot het in ontvangst nemen van de toeslag, onder welke vorm of benaming ook verleend, is steeds
      herroepelijk.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel25
  - number: '25.3'
    text: Elk beding, strijdig met het eerste of tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel25
  - number: '26'
    text: |-
      In de middelen tot dekking van de uitgaven ten laste van het Toeslagenfonds wordt voorzien door het Rijk, alsmede
      door de met toepassing van [artikel 14a][ref1] verkregen bestuurlijke boeten.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel14a
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: 14a
        hoofdstuk: II
        paragraaf: '4'
  - number: '27.1'
    text: |-
      De op grond van deze wet te betalen toeslagen en de aan de uitvoering van deze wet verbonden kosten komen ten laste
      van het Toeslagenfonds.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel27
  - number: '27.2'
    text: Het Uitvoeringsinstituut werknemersverzekeringen kan regels stellen met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel27
  - number: '29.1'
    text: In de uitvoering van deze wet wordt voorzien door het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel29
  - number: '29.2'
    text: Het recht op toeslag ingevolge deze wet bestaat tegenover het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel29
  - number: '30'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd controlevoorschriften vast te stellen. Deze
      voorschriften mogen niet verder gaan dan strikt noodzakelijk is voor de juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel30
  - number: '31'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de middelen tot dekking
      van de uitgaven, bedoeld in artikel 27, eerste lid, in de vorm van een Toeslagenfonds dat deel uitmaakt van het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel31
  - number: '32'
    text: |-
      [Artikel 120 van de Wet financiering sociale verzekeringen][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel120
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '120'
  - number: '36.1'
    text: |-
      Indien de aanvraag om een toeslag tezamen met een aanvraag om een loondervingsuitkering wordt ingediend, wordt
      de beschikking over de toeslag gegeven binnen de termijn die geldt voor het geven van een beschikking inzake de
      loondervingsuitkering.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel36
  - number: '36.2'
    text: |-
      Indien een beschikking als bedoeld in het eerste lid niet binnen de toepasselijke termijn kan worden gegeven, wordt
      dit schriftelijk aan de aanvrager medegedeeld onder vermelding van een zo kort mogelijke termijn waarbinnen de
      beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel36
  - number: '37.1'
    text: |-
      Onverminderd [artikel 36][ref1], worden de beschikkingen op grond van deze wet en de daarop berustende bepalingen
      gegeven binnen een redelijke termijn na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel36
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '36'
        hoofdstuk: V
  - number: '37.2'
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel37
  - number: '37.3'
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel37
  - number: '38.1'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken gerekend vanaf de dag na die waarop de termijn
      voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '38.2'
    text: |-
      Indien het bezwaarschrift, bedoeld in het eerste lid, verband houdt met een bezwaar tegen een besluit waaraan
      een medische of arbeidskundige beoordeling ten grondslag ligt, zijn de artikelen 79, tweede lid, van de
      Algemene Arbeidsongeschiktheidswet, [artikel 112 van de Wet werk en inkomen naar arbeidsvermogen][ref1],
      [artikel 96, tweede lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2],
      [artikel 6:3, tweede lid, van de Wet werk en arbeidsondersteuning jonggehandicapten][ref3],
      [87d van de Wet op de arbeidsongeschiktheidsverzekering][ref4] en
      [XXVIIa, tweede lid, van de Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref5] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel112
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel87d
      [ref5]: https://wetten.overheid.nl/BWBR0006072#ArtikelXXVIIA
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '112'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '96'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 87d
      - id: ref5
        bwb_id: BWBR0006072
        artikel: XXVIIA
  - number: '39.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van [artikel 1, derde tot en met zevende lid][ref1], en de daarop berustende
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel1
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '1'
        hoofdstuk: I
  - number: '39.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen uitspraken van de gerechtshoven inzake
      beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats inneemt
      van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel39
  - number: '40'
    text: |-
      Een gedraging die in strijd is met een krachtens deze wet uitgevaardigde algemene maatregel van bestuur, voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel40
  - number: '43'
    text: |-
      De in [artikel 40][ref1] bedoelde strafbare feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel40
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '40'
        hoofdstuk: VI
  - number: '44'
    text: |-
      Op de persoon die op de dag voorafgaand aan de inwerkingtreding van
      [artikel 1.10, onderdeel C, van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref1]
      recht had op een toeslag op grond van deze wet blijft tenzij het recht op de uitkering eindigt,
      [artikel 8, vierde lid][ref2], zoals dat luidde op die dag van toepassing tot een bij ministeriële regeling bepaald
      tijdstip dat voor verschillende groepen personen verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel8
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44
    references:
