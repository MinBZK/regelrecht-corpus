  - number: 44a.1.a
    text: |-
      op 31 december 2007 recht had op een verhoging van zijn uitkering op grond van de [artikelen 24][ref1], [48][ref2]
      of [64a van de Invoeringswet stelselherziening sociale zekerheid][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004046#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0004046#Artikel64a
    url: https://wetten.overheid.nl/BWBR0004043/2013-01-01#Artikel44a
    references:
