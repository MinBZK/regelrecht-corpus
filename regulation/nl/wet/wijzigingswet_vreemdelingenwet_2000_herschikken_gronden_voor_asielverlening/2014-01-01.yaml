preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de Vreemdelingenwet 2000 te wijzigen in verband met
    een betere afstemming van de nationale gronden voor asielverlening met de Europese gronden voor asielverlening en
    een vereenvoudiging van de toelatingsprocedure voor nareizende gezinsleden van houders van een verblijfsvergunning
    asiel;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034268/2014-01-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Een op het tijdstip van inwerkingtreding van deze wet geldige verblijfsvergunning voor bepaalde tijd,
      verleend op grond van [artikel 29, eerste lid, aanhef en onder c dan wel d, van de Vreemdelingenwet 2000][ref1],
      zoals dat artikel luidde op de dag voorafgaand aan de inwerkingtreding van deze wet, wordt beheerst door
      [Vreemdelingenwet 2000][ref2] zoals deze luidde op de dag voorafgaand aan het tijdstip van inwerkingtreding van
      deze wet.

      2 Een op het tijdstip van inwerkingtreding van deze wet geldige verblijfsvergunning voor bepaalde tijd, verleend
      op grond van [artikel 29, eerste lid, aanhef en onder e dan wel f, van de Vreemdelingenwet 2000][ref3], zoals dat
      artikel luidde op de dag voorafgaand aan de inwerkingtreding van deze wet, wordt vanaf de inwerkingtreding van deze
      wet, onder handhaving van de geldigheidsduur, aangemerkt als een vergunning voor bepaalde tijd, verleend op grond
      van artikel 29, tweede lid, aanhef en onder a dan wel b, van de Vreemdelingenwet 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0011823
