---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_bereikbaarheid_en_mobiliteit
regulatory_layer: WET
publication_date: '2010-04-01'
valid_from: '2003-06-25'
bwb_id: BWBR0013854
url: https://wetten.overheid.nl/BWBR0013854/2003-06-25
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is ter verbetering van de bereikbaarheid van economische
    en andere centra over de weg en ter stroomlijning van de mobiliteit regels te stellen voor het heffen van
    mobiliteitstarieven ter zake van het rijden op de weg met een motorrijtuig, alsmede regels te stellen inzake de
    ondersteuning van regionale mobiliteitsfondsen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel1
  - number: 1.b
    text: |-
      motorrijtuig: een motorrijtuig als bedoeld in
      [artikel 2, onderdeel a, van de Wet op de motorrijtuigenbelasting 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel2
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '2'
  - number: 1.c
    text: |-
      mobiliteitstarief: een tarief als bedoeld in de artikelen [13][ref1], [21][ref2] en [26][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013854#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0013854#Artikel26
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0013854
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0013854
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 1.d
    text: |-
      betaalpoort: het geheel van werken en andere voorzieningen op en aan de weg dat ertoe strekt een mobiliteitstarief
      te heffen;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel1
  - number: 1.e
    text: |-
      expresbaan: een verkeersbaan, bestemd voor één rijrichting, van een weg die nog een andere verkeersbaan, bestemd
      voor dezelfde rijrichting, omvat, en waar het gebruik van de expresbaan aan een heffing kan zijn onderworpen die er
      toe strekt dat het verkeer op de expresbaan geen reistijd verliest wegens congestie;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel1
  - number: 1.f
    text: |-
      tolweg: een weg waar ten behoeve van de bekostiging van de weg verkeersdeelnemers wegens het gebruik van de weg een
      specifieke bijdrage verschuldigd zijn;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel1
  - number: 1.g
    text: |-
      tolbaan: een verkeersbaan, bestemd voor één rijrichting, van een weg die nog een andere verkeersbaan, bestemd voor
      dezelfde rijrichting, omvat, en waar ten behoeve van de bekostiging van de tolbaan verkeersdeelnemers wegens het
      gebruik van de tolbaan een specifieke bijdrage verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel1
  - number: '2'
    text: |-
      Deze wet is uitsluitend van toepassing op wegen die openbaar zijn in de zin van de [Wegenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001948
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001948
  - number: '3.1'
    text: |-
      Onze Minister wijst in overeenstemming met Onze Ministers van Financiën en van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer, de plaats van een betaalpoort op een weg, in beheer bij het Rijk, aan, en bepaalt
      voor welk mobiliteitstarief en voor welke rijrichting de betaalpoort is bestemd. Een aanwijzing als bedoeld in
      de eerste volzin heeft niet plaats indien te verwachten is dat de kosten van invordering van het desbetreffende
      mobiliteitstarief meer dan 20 procent van de opbrengst zullen bedragen.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel3
  - number: '3.2'
    text: |-
      Het bestuur van een provincie of een waterschap, of de raad van een gemeente wijst de plaats van een betaalpoort op
      een weg, in beheer bij dat openbaar lichaam, aan en bepaalt voor welk mobiliteitstarief en voor welke rijrichting
      de betaalpoort is bestemd. De aanwijzing behoeft de goedkeuring van de in het eerste lid genoemde ministers. De
      goedkeuring wordt geweigerd, indien:
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel3
  - number: 3.2.a
    text: |-
      de plaats van de betaalpoort niet voldoet aan [artikel 14][ref1], onderscheidenlijk artikel [22, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0013854#Artikel22
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0013854
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 3.2.b
    text: |-
      te verwachten is dat de kosten van invordering van het desbetreffende mobiliteitstarief meer dan 20 procent van de
      opbrengst zullen bedragen, of
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel3
  - number: 3.2.c
    text: |-
      de aanwijzing van de betaalpoort naar verwachting ongewenste gevolgen heeft voor het gebruik van wegen die in
      dezelfde verbinding voorzien als de weg waarop de plaats voor de betaalpoort is aangewezen, of die in het verlengde
      zijn gelegen van de weg waarop de plaats voor de betaalpoort is aangewezen.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister zendt het ontwerp van een besluit als bedoeld in het eerste lid, alsmede een besluit als bedoeld in
      het eerste lid onverwijld toe aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel3
  - number: '4.1'
    text: |-
      Een mobiliteitstarief wordt verschuldigd op het tijdstip waarop met een motorrijtuig met binnenlands of buitenlands
      kenteken, rijdend op de weg, een voor dat tarief aangewezen betaalpoort wordt gepasseerd in een voor die poort
      aangewezen rijrichting.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel4
  - number: '4.2'
    text: Een mobiliteitstarief wordt geheven van de houder van het motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel4
  - number: '4.3'
    text: 'Een motorrijtuig wordt gehouden door degene:'
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel4
  - number: 4.3.a
    text: |-
      op wiens naam het voor het motorrijtuig opgegeven kenteken is gesteld in het kentekenregister, bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 4.3.b
    text: |-
      op wiens naam, indien het een in het buitenland geregistreerd motorrijtuig betreft, terzake van de registratie van
      het betrokken motorrijtuig door het daartoe bevoegde gezag in het buitenland een kentekenbewijs is afgegeven;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel4
  - number: 4.3.c
    text: die het motorrijtuig waarvoor geen kenteken is opgegeven, feitelijk ter beschikking heeft.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel4
  - number: '4.4'
    text: |-
      Als motorrijtuig waarvoor geen kenteken is opgegeven, wordt niet aangemerkt een motorrijtuig waarvoor ingevolge
      artikel [37 van de Wegenverkeerswet 1994][ref1], met uitzondering van het eerste lid, onderdeel b, daarvan, het
      voorzien zijn van een kenteken ter zake van het gebruik van de weg niet is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
  - number: '5'
    text: |-
      De mobiliteitstarieven worden geheven en ingevorderd met overeenkomstige toepassing van
      de [Algemene wet inzake rijksbelastingen][ref1], de [Invorderingswet 1990][ref2] en de
      [Kostenwet invordering rijksbelastingen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
      - id: ref3
        bwb_id: BWBR0002645
  - number: '6.1'
    text: |-
      Een verschuldigd geworden mobiliteitstarief wordt op aangifte voldaan, voor zover dat tarief niet op aangifte is
      voldaan op de voet van het vierde lid.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel6
  - number: '6.2'
    text: Het passeren van een betaalpoort met een motorrijtuig wordt aangemerkt als het doen van aangifte.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel6
  - number: '6.4'
    text: |-
      In afwijking van [artikel 19, derde lid, van de Algemene wet inzake rijksbelastingen][ref1] wordt het verschuldigd
      geworden mobiliteitstarief onverwijld na het doen van aangifte betaald. Bij regeling van Onze Minister in
      overeenstemming met Onze Minister van Financiën worden nadere regels gesteld inzake de voldoening.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: '6.4'
    text: |-
      Een mobiliteitstarief kan op elektronische wijze worden geheven. De aangifte wordt alsdan op elektronische wijze
      gedaan op het tijdstip dat een betaalpoort wordt gepasseerd, door het in werking stellen van op de betaalpoort
      aanwezige betalingsapparatuur gelijktijdig met betaling van het verschuldigde mobiliteitstarief. Bij regeling
      van Onze Minister in overeenstemming met Onze Minister van Financiën worden nadere regels gesteld inzake de
      elektronische aangifte en voldoening.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel6
  - number: '6.5'
    text: |-
      [Hoofdstuk II van de Algemene wet inzake rijksbelastingen][ref1] is, met uitzondering van
      [artikel 8, tweede lid][ref2], niet van toepassing op de in het tweede en het vierde lid bedoelde aangiften.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0013854#Artikel8
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0013854
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '7'
    text: |-
      Vrijstelling van de mobiliteitstarieven kan, onder voorwaarden en beperkingen, worden verleend bij algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel7
  - number: '8.1'
    text: Ter zake van het passeren van een betaalpoort op een expresbaan is geen toltarief verschuldigd.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel8
  - number: '8.2'
    text: Ter zake van het passeren van een tolpoort op een tolbaan of een tolweg is geen expresbaantarief verschuldigd.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel8
  - number: '9'
    text: |-
      Indien een mobiliteitstarief wordt nageheven, blijft [artikel 67f van de Algemene wet inzake rijksbelastingen][ref1]
      buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67f
  - number: '10.1'
    text: |-
      De netto-opbrengst van de mobiliteitstarieven, bedoeld in de [artikelen 15, eerste lid][ref1],
      en [artikel 21, eerste lid][ref2], komt ten goede aan het Infrastructuurfonds, bedoeld in
      [artikel 2 van de Wet Infrastructuurfonds][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0013854#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0006001#Artikel2
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0013854
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0006001
        artikel: '2'
  - number: '10.2'
    text: |-
      De netto-opbrengst van het mobiliteitstarief, bedoeld in artikel 21, tweede lid, komt uitsluitend ten goede aan
      fondsen waarvan de middelen uitsluitend worden aangewend voor infrastructurele investeringen.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel10
  - number: '10.3'
    text: |-
      De netto-opbrengst van het mobiliteitstarief, bedoeld in artikel 21, eerste en tweede lid, wordt uitsluitend
      besteed aan de aanleg, het beheer en het onderhoud van de weg, waaraan de betaalpoort voor het desbetreffende
      tarief is gelegen.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel10
  - number: '11'
    text: |-
      Bij regeling van Onze Minister worden eenvormige regels gesteld over de apparatuur voor het op elektronische wijze
      doen van aangifte en het op elektronische wijze betalen van mobiliteitstarieven.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel11
  - number: '12'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld die ertoe strekken dat voor de weggebruiker duidelijk kenbaar
      zijn:
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel12
  - number: 12.a
    text: de plaats van een betaalpoort,
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel12
  - number: 12.b
    text: het mobiliteitstarief waarvoor de betaalpoort is bestemd, en
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel12
  - number: 12.c
    text: de rijrichting waarvoor de betaalpoort is bestemd.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel12
  - number: '13'
    text: |-
      Onder de naam «expresbaantarief» wordt van rijkswege een mobiliteitstarief geheven ter zake van het passeren
      tijdens een daartoe krachtens [artikel 16, eerste lid, onderdeel c][ref1], aangewezen tijdsperiode van een voor dat
      tarief aangewezen betaalpoort op een weg, in beheer bij het Rijk, met een motorrijtuig in de voor die betaalpoort
      aangewezen rijrichting over de ten aanzien van die betaalpoort aangewezen baan van de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel16
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '14.1'
    text: |-
      Bij de aanwijzing van de plaats van een betaalpoort voor het expresbaantarief wordt bepaald voor welke baan van de
      weg het expresbaantarief wordt geheven.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel14
  - number: '14.2'
    text: Bij de aanwijzing, bedoeld in het eerste lid, worden niet alle banen van de weg in dezelfde richting aangewezen.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel14
  - number: '14.3'
    text: De expresbaan is van de andere banen afgescheiden.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel14
  - number: '15.1'
    text: |-
      De hoogte van het expresbaantarief per passage wordt bij regeling van Onze Minister en Onze Minister van Financiën
      zodanig bepaald dat naar verwachting een goede doorstroming op de desbetreffende aangewezen baan van de weg wordt
      bereikt.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel15
  - number: '15.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld voor de bepaling van het tarief, bedoeld in het
      eerste lid, op basis van verkeersintensiteit.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel15
  - number: '15.3'
    text: |-
      De hoogte van het expresbaantarief per passage is bij betaling op elektronische wijze lager dan in het geval het
      expresbaantarief wordt voldaan op een aangifte op de voet van [artikel 6, eerste lid][ref1]. Het in de eerste
      volzin bedoelde verschil wordt, rekening houdend met het verschil in behandelingskosten, bij algemene maatregel van
      bestuur vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel6
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '15.4'
    text: |-
      Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij wordt geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel15
  - number: '16'
    text: 'Bij regeling van Onze Minister en Onze Minister van Financiën wordt ten aanzien van een betaalpoort vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel16
  - number: 16.a
    text: de datum met ingang waarvan het expresbaantarief wordt geheven;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel16
  - number: 16.b
    text: de dagen van het jaar waarop het expresbaantarief wordt geheven, en
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel16
  - number: 16.c
    text: |-
      de tijdsperiode of de tijdsperioden waarin op een krachtens onderdeel b aangewezen dag het expresbaantarief wordt
      geheven.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel16
  - number: '17'
    text: De rijksbelastingdienst heft het expresbaantarief en vordert het in.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel17
  - number: '18.1'
    text: |-
      Indien een motorrijtuig waarvoor een kenteken is opgegeven, feitelijk en niet geheel voorbijgaand ter beschikking
      staat van een ander dan degene op wiens naam het opgegeven kenteken is gesteld, kan de inspecteur die ander:
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel18
  - number: 18.1.a
    text: op gezamenlijk verzoek aanmerken als degene die het motorrijtuig houdt;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel18
  - number: 18.1.b
    text: ambtshalve aanmerken als degene die het motorrijtuig houdt.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel18
  - number: '18.2'
    text: |-
      De inspecteur neemt de beslissing op het verzoek, bedoeld in het eerste lid, onderdeel a, en de beslissing, bedoeld
      in het eerste lid, onderdeel b, bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel18
  - number: '19'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld die ertoe strekken dat voor de weggebruiker tijdig en
      duidelijk kenbaar zijn:
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel19
  - number: 19.a
    text: de expresbaan waar het expresbaantarief wordt geheven;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel19
  - number: 19.b
    text: de dagen waarop en de tijdsperioden waarin het expresbaantarief wordt geheven, en
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel19
  - number: 19.c
    text: de hoogte van het expresbaantarief.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel19
  - number: '20.1'
    text: |-
      Deze paragraaf is slechts van toepassing op het passeren van de betaalpoorten die voor dat tarief zijn aangewezen
      op:
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel20
  - number: 20.1.a
    text: de A1 tussen de eerste toerit na afrit 5 (Naarden) en knooppunt Watergraafsmeer in beide richtingen;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel20
  - number: 20.1.b
    text: de A4 tussen het knooppunt Kethelplein en het knooppunt Benelux in beide richtingen;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel20
  - number: 20.1.c
    text: de A12 tussen knooppunt Oudenrijn en de aansluiting met de N11 bij Bodegraven in beide richtingen;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel20
  - number: 20.1.d
    text: de A16 tussen de eerste toerit na afrit 20 (Randweg Dordrecht) en knooppunt Klaverpolder in beide richtingen, en
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel20
  - number: 20.1.e
    text: de A5 (Verlengde Westrandweg) in beide richtingen.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel20
  - number: '20.2'
    text: |-
      [Artikel 1, onderdeel e][ref1], en [artikel 14, tweede lid][ref2], zijn niet van toepassing op de Verlengde
      Westrandweg, bedoeld in het eerste lid, onderdeel e.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013854#Artikel14
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0013854
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '20.3'
    text: |-
      In de periode tot een half jaar nadat het verslag, bedoeld in [artikel 40, eerste lid][ref1], aan de beide kamers
      der Staten-Generaal is toegezonden, kan slechts voor twee van de in het eerste lid bedoelde wegvakken een plaats
      voor een betaalpoort voor het expresbaantarief worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel40
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '40'
        hoofdstuk: '5'
  - number: '20.4'
    text: |-
      Voorafgaand aan een aanwijzing als bedoeld in het eerste lid, zendt Onze Minister aan de beide kamers der Staten-
      Generaal een beschrijving van de kwantitatieve en kwalitatieve resultaten die op het desbetreffende wegvak
      tenminste behaald moeten worden. De beschrijving heeft in elk geval betrekking op de onderwerpen, omschreven in
      [artikel 40, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel40
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '40'
        hoofdstuk: '5'
  - number: '21.1'
    text: |-
      Onder de naam «toltarief» wordt van rijkswege een mobiliteitstarief geheven ter zake van het passeren van een voor
      dat tarief aangewezen betaalpoort op een weg, in beheer bij het Rijk, met een motorrijtuig in de voor die poort
      aangewezen rijrichting.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel21
  - number: '21.2'
    text: |-
      Een provincie, een gemeente of een waterschap kan onder de naam «toltarief» een mobiliteitstarief instellen
      ter zake van het passeren van een voor dat tarief aangewezen betaalpoort op een weg, in beheer bij dat openbaar
      lichaam, met een motorrijtuig in de voor die poort aangewezen rijrichting.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel21
  - number: '21.3'
    text: |-
      Voor de toepassing van [hoofdstuk XV van de Provinciewet][ref1], [§ 1][ref2] en
      [§ 4 van hoofdstuk XV van de Gemeentewet][ref3] en de [hoofdstukken XVI][ref4] en
      [XVIII van de Waterschapswet][ref5] wordt het tarief, bedoeld in het tweede lid, aangemerkt als een provinciale
      belasting, onderscheidenlijk gemeentelijke belasting, onderscheidenlijk waterschapsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXV
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Paragraaf1
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Paragraaf4
      [ref4]: https://wetten.overheid.nl/BWBR0005108#HoofdstukXVI
      [ref5]: https://wetten.overheid.nl/BWBR0005108#HoofdstukXVIII
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: XV
      - id: ref2
        bwb_id: BWBR0005416
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005416
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0005108
        hoofdstuk: XVI
      - id: ref5
        bwb_id: BWBR0005108
        hoofdstuk: XVIII
  - number: '22.1'
    text: De plaats voor een betaalpoort voor een toltarief kan slechts zijn gelegen op
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel22
  - number: 22.1.a
    text: een tolweg die voor het verkeer wordt opengesteld na de datum van inwerkingtreding van deze wet;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel22
  - number: 22.1.b
    text: |-
      een tolbaan van een weg waar na de datum van inwerkingtreding van deze wet de capaciteit van de weg is vergroot en
      het aantal stroken zonder toltarief niet kleiner is dan voor de capaciteitsuitbreiding.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel22
  - number: '22.2'
    text: |-
      Het eerste lid is niet van toepassing op een betaalpoort op de A4 tussen het knooppunt Kethelplein en het knooppunt
      Benelux in beide richtingen.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel22
  - number: '23.1'
    text: |-
      Bij regeling van Onze Minister, en in geval van toepassing van [artikel 21, tweede lid][ref1], bij verordening van
      het desbetreffende openbare lichaam, wordt vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel21
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 23.1.a
    text: de datum met ingang waarvan bij een betaalpoort een toltarief wordt geheven;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel23
  - number: 23.1.b
    text: de hoogte van het toltarief per passage.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel23
  - number: '23.2'
    text: |-
      De hoogte van het toltarief per passage kan in ieder geval verschillen naar gelang van de tijdsperiode waarin de
      betaalpoort wordt gepasseerd.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel23
  - number: '24'
    text: |-
      Bij een weg, in beheer bij het Rijk, treedt voor de toepassing van de [Algemene wet inzake rijksbelastingen][ref1],
      de [Invorderingswet 1990][ref2] en de [Kostenwet invordering rijksbelastingen][ref3] Onze Minister in de plaats van
      de in die wetten genoemde functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
      - id: ref3
        bwb_id: BWBR0002645
  - number: '25.1'
    text: |-
      De openbare lichamen die een toltarief instellen, treffen een gezamenlijke voorziening voor het verschaffen van
      inlichtingen en het gebruik van één postadres voor het behandelen van klachten en bezwaren.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel25
  - number: '25.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de kwaliteit van de voorziening,
      bedoeld in het eerste lid, over het verstrekken van gegevens ten behoeve van die voorziening en over de bekostiging
      van die voorziening door de openbare lichamen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel25
  - number: '26.1'
    text: Onder de naam «kilometerheffing» wordt een mobiliteitstarief geheven ter zake van het rijden met een motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel26
  - number: '26.2'
    text: |-
      De artikelen [2][ref1], [3][ref2], [4, eerste lid][ref3], [6][ref4] en [12][ref5] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013854#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013854#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0013854#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0013854#Artikel12
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0013854
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0013854
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0013854
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref5
        bwb_id: BWBR0013854
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '26.3'
    text: |-
      De kilometerheffing kent als maatstaf met een motorrijtuig afgelegde afstanden, waarbij onderscheid wordt gemaakt
      naar milieu- en veiligheidskenmerken van de auto en onderscheid kan worden gemaakt naar de tijdsperiode waarin en
      de plaats waar wordt gereden.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel26
  - number: '26.4'
    text: Bij of krachtens wet worden nadere regels over de kilometerheffing gesteld.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel26
  - number: '27.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot dit hoofdstuk regels worden gesteld ter aanvulling van
      de in dit hoofdstuk geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel27
  - number: '27.2'
    text: |-
      Bij regeling van Onze Minister kunnen in overeenstemming met Onze Minister van Financiën nadere regels worden
      gesteld ten behoeve van de uitvoering van de in het eerste lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel27
  - number: '28.1'
    text: |-
      Als een provincie, een openbaar lichaam ingesteld krachtens de [Kaderwet bestuur in verandering][ref1], of
      een gemeente een regionaal mobiliteitsfonds tot stand heeft gebracht met als enig doel de bekostiging van
      infrastructurele maatregelen en vervoersdiensten, kan Onze Minister ten gunste van het fonds bijdragen verlenen,
      indien daarmee de bereikbaarheid van een uit het oogpunt van verkeer en vervoer samenhangend gebied en van
      belangrijke economische en andere centra binnen dat gebied wordt bevorderd, en binnen het gebied voldoende
      overeenstemming bestaat over de wijze waarop de middelen uit het fonds tot besteding zullen komen.


      [ref1]: https://wetten.overheid.nl/BWBR0006620
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006620
  - number: '28.2'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel28
  - number: 28.2.a
    text: de voorwaarden en voorschriften die aan een bijdrage kunnen worden verbonden, en
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel28
  - number: 28.2.b
    text: de verantwoording met betrekking tot de besteding van de desbetreffende rijksbijdragen.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel28
  - number: '29'
    text: 'Onze Minister zendt periodiek aan de Staten-Generaal een overzicht, bevattende:'
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel29
  - number: 29.a
    text: de wegen, in beheer bij het Rijk, met structurele congestie;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel29
  - number: 29.b
    text: de plaatsen die voor plaatsing van een betaalpoort voor het expresbaantarief zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel29
  - number: 29.c
    text: de wegvakken waar plaatsing van een betaalpoort voor het expresbaantarief wordt overwogen.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel29
  - number: '30.1'
    text: |-
      Op de voorbereiding van een in artikel 3, eerste lid, bedoeld besluit is de in
      [paragraaf 3.5.6 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing. [Artikel 3:19,
      tweede lid, onderdeel a, van de Algemene wet bestuursrecht](onbekend) is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.6
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 3.5.6
  - number: '30.2'
    text: |-
      In afwijking van [artikel 3:32, eerste lid, van de Algemene wet bestuursrecht][ref1]
      kunnen bedenkingen worden ingebracht binnen zes weken na de mededeling, bedoeld in
      [artikel 3:30, eerste lid, van de Algemene wet bestuursrecht][ref2]. Provinciale staten en de raden van de
      betrokken gemeenten delen binnen diezelfde termijn schriftelijk hun oordeel over het ontwerp-besluit aan Onze
      Minister mee.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '31'
    text: |-
      Indien een bestemmingsplan voorschriften bevat die in strijd zijn met een in [artikel 3, eerste lid][ref1], bedoeld
      besluit, bepaalt dat besluit dat ter zake de [artikelen 32][ref2] en [34][ref3] van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013854#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0013854#Artikel34
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0013854
        artikel: '32'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0013854
        artikel: '34'
        hoofdstuk: '4'
  - number: '32.1'
    text: |-
      Een in [artikel 3, eerste lid][ref1], bedoeld besluit geldt als voorbereidingsbesluit als bedoeld in
      [artikel 21 van de Wet op de Ruimtelijke Ordening][ref2]. Voor zover het in de eerste volzin bedoelde besluit geldt
      als voorbereidingsbesluit, is [artikel 21, vierde tot en met zesde lid, van de Wet op de Ruimtelijke Ordening][ref3]
      niet van toepassing. Het besluit geldt niet meer als voorbereidingsbesluit indien voor de plaats die is aangewezen
      in het besluit een bestemmingsplan in overeenstemming met het besluit in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel21
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0002375
        artikel: '21'
  - number: '32.2'
    text: |-
      [Artikel 50 van de Woningwet](onbekend) is niet van toepassing op aanvragen om een bouwvergunning ter uitvoering
      van een besluit als bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel3
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '32.3'
    text: |-
      Voor zover het in [artikel 3, eerste lid][ref1], bedoelde besluit en het bestemmingsplan niet met elkaar
      in overeenstemming zijn, geldt het besluit voor de uitvoering daarvan als vrijstelling, als bedoeld in
      [artikel 19 van de Wet op de Ruimtelijke Ordening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '19'
  - number: '32.4'
    text: |-
      Voor zover een bestemmingsplan of een ander besluit voor de uitvoering van werken en werkzaamheden een
      aanlegvergunning als bedoeld in [artikel 14 van de Wet op de Ruimtelijke Ordening][ref1] vereist, geldt zodanige
      eis niet voor de uitvoering van werken en werkzaamheden ter uitwerking van het in [artikel 3, eerste lid][ref2],
      bedoelde besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0013854#Artikel3
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0013854
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '32.5'
    text: |-
      Voorschriften in een leefmilieuverordening als bedoeld in
      [artikel 9, derde lid, van de Wet op de stads- en dorpsvernieuwing][ref1] blijven buiten toepassing voor de
      uitvoering van werken, werkzaamheden en bouwwerken en voor het gebruik van gronden en opstallen ter uitvoering van
      een in [artikel 3, eerste lid][ref2], bedoeld besluit, voor zover dat besluit en die voorschriften niet met elkaar
      in overeenstemming zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0013854#Artikel3
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0013854
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '33'
    text: |-
      Tegen een besluit als bedoeld in [artikel 3, eerste lid][ref1], kan een belanghebbende beroep instellen bij de
      Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel3
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '3'
  - number: '34.1'
    text: |-
      De gemeenteraad is verplicht binnen een jaar nadat een in [artikel 3, eerste lid][ref1], bedoeld besluit
      onherroepelijk is geworden, het bestemmingsplan overeenkomstig dat besluit vast te stellen of te herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel3
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '34.2'
    text: |-
      Indien het bestemmingsplan niet in overeenstemming is met dat besluit, verleent het college van burgemeester en
      wethouders van de gemeente aan degenen die inzage verlangen in dat plan, tevens inzage in dat besluit.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel34
  - number: '35.1'
    text: |-
      Indien voor de uitvoering van een in [artikel 3, eerste lid][ref1], bedoeld besluit een besluit is vereist en
      dit niet of niet tijdig wordt verleend of genomen, kunnen Onze Minister en Onze Minister wie het mede aangaat
      gezamenlijk een beslissing nemen. In dat geval treedt hun besluit in de plaats van het besluit van het in eerste
      aanleg bevoegde bestuursorgaan. Indien de in de eerste volzin bedoelde ministers voornemens zijn een beslissing te
      nemen, plegen zij overleg met het bestuursorgaan dat in eerste aanleg bevoegd is te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel3
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '35.2'
    text: |-
      Ten aanzien van aanvragen om een besluit als bedoeld in het eerste lid, is Onze Minister mede bevoegd deze in te
      dienen bij het bevoegde bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel35
  - number: '36.1'
    text: |-
      Het oprichten of wijzigen van een in [artikel 3, eerste lid][ref1], bedoelde betaalpoort wordt voor de toepassing
      van de [Belemmeringenwet Privaatrecht][ref2] aangemerkt als openbaar werk van algemeen nut.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0001936
  - number: '36.2'
    text: |-
      Indien voor de uitvoering van een in [artikel 3, eerste lid][ref1], bedoeld besluit toepassing van de
      [Belemmeringenwet Privaatrecht][ref2] noodzakelijk is, geldt het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001936
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0001936
  - number: 36.2.a
    text: |-
      in afwijking van [artikel 2, vierde lid, van de Belemmeringenwet Privaatrecht][ref1], kan Onze Minister van Verkeer
      en Waterstaat:


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '2'
  - number: 36.2.a.1°
    text: een andere plaats of gemeente aanwijzen waar de zitting wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel36
  - number: 36.2.a.2°
    text: bepalen dat de zitting wordt geleid door een door Onze Minister van Verkeer en Waterstaat aan te wijzen persoon;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel36
  - number: 36.2.b
    text: |-
      in afwijking van de [artikelen 2, vijfde lid][ref1], en [3, tweede lid, van de Belemmeringenwet Privaatrecht][ref2]
      wordt het college van gedeputeerde staten niet gehoord;


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '3'
  - number: 36.2.c
    text: |-
      in plaats van [artikel 4 van de Belemmeringenwet Privaatrecht][ref1] geldt het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel4
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '4'
  - number: 36.2.c.1°
    text: |-
      tegen een besluit als bedoeld in [artikel 2, vijfde lid][ref1], of [artikel 3, tweede lid, van die wet][ref2] kan
      een belanghebbende beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State;


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '3'
  - number: 36.2.c.2°
    text: |-
      [artikel 7:1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 36.2.c.3°
    text: |-
      de werking van een besluit als bedoeld in [artikel 2, vijfde lid][ref1], of
      [artikel 3, tweede lid, van de Belemmeringenwet Privaatrecht][ref2] wordt opgeschort tot het tijdstip waarop de
      termijn voor het indienen van een beroepschrift verstrijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel3
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001936
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001936
        artikel: '3'
  - number: '37'
    text: |-
      [Artikel 72a van de onteigeningswet][ref1] is van overeenkomstige toepassing met het oog op onteigening ten behoeve
      van betaalpoorten.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel72a
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 72a
  - number: '38'
    text: |-
      In geval [artikel 3, tweede lid][ref1], niet wordt toegepast ten aanzien van een weg die in beheer is bij een
      ander dan het Rijk, en het naar het oordeel van Onze Minister in het belang van een goede uitvoering van de wet
      is dat ter zake een besluit als bedoeld in [artikel 3, tweede lid][ref2], wordt genomen, kan Onze Minister, in
      overeenstemming met Onze Ministers van Financiën en van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, een
      zodanig besluit nemen en zijn ter zake de artikelen [30 tot en met 37][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013854#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013854#Artikel30
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0013854
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0013854
        artikel: '30'
        hoofdstuk: '4'
  - number: '39'
    text: |-
      Onze Minister zendt tweejaarlijks voor juli aan de beide kamers der Staten-Generaal een overzicht waaruit de stand
      van zaken met betrekking tot de mobiliteitstarieven blijkt. Het overzicht geeft in elk geval aan:
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel39
  - number: 39.a
    text: de wegbeheerder;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel39
  - number: 39.b
    text: de locatie waarop het mobiliteitstarief betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel39
  - number: 39.c
    text: de exploitatiekosten;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel39
  - number: 39.d
    text: de opbrengsten;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel39
  - number: 39.e
    text: de besteding van de opbrengsten;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel39
  - number: 39.f
    text: informatie over de opbrengsten en bestedingen van alle afzonderlijke mobiliteitsfondsen.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel39
  - number: '40.1'
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Financiën binnen twee en een half jaar na de datum
      waarop voor het eerst een expresbaantarief is geheven, aan de Staten-Generaal een verslag over de doeltreffendheid
      en de effecten van deze wet in de praktijk wat het expresbaantarief betreft.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel40
  - number: '40.2'
    text: 'Het verslag, bedoeld in het eerste lid, heeft in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel40
  - number: 40.2.a
    text: |-
      de verandering van de congestie en de reistijden op wegen of banen waar het expresbaantarief wordt geheven en op
      wegen of banen die in dezelfde verbinding voorzien;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel40
  - number: 40.2.b
    text: de verandering in verkeersstromen en in ritmotieven, op alle in aanmerking komende wegen of banen;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel40
  - number: 40.2.c
    text: |-
      de verandering van de verkeerssituatie en de verkeersveiligheid, tijdens de heffingsperiode en de direct daaraan
      voorafgaande of daarop volgende periodes, nabij de betaalpoorten en bij de plaatsen waar in verband met de heffing
      op nabijgelegen betaalpoorten verkeersbeperkende maatregelen worden genomen, de mate van doorstroming op wegen of
      banen waar het expresbaantarief wordt geheven;
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel40
  - number: 40.2.d
    text: de met de onder b bedoelde verandering in verkeersstromen samenhangende gevolgen voor de geluidsbelasting, en
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel40
  - number: 40.2.e
    text: |-
      het gedrag van weggebruikers die al dan niet gebruik maken van wegen of banen waar het expresbaantarief wordt
      geheven.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel40
  - number: '40.3'
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Financiën binnen twee en een half jaar na de datum
      waarop voor het eerst een toltarief is geheven, aan de Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van deze wet in de praktijk wat het toltarief betreft.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel40
  - number: '41'
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Financiën binnen vijf jaar na de datum waarop
      het verslag, bedoeld in [artikel 40, eerste lid][ref1], aan de beide kamers der Staten-Generaal is gezonden en
      vervolgens telkens na vier jaar aan de beide kamers der Staten-Generaal een verslag over de doeltreffendheid en
      doelmatigheid van deze wet in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel40
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '40'
        hoofdstuk: '5'
  - number: '42'
    text: |-
      Op eerste vordering van ambtenaren van de rijksbelastingdienst of van opsporingsambtenaren als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1], is de bestuurder van een motorrijtuig verplicht dat te
      doen stilstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '43'
    text: |-
      De in [artikel 42][ref1] bedoelde ambtenaren zijn bevoegd een motorrijtuig te onderwerpen aan een onderzoek en
      het daartoe te brengen of te doen brengen naar een nabij gelegen plaats. De bestuurder van het motorrijtuig en
      bij diens afwezigheid degene die het motorrijtuig houdt, is verplicht desgevorderd zijn voor het onderzoek en het
      vervoer noodzakelijke medewerking te verlenen en de ambtenaren met het motorrijtuig te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel42
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '42'
        hoofdstuk: '6'
  - number: '44.1'
    text: |-
      Tot het tijdstip, bedoeld in [artikel 40, eerste lid][ref1], wordt de houder van een motorrijtuig, die in het bezit
      is van een abonnement, afgegeven door het Rijk, voor het gebruik van een expresbaan gedurende een maand in een
      bepaalde rijrichting, vrijgesteld van het desbetreffende expresbaantarief.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel40
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '40'
        hoofdstuk: '5'
  - number: '44.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt de hoogte van het tarief voor een abonnement bepaald, met
      dien verstande dat het tarief ten hoogste € 140 bedraagt.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel44
  - number: '45.1'
    text: |-
      [Hoofdstuk VI, afdelingen 3][ref1] en [4, van de Wet geluidhinder][ref2] is tot een half jaar nadat het verslag,
      bedoeld in [artikel 40, eerste lid][ref3], aan de beide kamers der Staten-Generaal is toegezonden, niet van
      toepassing op de plaatsing van betaalpoorten voor een expresbaantarief.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Afdeling3
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Afdeling4
      [ref3]: https://wetten.overheid.nl/BWBR0013854#Artikel40
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003227
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003227
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0013854
        artikel: '40'
        hoofdstuk: '5'
  - number: '45.2'
    text: |-
      Indien uit een verslag als bedoeld in [artikel 40, eerste lid][ref1], blijkt dat de aanwijzing van een betaalpoort
      een reconstructie van een weg als bedoeld in [artikel 1, eerste lid, van de Wet geluidhinder][ref2], inhoudt,
      neemt de beheerder van een weg binnen één jaar na het in [artikel 40, eerste lid][ref3], bedoelde tijdstip, een
      besluit, houdende te treffen maatregelen, gericht op het terugbrengen van de geluidsbelasting, vanwege de weg, van
      de gevel van woningen of andere geluidsgevoelige gebouwen of aan de grens van geluidsgevoelige terreinen binnen
      de zone van de weg, tot de voor de aanwijzing van de betaalpoort heersende waarde of tot de eerder ingevolge de
      [Wet geluidhinder][ref4] vastgestelde waarde, indien deze waarde lager is dan die heersende waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0013854#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0003227
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0013854
        artikel: '40'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '40'
      - id: ref4
        bwb_id: BWBR0003227
  - number: '45.3'
    text: De kosten van de op grond van het tweede lid te treffen maatregelen komen ten laste van de beheerder van de weg.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel45
  - number: '50'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel50
  - number: '51'
    text: 'Deze wet wordt aangehaald als: Wet bereikbaarheid en mobiliteit.'
    url: https://wetten.overheid.nl/BWBR0013854/2003-06-25#Artikel51
