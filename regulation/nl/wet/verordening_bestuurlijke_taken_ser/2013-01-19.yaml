  - number: '7'
    text: |-
      1 Er is een Toezichtkamer.

      2 De Toezichtkamer bestaat uit drie leden die allen deel uitmaken van de onafhankelijke geleding van de Raad. Ten
      minste één van de leden is lid van de Bestuurskamer.

      3 De zittingsperiode van de Toezichtkamer is gelijk aan de zittingsperiode van de Raad.
    url: https://wetten.overheid.nl/BWBR0032870/2013-01-19#Artikel7
