  - number: '4'
    text: |-
      1 De Bestuurskamer wordt belast met de voorbereiding van door de Raad uit te brengen adviezen die de taken van de
      Raad als bestuursorgaan betreffen.

      2 De Bestuurskamer is gemachtigd namens de Raad van advies te dienen over onderwerpen samenhangend met
      [het tweede hoofdstuk van de Wet op de bedrijfsorganisatie][ref1].


