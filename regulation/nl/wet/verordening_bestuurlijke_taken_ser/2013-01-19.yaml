  url: https://wetten.overheid.nl/BWBR0032870/2013-01-19#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze verordening wordt verstaan onder Raad: Sociaal-Economische Raad.'
    url: https://wetten.overheid.nl/BWBR0032870/2013-01-19#Artikel1
  - number: '2'
    text: |-
      De taken en bevoegdheden die bij of krachtens de Wet op de ondernemingsraden zijn toegekend aan de Raad worden, met
      uitzondering van de bevoegdheid tot het stellen van nadere regelen bij verordening, gedelegeerd aan het dagelijks
      bestuur.
    url: https://wetten.overheid.nl/BWBR0032870/2013-01-19#Artikel2
  - number: '3'
    text: |-
      1 Er is een Bestuurskamer.

      2 De leden van de Bestuurskamer worden door de Raad uit zijn midden benoemd.

      3 De Bestuurskamer bestaat uit negen leden, gelijkelijk verdeeld over de drie geledingen van de Raad.

      4 De zittingsperiode van de Bestuurskamer is gelijk aan de zittingsperiode van de Raad.

      5 Voor elk lid kan een plaatsvervanger worden benoemd, al dan niet uit het midden van de Raad.

      6 De Raad benoemt de voorzitter uit de onafhankelijke geleding van de Raad.

      7 Indien een besluit van de Bestuurskamer niet unaniem is, wordt dat besluit genomen bij meerderheid van stemmen,
      waarbij binnen elk der geledingen de stemverhoudingen gelden zoals die voortvloeien uit de ledenaantallen in de
      Raad. Bij besluiten genomen op grond van het bepaalde in de [artikelen 5][ref1] en [6][ref2] is het stemrecht
      voorbehouden aan de leden en plaatsvervangers uit het midden van de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0032870#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0032870#Artikel6
    url: https://wetten.overheid.nl/BWBR0032870/2013-01-19#Artikel3
