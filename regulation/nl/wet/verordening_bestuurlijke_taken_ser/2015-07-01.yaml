preamble:
  text: |-
    Gelet op de artikelen 19, 35, 37, 42 en 44 van de Wet op de bedrijfsorganisatie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0032870/2015-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze verordening wordt verstaan onder Raad: Sociaal-Economische Raad.'
    url: https://wetten.overheid.nl/BWBR0032870/2015-07-01#Artikel1
  - number: '2'
    text: |-
      De taken en bevoegdheden die bij of krachtens de Wet op de ondernemingsraden zijn toegekend aan de Raad worden, met
      uitzondering van de bevoegdheid tot het stellen van nadere regelen bij verordening, gedelegeerd aan het dagelijks
      bestuur.
    url: https://wetten.overheid.nl/BWBR0032870/2015-07-01#Artikel2
  - number: '3'
    text: |-
      Het dagelijks bestuur wordt belast met de voorbereiding van door de Raad uit te brengen adviezen die de taken van
      de Raad als bestuursorgaan betreffen.
    url: https://wetten.overheid.nl/BWBR0032870/2015-07-01#Artikel3
  - number: '4'
    text: |-
      De taken en bevoegdheden die in het [Besluit opheffing Landbouwschap][ref1] zijn toegekend aan de Raad worden
      gedelegeerd aan het dagelijks bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0011674
    url: https://wetten.overheid.nl/BWBR0032870/2015-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011674
  - number: '5'
    text: |-
      De taken en bevoegdheden die op grond van [artikel LIII van de Wet opheffing bedrijfslichamen][ref1] en de
      [artikelen 126, zevende lid][ref2] en [134, tweede lid, van de Wet op de bedrijfsorganisatie][ref3], zoals die
      luidden onmiddellijk voorafgaande aan de inwerkingtreding van de [Wet opheffing bedrijfslichamen][ref4], zijn
      toegekend aan de Raad worden gedelegeerd aan de voorzitter van de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0036083#ArtikelLIII
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel126
      [ref3]: https://wetten.overheid.nl/BWBR0002058#Artikel134
      [ref4]: https://wetten.overheid.nl/BWBR0036083
    url: https://wetten.overheid.nl/BWBR0032870/2015-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0036083
        artikel: LIII
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '126'
      - id: ref3
        bwb_id: BWBR0002058
        artikel: '134'
      - id: ref4
        bwb_id: BWBR0036083
  - number: '6'
    text: |-
      De [Instellingsverordening Bestuurskamer 2008][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0024271
    url: https://wetten.overheid.nl/BWBR0032870/2015-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024271
  - number: '7'
    text: |-
      Deze verordening treedt in werking met ingang van de dag na de dag van bekendmaking in het Verordeningenblad
      Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0032870/2015-07-01#Artikel7
  - number: '8'
    text: |-
      Deze verordening wordt aangehaald als: Verordening bestuurlijke taken SER.

      Deze verordening zal met de toelichting in het Verordeningenblad Bedrijfsorganisatie worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0032870/2015-07-01#Artikel8
