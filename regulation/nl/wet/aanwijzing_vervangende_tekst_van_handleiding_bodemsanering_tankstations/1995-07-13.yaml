preamble:
  text: |-
    Gelet op artikel 1, onder l, van het Besluit tankstations milieubeheer en artikel 1, onder n, van het Besluit
    herstelinrichtingen voor motorvoertuigen milieubeheer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007470/1995-07-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De gewijzigde tekst van de Handleiding bodemsanering tankstations die als bijlage bij deze regeling behoort, treedt
      in de plaats van de in [artikel 1, onder l, van het Besluit tankstations milieubeheer][ref1] bedoelde tekst van die
      handleiding en van de in artikel 1, onder n, van het Besluit herstelinrichtingen voor motorvoertuigen milieubeheer
      bedoelde tekst van die handleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0006423#Artikel1
