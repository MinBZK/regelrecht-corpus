        artikel: '1'
  - number: '2'
    text: |-
      1 Dit besluit is van toepassing op:

      a. de pensioengerechtigde;

      b. de partner van de pensioengerechtigde;

      c. de wettelijke vertegenwoordiger van de pensioengerechtigde.

      2 Dit besluit is ook van toepassing als de in het eerste lid bedoelde personen in het buitenland wonen.
    url: https://wetten.overheid.nl/BWBR0007873/2002-01-01#Artikel2
  - number: '3'
    text: |-
      1 Indien degene op wie dit besluit van toepassing is de verplichting om op verzoek informatie verstrekken als
      bedoeld in [artikel 49 AOW][ref1], niet binnen de door de Sociale Verzekeringsbank daarvoor vastgestelde termijn
      is nagekomen, of een verplichting, genoemd in de [artikelen 3 tot en met 7 van de Controlevoorschriften AOW][ref2],
      niet of niet behoorlijk is nagekomen, wordt het ouderdomspensioen tijdelijk gedeeltelijk geweigerd.

      2 De weigering, bedoeld in het eerste lid, vindt plaats door een bedrag, dat met inachtneming van [artikel 4][ref3]
      is vastgesteld, in mindering te brengen op de eerstvolgende uit te betalen termijn of termijnen van het
      ouderdomspensioen.

      3 In afwijking van het eerste lid vindt geen weigering plaats maar wordt een schriftelijke waarschuwing
      gegeven indien het niet tijdig nakomen van de verplichting om op verzoek informatie te verstrekken als bedoeld
      in [artikel 49 AOW][ref4], niet heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van
      ouderdomspensioen, tenzij:

      a. door de Bank ter zake van het niet tijdig nakomen van de verplichting reeds een schorsingsbeslissing is genomen;
      of

      b. het niet nakomen van de verplichting plaatsvindt binnen een periode van twee jaar, te rekenen vanaf de datum
      waarop aan de mededelingsplichtige reeds eerder een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0007871#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007873#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel49
    url: https://wetten.overheid.nl/BWBR0007873/2002-01-01#Artikel3
