        artikel: '3'
  - number: '5'
    text: |-
      Indien ten genoegen van de Bank aannemelijk wordt gemaakt dat het niet nakomen van een verplichting zoals opgelegd
      in de [Controlevoorschriften AOW][ref1] niet kan worden verweten aan degene aan wie de verplichting is opgelegd,
      worden de [artikelen 3][ref2] en [4][ref3] niet toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007871
      [ref2]: https://wetten.overheid.nl/BWBR0007873#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007873#Artikel4
    url: https://wetten.overheid.nl/BWBR0007873/2002-01-01#Artikel5
    references:
