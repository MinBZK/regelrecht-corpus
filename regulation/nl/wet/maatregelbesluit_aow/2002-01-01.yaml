        artikel: '49'
  - number: '4'
    text: |-
      1 Bij het na een schriftelijk rappel of een schriftelijke waarschuwing niet binnen twee weken, dan
      wel op een door de Bank nader vast te stellen tijdstip, nakomen van een verplichting als bedoeld in de
      [artikelen 4 tot en met 7 van de Controlevoorschriften AOW][ref1], wordt een bedrag van € 22,– in mindering
      gebracht op het ouderdomspensioen.

      2 Bij het niet nakomen van een verplichting als bedoeld in [artikel 3 van de Controlevoorschriften AOW][ref2] wordt
      een bedrag van € 22,– in mindering gebracht op het ouderdomspensioen.

      3 Indien binnen een kalendermaand twee of meer verplichtingen, genoemd in de
      [artikelen 3 tot en met 7 van de Controlevoorschriften AOW][ref3], niet worden nagekomen, wordt eenmaal het in het
      eerste lid genoemde bedrag op het ouderdomspensioen in mindering gebracht.

      4 Indien binnen twee jaren na de dag waarop een weigering als gevolg van het niet nakomen van één of meer
      verplichtingen is bekendgemaakt, opnieuw één of meer verplichtingen niet worden nagekomen, wordt een bedrag van €
      34,– in mindering gebracht op het ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0007871#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007871#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007871#Artikel3
    url: https://wetten.overheid.nl/BWBR0007873/2002-01-01#Artikel4
