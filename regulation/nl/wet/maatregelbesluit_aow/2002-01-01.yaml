  - number: '6'
    text: |-
      Indien ten genoegen van de Bank aannemelijk wordt gemaakt dat het niet nakomen van een verplichting zoals opgelegd
      in de [Controlevoorschriften AOW][ref1] aan degene aan wie de verplichting is opgelegd in verminderde mate kan
      worden verweten, wordt het bedrag dat is vastgesteld met toepassing van [artikel 4][ref2] gehalveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007871
