preamble:
  text: |-
    Gelet op de Richtlijn van de Raad van de Europese Gemeenschappen van 16 december 1991 inzake de onderlinge
    erkenning van bewijzen van bevoegdheid voor burgerluchtvaartpersoneel (91/670/EEG);

    Gelet op artikel 31, eerste lid, van de Regeling Toezicht Luchtvaart (Stb. 1959, 67);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1.1 De houder van een geldig buitenlands bewijs van bevoegdheid afgegeven overeenkomstig de eisen van Annex I bij
      het Verdrag van Chicago als:

        - verkeersvlieger
        - beroepsvlieger
        - privé-vlieger
        - bestuurder van zweefvliegtuigen
        - bestuurder van vrije ballons

      kan zonder dat hiervoor een bewijs van gelijkstelling als bedoeld in
      [artikel 31, eerste lid, van de Regeling Toezicht Luchtvaart][ref1] is afgegeven, privé-vluchten of -vaarten maken
      boven Nederland mits:

      a. deze in Nederland geen vaste woon- of verblijfplaats heeft;

      b. de vluchten of vaarten die gemaakt worden VFR-vluchten zijn in een luchtvaartuig gecertificeerd voor één
      vlieger;

      c. de beperkingen en bevoegdheden van het buitenlands bewijs van bevoegdheid voor genoemde vluchten in acht worden
      genomen.

      1.2 De voorwaarde in het eerste lid onder a is niet van toepassing op de houder van een bewijs van bevoegdheid
      afgegeven in een EG-lidstaat.

      Het is de houder van een dergelijk bewijs van bevoegdheid alleen toegestaan vluchten of vaarten te maken in het
      gebied boven de EG-lidstaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002309#Artikel31
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002309
        artikel: '31'
  - number: '2'
    text: |-
      2.1 Een bewijs van bevoegdheid afgegeven door een E.G.-lidstaat wordt gelijkgesteld indien blijkt dat het
      voorgelegde bewijs van bevoegdheid gebaseerd is op eisen die gelijkwaardig zijn aan de eisen van Nederland.

      Mocht er redelijk gegronde twijfel bestaan aan de gelijkwaardigheid van die eisen, dan kan bepaald worden, dat aan
      aanvullende eisen of examens moet worden voldaan alvorens gelijkstelling van het bewijs van bevoegdheid mogelijk
      is.

      2.2 Indien de houder van een bewijs van bevoegdheid, dat is afgegeven in één der E.G.-lidstaten op grond van de
      eisen van bijlage 1 bij het Verdrag van Chicago inzake de Internationale Burgerluchtvaart, voldoet aan de eisen
      van ervaring en medische geschiktheid bij deze regeling behorende [bijlage A][ref1], wordt hem een bewijs van
      gelijkstelling afgegeven, nadat hij ten overstaan van de desbetreffende Nederlandse examencommissie met goed gevolg
      heeft afgelegd:

      a. een praktisch examen; voor zover gewenst en krachtens de Nederlandse voorschriften nodig worden in dit examen
      begrepen de in het buitenlands bewijs van bevoegdheid gestelde bevoegdverklaring(en); en

      2.3 Bevoegdverklaringen worden uitsluitend gelijkgesteld in samenhang met de gelijkstelling van een bewijs van
      bevoegdheid.

      2.4 Ten bewijze van de in het tweede lid genoemde ervaring en medische geschiktheid dient een logboek en een
      geldige medische verklaring als bedoeld in [artikel 2.4 Wet Luchtvaart][ref2], te worden overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006099
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006099
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2.4'
  - number: '3'
    text: |-
      3.1 Indien de houder van een bewijs van bevoegdheid afgegeven overeenkomstig de eisen van Annex I bij het Verdrag
      van Chicago in landen die geen lid zijn van de E.G. andere privé-vluchten dan genoemd in [artikel 1][ref1] wenst
      te maken kan een bewijs van gelijkstelling worden afgegeven. Om voor afgifte van een bewijs van gelijkstelling in
      aanmerking te komen moet aan de volgende voorwaarden worden voldaan:

      a. de houder van het buitenlands bewijs van bevoegdheid voldoet aan de ervaringseisen na afgifte van het betrokken
      buitenlandse bewijs van bevoegdheid en aan de medische geschiktheid zoals genoemd in [bijlage A][ref2];

      b. de vereiste examens voor het buitenlandse bewijs van bevoegdheid en de daarin gestelde bevoegdverklaringen
      moeten in het land van afgifte van het bewijs van bevoegdheid zijn afgelegd;

      c. Voor de gelijkstelling van het buitenlandse bewijs van bevoegdheid en de daarin gestelde bevoegdverklaring(en)
      moet de aanvrager met gunstig resultaat een praktisch examen afleggen voor alle gewenste in het buitenlands bewijs
      van bevoegdheid gestelde bevoegdverklaring(en);

      d. aanvullende examens moeten worden gedaan, indien de inhoud van de exameneisen voor het buitenlands bewijs van
      bevoegdheid en de daarin gestelde bevoegdverklaringen niet overeenkomen met de Nederlandse exameneisen;

      e. Ten bewijze van de in onderdeel a genoemde ervaring en medische geschiktheid dient een logboek en een geldige
      medische verklaring als bedoeld in [artikel 2.4 Wet Luchtvaart][ref3], te worden overlegd.

      3.2 Bevoegdverklaringen worden uitsluitend gelijkgesteld in samenhang met de gelijkstelling van een bewijs van
      bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006099#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006099
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel3
    references:
