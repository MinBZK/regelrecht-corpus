        artikel: '2.4'
  - number: '8'
    text: |-
      Bewijzen van bevoegdheid afgegeven overeenkomstig de eisen van Annex I bij het Verdrag van Chicago in landen
      die geen lid zijn van de E.G. kunnen worden gelijkgesteld. Om voor afgifte van een bewijs van gelijkstelling in
      aanmerking te komen moet aan de volgende voorwaarden worden voldaan:

      a. de houder van het buitenlands bewijs van bevoegdheid voldoet aan de ervaringseisen na afgifte van het betrokken
      buitenlandse bewijs van bevoegdheid zoals genoemd in [bijlage A][ref1];

      b. de vereiste examens voor het buitenlandse bewijs van bevoegdheid en de daarin gestelde bevoegdverklaring(en)
      moeten in het land van afgifte van het bewijs van bevoegdheid zijn afgelegd;

      c. voor de gelijkstelling van het buitenlandse bewijs van bevoegdheid en de daarin gestelde bevoegdverklaring(en)
      moet de aanvrager met gunstig resultaat een praktisch examen afleggen voor alle gewenste in het buitenlands bewijs
      van bevoegdheid gestelde bevoegdverklaring(en);

      d. aanvullende examens moeten worden gedaan, indien de inhoud van de exameneisen voor het buitenlands bewijs van
      bevoegdheid en de daarin gestelde bevoegdverklaring(en) niet overeenkomen met de Nederlandse exameneisen;

      e. de aanvrager moet een geldige medische verklaring als bedoeld in [artikel 2.4 Wet Luchtvaart][ref2], overleggen.

      f. Ten bewijze van de onder a, genoemde ervaring dient een logboek te worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006099
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006099
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2.4'
  - number: '9'
    text: |-
      Op basis van de buitenlandse senior commercial pilot licence wordt ten hoogste een bewijs van gelijkstelling op het
      niveau van een vliegbewijs B3 afgegeven.
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel9
  - number: '10'
    text: |-
      1 De aanvraag van een bewijs van gelijkstelling moet zijn gesteld op een daartoe bestemd en deugdelijk ingevuld
      aanvraagformulier met daarbij gevoegd het origineel of een gewaarmerkte kopie van het gelijk te stellen
      bewijs van bevoegdheid, het logboek, de examenresultaten en een geldige medische verklaring als bedoeld in
      [artikel 2.4 Wet Luchtvaart][ref1].

      2 Een aanvraag voor een bewijs van gelijkstelling moet worden ingediend bij de divisie Luchtvaart van de Inspectie
      Verkeer en Waterstaat te Den Haag.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2.4'
  - number: '11'
    text: |-
      Het bewijs van gelijkstelling is geldig gedurende de geldigheidsduur van het buitenlands bewijs van bevoegdheid en
      de daarop aangebrachte bevoegdverklaringen.
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel11
  - number: '12'
    text: |-
      Het bepaalde in de [artikelen 27][ref1], [28][ref2] en [29 van de Regeling Toezicht Luchtvaart][ref3] ten aanzien
      van schorsing, intrekking en vernieuwing van bewijzen van bevoegdheid is eveneens van toepassing op het bewijs
      van gelijkstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002309#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002309#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002309#Artikel29
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002309
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0002309
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0002309
        artikel: '29'
  - number: '13'
    text: |-
      13.1 Indien in het Nederlands luchtvaartuigenregister ingeschreven luchtvaartuigen ter beschikking worden gesteld
      van een in het buitenland gevestigde onderneming welke vluchten gaat uitvoeren buiten Nederland kan, op grond van
      geldige buitenlandse bewijzen van bevoegdheid, voor stuurhutpersoneel dat één of meer bepaalde luchtvaartuigen zal
      bedienen, een groepsgelijkstelling worden afgegeven.

      13.2 Het eerste lid is van overeenkomstige toepassing met betrekking tot in het Nederlands luchtvaartuigregister
      ingeschreven luchtvaartuigen, waarmee geen passagiers of vracht worden vervoerd, die:

      a. vanaf de in het buitenland gevestigde fabriek naar Nederland of vanuit Nederland naar de in het buitenland
      gevestigde fabriek worden overgebracht; of

      b. vanaf de in Nederland gevestigde fabriek naar het buitenland of vanuit het buitenland naar de in Nederland
      gevestigde fabriek worden overgebracht.
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel13
  - number: '14'
    text: |-
      De in de buitenlandse bewijzen van bevoegdheid gestelde bevoegdverklaringen komen eveneens in aanmerking voor
      groepsgelijkstelling met uitzondering van de bevoegdverklaring Vliegonderricht.
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel14
  - number: '15'
    text: |-
      De groepsgelijkstelling wordt afgegeven voor de duur van de gebruiksovereenkomst van het in het Nederlands
      Luchtvaartuigregister ingeschreven luchtvaartuig met een maximum van 5 jaar en beperkt zich tot de in de
      overeenkomst afgesproken taken en werkzaamheden. De termijn van de groepsgelijkstelling kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel15
  - number: '16'
    text: |-
      Het bepaalde in de [artikelen 27][ref1], [28][ref2] en [29 van de Regeling Toezicht Luchtvaart][ref3] ten
      aanzien van schorsing, intrekking en vernieuwing van bewijzen van bevoegdheid is eveneens van toepassing op de
      groepsgelijkstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002309#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002309#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002309#Artikel29
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002309
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0002309
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0002309
        artikel: '29'
  - number: '17'
    text: |-
      17.1 Op een verzoek om een bewijs van gelijkstelling wordt binnen drie maanden beslist, tenzij toepassing wordt
      gegeven aan artikel 4, tweede lid, onder a, van de Richtlijn van de Raad van de Europese Gemeenschappen van 16
      december 1991 inzake de onderlinge erkenning van bewijzen van bevoegdheid voor burgerluchtvaartpersoneel (91/670/
      EEG).

      17.2

      Indien ter verkrijging van een bewijs van gelijkstelling met een bewijs van bevoegdheid, afgegeven door een
      E.G.-lidstaat, aanvullende eisen worden gesteld, wordt de Commissie van de E.G. hiervan zo spoedig mogelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel17
  - number: '21'
    text: De regeling van 29 december 1987, nr. LI/26626, Stcrt. 1988, 7, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel21
  - number: '22'
    text: Deze regeling treedt in werking met ingang van 1 augustus 1993.
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel22
  - number: '23'
    text: |-
      Deze regeling kan worden aangehaald als: Regeling gelijkstelling buitenlandse bewijzen van bevoegdheid.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel23
