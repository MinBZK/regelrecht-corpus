        artikel: '2.4'
  - number: '4'
    text: |-
      Een geldig buitenlands bewijs van bevoegdheid afgegeven overeenkomstig de eisen van Annex I bij het Verdrag van
      Chicago als:

        - verkeersvlieger
        - beroepsvlieger
        - boordwerktuigkundige

      dat elders door het bevoegde gezag is afgegeven kan geheel of gedeeltelijk worden gelijkgesteld met het
      overeenkomende Nederlandse bewijs van bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel4
  - number: '5'
    text: |-
      5.1 De in het buitenlands bewijs van bevoegdheid gestelde bevoegdverklaringen kunnen eveneens in aanmerking komen
      voor gelijkstelling.

      5.2 Bevoegdverklaringen worden uitsluitend gelijkgesteld in samenhang met de gelijkstelling van een bewijs van
      bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel5
  - number: '6'
    text: |-
      Een bewijs van bevoegdheid afgegeven door een E.G.-lidstaat wordt gelijkgesteld indien blijkt dat het voorgelegde
      bewijs van bevoegdheid gebaseerd is op eisen die gelijkwaardig zijn aan de eisen van Nederland. Mocht er redelijk
      gegronde twijfel bestaan aan de gelijkwaardigheid van die eisen, dan kan bepaald worden, dat aan aanvullende eisen
      of examens moet worden voldaan alvorens gelijkstelling van het bewijs van bevoegdheid mogelijk is.
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel6
  - number: '7'
    text: |-
      1 Indien de houder van een in één der EG-lidstaten afgegeven bewijs van bevoegdheid beschikt over de ervaring en
      medische geschiktheid genoemd in [bijlage A][ref1] wordt een bewijs van gelijkstelling afgegeven nadat deze ten
      overstaan van de desbetreffende Nederlandse examencommissie met goed gevolg een praktisch examen heeft afgelegd;
      voor zover gewenst en krachtens de Nederlandse voorschriften nodig worden in dit examen begrepen de in het
      buitenlands bewijs van bevoegdheid gestelde bevoegdverklaring(en).

      2

      Ten bewijze van de in het eerste lid genoemde ervaring en medische geschiktheid dient een logboek en een geldige
      medische verklaring als bedoeld in [artikel 2.4 Wet Luchtvaart][ref2], te worden overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006099
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0006099/2001-11-01#Artikel7
