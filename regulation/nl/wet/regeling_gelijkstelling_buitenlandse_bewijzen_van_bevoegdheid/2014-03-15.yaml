$id: regeling_gelijkstelling_buitenlandse_bewijzen_van_bevoegdheid
regulatory_layer: WET
publication_date: '2014-03-14'
valid_from: '2014-03-15'
bwb_id: BWBR0006099
url: https://wetten.overheid.nl/BWBR0006099/2014-03-15
preamble:
  text: |-
    Gelet op de Richtlijn van de Raad van de Europese Gemeenschappen van 16 december 1991 inzake de onderlinge
    erkenning van bewijzen van bevoegdheid voor burgerluchtvaartpersoneel (91/670/EEG);

    Gelet op artikel 31, eerste lid, van de Regeling Toezicht Luchtvaart (Stb. 1959, 67);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze regeling berust op [artikel 12 van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel12
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '12'
  - number: '2.1'
    text: |-
      Onverminderd hetgeen bij verordening (EU) nr. 1178/2011 is bepaald kan aan de houder van een buitenlandse bewijs
      van bevoegdheid afgegeven overeenkomstig de eisen van Annex I bij het verdrag een bewijs van gelijkstelling worden
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel2
  - number: '2.2'
    text: |-
      Bevoegdverklaringen worden uitsluitend gelijkgesteld in samenhang met de gelijkstelling van een bewijs van
      bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel2
  - number: '2.3'
    text: |-
      Voor de gelijkstelling van een PPL(A) als ballonvaarder geldt dat de houder moet beschikken over een medisch
      certificaat klasse 2, minimaal 17 jaren moet zijn en over ten minste 100 vlieguren moet beschikken.
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel2
  - number: '2.4'
    text: |-
      Voor de gelijkstelling van een zweefvliegbewijs geldt dat de houder minimaal 17 jaren moet zijn en minimaal 100
      starts heeft verricht.
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel2
  - number: '10.1'
    text: |-
      De aanvraag van een bewijs van gelijkstelling moet zijn gesteld op een daartoe bestemd en deugdelijk ingevuld
      aanvraagformulier met daarbij gevoegd het origineel of een gewaarmerkte kopie van het gelijk te stellen
      bewijs van bevoegdheid, het logboek, de examenresultaten en een geldige medische verklaring als bedoeld in
      [artikel 2.4 Wet Luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
  - number: '10.2'
    text: |-
      Een aanvraag voor een bewijs van gelijkstelling moet worden ingediend bij de Minister van Infrastructuur en Milieu
      te Den Haag.
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel10
  - number: '12'
    text: |-
      Het bepaalde in de [artikelen 27][ref1], [28][ref2] en [29 van de Regeling Toezicht Luchtvaart][ref3] ten aanzien
      van schorsing, intrekking en vernieuwing van bewijzen van bevoegdheid is eveneens van toepassing op het bewijs
      van gelijkstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002309#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002309#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002309#Artikel29
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002309
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0002309
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0002309
        artikel: '29'
  - number: 13.13.1
    text: |-
      Indien in het Nederlands luchtvaartuigenregister ingeschreven luchtvaartuigen ter beschikking worden gesteld van
      een in het buitenland gevestigde onderneming welke vluchten gaat uitvoeren buiten Nederland kan, op grond van
      geldige buitenlandse bewijzen van bevoegdheid, voor stuurhutpersoneel dat één of meer bepaalde luchtvaartuigen zal
      bedienen, een groepsgelijkstelling worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel13
  - number: 13.13.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot in het Nederlands luchtvaartuigregister
      ingeschreven luchtvaartuigen, waarmee geen passagiers of vracht worden vervoerd, die:
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel13
  - number: 13.13.2.a
    text: |-
      vanaf de in het buitenland gevestigde fabriek naar Nederland of vanuit Nederland naar de in het buitenland
      gevestigde fabriek worden overgebracht; of
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel13
  - number: 13.13.2.b
    text: |-
      vanaf de in Nederland gevestigde fabriek naar het buitenland of vanuit het buitenland naar de in Nederland
      gevestigde fabriek worden overgebracht.
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel13
  - number: '14'
    text: |-
      De in de buitenlandse bewijzen van bevoegdheid gestelde bevoegdverklaringen komen eveneens in aanmerking voor
      groepsgelijkstelling met uitzondering van de bevoegdverklaring Vliegonderricht.
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel14
  - number: '15'
    text: |-
      De groepsgelijkstelling wordt afgegeven voor de duur van de gebruiksovereenkomst van het in het Nederlands
      Luchtvaartuigregister ingeschreven luchtvaartuig met een maximum van 5 jaar en beperkt zich tot de in de
      overeenkomst afgesproken taken en werkzaamheden. De termijn van de groepsgelijkstelling kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel15
  - number: '16'
    text: |-
      Het bepaalde in de [Wet luchtvaart][ref1] ten aanzien van schorsing, intrekking en vernieuwing van bewijzen van
      bevoegdheid is eveneens van toepassing op de groepsgelijkstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: '21'
    text: De regeling van 29 december 1987, nr. LI/26626, Stcrt. 1988, 7, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel21
  - number: '22'
    text: Deze regeling treedt in werking met ingang van 1 augustus 1993.
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel22
  - number: '23'
    text: |-
      Deze regeling kan worden aangehaald als: Regeling gelijkstelling buitenlandse bewijzen van bevoegdheid. Deze
      regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006099/2014-03-15#Artikel23
