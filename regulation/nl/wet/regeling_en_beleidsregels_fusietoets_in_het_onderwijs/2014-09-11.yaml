    Gelet op de artikelen 4:4 en 4:81 van de Algemene wet bestuursrecht, de artikelen 64b, derde lid, en 64c, derde
    en vierde lid, van de Wet op het primair onderwijs, de artikelen 66b, derde lid, en 66c, derde en vierde lid,
    van de Wet op de expertisecentra, de artikelen 53f, derde lid, en 53g, vierde en vijfde lid, van de Wet op het
    voortgezet onderwijs, de artikelen 2.1.10, derde lid, en 2.1.11, tweede en derde lid, van de Wet educatie en
