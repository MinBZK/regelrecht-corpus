    text: |-
      1 Het modelformulier voor de aanvraag wordt vastgesteld overeenkomstig [bijlage 1][ref1] bij de regeling.

      2 Het modelformulier voor de fusie-effectrapportage wordt vastgesteld overeenkomstig [bijlage 2][ref2] bij de
      regeling.

      3 De aanvraag, bedoeld in [artikel 64b van de WPO][ref3], [artikel 66b van de WEC][ref4],
      [artikel 53f van de WVO][ref5], [artikel 2.1.10 van de WEB][ref6] of [artikel 16.16a van de WHW][ref7], wordt
      ingediend bij de Dienst Uitvoering Onderwijs van het Ministerie van Onderwijs, Cultuur en Wetenschap.

      4 De aanvraag wordt binnen vijf werkdagen door de Minister voor advies doorgestuurd aan de commissie, tenzij sprake
      is van de situatie als bedoeld in artikel 4, eerste lid.

      5 De commissie brengt binnen acht weken na ontvangst van de volledige aanvraag advies uit aan de Minister, met
      inachtneming van de criteria, bedoeld in [hoofdstuk 4][ref8].


