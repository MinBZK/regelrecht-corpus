      1 De noodzaak tot advisering als bedoeld in [artikel 64c, derde lid, van de WPO][ref1],
      [artikel 66c, derde lid, van de WEC][ref2], [artikel 53h, vierde lid, van de WVO][ref3] en
      [artikel 2.1.11, tweede lid, van de WEB][ref4], ontbreekt in ieder geval indien:

      a. de fusie in het basisonderwijs noodzakelijk is om te voorkomen dat met toepassing van
      [artikel 153 van de WPO][ref5] binnen 10 kalendermaanden na de ingediende aanvraag voor goedkeuring van de
      voorgenomen fusie, de bekostiging van een bijzondere school wordt beëindigd dan wel een openbare school wordt
      opgeheven;

      b. de fusie in het voortgezet onderwijs noodzakelijk is om te voorkomen dat met toepassing van
      [artikel 107 van de WVO][ref6] binnen 10 kalendermaanden na de ingediende aanvraag voor goedkeuring van de
      voorgenomen fusie, de bekostiging van een bijzondere school wordt beëindigd dan wel een openbare school wordt
      opgeheven;

      c. er ten aanzien van een bestuurlijke fusie in het basisonderwijs, waarbij de betrokken scholen gezamenlijk
      minder dan 2.500 leerlingen tellen, sprake is van een verwachte daling van 15% of meer van het aantal leerlingen
      in de gemeente waar één van de fusiepartners scholen in stand houdt, of, wanneer betreffende scholen in meerdere
      gemeenten zijn gevestigd, een verwachte daling van gemiddeld 15% van het aantal leerlingen in die gemeenten, binnen
      een tijdvak van vijf jaar waarin de aanvraag voor goedkeuring van de voorgenomen fusie is ingediend;

      d. er ten aanzien van een institutionele fusie in het basisonderwijs sprake is van een verwachte daling van 15% of
      meer van het aantal leerlingen in de gemeente waar één van de fuserende scholen gevestigd is, binnen een tijdvak
      van vijf jaar waarin de aanvraag voor goedkeuring van de voorgenomen fusie is ingediend;

      e. er ten aanzien van een bestuurlijke fusie in het voortgezet onderwijs, waarbij de betrokken scholen gezamenlijk
      minder dan 5.000 leerlingen tellen, sprake is van een verwachte daling van 15% of meer van het totaal aantal
      leerlingen dat onderwijs volgt op de scholen die door één van de fusiepartners in stand worden gehouden of op
      de school waarvan de instandhouding wordt overgedragen, binnen een tijdvak van vijf jaar waarin de aanvraag voor
      goedkeuring van de voorgenomen fusie is ingediend; of

      f. er ten aanzien van een institutionele fusie in het voortgezet onderwijs sprake is van een verwachte daling van
      15% of meer van het aantal leerlingen dat op één van de fuserende scholen onderwijs volgt, binnen een tijdvak van
      vijf jaar waarin de aanvraag voor goedkeuring van de voorgenomen fusie is ingediend.

      2 De voorzitter van de commissie kan in andere gevallen dan genoemd in het eerste lid oordelen dat de noodzaak tot
      advisering, ontbreekt, indien de fusie evident onvermijdelijk is. De voorzitter van de commissie stelt de Minister
      daarvan in kennis.

      3 De verwachte daling van 15% of meer, zoals benoemd in onderdelen c tot en met f, wordt berekend:

      a. voor het basisonderwijs aan de hand van de berekeningswijze in [paragraaf 1 van Bijlage 3][ref7] bij deze
      regeling, of

      b. voor het voortgezet onderwijs aan de hand van de berekeningswijze in [paragraaf 2 van Bijlage 3][ref8] bij deze
      regeling.


