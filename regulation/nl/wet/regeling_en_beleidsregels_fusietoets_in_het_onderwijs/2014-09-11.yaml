articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *Minister:* Minister van Onderwijs, Cultuur en Wetenschap, en voor wat betreft het landbouwonderwijs Minister
      van Economische Zaken;

      b. *commissie:* de adviescommissie, bedoeld in [artikel 64c, derde lid, van de WPO][ref1],
      [artikel 66c, derde lid, van de WEC][ref2], [artikel 53h, vierde lid, van de WVO][ref3] en
      [artikel 2.1.11, tweede lid, van de WEB][ref4];

      c. *WPO:* [Wet op het primair onderwijs][ref5];

      d. *WEC:* [Wet op de expertisecentra][ref6];

      e. *WVO:* [Wet op het voortgezet onderwijs][ref7];

      f. *WEB:* [Wet educatie en beroepsonderwijs][ref8];

      g. *WHW:* [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref9];

      h. *school:* school als bedoeld in [artikel 1 van de WPO][ref10], [artikel 1 van de WEC][ref11] en
      [artikel 1 van de WVO][ref12];

      i. *instelling:* instelling als bedoeld in [artikel 1.1.1, onderdeel b, van de WEB][ref13] en
      [artikel 1.8 van de WHW][ref14];

      j. *fusie:* fusie als bedoeld in [artikel 64 van de WPO][ref15], [artikel 66 van de WEC][ref16],
      [artikel 53d van de WVO][ref17], [artikel 2.1.8 van de WEB][ref18], en [artikel 16.16 van de WHW][ref19].


