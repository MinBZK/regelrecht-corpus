  - number: '10'
    text: |-
      In het basisonderwijs is in ieder geval sprake van een significante belemmering van de daadwerkelijke variatie van
      het onderwijsaanbod, bedoeld in [artikel 64c, eerste lid, van de WPO][ref1], indien:

      a. de door de voorgenomen bestuurlijke fusie ontstane rechtspersoon een marktpositie heeft van meer dan 50% van het
      totale onderwijsaanbod in de gemeente of gemeenten waarin de rechtspersoon scholen in stand houdt; of

      b. de door de voorgenomen bestuurlijke fusie ontstane rechtspersoon een marktpositie heeft van meer dan 35% in
      één van de gemeenten die, op het moment van indiening van de aanvraag voor goedkeuring van de fusie, door het
      CBS in de publicatie ‘Demografische kerncijfers per gemeente’ (http://www.cbs.nl/nl-NL/menu/themas/bevolking/
      publicaties/publicaties/archief/2013/default.htm) in tabel 4 *Oppervlakte, bevolkingsdichtheid, woningvoorraad,
      woningdichtheid, stedelijkheid en omgevingsadressen dichtheid 1 januari 2013,* zijn aangemerkt als sterk stedelijk
      (klasse 2) of zeer sterk stedelijk gebied (klasse 1), en deze marktpositie door de voorgenomen bestuurlijke fusie
      in die gemeente toeneemt, zonder dat daarvoor een aannemelijke rechtvaardigingsgrond aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64c
    url: https://wetten.overheid.nl/BWBR0030294/2014-09-11#Artikel10
