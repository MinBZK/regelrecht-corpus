  - number: '11'
    text: |-
      In het basisonderwijs is in ieder geval sprake van een significante belemmering van de daadwerkelijke variatie
      van het onderwijsaanbod, bedoeld in [artikel 64c, eerste lid, van de WPO][ref1], indien er als gevolg van de
      institutionele fusie minder dan twee scholen overblijven zowel in het opzicht van richting als pedagogisch-
      didactische aanpak, in een straal van 10 kilometer gerekend vanaf het vestigingsadres van de hoofdvestiging van de
      school, zonder dat daarvoor een aannemelijke rechtvaardigingsgrond aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel64c
    url: https://wetten.overheid.nl/BWBR0030294/2014-09-11#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 64c
  - number: '12'
    text: |-
      In het speciaal onderwijs onderscheidenlijk het voortgezet speciaal onderwijs is in ieder geval sprake
      van een significante belemmering van de daadwerkelijke variatie van het onderwijsaanbod, bedoeld in
      [artikel 66c, eerste lid, van de WEC][ref1], indien er een marktpositie ontstaat waarbij de door de voorgenomen
      bestuurlijke fusie ontstane rechtspersoon meer dan 50% van het onderwijsaanbod van de betreffende onderwijssoort in
      het speciaal onderwijs respectievelijk het voortgezet speciaal onderwijs in Nederland verzorgt, zonder dat daarvoor
      een aannemelijke rechtvaardigingsgrond aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel66c
    url: https://wetten.overheid.nl/BWBR0030294/2014-09-11#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 66c
  - number: '13'
    text: |-
      In het speciaal onderwijs onderscheidenlijk het voortgezet speciaal onderwijs is in ieder geval sprake
      van een significante belemmering van de daadwerkelijke variatie van het onderwijsaanbod, bedoeld in
      [artikel 66c, eerste lid, van de WEC][ref1], indien er door de voorgenomen institutionele fusie niet langer sprake
      is van een evenwichtige spreiding van de onderwijsvoorzieningen ten behoeve van een bepaalde onderwijssoort in
      het speciaal onderwijs respectievelijk het voortgezet speciaal onderwijs in het gebied dat gelet op de betreffende
      onderwijssoort op een maatschappelijk aanvaarde afstand voor de leerlingen is gelegen, zonder dat daarvoor een
      aannemelijke rechtvaardigingsgrond aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel66c
    url: https://wetten.overheid.nl/BWBR0030294/2014-09-11#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 66c
  - number: '14'
    text: |-
      In het voortgezet onderwijs is in ieder geval sprake van een significante belemmering van de daadwerkelijke
      variatie van het onderwijsaanbod, bedoeld in [artikel 53g, eerste lid, van de WVO][ref1], indien:

      a. er per schoolsoort minder dan twee rechtspersonen overblijven van verschillende richting of pedagogisch-
      didactische aanpak in de gemeente of gemeenten waarin 10% of meer van de leerlingen van de betreffende schoolsoort
      of schoolsoorten van de bij de voorgenomen bestuurlijke fusie betrokken scholen of scholengemeenschappen woonachtig
      zijn, of

      b. de door de voorgenomen bestuurlijke fusie ontstane rechtspersoon een marktpositie heeft van meer dan 50% van het
      aantal leerlingen in de gemeente of gemeenten waarin 10% of meer van de leerlingen van de betreffende schoolsoort
      of schoolsoorten van de bij de voorgenomen fusie betrokken scholen of scholengemeenschappen woonachtig zijn, zonder
      dat daarvoor een aannemelijke rechtvaardigingsgrond aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53g
    url: https://wetten.overheid.nl/BWBR0030294/2014-09-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 53g
  - number: '15'
    text: |-
      In het voortgezet onderwijs is in ieder geval sprake van een significante belemmering van de daadwerkelijke
      variatie van het onderwijsaanbod, bedoeld in [artikel 53g, eerste lid, van de WVO][ref1], indien:

      a. er per schoolsoort minder dan twee scholen of scholengemeenschappen overblijven van verschillende richting
      of pedagogisch-didactische aanpak in de gemeente of gemeenten waarin 10% of meer van de leerlingen van de
      betreffende schoolsoort of schoolsoorten van de bij de voorgenomen institutionele fusie betrokken scholen of
      scholengemeenschappen woonachtig zijn, of

      b. de door de voorgenomen institutionele fusie ontstane school of scholengemeenschap een marktpositie heeft van
      meer dan 50% van het aantal leerlingen in de gemeente of gemeenten waarin 10% of meer van de leerlingen van de
      betreffende schoolsoort of schoolsoorten van de bij de voorgenomen fusie betrokken scholen of scholengemeenschappen
      woonachtig zijn, zonder dat daarvoor een aannemelijke rechtvaardigingsgrond aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel53g
    url: https://wetten.overheid.nl/BWBR0030294/2014-09-11#Artikel15
    references:
