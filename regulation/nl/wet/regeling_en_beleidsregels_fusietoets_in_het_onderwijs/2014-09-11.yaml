        bwb_id: BWBR0002399
        artikel: 53g
  - number: '16'
    text: |-
      In het beroepsonderwijs en volwasseneneducatie is in ieder geval sprake van een significante belemmering van
      de daadwerkelijke variatie van het onderwijsaanbod, bedoeld in [artikel 2.1.11, eerste lid, van de WEB][ref1],
      indien er twee of meer onder de rechtspersonen ressorterende instellingen betrokken zijn, zonder dat daarvoor een
      aannemelijke rechtvaardigingsgrond aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.1.11
    url: https://wetten.overheid.nl/BWBR0030294/2014-09-11#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 2.1.11
  - number: '17'
    text: |-
      In het beroepsonderwijs en volwasseneneducatie is in ieder geval sprake van een significante belemmering van
      de daadwerkelijke variatie in het onderwijsaanbod, bedoeld in [artikel 2.1.11, eerste lid, van de WEB][ref1],
      indien er als gevolg van de voorgenomen institutionele fusie een afname in variatie van het onderwijsaanbod of
      onderwijsaanbieders is in het gebied dat gezien de omgeving en onderwijssoort op een maatschappelijk aanvaarde
      afstand voor de deelnemers is gelegen, zonder dat daarvoor een aannemelijke rechtvaardigingsgrond aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.1.11
    url: https://wetten.overheid.nl/BWBR0030294/2014-09-11#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 2.1.11
  - number: '18'
    text: |-
      In het hoger onderwijs is in ieder geval sprake van een significante belemmering van de daadwerkelijke variatie
      van het onderwijsaanbod, bedoeld in [artikel 16.16b, eerste lid, van de WHW][ref1], indien de fusie leidt tot
      substantieel nadelige effecten voor het onderwijsaanbod op de korte termijn of indien dit voorzienbaar is op de
      langere termijn, zonder dat daarvoor een aannemelijke rechtvaardigingsgrond aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel16.16b
    url: https://wetten.overheid.nl/BWBR0030294/2014-09-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 16.16b
  - number: '19'
    text: |-
      Rechtvaardigingsgronden als bedoeld in de [artikelen 10 tot en met 18][ref1] kunnen in ieder geval zijn:

      a. de omstandigheid dat bij het achterwege blijven van de fusie de continuïteit of de variatie van het
      onderwijsaanbod in gevaar komt, hetgeen onder meer kan blijken uit een daling of binnen vijf jaar te verwachten
      daling van het aantal leerlingen, deelnemers of studenten;

      b. de omstandigheid dat bij het achterwege blijven van de fusie de kwaliteit van het onderwijs in redelijkheid niet
      geborgd kan worden; en

      c. de omstandigheid dat er binnen de beschikbare financiële middelen geen alternatieve mogelijkheden dan fusie te
      vinden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030294#Artikel10
