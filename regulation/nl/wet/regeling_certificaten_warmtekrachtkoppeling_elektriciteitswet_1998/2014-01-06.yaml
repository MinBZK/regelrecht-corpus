  - number: '6'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet bepaalt de hoeveelheid WKK-elektriciteit die de producent op
      een net of een installatie heeft ingevoed en de besparing op primaire energie met toepassing van:

      a. de bijlagen 2 en 3 van de richtlijn;

      b. de door de Europese Commissie op 21 december 2006 vastgestelde referentiewaarden (PbEU 2007 L 32);

      c. de beschikking van de Commissie van 19 november 2008 tot vastlegging van gedetailleerde richtsnoeren voor de
      tenuitvoerlegging en toepassing van bijlage II bij Richtlijn 2004/8/EG van het Europees Parlement en de Raad (PbEU
      L 338).

      2 De netbeheerder van het landelijk hoogspanningsnet gebruikt bij de bepaling als bedoeld in het eerste lid:

      a. de gegevens, verstrekt bij het verzoek, bedoeld in [artikel 2, eerste lid][ref1];

      b. het meetrapport, bedoeld in [artikel 2a][ref2];

      c. de gegevens, bedoeld in [artikel 5, derde lid][ref3].

      3 Voor het bepalen van de elektriciteit-warmteratio conform bijlage 2, onderdeel b), van de richtlijn zal gebruik
      worden gemaakt van de volgende formule:

      C = Eη / (85% – Eη)

      waarin:

      C de elektriciteit-warmteratio is,

      Eη het elektriciteitsrendement van het proces is, gedefinieerd als de maandelijkse opbrengst aan elektriciteit,
      gedeeld door de brandstofinvoer die is gebruikt om de som van de maandelijkse opbrengst aan warmte en elektriciteit
      te produceren.

      4 De hoeveelheid WKK-elektriciteit voor de maand waarop het meetrapport betrekking heeft bedraagt nihil indien:

      a. de verhouding tussen warmte en elektriciteit minder dan 0,6 bedraagt;

      b. het aandeel aardgas op het totaal aan ingezette brandstoffen minder dan 90% bedraagt of

      c. minder dan 90% van de door de productie-installatie geproduceerde nuttige warmte wordt gebruikt in industriële
      processen.

      5 De netbeheerder van het landelijk hoogspanningsnet geeft WKK-certificaten uit voor de op basis van het eerste tot
      en met vierde lid bepaalde hoeveelheid WKK-elektriciteit.


