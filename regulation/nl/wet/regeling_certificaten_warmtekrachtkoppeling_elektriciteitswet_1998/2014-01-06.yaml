  - number: 1a
    text: |-
      Deze regeling berust op de [artikelen 1, vijfde lid][ref1], en
      [31, negende lid, van de Elektriciteitswet 1998][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
