preamble:
  text: |-
    Gelet op artikel 31, zevende lid, van de Elektriciteitswet 1998;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015182/2014-01-06#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. *wet:* de [Elektriciteitswet 1998][ref1];

      b. *WKK-elektriciteit:* de elektriciteit, opgewekt in een productie-installatie voor warmtekrachtkoppeling die
      voldoet aan bijlagen 2 en 3 van de richtlijn, waarbij de productie-installatie:

      1°. bij maximale productie van nuttige warmte, nuttige warmte en elektriciteit produceert met een verhouding groter
      of gelijk aan 0,6;

      2°. de installatie voor minimaal 90% op aardgas wordt gestookt, en

      3°. minimaal 90% van de door de productie-installatie geproduceerde nuttige warmte wordt gebruikt in industriële
      processen;

      c. *gecertificeerd meetbedrijf:* een meetbedrijf, niet zijnde een netbeheerder, dat op grond van de voorwaarden,
      bedoeld in [artikel 31, eerste lid, onderdeel b, van de wet][ref2], is toegelaten tot het verrichten van de in die
      voorwaarden neergelegde werkzaamheden en dat de hoeveelheid elektriciteit meet die afkomstig is van een productie-
      installatie;

      d. *WKK-certificaat:* de gegevens op een WKK-certificatenrekening, waarmee wordt aangetoond dat een producent met
      zijn installatie:

      1°. een hoeveelheid WKK-elektriciteit, die een meervoud is van 1 MWh, zonder emissie van kooldioxide heeft opgewekt
      en op een net of een installatie heeft ingevoed, of

      2°. een hoeveelheid mechanische energie, die een meervoud is van 1 MWh, zonder emissie van kooldioxide heeft
      opgewekt en heeft aangewend anders dan voor de opwekking van elektriciteit;

      e. *WKK-certificatenrekening:* de rekening in het systeem van elektronische gegevensverwerking dat in stand
      wordt gehouden door de netbeheerder van het landelijk hoogspanningsnet en waarmee wordt bijgehouden voor welke
      hoeveelheid WKK-elektriciteit WKK-certificaten zijn verstrekt en aan wie de WKK-certificaten op enig moment
      toekomen;

      f. *meetprotocol:* het document waarin beschreven zijn de bemetering van een installatie voor
      warmtekrachtkoppeling, de wijze van meten en de wijze van kwaliteitsborging van de meetgegevens ten aanzien van
      de hoeveelheden brandstof die de installatie verbruikt en de hoeveelheden elektriciteit, warmte en, voor zover van
      toepassing, mechanische energie, die de installatie opwekt;

      g. *meetrapport:* het rapport dat alle meetgegevens van de desbetreffende kalendermaand bevat;

      h. *gasmotor:* een inwendige explosiemotor met elektrische ontsteking of compressie-ontsteking;

      i. *WKK-eenheid:* een onderdeel binnen een WKK-installatie dat zelfstandig gecombineerd warmte en elektriciteit
      of mechanische energie opwekt en waarvoor op grond van de WKK-meetvoorwaarden, opgenomen in de bij deze regeling
      behorende [bijlage 1][ref3], een systeemgrens is bepaald;

      j. productie-installatie: een installatie bestemd voor het opwekken van elektriciteit, bestaande uit één of meer
      WKK-eenheden;

      k. *systeemgrens van de WKK-installatie:* een fictieve, gesloten omhulling van de WKK-eenheden die deel uitmaken
      van de WKK-installatie, welke omhulling voldoet aan hetgeen in de bijlage bij de beschikking van de Commissie
      van 19 november 2008 tot vastlegging van gedetailleerde richtsnoeren voor de tenuitvoerlegging en toepassing van
      bijlage II bij Richtlijn 2004/8/EG van het Europees Parlement en de Raad (PbEU L 338) is bepaald ten aanzien van
      systeemgrenzen;

      l. *richtlijn:* de Richtlijn 2004/8/EG van het Europees Parlement en de Raad van de Europese Unie van 11 februari
      2004 inzake de bevordering van warmtekrachtkoppeling op basis van de vraag naar nuttige warmte binnen de interne
      energiemarkt en tot wijziging van Richtlijn 92/42/EEG (PbEU L 52).

      2 Voor de toepassing van deze regeling wordt 1 kWh mechanische energie die nuttig is aangewend anders dan voor de
      opwekking van elektriciteit, gelijkgesteld met 1 kWh opgewekte elektriciteit.


