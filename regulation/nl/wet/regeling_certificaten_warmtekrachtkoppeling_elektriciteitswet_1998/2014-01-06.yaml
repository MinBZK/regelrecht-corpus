  - number: '4'
    text: |-
      1 De producent van WKK-elektriciteit stelt de netbeheerder in staat de vaststelling en het onderzoek, bedoeld
      in [artikel 2][ref1], te verrichten en stelt de netbeheerder dan wel het gecertificeerd meetbedrijf in staat de
      hoeveelheid WKK-elektriciteit te meten die met zijn installatie is opgewekt en op een net of een installatie is
      ingevoed.

      2 Indien zich een omstandigheid voordoet die van belang is voor de bepaling hoeveel WKK-elektriciteit is opgewekt
      en op een net of een installatie is ingevoed, meldt de producent die omstandigheid en het tijdstip waarop deze zich
      voordeed binnen twee weken aan de netbeheerder of aan het gecertificeerd meetbedrijf.


