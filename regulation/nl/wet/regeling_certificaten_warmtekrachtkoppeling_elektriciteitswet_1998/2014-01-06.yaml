        artikel: '2'
        paragraaf: '2'
  - number: '2'
    text: |-
      1 Indien een in Nederland gevestigde producent van WKK-elektriciteit de netbeheerder verzoekt om de vaststelling,
      bedoeld in [artikel 16, eerste lid, onderdeel h, van de wet][ref1], te verrichten, gebruikt daarbij het formulier
      dat is opgenomen in de bij deze regeling behorende [bijlage 2][ref2].

      2 Indien zich achter de aansluiting meerdere productie-installaties bevinden, bepaalt de producent bij het verzoek
      tot vaststelling, bedoeld in het eerste lid, de systeemgrens van iedere productie-installatie.

      3 Een wijziging van de systeemgrens van de productie-installatie leidt er niet toe dat één of meer WKK-eenheden van
      de desbetreffende productie-installatie gaan behoren aan een andere productie-installatie.

      4 Naar aanleiding van het verzoek stelt de netbeheerder vast:

      a. of de installatie een productie-installatie voor het opwekken van WKK-elektriciteit is en, indien dit het geval
      is, welke eenheden binnen de installatie een WKK-eenheid zijn,

      b. of de meetinrichting geschikt is om de hoeveelheid op een net of een installatie ingevoede WKK-elektriciteit te
      meten en

      c. of een goedgekeurd meetprotocol aanwezig is.

      5 De netbeheerder doet de vaststelling door een administratief onderzoek in te stellen naar de installatie en
      de aansluiting daarvan op het net of op een installatie. De netbeheerder kan ten behoeve van de vaststelling
      in aanvulling op het administratief onderzoek en ter verificatie van de in het formulier opgenomen gegevens de
      installatie van de producent onderzoeken om te bepalen welk gedeelte van de totale hoeveelheid door de installatie
      opgewekte en op een net of een installatie ingevoede elektriciteit kan worden aangemerkt als WKK-elektriciteit.

      6 De netbeheerder deelt het resultaat van de vaststelling binnen vier weken na ontvangst van het verzoek, bedoeld
      in het eerste lid, mee aan de producent en aan de netbeheerder van het landelijk hoogspanningsnet.

      7 Tenzij de tariefstructuren, bedoeld in [artikel 27 van de wet][ref3], iets anders bepalen, brengt de netbeheerder
      de kosten van het vaststellen of de installatie en de meter van de producent geschikt zijn in rekening bij de
      producent.

      8 Indien de producent een aanpassing van zijn productie-installatie doorvoert die een wijziging van één van de
      gegevens, vermeld in het vaststellingsverzoek, ten gevolge heeft, is een eerder verrichte vaststelling niet langer
      geldig.

      9 De producent bericht de netbeheerder vooraf over zijn voornemen een aanpassing als bedoeld in het achtste lid
      door te voeren en hij dient een nieuw verzoek tot vaststelling in. Het eerste tot en met het achtste lid zijn in
      dat geval van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0015182
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel27
