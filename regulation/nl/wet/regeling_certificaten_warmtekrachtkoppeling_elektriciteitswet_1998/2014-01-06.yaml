        artikel: '31'
  - number: 1b
    text: |-
      1 Voor het verkrijgen van WKK-certificaten draagt de producent van WKK-elektriciteit die een productie-installatie
      in stand houdt er zorg voor dat ten aanzien van deze installatie een meetprotocol opgesteld wordt, dat voldoet aan
      de WKK-meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 1][ref1].

      2 De producent laat het meetprotocol vóór de eerste dag van de kalendermaand waarin hij het verzoek, bedoeld in
      [artikel 2, eerste lid][ref2], indient, goedkeuren door een gecertificeerd meetbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0015182
      [ref2]: https://wetten.overheid.nl/BWBR0015182#Artikel2
    url: https://wetten.overheid.nl/BWBR0015182/2014-01-06#Artikel1b
