  - number: '6'
    text: |-
      1 De producent die een WKK-installatie met een andere krachtbron dan uitsluitend een of meerdere gasmotoren
      instandhoudt, overlegt bij het verzoek, bedoeld in [artikel 5, derde lid][ref1], onder vermelding van zijn EAN-
      code, het meetrapport uiterlijk twee maanden na afloop van het kwartaal waarvan de kalendermaand waarop het
      meetrapport betrekking heeft deel uitmaakt.

      2 De netbeheerder van het landelijk hoogspanningsnet berekent aan de hand van:

      a. de gegevens, verstrekt bij het verzoek, bedoeld in [artikel 2, eerste lid][ref2];

      b. de gegevens, bedoeld in [artikel 5, derde lid][ref3], en, voor zover van toepassing,

      c. het meetrapport,

      de hoeveelheid WKK-certificaten door de hoeveelheid opgewekte WKK-elektriciteit op te tellen bij de hoeveelheid
      opgewekte en anders dan voor de opwekking van elektriciteit nuttig aangewende mechanische energie en deze som te
      vermenigvuldigen met de kooldioxide-index, bedoeld in [artikel 6a][ref4].

      3 In afwijking van het eerste lid kan het meetrapport dat betrekking heeft op de maanden januari, februari, maart,
      april, mei of juni 2007 uiterlijk op 1 oktober 2007 worden overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0015182#Artikel5
