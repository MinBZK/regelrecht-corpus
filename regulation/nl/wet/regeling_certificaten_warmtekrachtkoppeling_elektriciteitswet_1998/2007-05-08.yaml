    text: |-
      1 Gedurende zes maanden na inwerkingtreding van deze regeling kan een producent de netbeheerder verzoeken de in
      [artikel 2][ref1] bedoelde vaststelling met betrekking tot de situatie vanaf het moment van inwerkingtreding van
      deze regeling uit te voeren.

      2 Gedurende zes maanden na inwerkingtreding van deze regeling kan de netbeheerder, in afwijking van
      [artikel 2, vierde lid][ref2], het aldaar bedoelde resultaat binnen acht weken na ontvangst van het
      verzoek, bedoeld in [artikel 2, eerste lid][ref3], aan de producent en aan de netbeheerder van het landelijk
      hoogspanningsnet meedelen.


