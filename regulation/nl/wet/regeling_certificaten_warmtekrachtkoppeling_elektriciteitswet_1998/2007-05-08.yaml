  - number: 2a
    text: |-
      1 De producent van WKK-elektriciteit die een installatie met een andere krachtbron dan uitsluitend een of meerdere
      gasmotoren instandhoudt, draagt er zorg voor dat de hoeveelheden brandstof die zijn installatie verbruikt en de
      hoeveelheden elektriciteit, warmte en, voor zover van toepassing, mechanische energie, die zijn installatie opwekt,
      gemeten worden volgens het meetprotocol.

      2 De producent draagt er zorg voor dat per kalendermaand onder toepassing van het meetprotocol een meetrapport
      wordt opgesteld, dat:

      a. voldoet aan de WKK-meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 1][ref1];

      b. de wijze van totstandkoming van de meetgegevens beschrijft, en

      c. geverifieerd wordt door een gecertificeerd meetbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0015182
    url: https://wetten.overheid.nl/BWBR0015182/2007-05-08#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0015182
  - number: '3'
    text: |-
      1 Vanaf de eerste dag van de kalendermaand waarin de producent het verzoek, bedoeld in
      [artikel 2, eerste lid][ref1], bij de netbeheerder heeft ingediend, beschouwt de netbeheerder
      dan wel het gecertificeerd meetbedrijf de overeenkomstig de voorwaarden, bedoeld in
      [artikel 31, eerste lid, onderdeel b, van de wet][ref2], gemeten hoeveelheid elektriciteit die de producent met
      zijn installatie opwekt en op een net of een installatie invoedt, als WKK-elektriciteit, voor zover de netbeheerder
      overeenkomstig [artikel 2][ref3] heeft vastgesteld of sprake is van een installatie voor warmtekrachtkoppeling
      alsmede of de meetinrichting geschikt is voor de meting van de elektriciteit die met de productie-installatie wordt
      opgewekt en op een net of een installatie wordt ingevoed.

      2 Het bepalen van de hoeveelheid WKK-elektriciteit die is opgewekt en op een net of een installatie is ingevoed
      geschiedt door het iedere kalendermaand aflezen van de meter.

      3 Indien de installatie van de producent voor de opwekking van WKK-elektriciteit gebruik maakt van elektriciteit
      die is afgenomen van een net, brengt de netbeheerder dan wel het gecertificeerd meetbedrijf voor de bepaling
      van de hoeveelheid WKK-elektriciteit die op een net of een installatie is ingevoed, de hoeveelheid elektriciteit
      die daarvoor is afgenomen van een net in mindering op de hoeveelheid WKK-elektriciteit die hij op grond van
      [artikel 16, eerste lid, onderdeel i, van de wet][ref4] meet.

      4 Indien zich achter de aansluiting één productie-installatie bevindt en de producent hiervoor WKK-certificaten
      heeft aangevraagd, meldt de netbeheerder, onder vermelding van de unieke 18-cijferige code van de aansluiting, aan
      de netbeheerder van het landelijk hoogspanningsnet:

      a. de hoeveelheid WKK-elektriciteit die de betreffende productie-installatie op het net heeft ingevoed, en

      b. indien WKK-certificaten voor niet-netlevering zijn aangevraagd door de producent, de hoeveelheid WKK-
      elektriciteit die de betreffende productie-installatie heeft opgewekt.

      5 Indien zich achter de aansluiting meerdere productie-installaties bevinden, meldt de netbeheerder, onder
      vermelding van de unieke 18-cijferige code van iedere productie-installatie waarvoor de producent WKK-certificaten
      heeft aangevraagd, aan de netbeheerder van het landelijk hoogspanningsnet:

      a. de hoeveelheid WKK-elektriciteit die de betreffende productie-installaties hebben opgewekt, en

      b. de hoeveelheid WKK-elektriciteit die de betreffende productie-installaties op het net hebben ingevoed.

      6 De hoeveelheid WKK-elektriciteit die door de betreffende productie-installaties aan het net wordt geleverd,
      wordt bepaald door de elektriciteit die wordt verbruikt door de installatie achter de aansluiting naar rato
      van de feitelijke elektriciteitopwekking van alle productie-installaties achter de aansluiting, in mindering te
      brengen op de WKK-elektriciteit of andere vormen van elektriciteit, die is opgewekt door de betreffende productie-
      installaties.

      7 De meetinrichting van de productie-installatie voldoet aan dezelfde nauwkeurigheidseisen als de meetinrichting op
      de aansluiting waarachter deze productie-installatie zich bevindt en zoals deze zijn omschreven in de voorwaarden
      op grond van [artikel 31, eerste lid, onder b, van de wet][ref5].

      8 Tenzij de tariefstructuren, bedoeld in [artikel 27 van de wet][ref6], iets anders bepalen, brengt de netbeheerder
      dan wel het gecertificeerd meetbedrijf de kosten van het meten van de hoeveelheid WKK-elektriciteit in rekening bij
      de producent.


