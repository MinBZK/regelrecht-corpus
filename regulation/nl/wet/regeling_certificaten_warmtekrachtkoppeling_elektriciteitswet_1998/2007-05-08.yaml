  - number: '5'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet opent op verzoek van een in Nederland gevestigde producent een
      WKK-certificatenrekening.

      2 De producent deelt bij het verzoek de uitkomst van het onderzoek, verkregen overeenkomstig [artikel 2][ref1], mee
      aan de netbeheerder van het landelijk hoogspanningsnet.

      3 De netbeheerder van het landelijk hoogspanningsnet boekt op verzoek WKK-certificaten op een daarbij aangegeven
      WKK-certificatenrekening, indien een in Nederland gevestigde producent bij het verzoek de meetgegevens omtrent WKK-
      elektriciteit, ontvangen overeenkomstig [artikel 16a, tweede en derde lid, van de wet][ref2], overlegt.

      4 Nadat een WKK-certificaat is gebruikt om het voorschot, bedoeld in [artikel 72w, derde lid, van de wet][ref3]
      te ontvangen, boekt de netbeheerder van het landelijk hoogspanningsnet het certificaat af van de WKK-
      certificatenrekening.

      5 De netbeheerder van het landelijk hoogspanningsnet brengt de kosten van het beheer van de WKK-
      certificatenrekening in rekening bij degene die het verzoek, bedoeld in het eerste lid, doet.

      6 De netbeheerder van het landelijk hoogspanningsnet sluit een WKK-certificatenrekening van een installatie die
      voor 1 januari 1998 in gebruik is genomen.

      7 Indien zich achter een aansluiting meerdere productie-installaties bevinden, vraagt een producent voor elke
      productie-installatie waarvoor hij een verzoek als bedoeld in [artikel 2, eerste lid][ref4] doet, WKK-certificaten
      voor niet-netlevering aan.


      [ref1]: https://wetten.overheid.nl/BWBR0015182#Artikel2
