  - number: 1b
    text: |-
      1 De producent van WKK-elektriciteit die een installatie met een andere krachtbron dan uitsluitend een of meerdere
      gasmotoren instandhoudt, draagt er zorg voor dat ten aanzien van zijn installatie een meetprotocol opgesteld wordt,
      dat voldoet aan de WKK-meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 1][ref1].

      2 De producent laat het meetprotocol vóór de eerste dag van de kalendermaand waarin hij het verzoek, bedoeld in
      [artikel 2, eerste lid][ref2], indient, goedkeuren door een gecertificeerd meetbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0015182
      [ref2]: https://wetten.overheid.nl/BWBR0015182#Artikel2
    url: https://wetten.overheid.nl/BWBR0015182/2007-05-08#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0015182
      - id: ref2
        bwb_id: BWBR0015182
        artikel: '2'
        paragraaf: '2'
  - number: '2'
    text: |-
      1 Een in Nederland gevestigde producent van WKK-elektriciteit verzoekt de netbeheerder vast te stellen of sprake
      is van een installatie voor warmtekrachtkoppeling alsmede of de meetinrichting geschikt is voor de meting van de
      elektriciteit die met de productie-installatie wordt opgewekt en op een net of een installatie wordt ingevoed met
      gebruikmaking van het origineel van een ondertekend formulier, dat is opgenomen in de bij deze regeling behorende
      [bijlage 2][ref1].

      2 Indien zich achter de aansluiting meerdere productie-installaties bevinden, bepaalt de producent bij het verzoek
      tot vaststelling, bedoeld in het eerste lid, de systeemgrens van iedere productie-installatie.

      3 Een wijziging van de systeemgrens van de productie-installatie leidt er niet toe dat één of meer WKK-eenheden van
      de desbetreffende productie-installatie gaan behoren aan een andere productie-installatie.

      4 Naar aanleiding van het verzoek stelt de netbeheerder vast of de installatie een installatie voor
      warmtekrachtkoppeling is, of de meetinrichting geschikt is om de hoeveelheid op een net of een installatie
      ingevoede WKK-elektriciteit te meten en, ten aanzien van een WKK-installatie met een andere krachtbron dan
      uitsluitend een of meerdere gasmotoren, dat een toepasselijk meetprotocol aanwezig is, dat is goedgekeurd door een
      gecertificeerd meetbedrijf vóór de eerste dag van de kalendermaand waarin de producent het verzoek, bedoeld in het
      eerste lid, heeft ingediend.

      5 De netbeheerder doet de vaststelling door een administratief onderzoek in te stellen naar de installatie en,
      voor zover van toepassing, de aansluiting daarvan op het net. De netbeheerder kan ten behoeve van de vaststelling
      in aanvulling op het administratief onderzoek en ter verificatie van de in het formulier opgenomen gegevens de
      installatie van de producent onderzoeken om te bepalen welk gedeelte van de totale hoeveelheid door de installatie
      opgewekte en op een net of een installatie ingevoede elektriciteit kan worden aangemerkt als WKK-elektriciteit.

      6 De netbeheerder deelt het resultaat van de vaststelling binnen vier weken na ontvangst van het verzoek, bedoeld
      in het eerste lid, mee aan de producent en aan de netbeheerder van het landelijk hoogspanningsnet.

      7 Tenzij de tariefstructuren, bedoeld in [artikel 27 van de wet][ref2], iets anders bepalen, brengt de netbeheerder
      de kosten van het vaststellen of de installatie en de meter van de producent geschikt zijn in rekening bij de
      producent.

      8 Van renovatie is sprake indien een krachtbron van een installatie, een eenheid of een gasmotor is gerenoveerd
      voor een bedrag dat tenminste de helft bedraagt van de nieuwbouwkosten van die krachtbron op het moment van
      renoveren. Indien de betreffende krachtbron niet meer leverbaar is worden de kosten van die krachtbron geïndiceerd
      met 2,35% per jaar. De kosten voor deze renovatie dienen binnen 24 kalendermaanden te zijn gemaakt.

      9 De producent verklaart de installatie te hebben gerenoveerd met gebruikmaking van het origineel van een
      ondertekend formulier en voorzien van schriftelijk bewijsmateriaal, dat is opgenomen in de bij deze regeling
      behorende [bijlage 4][ref3]. Op verzoek van de netbeheerder van het landelijk hoogspanningsnet vult de producent
      deze verklaring aan met een verklaring van een accountant.

      10 Indien de producent voornemens is een aanpassing door te voeren die een wijziging van een van de onderdelen
      2 tot en met 5 van het formulier ten gevolge heeft, dient de producent alvorens hij die aanpassing daadwerkelijk
      doorvoert, een volledig nieuw ingevuld formulier in bij de netbeheerder. Het vijfde tot en met het zevende lid zijn
      in dit geval van toepassing en de eerder verrichte vaststelling vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0015182
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0015182
