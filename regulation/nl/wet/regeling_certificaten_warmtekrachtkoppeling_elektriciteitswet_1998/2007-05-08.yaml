  - number: 6a
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet bepaalt de kooldioxide-index ten aanzien van een WKK-
      installatie met als krachtbron uitsluitend een of meerdere gasmotoren aan de hand van de waarden, opgenomen in
      de tabel die ieder kalenderjaar ten behoeve van het daaropvolgende kalenderjaar uiterlijk op 1 december door de
      Minister van Economische Zaken wordt vastgesteld en in de Staatscourant wordt gepubliceerd.

      2 De netbeheerder van het landelijk hoogspanningsnet bepaalt de kooldioxide-index ten aanzien van een WKK-
      installatie met een andere krachtbron dan uitsluitend een of meerdere gasmotoren met toepassing van de formule

      kooldioxide-index = [1 – (B * Kb – W * KRW) / (KRE * P)] * 100%,

      waarbij:

      B = de hoeveelheid verbruikte brandstof;

      Kb = de emissiefactor van de kooldioxide per eenheid ingezette brandstof, opgenomen in de bij deze regeling
      behorende [bijlage 3][ref1];

      W = de hoeveelheid opgewekte warmte in GJ;

      KRW = de emissie van kooldioxide van de referentie-installatie per geleverde GJ warmte;

      KRE = de emissie van kooldioxide van de referentie-installatie per geleverde kWh elektriciteit;

      P = de som van de hoeveelheid opgewekte WKK-elektriciteit en de hoeveelheid opgewekte en anders dan voor de
      opwekking van elektriciteit nuttig aangewende mechanische energie.

      3 Indien meerdere brandstofsoorten worden gebruikt, bepaalt de netbeheerder van het landelijk hoogspanningsnet voor
      elke brandstofsoort het product B * Kb en sommeert hij vervolgens deze uitkomsten in de formule, bedoeld in het
      tweede lid.

      4 De waarden van KRW en KRE, bedoeld in het tweede lid, worden ieder kalenderjaar ten behoeve van het
      daaropvolgende kalenderjaar uiterlijk op 1 december door de Minister van Economische Zaken vastgesteld en in de
      Staatscourant gepubliceerd.

      5 Indien de WKK-installatie uit meerdere WKK-eenheden bestaat, berekent de netbeheerder van het landelijk
      hoogspanningsnet de kooldioxide-index als het gemiddelde van de kooldioxide-indices van de afzonderlijke eenheden,
      gewogen naar de elektriciteitsproductie van elk van deze afzonderlijke eenheden.

      6 Indien de WKK-installatie uit meerdere gasmotoren bestaat, berekent de netbeheerder van het landelijk
      hoogspanningsnet de kooldioxide-index als het gemiddelde van de kooldioxide-indices van de afzonderlijke
      gasmotoren, gewogen naar het vermogen van elke van deze afzonderlijke gasmotoren.

      7 Indien toepassing van de formule, bedoeld in het tweede lid, een negatief getal oplevert, bepaalt de netbeheerder
      van het landelijk hoogspanningsnet de kooldioxide-index op nihil.

      8 De kooldioxide-index van een WKK-installatie, een eenheid of een gasmotor die voor 1 januari 1998 in gebruik
      is genomen en die niet overeenkomstig het bepaalde in [artikel 2, zesde en zevende lid][ref2], is gerenoveerd,
      bedraagt nihil.


