  - number: 1.a
    text: |-
      gegevens, welke noodzakelijk zijn voor het scheiden van verschillende in splijtstof voorkomende uraniumisotopen met
      gebruikmaking van gasultracentrifuges en welke nog niet zijn gepubliceerd;
    url: https://wetten.overheid.nl/BWBR0045254/1971-09-29#Artikel1
  - number: 1.b
    text: |-
      hulpmiddelen en materialen, welke zijn benodigd voor het scheiden van verschillende in splijtstof voorkomende
      uraniumisotopen met gebruikmaking van gasultracentrifuges en waaraan gegevens als onder a. bedoeld kunnen worden
      ontleend;
    url: https://wetten.overheid.nl/BWBR0045254/1971-09-29#Artikel1
  - number: 1.c
    text: |-
      met behulp van gegevens, hulpmiddelen en materialen als onder a. en b. bedoeld verrichte onderzoekingen en
      toegepaste werkmethoden.
    url: https://wetten.overheid.nl/BWBR0045254/1971-09-29#Artikel1
  - number: '2.1'
    text: Deze beschikking wordt in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0045254/1971-09-29#Artikel2
  - number: '2.2'
    text: Zij treedt in werking met ingang van de dag na die van haar bekendmaking.
    url: https://wetten.overheid.nl/BWBR0045254/1971-09-29#Artikel2
