preamble:
  text: |-
    Gelet op artikel 1 van het Geheimhoudingsbesluit Kernenergiewet (Stb. 1971, 420);

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0045254/1971-09-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het [Geheimhoudingsbesluit Kernenergiewet][ref1] (Stb. 1971, 420) geldt, tenzij de in
      [artikel 1, tweede lid, van dat besluit][ref2] genoemde ministers anders bepalen, ten aanzien van:

      a. gegevens, welke noodzakelijk zijn voor het scheiden van verschillende in splijtstof voorkomende uraniumisotopen
      met gebruikmaking van gasultracentrifuges en welke nog niet zijn gepubliceerd;

      b. hulpmiddelen en materialen, welke zijn benodigd voor het scheiden van verschillende in splijtstof voorkomende
      uraniumisotopen met gebruikmaking van gasultracentrifuges en waaraan gegevens als onder a. bedoeld kunnen worden
      ontleend;

      c. met behulp van gegevens, hulpmiddelen en materialen als onder a. en b. bedoeld verrichte onderzoekingen en
      toegepaste werkmethoden.


      [ref1]: https://wetten.overheid.nl/BWBR0002768
