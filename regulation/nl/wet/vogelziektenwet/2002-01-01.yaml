      1 Deze Wet kan worden aangehaald onder de titel "Vogelziektenwet".

      2 De Wet van 29 December 1922, *Staatsblad* 747, tot wering van besmettelijke pluimveeziekten wordt ingetrokken.

      3 Deze Wet treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad,* waarin zij
      is geplaatst.
