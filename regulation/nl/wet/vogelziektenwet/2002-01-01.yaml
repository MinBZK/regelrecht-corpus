    text: |-
      1 Overtreding van het bepaalde bij of krachtens deze Wet wordt gestraft met hechtenis van ten hoogste 1 jaar of
      geldboete van de eerste categorie.

      2 [Titel VI van de Veewet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001900
