preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat volgens 49 van de Veewet de algemene maatregel van bestuur van 16 Juli
    1949, Staatsblad No. J 326, houdende bepalingen tot wering en bestrijding van besmettelijke vogelziekten, behoort
    te worden vervangen door een regeling bij de Wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002056/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze Wet wordt verstaan onder:

      "Minister": Onze met de zaken van de Landbouw belaste Minister.
    url: https://wetten.overheid.nl/BWBR0002056/2002-01-01#Artikel1
  - number: '2'
    text: |-
      1 Tot wering van besmettelijke ziekten van pluimvee kan Onze Minister de in- en doorvoer verbieden of niet dan
      voorwaardelijk toestaan van:

      a. door hem aangewezen soorten vogels, alsmede eieren, vlees en andere producten, afkomstig van die vogels;

      b. andere voorwerpen, welke dragers van smetstof kunnen zijn.

      2 Het is verboden de vogels, producten en voorwerpen, waarvan de in- of doorvoer voorwaardelijk is toegestaan, in-
      of door te voeren langs andere dan de door Onze Minister, in overleg met Onze Minister van Financiën, aangewezen
      kantoren.

      3 Indien de in- of doorvoer is toegestaan onder voorwaarde van voorafgaand onderzoek, wordt voor dat onderzoek
      vergoeding van kosten geheven naar een door Onze Minister vast te stellen tarief.
    url: https://wetten.overheid.nl/BWBR0002056/2002-01-01#Artikel2
  - number: '3'
    text: |-
      1 Tot wering en bestrijding van door Onze Minister aangewezen besmettelijke ziekten van vogels zijn de
      [artikelen 9][ref1], [10][ref2], [11][ref3], [15][ref4] tot en met [32][ref5], [35][ref6] tot en met [44][ref7],
      [97][ref8] en [99 van de Veewet][ref9] en de krachtens die artikelen vastgestelde bepalingen van overeenkomstige
      toepassing.

      2 De aanwijzing ingevolge het eerste lid kan slechts geschieden, indien de ziekte een gevaar kan opleveren voor
      ernstige aantasting van de pluimveestapel.


