preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Defensie;

    Gelet op artikel 59, tweede lid, van de Politiewet 1993;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018217/2023-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. een terroristische dreiging vanuit de lucht: een civiel vliegtuig dat zich gedraagt op een zodanige wijze dat
      het vermoeden rijst dat het mogelijk gebruikt wordt als een middel voor het plegen van een terroristisch misdrijf;

      b. Master Controller: de dienstdoende Master Controller bij het Air Operations and Control Station van de
      Koninklijke Luchtmacht te Nieuw Milligen (AOCS NM);

      c. Quick Reaction Alert (QRA): twee bewapende F-16 jachtvliegtuigen van de Koninklijke Luchtmacht;

      d. Militaire bijstand: bijstand ingevolge [artikel 58 van de Politiewet 2012][ref1] voor de strafrechtelijke
      handhaving van de rechtsorde;

      e. Nationaal Actieplan (NAP): het gerubriceerde nationaal draaiboek voor de uitvoering van de militaire bijstand
      door de QRA in het kader van de bestrijding van luchtvaartterrorisme;

      f. NAVO: de Noord Atlantische Verdragsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel58
    url: https://wetten.overheid.nl/BWBR0018217/2023-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '58'
  - number: '2'
    text: |-
      In aangelegenheden waarin sprake is van een terroristische dreiging vanuit de lucht verleent de krijgsmacht
      bijstand op de wijze als bepaald in deze regeling. De Minister van Defensie stelt daartoe de QRA en het AOCS NM,
      voorzover dit station als schakel in de uitvoering van de militaire bijstand fungeert, ter beschikking aan de
      Minister van Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0018217/2023-01-01#Artikel2
  - number: '3'
    text: |-
      1 De NAVO, de Master Controller, dan wel de Minister van Justitie en Veiligheid kan een civiel vliegtuig aanmerken
      als een terroristische dreiging vanuit de lucht.

      2 Voor het aanmerken van een civiel vliegtuig als een terroristische dreiging vanuit de lucht zijn de criteria van
      de NAVO van toepassing. Deze criteria zijn opgenomen in het Nationaal Actieplan.

      3 De Minister van Justitie en Veiligheid kan ook op andere gronden een civiel vliegtuig aanmerken als een
      terroristische dreiging vanuit de lucht.

      4 Van een terroristische dreiging vanuit de lucht is in ieder geval sprake indien wordt voldaan aan ten minste twee
      van de in het tweede lid bedoelde criteria.
    url: https://wetten.overheid.nl/BWBR0018217/2023-01-01#Artikel3
  - number: '4'
    text: |-
      1 De Master Controller is uit hoofde van zijn taak ter zake van de bewaking van het luchtruim en onder
      verantwoordelijkheid van de Minister van Defensie bevoegd tot het geven van een opdracht aan de QRA:

      a. het luchtruim te kiezen;

      b. een civiel vliegtuig te naderen ten behoeve van de verificatie van informatie over dit vliegtuig;

      c. het geven van (visuele) signalen aan een civiel vliegtuig.

      2 De Master Controller alarmeert de Minister van Justitie en Veiligheid zodra de QRA het luchtruim kiest en hij
      informeert hem onverwijld en voortdurend over:

      a. de reden voor de inzet van de QRA;

      b. alle bij de Master Controller bekende informatie over het civiele vliegtuig, waaronder de positie, het type en
      de vluchtgegevens;

      c. de overeenkomstig het eerste lid verstrekte opdrachten, en

      d. alle overige bij hem bekende relevante informatie.

      3 De Master Controller informeert na de alarmering van de Minister van Justitie en Veiligheid terstond de Minister
      van Defensie.
    url: https://wetten.overheid.nl/BWBR0018217/2023-01-01#Artikel4
  - number: '5'
    text: |-
      1 Vanaf het moment dat de NAVO, de Master Controller, dan wel de Minister van Justitie en Veiligheid,
      overeenkomstig [artikel 3][ref1], een civiel vliegtuig aanmerkt als een terroristische dreiging vanuit de lucht,
      is de Minister van Justitie en Veiligheid bevoegd via de Master Controller aanwijzingen te geven aan de QRA. Alsdan
      vindt inzet van de QRA plaats onder verantwoordelijkheid van de Minister van Justitie en Veiligheid.

      2 De Minister van Justitie en Veiligheid kan via de Master Controller de QRA, naast de opdrachten genoemd in
      [artikel 4, eerste lid][ref2], met inachtneming van de beginselen van proportionaliteit en subsidiariteit, opdracht
      geven tot:

      a. het afdwingen van een koerswijziging en/of landing van het civiele vliegtuig zonder het gebruik van geweld;

      b. het lossen van een waarschuwingsschot;

      c. het geven van gericht vuur.

      3 Op de inzet van de QRA voor de bestrijding van luchtvaartterrorisme is een specifieke geweldsinstructie van
      toepassing. Deze geweldsinstructie is gerubriceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018217#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018217#Artikel4
    url: https://wetten.overheid.nl/BWBR0018217/2023-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018217
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018217
        artikel: '4'
  - number: '6'
    text: |-
      Van iedere inzet van de QRA in geval van een terroristische dreiging vanuit de lucht wordt zowel door de Minister
      van Justitie en Veiligheid als door de Minister van Defensie een verslag opgemaakt ten behoeve van een gezamenlijke
      evaluatie. Deze verslagen zijn gerubriceerd.
    url: https://wetten.overheid.nl/BWBR0018217/2023-01-01#Artikel6
  - number: '7'
    text: |-
      De additionele kosten van de inzet van de QRA onder verantwoordelijkheid van de Minister van Justitie en Veiligheid
      komen voor vergoeding in aanmerking conform de vigerende afspraken tussen de Minister van Defensie en de Minister
      van Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0018217/2023-01-01#Artikel7
  - number: 7a
    text: |-
      Deze regeling berust op [artikel 58, eerste lid, van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel58
