preamble:
  text: |-
    Gelet op de artikelen 6, vijfde lid, aanhef en onder a, en 22, eerste lid, van het Organisatie-, mandaat- en
    volmachtbesluit SZW 2004;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016349/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling en de daarop berustende bepalingen wordt verstaan onder:

      a. directie: een organisatieonderdeel van het ministerie dat ressorteert onder de plaatsvervangend secretaris-
      generaal;

      b. directeur: een functionaris die leiding geeft aan een directie.
    url: https://wetten.overheid.nl/BWBR0016349/2005-01-01#Artikel1
  - number: '2'
    text: |-
      Onder de plaatsvervangend secretaris-generaal ressorteren:

      a. de Accountantsdienst;

      b. de directie Algemene Zaken

      c. het Bureau SG;

      d. de directie Communicatie;

      e. de directie Gemeenschappelijke Organisatie Bedrijfsvoering;

      f. de directie Personeel, Organisatie en Informatie;

      g. de Sociale Inlichtingen- en Opsporingsdienst.
    url: https://wetten.overheid.nl/BWBR0016349/2005-01-01#Artikel2
  - number: '3'
    text: |-
      1 Elk van de directeuren is verantwoordelijk voor:

      a. het leiding geven aan de eigen directie;

      b. het door tussenkomst van de plaatsvervangend secretaris-generaal adviseren van de bewindspersonen ten aanzien
      van het werkterrein van de eigen directie en het attenderen van hen op politiek of maatschappelijk gevoelige
      aspecten;

      c. het coördineren van de beleidsontwikkeling en -uitvoering van de eigen directie met de beleidsontwikkeling
      en -uitvoering van de andere onderdelen van het ministerie en van andere ministeries;

      d. het zorgdragen voor een effectieve en efficiënte bedrijfsvoering, met uitzondering van de vaststelling van de
      formatie, voor periodieke evaluatie daarvan en voor planning en bewaking van de productie van de eigen directie;

      e. de personeelsaangelegenheden van de onder elk van hen ressorterende functionarissen, voor zover dit niet is
      voorbehouden aan de secretaris-generaal dan wel de plaatsvervangend secretaris-generaal;

      f. het zorgdragen voor de administratieve en financiële afhandeling van de uitvoering van de eigen
      personeelsaangelegenheden, voor zover deze niet is opgedragen aan anderen zoals de directie Personeel, Organisatie
      en Informatie, de directie Gemeenschappelijke Organisatie Bedrijfsvoering en de Stichting Pensioenfonds ABP;

      g. het op orde hebben van de administratieve organisatie en informatiebeveiliging;

      h. het formuleren en uitvoeren van jaarplannen voor de eigen directie binnen de door de secretaris-generaal en de
      plaatsvervangend secretaris-generaal vastgestelde uitgangspunten;

      i. het rapporteren aan de plaatsvervangend secretaris-generaal over de uitvoering van de jaarplannen betreffende de
      eigen directie;

      j. het, na overeenstemming daarover met de plaatsvervangend secretaris-generaal, aanwijzen van een plaatsvervangend
      directeur;

      k. het zorgdragen voor de vastlegging van de organisatie van de eigen directie en de daarbinnen geldende mandaten,
      volmachten en machtigingen in een Organisatie-, mandaat- en volmachtbesluit voor de eigen directie;

      l. de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref1] voor zover deze
      betrekking hebben op gedragingen van de onder hen ressorterende functionarissen;

      m. het dynamisch archiefbeheer van zijn directie, te weten postbehandeling, registratie, voortgang- en
      afdoeningsbewaking, dossierbeheer, informatievoorziening, selectie, vernietiging en overdracht aan de directie
      Algemene Zaken, alsmede het opstellen, vaststellen en onderhouden van het ordeningsplan van de directie.

      2 Het bepaalde in het eerste lid, onder k, is niet van toepassing op directeuren die leiding geven aan een directie
      met een omvang van maximaal 12 fulltime-equivalenten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel91
    url: https://wetten.overheid.nl/BWBR0016349/2005-01-01#Artikel3
