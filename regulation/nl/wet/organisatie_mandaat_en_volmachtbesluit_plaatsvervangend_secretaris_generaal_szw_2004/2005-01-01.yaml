        artikel: 9:1
  - number: '4'
    text: |-
      De Accountantsdienst is verantwoordelijk voor de uitvoering van de taken van de departementale Accountantsdienst
      zoals omschreven in de [Comptabiliteitswet 2001][ref1] en het [Besluit taak DAD][ref2], alsmede de daarop
      berustende regelgeving. De Accountantsdienst controleert de financiële verantwoording van de departementsonderdelen
      en de bedrijfsvoering die daaraan ten grondslag ligt. De Accountantsdienst adviseert op het gebied van financieel
      beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0013891
      [ref2]: https://wetten.overheid.nl/BWBR0007535
    url: https://wetten.overheid.nl/BWBR0016349/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013891
      - id: ref2
        bwb_id: BWBR0007535
  - number: '5'
    text: |-
      De directie Algemene Zaken is verantwoordelijk voor:

      a. het beheren en exploiteren van de Haagse vestigingen van het ministerie voorzover daarin niet uitsluitend
      organisatieonderdelen die ressorteren onder de inspecteur-generaal of het Agentschap SZW gehuisvest zijn en het
      beheren en exploiteren van de vestigingen van organisatieonderdelen die ressorteren onder de inspecteur-generaal of
      het Agentschap SZW voorzover zij gebruik maken van de departementale infrastructuur dan wel gehuisvest zijn in een
      vestiging waar ook andere onderdelen van het ministerie gehuisvest zijn, dan wel indien dit met het Agentschap SZW
      respectievelijk de inspecteur-generaal is overeengekomen;

      b. het dagelijks beheer van de technische infrastructuur en de kantoorautomatisering voor het ministerie en het
      technisch beheer van de departementsbrede en directiespecifieke applicaties, alsmede het mede voorbereiden van
      beleid en geven van advies ten aanzien van de implementatie van nieuwe ontwikkelingen en wijzigingen op genoemde
      terreinen;

      c. het vervaardigen en beschikbaar stellen van hoogwaardige postale-, grafische- en multimedia-producten en
      diensten, alsmede het project Hoogvolume;

      d. het adviseren over en het ontwikkelen en implementeren van departementaal beleid op het gebied van documentaire
      informatievoorziening en het beheren van afgesloten archieven;

      e. het beleid en advisering op het gebied van inkoop, (Europese) aanbestedingen, huisvesting, milieumanagement en
      materieel beheer;

      f. het uitvoeren van het aspect-controllerschap ten aanzien van materieel beheer;

      g. de persoonlijke beveiliging van de bewindspersonen alsmede hun huisgenoten.
    url: https://wetten.overheid.nl/BWBR0016349/2005-01-01#Artikel5
  - number: '6'
    text: |-
      1 Het Bureau SG is verantwoordelijk voor de inhoudelijke, logistieke en secretariële ondersteuning van de
      secretaris-generaal en de plaatsvervangend secretaris-generaal.

      2 Het Bureau SG draagt zorg voor de directe secretariële, logistieke en protocollaire ondersteuning van de
      bewindspersonen.
    url: https://wetten.overheid.nl/BWBR0016349/2005-01-01#Artikel6
  - number: '7'
    text: |-
      De directie Communicatie is verantwoordelijk voor het ontwikkelen van het departementale voorlichtingsbeleid, het
      geven van voorlichting aan publiek en pers en het beschikbaar stellen van documentaire informatie. De directie
      ondersteunt de bewindspersonen en de directies op het gebied van publiciteit en externe optredens en adviseert de
      beleidsdirecties over de wijze waarop het beleid kan worden gecommuniceerd met de voor hen relevante doelgroepen.
      De directie draagt zorg voor de ontwikkeling en inbedding van webtechnologie binnen het ministerie conform de
      departementale standaards.
    url: https://wetten.overheid.nl/BWBR0016349/2005-01-01#Artikel7
  - number: '8'
    text: |-
      De directie Gemeenschappelijke Organisatie Bedrijfsvoering is verantwoordelijk voor een efficiënte en kwalitatief
      goede uitvoering van ondersteunende taken en werkzaamheden op de volgende gebieden:

      a. personeelsbeheer en -administratie;

      b. departementale salarisadministratie;

      c. documentaire informatievoorziening en archivering;

      d. registratie en afhandeling van verplichtingen

      e. kasbeheer en financiële administratie

      f. functioneel beheer van departementale bedrijfsvoeringssystemen.
    url: https://wetten.overheid.nl/BWBR0016349/2005-01-01#Artikel8
  - number: '9'
    text: |-
      1 De directie Personeel, Organisatie en Informatie is verantwoordelijk voor het adviseren van de secretaris-
      generaal, de plaatsvervangend secretaris-generaal, de inspecteur-generaal en de directeuren-generaal over
      het personeels-, organisatie-, informatie- en informatiseringsbeleid, alsmede beleid op het gebied van
      rechtspositionele aangelegenheden van (ex-)medewerkers van het ministerie, arbeidsomstandigheden, bedrijfsvoering,
      planning en control op de personele-, informatieve- en organisatorische processen, administratieve organisatie,
      informatiebeveiliging en medezeggenschap.

      2 De directie draagt zorg voor het adviseren van organisatieonderdelen bij de implementatie van departementaal
      beleid op bovengenoemde terreinen, alsmede het adviseren over en het leveren van projectleiding ten behoeve van
      directiespecifieke veranderingstrajecten.

      3 De directie draagt zorg voor het adviseren respectievelijk ondersteunen van medewerkers over loopbaanontwikkeling
      respectievelijk op het terrein van bedrijfsmaatschappelijk werk.

      4 De directie draagt zorg voor de ondersteuning en het voeren van het secretariaat van de medezeggenschap en het
      georganiseerd overleg, alsmede het adviseren van de bestuurders op genoemde terreinen.

      5 De directie draagt zorg voor het behandelen van bezwaarschriften, beroepschriften en zaken van de Nationale
      ombudsman van (ex-)medewerkers van het ministerie inzake aangelegenheden verband houdend met de dienstbetrekking,
      met uitzondering van het nemen van beslissingen in bezwaar- en beroepsprocedures.

      6 De directeur Personeel, Organisatie en Informatie, is onverminderd het bepaalde in
      [artikel 3, eerste lid, onder l][ref1], verantwoordelijk voor de behandeling van klachten over de wijze waarop de
      bemiddelingsorganisatie, bedoeld in artikel 1, onderdeel f, van de Regeling Kinderopvang SZW, uitvoering geeft aan
      de Regeling Kinderopvang SZW.

      7 De directeur Personeel, Organisatie en Informatie is verantwoordelijk voor het ontwikkelen van beleid op het
      gebied van de personele informatievoorziening.

      8 De directeur Personeel, Organisatie en Informatie is verantwoordelijk voor het ontwikkelen en uitvoeren
      van ministerie brede opleidings- en leerprojecten, waaraan naast de medewerkers van het ministerie ook andere
      belanghebbenden kunnen deelnemen.

      9 De directeur Personeel, Organisatie en Informatievoorziening draagt zorg voor de advisering van de
      plaatsvervangend secretaris-generaal over de verdeling van de middelen uit de begroting voor ICT.


