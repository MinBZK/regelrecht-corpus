  - number: '12'
    text: |-
      1 De directeur Algemene Zaken is gevolmachtigd tot het aangaan van overeenkomsten met betrekking tot:

      a. zowel hard- als software van de ICT infrastructuur, zoals netwerkcomponenten, cliënts en servers, de
      kantoorautomatiseringssoftware, databases en de communicatievoorzieningen, alsmede het technisch beheer daarvan;

      b. de huisvesting en facilitaire voorzieningen ten behoeve van de Haagse vestigingen van het ministerie;

      c. de facilitaire dienstverlening die het project Hoogvolume ten behoeve van het Ministerie van Sociale Zaken en
      Werkgelegenheid, het Ministerie van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, het Ministerie van
      Volksgezondheid, Welzijn en Sport verricht.

      2 De directeur Communicatie is gevolmachtigd tot het aangaan van overeenkomsten met betrekking tot:

      a. de organisatie van voorlichtings- en informatiecampagnes en de productie en distributie van
      voorlichtingsmateriaal;

      b. systeemontwikkeling, licenties, functioneel beheer en onderhoud van applicaties van voorlichtings- en
      documentatiesystemen;

      c. externe advisering in het kader van voorlichtingsprojecten.

      3 De directeur Gemeenschappelijke Organisatie Bedrijfsvoering is gevolmachtigdtothet aangaan van overeenkomsten
      met betrekking tot personeelsbeheerssystemen, salarissystemen en systemen voor documentregistratie en
      -verwerking, voorzover deze noodzakelijk zijn voor een goede uitvoering van de taken en werkzaamheden bedoeld in
      [artikel 8][ref1], alsmede met betrekking tot systeemontwikkeling, licenties, functioneel beheer en onderhoud van
      applicaties van departementale financiële informatiesystemen.

      4 De directeur Personeel, Organisatie en Informatie is gevolmachtigd tot het aangaan van overeenkomsten met
      betrekking tot:

      a. departementsbrede informatievoorziening, waaronder informatiebeveiliging, wet bescherming persoonsgegevens,
      bepalen van standaards en mantelcontracten;

      b. de Landsadvocaat inzake advisering en procureurstelling alsmede het instellen van gerechtelijke procedures met
      betrekking tot beroepschriften van (ex-)medewerkers van het ministerie inzake aangelegenheden verband houdende met
      de dienstbetrekking;

      c. de arbodienst, het centraal flankerend beleid ten behoeve van herplaatsers en de opvang van kinderen van
      medewerkers van het ministerie.


