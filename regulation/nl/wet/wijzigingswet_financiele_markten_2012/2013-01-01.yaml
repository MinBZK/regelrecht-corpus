        artikel: '20'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: IX.K
    text: |-
      Op een bestuurlijke boete die is opgelegd op grond van
      [artikel 21, eerste lid, van de Wet inzake de geldtransactiekantoren][ref1] in verband met het uitvoeren van een
      geldtransactie als bedoeld in [artikel 1, onderdeel c, van die wet][ref2] voor het tijdstip van inwerkingtreding
      van deze wet, blijft het recht van toepassing dat gold voor dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0013816#Artikel1
    url: https://wetten.overheid.nl/BWBR0030840/2013-01-01#ArtikelIX
