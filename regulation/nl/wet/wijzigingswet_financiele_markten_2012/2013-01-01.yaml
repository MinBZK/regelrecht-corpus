  - number: IX.D.2
    text: |-
      Op het opleggen van de bestuurlijke boete, bedoeld in het eerste lid, blijft het recht van toepassing dat gold voor
      het tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0030840/2013-01-01#ArtikelIX
  - number: IX.E.1
    text: |-
      De Nederlandsche Bank N.V. kan een na het tijdstip van inwerkingtreding van deze wet genomen besluit
      tot het opleggen van een bestuurlijke boete ter zake van overtreding van een voorschrift, gesteld bij of
      krachtens de [artikelen 2, vierde, vijfde of zesde lid][ref1], [3, eerste lid][ref2], [4, derde lid][ref3],
      [5, derde lid][ref4], [8, derde en vijfde lid][ref5], [9][ref6], [10][ref7], [11][ref8], of
      [15, tweede en derde lid, van de Wet inzake de geldtransactiekantoren][ref9], zoals die bepalingen luidden op het
      tijdstip van inwerkingtreding van deze wet, na bekendmaking openbaar maken.


