preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de Wet op het financieel toezicht te wijzigen
    teneinde regels te stellen in verband met de intrekking van de Wet inzake de geldtransactiekantoren, het laten
    vervallen van het verbod op het dekken van oorlogsmolest in het buitenland voor schadeverzekeraars en het wijzigen
    van de biedingsregels alsmede technische verbeteringen en enige andere wijzigingen in de Wet op het financieel
    toezicht en andere wetgeving op het terrein van de financiële markten aan te brengen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030840/2013-01-01#ArtikelAanhef
articles:
  - number: VIII
    text: |-
      De [Wet inzake de geldtransactiekantoren][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0013816
    url: https://wetten.overheid.nl/BWBR0030840/2013-01-01#ArtikelVIII
    references:
