      [artikel 4, eerste lid, van de Wet inzake de geldtransactiekantoren][ref1], wordt vanaf
      het tijdstip van inwerkingtreding van deze wet aangemerkt als ontheffing als bedoeld in
      [artikel 2:54i, derde lid, van de Wet op het financieel toezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel4
