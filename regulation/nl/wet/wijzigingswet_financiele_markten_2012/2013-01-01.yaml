        artikel: '1'
  - number: IX.J
    text: |-
      Een last onder dwangsom die is opgelegd op grond van
      [artikel 20, eerste lid, van de Wet inzake de geldtransactiekantoren][ref1] ter zake van overtreding
      van voorschriften gesteld bij of krachtens de in dat lid genoemde artikelen, wordt vanaf het
      tijdstip van inwerkingtreding van deze wet aangemerkt als een last onder dwangsom als bedoeld in
      [artikel 1:79 van de Wet op het financieel toezicht][ref2], strekkende tot naleving van daarmee overeenkomende
      voorschriften in laatstgenoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0030840/2013-01-01#ArtikelIX
