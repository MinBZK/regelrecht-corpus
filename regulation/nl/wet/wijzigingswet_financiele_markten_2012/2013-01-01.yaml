  - number: IX.F
    text: |-
      Een verzoek om inschrijving in het register, bedoeld in
      [artikel 2, eerste lid, van de Wet inzake de geldtransactiekantoren][ref1], waarop bij inwerkingtreding van
      deze wet nog niet onherroepelijk is beslist, wordt aangemerkt als een aanvraag van een vergunning als bedoeld in
      [artikel 2:54i, eerste lid, van de Wet op het financieel toezicht][ref2].


