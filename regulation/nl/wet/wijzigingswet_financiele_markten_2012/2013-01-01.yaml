  - number: IX.A
    text: |-
      De natuurlijke persoon, rechtspersoon of vennootschap die in de uitoefening van zijn bedrijf geldtransacties
      als bedoeld in [artikel 1, onderdeel c, van de Wet inzake de geldtransactiekantoren][ref1] uitvoert
      en die op het tijdstip van inwerkingtreding van deze wet is ingeschreven in het register, bedoeld in
      [artikel 2, eerste lid, van de Wet inzake de geldtransactiekantoren][ref2], wordt vanaf dat tijdstip
      voor het verrichten van met die geldtransacties overeenkomende wisseltransacties overeenkomstig
      de [Wet op het financieel toezicht][ref3] geacht te beschikken over een vergunning als bedoeld in
      [artikel 2:54i, eerste lid, van laatstgenoemde wet][ref4], indien de persoon of vennootschap is gevestigd in
      Nederland danwel een vergunning als bedoeld in [artikel 2:54l van die wet][ref5], indien deze zijn of haar zetel
      heeft buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013816#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368
