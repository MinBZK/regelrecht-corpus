  - number: IX.I
    text: |-
      Een aanwijzing die is gegeven op grond van [artikel 10 van de Wet inzake de geldtransactiekantoren][ref1] tot het
      volgen van een in dat artikel bedoelde gedragslijn, wordt vanaf het tijdstip van inwerkingtreding van deze wet
      aangemerkt als een aanwijzing als bedoeld in [artikel 1:75 van de Wet op het financieel toezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0030840/2013-01-01#ArtikelIX
