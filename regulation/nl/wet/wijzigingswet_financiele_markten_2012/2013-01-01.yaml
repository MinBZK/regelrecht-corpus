      [Wet inzake de geldtransactiekantoren][ref1] genomen besluit, wordt op het beroep beslist met toepassing van het
      voor dat tijdstip geldende recht.


      [ref1]: https://wetten.overheid.nl/BWBR0013816
    url: https://wetten.overheid.nl/BWBR0030840/2013-01-01#ArtikelIX
