  - number: IX.C
    text: |-
      Met het toezicht op de naleving van de regels gesteld bij of krachtens de
      [Wet inzake de geldtransactiekantoren][ref1], zoals deze luidden op het tijdstip van inwerkingtreding van deze wet,
      zijn belast de personen die ingevolge [artikel 1:72 van de Wet op het financieel toezicht][ref2] zijn belast met
      het toezicht op de naleving van [laatstgenoemde wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013816
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
