preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de Wet op het financieel toezicht te wijzigen
    teneinde regels te stellen in verband met de intrekking van de Wet inzake de geldtransactiekantoren, het laten
    vervallen van het verbod op het dekken van oorlogsmolest in het buitenland voor schadeverzekeraars en het wijzigen
    van de biedingsregels alsmede technische verbeteringen en enige andere wijzigingen in de Wet op het financieel
    toezicht en andere wetgeving op het terrein van de financiële markten aan te brengen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030840/2013-01-01#ArtikelAanhef
articles:
  - number: VIII
    text: |-
      De [Wet inzake de geldtransactiekantoren][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0013816
    url: https://wetten.overheid.nl/BWBR0030840/2013-01-01#ArtikelVIII
    references:
      - id: ref1
        bwb_id: BWBR0013816
  - number: IX
    text: |-
      A De natuurlijke persoon, rechtspersoon of vennootschap die in de uitoefening van zijn bedrijf
      geldtransacties als bedoeld in [artikel 1, onderdeel c, van de Wet inzake de geldtransactiekantoren][ref1]
      uitvoert en die op het tijdstip van inwerkingtreding van deze wet is ingeschreven in het register,
      bedoeld in [artikel 2, eerste lid, van de Wet inzake de geldtransactiekantoren][ref2], wordt vanaf dat
      tijdstip voor het verrichten van met die geldtransacties overeenkomende wisseltransacties overeenkomstig
      de [Wet op het financieel toezicht][ref3] geacht te beschikken over een vergunning als bedoeld in
      [artikel 2:54i, eerste lid, van laatstgenoemde wet][ref4], indien de persoon of vennootschap is gevestigd in
      Nederland danwel een vergunning als bedoeld in [artikel 2:54l van die wet][ref5], indien deze zijn of haar zetel
      heeft buiten Nederland.

      B De kosten van werkzaamheden die op grond van [artikel 1:40 van de Wet op het financieel toezicht][ref6]
      in rekening worden gebracht, kunnen mede betrekking hebben op de werkzaamheden die zijn
      verricht in verband met het toezicht op het uitvoeren van geldtransacties als bedoeld in
      [artikel 1, onderdeel c, van de Wet inzake de geldtransactiekantoren][ref7] door geldtransactiekantoren als bedoeld
      in [artikel 7, tweede lid, van die wet][ref8]. Onder toepassing van de bedragen die direct voorafgaande aan het
      tijdstip van deze wet golden op grond van de [Wet inzake de geldtransactiekantoren][ref9], brengt de in artikel
      1:40 van de Wet op het financieel toezicht bedoelde toezichthouder de hier bedoelde kosten in rekening bij de
      geldtransactiekantoren ten aanzien waarvan die werkzaamheden zijn verricht, voor zover deze kosten niet ten laste
      komen van de Rijksbegroting.

      C Met het toezicht op de naleving van de regels gesteld bij of krachtens de
      [Wet inzake de geldtransactiekantoren][ref10], zoals deze luidden op het tijdstip van inwerkingtreding van deze
      wet, zijn belast de personen die ingevolge [artikel 1:72 van de Wet op het financieel toezicht][ref11] zijn belast
      met het toezicht op de naleving van [laatstgenoemde wet][ref12].

      D 1. De Nederlandsche Bank N.V. kan na inwerkingtreding van deze wet tot vijf jaren na de dag waarop de
      overtreding is begaan een bestuurlijke boete opleggen ter zake van overtreding van een voorschrift, gesteld bij
      of krachtens de [artikelen 2, vierde, vijfde of zesde lid][ref13], [3, eerste lid][ref14], [4, derde lid][ref15],
      [5, derde lid][ref16], [8, derde en vijfde lid][ref17], [9][ref18], [10][ref19], [11][ref20], of
      [15, tweede en derde lid, van de Wet inzake de geldtransactiekantoren][ref21], zoals die bepalingen luidden op het
      tijdstip van inwerkingtreding van deze wet.

      2. Op het opleggen van de bestuurlijke boete, bedoeld in het eerste lid, blijft het recht van toepassing dat gold
      voor het tijdstip van inwerkingtreding van deze wet.

      E 1. De Nederlandsche Bank N.V. kan een na het tijdstip van inwerkingtreding van deze wet genomen besluit
      tot het opleggen van een bestuurlijke boete ter zake van overtreding van een voorschrift, gesteld bij of
      krachtens de [artikelen 2, vierde, vijfde of zesde lid][ref22], [3, eerste lid][ref23], [4, derde lid][ref24],
      [5, derde lid][ref25], [8, derde en vijfde lid][ref26], [9][ref27], [10][ref28], [11][ref29], of
      [15, tweede en derde lid, van de Wet inzake de geldtransactiekantoren][ref30], zoals die bepalingen luidden op het
      tijdstip van inwerkingtreding van deze wet, na bekendmaking openbaar maken.

      2. Op de openbaarmaking, bedoeld in het eerste lid, blijft het recht van toepassing dat gold voor het tijdstip van
      inwerkingtreding van deze wet.

      F Een verzoek om inschrijving in het register, bedoeld in
      [artikel 2, eerste lid, van de Wet inzake de geldtransactiekantoren][ref31], waarop bij inwerkingtreding van
      deze wet nog niet onherroepelijk is beslist, wordt aangemerkt als een aanvraag van een vergunning als bedoeld in
      [artikel 2:54i, eerste lid, van de Wet op het financieel toezicht][ref32].

      G Een verzoek om ontheffing van het verbod, bedoeld in
      [artikel 3, eerste lid, van de Wet inzake de geldtransactiekantoren][ref33] waarop bij inwerkingtreding van deze
      wet nog niet onherroepelijk is beslist, wordt aangemerkt als een verzoek om ontheffing van het verbod, bedoeld in
      [artikel 2:54i, eerste lid, van de Wet op het financieel toezicht][ref34].

      H Een ontheffing die is verleend op grond van
      [artikel 4, eerste lid, van de Wet inzake de geldtransactiekantoren][ref35], wordt vanaf
      het tijdstip van inwerkingtreding van deze wet aangemerkt als ontheffing als bedoeld in
      [artikel 2:54i, derde lid, van de Wet op het financieel toezicht][ref36].

      I Een aanwijzing die is gegeven op grond van [artikel 10 van de Wet inzake de geldtransactiekantoren][ref37] tot
      het volgen van een in dat artikel bedoelde gedragslijn, wordt vanaf het tijdstip van inwerkingtreding van deze wet
      aangemerkt als een aanwijzing als bedoeld in [artikel 1:75 van de Wet op het financieel toezicht][ref38].

      J Een last onder dwangsom die is opgelegd op grond van
      [artikel 20, eerste lid, van de Wet inzake de geldtransactiekantoren][ref39] ter zake van overtreding
      van voorschriften gesteld bij of krachtens de in dat lid genoemde artikelen, wordt vanaf het
      tijdstip van inwerkingtreding van deze wet aangemerkt als een last onder dwangsom als bedoeld in
      [artikel 1:79 van de Wet op het financieel toezicht][ref40], strekkende tot naleving van daarmee overeenkomende
      voorschriften in laatstgenoemde wet.

      K Op een bestuurlijke boete die is opgelegd op grond van
      [artikel 21, eerste lid, van de Wet inzake de geldtransactiekantoren][ref41] in verband met het uitvoeren van een
      geldtransactie als bedoeld in [artikel 1, onderdeel c, van die wet][ref42] voor het tijdstip van inwerkingtreding
      van deze wet, blijft het recht van toepassing dat gold voor dat tijdstip.

      L Indien voor het tijdstip van inwerkingtreding van deze wet beroep is ingesteld tegen een op grond van de
      [Wet inzake de geldtransactiekantoren][ref43] genomen besluit, wordt op het beroep beslist met toepassing van het
      voor dat tijdstip geldende recht.

      M Vanaf het tijdstip van inwerkingtreding van deze wet is
      [afdeling 1.5.1 van de Wet op het financieel toezicht][ref44] van overeenkomstige toepassing op gegevens en
      inlichtingen die zijn verstrekt of verkregen ingevolge de [Wet inzake de geldtransactiekantoren][ref45].


