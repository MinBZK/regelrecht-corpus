  - number: IX.B
    text: |-
      De kosten van werkzaamheden die op grond van [artikel 1:40 van de Wet op het financieel toezicht][ref1]
      in rekening worden gebracht, kunnen mede betrekking hebben op de werkzaamheden die zijn
      verricht in verband met het toezicht op het uitvoeren van geldtransacties als bedoeld in
      [artikel 1, onderdeel c, van de Wet inzake de geldtransactiekantoren][ref2] door geldtransactiekantoren als bedoeld
      in [artikel 7, tweede lid, van die wet][ref3]. Onder toepassing van de bedragen die direct voorafgaande aan het
      tijdstip van deze wet golden op grond van de [Wet inzake de geldtransactiekantoren][ref4], brengt de in artikel
      1:40 van de Wet op het financieel toezicht bedoelde toezichthouder de hier bedoelde kosten in rekening bij de
      geldtransactiekantoren ten aanzien waarvan die werkzaamheden zijn verricht, voor zover deze kosten niet ten laste
      komen van de Rijksbegroting.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013816#Artikel1
