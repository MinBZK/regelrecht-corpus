  - number: IX.G
    text: |-
      Een verzoek om ontheffing van het verbod, bedoeld in
      [artikel 3, eerste lid, van de Wet inzake de geldtransactiekantoren][ref1] waarop bij inwerkingtreding van deze
      wet nog niet onherroepelijk is beslist, wordt aangemerkt als een verzoek om ontheffing van het verbod, bedoeld in
      [artikel 2:54i, eerste lid, van de Wet op het financieel toezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
