  - number: 10l
    text: |-
      1 Onze Minister kan een afnemer op diens verzoek ontheffing verlenen van het verbod, bedoeld in
      [artikel 10g, eerste lid][ref1], gedurende een in de ontheffing te bepalen periode, voor zover verlenging
      noodzakelijk is vanwege omstandigheden die niet zijn toe te rekenen aan de afnemer of redelijkerwijs niet door hem
      hadden kunnen worden voorzien of voorkomen.

      2 Onze Minister kan een afnemer die op grond van [artikel 10g, tweede lid][ref2], heeft gemeld dat diens
      aansluiting afgesloten dient te worden, op diens verzoek ontheffing verlenen van het verbod, bedoeld in
      artikel 10g, eerste lid, gedurende een in de ontheffing te bepalen periode, voor zover verlenging voor die
      periode noodzakelijk is om tot een stabiel verbruik van energie uit een andere bron dan gas afkomstig uit het
      gastransportnet te komen.

      3 Onze Minister kan een afnemer een ontheffing verlenen van het verbod, bedoeld in [artikel 10f, eerste lid][ref3],
      voor zover dit nodig is om de leveringszekerheid van gas, warmte of elektriciteit te borgen.

      4 Aan een ontheffing kunnen voorschriften en beperkingen worden verbonden, die mede betrekking kunnen hebben op de
      maximale toegestane hoeveelheid laagcalorisch gas die per gasjaar of gedurende de periode waarvoor de ontheffing is
      verleend door de afnemer aan het gastransportnet mag worden onttrokken.

      5 Het is verboden in strijd te handelen met aan een ontheffing verbonden voorschriften en beperkingen.

      6 Onze Minister kan een ontheffing intrekken indien:

      a. niet langer wordt voldaan aan de gronden voor verlening van een ontheffing;

      b. degene aan wie de ontheffing is verleend in strijd handelt met een aan de ontheffing verbonden voorschrift of
      beperking;

      c. onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een
      andere beschikking zou hebben geleid;

      7 Onze Minister stuurt een afschrift van een op grond van dit artikel genomen besluit tot verlening of intrekking
      van een ontheffing aan de Autoriteit Consument en Markt en aan de netbeheerder van het landelijk gastransportnet.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10g
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10g
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel10f
