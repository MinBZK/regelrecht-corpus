      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 De [artikelen 14, derde tot en met zesde lid][ref1], treden in werking met ingang van 1 juli 2004.

      3 De [artikelen 43 tot en met 49][ref2] treden in werking met ingang van het tijdstip waarop [hoofdstuk 3][ref3]
      vervalt, dan wel op een eerder, bij koninklijk besluit te bepalen tijdstip.


