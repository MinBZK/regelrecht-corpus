  - number: 10n
    text: |-
      1 De netbeheerder van het landelijk gastransportnet vermeldt in de rapportage, bedoeld in
      [artikel 10a, dertiende lid][ref1], in elk geval:

      a. de voortgang van de uitvoering van de taak, bedoeld in [artikel 10i][ref2], in relatie tot de geldende
      planning;

      b. in hoeverre het onttrekken van laagcalorisch gas aan het gastransportnet door een afnemer als bedoeld in
      [artikel 10g, eerste lid][ref3], via diens aansluiting is beëindigd.

      2 Onze Minister verstrekt de informatie, bedoeld in het eerste lid, binnen vier weken na ontvangst daarvan aan de
      Autoriteit Consument en Markt.

      3 De netbeheerder van het landelijk gastransportnet informeert de Autoriteit Consument en Markt binnen vier weken
      na inwerkingtreding van dit artikel welke afnemers in de gasjaren 2016/2017, 2017/2018 en 2018/2019 in ten minste
      twee van die gasjaren meer dan 100 miljoen m3 (n) gas hebben onttrokken via diens aansluiting die verbonden is
      met dat deel van het gastransportnet waarmee laagcalorisch gas wordt getransporteerd, en verstrekt daarbij tevens
      informatie over de hoeveelheid gas dat per betrokken aansluiting in de hiervoor genoemde gasjaren is onttrokken.

      4 De netbeheerder van het landelijk gastransportnet verstrekt de Autoriteit Consument en Markt desgevraagd
      informatie over de hoeveelheid gas die een afnemer als bedoeld in het derde lid, via diens aansluiting heeft
      onttrokken aan dat deel van het landelijk gastransportnet waarmee laagcalorisch gas wordt getransporteerd.

      5 De netbeheerders informeren de Autoriteit Consument en Markt binnen vier weken na afloop van een gasjaar welke
      afnemers in het voorgaande gasjaar meer dan 100 miljoen m3(n) gas hebben onttrokken aan het gastransportnet waarmee
      laagcalorisch gas wordt getransporteerd, of, voor zover van toepassing, dat geen enkele afnemer in dat gasjaar meer
      dan 100 miljoen m3(n) gas heeft onttrokken aan het gastransportnet waarmee laagcalorisch gas wordt getransporteerd.

      6 Indien een netbeheerder in een gasjaar op grond van artikel 10, zesde lid, onderdeel b, een aansluiting heeft
      gerealiseerd waarmee installaties van gas worden voorzien waarvan hij vermoedt dat die behoren tot eenzelfde
      onderneming of instelling, die onderling technische, organisatorische of functionele bindingen hebben en in
      elkaars onmiddellijke nabijheid zijn gelegen, en die al door hem van een aansluiting op het gastransportnet waarmee
      laagcalorisch gas wordt getransporteerd zijn voorzien, informeert hij de Autoriteit Consument en Markt binnen vier
      weken na afloop van dat gasjaar over het realiseren van die aansluiting en de locatie daarvan. De netbeheerder
      verstrekt daarbij tevens informatie over de betrokken afnemer of afnemers en de hoeveelheid gas die in dat
      voorafgaande gasjaar door middel van elke afzonderlijke aansluiting op het gastransportnet waarmee laagcalorisch
      gas wordt getransporteerd, is onttrokken.

      7 Indien een netbeheerder in een gasjaar op grond van [artikel 10, zesde lid, onderdeel b][ref4], een aansluiting
      heeft gerealiseerd waarmee installaties van gas worden voorzien, waarvan hij vermoedt dat die behoren tot eenzelfde
      onderneming of instelling, die onderling technische, organisatorische of functionele bindingen hebben en in elkaars
      onmiddellijke nabijheid zijn gelegen, en al door een andere netbeheerder van een aansluiting op het gastransportnet
      waarmee laagcalorisch gas wordt getransporteerd zijn voorzien, informeert hij die andere netbeheerder en de
      Autoriteit Consument en Markt over dit vermoeden. Op verzoek van de Autoriteit Consument en Markt verstrekken beide
      netbeheerders de informatie, bedoeld in het zesde lid.


