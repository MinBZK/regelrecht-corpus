  - number: 66a
    text: |-
      Indien dat noodzakelijk is in het belang van een voldoende transparante en liquide markt voor vraag en aanbod van
      gas, transportcapaciteit, opslagcapaciteit of productiecapaciteit of in het belang van de daarmee verband houdende
      leveringszekerheid, zullen bij of krachtens algemene maatregel van bestuur regels worden gesteld over:

      a. de wijze waarop of de voorwaarden waaronder producenten, gasopslagbedrijven, LNG-bedrijven, handelaren,
      leveranciers of netbeheerders gas, transportcapaciteit, opslagcapaciteit of productiecapaciteit waarover zij
      beschikken, aanbieden;

      b. de informatie die producenten, gasopslagbedrijven, LNG-bedrijven, handelaren, leveranciers of netbeheerders
      verstrekken met betrekking tot de vraag en aanbod van gas, transportcapaciteit, opslagcapaciteit of
      productiecapaciteit.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel66a
  - number: 66b
    text: |-
      1 Onze Minister wijst een of meer rechtspersonen aan die tot taak hebben een beurs tot stand te brengen en in stand
      te houden. Onze Minister kan regels stellen met betrekking tot de procedure voor aanwijzing van een beurs. Aan een
      aanwijzing kunnen voorschriften en beperkingen worden verbonden.

      2 Een rechtspersoon, bedoeld in het eerste lid, stelt een beursreglement op. Het beursreglement behoeft de
      goedkeuring van Onze Minister. Van het besluit tot goedkeuring wordt mededeling gedaan in de Staatscourant.

      3 De netbeheerder van het landelijk gastransportnet is verplicht aan de rechtspersoon, bedoeld in het eerste lid,
      en aan de door deze rechtspersoon ingeschakelde derden, voor zover het betreft de afhandeling van de op de beurs
      op tot stand gekomen overeenkomsten, de gevraagde medewerking te verlenen, voor zover deze medewerking noodzakelijk
      is voor een goede uitvoering van de aan deze rechtspersoon opgelegde taak. Onze Minister kan nadere regels stellen
      over de door de netbeheerder van het landelijk gastransportnet te verlenen medewerking.

      4 De rechtspersoon, bedoeld in het eerste lid, die bij de uitvoering van zijn taak de beschikking krijgt
      over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot
      geheimhouding van die gegevens, behoudens voor zover de artikelen van deze wet hem tot mededeling verplichten of
      uit zijn taak de noodzaak tot mededeling voortvloeit.

      5 Producenten, leveranciers, handelaren, gasopslagbedrijven, LNG-bedrijven, afnemers en aandeelhouders onthouden
      zich van elke bemoeiing met de uitvoering van de taak die is opgedragen aan de rechtspersoon, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel66b
  - number: 66c
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de voorwaarden die leveranciers hanteren ten opzichte
      van vergunninghouders. Deze regels kunnen betrekking hebben op de zekerheden die worden gevraagd voor de levering
      van gas aan vergunninghouders.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel66c
  - number: 66d
    text: |-
      1 Indien een verkoper van gas een overeenkomst aan een koper van gas aanbiedt met betrekking tot gas, niet zijnde
      op het gastransportnet in te voeden gas:

      a. worden de overname van de programmaverantwoordelijkheid en de verkoop van gas separaat aangeboden;

      b. is het de verkoper van gas niet toegestaan te eisen dat de koper van gas de programmaverantwoordelijkheid
      overdraagt;

      c. is het de verkoper van gas niet toegestaan tarieven en voorwaarden te stellen waardoor het aannemelijk is dat de
      koper van gas, gelet op de voorwaarden en tarieven waaronder de koper van gas een overeenkomst zou kunnen sluiten
      zonder de programmaverantwoordelijkheid over te dragen, zal kiezen de programmaverantwoordelijkheid aan de verkoper
      van gas over te dragen.

      2 Het eerste lid, onderdeel b, is niet van toepassing indien de koper van gas met de verkoper van gas is
      overeengekomen dat de hoeveelheid te kopen gas bepaald wordt door de feitelijke onttrekking van gas aan het
      gastransportnet op één of meer aansluitingen.

      3 Indien een koper van gas een overeenkomst aan een verkoper van gas aanbiedt met betrekking tot op het
      gastransportnet in te voeden gas:

      a. worden de overname van de programmaverantwoordelijkheid en de koop van gas separaat aangeboden;

      b. is het de koper van gas niet toegestaan te eisen dat de verkoper van gas de programmaverantwoordelijkheid
      overdraagt;

      c. is het de koper van gas niet toegestaan tarieven en voorwaarden te hanteren waardoor het aannemelijk is dat de
      verkoper van gas, gelet op de voorwaarden en tarieven waaronder de verkoper van gas een overeenkomst zou kunnen
      sluiten zonder de programmaverantwoordelijkheid over te dragen, zal kiezen de programmaverantwoordelijkheid aan de
      koper van gas over te dragen.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel66d
  - number: 66e
    text: |-
      1 Iedere wijziging met betrekking tot zeggenschap als bedoeld in [artikel 26 van de Mededingingswet][ref1] in
      een LNG-installatie of een LNG-bedrijf wordt door één van de bij de wijziging betrokken partijen gemeld aan Onze
      Minister.

      2 Onze Minister kan op grond van overwegingen van openbare veiligheid, voorzieningszekerheid
      of leveringszekerheid de wijziging, bedoeld in het eerste lid, verbieden of voorschriften hieraan verbinden.

      3 Rechtshandelingen verricht in strijd met het eerste lid zijn door een rechtelijke uitspraak vernietigbaar.

      4 Bij ministeriële regeling worden regels gesteld met betrekking tot de melding, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel26
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel66e
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '26'
  - number: 66f
    text: |-
      1

      Iedere producent van gas en verbruiker van gas heeft daadwerkelijke keuzevrijheid van leverancier.

      2 Het eerste lid is van overeenkomstige toepassing op eenieder die voornemens is gas te produceren of te verbruiken
      en die verzoekt om een aansluiting op een gastransportnet.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel66f
  - number: 66g
    text: |-
      1 De Autoriteit Consument en Markt verwerkt een registratie als bedoeld in artikel 9, eerste lid, van verordening
      1227/2011 zo spoedig mogelijk.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de registratie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel66g
  - number: 66h
    text: |-
      1 Het is verboden te handelen in strijd met de artikelen 3, 4 en 5 van verordening 1227/2011.

      2 Overtreding van het eerste lid is een misdrijf.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel66h
  - number: 66i
    text: |-
      1 Onze Minister is belast met het uitgeven en innemen via een elektronisch systeem van garanties van oorsprong voor
      gas uit hernieuwbare bronnen.

      2 Onze Minister opent op aanvraag van een in Nederland gevestigde producent, leverancier, handelaar,
      afnemer of de Nederlandse emissieautoriteit, bedoeld in [artikel 2.1 van de Wet milieubeheer][ref1],
      een rekening. Bij deze aanvraag overlegt de producent het resultaat van de vaststelling, bedoeld in
      [artikel 10, vijfde lid, onderdeel c][ref2].

      3 Onze Minister boekt op aanvraag garanties van oorsprong voor gas uit hernieuwbare bronnen op een daarbij
      aangegeven rekening, indien een in Nederland gevestigde producent bij deze aanvraag de gegevens omtrent de
      door de netbeheerder of door een andere tot meten bevoegde instantie gemeten hoeveelheid gas uit hernieuwbare
      energiebronnen overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel66i
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '2.1'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 66j
    text: |-
      Onze Minister kan de taken, bedoeld in [artikel 66i][ref1], mandateren aan een niet-ondergeschikte die
      onafhankelijk is van producenten, leveranciers en handelaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel66i
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel66j
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 66i
        hoofdstuk: '5'
        paragraaf: '5.16'
  - number: 66k
    text: |-
      Een garantie van oorsprong voor gas uit hernieuwbare bronnen toont bij uitsluiting aan dat de daarop aangegeven
      hoeveelheid gas is opgewekt uit hernieuwbare bronnen.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel66k
  - number: 66l
    text: |-
      1 Onze Minister stelt bij ministeriële regeling de tarieven vast voor kosten die gepaard gaan met handelingen met
      betrekking tot garanties van oorsprong voor gas uit hernieuwbare bronnen.

      2 Onze Minister stelt bij ministeriële regeling regels met betrekking tot:

      a. de informatie die door producenten, leveranciers, handelaars, afnemers of netbeheerders verstrekt wordt aan
      Onze Minister;

      b. het uitgeven en de geldigheidsduur van garanties van oorsprong voor gas uit hernieuwbare bronnen;

      c. het vermelden van gegevens op garanties van oorsprong voor gas uit hernieuwbare bronnen;

      d. de voorwaarden waaronder en de wijze waarop producenten, leveranciers, handelaars of afnemers gebruik
      kunnen maken van de door hen verkregen garanties van oorsprong voor gas uit hernieuwbare bronnen of deze kunnen
      verhandelen;

      e. de vaststelling, bedoeld in [artikel 10, vijfde lid, onderdeel c][ref1];

      f. het meten, bedoeld in [artikel 10, vijfde lid, onderdeel c, en tiende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel66l
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 66m
    text: |-
      1 Garanties van oorsprong voor gas uit hernieuwbare energiebronnen uitgegeven door een onafhankelijke instantie
      in een andere lidstaat van de Europese Unie, die naar aard en strekking overeenkomen met in Nederland uitgegeven
      garanties van oorsprong voor gas uit hernieuwbare energiebronnen, worden daarmee gelijkgesteld.

      2 Garanties van oorsprong voor gas uit hernieuwbare energiebronnen uitgegeven door een onafhankelijke instantie in
      een derde land, die naar aard en strekking overeenkomen met in Nederland uitgegeven garanties van oorsprong, worden
      niet erkend, behalve indien de Europese Unie daarvoor een overeenkomst heeft afgesloten met het derde land en de
      energie rechtstreeks uit dat land wordt ingevoerd of uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel66m
  - number: '72'
    text: |-
      1 Een netbeheerder meldt jaarlijks voor 1 februari aan Onze Minister alle in het voorgaande kalenderjaar gesloten
      overeenkomsten tot transport van gas die strekken tot landsgrensoverschrijdende leveringen van gas.

      2 Bij de in het eerste lid bedoelde melding worden in ieder geval vermeld het land of de landen waar naartoe of
      van waaruit het gas werd of zal worden getransporteerd, de hoeveelheid gas die onderwerp was of zal zijn van elk
      transport en de termijn waarvoor de overeenkomst is gesloten.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de melding.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel72
  - number: '73'
    text: |-
      1 Met inachtneming van artikel 23, tweede lid, van de richtlijn, kunnen bij ministeriële regeling afnemers,
      handelaren, leveranciers, overeenkomsten en landen worden aangewezen ten aanzien waarvan toestemming van Onze
      Minister vereist is voor het transport van gas vanuit een ander land naar Nederland.

      2 De in het eerste lid bedoelde aanwijzing vindt slechts plaats indien uit de in [artikel 72][ref1] bedoelde
      meldingen blijkt dat een verstoring van het evenwicht bij het openstellen van de gasmarkten optreedt of dreigt op
      te treden.

      3 Bij de toepassing van het bepaalde bij of krachtens dit artikel houdt Onze Minister rekening met de vraag of
      een aanwijzing of een weigering tot het geven van toestemming noodzakelijk en proportioneel is in het licht van
      het doel ervan, alsmede met de vraag of de aanwijzing of de weigering de ontwikkeling van het handelsverkeer zou
      beïnvloeden in een mate die strijdig is met de belangen van de Gemeenschap, bedoeld in artikel 3, vijfde lid, van
      de richtlijn.

      4 Het is verboden zonder toestemming van Onze Minister het transport van gas te verrichten in het kader van een
      overeenkomst tot transport van gas die strekt tot de invoer van gas indien de overeenkomst, het daarbij betrokken
      land, de betrokken afnemer of leverancier in de in het eerste lid bedoelde ministeriële regeling is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel72
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '72'
        hoofdstuk: '7'
  - number: '74'
    text: |-
      Artikel 66, vierde lid, zoals dat luidde voor inwerkingtreding van het bij koninklijke boodschap van 19 mei 2020
      ingediende voorstel van wet tot wijziging van de Mijnbouwwet (het verwijderen of hergebruiken van mijnbouwwerken
      en investeringsaftrek) (Kamerstukken ) blijft van toepassing op reeds aangegane verplichtingen ter uitvoering van
      de taak, bedoeld in artikel 54, eerste lid, onderdeel b, zoals dat luidde voor inwerkingtreding van dat voorstel
      van wet.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel74
  - number: '80'
    text: |-
