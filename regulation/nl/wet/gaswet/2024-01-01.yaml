  - number: 39b
    text: |-
      1 Werken met een nationaal belang waarvoor Onze Minister in ieder geval een projectbesluit als bedoeld in
      [afdeling 5.2 van de Omgevingswet][ref1] vaststelt, zijn de volgende projecten:

      a. een uitbreiding van het landelijk gastransportnet, voor zover het betreft de van dat net deel uitmakende
      leidingen met een druk van ten minste 40 bar en een diameter van ten minste 45,7 centimeter, met inbegrip van de
      aansluitingen op die leidingen;

      b. de aanleg of uitbreiding van een interconnector als bedoeld in [artikel 18h][ref2], met inbegrip van het
      connectiepunt met deze interconnector;

      c. een uitbreiding van het landelijk gastransportnet of de aanleg of uitbreiding van een interconnector met
      inbegrip van het connectiepunt met deze interconnector, voor zover het een project betreft voor gas dat is
      opgenomen op de Unielijst van projecten van gemeenschappelijk belang, bedoeld in artikel 3, vierde lid, Verordening
      (EU) nr. 347/2013 van het Europees Parlement en de Raad van 17 april 2013 betreffende richtsnoeren voor de trans-
      Europese energie-infrastructuur en tot intrekking van Beschikking nr. 1364/2006/EG en tot wijziging van de
      Verordeningen (EG) nr. 713/2009, (EG) nr. 714/2009 en (EG) nr. 715/2009 (PbEU 2013, L 115);

      d. de aanleg of uitbreiding van een LNG-installatie met een capaciteit van ten minste 4 miljard m3, met inbegrip
      van de aansluiting van de installatie op een net.

      2 [Artikel 16.7 van de Omgevingswet][ref3] is van toepassing op de coördinatie van besluiten ter uitvoering van
      projectbesluiten als bedoeld in het eerste lid.

      3 In afwijking van het eerste lid kan Onze Minister besluiten geen projectbesluit vast te stellen als naar zijn
      oordeel besluitvorming door een bestuursorgaan van een gemeente of van een provincie het project kan versnellen
      of daaraan anderszins aanmerkelijke voordelen zijn verbonden, en het college van burgemeester en wethouders van de
      betreffende gemeente respectievelijk gedeputeerde staten van de betreffende provincie daarmee instemmen.

      4 Onze Minister geeft tegelijk met of zo snel mogelijk na de bekendmaking van een besluit als bedoeld in het derde
      lid kennis van dat besluit op de in [artikel 12 van de Bekendmakingswet][ref4] bepaalde wijze en doet mededeling
      van dat besluit door toezending daarvan aan de initiatiefnemer.

      5 Het vierde lid is van overeenkomstige toepassing als een besluit als bedoeld in het vierde lid wordt ingetrokken.

      6 Voor projecten als bedoeld in het eerste lid, onder c, stelt Onze Minister, in overeenstemming met Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties, een handleiding vast als bedoeld in artikel 9, eerste lid, van de
      verordening, bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel18h
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel16.7
      [ref4]: https://wetten.overheid.nl/BWBR0004287#Artikel12
