  - number: '10'
    text: |-
      1 Een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf heeft tot taak zijn gastransportnet, onderscheidenlijk
      zijn gasopslaginstallatie of zijn LNG-installatie op economische voorwaarden in werking te hebben, te onderhouden
      en te ontwikkelen op een wijze die de veiligheid, doelmatigheid en betrouwbaarheid van dat gastransportnet of die
      installatie en van het transport van gas waarborgt en het milieu ontziet.

      2 Een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf verstrekt aan:

      a. andere netbeheerders, gasopslagbedrijven en LNG-bedrijven voldoende informatie om te waarborgen dat het
      transport en de opslag van gas met behulp van zijn gastransportnet, onderscheidenlijk zijn gasopslaginstallatie
      of zijn LNG-installatie, en de daarmee verbonden gastransportnetten op een veilige en doelmatige wijze kan
      plaatsvinden,

      b. gebruikers van het gastransportnet of de installatie alle gegevens die zij nodig hebben voor een efficiënte
      toegang tot het net of de installatie en

      c. de netbeheerder van het landelijk gastransportnet informatie over de actuele gasstromen op zijn net.

      3 Een netbeheerder heeft, in aanvulling op de taken, genoemd in het eerste lid, tevens tot taak:

      a. koppelingen met andere gastransportnetten te realiseren en reparaties aan zijn gastransportnet uit te voeren;

      b. onverminderd [artikel 37][ref1], op geschikte wijze gegevens te publiceren over koppelingen tussen
      gastransportnetten, het gebruik van die netten en de toewijzing van transportcapaciteit;

      c. voorzieningen te treffen in geval van faillissement van een leverancier van gas aan afnemers als bedoeld in
      [artikel 43, eerste lid][ref2];

      d. onverminderd [artikel 54a][ref3], gas te weren dat niet voldoet aan de invoedspecificaties, opgenomen in de
      ministeriële regeling, bedoeld in [artikel 11][ref4];

      e. netverliezen in te kopen.

      4 Bij de toepassing van het eerste tot en met het derde lid onthouden gasbedrijven als bedoeld in het eerste lid
      zich van iedere vorm van discriminatie tussen gebruikers van de gastransportnetten of de installaties.

      5 Een netbeheerder heeft met betrekking tot zijn netten, in aanvulling op de in het eerste en derde lid genoemde
      taken, tevens tot taak:

      a. ervoor zorg te dragen dat een afnemer als bedoeld in [artikel 43, eerste lid][ref5], voor elke aansluiting
      beschikt over een geïnstalleerde meetinrichting, tenzij die afnemer blijkens de voorwaarden, bedoeld in
      [artikel 12b, eerste lid, onderdelen a of b][ref6], beschikt over een onbemeten aansluiting;

      b. zorg te dragen voor het beheer en onderhoud van de bij een afnemer als bedoeld in
      [artikel 43, eerste lid][ref7], geïnstalleerde meetinrichting;

      c. op verzoek van een producent vast te stellen of diens productie-installatie geschikt is voor de opwekking van
      gas uit hernieuwbare energiebronnen, alsmede of de inrichting om te meten geschikt is voor de meting van het gas
      uit hernieuwbare energiebronnen dat met de productie-installatie wordt opgewekt en op een gastransportnet ingevoed;

      d. de hoeveelheid gas uit hernieuwbare energiebronnen te meten.

      6 Een netbeheerder heeft, in aanvulling op de in het eerste, derde en vijfde lid genoemde taken, in het voor hem
      krachtens [artikel 12b, eerste lid, onderdeel f][ref8] vastgestelde gebied tevens tot taak om:

      a. een ieder die verzoekt om een aansluiting die een doorlaatwaarde heeft van ten hoogste 40m3(n) per uur te
      voorzien van deze aansluiting;

      b. een ieder die verzoekt om een aansluiting die een doorlaatwaarde heeft groter dan 40m3(n) per uur te voorzien
      van deze aansluiting op het dichtstbijzijnde punt van het gastransportnet met een voor die aansluiting geschikte
      druk en voldoende capaciteit, met dien verstande dat een installatie niet wordt voorzien van een aansluiting
      waarmee laagcalorisch gas aan het gastransportnet kan worden onttrokken, indien die installatie onderling
      technische, organisatorische of functionele bindingen heeft en in de onmiddellijke nabijheid is gelegen van een
      installatie die als gevolg van het verbod in artikel 10g, eerste lid, niet meer is aangesloten op dat deel van het
      gastransportnet waarmee laagcalorisch gas wordt getransporteerd;

      c. aansluitingen te beheren en onderhouden;

      d. aansluitingen te wijzigen, anders dan het omschakelen van die aansluitingen, of verwijderen, indien de afnemer
      hierom verzoekt.

      7 Het zesde lid, onderdeel a, is niet van toepassing:

      a. voor het aansluiten van een te bouwen bouwwerk, tenzij een college van burgemeester en wethouders het gebied
      waarin dit bouwwerk wordt gebouwd, hebben aangewezen als gebied waar aansluiting op het gastransportnet strikt
      noodzakelijk is om zwaarwegende redenen van algemeen belang, waaronder begrepen de maatschappelijke kosten en
      baten. Bij ministeriële regeling worden hiertoe nadere regels gesteld;

      b. in gebieden waar een gastransportnet aanwezig is, indien een college van burgemeester en
      wethouders het gebied hebben aangewezen als gebied waar zich een warmtenet als bedoeld in
      [artikel 1, eerste lid, van de Warmtewet][ref9], of een andere energie-infrastructuur bevindt of gaat bevinden die
      kan voorzien in de verwachte warmtebehoefte.

      8 Een college van burgemeester en wethouders meldt een besluit als bedoeld in het zevende lid, onderdeel a of b,
      aan de Autoriteit Consument en Markt.

      9 De Autoriteit Consument en Markt houdt een register bij van de gebieden waarover een besluit is genomen als
      bedoeld in het zevende lid, onderdeel a of b, en die krachtens [artikel 12b, eerste lid, onderdeel f][ref10], zijn
      uitgezonderd. Bij ministeriële regeling kunnen regels worden gesteld over de in het register te vermelden gegevens.

      10 Onverminderd [artikel 37, eerste lid][ref11], maakt de netbeheerder van het landelijk gastransportnet, een
      gasopslagbedrijf of een LNG-bedrijf informatie die nodig is voor doeltreffende mededinging en een efficiënte
      werking van de markt openbaar.

      11 Een netbeheerder heeft tot taak zijn gastransportnet te beschermen tegen mogelijke invloeden van buitenaf.

      12 Degene, niet zijnde een netbeheerder, die bij een afnemer de meting van op het gastransportnet ingevoed gas uit
      hernieuwbare bronnen verricht, deelt de verkregen productiemeetgegevens mee aan de betreffende afnemer en aan de
      netbeheerder op wiens gastransport net de producent is aangesloten.

      13 De netbeheerder deelt de productiemeetgegevens, bedoeld in het vijfde lid, onderdeel d, en het twaalfde lid,
      mee aan Onze Minister, alsmede aan de desbetreffende producent voor zover die nog niet de beschikking heeft over
      die informatie.


