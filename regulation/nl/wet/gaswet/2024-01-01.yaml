  - number: '5'
    text: |-
      1 Indien het aanwijzen van een netbeheerder als bedoeld in [artikel 2, achtste lid][ref1], niet is geschied binnen
      vier weken na de aanleg van een gastransportnet dan wel onverwijld na het intrekken of vervallen van een eerdere
      aanwijzing of indien er sprake is van een gastransportnet waarvoor ten onrechte geen netbeheerder is aangewezen dan
      wel instemming van Onze Minister met een aanwijzing ontbreekt, kan Onze Minister door aanwijzing van een naamloze
      of besloten vennootschap een netbeheerder van dat gastransportnet aanwijzen.

      2 Indien Onze Minister vaststelt dat niet meer voldaan wordt aan de [artikelen 2c][ref2], [3][ref3], [3b][ref4]
      of [3c][ref5] of dat een netbeheerder in onvoldoende mate in staat is of zal zijn om aan een verplichting als
      bedoeld in de [artikelen 1h][ref6] en [10e][ref7] te voldoen, om een taak als bedoeld in de [artikelen 10][ref8]
      of [42][ref9] uit te voeren, of indien een netbeheerder niet voldoet aan een verbod als bedoeld in de
      [artikelen 10Aa][ref10] of [10b][ref11] dan wel, indien een netbeheerder deel uitmaakt van een groep als bedoeld
      in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref12], de met hem verbonden groepsmaatschappij niet voldoet
      aan het bepaalde bij of krachtens [artikel 10d][ref13], kan Onze Minister de desbetreffende netbeheerder opdragen
      door hem noodzakelijk geachte voorzieningen te treffen.

      3 Indien de netbeheerder niet voldoet aan een opdracht als bedoeld in het tweede lid, opdrachten als bedoeld in
      [artikel 5a, eerste lid][ref14], niet uitvoert of indien naar het oordeel van Onze Minister door de bedrijfsvoering
      van deze netbeheerder de continuïteit of de betrouwbaarheid van de gasvoorziening voor afnemers in gevaar komt en
      onverwijld ingrijpen noodzakelijk is, kan Onze Minister:

      a. de aanwijzing van de desbetreffende netbeheerder vervallen verklaren en uiterlijk op de dag waarop die
      aanwijzing vervalt een andere naamloze of besloten vennootschap als netbeheerder aanwijzen, of

      b. [artikel 5a][ref15] toepassen.

      4 In een beschikking als bedoeld in het derde lid, onderdeel a, bepaalt Onze Minister de termijn waarop de
      aanwijzing vervalt en kan hij degene die de netbeheerder, bedoeld in de aanhef van het derde lid, heeft aangewezen
      in de gelegenheid stellen binnen een door Onze Minister te bepalen termijn een andere netbeheerder aan hem ter
      aanwijzing voor te dragen. Onze Minister kan deze termijn eenmaal verlengen.

      5 Onze Minister kan voor de periode totdat een beschikking als bedoeld in het derde lid, onderdeel a, in werking
      treedt, [artikel 5a][ref16] toepassen.

      6 Uiterlijk op de dag waarop een beschikking tot aanwijzing van Onze Minister in werking treedt, draagt de
      netbeheerder of, indien van toepassing, degene aan wie een gastransportnet toebehoort, de economische eigendom van
      het gastransportnet over aan de aangewezen nieuwe netbeheerder. Degene die de netbeheerder, bedoeld in de aanhef
      van het derde lid, heeft aangewezen, verleent daaraan voor zover nodig zijn medewerking.

      7 De overdracht van de economische eigendom, bedoeld in het zesde lid, geschiedt tegen verrichting van een
      tegenprestatie waarvan de waarde uiterlijk op de in dat lid bedoelde dag is vastgesteld en die ten hoogste
      de opbrengst vertegenwoordigt van de exploitatie van het gastransportnet, zoals deze op basis van algemene
      bedrijfseconomische uitgangspunten kan worden afgeleid van de in de daaraan voorafgaande periode van vijf jaar
      geldende tarieven met betrekking tot het netbeheer. Deze tegenprestatie kan zowel bestaan uit een periodieke
      uitkering als uit een contant bedrag in eens.

      8 Indien de tegenprestatie, bedoeld in het zevende lid, niet kan worden afgeleid uit de vastgestelde tarieven, kan
      de tegenprestatie worden vastgesteld volgens bij algemene maatregel van bestuur vast te stellen regels.

      9 Aan de vaststelling van de tegenprestatie, bedoeld in het zevende en achtste lid, verlenen degene die
      de economische eigendom van het net overdraagt en degene die deze eigendom overneemt, voor zover nodig hun
      medewerking.

      10 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde in dit
      artikel.


