  - number: 35c
    text: |-
      De netbeheerder, met uitzondering van de netbeheerder van het landelijk gastransportnet, draagt er zorg voor dat de
      afnemers die op zijn gastransportnet zijn aangesloten een overzicht ontvangen waarop de eenmalige kosten in verband
      met die aansluiting overzichtelijk en begrijpelijk zijn gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel35c
  - number: 35d
    text: |-
      1 Een netbeheerder voorziet in een transparante, eenvoudige en goedkope procedure voor de behandeling van klachten
      van afnemers als bedoeld in [artikel 43, eerste lid][ref1], over het netbeheer.

      2 De in het eerste lid bedoelde procedure voorziet er voorts in dat:

      a. de behandeling van de klacht geschiedt door een persoon die niet bij de gedraging waarop de klacht betrekking
      heeft, betrokken is geweest,

      b. de klager schriftelijk en gemotiveerd in kennis wordt gesteld van de bevindingen naar aanleiding van de klacht
      en van de conclusies die daaraan worden verbonden, en

      c. de klacht zo spoedig mogelijk doch uiterlijk binnen acht weken wordt afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 35e
    text: |-
      1 Een netbeheerder draagt er, al dan niet samen met een of meer andere netbeheerders, zorg voor dat onderbrekingen
      in het transport van gas, afwijkingen van de eisen aan de kwaliteit van het transport van gas en waarnemingen van
      gaslucht door afnemers op een eenvoudige wijze gemeld kunnen worden en maakt aan afnemers bekend op welke wijze
      deze meldingen kunnen geschieden.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de registratie van de meldingen en de
      openbaarmaking van de registratie.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel35e
  - number: '37'
    text: |-
      1 Een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf dat bij de uitvoering van zijn taak de beschikking
      krijgt over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, draagt er zorg
      voor dat die gegevens niet ter beschikking komen of kunnen komen van derden, tenzij enig wettelijk voorschrift
      anders bepaalt.

      2 Indien een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf gegevens over zijn bedrijfsvoering die
      commercieel voordeel kunnen opleveren ter beschikking stelt aan anderen, doet hij dit op niet-discriminatoire
      wijze.

      3 Een netbeheerder maakt bij de aankoop of de verkoop van gas door een verwant bedrijf geen misbruik van
      commercieel gevoelige gegevens van anderen die hij heeft verkregen bij onderhandelingen over transport of bij het
      verrichten van transport.

      4 Een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf maakt alle informatie openbaar die bijdraagt aan een
      doeltreffende mededinging en een efficiënte werking van de markt, voor zover deze redelijkerwijs te genereren is
      uit de informatie waarover hij beschikt op basis van de uitvoering van de op grond van deze wet aan hem toegekende
      taken.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel37
  - number: '38'
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet niet in staat is de informatie te publiceren in
      overeenstemming met verordening 715/2009 stelt hij na overleg met de Autoriteit Consument en Markt een actieplan
      vast voor de uitvoering.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel38
  - number: 38b
    text: |-
      Onze Minister en de Autoriteit Consument en Markt verstrekken de Europese Commissie desgevraagd overeenkomstig
      artikel 25 van verordening 715/2009 alle voor de toepassing van artikel 23 van verordening 715/2009 noodzakelijke
      informatie.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel38b
  - number: '39'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen met betrekking tot daarbij aan te wijzen gebieden regels worden
      gesteld over de wijze waarop, gelet op het belang van een betrouwbaar, duurzaam en doelmatig functionerende
      energiehuishouding, een afweging wordt gemaakt met betrekking tot de aanleg van een gastransportnet, een warmtenet
      en de aanleg van leidingen en hulpmiddelen voor het transport van elektriciteit.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat een gastransportnet slechts wordt aangelegd als
      resultaat van een openbare procedure waarin gegadigden op een te plaatsen opdracht kunnen inschrijven met een
      aanbieding voor de aanleg van een een gastransportnet, een warmtenet of van leidingen en hulpmiddelen voor het
      transport van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel39
  - number: 39a
    text: |-
      Een gastransportnet dat door een netbeheerder in het kader van de uitoefening van zijn taak, bedoeld in de
      [artikelen 10][ref1] en [10i][ref2], in werking wordt gehouden, onderhouden of ontwikkeld, wordt aangemerkt als
      openbaar werk van algemeen nut.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10i
