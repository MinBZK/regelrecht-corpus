    text: |-
      1 Behoudens [artikel 15][ref1] is een netbeheerder verplicht, in voorkomend geval tezamen met een verwant bedrijf,
      degene die daarom verzoekt een aanbod te doen om met gebruikmaking van het door hem beheerde gastransportnet en
      van een of meer installaties van het verwante bedrijf ten behoeve van de verzoeker transport van gas en de dat
      transport ondersteunende diensten te verrichten tegen een tarief alsmede tegen voorwaarden die in overeenstemming
      zijn met de [artikelen 12f][ref2] of [12g][ref3], [ 81c][ref4] of [82][ref5].

      2

      3 Een netbeheerder hanteert voorwaarden die redelijk, transparant en niet-discriminatoir zijn.

      4 Voorwaarden als bedoeld in de [artikelen 236][ref6] en [237 van Boek 6 van het Burgerlijk Wetboek][ref7] worden
      vermoed niet redelijk te zijn.

      5 Een voorwaarde is redelijk, wanneer dit blijkt uit de aard, inhoud en wijze van totstandkoming van de betrokken
      voorwaarde.

      6 Het vierde en vijfde lid zijn niet van toepassing op een afnemer, als bedoeld in [artikel 43, eerste lid][ref8].

      7 De [artikelen 236][ref9] en [237 van Boek 6 van het Burgerlijk Wetboek][ref10] zijn mede van toepassing op
      voorwaarden in overeenkomsten met afnemers als bedoeld in [artikel 43, eerste lid][ref11], die rechtspersoon zijn
      of handelen in de uitoefening van een beroep of bedrijf.


