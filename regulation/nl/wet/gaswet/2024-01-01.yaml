  - number: 10e
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent een goed financieel beheer
      van de netbeheerder.

      2 De in het eerste lid bedoelde regels houden in ieder geval in dat

      a. de netbeheerder voldoet aan bij of krachtens die maatregel gestelde eisen aan zijn kredietwaardigheid waaronder
      de verhouding tussen vreemd vermogen en totaal vermogen, of dat

      b. de netbeheerder beschikt over een verklaring van een onafhankelijke deskundige ten aanzien van zijn
      kredietwaardigheid.

      3 In de in het eerste lid bedoelde maatregel kunnen tevens

      a. regels worden gesteld omtrent de wijze van berekening van vermogensonderdelen;

      b. eisen worden gesteld met betrekking tot de in het tweede lid, onderdeel b, bedoelde verklaring en de daar
      bedoelde deskundige.

      4 Indien de netbeheerder niet voldoet aan de regels, bedoeld in het eerste lid:

      a. stelt de netbeheerder de Autoriteit Consument en Markt hiervan onverwijld schriftelijk op de hoogte,

      b. stelt de netbeheerder binnen vier weken na de melding een herstelplan op waarin wordt beschreven op welke wijze
      hij het financieel beheer gaat verbeteren en zendt hij dit plan aan de Autoriteit Consument en Markt, en

      c. keert de netbeheerder geen dividend uit aan zijn aandeelhouders.

      5 De Autoriteit Consument en Markt kan de netbeheerder aanwijzingen geven met betrekking tot de verbetering van het
      financieel beheer.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel10e
  - number: 10f
    text: |-
      1 Het is met ingang van 1 oktober 2022 verboden via een aansluiting die is verbonden met dat deel van het
      gastransportnet waarmee laagcalorisch gas wordt getransporteerd in een gasjaar meer dan 100 miljoen m3(n) gas aan
      dat gastransportnet te onttrekken.

      2 Indien installaties die behoren tot eenzelfde onderneming of instelling, die onderling technische,
      organisatorische of functionele bindingen hebben en in elkaars onmiddellijke nabijheid zijn gelegen, van gas
      worden voorzien door middel van meer dan een aansluiting, is het met ingang van 1 oktober 2022 verboden via die
      gezamenlijke aansluitingen meer dan 100 miljoen m3(n) gas te onttrekken aan dat deel van het gastransportnet
      waarmee laagcalorisch gas wordt getransporteerd, indien een of meerdere van die aansluitingen na inwerkingtreding
      van dit artikel zijn gerealiseerd.

      3 Dit artikel vervalt met ingang van 1 oktober 2030 of op een bij koninklijk besluit eerder te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel10f
  - number: 10g
    text: |-
      1 Het is een afnemer die in de gasjaren 2016/2017, 2017/2018 en 2018/2019 in ten minste twee van die gasjaren
      meer dan 100 miljoen m3 (n) gas hebben onttrokken via diens aansluiting die verbonden is met dat deel van het
      gastransportnet waarmee laagcalorisch gas wordt getransporteerd, met ingang van 1 oktober 2022 verboden via die
      aansluiting gas aan dat deel van het gastransportnet te onttrekken.

      2 Deze afnemer meldt zo spoedig mogelijk na inwerkingtreding van dit artikel schriftelijk aan de netbeheerder van
      het landelijk gastransportnet dat zijn aansluiting omgeschakeld of afgesloten dient te worden en verstrekt hem
      alle gegevens die naar diens oordeel relevant zijn voor een voor de bedrijfsprocessen van de afnemer doelmatige en
      efficiënte planning van het omschakelen onderscheidenlijk afsluiten van de betrokken aansluiting. De afnemer stuurt
      een afschrift van deze melding en de daarbij gevoegde gegevens aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel10g
