  - number: '61'
    text: |-
      Een representatieve organisatie van netgebruikers op de gasmarkt wordt geacht belanghebbende te zijn bij een
      besluit, niet zijnde een beschikking, genomen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel61
  - number: '62'
    text: |-
      Provinciale staten en de gemeenteraad zijn niet bevoegd het transporteren en het leveren van gas in het belang van
      de energievoorziening aan regels te binden.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel62
  - number: '63'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van een besluit op grond van het Verdrag betreffende de
      werking van de Europese Unie regels worden gesteld met betrekking tot de voorwaarden die door een gasbedrijf in
      het belang van de veiligheid en de doelmatigheid worden gesteld voor het leveren van gas of voor het aansluiten van
      toestellen of installaties die gas verbruiken, en de toepassing van zodanige voorwaarden.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel63
  - number: '64'
    text: |-
      1 Overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels is een door Onze Minister
      vast te stellen vergoeding verschuldigd voor een instemming als bedoeld in [artikel 4, tweede lid][ref1], van een
      aanwijzing als bedoeld in [artikel 5][ref2], een ontheffing als bedoeld in [artikel 16][ref3] of van een vergunning
      als bedoeld in [artikel 45][ref4], welke vergoeding verschuldigd is voor ten hoogste de kosten van de bemoeiingen
      met betrekking tot de instemming, de aanwijzing, de ontheffing, de vergunning onderscheidenlijk het certificaat.

      2 Onze Minister kan het verschuldigde bedrag invorderen bij dwangbevel. Ten aanzien van de in het eerste
      lid bedoelde vergoedingen is, voor zover al niet van toepassing, [titel 4.4][ref5] met uitzondering van de
      [artikelen 4:85][ref6] en [4:95 van de Algemene wet bestuursrecht][ref7] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel45
      [ref5]: https://wetten.overheid.nl/BWBR0005537
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel485
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel495
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel64
