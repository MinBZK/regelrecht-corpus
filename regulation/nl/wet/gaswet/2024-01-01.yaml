        artikel: 54a
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 60ac
    text: |-
      De Autoriteit Consument en Markt kan een last onder bestuursdwang opleggen in geval van
      overtreding van het bepaalde bij of krachtens deze wet met uitzondering van de artikelen bedoeld in
      [artikel 1c, eerste en tweede lid][ref1], dan wel van overtreding van het bepaalde bij of krachtens [verordening
      715/2009](32009R0715), [verordening 2017/1938](31938R2017) en [verordening 1227/2011](32011R1227).


