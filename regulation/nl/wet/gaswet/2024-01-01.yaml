  - number: 10m
    text: |-
      1 Onze Minister kan een afnemer als bedoeld in [artikel 10g, eerste lid][ref1], een vergoeding toekennen
      indien het verbod, bedoeld in dat artikel, voor die afnemer schade veroorzaakt die uitgaat boven het normale
      maatschappelijke risico en die de afnemer in vergelijking met anderen onevenredig zwaar treft.

      2 Schade blijft in elk geval voor rekening van de afnemer voor zover:

      a. hij het risico van het ontstaan van de schade heeft aanvaard;

      b. hij de schade had kunnen beperken door binnen redelijke grenzen maatregelen te nemen, die tot voorkoming of
      vermindering van de schade hadden kunnen leiden;

      c. de schade anderszins het gevolg is van een omstandigheid die aan de aanvrager kan worden toegerekend, of

      d. de vergoeding van de schade anderszins is verzekerd.

      3 Indien het verbod, bedoeld in [artikel 10g, eerste lid][ref2], tevens voordeel voor de afnemer heeft opgeleverd,
      wordt dit bij de vaststelling van de te vergoeden schade in aanmerking genomen.

      4 Bij ministeriële regeling kunnen regels worden gesteld die betrekking hebben op:

      a. het moment waarop de vergoeding kan worden aangevraagd;

      b. de gegevens die bij een aanvraag worden overgelegd;

      c. de termijn voor het geven van een beslissing op een aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10g
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10g
