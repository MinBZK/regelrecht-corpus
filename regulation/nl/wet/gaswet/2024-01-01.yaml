  - number: 12i
    text: |-
      1 De tariefstructuren en de voorwaarden treden in werking op een door de Autoriteit Consument en Markt te bepalen
      datum en gelden voor onbepaalde tijd.

      2 Van de besluiten betreffende de vaststelling van de tariefstructuren en de voorwaarden alsmede de wijziging
      daarvan wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 Iedere netbeheerder legt een exemplaar van de tariefstructuren en de voorwaarden voor een ieder ter inzage in al
      zijn vestigingen.

      4 Na de vaststelling van de voorwaarden gelden deze als minimumeisen voor de technische veiligheid en voor het
      technisch ontwerp en de exploitatie van de installaties en netten, bedoeld in artikel 8 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel12i
  - number: '13'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld met betrekking tot de berekeningsmethodiek van de tarieven en
      voorwaarden voor toegang tot LNG-installaties. In de voorwaarden worden in ieder geval regels gesteld omtrent:

      a. het voorzien van een aansluiting op de LNG-installatie;

      b. het uitvoeren van LNG-activiteiten ten behoeve van een derde;

      c. het meten van gegevens betreffende LNG-activiteiten, de uitwisseling van gegevens en de erkenning van
      meetbedrijven;

      d. de dienstverlening van LNG-bedrijven aan derden

      e. de door het LNG-bedrijf te hanteren technische specificaties.

      2 Een LNG-bedrijf stelt jaarlijks voor 1 juli de berekeningsmethodiek van de tarieven en de voorwaarden vast die
      het in het volgende kalenderjaar wil hanteren voor het sluiten van overeenkomsten over het verlenen van toegang
      tot de LNG-installatie, alsmede voor het verrichten van die toegang ondersteunende diensten. De voorwaarden van een
      LNG-bedrijf zijn redelijk, transparant en niet-discriminatoir.

      3 Het LNG-bedrijf zendt de door hem vastgestelde berekeningsmethodiek van de tarieven en de voorwaarden onverwijld
      ter goedkeuring aan de Autoriteit Consument en Markt.

      4 De Autoriteit Consument en Markt beslist binnen een termijn van drie maanden na ontvangst omtrent de goedkeuring
      van de berekeningsmethodiek en de voorwaarden. De Autoriteit Consument en Markt onthoudt haar goedkeuring aan
      de berekeningsmethodiek en de voorwaarden als zij naar haar oordeel niet in overeenstemming zijn met de bij of
      krachtens het eerste en tweede lid gestelde eisen.

      5 Indien de Autoriteit Consument en Markt niet binnen een termijn, genoemd in het vierde lid, omtrent de
      goedkeuring heeft beslist, worden zij geacht te zijn goedgekeurd.

      6 Indien de Autoriteit Consument en Markt haar goedkeuring aan de berekeningsmethodiek van de tarieven en de
      voorwaarden heeft onthouden, stelt het LNG-bedrijf de berekeningsmethodiek van de tarieven en voorwaarden zo
      spoedig mogelijk opnieuw vast, met inachtneming van de aanwijzingen die de Autoriteit Consument en Markt hem heeft
      gegeven in haar beslissing tot onthouding van goedkeuring, en zendt het de berekeningsmethodiek van de tarieven en
      de voorwaarden wederom onverwijld ter goedkeuring aan de Autoriteit Consument en Markt. Het vierde, vijfde en zesde
      lid zijn van overeenkomstige toepassing.

      7 De berekeningsmethodiek van de tarieven en voorwaarden treden in werking op 1 januari van het kalenderjaar waarop
      zij betrekking hebben. Indien zij op die datum nog niet zijn goedgekeurd, treden zij in werking op de dag waarop
      het besluit tot goedkeuring in werking is getreden. In het geval, bedoeld in de vorige volzin, gelden tot de dag
      waarop het besluit tot goedkeuring in werking treedt, de berekeningsmethodiek van de tarieven en voorwaarden die
      golden in het voorafgaande kalenderjaar.

      8 Het LNG-bedrijf publiceert op een geschikte wijze de goedgekeurde berekeningsmethodiek van de tarieven, de
      voorwaarden en de tarieven, voorafgaand aan de inwerkingtreding ervan. Het LNG-bedrijf legt een exemplaar van de
      goedgekeurde berekeningsmethodiek van de tarieven, de voorwaarden en de tarieven voor een ieder ter inzage in al
      zijn vestigingen.
