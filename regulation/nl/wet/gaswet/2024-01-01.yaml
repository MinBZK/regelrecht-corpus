  - number: 12b
    text: |-
      1 Met inachtneming van de in [artikel 12][ref1] bedoelde regels en de in artikel 6 van verordening 715/2009
      bedoelde netcodes zenden de gezamenlijke netbeheerders aan de Autoriteit Consument en Markt een voorstel voor de
      door hen jegens netgebruikers te hanteren voorwaarden met betrekking tot:

      a. de wijze waarop netbeheerders en netgebruikers alsmede netbeheerders zich jegens elkaar gedragen ten aanzien van
      het in werking hebben van de gastransportnetten, het voorzien van een aansluiting op het net en het uitvoeren van
      transport van gas over het gastransportnet;

      b. de wijze waarop netbeheerders en afnemers alsmede netbeheerders zich jegens elkaar gedragen ten aanzien van het
      meten van gegevens betreffende het transport van gas;

      c. de kwaliteitscriteria waaraan netbeheerders moeten voldoen met betrekking tot hun dienstverlening;

      d. de wijze waarop de netbeheerder van het landelijk gastransportnet uitvoering geeft aan de hem op grond van
      [artikel 10a, eerste lid][ref2], opgedragen taken, met uitzondering van de taken die door Onze Minister aan de
      netbeheerder van het landelijk gastransportnet zijn opgedragen;

      e. de regeling van samenwerking tussen de netbeheerders ten aanzien van de uitvoering van de taken als opgenomen
      in de [artikelen 10][ref3] en [10a][ref4] alsmede het waarborgen van het netbeheer van alle netten en het transport
      van gas in buitengewone omstandigheden;

      f. de gebiedsindeling van de netbeheerders ten behoeve van de uitvoering van de taak, genoemd in
      [artikel 10, zesde lid][ref5], waarbij bepaalde gebieden kunnen worden uitgezonderd indien het een gebied betreft
      waar een netbeheerder niet op economische voorwaarden een gastransportnet in werking kan hebben, onderhouden of
      ontwikkelen;

      g. de wijze waarop de netbeheerder van het landelijk gastransportnet en een afnemer als bedoeld in
      [artikel 10g, eerste lid][ref6], zich bij het omschakelen jegens elkaar gedragen.

      2 In de voorwaarden, bedoeld in het eerste lid, onderdeel a, kunnen regels worden gesteld omtrent:

      a. de eisen, met inbegrip van veiligheidseisen, waaraan het technisch ontwerp en de exploitatie van leidingen
      en installaties tenminste moet voldoen voor aansluiting van die leidingen en installaties op het gastransportnet
      van een netbeheerder en de installaties van een verwant bedrijf dat diensten levert die noodzakelijk zijn voor
      uitvoering van het transport van gas;

      b. toedeling van de transportcapaciteit, de bepaling van de omvang van de capaciteit voor het transport van gas
      over interconnectoren en interconnectiepunten, het toewijzen van de beschikbare capaciteit daarop en de wijze van
      toewijzen van capaciteit op interconnectoren en interconnectiepunten die een netgebruiker niet gebruikt, welke
      wijze kan inhouden het veilen of het op een andere marktconforme methode toewijzen van die capaciteit;

      c. de door een netbeheerder aan te houden reservecapaciteit beschikbaar voor transport van gas.

      2a In de voorwaarden bedoeld in het eerste lid, onderdeel a, wordt in ieder geval vastgelegd dat:

      a. het transport van gas door het landelijk gastransportnet plaats vindt op basis van een systematiek uitgaande
      van entry- en exitpunten, waarbij de capaciteit op de entry- en exitpunten door afnemers met een aansluiting op het
      landelijke gastransportnet en netgebruikers afzonderlijk kan worden gecontracteerd;

      b. de entry- en exitpunten door de netbeheerder van het landelijk gastransportnet worden vastgesteld op grond van
      objectieve, transparante en niet-discriminerende voorwaarden en met inachtneming van de belangen van netgebruikers;

      c. de vastgestelde exitpunten worden door de netbeheerder van het landelijk gastransportnet op een voor
      netgebruikers geschikte wijze gepubliceerd;

      d. de capaciteit op een exitpunt bij voorrang kan worden gecontracteerd door een afnemer die een aansluiting op het
      landelijke gastransportnet heeft die is gekoppeld aan het desbetreffende exitpunt.

      3 In de voorwaarden, bedoeld in het eerste lid, onderdeel c, worden in ieder geval regels gesteld omtrent:

      a. de technische specificaties waaraan de netbeheerder tenminste moet voldoen;

      b. het binnen een redelijke termijn verhelpen van storingen in het transport van gas

      c. de klantenservice

      d. het voorzien in compensatie bij ernstige storingen;

      e. de betalingsvoorwaarden, die in elk geval inhouden dat een vordering tot betaling van een schuld van een
      afnemer ter zake van geleverde diensten als bedoeld in [artikel 12a][ref7] wordt gedaan binnen twee jaren nadat
      de vordering opeisbaar is geworden en dat bij gebreke daarvan de vordering vervalt. Een vordering vervalt niet
      binnen twee jaren, indien het uitblijven van bedoelde vordering, een onjuiste vordering daaronder begrepen, het
      rechtstreekse gevolg is van een daartoe gerichte opzettelijke gedraging van de afnemer.

      4 In de voorwaarden, bedoeld in het eerste lid, onderdeel a en d, worden in ieder geval regels gesteld met
      betrekking tot:

      a. de programmaverantwoordelijkheid;

      b. de programma’s, bedoeld in [artikel 17b, eerste en tweede lid][ref8];

      c. de omgang met afwijkingen van de programma’s;

      d. de voorwaarden waaronder de programmaverantwoordelijkheid kan worden overgedragen;

      e. de wijze waarop de netbeheerder van het landelijk gastransportnet een ernstige verstoring van het evenwicht van
      het door hem beheerde gastransportnet voorkomt of herstelt.

      5 In de voorwaarden, bedoeld in het eerste lid, onderdeel a, worden regels gesteld omtrent de technische eisen
      waaraan een aansluiting van een gesloten distributiesysteem moet voldoen.


