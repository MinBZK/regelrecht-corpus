  - number: 1c
    text: |-
      1 Onze Minister is belast met het toezicht op de naleving van het bepaalde bij of krachtens [artikelen 5a][ref1],
      [8a][ref2], [11][ref3], [35a][ref4], [51][ref5], [54a][ref6], [54b][ref7] en [56][ref8], alsmede met onderwerpen
      die samenhangen met de kwaliteit van het transport van gas met als doel het voorkomen van ongevallen, voorvallen
      en schade.

      2 Bij ministeriële regeling worden de artikelen of delen hiervan betreffende de kwaliteit van het transport van gas
      bedoeld in het eerste lid aangewezen.

      3 Onze Minister wijst bij besluit de ambtenaren aan die toezicht houden op de naleving van de artikelen bedoeld in
      het eerste en tweede lid.

      4 Onze Minister kan in verband met de naleving van de voorschriften bedoeld in het eerste en tweede lid een
      bindende aanwijzing geven of een bindende gedragslijn opleggen.

      5 Onze Minister kan ter handhaving van de voorschriften bedoeld in het eerste en tweede lid een last onder
      bestuursdwang opleggen.


