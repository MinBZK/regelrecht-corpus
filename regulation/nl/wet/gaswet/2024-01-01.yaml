      [73, vierde lid][ref82] en [85b][ref83] de artikelen 3, 4 en 5 van [verordening 1227/2011](32011R1227) en besluiten
      als bedoeld in artikel 2, onderdeel d, van [verordening 2019/942](32842R2019), de overtreder per overtreding een
      bestuurlijke boete opleggen van ten hoogste € 900.000 of, indien dat meer is, 10% van de omzet van de overtreder.

      2 De bestuurlijke boete die ingevolge het eerste lid, onderdelen a en b, ten hoogste kan worden opgelegd
      wordt verhoogd met 100%, indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de
