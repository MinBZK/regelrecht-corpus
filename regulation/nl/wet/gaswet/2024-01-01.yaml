  - number: 1d
    text: |-
      De Autoriteit Consument en Markt volgt nauwlettend in welke mate de gasmarkt aan de doelstellingen, bedoeld in
      artikel 40 van de richtlijn, voldoet. Tevens volgt zij:

      a. de samenhang tussen de voorgenomen investeringen, bedoeld in [artikel 8][ref1], van de netbeheerder van het
      landelijk gastransportnet en de netontwikkelingsplannen als bedoeld in artikel 8, derde lid, onderdeel b, van
      verordening 715/2009;

      b. het niveau van transparantie, met inbegrip van de groothandelsprijzen;

      c. het niveau en de doeltreffendheid van openstelling van de markt en de mededinging op groot- en
      kleinverbruikersniveau;

      d. het bestaan van praktijken gericht op het aangaan van overeenkomsten die afnemers, niet zijnde afnemers als
      bedoeld in [artikel 43, eerste lid][ref2], kunnen weerhouden van of hen beperkingen kunnen opleggen met betrekking
      tot een keuze voor het gelijktijdig sluiten van overeenkomsten met meer dan een leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel43
