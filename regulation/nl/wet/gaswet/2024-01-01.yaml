  - number: 35a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor de uitvoering van onderdelen van
      verordeningen en besluiten als bedoeld in artikel 288 van het Verdrag betreffende de werking van de Europese Unie,
      vastgesteld krachtens de richtlijn en de verordeningen, bedoeld in [artikel 1a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1a
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel35a
    references:
