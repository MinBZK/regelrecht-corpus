  - number: 10Aa
    text: |-
      1 Een netbeheerder verricht geen andere werkzaamheden dan die nodig zijn voor een goede uitvoering van de bij of
      krachtens de wet aan hem toegekende taken.

      2 In afwijking van het eerste lid mag een netbeheerder in opdracht van een andere netbeheerder de aan die
      netbeheerder toegekende taken uitvoeren.

      3 Een netbeheerder besteedt geen werkzaamheden bij een afnemer uit aan een onderneming waar een leverancier
      onderdeel van uitmaakt.

      4 Ingeval van uitbesteding van werkzaamheden behoudt de netbeheerder de verantwoordelijkheid voor de onafhankelijke
      uitvoering van deze werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel10Aa
  - number: 10a
    text: |-
      1 Onverminderd de [artikelen 10][ref1], [42][ref2] en [54a][ref3], en [hoofdstuk 2][ref4] heeft de netbeheerder van
      het landelijk gastransportnet tevens tot taak:

      a. voorzieningen te treffen in verband met de leveringszekerheid,

      b. het in evenwicht houden van het door hem beheerde gastransportnet,

      c. ten behoeve van gebruikers van het door hem beheerde gastransportnet en gelet op het minimaliseren van de
      winning van gas uit het gebied dat is aangewezen in de bij koninklijk besluit van 30 mei 1963, nr. 39 (Stcrt. 126)
      verleende winningsvergunning, voor zover het gas uit het Groningenveld betreft:

      1°. indien noodzakelijk gelet op het verschil tussen de kwaliteit van het op het gastransportnet ingevoede gas
      en het aan het gastransportnet onttrokken gas, gas met een hogere energie-inhoud naar een lagere energie-inhoud
      administratief of fysiek om te zetten;

      2°. indien noodzakelijk gelet op het verschil tussen de kwaliteit van het op het gastransportnet ingevoede gas
      en het aan het gastransportnet onttrokken gas, gas met een lagere energie-inhoud naar een hogere energie-inhoud
      administratief om te zetten, voor zover er gas met een hogere energie-inhoud voor omzetting beschikbaar is;

      tenzij deze taken redelijkerwijs niet van de netbeheerder van het landelijk gastransportnet kunnen worden gevergd;

      d.

      e. een programmaverantwoordelijke actuele en zo correct en volledig mogelijke informatie te verschaffen over:

      1°. de mate waarin hij zich overeenkomstig zijn programma als bedoeld in [artikel 17b, eerste en tweede lid][ref5],
      gedraagt;

      2°. de mate waarin het landelijk gastransportnet in evenwicht is;

      f. indien Onze Minister hem dit opdraagt, werkzaamheden te verrichten ter uitvoering van de taak, bedoeld in
      [artikel 52a][ref6], en

      g. voorzieningen te treffen, gericht op de beschikbaarheid van voldoende transportcapaciteit met het oog op
      voldoende transportzekerheid;

      h. indien Onze Minister hem dit opdraagt, werkzaamheden te verrichten ter uitvoering van [verordening 2017/1938]
      (31938R2017);

      i. samen te werken met buitenlandse instellingen die op grond van nationale wettelijke regels belast zijn met het
      beheer van een transmissiesysteem als bedoeld in artikel 2, onderdeel 4, van de richtlijn in geografische gebieden
      als bedoeld in artikel 12, derde lid, van verordening 715/2009 teneinde een concurrerende interne markt voor gas
      tot stand te brengen;

      j. te beschikken over één of meer geïntegreerde systemen in geografische gebieden als bedoeld in artikel 12, derde
      lid, van verordening 715/2009 waaraan twee of meer lidstaten meewerken voor de toewijzing van capaciteit en voor de
      controle op de beveiliging van het net;

      k. het voorzien in voldoende grensoverschrijdende capaciteit om te komen tot een geïntegreerde Europese
      infrastructuur die voldoet aan de economisch redelijke en technisch haalbare vraag naar capaciteit, rekening
      houdend met de leverings- en voorzieningszekerheid van gas;

      l. de taken te vervullen die voortvloeien uit verordening 715/2009;

      m. samen te werken met Acer;

      n. gas dat op het door hem beheerde gastransportnet wordt ingevoed te bewerken, te behandelen of te mengen teneinde
      te voldoen aan de afleverspecificaties, opgenomen in de ministeriële regeling, bedoeld in [artikel 11][ref7];

      o. gas te weren dat voldoet aan de invoedspecificaties, opgenomen in de ministeriële regeling, bedoeld in
      [artikel 11][ref8], maar waarvoor de uitvoering van de taak, bedoeld in onderdeel n, redelijkerwijs niet van de
      netbeheerder van het landelijk gastransportnet kan worden gevergd;

      p. in afwijking van onderdeel o en [artikel 10, derde lid, onderdeel d][ref9], op verzoek van een afnemer het
      gas dat door die afnemer wordt ingevoed met gebruikmaking van het gastransportnet te bewerken, te behandelen
      of te mengen teneinde te voldoen aan de afleverspecificaties, opgenomen in de ministeriële regeling, bedoeld in
      [artikel 11][ref10], tegen een tarief dat de doelmatige kosten dekt;

      q. jaarlijks voor een bij ministeriële regeling te bepalen datum, na raadpleging van de representatieve
      organisaties van netgebruikers een raming aan Onze Minister aan te bieden van:

      1°. de in een gasjaar benodigde hoeveelheid laagcalorisch gas en de daarvoor benodigde capaciteit die uit
      het gebied dat is aangewezen in de bij koninklijk besluit van 30 mei 1963, nr. 39 (Stcrt. 126) verleende
      winningsvergunning, benodigd is om eindafnemers van de geraamde hoeveelheid laagcalorisch gas te voorzien, waarbij
      alle beschikbare middelen en methoden die deze hoeveelheid minimaliseren worden betrokken, en

      2°. de vraagontwikkeling voor de komende tien jaar naar laagcalorisch gas;

      r. van technische overeenkomsten over interconnectoren met derde landen kennis te geven aan de Autoriteit Consument
      en Markt.

      2 Indien de netbeheerder van het landelijk gastransportnet bij de uitvoering van zijn wettelijke taken energie
      inkoopt, doet hij dit op basis van een transparante, niet-discriminatoire en marktconforme procedure.

      3 De rechtspersoon, aangewezen op grond van het vijftiende lid, is verplicht de netbeheerder van het landelijk
      gastransportnet een aanbod met redelijke tarieven en voorwaarden te doen tot levering aan de door de netbeheerder
      van het landelijk gastransportnet ter uitvoering van zijn wettelijke taken benodigde hoeveelheden gas in de door
      hem gevraagde hoeveelheden en op de door hem gewenste tijdstippen.

      4 Bij algemene maatregel van bestuur worden regels gesteld ter uitvoering van de taak, bedoeld in het eerste
      lid, onderdeel a en [artikel 10, derde lid, onderdeel c][ref11]. Deze regels hebben mede betrekking op de
      wijze waarop enerzijds de netbeheerder van het landelijk gastransportnet, en anderzijds gasproductiebedrijven,
      gasopslagbedrijven, LNG-bedrijven, andere netbeheerders, leveranciers en afnemers zich jegens elkaar gedragen.

      5 De Autoriteit Consument en Markt brengt advies uit over het ontwerp van de algemene maatregel van bestuur,
      bedoeld in het vierde lid. De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel
      van bestuur wordt niet gedaan dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de
      gelegenheid is geboden om binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen
      ter kennis van Onze Minister te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der
      Staten-Generaal overgelegd.

      6 Van een besluit als bedoeld in het eerste lid, onderdeel f, wordt mededeling gedaan door plaatsing in de
      Staatscourant.

      7 Indien de netbeheerder van het landelijk gastransportnet deelneemt aan een gemeenschappelijke onderneming waaraan
      ook een verticaal geïntegreerde buitenlandse instelling die op grond van nationale wettelijke regels belast is
      met het beheer van een transmissiesysteem als bedoeld in artikel 2, onderdeel 4, van de richtlijn deelneemt,
      draagt de netbeheerder van het landelijk gastransportnet er zorg voor dat de gemeenschappelijke onderneming een
      nalevingsprogramma ontwerpt, door Acer laat goedkeuren en implementeert met maatregelen die moeten worden genomen
      om discriminerend en concurrentieverstorend gedrag uit te sluiten.

      8 Voordat de netbeheerder van het landelijk gastransportnet congestiebeheersprocedures hanteert voor
      interconnectiepunten, legt hij deze procedures ter goedkeuring voor aan de Autoriteit Consument en Markt.

      9 De raming, bedoeld in het eerste lid, onderdeel q, onder 1°, bevat tenminste een beschrijving van:

      a. de verwachte behoefte aan laagcalorisch gas op basis van mogelijke temperatuurscenario’s;

      b. de optimale inzet van andere middelen en methoden, waaronder:

      1°. een minimaal percentage van de beschikbare conversiecapaciteit per gasjaar om gas met een hogere energie-inhoud
      om te zetten naar gas met een lagere energie-inhoud,

      2°. het mengen van gas met een hogere energie-inhoud bij gas met een lagere energie-inhoud,

      3°. gasopslaginstallaties en LNG-installaties, en

      4°. de verwachte productie van gas uit hernieuwbare energiebronnen;

      c. de verwachte vraag naar gas van verschillende categorieën eindafnemers.

      10 De raming, bedoeld in het eerste lid, onderdeel q, onder 2°, bevat tenminste een beschrijving van:

      a. de verwachte vraag naar laagcalorisch gas waarbij een onderscheid in vraag tussen verschillende categorieën
      eindafnemers wordt aangegeven;

      b. de verwachte inzet van de middelen en methoden.

      11 De netbeheerder van het landelijk gastransportnet meldt een langdurige en substantiële afwijking van de inzet
      van de middelen en methoden of de vraag naar laagcalorisch gas ten opzichte van de raming aan Onze Minister.

      12 Bij ministeriële regeling wordt de datum, bedoeld in het eerste lid, onderdeel q, en het percentage, bedoeld in
      het negende lid, onderdeel b, vastgesteld en kunnen nadere regels worden gesteld omtrent de raming, bedoeld in het
      eerste lid, onderdeel q.

      13 De netbeheerder van het landelijk gastransportnet zendt binnen een maand na afloop van een gasjaar een
      rapportage aan Onze Minister over de wijze waarop de middelen en methoden, bedoeld in het negende lid, onderdeel b,
      zijn ingezet.

      14 De netbeheerder van het landelijk gastransportnet voert zijn wettelijke taken, bedoeld in het eerste lid,
      onderdelen b en q, zo uit dat dit optimaal bijdraagt aan het minimaliseren van de winning van gas uit het
      Groningenveld.

      15 Onze Minister wijst een rechtspersoon aan voor de taak, bedoeld in het derde lid.


