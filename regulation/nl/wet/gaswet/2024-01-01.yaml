    text: |-
      1 Bij het verlenen van een ontheffing als bedoeld in [artikel 1i][ref1] kan worden bepaald dat een tarief, waarvoor
      een experiment zal worden uitgevoerd, in rekening wordt gebracht bij de afnemers of programmaverantwoordelijken die
      deelnemen aan het experiment waarvoor de ontheffing is verleend.

      2 Het tarief, bedoeld in het eerste lid, kan verschillen voor de verschillende afnemers die deelnemen aan het
      experiment waarvoor de ontheffing is verleend.


