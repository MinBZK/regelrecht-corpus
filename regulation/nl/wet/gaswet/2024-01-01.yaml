  - number: 12g
    text: |-
      1 Nadat de termijn, bedoeld in [artikel 12e, derde lid][ref1], is verstreken, stelt de Autoriteit Consument
      en Markt de tariefstructuren of de voorwaarden vast met inachtneming van de voorstellen van de gezamenlijke
      netbeheerders en van [artikel 12f, eerste, tweede en derde lid][ref2]. Indien een voorstel als bedoeld in artikel
      12e niet binnen de daarbij aangegeven termijn aan de Autoriteit Consument en Markt is gezonden, stelt deze de
      tariefstructuren of de voorwaarden uit eigen beweging vast met inachtneming van artikel 12f, eerste, tweede en
      derde lid.

      2 Indien de gezamenlijke netbeheerders niet binnen de termijn, bedoeld in [artikel 12e, derde lid][ref3], hun
      zienswijze op een ontwerp van een besluit als bedoeld in dat artikel aan de Autoriteit Consument en Markt kenbaar
      maken, stelt deze het besluit tot wijziging van de tariefstructuren of de voorwaarden uit eigen beweging vast met
      inachtneming van [artikel 12f, eerste en tweede lid][ref4].


