      1 Onverminderd de verplichting tot het opstellen van een jaarverslag, bedoeld in
      [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], brengt de Autoriteit Consument en
      Markt jaarlijks verslag uit over de uitvoering van haar taken, bedoeld in [artikel 1a, eerste lid][ref2]. Het
      verslag bevat een overzicht van de behaalde resultaten en genomen maatregelen.

      2 De Autoriteit Consument en Markt zendt het verslag toe aan Onze Minister, Acer en de Europese Commissie.


