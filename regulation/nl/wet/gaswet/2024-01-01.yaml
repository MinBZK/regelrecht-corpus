  - number: '20'
    text: |-
      In het geval van een landsgrensoverschrijdend geschil is de Autoriteit Consument en Markt onbevoegd te
      beslissen op een klacht als bedoeld in [artikel 19][ref1], als de netbeheerder, de interconnector-beheerder, het
      gasopslagbedrijf of het LNG-bedrijf waartegen de klacht is gericht onder de rechtsmacht van een andere lidstaat
      van de Europese Unie valt dan wel voor zover het betreft een interconnector-beheerder, onder de rechtsmacht van een
      ander land valt.


