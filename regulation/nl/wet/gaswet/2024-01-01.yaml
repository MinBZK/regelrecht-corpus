  - number: '16'
    text: |-
      1 De Autoriteit Consument en Markt kan op aanvraag de netbeheerder van het landelijk gastransportnet tijdelijk
      ontheffing verlenen van de in [artikel 14, eerste lid][ref1], bedoelde verplichting indien een verzoek om transport
      is gericht tot die netbeheerder en die netbeheerder of een verwant bedrijf ernstige economische en financiële
      moeilijkheden ondervindt of dreigt te ondervinden in verband met één of meer reeds aangegane overeenkomsten die een
      verplichting bevatten tot afname van een bepaalde hoeveelheid gas of, bij gebreke daarvan, tot het betalen van een
      vergoeding ter waarde van die hoeveelheid gas of van een deel daarvan.

      2 In een verzoek om ontheffing worden de aard en de omvang van de verwachte moeilijkheden aangegeven, alsmede de
      inspanningen die de netbeheerder van het landelijk gastransportnet onderscheidenlijk het verwant bedrijf heeft
      geleverd om die moeilijkheden op te lossen.

      3 Bij het beoordelen van de aanvraag houdt de Autoriteit Consument en Markt rekening met artikel 48, eerste lid,
      tweede alinea, en derde lid, van de richtlijn.

      4 De Autoriteit Consument en Markt beslist zo spoedig mogelijk op de aanvraag, doch uiterlijk binnen vier maanden
      na ontvangst van de aanvraag.

      5 Indien de Autoriteit Consument en Markt een ontheffing als bedoeld in het eerste lid heeft verleend, stelt zij de
      Europese Commissie daarvan onverwijld in kennis, onder overlegging van de daarvoor van belang zijnde gegevens.

      6 Indien een definitief besluit van de Commissie als bedoeld in artikel 48, tweede lid, van de richtlijn strekt tot
      wijziging of intrekking van de ontheffing is de Autoriteit Consument en Markt verplicht daaraan onverwijld gevolg
      te geven.

      7 Van een besluit als bedoeld in het vierde lid wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel14
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel16
