  - number: '4'
    text: |-
      1 De netbeheerder, niet zijnde de netbeheerder van het landelijk gastransportnet, meldt aan Onze Minister
      onverwijld na zijn aanwijzing zijn naam en adres en de naam en het adres van zijn aandeelhouders en zendt aan Onze
      Minister een beschrijving van het gastransportnet dat door hem wordt beheerd. Tenminste eenmaal per jaar meldt hij
      Onze Minister iedere wijziging van de namen of adressen en zendt hij hem een beschrijving van de wijziging van het
      gastransportnet dat door hem wordt beheerd.

      2 De aanwijzing behoeft de instemming van Onze Minister. Onze Minister onthoudt zijn instemming of kan
      voorschriften verbinden aan de instemming indien niet is voldaan aan de [artikelen 2c][ref1], [3][ref2],
      [3b][ref3] of [3c][ref4], of indien de aangewezen netbeheerder in onvoldoende mate in staat is of zal zijn om
      aan een verplichting als bedoeld in de [artikelen 1h][ref5] en [10e][ref6] te voldoen, om een taak als bedoeld
      in de [artikelen 10][ref7], [10b][ref8], [42][ref9] of [54a][ref10] uit te voeren, indien een netbeheerder niet
      voldoet aan een verbod als bedoeld in de [artikelen 10Aa][ref11] of [10c][ref12] dan wel, indien een netbeheerder
      deel uitmaakt van een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref13], de met hem
      verbonden groepsmaatschappij niet voldoet aan het bepaalde bij of krachtens [artikel 10d][ref14].

      3 Indien Onze Minister voorschriften verbindt aan zijn instemming, strekken deze er slechts toe de geconstateerde
      tekortkomingen, bedoeld in het tweede lid, weg te nemen.


