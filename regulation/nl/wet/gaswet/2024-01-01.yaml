      De Autoriteit Consument en Markt kan een bindende gedragslijn opleggen in verband met de naleving van
      het bepaalde bij of krachtens deze wet, met uitzondering van de artikelen en onderwerpen, bedoeld in
      [artikel 1c, eerste en tweede lid][ref1], en in verband met [verordening 2019/942](32842R2019), verordening
      715/2009, [verordening 2017/1938](31938R2017) en verordening 1227/2100.


