  - number: 3a
    text: |-
      1 De statuten van de netbeheerder van het landelijk gastransportnet bevatten in ieder geval:

      a. de instelling van een raad van commissarissen,

      b. de bepaling dat de leden van het bestuur en de meerderheid van de leden van de raad van commissarissen
      direct noch indirect een binding hebben met een rechtspersoon die de productie, aankoop of levering van gas of
      elektriciteit verricht of met een aandeelhouder van die rechtspersoon,

      c. de bepaling dat aan de goedkeuring van de raad van commissarissen ten minste zijn onderworpen
      de besluiten van het bestuur van de rechtspersoon, bedoeld in [artikel 164, eerste lid][ref1],
      of [274, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].

      2 Indien de netbeheerder van het landelijk gastransportnet een afhankelijke maatschappij is in de zin van
      [artikel 152][ref3] of [artikel 262 van Boek 2 van het Burgerlijk Wetboek][ref4], behoeven de statuten, in
      afwijking van het eerste lid, onderdeel a, niet te voorzien in de instelling van een raad van commissarissen.

      3 In het in het tweede lid bedoelde geval:

      a. voldoet een rechtspersoon waarvan de netbeheerder van het landelijk gastransportnet een afhankelijke
      maatschappij is aan de in het eerste lid, aanhef en onderdelen a en b, genoemde eisen;

      b. beschikt de raad van commissarissen van de rechtspersoon, bedoeld in onderdeel a, waarvan de netbeheerder van
      het landelijk gastransportnet een afhankelijke maatschappij is over de bevoegdheden, bedoeld in het eerste lid,
      onderdeel c, ten aanzien van het bestuur van de netbeheerder van het landelijk gastransportnet.

      4 De netbeheerder van het landelijk gastransportnet mag een activiteit als bedoeld in [artikel 3, eerste lid][ref5]
      uitoefenen indien die activiteit noodzakelijk is voor de uitvoering van zijn wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel164
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel274
