  - number: 5a
    text: |-
      1 Onze Minister kan de netbeheerder aanzeggen dat hij vanaf een bepaald tijdstip de opdrachten dient op te volgen
      die aan hem worden verstrekt door een door Onze Minister aangewezen persoon. Bij de aanzegging geeft Onze Minister
      aan ter bescherming van welk belang de aanzegging geschiedt. Bij de aanzegging kunnen voorschriften en beperkingen
      worden gesteld aan de te geven opdrachten. De aangewezen persoon verstrekt uitsluitend opdrachten ter bescherming
      van het belang, bedoeld in de tweede volzin.

      2 De netbeheerder verschaft de door Onze Minister aangewezen persoon desgevraagd alle medewerking.

      3 Onze Minister kan te allen tijde de door hem aangewezen persoon vervangen door een andere persoon.

      4 De door Onze Minister aangewezen persoon oefent zijn bevoegdheid uit gedurende een door Onze Minister in de
      aanzegging bepaalde termijn. Deze termijn bedraagt ten hoogste zes maanden indien het betreft een aanzegging als
      bedoeld in artikel 5, derde lid, onderdeel b. Deze termijn kan eenmaal met ten hoogste zes maanden worden verlengd.

      5 Voor schade ten gevolge van handelingen die zijn verricht in strijd met een opdracht als bedoeld in het eerste
      lid, zijn bestuurders persoonlijk aansprakelijk tegenover de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel5a
  - number: '6'
    text: |-
      1 Degenen, bedoeld in [artikel 2, eerste of achtste lid][ref1], kunnen met inachtneming van een redelijke termijn
      de aanwijzing van een netbeheerder vervangen door de aanwijzing van een andere naamloze of besloten vennootschap
      als netbeheerder.

      2 Ingeval van fusie, splitsing, ontbinding of faillissement van de vennootschap die als netbeheerder
      is aangewezen, vervalt de aanwijzing als netbeheerder van rechtswege en wijzen degenen, bedoeld in
      [artikel 2, eerste of achtste lid][ref2], volgens de procedure van artikel 2 een naamloze of besloten vennootschap
      als netbeheerder aan. Deze vennootschap kan dezelfde zijn als de vennootschap die daarvoor als netbeheerder was
      aangewezen.

      3 Degenen, bedoeld in [artikel 2, eerste of achtste lid][ref3], wijzen voor afloop van de periode, bedoeld in
      artikel 2, eerste of negende lid, een naamloze of besloten vennootschap als netbeheerder aan voor de daarop
      aansluitende periode. Deze vennootschap kan dezelfde zijn als die daarvoor als netbeheerder was aangewezen.

      4 De [artikelen 2 tot en met 5][ref4] zijn van overeenkomstige toepassing op de aanwijzing als netbeheerder,
      bedoeld in het eerste, tweede of derde lid.


