        hoofdstuk: '3'
  - number: '22'
    text: |-
      1 Met inachtneming van de krachtens [artikel 21][ref1] vastgestelde regels zendt een representatief deel van de
      ondernemingen die zich bezighouden met het transporteren, leveren of meten van gas aan de Autoriteit Consument
      en Markt een voorstel voor de door hen jegens elkaar en afnemers in het kader van administratieve processen te
      hanteren voorwaarden met betrekking tot de wijze waarop de met die administratieve processen samenhangende gegevens
      worden vastgelegd, uitgewisseld of gebruikt of met betrekking tot de wijze waarop en de termijn waarbinnen die
      gegevens worden bewaard, waaronder in ieder geval voorwaarden die bepalen dat:

      a. bij een wisseling van leverancier, de beoogde leverancier, en

      b. bij een verhuizing, de leverancier van de afnemer

      verantwoordelijk is voor het verzamelen van de meetgegevens van de afnemer.

      2 Ondernemingen die een voorstel doen, voeren overleg over dit voorstel met representatieve organisaties van
      partijen op de gasmarkt.

      3 In het voorstel dat aan de Autoriteit Consument en Markt wordt gezonden, geven de ondernemingen aan welke
      gevolgtrekkingen zij hebben verbonden aan de zienswijzen die de organisaties, bedoeld in het tweede lid, naar voren
      hebben gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel21
