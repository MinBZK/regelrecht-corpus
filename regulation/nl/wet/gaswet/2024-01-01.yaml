    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot een of meer voorwaarden, bedoeld in
      [artikel 22, eerste lid][ref1], waaronder in ieder geval regels over de verantwoording in de toelichting op de
      jaarrekening over het voldoen aan de voorwaarden die krachtens dit hoofdstuk zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel22
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel21
