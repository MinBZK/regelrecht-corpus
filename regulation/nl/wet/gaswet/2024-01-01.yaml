  - number: '11'
    text: |-
      1 Gas dat op het gastransportnet wordt ingevoed of door netbeheerders op exit-punten wordt afgeleverd, voldoet
      aan bij ministeriële regeling te stellen eisen, welke eisen kunnen verschillen voor invoed- en exitpunten en naar
      energie-inhoud, drukniveau en regio.

      2 De in het eerste lid bedoelde eisen hebben in ieder geval betrekking op de veiligheid, doelmatigheid, waaronder
      in ieder geval wordt verstaan minimalisatie van maatschappelijke kosten, betrouwbaarheid en de duurzaamheid van het
      transport en de toepassing van gas.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel11
  - number: '12'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld met betrekking tot de tariefstructuren en voorwaarden als bedoeld
      in de [artikelen 12a][ref1] en [12b][ref2].

      2 De Autoriteit Consument en Markt brengt advies uit over het ontwerp van de in het eerste lid bedoelde regels.

      3 Een krachtens het eerste lid vastgestelde ministeriële regeling wordt aan de beide kamers der Staten-Generaal
      overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij
      besluit van Onze Minister wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het
      onderwerp van de ministeriële regeling bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel
      van wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de beide
      kamers van de Staten-Generaal besluit het voorstel niet aan te nemen, wordt de ministeriële regeling ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
