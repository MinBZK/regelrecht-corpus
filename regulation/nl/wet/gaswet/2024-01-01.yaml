    text: |-
      1 Een netbeheerder is verplicht een afzonderlijke boekhouding te voeren voor de uitvoering van de bij of krachtens
      deze wet aan hem toegekende taken, met uitzondering van de taken, bedoeld in artikel 10b. Indien de netbeheerder
      werkzaamheden verricht als bedoeld in [artikel 10Aa][ref1] of [10b][ref2], voert hij daarvoor eveneens, al dan niet
      op geconsolideerde basis, een afzonderlijke boekhouding.

      2

      3 De afzonderlijke boekhouding bevat:

      a. een balans en een winst- en verliesrekening;

      b. een specificatie van de toerekening van de activa en de passiva en de lasten en baten aan activiteiten als
      bedoeld in het eerste en tweede lid,

      c. een specificatie van de inkomsten verkregen uit de eigendom van het door hem beheerde gastransportnet, en

      d. een toelichting op de gebruikte regels voor de afschrijving.

      4 Het gasbedrijf geeft in de boekhouding aan welke methoden en criteria bij het opstellen daarvan zijn gehanteerd.

      5 Het toerekenen van kosten aan activiteiten als bedoeld in het eerste en tweede lid geschiedt in overeenstemming
      met het gebruik van financiële of andere middelen voor die activiteiten.

      6 Wijzigingen in de in het derde lid bedoelde regels voor de afschrijving worden met redenen omkleed in de
      boekhouding vermeld.

      7 In de toelichting op de jaarrekening wordt elk verwant bedrijf waarmee een gasbedrijf een overeenkomst heeft
      gesloten waarvan de opbrengst of de kosten een bedrag van € 4 500 000 te boven gaat, vermeld. Daarbij wordt tevens
      per bedrijf het aantal van die overeenkomsten vermeld.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de inrichting van de boekhouding
      voor de in het eerste lid bedoelde activiteiten.

      9 Het eerste tot en met het achtste lid zijn niet van toepassing op gasbedrijven die uitsluitend

      a. gas winnen uit biomassa of uit andere niet-fossiele bronnen en de hoeveelheid gewonnen gas per jaar niet meer
      bedraagt dan 10 000 000 m3 of

      b. anders dan bedrijfsmatig gas leveren overeenkomstig de in [artikel 43, tweede lid, onderdeel b][ref3], bedoelde
      regels.

      10 Indien een gasbedrijf niet reeds uit hoofde van een wettelijke verplichting zijn jaarrekening of een daarmee
      overeenkomend financieel overzicht openbaar maakt, legt het zijn jaarrekening of dat overzicht voor een ieder ter
      inzage op het kantoor van zijn hoofdvestiging.

      11 Een netbeheerder publiceert jaarlijks:

      a. voor 1 oktober op geschikte wijze een verslag van de afzonderlijke boekhouding, bedoeld in het tweede lid over
      het daaraan voorafgaande kalenderjaar;

      b. een verklaring waaruit blijkt dat de financiële verhouding tussen de netbeheerder en een met hem verbonden
      groepsmaatschappij voldoet aan het bepaalde bij of krachtens [artikel 10c, eerste lid][ref4];

      c. de gegevens waaruit blijkt dat de netbeheerder voldoet aan de regels omtrent een goed financieel beheer, bedoeld
      in [artikel 10e, eerste lid][ref5].

      12 Een leverancier houdt de boekhouding, bedoeld in het eerste lid, gedurende vijf jaar ter beschikking van de
      Autoriteit Consument en Markt en de Europese Commissie.

      13 De Autoriteit Consument en Markt kan informatie uit de boekhouding van de leverancier ter beschikking te stellen
      aan marktpartijen indien is voldaan aan artikel 44, derde lid, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10Aa
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10b
