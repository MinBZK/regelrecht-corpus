  - number: 10i
    text: |-
      In aanvulling op [artikel 10, zesde lid][ref1], heeft de netbeheerder van het landelijk gastransportnet tot
      taak om de aansluiting van een afnemer die ingevolge [artikel 10g, tweede lid][ref2], heeft gemeld dat diens
      aansluiting omgeschakeld moet worden, om te schakelen overeenkomstig de planning of aangepaste planning,
      bedoeld in [artikel 10k, eerste onderscheidenlijk tweede of derde lid][ref3], of, indien op grond van
      [artikel 10l, eerste lid][ref4], een ontheffing is verleend aan de betrokken afnemer, overeenkomstig de aangepaste
      planning die aan die ontheffing ten grondslag ligt.


