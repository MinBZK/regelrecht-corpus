  - number: '81'
    text: |-
      1 De Autoriteit Consument en Markt stelt na overleg met de gezamenlijke netbeheerders en met representatieve
      organisaties van partijen op de gasmarkt, met inachtneming van het belang dat door middel van marktwerking ten
      behoeve van afnemers de doelmatigheid van de bedrijfsvoering en de meest doelmatige kwaliteit van het transport
      worden bevorderd en rekening houdend met het belang van voorzieningszekerheid, duurzaamheid en een redelijk
      rendement op investeringen, de methode tot vaststelling van de korting ter bevordering van de doelmatige
      bedrijfsvoering, van de kwaliteitsterm en van het rekenvolume van elke tariefdrager van elke dienst waarvoor een
      tarief wordt vastgesteld, vast. Het besluit tot vaststelling van de methode geldt voor een periode van ten minste
      drie en ten hoogste vijf jaar.

      2 De korting ter bevordering van de doelmatige bedrijfsvoering heeft onder meer ten doel te bereiken dat de
      netbeheerder in ieder geval geen rendement kan behalen dat hoger is dan in het economisch verkeer gebruikelijk en
      dat de gelijkwaardigheid in de doelmatigheid van de netbeheerders wordt bevorderd.

      3 De kwaliteitsterm geeft de aanpassing van de tarieven in verband met de geleverde kwaliteit aan en heeft ten doel
      netbeheerders te stimuleren om de kwaliteit van hun transportdienst te optimaliseren.

      4 De rekenvolumina die een netbeheerder gebruikt bij het voorstel, bedoeld in [artikel 81b][ref1], zijn gebaseerd
      op daadwerkelijk gefactureerde volumina in eerdere jaren, of worden door de Autoriteit Consument en Markt geschat
      indien deze betrekking hebben op nieuwe tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel81b
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel81
    references:
