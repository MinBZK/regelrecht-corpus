  - number: 7a
    text: |-
      1 Een netbeheerder stelt periodiek een investeringsplan op waarin alle noodzakelijke uitbreidingsinvesteringen en
      vervangingsinvesteringen worden beschreven en onderbouwd.

      2 Een netbeheerder legt een ontwerpinvesteringsplan achtereenvolgens voor:

      a. aan een ieder ter consultatie en verwerkt de gegeven reacties op de ingediende zienswijzen in het plan,

      b. aan de Autoriteit Consument en Markt en, voor zover het een ontwerpinvesteringsplan voor het landelijk
      gastransportnet betreft, aan Onze Minister.

      3 De Autoriteit Consument en Markt toetst of een netbeheerder in redelijkheid tot het ontwerpinvesteringsplan heeft
      kunnen komen.

      4 Onze Minister toetst of de netbeheerder van het landelijk gastransportnet zich in voldoende mate rekenschap heeft
      gegeven van ontwikkelingen in de energiemarkt.

      5 Een netbeheerder stelt het investeringsplan vast en verantwoordt daarbij hoe de resultaten van consultatie en
      toetsing zijn verwerkt.

      6 Een netbeheerder voert de in het investeringsplan opgenomen investeringen uit.

      7 Het tweede tot en met zesde lid zijn van overeenkomstige toepassing bij een significante wijziging.

      8 In het investeringsplan opgenomen investeringen worden noodzakelijk geacht voor de uitvoering van de op grond van
      deze wet aan de netbeheerder toegekende taken.

      9 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. de termijn waarvoor het investeringsplan geldt,

      b. de nadere inhoud en het aggregatieniveau van een investeringsplan,

      c. de procedure waarlangs een investeringsplan tot stand komt,

      d. de wijze waarop de noodzaak van investeringen wordt aangetoond,

      e. het tijdstip en de frequentie waarmee een investeringsplan dan wel onderdelen daarvan, wordt opgesteld dan wel
      aangepast,

      f. de wijze waarop en bij wie een ontwerpinvesteringsplan wordt geconsulteerd,

      g. de wijze waarop bekendheid wordt gegeven aan een investeringsplan.

      10 De regels, bedoeld in het negende lid, kunnen verschillen voor verschillende soorten gastransportnetten,
      verschillende delen van gastransportnetten met een verschillend drukniveau en verschillende netbeheerders.

      11 Onze Minister kan een bindende gedragslijn opleggen in het kader van de verplichting om rekenschap te geven van
      ontwikkelingen in de energiemarkt, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel7a
  - number: '8'
    text: |-
      1 Een netbeheerder:

      a. hanteert een doeltreffend kwaliteitsborgingssysteem voor de uitvoering van de op grond van deze wet aan hem
      toegekende taken en

      b. beschikt over een document waarin is aangegeven op welke wijze hij uitvoering geeft aan onderdeel a.

      2 Onder een doeltreffend kwaliteitsborgingssysteem wordt verstaan het geheel van samenhangende plannen, processen
      en procedures dat een netbeheerder in staat stelt de kwaliteit, waaronder tevens wordt begrepen de veiligheid en
      betrouwbaarheid, van zijn gastransportnet en de uitvoering van de op grond van deze wet aan hem toegekende taken te
      registreren, te monitoren en waar nodig bij te sturen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld, die kunnen verschillen voor
      verschillende gastransportnetten, verschillende delen van gastransportnetten met een verschillend drukniveau en
      verschillende netbeheerders, over:

      a. het kwaliteitsborgingsysteem;

      b. de onderwerpen die in het document, bedoeld in het eerste lid, onderdeel b, ten minste moeten zijn opgenomen;

      c. het verstrekken van gegevens en inlichtingen over het kwaliteitsborgingssysteem of het verstrekken van het
      document bedoeld in het eerste lid, onderdeel b, aan de Autoriteit Consument en Markt of aan Onze Minister;

      d. het bewaren en openbaar maken van gegevens over het kwaliteitsborgingssysteem of van het document bedoeld in het
      eerste lid;

      e. evaluatie van het kwaliteitsborgingssysteem.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel8
  - number: 8a
    text: |-
      1 Indien zich met betrekking tot een gastransportnet een voorval voordoet of heeft voorgedaan, waardoor nadelige
      gevolgen voor de mens of het milieu zijn ontstaan of dreigen te ontstaan, meldt de netbeheerder dat voorval zo
      spoedig mogelijk aan Onze Minister.

      2 Bij algemene maatregel van bestuur worden regels gesteld ten aanzien van door de netbeheerder te nemen
      maatregelen ten aanzien van voorvallen.

      3 Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de meldplicht, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel8a
  - number: 8b
    text: |-
      Onze Minister kan een netbeheerder een bindende aanwijzing geven in het kader van de bescherming van zijn
      gastransportnet tegen een mogelijke invloed van buitenaf, bedoeld in [artikel 10, elfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
