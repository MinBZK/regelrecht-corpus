  - number: 2b
    text: |-
      1 [Artikel 2, eerste, tweede, derde en zevende lid][ref1], is van overeenkomstige toepassing voor de aanwijzing
      van een interconnector-beheerder, met dien verstande dat in afwijking van artikel 2, eerste lid, de interconnector-
      beheerder geen naamloze of besloten vennootschap behoeft te zijn. Voor een interconnector-beheerder zijn het vijfde
      en zesde lid van overeenkomstige toepassing.

      2 [Artikel 6, eerste tot en met derde lid][ref2], is van overeenkomstige toepassing, met dien verstande dat de
      interconnector-beheerder geen naamloze of besloten vennootschap behoeft te zijn.

      3 [Artikel, 3, eerste en vijfde lid][ref3], [3c][ref4],[10, eerste, tweede en vierde lid][ref5],
      [10a, eerste lid, onderdeel m, en achtste lid][ref6], [12 tot en met 13][ref7] en [14 tot en met 16][ref8],
      [19][ref9], [20][ref10] en [37][ref11] zijn van overeenkomstige toepassing. [Artikel 82][ref12] is van
      overeenkomstige toepassing, rekening houdend met het grensoverschrijdende karakter en de regulering van het andere
      land.

      4 Indien de netbeheerder van het landelijk gastransportnet is aangewezen als interconnector-beheerder zijn, in
      afwijking van het vierde en vijfde lid, de bij of krachtens de Gaswet voor de netbeheerder van het landelijk
      gastransportnet geldende bepalingen van overeenkomstige toepassing, rekening houdend met het grensoverschrijdende
      karakter en de regulering van het andere land.

      5 Indien een persoon uit een derde land zeggenschap heeft over een eigenaar van een interconnector
      of een interconnector-beheerder, besluit de Autoriteit Consument en Markt in het besluit, bedoeld in
      [artikel 2, tweede lid][ref13], op verzoek en volgens de procedure van artikel 11 van de richtlijn of is voldaan
      aan artikel 11, derde lid, van de richtlijn.

      6 Bij algemene maatregel van bestuur worden ter implementatie van artikel 9 van de richtlijn nadere regels gesteld
      voor interconnector-beheerders.

      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de werking en
      exploitatie van een landsgrensoverschrijdend net dat de grens met een derde land overschrijdt en de beheerder
      van dat net, voor zover deze regels nodig zijn voor het functioneren en de exploitatie van dat net of voor het
      functioneren van die beheerder.


