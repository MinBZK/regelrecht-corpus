  - number: 44a
    text: |-
      1 Een leverancier schakelt een meetbedrijf in voor het collecteren, valideren en vaststellen van de meetgegevens
      die betrekking hebben op afnemers als bedoeld in [artikel 43, eerste lid][ref1].

      2 In afwijking van het eerste lid worden de meetgegevens die betrekking hebben op:

      a. een rechtspersoon of een natuurlijke persoon die handelt in de uitoefening van een beroep of bedrijf, en

      b. behalve één of meer aansluitingen met een capaciteit van ten hoogste 40 m3(n) per uur ten minste één aansluiting
      heeft met een capaciteit groter dan 40 m3(n) per uur, gecollecteerd, gevalideerd en vastgesteld door het
      meetbedrijf dat die rechtspersoon of natuurlijke persoon daartoe inschakelt.

      3 Indien een leverancier voor de levering van gas aan afnemers als bedoeld in [artikel 43, eerste lid][ref2],
      factureert op basis van meetgegevens, maakt hij gebruik van meetgegevens die het meetbedrijf heeft gecollecteerd,
      gevalideerd en vastgesteld.

      4 Een meetbedrijf verstrekt slechts meetgegevens aan anderen dan de betrokken afnemer als bedoeld in
      [artikel 43, eerste lid][ref3], of de betrokken leverancier indien die ander de desbetreffende meetgegevens op
      basis van [artikel 8 van de Wet bescherming persoonsgegevens][ref4] mag verwerken.


