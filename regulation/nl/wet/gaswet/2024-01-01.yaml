  - number: '82'
    text: |-
      1 In afwijking van [artikel 80][ref1] worden de tarieven ter uitvoering van de taken door de
      netbeheerder van het landelijk gastransportnet, genoemd in de [artikelen 1i][ref2], [10][ref3],
      [10a, eerste lid, onderdeel b, c en e][ref4], [10b][ref5] en [10i][ref6], alsmede de tarieven voor de transport
      ondersteunende diensten vastgesteld overeenkomstig dit artikel.

      2 Voor de taken van de netbeheerder van het gastransportnet, bedoeld in het eerste lid, met uitzondering van de
      taken genoemd in de [artikelen 1i][ref7] en [10b][ref8], stelt de Autoriteit Consument en Markt de methode van
      regulering vast, voor een periode van ten minste drie en ten hoogste vijf jaar, na overleg met de gezamenlijke
      netbeheerders en met representatieve organisaties van partijen op de gasmarkt, met inachtneming van het belang dat
      de doelmatigheid van de bedrijfsvoering en de meest doelmatige kwaliteit van de uitvoering van deze taken worden
      bevorderd en rekening houdend met het belang van voorzieningszekerheid, duurzaamheid en een redelijk rendement
      op investeringen.

      3 De netbeheerder van het landelijk gastransportnet zendt jaarlijks voor 1 september aan de Autoriteit Consument en
      Markt een voorstel voor de tarieven voor uitvoering van de taken genoemd in de [artikelen 1i][ref9], [10][ref10],
      [10a][ref11], [10b][ref12] en [10i][ref13], met inachtneming van:

      a. de tariefstructuren vastgesteld op grond van [artikel 12f][ref14] of [12g][ref15];

      b. de gemaakte kosten voor investeringen, bedoeld in [artikel 39e][ref16], of [54a, derde lid][ref17], voor zover
      deze kosten doelmatig zijn;

      c. de geschatte kosten voor de uitvoering van [artikel 1i][ref18], voor zover deze kosten doelmatig zijn en niet op
      grond van [artikel 82a][ref19] in rekening zijn gebracht via een tarief;

      d. de geschatte kosten voor de uitvoering van [artikel 10b][ref20], voor zover deze kosten doelmatig zijn en niet
      op grond van [artikel 82b][ref21] in rekening zijn gebracht via een tarief.

      4 De Autoriteit Consument en Markt stelt na overleg met de gezamenlijke netbeheerders en met representatieve
      organisaties een doelmatigheidskorting vast. Dit besluit geldt voor dezelfde periode als het besluit op grond
      van het tweede lid. De doelmatigheidskorting heeft tot doel om een doelmatige bedrijfsvoering te bevorderen. De
      Autoriteit Consument en Markt kan een beleidsregel vaststellen betreffende de beoordeling van de doelmatigheid van
      de kosten van de taak, bedoeld in [artikel 10a, eerste lid, onderdeel c][ref22].

      5 De Autoriteit Consument en Markt stelt jaarlijks de tarieven vast die kunnen verschillen voor de onderscheiden
      tariefdragers. Bij het vaststellen van de tarieven betrekt de Autoriteit Consument en Markt, in afwijking van het
      tweede en vierde lid, de geschatte kosten voor de uitvoering van wettelijke taken waarmee bij de vaststelling van
      een besluit als bedoeld in het tweede lid, geen rekening is gehouden, voor zover deze kosten doelmatig zijn.

      6 Indien een voorstel niet binnen de termijn, bedoeld in het derde lid, aan de Autoriteit Consument en Markt is
      gezonden stelt deze de tarieven uit eigen beweging vast met inachtneming van dit artikel.

      7 De vastgestelde tarieven treden in werking op een door de Autoriteit Consument en Markt te bepalen datum en
      gelden tot de datum van inwerkingtreding van het besluit tot vaststelling van de tarieven voor het volgende jaar.

      8 [Artikel 81c, tweede en vijfde lid][ref23], zijn van overeenkomstige toepassing.

      9 De netbeheerder van het landelijk gastransportnet publiceert de voor hem geldende tarieven op een geschikte
      wijze. Tevens legt de netbeheerder van het landelijk gastransportnet de voor hem geldende tarieven voor een ieder
      ter inzage in al zijn vestigingen.

      10 De Autoriteit Consument en Markt stelt een beleidsregel vast betreffende de beoordeling van doelmatigheid,
      bedoeld in het derde lid.

      11 Het derde tot en met negende lid is niet van toepassing op de taak van de netbeheerder van het landelijk
      gastransportnet, bedoeld in [artikel 10, eerste lid][ref24], voor zover:

      a. die taak betrekking heeft op het transport van gas dat de landsgrens overschrijdt, en

      b. de toedeling van die transportcapaciteit plaatsvindt door middel van een veiling of een andere marktconforme
      methode.

      12 De Autoriteit Consument en Markt houdt bij het vaststellen van de methode van regulering van de tarieven
      rekening met de opbrengsten uit een veiling of een andere marktconforme methode.

      13 Het derde tot en met negende lid is niet van toepassing op de taak van de netbeheerder van het landelijk
      gastransportnet, bedoeld in [artikel 10a, eerste lid, onderdeel p][ref25]. De Autoriteit Consument en Markt houdt
      bij het vaststellen van de methode van regulering van de tarieven rekening met de opbrengsten uit de taak van de
      netbeheerder van het landelijk gastransportnet, bedoeld in artikel 10a, eerste lid, onderdeel p.


