  - number: 10Ee
    text: |-
      Het is een ander dan een netbeheerder verboden de op grond van deze wet aan een netbeheerder toegekende taken,
      anders dan tijdelijke taken als bedoeld in [artikel 10b][ref1], uit te voeren, met uitzondering van:

      a. de werkzaamheden die een netbeheerder aan een ander uitbesteedt;

      b. de aanleg van leidingen en daarmee verbonden hulpmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10b
