  - number: 82b
    text: |-
      1 Bij het toekennen van een tijdelijke taak als bedoeld in [artikel 10b][ref1] kan worden bepaald dat een tarief,
      waarvoor die tijdelijke taak zal worden uitgevoerd, in rekening wordt gebracht bij de afnemers ten behoeve waarvan
      een netbeheerder de tijdelijke taak uitvoert.

      2 Het tarief, bedoeld in het eerste lid, kan verschillen voor de verschillende afnemers ten behoeve waarvan een
      netbeheerder de tijdelijke taak uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10b
