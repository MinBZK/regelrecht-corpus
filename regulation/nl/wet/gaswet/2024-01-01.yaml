    text: |-
      1 De Autoriteit Consument en Markt kan uit eigen beweging een ontwerp van een besluit maken tot wijziging van de
      voorwaarden, bedoeld in [artikel 22, eerste lid][ref1], of kan een representatief deel van de in artikel 22, eerste
      lid, bedoelde ondernemingen opdragen een daartoe strekkend voorstel voor te bereiden en aan haar toe te zenden.

      2 Ondernemingen als bedoeld in [artikel 22, eerste lid][ref2], en de representatieve organisaties, bedoeld in
      artikel 22, tweede lid, kunnen hun zienswijze op een dergelijk ontwerp van een besluit aan de Autoriteit Consument
      en Markt kenbaar maken binnen twaalf weken na het tijdstip waarop het ontwerp van het besluit is bekendgemaakt.

      3 Indien de in het tweede lid bedoelde ondernemingen en representatieve organisaties niet binnen
      de in het tweede lid genoemde termijn hun zienswijze op het ontwerp van het besluit kenbaar maken,
      stelt de Autoriteit Consument en Markt het besluit vast met inachtneming van de belangen, bedoeld in
      [artikel 12f, eerste lid, onderdelen b tot en met f][ref3], met artikel 12f, tweede lid, en met de regels, bedoeld
      in [artikel 21][ref4].

      4 Indien de ondernemingen, bedoeld in het eerste lid, niet binnen twaalf weken na toezending van de
      in het eerste lid bedoelde opdracht, een voorstel aan de Autoriteit Consument en Markt zenden, stelt
      de Autoriteit Consument en Markt de voorwaarden vast met inachtneming van de belangen, bedoeld in
      [artikel 12f, eerste lid, onderdelen b tot en met f][ref5], met artikel 12f, tweede lid, en met de regels, bedoeld
      in [artikel 21][ref6].


