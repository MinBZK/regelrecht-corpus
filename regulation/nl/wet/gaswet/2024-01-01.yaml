  - number: 81b
    text: |-
      1 Iedere netbeheerder die het transport van gas verricht dat bestemd is voor levering aan afnemers zendt jaarlijks
      voor 1 oktober aan de Autoriteit Consument en Markt een voorstel voor de tarieven die deze netbeheerder ten hoogste
      zal berekenen voor het transport van gas aan die afnemers en de dat transport ondersteunende diensten, en voor de
      taken bedoeld in de [artikelen 1i][ref1] en [10b][ref2] met inachtneming van:

      a. het uitgangspunt dat de kosten worden toegerekend aan de tariefdragers betreffende de diensten die deze
      kosten veroorzaken, behalve voor zover bij ministeriële regeling als bedoeld in [artikel 12][ref3] voor de
      in [artikel 12a, onderdeel c][ref4], genoemde dienst voor het verzorgen van een aansluiting, een andere
      kostentoerekening aan tariefdragers betreffende die dienst is toegestaan of voorgeschreven,

      b. de tariefstructuren vastgesteld op grond van [artikel 12f][ref5] of [12g][ref6],

      c. het bepaalde bij of krachtens [artikel 81a][ref7],

      d. de formule:

      waarbij

      TI = de totale inkomsten uit de tarieven uit het jaar t, te weten de som van de vermenigvuldiging van elk tarief
      in het jaar t en het op basis van [artikel 81a, onderdeel c][ref8], vastgestelde rekenvolume van elke tariefdrager
      waarvoor een tarief wordt vastgesteld;

      TI = de totale inkomsten uit de tarieven in het jaar voorafgaande aan het jaar t, te weten de som van de
      vermenigvuldiging van elk tarief in het jaar t-1 en het op basis van [artikel 81a, onderdeel c][ref9], vastgestelde
      rekenvolume van elke tariefdrager waarvoor een tarief wordt vastgesteld;

      cpi = de relatieve wijziging van de consumentenprijsindex (alle huishoudens), berekend uit het quotiënt van deze
      prijsindex, gepubliceerd in de vierde maand voorafgaande aan het jaar t, en van deze prijsindex, gepubliceerd in de
      zestiende maand voorafgaande aan het jaar t, zoals deze maandelijks wordt vastgesteld door het Centraal Bureau voor
      de Statistiek;

      x = de korting ter bevordering van de doelmatige bedrijfsvoering;

      q = de kwaliteitsterm, die de aanpassing van de tarieven in verband met de geleverde kwaliteit aangeeft en

      e. de gemaakte kosten voor investeringen, bedoeld in [artikel 39e][ref10], voor zover deze kosten doelmatig zijn;

      f. het totaal van de gemaakte kosten voor een verwerving van een bestaand net waarvoor nog niet eerder een
      netbeheerder was aangewezen door of met instemming van Onze Minister en voor de investeringen tot aanpassing van
      dat verworven net waardoor aan de bij en krachtens deze wet daaraan gestelde eisen wordt voldaan, voor zover deze
      kosten doelmatig zijn;

      g. de geschatte kosten voor de uitvoering van [artikel 1i][ref11], voor zover deze kosten doelmatig zijn en niet op
      grond van [artikel 82a][ref12] in rekening zijn gebracht via een tarief;

      h. de geschatte kosten voor de uitvoering van [artikel 10b][ref13], voor zover deze kosten doelmatig zijn en niet
      op grond van [artikel 82b][ref14] in rekening zijn gebracht via een tarief.

      2 De Autoriteit Consument en Markt stelt een beleidsregel vast betreffende de beoordeling van doelmatigheid,
      bedoeld in het eerste lid, onder e en f.

      3 De Autoriteit Consument en Markt kan een beleidsregel vaststellen betreffende de beoordeling van doelmatigheid,
      bedoeld in het eerste lid, onderdelen g en h.


