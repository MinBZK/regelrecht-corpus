  - number: 10j
    text: |-
      1 De afnemer die ingevolge [artikel 10g, tweede lid][ref1], de netbeheerder van het landelijk gastransport
      heeft gemeld dat diens aansluiting dient te worden afgesloten, informeert de netbeheerder van het landelijk
      gastransportnet en Onze Minister over de planning van de afsluiting, voorzien van een onderbouwing van de benodigde
      tijd voor de onderscheiden activiteiten die naar zijn oordeel noodzakelijk zijn om afgesloten te kunnen worden van
      het gastransportnet en, voor zover aan de orde, over te kunnen stappen naar een alternatieve energiebron.

      2 Indien de planning naar het oordeel van de afnemer als gevolg van gewijzigde omstandigheden aanpassing behoeft,
      informeert de afnemer de netbeheerder van het landelijk gastransportnet en Onze Minister zo spoedig mogelijk over
      de aangepaste planning. De aangepaste planning wordt voorzien van een onderbouwing van elke afwijking ten opzichte
      van de eerder ingediende planning.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10g
