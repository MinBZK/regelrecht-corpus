        paragraaf: '1.3'
  - number: 10b
    text: |-
      1 Bij algemene maatregel van bestuur kunnen één of meer andere taken dan de op grond van deze wet toegekende taken
      voor de duur van ten hoogste vijf jaren per taak worden toegekend aan een netbeheerder voor zover:

      a. deze taken verband houden met de op grond van deze wet aan hem toegekende taken,

      b. deze taken van belang zijn voor het toekomstig beheer van het gastransportnet en

      c. marktpartijen niet of in beperkte mate in de uitvoering van de taken voorzien.

      2 Bij algemene maatregel van bestuur worden regels gesteld over de voortzetting of beëindiging van een
      overeenkomstig het eerste lid toegekende taak.

      3 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel10b
  - number: 10c
    text: |-
      1 Een netbeheerder bevoordeelt niet een met hem verbonden groepsmaatschappij als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] boven een andere onderneming waarmee die
      groepsmaatschappij in concurrentie treedt en kent aan die groepsmaatschappij geen voordelen toe die verder gaan dan
      in het normale handelsverkeer gebruikelijk is.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld over handelingen die voordelen genereren die
      verder gaan dan in het normale handelsverkeer gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0011440/2024-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 10d
    text: |-
      1 Een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waar een netbeheerder deel
      van uitmaakt, voert in hoofdzaak de taken uit die bij of krachtens deze wet zijn toegekend aan een netbeheerder
      of, indien van toepassing, de taken die bij of krachtens de [Elektriciteitswet 1998][ref2] zijn toegekend aan een
      netbeheerder als bedoeld in [artikel 1, eerste lid, onderdeel k, van de Elektriciteitswet 1998][ref3].

      2 Een met een netbeheerder verbonden groepsmaatschappij als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref4] beperkt zich in Nederland tot:

      a. handelingen of activiteiten die gerelateerd zijn aan het beheer van gastransportnetten of netten als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref5], en betrekking hebben op:

      1°. aanleg en beheer van interconnectoren en daarvoor benodigde connectiepunten,

      2°. aanleg en beheer van een landsgrensoverschrijdend net als bedoeld in
      [artikel 1, eerste lid, onderdeel as, van de Elektriciteitswet 1998][ref6],

      3°. aanleg en beheer van leidingen en daarmee verbonden hulpmiddelen,

      4°. aanleg en beheer van infrastructuur voor het op- of ontladen van elektrische voertuigen,

      5°. aanleg, onderhoud en het ter beschikking stellen van installaties,

      6°. meetdiensten en meetinrichtingen,

      7°. certificering van hernieuwbare energie,

      8°. energiebeurzen en

      9°. schakelen van installaties, niet zijnde productie-installaties;

      b. handelingen of activiteiten met betrekking tot aanleg en beheer van LNG- en gasopslaginstallaties indien
      het een met de netbeheerder van het landelijk gastransportnet verbonden groepsmaatschappij als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref7] betreft;

      c. handelingen of activiteiten die bij of krachtens de Drinkwaterwet zijn toegestaan aan de eigenaar van een
      drinkwaterbedrijf;

      d. handelingen of activiteiten met betrekking tot infrastructuur voor koolstofdioxide;

      e. aanleg en beheer van andere infrastructuur dan bedoeld in onderdelen a tot en met e met inbegrip van transport
      via die infrastructuur, voor zover de met de groepsmaatschappij verbonden netbeheerder blijft voldoen aan
      [artikel 2c][ref8]. Onder andere infrastructuur wordt in ieder geval verstaan: leidingen of installaties voor
      waterstof, biogas, warmte en koude.

      3 Bij algemene maatregel van bestuur kunnen andere dan de in het tweede lid, onderdeel a, genoemde handelingen
      of activiteiten worden aangewezen die de groepsmaatschappij, bedoeld in het tweede lid, voor een in deze algemene
      maatregel van bestuur vastgestelde duur kan verrichten.

      4 Indien handelingen of activiteiten worden aangewezen op grond van het derde lid, worden bij algemene maatregel
      van bestuur regels gesteld over de voortzetting of beëindiging van die handelingen of activiteiten.

      5 De voordracht voor een krachtens het derde en vierde lid vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
