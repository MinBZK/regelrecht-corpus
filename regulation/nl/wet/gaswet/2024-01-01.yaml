  - number: 10k
    text: |-
      1 Ter uitvoering van de taak, bedoeld in [artikel 10i][ref1], informeert de netbeheerder de betrokken afnemer en
      Onze Minister over de planning van de omschakeling, voorzien van een onderbouwing van de benodigde tijd voor de
      onderscheiden activiteiten ten behoeve van de omschakeling en de mate waarin rekening is gehouden met de gegevens,
      bedoeld in [artikel 10g, tweede lid][ref2].

      2 Indien de planning, bedoeld in het eerste lid, naar het oordeel van de afnemer of de netbeheerder van het
      landelijk gastransportnet als gevolg van gewijzigde omstandigheden aanpassing behoeft, stelt de netbeheerder, in
      afstemming met de afnemer, een aangepaste planning op en informeert Onze Minister hier zo spoedig mogelijk over.
      De aangepaste planning wordt voorzien van een onderbouwing van elke afwijking ten opzichte van de eerder ingediende
      planning.

      3 Onze Minister kan de netbeheerder van het landelijk gastransportnet een bindende gedragslijn opleggen in
      verband met de planning of aangepaste planning van de onderscheiden activiteiten ten behoeve van de omschakeling,
      indien dit naar zijn oordeel in het belang is van de zo spoedig mogelijke afbouw of beëindiging van de gaswinning
      uit het gebied dat is aangewezen in de bij koninklijk besluit van 30 mei 1963, nr. 39 (Stcrt. 126) verleende
      winningsvergunning, of in het economisch belang is van de afnemer. De netbeheerder stuurt binnen vier weken na
      ontvangst van de bindende gedragslijn een aangepaste planning aan Onze Minister en de betrokken afnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10i
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10g
