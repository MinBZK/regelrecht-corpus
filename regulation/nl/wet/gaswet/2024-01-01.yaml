  - number: 2a
    text: |-
      1 De Autoriteit Consument en Markt kan op diens aanvraag ontheffing verlenen aan een eigenaar van een
      gastransportnet, niet zijnde het landelijk gastransportnet, van het gebod van [artikel 2, achtste lid][ref1],
      indien:

      a. het bedrijfs- of productieproces van de gebruikers van een gastransportnet om specifieke technische of
      veiligheidsredenen geïntegreerd is of het gastransportnet primair gas distribueert voor de eigenaar van dat net of
      de daarmee verwante ondernemingen,

      b. de aanvrager geen netbeheerder is en niet in een groepsmaatschappij als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2] met een netbeheerder verbonden is,

      c. het gastransportnet binnen een geografisch afgebakende industriële locatie, commerciële locatie of locatie met
      gedeelde diensten ligt en dat net technisch, organisatorisch of functioneel verbonden is,

      d. op het gastransportnet minder dan 500 afnemers zijn aangesloten,

      e. het gastransportnet geen huishoudelijke eindafnemers van gas voorziet, tenzij er sprake is van incidenteel
      gebruik door een klein aantal huishoudelijke eindafnemers dat werkzaam is bij of vergelijkbare betrekkingen heeft
      met de eigenaar van het gastransportnet en

      f. de veiligheid en betrouwbaarheid van het gastransportnet voldoende is gewaarborgd.

      2 De Autoriteit Consument en Markt neemt het besluit zo spoedig mogelijk, doch uiterlijk zes maanden na ontvangst
      van de aanvraag. Deze termijn kan eenmaal met ten hoogste zes maanden worden verlengd. De Autoriteit Consument en
      Markt kan aan een ontheffing voorschriften en beperkingen verbinden.

      3 De Autoriteit Consument en Markt kan een ontheffing intrekken indien degene aan wie de ontheffing is verleend:

      a. niet langer voldoet aan de voorwaarden, bedoeld in het eerste lid;

      b. in strijd handelt met de voorschriften en beperkingen als bedoeld in het tweede lid en het bepaalde bij of
      krachtens het vierde tot en met het zevende lid;

      c. bij de aanvraag om een ontheffing onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste
      of volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid.

      4 Indien een ontheffing is verleend, zijn uitsluitend het vijfde en zesde lid van toepassing op de eigenaar van een
      gesloten distributiesysteem.

      5 De eigenaar van een gesloten distributiesysteem beheert het gesloten distributiesysteem.

      6 Het bepaalde bij of krachtens de [artikelen 1h][ref3],
      [10, eerste lid, tweede lid, onderdeel b, derde lid, onderdeel b, vijfde en zesde lid][ref4], [14][ref5],
      [17a][ref6], [19][ref7], [35d][ref8], [35e, eerste lid][ref9], [42][ref10], [42b][ref11], [42c][ref12],
      [52b, negende lid][ref13], en [81d, tweede en derde lid][ref14], is van overeenkomstige toepassing voor de eigenaar
      van een gesloten distributiesysteem, met dien verstande dat:

      a. [artikel 10, zesde lid][ref15], uitsluitend geldt voor zover er na aansluiting sprake is van een afnemer binnen
      het geografisch gebied waarbinnen het gesloten distributiesysteem ligt en deze aansluiting past bij het karakter
      van het gesloten distributiesysteem,

      b. niet aan de verplichtingen, bedoeld in de in [artikel 14, eerste lid][ref16], genoemde artikelen behoeft te
      worden voldaan;

      c. dat in [artikel 1h][ref17] in plaats van «gasbedrijf» wordt gelezen «eigenaar van een gesloten
      distributiesysteem».

      7 De Autoriteit Consument en Markt kan op aanvraag van degene die voornemens is een gastransportnet aan te leggen
      en die beschikt over de daarvoor benodigde vergunningen, ontheffingen en toestemmingen, ontheffing verlenen van het
      gebod van [artikel 2, achtste lid][ref18]. Het eerste tot en met zesde lid zijn van overeenkomstige toepassing.

      8 De Autoriteit Consument en Markt keurt op verzoek van een aangeslotene op een gesloten distributiesysteem de van
      kracht zijnde methode voor de berekening van de tarieven goed.

      9 Indien een verzoek als bedoeld in het achtste lid is ontvangen, overlegt de eigenaar van een gesloten
      distributiesysteem binnen drie maanden na de datum waarop de Autoriteit Consument en Markt de eigenaar van een
      gesloten distributiesysteem over het verzoek heeft geïnformeerd, aan de Autoriteit Consument en Markt informatie
      over het aan het verzoek voorafgaande kalenderjaar die relevant is voor de beoordeling van het verzoek, met daarbij
      een toerekening van de kosten en opbrengsten aan activiteiten die verband houden met de aanleg en het beheer van
      het gesloten distributiesysteem in overeenstemming met het daadwerkelijk gebruik van financiële of andere middelen
      voor die activiteiten.

      10 Een besluit als bedoeld in het achtste lid, wordt genomen binnen zes maanden nadat de informatie, bedoeld in
      het negende lid door de Autoriteit Consument en Markt is ontvangen. Deze termijn kan eenmaal met ten hoogste zes
      maanden worden verlengd.


