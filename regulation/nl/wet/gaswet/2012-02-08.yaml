  - number: 12a
    text: |-
      Met inachtneming van de in [artikel 12][ref1] bedoelde regels zenden de gezamenlijke netbeheerders aan de raad van
      bestuur van de mededingingsautoriteit een voorstel met betrekking tot de door hen jegens netgebruikers te hanteren
      tariefstructuren dat de elementen en wijze van berekening beschrijft van:

      a. het tarief voor transport van gas, met inbegrip van invoer, uitvoer en doorvoer van gas en
      de het transport ondersteunende diensten ten behoeve van netgebruikers en met inbegrip van de in
      [artikel 10a, eerste lid, onderdelen a, b, c, e, f, g en h][ref2], omschreven wettelijke taken,

      b. het tarief waarvoor de netbeheerder van het landelijk gastransportnet uitvoering zal geven aan zijn in
      [artikel 10a, eerste lid, onderdeel d][ref3], omschreven taak en

      c. de tarieven voor meting van gas bij afnemers als bedoeld in [artikel 43, eerste lid][ref4], voor het verzorgen
      van een aansluiting als bedoeld in [artikel 10, zesde lid, onder a][ref5], of een aansluitpunt als bedoeld in
      artikel 10, zesde lid, onderdeel b.


