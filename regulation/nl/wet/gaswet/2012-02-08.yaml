  - number: '56'
    text: |-
      1 De op grond van [artikel 53][ref1] aangewezen rechtspersoon verstrekt Onze Minister alle inlichtingen die hij
      nodig heeft voor de toepassing van [artikel 54, tweede lid][ref2], en [artikel 55][ref3]. Die inlichtingen omvatten
      in ieder geval de voorwaarden en de vergoeding die deze rechtspersoon hanteert voor de afname van gas als bedoeld
      in [artikel 54, eerste lid, onder b][ref4], alsmede wijzigingen daarin.

      2 De netbeheerder van het landelijk gastransportnet verstrekt Onze Minister alle inlichtingen die hij nodig heeft
      voor de toepassing van [artikel 54a, tweede lid][ref5], en [artikel 55, derde lid][ref6].


