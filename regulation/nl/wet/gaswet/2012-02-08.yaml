  - number: 2b
    text: |-
      1 [Artikel 2, eerste lid][ref1], is niet van toepassing voor degene aan wie een landsgrensoverschrijdend
      gastransportnet toebehoort.

      2 Degene aan wie een landsgrensoverschrijdend gastransportnet toebehoort, wijst voor het beheer van dat
      transportnet een interconnector-beheerder aan. De aanwijzing wordt gemeld aan Onze Minister.

      3 Een aanwijzing als bedoeld in het tweede lid geldt voor een periode van tien jaar, te rekenen vanaf de dag waarop
      de aanwijzing aan Onze Minister is gemeld.

      4 [Artikel 5, eerste lid][ref2], en [6, eerste tot en met derde lid][ref3] zijn van overeenkomstige toepassing, met
      dien verstande dat de interconnector-beheerder geen naamloze of besloten vennootschap behoeft te zijn.

      5 [Artikel 3, eerste en derde lid][ref4], [3c][ref5], [4, eerste lid][ref6],
      [10, eerste, tweede en vierde lid][ref7], [12 tot en met 16][ref8], [19][ref9], [20][ref10], [37][ref11] en
      [39a][ref12] zijn van overeenkomstige toepassing. [Artikel 82][ref13] is van overeenkomstige toepassing, rekening
      houdend met het grensoverschrijdende karakter en de regulering van de andere lidstaat.

      6 Indien de netbeheerder van het landelijk gastransportnet is aangewezen als interconnector-beheerder zijn, in
      afwijking van het vierde en vijfde lid, de bij of krachtens de Gaswet voor de netbeheerder van het landelijk
      gastransportnet geldende bepalingen van overeenkomstige toepassing, rekening houdend met het grensoverschrijdende
      karakter en de regulering van de andere lidstaat.


