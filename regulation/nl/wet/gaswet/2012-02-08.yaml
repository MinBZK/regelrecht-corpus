  - number: '16'
    text: |-
      1 De raad van bestuur van de mededingingsautoriteit kan op aanvraag de netbeheerder van het landelijk
      gastransportnet tijdelijk ontheffing verlenen van de in [artikel 14, eerste lid][ref1], bedoelde verplichting
      indien een verzoek om transport is gericht tot die netbeheerder en die netbeheerder of een verwant bedrijf ernstige
      economische en financiële moeilijkheden ondervindt of dreigt te ondervinden in verband met één of meer reeds
      aangegane overeenkomsten die een verplichting bevatten tot afname van een bepaalde hoeveelheid gas of, bij gebreke
      daarvan, tot het betalen van een vergoeding ter waarde van die hoeveelheid gas of van een deel daarvan.

      2 In een verzoek om ontheffing worden de aard en de omvang van de verwachte moeilijkheden aangegeven, alsmede de
      inspanningen die de netbeheerder van het landelijk gastransportnet onderscheidenlijk het verwant bedrijf heeft
      geleverd om die moeilijkheden op te lossen.

      3 Bij het beoordelen van de aanvraag houdt de raad van bestuur van de mededingingsautoriteit rekening met artikel
      27, eerste lid, tweede alinea, en derde lid, van de richtlijn.

      4 De raad van bestuur van de mededingingsautoriteit beslist zo spoedig mogelijk op de aanvraag, doch uiterlijk
      binnen vier maanden na ontvangst van de aanvraag.

      5 Indien de raad van bestuur van de mededingingsautoriteit een ontheffing als bedoeld in het eerste lid heeft
      verleend, stelt hij de Commissie van de Europese Gemeenschappen daarvan onverwijld in kennis, onder overlegging van
      de daarvoor van belang zijnde gegevens.

      6 Indien een definitief besluit van de Commissie als bedoeld in artikel 27, tweede lid, van de richtlijn strekt tot
      wijziging of intrekking van de ontheffing is de raad van bestuur van de mededingingsautoriteit verplicht daaraan
      onverwijld gevolg te geven.

      7 Van een besluit als bedoeld in het vierde lid wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel14
