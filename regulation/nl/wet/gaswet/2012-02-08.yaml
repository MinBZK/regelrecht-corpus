  - number: '4'
    text: |-
      1 De netbeheerder meldt aan Onze Minister onverwijld na zijn aanwijzing zijn naam en adres en de naam en het adres
      van zijn aandeelhouders en zendt aan Onze Minister een beschrijving van het gastransportnet dat door hem wordt
      beheerd. Tenminste eenmaal per jaar meldt hij Onze Minister iedere wijziging van de namen of adressen en zendt hij
      hem een beschrijving van de wijziging van het gastransportnet dat door hem wordt beheerd.

      2 De aanwijzing behoeft de instemming van Onze Minister. Hij onthoudt zijn instemming of kan voorschriften
      verbinden aan de instemming indien niet is voldaan aan de [artikelen 2c][ref1], [3][ref2], [3a][ref3],
      [3b][ref4] of [3c][ref5] of indien de aangewezen netbeheerder in onvoldoende mate in staat is of zal zijn om aan
      een verplichting als bedoeld in de [artikelen 10e][ref6], [34][ref7] en [35][ref8] te voldoen, om een taak als
      bedoeld in de [artikelen 7a][ref9], [10][ref10], [10a][ref11], [42][ref12] of [54a][ref13] uit te voeren, aan
      [hoofdstuk 2][ref14] te voldoen of indien hij niet voldoet aan een verbod als bedoeld in de [artikelen 10b][ref15],
      [10c][ref16] of [10d][ref17].

      3 Indien Onze Minister voorschriften verbindt aan zijn instemming, strekken deze er slechts toe de geconstateerde
      tekortkomingen, bedoeld in het tweede lid, weg te nemen.


