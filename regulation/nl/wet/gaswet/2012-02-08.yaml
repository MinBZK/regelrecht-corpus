  - number: '19'
    text: |-
      1 Een partij die een geschil heeft met een netbeheerder of een LNG-bedrijf over de wijze waarop deze zijn taken en
      bevoegdheden op grond van deze wet uitoefent, dan wel aan zijn verplichtingen op grond van deze wet voldoet, kan
      een klacht bij de raad van bestuur van de mededingingsautoriteit indienen.

      2 De raad van bestuur van de mededingingsautoriteit beslist op een klacht binnen twee maanden na ontvangst
      ervan. Deze termijn kan met twee maanden worden verlengd als de raad van bestuur van de mededingingsautoriteit om
      aanvullende gegevens verzoekt. Met instemming van de klager is verdere verlenging mogelijk.

      3 De beslissing van de raad van bestuur van de mededingingsautoriteit is bindend.

      4 Het indienen van een klacht als bedoeld in het eerste lid laat onverlet elke mogelijkheid voor de desbetreffende
      partij een hem ter beschikking staand rechtsmiddel aan te wenden.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel19
  - number: '20'
    text: |-
      In het geval van een landsgrensoverschrijdend geschil is de raad van bestuur van de mededingingsautoriteit
      onbevoegd te beslissen op een klacht als bedoeld in [artikel 19][ref1], als de netbeheerder of het LNG-bedrijf
      waartegen de klacht is gericht onder de rechtsmacht van een andere lidstaat van de Europese Unie valt.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel19
