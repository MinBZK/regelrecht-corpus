  - number: 18b
    text: |-
      1 Een gasopslagbedrijf maakt jaarlijks voor 1 juli een indicatie bekend van de tarieven en de voorwaarden die het
      bedrijf in het volgende kalenderjaar voornemens is te hanteren voor het verrichten van gasopslag en die opslag
      ondersteunende diensten.

      2 Het gasopslagbedrijf voert overleg met representatieve organisaties van netgebruikers over de indicatieve
      tarieven en voorwaarden.

      3 Het gasopslagbedrijf zendt de in het eerste lid bedoelde informatie aan de raad van bestuur van de
      mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel18b
  - number: 18c
    text: |-
      1 Een gasopslagbedrijf is verplicht, in voorkomend geval tezamen met een verwant bedrijf, met degene die daarom
      verzoekt te onderhandelen over het verrichten van gasopslag en die opslag ondersteunende diensten met behulp van
      zijn opslaginstallatie en van één of meer installaties van het verwante bedrijf, voor zover het gebruik van die
      installaties noodzakelijk is voor de opslag of die opslag ondersteunende diensten.

      2 Op de grondslag van hetgeen als gevolg van het eerste lid is overeengekomen, worden de opslag van gas en de die
      opslag ondersteunende diensten verricht.

      3 Toepassing van het eerste en het tweede lid geschiedt op voorwaarden die redelijk, transparant en niet-
      discriminatoir zijn.

      4 De raad van bestuur van de mededingingsautoriteit kan op verzoek van één of meer van de bij de onderhandelingen
      betrokken partijen een termijn stellen waarbinnen de onderhandelingen afgerond moeten zijn.

      5 Indien de onderhandelingen binnen de in het vierde lid bedoelde termijn niet tot een overeenkomst hebben geleid,
      deelt het gasopslagbedrijf binnen twee weken de raad van bestuur van de mededingingsautoriteit mede welke redenen
      daaraan ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel18c
  - number: 18d
    text: |-
      1 Een gasopslagbedrijf, of in voorkomend geval een verwant bedrijf, kan weigeren de opslag van gas en die opslag
      ondersteunende diensten te verrichten indien:

      a. binnen zijn opslaginstallatie, onderscheidenlijk de in [artikel 18c, eerste lid][ref1], bedoelde installaties
      van het verwante bedrijf, geen capaciteit beschikbaar is voor de opslag van de desbetreffende hoeveelheid gas, dan
      wel in redelijkheid niet kan worden gevergd dat hij alle capaciteit beschikbaar stelt;

      b. het verrichten van de beoogde gasopslag of de ondersteunende diensten hem of een netbeheerder voor wie hij de
      gasopslag reeds verricht, zou verhinderen zijn in [artikel 10][ref2], [10a][ref3], [42][ref4] en [54a][ref5] en
      [hoofdstuk 2][ref6] bedoelde taak te vervullen.

      2 Een weigering als bedoeld in het eerste lid is met redenen omkleed.


