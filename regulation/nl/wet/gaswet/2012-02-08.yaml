  - number: 2a
    text: |-
      1 Onze Minister kan op diens aanvraag aan degene aan wie een ander gastransportnet dan het landelijk
      gastransportnet toebehoort, een ontheffing verlenen van het gebod, bedoeld in [artikel 2, eerste lid][ref1], voor
      zover het een net betreft waarop een beperkt aantal andere natuurlijke personen of rechtspersonen zijn aangesloten
      en:

      a. het gastransportnet bestemd is om de aanvrager te voorzien van gas dan wel om het centrale bedrijfsproces van de
      aanvrager te ondersteunen, of

      b. het gastransportnet bestemd is om een aantal samenwerkende natuurlijke personen of rechtspersonen te voorzien
      van gas en de samenwerking van deze personen een betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord
      functionerende energiehuishouding in hun vestigingen ten doel heeft, of

      c. ten aanzien van het gastransportnet kwaliteitseisen van toepassing zijn die in betekenende mate afwijken van de
      kwaliteitseisen die voor een gastransportnet gebruikelijk zijn, en

      d. de aanvrager geen netbeheerder is en niet in een groepsmaatschappij met een netbeheerder verbonden is.

      2 Indien een ontheffing als bedoeld in het eerste lid is verleend, sluit de ontheffinghouder een overeenkomst met
      de netbeheerder van het gastransportnet waarop zijn net is aangesloten om te waarborgen dat de uitvoering van de
      taken van die netbeheerder niet wordt belemmerd.

      3 Aan een ontheffing kunnen voorschriften worden verbonden met betrekking tot de toegang tot het net, het uitvoeren
      van taken als bedoeld in de [artikelen 10][ref2] en [42][ref3] en [hoofdstuk 2][ref4] en met betrekking tot de
      tarieven en voorwaarden die daarbij gehanteerd moeten worden.

      4 Onze Minister kan een ontheffing intrekken indien degene aan wie de ontheffing is verleend:

      a. niet langer voldoet aan de voorwaarden, bedoeld in het eerste lid;

      b. in strijd handelt met het tweede lid of de voorschriften, bedoeld in het derde lid;

      c. bij de aanvraag om een ontheffing onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van juiste
      of volledige gegevens tot een andere beschikking op de aanvraag zou hebben geleid.

      5 In afwijking van het eerste lid, onderdeel d, kan aan een aanvrager die in een groepsmaatschappij met een
      netbeheerder is verbonden een ontheffing worden verleend, indien van hem in redelijkheid niet kan worden verwacht
      dat hij een netbeheerder aanwijst voor het gastransportnet waarop de aanvraag betrekking heeft. Een netbeheerder
      onthoudt zich van bemoeienis met het beheer van het net waarop de ontheffing betrekking heeft.


