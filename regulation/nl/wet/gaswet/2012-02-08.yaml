  - number: 18f
    text: De artikelen 72 en 73 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel18f
  - number: 18g
    text: |-
      1 Indien dit technisch of economisch noodzakelijk is voor een efficiënte toegang tot gasopslag of die opslag
      ondersteunende diensten, zijn andere gasopslagbedrijven dan de gasopslagbedrijven, bedoeld in artikel 18,
      eerste lid, verplicht, in voorkomend geval tezamen met een verwant bedrijf, met degene die daarom verzoekt te
      onderhandelen over de tarieven en voorwaarden voor het verrichten van gasopslag en die opslag ondersteunende
      diensten met behulp van hun installaties en van één of meer installaties van het verwante bedrijf, voor zover het
      gebruik van die installaties noodzakelijk zijn voor de opslag.

      2 De gasopslag en de die opslag ondersteunende diensten worden verricht op grondslag van de tarieven en voorwaarden
      die op grond van het eerste lid zijn overeengekomen.

      3 De tarieven en de voorwaarden die het gasopslagbedrijf hanteert voor gasopslag en die opslag ondersteunende
      diensten zijn objectief, transparant en niet discriminatoir.

      4 Het gasopslagbedrijf publiceert jaarlijks voor 1 oktober op een geschikte wijze een indicatie van de tarieven
      en voorwaarden die het bedrijf voornemens is in het volgende kalenderjaar te hanteren voor het verrichten van
      gasopslag en die opslag ondersteunende diensten.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel18g
  - number: 18h
    text: |-
      1 Onze Minister kan voor grote, nieuwe landsgrensoverschrijdende gastransportnetten, LNG-installaties en
      opslaginstallaties op verzoek ontheffing verlenen van de [paragrafen 2.2][ref1], [2.3][ref2], [2.4][ref3] en
      [2.5][ref4] en de [artikelen 80 tot en met 82][ref5], indien wordt voldaan aan de volgende voorwaarden:

      a. de aanleg van het net of de installatie versterkt de mededinging bij de levering van gas en de
      leveringszekerheid,

      b. het risico van de investering nodig voor de aanleg van het net of de installatie is zo groot dat de aanleg niet
      zal plaatsvinden als geen ontheffing wordt verleend,

      c. de eigendom van het net of de installatie berust bij een ander dan de beheerder van het net of de installatie
      waarop het nieuwe net of de nieuwe installatie zal worden aangesloten,

      d. de gebruikers van het net of de installatie wordt een tarief in rekening gebracht, en

      e. de ontheffing belemmert niet de mededinging op of de doelmatige werking van de interne gasmarkt of de doelmatige
      werking van het net of de installatie waarop het nieuwe net of de nieuwe installatie wordt aangesloten.

      2 Het eerste lid is van overeenkomstige toepassing op aanmerkelijke uitbreidingen van de capaciteit van bestaande
      netten of installaties en op wijzigingen van de bestaande netten of installaties die de ontwikkeling van nieuwe
      bronnen van gasvoorziening bevorderen.

      3 De ontheffing kan betrekking hebben op het gehele nieuwe net of de gehele nieuwe installatie onderscheidenlijk
      de aanmerkelijke uitbreiding of wijziging van een bestaand net of een bestaande installatie dan wel op gedeelten
      daarvan.

      4 Op een landsgrensoverschrijdend gastransportnet dat bij de ingebruikname daarvan over een ontheffing als bedoeld
      in het eerste lid beschikt, is [artikel 85][ref6] niet van toepassing.

      5 Alvorens Onze Minister beslist op een verzoek om een ontheffing brengt de raad van bestuur van de
      mededingingsautoriteit advies uit. Van het advies wordt uiterlijk tegelijk met de bekendmaking van het besluit op
      de aanvraag kennis gegeven.

      6 Indien sprake is van de aanleg van een landsgrensoverschrijdend gastransportnet, overlegt Onze Minister met de
      bevoegde instantie in de andere lidstaat of lidstaten van de Europese Unie.

      7 Onze Minister kan voorwaarden aan de ontheffing verbinden die betrekking hebben op de termijn waarvoor de
      ontheffing geldt en de niet-discriminatoire toegang tot het net of de installatie. Hij houdt in ieder geval
      rekening met de lengte van overeenkomsten, de omvang van de nieuwe capaciteit of de wijziging van de bestaande
      capaciteit, de looptijd van het project en de nationale omstandigheden.

      8 Onze Minister kan voorschriften aan de ontheffing verbinden die betrekking hebben op het beheer en de toedeling
      van capaciteit, met dien verstande dat deze voorschriften de uitvoering van overeenkomsten voor een lange termijn
      niet mogen belemmeren.

      9 Onze Minister beslist zo spoedig mogelijk op een aanvraag om een ontheffing als bedoeld in het eerste lid, doch
      uiterlijk binnen zes maanden na ontvangst van de aanvraag.

      10 Indien Onze Minister een ontheffing als bedoeld in het eerste lid heeft verleend, stelt hij daarvan onverwijld
      de Commissie van de Europese Gemeenschappen in kennis, onder overlegging van alle van belang zijnde gegevens. Deze
      gegevens omvatten in ieder geval de gegevens, bedoeld in artikel 22, vierde lid, onderdelen a tot en met e, van
      de richtlijn.

      11 Indien een definitief besluit van de Commissie van de Europese Gemeenschappen als bedoeld in artikel 30, tweede
      lid, van de richtlijn strekt tot wijzing of intrekking van de ontheffing, geeft Onze Minister daaraan onverwijld
      gevolg.

      12 Een besluit als bedoeld in het eerste lid treedt niet in werking voordat de termijn, bedoeld in artikel 22,
      vierde lid, van de richtlijn, waarbinnen de Commissie van de Europese Gemeenschappen een verzoek tot wijziging of
      intrekking kan doen, is verstreken. Indien de Commissie van de Europese Gemeenschappen binnen de termijn, genoemd
      in de vorige volzin, een verzoek tot wijziging of intrekking heeft gedaan en aan dit verzoek binnen de in artikel
      22, vierde lid, van de richtlijn genoemde termijn geen gevolg is gegeven, treedt het besluit niet in werking
      voordat de Commissie van de Europese Gemeenschappen een definitief besluit als bedoeld in artikel 30, tweede lid,
      van de richtlijn heeft genomen.

      13 Een besluit als bedoeld in het eerste lid wordt bekendgemaakt in de Staatscourant. Van een beslissing bedoeld in
      het tiende lid wordt mededeling gedaan in de Staatscourant.

      14 In afwijking van [artikel 6:8, eerste lid, van de Algemene wet bestuursrecht][ref7] vangt de termijn voor het
      indienen van een bezwaarschrift aan op de dag van inwerkingtreding van een besluit als bedoeld in het eerste lid.


