  - number: '59'
    text: |-
      1 De raad van bestuur van de mededingingsautoriteit is belast met taken ter uitvoering van deze wet en de
      verordening, alsmede met het toezicht op de naleving van deze wet, de verordening en verordening 994/2010, met
      uitzondering van [paragraaf 1.2][ref1] en van de [artikelen 35a][ref2], [51][ref3], [54 tot en met 57][ref4],
      [72][ref5] en [73][ref6] van de wet.

      2 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, met uitzondering van
      [paragraaf 1.2][ref7] en van de [artikelen 35a][ref8], [51][ref9], [54 tot en met 57][ref10], [72][ref11] en
      [73][ref12], en van de verordening en verordening 994/2010 zijn belast de bij besluit van de raad van bestuur
      van de mededingingsautoriteit aangewezen ambtenaren van de Nederlandse mededingingsautoriteit. Het toezicht
      op de naleving van de [artikelen 14 tot en met 16][ref13] en [artikel 18h][ref14], voor zover het betreft
      landsgrensoverschrijdende transporten, wordt uitgeoefend in overleg met de bevoegde instantie van de andere
      betrokken lidstaat of lidstaten van de Europese Unie.

      3 Met het toezicht op de naleving van het bepaalde bij of krachtens [paragraaf 1.2][ref15] en van de
      [artikelen 35a][ref16], [54 tot en met 57][ref17], [72][ref18], [73][ref19] en [80 tot en met 85a][ref20], zijn
      belast de bij besluit van Onze Minister aangewezen ambtenaren.

      4 Een besluit als bedoeld in het eerste of tweede lid wordt in de Staatscourant bekendgemaakt.


