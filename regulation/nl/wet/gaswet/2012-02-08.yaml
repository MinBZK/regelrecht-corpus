  - number: 39e
    text: |-
      De raad van bestuur van de mededingingsautoriteit verrekent in de tarieven de kosten van een investering waarvoor
      op grond van [artikel 3.28 van de Wet ruimtelijke ordening][ref1] een inpassingsplan is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.28
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel39e
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3.28'
  - number: 39f
    text: |-
      1 Een netbeheerder meldt een voornemen tot een bijzondere investering in de aanleg of uitbreiding van het net,
      waarop de procedure, bedoeld in [artikel 3.28 van de Wet ruimtelijke ordening][ref1], niet van toepassing is, zo
      spoedig mogelijk schriftelijk aan de raad van bestuur van de mededingingsautoriteit of, indien het de netbeheerder
      van het landelijk gastransportnet betreft, eveneens aan Onze Minister. Bij ministeriële regeling kunnen regels
      worden gesteld omtrent de melding.

      2 De raad van bestuur van de mededingingsautoriteit besluit binnen 13 weken nadat de melding is gedaan, of een
      investering als bedoeld in het eerste lid, van een netbeheerder niet zijnde de netbeheerder van het landelijk
      gastransportnet noodzakelijk is.

      3 Onze Minister besluit of een investering als bedoeld in het eerste lid van de netbeheerder van het
      landelijk gastransportnet noodzakelijk is, gelet op het belang van een duurzame, betrouwbare en efficiënte
      energievoorziening. Alvorens Onze Minister besluit, brengt de raad van bestuur van de mededingingsautoriteit binnen
      vier weken nadat de melding is gedaan advies uit over het te nemen besluit. Indien de investering niet is opgenomen
      in een structuurvisie als bedoeld in [artikel 2.3 van de Wet ruimtelijke ordening][ref2], stelt Onze Minister het
      besluit niet eerder vast, dan na twee weken nadat het ontwerp daarvan en het betrekkelijke advies aan beide kamers
      der Staten-Generaal zijn overlegd.

      4 De raad van bestuur van de mededingingsautoriteit verrekent de kosten van een investering waarvan de noodzaak is
      vastgesteld op grond van het tweede of het derde lid, in de tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.28
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel39f
