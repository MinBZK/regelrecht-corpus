      1 Degene aan wie een gastransportnet toebehoort, wijst voor het beheer van dat net, ten behoeve van de uitvoering
      van de taken, bedoeld in de [artikelen 10][ref1] en [42][ref2] en [hoofdstuk 2][ref3], een of meer naamloze of
      besloten vennootschappen als netbeheerder aan.

      2 In afwijking van het eerste lid, wijst degene aan wie het landelijk gastransportnet geheel of voor het grootste
      gedeelte toebehoort, in voorkomend geval na overleg met anderen aan wie een gedeelte van dat gastransportnet
      toebehoort, voor het beheer van dat gehele net, ten behoeve van de uitvoering van de taken, bedoeld in de
      [artikelen 10][ref4], [10a][ref5], [42][ref6] en [54a][ref7] en [hoofdstuk 2][ref8], één naamloze of besloten
      vennootschap als netbeheerder van het landelijk gastransportnet aan.

      3 Onverminderd [artikel 6][ref9] geldt een aanwijzing als bedoeld in het eerste of tweede lid voor een periode
      van tien jaar, te rekenen vanaf de dag waarop Onze Minister heeft ingestemd met de aanwijzing op grond van
      [artikel 4, tweede lid][ref10].


