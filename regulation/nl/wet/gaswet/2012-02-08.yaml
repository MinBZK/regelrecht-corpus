  - number: 54a
    text: |-
      1 Onverminderd de [artikelen 10][ref1] en [10a][ref2] heeft de netbeheerder van het landelijk gastransportnet, in
      het belang van het planmatig beheer van voorkomens van gas, ter verzekering op lange termijn van een behoedzaam en
      rationeel gebruik van deze natuurlijke hulpbron tot taak zorg te dragen voor de inname en het transport van gas uit
      de gasvoorkomens in gebieden binnen Nederland en op het continentaal plat.

      2 Indien de netbeheerder van het landelijk gastransportnet ter uitvoering van de in het eerste lid bedoelde
      taak moet investeren in de aanleg of uitbreiding van het net dan meldt hij dit voornemen aan Onze Minister. Bij
      ministeriële regeling kunnen regels worden gesteld omtrent de melding.

      3 Onze Minister besluit binnen 13 weken nadat de melding is gedaan, of een investering als bedoeld in het eerste
      lid, van de netbeheerder van het landelijk gastransportnet noodzakelijk is, gelet op het belang, bedoeld in het
      eerste lid. Indien Onze Minister besluit dat de investering niet noodzakelijk is, wordt de netbeheerder van het
      landelijk gastransportnet geacht te zijn ontheven van de in het eerste lid bedoelde taak voor dat voorkomen.

      4 De raad van bestuur van de mededingingsautoriteit verrekent de kosten van een investering waarvan de noodzaak is
      vastgesteld op grond van het derde lid, in de tarieven.

      5 De netbeheerder van het landelijk gastransportnet overlegt jaarlijks aan Onze Minister een overzicht, waarin ten
      aanzien van de eerstvolgende twintig jaar ramingen zijn opgenomen met betrekking tot de uitoefening van de taak,
      bedoeld in het eerste lid, onder vermelding van daarbij gehanteerde vooronderstellingen en relevante onderscheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel54a
