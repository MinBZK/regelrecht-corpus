  - number: '18'
    text: |-
      1 De [artikelen 18a tot en met 18f][ref1] zijn van toepassing op gasopslagbedrijven die een economische
      machtspositie hebben.

      2 De beheerders van de gasopslaginstallaties waarvoor op grond van
      [artikel 149, eerste lid, van de Mijnbouwwet][ref2], van rechtswege een vergunning is verleend als bedoeld in
      [artikel 25, eerste lid, van die wet][ref3], worden geacht gasopslagbedrijven als bedoeld in het eerste lid te
      zijn.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat het tweede lid geen toepassing vindt. Deze algemene
      maatregel van bestuur wordt aan de beide kamers der Staten-Generaal overgelegd. Hij treedt in werking op een
      tijdstip dat nadat vier weken na de overlegging zijn verstreken bij koninklijk besluit wordt vastgesteld, tenzij
      binnen die termijn door of namens een der kamers of door ten minste een vijfde van het grondwettelijk aantal leden
      van een der kamers de wens te kennen wordt gegeven dat de inwerkingtreding van de algemene maatregel van bestuur
      bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.
      Indien het voorstel van wet wordt ingetrokken of indien een van de beide kamers van de Staten-Generaal besluit het
      voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.


