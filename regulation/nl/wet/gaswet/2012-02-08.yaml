  - number: '85'
    text: |-
      1 Indien zich in de periode tussen 1 juli 1996 en de datum van de aanwijzing van de netbeheerder, bedoeld
      in [artikel 2][ref1], een wijziging heeft voorgedaan met betrekking tot de eigendom van de aandelen in de
      rechtspersoon aan wie het desbetreffende gastransportnet toebehoort of de eigendom van dat net, is voor de
      instemming met de aanwijzing van de netbeheerder vereist, dat Onze Minister geen bedenkingen heeft tegen die
      wijziging.

      2 De eigendom van een gastransportnet of rechten op een gastransportnet berusten direct of indirect bij de staat,
      provincies, gemeenten of andere openbare lichamen.

      3 De aandelen van een netbeheerder berusten direct of indirect bij de staat, provincies, gemeenten of andere
      openbare lichamen.

      4 Onder indirect berusten als bedoeld in het tweede en derde lid wordt verstaan dat de eigendom van een
      gastransportnet of rechten op een gastransportnet, dan wel aandelen in een netbeheerder, berusten bij een of
      meer rechtspersonen waarvan alle aandelen worden gehouden door de staat, provincies, gemeenten of andere openbare
      lichamen of bij een rechtspersoon die een volledige dochtermaatschappij is van een of meer rechtspersonen waarvan
      alle aandelen worden gehouden door de staat, provincies, gemeenten of andere openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel85
