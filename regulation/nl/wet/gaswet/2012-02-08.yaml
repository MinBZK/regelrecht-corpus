  - number: '34'
    text: |-
      1 Onze Minister kan verlangen dat een gasbedrijf, een gas- of elektriciteitsbeurs, een netgebruiker of een afnemer
      hem inzage geeft in gegevens en bescheiden, onderscheidenlijk hem gegevens en inlichtingen verstrekt, die hij nodig
      heeft voor de uitvoering van de hem in deze wet, de verordening of verordening 994/2010 opgedragen taken en voor
      het opstellen van het in [artikel 52][ref1] bedoelde energierapport.

      2 Degene aan wie een verzoek is gedaan inzage te geven in gegevens en bescheiden onderscheidenlijk gegevens
      en inlichtingen te verstrekken, is verplicht binnen de door Onze Minister te stellen redelijke termijn alle
      medewerking te verlenen die hij redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.

      3 Onze Minister gebruikt bescheiden, gegevens of inlichtingen over het gasbedrijf, een gas- of elektriciteitsbeurs,
      een netgebruiker of een afnemer, welke hij heeft verkregen in verband met enige werkzaamheid ten behoeve van de
      uitvoering van een van zijn taken op grond van deze wet, de verordening of verordening 994/2010, uitsluitend voor
      de uitvoering van deze wet, de verordening of verordening 994/2010.

      4 Indien Onze Minister op grond van [artikel 10a, eerste lid, onderdelen f en h][ref2], de netbeheerder van
      het landelijk gastransportnet opdraagt werkzaamheden te verrichten, zijn het eerste tot en met derde lid van
      overeenkomstige toepassing op die netbeheerder.

      5 In afwijking van het derde lid is Onze Minister bevoegd bescheiden, gegevens of inlichtingen, bedoeld in het
      derde lid, te verstrekken aan:

      a. een buitenlandse instelling, die op grond van nationale wettelijke regels is belast met de toepassing van de
      regels op het gebied van gas, voor zover die bescheiden, gegevens en inlichtingen van betekenis zijn of kunnen zijn
      voor de uitoefening van de taak van die instelling;

      b. een bestuursorgaan dat op grond van deze wet of van een andere wettelijke regeling dan deze wet is belast
      met taken die de toepassing of mede de toepassing van bepalingen op het gebied van gas betreffen, voor zover
      die bescheiden, gegevens of inlichtingen van betekenis kunnen zijn voor de uitoefening van de taak van dat
      bestuursorgaan.

      6 Op basis van het vijfde lid kunnen uitsluitend bescheiden, gegevens of inlichtingen worden verstrekt indien:

      a. de geheimhouding van de bescheiden, gegevens of inlichtingen in voldoende mate is gewaarborgd, en

      b. voldoende is gewaarborgd dat de bescheiden, gegevens of inlichtingen niet zullen worden gebruikt voor een ander
      doel dan waarvoor deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
