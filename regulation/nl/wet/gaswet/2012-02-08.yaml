  - number: 2c
    text: |-
      1 Een netbeheerder maakt geen deel uit van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe ook een rechtspersoon of vennootschap behoort die
      in Nederland gas produceert of levert of daarin handelt.

      2 Rechtspersonen en vennootschappen die deel uitmaken van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2] waartoe ook een rechtspersoon of vennootschap behoort
      die in Nederland gas produceert of levert of daarin handelt, houden geen aandelen in een netbeheerder of in een
      rechtspersoon die deel uitmaakt van een groep waartoe ook een netbeheerder behoort en nemen niet deel in een
      vennootschap die deel uitmaakt van een groep waartoe ook een netbeheerder behoort.

      3 Een netbeheerder en met de netbeheerder verbonden groepsmaatschappijen als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref3]:

      a. houden geen aandelen in een rechtspersoon die in Nederland gas produceert of levert of daarin handelt of in een
      rechtspersoon die deel uitmaakt van een groep waartoe ook een rechtspersoon behoort die in Nederland gas produceert
      of levert of daarin handelt;

      b. nemen niet deel in een vennootschap die in Nederland gas produceert of levert of daarin handelt of in een
      vennootschap die deel uitmaakt van een groep waartoe ook een rechtspersoon of vennootschap behoort die in Nederland
      gas produceert of levert of daarin handelt.


