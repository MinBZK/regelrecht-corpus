        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 81e
        hoofdstuk: '7'
  - number: '81'
    text: |-
      1 De raad van bestuur van de mededingingsautoriteit stelt na overleg met de gezamenlijke netbeheerders en met
      representatieve organisaties van partijen op de gasmarkt, met inachtneming van het belang dat door middel van
      marktwerking ten behoeve van afnemers de doelmatigheid van de bedrijfsvoering en de meest doelmatige kwaliteit
      van het transport worden bevorderd, de methode tot vaststelling van de korting ter bevordering van de doelmatige
      bedrijfsvoering, van de kwaliteitsterm en van het rekenvolume van elke tariefdrager van elke dienst waarvoor een
      tarief wordt vastgesteld, vast. Het besluit tot vaststelling van de methode geldt voor een periode van ten minste
      drie en ten hoogste vijf jaar.

      2 De korting ter bevordering van de doelmatige bedrijfsvoering heeft onder meer ten doel te bereiken dat de
      netbeheerder in ieder geval geen rendement kan behalen dat hoger is dan in het economisch verkeer gebruikelijk en
      dat de gelijkwaardigheid in de doelmatigheid van de netbeheerders wordt bevorderd.

      3 De kwaliteitsterm geeft de aanpassing van de tarieven in verband met de geleverde kwaliteit aan en heeft ten doel
      netbeheerders te stimuleren om de kwaliteit van hun transportdienst te optimaliseren.

      4 De rekenvolumina die een netbeheerder gebruikt bij het voorstel, bedoeld in [artikel 81b][ref1], zijn
      gebaseerd op daadwerkelijk gefactureerde volumina in eerdere jaren, of worden door de raad van bestuur van de
      mededingingsautoriteit geschat indien deze betrekking hebben op nieuwe tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel81b
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 81b
        hoofdstuk: '7'
  - number: 81a
    text: |-
      1 Ten behoeve van het voorstel, bedoeld in [artikel 81b][ref1], stelt de raad van bestuur van de
      mededingingsautoriteit voor iedere netbeheerder afzonderlijk voor dezelfde periode als waarvoor het besluit geldt
      op grond van [artikel 81, eerste lid][ref2], vast:

      a. de korting ter bevordering van de doelmatige bedrijfsvoering,

      b. de kwaliteitsterm, en

      c. het rekenvolume van elke tariefdrager van elke dienst waarvoor een tarief wordt vastgesteld.

      2 De raad van bestuur van de mededingingsautoriteit kan het in het eerste lid, onderdeel c, bedoelde rekenvolume
      gedurende de in dat lid bedoelde periode wijzigen.

      3 Indien een besluit op grond van [artikel 81, eerste lid][ref3], bij een onherroepelijke rechterlijke uitspraak
      vernietigd is of bij een onherroepelijk besluit op bezwaar herroepen is, herziet de raad van bestuur van de
      mededingingsautoriteit de in het eerste lid vermelde besluiten met toepassing van de met inachtneming van die
      uitspraak of dat besluit op bezwaar gecorrigeerde methode.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel81b
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel81
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel81a
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 81b
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '81'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0011440
        artikel: '81'
        hoofdstuk: '7'
  - number: 81b
    text: |-
      1 Iedere netbeheerder die het transport van gas verricht dat bestemd is voor levering aan afnemers zendt
      jaarlijks voor 1 oktober aan de raad van bestuur van de mededingingsautoriteit een voorstel voor de tarieven
      die deze netbeheerder ten hoogste zal berekenen voor het transport van gas aan die afnemers en de dat transport
      ondersteunende diensten, met inachtneming van:

      a. het uitgangspunt dat de kosten worden toegerekend aan de tariefdragers betreffende de diensten die deze kosten
      veroorzaken,

      b. de tariefstructuren vastgesteld op grond van [artikel 12f][ref1] of [12g][ref2],

      c. het bepaalde bij of krachtens [artikel 81a][ref3],

      d. de formule:

      waarbij

      TI = de totale inkomsten uit de tarieven uit het jaar t, te weten de som van de vermenigvuldiging van elk tarief
      in het jaar t en het op basis van [artikel 81a, onderdeel c][ref4], vastgestelde rekenvolume van elke tariefdrager
      waarvoor een tarief wordt vastgesteld;

      TI = de totale inkomsten uit de tarieven in het jaar voorafgaande aan het jaar t, te weten de som van de
      vermenigvuldiging van elk tarief in het jaar t-1 en het op basis van [artikel 81a, onderdeel c][ref5], vastgestelde
      rekenvolume van elke tariefdrager waarvoor een tarief wordt vastgesteld;

      cpi = de relatieve wijziging van de consumentenprijsindex (alle huishoudens), berekend uit het quotiënt van deze
      prijsindex, gepubliceerd in de vierde maand voorafgaande aan het jaar t, en van deze prijsindex, gepubliceerd in de
      zestiende maand voorafgaande aan het jaar t, zoals deze maandelijks wordt vastgesteld door het Centraal Bureau voor
      de Statistiek;

      x = de korting ter bevordering van de doelmatige bedrijfsvoering;

      q = de kwaliteitsterm, die de aanpassing van de tarieven in verband met de geleverde kwaliteit aangeeft en

      e. de gemaakte kosten voor investeringen, bedoeld in [artikel 39e][ref6] of [39f, tweede lid][ref7], voor zover
      deze kosten doelmatig zijn.

      2 De raad van bestuur van de mededingingsautoriteit stelt een beleidsregel vast betreffende de beoordeling van
      doelmatigheid, bedoeld in het eerste lid, onder e.


