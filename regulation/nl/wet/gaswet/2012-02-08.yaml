  - number: 3b
    text: |-
      1 Een netbeheerder, met uitzondering van de netbeheerder van het landelijk gastransportnet, beschikt over de
      economische eigendom van het door hem beheerde gastransportnet.

      2 Bij gelegenheid van een aanwijzing als bedoeld in [artikel 2, eerste lid][ref1], vindt voor zover nodig
      overdracht van de economische eigendom aan de aangewezen netbeheerder plaats.

      3 De overdracht geschiedt tegen verrichting van een tegenprestatie waarvan de waarde ten hoogste de opbrengst
      vertegenwoordigt van de exploitatie van het gastransportnet, zoals deze op basis van algemene bedrijfseconomische
      uitgangspunten kan worden afgeleid van de in de daaraan voorafgaande periode van vijf jaar geldende tarieven
      met betrekking tot het netbeheer. Deze tegenprestatie kan zowel bestaan uit een periodieke uitkering als uit een
      contant bedrag ineens.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel3b
