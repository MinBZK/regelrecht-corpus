  - number: 39d
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden de besluiten aangewezen die voor de aanleg of uitbreiding
      van een net of installatie als bedoeld in [artikel 39b, eerste lid][ref1], in ieder geval besluiten als bedoeld in
      [artikel 3.35, eerste lid, onderdeel b, van de Wet ruimtelijke ordening][ref2] zijn.

      2 Onze Minister kan, ten behoeve van de aanleg of uitbreiding van een net of installatie
      als bedoeld in [artikel 39b, eerste lid][ref3], tevens één of meer andere besluiten dan de
      bij of krachtens het eerste lid aangewezen besluiten aanwijzen als besluiten als bedoeld in
      [artikel 3.35, eerste lid, onderdeel a, van de Wet ruimtelijke ordening][ref4].

      3 Onze Minister kan, indien een bij of krachtens het eerste lid aangewezen besluit de toepassing van de procedure,
      bedoeld in [artikel 39b, eerste lid][ref5], zou belemmeren of ernstig bemoeilijken, bepalen dat het desbetreffende
      besluit, in afwijking van de in het eerste lid bedoelde algemene maatregel van bestuur, niet als een besluit als
      bedoeld in [artikel 3.35, eerste lid, onderdeel b, van de Wet ruimtelijke ordening][ref6] wordt aangemerkt.


