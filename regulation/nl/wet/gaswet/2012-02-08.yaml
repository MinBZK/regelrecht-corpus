      1 Een netbeheerder stelt iedere vijf jaar een calamiteitenplan vast en zendt dit ter goedkeuring aan Onze Minister.

      2 Bij ministeriële regeling worden nadere eisen gesteld aan het calamiteitenplan.

      3 Onze Minister beoordeelt of het calamiteitenplan voldoet aan de eisen, bedoeld in het tweede lid, en kan de
      netbeheerder verzoeken het calamiteitenplan aan te passen.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel51
  - number: '52'
    text: |-
      Het in [artikel 2 van de Elektriciteitswet 1998][ref1] bedoelde energierapport geeft mede richting aan van
      rijkswege te nemen beslissingen in de periode, bedoeld in dat artikel, voor zover daarbij het belang van het
      betrouwbaar, duurzaam en doelmatig functioneren van de gasvoorziening in beschouwing moet of kan worden genomen.
      Het energierapport bevat tevens een prognose betreffende het nationaal en internationaal gasreservebeleid voor een
      periode van 50 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel2
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '2'
  - number: 52a
    text: |-
      1 Onze Minister verzamelt, analyseert en bewerkt systematisch inlichtingen en gegevens met betrekking tot de
      leverings- en voorzieningzekerheid, in het bijzonder met betrekking tot:

      a. het evenwicht van vraag en aanbod op de nationale markt,

      b. het niveau van de verwachte toekomstige vraag en de beschikbare voorraden,

      c. de extra capaciteit aan geplande of in aanbouw zijnde infrastructuur,

      d. de kwaliteit en de staat van onderhoud van de netten,

      e. de maatregelen in geval van piekbelasting of het in gebreke blijven van een of meerdere leveranciers,

      f. het concurrentie-effect van maatregelen die zijn genomen in het kader van de voorzieningszekerheid,

      g. de opslagcapaciteiten,

      h. langlopende gasleveringscontracten,

      i. de liquiditeit van de gasmarkt, en

      j. de regelgevingskaders die moeten voorzien in adequate stimulerende maatregelen voor nieuwe investeringen in
      exploratie en productie, opslag, LNG en transport van gas.

      2 Onze Minister publiceert jaarlijks uiterlijk op 31 juli op geschikte wijze een verslag van zijn bevindingen die
      het verzamelen, analyseren en bewerken van de inlichtingen en gegevens over de onderwerpen, genoemd in het eerste
      lid, heeft opgeleverd, alsmede van de getroffen of voorgenomen maatregelen met betrekking tot die onderwerpen.
      Hij zendt het verslag onverwijld naar de Commissie van de Europese Gemeenschappen en doet mededeling ervan in de
      Staatscourant, onder vermelding van de wijze waarop het verslag kan worden geraadpleegd.

      3 Ter uitvoering van de taak, bedoeld in het eerste lid, kunnen bij ministeriële regeling nadere regels worden
      gesteld omtrent:

      a. de gegevens en inlichtingen waarvan Onze Minister kan verlangen dat zij hem worden verstrekt,

      b. degenen van wie Onze Minister, onverminderd [artikel 34][ref1], kan verlangen dat zij hem gegevens en
      inlichtingen verstrekken, en

      c. de termijn waarbinnen, de wijze waarop en de vorm waarin de gegevens en inlichtingen aan Onze Minister worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel34
