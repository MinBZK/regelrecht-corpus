  - number: 81d
    text: |-
      1 De tarieven treden in werking op een door de raad van bestuur van de mededingingsautoriteit te bepalen datum en
      gelden tot 1 januari van het jaar, volgend op de datum van inwerkingtreding van het besluit tot vaststelling van
      de tarieven.

      2 Indien op 1 januari de tarieven voor het volgende jaar nog niet zijn vastgesteld, gelden de tarieven tot de datum
      van inwerkingtreding van het besluit tot vaststelling van de tarieven voor het volgende jaar.

      3 Iedere netbeheerder legt een exemplaar van de voor hem geldende tarieven voor een ieder ter inzage in al zijn
      vestigingen.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel81d
  - number: 81e
    text: |-
      1 Het tarief voor de meting van gas bij afnemers als bedoeld in [artikel 43, eerste lid][ref1], heeft betrekking
      op:

      a. het beheer van de meetinrichtingen;

      b. het verschaffen van toegang tot meetgegevens als bedoeld in [artikel 13b, tweede en derde lid][ref2].

      2 De tarieven voor de meting van gas bij afnemers als bedoeld in [artikel 43, eerste lid][ref3], worden vastgesteld
      door de raad van bestuur van de mededingingsautoriteit na overleg met de gezamenlijke netbeheerders en met
      representatieve organisaties van partijen op de gasmarkt. Bij ministeriële regeling kunnen nadere regels worden
      gesteld met betrekking tot procedure tot vaststelling van de tarieven voor de meting van gas bij afnemers als
      bedoeld in artikel 43, eerste lid, en de wijze van berekening van deze tarieven.


