  - number: 60aj
    text: |-
      1 Een beschikking tot oplegging van een last onder dwangsom of een bestuurlijke boete wordt, nadat zij bekend is
      gemaakt, ter inzage gelegd bij de raad van bestuur van de mededingingsautoriteit.

      2 Van de beschikking wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel60aj
  - number: 60al
    text: Verzet schorst de tenuitvoerlegging van een dwangbevel dat strekt tot invordering van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel60al
  - number: '61'
    text: |-
      1 Tegen een op grond van deze wet genomen besluit, met uitzondering van een besluit op grond van de
      [artikelen 16][ref1], [60ac][ref2] en [60ad][ref3], kan een belanghebbende beroep instellen bij het College van
      beroep voor het bedrijfsleven.

      2 Indien beroep wordt ingesteld tegen een besluit als bedoeld in de [artikelen 16][ref4], [60ac][ref5] en
      [60ad][ref6] is, in afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref7], de rechtbank te Rotterdam
      bevoegd.

      3 Voor zover een door de raad van bestuur van de mededingingsautoriteit genomen besluit, genomen op grond van
      de [artikelen 12f][ref8], [12g][ref9], [23][ref10], [24, tweede lid][ref11], [25, derde en vierde lid][ref12],
      [81][ref13], [81c][ref14] en [82][ref15] aangemerkt wordt als algemeen verbindend voorschrift, kan een
      belanghebbende beroep instellen bij het College van beroep voor het bedrijfsleven.

      4 Een representatieve organisatie van netgebruikers op de gasmarkt wordt geacht belanghebbende te zijn bij
      besluiten genomen op grond van deze wet.


