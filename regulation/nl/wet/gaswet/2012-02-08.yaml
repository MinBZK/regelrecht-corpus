  - number: 14a
    text: |-
      1 Behoudens [artikel 15][ref1] is een LNG-bedrijf verplicht, in voorkomend geval tezamen met een verwant bedrijf,
      aan degene die daarom verzoekt een aanbod te doen met behulp van de door hem beheerde LNG-installatie en van één
      of meer installaties van het verwante bedrijf, ten behoeve van verzoeker LNG-activiteiten en de die activiteiten
      ondersteunende diensten uit te voeren. Het aanbod bevat een tarief, berekend op basis van een berekeningsmethodiek
      die, en tegen voorwaarden die, in overeenstemming zijn met die welke overeenkomstig [artikel 13][ref2] door de raad
      van bestuur van de mededingingsautoriteit zijn goedgekeurd.

      2 Indien een LNG-bedrijf, een onjuiste toepassing geeft aan de overeenkomstig [artikel 13][ref3] goedgekeurde
      berekeningsmethodiek en de voorwaarden, geeft de raad van bestuur van de mededingingsautoriteit dat bedrijf een
      bindende aanwijzing met betrekking tot de wijze waarop die berekeningsmethodiek en die voorwaarden behoren te
      worden toegepast.

      3 Een LNG-bedrijf hanteert voorwaarden die redelijk, transparant en niet-discriminatoir zijn.

      4 De [artikelen 236][ref4] en [237 van Boek 6 van het Burgerlijk Wetboek][ref5] zijn mede van toepassing op
      voorwaarden in overeenkomsten met afnemers als bedoeld in [artikel 43, eerste lid][ref6], die rechtspersoon zijn of
      handelen in de uitoefening van een beroep of bedrijf.


