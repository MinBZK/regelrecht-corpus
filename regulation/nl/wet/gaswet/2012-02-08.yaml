  - number: 17a
    text: |-
      1 Indien een afnemer van leverancier wisselt, voert de netbeheerder die wisseling uit overeenkomstig bij
      ministeriële regeling te stellen regels.

      2 In de ministeriële regeling, bedoeld in het eerste lid, worden in ieder geval regels gesteld over de termijn
      waarbinnen de wisseling moet zijn uitgevoerd en over de bij een verzoek om wisseling te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel17a
  - number: 17b
    text: |-
      1 Degene die gas op het gastransportnet invoedt is tot een virtueel punt op het gastransportnet verantwoordelijk
      voor het opstellen van een programma, waarin is opgenomen:

      a. hoeveel gas waar op het gastransportnet wordt ingevoed en

      b. ten aanzien van hoeveel gas netto op het virtuele punt op het gastransportnet de programmaverantwoordelijkheid
      overgaat en op wie.

      2 Degene die gas aan het gastransportnet onttrekt is vanaf een virtueel punt op het gastransportnet
      verantwoordelijk voor het opstellen van een programma, waarin is opgenomen:

      a. ten aanzien van hoeveel gas netto op het virtuele punt op het gastransportnet de programmaverantwoordelijkheid
      overgaat en van wie en

      b. hoeveel gas waar aan het gastransportnet wordt onttrokken.

      3 Een programmaverantwoordelijke is verantwoordelijk voor een afwijking van zijn programma.

      4 Voor de onttrekking van gas door een afnemer als bedoeld in [artikel 43, eerste lid][ref1], draagt een
      vergunninghouder programmaverantwoordelijkheid.

      5 De programmaverantwoordelijkheid kan worden overgedragen.

      6 Een programmaverantwoordelijke stuurt zijn programma naar de netbeheerder van het landelijk gastransportnet.

      7 De netbeheerder van het landelijk gastransportnet kan, in het belang van de doelmatige uitvoering van zijn
      wettelijke taken, instructies geven over een ingediend programma.


