      1 Geschillen met betrekking tot de wijze waarop een gasopslagbedrijf toepassing geeft aan de [artikelen 18c][ref1]
      en [18d][ref2] worden, met inachtneming van deze wet, overeenkomstig de procedure, zoals opgenomen in
      [artikel 59 van de Mededingingswet][ref3], beslecht door de raad van bestuur van de mededingingsautoriteit.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de door partijen bij het
      geschil te verstrekken gegevens, alsmede met betrekking tot de termijnen voor de gegevensverstrekking.

      3 Indien een geschil betrekking heeft op een voorwaarde of een tarief voor het verrichten van gasopslag of die
      opslag ondersteunende diensten, kan de raad van bestuur van de mededingingsautoriteit voor een door hem te bepalen
      termijn die voorwaarde of dat tarief vaststellen.


