  - number: 10e
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent een goed financieel beheer
      van de netbeheerder.

      2 De in het eerste lid bedoelde regels houden in ieder geval in dat

      a. de netbeheerder voldoet aan bij of krachtens die maatregel gestelde eisen aan zijn kredietwaardigheid waaronder
      de verhouding tussen vreemd vermogen en totaal vermogen, of dat

      b. de netbeheerder beschikt over een verklaring van een onafhankelijke deskundige ten aanzien van zijn
      kredietwaardigheid.

      3 In de in het eerste lid bedoelde maatregel kunnen tevens

      a. regels worden gesteld omtrent de wijze van berekening van vermogensonderdelen;

      b. eisen worden gesteld met betrekking tot de in het tweede lid, onderdeel b, bedoelde verklaring en de daar
      bedoelde deskundige.

      4 Indien de netbeheerder niet voldoet aan de regels, bedoeld in het eerste lid:

      a. stelt de netbeheerder de raad van bestuur van de mededingingsautoriteit hiervan onverwijld schriftelijk op de
      hoogte,

      b. stelt de netbeheerder binnen vier weken na de melding een herstelplan op waarin wordt beschreven op
      welke wijze hij het financieel beheer gaat verbeteren en zendt hij dit plan aan de raad van bestuur van de
      mededingingsautoriteit, en

      c. keert de netbeheerder geen dividend uit aan zijn aandeelhouders.

      5 De raad van bestuur van de mededingingsautoriteit kan de netbeheerder aanwijzingen geven met betrekking tot de
      verbetering van het financieel beheer.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel10e
  - number: '12'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld met betrekking tot de tariefstructuren en voorwaarden als bedoeld
      in de [artikelen 12a][ref1] en [12b][ref2].

      2 De raad van bestuur van de mededingingsautoriteit brengt advies uit over het ontwerp van de in het eerste lid
      bedoelde regels.

      3 Een krachtens het eerste lid vastgestelde ministeriële regeling wordt aan de beide kamers der Staten-Generaal
      overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij
      koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten minste
      een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp
      van de ministeriële regeling bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo
      spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de beide kamers van de
      Staten-Generaal besluit het voorstel niet aan te nemen, wordt de ministeriële regeling ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
