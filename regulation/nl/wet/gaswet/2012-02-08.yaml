  - number: '8'
    text: |-
      1 Een netbeheerder beschikt over een doeltreffend systeem voor de beheersing van de kwaliteit van zijn
      transportdienst, waaronder in elk geval te verstaan de betrouwbaarheid en de veiligheid van die transportdienst, en
      over voldoende capaciteit voor het transport van gas om te voorzien in de totale behoefte.

      2 Een netbeheerder dient om het jaar bij de raad van bestuur van de mededingingsautoriteit een door hem vastgesteld
      document in waarin hij:

      a. aangeeft welk kwaliteitsniveau hij nastreeft,

      b. aangeeft welke veiligheidsindicatoren hij toepast,

      c. aannemelijk maakt dat hij beschikt over een doeltreffend kwaliteitsbeheerssysteem voor zijn transportdienst,

      d. aannemelijk maakt dat hij over voldoende capaciteit beschikt om te voorzien in de totale behoefte aan het
      transport van gas,

      e. aangeeft welke capaciteitsknelpunten in de door hem beheerde netten bestaan en welke maatregelen hij zal nemen
      om deze op te heffen,

      f. aangeeft welke investeringen hij zal doen om de capaciteitsknelpunten op te heffen,

      g. aangeeft welke investeringen hij zal doen voor de vervanging en uitbreiding van de door hem beheerde netten,

      h. aangeeft binnen welke termijnen hij voornoemde investeringen zal doen, en

      i. aangeeft welke investeringen ter uitbreiding van zijn gastransportnet naar zijn oordeel noodzakelijk zijn om te
      voorzien in de totale behoefte aan het transport van gas.

      3 Bij ministeriële regeling worden regels, die kunnen verschillen per drukniveau, gesteld over:

      a. de eisen aan het kwaliteitsbeheersingssysteem;

      b. de veiligheidsindicatoren;

      c. de te verschaffen informatie over het nagestreefde kwaliteitsniveau en over het kwaliteitsbeheersingssysteem;

      d. de wijze van ramen van de totale behoefte aan capaciteit voor het transport van gas;

      e. de te verschaffen gegevens over de totale behoefte aan capaciteit voor het transport van gas en over de wijze
      waarop de netbeheerder voornemens is te voorzien in de totale behoefte aan capaciteit voor het transport van gas;

      f. investeringen met betrekking tot een gastransportnet;

      g. de periode waarop het document of onderdelen daarvan betrekking hebben.

      4 De netbeheerder maakt het document op een geschikte wijze openbaar.

      5 Bij ministeriële regeling kan worden bepaald dat een door een geaccrediteerde instelling aan een netbeheerder
      verstrekt certificaat van conformiteit aan het bepaalde bij of krachtens dit artikel, ten behoeve van het toezicht
      op de naleving van dit artikel, het vermoeden oplevert dat de netbeheerder een kwaliteitsbeheersingssyteem heeft en
      daaraan uitvoering geeft overeenkomstig het bepaalde bij of krachtens dit artikel.

      6 De netbeheerder handelt naar zijn voornemens, opgenomen in het document, bedoeld in het tweede lid. Hij meldt de
      raad van bestuur van de mededingingsautoriteit indien hij hiervan heeft afgeweken.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel8
  - number: 8a
    text: |-
      1 Indien zich met betrekking tot een gastransportnet een voorval voordoet of heeft voorgedaan, waardoor nadelige
      gevolgen voor de mens of het milieu zijn ontstaan of dreigen te ontstaan, meldt de netbeheerder dat voorval zo
      spoedig mogelijk aan Onze Minister.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de door de netbeheerder te
      nemen maatregelen ten aanzien van de veiligheid en betrouwbaarheid van zijn netten.

      3 Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de meldplicht, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel8a
  - number: '9'
    text: |-
      1 Indien naar het oordeel van de raad van bestuur van de mededingingsautoriteit uit het document, bedoeld
      in [artikel 8][ref1], of uit de overzichten, bedoeld in [artikel 35b][ref2], of anderszins, blijkt dat een
      netbeheerder in onvoldoende mate of op een ondoelmatige wijze kan of zal kunnen voorzien in het door hem te
      bereiken niveau van de kwaliteit van zijn transportdienst of in de totale behoefte aan capaciteit voor het
      transport van gas over de door hem beheerde netten, meldt hij zulks na overleg met de netbeheerder van het
      landelijk gastransportnet en de netbeheerder van het desbetreffende net aan Onze Minister.

      2 Nadat hij een melding heeft ontvangen, kan Onze Minister aan de desbetreffende netbeheerder opdragen
      voorzieningen te treffen teneinde zeker te stellen dat het transport van gas in voldoende mate of op een doelmatige
      wijze plaatsvindt.

      3 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de opdracht, bedoeld
      in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel35b
