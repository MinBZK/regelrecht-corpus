  - number: 54b
    text: |-
      1 De netbeheerder van het landelijk gastransportnet kan, ten einde te waarborgen dat hij de taken, bedoeld in
      artikel 54a, zo doelmatig mogelijk kan uitvoeren, voorwaarden stellen aan de wijze waarop het gas van de houders
      van Nederlandse winningsvergunningen dan wel degene met wie voor het gebruik van die vergunning een overeenkomst is
      gesloten inzake het voor gezamenlijke rekening winnen van gas, wordt ingenomen.

      2 Gasbedrijven, netgebruikers en afnemers verstrekken de netbeheerder van het landelijk gastransportnet desgevraagd
      tijdig voldoende inlichtingen en gegevens om te waarborgen dat hij de taken, bedoeld in het eerste lid kan
      uitvoeren.

      3 Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de in het eerste lid bedoelde voorwaarden
      en de in het tweede lid genoemde gegevens en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel54b
  - number: '55'
    text: |-
      1 Onze Minister stelt tenminste eenmaal in de vijf jaar vast van welke hoeveelheid gas, dat wordt gewonnen
      uit het Groningen veld op basis van de bij koninklijk besluit van 30 mei 1963, nr. 39 (Stcrt. 126) verleende
      winningsvergunning, de op grond van [artikel 53][ref1] aangewezen rechtspersoon uit mag gaan bij de uitvoering van
      de taken, bedoeld in [artikel 54, eerste lid, onderdelen a en b][ref2]. Bij iedere vaststelling geeft Onze Minister
      aan welke hoeveelheid de komende tien jaar ten hoogste gemiddeld per jaar mag worden gewonnen. De vaststelling
      maakt onderdeel uit van de voorschriften aan de houder van bovengenoemde winningsvergunning als bedoeld in
      [artikel 36, tweede en derde lid, van de Mijnbouwwet][ref3].

      2 Onze Minister kan de in het eerste lid bedoelde rechtspersoon aanwijzingen geven in het belang van een goede
      vervulling van de in [artikel 54, eerste lid][ref4], bedoelde taken.

      3 Onze Minister kan de netbeheerder van het landelijk gastransportnet aanwijzingen geven in het belang van een
      goede vervulling van de in [artikel 54a, eerste lid][ref5], bedoelde taken.

      4 Een aanwijzing als bedoeld in het tweede en derde lid wordt bekendgemaakt in de Staatscourant.


