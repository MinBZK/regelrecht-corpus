  - number: '53'
    text: Onze Minister wijst voor de in deze paragraaf omschreven taken een rechtspersoon aan.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel53
  - number: '54'
    text: |-
      1 In het belang van het planmatig beheer van voorkomens van gas, ter verzekering op lange termijn van een
      behoedzaam en rationeel gebruik van deze natuurlijke hulpbron, verricht de op grond van [artikel 53][ref1]
      aangewezen rechtspersoon de volgende taken:

      a. het zorg dragen voor de afname van gas dat wordt gewonnen in het gebied dat is aangewezen in de bij koninklijk
      besluit van 30 mei 1963, nr. 39 (Stcrt. 126) verleende winningsvergunning, op een wijze die ook mogelijk maakt het
      winnen van gas in andere gebieden binnen Nederland en het in [artikel 17][ref2] bedoelde gebied in het planmatig
      beheer te betrekken;

      b. het op verzoek van houders van een andere Nederlandse winningsvergunning dan bedoeld in onderdeel a,
      dan wel van degene met wie voor het gebruik van die vergunning een overeenkomst is gesloten inzake het voor
      gezamenlijke rekening winnen van gas, zorg dragen voor de afname van gas dat wordt gewonnen in het gebied waarop
      de winningsvergunning betrekking heeft, onder redelijke voorwaarden en tegen betaling van een op marktconforme
      grondslag bepaalde vergoeding;

      c. het jaarlijks aan Onze Minister overleggen van een overzicht waarin ten aanzien van de eerstvolgende twintig
      jaar ramingen zijn opgenomen met betrekking tot de uitoefening van de taken, bedoeld in de onderdelen a en b, onder
      vermelding van daarbij gehanteerde vooronderstellingen en relevante onderscheidingen.

      2 Onze Minister kan de in het eerste lid bedoelde rechtspersoon tijdelijk ontheffing verlenen van de in het
      eerste lid, onder b, bedoelde verplichting, indien deze rechtspersoon door naleving van die verplichting ernstige
      economische en financiële moeilijkheden ondervindt of dreigt te ondervinden.

      3 Indien de netbeheerder van het landelijk gastransportnet op grond van [artikel 54a, derde lid][ref3], geen
      uitvoering geeft aan artikel 54a, eerste lid, dan vervalt de verplichting, bedoeld in het eerste lid, onderdeel b.


