  - number: 81c
    text: |-
      1 De raad van bestuur van de mededingingsautoriteit stelt met betrekking tot het transport van gas dat bestemd
      is voor levering aan afnemers voor iedere netbeheerder de tarieven, die kunnen verschillen voor de verschillende
      netbeheerders en voor de onderscheiden tariefdragers en die deze ten hoogste mag berekenen voor het transport van
      dat gas en de dat transport ondersteunende diensten, alsmede de tarieven voor het verzorgen van een aansluiting en
      aansluitpunt, jaarlijks vast.

      2 De raad van bestuur van de mededingingsautoriteit kan de tarieven die zullen gelden in het jaar t corrigeren,
      indien de tarieven die golden in het jaar of de jaren voorafgaand aan het jaar t:

      a. bij rechterlijke uitspraak of met toepassing van de [artikelen 6:18][ref1] of
      [7:11 van de Algemene wet bestuursrecht][ref2] zijn gewijzigd;

      b. zijn vastgesteld met inachtneming van onjuiste of onvolledige gegevens en de raad van bestuur van de
      mededingingsautoriteit, indien hij de beschikking had over juiste of volledige gegevens, tarieven zou hebben
      vastgesteld die in aanmerkelijke mate zouden afwijken van de vastgestelde tarieven;

      c. zijn vastgesteld met gebruikmaking van geschatte gegevens en de feitelijk gegevens daarvan afwijken;

      d. zijn vastgesteld met gebruikmaking van gegevens omtrent kosten voor bepaalde diensten, terwijl netbeheerders die
      diensten in het jaar t of een gedeelte van jaar t niet hebben geleverd of voor die diensten geen of minder kosten
      hebben gemaakt.

      3 Indien het voorstel niet binnen de termijn, bedoeld in [artikel 81b, eerste lid][ref3], aan de raad van bestuur
      van de mededingingsautoriteit is gezonden, stelt deze de tarieven voor de desbetreffende netbeheerder uit eigen
      beweging vast met inachtneming van [artikel 81b][ref4].

      4 Indien de totale inkomsten aan het begin van de periode, bedoeld in [artikel 81, eerste lid][ref5], niet
      in overeenstemming zijn met het efficiënte kostenniveau inclusief een rendement dat in het economisch verkeer
      gebruikelijk is, kan de raad van bestuur van de mededingingsautoriteit bij de toepassing van de formule, genoemd
      in [artikel 81b, eerste lid, onderdeel d][ref6], in plaats van TIt-1, de totale inkomsten vaststellen op het
      efficiënte kostenniveau, inclusief een rendement dat in het economisch verkeer gebruikelijk is.

      5 Indien een besluit op grond van [artikel 81, eerste lid][ref7], of [81a, eerste lid][ref8], bij onherroepelijke
      rechterlijke uitspraak is vernietigd of bij een onherroepelijk besluit op bezwaar is herroepen, herberekent de
      raad van bestuur van de mededingingsautoriteit de tarieven, bedoeld in het eerste lid, met toepassing van de met
      inachtneming van die uitspraak of dat besluit op bezwaar gecorrigeerde methode onderscheidenlijk gecorrigeerde
      doelmatigheidskorting, kwaliteitsterm of rekenvolume, en verdisconteert hij de uitkomsten van deze herberekening
      in de eerstvolgende op grond van het eerste lid vast te stellen tarieven. Daarbij worden deze herberekening en de
      wijze waarop de uitkomsten daarvan in de tarieven zijn verdisconteerd separaat weergegeven.


