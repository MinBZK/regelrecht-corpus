      1 Van de [artikelen 17b, vierde lid][ref1], [44][ref2] en
      [52b, tweede, derde en achtste tot en met twaalfde lid][ref3], kan worden afgeweken indien er sprake is van een
      overeenkomst tot levering van gas aan een groep afnemers, waarbij:

      a. de meerderheid van deze afnemers rechtspersoon is of handelt in de uitoefening van een beroep of bedrijf;

      b. alle afnemers in de overeenkomst vertegenwoordigd worden;

      c. deze vertegenwoordiger er zorg voor draagt dat hij ten aanzien van alle aansluitingen met een capaciteit van ten
      hoogste 40 m3(n) per uur over toestemming tot vertegenwoordiging in het kader van de overeenkomst beschikt.


