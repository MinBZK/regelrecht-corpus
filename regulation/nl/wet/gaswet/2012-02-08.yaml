      [52a, derde lid][ref22], [52d][ref23], [56][ref24], [artikel 66d, eerste en derde lid][ref25],
      [82, eerste en derde lid][ref26], en [83][ref27], alsmede [artikel 5:20 van de Algemene wet bestuursrecht][ref28],
      de overtreder per overtreding een bestuurlijke boete opleggen van ten hoogste € 450 000 of, indien dat meer is, 1%
      van de omzet van de overtreder in het boekjaar voorafgaande aan de beschikking, en

      b. de [artikelen 2, eerste en tweede lid][ref29], [2c, tweede en derde lid][ref30], [3, eerste lid][ref31],
      [3b, eerste en tweede lid][ref32], [3c, eerste en tweede lid][ref33], [7][ref34], [7a, eerste en tweede lid][ref35],
      [8][ref36], [9a][ref37], [10, eerste lid, derde lid, onderdeel a, en vierde tot en met zesde lid][ref38],
      [10a, eerste, tweede en derde lid][ref39], [10b, eerste en tweede lid][ref40], [10c, eerste en tweede lid][ref41],
      [10d, eerste lid][ref42], [10e][ref43],[12a][ref44], [12b][ref45], [12e, eerste lid][ref46],
      [12f][ref47], [12g][ref48], [13b][ref49], [13c][ref50], [13d, eerste tot en met vierde lid][ref51],
      [13e, eerste tot en met vierde lid, zesde, zevende en negende lid][ref52], [12f][ref53], [18a, tweede lid][ref54],
      [18b, eerste lid][ref55], [18g, eerste tot en met derde lid][ref56], [23][ref57], [24, tweede lid][ref58],
      [25, derde en vierde lid][ref59],[32][ref60], [35a][ref61], [37][ref62], [39, tweede lid][ref63],
      [40, eerste, derde en vierde lid][ref64], [43, eerste lid][ref65], [44, eerste en vijfde lid][ref66],
      [44a][ref67], [44b eerste, tweede, vijfde en zesde lid][ref68], [47, tweede lid][ref69], [51][ref70],
      [52b][ref71], [60, tweede lid][ref72], [63][ref73], [66a][ref74], [66b][ref75], [66c][ref76], [72][ref77],
      [73, vierde lid][ref78] en [85b][ref79] de overtreder per overtreding een bestuurlijke boete opleggen van ten
      hoogste 10% van de omzet van de overtreder in het boekjaar voorafgaande aan de beschikking.

      2 Indien op grond van [artikel 5:1, derde lid, van de Algemene wet bestuursrecht][ref80] toepassing is gegeven aan
      [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref81], bedraagt de bestuurlijke boete voor de
      daar bedoelde overtreder ten hoogste € 450 000.

      3 De berekening van de netto-omzet, bedoeld in het eerste lid, geschiedt op de voet van
      [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref82].


