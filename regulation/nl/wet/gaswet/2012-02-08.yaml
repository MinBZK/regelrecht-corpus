  - number: 35b
    text: |-
      1 De netbeheerder, met uitzondering van de netbeheerder van het landelijk gastransportnet, verstrekt binnen zes
      maanden na afloop van ieder kalenderjaar aan de raad van bestuur van de mededingingsautoriteit:

      a. een overzicht van de door hem gesloten overeenkomsten met betrekking tot het verrichten van diensten ten
      behoeve van het netbeheer, vergezeld van afschriften van die overeenkomsten, voorzover de raad van bestuur van de
      mededingingsautoriteit daarover niet reeds beschikt,

      b. een overzicht van het aantal personen dat bij de netbeheerder werkzaam is ter uitvoering van de in
      [artikelen 10][ref1], [42][ref2] en [hoofdstuk 2][ref3] genoemde taken,

      c. een overzicht van in het afgelopen jaar gerealiseerde investeringen in het gastransportnet,

      d. een overzicht van de financiële middelen waarover hij beschikt ten behoeve van de uitvoering van zijn wettelijke
      taken, waaruit blijkt welke financiële middelen voor de afzonderlijke taken beschikbaar zijn, en

      e. een verklaring van een onafhankelijke deskundige omtrent het in onderdeel d bedoelde overzicht.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de overzichten, bedoeld in het eerste
      lid, onderdelen a tot en met d, en de verklaring, bedoeld in het eerste lid, onderdeel e.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
