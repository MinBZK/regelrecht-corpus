      [Artikel 34][ref1] is van overeenkomstige toepassing op de raad van bestuur van de mededingingsautoriteit,
      voor zover hij inlichtingen en gegevens nodig heeft voor de uitvoering van zijn taken op grond van deze wet, de
      verordening of verordening 994/2010, met dien verstande dat hij de door hem verkregen inlichtingen en gegevens
      ook kan gebruiken in verband met de toepassing van de [Mededingingswet][ref2], de [artikelen 4.4][ref3] en
      [4.5 van de Wet handhaving consumentenbescherming][ref4] en de [Elektriciteitswet 1998][ref5].


