  - number: 39c
    text: |-
      1 Onze Minister is de aangewezen minister, bedoeld in
      [artikel 3.35, tweede en derde lid, van de Wet ruimtelijke ordening][ref1].

      2 Indien toepassing wordt gegeven aan [artikel 3.28, vierde lid, van de Wet ruimtelijke ordening][ref2] treden, in
      afwijking van dat artikellid, Onze Minister en Onze Minister van Infrastructuur en Milieu gezamenlijk in de plaats
      van burgemeester en wethouders ten aanzien van de bevoegdheden en verplichtingen, bedoeld in dat artikellid.

      3 Onze Minister kan, in overeenstemming met het gevoelen van de ministerraad, bepalen dat
      Onze Minister en Onze Minister wie het mede aangaat, met overeenkomstige toepassing van
      [artikel 3.35, derde lid, vierde volzin, van de Wet ruimtelijke ordening][ref3], één of meer besluiten nemen
      die nodig zijn voor de aanleg of uitbreiding van een daarbij aangewezen net of installatie als bedoeld in
      [artikel 39b, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.28
