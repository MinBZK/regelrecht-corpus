    text: |-
      Een ieder die de productie, de aankoop of de levering van gas verricht, onthoudt zich van iedere bemoeiing met
      de uitvoering van de taken die een netbeheerder heeft ingevolge de [artikelen 10][ref1], [10a][ref2], [42][ref3]
      en [54a][ref4], alsmede [hoofdstuk 2][ref5], tenzij de netbeheerder hem als verwant bedrijf uitdrukkelijk
      verzoekt een dat transport ondersteunende dienst te verrichten. Dit vormt evenwel geen beletsel voor passende
      coördinatiemaatregelen zoals bedoeld in artikel 9, tweede lid, onder c, van de richtlijn.


