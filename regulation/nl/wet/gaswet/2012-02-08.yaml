        bwb_id: BWBR0011440
        hoofdstuk: '2'
  - number: 35c
    text: |-
      De netbeheerder, met uitzondering van de netbeheerder van het landelijk gastransportnet, draagt er zorg voor dat de
      afnemers die op zijn gastransportnet zijn aangesloten een overzicht ontvangen waarop de kosten in verband met die
      aansluiting overzichtelijk en begrijpelijk zijn gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel35c
  - number: 35d
    text: |-
      1 Een netbeheerder voorziet in een transparante, eenvoudige en goedkope procedure voor de behandeling van klachten
      van afnemers als bedoeld in [artikel 43, eerste lid][ref1], over het netbeheer.

      2 De in het eerste lid bedoelde procedure voorziet er voorts in dat:

      a. de behandeling van de klacht geschiedt door een persoon die niet bij de gedraging waarop de klacht betrekking
      heeft, betrokken is geweest,

      b. de klager schriftelijk en gemotiveerd in kennis wordt gesteld van de bevindingen naar aanleiding van de klacht
      en van de conclusies die daaraan worden verbonden, en

      c. de klacht zo spoedig mogelijk doch uiterlijk binnen acht weken wordt afgehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 35e
    text: |-
      1 Een netbeheerder draagt er, al dan niet samen met een of meer andere netbeheerders, zorg voor dat onderbrekingen
      in het transport van gas en waarnemingen van gaslucht door afnemers op een eenvoudige wijze gemeld kunnen worden en
      maakt aan afnemers bekend op welke wijze deze meldingen kunnen geschieden.

      2 Een netbeheerder registreert, al dan niet samen met andere netbeheerders, van de gemelde onderbrekingen en
      waarnemingen, de datum en het tijdstip en, met betrekking tot onderbrekingen, het begin van de onderbrekingen,
      de duur van de onderbrekingen, de locatie, aard en oorzaak van de onderbrekingen alsmede het aantal getroffen
      afnemers.

      3 Een netbeheerder maakt de actuele stand van zaken betreffende de geregistreerde onderbrekingen en waarnemingen
      in zijn net op geschikte wijze openbaar en vermeldt daarbij de datum en het tijdstip en, met betrekking tot
      onderbrekingen, het begin van de onderbrekingen, de duur van de onderbrekingen, de locatie, aard en oorzaak van de
      onderbrekingen alsmede het aantal getroffen afnemers.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel35e
  - number: '37'
    text: |-
      1 Een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf dat bij de uitvoering van zijn taak de beschikking
      krijgt over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht
      tot geheimhouding van die gegevens, behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of
      uit zijn taak de noodzaak tot mededeling voortvloeit.

      2 Indien een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf gegevens over zijn bedrijfsvoering die
      commercieel voordeel kunnen opleveren ter beschikking stelt aan anderen, doet hij dit op niet-discriminatoire
      wijze.

      3 Een netbeheerder maakt bij de aankoop of de verkoop van gas door een verwant bedrijf geen misbruik van
      commercieel gevoelige gegevens van anderen die hij heeft verkregen bij onderhandelingen over transport of bij het
      verrichten van transport.

      4 Een netbeheerder gebruikt aan hem verstrekte gegevens over afnemers als bedoeld in
      [artikel 43, eerste lid][ref1], uitsluitend voor het uitvoeren van zijn taken op grond van deze wet, met dien
      verstande dat deze gegevens mede kunnen worden gebruikt voor het ten behoeve van de vergunninghouder innen van de
      vergoeding voor het leveren van gas.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '38'
    text: |-
      1 De raad van bestuur van de mededingingsautoriteit is de bevoegde instantie als bedoeld in artikel 6, vierde lid,
      van de verordening. Hij keurt, overeenkomstig artikel 6, vierde lid, van de verordening de relevante punten van het
      landelijk gastransportnet, goed.

      2 De raad van bestuur van de mededingingsautoriteit is de bevoegde instantie die overeenkomstig artikel 6, vijfde
      lid, van de verordening beslist op een verzoek van de netbeheerder van het landelijk gastransportnet tot beperking
      van de publicatie van de in dat artikel bedoelde informatie.

      3 Indien de netbeheerder van het landelijk gastransportnet niet in staat is de informatie te publiceren in
      overeenstemming met de verordening stelt hij na overleg met de raad van bestuur van de mededingingsautoriteit een
      actieplan vast voor de uitvoering.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel38
  - number: 38a
    text: |-
      De netbeheerder van het landelijk gastransportnet geeft de raad van bestuur van de mededingingsautoriteit kennis
      van de overeenkomsten en procedures, bedoeld in artikel 8 van de verordening.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel38a
  - number: 38b
    text: |-
      Onze Minister en de raad van bestuur van de mededingingsautoriteit verstrekken de Commissie van de Europese
      Gemeenschappen desgevraagd overeenkomstig artikel 11 van de verordening alle voor de toepassing van artikel 9 van
      de verordening noodzakelijke informatie.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel38b
  - number: '39'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen met betrekking tot daarbij aan te wijzen gebieden regels worden
      gesteld over de wijze waarop, gelet op het belang van een betrouwbaar, duurzaam en doelmatig functionerende
      energiehuishouding, een afweging wordt gemaakt met betrekking tot de aanleg van een gastransportnet en de aanleg
      van leidingen voor het transport van elektriciteit of warmte.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat een gastransportnet slechts wordt aangelegd als
      resultaat van een openbare procedure waarin gegadigden op een te plaatsen opdracht kunnen inschrijven met een
      aanbieding voor de aanleg van een gastransportnet of van leidingen voor het transport van elektriciteit of warmte.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel39
  - number: 39a
    text: |-
      Een gastransportnet dat door een netbeheerder in het kader van de uitoefening van zijn taak, bedoeld in artikel
      10, in werking wordt gehouden, onderhouden of ontwikkeld, wordt voor de toepassing van de [Belemmeringenwet
      Verordeningen](onbekend) en de [Belemmeringenwet Privaatrecht](onbekend) aangemerkt als openbaar werk van algemeen
      nut.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel39a
  - number: 39b
    text: |-
      1 De procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel c, van de Wet ruimtelijke ordening][ref1],
      is van toepassing op:

      a. een uitbreiding van het landelijk gastransportnet, voor zover het betreft de van dat net deel uitmakende
      leidingen met een druk van ten minste 40 bar en een diameter van ten minste 45,7 centimeter, met inbegrip van de
      aansluitingen op die leidingen;

      b. de aanleg of uitbreiding van een landsgrensoverschrijdend gastransportnet als bedoeld in artikel 18h, met
      inbegrip van de aansluitingen op zo’n net;

      c. de aanleg of uitbreiding van een LNG-installatie met een capaciteit van ten minste 4 miljard m3, met inbegrip
      van de aansluiting van de installatie op een net.

      2 Een gasbedrijf meldt een voornemen tot aanleg of uitbreiding van een net of installatie als bedoeld in het eerste
      lid, zo spoedig mogelijk schriftelijk aan Onze Minister. Bij ministeriële regeling kan voor het doen van de melding
      en de daarbij te verstrekken gegevens een formulier worden vastgesteld.

      3 Indien, in aanmerking genomen de omvang, aard en ligging van een net of een deel daarvan of een installatie
      als bedoeld in het eerste lid, alsmede het aantal voor de aanleg of uitbreiding van dat net of die installatie
      benodigde besluiten, redelijkerwijze niet valt te verwachten dat toepassing van de procedure, bedoeld in het
      eerste lid, de besluitvorming in betekenende mate zal versnellen of daaraan anderszins aanmerkelijke voordelen zijn
      verbonden, kan Onze Minister bepalen dat:

      a. geen van de procedures, bedoeld in [artikel 3.35, eerste lid][ref2],

      b. uitsluitend de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel a][ref3],

      c. uitsluitend de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel b][ref4], of

      d. de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel a][ref5], gevolgd door de procedure,
      bedoeld in artikel 3.35, eerste lid, aanhef en onderdeel b, van de Wet ruimtelijke ordening, van toepassing zijn of
      is op de aanleg of uitbreiding van dat net of die installatie. Onze Minister hoort de beheerder van het net en de
      betrokken bestuursorganen over een voornemen toepassing te geven aan de bevoegdheid, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
      [ref5]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel39b
