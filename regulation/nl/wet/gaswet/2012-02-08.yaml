  - number: '62'
    text: |-
      Provinciale staten en de gemeenteraad zijn niet bevoegd het transporteren en het leveren van gas in het belang van
      de energievoorziening aan regels te binden.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel62
  - number: '63'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van een besluit op grond van het Verdrag tot oprichting
      van de Europese Gemeenschap regels worden gesteld met betrekking tot de voorwaarden die door een gasbedrijf in het
      belang van de veiligheid en de doelmatigheid worden gesteld voor het leveren van gas of voor het aansluiten van
      toestellen of installaties die gas verbruiken, en de toepassing van zodanige voorwaarden.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel63
  - number: '64'
    text: |-
      1 Overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels is een door Onze Minister vast
      te stellen vergoeding verschuldigd voor het verlenen van een ontheffing als bedoeld in [artikel 2a][ref1], een
      instemming als bedoeld in [artikel 4, tweede lid][ref2], van een aanwijzing als bedoeld in [artikel 5][ref3],
      een ontheffing als bedoeld in [artikel 16][ref4] of [artikel 18h][ref5] of van een vergunning als bedoeld in
      [artikel 43][ref6], welke vergoeding verschuldigd is voor ten hoogste de kosten van de bemoeiingen met betrekking
      tot de instemming, de aanwijzing, de ontheffing, de vergunning onderscheidenlijk het certificaat.

      2 Overeenkomstig de regels, bedoeld in het eerste lid, kunnen aan netbeheerders, LNG-bedrijven, gasopslagbedrijven
      en vergunninghouders tevens de kosten in rekening worden gebracht die gemaakt worden voor de uitvoering van de
      taken en de uitoefening van de bevoegdheden, bedoeld in de [artikelen 12f][ref7], [12g][ref8], [13][ref9] en
      [18 tot en met 18f][ref10], [80 tot en met 82][ref11].

      3 Onze Minister kan het verschuldigde bedrag invorderen bij dwangbevel. Ten aanzien van de in het eerste
      lid bedoelde vergoedingen is, voor zover al niet van toepassing, [titel 4.4][ref12] met uitzondering van de
      [artikelen 4:85][ref13] en [4:95 van de Algemene wet bestuursrecht][ref14] van overeenkomstige toepassing.


