  - number: 16a
    text: |-
      De bevoegde instantie, bedoeld in artikel 5, vierde lid, tweede volzin, van de verordening, is de raad van bestuur
      van de mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0011440/2012-02-08#Artikel16a
  - number: '17'
    text: |-
      1 De [Mededingingswet][ref1] is mede van toepassing ten aanzien van het verrichten van transport van gas met behulp
      van een gasproductienet op het continentaal plat.

      2 Ten aanzien van het transport van gas, bedoeld in het eerste lid, wordt onder gasproductienet niet verstaan de
      pijpleidingen die ter plaatse binnen een olie- of gaswinningsproject worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
