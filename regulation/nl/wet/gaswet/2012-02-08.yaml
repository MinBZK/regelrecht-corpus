  - number: '5'
    text: |-
      1 Indien het aanwijzen van een netbeheerder als bedoeld in [artikel 2, eerste of tweede lid][ref1], niet is
      geschied binnen vier weken na de aanleg van een gastransportnet dan wel onverwijld na het intrekken of vervallen
      van een eerdere aanwijzing, wijst Onze Minister een naamloze of besloten vennootschap aan als netbeheerder van
      dat gastransportnet.

      2 Indien Onze Minister vaststelt dat niet meer voldaan wordt aan de [artikelen 2c][ref2], [3][ref3], [3a][ref4],
      [3b][ref5] of [3c][ref6] of dat een netbeheerder in onvoldoende mate in staat is of zal zijn om aan een
      verplichting als bedoeld in de [artikelen 10e][ref7], [34][ref8] en [35][ref9] te voldoen, om een taak als
      bedoeld in de [artikelen 7a][ref10], [10][ref11], [10a][ref12], [42][ref13] of [54a][ref14] uit te voeren, aan
      [hoofdstuk 2][ref15] te voldoen of indien hij niet voldoet aan een verbod als bedoeld in de [artikelen 10b][ref16],
      [10c][ref17] of [10d][ref18], kan hij de desbetreffende netbeheerder opdragen door hem noodzakelijk geachte
      voorzieningen te treffen.

      3 Indien de netbeheerder niet voldoet aan een opdracht als bedoeld in het tweede lid, opdrachten als bedoeld in
      [artikel 5a, eerste lid][ref19], niet uitvoert of indien naar het oordeel van Onze Minister door de bedrijfsvoering
      van deze netbeheerder de continuïteit of de betrouwbaarheid van de gasvoorziening voor afnemers in gevaar komt en
      onverwijld ingrijpen noodzakelijk is, kan Onze Minister:

      a. de aanwijzing van de desbetreffende netbeheerder vervallen verklaren en uiterlijk op de dag waarop die
      aanwijzing vervalt een andere naamloze of besloten vennootschap als netbeheerder aanwijzen, of

      b. [artikel 5a][ref20] toepassen.

      4 In een beschikking als bedoeld in het derde lid, onderdeel a, bepaalt Onze Minister de termijn waarop de
      aanwijzing vervalt en kan hij degene die de netbeheerder, bedoeld in de aanhef van het derde lid, heeft aangewezen
      in de gelegenheid stellen binnen een door Onze Minister te bepalen termijn een andere netbeheerder aan hem ter
      aanwijzing voor te dragen. Onze Minister kan deze termijn eenmaal verlengen.

      5 Onze Minister kan voor de periode totdat een beschikking als bedoeld in het derde lid, onderdeel a, in werking
      treedt, [artikel 5a][ref21] toepassen.

      6 Uiterlijk op de dag waarop een beschikking als bedoeld in het derde lid, onderdeel a, in werking treedt, draagt
      de netbeheerder, niet zijnde de netbeheerder van het landelijk gastransportnet, de economische eigendom van het
      gastransportnet over aan de door Onze Minister aangewezen nieuwe netbeheerder. Degene die de netbeheerder, bedoeld
      in de aanhef van het derde lid, heeft aangewezen, verleent daaraan voor zover nodig zijn medewerking.

      7 De overdracht van de economische eigendom, bedoeld in het zesde lid, geschiedt tegen verrichting van een
      tegenprestatie waarvan de waarde uiterlijk op de in dat lid bedoelde dag is vastgesteld en die ten hoogste
      de opbrengst vertegenwoordigt van de exploitatie van het gastransportnet, zoals deze op basis van algemene
      bedrijfseconomische uitgangspunten kan worden afgeleid van de in de daaraan voorafgaande periode van vijf jaar
      geldende tarieven met betrekking tot het netbeheer. Deze tegenprestatie kan zowel bestaan uit een periodieke
      uitkering als uit een contant bedrag in eens.

      8 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde in dit
      artikel.


