  - number: 10d
    text: |-
      1 Indien een met de netbeheerder in een groep verbonden groepsmaatschappij in de zin van
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] activiteiten verricht die de netbeheerder op grond
      van [artikel 10b][ref2] en [10c][ref3] niet zelf mag verrichten, mag de netbeheerder of een rechtspersoon waarin
      de netbeheerder een deelneming heeft als bedoeld in artikel 10b en 10c een dergelijke groepsmaatschappij niet
      bevoordelen boven anderen waarmee een dergelijke groepsmaatschappij in concurrentie treedt, of anderszins voordelen
      toekennen die verder gaan dan in het normaal handelsverkeer gebruikelijk is.

      2 Als bevoordelen van een groepsmaatschappij als bedoeld in het eerste lid of het toekennen van voordelen die
      verder gaan dan in het normaal handelsverkeer gebruikelijk is, worden in ieder geval aangemerkt:

      a. het verstrekken van gegevens aan een groepsmaatschappij over afnemers, niet zijnde afnemers als bedoeld in
      [artikel 43, eerste lid][ref4], die een verzoek om aansluiting of transport als bedoeld in [hoofdstuk 2][ref5]
      hebben gedaan;

      b. het leveren van goederen of diensten aan een groepsmaatschappij tegen een vergoeding die lager is dan de
      redelijkerwijs daaraan toe te rekenen kosten, of

      c. het toestaan van het gebruik door een groepsmaatschappij van de naam en het beeldmerk van de netbeheerder op een
      wijze waardoor verwarring bij het publiek te duchten is over de herkomst van goederen of diensten.

      3 De netbeheerder voegt bij zijn jaarrekening een verklaring waaruit blijkt dat de financiële verhouding tussen
      de netbeheerder en de groepsmaatschappijen, bedoeld in het eerste lid, voldoet aan de in het eerste lid gestelde
      eisen. De netbeheerder legt een exemplaar van zijn jaarrekening, de daartoe behorende toelichting en de daarbij
      gevoegde verklaring voor een ieder ter inzage in al zijn kantoren en zendt een exemplaar daarvan aan de Autoriteit
      Consument en Markt.


