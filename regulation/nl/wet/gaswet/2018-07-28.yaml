valid_from: '2018-07-28'
bwb_id: BWBR0011440
url: https://wetten.overheid.nl/BWBR0011440/2018-07-28
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, mede ter uitvoering van richtlijn 98/30/EG van het
    Europees Parlement en de Raad van de Europese Unie van 22 juni 1998 betreffende gemeenschappelijke regels voor de
    interne markt voor aardgas (PbEG 1998, L 204), de mogelijkheden voor levering en in- en uitvoer van gas en voor
    het gebruik van infrastructuur voor gastransport te verruimen en daarvoor met inachtneming van het belang van het
    betrouwbaar, duurzaam, milieuhygiënisch verantwoord en doelmatig functioneren van de gasvoorziening een regeling
    tot stand te brengen met betrekking tot het transport en de levering van gas;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken;

      b. *gas:*

      1°. aardgas dat bij een temperatuur van 15° Celsius en bij een druk van 1,01325 bar in gasvormige toestand verkeert
      en in hoofdzaak bestaat uit methaan of een andere stof die vanwege haar eigenschappen aan methaan gelijkwaardig
      is en

      2°. stof die:

        - is opgewekt in een productie-installatie die uitsluitend gebruik maakt van hernieuwbare energiebronnen of
        - is opgewekt in een hybride productie-installatie die gebruik maakt van zowel hernieuwbare als fossiele
      energiebronnen en
        - bij een temperatuur van 15° Celsius en bij een druk van 1,01325 bar in gasvormige toestand verkeert en in
      hoofdzaak bestaat uit methaan of een andere stof die vanwege haar eigenschappen aan methaan gelijkwaardig is voor
      zover het mogelijk en veilig is deze stof overeenkomstig [hoofdstuk 2][ref1] te transporteren;

      c. gasproductienet: een of meer pijpleidingen die onderdeel uitmaken van een olie- of gaswinningsproject of die
      worden gebruikt voor het transport van gas rechtstreeks van een gaswinningsproject naar een verwerkingsinstallatie,
      een opslagplaats of een aanlandingsplaats;

      d. gastransportnet: niet tot een gasproductienet behorende, met elkaar verbonden leidingen of hulpmiddelen bestemd
      of gebruikt voor het transport van gas, met inbegrip van hulpmiddelen en installaties waarmee ondersteunende
      diensten voor dat transport worden verricht, behoudens voor zover deze leidingen en hulpmiddelen onderdeel uitmaken
      van een directe lijn of gelegen zijn binnen de installatie van de afnemer;

      e. netbeheerder: een vennootschap die op grond van [artikel 2][ref2] is aangewezen voor het beheer van een of meer
      gastransportnetten,

      f. gasopslaginstallatie: een installatie voor de opslag van gas, met inbegrip van het gedeelte van een LNG-
      installatie dat voor opslag wordt gebruikt, maar met uitzondering van het gedeelte dat wordt gebruikt voor
      gasproductie, en met uitzondering van installaties die uitsluitend ten dienste staan van de netbeheerder van het
      landelijk gastransportnet bij de uitvoering van zijn taken;

      g. gasopslagbedrijf: een ieder die een gasopslaginstallatie beheert;

      h. LNG-installatie: een installatie die gebruikt wordt voor het vloeibaar maken van gas, of voor de invoer, de
      verlading, of de hervergassing van vloeibaar gas, met inbegrip van ondersteunende diensten en tijdelijke opslag
      die nodig zijn voor het proces van hervergassing en de daaropvolgende levering aan het transportsysteem, met
      uitzondering van de gedeeltes van de installatie die gebruikt worden voor opslag;

      i. LNG-bedrijf: een ieder die een LNG-installatie beheert;

      j. gasbedrijf: een netbeheerder, een gasopslagbedrijf, een LNG-bedrijf of een natuurlijke persoon of een
      rechtspersoon die de productie, de aankoop of de levering van gas verricht, maar geen eindafnemer van dit gas is;

      k. verwant bedrijf: verbonden onderneming in de zin van artikel 41 van de zevende [richtlijn nr. 83/349/
      EEG](31983L0349) van de Raad van 13 juni 1983 op de grondslag van artikel 54, derde lid, sub g, van
      het Verdrag betreffende de geconsolideerde jaarrekening of een geassocieerde onderneming in de zin van
      [artikel 33, eerste lid][ref3], daarvan of een onderneming die aan dezelfde aandeelhouders toebehoort;

      l. netgebruiker: degene voor wie met behulp van een gastransportnet het transport van gas wordt verricht;

      m. aansluiting: één of meer verbindingen tussen een gastransportnet en een onroerende zaak als bedoeld in
      [artikel 16, onderdelen a tot en met e, van de Wet waardering onroerende zaken][ref4], waaronder begrepen één of
      meer verbindingen tussen een gastransportnet dat wordt beheerd door een netbeheerder en een gastransportnet dat
      beheerd wordt door een ander dan die netbeheerder;

      n. landelijk gastransportnet: een gastransportnet dat uitsluitend of in hoofdzaak is bestemd of wordt gebruikt voor
      het op landelijk niveau transporteren van gas;

      o. afnemer: een persoon met een aansluiting op een gastransportnet;

      p. vergunninghouder: een houder van een leveringsvergunning als bedoeld in [artikel 43][ref5];

      q. richtlijn: richtlijn nr. 2009/73/EG van het Europees Parlement en de Raad van 13 juli 2009 betreffende
      gemeenschappelijke regels voor de interne markt voor aardgas en tot intrekking van Richtlijn 2003/55/EG (Pb EU
      2009, L 211);

      r. Autoriteit Consument en Markt: de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref6];

      s.

      t. ondersteunende diensten: de diensten die nodig zijn voor de toegang tot of de werking van gastransportnetten,
      LNG-installaties of opslaginstallaties, met inbegrip van het opvangen van fluctuaties in de belasting van het
      gastransportnet en menging, maar met uitzondering van de installaties die uitsluitend ten dienste staan van de
      netbeheerder van het landelijk gastransportnet bij de uitvoering van zijn taken;

      u. economische eigendom: het krachtens een rechtsverhouding gerechtigd zijn tot alle rechten en bevoegdheden ten
      aanzien van een goed, met uitzondering van het recht op levering, en het gehouden zijn om alle verplichtingen
      ten aanzien van dat goed voor zijn rekening te nemen en daarmee het volledige risico van waardeverandering of
      tenietgaan van het goed te dragen, zonder dat het goed geleverd is;

      v.

      w. programmaverantwoordelijkheid: de verantwoordelijkheid voor het opstellen van een programma als bedoeld in
      [artikel 17b, eerste of tweede lid][ref7];

      x. programmaverantwoordelijke: degene op wie programmaverantwoordelijkheid rust;

      y. continentaal plat: het onder de Noordzee gelegen deel van de zeebodem en de ondergrond daarvan, waarop
      het Koninkrijk mede overeenkomstig het op 10 december 1982 te Montego-Bay gesloten Verdrag inzake het
      recht van de zee (Trb. 1983, 83) soevereine rechten heeft en welke is gelegen aan de zeezijde van de in
      [artikel 1, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref8] bedoelde lijn;

      z. landsgrensoverschrijdend gastransportnet: een gastransportnet dat de grens van tenminste twee landen
      overschrijdt en dat uitsluitend als doel heeft de gastransportnetten van die landen onderling te koppelen;

      aa. aansluitpunt: het deel van de aansluiting vanaf het gastransportnet tot en met de eerste afsluiter;

      ab. meetinrichting: het gehele samenstel van apparatuur dat ten minste tot doel heeft het uitgewisselde gas te
      meten;

      ac. meetbedrijf: een organisatorische eenheid die zich bezighoudt met het collecteren, valideren en vaststellen van
      meetgegevens betreffende gas;

      ad. verordening 715/2009: verordening nr. 715/2009 van het Europees Parlement en de Raad betreffende de voorwaarden
      voor de toegang tot aardgastransmissienetten en tot intrekking van Verordening (EG) nr. 1775/2005 (Pb EU 2009,
      L 211);

      ae. verordening 713/2009: verordening nr. 713/2009 van het Europees Parlement en de Raad van 13 juli 2009 tot
      oprichting van een agentschap voor de samenwerking tussen energieregulators (Pb EU 2009, L 211);

      af. Agentschap: het agentschap, bedoeld in artikel 1, eerste lid, van de verordening 713/2009;

      ag. producent: een organisatorische eenheid die zich bezig houdt met het produceren van gas;

      ah. leverancier: een organisatorische eenheid die zich bezig houdt met het leveren van gas;

      ai. handelaar: een organisatorische eenheid die zich bezighoudt met het sluiten van overeenkomsten betreffende de
      koop en verkoop van gas;

      aj. producent van elektriciteit: een producent als bedoeld in
      [artikel 1, onderdeel g, van de Elektriciteitswet 1998][ref9];

      ak. leverancier van elektriciteit: een leverancier als bedoeld in
      [artikel 1, onderdeel f, van de Elektriciteitswet 1998][ref10];

      al. handelaar in elektriciteit: een handelaar als bedoeld in
      [artikel 1, onderdeel h, van de Elektriciteitswet 1998][ref11];

      am. gesloten distributiesysteem: een net waarvoor op grond van [artikel 2a][ref12] ontheffing is verleend;

      an. directe lijn: een of meer leidingen voor het transport van gas, behoudens voor zover die gelegen is binnen een
      installatie, die:

      1°. niet is verbonden met een gastransportnet of een andere leiding voor het transport van gas en die een
      geïsoleerde productie-installatie van een producent rechtstreeks verbindt met een geïsoleerde verbruiker van gas,
      niet zijnde de producent, of

      2°. ten hoogste via de installatie van één aangeslotene op de leiding is verbonden met een gastransportnet of een
      andere leiding voor het transport van gas en die een productie-installatie van een producent met tussenkomst van
      een leverancier rechtstreeks verbindt met één of meer verbruikers van gas, niet zijnde de producent of in hoofdzaak
      huishoudelijke verbruikers, teneinde te voorzien in de gasbehoefte van deze verbruikers;

      ao. hernieuwbare energiebronnen: hernieuwbare energiebronnen als bedoeld in artikel 2 van de richtlijn 2009/28/
      EG van het Europees Parlement en de Raad van 23 april 2009 ter bevordering van het gebruik van energie uit
      hernieuwbare bronnen en houdende wijziging en intrekking van Richtlijn 2001/77/EG en Richtlijn 2003/30/EG (Pb EU
      2009, L 140);

      ap. verordening 1227/2011: verordening (EU) nr. 1227/2011 van het Europees Parlement en de Raad van 25 oktober 2011
      betreffende de integriteit en transparantie van de groothandelsmarkt voor energie (PbEU 2011, L 326), alsmede de
      door de Europese Commissie vastgestelde gedelegeerde en uitvoeringshandelingen op grond van verordening 1227/2011;

      aq. marktdeelnemer: een marktdeelnemer als bedoeld in artikel 2, zevende lid, van verordening 1227/2011;

      ar. Autoriteit Financiële Markten: de Autoriteit Financiële Markten, genoemd in
      [artikel 1:1 van de Wet op het financieel toezicht][ref13];

      as. *gas uit hernieuwbare energiebronnen:* een stof die is opgewekt in een productie-installatie die uitsluitend
      gebruik maakt van hernieuwbare energiebronnen of is opgewekt met hernieuwbare energiebronnen in een hybride
      productie-installatie die ook gebruik maakt van fossiele energiebronnen;

      at. *garantie van oorsprong voor gas uit hernieuwbare energiebronnen:* gegevens op een rekening die betrekking
      hebben gas uit hernieuwbare energiebronnen en waarmee wordt aangetoond dat een producent met zijn installatie een
      hoeveelheid gas uit hernieuwbare energiebronnen heeft opgewekt;

      au. *productiemeetgegevens:* de gegevens betreffende de hoeveelheid gas uit hernieuwbare energiebronnen die door
      een producent wordt ingevoed op een gastransportnet;

      av. bindende gedragslijn: een zelfstandige last die niet wegens een overtreding wordt opgelegd;

      aw. zelfstandige last: de enkele last tot het verrichten van bepaalde handelingen, bedoeld in
      [artikel 5:2, tweede lid, van de Algemene wet bestuursrecht][ref14], ter bevordering van de naleving van wettelijke
      voorschriften.

      bb. verordening 994/2010: verordening (EU) nr. 994/2010 van het Europees Parlement en de Raad van 20 oktober 2010
      betreffende maatregelen tot veiligstelling van de gaslevering en houdende intrekking van Richtlijn 2004/67/EG (PbEU
      2010, L 295);

      2 Bij algemene maatregel van bestuur kan deze wet geheel of gedeeltelijk van toepassing worden verklaard op andere
      gasvormige stoffen dan de stof, bedoeld in het eerste lid, onderdeel b.

      3 Deze wet en de daarop berustende bepalingen zijn mede van toepassing op gasopslaginstallaties, LNG-installaties
      en landsgrensoverschrijdende gastransportnetten die zijn gelegen binnen de Nederlandse exclusieve economische zone
      of op het continentaal plat.

      4 Voor de toepassing van het bij of krachtens deze wet bepaalde worden meerdere onroerende zaken als bedoeld in
      [artikel 16, onderdeel c, van de Wet waardering onroerende zaken][ref15] die zich bevinden in een bouwwerk met:

      a. een woonfunctie bestemd voor bewoners die zijn ingeschreven aan een instelling als
      bedoeld in [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref16]
      of aan een universiteit of hogeschool als bedoeld in
      [artikel 1.2, onderdelen a en b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref17] of die
      zich voorbereiden op een promotie als bedoeld in [artikel 7.18 van laatstgenoemde wet][ref18],

      b. een woonoppervlak van maximaal 50 vierkante meter per wooneenheid en

      c. gemeenschappelijke ruimtes die een meeromvattende functie hebben dan de reguliere functie van gemeenschappelijke
      ruimten in een appartementencomplex, beschouwd als één onroerende zaak als bedoeld in artikel 16 van de Wet
      waardering onroerende zaken indien de eigenaar hierom verzoekt bij de netbeheerder. Een verzoek kan slechts worden
      ingetrokken ingeval van ingrijpende renovatie van het bouwwerk.


