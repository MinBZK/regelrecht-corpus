      - id: ref1
        bwb_id: BWBR0008691
  - number: 17a
    text: |-
      1 Indien een afnemer van leverancier wisselt, wordt die wisseling uitgevoerd overeenkomstig bij ministeriële
      regeling te stellen regels, welke regels kunnen verschillen voor verschillende netbeheerders en beheerders van
      netten als bedoeld in [artikel 2a][ref1].

      2 In de ministeriële regeling, bedoeld in het eerste lid, worden in ieder geval regels gesteld over de termijn
      waarbinnen de wisseling moet zijn uitgevoerd en over de bij een verzoek om wisseling te verstrekken gegevens.


