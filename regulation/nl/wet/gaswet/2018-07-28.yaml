  - number: 66k
    text: |-
      Een garantie van oorsprong voor gas uit hernieuwbare bronnen toont bij uitsluiting aan dat de daarop aangegeven
      hoeveelheid gas is opgewekt uit hernieuwbare bronnen.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel66k
  - number: 66l
    text: |-
      1 Onze Minister stelt bij ministeriële regeling de tarieven vast voor kosten die gepaard gaan met handelingen met
      betrekking tot garanties van oorsprong voor gas uit hernieuwbare bronnen.

      2 Onze Minister stelt bij ministeriële regeling regels met betrekking tot:

      a. de informatie die door producenten, leveranciers, handelaars, afnemers of netbeheerders verstrekt wordt aan
      Onze Minister;

      b. het uitgeven en de geldigheidsduur van garanties van oorsprong voor gas uit hernieuwbare bronnen;

      c. het vermelden van gegevens op garanties van oorsprong voor gas uit hernieuwbare bronnen;

      d. de voorwaarden waaronder en de wijze waarop producenten, leveranciers, handelaars of afnemers gebruik
      kunnen maken van de door hen verkregen garanties van oorsprong voor gas uit hernieuwbare bronnen of deze kunnen
      verhandelen;

      e. de vaststelling, bedoeld in [artikel 10, vijfde lid, onderdeel c][ref1];

      f. het meten, bedoeld in [artikel 10, vijfde lid, onderdeel c, en tiende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10
