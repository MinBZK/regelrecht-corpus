  - number: '42'
    text: |-
      De netbeheerder die de aansluiting verzorgt bij afnemers heeft in het kader van het transport van gas naar
      die afnemers tot taak het bevorderen van de veiligheid bij het gebruik van toestellen en installaties die gas
      verbruiken.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel42
  - number: 42a
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de eisen waaraan een meetinrichting,
      die moet voldoen aan dit artikel, ten minste voldoet, welke eisen kunnen verschillen per categorie afnemers.

      2 De in het eerste lid bedoelde algemene maatregel van bestuur stelt ten minste eisen betreffende de
      functionaliteiten van de meetinrichting.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels wordt gesteld over meetinrichtingen,
      waaronder in elk geval regels over de installatie van meetinrichtingen en regels over de administratie in verband
      met het vervangen, installeren of verwijderen van meetinrichtingen.

      4 De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen
      vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister van
      Economische Zaken te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-
      Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel42a
  - number: 42b
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. de inrichting van energiekostenramingen en facturen inzake het verbruik van gas,

      b. de frequentie van facturen inzake het verbruik van gas,

      c. het verstrekken van gegevens over het verbruik van gas,

      d. degenen die de informatie, bedoeld in de onderdelen a, b en c, verstrekken, welke regels kunnen verschillen per
      categorie van ontvangers van de informatie, bedoeld in de onderdelen a, b en c,

      e. het op verzoek van een afnemer toesturen van facturen, factureringsinformatie en energiekostenramingen,
      eventueel langs elektronische weg,

      f. de kosten van toegang tot meetgegevens en van facturatie en

      g. degenen die om de informatie, bedoeld in onderdeel e, kunnen verzoeken.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel42b
  - number: 42c
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de informatie die netbeheerders,
      leveranciers of handelaren verstrekken in contracten, rekeningen of ontvangstbewijzen, welke regels per categorie
      afnemers kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel42c
  - number: '43'
    text: |-
      1 Het is verboden zonder vergunning gas te leveren aan afnemers die beschikken over een aansluiting op een net met
      een totale maximale capaciteit van ten hoogste 40 m3(n) per uur.

      2 Het verbod geldt niet ten aanzien van het leveren van gas:

      a. door een buiten Nederland gevestigde leverancier van gas aan ten hoogste 500 afnemers, als bedoeld in het eerste
      lid, die wonen in gebieden aan de Nederlandse landsgrens of

      b. indien het gas anders dan bedrijfsmatig wordt geleverd overeenkomstig bij ministeriële regeling te stellen
      regels;

      c. indien het gas wordt geleverd in het kader van een overeenkomst als bedoeld in [artikel 52c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel52c
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 52c
        hoofdstuk: '5'
        paragraaf: 5.3a
  - number: '44'
    text: |-
      1 Een houder van een vergunning heeft de plicht op een betrouwbare wijze en tegen redelijke tarieven en voorwaarden
      zorg te dragen voor de levering van gas aan iedere in [artikel 43, eerste lid][ref1], bedoelde afnemer die daarom
      verzoekt. De voorwaarden zijn in ieder geval niet redelijk als zij niet in overeenstemming zijn met het bepaalde
      bij of krachtens [artikel 52b][ref2]. De [artikelen 236][ref3] en [237 van Boek 6 van het Burgerlijk Wetboek][ref4]
      zijn mede van toepassing op voorwaarden in overeenkomsten met afnemers die rechtspersoon zijn of handelen in de
      uitoefening van een beroep en bedrijf. [Artikel 14, vierde lid][ref5], is van overeenkomstige toepassing.

      2 Een houder van een vergunning verschaft de Autoriteit Consument en Markt ieder jaar en vier weken voor de
      wijziging van de tarieven een opgave van de tarieven die hij berekent en de voorwaarden die hij gebruikt bij de
      levering van gas aan de in [artikel 43, eerste lid][ref6], bedoelde afnemers.

      3 Indien de Autoriteit Consument en Markt van oordeel is dat de tarieven die houders van een vergunning berekenen
      onredelijk zijn, omdat daarin de effecten van een doelmatige bedrijfsvoering, die mede inhoudt de inkoop van gas,
      in onvoldoende mate leiden tot kostenverlaging, kan zij een tarief vaststellen dat leveranciers ten hoogste mogen
      berekenen voor de levering van gas aan afnemers als bedoeld in [artikel 43][ref7].

      4 Na de vaststelling van het maximumtarief, bedoeld in het derde lid, worden de tarieven voor de levering van gas
      aan afnemers als bedoeld in [artikel 43][ref8] die hoger zijn dan dat maximumtarief, van rechtswege gesteld op
      dat maximumtarief.

      5 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de bepaling of de
      tarieven, bedoeld in het tweede lid, onredelijk zijn en tot vaststelling van het maximumtarief, bedoeld in het
      derde lid. De voordracht voor een krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      6 Het tweede tot en met het zesde lid vervallen op een bij koninklijk besluit te bepalen tijdstip. De voordracht
      voor een krachtens dit lid vast te stellen koninklijk besluit wordt niet eerder gedaan dan vier weken nadat het
      ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      7 Een netbeheerder en een vergunninghouder voeren een beleid, gericht op het voorkomen van het afsluiten van een
      afnemer als bedoeld in [artikel 43, eerste lid][ref9], in het bijzonder in de periode van 1 oktober tot 1 april van
      enig jaar.

      8 Bij ministeriële regeling worden regels gesteld over het beëindigen van de levering van gas aan een afnemer als
      bedoeld in [artikel 43, eerste lid][ref10], alsmede over preventieve maatregelen om de afsluiting van dergelijke
      afnemers zoveel mogelijk te voorkomen. Deze regels houden in ieder geval in dat een afnemer niet wordt afgesloten
      in de periode van 1 oktober tot 1 april van enig jaar, behoudens in gevallen die in de regeling zijn aangegeven.

      9 De in het achtste lid bedoelde preventieve maatregelen kunnen tevens inhouden dat in daarbij omschreven gevallen
      met in die regeling aangeduide instanties overleg wordt gepleegd alsmede dat in die gevallen aan de desbetreffende
      instantie in die regeling omschreven gegevens omtrent de afnemer worden verstrekt.

      10 De ministeriële regeling, bedoeld in het achtste lid, wordt niet eerder vastgesteld dan nadat de gezamenlijke
      netbeheerders en de vergunninghouders alsmede de consumentenorganisaties in de gelegenheid zijn gesteld hun
      zienswijze te geven over de inhoud van de regeling.

      11 De Autoriteit Consument en Markt publiceert jaarlijks, op basis van de informatie verkregen op grond van het
      tweede lid, aanbevelingen over de conformiteit van de leveringsprijzen met artikel 3 van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
