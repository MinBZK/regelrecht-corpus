  - number: 54a
    text: |-
      1 De netbeheerder van het landelijk gastransportnet heeft, in het belang van het planmatig beheer van voorkomens
      van gas, ter verzekering op lange termijn van een behoedzaam en rationeel gebruik van deze natuurlijke hulpbron tot
      taak zorg te dragen voor de inname en het transport van gas uit de gasvoorkomens in gebieden binnen Nederland en op
      het continentaal plat.

      2 Indien de netbeheerder van het landelijk gastransportnet ter uitvoering van de in het eerste lid bedoelde
      taak moet investeren in de aanleg of uitbreiding van het net dan meldt hij dit voornemen aan Onze Minister. Bij
      ministeriële regeling kunnen regels worden gesteld omtrent de melding.

      3 Onze Minister besluit binnen 13 weken nadat de melding is gedaan, of een investering als bedoeld in het eerste
      lid, van de netbeheerder van het landelijk gastransportnet noodzakelijk is, gelet op het belang, bedoeld in het
      eerste lid. Indien Onze Minister besluit dat de investering niet noodzakelijk is, wordt de netbeheerder van het
      landelijk gastransportnet geacht te zijn ontheven van de in het eerste lid bedoelde taak voor dat voorkomen.

      4 De Autoriteit Consument en Markt verrekent de kosten van een investering waarvan de noodzaak is vastgesteld op
      grond van het derde lid, in de tarieven.

      5 De netbeheerder van het landelijk gastransportnet overlegt jaarlijks aan Onze Minister een overzicht, waarin ten
      aanzien van de eerstvolgende twintig jaar ramingen zijn opgenomen met betrekking tot de uitoefening van de taak,
      bedoeld in het eerste lid, onder vermelding van daarbij gehanteerde vooronderstellingen en relevante onderscheiden.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel54a
  - number: 54b
    text: |-
      1 De netbeheerder van het landelijk gastransportnet kan, ten einde te waarborgen dat hij de taken, bedoeld in
      artikel 54a, zo doelmatig mogelijk kan uitvoeren, voorwaarden stellen aan de wijze waarop het gas van de houders
      van Nederlandse winningsvergunningen dan wel degene met wie voor het gebruik van die vergunning een overeenkomst is
      gesloten inzake het voor gezamenlijke rekening winnen van gas, wordt ingenomen.

      2 Gasbedrijven, netgebruikers en afnemers verstrekken de netbeheerder van het landelijk gastransportnet desgevraagd
      tijdig voldoende inlichtingen en gegevens om te waarborgen dat hij de taken, bedoeld in het eerste lid kan
      uitvoeren.

      3 Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de in het eerste lid bedoelde voorwaarden
      en de in het tweede lid genoemde gegevens en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel54b
  - number: '56'
    text: |-
      1 De op grond van [artikel 53][ref1] aangewezen rechtspersoon verstrekt Onze Minister alle inlichtingen die
      hij nodig heeft voor de toepassing van [artikel 54, tweede lid][ref2]. Die inlichtingen omvatten in ieder
      geval de voorwaarden en de vergoeding die deze rechtspersoon hanteert voor de afname van gas als bedoeld in
      [artikel 54, eerste lid, onder b][ref3], alsmede wijzigingen daarin.

      2 De netbeheerder van het landelijk gastransportnet verstrekt Onze Minister alle inlichtingen die hij nodig heeft
      voor de toepassing van [artikel 54a, tweede lid][ref4].


