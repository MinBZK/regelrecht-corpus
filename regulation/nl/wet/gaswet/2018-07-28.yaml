  - number: '15'
    text: |-
      1 Onverminderd artikel 16, eerste lid, van verordening 715/2009, kan een netbeheerder, onderscheidenlijk een LNG-
      bedrijf, of in voorkomend geval een verwant bedrijf, weigeren het transport van gas, LNG-activiteiten of dat
      transport of die activiteiten ondersteunende diensten te verrichten indien:

      a. binnen zijn gastransportnet, onderscheidenlijk zijn LNG-installaties onderscheidenlijk de installaties van
      het verwante bedrijf, geen capaciteit beschikbaar is voor het transport van de desbetreffende hoeveelheid gas
      onderscheidenlijk de LNG-activiteiten dan wel in redelijkheid niet kan worden gevergd dat hij alle capaciteit
      beschikbaar stelt;

      b. het verrichten van het beoogde transport onderscheidenlijk van die LNG-activiteiten of van de dat transport
      of die activiteiten ondersteunende diensten hem of de netbeheerder voor wie hij de LNG-activiteiten uitvoert zou
      verhinderen zijn in de [artikelen 10][ref1], [10a][ref2], [42][ref3] en [54a][ref4] en [hoofdstuk 2][ref5] bedoelde
      taken te vervullen of

      c. de netbeheerder beschikt over een daartoe strekkende ontheffing als bedoeld in [artikel 16, eerste lid][ref6],
      of het bedrijf een aanvraag daartoe heeft ingediend en daarop nog niet is beslist.

      2 Een weigering als bedoeld in het eerste lid is met redenen omkleed.


