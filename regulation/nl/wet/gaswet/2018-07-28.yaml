        paragraaf: '5.3'
  - number: 18g
    text: |-
      1 Een gasopslagbedrijf is verplicht met degene die daarom verzoekt te onderhandelen over toegang tot zijn
      gasopslaginstallatie of de door hem aangeboden ondersteunende diensten indien toegang tot deze gasopslaginstallatie
      of tot deze ondersteunende diensten voor degene die daarom verzoekt in technische of economische zin noodzakelijk
      is voor een efficiënte toegang tot het systeem voor de levering aan netgebruikers.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de technische of economische noodzakelijkheid voor
      een efficiënte toegang tot het systeem voor de levering aan netgebruikers.

      3 Voor een gasopslagbedrijf waarop de verplichting, bedoeld in het eerste lid, van toepassing is, gelden het vierde
      tot en met het zesde lid.

      4 De tarieven en de voorwaarden die het gasopslagbedrijf hanteert voor gasopslag en ondersteunende diensten zijn
      objectief, transparant en niet discriminatoir.

      5 Het gasopslagbedrijf publiceert jaarlijks voor 1 oktober op een geschikte wijze een indicatie van de tarieven
      en voorwaarden die het bedrijf voornemens is in het volgende kalenderjaar te hanteren voor het verrichten van
      gasopslag en ondersteunende diensten.

      6 Een gasopslagbedrijf voert voorafgaand aan de bekendmaking, bedoeld in het vijfde lid, overleg met
      representatieve organisaties van netgebruikers over de tarieven en voorwaarden, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel18g
  - number: 18ga
    text: |-
      1 Onverminderd artikel 17, eerste lid, van verordening 715/2009 kan een gasopslagbedrijf waarop de verplichting,
      bedoeld in [artikel 18g, eerste lid][ref1], van toepassing is, weigeren gasopslag en ondersteunende diensten
      te verrichten indien binnen zijn gasopslaginstallatie geen capaciteit beschikbaar is voor de opslag van de
      desbetreffende hoeveelheid gas dan wel in redelijkheid niet van het gasopslagbedrijf kan worden gevergd dat het de
      gevraagde capaciteit beschikbaar stelt.

      2 Een weigering als bedoeld in het eerste lid is met redenen omkleed.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel18g
