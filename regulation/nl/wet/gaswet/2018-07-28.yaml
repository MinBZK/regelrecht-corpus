  - number: 1c
    text: |-
      1 Onze Minister is belast met het toezicht op de naleving van het bepaalde bij of krachtens [artikel 8][ref1],
      met uitzondering van het tweede lid, onderdeel f tot en met i, en de [artikelen 8a][ref2], [35a][ref3] en
      [54 tot en met 57][ref4].

      2 Met het toezicht op de naleving van [artikel 8][ref5], met uitzondering van het tweede lid, onderdeel f tot en
      met i, en de [artikelen 8a][ref6], [35a][ref7] en [54 tot en met 57][ref8] zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.

      3 Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      4 Onze Minister kan bindende aanwijzingen geven in verband met de naleving van het bepaalde bij of krachtens
      [artikel 8][ref9], met uitzondering van het tweede lid, onderdeel f tot en met i, en de [artikelen 35a][ref10]
      en [54 tot en met 57][ref11].


