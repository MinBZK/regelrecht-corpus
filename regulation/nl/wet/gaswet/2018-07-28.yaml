      1 Iedere wijziging met betrekking tot zeggenschap als bedoeld in [artikel 26 van de Mededingingswet][ref1] in
      een LNG-installatie of een LNG-bedrijf wordt door één van de bij de wijziging betrokken partijen gemeld aan Onze
      Minister.

      2 Onze Minister kan op grond van overwegingen van openbare veiligheid, voorzieningszekerheid of leveringszekerheid
      de wijziging, bedoeld in het eerste lid, verbieden of voorschriften hieraan verbinden.

      3 Rechtshandelingen verricht in strijd met het eerste lid zijn door een rechtelijke uitspraak vernietigbaar.

      4 Bij ministeriële regeling worden regels gesteld met betrekking tot de melding, bedoeld in het eerste lid.


