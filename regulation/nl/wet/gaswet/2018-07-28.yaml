        artikel: '2.3'
  - number: 39g
    text: |-
      De raad van bestuur van de mededingingsautoriteit stelt een beleidsregel vast betreffende de beoordeling van
      doelmatigheid, bedoeld in de [artikelen 39e][ref1] en [39f, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel39e
