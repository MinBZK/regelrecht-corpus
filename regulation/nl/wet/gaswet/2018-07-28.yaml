    text: |-
      1 Na ontvangst van een voorstel als bedoeld in [artikel 22, eerste lid][ref1], kan de Autoriteit Consument en
      Markt de in artikel 22, eerste lid, bedoelde ondernemingen die het voorstel hebben ingediend, opdragen binnen
      vier weken en met inachtneming van haar bevindingen, waaronder haar bevindingen omtrent de belangen, bedoeld
      in [artikel 12f, eerste lid, onderdelen b tot en met f][ref2], de regels, bedoeld in [artikel 21][ref3], of het
      bepaalde, bedoeld in artikel 12f, tweede lid, het voorstel te wijzigen. Indien de Autoriteit Consument en Markt
      van deze bevoegdheid gebruik maakt is [artikel 4:15 van de Algemene wet bestuursrecht][ref4] van overeenkomstige
      toepassing.

      2 Indien de ondernemingen, bedoeld in het eerste lid, niet binnen vier weken het voorstel wijzigen overeenkomstig
      de opdracht van de Autoriteit Consument en Markt, stelt de Autoriteit Consument en Markt de voorwaarden vast
      onder het aanbrengen van zodanige wijzigingen dat deze in overeenstemming zijn met de belangen, bedoeld in
      [artikel 12f, eerste lid, onderdelen b tot en met f][ref5], met artikel 12f, tweede lid, of met de regels, bedoeld
      in [artikel 21][ref6].


