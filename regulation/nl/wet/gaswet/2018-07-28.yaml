  - number: 39h
    text: |-
      1

      Een producent die gas levert met een directe lijn meldt zo spoedig mogelijk na ingebruikname van een directe lijn
      aan de Autoriteit Consument en Markt:

      a. zijn naam en adres;

      b. een globale beschrijving van de directe lijn;

      c. een aanduiding van de locatie waar de directe lijn zich bevindt.

      2 De producent meldt een significante wijziging ten opzichte van een eerdere melding zo spoedig mogelijk na
      doorvoering van de betreffende wijziging aan de Autoriteit Consument en Markt. Onder een significante wijziging
      wordt in ieder geval verstaan een wijziging van het aantal aangeslotenen op de directe lijn, een wijziging van de
      eigenaar van de directe lijn of een wijziging in de eventuele verbinding met een gastransportnet.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel39h
  - number: '40'
    text: |-
      1 Een gasbedrijf dat gas levert aan eindafnemers heeft tot taak, mede gelet op het belang van bescherming van het
      milieu, bedoeld in artikel 3, tweede lid, van de richtlijn, te bevorderen dat gas door hemzelf en door afnemers op
      een doelmatige en milieuhygiënisch verantwoorde wijze wordt gebruikt.

      2 Ieder gasbedrijf dat per jaar meer dan 10 000 000 m3 gas aan eindafnemers levert, meldt eenmaal in elke twee
      jaar vóór 1 maart aan Onze Minister op welke wijze hij in de twee jaar voorafgaande aan het jaar, waarin de melding
      wordt verricht, uitvoering heeft gegeven aan zijn taak, bedoeld in het eerste lid.

      3 Bij het opstellen van de tariefstructuren en de voorwaarden, bedoeld in [artikel 12a][ref1] of [12b][ref2] en bij
      het sluiten van overeenkomsten voor het verrichten van transport van gas en dat transport ondersteunende diensten
      neemt de netbeheerder het belang van een duurzame, doelmatige en milieuhygiënische energievoorziening in acht.

      4 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de invulling van de taak, bedoeld
      in het eerste lid, en worden criteria gegeven waaraan de uitvoering van die taak door het gasbedrijf zal worden
      getoetst.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel40
