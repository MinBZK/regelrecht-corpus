  - number: 13b
    text: |-
      1 Een netbeheerder verzamelt uitsluitend meetgegevens betreffende afnemers als bedoeld in
      [artikel 43, eerste lid][ref1], indien:

      a. dit noodzakelijk is voor de taken van de leverancier met betrekking tot:

      1°. het verstrekken van informatie inzake het verbruik van gas op grond van [artikel 42b][ref2],

      2°. facturering,

      3°. verhuizingen,

      4°. wisselingen van leverancier,

      b. dit noodzakelijk is voor de taken van de netbeheerder, genoemd in
      [artikel 10, eerste tot en met derde en vijfde lid][ref3] of

      c. deze gegevens op basis van het tweede tot en met vijfde lid verstrekt worden.

      2 Een netbeheerder verleent een leverancier toegang tot meetgegevens betreffende afnemers als bedoeld in
      [artikel 43, eerste lid][ref4], voorzover het gaat om meetgegevens betreffende afnemers van die leverancier.

      3 In afwijking van het tweede lid verleent een netbeheerder een leverancier uitsluitend toegang tot meetgegevens
      die betrekking hebben op een kleiner tijdsbestek dan een dag, voor zover die leverancier de desbetreffende
      meetgegevens op basis van artikel 6, eerste lid, onderdeel a, van de Algemene verordening gegevensbescherming mag
      verwerken.

      4 Een netbeheerder verleent een derde uitsluitend toegang tot meetgegevens betreffende afnemers als bedoeld in
      [artikel 43, eerste lid][ref5], voorzover deze derde de desbetreffende meetgegevens op basis van artikel 6, eerste
      lid, onderdeel a, van de Algemene verordening gegevensbescherming mag verwerken.

      5 Meetgegevens per uur en per dag worden dagelijks door de netbeheerder om niet beschikbaar gesteld. Overige
      meetgegevens worden door de netbeheerder tegen een vergoeding van de daaraan verbonden kosten beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel42b
