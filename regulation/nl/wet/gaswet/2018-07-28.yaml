        paragraaf: '5.3'
  - number: 35e
    text: |-
      1 Een netbeheerder draagt er, al dan niet samen met een of meer andere netbeheerders, zorg voor dat onderbrekingen
      in het transport van gas en waarnemingen van gaslucht door afnemers op een eenvoudige wijze gemeld kunnen worden en
      maakt aan afnemers bekend op welke wijze deze meldingen kunnen geschieden.

      2 Een netbeheerder registreert, al dan niet samen met andere netbeheerders, van de gemelde onderbrekingen en
      waarnemingen, de datum en het tijdstip en, met betrekking tot onderbrekingen, het begin van de onderbrekingen,
      de duur van de onderbrekingen, de locatie, aard en oorzaak van de onderbrekingen alsmede het aantal getroffen
      afnemers.

      3 Een netbeheerder maakt de actuele stand van zaken betreffende de geregistreerde onderbrekingen en waarnemingen
      in zijn net op geschikte wijze openbaar en vermeldt daarbij de datum en het tijdstip en, met betrekking tot
      onderbrekingen, het begin van de onderbrekingen, de duur van de onderbrekingen, de locatie, aard en oorzaak van de
      onderbrekingen alsmede het aantal getroffen afnemers.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel35e
  - number: '37'
    text: |-
      1 Een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf dat bij de uitvoering van zijn taak de beschikking
      krijgt over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, draagt er zorg
      voor dat die gegevens niet ter beschikking komen of kunnen komen van derden, tenzij enig wettelijk voorschrift
      anders bepaalt.

      2 Indien een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf gegevens over zijn bedrijfsvoering die
      commercieel voordeel kunnen opleveren ter beschikking stelt aan anderen, doet hij dit op niet-discriminatoire
      wijze.

      3 Een netbeheerder maakt bij de aankoop of de verkoop van gas door een verwant bedrijf geen misbruik van
      commercieel gevoelige gegevens van anderen die hij heeft verkregen bij onderhandelingen over transport of bij het
      verrichten van transport.

      4 Een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf maakt alle informatie openbaar die bijdraagt aan een
      doeltreffende mededinging en een efficiënte werking van de markt, voor zover deze redelijkerwijs te genereren is
      uit de informatie waarover hij beschikt op basis van de uitvoering van de op grond van deze wet aan hem toegekende
      taken.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel37
  - number: '38'
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet niet in staat is de informatie te publiceren in
      overeenstemming met verordening 715/2009 stelt hij na overleg met de Autoriteit Consument en Markt een actieplan
      vast voor de uitvoering.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel38
  - number: 38b
    text: |-
      Onze Minister en de Autoriteit Consument en Markt verstrekken de Europese Commissie desgevraagd overeenkomstig
      artikel 25 van verordening 715/2009 alle voor de toepassing van artikel 23 van verordening 715/2009 noodzakelijke
      informatie.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel38b
  - number: '39'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen met betrekking tot daarbij aan te wijzen gebieden regels worden
      gesteld over de wijze waarop, gelet op het belang van een betrouwbaar, duurzaam en doelmatig functionerende
      energiehuishouding, een afweging wordt gemaakt met betrekking tot de aanleg van een gastransportnet, een warmtenet
      en de aanleg van leidingen en hulpmiddelen voor het transport van elektriciteit.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat een gastransportnet slechts wordt aangelegd als
      resultaat van een openbare procedure waarin gegadigden op een te plaatsen opdracht kunnen inschrijven met een
      aanbieding voor de aanleg van een een gastransportnet, een warmtenet of van leidingen en hulpmiddelen voor het
      transport van elektriciteit.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel39
  - number: 39a
    text: |-
      Een gastransportnet dat door een netbeheerder in het kader van de uitoefening van zijn taak, bedoeld in artikel
      10, in werking wordt gehouden, onderhouden of ontwikkeld, wordt voor de toepassing van de [Belemmeringenwet
      Verordeningen](onbekend) en de [Belemmeringenwet Privaatrecht](onbekend) aangemerkt als openbaar werk van algemeen
      nut.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel39a
  - number: 39b
    text: |-
      1 De procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel c, van de Wet ruimtelijke ordening][ref1],
      is van toepassing op:

      a. een uitbreiding van het landelijk gastransportnet, voor zover het betreft de van dat net deel uitmakende
      leidingen met een druk van ten minste 40 bar en een diameter van ten minste 45,7 centimeter, met inbegrip van de
      aansluitingen op die leidingen;

      b. de aanleg of uitbreiding van een landsgrensoverschrijdend gastransportnet als bedoeld in [artikel 18h][ref2],
      met inbegrip van de aansluitingen op zo’n net;

      c. een uitbreiding van het landelijk gastransportnet of de aanleg of uitbreiding van een landsgrensoverschrijdend
      gastransportnet met inbegrip van de aansluitingen op zo’n net, voor zover het een project betreft voor gas dat is
      opgenomen op de Unielijst van projecten van gemeenschappelijk belang, bedoeld in artikel 3, vierde lid, Verordening
      (EU) nr. 347/2013 van het Europees Parlement en de Raad van 17 april 2013 betreffende richtsnoeren voor de trans-
      Europese energie-infrastructuur en tot intrekking van Beschikking nr. 1364/2006/EG en tot wijziging van de
      Verordeningen (EG) nr. 713/2009, (EG) nr. 714/2009 en (EG) nr. 715/2009 (PbEU 2013, L 115);

      d. de aanleg of uitbreiding van een LNG-installatie met een capaciteit van ten minste 4 miljard m3, met inbegrip
      van de aansluiting van de installatie op een net.

      2 Een gasbedrijf meldt een voornemen tot aanleg of uitbreiding van een net of installatie als bedoeld in het eerste
      lid, zo spoedig mogelijk schriftelijk aan Onze Minister. Bij ministeriële regeling kan voor het doen van de melding
      en de daarbij te verstrekken gegevens een formulier worden vastgesteld.

      3 Indien, in aanmerking genomen de omvang, aard en ligging van een net of een deel daarvan of een installatie
      als bedoeld in het eerste lid, alsmede het aantal voor de aanleg of uitbreiding van dat net of die installatie
      benodigde besluiten, redelijkerwijze niet valt te verwachten dat toepassing van de procedure, bedoeld in het
      eerste lid, de besluitvorming in betekenende mate zal versnellen of daaraan anderszins aanmerkelijke voordelen zijn
      verbonden, kan Onze Minister bepalen dat:

      a. geen van de procedures, bedoeld in [artikel 3.35, eerste lid][ref3],

      b. uitsluitend de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel a][ref4],

      c. uitsluitend de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel b][ref5], of

      d. de procedure, bedoeld in [artikel 3.35, eerste lid, aanhef en onderdeel a][ref6], gevolgd door de procedure,
      bedoeld in artikel 3.35, eerste lid, aanhef en onderdeel b, van de Wet ruimtelijke ordening, van toepassing zijn of
      is op de aanleg of uitbreiding van dat net of die installatie. Onze Minister hoort de beheerder van het net en de
      betrokken bestuursorganen over een voornemen toepassing te geven aan de bevoegdheid, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel18h
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3.35
