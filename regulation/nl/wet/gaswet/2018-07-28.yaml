      op een klacht als bedoeld in [artikel 19][ref1], als de netbeheerder, het gasopslagbedrijf of het LNG-bedrijf
      waartegen de klacht is gericht onder de rechtsmacht van een andere lidstaat van de Europese Unie valt.


