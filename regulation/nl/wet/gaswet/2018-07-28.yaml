  - number: 10c
    text: |-
      1 Het is de netbeheerder van het landelijk gastransportnet, of een rechtspersoon waarin de netbeheerder een
      deelneming heeft als bedoeld in [artikel 24c, van Boek 2 van het Burgerlijk Wetboek][ref1], niet toegestaan
      goederen of diensten waarmee zij in concurrentie treedt te leveren, tenzij het betreft het verrichten van
      werkzaamheden ten behoeve van:

      a. de uitvoering van de taken, bedoeld in de [artikelen 10][ref2], [10a][ref3], [42][ref4] en [54a][ref5] en
      [hoofdstuk 2][ref6] voor zichzelf, voor andere netbeheerders of voor anderen die een recht van gebruik op een
      gastransportnet hebben,

      b. de aanleg, het beheer of het onderhoud van leidingen buiten gebouwen voor het transport van elektriciteit,

      c. het ter beschikking stellen en houden van netten ten behoeve van het gebruik van daarmee verbonden zaken door
      derden of

      d. de aanleg, het beheer of het onderhoud van aansluitingen met een doorlaatwaarde groter dan 40 m3(n) per uur.

      2 Indien de netbeheerder van het landelijk gastransportnet onderdeel uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref7], is het deze groep niet toegestaan om handelingen
      of activiteiten te verrichten die strijdig kunnen zijn met het belang van het beheer van het landelijk
      gastransportnet.

      3 De statuten van de rechtspersonen die met de netbeheerder van het landelijk gastransportnet in een groep zijn
      verbonden, behoeven de goedkeuring van Onze Minister, voor zover het betreft de daarin opgenomen doelstelling van
      die rechtspersonen.

      4 De netbeheerder van het landelijk gastransportnet verstrekt binnen zes maanden na afloop van ieder kalenderjaar
      aan de Autoriteit Consument en Markt een overzicht van de financiële middelen waarover hij beschikt ten behoeve
      van de uitvoering van zijn wettelijke taken, waaruit blijkt welke financiële middelen voor de afzonderlijke taken
      beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
