  - number: 1a
    text: |-
      1 De Autoriteit Consument en Markt is belast met de aan haar opgedragen taken ter uitvoering van het bepaalde
      bij of krachtens deze wet, verordening 713/2009, verordening 715/2009, verordening 1227/2011 en verordening
      994/2010. Ook is de Autoriteit Consument en Markt belast met het toezicht op de naleving van het bepaalde bij of
      krachtens deze wet, verordening 713/2009, verordening 715/2009, verordening 1227/2011 en verordening 994/2010, met
      uitzondering van [artikel 8][ref1], tenzij het gaat om investeringen, genoemd in artikel 8, tweede lid, onderdeel f
      tot en met i, en met uitzondering van de [artikelen 8a][ref2], [35a][ref3] en [54 tot en met 57][ref4].

      2 De Autoriteit Consument en Markt is de regulerende instantie, bedoeld in artikel 39, eerste lid, van de richtlijn
      en in verordening 715/2009 en is de bevoegde instantie als bedoeld in verordening 715/2009.

      3 De Autoriteit Consument en Markt houdt bij de uitoefening van de haar op grond van deze wet toegekende taken en
      bevoegdheden rekening met artikel 40 van de richtlijn.

      4 De Autoriteit Consument en Markt werkt, onder meer teneinde de nationale markten op één of meer geografische
      gebieden als bedoeld in artikel 12, derde lid, van verordening 715/2009 te integreren en samenwerking tussen de
      netbeheerder van het landelijk gastransportnet en buitenlandse instelling die op grond van nationale wettelijke
      regels belast zijn met het beheer van een transmissiesysteem als bedoeld in artikel 2, onderdeel 4, van de
      richtlijn in deze gebieden aan te moedigen, samen met:

      a. instellingen in andere lidstaten van de Europese Unie die op grond van nationale wettelijke regels zijn belast
      met de toepassing van de regels op het gebied van gas;

      b. het Agentschap.

      5 De Autoriteit Consument en Markt draagt bij aan de compatibiliteit van gegevensuitwisselingsprocessen voor
      de belangrijkste marktprocessen in één of meer geografische gebieden als bedoeld in artikel 12, derde lid, van
      verordening 715/2009.

      6 De Autoriteit Consument en Markt beslist over de goedkeuring van de door de netbeheerder van het landelijk
      gastransportnet gehanteerde congestiebeheersprocedures voor landsgrensoverschrijdende netten.


