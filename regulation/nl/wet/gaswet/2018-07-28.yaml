  - number: 18i
    text: |-
      Indien ingevolge artikel 8, eerste lid, van de verordening 713/2009 het Agentschap bevoegd is een besluit te nemen
      over grensoverschrijdende infrastructuur, is de Autoriteit Consument en Markt hiertoe niet bevoegd.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel18i
  - number: '19'
    text: |-
      1 Een partij die een geschil heeft met een netbeheerder, een gasopslagbedrijf of een LNG-bedrijf over de wijze
      waarop deze zijn taken en bevoegdheden op grond van deze wet uitoefent, dan wel aan zijn verplichtingen op grond
      van deze wet voldoet, kan een klacht bij de Autoriteit Consument en Markt indienen.

      2 De Autoriteit Consument en Markt beslist op een klacht binnen twee maanden na ontvangst ervan. Deze termijn
      kan met twee maanden worden verlengd als de Autoriteit Consument en Markt om aanvullende gegevens verzoekt. Met
      instemming van de klager is verdere verlenging mogelijk.

      3 De geschilbeslechtingswerkzaamheden worden niet verricht door personen die betrokken zijn bij werkzaamheden op
      grond van [hoofdstuk 2, paragrafen 2.2][ref1] en [2.3][ref2].

      4 De beslissing van de Autoriteit Consument en Markt is bindend.

      5 Het indienen van een klacht als bedoeld in het eerste lid laat onverlet elke mogelijkheid voor de desbetreffende
      partij een hem ter beschikking staand rechtsmiddel aan te wenden.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
