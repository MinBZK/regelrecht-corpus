  - number: 1i
    text: |-
      1 Bij algemene maatregel van bestuur kan, met inachtneming van bindende besluiten van de Raad van de Europese Unie,
      van het Europees Parlement en de Raad gezamenlijk of van de Europese Commissie, bij wege van experiment worden
      afgeweken van het bepaalde bij of krachtens deze wet.

      2 Er kan uitsluitend toepassing worden gegeven aan het eerste lid indien het experiment bijdraagt aan
      ontwikkelingen op het gebied van de decentrale productie, het transport en de levering van gas dat decentraal
      is opgewekt in een installatie die uitsluitend gebruik maakt van hernieuwbare energiebronnen en past binnen
      verantwoorde financiële kaders van het Rijk.

      3 Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, worden regels gesteld over experimenten, als
      bedoeld in het eerste lid, waarbij in elk geval wordt bepaald:

      a. welke afwijking of afwijkingen van deze wet zijn toegestaan,

      b. voor welke categorieën afnemers de afwijkingen gelden en de omvang van de groep afnemers waarvoor een afwijking
      geldt,

      c. de ten hoogste toegestane tijdsduur van die afwijking of afwijkingen,

      d. het aantal situaties waarin een afwijking is toegestaan en

      e. de wijze waarop wordt vastgesteld of een afwijking aan haar doel beantwoordt, en of de tijdsduur daarvan
      aanpassing behoeft.

      4 Onze Minister zendt uiterlijk drie maanden na de beëindiging van een experiment een verslag over de
      doeltreffendheid en de effecten ervan, alsmede een standpunt inzake de voortzetting ervan anders dan als
      experiment, aan de Tweede Kamer der Staten-Generaal.

      5 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel1i
  - number: '2'
    text: |-
      1 Onze Minister wijst op verzoek een naamloze of een besloten vennootschap voor tien jaar als netbeheerder van het
      landelijk gastransportnet aan. Bij het verzoek wordt een besluit van de Autoriteit Consument en Markt overgelegd
      waaruit blijkt dat is voldaan aan het bepaalde bij of krachtens [artikel 2c][ref1] en [3b, vierde lid][ref2].

      2 De Autoriteit Consument en Markt besluit op verzoek van degene die wenst te worden aangewezen als netbeheerder
      van het landelijk gastransportnet of naar aanleiding van een situatie, bedoeld in het zevende lid, of is voldaan
      aan het bepaalde bij of krachtens [artikel 2c][ref3] en [3b, vierde lid][ref4].

      3 De Autoriteit Consument en Markt neemt de beschikking, bedoeld in het tweede lid, overeenkomstig de procedure van
      artikel 10, vijfde en zesde lid, van de richtlijn en artikel 3 van verordening 715/2009 .

      4 De Europese Commissie kan van een producent, een leverancier of de netbeheerder van het landelijk gastransportnet
      de gegevens en inlichtingen verlangen die zij nodig heeft voor de uitvoering van artikel 10 van de richtlijn.

      5 Degene aan wie een verzoek is gedaan om gegevens en inlichtingen te verstrekken als bedoeld in het vierde lid,
      is verplicht binnen de door de Europese Commissie gestelde redelijke termijn alle medewerking te verlenen die deze
      redelijkerwijs kan vorderen bij de uitoefening van haar bevoegdheden.

      6 De netbeheerder van het landelijk gastransportnet meldt de Autoriteit Consument en Markt omstandigheden die
      aanleiding kunnen geven tot herziening van de beschikking, bedoeld in het tweede lid.

      7 De Autoriteit Consument en Markt kan de beschikking, bedoeld in het tweede lid, wijzigen of intrekken:

      a. naar aanleiding van een melding als bedoeld in het zesde lid;

      b. naar aanleiding van gewijzigde omstandigheden;

      c. op verzoek van de Europese Commissie.

      8 Degene aan wie een ander net toebehoort dan het landelijk gastransportnet, wijst voor het beheer van dat net een
      of meer naamloze of besloten vennootschappen als netbeheerder aan.

      9 Een aanwijzing als bedoeld in het achtste lid geldt voor een periode van tien jaar, te rekenen vanaf de dag
      waarop Onze Minister heeft ingestemd met de aanwijzing op grond van [artikel 4, tweede lid][ref5].

      10 Degene aan wie een gastransportnet toebehoort handelt als beheerder van dat net, indien daarvoor geen beheerder
      is aangewezen krachtens deze wet. De bij of krachtens deze wet aan een netbeheerder opgelegde verplichtingen zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel3b
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel2c
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel3b
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel4
