  - number: '9'
    text: |-
      1 Indien naar het oordeel van de Autoriteit Consument en Markt uit het document, bedoeld in [artikel 8][ref1], of
      uit de overzichten, bedoeld in [artikel 35b][ref2], of anderszins, blijkt dat een netbeheerder in onvoldoende mate
      of op een ondoelmatige wijze kan of zal kunnen voorzien in het door hem te bereiken niveau van de kwaliteit van
      zijn transportdienst of in de totale behoefte aan capaciteit voor het transport van gas over de door hem beheerde
      netten, meldt zij zulks na overleg met de netbeheerder van het landelijk gastransportnet en de netbeheerder van het
      desbetreffende net aan Onze Minister.

      2 Nadat hij een melding heeft ontvangen, kan Onze Minister aan de desbetreffende netbeheerder opdragen
      voorzieningen te treffen teneinde zeker te stellen dat het transport van gas in voldoende mate of op een doelmatige
      wijze plaatsvindt.

      3 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de opdracht, bedoeld
      in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel35b
