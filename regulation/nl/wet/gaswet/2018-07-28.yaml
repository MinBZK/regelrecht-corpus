  - number: 60ad
    text: |-
      1 De Autoriteit Consument en Markt kan in geval van overtreding van het bepaalde bij of krachtens:

      a. de [artikelen 1h][ref1], [2, vijfde en zesde lid][ref2], [2a, achtste lid][ref3], [3c, derde lid][ref4],
      [4, eerste en tweede lid][ref5], [7a, derde en vierde lid][ref6], [10, tweede lid en derde lid, onderdeel b][ref7],
      [10b, vierde lid][ref8], [10c, derde en vierde lid][ref9], [10d, derde lid][ref10], [12i, derde lid][ref11],
      [13d, elfde lid][ref12], [13e, twaalfde en veertiende lid][ref13],[17a][ref14], [18g, vijfde lid][ref15],
      [35b][ref16], [35c][ref17], [35d][ref18], [35e][ref19], [39h, eerste lid][ref20], [40, tweede lid][ref21],
      [42][ref22], [44, tweede en achtste lid][ref23], [52a, derde lid][ref24], [52d][ref25], [56][ref26],
      [artikel 66d, eerste en derde lid][ref27], [82, eerste en derde lid][ref28], en [83][ref29], en de artikelen 8, 9
      en 15 van verordening 1227/2011, de overtreder per overtreding een bestuurlijke boete opleggen van ten hoogste €
      900.000 of, indien dat meer is, 1% van de omzet van de overtreder, en

      b. de [artikelen, 2c, tweede en derde lid][ref30], [3, eerste lid][ref31], [3b, eerste en tweede lid][ref32],
      [3c, eerste en tweede lid][ref33], [7][ref34], [7a, eerste en tweede lid][ref35], [8][ref36],
      [9a][ref37][9b][ref38], [10, eerste lid, derde lid, onderdeel a, en vierde tot en met zesde lid][ref39],
      [10a, eerste, tweede en derde lid][ref40], [10b, eerste en tweede lid][ref41], [10c, eerste en tweede lid][ref42],
      [10d, eerste lid][ref43], [10e][ref44], [12a][ref45], [12b][ref46], [12e, eerste lid][ref47],
      [12f][ref48], [12g][ref49], [13b][ref50], [13c][ref51], [13d, eerste tot en met vierde lid][ref52],
      [13e, eerste tot en met vierde lid, zesde, zevende en negende lid][ref53], 12f, [18g, eerste en derde lid][ref54],
      [23][ref55], [24, tweede lid][ref56], [25, derde en vierde lid][ref57],[32][ref58],
      [35a][ref59], [37, eerste tot en met derde lid][ref60], [39, tweede lid][ref61],
      [40, eerste, derde en vierde lid][ref62], [43, eerste lid][ref63], [44, eerste en vijfde lid][ref64],
      [44a][ref65], [44b eerste, tweede, vijfde en zesde lid][ref66], [47, tweede lid][ref67], [51][ref68],
      [52b][ref69], [60, tweede lid][ref70], [63][ref71], [66a][ref72], [66b][ref73], [66c][ref74], [72][ref75],
      [73, vierde lid][ref76] en [85b][ref77] de artikelen 3, 4 en 5 van [verordening 1277/2011](32011R1277) en besluiten
      die het Agentschap op grond van de artikelen 7, eerste lid, 8, eerste lid, en 9, eerste lid, van [verordening
      713/2009](32009R0713) heeft genomen, de overtreder per overtreding een bestuurlijke boete opleggen van ten hoogste
      € 900.000 of, indien dat meer is, 10% van de omzet van de overtreder.

      2 De bestuurlijke boete die ingevolge het eerste lid, onderdelen a en b, ten hoogste kan worden opgelegd
      wordt verhoogd met 100%, indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de
      overtreding opgemaakte rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref78],
      een aan die overtreder voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift
      opgelegde bestuurlijke boete onherroepelijk is geworden.


