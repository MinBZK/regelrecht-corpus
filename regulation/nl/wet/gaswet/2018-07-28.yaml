  - number: 18h
    text: |-
      1 Onze Minister kan voor grote, nieuwe landsgrensoverschrijdende gastransportnetten, LNG-installaties
      en opslaginstallaties op verzoek voor een in de ontheffing bepaalde periode ontheffing verlenen van de
      [artikelen 2c][ref1], [3b, vierde lid][ref2], de [paragrafen 2.2][ref3], [2.3][ref4], [2.4][ref5] en [2.5][ref6] en
      de [artikelen 80 tot en met 82][ref7], indien wordt voldaan aan de volgende voorwaarden:

      a. de aanleg van het net of de installatie versterkt de mededinging bij de levering van gas en de
      leveringszekerheid,

      b. het risico van de investering nodig voor de aanleg van het net of de installatie is zo groot dat de aanleg niet
      zal plaatsvinden als geen ontheffing wordt verleend,

      c. de eigendom van het net of de installatie berust bij een ander dan de beheerder van het net of de installatie
      waarop het nieuwe net of de nieuwe installatie zal worden aangesloten,

      d. de gebruikers van het net of de installatie wordt een tarief in rekening gebracht, en

      e. de ontheffing belemmert niet de mededinging op of de doelmatige werking van de interne gasmarkt of de doelmatige
      werking van het net of de installatie waarop het nieuwe net of de nieuwe installatie wordt aangesloten.

      2 Het eerste lid is van overeenkomstige toepassing op aanmerkelijke uitbreidingen van de capaciteit van bestaande
      netten of installaties en op wijzigingen van de bestaande netten of installaties die de ontwikkeling van nieuwe
      bronnen van gasvoorziening bevorderen.

      3 De ontheffing kan betrekking hebben op het gehele nieuwe net of de gehele nieuwe installatie onderscheidenlijk
      de aanmerkelijke uitbreiding of wijziging van een bestaand net of een bestaande installatie dan wel op gedeelten
      daarvan.

      4

      5 Alvorens Onze Minister beslist op een verzoek om een ontheffing brengt de Autoriteit Consument en Markt of,
      indien dit voortvloeit uit artikel 36, vierde en zevende lid, van de richtlijn, het Agentschap advies uit. Van het
      advies wordt uiterlijk tegelijk met de bekendmaking van het besluit op de aanvraag kennis gegeven.

      6 Indien sprake is van de aanleg van een landsgrensoverschrijdend gastransportnet, overlegt Onze Minister met de
      bevoegde instantie in de andere lidstaat of lidstaten van de Europese Unie.

      7 Onze Minister verbindt voorschriften aan de ontheffing met betrekking tot de niet-discriminerende toegang
      tot de infrastructuur, onder andere over de mechanismen voor het beheer of de toewijzing van capaciteit. Deze
      voorschriften bevatten in elk geval:

      a. het voorschrift dat alle potentiële gebruikers van infrastructuur hun belangstelling aangeven alvorens de
      toewijzing van capaciteit in nieuwe infrastructuur, inclusief eigen gebruik, plaatsvindt;

      b. de bepaling dat ongebruikte capaciteit op de markt moet worden aangeboden en dat gebruikers van de
      infrastructuur het recht krijgen door hen ingekochte capaciteit te verhandelen op de secundaire markt.

      8 Onze Minister kan voorschriften aan de ontheffing verbinden die betrekking hebben op het beheer en de toedeling
      van capaciteit, met dien verstande dat deze voorschriften de uitvoering van overeenkomsten voor een lange termijn
      niet mogen belemmeren.

      9 Onze Minister beslist zo spoedig mogelijk op een aanvraag om een ontheffing als bedoeld in het eerste lid, doch
      uiterlijk binnen zes maanden na ontvangst van de aanvraag. Indien de aanvraag voor een ontheffing betrekking heeft
      op een landsgrensoverschrijdend net, wordt de termijn voor het nemen van een besluit gerekend vanaf de datum waarop
      de laatste van de uit de lidstaten betrokken regulerende instantie een verzoek om ontheffing heeft ontvangen.

      10 Indien Onze Minister een ontheffing als bedoeld in het eerste lid heeft verleend, stelt hij daarvan onverwijld
      de Europese Commissie in kennis, onder overlegging van alle van belang zijnde gegevens. Deze gegevens omvatten in
      ieder geval de gegevens, bedoeld in artikel 36, achtste lid, van de richtlijn.

      11 Indien de termijn waarbinnen de Europese Commissie kan reageren, bedoeld in artikel 36, negende lid, van de
      richtlijn is verstreken zonder een besluit van de Europese Commissie, treedt een besluit als bedoeld in het eerste
      lid in werking op de dag na het verstrijken van deze termijn.

      12 Indien de Europese Commissie binnen de termijn waarbinnen de Europese Commissie kan reageren, bedoeld in artikel
      36, negende lid, van de richtlijn een besluit neemt, treedt het besluit na aanpassing aan dit besluit in werking.
      Onze Minister past een besluit als bedoeld in het eerste lid aan binnen een maand na het besluit.

      13 Een besluit als bedoeld in het eerste lid wordt bekendgemaakt in de Staatscourant. Van een beslissing bedoeld in
      het twaalfde lid wordt mededeling gedaan in de Staatscourant.

      14 In afwijking van [artikel 6:8, eerste lid, van de Algemene wet bestuursrecht][ref8] vangt de termijn voor het
      indienen van een bezwaarschrift aan op de dag van inwerkingtreding van een besluit als bedoeld in het eerste lid.

      15 Indien twee jaar na inwerkingtreding van het besluit, bedoeld in het eerste lid, de bouw van de infrastructuur
      nog niet van start is gegaan of wanneer vijf jaar na inwerkingtreding van het besluit, bedoeld in het eerste lid,
      de infrastructuur nog niet operationeel is geworden, vervalt de ontheffing.

      16 Het eerste lid is niet van toepassing indien Onze Minister op verzoek van de houder van de ontheffing vaststelt
      dat vertraging het gevolg is van grote hindernissen die buiten de macht liggen van de persoon aan wie ontheffing is
      verleend. Onze Minister raadpleegt over dit besluit de Europese Commissie.

      17 Onze Minister kan het nemen van een besluit op een aanvraag als bedoeld in het negende lid, laatste volzin, ten
      hoogste eenmaal met een periode van drie maanden verlengen indien het Agentschap met de verlenging heeft ingestemd.


