  - number: 9a
    text: |-
      1 Degene aan wie een gasopslaginstallatie of een LNG-installatie toebehoort, wijst ten behoeve van de uitvoering
      van de taken, bedoeld in [artikel 10][ref1], een beheerder van die installatie aan.

      2 Met betrekking tot de aanwijzing van een beheerder als bedoeld in het eerste lid zijn van overeenkomstige
      toepassing:

      a. [artikel 2, negende lid][ref2] met dien verstande dat de periode van tien jaar wordt gerekend vanaf de dag
      waarop overeenkomstig [artikel 4, eerste lid][ref3], de aanwijzing aan Onze Minister is gemeld,

      b. [artikel 4, eerste lid][ref4],

      c. [artikel 5, eerste lid][ref5], met dien verstande dat de beheerder geen naamloze of besloten vennootschap hoeft
      te zijn, en

      d. [artikel 6, eerste tot en met derde lid][ref6], met dien verstande dat de beheerder geen naamloze of besloten
      vennootschap hoeft te zijn.


