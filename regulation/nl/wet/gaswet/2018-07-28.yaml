  - number: 1g
    text: |-
      1 In afwijking van [artikel 7, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1] en
      onverminderd artikel 7, derde lid, van die wet is de Autoriteit Consument en Markt bevoegd gegevens of inlichtingen
      te verstrekken aan het Agentschap, voor zover die gegevens of inlichtingen van betekenis kunnen zijn voor de
      uitoefening van de taak van het Agentschap.

      2 [Artikel 7, vierde lid, van de Instellingswet Autoriteit Consument en Markt][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel7
