  - number: 10b
    text: |-
      1 Het is de netbeheerder, niet zijnde de netbeheerder van het landelijk gastransportnet,
      of een rechtspersoon waarin de netbeheerder een deelneming heeft als bedoeld in
      [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref1], niet toegestaan goederen of diensten waarmee zij in
      concurrentie treden te leveren, tenzij het betreft het verrichten van werkzaamheden ten behoeve van:

      a. de uitvoering van de taken, bedoeld in de [artikelen 10][ref2], [10a][ref3], [42][ref4] en [54a][ref5] en
      [hoofdstuk 2][ref6] voor zichzelf, voor andere netbeheerders of voor anderen die een recht van gebruik op een
      gastransportnet hebben,

      b. de aanleg, het beheer of het onderhoud van leidingen buiten gebouwen voor het transport van elektriciteit of

      c. het ter beschikking stellen en houden van netten ten behoeve van het gebruik van daarmee verbonden zaken door
      derden,

      d. de aanleg, het beheer of het onderhoud van aansluitingen met een doorlaatwaarde groter dan 40 m3(n) per uur.

      2 Indien een netbeheerder, niet zijnde de netbeheerder van het landelijk gastransportnet, deel uitmaakt van een
      groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref7], is het deze groep niet toegestaan
      om handelingen of activiteiten te verrichten die strijdig kunnen zijn met het belang van het beheer van het
      desbetreffende net.

      3 Onder handelingen en activiteiten als bedoeld in het tweede lid worden in ieder geval verstaan:

      a. handelingen en activiteiten die niet op enigerlei wijze betrekking hebben op of verband houden met
      infrastructurele voorzieningen of aanverwante activiteiten,

      b. het door de netbeheerder verstrekken van zekerheden ten behoeve van de financiering van activiteiten van tot de
      groep behorende rechtspersonen of vennootschappen en

      c. het zich aansprakelijk stellen door de netbeheerder voor schulden van tot de groep behorende rechtspersonen
      of vennootschappen,

      tenzij het verstrekken van zekerheden of het zich aansprakelijk stellen voor schulden door de netbeheerder:

      1°. geschiedt ten behoeve van handelingen of activiteiten die de netbeheerder zelf zou mogen verrichten,

      2°. anderszins verband houdt met het netbeheer of

      3°. geschiedt om te voldoen aan voorwaarden in verband met de toepassing van wettelijke bepalingen.

      4 De statuten van de rechtspersonen die met een netbeheerder, niet zijnde de netbeheerder van het landelijk
      gastransportnet, in een groep zijn verbonden, behoeven de goedkeuring van Onze Minister voor zover het betreft de
      daarin opgenomen doelstellingen van die rechtspersonen.


