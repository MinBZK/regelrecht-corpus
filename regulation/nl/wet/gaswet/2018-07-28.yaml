  - number: 9b
    text: |-
      1 Een gasopslagbedrijf is onafhankelijk wat betreft de rechtsvorm, organisatie en besluitvorming van andere, niet
      met gastransport of gasopslag samenhangende activiteiten indien:

      a. een gasopslagbedrijf tevens producent of leverancier is of een producent of leverancier deel uitmaakt van de
      groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waarvan ook een gasopslagbedrijf
      deel uitmaakt en

      b. op een gasopslagbedrijf de verplichting, bedoeld in [artikel 18g, eerste lid][ref2], van toepassing is.

      2 Bij algemene maatregel van bestuur worden, ter implementatie van de richtlijn, nadere eisen gesteld aan de
      onafhankelijkheid van een gasopslagbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel18g
