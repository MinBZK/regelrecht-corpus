  - number: 1h
    text: |-
      1 Onze Minister kan van een gasbedrijf, een gasbeurs, een netgebruiker of een afnemer de gegevens en inlichtingen
      verlangen die hij nodig heeft voor de uitvoering van zijn taken op grond van deze wet of verordening 715/2009.

      2 Degene aan wie een verzoek is gedaan om gegevens en inlichtingen te verstrekken, is verplicht binnen de door
      Onze Minister gestelde redelijke termijn alle medewerking te verlenen die deze redelijkerwijs kan vorderen bij de
      uitoefening van zijn bevoegdheden.

      3 Gegevens of inlichtingen omtrent een gasbedrijf, een gasbeurs, een netgebruiker of een afnemer, welke door Onze
      Minister in verband met enige werkzaamheid ten behoeve van de uitvoering van deze wet of verordening 715/2009
      zijn verkregen, mogen uitsluitend voor de toepassing van deze wet, verordening 715/2009, verordening 713/2009, de
      [Mededingingswet][ref1], de [Elektriciteitswet 1998][ref2], de [Warmtewet][ref3] en de [artikelen 4.4][ref4] en
      [4.5 van de Wet handhaving consumentenbescherming][ref5] worden gebruikt.

      4 In afwijking van het derde lid is Onze Minister bevoegd bescheiden, gegevens of inlichtingen, bedoeld in het
      tweede lid, te verstrekken aan:

      a. een buitenlandse instelling, die op grond van nationale wettelijke regels is belast met de toepassing van de
      regels op het gebied van gas, voor zover die bescheiden, gegevens en inlichtingen van betekenis zijn of kunnen zijn
      voor de uitoefening van de taak van die instelling;

      b. een bestuursorgaan dat op grond van deze wet of van een andere wettelijke regeling dan deze wet is belast
      met taken die de toepassing of mede de toepassing van bepalingen op het gebied van gas betreffen, voor zover
      die bescheiden, gegevens of inlichtingen van betekenis kunnen zijn voor de uitoefening van de taak van dat
      bestuursorgaan;

      c. het Agentschap, voor zover die bescheiden, gegevens of inlichtingen van betekenis kunnen zijn voor de
      uitoefening van de taak van het Agentschap.

      5 Op basis van het vierde lid kunnen uitsluitend bescheiden, gegevens of inlichtingen worden verstrekt indien:

      a. de geheimhouding van de bescheiden, gegevens of inlichtingen in voldoende mate is gewaarborgd, en

      b. voldoende is gewaarborgd dat de bescheiden, gegevens of inlichtingen niet zullen worden gebruikt voor een ander
      doel dan waarvoor deze worden verstrekt.

      6 Indien Onze Minister op grond van [artikel 10a, eerste lid, onderdeel f][ref6], de netbeheerder van het landelijk
      gastransportnet opdraagt werkzaamheden te verrichten ter uitvoering van de taak, bedoeld in [artikel 52a][ref7],
      zijn het eerste tot en met derde lid van overeenkomstige toepassing op die netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
      [ref2]: https://wetten.overheid.nl/BWBR0009755
      [ref3]: https://wetten.overheid.nl/BWBR0033729
