  - number: '23'
    text: |-
      De Autoriteit Consument en Markt stelt de voorwaarden vast met inachtneming van:

      a. het voorstel als bedoeld in [artikel 22, eerste lid][ref1],

      b. de resultaten van het overleg, bedoeld in [artikel 22, tweede lid][ref2],

      c. de regels, bedoeld in [artikel 21][ref3], en

      d. [artikel 12f, eerste lid, onderdelen b tot en met f, en tweede lid][ref4].


