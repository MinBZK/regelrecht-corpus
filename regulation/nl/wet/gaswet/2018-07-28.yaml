  - number: 12f
    text: |-
      1 De Autoriteit Consument en Markt stelt de tariefstructuren en de voorwaarden vast met inachtneming van:

      a. het voorstel van de gezamenlijke netbeheerders als bedoeld in [artikel 12a][ref1], [12b][ref2] of [12c][ref3] en
      de resultaten van het overleg, bedoeld in [artikel 12d][ref4];

      b. het belang van het betrouwbaar, duurzaam, doelmatig en milieuhygiënisch verantwoord functioneren van de
      gasvoorziening;

      c. het belang van de ontwikkeling van het handelsverkeer op de gasmarkt;

      d. het belang van de bevordering van het doelmatig handelen van netgebruikers;

      e. het belang van een goede kwaliteit van dienstverlening van netbeheerders, en

      f. het belang van het op een objectieve, transparante en niet-discriminatoire wijze in evenwicht houden van het
      landelijk gastransportnet en op een wijze die de kosten weerspiegelt;

      g. de in [artikel 12][ref5] bedoelde regels;

      h. verordening 715/2009;

      i. de richtlijn.

      2 De Autoriteit Consument en Markt stelt de voorwaarden niet vast dan nadat zij zich ervan vergewist heeft dat de
      voorwaarden de interoperabiliteit van de netten garanderen en objectief, evenredig en niet-discriminatoir zijn,
      alsmede voor zover dat op grond van de notificatierichtlijn noodzakelijk is, aan de Europese Commissie in ontwerp
      zijn meegedeeld en de van toepassing zijnde termijnen, bedoeld in artikel 6 van Richtlijn (EU) nr. 2015/1535 van
      het Europees Parlement en de Raad van 9 september 2015 betreffende een informatie-procedure op het gebied van
      technische voorschriften en regels betreffende de diensten van de informatiemaatschappij (codificatie) (PbEU 2015,
      L 241) zijn verstreken.

      3 Indien een voorstel als bedoeld in [artikel 12a][ref6], [12b][ref7] of [12c][ref8] naar het oordeel van de
      Autoriteit Consument en Markt in strijd is met het belang, bedoeld in het eerste lid, onderdeel b, c, d, e of f,
      met de regels, bedoeld in het eerste lid, onderdelen g, h en i, of met de eisen, bedoeld in het tweede lid, draagt
      de Autoriteit Consument en Markt de gezamenlijke netbeheerders op het voorstel onverwijld zodanig te wijzigen
      dat deze strijd wordt opgeheven. [Artikel 4:15 van de Algemene wet bestuursrecht][ref9] is van overeenkomstige
      toepassing.

      4 Indien de gezamenlijke netbeheerders niet binnen vier weken het voorstel wijzigen overeenkomstig de opdracht
      van de Autoriteit Consument en Markt, bedoeld in het derde lid, stelt de Autoriteit Consument en Markt de
      tariefstructuren of de voorwaarden vast onder het aanbrengen van zodanige wijzigingen dat deze in overeenstemming
      zijn met de belangen, bedoeld in het eerste lid, onderdelen b tot en met f, met de regels, bedoeld in het eerste
      lid, onderdelen g, h en i, en met de eisen, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
