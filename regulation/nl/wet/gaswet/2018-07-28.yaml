  - number: 13e
    text: |-
      1 Een netbeheerder heeft in het kader van het beheer van zijn netten tot taak ervoor zorg te dragen dat in
      een bij algemene maatregel van bestuur te bepalen periode, een bij algemene maatregel van bestuur te bepalen
      percentage afnemers als bedoeld in [artikel 43, eerste lid][ref1], de beschikking krijgt over een geïnstalleerde
      meetinrichting die ten minste voldoet aan de krachtens [artikel 42a, eerste lid][ref2], gestelde eisen, tenzij die
      afnemer blijkens de voorwaarden, bedoeld in [artikel 12b, eerste lid, onderdelen a of b][ref3], beschikt over een
      onbemeten aansluiting.

      2 In aanvulling op het eerste lid heeft een netbeheerder tot taak ervoor zorg te dragen dat een afnemer als bedoeld
      in [artikel 43, eerste lid][ref4], binnen een redelijke termijn een meetinrichting ter beschikking wordt gesteld
      die ten minste voldoet aan de krachtens [artikel 42a][ref5] gestelde eisen, wanneer:

      a. een bestaande meetinrichting wordt vervangen, tenzij dit technisch onmogelijk is of niet efficiënt is in
      verhouding tot de geraamde potentiële energiebesparingen op lange termijn;

      b. een nieuwe aansluiting wordt gemaakt in een nieuw gebouw;

      c. een gebouw ingrijpend wordt gerenoveerd.

      3 Bij algemene maatregel van bestuur kunnen in aanvulling op het tweede lid andere situaties worden
      bepaald waarin een netbeheerder tot taak heeft ervoor zorg te dragen dat een afnemer als bedoeld in
      [artikel 43, eerste lid][ref6], binnen een redelijke termijn een meetinrichting ter beschikking wordt gesteld die
      ten minste voldoet aan de krachtens [artikel 42a, eerste lid][ref7], gestelde eisen.

      4 Een netbeheerder draagt er zorg voor dat een afnemer als bedoeld in [artikel 43, eerste lid][ref8], op een
      eerder tijdstip dan het door de netbeheerder op grond van het eerste lid voorziene tijdstip, voor een of meer
      aansluitingen op verzoek van een natuurlijke persoon of rechtspersoon die daarbij belang heeft, binnen een
      redelijke termijn een meetinrichting ter beschikking wordt gesteld die ten minste voldoet aan de krachtens
      [artikel 42a, eerste lid][ref9], gestelde eisen, tenzij dit ertoe leidt dat de planning die de netbeheerder
      hanteert om te voldoen aan de in het eerste lid bedoelde verplichting, niet wordt gehaald.

      5 Indien een meetinrichting door de netbeheerder ter beschikking is gesteld ingevolge het derde of vierde lid en
      de ter beschikking gestelde meetinrichting is geïnstalleerd, is de desbetreffende afnemer aan de desbetreffende
      netbeheerder een vergoeding verschuldigd in verband met de meerkosten.

      6 Bij ministeriële regeling wordt de hoogte van de vergoeding vastgesteld die voor verschillende situaties
      verschillend kan worden vastgesteld.

      7 Gedurende de in het eerste lid bedoelde periode kan een ander dan een netbeheerder op verzoek van een afnemer
      als bedoeld in [artikel 43, eerste lid][ref10], er na voorafgaande melding aan de betreffende netbeheerder voor
      zorgdragen dat die afnemer voor een of meer aansluitingen beschikt over een geïnstalleerde meetinrichting die ten
      minste voldoet aan de krachtens [artikel 42a, eerste lid][ref11], gestelde eisen die gelden op het tijdstip van
      terbeschikkingstelling.

      8 Indien een ander dan een netbeheerder er zorg voor draagt dat een afnemer als bedoeld in
      [artikel 43, eerste lid][ref12], beschikt over een meetinrichting die ten minste voldoet aan de krachtens
      [artikel 42a][ref13] gestelde eisen, betaalt de betreffende netbeheerder aan die ander een vergoeding.

      9 Bij ministeriële regeling wordt de hoogte van de vergoeding als bedoeld in het achtste lid vastgesteld, die voor
      verschillende situaties verschillend kan worden vastgesteld.

      10 Het is anderen dan de netbeheerder niet toegestaan bij afnemers als bedoeld in [artikel 43, eerste lid][ref14],
      geïnstalleerde, op afstand uitleesbare meetinrichtingen te vervangen die geïnstalleerd zijn tussen 31 december 2005
      en het tijdstip waarop de in het eerste lid bedoelde periode aanvangt.

      11 Indien een op afstand uitleesbare meetinrichting door de netbeheerder ter beschikking wordt gesteld, kan een
      afnemer als bedoeld in [artikel 43, eerste lid][ref15], deze meetinrichting weigeren. In dat geval wordt door de
      netbeheerder een niet op afstand uitleesbare meetinrichting ter beschikking gesteld.

      12 In aanvulling op [artikel 81e, eerste lid][ref16], kan het tarief voor de meting van gas mede betrekking hebben
      op de mate waarin een netbeheerder voortgang boekt bij de uitvoering van de verplichting, bedoeld in het eerste
      lid, en alsdan verschillen per netbeheerder.

      13 Een netbeheerder zendt jaarlijks vóór 1 juni een rapportage aan Onze Minister en de Autoriteit Consument en
      Markt waarin hij aangeeft welke voortgang is geboekt met de uitvoering van de taak, bedoeld in het eerste lid.

      14 Degene die een meetinrichting als bedoeld in [artikel 42a, eerste lid][ref17], ter beschikking stelt, informeert
      een afnemer als bedoeld in [artikel 43, eerste lid][ref18], bij de installatie op niet-discriminatoire wijze over
      de mogelijkheden van de meetinrichting.


