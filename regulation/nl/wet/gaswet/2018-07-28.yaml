  - number: 12c
    text: |-
      1 De netbeheerder van het landelijk gastransportnet of ten minste een derde van het aantal overige netbeheerders
      kan de gezamenlijke netbeheerders verzoeken met inachtneming van de in [artikel 12][ref1] bedoelde regels een
      voorstel te doen tot wijziging van de tariefstructuren of de voorwaarden bedoeld in de [artikelen 12a][ref2] en
      [12b][ref3] onder opgave van de redenen die naar zijn oordeel een dergelijke wijziging noodzakelijk maken.

      2 Indien naar haar oordeel wijziging van de tariefstructuren of de voorwaarden bedoeld in de [artikelen 12a][ref4]
      en [12b][ref5] noodzakelijk is, zendt de Autoriteit Consument en Markt met inachtneming van de in
      [artikel 12][ref6] bedoelde regels een ontwerp van het besluit tot wijziging van de tariefstructuren of de
      voorwaarden aan de gezamenlijke netbeheerders en de representatieve organisaties van netgebruikers.

      3 In een voorstel of een ontwerp van een besluit tot wijziging van de tariefstructuren of de voorwaarden worden die
      onderdelen bedoeld in [artikel 12a][ref7] of [12b][ref8] opgenomen waarvan wijziging wordt verzocht.


