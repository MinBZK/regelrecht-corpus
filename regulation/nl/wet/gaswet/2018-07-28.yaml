  - number: 66a
    text: |-
      Indien dat noodzakelijk is in het belang van een voldoende transparante en liquide markt voor vraag en aanbod van
      gas, transportcapaciteit, opslagcapaciteit of productiecapaciteit of in het belang van de daarmee verband houdende
      leveringszekerheid, zullen bij of krachtens algemene maatregel van bestuur regels worden gesteld over:

      a. de wijze waarop of de voorwaarden waaronder producenten, gasopslagbedrijven, LNG-bedrijven, handelaren,
      leveranciers of netbeheerders gas, transportcapaciteit, opslagcapaciteit of productiecapaciteit waarover zij
      beschikken, aanbieden;

      b. de informatie die producenten, gasopslagbedrijven, LNG-bedrijven, handelaren, leveranciers of netbeheerders
      verstrekken met betrekking tot de vraag en aanbod van gas, transportcapaciteit, opslagcapaciteit of
      productiecapaciteit.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel66a
  - number: 66b
    text: |-
      1 Onze Minister wijst een of meer rechtspersonen aan die tot taak hebben een beurs tot stand te brengen en in stand
      te houden. Onze Minister kan regels stellen met betrekking tot de procedure voor aanwijzing van een beurs. Aan een
      aanwijzing kunnen voorschriften en beperkingen worden verbonden.

      2 Een rechtspersoon, bedoeld in het eerste lid, stelt een beursreglement op. Het beursreglement behoeft de
      goedkeuring van Onze Minister. Van het besluit tot goedkeuring wordt mededeling gedaan in de Staatscourant.

      3 De netbeheerder van het landelijk gastransportnet is verplicht aan de rechtspersoon, bedoeld in het eerste lid,
      en aan de door deze rechtspersoon ingeschakelde derden, voor zover het betreft de afhandeling van de op de beurs
      op tot stand gekomen overeenkomsten, de gevraagde medewerking te verlenen, voor zover deze medewerking noodzakelijk
      is voor een goede uitvoering van de aan deze rechtspersoon opgelegde taak. Onze Minister kan nadere regels stellen
      over de door de netbeheerder van het landelijk gastransportnet te verlenen medewerking.

      4 De rechtspersoon, bedoeld in het eerste lid, die bij de uitvoering van zijn taak de beschikking krijgt
      over gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, is verplicht tot
      geheimhouding van die gegevens, behoudens voor zover de artikelen van deze wet hem tot mededeling verplichten of
      uit zijn taak de noodzaak tot mededeling voortvloeit.

      5 Producenten, leveranciers, handelaren, gasopslagbedrijven, LNG-bedrijven, afnemers en aandeelhouders onthouden
      zich van elke bemoeiing met de uitvoering van de taak die is opgedragen aan de rechtspersoon, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel66b
  - number: 66c
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de voorwaarden die leveranciers hanteren ten opzichte
      van vergunninghouders. Deze regels kunnen betrekking hebben op de zekerheden die worden gevraagd voor de levering
      van gas aan vergunninghouders.
    url: https://wetten.overheid.nl/BWBR0011440/2018-07-28#Artikel66c
  - number: 66d
    text: |-
      1 Indien een verkoper van gas een overeenkomst aan een koper van gas aanbiedt met betrekking tot gas, niet zijnde
      op het gastransportnet in te voeden gas:

      a. worden de overname van de programmaverantwoordelijkheid en de verkoop van gas separaat aangeboden;

      b. is het de verkoper van gas niet toegestaan te eisen dat de koper van gas de programmaverantwoordelijkheid
      overdraagt;

      c. is het de verkoper van gas niet toegestaan tarieven en voorwaarden te stellen waardoor het aannemelijk is dat de
      koper van gas, gelet op de voorwaarden en tarieven waaronder de koper van gas een overeenkomst zou kunnen sluiten
      zonder de programmaverantwoordelijkheid over te dragen, zal kiezen de programmaverantwoordelijkheid aan de verkoper
      van gas over te dragen.

      2 Het eerste lid, onderdeel b, is niet van toepassing indien de koper van gas met de verkoper van gas is
      overeengekomen dat de hoeveelheid te kopen gas bepaald wordt door de feitelijke onttrekking van gas aan het
      gastransportnet op één of meer aansluitingen.

      3 Indien een koper van gas een overeenkomst aan een verkoper van gas aanbiedt met betrekking tot op het
      gastransportnet in te voeden gas:

      a. worden de overname van de programmaverantwoordelijkheid en de koop van gas separaat aangeboden;

      b. is het de koper van gas niet toegestaan te eisen dat de verkoper van gas de programmaverantwoordelijkheid
      overdraagt;

      c. is het de koper van gas niet toegestaan tarieven en voorwaarden te hanteren waardoor het aannemelijk is dat de
      verkoper van gas, gelet op de voorwaarden en tarieven waaronder de verkoper van gas een overeenkomst zou kunnen
      sluiten zonder de programmaverantwoordelijkheid over te dragen, zal kiezen de programmaverantwoordelijkheid aan de
      koper van gas over te dragen.

      4 Het derde lid, onderdeel b, is niet van toepassing indien er sprake is van afname van gas ter uitvoering van de
      taak, bedoeld in [artikel 54, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel54
