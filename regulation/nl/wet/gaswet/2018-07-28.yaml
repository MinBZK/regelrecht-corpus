  - number: '82'
    text: |-
      1 In afwijking van [artikel 80][ref1] worden de tarieven ter uitvoering van de taken door de netbeheerder van het
      landelijk gastransportnet, genoemd in de [artikelen 10][ref2] en [10a, eerste lid, onderdeel b, c, d en e][ref3],
      alsmede de tarieven voor de transport ondersteunende diensten vastgesteld overeenkomstig dit artikel.

      2 Voor de taken van de netbeheerder van het landelijk gastransportnet, bedoeld in het eerste lid, stelt de
      Autoriteit Consument en Markt de methode van regulering vast, voor een periode van ten minste drie en ten
      hoogste vijf jaar, na overleg met de gezamenlijke netbeheerders en met representatieve organisaties van
      partijen op de gasmarkt, met inachtneming van het belang dat de doelmatigheid van de bedrijfsvoering en de meest
      doelmatige kwaliteit van de uitvoering van deze taken worden bevorderd en rekening houdend met het belang van
      voorzieningszekerheid, duurzaamheid en een redelijk rendement op investeringen.

      3 De netbeheerder van het landelijk gastransportnet zendt jaarlijks voor 1 september aan de Autoriteit Consument en
      Markt een voorstel voor de tarieven voor uitvoering van de taken genoemd in de [artikelen 10][ref4] en [10a][ref5],
      met inachtneming van de tariefstructuren vastgesteld op grond van [artikel 12f][ref6] of [12g][ref7] en met
      inachtneming van de gemaakte kosten voor investeringen, bedoeld in [artikel 39e][ref8], [39f, derde lid][ref9], of
      [54a, derde lid][ref10], voor zover deze kosten doelmatig zijn.

      4 De Autoriteit Consument en Markt stelt na overleg met de gezamenlijke netbeheerders en met representatieve
      organisaties een doelmatigheidskorting vast. Dit besluit geldt voor dezelfde periode als het besluit op grond van
      het tweede lid. De doelmatigheidskorting heeft tot doel om een doelmatige bedrijfsvoering te bevorderen.

      5 De Autoriteit Consument en Markt stelt jaarlijks de tarieven vast die kunnen verschillen voor de onderscheiden
      tariefdragers.

      6 Indien een voorstel niet binnen de termijn, bedoeld in het derde lid, aan de Autoriteit Consument en Markt is
      gezonden stelt deze de tarieven uit eigen beweging vast met inachtneming van dit artikel.

      7 De vastgestelde tarieven treden in werking op een door de Autoriteit Consument en Markt te bepalen datum en
      gelden tot de datum van inwerkingtreding van het besluit tot vaststelling van de tarieven voor het volgende jaar.

      8 [Artikel 81c, tweede en vijfde lid][ref11], zijn van overeenkomstige toepassing.

      9 De netbeheerder van het landelijk gastransportnet publiceert de voor hem geldende tarieven op een geschikte
      wijze. Tevens legt de netbeheerder van het landelijk gastransportnet de voor hem geldende tarieven voor een ieder
      ter inzage in al zijn vestigingen.

      10 De Autoriteit Consument en Markt stelt een beleidsregel vast betreffende de beoordeling van doelmatigheid,
      bedoeld in het derde lid.

      11 Het derde tot en met negende lid is niet van toepassing op de taak van de netbeheerder van het landelijk
      gastransportnet, bedoeld in [artikel 10, eerste lid][ref12], voor zover:

      a. die taak betrekking heeft op het transport van gas dat de landsgrens overschrijdt, en

      b. de toedeling van die transportcapaciteit plaatsvindt door middel van een veiling of een andere marktconforme
      methode.

      12 De Autoriteit Consument en Markt houdt bij het vaststellen van de methode van regulering van de tarieven
      rekening met de opbrengsten uit een veiling of een andere marktconforme methode.

      13 Het derde tot en met negende lid is niet van toepassing op de taak van de netbeheerder van het landelijk
      gastransportnet, bedoeld in [artikel 10a, eerste lid, onderdeel p][ref13]. De Autoriteit Consument en Markt houdt
      bij het vaststellen van de methode van regulering van de tarieven rekening met de opbrengsten uit de taak van de
      netbeheerder van het landelijk gastransportnet, bedoeld in artikel 10a, eerste lid, onderdeel p.


