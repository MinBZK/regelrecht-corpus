  - number: 12d
    text: |-
      1 De gezamenlijke netbeheerders voeren overleg met representatieve organisaties van netgebruikers op de gasmarkt
      over de voorstellen met betrekking tot de tariefstructuren en de voorwaarden, bedoeld in de [artikelen 12a][ref1],
      [12b][ref2] en [12c, eerste lid][ref3].

      2 In de voorstellen die aan de Autoriteit Consument en Markt worden gezonden, geven de gezamenlijke netbeheerders
      aan welke gevolgtrekkingen zij hebben verbonden aan de zienswijzen die de organisaties, bedoeld in het eerste lid,
      naar voren hebben gebracht.


