  - number: 81b
    text: |-
      1 Iedere netbeheerder die het transport van gas verricht dat bestemd is voor levering aan afnemers zendt jaarlijks
      voor 1 oktober aan de Autoriteit Consument en Markt een voorstel voor de tarieven die deze netbeheerder ten
      hoogste zal berekenen voor het transport van gas aan die afnemers en de dat transport ondersteunende diensten, met
      inachtneming van:

      a. het uitgangspunt dat de kosten worden toegerekend aan de tariefdragers betreffende de diensten die deze kosten
      veroorzaken,

      b. de tariefstructuren vastgesteld op grond van [artikel 12f][ref1] of [12g][ref2],

      c. het bepaalde bij of krachtens [artikel 81a][ref3],

      d. de formule:

      waarbij

      TI = de totale inkomsten uit de tarieven uit het jaar t, te weten de som van de vermenigvuldiging van elk tarief
      in het jaar t en het op basis van [artikel 81a, onderdeel c][ref4], vastgestelde rekenvolume van elke tariefdrager
      waarvoor een tarief wordt vastgesteld;

      TI = de totale inkomsten uit de tarieven in het jaar voorafgaande aan het jaar t, te weten de som van de
      vermenigvuldiging van elk tarief in het jaar t-1 en het op basis van [artikel 81a, onderdeel c][ref5], vastgestelde
      rekenvolume van elke tariefdrager waarvoor een tarief wordt vastgesteld;

      cpi = de relatieve wijziging van de consumentenprijsindex (alle huishoudens), berekend uit het quotiënt van deze
      prijsindex, gepubliceerd in de vierde maand voorafgaande aan het jaar t, en van deze prijsindex, gepubliceerd in de
      zestiende maand voorafgaande aan het jaar t, zoals deze maandelijks wordt vastgesteld door het Centraal Bureau voor
      de Statistiek;

      x = de korting ter bevordering van de doelmatige bedrijfsvoering;

      q = de kwaliteitsterm, die de aanpassing van de tarieven in verband met de geleverde kwaliteit aangeeft en

      e. de gemaakte kosten voor investeringen, bedoeld in [artikel 39e][ref6] of [39f, tweede lid][ref7], voor zover
      deze kosten doelmatig zijn;

      f. het totaal van de gemaakte kosten voor een verwerving van een bestaand net waarvoor nog niet eerder een
      netbeheerder was aangewezen door of met instemming van Onze Minister en voor de investeringen tot aanpassing van
      dat verworven net waardoor aan de bij en krachtens deze wet daaraan gestelde eisen wordt voldaan, voor zover deze
      kosten doelmatig zijn.

      2 De Autoriteit Consument en Markt stelt een beleidsregel vast betreffende de beoordeling van doelmatigheid,
      bedoeld in het eerste lid, onder e en f.


