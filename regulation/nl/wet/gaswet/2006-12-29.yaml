  - number: '59.3'
    text: Een besluit als bedoeld in het eerste of tweede lid wordt in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel59
  - number: '60.1'
    text: |-
      De werkzaamheden in verband met de uitvoering van [artikel 19, eerste en tweede lid][ref1], worden verricht door
      personen die niet betrokken zijn bij werkzaamheden op grond van [hoofdstuk 2, paragrafen 2.2][ref2] en [2.3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60
    references:
      - id: ref1
