      - id: ref3
        bwb_id: BWBR0011440
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '60.2'
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan bindende aanwijzingen geven in verband met de naleving van
      het bepaalde bij of krachtens deze wet en van de verordening. Van de beschikking wordt mededeling gedaan in de
      Staatscourant. Gegevens die ingevolge [artikel 10 van de Wet openbaarheid van bestuur][ref1] niet voor verstrekking
      in aanmerking komen, worden niet ter inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 60a
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60a
  - number: 60a.a
    text: 'last onder dwangsom: de sanctie, inhoudende:'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60a
  - number: 60a.a.1º
    text: een last tot herstel van de overtreding, en
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60a
  - number: 60a.a.2º
    text: de verplichting tot betaling van een geldsom onder de opschortende voorwaarde dat de last niet wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60a
  - number: 60a.b
    text: |-
      bestuurlijke boete: de sanctie, inhoudende een onvoorwaardelijke verplichting tot betaling van een geldsom, die is
      gericht op bestraffing van de overtreder;
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60a
  - number: 60a.c
    text: 'overtreding: een gedraging die in strijd is met het bepaalde bij of krachtens enig wettelijk voorschrift.'
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60a
  - number: 60ac.1
    text: |-
      De raad van bestuur van de mededingingsautoriteit kan in geval van overtreding van het bepaalde bij of krachtens
      deze wet, met uitzondering van de [artikelen 5][ref1], [9, eerste lid][ref2], [43 tot en met 46][ref3],
      [54, eerste lid][ref4], [54a, eerste lid][ref5], en [artikel 55, tweede en derde lid][ref6], en van de verordening
      de overtreder een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0011440#Artikel54
      [ref5]: https://wetten.overheid.nl/BWBR0011440#Artikel54a
      [ref6]: https://wetten.overheid.nl/BWBR0011440#Artikel55
    url: https://wetten.overheid.nl/BWBR0011440/2006-12-29#Artikel60ac
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: '9'
        hoofdstuk: '1'
        paragraaf: '1.2'
